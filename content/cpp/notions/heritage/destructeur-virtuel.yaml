notion: destructeur-virtuel
lesson: |-
  Quand on détruit un objet dérivé **à travers un pointeur vers sa classe de base**, quel destructeur est appelé ?
  Comme pour toute fonction : sans `virtual`, celui du type **statique**, donc celui de la base.

  ```cpp
  class Base {
  public:
      ~Base() { std::println("~Base"); }            // non virtuel
  };

  class Derivee : public Base {
  public:
      ~Derivee() { std::println("~Derivee"); }
  };

  Base* p = new Derivee;
  delete p;        // comportement indéfini : en pratique, seul ~Base s'exécute
  ```

  La norme dit que c'est un **comportement indéfini**. En pratique, le destructeur de la dérivée n'est pas appelé :
  ce qu'elle possède (mémoire, fichier, verrou) **n'est jamais libéré**.

  **Le remède** : un **destructeur virtuel** dans la classe de base.

  ```cpp
  class Base {
  public:
      virtual ~Base() = default;
  };
  ```

  Avec lui, `delete p;` appelle d'abord `~Derivee`, puis `~Base` : la destruction complète, dans le bon ordre. Il
  n'est pas nécessaire de le répéter dans les dérivées : leur destructeur est virtuel d'office.

  **La règle.** Toute classe qui a **au moins une fonction virtuelle** a un **destructeur virtuel**. Elle est faite
  pour être manipulée par un pointeur vers la base : elle sera détruite par lui. Cela vaut pour
  `std::unique_ptr<Base>`, qui fait un `delete` sur un `Base*`.

  **Quand il est inutile.** Une classe qui n'est pas une base polymorphe (un `Point`, un `Compte`) n'en a pas besoin :
  il ajouterait un pointeur de vtable à chaque objet. Et pour un objet dérivé créé comme **variable locale**, le
  compilateur connaît son vrai type : les deux destructeurs sont appelés, virtuel ou pas.

  `-Wall` signale un `delete` sur une base polymorphe sans destructeur virtuel (`-Wdelete-non-virtual-dtor`).

  **En entretien** : « Une classe de base polymorphe doit avoir un destructeur virtuel. Sinon, détruire un dérivé
  par un pointeur vers la base est un comportement indéfini : le destructeur du dérivé n'est pas appelé, et ses
  ressources fuient. »
cards:
  - key: le-probleme
    format: course
    question: "Que se passe-t-il quand on fait `delete` sur un pointeur vers la base, qui désigne un objet dérivé, si le destructeur de la base n'est pas virtuel ?"
    choices:
      - {text: "C'est un comportement indéfini : en pratique, le destructeur du dérivé n'est pas appelé", correct: true}
      - {text: "Les deux destructeurs sont appelés, celui du dérivé puis celui de la base", correct: false}
      - {text: "Le code ne compile pas : la base doit avoir un destructeur virtuel", correct: false}
      - {text: "Seul le destructeur du dérivé est appelé, et la partie héritée fuit", correct: false}
    answer: "Sans `virtual`, l'appel se décide sur le type du pointeur : la base. La partie dérivée n'est pas détruite, et ce qu'elle possédait fuit."
  - key: le-remede
    format: course
    question: "Que change un destructeur virtuel dans la classe de base ?"
    choices:
      - {text: "`delete` appelle le destructeur de la classe réelle, puis ceux de ses bases", correct: true}
      - {text: "`delete` n'appelle plus que le destructeur de la classe de base", correct: false}
      - {text: "`delete` devient inutile : l'objet se détruit seul", correct: false}
      - {text: "`delete` met le pointeur à `nullptr` après la destruction", correct: false}
    answer: "Le destructeur est choisi par la vtable, comme toute fonction virtuelle : celui du dérivé s'exécute d'abord, puis la chaîne remonte jusqu'à la base."
  - key: la-regle
    format: course
    question: "Quelle classe doit avoir un destructeur virtuel ?"
    choices:
      - {text: "Toute classe qui a au moins une fonction virtuelle", correct: true}
      - {text: "Toute classe, sans exception", correct: false}
      - {text: "Toute classe qui a un membre pointeur", correct: false}
      - {text: "Toute classe dérivée, mais pas les classes de base", correct: false}
    answer: "Une classe à fonctions virtuelles est faite pour être manipulée par un pointeur vers la base, donc détruite par lui. Les autres classes n'en ont pas besoin."
  - key: variable-locale
    format: course
    question: "Un objet dérivé est créé comme variable locale. Faut-il un destructeur virtuel pour que sa destruction soit complète ?"
    choices:
      - {text: "Non : le compilateur connaît sa classe réelle, et appelle les deux destructeurs", correct: true}
      - {text: "Oui : sans lui, seul le destructeur de la base est appelé", correct: false}
      - {text: "Oui : sans lui, aucun destructeur n'est appelé", correct: false}
      - {text: "Non : une variable locale n'a pas de destructeur", correct: false}
    answer: "Le problème ne se pose que lorsqu'on détruit par un pointeur vers la base, c'est-à-dire quand le type statique diffère du type réel."
  - key: vf-unique-ptr
    format: true-false
    question: "Un `std::unique_ptr<Base>` qui possède un objet dérivé a besoin que `Base` ait un destructeur virtuel."
    truth: true
    answer: "Il fait `delete` sur un `Base*` : le même problème qu'avec un `delete` écrit à la main."
  - key: vf-toutes-les-classes
    format: true-false
    question: Il faut donner un destructeur virtuel à toutes les classes, par précaution.
    truth: false
    answer: Il ajoute un pointeur de vtable à chaque objet. On le réserve aux classes de base polymorphes.
  - key: vf-derivees
    format: true-false
    question: "Si le destructeur de la base est virtuel, celui des classes dérivées l'est aussi, sans l'écrire."
    truth: true
    answer: Comme toute fonction virtuelle, il le reste dans la hiérarchie.
  - key: vf-defaut
    format: true-false
    question: "`virtual ~Base() = default;` suffit à rendre le destructeur virtuel, sans écrire de corps."
    truth: true
    answer: "`= default` garde le comportement généré, et `virtual` le rend virtuel."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle ligne donne à la classe `Forme` un destructeur virtuel, sans rien y faire de particulier ?"
    choices:
      - {text: "`virtual ~Forme() = default;`", correct: true}
      - {text: "`~Forme() = virtual;`", correct: false}
      - {text: "`virtual Forme() = default;`", correct: false}
      - {text: "`~Forme() override;`", correct: false}
    answer: "`virtual` devant, le tilde, et `= default` pour garder le comportement généré."
  - key: qcm-avertissement
    format: multiple-choice
    question: "Quel avertissement de GCC signale un `delete` sur une base polymorphe sans destructeur virtuel ?"
    choices:
      - {text: "`-Wdelete-non-virtual-dtor`", correct: true}
      - {text: "`-Wshadow`", correct: false}
      - {text: "`-Wreorder`", correct: false}
      - {text: "`-Wsign-compare`", correct: false}
    answer: "`-Wdelete-non-virtual-dtor`, activé par `-Wall`."
  - key: qcm-consequence
    format: multiple-choice
    question: "Une classe dérivée ouvre un fichier, fermé dans son destructeur. Elle est détruite par un pointeur vers une base sans destructeur virtuel. Que devient le fichier ?"
    choices:
      - {text: "Il reste ouvert : le destructeur du dérivé n'est pas appelé", correct: true}
      - {text: "Il est fermé deux fois : par le dérivé, puis par la base", correct: false}
      - {text: "Il est fermé par le destructeur de la base", correct: false}
      - {text: "Il est fermé par le système au moment du `delete`", correct: false}
    answer: "Tout ce que le destructeur du dérivé devait libérer fuit. La base ne connaît pas le fichier."
  - key: qcm-ordre
    format: multiple-choice
    question: "Avec un destructeur virtuel, dans quel ordre s'exécutent les destructeurs lors d'un `delete` par un pointeur vers la base ?"
    choices:
      - {text: "Celui du dérivé, puis celui de la base", correct: true}
      - {text: "Celui de la base, puis celui du dérivé", correct: false}
      - {text: "Celui du dérivé seulement", correct: false}
      - {text: "Celui de la base seulement", correct: false}
    answer: "L'ordre habituel de la destruction : de la dérivée vers la base."
  - key: code-virtuel
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Base {
      public:
          virtual ~Base() { std::println("~Base"); }
      };

      class Derivee : public Base {
      public:
          ~Derivee() override { std::println("~Derivee"); }
      };

      int main() {
          Base* p = new Derivee;
          delete p;
      }
      ```
    choices:
      - text: |-
          ```
          ~Derivee
          ~Base
          ```
        correct: true
      - {text: "`~Base`", correct: false}
      - text: |-
          ```
          ~Base
          ~Derivee
          ```
        correct: false
      - {text: "`~Derivee`", correct: false}
    answer: |-
      ```
      ~Derivee
      ~Base
      ```
      Le destructeur est virtuel : `delete p;` appelle celui de la classe réelle, puis celui de la base.
    check:
      output: |-
        ~Derivee
        ~Base
  - key: code-non-virtuel
    format: code-output
    question: |-
      Que garantit le langage sur ce qu'affiche ce programme ?
      ```cpp
      #include <print>

      class Base {
      public:
          ~Base() { std::println("~Base"); }
      };

      class Derivee : public Base {
      public:
          ~Derivee() { std::println("~Derivee"); }
      };

      int main() {
          Base* p = new Derivee;
          delete p;
      }
      ```
    choices:
      - {text: "Rien : c'est un comportement indéfini", correct: true}
      - {text: "Qu'il affiche `~Derivee`, puis `~Base`", correct: false}
      - {text: "Qu'il affiche `~Base` seulement", correct: false}
      - {text: "Qu'il ne compile pas", correct: false}
    answer: |-
      Rien. Détruire un objet dérivé par un pointeur vers une base sans destructeur virtuel est un comportement
      indéfini. En pratique, seul `~Base` s'affiche : la partie dérivée n'est pas détruite.
    unverifiable: delete par un pointeur vers une base sans destructeur virtuel est un comportement indéfini
  - key: code-unique-ptr
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      class Forme {
      public:
          virtual ~Forme() { std::println("~Forme"); }
      };

      class Carre : public Forme {
      public:
          ~Carre() override { std::println("~Carre"); }
      };

      int main() {
          std::unique_ptr<Forme> forme = std::make_unique<Carre>();
          std::println("fin");
      }
      ```
    choices:
      - text: |-
          ```
          fin
          ~Carre
          ~Forme
          ```
        correct: true
      - text: |-
          ```
          fin
          ~Forme
          ```
        correct: false
      - text: |-
          ```
          ~Carre
          ~Forme
          fin
          ```
        correct: false
      - text: |-
          ```
          fin
          ~Forme
          ~Carre
          ```
        correct: false
    answer: |-
      ```
      fin
      ~Carre
      ~Forme
      ```
      À la fin de `main`, le `std::unique_ptr<Forme>` détruit l'objet. Le destructeur virtuel fait appeler celui de
      `Carre`, puis celui de `Forme`.
    check:
      output: |-
        fin
        ~Carre
        ~Forme
  - key: code-variable-locale
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Base {
      public:
          ~Base() { std::println("~Base"); }
      };

      class Derivee : public Base {
      public:
          ~Derivee() { std::println("~Derivee"); }
      };

      int main() {
          Derivee objet;
      }
      ```
    choices:
      - text: |-
          ```
          ~Derivee
          ~Base
          ```
        correct: true
      - {text: "`~Base`", correct: false}
      - {text: "`~Derivee`", correct: false}
      - text: |-
          ```
          ~Base
          ~Derivee
          ```
        correct: false
    answer: |-
      ```
      ~Derivee
      ~Base
      ```
      `objet` est une variable locale de type `Derivee` : le compilateur connaît sa classe, et appelle les deux
      destructeurs, sans avoir besoin de `virtual`.
    check:
      output: |-
        ~Derivee
        ~Base
  - key: bug-destructeur-non-virtuel
    format: bug-fix
    question: |-
      Ce programme n'affiche jamais `fermeture du fichier`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Journal {
      public:
          ~Journal() { std::println("fin du journal"); }
      };

      class JournalFichier : public Journal {
      public:
          ~JournalFichier() { std::println("fermeture du fichier"); }
      };

      int main() {
          Journal* journal = new JournalFichier;
          delete journal;
      }
      ```
    choices:
      - {text: "Déclarer le destructeur de `Journal` avec `virtual`", correct: true}
      - {text: "Déclarer le destructeur de `JournalFichier` avec `virtual` seulement", correct: false}
      - {text: "Appeler `delete journal;` deux fois de suite", correct: false}
      - {text: "Retirer le destructeur de la classe `Journal`", correct: false}
    answer: |-
      ```cpp
      virtual ~Journal() { std::println("fin du journal"); }
      ```
      Le `delete` passe par un `Journal*` : sans destructeur virtuel dans la base, celui de `JournalFichier` n'est pas
      appelé. `virtual` dans la dérivée seule ne change rien : c'est la base qui décide.
  - key: bug-unique-ptr
    format: bug-fix
    question: |-
      Le tampon de `Image` n'est jamais libéré : ce programme n'affiche pas `tampon libéré`. Pourquoi ?
      ```cpp
      #include <memory>
      #include <print>

      class Ressource {
      public:
          virtual void charger() {}
      };

      class Image : public Ressource {
      public:
          ~Image() { std::println("tampon libéré"); }
      };

      int main() {
          std::unique_ptr<Ressource> ressource = std::make_unique<Image>();
          ressource->charger();
      }
      ```
    choices:
      - {text: "`Ressource` a une fonction virtuelle, mais pas de destructeur virtuel", correct: true}
      - {text: "Un `std::unique_ptr` ne détruit jamais l'objet qu'il possède", correct: false}
      - {text: "`std::make_unique<Image>()` crée une `Ressource`, pas une `Image`", correct: false}
      - {text: "Le destructeur d'`Image` devrait être déclaré dans la section `private:`", correct: false}
    answer: |-
      ```cpp
      class Ressource {
      public:
          virtual ~Ressource() = default;
          virtual void charger() {}
      };
      ```
      Le `std::unique_ptr<Ressource>` détruit par un `Ressource*`. Une classe qui a une fonction virtuelle doit avoir
      un destructeur virtuel.
  - key: bug-destructeur-declare-non-defini
    format: bug-fix
    question: |-
      La compilation échoue à l'édition des liens : « undefined reference to `Forme::~Forme()' ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      class Forme {
      public:
          virtual ~Forme();
      };

      class Carre : public Forme {
      };

      int main() {
          Carre carre;
          std::println("créé");
      }
      ```
    choices:
      - {text: "Écrire `virtual ~Forme() = default;`", correct: true}
      - {text: "Écrire `virtual ~Forme() = delete;`", correct: false}
      - {text: "Écrire `virtual ~Forme() = 0;` sans rien d'autre", correct: false}
      - {text: "Écrire `~Carre() = delete;` dans `Carre`", correct: false}
    answer: |-
      ```cpp
      virtual ~Forme() = default;
      ```
      Le destructeur est déclaré, mais n'a pas de corps : celui de `Carre` doit l'appeler, et l'éditeur de liens ne
      le trouve pas. `= default` le fait générer.
  - key: bug-virtual-dans-la-derivee
    format: bug-fix
    question: |-
      L'auteur a ajouté `virtual` au destructeur de la classe dérivée, et `~Capteur` ne s'affiche toujours pas.
      Pourquoi ?
      ```cpp
      #include <print>

      class Appareil {
      public:
          ~Appareil() { std::println("~Appareil"); }
      };

      class Capteur : public Appareil {
      public:
          virtual ~Capteur() { std::println("~Capteur"); }
      };

      int main() {
          Appareil* appareil = new Capteur;
          delete appareil;
      }
      ```
    choices:
      - {text: "C'est le destructeur de la base, par laquelle on détruit, qui doit être virtuel", correct: true}
      - {text: "Un destructeur virtuel ne s'exécute que pour une variable locale", correct: false}
      - {text: "`virtual` doit s'écrire après le nom du destructeur, pas avant", correct: false}
      - {text: "Un `delete` n'appelle jamais le destructeur d'une classe dérivée", correct: false}
    answer: |-
      ```cpp
      class Appareil {
      public:
          virtual ~Appareil() { std::println("~Appareil"); }
      };
      ```
      Le `delete` voit un `Appareil*`, dont le destructeur n'est pas virtuel : il n'y a pas de liaison dynamique. Le
      mot-clé doit être dans la classe de base.
  - key: situation-relecture
    format: scenario
    question: |-
      En relecture, tu vois une interface `Stockage`, avec trois fonctions virtuelles pures et aucun destructeur. Ses
      implémentations sont tenues par des `std::unique_ptr<Stockage>`. Que demandes-tu ?
    choices:
      - {text: "D'ajouter `virtual ~Stockage() = default;`", correct: true}
      - {text: "De remplacer les `std::unique_ptr` par des pointeurs bruts", correct: false}
      - {text: "De retirer les destructeurs des implémentations", correct: false}
      - {text: "Rien : une interface n'a pas besoin de destructeur", correct: false}
    answer: |-
      Les implémentations seront détruites par un `Stockage*`. Sans destructeur virtuel, leurs propres destructeurs
      ne s'exécutent pas : c'est un comportement indéfini. C'est la première ligne d'une interface.
  - key: situation-fuite
    format: scenario
    question: |-
      Un outil signale une fuite de mémoire dans une classe dérivée, dont le destructeur fait pourtant bien le
      `delete[]`. Les objets sont créés par une fabrique qui renvoie un pointeur vers la base. Que vérifies-tu
      d'abord ?
    choices:
      - {text: "Que le destructeur de la classe de base est virtuel", correct: true}
      - {text: "Que le destructeur de la classe dérivée est appelé deux fois", correct: false}
      - {text: "Que la fabrique renvoie bien une copie de l'objet", correct: false}
      - {text: "Que le tableau est alloué avec `malloc` plutôt qu'avec `new[]`", correct: false}
    answer: |-
      Un destructeur correct qui ne s'exécute pas : c'est le symptôme d'une destruction par un pointeur vers une base
      au destructeur non virtuel. La fuite n'est pas dans la classe dérivée, mais dans la déclaration de la base.
  - key: situation-petite-classe
    format: scenario
    question: |-
      Un collègue veut ajouter un destructeur virtuel à une struct `Point`, deux `double`, dont des millions
      d'exemplaires sont rangés dans un vecteur, « au cas où quelqu'un en dériverait ». Que réponds-tu ?
    choices:
      - {text: "Que `Point` n'est pas une base polymorphe : il paierait un pointeur par point, pour rien", correct: true}
      - {text: "Qu'il a raison : toute classe doit avoir un destructeur virtuel", correct: false}
      - {text: "Qu'il faut aussi rendre `x` et `y` virtuels", correct: false}
      - {text: "Qu'un destructeur virtuel accélère la destruction du vecteur", correct: false}
    answer: |-
      Un destructeur virtuel ajoute un pointeur de vtable à chaque objet : la taille d'un point passerait de 16 à 24
      octets. `Point` n'a pas de fonction virtuelle, et n'est pas faite pour qu'on en dérive. On peut le dire avec
      `final`.
  - key: situation-avertissement
    format: scenario
    question: |-
      Après l'ajout de `-Wall`, GCC signale « deleting object of polymorphic class type which has non-virtual
      destructor ». Un collègue propose de désactiver l'avertissement. Que fais-tu ?
    choices:
      - {text: "Je rends virtuel le destructeur de la classe de base", correct: true}
      - {text: "Je désactive l'avertissement, qui ne signale pas un bug", correct: false}
      - {text: "Je remplace le `delete` par un `free`", correct: false}
      - {text: "Je retire les fonctions virtuelles de la classe", correct: false}
    answer: |-
      L'avertissement désigne un comportement indéfini réel : un objet dérivé pourrait être détruit sans que son
      destructeur s'exécute. La correction est une ligne, dans la classe de base.
