notion: override-final
lesson: |-
  Deux mots-clés, arrivés avec C++11, font vérifier ses intentions par le compilateur.

  **`override`** se place après la signature d'une fonction d'une classe dérivée. Il affirme : « cette fonction
  **redéfinit** une fonction virtuelle de la base ». Si ce n'est pas vrai, le code **ne compile pas**.

  ```cpp
  class Animal {
  public:
      virtual ~Animal() = default;
      virtual void crier() const;
  };

  class Chien : public Animal {
  public:
      void crier() const override;      // vérifié
      void cier() const override;       // erreur : rien à redéfinir (faute de frappe)
      void crier() override;            // erreur : il manque const
  };
  ```

  Sans `override`, ces deux fautes **compilent** : elles déclarent de nouvelles fonctions, sans lien avec celle de la
  base, et c'est la version de la base qui est appelée à travers une `Animal&`. Le bug est muet.

  `override` protège aussi contre un changement de la base : si la signature de la fonction virtuelle évolue, toutes
  les redéfinitions devenues fausses cessent de compiler.

  **La règle** : on écrit `override` sur **toute** redéfinition. Il rend `virtual` inutile dans la dérivée.

  **`final`** interdit d'aller plus loin.

  - Sur une **fonction virtuelle** : aucune classe dérivée ne peut la redéfinir.
  - Sur une **classe** : aucune classe ne peut en dériver.

  ```cpp
  class Chien final : public Animal {       // on ne dérive pas de Chien
  public:
      void crier() const final;             // et cette fonction ne se redéfinit plus
  };
  ```

  On s'en sert quand une redéfinition casserait un invariant. Le compilateur y gagne aussi : il sait quelle fonction
  sera appelée, et peut se passer de la vtable.

  `override` et `final` ne sont pas des mots réservés : ils n'ont ce sens qu'à cet endroit.

  **En entretien** : « J'écris `override` sur chaque redéfinition : une signature qui ne correspond pas devient une
  erreur de compilation, au lieu d'un appel silencieux de la version de base. »
cards:
  - key: role-de-override
    format: course
    question: "Que vérifie le compilateur quand une fonction est marquée `override` ?"
    choices:
      - {text: "Qu'elle redéfinit bien une fonction virtuelle de la classe de base", correct: true}
      - {text: "Qu'elle n'est redéfinie par aucune classe dérivée", correct: false}
      - {text: "Qu'elle ne modifie aucun membre de l'objet", correct: false}
      - {text: "Qu'elle est appelée au moins une fois dans le programme", correct: false}
    answer: "Si aucune fonction virtuelle de la base n'a exactement cette signature, le code ne compile pas."
  - key: sans-override
    format: course
    question: "Que se passe-t-il, sans `override`, si la fonction de la dérivée n'a pas tout à fait la signature de celle de la base ?"
    choices:
      - {text: "Le code compile, et la version de la base est appelée à travers une référence vers la base", correct: true}
      - {text: "Le code ne compile pas : la signature doit être identique", correct: false}
      - {text: "Le compilateur corrige la signature de la fonction dérivée", correct: false}
      - {text: "La version de la dérivée est appelée quand même, puisque le nom est le même", correct: false}
    answer: "La dérivée déclare alors une nouvelle fonction, qui cache celle de la base sans la redéfinir. Rien ne signale la faute : c'est tout l'intérêt d'`override`."
  - key: role-de-final
    format: course
    question: "Que fait `final` après la signature d'une fonction virtuelle ?"
    choices:
      - {text: "Il interdit aux classes dérivées de la redéfinir", correct: true}
      - {text: "Il oblige les classes dérivées à la redéfinir", correct: false}
      - {text: "Il interdit de l'appeler depuis l'extérieur de la classe", correct: false}
      - {text: "Il en fait une constante, calculée à la compilation", correct: false}
    answer: "`final` arrête la chaîne des redéfinitions à cette classe. Celui qui oblige à redéfinir, c'est `= 0`."
  - key: final-sur-une-classe
    format: course
    question: "Que signifie `class Chien final : public Animal` ?"
    choices:
      - {text: "Qu'aucune classe ne peut dériver de `Chien`", correct: true}
      - {text: "Que `Chien` ne peut pas être instanciée", correct: false}
      - {text: "Que les objets `Chien` ne peuvent pas être modifiés", correct: false}
      - {text: "Que `Chien` est la dernière classe du fichier", correct: false}
    answer: "`final` sur une classe ferme la hiérarchie à cet endroit. On peut toujours en créer des objets et les modifier."
  - key: vf-override-obligatoire
    format: true-false
    question: "Sans `override`, une fonction de la dérivée ne peut pas redéfinir une fonction virtuelle de la base."
    truth: false
    answer: "La redéfinition a lieu dès que la signature correspond. `override` n'y change rien : il fait vérifier qu'elle a bien lieu."
  - key: vf-override-cpp11
    format: true-false
    question: "`override` et `final` existent depuis C++11."
    truth: true
    answer: Avant, une signature légèrement différente passait inaperçue.
  - key: vf-virtual-et-override
    format: true-false
    question: "Dans la classe dérivée, il faut écrire `virtual` en plus d'`override`."
    truth: false
    answer: "`override` implique que la fonction est virtuelle. On n'écrit que lui."
  - key: vf-final-objet
    format: true-false
    question: "On peut créer des objets d'une classe marquée `final`."
    truth: true
    answer: "`final` interdit d'en dériver, pas de l'instancier."
  - key: qcm-position
    format: multiple-choice
    question: "Où s'écrit `override` ?"
    choices:
      - {text: "Après la signature, et après `const` s'il y en a un", correct: true}
      - {text: "Devant le type de retour de la fonction", correct: false}
      - {text: "Devant le nom de la classe dérivée", correct: false}
      - {text: "À la place du mot-clé `public` de l'héritage", correct: false}
    answer: "`void crier() const override;` : tout à la fin de la déclaration."
  - key: qcm-faute-attrapee
    format: multiple-choice
    question: "La base déclare `virtual void crier() const;`. Laquelle de ces déclarations `override` refuse-t-il ?"
    choices:
      - {text: "`void crier() override;`", correct: true}
      - {text: "`void crier() const override;`", correct: false}
      - {text: "`void crier() const final;`", correct: false}
      - {text: "`void crier() const override final;`", correct: false}
    answer: "Il manque `const` : la signature diffère, il n'y a rien à redéfinir. Les autres ont la bonne signature."
  - key: qcm-changement-de-la-base
    format: multiple-choice
    question: "La signature d'une fonction virtuelle de la base change. Que se passe-t-il pour les dérivées qui avaient écrit `override` ?"
    choices:
      - {text: "Elles ne compilent plus : la faute est signalée partout", correct: true}
      - {text: "Elles compilent, et appellent la nouvelle fonction de la base", correct: false}
      - {text: "Elles compilent, et leur fonction est renommée", correct: false}
      - {text: "Elles sont supprimées par le compilateur", correct: false}
    answer: "Chaque redéfinition devenue fausse est une erreur de compilation. Sans `override`, elles seraient devenues des fonctions sans lien avec la base, en silence."
  - key: qcm-quand-final
    format: multiple-choice
    question: "Dans quel cas marque-t-on une fonction virtuelle `final` ?"
    choices:
      - {text: "Quand une redéfinition par une classe dérivée casserait une règle de la classe", correct: true}
      - {text: "Quand la fonction doit être redéfinie par toutes les classes dérivées", correct: false}
      - {text: "Quand la fonction est appelée en dernier dans le programme", correct: false}
      - {text: "Quand la fonction ne renvoie aucune valeur", correct: false}
    answer: "`final` protège un comportement qui doit rester tel quel. Il laisse aussi le compilateur appeler la fonction directement, sans passer par la vtable."
  - key: trous-override
    format: fill-in
    question: |-
      Complète pour faire vérifier la redéfinition :
      ```cpp
      class Chien : public Animal {
      public:
          void crier() const ___;
      };
      ```
    blanks:
      - [override]
    answer: "`void crier() const override;`."
  - key: trous-final-fonction
    format: fill-in
    question: |-
      Complète pour qu'aucune classe dérivée de `Chien` ne puisse redéfinir `crier` :
      ```cpp
      class Chien : public Animal {
      public:
          void crier() const ___;
      };
      ```
    blanks:
      - [final, "override final"]
    answer: "`void crier() const final;` : la redéfinition s'arrête ici."
  - key: trous-final-classe
    format: fill-in
    question: |-
      Complète pour qu'aucune classe ne puisse dériver de `Chat` :
      ```cpp
      class Chat ___ : public Animal {
      };
      ```
    blanks:
      - [final]
    answer: "`class Chat final : public Animal` : la classe ne peut plus servir de base."
  - key: trous-virtual
    format: fill-in
    question: |-
      Complète la base pour que la fonction de `Chien`, marquée `override`, compile :
      ```cpp
      class Animal {
      public:
          ___ void crier() const;
      };

      class Chien : public Animal {
      public:
          void crier() const override;
      };
      ```
    blanks:
      - [virtual]
    answer: "`override` exige que la fonction de la base soit `virtual`."
  - key: code-override
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual const char* cri() const { return "..."; }
      };

      class Chien : public Animal {
      public:
          const char* cri() const override { return "ouaf"; }
      };

      int main() {
          Chien rex;
          const Animal& animal = rex;
          std::println("{}", animal.cri());
      }
      ```
    choices:
      - {text: "`ouaf`", correct: true}
      - {text: "`...`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`ouaf` : la signature correspond, `override` est satisfait, et l'appel virtuel atteint `Chien`."
    check:
      output: "ouaf"
  - key: code-override-refuse
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual const char* cri() const { return "..."; }
      };

      class Chien : public Animal {
      public:
          const char* cri() override { return "ouaf"; }
      };

      int main() {
          Chien rex;
          std::println("{}", rex.cri());
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`ouaf`", correct: false}
      - {text: "`...`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : sans `const`, la fonction ne redéfinit rien, et `override` le signale (« marked 'override', but does not override »)."
    check:
      compiles: false
  - key: code-sans-override
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual const char* cri() const { return "..."; }
      };

      class Chien : public Animal {
      public:
          const char* crie() const { return "ouaf"; }
      };

      int main() {
          Chien rex;
          const Animal& animal = rex;
          std::println("{}", animal.cri());
      }
      ```
    choices:
      - {text: "`...`", correct: true}
      - {text: "`ouaf`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`...` : `crie`, avec sa faute de frappe, est une nouvelle fonction. Sans `override`, rien ne le signale, et `cri` reste celle d'`Animal`."
    check:
      output: "..."
  - key: code-classe-final
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
      };

      class Chien final : public Animal {
      };

      class Chiot : public Chien {
      };

      int main() {
          Chiot chiot;
          std::println("créé");
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`créé`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Une exception à l'exécution", correct: false}
    answer: "Ça ne compile pas : `Chien` est `final`, on ne peut pas en dériver (« cannot derive from 'final' base »)."
    check:
      compiles: false
  - key: bug-faute-de-frappe
    format: bug-fix
    question: |-
      Le compilateur répond « 'void Chien::cier() const' marked 'override', but does not override ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual void crier() const { std::println("..."); }
      };

      class Chien : public Animal {
      public:
          void cier() const override { std::println("ouaf"); }
      };

      int main() {
          Chien rex;
          rex.crier();
      }
      ```
    choices:
      - {text: "Corriger le nom de la fonction : `crier`", correct: true}
      - {text: "Retirer `override` de la fonction `cier`", correct: false}
      - {text: "Ajouter une fonction `cier` dans `Animal`", correct: false}
      - {text: "Déclarer `cier` avec `virtual` dans `Chien`", correct: false}
    answer: |-
      ```cpp
      void crier() const override { std::println("ouaf"); }
      ```
      `override` a fait son travail : il a trouvé la faute de frappe. Le retirer ferait compiler le code, avec le bug.
  - key: bug-override-absent
    format: bug-fix
    question: |-
      Ce programme affiche `...` au lieu de `ouaf`, sans aucun message du compilateur. Quelle modification aurait
      fait signaler la faute ?
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual void crier(int fois) const { std::println("..."); }
      };

      class Chien : public Animal {
      public:
          void crier(long fois) const { std::println("ouaf"); }
      };

      int main() {
          Chien rex;
          const Animal& animal = rex;
          animal.crier(1);
      }
      ```
    choices:
      - {text: "Marquer la fonction de `Chien` avec `override`", correct: true}
      - {text: "Marquer la fonction de `Chien` avec `final`", correct: false}
      - {text: "Marquer la fonction d'`Animal` avec `final`", correct: false}
      - {text: "Marquer la classe `Chien` avec `final`", correct: false}
    answer: |-
      ```cpp
      void crier(int fois) const override { std::println("ouaf"); }
      ```
      Le paramètre est un `long` au lieu d'un `int` : la fonction ne redéfinit rien. `override` l'aurait refusée à la
      compilation ; il faut ensuite corriger le type.
  - key: bug-redefinir-final
    format: bug-fix
    question: |-
      Le compilateur répond « virtual function 'virtual void Chiot::crier() const' overriding final function ». La
      classe `Chien` doit garder sa garantie. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual void crier() const { std::println("..."); }
      };

      class Chien : public Animal {
      public:
          void crier() const final { std::println("ouaf"); }
      };

      class Chiot : public Chien {
      public:
          void crier() const override { std::println("wif"); }
      };

      int main() {
          Chiot chiot;
          chiot.crier();
      }
      ```
    choices:
      - {text: "Retirer la redéfinition de `crier` dans `Chiot`", correct: true}
      - {text: "Retirer `override` de la fonction de `Chiot`", correct: false}
      - {text: "Marquer la fonction de `Chiot` avec `final` aussi", correct: false}
      - {text: "Faire dériver `Chiot` d'`Animal` et de `Chien`", correct: false}
    answer: |-
      ```cpp
      class Chiot : public Chien {
      };
      ```
      `final` dit que le cri d'un `Chien` ne se redéfinit plus. `Chiot` l'hérite tel quel. Si un chiot doit crier
      autrement, c'est `final` qu'il faut remettre en question, avec l'auteur de `Chien`.
  - key: bug-deriver-de-final
    format: bug-fix
    question: |-
      Le compilateur répond « cannot derive from 'final' base 'Compte' in derived type 'CompteEpargne' ». La classe
      `Compte` ne peut pas être modifiée. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compte final {
      public:
          void deposer(int montant) { solde_ += montant; }
          int solde() const { return solde_; }

      private:
          int solde_ = 0;
      };

      class CompteEpargne : public Compte {
      public:
          void verser_interets() { deposer(solde() / 10); }
      };

      int main() {
          CompteEpargne epargne;
          epargne.deposer(100);
          epargne.verser_interets();
          std::println("{}", epargne.solde());
      }
      ```
    choices:
      - {text: "Donner à `CompteEpargne` un membre `Compte`, au lieu d'en dériver", correct: true}
      - {text: "Dériver de `Compte` avec le mot-clé `private`", correct: false}
      - {text: "Marquer `CompteEpargne` avec `final` aussi", correct: false}
      - {text: "Dériver de `Compte` avec le mot-clé `virtual`", correct: false}
    answer: |-
      ```cpp
      class CompteEpargne {
      public:
          void deposer(int montant) { compte_.deposer(montant); }
          int solde() const { return compte_.solde(); }
          void verser_interets() { compte_.deposer(compte_.solde() / 10); }

      private:
          Compte compte_;
      };
      ```
      On ne dérive pas d'une classe `final`, quel que soit le mode d'héritage. On la **compose** : un compte épargne
      a un compte, et lui délègue le travail.
