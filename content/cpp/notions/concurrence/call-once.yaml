  - key: code-call-once
    format: code-output
    question: |-
      ```cpp
      #include <mutex>
      #include <print>
      #include <thread>

      int main() {
          std::once_flag drapeau;
          int appels = 0;
          auto travail = [&] { std::call_once(drapeau, [&] { ++appels; }); };
          std::thread a{travail};
          std::thread b{travail};
          std::thread c{travail};
          a.join();
          b.join();
          c.join();
          std::println("{}", appels);
      }
      ```
    choices:
      - {text: "`1`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Un nombre entre 1 et 3, selon l'exécution", correct: false}
    answer: "`1` : trois threads appellent `std::call_once` avec le même drapeau. La fonction ne s'exécute qu'une fois."
    check:
      output: "1"
  - key: code-statique
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int constructions = 0;

      struct Service {
          Service() { ++constructions; }
      };

      Service& service() {
          static Service instance;
          return instance;
      }

      int main() {
          service();
          service();
          std::println("{} {}", constructions, &service() == &service());
      }
      ```
    choices:
      - {text: "`1 true`", correct: true}
      - {text: "`4 false`", correct: false}
      - {text: "`2 true`", correct: false}
      - {text: "`4 true`", correct: false}
    answer: "`1 true` : la statique locale n'est construite qu'au premier appel. Tous les appels rendent le même objet."
    check:
      output: "1 true"
  - key: code-exception
    format: code-output
    question: |-
      ```cpp
      #include <mutex>
      #include <print>
      #include <stdexcept>

      int main() {
          std::once_flag drapeau;
          int essais = 0;
          auto initialiser = [&] {
              ++essais;
              if (essais == 1) {
                  throw std::runtime_error{"panne"};
              }
          };
          try {
              std::call_once(drapeau, initialiser);
          } catch (const std::runtime_error&) {
          }
          std::call_once(drapeau, initialiser);
          std::call_once(drapeau, initialiser);
          std::println("{}", essais);
      }
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`2` : le premier appel échoue, donc ne compte pas. Le deuxième réussit ; le troisième ne fait plus rien."
    check:
      output: "2"
  - key: code-paresseux
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Journal {
          Journal() { std::print("ouvert "); }
      };

      Journal& journal() {
          static Journal instance;
          return instance;
      }

      int main() {
          std::print("début ");
          journal();
          journal();
          std::println("fin");
      }
      ```
    choices:
      - {text: "`début ouvert fin`", correct: true}
      - {text: "`ouvert début fin`", correct: false}
      - {text: "`début ouvert ouvert fin`", correct: false}
      - {text: "`début fin`", correct: false}
    answer: "`début ouvert fin` : la statique locale est construite au premier passage sur sa déclaration, pas au démarrage du programme, et une seule fois."
    check:
      output: "début ouvert fin"
  - key: bug-once-flag-local
    format: bug-fix
    question: |-
      Ce programme devrait initialiser une seule fois et afficher `1`. Il affiche `3`. Quelle correction est la
      bonne ?
      ```cpp
      #include <mutex>
      #include <print>

      int initialisations = 0;

      void preparer() {
          std::once_flag drapeau;
          std::call_once(drapeau, [] { ++initialisations; });
      }

      int main() {
          preparer();
          preparer();
          preparer();
          std::println("{}", initialisations);
      }
      ```
    choices:
      - {text: "Déclarer le drapeau `static std::once_flag drapeau;`", correct: true}
      - {text: "Déclarer le drapeau `const std::once_flag drapeau;`", correct: false}
      - {text: "Déclarer le drapeau `thread_local std::once_flag drapeau;` dans `main`", correct: false}
      - {text: "Appeler `std::call_once` deux fois de suite dans `preparer`", correct: false}
    answer: |-
      ```cpp
      static std::once_flag drapeau;
      ```
      Un drapeau local est neuf à chaque appel : `std::call_once` exécute donc la fonction chaque fois. Le drapeau
      doit durer autant que ce qu'il protège.
  - key: bug-double-verification
    format: bug-fix
    question: |-
      Cette initialisation paresseuse lit le pointeur hors du verrou : c'est une course aux données. Quelle
      correction est la bonne ?
      ```cpp
      #include <mutex>
      #include <print>

      struct Service {
          int valeur = 7;
      };

      Service* instance = nullptr;
      std::mutex verrou;

      Service& service() {
          if (instance == nullptr) {
              std::lock_guard garde{verrou};
              if (instance == nullptr) {
                  instance = new Service;
              }
          }
          return *instance;
      }

      int main() {
          std::println("{}", service().valeur);
      }
      ```
    choices:
      - {text: "Remplacer le tout par `static Service instance; return instance;`", correct: true}
      - {text: "Retirer le second test `if (instance == nullptr)`, sous le verrou", correct: false}
      - {text: "Déclarer le pointeur `instance` avec le mot-clé `volatile`", correct: false}
      - {text: "Déplacer le `std::lock_guard` après la ligne du `new`", correct: false}
    answer: |-
      ```cpp
      Service& service() {
          static Service instance;
          return instance;
      }
      ```
      Le premier test lit `instance` pendant qu'un autre thread peut l'écrire. La statique locale donne la même
      initialisation paresseuse, garantie par le standard, sans fuite ni mutex.
  - key: bug-acces-non-protege
    format: bug-fix
    question: |-
      Le compteur est initialisé une seule fois, mais deux threads le modifient ensuite sans protection. Le total
      attendu est `2000`, et rien ne le garantit. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <thread>

      int& compteur() {
          static int valeur = 0;
          return valeur;
      }

      int main() {
          auto travail = [] {
              for (int i = 0; i < 1000; ++i) {
                  ++compteur();
              }
          };
          std::thread a{travail};
          std::thread b{travail};
          a.join();
          b.join();
          std::println("{}", compteur());
      }
      ```
    choices:
      - {text: "Renvoyer un `std::atomic<int>&` vers une statique `std::atomic<int>`", correct: true}
      - {text: "Déclarer la statique `thread_local int valeur = 0;`", correct: false}
      - {text: "Appeler `compteur()` une fois dans `main` avant de lancer les threads", correct: false}
      - {text: "Déclarer la fonction `compteur` avec le mot-clé `inline`", correct: false}
    answer: |-
      ```cpp
      std::atomic<int>& compteur() {
          static std::atomic<int> valeur{0};
          return valeur;
      }
      ```
      Seule l'initialisation de la statique est protégée. Les incrémentations qui suivent sont une course aux
      données : il faut un atomique, ou un mutex.
  - key: bug-booleen
    format: bug-fix
    question: |-
      Deux threads peuvent passer le test en même temps et initialiser deux fois. Le programme devrait toujours
      afficher `1`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <thread>

      bool fait = false;
      int initialisations = 0;

      void preparer() {
          if (!fait) {
              ++initialisations;
              fait = true;
          }
      }

      int main() {
          std::thread a{preparer};
          std::thread b{preparer};
          a.join();
          b.join();
          std::println("{}", initialisations);
      }
      ```
    choices:
      - {text: "Utiliser un `std::once_flag` global et `std::call_once`", correct: true}
      - {text: "Écrire `fait = true;` avant `++initialisations;`", correct: false}
      - {text: "Déclarer le booléen `fait` avec le mot-clé `volatile`", correct: false}
      - {text: "Tester `!fait` deux fois de suite avant d'initialiser", correct: false}
    answer: |-
      ```cpp
      std::once_flag drapeau;

      void preparer() {
          std::call_once(drapeau, [] { ++initialisations; });
      }
      ```
      Le test et l'écriture du booléen ne sont pas atomiques, et le booléen est en course. `std::call_once` garantit
      une exécution unique.
