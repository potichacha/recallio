      std::once_flag drapeau;

      void preparer() {
          std::___(drapeau, [] { ouvrir(); });
      }
      ```
    blanks:
      - [call_once]
    answer: "`std::call_once` exécute la fonction une seule fois pour ce drapeau."
  - key: trous-once-flag
