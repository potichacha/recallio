notion: std-thread
lesson: |-
  `std::thread` (en-tête `<thread>`) lance une fonction dans un nouveau thread. Celui-ci démarre **dès la
  construction** de l'objet.

  ```cpp
  #include <thread>

  void saluer(int fois) { /* ... */ }

  std::thread t{saluer, 3};                        // lance saluer(3)
  std::thread u{[] { std::println("bonjour"); }};  // une lambda convient aussi
  t.join();
  u.join();
  ```

  **`join` ou `detach` : il faut choisir.** Avant la destruction de l'objet `std::thread`, on doit avoir appelé :

  - **`join()`** : attendre que le thread ait fini. C'est le cas normal.
  - **`detach()`** : le laisser vivre sa vie, sans plus pouvoir l'attendre. À éviter : le thread peut encore
    tourner quand `main` se termine, ou se servir de variables détruites.

  Si l'on ne fait ni l'un ni l'autre, le destructeur de `std::thread` appelle **`std::terminate`**. C'est aussi ce
  qui arrive quand une exception fait sauter le `join()`.

  **`std::jthread` (C++20).** Son destructeur **appelle `join()` tout seul**. C'est RAII appliqué aux threads :
  plus d'oubli, même en cas d'exception. En C++20 et au-delà, c'est le choix par défaut.

  ```cpp
  {
      std::jthread t{travailler};
  }   // attend ici la fin du thread
  ```

  **Les arguments sont copiés.** `std::thread` copie ses arguments dans le nouveau thread. Pour passer une
  **référence**, on l'emballe avec `std::ref` :

  ```cpp
  void incrementer(int& n) { ++n; }

  int compteur = 0;
  std::thread t{incrementer, std::ref(compteur)};
  t.join();
  ```

  Sans `std::ref`, le programme ne compile pas. Avec, c'est à toi de garantir que `compteur` vit plus longtemps que
  le thread.

  **Récupérer un résultat.** La valeur de retour de la fonction est **perdue**. On écrit dans une variable passée
  par référence, ou l'on prend `std::async`, qui rend un `std::future`.

  **Les exceptions.** Une exception qui sort de la fonction du thread, sans y être attrapée, appelle
  `std::terminate`. Elle ne remonte pas vers le thread qui a lancé.

  **Ce qu'on ne peut pas faire.** Un `std::thread` ne se copie pas : il se **déplace** (`std::move`). L'ordre dans
  lequel plusieurs threads s'exécutent **n'est pas prévisible**.

  **En entretien** : « Un `std::thread` démarre à sa construction, et doit être `join` ou `detach` avant sa
  destruction, sinon `std::terminate`. `std::jthread` fait le `join` dans son destructeur. Les arguments sont
  copiés : `std::ref` pour une référence. »
cards:
  - key: demarrage
    format: course
    question: "Quand le thread d'un `std::thread` commence-t-il à s'exécuter ?"
    choices:
      - {text: "Dès la construction de l'objet `std::thread`", correct: true}
      - {text: "Au premier appel de sa fonction `join()`", correct: false}
      - {text: "Au premier appel de sa fonction `start()`", correct: false}
      - {text: "À la fin de la fonction qui l'a créé", correct: false}
    answer: "Il n'y a pas de fonction `start`. `join()` ne lance rien : il attend la fin d'un thread déjà lancé."
  - key: join
    format: course
    question: "Que fait `t.join()` ?"
    choices:
      - {text: "Il bloque le thread appelant jusqu'à la fin du thread `t`", correct: true}
      - {text: "Il démarre le thread `t`, qui attendait d'être lancé", correct: false}
      - {text: "Il arrête le thread `t`, même s'il n'a pas fini", correct: false}
      - {text: "Il fusionne les variables du thread `t` avec celles de l'appelant", correct: false}
    answer: "`join` attend. Après lui, le thread est terminé, et l'objet `std::thread` peut être détruit sans risque."
  - key: sans-join
    format: course
    question: "Que se passe-t-il quand un `std::thread` est détruit sans `join()` ni `detach()` ?"
    choices:
      - {text: "Son destructeur appelle `std::terminate`", correct: true}
      - {text: "Son destructeur attend la fin du thread", correct: false}
      - {text: "Son destructeur détache le thread", correct: false}
      - {text: "Son destructeur arrête le thread proprement", correct: false}
    answer: "Le standard refuse de choisir à ta place entre attendre et abandonner : le programme s'arrête. `std::jthread`, lui, fait le `join`."
  - key: jthread
    format: course
    question: "Qu'apporte `std::jthread` (C++20) par rapport à `std::thread` ?"
    choices:
      - {text: "Son destructeur appelle `join()` tout seul", correct: true}
      - {text: "Son thread s'exécute deux fois plus vite", correct: false}
      - {text: "Son thread ne peut pas provoquer de course aux données", correct: false}
      - {text: "Son destructeur détache le thread tout seul", correct: false}
    answer: "C'est RAII pour les threads : impossible d'oublier le `join`, même quand une exception quitte la fonction. Il sait aussi demander l'arrêt du thread."
  - key: vf-copie
    format: true-false
    question: "Un `std::thread` peut être copié."
    truth: false
    answer: "Il représente un thread unique : il se déplace avec `std::move`, mais ne se copie pas."
  - key: vf-arguments-copies
    format: true-false
    question: "Les arguments passés au constructeur de `std::thread` sont copiés dans le nouveau thread."
    truth: true
    answer: "Pour qu'il travaille sur l'original, on passe `std::ref(variable)`."
  - key: vf-exception
    format: true-false
    question: "Une exception non attrapée dans un thread remonte vers le thread qui l'a lancé."
    truth: false
    answer: "Elle appelle `std::terminate`. Pour transmettre une erreur, on passe par `std::async` et son `std::future`."
  - key: vf-ordre
    format: true-false
    question: "Deux threads lancés l'un après l'autre s'exécutent toujours dans cet ordre."
    truth: false
    answer: C'est le système qui décide. Un programme correct ne dépend pas de l'ordre d'exécution de ses threads.
  - key: qcm-lancer
    format: multiple-choice
    question: "Quelle ligne lance la fonction `traiter(42)` dans un nouveau thread ?"
    choices:
      - {text: "`std::thread t{traiter, 42};`", correct: true}
      - {text: "`std::thread t{traiter(42)};`", correct: false}
      - {text: "`std::thread t; t.start(traiter, 42);`", correct: false}
      - {text: "`std::thread t = traiter(42);`", correct: false}
    answer: "On passe la fonction, puis ses arguments. `traiter(42)` appellerait la fonction tout de suite, dans le thread courant."
  - key: qcm-reference
    format: multiple-choice
    question: "La fonction `void ajouter(int& total)` doit modifier une variable de l'appelant. Comment lances-tu le thread ?"
    choices:
      - {text: "`std::thread t{ajouter, std::ref(total)};`", correct: true}
      - {text: "`std::thread t{ajouter, total};`", correct: false}
      - {text: "`std::thread t{ajouter, &total};`", correct: false}
      - {text: "`std::thread t{ajouter, std::move(total)};`", correct: false}
    answer: "`std::ref` emballe une référence, que `std::thread` peut copier. Sans lui, l'argument serait copié, et le code ne compile pas."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::thread` ?"
    choices:
      - {text: "`<thread>`", correct: true}
      - {text: "`<threads>`", correct: false}
      - {text: "`<pthread>`", correct: false}
      - {text: "`<concurrency>`", correct: false}
    answer: "`<thread>` déclare `std::thread`, `std::jthread` et `std::this_thread`."
  - key: qcm-joinable
    format: multiple-choice
    question: "Quelle fonction dit si un `std::thread` attend encore un `join()` ou un `detach()` ?"
    choices:
      - {text: "`joinable()`", correct: true}
      - {text: "`running()`", correct: false}
      - {text: "`alive()`", correct: false}
      - {text: "`finished()`", correct: false}
    answer: "`joinable()` vaut `true` tant que l'objet représente un thread ni attendu ni détaché."
  - key: trous-join
    format: fill-in
    question: |-
      Complète pour attendre la fin du thread :
      ```cpp
      std::thread t{travailler};
      t.___();
      ```
    blanks:
      - [join]
    answer: "`join()` bloque jusqu'à la fin du thread."
  - key: trous-ref
    format: fill-in
    question: |-
      Complète pour que le thread modifie la variable `total` de l'appelant :
      ```cpp
      std::thread t{ajouter, std::___(total)};
      ```
    blanks:
      - [ref]
    answer: "`std::ref` passe une référence à travers le constructeur de `std::thread`."
  - key: trous-jthread
    format: fill-in
    question: |-
      Complète avec le thread qui s'attend lui-même à sa destruction (C++20) :
      ```cpp
      {
          std::___ t{travailler};
      }
      ```
    blanks:
      - [jthread]
    answer: "Le destructeur de `std::jthread` appelle `join()`."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête à inclure :
      ```cpp
      #include <___>

      std::thread t{travailler};
      ```
    blanks:
      - [thread]
    answer: "`std::thread` est déclaré dans `<thread>`."
  - key: code-join
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <thread>

      int main() {
          int resultat = 0;
          std::thread t{[&resultat] { resultat = 6 * 7; }};
          t.join();
          std::println("{}", resultat);
      }
      ```
    choices:
      - {text: "`42`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`0` ou `42`, selon l'exécution", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`42` : `join()` attend la fin du thread. Quand `main` lit `resultat`, l'écriture est terminée : pas de course."
    check:
      output: "42"
  - key: code-ref
    format: code-output
    question: |-
      ```cpp
      #include <functional>
      #include <print>
      #include <thread>

      void doubler(int& n) {
          n *= 2;
      }

      int main() {
          int a = 5;
          std::thread t{doubler, std::ref(a)};
          t.join();
          std::println("{}", a);
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`10` : `std::ref` fait travailler le thread sur la variable `a` elle-même. Après le `join`, elle a été doublée."
    check:
      output: "10"
  - key: code-sequence
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <thread>

      int main() {
          int total = 0;
          std::thread a{[&total] { total += 1; }};
          a.join();
          std::thread b{[&total] { total += 10; }};
          b.join();
          std::println("{} {}", total, a.joinable());
      }
      ```
    choices:
      - {text: "`11 false`", correct: true}
      - {text: "`11 true`", correct: false}
      - {text: "`10 false`", correct: false}
      - {text: "`1 true`", correct: false}
    answer: "`11 false` : le second thread n'est lancé qu'après la fin du premier, donc les deux additions se suivent. Après `join`, un thread n'est plus `joinable`."
    check:
      output: "11 false"
  - key: code-jthread
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <thread>

      int main() {
          int etapes = 0;
          {
              std::jthread t{[&etapes] { etapes = 3; }};
          }
          std::println("{}", etapes);
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`0` ou `3`, selon l'exécution", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3` : à la fin du bloc, le destructeur de `std::jthread` attend la fin du thread. L'affichage vient après."
    check:
      output: "3"
  - key: bug-join-oublie
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « terminate called without an active exception ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <thread>

      int main() {
          std::thread t{[] { std::println("travail"); }};
      }
      ```
    choices:
      - {text: "Appeler `t.join();` avant la fin de `main`", correct: true}
      - {text: "Appeler `t.start();` après la construction", correct: false}
      - {text: "Déclarer `t` avec le mot-clé `static`", correct: false}
      - {text: "Écrire `return 0;` à la fin de `main`", correct: false}
    answer: |-
      ```cpp
      std::thread t{[] { std::println("travail"); }};
      t.join();
      ```
      Un `std::thread` détruit sans `join` ni `detach` appelle `std::terminate`. Avec `std::jthread`, le `join`
      serait fait par le destructeur.
  - key: bug-reference-sans-ref
    format: bug-fix
    question: |-
      Le compilateur refuse la construction du thread. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <thread>

      void incrementer(int& n) {
          ++n;
      }

      int main() {
          int compteur = 0;
          std::thread t{incrementer, compteur};
          t.join();
          std::println("{}", compteur);
      }
      ```
    choices:
      - {text: "Passer `std::ref(compteur)`", correct: true}
      - {text: "Passer `&compteur`", correct: false}
      - {text: "Passer `std::move(compteur)`", correct: false}
      - {text: "Passer `*compteur`", correct: false}
    answer: |-
      ```cpp
      std::thread t{incrementer, std::ref(compteur)};
      ```
      `std::thread` copie ses arguments, et une copie temporaire ne peut pas se lier à `int&`. `std::ref` transmet
      une vraie référence (en-tête `<functional>`).
  - key: bug-appel-immediat
    format: bug-fix
    question: |-
      Le compilateur refuse la construction du thread : on lui donne le résultat de `calculer(5)`, qui est `void`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <thread>

      void calculer(int n) {
          std::println("{}", n * n);
      }

      int main() {
          std::thread t{calculer(5)};
          t.join();
      }
      ```
    choices:
      - {text: "Écrire `std::thread t{calculer, 5};`", correct: true}
      - {text: "Écrire `std::thread t{&calculer(5)};`", correct: false}
      - {text: "Écrire `std::thread t{calculer(), 5};`", correct: false}
      - {text: "Écrire `std::thread t{std::ref(calculer(5))};`", correct: false}
    answer: |-
      ```cpp
      std::thread t{calculer, 5};
      ```
      `calculer(5)` appelle la fonction tout de suite, dans `main`. On passe la fonction elle-même, puis ses
      arguments : c'est le thread qui fera l'appel.
  - key: bug-lecture-avant-join
    format: bug-fix
    question: |-
      Ce programme devrait toujours afficher `42`. Il affiche parfois `0` : `main` lit `resultat` pendant que le
      thread l'écrit. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <thread>

      int main() {
          int resultat = 0;
          std::thread t{[&resultat] { resultat = 42; }};
          std::println("{}", resultat);
          t.join();
      }
      ```
    choices:
      - {text: "Appeler `t.join();` avant l'affichage", correct: true}
      - {text: "Appeler `t.detach();` avant l'affichage", correct: false}
      - {text: "Capturer `resultat` par valeur dans la lambda", correct: false}
      - {text: "Déclarer `resultat` avec le mot-clé `volatile`", correct: false}
    answer: |-
      ```cpp
      t.join();
      std::println("{}", resultat);
      ```
      Lire une variable qu'un autre thread écrit, sans synchronisation, est une course aux données. Après `join`, le
      thread a fini : la lecture est sûre.
  - key: situation-detach
    format: scenario
    question: |-
      Une fonction lance un thread détaché qui écrit dans un fichier journal, puis `main` se termine. Les dernières
      lignes du journal manquent souvent. Pourquoi, et que proposes-tu ?
    choices:
      - {text: "Le programme se termine sans attendre le thread détaché ; il faut le `join`", correct: true}
      - {text: "Un thread détaché ne peut pas écrire dans un fichier ; il faut un processus", correct: false}
      - {text: "Le fichier est verrouillé par `main` ; il faut l'ouvrir dans le thread", correct: false}
      - {text: "Le thread détaché s'exécute deux fois ; il faut un mutex autour de l'écriture", correct: false}
    answer: |-
      À la fin de `main`, le processus s'arrête, threads détachés compris, où qu'ils en soient. Un thread dont le
      travail compte doit être attendu : `join`, ou un `std::jthread`.
  - key: situation-exception-avant-join
    format: scenario
    question: |-
      Une fonction lance un `std::thread`, fait un calcul qui peut lancer une exception, puis appelle `join()`.
      Quand le calcul échoue, le programme s'arrête au lieu de traiter l'erreur. Que proposes-tu ?
    choices:
      - {text: "Un `std::jthread`, dont le destructeur fait le `join` même en cas d'exception", correct: true}
      - {text: "Un `detach()` juste après la création du thread, pour ne plus avoir à l'attendre", correct: false}
      - {text: "Un second `join()` placé juste avant le calcul, en plus du premier", correct: false}
      - {text: "Un `catch (...)` vide autour du calcul, pour que l'erreur soit ignorée", correct: false}
    answer: |-
      L'exception saute le `join()` : le destructeur du `std::thread` appelle `std::terminate`. `std::jthread`
      applique RAII : le déroulement de la pile attend le thread, puis l'exception continue vers son `catch`.
  - key: situation-resultat
    format: scenario
    question: |-
      Tu veux lancer un calcul long dans un thread, et récupérer la valeur qu'il renvoie. Un collègue écrit
      `int r = t.join();`. Que lui proposes-tu ?
    choices:
      - {text: "`std::async`, dont le `std::future` rend la valeur avec `get()`", correct: true}
      - {text: "`t.detach()`, qui renvoie la valeur calculée par le thread", correct: false}
      - {text: "`t.get()`, qui attend le thread et renvoie sa valeur", correct: false}
      - {text: "`std::ref(t)`, qui donne accès à la valeur de retour", correct: false}
    answer: |-
      `join()` renvoie `void` : la valeur de retour de la fonction d'un `std::thread` est perdue. `std::async`
      lance le calcul et rend un `std::future`, qui transmet aussi les exceptions.
  - key: situation-trop-de-threads
    format: scenario
    question: |-
      Un programme lance dix mille `std::thread`, un par fichier à traiter, sur une machine à quatre cœurs. Il est
      plus lent qu'avec un seul thread, et manque parfois de mémoire. Pourquoi ?
    choices:
      - {text: "Chaque thread réserve une pile, et quatre cœurs passent leur temps à les alterner", correct: true}
      - {text: "Le standard limite un programme à mille threads, les autres sont ignorés", correct: false}
      - {text: "Les threads s'exécutent l'un après l'autre, dans l'ordre de leur création", correct: false}
      - {text: "Chaque thread recopie toute la mémoire du programme à sa création", correct: false}
    answer: |-
      Un thread a un coût : sa pile (souvent plusieurs mégaoctets réservés), sa création, et les changements de
      contexte. Pour des calculs, quatre threads suffisent sur quatre cœurs : on leur distribue les fichiers.
