notion: generator
lesson: |-
  `std::generator<T>` (C++23, en-tête `<generator>`) est le type de retour tout fait pour écrire un **générateur** :
  une coroutine qui produit une suite de valeurs, une à la fois, avec `co_yield`.

  ```cpp
  #include <generator>

  std::generator<int> fibonacci() {
      int a = 0;
      int b = 1;
      while (true) {
          co_yield a;
          a = std::exchange(b, a + b);
      }
  }

  for (int n : fibonacci() | std::views::take(8)) {
      std::print("{} ", n);          // 0 1 1 2 3 5 8 13
  }
  ```

  **Il est paresseux.** Appeler la fonction **n'exécute rien** : le corps démarre quand on commence à itérer, et
  n'avance que d'un `co_yield` à chaque valeur demandée. Une suite **infinie** est donc permise : c'est l'appelant
  qui décide quand s'arrêter.

  **C'est un intervalle.** Un `std::generator` se parcourt avec une boucle sur un intervalle, et se combine avec
  les vues de `std::ranges` : `std::views::take`, `filter`, `transform`.

  **C'est un intervalle à un seul passage.**

  - On ne le parcourt **qu'une fois** : appeler `begin()` une seconde fois est un comportement indéfini.
  - Il **ne se copie pas** ; il se déplace.
  - Pas de `size()`, pas d'accès par indice.

  **Ce qu'on y écrit.**

  | Dans le corps | Effet |
  |---|---|
  | `co_yield valeur;` | produit une valeur |
  | `co_yield std::ranges::elements_of(autre);` | produit tous les éléments d'un autre générateur ou intervalle |
  | `co_return;` ou la fin du corps | termine la suite |

  Un `co_return valeur;` ne compile pas : un générateur ne renvoie rien à la fin.

  **Les durées de vie.**

  - Les **paramètres par référence** doivent vivre aussi longtemps que le générateur : un temporaire passé en
    argument est détruit avant la première valeur. On prend les paramètres **par valeur**.
  - La valeur produite est une **référence** vers l'objet donné à `co_yield`, valable jusqu'à la valeur suivante.
    Pour la garder, on la copie.

  **Générateur ou vecteur ?** Le générateur gagne quand la suite est longue, infinie, coûteuse, ou lue en partie
  seulement : rien n'est calculé ni stocké d'avance. Le vecteur gagne quand il faut relire les valeurs, connaître
  leur nombre, ou y accéder par indice.

  **En entretien** : « `std::generator` est le générateur standard de C++23 : une coroutine à `co_yield`,
  paresseuse, qu'on parcourt une seule fois avec une boucle ou des vues. Il rend naturelles les suites infinies.
  Je fais attention aux paramètres par référence, qui doivent lui survivre. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce que `std::generator<T>` ?"
    choices:
      - {text: "Le type de retour d'une coroutine qui produit une suite de valeurs avec `co_yield`", correct: true}
      - {text: "Un conteneur qui garde en mémoire toutes les valeurs produites", correct: false}
      - {text: "Un générateur de nombres aléatoires de type `T`", correct: false}
      - {text: "Un thread qui remplit un vecteur en tâche de fond", correct: false}
    answer: "C'est un intervalle paresseux, déclaré dans `<generator>` depuis C++23. Chaque valeur est calculée à la demande."
  - key: paresseux
    format: course
    question: "Que se passe-t-il à l'appel d'une fonction qui renvoie un `std::generator` ?"
    choices:
      - {text: "Rien du corps ne s'exécute : il démarre quand on commence à itérer", correct: true}
      - {text: "Le corps s'exécute en entier, et les valeurs sont rangées dans un tampon", correct: false}
      - {text: "Le corps s'exécute jusqu'au premier `co_yield`, puis s'arrête", correct: false}
      - {text: "Le corps s'exécute dans un thread créé pour le générateur", correct: false}
    answer: "Le générateur est suspendu dès l'entrée. C'est `begin()`, appelé par la boucle, qui le fait avancer jusqu'à la première valeur."
  - key: un-passage
    format: course
    question: "Combien de fois peut-on parcourir un `std::generator` ?"
    choices:
      - {text: "Une seule fois : c'est un intervalle à un seul passage", correct: true}
      - {text: "Autant de fois qu'on veut : il repart du début à chaque boucle", correct: false}
      - {text: "Deux fois : une à l'endroit, une à l'envers", correct: false}
      - {text: "Autant de fois qu'il a produit de valeurs", correct: false}
    answer: "Les valeurs ne sont pas gardées, et la coroutine ne revient pas en arrière. Pour une seconde lecture, on rappelle la fonction."
  - key: elements-of
    format: course
    question: "À quoi sert `co_yield std::ranges::elements_of(autre)` dans un générateur ?"
    choices:
      - {text: "À produire, un par un, tous les éléments d'un autre générateur ou intervalle", correct: true}
      - {text: "À produire le nombre d'éléments de l'autre intervalle", correct: false}
      - {text: "À produire l'autre intervalle entier, comme une seule valeur", correct: false}
      - {text: "À copier l'autre intervalle dans un vecteur", correct: false}
    answer: "Il délègue à un autre générateur, récursif compris, sans écrire de boucle : pratique pour parcourir un arbre."
  - key: vf-infini
    format: true-false
    question: "Un `std::generator` peut produire une suite infinie de valeurs."
    truth: true
    answer: Il ne calcule que ce qu'on lui demande. L'appelant s'arrête quand il veut, avec `std::views::take` par exemple.
  - key: vf-copie
    format: true-false
    question: "Un `std::generator` peut être copié."
    truth: false
    answer: Il possède le cadre de sa coroutine, qui est unique. Il se déplace seulement.
  - key: vf-size
    format: true-false
    question: "`std::generator` offre une fonction `size()` qui donne le nombre de valeurs."
    truth: false
    answer: Les valeurs n'existent pas avant d'être demandées. Il faut les parcourir pour les compter.
  - key: vf-cpp23
    format: true-false
    question: "`std::generator` est déclaré dans l'en-tête `<generator>`, depuis C++23."
    truth: true
    answer: "En C++20, il fallait écrire soi-même le type et son `promise_type`, ou prendre une bibliothèque."
  - key: qcm-limiter
    format: multiple-choice
    question: "Comment lis-tu seulement les cinq premières valeurs d'un générateur infini `entiers()` ?"
    choices:
      - {text: "`for (int n : entiers() | std::views::take(5))`", correct: true}
      - {text: "`for (int n : entiers().resize(5))`", correct: false}
      - {text: "`for (int n : entiers()[5])`", correct: false}
      - {text: "`for (int n : entiers(5))`", correct: false}
    answer: "Un générateur est un intervalle : il se combine avec les vues. `take(5)` arrête la boucle après cinq valeurs."
  - key: qcm-terminer
    format: multiple-choice
    question: "Comment termine-t-on la suite avant la fin du corps d'un générateur ?"
    choices:
      - {text: "`co_return;`", correct: true}
      - {text: "`return;`", correct: false}
      - {text: "`co_yield;`", correct: false}
      - {text: "`break;`, hors de toute boucle", correct: false}
    answer: "`co_return;` sans valeur termine la coroutine. Un `return` ordinaire est interdit dans une coroutine."
  - key: qcm-parametre
    format: multiple-choice
    question: "Comment un générateur reçoit-il un texte fourni par l'appelant, sans risque de référence pendante ?"
    choices:
      - {text: "Par valeur : `std::string texte`", correct: true}
      - {text: "Par référence constante : `const std::string& texte`", correct: false}
      - {text: "Par vue : `std::string_view texte`", correct: false}
      - {text: "Par pointeur : `const std::string* texte`", correct: false}
    answer: "Le cadre de la coroutine copie le paramètre. Par valeur, c'est la chaîne ; par référence, vue ou pointeur, c'est une adresse qui peut devenir pendante."
  - key: qcm-ou-vecteur
    format: multiple-choice
    question: "Dans quel cas un `std::vector` convient-il mieux qu'un générateur ?"
    choices:
      - {text: "Quand il faut relire les valeurs plusieurs fois, ou y accéder par indice", correct: true}
      - {text: "Quand la suite est infinie", correct: false}
      - {text: "Quand l'appelant ne lit que les premières valeurs", correct: false}
      - {text: "Quand chaque valeur est coûteuse à calculer", correct: false}
    answer: "Un générateur se lit une fois, dans l'ordre. Ses atouts sont justement les suites longues, infinies ou lues en partie."
  - key: trous-co-yield
    format: fill-in
    question: |-
      Complète pour produire chaque valeur :
      ```cpp
      std::generator<int> compter(int n) {
          for (int i = 0; i < n; ++i) {
              ___ i;
          }
      }
      ```
    blanks:
      - [co_yield]
    answer: "`co_yield` produit la valeur et suspend le générateur."
  - key: trous-type
    format: fill-in
    question: |-
      Complète le type de retour :
      ```cpp
      std::___<int> pairs() {
          for (int i = 0;; i += 2) {
              co_yield i;
          }
      }
      ```
    blanks:
      - [generator]
    answer: "`std::generator<int>` : une suite d'entiers produite à la demande."
  - key: trous-take
    format: fill-in
    question: |-
      Complète pour ne lire que trois valeurs du générateur infini :
      ```cpp
      for (int n : pairs() | std::views::___(3)) {
          std::println("{}", n);
      }
      ```
    blanks:
      - [take]
    answer: "`std::views::take(3)` limite l'intervalle à ses trois premiers éléments."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête à inclure :
      ```cpp
      #include <___>

      std::generator<int> compter(int n);
      ```
    blanks:
      - [generator]
    answer: "L'en-tête porte le nom du type."
  - key: code-fibonacci
    format: code-output
    question: |-
      ```cpp
      #include <generator>
      #include <print>
      #include <ranges>
      #include <utility>

      std::generator<int> fibonacci() {
          int a = 0;
          int b = 1;
          while (true) {
              co_yield a;
              a = std::exchange(b, a + b);
          }
      }

      int main() {
          for (int n : fibonacci() | std::views::take(7)) {
              std::print("{} ", n);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`0 1 1 2 3 5 8 fin`", correct: true}
      - {text: "`1 1 2 3 5 8 13 fin`", correct: false}
      - {text: "`0 1 2 3 4 5 6 fin`", correct: false}
      - {text: "Rien : la boucle `while (true)` ne se termine pas", correct: false}
    answer: "`0 1 1 2 3 5 8 fin` : le générateur est infini, mais `take(7)` n'en demande que sept valeurs. Le reste n'est jamais calculé."
    check:
      output: "0 1 1 2 3 5 8 fin"
  - key: code-paresse
    format: code-output
    question: |-
      ```cpp
      #include <generator>
      #include <print>

      std::generator<int> valeurs() {
          std::print("a ");
          co_yield 1;
          std::print("b ");
          co_yield 2;
      }

      int main() {
          auto suite = valeurs();
          std::print("x ");
          for (int v : suite) {
              std::print("{} ", v);
              break;
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`x a 1 fin`", correct: true}
      - {text: "`a x 1 fin`", correct: false}
      - {text: "`x a 1 b fin`", correct: false}
      - {text: "`a b x 1 fin`", correct: false}
    answer: "`x a 1 fin` : l'appel ne démarre pas le corps ; la boucle, si. Après le `break`, le générateur n'est plus repris : `b` n'est jamais affiché."
    check:
      output: "x a 1 fin"
  - key: code-elements-of
    format: code-output
    question: |-
      ```cpp
      #include <generator>
      #include <print>
      #include <ranges>

      std::generator<int> jusqua(int n) {
          for (int i = 1; i <= n; ++i) {
              co_yield i;
          }
      }

      std::generator<int> tout() {
          co_yield 0;
          co_yield std::ranges::elements_of(jusqua(2));
          co_yield 9;
      }

      int main() {
          for (int v : tout()) {
              std::print("{} ", v);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`0 1 2 9 fin`", correct: true}
      - {text: "`0 9 fin`", correct: false}
      - {text: "`0 2 9 fin`", correct: false}
      - {text: "`1 2 0 9 fin`", correct: false}
    answer: "`0 1 2 9 fin` : `elements_of` insère, à cet endroit, toutes les valeurs de l'autre générateur."
    check:
      output: "0 1 2 9 fin"
  - key: code-co-return
    format: code-output
    question: |-
      ```cpp
      #include <generator>
      #include <print>

      std::generator<int> positifs(int debut) {
          for (int i = debut;; --i) {
              if (i <= 0) {
                  co_return;
              }
              co_yield i;
          }
      }

      int main() {
          int somme = 0;
          for (int v : positifs(4)) {
              somme += v;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`6`", correct: false}
    answer: "`10` : le générateur produit 4, 3, 2, 1, puis `co_return` termine la suite. La boucle s'arrête."
    check:
      output: "10"
  - key: bug-jamais-itere
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3` : le générateur compte ses valeurs. Il affiche `0`. Quelle correction est la
      bonne ?
      ```cpp
      #include <generator>
      #include <print>

      int produites = 0;

      std::generator<int> valeurs() {
          for (int i = 0; i < 3; ++i) {
              ++produites;
              co_yield i;
          }
      }

      int main() {
          auto suite = valeurs();
          std::println("{}", produites);
      }
      ```
    choices:
      - {text: "Parcourir `suite` avec une boucle avant l'affichage", correct: true}
      - {text: "Appeler `valeurs()` une seconde fois avant l'affichage", correct: false}
      - {text: "Déclarer `produites` avec le mot-clé `volatile`", correct: false}
      - {text: "Écrire `co_return i;` à la place de `co_yield i;`", correct: false}
    answer: |-
      ```cpp
      for (int v : suite) {
      }
      std::println("{}", produites);
      ```
      Un générateur est paresseux : l'appel ne fait que créer la coroutine, suspendue. Son corps ne s'exécute que
      lorsqu'on itère.
  - key: bug-co-return-valeur
    format: bug-fix
    question: |-
      Le compilateur refuse la ligne `co_return -1;` de ce générateur. Quelle correction est la bonne ?
      ```cpp
      #include <generator>
      #include <print>

      std::generator<int> valeurs() {
          co_yield 1;
          co_yield 2;
          co_return -1;
      }

      int main() {
          for (int v : valeurs()) {
              std::print("{} ", v);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "Écrire `co_return;` sans valeur, ou supprimer la ligne", correct: true}
      - {text: "Écrire `return -1;` à la place de `co_return -1;`", correct: false}
      - {text: "Écrire `co_await -1;` à la place de `co_return -1;`", correct: false}
      - {text: "Déclarer le générateur avec `std::generator<void>`", correct: false}
    answer: |-
      ```cpp
      co_yield 1;
      co_yield 2;
      ```
      Un générateur produit ses valeurs par `co_yield`, et ne renvoie rien à la fin : son `promise_type` n'a que
      `return_void`. Pour produire -1, ce serait `co_yield -1;`.
  - key: bug-return-ordinaire
    format: bug-fix
    question: |-
      Le compilateur refuse le `return` de cette coroutine. Quelle correction est la bonne ?
      ```cpp
      #include <generator>
      #include <print>

      std::generator<int> jusqua(int n) {
          for (int i = 0;; ++i) {
              if (i == n) {
                  return;
              }
              co_yield i;
          }
      }

      int main() {
          for (int v : jusqua(3)) {
              std::print("{} ", v);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "Écrire `co_return;`", correct: true}
      - {text: "Écrire `return {};`", correct: false}
      - {text: "Écrire `co_yield;`", correct: false}
      - {text: "Écrire `throw;`", correct: false}
    answer: |-
      ```cpp
      if (i == n) {
          co_return;
      }
      ```
      Dans une coroutine, `return` est interdit : on termine avec `co_return`. Un `break` conviendrait aussi ici.
  - key: bug-infini
    format: bug-fix
    question: |-
      Ce programme ne se termine jamais. Quelle correction est la bonne ?
      ```cpp
      #include <generator>
      #include <print>

      std::generator<int> entiers() {
          for (int i = 0;; ++i) {
              co_yield i;
          }
      }

      int main() {
          long somme = 0;
          for (int v : entiers()) {
              somme += v % 2;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "Parcourir `entiers() | std::views::take(100)`", correct: true}
      - {text: "Écrire `co_return i;` dans le générateur", correct: false}
      - {text: "Déclarer `somme` avec le type `int`", correct: false}
      - {text: "Appeler `entiers()` deux fois dans la boucle", correct: false}
    answer: |-
      ```cpp
      for (int v : entiers() | std::views::take(100)) {
      ```
      Un générateur infini est légitime, à condition que l'appelant s'arrête : `take`, un `break`, ou
      `take_while`. Il faut inclure `<ranges>`.
