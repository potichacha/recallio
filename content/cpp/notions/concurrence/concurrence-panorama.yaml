notion: concurrence-panorama
lesson: |-
  Un programme **concurrent** mène plusieurs tâches de front. Depuis C++11, la bibliothèque standard fournit ce
  qu'il faut pour cela, sans dépendre du système.

  **Concurrence ou parallélisme ?**

  - La **concurrence** est une affaire de **structure** : plusieurs tâches avancent, en se relayant au besoin sur
    un seul cœur. Un serveur qui suit mille connexions est concurrent.
  - Le **parallélisme** est une affaire d'**exécution** : plusieurs calculs tournent **au même instant**, sur
    plusieurs cœurs. Il sert à aller plus vite.

  **Processus et threads.** Un **processus** est un programme en cours d'exécution, avec sa propre mémoire. Un
  **thread** est un fil d'exécution à l'intérieur d'un processus : il a sa propre **pile**, mais **partage** le tas
  et les variables globales avec les autres threads. Ce partage rend la communication facile, et dangereuse.

  **Les outils de la bibliothèque.**

  | Besoin | Outil | En-tête |
  |---|---|---|
  | Lancer un thread | `std::thread`, `std::jthread` (C++20) | `<thread>` |
  | Protéger des données partagées | `std::mutex`, `std::lock_guard`, `std::scoped_lock` | `<mutex>` |
  | Une opération indivisible sur une variable | `std::atomic` | `<atomic>` |
  | Attendre un événement | `std::condition_variable` | `<condition_variable>` |
  | Lancer un calcul et récupérer son résultat | `std::async`, `std::future` | `<future>` |
  | Paralléliser un algorithme | `std::execution::par` | `<execution>` |

  **Les trois dangers.**

  - La **course aux données** (*data race*) : deux threads accèdent à la même variable sans synchronisation, et
    l'un au moins écrit. C'est un **comportement indéfini**.
  - L'**interblocage** (*deadlock*) : deux threads attendent chacun un verrou que l'autre détient. Plus rien
    n'avance.
  - La **famine** : un thread n'obtient jamais la ressource dont il a besoin.

  Ces défauts dépendent de l'ordre dans lequel le système fait avancer les threads : ils apparaissent **parfois**,
  et rarement en test.

  **Comment s'en sortir.**

  1. **Ne pas partager** : chaque thread travaille sur ses propres données, et rend un résultat.
  2. Partager en **lecture seule** : des données que personne ne modifie ne posent aucun problème.
  3. Sinon, **synchroniser** : un mutex, ou une variable atomique.

  **Ce que les threads coûtent.** Créer un thread prend des dizaines de microsecondes, et chacun réserve une pile.
  Au-delà du nombre de cœurs (`std::thread::hardware_concurrency()`), des threads de calcul se gênent. Pour de
  nombreuses petites tâches, on réutilise un **groupe de threads** (*thread pool*).

  **En entretien** : « La concurrence structure un programme en tâches ; le parallélisme les exécute en même temps
  sur plusieurs cœurs. Les threads partagent la mémoire : sans synchronisation, c'est la course aux données, un
  comportement indéfini. Ma première défense est de ne pas partager. »
cards:
  - key: concurrence-ou-parallelisme
    format: course
    question: "Quelle différence entre concurrence et parallélisme ?"
    choices:
      - {text: "La concurrence fait avancer plusieurs tâches ; le parallélisme les exécute au même instant", correct: true}
      - {text: "La concurrence exige plusieurs cœurs ; le parallélisme fonctionne sur un seul cœur", correct: false}
      - {text: "La concurrence concerne les processus ; le parallélisme concerne les threads", correct: false}
      - {text: "Aucune : les deux mots désignent exactement la même chose", correct: false}
    answer: "Un seul cœur peut mener plusieurs tâches en les alternant : c'est de la concurrence sans parallélisme. Le parallélisme demande plusieurs cœurs."
  - key: partage-des-threads
    format: course
    question: "Que partagent les threads d'un même processus ?"
    choices:
      - {text: "Le tas et les variables globales ; chacun a sa propre pile", correct: true}
      - {text: "La pile ; chacun a son propre tas et ses variables globales", correct: false}
      - {text: "Rien : chaque thread a sa mémoire entièrement séparée", correct: false}
      - {text: "Tout, y compris les variables locales de chaque fonction", correct: false}
    answer: "Les variables locales d'une fonction vivent sur la pile du thread qui l'exécute. Tout le reste est commun, d'où le besoin de synchroniser."
  - key: trois-dangers
    format: course
    question: "Qu'est-ce qu'une course aux données ?"
    choices:
      - {text: "Deux threads accèdent à la même variable sans synchronisation, et l'un au moins écrit", correct: true}
      - {text: "Deux threads attendent chacun un verrou que l'autre détient, et plus rien n'avance", correct: false}
      - {text: "Deux threads se terminent dans un ordre que le programmeur n'avait pas prévu", correct: false}
      - {text: "Deux threads lisent en même temps une variable que personne ne modifie", correct: false}
    answer: "C'est un comportement indéfini. Deux lectures simultanées ne posent aucun problème ; il faut au moins une écriture."
  - key: premiere-defense
    format: course
    question: "Quelle est la façon la plus sûre d'éviter les courses aux données ?"
    choices:
      - {text: "Ne pas partager de données modifiables entre les threads", correct: true}
      - {text: "Lancer davantage de threads que de cœurs", correct: false}
      - {text: "Déclarer toutes les variables partagées `static`", correct: false}
      - {text: "Compiler le programme sans optimisation", correct: false}
    answer: "Des données propres à chaque thread, ou partagées en lecture seule, ne demandent aucune synchronisation. Le mutex vient ensuite, quand le partage est inévitable."
  - key: vf-standard
    format: true-false
    question: "Depuis C++11, la bibliothèque standard permet de lancer des threads sans bibliothèque du système."
    truth: true
    answer: "`std::thread`, `std::mutex`, `std::atomic` et `std::future` font partie du standard."
  - key: vf-lectures
    format: true-false
    question: "Deux threads qui lisent la même variable, sans que personne ne l'écrive, forment une course aux données."
    truth: false
    answer: Il faut au moins une écriture. Des lectures simultanées sont toujours sûres.
  - key: vf-plus-de-threads
    format: true-false
    question: "Plus un calcul utilise de threads, plus il est rapide, sans limite."
    truth: false
    answer: "Au-delà du nombre de cœurs, les threads se partagent le processeur, et le coût de leur alternance s'ajoute."
  - key: vf-pile
    format: true-false
    question: "Chaque thread a sa propre pile."
    truth: true
    answer: C'est pourquoi les variables locales d'une fonction ne sont pas partagées entre les threads qui l'exécutent.
  - key: qcm-proteger
    format: multiple-choice
    question: "Quel outil protège une section de code contre l'exécution simultanée par deux threads ?"
    choices:
      - {text: "`std::mutex`", correct: true}
      - {text: "`std::future`", correct: false}
      - {text: "`std::thread`", correct: false}
      - {text: "`std::function`", correct: false}
    answer: "Un mutex ne peut être verrouillé que par un thread à la fois. Les autres attendent qu'il soit relâché."
  - key: qcm-resultat
    format: multiple-choice
    question: "Quel outil lance un calcul en tâche de fond et permet d'en récupérer le résultat ?"
    choices:
      - {text: "`std::async`, qui renvoie un `std::future`", correct: true}
      - {text: "`std::mutex`, qui renvoie un `std::lock_guard`", correct: false}
      - {text: "`std::atomic`, qui renvoie un `std::thread`", correct: false}
      - {text: "`std::thread`, dont `join` renvoie la valeur", correct: false}
    answer: "`future.get()` attend la fin du calcul et rend sa valeur, ou relance son exception. `std::thread::join` ne renvoie rien."
  - key: qcm-coeurs
    format: multiple-choice
    question: "Quelle fonction indique le nombre de threads que la machine peut exécuter en parallèle ?"
    choices:
      - {text: "`std::thread::hardware_concurrency()`", correct: true}
      - {text: "`std::thread::count()`", correct: false}
      - {text: "`std::cores()`", correct: false}
      - {text: "`std::this_thread::get_id()`", correct: false}
    answer: "Elle renvoie une indication, souvent le nombre de cœurs logiques, ou 0 si elle ne sait pas."
  - key: qcm-compteur
    format: multiple-choice
    question: "Quel outil convient pour un simple compteur incrémenté par plusieurs threads ?"
    choices:
      - {text: "`std::atomic<int>`", correct: true}
      - {text: "`std::future<int>`", correct: false}
      - {text: "`volatile int`", correct: false}
      - {text: "`static int`", correct: false}
    answer: "Une variable atomique rend l'incrémentation indivisible, sans mutex. `volatile` ne protège pas des courses aux données en C++."
  - key: situation-serveur
    format: scenario
    question: |-
      Un serveur passe l'essentiel de son temps à attendre des réponses du réseau, pour des milliers de clients. Un
      collègue dit : « sur une machine à un seul cœur, des threads ne servent à rien ». Que réponds-tu ?
    choices:
      - {text: "Que la concurrence reste utile : pendant qu'une tâche attend, une autre avance", correct: true}
      - {text: "Qu'il a raison : sans plusieurs cœurs, un programme ne peut mener qu'une tâche", correct: false}
      - {text: "Qu'il faut lancer autant de processus que de clients, plutôt que des threads", correct: false}
      - {text: "Qu'un seul cœur exécute quand même plusieurs threads au même instant", correct: false}
    answer: |-
      La concurrence n'est pas le parallélisme. Des tâches qui attendent (réseau, disque) n'occupent pas le
      processeur : un seul cœur suffit à en faire avancer beaucoup. Le parallélisme, lui, n'apporte quelque chose
      qu'aux calculs.
  - key: situation-bug-intermittent
    format: scenario
    question: |-
      Un programme à plusieurs threads donne un mauvais total une fois sur mille, jamais sous le débogueur. Que
      soupçonnes-tu en premier ?
    choices:
      - {text: "Une course aux données sur une variable partagée sans synchronisation", correct: true}
      - {text: "Une erreur d'arrondi dans un calcul sur des nombres à virgule", correct: false}
      - {text: "Une fuite de mémoire qui grossit à chaque exécution", correct: false}
      - {text: "Un débordement de pile dans une fonction récursive", correct: false}
    answer: |-
      Un défaut qui dépend du moment où les threads se croisent est la signature d'une course aux données. Le
      débogueur ralentit les threads et masque le problème. ThreadSanitizer (`-fsanitize=thread`) le détecte.
  - key: situation-calcul
    format: scenario
    question: |-
      Tu dois traiter un million d'images, chacune indépendante des autres, sur une machine à huit cœurs. Comment
      organises-tu le travail pour éviter toute synchronisation ?
    choices:
      - {text: "Chaque thread traite sa part des images, et écrit dans ses propres résultats", correct: true}
      - {text: "Tous les threads ajoutent leurs résultats au même vecteur, sans verrou", correct: false}
      - {text: "Un thread est lancé pour chaque image, soit un million de threads", correct: false}
      - {text: "Un seul thread traite tout, pour ne courir aucun risque", correct: false}
    answer: |-
      Des tâches indépendantes n'ont rien à partager : on découpe en huit parts, une par cœur. Aucune donnée
      modifiable n'est commune, donc aucun mutex n'est nécessaire. Un million de threads épuiserait la mémoire.
  - key: situation-petites-taches
    format: scenario
    question: |-
      Un service crée un thread pour chaque requête, des milliers de fois par seconde, et passe plus de temps à
      créer des threads qu'à travailler. Que proposes-tu ?
    choices:
      - {text: "Un groupe de threads réutilisés, qui prennent les requêtes dans une file", correct: true}
      - {text: "Des threads détachés, pour ne plus avoir à les attendre", correct: false}
      - {text: "Un mutex global, verrouillé pendant toute la requête", correct: false}
      - {text: "Deux fois plus de threads, pour absorber la charge", correct: false}
    answer: |-
      Créer et détruire un thread coûte cher au regard d'une petite tâche. Un groupe de threads (*thread pool*) en
      garde quelques-uns en vie, autant que de cœurs, et leur distribue le travail.
  - key: definition-thread
    format: definition
    question: "Qu'est-ce qu'un thread ?"
    choices:
      - {text: "Un fil d'exécution dans un processus, qui partage sa mémoire avec les autres", correct: true}
      - {text: "Un programme en cours d'exécution, avec sa propre mémoire", correct: false}
      - {text: "Une fonction que le système appelle à intervalles réguliers", correct: false}
      - {text: "Un verrou qui protège une variable partagée", correct: false}
    answer: "Un processus contient un ou plusieurs threads. Chacun a sa pile et son point d'exécution ; le reste de la mémoire est commun."
  - key: definition-interblocage
    format: definition
    question: "Qu'est-ce qu'un interblocage ?"
    choices:
      - {text: "Des threads qui attendent chacun un verrou détenu par un autre, sans fin", correct: true}
      - {text: "Des threads qui écrivent la même variable sans synchronisation", correct: false}
      - {text: "Un thread qui se termine avant d'avoir fini son travail", correct: false}
      - {text: "Un thread qui consomme tout le temps du processeur", correct: false}
    answer: "Chacun tient ce que l'autre attend : aucun ne peut avancer. Le programme se fige, sans message."
  - key: definition-section-critique
    format: definition
    question: "Qu'appelle-t-on une section critique ?"
    choices:
      - {text: "Un morceau de code qu'un seul thread à la fois doit exécuter", correct: true}
      - {text: "Un morceau de code qui s'exécute plus vite que le reste", correct: false}
      - {text: "Un morceau de code que le compilateur ne peut pas optimiser", correct: false}
      - {text: "Un morceau de code qui lance une exception en cas d'erreur", correct: false}
    answer: "C'est le code qui touche aux données partagées. On l'encadre par un mutex, et on la garde aussi courte que possible."
  - key: definition-thread-pool
    format: definition
    question: "Qu'est-ce qu'un groupe de threads (thread pool) ?"
    choices:
      - {text: "Des threads créés une fois, qui exécutent les tâches d'une file", correct: true}
      - {text: "Des threads qui partagent tous le même mutex", correct: false}
      - {text: "Des threads lancés chacun pour une seule tâche, puis détruits", correct: false}
      - {text: "Des threads qui s'exécutent dans des processus séparés", correct: false}
    answer: "Réutiliser les threads évite le coût de leur création, et borne leur nombre à celui des cœurs."
