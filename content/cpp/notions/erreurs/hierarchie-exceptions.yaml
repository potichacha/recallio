notion: hierarchie-exceptions
lesson: |-
  Les exceptions de la bibliothèque standard forment une **hiérarchie de classes**, dont la racine est
  `std::exception`.

  ```
  std::exception                      what()
  ├── std::logic_error                une erreur du programmeur, évitable
  │   ├── std::invalid_argument
  │   ├── std::out_of_range           vector::at, string::at
  │   └── std::length_error
  ├── std::runtime_error              une erreur liée à l'environnement
  │   ├── std::overflow_error
  │   └── std::system_error
  ├── std::bad_alloc                  new n'a plus de mémoire
  ├── std::bad_cast                   dynamic_cast sur une référence
  └── std::bad_optional_access        optional::value() sur un optional vide
  ```

  `std::exception` est dans `<exception>` ; `std::logic_error`, `std::runtime_error` et leurs dérivées dans
  `<stdexcept>`.

  **Un `catch` attrape aussi les classes dérivées.** `catch (const std::exception& e)` attrape donc **toutes** les
  exceptions standard. C'est le polymorphisme : `e.what()` appelle la version de la classe réellement lancée.

  **Attraper par référence constante.** C'est la règle :

  ```cpp
  catch (const std::exception& e)    // bien
  catch (std::exception e)           // mal : copie, et découpage
  ```

  Attraper **par valeur** copie l'exception dans un objet de la classe de base : la partie dérivée est **découpée**
  (*slicing*), et `what()` ne renvoie plus le message d'origine. La référence garde l'objet entier.

  **Du plus précis au plus général.** Les `catch` sont essayés dans l'ordre. Un `catch` de la classe de base placé
  en premier attrape tout, et ceux des classes dérivées ne servent plus : GCC le signale par un avertissement.

  ```cpp
  try {
      traiter();
  } catch (const std::out_of_range& e) {     // le plus précis
  } catch (const std::logic_error& e) {
  } catch (const std::exception& e) {        // le plus général
  }
  ```

  **Écrire sa propre exception.** On dérive de `std::runtime_error` (ou d'une autre classe de la hiérarchie), et
  l'on transmet le message au constructeur de base :

  ```cpp
  class ErreurReseau : public std::runtime_error {
  public:
      using std::runtime_error::runtime_error;    // hérite des constructeurs
  };
  ```

  Tout code qui attrape `std::exception` attrapera aussi `ErreurReseau`. Une exception qui ne dérive pas de
  `std::exception` lui échappe : il ne reste que `catch (...)`, qui ne donne aucune information.

  **En entretien** : « Toutes les exceptions standard dérivent de `std::exception`. J'attrape par référence
  constante, pour éviter la copie et le découpage, et je range les `catch` du plus dérivé au plus général. Mes
  propres exceptions dérivent de `std::runtime_error`. »
cards:
  - key: racine
    format: course
    question: "Quelle classe est la racine des exceptions de la bibliothèque standard ?"
    choices:
      - {text: "`std::exception`", correct: true}
      - {text: "`std::runtime_error`", correct: false}
      - {text: "`std::error`", correct: false}
      - {text: "`std::throwable`", correct: false}
    answer: "`std::exception` déclare la fonction virtuelle `what()`. `std::runtime_error` et `std::logic_error` en dérivent."
  - key: reference-const
    format: course
    question: "Pourquoi attrape-t-on une exception par référence constante ?"
    choices:
      - {text: "Pour éviter une copie, et le découpage de la partie dérivée", correct: true}
      - {text: "Pour empêcher l'exception de remonter plus haut", correct: false}
      - {text: "Pour pouvoir modifier le message de l'exception", correct: false}
      - {text: "Pour que le `catch` s'exécute plus tôt que les autres", correct: false}
    answer: "Par valeur, `catch (std::exception e)` copie seulement la partie `std::exception` de l'objet lancé : le type réel et son `what()` sont perdus."
  - key: catch-base
    format: course
    question: "Qu'attrape `catch (const std::exception& e)` ?"
    choices:
      - {text: "Toute exception dont la classe dérive de `std::exception`", correct: true}
      - {text: "Seulement une exception de type exact `std::exception`", correct: false}
      - {text: "N'importe quelle exception, y compris un `int`", correct: false}
      - {text: "Seulement les exceptions lancées par la bibliothèque standard", correct: false}
    answer: "Un `catch` d'une classe de base attrape ses classes dérivées, les tiennes comprises. Un `int` lancé lui échappe : il faudrait `catch (...)`."
  - key: ordre
    format: course
    question: "Dans quel ordre écrit-on plusieurs `catch` de classes liées par héritage ?"
    choices:
      - {text: "De la classe la plus dérivée à la classe la plus générale", correct: true}
      - {text: "De la classe la plus générale à la classe la plus dérivée", correct: false}
      - {text: "Dans l'ordre alphabétique des noms de classes", correct: false}
      - {text: "Dans n'importe quel ordre : le plus précis est choisi", correct: false}
    answer: "Le premier `catch` compatible gagne. Si la classe de base vient d'abord, les `catch` des classes dérivées ne sont jamais atteints."
  - key: vf-out-of-range
    format: true-false
    question: "`std::out_of_range` dérive de `std::logic_error`."
    truth: true
    answer: "Un indice hors bornes est une erreur du programmeur : elle aurait pu être évitée par un test."
  - key: vf-par-valeur
    format: true-false
    question: "Attraper `std::exception` par valeur garde le message de la classe dérivée."
    truth: false
    answer: "La copie ne garde que la partie `std::exception` : c'est le découpage. `what()` renvoie alors un texte générique, comme `std::exception`."
  - key: vf-propre-exception
    format: true-false
    question: "Une exception qui dérive de `std::runtime_error` est attrapée par `catch (const std::exception&)`."
    truth: true
    answer: "`std::runtime_error` dérive de `std::exception`. L'héritage se transmet."
  - key: vf-bad-alloc
    format: true-false
    question: "`std::bad_alloc` dérive de `std::runtime_error`."
    truth: false
    answer: "Elle dérive directement de `std::exception`. Un `catch (const std::runtime_error&)` ne l'attrape pas."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::runtime_error` et `std::invalid_argument` ?"
    choices:
      - {text: "`<stdexcept>`", correct: true}
      - {text: "`<exception>`", correct: false}
      - {text: "`<error>`", correct: false}
      - {text: "`<stdexception>`", correct: false}
    answer: "`<stdexcept>` déclare les exceptions à message. `<exception>` ne déclare que la racine `std::exception` et quelques utilitaires."
  - key: qcm-at
    format: multiple-choice
    question: "Quelle exception lance `v.at(10)` sur un vecteur de trois éléments ?"
    choices:
      - {text: "`std::out_of_range`", correct: true}
      - {text: "`std::invalid_argument`", correct: false}
      - {text: "`std::bad_alloc`", correct: false}
      - {text: "`std::length_error`", correct: false}
    answer: "`at()` vérifie l'indice, et lance `std::out_of_range`. `operator[]` ne vérifie rien : comportement indéfini."
  - key: qcm-sa-propre
    format: multiple-choice
    question: "De quelle classe fais-tu dériver ta propre exception `ErreurReseau` ?"
    choices:
      - {text: "`std::runtime_error`", correct: true}
      - {text: "`std::string`", correct: false}
      - {text: "`std::error_code`", correct: false}
      - {text: "Aucune : une exception ne doit pas hériter", correct: false}
    answer: "Elle hérite du message et de `what()`, et tout `catch (const std::exception&)` l'attrape. Sans classe de base standard, seul `catch (...)` la verrait."
  - key: qcm-memoire
    format: multiple-choice
    question: "Quelle exception lance `new` quand la mémoire est épuisée ?"
    choices:
      - {text: "`std::bad_alloc`", correct: true}
      - {text: "`std::out_of_range`", correct: false}
      - {text: "`std::overflow_error`", correct: false}
      - {text: "`std::length_error`", correct: false}
    answer: "`std::bad_alloc`. `std::length_error` signale une taille demandée supérieure au maximum du conteneur."
  - key: code-polymorphisme
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>

      int main() {
          try {
              throw std::out_of_range{"indice 7"};
          } catch (const std::exception& e) {
              std::println("{}", e.what());
          }
      }
      ```
    choices:
      - {text: "`indice 7`", correct: true}
      - {text: "`std::exception`", correct: false}
      - {text: "`std::out_of_range`", correct: false}
      - {text: "Rien", correct: false}
    answer: "`indice 7` : la référence désigne l'objet réellement lancé. `what()` est virtuelle : c'est la version de `std::out_of_range` qui répond."
    check:
      output: "indice 7"
  - key: code-ordre
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>

      int main() {
          try {
              throw std::invalid_argument{"x"};
          } catch (const std::runtime_error&) {
              std::println("runtime");
          } catch (const std::logic_error&) {
              std::println("logic");
          } catch (const std::exception&) {
              std::println("exception");
          }
      }
      ```
    choices:
      - {text: "`logic`", correct: true}
      - {text: "`runtime`", correct: false}
      - {text: "`exception`", correct: false}
      - {text: "`logic`, puis `exception`", correct: false}
    answer: "`logic` : `std::invalid_argument` dérive de `std::logic_error`, pas de `std::runtime_error`. Le premier `catch` compatible s'exécute, seul."
    check:
      output: "logic"
  - key: code-at
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          try {
              std::print("{} ", v.at(1));
              std::print("{} ", v.at(5));
          } catch (const std::out_of_range&) {
              std::print("hors bornes ");
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`2 hors bornes fin`", correct: true}
      - {text: "`2 0 fin`", correct: false}
      - {text: "`hors bornes fin`", correct: false}
      - {text: "`2 hors bornes`", correct: false}
    answer: "`2 hors bornes fin` : le premier `at` réussit. Le second lance `std::out_of_range`, que le `catch` traite ; le programme continue."
    check:
      output: "2 hors bornes fin"
  - key: code-propre-exception
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>

      class ErreurReseau : public std::runtime_error {
      public:
          using std::runtime_error::runtime_error;
      };

      int main() {
          try {
              throw ErreurReseau{"hôte injoignable"};
          } catch (const std::logic_error&) {
              std::println("logique");
          } catch (const std::runtime_error& e) {
              std::println("{}", e.what());
          }
      }
      ```
    choices:
      - {text: "`hôte injoignable`", correct: true}
      - {text: "`logique`", correct: false}
      - {text: "`std::runtime_error`", correct: false}
      - {text: "Rien", correct: false}
    answer: "`hôte injoignable` : `ErreurReseau` dérive de `std::runtime_error`, donc ce `catch` l'attrape, et `what()` rend le message d'origine."
    check:
      output: "hôte injoignable"
  - key: bug-par-valeur
    format: bug-fix
    question: |-
      Ce programme devrait afficher `fichier introuvable`. Il affiche `std::exception`. Quelle correction est la
      bonne ?
      ```cpp
      #include <exception>
      #include <print>
      #include <stdexcept>

      int main() {
          try {
              throw std::runtime_error{"fichier introuvable"};
          } catch (std::exception e) {
              std::println("{}", e.what());
          }
      }
      ```
    choices:
      - {text: "Attraper par référence constante : `catch (const std::exception& e)`", correct: true}
      - {text: "Attraper par pointeur : `catch (std::exception* e)`, puis `e->what()`", correct: false}
      - {text: "Lancer l'exception avec `throw new std::runtime_error{...}`", correct: false}
      - {text: "Afficher `e.message()` à la place de `e.what()`", correct: false}
    answer: |-
      ```cpp
      } catch (const std::exception& e) {
      ```
      Par valeur, l'exception est copiée dans un simple `std::exception` : la partie `std::runtime_error`, qui porte
      le message, est découpée. La référence garde l'objet d'origine.
  - key: bug-ordre-des-catch
    format: bug-fix
    question: |-
      Ce programme devrait afficher `hors bornes`. Il affiche `erreur`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <stdexcept>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          try {
              std::println("{}", v.at(9));
          } catch (const std::exception&) {
              std::println("erreur");
          } catch (const std::out_of_range&) {
              std::println("hors bornes");
          }
      }
      ```
    choices:
      - {text: "Placer le `catch` de `std::out_of_range` avant celui de `std::exception`", correct: true}
      - {text: "Remplacer `v.at(9)` par `v[9]`, sans rien changer aux deux `catch`", correct: false}
      - {text: "Retirer `const` du `catch` de `std::out_of_range`", correct: false}
      - {text: "Attraper `std::exception` par valeur, sans la référence", correct: false}
    answer: |-
      ```cpp
      } catch (const std::out_of_range&) {
          std::println("hors bornes");
      } catch (const std::exception&) {
          std::println("erreur");
      }
      ```
      `std::out_of_range` dérive de `std::exception` : le premier `catch` l'attrape, et le second n'est jamais
      atteint. On écrit le plus précis d'abord.
  - key: bug-exception-hors-hierarchie
    format: bug-fix
    question: |-
      Ce programme s'arrête brutalement : le `catch` n'attrape pas l'exception. Quelle correction est la bonne ?
      ```cpp
      #include <exception>
      #include <print>
      #include <stdexcept>
      #include <string>

      void charger() {
          throw std::string{"fichier introuvable"};
      }

      int main() {
          try {
              charger();
          } catch (const std::exception& e) {
              std::println("{}", e.what());
          }
      }
      ```
    choices:
      - {text: "Lancer `std::runtime_error{\"fichier introuvable\"}`", correct: true}
      - {text: "Lancer `\"fichier introuvable\"`, sans `std::string`", correct: false}
      - {text: "Lancer `new std::string{\"fichier introuvable\"}`", correct: false}
      - {text: "Lancer `std::string{\"fichier introuvable\"}.c_str()`", correct: false}
    answer: |-
      ```cpp
      throw std::runtime_error{"fichier introuvable"};
      ```
      `std::string` ne dérive pas de `std::exception` : le `catch` ne correspond pas. On lance toujours un objet de
      la hiérarchie standard, que tout le monde sait attraper.
  - key: bug-mauvaise-branche
    format: bug-fix
    question: |-
      Ce programme s'arrête brutalement quand la mémoire manque : le `catch` n'attrape pas `std::bad_alloc`.
      Quelle correction est la bonne ?
      ```cpp
      #include <new>
      #include <print>
      #include <stdexcept>

      int main() {
          try {
              throw std::bad_alloc{};
          } catch (const std::runtime_error&) {
              std::println("plus de mémoire");
          }
      }
      ```
    choices:
      - {text: "Attraper `const std::bad_alloc&`", correct: true}
      - {text: "Attraper `const std::logic_error&`", correct: false}
      - {text: "Attraper `const std::out_of_range&`", correct: false}
      - {text: "Attraper `const std::overflow_error&`", correct: false}
    answer: |-
      ```cpp
      } catch (const std::bad_alloc&) {
      ```
      `std::bad_alloc` dérive directement de `std::exception`, pas de `std::runtime_error`. On l'attrape par son
      type, ou par `std::exception`.
  - key: trous-reference
    format: fill-in
    question: |-
      Complète pour attraper l'exception sans la copier :
      ```cpp
      catch (const std::exception___ e) {
          std::println("{}", e.what());
      }
      ```
    blanks:
      - ["&"]
    answer: "Par référence constante : pas de copie, pas de découpage."
  - key: trous-stdexcept
    format: fill-in
    question: |-
      Complète l'en-tête qui déclare `std::runtime_error` :
      ```cpp
      #include <___>
      ```
    blanks:
      - [stdexcept]
    answer: "`<stdexcept>` déclare `std::logic_error`, `std::runtime_error` et leurs classes dérivées."
  - key: trous-heritage
    format: fill-in
    question: |-
      Complète pour que cette exception soit attrapée par `catch (const std::exception&)` :
      ```cpp
      class ErreurReseau : public std::___ {
      public:
          using std::runtime_error::runtime_error;
      };
      ```
    blanks:
      - [runtime_error]
    answer: "Elle dérive de `std::runtime_error`, dont elle reprend les constructeurs."
  - key: trous-racine
    format: fill-in
    question: |-
      Complète pour attraper toutes les exceptions standard :
      ```cpp
      catch (const std::___& e) {
          std::println("{}", e.what());
      }
      ```
    blanks:
      - [exception]
    answer: "`std::exception` est la racine de la hiérarchie."
