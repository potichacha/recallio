notion: expected-chainage
lesson: |-
  Un `std::expected<T, E>` contient une valeur, ou une erreur. Quand plusieurs étapes peuvent échouer l'une après
  l'autre, tester chaque résultat avec un `if` noie la logique sous les vérifications. C++23 donne à
  `std::expected` quatre fonctions pour **enchaîner** les étapes : l'erreur traverse la chaîne toute seule.

  ```cpp
  std::expected<int, std::string> lire(std::string_view texte);
  std::expected<int, std::string> valider(int age);

  auto resultat = lire(saisie)
                      .and_then(valider)
                      .transform([](int age) { return age + 1; });
  ```

  Si `lire` échoue, ni `valider` ni la lambda ne sont appelées : `resultat` contient l'erreur de `lire`.

  **Les quatre fonctions.**

  | Fonction | Appelée si | La fonction passée renvoie | Usage |
  |---|---|---|---|
  | `transform(f)` | il y a une valeur | une **valeur** simple | calcul qui ne peut pas échouer |
  | `and_then(f)` | il y a une valeur | un **`std::expected`** | étape qui peut échouer |
  | `or_else(f)` | il y a une erreur | un **`std::expected`** | reprise, valeur de secours |
  | `transform_error(f)` | il y a une erreur | une **erreur** d'un autre type | traduire l'erreur |

  **`transform` ou `and_then` ?** Tout tient au type de retour de la fonction passée.

  - Elle renvoie un `int` : **`transform`**, qui remet le résultat dans un `std::expected`.
  - Elle renvoie un `std::expected<int, E>` : **`and_then`**, qui le renvoie tel quel. Avec `transform`, on
    obtiendrait un `expected` dans un `expected`.

  **Chaque fonction renvoie un nouvel objet.** Aucune ne modifie l'`expected` d'origine : il faut **utiliser** le
  résultat de la chaîne.

  **Le type de l'erreur.** `and_then` exige que toutes les étapes aient le **même type d'erreur**. Pour assembler
  des fonctions aux erreurs différentes, on les aligne avec `transform_error`.

  **Sortir de la chaîne.** À la fin, on lit le résultat :

  ```cpp
  if (resultat) {
      utiliser(*resultat);
  } else {
      signaler(resultat.error());
  }
  int age = resultat.value_or(18);     // ou une valeur par défaut
  ```

  `*resultat` sans test, quand il contient une erreur, est un comportement indéfini ; `value()` lance
  `std::bad_expected_access`.

  **`std::optional`** a reçu les mêmes fonctions en C++23 : `transform`, `and_then` et `or_else`.

  **En entretien** : « `and_then` enchaîne une étape qui renvoie elle-même un `expected`, `transform` une fonction
  qui renvoie une valeur ; dès qu'une étape échoue, les suivantes sont sautées et l'erreur ressort au bout.
  `or_else` et `transform_error` travaillent du côté de l'erreur. »
cards:
  - key: principe
    format: course
    question: "Que se passe-t-il dans `lire(x).and_then(valider).transform(doubler)` quand `lire` renvoie une erreur ?"
    choices:
      - {text: "Ni `valider` ni `doubler` ne sont appelées : l'erreur de `lire` ressort au bout", correct: true}
      - {text: "`valider` et `doubler` sont appelées avec une valeur nulle, puis l'erreur ressort", correct: false}
      - {text: "Une exception `std::bad_expected_access` est lancée par `and_then`", correct: false}
      - {text: "Seule `doubler` est appelée, puisqu'elle ne peut pas échouer", correct: false}
    answer: "Chaque maillon ne s'exécute que s'il reçoit une valeur. Une erreur traverse la chaîne sans être touchée."
  - key: transform-ou-and-then
    format: course
    question: "Quelle différence entre `transform` et `and_then` sur un `std::expected` ?"
    choices:
      - {text: "`transform` reçoit une fonction qui renvoie une valeur ; `and_then`, une fonction qui renvoie un `expected`", correct: true}
      - {text: "`transform` reçoit une fonction qui renvoie un `expected` ; `and_then`, une fonction qui renvoie une valeur", correct: false}
      - {text: "`transform` s'applique à la valeur contenue ; `and_then` s'applique à l'erreur contenue", correct: false}
      - {text: "`transform` modifie l'objet en place ; `and_then` renvoie toujours un nouvel objet", correct: false}
    answer: "`transform` emballe le résultat de la fonction ; `and_then` laisse la fonction décider elle-même de réussir ou d'échouer."
  - key: or-else
    format: course
    question: "Quand la fonction passée à `or_else` est-elle appelée ?"
    choices:
      - {text: "Quand l'`expected` contient une erreur", correct: true}
      - {text: "Quand l'`expected` contient une valeur", correct: false}
      - {text: "Dans les deux cas, après les autres maillons", correct: false}
      - {text: "Quand l'`expected` est détruit", correct: false}
    answer: "`or_else` est le pendant d'`and_then` du côté de l'erreur : il permet de reprendre, par exemple avec une valeur de secours."
  - key: transform-error
    format: course
    question: "À quoi sert `transform_error` ?"
    choices:
      - {text: "À convertir l'erreur en un autre type, sans toucher à la valeur", correct: true}
      - {text: "À convertir la valeur en erreur, quand elle est invalide", correct: false}
      - {text: "À lancer l'erreur contenue sous forme d'exception", correct: false}
      - {text: "À effacer l'erreur, pour que l'`expected` contienne une valeur", correct: false}
    answer: "On s'en sert pour aligner les types d'erreur de plusieurs étapes, ou pour traduire une erreur technique en erreur du domaine."
  - key: vf-en-place
    format: true-false
    question: "`r.transform(f);` modifie l'`expected` `r` en place."
    truth: false
    answer: "`transform` renvoie un nouvel `expected`. Si l'on n'utilise pas son résultat, rien ne change."
  - key: vf-meme-erreur
    format: true-false
    question: "La fonction passée à `and_then` doit renvoyer un `expected` de même type d'erreur."
    truth: true
    answer: "L'erreur d'origine doit pouvoir traverser le maillon telle quelle. On aligne les types avec `transform_error`."
  - key: vf-optional
    format: true-false
    question: "En C++23, `std::optional` offre aussi `transform`, `and_then` et `or_else`."
    truth: true
    answer: "Les mêmes enchaînements, sans erreur à transporter : un `optional` vide traverse la chaîne."
  - key: vf-transform-erreur
    format: true-false
    question: "`transform` appelle sa fonction même quand l'`expected` contient une erreur."
    truth: false
    answer: "La fonction n'est appelée que sur une valeur. L'erreur est recopiée dans le résultat."
  - key: qcm-etape-faillible
    format: multiple-choice
    question: "`valider` a pour signature `std::expected<int, std::string> valider(int)`. Comment l'enchaînes-tu après `lire(x)` ?"
    choices:
      - {text: "`lire(x).and_then(valider)`", correct: true}
      - {text: "`lire(x).transform(valider)`", correct: false}
      - {text: "`lire(x).or_else(valider)`", correct: false}
      - {text: "`lire(x).transform_error(valider)`", correct: false}
    answer: "La fonction renvoie un `expected` : c'est `and_then`. `transform` produirait un `expected` imbriqué dans un autre."
  - key: qcm-calcul-simple
    format: multiple-choice
    question: "Tu veux doubler la valeur d'un `std::expected<int, std::string>`, sans toucher à une erreur. Quelle fonction prends-tu ?"
    choices:
      - {text: "`transform`", correct: true}
      - {text: "`and_then`", correct: false}
      - {text: "`or_else`", correct: false}
      - {text: "`value_or`", correct: false}
    answer: "Doubler ne peut pas échouer : la lambda renvoie un `int`, que `transform` remet dans un `expected`."
  - key: qcm-secours
    format: multiple-choice
    question: "Quelle fonction donne la valeur d'un `expected`, ou une valeur par défaut s'il contient une erreur ?"
    choices:
      - {text: "`value_or`", correct: true}
      - {text: "`or_else`", correct: false}
      - {text: "`error_or`", correct: false}
      - {text: "`transform`", correct: false}
    answer: "`value_or(defaut)` renvoie directement un `T`. `or_else` renvoie un `expected`, et `error_or` donne l'erreur ou une erreur par défaut."
  - key: qcm-value
    format: multiple-choice
    question: "Que fait `r.value()` quand l'`expected` `r` contient une erreur ?"
    choices:
      - {text: "Il lance `std::bad_expected_access`", correct: true}
      - {text: "Il renvoie une valeur nulle", correct: false}
      - {text: "Il renvoie l'erreur", correct: false}
      - {text: "Il termine le programme", correct: false}
    answer: "`value()` vérifie. `*r`, lui, ne vérifie rien : sur une erreur, c'est un comportement indéfini."
  - key: trous-and-then
    format: fill-in
    question: |-
      Complète pour enchaîner `valider`, qui renvoie un `std::expected<int, std::string>` :
      ```cpp
      auto resultat = lire(saisie).___(valider);
      ```
    blanks:
      - [and_then]
    answer: "`and_then` enchaîne une étape qui peut elle-même échouer."
  - key: trous-transform
    format: fill-in
    question: |-
      Complète pour ajouter 1 à la valeur, si elle existe :
      ```cpp
      auto suivant = lire(saisie).___([](int x) { return x + 1; });
      ```
    blanks:
      - [transform]
    answer: "La lambda renvoie un `int` : `transform` le remet dans un `expected`."
  - key: trous-or-else
    format: fill-in
    question: |-
      Complète pour remplacer une erreur par la valeur 0 :
      ```cpp
      auto resultat = lire(saisie).___([](const std::string&) {
          return std::expected<int, std::string>{0};
      });
      ```
    blanks:
      - [or_else]
    answer: "`or_else` n'est appelée que sur une erreur, et renvoie un nouvel `expected`."
  - key: trous-value-or
    format: fill-in
    question: |-
      Complète pour obtenir la valeur, ou 18 en cas d'erreur :
      ```cpp
      int age = lire(saisie).___(18);
      ```
    blanks:
      - [value_or]
    answer: "`value_or` renvoie la valeur contenue, ou l'argument si l'`expected` contient une erreur."
  - key: code-transform
    format: code-output
    question: |-
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<int, std::string> lire(int x) {
          if (x < 0) {
              return std::unexpected("refus");
          }
          return x;
      }

      int main() {
          const auto doubler = [](int x) { return x * 2; };
          const auto a = lire(4).transform(doubler);
          const auto b = lire(-1).transform(doubler);
          std::println("{} {} {}", *a, b.has_value(), b.error());
      }
      ```
    choices:
      - {text: "`8 false refus`", correct: true}
      - {text: "`8 true -2`", correct: false}
      - {text: "`4 false refus`", correct: false}
      - {text: "`8 false -2`", correct: false}
    answer: "`8 false refus` : la valeur 4 est doublée. Pour -1, `lire` renvoie une erreur : la lambda n'est pas appelée, et l'erreur est conservée."
    check:
      output: "8 false refus"
  - key: code-and-then
    format: code-output
    question: |-
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      int appels = 0;

      std::expected<int, std::string> moitie(int x) {
          ++appels;
          if (x % 2 != 0) {
              return std::unexpected("impair");
          }
          return x / 2;
      }

      int main() {
          const std::expected<int, std::string> depart{12};
          const auto r = depart.and_then(moitie).and_then(moitie).and_then(moitie).and_then(moitie);
          std::println("{} {}", r.error(), appels);
      }
      ```
    choices:
      - {text: "`impair 3`", correct: true}
      - {text: "`impair 4`", correct: false}
      - {text: "`impair 2`", correct: false}
      - {text: "`impair 1`", correct: false}
    answer: "`impair 3` : 12 donne 6, puis 3, et le troisième appel échoue sur 3. Le quatrième maillon reçoit une erreur : il n'appelle pas `moitie`."
    check:
      output: "impair 3"
  - key: code-or-else
    format: code-output
    question: |-
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<int, std::string> lire(int x) {
          if (x < 0) {
              return std::unexpected("refus");
          }
          return x;
      }

      int main() {
          const auto secours = [](const std::string&) { return std::expected<int, std::string>{0}; };
          const auto a = lire(-5).or_else(secours);
          const auto b = lire(7).or_else(secours);
          std::println("{} {}", *a, *b);
      }
      ```
    choices:
      - {text: "`0 7`", correct: true}
      - {text: "`-5 7`", correct: false}
      - {text: "`0 0`", correct: false}
      - {text: "`-5 0`", correct: false}
    answer: "`0 7` : `or_else` n'appelle sa fonction que sur une erreur, ici pour -5. La valeur 7 traverse sans changement."
    check:
      output: "0 7"
  - key: code-transform-error
    format: code-output
    question: |-
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<int, std::string> lire(int x) {
          if (x < 0) {
              return std::unexpected("refus");
          }
          return x;
      }

      int main() {
          const auto longueur = [](const std::string& erreur) { return erreur.size(); };
          const auto r = lire(-1).transform_error(longueur);
          std::println("{} {}", r.error(), lire(-1).value_or(-9));
      }
      ```
    choices:
      - {text: "`5 -9`", correct: true}
      - {text: "`refus -9`", correct: false}
      - {text: "`5 -1`", correct: false}
      - {text: "`0 -9`", correct: false}
    answer: "`5 -9` : `transform_error` remplace l'erreur `refus` par sa longueur, 5. `value_or` rend la valeur de secours, puisque `lire(-1)` est une erreur."
    check:
      output: "5 -9"
  - key: bug-transform-imbrique
    format: bug-fix
    question: |-
      Le compilateur refuse l'initialisation de `r` : la chaîne produit un `expected` qui contient un autre
      `expected`. Quelle correction est la bonne ?
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<int, std::string> valider(int age) {
          if (age < 0) {
              return std::unexpected("âge négatif");
          }
          return age;
      }

      int main() {
          const std::expected<int, std::string> saisie{30};
          const std::expected<int, std::string> r = saisie.transform(valider);
          std::println("{}", *r);
      }
      ```
    choices:
      - {text: "Écrire `saisie.and_then(valider)`", correct: true}
      - {text: "Écrire `saisie.or_else(valider)`", correct: false}
      - {text: "Écrire `saisie.transform_error(valider)`", correct: false}
      - {text: "Écrire `saisie.value_or(valider)`", correct: false}
    answer: |-
      ```cpp
      const std::expected<int, std::string> r = saisie.and_then(valider);
      ```
      `valider` renvoie déjà un `expected`. `transform` l'emballe une seconde fois ; `and_then` le renvoie tel quel.
  - key: bug-and-then-valeur
    format: bug-fix
    question: |-
      Le compilateur refuse cet `and_then` : la lambda ne renvoie pas un `std::expected`. Quelle correction est la
      bonne ?
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      int main() {
          const std::expected<int, std::string> prix{40};
          const auto ttc = prix.and_then([](int p) { return p * 2; });
          std::println("{}", *ttc);
      }
      ```
    choices:
      - {text: "Écrire `prix.transform(...)` avec la même lambda", correct: true}
      - {text: "Écrire `prix.or_else(...)` avec la même lambda", correct: false}
      - {text: "Écrire `prix.value_or(...)` avec la même lambda", correct: false}
      - {text: "Écrire `prix.error_or(...)` avec la même lambda", correct: false}
    answer: |-
      ```cpp
      const auto ttc = prix.transform([](int p) { return p * 2; });
      ```
      `and_then` attend une fonction qui renvoie un `expected`. Pour un calcul qui renvoie une simple valeur, c'est
      `transform`.
  - key: bug-resultat-ignore
    format: bug-fix
    question: |-
      Ce programme devrait afficher `8`. Il affiche `4`. Quelle correction est la bonne ?
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      int main() {
          std::expected<int, std::string> r{4};
          r.transform([](int x) { return x * 2; });
          std::println("{}", *r);
      }
      ```
    choices:
      - {text: "Écrire `r = r.transform(...)`, pour garder le résultat", correct: true}
      - {text: "Écrire `r.and_then(...)` avec la même lambda", correct: false}
      - {text: "Écrire `r.transform(...)` deux fois de suite", correct: false}
      - {text: "Déclarer `r` avec le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      r = r.transform([](int x) { return x * 2; });
      ```
      `transform` ne modifie pas `r` : il renvoie un nouvel `expected`, ici jeté. Il faut l'affecter, ou s'en servir
      directement.
  - key: bug-lecture-sans-test
    format: bug-fix
    question: |-
      Au bout de la chaîne, ce programme lit `*r` alors que `r` contient une erreur : son comportement est indéfini.
      Il devrait afficher `-1` en cas d'échec. Quelle correction est la bonne ?
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<int, std::string> lire(int x) {
          if (x < 0) {
              return std::unexpected("refus");
          }
          return x;
      }

      int main() {
          const auto r = lire(-3).transform([](int x) { return x + 1; });
          std::println("{}", *r);
      }
      ```
    choices:
      - {text: "Afficher `r.value_or(-1)`", correct: true}
      - {text: "Afficher `r.value()`", correct: false}
      - {text: "Afficher `r.error()`", correct: false}
      - {text: "Afficher `r.has_value()`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", r.value_or(-1));
      ```
      `*r` ne vérifie pas que l'`expected` contient une valeur. `value_or` donne la valeur ou le secours ; `value()`
      lancerait une exception, et `error()` afficherait `refus`.
