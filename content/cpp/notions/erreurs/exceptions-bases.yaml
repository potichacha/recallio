notion: exceptions-bases
lesson: |-
  Une **exception** signale une erreur qu'une fonction ne peut pas traiter elle-même. Elle interrompt le cours
  normal du programme, et remonte la chaîne des appels jusqu'à un endroit qui sait quoi faire.

  **Lancer : `throw`.**

  ```cpp
  #include <stdexcept>

  int diviser(int a, int b) {
      if (b == 0) {
          throw std::invalid_argument{"division par zéro"};
      }
      return a / b;
  }
  ```

  `throw` quitte **immédiatement** la fonction : la ligne `return` n'est pas exécutée.

  **Attraper : `try` et `catch`.**

  ```cpp
  try {
      std::println("{}", diviser(10, 0));
      std::println("jamais affiché");
  } catch (const std::invalid_argument& e) {
      std::println("erreur : {}", e.what());
  }
  std::println("le programme continue");
  ```

  - Le bloc `try` entoure le code qui peut échouer.
  - Dès qu'une exception est lancée, le **reste du `try` est sauté**.
  - Le premier `catch` dont le type **correspond** est exécuté. `what()` donne le message.
  - L'exécution reprend ensuite **après** le dernier `catch`.

  **Elle remonte.** Si la fonction qui reçoit l'exception n'a pas de `catch` qui convient, l'exception continue
  vers son appelant, puis vers l'appelant de celui-ci. Les fonctions intermédiaires n'ont rien à écrire.

  **Si personne ne l'attrape**, le programme appelle `std::terminate` et s'arrête brutalement.

  **Plusieurs `catch`.** Ils sont essayés **dans l'ordre**. `catch (...)` attrape tout, et se place en dernier.

  ```cpp
  try {
      traiter();
  } catch (const std::out_of_range& e) {
      // un indice hors bornes
  } catch (const std::exception& e) {
      // toute autre exception standard
  } catch (...) {
      // tout le reste
  }
  ```

  **Relancer.** Dans un `catch`, `throw;` seul relance l'exception en cours, intacte : on peut ainsi noter l'erreur
  puis la laisser remonter.

  **Quoi lancer.** Un objet d'une classe dérivée de `std::exception` : `std::runtime_error`,
  `std::invalid_argument`, `std::out_of_range`... On peut techniquement lancer un `int` ou une chaîne, mais on ne
  le fait pas.

  **Quand lancer.** Pour une erreur **exceptionnelle**, que l'appelant direct ne sait souvent pas traiter : fichier
  introuvable, argument invalide, mémoire épuisée. Pas pour un résultat ordinaire comme « élément non trouvé »,
  qu'un `std::optional` exprime mieux.

  **En entretien** : « `throw` lance un objet, qui remonte la pile jusqu'au premier `catch` compatible ; sans
  `catch`, c'est `std::terminate`. On lance par valeur, on attrape par référence constante. »
cards:
  - key: role
    format: course
    question: "À quoi sert une exception ?"
    choices:
      - {text: "À signaler une erreur, qui remonte les appels jusqu'à un code qui sait la traiter", correct: true}
      - {text: "À arrêter le programme sur-le-champ, sans laisser à personne la possibilité de réagir", correct: false}
      - {text: "À renvoyer une seconde valeur depuis une fonction, en plus de sa valeur de retour", correct: false}
      - {text: "À afficher un message d'avertissement, sans interrompre la fonction en cours", correct: false}
    answer: "L'exception sépare l'endroit qui détecte l'erreur de celui qui la traite. Les fonctions situées entre les deux n'ont rien à écrire."
  - key: throw
    format: course
    question: "Que se passe-t-il quand une fonction exécute `throw` ?"
    choices:
      - {text: "Elle s'interrompt aussitôt, et l'exception remonte vers son appelant", correct: true}
      - {text: "Elle termine son corps, puis signale l'erreur à son appelant", correct: false}
      - {text: "Elle renvoie la valeur zéro à son appelant, qui continue", correct: false}
      - {text: "Elle recommence depuis le début, avec les mêmes arguments", correct: false}
    answer: "Les instructions qui suivent le `throw` ne sont pas exécutées. L'exception cherche un `catch` compatible, de plus en plus haut dans la pile des appels."
  - key: non-attrapee
    format: course
    question: "Que se passe-t-il quand aucune fonction n'attrape une exception ?"
    choices:
      - {text: "Le programme appelle `std::terminate`, et s'arrête", correct: true}
      - {text: "L'exception est ignorée, et `main` continue", correct: false}
      - {text: "L'exception est relancée jusqu'à être attrapée", correct: false}
      - {text: "Le programme reprend au début de `main`", correct: false}
    answer: "Une exception qui sort de `main` sans avoir été attrapée arrête le programme, avec un message comme « terminate called after throwing an instance of... »."
  - key: apres-catch
    format: course
    question: "Où l'exécution reprend-elle après un `catch` ?"
    choices:
      - {text: "Après le dernier `catch` du bloc : le reste du `try` n'est pas repris", correct: true}
      - {text: "À la ligne du `try` qui suit celle qui a lancé l'exception", correct: false}
      - {text: "Au début du bloc `try`, qui est exécuté de nouveau", correct: false}
      - {text: "Dans la fonction qui a lancé l'exception, après le `throw`", correct: false}
    answer: "Une exception ne se « reprend » pas : ce qui restait du `try` est abandonné. Le programme continue après l'ensemble `try`/`catch`."
  - key: vf-reste-du-try
    format: true-false
    question: "Après une exception, les instructions restantes du bloc `try` sont exécutées."
    truth: false
    answer: "Elles sont sautées. L'exécution passe directement au `catch` compatible."
  - key: vf-catch-tout
    format: true-false
    question: "`catch (...)` attrape n'importe quelle exception."
    truth: true
    answer: "C'est le filet de sécurité. On le place en dernier, car les `catch` sont essayés dans l'ordre."
  - key: vf-throw-seul
    format: true-false
    question: "Dans un `catch`, `throw;` relance l'exception en cours."
    truth: true
    answer: "Elle repart intacte vers l'appelant. On s'en sert pour journaliser une erreur sans la traiter."
  - key: vf-intermediaires
    format: true-false
    question: "Chaque fonction traversée par une exception doit contenir un bloc `try`."
    truth: false
    answer: "Une fonction sans `try` laisse passer l'exception vers son appelant, sans rien écrire."
  - key: qcm-lancer
    format: multiple-choice
    question: "Quelle ligne lance une exception avec un message ?"
    choices:
      - {text: "`throw std::runtime_error{\"fichier introuvable\"};`", correct: true}
      - {text: "`raise std::runtime_error{\"fichier introuvable\"};`", correct: false}
      - {text: "`throw new std::runtime_error{\"fichier introuvable\"};`", correct: false}
      - {text: "`return std::runtime_error{\"fichier introuvable\"};`", correct: false}
    answer: "On lance un objet, par valeur. `throw new` lancerait un pointeur, qu'il faudrait libérer : c'est une habitude d'autres langages, à ne pas suivre."
  - key: qcm-message
    format: multiple-choice
    question: "Dans `catch (const std::exception& e)`, comment lis-tu le message de l'erreur ?"
    choices:
      - {text: "`e.what()`", correct: true}
      - {text: "`e.message()`", correct: false}
      - {text: "`e.text()`", correct: false}
      - {text: "`e.error()`", correct: false}
    answer: "`what()` est la fonction virtuelle de `std::exception` qui renvoie la description de l'erreur."
  - key: qcm-ordre-catch
    format: multiple-choice
    question: "Un `try` est suivi de plusieurs `catch`. Lequel est exécuté ?"
    choices:
      - {text: "Le premier, dans l'ordre d'écriture, dont le type correspond", correct: true}
      - {text: "Celui dont le type correspond le mieux, quel que soit l'ordre", correct: false}
      - {text: "Tous ceux dont le type correspond, l'un après l'autre", correct: false}
      - {text: "Le dernier, dans l'ordre d'écriture, dont le type correspond", correct: false}
    answer: "Les `catch` sont essayés de haut en bas, et un seul s'exécute. On écrit donc les types les plus précis d'abord."
  - key: qcm-quand
    format: multiple-choice
    question: "Dans quel cas une exception est-elle le bon choix ?"
    choices:
      - {text: "Un fichier de configuration indispensable est introuvable", correct: true}
      - {text: "Une recherche ne trouve pas l'élément demandé", correct: false}
      - {text: "Une boucle arrive à la fin d'un vecteur", correct: false}
      - {text: "Un utilisateur répond « non » à une question", correct: false}
    answer: "Une exception signale une situation exceptionnelle. « Non trouvé », la fin d'un parcours ou une réponse négative sont des résultats ordinaires, à renvoyer normalement."
  - key: trous-throw
    format: fill-in
    question: |-
      Complète pour lancer l'exception :
      ```cpp
      if (b == 0) {
          ___ std::invalid_argument{"division par zéro"};
      }
      ```
    blanks:
      - [throw]
    answer: "`throw` lance l'objet qui le suit."
  - key: trous-try
    format: fill-in
    question: |-
      Complète pour entourer le code qui peut échouer :
      ```cpp
      ___ {
          traiter();
      } catch (const std::exception& e) {
          std::println("{}", e.what());
      }
      ```
    blanks:
      - [try]
    answer: "Le bloc `try` délimite le code surveillé par les `catch` qui le suivent."
  - key: trous-catch
    format: fill-in
    question: |-
      Complète pour attraper l'exception :
      ```cpp
      try {
          traiter();
      } ___ (const std::runtime_error& e) {
          std::println("{}", e.what());
      }
      ```
    blanks:
      - [catch]
    answer: "`catch` déclare le type d'exception que le bloc sait traiter."
  - key: trous-what
    format: fill-in
    question: |-
      Complète pour afficher le message de l'exception :
      ```cpp
      catch (const std::exception& e) {
          std::println("{}", e.___());
      }
      ```
    blanks:
      - [what]
    answer: "`what()` renvoie le message donné à la construction de l'exception."
  - key: code-try-catch
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>

      int main() {
          try {
              std::print("a ");
              throw std::runtime_error{"oups"};
              std::print("b ");
          } catch (const std::runtime_error& e) {
              std::print("{} ", e.what());
          }
          std::println("c");
      }
      ```
    choices:
      - {text: "`a oups c`", correct: true}
      - {text: "`a b oups c`", correct: false}
      - {text: "`a oups b c`", correct: false}
      - {text: "`a oups`", correct: false}
    answer: "`a oups c` : après le `throw`, le reste du `try` est sauté. Le `catch` s'exécute, puis le programme continue après lui."
    check:
      output: "a oups c"
  - key: code-remonte
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>

      void interne() {
          throw std::runtime_error{"panne"};
      }

      void intermediaire() {
          interne();
          std::print("x ");
      }

      int main() {
          try {
              intermediaire();
          } catch (const std::runtime_error& e) {
              std::println("{}", e.what());
          }
      }
      ```
    choices:
      - {text: "`panne`", correct: true}
      - {text: "`x panne`", correct: false}
      - {text: "`panne x`", correct: false}
      - {text: "`x`", correct: false}
    answer: "`panne` : l'exception traverse `intermediaire`, qui n'a pas de `catch`. Son `print` n'est jamais atteint."
    check:
      output: "panne"
  - key: code-ordre-catch
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>

      int main() {
          try {
              throw std::out_of_range{"indice"};
          } catch (const std::invalid_argument&) {
              std::println("argument");
          } catch (const std::out_of_range&) {
              std::println("bornes");
          } catch (...) {
              std::println("autre");
          }
      }
      ```
    choices:
      - {text: "`bornes`", correct: true}
      - {text: "`argument`", correct: false}
      - {text: "`autre`", correct: false}
      - {text: "`bornes`, puis `autre`", correct: false}
    answer: "`bornes` : le premier `catch` ne correspond pas au type lancé ; le deuxième, si. Un seul `catch` s'exécute."
    check:
      output: "bornes"
  - key: code-relancer
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>

      void traiter() {
          try {
              throw std::runtime_error{"panne"};
          } catch (const std::runtime_error&) {
              std::print("note ");
              throw;
          }
      }

      int main() {
          try {
              traiter();
          } catch (const std::runtime_error& e) {
              std::println("{}", e.what());
          }
      }
      ```
    choices:
      - {text: "`note panne`", correct: true}
      - {text: "`note`", correct: false}
      - {text: "`panne`", correct: false}
      - {text: "`panne note`", correct: false}
    answer: "`note panne` : le premier `catch` affiche `note`, puis `throw;` relance la même exception, que `main` attrape."
    check:
      output: "note panne"
  - key: bug-pas-de-catch
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « terminate called after throwing an instance of 'std::invalid_argument' ». Il
      devrait afficher `erreur`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <stdexcept>

      int diviser(int a, int b) {
          if (b == 0) {
              throw std::invalid_argument{"division par zéro"};
          }
          return a / b;
      }

      int main() {
          std::println("{}", diviser(10, 0));
      }
      ```
    choices:
      - {text: "Entourer l'appel d'un `try`, suivi d'un `catch (const std::invalid_argument&)`", correct: true}
      - {text: "Remplacer `throw` par `return` dans la fonction `diviser`", correct: false}
      - {text: "Déclarer la fonction `diviser` avec le mot-clé `noexcept`", correct: false}
      - {text: "Ajouter `return 0;` à la fin de la fonction `main`", correct: false}
    answer: |-
      ```cpp
      try {
          std::println("{}", diviser(10, 0));
      } catch (const std::invalid_argument&) {
          std::println("erreur");
      }
      ```
      Personne n'attrape l'exception : le programme est arrêté par `std::terminate`. `noexcept` aggraverait les
      choses : il promet qu'aucune exception ne sortira.
  - key: bug-mauvais-type
    format: bug-fix
    question: |-
      Ce programme s'arrête brutalement, malgré son `catch`. Il devrait afficher `erreur`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <stdexcept>

      int main() {
          try {
              throw std::runtime_error{"panne"};
          } catch (const std::invalid_argument&) {
              std::println("erreur");
          }
      }
      ```
    choices:
      - {text: "Attraper `const std::runtime_error&`", correct: true}
      - {text: "Attraper `const std::string&`", correct: false}
      - {text: "Attraper `const std::out_of_range&`", correct: false}
      - {text: "Attraper `const char*`", correct: false}
    answer: |-
      ```cpp
      } catch (const std::runtime_error&) {
      ```
      Un `catch` ne s'exécute que si son type correspond à l'objet lancé. `std::runtime_error` n'est pas un
      `std::invalid_argument` : l'exception continue, et personne d'autre ne l'attrape.
  - key: bug-catch-tout-en-premier
    format: bug-fix
    question: |-
      Le compilateur refuse ce code : « '...' handler must be the last handler for its try block ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>
      #include <stdexcept>

      int main() {
          try {
              throw std::runtime_error{"panne"};
          } catch (...) {
              std::println("inconnue");
          } catch (const std::runtime_error& e) {
              std::println("{}", e.what());
          }
      }
      ```
    choices:
      - {text: "Placer `catch (...)` après le `catch` de `std::runtime_error`", correct: true}
      - {text: "Écrire `catch ()` à la place de `catch (...)`", correct: false}
      - {text: "Écrire `catch (auto)` à la place de `catch (...)`", correct: false}
      - {text: "Placer un second bloc `try` entre les deux `catch`", correct: false}
    answer: |-
      ```cpp
      } catch (const std::runtime_error& e) {
          std::println("{}", e.what());
      } catch (...) {
          std::println("inconnue");
      }
      ```
      Les `catch` sont essayés dans l'ordre, et `catch (...)` attrape tout : placé en premier, il rendrait les
      suivants inutiles. Il doit être le dernier.
  - key: bug-code-apres-throw
    format: bug-fix
    question: |-
      Cette fonction devrait afficher `fermé` même quand la valeur est négative. Dans ce cas, elle ne l'affiche pas.
      Pourquoi ?
      ```cpp
      #include <print>
      #include <stdexcept>

      void verifier(int valeur) {
          std::println("ouvert");
          if (valeur < 0) {
              throw std::invalid_argument{"valeur négative"};
          }
          std::println("fermé");
      }

      int main() {
          try {
              verifier(-1);
          } catch (const std::invalid_argument&) {
              std::println("refusé");
          }
      }
      ```
    choices:
      - {text: "`throw` quitte la fonction aussitôt : la ligne suivante n'est pas exécutée", correct: true}
      - {text: "`std::println` est désactivé tant qu'une exception est en cours", correct: false}
      - {text: "Le `catch` de `main` annule les affichages de la fonction", correct: false}
      - {text: "`valeur < 0` est toujours faux pour un paramètre de type `int`", correct: false}
    answer: |-
      ```cpp
      std::println("ouvert");
      std::println("fermé");
      if (valeur < 0) {
      ```
      Tout ce qui suit le `throw` est sauté. Un nettoyage qui doit toujours avoir lieu se place avant, ou mieux, dans
      le destructeur d'un objet local (RAII).
