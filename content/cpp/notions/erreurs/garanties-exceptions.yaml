notion: garanties-exceptions
lesson: |-
  Quand une fonction lance une exception, dans quel **état** laisse-t-elle le programme ? La réponse s'appelle sa
  **garantie face aux exceptions** (*exception safety*). Il en existe trois niveaux, plus leur absence.

  | Garantie | Ce qu'elle promet si une exception est lancée |
  |---|---|
  | **Sans échec** (*nothrow*) | il n'y a pas d'exception : l'opération réussit toujours |
  | **Forte** | l'état est **exactement celui d'avant** l'appel : tout ou rien |
  | **De base** | aucune fuite, les invariants tiennent, les objets restent utilisables ; mais leur valeur a pu changer |
  | **Aucune** | fuites, objets corrompus : à proscrire |

  **La garantie de base** est le minimum exigible. Elle vient presque toute seule avec **RAII** : si chaque
  ressource est tenue par un objet, le déroulement de la pile libère tout.

  ```cpp
  void ajouter(std::vector<Client>& clients, std::vector<Facture>& factures, ...) {
      clients.push_back(client);
      factures.push_back(facture);     // si ceci lance, le client est ajouté sans sa facture
  }
  ```

  Rien ne fuit, chaque vecteur est valide : garantie de base. Mais l'opération est faite **à moitié**.

  **La garantie forte** se construit en trois temps : **préparer à côté**, tout ce qui peut échouer ; puis
  **valider** par des opérations qui ne lancent pas.

  ```cpp
  void remplacer(std::vector<int>& cible, const std::vector<int>& source) {
      std::vector<int> copie{source};     // peut lancer : cible n'a pas été touchée
      cible.swap(copie);                  // ne lance pas : la modification est acquise
  }
  ```

  C'est l'idiome **copier puis échanger** (*copy and swap*), qui sert aussi à écrire un opérateur d'affectation
  sûr.

  **La garantie sans échec** est celle des **destructeurs**, de `swap`, des opérations de **déplacement** : on la
  déclare avec `noexcept`. Elle est la brique des deux autres : on ne peut valider ou nettoyer qu'avec des
  opérations qui ne lancent pas.

  **Dans la bibliothèque standard.**

  - `v.push_back(x)` offre la garantie **forte** : s'il échoue, le vecteur est inchangé. C'est pourquoi il ne
    déplace ses éléments en réallouant que si leur déplacement est `noexcept`.
  - `v.insert` au milieu n'offre que la garantie de base, sauf cas particuliers.
  - `v.pop_back()`, `v.swap(autre)`, `v.clear()` ne lancent pas.
  - `std::make_unique` et `std::make_shared` évitent une fuite qu'un `new` écrit dans une liste d'arguments pouvait
    provoquer avant C++17.

  **Les fautes classiques.**

  - Modifier l'état **avant** l'opération qui peut échouer (incrémenter un compteur, puis allouer).
  - Tenir une ressource par un **pointeur brut** : l'exception saute le `delete`.
  - Un `pop()` qui **renvoie** l'élément retiré par valeur : si la copie lance, l'élément est perdu. D'où
    `top()` et `pop()` séparés dans `std::stack`.

  **Quel niveau viser.** La garantie de base **partout**. La garantie forte là où un état à moitié modifié serait
  inacceptable, et quand elle ne coûte pas trop cher (elle demande souvent une copie). La garantie sans échec pour
  les destructeurs, les déplacements et `swap`.

  **En entretien** : « Trois niveaux : de base, sans fuite et avec des invariants intacts ; forte, tout ou rien ;
  sans échec, `noexcept`. RAII donne la garantie de base ; pour la forte, je prépare à côté puis je valide par un
  `swap` qui ne lance pas. »
cards:
  - key: trois-niveaux
    format: course
    question: "Que promet la garantie forte face aux exceptions ?"
    choices:
      - {text: "Si l'opération lance, l'état du programme est exactement celui d'avant l'appel", correct: true}
      - {text: "Si l'opération lance, aucune ressource ne fuit, mais les valeurs ont pu changer", correct: false}
      - {text: "L'opération ne lance jamais d'exception, quelles que soient les circonstances", correct: false}
      - {text: "Si l'opération lance, le programme s'arrête avant d'avoir rien modifié", correct: false}
    answer: "C'est le « tout ou rien » : l'opération réussit entièrement, ou n'a aucun effet. La garantie de base promet seulement un état valide, pas l'état d'origine."
  - key: garantie-de-base
    format: course
    question: "Que promet la garantie de base face aux exceptions ?"
    choices:
      - {text: "Aucune fuite, et des objets valides et utilisables, dont la valeur a pu changer", correct: true}
      - {text: "Des objets revenus exactement à leur valeur d'avant l'appel", correct: false}
      - {text: "Aucune exception lancée, dans aucun cas", correct: false}
      - {text: "Un message d'erreur écrit dans le journal avant l'exception", correct: false}
    answer: "Les invariants tiennent : on peut continuer à utiliser les objets, ou les détruire. Mais l'opération a pu être faite à moitié."
  - key: copier-puis-echanger
    format: course
    question: "Comment obtient-on la garantie forte avec l'idiome « copier puis échanger » ?"
    choices:
      - {text: "On fait à côté tout ce qui peut lancer, puis on valide par un `swap` qui ne lance pas", correct: true}
      - {text: "On échange d'abord les deux objets, puis on copie ce qui manque dans chacun", correct: false}
      - {text: "On copie l'objet deux fois, et l'on garde la copie qui n'a pas lancé d'exception", correct: false}
      - {text: "On entoure chaque modification d'un `try` qui relance l'exception avec `throw;`", correct: false}
    answer: "Tant que le travail risqué porte sur une copie, l'original est intact. L'échange final ne peut pas échouer : la modification est acquise d'un seul coup."
  - key: sans-echec
    format: course
    question: "Quelles opérations doivent offrir la garantie sans échec ?"
    choices:
      - {text: "Les destructeurs, `swap` et les opérations de déplacement", correct: true}
      - {text: "Les constructeurs de copie et les allocations de mémoire", correct: false}
      - {text: "Les lectures de fichiers et les conversions de chaînes", correct: false}
      - {text: "Toutes les fonctions membres déclarées `const`", correct: false}
    answer: "Ce sont elles qui servent à nettoyer et à valider. Si elles pouvaient lancer, aucune garantie plus forte ne pourrait être construite au-dessus."
  - key: vf-raii
    format: true-false
    question: "Tenir chaque ressource par un objet RAII suffit, le plus souvent, à obtenir la garantie de base."
    truth: true
    answer: "Le déroulement de la pile détruit les objets locaux : rien ne fuit. Il reste à ne pas laisser d'invariant cassé."
  - key: vf-push-back
    format: true-false
    question: "Si `v.push_back(x)` lance une exception, le vecteur est laissé dans son état d'avant l'appel."
    truth: true
    answer: "`push_back` offre la garantie forte. C'est pour la tenir que le vecteur copie ses éléments quand leur déplacement n'est pas `noexcept`."
  - key: vf-forte-partout
    format: true-false
    question: "Il faut viser la garantie forte pour toutes les fonctions d'un programme."
    truth: false
    answer: "Elle coûte souvent une copie. On vise la garantie de base partout, et la forte là où un état à moitié modifié serait inacceptable."
  - key: vf-base-valeur
    format: true-false
    question: "Avec la garantie de base, un objet garde toujours sa valeur d'avant l'appel."
    truth: false
    answer: "Il reste valide et utilisable, mais sa valeur a pu changer. Garder la valeur d'origine, c'est la garantie forte."
  - key: qcm-swap
    format: multiple-choice
    question: "Laquelle de ces opérations sur un `std::vector` ne lance jamais d'exception ?"
    choices:
      - {text: "`v.swap(autre)`", correct: true}
      - {text: "`v.push_back(x)`", correct: false}
      - {text: "`v.at(i)`", correct: false}
      - {text: "`v.reserve(n)`", correct: false}
    answer: "`swap` échange trois pointeurs. `push_back` et `reserve` peuvent manquer de mémoire, `at` lance pour un indice invalide."
  - key: qcm-niveau
    format: multiple-choice
    question: "Une fonction ajoute un client, puis lance en ajoutant sa facture. Rien ne fuit, mais le client reste ajouté. Quelle garantie offre-t-elle ?"
    choices:
      - {text: "La garantie de base", correct: true}
      - {text: "La garantie forte", correct: false}
      - {text: "La garantie sans échec", correct: false}
      - {text: "Aucune garantie", correct: false}
    answer: "Les objets sont valides et rien ne fuit, mais l'opération est faite à moitié : ce n'est pas la garantie forte."
  - key: qcm-stack
    format: multiple-choice
    question: "Pourquoi `std::stack` sépare-t-elle `top()`, qui lit, de `pop()`, qui retire sans rien renvoyer ?"
    choices:
      - {text: "Un `pop()` qui renvoie par valeur perdrait l'élément si sa copie lançait", correct: true}
      - {text: "Un `pop()` qui renvoie par valeur serait interdit par le standard", correct: false}
      - {text: "Une pile ne sait pas lire et retirer dans la même fonction", correct: false}
      - {text: "Deux fonctions s'exécutent plus vite qu'une seule", correct: false}
    answer: "L'élément serait déjà retiré quand la copie vers l'appelant échoue. En séparant les deux, on lit d'abord, on retire ensuite, sans rien perdre."
  - key: qcm-ordre
    format: multiple-choice
    question: "Dans quel ordre écrit-on une fonction qui vise la garantie forte ?"
    choices:
      - {text: "Ce qui peut lancer d'abord, sur des copies ; puis les modifications, sans lancer", correct: true}
      - {text: "Les modifications d'abord ; puis ce qui peut lancer, en dernier", correct: false}
      - {text: "Les modifications et ce qui peut lancer, en alternance", correct: false}
      - {text: "Peu importe l'ordre, si un `catch (...)` entoure la fonction", correct: false}
    answer: "Tant qu'une exception est possible, l'état visible ne doit pas avoir changé. On ne modifie qu'une fois le risque passé."
  - key: situation-virement
    format: scenario
    question: |-
      Une fonction `virer` débite un compte, puis crédite l'autre. Le crédit peut lancer une exception. Quand cela
      arrive, l'argent a disparu. Quelle garantie manque, et comment l'obtenir ?
    choices:
      - {text: "La garantie forte : calculer les deux nouveaux soldes à côté, puis les écrire sans lancer", correct: true}
      - {text: "La garantie de base : tenir les deux comptes par des `std::unique_ptr`", correct: false}
      - {text: "La garantie sans échec : déclarer la fonction `virer` avec `noexcept`", correct: false}
      - {text: "Aucune : il suffit d'un `catch (...)` vide autour du crédit", correct: false}
    answer: |-
      Un virement est tout ou rien. On fait d'abord tout ce qui peut échouer, sans toucher aux comptes ; puis on
      écrit les deux soldes par des affectations d'entiers, qui ne lancent pas. Déclarer `noexcept` ne ferait
      qu'arrêter le programme.
  - key: situation-affectation
    format: scenario
    question: |-
      L'opérateur d'affectation d'une classe `Tampon` libère d'abord son tableau, puis alloue le nouveau et y
      copie les données. Quand l'allocation échoue, l'objet désigne une mémoire libérée. Que proposes-tu ?
    choices:
      - {text: "Construire d'abord une copie de la source, puis l'échanger avec l'objet par un `swap`", correct: true}
      - {text: "Libérer le tableau deux fois, pour être certain qu'il ne reste rien de l'ancien", correct: false}
      - {text: "Attraper l'exception dans l'opérateur, et laisser l'objet tel qu'il est", correct: false}
      - {text: "Déclarer l'opérateur d'affectation `noexcept`, pour interdire l'échec", correct: false}
    answer: |-
      C'est l'idiome copier puis échanger. Si la copie lance, l'objet n'a pas été touché : garantie forte.
      L'ancien tableau est libéré par le destructeur de la copie temporaire, après l'échange.
  - key: situation-compteur
    format: scenario
    question: |-
      Une classe `Registre` incrémente son compteur d'entrées, puis fait `entrees_.push_back(entree)`. Quand
      l'ajout manque de mémoire, le compteur vaut un de plus que le nombre d'entrées. Que changes-tu ?
    choices:
      - {text: "L'ordre : l'ajout d'abord, qui peut lancer ; l'incrémentation ensuite, qui ne lance pas", correct: true}
      - {text: "Le type du compteur : un `std::atomic<int>` à la place d'un `int`", correct: false}
      - {text: "La fonction : un `noexcept` sur la fonction qui ajoute l'entrée", correct: false}
      - {text: "Le conteneur : une `std::list` à la place du `std::vector`", correct: false}
    answer: |-
      L'invariant « le compteur égale le nombre d'entrées » est cassé parce que l'état a changé avant l'opération
      risquée. En modifiant après, l'exception laisse l'objet cohérent. Mieux : supprimer le compteur, et lire
      `entrees_.size()`.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande : « Ta fonction modifie trois conteneurs. Comment lui donner la garantie
      forte ? » Que réponds-tu ?
    choices:
      - {text: "Je modifie des copies des trois, puis je les échange avec les originaux par des `swap`", correct: true}
      - {text: "Je modifie les trois directement, dans un `try` dont le `catch` ignore l'exception", correct: false}
      - {text: "Je modifie les trois directement, dans une fonction déclarée `noexcept`", correct: false}
      - {text: "Je modifie les trois dans trois threads, pour qu'un échec n'arrête pas les autres", correct: false}
    answer: |-
      Tout le travail qui peut échouer se fait sur des copies. Les trois `swap` finaux ne lancent pas : les
      conteneurs changent tous, ou aucun. Le prix est la copie : on ne paie la garantie forte que là où elle
      compte.
  - key: bug-pointeur-brut
    format: bug-fix
    question: |-
      Ce programme devrait afficher `libérée` avant `erreur`. Il n'affiche que `erreur` : quand `valider` lance, la
      ressource fuit. Quelle correction donne la garantie de base ?
      ```cpp
      #include <print>
      #include <stdexcept>

      struct Ressource {
          ~Ressource() { std::println("libérée"); }
      };

      void valider(bool ok) {
          if (!ok) {
              throw std::invalid_argument{"invalide"};
          }
      }

      void traiter() {
          Ressource* r = new Ressource{};
          valider(false);
          delete r;
      }

      int main() {
          try {
              traiter();
          } catch (const std::invalid_argument&) {
              std::println("erreur");
          }
      }
      ```
    choices:
      - {text: "Écrire `auto r = std::make_unique<Ressource>();`, et retirer le `delete`", correct: true}
      - {text: "Écrire `delete r;` une seconde fois, dans le `catch` de la fonction `main`", correct: false}
      - {text: "Déclarer la fonction `traiter` avec le mot-clé `noexcept`", correct: false}
      - {text: "Déclarer le destructeur de `Ressource` avec le mot-clé `virtual`", correct: false}
    answer: |-
      ```cpp
      void traiter() {
          auto r = std::make_unique<Ressource>();
          valider(false);
      }
      ```
      L'exception saute le `delete`. Tenue par un `std::unique_ptr`, la ressource est libérée par le déroulement de
      la pile : plus de fuite, c'est la garantie de base.
  - key: bug-modification-avant
    format: bug-fix
    question: |-
      Ce programme devrait afficher `0 0` : l'ajout a échoué, le registre devrait être inchangé. Il affiche `1 0`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <stdexcept>
      #include <string>
      #include <vector>

      class Registre {
      public:
          void ajouter(const std::string& nom) {
              ++compteur_;
              if (nom.empty()) {
                  throw std::invalid_argument{"nom vide"};
              }
              noms_.push_back(nom);
          }
          int compteur() const { return compteur_; }
          std::size_t taille() const { return noms_.size(); }

      private:
          int compteur_ = 0;
          std::vector<std::string> noms_;
      };

      int main() {
          Registre registre;
          try {
              registre.ajouter("");
          } catch (const std::invalid_argument&) {
          }
          std::println("{} {}", registre.compteur(), registre.taille());
      }
      ```
    choices:
      - {text: "Placer `++compteur_;` après le `push_back`, à la fin de la fonction", correct: true}
      - {text: "Placer `--compteur_;` avant le `throw`, dans le `if`, et rien d'autre", correct: false}
      - {text: "Déclarer `compteur_` avec le type `unsigned` à la place de `int`", correct: false}
      - {text: "Déclarer la fonction `ajouter` avec le mot-clé `noexcept`", correct: false}
    answer: |-
      ```cpp
      void ajouter(const std::string& nom) {
          if (nom.empty()) {
              throw std::invalid_argument{"nom vide"};
          }
          noms_.push_back(nom);
          ++compteur_;
      }
      ```
      L'état est modifié avant ce qui peut échouer. En incrémentant en dernier, toute exception laisse l'objet
      intact : le `push_back` lui-même offre la garantie forte. Décrémenter avant le `throw` oublierait le cas où
      c'est `push_back` qui lance.
  - key: bug-affectation-non-sure
    format: bug-fix
    question: |-
      Cette fonction remplace le contenu de `cible` par les carrés de `source`. Quand un carré est refusé, `cible`
      est à moitié remplie : le programme affiche `2` au lieu de `3`. Quelle correction donne la garantie forte ?
      ```cpp
      #include <print>
      #include <stdexcept>
      #include <vector>

      int carre(int n) {
          if (n < 0) {
              throw std::invalid_argument{"négatif"};
          }
          return n * n;
      }

      void remplacer(std::vector<int>& cible, const std::vector<int>& source) {
          cible.clear();
          for (int n : source) {
              cible.push_back(carre(n));
          }
      }

      int main() {
          std::vector<int> cible{7, 8, 9};
          try {
              remplacer(cible, {1, 2, -3});
          } catch (const std::invalid_argument&) {
          }
          std::println("{}", cible.size());
      }
      ```
    choices:
      - {text: "Remplir un vecteur local, puis l'échanger avec `cible` par `cible.swap(resultat);`", correct: true}
      - {text: "Appeler `cible.clear();` une seconde fois, à la fin de la fonction `remplacer`", correct: false}
      - {text: "Appeler `cible.reserve(source.size());` avant la boucle, sans rien changer d'autre", correct: false}
      - {text: "Déclarer la fonction `carre` avec le mot-clé `noexcept`", correct: false}
    answer: |-
      ```cpp
      void remplacer(std::vector<int>& cible, const std::vector<int>& source) {
          std::vector<int> resultat;
          for (int n : source) {
              resultat.push_back(carre(n));
          }
          cible.swap(resultat);
      }
      ```
      Le travail risqué se fait sur un vecteur local. Si `carre` lance, `cible` n'a pas été touchée. L'échange
      final ne lance pas.
  - key: bug-pop-renvoie
    format: bug-fix
    question: |-
      Cette pile retire l'élément, puis le renvoie par valeur. Si la copie vers l'appelant lançait, l'élément serait
      perdu. Quelle correction suit l'exemple de `std::stack` ?
      ```cpp
      #include <print>
      #include <string>
      #include <vector>

      class Pile {
      public:
          void empiler(const std::string& s) { elements_.push_back(s); }
          std::string depiler() {
              std::string dernier = elements_.back();
              elements_.pop_back();
              return dernier;
          }

      private:
          std::vector<std::string> elements_;
      };

      int main() {
          Pile pile;
          pile.empiler("a");
          std::println("{}", pile.depiler());
      }
      ```
    choices:
      - {text: "Offrir deux fonctions : `sommet()`, qui lit, et `depiler()`, qui retire sans rien renvoyer", correct: true}
      - {text: "Renvoyer `std::string&` depuis `depiler()`, une référence vers l'élément retiré", correct: false}
      - {text: "Appeler `elements_.pop_back();` avant de lire `elements_.back()`", correct: false}
      - {text: "Déclarer la fonction `depiler()` avec le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      const std::string& sommet() const { return elements_.back(); }
      void depiler() { elements_.pop_back(); }
      ```
      L'appelant copie d'abord le sommet ; si cette copie lance, la pile est intacte. Il retire ensuite, par une
      opération qui ne lance pas. Renvoyer une référence vers un élément retiré serait pendant.
