notion: erreurs-strategies
lesson: |-
  C++ offre plusieurs façons de signaler qu'une opération a échoué. Aucune n'est la bonne partout : on choisit
  selon **la fréquence** de l'échec, et selon **qui** peut le traiter.

  | Mécanisme | Ce qu'il dit | Coût | Peut-on l'ignorer ? |
  |---|---|---|---|
  | Exception | une erreur rare, traitée loin | nul sans erreur, élevé quand elle est lancée | non : elle remonte |
  | `std::optional<T>` | une valeur, ou rien | celui d'un booléen | l'appelant doit tester |
  | `std::expected<T, E>` (C++23) | une valeur, ou une erreur décrite | celui d'un booléen | l'appelant doit tester |
  | Code d'erreur (`int`, `enum`) | réussite ou échec | nul | oui, trop facilement |
  | `assert` | une faute de programmation | nul en production | arrête le programme en débogage |

  **L'exception** convient à l'échec **exceptionnel**, que l'appelant direct ne sait pas traiter : fichier de
  configuration absent, mémoire épuisée, constructeur qui ne peut pas établir son invariant. Un constructeur n'a
  pas de valeur de retour : l'exception est sa seule façon d'échouer.

  **`std::optional`** convient quand l'absence de résultat est **normale**, et que sa cause est évidente : chercher
  un élément, lire une valeur facultative.

  ```cpp
  std::optional<Utilisateur> trouver(int id);
  ```

  **`std::expected`** convient quand l'échec est **courant** et que l'appelant veut savoir **pourquoi** : analyser
  une saisie, valider une requête.

  ```cpp
  std::expected<int, std::string> lire_age(std::string_view texte);

  if (auto age = lire_age(saisie)) {
      utiliser(*age);
  } else {
      std::println("{}", age.error());
  }
  ```

  **Le code d'erreur** reste utile aux frontières : une API C, un code qui interdit les exceptions (embarqué,
  temps réel). Son défaut : l'appelant peut l'oublier. `[[nodiscard]]` sur la fonction fait avertir le compilateur
  quand le résultat est ignoré.

  **`assert`** ne signale pas une erreur d'exécution : il vérifie une hypothèse du programmeur (« cet indice est
  valide »). Si elle est fausse, c'est un bug à corriger, pas une situation à traiter.

  **Pour choisir.**

  1. Est-ce une faute de programmation ? `assert`.
  2. L'échec est-il courant, et traité par l'appelant direct ? `std::optional`, ou `std::expected` s'il faut dire
     pourquoi.
  3. Est-il rare, ou traité plusieurs niveaux plus haut ? Une exception.

  **Ne pas mélanger au hasard.** Un même module qui lance ici, renvoie `false` là et `-1` ailleurs est pénible à
  utiliser. On choisit une convention par couche.

  **En entretien** : « Une exception pour l'exceptionnel, qui se traite loin ; `std::optional` pour une absence
  normale ; `std::expected` quand l'échec est courant et qu'il faut sa cause ; `assert` pour les bugs. Ce que
  j'évite : le code d'erreur qu'on peut ignorer. »
cards:
  - key: exception-quand
    format: course
    question: "Dans quel cas une exception est-elle le bon moyen de signaler un échec ?"
    choices:
      - {text: "L'échec est rare, et se traite plusieurs appels plus haut", correct: true}
      - {text: "L'échec est fréquent, et se traite dans l'appelant direct", correct: false}
      - {text: "L'échec est une faute de programmation à corriger", correct: false}
      - {text: "L'échec est normal, comme une recherche sans résultat", correct: false}
    answer: "Une exception ne coûte rien tant qu'elle n'est pas lancée, et remonte sans que les fonctions intermédiaires écrivent une ligne. Lancée souvent, elle coûte cher et obscurcit le code."
  - key: optional-quand
    format: course
    question: "Quand `std::optional` convient-il mieux qu'une exception ?"
    choices:
      - {text: "Quand l'absence de résultat est normale, et que sa cause est évidente", correct: true}
      - {text: "Quand l'appelant a besoin de connaître la cause précise de l'échec", correct: false}
      - {text: "Quand l'échec doit remonter jusqu'à la fonction `main`", correct: false}
      - {text: "Quand un constructeur ne peut pas initialiser son objet", correct: false}
    answer: "Chercher un élément qui n'existe pas n'est pas une erreur. `std::optional` dit « une valeur, ou rien », et oblige l'appelant à envisager les deux cas."
  - key: expected
    format: course
    question: "Qu'apporte `std::expected<T, E>` (C++23) par rapport à `std::optional<T>` ?"
    choices:
      - {text: "En cas d'échec, il contient une erreur qui dit pourquoi", correct: true}
      - {text: "En cas d'échec, il lance une exception à la place de l'appelant", correct: false}
      - {text: "En cas de réussite, il contient deux valeurs au lieu d'une", correct: false}
      - {text: "En cas de réussite, il évite la copie de la valeur", correct: false}
    answer: "`std::optional` vide ne dit rien de la cause. `std::expected` contient soit la valeur, soit un objet erreur, lu avec `error()`."
  - key: code-erreur-defaut
    format: course
    question: "Quel est le principal défaut d'un code d'erreur renvoyé par une fonction ?"
    choices:
      - {text: "L'appelant peut l'ignorer sans que rien ne le signale", correct: true}
      - {text: "Il ralentit la fonction, même quand elle réussit", correct: false}
      - {text: "Il ne peut pas être renvoyé par une fonction membre", correct: false}
      - {text: "Il arrête le programme quand il n'est pas testé", correct: false}
    answer: "Un `int` renvoyé et non lu passe inaperçu : l'erreur est perdue. `[[nodiscard]]` fait au moins avertir le compilateur."
  - key: vf-constructeur
    format: true-false
    question: "Un constructeur qui ne peut pas initialiser son objet signale l'échec par une exception."
    truth: true
    answer: "Il n'a pas de valeur de retour. L'exception évite de laisser un objet à moitié construit."
  - key: vf-assert
    format: true-false
    question: "`assert` sert à traiter les erreurs de saisie de l'utilisateur."
    truth: false
    answer: "`assert` vérifie une hypothèse du programmeur, et disparaît en production (`NDEBUG`). Une saisie invalide est une situation normale, à traiter par le code."
  - key: vf-exception-cout
    format: true-false
    question: "Avec les compilateurs actuels, un bloc `try` ne coûte presque rien tant qu'aucune exception n'est lancée."
    truth: true
    answer: "C'est le modèle « à coût nul » : le chemin sans erreur n'est pas ralenti. C'est lancer et attraper qui coûte cher."
  - key: vf-optional-cause
    format: true-false
    question: "Un `std::optional` vide indique la cause de l'absence de valeur."
    truth: false
    answer: "Il dit seulement « rien ». Pour transmettre une cause, on prend `std::expected`, ou une exception."
  - key: qcm-recherche
    format: multiple-choice
    question: "Quel type de retour convient à une fonction qui cherche un client par son numéro ?"
    choices:
      - {text: "`std::optional<Client>`", correct: true}
      - {text: "`Client`, avec une exception si le numéro est inconnu", correct: false}
      - {text: "`Client*`, alloué avec `new`", correct: false}
      - {text: "`int`, qui vaut `-1` si le numéro est inconnu", correct: false}
    answer: "Ne pas trouver est un résultat normal d'une recherche. `std::optional` l'exprime dans le type."
  - key: qcm-analyse
    format: multiple-choice
    question: "Une fonction analyse une date saisie par l'utilisateur, et doit dire ce qui ne va pas. Quel type de retour convient ?"
    choices:
      - {text: "`std::expected<Date, std::string>`", correct: true}
      - {text: "`std::optional<Date>`", correct: false}
      - {text: "`bool`", correct: false}
      - {text: "`void`, avec un `assert` sur la saisie", correct: false}
    answer: "Une saisie invalide est courante, et l'appelant veut afficher la cause. `std::expected` porte soit la date, soit le message."
  - key: qcm-nodiscard
    format: multiple-choice
    question: "Quel attribut fait avertir le compilateur quand la valeur de retour d'une fonction est ignorée ?"
    choices:
      - {text: "`[[nodiscard]]`", correct: true}
      - {text: "`[[noreturn]]`", correct: false}
      - {text: "`[[maybe_unused]]`", correct: false}
      - {text: "`[[deprecated]]`", correct: false}
    answer: "`[[nodiscard]]` protège les fonctions dont le résultat porte une erreur : l'oublier devient un avertissement."
  - key: qcm-precondition
    format: multiple-choice
    question: "Une fonction interne suppose que son argument n'est jamais nul. Comment vérifies-tu cette hypothèse ?"
    choices:
      - {text: "Avec `assert(p != nullptr);`", correct: true}
      - {text: "Avec un `std::optional` en valeur de retour", correct: false}
      - {text: "Avec un `catch (...)` autour de la fonction", correct: false}
      - {text: "Avec un code d'erreur que l'appelant testera", correct: false}
    answer: "Un pointeur nul serait ici un bug de l'appelant. `assert` le révèle pendant le développement, sans alourdir la production."
  - key: situation-configuration
    format: scenario
    question: |-
      Au démarrage, ton service lit un fichier de configuration indispensable, à travers quatre fonctions
      imbriquées. S'il manque, seul `main` peut réagir, en affichant un message et en quittant. Comment signales-tu
      l'absence du fichier ?
    choices:
      - {text: "Par une exception, que `main` attrape", correct: true}
      - {text: "Par un `std::optional`, que chacune des quatre fonctions teste et renvoie", correct: false}
      - {text: "Par un `assert` sur l'existence du fichier", correct: false}
      - {text: "Par un code `-1`, que chacune des quatre fonctions transmet", correct: false}
    answer: |-
      L'échec est rare, et se traite loin de l'endroit qui le détecte : c'est le cas d'école de l'exception. Les
      fonctions intermédiaires n'ont rien à écrire. Un `assert` disparaîtrait en production, alors qu'un fichier
      manquant n'est pas un bug.
  - key: situation-boucle-chaude
    format: scenario
    question: |-
      Une fonction convertit des millions de lignes d'un fichier en nombres. Une ligne sur dix est mal formée, et
      doit simplement être ignorée. La conversion lance une exception à chaque ligne invalide, et le traitement est
      lent. Que proposes-tu ?
    choices:
      - {text: "Renvoyer un `std::optional` ou un `std::expected` : l'échec est ici courant", correct: true}
      - {text: "Attraper l'exception avec `catch (...)`, plus rapide qu'un `catch` typé", correct: false}
      - {text: "Déclarer la conversion `noexcept`, pour accélérer les exceptions", correct: false}
      - {text: "Remplacer l'exception par un `assert` sur le format de la ligne", correct: false}
    answer: |-
      Lancer et attraper une exception coûte des milliers de fois plus qu'un retour de fonction. Quand l'échec est
      fréquent et traité sur place, il fait partie du résultat : `std::optional`, ou `std::expected` si la cause
      compte.
  - key: situation-code-ignore
    format: scenario
    question: |-
      Une fonction `bool enregistrer(const Commande&)` renvoie `false` en cas d'échec. En production, des commandes
      disparaissent : plusieurs appelants n'ont jamais testé le résultat. Quelle première mesure proposes-tu ?
    choices:
      - {text: "Marquer la fonction `[[nodiscard]]`, pour que tout résultat ignoré soit signalé", correct: true}
      - {text: "Renommer la fonction en `enregistrer_ou_echouer`, pour prévenir les appelants", correct: false}
      - {text: "Renvoyer `int` à la place de `bool`, pour distinguer davantage d'erreurs", correct: false}
      - {text: "Ajouter un commentaire au-dessus de la fonction, qui rappelle de tester", correct: false}
    answer: |-
      `[[nodiscard]]` transforme chaque oubli en avertissement, donc en erreur avec `-Werror`. On peut aller plus
      loin : une exception, qu'on ne peut pas ignorer, ou un `std::expected`. Un nom ou un commentaire ne vérifient
      rien.
  - key: situation-melange
    format: scenario
    question: |-
      Dans un même module, certaines fonctions lancent des exceptions, d'autres renvoient `-1`, d'autres un
      `bool`, d'autres un pointeur nul. Un nouvel arrivant se trompe sans cesse. Que proposes-tu ?
    choices:
      - {text: "Une convention par couche : par exemple `std::expected` dans le module, exceptions à sa frontière", correct: true}
      - {text: "Un `catch (...)` autour de chaque appel du module, quelle que soit la fonction appelée", correct: false}
      - {text: "La suppression de toute gestion d'erreur, remplacée par des `assert` dans chaque fonction", correct: false}
      - {text: "Un commentaire en tête de chaque fonction, qui décrit sa façon de signaler l'échec", correct: false}
    answer: |-
      Le problème n'est pas tel ou tel mécanisme, mais leur mélange : l'appelant doit deviner. Une règle simple et
      tenue (« ce module renvoie `std::expected`, seul le constructeur lance ») rend l'usage prévisible.
