notion: assert-static-assert
lesson: |-
  Une **assertion** vérifie une hypothèse du **programmeur** : « ici, cet indice est valide », « ce type fait
  quatre octets ». Si elle est fausse, il y a un **bug** dans le code, pas une situation à traiter. C++ en offre
  deux : l'une à l'exécution, l'autre à la compilation.

  **`assert` : à l'exécution.**

  ```cpp
  #include <cassert>

  double moyenne(const std::vector<double>& v) {
      assert(!v.empty());
      // ...
  }
  ```

  Si la condition est fausse, le programme s'arrête aussitôt (`std::abort`), avec un message qui donne le
  fichier, la ligne et la condition :

  ```
  main.cpp:6: double moyenne(...): Assertion `!v.empty()' failed.
  ```

  Pour ajouter une explication, on l'accole à la condition : `assert(i < n && "indice hors bornes");`.

  **`NDEBUG` désactive `assert`.** Si la macro `NDEBUG` est définie **avant** l'inclusion de `<cassert>`, chaque
  `assert(...)` est remplacé par **rien** : la condition n'est même pas évaluée. Les constructions optimisées
  (`Release` avec CMake) définissent `NDEBUG`.

  Deux conséquences :

  - **Jamais d'effet de bord dans un `assert`.** `assert(lire(fichier));` ne lit plus rien en production.
  - `assert` n'est **pas** un moyen de valider une entrée, ni de traiter une erreur : en production, la
    vérification a disparu.

  **`static_assert` : à la compilation.**

  ```cpp
  static_assert(sizeof(int) == 4, "ce code suppose un int de 32 bits");
  static_assert(std::is_trivially_copyable_v<Point>);
  ```

  La condition doit être une **expression constante**. Si elle est fausse, la **compilation échoue**, avec le
  message donné (facultatif depuis C++17). `static_assert` ne coûte rien à l'exécution, ne dépend pas de `NDEBUG`,
  et s'écrit partout : dans une fonction, une classe, ou au niveau du fichier.

  Ses usages : vérifier une taille ou un alignement, une propriété d'un type dans un template, la cohérence d'une
  constante avec une autre.

  **Lequel choisir.**

  | Ce qu'on vérifie | Outil |
  |---|---|
  | Une propriété connue à la compilation | `static_assert` |
  | Une hypothèse interne, à l'exécution (précondition, invariant) | `assert` |
  | Une entrée extérieure, une erreur possible en production | une exception, `std::optional`, `std::expected` |

  Une erreur vue à la compilation vaut mieux qu'une erreur vue à l'exécution : quand `static_assert` est possible,
  on le préfère.

  **En entretien** : « `assert` vérifie une hypothèse à l'exécution et disparaît avec `NDEBUG` : jamais d'effet de
  bord dedans, et jamais pour valider une entrée. `static_assert` vérifie une expression constante à la
  compilation, sans aucun coût. Les deux signalent des bugs, pas des erreurs d'utilisation. »
cards:
  - key: role
    format: course
    question: "À quoi sert une assertion ?"
    choices:
      - {text: "À vérifier une hypothèse du programmeur : si elle est fausse, le code a un bug", correct: true}
      - {text: "À vérifier une saisie de l'utilisateur : si elle est fausse, on la redemande", correct: false}
      - {text: "À vérifier qu'un fichier existe : s'il manque, on en crée un vide", correct: false}
      - {text: "À vérifier la mémoire libre : si elle manque, on libère un tampon", correct: false}
    answer: "Une assertion fausse ne se « traite » pas : elle révèle une erreur de programmation, à corriger dans le code."
  - key: assert-fausse
    format: course
    question: "Que se passe-t-il quand la condition d'un `assert` est fausse, sans `NDEBUG` ?"
    choices:
      - {text: "Le programme s'arrête, avec un message qui donne le fichier, la ligne et la condition", correct: true}
      - {text: "Le programme lance une exception `std::logic_error`, que l'on peut attraper", correct: false}
      - {text: "Le programme affiche un avertissement, puis continue son exécution", correct: false}
      - {text: "Le programme ne compile pas, et le compilateur cite la condition", correct: false}
    answer: "`assert` appelle `std::abort` : ce n'est pas une exception, aucun `catch` ne l'intercepte."
  - key: ndebug
    format: course
    question: "Quel est l'effet de la macro `NDEBUG` sur `assert` ?"
    choices:
      - {text: "Chaque `assert` disparaît : sa condition n'est même plus évaluée", correct: true}
      - {text: "Chaque `assert` lance une exception au lieu d'arrêter le programme", correct: false}
      - {text: "Chaque `assert` est vérifié à la compilation au lieu de l'exécution", correct: false}
      - {text: "Chaque `assert` écrit dans un fichier journal au lieu du terminal", correct: false}
    answer: "Définie avant l'inclusion de `<cassert>`, elle remplace `assert(x)` par rien. Les constructions optimisées la définissent : une condition avec effet de bord ne s'exécuterait plus."
  - key: static-assert
    format: course
    question: "Quelle différence entre `assert` et `static_assert` ?"
    choices:
      - {text: "`static_assert` est vérifié à la compilation, sur une expression constante", correct: true}
      - {text: "`static_assert` est vérifié une seule fois, au démarrage du programme", correct: false}
      - {text: "`static_assert` ne s'applique qu'aux variables déclarées `static`", correct: false}
      - {text: "`static_assert` lance une exception au lieu d'arrêter le programme", correct: false}
    answer: "Une condition fausse fait échouer la compilation. Il ne coûte rien à l'exécution, et ne dépend pas de `NDEBUG`."
  - key: vf-attraper
    format: true-false
    question: "Un `assert` qui échoue lance une exception que l'on peut attraper."
    truth: false
    answer: "Il appelle `std::abort`, qui arrête le programme sans dérouler la pile."
  - key: vf-ndebug-static
    format: true-false
    question: "Définir `NDEBUG` désactive aussi les `static_assert`."
    truth: false
    answer: "`NDEBUG` ne concerne que la macro `assert`. `static_assert` fait partie du langage, et est toujours vérifié."
  - key: vf-effet-de-bord
    format: true-false
    question: "Avec `NDEBUG`, l'appel de fonction écrit dans `assert(initialiser());` n'est pas exécuté."
    truth: true
    answer: "L'expression entière disparaît. C'est pourquoi une assertion ne doit contenir aucun effet de bord."
  - key: vf-message-facultatif
    format: true-false
    question: "Depuis C++17, le message de `static_assert` est facultatif."
    truth: true
    answer: "`static_assert(sizeof(int) == 4);` suffit. Le compilateur cite alors la condition."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare la macro `assert` ?"
    choices:
      - {text: "`<cassert>`", correct: true}
      - {text: "`<assert>`", correct: false}
      - {text: "`<stdexcept>`", correct: false}
      - {text: "`<exception>`", correct: false}
    answer: "`<cassert>`, hérité du C. `static_assert`, lui, est un mot-clé : il ne demande aucun en-tête."
  - key: qcm-entree
    format: multiple-choice
    question: "Une fonction reçoit un âge saisi par l'utilisateur. Comment refuse-t-elle une valeur négative ?"
    choices:
      - {text: "Par une exception, ou un `std::expected`", correct: true}
      - {text: "Par `assert(age >= 0);`", correct: false}
      - {text: "Par `static_assert(age >= 0);`", correct: false}
      - {text: "Par `#error age négatif`", correct: false}
    answer: "Une saisie invalide n'est pas un bug : elle arrivera en production, où `assert` a disparu. `static_assert` exige une valeur connue à la compilation."
  - key: qcm-taille
    format: multiple-choice
    question: "Comment vérifies-tu, sans aucun coût à l'exécution, que `int` occupe quatre octets ?"
    choices:
      - {text: "`static_assert(sizeof(int) == 4);`", correct: true}
      - {text: "`assert(sizeof(int) == 4);`", correct: false}
      - {text: "`if (sizeof(int) != 4) throw 4;`", correct: false}
      - {text: "`#include <int4>`", correct: false}
    answer: "`sizeof(int)` est connu à la compilation : la vérification s'y fait, et un environnement différent ne compile pas."
  - key: qcm-message
    format: multiple-choice
    question: "Comment ajoute-t-on une explication à un `assert` ?"
    choices:
      - {text: "`assert(i < n && \"indice hors bornes\");`", correct: true}
      - {text: "`assert(i < n, \"indice hors bornes\");`", correct: false}
      - {text: "`assert(i < n) << \"indice hors bornes\";`", correct: false}
      - {text: "`assert(\"indice hors bornes\");`", correct: false}
    answer: "Un littéral de chaîne est toujours « vrai » : `&&` ne change pas la condition, et le texte apparaît dans le message. `assert` ne prend qu'un argument."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête à inclure pour `assert` :
      ```cpp
      #include <___>
      ```
    blanks:
      - [cassert]
    answer: "`<cassert>` définit la macro `assert`."
  - key: trous-static-assert
    format: fill-in
    question: |-
      Complète pour que la vérification se fasse à la compilation :
      ```cpp
      ___(sizeof(long long) >= 8, "il faut des entiers de 64 bits");
      ```
    blanks:
      - [static_assert]
    answer: "`static_assert(condition, message)` arrête la compilation si la condition est fausse."
  - key: trous-assert
    format: fill-in
    question: |-
      Complète pour vérifier, à l'exécution, que le vecteur n'est pas vide :
      ```cpp
      double moyenne(const std::vector<double>& v) {
          ___(!v.empty());
          return somme(v) / static_cast<double>(v.size());
      }
      ```
    blanks:
      - [assert]
    answer: "`assert` vérifie la précondition pendant le développement."
  - key: trous-ndebug
    format: fill-in
    question: |-
      Complète le nom de la macro qui désactive `assert` :
      ```cpp
      #define ___
      #include <cassert>
      ```
    blanks:
      - [NDEBUG]
    answer: "`NDEBUG` (*no debug*), définie avant l'inclusion de `<cassert>`."
  - key: code-ndebug
    format: code-output
    question: |-
      ```cpp
      #define NDEBUG
      #include <cassert>
      #include <print>

      int main() {
          int n = 0;
          assert(n++ == 5);
          assert(false);
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "`0`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "Rien : le programme s'arrête sur l'assertion", correct: false}
    answer: "`0` : avec `NDEBUG`, les deux `assert` disparaissent. `n++` n'est jamais exécuté, et `assert(false)` n'arrête rien."
    check:
      output: "0"
  - key: code-assert-vraie
    format: code-output
    question: |-
      ```cpp
      #include <cassert>
      #include <print>

      int diviser(int a, int b) {
          assert(b != 0);
          return a / b;
      }

      int main() {
          std::println("{}", diviser(12, 4));
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`true`", correct: false}
      - {text: "Rien : le programme s'arrête sur l'assertion", correct: false}
    answer: "`3` : la condition est vraie, donc `assert` ne fait rien, et la fonction continue."
    check:
      output: "3"
  - key: code-static-assert-faux
    format: code-output
    question: |-
      ```cpp
      #include <print>

      static_assert(sizeof(char) == 2, "un char de deux octets");

      int main() {
          std::println("{}", sizeof(char));
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : `sizeof(char)` vaut toujours 1. La condition est fausse, et `static_assert` arrête la compilation avec son message."
    check:
      compiles: false
  - key: code-static-assert-vrai
    format: code-output
    question: |-
      ```cpp
      #include <print>

      constexpr int carre(int n) {
          return n * n;
      }

      static_assert(carre(4) == 16);

      int main() {
          static_assert(sizeof(char) == 1, "un char fait un octet");
          std::println("{}", carre(3));
      }
      ```
    choices:
      - {text: "`9`", correct: true}
      - {text: "`16`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`9` : les deux conditions sont vraies, et un `static_assert` vrai ne produit aucun code. Il s'écrit au niveau du fichier comme dans une fonction."
    check:
      output: "9"
  - key: bug-effet-de-bord
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1`. Compilé avec `NDEBUG`, comme ici, il affiche `0` : l'élément n'est pas
      ajouté. Quelle correction est la bonne ?
      ```cpp
      #define NDEBUG
      #include <cassert>
      #include <print>
      #include <vector>

      bool ajouter(std::vector<int>& v, int x) {
          v.push_back(x);
          return true;
      }

      int main() {
          std::vector<int> v;
          assert(ajouter(v, 7));
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "Appeler `ajouter` hors de l'`assert`, et n'y vérifier que son résultat", correct: true}
      - {text: "Écrire `assert(ajouter(v, 7) == true);` à la place de la condition", correct: false}
      - {text: "Écrire `static_assert(ajouter(v, 7));` à la place de l'`assert`", correct: false}
      - {text: "Inclure `<cassert>` avant la ligne `#define NDEBUG`", correct: false}
    answer: |-
      ```cpp
      const bool ajoute = ajouter(v, 7);
      assert(ajoute);
      ```
      Avec `NDEBUG`, tout le contenu de l'`assert` disparaît, appel compris. Une assertion ne contient jamais
      d'effet de bord : on fait l'opération, puis on vérifie.
  - key: bug-assert-entree
    format: bug-fix
    question: |-
      Cette fonction valide un âge venu d'un formulaire avec `assert`. En production, compilée avec `NDEBUG`, elle
      accepte `-5`. Quelle correction est la bonne ?
      ```cpp
      #define NDEBUG
      #include <cassert>
      #include <print>

      int enregistrer(int age) {
          assert(age >= 0);
          return age;
      }

      int main() {
          std::println("{}", enregistrer(-5));
      }
      ```
    choices:
      - {text: "Lancer `std::invalid_argument` quand `age` est négatif", correct: true}
      - {text: "Écrire `static_assert(age >= 0);` à la place de l'`assert`", correct: false}
      - {text: "Écrire `assert(age >= 0 && \"âge négatif\");` à la place", correct: false}
      - {text: "Déclarer le paramètre `age` avec le type `const int`", correct: false}
    answer: |-
      ```cpp
      if (age < 0) {
          throw std::invalid_argument{"âge négatif"};
      }
      ```
      Une donnée extérieure invalide n'est pas un bug du programme : elle doit être refusée en production aussi.
      `assert` y a disparu, et `static_assert` exige une valeur connue à la compilation.
  - key: bug-static-assert-variable
    format: bug-fix
    question: |-
      Le compilateur répond « non-constant condition for static assertion ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          static_assert(v.size() == 3);
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "Écrire `assert(v.size() == 3);`, en incluant `<cassert>`", correct: true}
      - {text: "Écrire `static_assert(v.size() == 3, \"taille\");`", correct: false}
      - {text: "Écrire `static_assert(sizeof(v) == 3);`", correct: false}
      - {text: "Écrire `static_assert(const v.size() == 3);`", correct: false}
    answer: |-
      ```cpp
      assert(v.size() == 3);
      ```
      La taille d'un vecteur n'est connue qu'à l'exécution : `static_assert` ne peut pas la vérifier. Ajouter un
      message n'y change rien. Avec un `std::array`, dont la taille est une constante, il conviendrait.
  - key: bug-ndebug-trop-tard
    format: bug-fix
    question: |-
      L'auteur voulait désactiver les assertions, mais le programme s'arrête quand même sur « Assertion `false'
      failed ». Quelle correction est la bonne ?
      ```cpp
      #include <cassert>
      #define NDEBUG
      #include <print>

      int main() {
          assert(false);
          std::println("fin");
      }
      ```
    choices:
      - {text: "Placer `#define NDEBUG` avant `#include <cassert>`", correct: true}
      - {text: "Placer `#define NDEBUG` après `#include <print>`", correct: false}
      - {text: "Écrire `#define NDEBUG false` à la place", correct: false}
      - {text: "Écrire `#undef NDEBUG` à la place", correct: false}
    answer: |-
      ```cpp
      #define NDEBUG
      #include <cassert>
      ```
      `assert` est définie au moment où `<cassert>` est inclus, selon que `NDEBUG` existe ou non à cet instant.
      Définie après, la macro arrive trop tard. En pratique, on la passe au compilateur : `-DNDEBUG`.
