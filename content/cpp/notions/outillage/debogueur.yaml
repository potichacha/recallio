notion: debogueur
lesson: |-
  Un **débogueur** exécute le programme sous contrôle : on l'**arrête** où l'on veut, on **regarde** ses variables
  et la pile des appels, on avance **pas à pas**. Les deux principaux sont **gdb** (avec GCC) et **lldb** (avec
  Clang). Les éditeurs, comme VS Code ou CLion, les pilotent derrière leurs boutons.

  **Compiler pour déboguer.**

  ```
  g++ -std=c++23 -g -O0 main.cpp -o programme
  gdb ./programme
  ```

  - `-g` ajoute les **informations de débogage** : le lien entre le code machine et les lignes du source. Sans
    elles, le débogueur ne montre que des adresses.
  - `-O0` désactive l'optimisation : avec `-O2`, des variables disparaissent (« optimized out »), et l'exécution
    ne suit plus l'ordre des lignes.

  **Les commandes de gdb.**

  | Commande | Abrégé | Effet |
  |---|---|---|
  | `break main.cpp:42` | `b` | pose un **point d'arrêt** à la ligne 42 |
  | `break calculer` | `b` | pose un point d'arrêt à l'entrée de la fonction |
  | `run` | `r` | lance le programme |
  | `next` | `n` | exécute la ligne, **sans entrer** dans les fonctions appelées |
  | `step` | `s` | exécute la ligne, **en entrant** dans la fonction appelée |
  | `finish` | | termine la fonction en cours, et s'arrête chez l'appelant |
  | `continue` | `c` | reprend jusqu'au prochain point d'arrêt |
  | `print total` | `p` | affiche la valeur d'une variable ou d'une expression |
  | `backtrace` | `bt` | affiche la **pile des appels** |
  | `frame 2` | `f` | se place dans un cadre de la pile, pour en lire les variables |
  | `watch total` | | s'arrête quand la variable **change** |
  | `quit` | `q` | quitte |

  lldb a les mêmes notions, avec d'autres mots : `breakpoint set`, `thread backtrace`, `frame variable`.

  **Après un plantage.** Lancé sous gdb, un programme qui reçoit une erreur de segmentation s'arrête **à
  l'instruction fautive**. `backtrace` montre alors par quelle chaîne d'appels on y est arrivé : c'est souvent
  toute l'information nécessaire.

  Quand le plantage a lieu ailleurs (chez un client, en production), le système peut écrire un **fichier core** :
  l'image de la mémoire du programme à sa mort. On l'ouvre après coup : `gdb ./programme core`.

  **Les points d'arrêt conditionnels.** `break main.cpp:42 if i == 999` ne s'arrête qu'au tour qui intéresse.

  **Quand prendre le débogueur.**

  - Un **plantage** : `bt` donne l'endroit en quelques secondes.
  - Un **résultat faux** dont on ne voit pas l'origine : on avance pas à pas, en comparant ce qu'on attend à ce
    qu'on lit.
  - Un code **inconnu** : le suivre en exécution apprend plus vite que le lire.

  **Ses limites.** Pour une mémoire abîmée, le débogueur montre le symptôme, pas la cause : les **sanitizers**
  trouvent l'écriture fautive. Pour un défaut qui dépend du croisement de threads, s'arrêter change le
  comportement : ThreadSanitizer et les journaux servent mieux.

  **En entretien** : « Je compile avec `-g -O0`, je pose un point d'arrêt, j'avance avec `next` et `step`, et je
  lis les variables avec `print`. Après un plantage, `backtrace` donne la pile des appels ; sur un fichier core,
  je fais la même analyse après coup. Pour la mémoire abîmée, je préfère les sanitizers. »
cards:
  - key: role
    format: course
    question: "Que permet un débogueur comme gdb ?"
    choices:
      - {text: "D'arrêter le programme où l'on veut, et d'examiner ses variables et sa pile d'appels", correct: true}
      - {text: "De corriger automatiquement les fautes que le compilateur a signalées", correct: false}
      - {text: "De mesurer le temps passé dans chaque fonction du programme", correct: false}
      - {text: "De reformater le code source selon les conventions du projet", correct: false}
    answer: "Le débogueur exécute le programme sous contrôle. Mesurer le temps est le rôle d'un profileur ; reformater, celui de clang-format."
  - key: option-g
    format: course
    question: "Pourquoi compile-t-on avec `-g` avant de déboguer ?"
    choices:
      - {text: "Pour que le débogueur relie le code machine aux lignes et aux variables du source", correct: true}
      - {text: "Pour que le programme s'arrête de lui-même à chaque ligne", correct: false}
      - {text: "Pour que le compilateur vérifie les accès à la mémoire", correct: false}
      - {text: "Pour que le programme s'exécute plus vite sous le débogueur", correct: false}
    answer: "`-g` ajoute les informations de débogage à l'exécutable. Sans elles, gdb n'affiche que des adresses et des registres."
  - key: next-ou-step
    format: course
    question: "Quelle différence entre les commandes `next` et `step` de gdb ?"
    choices:
      - {text: "`step` entre dans la fonction appelée ; `next` l'exécute d'un bloc", correct: true}
      - {text: "`next` entre dans la fonction appelée ; `step` l'exécute d'un bloc", correct: false}
      - {text: "`step` avance d'une ligne ; `next` va au prochain point d'arrêt", correct: false}
      - {text: "`next` avance d'une ligne ; `step` revient à la ligne précédente", correct: false}
    answer: "Les deux avancent d'une ligne. Sur un appel de fonction, `step` descend dedans, `next` passe par-dessus. `continue` reprend jusqu'au prochain point d'arrêt."
  - key: backtrace
    format: course
    question: "Que montre la commande `backtrace` de gdb ?"
    choices:
      - {text: "La pile des appels : la fonction en cours, celle qui l'a appelée, et ainsi de suite", correct: true}
      - {text: "La liste des points d'arrêt posés dans le programme, avec leur numéro", correct: false}
      - {text: "Les dernières lignes que le programme a affichées avant de s'arrêter", correct: false}
      - {text: "L'historique des commandes tapées dans gdb depuis son lancement", correct: false}
    answer: "Après un plantage, c'est la première commande à taper : elle dit où le programme s'est arrêté, et par quel chemin il y est arrivé."
  - key: vf-optimisation
    format: true-false
    question: "Déboguer un programme compilé avec `-O2` montre toutes les variables, ligne par ligne, comme avec `-O0`."
    truth: false
    answer: "L'optimiseur supprime ou fusionne des variables (« optimized out ») et réordonne le code. Pour déboguer, on compile avec `-O0`."
  - key: vf-core
    format: true-false
    question: "Un fichier core permet d'examiner un programme après son plantage."
    truth: true
    answer: "C'est l'image de sa mémoire au moment de sa mort. `gdb ./programme core` l'ouvre, et `backtrace` donne la pile."
  - key: vf-watch
    format: true-false
    question: "La commande `watch` de gdb arrête le programme quand une variable change de valeur."
    truth: true
    answer: "C'est un point d'observation. Il répond à la question « qui modifie cette variable ? »."
  - key: vf-recompiler
    format: true-false
    question: "Il faut recompiler le programme pour déplacer un point d'arrêt."
    truth: false
    answer: "Les points d'arrêt se posent et se retirent dans le débogueur, pendant la session."
  - key: qcm-afficher
    format: multiple-choice
    question: "Quelle commande de gdb affiche la valeur de la variable `total` ?"
    choices:
      - {text: "`print total`", correct: true}
      - {text: "`show total`", correct: false}
      - {text: "`echo total`", correct: false}
      - {text: "`watch total`", correct: false}
    answer: "`print`, abrégé en `p`, évalue une expression. `watch` pose un point d'observation sur la variable."
  - key: qcm-point-arret
    format: multiple-choice
    question: "Quelle commande de gdb pose un point d'arrêt à la ligne 42 de `main.cpp` ?"
    choices:
      - {text: "`break main.cpp:42`", correct: true}
      - {text: "`stop main.cpp:42`", correct: false}
      - {text: "`pause main.cpp 42`", correct: false}
      - {text: "`run main.cpp:42`", correct: false}
    answer: "`break fichier:ligne`, abrégé en `b`. On peut aussi donner un nom de fonction : `break calculer`."
  - key: qcm-lldb
    format: multiple-choice
    question: "Quel débogueur accompagne le compilateur Clang ?"
    choices:
      - {text: "lldb", correct: true}
      - {text: "gdb", correct: false}
      - {text: "ld", correct: false}
      - {text: "Valgrind", correct: false}
    answer: "lldb fait partie du projet LLVM, comme Clang. gdb est celui du projet GNU. `ld` est l'éditeur de liens."
  - key: qcm-conditionnel
    format: multiple-choice
    question: "Une boucle fait dix mille tours, et le défaut apparaît au tour 9 000. Comment t'arrêtes-tu au bon tour ?"
    choices:
      - {text: "Avec un point d'arrêt conditionnel : `break main.cpp:42 if i == 9000`", correct: true}
      - {text: "Avec un point d'arrêt simple, et neuf mille commandes `continue`", correct: false}
      - {text: "Avec la commande `finish`, tapée à l'entrée de la boucle", correct: false}
      - {text: "Avec la commande `backtrace`, tapée avant de lancer le programme", correct: false}
    answer: "La condition est évaluée à chaque passage : le programme ne s'arrête que lorsqu'elle est vraie."
  - key: trous-g
    format: fill-in
    question: |-
      Complète la commande pour ajouter les informations de débogage :
      ```
      g++ -std=c++23 -___ -O0 main.cpp -o programme
      ```
    blanks:
      - [g]
    answer: "`-g` ajoute les informations de débogage à l'exécutable."
  - key: trous-break
    format: fill-in
    question: |-
      Complète la commande de gdb pour poser un point d'arrêt à l'entrée de la fonction `calculer` :
      ```
      (gdb) ___ calculer
      ```
    blanks:
      - [break, b]
    answer: "`break`, ou son abrégé `b`, pose un point d'arrêt."
  - key: trous-backtrace
    format: fill-in
    question: |-
      Le programme vient de planter sous gdb. Complète la commande qui affiche la pile des appels :
      ```
      (gdb) ___
      ```
    blanks:
      - [backtrace, bt]
    answer: "`backtrace`, ou `bt`, liste les fonctions en cours d'exécution, de la plus récente à `main`."
  - key: trous-step
    format: fill-in
    question: |-
      Le programme est arrêté sur la ligne `total = calculer(x);`. Complète la commande qui entre dans `calculer` :
      ```
      (gdb) ___
      ```
    blanks:
      - [step, s]
    answer: "`step` entre dans la fonction appelée. `next` l'exécuterait d'un bloc."
  - key: situation-segfault
    format: scenario
    question: |-
      Un programme s'arrête sur « Segmentation fault », sans autre message. Tu ne sais pas dans quelle fonction.
      Quelle est la façon la plus rapide de le savoir ?
    choices:
      - {text: "Le relancer sous gdb, compilé avec `-g`, puis taper `backtrace` à l'arrêt", correct: true}
      - {text: "Ajouter un affichage au début de chaque fonction, puis recompiler", correct: false}
      - {text: "Relire tout le code, en cherchant les pointeurs", correct: false}
      - {text: "Le recompiler avec `-O3`, pour que le message soit plus précis", correct: false}
    answer: |-
      Le débogueur arrête le programme sur l'instruction fautive, et `backtrace` donne la fonction, la ligne et la
      chaîne des appelants. AddressSanitizer donne la même pile, avec en plus la nature de la faute.
  - key: situation-optimized-out
    format: scenario
    question: |-
      Sous gdb, `print total` répond « <optimized out> », et `next` saute d'une ligne à l'autre dans le désordre.
      Que s'est-il passé ?
    choices:
      - {text: "Le programme a été compilé avec optimisation : il faut le reconstruire avec `-O0 -g`", correct: true}
      - {text: "La variable `total` a été détruite par un dépassement de tampon", correct: false}
      - {text: "Le débogueur est trop ancien pour lire les variables de C++23", correct: false}
      - {text: "Le programme a été compilé sans `-Wall` : gdb ne voit pas les variables", correct: false}
    answer: |-
      L'optimiseur garde les valeurs dans des registres, supprime des variables, et réordonne les instructions. Le
      code machine ne correspond plus ligne à ligne au source. Une construction de débogage rétablit le lien.
  - key: situation-production
    format: scenario
    question: |-
      Un service plante chez un client une fois par semaine, et tu ne parviens pas à reproduire le défaut. Que
      demandes-tu pour pouvoir l'analyser ?
    choices:
      - {text: "Le fichier core du plantage, à ouvrir avec gdb et l'exécutable correspondant", correct: true}
      - {text: "Une capture d'écran du terminal au moment du plantage", correct: false}
      - {text: "L'installation de gdb sur le poste de chaque utilisateur", correct: false}
      - {text: "La liste des fichiers source ouverts dans l'éditeur du client", correct: false}
    answer: |-
      Le fichier core fige l'état du programme à sa mort : pile des appels, variables, mémoire. Avec les
      informations de débogage de cette version exacte, l'analyse se fait après coup, sans reproduire le défaut.
  - key: situation-memoire-abimee
    format: scenario
    question: |-
      Sous gdb, tu vois qu'une structure contient des valeurs absurdes au moment du plantage, mais rien dans la
      fonction en cours ne l'a modifiée. Quel outil prends-tu ensuite ?
    choices:
      - {text: "AddressSanitizer, qui arrête le programme à l'écriture fautive elle-même", correct: true}
      - {text: "Le préprocesseur, pour lire le code après le remplacement des macros", correct: false}
      - {text: "Un profileur, pour savoir quelle fonction est la plus lente", correct: false}
      - {text: "clang-format, pour rendre le code de la fonction plus lisible", correct: false}
    answer: |-
      Le débogueur montre le symptôme : une donnée abîmée. La cause, une écriture hors bornes ou après
      libération, s'est produite plus tôt et ailleurs. AddressSanitizer la signale au moment où elle a lieu ; un
      `watch` sur l'adresse abîmée est l'autre piste.
