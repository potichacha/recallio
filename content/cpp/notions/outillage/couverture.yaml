notion: couverture
lesson: |-
  La **couverture de code** mesure quelle part du programme les tests **exécutent**. Elle répond à une question
  simple : « quel code n'est jamais testé ? »

  **Les mesures.**

  | Mesure | Ce qu'elle compte |
  |---|---|
  | couverture de **lignes** | les lignes exécutées au moins une fois |
  | couverture de **fonctions** | les fonctions appelées au moins une fois |
  | couverture de **branches** | chaque issue de chaque condition : le `if` pris **et** non pris |

  La couverture de branches est plus exigeante : une ligne `if (a && b) f();` peut être exécutée sans que tous ses
  cas le soient.

  **Avec GCC : gcov.**

  ```
  g++ --coverage -O0 -g calcul.cpp tests.cpp -o tests
  ./tests
  gcov calcul.cpp
  ```

  `--coverage` instrumente le programme. À l'exécution, il écrit des fichiers de compteurs (`.gcda`) ; `gcov` les
  croise avec le code et produit `calcul.cpp.gcov`, où chaque ligne porte son nombre d'exécutions. `#####` marque
  une ligne **jamais exécutée**.

  ```
          3:   12:    if (b == 0) {
      #####:   13:        throw std::invalid_argument{"division par zéro"};
          -:   14:    }
  ```

  **lcov** et **gcovr** en tirent un rapport HTML, lisible fichier par fichier.

  **Avec Clang : llvm-cov.**

  ```
  clang++ -fprofile-instr-generate -fcoverage-mapping calcul.cpp tests.cpp -o tests
  ./tests
  llvm-profdata merge default.profraw -o tests.profdata
  llvm-cov report ./tests -instr-profile=tests.profdata
  ```

  On compile **sans optimisation** : l'optimiseur fusionne et supprime des lignes, et le rapport ne correspondrait
  plus au code écrit.

  **Ce que la couverture dit, et ne dit pas.**

  - Une ligne **non couverte** n'est **pas testée** : c'est une certitude, et l'information utile.
  - Une ligne **couverte** a été **exécutée**, pas **vérifiée**. Un test sans assertion couvre tout et ne vérifie
    rien.

  100 % de couverture ne prouve donc pas l'absence de bug. À l'inverse, 40 % prouve que 60 % du code peut casser
  sans qu'un test le remarque.

  **Bien s'en servir.**

  - Lire le rapport pour trouver les **chemins d'erreur** et les branches oubliées, souvent les moins couverts.
  - Regarder la couverture du **code modifié** par une demande de fusion, plus que le total.
  - Ne pas en faire un **objectif chiffré** aveugle : exiger 90 % produit des tests écrits pour le chiffre, sans
    assertion utile.

  **En entretien** : « La couverture montre le code que les tests n'exécutent pas : `--coverage` et gcov avec GCC,
  llvm-cov avec Clang. Je m'en sers pour repérer les branches oubliées, pas comme objectif : une ligne couverte
  est exécutée, pas forcément vérifiée. »
cards:
  - key: definition
    format: course
    question: "Que mesure la couverture de code ?"
    choices:
      - {text: "La part du code que les tests exécutent", correct: true}
      - {text: "La part du code qui est correcte", correct: false}
      - {text: "La part du code qui est commentée", correct: false}
      - {text: "La part du code qui est optimisée", correct: false}
    answer: "Elle compte ce qui a tourné pendant les tests. Elle ne dit rien de la justesse de ce code."
  - key: limite
    format: course
    question: "Pourquoi 100 % de couverture ne prouve-t-il pas que le code est correct ?"
    choices:
      - {text: "Une ligne exécutée par un test n'est pas forcément vérifiée par une assertion", correct: true}
      - {text: "Les outils de couverture se trompent sur la moitié des lignes", correct: false}
      - {text: "La couverture ne compte que les lignes de commentaires", correct: false}
      - {text: "Un programme couvert à 100 % ne peut plus être compilé", correct: false}
    answer: "Un test qui appelle une fonction sans rien vérifier la couvre entièrement. Et des combinaisons d'entrées non testées restent possibles."
  - key: branches
    format: course
    question: "Qu'exige la couverture de branches, que la couverture de lignes n'exige pas ?"
    choices:
      - {text: "Que chaque condition ait été vraie et fausse au moins une fois", correct: true}
      - {text: "Que chaque ligne ait été exécutée au moins deux fois", correct: false}
      - {text: "Que chaque fonction ait été appelée par deux tests", correct: false}
      - {text: "Que chaque fichier contienne au moins une condition", correct: false}
    answer: "Un `if` sans `else` dont la condition est toujours vraie est couvert à 100 % en lignes, et à moitié en branches."
  - key: usage
    format: course
    question: "Quelle information d'un rapport de couverture est la plus utile ?"
    choices:
      - {text: "Les lignes jamais exécutées : elles ne sont testées par rien", correct: true}
      - {text: "Les lignes exécutées le plus souvent : elles sont les mieux testées", correct: false}
      - {text: "Le nombre total de lignes du projet", correct: false}
      - {text: "Le nom du développeur qui a écrit chaque ligne", correct: false}
    answer: "Le non-couvert est une certitude : ce code peut casser sans alerte. On y trouve souvent les chemins d'erreur."
  - key: vf-optimisation
    format: true-false
    question: "On mesure la couverture sur une construction optimisée, avec `-O2`."
    truth: false
    answer: "L'optimiseur réorganise le code : le rapport ne correspondrait plus aux lignes écrites. On compile avec `-O0`."
  - key: vf-non-couvert
    format: true-false
    question: "Une ligne marquée `#####` par gcov n'a été exécutée par aucun test."
    truth: true
    answer: "C'est le marqueur du code jamais atteint."
  - key: vf-objectif
    format: true-false
    question: "Exiger un pourcentage de couverture garantit des tests de bonne qualité."
    truth: false
    answer: "Un chiffre s'atteint avec des tests sans assertion. La couverture est un indicateur, pas un but."
  - key: vf-clang
    format: true-false
    question: "Avec Clang, l'outil qui produit le rapport de couverture s'appelle llvm-cov."
    truth: true
    answer: "Avec `-fprofile-instr-generate -fcoverage-mapping` à la compilation, puis `llvm-profdata` et `llvm-cov`."
  - key: qcm-option-gcc
    format: multiple-choice
    question: "Quelle option de GCC instrumente le programme pour la couverture ?"
    choices:
      - {text: "`--coverage`", correct: true}
      - {text: "`--Wall`", correct: false}
      - {text: "`-fsanitize=coverage-report`", correct: false}
      - {text: "`-pg`", correct: false}
    answer: "`--coverage` vaut `-fprofile-arcs -ftest-coverage`. `-pg` sert au profilage avec gprof."
  - key: qcm-html
    format: multiple-choice
    question: "Quel outil transforme les données de gcov en rapport HTML ?"
    choices:
      - {text: "lcov, ou gcovr", correct: true}
      - {text: "clang-format", correct: false}
      - {text: "ccache", correct: false}
      - {text: "gdb", correct: false}
    answer: "Ils agrègent les résultats par fichier et par répertoire, avec le code annoté."
  - key: qcm-gcda
    format: multiple-choice
    question: "Quand les fichiers de compteurs `.gcda` sont-ils écrits ?"
    choices:
      - {text: "À l'exécution du programme instrumenté", correct: true}
      - {text: "À la compilation, avec `--coverage`", correct: false}
      - {text: "À l'édition de liens", correct: false}
      - {text: "À l'appel de `gcov`", correct: false}
    answer: "Le programme compte ses passages, et vide ses compteurs dans les `.gcda` en se terminant. `gcov` les lit ensuite."
  - key: qcm-fusion
    format: multiple-choice
    question: "Quelle couverture est la plus pertinente pour juger une demande de fusion ?"
    choices:
      - {text: "Celle des lignes ajoutées ou modifiées", correct: true}
      - {text: "Celle du projet entier", correct: false}
      - {text: "Celle de la bibliothèque standard", correct: false}
      - {text: "Celle des fichiers de configuration", correct: false}
    answer: "Elle dit si le nouveau code est testé. Le total du projet bouge à peine, et ne dit rien de la modification."
  - key: trous-coverage
    format: fill-in
    question: |-
      Complète l'option de GCC qui instrumente le programme :
      ```
      g++ --___ -O0 -g calcul.cpp tests.cpp -o tests
      ```
    blanks:
      - [coverage]
    answer: "`--coverage` active le comptage des lignes et des branches."
  - key: trous-gcov
    format: fill-in
    question: |-
      Complète la commande qui produit le fichier annoté `calcul.cpp.gcov` :
      ```
      ./tests
      ___ calcul.cpp
      ```
    blanks:
      - [gcov]
    answer: "`gcov` croise les compteurs avec le code source."
  - key: trous-o0
    format: fill-in
    question: |-
      Complète le niveau d'optimisation qui convient à une mesure de couverture :
      ```
      g++ --coverage -O___ -g calcul.cpp tests.cpp -o tests
      ```
    blanks:
      - ["0"]
    answer: "`-O0` : aucune optimisation, pour que chaque ligne écrite existe dans le binaire."
  - key: trous-llvm-cov
    format: fill-in
    question: |-
      Complète l'outil de Clang qui affiche le rapport :
      ```
      llvm-profdata merge default.profraw -o tests.profdata
      ___ report ./tests -instr-profile=tests.profdata
      ```
    blanks:
      - [llvm-cov]
    answer: "`llvm-cov report` donne le résumé ; `llvm-cov show` annote le code."
  - key: situation-objectif
    format: scenario
    question: |-
      La direction impose 90 % de couverture. Un mois plus tard, le chiffre est atteint, mais les bugs en
      production n'ont pas baissé. En lisant les tests, tu vois des appels de fonctions sans aucune vérification.
      Qu'expliques-tu ?
    choices:
      - {text: "Que la couverture mesure l'exécution, pas la vérification : ces tests ne peuvent pas échouer", correct: true}
      - {text: "Que l'outil de couverture est défectueux, et surestime le chiffre", correct: false}
      - {text: "Que 90 % est trop bas : il faut exiger 100 % pour voir un effet", correct: false}
      - {text: "Que les bugs viennent du compilateur, puisque le code est couvert", correct: false}
    answer: |-
      Un objectif chiffré se satisfait au moindre coût. Ce qui protège, ce sont des assertions sur des
      comportements ; la couverture sert à repérer ce qui n'est pas testé du tout.
  - key: situation-chemins-erreur
    format: scenario
    question: |-
      Le rapport montre 85 % de couverture, mais presque toutes les lignes non couvertes sont dans des `catch` et
      des branches `if (erreur)`. Qu'en conclus-tu ?
    choices:
      - {text: "Que les chemins d'erreur ne sont pas testés : c'est là qu'il faut écrire des tests", correct: true}
      - {text: "Que ces lignes sont du code mort, à supprimer du projet", correct: false}
      - {text: "Que 85 % suffit : les chemins d'erreur ne s'exécutent jamais", correct: false}
      - {text: "Que l'outil ne sait pas mesurer la couverture des `catch`", correct: false}
    answer: |-
      Le code de gestion d'erreur est le moins exercé, et celui qui tournera le jour où tout va mal. Le rapport
      désigne exactement les cas à provoquer.
  - key: situation-branche
    format: scenario
    question: |-
      Une fonction contient `if (age >= 18 && inscrit) valider();`. La couverture de lignes est de 100 %. Un bug
      apparaît quand `inscrit` est faux. Quel indicateur l'aurait laissé prévoir ?
    choices:
      - {text: "La couverture de branches : la condition n'a jamais été fausse dans les tests", correct: true}
      - {text: "La couverture de fonctions : `valider` n'a jamais été appelée", correct: false}
      - {text: "Le nombre de tests : il aurait fallu en écrire deux fois plus", correct: false}
      - {text: "La couverture des commentaires : la ligne n'était pas documentée", correct: false}
    answer: |-
      La ligne a été exécutée, toujours avec une condition vraie. La couverture de branches exige les deux issues,
      et aurait montré le cas manquant.
  - key: situation-fusion
    format: scenario
    question: |-
      Une demande de fusion ajoute deux cents lignes sans un seul test. La couverture du projet passe de 81,2 % à
      81,0 %, et l'intégration continue reste verte. Que proposes-tu ?
    choices:
      - {text: "Mesurer la couverture des lignes modifiées, et l'afficher dans la demande de fusion", correct: true}
      - {text: "Relever le seuil global du projet à 81,1 %", correct: false}
      - {text: "Ne rien changer : la couverture a à peine bougé", correct: false}
      - {text: "Retirer la mesure de couverture de l'intégration continue", correct: false}
    answer: |-
      Sur un grand projet, le total noie tout. La couverture du code ajouté, ici 0 %, dit ce que le relecteur a
      besoin de savoir.
