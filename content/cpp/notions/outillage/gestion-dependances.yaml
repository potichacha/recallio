notion: gestion-dependances
lesson: |-
  C++ n'a pas de gestionnaire de paquets officiel, comme `cargo` pour Rust ou `npm` pour JavaScript. Utiliser une
  bibliothèque tierce demande de la **trouver**, de la **construire** avec des options compatibles, et de la
  **lier**. Trois approches dominent.

  **1. FetchContent : télécharger et construire avec le projet.** C'est un module de CMake, sans outil
  supplémentaire.

  ```
  include(FetchContent)
  FetchContent_Declare(fmt
      GIT_REPOSITORY https://github.com/fmtlib/fmt.git
      GIT_TAG        11.0.2)
  FetchContent_MakeAvailable(fmt)

  target_link_libraries(app PRIVATE fmt::fmt)
  ```

  Simple, mais la dépendance est recompilée avec le projet, et chaque dépendance transitive doit être déclarée.

  **2. vcpkg (Microsoft).** Un fichier `vcpkg.json`, le **manifeste**, liste les dépendances :

  ```
  { "dependencies": ["fmt", "nlohmann-json"] }
  ```

  vcpkg les construit et CMake les trouve avec `find_package`, grâce à un **fichier de chaîne d'outils** :
  `-DCMAKE_TOOLCHAIN_FILE=.../vcpkg/scripts/buildsystems/vcpkg.cmake`.

  **3. Conan.** Un `conanfile.txt` ou `conanfile.py` déclare les dépendances. Conan sait télécharger des **binaires
  déjà construits** pour une configuration donnée (compilateur, version, type de construction), ou les construire.
  Il convient bien aux entreprises qui hébergent leurs propres paquets.

  | | FetchContent | vcpkg | Conan |
  |---|---|---|---|
  | Outil en plus | non | oui | oui (Python) |
  | Binaires précompilés | non | cache local ou distant | oui |
  | Côté CMake | `FetchContent_MakeAvailable` | `find_package` | `find_package` |

  **Le gestionnaire du système** (`apt install libfmt-dev`) reste une option, mais la version dépend de la
  distribution : la construction n'est pas reproductible d'une machine à l'autre.

  **Les règles qui comptent, quel que soit l'outil.**

  - **Épingler les versions** : un tag ou un hachage de commit, jamais une branche. Sinon la construction change
    sans qu'on ait rien modifié.
  - **Mêmes options partout** : une bibliothèque C++ construite avec un autre standard, ou une autre bibliothèque
    standard, peut être incompatible au niveau binaire (ABI).
  - **Ne pas recopier** le code d'une bibliothèque dans son dépôt sans raison : les mises à jour de sécurité ne
    suivent plus.
  - Côté `CMakeLists.txt`, toujours **`find_package` et une cible importée** : le projet ne dépend pas du
    gestionnaire choisi.

  **En entretien** : « Pas de gestionnaire officiel en C++. J'utilise FetchContent pour un petit projet, vcpkg ou
  Conan dès que les dépendances se multiplient, toujours avec des versions épinglées et `find_package` côté
  CMake. »
cards:
  - key: constat
    format: course
    question: "Pourquoi la gestion des dépendances est-elle plus délicate en C++ qu'en Rust ou en Go ?"
    choices:
      - {text: "Le langage n'a pas de gestionnaire de paquets officiel, ni de système de construction unique", correct: true}
      - {text: "Le langage interdit d'utiliser une bibliothèque écrite par quelqu'un d'autre", correct: false}
      - {text: "Le langage exige que toute bibliothèque soit recopiée dans le fichier `main.cpp`", correct: false}
      - {text: "Le langage n'a aucune bibliothèque tierce disponible en dehors de la bibliothèque standard", correct: false}
    answer: "Chaque bibliothèque a son système de construction et ses options. vcpkg, Conan et FetchContent comblent ce manque, chacun à sa façon."
  - key: fetchcontent
    format: course
    question: "Que fait le module `FetchContent` de CMake ?"
    choices:
      - {text: "Il télécharge les sources d'une dépendance à la configuration, et les construit avec le projet", correct: true}
      - {text: "Il télécharge un binaire déjà construit, adapté au compilateur de la machine", correct: false}
      - {text: "Il installe la dépendance dans les répertoires du système, avec les droits d'administration", correct: false}
      - {text: "Il recopie le code de la dépendance dans le dépôt Git du projet, à chaque construction", correct: false}
    answer: "Aucun outil en plus : la dépendance devient une partie de la construction. En contrepartie, elle est recompilée avec le projet."
  - key: epingler
    format: course
    question: "Pourquoi épingle-t-on une dépendance à un tag ou à un hachage de commit ?"
    choices:
      - {text: "Pour que la construction donne le même résultat demain qu'aujourd'hui", correct: true}
      - {text: "Pour que la dépendance se mette à jour toute seule à chaque construction", correct: false}
      - {text: "Pour que la dépendance soit compilée avec plus d'optimisations", correct: false}
      - {text: "Pour que la dépendance n'ait pas besoin d'être téléchargée", correct: false}
    answer: "Une branche bouge : le projet peut casser sans qu'une ligne ait changé. Une version épinglée rend la construction reproductible."
  - key: conan
    format: course
    question: "Qu'apporte Conan que FetchContent n'offre pas ?"
    choices:
      - {text: "Des binaires déjà construits, choisis selon le compilateur et la configuration", correct: true}
      - {text: "Une intégration à CMake, que FetchContent n'a pas", correct: false}
      - {text: "Un téléchargement depuis un dépôt Git, que FetchContent ne sait pas faire", correct: false}
      - {text: "Une vérification de la syntaxe du code de la dépendance", correct: false}
    answer: "Ne pas recompiler chaque dépendance fait gagner beaucoup de temps. Conan décrit chaque binaire par ses réglages, et reconstruit à défaut."
  - key: vf-officiel
    format: true-false
    question: "Le standard C++ définit un gestionnaire de paquets officiel."
    truth: false
    answer: "Il n'y en a pas. vcpkg et Conan sont des outils tiers ; FetchContent est un module de CMake."
  - key: vf-find-package
    format: true-false
    question: "Avec vcpkg comme avec Conan, le `CMakeLists.txt` trouve la bibliothèque par `find_package`."
    truth: true
    answer: "Le projet reste indépendant du gestionnaire : il demande une cible importée, peu importe qui l'a installée."
  - key: vf-branche
    format: true-false
    question: "Suivre la branche `main` d'une dépendance rend la construction reproductible."
    truth: false
    answer: "Le contenu de la branche change. Seuls un tag ou un hachage de commit désignent toujours le même code."
  - key: vf-systeme
    format: true-false
    question: "La version d'une bibliothèque installée par le gestionnaire du système dépend de la distribution."
    truth: true
    answer: "Deux machines peuvent avoir deux versions différentes : la construction n'est pas la même partout."
  - key: qcm-manifeste
    format: multiple-choice
    question: "Dans quel fichier vcpkg lit-il la liste des dépendances d'un projet ?"
    choices:
      - {text: "`vcpkg.json`", correct: true}
      - {text: "`conanfile.txt`", correct: false}
      - {text: "`package.json`", correct: false}
      - {text: "`Cargo.toml`", correct: false}
    answer: "`vcpkg.json` est le manifeste. `conanfile.txt` est celui de Conan ; les deux autres appartiennent à npm et à Rust."
  - key: qcm-disponible
    format: multiple-choice
    question: "Quelle commande, après `FetchContent_Declare`, télécharge la dépendance et ajoute ses cibles ?"
    choices:
      - {text: "`FetchContent_MakeAvailable(fmt)`", correct: true}
      - {text: "`find_package(fmt REQUIRED)`", correct: false}
      - {text: "`add_library(fmt)`", correct: false}
      - {text: "`include_directories(fmt)`", correct: false}
    answer: "`FetchContent_MakeAvailable` rend la cible `fmt::fmt` utilisable par `target_link_libraries`."
  - key: qcm-toolchain
    format: multiple-choice
    question: "Comment CMake apprend-il où vcpkg a installé les bibliothèques ?"
    choices:
      - {text: "Par le fichier de chaîne d'outils de vcpkg, passé avec `CMAKE_TOOLCHAIN_FILE`", correct: true}
      - {text: "Par une variable d'environnement `PATH` modifiée à la main", correct: false}
      - {text: "Par des `include_directories` écrits dans chaque `CMakeLists.txt`", correct: false}
      - {text: "Par une copie des bibliothèques dans le répertoire des sources", correct: false}
    answer: "Ce fichier règle les chemins de recherche : `find_package` trouve alors les paquets de vcpkg, sans rien écrire dans le projet."
  - key: qcm-abi
    format: multiple-choice
    question: "Pourquoi une bibliothèque C++ précompilée doit-elle correspondre au compilateur et aux options du projet ?"
    choices:
      - {text: "Deux constructions différentes peuvent être incompatibles au niveau binaire", correct: true}
      - {text: "Le compilateur refuse de lire les en-têtes d'une autre version", correct: false}
      - {text: "Les noms des fonctions sont chiffrés avec la version du compilateur", correct: false}
      - {text: "Une bibliothèque ne peut être liée qu'une seule fois par machine", correct: false}
    answer: "La disposition des objets et les symboles dépendent de la bibliothèque standard et de certaines options : c'est l'ABI. Un mélange donne des plantages difficiles à expliquer."
  - key: trous-declare
    format: fill-in
    question: |-
      Complète la commande qui décrit la dépendance à télécharger :
      ```
      include(FetchContent)
      ___(fmt
          GIT_REPOSITORY https://github.com/fmtlib/fmt.git
          GIT_TAG        11.0.2)
      ```
    blanks:
      - [FetchContent_Declare]
    answer: "`FetchContent_Declare` enregistre l'origine et la version."
  - key: trous-tag
    format: fill-in
    question: |-
      Complète la clé qui épingle la version téléchargée :
      ```
      FetchContent_Declare(fmt
          GIT_REPOSITORY https://github.com/fmtlib/fmt.git
          ___        11.0.2)
      ```
    blanks:
      - [GIT_TAG]
    answer: "`GIT_TAG` accepte un tag ou, mieux, un hachage de commit."
  - key: trous-find-package
    format: fill-in
    question: |-
      Complète la commande qui cherche la bibliothèque installée par vcpkg ou Conan :
      ```
      ___(fmt REQUIRED)
      target_link_libraries(app PRIVATE fmt::fmt)
      ```
    blanks:
      - [find_package]
    answer: "`find_package` fournit la cible importée `fmt::fmt`."
  - key: trous-toolchain
    format: fill-in
    question: |-
      Complète la variable qui désigne le fichier de chaîne d'outils de vcpkg :
      ```
      cmake -S . -B build -D___=vcpkg/scripts/buildsystems/vcpkg.cmake
      ```
    blanks:
      - [CMAKE_TOOLCHAIN_FILE]
    answer: "`CMAKE_TOOLCHAIN_FILE` se donne à la première configuration."
  - key: situation-casse-sans-changement
    format: scenario
    question: |-
      Lundi, la construction passe ; mardi, elle échoue, sans qu'aucun fichier du projet ait changé. Une dépendance
      est déclarée avec `GIT_TAG main`. Que s'est-il passé, et que fais-tu ?
    choices:
      - {text: "La branche a avancé ; j'épingle la dépendance à un tag ou à un hachage de commit", correct: true}
      - {text: "Le compilateur s'est mis à jour ; je réinstalle le système de la machine", correct: false}
      - {text: "Le cache de CMake est plein ; je supprime le répertoire des sources", correct: false}
      - {text: "La dépendance a expiré ; je la recopie dans le dépôt du projet", correct: false}
    answer: |-
      `main` désigne un code qui change. Une construction reproductible exige des versions fixes, mises à jour
      volontairement.
  - key: situation-temps-de-construction
    format: scenario
    question: |-
      Un projet tire douze bibliothèques par FetchContent. Chaque construction propre, en intégration continue,
      prend vingt-cinq minutes, dont vingt pour les dépendances. Que proposes-tu ?
    choices:
      - {text: "Passer à vcpkg ou à Conan, avec un cache de binaires : les dépendances ne sont construites qu'une fois", correct: true}
      - {text: "Retirer six des douze bibliothèques, choisies au hasard, pour diviser le temps par deux", correct: false}
      - {text: "Recopier les douze bibliothèques dans le dépôt, pour ne plus les télécharger", correct: false}
      - {text: "Compiler les dépendances sans optimisation, et le projet avec", correct: false}
    answer: |-
      FetchContent recompile tout avec le projet. Un gestionnaire qui réutilise des binaires, tant que la version
      et les options ne changent pas, supprime ce coût.
  - key: situation-plantage-abi
    format: scenario
    question: |-
      Ton programme, compilé avec GCC 14 en C++23, lie une bibliothèque C++ précompilée il y a cinq ans avec un
      autre compilateur. Il plante dès qu'une `std::string` traverse la frontière. Que soupçonnes-tu ?
    choices:
      - {text: "Une incompatibilité binaire : les deux côtés n'ont pas la même `std::string`", correct: true}
      - {text: "Une fuite de mémoire dans la bibliothèque, qui épuise le tas", correct: false}
      - {text: "Un défaut de GCC 14, qui ne sait pas lier d'anciennes bibliothèques", correct: false}
      - {text: "Une course aux données sur la chaîne, entre deux threads", correct: false}
    answer: |-
      Les types de la bibliothèque standard n'ont pas la même disposition d'une implémentation à l'autre. On
      reconstruit la dépendance avec les mêmes réglages, ce que font vcpkg et Conan, ou l'on passe par une
      interface en C.
  - key: situation-choix
    format: scenario
    question: |-
      Tu démarres un petit outil en ligne de commande, qui n'a besoin que d'une bibliothèque de tests. Un collègue
      propose d'installer Conan sur tous les postes. Que réponds-tu ?
    choices:
      - {text: "Que FetchContent suffit ici : une dépendance, aucun outil à installer", correct: true}
      - {text: "Que Conan est obligatoire dès qu'un projet a une dépendance", correct: false}
      - {text: "Qu'il vaut mieux recopier la bibliothèque de tests dans `main.cpp`", correct: false}
      - {text: "Qu'il faut écrire sa propre bibliothèque de tests, pour ne dépendre de rien", correct: false}
    answer: |-
      L'outil se choisit à la taille du besoin. Un gestionnaire devient rentable quand les dépendances et leurs
      dépendances se multiplient, ou quand leur construction pèse.
