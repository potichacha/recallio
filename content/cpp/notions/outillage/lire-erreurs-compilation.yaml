notion: lire-erreurs-compilation
lesson: |-
  Les messages d'erreur de C++ ont mauvaise réputation : une faute d'une ligne peut en produire cent. Ils suivent
  pourtant une forme fixe, et se lisent avec méthode.

  **L'anatomie d'une erreur.**

  ```
  main.cpp:8:17: error: 'totl' was not declared in this scope; did you mean 'total'?
      8 |     std::println("{}", totl);
        |                        ^~~~
        |                        total
  ```

  - `main.cpp:8:17` : le **fichier**, la **ligne**, la **colonne** ;
  - `error:` : la gravité (`error`, `warning`, ou `note`, qui complète le message précédent) ;
  - le **message**, souvent suivi d'une suggestion ;
  - la ligne de code, avec un `^` sous l'endroit fautif.

  **Règle 1 : commencer par la première erreur.** Une faute en entraîne d'autres : une accolade oubliée fait
  échouer tout ce qui suit. On corrige **la première**, on recompile. Les autres disparaissent souvent d'elles-mêmes.
  L'option `-fmax-errors=1` n'affiche qu'elle.

  **Règle 2 : regarder la ligne d'avant.** Le compilateur signale l'endroit où il **s'aperçoit** du problème. Un
  point-virgule manquant est signalé au début de la ligne suivante : `expected ';' before 'return'`.

  **Les messages courants.**

  | Message | Cause habituelle |
  |---|---|
  | `'x' was not declared in this scope` | faute de frappe, `#include` oublié, `std::` oublié, variable hors de portée |
  | `expected ';' before ...` | point-virgule manquant à la ligne précédente, ou après une classe |
  | `no matching function for call to 'f(...)'` | mauvais nombre ou mauvais types d'arguments ; les `note: candidate:` listent ce qui existe |
  | `cannot convert 'A' to 'B'` | types incompatibles |
  | `invalid conversion from 'const char*' to 'int'` | idem |
  | `'class X' has no member named 'y'` | faute de frappe sur un membre, ou mauvais type |
  | `passing 'const X' as 'this' argument discards qualifiers` | fonction membre non `const` appelée sur un objet `const` |
  | `use of deleted function` | copie d'un objet non copiable (`std::unique_ptr`, `std::mutex`) |
  | `expected '}' at end of input` | accolade ouvrante jamais fermée |

  **Lire une erreur de template.** Quand la faute est dans du code générique, le compilateur déroule la pile des
  instanciations :

  ```
  /usr/include/c++/14/bits/stl_algo.h:1906:50: error: no match for 'operator-' ...
  /usr/include/c++/14/bits/stl_algo.h: In instantiation of 'void std::sort(...)':
  main.cpp:7:14:   required from here
  ```

  La méthode :

  1. Chercher **`required from here`** : c'est **ta** ligne, celle qui a déclenché l'erreur.
  2. Lire le **premier** `error:` : il dit ce qui manque au type (`no match for 'operator<'`, `operator-`...).
  3. Ignorer les chemins dans `/usr/include` : la bibliothèque n'est pas fautive, c'est ce qu'on lui a passé.

  Ici : `std::sort` exige des itérateurs à accès direct, et on lui a donné ceux d'une `std::list`.

  Avec les **concepts** (C++20), le message devient direct : « constraints not satisfied », suivi de l'exigence
  non remplie.

  **En entretien** : « Je lis la première erreur, je regarde la ligne indiquée et celle d'avant, et je recompile.
  Pour une erreur de template, je cherche `required from here` pour retrouver ma ligne, puis le premier `error:`
  pour savoir ce que mon type ne fournit pas. »
cards:
  - key: premiere-erreur
    format: course
    question: "Le compilateur affiche trente erreurs. Par laquelle commences-tu ?"
    choices:
      - {text: "Par la première : les suivantes en découlent souvent", correct: true}
      - {text: "Par la dernière : c'est la plus récente", correct: false}
      - {text: "Par la plus longue : c'est la plus détaillée", correct: false}
      - {text: "Par celle du milieu : c'est la plus probable", correct: false}
    answer: "Une faute désoriente le compilateur pour la suite du fichier. On corrige la première, on recompile, et la liste fond."
  - key: anatomie
    format: course
    question: "Que désigne `main.cpp:8:17` au début d'un message d'erreur ?"
    choices:
      - {text: "Le fichier, la ligne 8, et la colonne 17", correct: true}
      - {text: "Le fichier, la colonne 8, et la ligne 17", correct: false}
      - {text: "Le fichier, l'erreur numéro 8 sur 17", correct: false}
      - {text: "Le fichier, de la ligne 8 à la ligne 17", correct: false}
    answer: "Toujours dans cet ordre : fichier, ligne, colonne. Les éditeurs savent sauter directement à cet endroit."
  - key: ligne-precedente
    format: course
    question: "Pourquoi l'erreur « expected ';' before 'return' » est-elle signalée sur la ligne du `return` ?"
    choices:
      - {text: "Le compilateur ne s'aperçoit du point-virgule manquant qu'en lisant la suite", correct: true}
      - {text: "Le point-virgule doit être écrit juste devant le mot `return`", correct: false}
      - {text: "Le mot `return` doit toujours être précédé d'une ligne vide", correct: false}
      - {text: "Le compilateur numérote les lignes à partir de zéro", correct: false}
    answer: "L'instruction précédente pouvait encore se poursuivre. C'est en rencontrant `return` que le compilateur comprend qu'elle aurait dû finir. La faute est une ligne plus haut."
  - key: template
    format: course
    question: "Dans une longue erreur de template, que désigne la ligne « required from here » ?"
    choices:
      - {text: "L'endroit de ton code qui a déclenché l'instanciation fautive", correct: true}
      - {text: "L'endroit de la bibliothèque standard qui contient le bug", correct: false}
      - {text: "L'en-tête qu'il faut inclure pour corriger l'erreur", correct: false}
      - {text: "La fin du message, après laquelle on peut cesser de lire", correct: false}
    answer: "Le compilateur remonte la chaîne des instanciations jusqu'à ton appel. C'est là qu'il faut regarder ce que tu as passé au template."
  - key: vf-toutes
    format: true-false
    question: "Il faut corriger toutes les erreurs affichées avant de recompiler."
    truth: false
    answer: "On corrige la première, puis on recompile : beaucoup des suivantes n'étaient que ses conséquences."
  - key: vf-note
    format: true-false
    question: "Une ligne `note:` complète le message d'erreur qui la précède."
    truth: true
    answer: "Elle donne du contexte : les fonctions candidates, l'endroit d'une déclaration, la chaîne d'instanciation."
  - key: vf-bibliotheque
    format: true-false
    question: "Une erreur qui cite un fichier de `/usr/include/c++` veut dire que la bibliothèque standard a un bug."
    truth: false
    answer: "La faute est dans ce qu'on a passé à la bibliothèque. Le message montre où le code générique n'a pas pu utiliser ton type."
  - key: vf-suggestion
    format: true-false
    question: "GCC propose parfois le nom correct après « did you mean »."
    truth: true
    answer: "Pour une faute de frappe sur un identifiant, il suggère le nom le plus proche qu'il connaît."
  - key: qcm-not-declared
    format: multiple-choice
    question: "Que signale le plus souvent « 'vector' was not declared in this scope » ?"
    choices:
      - {text: "Un `#include <vector>` ou un `std::` oublié", correct: true}
      - {text: "Un vecteur déclaré deux fois", correct: false}
      - {text: "Un vecteur trop grand pour la mémoire", correct: false}
      - {text: "Un point-virgule manquant après le vecteur", correct: false}
    answer: "Le compilateur ne connaît pas ce nom : soit l'en-tête manque, soit il fallait écrire `std::vector`."
  - key: qcm-no-matching
    format: multiple-choice
    question: "Après « no matching function for call to 'aire(int, int, int)' », que listent les lignes `note: candidate:` ?"
    choices:
      - {text: "Les versions de `aire` qui existent, avec leurs paramètres", correct: true}
      - {text: "Les fichiers du projet où la fonction `aire` est appelée", correct: false}
      - {text: "Les valeurs des trois arguments, au moment de l'appel", correct: false}
      - {text: "Les corrections que GCC a appliquées au code source", correct: false}
    answer: "On y compare les paramètres attendus à ceux qu'on a passés : c'est là qu'on voit l'argument en trop ou le mauvais type."
  - key: qcm-discards-qualifiers
    format: multiple-choice
    question: "Que signale « passing 'const Compte' as 'this' argument discards qualifiers » ?"
    choices:
      - {text: "Une fonction membre non `const` appelée sur un objet `const`", correct: true}
      - {text: "Une fonction membre `const` appelée sur un objet non `const`", correct: false}
      - {text: "Un objet `const` copié dans un objet non `const`", correct: false}
      - {text: "Un constructeur appelé avec trop d'arguments", correct: false}
    answer: "L'objet est constant, et la fonction ne promet pas de ne pas le modifier. Si elle ne modifie rien, on la déclare `const`."
  - key: qcm-deleted
    format: multiple-choice
    question: "Que signale « use of deleted function 'std::unique_ptr<...>::unique_ptr(const std::unique_ptr<...>&)' » ?"
    choices:
      - {text: "Une tentative de copier un `std::unique_ptr`", correct: true}
      - {text: "Un `std::unique_ptr` utilisé après un `delete`", correct: false}
      - {text: "Un `std::unique_ptr` qui désigne un objet détruit", correct: false}
      - {text: "Un `#include <memory>` oublié", correct: false}
    answer: "Le constructeur de copie est supprimé : un `std::unique_ptr` ne se copie pas. On le déplace avec `std::move`, ou l'on passe une référence."
  - key: bug-point-virgule-classe
    format: bug-fix
    question: |-
      Le compilateur répond « expected ';' after struct definition », à la ligne de l'accolade fermante de `Point`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      }

      int main() {
          std::println("{}", Point{1, 2}.x);
      }
      ```
    choices:
      - {text: "Ajouter un point-virgule après l'accolade fermante de `Point`", correct: true}
      - {text: "Ajouter un point-virgule après `int main()`", correct: false}
      - {text: "Ajouter un point-virgule après `struct Point`", correct: false}
      - {text: "Ajouter un point-virgule après `#include <print>`", correct: false}
    answer: |-
      ```cpp
      struct Point {
          int x;
          int y;
      };
      ```
      La définition d'une classe ou d'une `struct` se termine par un point-virgule. Ici, GCC désigne l'endroit
      exact. Pour un point-virgule oublié à la fin d'une instruction, il signale le début de la ligne suivante.
  - key: bug-not-declared
    format: bug-fix
    question: |-
      Le compilateur répond « 'string' was not declared in this scope ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          string nom = "Ada";
          std::println("{}", nom);
      }
      ```
    choices:
      - {text: "Écrire `std::string nom = \"Ada\";`", correct: true}
      - {text: "Écrire `String nom = \"Ada\";`", correct: false}
      - {text: "Écrire `#include <string.h>` à la place de `<string>`", correct: false}
      - {text: "Écrire `char nom = \"Ada\";`", correct: false}
    answer: |-
      ```cpp
      std::string nom = "Ada";
      ```
      L'en-tête est bien inclus, mais le type vit dans l'espace de noms `std`. Le compilateur le suggère d'ailleurs :
      « did you mean 'std::string'? ».
  - key: bug-no-matching
    format: bug-fix
    question: |-
      Le compilateur répond « too few arguments to function 'int aire(int, int)' », puis « note: declared here »
      sur la première ligne de la fonction. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int aire(int largeur, int hauteur) {
          return largeur * hauteur;
      }

      int main() {
          std::println("{}", aire(4));
      }
      ```
    choices:
      - {text: "Appeler la fonction avec deux arguments : `aire(4, 4)`", correct: true}
      - {text: "Appeler la fonction avec `aire(\"4\")`", correct: false}
      - {text: "Appeler la fonction avec `aire()`", correct: false}
      - {text: "Appeler la fonction avec `aire{4}`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", aire(4, 4));
      ```
      Le message cite la signature de la fonction : elle attend deux entiers, et l'appel n'en donne qu'un. La note
      indique où elle est déclarée.
  - key: bug-template-sort
    format: bug-fix
    question: |-
      Le compilateur produit quarante lignes d'erreurs dans `stl_algo.h`, avec « no match for 'operator-' », et
      « required from here » sur la ligne du `std::sort`. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <list>
      #include <print>

      int main() {
          std::list<int> valeurs{3, 1, 2};
          std::sort(valeurs.begin(), valeurs.end());
          std::println("{}", valeurs.front());
      }
      ```
    choices:
      - {text: "Appeler `valeurs.sort();`, la fonction membre de la liste", correct: true}
      - {text: "Inclure l'en-tête `<stl_algo.h>` en haut du fichier", correct: false}
      - {text: "Définir un `operator-` pour le type `int`", correct: false}
      - {text: "Appeler `std::sort(valeurs);` sans les itérateurs", correct: false}
    answer: |-
      ```cpp
      valeurs.sort();
      ```
      `required from here` désigne l'appel. Le premier `error:` dit ce qui manque : soustraire deux itérateurs, ce
      qu'une liste chaînée ne sait pas faire. `std::sort` exige un accès direct ; `std::list` a son propre tri.
  - key: situation-avalanche
    format: scenario
    question: |-
      Tu ajoutes une fonction à un fichier de cinq cents lignes, et le compilateur affiche soudain cent vingt
      erreurs, la plupart dans du code que tu n'as pas touché. Que fais-tu ?
    choices:
      - {text: "Je lis la première erreur, près de ma modification : une accolade ou un point-virgule manque sans doute", correct: true}
      - {text: "Je corrige les cent vingt erreurs une par une, de la dernière à la première", correct: false}
      - {text: "Je supprime le fichier et je le réécris, puisqu'il est entièrement faux", correct: false}
      - {text: "Je recompile plusieurs fois, jusqu'à ce que les erreurs disparaissent", correct: false}
    answer: |-
      Du code qui compilait ne devient pas faux tout seul. Une accolade non fermée, ou un point-virgule oublié,
      décale toute la lecture du compilateur. La première erreur est au plus près de la vraie faute ; `-fmax-errors=1`
      n'affiche qu'elle.
  - key: situation-template
    format: scenario
    question: |-
      Un débutant te montre une erreur de trois écrans, pleine de `std::__cxx11::basic_string<char, ...>` et de
      chemins dans `/usr/include`. Il pense avoir cassé la bibliothèque standard. Comment l'aides-tu à lire ?
    choices:
      - {text: "Chercher « required from here » pour sa ligne, puis le premier `error:` pour ce qui manque", correct: true}
      - {text: "Lire le message de la dernière ligne à la première, sans rien sauter", correct: false}
      - {text: "Réinstaller le compilateur, dont les en-têtes sont corrompus", correct: false}
      - {text: "Ouvrir le fichier de la bibliothèque cité, et y corriger la ligne indiquée", correct: false}
    answer: |-
      Le message retrace la chaîne d'instanciations du template. Deux lignes suffisent presque toujours : celle de
      son propre code, et la première erreur, qui nomme l'opération que son type ne fournit pas.
  - key: situation-undefined-ou-not-declared
    format: scenario
    question: |-
      Un collègue confond deux messages : « 'carre' was not declared in this scope » et « undefined reference to
      `carre(int)' ». Comment lui expliques-tu la différence ?
    choices:
      - {text: "Le premier vient du compilateur : la déclaration manque. Le second de l'éditeur de liens : la définition manque", correct: true}
      - {text: "Le premier vient de l'éditeur de liens : la définition manque. Le second du compilateur : la déclaration manque", correct: false}
      - {text: "Les deux viennent du compilateur, et signalent la même faute de frappe sur le nom de la fonction", correct: false}
      - {text: "Les deux viennent de l'éditeur de liens, et signalent qu'un fichier manque dans la commande", correct: false}
    answer: |-
      « Not declared » : le compilateur ne connaît pas le nom, il faut inclure l'en-tête. « Undefined reference » :
      il connaissait la déclaration, mais aucun fichier objet ne contient le code ; il faut ajouter le `.cpp` ou la
      bibliothèque.
  - key: situation-concepts
    format: scenario
    question: |-
      Ton équipe écrit une bibliothèque de templates. Ses utilisateurs se plaignent de messages d'erreur
      illisibles quand ils passent un mauvais type. Que proposes-tu ?
    choices:
      - {text: "Contraindre les templates par des concepts : l'erreur nomme l'exigence non remplie, à l'appel", correct: true}
      - {text: "Remplacer les templates par des macros, dont les erreurs sont plus courtes", correct: false}
      - {text: "Ajouter des commentaires dans les en-têtes, que le compilateur affichera", correct: false}
      - {text: "Demander aux utilisateurs de compiler sans avertissements", correct: false}
    answer: |-
      Sans contrainte, l'erreur surgit au fond de l'implémentation. Avec un concept (C++20), le compilateur refuse
      l'appel lui-même : « constraints not satisfied », suivi de ce que le type aurait dû savoir faire.
