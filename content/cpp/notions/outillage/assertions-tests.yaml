notion: assertions-tests
lesson: |-
  Une **assertion** est la ligne d'un test qui compare ce qu'on obtient à ce qu'on attend. Bien la choisir change
  deux choses : ce que le test **vérifie vraiment**, et ce que son **message d'échec** raconte.

  **Deux niveaux de sévérité.**

  | doctest, Catch2 | GoogleTest | Après un échec |
  |---|---|---|
  | `CHECK(...)` | `EXPECT_...` | le test **continue** : on voit tous les écarts en une exécution |
  | `REQUIRE(...)` | `ASSERT_...` | le test **s'arrête** : la suite n'aurait pas de sens |

  La règle : `CHECK` par défaut, `REQUIRE` pour une **condition préalable** à la suite (le vecteur n'est pas vide,
  le pointeur n'est pas nul, le fichier est ouvert).

  **La famille des assertions de doctest.**

  | Assertion | Réussit quand |
  |---|---|
  | `CHECK(a == b)` | l'expression est vraie |
  | `CHECK_FALSE(expr)` | l'expression est fausse |
  | `CHECK_EQ(a, b)`, `CHECK_NE`, `CHECK_LT`, `CHECK_GT` | la comparaison nommée est vraie |
  | `CHECK_THROWS(expr)` | l'expression lance une exception, quelle qu'elle soit |
  | `CHECK_THROWS_AS(expr, Type)` | elle lance une exception de ce type |
  | `CHECK_THROWS_WITH(expr, "message")` | elle lance une exception dont `what()` vaut ce texte |
  | `CHECK_NOTHROW(expr)` | elle ne lance rien |
  | `CHECK_MESSAGE(cond, "contexte")` | comme `CHECK`, avec un texte ajouté au message d'échec |

  Chacune existe aussi en version `REQUIRE_...`.

  **Écrire la comparaison dans l'assertion.** `CHECK(total == 42)` affiche, en cas d'échec, **les deux valeurs** :
  `CHECK( 40 == 42 )`. Avec `bool ok = (total == 42); CHECK(ok);`, le message ne dit que `false`. Pour la même
  raison, on écrit une assertion par fait : doctest refuse d'ailleurs de compiler `CHECK(a == 1 && b == 2)`, et
  la forme entre parenthèses, `CHECK((a == 1 && b == 2))`, n'affiche plus aucune valeur.

  **Comparer des nombres à virgule.** L'égalité stricte échoue pour une erreur d'arrondi au seizième chiffre :
  `0.1 + 0.2` vaut `0.30000000000000004`. On compare **avec une tolérance** :

  ```cpp
  CHECK(somme == doctest::Approx(0.3));                  // tolérance relative par défaut
  CHECK(mesure == doctest::Approx(9.81).epsilon(0.01));  // 1 % d'écart admis
  ```

  - Une tolérance **relative** (`epsilon`) est proportionnelle à la valeur : 1 % de 1000, c'est 10.
  - Une tolérance **absolue** est un écart fixe : `std::abs(a - b) < 1e-9`.
  - Près de **zéro**, la tolérance relative ne laisse passer presque rien : on y préfère une tolérance absolue.

  GoogleTest : `EXPECT_DOUBLE_EQ(a, b)` (quelques unités sur le dernier chiffre), `EXPECT_NEAR(a, b, tolerance)`.

  **Comparer des conteneurs.** `CHECK(v == std::vector<int>{1, 2, 3});` compare la taille et chaque élément. Une
  seule assertion, plus sûre qu'une boucle écrite dans le test.

  **Vérifier une exception.** `CHECK_THROWS_AS(v.at(9), std::out_of_range);`. L'expression fautive va **dans** la
  macro : appelée avant, sur sa propre ligne, elle interrompt le test.

  **Ce qu'une assertion de test n'est pas.** `assert`, de `<cassert>`, disparaît avec `NDEBUG`, et arrête tout le
  programme au premier échec, sans rapport. Il sert à vérifier une hypothèse dans le code, pas à écrire un test.

  **En entretien** : « `CHECK` continue, `REQUIRE` arrête : je réserve `REQUIRE` aux conditions préalables.
  J'écris la comparaison dans l'assertion pour que l'échec affiche les deux valeurs. Les `double` se comparent
  avec `Approx`, relatif ou absolu selon l'ordre de grandeur, et une exception se vérifie avec
  `CHECK_THROWS_AS`. »
cards:
  - key: severite
    format: course
    question: "Dans quel cas choisit-on `REQUIRE` plutôt que `CHECK` ?"
    choices:
      - {text: "Quand la suite du test n'a pas de sens si la condition est fausse", correct: true}
      - {text: "Quand la condition porte sur un nombre à virgule", correct: false}
      - {text: "Quand le test doit continuer après un échec", correct: false}
      - {text: "Quand la condition doit être vérifiée à la compilation", correct: false}
    answer: "`REQUIRE` protège la suite : inutile, et parfois dangereux, de lire le premier élément d'un vecteur qu'on vient de trouver vide. Pour tout le reste, `CHECK` montre tous les écarts d'un coup."
  - key: message-echec
    format: course
    question: "Pourquoi écrit-on `CHECK(total == 42)` plutôt que `bool ok = (total == 42); CHECK(ok);` ?"
    choices:
      - {text: "En cas d'échec, le message affiche les deux valeurs comparées", correct: true}
      - {text: "La première forme s'exécute plus vite que la seconde", correct: false}
      - {text: "La seconde forme ne compile pas avec doctest", correct: false}
      - {text: "La première forme arrête le test, la seconde le laisse continuer", correct: false}
    answer: "doctest décompose l'expression : `CHECK( 40 == 42 )`. Avec un booléen calculé avant, il ne peut afficher que `false`."
  - key: relatif-ou-absolu
    format: course
    question: "Quelle différence entre une tolérance relative et une tolérance absolue ?"
    choices:
      - {text: "La relative est proportionnelle à la valeur comparée ; l'absolue est un écart fixe", correct: true}
      - {text: "La relative est un écart fixe ; l'absolue est proportionnelle à la valeur comparée", correct: false}
      - {text: "La relative sert pour les entiers ; l'absolue pour les nombres à virgule", correct: false}
      - {text: "La relative arrête le test ; l'absolue le laisse continuer", correct: false}
    answer: "1 % de 1000, c'est 10 ; 1 % de 0,001, c'est presque rien. Près de zéro, on prend donc une tolérance absolue."
  - key: assert-n-est-pas-un-test
    format: course
    question: "Pourquoi n'écrit-on pas les vérifications d'un test avec `assert`, de `<cassert>` ?"
    choices:
      - {text: "Il disparaît avec `NDEBUG`, et arrête tout le programme au premier échec", correct: true}
      - {text: "Il ne sait comparer que des entiers", correct: false}
      - {text: "Il n'existe plus depuis C++20", correct: false}
      - {text: "Il continue toujours après un échec, sans rien signaler", correct: false}
    answer: "Une construction optimisée retire les `assert` : les tests ne vérifieraient plus rien. Et un `assert` qui échoue tue le programme, sans exécuter les autres tests ni produire de rapport."
  - key: vf-check-false
    format: true-false
    question: "`CHECK_FALSE(v.empty())` réussit quand le vecteur n'est pas vide."
    truth: true
    answer: "`CHECK_FALSE` réussit quand son expression est fausse : `empty()` renvoie `false` pour un vecteur qui a des éléments."
  - key: vf-throws-as-type
    format: true-false
    question: "`CHECK_THROWS_AS(f(), std::out_of_range)` réussit si `f()` lance une `std::invalid_argument`."
    truth: false
    answer: "Le type doit correspondre : `std::invalid_argument` ne dérive pas de `std::out_of_range`. `CHECK_THROWS(f())` accepterait toute exception."
  - key: vf-approx-zero
    format: true-false
    question: "Une tolérance relative convient bien pour comparer un résultat à zéro."
    truth: false
    answer: "Proportionnelle à la valeur, elle tend vers zéro avec elle. Autour de zéro, on compare avec un écart absolu."
  - key: vf-vecteurs
    format: true-false
    question: "`CHECK(v == std::vector<int>{1, 2, 3})` compare la taille et chaque élément des deux vecteurs."
    truth: true
    answer: "`operator==` de `std::vector` fait les deux. Une seule assertion suffit."
  - key: qcm-message
    format: multiple-choice
    question: "Quelle assertion doctest vérifie le texte renvoyé par `what()` de l'exception lancée ?"
    choices:
      - {text: "`CHECK_THROWS_WITH`", correct: true}
      - {text: "`CHECK_THROWS_AS`", correct: false}
      - {text: "`CHECK_NOTHROW`", correct: false}
      - {text: "`CHECK_MESSAGE`", correct: false}
    answer: "`CHECK_THROWS_WITH(expr, \"texte\")` compare le message. `CHECK_THROWS_AS` vérifie le type ; `CHECK_MESSAGE` ajoute un contexte à un `CHECK` ordinaire."
  - key: qcm-nothrow
    format: multiple-choice
    question: "Quelle assertion doctest vérifie qu'un appel ne lance aucune exception ?"
    choices:
      - {text: "`CHECK_NOTHROW(charger());`", correct: true}
      - {text: "`CHECK_FALSE(charger());`", correct: false}
      - {text: "`CHECK_THROWS(charger());`", correct: false}
      - {text: "`CHECK_NE(charger(), 0);`", correct: false}
    answer: "`CHECK_NOTHROW` échoue si l'expression lance. `CHECK_FALSE` teste la valeur renvoyée, pas l'absence d'exception."
  - key: qcm-near
    format: multiple-choice
    question: "Quelle assertion GoogleTest compare deux `double` avec une tolérance absolue choisie ?"
    choices:
      - {text: "`EXPECT_NEAR(a, b, 0.001);`", correct: true}
      - {text: "`EXPECT_EQ(a, b);`", correct: false}
      - {text: "`EXPECT_TRUE(a == b);`", correct: false}
      - {text: "`ASSERT_NE(a, b);`", correct: false}
    answer: "`EXPECT_NEAR(a, b, tolerance)` réussit si l'écart est inférieur à la tolérance. `EXPECT_DOUBLE_EQ` admet seulement quelques unités sur le dernier chiffre."
  - key: qcm-epsilon
    format: multiple-choice
    question: "Que fait `doctest::Approx(100.0).epsilon(0.05)` ?"
    choices:
      - {text: "Il accepte un écart de 5 % autour de 100", correct: true}
      - {text: "Il accepte un écart de 0,05 autour de 100", correct: false}
      - {text: "Il arrondit 100 à cinq chiffres après la virgule", correct: false}
      - {text: "Il compare à 100,05 exactement", correct: false}
    answer: "`epsilon` est une tolérance relative : 5 % de 100, soit 5. Les valeurs de 95 à 105 passent."
  - key: trous-check-false
    format: fill-in
    question: |-
      Complète avec l'assertion qui réussit quand l'expression est fausse :
      ```cpp
      TEST_CASE("un panier neuf est vide") {
          const Panier panier;
          ___(panier.contient("pomme"));
      }
      ```
    blanks:
      - [CHECK_FALSE, REQUIRE_FALSE]
    answer: "`CHECK_FALSE(expr)` réussit quand `expr` vaut `false`."
  - key: trous-approx
    format: fill-in
    question: |-
      Complète pour comparer avec une tolérance :
      ```cpp
      CHECK(moyenne({1.0, 2.0}) == doctest::___(1.5));
      ```
    blanks:
      - [Approx]
    answer: "`doctest::Approx` enveloppe la valeur attendue, et rend la comparaison tolérante."
  - key: trous-nothrow
    format: fill-in
    question: |-
      Complète avec l'assertion qui vérifie que l'appel ne lance rien :
      ```cpp
      ___(convertir("42"));
      ```
    blanks:
      - [CHECK_NOTHROW, REQUIRE_NOTHROW]
    answer: "`CHECK_NOTHROW(expr)` échoue si l'expression lance une exception."
  - key: trous-epsilon
    format: fill-in
    question: |-
      Complète pour accepter un écart relatif de 1 % :
      ```cpp
      CHECK(mesure == doctest::Approx(9.81).___(0.01));
      ```
    blanks:
      - [epsilon]
    answer: "`epsilon(0.01)` fixe la tolérance relative à 1 %."
  - key: code-tolerance-absolue
    format: code-output
    question: |-
      ```cpp
      #include <cmath>
      #include <print>

      bool proche(double a, double b, double tolerance) {
          return std::abs(a - b) <= tolerance;
      }

      int main() {
          const double x = 0.1 * 3;
          std::println("{} {} {}", x == 0.3, proche(x, 0.3, 1e-9), proche(x, 0.31, 1e-9));
      }
      ```
    choices:
      - {text: "`false true false`", correct: true}
      - {text: "`true true false`", correct: false}
      - {text: "`false true true`", correct: false}
      - {text: "`false false false`", correct: false}
    answer: "`false true false` : `0.1 * 3` vaut 0.30000000000000004, donc l'égalité stricte échoue. À un milliardième près, il est proche de 0.3, mais pas de 0.31."
    check:
      output: "false true false"
  - key: code-tolerance-relative
    format: code-output
    question: |-
      ```cpp
      #include <cmath>
      #include <print>

      bool proche(double obtenu, double attendu, double epsilon) {
          return std::abs(obtenu - attendu) <= epsilon * std::abs(attendu);
      }

      int main() {
          std::println("{} {} {}",
                       proche(1004.0, 1000.0, 0.01),
                       proche(1.5, 1.0, 0.01),
                       proche(0.001, 0.0, 0.01));
      }
      ```
    choices:
      - {text: "`true false false`", correct: true}
      - {text: "`true false true`", correct: false}
      - {text: "`false false false`", correct: false}
      - {text: "`true true true`", correct: false}
    answer: "`true false false` : 1 % de 1000 vaut 10, donc 1004 passe. 1 % de 1 vaut 0.01 : 1.5 est trop loin. Et 1 % de zéro vaut zéro : rien ne passe, d'où la tolérance absolue près de zéro."
    check:
      output: "true false false"
  - key: code-continue-ou-arrete
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>

      int echecs = 0;

      void verifier(bool condition) {
          if (!condition) {
              ++echecs;
          }
      }

      void exiger(bool condition) {
          if (!condition) {
              ++echecs;
              throw std::runtime_error{"test arrêté"};
          }
      }

      int main() {
          try {
              verifier(1 + 1 == 3);
              verifier(2 * 2 == 5);
              exiger(3 - 1 == 1);
              verifier(4 / 2 == 3);
          } catch (const std::runtime_error&) {
          }
          std::println("{}", echecs);
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "`2`", correct: false}
    answer: "`3` : `verifier` note l'échec et continue, comme `CHECK`. `exiger` note l'échec puis interrompt, comme `REQUIRE` : la dernière vérification n'est jamais exécutée."
    check:
      output: "3"
  - key: code-exception-attendue
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>
      #include <vector>

      template <typename Appel>
      bool lance_out_of_range(Appel appel) {
          try {
              appel();
          } catch (const std::out_of_range&) {
              return true;
          } catch (...) {
              return false;
          }
          return false;
      }

      int main() {
          const std::vector<int> v{1, 2, 3};
          std::println("{} {} {}",
                       lance_out_of_range([&] { v.at(9); }),
                       lance_out_of_range([&] { v.at(0); }),
                       lance_out_of_range([] { throw std::invalid_argument{"x"}; }));
      }
      ```
    choices:
      - {text: "`true false false`", correct: true}
      - {text: "`true false true`", correct: false}
      - {text: "`true true false`", correct: false}
      - {text: "`false false false`", correct: false}
    answer: "`true false false` : c'est le principe de `CHECK_THROWS_AS`. `at(9)` lance le bon type ; `at(0)` ne lance rien ; `std::invalid_argument` est une exception, mais pas du type attendu."
    check:
      output: "true false false"
  - key: bug-appel-hors-macro
    format: bug-fix
    question: |-
      Ce test devrait réussir : `at(9)` lance bien `std::out_of_range`. Il est pourtant interrompu par l'exception,
      et rapporté en échec. Quelle correction est la bonne ?
      ```cpp
      TEST_CASE("refuse un indice hors bornes") {
          const std::vector<int> v{1, 2, 3};
          const int valeur = v.at(9);
          CHECK_THROWS_AS(valeur, std::out_of_range);
      }
      ```
    choices:
      - {text: "Écrire `CHECK_THROWS_AS(v.at(9), std::out_of_range);`, sans la variable", correct: true}
      - {text: "Écrire `REQUIRE_THROWS_AS(valeur, std::out_of_range);`", correct: false}
      - {text: "Écrire `CHECK_NOTHROW(valeur);` à la place de l'assertion", correct: false}
      - {text: "Écrire `CHECK(valeur == std::out_of_range);`", correct: false}
    answer: |-
      ```cpp
      CHECK_THROWS_AS(v.at(9), std::out_of_range);
      ```
      L'exception part de la ligne `v.at(9)`, avant l'assertion : rien ne l'attrape, et le test s'arrête là.
      L'expression qui doit lancer se place dans la macro, qui l'exécute dans un `try`.
  - key: bug-booleen-intermediaire
    format: bug-fix
    question: |-
      Quand ce test échoue, le rapport dit seulement `CHECK( correct )` et `false` : impossible de savoir quel
      total a été calculé. Quelle correction est la bonne ?
      ```cpp
      TEST_CASE("additionne les prix du panier") {
          const int total = total_panier({12, 30});
          const bool correct = (total == 42);
          CHECK(correct);
      }
      ```
    choices:
      - {text: "Écrire `CHECK(total == 42);`", correct: true}
      - {text: "Écrire `REQUIRE(correct);`", correct: false}
      - {text: "Écrire `CHECK_FALSE(!correct);`", correct: false}
      - {text: "Écrire `CHECK(correct == true);`", correct: false}
    answer: |-
      ```cpp
      CHECK(total == 42);
      ```
      doctest affiche les deux opérandes de la comparaison qu'on lui donne : `CHECK( 40 == 42 )`. Un booléen
      calculé avant lui cache les valeurs.
  - key: bug-tolerance-trop-large
    format: bug-fix
    question: |-
      Ce test passe alors que `racine(2.0)` renvoie 1.5, une valeur fausse. Quelle correction est la bonne ?
      ```cpp
      TEST_CASE("calcule la racine de deux") {
          CHECK(racine(2.0) == doctest::Approx(1.41421).epsilon(0.1));
      }
      ```
    choices:
      - {text: "Resserrer la tolérance : `.epsilon(0.0001)`", correct: true}
      - {text: "Élargir la tolérance : `.epsilon(1.0)`", correct: false}
      - {text: "Remplacer `CHECK` par `REQUIRE`", correct: false}
      - {text: "Remplacer `CHECK` par `CHECK_FALSE`", correct: false}
    answer: |-
      ```cpp
      CHECK(racine(2.0) == doctest::Approx(1.41421).epsilon(0.0001));
      ```
      Une tolérance de 10 % laisse passer toute valeur entre 1.27 et 1.56. La tolérance doit couvrir l'erreur
      d'arrondi, pas l'erreur de calcul.
  - key: bug-conditions-groupees
    format: bug-fix
    question: |-
      Quand ce test échoue, le rapport dit seulement `false` : ni la condition fausse, ni la valeur obtenue. Quelle
      correction est la bonne ?
      ```cpp
      TEST_CASE("découpe une date") {
          const Date date = lire_date("2026-11-13");
          CHECK((date.annee == 2026 && date.mois == 11 && date.jour == 13));
      }
      ```
    choices:
      - {text: "Écrire trois `CHECK`, un par champ de la date", correct: true}
      - {text: "Écrire un seul `REQUIRE` avec les trois conditions", correct: false}
      - {text: "Écrire les trois conditions séparées par `||`", correct: false}
      - {text: "Écrire `CHECK_FALSE` devant les trois conditions", correct: false}
    answer: |-
      ```cpp
      CHECK(date.annee == 2026);
      CHECK(date.mois == 11);
      CHECK(date.jour == 13);
      ```
      Une assertion par fait : chaque échec affiche la valeur obtenue, et comme `CHECK` continue, on voit tous
      les champs faux en une exécution.
