notion: compilateurs
lesson: |-
  C++ est défini par une **norme** ISO, pas par un programme. Plusieurs **compilateurs** l'implémentent, chacun
  avec sa **bibliothèque standard**. Trois dominent.

  | Compilateur | Commande | Bibliothèque standard | Terrain |
  |---|---|---|---|
  | **GCC** | `g++` | libstdc++ | Linux, embarqué ; le défaut de la plupart des distributions |
  | **Clang** (LLVM) | `clang++` | libc++ (macOS), ou libstdc++ (Linux) | macOS, Android ; base de nombreux outils |
  | **MSVC** | `cl` | la STL de Microsoft | Windows, Visual Studio |

  Tous trois produisent du code rapide, et aucun n'est « le vrai » : un programme conforme compile avec les trois.

  **Choisir la norme.** Chaque compilateur a une norme par défaut, qui change avec ses versions. On la fixe donc
  toujours :

  ```
  g++ -std=c++23 main.cpp          # GCC et Clang
  cl /std:c++latest main.cpp       # MSVC
  ```

  `-std=gnu++23` ajoute les extensions de GCC ; `-std=c++23` s'en tient à la norme.

  **Le support d'une norme est progressif.** Une norme publiée n'est pas disponible le lendemain : chaque
  compilateur l'implémente fonctionnalité par fonctionnalité, sur plusieurs versions. `std::print`, de C++23, est
  arrivé dans GCC 14. Le site **cppreference** tient le tableau du support par compilateur (« compiler support »).

  Pour tester une fonctionnalité dans le code, il existe des **macros de test** :

  ```cpp
  #include <version>

  #ifdef __cpp_lib_print
  // std::print est disponible
  #endif
  ```

  **Compilateur et bibliothèque sont deux choses.** Une fonctionnalité du **langage** (les concepts, les modules)
  dépend du compilateur. Une fonctionnalité de la **bibliothèque** (`std::format`, `std::expected`) dépend de la
  bibliothèque standard utilisée. Clang avec libstdc++ et Clang avec libc++ n'offrent pas la même chose.

  **Pourquoi compiler avec plusieurs compilateurs.**

  - Chacun émet des **avertissements différents** : ce que l'un laisse passer, l'autre le signale.
  - Un code qui s'appuie sur une **extension** ou sur un **comportement indéfini** peut marcher avec l'un et
    casser avec l'autre.
  - Les messages d'erreur de l'un éclairent parfois ceux de l'autre.

  Un projet sérieux construit, en intégration continue, avec au moins deux d'entre eux.

  **Ce qui diffère entre eux.**

  - Les **options** : `-Wall -O2` pour GCC et Clang, `/W4 /O2` pour MSVC. CMake masque ces différences.
  - Les tailles définies par l'implémentation : `long` fait 8 octets sous Linux 64 bits, 4 sous Windows.
  - L'**ABI** : des fichiers objets produits par GCC et par MSVC ne se lient pas entre eux.

  **Compiler Explorer** (godbolt.org) compile un extrait avec des dizaines de compilateurs, et montre l'assembleur
  produit : l'outil de référence pour comparer.

  **En entretien** : « GCC, Clang et MSVC implémentent la même norme, chacun avec sa bibliothèque standard, et à
  son rythme : je vérifie le support d'une fonctionnalité sur cppreference. Je fixe toujours `-std`, et je
  compile avec au moins deux compilateurs : leurs avertissements se complètent. »
cards:
  - key: norme-et-compilateurs
    format: course
    question: "Quel lien y a-t-il entre la norme C++ et les compilateurs GCC, Clang et MSVC ?"
    choices:
      - {text: "La norme définit le langage ; chaque compilateur en est une implémentation", correct: true}
      - {text: "La norme décrit le comportement de GCC, que les autres imitent", correct: false}
      - {text: "Chaque compilateur définit sa propre norme, incompatible avec les autres", correct: false}
      - {text: "La norme est un programme, que chaque compilateur intègre tel quel", correct: false}
    answer: "C++ est spécifié par un document ISO. Un programme conforme doit compiler, et se comporter de la même façon, avec tout compilateur conforme."
  - key: option-std
    format: course
    question: "Pourquoi passe-t-on toujours l'option `-std=c++23` au compilateur ?"
    choices:
      - {text: "La norme par défaut dépend du compilateur et de sa version", correct: true}
      - {text: "Sans elle, le compilateur refuse tout fichier C++", correct: false}
      - {text: "Elle active l'optimisation du code produit", correct: false}
      - {text: "Elle active tous les avertissements du compilateur", correct: false}
    answer: "GCC 14 compile par défaut en C++17 avec ses extensions. Fixer la norme rend la construction identique d'une machine à l'autre."
  - key: support-progressif
    format: course
    question: "Une norme vient d'être publiée. Ses fonctionnalités sont-elles aussitôt utilisables ?"
    choices:
      - {text: "Non : chaque compilateur les implémente peu à peu, sur plusieurs versions", correct: true}
      - {text: "Oui : les compilateurs sont mis à jour le jour de la publication", correct: false}
      - {text: "Oui : la norme est téléchargée par le compilateur à chaque construction", correct: false}
      - {text: "Non : il faut attendre la norme suivante pour les utiliser", correct: false}
    answer: "Le support arrive fonctionnalité par fonctionnalité. Le tableau « compiler support » de cppreference dit quelle version de chaque compilateur l'offre."
  - key: langage-ou-bibliotheque
    format: course
    question: "De quoi dépend la disponibilité de `std::format` dans un projet ?"
    choices:
      - {text: "De la bibliothèque standard utilisée : libstdc++, libc++ ou celle de Microsoft", correct: true}
      - {text: "Du seul compilateur, quelle que soit la bibliothèque standard", correct: false}
      - {text: "Du système d'exploitation, qui fournit `std::format`", correct: false}
      - {text: "De l'éditeur de liens, qui génère `std::format`", correct: false}
    answer: "`std::format` est une fonctionnalité de bibliothèque. Les concepts ou les modules, eux, sont des fonctionnalités du langage, qui dépendent du compilateur."
  - key: vf-meme-norme
    format: true-false
    question: "GCC, Clang et MSVC implémentent la même norme C++."
    truth: true
    answer: "Chacun à son rythme, et avec ses extensions, mais la référence est la même norme ISO."
  - key: vf-clang-libstdcxx
    format: true-false
    question: "Clang ne peut s'utiliser qu'avec sa propre bibliothèque standard, libc++."
    truth: false
    answer: "Sous Linux, Clang utilise par défaut libstdc++, celle de GCC. Compilateur et bibliothèque standard se choisissent séparément."
  - key: vf-objets-compatibles
    format: true-false
    question: "Un fichier objet produit par GCC se lie sans difficulté avec un fichier objet produit par MSVC."
    truth: false
    answer: "Leurs ABI diffèrent : noms des symboles, passage des arguments, disposition des objets. On compile tout un programme avec la même famille de compilateurs."
  - key: vf-avertissements
    format: true-false
    question: "Deux compilateurs peuvent émettre des avertissements différents sur le même code."
    truth: true
    answer: "Chacun a ses propres analyses. C'est une raison de construire le projet avec plusieurs compilateurs."
  - key: qcm-msvc
    format: multiple-choice
    question: "Quel compilateur accompagne Visual Studio, sous Windows ?"
    choices:
      - {text: "MSVC", correct: true}
      - {text: "GCC", correct: false}
      - {text: "libc++", correct: false}
      - {text: "CMake", correct: false}
    answer: "MSVC, dont la commande est `cl`. libc++ est une bibliothèque standard, et CMake un outil de construction."
  - key: qcm-libstdcxx
    format: multiple-choice
    question: "Quelle est la bibliothèque standard de GCC ?"
    choices:
      - {text: "libstdc++", correct: true}
      - {text: "libc++", correct: false}
      - {text: "glibc", correct: false}
      - {text: "Boost", correct: false}
    answer: "libstdc++. libc++ est celle du projet LLVM, glibc est la bibliothèque du langage C, et Boost une collection de bibliothèques tierces."
  - key: qcm-support
    format: multiple-choice
    question: "Où vérifies-tu qu'une fonctionnalité de C++23 est disponible dans ta version de GCC ?"
    choices:
      - {text: "Dans le tableau « compiler support » de cppreference", correct: true}
      - {text: "Dans le fichier `CMakeLists.txt` du projet", correct: false}
      - {text: "Dans le texte de la norme ISO", correct: false}
      - {text: "Dans la sortie de la commande `g++ -Wall`", correct: false}
    answer: "cppreference liste, pour chaque fonctionnalité, la première version de chaque compilateur et de chaque bibliothèque qui la fournit."
  - key: qcm-godbolt
    format: multiple-choice
    question: "Quel outil en ligne compile un extrait avec de nombreux compilateurs, et montre l'assembleur produit ?"
    choices:
      - {text: "Compiler Explorer", correct: true}
      - {text: "Valgrind", correct: false}
      - {text: "clang-format", correct: false}
      - {text: "Ninja", correct: false}
    answer: "Compiler Explorer, à l'adresse godbolt.org. On y compare en quelques secondes le comportement de GCC, Clang et MSVC."
  - key: situation-deux-compilateurs
    format: scenario
    question: |-
      Un projet compile sans avertissement avec GCC depuis des années. Un nouveau client veut le construire avec
      Clang, qui signale trente avertissements et refuse deux fichiers. Qu'en conclus-tu ?
    choices:
      - {text: "Que le code s'appuyait sur des extensions ou des tolérances de GCC : il faut le corriger", correct: true}
      - {text: "Que Clang est défectueux : il faut demander au client d'installer GCC", correct: false}
      - {text: "Que les deux compilateurs n'implémentent pas la même norme", correct: false}
      - {text: "Que les avertissements de Clang peuvent être désactivés sans les lire", correct: false}
    answer: |-
      Un code conforme compile avec les deux. Ce que Clang refuse est le plus souvent une extension de GCC, ou
      une construction douteuse que GCC laissait passer. Construire avec les deux en intégration continue évite
      que ces écarts s'accumulent.
  - key: situation-fonctionnalite-absente
    format: scenario
    question: |-
      Tu écris `#include <print>` et `std::println`, et le compilateur d'un collègue répond « fatal error: print:
      No such file or directory ». Les deux machines compilent avec `-std=c++23`. Que se passe-t-il ?
    choices:
      - {text: "Sa bibliothèque standard, plus ancienne, ne fournit pas encore `<print>`", correct: true}
      - {text: "Son compilateur ignore l'option `-std=c++23`, réservée à GCC", correct: false}
      - {text: "L'en-tête `<print>` doit être installé à part, comme une bibliothèque tierce", correct: false}
      - {text: "Son système d'exploitation interdit l'affichage formaté", correct: false}
    answer: |-
      Accepter `-std=c++23` ne veut pas dire tout implémenter. `<print>` est arrivé avec GCC 14 ; une version plus
      ancienne connaît l'option, mais pas l'en-tête. On fixe une version minimale du compilateur pour le projet.
  - key: situation-long
    format: scenario
    question: |-
      Un programme écrit sous Linux range un horodatage en millisecondes dans un `long`. Compilé sous Windows avec
      MSVC, il donne des dates absurdes. Pourquoi ?
    choices:
      - {text: "`long` fait 4 octets avec MSVC, contre 8 sous Linux 64 bits : la valeur déborde", correct: true}
      - {text: "MSVC range les octets d'un `long` dans l'ordre inverse de GCC", correct: false}
      - {text: "MSVC compte le temps en secondes, et non en millisecondes", correct: false}
      - {text: "`long` est un type non signé avec MSVC, et signé avec GCC", correct: false}
    answer: |-
      La taille de `long` est définie par l'implémentation. Pour une taille garantie, on écrit `std::int64_t`, de
      l'en-tête `<cstdint>`, ou l'on utilise les types de `<chrono>`.
  - key: situation-extension
    format: scenario
    question: |-
      Un collègue déclare `int tampon[n];`, où `n` est lu au clavier. GCC l'accepte, MSVC le refuse. Que lui
      expliques-tu ?
    choices:
      - {text: "Qu'un tableau de taille variable est une extension de GCC, absente de la norme C++", correct: true}
      - {text: "Que MSVC n'implémente pas les tableaux, seulement `std::vector`", correct: false}
      - {text: "Que la norme l'autorise, et que MSVC est en retard sur ce point", correct: false}
      - {text: "Que le code compilera avec MSVC en ajoutant `-std=gnu++23`", correct: false}
    answer: |-
      En C++, la taille d'un tableau est une constante de compilation. GCC tolère cette construction héritée du
      C ; `-Wpedantic` la signale. La forme portable est `std::vector<int> tampon(n);`.
  - key: definition-compilateur
    format: definition
    question: "Que fait un compilateur C++, comme GCC ou Clang ?"
    choices:
      - {text: "Un programme qui traduit le code source en code machine", correct: true}
      - {text: "Un programme qui exécute le code source ligne par ligne", correct: false}
      - {text: "Un document qui définit les règles du langage", correct: false}
      - {text: "Un programme qui décrit les étapes de construction d'un projet", correct: false}
    answer: "GCC, Clang et MSVC sont des compilateurs. Le document qui définit le langage est la norme ; l'outil qui décrit la construction est CMake."
  - key: definition-bibliotheque-standard
    format: definition
    question: "Qu'est-ce que la bibliothèque standard, pour un compilateur C++ ?"
    choices:
      - {text: "L'implémentation de ce que la norme place dans `std` : conteneurs, algorithmes, flux", correct: true}
      - {text: "L'ensemble des bibliothèques tierces installées sur la machine", correct: false}
      - {text: "La partie du compilateur qui vérifie la syntaxe du code", correct: false}
      - {text: "Le dépôt en ligne d'où l'on télécharge des paquets C++", correct: false}
    answer: "libstdc++, libc++ et la STL de Microsoft en sont trois implémentations. Elles fournissent `std::vector`, `std::string`, `std::sort`..."
  - key: definition-abi
    format: definition
    question: "Qu'appelle-t-on l'ABI d'un compilateur ?"
    choices:
      - {text: "Les conventions binaires : noms des symboles, passage des arguments, disposition des objets", correct: true}
      - {text: "La liste complète des options acceptées sur sa ligne de commande", correct: false}
      - {text: "La version de la norme qu'il applique quand on ne précise rien", correct: false}
      - {text: "Le format de ses messages d'erreur et d'avertissement, ligne par ligne", correct: false}
    answer: "*Application Binary Interface*. Deux fichiers objets ne se lient que s'ils suivent la même ABI."
  - key: definition-extension
    format: definition
    question: "Qu'est-ce qu'une extension d'un compilateur ?"
    choices:
      - {text: "Une construction qu'il accepte, mais que la norme ne définit pas", correct: true}
      - {text: "Une fonctionnalité de la norme qu'il n'a pas encore implémentée", correct: false}
      - {text: "Un greffon qui ajoute la coloration syntaxique à un éditeur", correct: false}
      - {text: "Une option qui augmente le niveau d'optimisation", correct: false}
    answer: "Les tableaux de taille variable de GCC en sont une. Un code qui en dépend n'est pas portable ; `-Wpedantic` les signale."
