notion: tests-unitaires
lesson: |-
  Un **test unitaire** est un petit programme qui appelle une fonction avec des entrées connues, et **vérifie** le
  résultat. Il s'exécute en une fraction de seconde, sans intervention : on le relance à chaque modification, et il
  dit aussitôt si quelque chose s'est cassé.

  C++ n'a pas de cadre de test dans sa bibliothèque standard. Trois dominent : **doctest** (un seul en-tête, très
  rapide à compiler), **Catch2** (dont doctest reprend la syntaxe) et **GoogleTest** (le plus répandu en
  entreprise).

  **Un test avec doctest.**

  ```cpp
  #define DOCTEST_CONFIG_IMPLEMENT_WITH_MAIN
  #include "doctest.h"

  int carre(int n) { return n * n; }

  TEST_CASE("le carré d'un nombre positif") {
      CHECK(carre(3) == 9);
  }

  TEST_CASE("le carré d'un nombre négatif est positif") {
      CHECK(carre(-4) == 16);
  }
  ```

  La macro `DOCTEST_CONFIG_IMPLEMENT_WITH_MAIN`, définie dans **un seul** fichier, fait générer la fonction `main`
  qui lance tous les tests.

  **Les assertions.**

  | doctest, Catch2 | GoogleTest | Si la condition est fausse |
  |---|---|---|
  | `CHECK(x == 3)` | `EXPECT_EQ(x, 3)` | l'échec est noté, le test **continue** |
  | `REQUIRE(x == 3)` | `ASSERT_EQ(x, 3)` | le test **s'arrête** |
  | `CHECK_FALSE(vide)` | `EXPECT_FALSE(vide)` | |
  | `CHECK_THROWS_AS(f(), std::out_of_range)` | `EXPECT_THROW(f(), std::out_of_range)` | vérifie qu'une exception est lancée |
  | `CHECK(x == doctest::Approx(0.3))` | `EXPECT_DOUBLE_EQ(x, 0.3)` | compare des nombres à virgule |

  On prend `REQUIRE` quand la suite n'a pas de sens sans cette condition : vérifier qu'un vecteur n'est pas vide
  avant de lire son premier élément.

  **Ne jamais comparer deux `double` avec `==`.** `0.1 + 0.2` ne vaut pas exactement `0.3`. On compare avec une
  tolérance : `doctest::Approx`.

  **Un bon test.**

  - **Un comportement par test**, et un **nom qui le décrit** : `"refuse un retrait supérieur au solde"`.
  - La structure **préparer, agir, vérifier** (*Arrange, Act, Assert*).
  - **Indépendant** des autres : aucun ordre d'exécution, aucun état partagé.
  - **Déterministe** : ni heure, ni hasard, ni réseau.
  - Il couvre les **cas limites** : zéro, vide, négatif, la borne et ses deux voisines.

  **Ce qu'on teste.** Le comportement **public**, pas les détails internes : un test qui casse à chaque
  réorganisation du code ne protège de rien. Et quand on corrige un bug, on écrit d'abord le test qui le
  reproduit.

  **Les lancer.** Avec CMake : `enable_testing()`, `add_test(...)`, puis `ctest`. En intégration continue, on les
  exécute à chaque modification, de préférence avec les sanitizers.

  **En entretien** : « Un test unitaire vérifie un comportement, vite et sans dépendance externe. J'utilise doctest
  ou GoogleTest : `CHECK` continue après un échec, `REQUIRE` arrête le test. Je nomme chaque test par le
  comportement attendu, et je teste les cas limites. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un test unitaire ?"
    choices:
      - {text: "Un code qui appelle une fonction avec des entrées connues, et vérifie son résultat", correct: true}
      - {text: "Un programme qui mesure le temps d'exécution d'une fonction", correct: false}
      - {text: "Une relecture du code faite par un autre développeur", correct: false}
      - {text: "Une option du compilateur qui détecte les fautes de mémoire", correct: false}
    answer: "Il est automatique, rapide, et répétable : on le relance à chaque modification pour savoir si un comportement a changé."
  - key: check-ou-require
    format: course
    question: "Quelle différence entre `CHECK` et `REQUIRE` dans doctest ?"
    choices:
      - {text: "Après un échec, `CHECK` laisse le test continuer ; `REQUIRE` l'arrête", correct: true}
      - {text: "Après un échec, `CHECK` arrête le test ; `REQUIRE` le laisse continuer", correct: false}
      - {text: "`CHECK` vérifie une égalité ; `REQUIRE` vérifie qu'une exception est lancée", correct: false}
      - {text: "`CHECK` s'exécute à la compilation ; `REQUIRE` à l'exécution", correct: false}
    answer: "`REQUIRE` sert quand la suite n'a plus de sens : inutile de lire le premier élément d'un vecteur qu'on vient de trouver vide."
  - key: double
    format: course
    question: "Pourquoi ne compare-t-on pas deux `double` avec `==` dans un test ?"
    choices:
      - {text: "Les erreurs d'arrondi font que `0.1 + 0.2` ne vaut pas exactement `0.3`", correct: true}
      - {text: "L'opérateur `==` n'est pas défini pour le type `double`", correct: false}
      - {text: "Les macros de test n'acceptent que des entiers", correct: false}
      - {text: "Un `double` change de valeur entre deux lectures", correct: false}
    answer: "Les nombres à virgule sont des approximations binaires. On compare avec une tolérance : `doctest::Approx(0.3)`."
  - key: bon-test
    format: course
    question: "Laquelle de ces propriétés caractérise un bon test unitaire ?"
    choices:
      - {text: "Il donne le même résultat à chaque exécution, quel que soit l'ordre des tests", correct: true}
      - {text: "Il vérifie le plus grand nombre possible de comportements à la fois", correct: false}
      - {text: "Il dépend du résultat laissé par le test précédent", correct: false}
      - {text: "Il interroge la base de données de production", correct: false}
    answer: "Indépendant et déterministe. Un test qui échoue « parfois », ou seulement après un autre, détruit la confiance dans toute la suite."
  - key: vf-standard
    format: true-false
    question: "La bibliothèque standard de C++ fournit un cadre de tests unitaires."
    truth: false
    answer: "Il faut une bibliothèque tierce : doctest, Catch2 ou GoogleTest."
  - key: vf-check-continue
    format: true-false
    question: "Quand un `CHECK` échoue, les assertions suivantes du même test sont quand même évaluées."
    truth: true
    answer: "L'échec est enregistré, et le test se poursuit. On voit ainsi toutes les vérifications fausses en une exécution."
  - key: vf-details-internes
    format: true-false
    question: "Un bon test vérifie les variables privées de la classe testée."
    truth: false
    answer: "Il vérifie le comportement public. Un test lié aux détails internes casse à chaque réorganisation, sans qu'aucun comportement ait changé."
  - key: vf-bug
    format: true-false
    question: "Quand on corrige un bug, on écrit un test qui le reproduit."
    truth: true
    answer: "Le test échoue avant la correction, passe après, et empêche le bug de revenir."
  - key: qcm-exception
    format: multiple-choice
    question: "Quelle assertion doctest vérifie que `v.at(9)` lance `std::out_of_range` ?"
    choices:
      - {text: "`CHECK_THROWS_AS(v.at(9), std::out_of_range);`", correct: true}
      - {text: "`CHECK(v.at(9) == std::out_of_range);`", correct: false}
      - {text: "`CHECK_FALSE(v.at(9));`", correct: false}
      - {text: "`REQUIRE(throw v.at(9));`", correct: false}
    answer: "`CHECK_THROWS_AS(expression, type)` réussit si l'expression lance une exception de ce type."
  - key: qcm-approx
    format: multiple-choice
    question: "Quelle assertion doctest compare correctement un `double` calculé à `0.3` ?"
    choices:
      - {text: "`CHECK(x == doctest::Approx(0.3));`", correct: true}
      - {text: "`CHECK(x == 0.3);`", correct: false}
      - {text: "`CHECK(x = 0.3);`", correct: false}
      - {text: "`CHECK(static_cast<int>(x) == 0);`", correct: false}
    answer: "`doctest::Approx` compare avec une tolérance. Une égalité stricte échouerait pour une erreur d'arrondi au quinzième chiffre."
  - key: qcm-googletest
    format: multiple-choice
    question: "Quel est l'équivalent GoogleTest de `REQUIRE(x == 3)` ?"
    choices:
      - {text: "`ASSERT_EQ(x, 3);`", correct: true}
      - {text: "`EXPECT_EQ(x, 3);`", correct: false}
      - {text: "`CHECK_EQ(x, 3);`", correct: false}
      - {text: "`TEST_EQ(x, 3);`", correct: false}
    answer: "Dans GoogleTest, `ASSERT_...` arrête le test en cas d'échec, `EXPECT_...` le laisse continuer."
  - key: qcm-nom
    format: multiple-choice
    question: "Quel nom de test décrit le mieux ce qui est vérifié ?"
    choices:
      - {text: "`\"refuse un retrait supérieur au solde\"`", correct: true}
      - {text: "`\"test numéro 1 du compte\"`", correct: false}
      - {text: "`\"la fonction retirer\"`", correct: false}
      - {text: "`\"le retrait fonctionne\"`", correct: false}
    answer: "Le nom dit le comportement attendu. Quand le test échoue, on sait ce qui est cassé sans ouvrir le code."
  - key: trous-test-case
    format: fill-in
    question: |-
      Complète pour déclarer un test doctest :
      ```cpp
      ___("le carré de trois vaut neuf") {
          CHECK(carre(3) == 9);
      }
      ```
    blanks:
      - [TEST_CASE]
    answer: "`TEST_CASE(\"nom\")` déclare un test, enregistré automatiquement."
  - key: trous-check
    format: fill-in
    question: |-
      Complète avec l'assertion qui laisse le test continuer en cas d'échec :
      ```cpp
      TEST_CASE("additionne deux entiers") {
          ___(somme(2, 3) == 5);
      }
      ```
    blanks:
      - [CHECK]
    answer: "`CHECK` note l'échec et poursuit. `REQUIRE` arrêterait le test."
  - key: trous-require
    format: fill-in
    question: |-
      Complète avec l'assertion qui arrête le test si le vecteur est vide :
      ```cpp
      TEST_CASE("le premier élément est le plus petit") {
          const auto v = trier({3, 1, 2});
          ___(!v.empty());
          CHECK(v.front() == 1);
      }
      ```
    blanks:
      - [REQUIRE]
    answer: "Lire `v.front()` sur un vecteur vide serait un comportement indéfini : `REQUIRE` arrête le test avant."
  - key: trous-throws
    format: fill-in
    question: |-
      Complète pour vérifier que l'appel lance `std::invalid_argument` :
      ```cpp
      ___(diviser(1, 0), std::invalid_argument);
      ```
    blanks:
      - [CHECK_THROWS_AS, REQUIRE_THROWS_AS]
    answer: "`CHECK_THROWS_AS(expression, type)` vérifie le type de l'exception lancée."
  - key: code-mini-harnais
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int echecs = 0;

      void verifier(bool condition) {
          if (!condition) {
              ++echecs;
          }
      }

      int carre(int n) {
          return n * n;
      }

      int main() {
          verifier(carre(3) == 9);
          verifier(carre(-2) == -4);
          verifier(carre(0) == 0);
          std::println("{} échec", echecs);
      }
      ```
    choices:
      - {text: "`1 échec`", correct: true}
      - {text: "`0 échec`", correct: false}
      - {text: "`2 échec`", correct: false}
      - {text: "`3 échec`", correct: false}
    answer: "`1 échec` : le carré de -2 vaut 4, pas -4. Ici, c'est le test qui est faux : une vérification se relit comme le code."
    check:
      output: "1 échec"
  - key: code-double
    format: code-output
    question: |-
      ```cpp
      #include <cmath>
      #include <print>

      int main() {
          const double somme = 0.1 + 0.2;
          std::println("{} {}", somme == 0.3, std::abs(somme - 0.3) < 1e-9);
      }
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`false true` : 0.1 + 0.2 vaut 0.30000000000000004. L'égalité stricte échoue ; la comparaison avec une tolérance réussit. C'est ce que fait `doctest::Approx`."
    check:
      output: "false true"
  - key: code-assert
    format: code-output
    question: |-
      ```cpp
      #define NDEBUG
      #include <cassert>
      #include <print>

      int main() {
          int appels = 0;
          assert(++appels == 1);
          std::println("{}", appels);
      }
      ```
    choices:
      - {text: "`0`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "Rien : le programme s'arrête sur l'assertion", correct: false}
    answer: "`0` : avec `NDEBUG`, `assert` disparaît, et son expression n'est pas évaluée. Une assertion ne doit donc jamais contenir d'effet. Et un test ne s'écrit pas avec `assert`, que la construction optimisée désactive."
    check:
      output: "0"
  - key: code-cas-limites
    format: code-output
    question: |-
      ```cpp
      #include <print>

      bool est_majeur(int age) {
          return age > 18;
      }

      int main() {
          std::println("{} {} {}", est_majeur(17), est_majeur(18), est_majeur(19));
      }
      ```
    choices:
      - {text: "`false false true`", correct: true}
      - {text: "`false true true`", correct: false}
      - {text: "`false false false`", correct: false}
      - {text: "`true true true`", correct: false}
    answer: "`false false true` : la fonction écrit `>` au lieu de `>=`. Seul le test de la borne, 18, révèle la faute : 17 et 19 donnent le bon résultat."
    check:
      output: "false false true"
  - key: bug-egalite-double
    format: bug-fix
    question: |-
      Ce test échoue, alors que la fonction est juste : `0.1 + 0.2` ne vaut pas exactement `0.3`. Quelle correction
      est la bonne ?
      ```cpp
      TEST_CASE("additionne deux prix") {
          CHECK(somme(0.1, 0.2) == 0.3);
      }
      ```
    choices:
      - {text: "Écrire `CHECK(somme(0.1, 0.2) == doctest::Approx(0.3));`", correct: true}
      - {text: "Écrire `REQUIRE(somme(0.1, 0.2) == 0.3);`", correct: false}
      - {text: "Écrire `CHECK(somme(0.1, 0.2) = 0.3);`", correct: false}
      - {text: "Écrire `CHECK_FALSE(somme(0.1, 0.2) == 0.3);`", correct: false}
    answer: |-
      ```cpp
      CHECK(somme(0.1, 0.2) == doctest::Approx(0.3));
      ```
      Les nombres à virgule se comparent avec une tolérance. `REQUIRE` échouerait de la même façon, et
      `CHECK_FALSE` ferait passer le test pour une mauvaise raison.
  - key: bug-tests-dependants
    format: bug-fix
    question: |-
      Le second test passe quand toute la suite est lancée, et échoue quand on le lance seul. Quelle correction est
      la bonne ?
      ```cpp
      Compte compte;

      TEST_CASE("dépose de l'argent") {
          compte.deposer(50);
          CHECK(compte.solde() == 50);
      }

      TEST_CASE("retire de l'argent") {
          CHECK(compte.retirer(20));
          CHECK(compte.solde() == 30);
      }
      ```
    choices:
      - {text: "Créer un `Compte` dans chaque test, et y faire le dépôt dont le retrait a besoin", correct: true}
      - {text: "Inverser l'ordre des deux tests dans le fichier", correct: false}
      - {text: "Remplacer les `CHECK` du second test par des `REQUIRE`", correct: false}
      - {text: "Déclarer la variable globale `compte` avec `static`", correct: false}
    answer: |-
      ```cpp
      TEST_CASE("retire de l'argent") {
          Compte compte;
          compte.deposer(50);
          CHECK(compte.retirer(20));
          CHECK(compte.solde() == 30);
      }
      ```
      Le second test compte sur l'état laissé par le premier. Chaque test prépare ce dont il a besoin : il passe
      seul, et dans n'importe quel ordre.
  - key: bug-require-manquant
    format: bug-fix
    question: |-
      Quand `charger` renvoie un vecteur vide, ce test plante au lieu d'échouer proprement. Quelle correction est
      la bonne ?
      ```cpp
      TEST_CASE("charge les notes dans l'ordre") {
          const std::vector<int> notes = charger("notes.txt");
          CHECK(notes.size() == 3);
          CHECK(notes[0] == 12);
      }
      ```
    choices:
      - {text: "Écrire `REQUIRE(notes.size() == 3);`", correct: true}
      - {text: "Écrire `CHECK_FALSE(notes.size() == 3);`", correct: false}
      - {text: "Écrire `CHECK(notes[0] == 12);` en premier", correct: false}
      - {text: "Écrire `CHECK(notes.size() = 3);`", correct: false}
    answer: |-
      ```cpp
      REQUIRE(notes.size() == 3);
      CHECK(notes[0] == 12);
      ```
      Après l'échec du premier `CHECK`, le test continue et lit `notes[0]` sur un vecteur vide. `REQUIRE` arrête le
      test dès que la condition nécessaire à la suite est fausse.
  - key: bug-un-seul-cas
    format: bug-fix
    question: |-
      Ce test passe, alors que la fonction `est_majeur` renvoie `false` pour 18 ans. Quelle vérification manque ?
      ```cpp
      TEST_CASE("reconnaît un majeur") {
          CHECK(est_majeur(30));
          CHECK_FALSE(est_majeur(10));
      }
      ```
    choices:
      - {text: "`CHECK(est_majeur(18));`, la valeur limite", correct: true}
      - {text: "`CHECK(est_majeur(40));`, une valeur plus grande", correct: false}
      - {text: "`CHECK_FALSE(est_majeur(5));`, une valeur plus petite", correct: false}
      - {text: "`CHECK(est_majeur(30));` une seconde fois", correct: false}
    answer: |-
      ```cpp
      CHECK(est_majeur(18));
      CHECK_FALSE(est_majeur(17));
      ```
      Les fautes se logent aux bornes : `>` au lieu de `>=`. Des valeurs prises loin de la limite ne distinguent
      pas les deux. On teste la borne et ses deux voisines.
  - key: situation-regression
    format: scenario
    question: |-
      Un client signale que `prix_ttc(0)` renvoie `-1` au lieu de `0`. Tu as trouvé la ligne fautive. Dans quel
      ordre procèdes-tu ?
    choices:
      - {text: "J'écris un test qui échoue sur ce cas, je corrige, et je vérifie qu'il passe", correct: true}
      - {text: "Je corrige la ligne, et je vérifie à la main en lançant le programme une fois", correct: false}
      - {text: "Je corrige la ligne, puis je supprime les tests existants devenus inutiles", correct: false}
      - {text: "J'écris un test qui passe déjà, pour confirmer que le reste fonctionne", correct: false}
    answer: |-
      Le test écrit d'abord prouve qu'il détecte bien le bug : il échoue. Après la correction, il passe, et reste
      dans la suite : si quelqu'un réintroduit la faute dans six mois, il le saura dans la seconde.
  - key: situation-test-fragile
    format: scenario
    question: |-
      Une suite de tests échoue environ une fois sur dix, sans que le code ait changé. Un test compare le résultat
      d'une fonction à l'heure courante. L'équipe a pris l'habitude de relancer jusqu'au vert. Que proposes-tu ?
    choices:
      - {text: "Rendre le test déterministe : passer l'heure en paramètre, au lieu de la lire dans la fonction", correct: true}
      - {text: "Relancer la suite automatiquement trois fois, et ne garder que le meilleur résultat", correct: false}
      - {text: "Désactiver ce test, et tous ceux qui échouent de temps en temps", correct: false}
      - {text: "Ajouter une pause d'une seconde au début du test", correct: false}
    answer: |-
      Un test qui échoue au hasard apprend à l'équipe à ignorer les échecs, donc aussi les vrais. La cause est une
      dépendance cachée : l'horloge. Injectée en paramètre, elle devient une entrée comme une autre, et le test
      donne toujours le même résultat.
  - key: situation-refactor
    format: scenario
    question: |-
      Tu réorganises l'intérieur d'une classe sans changer son comportement. Trente tests échouent : ils
      vérifiaient l'ordre des appels internes et la valeur de membres privés. Que conclus-tu ?
    choices:
      - {text: "Que ces tests étaient liés à l'implémentation : ils doivent vérifier le comportement public", correct: true}
      - {text: "Que la réorganisation a introduit trente bugs dans la classe", correct: false}
      - {text: "Que les tests unitaires sont inutiles dès qu'on réorganise du code", correct: false}
      - {text: "Qu'il faut rendre publics tous les membres de la classe", correct: false}
    answer: |-
      Un test doit échouer quand le comportement change, et seulement alors. Lié aux détails internes, il échoue
      pour rien et fait obstacle aux améliorations. On le réécrit autour de ce que la classe promet à ses
      utilisateurs.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande quels cas tu testerais pour une fonction `moyenne(const std::vector<double>&)`.
      Quelle réponse est la plus complète ?
    choices:
      - {text: "Le cas normal, un seul élément, des valeurs négatives, et le vecteur vide", correct: true}
      - {text: "Trois vecteurs de dix éléments positifs, pris au hasard", correct: false}
      - {text: "Un vecteur d'un million d'éléments, pour vérifier la vitesse", correct: false}
      - {text: "Un seul vecteur de trois éléments : si celui-là passe, les autres aussi", correct: false}
    answer: |-
      Les défauts se cachent dans les cas limites : le vecteur vide (division par zéro : que doit faire la
      fonction ?), l'élément unique, les signes. On compare avec une tolérance, puisque ce sont des `double`.
