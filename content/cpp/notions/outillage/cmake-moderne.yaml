notion: cmake-moderne
lesson: |-
  Le « CMake moderne » (depuis la version 3.0) tient en une idée : **tout s'attache à une cible**. Une cible porte
  ce qu'il faut pour la **construire**, et ce qu'il faut pour **s'en servir**. Lier une bibliothèque suffit alors à
  hériter de ses en-têtes, de ses options et de ses propres dépendances.

  **Les exigences de construction et d'usage.** Chaque commande `target_...` prend un mot-clé de portée.

  | Portée | Sert à construire la cible | Se transmet à qui la lie |
  |---|---|---|
  | `PRIVATE` | oui | non |
  | `INTERFACE` | non | oui |
  | `PUBLIC` | oui | oui |

  ```
  add_library(geometrie src/cercle.cpp)
  target_include_directories(geometrie
      PUBLIC  include          # mes utilisateurs incluent <geometrie/cercle.hpp>
      PRIVATE src)             # mes en-têtes internes
  target_compile_features(geometrie PUBLIC cxx_std_23)
  target_link_libraries(geometrie
      PUBLIC  fmt::fmt         # fmt apparaît dans mes en-têtes publics
      PRIVATE spdlog::spdlog)  # spdlog ne sert que dans mes .cpp
  ```

  **Comment choisir.** La question est : « l'utilisateur de ma bibliothèque en a-t-il besoin pour compiler **son**
  code ? »

  - Une dépendance visible dans mes **en-têtes publics** : `PUBLIC`.
  - Une dépendance utilisée seulement dans mes **`.cpp`** : `PRIVATE`.
  - Une bibliothèque faite **uniquement d'en-têtes** n'a rien à construire : tout est `INTERFACE`, sur une cible
    `add_library(nom INTERFACE)`.

  **La transitivité.** Si `app` lie `geometrie`, elle reçoit automatiquement le répertoire `include`, le standard
  C++23 et `fmt::fmt`. Elle ne reçoit ni `src` ni `spdlog`.

  **Les cibles importées et les alias.** `find_package(fmt REQUIRED)` fournit `fmt::fmt`, une cible **importée**.
  Le `::` a un intérêt : si le nom est faux, CMake le dit à la configuration, au lieu de passer `-lfmt` à l'éditeur
  de liens. Pour ses propres bibliothèques, on crée un alias du même style :

  ```
  add_library(projet::geometrie ALIAS geometrie)
  ```

  **Ce qu'on n'écrit plus.**

  | Ancien, global | Moderne, par cible |
  |---|---|
  | `include_directories(...)` | `target_include_directories(cible ...)` |
  | `add_definitions(-DX)` | `target_compile_definitions(cible ...)` |
  | `set(CMAKE_CXX_FLAGS "-Wall")` | `target_compile_options(cible PRIVATE -Wall)` |
  | `link_libraries(...)` | `target_link_libraries(cible ...)` |
  | `set(CMAKE_CXX_STANDARD 23)` partout | `target_compile_features(cible PUBLIC cxx_std_23)` |

  Les commandes globales s'appliquent à **toutes** les cibles déclarées ensuite, y compris au code tiers.

  **Les expressions génératrices** `$<...>` sont évaluées à la génération : `$<CONFIG:Debug>` vaut 1 en
  configuration Debug, `$<BUILD_INTERFACE:...>` ne vaut que pendant la construction, pas après installation.

  **Les préréglages.** `CMakePresets.json` enregistre les configurations (générateur, type de construction,
  options) : `cmake --preset release` remplace une longue ligne de commande, la même pour tous.

  **En entretien** : « En CMake moderne, tout passe par les cibles : `PRIVATE` pour ce qui sert à construire,
  `INTERFACE` pour ce qui sert aux utilisateurs, `PUBLIC` pour les deux. Les dépendances se propagent par
  `target_link_libraries`, et je n'utilise plus les commandes globales. »
cards:
  - key: idee
    format: course
    question: "Quelle est l'idée centrale du CMake « moderne » ?"
    choices:
      - {text: "Attacher chaque réglage à une cible, qui le transmet à celles qui la lient", correct: true}
      - {text: "Ranger tous les réglages dans des variables globales, lues par chaque cible", correct: false}
      - {text: "Écrire un seul `CMakeLists.txt` par projet, sans sous-répertoire", correct: false}
      - {text: "Remplacer les cibles par des scripts shell, appelés par CMake", correct: false}
    answer: "Une cible porte ses exigences de construction et d'usage. Les dépendances les propagent, sans variable globale."
  - key: interface
    format: course
    question: "Que signifie la portée `INTERFACE` dans une commande `target_...` ?"
    choices:
      - {text: "Le réglage ne sert pas à construire la cible, mais se transmet à celles qui la lient", correct: true}
      - {text: "Le réglage sert à construire la cible, et ne se transmet à aucune autre", correct: false}
      - {text: "Le réglage ne s'applique qu'aux fichiers d'en-tête de la cible", correct: false}
      - {text: "Le réglage ne s'applique qu'aux classes abstraites de la cible", correct: false}
    answer: "`INTERFACE` décrit seulement l'usage. C'est la portée d'une bibliothèque faite uniquement d'en-têtes."
  - key: choisir
    format: course
    question: "Ta bibliothèque utilise `fmt` dans ses `.cpp`, jamais dans ses en-têtes publics. Avec quelle portée la lies-tu ?"
    choices:
      - {text: "`PRIVATE` : mes utilisateurs n'en ont pas besoin pour compiler leur code", correct: true}
      - {text: "`PUBLIC` : toute dépendance doit être transmise aux utilisateurs", correct: false}
      - {text: "`INTERFACE` : ma bibliothèque ne s'en sert pas pour se construire", correct: false}
      - {text: "Aucune : une bibliothèque ne peut pas en lier une autre", correct: false}
    answer: "La portée suit la visibilité : une dépendance cachée dans l'implémentation est `PRIVATE`. Si un type de `fmt` apparaissait dans un en-tête public, elle serait `PUBLIC`."
  - key: commandes-globales
    format: course
    question: "Quel est le défaut d'une commande globale comme `include_directories(...)` ?"
    choices:
      - {text: "Elle s'applique à toutes les cibles déclarées ensuite, code tiers compris", correct: true}
      - {text: "Elle ne s'applique qu'à la première cible du fichier", correct: false}
      - {text: "Elle n'est plus acceptée par les versions récentes de CMake", correct: false}
      - {text: "Elle ralentit l'exécution du programme construit", correct: false}
    answer: "Le réglage fuit vers des cibles qui ne l'ont pas demandé, et ne se transmet pas proprement aux utilisateurs. `target_include_directories` le limite à une cible."
  - key: vf-transitif
    format: true-false
    question: "Lier une bibliothèque transmet à la cible ses répertoires d'en-têtes déclarés `PUBLIC`."
    truth: true
    answer: "C'est la transitivité : `target_link_libraries` propage les exigences d'usage."
  - key: vf-private-transmis
    format: true-false
    question: "Une option de compilation déclarée `PRIVATE` sur une bibliothèque s'applique aussi aux programmes qui la lient."
    truth: false
    answer: "`PRIVATE` reste dans la cible. C'est la bonne portée pour `-Wall -Wextra`."
  - key: vf-alias
    format: true-false
    question: "Un nom de cible mal orthographié qui contient `::` est signalé par CMake dès la configuration."
    truth: true
    answer: "CMake sait qu'un nom avec `::` désigne une cible : s'il n'existe pas, c'est une erreur immédiate, pas une option `-l` passée à l'éditeur de liens."
  - key: vf-header-only
    format: true-false
    question: "Une bibliothèque faite uniquement d'en-têtes se déclare avec `add_library(nom INTERFACE)`."
    truth: true
    answer: "Elle n'a rien à compiler : ses réglages sont tous de portée `INTERFACE`."
  - key: qcm-standard
    format: multiple-choice
    question: "Quelle commande exige C++23 pour une cible et pour ceux qui la lient ?"
    choices:
      - {text: "`target_compile_features(geometrie PUBLIC cxx_std_23)`", correct: true}
      - {text: "`target_compile_options(geometrie PRIVATE cxx_std_23)`", correct: false}
      - {text: "`target_link_libraries(geometrie PUBLIC cxx_std_23)`", correct: false}
      - {text: "`add_definitions(-Dcxx_std_23)`", correct: false}
    answer: "`target_compile_features` exprime une exigence de langage, que CMake traduit en option selon le compilateur."
  - key: qcm-definition
    format: multiple-choice
    question: "Quelle commande moderne remplace `add_definitions(-DJOURNAL=1)` ?"
    choices:
      - {text: "`target_compile_definitions(app PRIVATE JOURNAL=1)`", correct: true}
      - {text: "`target_include_directories(app PRIVATE JOURNAL=1)`", correct: false}
      - {text: "`target_sources(app PRIVATE JOURNAL=1)`", correct: false}
      - {text: "`set(JOURNAL 1)`", correct: false}
    answer: "La macro n'est définie que pour la cible `app`. `set` crée une variable CMake, que le compilateur ne voit pas."
  - key: qcm-alias
    format: multiple-choice
    question: "Quelle ligne crée l'alias `projet::geometrie` pour la cible `geometrie` ?"
    choices:
      - {text: "`add_library(projet::geometrie ALIAS geometrie)`", correct: true}
      - {text: "`add_alias(projet::geometrie geometrie)`", correct: false}
      - {text: "`set(projet::geometrie geometrie)`", correct: false}
      - {text: "`target_link_libraries(projet::geometrie geometrie)`", correct: false}
    answer: "L'alias donne à sa propre bibliothèque le même style de nom qu'une cible importée par `find_package`."
  - key: qcm-presets
    format: multiple-choice
    question: "Quel fichier enregistre les configurations d'un projet, lancées par `cmake --preset` ?"
    choices:
      - {text: "`CMakePresets.json`", correct: true}
      - {text: "`CMakeCache.txt`", correct: false}
      - {text: "`compile_commands.json`", correct: false}
      - {text: "`.clang-tidy`", correct: false}
    answer: "`CMakePresets.json` se versionne. `CMakeCache.txt` est produit dans le répertoire de construction, et ne se partage pas."
  - key: trous-portee
    format: fill-in
    question: |-
      Complète la portée : ce répertoire sert à la bibliothèque et à ses utilisateurs.
      ```
      target_include_directories(geometrie ___ include)
      ```
    blanks:
      - [PUBLIC]
    answer: "`PUBLIC` : pour construire la cible, et pour qui la lie."
  - key: trous-interface
    format: fill-in
    question: |-
      Complète pour déclarer une bibliothèque faite uniquement d'en-têtes :
      ```
      add_library(outils ___)
      target_include_directories(outils INTERFACE include)
      ```
    blanks:
      - [INTERFACE]
    answer: "Une cible `INTERFACE` n'a aucun fichier à compiler."
  - key: trous-options
    format: fill-in
    question: |-
      Complète la commande qui ajoute des avertissements à la seule cible `app` :
      ```
      ___(app PRIVATE -Wall -Wextra)
      ```
    blanks:
      - [target_compile_options]
    answer: "`target_compile_options` attache les options à une cible."
  - key: trous-alias
    format: fill-in
    question: |-
      Complète pour donner un alias à la cible :
      ```
      add_library(projet::geometrie ___ geometrie)
      ```
    blanks:
      - [ALIAS]
    answer: "`ALIAS` crée un second nom pour une cible existante."
  - key: situation-fuite-dependance
    format: scenario
    question: |-
      Ta bibliothèque lie une bibliothèque de journaux en `PUBLIC`, alors qu'elle ne s'en sert que dans ses
      `.cpp`. Tes utilisateurs se plaignent : ils doivent l'installer, et leurs temps de compilation ont monté.
      Que changes-tu ?
    choices:
      - {text: "Je la lie en `PRIVATE` : elle ne fait pas partie de mon interface", correct: true}
      - {text: "Je la lie en `INTERFACE` : seuls mes utilisateurs en ont besoin", correct: false}
      - {text: "Je la retire de `target_link_libraries`, et je garde les `#include`", correct: false}
      - {text: "Je la déclare avec `link_libraries`, pour toutes les cibles", correct: false}
    answer: |-
      `PUBLIC` annonce à tort que mes utilisateurs en dépendent : ses en-têtes et ses options leur sont transmis.
      Une dépendance d'implémentation est `PRIVATE`.
  - key: situation-en-tete-public
    format: scenario
    question: |-
      Un en-tête public de ta bibliothèque déclare une fonction qui renvoie un type d'`Eigen`. Tu as lié `Eigen` en
      `PRIVATE`. Chez tes utilisateurs : « Eigen/Dense: No such file or directory ». Pourquoi ?
    choices:
      - {text: "Mon en-tête inclut Eigen : mes utilisateurs en ont besoin, il fallait `PUBLIC`", correct: true}
      - {text: "Eigen est faite uniquement d'en-têtes, et ne peut être liée à aucune cible", correct: false}
      - {text: "Mes utilisateurs doivent recopier les en-têtes d'Eigen dans leur projet", correct: false}
      - {text: "CMake ne transmet jamais les répertoires d'en-têtes d'une dépendance", correct: false}
    answer: |-
      Dès qu'une dépendance apparaît dans un en-tête public, elle fait partie de l'interface : `PUBLIC`. Avec
      `PRIVATE`, ses répertoires d'en-têtes ne sont pas transmis.
  - key: situation-avertissements-tiers
    format: scenario
    question: |-
      Un projet écrit `add_compile_options(-Wall -Wextra -Werror)` en tête de son `CMakeLists.txt`. Après l'ajout
      d'une bibliothèque tierce par `add_subdirectory`, la construction échoue sur des avertissements dans le code
      de cette bibliothèque. Que proposes-tu ?
    choices:
      - {text: "Attacher ces options à mes cibles, en `PRIVATE`, avec `target_compile_options`", correct: true}
      - {text: "Corriger à la main tous les avertissements du code de la bibliothèque tierce", correct: false}
      - {text: "Retirer `-Werror` de tout le projet, puisqu'il casse la construction", correct: false}
      - {text: "Déplacer `add_compile_options` à la dernière ligne du fichier", correct: false}
    answer: |-
      La commande globale impose mes exigences à du code que je ne maîtrise pas. En `PRIVATE` sur mes cibles, elles
      ne concernent que mon code.
  - key: situation-ligne-de-commande
    format: scenario
    question: |-
      Chaque développeur configure le projet avec sa propre ligne de commande de dix options, et les constructions
      diffèrent d'un poste à l'autre. Que proposes-tu ?
    choices:
      - {text: "Un `CMakePresets.json` versionné, et `cmake --preset` pour tout le monde", correct: true}
      - {text: "Un `CMakeCache.txt` versionné, recopié sur chaque poste", correct: false}
      - {text: "Un message dans la messagerie, qui rappelle les dix options", correct: false}
      - {text: "Des options écrites en dur dans `CMAKE_CXX_FLAGS`", correct: false}
    answer: |-
      Les préréglages nomment les configurations officielles, et l'intégration continue utilise les mêmes. Le
      cache, lui, contient des chemins propres à chaque machine.
