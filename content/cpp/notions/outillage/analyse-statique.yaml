notion: analyse-statique
lesson: |-
  L'**analyse statique** examine le code **sans l'exécuter**. Elle va plus loin que les avertissements du
  compilateur : elle suit les chemins d'exécution possibles, connaît les idiomes du langage, et vérifie des règles
  de style et de modernisation.

  **clang-tidy** est l'outil de référence. Il s'appuie sur le compilateur Clang : il comprend réellement le code,
  templates compris.

  ```
  clang-tidy main.cpp -checks='bugprone-*,modernize-*' -- -std=c++23
  ```

  Ce qui suit `--` sont les options de compilation. Sur un projet, on lui donne plutôt la **base de compilation**
  `compile_commands.json`, que CMake produit avec `-DCMAKE_EXPORT_COMPILE_COMMANDS=ON` :

  ```
  clang-tidy -p build src/main.cpp
  ```

  **Les familles de vérifications.**

  | Préfixe | Ce qu'il cherche |
  |---|---|
  | `bugprone-` | les constructions qui cachent souvent un bug : usage après déplacement, copie inutile dans une boucle |
  | `modernize-` | le code d'avant C++11 : `NULL`, boucles par indice, `typedef` |
  | `performance-` | les copies et conversions inutiles |
  | `readability-` | les noms, la complexité, les conditions redondantes |
  | `cppcoreguidelines-` | les règles des C++ Core Guidelines |
  | `clang-analyzer-` | l'analyse de chemins : pointeur nul, fuite, usage après libération |

  **La configuration** vit dans un fichier `.clang-tidy` à la racine du projet, versionné avec le code :

  ```
  Checks: 'bugprone-*,performance-*,modernize-use-nullptr'
  WarningsAsErrors: 'bugprone-*'
  ```

  **Les corrections automatiques.** Beaucoup de vérifications savent réécrire le code : `clang-tidy --fix`. On
  relit le résultat, et on le fait par petits lots.

  **Faire taire un faux positif**, à l'endroit précis : `// NOLINT(nom-de-la-vérification)` en fin de ligne, ou
  `// NOLINTNEXTLINE(...)` au-dessus.

  **cppcheck** est un outil indépendant, plus simple à lancer (il n'a pas besoin des options de compilation), avec
  peu de faux positifs. Il trouve moins de choses que clang-tidy.

  **Statique ou dynamique ?**

  | | Analyse statique | Sanitizers, Valgrind |
  |---|---|---|
  | Exécute le programme | non | oui |
  | Couvre | tous les chemins du code, même non testés | seulement ce qui s'exécute |
  | Faux positifs | oui | presque aucun |

  Les deux se complètent. On lance l'analyse statique en intégration continue, et de préférence dans l'éditeur,
  où le défaut se voit à la frappe.

  **En entretien** : « clang-tidy analyse le code sans l'exécuter : bugs probables, modernisation, performance,
  Core Guidelines. Je le configure dans `.clang-tidy`, je lui donne `compile_commands.json`, et je le fais tourner
  en intégration continue, en complément des sanitizers. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce que l'analyse statique ?"
    choices:
      - {text: "L'examen du code sans l'exécuter, à la recherche de défauts", correct: true}
      - {text: "L'exécution du code sous surveillance de sa mémoire", correct: false}
      - {text: "La mesure du temps passé dans chaque fonction", correct: false}
      - {text: "La mise en forme du code selon un fichier de style", correct: false}
    answer: "L'outil lit le code, comme un compilateur, et raisonne sur ce qu'il pourrait faire. Aucun test n'est nécessaire."
  - key: avantage
    format: course
    question: "Quel avantage l'analyse statique a-t-elle sur un sanitizer ?"
    choices:
      - {text: "Elle examine aussi les chemins du code qu'aucun test n'exécute", correct: true}
      - {text: "Elle ne produit jamais de faux positif", correct: false}
      - {text: "Elle détecte toutes les courses aux données", correct: false}
      - {text: "Elle n'a pas besoin du code source", correct: false}
    answer: "Un sanitizer ne voit que ce qui s'exécute. L'analyse statique couvre tout le code, au prix de quelques fausses alertes."
  - key: compile-commands
    format: course
    question: "Pourquoi clang-tidy a-t-il besoin du fichier `compile_commands.json` ?"
    choices:
      - {text: "Pour connaître les options avec lesquelles chaque fichier est compilé", correct: true}
      - {text: "Pour connaître la liste des vérifications à activer", correct: false}
      - {text: "Pour connaître le style de mise en forme du projet", correct: false}
      - {text: "Pour connaître les tests à lancer après l'analyse", correct: false}
    answer: "Il compile réellement le code : il lui faut le standard, les répertoires d'en-têtes et les macros. Les vérifications, elles, sont dans `.clang-tidy`."
  - key: familles
    format: course
    question: "Que cherchent les vérifications `modernize-` de clang-tidy ?"
    choices:
      - {text: "Le code d'avant C++11, comme `NULL` ou les boucles par indice", correct: true}
      - {text: "Les copies inutiles d'objets coûteux", correct: false}
      - {text: "Les noms qui ne suivent pas la convention", correct: false}
      - {text: "Les pointeurs nuls déréférencés sur un chemin", correct: false}
    answer: "Elles proposent `nullptr`, `auto`, `override`, la boucle sur un intervalle. Les copies relèvent de `performance-`, les noms de `readability-`."
  - key: vf-execute
    format: true-false
    question: "clang-tidy exécute le programme pour trouver ses défauts."
    truth: false
    answer: "Il analyse le code source. C'est ce qui lui permet d'examiner des chemins qu'aucun test ne parcourt."
  - key: vf-fix
    format: true-false
    question: "clang-tidy peut appliquer lui-même certaines corrections, avec `--fix`."
    truth: true
    answer: "Remplacer `NULL` par `nullptr`, ajouter `override` : ces réécritures sont mécaniques. On relit quand même le résultat."
  - key: vf-faux-positifs
    format: true-false
    question: "Un outil d'analyse statique ne signale jamais un défaut qui n'en est pas un."
    truth: false
    answer: "Il raisonne sans exécuter : il peut se tromper. On neutralise un faux positif à l'endroit précis, avec `// NOLINT`."
  - key: vf-cppcheck
    format: true-false
    question: "cppcheck est un outil d'analyse statique indépendant de Clang."
    truth: true
    answer: "Il a son propre analyseur, se lance sans options de compilation, et produit peu de faux positifs."
  - key: qcm-config
    format: multiple-choice
    question: "Dans quel fichier range-t-on la liste des vérifications de clang-tidy d'un projet ?"
    choices:
      - {text: "`.clang-tidy`", correct: true}
      - {text: "`.clang-format`", correct: false}
      - {text: "`CMakeLists.txt`", correct: false}
      - {text: "`compile_commands.json`", correct: false}
    answer: "`.clang-tidy`, à la racine, versionné avec le code : toute l'équipe et l'intégration continue ont les mêmes règles."
  - key: qcm-nolint
    format: multiple-choice
    question: "Comment fais-tu taire une vérification de clang-tidy sur une seule ligne ?"
    choices:
      - {text: "Par un commentaire `// NOLINT(nom-de-la-vérification)`", correct: true}
      - {text: "Par l'attribut `[[maybe_unused]]` sur la ligne", correct: false}
      - {text: "Par la suppression de la vérification dans `.clang-tidy`", correct: false}
      - {text: "Par l'option `-w` passée au compilateur", correct: false}
    answer: "`// NOLINT` agit sur sa ligne, et nomme la vérification : l'exception est visible et limitée."
  - key: qcm-export
    format: multiple-choice
    question: "Quelle option de CMake fait produire `compile_commands.json` ?"
    choices:
      - {text: "`-DCMAKE_EXPORT_COMPILE_COMMANDS=ON`", correct: true}
      - {text: "`-DCMAKE_BUILD_TYPE=Debug`", correct: false}
      - {text: "`-DCMAKE_CXX_STANDARD=23`", correct: false}
      - {text: "`-DCMAKE_VERBOSE_MAKEFILE=ON`", correct: false}
    answer: "Le fichier apparaît dans le répertoire de construction. clang-tidy, clangd et d'autres outils le lisent."
  - key: qcm-analyzer
    format: multiple-choice
    question: "Quelle famille de vérifications suit les chemins d'exécution pour trouver un pointeur nul déréférencé ?"
    choices:
      - {text: "`clang-analyzer-`", correct: true}
      - {text: "`readability-`", correct: false}
      - {text: "`modernize-`", correct: false}
      - {text: "`performance-`", correct: false}
    answer: "L'analyseur statique de Clang simule les branches du code. C'est la partie la plus coûteuse, et la plus profonde."
  - key: trous-checks
    format: fill-in
    question: |-
      Complète l'option qui choisit les vérifications :
      ```
      clang-tidy main.cpp -___='bugprone-*' -- -std=c++23
      ```
    blanks:
      - [checks]
    answer: "`-checks=` reçoit une liste de motifs, séparés par des virgules."
  - key: trous-fix
    format: fill-in
    question: |-
      Complète l'option qui applique les corrections proposées :
      ```
      clang-tidy --___ -p build src/main.cpp
      ```
    blanks:
      - [fix]
    answer: "`--fix` réécrit le fichier. On vérifie le résultat avant de le garder."
  - key: trous-nolint
    format: fill-in
    question: |-
      Complète le commentaire qui neutralise la vérification sur cette ligne :
      ```cpp
      int* p = NULL;  // ___(modernize-use-nullptr)
      ```
    blanks:
      - [NOLINT]
    answer: "`// NOLINT(...)` fait taire la vérification nommée, sur cette ligne seulement."
  - key: trous-p
    format: fill-in
    question: |-
      Complète l'option qui désigne le répertoire où se trouve `compile_commands.json` :
      ```
      clang-tidy -___ build src/main.cpp
      ```
    blanks:
      - [p]
    answer: "`-p build` : clang-tidy y lit les options de compilation de chaque fichier."
  - key: situation-use-after-move
    format: scenario
    question: |-
      Un bug vient d'un objet utilisé après avoir été passé à `std::move`. Le compilateur n'avait rien dit, et aucun
      test ne parcourait cette branche. Quel outil l'aurait signalé à la relecture ?
    choices:
      - {text: "clang-tidy, avec la vérification `bugprone-use-after-move`", correct: true}
      - {text: "AddressSanitizer, qui examine les branches non exécutées", correct: false}
      - {text: "clang-format, qui réordonne les lignes suspectes", correct: false}
      - {text: "L'éditeur de liens, qui refuse les objets déplacés", correct: false}
    answer: |-
      L'analyse statique lit toutes les branches, même celles qu'aucun test n'exécute. Un sanitizer n'aurait rien
      vu, puisque la branche ne tournait jamais.
  - key: situation-dix-mille
    format: scenario
    question: |-
      Tu actives clang-tidy sur un projet ancien : dix mille alertes. L'équipe veut renoncer. Que proposes-tu ?
    choices:
      - {text: "Commencer par peu de vérifications, les `bugprone-`, et bloquer les nouvelles alertes seulement", correct: true}
      - {text: "Activer `--fix` sur toutes les vérifications à la fois, et livrer le résultat", correct: false}
      - {text: "Ajouter `// NOLINT` à la fin de chacune des dix mille lignes signalées", correct: false}
      - {text: "Renoncer : l'analyse statique ne convient qu'aux projets neufs", correct: false}
    answer: |-
      On avance par famille, en commençant par ce qui trouve de vrais bugs, et l'on empêche d'abord la dette de
      grossir. Une réécriture automatique massive, non relue, est un risque ; dix mille `NOLINT` cachent tout.
  - key: situation-ci
    format: scenario
    question: |-
      clang-tidy tourne sur le poste de deux développeurs sur dix. Les défauts qu'il signale reviennent dans la
      branche principale. Que changes-tu ?
    choices:
      - {text: "Je le lance en intégration continue, avec les `bugprone-` traités comme des erreurs", correct: true}
      - {text: "Je demande aux huit autres de l'installer, sans rien vérifier", correct: false}
      - {text: "Je le retire des deux postes, pour que tout le monde soit à égalité", correct: false}
      - {text: "Je relis chaque modification à la main, à la recherche de ces défauts", correct: false}
    answer: |-
      Une règle que la construction officielle ne vérifie pas finit par ne plus être suivie. `WarningsAsErrors`
      dans `.clang-tidy` fait échouer la construction sur les familles choisies.
  - key: situation-complement
    format: scenario
    question: |-
      Un collègue demande : « On a déjà `-Wall -Wextra -Werror` et les sanitizers. À quoi bon clang-tidy ? » Que
      réponds-tu ?
    choices:
      - {text: "Qu'il voit des défauts plus profonds que les avertissements, y compris sur du code non testé", correct: true}
      - {text: "Qu'il remplace les sanitizers, qu'on peut donc retirer de la construction", correct: false}
      - {text: "Qu'il rend le programme plus rapide à l'exécution, une fois les alertes corrigées", correct: false}
      - {text: "Qu'il ne sert à rien de plus : les trois outils signalent exactement les mêmes défauts", correct: false}
    answer: |-
      Chaque outil a son angle : le compilateur pour les fautes évidentes, l'analyse statique pour les idiomes et
      les chemins, les sanitizers pour ce qui arrive vraiment à l'exécution. Ils se recouvrent peu.
