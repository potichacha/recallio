notion: cmake-bases
lesson: |-
  Taper `g++` à la main ne tient pas au-delà de quelques fichiers. **CMake** est l'outil de construction le plus
  répandu en C++ : on décrit le projet dans un fichier `CMakeLists.txt`, et CMake **génère** les fichiers d'un
  autre outil (Makefile, Ninja, projet Visual Studio) qui lance réellement le compilateur.

  **Un projet minimal.**

  ```
  cmake_minimum_required(VERSION 3.28)
  project(calculette LANGUAGES CXX)

  set(CMAKE_CXX_STANDARD 23)
  set(CMAKE_CXX_STANDARD_REQUIRED ON)

  add_executable(calculette main.cpp operations.cpp)
  ```

  **Construire.**

  ```
  cmake -S . -B build        # configuration : lit CMakeLists.txt, génère dans build/
  cmake --build build        # construction : compile ce qui a changé, puis lie
  ```

  Tout ce qui est généré va dans le répertoire `build/`, à côté des sources et jamais dedans : on le supprime sans
  regret, et on ne le versionne pas.

  **Les cibles.** CMake moderne s'organise autour de **cibles** (*targets*) : ce qu'on construit.

  | Commande | Crée |
  |---|---|
  | `add_executable(nom sources...)` | un programme |
  | `add_library(nom sources...)` | une bibliothèque |

  Chaque cible porte ses **propriétés** : ses sources, ses répertoires d'en-têtes, ses options, ses dépendances.

  ```
  add_library(operations operations.cpp)
  target_include_directories(operations PUBLIC include)

  add_executable(calculette main.cpp)
  target_link_libraries(calculette PRIVATE operations)
  target_compile_options(calculette PRIVATE -Wall -Wextra)
  ```

  **`target_link_libraries`** dit qu'une cible **dépend** d'une autre. CMake la lie, et lui transmet aussi les
  répertoires d'en-têtes de la bibliothèque : `calculette` trouve `operations.hpp` sans rien écrire de plus.

  **`PRIVATE`, `PUBLIC`, `INTERFACE`** disent à qui s'applique une propriété :

  | Mot-clé | S'applique à la cible | Se transmet à ceux qui la lient |
  |---|---|---|
  | `PRIVATE` | oui | non |
  | `PUBLIC` | oui | oui |
  | `INTERFACE` | non | oui |

  **Les types de construction.** `-DCMAKE_BUILD_TYPE=Debug` compile sans optimisation, avec les informations de
  débogage ; `Release` optimise (`-O3`, `NDEBUG`) ; `RelWithDebInfo` fait les deux.

  ```
  cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
  ```

  **Les dépendances externes.** `find_package(fmt REQUIRED)` cherche une bibliothèque installée, et fournit une
  cible importée (`fmt::fmt`) à passer à `target_link_libraries`. `FetchContent` télécharge et construit une
  dépendance avec le projet.

  **Les habitudes d'aujourd'hui.**

  - Raisonner en **cibles** (`target_...`), pas en variables globales (`include_directories`, `CMAKE_CXX_FLAGS`).
  - **Lister** les fichiers sources, plutôt que les ramasser avec `file(GLOB)` : CMake ne voit pas un fichier
    ajouté tant qu'on ne reconfigure pas.
  - Construire **hors des sources**, dans `build/`.

  **En entretien** : « CMake décrit le projet en cibles : `add_executable`, `add_library`, et
  `target_link_libraries` pour les dépendances, avec `PRIVATE` ou `PUBLIC` selon que la propriété se transmet. Il
  génère les fichiers de Make ou de Ninja ; je configure dans `build/`, puis `cmake --build`. »
cards:
  - key: role
    format: course
    question: "Que fait CMake ?"
    choices:
      - {text: "Il génère, à partir d'une description du projet, les fichiers d'un outil comme Make ou Ninja", correct: true}
      - {text: "Il compile lui-même les fichiers source, à la place de `g++` ou de Clang", correct: false}
      - {text: "Il télécharge et installe le compilateur C++ sur la machine", correct: false}
      - {text: "Il reformate les fichiers source selon les conventions du projet", correct: false}
    answer: "CMake est un générateur de systèmes de construction. Il lit `CMakeLists.txt`, et produit ce que Make, Ninja ou Visual Studio exécuteront."
  - key: cible
    format: course
    question: "Qu'est-ce qu'une cible (target), dans CMake ?"
    choices:
      - {text: "Ce qu'on construit : un exécutable ou une bibliothèque, avec ses propriétés", correct: true}
      - {text: "La machine sur laquelle le programme sera installé", correct: false}
      - {text: "Le répertoire où sont rangés les fichiers générés", correct: false}
      - {text: "La version minimale de CMake exigée par le projet", correct: false}
    answer: "Une cible naît de `add_executable` ou `add_library`. On lui attache ses sources, ses répertoires d'en-têtes, ses options et ses dépendances."
  - key: link-libraries
    format: course
    question: "Que fait `target_link_libraries(app PRIVATE outils)` ?"
    choices:
      - {text: "Il déclare que `app` dépend de `outils` : elle est liée, et ses en-têtes publics sont transmis", correct: true}
      - {text: "Il recopie les fichiers source de `outils` dans le répertoire de la cible `app`", correct: false}
      - {text: "Il installe la bibliothèque `outils` dans les répertoires du système", correct: false}
      - {text: "Il renomme la cible `app` en `outils` pour l'édition de liens", correct: false}
    answer: "La dépendance porte plus que l'édition de liens : les propriétés `PUBLIC` et `INTERFACE` de `outils` s'appliquent à `app`."
  - key: private-public
    format: course
    question: "Quelle différence entre `PRIVATE` et `PUBLIC` dans une commande `target_...` ?"
    choices:
      - {text: "`PRIVATE` vaut pour la cible seule ; `PUBLIC` se transmet aussi à celles qui la lient", correct: true}
      - {text: "`PRIVATE` vaut pour les fichiers `.cpp` ; `PUBLIC` pour les fichiers `.hpp`", correct: false}
      - {text: "`PRIVATE` cache la cible aux autres projets ; `PUBLIC` la publie en ligne", correct: false}
      - {text: "`PRIVATE` compile en mode `Debug` ; `PUBLIC` compile en mode `Release`", correct: false}
    answer: "Un répertoire d'en-têtes dont les utilisateurs de la bibliothèque ont besoin est `PUBLIC`. Une option qui ne concerne que sa propre compilation est `PRIVATE`."
  - key: vf-compile
    format: true-false
    question: "CMake compile lui-même les fichiers source."
    truth: false
    answer: "Il génère les fichiers de Make ou de Ninja, qui appellent le compilateur. `cmake --build` lance simplement cet outil."
  - key: vf-build-dir
    format: true-false
    question: "Les fichiers générés par CMake se rangent dans un répertoire séparé des sources."
    truth: true
    answer: "C'est la construction hors des sources : `cmake -S . -B build`. Le répertoire `build/` se supprime et se recrée à volonté."
  - key: vf-glob
    format: true-false
    question: "`file(GLOB ...)` est la façon recommandée de lister les fichiers source d'une cible."
    truth: false
    answer: "CMake ne remarque pas un fichier ajouté tant qu'on ne reconfigure pas. On liste les sources explicitement."
  - key: vf-release
    format: true-false
    question: "Le type de construction `Release` active l'optimisation."
    truth: true
    answer: "Avec GCC : `-O3 -DNDEBUG`. `Debug` compile avec `-g`, sans optimisation."
  - key: qcm-executable
    format: multiple-choice
    question: "Quelle commande crée la cible d'un programme à partir de `main.cpp` ?"
    choices:
      - {text: "`add_executable(app main.cpp)`", correct: true}
      - {text: "`add_library(app main.cpp)`", correct: false}
      - {text: "`project(app main.cpp)`", correct: false}
      - {text: "`target_link_libraries(app main.cpp)`", correct: false}
    answer: "`add_executable(nom sources...)`. `add_library` crée une bibliothèque, `project` nomme le projet."
  - key: qcm-configurer
    format: multiple-choice
    question: "Quelle commande configure le projet du répertoire courant dans `build/` ?"
    choices:
      - {text: "`cmake -S . -B build`", correct: true}
      - {text: "`cmake --build build`", correct: false}
      - {text: "`make build`", correct: false}
      - {text: "`cmake install build`", correct: false}
    answer: "`-S` donne le répertoire des sources, `-B` celui de la construction. `cmake --build build` vient ensuite, pour compiler."
  - key: qcm-standard
    format: multiple-choice
    question: "Quelle ligne demande à CMake de compiler en C++23 ?"
    choices:
      - {text: "`set(CMAKE_CXX_STANDARD 23)`", correct: true}
      - {text: "`set(CMAKE_BUILD_TYPE 23)`", correct: false}
      - {text: "`project(app VERSION 23)`", correct: false}
      - {text: "`cmake_minimum_required(VERSION 23)`", correct: false}
    answer: "`CMAKE_CXX_STANDARD` fixe le standard. Par cible, on écrit `target_compile_features(app PRIVATE cxx_std_23)`."
  - key: qcm-dependance-externe
    format: multiple-choice
    question: "Quelle commande cherche une bibliothèque déjà installée sur la machine ?"
    choices:
      - {text: "`find_package`", correct: true}
      - {text: "`add_library`", correct: false}
      - {text: "`include_directories`", correct: false}
      - {text: "`add_executable`", correct: false}
    answer: "`find_package(fmt REQUIRED)` fournit une cible importée, comme `fmt::fmt`, à passer à `target_link_libraries`."
  - key: trous-add-executable
    format: fill-in
    question: |-
      Complète pour créer le programme `app` :
      ```
      ___(app main.cpp outils.cpp)
      ```
    blanks:
      - [add_executable]
    answer: "`add_executable(nom sources...)` crée une cible exécutable."
  - key: trous-link
    format: fill-in
    question: |-
      Complète pour que `app` utilise la bibliothèque `outils` :
      ```
      ___(app PRIVATE outils)
      ```
    blanks:
      - [target_link_libraries]
    answer: "`target_link_libraries` déclare la dépendance d'une cible envers une autre."
  - key: trous-build
    format: fill-in
    question: |-
      Complète la commande qui compile le projet configuré dans `build/` :
      ```
      cmake --___ build
      ```
    blanks:
      - [build]
    answer: "`cmake --build build` lance l'outil de construction généré."
  - key: trous-add-library
    format: fill-in
    question: |-
      Complète pour créer la bibliothèque `outils` :
      ```
      ___(outils outils.cpp)
      ```
    blanks:
      - [add_library]
    answer: "`add_library(nom sources...)` crée une cible bibliothèque."
  - key: situation-undefined-reference
    format: scenario
    question: |-
      Tu ajoutes `stats.cpp` au projet, et l'édition de liens échoue : « undefined reference to `moyenne(...)' ».
      Le fichier compile seul sans erreur. Que vérifies-tu dans `CMakeLists.txt` ?
    choices:
      - {text: "Que `stats.cpp` figure dans les sources de la cible", correct: true}
      - {text: "Que `stats.hpp` figure dans les sources de la cible", correct: false}
      - {text: "Que `CMAKE_CXX_STANDARD` vaut bien 23", correct: false}
      - {text: "Que `cmake_minimum_required` est assez récent", correct: false}
    answer: |-
      Un fichier qui n'est pas listé dans `add_executable` ou `add_library` n'est pas compilé : sa définition
      manque à l'édition de liens. On l'ajoute, et CMake se reconfigure à la construction suivante.
  - key: situation-en-tete-introuvable
    format: scenario
    question: |-
      Ta bibliothèque `outils` range ses en-têtes dans `include/`. Le programme `app`, qui la lie, échoue à
      compiler : « outils.hpp: No such file or directory ». Quelle ligne corrige le projet ?
    choices:
      - {text: "`target_include_directories(outils PUBLIC include)`", correct: true}
      - {text: "`target_include_directories(outils PRIVATE include)`", correct: false}
      - {text: "`add_executable(app include/outils.hpp)`", correct: false}
      - {text: "`set(CMAKE_BUILD_TYPE include)`", correct: false}
    answer: |-
      `PUBLIC` transmet le répertoire à toutes les cibles qui lient `outils` : `app` trouve l'en-tête sans rien
      déclarer de plus. Avec `PRIVATE`, seule la bibliothèque le verrait.
  - key: situation-lent
    format: scenario
    question: |-
      Un collègue se plaint que son programme, construit avec CMake, est dix fois plus lent que le même code
      compilé à la main avec `g++ -O2`. Que regardes-tu d'abord ?
    choices:
      - {text: "Le type de construction : sans `CMAKE_BUILD_TYPE=Release`, rien n'est optimisé", correct: true}
      - {text: "La version de CMake : les anciennes versions produisent du code lent", correct: false}
      - {text: "Le nom du répertoire de construction : `build/` ralentit l'exécution", correct: false}
      - {text: "Le nombre de cibles : chaque cible ajoute un coût à l'exécution", correct: false}
    answer: |-
      Par défaut, avec les générateurs Make et Ninja, le type de construction est vide : aucune option
      d'optimisation. `cmake -S . -B build -DCMAKE_BUILD_TYPE=Release` active `-O3`.
  - key: situation-options-globales
    format: scenario
    question: |-
      Un `CMakeLists.txt` ancien commence par `include_directories(...)` et
      `set(CMAKE_CXX_FLAGS "-Wall -I...")`, qui s'appliquent à toutes les cibles. Ajouter une bibliothèque tierce
      déclenche des centaines d'avertissements dans son code. Que proposes-tu ?
    choices:
      - {text: "Attacher les options à chaque cible, avec `target_compile_options` et `target_include_directories`", correct: true}
      - {text: "Retirer `-Wall` du projet, pour que la bibliothèque tierce compile en silence", correct: false}
      - {text: "Recopier les fichiers de la bibliothèque tierce dans les sources du projet", correct: false}
      - {text: "Écrire un second `CMakeLists.txt` qui remplace le premier", correct: false}
    answer: |-
      Des réglages globaux s'imposent à tout, y compris au code qu'on ne maîtrise pas. CMake moderne attache
      chaque propriété à une cible : `-Wall -Wextra` en `PRIVATE` sur ses propres cibles, et la bibliothèque
      tierce garde ses options.
