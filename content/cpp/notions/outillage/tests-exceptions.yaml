notion: tests-exceptions
lesson: |-
  Une fonction qui signale ses erreurs par des exceptions a **deux comportements** à tester : le résultat quand
  tout va bien, et l'exception quand l'entrée est invalide. Le second est souvent oublié.

  **À la main**, le test s'écrit avec un `try` et un `catch`, et un piège : il doit **échouer si rien n'est
  lancé**.

  ```cpp
  bool lance = false;
  try {
      diviser(1, 0);
  } catch (const std::invalid_argument&) {
      lance = true;
  }
  // le test réussit seulement si lance vaut true
  ```

  **Avec un cadre de test**, une macro fait ce travail.

  | doctest, Catch2 | GoogleTest | Vérifie |
  |---|---|---|
  | `CHECK_THROWS(expr)` | `EXPECT_ANY_THROW(expr)` | qu'une exception, quelle qu'elle soit, est lancée |
  | `CHECK_THROWS_AS(expr, Type)` | `EXPECT_THROW(expr, Type)` | qu'une exception **de ce type** est lancée |
  | `CHECK_THROWS_WITH(expr, "texte")` | | le message, `what()` |
  | `CHECK_THROWS_WITH_AS(expr, "texte", Type)` | | le type et le message |
  | `CHECK_NOTHROW(expr)` | `EXPECT_NO_THROW(expr)` | qu'**aucune** exception n'est lancée |

  ```cpp
  TEST_CASE("refuse de diviser par zéro") {
      CHECK_THROWS_AS(diviser(1, 0), std::invalid_argument);
      CHECK_NOTHROW(diviser(1, 2));
  }
  ```

  **Préférer le type précis.** `CHECK_THROWS` réussit pour **n'importe quelle** exception, y compris un
  `std::bad_alloc` ou une faute sans rapport. `CHECK_THROWS_AS` vérifie que la fonction échoue **pour la bonne
  raison**.

  **Le type et l'héritage.** `CHECK_THROWS_AS(f(), std::exception)` réussit pour toute classe dérivée : il se
  comporte comme un `catch (const std::exception&)`. Pour vérifier un type exact, on nomme la classe la plus
  dérivée.

  **Tester le message, avec mesure.** Vérifier `what()` au caractère près rend le test fragile : il casse dès
  qu'on reformule. On le réserve aux messages qui font partie du contrat.

  **Vérifier l'état après l'échec.** Un bon test d'exception vérifie aussi que l'objet est **resté cohérent** :
  après un `retirer` refusé, le solde n'a pas bougé. C'est la garantie forte.

  ```cpp
  TEST_CASE("un retrait refusé ne change pas le solde") {
      Compte compte{50};
      CHECK_THROWS_AS(compte.retirer(80), std::invalid_argument);
      CHECK(compte.solde() == 50);
  }
  ```

  **Une seule expression par macro.** On isole l'appel qui doit lancer : si la préparation lance elle aussi, le
  test réussit pour une mauvaise raison.

  **En entretien** : « Je teste le chemin d'erreur comme le chemin normal : `CHECK_THROWS_AS` avec le type précis,
  `CHECK_NOTHROW` pour le cas valide, et je vérifie que l'objet n'a pas changé après l'exception. J'évite
  `CHECK_THROWS` seul, qui accepte n'importe quelle exception. »
cards:
  - key: deux-chemins
    format: course
    question: "Que faut-il tester pour une fonction qui lance une exception quand son entrée est invalide ?"
    choices:
      - {text: "Le résultat pour une entrée valide, et l'exception pour une entrée invalide", correct: true}
      - {text: "Seulement le résultat pour une entrée valide", correct: false}
      - {text: "Seulement l'exception pour une entrée invalide", correct: false}
      - {text: "Rien : une fonction qui lance ne peut pas être testée", correct: false}
    answer: "Le chemin d'erreur fait partie du comportement. Non testé, il casse sans que personne le remarque."
  - key: type-precis
    format: course
    question: "Pourquoi préférer `CHECK_THROWS_AS(f(), std::invalid_argument)` à `CHECK_THROWS(f())` ?"
    choices:
      - {text: "Le second réussit pour n'importe quelle exception, même sans rapport avec le test", correct: true}
      - {text: "Le second ne compile pas quand la fonction renvoie une valeur", correct: false}
      - {text: "Le second arrête le programme quand une exception est lancée", correct: false}
      - {text: "Le second exécute la fonction deux fois de suite", correct: false}
    answer: "Un `std::bad_alloc` ou une exception venue d'un bug ferait passer le test. Le type précis vérifie que la fonction échoue pour la bonne raison."
  - key: etat-apres
    format: course
    question: "Après avoir vérifié qu'une opération lance, que vérifie encore un bon test ?"
    choices:
      - {text: "Que l'objet est resté dans l'état d'avant l'opération", correct: true}
      - {text: "Que l'exception a été lancée une seconde fois", correct: false}
      - {text: "Que l'objet a été détruit par l'exception", correct: false}
      - {text: "Que le test suivant ne s'exécute pas", correct: false}
    answer: "Une opération qui échoue ne devrait rien changer : c'est la garantie forte. Le test la rend visible."
  - key: piege-manuel
    format: course
    question: "Quel est le piège d'un test d'exception écrit à la main, avec `try` et `catch` ?"
    choices:
      - {text: "Oublier de le faire échouer quand aucune exception n'est lancée", correct: true}
      - {text: "Attraper l'exception par référence constante", correct: false}
      - {text: "Placer l'appel à tester dans le bloc `try`", correct: false}
      - {text: "Donner un nom à l'exception attrapée", correct: false}
    answer: "Si la fonction ne lance rien, le `catch` est simplement sauté : sans un drapeau vérifié ensuite, le test passe à tort."
  - key: vf-nothrow
    format: true-false
    question: "`CHECK_NOTHROW(f())` échoue si `f` lance une exception."
    truth: true
    answer: "Elle vérifie le cas valide : l'appel doit se terminer normalement."
  - key: vf-derivee
    format: true-false
    question: "`CHECK_THROWS_AS(f(), std::exception)` échoue si `f` lance `std::out_of_range`."
    truth: false
    answer: "Elle réussit : comme un `catch`, la macro accepte les classes dérivées. Pour vérifier le type précis, on nomme `std::out_of_range`."
  - key: vf-message
    format: true-false
    question: "Vérifier le texte exact de `what()` dans chaque test rend la suite fragile."
    truth: true
    answer: "Reformuler un message ferait échouer des dizaines de tests. On vérifie le type, et le message seulement s'il fait partie du contrat."
  - key: vf-throws-tout
    format: true-false
    question: "`CHECK_THROWS(f())` vérifie le type de l'exception lancée."
    truth: false
    answer: "Elle accepte n'importe quelle exception. C'est `CHECK_THROWS_AS` qui vérifie le type."
  - key: qcm-googletest
    format: multiple-choice
    question: "Quel est l'équivalent GoogleTest de `CHECK_THROWS_AS(f(), std::out_of_range)` ?"
    choices:
      - {text: "`EXPECT_THROW(f(), std::out_of_range);`", correct: true}
      - {text: "`EXPECT_ANY_THROW(f());`", correct: false}
      - {text: "`EXPECT_NO_THROW(f());`", correct: false}
      - {text: "`EXPECT_EQ(f(), std::out_of_range);`", correct: false}
    answer: "`EXPECT_THROW(instruction, type)`. `EXPECT_ANY_THROW` accepte toute exception."
  - key: qcm-message
    format: multiple-choice
    question: "Quelle macro doctest vérifie le message de l'exception ?"
    choices:
      - {text: "`CHECK_THROWS_WITH(f(), \"solde insuffisant\");`", correct: true}
      - {text: "`CHECK_THROWS_AS(f(), \"solde insuffisant\");`", correct: false}
      - {text: "`CHECK_NOTHROW(f(), \"solde insuffisant\");`", correct: false}
      - {text: "`CHECK(f() == \"solde insuffisant\");`", correct: false}
    answer: "`CHECK_THROWS_WITH` compare `what()` au texte. `CHECK_THROWS_AS` attend un type, pas une chaîne."
  - key: qcm-cas-valide
    format: multiple-choice
    question: "Quelle macro vérifie que `diviser(6, 3)` ne lance aucune exception ?"
    choices:
      - {text: "`CHECK_NOTHROW(diviser(6, 3));`", correct: true}
      - {text: "`CHECK_THROWS(diviser(6, 3));`", correct: false}
      - {text: "`CHECK_FALSE(diviser(6, 3));`", correct: false}
      - {text: "`REQUIRE_THROWS(diviser(6, 3));`", correct: false}
    answer: "`CHECK_NOTHROW` réussit si l'expression se termine normalement."
  - key: qcm-borne
    format: multiple-choice
    question: "Une fonction lance pour un âge négatif. Quelles valeurs testes-tu en priorité ?"
    choices:
      - {text: "`-1` et `0`, de part et d'autre de la limite", correct: true}
      - {text: "`-1000` et `1000`, loin de la limite", correct: false}
      - {text: "`50`, une valeur ordinaire", correct: false}
      - {text: "`-1` seulement, le cas d'erreur", correct: false}
    answer: "L'erreur d'une unité se loge à la borne : `-1` doit lancer, `0` ne doit pas. `CHECK_THROWS_AS` pour l'un, `CHECK_NOTHROW` pour l'autre."
  - key: trous-throws-as
    format: fill-in
    question: |-
      Complète la macro doctest qui vérifie le type de l'exception :
      ```cpp
      ___(compte.retirer(80), std::invalid_argument);
      ```
    blanks:
      - [CHECK_THROWS_AS, REQUIRE_THROWS_AS]
    answer: "`CHECK_THROWS_AS(expression, type)`."
  - key: trous-nothrow
    format: fill-in
    question: |-
      Complète la macro doctest qui vérifie qu'aucune exception n'est lancée :
      ```cpp
      ___(compte.retirer(20));
      ```
    blanks:
      - [CHECK_NOTHROW, REQUIRE_NOTHROW]
    answer: "`CHECK_NOTHROW(expression)`."
  - key: trous-expect-throw
    format: fill-in
    question: |-
      Complète la macro GoogleTest qui vérifie le type de l'exception :
      ```cpp
      ___(v.at(9), std::out_of_range);
      ```
    blanks:
      - [EXPECT_THROW, ASSERT_THROW]
    answer: "`EXPECT_THROW(instruction, type)`."
  - key: trous-drapeau
    format: fill-in
    question: |-
      Complète ce test écrit à la main, pour qu'il sache si l'exception a été lancée :
      ```cpp
      bool lance = false;
      try {
          diviser(1, 0);
      } catch (const std::invalid_argument&) {
          lance = ___;
      }
      ```
    blanks:
      - ["true"]
    answer: "Le drapeau passe à `true` dans le `catch`. Le test réussit seulement s'il l'est."
  - key: code-drapeau
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>

      int diviser(int a, int b) {
          if (b == 0) {
              throw std::invalid_argument{"division par zéro"};
          }
          return a / b;
      }

      bool lance(int a, int b) {
          try {
              diviser(a, b);
          } catch (const std::invalid_argument&) {
              return true;
          }
          return false;
      }

      int main() {
          std::println("{} {}", lance(1, 0), lance(1, 2));
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : avec 0, l'exception est attrapée. Avec 2, rien n'est lancé : la fonction atteint `return false`."
    check:
      output: "true false"
  - key: code-mauvais-type
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>
      #include <vector>

      template <typename E, typename F>
      bool lance(F f) {
          try {
              f();
          } catch (const E&) {
              return true;
          } catch (...) {
              return false;
          }
          return false;
      }

      int main() {
          const std::vector<int> v{1, 2, 3};
          const auto acces = [&v] { return v.at(9); };
          std::println("{} {} {}",
                       lance<std::out_of_range>(acces),
                       lance<std::invalid_argument>(acces),
                       lance<std::exception>(acces));
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`true false false`", correct: false}
      - {text: "`true true true`", correct: false}
      - {text: "`false false true`", correct: false}
    answer: "`true false true` : `at(9)` lance `std::out_of_range`. Ce n'est pas un `std::invalid_argument`, mais c'est un `std::exception` : un test sur la classe de base accepte les dérivées."
    check:
      output: "true false true"
  - key: code-etat-conserve
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>

      class Compte {
      public:
          explicit Compte(int solde) : solde_{solde} {}
          void retirer(int montant) {
              if (montant > solde_) {
                  throw std::invalid_argument{"solde insuffisant"};
              }
              solde_ -= montant;
          }
          int solde() const { return solde_; }

      private:
          int solde_;
      };

      int main() {
          Compte compte{50};
          try {
              compte.retirer(20);
              compte.retirer(80);
          } catch (const std::invalid_argument& e) {
              std::print("{} ", e.what());
          }
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "`solde insuffisant 30`", correct: true}
      - {text: "`solde insuffisant 50`", correct: false}
      - {text: "`solde insuffisant -50`", correct: false}
      - {text: "`30`", correct: false}
    answer: "`solde insuffisant 30` : le premier retrait réussit. Le second lance avant de modifier le solde : l'objet reste cohérent."
    check:
      output: "solde insuffisant 30"
  - key: code-nothrow
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>
      #include <string>

      int age(const std::string& texte) {
          const int valeur = std::stoi(texte);
          if (valeur < 0) {
              throw std::out_of_range{"âge négatif"};
          }
          return valeur;
      }

      template <typename F>
      bool ne_lance_pas(F f) {
          try {
              f();
              return true;
          } catch (...) {
              return false;
          }
      }

      int main() {
          std::println("{} {} {}",
                       ne_lance_pas([] { return age("0"); }),
                       ne_lance_pas([] { return age("-1"); }),
                       ne_lance_pas([] { return age("abc"); }));
      }
      ```
    choices:
      - {text: "`true false false`", correct: true}
      - {text: "`true false true`", correct: false}
      - {text: "`false false false`", correct: false}
      - {text: "`true true false`", correct: false}
    answer: "`true false false` : 0 est accepté. -1 fait lancer `std::out_of_range` par la fonction, et `\"abc\"` fait lancer `std::invalid_argument` par `std::stoi`."
    check:
      output: "true false false"
  - key: bug-test-qui-passe-toujours
    format: bug-fix
    question: |-
      Ce test devrait échouer : `diviser` ne lance rien pour un diviseur nul. Il affiche pourtant `test réussi`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <stdexcept>

      int diviser(int a, int b) {
          return b == 0 ? 0 : a / b;
      }

      int main() {
          try {
              diviser(1, 0);
          } catch (const std::invalid_argument&) {
          }
          std::println("test réussi");
      }
      ```
    choices:
      - {text: "Noter dans le `catch` que l'exception a eu lieu, et n'afficher la réussite que dans ce cas", correct: true}
      - {text: "Attraper `const std::exception&` à la place de `const std::invalid_argument&`", correct: false}
      - {text: "Placer l'affichage de `test réussi` dans le bloc `try`, après l'appel", correct: false}
      - {text: "Ajouter un `catch (...)` vide après le premier `catch`", correct: false}
    answer: |-
      ```cpp
      bool lance = false;
      try {
          diviser(1, 0);
      } catch (const std::invalid_argument&) {
          lance = true;
      }
      std::println("{}", lance ? "test réussi" : "test raté");
      ```
      Quand rien n'est lancé, le `catch` est sauté et le programme continue : le test ne vérifie rien.
      `CHECK_THROWS_AS` d'un cadre de test fait cette vérification.
  - key: bug-throws-trop-large
    format: bug-fix
    question: |-
      Ce test passe, alors que `charger` échoue pour une tout autre raison que le fichier manquant : elle lit un
      vecteur vide avec `at(0)`. Quelle correction est la bonne ?
      ```cpp
      TEST_CASE("signale un fichier introuvable") {
          CHECK_THROWS(charger("absent.txt"));
      }
      ```
    choices:
      - {text: "Écrire `CHECK_THROWS_AS(charger(\"absent.txt\"), FichierIntrouvable);`", correct: true}
      - {text: "Écrire `CHECK_NOTHROW(charger(\"absent.txt\"));`", correct: false}
      - {text: "Écrire `REQUIRE_THROWS(charger(\"absent.txt\"));`", correct: false}
      - {text: "Écrire `CHECK(charger(\"absent.txt\"));`", correct: false}
    answer: |-
      ```cpp
      CHECK_THROWS_AS(charger("absent.txt"), FichierIntrouvable);
      ```
      `CHECK_THROWS` accepte toute exception : ici un `std::out_of_range` dû à un bug. Avec le type attendu, le
      test échoue, et révèle le défaut.
  - key: bug-preparation-dans-macro
    format: bug-fix
    question: |-
      Ce test devrait vérifier que `retirer` refuse un montant trop grand. Il passe même quand `retirer` ne vérifie
      rien : c'est le constructeur de `Compte`, appelé avec un solde négatif, qui lance. Quelle correction est la
      bonne ?
      ```cpp
      TEST_CASE("refuse un retrait supérieur au solde") {
          CHECK_THROWS_AS(Compte{-10}.retirer(80), std::invalid_argument);
      }
      ```
    choices:
      - {text: "Construire un compte valide avant la macro, et n'y mettre que l'appel de `retirer`", correct: true}
      - {text: "Remplacer `CHECK_THROWS_AS` par `CHECK_THROWS`, sans le type", correct: false}
      - {text: "Remplacer `std::invalid_argument` par `std::exception`", correct: false}
      - {text: "Ajouter un second `CHECK_THROWS_AS` identique au premier", correct: false}
    answer: |-
      ```cpp
      Compte compte{50};
      CHECK_THROWS_AS(compte.retirer(80), std::invalid_argument);
      ```
      La macro doit contenir le seul appel dont on teste l'échec. Si la préparation lance aussi, le test réussit
      pour une mauvaise raison.
  - key: bug-etat-non-verifie
    format: bug-fix
    question: |-
      Ce test passe, alors que `retirer` débite le compte **avant** de lancer : après l'exception, le solde est
      faux. Quelle vérification manque ?
      ```cpp
      TEST_CASE("refuse un retrait supérieur au solde") {
          Compte compte{50};
          CHECK_THROWS_AS(compte.retirer(80), std::invalid_argument);
      }
      ```
    choices:
      - {text: "`CHECK(compte.solde() == 50);` après la macro", correct: true}
      - {text: "`CHECK_NOTHROW(compte.retirer(80));` après la macro", correct: false}
      - {text: "`CHECK_THROWS(compte.solde());` après la macro", correct: false}
      - {text: "`CHECK(compte.solde() == -30);` après la macro", correct: false}
    answer: |-
      ```cpp
      CHECK_THROWS_AS(compte.retirer(80), std::invalid_argument);
      CHECK(compte.solde() == 50);
      ```
      Lancer ne suffit pas : l'opération refusée ne doit rien avoir changé. Le test doit le vérifier, sinon ce
      défaut passe inaperçu.
