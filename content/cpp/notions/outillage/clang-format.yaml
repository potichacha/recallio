notion: clang-format
lesson: |-
  **clang-format** remet en forme le code C++ : indentation, espaces, retours à la ligne, position des accolades.
  Il ne change **que la présentation**, jamais le sens.

  **Pourquoi s'en servir.** Le style est une affaire de goût, et les discussions sur l'emplacement d'une accolade
  n'ont pas de fin. Avec un formateur, la question est tranchée une fois, par un fichier ; plus personne n'en
  parle en revue de code, et les différences entre deux versions ne montrent que les vrais changements.

  **La configuration** est un fichier `.clang-format`, à la racine du projet, versionné avec le code :

  ```
  BasedOnStyle: Google
  IndentWidth: 4
  ColumnLimit: 120
  ```

  `BasedOnStyle` part d'un style connu (`LLVM`, `Google`, `Chromium`, `Mozilla`, `WebKit`, `Microsoft`), que les
  lignes suivantes ajustent. `clang-format -style=llvm -dump-config` affiche toutes les options.

  **Les commandes.**

  ```
  clang-format -i src/main.cpp              # reformate le fichier sur place
  clang-format --dry-run --Werror src/*.cpp # vérifie sans modifier : échoue si un fichier n'est pas formaté
  ```

  La seconde forme sert en intégration continue.

  **Dans la pratique.**

  - L'**éditeur** formate à l'enregistrement : le code est toujours au format, sans y penser.
  - Un **crochet de pré-commit** ou l'**intégration continue** refuse le code non formaté.
  - On reformate un projet existant **en un seul commit**, sans autre changement, pour ne pas noyer l'historique.
    `git blame --ignore-rev` permet d'ignorer ce commit.

  **Désactiver localement.** Pour un tableau aligné à la main :

  ```cpp
  // clang-format off
  const int matrice[2][2] = {{1,  0},
                             {0,  1}};
  // clang-format on
  ```

  **Ce que clang-format ne fait pas.** Il ne renomme rien, ne juge pas les noms, ne trouve pas de bug : c'est le
  rôle de clang-tidy. Il peut seulement **trier les `#include`**, ce qui change parfois le comportement quand un
  en-tête dépend de l'ordre d'inclusion (un défaut de l'en-tête).

  **En entretien** : « clang-format applique le style du fichier `.clang-format` : on n'en discute plus en revue.
  Il tourne à l'enregistrement dans l'éditeur, et l'intégration continue vérifie avec `--dry-run --Werror`. Il ne
  touche qu'à la présentation ; les défauts, c'est clang-tidy. »
cards:
  - key: role
    format: course
    question: "Que fait clang-format ?"
    choices:
      - {text: "Il remet en forme le code, sans en changer le sens", correct: true}
      - {text: "Il cherche les bugs probables, sans exécuter le code", correct: false}
      - {text: "Il renomme les variables selon une convention", correct: false}
      - {text: "Il compile le code plus vite que GCC", correct: false}
    answer: "Indentation, espaces, accolades, longueur des lignes. Les défauts et les noms sont l'affaire de clang-tidy."
  - key: pourquoi
    format: course
    question: "Quel est le principal intérêt d'un formateur automatique dans une équipe ?"
    choices:
      - {text: "Le style n'est plus discuté en revue, et les différences ne montrent que les vrais changements", correct: true}
      - {text: "Le programme s'exécute plus vite, car un code bien indenté est mieux optimisé", correct: false}
      - {text: "Le compilateur signale moins d'erreurs, car il lit mieux un code formaté", correct: false}
      - {text: "Les tests deviennent inutiles, car un code formaté ne contient plus de bug", correct: false}
    answer: "La forme est fixée par un outil, donc hors du débat. Les relecteurs se concentrent sur le fond."
  - key: based-on-style
    format: course
    question: "À quoi sert la clé `BasedOnStyle` du fichier `.clang-format` ?"
    choices:
      - {text: "À partir d'un style connu, que les autres clés ajustent", correct: true}
      - {text: "À désigner le compilateur qui lira le code formaté", correct: false}
      - {text: "À choisir la norme du langage, de C++11 à C++23", correct: false}
      - {text: "À lister les fichiers que l'outil doit ignorer", correct: false}
    answer: "`LLVM`, `Google`, `Mozilla`... On hérite de dizaines de réglages cohérents, et l'on ne précise que ses écarts."
  - key: grand-reformatage
    format: course
    question: "Comment adopte-t-on clang-format sur un projet existant ?"
    choices:
      - {text: "En reformatant tout dans un commit à part, sans autre changement", correct: true}
      - {text: "En reformatant chaque fichier au fil des corrections de bugs", correct: false}
      - {text: "En reformatant seulement les fichiers de moins de cent lignes", correct: false}
      - {text: "En reformatant tout dans le même commit qu'une fonctionnalité", correct: false}
    answer: "Un commit purement mécanique se relit et s'ignore facilement (`git blame --ignore-rev`). Mêlé à du vrai code, il le rend illisible."
  - key: vf-sens
    format: true-false
    question: "clang-format peut modifier le comportement d'une fonction en la reformatant."
    truth: false
    answer: "Il ne touche qu'aux espaces et aux retours à la ligne. Seul le tri des `#include` peut avoir un effet, si un en-tête dépend de l'ordre."
  - key: vf-versionne
    format: true-false
    question: "Le fichier `.clang-format` se versionne avec le code du projet."
    truth: true
    answer: "Tout le monde, intégration continue comprise, applique ainsi exactement le même style."
  - key: vf-bugs
    format: true-false
    question: "clang-format signale les variables non initialisées."
    truth: false
    answer: "Il ne comprend pas le sens du code. Les défauts sont le rôle du compilateur et de clang-tidy."
  - key: vf-off
    format: true-false
    question: "On peut désactiver clang-format sur une portion de code, par des commentaires."
    truth: true
    answer: "`// clang-format off` et `// clang-format on` encadrent la zone à laisser telle quelle."
  - key: qcm-sur-place
    format: multiple-choice
    question: "Quelle commande reformate `main.cpp` en modifiant le fichier lui-même ?"
    choices:
      - {text: "`clang-format -i main.cpp`", correct: true}
      - {text: "`clang-format main.cpp`", correct: false}
      - {text: "`clang-format --dry-run main.cpp`", correct: false}
      - {text: "`clang-tidy --fix main.cpp`", correct: false}
    answer: "`-i` : sur place (*in place*). Sans option, le résultat est seulement écrit sur la sortie standard."
  - key: qcm-ci
    format: multiple-choice
    question: "Quelle commande vérifie, en intégration continue, qu'un fichier est bien formaté ?"
    choices:
      - {text: "`clang-format --dry-run --Werror main.cpp`", correct: true}
      - {text: "`clang-format -i main.cpp`", correct: false}
      - {text: "`clang-format -dump-config main.cpp`", correct: false}
      - {text: "`clang-format --version main.cpp`", correct: false}
    answer: "`--dry-run` ne modifie rien ; `--Werror` fait échouer la commande si le fichier diffère du format."
  - key: qcm-fichier
    format: multiple-choice
    question: "Comment s'appelle le fichier de configuration de clang-format ?"
    choices:
      - {text: "`.clang-format`", correct: true}
      - {text: "`.clang-tidy`", correct: false}
      - {text: "`.editorconfig`", correct: false}
      - {text: "`format.cmake`", correct: false}
    answer: "`.clang-format`, cherché dans le répertoire du fichier, puis dans ses parents."
  - key: qcm-colonnes
    format: multiple-choice
    question: "Quelle clé fixe la longueur maximale d'une ligne ?"
    choices:
      - {text: "`ColumnLimit`", correct: true}
      - {text: "`IndentWidth`", correct: false}
      - {text: "`TabWidth`", correct: false}
      - {text: "`MaxLineLength`", correct: false}
    answer: "`ColumnLimit: 120`. `IndentWidth` règle l'indentation."
  - key: trous-i
    format: fill-in
    question: |-
      Complète l'option qui modifie le fichier sur place :
      ```
      clang-format -___ src/main.cpp
      ```
    blanks:
      - [i]
    answer: "`-i` écrit le résultat dans le fichier."
  - key: trous-based
    format: fill-in
    question: |-
      Complète la clé qui choisit le style de départ :
      ```
      ___: Google
      IndentWidth: 4
      ```
    blanks:
      - [BasedOnStyle]
    answer: "`BasedOnStyle` désigne le style dont on hérite."
  - key: trous-off
    format: fill-in
    question: |-
      Complète le commentaire qui suspend la mise en forme :
      ```cpp
      // clang-format ___
      const int grille[2][2] = {{1,  0},
                                {0,  1}};
      // clang-format on
      ```
    blanks:
      - ["off"]
    answer: "`// clang-format off` jusqu'à `// clang-format on`."
  - key: trous-dry-run
    format: fill-in
    question: |-
      Complète l'option qui vérifie sans modifier le fichier :
      ```
      clang-format --___ --Werror src/main.cpp
      ```
    blanks:
      - [dry-run]
    answer: "`--dry-run` signale les écarts, sans rien écrire."
  - key: situation-revue
    format: scenario
    question: |-
      La moitié des commentaires de revue de code de l'équipe portent sur les espaces et les accolades, et les
      discussions s'enveniment. Que proposes-tu ?
    choices:
      - {text: "Un fichier `.clang-format` adopté une fois, appliqué par l'éditeur et vérifié en intégration continue", correct: true}
      - {text: "Un document de vingt pages sur le style, que chaque relecteur fera respecter à la main", correct: false}
      - {text: "L'interdiction de tout commentaire de revue, pour éviter les conflits", correct: false}
      - {text: "Un style propre à chaque développeur, appliqué à ses seuls fichiers", correct: false}
    answer: |-
      Le style cesse d'être un sujet : l'outil l'applique, et la construction le vérifie. Les revues reviennent à ce
      qui compte.
  - key: situation-diff
    format: scenario
    question: |-
      Une modification de trois lignes apparaît en revue comme quatre cents lignes changées : l'éditeur de l'auteur
      a reformaté tout le fichier avec un autre style. Comment l'évites-tu à l'avenir ?
    choices:
      - {text: "Tout le monde formate avec le `.clang-format` du dépôt, vérifié à chaque modification", correct: true}
      - {text: "Chacun désactive le formatage automatique de son éditeur", correct: false}
      - {text: "Les relecteurs lisent les quatre cents lignes, par prudence", correct: false}
      - {text: "Les fichiers de plus de cent lignes sont interdits", correct: false}
    answer: |-
      Avec un style unique, reformater un fichier déjà au format ne change rien : la différence ne montre que les
      trois lignes.
  - key: situation-tableau
    format: scenario
    question: |-
      clang-format détruit l'alignement d'une table de constantes, soigneusement présentée en colonnes. Que
      fais-tu ?
    choices:
      - {text: "J'encadre la table de `// clang-format off` et `// clang-format on`", correct: true}
      - {text: "Je retire clang-format du projet, puisqu'il abîme le code", correct: false}
      - {text: "Je range la table dans un fichier `.txt`, lu à l'exécution", correct: false}
      - {text: "Je mets toute la table sur une seule ligne de mille caractères", correct: false}
    answer: |-
      L'exception est locale et visible. Le reste du fichier garde le format commun.
  - key: situation-historique
    format: scenario
    question: |-
      Après le grand reformatage du projet, `git blame` attribue presque toutes les lignes au commit de formatage.
      L'équipe regrette d'avoir adopté l'outil. Que proposes-tu ?
    choices:
      - {text: "Lister ce commit dans un fichier lu par `git blame --ignore-revs-file`", correct: true}
      - {text: "Annuler le reformatage, et revenir à un style libre", correct: false}
      - {text: "Réécrire tout l'historique du dépôt, commit par commit", correct: false}
      - {text: "Ne plus jamais utiliser `git blame` sur ce projet", correct: false}
    answer: |-
      Git sait sauter des commits purement mécaniques. C'est pour cela qu'on isole le reformatage dans un commit à
      part.
