notion: configurations-build
lesson: |-
  Le même code source se construit de plusieurs façons, selon ce qu'on veut en faire : le **déboguer** ou le
  **livrer**. Ces réglages s'appellent des **configurations** (ou types de construction).

  **Les quatre configurations de CMake.**

  | Configuration | Options de GCC | Usage |
  |---|---|---|
  | `Debug` | `-g` | développer, déboguer |
  | `Release` | `-O3 -DNDEBUG` | livrer |
  | `RelWithDebInfo` | `-O2 -g -DNDEBUG` | livrer, en gardant de quoi analyser un plantage |
  | `MinSizeRel` | `-Os -DNDEBUG` | livrer le plus petit exécutable |

  ```
  cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
  cmake --build build
  ```

  Sans `CMAKE_BUILD_TYPE`, avec Make ou Ninja, **aucune** de ces options n'est passée : ni optimisation, ni
  informations de débogage.

  **Trois choses changent entre Debug et Release.**

  **1. L'optimisation.** De `-O0` à `-O3`, le compilateur met les fonctions en ligne, supprime le code inutile,
  garde les variables dans des registres, vectorise les boucles. Un programme Release est couramment **cinq à
  dix fois plus rapide** que sa version Debug ; le code qui s'appuie sur la bibliothèque standard en profite le
  plus, car ses abstractions disparaissent.

  **2. Les informations de débogage (`-g`).** Elles relient le code machine aux lignes du source. Elles grossissent
  le fichier, **sans ralentir** l'exécution : on peut les garder en Release (`RelWithDebInfo`).

  **3. `NDEBUG`.** Cette macro **désactive `assert`** : l'expression n'est même plus évaluée. Les vérifications de
  développement ne coûtent donc rien en production, mais elles n'y protègent plus.

  ```cpp
  assert(indice < taille);     // présent en Debug, absent en Release
  ```

  Conséquence : **jamais d'effet dans un `assert`**. `assert(ouvrir(fichier));` n'ouvre plus rien en Release.

  **« Ça marche en Debug, pas en Release. »** C'est presque toujours un **comportement indéfini** que
  l'optimisation révèle : variable non initialisée (souvent nulle en Debug par hasard), accès hors bornes, course
  aux données. Plus rarement, un `assert` qui contenait du code utile. Le défaut est dans le programme, pas dans
  le compilateur : on le cherche avec les sanitizers.

  **Ce qu'on mesure.** Les performances se mesurent **toujours en Release** : un temps relevé en Debug ne dit
  rien du programme livré.

  **Les autres réglages d'une configuration.**

  - Les **sanitizers** : une construction à part, pour les tests.
  - Les **assertions de la bibliothèque** : `-D_GLIBCXX_ASSERTIONS` fait vérifier les indices de `operator[]`.
  - L'optimisation à l'édition de liens (LTO, `-flto`), pour la version livrée.

  Chaque configuration a **son répertoire** de construction : `build/debug`, `build/release`. On ne les mélange
  pas.

  **En entretien** : « Debug : pas d'optimisation, informations de débogage, `assert` actifs. Release : `-O2` ou
  `-O3` et `NDEBUG`, qui retire les `assert`. Un bug qui n'apparaît qu'en Release est en général un comportement
  indéfini. Et je mesure les performances en Release, jamais en Debug. »
cards:
  - key: debug-ou-release
    format: course
    question: "Quelle est la principale différence entre les configurations Debug et Release ?"
    choices:
      - {text: "Debug n'optimise pas et garde les `assert` ; Release optimise et les désactive", correct: true}
      - {text: "Debug optimise et désactive les `assert` ; Release n'optimise pas et les garde", correct: false}
      - {text: "Debug compile en C++17 ; Release compile en C++23", correct: false}
      - {text: "Debug produit une bibliothèque ; Release produit un exécutable", correct: false}
    answer: "Avec GCC : `-g` pour Debug, `-O3 -DNDEBUG` pour Release. Le code source est le même ; seules les options changent."
  - key: ndebug
    format: course
    question: "Quel est l'effet de la macro `NDEBUG` ?"
    choices:
      - {text: "Elle désactive `assert` : son expression n'est même plus évaluée", correct: true}
      - {text: "Elle désactive l'optimisation, pour faciliter le débogage", correct: false}
      - {text: "Elle retire de l'exécutable les informations de débogage", correct: false}
      - {text: "Elle désactive les avertissements du compilateur", correct: false}
    answer: "`NDEBUG` signifie « pas de débogage ». Les configurations de livraison la définissent : les `assert` n'y coûtent rien, et n'y vérifient plus rien."
  - key: release-seulement
    format: course
    question: "Un programme fonctionne en Debug et plante en Release. Quelle est la cause la plus probable ?"
    choices:
      - {text: "Un comportement indéfini, que l'optimisation rend visible", correct: true}
      - {text: "Un défaut de l'optimiseur du compilateur", correct: false}
      - {text: "Un manque de mémoire, propre à la configuration Release", correct: false}
      - {text: "Une incompatibilité entre `-O3` et la norme C++23", correct: false}
    answer: "Variable non initialisée, accès hors bornes, course aux données : la faute existe aussi en Debug, où elle passe inaperçue. On la cherche avec les sanitizers."
  - key: mesurer
    format: course
    question: "Dans quelle configuration mesure-t-on les performances d'un programme ?"
    choices:
      - {text: "En Release : c'est le code optimisé qui sera livré", correct: true}
      - {text: "En Debug : les mesures y sont plus précises", correct: false}
      - {text: "Dans les deux : les temps sont à peu près les mêmes", correct: false}
      - {text: "Avec les sanitizers : ils comptent les instructions", correct: false}
    answer: "Un programme Debug est couramment cinq à dix fois plus lent, et pas de façon uniforme. Ses temps ne disent rien de la version livrée."
  - key: vf-g-ralentit
    format: true-false
    question: "L'option `-g` ralentit l'exécution du programme."
    truth: false
    answer: "Les informations de débogage grossissent le fichier, mais ne changent pas le code exécuté. C'est l'absence d'optimisation qui rend une construction Debug lente."
  - key: vf-assert-release
    format: true-false
    question: "En configuration Release, les `assert` sont toujours vérifiés."
    truth: false
    answer: "Release définit `NDEBUG`, qui les retire du programme."
  - key: vf-defaut
    format: true-false
    question: "Avec Make ou Ninja, CMake optimise le programme même sans `CMAKE_BUILD_TYPE`."
    truth: false
    answer: "Sans type de construction, aucune option d'optimisation ni de débogage n'est passée. Il faut choisir explicitement."
  - key: vf-relwithdebinfo
    format: true-false
    question: "La configuration `RelWithDebInfo` produit un programme optimisé, avec ses informations de débogage."
    truth: true
    answer: "Avec GCC : `-O2 -g -DNDEBUG`. Elle permet d'analyser un plantage de la version livrée."
  - key: qcm-option-release
    format: multiple-choice
    question: "Quelle option de CMake demande une construction optimisée ?"
    choices:
      - {text: "`-DCMAKE_BUILD_TYPE=Release`", correct: true}
      - {text: "`-DCMAKE_CXX_STANDARD=Release`", correct: false}
      - {text: "`-DCMAKE_BUILD_TYPE=Debug`", correct: false}
      - {text: "`--build Release`", correct: false}
    answer: "`CMAKE_BUILD_TYPE` se passe à la configuration : `cmake -S . -B build -DCMAKE_BUILD_TYPE=Release`."
  - key: qcm-taille
    format: multiple-choice
    question: "Quelle configuration de CMake vise l'exécutable le plus petit ?"
    choices:
      - {text: "`MinSizeRel`", correct: true}
      - {text: "`Release`", correct: false}
      - {text: "`Debug`", correct: false}
      - {text: "`RelWithDebInfo`", correct: false}
    answer: "`MinSizeRel` compile avec `-Os` : l'optimiseur privilégie la taille du code. Utile en embarqué."
  - key: qcm-o0
    format: multiple-choice
    question: "Quelle option de GCC désactive l'optimisation ?"
    choices:
      - {text: "`-O0`", correct: true}
      - {text: "`-O3`", correct: false}
      - {text: "`-g`", correct: false}
      - {text: "`-DNDEBUG`", correct: false}
    answer: "`-O0` est le niveau par défaut : le code machine suit le source ligne à ligne, ce qui convient au débogage."
  - key: qcm-glibcxx-assertions
    format: multiple-choice
    question: "Quelle option fait vérifier à la bibliothèque standard de GCC les indices passés à `operator[]` ?"
    choices:
      - {text: "`-D_GLIBCXX_ASSERTIONS`", correct: true}
      - {text: "`-DNDEBUG`", correct: false}
      - {text: "`-Wall`", correct: false}
      - {text: "`-O2`", correct: false}
    answer: "Elle ajoute des vérifications légères dans libstdc++ : un indice hors bornes arrête le programme, au lieu d'un comportement indéfini."
  - key: trous-build-type
    format: fill-in
    question: |-
      Complète la commande pour configurer une construction optimisée :
      ```
      cmake -S . -B build -DCMAKE_BUILD_TYPE=___
      ```
    blanks:
      - [Release]
    answer: "`Release` active l'optimisation et définit `NDEBUG`."
  - key: trous-ndebug
    format: fill-in
    question: |-
      Complète avec la macro qui désactive `assert` :
      ```
      g++ -O2 -D___ main.cpp -o programme
      ```
    blanks:
      - [NDEBUG]
    answer: "`-DNDEBUG` définit la macro `NDEBUG` : les `assert` disparaissent du programme."
  - key: trous-debug
    format: fill-in
    question: |-
      Complète la commande pour configurer une construction sans optimisation, faite pour le débogueur :
      ```
      cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=___
      ```
    blanks:
      - [Debug]
    answer: "`Debug` compile avec `-g`, sans optimisation."
  - key: trous-o
    format: fill-in
    question: |-
      Complète la commande de GCC avec le niveau d'optimisation de la configuration Release de CMake :
      ```
      g++ -std=c++23 -O___ -DNDEBUG main.cpp -o programme
      ```
    blanks:
      - ["3"]
    answer: "Release compile avec `-O3`. `RelWithDebInfo` s'en tient à `-O2`."
  - key: situation-assert-effet
    format: scenario
    question: |-
      Un programme écrit `assert(charger_configuration());`. Il fonctionne en Debug ; en Release, il démarre sans
      configuration. Pourquoi ?
    choices:
      - {text: "`NDEBUG` retire l'`assert` entier, y compris l'appel qu'il contient", correct: true}
      - {text: "L'optimiseur juge l'appel trop lent, et le remplace par une constante", correct: false}
      - {text: "`assert` renvoie toujours `false` quand le programme est optimisé", correct: false}
      - {text: "La fonction est mise en ligne, ce qui change sa valeur de retour", correct: false}
    answer: |-
      En Release, l'expression d'un `assert` n'est pas évaluée. Un `assert` ne doit contenir aucun effet : on
      appelle d'abord la fonction, on range son résultat, puis on le vérifie.
  - key: situation-lenteur
    format: scenario
    question: |-
      Un collègue juge `std::vector` « trop lent » : sa boucle met dix fois plus de temps qu'avec un tableau C. Il
      a compilé avec `g++ main.cpp`. Que lui réponds-tu ?
    choices:
      - {text: "Que sans optimisation, les abstractions ne sont pas éliminées : il faut mesurer avec `-O2`", correct: true}
      - {text: "Qu'un `std::vector` est toujours dix fois plus lent qu'un tableau C", correct: false}
      - {text: "Qu'il faut compiler avec `-g`, qui accélère les conteneurs", correct: false}
      - {text: "Qu'il faut remplacer la boucle par des appels à `v.at(i)`", correct: false}
    answer: |-
      Sans `-O`, chaque `operator[]` est un vrai appel de fonction. Avec `-O2`, il est mis en ligne, et le code
      machine est le même que pour un tableau. Une mesure faite sans optimisation ne prouve rien.
  - key: situation-plantage-client
    format: scenario
    question: |-
      La version livrée d'un logiciel plante chez des clients. Les fichiers core ne montrent que des adresses, sans
      nom de fonction ni numéro de ligne. Que changes-tu pour les prochaines livraisons ?
    choices:
      - {text: "Construire en `RelWithDebInfo`, et conserver les informations de débogage de chaque version", correct: true}
      - {text: "Livrer la configuration `Debug`, la seule qui se laisse analyser", correct: false}
      - {text: "Retirer `NDEBUG`, pour que les `assert` affichent les numéros de ligne", correct: false}
      - {text: "Ajouter `-Wall` à la construction livrée", correct: false}
    answer: |-
      Les informations de débogage ne ralentissent pas le programme. On les produit avec la version optimisée, et
      l'on peut les garder dans un fichier à part : le client reçoit un exécutable léger, et le développeur lit
      les fichiers core avec des noms et des lignes.
  - key: situation-non-initialisee
    format: scenario
    question: |-
      Une fonction lit une variable locale jamais initialisée. En Debug, elle vaut toujours 0 et les tests
      passent ; en Release, le résultat change à chaque exécution. Que conclus-tu ?
    choices:
      - {text: "Que lire cette variable est un comportement indéfini : le 0 du Debug était un hasard", correct: true}
      - {text: "Que la configuration Debug initialise toutes les variables à zéro, par garantie", correct: false}
      - {text: "Que l'optimiseur a introduit une erreur dans la fonction", correct: false}
      - {text: "Que les tests doivent être lancés seulement en Debug", correct: false}
    answer: |-
      Rien ne garantit la valeur d'une variable non initialisée. Sans optimisation, la pile contient souvent des
      zéros ; avec, la variable vit dans un registre qui contient autre chose. `-Wall` signale la faute, et l'on
      initialise la variable.
