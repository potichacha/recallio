notion: avertissements
lesson: |-
  Un **avertissement** (*warning*) signale un code **valide**, mais **suspect** : il compile, et il contient
  probablement une faute. Par défaut, GCC en affiche très peu. Il faut les demander.

  ```
  g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror main.cpp -o programme
  ```

  | Option | Effet |
  |---|---|
  | `-Wall` | les avertissements les plus utiles. Malgré son nom, **pas tous** |
  | `-Wextra` | un second lot : paramètres inutilisés, comparaisons douteuses |
  | `-Wpedantic` | tout ce qui s'écarte du standard : les extensions propres à GCC |
  | `-Werror` | transforme chaque avertissement en **erreur** : le programme ne compile plus |

  **Ce que `-Wall -Wextra` attrape.**

  ```cpp
  if (stock = 0) { ... }                 // -Wparentheses : affectation au lieu de ==
  int total;  return total;              // -Wuninitialized : variable non initialisée
  int f() { }                            // -Wreturn-type : pas de return
  if (i < v.size()) { ... }              // -Wsign-compare : signé contre non signé
  int inutile = 5;                       // -Wunused-variable
  switch (couleur) { case Rouge: ... }   // -Wswitch : une valeur de l'enum n'est pas traitée
  ```

  Presque tous désignent un **vrai bug**, ou un comportement indéfini.

  **D'autres options utiles**, absentes de `-Wall -Wextra` :

  - `-Wshadow` : une variable en masque une autre de même nom ;
  - `-Wconversion` : une conversion peut perdre de la valeur (`double` vers `int`) ;
  - `-Wold-style-cast` : un cast à la mode du C ;
  - `-Wnon-virtual-dtor` : une classe polymorphe sans destructeur virtuel.

  **Lire un avertissement.**

  ```
  main.cpp:7:15: warning: suggest parentheses around assignment used as truth value [-Wparentheses]
      7 |     if (stock = 0) {
        |         ~~~~~~^~~
  ```

  Le fichier, la ligne, la colonne, le message, et entre crochets **l'option** qui l'a produit.

  **`-Werror` : zéro avertissement.** Un projet qui en tolère cent ne verra pas le cent-unième, celui qui compte.
  Avec `-Werror`, aucun ne s'installe. On l'active en intégration continue ; on corrige la cause, on ne fait pas
  taire le message.

  **Faire taire, à bon escient.** Quand un avertissement est un faux positif, on le neutralise **localement** et
  **explicitement** : `[[maybe_unused]]` pour une variable volontairement inutilisée, un cast explicite pour une
  conversion voulue. On évite de désactiver l'option pour tout le projet (`-Wno-...`).

  **Ce que les avertissements ne voient pas.** Ils analysent le code sans l'exécuter : une fuite de mémoire, un
  indice hors bornes calculé à l'exécution, une course aux données leur échappent. C'est le rôle des sanitizers et
  des tests.

  **En entretien** : « Je compile avec `-Wall -Wextra -Wpedantic`, et `-Werror` en intégration continue : un
  avertissement est presque toujours un bug. `-Wall` n'active pas tout : j'ajoute `-Wshadow` et `-Wconversion`. »
tour:
  - title: Écouter le compilateur
    text: |-
      Ce programme compile, mais il contient une faute : dans le `if`, `=` affecte 5 à `stock`, au lieu de le
      comparer avec `==`. La condition est donc toujours vraie.

      Le compilateur sait repérer ce genre de code suspect. Il suffit de le lui demander, avec les options
      `-Wall -Wextra` : il affiche alors un **avertissement**, « suggest parentheses around assignment used as truth
      value ».

      Essaie : remplace `=` par `==` dans la condition, puis exécute. Le programme annonce enfin la rupture.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int stock = 0;
              if (stock = 5) {
                  std::println("en stock");
              } else {
                  std::println("rupture");
              }
              std::println("{}", stock);
          }
      output: |-
        en stock
        5
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un avertissement du compilateur ?"
    choices:
      - {text: "Le signalement d'un code valide, mais probablement fautif", correct: true}
      - {text: "Le signalement d'un code invalide, que le compilateur refuse", correct: false}
      - {text: "Le signalement d'une faute survenue pendant l'exécution", correct: false}
      - {text: "Le signalement d'une option de compilation inconnue", correct: false}
    answer: "Le programme compile quand même. Mais le compilateur a reconnu une construction qui cache le plus souvent un bug."
  - key: wall
    format: course
    question: "Qu'active l'option `-Wall` de GCC ?"
    choices:
      - {text: "Les avertissements les plus utiles, mais pas tous", correct: true}
      - {text: "Tous les avertissements que GCC connaît", correct: false}
      - {text: "La transformation des avertissements en erreurs", correct: false}
      - {text: "Les vérifications faites pendant l'exécution", correct: false}
    answer: "Son nom est trompeur. `-Wextra` en ajoute un second lot, et d'autres, comme `-Wshadow` ou `-Wconversion`, se demandent un par un."
  - key: werror
    format: course
    question: "Que fait l'option `-Werror` ?"
    choices:
      - {text: "Elle traite chaque avertissement comme une erreur : le programme ne compile plus", correct: true}
      - {text: "Elle masque les avertissements, pour ne garder que les erreurs", correct: false}
      - {text: "Elle corrige automatiquement le code qui provoque un avertissement", correct: false}
      - {text: "Elle affiche les erreurs en rouge dans le terminal", correct: false}
    answer: "C'est le moyen de garder un projet à zéro avertissement : aucun ne peut s'installer, ni cacher les suivants."
  - key: limites
    format: course
    question: "Que ne peuvent pas détecter les avertissements du compilateur ?"
    choices:
      - {text: "Une faute qui dépend des valeurs à l'exécution, comme un indice hors bornes venu d'une saisie", correct: true}
      - {text: "Une variable locale déclarée, mais jamais utilisée dans la fonction", correct: false}
      - {text: "Une affectation écrite à la place d'une comparaison dans un `if`", correct: false}
      - {text: "Une fonction non `void` dont le corps ne contient aucun `return`", correct: false}
    answer: "Le compilateur lit le code sans l'exécuter. Pour les fautes d'exécution, il y a les sanitizers et les tests."
  - key: vf-wall-tout
    format: true-false
    question: "`-Wall` active tous les avertissements de GCC."
    truth: false
    answer: "Seulement un ensemble jugé sûr et utile. `-Wextra`, `-Wshadow`, `-Wconversion` vont plus loin."
  - key: vf-compile
    format: true-false
    question: "Sans `-Werror`, un programme qui provoque un avertissement compile quand même."
    truth: true
    answer: "L'exécutable est produit. C'est pourquoi les avertissements ignorés s'accumulent."
  - key: vf-ignorer
    format: true-false
    question: "Un avertissement peut être ignoré sans risque, puisque le programme compile."
    truth: false
    answer: "La plupart signalent un vrai bug ou un comportement indéfini : variable non initialisée, `return` manquant, comparaison de signes."
  - key: vf-defaut
    format: true-false
    question: "Par défaut, sans option, GCC affiche la plupart de ses avertissements."
    truth: false
    answer: "Il en affiche très peu. Il faut les demander, avec `-Wall -Wextra`."
  - key: qcm-affectation
    format: multiple-choice
    question: "Quel avertissement signale `if (x = 5)` ?"
    choices:
      - {text: "`-Wparentheses`", correct: true}
      - {text: "`-Wunused-variable`", correct: false}
      - {text: "`-Wsign-compare`", correct: false}
      - {text: "`-Wreturn-type`", correct: false}
    answer: "GCC suggère des parenthèses autour d'une affectation utilisée comme condition : c'est le plus souvent un `==` mal tapé."
  - key: qcm-masquage
    format: multiple-choice
    question: "Quelle option signale une variable locale qui en masque une autre de même nom ?"
    choices:
      - {text: "`-Wshadow`", correct: true}
      - {text: "`-Wall`", correct: false}
      - {text: "`-Wextra`", correct: false}
      - {text: "`-Wpedantic`", correct: false}
    answer: "`-Wshadow` ne fait partie ni de `-Wall` ni de `-Wextra` : on l'ajoute à la main."
  - key: qcm-inutilisee
    format: multiple-choice
    question: "Comment indiques-tu qu'une variable est volontairement inutilisée, sans désactiver l'avertissement ?"
    choices:
      - {text: "Avec l'attribut `[[maybe_unused]]`", correct: true}
      - {text: "Avec l'attribut `[[nodiscard]]`", correct: false}
      - {text: "Avec le mot-clé `volatile`", correct: false}
      - {text: "Avec l'option `-Wno-unused` pour tout le projet", correct: false}
    answer: "`[[maybe_unused]]` neutralise l'avertissement pour cette seule variable, et dit pourquoi. Désactiver l'option cacherait les vrais oublis ailleurs."
  - key: qcm-pedantic
    format: multiple-choice
    question: "Que signale `-Wpedantic` ?"
    choices:
      - {text: "Le code qui s'écarte du standard, comme les extensions de GCC", correct: true}
      - {text: "Le code mal indenté, ou qui ne suit pas le style du projet", correct: false}
      - {text: "Le code qui s'exécute plus lentement qu'il ne le pourrait", correct: false}
      - {text: "Le code dont les fonctions n'ont pas de commentaires", correct: false}
    answer: "Un tableau de taille variable, par exemple, est une extension de GCC, que d'autres compilateurs refusent. `-Wpedantic` aide à écrire du code portable."
  - key: trous-wall
    format: fill-in
    question: |-
      Complète la commande pour activer les avertissements les plus utiles :
      ```
      g++ -std=c++23 -W___ -Wextra main.cpp
      ```
    blanks:
      - [all]
    answer: "`-Wall`, complété par `-Wextra`."
  - key: trous-werror
    format: fill-in
    question: |-
      Complète la commande pour qu'un avertissement empêche la compilation :
      ```
      g++ -std=c++23 -Wall -Wextra -W___ main.cpp
      ```
    blanks:
      - [error]
    answer: "`-Werror` traite les avertissements comme des erreurs."
  - key: trous-maybe-unused
    format: fill-in
    question: |-
      Complète pour dire que ce paramètre est volontairement inutilisé :
      ```cpp
      void journaliser([[___]] int niveau) {
      }
      ```
    blanks:
      - [maybe_unused]
    answer: "`[[maybe_unused]]` fait taire `-Wunused-parameter` pour ce paramètre."
  - key: trous-egal
    format: fill-in
    question: |-
      Complète la condition, pour comparer au lieu d'affecter :
      ```cpp
      if (stock ___ 0) {
          std::println("rupture");
      }
      ```
    blanks:
      - ["=="]
    answer: "`==` compare. `=` affecterait 0 à `stock`, et la condition serait toujours fausse."
  - key: situation-cent-avertissements
    format: scenario
    question: |-
      Tu arrives sur un projet dont la compilation affiche quatre cents avertissements. L'équipe dit : « on ne les
      lit plus ». Un bug dû à une variable non initialisée vient de coûter une journée. Que proposes-tu ?
    choices:
      - {text: "Les corriger par lots, puis activer `-Werror` pour qu'aucun ne revienne", correct: true}
      - {text: "Retirer `-Wall` de la commande, pour que la sortie redevienne lisible", correct: false}
      - {text: "Ajouter `-w`, qui supprime tous les avertissements d'un coup", correct: false}
      - {text: "Laisser les avertissements, et écrire davantage de commentaires", correct: false}
    answer: |-
      L'avertissement existait sans doute, noyé parmi quatre cents autres. La seule façon qu'ils servent est d'en
      avoir zéro : alors le prochain se voit. `-Werror` empêche la dérive de recommencer.
  - key: situation-faux-positif
    format: scenario
    question: |-
      `-Wconversion` signale `int pourcentage = ratio * 100;`, où `ratio` est un `double`. La troncature est
      voulue. Comment traites-tu l'avertissement ?
    choices:
      - {text: "Par un cast explicite : `static_cast<int>(ratio * 100)`", correct: true}
      - {text: "Par l'option `-Wno-conversion` pour tout le projet", correct: false}
      - {text: "Par la suppression de `-Werror` de la commande", correct: false}
      - {text: "Par un commentaire qui demande d'ignorer le message", correct: false}
    answer: |-
      Le cast dit au compilateur, et au lecteur, que la perte est voulue : l'avertissement disparaît à cet endroit
      seulement. Désactiver l'option cacherait toutes les autres conversions, y compris les involontaires.
  - key: situation-ci
    format: scenario
    question: |-
      Un développeur active `-Werror` sur son poste, mais pas le serveur d'intégration continue. Des
      avertissements reviennent dans la branche principale chaque semaine. Que changes-tu ?
    choices:
      - {text: "J'active `-Werror` dans la construction de l'intégration continue", correct: true}
      - {text: "Je demande à chacun d'activer `-Werror` sur son poste, sans vérification", correct: false}
      - {text: "Je retire `-Werror` du poste du développeur, par cohérence", correct: false}
      - {text: "Je relis à la main la sortie du compilateur avant chaque fusion", correct: false}
    answer: |-
      Une règle que rien ne vérifie finit par ne plus être suivie. Si la construction officielle échoue au moindre
      avertissement, aucun ne peut entrer dans la branche principale.
  - key: situation-nouveau-compilateur
    format: scenario
    question: |-
      Après la mise à jour de GCC, un projet compilé avec `-Werror` ne compile plus : le nouveau compilateur émet
      trois avertissements inédits. Un collègue veut retirer `-Werror`. Que proposes-tu ?
    choices:
      - {text: "Lire ces trois avertissements et corriger le code : ils signalent souvent de vrais défauts", correct: true}
      - {text: "Retirer `-Werror` définitivement : il rend le projet trop fragile", correct: false}
      - {text: "Revenir à l'ancien compilateur, et ne plus jamais le mettre à jour", correct: false}
      - {text: "Ajouter `-w` à la commande, le temps que le problème se règle", correct: false}
    answer: |-
      Chaque version de GCC apprend à repérer de nouvelles fautes. Trois avertissements se corrigent vite, et
      souvent ils révèlent un bug ancien. Si l'un est un faux positif, on le neutralise à l'endroit précis.
  - key: bug-affectation
    format: bug-fix
    question: |-
      Avec `-Wall`, GCC avertit : « suggest parentheses around assignment used as truth value ». Le programme
      affiche `admis` pour toutes les notes. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int note = 4;
          if (note = 10) {
              std::println("admis");
          }
      }
      ```
    choices:
      - {text: "Écrire `if (note >= 10)`", correct: true}
      - {text: "Écrire `if ((note = 10))`", correct: false}
      - {text: "Écrire `if (note := 10)`", correct: false}
      - {text: "Écrire `if (10 = note)`", correct: false}
    answer: |-
      ```cpp
      if (note >= 10) {
      ```
      `note = 10` affecte 10 à `note`, puis vaut 10, donc vrai. Doubler les parenthèses fait taire l'avertissement,
      sans corriger la faute.
  - key: bug-non-initialisee
    format: bug-fix
    question: |-
      Avec `-Wall`, GCC avertit : « 'total' is used uninitialized ». Le programme affiche un nombre imprévisible.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int total;
          for (int i = 1; i <= 3; ++i) {
              total += i;
          }
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Déclarer `int total = 0;`", correct: true}
      - {text: "Déclarer `static int total;` dans la boucle", correct: false}
      - {text: "Déclarer `[[maybe_unused]] int total;`", correct: false}
      - {text: "Déclarer `unsigned total;`", correct: false}
    answer: |-
      ```cpp
      int total = 0;
      ```
      Une variable locale sans initialisation contient une valeur quelconque : la lire est un comportement
      indéfini. `[[maybe_unused]]` ne concerne que les variables inutilisées.
  - key: bug-return-manquant
    format: bug-fix
    question: |-
      Avec `-Wall`, GCC avertit : « control reaches end of non-void function ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int signe(int n) {
          if (n > 0) {
              return 1;
          }
          if (n < 0) {
              return -1;
          }
      }

      int main() {
          std::println("{}", signe(0));
      }
      ```
    choices:
      - {text: "Ajouter `return 0;` à la fin de la fonction", correct: true}
      - {text: "Déclarer la fonction `void signe(int n)`", correct: false}
      - {text: "Ajouter `[[nodiscard]]` devant la fonction", correct: false}
      - {text: "Retirer le second `if` de la fonction", correct: false}
    answer: |-
      ```cpp
      if (n < 0) {
          return -1;
      }
      return 0;
      ```
      Pour `n == 0`, la fonction atteint son accolade fermante sans rien renvoyer : comportement indéfini. Chaque
      chemin d'une fonction non `void` doit finir par un `return`.
  - key: bug-signe
    format: bug-fix
    question: |-
      Avec `-Wall`, GCC avertit : « comparison of integer expressions of different signedness ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          for (int i = 0; i < v.size(); ++i) {
              std::println("{}", v[i]);
          }
      }
      ```
    choices:
      - {text: "Parcourir avec `for (int x : v)`, et afficher `x`", correct: true}
      - {text: "Compiler avec `-Wno-sign-compare`, sans toucher au code", correct: false}
      - {text: "Écrire `i <= v.size()` dans la condition", correct: false}
      - {text: "Déclarer `i` avec le type `char`", correct: false}
    answer: |-
      ```cpp
      for (int x : v) {
          std::println("{}", x);
      }
      ```
      `i` est signé, `v.size()` non signé. La boucle sur un intervalle supprime l'indice, et l'avertissement avec.
      Sinon : `std::size_t i`. Désactiver l'option cacherait les vraies comparaisons piégeuses.
