notion: valgrind
lesson: |-
  **Valgrind** exécute un programme dans une machine virtuelle qui surveille chacun de ses accès à la mémoire. Son
  outil par défaut, **Memcheck**, détecte les fuites, les lectures de mémoire non initialisée, les accès à de la
  mémoire libérée et les doubles libérations.

  **Son atout : aucune recompilation.** Valgrind travaille sur l'exécutable tel qu'il est. On l'utilise donc sur un
  binaire qu'on ne peut pas reconstruire avec un sanitizer, ou sur une bibliothèque tierce.

  ```
  g++ -g -O0 main.cpp -o programme
  valgrind --leak-check=full ./programme
  ```

  `-g` n'est pas obligatoire, mais il donne les noms de fichiers et les numéros de ligne dans le rapport.

  **Lire un rapport.**

  ```
  ==4242== Invalid read of size 4
  ==4242==    at 0x109196: main (main.cpp:7)
  ==4242==  Address 0x4a8e040 is 0 bytes inside a block of size 4 free'd
  ==4242==    at 0x484B27F: operator delete(void*)
  ==4242==    by 0x10918D: main (main.cpp:6)
  ```

  Le nombre entre `==` est le numéro du processus. Chaque erreur donne sa nature, la pile de l'accès, puis l'origine
  du bloc concerné.

  **Les catégories de fuites**, dans le résumé final :

  | Catégorie | Sens |
  |---|---|
  | `definitely lost` | plus aucun pointeur ne désigne le bloc : une vraie fuite |
  | `indirectly lost` | le bloc n'est accessible que par un bloc lui-même perdu |
  | `possibly lost` | il reste un pointeur vers l'intérieur du bloc, pas vers son début |
  | `still reachable` | un pointeur existe encore à la fin : souvent une globale jamais libérée |

  On corrige d'abord les `definitely lost`.

  **Ce qu'il coûte.** Le programme tourne **vingt à cinquante fois plus lentement**. C'est pourquoi les sanitizers,
  qui ne ralentissent que deux fois environ, l'ont remplacé dans l'usage quotidien.

  **Valgrind ou AddressSanitizer ?**

  | | Valgrind (Memcheck) | AddressSanitizer |
  |---|---|---|
  | Recompilation | non | oui |
  | Ralentissement | 20 à 50 fois | environ 2 fois |
  | Mémoire non initialisée | oui | non (c'est MemorySanitizer) |
  | Débordement sur la pile ou une globale | non | oui |

  **Les autres outils de Valgrind** : `--tool=callgrind` compte les instructions par fonction (profilage),
  `--tool=massif` suit l'occupation du tas, `--tool=helgrind` cherche les courses aux données.

  **En entretien** : « Valgrind exécute le binaire sous surveillance, sans recompiler : Memcheck trouve les fuites,
  les lectures non initialisées et les accès après libération. Il est très lent ; au quotidien je prends
  AddressSanitizer, et Valgrind quand je ne peux pas recompiler. »
cards:
  - key: role
    format: course
    question: "Que fait Memcheck, l'outil par défaut de Valgrind ?"
    choices:
      - {text: "Il surveille les accès à la mémoire du programme, et signale fuites et accès invalides", correct: true}
      - {text: "Il reformate le code source du programme, selon un fichier de style du projet", correct: false}
      - {text: "Il analyse le code source sans l'exécuter, et signale les constructions suspectes", correct: false}
      - {text: "Il mesure la part des lignes du programme que les tests ont exécutées", correct: false}
    answer: "Valgrind exécute le programme dans une machine virtuelle. Memcheck y vérifie chaque lecture, chaque écriture et chaque allocation."
  - key: sans-recompiler
    format: course
    question: "Quel avantage Valgrind a-t-il sur AddressSanitizer ?"
    choices:
      - {text: "Il travaille sur l'exécutable existant, sans recompilation", correct: true}
      - {text: "Il ralentit beaucoup moins le programme surveillé", correct: false}
      - {text: "Il détecte les débordements de tableaux sur la pile", correct: false}
      - {text: "Il corrige lui-même les fuites qu'il a trouvées", correct: false}
    answer: "Un sanitizer exige de recompiler tout le programme. Valgrind surveille n'importe quel binaire, bibliothèques tierces comprises."
  - key: cout
    format: course
    question: "Pourquoi Valgrind n'est-il pas l'outil de tous les jours ?"
    choices:
      - {text: "Il ralentit le programme de vingt à cinquante fois", correct: true}
      - {text: "Il ne fonctionne que sur les programmes sans pointeur", correct: false}
      - {text: "Il exige de réécrire le programme en langage C", correct: false}
      - {text: "Il ne détecte que les fautes déjà vues à la compilation", correct: false}
    answer: "Chaque instruction est simulée. Une suite de tests de dix secondes prend plusieurs minutes : on lui préfère les sanitizers quand on peut recompiler."
  - key: definitely-lost
    format: course
    question: "Que signifie « definitely lost » dans le résumé de Valgrind ?"
    choices:
      - {text: "Plus aucun pointeur ne désigne le bloc : c'est une fuite certaine", correct: true}
      - {text: "Un pointeur désigne encore le bloc à la fin du programme", correct: false}
      - {text: "Le bloc a été libéré deux fois de suite par le programme", correct: false}
      - {text: "Le bloc a été lu avant d'avoir reçu la moindre valeur", correct: false}
    answer: "Le programme ne pourrait plus libérer ce bloc, même s'il le voulait. `still reachable` désigne au contraire un bloc qu'un pointeur atteint encore."
  - key: vf-recompiler
    format: true-false
    question: "Valgrind exige de recompiler le programme avec une option spéciale."
    truth: false
    answer: "Il travaille sur le binaire existant. `-g` est seulement conseillé, pour obtenir les numéros de ligne."
  - key: vf-non-initialisee
    format: true-false
    question: "Memcheck signale l'usage d'une valeur lue dans de la mémoire non initialisée."
    truth: true
    answer: "« Conditional jump or move depends on uninitialised value(s) ». AddressSanitizer, lui, ne le détecte pas."
  - key: vf-pile
    format: true-false
    question: "Memcheck détecte de façon fiable un débordement dans un tableau local, sur la pile."
    truth: false
    answer: "Il surveille surtout le tas. Pour la pile et les variables globales, AddressSanitizer fait mieux."
  - key: vf-still-reachable
    format: true-false
    question: "Un bloc « still reachable » est encore désigné par un pointeur à la fin du programme."
    truth: true
    answer: "C'est souvent une variable globale jamais libérée : moins grave qu'un bloc perdu."
  - key: qcm-commande
    format: multiple-choice
    question: "Quelle commande lance `./programme` sous Valgrind, avec le détail de chaque fuite ?"
    choices:
      - {text: "`valgrind --leak-check=full ./programme`", correct: true}
      - {text: "`valgrind --fsanitize=address ./programme`", correct: false}
      - {text: "`g++ -valgrind ./programme`", correct: false}
      - {text: "`./programme --leak-check=full`", correct: false}
    answer: "`--leak-check=full` affiche, pour chaque fuite, la pile de l'allocation."
  - key: qcm-profilage
    format: multiple-choice
    question: "Quel outil de Valgrind compte les instructions exécutées par chaque fonction ?"
    choices:
      - {text: "Callgrind", correct: true}
      - {text: "Memcheck", correct: false}
      - {text: "Helgrind", correct: false}
      - {text: "Massif", correct: false}
    answer: "`valgrind --tool=callgrind` sert au profilage. Massif suit le tas, Helgrind les courses aux données."
  - key: qcm-invalid-read
    format: multiple-choice
    question: "Un rapport dit « Invalid read of size 4 [...] inside a block of size 4 free'd ». Quelle est la faute ?"
    choices:
      - {text: "Une lecture dans un bloc déjà libéré", correct: true}
      - {text: "Une lecture après la fin d'un bloc", correct: false}
      - {text: "Une fuite d'un bloc de quatre octets", correct: false}
      - {text: "Une lecture d'un bloc non initialisé", correct: false}
    answer: "« free'd » : le bloc avait été rendu. Le rapport donne ensuite la pile de la libération."
  - key: qcm-priorite
    format: multiple-choice
    question: "Quelle catégorie de fuite corrige-t-on en premier ?"
    choices:
      - {text: "`definitely lost`", correct: true}
      - {text: "`still reachable`", correct: false}
      - {text: "`possibly lost`", correct: false}
      - {text: "`suppressed`", correct: false}
    answer: "Ce sont les fuites certaines. Les blocs `indirectly lost` disparaissent souvent avec elles."
  - key: trous-leak-check
    format: fill-in
    question: |-
      Complète la commande pour obtenir le détail de chaque fuite :
      ```
      valgrind --___=full ./programme
      ```
    blanks:
      - [leak-check]
    answer: "`--leak-check=full` détaille chaque bloc perdu."
  - key: trous-g
    format: fill-in
    question: |-
      Complète avec l'option qui fait apparaître les numéros de ligne dans le rapport de Valgrind :
      ```
      g++ -___ -O0 main.cpp -o programme
      ```
    blanks:
      - [g]
    answer: "`-g` ajoute les informations de débogage à l'exécutable."
  - key: trous-tool
    format: fill-in
    question: |-
      Complète pour lancer l'outil de profilage Callgrind :
      ```
      valgrind --___=callgrind ./programme
      ```
    blanks:
      - [tool]
    answer: "`--tool` choisit l'outil ; sans lui, c'est Memcheck."
  - key: trous-valgrind
    format: fill-in
    question: |-
      Complète la commande qui exécute le programme sous surveillance :
      ```
      ___ ./programme
      ```
    blanks:
      - [valgrind]
    answer: "`valgrind ./programme` lance Memcheck sur l'exécutable."
  - key: situation-binaire-tiers
    format: scenario
    question: |-
      Ton programme plante dans une bibliothèque fournie seulement sous forme binaire. Tu soupçonnes que tu lui
      passes un tampon déjà libéré. AddressSanitizer ne voit rien dans la bibliothèque. Que fais-tu ?
    choices:
      - {text: "Je lance le programme sous Valgrind, qui surveille aussi le code non recompilé", correct: true}
      - {text: "Je recompile la bibliothèque avec `-fsanitize=address`, sans ses sources", correct: false}
      - {text: "Je compile mon programme avec `-O3`, pour que le plantage disparaisse", correct: false}
      - {text: "J'ajoute un `catch (...)` autour de chaque appel de la bibliothèque", correct: false}
    answer: |-
      Valgrind instrumente le binaire à l'exécution : il suit la mémoire à travers le code de la bibliothèque, sans
      ses sources. C'est son cas d'usage principal aujourd'hui.
  - key: situation-lenteur
    format: scenario
    question: |-
      L'équipe lance toute sa suite de tests sous Valgrind à chaque modification. Elle prend quarante minutes, et
      plus personne ne l'attend. Que proposes-tu ?
    choices:
      - {text: "Une construction avec AddressSanitizer à chaque modification, et Valgrind la nuit", correct: true}
      - {text: "La suppression de la moitié des tests, pour diviser la durée par deux", correct: false}
      - {text: "L'abandon de toute vérification de la mémoire, trop coûteuse", correct: false}
      - {text: "Le lancement de Valgrind sans `--leak-check`, pour qu'il n'exécute rien", correct: false}
    answer: |-
      ASan ne ralentit que deux fois : il tient dans une boucle de travail. Valgrind garde son intérêt pour ce
      qu'ASan ne voit pas (mémoire non initialisée, code non recompilé), dans une exécution moins fréquente.
  - key: situation-still-reachable
    format: scenario
    question: |-
      Valgrind signale 72 octets « still reachable », alloués par l'initialisation d'une bibliothèque de journaux, et
      rien d'autre. Un collègue veut bloquer la livraison. Que réponds-tu ?
    choices:
      - {text: "Que ce n'est pas une fuite qui grossit : le bloc reste atteignable, et le système le reprend à la fin", correct: true}
      - {text: "Que c'est la fuite la plus grave : un bloc atteignable ne peut plus jamais être libéré", correct: false}
      - {text: "Que Valgrind se trompe : un bloc atteignable n'a jamais été alloué par le programme", correct: false}
      - {text: "Que le bloc a été libéré deux fois, ce qui corrompt le tas du programme", correct: false}
    answer: |-
      Un singleton alloué une fois et jamais libéré apparaît ainsi. Ce qui compte, ce sont les blocs
      `definitely lost`, surtout ceux dont le nombre croît avec la durée d'exécution.
  - key: situation-non-initialisee
    format: scenario
    question: |-
      Un programme donne des résultats différents d'une exécution à l'autre. AddressSanitizer et UBSan ne signalent
      rien. Tu soupçonnes une variable jamais initialisée. Quel outil essaies-tu ?
    choices:
      - {text: "Valgrind, dont Memcheck suit l'état d'initialisation de chaque octet", correct: true}
      - {text: "ThreadSanitizer, qui signale les variables sans valeur de départ", correct: false}
      - {text: "clang-format, qui ajoute les initialisations manquantes au code", correct: false}
      - {text: "L'éditeur de liens, qui refuse les variables non initialisées", correct: false}
    answer: |-
      Memcheck signale le moment où une valeur non initialisée influence le programme. Avec Clang,
      MemorySanitizer fait de même. `-Wall` attrape déjà les cas visibles à la compilation.
