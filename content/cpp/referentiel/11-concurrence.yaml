# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: concurrence
title: Concurrence
position: 110
chapters:
  - id: threads
    title: Threads
    notions:
      - {id: concurrence-panorama, title: "Concurrence et parallélisme en C++ : le panorama", level: intermediate, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: std-thread, title: "std::thread : lancer, join, detach", level: intermediate, priority: 1, requires: [concurrence-panorama, lambdas-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: jthread, title: "std::jthread et std::stop_token : le thread qui se rejoint seul (C++20)", level: intermediate, priority: 2, requires: [std-thread], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: arguments-thread, title: "Passer des arguments à un thread : copie, std::ref, durée de vie", level: intermediate, priority: 2, requires: [std-thread, references-pendantes], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: thread-local, title: "thread_local", level: expert, priority: 3, requires: [std-thread, durees-stockage], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: synchronisation
    title: Synchronisation
    notions:
      - {id: data-race, title: "La course aux données : un comportement indéfini", level: intermediate, priority: 1, requires: [std-thread], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario, definition]}
      - {id: mutex, title: "std::mutex, std::lock_guard et std::scoped_lock", level: intermediate, priority: 1, requires: [data-race, raii], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise, scenario]}
      - {id: unique-lock, title: "std::unique_lock et le verrouillage différé", level: intermediate, priority: 2, requires: [mutex], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: interblocage, title: "L'interblocage : l'ordre des verrous, std::scoped_lock", level: intermediate, priority: 1, requires: [mutex], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: shared-mutex, title: "std::shared_mutex : plusieurs lecteurs, un écrivain", level: intermediate, priority: 3, requires: [mutex], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: condition-variable, title: "std::condition_variable : attendre une condition, les réveils parasites", level: intermediate, priority: 2, requires: [unique-lock], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: atomic, title: "std::atomic : des opérations indivisibles sans verrou", level: intermediate, priority: 1, requires: [data-race], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: ordre-memoire, title: "Les ordres mémoire : seq_cst, acquire, release, relaxed", level: expert, priority: 3, requires: [atomic], formats: [course, true-false, multiple-choice, scenario, definition, bug-fix]}
      - {id: call-once, title: "std::call_once et l'initialisation sûre des statiques locales", level: intermediate, priority: 3, requires: [mutex], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: semaphores-latch, title: "Sémaphores, std::latch et std::barrier (C++20)", level: expert, priority: 3, requires: [condition-variable], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: faux-partage, title: "Le faux partage de ligne de cache", level: expert, priority: 3, requires: [atomic], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: lock-free, title: "Structures sans verrou et problème ABA", level: expert, priority: 4, requires: [ordre-memoire], formats: [course, true-false, multiple-choice, scenario]}
  - id: taches
    title: Tâches et résultats
    notions:
      - {id: future-promise, title: "std::future et std::promise : récupérer un résultat", level: intermediate, priority: 2, requires: [std-thread], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: async, title: "std::async et ses politiques de lancement", level: intermediate, priority: 2, requires: [future-promise], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: packaged-task, title: "std::packaged_task", level: expert, priority: 4, requires: [future-promise], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: pool-threads, title: "Un pool de threads : pourquoi, et comment en écrire un", level: expert, priority: 3, requires: [condition-variable, std-function], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
      - {id: coroutines, title: "Les coroutines (C++20) : co_await, co_yield, co_return", level: expert, priority: 3, requires: [lambdas-bases], formats: [course, true-false, multiple-choice, scenario, definition, code-output]}
      - {id: generator, title: "std::generator (C++23)", level: expert, priority: 4, requires: [coroutines], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
