# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: pieges
title: Comportement indéfini et pièges
position: 130
chapters:
  - id: comportement-indefini
    title: Comportement indéfini
    notions:
      - {id: ub-definition, title: "Comportement indéfini, non spécifié, défini par l'implémentation", level: intermediate, priority: 1, requires: [variables-non-initialisees], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: ub-optimisations, title: "Ce que le compilateur fait d'un comportement indéfini", level: expert, priority: 2, requires: [ub-definition, debordement-entiers], formats: [course, true-false, multiple-choice, scenario]}
      - {id: acces-hors-bornes, title: "L'accès hors bornes : [] contre at()", level: intermediate, priority: 1, requires: [std-vector, ub-definition], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in, scenario]}
      - {id: dereferencement-nul, title: "Déréférencer un pointeur nul ou pendant", level: intermediate, priority: 1, requires: [pointeurs-bases, ub-definition], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: strict-aliasing, title: "L'aliasing strict et comment copier des octets proprement", level: expert, priority: 3, requires: [ub-definition, pointeurs-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: ordre-initialisation-statique, title: "Le fiasco de l'ordre d'initialisation des statiques", level: expert, priority: 3, requires: [durees-stockage, entetes-sources], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: duree-vie-temporaires, title: "La durée de vie des temporaires", level: expert, priority: 3, requires: [references-const], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
  - id: pieges-classiques
    title: Pièges classiques
    notions:
      - {id: most-vexing-parse, title: "L'analyse la plus contrariante : une déclaration de fonction à la place d'un objet", level: intermediate, priority: 3, requires: [constructeurs, initialisation-accolades], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: initializer-list-piege, title: "std::initializer_list : vector<int>{3} n'est pas vector<int>(3)", level: intermediate, priority: 2, requires: [std-vector, initialisation-accolades], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: conversions-signees, title: "Comparer un signé et un non signé ; size() - 1 sur un conteneur vide", level: intermediate, priority: 1, requires: [conversions-implicites, std-vector], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: auto-pieges, title: "Les pièges de auto : la copie involontaire, les proxys", level: intermediate, priority: 2, requires: [auto, references-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: range-for-temporaire, title: "La boucle for sur le résultat d'un appel : le temporaire qui meurt", level: expert, priority: 3, requires: [range-for, duree-vie-temporaires], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: string-view-pendante, title: "Une string_view ou un span qui survit à sa source", level: intermediate, priority: 2, requires: [string-view, references-pendantes], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: comparaison-chaines-c, title: "Comparer deux chaînes de style C avec ==", level: intermediate, priority: 3, requires: [caracteres-chaines-c, pointeurs-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
