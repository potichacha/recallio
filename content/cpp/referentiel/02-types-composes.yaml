# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: types-composes
title: Types composés
position: 20
chapters:
  - id: tableaux-chaines
    title: Tableaux et chaînes
    notions:
      - {id: std-string, title: "std::string : créer, concaténer, comparer, parcourir", level: beginner, priority: 1, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: std-vector, title: "std::vector : un tableau qui grandit", level: beginner, priority: 1, requires: [types-fondamentaux, range-for], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: std-array, title: "std::array : un tableau de taille fixe", level: beginner, priority: 1, requires: [std-vector], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: tableaux-c, title: "Les tableaux de style C et leur dégradation en pointeur", level: intermediate, priority: 2, requires: [pointeurs-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: string-view, title: "std::string_view : regarder une chaîne sans la copier", level: intermediate, priority: 1, requires: [std-string], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario], complete: true}
      - {id: std-span, title: "std::span : une vue sur une suite contiguë (C++20)", level: intermediate, priority: 2, requires: [std-vector], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: tableaux-multidimensionnels, title: "Tableaux à plusieurs dimensions et std::mdspan (C++23)", level: intermediate, priority: 4, requires: [std-array], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: structures-enumerations
    title: Structures et énumérations
    notions:
      - {id: struct, title: "struct : regrouper des données", level: beginner, priority: 1, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: initialisation-agregats, title: "Initialiser un agrégat, et les initialiseurs désignés (C++20)", level: beginner, priority: 2, requires: [struct], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: enum-class, title: "enum class : des énumérations typées et sans fuite de noms", level: beginner, priority: 1, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: enum-classique, title: "enum sans class : conversions implicites et pièges", level: intermediate, priority: 3, requires: [enum-class], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: using-alias, title: "using et typedef : donner un nom à un type", level: beginner, priority: 2, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: union, title: "union : plusieurs types au même endroit, un seul à la fois", level: intermediate, priority: 4, requires: [struct], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: liaisons-structurees, title: "Les liaisons structurées : auto [a, b] = ... (C++17)", level: beginner, priority: 2, requires: [struct, auto], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: types-vocabulaire
    title: Types de vocabulaire
    notions:
      - {id: pair-tuple, title: "std::pair et std::tuple", level: beginner, priority: 1, requires: [struct], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: optional, title: "std::optional : une valeur ou rien", level: intermediate, priority: 1, requires: [struct], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise, scenario], complete: true}
      - {id: variant, title: "std::variant et std::visit : un type parmi plusieurs", level: intermediate, priority: 2, requires: [optional], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: any, title: "std::any : n'importe quel type, vérifié à l'exécution", level: intermediate, priority: 4, requires: [variant], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: expected, title: "std::expected : une valeur ou une erreur (C++23)", level: intermediate, priority: 2, requires: [optional], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
