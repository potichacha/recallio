# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: templates
title: Templates et programmation générique
position: 60
chapters:
  - id: templates-bases
    title: Templates
    notions:
      - {id: templates-fonctions, title: "Les templates de fonction et la déduction des arguments", level: intermediate, priority: 1, requires: [surcharge-fonctions], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: templates-classes, title: "Les templates de classe ; la déduction des arguments de classe (CTAD)", level: intermediate, priority: 1, requires: [templates-fonctions, classes-membres], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: templates-instanciation, title: "L'instanciation : pourquoi un template vit dans l'en-tête", level: intermediate, priority: 2, requires: [templates-fonctions], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: parametres-non-type, title: "Paramètres de template qui ne sont pas des types", level: intermediate, priority: 3, requires: [templates-classes], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: specialisation, title: "Spécialisation totale et partielle", level: expert, priority: 3, requires: [templates-classes], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: templates-variadiques, title: "Templates variadiques, packs de paramètres et expressions de repli", level: expert, priority: 3, requires: [templates-fonctions], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: auto-parametres, title: "auto en paramètre : les templates abrégés (C++20)", level: intermediate, priority: 2, requires: [templates-fonctions, auto], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: typename-dependant, title: "typename et template devant un nom dépendant", level: expert, priority: 4, requires: [templates-classes], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: alias-templates, title: "Alias de template et variables template", level: intermediate, priority: 4, requires: [templates-classes, using-alias], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: contraintes
    title: Contraindre un template
    notions:
      - {id: concepts, title: "Les concepts et requires (C++20) : dire ce qu'un type doit savoir faire", level: intermediate, priority: 2, requires: [templates-fonctions], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: concepts-standard, title: "Les concepts de la bibliothèque : std::integral, std::ranges::range...", level: intermediate, priority: 3, requires: [concepts], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: sfinae, title: "SFINAE et std::enable_if : la contrainte d'avant les concepts", level: expert, priority: 3, requires: [templates-fonctions], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: type-traits, title: "Les type traits : interroger et transformer un type à la compilation", level: expert, priority: 3, requires: [templates-classes], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: if-constexpr, title: "if constexpr : choisir une branche à la compilation", level: intermediate, priority: 2, requires: [templates-fonctions, constexpr-fonctions], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: decltype, title: "decltype, decltype(auto) et le type de retour différé", level: expert, priority: 3, requires: [auto, templates-fonctions], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
  - id: generique-avance
    title: Programmation générique avancée
    notions:
      - {id: perfect-forwarding, title: "Références universelles et transfert parfait avec std::forward", level: expert, priority: 2, requires: [std-move, templates-fonctions], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in, scenario]}
      - {id: deduction-types, title: "Les règles de déduction des types : auto, template, références", level: expert, priority: 3, requires: [auto, templates-fonctions], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: crtp, title: "Le CRTP : le polymorphisme statique", level: expert, priority: 3, requires: [templates-classes, heritage-simple], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: type-erasure, title: "L'effacement de type : comment std::function tient n'importe quel appelable", level: expert, priority: 3, requires: [templates-classes, classes-abstraites], formats: [course, true-false, multiple-choice, scenario, code-output]}
      - {id: metaprogrammation, title: "Calculer à la compilation : constexpr, consteval, templates", level: expert, priority: 4, requires: [constexpr-fonctions, templates-classes], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: deducing-this, title: "Le paramètre objet explicite : deducing this (C++23)", level: expert, priority: 4, requires: [templates-fonctions, fonctions-membres-const], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
