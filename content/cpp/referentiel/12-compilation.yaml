# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: compilation
title: Compilation et organisation du code
position: 120
chapters:
  - id: modele-compilation
    title: Du source à l'exécutable
    notions:
      - {id: etapes-compilation, title: "Préprocesseur, compilation, édition de liens : les trois étapes", level: beginner, priority: 1, requires: [compiler-executer], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: entetes-sources, title: "En-têtes et fichiers source : partager une déclaration", level: beginner, priority: 1, requires: [declaration-definition], formats: [course, true-false, multiple-choice, fill-in, bug-fix]}
      - {id: gardes-inclusion, title: "Les gardes d'inclusion et #pragma once", level: beginner, priority: 1, requires: [entetes-sources], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: preprocesseur, title: "Le préprocesseur : #define, #ifdef, les macros et leurs pièges", level: intermediate, priority: 2, requires: [entetes-sources], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: regle-definition-unique, title: "La règle de la définition unique (ODR)", level: intermediate, priority: 2, requires: [entetes-sources], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: erreurs-liaison, title: "Lire une erreur de l'éditeur de liens : undefined reference, multiple definition", level: intermediate, priority: 1, requires: [entetes-sources], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: liaison-interne-externe, title: "Liaison interne et externe : static, extern, espace de noms anonyme", level: intermediate, priority: 3, requires: [regle-definition-unique], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: variables-inline, title: "Variables inline et constantes dans un en-tête", level: intermediate, priority: 3, requires: [regle-definition-unique], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: declarations-anticipees, title: "Les déclarations anticipées, pour compiler moins", level: intermediate, priority: 3, requires: [entetes-sources, classes-membres], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: modules, title: "Les modules (C++20) : import, export, et où ils en sont", level: expert, priority: 3, requires: [entetes-sources], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: extern-c, title: "extern \"C\" et le décorage des noms", level: expert, priority: 4, requires: [liaison-interne-externe], formats: [course, true-false, multiple-choice, scenario, definition]}
  - id: espaces-noms
    title: Espaces de noms
    notions:
      - {id: namespaces, title: "Les espaces de noms : déclarer, imbriquer, alias", level: beginner, priority: 2, requires: [espace-std], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: adl, title: "La recherche de nom dépendant des arguments (ADL)", level: expert, priority: 3, requires: [namespaces, surcharge-fonctions], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: using-directives, title: "Déclaration using, directive using, et pourquoi pas dans un en-tête", level: intermediate, priority: 2, requires: [namespaces, entetes-sources], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
  - id: bibliotheques
    title: Bibliothèques
    notions:
      - {id: bibliotheques-statiques-dynamiques, title: "Bibliothèques statiques et dynamiques", level: intermediate, priority: 2, requires: [etapes-compilation], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: abi, title: "L'ABI : ce qui casse la compatibilité binaire", level: expert, priority: 4, requires: [bibliotheques-statiques-dynamiques], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: visibilite-symboles, title: "La visibilité des symboles d'une bibliothèque partagée", level: expert, priority: 4, requires: [bibliotheques-statiques-dynamiques], formats: [course, true-false, multiple-choice, scenario, definition]}
