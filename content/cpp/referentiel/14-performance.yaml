# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: performance
title: Performance
position: 140
chapters:
  - id: couts
    title: Ce que coûte le code
    notions:
      - {id: zero-cout, title: "Le principe du zéro coût : on ne paie que ce qu'on utilise", level: intermediate, priority: 2, requires: [cpp-presentation], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: copies-inutiles, title: "Traquer les copies inutiles : paramètres, boucles, retours", level: intermediate, priority: 1, requires: [parametres-reference, constructeur-copie], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: localite-cache, title: "La localité mémoire et le cache : pourquoi std::vector gagne", level: intermediate, priority: 2, requires: [conteneurs-panorama, pile-tas], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: alignement-remplissage, title: "Alignement, remplissage et taille d'une struct", level: intermediate, priority: 2, requires: [struct, sizeof], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: allocations, title: "Le coût d'une allocation, reserve, et les allocateurs (std::pmr)", level: expert, priority: 3, requires: [vector-capacite, new-delete], formats: [course, true-false, multiple-choice, scenario, code-output]}
      - {id: inlining-optimisations, title: "L'inlining et les niveaux d'optimisation : -O0, -O2, -O3", level: intermediate, priority: 2, requires: [compiler-executer], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: virtual-cout, title: "Le coût d'un appel virtuel et la dévirtualisation", level: expert, priority: 3, requires: [vtable], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: prediction-branches, title: "La prédiction de branchement, [[likely]] et [[unlikely]]", level: expert, priority: 4, requires: [if-else], formats: [course, true-false, multiple-choice, scenario, definition]}
  - id: mesurer
    title: Mesurer
    notions:
      - {id: mesurer-avant, title: "Mesurer avant d'optimiser : chronométrer, profiler", level: intermediate, priority: 2, requires: [chrono], formats: [course, true-false, multiple-choice, scenario]}
      - {id: profilage, title: "Profiler avec perf et lire un graphe en flammes", level: expert, priority: 3, requires: [mesurer-avant], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: benchmarks, title: "Écrire un micro-benchmark honnête", level: expert, priority: 3, requires: [mesurer-avant], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: lire-assembleur, title: "Lire l'assembleur produit, avec Compiler Explorer", level: expert, priority: 4, requires: [inlining-optimisations], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: lto-pgo, title: "L'optimisation à l'édition de liens et guidée par profil", level: expert, priority: 4, requires: [inlining-optimisations], formats: [course, true-false, multiple-choice, scenario, definition]}
