# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: heritage
title: Héritage et polymorphisme
position: 50
chapters:
  - id: heritage-bases
    title: Héritage
    notions:
      - {id: heritage-simple, title: "Dériver une classe : héritage public, protected, appel du constructeur de base", level: intermediate, priority: 1, requires: [constructeurs, public-private], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: ordre-construction, title: "L'ordre de construction et de destruction dans une hiérarchie", level: intermediate, priority: 1, requires: [heritage-simple, destructeur], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: heritage-prive-protege, title: "Héritage privé et protégé ; héritage ou composition", level: intermediate, priority: 3, requires: [heritage-simple], formats: [course, true-false, multiple-choice, scenario, code-output]}
      - {id: masquage-noms, title: "Le masquage des noms de la classe de base, et using", level: intermediate, priority: 3, requires: [heritage-simple, surcharge-fonctions], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: slicing, title: "Le découpage d'objet (slicing) : copier un dérivé dans une base", level: intermediate, priority: 1, requires: [heritage-simple, constructeur-copie], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
  - id: polymorphisme
    title: Polymorphisme dynamique
    notions:
      - {id: fonctions-virtuelles, title: "Fonctions virtuelles et liaison dynamique", level: intermediate, priority: 1, requires: [heritage-simple, pointeurs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: override-final, title: "override et final", level: intermediate, priority: 1, requires: [fonctions-virtuelles], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: destructeur-virtuel, title: "Le destructeur virtuel d'une classe de base", level: intermediate, priority: 1, requires: [fonctions-virtuelles, destructeur], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: classes-abstraites, title: "Fonctions virtuelles pures et classes abstraites : l'interface en C++", level: intermediate, priority: 1, requires: [fonctions-virtuelles], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: vtable, title: "La table des fonctions virtuelles : ce que coûte un appel virtuel", level: intermediate, priority: 2, requires: [fonctions-virtuelles], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: virtuel-constructeur, title: "Appeler une fonction virtuelle dans un constructeur ou un destructeur", level: expert, priority: 3, requires: [fonctions-virtuelles, ordre-construction], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: dynamic-cast, title: "dynamic_cast et l'information de type à l'exécution (RTTI)", level: intermediate, priority: 2, requires: [fonctions-virtuelles], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: casts-cpp, title: "Les quatre casts : static_cast, dynamic_cast, const_cast, reinterpret_cast", level: intermediate, priority: 1, requires: [static-cast, fonctions-virtuelles], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in, scenario]}
      - {id: heritage-multiple, title: "Héritage multiple, problème du diamant et héritage virtuel", level: expert, priority: 3, requires: [heritage-simple, fonctions-virtuelles], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: covariance-retour, title: "Types de retour covariants et clone()", level: expert, priority: 4, requires: [fonctions-virtuelles], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
