# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: chaines-es
title: Chaînes, flux et bibliothèque utilitaire
position: 100
chapters:
  - id: chaines
    title: Chaînes de caractères
    notions:
      - {id: string-operations, title: "std::string : find, substr, replace, starts_with", level: beginner, priority: 2, requires: [std-string], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: string-conversions, title: "Convertir : std::to_string, std::stoi, std::from_chars", level: intermediate, priority: 2, requires: [std-string], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: string-sso, title: "std::string en mémoire : petite chaîne optimisée, capacité", level: expert, priority: 3, requires: [std-string, vector-capacite], formats: [course, true-false, multiple-choice, scenario, definition, code-output]}
      - {id: std-format, title: "std::format : formater sans printf ni <<", level: intermediate, priority: 1, requires: [std-print], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: formatter-personnalise, title: "Rendre un type formatable : std::formatter", level: expert, priority: 4, requires: [std-format, specialisation], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: unicode-encodages, title: "char8_t, UTF-8 et ce que std::string ne sait pas d'Unicode", level: expert, priority: 4, requires: [std-string], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: regex, title: "std::regex", level: intermediate, priority: 4, requires: [std-string], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: flux
    title: Flux et fichiers
    notions:
      - {id: cin-entrees, title: "Lire l'entrée : std::cin, std::getline et l'état du flux", level: beginner, priority: 2, requires: [std-string], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: fichiers, title: "Lire et écrire un fichier : std::ifstream, std::ofstream", level: intermediate, priority: 2, requires: [cin-entrees], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: stringstream, title: "std::stringstream : un flux dans une chaîne", level: intermediate, priority: 3, requires: [cin-entrees], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: manipulateurs, title: "Les manipulateurs de flux : setw, setprecision, fixed", level: intermediate, priority: 4, requires: [cin-entrees], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: filesystem, title: "std::filesystem : chemins, parcours, existence", level: intermediate, priority: 2, requires: [fichiers], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: fichiers-binaires, title: "Fichiers binaires, read et write", level: expert, priority: 4, requires: [fichiers], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: utilitaires
    title: Temps, hasard, nombres
    notions:
      - {id: chrono, title: "std::chrono : durées, instants, horloges", level: intermediate, priority: 2, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: chrono-calendrier, title: "Calendrier et fuseaux horaires (C++20)", level: expert, priority: 4, requires: [chrono], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: random, title: "<random> : moteurs et distributions, plutôt que rand()", level: intermediate, priority: 2, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: numeric-limits, title: "std::numeric_limits et les fonctions de <cmath>", level: intermediate, priority: 3, requires: [entiers-tailles], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: bit-operations, title: "<bit> : popcount, bit_cast, endian (C++20)", level: expert, priority: 4, requires: [operateurs-bits], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
