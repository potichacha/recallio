# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: bases
title: Bases du langage
position: 10
chapters:
  - id: premiers-pas
    title: Premiers pas
    notions:
      - {id: cpp-presentation, title: "Ce qu'est C++ : compilé, multi-paradigme, zéro coût d'abstraction, normes de C++98 à C++23", level: beginner, priority: 1, formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: hello-world, title: "Le premier programme : #include, main, std::cout, la valeur de retour", level: beginner, priority: 1, requires: [cpp-presentation], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: compiler-executer, title: "Compiler et exécuter : g++, -std=c++23, -Wall -Wextra, l'exécutable", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: std-print, title: "Afficher avec std::print et std::println (C++23), face à std::cout", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: commentaires-style, title: "Commentaires, point-virgule, accolades et conventions de nommage", level: beginner, priority: 2, requires: [hello-world], formats: [course, true-false, multiple-choice, bug-fix]}
      - {id: espace-std, title: "L'espace de noms std, using et pourquoi éviter using namespace std", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: variables-types
    title: Variables et types fondamentaux
    notions:
      - {id: declaration-variables, title: "Déclarer et initialiser une variable : =, parenthèses, accolades", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: types-fondamentaux, title: "Les types fondamentaux : int, double, char, bool, et leurs tailles", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, definition]}
      - {id: initialisation-accolades, title: "L'initialisation uniforme par accolades et le refus des conversions qui perdent", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: variables-non-initialisees, title: "Une variable locale non initialisée : une valeur indéterminée", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: auto, title: "auto : laisser le compilateur déduire le type", level: beginner, priority: 1, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: const-variables, title: "const : une variable qu'on ne modifie plus", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: constexpr-variables, title: "constexpr : une valeur connue à la compilation", level: beginner, priority: 2, requires: [const-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: entiers-tailles, title: "Entiers signés et non signés, std::int32_t, std::size_t", level: beginner, priority: 1, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, definition]}
      - {id: conversions-implicites, title: "Conversions implicites, promotions et le piège signé/non signé", level: beginner, priority: 1, requires: [entiers-tailles], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: static-cast, title: "Convertir explicitement avec static_cast", level: beginner, priority: 1, requires: [conversions-implicites], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: flottants-precision, title: "Les flottants : précision, comparaison, NaN et infini", level: intermediate, priority: 2, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: caracteres-chaines-c, title: "char, littéraux de caractères et chaînes de style C", level: beginner, priority: 2, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: portee-duree-vie, title: "Portée d'un nom et durée de vie d'une variable locale", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: litteraux, title: "Littéraux : suffixes, séparateur de chiffres, binaire et hexadécimal", level: beginner, priority: 3, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: operateurs
    title: Opérateurs et expressions
    notions:
      - {id: operateurs-arithmetiques, title: "Opérateurs arithmétiques, division entière et modulo", level: beginner, priority: 1, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: increment-affectation, title: "Incrémentation, décrémentation et affectations composées", level: beginner, priority: 1, requires: [operateurs-arithmetiques], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: comparaison-logique, title: "Comparaisons, opérateurs logiques et évaluation en court-circuit", level: beginner, priority: 1, requires: [operateurs-arithmetiques], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: operateurs-bits, title: "Opérateurs bit à bit et décalages", level: intermediate, priority: 2, requires: [entiers-tailles], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: priorite-evaluation, title: "Priorité des opérateurs et ordre d'évaluation des opérandes", level: intermediate, priority: 2, requires: [increment-affectation], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: operateur-ternaire, title: "L'opérateur conditionnel ? :", level: beginner, priority: 2, requires: [comparaison-logique], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: debordement-entiers, title: "Débordement : défini pour les non signés, indéfini pour les signés", level: intermediate, priority: 1, requires: [entiers-tailles], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: sizeof, title: "sizeof et la taille des types", level: beginner, priority: 2, requires: [types-fondamentaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: controle-flux
    title: Contrôle de flux
    notions:
      - {id: if-else, title: "if, else et l'initialisation dans la condition (C++17)", level: beginner, priority: 1, requires: [comparaison-logique], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: switch, title: "switch, break, le passage au cas suivant et [[fallthrough]]", level: beginner, priority: 1, requires: [if-else], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: boucle-while, title: "while et do-while", level: beginner, priority: 1, requires: [if-else], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: boucle-for, title: "La boucle for classique", level: beginner, priority: 1, requires: [boucle-while], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: range-for, title: "La boucle for sur un intervalle (range-based for)", level: beginner, priority: 1, requires: [boucle-for], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: break-continue, title: "break, continue et les boucles imbriquées", level: beginner, priority: 1, requires: [boucle-for], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: goto-labels, title: "goto et les labels : pourquoi on s'en passe", level: intermediate, priority: 4, requires: [boucle-for], formats: [course, true-false, multiple-choice, scenario]}
  - id: fonctions
    title: Fonctions
    notions:
      - {id: fonctions-bases, title: "Déclarer, définir et appeler une fonction ; le passage par valeur", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: declaration-definition, title: "Déclaration et définition : le prototype avant l'appel", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: parametres-reference, title: "Passer par référence et par référence const", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: valeurs-retour, title: "Renvoyer une valeur ; void ; plusieurs valeurs par une struct", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: arguments-defaut, title: "Arguments par défaut", level: beginner, priority: 2, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: surcharge-fonctions, title: "La surcharge de fonctions et la résolution de surcharge", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: recursion, title: "La récursivité et la pile d'appels", level: beginner, priority: 2, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: fonctions-inline, title: "inline : ce que le mot-clé veut dire aujourd'hui", level: intermediate, priority: 3, requires: [declaration-definition], formats: [course, true-false, multiple-choice, scenario]}
      - {id: constexpr-fonctions, title: "Fonctions constexpr : calculer à la compilation", level: intermediate, priority: 2, requires: [constexpr-variables, fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: nodiscard-attributs, title: "Les attributs : [[nodiscard]], [[maybe_unused]], [[deprecated]]", level: intermediate, priority: 3, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: main-arguments, title: "Les arguments de main : argc et argv", level: beginner, priority: 3, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
