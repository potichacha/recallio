# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: classes
title: Classes et objets
position: 40
chapters:
  - id: classes-bases
    title: Définir une classe
    notions:
      - {id: classes-membres, title: "Une classe : données membres, fonctions membres, objets", level: beginner, priority: 1, requires: [struct, fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: public-private, title: "public, private et l'encapsulation ; struct ou class", level: beginner, priority: 1, requires: [classes-membres], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: constructeurs, title: "Les constructeurs et le constructeur par défaut", level: beginner, priority: 1, requires: [classes-membres], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: liste-initialisation, title: "La liste d'initialisation des membres, et son ordre", level: beginner, priority: 1, requires: [constructeurs], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: destructeur, title: "Le destructeur : quand il est appelé, dans quel ordre", level: beginner, priority: 1, requires: [constructeurs, portee-duree-vie], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: this, title: "Le pointeur this", level: beginner, priority: 2, requires: [classes-membres, pointeurs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: fonctions-membres-const, title: "Les fonctions membres const, et mutable", level: beginner, priority: 1, requires: [classes-membres, const-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: membres-statiques, title: "Membres statiques : données et fonctions de la classe", level: intermediate, priority: 2, requires: [classes-membres], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: initialisation-membres-defaut, title: "Valeur par défaut d'un membre et constructeurs délégués", level: intermediate, priority: 2, requires: [liste-initialisation], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: explicit, title: "explicit : interdire les conversions implicites par constructeur", level: intermediate, priority: 1, requires: [constructeurs], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: friend, title: "friend : ouvrir ses membres privés à une fonction ou une classe", level: intermediate, priority: 3, requires: [public-private], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: classes-imbriquees, title: "Classes imbriquées et classes locales", level: intermediate, priority: 4, requires: [classes-membres], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: copie-deplacement
    title: Copie et déplacement
    notions:
      - {id: constructeur-copie, title: "Le constructeur de copie et l'affectation par copie", level: intermediate, priority: 1, requires: [constructeurs, references-const], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: copie-superficielle, title: "Copie superficielle et copie profonde", level: intermediate, priority: 1, requires: [constructeur-copie, new-delete], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: regle-trois-cinq-zero, title: "La règle de trois, de cinq, et la règle de zéro", level: intermediate, priority: 1, requires: [constructeur-copie, destructeur], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: default-delete, title: "= default et = delete", level: intermediate, priority: 1, requires: [constructeur-copie], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: rvalue-references, title: "Les références rvalue : T&&", level: intermediate, priority: 1, requires: [references-const], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: constructeur-deplacement, title: "Le constructeur et l'affectation par déplacement", level: intermediate, priority: 1, requires: [rvalue-references, constructeur-copie], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: std-move, title: "std::move : un cast, pas un déplacement", level: intermediate, priority: 1, requires: [constructeur-deplacement], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: etat-apres-deplacement, title: "L'état d'un objet après qu'on l'a déplacé", level: intermediate, priority: 2, requires: [std-move], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: elision-copie, title: "L'élision de copie et l'optimisation de la valeur de retour (RVO)", level: intermediate, priority: 2, requires: [constructeur-copie], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: categories-valeurs, title: "Les catégories de valeurs : lvalue, prvalue, xvalue", level: expert, priority: 3, requires: [rvalue-references], formats: [course, true-false, multiple-choice, scenario, definition, code-output]}
      - {id: copy-and-swap, title: "L'idiome copy-and-swap", level: expert, priority: 3, requires: [constructeur-deplacement], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: surcharge-operateurs
    title: Surcharge d'opérateurs
    notions:
      - {id: operateurs-surcharges, title: "Surcharger un opérateur : membre ou fonction libre", level: intermediate, priority: 2, requires: [classes-membres, surcharge-fonctions], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: operateur-flux, title: "operator<< pour afficher un objet", level: intermediate, priority: 2, requires: [operateurs-surcharges], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: operateur-comparaison, title: "operator== et l'opérateur <=> (C++20)", level: intermediate, priority: 2, requires: [operateurs-surcharges], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: operateur-indice-appel, title: "operator[] et operator() : indexer, appeler", level: intermediate, priority: 3, requires: [operateurs-surcharges], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: operateurs-conversion, title: "Opérateurs de conversion et explicit operator bool", level: intermediate, priority: 3, requires: [operateurs-surcharges, explicit], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: litteraux-utilisateur, title: "Littéraux définis par l'utilisateur", level: expert, priority: 4, requires: [operateurs-surcharges], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
