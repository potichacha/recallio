# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: memoire
title: Mémoire, pointeurs et références
position: 30
chapters:
  - id: pointeurs
    title: Pointeurs
    notions:
      - {id: pointeurs-bases, title: "Un pointeur : adresse, &, * et nullptr", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, definition]}
      - {id: pointeurs-const, title: "const et les pointeurs : pointeur vers const, pointeur const", level: intermediate, priority: 1, requires: [pointeurs-bases, const-variables], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: arithmetique-pointeurs, title: "L'arithmétique des pointeurs et le parcours d'un tableau", level: intermediate, priority: 2, requires: [pointeurs-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: pointeurs-fonctions, title: "Pointeurs de fonction", level: intermediate, priority: 3, requires: [pointeurs-bases, fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: pointeur-void, title: "void* et les conversions de pointeurs", level: expert, priority: 4, requires: [pointeurs-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: pointeurs-membres, title: "Pointeurs sur membre", level: expert, priority: 4, requires: [pointeurs-fonctions], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: references
    title: Références
    notions:
      - {id: references-bases, title: "Une référence : un autre nom pour un objet existant", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: reference-ou-pointeur, title: "Référence ou pointeur : lequel choisir", level: beginner, priority: 1, requires: [references-bases, pointeurs-bases], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: references-const, title: "La référence const, et le temporaire dont elle prolonge la vie", level: intermediate, priority: 1, requires: [references-bases, const-variables], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: references-pendantes, title: "Référence et pointeur pendants : renvoyer l'adresse d'une locale", level: intermediate, priority: 1, requires: [references-bases, portee-duree-vie], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
  - id: allocation
    title: Allocation dynamique
    notions:
      - {id: pile-tas, title: "La pile et le tas : où vivent les objets", level: beginner, priority: 1, requires: [portee-duree-vie], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: new-delete, title: "new et delete, new[] et delete[]", level: intermediate, priority: 1, requires: [pointeurs-bases, pile-tas], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: fuites-memoire, title: "Fuite de mémoire, double libération, usage après libération", level: intermediate, priority: 1, requires: [new-delete], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: raii, title: "RAII : acquérir dans le constructeur, libérer dans le destructeur", level: intermediate, priority: 1, requires: [new-delete, destructeur], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: placement-new, title: "Le placement new et la construction dans une mémoire déjà allouée", level: expert, priority: 4, requires: [new-delete], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: durees-stockage, title: "Les durées de stockage : automatique, statique, dynamique, thread", level: intermediate, priority: 2, requires: [pile-tas], formats: [course, true-false, multiple-choice, scenario, definition, code-output]}
  - id: pointeurs-intelligents
    title: Pointeurs intelligents
    notions:
      - {id: unique-ptr, title: "std::unique_ptr et std::make_unique : un seul propriétaire", level: intermediate, priority: 1, requires: [raii], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise, scenario]}
      - {id: shared-ptr, title: "std::shared_ptr et std::make_shared : la propriété partagée et son compteur", level: intermediate, priority: 1, requires: [unique-ptr], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: weak-ptr, title: "std::weak_ptr : observer sans posséder, casser un cycle", level: intermediate, priority: 2, requires: [shared-ptr], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: propriete-parametres, title: "Passer un pointeur intelligent : par valeur, par référence, ou le pointeur brut", level: intermediate, priority: 2, requires: [unique-ptr, shared-ptr], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: deleters-personnalises, title: "Suppresseur personnalisé : gérer un FILE* ou un descripteur", level: expert, priority: 3, requires: [unique-ptr], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: enable-shared-from-this, title: "std::enable_shared_from_this", level: expert, priority: 4, requires: [shared-ptr], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
