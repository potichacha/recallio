# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: pratiques
title: Bonnes pratiques et conception
position: 160
chapters:
  - id: idiomes
    title: Idiomes
    notions:
      - {id: const-correctness, title: "La justesse de const : partout où c'est vrai", level: intermediate, priority: 1, requires: [fonctions-membres-const, references-const], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: regle-zero-pratique, title: "Préférer la règle de zéro : laisser les membres gérer les ressources", level: intermediate, priority: 1, requires: [regle-trois-cinq-zero, unique-ptr], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
      - {id: passage-parametres, title: "Comment passer un paramètre : valeur, référence const, déplacement", level: intermediate, priority: 1, requires: [parametres-reference, std-move], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
      - {id: pimpl, title: "L'idiome PIMPL : cacher l'implémentation", level: expert, priority: 3, requires: [unique-ptr, declarations-anticipees], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
      - {id: interfaces-nvi, title: "L'interface non virtuelle (NVI)", level: expert, priority: 4, requires: [classes-abstraites], formats: [course, true-false, multiple-choice, scenario]}
      - {id: types-forts, title: "Des types forts plutôt que des entiers nus", level: intermediate, priority: 3, requires: [enum-class, explicit], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
      - {id: scope-guard, title: "Le garde de portée : exécuter du code à la sortie", level: expert, priority: 4, requires: [raii, lambdas-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: conception
    title: Conception
    notions:
      - {id: core-guidelines, title: "Les C++ Core Guidelines et la GSL", level: intermediate, priority: 2, requires: [cpp-presentation], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: composition-heritage, title: "Composition plutôt qu'héritage", level: intermediate, priority: 2, requires: [heritage-simple], formats: [course, true-false, multiple-choice, scenario]}
      - {id: polymorphisme-statique-dynamique, title: "Polymorphisme statique ou dynamique : templates ou virtual", level: expert, priority: 2, requires: [fonctions-virtuelles, templates-fonctions], formats: [course, true-false, multiple-choice, scenario]}
      - {id: semantique-valeur, title: "La sémantique de valeur : des objets qui se copient comme des int", level: intermediate, priority: 2, requires: [constructeur-copie], formats: [course, true-false, multiple-choice, scenario]}
      - {id: conception-api, title: "Concevoir une interface difficile à mal utiliser", level: expert, priority: 3, requires: [explicit, nodiscard-attributs], formats: [course, true-false, multiple-choice, scenario]}
      - {id: patrons-conception, title: "Les patrons de conception en C++ : fabrique, stratégie, observateur, visiteur", level: expert, priority: 3, requires: [classes-abstraites, std-function], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
      - {id: gestion-ressources, title: "Qui possède quoi : dessiner la propriété d'un programme", level: intermediate, priority: 2, requires: [unique-ptr, shared-ptr], formats: [course, true-false, multiple-choice, scenario]}
      - {id: code-herite, title: "Moderniser du code hérité : de new/delete à C++23", level: expert, priority: 3, requires: [regle-zero-pratique], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
  - id: culture
    title: Culture et entretien
    notions:
      - {id: evolution-normes, title: "De C++11 à C++23 : ce que chaque norme a apporté", level: intermediate, priority: 2, requires: [cpp-presentation], formats: [course, true-false, multiple-choice, definition]}
      - {id: cpp-et-c, title: "C++ et C : ce qui diffère, ce qu'il ne faut plus écrire", level: intermediate, priority: 2, requires: [cpp-presentation, new-delete], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: cpp-face-autres, title: "C++ face à Rust, Go et Java : où il reste le bon choix", level: intermediate, priority: 3, requires: [cpp-presentation], formats: [course, true-false, multiple-choice, scenario]}
      - {id: securite-memoire, title: "La sûreté mémoire en C++ : le débat, les profils, le durcissement", level: expert, priority: 3, requires: [fuites-memoire, sanitizers], formats: [course, true-false, multiple-choice, scenario]}
      - {id: questions-entretien-classiques, title: "Les grands classiques d'entretien : virtual, RAII, move, smart pointers", level: intermediate, priority: 1, requires: [destructeur-virtuel, raii, std-move, unique-ptr], formats: [course, true-false, multiple-choice, scenario]}
