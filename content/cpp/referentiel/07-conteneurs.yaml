# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: conteneurs
title: Conteneurs de la bibliothèque standard
position: 70
chapters:
  - id: conteneurs-sequentiels
    title: Conteneurs séquentiels
    notions:
      - {id: conteneurs-panorama, title: "Le panorama des conteneurs, et lequel choisir", level: beginner, priority: 1, requires: [std-vector], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: vector-capacite, title: "std::vector en détail : taille, capacité, reserve, réallocation", level: intermediate, priority: 1, requires: [std-vector], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: vector-insertion, title: "push_back, emplace_back, insert et erase", level: intermediate, priority: 1, requires: [std-vector], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: invalidation-iterateurs, title: "L'invalidation des itérateurs, des pointeurs et des références", level: intermediate, priority: 1, requires: [vector-capacite, iterateurs-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: deque-list, title: "std::deque, std::list et std::forward_list", level: intermediate, priority: 2, requires: [conteneurs-panorama], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: vector-bool, title: "std::vector<bool> : le conteneur qui n'en est pas un", level: expert, priority: 4, requires: [vector-capacite], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: adaptateurs-conteneurs, title: "std::stack, std::queue et std::priority_queue", level: intermediate, priority: 2, requires: [conteneurs-panorama], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: bitset, title: "std::bitset", level: intermediate, priority: 4, requires: [operateurs-bits], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: conteneurs-associatifs
    title: Conteneurs associatifs
    notions:
      - {id: map, title: "std::map : des clés triées, operator[] et ses surprises", level: intermediate, priority: 1, requires: [conteneurs-panorama, pair-tuple], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: unordered-map, title: "std::unordered_map : la table de hachage", level: intermediate, priority: 1, requires: [map], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: set, title: "std::set et std::unordered_set", level: intermediate, priority: 1, requires: [map], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: multimap-multiset, title: "std::multimap et std::multiset", level: intermediate, priority: 3, requires: [map], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: hachage-personnalise, title: "Rendre un type hachable : std::hash et l'égalité", level: intermediate, priority: 2, requires: [unordered-map, operateur-comparaison], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: comparateur-personnalise, title: "Trier autrement : un comparateur pour std::map et std::set", level: intermediate, priority: 2, requires: [map], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: map-acces, title: "find, contains, at, try_emplace et insert_or_assign", level: intermediate, priority: 2, requires: [map], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: flat-map, title: "std::flat_map et std::flat_set (C++23)", level: expert, priority: 4, requires: [map, vector-capacite], formats: [course, true-false, multiple-choice, scenario]}
      - {id: complexite-conteneurs, title: "La complexité des opérations de chaque conteneur", level: intermediate, priority: 1, requires: [map, vector-capacite], formats: [course, true-false, multiple-choice, scenario, definition]}
