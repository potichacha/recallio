# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: algorithmes
title: Itérateurs, lambdas et algorithmes
position: 80
chapters:
  - id: iterateurs
    title: Itérateurs
    notions:
      - {id: iterateurs-bases, title: "Les itérateurs : begin, end et l'intervalle semi-ouvert", level: intermediate, priority: 1, requires: [std-vector, pointeurs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: categories-iterateurs, title: "Les catégories d'itérateurs : d'entrée à contigu", level: intermediate, priority: 3, requires: [iterateurs-bases], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: iterateurs-const-inverses, title: "cbegin, rbegin : itérateurs const et inversés", level: intermediate, priority: 2, requires: [iterateurs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: iterateurs-insertion, title: "std::back_inserter et les itérateurs d'insertion", level: intermediate, priority: 3, requires: [iterateurs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: iterateur-personnalise, title: "Écrire son propre itérateur", level: expert, priority: 4, requires: [iterateurs-bases, operateurs-surcharges], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: lambdas
    title: Lambdas et objets appelables
    notions:
      - {id: lambdas-bases, title: "Les lambdas : syntaxe, paramètres, type de retour", level: intermediate, priority: 1, requires: [fonctions-bases, auto], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: lambdas-captures, title: "Les captures : par valeur, par référence, [=], [&], [this]", level: intermediate, priority: 1, requires: [lambdas-bases, references-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in, scenario]}
      - {id: lambdas-mutable-init, title: "mutable, capture avec initialisation et capture par déplacement", level: intermediate, priority: 2, requires: [lambdas-captures], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: lambdas-generiques, title: "Lambdas génériques : auto en paramètre", level: intermediate, priority: 2, requires: [lambdas-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: std-function, title: "std::function : ranger un appelable, et ce que ça coûte", level: intermediate, priority: 2, requires: [lambdas-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: foncteurs, title: "Les foncteurs : une classe avec operator()", level: intermediate, priority: 3, requires: [lambdas-bases, classes-membres], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: lambdas-recursives, title: "Lambda récursive et lambdas constexpr", level: expert, priority: 4, requires: [lambdas-generiques], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: algorithmes-standard
    title: Algorithmes
    notions:
      - {id: algorithmes-panorama, title: "<algorithm> : pourquoi préférer un algorithme à une boucle", level: intermediate, priority: 1, requires: [iterateurs-bases, lambdas-bases], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: recherche-comptage, title: "find, find_if, count, any_of, all_of", level: intermediate, priority: 1, requires: [algorithmes-panorama], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: tri, title: "sort, stable_sort, partial_sort et nth_element", level: intermediate, priority: 1, requires: [algorithmes-panorama], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: transformation, title: "transform, copy, fill, generate, for_each", level: intermediate, priority: 2, requires: [algorithmes-panorama], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: erase-remove, title: "L'idiome erase-remove, std::erase et std::erase_if (C++20)", level: intermediate, priority: 1, requires: [algorithmes-panorama, vector-insertion], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: recherche-dichotomique, title: "binary_search, lower_bound, upper_bound", level: intermediate, priority: 2, requires: [tri], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: algorithmes-numeriques, title: "accumulate, reduce, iota, inner_product", level: intermediate, priority: 2, requires: [algorithmes-panorama], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: algorithmes-ensembles, title: "unique, reverse, rotate, partition et les opérations d'ensembles", level: intermediate, priority: 3, requires: [tri], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: min-max-clamp, title: "min, max, minmax_element et clamp", level: intermediate, priority: 3, requires: [algorithmes-panorama], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: algorithmes-paralleles, title: "Les politiques d'exécution : std::execution::par", level: expert, priority: 4, requires: [algorithmes-panorama], formats: [course, true-false, multiple-choice, scenario]}
  - id: ranges
    title: Ranges et vues (C++20)
    notions:
      - {id: ranges-algorithmes, title: "std::ranges : les algorithmes qui prennent un conteneur", level: intermediate, priority: 2, requires: [algorithmes-panorama], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: vues, title: "Les vues : filter, transform, take, et l'opérateur |", level: intermediate, priority: 2, requires: [ranges-algorithmes], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: vues-paresseuses, title: "L'évaluation paresseuse des vues, et la vue pendante", level: expert, priority: 3, requires: [vues], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: ranges-to, title: "std::ranges::to : matérialiser une vue (C++23)", level: intermediate, priority: 3, requires: [vues], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: vues-cpp23, title: "zip, enumerate, chunk, slide (C++23)", level: expert, priority: 4, requires: [vues], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: projections, title: "Les projections des algorithmes de ranges", level: intermediate, priority: 3, requires: [ranges-algorithmes], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
