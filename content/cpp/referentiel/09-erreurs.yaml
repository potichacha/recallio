# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: erreurs
title: Gestion des erreurs
position: 90
chapters:
  - id: exceptions
    title: Exceptions
    notions:
      - {id: exceptions-bases, title: "throw, try, catch : lancer et attraper une exception", level: intermediate, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: hierarchie-exceptions, title: "std::exception et sa hiérarchie ; attraper par référence const", level: intermediate, priority: 1, requires: [exceptions-bases, heritage-simple], formats: [course, true-false, multiple-choice, code-output, bug-fix, fill-in]}
      - {id: deroulement-pile, title: "Le déroulement de la pile : les destructeurs font le ménage", level: intermediate, priority: 1, requires: [exceptions-bases, destructeur], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: noexcept, title: "noexcept : promettre de ne rien lancer, et ce qui arrive sinon", level: intermediate, priority: 2, requires: [exceptions-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: garanties-exceptions, title: "Les garanties face aux exceptions : de base, forte, sans échec", level: expert, priority: 2, requires: [deroulement-pile, raii], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
      - {id: exceptions-constructeurs, title: "Exceptions dans un constructeur ou un destructeur", level: expert, priority: 3, requires: [deroulement-pile], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: exceptions-personnalisees, title: "Définir sa propre exception", level: intermediate, priority: 2, requires: [hierarchie-exceptions], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: relancer-imbriquer, title: "Relancer avec throw; et std::exception_ptr", level: expert, priority: 4, requires: [exceptions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
  - id: erreurs-sans-exception
    title: Signaler une erreur autrement
    notions:
      - {id: erreurs-strategies, title: "Exception, std::optional, std::expected, code d'erreur : choisir", level: intermediate, priority: 1, requires: [exceptions-bases, optional], formats: [course, true-false, multiple-choice, scenario]}
      - {id: expected-chainage, title: "Enchaîner des std::expected : and_then, transform, or_else", level: intermediate, priority: 3, requires: [expected], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: error-code, title: "std::error_code et les erreurs du système", level: expert, priority: 4, requires: [erreurs-strategies], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: assert-static-assert, title: "assert et static_assert", level: intermediate, priority: 2, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: terminate-abort, title: "std::terminate, std::abort et std::exit", level: expert, priority: 4, requires: [noexcept], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
