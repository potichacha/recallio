# Référentiel C++ (ADR 0025, 0026, 0053) : l'inventaire de toutes les notions, à remplir de contenu.
# Le sujet vise C++23, avec GCC 14 : c'est le compilateur du bac à sable et de la CI.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: outillage
title: Outillage et tests
position: 150
chapters:
  - id: compilateur
    title: Le compilateur
    notions:
      - {id: compilateurs, title: "GCC, Clang, MSVC : les compilateurs et leur support des normes", level: intermediate, priority: 2, requires: [compiler-executer], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: avertissements, title: "Les avertissements : -Wall, -Wextra, -Wpedantic, -Werror", level: beginner, priority: 1, requires: [compiler-executer], formats: [course, true-false, multiple-choice, fill-in, scenario, bug-fix]}
      - {id: lire-erreurs-compilation, title: "Lire une erreur de compilation, même celle d'un template", level: intermediate, priority: 1, requires: [compiler-executer], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: sanitizers, title: "Les sanitizers : AddressSanitizer, UBSan, ThreadSanitizer", level: intermediate, priority: 1, requires: [ub-definition, compiler-executer], formats: [course, true-false, multiple-choice, fill-in, scenario, bug-fix]}
      - {id: debogueur, title: "Déboguer avec gdb ou lldb : points d'arrêt, pile, variables", level: intermediate, priority: 2, requires: [compiler-executer], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: valgrind, title: "Valgrind", level: intermediate, priority: 4, requires: [fuites-memoire], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: analyse-statique, title: "L'analyse statique : clang-tidy, cppcheck", level: intermediate, priority: 3, requires: [avertissements], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: clang-format, title: "clang-format : le style, sans débat", level: intermediate, priority: 3, requires: [commentaires-style], formats: [course, true-false, multiple-choice, fill-in, scenario]}
  - id: construction
    title: Construire un projet
    notions:
      - {id: cmake-bases, title: "CMake : cibles, add_executable, target_link_libraries", level: intermediate, priority: 1, requires: [entetes-sources], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: cmake-moderne, title: "CMake moderne : propriétés de cible, PUBLIC et PRIVATE", level: intermediate, priority: 3, requires: [cmake-bases], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: gestion-dependances, title: "Gérer ses dépendances : vcpkg, Conan, FetchContent", level: intermediate, priority: 3, requires: [cmake-bases], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: configurations-build, title: "Debug, Release, et ce qui change entre les deux", level: intermediate, priority: 2, requires: [cmake-bases, inlining-optimisations], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: compilation-croisee, title: "La compilation croisée et les chaînes d'outils", level: expert, priority: 4, requires: [cmake-bases], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: ci-cpp, title: "L'intégration continue d'un projet C++ : matrice de compilateurs, cache", level: intermediate, priority: 4, requires: [cmake-bases], formats: [course, true-false, multiple-choice, scenario]}
  - id: tests
    title: Tests
    notions:
      - {id: tests-unitaires, title: "Écrire un test unitaire : doctest, Catch2, GoogleTest", level: intermediate, priority: 1, requires: [fonctions-bases, compiler-executer], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise, scenario]}
      - {id: assertions-tests, title: "Les assertions d'un test : CHECK, REQUIRE, comparer des flottants", level: intermediate, priority: 2, requires: [tests-unitaires], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: tests-exceptions, title: "Tester qu'une exception est lancée", level: intermediate, priority: 3, requires: [tests-unitaires, exceptions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: doubles-de-test, title: "Doublures de test : interface, injection, GoogleMock", level: expert, priority: 3, requires: [tests-unitaires, classes-abstraites], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
      - {id: fuzzing, title: "Le fuzzing avec libFuzzer", level: expert, priority: 4, requires: [sanitizers], formats: [course, true-false, multiple-choice, fill-in, scenario]}
      - {id: couverture, title: "La couverture de code : gcov, llvm-cov", level: intermediate, priority: 4, requires: [tests-unitaires], formats: [course, true-false, multiple-choice, fill-in, scenario]}
