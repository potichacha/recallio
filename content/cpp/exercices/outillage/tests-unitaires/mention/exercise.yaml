statement: |-
  On développe ici **à partir des tests** : ils sont déjà écrits, et décrivent le comportement attendu. À toi
  d'écrire la fonction `mention`, déclarée dans `mention.hpp`, pour qu'ils passent tous.

  `mention(note)` reçoit une note sur 20, et renvoie :

  | Note | Résultat |
  |---|---|
  | de 0 à moins de 10 | `"Refusé"` |
  | de 10 à moins de 12 | `"Passable"` |
  | de 12 à moins de 14 | `"Assez bien"` |
  | de 14 à moins de 16 | `"Bien"` |
  | de 16 à 20 | `"Très bien"` |

  Une note inférieure à 0 ou supérieure à 20 fait lancer `std::invalid_argument`.

  Les tests vérifient chaque **borne** et ses voisines : 9.99, 10, 11.99, 12, et ainsi de suite, ainsi que 0, 20,
  -0.01 et 20.01. Tu écris le code de la fonction dans `mention.cpp`.
explanation: |-
  La fonction commence par refuser les notes hors de l'intervalle : c'est le cas d'erreur, que les tests vérifient
  avec `CHECK_THROWS_AS`.

  Elle enchaîne ensuite les seuils du plus haut au plus bas, avec `>=`. C'est aux **bornes** que les fautes se
  logent : écrire `> 10` au lieu de `>= 10` ne change rien pour 9 ou 11, et ne se voit qu'avec la note 10
  exactement. Voilà pourquoi les tests portent sur chaque borne, et sur la valeur juste en dessous.

  C'est la démarche du développement piloté par les tests : le comportement est fixé d'abord, sous une forme
  exécutable, et le code est fini quand tous les tests passent.
