statement: |-
  Écris trois fonctions **récursives**, déclarées dans `recursif.hpp`. Aucune ne doit contenir de boucle.

  - `puissance(base, exposant)` renvoie `base` élevée à la puissance `exposant`, qui est positif ou nul. Tout nombre
    à la puissance 0 vaut 1.
  - `somme_chiffres(n)` renvoie la somme des chiffres de `n`, positif ou nul : `somme_chiffres(1234)` vaut 10.
  - `pgcd(a, b)` renvoie le plus grand commun diviseur de deux entiers positifs ou nuls, par l'algorithme
    d'Euclide : le PGCD de `a` et `b` est celui de `b` et du reste de `a` par `b` ; quand `b` vaut 0, c'est `a`.

  Tu écris le code des fonctions dans `recursif.cpp`.
explanation: |-
  Chaque fonction a un **cas de base**, qui répond sans nouvel appel, et un **cas récursif**, qui s'en rapproche.

  - `puissance` s'arrête à l'exposant 0, et renvoie 1. Sinon, elle multiplie la base par la puissance d'exposant
    inférieur d'une unité.
  - `somme_chiffres` s'arrête quand il ne reste qu'un chiffre (`n < 10`). Sinon, `n % 10` est le dernier chiffre,
    et `n / 10` le nombre privé de ce chiffre : un problème plus petit.
  - `pgcd` s'arrête quand `b` vaut 0. Sinon, elle se rappelle avec `b` et `a % b` : le second argument diminue
    strictement à chaque appel, donc la récursion se termine.

  La profondeur reste faible : au plus l'exposant, le nombre de chiffres, ou quelques dizaines d'appels pour le
  PGCD. C'est le genre de récursion qui ne risque pas de déborder la pile.
