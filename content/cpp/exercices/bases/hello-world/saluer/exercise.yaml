statement: |-
  Écris la fonction `saluer`, qui prépare la phrase d'accueil d'un programme :

  - `saluer("Ada")` renvoie `"Bonjour, Ada !"` ;
  - sans prénom, c'est-à-dire avec une chaîne vide, elle renvoie `"Bonjour !"`.

  La fonction est déclarée dans `salutation.hpp` ; tu écris son code dans `salutation.cpp`. Une `std::string` sait dire
  si elle est vide (`prenom.empty()`), et `+` colle deux chaînes.
explanation: |-
  `prenom.empty()` dit si la chaîne ne contient aucun caractère : on traite ce cas d'abord, avec un `return` qui quitte
  la fonction. Ensuite, `+` concatène : `"Bonjour, " + prenom` donne une `std::string`, à laquelle on ajoute `" !"`.

  L'en-tête `salutation.hpp` ne contient que la **déclaration** de la fonction ; son code est dans `salutation.cpp`.
  C'est le découpage habituel d'un projet C++ : les autres fichiers incluent l'en-tête, et l'édition des liens les
  relie au code.
