statement: |-
  Un chronomètre compte en secondes. Écris les trois fonctions qui découpent cette durée pour l'afficher sous la forme
  `1 h 2 min 5 s` :

  - `heures(3725)` renvoie `1` : le nombre d'heures entières ;
  - `minutes(3725)` renvoie `2` : les minutes qui restent une fois les heures retirées, de 0 à 59 ;
  - `secondes_restantes(3725)` renvoie `5` : les secondes qui restent, de 0 à 59.

  Une heure fait 3600 secondes. Les fonctions sont déclarées dans `duree.hpp` ; tu écris leur code dans `duree.cpp`,
  avec `/` et `%`. La durée reçue n'est jamais négative.
explanation: |-
  La division entière compte les paquets complets, et le modulo donne ce qui reste :

  - `secondes / 3600` : le nombre d'heures entières ;
  - `secondes % 3600` : les secondes qui restent après les heures, et `/ 60` en tire les minutes ;
  - `secondes % 60` : ce qui reste après les minutes entières.

  Les deux opérateurs vont toujours ensemble pour découper un nombre : chiffres d'un entier, lignes et colonnes d'une
  grille, euros et centimes.
