statement: |-
  Écris `somme_des_multiples`, qui additionne tous les entiers positifs **strictement inférieurs** à `limite` qui sont
  multiples de 3 ou de 5 :

  - `somme_des_multiples(10)` renvoie `23` : 3 + 5 + 6 + 9 ;
  - un nombre multiple de 3 **et** de 5, comme 15, ne compte qu'une fois ;
  - pour une limite de 3 ou moins, il n'y a aucun multiple : la fonction renvoie `0`.

  La fonction est déclarée dans `multiples.hpp` ; tu écris son code dans `multiples.cpp`, avec une boucle `for`.
explanation: |-
  La boucle passe par chaque entier de 1 à `limite - 1` : la condition `i < limite` exclut la limite elle-même.
  Le test `i % 3 == 0 || i % 5 == 0` retient les multiples de 3 ou de 5 ; comme c'est un seul test par nombre, 15 n'est
  ajouté qu'une fois.

  Pour une limite nulle ou négative, la condition est fausse d'emblée : la boucle ne fait aucun tour, et la somme reste
  à zéro. Aucun cas particulier n'est nécessaire.
