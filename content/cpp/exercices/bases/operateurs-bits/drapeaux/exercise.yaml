statement: |-
  Écris quatre fonctions, déclarées dans `bits.hpp`, qui manipulent les bits d'un entier non signé. Le bit de rang
  0 est celui des unités ; le rang est toujours compris entre 0 et 31.

  - `activer(valeur, rang)` renvoie `valeur` avec le bit de ce rang mis à 1.
  - `desactiver(valeur, rang)` renvoie `valeur` avec le bit de ce rang mis à 0.
  - `est_actif(valeur, rang)` renvoie `true` si le bit de ce rang vaut 1.
  - `compter(valeur)` renvoie le nombre de bits à 1.

  Aucune fonction ne modifie les autres bits. Tu écris le code des fonctions dans `bits.cpp`.
explanation: |-
  Tout part du masque `1u << rang` : un entier dont le seul bit à 1 est celui du rang voulu.

  - `activer` fait un OU avec le masque : ce bit passe à 1, les autres restent.
  - `desactiver` fait un ET avec le complément du masque, `~(1u << rang)`, qui a tous ses bits à 1 sauf celui-là.
  - `est_actif` isole le bit par un ET, et compare le résultat à zéro. Les parenthèses sont nécessaires : `!=` est
    prioritaire sur `&`.
  - `compter` examine le bit des unités, puis décale la valeur d'un cran à droite, jusqu'à ce qu'elle soit nulle.
    En C++20, `std::popcount`, de l'en-tête `<bit>`, fait ce travail.

  Le `u` de `1u` compte : le masque est non signé, et le décalage de 31 positions reste défini.
