statement: |-
  Écris deux fonctions pour un calendrier :

  - `est_bissextile(annee)` renvoie `true` si l'année est bissextile : divisible par 4 mais pas par 100, ou divisible
    par 400. 2024 et 2000 le sont ; 1900 et 2023 ne le sont pas ;
  - `jours_dans_mois(mois, annee)` renvoie le nombre de jours du mois, numéroté de 1 (janvier) à 12 (décembre) :
    31, 30, ou pour février 28 ou 29 selon l'année. Pour un mois qui n'existe pas, elle renvoie `0`.

  La seconde fonction appelle la première. Elles sont déclarées dans `calendrier.hpp` ; tu écris leur code dans
  `calendrier.cpp`.
explanation: |-
  `est_bissextile` tient en une expression : `&&` passe avant `||`, mais les parenthèses rendent la règle lisible.

  `jours_dans_mois` commence par écarter les mois invalides, avec une sortie anticipée. Le `switch` regroupe ensuite
  les mois de 30 jours, traite février en appelant `est_bissextile`, et renvoie 31 pour tous les autres.

  Découper ainsi a un intérêt : chaque fonction fait une chose, porte un nom qui la décrit, et se teste seule.
