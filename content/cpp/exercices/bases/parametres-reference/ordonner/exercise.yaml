statement: |-
  Écris deux fonctions qui modifient leurs arguments :

  - `echanger(a, b)` échange les valeurs des deux variables : après `echanger(x, y)`, `x` a l'ancienne valeur de `y`,
    et `y` celle de `x` ;
  - `ordonner(a, b)` range les deux variables dans l'ordre croissant : après l'appel, `a` contient la plus petite
    valeur et `b` la plus grande. Si elles sont déjà dans l'ordre, rien ne change.

  Les deux prennent leurs paramètres **par référence**. Elles sont déclarées dans `ordre.hpp` ; tu écris leur code dans
  `ordre.cpp`. `ordonner` peut appeler `echanger`.
explanation: |-
  Avec `int&`, `a` et `b` sont d'autres noms pour les variables de l'appelant : les modifier, c'est modifier les
  siennes. Par valeur, les fonctions échangeraient des copies, et l'appelant ne verrait rien.

  `echanger` a besoin d'une troisième variable pour garder la valeur de `a` pendant qu'on l'écrase. `ordonner` n'a
  plus qu'à tester l'ordre, et à appeler `echanger` quand il le faut.

  La bibliothèque standard fournit déjà `std::swap`, dans `<utility>` : c'est elle qu'on utilise dans un vrai projet.
