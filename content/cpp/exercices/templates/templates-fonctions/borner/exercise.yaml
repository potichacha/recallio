statement: |-
  Écris trois templates de fonction dans `outils.hpp`. Ils doivent fonctionner avec tout type comparable par `<` :
  des entiers, des nombres à virgule, des chaînes.

  - `minimum(a, b)` renvoie le plus petit des deux ;
  - `maximum(a, b)` renvoie le plus grand des deux ;
  - `borner(valeur, bas, haut)` ramène la valeur dans l'intervalle : elle renvoie `bas` si la valeur est plus petite,
    `haut` si elle est plus grande, et la valeur elle-même sinon. `borner(15, 0, 10)` renvoie `10`.

  Le fichier `outils.cpp` n'a pas à être modifié : un template se définit dans l'en-tête.
explanation: |-
  Les trois fonctions sont précédées de `template <typename T>` : `T` est déduit des arguments, et le compilateur
  génère une version par type utilisé dans les tests.

  Elles n'utilisent que l'opérateur `<`. C'est tout ce qu'elles exigent du type : `int`, `double` et `std::string`
  conviennent, sans aucun lien entre eux.

  `borner` s'écrit avec deux tests, ou en combinant les deux premières : `minimum(maximum(valeur, bas), haut)`.

  Les définitions sont dans l'en-tête : le compilateur doit voir le corps d'un template là où il l'instancie. La
  bibliothèque standard fournit déjà `std::min`, `std::max` et `std::clamp`.
