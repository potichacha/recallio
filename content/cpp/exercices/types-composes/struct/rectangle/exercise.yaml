statement: |-
  La struct `Rectangle` est déjà définie dans `rectangle.hpp`, avec deux membres entiers : `largeur` et `hauteur`.
  Écris les trois fonctions qui s'en servent :

  - `aire(r)` renvoie la surface : pour un rectangle de 3 sur 4, `12` ;
  - `perimetre(r)` renvoie le tour : pour un rectangle de 3 sur 4, `14` ;
  - `agrandir(r, facteur)` renvoie un **nouveau** rectangle, dont la largeur et la hauteur sont multipliées par
    `facteur`. Le rectangle reçu n'est pas modifié.

  Tu écris leur code dans `rectangle.cpp`.
explanation: |-
  Les trois fonctions lisent les membres avec un point : `r.largeur`, `r.hauteur`. Elles reçoivent le rectangle par
  référence constante : il n'est pas copié, et le compilateur garantit qu'elles ne le modifient pas.

  `agrandir` construit son résultat avec des accolades, dans l'ordre des membres, et le renvoie par valeur. L'appelant
  reçoit un nouvel objet ; l'original reste tel qu'il était.

  Regrouper la largeur et la hauteur dans un type a un intérêt : `aire(r)` ne peut pas recevoir ses deux arguments
  dans le mauvais ordre, et la signature dit ce que la fonction attend.
