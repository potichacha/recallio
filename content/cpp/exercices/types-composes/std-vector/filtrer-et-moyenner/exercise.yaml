statement: |-
  Écris deux fonctions sur un relevé de notes :

  - `moyenne(notes)` renvoie la moyenne des notes, avec sa partie décimale : `moyenne({15, 16})` renvoie `15.5`.
    Pour un relevé vide, elle renvoie `0.0` ;
  - `garder_reussies(notes)` renvoie un nouveau vecteur, avec les seules notes qui valent au moins 10, dans le même
    ordre : `garder_reussies({12, 7, 15, 9})` renvoie `{12, 15}`.

  Aucune des deux ne modifie le vecteur reçu. Elles sont déclarées dans `notes.hpp` ; tu écris leur code dans
  `notes.cpp`.
explanation: |-
  `moyenne` traite d'abord le relevé vide : diviser par zéro n'aurait pas de sens. Elle additionne ensuite les notes,
  puis convertit la somme en `double` **avant** de diviser : entre deux entiers, la division serait entière.

  `garder_reussies` part d'un vecteur vide et y ajoute, avec `push_back`, chaque note qui passe le test. Le vecteur
  d'origine n'est pas touché : il est reçu par référence constante.

  Renvoyer un `std::vector` par valeur ne le copie pas : le compilateur construit le résultat directement chez
  l'appelant.
