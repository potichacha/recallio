statement: |-
  Écris deux fonctions sur les chaînes :

  - `compter_voyelles(texte)` renvoie le nombre de voyelles du texte, parmi `a`, `e`, `i`, `o`, `u` et `y`, en
    minuscules comme en majuscules : `compter_voyelles("Bonjour")` renvoie `3` ;
  - `inverser(texte)` renvoie le texte lu de droite à gauche : `inverser("abc")` renvoie `"cba"`.

  Les textes ne contiennent pas de lettres accentuées. Les fonctions sont déclarées dans `texte.hpp` ; tu écris leur
  code dans `texte.cpp`.
explanation: |-
  `compter_voyelles` parcourt la chaîne caractère par caractère, avec une boucle sur un intervalle. Chercher le
  caractère dans la chaîne des voyelles, avec `find`, évite une longue suite de comparaisons : `find` renvoie `npos`
  quand il ne trouve rien.

  `inverser` construit une nouvelle chaîne en parcourant le texte depuis la fin. L'indice part de `size()` et descend
  jusqu'à 1 : avec un `std::size_t`, non signé, une condition `i >= 0` serait toujours vraie.

  Les deux fonctions prennent leur paramètre par `const std::string&` : elles lisent le texte sans le copier. La
  bibliothèque standard sait aussi inverser, avec `std::reverse` ou `std::string(texte.rbegin(), texte.rend())`.
