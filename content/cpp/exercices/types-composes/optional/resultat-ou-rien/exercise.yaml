statement: |-
  Écris deux fonctions qui peuvent ne pas avoir de résultat. Elles renvoient un `std::optional<int>` :

  - `quotient(a, b)` renvoie la division entière de `a` par `b`, ou rien si `b` vaut zéro : `quotient(7, 2)` contient
    `3`, et `quotient(7, 0)` est vide ;
  - `premier_pair(valeurs)` renvoie le premier nombre pair du vecteur, ou rien s'il n'y en a aucun :
    `premier_pair({1, 3, 4, 6})` contient `4`.

  Elles sont déclarées dans `resultats.hpp` ; tu écris leur code dans `resultats.cpp`.
explanation: |-
  Les deux fonctions ont la même forme : renvoyer la valeur dès qu'elle existe, et `std::nullopt` sinon.

  `return a / b;` renvoie un `int`, que le compilateur range de lui-même dans l'optional. `return std::nullopt;` dit
  qu'il n'y a pas de résultat.

  `premier_pair` renvoie dès le premier nombre pair, au milieu de la boucle : inutile de parcourir le reste. Si la
  boucle se termine, c'est qu'aucun nombre ne convenait. Zéro est pair : la fonction le renvoie comme une valeur, que
  l'appelant distingue de « rien » grâce à l'optional. Avec un entier seul, il aurait fallu une valeur sentinelle.
