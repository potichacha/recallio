statement: |-
  Écris trois fonctions, déclarées dans `temperature.hpp`, qui lancent et attrapent des exceptions.

  - `convertir(celsius)` renvoie la température en kelvins (`celsius + 273.15`). Si elle est inférieure au zéro
    absolu (−273,15 °C), elle lance `std::invalid_argument`.
  - `moyenne(celsius)` renvoie la moyenne d'un vecteur de températures. Pour un vecteur vide, elle lance
    `std::invalid_argument`.
  - `convertir_ou(celsius, defaut)` renvoie `convertir(celsius)`, ou `defaut` si la conversion échoue. Elle ne
    laisse sortir **aucune** exception.

  Tu écris le code des fonctions dans `temperature.cpp`.
explanation: |-
  `convertir` vérifie son argument avant tout calcul, et lance avec `throw`. Le message passé au constructeur de
  `std::invalid_argument` sera lisible par `what()`.

  `moyenne` lance elle aussi pour un vecteur vide : diviser par zéro n'aurait pas de sens, et il n'existe pas de
  moyenne à renvoyer. La somme se fait avec `std::accumulate`, en partant de `0.0` pour rester en `double`.

  `convertir_ou` entoure l'appel d'un `try`, et attrape par **référence constante** : `catch (const
  std::invalid_argument&)`. Dans le `catch`, elle renvoie la valeur par défaut. C'est ainsi qu'on transforme une
  exception en résultat ordinaire, là où l'on sait quoi faire de l'erreur.
