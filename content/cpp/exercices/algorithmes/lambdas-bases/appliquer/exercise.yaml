statement: |-
  Écris trois fonctions, déclarées dans `outils.hpp`. Chacune tient en quelques lignes, autour d'une **lambda**
  passée à un algorithme.

  - `compter_pairs(valeurs)` renvoie le nombre d'entiers pairs du vecteur.
  - `trier_par_longueur(mots)` trie les mots du plus court au plus long. À longueur égale, ils sont rangés par
    ordre alphabétique.
  - `doubler(valeurs)` multiplie chaque élément par deux, en place.

  Les en-têtes `<algorithm>` et `<vector>` sont déjà inclus. Tu écris le code des fonctions dans `outils.cpp`.
explanation: |-
  `compter_pairs` passe à `std::count_if` un **prédicat** : une lambda qui renvoie `true` pour un nombre pair.
  L'algorithme renvoie un entier signé, que l'on convertit vers le type de retour.

  `trier_par_longueur` donne à `std::sort` une comparaison à deux arguments. Elle compare d'abord les longueurs ;
  si elles sont égales, elle départage par `a < b`, l'ordre alphabétique des chaînes. La comparaison reste un ordre
  strict : elle renvoie `false` pour deux mots identiques.

  `doubler` utilise `std::for_each` avec une lambda qui reçoit l'élément par **référence** (`int& x`) : sans le
  `&`, elle doublerait une copie. Une boucle `for (int& x : valeurs)` serait tout aussi juste.
