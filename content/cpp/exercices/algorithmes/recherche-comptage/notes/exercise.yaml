statement: |-
  Écris quatre fonctions, déclarées dans `notes.hpp`, qui interrogent un vecteur de notes sur 20. **Aucune boucle
  n'est nécessaire** : chacune s'écrit avec un algorithme de `<algorithm>`.

  - `position(notes, note)` renvoie l'indice de la première occurrence de `note`, ou `std::nullopt` si elle est
    absente.
  - `nombre_admis(notes)` renvoie le nombre de notes supérieures ou égales à 10.
  - `tous_valides(notes)` renvoie `true` si toutes les notes sont comprises entre 0 et 20. Un vecteur vide est
    valide.
  - `contient_echec(notes)` renvoie `true` si au moins une note est strictement inférieure à 10.

  Tu écris le code des fonctions dans `notes.cpp`.
explanation: |-
  `position` appelle `std::find`, et compare son résultat à `end()` : c'est la valeur qu'il renvoie quand il ne
  trouve rien. L'indice est la distance entre l'itérateur trouvé et le début, `it - notes.begin()`.

  `nombre_admis` passe un prédicat à `std::count_if`.

  `tous_valides` utilise `std::all_of`, qui renvoie `true` sur un intervalle vide : aucun élément ne contredit la
  condition. Il n'y a pas de cas particulier à écrire.

  `contient_echec` utilise `std::any_of`, qui s'arrête à la première note sous la moyenne. `std::count_if(...) > 0`
  donnerait la même réponse, en parcourant tout le vecteur pour rien.
