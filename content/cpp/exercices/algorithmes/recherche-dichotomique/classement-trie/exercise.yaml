statement: |-
  Écris quatre fonctions, déclarées dans `tri.hpp`, qui travaillent sur un vecteur d'entiers **trié par ordre
  croissant**. Chacune s'écrit avec `std::binary_search`, `std::lower_bound` ou `std::upper_bound`, sans boucle.

  - `contient(valeurs, x)` renvoie `true` si `x` est présent.
  - `occurrences(valeurs, x)` renvoie le nombre d'éléments égaux à `x`.
  - `inserer(valeurs, x)` insère `x` à la place qui garde le vecteur trié.
  - `nombre_inferieurs(valeurs, x)` renvoie le nombre d'éléments strictement inférieurs à `x`.

  Tu écris le code des fonctions dans `tri.cpp`.
explanation: |-
  `contient` est un appel à `std::binary_search`, qui renvoie un booléen.

  `occurrences` soustrait deux itérateurs : `std::lower_bound` désigne la première occurrence de `x`,
  `std::upper_bound` la position qui suit la dernière. Si `x` est absent, les deux sont égaux, et la différence
  vaut zéro. `std::equal_range` donne les deux bornes en un appel.

  `inserer` demande à `std::lower_bound` où `x` doit entrer, et passe cette position à `insert`.

  `nombre_inferieurs` est la distance entre le début et `std::lower_bound` : tout ce qui précède le premier élément
  supérieur ou égal à `x` lui est strictement inférieur.

  Les quatre recherches coûtent O(log n), parce que le vecteur est trié et offre un accès direct.
