statement: |-
  Écris trois fonctions, déclarées dans `pipeline.hpp`. Chacune enchaîne des vues avec l'opérateur `|`, puis
  matérialise le résultat avec `std::ranges::to<std::vector>()`.

  - `carres_des_pairs(valeurs)` renvoie le carré de chaque nombre pair, dans l'ordre du vecteur.
  - `premiers_longs(mots, longueur, n)` renvoie les `n` premiers mots dont la taille est au moins `longueur`. S'il y
    en a moins de `n`, elle les renvoie tous.
  - `multiples(k, n)` renvoie les `n` premiers multiples strictement positifs de `k` : `multiples(3, 4)` donne
    3, 6, 9, 12. `k` est strictement positif.

  Tu écris le code des fonctions dans `pipeline.cpp`.
explanation: |-
  `carres_des_pairs` filtre, puis transforme : `filter` garde les pairs, `transform` les élève au carré. L'ordre
  compte : les vues s'appliquent de gauche à droite.

  `premiers_longs` filtre sur la taille, puis prend les `n` premiers avec `take`. Comme les vues sont paresseuses,
  le parcours s'arrête dès que `n` mots sont trouvés : la fin du vecteur n'est jamais examinée. `take` ne dépasse
  pas la fin : s'il y a moins de `n` mots, il les donne tous.

  `multiples` part de `std::views::iota(1)`, la suite infinie 1, 2, 3..., multiplie chaque entier par `k`, et
  limite à `n` éléments. Une suite infinie ne pose aucun problème tant qu'un `take` la borne.

  Dans les trois cas, `std::ranges::to<std::vector>()` parcourt la vue et construit le vecteur renvoyé : une vue ne
  possède rien, et ne doit pas survivre à ce qu'elle regarde.
