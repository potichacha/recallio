statement: |-
  Écris trois fonctions, déclarées dans `classement.hpp`, qui classent des joueurs. Un `Joueur` a un nom et un
  score.

  - `classer(joueurs)` trie les joueurs du **meilleur score au plus faible**. À score égal, ils sont rangés par
    ordre alphabétique du nom.
  - `podium(joueurs)` renvoie les noms des trois premiers de ce classement, dans l'ordre. S'il y a moins de trois
    joueurs, elle les renvoie tous. Elle ne modifie pas le vecteur reçu.
  - `mediane(scores)` renvoie le score médian : celui qui se trouve au milieu une fois les scores triés. Pour un
    nombre pair de scores, c'est le plus grand des deux du milieu, à l'indice `taille / 2`. Le vecteur n'est jamais
    vide.

  Tu écris le code des fonctions dans `classement.cpp`.
explanation: |-
  `classer` donne à `std::sort` une comparaison sur deux critères : le score d'abord, dans l'ordre décroissant
  (`a.score > b.score`), puis le nom. Elle renvoie `false` pour deux joueurs identiques : c'est un ordre strict,
  comme `std::sort` l'exige.

  `podium` reçoit le vecteur **par valeur** : elle travaille sur une copie, et l'appelant garde son ordre. Elle
  réutilise `classer`, puis recopie les noms des trois premiers, sans dépasser la taille. `std::partial_sort`
  ferait moins de travail sur un très grand vecteur.

  `mediane` reçoit aussi une copie. `std::nth_element` place à l'indice du milieu l'élément qui s'y trouverait
  après un tri complet, en temps linéaire en moyenne : inutile de tout trier pour un seul élément.
