statement: |-
  Écris la classe `Compte`, déclarée dans `compte.hpp`. Plusieurs threads s'en servent **en même temps** : elle doit
  protéger son solde par un mutex.

  - `deposer(montant)` ajoute le montant au solde.
  - `retirer(montant)` retire le montant et renvoie `true`, **seulement si** le solde le permet. Sinon, elle ne
    change rien et renvoie `false`. Le test et le retrait doivent se faire sous un seul verrouillage : le solde ne
    doit jamais devenir négatif.
  - `solde()` renvoie le solde.

  Le mutex `verrou_` et le solde `solde_` sont déjà déclarés. Tu écris le code des fonctions dans `compte.cpp`.
explanation: |-
  Chaque fonction commence par `std::lock_guard garde{verrou_};` : le mutex est pris à la construction de la garde,
  et relâché à sa destruction, sur tous les chemins de sortie. Dans `retirer`, le `return false` ne laisse donc pas
  le mutex verrouillé.

  `retirer` fait le test **et** le retrait sous le même verrou. Si l'appelant écrivait
  `if (compte.solde() >= 10) compte.retirer(10);` avec un `retirer` qui ne teste pas, un autre thread pourrait
  vider le compte entre les deux appels.

  `solde()` verrouille aussi, bien qu'elle ne fasse que lire : une lecture pendant une écriture est une course aux
  données. Comme elle est `const`, le mutex est déclaré `mutable`.
