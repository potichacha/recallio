statement: |-
  Écris deux fonctions, déclarées dans `adaptateurs.hpp`. Chacune s'appuie sur un adaptateur de conteneur.

  - `bien_parenthese(texte)` renvoie `true` si les parenthèses `()`, les crochets `[]` et les accolades `{}` du
    texte sont correctement appariés et imbriqués. Les autres caractères sont ignorés. Un texte sans aucun de ces
    symboles est bien parenthésé. Elle s'écrit avec une `std::stack<char>`.
  - `plus_grands(valeurs, k)` renvoie les `k` plus grandes valeurs, de la plus grande à la plus petite. S'il y a
    moins de `k` valeurs, elle les renvoie toutes. Elle s'écrit avec une `std::priority_queue<int>`.

  Tu écris le code des fonctions dans `adaptateurs.cpp`.
explanation: |-
  `bien_parenthese` empile chaque symbole ouvrant. À chaque symbole fermant, le sommet de la pile doit être
  l'ouvrant qui lui correspond : sinon, ou si la pile est vide, le texte est mal formé. On teste `empty()` avant
  `top()`, qui ne vérifie rien. À la fin, la pile doit être vide : il ne reste aucun ouvrant sans fermant. C'est la
  pile qu'il faut, parce que le dernier symbole ouvert est le premier à devoir être fermé.

  `plus_grands` pousse toutes les valeurs dans une file de priorité, dont le sommet est toujours le plus grand
  élément. Elle retire ensuite le sommet `k` fois, en s'arrêtant si la file se vide. Comme `pop()` ne renvoie rien,
  on lit `top()` avant.
