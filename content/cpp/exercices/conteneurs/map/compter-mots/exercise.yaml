statement: |-
  Écris trois fonctions, déclarées dans `mots.hpp`, qui comptent les mots d'un texte avec une `std::map`.

  - `compter(mots)` reçoit un vecteur de mots, et renvoie une map qui associe à chaque mot son **nombre
    d'occurrences**.
  - `occurrences(compte, mot)` renvoie le nombre d'occurrences du mot, ou `0` s'il est absent. Elle ne doit **rien
    ajouter** à la map : c'est pourquoi elle la reçoit par référence constante.
  - `plus_frequent(compte)` renvoie le mot le plus fréquent. En cas d'égalité, c'est le **premier dans l'ordre
    alphabétique**. Pour une map vide, elle renvoie une chaîne vide.

  Tu écris le code des fonctions dans `mots.cpp`.
explanation: |-
  `compter` tient en une ligne par mot : `++compte[mot];`. Quand le mot est absent, `operator[]` l'insère avec la
  valeur 0, que l'on incrémente aussitôt. C'est le bon usage de ce comportement.

  `occurrences` montre l'autre face : sur une map `const`, `operator[]` ne compile pas, justement parce qu'il peut
  insérer. On cherche avec `find`, et l'on renvoie `it->second` si la clé est trouvée, `0` sinon.

  `plus_frequent` parcourt la map, qui donne ses clés dans l'ordre alphabétique. En ne remplaçant le meilleur que
  lorsqu'un compte est **strictement** plus grand, le premier mot rencontré gagne les égalités : c'est le premier
  dans l'ordre alphabétique, sans aucun tri.
