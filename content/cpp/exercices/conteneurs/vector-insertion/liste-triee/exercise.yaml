statement: |-
  Écris trois fonctions, déclarées dans `liste.hpp`, qui modifient un `std::vector<int>` en place.

  - `inserer_trie(valeurs, valeur)` insère `valeur` dans un vecteur **déjà trié** par ordre croissant, à la place
    qui le garde trié. Une valeur déjà présente est insérée quand même.
  - `retirer_negatifs(valeurs)` retire tous les nombres strictement négatifs, et renvoie le nombre d'éléments
    retirés. L'ordre des autres ne change pas.
  - `retirer_dernier(valeurs)` retire le dernier élément et le renvoie, dans un `std::optional<int>`. Si le vecteur
    est vide, elle renvoie `std::nullopt`.

  Tu écris le code des fonctions dans `liste.cpp`.
explanation: |-
  `inserer_trie` avance un itérateur tant que l'élément est plus petit que la valeur, puis appelle `insert`, qui
  insère **avant** la position. Si l'itérateur atteint `end()`, la valeur arrive à la fin.

  `retirer_negatifs` montre la boucle d'effacement : `erase` invalide l'itérateur qu'on lui donne, et renvoie celui
  de l'élément suivant. On le reprend, **sans** incrémenter ce tour-là ; sinon, on sauterait un élément, et deux
  négatifs voisins ne seraient pas tous les deux retirés. En C++20, `std::erase_if` fait ce travail en une ligne.

  `retirer_dernier` teste `empty()` d'abord : `back()` et `pop_back()` sur un vecteur vide sont des comportements
  indéfinis. Comme `pop_back()` ne renvoie rien, on lit `back()` avant de retirer.
