statement: |-
  Écris la classe `Inventaire`, déclarée dans `inventaire.hpp`. Elle **possède** ses articles : chacun est tenu par un
  `std::unique_ptr<Article>`, rangé dans un vecteur.

  - `ajouter(article)` prend possession de l'article reçu, et le range à la fin. Un pointeur nul est ignoré.
  - `nombre()` renvoie le nombre d'articles.
  - `valeur_totale()` renvoie la somme des prix.
  - `retirer_dernier()` retire le dernier article et le **rend à l'appelant**, qui en devient propriétaire. Si
    l'inventaire est vide, elle renvoie un pointeur nul.

  La struct `Article` (un nom, un prix) est déjà définie. Tu écris le code des fonctions dans `inventaire.cpp`.
explanation: |-
  `ajouter` reçoit le `std::unique_ptr` par valeur : l'appelant a dû écrire `std::move`, et la fonction est devenue
  propriétaire. Elle le déplace à son tour dans le vecteur, avec `std::move` : un `std::unique_ptr` ne se copie pas.

  `valeur_totale` parcourt le vecteur par référence constante (`const auto&`) : copier un élément serait copier un
  `std::unique_ptr`, ce qui ne compile pas.

  `retirer_dernier` déplace le dernier élément hors du vecteur avant de le retirer avec `pop_back`, puis le renvoie.
  Le type de retour dit à l'appelant qu'il possède maintenant l'article.

  Nulle part il n'y a de `delete` : les articles restés dans l'inventaire sont détruits avec lui, et ceux qui en sont
  sortis le sont avec leur nouveau propriétaire.
