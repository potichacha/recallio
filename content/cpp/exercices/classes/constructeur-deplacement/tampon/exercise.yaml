statement: |-
  La classe `Tampon`, déclarée dans `tampon.hpp`, possède un tableau d'entiers alloué sur le tas. Son constructeur, son
  destructeur et ses accesseurs sont déjà écrits. Écris ses quatre fonctions de copie et de déplacement, dans
  `tampon.cpp` :

  - le **constructeur de copie** fait une copie profonde : la copie a son propre tableau, de même taille et de même
    contenu ;
  - l'**affectation par copie** aussi, y compris pour `a = a;` ;
  - le **constructeur de déplacement** prend le tableau de la source, et la laisse **vide** : taille `0`, pointeur
    nul ;
  - l'**affectation par déplacement** libère l'ancien tableau, prend celui de la source, et la laisse vide.
explanation: |-
  C'est la règle de cinq : la classe gère elle-même une ressource, elle écrit donc les cinq fonctions.

  Le **constructeur de copie** alloue un nouveau tableau, puis recopie les éléments avec `std::copy`. L'**affectation
  par copie** commence par écarter `a = a;`, puis remplace le tableau.

  Le **constructeur de déplacement** ne fait que reprendre le pointeur et la taille, puis remet la source à zéro.
  Sans cela, le destructeur de la source libérerait le tableau qu'on vient de prendre. L'**affectation par
  déplacement** doit en plus libérer le tableau que l'objet possédait.

  Les deux fonctions de déplacement sont `noexcept` : `std::vector` peut ainsi déplacer des tampons quand il
  réalloue.

  Dans un vrai projet, un membre `std::vector<int>` donnerait les cinq fonctions sans rien écrire : c'est la règle de
  zéro.
