statement: |-
  La classe `Fraction`, déclarée dans `fraction.hpp`, représente une fraction toujours **réduite** : son
  constructeur, déjà écrit, simplifie le numérateur et le dénominateur. Donne-lui ses opérateurs.

  - `operator+=` (membre) ajoute une autre fraction à celle-ci, et renvoie `*this` par référence.
  - `operator+` (fonction libre) renvoie la somme de deux fractions, sans les modifier. Écris-le à partir de `+=`.
  - `operator*` (fonction libre) renvoie le produit de deux fractions.
  - `operator==` (fonction libre) dit si deux fractions sont égales.

  Un entier se convertit en fraction par le constructeur (`Fraction{3}` vaut 3/1) : comme `+` et `*` sont des
  fonctions libres, `2 + f` et `f * 2` doivent fonctionner.

  Rappel : a/b + c/d = (a·d + c·b) / (b·d), et a/b × c/d = (a·c) / (b·d). Tu écris le code dans `fraction.cpp`.
explanation: |-
  `operator+=` calcule le nouveau numérateur et le nouveau dénominateur, puis affecte à `*this` une fraction
  construite avec eux : le constructeur se charge de la réduire. Il renvoie `*this` par référence, ce qui permet
  `(a += b) += c`.

  `operator+` reçoit son premier opérande **par valeur** : c'est déjà une copie, qu'il suffit de modifier avec `+=`
  puis de renvoyer. La formule n'est écrite qu'une fois.

  `operator*` et `operator==` n'ont besoin que des accesseurs publics : ce sont des fonctions libres, sans accès
  privilégié. Comme les fractions sont toujours réduites, deux fractions égales ont le même numérateur et le même
  dénominateur.

  Parce que ces opérateurs sont des fonctions libres, les conversions s'appliquent aux deux opérandes : dans
  `2 + f`, l'entier devient `Fraction{2}`. Avec un opérateur membre, cette expression ne compilerait pas.
