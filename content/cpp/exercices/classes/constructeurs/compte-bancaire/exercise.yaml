statement: |-
  Écris la classe `CompteBancaire`, déclarée dans `compte.hpp`. Elle protège une règle : **le solde n'est jamais
  négatif**.

  - Le constructeur reçoit le dépôt initial. S'il est négatif, le compte démarre à `0`.
  - `solde()` renvoie le solde.
  - `deposer(montant)` ajoute le montant au solde, s'il est strictement positif ; sinon, elle ne fait rien.
  - `retirer(montant)` retire le montant et renvoie `true`, si le montant est strictement positif et ne dépasse pas le
    solde ; sinon, elle ne change rien et renvoie `false`.

  Tu écris le code des fonctions dans `compte.cpp`.
explanation: |-
  Le solde est privé : seules les fonctions de la classe le modifient, et chacune vérifie ses arguments. C'est ce qui
  garantit la règle, quel que soit le code qui utilise la classe.

  Le constructeur établit la règle dès la création, dans sa liste d'initialisation. `solde()` est `const` : elle ne
  modifie pas le compte, et reste appelable à travers une référence constante.

  `retirer` renvoie un booléen : l'appelant sait si le retrait a eu lieu, sans que la classe ait à afficher quoi que ce
  soit.
