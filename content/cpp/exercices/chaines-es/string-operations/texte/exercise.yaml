statement: |-
  Écris trois fonctions, déclarées dans `texte.hpp`, avec `find`, `substr` et `replace`.

  - `extension(nom)` renvoie ce qui suit le **dernier** point du nom de fichier : `extension("photo.final.png")`
    donne `"png"`. Sans point, elle renvoie une chaîne vide.
  - `remplacer_tout(texte, ancien, nouveau)` renvoie le texte où **chaque** occurrence de `ancien` est remplacée
    par `nouveau`. `ancien` n'est jamais vide. Un texte déjà remplacé n'est pas réexaminé :
    `remplacer_tout("aa", "a", "aa")` donne `"aaaa"`.
  - `decouper(texte, separateur)` découpe le texte autour du caractère séparateur, et renvoie les morceaux :
    `decouper("a,b,c", ',')` donne `{"a", "b", "c"}`. Deux séparateurs voisins donnent un morceau vide ; un texte
    vide donne un seul morceau vide.

  Tu écris le code des fonctions dans `texte.cpp`.
explanation: |-
  `extension` cherche le dernier point avec `rfind`, et compare le résultat à `std::string::npos` avant de s'en
  servir. `substr(point + 1)` va jusqu'à la fin.

  `remplacer_tout` avance dans le texte avec `find(ancien, position)`, qui cherche à partir d'une position. Après
  chaque `replace`, elle repart **après** le texte inséré (`position += nouveau.size()`) : sans cela, remplacer
  `a` par `aa` bouclerait sans fin.

  `decouper` garde la position du début du morceau courant. À chaque séparateur trouvé, elle range
  `substr(debut, position - debut)` ; après la boucle, elle range le dernier morceau, `substr(debut)`. C'est ce
  dernier ajout qui donne un morceau vide pour un texte vide, ou après un séparateur final.
