statement: |-
  Écris trois fonctions, déclarées dans `ticket.hpp`, qui mettent en forme les lignes d'un ticket de caisse avec
  `std::format`.

  - `prix(euros)` renvoie le montant avec **deux chiffres après la virgule**, suivi d'une espace et de `EUR` :
    `prix(12.5)` donne `"12.50 EUR"`.
  - `numero(n)` renvoie le numéro du ticket sur **six chiffres**, complété par des zéros, précédé de `#` :
    `numero(42)` donne `"#000042"`.
  - `ligne(article, quantite, total)` renvoie une ligne de 27 caractères : l'article aligné **à gauche** sur 12
    caractères, `x` et la quantité alignée **à droite** sur 3 caractères, puis le total aligné **à droite** sur 9
    caractères avec deux décimales, chaque partie séparée de la suivante par une espace.
    `ligne("Cahier", 3, 7.5)` donne `"Cahier       x  3      7.50"`.

  Tu écris le code des fonctions dans `ticket.cpp`.
explanation: |-
  Les trois fonctions tiennent en un appel à `std::format`, dont la spécification suit les deux-points.

  - `prix` : `{:.2f}` impose deux chiffres après la virgule.
  - `numero` : `{:06}`, où `0` demande de compléter avec des zéros et `6` est la largeur. Le `#` est du texte du
    modèle.
  - `ligne` : `{:<12}` aligne l'article à gauche, `{:>3}` la quantité à droite, `{:>9.2f}` combine la largeur, la
    précision et le type. Un nombre s'aligne déjà à droite par défaut : le `>` ne fait que le dire.

  Le modèle est vérifié à la compilation : une spécification qui ne convient pas au type de l'argument ne compile
  pas.
