statement: |-
  Écris trois fonctions, déclarées dans `releve.hpp`, qui lisent et écrivent des fichiers texte.

  - `ecrire_lignes(chemin, lignes)` écrit chaque chaîne du vecteur sur sa propre ligne, en **remplaçant** le
    contenu du fichier. Elle renvoie `true` si le fichier a pu être ouvert, `false` sinon.
  - `lire_lignes(chemin)` renvoie les lignes du fichier, sans leur retour à la ligne. Si le fichier ne peut pas
    être ouvert, elle renvoie `std::nullopt` : un fichier absent n'est pas un fichier vide.
  - `somme(chemin)` renvoie la somme de tous les entiers du fichier, séparés par des espaces ou des retours à la
    ligne. Si le fichier ne peut pas être ouvert, elle lance `std::runtime_error`.

  Les tests écrivent leurs fichiers dans le répertoire temporaire. Tu écris le code des fonctions dans
  `releve.cpp`.
explanation: |-
  Les trois fonctions commencent de la même façon : ouvrir, puis **tester l'ouverture** avec `if (!flux)`. Un
  fichier introuvable ne lance aucune exception : sans ce test, il ressemblerait à un fichier vide.

  `ecrire_lignes` ouvre un `std::ofstream`, qui efface le contenu existant par défaut, et écrit chaque ligne
  suivie de `'\n'`. Le fichier est fermé par le destructeur du flux, à la sortie de la fonction.

  `lire_lignes` utilise la boucle `while (std::getline(entree, ligne))` : elle s'arrête d'elle-même à la fin du
  fichier, sans tour de trop.

  `somme` lit avec `while (entree >> valeur)` : l'opérateur `>>` saute les espaces et les retours à la ligne, si
  bien que la disposition des nombres n'a pas d'importance. Chaque fonction signale l'échec à sa façon : un
  booléen, un `std::optional`, une exception.
