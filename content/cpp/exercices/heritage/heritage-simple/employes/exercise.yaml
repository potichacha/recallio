statement: |-
  Les classes `Employe` et `Manager` sont déclarées dans `employes.hpp`. Un `Manager` **est un** `Employe`, qui touche
  en plus une prime. Écris leurs constructeurs et leurs fonctions, dans `employes.cpp` :

  - `Employe(nom, salaire)` range le nom et le salaire ; `nom()` et `salaire()` les renvoient ;
  - `Manager(nom, salaire, prime)` passe le nom et le salaire au constructeur d'`Employe`, et garde la prime ;
  - `prime()` renvoie la prime ;
  - `remuneration()` renvoie le salaire plus la prime.

  `Manager` n'a pas accès aux membres privés d'`Employe` : elle passe par ses fonctions publiques.
explanation: |-
  Le constructeur de `Manager` appelle celui d'`Employe` dans sa liste d'initialisation : `Employe{nom, salaire}`.
  C'est la base qui initialise ses propres membres ; la dérivée n'initialise que `prime_`.

  `remuneration` ne lit pas `salaire_`, qui est privé dans `Employe`. Elle appelle `salaire()`, que `Manager` a
  héritée.

  Les tests passent aussi un `Manager` à une fonction qui prend un `const Employe&` : l'héritage public le permet,
  parce qu'un manager est un employé.
