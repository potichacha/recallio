statement: |-
  L'interface `Forme`, dans `formes.hpp`, annonce deux fonctions virtuelles pures : `aire()` et `nom()`. Écris, dans
  `formes.cpp` :

  - la classe `Rectangle` : `aire()` renvoie la largeur multipliée par la hauteur, `nom()` renvoie `"rectangle"` ;
  - la classe `Carre` : `aire()` renvoie le côté au carré, `nom()` renvoie `"carré"` ;
  - la fonction `aire_totale(formes)`, qui additionne les aires de toutes les formes du vecteur ;
  - la fonction `plus_grande(formes)`, qui renvoie le nom de la forme dont l'aire est la plus grande, ou une chaîne
    vide si le vecteur est vide. En cas d'égalité, la première l'emporte.

  Les deux fonctions ne connaissent que l'interface `Forme`.
explanation: |-
  `Rectangle` et `Carre` redéfinissent les deux fonctions de l'interface, avec `override` dans leur déclaration.

  `aire_totale` et `plus_grande` parcourent un vecteur de `std::unique_ptr<Forme>`, par référence constante : un
  `std::unique_ptr` ne se copie pas. Chaque appel `forme->aire()` est virtuel : il exécute la version du rectangle
  ou celle du carré, selon l'objet.

  Aucune des deux fonctions ne nomme `Rectangle` ni `Carre`. Ajouter un `Disque` ne demanderait pas de les modifier :
  c'est l'intérêt du polymorphisme.

  `Forme` a un destructeur virtuel : le vecteur détruit ses formes par des pointeurs vers la base.
