domain: objet
title: Programmation orientée objet en Java
position: 20
chapters:
  - id: classes-objets
    title: Classes et objets
    notions:
      - {id: classe-objet, title: "Classe, objet, instance : définir une classe et créer des objets avec new", level: beginner, priority: 1, requires: [methodes-declaration, types-reference]}
      - {id: champs-methodes-instance, title: "Champs et méthodes d'instance, le mot-clé this", level: beginner, priority: 1, requires: [classe-objet]}
      - {id: constructeurs, title: "Constructeurs, constructeur par défaut, surcharge et this(...)", level: beginner, priority: 1, requires: [champs-methodes-instance]}
      - {id: ordre-initialisation, title: "Ordre d'initialisation : champs, blocs d'initialisation, constructeur, blocs static", level: intermediate, priority: 2, requires: [constructeurs, methodes-statiques]}
      - {id: membres-static, title: "Membres static : partagés par la classe, accès et pièges", level: beginner, priority: 1, requires: [champs-methodes-instance, methodes-statiques]}
      - {id: references-null, title: "Références, alias et NullPointerException", level: beginner, priority: 1, requires: [classe-objet]}
      - {id: cycle-vie-objet, title: "Cycle de vie d'un objet : création, accessibilité, ramasse-miettes", level: beginner, priority: 2, requires: [references-null]}
  - id: encapsulation
    title: Encapsulation et visibilité
    notions:
      - {id: modificateurs-acces, title: "Modificateurs d'accès : public, protected, package-private, private", level: beginner, priority: 1, requires: [classe-objet]}
      - {id: encapsulation-principe, title: "L'encapsulation : état privé, invariants, accesseurs", level: beginner, priority: 1, requires: [modificateurs-acces]}
      - {id: packages-visibilite, title: "Packages et visibilité entre packages", level: beginner, priority: 1, requires: [modificateurs-acces, structure-fichier-source]}
      - {id: final-classes-methodes, title: "final sur une classe, une méthode, un champ", level: intermediate, priority: 1, requires: [encapsulation-principe]}
  - id: heritage
    title: Héritage
    notions:
      - {id: heritage-bases, title: "L'héritage avec extends : ce qui est hérité, ce qui ne l'est pas", level: beginner, priority: 1, requires: [constructeurs, modificateurs-acces]}
      - {id: super-mot-cle, title: "super : appeler le constructeur et les méthodes du parent", level: beginner, priority: 1, requires: [heritage-bases]}
      - {id: redefinition, title: "La redéfinition (override), @Override et ses règles (visibilité, exceptions, type de retour covariant)", level: beginner, priority: 1, requires: [heritage-bases]}
      - {id: surcharge-vs-redefinition, title: "Surcharge et redéfinition : résolution à la compilation et à l'exécution", level: intermediate, priority: 1, requires: [redefinition, surcharge]}
      - {id: masquage-champs-static, title: "Masquage des champs et des méthodes static", level: expert, priority: 3, requires: [redefinition, membres-static]}
      - {id: constructeur-appel-methode-redefinie, title: "Appeler une méthode redéfinissable depuis un constructeur : le piège", level: expert, priority: 2, requires: [redefinition, ordre-initialisation]}
      - {id: heritage-vs-composition, title: "Héritage ou composition : quand préférer l'un ou l'autre", level: intermediate, priority: 1, requires: [heritage-bases], formats: [course, true-false, multiple-choice, scenario, exercise]}
  - id: polymorphisme
    title: Polymorphisme
    notions:
      - {id: polymorphisme-principe, title: "Le polymorphisme : un type déclaré, plusieurs comportements", level: beginner, priority: 1, requires: [redefinition]}
      - {id: liaison-dynamique, title: "La liaison dynamique (dispatch virtuel)", level: intermediate, priority: 1, requires: [polymorphisme-principe]}
      - {id: upcast-downcast, title: "Transtypage de références : upcast, downcast, ClassCastException", level: beginner, priority: 1, requires: [polymorphisme-principe]}
      - {id: instanceof-operateur, title: "L'opérateur instanceof", level: beginner, priority: 1, requires: [upcast-downcast]}
  - id: abstraction-interfaces
    title: Classes abstraites et interfaces
    notions:
      - {id: classes-abstraites, title: "Classes et méthodes abstraites", level: beginner, priority: 1, requires: [heritage-bases]}
      - {id: interfaces-bases, title: "Interfaces : contrat, implements, implémentation multiple", level: beginner, priority: 1, requires: [classes-abstraites]}
      - {id: methodes-default-static-interface, title: "Méthodes default, static et private dans une interface", level: intermediate, priority: 1, requires: [interfaces-bases]}
      - {id: conflit-methodes-default, title: "Conflit entre méthodes default héritées : la règle du diamant", level: expert, priority: 2, requires: [methodes-default-static-interface]}
      - {id: abstraite-vs-interface, title: "Classe abstraite ou interface : choisir", level: intermediate, priority: 1, requires: [interfaces-bases], formats: [course, true-false, multiple-choice, scenario, exercise]}
      - {id: interfaces-marqueurs, title: "Interfaces marqueurs (Serializable, Cloneable, RandomAccess)", level: intermediate, priority: 2, requires: [interfaces-bases]}
  - id: classes-imbriquees
    title: Classes imbriquées
    notions:
      - {id: classes-internes, title: "Classes internes (non static) et accès à l'instance englobante", level: intermediate, priority: 2, requires: [champs-methodes-instance]}
      - {id: classes-imbriquees-static, title: "Classes imbriquées static", level: intermediate, priority: 2, requires: [membres-static]}
      - {id: classes-locales-anonymes, title: "Classes locales et classes anonymes, variables effectivement finales", level: intermediate, priority: 2, requires: [classes-internes, interfaces-bases]}
      - {id: fuite-memoire-classe-interne, title: "La référence cachée vers l'englobante : fuites mémoire", level: expert, priority: 3, requires: [classes-internes]}
  - id: enums
    title: Énumérations
    notions:
      - {id: enum-bases, title: "Déclarer et utiliser une enum, values(), valueOf(), ordinal()", level: beginner, priority: 1, requires: [classe-objet]}
      - {id: enum-champs-methodes, title: "Enums avec champs, constructeurs, méthodes et comportement par constante", level: intermediate, priority: 2, requires: [enum-bases]}
      - {id: enumset-enummap, title: "EnumSet et EnumMap", level: intermediate, priority: 3, requires: [enum-bases, collections-panorama]}
      - {id: enum-singleton, title: "Le singleton par enum", level: expert, priority: 3, requires: [enum-bases]}
  - id: object-egalite
    title: La classe Object, l'égalité et le hachage
    notions:
      - {id: classe-object, title: "Object, racine de toutes les classes, et ses méthodes", level: beginner, priority: 1, requires: [heritage-bases]}
      - {id: tostring, title: "toString et son usage", level: beginner, priority: 1, requires: [classe-object]}
      - {id: equals-contrat, title: "equals : son contrat (réflexivité, symétrie, transitivité, cohérence, null)", level: intermediate, priority: 1, requires: [classe-object, egalite-references]}
      - {id: hashcode-contrat, title: "hashCode et son lien avec equals", level: intermediate, priority: 1, requires: [equals-contrat]}
      - {id: equals-heritage, title: "equals et l'héritage : getClass ou instanceof", level: expert, priority: 2, requires: [equals-contrat]}
      - {id: comparable-comparator, title: "Comparable et Comparator : ordre naturel et ordres multiples", level: beginner, priority: 1, requires: [interfaces-bases]}
      - {id: clone-copie, title: "clone(), copie superficielle et copie profonde, constructeurs de copie", level: intermediate, priority: 3, requires: [classe-object]}
      - {id: finalize-cleaner, title: "finalize (déprécié), Cleaner et ressources", level: expert, priority: 4, requires: [classe-object]}
  - id: immutabilite
    title: Immutabilité et conception de classes
    notions:
      - {id: objets-immuables, title: "Concevoir une classe immuable", level: intermediate, priority: 1, requires: [final-classes-methodes, encapsulation-principe]}
      - {id: copies-defensives, title: "Copies défensives en entrée et en sortie", level: intermediate, priority: 2, requires: [objets-immuables]}
      - {id: fabriques-statiques, title: "Fabriques statiques plutôt que constructeurs", level: intermediate, priority: 2, requires: [constructeurs, membres-static]}
      - {id: builder-java, title: "Le builder pour les objets à nombreux paramètres", level: intermediate, priority: 2, requires: [classes-imbriquees-static]}
      - {id: singleton-java, title: "Le singleton : variantes et pièges", level: intermediate, priority: 2, requires: [membres-static]}
