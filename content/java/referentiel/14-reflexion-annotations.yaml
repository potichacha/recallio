domain: reflexion-annotations
title: Réflexion, annotations et métaprogrammation
position: 140
chapters:
  - id: annotations
    title: Annotations
    notions:
      - {id: annotations-standard, title: "Les annotations standard : @Override, @Deprecated, @SuppressWarnings, @FunctionalInterface", level: beginner, priority: 1, requires: [redefinition]}
      - {id: annotations-personnalisees, title: "Créer une annotation : @Retention, @Target, éléments", level: intermediate, priority: 2, requires: [annotations-standard]}
      - {id: processeurs-annotations, title: "Les processeurs d'annotations à la compilation", level: expert, priority: 3, requires: [annotations-personnalisees]}
  - id: reflexion
    title: Réflexion
    notions:
      - {id: reflexion-bases, title: "La réflexion : Class, Field, Method, Constructor", level: intermediate, priority: 2, requires: [classe-objet]}
      - {id: reflexion-annotations, title: "Lire des annotations à l'exécution", level: intermediate, priority: 2, requires: [reflexion-bases, annotations-personnalisees]}
      - {id: reflexion-couts, title: "Coûts et limites de la réflexion, encapsulation forte des modules", level: expert, priority: 3, requires: [reflexion-bases, modules-principe]}
      - {id: proxies-dynamiques, title: "Les proxies dynamiques (java.lang.reflect.Proxy)", level: expert, priority: 3, requires: [reflexion-bases, interfaces-bases]}
      - {id: method-handles, title: "MethodHandle et VarHandle", level: expert, priority: 4, requires: [reflexion-bases]}
  - id: extensibilite
    title: Extensibilité et interopérabilité
    notions:
      - {id: serviceloader, title: "ServiceLoader et les fournisseurs de services", level: expert, priority: 3, requires: [interfaces-bases]}
      - {id: ffm-jni, title: "Appeler du code natif : FFM (Foreign Function & Memory) et JNI", level: expert, priority: 4, formats: [course, true-false, multiple-choice, scenario]}
      - {id: securite-java, title: "Sécurité dans le JDK : JCA, hachage, chiffrement, KeyStore", level: expert, priority: 3, formats: [course, true-false, multiple-choice, scenario]}
