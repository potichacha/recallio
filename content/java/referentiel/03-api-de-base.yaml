domain: api-de-base
title: Chaînes, nombres, dates et API de base
position: 30
chapters:
  - id: chaines
    title: Chaînes de caractères
    notions:
      - {id: string-bases, title: "La classe String : création, méthodes essentielles", level: beginner, priority: 1, requires: [types-reference]}
      - {id: string-immuabilite, title: "L'immuabilité de String et ses raisons", level: beginner, priority: 1, requires: [string-bases]}
      - {id: string-pool, title: "Le pool de chaînes, intern() et == entre chaînes", level: intermediate, priority: 1, requires: [string-immuabilite, egalite-references]}
      - {id: string-concatenation, title: "Concaténation : +, StringBuilder, invokedynamic", level: intermediate, priority: 1, requires: [string-bases]}
      - {id: stringbuilder, title: "StringBuilder et StringBuffer", level: beginner, priority: 1, requires: [string-bases]}
      - {id: string-comparaison, title: "Comparer des chaînes : equals, equalsIgnoreCase, compareTo, Collator", level: beginner, priority: 1, requires: [string-bases]}
      - {id: string-methodes-modernes, title: "Méthodes récentes : isBlank, strip, lines, repeat, formatted", level: intermediate, priority: 2, requires: [string-bases]}
      - {id: text-blocks, title: "Les blocs de texte (text blocks)", level: intermediate, priority: 2, requires: [string-bases]}
      - {id: string-format, title: "Formater : String.format, formatted, printf", level: beginner, priority: 2, requires: [string-bases]}
      - {id: string-join-split, title: "Découper et assembler : split, join, StringJoiner", level: beginner, priority: 2, requires: [string-bases]}
      - {id: expressions-regulieres, title: "Expressions régulières : Pattern, Matcher, groupes", level: intermediate, priority: 2, requires: [string-bases]}
      - {id: charsets-encodage, title: "Encodages et Charset : String et bytes", level: intermediate, priority: 2, requires: [string-bases, char-unicode]}
  - id: nombres
    title: Nombres
    notions:
      - {id: classes-enveloppes, title: "Les classes enveloppes (Integer, Long, Double...)", level: beginner, priority: 1, requires: [types-primitifs, types-reference]}
      - {id: autoboxing, title: "Autoboxing, unboxing et NullPointerException", level: beginner, priority: 1, requires: [classes-enveloppes]}
      - {id: cache-integer, title: "Le cache des Integer (-128 à 127) et == entre enveloppes", level: intermediate, priority: 1, requires: [autoboxing, egalite-references]}
      - {id: parsing-nombres, title: "Convertir texte ↔ nombre : parseInt, valueOf, NumberFormatException", level: beginner, priority: 1, requires: [classes-enveloppes]}
      - {id: math-classe, title: "La classe Math, les opérations exactes et StrictMath", level: beginner, priority: 2, requires: [operateurs-arithmetiques]}
      - {id: bigdecimal, title: "BigDecimal : calcul exact, échelle, arrondi, equals vs compareTo", level: intermediate, priority: 1, requires: [flottants-precision]}
      - {id: biginteger, title: "BigInteger", level: intermediate, priority: 3, requires: [classes-enveloppes]}
      - {id: aleatoire, title: "Nombres aléatoires : Random, ThreadLocalRandom, SecureRandom, RandomGenerator", level: intermediate, priority: 2, requires: [classes-enveloppes]}
      - {id: formatage-nombres, title: "Formater des nombres et des monnaies (NumberFormat, DecimalFormat)", level: intermediate, priority: 3, requires: [string-format]}
  - id: dates-heures
    title: Dates et heures (java.time)
    notions:
      - {id: java-time-panorama, title: "java.time : pourquoi il remplace Date et Calendar", level: beginner, priority: 1, formats: [course, true-false, multiple-choice, scenario]}
      - {id: localdate-localtime, title: "LocalDate, LocalTime, LocalDateTime", level: beginner, priority: 1, requires: [java-time-panorama]}
      - {id: instant-zoneddatetime, title: "Instant, ZonedDateTime, OffsetDateTime et fuseaux horaires", level: intermediate, priority: 1, requires: [localdate-localtime]}
      - {id: duration-period, title: "Duration et Period", level: beginner, priority: 1, requires: [localdate-localtime]}
      - {id: datetimeformatter, title: "Formater et analyser avec DateTimeFormatter", level: beginner, priority: 2, requires: [localdate-localtime]}
      - {id: clock-testabilite, title: "Clock : rendre le temps testable", level: intermediate, priority: 1, requires: [instant-zoneddatetime]}
      - {id: heure-ete, title: "Heure d'été, ambiguïtés et trous horaires", level: expert, priority: 3, requires: [instant-zoneddatetime]}
      - {id: date-legacy, title: "Date, Calendar et SimpleDateFormat : l'héritage et la conversion", level: intermediate, priority: 3, requires: [java-time-panorama]}
  - id: utilitaires
    title: Classes utilitaires
    notions:
      - {id: optional-bases, title: "Optional : créer, tester, transformer, obtenir une valeur", level: intermediate, priority: 1, requires: [references-null]}
      - {id: optional-bonnes-pratiques, title: "Optional : bonnes et mauvaises pratiques (retour, pas champ ni paramètre)", level: intermediate, priority: 1, requires: [optional-bases]}
      - {id: objects-utilitaires, title: "La classe Objects : requireNonNull, equals, hash, toString", level: intermediate, priority: 2, requires: [equals-contrat]}
      - {id: system-runtime, title: "System et Runtime : propriétés, variables d'environnement, nanoTime", level: intermediate, priority: 3, requires: [hello-world]}
      - {id: uuid, title: "UUID", level: beginner, priority: 3, requires: [classe-objet]}
      - {id: locale-i18n, title: "Locale, ResourceBundle et internationalisation", level: intermediate, priority: 4, requires: [string-format]}
