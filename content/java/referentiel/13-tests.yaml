domain: tests
title: Tester en Java
position: 130
chapters:
  - id: junit
    title: JUnit
    notions:
      - {id: tests-principe, title: "Pourquoi tester : tests unitaires, d'intégration, de bout en bout", level: beginner, priority: 1, formats: [course, true-false, multiple-choice, scenario]}
      - {id: junit-bases, title: "JUnit : @Test, assertions, cycle de vie (@BeforeEach...)", level: beginner, priority: 1, requires: [tests-principe, classe-objet]}
      - {id: junit-exceptions, title: "Tester une exception (assertThrows)", level: beginner, priority: 1, requires: [junit-bases, try-catch-finally]}
      - {id: junit-parametres, title: "Tests paramétrés", level: intermediate, priority: 2, requires: [junit-bases]}
      - {id: junit-organisation, title: "Organiser les tests : @Nested, @DisplayName, tags, conventions de nommage", level: intermediate, priority: 2, requires: [junit-bases]}
      - {id: assertj, title: "Assertions expressives avec AssertJ", level: intermediate, priority: 2, requires: [junit-bases]}
  - id: doublures
    title: Doublures de test
    notions:
      - {id: doublures-types, title: "Doublures : stub, mock, fake, spy", level: intermediate, priority: 1, requires: [junit-bases], formats: [course, true-false, multiple-choice, scenario]}
      - {id: mockito-bases, title: "Mockito : mock, when, verify", level: intermediate, priority: 1, requires: [doublures-types, interfaces-bases]}
      - {id: mockito-avance, title: "Mockito : captureurs, réponses, mocks de classes finales et statiques", level: expert, priority: 3, requires: [mockito-bases]}
      - {id: testabilite, title: "Écrire du code testable : injection, horloge, effets de bord", level: intermediate, priority: 1, requires: [doublures-types, clock-testabilite], formats: [course, true-false, multiple-choice, scenario, exercise]}
  - id: pratiques-tests
    title: Pratiques de test
    notions:
      - {id: tdd, title: "Le développement piloté par les tests (TDD)", level: intermediate, priority: 2, requires: [junit-bases], formats: [course, true-false, multiple-choice, scenario, exercise, definition]}
      - {id: couverture-code, title: "La couverture de code et ses limites (JaCoCo)", level: intermediate, priority: 3, requires: [junit-bases], formats: [course, true-false, multiple-choice, scenario]}
      - {id: tests-integration-testcontainers, title: "Tests d'intégration avec Testcontainers", level: expert, priority: 3, requires: [junit-bases], formats: [course, true-false, multiple-choice, scenario]}
      - {id: mutation-testing, title: "Les tests de mutation (PIT)", level: expert, priority: 4, requires: [couverture-code], formats: [course, true-false, multiple-choice, scenario]}
