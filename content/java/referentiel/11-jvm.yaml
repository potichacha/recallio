domain: jvm
title: La JVM, la mémoire et les performances
position: 110
chapters:
  - id: jvm-architecture
    title: Architecture de la JVM
    notions:
      - {id: jvm-architecture, title: "Architecture de la JVM : chargeur de classes, zones mémoire, moteur d'exécution", level: intermediate, priority: 1, requires: [jdk-jre-jvm], formats: [course, true-false, multiple-choice, scenario]}
      - {id: bytecode, title: "Le bytecode, javap et la pile d'opérandes", level: expert, priority: 3, requires: [jvm-architecture]}
      - {id: chargement-classes, title: "Chargement des classes : chargement, liaison, initialisation", level: expert, priority: 2, requires: [jvm-architecture]}
      - {id: classloaders, title: "Les class loaders, la délégation parent et leurs fuites", level: expert, priority: 2, requires: [chargement-classes]}
      - {id: interpretation-jit, title: "Interprétation, compilation JIT (C1, C2), warm-up", level: expert, priority: 2, requires: [jvm-architecture], formats: [course, true-false, multiple-choice, scenario]}
      - {id: aot-graalvm, title: "Compilation anticipée, GraalVM native image, CDS", level: expert, priority: 3, requires: [interpretation-jit], formats: [course, true-false, multiple-choice, scenario]}
  - id: memoire
    title: Mémoire
    notions:
      - {id: pile-tas, title: "La pile et le tas : ce qui va où", level: intermediate, priority: 1, requires: [jvm-architecture, references-null]}
      - {id: metaspace, title: "Le Metaspace et l'ancien PermGen", level: expert, priority: 3, requires: [pile-tas]}
      - {id: fuites-memoire, title: "Fuites mémoire en Java : causes et diagnostic", level: expert, priority: 1, requires: [pile-tas], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: references-faibles, title: "Références faibles, douces et fantômes", level: expert, priority: 3, requires: [pile-tas]}
      - {id: escape-analysis, title: "L'analyse d'échappement et l'allocation sur la pile", level: expert, priority: 4, requires: [interpretation-jit, pile-tas]}
      - {id: options-memoire, title: "Régler la mémoire : -Xms, -Xmx, conteneurs et MaxRAMPercentage", level: expert, priority: 2, requires: [pile-tas], formats: [course, true-false, multiple-choice, scenario]}
  - id: garbage-collector
    title: Le ramasse-miettes
    notions:
      - {id: gc-principe, title: "Le principe du ramasse-miettes : accessibilité, racines, générations", level: intermediate, priority: 1, requires: [pile-tas], formats: [course, true-false, multiple-choice, scenario]}
      - {id: gc-algorithmes, title: "Les ramasse-miettes : Serial, Parallel, G1, ZGC, Shenandoah", level: expert, priority: 2, requires: [gc-principe], formats: [course, true-false, multiple-choice, scenario]}
      - {id: gc-pauses-reglage, title: "Pauses, débit, latence : choisir et régler un GC, lire ses journaux", level: expert, priority: 3, requires: [gc-algorithmes], formats: [course, true-false, multiple-choice, scenario]}
  - id: outillage-performance
    title: Outillage et performances
    notions:
      - {id: outils-jdk-diagnostic, title: "Outils de diagnostic : jcmd, jstack, jmap, jstat", level: expert, priority: 2, requires: [jvm-architecture], formats: [course, true-false, multiple-choice, scenario]}
      - {id: jfr-jmc, title: "Java Flight Recorder et Mission Control", level: expert, priority: 3, requires: [outils-jdk-diagnostic], formats: [course, true-false, multiple-choice, scenario]}
      - {id: thread-dump, title: "Analyser un thread dump", level: expert, priority: 2, requires: [outils-jdk-diagnostic, interblocage], formats: [course, true-false, multiple-choice, scenario]}
      - {id: heap-dump, title: "Analyser un heap dump", level: expert, priority: 3, requires: [outils-jdk-diagnostic, fuites-memoire], formats: [course, true-false, multiple-choice, scenario]}
      - {id: microbenchmark-jmh, title: "Mesurer correctement : JMH et les pièges des micro-benchmarks", level: expert, priority: 3, requires: [interpretation-jit], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
      - {id: profilage, title: "Profiler une application (CPU, allocations)", level: expert, priority: 3, requires: [jfr-jmc], formats: [course, true-false, multiple-choice, scenario]}
