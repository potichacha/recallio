# Référentiel Java (ADR 0025) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: bases
title: Bases du langage
position: 10
chapters:
  - id: premiers-pas
    title: Premiers pas
    notions:
      - {id: java-presentation, title: "Ce qu'est Java : langage, JVM, bytecode, « write once, run anywhere »", level: beginner, priority: 1, formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: jdk-jre-jvm, title: "JDK, JRE et JVM : rôles et différences", level: beginner, priority: 1, requires: [java-presentation], formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: hello-world, title: "Le premier programme : classe, méthode main, System.out.println", level: beginner, priority: 1, requires: [jdk-jre-jvm], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: compilation-execution, title: "Compiler (javac) et exécuter (java) ; lancer un fichier source unique", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, scenario], complete: true}
      - {id: structure-fichier-source, title: "Structure d'un fichier source : package, imports, une classe publique par fichier", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: commentaires-javadoc, title: "Commentaires et Javadoc", level: beginner, priority: 2, requires: [hello-world], formats: [course, true-false, multiple-choice, bug-fix], complete: true}
      - {id: conventions-nommage, title: "Conventions de nommage (classes, méthodes, constantes, packages)", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, bug-fix], complete: true}
      - {id: main-arguments, title: "Les arguments de main et la sortie d'un programme (System.exit)", level: beginner, priority: 2, requires: [hello-world], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: entrees-console, title: "Lire la console : Scanner, BufferedReader, System.in", level: beginner, priority: 2, requires: [hello-world], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: jshell, title: "JShell, la boucle interactive", level: beginner, priority: 3, requires: [compilation-execution], formats: [course, true-false, multiple-choice], complete: true}
      - {id: histoire-versions-java, title: "Histoire de Java, cadence des versions et versions LTS", level: beginner, priority: 3, formats: [course, true-false, multiple-choice, definition], complete: true}
  - id: types-variables
    title: Types et variables
    notions:
      - {id: types-primitifs, title: "Les huit types primitifs, leurs tailles et leurs plages", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: variables-declaration, title: "Déclarer, initialiser et affecter une variable", level: beginner, priority: 1, requires: [types-primitifs], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: litteraux, title: "Les littéraux : entiers, flottants, caractères, booléens, séparateur _", level: beginner, priority: 2, requires: [types-primitifs], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: types-reference, title: "Types primitifs et types référence : valeur, référence, null", level: beginner, priority: 1, requires: [types-primitifs], formats: [course, true-false, multiple-choice, code-output, bug-fix, definition], complete: true}
      - {id: conversions-primitives, title: "Conversions élargissantes et restrictives, transtypage (cast)", level: beginner, priority: 1, requires: [types-primitifs], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: promotion-numerique, title: "Promotion numérique dans les expressions (byte + byte → int)", level: intermediate, priority: 2, requires: [conversions-primitives], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: debordement-entier, title: "Débordement des entiers et Math.addExact", level: intermediate, priority: 2, requires: [types-primitifs], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: flottants-precision, title: "Précision des flottants : 0.1 + 0.2, NaN, infinis, -0.0", level: intermediate, priority: 1, requires: [types-primitifs], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario], complete: true}
      - {id: char-unicode, title: "Le type char, Unicode et les points de code", level: intermediate, priority: 2, requires: [types-primitifs], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: var-inference, title: "L'inférence de type locale avec var", level: beginner, priority: 1, requires: [variables-declaration], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: constantes-final, title: "Constantes et variables final", level: beginner, priority: 1, requires: [variables-declaration], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: portee-variables, title: "Portée et durée de vie des variables", level: beginner, priority: 1, requires: [variables-declaration], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: valeurs-par-defaut, title: "Valeurs par défaut des champs et variables locales non initialisées", level: beginner, priority: 2, requires: [variables-declaration], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
  - id: operateurs
    title: Opérateurs et expressions
    notions:
      - {id: operateurs-arithmetiques, title: "Opérateurs arithmétiques, division entière et modulo", level: beginner, priority: 1, requires: [types-primitifs], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: increment-decrement, title: "Incrémentation et décrémentation, préfixe et suffixe", level: beginner, priority: 1, requires: [operateurs-arithmetiques], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: operateurs-comparaison, title: "Opérateurs de comparaison", level: beginner, priority: 1, requires: [types-primitifs], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: operateurs-logiques, title: "Opérateurs logiques et évaluation en court-circuit", level: beginner, priority: 1, requires: [operateurs-comparaison], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: operateurs-binaires, title: "Opérateurs bit à bit et décalages", level: intermediate, priority: 3, requires: [types-primitifs], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: operateur-ternaire, title: "L'opérateur ternaire", level: beginner, priority: 1, requires: [operateurs-comparaison], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: affectation-composee, title: "Affectations composées et leur cast implicite (b += 1)", level: intermediate, priority: 2, requires: [conversions-primitives], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: priorite-operateurs, title: "Priorité et associativité des opérateurs, ordre d'évaluation", level: intermediate, priority: 2, requires: [operateurs-arithmetiques, operateurs-logiques], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: egalite-references, title: "== sur les références et equals : la première approche", level: beginner, priority: 1, requires: [types-reference], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario], complete: true}
  - id: controle
    title: Structures de contrôle
    notions:
      - {id: if-else, title: "if, else if, else", level: beginner, priority: 1, requires: [operateurs-logiques], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: switch-classique, title: "Le switch classique, ses case et le fall-through", level: beginner, priority: 1, requires: [if-else], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: boucle-while, title: "Boucles while et do-while", level: beginner, priority: 1, requires: [if-else], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: boucle-for, title: "La boucle for", level: beginner, priority: 1, requires: [boucle-while], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: boucle-for-each, title: "La boucle for-each sur tableaux et Iterable", level: beginner, priority: 1, requires: [boucle-for], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: break-continue-etiquettes, title: "break, continue et étiquettes", level: beginner, priority: 2, requires: [boucle-for], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: boucles-imbriquees, title: "Boucles imbriquées et leur coût", level: beginner, priority: 2, requires: [boucle-for], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario], complete: true}
  - id: tableaux
    title: Tableaux
    notions:
      - {id: tableaux-declaration, title: "Déclarer, créer et initialiser un tableau", level: beginner, priority: 1, requires: [types-reference, boucle-for], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: tableaux-parcours, title: "Parcourir un tableau, length et ArrayIndexOutOfBoundsException", level: beginner, priority: 1, requires: [tableaux-declaration], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: tableaux-multidimensionnels, title: "Tableaux à plusieurs dimensions et tableaux irréguliers", level: beginner, priority: 2, requires: [tableaux-parcours], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: arrays-utilitaires, title: "La classe Arrays : sort, binarySearch, fill, copyOf, equals, toString", level: beginner, priority: 1, requires: [tableaux-parcours], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: tableaux-covariance, title: "Covariance des tableaux et ArrayStoreException", level: expert, priority: 3, requires: [tableaux-declaration, heritage-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
  - id: methodes
    title: Méthodes
    notions:
      - {id: methodes-declaration, title: "Déclarer et appeler une méthode : paramètres, type de retour, return", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: passage-par-valeur, title: "Java passe tout par valeur, y compris les références", level: beginner, priority: 1, requires: [methodes-declaration, types-reference], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: surcharge, title: "La surcharge de méthodes et sa résolution", level: beginner, priority: 1, requires: [methodes-declaration], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: varargs, title: "Les arguments variables (varargs)", level: intermediate, priority: 2, requires: [methodes-declaration, tableaux-declaration], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: recursivite, title: "La récursivité et StackOverflowError", level: beginner, priority: 2, requires: [methodes-declaration], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: methodes-statiques, title: "Méthodes et champs static", level: beginner, priority: 1, requires: [methodes-declaration], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
