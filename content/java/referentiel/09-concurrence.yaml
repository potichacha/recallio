domain: concurrence
title: Concurrence et multithreading
position: 90
chapters:
  - id: threads
    title: Les threads
    notions:
      - {id: threads-principe, title: "Processus, threads, concurrence et parallélisme", level: intermediate, priority: 1, formats: [course, true-false, multiple-choice, scenario]}
      - {id: creer-thread, title: "Créer un thread : Thread, Runnable, start contre run", level: intermediate, priority: 1, requires: [threads-principe, interfaces-bases]}
      - {id: cycle-vie-thread, title: "États d'un thread, join, sleep, interruption", level: intermediate, priority: 1, requires: [creer-thread]}
      - {id: threads-daemon, title: "Threads démons et priorités", level: intermediate, priority: 3, requires: [creer-thread]}
      - {id: threadlocal, title: "ThreadLocal et ses fuites", level: expert, priority: 2, requires: [creer-thread]}
  - id: synchronisation
    title: Synchronisation et modèle mémoire
    notions:
      - {id: conditions-course, title: "Conditions de course et sections critiques", level: intermediate, priority: 1, requires: [creer-thread]}
      - {id: synchronized, title: "synchronized : moniteurs, méthodes et blocs", level: intermediate, priority: 1, requires: [conditions-course]}
      - {id: volatile, title: "volatile et la visibilité", level: expert, priority: 1, requires: [synchronized]}
      - {id: java-memory-model, title: "Le modèle mémoire Java : happens-before", level: expert, priority: 2, requires: [volatile]}
      - {id: wait-notify, title: "wait, notify et notifyAll", level: expert, priority: 3, requires: [synchronized]}
      - {id: interblocage, title: "Interblocage (deadlock), famine et livelock", level: intermediate, priority: 1, requires: [synchronized], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: locks-explicites, title: "ReentrantLock, ReadWriteLock, StampedLock, Condition", level: expert, priority: 2, requires: [synchronized]}
      - {id: atomiques, title: "Variables atomiques et compare-and-set", level: expert, priority: 1, requires: [volatile]}
      - {id: double-checked-locking, title: "Le double-checked locking et ses conditions", level: expert, priority: 3, requires: [volatile, singleton-java]}
      - {id: thread-safety-conception, title: "Concevoir du code thread-safe : immuabilité, confinement, synchronisation", level: expert, priority: 1, requires: [synchronized, objets-immuables], formats: [course, true-false, multiple-choice, scenario, exercise]}
  - id: java-util-concurrent
    title: java.util.concurrent
    notions:
      - {id: executors, title: "ExecutorService, pools de threads et leur arrêt", level: intermediate, priority: 1, requires: [creer-thread]}
      - {id: callable-future, title: "Callable et Future", level: intermediate, priority: 1, requires: [executors]}
      - {id: completablefuture, title: "CompletableFuture : composer des traitements asynchrones", level: expert, priority: 1, requires: [callable-future, java-util-function]}
      - {id: collections-concurrentes, title: "ConcurrentHashMap, CopyOnWriteArrayList, BlockingQueue", level: intermediate, priority: 1, requires: [hashmap-usage, executors]}
      - {id: synchroniseurs, title: "CountDownLatch, CyclicBarrier, Semaphore, Phaser", level: expert, priority: 2, requires: [executors]}
      - {id: fork-join, title: "Le framework fork/join", level: expert, priority: 3, requires: [executors, recursivite]}
      - {id: dimensionner-pool, title: "Dimensionner un pool : tâches CPU et tâches d'entrée-sortie", level: expert, priority: 2, requires: [executors], formats: [course, true-false, multiple-choice, scenario]}
  - id: threads-virtuels
    title: Threads virtuels et concurrence structurée
    notions:
      - {id: threads-virtuels-principe, title: "Les threads virtuels : principe, création, quand les utiliser", level: intermediate, priority: 1, requires: [executors]}
      - {id: threads-virtuels-pieges, title: "Threads virtuels : épinglage, pools, ThreadLocal", level: expert, priority: 2, requires: [threads-virtuels-principe, synchronized]}
      - {id: concurrence-structuree, title: "La concurrence structurée (StructuredTaskScope)", level: expert, priority: 3, requires: [threads-virtuels-principe]}
      - {id: scoped-values, title: "Les valeurs de portée (ScopedValue)", level: expert, priority: 3, requires: [threads-virtuels-principe, threadlocal]}
  - id: reactif
    title: Programmation réactive
    notions:
      - {id: reactif-principe, title: "Programmation réactive : flux, back-pressure, Reactive Streams", level: expert, priority: 3, requires: [completablefuture], formats: [course, true-false, multiple-choice, scenario]}
      - {id: flow-api, title: "L'API Flow (Publisher, Subscriber)", level: expert, priority: 4, requires: [reactif-principe]}
      - {id: reactor-bases, title: "Mono et Flux (Project Reactor)", level: expert, priority: 3, requires: [reactif-principe]}
      - {id: reactif-vs-threads-virtuels, title: "Réactif ou threads virtuels : choisir", level: expert, priority: 3, requires: [reactif-principe, threads-virtuels-principe], formats: [course, true-false, multiple-choice, scenario]}
