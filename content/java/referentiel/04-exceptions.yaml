domain: exceptions
title: Exceptions
position: 40
chapters:
  - id: exceptions-bases
    title: Les bases des exceptions
    notions:
      - {id: exceptions-principe, title: "Pourquoi des exceptions : signaler et traiter les erreurs", level: beginner, priority: 1, requires: [methodes-declaration]}
      - {id: hierarchie-throwable, title: "La hiérarchie Throwable, Error, Exception, RuntimeException", level: beginner, priority: 1, requires: [exceptions-principe, heritage-bases]}
      - {id: checked-unchecked, title: "Exceptions vérifiées et non vérifiées", level: beginner, priority: 1, requires: [hierarchie-throwable]}
      - {id: try-catch-finally, title: "try, catch, finally et l'ordre des catch", level: beginner, priority: 1, requires: [exceptions-principe]}
      - {id: multi-catch, title: "Le multi-catch", level: beginner, priority: 2, requires: [try-catch-finally]}
      - {id: throw-throws, title: "throw et throws", level: beginner, priority: 1, requires: [checked-unchecked]}
      - {id: finally-pieges, title: "Les pièges de finally : return dans finally, exception masquée", level: intermediate, priority: 2, requires: [try-catch-finally]}
      - {id: stack-trace, title: "Lire une stack trace et la cause (Caused by)", level: beginner, priority: 1, requires: [try-catch-finally], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
  - id: exceptions-ressources
    title: Ressources et exceptions
    notions:
      - {id: try-with-resources, title: "try-with-resources et AutoCloseable", level: beginner, priority: 1, requires: [try-catch-finally, interfaces-bases]}
      - {id: exceptions-supprimees, title: "Exceptions supprimées (suppressed)", level: expert, priority: 3, requires: [try-with-resources]}
  - id: exceptions-conception
    title: Concevoir avec les exceptions
    notions:
      - {id: exceptions-personnalisees, title: "Créer ses propres exceptions", level: intermediate, priority: 1, requires: [throw-throws]}
      - {id: chainage-exceptions, title: "Chaîner les exceptions : cause, emballer sans perdre l'information", level: intermediate, priority: 1, requires: [exceptions-personnalisees]}
      - {id: bonnes-pratiques-exceptions, title: "Bonnes pratiques : ne pas avaler, ne pas abuser, niveau d'abstraction", level: intermediate, priority: 1, requires: [chainage-exceptions], formats: [course, true-false, multiple-choice, scenario, bug-fix]}
      - {id: exceptions-redefinition, title: "Exceptions et redéfinition de méthodes", level: intermediate, priority: 2, requires: [throw-throws, redefinition]}
      - {id: exceptions-performance, title: "Coût des exceptions et stack trace", level: expert, priority: 3, requires: [exceptions-principe]}
      - {id: errors-courantes, title: "Les Error courantes : OutOfMemoryError, StackOverflowError, NoClassDefFoundError", level: intermediate, priority: 2, requires: [hierarchie-throwable]}
      - {id: exceptions-lambdas, title: "Exceptions vérifiées dans les lambdas", level: expert, priority: 2, requires: [checked-unchecked, lambdas-syntaxe]}
