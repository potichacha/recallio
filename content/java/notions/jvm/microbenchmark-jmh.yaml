notion: microbenchmark-jmh
cards:
  - key: utiliser-jmh
    format: course
    question: Pourquoi utiliser JMH ?
    answer: 'Pour neutraliser les pièges des micro-benchmarks : chauffe, élimination de code mort, OSR, variance entre JVM.'
  - key: collegue-ecrit-benchmark-montrant-methode-50
    format: scenario
    question: Un collègue a écrit un benchmark montrant qu'une méthode est 50 fois plus rapide après sa modification.
    answer: |-
      Je serais prudent : un gain de ce facteur sur une micro-optimisation est souvent un artefact. Le JIT a pu éliminer le code dont le résultat n'est jamais utilisé, la mesure a pu inclure la compilation, ou les deux versions ont tourné dans la même JVM avec des profils différents.
      Je referais la mesure avec **JMH** : plusieurs forks, des itérations de chauffe, un `Blackhole` pour consommer les résultats. Et surtout, je vérifierais que cette méthode compte dans le temps de réponse réel : un gain de 50 fois sur 0,1 % du temps total ne change rien pour l'utilisateur.
  - key: definition-jmh
    format: definition
    question: JMH
    answer: Java Microbenchmark Harness
