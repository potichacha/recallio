notion: metaspace
lesson: |-
  Le **Metaspace** (Java 8) stocke les **métadonnées des classes** : leur structure, leurs méthodes, leur bytecode, leur
  *constant pool*. Il est en **mémoire native**, hors du tas.

  Il remplace la **PermGen** (*permanent generation*) des versions précédentes, une zone de taille **fixe** dans le tas
  qui causait souvent `OutOfMemoryError: PermGen space` (beaucoup de classes, redéploiements à chaud).

  - Le Metaspace **grandit à la demande**, sans limite par défaut (seule la mémoire du système le borne) ;
    `-XX:MaxMetaspaceSize` fixe un plafond.
  - Les métadonnées d'une classe sont libérées quand son **chargeur de classes** est récupéré par le GC (jamais classe par
    classe).
  - Les **chaînes internées** et les **champs statiques** ne sont pas dans le Metaspace : ils sont dans le tas.
  - Ce qui le fait grossir : beaucoup de classes (grandes applications), la **génération de classes** à l'exécution
    (proxys, bibliothèques de bytecode, lambdas, scripts), et surtout les **fuites de chargeurs de classes** lors des
    redéploiements à chaud.
  - Le surveiller : `jcmd <pid> VM.metaspace`, `jstat -gcmetacapacity`, les métriques Micrometer (`jvm.memory.used` avec
    l'aire `nonheap`), Native Memory Tracking.
  - En conteneur, il compte dans la mémoire du processus : un Metaspace qui grossit peut faire tuer le conteneur
    (OOMKilled) sans erreur Java.

  **Piège classique** : un service qui génère une nouvelle classe proxy à chaque requête (par exemple en recréant un
  client dynamique). Le Metaspace grossit sans fin jusqu'à `OutOfMemoryError: Metaspace`.

  **En entretien** : « Les métadonnées des classes, en mémoire native depuis Java 8 à la place de la PermGen ; illimité par
  défaut, libéré avec les chargeurs de classes ; il grossit avec les classes générées et les fuites de chargeurs. »
cards:
  - key: metaspace
    format: course
    question: "Qu'est-ce que le Metaspace ?"
    choices:
      - {text: "La zone native des métadonnées de classes, qui remplace la PermGen depuis Java 8", correct: true}
      - {text: "La zone du tas où sont rangés les objets qui survivent longtemps", correct: false}
      - {text: "L'espace disque où la JVM range le code compilé par le JIT", correct: false}
      - {text: "La zone mémoire où chaque thread range sa pile d'appels", correct: false}
    answer: La zone native des métadonnées de classes (remplace PermGen depuis Java 8).
  - key: liberation
    format: course
    question: "Quand les métadonnées d'une classe sont-elles libérées du Metaspace ?"
    choices:
      - {text: "Quand le chargeur qui a chargé la classe devient inaccessible et est récupéré par le GC", correct: true}
      - {text: "Dès qu'il n'existe plus aucune instance de la classe dans le tas", correct: false}
      - {text: "Jamais : une classe chargée reste en Metaspace jusqu'à l'arrêt de la JVM", correct: false}
      - {text: "Toutes les heures, quand la JVM fait le ménage dans le Metaspace", correct: false}
    answer: "Quand le chargeur de classes qui l'a chargée devient inaccessible et est récupéré par le GC, avec toutes les classes qu'il a chargées. L'absence d'instances ne suffit pas."
  - key: croissance
    format: course
    question: "Qu'est-ce qui fait grossir le Metaspace ?"
    choices:
      - {text: "Beaucoup de classes, des classes générées à l'exécution, et des fuites de chargeurs", correct: true}
      - {text: "Beaucoup d'objets créés avec `new`, comme les entités chargées depuis la base", correct: false}
      - {text: "Des chaînes internées en grand nombre, rangées avec les classes", correct: false}
      - {text: "Des threads nombreux, dont les piles sont rangées en Metaspace", correct: false}
    answer: "Un grand nombre de classes, la génération de classes à l'exécution (proxys, bytecode), et les fuites de chargeurs lors des redéploiements à chaud. Les objets et les chaînes internées vivent dans le tas."
  - key: limite
    format: course
    question: "Le Metaspace a-t-il une taille maximale par défaut ?"
    choices:
      - {text: "Non : il grandit tant que la mémoire native le permet, sauf `-XX:MaxMetaspaceSize`", correct: true}
      - {text: "Oui : 64 Mo, comme l'ancienne PermGen, quelle que soit la machine", correct: false}
      - {text: "Oui : un quart du tas, réglé par `-Xmx`", correct: false}
      - {text: "Non, et aucune option ne permet de le plafonner", correct: false}
    answer: Non, il grandit tant que la mémoire native le permet ; `-XX:MaxMetaspaceSize` fixe un plafond.
  - key: vf-tas
    format: true-false
    question: Le Metaspace fait partie du tas Java.
    truth: false
    answer: Il est en mémoire native.
  - key: vf-permgen
    format: true-false
    question: La PermGen existe toujours dans Java 21.
    truth: false
    answer: Elle a été supprimée en Java 8.
  - key: vf-statiques
    format: true-false
    question: Les valeurs des champs statiques sont stockées dans le Metaspace.
    truth: false
    answer: Elles sont dans le tas (avec l'objet `Class`) ; le Metaspace garde les métadonnées.
  - key: vf-conteneur
    format: true-false
    question: Un Metaspace qui grossit peut faire tuer un conteneur sans `OutOfMemoryError` Java.
    truth: true
    answer: Il s'ajoute à la mémoire du processus, au-delà de `-Xmx`.
  - key: qcm-contenu
    format: multiple-choice
    question: "Que contient le Metaspace ?"
    choices:
      - {text: "Les métadonnées des classes (structure, méthodes, bytecode)", correct: true}
      - {text: "Les objets créés avec `new`, rangés par classe", correct: false}
      - {text: "Les chaînes internées, partagées par toutes les classes", correct: false}
      - {text: "Les piles des threads, une par thread en cours", correct: false}
    answer: "Les métadonnées des classes, constant pool compris. Les objets et les chaînes internées sont dans le tas, et chaque thread a sa pile à part."
  - key: qcm-surveiller
    format: multiple-choice
    question: "Quelle commande observe le Metaspace d'une JVM en cours ?"
    choices:
      - {text: "`jcmd <pid> VM.metaspace`", correct: true}
      - {text: "`jcmd <pid> Thread.print`", correct: false}
      - {text: "`jstack <pid>`", correct: false}
      - {text: "`javap -c`", correct: false}
    answer: "`jcmd <pid> VM.metaspace` détaille le Metaspace (les métriques `jvm.memory.used` non-heap le suivent aussi). `jstack` et `Thread.print` donnent les threads, `javap` le bytecode."
  - key: qcm-cause
    format: multiple-choice
    question: "`OutOfMemoryError: Metaspace` survient après plusieurs redéploiements à chaud. Que suspecter ?"
    choices:
      - text: "Une fuite de chargeur de classes"
        correct: true
      - text: "Un tas trop petit"
        correct: false
      - text: "Une pile trop petite"
        correct: false
      - text: "Trop de requêtes HTTP"
        correct: false
    answer: Les classes des anciennes versions restent chargées.
  - key: qcm-plafond
    format: multiple-choice
    question: Pourquoi fixer `-XX:MaxMetaspaceSize` dans un conteneur ?
    choices:
      - {text: "Pour qu'une croissance anormale lève une erreur Java diagnostiquable plutôt qu'un OOMKilled", correct: true}
      - {text: "Pour accélérer le JIT, qui compile plus vite quand le Metaspace est borné", correct: false}
      - {text: "Pour augmenter le tas d'autant, la JVM y reportant la mémoire non utilisée", correct: false}
      - {text: "Parce que la JVM refuse de démarrer dans un conteneur sans cette option", correct: false}
    answer: Une erreur Java laisse des traces (et un heap dump) ; un OOMKilled, non.
