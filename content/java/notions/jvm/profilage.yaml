notion: profilage
cards:
  - key: lire-flame-graph
    format: course
    question: Comment lire un flame graph ?
    answer: La largeur d'une boîte représente le temps passé ; on cherche les plateaux larges.
  - key: cpu-bas-latence-haute-evoque
    format: course
    question: CPU bas et latence haute, ça évoque quoi ?
    answer: 'Une attente : verrou, I/O, pool de connexions épuisé.'
  - key: production-cpu-100-instance-trouves-cause
    format: scenario
    question: En production, le CPU est à 100 % sur une instance. Comment tu trouves la cause ?
    answer: |-
      D'abord savoir **qui** consomme : est-ce le code applicatif ou le GC ? `jstat -gcutil` ou les métriques GC le disent vite. Si le GC tourne en boucle, c'est un problème mémoire (heap trop petit, fuite) et je bascule sur le diagnostic mémoire.
      Si c'est l'application, je profile : **async-profiler** en mode CPU pendant 30 secondes produit un flame graph, ou un enregistrement **JFR** à faible surcoût. À défaut, plusieurs thread dumps à quelques secondes d'intervalle, croisés avec `top -H` pour identifier les threads les plus consommateurs (l'identifiant natif `nid` du dump en hexadécimal correspond au TID).
      Les coupables classiques : une boucle infinie, une regex au backtracking catastrophique, une sérialisation énorme, un algorithme quadratique sur des données qui ont grossi, des logs excessifs.
