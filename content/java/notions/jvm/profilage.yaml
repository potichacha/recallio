notion: profilage
lesson: |-
  **Profiler**, c'est mesurer **où** l'application passe son temps ou alloue sa mémoire, au lieu de le deviner. On
  optimise ensuite ce qui compte vraiment (souvent un ou deux points chauds).

  Les types de profils :
  - **CPU** : quelles méthodes consomment le processeur ;
  - **allocations** : quel code crée le plus d'objets (et fait travailler le GC) ;
  - **temps réel** (*wall-clock*) : où les threads passent leur temps, **attentes comprises** (entrées-sorties, verrous) ;
  - **verrous** : quels moniteurs sont disputés.

  Les outils :
  - **async-profiler** : un profileur par échantillonnage très précis et peu coûteux, qui produit des **flame graphs** ;
  - **JFR** + JMC : intégré au JDK, utilisable en production ;
  - les profileurs des IDE (IntelliJ), VisualVM, YourKit.

  ```
  asprof -d 30 -e cpu -f profil-cpu.html <pid>      # CPU pendant 30 s
  asprof -d 30 -e alloc -f profil-alloc.html <pid>  # allocations
  asprof -d 30 -e wall -f profil-wall.html <pid>    # temps réel, attentes comprises
  ```

  Lire un **flame graph** : chaque boîte est une méthode, la **largeur** est la part du temps (les échantillons) où elle
  était sur la pile, les appelants sont dessous et les appelés dessus. On cherche les **plateaux larges** au sommet :
  c'est là que le temps est réellement passé.

  Bonnes pratiques :
  - profiler sous une **charge représentative**, après la **chauffe** ;
  - un profileur par **échantillonnage** perturbe peu ; l'**instrumentation** (mesurer chaque appel) fausse les
    résultats ;
  - CPU **bas** et latence **haute** : le temps est en **attente** (base, réseau, verrou, pool épuisé) ; c'est un profil
    *wall-clock* ou des traces distribuées qu'il faut, pas un profil CPU ;
  - après une optimisation, **reprofiler** pour vérifier le gain.

  **Piège classique** : optimiser à l'intuition une boucle qui semble lente, alors que 80 % du temps est passé dans une
  requête SQL appelée en boucle (le problème N+1). Seul un profil le montre.

  **En entretien** : « Je profile avant d'optimiser : async-profiler ou JFR, sous charge réelle ; je lis le flame graph par
  ses plateaux larges, et si le CPU est bas, je cherche les attentes avec un profil wall-clock. »
cards:
  - key: lire-flame-graph
    format: course
    question: Comment lire un flame graph ?
    answer: La largeur d'une boîte représente le temps passé ; on cherche les plateaux larges.
  - key: cpu-bas-latence-haute-evoque
    format: course
    question: CPU bas et latence haute, ça évoque quoi ?
    answer: 'Une attente : verrou, I/O, pool de connexions épuisé.'
  - key: types
    format: course
    question: Quels types de profils peut-on faire ?
    answer: CPU (ce qui consomme le processeur), allocations (ce qui crée des objets), temps réel ou wall-clock (attentes comprises), et verrous (ce qui est disputé).
  - key: echantillonnage
    format: course
    question: Pourquoi préférer un profileur par échantillonnage à l'instrumentation ?
    answer: L'échantillonnage relève périodiquement les piles avec un surcoût faible, sans changer le comportement du code ; l'instrumentation mesure chaque appel et fausse le profil (surtout pour les petites méthodes).
  - key: vf-largeur
    format: true-false
    question: Dans un flame graph, la largeur d'une boîte représente la part du temps où la méthode était sur la pile.
    truth: true
    answer: La hauteur représente la profondeur de la pile, pas le temps.
  - key: vf-cpu-attentes
    format: true-false
    question: Un profil CPU montre le temps passé à attendre une réponse de la base de données.
    truth: false
    answer: Un thread qui attend ne consomme pas de CPU ; il faut un profil wall-clock ou des traces.
  - key: vf-chauffe
    format: true-false
    question: On profile de préférence après la phase de chauffe, sous une charge représentative.
    truth: true
    answer: Sinon on profile l'interpréteur et un scénario irréaliste.
  - key: vf-production
    format: true-false
    question: async-profiler et JFR peuvent être utilisés sur une instance de production.
    truth: true
    answer: Leur surcoût est faible.
  - key: qcm-outils
    format: multiple-choice
    question: Quels outils produisent des profils CPU ?
    choices:
      - text: "async-profiler"
        correct: true
      - text: "Java Flight Recorder"
        correct: true
      - text: "`javap`"
        correct: false
      - text: "`jar`"
        correct: false
    answer: Les profileurs des IDE aussi.
  - key: qcm-attente
    format: multiple-choice
    question: La latence est mauvaise mais le CPU est à 15 %. Quel profil utiliser ?
    choices:
      - text: "Un profil wall-clock (temps réel)"
        correct: true
      - text: "Des traces distribuées (OpenTelemetry)"
        correct: true
      - text: "Un profil CPU seul"
        correct: false
      - text: "Un heap dump"
        correct: false
    answer: Le temps est passé à attendre, pas à calculer.
  - key: qcm-plateau
    format: multiple-choice
    question: Dans un flame graph, où se trouve le code qui consomme réellement le temps ?
    choices:
      - text: "Dans les boîtes larges au sommet des piles (les plateaux)"
        correct: true
      - text: "Dans les boîtes les plus hautes, quelle que soit leur largeur"
        correct: false
      - text: "Toujours dans `main`"
        correct: false
      - text: "Dans les boîtes les plus étroites"
        correct: false
    answer: '`main` est large car il est en bas de toutes les piles, mais il ne fait qu''appeler.'
  - key: qcm-allocations
    format: multiple-choice
    question: Le GC consomme beaucoup. Quel profil aide ?
    choices:
      - text: "Un profil d'allocations"
        correct: true
      - text: "Un profil des verrous"
        correct: false
      - text: "Un profil réseau"
        correct: false
      - text: "Aucun"
        correct: false
    answer: Il montre quel code crée le plus d'objets.
  - key: production-cpu-100-instance-trouves-cause
    format: scenario
    question: En production, le CPU est à 100 % sur une instance. Comment tu trouves la cause ?
    answer: |-
      D'abord savoir **qui** consomme : est-ce le code applicatif ou le GC ? `jstat -gcutil` ou les métriques GC le disent vite. Si le GC tourne en boucle, c'est un problème mémoire (heap trop petit, fuite) et je bascule sur le diagnostic mémoire.
      Si c'est l'application, je profile : **async-profiler** en mode CPU pendant 30 secondes produit un flame graph, ou un enregistrement **JFR** à faible surcoût. À défaut, plusieurs thread dumps à quelques secondes d'intervalle, croisés avec `top -H` pour identifier les threads les plus consommateurs (l'identifiant natif `nid` du dump en hexadécimal correspond au TID).
      Les coupables classiques : une boucle infinie, une regex au backtracking catastrophique, une sérialisation énorme, un algorithme quadratique sur des données qui ont grossi, des logs excessifs.
  - key: scenario-endpoint-lent
    format: scenario
    question: Un endpoint met 2 secondes à répondre. Comment trouves-tu où passe le temps ?
    answer: |-
      Je commence par une trace distribuée (OpenTelemetry) de quelques requêtes lentes : elle découpe le temps entre le
      code, la base, les appels externes, et révèle souvent un N+1 (des dizaines de requêtes SQL) ou un appel lent. Si le
      temps est dans le code, un profil CPU (async-profiler, JFR) pendant un test de charge ciblé sur cet endpoint ; si
      le temps est en attente, un profil wall-clock. Je corrige le plus gros poste, puis je remesure.
  - key: scenario-regression
    format: scenario
    question: Après une mise à jour, le service consomme 30 % de CPU en plus pour la même charge. Comment trouves-tu la cause ?
    answer: |-
      Je compare deux profils CPU pris dans les mêmes conditions (même charge, après chauffe) sur l'ancienne et la
      nouvelle version : async-profiler sait produire des flame graphs différentiels, qui colorent ce qui a augmenté.
      Je regarde aussi les dépendances mises à jour (une bibliothèque de journalisation, de sérialisation), les options de
      JVM et le GC (une hausse des allocations se traduit par plus de GC). Une fois la méthode trouvée, je la reproduis
      dans un benchmark ou un test pour vérifier la correction.
  - key: scenario-optimisation-premature
    format: scenario
    question: Un développeur veut réécrire un module « pour les performances » sans mesure. Comment réagis-tu ?
    answer: |-
      Je propose d'abord de mesurer : un profil sous une charge réaliste montre où le temps est réellement passé, et
      souvent ce n'est pas là où on l'imagine (une requête SQL, une sérialisation, des journaux). Si le module apparaît
      parmi les points chauds, on fixe un objectif chiffré (latence, CPU), on optimise ce point précis, et on remesure.
      Sinon, la réécriture ajoute du risque et de la complexité sans gain perceptible pour les utilisateurs.
