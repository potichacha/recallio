notion: aot-graalvm
cards:
  - key: cds
    format: course
    question: C'est quoi CDS ?
    answer: 'Class Data Sharing : une archive de métadonnées de classes réutilisée pour accélérer le démarrage.'
  - key: apporte-projet-leyden
    format: course
    question: Qu'apporte le projet Leyden ?
    answer: Un cache AOT des classes chargées, liées et des profils, produit par une exécution d'entraînement (Java 24 à 26).
  - key: hypothese-monde-ferme-graalvm
    format: course
    question: C'est quoi l'hypothèse du monde fermé de GraalVM ?
    answer: Tout le code atteignable est connu au build ; la réflexion et le chargement dynamique doivent être déclarés.
  - key: inconvenients-natif-graalvm
    format: course
    question: Inconvénients du natif GraalVM ?
    answer: Build long, configuration de la réflexion, pas de JIT donc performances de pointe moindres, compatibilité des bibliothèques.
  - key: crac
    format: course
    question: C'est quoi CRaC ?
    answer: Checkpoint/restore d'une JVM chaude pour redémarrer en millisecondes.
  - key: demarrage-service-prend-25-secondes-penalise
    format: scenario
    question: Le démarrage de ton service prend 25 secondes, ce qui pénalise l'autoscaling.
    answer: |-
      Je mesurerais d'abord où passe le temps : chargement des classes, initialisation des beans, connexions aux dépendances, migrations de base au démarrage. Spring Boot fournit un suivi du démarrage (`ApplicationStartup` / l'endpoint startup d'Actuator).
      Ensuite plusieurs leviers, du moins au plus structurant : supprimer les initialisations inutiles ou les rendre paresseuses, sortir les migrations de schéma du démarrage applicatif, activer **CDS ou le cache AOT** du JDK (gain important sans changer le code), utiliser **CRaC** si l'environnement le permet, et enfin la compilation **native** (Spring AOT + GraalVM, ou Quarkus) qui ramène le démarrage à moins d'une seconde mais demande un travail de compatibilité.
      Je n'oublierais pas la readiness probe : même rapide, le pod ne doit recevoir du trafic qu'une fois prêt.
  - key: definition-aot
    format: definition
    question: AOT
    answer: 'Ahead-Of-Time : compilation ou préparation avant l''exécution (GraalVM natif, Spring AOT, cache Leyden)'
  - key: definition-cds
    format: definition
    question: CDS
    answer: 'Class Data Sharing : archive de classes pour accélérer le démarrage de la JVM'
  - key: definition-crac
    format: definition
    question: CRaC
    answer: 'Coordinated Restore at Checkpoint : instantané et restauration d''une JVM chaude'
