notion: outils-jdk-diagnostic
lesson: |-
  Le JDK fournit des outils de diagnostic en ligne de commande, qui s'attachent à une JVM en cours :

  | Outil | Pour |
  |---|---|
  | **`jcmd`** | le couteau suisse : `jcmd` liste les JVM, `jcmd <pid> help` les commandes |
  | `jps` | lister les JVM locales et leurs identifiants |
  | `jstack <pid>` | un thread dump |
  | `jmap` | histogramme du tas, heap dump |
  | `jstat -gcutil <pid> 1s` | l'occupation des zones mémoire et l'activité du GC, en continu |
  | `jinfo` | les options et propriétés d'une JVM |

  Les commandes `jcmd` les plus utiles :

  ```
  jcmd <pid> Thread.print                       # thread dump
  jcmd <pid> GC.heap_dump /tmp/dump.hprof       # heap dump
  jcmd <pid> GC.class_histogram                 # nombre d'instances et taille par classe
  jcmd <pid> VM.flags                           # options effectives
  jcmd <pid> VM.native_memory summary           # mémoire native (avec -XX:NativeMemoryTracking=summary)
  jcmd <pid> JFR.start duration=60s filename=rec.jfr
  jcmd <pid> VM.metaspace
  jcmd <pid> Thread.dump_to_file -format=json f.json   # inclut les threads virtuels
  ```

  - `-XX:+PrintFlagsFinal` affiche toutes les options effectives au démarrage ; `jcmd VM.flags` sur une JVM en cours.
  - Ces outils doivent tourner avec le **même utilisateur** que la JVM, et sur la même machine (ou dans le même
    conteneur : `kubectl exec`). Une image de conteneur minimale (JRE seul) ne les contient pas toujours : prévoir un JDK
    ou un conteneur de débogage.
  - Un **heap dump** fige la JVM pendant son écriture et peut peser autant que le tas : prudence en production.
  - Pour la supervision continue, on expose les métriques JVM (Micrometer, JMX) plutôt que de lancer ces outils à la
    main.

  **Piège classique** : chercher `jstack` dans une image de production basée sur un JRE minimal. L'outil est absent au
  moment de l'incident ; on prévoit l'outillage (JDK, `jcmd`, ou un conteneur éphémère de débogage) à l'avance.

  **En entretien** : « `jcmd` couvre presque tout : thread dump, heap dump, histogramme, options, mémoire native, JFR ;
  `jstat` pour suivre le GC en direct. »
cards:
  - key: mesurer-memoire-native
    format: course
    question: "Comment mesurer la mémoire native d'une JVM ?"
    choices:
      - {text: "Avec Native Memory Tracking (`-XX:NativeMemoryTracking=summary`) et `jcmd VM.native_memory`", correct: true}
      - {text: "Avec un heap dump, qui contient aussi toute la mémoire native de la JVM", correct: false}
      - {text: "Avec `jstack`, qui liste les zones mémoire de chaque thread", correct: false}
      - {text: "Avec `-verbose:gc`, qui trace la mémoire native à chaque collecte", correct: false}
    answer: Native Memory Tracking (-XX:NativeMemoryTracking=summary) et jcmd VM.native_memory.
  - key: outil-thread-dump-heap-dump
    format: course
    question: "Quels outils produisent un thread dump, et un heap dump ?"
    choices:
      - {text: "`jcmd Thread.print` ou `jstack` ; `jcmd GC.heap_dump` ou `jmap`", correct: true}
      - {text: "`jcmd GC.heap_dump` ou `jmap` ; `jcmd Thread.print` ou `jstack`", correct: false}
      - {text: "`jstat` pour les deux, avec des options différentes", correct: false}
      - {text: "`javap` ou `jdeps` ; `jar` ou `jlink`", correct: false}
    answer: jcmd Thread.print ou jstack ; jcmd GC.heap_dump ou jmap.
  - key: affiche-xx-printflagsfinal
    format: course
    question: "Qu'affiche l'option `-XX:+PrintFlagsFinal` ?"
    choices:
      - {text: "Toutes les valeurs effectives des options de la JVM", correct: true}
      - {text: "Seulement les options passées sur la ligne de commande", correct: false}
      - {text: "Le bilan final du GC, à l'arrêt de la JVM", correct: false}
      - {text: "Les champs `final` de toutes les classes chargées", correct: false}
    answer: Toutes les valeurs effectives des flags de la JVM.
  - key: jstat
    format: course
    question: "À quoi sert `jstat -gcutil <pid> 1s` ?"
    choices:
      - {text: "À suivre chaque seconde l'occupation des zones mémoire, et le nombre et le temps des GC", correct: true}
      - {text: "À prendre un heap dump chaque seconde, pour le comparer au précédent", correct: false}
      - {text: "À lister chaque seconde les threads, et ce qu'ils exécutent", correct: false}
      - {text: "À mesurer chaque seconde l'usage CPU de chaque méthode", correct: false}
    answer: À suivre chaque seconde l'occupation des zones mémoire (Eden, Survivor, Old, Metaspace) et le nombre et le temps des GC.
  - key: histogramme
    format: course
    question: "Qu'apporte `jcmd <pid> GC.class_histogram` par rapport à un heap dump ?"
    choices:
      - {text: "Le nombre d'instances et la taille par classe, instantanément, sans fichier énorme", correct: true}
      - {text: "Le contenu de chaque objet, avec tous ses champs et leurs valeurs", correct: false}
      - {text: "Le chemin de chaque objet vers les racines du GC", correct: false}
      - {text: "Les piles d'appels qui ont alloué chaque objet du tas", correct: false}
    answer: "Le nombre d'instances et la taille occupée par classe, instantanément et sans fichier énorme ; comparer deux histogrammes montre ce qui grossit. Le contenu et le chemin vers les racines demandent un heap dump."
  - key: vf-utilisateur
    format: true-false
    question: Les outils comme `jcmd` doivent être lancés avec le même utilisateur que la JVM ciblée.
    truth: true
    answer: Ils s'attachent au processus par un mécanisme local.
  - key: vf-heap-dump-gratuit
    format: true-false
    question: Un heap dump n'a aucun impact sur une JVM de production.
    truth: false
    answer: Il fige la JVM pendant l'écriture et produit un fichier de la taille du tas.
  - key: vf-jre
    format: true-false
    question: Une image de conteneur construite sur un runtime minimal contient toujours `jstack` et `jcmd`.
    truth: false
    answer: Un runtime réduit (jlink, JRE) peut ne pas les inclure.
  - key: vf-jcmd-liste
    format: true-false
    question: "`jcmd` sans argument liste les JVM locales."
    truth: true
    answer: Comme `jps`.
  - key: qcm-commandes
    format: multiple-choice
    question: "Quelle association entre une commande et son usage est la bonne ?"
    choices:
      - {text: "`jcmd <pid> Thread.print` : un thread dump", correct: true}
      - {text: "`jcmd <pid> GC.heap_dump` : les statistiques réseau", correct: false}
      - {text: "`jcmd <pid> VM.flags` : la liste des threads", correct: false}
      - {text: "`jstat -gcutil` : le bytecode des classes", correct: false}
    answer: "`Thread.print` donne un thread dump, `VM.flags` les options effectives, `GC.heap_dump` écrit le contenu du tas, et `jstat -gcutil` suit les zones mémoire et le GC."
  - key: qcm-natif
    format: multiple-choice
    question: Que faut-il pour voir la mémoire native par catégorie ?
    choices:
      - {text: "Lancer la JVM avec `-XX:NativeMemoryTracking=summary`, puis `jcmd <pid> VM.native_memory summary`", correct: true}
      - {text: "Un heap dump ouvert dans Eclipse MAT, qui montre aussi la mémoire native par catégorie", correct: false}
      - {text: "`jstack <pid>`, qui affiche la mémoire réservée par chaque thread et par catégorie", correct: false}
      - {text: "`-verbose:gc` au démarrage, qui trace la mémoire native à chaque collecte du GC", correct: false}
    answer: NMT doit être activé au démarrage.
  - key: qcm-virtuels
    format: multiple-choice
    question: Comment obtenir un dump qui inclut les threads virtuels ?
    choices:
      - {text: "`jcmd <pid> Thread.dump_to_file -format=json fichier.json`", correct: true}
      - {text: "`jstack <pid>`, qui liste tous les threads de la JVM", correct: false}
      - {text: "`jmap -histo <pid>`, qui compte les objets `Thread`", correct: false}
      - {text: "`jps -v`, qui affiche les threads de chaque JVM", correct: false}
    answer: '`jstack` ne montre que les threads de plateforme.'
  - key: qcm-conteneur
    format: multiple-choice
    question: "Comment utiliser `jcmd` sur une JVM qui tourne dans un pod Kubernetes ?"
    choices:
      - {text: "Avec `kubectl exec` dans le conteneur, si l'image contient `jcmd`", correct: true}
      - {text: "Depuis son poste, sans aucun accès au pod", correct: false}
      - {text: "Par l'API HTTP de Kubernetes, qui relaie `jcmd`", correct: false}
      - {text: "Ce n'est jamais possible dans un conteneur", correct: false}
    answer: "L'outil doit voir le processus de la JVM : `kubectl exec` dans le conteneur, ou un conteneur éphémère de débogage qui partage l'espace de processus."
  - key: scenario-incident
    format: scenario
    question: "Un service répond lentement en production. Quelles commandes lances-tu en premier, et pourquoi ?"
    choices:
      - {text: "Plusieurs thread dumps, `jstat -gcutil` une minute et un JFR court, sans perturber le service", correct: true}
      - {text: "Un heap dump d'abord, même s'il fige la JVM plusieurs minutes en pleine production", correct: false}
      - {text: "Un redémarrage immédiat, puis l'analyse des journaux si le problème revient", correct: false}
      - {text: "`jcmd VM.flags` seulement, une lenteur venant toujours d'une option mal réglée", correct: false}
    answer: |-
      Je prends d'abord des données sans perturber : `jcmd <pid> Thread.print` deux ou trois fois à quelques secondes
      d'intervalle (que font les threads, sont-ils bloqués ?), `jstat -gcutil <pid> 1s` pendant une minute (le GC
      tourne-t-il en boucle, la vieille génération est-elle pleine ?), et `jcmd <pid> JFR.start duration=60s` pour un
      enregistrement complet à faible coût. Selon ce que je vois : histogramme des classes ou heap dump pour la mémoire,
      profilage CPU si le processeur est saturé. Je note les heures pour corréler avec les métriques et les journaux.
  - key: scenario-preparer
    format: scenario
    question: "Comment prépares-tu une application pour qu'elle soit diagnosticable en production ?"
    choices:
      - {text: "Heap dump sur OOM, journaux GC en rotation, JFR continu, `jcmd` dans l'image, métriques JVM", correct: true}
      - {text: "Aucune option au démarrage : on activera tout à chaud le jour d'un incident", correct: false}
      - {text: "Un heap dump toutes les heures, conservé sur le disque du conteneur", correct: false}
      - {text: "Le mode débogage de la JVM en permanence, pour s'y attacher à tout moment", correct: false}
    answer: |-
      Des options au démarrage : `-XX:+HeapDumpOnOutOfMemoryError` avec un dossier qui a la place, des journaux GC en
      rotation (`-Xlog:gc*`), éventuellement `-XX:NativeMemoryTracking=summary` et un enregistrement JFR continu. Une image
      qui contient `jcmd` (ou une procédure de conteneur de débogage), des métriques JVM exposées (Micrometer :
      mémoire, GC, threads), des threads nommés, et une procédure écrite pour récupérer un dump d'un pod avant qu'il soit
      redémarré.
  - key: scenario-quel-outil
    format: scenario
    question: "Le CPU d'une instance est à 100 %. Comment trouves-tu rapidement le thread coupable avec les outils du JDK ?"
    choices:
      - {text: "`top -H` pour l'identifiant du thread, puis son `nid` en hexadécimal dans un thread dump", correct: true}
      - {text: "Un heap dump, qui montre quel thread a alloué le plus d'objets depuis le démarrage", correct: false}
      - {text: "`jstat -gcutil`, qui donne la consommation CPU de chaque thread de la JVM", correct: false}
      - {text: "`jcmd VM.flags`, qui indique le thread le plus actif de la JVM", correct: false}
    answer: |-
      Je liste les threads les plus gourmands du processus avec `top -H -p <pid>` et je note leurs identifiants système. Je
      prends un thread dump (`jcmd <pid> Thread.print`) : chaque thread y porte un `nid` en hexadécimal, qui correspond à
      cet identifiant. Je convertis, je retrouve les threads, et leur pile montre ce qu'ils exécutent. Je répète deux ou
      trois fois pour confirmer. Si ce sont les threads du GC, je bascule sur le diagnostic mémoire ; pour une analyse
      plus fine, async-profiler ou JFR donnent un profil CPU complet.
  - key: scenario-flags
    format: scenario
    question: "Une instance se comporte différemment des autres. Comment vérifies-tu sa configuration réelle de JVM ?"
    choices:
      - {text: "`jcmd <pid> VM.flags` et `VM.command_line`, comparés à une instance saine, sans oublier `JAVA_TOOL_OPTIONS`", correct: true}
      - {text: "Je relis le Dockerfile : la ligne de commande qu'il contient est forcément celle qui tourne", correct: false}
      - {text: "Je prends un heap dump, qui contient toutes les options de lancement de la JVM", correct: false}
      - {text: "Je redémarre l'instance : elle reprendra la même configuration que les autres", correct: false}
    answer: |-
      Avec `jcmd <pid> VM.flags` (les options non par défaut effectives) et `jcmd <pid> VM.command_line` (la ligne de
      lancement), voire `-XX:+PrintFlagsFinal` pour tout voir. Je compare avec une instance saine : taille du tas, GC
      choisi (une machine plus petite peut changer le GC par défaut), version du JDK (`jcmd <pid> VM.version`), variables
      comme `JAVA_TOOL_OPTIONS` qui ajoutent des options sans qu'on le voie dans la commande. `jcmd <pid> VM.system_properties`
      complète avec les propriétés système.
  - key: definition-nmt
    format: definition
    question: "Que désigne le sigle NMT ?"
    choices:
      - {text: "Native Memory Tracking : le suivi de la mémoire native de la JVM", correct: true}
      - {text: "New Memory Thread : le thread qui alloue les nouveaux objets", correct: false}
      - {text: "Non-heap Metaspace Table : la table des classes en Metaspace", correct: false}
      - {text: "Network Monitoring Tool : l'outil de suivi réseau du JDK", correct: false}
    answer: 'Native Memory Tracking : suivi de la mémoire native de la JVM'
  - key: definition-jcmd
    format: definition
    question: "Qu'est-ce que `jcmd` ?"
    choices:
      - {text: "L'outil du JDK qui envoie des commandes de diagnostic à une JVM en cours", correct: true}
      - {text: "Le lanceur de la JVM, qui remplace la commande `java` depuis Java 9", correct: false}
      - {text: "L'outil qui compile une classe Java depuis la ligne de commande", correct: false}
      - {text: "Une console qui exécute du code Java ligne par ligne", correct: false}
    answer: "L'outil du JDK qui envoie des commandes de diagnostic à une JVM en cours (thread dump, heap dump, options, JFR). La console ligne par ligne, c'est `jshell`."
  - key: definition-jstat
    format: definition
    question: "Qu'est-ce que `jstat` ?"
    choices:
      - {text: "Un outil qui affiche en continu les statistiques des zones mémoire et du GC", correct: true}
      - {text: "Un outil qui calcule des statistiques sur le code source d'un projet", correct: false}
      - {text: "Un outil qui produit un heap dump à intervalle régulier", correct: false}
      - {text: "Un outil qui liste les threads de la JVM et leur état", correct: false}
    answer: Un outil qui affiche en continu les statistiques des zones mémoire et du GC d'une JVM.
  - key: definition-histogramme
    format: definition
    question: "Qu'est-ce qu'un histogramme de classes ?"
    choices:
      - {text: "Par classe, le nombre d'instances dans le tas et la mémoire qu'elles occupent", correct: true}
      - {text: "Par classe, le nombre d'appels de ses méthodes depuis le démarrage", correct: false}
      - {text: "Par classe, le temps passé à la charger et à l'initialiser", correct: false}
      - {text: "Par classe, le nombre de lignes de code et de méthodes", correct: false}
    answer: La liste, par classe, du nombre d'instances présentes dans le tas et de la mémoire qu'elles occupent.
