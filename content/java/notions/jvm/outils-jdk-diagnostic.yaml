notion: outils-jdk-diagnostic
cards:
  - key: mesurer-memoire-native
    format: course
    question: Comment mesurer la mémoire native ?
    answer: Native Memory Tracking (-XX:NativeMemoryTracking=summary) et jcmd VM.native_memory.
  - key: outil-thread-dump-heap-dump
    format: course
    question: Quel outil pour un thread dump ? Un heap dump ?
    answer: jcmd Thread.print ou jstack ; jcmd GC.heap_dump ou jmap.
  - key: affiche-xx-printflagsfinal
    format: course
    question: Qu'affiche -XX:+PrintFlagsFinal ?
    answer: Toutes les valeurs effectives des flags de la JVM.
  - key: definition-nmt
    format: definition
    question: NMT
    answer: 'Native Memory Tracking : suivi de la mémoire native de la JVM'
