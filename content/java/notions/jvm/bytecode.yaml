notion: bytecode
cards:
  - key: sert-invokedynamic
    format: course
    question: À quoi sert invokedynamic ?
    answer: À lier un appel à l'exécution ; utilisé pour les lambdas, la concaténation de String, les records.
  - key: lire-bytecode-classe
    format: course
    question: Comment lire le bytecode d'une classe ?
    answer: '`javap -c -v`.'
  - key: java-agent
    format: course
    question: C'est quoi un java agent ?
    answer: Un jar chargé avec -javaagent qui peut transformer le bytecode au chargement (APM, OpenTelemetry).
