notion: bytecode
lesson: |-
  `javac` compile le code Java en **bytecode** : des instructions d'une machine virtuelle **à pile**. Chaque méthode a sa
  **pile d'opérandes** et son tableau de **variables locales**.

  ```java
  int somme(int a, int b) { return a + b; }
  ```
  ```
  $ javap -c Calcul.class
    int somme(int, int);
      Code:
         0: iload_1        // empile la variable locale 1 (a)
         1: iload_2        // empile la variable locale 2 (b)
         2: iadd           // dépile deux int, empile leur somme
         3: ireturn        // renvoie le sommet de la pile
  ```

  Familles d'instructions :
  - charger et stocker : `iload`, `aload`, `istore`, `astore` (le préfixe donne le type : `i` int, `a` référence) ;
  - calculer : `iadd`, `imul`, `dcmpl` ;
  - créer : `new`, `newarray` ;
  - sauter : `if_icmpge`, `goto` ;
  - appeler : `invokestatic`, `invokevirtual` (méthode d'instance), `invokeinterface`, `invokespecial`
    (constructeurs, `super`, privées), **`invokedynamic`** (lié à l'exécution : lambdas, concaténation de chaînes
    depuis Java 9, `toString`/`equals` des records).

  - **`javap -c -v`** affiche le bytecode, le *constant pool* et les métadonnées ; utile pour comprendre ce que le
    compilateur a produit (autoboxing, concaténation, classes internes).
  - Le **vérificateur** contrôle le bytecode au chargement (types, pile cohérente) : un `.class` corrompu ou malveillant
    est rejeté.
  - Des bibliothèques **manipulent** le bytecode : ASM, ByteBuddy (utilisée par Mockito, Hibernate), et l'**API
    Class-File** du JDK (définitive en Java 24). Les **agents Java** (`-javaagent`) transforment les classes au
    chargement : APM, OpenTelemetry, couverture de code.
  - La version du format de classe (65 pour Java 21, 69 pour Java 25) explique l'erreur `UnsupportedClassVersionError`
    quand une classe compilée pour une version plus récente tourne sur une JVM plus ancienne.

  **Piège classique** : lancer sur Java 17 un JAR compilé pour Java 21. La JVM refuse avec
  `UnsupportedClassVersionError (class file version 65.0)` ; on compile avec `--release 17`.

  **En entretien** : « Un jeu d'instructions à pile, lisible avec `javap -c` ; cinq instructions d'appel dont
  `invokedynamic` pour les lambdas ; et des outils comme ByteBuddy ou les agents qui le transforment. »
cards:
  - key: sert-invokedynamic
    format: course
    question: À quoi sert invokedynamic ?
    answer: À lier un appel à l'exécution ; utilisé pour les lambdas, la concaténation de String, les records.
  - key: lire-bytecode-classe
    format: course
    question: Comment lire le bytecode d'une classe ?
    answer: '`javap -c -v`.'
  - key: java-agent
    format: course
    question: C'est quoi un java agent ?
    answer: Un jar chargé avec -javaagent qui peut transformer le bytecode au chargement (APM, OpenTelemetry).
  - key: machine-pile
    format: course
    question: Que signifie « la JVM est une machine à pile » ?
    answer: Les instructions prennent leurs opérandes sur une pile d'opérandes et y déposent leur résultat (`iload_1`, `iload_2`, `iadd`), au lieu d'utiliser des registres nommés.
  - key: version-classe
    format: course
    question: Que signifie `UnsupportedClassVersionError` ?
    answer: La classe a été compilée pour une version de Java plus récente que la JVM qui l'exécute ; on compile avec `--release` de la version cible.
  - key: vf-verificateur
    format: true-false
    question: La JVM vérifie le bytecode au chargement d'une classe.
    truth: true
    answer: Le vérificateur rejette un bytecode incohérent.
  - key: vf-invokevirtual
    format: true-false
    question: "`invokevirtual` sert à appeler une méthode d'instance avec liaison dynamique."
    truth: true
    answer: La méthode est choisie selon le type réel de l'objet.
  - key: vf-concat
    format: true-false
    question: Depuis Java 9, la concaténation de chaînes est compilée en appels `StringBuilder.append`.
    truth: false
    answer: Elle utilise `invokedynamic` et `StringConcatFactory`.
  - key: vf-agent
    format: true-false
    question: Un agent Java peut modifier les classes au moment de leur chargement.
    truth: true
    answer: Grâce à l'API `java.lang.instrument`.
  - key: qcm-appels
    format: multiple-choice
    question: Quelles instructions d'appel existent dans le bytecode ?
    choices:
      - text: "`invokestatic`"
        correct: true
      - text: "`invokedynamic`"
        correct: true
      - text: "`invokelambda`"
        correct: false
      - text: "`invokerecord`"
        correct: false
    answer: Il y a aussi `invokevirtual`, `invokeinterface` et `invokespecial`.
  - key: qcm-outils
    format: multiple-choice
    question: Quels outils manipulent le bytecode ?
    choices:
      - text: "ByteBuddy"
        correct: true
      - text: "ASM"
        correct: true
      - text: "Jackson"
        correct: false
      - text: "JUnit"
        correct: false
    answer: Mockito et Hibernate utilisent ByteBuddy ; le JDK a aussi l'API Class-File.
  - key: qcm-version
    format: multiple-choice
    question: Comment produire un JAR qui tourne sur Java 17 avec un JDK 25 ?
    choices:
      - text: "`javac --release 17`"
        correct: true
      - text: "`javac -source 25`"
        correct: false
      - text: "`java -version 17`"
        correct: false
      - text: "Ce n'est pas possible"
        correct: false
    answer: '`--release` vérifie aussi qu''on n''utilise que l''API de Java 17.'
  - key: qcm-iadd
    format: multiple-choice
    question: Que fait l'instruction `iadd` ?
    choices:
      - text: "Elle dépile deux `int`, et empile leur somme"
        correct: true
      - text: "Elle ajoute un élément à une liste"
        correct: false
      - text: "Elle incrémente une variable locale"
        correct: false
      - text: "Elle appelle `Integer.sum`"
        correct: false
    answer: '`iinc` incrémente une variable locale.'
