notion: jfr-jmc
lesson: |-
  **Java Flight Recorder** (JFR) est un enregistreur intégré à la JVM, comme la boîte noire d'un avion : il collecte des
  **événements** (GC, compilation, verrous, entrées-sorties, exceptions, allocations, échantillons de piles CPU...) avec
  un **surcoût très faible** (de l'ordre de 1 %), ce qui le rend utilisable **en production**. **JDK Mission Control**
  (JMC) analyse les enregistrements.

  ```
  java -XX:StartFlightRecording=duration=2m,filename=demarrage.jfr -jar app.jar     # au démarrage
  java -XX:StartFlightRecording=maxage=1h,settings=default -jar app.jar             # enregistrement continu en mémoire
  jcmd <pid> JFR.start name=analyse duration=60s settings=profile filename=rec.jfr  # à chaud
  jcmd <pid> JFR.dump name=analyse filename=maintenant.jfr                          # vider l'enregistrement en cours
  jfr print --events jdk.GarbageCollection rec.jfr                                  # lire en ligne de commande
  jfr summary rec.jfr
  ```

  - Deux profils : **`default`** (faible surcoût, à garder en continu) et **`profile`** (plus détaillé, pour une
    analyse ponctuelle).
  - Un enregistrement **continu** avec une durée de rétention (`maxage`) permet, après un incident, de récupérer les
    dernières minutes avec `JFR.dump` : on n'a pas besoin d'avoir prévu l'incident.
  - JMC montre les **points chauds** CPU, les **allocations** par classe et par pile, les verrous disputés, les pauses du
    GC, les threads bloqués, les exceptions levées en masse.
  - On peut définir ses **propres événements** (étendre `jdk.jfr.Event`) pour tracer une opération métier.
  - Depuis Java 14, le **streaming** (`RecordingStream`) permet de consommer les événements en direct (pour des métriques).

  **Piège classique** : n'activer JFR qu'après un incident. L'information est perdue ; un enregistrement continu à faible
  coût, vidé à la demande, garde les minutes qui précèdent le problème.

  **En entretien** : « JFR enregistre en continu les événements de la JVM avec environ 1 % de surcoût, utilisable en
  production ; JMC les analyse : CPU, allocations, verrous, GC. »
cards:
  - key: jfr
    format: course
    question: "Qu'est-ce que JFR ?"
    choices:
      - {text: "Java Flight Recorder, un enregistreur d'événements de la JVM à très faible surcoût", correct: true}
      - {text: "Java File Reader, une API qui lit des fichiers en flux, sans tout charger", correct: false}
      - {text: "Un outil qui capture un heap dump à intervalles réguliers en production", correct: false}
      - {text: "Un profileur intrusif, à réserver aux postes de développement", correct: false}
    answer: "Java Flight Recorder, un enregistreur d'événements de la JVM à très faible surcoût, utilisable en production."
  - key: continu
    format: course
    question: "Pourquoi garder un enregistrement JFR continu en production ?"
    choices:
      - {text: "Pour vider les dernières minutes enregistrées après un incident, sans l'avoir prévu", correct: true}
      - {text: "Pour que la JVM s'optimise elle-même à partir de ce qu'elle enregistre", correct: false}
      - {text: "Pour remplacer les journaux applicatifs, qu'on peut alors supprimer", correct: false}
      - {text: "Pour conserver tout l'historique de la JVM depuis son démarrage", correct: false}
    answer: "Pour pouvoir, après un incident, vider (`JFR.dump`) les dernières minutes enregistrées sans avoir eu à prévoir l'incident. La rétention est bornée : on ne garde pas tout l'historique."
  - key: profils
    format: course
    question: "Quelle différence entre les profils `default` et `profile` de JFR ?"
    choices:
      - {text: "`default` a un surcoût très faible, pour le permanent ; `profile` collecte plus, ponctuellement", correct: true}
      - {text: "`profile` a un surcoût très faible, pour le permanent ; `default` collecte plus, ponctuellement", correct: false}
      - {text: "`default` n'enregistre que le CPU, `profile` seulement la mémoire", correct: false}
      - {text: "Aucune : `profile` est l'ancien nom de `default`, gardé par compatibilité", correct: false}
    answer: '`default` a un surcoût très faible, adapté à un enregistrement permanent ; `profile` collecte plus de détails pour une analyse ponctuelle, avec un surcoût un peu plus élevé.'
  - key: evenements
    format: course
    question: "Quels types d'informations contient un enregistrement JFR ?"
    choices:
      - {text: "Des événements sur le GC, la compilation, les verrous, les entrées-sorties, les allocations, le CPU", correct: true}
      - {text: "Une copie complète du tas, avec le contenu de chaque objet, à chaque minute écoulée", correct: false}
      - {text: "Le code source de l'application, annoté du temps passé sur chaque ligne", correct: false}
      - {text: "Les requêtes HTTP reçues, avec leur corps complet, pour pouvoir les rejouer", correct: false}
    answer: "Des événements sur le GC, la compilation, les verrous, les entrées-sorties, les exceptions, les allocations et des échantillons de piles CPU ; et des événements personnalisés de l'application. Le contenu des objets demande un heap dump."
  - key: vf-production
    format: true-false
    question: JFR est trop coûteux pour être utilisé en production.
    truth: false
    answer: Son surcoût est de l'ordre de 1 % avec le profil par défaut.
  - key: vf-chaud
    format: true-false
    question: On peut démarrer un enregistrement JFR sur une JVM déjà lancée.
    truth: true
    answer: Avec `jcmd <pid> JFR.start`.
  - key: vf-personnalise
    format: true-false
    question: Une application peut émettre ses propres événements JFR.
    truth: true
    answer: En étendant `jdk.jfr.Event`.
  - key: vf-jmc
    format: true-false
    question: JDK Mission Control sert à lire et analyser les enregistrements JFR.
    truth: true
    answer: L'outil `jfr` du JDK permet aussi de les lire en ligne de commande.
  - key: qcm-demarrer
    format: multiple-choice
    question: "Comment démarrer un enregistrement JFR sur une JVM déjà lancée ?"
    choices:
      - {text: "`jcmd <pid> JFR.start ...`", correct: true}
      - {text: "`jstack -jfr <pid>`", correct: false}
      - {text: "`jmap -jfr <pid>`", correct: false}
      - {text: "`javac -jfr`", correct: false}
    answer: "`jcmd <pid> JFR.start` démarre l'enregistrement à chaud ; au démarrage, c'est `-XX:StartFlightRecording`. `jstack`, `jmap` et `javac` n'ont pas d'option JFR."
  - key: qcm-contenu
    format: multiple-choice
    question: "Qu'est-ce que JMC permet d'analyser dans un enregistrement JFR ?"
    choices:
      - {text: "Les méthodes qui consomment le plus de CPU", correct: true}
      - {text: "Le contenu exact de chaque objet du tas", correct: false}
      - {text: "Le code source complet de l'application", correct: false}
      - {text: "Les plans d'exécution des requêtes SQL", correct: false}
    answer: "Les méthodes qui consomment le plus de CPU, et aussi les classes qui allouent le plus, avec leurs piles. Le contenu des objets demande un heap dump."
  - key: qcm-dump
    format: multiple-choice
    question: Un enregistrement continu tourne. Comment récupérer les données juste après un incident ?
    choices:
      - {text: "`jcmd <pid> JFR.dump name=... filename=incident.jfr`", correct: true}
      - {text: "Redémarrer la JVM, qui écrit l'enregistrement en partant", correct: false}
      - {text: "Attendre la fin de la rétention, qui vide le fichier seule", correct: false}
      - {text: "`jmap -dump:format=b,file=incident.jfr <pid>`", correct: false}
    answer: '`JFR.dump` écrit le contenu actuel de l''enregistrement.'
  - key: qcm-surcout
    format: multiple-choice
    question: Quel est l'ordre de grandeur du surcoût de JFR avec le profil par défaut ?
    choices:
      - text: "Environ 1 %"
        correct: true
      - text: "Environ 50 %"
        correct: false
      - text: "Le double du temps d'exécution"
        correct: false
      - text: "Il arrête la JVM pendant l'enregistrement"
        correct: false
    answer: C'est ce qui le rend utilisable en continu.
  - key: scenario-lenteur-intermittente
    format: scenario
    question: "Une API devient lente quelques minutes par jour, à des heures imprévisibles. Comment l'analyses-tu ?"
    choices:
      - {text: "Un enregistrement JFR continu, vidé au prochain épisode, analysé dans JMC avec les métriques", correct: true}
      - {text: "Un heap dump toutes les cinq minutes, pour être sûr d'en avoir un pendant l'épisode", correct: false}
      - {text: "J'attends de reproduire le problème en local, sur un poste de développement", correct: false}
      - {text: "Je double le nombre d'instances, pour que la lenteur passe inaperçue", correct: false}
    answer: |-
      J'active un enregistrement JFR continu (profil `default`, rétention d'une heure ou deux) sur les instances concernées,
      et une alerte sur la latence. Au prochain épisode, je vide l'enregistrement (`jcmd <pid> JFR.dump`) et je l'ouvre
      dans JMC : pauses GC, verrous disputés, threads bloqués en entrée-sortie, pics d'allocations ou d'exceptions,
      échantillons CPU sur la période. Je corrèle avec les métriques et les journaux de la même plage horaire (un batch,
      une sauvegarde, un service partenaire lent).
  - key: scenario-evenement-metier
    format: scenario
    question: "Tu veux mesurer finement la durée d'une opération métier (le calcul d'un devis) en production, avec le reste du contexte JVM. Comment ?"
    choices:
      - {text: "Un événement JFR personnalisé autour du calcul, qui apparaît avec ceux de la JVM", correct: true}
      - {text: "Un `System.out.println` du temps écoulé, relu ensuite dans la console", correct: false}
      - {text: "Un heap dump à chaque calcul, pour voir les objets du devis en mémoire", correct: false}
      - {text: "Un thread dump toutes les secondes, pour voir où en est le calcul", correct: false}
    answer: |-
      Je définis un événement JFR personnalisé (`class CalculDevis extends jdk.jfr.Event` avec quelques champs : client,
      nombre de lignes), que je démarre et valide autour du calcul (`begin()`, `commit()`). Il apparaît dans les
      enregistrements à côté des événements de la JVM : je vois si un calcul lent coïncide avec un GC, un verrou ou une
      entrée-sortie. Le coût est négligeable quand l'événement n'est pas activé. Pour des métriques permanentes, j'ajoute
      un timer Micrometer.
  - key: scenario-allocations
    format: scenario
    question: "Le GC travaille beaucoup sur un service. Comment trouves-tu le code qui alloue le plus ?"
    choices:
      - {text: "Un enregistrement JFR avec le profil `profile`, puis la vue des allocations et de leurs piles dans JMC", correct: true}
      - {text: "Un heap dump, qui montre quelle méthode a alloué chaque objet présent dans le tas", correct: false}
      - {text: "Un thread dump, qui montre les objets que chaque thread est en train d'allouer", correct: false}
      - {text: "Les journaux du GC, qui listent les classes allouées à chaque collecte jeune", correct: false}
    answer: |-
      Je prends un enregistrement JFR avec le profil `profile` pendant une période de charge typique, puis dans JMC la vue
      des allocations : les classes les plus allouées, et surtout les piles d'appels qui les allouent (événements
      `jdk.ObjectAllocationSample`). Je trouve souvent des conversions inutiles (chaînes, boxing), des copies de
      collections ou des objets créés en boucle. Je corrige les plus grosses sources, puis je compare un nouvel
      enregistrement pour mesurer le gain.
  - key: scenario-continu-ou-pas
    format: scenario
    question: "Ton équipe hésite à garder JFR actif en permanence en production. Quels arguments donnes-tu ?"
    choices:
      - {text: "Pour : environ 1 % de surcoût et un incident compris après coup, en bornant taille et âge", correct: true}
      - {text: "Contre : JFR ralentit l'application de moitié, il ne sert qu'en préproduction", correct: false}
      - {text: "Pour, sans précaution : un enregistrement ne contient jamais de donnée sensible", correct: false}
      - {text: "Contre : JFR désactive le JIT tout le temps qu'il enregistre", correct: false}
    answer: |-
      Pour : un surcoût d'environ 1 % avec le profil par défaut, et la possibilité de comprendre un incident a posteriori
      sans le reproduire, ce qui raccourcit énormément les diagnostics. Les précautions : borner la taille et l'âge de
      l'enregistrement (`maxsize`, `maxage`), décider où écrire les fichiers vidés, et savoir que l'enregistrement peut
      contenir des données sensibles (arguments, messages d'exception) : on le traite avec les mêmes règles que les
      journaux. Je mesure le surcoût sur notre charge avant de généraliser.
  - key: definition-jfr-jmc
    format: definition
    question: "Que désignent les sigles JFR et JMC ?"
    choices:
      - {text: "Java Flight Recorder et JDK Mission Control", correct: true}
      - {text: "Java File Reader et Java Memory Collector", correct: false}
      - {text: "JIT Fast Runtime et JVM Memory Cache", correct: false}
      - {text: "Java Flow Recorder et Java Metrics Center", correct: false}
    answer: "Java Flight Recorder (l'enregistreur d'événements de la JVM) et JDK Mission Control (l'outil qui analyse ses enregistrements)."
  - key: definition-evenement
    format: definition
    question: "Qu'est-ce qu'un événement JFR ?"
    choices:
      - {text: "Un fait horodaté enregistré par JFR, avec sa durée et ses attributs", correct: true}
      - {text: "Un message de journal écrit par l'application, au niveau `INFO`", correct: false}
      - {text: "Une exception levée par la JVM quand l'enregistrement est plein", correct: false}
      - {text: "Un clic de l'utilisateur dans l'interface de Mission Control", correct: false}
    answer: Un fait horodaté enregistré par JFR (une pause du GC, un verrou disputé, un échantillon de pile), avec sa durée et ses attributs.
  - key: definition-enregistrement-continu
    format: definition
    question: "Qu'est-ce qu'un enregistrement JFR continu ?"
    choices:
      - {text: "Un enregistrement permanent à rétention bornée, vidé à la demande après un incident", correct: true}
      - {text: "Un enregistrement qui écrit chaque événement dans un fichier, sans limite de taille", correct: false}
      - {text: "Un enregistrement lancé au démarrage, et arrêté à la première requête reçue", correct: false}
      - {text: "Un heap dump pris à intervalle régulier, et conservé pendant une heure", correct: false}
    answer: Un enregistrement JFR qui tourne en permanence avec une rétention bornée, et dont on vide le contenu à la demande après un incident.
  - key: definition-profil-jfr
    format: definition
    question: "Qu'est-ce qu'un profil JFR ?"
    choices:
      - {text: "Un ensemble de réglages des événements à collecter, `default` ou `profile`", correct: true}
      - {text: "Le compte rendu d'analyse produit par JMC à la fin d'un enregistrement", correct: false}
      - {text: "Le profil Maven qui active JFR à la compilation de l'application", correct: false}
      - {text: "La liste des méthodes les plus chaudes, triées par temps CPU", correct: false}
    answer: Un ensemble de réglages des événements à collecter (`default` à faible surcoût, `profile` plus détaillé).
