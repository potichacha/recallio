notion: jfr-jmc
lesson: |-
  **Java Flight Recorder** (JFR) est un enregistreur intégré à la JVM, comme la boîte noire d'un avion : il collecte des
  **événements** (GC, compilation, verrous, entrées-sorties, exceptions, allocations, échantillons de piles CPU...) avec
  un **surcoût très faible** (de l'ordre de 1 %), ce qui le rend utilisable **en production**. **JDK Mission Control**
  (JMC) analyse les enregistrements.

  ```
  java -XX:StartFlightRecording=duration=2m,filename=demarrage.jfr -jar app.jar     # au démarrage
  java -XX:StartFlightRecording=maxage=1h,settings=default -jar app.jar             # enregistrement continu en mémoire
  jcmd <pid> JFR.start name=analyse duration=60s settings=profile filename=rec.jfr  # à chaud
  jcmd <pid> JFR.dump name=analyse filename=maintenant.jfr                          # vider l'enregistrement en cours
  jfr print --events jdk.GarbageCollection rec.jfr                                  # lire en ligne de commande
  jfr summary rec.jfr
  ```

  - Deux profils : **`default`** (faible surcoût, à garder en continu) et **`profile`** (plus détaillé, pour une
    analyse ponctuelle).
  - Un enregistrement **continu** avec une durée de rétention (`maxage`) permet, après un incident, de récupérer les
    dernières minutes avec `JFR.dump` : on n'a pas besoin d'avoir prévu l'incident.
  - JMC montre les **points chauds** CPU, les **allocations** par classe et par pile, les verrous disputés, les pauses du
    GC, les threads bloqués, les exceptions levées en masse.
  - On peut définir ses **propres événements** (étendre `jdk.jfr.Event`) pour tracer une opération métier.
  - Depuis Java 14, le **streaming** (`RecordingStream`) permet de consommer les événements en direct (pour des métriques).

  **Piège classique** : n'activer JFR qu'après un incident. L'information est perdue ; un enregistrement continu à faible
  coût, vidé à la demande, garde les minutes qui précèdent le problème.

  **En entretien** : « JFR enregistre en continu les événements de la JVM avec environ 1 % de surcoût, utilisable en
  production ; JMC les analyse : CPU, allocations, verrous, GC. »
cards:
  - key: jfr
    format: course
    question: C'est quoi JFR ?
    answer: Java Flight Recorder, un enregistreur d'événements de la JVM à très faible surcoût, utilisable en production.
  - key: continu
    format: course
    question: Pourquoi garder un enregistrement JFR continu en production ?
    answer: Pour pouvoir, après un incident, vider (`JFR.dump`) les dernières minutes enregistrées sans avoir eu à prévoir l'incident.
  - key: profils
    format: course
    question: Quelle différence entre les profils `default` et `profile` de JFR ?
    answer: '`default` a un surcoût très faible, adapté à un enregistrement permanent ; `profile` collecte plus de détails pour une analyse ponctuelle, avec un surcoût un peu plus élevé.'
  - key: evenements
    format: course
    question: Quels types d'informations contient un enregistrement JFR ?
    answer: Des événements sur le GC, la compilation, les verrous, les entrées-sorties, les exceptions, les allocations et des échantillons de piles CPU ; et des événements personnalisés de l'application.
  - key: vf-production
    format: true-false
    question: JFR est trop coûteux pour être utilisé en production.
    truth: false
    answer: Son surcoût est de l'ordre de 1 % avec le profil par défaut.
  - key: vf-chaud
    format: true-false
    question: On peut démarrer un enregistrement JFR sur une JVM déjà lancée.
    truth: true
    answer: Avec `jcmd <pid> JFR.start`.
  - key: vf-personnalise
    format: true-false
    question: Une application peut émettre ses propres événements JFR.
    truth: true
    answer: En étendant `jdk.jfr.Event`.
  - key: vf-jmc
    format: true-false
    question: JDK Mission Control sert à lire et analyser les enregistrements JFR.
    truth: true
    answer: L'outil `jfr` du JDK permet aussi de les lire en ligne de commande.
  - key: qcm-demarrer
    format: multiple-choice
    question: Comment démarrer un enregistrement JFR ?
    choices:
      - text: "`java -XX:StartFlightRecording=... -jar app.jar`"
        correct: true
      - text: "`jcmd <pid> JFR.start ...`"
        correct: true
      - text: "`jstack -jfr <pid>`"
        correct: false
      - text: "`javac -jfr`"
        correct: false
    answer: Au démarrage, ou à chaud avec `jcmd`.
  - key: qcm-contenu
    format: multiple-choice
    question: Qu'est-ce que JMC permet d'analyser dans un enregistrement ?
    choices:
      - text: "Les méthodes qui consomment le plus de CPU"
        correct: true
      - text: "Les classes qui allouent le plus, et depuis quelles piles"
        correct: true
      - text: "Le contenu exact de chaque objet du tas"
        correct: false
      - text: "Le code source de l'application"
        correct: false
    answer: Le contenu des objets demande un heap dump.
  - key: qcm-dump
    format: multiple-choice
    question: Un enregistrement continu tourne. Comment récupérer les données juste après un incident ?
    choices:
      - text: "`jcmd <pid> JFR.dump name=... filename=incident.jfr`"
        correct: true
      - text: "Redémarrer la JVM"
        correct: false
      - text: "Attendre la fin de la rétention"
        correct: false
      - text: "`jmap -dump`"
        correct: false
    answer: '`JFR.dump` écrit le contenu actuel de l''enregistrement.'
  - key: qcm-surcout
    format: multiple-choice
    question: Quel est l'ordre de grandeur du surcoût de JFR avec le profil par défaut ?
    choices:
      - text: "Environ 1 %"
        correct: true
      - text: "Environ 50 %"
        correct: false
      - text: "Le double du temps d'exécution"
        correct: false
      - text: "Il arrête la JVM pendant l'enregistrement"
        correct: false
    answer: C'est ce qui le rend utilisable en continu.
  - key: scenario-lenteur-intermittente
    format: scenario
    question: Une API devient lente quelques minutes par jour, à des heures imprévisibles. Comment l'analyses-tu ?
    answer: |-
      J'active un enregistrement JFR continu (profil `default`, rétention d'une heure ou deux) sur les instances concernées,
      et une alerte sur la latence. Au prochain épisode, je vide l'enregistrement (`jcmd <pid> JFR.dump`) et je l'ouvre
      dans JMC : pauses GC, verrous disputés, threads bloqués en entrée-sortie, pics d'allocations ou d'exceptions,
      échantillons CPU sur la période. Je corrèle avec les métriques et les journaux de la même plage horaire (un batch,
      une sauvegarde, un service partenaire lent).
  - key: scenario-evenement-metier
    format: scenario
    question: Tu veux mesurer finement la durée d'une opération métier (le calcul d'un devis) en production, avec le reste du contexte JVM. Comment ?
    answer: |-
      Je définis un événement JFR personnalisé (`class CalculDevis extends jdk.jfr.Event` avec quelques champs : client,
      nombre de lignes), que je démarre et valide autour du calcul (`begin()`, `commit()`). Il apparaît dans les
      enregistrements à côté des événements de la JVM : je vois si un calcul lent coïncide avec un GC, un verrou ou une
      entrée-sortie. Le coût est négligeable quand l'événement n'est pas activé. Pour des métriques permanentes, j'ajoute
      un timer Micrometer.
  - key: scenario-allocations
    format: scenario
    question: Le GC travaille beaucoup sur un service. Comment trouves-tu le code qui alloue le plus ?
    answer: |-
      Je prends un enregistrement JFR avec le profil `profile` pendant une période de charge typique, puis dans JMC la vue
      des allocations : les classes les plus allouées, et surtout les piles d'appels qui les allouent (événements
      `jdk.ObjectAllocationSample`). Je trouve souvent des conversions inutiles (chaînes, boxing), des copies de
      collections ou des objets créés en boucle. Je corrige les plus grosses sources, puis je compare un nouvel
      enregistrement pour mesurer le gain.
  - key: scenario-continu-ou-pas
    format: scenario
    question: Ton équipe hésite à garder JFR actif en permanence en production. Quels arguments donnes-tu ?
    answer: |-
      Pour : un surcoût d'environ 1 % avec le profil par défaut, et la possibilité de comprendre un incident a posteriori
      sans le reproduire, ce qui raccourcit énormément les diagnostics. Les précautions : borner la taille et l'âge de
      l'enregistrement (`maxsize`, `maxage`), décider où écrire les fichiers vidés, et savoir que l'enregistrement peut
      contenir des données sensibles (arguments, messages d'exception) : on le traite avec les mêmes règles que les
      journaux. Je mesure le surcoût sur notre charge avant de généraliser.
  - key: definition-jfr-jmc
    format: definition
    question: JFR / JMC
    answer: Java Flight Recorder / JDK Mission Control
  - key: definition-evenement
    format: definition
    question: Événement JFR
    answer: Un fait horodaté enregistré par JFR (une pause du GC, un verrou disputé, un échantillon de pile), avec sa durée et ses attributs.
  - key: definition-enregistrement-continu
    format: definition
    question: Enregistrement continu
    answer: Un enregistrement JFR qui tourne en permanence avec une rétention bornée, et dont on vide le contenu à la demande après un incident.
  - key: definition-profil-jfr
    format: definition
    question: Profil JFR
    answer: Un ensemble de réglages des événements à collecter (`default` à faible surcoût, `profile` plus détaillé).
