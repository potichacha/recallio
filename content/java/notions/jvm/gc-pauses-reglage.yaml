notion: gc-pauses-reglage
cards:
  - key: pause-stop-the-world
    format: course
    question: C'est quoi une pause stop-the-world ?
    answer: Une phase où tous les threads applicatifs sont arrêtés (à un safepoint) pour que le GC travaille.
  - key: controle-maxgcpausemillis
    format: course
    question: Que contrôle MaxGCPauseMillis ?
    answer: L'objectif de durée de pause de G1 (200 ms par défaut), pas une garantie.
  - key: temps-reponse-ont-pics-reguliers-plusieurs
    format: scenario
    question: Les temps de réponse ont des pics réguliers de plusieurs centaines de millisecondes.
    answer: |-
      Des pics réguliers évoquent des **pauses GC**. Je commencerais par les logs GC (`-Xlog:gc*`) ou JFR pour corréler les pics avec des pauses.
      Si ce sont des collectes Young fréquentes : le taux d'allocation est trop élevé, je profilerais les allocations pour trouver qui produit autant d'objets. Si ce sont des Full GC : l'Old Generation se remplit, fuite possible ou heap trop petit. Si c'est G1 avec des objets humongous : de gros tableaux alloués souvent.
      Selon le diagnostic : réduire les allocations, agrandir le heap, ajuster la pause cible de G1, ou passer à **ZGC** si l'objectif est une latence très basse et qu'on accepte un léger surcoût CPU.
