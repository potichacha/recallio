notion: chargement-classes
lesson: |-
  Une classe passe par trois étapes avant de servir :

  1. **Chargement** : un *class loader* trouve le bytecode (dans un JAR, un module, ou généré) et crée l'objet `Class`.
  2. **Liaison** :
     - **vérification** du bytecode ;
     - **préparation** : les champs `static` reçoivent leur **valeur par défaut** (0, `null`) ;
     - **résolution** des références symboliques vers d'autres classes (souvent paresseuse).
  3. **Initialisation** : exécution des **initialiseurs statiques** (`static int x = calcul();` et les blocs
     `static { }`), dans l'ordre du texte.

  L'initialisation a lieu au **premier usage actif** : création d'une instance, appel d'une méthode statique, accès à un
  champ statique non constant, `Class.forName(nom)`, initialisation d'une sous-classe (la super-classe d'abord). Elle
  est **paresseuse**, **une seule fois**, et **thread-safe** (garantie par la JVM).

  ```java
  class Config {
      static { System.out.println("init Config"); }
      static final int VERSION = 3;                 // constante : copiée chez l'appelant à la compilation
      static final List<String> NOMS = List.of();   // pas une constante de compilation
  }

  int v = Config.VERSION;        // n'initialise PAS Config
  var n = Config.NOMS;           // initialise Config
  Config[] t = new Config[3];    // n'initialise pas Config
  ```

  - Une **constante de compilation** (`static final` primitive ou `String` initialisée par une expression constante) est
    recopiée dans les classes qui l'utilisent : la lire n'initialise pas la classe (et la changer impose de recompiler
    ces classes).
  - Une exception dans un initialiseur statique donne une **`ExceptionInInitializerError`** au premier usage, puis
    **`NoClassDefFoundError`** aux suivants : la classe est définitivement inutilisable.
  - C'est sur cette paresse thread-safe que repose l'**idiome du holder** (singleton paresseux).

  **Piège classique** : un initialiseur statique qui lit une configuration absente. La première utilisation lève
  `ExceptionInInitializerError`, et toutes les suivantes un `NoClassDefFoundError` déroutant.

  **En entretien** : « Chargement, liaison (vérification, préparation, résolution), initialisation au premier usage actif,
  une fois et de façon thread-safe ; une exception dans un `static {}` rend la classe inutilisable. »
cards:
  - key: phases-chargement-classe
    format: course
    question: "Quelles sont les phases du chargement d'une classe ?"
    choices:
      - {text: "Chargement, liaison (vérification, préparation, résolution), puis initialisation", correct: true}
      - {text: "Compilation, chargement, puis exécution du constructeur par défaut", correct: false}
      - {text: "Initialisation, liaison, puis chargement, au premier appel de méthode", correct: false}
      - {text: "Lecture du JAR, compilation par le JIT, puis mise en cache en Metaspace", correct: false}
    answer: Chargement, liaison (vérification, préparation, résolution), initialisation.
  - key: quand-classe-initialisee
    format: course
    question: "Quand une classe est-elle initialisée ?"
    choices:
      - {text: "Au premier usage actif : instanciation, méthode `static`, champ `static` non constant...", correct: true}
      - {text: "Au démarrage de la JVM, pour toutes les classes présentes dans le classpath", correct: false}
      - {text: "À la compilation, quand `javac` produit son fichier `.class`", correct: false}
      - {text: "Dès qu'une variable de son type est déclarée, même si elle vaut `null`", correct: false}
    answer: "Au premier usage actif : instanciation, appel d'une méthode static, accès à un champ static non constant, réflexion, initialisation d'une sous-classe. Déclarer une variable ou un tableau de ce type n'y suffit pas."
  - key: constante
    format: course
    question: "Pourquoi lire une constante `static final int` n'initialise-t-il pas sa classe ?"
    choices:
      - {text: "La constante est recopiée dans le bytecode de la classe qui l'utilise", correct: true}
      - {text: "Les champs `final` sont rangés hors de leur classe, dans le pool de chaînes", correct: false}
      - {text: "Une classe ne s'initialise que par un appel de méthode, jamais par un champ", correct: false}
      - {text: "La JVM initialise toutes les constantes au démarrage, avant toute classe", correct: false}
    answer: "Une constante de compilation est recopiée dans le bytecode de la classe qui l'utilise ; il n'y a plus d'accès à la classe d'origine. Un champ `static` non constant, lui, initialise la classe."
  - key: erreur-init
    format: course
    question: "Que se passe-t-il si un initialiseur statique lève une exception ?"
    choices:
      - {text: "`ExceptionInInitializerError` au premier usage, puis `NoClassDefFoundError` ensuite", correct: true}
      - {text: "`ClassNotFoundException` au premier usage, puis la classe est rechargée", correct: false}
      - {text: "L'exception est ignorée, et les champs gardent leur valeur par défaut", correct: false}
      - {text: "La JVM s'arrête aussitôt, avec le code de sortie de l'exception", correct: false}
    answer: "Le premier usage lève une `ExceptionInInitializerError`, et les usages suivants un `NoClassDefFoundError` : la classe reste inutilisable jusqu'à l'arrêt de la JVM."
  - key: vf-une-fois
    format: true-false
    question: Les blocs `static` d'une classe s'exécutent une seule fois.
    truth: true
    answer: À l'initialisation de la classe.
  - key: vf-tableau
    format: true-false
    question: "`new Config[10]` initialise la classe `Config`."
    truth: false
    answer: Créer un tableau ne crée aucune instance de `Config`.
  - key: vf-thread-safe
    format: true-false
    question: L'initialisation d'une classe est thread-safe.
    truth: true
    answer: La JVM garantit qu'elle n'a lieu qu'une fois, même avec plusieurs threads.
  - key: vf-ordre-parent
    format: true-false
    question: Initialiser une sous-classe initialise d'abord sa super-classe.
    truth: true
    answer: Les blocs `static` du parent passent avant ceux de l'enfant.
  - key: qcm-initialise
    format: multiple-choice
    question: Lesquelles initialisent la classe `Service` ?
    choices:
      - text: "`new Service()`"
        correct: true
      - text: "`Service.demarrer()` (méthode statique)"
        correct: true
      - text: "`Service[] t = new Service[2]`"
        correct: false
      - text: "Lire `Service.MAX`, une constante `static final int MAX = 10`"
        correct: false
    answer: Le tableau et la constante n'exigent pas l'initialisation.
  - key: qcm-preparation
    format: multiple-choice
    question: Que se passe-t-il pendant la phase de préparation ?
    choices:
      - {text: "Les champs statiques reçoivent leur valeur par défaut", correct: true}
      - {text: "Les blocs `static` s'exécutent, dans l'ordre du code", correct: false}
      - {text: "Le constructeur par défaut est appelé une première fois", correct: false}
      - {text: "Le JIT compile les méthodes de la classe en code natif", correct: false}
    answer: Les valeurs initiales réelles sont affectées à l'initialisation.
  - key: qcm-erreurs
    format: multiple-choice
    question: "Un bloc `static` lève une exception. Que voit-on au deuxième usage de la classe ?"
    choices:
      - {text: "Une `NoClassDefFoundError`", correct: true}
      - {text: "Une `ExceptionInInitializerError`, de nouveau", correct: false}
      - {text: "Une `ClassNotFoundException`", correct: false}
      - {text: "Aucune erreur : la classe est rechargée", correct: false}
    answer: "Le premier usage lève une `ExceptionInInitializerError` ; la classe reste ensuite dans un état d'erreur, et chaque usage suivant lève une `NoClassDefFoundError`."
  - key: qcm-holder
    format: multiple-choice
    question: Sur quelle propriété repose l'idiome du holder pour un singleton paresseux ?
    choices:
      - {text: "L'initialisation de classe paresseuse et thread-safe garantie par la JVM", correct: true}
      - {text: "Le mot-clé `volatile` sur le champ qui garde l'instance unique", correct: false}
      - {text: "Un bloc `synchronized` autour de la création de l'instance", correct: false}
      - {text: "Le ramasse-miettes, qui ne crée l'objet qu'au premier besoin", correct: false}
    answer: La classe interne n'est initialisée qu'au premier accès.
  - key: code-ordre
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Parent { static { System.out.print("P "); } }
      class Enfant extends Parent { static { System.out.print("E "); } }
      new Enfant();
      new Enfant();
      System.out.println("fin");
      ```
    choices:
      - {text: "`P E fin`", correct: true}
      - {text: "`E P fin`", correct: false}
      - {text: "`P E P E fin`", correct: false}
      - {text: "`P E E fin`", correct: false}
    answer: "`P E fin` : la super-classe est initialisée d'abord, et chaque classe une seule fois, quel que soit le nombre d'instances."
    check:
      output: "P E fin"
  - key: code-constante
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Config {
          static { System.out.print("init "); }
          static final int VERSION = 3;
          static final String NOM = "app".toUpperCase();
      }
      System.out.print(Config.VERSION + " ");
      System.out.println(Config.NOM);
      ```
    choices:
      - {text: "`3 init APP`", correct: true}
      - {text: "`init 3 APP`", correct: false}
      - {text: "`3 APP`", correct: false}
      - {text: "`init 3 init APP`", correct: false}
    answer: '`3 init APP` : la constante n''initialise pas la classe, le champ calculé si.'
    check:
      output: "3 init APP"
  - key: code-tableau
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Lourde { static { System.out.print("init "); } }
      Lourde[] t = new Lourde[5];
      System.out.print(t.length + " ");
      Lourde l = new Lourde();
      System.out.println("ok");
      ```
    choices:
      - {text: "`5 init ok`", correct: true}
      - {text: "`init 5 ok`", correct: false}
      - {text: "`init 5 init ok`", correct: false}
      - {text: "`5 ok`", correct: false}
    answer: '`5 init ok` : le tableau ne déclenche pas l''initialisation, l''instance si.'
    check:
      output: "5 init ok"
  - key: code-erreur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Fragile {
          static int valeur = Integer.parseInt("pas un nombre");
      }
      try {
          System.out.println(Fragile.valeur);
      } catch (ExceptionInInitializerError e) {
          System.out.println("1 : " + e.getCause().getClass().getSimpleName());
      }
      try {
          System.out.println(Fragile.valeur);
      } catch (NoClassDefFoundError e) {
          System.out.println("2 : NoClassDefFoundError");
      }
      ```
    choices:
      - text: |-
          ```
          1 : NumberFormatException
          2 : NoClassDefFoundError
          ```
        correct: true
      - text: |-
          ```
          1 : ExceptionInInitializerError
          2 : NoClassDefFoundError
          ```
        correct: false
      - text: |-
          ```
          1 : NumberFormatException
          0
          ```
        correct: false
      - {text: "`1 : NumberFormatException`, puis une `NumberFormatException` non rattrapée", correct: false}
    answer: "`1 : NumberFormatException`, puis `2 : NoClassDefFoundError` : la cause de l'erreur d'initialisation est l'exception d'origine, et la classe reste ensuite inutilisable."
    check:
      output: "1 : NumberFormatException\n2 : NoClassDefFoundError"
