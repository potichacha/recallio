notion: chargement-classes
lesson: |-
  Une classe passe par trois étapes avant de servir :

  1. **Chargement** : un *class loader* trouve le bytecode (dans un JAR, un module, ou généré) et crée l'objet `Class`.
  2. **Liaison** :
     - **vérification** du bytecode ;
     - **préparation** : les champs `static` reçoivent leur **valeur par défaut** (0, `null`) ;
     - **résolution** des références symboliques vers d'autres classes (souvent paresseuse).
  3. **Initialisation** : exécution des **initialiseurs statiques** (`static int x = calcul();` et les blocs
     `static { }`), dans l'ordre du texte.

  L'initialisation a lieu au **premier usage actif** : création d'une instance, appel d'une méthode statique, accès à un
  champ statique non constant, `Class.forName(nom)`, initialisation d'une sous-classe (la super-classe d'abord). Elle
  est **paresseuse**, **une seule fois**, et **thread-safe** (garantie par la JVM).

  ```java
  class Config {
      static { System.out.println("init Config"); }
      static final int VERSION = 3;                 // constante : copiée chez l'appelant à la compilation
      static final List<String> NOMS = List.of();   // pas une constante de compilation
  }

  int v = Config.VERSION;        // n'initialise PAS Config
  var n = Config.NOMS;           // initialise Config
  Config[] t = new Config[3];    // n'initialise pas Config
  ```

  - Une **constante de compilation** (`static final` primitive ou `String` initialisée par une expression constante) est
    recopiée dans les classes qui l'utilisent : la lire n'initialise pas la classe (et la changer impose de recompiler
    ces classes).
  - Une exception dans un initialiseur statique donne une **`ExceptionInInitializerError`** au premier usage, puis
    **`NoClassDefFoundError`** aux suivants : la classe est définitivement inutilisable.
  - C'est sur cette paresse thread-safe que repose l'**idiome du holder** (singleton paresseux).

  **Piège classique** : un initialiseur statique qui lit une configuration absente. La première utilisation lève
  `ExceptionInInitializerError`, et toutes les suivantes un `NoClassDefFoundError` déroutant.

  **En entretien** : « Chargement, liaison (vérification, préparation, résolution), initialisation au premier usage actif,
  une fois et de façon thread-safe ; une exception dans un `static {}` rend la classe inutilisable. »
cards:
  - key: phases-chargement-classe
    format: course
    question: Les phases du chargement de classe ?
    answer: Chargement, liaison (vérification, préparation, résolution), initialisation.
  - key: quand-classe-initialisee
    format: course
    question: Quand une classe est-elle initialisée ?
    answer: 'Au premier usage actif : instanciation, appel d''une méthode static, accès à un champ static non constant, réflexion, initialisation d''une sous-classe.'
  - key: constante
    format: course
    question: Pourquoi lire une constante `static final int` n'initialise-t-il pas sa classe ?
    answer: Une constante de compilation est recopiée dans le bytecode de la classe qui l'utilise ; il n'y a plus d'accès à la classe d'origine.
  - key: erreur-init
    format: course
    question: Que se passe-t-il si un initialiseur statique lève une exception ?
    answer: "Le premier usage lève une `ExceptionInInitializerError`, et les usages suivants un `NoClassDefFoundError` : la classe reste inutilisable jusqu'à l'arrêt de la JVM."
  - key: vf-une-fois
    format: true-false
    question: Les blocs `static` d'une classe s'exécutent une seule fois.
    truth: true
    answer: À l'initialisation de la classe.
  - key: vf-tableau
    format: true-false
    question: "`new Config[10]` initialise la classe `Config`."
    truth: false
    answer: Créer un tableau ne crée aucune instance de `Config`.
  - key: vf-thread-safe
    format: true-false
    question: L'initialisation d'une classe est thread-safe.
    truth: true
    answer: La JVM garantit qu'elle n'a lieu qu'une fois, même avec plusieurs threads.
  - key: vf-ordre-parent
    format: true-false
    question: Initialiser une sous-classe initialise d'abord sa super-classe.
    truth: true
    answer: Les blocs `static` du parent passent avant ceux de l'enfant.
  - key: qcm-initialise
    format: multiple-choice
    question: Lesquelles initialisent la classe `Service` ?
    choices:
      - text: "`new Service()`"
        correct: true
      - text: "`Service.demarrer()` (méthode statique)"
        correct: true
      - text: "`Service[] t = new Service[2]`"
        correct: false
      - text: "Lire `Service.MAX`, une constante `static final int MAX = 10`"
        correct: false
    answer: Le tableau et la constante n'exigent pas l'initialisation.
  - key: qcm-preparation
    format: multiple-choice
    question: Que se passe-t-il pendant la phase de préparation ?
    choices:
      - text: "Les champs statiques reçoivent leur valeur par défaut"
        correct: true
      - text: "Les blocs `static` s'exécutent"
        correct: false
      - text: "Le constructeur est appelé"
        correct: false
      - text: "Le JIT compile la classe"
        correct: false
    answer: Les valeurs initiales réelles sont affectées à l'initialisation.
  - key: qcm-erreurs
    format: multiple-choice
    question: Un bloc `static` lève une exception. Quelles erreurs voit-on ?
    choices:
      - text: "`ExceptionInInitializerError` au premier usage"
        correct: true
      - text: "`NoClassDefFoundError` aux usages suivants"
        correct: true
      - text: "`ClassNotFoundException` à chaque usage"
        correct: false
      - text: "Aucune, la classe est rechargée"
        correct: false
    answer: La classe reste dans un état d'erreur.
  - key: qcm-holder
    format: multiple-choice
    question: Sur quelle propriété repose l'idiome du holder pour un singleton paresseux ?
    choices:
      - text: "L'initialisation de classe paresseuse et thread-safe garantie par la JVM"
        correct: true
      - text: "Le mot-clé `volatile`"
        correct: false
      - text: "Un bloc `synchronized`"
        correct: false
      - text: "Le ramasse-miettes"
        correct: false
    answer: La classe interne n'est initialisée qu'au premier accès.
  - key: code-ordre
    format: code-output
    question: |-
      ```java
      class Parent { static { System.out.print("P "); } }
      class Enfant extends Parent { static { System.out.print("E "); } }
      new Enfant();
      new Enfant();
      System.out.println("fin");
      ```
    answer: '`P E fin` : la super-classe d''abord, et une seule fois.'
    check:
      output: "P E fin"
  - key: code-constante
    format: code-output
    question: |-
      ```java
      class Config {
          static { System.out.print("init "); }
          static final int VERSION = 3;
          static final String NOM = "app".toUpperCase();
      }
      System.out.print(Config.VERSION + " ");
      System.out.println(Config.NOM);
      ```
    answer: '`3 init APP` : la constante n''initialise pas la classe, le champ calculé si.'
    check:
      output: "3 init APP"
  - key: code-tableau
    format: code-output
    question: |-
      ```java
      class Lourde { static { System.out.print("init "); } }
      Lourde[] t = new Lourde[5];
      System.out.print(t.length + " ");
      Lourde l = new Lourde();
      System.out.println("ok");
      ```
    answer: '`5 init ok` : le tableau ne déclenche pas l''initialisation, l''instance si.'
    check:
      output: "5 init ok"
  - key: code-erreur
    format: code-output
    question: |-
      ```java
      class Fragile {
          static int valeur = Integer.parseInt("pas un nombre");
      }
      try {
          System.out.println(Fragile.valeur);
      } catch (ExceptionInInitializerError e) {
          System.out.println("1 : " + e.getCause().getClass().getSimpleName());
      }
      try {
          System.out.println(Fragile.valeur);
      } catch (NoClassDefFoundError e) {
          System.out.println("2 : NoClassDefFoundError");
      }
      ```
    answer: '`1 : NumberFormatException`, puis `2 : NoClassDefFoundError`.'
    check:
      output: "1 : NumberFormatException\n2 : NoClassDefFoundError"
