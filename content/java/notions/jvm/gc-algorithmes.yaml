notion: gc-algorithmes
lesson: |-
  HotSpot propose plusieurs ramasse-miettes, qui font des compromis différents entre **débit** (part du temps consacrée à
  l'application), **latence** (durée des pauses) et **empreinte** (mémoire et CPU en plus) :

  | GC | Option | Principe | Pour |
  |---|---|---|---|
  | **Serial** | `-XX:+UseSerialGC` | un seul thread, tout en pause | petits tas, un seul cœur, outils en ligne de commande |
  | **Parallel** | `-XX:+UseParallelGC` | plusieurs threads, en pause | le **débit** maximal (traitements par lots) |
  | **G1** | `-XX:+UseG1GC` (défaut) | tas en **régions**, collecte d'abord les plus rentables, marquage concurrent, objectif de pause | le choix général |
  | **ZGC** | `-XX:+UseZGC` | presque tout en concurrence, pauses de l'ordre de la **milliseconde** quelle que soit la taille du tas | la **latence** sur de gros tas |
  | **Shenandoah** | `-XX:+UseShenandoahGC` | compactage concurrent, pauses très courtes | la latence (OpenJDK) |
  | **Epsilon** | `-XX:+UseEpsilonGC` | n'alloue que, ne collecte jamais | tests de performance, tâches très courtes |

  À retenir :
  - **G1** est le GC par défaut depuis Java 9 (sur les machines « serveur ») : le tas est découpé en régions, et G1 vise une
    pause cible (`-XX:MaxGCPauseMillis`, 200 ms par défaut). Un objet de plus d'une demi-région est **humongous**, alloué
    directement en vieille génération.
  - **ZGC** est générationnel (par défaut depuis Java 23, seul mode depuis Java 24) ; il échange un peu de débit et de CPU
    contre des pauses très faibles, même avec des centaines de gigaoctets.
  - Sur une petite machine (moins de 2 CPU ou de 1,8 Go), la JVM choisissait Serial par défaut (JDK récents : G1
    partout, selon la version).
  - On ne change de GC qu'après avoir **mesuré** un problème de pauses ou de débit.

  **Piège classique** : passer à ZGC « parce qu'il est plus moderne » sur un traitement par lots. Le débit baisse, sans
  bénéfice : pour un batch, ce sont les pauses totales et le débit qui comptent, et Parallel ou G1 conviennent mieux.

  **En entretien** : « Serial pour les petites machines, Parallel pour le débit, G1 par défaut avec un objectif de pause,
  ZGC et Shenandoah pour des pauses de l'ordre de la milliseconde sur de gros tas. »
cards:
  - key: gc-defaut
    format: course
    question: "Quel est le GC par défaut de HotSpot depuis Java 9, et pourquoi ?"
    choices:
      - {text: "G1 : un tas découpé en régions et une durée de pause cible configurable", correct: true}
      - {text: "Parallel : le meilleur débit, sans se soucier de la durée des pauses", correct: false}
      - {text: "ZGC : des pauses de l'ordre de la milliseconde, quelle que soit la taille du tas", correct: false}
      - {text: "Serial : un seul thread, pour ne gêner aucune application", correct: false}
    answer: "G1 depuis Java 9 : découpage en régions et pause cible configurable, un bon compromis entre débit et latence. Parallel vise le débit, ZGC les pauses minimales."
  - key: gc-contraintes
    format: course
    question: "Quel GC choisir selon les contraintes ?"
    choices:
      - {text: "Parallel pour le débit, G1 en général, ZGC pour des pauses minimales, Serial pour les petites machines", correct: true}
      - {text: "Serial pour le débit, Parallel en général, G1 pour des pauses minimales, ZGC pour les petites machines", correct: false}
      - {text: "ZGC pour le débit, Serial en général, Parallel pour des pauses minimales, G1 pour les petites machines", correct: false}
      - {text: "G1 pour le débit, ZGC en général, Serial pour des pauses minimales, Parallel pour les petites machines", correct: false}
    answer: "Parallel pour le débit, G1 en général, ZGC/Shenandoah pour des pauses minimales sur gros heap, Serial pour les très petites machines."
  - key: gc-defaut-java-25
    format: course
    question: "Quel ramasse-miettes la JVM de Java 25 choisit-elle par défaut ?"
    choices:
      - {text: "G1, ou Serial sur une petite machine (moins de 2 processeurs ou de 1 792 Mo)", correct: true}
      - {text: "ZGC partout, depuis qu'il est générationnel et sans pause notable", correct: false}
      - {text: "Parallel partout, pour obtenir le meilleur débit dès le démarrage", correct: false}
      - {text: "G1 partout, quelle que soit la taille de la machine ou du conteneur", correct: false}
    answer: "G1 depuis Java 9, sauf quand la JVM détecte une petite machine (moins de 2 processeurs ou moins de 1 792 Mo de mémoire) : elle prend alors Serial. Dans un conteneur, ce sont les limites du conteneur qui comptent, d'où un Serial inattendu dans un petit pod."
  - key: objet-humongous-g1
    format: course
    question: "Qu'est-ce qu'un objet humongous dans G1 ?"
    choices:
      - {text: "Un objet de plus de la moitié d'une région, alloué directement en vieille génération", correct: true}
      - {text: "Un objet qui a survécu à plus de quinze collectes de la jeune génération", correct: false}
      - {text: "Un objet rangé dans le Metaspace, hors du tas, comme les métadonnées des classes", correct: false}
      - {text: "Un objet référencé par plus de mille autres objets du tas", correct: false}
    answer: Un objet dépassant la moitié d'une région, alloué directement en Old Generation.
  - key: zgc-generationnel
    format: course
    question: "ZGC est-il un GC générationnel ?"
    choices:
      - {text: "Oui, par défaut depuis Java 23 ; le mode non générationnel a disparu en Java 24", correct: true}
      - {text: "Non : ZGC traite tout le tas d'un seul bloc, sans aucune génération", correct: false}
      - {text: "Seulement avec l'option `-XX:+ZGenerational`, désactivée par défaut", correct: false}
      - {text: "Oui, depuis Java 11 et sa toute première version expérimentale", correct: false}
    answer: Oui par défaut depuis Java 23, et le mode non générationnel a été supprimé en Java 24.
  - key: vf-zgc-pauses
    format: true-false
    question: Les pauses de ZGC restent de l'ordre de la milliseconde, même avec un très gros tas.
    truth: true
    answer: L'essentiel du travail est fait en concurrence avec l'application.
  - key: vf-parallel-latence
    format: true-false
    question: Parallel GC est le meilleur choix pour minimiser les pauses d'une API interactive.
    truth: false
    answer: Il maximise le débit mais fait des pauses longues ; G1 ou ZGC conviennent mieux.
  - key: vf-epsilon
    format: true-false
    question: Epsilon ne libère jamais la mémoire.
    truth: true
    answer: Utile pour mesurer les performances sans GC, ou pour des tâches très courtes.
  - key: vf-gratuit
    format: true-false
    question: Un GC à faible latence n'a aucun coût en échange.
    truth: false
    answer: Il consomme plus de CPU et un peu de débit pour faire son travail en concurrence.
  - key: qcm-choix
    format: multiple-choice
    question: "Quelle association entre un besoin et un GC est la bonne ?"
    choices:
      - {text: "Un traitement par lots qui doit finir au plus vite : Parallel", correct: true}
      - {text: "Un outil en ligne de commande qui dure deux secondes : ZGC obligatoirement", correct: false}
      - {text: "Un service général sans contrainte particulière : Epsilon", correct: false}
      - {text: "Une API à pauses minimales sur un tas de 200 Go : Serial", correct: false}
    answer: "Parallel maximise le débit, ce qui compte pour un lot (et ZGC convient aux pauses minimales sur un gros tas). Epsilon ne collecte rien, Serial a des pauses longues sur un gros tas, et un outil bref n'exige rien de particulier ; G1 reste le défaut raisonnable."
  - key: qcm-g1
    format: multiple-choice
    question: "Comment fonctionne G1 ?"
    choices:
      - {text: "Le tas est découpé en régions, collectées d'abord là où il y a le plus à récupérer", correct: true}
      - {text: "Il ne fait jamais de pause : tout son travail se fait en concurrence avec l'application", correct: false}
      - {text: "Il n'utilise qu'un seul thread pour toutes ses collectes, jeunes comme complètes", correct: false}
      - {text: "Il collecte tout le tas d'un seul bloc, à chaque passage, sans régions", correct: false}
    answer: "D'où le nom « Garbage First » : les régions les plus rentables d'abord, pour tenir une durée de pause cible configurable. Il a des pauses, courtes, et utilise plusieurs threads."
  - key: qcm-options
    format: multiple-choice
    question: Quelle option active ZGC ?
    choices:
      - text: "`-XX:+UseZGC`"
        correct: true
      - text: "`-XX:+UseLowLatencyGC`"
        correct: false
      - text: "`-Xgc:zgc`"
        correct: false
      - text: "`-XX:GC=Z`"
        correct: false
    answer: Il est générationnel par défaut depuis Java 23.
  - key: qcm-humongous
    format: multiple-choice
    question: Pourquoi de nombreux objets humongous peuvent-ils poser problème avec G1 ?
    choices:
      - {text: "Ils sont alloués directement en vieille génération et peuvent fragmenter le tas", correct: true}
      - {text: "Ils ne sont jamais collectés, et restent dans le tas jusqu'à l'arrêt de la JVM", correct: false}
      - {text: "Ils sont rangés dans le Metaspace, qui n'est pas dimensionné pour eux", correct: false}
      - {text: "Ils désactivent G1, qui repasse en Serial pour toute la suite", correct: false}
    answer: Agrandir la taille des régions (`-XX:G1HeapRegionSize`) ou réduire ces gros tableaux aide.
  - key: scenario-choisir
    format: scenario
    question: "Quel GC choisis-tu pour un nouveau service web, et sur quels critères pourrais-tu en changer ?"
    choices:
      - {text: "G1, le défaut ; ZGC si les pauses mesurées dépassent l'objectif, Parallel pour un traitement par lots", correct: true}
      - {text: "ZGC partout, toujours meilleur que G1, quels que soient le service et sa charge", correct: false}
      - {text: "Serial, le plus simple, puis G1 seulement si un client se plaint de lenteurs", correct: false}
      - {text: "Epsilon, qui supprime toutes les pauses, avec un redémarrage quand le tas est plein", correct: false}
    answer: |-
      G1, le défaut : bon compromis entre débit et pauses pour la plupart des services, sans réglage. J'en changerais
      après mesure : si les pauses dépassent l'objectif de latence (percentile 99) malgré un tas bien dimensionné et un
      taux d'allocation raisonnable, je teste ZGC, qui donne des pauses de l'ordre de la milliseconde au prix d'un peu de
      CPU. Pour un traitement par lots où seul le temps total compte, Parallel. Je compare toujours sous charge
      réaliste, avec les journaux du GC et la latence de bout en bout.
  - key: scenario-gros-tas
    format: scenario
    question: "Un service en mémoire (un cache de 120 Go) subit des pauses de plusieurs secondes avec G1. Que proposes-tu ?"
    choices:
      - {text: "ZGC (ou Shenandoah), à pauses courtes quelle que soit la taille du tas, validé sous charge", correct: true}
      - {text: "Serial, plus simple, dont l'unique thread évite toute contention sur un gros tas", correct: false}
      - {text: "Porter `MaxGCPauseMillis` à 10 secondes, pour que G1 ait le temps de finir", correct: false}
      - {text: "Appeler `System.gc()` chaque nuit, pour vider le cache aux heures creuses", correct: false}
    answer: |-
      Sur un tas de cette taille, les phases d'arrêt de G1 (évacuation, et surtout un éventuel GC complet) deviennent
      longues. ZGC (ou Shenandoah) fait le marquage et le compactage en concurrence, avec des pauses de l'ordre de la
      milliseconde quelle que soit la taille du tas : c'est le bon candidat, à valider sous charge (CPU disponible pour
      le GC, débit). Je me demanderais aussi s'il faut vraiment 120 Go dans le tas : des données hors tas (mémoire native,
      un cache externe) ou plusieurs instances plus petites peuvent être plus simples à opérer.
  - key: scenario-conteneur-petit
    format: scenario
    question: "Un microservice tourne dans des conteneurs de 1 CPU et 512 Mo. Quel GC la JVM choisit-elle, et faut-il intervenir ?"
    choices:
      - {text: "Serial sur les JDK un peu anciens, G1 sur les récents : je fixe le GC explicitement et je mesure", correct: true}
      - {text: "Toujours ZGC, que la JVM choisit dès qu'elle détecte un conteneur, quelle que soit sa taille", correct: false}
      - {text: "Toujours G1, quelle que soit la version du JDK : aucune intervention n'est jamais utile", correct: false}
      - {text: "Aucun GC : la JVM désactive la collecte sous 1 Go, et redémarre quand le tas est plein", correct: false}
    answer: |-
      Sur une machine considérée comme « non serveur » (moins de 2 CPU ou moins d'environ 1,8 Go), les JDK jusqu'à
      récemment choisissent Serial ; les versions récentes prennent G1 partout. Je vérifie le GC réel
      (`-XX:+PrintCommandLineFlags` ou `jcmd VM.flags`). Avec un seul CPU, Serial est d'ailleurs souvent efficace. Je
      fixe explicitement le GC voulu pour ne pas dépendre de cette heuristique, je règle `MaxRAMPercentage`, et je mesure
      les pauses sous charge.
  - key: scenario-batch
    format: scenario
    question: "Un traitement nocturne qui dure deux heures doit finir plus tôt. Le GC y prend 15 % du temps. Que fais-tu ?"
    choices:
      - {text: "Parallel GC et un tas plus grand pour le débit, puis je réduis les allocations, en mesurant", correct: true}
      - {text: "ZGC, pour des pauses de l'ordre de la milliseconde pendant tout le traitement", correct: false}
      - {text: "Epsilon, qui désactive le GC, puisque le traitement finit avant que le tas soit plein", correct: false}
      - {text: "Je baisse `MaxGCPauseMillis` à 10 ms, pour que chaque pause soit plus courte", correct: false}
    answer: |-
      Pour un batch, seul le temps total compte, pas les pauses individuelles : j'essaie Parallel GC, conçu pour le débit,
      et un tas plus grand pour réduire le nombre de collectes. Je profile aussi les allocations : 15 % de GC signale
      beaucoup d'objets temporaires (conversions, chaînes, entités chargées inutilement), et réduire les allocations est
      souvent le gain le plus important. Je mesure chaque changement sur un jeu de données réaliste.
  - key: definition-gc
    format: definition
    question: "Que désigne le sigle GC en Java ?"
    choices:
      - {text: "Garbage Collector : le ramasse-miettes, comme G1, ZGC ou Parallel", correct: true}
      - {text: "Global Cache : le cache des classes partagé entre plusieurs JVM", correct: false}
      - {text: "Generational Compiler : le compilateur JIT à plusieurs niveaux", correct: false}
      - {text: "Graal Compiler : le compilateur natif de GraalVM", correct: false}
    answer: "Garbage Collector : G1, ZGC, Shenandoah, Parallel, Serial, Epsilon. Il libère la mémoire des objets devenus inaccessibles."
  - key: definition-g1
    format: definition
    question: "Que désigne G1 dans HotSpot ?"
    choices:
      - {text: "Garbage First, le GC par défaut, qui découpe le tas en régions et vise une pause cible", correct: true}
      - {text: "La première génération du tas, où sont alloués tous les nouveaux objets", correct: false}
      - {text: "Le premier niveau du compilateur JIT, qui compile vite sans optimiser", correct: false}
      - {text: "Un GC à faible latence, qui fait tout son travail en concurrence", correct: false}
    answer: Garbage First, le GC par défaut de HotSpot, qui découpe le tas en régions et vise une durée de pause configurable.
  - key: definition-zgc
    format: definition
    question: "Qu'est-ce que ZGC ?"
    choices:
      - {text: "Un GC à faible latence, qui travaille surtout en concurrence, avec des pauses d'une milliseconde", correct: true}
      - {text: "Un GC qui ne libère jamais rien, pour les tests de performance et les programmes très courts", correct: false}
      - {text: "Un GC à un seul thread, pensé pour les petites machines et les conteneurs d'un seul CPU", correct: false}
      - {text: "Un GC pensé pour le débit, qui arrête l'application pendant chaque collecte complète", correct: false}
    answer: Un GC à faible latence qui fait l'essentiel de son travail en concurrence, avec des pauses de l'ordre de la milliseconde.
  - key: definition-humongous
    format: definition
    question: "Que désigne le terme « objet humongous » ?"
    choices:
      - {text: "Dans G1, un objet de plus d'une demi-région, alloué directement en vieille génération", correct: true}
      - {text: "Dans G1, un objet promu en vieille génération après de nombreuses collectes", correct: false}
      - {text: "Un objet si gros qu'il est rangé hors du tas, dans la mémoire native", correct: false}
      - {text: "Un objet dont le `hashCode` déborde, et qui ne se range plus dans une map", correct: false}
    answer: Dans G1, un objet plus grand que la moitié d'une région, alloué directement dans des régions de la vieille génération.
