notion: jvm-architecture
cards:
  - key: explique-passe-moment-tapes-java-jar
    format: scenario
    question: Explique ce qui se passe entre le moment où tu tapes `java -jar app.jar` et l'exécution de ton code.
    answer: |-
      Le lanceur démarre la JVM, lit le manifest du jar pour trouver la classe principale, puis le **class loader** charge cette classe : lecture du bytecode, vérification, préparation des champs statiques, et initialisation (exécution des blocs static).
      Le code commence ensuite à s'exécuter en mode **interprété**. La JVM compte les appels et les boucles, et les méthodes chaudes sont compilées en code natif par le **JIT** (d'abord C1, rapide à compiler, puis C2, plus optimisé). C'est pour ça qu'une application Java a une phase de *warm-up* : ses performances s'améliorent pendant les premières minutes.
      Parallèlement, le GC gère le heap et les threads système (GC, JIT, finalisation) tournent à côté du thread main.
  - key: compact-object-headers
    format: course
    question: C'est quoi les compact object headers ?
    answer: Des en-têtes d'objet de 8 octets au lieu de 12, par défaut depuis Java 27, qui réduisent l'occupation du heap.
  - key: compressed-oops
    format: course
    question: C'est quoi les compressed oops ?
    answer: Des références sur 32 bits pour des heaps de moins de 32 Go, qui économisent de la mémoire.
