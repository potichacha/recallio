notion: jvm-architecture
lesson: |-
  La **JVM** (Java Virtual Machine) exécute le **bytecode** des fichiers `.class`. Elle a trois grands blocs :

  ```
  .class ──► Sous-système de chargement ──► Zones mémoire ──► Moteur d'exécution
             (chargeurs de classes)          tas, piles,        interpréteur, JIT (C1, C2),
                                             Metaspace,         ramasse-miettes
                                             code cache
  ```

  - **Le chargement des classes** : les *class loaders* trouvent le bytecode (classpath, modules, JAR), le **vérifient**,
    préparent les champs statiques et **initialisent** la classe à son premier usage.
  - **Les zones mémoire** :
    - le **tas** (*heap*), partagé par tous les threads : les objets et les tableaux, géré par le ramasse-miettes ;
    - une **pile** par thread : les appels en cours (variables locales, paramètres) ;
    - le **Metaspace** (mémoire native) : les métadonnées des classes ;
    - le **code cache** : le code natif produit par le JIT ;
    - des compteurs de programme (PC) par thread.
  - **Le moteur d'exécution** : le code démarre **interprété** ; les méthodes chaudes sont compilées en natif par le
    **JIT** (C1 rapidement, puis C2 avec des optimisations poussées) ; le **ramasse-miettes** récupère les objets
    inaccessibles.

  Quelques détails utiles :
  - les **compressed oops** : sous 32 Go de tas, les références tiennent sur 32 bits, ce qui économise de la mémoire ;
  - les **en-têtes d'objets compacts** (Java 25, JEP 519) réduisent l'en-tête de chaque objet de 12 à 8 octets ;
  - HotSpot est la JVM de référence (OpenJDK) ; d'autres existent (OpenJ9, GraalVM).

  **Piège classique** : confondre le tas et la pile. Les objets sont toujours dans le tas (sauf optimisation du JIT) ; la
  pile ne contient que des variables locales, qui peuvent être des **références** vers ces objets.

  **En entretien** : « Chargement des classes, zones mémoire (tas partagé, une pile par thread, Metaspace, code cache),
  moteur d'exécution (interpréteur, JIT, GC) ; le code démarre interprété et chauffe. »
cards:
  - key: explique-passe-moment-tapes-java-jar
    format: scenario
    question: Explique ce qui se passe entre le moment où tu tapes `java -jar app.jar` et l'exécution de ton code.
    answer: |-
      Le lanceur démarre la JVM, lit le manifest du jar pour trouver la classe principale, puis le **class loader** charge cette classe : lecture du bytecode, vérification, préparation des champs statiques, et initialisation (exécution des blocs static).
      Le code commence ensuite à s'exécuter en mode **interprété**. La JVM compte les appels et les boucles, et les méthodes chaudes sont compilées en code natif par le **JIT** (d'abord C1, rapide à compiler, puis C2, plus optimisé). C'est pour ça qu'une application Java a une phase de *warm-up* : ses performances s'améliorent pendant les premières minutes.
      Parallèlement, le GC gère le heap et les threads système (GC, JIT, finalisation) tournent à côté du thread main.
  - key: compact-object-headers
    format: course
    question: C'est quoi les compact object headers ?
    answer: Des en-têtes d'objet de 8 octets au lieu de 12, par défaut depuis Java 27, qui réduisent l'occupation du heap.
  - key: compressed-oops
    format: course
    question: C'est quoi les compressed oops ?
    answer: Des références sur 32 bits pour des heaps de moins de 32 Go, qui économisent de la mémoire.
  - key: trois-blocs
    format: course
    question: Quels sont les trois grands blocs de la JVM ?
    answer: Le sous-système de chargement des classes, les zones mémoire (tas, piles, Metaspace, code cache) et le moteur d'exécution (interpréteur, compilateur JIT, ramasse-miettes).
  - key: zones
    format: course
    question: Quelles zones mémoire sont partagées entre threads, et lesquelles sont propres à chacun ?
    answer: Le tas, le Metaspace et le code cache sont partagés ; chaque thread a sa pile et son compteur de programme.
  - key: vf-pile-objets
    format: true-false
    question: Les objets créés avec `new` sont stockés dans la pile du thread.
    truth: false
    answer: Ils sont dans le tas ; la pile ne contient que des références (sauf optimisation par le JIT).
  - key: vf-interprete
    format: true-false
    question: Au démarrage, la JVM exécute le bytecode en mode interprété.
    truth: true
    answer: Le JIT compile ensuite les méthodes chaudes.
  - key: vf-metaspace
    format: true-false
    question: Les métadonnées des classes sont stockées dans le tas.
    truth: false
    answer: Dans le Metaspace, en mémoire native.
  - key: vf-oops
    format: true-false
    question: Au-delà de 32 Go de tas, la JVM ne peut plus utiliser les références compressées.
    truth: true
    answer: Un tas de 33 Go peut contenir moins d'objets qu'un tas de 31 Go.
  - key: qcm-partage
    format: multiple-choice
    question: Quelles zones sont partagées par tous les threads ?
    choices:
      - text: "Le tas"
        correct: true
      - text: "Le Metaspace"
        correct: true
      - text: "La pile d'appels"
        correct: false
      - text: "Le compteur de programme"
        correct: false
    answer: Pile et compteur de programme sont propres à chaque thread.
  - key: qcm-moteur
    format: multiple-choice
    question: Que contient le moteur d'exécution ?
    choices:
      - text: "L'interpréteur"
        correct: true
      - text: "Le compilateur JIT"
        correct: true
      - text: "Le compilateur `javac`"
        correct: false
      - text: "Maven"
        correct: false
    answer: '`javac` produit le bytecode avant l''exécution, hors de la JVM.'
  - key: qcm-code-cache
    format: multiple-choice
    question: Qu'est-ce que le code cache ?
    choices:
      - text: "La zone où la JVM stocke le code natif produit par le JIT"
        correct: true
      - text: "Le dossier des fichiers `.class`"
        correct: false
      - text: "Un cache HTTP"
        correct: false
      - text: "Le Metaspace"
        correct: false
    answer: S'il se remplit, le JIT s'arrête de compiler et les performances chutent.
  - key: qcm-jvm
    format: multiple-choice
    question: Lesquelles sont des JVM ?
    choices:
      - text: "HotSpot (OpenJDK)"
        correct: true
      - text: "Eclipse OpenJ9"
        correct: true
      - text: "Maven"
        correct: false
      - text: "Tomcat"
        correct: false
    answer: GraalVM aussi ; Tomcat est un conteneur de servlets.
  - key: scenario-junior
    format: scenario
    question: Explique à un développeur junior ce que fait la JVM, et pourquoi Java est « portable ».
    answer: |-
      `javac` compile le code Java en bytecode, un jeu d'instructions indépendant du processeur. La JVM, elle, est un
      programme natif écrit pour chaque système (Linux x64, macOS ARM...) : elle charge ce bytecode, l'exécute
      (d'abord en l'interprétant, puis en compilant les parties chaudes en code machine) et gère la mémoire à notre place
      avec le ramasse-miettes. Le même `.jar` tourne donc partout où il existe une JVM, d'où le « write once, run
      anywhere ». La portabilité s'arrête là où le code dépend du système : chemins, encodages, bibliothèques natives.
  - key: scenario-premieres-requetes
    format: scenario
    question: Les premières requêtes après un déploiement sont nettement plus lentes que les suivantes. Pourquoi, et que faire ?
    answer: |-
      C'est la chauffe de la JVM : au démarrage, les classes sont chargées et le code est interprété ; le JIT ne compile
      les méthodes chaudes qu'après les avoir observées, et les caches (connexions, données) sont vides. Pour atténuer :
      envoyer un trafic de chauffe avant de déclarer l'instance prête (readiness probe), ouvrir les pools de connexions
      au démarrage, utiliser CDS ou le cache AOT du JDK (Java 24+) qui garde le résultat d'une exécution d'entraînement,
      ou une image native GraalVM si le démarrage est critique.
  - key: scenario-gros-tas
    format: scenario
    question: Un collègue veut passer le tas d'un service de 30 Go à 34 Go « pour avoir plus de place ». Qu'en penses-tu ?
    answer: |-
      Au-delà d'environ 32 Go, la JVM ne peut plus utiliser les références compressées (compressed oops) : chaque
      référence passe de 4 à 8 octets. Un tas de 34 Go peut donc contenir moins d'objets utiles qu'un tas de 31 Go, et
      utilise moins bien les caches du processeur. Je vérifierais d'abord le besoin réel (niveau du tas après GC), et si
      plus de mémoire est vraiment nécessaire, je resterais sous 32 Go ou je viserais nettement au-dessus (48 Go et
      plus), en mesurant.
