notion: classloaders
cards:
  - key: trois-class-loaders-principaux
    format: course
    question: Les trois class loaders principaux ?
    answer: Bootstrap, Platform (ex-Extension), Application (System).
  - key: delegation-parent
    format: course
    question: C'est quoi la délégation parent ?
    answer: Un chargeur demande d'abord à son parent et ne charge lui-même qu'en cas d'échec, ce qui protège les classes du JDK.
  - key: signifie-x-cannot-be-cast-to
    format: course
    question: Que signifie `X cannot be cast to X` ?
    answer: La même classe a été chargée par deux class loaders différents.
  - key: fuite-class-loader
    format: course
    question: C'est quoi une fuite de class loader ?
    answer: 'Un chargeur retenu par une référence (thread, static, ThreadLocal) après un redéploiement : ses classes restent en Metaspace.'
