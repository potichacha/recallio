notion: pile-tas
lesson: |-
  - Le **tas** (*heap*) contient **tous les objets** et les tableaux. Il est **partagé** par les threads et géré par le
    **ramasse-miettes**. Sa taille se règle avec `-Xms` (initiale) et `-Xmx` (maximale).
  - La **pile** (*stack*) : **une par thread**. Chaque appel de méthode y empile un **cadre** (*frame*) avec ses variables
    locales, ses paramètres et sa pile d'opérandes ; le cadre disparaît au retour de la méthode. Taille par thread :
    `-Xss` (de 512 Ko à 1 Mo selon la plateforme).

  ```java
  void traiter() {
      int n = 42;                          // la valeur 42 est dans le cadre, sur la pile
      Commande c = new Commande("A1");     // la référence c est sur la pile, l'objet dans le tas
      List<Commande> l = List.of(c);       // l et c désignent des objets du tas
  }                                        // le cadre disparaît ; les objets restent jusqu'au GC
  ```

  - Une variable locale de type **primitif** contient sa valeur ; une variable de type **référence** contient l'adresse
    d'un objet du tas. Les **champs** d'un objet sont dans l'objet, donc dans le tas, même s'ils sont primitifs.
  - Les variables locales sont propres au thread : pas de problème de concurrence. Les objets du tas sont partagés dès
    qu'une référence est partagée.
  - Une **récursion** trop profonde épuise la pile : `StackOverflowError`. Un tas plein : `OutOfMemoryError: Java heap
    space`.
  - L'allocation dans le tas est **très rapide** : chaque thread a son tampon d'allocation (**TLAB**) et alloue par simple
    incrément d'un pointeur.
  - L'**analyse d'échappement** du JIT peut éviter d'allouer dans le tas un objet qui ne sort pas de la méthode.
  - Les **threads virtuels** stockent leur pile dans le tas, par morceaux, ce qui les rend peu coûteux.

  **Piège classique** : croire qu'un `int` champ d'un objet est « sur la pile parce que c'est un primitif ». Ce qui
  compte est où vit la variable : un champ d'objet est dans le tas, une variable locale dans la pile.

  **En entretien** : « Le tas, partagé et géré par le GC, contient les objets ; chaque thread a sa pile de cadres avec ses
  variables locales, qui peuvent référencer des objets du tas. »
cards:
  - key: vivent-objets-crees-avec-new
    format: multiple-choice
    question: Où vivent les objets créés avec `new` ?
    choices:
      - text: Dans la pile (stack) du thread
        correct: false
      - text: Dans le tas (heap)
        correct: true
      - text: Dans le Metaspace
        correct: false
      - text: Dans les registres du processeur
        correct: false
    answer: Les objets sont alloués dans le tas, partagé par les threads et géré par le ramasse-miettes. La pile ne contient que les variables locales et les références vers ces objets ; le Metaspace contient les métadonnées des classes.
  - key: heap-vs-stack
    format: course
    question: "Quelle différence entre le tas (heap) et la pile (stack) ?"
    choices:
      - {text: "Le tas garde les objets, partagé et géré par le GC ; la pile, les cadres des méthodes, une par thread", correct: true}
      - {text: "La pile garde les objets, partagée et gérée par le GC ; le tas, les cadres des méthodes, un par thread", correct: false}
      - {text: "Le tas garde les types primitifs, la pile les objets, où qu'ils soient déclarés dans le code", correct: false}
      - {text: "Le tas et la pile sont une seule zone, coupée en deux selon la taille des objets", correct: false}
    answer: "Le tas contient les objets, partagé entre threads et géré par le GC. La pile contient les cadres des méthodes en cours (variables locales, paramètres), une pile par thread."
  - key: allocation-rapide-java
    format: course
    question: "Pourquoi l'allocation est-elle rapide en Java ?"
    choices:
      - {text: "Grâce aux TLAB : chaque thread alloue par simple incrément de pointeur dans son tampon", correct: true}
      - {text: "Parce que chaque objet est d'abord alloué sur la pile, puis recopié dans le tas", correct: false}
      - {text: "Parce que la JVM réutilise toujours les objets libérés par le GC", correct: false}
      - {text: "Parce que `new` est compilé en appel direct à `malloc`, sans verrou", correct: false}
    answer: 'Grâce aux TLAB : chaque thread alloue par simple incrément de pointeur dans son tampon.'
  - key: taille-defaut-pile-thread
    format: course
    question: "Quelle est la taille par défaut de la pile d'un thread ?"
    choices:
      - {text: "Environ 512 Ko à 1 Mo selon la plateforme, réglable par `-Xss`", correct: true}
      - {text: "Toujours 64 Ko, quelle que soit la plateforme, réglable par `-Xmx`", correct: false}
      - {text: "Illimitée : elle grandit tant que la mémoire le permet", correct: false}
      - {text: "Un quart du tas, partagé entre tous les threads", correct: false}
    answer: Environ 512 Ko à 1 Mo selon la plateforme, réglable avec -Xss.
  - key: champ-primitif
    format: course
    question: "Où est stocké un champ `int` d'un objet ?"
    choices:
      - {text: "Dans l'objet, donc dans le tas : seules les variables locales sont dans la pile", correct: true}
      - {text: "Dans la pile du thread qui a créé l'objet, comme tout type primitif", correct: false}
      - {text: "Dans le Metaspace, avec la description de la classe", correct: false}
      - {text: "Dans un registre du processeur, tant que l'objet est vivant", correct: false}
    answer: "Dans l'objet, donc dans le tas ; seules les variables locales et les paramètres sont dans la pile. Être primitif ne décide pas de l'emplacement."
  - key: vf-locale
    format: true-false
    question: Une variable locale de type référence contient l'objet lui-même.
    truth: false
    answer: Elle contient une référence vers l'objet, qui est dans le tas.
  - key: vf-cadre
    format: true-false
    question: Le cadre d'une méthode disparaît de la pile quand elle se termine.
    truth: true
    answer: Ses variables locales disparaissent ; les objets qu'elle a créés restent tant qu'ils sont référencés.
  - key: vf-recursion
    format: true-false
    question: Une récursion infinie provoque une `OutOfMemoryError`.
    truth: false
    answer: "Elle épuise la pile du thread : `StackOverflowError`."
  - key: vf-partage
    format: true-false
    question: Les variables locales d'une méthode sont visibles par les autres threads.
    truth: false
    answer: Elles sont dans la pile du thread ; les objets qu'elles référencent peuvent en revanche être partagés.
  - key: qcm-pile
    format: multiple-choice
    question: "Que contient le cadre d'une méthode sur la pile ?"
    choices:
      - {text: "Ses variables locales et ses paramètres", correct: true}
      - {text: "Les objets qu'elle crée avec `new`", correct: false}
      - {text: "Les objets désignés par ses paramètres", correct: false}
      - {text: "Le bytecode de sa classe", correct: false}
    answer: "Ses variables locales, ses paramètres et sa pile d'opérandes. Les objets, même désignés par un paramètre, sont dans le tas ; le bytecode est dans le Metaspace."
  - key: qcm-erreurs
    format: multiple-choice
    question: "Quelle association entre une erreur et la zone épuisée est la bonne ?"
    choices:
      - {text: "`StackOverflowError` : la pile d'un thread", correct: true}
      - {text: "`StackOverflowError` : le tas", correct: false}
      - {text: "`OutOfMemoryError: Metaspace` : la pile", correct: false}
      - {text: "`OutOfMemoryError: Java heap space` : le Metaspace", correct: false}
    answer: "`StackOverflowError` épuise la pile d'un thread ; `OutOfMemoryError: Java heap space` le tas ; `OutOfMemoryError: Metaspace` la zone des métadonnées de classes."
  - key: qcm-options
    format: multiple-choice
    question: "Quelle option règle la taille de la pile de chaque thread ?"
    choices:
      - {text: "`-Xss`", correct: true}
      - {text: "`-Xmx`", correct: false}
      - {text: "`-Xms`", correct: false}
      - {text: "`-XX:MaxMetaspaceSize`", correct: false}
    answer: "`-Xss` règle la pile de chaque thread ; `-Xmx` la taille maximale du tas, `-Xms` sa taille initiale."
  - key: code-references
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void modifier(int n, StringBuilder sb) {
          n = 99;
          sb.append("!");
      }
      int n = 1;
      StringBuilder sb = new StringBuilder("ok");
      modifier(n, sb);
      System.out.println(n + " " + sb);
      ```
    choices:
      - {text: "`1 ok!`", correct: true}
      - {text: "`99 ok!`", correct: false}
      - {text: "`1 ok`", correct: false}
      - {text: "`99 ok`", correct: false}
    answer: "`1 ok!` : la copie de la valeur ne change pas `n`, la copie de la référence désigne le même objet du tas."
    check:
      output: "1 ok!"
  - key: code-stackoverflow
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static int profondeur(int n) { return profondeur(n + 1); }
      try {
          profondeur(0);
      } catch (StackOverflowError e) {
          System.out.println("pile épuisée");
      }
      ```
    choices:
      - {text: "`pile épuisée`", correct: true}
      - {text: "Rien : la récursion ne finit jamais", correct: false}
      - {text: "Une `OutOfMemoryError`", correct: false}
      - {text: "Une `StackOverflowError` non rattrapée", correct: false}
    answer: "`pile épuisée` : chaque appel ajoute un cadre jusqu'à épuiser la pile, et le `catch` rattrape la `StackOverflowError`."
    check:
      output: "pile épuisée"
  - key: code-thread-pile
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] resultats = new int[2];
      Thread a = new Thread(() -> { int local = 10; resultats[0] = local * 2; });
      Thread b = new Thread(() -> { int local = 20; resultats[1] = local * 2; });
      a.start(); b.start(); a.join(); b.join();
      System.out.println(resultats[0] + " " + resultats[1]);
      ```
    choices:
      - {text: "`20 40`", correct: true}
      - {text: "`40 40`", correct: false}
      - {text: "`20 20`", correct: false}
      - {text: "`0 0`", correct: false}
    answer: '`20 40` : chaque thread a sa propre variable `local`, dans sa pile ; le tableau, lui, est partagé dans le tas.'
    check:
      output: "20 40"
  - key: code-alias
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> a = new ArrayList<>();
      List<String> b = a;
      b.add("x");
      a = new ArrayList<>();
      System.out.println(a.size() + " " + b.size());
      ```
    choices:
      - {text: "`0 1`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`0 0`", correct: false}
      - {text: "`1 0`", correct: false}
    answer: '`0 1` : `a` et `b` désignaient le même objet ; réaffecter `a` ne change pas `b`.'
    check:
      output: "0 1"
  - key: definition-tlab
    format: definition
    question: "Que désigne le sigle TLAB ?"
    choices:
      - {text: "Thread-Local Allocation Buffer : le tampon où chaque thread alloue ses objets", correct: true}
      - {text: "Thread Lock Acquisition Barrier : la barrière posée à chaque prise de verrou", correct: false}
      - {text: "Tiered Loop Analysis Block : le bloc de boucle analysé par le JIT", correct: false}
      - {text: "Total Live Allocation Bytes : les octets vivants après une collecte", correct: false}
    answer: "Thread-Local Allocation Buffer : un tampon du tas réservé à un thread, où il alloue par simple incrément de pointeur, sans synchronisation."
  - key: definition-tas
    format: definition
    question: "Qu'est-ce que le tas (heap) de la JVM ?"
    choices:
      - {text: "La zone partagée où vivent les objets et les tableaux, gérée par le GC", correct: true}
      - {text: "La zone propre à chaque thread, qui garde un cadre par appel de méthode", correct: false}
      - {text: "La zone native où sont rangées les métadonnées des classes", correct: false}
      - {text: "La zone où le JIT range le code natif qu'il a compilé", correct: false}
    answer: La zone mémoire partagée où vivent les objets et les tableaux, gérée par le ramasse-miettes.
  - key: definition-pile
    format: definition
    question: "Qu'est-ce que la pile (stack) d'un thread ?"
    choices:
      - {text: "La zone propre à chaque thread, avec un cadre par appel de méthode en cours", correct: true}
      - {text: "La zone partagée où vivent les objets et les tableaux, gérée par le GC", correct: false}
      - {text: "La file des tâches en attente dans un pool de threads", correct: false}
      - {text: "La zone où le JIT range le code natif qu'il a compilé", correct: false}
    answer: La zone mémoire propre à chaque thread, qui contient un cadre par appel de méthode en cours (variables locales, paramètres).
  - key: definition-cadre
    format: definition
    question: "Qu'est-ce qu'un cadre (frame) sur la pile ?"
    choices:
      - {text: "L'espace réservé sur la pile pour un appel de méthode, libéré à son retour", correct: true}
      - {text: "Un objet du tas qui garde l'état d'un thread suspendu", correct: false}
      - {text: "Une région de G1, collectée d'un seul bloc", correct: false}
      - {text: "L'en-tête de chaque objet, qui désigne sa classe", correct: false}
    answer: L'espace réservé sur la pile pour un appel de méthode, libéré à son retour.
