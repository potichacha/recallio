notion: pile-tas
cards:
  - key: vivent-objets-crees-avec-new
    format: multiple-choice
    question: Où vivent les objets créés avec `new` ?
    choices:
      - text: Dans la pile (stack) du thread
        correct: false
      - text: Dans le tas (heap)
        correct: true
      - text: Dans le Metaspace
        correct: false
      - text: Dans les registres du processeur
        correct: false
    answer: Les objets sont alloués dans le tas, partagé par les threads et géré par le ramasse-miettes. La pile ne contient que les variables locales et les références vers ces objets ; le Metaspace contient les métadonnées des classes.
  - key: heap-vs-stack
    format: course
    question: Heap vs stack ?
    answer: Heap = objets, partagé, géré par GC. Stack = frames de méthodes, une par thread.
  - key: allocation-rapide-java
    format: course
    question: Pourquoi l'allocation est-elle rapide en Java ?
    answer: 'Grâce aux TLAB : chaque thread alloue par simple incrément de pointeur dans son tampon.'
  - key: taille-defaut-pile-thread
    format: course
    question: Taille par défaut d'une pile de thread ?
    answer: Environ 512 Ko à 1 Mo selon la plateforme, réglable avec -Xss.
  - key: definition-tlab
    format: definition
    question: TLAB
    answer: Thread-Local Allocation Buffer
