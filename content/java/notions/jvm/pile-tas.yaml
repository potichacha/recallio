notion: pile-tas
lesson: |-
  - Le **tas** (*heap*) contient **tous les objets** et les tableaux. Il est **partagé** par les threads et géré par le
    **ramasse-miettes**. Sa taille se règle avec `-Xms` (initiale) et `-Xmx` (maximale).
  - La **pile** (*stack*) : **une par thread**. Chaque appel de méthode y empile un **cadre** (*frame*) avec ses variables
    locales, ses paramètres et sa pile d'opérandes ; le cadre disparaît au retour de la méthode. Taille par thread :
    `-Xss` (de 512 Ko à 1 Mo selon la plateforme).

  ```java
  void traiter() {
      int n = 42;                          // la valeur 42 est dans le cadre, sur la pile
      Commande c = new Commande("A1");     // la référence c est sur la pile, l'objet dans le tas
      List<Commande> l = List.of(c);       // l et c désignent des objets du tas
  }                                        // le cadre disparaît ; les objets restent jusqu'au GC
  ```

  - Une variable locale de type **primitif** contient sa valeur ; une variable de type **référence** contient l'adresse
    d'un objet du tas. Les **champs** d'un objet sont dans l'objet, donc dans le tas, même s'ils sont primitifs.
  - Les variables locales sont propres au thread : pas de problème de concurrence. Les objets du tas sont partagés dès
    qu'une référence est partagée.
  - Une **récursion** trop profonde épuise la pile : `StackOverflowError`. Un tas plein : `OutOfMemoryError: Java heap
    space`.
  - L'allocation dans le tas est **très rapide** : chaque thread a son tampon d'allocation (**TLAB**) et alloue par simple
    incrément d'un pointeur.
  - L'**analyse d'échappement** du JIT peut éviter d'allouer dans le tas un objet qui ne sort pas de la méthode.
  - Les **threads virtuels** stockent leur pile dans le tas, par morceaux, ce qui les rend peu coûteux.

  **Piège classique** : croire qu'un `int` champ d'un objet est « sur la pile parce que c'est un primitif ». Ce qui
  compte est où vit la variable : un champ d'objet est dans le tas, une variable locale dans la pile.

  **En entretien** : « Le tas, partagé et géré par le GC, contient les objets ; chaque thread a sa pile de cadres avec ses
  variables locales, qui peuvent référencer des objets du tas. »
cards:
  - key: vivent-objets-crees-avec-new
    format: multiple-choice
    question: Où vivent les objets créés avec `new` ?
    choices:
      - text: Dans la pile (stack) du thread
        correct: false
      - text: Dans le tas (heap)
        correct: true
      - text: Dans le Metaspace
        correct: false
      - text: Dans les registres du processeur
        correct: false
    answer: Les objets sont alloués dans le tas, partagé par les threads et géré par le ramasse-miettes. La pile ne contient que les variables locales et les références vers ces objets ; le Metaspace contient les métadonnées des classes.
  - key: heap-vs-stack
    format: course
    question: Heap vs stack ?
    answer: Heap = objets, partagé, géré par GC. Stack = frames de méthodes, une par thread.
  - key: allocation-rapide-java
    format: course
    question: Pourquoi l'allocation est-elle rapide en Java ?
    answer: 'Grâce aux TLAB : chaque thread alloue par simple incrément de pointeur dans son tampon.'
  - key: taille-defaut-pile-thread
    format: course
    question: Taille par défaut d'une pile de thread ?
    answer: Environ 512 Ko à 1 Mo selon la plateforme, réglable avec -Xss.
  - key: champ-primitif
    format: course
    question: Où est stocké un champ `int` d'un objet ?
    answer: Dans l'objet, donc dans le tas ; seules les variables locales et les paramètres sont dans la pile.
  - key: vf-locale
    format: true-false
    question: Une variable locale de type référence contient l'objet lui-même.
    truth: false
    answer: Elle contient une référence vers l'objet, qui est dans le tas.
  - key: vf-cadre
    format: true-false
    question: Le cadre d'une méthode disparaît de la pile quand elle se termine.
    truth: true
    answer: Ses variables locales disparaissent ; les objets qu'elle a créés restent tant qu'ils sont référencés.
  - key: vf-recursion
    format: true-false
    question: Une récursion infinie provoque une `OutOfMemoryError`.
    truth: false
    answer: "Elle épuise la pile du thread : `StackOverflowError`."
  - key: vf-partage
    format: true-false
    question: Les variables locales d'une méthode sont visibles par les autres threads.
    truth: false
    answer: Elles sont dans la pile du thread ; les objets qu'elles référencent peuvent en revanche être partagés.
  - key: qcm-pile
    format: multiple-choice
    question: Que contient le cadre d'une méthode sur la pile ?
    choices:
      - text: "Ses variables locales et ses paramètres"
        correct: true
      - text: "Sa pile d'opérandes"
        correct: true
      - text: "Les objets qu'elle crée"
        correct: false
      - text: "Le bytecode de sa classe"
        correct: false
    answer: Les objets sont dans le tas, le bytecode dans le Metaspace.
  - key: qcm-erreurs
    format: multiple-choice
    question: Associez correctement erreur et zone épuisée.
    choices:
      - text: "`StackOverflowError` : la pile d'un thread"
        correct: true
      - text: "`OutOfMemoryError: Java heap space` : le tas"
        correct: true
      - text: "`StackOverflowError` : le tas"
        correct: false
      - text: "`OutOfMemoryError: Metaspace` : la pile"
        correct: false
    answer: Le Metaspace contient les métadonnées des classes.
  - key: qcm-options
    format: multiple-choice
    question: Quelles options règlent ces zones ?
    choices:
      - text: "`-Xmx` : la taille maximale du tas"
        correct: true
      - text: "`-Xss` : la taille de la pile de chaque thread"
        correct: true
      - text: "`-Xss` : la taille du tas"
        correct: false
      - text: "`-Xmx` : le nombre de threads"
        correct: false
    answer: '`-Xms` règle la taille initiale du tas.'
  - key: code-references
    format: code-output
    question: |-
      ```java
      static void modifier(int n, StringBuilder sb) {
          n = 99;
          sb.append("!");
      }
      int n = 1;
      StringBuilder sb = new StringBuilder("ok");
      modifier(n, sb);
      System.out.println(n + " " + sb);
      ```
    answer: '`1 ok!` : la copie de la valeur ne change pas `n`, la copie de la référence désigne le même objet du tas.'
    check:
      output: "1 ok!"
  - key: code-stackoverflow
    format: code-output
    question: |-
      ```java
      static int profondeur(int n) { return profondeur(n + 1); }
      try {
          profondeur(0);
      } catch (StackOverflowError e) {
          System.out.println("pile épuisée");
      }
      ```
    answer: '`pile épuisée` : chaque appel ajoute un cadre jusqu''à épuiser la pile.'
    check:
      output: "pile épuisée"
  - key: code-thread-pile
    format: code-output
    question: |-
      ```java
      int[] resultats = new int[2];
      Thread a = new Thread(() -> { int local = 10; resultats[0] = local * 2; });
      Thread b = new Thread(() -> { int local = 20; resultats[1] = local * 2; });
      a.start(); b.start(); a.join(); b.join();
      System.out.println(resultats[0] + " " + resultats[1]);
      ```
    answer: '`20 40` : chaque thread a sa propre variable `local`, dans sa pile ; le tableau, lui, est partagé dans le tas.'
    check:
      output: "20 40"
  - key: code-alias
    format: code-output
    question: |-
      ```java
      List<String> a = new ArrayList<>();
      List<String> b = a;
      b.add("x");
      a = new ArrayList<>();
      System.out.println(a.size() + " " + b.size());
      ```
    answer: '`0 1` : `a` et `b` désignaient le même objet ; réaffecter `a` ne change pas `b`.'
    check:
      output: "0 1"
  - key: definition-tlab
    format: definition
    question: TLAB
    answer: Thread-Local Allocation Buffer
  - key: definition-tas
    format: definition
    question: Tas (heap)
    answer: La zone mémoire partagée où vivent les objets et les tableaux, gérée par le ramasse-miettes.
  - key: definition-pile
    format: definition
    question: Pile (stack)
    answer: La zone mémoire propre à chaque thread, qui contient un cadre par appel de méthode en cours (variables locales, paramètres).
  - key: definition-cadre
    format: definition
    question: Cadre (frame)
    answer: L'espace réservé sur la pile pour un appel de méthode, libéré à son retour.
