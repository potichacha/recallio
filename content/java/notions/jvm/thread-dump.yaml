notion: thread-dump
cards:
  - key: application-fige-temps-temps-sans-erreur
    format: scenario
    question: L'application se fige de temps en temps, sans erreur dans les logs.
    answer: |-
      Un gel silencieux oriente vers un blocage de threads. L'outil clé est le **thread dump** pris pendant l'incident : il montre l'état de chaque thread, et la JVM détecte et signale explicitement les deadlocks.
      Trois causes fréquentes. Un **deadlock** entre verrous acquis dans des ordres différents. Un **pool de connexions épuisé** parce que des connexions ne sont pas rendues, souvent une transaction qui ne se ferme pas. Et surtout des **appels externes sans timeout** : chaque appel lent immobilise un thread, le pool du serveur sature, et l'application ne répond plus du tout, même pour des requêtes sans rapport.
      C'est pour ça que la règle 'un timeout sur tout appel réseau' n'admet aucune exception.
  - key: prendre-plusieurs-thread-dumps
    format: course
    question: Pourquoi prendre plusieurs thread dumps ?
    answer: Pour distinguer un blocage durable d'un état transitoire.
