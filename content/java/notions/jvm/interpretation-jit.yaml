notion: interpretation-jit
cards:
  - key: c1-vs-c2
    format: course
    question: C1 vs C2 ?
    answer: C1 compile vite avec peu d'optimisations ; C2 compile lentement avec des optimisations agressives basées sur le profil.
  - key: compilation-etagee
    format: course
    question: C'est quoi la compilation étagée ?
    answer: Le passage progressif interprété → C1 → C2 selon la chaleur du code.
  - key: optimisation-jit-plus-importante
    format: course
    question: Quelle est l'optimisation JIT la plus importante ?
    answer: L'inlining, qui permet toutes les autres.
  - key: desoptimisation
    format: course
    question: C'est quoi une désoptimisation ?
    answer: Le retour au code interprété quand une hypothèse du JIT devient fausse.
  - key: application-java-phase-chauffe
    format: course
    question: Pourquoi une application Java a-t-elle une phase de chauffe ?
    answer: Le code commence interprété et n'est compilé et optimisé qu'après avoir été observé.
  - key: definition-jit
    format: definition
    question: JIT
    answer: 'Just-In-Time : compilation à la volée (C1, C2)'
