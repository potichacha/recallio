notion: classes-enveloppes
lesson: |-
  Chaque type primitif a une **classe enveloppe** (*wrapper*), qui en fait un objet :

  | Primitif | Enveloppe | | Primitif | Enveloppe |
  |---|---|---|---|---|
  | `int` | `Integer` | | `double` | `Double` |
  | `long` | `Long` | | `float` | `Float` |
  | `short` | `Short` | | `boolean` | `Boolean` |
  | `byte` | `Byte` | | `char` | `Character` |

  On en a besoin là où Java exige un objet : les **génériques et collections** (`List<Integer>`, jamais
  `List<int>`), une valeur qui peut être **absente** (`null`), la réflexion.

  ```java
  List<Integer> notes = new ArrayList<>();
  notes.add(15);                        // autoboxing : int → Integer

  Integer.MAX_VALUE;                    // 2147483647
  Integer.parseInt("42");               // texte → int
  Integer.toBinaryString(10);           // "1010"
  Integer.compare(3, 7);                // négatif
  Character.isDigit('7');               // true
  Double.isNaN(0.0 / 0);                // true
  ```

  - Les enveloppes sont **immuables** et `final`. Les numériques étendent **`Number`** (`intValue()`,
    `doubleValue()`...).
  - Elles offrent les constantes (`MIN_VALUE`, `MAX_VALUE`) et des méthodes utilitaires `static` (`parseInt`,
    `compare`, `sum`, `max`, `toHexString`).
  - Une enveloppe coûte plus qu'un primitif (un objet sur le tas, une indirection) : dans un calcul, on garde les
    primitifs.
  - Leurs constructeurs (`new Integer(5)`) sont dépréciés pour suppression : on utilise `Integer.valueOf(5)` ou
    l'autoboxing.

  **Piège classique** : comparer deux enveloppes avec `==`. On compare des références : ça « marche » pour les petites
  valeurs mises en cache et échoue au-delà. On utilise `equals` ou on compare des primitifs.

  **En entretien** : « Les enveloppes font des primitifs des objets, pour les collections et l'absence de valeur ;
  elles sont immuables, et on les compare avec `equals`. »
tour:
  - title: Les classes enveloppes
    text: |-
      Chaque type primitif a une classe **enveloppe** : `Integer` pour `int`, `Long`, `Double`, `Boolean`, `Character`…
      Elles permettent de ranger des nombres dans une collection (`List<Integer>`, jamais `List<int>`), d'exprimer une
      absence avec `null`, et offrent des utilitaires : `Integer.MAX_VALUE`, `Integer.parseInt`, `Character.isDigit`.

      Ce sont des objets immuables : on les compare donc avec `equals`, jamais avec `==`.
    example:
      files:
        Main.java: |-
          void main() {
              List<Integer> nombres = new ArrayList<>();
              nombres.add(12);
              nombres.add(7);
              IO.println(nombres + " " + Integer.MAX_VALUE);
              IO.println(Character.isDigit('7') + " " + Character.toUpperCase('é'));
              Integer absent = null;
              IO.println(absent == null);
              IO.println(Integer.valueOf(42).equals(42) + " " + Double.compare(1.5, 2.5));
          }
      output: |-
        [12, 7] 2147483647
        true É
        true
        true -1
cards:
  - key: pourquoi
    format: course
    question: À quoi servent les classes enveloppes ?
    answer: "À manipuler un primitif comme un objet : dans les génériques et collections (`List<Integer>`), pour représenter une valeur absente (`null`), et pour leurs méthodes utilitaires (`parseInt`, `compare`)."
  - key: number
    format: course
    question: Quelle classe parente partagent `Integer`, `Long` et `Double` ?
    answer: '`Number`, qui offre `intValue()`, `longValue()`, `doubleValue()`... `Boolean` et `Character` n''en héritent pas.'
  - key: cout
    format: course
    question: Pourquoi éviter les enveloppes dans un calcul intensif ?
    answer: Chaque valeur est un objet sur le tas, avec une indirection et du travail pour le GC ; un primitif est stocké directement.
  - key: constructeurs
    format: course
    question: Comment obtenir un `Integer` depuis Java 9 ?
    answer: Par l'autoboxing (`Integer n = 5;`) ou `Integer.valueOf(5)`, qui réutilise les instances en cache ; le constructeur est déprécié pour suppression.
  - key: vf-list-int
    format: true-false
    question: "`List<int>` est une déclaration valide."
    truth: false
    answer: "Les génériques n'acceptent que des types objets : `List<Integer>`."
  - key: vf-immuables
    format: true-false
    question: Les classes enveloppes sont immuables.
    truth: true
    answer: Comme `String`, elles ne changent jamais après leur création.
  - key: vf-null
    format: true-false
    question: Une variable `Integer` peut valoir `null`.
    truth: true
    answer: C'est une référence ; un `int`, lui, a toujours une valeur.
  - key: vf-boolean-number
    format: true-false
    question: "`Boolean` étend `Number`."
    truth: false
    answer: Seules les enveloppes numériques étendent `Number`.
  - key: qcm-enveloppe-char
    format: multiple-choice
    question: Quelle est l'enveloppe du type `char` ?
    choices:
      - text: "`Character`"
        correct: true
      - text: "`Char`"
        correct: false
      - text: "`String`"
        correct: false
      - text: "`Integer`"
        correct: false
    answer: Avec `Integer`, c'est la seule dont le nom n'est pas celui du primitif avec une majuscule.
  - key: qcm-usages
    format: multiple-choice
    question: Dans quels cas faut-il une enveloppe plutôt qu'un primitif ?
    choices:
      - text: "Comme élément d'une `List` ou clé d'une `Map`"
        correct: true
      - text: "Pour représenter une valeur absente"
        correct: true
      - text: "Pour un compteur de boucle"
        correct: false
      - text: "Pour un calcul sur un tableau d'un million de nombres"
        correct: false
    answer: Dans les deux derniers cas, le primitif est plus simple et plus rapide.
  - key: qcm-comparer
    format: multiple-choice
    question: Comment comparer correctement deux `Integer` `a` et `b` non nuls ?
    choices:
      - text: "`a.equals(b)`"
        correct: true
      - text: "`a.intValue() == b.intValue()`"
        correct: true
      - text: "`a == b`"
        correct: false
      - text: "`a.hashCode() == b`"
        correct: false
    answer: '`==` compare les références et dépend du cache.'
  - key: qcm-utilitaires
    format: multiple-choice
    question: "Que renvoie `Integer.toString(255, 16)` ?"
    choices:
      - text: "\"ff\""
        correct: true
      - text: "\"255\""
        correct: false
      - text: "\"FF16\""
        correct: false
      - text: "\"11111111\""
        correct: false
    answer: Le second argument est la base.
  - key: trous-generique
    format: fill-in
    question: |-
      Complétez pour déclarer une liste de nombres décimaux :
      ```java
      List<___> mesures = new ArrayList<>();
      ```
    blanks: [[Double]]
    answer: Les génériques demandent l'enveloppe, pas le primitif `double`.
  - key: trous-max
    format: fill-in
    question: |-
      Complétez pour obtenir la plus grande valeur d'un `long` :
      ```java
      long plafond = Long.___;
      ```
    blanks: [[MAX_VALUE]]
    answer: Chaque enveloppe numérique a ses constantes `MIN_VALUE` et `MAX_VALUE`.
  - key: trous-chiffre
    format: fill-in
    question: |-
      Complétez pour tester qu'un caractère est un chiffre :
      ```java
      boolean chiffre = Character.___(c);
      ```
    blanks: [[isDigit]]
    answer: '`Character` regroupe les tests sur les caractères.'
  - key: trous-double-value
    format: fill-in
    question: |-
      Complétez pour obtenir la valeur décimale de n'importe quel `Number` :
      ```java
      double d = nombre.___();
      ```
    blanks: [[doubleValue]]
    answer: '`Number` déclare `doubleValue()`, `intValue()`, `longValue()`...'
  - key: code-utilitaires
    format: code-output
    question: |-
      ```java
      System.out.println(Integer.MAX_VALUE + " " + Integer.toBinaryString(10) + " " + Integer.toString(255, 16));
      ```
    answer: '`2147483647 1010 ff`.'
    check:
      output: "2147483647 1010 ff"
  - key: code-number
    format: code-output
    question: |-
      ```java
      Object o = 42;
      System.out.println((o instanceof Number) + " " + (o instanceof Integer) + " " + ((Number) o).doubleValue());
      ```
    answer: '`true true 42.0` : le `42` a été emballé en `Integer`, qui est un `Number`.'
    check:
      output: "true true 42.0"
  - key: code-list-int
    format: code-output
    question: |-
      ```java
      List<int> notes = new ArrayList<>();
      ```
      Ce code compile-t-il ?
    answer: 'Non : `unexpected type ... required: reference, found: int`.'
    check:
      compiles: false
  - key: code-compare
    format: code-output
    question: |-
      ```java
      System.out.println(Integer.compare(3, 7) + " " + Integer.sum(3, 7) + " " + Integer.max(3, 7));
      ```
    answer: '`-1 10 7`.'
    check:
      output: "-1 10 7"
  - key: bug-egal-egal
    format: bug-fix
    question: |-
      Les tests passent, mais en production deux prix identiques sont jugés différents :
      ```java
      Integer prixA = catalogue.prix(a);
      Integer prixB = catalogue.prix(b);
      if (prixA == prixB) { ... }
      ```
    answer: |-
      ```java
      if (prixA.equals(prixB)) { ... }   // ou Objects.equals(prixA, prixB) s'ils peuvent valoir null
      ```
      `==` compare les références : les petites valeurs des tests sont en cache (le même objet), les prix réels non.
  - key: bug-constructeur-deprecie
    format: bug-fix
    question: |-
      Modernisez :
      ```java
      Integer quantite = new Integer(saisie);
      ```
    answer: |-
      ```java
      int quantite = Integer.parseInt(saisie);
      ```
      Le constructeur est déprécié pour suppression. Pour un primitif, `parseInt` ; pour un `Integer`, `valueOf`.
  - key: bug-calcul-enveloppes
    format: bug-fix
    question: |-
      Ce calcul est lent et crée des millions d'objets :
      ```java
      Double total = 0.0;
      for (double mesure : mesures) {
          total += mesure;
      }
      ```
    answer: |-
      ```java
      double total = 0.0;
      for (double mesure : mesures) {
          total += mesure;
      }
      ```
      Avec un `Double`, chaque `+=` déballe, additionne et emballe un nouvel objet. Un `double` évite toutes ces
      allocations.
  - key: bug-nan
    format: bug-fix
    question: |-
      Ce test ne détecte jamais une mesure invalide :
      ```java
      if (mesure == Double.NaN) {
          rejeter();
      }
      ```
    answer: |-
      ```java
      if (Double.isNaN(mesure)) {
          rejeter();
      }
      ```
      `NaN` n'est égal à rien, pas même à lui-même : `==` vaut toujours `false`. `Double.isNaN` est le seul test fiable.
