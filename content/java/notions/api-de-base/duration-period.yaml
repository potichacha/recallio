notion: duration-period
lesson: |-
  Deux types de durées :

  - **`Duration`** : une durée **exacte**, en secondes et nanosecondes (`PT1H30M`). Pour des instants et des heures :
    un délai d'expiration, un temps de réponse.
  - **`Period`** : une durée **calendaire**, en années, mois et jours (`P1Y2M3D`). Pour des dates : un âge, un abonnement
    d'un mois.

  ```java
  Duration.ofMinutes(90);                                  // PT1H30M
  Duration.between(debut, fin).toMillis();                 // entre deux Instant ou LocalTime
  Period.between(naissance, aujourdhui).getYears();        // l'âge
  LocalDate.of(2025, 1, 31).plus(Period.ofMonths(1));      // 2025-02-28
  ChronoUnit.DAYS.between(d1, d2);                         // un nombre total de jours
  ```

  La différence se voit lors d'un changement d'heure : à Paris, la nuit du 29 au 30 mars 2025 ne dure que 23 heures.
  - `zdt.plus(Period.ofDays(1))` garde la **même heure locale** le lendemain ;
  - `zdt.plus(Duration.ofDays(1))` ajoute **24 heures exactes**, et décale l'heure affichée.

  - `Period.getDays()` ne renvoie que la composante « jours » (`P2M` donne 0), pas un total : pour un nombre total de
    jours, `ChronoUnit.DAYS.between`.
  - `Duration.between` refuse deux `LocalDate` (elles n'ont pas d'heure) : `UnsupportedTemporalTypeException`.
  - Un délai typé `Duration` dit son unité ; un `long timeout` laisse deviner (millisecondes ? secondes ?).

  **Piège classique** : calculer un âge par `jours / 365`. Les années bissextiles le faussent autour de l'anniversaire ;
  `Period.between(naissance, aujourdhui).getYears()` est exact.

  **En entretien** : « `Duration` pour du temps exact, `Period` pour du calendrier ; `getDays()` d'une `Period` n'est pas
  un total de jours. »
tour:
  - title: Duration et Period
    text: |-
      `Duration` mesure une durée en secondes et nanosecondes, pour des heures et des minutes :
      `Duration.ofMinutes(135)`. `Period` mesure en années, mois et jours, pour des dates :
      `Period.between(naissance, jour)`.

      La différence compte : un jour n'a pas toujours 24 heures (au changement d'heure), ni un mois 30 jours.
      `ChronoUnit.DAYS.between(a, b)` donne un simple nombre de jours.
    example:
      files:
        Main.java: |-
          void main() {
              Duration film = Duration.ofMinutes(135);
              IO.println(film + " " + film.toHours() + "h" + film.toMinutesPart());

              LocalDate naissance = LocalDate.of(1990, 4, 12);
              LocalDate jour = LocalDate.of(2026, 11, 5);
              Period age = Period.between(naissance, jour);
              IO.println(age + " : " + age.getYears() + " ans et " + age.getMonths() + " mois");
              IO.println(ChronoUnit.DAYS.between(naissance, jour) + " jours");
          }
      output: |-
        PT2H15M 2h15
        P36Y6M24D : 36 ans et 6 mois
        13356 jours
cards:
  - key: duration-vs-period
    format: course
    question: "Quelle différence entre `Duration` et `Period` ?"
    choices:
      - {text: "`Duration` mesure du temps exact (secondes, nanos) ; `Period`, du calendrier (années, mois, jours)", correct: true}
      - {text: "`Duration` mesure du calendrier (années, mois, jours) ; `Period`, du temps exact (secondes, nanos)", correct: false}
      - {text: "`Duration` se calcule entre deux `LocalDate` ; `Period`, entre deux `Instant`", correct: false}
      - {text: "Aucune : `Period` est l'ancien nom de `Duration`, gardé pour la compatibilité", correct: false}
    answer: "`Duration` est une durée exacte en secondes et nanosecondes ; `Period` une durée calendaire en années, mois et jours, dont la longueur réelle dépend des dates."
  - key: age
    format: course
    question: Comment calculer l'âge d'une personne ?
    choices:
      - {text: "`Period.between(naissance, aujourdhui).getYears()`", correct: true}
      - {text: "`ChronoUnit.DAYS.between(naissance, aujourdhui) / 365`", correct: false}
      - {text: "`aujourdhui.getYear() - naissance.getYear()`", correct: false}
      - {text: "`Duration.between(naissance, aujourdhui).toDays() / 365`", correct: false}
    answer: "`Period.between(naissance, aujourdhui).getYears()` tient compte des années bissextiles et des mois de longueurs différentes. La différence des années se trompe avant l'anniversaire."
  - key: get-days
    format: course
    question: Que renvoie `Period.between(1er janvier, 1er mars).getDays()` ?
    choices:
      - {text: "`0` : la période vaut `P2M`, deux mois et zéro jour", correct: true}
      - {text: "`59` : le nombre total de jours entre les deux dates", correct: false}
      - {text: "`60` : deux mois comptés à trente jours chacun", correct: false}
      - {text: "`31` : les jours du seul mois de janvier", correct: false}
    answer: "0 : la période vaut `P2M`, deux mois et zéro jour. Pour un total de jours, `ChronoUnit.DAYS.between`."
  - key: changement-heure
    format: course
    question: Pourquoi `plus(Period.ofDays(1))` et `plus(Duration.ofDays(1))` peuvent-ils différer ?
    choices:
      - {text: "Un jour de changement d'heure dure 23 ou 25 heures : `Period` garde l'heure locale", correct: true}
      - {text: "`Duration.ofDays(1)` ignore les années bissextiles, contrairement à `Period`", correct: false}
      - {text: "`Period` ajoute 24 heures exactes ; `Duration` garde l'heure locale", correct: false}
      - {text: "Ils ne diffèrent jamais : un jour vaut toujours 24 heures dans `java.time`", correct: false}
    answer: "Lors d'un changement d'heure, un jour calendaire dure 23 ou 25 heures : `Period` garde l'heure locale, `Duration` ajoute 24 heures exactes."
  - key: vf-iso
    format: true-false
    question: "`Duration.ofMinutes(90).toString()` vaut `PT1H30M`."
    truth: true
    answer: C'est le format ISO 8601 des durées.
  - key: vf-duration-dates
    format: true-false
    question: "`Duration.between` accepte deux `LocalDate`."
    truth: false
    answer: "Il lève une `UnsupportedTemporalTypeException` : une `LocalDate` n'a pas de secondes. On utilise `Period` ou `ChronoUnit.DAYS`."
  - key: vf-period-total
    format: true-false
    question: "`Period.getDays()` renvoie le nombre total de jours de la période."
    truth: false
    answer: Il renvoie seulement la composante jours, à côté des mois et des années.
  - key: vf-age-365
    format: true-false
    question: Diviser le nombre de jours par 365 donne toujours l'âge exact.
    truth: false
    answer: Les années bissextiles décalent le résultat autour de l'anniversaire.
  - key: qcm-type
    format: multiple-choice
    question: Quel type pour la durée de validité d'un jeton (15 minutes) ?
    choices:
      - text: "`Duration.ofMinutes(15)`"
        correct: true
      - text: "`Period.ofDays(15)`"
        correct: false
      - text: "`LocalTime.of(0, 15)`"
        correct: false
      - text: "`int quinze = 15`"
        correct: false
    answer: Un délai exact s'exprime en `Duration` ; une `LocalTime` est une heure, pas une durée.
  - key: qcm-abonnement
    format: multiple-choice
    question: Quel type pour un abonnement d'un mois qui se renouvelle à la même date ?
    choices:
      - text: "`Period.ofMonths(1)`"
        correct: true
      - text: "`Duration.ofDays(30)`"
        correct: false
      - text: "`Duration.ofHours(720)`"
        correct: false
      - text: "`ChronoUnit.MONTHS`, seul"
        correct: false
    answer: Un mois calendaire n'a pas une durée fixe.
  - key: qcm-total-jours
    format: multiple-choice
    question: "Laquelle de ces expressions donne le nombre total de jours entre deux `LocalDate` ?"
    choices:
      - {text: "`ChronoUnit.DAYS.between(d1, d2)`", correct: true}
      - {text: "`d1.until(d2).getDays()`", correct: false}
      - {text: "`Period.between(d1, d2).getDays()`", correct: false}
      - {text: "`Duration.between(d1, d2).toDays()`", correct: false}
    answer: "`ChronoUnit.DAYS.between`, comme `d1.until(d2, ChronoUnit.DAYS)`. `getDays` d'une période ignore ses mois et ses années, et `Duration.between` refuse des `LocalDate`."
  - key: qcm-iso
    format: multiple-choice
    question: "Que représente `P1Y2M3D` ?"
    choices:
      - text: "Une `Period` d'un an, deux mois et trois jours"
        correct: true
      - text: "Une `Duration` d'un an, deux minutes et trois secondes"
        correct: false
      - text: "Une date"
        correct: false
      - text: "Un fuseau horaire"
        correct: false
    answer: Le `T` sépare la partie date de la partie heure dans le format ISO des durées (`PT2M` = deux minutes).
  - key: code-duration
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      System.out.println(Duration.ofMinutes(90) + " " + Duration.ofMinutes(90).toHours() + " " + Duration.ofMinutes(90).toMinutesPart());
      ```
    choices:
      - {text: "`PT1H30M 1 30`", correct: true}
      - {text: "`PT90M 1 30`", correct: false}
      - {text: "`PT1H30M 1.5 30`", correct: false}
      - {text: "`PT1H30M 1 90`", correct: false}
    answer: '`PT1H30M 1 30` : `toHours` tronque, `toMinutesPart` donne les minutes restantes.'
    check:
      output: "PT1H30M 1 30"
  - key: code-period
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      System.out.println(Period.between(LocalDate.of(2020, 1, 15), LocalDate.of(2025, 3, 10)));
      ```
    choices:
      - {text: "`P5Y1M23D`", correct: true}
      - {text: "`P5Y2M23D`", correct: false}
      - {text: "`P5Y1M25D`", correct: false}
      - {text: "`P5Y1M24D`", correct: false}
    answer: "`P5Y1M23D` : cinq ans jusqu'au 15 janvier 2025, un mois jusqu'au 15 février, puis vingt-trois jours (février 2025 en compte 28)."
    check:
      output: "P5Y1M23D"
  - key: code-get-days
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      import java.time.temporal.ChronoUnit;
      LocalDate debut = LocalDate.of(2025, 1, 1), fin = LocalDate.of(2025, 3, 1);
      System.out.println(Period.between(debut, fin).getDays() + " " + ChronoUnit.DAYS.between(debut, fin));
      ```
    choices:
      - {text: "`0 59`", correct: true}
      - {text: "`59 59`", correct: false}
      - {text: "`0 60`", correct: false}
      - {text: "`1 59`", correct: false}
    answer: '`0 59` : la période vaut `P2M`, sans composante jours.'
    check:
      output: "0 59"
  - key: code-changement-heure
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      ZonedDateTime avant = ZonedDateTime.of(2025, 3, 29, 12, 0, 0, 0, ZoneId.of("Europe/Paris"));
      System.out.println(avant.plus(Period.ofDays(1)).toLocalTime() + " " + avant.plus(Duration.ofDays(1)).toLocalTime());
      ```
    choices:
      - {text: "`12:00 13:00`", correct: true}
      - {text: "`12:00 12:00`", correct: false}
      - {text: "`13:00 12:00`", correct: false}
      - {text: "`12:00 11:00`", correct: false}
    answer: '`12:00 13:00` : la nuit du passage à l''heure d''été ne dure que 23 heures.'
    check:
      output: "12:00 13:00"
  - key: bug-age
    format: bug-fix
    question: |-
      Le contrôle de majorité refuse parfois un utilisateur le jour de ses 18 ans :
      ```java
      long age = ChronoUnit.DAYS.between(naissance, aujourdhui) / 365;
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`int age = Period.between(naissance, aujourdhui).getYears();`", correct: true}
      - {text: "`long age = Math.round(ChronoUnit.DAYS.between(naissance, aujourdhui) / 365.25);`", correct: false}
      - {text: "`int age = aujourdhui.getYear() - naissance.getYear();`", correct: false}
      - {text: "`long age = ChronoUnit.WEEKS.between(naissance, aujourdhui) / 52;`", correct: false}
    answer: |-
      ```java
      int age = Period.between(naissance, aujourdhui).getYears();
      ```
      Les années bissextiles ajoutent des jours : la division par 365 se trompe autour de l'anniversaire. `Period` compte
      en années de calendrier.
  - key: bug-get-days
    format: bug-fix
    question: |-
      Le séjour du 1er janvier au 1er mars est facturé 0 nuit :
      ```java
      int nuits = Period.between(arrivee, depart).getDays();
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`long nuits = ChronoUnit.DAYS.between(arrivee, depart);`", correct: true}
      - {text: "`int nuits = Period.between(arrivee, depart).getMonths() * 30;`", correct: false}
      - {text: "`long nuits = Duration.between(arrivee, depart).toDays();`", correct: false}
      - {text: "`int nuits = depart.getDayOfMonth() - arrivee.getDayOfMonth();`", correct: false}
    answer: |-
      ```java
      long nuits = ChronoUnit.DAYS.between(arrivee, depart);
      ```
      `getDays` ne renvoie que la composante jours d'une période de deux mois. `ChronoUnit.DAYS.between` donne le total.
  - key: bug-timeout-long
    format: bug-fix
    question: |-
      Un appelant a passé 30 en croyant donner des secondes ; c'étaient des millisecondes :
      ```java
      void configurer(long timeout) { ... }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Prendre une `Duration` : l'appel devient `configurer(Duration.ofSeconds(30))`", correct: true}
      - {text: "Prendre un `int` plutôt qu'un `long`, plus difficile à confondre", correct: false}
      - {text: "Prendre un `Long`, pour pouvoir passer `null` comme valeur par défaut", correct: false}
      - {text: "Multiplier le paramètre par 1000 dans la méthode, pour lire des secondes", correct: false}
    answer: |-
      ```java
      void configurer(Duration timeout) { ... }
      // configurer(Duration.ofSeconds(30))
      ```
      Un `long` ne dit pas son unité. Une `Duration` la rend explicite à l'appel et supprime l'erreur.
  - key: bug-duration-dates
    format: bug-fix
    question: |-
      Ce calcul lève une `UnsupportedTemporalTypeException` :
      ```java
      long jours = Duration.between(debut, fin).toDays();   // deux LocalDate
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`long jours = ChronoUnit.DAYS.between(debut, fin);`", correct: true}
      - {text: "`long jours = Duration.between(debut, fin).toHours() / 24;`", correct: false}
      - {text: "`long jours = Period.between(debut, fin).getDays();`", correct: false}
      - {text: "`long jours = Duration.between(debut, fin).getSeconds() / 86_400;`", correct: false}
    answer: |-
      ```java
      long jours = ChronoUnit.DAYS.between(debut, fin);
      ```
      `Duration` mesure du temps exact et a besoin d'heures ; deux `LocalDate` se comparent en jours de calendrier.
