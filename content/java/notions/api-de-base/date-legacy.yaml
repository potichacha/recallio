notion: date-legacy
lesson: |-
  Avant Java 8, les dates passaient par `java.util.Date`, `java.util.Calendar` et `java.text.SimpleDateFormat`. On les
  rencontre encore dans du code ancien et dans quelques API (JDBC ancien, bibliothèques).

  | Type | Ce qu'il est vraiment | Défauts |
  |---|---|---|
  | `Date` | un **instant** (millisecondes depuis 1970) | **mutable** (`setTime`), `toString` dans le fuseau par défaut, `getYear()` compte depuis 1900 |
  | `Calendar` | une date dans un fuseau | mutable, **mois de 0 à 11**, API verbeuse |
  | `SimpleDateFormat` | un formateur | **pas thread-safe** |
  | `java.sql.Date`, `Timestamp` | des sous-classes de `Date` pour JDBC | héritage trompeur (`Timestamp` casse `equals`) |

  Les ponts vers `java.time` :

  ```java
  Instant i = date.toInstant();                 Date d = Date.from(instant);
  ZonedDateTime z = gregorianCalendar.toZonedDateTime();
  LocalDate l = sqlDate.toLocalDate();          java.sql.Date s = java.sql.Date.valueOf(localDate);
  LocalDateTime t = timestamp.toLocalDateTime(); Timestamp ts = Timestamp.valueOf(localDateTime);
  ```

  Règle de migration : on convertit **aux frontières** (à l'entrée et à la sortie d'une vieille API) et l'on manipule
  `java.time` partout ailleurs. Depuis JDBC 4.2, les pilotes lisent et écrivent directement `LocalDate`,
  `LocalDateTime` et `OffsetDateTime` (`rs.getObject(1, LocalDate.class)`).

  **Piège classique** : `new GregorianCalendar(2025, 12, 25)` pour Noël. Avec les mois de 0 à 11, 12 désigne janvier de
  l'année suivante.

  **En entretien** : « `Date` est un instant mutable, `Calendar` compte les mois à partir de 0, `SimpleDateFormat` n'est
  pas thread-safe ; on convertit vers `java.time` à la frontière. »
cards:
  - key: simpledateformat-thread-safe
    format: course
    question: SimpleDateFormat est-il thread-safe ?
    answer: Non ; DateTimeFormatter l'est.
  - key: date-instant
    format: course
    question: Que représente vraiment un `java.util.Date` ?
    answer: Un instant, en millisecondes depuis le 1er janvier 1970 UTC ; son `toString` l'affiche simplement dans le fuseau par défaut.
  - key: mois-zero
    format: course
    question: Quel est le piège des mois de `Calendar` ?
    answer: "Ils vont de 0 (janvier) à 11 (décembre) : `Calendar.MONTH` vaut 1 en février, et un mois 12 déborde sur l'année suivante."
  - key: conversion
    format: course
    question: Comment convertir entre `Date` et `java.time` ?
    answer: '`date.toInstant()` et `Date.from(instant)` ; pour `java.sql.Date`, `toLocalDate()` et `java.sql.Date.valueOf(localDate)`.'
  - key: vf-mutable
    format: true-false
    question: "`java.util.Date` est immuable."
    truth: false
    answer: '`setTime` le modifie : il faut des copies défensives.'
  - key: vf-get-year
    format: true-false
    question: "`date.getYear()` renvoie l'année complète, par exemple 2025."
    truth: false
    answer: Il renvoie l'année moins 1900 (125), et il est déprécié.
  - key: vf-jdbc
    format: true-false
    question: Depuis JDBC 4.2, on peut lire une colonne `DATE` directement en `LocalDate`.
    truth: true
    answer: Avec `resultSet.getObject(colonne, LocalDate.class)`.
  - key: vf-calendar-mois
    format: true-false
    question: Dans `Calendar`, février vaut 2.
    truth: false
    answer: "Février vaut 1 : les mois commencent à 0."
  - key: qcm-conversion
    format: multiple-choice
    question: Comment obtenir un `Instant` à partir d'un `java.util.Date` ?
    choices:
      - text: "`date.toInstant()`"
        correct: true
      - text: "`Instant.ofEpochMilli(date.getTime())`"
        correct: true
      - text: "`Instant.parse(date.toString())`"
        correct: false
      - text: "`(Instant) date`"
        correct: false
    answer: Le `toString` de `Date` n'est pas au format ISO.
  - key: qcm-defauts
    format: multiple-choice
    question: Quels sont les défauts de `Date` et `Calendar` ?
    choices:
      - text: "Ils sont mutables"
        correct: true
      - text: "Les mois de `Calendar` commencent à 0"
        correct: true
      - text: "Ils ne savent pas représenter un instant"
        correct: false
      - text: "Ils sont `final`"
        correct: false
    answer: '`Date` représente bien un instant ; c''est son API qui est trompeuse.'
  - key: qcm-noel
    format: multiple-choice
    question: Comment créer correctement Noël 2025 avec `GregorianCalendar` ?
    choices:
      - text: "`new GregorianCalendar(2025, Calendar.DECEMBER, 25)`"
        correct: true
      - text: "`new GregorianCalendar(2025, 11, 25)`"
        correct: true
      - text: "`new GregorianCalendar(2025, 12, 25)`"
        correct: false
      - text: "`new GregorianCalendar(25, 12, 2025)`"
        correct: false
    answer: Décembre vaut 11 ; les constantes `Calendar.DECEMBER` évitent l'erreur.
  - key: qcm-strategie
    format: multiple-choice
    question: Une vieille bibliothèque renvoie des `Date`. Que faire dans le code neuf ?
    choices:
      - text: "Convertir en `java.time` dès la réception, et reconvertir seulement pour l'appeler"
        correct: true
      - text: "Propager les `Date` dans tout le domaine"
        correct: false
      - text: "Les convertir en `String` pour les manipuler"
        correct: false
      - text: "Utiliser `Calendar` pour les calculs"
        correct: false
    answer: La vieille API reste confinée à sa frontière.
  - key: code-calendar-mois
    format: code-output
    question: |-
      ```java
      GregorianCalendar c = new GregorianCalendar(2025, 1, 1);
      System.out.println(c.get(Calendar.MONTH) + " " + c.toZonedDateTime().getMonth());
      ```
    answer: '`1 FEBRUARY` : pour `Calendar`, 1 est février.'
    check:
      output: "1 FEBRUARY"
  - key: code-conversion
    format: code-output
    question: |-
      ```java
      import java.time.*;
      Date d = new Date(0);
      System.out.println(d.toInstant() + " " + Date.from(Instant.EPOCH).getTime());
      ```
    answer: '`1970-01-01T00:00:00Z 0`.'
    check:
      output: "1970-01-01T00:00:00Z 0"
  - key: code-mutable
    format: code-output
    question: |-
      ```java
      Date d = new Date(0);
      Date copie = d;
      copie.setTime(1000);
      System.out.println(d.getTime());
      ```
    answer: '`1000` : les deux variables désignent le même objet mutable.'
    check:
      output: "1000"
  - key: code-sql-date
    format: code-output
    question: |-
      ```java
      import java.time.*;
      System.out.println(java.sql.Date.valueOf(LocalDate.of(2025, 3, 14)).toLocalDate());
      ```
    answer: '`2025-03-14`.'
    check:
      output: "2025-03-14"
  - key: bug-mois-12
    format: bug-fix
    question: |-
      La date de clôture tombe le 31 janvier de l'année suivante :
      ```java
      Calendar cloture = new GregorianCalendar(annee, 12, 31);
      ```
    answer: |-
      ```java
      LocalDate cloture = LocalDate.of(annee, Month.DECEMBER, 31);
      ```
      Avec `Calendar`, décembre vaut 11 : le mois 12 déborde sur janvier. `java.time` compte de 1 à 12 et nomme les mois.
  - key: bug-get-year
    format: bug-fix
    question: |-
      Le rapport affiche l'année « 125 » :
      ```java
      int annee = facture.date().getYear();   // java.util.Date
      ```
    answer: |-
      ```java
      int annee = facture.date().toInstant().atZone(ZoneId.of("Europe/Paris")).getYear();
      ```
      `Date.getYear()` compte depuis 1900 (et est déprécié). En passant par `java.time`, l'année est juste, et le fuseau
      (qui décide de l'année d'une facture du 31 décembre à 23 h UTC) est explicite.
  - key: bug-date-champ
    format: bug-fix
    question: |-
      Une entité expose sa date de création, et un appelant l'a modifiée :
      ```java
      public Date creeLe() { return creeLe; }
      // ailleurs : entite.creeLe().setTime(0);
      ```
    answer: |-
      ```java
      private final Instant creeLe;
      public Instant creeLe() { return creeLe; }
      ```
      `Date` est mutable : la renvoyer, c'est donner accès à l'état interne. `Instant` est immuable.
  - key: bug-jdbc-ancien
    format: bug-fix
    question: |-
      Modernisez cette lecture de colonne `DATE` :
      ```java
      java.sql.Date brute = resultat.getDate("naissance");
      LocalDate naissance = new java.util.Date(brute.getTime()).toInstant()
              .atZone(ZoneId.systemDefault()).toLocalDate();
      ```
    answer: |-
      ```java
      LocalDate naissance = resultat.getObject("naissance", LocalDate.class);
      ```
      Depuis JDBC 4.2, le pilote lit directement une `LocalDate`, sans passer par un instant ni par le fuseau par défaut
      (qui pouvait décaler la date d'un jour).
