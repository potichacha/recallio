notion: date-legacy
lesson: |-
  Avant Java 8, les dates passaient par `java.util.Date`, `java.util.Calendar` et `java.text.SimpleDateFormat`. On les
  rencontre encore dans du code ancien et dans quelques API (JDBC ancien, bibliothèques).

  | Type | Ce qu'il est vraiment | Défauts |
  |---|---|---|
  | `Date` | un **instant** (millisecondes depuis 1970) | **mutable** (`setTime`), `toString` dans le fuseau par défaut, `getYear()` compte depuis 1900 |
  | `Calendar` | une date dans un fuseau | mutable, **mois de 0 à 11**, API verbeuse |
  | `SimpleDateFormat` | un formateur | **pas thread-safe** |
  | `java.sql.Date`, `Timestamp` | des sous-classes de `Date` pour JDBC | héritage trompeur (`Timestamp` casse `equals`) |

  Les ponts vers `java.time` :

  ```java
  Instant i = date.toInstant();                 Date d = Date.from(instant);
  ZonedDateTime z = gregorianCalendar.toZonedDateTime();
  LocalDate l = sqlDate.toLocalDate();          java.sql.Date s = java.sql.Date.valueOf(localDate);
  LocalDateTime t = timestamp.toLocalDateTime(); Timestamp ts = Timestamp.valueOf(localDateTime);
  ```

  Règle de migration : on convertit **aux frontières** (à l'entrée et à la sortie d'une vieille API) et l'on manipule
  `java.time` partout ailleurs. Depuis JDBC 4.2, les pilotes lisent et écrivent directement `LocalDate`,
  `LocalDateTime` et `OffsetDateTime` (`rs.getObject(1, LocalDate.class)`).

  **Piège classique** : `new GregorianCalendar(2025, 12, 25)` pour Noël. Avec les mois de 0 à 11, 12 désigne janvier de
  l'année suivante.

  **En entretien** : « `Date` est un instant mutable, `Calendar` compte les mois à partir de 0, `SimpleDateFormat` n'est
  pas thread-safe ; on convertit vers `java.time` à la frontière. »
cards:
  - key: simpledateformat-thread-safe
    format: course
    question: "`SimpleDateFormat` est-il thread-safe ?"
    choices:
      - {text: "Non : il garde un état interne ; `DateTimeFormatter`, immuable, l'est", correct: true}
      - {text: "Oui, depuis Java 8, comme `DateTimeFormatter`", correct: false}
      - {text: "Oui, à condition d'être déclaré `static final`", correct: false}
      - {text: "Non, et `DateTimeFormatter` ne l'est pas non plus", correct: false}
    answer: "Non : il modifie un `Calendar` interne à chaque appel. `DateTimeFormatter` est immuable, et se partage sans risque."
  - key: date-instant
    format: course
    question: Que représente vraiment un `java.util.Date` ?
    choices:
      - {text: "Un instant, en millisecondes depuis le 1er janvier 1970 UTC", correct: true}
      - {text: "Une date du calendrier, sans heure ni fuseau, comme `LocalDate`", correct: false}
      - {text: "Une date et une heure dans le fuseau par défaut de la machine", correct: false}
      - {text: "Un nombre de jours écoulés depuis le 1er janvier 1900", correct: false}
    answer: Un instant, en millisecondes depuis le 1er janvier 1970 UTC ; son `toString` l'affiche simplement dans le fuseau par défaut.
  - key: mois-zero
    format: course
    question: Quel est le piège des mois de `Calendar` ?
    choices:
      - {text: "Ils vont de 0 (janvier) à 11 (décembre)", correct: true}
      - {text: "Ils vont de 1 (janvier) à 12 (décembre), comme les jours", correct: false}
      - {text: "Ils vont de 1 à 12, mais les jours du mois de 0 à 30", correct: false}
      - {text: "Ils vont de 0 à 11, mais seulement dans le fuseau UTC", correct: false}
    answer: "Ils vont de 0 (janvier) à 11 (décembre) : `Calendar.MONTH` vaut 1 en février, et un mois 12 déborde sur l'année suivante."
  - key: conversion
    format: course
    question: Comment convertir entre `Date` et `java.time` ?
    choices:
      - {text: "`date.toInstant()` et `Date.from(instant)`", correct: true}
      - {text: "`(Instant) date` et `(Date) instant`", correct: false}
      - {text: "`Instant.parse(date.toString())` et `Date.parse(instant.toString())`", correct: false}
      - {text: "`date.toLocalDate()` et `Date.of(localDate)`", correct: false}
    answer: '`date.toInstant()` et `Date.from(instant)` ; pour `java.sql.Date`, `toLocalDate()` et `java.sql.Date.valueOf(localDate)`.'
  - key: vf-mutable
    format: true-false
    question: "`java.util.Date` est immuable."
    truth: false
    answer: '`setTime` le modifie : il faut des copies défensives.'
  - key: vf-get-year
    format: true-false
    question: "`date.getYear()` renvoie l'année complète, par exemple 2025."
    truth: false
    answer: Il renvoie l'année moins 1900 (125), et il est déprécié.
  - key: vf-jdbc
    format: true-false
    question: Depuis JDBC 4.2, on peut lire une colonne `DATE` directement en `LocalDate`.
    truth: true
    answer: Avec `resultSet.getObject(colonne, LocalDate.class)`.
  - key: vf-calendar-mois
    format: true-false
    question: Dans `Calendar`, février vaut 2.
    truth: false
    answer: "Février vaut 1 : les mois commencent à 0."
  - key: qcm-conversion
    format: multiple-choice
    question: "Laquelle de ces expressions donne l'`Instant` d'un `java.util.Date` ?"
    choices:
      - {text: "`date.toInstant()`", correct: true}
      - {text: "`Instant.ofEpochSecond(date.getTime())`", correct: false}
      - {text: "`Instant.parse(date.toString())`", correct: false}
      - {text: "`(Instant) date`", correct: false}
    answer: "`toInstant()`, comme `Instant.ofEpochMilli(date.getTime())`. `getTime()` compte des millisecondes, pas des secondes, et le `toString` de `Date` n'est pas au format ISO."
  - key: qcm-defauts
    format: multiple-choice
    question: "Lequel de ces défauts est bien celui de `Date` et `Calendar` ?"
    choices:
      - {text: "Ils sont mutables", correct: true}
      - {text: "Ils ne savent pas représenter un instant", correct: false}
      - {text: "Ils sont `final`", correct: false}
      - {text: "Ils ignorent les millisecondes", correct: false}
    answer: "Mutables, ils ne se partagent pas sans copie défensive (et les mois de `Calendar` commencent à 0). `Date` représente bien un instant, à la milliseconde : c'est son API qui est trompeuse."
  - key: qcm-noel
    format: multiple-choice
    question: "Laquelle de ces lignes crée Noël 2025 avec `GregorianCalendar` ?"
    choices:
      - {text: "`new GregorianCalendar(2025, Calendar.DECEMBER, 25)`", correct: true}
      - {text: "`new GregorianCalendar(2025, 12, 25)`", correct: false}
      - {text: "`new GregorianCalendar(2025, Calendar.DECEMBER + 1, 25)`", correct: false}
      - {text: "`new GregorianCalendar(25, 12, 2025)`", correct: false}
    answer: "Décembre vaut 11 : la constante `Calendar.DECEMBER` évite l'erreur. Le mois 12 déborde sur janvier 2026."
  - key: qcm-strategie
    format: multiple-choice
    question: Une vieille bibliothèque renvoie des `Date`. Que faire dans le code neuf ?
    choices:
      - {text: "Convertir en `java.time` dès la réception, et reconvertir seulement pour l'appeler", correct: true}
      - {text: "Propager les `Date` dans tout le domaine, pour éviter les conversions", correct: false}
      - {text: "Les convertir en `String` pour les manipuler sans dépendre de leur API", correct: false}
      - {text: "Faire les calculs avec `Calendar`, qui corrige les défauts de `Date`", correct: false}
    answer: La vieille API reste confinée à sa frontière.
  - key: code-calendar-mois
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      GregorianCalendar c = new GregorianCalendar(2025, 1, 1);
      System.out.println(c.get(Calendar.MONTH) + " " + c.toZonedDateTime().getMonth());
      ```
    choices:
      - {text: "`1 FEBRUARY`", correct: true}
      - {text: "`1 JANUARY`", correct: false}
      - {text: "`2 FEBRUARY`", correct: false}
      - {text: "`0 JANUARY`", correct: false}
    answer: '`1 FEBRUARY` : pour `Calendar`, 1 est février.'
    check:
      output: "1 FEBRUARY"
  - key: code-conversion
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      Date d = new Date(0);
      System.out.println(d.toInstant() + " " + Date.from(Instant.EPOCH).getTime());
      ```
    choices:
      - {text: "`1970-01-01T00:00:00Z 0`", correct: true}
      - {text: "`1970-01-01T01:00:00Z 0`", correct: false}
      - {text: "`1970-01-01T00:00Z 0`", correct: false}
      - {text: "`1970-01-01 0`", correct: false}
    answer: "`1970-01-01T00:00:00Z 0` : `Date(0)` et `Instant.EPOCH` sont le même instant, affiché en UTC par `Instant`."
    check:
      output: "1970-01-01T00:00:00Z 0"
  - key: code-mutable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Date d = new Date(0);
      Date copie = d;
      copie.setTime(1000);
      System.out.println(d.getTime());
      ```
    choices:
      - {text: "`1000`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: '`1000` : les deux variables désignent le même objet mutable.'
    check:
      output: "1000"
  - key: code-sql-date
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      System.out.println(java.sql.Date.valueOf(LocalDate.of(2025, 3, 14)).toLocalDate());
      ```
    choices:
      - {text: "`2025-03-14`", correct: true}
      - {text: "`2025-03-13`", correct: false}
      - {text: "`2025-02-14`", correct: false}
      - {text: "`Fri Mar 14 00:00:00 CET 2025`", correct: false}
    answer: "`2025-03-14` : l'aller-retour entre `LocalDate` et `java.sql.Date` garde la date, sans décalage de fuseau."
    check:
      output: "2025-03-14"
  - key: bug-mois-12
    format: bug-fix
    question: |-
      La date de clôture tombe le 31 janvier de l'année suivante :
      ```java
      Calendar cloture = new GregorianCalendar(annee, 12, 31);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`LocalDate cloture = LocalDate.of(annee, Month.DECEMBER, 31);`", correct: true}
      - {text: "`LocalDate cloture = LocalDate.of(annee, 11, 31);`", correct: false}
      - {text: "`Calendar cloture = new GregorianCalendar(annee - 1, 12, 31);`", correct: false}
      - {text: "`Calendar cloture = new GregorianCalendar(annee, 12, 31, 0, 0);`", correct: false}
    answer: "Avec `Calendar`, décembre vaut 11 : le mois 12 déborde sur janvier. `java.time` compte de 1 à 12 et nomme les mois ; `LocalDate.of(annee, 11, 31)` lèverait une exception, novembre n'ayant que 30 jours."
  - key: bug-get-year
    format: bug-fix
    question: |-
      Le rapport affiche l'année « 125 » :
      ```java
      int annee = facture.date().getYear();   // java.util.Date
      ```
      Pourquoi ?
    choices:
      - {text: "`Date.getYear()` compte depuis 1900 : 2025 devient 125", correct: true}
      - {text: "`getYear()` tronque l'année à trois chiffres, sans le millénaire", correct: false}
      - {text: "Le fuseau par défaut a décalé la date de la facture de 1900 ans", correct: false}
      - {text: "`getYear()` renvoie le numéro du jour dans l'année, ici 125", correct: false}
    answer: |-
      ```java
      int annee = facture.date().toInstant().atZone(ZoneId.of("Europe/Paris")).getYear();
      ```
      `Date.getYear()` compte depuis 1900 (et est déprécié). En passant par `java.time`, l'année est juste, et le fuseau
      (qui décide de l'année d'une facture du 31 décembre à 23 h UTC) est explicite.
  - key: bug-date-champ
    format: bug-fix
    question: |-
      Une entité expose sa date de création, et un appelant l'a modifiée :
      ```java
      public Date creeLe() { return creeLe; }
      // ailleurs : entite.creeLe().setTime(0);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Stocker et renvoyer un `Instant`, immuable", correct: true}
      - {text: "Déclarer le champ `creeLe` en `final`", correct: false}
      - {text: "Renvoyer le champ dans un `Optional<Date>`", correct: false}
      - {text: "Déclarer la méthode `creeLe()` `synchronized`", correct: false}
    answer: "`Date` est mutable : la renvoyer, c'est donner accès à l'état interne, et `final` ne protège que la référence. `Instant` est immuable."
  - key: bug-jdbc-ancien
    format: bug-fix
    question: |-
      Comment moderniser cette lecture de colonne `DATE` ?
      ```java
      java.sql.Date brute = resultat.getDate("naissance");
      LocalDate naissance = new java.util.Date(brute.getTime()).toInstant()
              .atZone(ZoneId.systemDefault()).toLocalDate();
      ```
    choices:
      - {text: "`LocalDate naissance = resultat.getObject(\"naissance\", LocalDate.class);`", correct: true}
      - {text: "`LocalDate naissance = LocalDate.ofInstant(resultat.getDate(\"naissance\").toInstant(), ZoneOffset.UTC);`", correct: false}
      - {text: "`LocalDate naissance = resultat.getLocalDate(\"naissance\");`", correct: false}
      - {text: "`LocalDate naissance = (LocalDate) resultat.getDate(\"naissance\");`", correct: false}
    answer: "Depuis JDBC 4.2, le pilote lit directement une `LocalDate`, sans passer par un instant ni par le fuseau par défaut (qui pouvait décaler la date d'un jour). `java.sql.Date.toInstant()`, lui, lève une `UnsupportedOperationException`."
