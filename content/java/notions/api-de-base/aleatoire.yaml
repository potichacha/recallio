notion: aleatoire
lesson: |-
  Plusieurs générateurs, pour plusieurs besoins :

  | Générateur | Pour |
  |---|---|
  | `Random` | l'usage général ; reproductible avec une **graine** (`new Random(42)`) |
  | `ThreadLocalRandom.current()` | le code concurrent : un générateur par thread, sans contention |
  | `SecureRandom` | la **sécurité** : jetons, mots de passe, clés, identifiants de session |
  | `RandomGenerator` (Java 17) | l'interface commune, avec des algorithmes modernes (`RandomGenerator.of("L64X128MixRandom")`) |
  | `Math.random()` | un `double` dans [0, 1), via un `Random` partagé |

  ```java
  Random r = new Random();
  r.nextInt(6);                   // 0 à 5
  r.nextInt(1, 7);                // 1 à 6 (Java 17)
  r.nextDouble();                 // [0, 1)

  ThreadLocalRandom.current().nextInt(100);

  byte[] jeton = new byte[32];
  new SecureRandom().nextBytes(jeton);
  ```

  - `Random` est un générateur **prévisible** : à partir de quelques sorties, on peut deviner les suivantes. Jamais pour
    la sécurité.
  - Une graine fixe rend une suite reproductible : pratique en test, où l'on **injecte** le générateur.
  - Un `Random` partagé entre threads est correct mais crée de la contention : `ThreadLocalRandom` l'évite.
  - Les bornes : `nextInt(n)` donne [0, n), `nextInt(a, b)` donne [a, b) ; une borne nulle ou négative lève une
    `IllegalArgumentException`.

  **Piège classique** : `Math.abs(r.nextInt()) % n` pour une valeur bornée. C'est biaisé, et `Math.abs` peut renvoyer un
  nombre négatif ; `r.nextInt(n)` est correct.

  **En entretien** : « `Random` pour le général, `ThreadLocalRandom` en concurrence, `SecureRandom` dès qu'il s'agit de
  sécurité ; et un générateur injecté pour des tests reproductibles. »
cards:
  - key: random-vs-threadlocalrandom-vs-securerandom
    format: course
    question: Random vs ThreadLocalRandom vs SecureRandom ?
    answer: Générique / performant en concurrence / cryptographiquement sûr.
  - key: graine
    format: course
    question: Que se passe-t-il si deux `Random` sont créés avec la même graine ?
    answer: "Ils produisent exactement la même suite de valeurs : c'est utile pour des tests reproductibles."
  - key: predictible
    format: course
    question: Pourquoi ne pas générer un jeton de réinitialisation de mot de passe avec `Random` ?
    answer: '`Random` est un générateur linéaire congruentiel : quelques sorties suffisent à prévoir les suivantes. `SecureRandom` est imprévisible.'
  - key: random-generator
    format: course
    question: Qu'apporte `RandomGenerator` (Java 17) ?
    answer: Une interface commune à tous les générateurs (JEP 356) et une famille d'algorithmes modernes, choisis par nom (`RandomGenerator.of("L64X128MixRandom")`).
  - key: vf-borne-exclue
    format: true-false
    question: "`random.nextInt(10)` peut renvoyer 10."
    truth: false
    answer: "La borne est exclue : de 0 à 9."
  - key: vf-secure
    format: true-false
    question: "`SecureRandom` convient pour générer des identifiants de session."
    truth: true
    answer: Il est conçu pour être imprévisible.
  - key: vf-meme-graine
    format: true-false
    question: Deux `new Random(42)` produisent la même suite de nombres.
    truth: true
    answer: La suite ne dépend que de la graine.
  - key: vf-thread-local
    format: true-false
    question: "On crée un `ThreadLocalRandom` avec `new ThreadLocalRandom()`."
    truth: false
    answer: On l'obtient par `ThreadLocalRandom.current()`.
  - key: qcm-de
    format: multiple-choice
    question: Comment simuler un dé à six faces ?
    choices:
      - text: "`random.nextInt(6) + 1`"
        correct: true
      - text: "`random.nextInt(1, 7)`"
        correct: true
      - text: "`random.nextInt(6)`"
        correct: false
      - text: "`random.nextInt(1, 6)`"
        correct: false
    answer: Les bornes supérieures sont exclues.
  - key: qcm-securite
    format: multiple-choice
    question: Quel générateur pour une clé de chiffrement ?
    choices:
      - text: "`SecureRandom`"
        correct: true
      - text: "`Random`"
        correct: false
      - text: "`ThreadLocalRandom`"
        correct: false
      - text: "`Math.random()`"
        correct: false
    answer: Seul `SecureRandom` est cryptographiquement sûr.
  - key: qcm-concurrence
    format: multiple-choice
    question: Dans un serveur très concurrent, quel générateur pour tirer un délai aléatoire ?
    choices:
      - text: "`ThreadLocalRandom.current()`"
        correct: true
      - text: "Un `static Random` partagé"
        correct: false
      - text: "`new SecureRandom()` à chaque appel"
        correct: false
      - text: "`new Random(0)` à chaque appel"
        correct: false
    answer: Un générateur par thread évite la contention ; `new Random(0)` donnerait toujours la même valeur.
  - key: qcm-test
    format: multiple-choice
    question: Comment tester un code qui tire au sort ?
    choices:
      - text: "Lui injecter un `RandomGenerator` créé avec une graine fixe (ou un double)"
        correct: true
      - text: "Relancer le test jusqu'à ce qu'il passe"
        correct: false
      - text: "Appeler `Math.random()` dans le test"
        correct: false
      - text: "Ne pas le tester"
        correct: false
    answer: Le tirage devient reproductible et le test déterministe.
  - key: code-graine
    format: code-output
    question: |-
      ```java
      Random a = new Random(42);
      Random b = new Random(42);
      System.out.println(a.nextInt(100) == b.nextInt(100));
      ```
    answer: '`true` : même graine, même suite.'
    check:
      output: "true"
  - key: code-bornes
    format: code-output
    question: |-
      ```java
      Random r = new Random();
      boolean dansLesBornes = true;
      for (int i = 0; i < 10_000; i++) {
          int x = r.nextInt(5, 10);
          dansLesBornes &= x >= 5 && x < 10;
      }
      System.out.println(dansLesBornes);
      ```
    answer: '`true` : `nextInt(5, 10)` renvoie toujours une valeur de 5 à 9.'
    check:
      output: "true"
  - key: code-generateur
    format: code-output
    question: |-
      ```java
      import java.util.random.RandomGenerator;
      RandomGenerator g = RandomGenerator.of("L64X128MixRandom");
      System.out.println(g.getClass().getSimpleName());
      ```
    answer: '`L64X128MixRandom` : un algorithme moderne choisi par son nom.'
    check:
      output: "L64X128MixRandom"
  - key: code-borne-nulle
    format: code-output
    question: |-
      ```java
      System.out.println(new Random().nextInt(0));
      ```
    answer: "Une `IllegalArgumentException` : la borne doit être positive."
    check:
      throws: IllegalArgumentException
  - key: bug-jeton-random
    format: bug-fix
    question: |-
      Un audit signale ce générateur de jetons de réinitialisation :
      ```java
      private static final Random RANDOM = new Random();
      String jeton() { return Long.toHexString(RANDOM.nextLong()); }
      ```
    answer: |-
      ```java
      private static final SecureRandom RANDOM = new SecureRandom();

      String jeton() {
          byte[] octets = new byte[32];
          RANDOM.nextBytes(octets);
          return HexFormat.of().formatHex(octets);
      }
      ```
      Les sorties de `Random` sont prévisibles. `SecureRandom`, avec assez d'octets (256 bits), rend le jeton impossible
      à deviner.
  - key: bug-modulo-biais
    format: bug-fix
    question: |-
      Ce tirage d'un indice plante parfois avec un indice négatif :
      ```java
      int indice = Math.abs(random.nextInt()) % joueurs.size();
      ```
    answer: |-
      ```java
      int indice = random.nextInt(joueurs.size());
      ```
      `Math.abs(Integer.MIN_VALUE)` est négatif, et le modulo introduit un léger biais. `nextInt(n)` donne une valeur
      uniforme dans [0, n).
  - key: bug-contention
    format: bug-fix
    question: |-
      Le profilage montre de la contention sur ce générateur, appelé par des centaines de threads :
      ```java
      private static final Random RANDOM = new Random();
      long delai() { return 100 + RANDOM.nextInt(50); }
      ```
    answer: |-
      ```java
      long delai() { return 100 + ThreadLocalRandom.current().nextInt(50); }
      ```
      Un `Random` partagé synchronise ses threads sur sa graine. `ThreadLocalRandom` donne un générateur par thread.
  - key: bug-test-aleatoire
    format: bug-fix
    question: |-
      Ce test échoue une fois sur dix :
      ```java
      class Tirage {
          String gagnant(List<String> participants) {
              return participants.get(new Random().nextInt(participants.size()));
          }
      }
      ```
    answer: |-
      ```java
      class Tirage {
          private final RandomGenerator hasard;
          Tirage(RandomGenerator hasard) { this.hasard = hasard; }
          String gagnant(List<String> participants) {
              return participants.get(hasard.nextInt(participants.size()));
          }
      }
      // en test : new Tirage(new Random(42))
      ```
      Le générateur créé dans la méthode rend le résultat imprévisible. Injecté, il peut recevoir une graine fixe en
      test, comme on injecte une `Clock`.
