notion: aleatoire
lesson: |-
  Plusieurs générateurs, pour plusieurs besoins :

  | Générateur | Pour |
  |---|---|
  | `Random` | l'usage général ; reproductible avec une **graine** (`new Random(42)`) |
  | `ThreadLocalRandom.current()` | le code concurrent : un générateur par thread, sans contention |
  | `SecureRandom` | la **sécurité** : jetons, mots de passe, clés, identifiants de session |
  | `RandomGenerator` (Java 17) | l'interface commune, avec des algorithmes modernes (`RandomGenerator.of("L64X128MixRandom")`) |
  | `Math.random()` | un `double` dans [0, 1), via un `Random` partagé |

  ```java
  Random r = new Random();
  r.nextInt(6);                   // 0 à 5
  r.nextInt(1, 7);                // 1 à 6 (Java 17)
  r.nextDouble();                 // [0, 1)

  ThreadLocalRandom.current().nextInt(100);

  byte[] jeton = new byte[32];
  new SecureRandom().nextBytes(jeton);
  ```

  - `Random` est un générateur **prévisible** : à partir de quelques sorties, on peut deviner les suivantes. Jamais pour
    la sécurité.
  - Une graine fixe rend une suite reproductible : pratique en test, où l'on **injecte** le générateur.
  - Un `Random` partagé entre threads est correct mais crée de la contention : `ThreadLocalRandom` l'évite.
  - Les bornes : `nextInt(n)` donne [0, n), `nextInt(a, b)` donne [a, b) ; une borne nulle ou négative lève une
    `IllegalArgumentException`.

  **Piège classique** : `Math.abs(r.nextInt()) % n` pour une valeur bornée. C'est biaisé, et `Math.abs` peut renvoyer un
  nombre négatif ; `r.nextInt(n)` est correct.

  **En entretien** : « `Random` pour le général, `ThreadLocalRandom` en concurrence, `SecureRandom` dès qu'il s'agit de
  sécurité ; et un générateur injecté pour des tests reproductibles. »
cards:
  - key: random-vs-threadlocalrandom-vs-securerandom
    format: course
    question: "Qu'est-ce qui distingue `Random`, `ThreadLocalRandom` et `SecureRandom` ?"
    choices:
      - {text: "`Random` est générique, `ThreadLocalRandom` rapide entre threads, `SecureRandom` sûr en cryptographie", correct: true}
      - {text: "`Random` est sûr en cryptographie, `ThreadLocalRandom` générique, `SecureRandom` rapide entre threads", correct: false}
      - {text: "`Random` est rapide entre threads, `ThreadLocalRandom` sûr en cryptographie, `SecureRandom` générique", correct: false}
      - {text: "Rien : ce sont trois noms du même algorithme, gardés pour la compatibilité des anciens programmes", correct: false}
    answer: "`Random` est le générateur générique ; `ThreadLocalRandom` en donne un par thread, sans contention ; `SecureRandom` est imprévisible, pour les jetons et les clés."
  - key: graine
    format: course
    question: Que se passe-t-il si deux `Random` sont créés avec la même graine ?
    choices:
      - {text: "Ils produisent exactement la même suite de valeurs", correct: true}
      - {text: "Ils produisent des suites différentes : l'heure s'ajoute à la graine", correct: false}
      - {text: "Le second lève une exception : une graine ne sert qu'une fois", correct: false}
      - {text: "Ils partagent leur état : chaque tirage de l'un avance l'autre", correct: false}
    answer: "Ils produisent exactement la même suite de valeurs : c'est utile pour des tests reproductibles."
  - key: predictible
    format: course
    question: Pourquoi ne pas générer un jeton de réinitialisation de mot de passe avec `Random` ?
    choices:
      - {text: "Quelques sorties de `Random` suffisent à prévoir les suivantes", correct: true}
      - {text: "`Random` produit des doublons dès quelques milliers de jetons", correct: false}
      - {text: "`Random` est trop lent pour générer des jetons à la demande", correct: false}
      - {text: "`Random` ne tire que 32 bits, trop peu pour un jeton sûr", correct: false}
    answer: "`Random` est un générateur linéaire congruentiel : quelques sorties suffisent à prévoir les suivantes. Le risque n'est ni la vitesse ni les doublons, mais la prévisibilité ; `SecureRandom` est imprévisible."
  - key: random-generator
    format: course
    question: Qu'apporte `RandomGenerator` (Java 17) ?
    choices:
      - {text: "Une interface commune à tous les générateurs, et des algorithmes modernes choisis par nom", correct: true}
      - {text: "Un générateur cryptographique qui remplace `SecureRandom` dans le JDK", correct: false}
      - {text: "Une version synchronisée de `Random`, enfin sûre entre plusieurs threads", correct: false}
      - {text: "Un générateur à graine fixe, réservé aux tests reproductibles", correct: false}
    answer: Une interface commune à tous les générateurs (JEP 356) et une famille d'algorithmes modernes, choisis par nom (`RandomGenerator.of("L64X128MixRandom")`).
  - key: vf-borne-exclue
    format: true-false
    question: "`random.nextInt(10)` peut renvoyer 10."
    truth: false
    answer: "La borne est exclue : de 0 à 9."
  - key: vf-secure
    format: true-false
    question: "`SecureRandom` convient pour générer des identifiants de session."
    truth: true
    answer: Il est conçu pour être imprévisible.
  - key: vf-meme-graine
    format: true-false
    question: Deux `new Random(42)` produisent la même suite de nombres.
    truth: true
    answer: La suite ne dépend que de la graine.
  - key: vf-thread-local
    format: true-false
    question: "On crée un `ThreadLocalRandom` avec `new ThreadLocalRandom()`."
    truth: false
    answer: On l'obtient par `ThreadLocalRandom.current()`.
  - key: qcm-de
    format: multiple-choice
    question: "Lequel de ces appels simule un dé à six faces, de 1 à 6 ?"
    choices:
      - {text: "`random.nextInt(1, 7)`", correct: true}
      - {text: "`random.nextInt(6)`", correct: false}
      - {text: "`random.nextInt(1, 6)`", correct: false}
      - {text: "`random.nextInt(7)`", correct: false}
    answer: "Les bornes supérieures sont exclues : `nextInt(1, 7)` donne de 1 à 6, comme `nextInt(6) + 1`. `nextInt(1, 6)` ne donne jamais 6, et `nextInt(7)` peut donner 0."
  - key: qcm-securite
    format: multiple-choice
    question: Quel générateur pour une clé de chiffrement ?
    choices:
      - text: "`SecureRandom`"
        correct: true
      - text: "`Random`"
        correct: false
      - text: "`ThreadLocalRandom`"
        correct: false
      - text: "`Math.random()`"
        correct: false
    answer: Seul `SecureRandom` est cryptographiquement sûr.
  - key: qcm-concurrence
    format: multiple-choice
    question: Dans un serveur très concurrent, quel générateur pour tirer un délai aléatoire ?
    choices:
      - text: "`ThreadLocalRandom.current()`"
        correct: true
      - text: "Un `static Random` partagé"
        correct: false
      - text: "`new SecureRandom()` à chaque appel"
        correct: false
      - text: "`new Random(0)` à chaque appel"
        correct: false
    answer: Un générateur par thread évite la contention ; `new Random(0)` donnerait toujours la même valeur.
  - key: qcm-test
    format: multiple-choice
    question: Comment tester un code qui tire au sort ?
    choices:
      - {text: "Lui injecter un `RandomGenerator` créé avec une graine fixe (ou un double)", correct: true}
      - {text: "Relancer le test plusieurs fois, jusqu'à ce qu'il finisse par passer", correct: false}
      - {text: "Appeler `Math.random()` dans le test pour obtenir le même tirage", correct: false}
      - {text: "Ne tester que le cas où le tirage tombe sur la première valeur", correct: false}
    answer: Le tirage devient reproductible et le test déterministe.
  - key: code-graine
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Random a = new Random(42);
      Random b = new Random(42);
      System.out.println(a.nextInt(100) == b.nextInt(100));
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`42`", correct: false}
      - {text: "Tantôt `true`, tantôt `false`", correct: false}
    answer: '`true` : même graine, même suite.'
    check:
      output: "true"
  - key: code-bornes
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Random r = new Random();
      boolean dansLesBornes = true;
      for (int i = 0; i < 10_000; i++) {
          int x = r.nextInt(5, 10);
          dansLesBornes &= x >= 5 && x < 10;
      }
      System.out.println(dansLesBornes);
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`10000`", correct: false}
      - {text: "Tantôt `true`, tantôt `false`", correct: false}
    answer: "`true` : `nextInt(5, 10)` renvoie toujours une valeur de 5 à 9, la borne supérieure étant exclue."
    check:
      output: "true"
  - key: code-generateur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.util.random.RandomGenerator;
      RandomGenerator g = RandomGenerator.of("L64X128MixRandom");
      System.out.println(g.getClass().getSimpleName());
      ```
    choices:
      - {text: "`L64X128MixRandom`", correct: true}
      - {text: "`RandomGenerator`", correct: false}
      - {text: "`Random`", correct: false}
      - {text: "Une `IllegalArgumentException`", correct: false}
    answer: '`L64X128MixRandom` : un algorithme moderne choisi par son nom.'
    check:
      output: "L64X128MixRandom"
  - key: code-borne-nulle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(new Random().nextInt(0));
      ```
    choices:
      - {text: "Une `IllegalArgumentException`", correct: true}
      - {text: "Une `ArithmeticException`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Un entier positif quelconque", correct: false}
    answer: "Une `IllegalArgumentException` : la borne doit être strictement positive. Ce n'est pas une division par zéro, donc pas une `ArithmeticException`."
    check:
      throws: IllegalArgumentException
  - key: bug-jeton-random
    format: bug-fix
    question: |-
      Un audit signale ce générateur de jetons de réinitialisation :
      ```java
      private static final Random RANDOM = new Random();
      String jeton() { return Long.toHexString(RANDOM.nextLong()); }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un `SecureRandom` qui tire 32 octets, encodés en hexadécimal", correct: true}
      - {text: "Un `ThreadLocalRandom`, plus rapide et propre à chaque thread", correct: false}
      - {text: "Un `Random` créé à chaque appel, avec l'heure pour graine", correct: false}
      - {text: "Un `UUID.nameUUIDFromBytes` sur l'identifiant de l'utilisateur", correct: false}
    answer: |-
      ```java
      private static final SecureRandom RANDOM = new SecureRandom();

      String jeton() {
          byte[] octets = new byte[32];
          RANDOM.nextBytes(octets);
          return HexFormat.of().formatHex(octets);
      }
      ```
      Les sorties de `Random` sont prévisibles. `SecureRandom`, avec assez d'octets (256 bits), rend le jeton impossible
      à deviner.
  - key: bug-modulo-biais
    format: bug-fix
    question: |-
      Ce tirage d'un indice plante parfois avec un indice négatif :
      ```java
      int indice = Math.abs(random.nextInt()) % joueurs.size();
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`int indice = random.nextInt(joueurs.size());`", correct: true}
      - {text: "`int indice = random.nextInt(joueurs.size() - 1);`", correct: false}
      - {text: "`int indice = random.nextInt(1, joueurs.size());`", correct: false}
      - {text: "`int indice = random.nextInt() % joueurs.size();`", correct: false}
    answer: |-
      ```java
      int indice = random.nextInt(joueurs.size());
      ```
      `Math.abs(Integer.MIN_VALUE)` est négatif, et le modulo introduit un léger biais. `nextInt(n)` donne une valeur
      uniforme dans [0, n).
  - key: bug-contention
    format: bug-fix
    question: |-
      Le profilage montre de la contention sur ce générateur, appelé par des centaines de threads :
      ```java
      private static final Random RANDOM = new Random();
      long delai() { return 100 + RANDOM.nextInt(50); }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Tirer avec `ThreadLocalRandom.current()`, un générateur par thread", correct: true}
      - {text: "Remplacer le `Random` partagé par un `SecureRandom` partagé", correct: false}
      - {text: "Déclarer la méthode `delai()` en `synchronized`", correct: false}
      - {text: "Déclarer le champ `RANDOM` en `volatile`", correct: false}
    answer: |-
      ```java
      long delai() { return 100 + ThreadLocalRandom.current().nextInt(50); }
      ```
      Un `Random` partagé synchronise ses threads sur sa graine. `ThreadLocalRandom` donne un générateur par thread.
  - key: bug-test-aleatoire
    format: bug-fix
    question: |-
      Ce test échoue une fois sur dix :
      ```java
      class Tirage {
          String gagnant(List<String> participants) {
              return participants.get(new Random().nextInt(participants.size()));
          }
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Injecter le générateur, pour lui donner une graine fixe en test", correct: true}
      - {text: "Créer le `Random` avec `System.nanoTime()` pour graine", correct: false}
      - {text: "Relancer automatiquement le test quand il échoue", correct: false}
      - {text: "Remplacer `new Random()` par un appel à `Math.random()`", correct: false}
    answer: |-
      ```java
      class Tirage {
          private final RandomGenerator hasard;
          Tirage(RandomGenerator hasard) { this.hasard = hasard; }
          String gagnant(List<String> participants) {
              return participants.get(hasard.nextInt(participants.size()));
          }
      }
      // en test : new Tirage(new Random(42))
      ```
      Le générateur créé dans la méthode rend le résultat imprévisible. Injecté, il peut recevoir une graine fixe en
      test, comme on injecte une `Clock`.
