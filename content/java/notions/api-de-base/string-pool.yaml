notion: string-pool
lesson: |-
  Le **pool de chaînes** est une table où la JVM range une seule instance de chaque **littéral** et de chaque
  **constante** de type `String`. Deux littéraux identiques désignent donc le même objet.

  ```java
  String a = "Java";
  String b = "Ja" + "va";              // constante calculée à la compilation : même objet
  String partie = "Ja";
  String c = partie + "va";            // calculée à l'exécution : nouvel objet
  String d = new String("Java");       // new crée toujours un nouvel objet

  a == b;            // true
  a == c;            // false
  a == d;            // false
  a == c.intern();   // true : intern renvoie l'instance du pool
  a.equals(c);       // true : c'est la seule comparaison fiable
  ```

  - Depuis Java 7, le pool est dans le **tas**, et ses chaînes inutilisées peuvent être récupérées par le GC.
  - Une expression faite uniquement de littéraux et de **constantes** (`static final` ou `final` locales initialisées
    par une constante) est calculée à la compilation : elle va dans le pool.
  - `intern()` renvoie l'instance canonique du pool, en y ajoutant la chaîne si besoin. Utile pour dédupliquer
    beaucoup de chaînes répétées, mais rarement nécessaire : le GC G1 sait dédupliquer
    (`-XX:+UseStringDeduplication`).
  - `new String("...")` est presque toujours inutile.

  **Piège classique** : un test avec `==` qui « marche » sur des littéraux et échoue sur une chaîne lue au clavier, dans
  un fichier ou en base. Seul `equals` compare le contenu.

  **En entretien** : « Les littéraux sont partagés dans le pool, d'où des `==` qui semblent marcher ; mais une chaîne
  calculée à l'exécution est un autre objet : on compare toujours avec `equals`. »
cards:
  - key: trouve-string-pool
    format: course
    question: Où se trouve le String Pool ?
    answer: Dans le heap depuis Java 7.
  - key: intern
    format: course
    question: Que fait `intern()` ?
    answer: Renvoie l'instance canonique de la chaîne dans le pool, en l'y ajoutant si besoin.
  - key: constante-compilation
    format: course
    question: Pourquoi `"Ja" + "va" == "Java"` vaut-il `true` ?
    answer: "L'expression ne contient que des littéraux : le compilateur la calcule et la remplace par le littéral `\"Java\"`, qui vient du pool."
  - key: new-string
    format: course
    question: À quoi sert `new String("texte")` ?
    answer: "À presque rien : il crée une copie inutile, hors du pool, de la chaîne littérale. On écrit directement `\"texte\"`."
  - key: new-string-dans-le-pool
    format: true-false
    question: '`new String("a") == "a"` vaut `true`.'
    truth: false
    answer: '`new` crée toujours un nouvel objet, hors du pool : `==` compare les références et renvoie `false`. `equals` renverrait `true`.'
  - key: litteraux-identiques-meme-objet
    format: true-false
    question: Deux littéraux `"Java"` écrits dans deux classes différentes désignent le même objet.
    truth: true
    answer: Les littéraux sont dédupliqués dans le pool de chaînes, quelle que soit la classe qui les contient.
  - key: vf-saisie-pool
    format: true-false
    question: Une chaîne lue au clavier est automatiquement placée dans le pool.
    truth: false
    answer: "Elle est créée à l'exécution : c'est un nouvel objet, sauf si on appelle `intern()`."
  - key: vf-gc-pool
    format: true-false
    question: Les chaînes du pool ne sont jamais récupérées par le ramasse-miettes.
    truth: false
    answer: Depuis que le pool est dans le tas (Java 7), les chaînes qui ne sont plus référencées peuvent être récupérées.
  - key: qcm-egalite
    format: multiple-choice
    question: "Avec `String a = \"ok\";`, lesquelles valent `true` ?"
    choices:
      - text: "`a == \"ok\"`"
        correct: true
      - text: "`a == new String(\"ok\").intern()`"
        correct: true
      - text: "`a == new String(\"ok\")`"
        correct: false
      - text: "`a == new StringBuilder(\"ok\").toString()`"
        correct: false
    answer: Seules les chaînes du pool sont le même objet ; `toString()` d'un `StringBuilder` crée une nouvelle chaîne.
  - key: qcm-comparer
    format: multiple-choice
    question: Comment comparer de façon fiable le contenu de deux chaînes ?
    choices:
      - text: "`a.equals(b)`"
        correct: true
      - text: "`a == b`"
        correct: false
      - text: "`a.intern() == b`"
        correct: false
      - text: "`a.hashCode() == b.hashCode()`"
        correct: false
    answer: Deux chaînes différentes peuvent avoir le même hash ; `a.intern() == b` échoue si `b` n'est pas dans le pool.
  - key: qcm-constante
    format: multiple-choice
    question: "Avec `static final String A = \"hel\";`, que vaut `(A + \"lo\") == \"hello\"` ?"
    choices:
      - text: "`true`"
        correct: true
      - text: "`false`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
      - text: "Cela dépend du GC"
        correct: false
    answer: '`A` est une constante : l''expression est calculée à la compilation.'
  - key: qcm-deduplication
    format: multiple-choice
    question: Une application garde en mémoire des millions de chaînes identiques. Que considérer ?
    choices:
      - text: "La déduplication de G1 (`-XX:+UseStringDeduplication`) ou une enum à la place des chaînes"
        correct: true
      - text: "`new String(...)` sur chaque chaîne"
        correct: false
      - text: "Comparer les chaînes avec `==`"
        correct: false
      - text: "Désactiver le pool"
        correct: false
    answer: '`intern()` est aussi possible, mais coûteux s''il est appelé partout.'
  - key: code-string-s1-java-string-s2
    format: code-output
    question: |-
      ```java
      String s1 = "Java";
      String s2 = "Ja" + "va";
      String part = "Ja";
      String s3 = part + "va";
      final String fp = "Ja";
      String s4 = fp + "va";
      System.out.println((s1 == s2) + " " + (s1 == s3) + " " + (s1 == s4));
      ```
    answer: '`true false true`. `"Ja" + "va"` et `fp + "va"` (fp est une constante final) sont calculés à la **compilation** et pointent vers le pool ; `part + "va"` est calculé à l''exécution et crée un nouvel objet.'
    check:
      code: |-
        void run() {
            String s1 = "Java";
            String s2 = "Ja" + "va";
            String part = "Ja";
            String s3 = part + "va";
            final String fp = "Ja";
            String s4 = fp + "va";
            System.out.println((s1 == s2) + " " + (s1 == s3) + " " + (s1 == s4));
        }
        run();
      output: "true false true"
  - key: code-intern
    format: code-output
    question: |-
      ```java
      String a = new String("x");
      String b = a.intern();
      System.out.println((a == "x") + " " + (b == "x"));
      ```
    answer: '`false true` : `new` crée un objet hors du pool, `intern()` renvoie celui du pool.'
    check:
      output: "false true"
  - key: code-constante-static
    format: code-output
    question: |-
      ```java
      class K {
          static final String A = "hel";
          static String b = "hel";
          static String test() { return ((A + "lo") == "hello") + " " + ((b + "lo") == "hello"); }
      }
      System.out.println(K.test());
      ```
    answer: '`true false` : `A` est une constante, calculée à la compilation ; `b` n''est pas `final`.'
    check:
      output: "true false"
  - key: code-builder
    format: code-output
    question: |-
      ```java
      String r = new StringBuilder("ja").append("va").toString();
      System.out.println((r == "java") + " " + (r.intern() == "java") + " " + r.equals("java"));
      ```
    answer: '`false true true` : la chaîne construite à l''exécution n''est pas celle du pool.'
    check:
      output: "false true true"
  - key: comparer-saisie-avec-egal
    format: bug-fix
    question: |-
      Ce code ne confirme jamais, même quand l'utilisateur tape « oui ». Corrigez-le.
      ```java
      String saisie = scanner.nextLine();
      if (saisie == "oui") {
          confirmer();
      }
      ```
    answer: |-
      ```java
      String saisie = scanner.nextLine();
      if ("oui".equals(saisie)) {
          confirmer();
      }
      ```
      `==` compare les références : la chaîne lue au clavier est un nouvel objet, jamais celui du pool. `"oui".equals(saisie)` compare le contenu et ne lève pas de NullPointerException si `saisie` est `null`.
  - key: bug-role-base
    format: bug-fix
    question: |-
      Les tests passent, mais en production aucun administrateur n'a accès :
      ```java
      if (utilisateur.role() == "ADMIN") {
          autoriser();
      }
      ```
      Dans les tests, le rôle est un littéral ; en production, il vient de la base.
    answer: |-
      ```java
      if ("ADMIN".equals(utilisateur.role())) {
          autoriser();
      }
      ```
      Dans les tests, deux littéraux partagent l'objet du pool et `==` « marche » ; une chaîne lue en base est un autre
      objet. `equals` compare le contenu (et une enum `Role` serait encore mieux).
  - key: bug-new-string
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      String statut = new String("ACTIF");
      ```
    answer: |-
      ```java
      String statut = "ACTIF";
      ```
      `new String` crée une copie inutile d'une chaîne immuable déjà présente dans le pool.
  - key: bug-intern-partout
    format: bug-fix
    question: |-
      Pour « optimiser », chaque chaîne reçue par l'API est internée, et le service ralentit :
      ```java
      String categorie = requete.parametre("categorie").intern();
      if (categorie == "livres") { ... }
      ```
    answer: |-
      ```java
      Categorie categorie = Categorie.depuis(requete.parametre("categorie"));
      if (categorie == Categorie.LIVRES) { ... }
      ```
      `intern()` sur chaque requête remplit une table globale et coûte plus qu'il ne rapporte ; comparer avec `==` reste
      fragile. Une valeur fermée devient une enum (sinon, `equals` suffit).
