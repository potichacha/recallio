notion: objects-utilitaires
lesson: |-
  `java.util.Objects` (Java 7, enrichie ensuite) regroupe des méthodes `static` qui gèrent `null` à la place du code
  appelant :

  | Méthode | Rôle |
  |---|---|
  | `requireNonNull(x, "message")` | renvoie `x`, ou lève une `NullPointerException` avec le message |
  | `requireNonNullElse(x, defaut)` (9) | `x` s'il n'est pas `null`, sinon `defaut` |
  | `requireNonNullElseGet(x, fabrique)` (9) | idem, avec un défaut calculé seulement si nécessaire |
  | `equals(a, b)` | égalité sans risque de `NullPointerException` |
  | `hash(a, b, c)`, `hashCode(x)` | combinaison de hash ; `hashCode(null)` vaut 0 |
  | `toString(x, "défaut")` | `x.toString()`, ou le défaut pour `null` |
  | `isNull`, `nonNull` | prédicats, pratiques dans un stream (`filter(Objects::nonNull)`) |
  | `checkIndex(i, taille)` (9) | lève `IndexOutOfBoundsException` si l'indice est hors limites |

  ```java
  Client(String nom, String email) {
      this.nom = Objects.requireNonNull(nom, "nom");     // échoue tôt, avec un message utile
      this.email = Objects.requireNonNull(email, "email");
  }

  String affichage = Objects.requireNonNullElse(surnom, nom);
  ```

  `requireNonNull` dans un constructeur fait **échouer tôt** : sans lui, la `NullPointerException` surgit bien plus
  tard, loin de la cause, au premier usage du champ.

  **Piège classique** : stocker un argument `null` dans un champ, puis découvrir l'erreur trois appels plus loin. Un
  `requireNonNull` à l'entrée pointe directement le coupable.

  **En entretien** : « `Objects.requireNonNull` pour valider à l'entrée, `Objects.equals` et `Objects.hash` pour
  `equals` et `hashCode`, `requireNonNullElse` pour une valeur par défaut. »
cards:
  - key: require-non-null
    format: course
    question: Que fait `Objects.requireNonNull(x, "x")` ?
    choices:
      - {text: "Il renvoie `x` s'il n'est pas `null`, sinon il lève une `NullPointerException` « x »", correct: true}
      - {text: "Il renvoie `x`, ou la chaîne « x » quand `x` vaut `null`", correct: false}
      - {text: "Il lève une `IllegalArgumentException` « x » quand `x` vaut `null`", correct: false}
      - {text: "Il renvoie `true` si `x` n'est pas `null`, et `false` sinon", correct: false}
    answer: Il renvoie `x` s'il n'est pas `null`, et lève sinon une `NullPointerException` avec le message « x ».
  - key: echouer-tot
    format: course
    question: Pourquoi appeler `requireNonNull` dans un constructeur ?
    choices:
      - {text: "Pour échouer dès la création, avec un message clair, plutôt que loin de la cause", correct: true}
      - {text: "Pour remplacer en silence un `null` par une valeur par défaut", correct: false}
      - {text: "Pour que le compilateur refuse les appels qui passent `null`", correct: false}
      - {text: "Pour que le JIT supprime ensuite tous les tests de `null` sur le champ", correct: false}
    answer: Pour échouer dès la création, avec un message clair, plutôt que plus tard, loin de la cause, au premier usage du champ.
  - key: require-non-null-else
    format: course
    question: Que fait `Objects.requireNonNullElse(a, b)` ?
    choices:
      - {text: "Il renvoie `a` s'il n'est pas `null`, sinon `b`", correct: true}
      - {text: "Il renvoie `b` s'il n'est pas `null`, sinon `a`", correct: false}
      - {text: "Il lève une exception si `a` ou `b` vaut `null`", correct: false}
      - {text: "Il renvoie `true` si `a` et `b` ne sont pas `null`", correct: false}
    answer: Il renvoie `a` s'il n'est pas `null`, sinon `b` (qui ne doit pas être `null` lui-même) ; `requireNonNullElseGet` calcule le défaut seulement si nécessaire.
  - key: equals-hash
    format: course
    question: À quoi servent `Objects.equals` et `Objects.hash` ?
    choices:
      - {text: "À écrire `equals` et `hashCode` sans gérer `null` à la main", correct: true}
      - {text: "À comparer les références de deux objets, comme `==`", correct: false}
      - {text: "À générer `equals` et `hashCode` à la compilation", correct: false}
      - {text: "À comparer champ à champ deux objets de classes différentes", correct: false}
    answer: "À écrire `equals` et `hashCode` sans gérer `null` à la main : `Objects.equals(a, b)` accepte `null` des deux côtés, `Objects.hash(a, b)` combine les hash des champs."
  - key: vf-equals-null
    format: true-false
    question: "`Objects.equals(null, null)` lève une `NullPointerException`."
    truth: false
    answer: Il renvoie `true`.
  - key: vf-hash-code-null
    format: true-false
    question: "`Objects.hashCode(null)` vaut 0."
    truth: true
    answer: Pratique pour un champ facultatif.
  - key: vf-renvoie
    format: true-false
    question: "`Objects.requireNonNull(x)` renvoie `x`, ce qui permet `this.x = Objects.requireNonNull(x);`."
    truth: true
    answer: La validation et l'affectation tiennent en une ligne.
  - key: vf-to-string
    format: true-false
    question: "`Objects.toString(null, \"vide\")` renvoie `\"vide\"`."
    truth: true
    answer: Le second argument est la valeur pour `null`.
  - key: qcm-valider
    format: multiple-choice
    question: "Laquelle de ces lignes refuse, dans un constructeur, un nom `null` en échouant tout de suite ?"
    choices:
      - {text: "`this.nom = Objects.requireNonNull(nom, \"nom\");`", correct: true}
      - {text: "`this.nom = Objects.requireNonNullElse(nom, \"\");`", correct: false}
      - {text: "`this.nom = Objects.toString(nom);`", correct: false}
      - {text: "`this.nom = nom == null ? \"\" : nom;`", correct: false}
    answer: "`requireNonNull` échoue dès la construction, avec le message « nom » (comme un `if` qui lève l'exception). Les autres cachent l'erreur, derrière une chaîne vide ou le texte « null »."
  - key: qcm-defaut
    format: multiple-choice
    question: "Avec quel appel d'`Objects` affiches-tu le surnom, ou le nom si le surnom vaut `null` ?"
    choices:
      - {text: "`Objects.requireNonNullElse(surnom, nom)`", correct: true}
      - {text: "`Objects.requireNonNull(surnom, nom)`", correct: false}
      - {text: "`Objects.equals(surnom, nom)`", correct: false}
      - {text: "`Objects.toString(surnom)`", correct: false}
    answer: "`requireNonNullElse` renvoie le défaut quand la valeur vaut `null`, comme `surnom != null ? surnom : nom`. `requireNonNull(surnom, nom)` lèverait une exception avec le nom pour message, et `toString` afficherait « null »."
  - key: qcm-stream
    format: multiple-choice
    question: "Avec quelle méthode d'`Objects` retires-tu les `null` d'un flux ?"
    choices:
      - {text: "`flux.filter(Objects::nonNull)`", correct: true}
      - {text: "`flux.filter(Objects::isNull)`", correct: false}
      - {text: "`flux.map(Objects::requireNonNull)`", correct: false}
      - {text: "`flux.map(Objects::toString)`", correct: false}
    answer: "`nonNull` garde les valeurs présentes, comme `x -> x != null`. `isNull` garderait les `null`, `requireNonNull` lèverait une exception, et `toString` les changerait en « null »."
  - key: qcm-check-index
    format: multiple-choice
    question: "Que fait `Objects.checkIndex(3, 3)` ?"
    choices:
      - {text: "Il lève une `IndexOutOfBoundsException`", correct: true}
      - {text: "Il renvoie 3, l'indice étant accepté", correct: false}
      - {text: "Il renvoie `false`, sans lever d'exception", correct: false}
      - {text: "Il renvoie 2, le dernier indice valide", correct: false}
    answer: Un indice valide va de 0 à `taille - 1` ; pour un indice valide, la méthode le renvoie.
  - key: trous-require
    format: fill-in
    question: |-
      Complète pour refuser un email `null` avec un message clair :
      ```java
      this.email = Objects.___(email, "email obligatoire");
      ```
    blanks: [[requireNonNull]]
    answer: La méthode renvoie l'argument validé.
  - key: trous-else
    format: fill-in
    question: |-
      Complète pour utiliser « fr » quand la langue n'est pas fournie :
      ```java
      String langue = Objects.___(preference, "fr");
      ```
    blanks: [[requireNonNullElse]]
    answer: Le défaut remplace `null`.
  - key: trous-non-null
    format: fill-in
    question: |-
      Complète pour ne garder que les valeurs présentes :
      ```java
      List<String> noms = brutes.stream().filter(Objects::___).toList();
      ```
    blanks: [[nonNull]]
    answer: '`nonNull` est le prédicat « différent de `null` ».'
  - key: trous-hash
    format: fill-in
    question: |-
      Complète `hashCode`, cohérent avec un `equals` sur `nom` et `age` :
      ```java
      return Objects.___(nom, age);
      ```
    blanks: [[hash]]
    answer: '`Objects.hash` combine les hash des champs (et accepte `null`).'
  - key: code-null-safe
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Objects.equals(null, null) + " " + Objects.hashCode(null) + " " + Objects.toString(null, "vide"));
      ```
    choices:
      - {text: "`true 0 vide`", correct: true}
      - {text: "`true 0 null`", correct: false}
      - {text: "`false 0 vide`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: "`true 0 vide` : les méthodes d'`Objects` acceptent `null` ; `hashCode(null)` vaut 0, et `toString` prend le défaut donné."
    check:
      output: "true 0 vide"
  - key: code-else
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String surnom = null;
      System.out.println(Objects.requireNonNullElse(surnom, "défaut"));
      ```
    choices:
      - {text: "`défaut`", correct: true}
      - {text: "`null`", correct: false}
      - {text: "`surnom`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: '`défaut`.'
    check:
      output: "défaut"
  - key: code-require
    format: code-output
    question: |-
      Que se passe-t-il à l'exécution de ce code ?
      ```java
      String client = null;
      Objects.requireNonNull(client, "client obligatoire");
      ```
    choices:
      - {text: "Une `NullPointerException` « client obligatoire »", correct: true}
      - {text: "Une `IllegalArgumentException` « client obligatoire »", correct: false}
      - {text: "Rien : `client` vaut ensuite « client obligatoire »", correct: false}
      - {text: "Rien : le résultat de `requireNonNull` est ignoré", correct: false}
    answer: Une `NullPointerException` dont le message est « client obligatoire ».
    check:
      throws: NullPointerException
  - key: code-non-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Stream.of("a", null, "b").filter(Objects::nonNull).count());
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: '`2`.'
    check:
      output: "2"
  - key: bug-echec-tardif
    format: bug-fix
    question: |-
      Une `NullPointerException` surgit dans `envoyer()`, bien après la création du notificateur :
      ```java
      Notificateur(Messagerie messagerie) {
          this.messagerie = messagerie;
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`this.messagerie = Objects.requireNonNull(messagerie, \"messagerie\");`", correct: true}
      - {text: "Tester `messagerie != null` au début d'`envoyer()`, et ne rien faire sinon", correct: false}
      - {text: "Entourer le corps d'`envoyer()` d'un `catch` de la `NullPointerException`", correct: false}
      - {text: "Déclarer le champ `messagerie` en `final`, pour qu'il soit toujours initialisé", correct: false}
    answer: |-
      ```java
      Notificateur(Messagerie messagerie) {
          this.messagerie = Objects.requireNonNull(messagerie, "messagerie");
      }
      ```
      Valider à la construction fait échouer tout de suite, là où le `null` a été passé, avec un message clair.
  - key: bug-equals-manuel
    format: bug-fix
    question: |-
      Comment simplifier cette comparaison ?
      ```java
      return (telephone == null ? autre.telephone == null : telephone.equals(autre.telephone));
      ```
    choices:
      - {text: "`return Objects.equals(telephone, autre.telephone);`", correct: true}
      - {text: "`return telephone.equals(autre.telephone);`", correct: false}
      - {text: "`return telephone == autre.telephone;`", correct: false}
      - {text: "`return Objects.hash(telephone) == Objects.hash(autre.telephone);`", correct: false}
    answer: "`Objects.equals` gère `null` des deux côtés. `telephone.equals` lèverait une exception quand `telephone` vaut `null`, et `==` compare les références."
  - key: bug-ternaire-defaut
    format: bug-fix
    question: |-
      Comment simplifier cette ligne ?
      ```java
      String fuseau = preferences.fuseau() != null ? preferences.fuseau() : "Europe/Paris";
      ```
    choices:
      - {text: "`Objects.requireNonNullElse(preferences.fuseau(), \"Europe/Paris\")`", correct: true}
      - {text: "`Objects.requireNonNull(preferences.fuseau(), \"Europe/Paris\")`", correct: false}
      - {text: "`Optional.of(preferences.fuseau()).orElse(\"Europe/Paris\")`", correct: false}
      - {text: "`Objects.toString(preferences.fuseau())`", correct: false}
    answer: "`requireNonNullElse` dit l'intention et n'appelle `fuseau()` qu'une fois. `requireNonNull` lèverait une exception avec « Europe/Paris » pour message, et `Optional.of(null)` aussi."
  - key: bug-hash-manuel
    format: bug-fix
    question: |-
      Ce `hashCode` lève une `NullPointerException` pour un client sans téléphone :
      ```java
      @Override
      public int hashCode() {
          return 31 * nom.hashCode() + telephone.hashCode();
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`return Objects.hash(nom, telephone);`", correct: true}
      - {text: "`return Objects.hashCode(nom) + telephone.hashCode();`", correct: false}
      - {text: "`return Objects.hash(nom) + telephone.hashCode();`", correct: false}
      - {text: "`return System.identityHashCode(this);`", correct: false}
    answer: |-
      ```java
      @Override
      public int hashCode() {
          return Objects.hash(nom, telephone);
      }
      ```
      `Objects.hash` accepte des champs `null` (et combine les valeurs de la même façon).
