notion: objects-utilitaires
lesson: |-
  `java.util.Objects` (Java 7, enrichie ensuite) regroupe des méthodes `static` qui gèrent `null` à la place du code
  appelant :

  | Méthode | Rôle |
  |---|---|
  | `requireNonNull(x, "message")` | renvoie `x`, ou lève une `NullPointerException` avec le message |
  | `requireNonNullElse(x, defaut)` (9) | `x` s'il n'est pas `null`, sinon `defaut` |
  | `requireNonNullElseGet(x, fabrique)` (9) | idem, avec un défaut calculé seulement si nécessaire |
  | `equals(a, b)` | égalité sans risque de `NullPointerException` |
  | `hash(a, b, c)`, `hashCode(x)` | combinaison de hash ; `hashCode(null)` vaut 0 |
  | `toString(x, "défaut")` | `x.toString()`, ou le défaut pour `null` |
  | `isNull`, `nonNull` | prédicats, pratiques dans un stream (`filter(Objects::nonNull)`) |
  | `checkIndex(i, taille)` (9) | lève `IndexOutOfBoundsException` si l'indice est hors limites |

  ```java
  Client(String nom, String email) {
      this.nom = Objects.requireNonNull(nom, "nom");     // échoue tôt, avec un message utile
      this.email = Objects.requireNonNull(email, "email");
  }

  String affichage = Objects.requireNonNullElse(surnom, nom);
  ```

  `requireNonNull` dans un constructeur fait **échouer tôt** : sans lui, la `NullPointerException` surgit bien plus
  tard, loin de la cause, au premier usage du champ.

  **Piège classique** : stocker un argument `null` dans un champ, puis découvrir l'erreur trois appels plus loin. Un
  `requireNonNull` à l'entrée pointe directement le coupable.

  **En entretien** : « `Objects.requireNonNull` pour valider à l'entrée, `Objects.equals` et `Objects.hash` pour
  `equals` et `hashCode`, `requireNonNullElse` pour une valeur par défaut. »
cards:
  - key: require-non-null
    format: course
    question: Que fait `Objects.requireNonNull(x, "x")` ?
    answer: Il renvoie `x` s'il n'est pas `null`, et lève sinon une `NullPointerException` avec le message « x ».
  - key: echouer-tot
    format: course
    question: Pourquoi appeler `requireNonNull` dans un constructeur ?
    answer: Pour échouer dès la création, avec un message clair, plutôt que plus tard, loin de la cause, au premier usage du champ.
  - key: require-non-null-else
    format: course
    question: Que fait `Objects.requireNonNullElse(a, b)` ?
    answer: Il renvoie `a` s'il n'est pas `null`, sinon `b` (qui ne doit pas être `null` lui-même) ; `requireNonNullElseGet` calcule le défaut seulement si nécessaire.
  - key: equals-hash
    format: course
    question: À quoi servent `Objects.equals` et `Objects.hash` ?
    answer: "À écrire `equals` et `hashCode` sans gérer `null` à la main : `Objects.equals(a, b)` accepte `null` des deux côtés, `Objects.hash(a, b)` combine les hash des champs."
  - key: vf-equals-null
    format: true-false
    question: "`Objects.equals(null, null)` lève une `NullPointerException`."
    truth: false
    answer: Il renvoie `true`.
  - key: vf-hash-code-null
    format: true-false
    question: "`Objects.hashCode(null)` vaut 0."
    truth: true
    answer: Pratique pour un champ facultatif.
  - key: vf-renvoie
    format: true-false
    question: "`Objects.requireNonNull(x)` renvoie `x`, ce qui permet `this.x = Objects.requireNonNull(x);`."
    truth: true
    answer: La validation et l'affectation tiennent en une ligne.
  - key: vf-to-string
    format: true-false
    question: "`Objects.toString(null, \"vide\")` renvoie `\"vide\"`."
    truth: true
    answer: Le second argument est la valeur pour `null`.
  - key: qcm-valider
    format: multiple-choice
    question: Comment refuser un nom `null` dans un constructeur ?
    choices:
      - text: "`this.nom = Objects.requireNonNull(nom, \"nom\");`"
        correct: true
      - text: "`if (nom == null) throw new NullPointerException(\"nom\"); this.nom = nom;`"
        correct: true
      - text: "`this.nom = Optional.of(nom);`"
        correct: false
      - text: "`this.nom = nom == null ? \"\" : nom;` sans rien dire"
        correct: false
    answer: Les deux premiers sont équivalents ; le dernier cache l'erreur.
  - key: qcm-defaut
    format: multiple-choice
    question: "Comment afficher le surnom, ou le nom si le surnom vaut `null` ?"
    choices:
      - text: "`Objects.requireNonNullElse(surnom, nom)`"
        correct: true
      - text: "`surnom != null ? surnom : nom`"
        correct: true
      - text: "`Objects.requireNonNull(surnom, nom)`"
        correct: false
      - text: "`Objects.equals(surnom, nom)`"
        correct: false
    answer: '`requireNonNull(surnom, nom)` lèverait une exception avec le nom comme message.'
  - key: qcm-stream
    format: multiple-choice
    question: Comment retirer les `null` d'un flux ?
    choices:
      - text: "`flux.filter(Objects::nonNull)`"
        correct: true
      - text: "`flux.filter(x -> x != null)`"
        correct: true
      - text: "`flux.filter(Objects::isNull)`"
        correct: false
      - text: "`flux.map(Objects::requireNonNull)`"
        correct: false
    answer: '`isNull` garderait les `null` ; `requireNonNull` lèverait une exception.'
  - key: qcm-check-index
    format: multiple-choice
    question: "Que fait `Objects.checkIndex(3, 3)` ?"
    choices:
      - text: "Il lève une `IndexOutOfBoundsException`"
        correct: true
      - text: "Il renvoie 3"
        correct: false
      - text: "Il renvoie `false`"
        correct: false
      - text: "Il renvoie 2"
        correct: false
    answer: Un indice valide va de 0 à `taille - 1` ; pour un indice valide, la méthode le renvoie.
  - key: trous-require
    format: fill-in
    question: |-
      Complétez pour refuser un email `null` avec un message clair :
      ```java
      this.email = Objects.___(email, "email obligatoire");
      ```
    blanks: [[requireNonNull]]
    answer: La méthode renvoie l'argument validé.
  - key: trous-else
    format: fill-in
    question: |-
      Complétez pour utiliser « fr » quand la langue n'est pas fournie :
      ```java
      String langue = Objects.___(preference, "fr");
      ```
    blanks: [[requireNonNullElse]]
    answer: Le défaut remplace `null`.
  - key: trous-non-null
    format: fill-in
    question: |-
      Complétez pour ne garder que les valeurs présentes :
      ```java
      List<String> noms = brutes.stream().filter(Objects::___).toList();
      ```
    blanks: [[nonNull]]
    answer: '`nonNull` est le prédicat « différent de `null` ».'
  - key: trous-hash
    format: fill-in
    question: |-
      Complétez `hashCode`, cohérent avec un `equals` sur `nom` et `age` :
      ```java
      return Objects.___(nom, age);
      ```
    blanks: [[hash]]
    answer: '`Objects.hash` combine les hash des champs (et accepte `null`).'
  - key: code-null-safe
    format: code-output
    question: |-
      ```java
      System.out.println(Objects.equals(null, null) + " " + Objects.hashCode(null) + " " + Objects.toString(null, "vide"));
      ```
    answer: '`true 0 vide`.'
    check:
      output: "true 0 vide"
  - key: code-else
    format: code-output
    question: |-
      ```java
      String surnom = null;
      System.out.println(Objects.requireNonNullElse(surnom, "défaut"));
      ```
    answer: '`défaut`.'
    check:
      output: "défaut"
  - key: code-require
    format: code-output
    question: |-
      ```java
      String client = null;
      Objects.requireNonNull(client, "client obligatoire");
      ```
    answer: Une `NullPointerException` dont le message est « client obligatoire ».
    check:
      throws: NullPointerException
  - key: code-non-null
    format: code-output
    question: |-
      ```java
      System.out.println(Stream.of("a", null, "b").filter(Objects::nonNull).count());
      ```
    answer: '`2`.'
    check:
      output: "2"
  - key: bug-echec-tardif
    format: bug-fix
    question: |-
      Une `NullPointerException` surgit dans `envoyer()`, bien après la création du notificateur :
      ```java
      Notificateur(Messagerie messagerie) {
          this.messagerie = messagerie;
      }
      ```
    answer: |-
      ```java
      Notificateur(Messagerie messagerie) {
          this.messagerie = Objects.requireNonNull(messagerie, "messagerie");
      }
      ```
      Valider à la construction fait échouer tout de suite, là où le `null` a été passé, avec un message clair.
  - key: bug-equals-manuel
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      return (telephone == null ? autre.telephone == null : telephone.equals(autre.telephone));
      ```
    answer: |-
      ```java
      return Objects.equals(telephone, autre.telephone);
      ```
      `Objects.equals` gère `null` des deux côtés.
  - key: bug-ternaire-defaut
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      String fuseau = preferences.fuseau() != null ? preferences.fuseau() : "Europe/Paris";
      ```
    answer: |-
      ```java
      String fuseau = Objects.requireNonNullElse(preferences.fuseau(), "Europe/Paris");
      ```
      La méthode dit l'intention et n'appelle `fuseau()` qu'une fois.
  - key: bug-hash-manuel
    format: bug-fix
    question: |-
      Ce `hashCode` lève une `NullPointerException` pour un client sans téléphone :
      ```java
      @Override
      public int hashCode() {
          return 31 * nom.hashCode() + telephone.hashCode();
      }
      ```
    answer: |-
      ```java
      @Override
      public int hashCode() {
          return Objects.hash(nom, telephone);
      }
      ```
      `Objects.hash` accepte des champs `null` (et combine les valeurs de la même façon).
