notion: bigdecimal
lesson: |-
  `BigDecimal` représente un nombre décimal **exact** : une valeur entière non bornée et une **échelle** (le nombre de
  chiffres après la virgule). C'est le type des **montants**.

  ```java
  BigDecimal prix = new BigDecimal("19.99");            // depuis une chaîne : exact
  BigDecimal taux = BigDecimal.valueOf(0.2);            // valueOf : passe par "0.2", exact
  BigDecimal ttc = prix.multiply(BigDecimal.ONE.add(taux))
                       .setScale(2, RoundingMode.HALF_UP);   // 23.99

  BigDecimal.ONE.divide(BigDecimal.valueOf(3));         // ArithmeticException : 0,333... infini
  BigDecimal.ONE.divide(BigDecimal.valueOf(3), 2, RoundingMode.HALF_UP);   // 0.33
  ```

  - **Immuable** : `add`, `multiply`, `setScale`... renvoient un nouveau `BigDecimal`. Il faut récupérer le résultat.
  - Jamais `new BigDecimal(0.1)` : il capture la valeur binaire imprécise du `double`
    (`0.1000000000000000055511...`). On passe par une chaîne ou `valueOf`.
  - `divide` sans échelle ni arrondi lève une `ArithmeticException` si le résultat a une infinité de décimales.
  - **`equals` compare aussi l'échelle** : `2.0` et `2.00` sont différents. Pour comparer des valeurs, `compareTo`.
  - Modes d'arrondi : `HALF_UP` (l'usage commercial), `HALF_EVEN` (l'arrondi bancaire, qui limite le biais cumulé),
    `DOWN`, `CEILING`...
  - En base, un type décimal exact (`NUMERIC(19, 4)`), jamais `FLOAT`.

  **Piège classique** : `total.add(prix);` sans affectation. `BigDecimal` est immuable : le total ne change pas.

  **En entretien** : « Pour de l'argent, `BigDecimal` construit depuis une chaîne, un arrondi explicite, `compareTo`
  pour comparer ; ou des centimes dans un `long`. »
cards:
  - key: utiliser-new-bigdecimal-0-1
    format: course
    question: Pourquoi ne pas utiliser `new BigDecimal(0.1)` ?
    answer: Il capture la valeur binaire imprécise ; utiliser `new BigDecimal("0.1")` ou `BigDecimal.valueOf(0.1)`.
  - key: equals-vs-compareto-bigdecimal
    format: course
    question: '`equals` vs `compareTo` sur BigDecimal ?'
    answer: equals compare valeur et échelle (2.0 ≠ 2.00) ; compareTo compare uniquement la valeur.
  - key: passe-avec-bigdecimal-one-divide-bigdecimal
    format: course
    question: Que se passe-t-il avec `BigDecimal.ONE.divide(BigDecimal.valueOf(3))` ?
    answer: 'ArithmeticException (développement décimal infini) : il faut une échelle et un RoundingMode.'
  - key: half-even
    format: course
    question: C'est quoi HALF_EVEN ?
    answer: 'L''arrondi bancaire : au plus proche, et en cas d''égalité vers le chiffre pair, pour éviter un biais cumulé.'
  - key: vf-immuable
    format: true-false
    question: "`total.add(prix);` ajoute `prix` à `total`."
    truth: false
    answer: '`BigDecimal` est immuable : il faut écrire `total = total.add(prix);`.'
  - key: vf-double-montant
    format: true-false
    question: Un `double` convient pour des montants si l'on arrondit à l'affichage.
    truth: false
    answer: Les erreurs binaires s'accumulent dans les calculs et donnent des écarts d'un centime.
  - key: vf-value-of
    format: true-false
    question: "`BigDecimal.valueOf(0.1)` vaut exactement 0,1."
    truth: true
    answer: '`valueOf` passe par `Double.toString`, qui donne `"0.1"`.'
  - key: vf-echelle
    format: true-false
    question: "`new BigDecimal(\"2.0\").equals(new BigDecimal(\"2.00\"))` vaut `true`."
    truth: false
    answer: Les échelles diffèrent (1 et 2) ; `compareTo` renverrait 0.
  - key: qcm-construire
    format: multiple-choice
    question: Quelles constructions donnent exactement 0,1 ?
    choices:
      - text: "`new BigDecimal(\"0.1\")`"
        correct: true
      - text: "`BigDecimal.valueOf(0.1)`"
        correct: true
      - text: "`new BigDecimal(0.1)`"
        correct: false
      - text: "`new BigDecimal(1 / 10)`"
        correct: false
    answer: '`1 / 10` est une division entière qui vaut 0.'
  - key: qcm-diviser
    format: multiple-choice
    question: Comment diviser 10 € en trois parts au centime près ?
    choices:
      - text: "`dix.divide(BigDecimal.valueOf(3), 2, RoundingMode.HALF_UP)`"
        correct: true
      - text: "`dix.divide(BigDecimal.valueOf(3))`"
        correct: false
      - text: "`dix / 3`"
        correct: false
      - text: "`dix.divide(3.0)`"
        correct: false
    answer: Sans échelle ni arrondi, `divide` lève une `ArithmeticException` ; les opérateurs ne s'appliquent pas.
  - key: qcm-comparer
    format: multiple-choice
    question: Comment tester qu'un solde `BigDecimal` est négatif ?
    choices:
      - text: "`solde.compareTo(BigDecimal.ZERO) < 0`"
        correct: true
      - text: "`solde.signum() < 0`"
        correct: true
      - text: "`solde < 0`"
        correct: false
      - text: "`solde.equals(BigDecimal.ZERO)`"
        correct: false
    answer: Les opérateurs de comparaison ne fonctionnent pas sur des objets.
  - key: qcm-arrondi
    format: multiple-choice
    question: "Que vaut `new BigDecimal(\"2.345\").setScale(2, RoundingMode.HALF_EVEN)` ?"
    choices:
      - text: "2.34"
        correct: true
      - text: "2.35"
        correct: false
      - text: "2.3"
        correct: false
      - text: "2.345"
        correct: false
    answer: "Le 5 tombe à égalité : on arrondit vers le chiffre pair (4) ; `HALF_UP` donnerait 2.35."
  - key: trous-chaine
    format: fill-in
    question: |-
      Complétez pour créer un prix exact :
      ```java
      BigDecimal prix = new BigDecimal(___);   // 19,99 €
      ```
    blanks: [["\"19.99\""]]
    answer: Le constructeur à chaîne est exact ; le constructeur à `double` ne l'est pas.
  - key: trous-add
    format: fill-in
    question: |-
      Complétez pour cumuler le prix dans le total :
      ```java
      total = total.___(ligne.prix());
      ```
    blanks: [[add]]
    answer: '`add` renvoie un nouveau `BigDecimal`, qu''on réaffecte.'
  - key: trous-compare
    format: fill-in
    question: |-
      Complétez pour comparer deux montants sans tenir compte de l'échelle :
      ```java
      boolean memeMontant = a.___(b) == 0;
      ```
    blanks: [[compareTo]]
    answer: '`equals` tiendrait compte de l''échelle (`2.0` ≠ `2.00`).'
  - key: trous-arrondi
    format: fill-in
    question: |-
      Complétez pour arrondir au centime, les demis vers le haut :
      ```java
      BigDecimal arrondi = montant.setScale(2, RoundingMode.___);
      ```
    blanks: [[HALF_UP]]
    answer: '`HALF_UP` est l''arrondi commercial courant.'
  - key: code-new-bigdecimal-2-0-equals
    format: code-output
    question: '`new BigDecimal("2.0").equals(new BigDecimal("2.00"))` et `compareTo` ?'
    answer: '`false` et `0` : equals compare aussi l''échelle.'
    check:
      code: |-
        System.out.println(new BigDecimal("2.0").equals(new BigDecimal("2.00")) + " " + new BigDecimal("2.0").compareTo(new BigDecimal("2.00")));
      output: "false 0"
  - key: code-system-out-println-new-bigdecimal
    format: code-output
    question: '`System.out.println(new BigDecimal(0.1));`'
    answer: '`0.1000000000000000055511151231257827021181583404541015625`.'
    check:
      code: |-
        System.out.println(new BigDecimal(0.1));
      output: "0.1000000000000000055511151231257827021181583404541015625"
  - key: code-divide
    format: code-output
    question: |-
      ```java
      System.out.println(BigDecimal.ONE.divide(BigDecimal.valueOf(3), 2, RoundingMode.HALF_UP));
      BigDecimal.ONE.divide(BigDecimal.valueOf(3));
      ```
    answer: '`0.33`, puis une `ArithmeticException` : sans échelle, le résultat aurait une infinité de décimales.'
    check:
      output: "0.33"
      throws: ArithmeticException
  - key: code-arrondis
    format: code-output
    question: |-
      ```java
      BigDecimal a = new BigDecimal("2.345");
      BigDecimal b = new BigDecimal("2.355");
      System.out.println(a.setScale(2, RoundingMode.HALF_UP) + " " + a.setScale(2, RoundingMode.HALF_EVEN) + " "
              + b.setScale(2, RoundingMode.HALF_EVEN));
      ```
    answer: '`2.35 2.34 2.36` : `HALF_EVEN` arrondit les demis vers le chiffre pair.'
    check:
      output: "2.35 2.34 2.36"
  - key: bug-double-prix
    format: bug-fix
    question: |-
      Le total d'une facture est faux d'un centime :
      ```java
      double total = 0;
      for (Ligne l : lignes) {
          total += l.prixUnitaire() * l.quantite();
      }
      ```
    answer: |-
      ```java
      BigDecimal total = BigDecimal.ZERO;
      for (Ligne l : lignes) {
          total = total.add(l.prixUnitaire().multiply(BigDecimal.valueOf(l.quantite())));
      }
      total = total.setScale(2, RoundingMode.HALF_UP);
      ```
      Les `double` accumulent des erreurs binaires. En `BigDecimal`, le calcul est exact et l'arrondi est un choix
      explicite.
  - key: bug-add-ignore
    format: bug-fix
    question: |-
      Le total reste toujours à zéro :
      ```java
      BigDecimal total = BigDecimal.ZERO;
      for (BigDecimal montant : montants) {
          total.add(montant);
      }
      ```
    answer: |-
      ```java
      for (BigDecimal montant : montants) {
          total = total.add(montant);
      }
      ```
      `BigDecimal` est immuable : `add` renvoie un nouvel objet, ignoré ici.
  - key: bug-equals-test
    format: bug-fix
    question: |-
      Ce test échoue alors que le montant est juste :
      ```java
      assertEquals(new BigDecimal("10"), facture.total());   // total() vaut 10.00
      ```
    answer: |-
      ```java
      assertEquals(0, new BigDecimal("10").compareTo(facture.total()));
      // ou : assertThat(facture.total()).isEqualByComparingTo("10");
      ```
      `equals` compare l'échelle : `10` et `10.00` sont différents. On compare les valeurs avec `compareTo`.
  - key: bug-divide-sans-arrondi
    format: bug-fix
    question: |-
      Le partage d'une note entre trois personnes lève une `ArithmeticException` :
      ```java
      BigDecimal part = total.divide(BigDecimal.valueOf(personnes));
      ```
    answer: |-
      ```java
      BigDecimal part = total.divide(BigDecimal.valueOf(personnes), 2, RoundingMode.HALF_UP);
      ```
      Une division qui ne tombe pas juste a une infinité de décimales : on précise l'échelle et l'arrondi (et l'on décide
      qui paie le centime restant).
  - key: dois-calculer-montants-avec-tva-remises
    format: scenario
    question: Tu dois calculer des montants avec TVA et remises. Comment tu t'y prends ?
    answer: |-
      Jamais de `double` : l'erreur de représentation binaire s'accumule et produit des écarts d'un centime, inacceptables en comptabilité.
      J'utiliserais `BigDecimal` construit depuis des String ou `valueOf`, avec une **règle d'arrondi explicite** et validée avec le métier : à quelle étape on arrondit (par ligne ou sur le total, ce qui ne donne pas le même résultat) et avec quel mode (HALF_UP est l'usage commercial, HALF_EVEN limite le biais statistique).
      Je ferais attention à `equals` qui tient compte de l'échelle : pour comparer, `compareTo`. Et je stockerais en base dans un type décimal exact (`NUMERIC(19,4)` par exemple), pas un FLOAT.
      Alternative pour un système simple : manipuler des centimes dans un `long`, plus rapide et sans ambiguïté, à condition de bien gérer les divisions.
  - key: scenario-partage-centime
    format: scenario
    question: Une note de 100 € doit être partagée en trois. Comment gères-tu le centime restant ?
    answer: |-
      33,33 × 3 = 99,99 : il reste un centime. Je calcule les parts arrondies vers le bas, puis je répartis le reste
      centime par centime sur les premières parts (33,34 + 33,33 + 33,33), pour que la somme des parts égale toujours le
      total. La règle (qui reçoit le centime) se décide avec le métier et se teste, y compris sur des cas limites (un
      seul participant, montant nul). C'est un cas où le choix de l'arrondi est une règle métier, pas un détail technique.
  - key: scenario-api-double
    format: scenario
    question: Une API externe renvoie des prix en `double` dans son JSON. Que fais-tu ?
    answer: |-
      Je les convertis en `BigDecimal` dès la frontière, en passant par leur représentation textuelle : avec Jackson,
      `USE_BIG_DECIMAL_FOR_FLOATS` (ou des champs `BigDecimal` dans le DTO) lit directement le texte du JSON, sans passer
      par un `double`. Ensuite, tout le domaine manipule des `BigDecimal` avec une échelle définie. Je vérifie aussi la
      devise et l'échelle attendues, et je refuse une valeur non conforme plutôt que de l'arrondir en silence.
  - key: scenario-centimes-long
    format: scenario
    question: "Centimes dans un `long` ou `BigDecimal` : comment choisis-tu ?"
    answer: |-
      Les centimes en `long` sont simples, rapides et sans ambiguïté d'échelle, parfaits pour des montants d'une seule
      devise avec des opérations simples (sommes, multiplications par des quantités). `BigDecimal` s'impose dès qu'il y
      a des taux, des pourcentages, des conversions de devises ou des devises à trois décimales, où l'on a besoin d'une
      précision intermédiaire et d'arrondis explicites. Dans les deux cas, j'enveloppe la valeur dans un type `Montant`
      immuable, pour ne pas mélanger devises et unités.
