notion: bigdecimal
lesson: |-
  `BigDecimal` représente un nombre décimal **exact** : une valeur entière non bornée et une **échelle** (le nombre de
  chiffres après la virgule). C'est le type des **montants**.

  ```java
  BigDecimal prix = new BigDecimal("19.99");            // depuis une chaîne : exact
  BigDecimal taux = BigDecimal.valueOf(0.2);            // valueOf : passe par "0.2", exact
  BigDecimal ttc = prix.multiply(BigDecimal.ONE.add(taux))
                       .setScale(2, RoundingMode.HALF_UP);   // 23.99

  BigDecimal.ONE.divide(BigDecimal.valueOf(3));         // ArithmeticException : 0,333... infini
  BigDecimal.ONE.divide(BigDecimal.valueOf(3), 2, RoundingMode.HALF_UP);   // 0.33
  ```

  - **Immuable** : `add`, `multiply`, `setScale`... renvoient un nouveau `BigDecimal`. Il faut récupérer le résultat.
  - Jamais `new BigDecimal(0.1)` : il capture la valeur binaire imprécise du `double`
    (`0.1000000000000000055511...`). On passe par une chaîne ou `valueOf`.
  - `divide` sans échelle ni arrondi lève une `ArithmeticException` si le résultat a une infinité de décimales.
  - **`equals` compare aussi l'échelle** : `2.0` et `2.00` sont différents. Pour comparer des valeurs, `compareTo`.
  - Modes d'arrondi : `HALF_UP` (l'usage commercial), `HALF_EVEN` (l'arrondi bancaire, qui limite le biais cumulé),
    `DOWN`, `CEILING`...
  - En base, un type décimal exact (`NUMERIC(19, 4)`), jamais `FLOAT`.

  **Piège classique** : `total.add(prix);` sans affectation. `BigDecimal` est immuable : le total ne change pas.

  **En entretien** : « Pour de l'argent, `BigDecimal` construit depuis une chaîne, un arrondi explicite, `compareTo`
  pour comparer ; ou des centimes dans un `long`. »
cards:
  - key: utiliser-new-bigdecimal-0-1
    format: course
    question: Pourquoi ne pas utiliser `new BigDecimal(0.1)` ?
    choices:
      - {text: "Il capture la valeur binaire imprécise du `double`, pas 0,1", correct: true}
      - {text: "Il arrondit 0,1 à deux décimales, l'échelle par défaut", correct: false}
      - {text: "Il est déprécié depuis Java 9, comme `new Integer(int)`", correct: false}
      - {text: "Il crée un objet à chaque appel, sans passer par un cache", correct: false}
    answer: "Il capture la valeur binaire imprécise du `double` (0.1000000000000000055...). On écrit `new BigDecimal(\"0.1\")` ou `BigDecimal.valueOf(0.1)`, qui passe par le texte du `double`."
  - key: equals-vs-compareto-bigdecimal
    format: course
    question: "Quelle différence entre `equals` et `compareTo` sur un `BigDecimal` ?"
    choices:
      - {text: "`equals` compare la valeur et l'échelle ; `compareTo`, la valeur seule", correct: true}
      - {text: "`equals` compare la valeur seule ; `compareTo`, la valeur et l'échelle", correct: false}
      - {text: "`equals` compare les références ; `compareTo`, les valeurs", correct: false}
      - {text: "Aucune : `equals` appelle `compareTo` et teste le résultat zéro", correct: false}
    answer: "`equals` compare la valeur et l'échelle (`2.0` ≠ `2.00`) ; `compareTo` compare uniquement la valeur (`2.0` et `2.00` donnent 0)."
  - key: passe-avec-bigdecimal-one-divide-bigdecimal
    format: course
    question: Que se passe-t-il avec `BigDecimal.ONE.divide(BigDecimal.valueOf(3))` ?
    choices:
      - {text: "Une `ArithmeticException` : 1/3 a une infinité de décimales", correct: true}
      - {text: "`0.33`, arrondi par défaut à deux décimales", correct: false}
      - {text: "`0.3333333333333333`, comme avec des `double`", correct: false}
      - {text: "`0`, car c'est une division entière", correct: false}
    answer: "Une `ArithmeticException` : le développement décimal est infini, et `divide` sans arrondi exige un résultat exact. Il faut une échelle et un `RoundingMode`."
  - key: half-even
    format: course
    question: "Que fait le mode d'arrondi `RoundingMode.HALF_EVEN` ?"
    choices:
      - {text: "Au plus proche ; à égalité, vers le chiffre pair (l'arrondi bancaire)", correct: true}
      - {text: "Au plus proche ; à égalité, vers le haut (l'arrondi commercial)", correct: false}
      - {text: "Toujours vers le chiffre pair, même sans égalité entre deux voisins", correct: false}
      - {text: "Vers zéro, en coupant simplement les décimales en trop", correct: false}
    answer: "L'arrondi bancaire : au plus proche, et en cas d'égalité vers le chiffre pair, pour éviter un biais cumulé. Vers le haut à égalité, c'est `HALF_UP`."
  - key: vf-immuable
    format: true-false
    question: "`total.add(prix);` ajoute `prix` à `total`."
    truth: false
    answer: '`BigDecimal` est immuable : il faut écrire `total = total.add(prix);`.'
  - key: vf-double-montant
    format: true-false
    question: Un `double` convient pour des montants si l'on arrondit à l'affichage.
    truth: false
    answer: Les erreurs binaires s'accumulent dans les calculs et donnent des écarts d'un centime.
  - key: vf-value-of
    format: true-false
    question: "`BigDecimal.valueOf(0.1)` vaut exactement 0,1."
    truth: true
    answer: '`valueOf` passe par `Double.toString`, qui donne `"0.1"`.'
  - key: vf-echelle
    format: true-false
    question: "`new BigDecimal(\"2.0\").equals(new BigDecimal(\"2.00\"))` vaut `true`."
    truth: false
    answer: Les échelles diffèrent (1 et 2) ; `compareTo` renverrait 0.
  - key: qcm-construire
    format: multiple-choice
    question: "Laquelle de ces constructions donne exactement 0,1 ?"
    choices:
      - {text: "`new BigDecimal(\"0.1\")`", correct: true}
      - {text: "`new BigDecimal(0.1)`", correct: false}
      - {text: "`new BigDecimal(0.1f)`", correct: false}
      - {text: "`new BigDecimal(1 / 10)`", correct: false}
    answer: "Le constructeur à chaîne est exact. Ceux à `double` ou à `float` capturent la valeur binaire imprécise, et `1 / 10` est une division entière qui vaut 0. (`BigDecimal.valueOf(0.1)` passe par le texte et donne aussi 0.1.)"
  - key: qcm-diviser
    format: multiple-choice
    question: Comment diviser 10 € en trois parts au centime près ?
    choices:
      - {text: "`dix.divide(BigDecimal.valueOf(3), 2, RoundingMode.HALF_UP)`", correct: true}
      - {text: "`dix.divide(BigDecimal.valueOf(3)).setScale(2, RoundingMode.HALF_UP)`", correct: false}
      - {text: "`dix.divide(BigDecimal.valueOf(3), MathContext.DECIMAL32)`", correct: false}
      - {text: "`BigDecimal.valueOf(dix.doubleValue() / 3)`", correct: false}
    answer: "L'échelle et l'arrondi vont dans la division même : sans eux, `divide` lève une `ArithmeticException` avant tout `setScale`. `DECIMAL32` garde 7 chiffres significatifs, pas 2 décimales."
  - key: qcm-comparer
    format: multiple-choice
    question: "Laquelle de ces expressions teste qu'un solde `BigDecimal` est négatif ?"
    choices:
      - {text: "`solde.compareTo(BigDecimal.ZERO) < 0`", correct: true}
      - {text: "`solde < 0`", correct: false}
      - {text: "`solde.equals(BigDecimal.ZERO)`", correct: false}
      - {text: "`solde.scale() < 0`", correct: false}
    answer: "`compareTo` (ou `signum() < 0`) compare les valeurs. Les opérateurs de comparaison ne s'appliquent pas aux objets, et `scale()` est le nombre de décimales, pas le signe."
  - key: qcm-arrondi
    format: multiple-choice
    question: "Que vaut `new BigDecimal(\"2.345\").setScale(2, RoundingMode.HALF_EVEN)` ?"
    choices:
      - text: "2.34"
        correct: true
      - text: "2.35"
        correct: false
      - text: "2.3"
        correct: false
      - text: "2.345"
        correct: false
    answer: "Le 5 tombe à égalité : on arrondit vers le chiffre pair (4) ; `HALF_UP` donnerait 2.35."
  - key: trous-chaine
    format: fill-in
    question: |-
      Complète pour créer un prix exact :
      ```java
      BigDecimal prix = new BigDecimal(___);   // 19,99 €
      ```
    blanks: [["\"19.99\""]]
    answer: Le constructeur à chaîne est exact ; le constructeur à `double` ne l'est pas.
  - key: trous-add
    format: fill-in
    question: |-
      Complète pour cumuler le prix dans le total :
      ```java
      total = total.___(ligne.prix());
      ```
    blanks: [[add]]
    answer: '`add` renvoie un nouveau `BigDecimal`, qu''on réaffecte.'
  - key: trous-compare
    format: fill-in
    question: |-
      Complète pour comparer deux montants sans tenir compte de l'échelle :
      ```java
      boolean memeMontant = a.___(b) == 0;
      ```
    blanks: [[compareTo]]
    answer: '`equals` tiendrait compte de l''échelle (`2.0` ≠ `2.00`).'
  - key: trous-arrondi
    format: fill-in
    question: |-
      Complète pour arrondir au centime, les demis vers le haut :
      ```java
      BigDecimal arrondi = montant.setScale(2, RoundingMode.___);
      ```
    blanks: [[HALF_UP]]
    answer: '`HALF_UP` est l''arrondi commercial courant.'
  - key: code-new-bigdecimal-2-0-equals
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(new BigDecimal("2.0").equals(new BigDecimal("2.00")) + " "
              + new BigDecimal("2.0").compareTo(new BigDecimal("2.00")));
      ```
    choices:
      - {text: "`false 0`", correct: true}
      - {text: "`true 0`", correct: false}
      - {text: "`false -1`", correct: false}
      - {text: "`true true`", correct: false}
    answer: "`false 0` : `equals` compare aussi l'échelle, `compareTo` seulement la valeur."
    check:
      code: |-
        System.out.println(new BigDecimal("2.0").equals(new BigDecimal("2.00")) + " " + new BigDecimal("2.0").compareTo(new BigDecimal("2.00")));
      output: "false 0"
  - key: code-system-out-println-new-bigdecimal
    format: code-output
    question: "Qu'affiche `System.out.println(new BigDecimal(0.1));` ?"
    choices:
      - text: |-
          ```
          0.1000000000000000055511151231257827021181583404541015625
          ```
        correct: true
      - text: |-
          ```
          0.1
          ```
        correct: false
      - text: |-
          ```
          0.10000000000000001
          ```
        correct: false
      - text: |-
          ```
          0.100000001490116119384765625
          ```
        correct: false
    answer: "La valeur exacte du `double` le plus proche de 0,1 : le constructeur à `double` capture l'imprécision binaire. (La dernière, plus courte, serait celle du `float` 0.1f.)"
    check:
      code: |-
        System.out.println(new BigDecimal(0.1));
      output: "0.1000000000000000055511151231257827021181583404541015625"
  - key: code-divide
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(BigDecimal.ONE.divide(BigDecimal.valueOf(3), 2, RoundingMode.HALF_UP));
      BigDecimal.ONE.divide(BigDecimal.valueOf(3));
      ```
    choices:
      - {text: "`0.33`, puis une `ArithmeticException`", correct: true}
      - {text: "`0.34`, puis une `ArithmeticException`", correct: false}
      - {text: "`0.33`, et rien d'autre", correct: false}
      - {text: "Une `ArithmeticException` dès la première ligne", correct: false}
    answer: '`0.33`, puis une `ArithmeticException` : sans échelle, le résultat aurait une infinité de décimales.'
    check:
      output: "0.33"
      throws: ArithmeticException
  - key: code-arrondis
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      BigDecimal a = new BigDecimal("2.345");
      BigDecimal b = new BigDecimal("2.355");
      System.out.println(a.setScale(2, RoundingMode.HALF_UP) + " " + a.setScale(2, RoundingMode.HALF_EVEN) + " "
              + b.setScale(2, RoundingMode.HALF_EVEN));
      ```
    choices:
      - {text: "`2.35 2.34 2.36`", correct: true}
      - {text: "`2.35 2.35 2.36`", correct: false}
      - {text: "`2.35 2.34 2.35`", correct: false}
      - {text: "`2.34 2.34 2.36`", correct: false}
    answer: '`2.35 2.34 2.36` : `HALF_EVEN` arrondit les demis vers le chiffre pair.'
    check:
      output: "2.35 2.34 2.36"
  - key: bug-double-prix
    format: bug-fix
    question: |-
      Le total d'une facture est faux d'un centime :
      ```java
      double total = 0;
      for (Ligne l : lignes) {
          total += l.prixUnitaire() * l.quantite();
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Calculer en `BigDecimal` (`add`, `multiply`), puis arrondir le total au centime", correct: true}
      - {text: "Garder les `double` et arrondir avec `Math.round(total * 100) / 100.0` à la fin", correct: false}
      - {text: "Passer en `float`, dont la précision suffit largement pour des centimes", correct: false}
      - {text: "Convertir le total avec `new BigDecimal(total)` après la boucle, pour l'exactitude", correct: false}
    answer: |-
      ```java
      BigDecimal total = BigDecimal.ZERO;
      for (Ligne l : lignes) {
          total = total.add(l.prixUnitaire().multiply(BigDecimal.valueOf(l.quantite())));
      }
      total = total.setScale(2, RoundingMode.HALF_UP);
      ```
      Les `double` accumulent des erreurs binaires. En `BigDecimal`, le calcul est exact et l'arrondi est un choix
      explicite.
  - key: bug-add-ignore
    format: bug-fix
    question: |-
      Le total reste toujours à zéro :
      ```java
      BigDecimal total = BigDecimal.ZERO;
      for (BigDecimal montant : montants) {
          total.add(montant);
      }
      ```
      Pourquoi ?
    choices:
      - {text: "`BigDecimal` est immuable : `add` renvoie un nouvel objet, ignoré ici", correct: true}
      - {text: "`BigDecimal.ZERO` est une constante partagée : on ne peut rien lui ajouter", correct: false}
      - {text: "`add` sans `MathContext` arrondit chaque montant à l'entier, donc à zéro", correct: false}
      - {text: "La boucle for-each parcourt des copies des montants, pas les originaux", correct: false}
    answer: "`BigDecimal` est immuable : `add` renvoie un nouvel objet, ignoré ici. La correction : `total = total.add(montant);`."
  - key: bug-equals-test
    format: bug-fix
    question: |-
      Ce test échoue alors que le montant est juste :
      ```java
      assertEquals(new BigDecimal("10"), facture.total());   // total() vaut 10.00
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Comparer avec `compareTo`, ou `isEqualByComparingTo(\"10\")` d'AssertJ", correct: true}
      - {text: "Écrire `new BigDecimal(\"10.0\")` comme valeur attendue dans l'assertion", correct: false}
      - {text: "Remplacer `assertEquals` par `assertSame`, qui compare mieux les montants", correct: false}
      - {text: "Comparer les `toString()` des deux montants plutôt que les objets", correct: false}
    answer: |-
      ```java
      assertEquals(0, new BigDecimal("10").compareTo(facture.total()));
      // ou : assertThat(facture.total()).isEqualByComparingTo("10");
      ```
      `equals` compare l'échelle : `10` et `10.00` sont différents. On compare les valeurs avec `compareTo`.
  - key: bug-divide-sans-arrondi
    format: bug-fix
    question: |-
      Le partage d'une note entre trois personnes lève une `ArithmeticException` :
      ```java
      BigDecimal part = total.divide(BigDecimal.valueOf(personnes));
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`total.divide(BigDecimal.valueOf(personnes), 2, RoundingMode.HALF_UP)`", correct: true}
      - {text: "`total.divide(BigDecimal.valueOf(personnes)).setScale(2, RoundingMode.HALF_UP)`", correct: false}
      - {text: "`total.divide(BigDecimal.valueOf(personnes), MathContext.UNLIMITED)`", correct: false}
      - {text: "`BigDecimal.valueOf(total.doubleValue() / personnes)`", correct: false}
    answer: |-
      ```java
      BigDecimal part = total.divide(BigDecimal.valueOf(personnes), 2, RoundingMode.HALF_UP);
      ```
      Une division qui ne tombe pas juste a une infinité de décimales : on précise l'échelle et l'arrondi (et l'on décide
      qui paie le centime restant).
  - key: dois-calculer-montants-avec-tva-remises
    format: scenario
    question: "Tu dois calculer des montants avec TVA et remises. Comment t'y prends-tu ?"
    choices:
      - {text: "`BigDecimal` construit depuis du texte, avec une règle d'arrondi explicite validée par le métier", correct: true}
      - {text: "Des `double`, arrondis à deux décimales avec `Math.round` au moment de l'affichage", correct: false}
      - {text: "Des `float`, dont la précision suffit pour des montants à deux décimales", correct: false}
      - {text: "`BigDecimal` construit par `new BigDecimal(double)` depuis les prix existants", correct: false}
    answer: "Jamais de `double` : l'erreur binaire s'accumule en écarts d'un centime. `BigDecimal` construit depuis du texte ou `valueOf`, avec un arrondi décidé avec le métier (à quelle étape, quel mode), `compareTo` pour comparer et un type décimal exact en base (`NUMERIC(19,4)`). Pour un système simple, des centimes dans un `long` conviennent aussi."
  - key: scenario-partage-centime
    format: scenario
    question: Une note de 100 € doit être partagée en trois. Comment gères-tu le centime restant ?
    choices:
      - {text: "Arrondir vers le bas, puis répartir le reste centime par centime : 33,34 + 33,33 + 33,33", correct: true}
      - {text: "Donner 33,33 à chacun : le centime perdu reste dans l'arrondi, sans conséquence", correct: false}
      - {text: "Arrondir chaque part au plus proche : trois parts arrondies retombent sur 100 €", correct: false}
      - {text: "Garder 33,333... en `double` pour ne perdre aucune fraction dans le partage", correct: false}
    answer: "33,33 × 3 = 99,99 : il reste un centime. Je répartis le reste sur les premières parts pour que leur somme égale toujours le total. Qui reçoit le centime est une règle métier, qui se décide et se teste, y compris aux cas limites."
  - key: scenario-api-double
    format: scenario
    question: Une API externe renvoie des prix en `double` dans son JSON. Que fais-tu ?
    choices:
      - {text: "Les lire en `BigDecimal` dès la frontière, depuis le texte du JSON (`USE_BIG_DECIMAL_FOR_FLOATS`)", correct: true}
      - {text: "Les garder en `double` et les arrondir au centime à chaque calcul du domaine", correct: false}
      - {text: "Les convertir avec `new BigDecimal(prix)` juste après la désérialisation en `double`", correct: false}
      - {text: "Les stocker en `FLOAT` dans la base, pour respecter le format de l'API externe", correct: false}
    answer: "Je les convertis en `BigDecimal` dès la frontière, depuis leur texte : avec Jackson, `USE_BIG_DECIMAL_FOR_FLOATS` (ou des champs `BigDecimal` dans le DTO) évite de passer par un `double`, que `new BigDecimal(double)` figerait avec son erreur. Je vérifie aussi la devise et l'échelle, et je refuse une valeur non conforme."
  - key: scenario-centimes-long
    format: scenario
    question: "Centimes dans un `long` ou `BigDecimal` : comment choisis-tu ?"
    choices:
      - {text: "`long` pour une devise et des sommes simples ; `BigDecimal` dès qu'il y a des taux ou des conversions", correct: true}
      - {text: "`long` pour les taux et les conversions ; `BigDecimal` pour les sommes simples d'une seule devise", correct: false}
      - {text: "`BigDecimal` toujours : un `long` ne peut pas représenter un montant de plus d'un million", correct: false}
      - {text: "`long` toujours : `BigDecimal` est bien trop lent pour tout calcul de montants", correct: false}
    answer: "Les centimes en `long` sont simples et rapides pour une seule devise et des opérations simples. `BigDecimal` s'impose avec des taux, des pourcentages ou des conversions, qui demandent une précision intermédiaire et des arrondis explicites. Dans les deux cas, un type `Montant` immuable évite de mélanger les devises."
