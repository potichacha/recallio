notion: bigdecimal
cards:
  - key: utiliser-new-bigdecimal-0-1
    format: course
    question: Pourquoi ne pas utiliser `new BigDecimal(0.1)` ?
    answer: Il capture la valeur binaire imprécise ; utiliser `new BigDecimal("0.1")` ou `BigDecimal.valueOf(0.1)`.
  - key: equals-vs-compareto-bigdecimal
    format: course
    question: '`equals` vs `compareTo` sur BigDecimal ?'
    answer: equals compare valeur et échelle (2.0 ≠ 2.00) ; compareTo compare uniquement la valeur.
  - key: passe-avec-bigdecimal-one-divide-bigdecimal
    format: course
    question: Que se passe-t-il avec `BigDecimal.ONE.divide(BigDecimal.valueOf(3))` ?
    answer: 'ArithmeticException (développement décimal infini) : il faut une échelle et un RoundingMode.'
  - key: half-even
    format: course
    question: C'est quoi HALF_EVEN ?
    answer: 'L''arrondi bancaire : au plus proche, et en cas d''égalité vers le chiffre pair, pour éviter un biais cumulé.'
  - key: dois-calculer-montants-avec-tva-remises
    format: scenario
    question: Tu dois calculer des montants avec TVA et remises. Comment tu t'y prends ?
    answer: |-
      Jamais de `double` : l'erreur de représentation binaire s'accumule et produit des écarts d'un centime, inacceptables en comptabilité.
      J'utiliserais `BigDecimal` construit depuis des String ou `valueOf`, avec une **règle d'arrondi explicite** et validée avec le métier : à quelle étape on arrondit (par ligne ou sur le total, ce qui ne donne pas le même résultat) et avec quel mode (HALF_UP est l'usage commercial, HALF_EVEN limite le biais statistique).
      Je ferais attention à `equals` qui tient compte de l'échelle : pour comparer, `compareTo`. Et je stockerais en base dans un type décimal exact (`NUMERIC(19,4)` par exemple), pas un FLOAT.
      Alternative pour un système simple : manipuler des centimes dans un `long`, plus rapide et sans ambiguïté, à condition de bien gérer les divisions.
  - key: code-new-bigdecimal-2-0-equals
    format: code-output
    question: '`new BigDecimal("2.0").equals(new BigDecimal("2.00"))` et `compareTo` ?'
    answer: '`false` et `0` : equals compare aussi l''échelle.'
  - key: code-system-out-println-new-bigdecimal
    format: code-output
    question: '`System.out.println(new BigDecimal(0.1));`'
    answer: '`0.1000000000000000055511151231257827021181583404541015625`.'
