notion: java-time-panorama
lesson: |-
  Depuis Java 8 (JSR 310, inspirée de Joda-Time), le package **`java.time`** remplace `Date` et `Calendar`. Chaque type
  répond à une question précise :

  | Type | Représente | Exemple |
  |---|---|---|
  | `LocalDate` | une date sans heure ni fuseau | un anniversaire : `2025-03-14` |
  | `LocalTime` | une heure sans date | l'ouverture d'un magasin : `09:30` |
  | `LocalDateTime` | une date et une heure, **sans fuseau** | un horaire affiché |
  | `Instant` | un **instant** absolu, en UTC | l'horodatage d'un événement |
  | `ZonedDateTime` | date, heure et **fuseau** (`Europe/Paris`) | un rendez-vous dans une ville |
  | `OffsetDateTime` | date, heure et **décalage** fixe (`+02:00`) | un échange d'API, une colonne de base |
  | `Duration`, `Period` | une durée exacte, une durée calendaire | `PT1H30M`, `P1M` |

  Ce qui change par rapport à `Date` et `Calendar` :
  - tous les types sont **immuables** et **thread-safe** ;
  - les mois vont de **1 à 12** (`Month.MARCH`), et non de 0 à 11 ;
  - une API claire et cohérente : `of`, `parse`, `plus`, `minus`, `with`, `isBefore` ;
  - la distinction explicite entre un instant et sa représentation locale ;
  - le format ISO 8601 par défaut (`toString` et `parse`).

  **Piège classique** : utiliser `LocalDateTime` pour horodater un événement. Sans fuseau, `2025-10-26T02:30` est
  ambigu (il existe deux fois à Paris cette nuit-là) ; un horodatage est un `Instant`.

  **En entretien** : « `java.time` est immuable et sépare l'instant (`Instant`) de sa représentation locale
  (`LocalDate`, `ZonedDateTime`) ; `Date` et `Calendar` ne servent plus qu'aux vieilles API. »
tour:
  - title: java.time
    text: |-
      Les anciennes classes `Date` et `Calendar` sont modifiables, mal conçues (les mois de `Calendar` commencent à 0),
      et confondent l'instant et la date affichée. Depuis Java 8, `java.time` les remplace :

      - `LocalDate`, `LocalTime` et `LocalDateTime` : une date, une heure, sans fuseau ;
      - `Instant` : un instant précis, en UTC ;
      - `ZonedDateTime` : une date et une heure dans un fuseau ;
      - `Duration` et `Period` : des durées.

      Toutes sont **immuables** : chaque opération renvoie un nouvel objet.
    example:
      files:
        Main.java: |-
          void main() {
              LocalDate sortie = LocalDate.of(2025, 9, 16);
              IO.println(sortie + " " + sortie.getDayOfWeek());
              Instant instant = Instant.parse("2026-11-05T09:30:00Z");
              ZonedDateTime paris = instant.atZone(ZoneId.of("Europe/Paris"));
              IO.println(paris);
              LocalDate apres = sortie.plusMonths(6);
              IO.println(apres + " " + sortie);
          }
      output: |-
        2025-09-16 TUESDAY
        2026-11-05T10:30+01:00[Europe/Paris]
        2026-03-16 2025-09-16
cards:
  - key: abandonner-date-calendar
    format: course
    question: "Pourquoi abandonner `Date` et `Calendar` ?"
    choices:
      - {text: "Ils sont mutables, non thread-safe, avec des mois à partir de 0 et une API confuse", correct: true}
      - {text: "Ils ne savent pas représenter les dates d'avant le 1er janvier 1970", correct: false}
      - {text: "Ils sont lents : chaque appel interroge l'horloge du système d'exploitation", correct: false}
      - {text: "Ils ont été retirés du JDK en Java 11, avec les modules de Java EE", correct: false}
    answer: "Mutables, non thread-safe, des mois à partir de 0 et une API confuse : `java.time` corrige tout cela. Ils restent dans le JDK, pour la compatibilité."
  - key: quel-type
    format: course
    question: Quel type `java.time` pour un horodatage d'événement, et pour une date d'anniversaire ?
    choices:
      - {text: "Un `Instant` pour l'horodatage ; un `LocalDate` pour l'anniversaire", correct: true}
      - {text: "Un `LocalDateTime` pour l'horodatage ; un `ZonedDateTime` pour l'anniversaire", correct: false}
      - {text: "Un `LocalDate` pour l'horodatage ; un `Instant` pour l'anniversaire", correct: false}
      - {text: "Un `Instant` pour les deux, converti à l'affichage", correct: false}
    answer: Un `Instant` pour l'horodatage (un point absolu sur la ligne du temps) ; un `LocalDate` pour l'anniversaire (une date de calendrier, sans heure ni fuseau).
  - key: offset-vs-zone
    format: course
    question: Quelle différence entre `OffsetDateTime` et `ZonedDateTime` ?
    choices:
      - {text: "`OffsetDateTime` porte un décalage fixe ; `ZonedDateTime`, un fuseau et ses règles", correct: true}
      - {text: "`OffsetDateTime` porte un fuseau et ses règles ; `ZonedDateTime`, un décalage fixe", correct: false}
      - {text: "`OffsetDateTime` est toujours en UTC ; `ZonedDateTime`, dans le fuseau par défaut", correct: false}
      - {text: "Aucune : `OffsetDateTime` est l'ancien nom de `ZonedDateTime`", correct: false}
    answer: '`OffsetDateTime` porte un décalage fixe (`+02:00`) ; `ZonedDateTime` porte un fuseau (`Europe/Paris`) et ses règles, dont l''heure d''été : le décalage y change selon la date.'
  - key: origine
    format: course
    question: D'où vient `java.time` ?
    choices:
      - {text: "De la JSR 310, livrée en Java 8, inspirée de Joda-Time", correct: true}
      - {text: "D'Apache Commons Lang, intégrée au JDK en Java 7", correct: false}
      - {text: "De la JSR 310, livrée en Java 11 avec les modules", correct: false}
      - {text: "De `Calendar`, renommé et rendu immuable en Java 8", correct: false}
    answer: De la JSR 310, livrée en Java 8, conçue par l'auteur de la bibliothèque Joda-Time, dont elle reprend les idées.
  - key: vf-immuable
    format: true-false
    question: Les types de `java.time` sont immuables.
    truth: true
    answer: '`plusDays`, `withYear`... renvoient de nouveaux objets.'
  - key: vf-mois
    format: true-false
    question: "Dans `java.time`, `LocalDate.of(2025, 1, 1)` désigne le 1er février."
    truth: false
    answer: "Les mois vont de 1 à 12 : c'est le 1er janvier (avec `Calendar`, 1 aurait été février)."
  - key: vf-local-fuseau
    format: true-false
    question: Un `LocalDateTime` désigne un instant précis dans le monde.
    truth: false
    answer: Sans fuseau, la même valeur correspond à des instants différents selon le lieu.
  - key: vf-iso
    format: true-false
    question: "`toString()` d'un type `java.time` produit du ISO 8601."
    truth: true
    answer: Par exemple `2025-03-14` ou `2025-03-14T10:15:30Z`, relu par `parse`.
  - key: qcm-type-evenement
    format: multiple-choice
    question: Quel type pour horodater la création d'une commande ?
    choices:
      - text: "`Instant`"
        correct: true
      - text: "`LocalDateTime`"
        correct: false
      - text: "`LocalDate`"
        correct: false
      - text: "`LocalTime`"
        correct: false
    answer: Un instant absolu, comparable quel que soit le fuseau du serveur ou du client.
  - key: qcm-type-rendez-vous
    format: multiple-choice
    question: "Quel type choisir pour une réunion à 9 h à Paris, le mois prochain ?"
    choices:
      - {text: "`ZonedDateTime` (ou une `LocalDateTime` et un `ZoneId`)", correct: true}
      - {text: "`Instant` seul, calculé dès aujourd'hui en UTC", correct: false}
      - {text: "`OffsetDateTime`, avec le décalage d'aujourd'hui", correct: false}
      - {text: "`LocalTime`, l'heure seule, sans la date", correct: false}
    answer: "La réunion est définie par l'heure locale d'un lieu, dont les règles peuvent changer d'ici là. Un `Instant` ou un décalage calculés aujourd'hui se tromperaient si l'heure d'été change entre-temps."
  - key: qcm-avantages
    format: multiple-choice
    question: "Lequel de ces avantages appartient à `java.time`, et non à `Date` et `Calendar` ?"
    choices:
      - {text: "Des types immuables et thread-safe", correct: true}
      - {text: "Des méthodes `setYear` et `setMonth`", correct: false}
      - {text: "Des mois numérotés de 0 à 11", correct: false}
      - {text: "Un seul type pour l'instant et la date", correct: false}
    answer: "Ses types sont immuables, donc thread-safe ; il compte aussi les mois de 1 à 12 et sépare l'instant de la date locale. Les setters, les mois de 0 à 11 et le type unique sont les défauts de l'ancienne API."
  - key: qcm-duree
    format: multiple-choice
    question: Quel type pour un délai de 90 minutes ?
    choices:
      - text: "`Duration`"
        correct: true
      - text: "`Period`"
        correct: false
      - text: "`LocalTime`"
        correct: false
      - text: "`int`, en minutes"
        correct: false
    answer: '`Period` compte en années, mois, jours ; un `int` laisserait l''unité implicite.'
  - key: scenario-choisir-type
    format: scenario
    question: "Un junior te demande quel type de date utiliser dans une application de réservation. Que lui réponds-tu ?"
    choices:
      - {text: "Cela dépend de ce que la valeur représente : `Instant`, `LocalDate`, ou heure locale et `ZoneId`", correct: true}
      - {text: "`LocalDateTime` partout : il contient la date et l'heure, il suffit donc à tous les cas", correct: false}
      - {text: "`Instant` partout : un seul type, simplement converti à l'affichage selon les besoins", correct: false}
      - {text: "`ZonedDateTime` partout, dans le fuseau du serveur, pour ne jamais se tromper", correct: false}
    answer: "Je pars de ce que la valeur représente : un horodatage technique, un `Instant` en UTC ; une date de naissance, un `LocalDate` ; un créneau dans un hôtel, l'heure locale du lieu et son `ZoneId`. Les durées : `Period` ou `Duration`, selon qu'on compte en jours de calendrier ou en heures exactes ; et pour l'API, de l'ISO 8601."
  - key: scenario-migration
    format: scenario
    question: Une vieille application utilise `Date` partout. Comment migres-tu vers `java.time` ?
    choices:
      - {text: "Progressivement : convertir aux frontières, puis remplacer les champs du domaine un à un", correct: true}
      - {text: "D'un coup, dans une seule PR qui remplace tous les `Date` par des `LocalDateTime`", correct: false}
      - {text: "Ne rien migrer : envelopper chaque `Date` dans une classe qui le rend immuable", correct: false}
      - {text: "Remplacer chaque `Date` par un `long` de millisecondes, plus simple à manipuler", correct: false}
    answer: "Progressivement, en commençant par les frontières (`date.toInstant()`, `Date.from(instant)`, JDBC 4.2), puis en remplaçant les champs du domaine par le bon type : un `Date` cachait tantôt un instant, tantôt une simple date, d'où le piège d'un remplacement aveugle. Les tests servent de filet, et je finis par les `SimpleDateFormat`."
  - key: scenario-api-dates
    format: scenario
    question: Quel format de date choisis-tu pour une API REST publique ?
    choices:
      - {text: "ISO 8601 : `2025-03-14` pour une date, l'UTC ou un décalage explicite pour un instant", correct: true}
      - {text: "Le format local de l'utilisateur, comme `14/03/2025 10:00`, plus lisible", correct: false}
      - {text: "Des millisecondes depuis 1970 partout, précises et sans ambiguïté de format", correct: false}
      - {text: "ISO 8601 sans fuseau, comme `2025-03-14T10:00:00`, à l'heure du serveur", correct: false}
    answer: "ISO 8601 en texte : `2025-03-14` pour une date, et pour un instant l'UTC (`2025-03-14T09:00:00Z`) ou un décalage explicite. Jamais un format local, ambigu (le 3 mars aux États-Unis), ni un horodatage sans fuseau ; je documente le format dans l'OpenAPI. Les millisecondes, illisibles, restent aux échanges internes."
  - key: scenario-bug-fuseau
    format: scenario
    question: Des commandes passées vers minuit apparaissent au mauvais jour dans les rapports. Que soupçonnes-tu ?
    choices:
      - {text: "Le rapport tronque au jour en UTC ou au fuseau du serveur, au lieu du fuseau métier", correct: true}
      - {text: "Les commandes sont stockées en UTC, une erreur qu'il faut corriger dans la base", correct: false}
      - {text: "L'horloge du serveur dérive de quelques minutes, à resynchroniser par NTP", correct: false}
      - {text: "Les commandes de minuit sont enregistrées en différé, après un traitement de nuit", correct: false}
    answer: "Une confusion de fuseau : stocker en UTC est bien, mais le rapport tronque au jour en UTC (ou au fuseau du serveur) au lieu du fuseau métier. Une commande à 0 h 30 à Paris est à 23 h 30 la veille en UTC. Je rends le fuseau explicite (`instant.atZone(ZoneId.of(\"Europe/Paris\")).toLocalDate()`) et j'ajoute un test à minuit avec une `Clock` fixe."
