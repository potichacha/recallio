notion: java-time-panorama
lesson: |-
  Depuis Java 8 (JSR 310, inspirée de Joda-Time), le package **`java.time`** remplace `Date` et `Calendar`. Chaque type
  répond à une question précise :

  | Type | Représente | Exemple |
  |---|---|---|
  | `LocalDate` | une date sans heure ni fuseau | un anniversaire : `2025-03-14` |
  | `LocalTime` | une heure sans date | l'ouverture d'un magasin : `09:30` |
  | `LocalDateTime` | une date et une heure, **sans fuseau** | un horaire affiché |
  | `Instant` | un **instant** absolu, en UTC | l'horodatage d'un événement |
  | `ZonedDateTime` | date, heure et **fuseau** (`Europe/Paris`) | un rendez-vous dans une ville |
  | `OffsetDateTime` | date, heure et **décalage** fixe (`+02:00`) | un échange d'API, une colonne de base |
  | `Duration`, `Period` | une durée exacte, une durée calendaire | `PT1H30M`, `P1M` |

  Ce qui change par rapport à `Date` et `Calendar` :
  - tous les types sont **immuables** et **thread-safe** ;
  - les mois vont de **1 à 12** (`Month.MARCH`), et non de 0 à 11 ;
  - une API claire et cohérente : `of`, `parse`, `plus`, `minus`, `with`, `isBefore` ;
  - la distinction explicite entre un instant et sa représentation locale ;
  - le format ISO 8601 par défaut (`toString` et `parse`).

  **Piège classique** : utiliser `LocalDateTime` pour horodater un événement. Sans fuseau, `2025-10-26T02:30` est
  ambigu (il existe deux fois à Paris cette nuit-là) ; un horodatage est un `Instant`.

  **En entretien** : « `java.time` est immuable et sépare l'instant (`Instant`) de sa représentation locale
  (`LocalDate`, `ZonedDateTime`) ; `Date` et `Calendar` ne servent plus qu'aux vieilles API. »
cards:
  - key: abandonner-date-calendar
    format: course
    question: Pourquoi abandonner Date et Calendar ?
    answer: Mutables, non thread-safe, mois à partir de 0, API confuse.
  - key: quel-type
    format: course
    question: Quel type `java.time` pour un horodatage d'événement, et pour une date d'anniversaire ?
    answer: Un `Instant` pour l'horodatage (un point absolu sur la ligne du temps) ; un `LocalDate` pour l'anniversaire (une date de calendrier, sans heure ni fuseau).
  - key: offset-vs-zone
    format: course
    question: Quelle différence entre `OffsetDateTime` et `ZonedDateTime` ?
    answer: '`OffsetDateTime` porte un décalage fixe (`+02:00`) ; `ZonedDateTime` porte un fuseau (`Europe/Paris`) et ses règles, dont l''heure d''été : le décalage y change selon la date.'
  - key: origine
    format: course
    question: D'où vient `java.time` ?
    answer: De la JSR 310, livrée en Java 8, conçue par l'auteur de la bibliothèque Joda-Time, dont elle reprend les idées.
  - key: vf-immuable
    format: true-false
    question: Les types de `java.time` sont immuables.
    truth: true
    answer: '`plusDays`, `withYear`... renvoient de nouveaux objets.'
  - key: vf-mois
    format: true-false
    question: "Dans `java.time`, `LocalDate.of(2025, 1, 1)` désigne le 1er février."
    truth: false
    answer: "Les mois vont de 1 à 12 : c'est le 1er janvier (avec `Calendar`, 1 aurait été février)."
  - key: vf-local-fuseau
    format: true-false
    question: Un `LocalDateTime` désigne un instant précis dans le monde.
    truth: false
    answer: Sans fuseau, la même valeur correspond à des instants différents selon le lieu.
  - key: vf-iso
    format: true-false
    question: "`toString()` d'un type `java.time` produit du ISO 8601."
    truth: true
    answer: Par exemple `2025-03-14` ou `2025-03-14T10:15:30Z`, relu par `parse`.
  - key: qcm-type-evenement
    format: multiple-choice
    question: Quel type pour horodater la création d'une commande ?
    choices:
      - text: "`Instant`"
        correct: true
      - text: "`LocalDateTime`"
        correct: false
      - text: "`LocalDate`"
        correct: false
      - text: "`LocalTime`"
        correct: false
    answer: Un instant absolu, comparable quel que soit le fuseau du serveur ou du client.
  - key: qcm-type-rendez-vous
    format: multiple-choice
    question: Quel type pour un rendez-vous à 9 h à Paris le mois prochain ?
    choices:
      - text: "`ZonedDateTime` (ou une `LocalDateTime` et un `ZoneId`)"
        correct: true
      - text: "`Instant` seul"
        correct: false
      - text: "`LocalTime`"
        correct: false
      - text: "`Duration`"
        correct: false
    answer: Le rendez-vous est défini par l'heure locale d'un lieu, dont les règles peuvent changer d'ici là.
  - key: qcm-avantages
    format: multiple-choice
    question: Quels sont les avantages de `java.time` sur `Date` et `Calendar` ?
    choices:
      - text: "Des types immuables et thread-safe"
        correct: true
      - text: "Des mois de 1 à 12"
        correct: true
      - text: "Des types distincts pour un instant et une date locale"
        correct: true
      - text: "Des méthodes `setYear`, `setMonth`"
        correct: false
    answer: L'absence de setters fait justement partie de ses qualités.
  - key: qcm-duree
    format: multiple-choice
    question: Quel type pour un délai de 90 minutes ?
    choices:
      - text: "`Duration`"
        correct: true
      - text: "`Period`"
        correct: false
      - text: "`LocalTime`"
        correct: false
      - text: "`int`, en minutes"
        correct: false
    answer: '`Period` compte en années, mois, jours ; un `int` laisserait l''unité implicite.'
  - key: scenario-choisir-type
    format: scenario
    question: Explique à un junior quel type de date utiliser dans une application de réservation.
    answer: |-
      Je pars de la question « qu'est-ce que cette valeur représente ? ». Un horodatage technique (création, paiement) :
      `Instant`, stocké en UTC. Une date de naissance ou un jour férié : `LocalDate`, qui ne dépend d'aucun fuseau. Un
      créneau de réservation dans un hôtel : l'heure locale du lieu plus son `ZoneId`, pour afficher « 15 h » à Paris
      quelle que soit l'heure d'été. Les durées (séjour de trois nuits, délai d'annulation de 48 h) : `Period` ou
      `Duration` selon qu'on compte en jours de calendrier ou en heures exactes. Et pour l'API, de l'ISO 8601.
  - key: scenario-migration
    format: scenario
    question: Une vieille application utilise `Date` partout. Comment migres-tu vers `java.time` ?
    answer: |-
      Progressivement, en commençant par les frontières. Je convertis aux points d'entrée et de sortie (`date.toInstant()`,
      `Date.from(instant)`, et les pilotes JDBC 4.2 qui lisent directement `LocalDate` et `OffsetDateTime`), puis je
      remplace les champs du domaine en choisissant le bon type pour chacun (un `Date` cachait souvent soit un instant,
      soit une simple date). Les tests existants servent de filet ; j'ajoute des tests sur les fuseaux et l'heure d'été.
      Je supprime enfin les `SimpleDateFormat` au profit de `DateTimeFormatter`.
  - key: scenario-api-dates
    format: scenario
    question: Quel format de date choisis-tu pour une API REST publique ?
    answer: |-
      ISO 8601 en texte : `2025-03-14` pour une date, et pour un instant soit l'UTC (`2025-03-14T09:00:00Z`), soit un
      décalage explicite (`2025-03-14T10:00:00+01:00`). Jamais un format local comme `14/03/2025`, ambigu (le 3 mars
      aux États-Unis), ni un horodatage sans fuseau. Je documente le format dans la spécification OpenAPI
      (`format: date`, `format: date-time`). Les nombres de millisecondes depuis 1970 sont précis mais illisibles :
      je les réserve aux échanges internes à fort volume.
  - key: scenario-bug-fuseau
    format: scenario
    question: Des commandes passées vers minuit apparaissent au mauvais jour dans les rapports. Que soupçonnes-tu ?
    answer: |-
      Une confusion de fuseau : l'horodatage est probablement stocké en UTC (ce qui est bien), mais le rapport le
      tronque au jour en UTC, ou en utilisant le fuseau par défaut du serveur, au lieu du fuseau métier (celui du
      magasin, ou de l'utilisateur). Une commande passée à 0 h 30 à Paris est à 23 h 30 la veille en UTC. Je rends le
      fuseau explicite (`instant.atZone(ZoneId.of("Europe/Paris")).toLocalDate()`), je ne compte jamais sur le fuseau
      par défaut, et j'ajoute un test avec une commande à minuit et une `Clock` fixe.
