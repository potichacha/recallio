notion: string-comparaison
lesson: |-
  Comparer des chaînes, c'est d'abord choisir **ce qu'on compare** :

  | Besoin | Méthode |
  |---|---|
  | même contenu, casse comprise | `a.equals(b)` |
  | même contenu, sans tenir compte de la casse | `a.equalsIgnoreCase(b)` |
  | ordre (tri) | `a.compareTo(b)` : négatif, zéro ou positif |
  | ordre sans la casse | `a.compareToIgnoreCase(b)`, `String.CASE_INSENSITIVE_ORDER` |
  | ordre de la langue (accents) | `Collator.getInstance(Locale.FRENCH)` |

  ```java
  "Java".equals("java")              // false
  "Java".equalsIgnoreCase("java")    // true
  "a".compareTo("b")                 // négatif : "a" vient avant
  "Z".compareTo("a")                 // négatif : les majuscules passent avant les minuscules
  "10".compareTo("9")                // négatif : comparaison caractère par caractère, pas numérique
  ```

  - `compareTo` compare les **codes** des caractères un par un : les majuscules avant les minuscules, et `é` (233)
    après `z` (122). Pour un tri lisible par un humain, on utilise un `Collator`.
  - On écrit la constante en premier, `"oui".equals(saisie)`, pour éviter une `NullPointerException` ; ou
    `Objects.equals(a, b)`.
  - `==` compare les références, jamais le contenu.

  **Piège classique** : trier des chaînes qui contiennent des nombres (`"fichier10"`, `"fichier9"`) ou des accents avec
  l'ordre naturel. Le résultat suit les codes des caractères, pas l'intuition.

  **En entretien** : « `equals` pour l'égalité, `compareTo` pour l'ordre par codes de caractères, et un `Collator` pour
  un tri qui respecte la langue. »
tour:
  - title: Comparer des chaînes
    text: |-
      `equals` compare le contenu de deux chaînes, casse comprise, et `equalsIgnoreCase` sans tenir compte des
      majuscules. `compareTo` les range dans l'ordre lexicographique, celui des codes de caractères : négatif si la
      première vient avant, zéro si elles sont égales, positif sinon.

      Cet ordre n'est pas celui du dictionnaire : les majuscules passent avant les minuscules, et les lettres accentuées
      après. Pour trier du texte affiché, on utilise un `Collator`, qui suit les règles d'une langue.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println("java".equals("Java") + " " + "java".equalsIgnoreCase("Java"));
              IO.println("abc".compareTo("abd") + " " + "b".compareTo("a") + " " + "a".compareTo("a"));

              List<String> mots = new ArrayList<>(List.of("été", "Zèbre", "arbre"));
              Collections.sort(mots);
              IO.println(mots);
              mots.sort(Collator.getInstance(Locale.FRENCH));
              IO.println(mots);
          }
      output: |-
        false true
        -1 1 0
        [Zèbre, arbre, été]
        [arbre, été, Zèbre]
cards:
  - key: equals-vs-compare
    format: course
    question: Quelle différence entre `equals` et `compareTo` sur des chaînes ?
    choices:
      - {text: "`equals` dit si le contenu est identique ; `compareTo` donne un ordre (négatif, zéro, positif)", correct: true}
      - {text: "`equals` compare les références des chaînes ; `compareTo` compare leur contenu", correct: false}
      - {text: "`equals` ignore la casse des lettres ; `compareTo` en tient compte", correct: false}
      - {text: "`equals` donne un ordre ; `compareTo` dit seulement si le contenu est identique", correct: false}
    answer: '`equals` dit si le contenu est identique ; `compareTo` donne un ordre (négatif, zéro, positif) en comparant les codes des caractères un par un.'
  - key: ordre-codes
    format: course
    question: Pourquoi `"Zèbre"` vient-il avant `"abeille"` avec `compareTo` ?
    choices:
      - {text: "`compareTo` compare les codes UTF-16 : `'Z'` (90) est plus petit que `'a'` (97)", correct: true}
      - {text: "`compareTo` trie d'abord par longueur, et « Zèbre » est le plus court", correct: false}
      - {text: "`compareTo` ignore la première lettre quand le mot contient un accent", correct: false}
      - {text: "`compareTo` compare de droite à gauche, en partant de la dernière lettre", correct: false}
    answer: '`compareTo` compare les codes UTF-16 : `''Z''` (90) est plus petit que `''a''` (97), donc toutes les majuscules passent avant les minuscules.'
  - key: collator
    format: course
    question: À quoi sert `Collator` ?
    choices:
      - {text: "À comparer des chaînes selon les règles d'une langue (accents, casse)", correct: true}
      - {text: "À regrouper les chaînes identiques pour économiser la mémoire", correct: false}
      - {text: "À comparer des chaînes plus vite que `compareTo`, octet par octet", correct: false}
      - {text: "À convertir des chaînes d'un encodage de caractères à un autre", correct: false}
    answer: À comparer des chaînes selon les règles d'une langue (accents, casse), par exemple `Collator.getInstance(Locale.FRENCH)` pour que `"éclair"` vienne entre `"eau"` et `"zèbre"`.
  - key: null-safe
    format: course
    question: Comment comparer une saisie à une constante sans risque de `NullPointerException` ?
    choices:
      - {text: "`\"oui\".equals(saisie)`, ou `Objects.equals(saisie, \"oui\")`", correct: true}
      - {text: "`saisie.equals(\"oui\")`, qui renvoie `false` pour `null`", correct: false}
      - {text: "`saisie == \"oui\"`, qui ne lève jamais d'exception", correct: false}
      - {text: "`saisie.compareTo(\"oui\") == 0`, qui accepte `null`", correct: false}
    answer: En appelant `equals` sur la constante, `"oui".equals(saisie)`, ou avec `Objects.equals(saisie, "oui")`.
  - key: vf-ignore-case
    format: true-false
    question: "`\"Java\".equalsIgnoreCase(\"JAVA\")` vaut `true`."
    truth: true
    answer: La casse est ignorée.
  - key: vf-numerique
    format: true-false
    question: "`\"10\".compareTo(\"9\")` est positif, comme 10 > 9."
    truth: false
    answer: "On compare `'1'` et `'9'` : `\"10\"` vient avant `\"9\"`."
  - key: vf-accents
    format: true-false
    question: Avec l'ordre naturel des chaînes, `"éclair"` vient avant `"zèbre"`.
    truth: false
    answer: '`é` (233) a un code plus grand que `z` (122) ; il faut un `Collator`.'
  - key: vf-zero
    format: true-false
    question: "`a.compareTo(b) == 0` équivaut à `a.equals(b)` pour des `String`."
    truth: true
    answer: L'ordre naturel de `String` est cohérent avec `equals`.
  - key: qcm-egalite
    format: multiple-choice
    question: "Laquelle de ces expressions compare correctement le contenu de `saisie` à `\"oui\"`, même si `saisie` vaut `null` ?"
    choices:
      - {text: "`\"oui\".equals(saisie)`", correct: true}
      - {text: "`saisie.equals(\"oui\")`", correct: false}
      - {text: "`saisie == \"oui\"`", correct: false}
      - {text: "`saisie.compareTo(\"oui\") > 0`", correct: false}
    answer: "Appelée sur la constante, `equals` renvoie `false` pour `null`, comme `Objects.equals(saisie, \"oui\")`. `saisie.equals` lèverait une exception, `==` compare les références, et un `compareTo` positif signifie « après »."
  - key: qcm-tri-insensible
    format: multiple-choice
    question: "Lequel de ces appels trie une liste de chaînes sans tenir compte de la casse ?"
    choices:
      - {text: "`liste.sort(String.CASE_INSENSITIVE_ORDER)`", correct: true}
      - {text: "`liste.sort(null)`", correct: false}
      - {text: "`liste.sort(String::equalsIgnoreCase)`", correct: false}
      - {text: "`liste.sort(Comparator.naturalOrder())`", correct: false}
    answer: "`CASE_INSENSITIVE_ORDER`, comme `String::compareToIgnoreCase`, ignore la casse. `null` et `naturalOrder` suivent l'ordre naturel, qui en tient compte ; `equalsIgnoreCase` renvoie un `boolean`, pas un ordre."
  - key: qcm-compare
    format: multiple-choice
    question: "Que vaut `\"pomme\".compareTo(\"poire\") < 0` ?"
    choices:
      - text: "`false` : \"poire\" vient avant \"pomme\""
        correct: true
      - text: "`true` : \"pomme\" vient avant \"poire\""
        correct: false
      - text: "`false` : les deux chaînes sont égales"
        correct: false
      - text: "Une exception, les longueurs diffèrent"
        correct: false
    answer: Les deux premiers caractères sont égaux ; au troisième, `i` (105) vient avant `m` (109).
  - key: qcm-langue
    format: multiple-choice
    question: Quel outil trie des noms français avec leurs accents dans l'ordre du dictionnaire ?
    choices:
      - text: "`Collator.getInstance(Locale.FRENCH)`"
        correct: true
      - text: "`String::compareTo`"
        correct: false
      - text: "`String.CASE_INSENSITIVE_ORDER`"
        correct: false
      - text: "`Comparator.naturalOrder()`"
        correct: false
    answer: Les trois autres comparent les codes des caractères.
  - key: trous-equals
    format: fill-in
    question: |-
      Complète pour accepter « oui », « OUI » ou « Oui » :
      ```java
      if ("oui".___(saisie)) { confirmer(); }
      ```
    blanks: [[equalsIgnoreCase]]
    answer: '`equalsIgnoreCase` ignore la casse.'
  - key: trous-compare-to
    format: fill-in
    question: |-
      Complète pour savoir si `a` vient avant `b` dans l'ordre naturel :
      ```java
      boolean avant = a.___(b) < 0;
      ```
    blanks: [[compareTo]]
    answer: Un résultat négatif signifie « avant ».
  - key: trous-case-insensitive
    format: fill-in
    question: |-
      Complète pour trier sans tenir compte de la casse :
      ```java
      noms.sort(String.___);
      ```
    blanks: [[CASE_INSENSITIVE_ORDER]]
    answer: Un `Comparator<String>` fourni par la classe `String`.
  - key: trous-null-safe
    format: fill-in
    question: |-
      Complète pour comparer deux chaînes qui peuvent valoir `null` :
      ```java
      boolean memes = Objects.___(ancien, nouveau);
      ```
    blanks: [[equals]]
    answer: '`Objects.equals` gère `null` des deux côtés.'
  - key: code-casse
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("Java".equals("java") + " " + "Java".equalsIgnoreCase("java"));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: '`false true`.'
    check:
      output: "false true"
  - key: code-ordre
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(("a".compareTo("b") < 0) + " " + ("Z".compareTo("a") < 0) + " " + ("10".compareTo("9") < 0));
      ```
    choices:
      - {text: "`true true true`", correct: true}
      - {text: "`true false false`", correct: false}
      - {text: "`true true false`", correct: false}
      - {text: "`true false true`", correct: false}
    answer: '`true true true` : l''ordre suit les codes des caractères.'
    check:
      output: "true true true"
  - key: code-tri-accents
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> mots = new ArrayList<>(List.of("éclair", "eau", "zèbre"));
      Collections.sort(mots);
      System.out.println(mots);
      ```
    choices:
      - {text: "`[eau, zèbre, éclair]`", correct: true}
      - {text: "`[eau, éclair, zèbre]`", correct: false}
      - {text: "`[éclair, eau, zèbre]`", correct: false}
      - {text: "`[zèbre, eau, éclair]`", correct: false}
    answer: '`[eau, zèbre, éclair]` : `é` a un code plus grand que `z`.'
    check:
      output: "[eau, zèbre, éclair]"
  - key: code-collator
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.text.Collator;
      List<String> mots = new ArrayList<>(List.of("éclair", "eau", "zèbre"));
      mots.sort(Collator.getInstance(Locale.FRENCH));
      System.out.println(mots);
      ```
    choices:
      - {text: "`[eau, éclair, zèbre]`", correct: true}
      - {text: "`[eau, zèbre, éclair]`", correct: false}
      - {text: "`[éclair, eau, zèbre]`", correct: false}
      - {text: "`[éclair, zèbre, eau]`", correct: false}
    answer: '`[eau, éclair, zèbre]` : le `Collator` suit l''ordre de la langue.'
    check:
      code: |-
        import java.text.Collator;
        List<String> mots = new ArrayList<>(List.of("éclair", "eau", "zèbre"));
        mots.sort(Collator.getInstance(Locale.FRENCH));
        System.out.println(mots);
      output: "[eau, éclair, zèbre]"
  - key: bug-double-egal
    format: bug-fix
    question: |-
      Ce filtre ne garde jamais rien :
      ```java
      produits.stream().filter(p -> p.categorie() == categorieChoisie)
      ```
      `categorieChoisie` vient d'un paramètre de requête. Quelle correction est la bonne ?
    choices:
      - {text: "`filter(p -> p.categorie().equals(categorieChoisie))`", correct: true}
      - {text: "`filter(p -> p.categorie() == categorieChoisie.toString())`", correct: false}
      - {text: "`filter(p -> p.categorie().compareTo(categorieChoisie) > 0)`", correct: false}
      - {text: "`filter(p -> p.categorie().contains(categorieChoisie))`", correct: false}
    answer: |-
      ```java
      produits.stream().filter(p -> p.categorie().equals(categorieChoisie))
      ```
      `==` compare les références : la chaîne de la requête est un autre objet que celle du produit.
  - key: bug-npe
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` quand le champ n'est pas rempli :
      ```java
      if (formulaire.pays().equals("FR")) { ... }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if (\"FR\".equals(formulaire.pays()))`", correct: true}
      - {text: "`if (formulaire.pays() == \"FR\")`", correct: false}
      - {text: "`if (formulaire.pays().equalsIgnoreCase(\"FR\"))`", correct: false}
      - {text: "`if (formulaire.pays().compareTo(\"FR\") == 0)`", correct: false}
    answer: |-
      ```java
      if ("FR".equals(formulaire.pays())) { ... }
      ```
      Appelée sur la constante, `equals` renvoie simplement `false` pour `null`.
  - key: bug-tri-noms
    format: bug-fix
    question: |-
      Dans l'annuaire, « Émile » et « élodie » apparaissent après « Zoé » :
      ```java
      noms.sort(Comparator.naturalOrder());
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`noms.sort(Collator.getInstance(Locale.FRENCH));`", correct: true}
      - {text: "`noms.sort(String.CASE_INSENSITIVE_ORDER);`", correct: false}
      - {text: "`noms.sort(Comparator.reverseOrder());`", correct: false}
      - {text: "`noms.sort(Comparator.comparing(String::length));`", correct: false}
    answer: "L'ordre naturel compare les codes des caractères : les accents et les minuscules passent après `Z`. Ignorer la casse ne règle pas les accents (`É` vaut 201) ; un `Collator` trie selon les règles du français."
  - key: bug-tri-fichiers
    format: bug-fix
    question: |-
      Les fichiers s'affichent dans l'ordre `page1, page10, page2` :
      ```java
      fichiers.sort(Comparator.comparing(Fichier::nom));
      ```
      Chaque nom est `"page"` suivi d'un numéro. Quelle correction est la bonne ?
    choices:
      - {text: "Extraire le numéro de chaque nom, et le comparer comme un entier", correct: true}
      - {text: "Trier avec `String.CASE_INSENSITIVE_ORDER`, sans tenir compte de la casse", correct: false}
      - {text: "Trier avec un `Collator` français, qui range les nombres dans l'ordre", correct: false}
      - {text: "Trier en ordre inverse, avec `Comparator.reverseOrder()`", correct: false}
    answer: |-
      ```java
      fichiers.sort(Comparator.comparingInt(f -> Integer.parseInt(f.nom().substring("page".length()))));
      ```
      Les chaînes se comparent caractère par caractère : `"10"` vient avant `"2"`. On extrait le numéro et on le compare
      comme un nombre.
