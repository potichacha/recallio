notion: localdate-localtime
lesson: |-
  `LocalDate` (une date), `LocalTime` (une heure) et `LocalDateTime` (les deux) décrivent ce qu'on lit sur un
  calendrier ou une horloge murale, **sans fuseau**.

  ```java
  LocalDate d = LocalDate.of(2025, 3, 14);        // ou LocalDate.of(2025, Month.MARCH, 14)
  LocalDate.parse("2025-03-14");                  // format ISO
  d.plusDays(10).minusMonths(1);                  // nouvelles dates : d ne change pas
  d.withDayOfMonth(1);                            // le 1er du mois
  d.getDayOfWeek();                               // FRIDAY
  d.lengthOfMonth();                              // 31
  d.isBefore(LocalDate.of(2025, 4, 1));           // true
  ChronoUnit.DAYS.between(d, LocalDate.of(2025, 12, 25));   // nombre de jours

  LocalTime t = LocalTime.of(23, 30).plusHours(2);          // 01:30 : l'heure fait le tour
  LocalDateTime rdv = LocalDateTime.of(d, LocalTime.of(9, 0));
  ```

  - Les mois vont de **1 à 12**, les jours de la semaine sont une enum (`DayOfWeek.MONDAY`).
  - Une date impossible (`LocalDate.of(2025, 2, 30)`) lève une `DateTimeException`.
  - Ajouter un mois **ajuste** au dernier jour valide : le 31 janvier + 1 mois donne le 28 (ou 29) février.
  - Les objets sont immuables : `plusDays` renvoie une nouvelle date.
  - `TemporalAdjusters` calcule des dates relatives : `lastDayOfMonth()`, `next(DayOfWeek.MONDAY)`.

  **Piège classique** : appeler `date.plusDays(1);` sans récupérer le résultat. La date ne change pas.

  **En entretien** : « `LocalDate` pour une date de calendrier, mois de 1 à 12, immuable ; `plusMonths` ajuste les fins
  de mois. »
tour:
  - title: LocalDate et LocalTime
    text: |-
      `LocalDate.of(2026, 11, 5)` crée une date, `LocalTime.of(9, 30)` une heure, et `LocalDateTime` les deux. Les mois
      vont de 1 à 12. `plusDays`, `minusWeeks` et `withDayOfMonth` renvoient une nouvelle date ; `isBefore`, `isAfter`
      et `isLeapYear` répondent aux questions courantes.

      `LocalDate.now()` donne la date du jour : ce Tour l'évite, car sa sortie doit rester la même d'un jour à l'autre.
    example:
      files:
        Main.java: |-
          void main() {
              LocalDate date = LocalDate.of(2026, 11, 5);
              IO.println(date.plusDays(30) + " " + date.getDayOfYear() + " " + date.isLeapYear());
              LocalTime heure = LocalTime.of(9, 30);
              IO.println(heure.plusMinutes(45) + " " + heure.isBefore(LocalTime.NOON));
              LocalDateTime rendezVous = LocalDateTime.of(date, heure);
              IO.println(rendezVous + " " + rendezVous.getMonth());
              IO.println(date.withDayOfMonth(1).getDayOfWeek());
          }
      output: |-
        2026-12-05 309 false
        10:15 true
        2026-11-05T09:30 NOVEMBER
        SUNDAY
    task:
      instructions: |-
        Calcule la date qui tombe 100 jours après le 5 novembre 2026 : le programme doit afficher `2027-02-13`.
      starter:
        Main.java: |-
          void main() {
              LocalDate date = LocalDate.of(2026, 11, 5);
              IO.println(date);
          }
      solution:
        Main.java: |-
          void main() {
              LocalDate date = LocalDate.of(2026, 11, 5);
              IO.println(date.plusDays(100));
          }
      output: |-
        2027-02-13
cards:
  - key: definition
    format: course
    question: Que représente un `LocalDate` ?
    choices:
      - {text: "Une date de calendrier, sans heure ni fuseau, comme une date de naissance", correct: true}
      - {text: "Une date et une heure, dans le fuseau par défaut de la machine", correct: false}
      - {text: "Un instant précis, en millisecondes depuis le 1er janvier 1970", correct: false}
      - {text: "Une date dans le fuseau UTC, avec l'heure fixée à minuit", correct: false}
    answer: Une date de calendrier (année, mois, jour), sans heure ni fuseau, comme une date de naissance ou un jour férié.
  - key: ajustement-fin-mois
    format: course
    question: Que donne `LocalDate.of(2025, 1, 31).plusMonths(1)` ?
    choices:
      - {text: "Le 28 février 2025 : le jour est ramené au dernier jour valide du mois", correct: true}
      - {text: "Le 3 mars 2025 : les jours en trop débordent sur le mois suivant", correct: false}
      - {text: "Une `DateTimeException` : le 31 février n'existe pas", correct: false}
      - {text: "Le 31 mars 2025 : le prochain mois qui a un 31", correct: false}
    answer: "Le 28 février 2025 : le jour est ajusté au dernier jour valide du mois."
  - key: date-invalide
    format: course
    question: Que se passe-t-il avec `LocalDate.of(2025, 2, 30)` ?
    choices:
      - {text: "Une `DateTimeException` : le 30 février n'existe pas", correct: true}
      - {text: "Le 2 mars 2025 : les jours en trop débordent sur mars", correct: false}
      - {text: "Le 28 février 2025 : le jour est ramené au dernier valide", correct: false}
      - {text: "`null`, puisque la date n'est pas valide", correct: false}
    answer: "Une `DateTimeException` : le 30 février n'existe pas. `java.time` refuse une date invalide, alors que `plusMonths` ajuste, lui, au dernier jour valide."
  - key: jours-entre
    format: course
    question: Comment compter le nombre de jours entre deux `LocalDate` ?
    choices:
      - {text: "`ChronoUnit.DAYS.between(debut, fin)`", correct: true}
      - {text: "`Period.between(debut, fin).getDays()`", correct: false}
      - {text: "`Duration.between(debut, fin).toDays()`", correct: false}
      - {text: "`fin.getDayOfYear() - debut.getDayOfYear()`", correct: false}
    answer: "Avec `ChronoUnit.DAYS.between(debut, fin)` (ou `debut.until(fin, ChronoUnit.DAYS)`). `getDays` d'une période ignore ses mois, et `Duration` refuse des `LocalDate`."
  - key: vf-mois-un
    format: true-false
    question: "Avec `LocalDate`, le mois de mars vaut 3."
    truth: true
    answer: Les mois vont de 1 à 12, ou s'écrivent avec l'enum `Month`.
  - key: vf-plus-modifie
    format: true-false
    question: "`date.plusDays(1)` modifie `date`."
    truth: false
    answer: '`LocalDate` est immuable : la méthode renvoie une nouvelle date.'
  - key: vf-heure-tour
    format: true-false
    question: "`LocalTime.of(23, 0).plusHours(2)` lève une exception."
    truth: false
    answer: "Une `LocalTime` fait le tour du cadran : on obtient `01:00`."
  - key: vf-parse-iso
    format: true-false
    question: "`LocalDate.parse(\"14/03/2025\")` fonctionne."
    truth: false
    answer: '`parse` attend le format ISO `2025-03-14` ; pour un autre format, il faut un `DateTimeFormatter`.'
  - key: qcm-creer
    format: multiple-choice
    question: "Laquelle de ces écritures crée le 14 mars 2025 ?"
    choices:
      - {text: "`LocalDate.of(2025, 3, 14)`", correct: true}
      - {text: "`LocalDate.of(2025, 2, 14)`", correct: false}
      - {text: "`new LocalDate(2025, 3, 14)`", correct: false}
      - {text: "`LocalDate.parse(\"14/03/2025\")`", correct: false}
    answer: "Les mois commencent à 1 (ou `Month.MARCH`), `LocalDate` n'a pas de constructeur public, et `parse` sans formateur attend l'ISO `2025-03-14`."
  - key: qcm-fin-mois
    format: multiple-choice
    question: "Laquelle de ces expressions donne le dernier jour du mois d'une date `d` ?"
    choices:
      - {text: "`d.with(TemporalAdjusters.lastDayOfMonth())`", correct: true}
      - {text: "`d.withDayOfMonth(31)`", correct: false}
      - {text: "`d.withDayOfMonth(30)`", correct: false}
      - {text: "`d.plusMonths(1).minusDays(1)`", correct: false}
    answer: "L'ajusteur (comme `withDayOfMonth(d.lengthOfMonth())`) s'adapte à chaque mois. Un jour fixe échoue ou se trompe selon le mois, et `plusMonths(1).minusDays(1)` ne tombe sur la fin du mois que si `d` est le 1er."
  - key: qcm-comparer
    format: multiple-choice
    question: "Lequel de ces tests dit qu'une date d'échéance est passée par rapport à aujourd'hui ?"
    choices:
      - {text: "`echeance.isBefore(aujourdhui)`", correct: true}
      - {text: "`echeance.isAfter(aujourdhui)`", correct: false}
      - {text: "`echeance < aujourdhui`", correct: false}
      - {text: "`echeance.getDayOfMonth() < aujourdhui.getDayOfMonth()`", correct: false}
    answer: "`isBefore` (comme `compareTo(...) < 0`) compare les dates entières. Les opérateurs ne s'appliquent pas aux objets, et le seul jour du mois ignore le mois et l'année."
  - key: qcm-jour-semaine
    format: multiple-choice
    question: Comment savoir si une date tombe un week-end ?
    choices:
      - {text: "`d.getDayOfWeek() == DayOfWeek.SATURDAY || d.getDayOfWeek() == DayOfWeek.SUNDAY`", correct: true}
      - {text: "`d.getDayOfWeek().getValue() == 0 || d.getDayOfWeek().getValue() == 7`", correct: false}
      - {text: "`d.getDayOfMonth() % 7 == 0 || d.getDayOfMonth() % 7 == 6`", correct: false}
      - {text: "`d.getDayOfWeek() > DayOfWeek.FRIDAY`, une comparaison d'enums", correct: false}
    answer: "`DayOfWeek` est une enum, qu'on compare avec `==` (ou `getValue() >= 6`, lundi valant 1 et dimanche 7). `>` ne s'applique pas aux enums, et le jour du mois ne dit rien du jour de la semaine."
  - key: code-fin-fevrier
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      LocalDate d = LocalDate.of(2024, 1, 31);
      System.out.println(d.plusMonths(1) + " " + d.plusMonths(1).isLeapYear());
      ```
    choices:
      - {text: "`2024-02-29 true`", correct: true}
      - {text: "`2024-03-02 true`", correct: false}
      - {text: "`2024-02-28 true`", correct: false}
      - {text: "`2024-02-29 false`", correct: false}
    answer: '`2024-02-29 true` : le 31 est ajusté au dernier jour de février, en année bissextile.'
    check:
      output: "2024-02-29 true"
  - key: code-date-invalide
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      System.out.println(LocalDate.of(2025, 2, 30));
      ```
    choices:
      - {text: "Une `DateTimeException`", correct: true}
      - {text: "`2025-03-02`", correct: false}
      - {text: "`2025-02-28`", correct: false}
      - {text: "`null`", correct: false}
    answer: "Une `DateTimeException` : le 30 février n'existe pas."
    check:
      throws: DateTimeException
  - key: code-jour-semaine
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      System.out.println(LocalDate.of(2025, 3, 14).getDayOfWeek() + " " + LocalDate.of(2025, 2, 1).lengthOfMonth()
              + " " + LocalTime.of(23, 30).plusHours(2));
      ```
    choices:
      - {text: "`FRIDAY 28 01:30`", correct: true}
      - {text: "`FRIDAY 28 25:30`", correct: false}
      - {text: "`THURSDAY 28 01:30`", correct: false}
      - {text: "`FRIDAY 29 01:30`", correct: false}
    answer: "`FRIDAY 28 01:30` : le 14 mars 2025 est un vendredi, février 2025 a 28 jours, et `LocalTime` repart à zéro après minuit."
    check:
      output: "FRIDAY 28 01:30"
  - key: code-jours-entre
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      import java.time.temporal.ChronoUnit;
      System.out.println(ChronoUnit.DAYS.between(LocalDate.of(2025, 1, 1), LocalDate.of(2025, 3, 1)));
      ```
    choices:
      - {text: "`59`", correct: true}
      - {text: "`60`", correct: false}
      - {text: "`58`", correct: false}
      - {text: "`2`", correct: false}
    answer: '`59` : 31 jours de janvier et 28 de février.'
    check:
      output: "59"
  - key: bug-resultat-ignore
    format: bug-fix
    question: |-
      La date de livraison n'est jamais repoussée :
      ```java
      LocalDate livraison = commande.date();
      livraison.plusDays(3);
      return livraison;
      ```
      Pourquoi ?
    choices:
      - {text: "`LocalDate` est immuable : `plusDays` renvoie une nouvelle date, ignorée ici", correct: true}
      - {text: "`plusDays` ne compte que les jours ouvrés, et tombe ici sur un week-end", correct: false}
      - {text: "`commande.date()` renvoie une copie, que `plusDays` modifie en vain", correct: false}
      - {text: "`plusDays` attend un `long`, et l'`int` 3 est converti en 0", correct: false}
    answer: "`LocalDate` est immuable : `plusDays` renvoie une nouvelle date, ignorée ici. La correction : `return commande.date().plusDays(3);`."
  - key: bug-mois-zero
    format: bug-fix
    question: |-
      Ce code, porté depuis `Calendar`, lève une `DateTimeException` :
      ```java
      LocalDate nouvelAn = LocalDate.of(annee, 0, 1);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`LocalDate.of(annee, Month.JANUARY, 1)`", correct: true}
      - {text: "`LocalDate.of(annee, 0, 1).plusMonths(1)`", correct: false}
      - {text: "`LocalDate.of(annee - 1, 12, 1)`", correct: false}
      - {text: "`LocalDate.ofYearDay(annee, 0)`", correct: false}
    answer: |-
      ```java
      LocalDate nouvelAn = LocalDate.of(annee, Month.JANUARY, 1);
      ```
      Avec `java.time`, les mois vont de 1 à 12 ; l'enum `Month` évite toute ambiguïté.
  - key: bug-fin-mois
    format: bug-fix
    question: |-
      Le calcul de la date de facturation (fin du mois) échoue en avril :
      ```java
      LocalDate facturation = aujourdhui.withDayOfMonth(31);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`aujourdhui.with(TemporalAdjusters.lastDayOfMonth())`", correct: true}
      - {text: "`aujourdhui.withDayOfMonth(30)`", correct: false}
      - {text: "`aujourdhui.plusMonths(1).withDayOfMonth(1)`", correct: false}
      - {text: "`aujourdhui.withDayOfMonth(31).minusDays(1)`", correct: false}
    answer: |-
      ```java
      LocalDate facturation = aujourdhui.with(TemporalAdjusters.lastDayOfMonth());
      ```
      Avril n'a que 30 jours : `withDayOfMonth(31)` lève une `DateTimeException`. L'ajusteur trouve le dernier jour de
      chaque mois.
  - key: bug-comparaison-champs
    format: bug-fix
    question: |-
      Cette comparaison de dates est fausse d'une année sur l'autre :
      ```java
      boolean avant = a.getMonthValue() < b.getMonthValue()
              || a.getDayOfMonth() < b.getDayOfMonth();
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`boolean avant = a.isBefore(b);`", correct: true}
      - {text: "`boolean avant = a.getDayOfYear() < b.getDayOfYear();`", correct: false}
      - {text: "`boolean avant = a.getYear() < b.getYear();`", correct: false}
      - {text: "`boolean avant = a.getMonthValue() <= b.getMonthValue() && a.getDayOfMonth() < b.getDayOfMonth();`", correct: false}
    answer: |-
      ```java
      boolean avant = a.isBefore(b);
      ```
      Comparer les champs à la main oublie l'année et mélange les conditions. `isBefore` compare les dates entières.
