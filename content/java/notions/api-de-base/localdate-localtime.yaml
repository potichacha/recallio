notion: localdate-localtime
lesson: |-
  `LocalDate` (une date), `LocalTime` (une heure) et `LocalDateTime` (les deux) décrivent ce qu'on lit sur un
  calendrier ou une horloge murale, **sans fuseau**.

  ```java
  LocalDate d = LocalDate.of(2025, 3, 14);        // ou LocalDate.of(2025, Month.MARCH, 14)
  LocalDate.parse("2025-03-14");                  // format ISO
  d.plusDays(10).minusMonths(1);                  // nouvelles dates : d ne change pas
  d.withDayOfMonth(1);                            // le 1er du mois
  d.getDayOfWeek();                               // FRIDAY
  d.lengthOfMonth();                              // 31
  d.isBefore(LocalDate.of(2025, 4, 1));           // true
  ChronoUnit.DAYS.between(d, LocalDate.of(2025, 12, 25));   // nombre de jours

  LocalTime t = LocalTime.of(23, 30).plusHours(2);          // 01:30 : l'heure fait le tour
  LocalDateTime rdv = LocalDateTime.of(d, LocalTime.of(9, 0));
  ```

  - Les mois vont de **1 à 12**, les jours de la semaine sont une enum (`DayOfWeek.MONDAY`).
  - Une date impossible (`LocalDate.of(2025, 2, 30)`) lève une `DateTimeException`.
  - Ajouter un mois **ajuste** au dernier jour valide : le 31 janvier + 1 mois donne le 28 (ou 29) février.
  - Les objets sont immuables : `plusDays` renvoie une nouvelle date.
  - `TemporalAdjusters` calcule des dates relatives : `lastDayOfMonth()`, `next(DayOfWeek.MONDAY)`.

  **Piège classique** : appeler `date.plusDays(1);` sans récupérer le résultat. La date ne change pas.

  **En entretien** : « `LocalDate` pour une date de calendrier, mois de 1 à 12, immuable ; `plusMonths` ajuste les fins
  de mois. »
tour:
  - title: LocalDate et LocalTime
    text: |-
      `LocalDate.of(2026, 11, 5)` crée une date, `LocalTime.of(9, 30)` une heure, et `LocalDateTime` les deux. Les mois
      vont de 1 à 12. `plusDays`, `minusWeeks` et `withDayOfMonth` renvoient une nouvelle date ; `isBefore`, `isAfter`
      et `isLeapYear` répondent aux questions courantes.

      `LocalDate.now()` donne la date du jour : ce Tour l'évite, car sa sortie doit rester la même d'un jour à l'autre.
    example:
      files:
        Main.java: |-
          void main() {
              LocalDate date = LocalDate.of(2026, 11, 5);
              IO.println(date.plusDays(30) + " " + date.getDayOfYear() + " " + date.isLeapYear());
              LocalTime heure = LocalTime.of(9, 30);
              IO.println(heure.plusMinutes(45) + " " + heure.isBefore(LocalTime.NOON));
              LocalDateTime rendezVous = LocalDateTime.of(date, heure);
              IO.println(rendezVous + " " + rendezVous.getMonth());
              IO.println(date.withDayOfMonth(1).getDayOfWeek());
          }
      output: |-
        2026-12-05 309 false
        10:15 true
        2026-11-05T09:30 NOVEMBER
        SUNDAY
    task:
      instructions: |-
        Calcule la date qui tombe 100 jours après le 5 novembre 2026 : le programme doit afficher `2027-02-13`.
      starter:
        Main.java: |-
          void main() {
              LocalDate date = LocalDate.of(2026, 11, 5);
              IO.println(date);
          }
      solution:
        Main.java: |-
          void main() {
              LocalDate date = LocalDate.of(2026, 11, 5);
              IO.println(date.plusDays(100));
          }
      output: |-
        2027-02-13
cards:
  - key: definition
    format: course
    question: Que représente un `LocalDate` ?
    answer: Une date de calendrier (année, mois, jour), sans heure ni fuseau, comme une date de naissance ou un jour férié.
  - key: ajustement-fin-mois
    format: course
    question: Que donne `LocalDate.of(2025, 1, 31).plusMonths(1)` ?
    answer: "Le 28 février 2025 : le jour est ajusté au dernier jour valide du mois."
  - key: date-invalide
    format: course
    question: Que se passe-t-il avec `LocalDate.of(2025, 2, 30)` ?
    answer: "Une `DateTimeException` : le 30 février n'existe pas."
  - key: jours-entre
    format: course
    question: Comment compter le nombre de jours entre deux `LocalDate` ?
    answer: Avec `ChronoUnit.DAYS.between(debut, fin)` (ou `debut.until(fin, ChronoUnit.DAYS)`).
  - key: vf-mois-un
    format: true-false
    question: "Avec `LocalDate`, le mois de mars vaut 3."
    truth: true
    answer: Les mois vont de 1 à 12, ou s'écrivent avec l'enum `Month`.
  - key: vf-plus-modifie
    format: true-false
    question: "`date.plusDays(1)` modifie `date`."
    truth: false
    answer: '`LocalDate` est immuable : la méthode renvoie une nouvelle date.'
  - key: vf-heure-tour
    format: true-false
    question: "`LocalTime.of(23, 0).plusHours(2)` lève une exception."
    truth: false
    answer: "Une `LocalTime` fait le tour du cadran : on obtient `01:00`."
  - key: vf-parse-iso
    format: true-false
    question: "`LocalDate.parse(\"14/03/2025\")` fonctionne."
    truth: false
    answer: '`parse` attend le format ISO `2025-03-14` ; pour un autre format, il faut un `DateTimeFormatter`.'
  - key: qcm-creer
    format: multiple-choice
    question: Quelles écritures créent le 14 mars 2025 ?
    choices:
      - text: "`LocalDate.of(2025, 3, 14)`"
        correct: true
      - text: "`LocalDate.of(2025, Month.MARCH, 14)`"
        correct: true
      - text: "`LocalDate.of(2025, 2, 14)`"
        correct: false
      - text: "`new LocalDate(2025, 3, 14)`"
        correct: false
    answer: Les mois commencent à 1, et `LocalDate` n'a pas de constructeur public.
  - key: qcm-fin-mois
    format: multiple-choice
    question: Comment obtenir le dernier jour du mois d'une date `d` ?
    choices:
      - text: "`d.with(TemporalAdjusters.lastDayOfMonth())`"
        correct: true
      - text: "`d.withDayOfMonth(d.lengthOfMonth())`"
        correct: true
      - text: "`d.withDayOfMonth(31)`"
        correct: false
      - text: "`d.plusMonths(1).minusDays(1)`"
        correct: false
    answer: '`withDayOfMonth(31)` échoue pour un mois de 30 jours ; la dernière ne donne pas la fin du mois si `d` n''est pas le 1er.'
  - key: qcm-comparer
    format: multiple-choice
    question: Comment tester qu'une date d'échéance est passée par rapport à aujourd'hui ?
    choices:
      - text: "`echeance.isBefore(aujourdhui)`"
        correct: true
      - text: "`echeance.compareTo(aujourdhui) < 0`"
        correct: true
      - text: "`echeance < aujourdhui`"
        correct: false
      - text: "`echeance.getDayOfMonth() < aujourdhui.getDayOfMonth()`"
        correct: false
    answer: Les opérateurs ne s'appliquent pas aux objets, et comparer le seul jour du mois n'a pas de sens.
  - key: qcm-jour-semaine
    format: multiple-choice
    question: Comment savoir si une date tombe un week-end ?
    choices:
      - text: "`d.getDayOfWeek() == DayOfWeek.SATURDAY || d.getDayOfWeek() == DayOfWeek.SUNDAY`"
        correct: true
      - text: "`d.getDayOfMonth() % 7 == 0`"
        correct: false
      - text: "`d.isWeekend()`"
        correct: false
      - text: "`d.getDayOfWeek() > 5`"
        correct: false
    answer: '`DayOfWeek` est une enum ; on la compare avec `==` (ou `getValue() >= 6`).'
  - key: code-fin-fevrier
    format: code-output
    question: |-
      ```java
      import java.time.*;
      LocalDate d = LocalDate.of(2024, 1, 31);
      System.out.println(d.plusMonths(1) + " " + d.plusMonths(1).isLeapYear());
      ```
    answer: '`2024-02-29 true` : le 31 est ajusté au dernier jour de février, en année bissextile.'
    check:
      output: "2024-02-29 true"
  - key: code-date-invalide
    format: code-output
    question: |-
      ```java
      import java.time.*;
      System.out.println(LocalDate.of(2025, 2, 30));
      ```
    answer: "Une `DateTimeException` : le 30 février n'existe pas."
    check:
      throws: DateTimeException
  - key: code-jour-semaine
    format: code-output
    question: |-
      ```java
      import java.time.*;
      System.out.println(LocalDate.of(2025, 3, 14).getDayOfWeek() + " " + LocalDate.of(2025, 2, 1).lengthOfMonth()
              + " " + LocalTime.of(23, 30).plusHours(2));
      ```
    answer: '`FRIDAY 28 01:30`.'
    check:
      output: "FRIDAY 28 01:30"
  - key: code-jours-entre
    format: code-output
    question: |-
      ```java
      import java.time.*;
      import java.time.temporal.ChronoUnit;
      System.out.println(ChronoUnit.DAYS.between(LocalDate.of(2025, 1, 1), LocalDate.of(2025, 3, 1)));
      ```
    answer: '`59` : 31 jours de janvier et 28 de février.'
    check:
      output: "59"
  - key: bug-resultat-ignore
    format: bug-fix
    question: |-
      La date de livraison n'est jamais repoussée :
      ```java
      LocalDate livraison = commande.date();
      livraison.plusDays(3);
      return livraison;
      ```
    answer: |-
      ```java
      return commande.date().plusDays(3);
      ```
      `LocalDate` est immuable : `plusDays` renvoie une nouvelle date, ignorée ici.
  - key: bug-mois-zero
    format: bug-fix
    question: |-
      Ce code, porté depuis `Calendar`, lève une `DateTimeException` :
      ```java
      LocalDate nouvelAn = LocalDate.of(annee, 0, 1);
      ```
    answer: |-
      ```java
      LocalDate nouvelAn = LocalDate.of(annee, Month.JANUARY, 1);
      ```
      Avec `java.time`, les mois vont de 1 à 12 ; l'enum `Month` évite toute ambiguïté.
  - key: bug-fin-mois
    format: bug-fix
    question: |-
      Le calcul de la date de facturation (fin du mois) échoue en avril :
      ```java
      LocalDate facturation = aujourdhui.withDayOfMonth(31);
      ```
    answer: |-
      ```java
      LocalDate facturation = aujourdhui.with(TemporalAdjusters.lastDayOfMonth());
      ```
      Avril n'a que 30 jours : `withDayOfMonth(31)` lève une `DateTimeException`. L'ajusteur trouve le dernier jour de
      chaque mois.
  - key: bug-comparaison-champs
    format: bug-fix
    question: |-
      Cette comparaison de dates est fausse d'une année sur l'autre :
      ```java
      boolean avant = a.getMonthValue() < b.getMonthValue()
              || a.getDayOfMonth() < b.getDayOfMonth();
      ```
    answer: |-
      ```java
      boolean avant = a.isBefore(b);
      ```
      Comparer les champs à la main oublie l'année et mélange les conditions. `isBefore` compare les dates entières.
