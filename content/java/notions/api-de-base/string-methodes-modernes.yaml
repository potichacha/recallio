notion: string-methodes-modernes
lesson: |-
  Les versions récentes de Java ont ajouté à `String` des méthodes qui remplacent bien des utilitaires maison :

  | Méthode | Version | Rôle |
  |---|---|---|
  | `isBlank()` | 11 | vide ou seulement des blancs (`" \t"`) |
  | `strip()`, `stripLeading()`, `stripTrailing()` | 11 | retire les blancs **Unicode** |
  | `lines()` | 11 | un `Stream<String>` des lignes, quel que soit le séparateur (`\n`, `\r\n`, `\r`) |
  | `repeat(n)` | 11 | répète la chaîne `n` fois |
  | `indent(n)`, `transform(f)` | 12 | indenter ; appliquer une fonction |
  | `formatted(args...)` | 15 | `String.format` sous forme de méthode |
  | `stripIndent()`, `translateEscapes()` | 15 | outils des blocs de texte |

  ```java
  "  ".isEmpty();          // false : la longueur vaut 2
  "  ".isBlank();          // true
  "-".repeat(20);          // une ligne de séparation
  texte.lines().filter(l -> !l.isBlank()).count();
  "Bonjour %s".formatted(nom);
  ```

  - `trim()` retire les caractères de code ≤ U+0020 ; `strip()` retire tout ce que `Character.isWhitespace` considère
    comme un blanc, y compris des espaces Unicode comme U+2003. Dans du code récent, on préfère `strip()`.
  - `lines()` évite les `split("\n")` qui laissent des `\r` en fin de ligne avec un texte Windows.

  **Piège classique** : tester `s.trim().isEmpty()` (deux opérations et une chaîne intermédiaire) au lieu de
  `s.isBlank()`.

  **En entretien** : « Depuis Java 11 : `isBlank`, `strip`, `lines`, `repeat` ; et `formatted` depuis Java 15. »
cards:
  - key: trim-vs-strip
    format: course
    question: "Quelle différence entre `trim()` et `strip()` ?"
    choices:
      - {text: "`trim` retire les caractères ≤ U+0020 ; `strip`, tous les blancs Unicode (Java 11)", correct: true}
      - {text: "`trim` retire tous les blancs Unicode ; `strip`, les caractères ≤ U+0020", correct: false}
      - {text: "`trim` ne retire les blancs qu'au début ; `strip`, aux deux bouts", correct: false}
      - {text: "Aucune : `strip` est le nouveau nom de `trim`, depuis Java 11", correct: false}
    answer: "`trim` retire les caractères ≤ U+0020 ; `strip` (Java 11) retire les blancs Unicode, comme l'espace cadratin. Pour un seul bout : `stripLeading`, `stripTrailing`."
  - key: isempty-vs-isblank
    format: course
    question: "Quelle différence entre `isEmpty()` et `isBlank()` ?"
    choices:
      - {text: "`isEmpty` : longueur 0 ; `isBlank` : vide ou seulement des blancs", correct: true}
      - {text: "`isEmpty` : vide ou seulement des blancs ; `isBlank` : longueur 0", correct: false}
      - {text: "`isEmpty` accepte `null` ; `isBlank` lève une exception sur `null`", correct: false}
      - {text: "Aucune : `isBlank` est le nouveau nom d'`isEmpty` (Java 11)", correct: false}
    answer: "`isEmpty` : longueur 0 ; `isBlank` (Java 11) : vide ou uniquement des blancs. Aucune des deux n'accepte `null`."
  - key: lines
    format: course
    question: Pourquoi préférer `texte.lines()` à `texte.split("\n")` ?
    choices:
      - {text: "`lines()` reconnaît `\\n`, `\\r\\n` et `\\r`, et renvoie un `Stream` paresseux", correct: true}
      - {text: "`lines()` supprime les lignes vides, alors que `split` les garde toutes", correct: false}
      - {text: "`lines()` renvoie les lignes triées, ce qui facilite leur recherche", correct: false}
      - {text: "`lines()` coupe aussi sur les points, pour séparer les phrases", correct: false}
    answer: '`lines()` reconnaît `\n`, `\r\n` et `\r`, et renvoie un `Stream` paresseux ; `split("\n")` laisse des `\r` en fin de ligne sur un texte Windows.'
  - key: formatted
    format: course
    question: "Que fait `\"Total : %d\".formatted(n)` ?"
    choices:
      - {text: "La même chose que `String.format(\"Total : %d\", n)`, en méthode d'instance", correct: true}
      - {text: "Elle affiche le texte formaté sur la console, comme `printf`", correct: false}
      - {text: "Elle vérifie que le gabarit contient un `%d`, sans le remplir", correct: false}
      - {text: "Elle écrit `n` en toutes lettres, selon la locale de l'utilisateur", correct: false}
    answer: "La même chose que `String.format(\"Total : %d\", n)`, sous forme de méthode d'instance (Java 15), pratique après un bloc de texte."
  - key: vf-is-blank-espaces
    format: true-false
    question: "`\" \\t \".isBlank()` vaut `true`."
    truth: true
    answer: La chaîne ne contient que des blancs.
  - key: vf-is-empty-espaces
    format: true-false
    question: "`\"  \".isEmpty()` vaut `true`."
    truth: false
    answer: Sa longueur vaut 2 ; c'est `isBlank()` qui vaut `true`.
  - key: vf-repeat
    format: true-false
    question: "`\"ab\".repeat(0)` renvoie une chaîne vide."
    truth: true
    answer: Zéro répétition donne `""` ; un nombre négatif lèverait une `IllegalArgumentException`.
  - key: vf-strip-modifie
    format: true-false
    question: "`s.strip()` modifie la chaîne `s`."
    truth: false
    answer: Comme toutes les méthodes de `String`, elle renvoie une nouvelle chaîne.
  - key: qcm-vide-ou-blanc
    format: multiple-choice
    question: "Lequel de ces tests dit qu'une saisie est vide ou ne contient que des espaces ?"
    choices:
      - {text: "`saisie.isBlank()`", correct: true}
      - {text: "`saisie.isEmpty()`", correct: false}
      - {text: "`saisie.length() == 0`", correct: false}
      - {text: "`saisie.equals(\" \")`", correct: false}
    answer: "`isBlank()`, comme `strip().isEmpty()`. `isEmpty` et `length() == 0` laissent passer `\"   \"`, et `equals(\" \")` ne reconnaît qu'un seul espace."
  - key: qcm-ligne
    format: multiple-choice
    question: Comment écrire une ligne de 40 tirets ?
    choices:
      - text: "`\"-\".repeat(40)`"
        correct: true
      - text: "`\"-\" * 40`"
        correct: false
      - text: "`String.fill('-', 40)`"
        correct: false
      - text: "`new String(\"-\", 40)`"
        correct: false
    answer: '`repeat` existe depuis Java 11.'
  - key: qcm-compter-lignes
    format: multiple-choice
    question: Comment compter les lignes non vides d'un texte ?
    choices:
      - {text: "`texte.lines().filter(l -> !l.isBlank()).count()`", correct: true}
      - {text: "`texte.split(\"\\n\").length`, une ligne par retour", correct: false}
      - {text: "`texte.lines().size()`, la taille du flux", correct: false}
      - {text: "`texte.length()`, le nombre de caractères", correct: false}
    answer: '`lines()` renvoie un `Stream`, qui n''a pas de `size()`.'
  - key: qcm-versions
    format: multiple-choice
    question: "Laquelle de ces méthodes de `String` est apparue en Java 15, et non en Java 11 ?"
    choices:
      - {text: "`formatted(...)`", correct: true}
      - {text: "`isBlank()`", correct: false}
      - {text: "`strip()`", correct: false}
      - {text: "`repeat(n)`", correct: false}
    answer: "`formatted` date de Java 15 ; `isBlank`, `strip`, `repeat` et `lines` sont arrivées en Java 11."
  - key: code-blank-empty
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("  ".isEmpty() + " " + "  ".isBlank() + " " + "".isBlank());
      ```
    choices:
      - {text: "`false true true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`false true false`", correct: false}
      - {text: "`false false true`", correct: false}
    answer: '`false true true`.'
    check:
      output: "false true true"
  - key: code-trim-strip
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = "\u2003x\u2003";   // U+2003 : espace cadratin
      System.out.println(s.trim().length() + " " + s.strip().length());
      ```
    choices:
      - {text: "`3 1`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "`1 3`", correct: false}
    answer: '`3 1` : `trim` ne retire que les caractères ≤ U+0020, `strip` les blancs Unicode.'
    check:
      output: "3 1"
  - key: code-repeat-lines
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("ab".repeat(3) + " " + "a\nb\r\nc".lines().count());
      ```
    choices:
      - {text: "`ababab 3`", correct: true}
      - {text: "`ababab 2`", correct: false}
      - {text: "`ababab 4`", correct: false}
      - {text: "`ab3 3`", correct: false}
    answer: '`ababab 3` : `lines()` reconnaît aussi `\r\n`.'
    check:
      output: "ababab 3"
  - key: code-formatted
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("Bonjour %s, tu as %d ans".formatted("Ada", 36));
      ```
    choices:
      - {text: "`Bonjour Ada, tu as 36 ans`", correct: true}
      - {text: "`Bonjour %s, tu as %d ans`", correct: false}
      - {text: "`Bonjour Ada, tu as %d ans`", correct: false}
      - {text: "`Bonjour 36, tu as Ada ans`", correct: false}
    answer: '`Bonjour Ada, tu as 36 ans`.'
    check:
      output: "Bonjour Ada, tu as 36 ans"
  - key: bug-trim-is-empty
    format: bug-fix
    question: |-
      Comment simplifier ce test ?
      ```java
      if (commentaire == null || commentaire.trim().isEmpty()) {
          return "(aucun)";
      }
      ```
    choices:
      - {text: "`if (commentaire == null || commentaire.isBlank())`", correct: true}
      - {text: "`if (commentaire.isBlank())`, qui accepte aussi `null`", correct: false}
      - {text: "`if (commentaire == null || commentaire.isEmpty())`", correct: false}
      - {text: "`if (Objects.isNull(commentaire.strip()))`", correct: false}
    answer: |-
      ```java
      if (commentaire == null || commentaire.isBlank()) {
          return "(aucun)";
      }
      ```
      `isBlank()` teste « vide ou seulement des blancs » sans créer de chaîne intermédiaire, et reconnaît les blancs
      Unicode.
  - key: bug-split-crlf
    format: bug-fix
    question: |-
      Sur un fichier venu de Windows, chaque ligne se termine par un caractère invisible et les comparaisons échouent :
      ```java
      for (String ligne : contenu.split("\n")) {
          if (ligne.equals("FIN")) break;
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Parcourir `contenu.lines()`, qui reconnaît toutes les fins de ligne", correct: true}
      - {text: "Comparer avec `equalsIgnoreCase(\"FIN\")`, plus tolérant", correct: false}
      - {text: "Lire le fichier en UTF-16 plutôt qu'en UTF-8", correct: false}
      - {text: "Couper sur les espaces plutôt que sur les retours à la ligne", correct: false}
    answer: |-
      ```java
      for (String ligne : (Iterable<String>) contenu.lines()::iterator) {
          if (ligne.equals("FIN")) break;
      }
      // ou : contenu.lines().takeWhile(l -> !l.equals("FIN")).forEach(...)
      ```
      `split("\n")` laisse le `\r` des fins de ligne `\r\n`. `lines()` reconnaît tous les séparateurs.
  - key: bug-boucle-repeat
    format: bug-fix
    question: |-
      Comment simplifier ce code ?
      ```java
      StringBuilder separateur = new StringBuilder();
      for (int i = 0; i < 40; i++) {
          separateur.append('=');
      }
      ```
    choices:
      - {text: "`String separateur = \"=\".repeat(40);`", correct: true}
      - {text: "`String separateur = \"=\" * 40;`", correct: false}
      - {text: "`String separateur = String.valueOf('=', 40);`", correct: false}
      - {text: "`String separateur = \"=\".concat(40);`", correct: false}
    answer: |-
      ```java
      String separateur = "=".repeat(40);
      ```
      `repeat` (Java 11) remplace la boucle.
  - key: bug-espace-unicode
    format: bug-fix
    question: |-
      Une saisie copiée depuis un document garde des espaces invisibles malgré le nettoyage :
      ```java
      String nom = saisie.trim();
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`String nom = saisie.strip();`", correct: true}
      - {text: "`String nom = saisie.trim().trim();`", correct: false}
      - {text: "`String nom = saisie.stripLeading();`", correct: false}
      - {text: "`String nom = saisie.replace(\" \", \"\");`", correct: false}
    answer: |-
      ```java
      String nom = saisie.strip();
      ```
      `trim` ignore les espaces Unicode (comme l'espace cadratin U+2003), que `strip` retire. (L'espace insécable
      U+00A0 n'est retiré par aucun des deux : il faut alors un `replace` explicite.)
