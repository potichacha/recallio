notion: string-methodes-modernes
cards:
  - key: trim-vs-strip
    format: course
    question: trim() vs strip() ?
    answer: trim retire les caractères ≤ U+0020 ; strip retire les espaces Unicode (Java 11).
  - key: isempty-vs-isblank
    format: course
    question: isEmpty() vs isBlank() ?
    answer: 'isEmpty : longueur 0 ; isBlank : vide ou uniquement des espaces.'
