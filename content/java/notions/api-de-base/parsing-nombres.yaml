notion: parsing-nombres
lesson: |-
  Convertir un **texte en nombre** et inversement :

  ```java
  int n = Integer.parseInt("42");          // int primitif
  Integer m = Integer.valueOf("42");       // Integer (passe par le cache)
  long grand = Long.parseLong("9000000000");
  double d = Double.parseDouble("3.14");   // toujours un point, quelle que soit la locale
  int hexa = Integer.parseInt("ff", 16);   // 255

  String texte = String.valueOf(42);       // nombre → texte (ou Integer.toString(42), ou "" + 42)
  ```

  - Un texte invalide lève une **`NumberFormatException`** (sous-classe de `IllegalArgumentException`) : lettres,
    chaîne vide, `null`, valeur hors de la plage du type (`"2147483648"` pour un `int`).
  - `Integer.parseInt` refuse les **espaces** (`" 42"`) : on fait `strip()` avant. `Double.parseDouble`, lui, les
    tolère autour du nombre, et accepte la notation `1e3`.
  - Le signe `+` est accepté (`"+42"`) ; la virgule décimale française (`"3,14"`) ne l'est pas : pour un texte saisi
    selon la langue de l'utilisateur, on utilise `NumberFormat.getInstance(locale)`.
  - Une saisie utilisateur est **toujours** à valider : on attrape la `NumberFormatException` et on renvoie un message
    clair (une erreur 400 dans une API).

  **Piège classique** : laisser une `NumberFormatException` remonter jusqu'à l'utilisateur, qui obtient une erreur 500
  pour avoir tapé « dix ».

  **En entretien** : « `parseInt` pour un primitif, `valueOf` pour un objet ; `NumberFormatException` sur un texte
  invalide, à traiter dès qu'il s'agit d'une saisie. »
cards:
  - key: parse-vs-value-of
    format: course
    question: Quelle différence entre `Integer.parseInt` et `Integer.valueOf` ?
    answer: '`parseInt` renvoie un `int` primitif ; `valueOf` renvoie un `Integer` (en utilisant le cache pour -128 à 127).'
  - key: exception
    format: course
    question: Que se passe-t-il si le texte n'est pas un nombre valide ?
    answer: Une `NumberFormatException` (non vérifiée, sous-classe de `IllegalArgumentException`), y compris pour une chaîne vide, `null` ou une valeur hors de la plage du type.
  - key: espaces
    format: course
    question: "`Integer.parseInt(\" 42\")` fonctionne-t-il ?"
    answer: "Non, il lève une `NumberFormatException` : il faut d'abord `strip()`. `Double.parseDouble` tolère, lui, les blancs autour du nombre."
  - key: locale
    format: course
    question: Comment lire `"3,14"` saisi par un utilisateur français ?
    answer: Avec `NumberFormat.getInstance(Locale.FRANCE).parse("3,14")` ; `Double.parseDouble` n'accepte que le point.
  - key: vf-plus
    format: true-false
    question: "`Integer.parseInt(\"+42\")` renvoie 42."
    truth: true
    answer: Le signe `+` est accepté.
  - key: vf-depassement
    format: true-false
    question: "`Integer.parseInt(\"2147483648\")` renvoie `Integer.MIN_VALUE`."
    truth: false
    answer: "La valeur dépasse un `int` : `NumberFormatException`. Il faut `Long.parseLong`."
  - key: vf-virgule
    format: true-false
    question: "`Double.parseDouble(\"3,14\")` fonctionne sur une machine en français."
    truth: false
    answer: '`parseDouble` ne dépend pas de la locale et n''accepte que le point.'
  - key: vf-verifiee
    format: true-false
    question: "`NumberFormatException` est une exception vérifiée qu'il faut déclarer."
    truth: false
    answer: Elle étend `IllegalArgumentException`, donc `RuntimeException`.
  - key: qcm-valides
    format: multiple-choice
    question: Lesquels de ces textes `Integer.parseInt` accepte-t-il ?
    choices:
      - text: "\"-17\""
        correct: true
      - text: "\"+5\""
        correct: true
      - text: "\" 5\""
        correct: false
      - text: "\"5.0\""
        correct: false
    answer: Ni espace ni partie décimale.
  - key: qcm-base
    format: multiple-choice
    question: "Comment convertir `\"ff\"` (hexadécimal) en 255 ?"
    choices:
      - text: "`Integer.parseInt(\"ff\", 16)`"
        correct: true
      - text: "`Integer.parseInt(\"0xff\")`"
        correct: false
      - text: "`Integer.parseHex(\"ff\")`"
        correct: false
      - text: "`(int) \"ff\"`"
        correct: false
    answer: Le second argument est la base ; le préfixe `0x` n'est pas accepté par `parseInt`.
  - key: qcm-texte
    format: multiple-choice
    question: Comment convertir l'entier `n` en texte ?
    choices:
      - text: "`String.valueOf(n)`"
        correct: true
      - text: "`Integer.toString(n)`"
        correct: true
      - text: "`(String) n`"
        correct: false
      - text: "`n.toString()`, avec `int n`"
        correct: false
    answer: Un primitif n'a pas de méthode, et un cast ne convertit pas un `int` en `String`.
  - key: qcm-api
    format: multiple-choice
    question: Un paramètre d'API `?page=abc` fait lever une `NumberFormatException`. Quelle réponse renvoyer ?
    choices:
      - text: "Une erreur 400 qui explique que `page` doit être un entier"
        correct: true
      - text: "Une erreur 500"
        correct: false
      - text: "La page 0 sans rien dire"
        correct: false
      - text: "Une liste vide"
        correct: false
    answer: C'est une erreur du client, à signaler clairement.
  - key: trous-parse
    format: fill-in
    question: |-
      Complétez pour obtenir un `int` à partir du texte :
      ```java
      int age = Integer.___(saisie);
      ```
    blanks: [[parseInt]]
    answer: '`parseInt` renvoie un primitif.'
  - key: trous-exception
    format: fill-in
    question: |-
      Complétez pour traiter une saisie invalide :
      ```java
      try {
          quantite = Integer.parseInt(saisie);
      } catch (___ e) {
          afficherErreur("nombre attendu");
      }
      ```
    blanks: [[NumberFormatException]]
    answer: C'est l'exception levée pour un texte qui n'est pas un nombre.
  - key: trous-base
    format: fill-in
    question: |-
      Complétez pour lire un nombre binaire :
      ```java
      int valeur = Integer.parseInt("1010", ___);   // 10
      ```
    blanks: [["2"]]
    answer: Le second argument est la base.
  - key: trous-strip
    format: fill-in
    question: |-
      Complétez pour accepter une saisie entourée d'espaces :
      ```java
      int n = Integer.parseInt(saisie.___());
      ```
    blanks: [[strip, trim]]
    answer: '`parseInt` refuse les blancs.'
  - key: code-parse
    format: code-output
    question: |-
      ```java
      System.out.println(Integer.parseInt("+42") + Integer.parseInt("-2") + " " + Integer.parseInt("ff", 16));
      ```
    answer: '`40 255` : 42 + (-2), puis la conversion hexadécimale.'
    check:
      output: "40 255"
  - key: code-espace
    format: code-output
    question: |-
      ```java
      System.out.println(Integer.parseInt(" 42"));
      ```
    answer: "Une `NumberFormatException` : `parseInt` refuse l'espace."
    check:
      throws: NumberFormatException
  - key: code-double
    format: code-output
    question: |-
      ```java
      System.out.println(Double.parseDouble(" 1e3 ") + " " + Double.parseDouble("3.14"));
      ```
    answer: '`1000.0 3.14` : `parseDouble` tolère les blancs et la notation scientifique.'
    check:
      output: "1000.0 3.14"
  - key: code-depassement
    format: code-output
    question: |-
      ```java
      System.out.println(Integer.parseInt("2147483648"));
      ```
    answer: "Une `NumberFormatException` : la valeur dépasse `Integer.MAX_VALUE`."
    check:
      throws: NumberFormatException
  - key: bug-saisie-espaces
    format: bug-fix
    question: |-
      Les quantités copiées depuis un tableur sont refusées :
      ```java
      int quantite = Integer.parseInt(cellule);   // cellule = "12 "
      ```
    answer: |-
      ```java
      int quantite = Integer.parseInt(cellule.strip());
      ```
      `parseInt` n'accepte aucun blanc autour du nombre.
  - key: bug-erreur-500
    format: bug-fix
    question: |-
      Un utilisateur qui tape « dix » dans le champ âge obtient une erreur 500 :
      ```java
      int age = Integer.parseInt(formulaire.age());
      ```
    answer: |-
      ```java
      int age;
      try {
          age = Integer.parseInt(formulaire.age().strip());
      } catch (NumberFormatException e) {
          throw new SaisieInvalide("l'âge doit être un nombre entier");
      }
      ```
      Une saisie invalide est une erreur du client : on la traduit en une exception métier, renvoyée en 400 avec un
      message clair.
  - key: bug-virgule-francaise
    format: bug-fix
    question: |-
      Les prix saisis comme `"12,50"` font échouer l'enregistrement :
      ```java
      double prix = Double.parseDouble(saisie);
      ```
    answer: |-
      ```java
      double prix = NumberFormat.getInstance(Locale.FRANCE).parse(saisie.strip()).doubleValue();
      ```
      `parseDouble` n'accepte que le point. Pour un texte écrit selon une langue, `NumberFormat` de cette locale sait
      lire la virgule (et l'on préférera `BigDecimal` pour un prix).
  - key: bug-identifiant-long
    format: bug-fix
    question: |-
      Les nouveaux identifiants de commande provoquent des `NumberFormatException` :
      ```java
      int id = Integer.parseInt(parametre);   // parametre = "3000000000"
      ```
    answer: |-
      ```java
      long id = Long.parseLong(parametre);
      ```
      Les identifiants ont dépassé `Integer.MAX_VALUE` (2 147 483 647) : il faut un `long`.
