notion: parsing-nombres
lesson: |-
  Convertir un **texte en nombre** et inversement :

  ```java
  int n = Integer.parseInt("42");          // int primitif
  Integer m = Integer.valueOf("42");       // Integer (passe par le cache)
  long grand = Long.parseLong("9000000000");
  double d = Double.parseDouble("3.14");   // toujours un point, quelle que soit la locale
  int hexa = Integer.parseInt("ff", 16);   // 255

  String texte = String.valueOf(42);       // nombre → texte (ou Integer.toString(42), ou "" + 42)
  ```

  - Un texte invalide lève une **`NumberFormatException`** (sous-classe de `IllegalArgumentException`) : lettres,
    chaîne vide, `null`, valeur hors de la plage du type (`"2147483648"` pour un `int`).
  - `Integer.parseInt` refuse les **espaces** (`" 42"`) : on fait `strip()` avant. `Double.parseDouble`, lui, les
    tolère autour du nombre, et accepte la notation `1e3`.
  - Le signe `+` est accepté (`"+42"`) ; la virgule décimale française (`"3,14"`) ne l'est pas : pour un texte saisi
    selon la langue de l'utilisateur, on utilise `NumberFormat.getInstance(locale)`.
  - Une saisie utilisateur est **toujours** à valider : on attrape la `NumberFormatException` et on renvoie un message
    clair (une erreur 400 dans une API).

  **Piège classique** : laisser une `NumberFormatException` remonter jusqu'à l'utilisateur, qui obtient une erreur 500
  pour avoir tapé « dix ».

  **En entretien** : « `parseInt` pour un primitif, `valueOf` pour un objet ; `NumberFormatException` sur un texte
  invalide, à traiter dès qu'il s'agit d'une saisie. »
tour:
  - title: Du texte aux nombres
    text: |-
      `Integer.parseInt("42")` convertit un texte en `int`, `Double.parseDouble` en `double`, et `Integer.valueOf` en
      `Integer`. Un texte qui n'est pas un nombre lève une `NumberFormatException` : on l'attrape quand le texte vient
      d'un utilisateur ou d'un fichier.

      Dans l'autre sens, `String.valueOf(42)` ou `Integer.toString(42)` donnent la chaîne.
    example:
      files:
        Main.java: |-
          void main() {
              int n = Integer.parseInt("42");
              double d = Double.parseDouble("3.5");
              IO.println((n + 1) + " " + d * 2);
              IO.println(Integer.parseInt("ff", 16) + " " + Integer.toBinaryString(10));

              for (String saisie : List.of("12", "douze", "7")) {
                  try {
                      IO.println("nombre : " + Integer.parseInt(saisie));
                  } catch (NumberFormatException e) {
                      IO.println("pas un nombre : " + saisie);
                  }
              }
              IO.println(String.valueOf(42).length());
          }
      output: |-
        43 7.0
        255 1010
        nombre : 12
        pas un nombre : douze
        nombre : 7
        2
cards:
  - key: parse-vs-value-of
    format: course
    question: Quelle différence entre `Integer.parseInt` et `Integer.valueOf` ?
    choices:
      - {text: "`parseInt` renvoie un `int` ; `valueOf`, un `Integer` (en cache de -128 à 127)", correct: true}
      - {text: "`parseInt` renvoie un `Integer` ; `valueOf`, un `int` primitif", correct: false}
      - {text: "`parseInt` lit une chaîne ; `valueOf` ne prend qu'un `int`", correct: false}
      - {text: "`parseInt` tolère les espaces autour du nombre ; `valueOf` les refuse", correct: false}
    answer: '`parseInt` renvoie un `int` primitif ; `valueOf` renvoie un `Integer` (en utilisant le cache pour -128 à 127).'
  - key: exception
    format: course
    question: Que se passe-t-il si le texte n'est pas un nombre valide ?
    choices:
      - {text: "Une `NumberFormatException`, non vérifiée, même pour une chaîne vide ou `null`", correct: true}
      - {text: "Une `ParseException`, vérifiée, qu'il faut déclarer ou attraper", correct: false}
      - {text: "La méthode renvoie 0 pour tout texte qui n'est pas un nombre", correct: false}
      - {text: "Une `NumberFormatException` pour un texte, mais 0 pour `null`", correct: false}
    answer: "Une `NumberFormatException` (non vérifiée, sous-classe d'`IllegalArgumentException`), y compris pour une chaîne vide, `null` ou une valeur hors de la plage du type."
  - key: espaces
    format: course
    question: "`Integer.parseInt(\" 42\")` fonctionne-t-il ?"
    choices:
      - {text: "Non : une `NumberFormatException`, il faut d'abord `strip()`", correct: true}
      - {text: "Oui : `parseInt` ignore les blancs autour du nombre", correct: false}
      - {text: "Oui, mais il renvoie 0 à cause de l'espace en tête", correct: false}
      - {text: "Non : il renvoie `null`, faute de nombre valide", correct: false}
    answer: "Non, il lève une `NumberFormatException` : il faut d'abord `strip()`. `Double.parseDouble` tolère, lui, les blancs autour du nombre."
  - key: locale
    format: course
    question: Comment lire `"3,14"` saisi par un utilisateur français ?
    choices:
      - {text: "Avec `NumberFormat.getInstance(Locale.FRANCE).parse(\"3,14\")`", correct: true}
      - {text: "Avec `Double.parseDouble(\"3,14\")`, qui suit la locale du système", correct: false}
      - {text: "Avec `Double.valueOf(\"3,14\")`, qui accepte aussi la virgule", correct: false}
      - {text: "Avec `Float.parseFloat(\"3,14\", Locale.FRANCE)`", correct: false}
    answer: "Avec `NumberFormat.getInstance(Locale.FRANCE).parse(\"3,14\")`. `Double.parseDouble` et `Double.valueOf` n'acceptent que le point, quelle que soit la locale."
  - key: vf-plus
    format: true-false
    question: "`Integer.parseInt(\"+42\")` renvoie 42."
    truth: true
    answer: Le signe `+` est accepté.
  - key: vf-depassement
    format: true-false
    question: "`Integer.parseInt(\"2147483648\")` renvoie `Integer.MIN_VALUE`."
    truth: false
    answer: "La valeur dépasse un `int` : `NumberFormatException`. Il faut `Long.parseLong`."
  - key: vf-virgule
    format: true-false
    question: "`Double.parseDouble(\"3,14\")` fonctionne sur une machine en français."
    truth: false
    answer: '`parseDouble` ne dépend pas de la locale et n''accepte que le point.'
  - key: vf-verifiee
    format: true-false
    question: "`NumberFormatException` est une exception vérifiée qu'il faut déclarer."
    truth: false
    answer: Elle étend `IllegalArgumentException`, donc `RuntimeException`.
  - key: qcm-valides
    format: multiple-choice
    question: "Lequel de ces textes `Integer.parseInt` accepte-t-il ?"
    choices:
      - {text: "`\"+5\"`", correct: true}
      - {text: "`\" 5\"`", correct: false}
      - {text: "`\"5.0\"`", correct: false}
      - {text: "`\"0x1F\"`", correct: false}
    answer: "Un signe `+` ou `-` est accepté (`\"-17\"` aussi) ; ni espace, ni partie décimale, ni préfixe comme `0x`."
  - key: qcm-base
    format: multiple-choice
    question: "Comment convertir `\"ff\"` (hexadécimal) en 255 ?"
    choices:
      - text: "`Integer.parseInt(\"ff\", 16)`"
        correct: true
      - text: "`Integer.parseInt(\"0xff\")`"
        correct: false
      - text: "`Integer.parseHex(\"ff\")`"
        correct: false
      - text: "`(int) \"ff\"`"
        correct: false
    answer: Le second argument est la base ; le préfixe `0x` n'est pas accepté par `parseInt`.
  - key: qcm-texte
    format: multiple-choice
    question: "Laquelle de ces expressions convertit l'`int` `n` en texte ?"
    choices:
      - {text: "`String.valueOf(n)`", correct: true}
      - {text: "`(String) n`", correct: false}
      - {text: "`n.toString()`", correct: false}
      - {text: "`Integer.parseInt(n)`", correct: false}
    answer: "`String.valueOf(n)`, comme `Integer.toString(n)`. Un primitif n'a pas de méthode, un cast ne convertit pas un `int` en `String`, et `parseInt` fait l'inverse."
  - key: qcm-api
    format: multiple-choice
    question: Un paramètre d'API `?page=abc` fait lever une `NumberFormatException`. Quelle réponse renvoyer ?
    choices:
      - {text: "Une erreur 400 qui explique que `page` doit être un entier", correct: true}
      - {text: "Une erreur 500, puisque l'exception n'a pas été prévue", correct: false}
      - {text: "La page 0, sans rien dire, pour ne pas gêner le client", correct: false}
      - {text: "Une liste vide, comme si la page demandée n'existait pas", correct: false}
    answer: C'est une erreur du client, à signaler clairement.
  - key: trous-parse
    format: fill-in
    question: |-
      Complète pour obtenir un `int` à partir du texte :
      ```java
      int age = Integer.___(saisie);
      ```
    blanks: [[parseInt]]
    answer: '`parseInt` renvoie un primitif.'
  - key: trous-exception
    format: fill-in
    question: |-
      Complète pour traiter une saisie invalide :
      ```java
      try {
          quantite = Integer.parseInt(saisie);
      } catch (___ e) {
          afficherErreur("nombre attendu");
      }
      ```
    blanks: [[NumberFormatException]]
    answer: C'est l'exception levée pour un texte qui n'est pas un nombre.
  - key: trous-base
    format: fill-in
    question: |-
      Complète pour lire un nombre binaire :
      ```java
      int valeur = Integer.parseInt("1010", ___);   // 10
      ```
    blanks: [["2"]]
    answer: Le second argument est la base.
  - key: trous-strip
    format: fill-in
    question: |-
      Complète pour accepter une saisie entourée d'espaces :
      ```java
      int n = Integer.parseInt(saisie.___());
      ```
    blanks: [[strip, trim]]
    answer: '`parseInt` refuse les blancs.'
  - key: code-parse
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Integer.parseInt("+42") + Integer.parseInt("-2") + " " + Integer.parseInt("ff", 16));
      ```
    choices:
      - {text: "`40 255`", correct: true}
      - {text: "`42-2 255`", correct: false}
      - {text: "`40 ff`", correct: false}
      - {text: "`+42-2 255`", correct: false}
    answer: '`40 255` : 42 + (-2), puis la conversion hexadécimale.'
    check:
      output: "40 255"
  - key: code-espace
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Integer.parseInt(" 42"));
      ```
    choices:
      - {text: "Une `NumberFormatException`", correct: true}
      - {text: "`42`, l'espace étant ignoré", correct: false}
      - {text: "`0`, faute de chiffre en tête", correct: false}
      - {text: "Une `IllegalStateException`", correct: false}
    answer: "Une `NumberFormatException` : `parseInt` refuse l'espace."
    check:
      throws: NumberFormatException
  - key: code-double
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Double.parseDouble(" 1e3 ") + " " + Double.parseDouble("3.14"));
      ```
    choices:
      - {text: "`1000.0 3.14`", correct: true}
      - {text: "`1e3 3.14`", correct: false}
      - {text: "`1000 3.14`", correct: false}
      - {text: "Une `NumberFormatException`", correct: false}
    answer: '`1000.0 3.14` : `parseDouble` tolère les blancs et la notation scientifique.'
    check:
      output: "1000.0 3.14"
  - key: code-depassement
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Integer.parseInt("2147483648"));
      ```
    choices:
      - {text: "Une `NumberFormatException`", correct: true}
      - {text: "`-2147483648`", correct: false}
      - {text: "`2147483647`", correct: false}
      - {text: "`2147483648`", correct: false}
    answer: "Une `NumberFormatException` : la valeur dépasse `Integer.MAX_VALUE`."
    check:
      throws: NumberFormatException
  - key: bug-saisie-espaces
    format: bug-fix
    question: |-
      Les quantités copiées depuis un tableur sont refusées :
      ```java
      int quantite = Integer.parseInt(cellule);   // cellule = "12 "
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`int quantite = Integer.parseInt(cellule.strip());`", correct: true}
      - {text: "`int quantite = Integer.valueOf(cellule);`", correct: false}
      - {text: "`int quantite = Integer.parseInt(cellule, 10);`", correct: false}
      - {text: "`int quantite = Integer.decode(cellule);`", correct: false}
    answer: |-
      ```java
      int quantite = Integer.parseInt(cellule.strip());
      ```
      `parseInt` n'accepte aucun blanc autour du nombre.
  - key: bug-erreur-500
    format: bug-fix
    question: |-
      Un utilisateur qui tape « dix » dans le champ âge obtient une erreur 500 :
      ```java
      int age = Integer.parseInt(formulaire.age());
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Attraper la `NumberFormatException` et la traduire en erreur de saisie (400)", correct: true}
      - {text: "Attraper `Exception` et prendre 0 comme âge par défaut, sans rien dire", correct: false}
      - {text: "Remplacer `parseInt` par `valueOf`, qui ne lève pas d'exception", correct: false}
      - {text: "Déclarer `throws NumberFormatException` sur la méthode du contrôleur", correct: false}
    answer: |-
      ```java
      int age;
      try {
          age = Integer.parseInt(formulaire.age().strip());
      } catch (NumberFormatException e) {
          throw new SaisieInvalide("l'âge doit être un nombre entier");
      }
      ```
      Une saisie invalide est une erreur du client : on la traduit en une exception métier, renvoyée en 400 avec un
      message clair.
  - key: bug-virgule-francaise
    format: bug-fix
    question: |-
      Les prix saisis comme `"12,50"` font échouer l'enregistrement :
      ```java
      double prix = Double.parseDouble(saisie);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Lire avec `NumberFormat.getInstance(Locale.FRANCE)`, qui comprend la virgule", correct: true}
      - {text: "Lire avec `Double.valueOf(saisie)`, plus tolérant que `parseDouble`", correct: false}
      - {text: "Lire avec `Double.parseDouble(saisie.strip())`, pour retirer les blancs", correct: false}
      - {text: "Lire avec `Float.parseFloat(saisie)`, prévu pour les décimaux courts", correct: false}
    answer: |-
      ```java
      double prix = NumberFormat.getInstance(Locale.FRANCE).parse(saisie.strip()).doubleValue();
      ```
      `parseDouble` n'accepte que le point. Pour un texte écrit selon une langue, `NumberFormat` de cette locale sait
      lire la virgule (et l'on préférera `BigDecimal` pour un prix).
  - key: bug-identifiant-long
    format: bug-fix
    question: |-
      Les nouveaux identifiants de commande provoquent des `NumberFormatException` :
      ```java
      int id = Integer.parseInt(parametre);   // parametre = "3000000000"
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`long id = Long.parseLong(parametre);`", correct: true}
      - {text: "`int id = (int) Long.parseLong(parametre);`", correct: false}
      - {text: "`int id = Integer.parseUnsignedInt(parametre);`", correct: false}
      - {text: "`Integer id = Integer.valueOf(parametre);`", correct: false}
    answer: |-
      ```java
      long id = Long.parseLong(parametre);
      ```
      Les identifiants ont dépassé `Integer.MAX_VALUE` (2 147 483 647) : il faut un `long`.
