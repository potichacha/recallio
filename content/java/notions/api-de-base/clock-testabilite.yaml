notion: clock-testabilite
lesson: |-
  `LocalDate.now()` et `Instant.now()` lisent l'horloge du système : un code qui les appelle ne peut pas être testé à
  une date précise (le 29 février, un changement d'heure, une échéance dans 30 jours). La solution : **injecter une
  `java.time.Clock`**.

  ```java
  class Abonnement {
      private final Clock clock;
      private final LocalDate fin;

      Abonnement(Clock clock, LocalDate fin) {
          this.clock = clock;
          this.fin = fin;
      }

      boolean estExpire() {
          return LocalDate.now(clock).isAfter(fin);   // toutes les méthodes now acceptent une Clock
      }
  }

  // en production
  new Abonnement(Clock.systemUTC(), fin);

  // en test : une horloge figée
  Clock fixe = Clock.fixed(Instant.parse("2025-03-14T10:00:00Z"), ZoneOffset.UTC);
  Clock plusTard = Clock.offset(fixe, Duration.ofDays(31));
  ```

  - `Clock.fixed(instant, zone)` : le temps ne bouge pas, les tests sont déterministes.
  - `Clock.offset(base, duree)` : avancer le temps sans attendre.
  - La `Clock` porte un **fuseau**, utilisé par `LocalDate.now(clock)` : `23:30Z` est déjà le lendemain à Paris.
  - Avec un conteneur d'injection (Quarkus, Spring), un producteur fournit la `Clock` de production, et les tests la
    remplacent.
  - Plus de `Thread.sleep` dans les tests pour « attendre » une expiration.

  **Piège classique** : un test qui passe tous les jours sauf autour de minuit ou de la fin du mois, parce que le code
  appelle `LocalDate.now()` sans horloge.

  **En entretien** : « Le temps est une dépendance comme une autre : j'injecte une `Clock`, et les tests utilisent
  `Clock.fixed`. »
cards:
  - key: rendre-testable-code-utilise-date-courante
    format: course
    question: Comment rendre testable du code qui utilise la date courante ?
    choices:
      - {text: "Injecter une `Clock`, et passer une `Clock.fixed` en test", correct: true}
      - {text: "Appeler `LocalDate.now()` et changer l'heure de la machine de test", correct: false}
      - {text: "Ranger la date du jour dans un champ `static` que le test modifie", correct: false}
      - {text: "Lire `System.currentTimeMillis()` plutôt que `LocalDate.now()`", correct: false}
    answer: "Injecter une `Clock` et utiliser `Clock.fixed` en test : le temps devient une entrée que le test contrôle, sans toucher à la machine."
  - key: fixed-offset
    format: course
    question: Quelle différence entre `Clock.fixed` et `Clock.offset` ?
    choices:
      - {text: "`fixed` renvoie toujours le même instant ; `offset` décale une autre horloge d'une durée", correct: true}
      - {text: "`fixed` décale une autre horloge d'une durée ; `offset` renvoie toujours le même instant", correct: false}
      - {text: "`fixed` est toujours en UTC ; `offset` suit un fuseau décalé de l'UTC", correct: false}
      - {text: "Aucune : `offset` est l'ancien nom de `fixed`, gardé pour la compatibilité", correct: false}
    answer: '`Clock.fixed` renvoie toujours le même instant ; `Clock.offset` décale une autre horloge d''une durée, pour simuler un moment futur ou passé.'
  - key: fuseau-clock
    format: course
    question: Pourquoi le fuseau d'une `Clock` compte-t-il ?
    choices:
      - {text: "`LocalDate.now(clock)` convertit l'instant dans ce fuseau : le jour peut changer", correct: true}
      - {text: "Le fuseau change l'instant renvoyé par `Instant.now(clock)`", correct: false}
      - {text: "Il ne compte pas : une `Clock` ne fournit que des instants UTC", correct: false}
      - {text: "Il règle la vitesse de l'horloge, pour accélérer les tests", correct: false}
    answer: '`LocalDate.now(clock)` et `LocalDateTime.now(clock)` convertissent l''instant dans le fuseau de l''horloge : le même instant peut tomber un autre jour selon le fuseau.'
  - key: sans-sleep
    format: course
    question: Comment tester une expiration au bout de 30 jours sans attendre ?
    choices:
      - {text: "Créer l'objet sur une horloge fixe, puis le vérifier avec `Clock.offset` de 31 jours", correct: true}
      - {text: "Configurer 30 secondes au lieu de 30 jours, et attendre 31 secondes avec `Thread.sleep`", correct: false}
      - {text: "Lancer le test avec une option de la JVM qui accélère l'écoulement du temps", correct: false}
      - {text: "Avancer la date système de la machine de test juste avant l'assertion", correct: false}
    answer: Créer l'objet avec une horloge fixe, puis vérifier son état avec `Clock.offset(horloge, Duration.ofDays(31))`, sans aucun `Thread.sleep`.
  - key: vf-now-clock
    format: true-false
    question: "`LocalDate.now()` accepte une `Clock` en paramètre."
    truth: true
    answer: Tous les `now` de `java.time` ont une surcharge `now(Clock)`.
  - key: vf-fixed-avance
    format: true-false
    question: Une horloge `Clock.fixed` avance avec le temps réel.
    truth: false
    answer: Elle renvoie toujours le même instant.
  - key: vf-sleep
    format: true-false
    question: "Pour tester une expiration, il est normal d'utiliser `Thread.sleep` dans le test."
    truth: false
    answer: Le test devient lent et fragile ; on avance une `Clock` à la place.
  - key: vf-production
    format: true-false
    question: En production, on peut fournir `Clock.systemUTC()`.
    truth: true
    answer: C'est l'horloge du système, en UTC.
  - key: qcm-tester
    format: multiple-choice
    question: "Laquelle de ces conceptions rend testable une méthode qui dépend de la date du jour ?"
    choices:
      - {text: "Recevoir une `Clock` dans le constructeur et appeler `LocalDate.now(clock)`", correct: true}
      - {text: "Appeler `LocalDate.now()` et changer l'heure de la machine de test", correct: false}
      - {text: "Mettre la date dans un champ `static` modifiable par les tests", correct: false}
      - {text: "Appeler `Instant.now()`, puis le convertir en `LocalDate` dans la méthode", correct: false}
    answer: "Le temps devient une entrée que le test contrôle : une `Clock` injectée (ou la date reçue en paramètre). `Instant.now()` reste une horloge cachée, et un champ `static` partagé rend les tests fragiles."
  - key: qcm-figer
    format: multiple-choice
    question: Comment figer le temps au 14 mars 2025 à 10 h UTC ?
    choices:
      - text: "`Clock.fixed(Instant.parse(\"2025-03-14T10:00:00Z\"), ZoneOffset.UTC)`"
        correct: true
      - text: "`Clock.systemUTC()`"
        correct: false
      - text: "`Clock.offset(Clock.systemUTC(), Duration.ZERO)`"
        correct: false
      - text: "`new Clock(\"2025-03-14\")`"
        correct: false
    answer: '`Clock` est abstraite ; ses fabriques donnent les horloges utiles.'
  - key: qcm-minuit
    format: multiple-choice
    question: "Avec une horloge fixée à `2025-03-14T23:30:00Z` dans le fuseau `Europe/Paris`, que renvoie `LocalDate.now(clock)` ?"
    choices:
      - text: "2025-03-15"
        correct: true
      - text: "2025-03-14"
        correct: false
      - text: "2025-03-13"
        correct: false
      - text: "Une exception"
        correct: false
    answer: Il est 0 h 30 le 15 mars à Paris (UTC+1 en mars, avant l'heure d'été).
  - key: qcm-quarkus
    format: multiple-choice
    question: Dans une application Quarkus, comment fournir la `Clock` ?
    choices:
      - {text: "Un producteur CDI (`@Produces`) qui renvoie `Clock.systemUTC()`, remplacé en test", correct: true}
      - {text: "Un champ `public static Clock` que chaque test modifie avant de s'exécuter", correct: false}
      - {text: "Appeler `Clock.systemDefaultZone()` directement dans chaque service", correct: false}
      - {text: "Lire `System.currentTimeMillis()` là où le temps est nécessaire", correct: false}
    answer: Le bean est injecté comme toute dépendance ; un test fournit une alternative fixe.
  - key: trous-fixed
    format: fill-in
    question: |-
      Complète pour figer le temps dans un test :
      ```java
      Clock horloge = Clock.___(Instant.parse("2025-03-14T10:00:00Z"), ZoneOffset.UTC);
      ```
    blanks: [[fixed]]
    answer: '`Clock.fixed` renvoie toujours le même instant.'
  - key: trous-now
    format: fill-in
    question: |-
      Complète pour lire la date du jour à partir de l'horloge injectée :
      ```java
      LocalDate aujourdhui = LocalDate.now(___);
      ```
    blanks: [[clock, horloge]]
    answer: On passe l'horloge injectée à `now`.
  - key: trous-offset
    format: fill-in
    question: |-
      Complète pour simuler le lendemain :
      ```java
      Clock demain = Clock.___(horloge, Duration.ofDays(1));
      ```
    blanks: [[offset]]
    answer: '`Clock.offset` décale une horloge d''une durée.'
  - key: trous-production
    format: fill-in
    question: |-
      Complète l'horloge de production, en UTC :
      ```java
      Clock horloge = Clock.___();
      ```
    blanks: [[systemUTC]]
    answer: L'horloge du système, exprimée en UTC.
  - key: code-fixe
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      Clock fixe = Clock.fixed(Instant.parse("2025-03-14T10:00:00Z"), ZoneOffset.UTC);
      System.out.println(LocalDate.now(fixe) + " " + Instant.now(fixe));
      ```
    choices:
      - {text: "`2025-03-14 2025-03-14T10:00:00Z`", correct: true}
      - {text: "`2025-03-14 2025-03-14T10:00Z`", correct: false}
      - {text: "`2025-03-14 2025-03-14T11:00:00Z`", correct: false}
      - {text: "`2025-03-14T10:00 2025-03-14T10:00:00Z`", correct: false}
    answer: "`2025-03-14 2025-03-14T10:00:00Z` : l'horloge fixe donne l'instant figé, et `LocalDate.now` le lit dans son fuseau, UTC."
    check:
      output: "2025-03-14 2025-03-14T10:00:00Z"
  - key: code-offset
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      Clock fixe = Clock.fixed(Instant.parse("2025-03-14T10:00:00Z"), ZoneOffset.UTC);
      Clock plusTard = Clock.offset(fixe, Duration.ofDays(31));
      System.out.println(LocalDate.now(plusTard));
      ```
    choices:
      - {text: "`2025-04-14`", correct: true}
      - {text: "`2025-04-13`", correct: false}
      - {text: "`2025-04-15`", correct: false}
      - {text: "`2025-03-14`", correct: false}
    answer: '`2025-04-14` : 31 jours plus tard, sans attendre.'
    check:
      output: "2025-04-14"
  - key: code-fuseau
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      Clock paris = Clock.fixed(Instant.parse("2025-03-14T23:30:00Z"), ZoneId.of("Europe/Paris"));
      System.out.println(LocalDate.now(paris));
      ```
    choices:
      - {text: "`2025-03-15`", correct: true}
      - {text: "`2025-03-14`", correct: false}
      - {text: "`2025-03-15T00:30`", correct: false}
      - {text: "`2025-03-14T23:30`", correct: false}
    answer: '`2025-03-15` : à Paris, il est déjà 0 h 30 le lendemain.'
    check:
      output: "2025-03-15"
  - key: code-stable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      Clock fixe = Clock.fixed(Instant.parse("2025-03-14T10:00:00Z"), ZoneOffset.UTC);
      Instant a = Instant.now(fixe);
      Instant b = Instant.now(fixe);
      System.out.println(a.equals(b));
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "Tantôt `true`, tantôt `false`", correct: false}
      - {text: "`2025-03-14T10:00:00Z`", correct: false}
    answer: '`true` : une horloge fixe donne toujours le même instant.'
    check:
      output: "true"
  - key: bug-now-direct
    format: bug-fix
    question: |-
      Ce test passe tous les jours sauf le dernier jour du mois :
      ```java
      class Facturation {
          boolean finDeMois() {
              LocalDate aujourdhui = LocalDate.now();
              return aujourdhui.equals(aujourdhui.with(TemporalAdjusters.lastDayOfMonth()));
          }
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Injecter une `Clock` et lire `LocalDate.now(clock)` : chaque test choisit sa date", correct: true}
      - {text: "Lire `LocalDateTime.now().toLocalDate()`, plus précis que `LocalDate.now()`", correct: false}
      - {text: "Lire `LocalDate.now(ZoneOffset.UTC)`, pour que la date ne dépende plus du jour", correct: false}
      - {text: "Désactiver le test le dernier jour du mois, par une condition sur la date", correct: false}
    answer: |-
      ```java
      class Facturation {
          private final Clock clock;
          Facturation(Clock clock) { this.clock = clock; }

          boolean finDeMois() {
              LocalDate aujourdhui = LocalDate.now(clock);
              return aujourdhui.equals(aujourdhui.with(TemporalAdjusters.lastDayOfMonth()));
          }
      }
      ```
      Le résultat dépendait du jour d'exécution. Avec une `Clock` injectée, chaque test choisit sa date et couvre les
      deux cas.
  - key: bug-sleep
    format: bug-fix
    question: |-
      Ce test dure deux secondes et échoue parfois sur la CI :
      ```java
      Jeton jeton = new Jeton(Duration.ofSeconds(1));
      Thread.sleep(2000);
      assertTrue(jeton.estExpire());
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Créer le jeton sur une horloge fixe, puis vérifier avec `Clock.offset` de 2 secondes", correct: true}
      - {text: "Porter le `sleep` à 5 secondes, pour laisser de la marge à la CI", correct: false}
      - {text: "Réduire la durée du jeton à 1 milliseconde, et le `sleep` à 10", correct: false}
      - {text: "Relancer automatiquement le test quand il échoue sur la CI", correct: false}
    answer: |-
      ```java
      Clock creation = Clock.fixed(Instant.parse("2025-03-14T10:00:00Z"), ZoneOffset.UTC);
      Jeton jeton = new Jeton(creation, Duration.ofSeconds(1));

      assertTrue(jeton.estExpire(Clock.offset(creation, Duration.ofSeconds(2))));
      ```
      On ne dort pas dans un test : on avance une horloge. Le test devient instantané et déterministe.
  - key: bug-current-time-millis
    format: bug-fix
    question: |-
      Ce calcul d'ancienneté ne peut pas être testé :
      ```java
      long anciennete = System.currentTimeMillis() - employe.embauche().getTime();
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`Period.between(employe.embauche(), LocalDate.now(clock))`", correct: true}
      - {text: "`Instant.now().toEpochMilli() - employe.embauche().getTime()`", correct: false}
      - {text: "`System.nanoTime() - employe.embauche().getTime()`", correct: false}
      - {text: "`new Date().getTime() - employe.embauche().getTime()`", correct: false}
    answer: |-
      ```java
      Period anciennete = Period.between(employe.embauche(), LocalDate.now(clock));
      ```
      `System.currentTimeMillis()` est une horloge cachée. Avec `java.time` et une `Clock` injectée, le calcul est
      testable, et le résultat est exprimé en années et mois plutôt qu'en millisecondes.
  - key: bug-clock-defaut
    format: bug-fix
    question: |-
      Selon le serveur, le changement de jour se fait à minuit UTC ou à minuit à Paris :
      ```java
      @Produces
      Clock horloge() { return Clock.systemDefaultZone(); }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`Clock.systemUTC()`, et le fuseau métier explicite dans les calculs de jour", correct: true}
      - {text: "Garder `systemDefaultZone()`, en l'appelant une seule fois au démarrage", correct: false}
      - {text: "`Clock.tickSeconds(ZoneId.systemDefault())`, plus stable d'un serveur à l'autre", correct: false}
      - {text: "`Clock.fixed(Instant.now(), ZoneOffset.UTC)`, créée au démarrage", correct: false}
    answer: |-
      ```java
      @Produces
      Clock horloge() { return Clock.systemUTC(); }
      // et les calculs de jour métier convertissent explicitement : LocalDate.now(clock.withZone(fuseauBoutique))
      ```
      `systemDefaultZone` dépend de la machine. Une horloge UTC est la même partout, et le fuseau métier est rendu
      explicite là où il compte.
