      Complétez pour lire la date du jour à partir de l'horloge injectée :
      ```java
      LocalDate aujourdhui = LocalDate.now(___);
      ```
    blanks: [[clock, horloge]]
    answer: On passe l'horloge injectée à `now`.
  - key: trous-offset
    format: fill-in
    question: |-
      Complétez pour simuler le lendemain :
      ```java
      Clock demain = Clock.___(horloge, Duration.ofDays(1));
      ```
    blanks: [[offset]]
    answer: '`Clock.offset` décale une horloge d''une durée.'
  - key: trous-production
    format: fill-in
    question: |-
      Complétez l'horloge de production, en UTC :
      ```java
      Clock horloge = Clock.___();
      ```
    blanks: [[systemUTC]]
    answer: L'horloge du système, exprimée en UTC.
  - key: code-fixe
    format: code-output
    question: |-
      ```java
      import java.time.*;
      Clock fixe = Clock.fixed(Instant.parse("2025-03-14T10:00:00Z"), ZoneOffset.UTC);
      System.out.println(LocalDate.now(fixe) + " " + Instant.now(fixe));
      ```
    answer: '`2025-03-14 2025-03-14T10:00:00Z`.'
    check:
      output: "2025-03-14 2025-03-14T10:00:00Z"
  - key: code-offset
    format: code-output
    question: |-
      ```java
      import java.time.*;
      Clock fixe = Clock.fixed(Instant.parse("2025-03-14T10:00:00Z"), ZoneOffset.UTC);
      Clock plusTard = Clock.offset(fixe, Duration.ofDays(31));
      System.out.println(LocalDate.now(plusTard));
      ```
    answer: '`2025-04-14` : 31 jours plus tard, sans attendre.'
    check:
      output: "2025-04-14"
  - key: code-fuseau
    format: code-output
    question: |-
      ```java
      import java.time.*;
      Clock paris = Clock.fixed(Instant.parse("2025-03-14T23:30:00Z"), ZoneId.of("Europe/Paris"));
      System.out.println(LocalDate.now(paris));
      ```
    answer: '`2025-03-15` : à Paris, il est déjà 0 h 30 le lendemain.'
    check:
      output: "2025-03-15"
  - key: code-stable
    format: code-output
    question: |-
      ```java
      import java.time.*;
      Clock fixe = Clock.fixed(Instant.parse("2025-03-14T10:00:00Z"), ZoneOffset.UTC);
      Instant a = Instant.now(fixe);
      Instant b = Instant.now(fixe);
      System.out.println(a.equals(b));
      ```
    answer: '`true` : une horloge fixe donne toujours le même instant.'
    check:
      output: "true"
  - key: bug-now-direct
    format: bug-fix
    question: |-
      Ce test passe tous les jours sauf le dernier jour du mois :
      ```java
      class Facturation {
          boolean finDeMois() {
              LocalDate aujourdhui = LocalDate.now();
              return aujourdhui.equals(aujourdhui.with(TemporalAdjusters.lastDayOfMonth()));
          }
      }
      ```
    answer: |-
      ```java
      class Facturation {
          private final Clock clock;
          Facturation(Clock clock) { this.clock = clock; }

          boolean finDeMois() {
              LocalDate aujourdhui = LocalDate.now(clock);
              return aujourdhui.equals(aujourdhui.with(TemporalAdjusters.lastDayOfMonth()));
          }
      }
      ```
      Le résultat dépendait du jour d'exécution. Avec une `Clock` injectée, chaque test choisit sa date et couvre les
      deux cas.
  - key: bug-sleep
    format: bug-fix
    question: |-
      Ce test dure deux secondes et échoue parfois sur la CI :
      ```java
      Jeton jeton = new Jeton(Duration.ofSeconds(1));
      Thread.sleep(2000);
      assertTrue(jeton.estExpire());
      ```
    answer: |-
      ```java
      Clock creation = Clock.fixed(Instant.parse("2025-03-14T10:00:00Z"), ZoneOffset.UTC);
      Jeton jeton = new Jeton(creation, Duration.ofSeconds(1));

      assertTrue(jeton.estExpire(Clock.offset(creation, Duration.ofSeconds(2))));
      ```
      On ne dort pas dans un test : on avance une horloge. Le test devient instantané et déterministe.
  - key: bug-current-time-millis
    format: bug-fix
    question: |-
      Ce calcul d'ancienneté ne peut pas être testé :
      ```java
      long anciennete = System.currentTimeMillis() - employe.embauche().getTime();
      ```
    answer: |-
      ```java
      Period anciennete = Period.between(employe.embauche(), LocalDate.now(clock));
      ```
      `System.currentTimeMillis()` est une horloge cachée. Avec `java.time` et une `Clock` injectée, le calcul est
      testable, et le résultat est exprimé en années et mois plutôt qu'en millisecondes.
  - key: bug-clock-defaut
    format: bug-fix
    question: |-
      Selon le serveur, le changement de jour se fait à minuit UTC ou à minuit à Paris :
      ```java
      @Produces
      Clock horloge() { return Clock.systemDefaultZone(); }
      ```
    answer: |-
      ```java
      @Produces
      Clock horloge() { return Clock.systemUTC(); }
      // et les calculs de jour métier convertissent explicitement : LocalDate.now(clock.withZone(fuseauBoutique))
      ```
      `systemDefaultZone` dépend de la machine. Une horloge UTC est la même partout, et le fuseau métier est rendu
      explicite là où il compte.
