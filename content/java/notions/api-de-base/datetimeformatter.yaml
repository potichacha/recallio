notion: datetimeformatter
lesson: |-
  `DateTimeFormatter` convertit entre les types `java.time` et du texte. Il est **immuable et thread-safe** : on peut
  le garder en `static final`.

  ```java
  static final DateTimeFormatter FR = DateTimeFormatter.ofPattern("dd/MM/yyyy");

  LocalDate.of(2025, 3, 14).format(FR);                       // "14/03/2025"
  LocalDate.parse("14/03/2025", FR);                          // 2025-03-14
  LocalDate.of(2025, 3, 14).format(
          DateTimeFormatter.ofPattern("d MMMM yyyy", Locale.FRANCE));   // "14 mars 2025"
  DateTimeFormatter.ISO_LOCAL_DATE;                           // le format par défaut de toString/parse
  ```

  Les lettres de motif les plus utiles, et leurs pièges :

  | Lettre | Sens | Piège |
  |---|---|---|
  | `yyyy` | année | **`YYYY`** est l'année *de la semaine* : différente fin décembre |
  | `MM` | mois | **`mm`** désigne les minutes |
  | `dd` | jour du mois | `DD` est le jour de l'année |
  | `HH` | heure de 0 à 23 | `hh` va de 1 à 12, à utiliser avec `a` (AM/PM) |
  | `mm`, `ss` | minutes, secondes | |
  | `MMMM`, `EEEE` | nom du mois, du jour | dépendent de la locale |

  - Un texte qui ne correspond pas lève une `DateTimeParseException` : à traiter pour une saisie utilisateur.
  - Les noms de mois et de jours dépendent de la **locale** : on la précise (`ofPattern(motif, Locale.FRANCE)`).
  - `DateTimeFormatter.ofLocalizedDate(FormatStyle.SHORT)` donne le format usuel d'une locale.

  **Piège classique** : `YYYY` au lieu de `yyyy`. Le 30 décembre 2024 s'affiche `30/12/2025`, parce qu'il appartient à
  la première semaine de 2025.

  **En entretien** : « `DateTimeFormatter` est thread-safe, contrairement à `SimpleDateFormat` ; attention à `yyyy`
  contre `YYYY` et `MM` contre `mm`. »
cards:
  - key: thread-safe
    format: course
    question: "`DateTimeFormatter` est-il thread-safe ?"
    answer: "Oui, il est immuable : on peut le partager en `static final`, contrairement à `SimpleDateFormat`."
  - key: yyyy-vs-yyyy
    format: course
    question: Quelle différence entre `yyyy` et `YYYY` dans un motif ?
    answer: '`yyyy` est l''année civile ; `YYYY` est l''année de la semaine (*week-based year*), qui diffère pour les derniers jours de décembre et les premiers de janvier.'
  - key: mm-vs-mm
    format: course
    question: Quelle différence entre `MM` et `mm` ?
    answer: '`MM` est le mois, `mm` les minutes.'
  - key: parse-exception
    format: course
    question: Que se passe-t-il si le texte ne correspond pas au motif ?
    answer: '`parse` lève une `DateTimeParseException` (non vérifiée), qu''il faut traiter pour une saisie utilisateur.'
  - key: vf-static
    format: true-false
    question: On peut partager un `DateTimeFormatter` en `static final` entre threads.
    truth: true
    answer: Il est immuable et thread-safe.
  - key: vf-hh
    format: true-false
    question: "`hh` affiche l'heure de 0 à 23."
    truth: false
    answer: '`hh` va de 1 à 12 (avec `a` pour AM/PM) ; c''est `HH` qui va de 0 à 23.'
  - key: vf-locale-mois
    format: true-false
    question: Le nom du mois affiché par `MMMM` dépend de la locale.
    truth: true
    answer: '`mars` en français, `March` en anglais.'
  - key: vf-parse-defaut
    format: true-false
    question: "`LocalDate.parse(texte)` sans formateur accepte le format `14/03/2025`."
    truth: false
    answer: Sans formateur, `parse` attend l'ISO `2025-03-14`.
  - key: qcm-motif
    format: multiple-choice
    question: Quel motif affiche `14/03/2025 09:05` ?
    choices:
      - text: "`dd/MM/yyyy HH:mm`"
        correct: true
      - text: "`dd/mm/yyyy HH:MM`"
        correct: false
      - text: "`DD/MM/YYYY hh:mm`"
        correct: false
      - text: "`d/M/y H:m`"
        correct: false
    answer: '`mm` est la minute, `MM` le mois, `DD` le jour de l''année ; le dernier n''ajoute pas de zéro.'
  - key: qcm-mois-francais
    format: multiple-choice
    question: Comment afficher `14 mars 2025` ?
    choices:
      - text: "`DateTimeFormatter.ofPattern(\"d MMMM yyyy\", Locale.FRANCE)`"
        correct: true
      - text: "`DateTimeFormatter.ofPattern(\"d MM yyyy\")`"
        correct: false
      - text: "`DateTimeFormatter.ofPattern(\"d MMMM yyyy\", Locale.US)`"
        correct: false
      - text: "`DateTimeFormatter.ISO_LOCAL_DATE`"
        correct: false
    answer: '`MMMM` écrit le nom complet du mois, dans la langue de la locale.'
  - key: qcm-iso
    format: multiple-choice
    question: Quel formateur produit `2025-03-14` ?
    choices:
      - text: "`DateTimeFormatter.ISO_LOCAL_DATE`"
        correct: true
      - text: "`DateTimeFormatter.ofPattern(\"yyyy-MM-dd\")`"
        correct: true
      - text: "`DateTimeFormatter.ofPattern(\"YYYY-mm-DD\")`"
        correct: false
      - text: "`DateTimeFormatter.BASIC_ISO_DATE`"
        correct: false
    answer: '`BASIC_ISO_DATE` donne `20250314`, sans tirets.'
  - key: qcm-saisie
    format: multiple-choice
    question: Comment traiter une date mal saisie par un utilisateur ?
    choices:
      - text: "Attraper la `DateTimeParseException` et renvoyer un message clair"
        correct: true
      - text: "Laisser l'exception produire une erreur 500"
        correct: false
      - text: "Remplacer la date par aujourd'hui sans le dire"
        correct: false
      - text: "Utiliser `SimpleDateFormat`, plus tolérant"
        correct: false
    answer: C'est une erreur du client, à signaler (400 dans une API).
  - key: code-format
    format: code-output
    question: |-
      ```java
      import java.time.*;
      import java.time.format.DateTimeFormatter;
      System.out.println(LocalDate.of(2025, 3, 14).format(DateTimeFormatter.ofPattern("dd/MM/yyyy")));
      ```
    answer: '`14/03/2025`.'
    check:
      output: "14/03/2025"
  - key: code-annee-semaine
    format: code-output
    question: |-
      ```java
      import java.time.*;
      import java.time.format.DateTimeFormatter;
      LocalDate d = LocalDate.of(2024, 12, 30);
      System.out.println(d.format(DateTimeFormatter.ofPattern("yyyy-MM-dd", Locale.FRANCE)) + " "
              + d.format(DateTimeFormatter.ofPattern("YYYY-MM-dd", Locale.FRANCE)));
      ```
    answer: '`2024-12-30 2025-12-30` : le 30 décembre 2024 est dans la première semaine de 2025.'
    check:
      output: "2024-12-30 2025-12-30"
  - key: code-minutes-mois
    format: code-output
    question: |-
      ```java
      import java.time.*;
      import java.time.format.DateTimeFormatter;
      LocalDateTime t = LocalDateTime.of(2025, 3, 14, 9, 5);
      System.out.println(t.format(DateTimeFormatter.ofPattern("dd/mm/yyyy HH:MM")));
      ```
    answer: '`14/05/2025 09:03` : `mm` a affiché les minutes à la place du mois, et `MM` le mois à la place des minutes.'
    check:
      output: "14/05/2025 09:03"
  - key: code-parse-iso
    format: code-output
    question: |-
      ```java
      import java.time.*;
      System.out.println(LocalDate.parse("14/03/2025"));
      ```
    answer: "Une `DateTimeParseException` : sans formateur, `parse` attend le format ISO."
    check:
      throws: DateTimeParseException
  - key: bug-yyyy
    format: bug-fix
    question: |-
      Les factures du 29 au 31 décembre 2024 sont datées de 2025 :
      ```java
      DateTimeFormatter FORMAT = DateTimeFormatter.ofPattern("dd/MM/YYYY");
      ```
    answer: |-
      ```java
      DateTimeFormatter FORMAT = DateTimeFormatter.ofPattern("dd/MM/yyyy");
      ```
      `YYYY` est l'année de la semaine ISO : ces jours appartiennent à la première semaine de 2025. `yyyy` est l'année
      civile.
  - key: bug-mm
    format: bug-fix
    question: |-
      Toutes les dates du journal semblent tomber en janvier ou en mai :
      ```java
      DateTimeFormatter.ofPattern("yyyy-mm-dd HH:mm")
      ```
    answer: |-
      ```java
      DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm")
      ```
      `mm` désigne les minutes : le « mois » affiché était la minute courante.
  - key: bug-simpledateformat
    format: bug-fix
    question: |-
      Sous charge, des dates sortent corrompues :
      ```java
      private static final SimpleDateFormat FORMAT = new SimpleDateFormat("dd/MM/yyyy");
      String afficher(Date d) { return FORMAT.format(d); }
      ```
    answer: |-
      ```java
      private static final DateTimeFormatter FORMAT = DateTimeFormatter.ofPattern("dd/MM/yyyy");
      String afficher(LocalDate d) { return d.format(FORMAT); }
      ```
      `SimpleDateFormat` n'est pas thread-safe ; `DateTimeFormatter` est immuable et se partage sans risque.
  - key: bug-saisie
    format: bug-fix
    question: |-
      Une date de naissance mal tapée provoque une erreur 500 :
      ```java
      LocalDate naissance = LocalDate.parse(formulaire.naissance(), FORMAT);
      ```
    answer: |-
      ```java
      LocalDate naissance;
      try {
          naissance = LocalDate.parse(formulaire.naissance().strip(), FORMAT);
      } catch (DateTimeParseException e) {
          throw new SaisieInvalide("date attendue au format jj/mm/aaaa");
      }
      ```
      Une saisie invalide est une erreur du client, à traduire en message clair (400).
