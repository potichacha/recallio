notion: text-blocks
lesson: |-
  Un **bloc de texte** (Java 15, JEP 378) écrit une chaîne sur plusieurs lignes entre `"""` :

  ```java
  String requete = """
          SELECT nom, email
          FROM client
          WHERE actif = true
          """;
  ```

  - Le `"""` d'ouverture doit être **suivi d'un retour à la ligne** : le contenu commence à la ligne suivante.
  - L'**indentation commune** est retirée : la marge est calculée sur la ligne la moins indentée, **y compris** la ligne
    du `"""` fermant. Reculer le `"""` fermant ajoute donc de l'indentation au texte.
  - Un `"""` fermant sur sa **propre ligne** ajoute un `\n` final ; collé au dernier mot, il n'en ajoute pas.
  - Les espaces en fin de ligne sont supprimés ; `\s` en garde un.
  - Un `\` en fin de ligne joint la ligne suivante, sans retour à la ligne.
  - Les guillemets s'écrivent sans échappement : du JSON ou du HTML se colle tel quel.
  - Pour insérer des valeurs : `"""...""".formatted(a, b)`.

  Un bloc de texte produit une `String` ordinaire : même type, même pool, mêmes méthodes.

  **Piège classique** : insérer des valeurs saisies dans une requête SQL écrite en bloc de texte avec `formatted`. C'est
  toujours de la concaténation : injection possible. Les valeurs passent par un `PreparedStatement`.

  **En entretien** : « Un bloc de texte retire l'indentation commune, garde les sauts de ligne et évite les
  échappements ; c'est une `String` comme une autre. »
cards:
  - key: definition
    format: course
    question: "Que permet un bloc de texte (`\"\"\"`), apparu en Java 15 ?"
    choices:
      - {text: "D'écrire une chaîne sur plusieurs lignes, sans son indentation commune", correct: true}
      - {text: "D'écrire un commentaire sur plusieurs lignes, ignoré par le compilateur", correct: false}
      - {text: "D'écrire une chaîne modifiable sur place, comme un `StringBuilder`", correct: false}
      - {text: "D'écrire une chaîne où les variables `${...}` sont remplacées", correct: false}
    answer: "Une chaîne littérale sur plusieurs lignes entre `\"\"\"`, dont l'indentation commune est retirée : pratique pour du JSON, du SQL ou du HTML. Elle reste une `String` immuable, sans interpolation."
  - key: indentation
    format: course
    question: Comment est calculée l'indentation retirée d'un bloc de texte ?
    choices:
      - {text: "La plus petite indentation des lignes non vides, ligne du `\"\"\"` fermant comprise", correct: true}
      - {text: "L'indentation de la première ligne du contenu, retirée de chaque ligne", correct: false}
      - {text: "Toute l'indentation de chaque ligne, retirée ligne par ligne", correct: false}
      - {text: "L'indentation de la ligne qui contient le `\"\"\"` ouvrant", correct: false}
    answer: C'est la plus petite indentation des lignes non vides, en comptant la ligne du `"""` fermant ; elle est retirée de chaque ligne.
  - key: newline-final
    format: course
    question: Quand un bloc de texte se termine-t-il par un retour à la ligne ?
    choices:
      - {text: "Quand le `\"\"\"` fermant est sur sa propre ligne", correct: true}
      - {text: "Toujours : un bloc de texte finit par un retour", correct: false}
      - {text: "Jamais : il faut ajouter le retour à la main", correct: false}
      - {text: "Quand la dernière ligne finit par un espace", correct: false}
    answer: Quand le `"""` fermant est sur sa propre ligne ; s'il suit directement le dernier caractère, il n'y a pas de `\n` final.
  - key: echappements
    format: course
    question: À quoi servent `\` et `\s` en fin de ligne dans un bloc de texte ?
    choices:
      - {text: "`\\` joint la ligne suivante sans retour ; `\\s` garde un espace de fin de ligne", correct: true}
      - {text: "`\\` marque la fin du bloc de texte ; `\\s` insère une tabulation", correct: false}
      - {text: "`\\` insère un retour à la ligne ; `\\s` supprime l'espace qui le suit", correct: false}
      - {text: "`\\` échappe le guillemet suivant ; `\\s` insère un saut de section", correct: false}
    answer: '`\` joint la ligne suivante sans retour à la ligne ; `\s` insère un espace qui ne sera pas supprimé comme espace de fin de ligne.'
  - key: vf-meme-ligne
    format: true-false
    question: "On peut écrire `String s = \"\"\"bonjour\"\"\";` sur une seule ligne."
    truth: false
    answer: Le `"""` d'ouverture doit être suivi d'un retour à la ligne.
  - key: vf-type
    format: true-false
    question: Un bloc de texte est une `String` ordinaire.
    truth: true
    answer: Il n'existe pas de type à part ; seule l'écriture change.
  - key: vf-guillemets
    format: true-false
    question: Dans un bloc de texte, les guillemets doubles doivent être échappés.
    truth: false
    answer: Seule une suite de trois guillemets doit l'être.
  - key: vf-espaces-fin
    format: true-false
    question: Les espaces en fin de ligne d'un bloc de texte sont conservés.
    truth: false
    answer: Ils sont supprimés ; `\s` permet d'en garder un.
  - key: qcm-version
    format: multiple-choice
    question: Depuis quelle version les blocs de texte sont-ils définitifs ?
    choices:
      - text: "Java 15"
        correct: true
      - text: "Java 8"
        correct: false
      - text: "Java 11"
        correct: false
      - text: "Java 21"
        correct: false
    answer: Ils étaient en preview en Java 13 et 14 (JEP 378 pour la version définitive).
  - key: qcm-valeurs
    format: multiple-choice
    question: Comment insérer des valeurs dans un bloc de texte de message ?
    choices:
      - text: "`\"\"\"...%s...\"\"\".formatted(nom)`"
        correct: true
      - text: "Avec `${nom}` dans le bloc"
        correct: false
      - text: "Avec `{nom}` dans le bloc"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: Java n'a pas d'interpolation de chaînes ; on passe par `formatted` (pas pour du SQL).
  - key: qcm-indentation
    format: multiple-choice
    question: Que se passe-t-il si l'on recule le `"""` fermant de quatre espaces par rapport au contenu ?
    choices:
      - {text: "Chaque ligne du texte gagne quatre espaces d'indentation", correct: true}
      - {text: "Rien : le fermant n'entre pas dans le calcul de la marge", correct: false}
      - {text: "Une erreur de compilation : le fermant est mal aligné", correct: false}
      - {text: "La dernière ligne du texte disparaît du résultat", correct: false}
    answer: Le fermant participe au calcul de la marge commune.
  - key: qcm-usages
    format: multiple-choice
    question: "Dans lequel de ces cas un bloc de texte est-il utile ?"
    choices:
      - {text: "Un document JSON de test, sur plusieurs lignes", correct: true}
      - {text: "Un identifiant qui tient sur une ligne", correct: false}
      - {text: "Un message de journal d'une ligne", correct: false}
      - {text: "Une chaîne modifiée tour après tour", correct: false}
    answer: "Un bloc de texte sert aux contenus sur plusieurs lignes : JSON, HTML, SQL. Pour une ligne, un littéral ordinaire suffit ; pour une chaîne qu'on construit, un `StringBuilder`."
  - key: code-longueur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String json = """
          {"nom": "Ada"}
          """;
      System.out.println(json.length());
      ```
    choices:
      - {text: "`15`", correct: true}
      - {text: "`14`", correct: false}
      - {text: "`19`", correct: false}
      - {text: "`23`", correct: false}
    answer: '`15` : 14 caractères, plus le retour à la ligne final ; l''indentation est retirée.'
    check:
      output: "15"
  - key: code-sans-newline
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = """
          ligne""";
      System.out.println("[" + s + "]");
      ```
    choices:
      - {text: "`[ligne]`", correct: true}
      - text: |-
          ```
          [ligne
          ]
          ```
        correct: false
      - {text: "`[    ligne]`", correct: false}
      - text: |-
          ```
          [
          ligne]
          ```
        correct: false
    answer: '`[ligne]` : le fermant collé au texte n''ajoute pas de `\n`.'
    check:
      output: "[ligne]"
  - key: code-continuation
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = """
          un \
          deux""";
      System.out.println(s);
      ```
    choices:
      - {text: "`un deux`", correct: true}
      - text: |-
          ```
          un
          deux
          ```
        correct: false
      - {text: "`undeux`", correct: false}
      - {text: "`un \\ deux`", correct: false}
    answer: '`un deux` : le `\` final joint les deux lignes.'
    check:
      output: "un deux"
  - key: code-marge
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = """
              a
                b
          """;
      System.out.print(s.replace(' ', '.'));
      ```
    choices:
      - text: |-
          ```
          ....a
          ......b
          ```
        correct: true
      - text: |-
          ```
          a
          ..b
          ```
        correct: false
      - text: |-
          ```
          ....a
          ....b
          ```
        correct: false
      - text: |-
          ```
          ........a
          ..........b
          ```
        correct: false
    answer: |-
      `....a` puis `......b` : le fermant, moins indenté de quatre espaces, fixe la marge ; le contenu garde quatre
      espaces de plus.
    check:
      output: |-
        ....a
        ......b
  - key: bug-concatenation
    format: bug-fix
    question: |-
      Comment rendre ce JSON de test lisible ?
      ```java
      String json = "{\n" +
                    "  \"nom\": \"Ada\",\n" +
                    "  \"age\": 36\n" +
                    "}\n";
      ```
    choices:
      - {text: "Un bloc de texte `\"\"\"`, avec le JSON tel quel, sans guillemets échappés", correct: true}
      - {text: "Un `StringBuilder`, avec un `append` pour chaque ligne du JSON", correct: false}
      - {text: "Un `String.join` des lignes du JSON, guillemets toujours échappés", correct: false}
      - {text: "Un `String.format`, avec un `%s` pour chaque valeur du JSON", correct: false}
    answer: |-
      ```java
      String json = """
              {
                "nom": "Ada",
                "age": 36
              }
              """;
      ```
      Plus de concaténation, de `\n` ni de guillemets échappés.
  - key: bug-sql-formatted
    format: bug-fix
    question: |-
      Une revue de sécurité refuse ce code :
      ```java
      String sql = """
              SELECT * FROM commande
              WHERE client = '%s'
              """.formatted(nomClient);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Garder le bloc de texte avec un paramètre `?`, rempli par un `PreparedStatement`", correct: true}
      - {text: "Doubler les apostrophes de `nomClient` avant de l'insérer avec `formatted`", correct: false}
      - {text: "Remplacer `formatted` par `String.format`, qui échappe les valeurs", correct: false}
      - {text: "Remplacer le bloc de texte par une concaténation sur une seule ligne", correct: false}
    answer: |-
      ```java
      String sql = """
              SELECT * FROM commande
              WHERE client = ?
              """;
      PreparedStatement requete = connexion.prepareStatement(sql);
      requete.setString(1, nomClient);
      ```
      `formatted` insère la valeur dans le texte de la requête : c'est une injection SQL possible. Le bloc de texte garde
      la lisibilité, le paramètre `?` la sécurité.
  - key: bug-espace-perdu
    format: bug-fix
    question: |-
      Un format à colonnes fixes attend un espace en fin de chaque ligne, mais il disparaît :
      ```java
      String entete = """
              NOM
              PRENOM
              """;
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Terminer chaque ligne par `\\s`, qui garde l'espace de fin de ligne", correct: true}
      - {text: "Ajouter deux espaces en fin de ligne, dont un seul sera supprimé", correct: false}
      - {text: "Reculer le `\"\"\"` fermant de quatre espaces vers la gauche", correct: false}
      - {text: "Appeler `strip()` sur le bloc de texte avant de l'utiliser", correct: false}
    answer: |-
      ```java
      String entete = """
              NOM \s
              PRENOM \s
              """;
      ```
      Les espaces de fin de ligne d'un bloc de texte sont supprimés. `\s` en conserve un (et protège ceux qui le
      précèdent).
  - key: bug-une-ligne
    format: bug-fix
    question: |-
      Ce code ne compile pas (`illegal text block open delimiter sequence`) :
      ```java
      String message = """Bonjour""";
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`String message = \"Bonjour\";`, un littéral ordinaire", correct: true}
      - {text: "`String message = \"\"\" Bonjour \"\"\";`, avec des espaces", correct: false}
      - {text: "`String message = \"\"\"Bonjour\"\"\".strip();`", correct: false}
      - {text: "`String message = '''Bonjour''';`, avec des apostrophes", correct: false}
    answer: |-
      ```java
      String message = "Bonjour";
      ```
      Un bloc de texte doit commencer par un retour à la ligne après `"""`. Pour une seule ligne, un littéral ordinaire
      suffit.
