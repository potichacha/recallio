notion: text-blocks
lesson: |-
  Un **bloc de texte** (Java 15, JEP 378) écrit une chaîne sur plusieurs lignes entre `"""` :

  ```java
  String requete = """
          SELECT nom, email
          FROM client
          WHERE actif = true
          """;
  ```

  - Le `"""` d'ouverture doit être **suivi d'un retour à la ligne** : le contenu commence à la ligne suivante.
  - L'**indentation commune** est retirée : la marge est calculée sur la ligne la moins indentée, **y compris** la ligne
    du `"""` fermant. Reculer le `"""` fermant ajoute donc de l'indentation au texte.
  - Un `"""` fermant sur sa **propre ligne** ajoute un `\n` final ; collé au dernier mot, il n'en ajoute pas.
  - Les espaces en fin de ligne sont supprimés ; `\s` en garde un.
  - Un `\` en fin de ligne joint la ligne suivante, sans retour à la ligne.
  - Les guillemets s'écrivent sans échappement : du JSON ou du HTML se colle tel quel.
  - Pour insérer des valeurs : `"""...""".formatted(a, b)`.

  Un bloc de texte produit une `String` ordinaire : même type, même pool, mêmes méthodes.

  **Piège classique** : insérer des valeurs saisies dans une requête SQL écrite en bloc de texte avec `formatted`. C'est
  toujours de la concaténation : injection possible. Les valeurs passent par un `PreparedStatement`.

  **En entretien** : « Un bloc de texte retire l'indentation commune, garde les sauts de ligne et évite les
  échappements ; c'est une `String` comme une autre. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'un bloc de texte ?
    answer: Une chaîne littérale sur plusieurs lignes entre `"""` (Java 15), dont l'indentation commune est retirée, pratique pour du JSON, du SQL ou du HTML.
  - key: indentation
    format: course
    question: Comment est calculée l'indentation retirée d'un bloc de texte ?
    answer: C'est la plus petite indentation des lignes non vides, en comptant la ligne du `"""` fermant ; elle est retirée de chaque ligne.
  - key: newline-final
    format: course
    question: Quand un bloc de texte se termine-t-il par un retour à la ligne ?
    answer: Quand le `"""` fermant est sur sa propre ligne ; s'il suit directement le dernier caractère, il n'y a pas de `\n` final.
  - key: echappements
    format: course
    question: À quoi servent `\` et `\s` en fin de ligne dans un bloc de texte ?
    answer: '`\` joint la ligne suivante sans retour à la ligne ; `\s` insère un espace qui ne sera pas supprimé comme espace de fin de ligne.'
  - key: vf-meme-ligne
    format: true-false
    question: "On peut écrire `String s = \"\"\"bonjour\"\"\";` sur une seule ligne."
    truth: false
    answer: Le `"""` d'ouverture doit être suivi d'un retour à la ligne.
  - key: vf-type
    format: true-false
    question: Un bloc de texte est une `String` ordinaire.
    truth: true
    answer: Il n'existe pas de type à part ; seule l'écriture change.
  - key: vf-guillemets
    format: true-false
    question: Dans un bloc de texte, les guillemets doubles doivent être échappés.
    truth: false
    answer: Seule une suite de trois guillemets doit l'être.
  - key: vf-espaces-fin
    format: true-false
    question: Les espaces en fin de ligne d'un bloc de texte sont conservés.
    truth: false
    answer: Ils sont supprimés ; `\s` permet d'en garder un.
  - key: qcm-version
    format: multiple-choice
    question: Depuis quelle version les blocs de texte sont-ils définitifs ?
    choices:
      - text: "Java 15"
        correct: true
      - text: "Java 8"
        correct: false
      - text: "Java 11"
        correct: false
      - text: "Java 21"
        correct: false
    answer: Ils étaient en preview en Java 13 et 14 (JEP 378 pour la version définitive).
  - key: qcm-valeurs
    format: multiple-choice
    question: Comment insérer des valeurs dans un bloc de texte de message ?
    choices:
      - text: "`\"\"\"...%s...\"\"\".formatted(nom)`"
        correct: true
      - text: "Avec `${nom}` dans le bloc"
        correct: false
      - text: "Avec `{nom}` dans le bloc"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: Java n'a pas d'interpolation de chaînes ; on passe par `formatted` (pas pour du SQL).
  - key: qcm-indentation
    format: multiple-choice
    question: Que se passe-t-il si l'on recule le `"""` fermant de quatre espaces par rapport au contenu ?
    choices:
      - text: "Chaque ligne du texte gagne quatre espaces d'indentation"
        correct: true
      - text: "Rien"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
      - text: "La dernière ligne disparaît"
        correct: false
    answer: Le fermant participe au calcul de la marge commune.
  - key: qcm-usages
    format: multiple-choice
    question: Pour quels contenus un bloc de texte est-il utile ?
    choices:
      - text: "Un document JSON de test"
        correct: true
      - text: "Un gabarit HTML"
        correct: true
      - text: "Une requête SQL sur plusieurs lignes"
        correct: true
      - text: "Un identifiant d'une ligne"
        correct: false
    answer: Un littéral ordinaire suffit pour une ligne.
  - key: code-longueur
    format: code-output
    question: |-
      ```java
      String json = """
          {"nom": "Ada"}
          """;
      System.out.println(json.length());
      ```
    answer: '`15` : 14 caractères, plus le retour à la ligne final ; l''indentation est retirée.'
    check:
      output: "15"
  - key: code-sans-newline
    format: code-output
    question: |-
      ```java
      String s = """
          ligne""";
      System.out.println("[" + s + "]");
      ```
    answer: '`[ligne]` : le fermant collé au texte n''ajoute pas de `\n`.'
    check:
      output: "[ligne]"
  - key: code-continuation
    format: code-output
    question: |-
      ```java
      String s = """
          un \
          deux""";
      System.out.println(s);
      ```
    answer: '`un deux` : le `\` final joint les deux lignes.'
    check:
      output: "un deux"
  - key: code-marge
    format: code-output
    question: |-
      ```java
      String s = """
              a
                b
          """;
      System.out.print(s.replace(' ', '.'));
      ```
    answer: |-
      `....a` puis `......b` : le fermant, moins indenté de quatre espaces, fixe la marge ; le contenu garde quatre
      espaces de plus.
    check:
      output: |-
        ....a
        ......b
  - key: bug-concatenation
    format: bug-fix
    question: |-
      Rendez ce JSON de test lisible :
      ```java
      String json = "{\n" +
                    "  \"nom\": \"Ada\",\n" +
                    "  \"age\": 36\n" +
                    "}\n";
      ```
    answer: |-
      ```java
      String json = """
              {
                "nom": "Ada",
                "age": 36
              }
              """;
      ```
      Plus de concaténation, de `\n` ni de guillemets échappés.
  - key: bug-sql-formatted
    format: bug-fix
    question: |-
      Une revue de sécurité refuse ce code :
      ```java
      String sql = """
              SELECT * FROM commande
              WHERE client = '%s'
              """.formatted(nomClient);
      ```
    answer: |-
      ```java
      String sql = """
              SELECT * FROM commande
              WHERE client = ?
              """;
      PreparedStatement requete = connexion.prepareStatement(sql);
      requete.setString(1, nomClient);
      ```
      `formatted` insère la valeur dans le texte de la requête : c'est une injection SQL possible. Le bloc de texte garde
      la lisibilité, le paramètre `?` la sécurité.
  - key: bug-espace-perdu
    format: bug-fix
    question: |-
      Un format à colonnes fixes attend un espace en fin de chaque ligne, mais il disparaît :
      ```java
      String entete = """
              NOM
              PRENOM
              """;
      ```
    answer: |-
      ```java
      String entete = """
              NOM \s
              PRENOM \s
              """;
      ```
      Les espaces de fin de ligne d'un bloc de texte sont supprimés. `\s` en conserve un (et protège ceux qui le
      précèdent).
  - key: bug-une-ligne
    format: bug-fix
    question: |-
      Ce code ne compile pas (`illegal text block open delimiter sequence`) :
      ```java
      String message = """Bonjour""";
      ```
    answer: |-
      ```java
      String message = "Bonjour";
      ```
      Un bloc de texte doit commencer par un retour à la ligne après `"""`. Pour une seule ligne, un littéral ordinaire
      suffit.
