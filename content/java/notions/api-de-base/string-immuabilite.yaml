notion: string-immuabilite
lesson: |-
  Une `String` ne change **jamais** après sa création. Toute méthode qui semble la modifier (`toUpperCase`, `replace`,
  `trim`, `concat`) renvoie une **nouvelle** chaîne.

  ```java
  String s = "java";
  s.toUpperCase();          // résultat perdu : s vaut toujours "java"
  s = s.toUpperCase();      // s désigne maintenant une NOUVELLE chaîne "JAVA"

  String a = "x";
  String b = a;
  a += "y";                 // a désigne "xy" ; b désigne toujours "x"
  ```

  Pourquoi ce choix :
  - **sécurité** : un nom de fichier, une URL ou un nom de classe validé ne peut pas changer après la vérification ;
  - **partage sans risque** : le pool de chaînes peut donner le même objet à tout le monde, et les threads le lisent
    sans synchronisation ;
  - **hachage mis en cache** : `hashCode()` est calculé une fois, ce qui fait de `String` une clé de `HashMap` rapide
    et sûre.

  Le prix : chaque « modification » crée un objet. Pour construire un texte morceau par morceau, on utilise
  `StringBuilder`.

  **Piège classique** : croire qu'une méthode qui reçoit une `String` peut la modifier pour l'appelant. Elle ne peut
  que réaffecter sa propre variable locale ; il faut **renvoyer** la nouvelle chaîne.

  **En entretien** : « `String` est immuable pour la sécurité, le partage entre threads et le pool, et pour mettre en
  cache son `hashCode` ; ses méthodes renvoient de nouvelles chaînes. »
tour:
  - title: Une String ne change pas
    text: |-
      Une `String` est **immuable** : aucune méthode ne la modifie. `toUpperCase()` ou `replace()` renvoient une
      **nouvelle** chaîne, et l'originale reste intacte ; si l'on n'affecte pas le résultat, il est perdu.

      L'immuabilité rend les chaînes sûres à partager entre objets et entre threads, et permet à la JVM de réutiliser
      les littéraux identiques. Elle a un coût : concaténer dans une boucle crée une chaîne à chaque tour.
    example:
      files:
        Main.java: |-
          void main() {
              String nom = "ada";
              nom.toUpperCase();
              IO.println(nom);
              String majuscules = nom.toUpperCase();
              IO.println(majuscules + " " + nom);
          }
      output: |-
        ada
        ADA ada
    task:
      instructions: |-
        Ce programme veut afficher `BONJOUR`, mais il affiche `bonjour`. Corrige-le.
      starter:
        Main.java: |-
          void main() {
              String salut = "bonjour";
              salut.toUpperCase();
              IO.println(salut);
          }
      solution:
        Main.java: |-
          void main() {
              String salut = "bonjour";
              salut = salut.toUpperCase();
              IO.println(salut);
          }
      output: |-
        BONJOUR
cards:
  - key: string-immutable
    format: course
    question: Pourquoi String est immutable ?
    answer: Sécurité, thread-safety, et déduplication via le String Pool.
  - key: hash-cache
    format: course
    question: Quel avantage l'immuabilité donne-t-elle à `String` comme clé de `HashMap` ?
    answer: Son hash ne peut pas changer après l'insertion, et il est calculé une seule fois puis mis en cache dans l'objet.
  - key: methodes-nouvelles
    format: course
    question: Que fait `s.replace("a", "b")` sur la chaîne `s` ?
    answer: "Rien : elle renvoie une nouvelle chaîne, et `s` reste identique."
  - key: cout
    format: course
    question: Quel est le coût de l'immuabilité de `String` ?
    answer: Chaque transformation crée un nouvel objet ; pour assembler beaucoup de morceaux, on utilise `StringBuilder`.
  - key: vf-modifie
    format: true-false
    question: "`s.trim()` retire les espaces de la chaîne `s`."
    truth: false
    answer: Elle renvoie une nouvelle chaîne sans espaces ; `s` ne change pas.
  - key: vf-reaffectation
    format: true-false
    question: Après `s = s + "!";`, l'objet chaîne d'origine a été modifié.
    truth: false
    answer: '`s` désigne un nouvel objet ; l''ancien est intact (et récupérable par le GC s''il n''est plus référencé).'
  - key: vf-thread-safe
    format: true-false
    question: Une `String` peut être partagée entre threads sans synchronisation.
    truth: true
    answer: Elle est immuable.
  - key: vf-final
    format: true-false
    question: La classe `String` est `final`.
    truth: true
    answer: Une sous-classe ne peut donc pas casser son immuabilité.
  - key: qcm-raisons
    format: multiple-choice
    question: Quelles sont les raisons de l'immuabilité de `String` ?
    choices:
      - text: "La sécurité (une valeur vérifiée ne change plus)"
        correct: true
      - text: "Le partage dans le pool de chaînes"
        correct: true
      - text: "La mise en cache du hash"
        correct: true
      - text: "Accélérer la concaténation en boucle"
        correct: false
    answer: L'immuabilité rend au contraire la concaténation en boucle coûteuse.
  - key: qcm-resultat
    format: multiple-choice
    question: "Que vaut `s` après `String s = \"abc\"; s.toUpperCase();` ?"
    choices:
      - text: "\"abc\""
        correct: true
      - text: "\"ABC\""
        correct: false
      - text: "null"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Le résultat n'a pas été récupéré.
  - key: qcm-alias
    format: multiple-choice
    question: "Que vaut `t` après `String s = \"a\"; String t = s; s = s + \"b\";` ?"
    choices:
      - text: "\"a\""
        correct: true
      - text: "\"ab\""
        correct: false
      - text: "\"b\""
        correct: false
      - text: "null"
        correct: false
    answer: '`s` désigne une nouvelle chaîne ; `t` désigne toujours l''ancienne.'
  - key: qcm-mutable
    format: multiple-choice
    question: Quel type utiliser pour modifier un texte sur place ?
    choices:
      - text: "`StringBuilder`"
        correct: true
      - text: "`String`"
        correct: false
      - text: "`CharSequence`"
        correct: false
      - text: "`final String`"
        correct: false
    answer: '`StringBuilder` est la version mutable, sans synchronisation.'
  - key: code-string-hello-touppercase-system-out
    format: code-output
    question: '`String t = "hello"; t.toUpperCase(); System.out.println(t);`'
    answer: '`hello` : String est immuable et le résultat n''a pas été récupéré.'
    check:
      code: |-
        String t = "hello"; t.toUpperCase(); System.out.println(t);
      output: "hello"
  - key: code-alias
    format: code-output
    question: |-
      ```java
      String s = "a";
      String t = s;
      s += "b";
      System.out.println(s + " " + t);
      ```
    answer: '`ab a` : `+=` crée une nouvelle chaîne pour `s`, `t` garde l''ancienne.'
    check:
      output: "ab a"
  - key: code-trim
    format: code-output
    question: |-
      ```java
      String s = " x ";
      s.trim();
      System.out.println("[" + s + "]" + "[" + s.trim() + "]");
      ```
    answer: '`[ x ][x]` : seul le résultat de `trim()` est sans espaces.'
    check:
      output: "[ x ][x]"
  - key: code-methode
    format: code-output
    question: |-
      ```java
      static void crier(String s) { s = s.toUpperCase() + "!"; }
      String mot = "salut";
      crier(mot);
      System.out.println(mot);
      ```
    answer: '`salut` : la méthode réaffecte sa copie de la référence, la chaîne de l''appelant ne change pas.'
    check:
      output: "salut"
  - key: bug-methode-sans-retour
    format: bug-fix
    question: |-
      Le titre n'est jamais normalisé :
      ```java
      void normaliser(String titre) {
          titre = titre.strip().toLowerCase(Locale.ROOT);
      }
      normaliser(article.titre);
      ```
    answer: |-
      ```java
      String normaliser(String titre) {
          return titre.strip().toLowerCase(Locale.ROOT);
      }
      article.titre = normaliser(article.titre);
      ```
      Une `String` ne peut pas être modifiée, et réaffecter le paramètre ne touche pas l'appelant : on renvoie la nouvelle
      chaîne.
  - key: bug-concat-ignore
    format: bug-fix
    question: |-
      Le suffixe n'apparaît jamais :
      ```java
      String nom = "rapport";
      nom.concat(".pdf");
      sauvegarder(nom);
      ```
    answer: |-
      ```java
      String nom = "rapport".concat(".pdf");
      sauvegarder(nom);
      ```
      `concat` renvoie une nouvelle chaîne ; l'originale ne change pas.
  - key: bug-mot-de-passe
    format: bug-fix
    question: |-
      Un audit de sécurité signale que les mots de passe restent lisibles dans un vidage mémoire :
      ```java
      String motDePasse = new String(console.readPassword());
      verifier(motDePasse);
      ```
    answer: |-
      ```java
      char[] motDePasse = console.readPassword();
      try {
          verifier(motDePasse);
      } finally {
          Arrays.fill(motDePasse, '\0');
      }
      ```
      Une `String` immuable ne peut pas être effacée : elle reste en mémoire jusqu'au passage du GC. Un `char[]` se vide
      dès qu'on n'en a plus besoin (c'est pourquoi `readPassword` renvoie un tableau).
  - key: bug-boucle-plus
    format: bug-fix
    question: |-
      Ce code est très lent pour 100 000 identifiants :
      ```java
      String csv = "";
      for (String id : ids) {
          csv += id + ";";
      }
      ```
    answer: |-
      ```java
      String csv = String.join(";", ids);
      ```
      Chaque `+=` recopie toute la chaîne accumulée dans un nouvel objet : le coût devient quadratique. `String.join` (ou
      un `StringBuilder`) n'ajoute que les morceaux nouveaux.
