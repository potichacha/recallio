notion: string-immuabilite
lesson: |-
  Une `String` ne change **jamais** après sa création. Toute méthode qui semble la modifier (`toUpperCase`, `replace`,
  `trim`, `concat`) renvoie une **nouvelle** chaîne.

  ```java
  String s = "java";
  s.toUpperCase();          // résultat perdu : s vaut toujours "java"
  s = s.toUpperCase();      // s désigne maintenant une NOUVELLE chaîne "JAVA"

  String a = "x";
  String b = a;
  a += "y";                 // a désigne "xy" ; b désigne toujours "x"
  ```

  Pourquoi ce choix :
  - **sécurité** : un nom de fichier, une URL ou un nom de classe validé ne peut pas changer après la vérification ;
  - **partage sans risque** : le pool de chaînes peut donner le même objet à tout le monde, et les threads le lisent
    sans synchronisation ;
  - **hachage mis en cache** : `hashCode()` est calculé une fois, ce qui fait de `String` une clé de `HashMap` rapide
    et sûre.

  Le prix : chaque « modification » crée un objet. Pour construire un texte morceau par morceau, on utilise
  `StringBuilder`.

  **Piège classique** : croire qu'une méthode qui reçoit une `String` peut la modifier pour l'appelant. Elle ne peut
  que réaffecter sa propre variable locale ; il faut **renvoyer** la nouvelle chaîne.

  **En entretien** : « `String` est immuable pour la sécurité, le partage entre threads et le pool, et pour mettre en
  cache son `hashCode` ; ses méthodes renvoient de nouvelles chaînes. »
tour:
  - title: Une String ne change pas
    text: |-
      Une `String` est **immuable** : aucune méthode ne la modifie. `toUpperCase()` ou `replace()` renvoient une
      **nouvelle** chaîne, et l'originale reste intacte ; si l'on n'affecte pas le résultat, il est perdu.

      L'immuabilité rend les chaînes sûres à partager entre objets et entre threads, et permet à la JVM de réutiliser
      les littéraux identiques. Elle a un coût : concaténer dans une boucle crée une chaîne à chaque tour.
    example:
      files:
        Main.java: |-
          void main() {
              String nom = "ada";
              nom.toUpperCase();
              IO.println(nom);
              String majuscules = nom.toUpperCase();
              IO.println(majuscules + " " + nom);
          }
      output: |-
        ada
        ADA ada
    task:
      instructions: |-
        Ce programme veut afficher `BONJOUR`, mais il affiche `bonjour`. Corrige-le.
      starter:
        Main.java: |-
          void main() {
              String salut = "bonjour";
              salut.toUpperCase();
              IO.println(salut);
          }
      solution:
        Main.java: |-
          void main() {
              String salut = "bonjour";
              salut = salut.toUpperCase();
              IO.println(salut);
          }
      output: |-
        BONJOUR
cards:
  - key: string-immutable
    format: course
    question: "Pourquoi `String` est-elle immuable ?"
    choices:
      - {text: "Pour la sécurité, la sûreté entre threads et le partage dans le pool de chaînes", correct: true}
      - {text: "Pour accélérer la concaténation en boucle avec l'opérateur `+`", correct: false}
      - {text: "Pour que le GC puisse libérer une chaîne dès sa dernière lecture", correct: false}
      - {text: "Pour que deux chaînes égales aient toujours la même référence", correct: false}
    answer: "Sécurité (une valeur vérifiée ne change plus), sûreté entre threads sans synchronisation, et partage via le pool de chaînes. La concaténation en boucle, elle, devient coûteuse."
  - key: hash-cache
    format: course
    question: Quel avantage l'immuabilité donne-t-elle à `String` comme clé de `HashMap` ?
    choices:
      - {text: "Son hash ne change pas après l'insertion, et il est calculé une seule fois", correct: true}
      - {text: "Ses clés sont triées, ce qui accélère la recherche dans la `HashMap`", correct: false}
      - {text: "Deux chaînes égales partagent alors toujours la même référence", correct: false}
      - {text: "Son hash vaut toujours zéro, ce qui supprime les collisions", correct: false}
    answer: Son hash ne peut pas changer après l'insertion, et il est calculé une seule fois puis mis en cache dans l'objet.
  - key: methodes-nouvelles
    format: course
    question: Que fait `s.replace("a", "b")` sur la chaîne `s` ?
    choices:
      - {text: "Rien : elle renvoie une nouvelle chaîne, et `s` reste identique", correct: true}
      - {text: "Elle remplace les `a` par des `b` directement dans `s`", correct: false}
      - {text: "Elle remplace seulement le premier `a` de `s`", correct: false}
      - {text: "Elle lève une exception : une `String` ne se modifie pas", correct: false}
    answer: "Rien : elle renvoie une nouvelle chaîne, et `s` reste identique."
  - key: cout
    format: course
    question: Quel est le coût de l'immuabilité de `String` ?
    choices:
      - {text: "Chaque transformation crée un nouvel objet : on assemble avec un `StringBuilder`", correct: true}
      - {text: "Une chaîne immuable ne peut pas dépasser 64 Ko en mémoire", correct: false}
      - {text: "Une chaîne immuable ne peut pas être partagée entre threads", correct: false}
      - {text: "Chaque lecture d'un caractère recopie toute la chaîne", correct: false}
    answer: Chaque transformation crée un nouvel objet ; pour assembler beaucoup de morceaux, on utilise `StringBuilder`.
  - key: vf-modifie
    format: true-false
    question: "`s.trim()` retire les espaces de la chaîne `s`."
    truth: false
    answer: Elle renvoie une nouvelle chaîne sans espaces ; `s` ne change pas.
  - key: vf-reaffectation
    format: true-false
    question: Après `s = s + "!";`, l'objet chaîne d'origine a été modifié.
    truth: false
    answer: '`s` désigne un nouvel objet ; l''ancien est intact (et récupérable par le GC s''il n''est plus référencé).'
  - key: vf-thread-safe
    format: true-false
    question: Une `String` peut être partagée entre threads sans synchronisation.
    truth: true
    answer: Elle est immuable.
  - key: vf-final
    format: true-false
    question: "On ne peut pas créer de sous-classe de `String`, déclarée `final`."
    truth: true
    answer: Une sous-classe ne peut donc pas casser son immuabilité.
  - key: qcm-raisons
    format: multiple-choice
    question: "Lequel de ces bénéfices l'immuabilité de `String` apporte-t-elle ?"
    choices:
      - {text: "La mise en cache du hash", correct: true}
      - {text: "Une concaténation en boucle rapide", correct: false}
      - {text: "La modification d'une chaîne sans copie", correct: false}
      - {text: "Des chaînes ignorées par le GC", correct: false}
    answer: "Immuable, une chaîne peut mettre son hash en cache, être partagée dans le pool, et rester sûre une fois vérifiée. La concaténation en boucle, au contraire, devient coûteuse."
  - key: qcm-resultat
    format: multiple-choice
    question: "Que vaut `s` après `String s = \"abc\"; s.toUpperCase();` ?"
    choices:
      - text: "\"abc\""
        correct: true
      - text: "\"ABC\""
        correct: false
      - text: "null"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Le résultat n'a pas été récupéré.
  - key: qcm-alias
    format: multiple-choice
    question: "Que vaut `t` après `String s = \"a\"; String t = s; s = s + \"b\";` ?"
    choices:
      - text: "\"a\""
        correct: true
      - text: "\"ab\""
        correct: false
      - text: "\"b\""
        correct: false
      - text: "null"
        correct: false
    answer: '`s` désigne une nouvelle chaîne ; `t` désigne toujours l''ancienne.'
  - key: qcm-mutable
    format: multiple-choice
    question: Quel type utiliser pour modifier un texte sur place ?
    choices:
      - text: "`StringBuilder`"
        correct: true
      - text: "`String`"
        correct: false
      - text: "`CharSequence`"
        correct: false
      - text: "`final String`"
        correct: false
    answer: '`StringBuilder` est la version mutable, sans synchronisation.'
  - key: code-string-hello-touppercase-system-out
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String t = "hello";
      t.toUpperCase();
      System.out.println(t);
      ```
    choices:
      - {text: "`hello`", correct: true}
      - {text: "`HELLO`", correct: false}
      - {text: "`Hello`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: '`hello` : String est immuable et le résultat n''a pas été récupéré.'
    check:
      code: |-
        String t = "hello"; t.toUpperCase(); System.out.println(t);
      output: "hello"
  - key: code-alias
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = "a";
      String t = s;
      s += "b";
      System.out.println(s + " " + t);
      ```
    choices:
      - {text: "`ab a`", correct: true}
      - {text: "`ab ab`", correct: false}
      - {text: "`a a`", correct: false}
      - {text: "`a ab`", correct: false}
    answer: '`ab a` : `+=` crée une nouvelle chaîne pour `s`, `t` garde l''ancienne.'
    check:
      output: "ab a"
  - key: code-trim
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = " x ";
      s.trim();
      System.out.println("[" + s + "]" + "[" + s.trim() + "]");
      ```
    choices:
      - {text: "`[ x ][x]`", correct: true}
      - {text: "`[x][x]`", correct: false}
      - {text: "`[ x ][ x ]`", correct: false}
      - {text: "`[x][ x ]`", correct: false}
    answer: '`[ x ][x]` : seul le résultat de `trim()` est sans espaces.'
    check:
      output: "[ x ][x]"
  - key: code-methode
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void crier(String s) { s = s.toUpperCase() + "!"; }
      String mot = "salut";
      crier(mot);
      System.out.println(mot);
      ```
    choices:
      - {text: "`salut`", correct: true}
      - {text: "`SALUT!`", correct: false}
      - {text: "`SALUT`", correct: false}
      - {text: "`salut!`", correct: false}
    answer: '`salut` : la méthode réaffecte sa copie de la référence, la chaîne de l''appelant ne change pas.'
    check:
      output: "salut"
  - key: bug-methode-sans-retour
    format: bug-fix
    question: |-
      Le titre n'est jamais normalisé :
      ```java
      void normaliser(String titre) {
          titre = titre.strip().toLowerCase(Locale.ROOT);
      }
      normaliser(article.titre);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renvoyer la chaîne normalisée et l'affecter : `article.titre = normaliser(article.titre)`", correct: true}
      - {text: "Déclarer le paramètre `titre` en `final`, pour que l'affectation soit conservée", correct: false}
      - {text: "Appeler `titre.intern()` à la fin de la méthode, pour enregistrer le résultat", correct: false}
      - {text: "Remplacer `strip()` par `trim()`, qui modifie la chaîne en place", correct: false}
    answer: |-
      ```java
      String normaliser(String titre) {
          return titre.strip().toLowerCase(Locale.ROOT);
      }
      article.titre = normaliser(article.titre);
      ```
      Une `String` ne peut pas être modifiée, et réaffecter le paramètre ne touche pas l'appelant : on renvoie la nouvelle
      chaîne.
  - key: bug-concat-ignore
    format: bug-fix
    question: |-
      Le suffixe n'apparaît jamais :
      ```java
      String nom = "rapport";
      nom.concat(".pdf");
      sauvegarder(nom);
      ```
      Pourquoi ?
    choices:
      - {text: "`concat` renvoie une nouvelle chaîne, ignorée ici ; `nom` ne change pas", correct: true}
      - {text: "`concat` ne modifie que les chaînes créées avec `new String`", correct: false}
      - {text: "`sauvegarder` reçoit une copie de `nom` faite avant le `concat`", correct: false}
      - {text: "`concat` range le résultat dans le pool, pas dans `nom`", correct: false}
    answer: "`concat` renvoie une nouvelle chaîne ; l'originale ne change pas. La correction : `String nom = \"rapport\".concat(\".pdf\");`."
  - key: bug-mot-de-passe
    format: bug-fix
    question: |-
      Un audit de sécurité signale que les mots de passe restent lisibles dans un vidage mémoire :
      ```java
      String motDePasse = new String(console.readPassword());
      verifier(motDePasse);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Garder le `char[]` de `readPassword`, et l'effacer avec `Arrays.fill` après usage", correct: true}
      - {text: "Affecter `null` à `motDePasse` juste après l'appel à `verifier`", correct: false}
      - {text: "Appeler `System.gc()` juste après la vérification du mot de passe", correct: false}
      - {text: "Appeler `motDePasse.intern()`, pour le ranger à part dans le pool", correct: false}
    answer: |-
      ```java
      char[] motDePasse = console.readPassword();
      try {
          verifier(motDePasse);
      } finally {
          Arrays.fill(motDePasse, '\0');
      }
      ```
      Une `String` immuable ne peut pas être effacée : elle reste en mémoire jusqu'au passage du GC. Un `char[]` se vide
      dès qu'on n'en a plus besoin (c'est pourquoi `readPassword` renvoie un tableau).
  - key: bug-boucle-plus
    format: bug-fix
    question: |-
      Ce code est très lent pour 100 000 identifiants :
      ```java
      String csv = "";
      for (String id : ids) {
          csv += id + ";";
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`String csv = String.join(\";\", ids);`", correct: true}
      - {text: "`csv = csv.concat(id + \";\")` dans la boucle", correct: false}
      - {text: "`csv += String.format(\"%s;\", id)` dans la boucle", correct: false}
      - {text: "`csv = (csv + id + \";\").intern()` dans la boucle", correct: false}
    answer: |-
      ```java
      String csv = String.join(";", ids);
      ```
      Chaque `+=` recopie toute la chaîne accumulée dans un nouvel objet : le coût devient quadratique. `String.join` (ou
      un `StringBuilder`) n'ajoute que les morceaux nouveaux.
