notion: heure-ete
lesson: |-
  Deux fois par an, dans les fuseaux à heure d'été, l'heure locale saute :

  - au printemps, un **trou** (*gap*) : à Paris, le 30 mars 2025, on passe de 2 h à 3 h. **2 h 30 n'existe pas** ;
  - à l'automne, un **chevauchement** (*overlap*) : le 26 octobre 2025, on revient de 3 h à 2 h. **2 h 30 existe deux
    fois** (à +02:00, puis à +01:00).

  ```java
  ZoneId paris = ZoneId.of("Europe/Paris");

  ZonedDateTime.of(2025, 3, 30, 2, 30, 0, 0, paris);      // 03:30+02:00 : décalé après le trou
  ZonedDateTime z = ZonedDateTime.of(2025, 10, 26, 2, 30, 0, 0, paris);
  z.getOffset();                                           // +02:00 : la première occurrence par défaut
  z.withLaterOffsetAtOverlap().getOffset();                // +01:00 : la seconde

  LocalDate.of(2025, 3, 30).atStartOfDay(paris);           // ce jour-là ne dure que 23 heures
  ```

  Conséquences pratiques :
  - une tâche planifiée à **2 h 30, heure locale**, saute une exécution au printemps et peut s'exécuter deux fois à
    l'automne : on évite cette plage, ou l'on planifie en UTC ;
  - une durée calculée entre deux `LocalDateTime` est fausse d'une heure si elle traverse un changement : on passe par
    `ZonedDateTime` ou `Instant` ;
  - un jour ne dure pas toujours 24 heures : `plusDays(1)` et `plus(Duration.ofHours(24))` diffèrent ;
  - les règles des fuseaux changent (décisions politiques) : la JVM embarque une base *tzdata*, à tenir à jour.

  **Piège classique** : calculer les heures travaillées d'une nuit d'automne avec des `LocalDateTime`. Il manque une
  heure de paie.

  **En entretien** : « Au printemps une heure locale n'existe pas, à l'automne elle existe deux fois ; on calcule les
  durées sur des instants, et on évite de planifier entre 2 h et 3 h. »
cards:
  - key: trou
    format: course
    question: Que se passe-t-il pour `ZonedDateTime.of(2025, 3, 30, 2, 30, ..., Europe/Paris)` ?
    choices:
      - {text: "2 h 30 n'existe pas ce jour-là : Java la décale et donne 3 h 30 (+02:00)", correct: true}
      - {text: "Java lève une `DateTimeException`, puisque l'heure n'existe pas", correct: false}
      - {text: "Java garde 2 h 30, avec le décalage d'hiver (+01:00)", correct: false}
      - {text: "Java recule avant le trou et donne 1 h 30 (+01:00)", correct: false}
    answer: 2 h 30 n'existe pas ce jour-là (on passe de 2 h à 3 h) ; Java décale l'heure de la durée du trou et donne 3 h 30 (+02:00).
  - key: chevauchement
    format: course
    question: Que se passe-t-il à 2 h 30 le 26 octobre 2025 à Paris ?
    choices:
      - {text: "Cette heure existe deux fois ; Java prend la première (+02:00) par défaut", correct: true}
      - {text: "Cette heure existe deux fois ; Java prend la seconde (+01:00) par défaut", correct: false}
      - {text: "Cette heure existe deux fois ; Java lève une exception d'ambiguïté", correct: false}
      - {text: "Cette heure n'existe pas ; Java la décale d'une heure, à 3 h 30", correct: false}
    answer: Cette heure existe deux fois, à +02:00 puis à +01:00 ; Java choisit la première par défaut, et `withLaterOffsetAtOverlap()` donne la seconde.
  - key: duree-jour
    format: course
    question: Combien d'heures durent les jours de changement d'heure à Paris ?
    choices:
      - {text: "23 heures au printemps, 25 heures à l'automne", correct: true}
      - {text: "25 heures au printemps, 23 heures à l'automne", correct: false}
      - {text: "24 heures : seule l'heure affichée change", correct: false}
      - {text: "23 heures aux deux changements d'heure", correct: false}
    answer: 23 heures au printemps, 25 heures à l'automne.
  - key: tzdata
    format: course
    question: Pourquoi faut-il mettre à jour la base des fuseaux de la JVM ?
    choices:
      - {text: "Les pays changent leurs règles d'heure d'été, que la JVM lit dans sa base *tzdata*", correct: true}
      - {text: "La base des fuseaux expire au bout d'un an et bloque alors les conversions", correct: false}
      - {text: "Elle contient les secondes intercalaires, sans lesquelles `Instant` dérive", correct: false}
      - {text: "Elle fixe le fuseau par défaut de la JVM, qui change avec chaque version", correct: false}
    answer: Les pays changent leurs règles d'heure d'été ; la JVM les connaît par sa base *tzdata*, mise à jour avec les versions du JDK (ou l'outil `tzupdater`).
  - key: vf-unique
    format: true-false
    question: Toute heure locale existe exactement une fois par jour.
    truth: false
    answer: Certaines n'existent pas (au printemps), d'autres existent deux fois (à l'automne).
  - key: vf-24h
    format: true-false
    question: Un jour dure toujours 24 heures dans un fuseau à heure d'été.
    truth: false
    answer: 23 ou 25 heures les jours de changement.
  - key: vf-instant
    format: true-false
    question: Les instants (`Instant`) ne sont pas affectés par l'heure d'été.
    truth: true
    answer: L'heure d'été ne change que la représentation locale ; la ligne du temps UTC est continue.
  - key: vf-defaut-overlap
    format: true-false
    question: Dans un chevauchement, Java choisit par défaut le décalage le plus ancien.
    truth: true
    answer: La première occurrence (ici +02:00) ; `withLaterOffsetAtOverlap` choisit l'autre.
  - key: qcm-planifier
    format: multiple-choice
    question: À quelle heure locale planifier une sauvegarde quotidienne à Paris pour éviter les surprises ?
    choices:
      - {text: "Hors de la plage 2 h - 3 h, par exemple à 4 h", correct: true}
      - {text: "À 2 h 30, au milieu de la nuit, quand rien ne tourne", correct: false}
      - {text: "À 2 h 00 pile, juste avant le changement d'heure", correct: false}
      - {text: "N'importe quand : `java.time` gère seul l'heure d'été", correct: false}
    answer: Dans la plage 2 h - 3 h, une exécution peut sauter ou se répéter.
  - key: qcm-duree-nuit
    format: multiple-choice
    question: "Laquelle de ces méthodes calcule correctement la durée d'un service de nuit du 25 octobre 22 h au 26 octobre 6 h (Paris) ?"
    choices:
      - {text: "`Duration.between` sur deux `ZonedDateTime` du fuseau `Europe/Paris`", correct: true}
      - {text: "`Duration.between` sur deux `OffsetDateTime` à `+01:00`", correct: false}
      - {text: "`Duration.between` sur deux `LocalDateTime`", correct: false}
      - {text: "`6 + 24 - 22` heures", correct: false}
    answer: "Le service dure 9 heures, à cause de l'heure regagnée : il faut les vrais décalages, ceux du fuseau (ou deux `Instant`). Des heures locales ou un décalage fixe donnent 8."
  - key: qcm-garder-heure
    format: multiple-choice
    question: "Pour une réunion quotidienne à 9 h, que faut-il ajouter pour passer au jour suivant ?"
    choices:
      - text: "`plusDays(1)` sur un `ZonedDateTime`"
        correct: true
      - text: "`plus(Duration.ofHours(24))`"
        correct: false
      - text: "`plusSeconds(86_400)`"
        correct: false
      - text: "`plusHours(24)`"
        correct: false
    answer: "`plusDays` garde l'heure locale ; les trois autres ajoutent 24 heures exactes et décalent la réunion le jour du changement d'heure."
  - key: qcm-stocker
    format: multiple-choice
    question: "Lequel de ces formats stocke l'horodatage d'un événement sans aucune ambiguïté ?"
    choices:
      - {text: "Un `Instant` (UTC)", correct: true}
      - {text: "Une `LocalDateTime` à l'heure de Paris", correct: false}
      - {text: "Un texte `dd/MM/yyyy HH:mm`", correct: false}
      - {text: "Une `LocalDate` et une `LocalTime` de Paris", correct: false}
    answer: "Un `Instant` (ou un `OffsetDateTime`, qui garde le décalage) désigne un seul moment. Sans décalage, 2 h 30 le 26 octobre à Paris désigne deux instants."
  - key: code-trou
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      ZonedDateTime z = ZonedDateTime.of(2025, 3, 30, 2, 30, 0, 0, ZoneId.of("Europe/Paris"));
      System.out.println(z.toLocalTime() + " " + z.getOffset());
      ```
    choices:
      - {text: "`03:30 +02:00`", correct: true}
      - {text: "`02:30 +01:00`", correct: false}
      - {text: "`03:30 +01:00`", correct: false}
      - {text: "`01:30 +01:00`", correct: false}
    answer: '`03:30 +02:00` : l''heure inexistante est décalée après le trou.'
    check:
      output: "03:30 +02:00"
  - key: code-chevauchement
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      ZonedDateTime z = ZonedDateTime.of(2025, 10, 26, 2, 30, 0, 0, ZoneId.of("Europe/Paris"));
      System.out.println(z.getOffset() + " " + z.withLaterOffsetAtOverlap().getOffset());
      ```
    choices:
      - {text: "`+02:00 +01:00`", correct: true}
      - {text: "`+01:00 +02:00`", correct: false}
      - {text: "`+02:00 +02:00`", correct: false}
      - {text: "`+01:00 +01:00`", correct: false}
    answer: '`+02:00 +01:00` : 2 h 30 existe deux fois cette nuit-là.'
    check:
      output: "+02:00 +01:00"
  - key: code-jour-23h
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      ZoneId paris = ZoneId.of("Europe/Paris");
      ZonedDateTime debut = LocalDate.of(2025, 3, 30).atStartOfDay(paris);
      System.out.println(Duration.between(debut, debut.plusDays(1)).toHours());
      ```
    choices:
      - {text: "`23`", correct: true}
      - {text: "`24`", correct: false}
      - {text: "`25`", correct: false}
      - {text: "`22`", correct: false}
    answer: '`23` : le jour du passage à l''heure d''été dure 23 heures.'
    check:
      output: "23"
  - key: code-regles
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      var regles = ZoneId.of("Europe/Paris").getRules();
      System.out.println(regles.isDaylightSavings(Instant.parse("2025-07-01T00:00:00Z")) + " "
              + regles.isDaylightSavings(Instant.parse("2025-01-01T00:00:00Z")));
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false true`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
    answer: '`true false` : l''heure d''été s''applique en juillet, pas en janvier.'
    check:
      output: "true false"
  - key: bug-heures-travaillees
    format: bug-fix
    question: |-
      La nuit du changement d'heure d'automne, les infirmiers sont payés une heure de moins :
      ```java
      long heures = Duration.between(debutService, finService).toHours();   // deux LocalDateTime
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Placer les deux `LocalDateTime` dans `Europe/Paris` avant le `Duration.between`", correct: true}
      - {text: "Placer les deux `LocalDateTime` à `ZoneOffset.of(\"+01:00\")` avant le calcul", correct: false}
      - {text: "Ajouter une heure au résultat pour tout service effectué en octobre", correct: false}
      - {text: "Calculer en minutes plutôt qu'en heures, pour ne rien perdre à l'arrondi", correct: false}
    answer: |-
      ```java
      ZoneId paris = ZoneId.of("Europe/Paris");
      long heures = Duration.between(debutService.atZone(paris), finService.atZone(paris)).toHours();
      ```
      Entre deux `LocalDateTime`, Java ignore le changement d'heure. En les plaçant dans leur fuseau, la durée réelle
      (une heure de plus cette nuit-là) est comptée. (Pour la nuit de 2 h 30 ambiguë, il faut aussi choisir le
      décalage.)
  - key: bug-tache-2h30
    format: bug-fix
    question: |-
      La purge quotidienne ne s'est pas exécutée le 30 mars, et deux fois le 26 octobre :
      ```java
      @Scheduled(cron = "0 30 2 * * ?")   // 2 h 30 heure de Paris
      void purger() { ... }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Planifier hors de la plage 2 h - 3 h (4 h 30), et rendre la tâche idempotente", correct: true}
      - {text: "Planifier à 2 h 00 pile, juste avant que l'heure ne change", correct: false}
      - {text: "Garder 2 h 30, et relancer la purge à la main les jours de changement", correct: false}
      - {text: "Garder 2 h 30, mais désactiver la tâche les jours de changement d'heure", correct: false}
    answer: |-
      ```java
      @Scheduled(cron = "0 30 4 * * ?")   // 4 h 30, hors de la plage du changement d'heure
      void purger() { ... }
      ```
      À 2 h 30, l'heure locale n'existe pas au printemps et existe deux fois à l'automne. On planifie hors de la plage
      2 h - 3 h (ou en UTC), et la tâche doit de toute façon supporter une double exécution (idempotence).
  - key: bug-plus-24h
    format: bug-fix
    question: |-
      Le rappel quotidien de 8 h arrive à 9 h après le passage à l'heure d'été :
      ```java
      ZonedDateTime suivant = precedent.plusHours(24);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`precedent.plusDays(1)`", correct: true}
      - {text: "`precedent.plus(Duration.ofDays(1))`", correct: false}
      - {text: "`precedent.plusSeconds(86_400)`", correct: false}
      - {text: "`precedent.plusHours(23)`", correct: false}
    answer: |-
      ```java
      ZonedDateTime suivant = precedent.plusDays(1);
      ```
      `plusHours(24)` ajoute 24 heures exactes, alors que le jour du changement n'en dure que 23. `plusDays(1)` garde
      l'heure locale.
  - key: bug-local-horodatage
    format: bug-fix
    question: |-
      Deux paiements enregistrés à « 2025-10-26T02:30 » ne peuvent pas être départagés :
      ```java
      paiement.setHorodatage(LocalDateTime.now(clock.withZone(ZoneId.of("Europe/Paris"))));
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`paiement.setHorodatage(Instant.now(clock));`", correct: true}
      - {text: "`paiement.setHorodatage(LocalDateTime.now());`", correct: false}
      - {text: "Enregistrer aussi les millisecondes, pour départager", correct: false}
      - {text: "Arrondir l'horodatage à la minute la plus proche", correct: false}
    answer: |-
      ```java
      paiement.setHorodatage(Instant.now(clock));
      ```
      Pendant le chevauchement d'automne, cette heure locale correspond à deux instants. Un `Instant` (ou un
      `OffsetDateTime`) enregistre le moment sans ambiguïté.
