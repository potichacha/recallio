notion: heure-ete
lesson: |-
  Deux fois par an, dans les fuseaux à heure d'été, l'heure locale saute :

  - au printemps, un **trou** (*gap*) : à Paris, le 30 mars 2025, on passe de 2 h à 3 h. **2 h 30 n'existe pas** ;
  - à l'automne, un **chevauchement** (*overlap*) : le 26 octobre 2025, on revient de 3 h à 2 h. **2 h 30 existe deux
    fois** (à +02:00, puis à +01:00).

  ```java
  ZoneId paris = ZoneId.of("Europe/Paris");

  ZonedDateTime.of(2025, 3, 30, 2, 30, 0, 0, paris);      // 03:30+02:00 : décalé après le trou
  ZonedDateTime z = ZonedDateTime.of(2025, 10, 26, 2, 30, 0, 0, paris);
  z.getOffset();                                           // +02:00 : la première occurrence par défaut
  z.withLaterOffsetAtOverlap().getOffset();                // +01:00 : la seconde

  LocalDate.of(2025, 3, 30).atStartOfDay(paris);           // ce jour-là ne dure que 23 heures
  ```

  Conséquences pratiques :
  - une tâche planifiée à **2 h 30, heure locale**, saute une exécution au printemps et peut s'exécuter deux fois à
    l'automne : on évite cette plage, ou l'on planifie en UTC ;
  - une durée calculée entre deux `LocalDateTime` est fausse d'une heure si elle traverse un changement : on passe par
    `ZonedDateTime` ou `Instant` ;
  - un jour ne dure pas toujours 24 heures : `plusDays(1)` et `plus(Duration.ofHours(24))` diffèrent ;
  - les règles des fuseaux changent (décisions politiques) : la JVM embarque une base *tzdata*, à tenir à jour.

  **Piège classique** : calculer les heures travaillées d'une nuit d'automne avec des `LocalDateTime`. Il manque une
  heure de paie.

  **En entretien** : « Au printemps une heure locale n'existe pas, à l'automne elle existe deux fois ; on calcule les
  durées sur des instants, et on évite de planifier entre 2 h et 3 h. »
cards:
  - key: trou
    format: course
    question: Que se passe-t-il pour `ZonedDateTime.of(2025, 3, 30, 2, 30, ..., Europe/Paris)` ?
    answer: 2 h 30 n'existe pas ce jour-là (on passe de 2 h à 3 h) ; Java décale l'heure de la durée du trou et donne 3 h 30 (+02:00).
  - key: chevauchement
    format: course
    question: Que se passe-t-il à 2 h 30 le 26 octobre 2025 à Paris ?
    answer: Cette heure existe deux fois, à +02:00 puis à +01:00 ; Java choisit la première par défaut, et `withLaterOffsetAtOverlap()` donne la seconde.
  - key: duree-jour
    format: course
    question: Combien d'heures durent les jours de changement d'heure à Paris ?
    answer: 23 heures au printemps, 25 heures à l'automne.
  - key: tzdata
    format: course
    question: Pourquoi faut-il mettre à jour la base des fuseaux de la JVM ?
    answer: Les pays changent leurs règles d'heure d'été ; la JVM les connaît par sa base *tzdata*, mise à jour avec les versions du JDK (ou l'outil `tzupdater`).
  - key: vf-unique
    format: true-false
    question: Toute heure locale existe exactement une fois par jour.
    truth: false
    answer: Certaines n'existent pas (au printemps), d'autres existent deux fois (à l'automne).
  - key: vf-24h
    format: true-false
    question: Un jour dure toujours 24 heures dans un fuseau à heure d'été.
    truth: false
    answer: 23 ou 25 heures les jours de changement.
  - key: vf-instant
    format: true-false
    question: Les instants (`Instant`) ne sont pas affectés par l'heure d'été.
    truth: true
    answer: L'heure d'été ne change que la représentation locale ; la ligne du temps UTC est continue.
  - key: vf-defaut-overlap
    format: true-false
    question: Dans un chevauchement, Java choisit par défaut le décalage le plus ancien.
    truth: true
    answer: La première occurrence (ici +02:00) ; `withLaterOffsetAtOverlap` choisit l'autre.
  - key: qcm-planifier
    format: multiple-choice
    question: À quelle heure locale planifier une sauvegarde quotidienne à Paris pour éviter les surprises ?
    choices:
      - text: "Hors de la plage 2 h - 3 h, par exemple à 4 h"
        correct: true
      - text: "À 2 h 30"
        correct: false
      - text: "À 2 h 00 pile"
        correct: false
      - text: "Peu importe"
        correct: false
    answer: Dans la plage 2 h - 3 h, une exécution peut sauter ou se répéter.
  - key: qcm-duree-nuit
    format: multiple-choice
    question: "Comment calculer correctement la durée d'un service de nuit du 25 octobre 22 h au 26 octobre 6 h (Paris) ?"
    choices:
      - text: "`Duration.between` sur deux `ZonedDateTime` du fuseau `Europe/Paris`"
        correct: true
      - text: "`Duration.between` sur deux `Instant`"
        correct: true
      - text: "`Duration.between` sur deux `LocalDateTime`"
        correct: false
      - text: "`6 + 24 - 22` heures"
        correct: false
    answer: Le service dure 9 heures, à cause de l'heure regagnée ; un calcul sur des heures locales donne 8.
  - key: qcm-garder-heure
    format: multiple-choice
    question: Pour un rendez-vous quotidien à 9 h, que faut-il ajouter pour passer au jour suivant ?
    choices:
      - text: "`plusDays(1)` sur un `ZonedDateTime`"
        correct: true
      - text: "`plus(Duration.ofHours(24))`"
        correct: false
      - text: "`plusSeconds(86_400)`"
        correct: false
      - text: "`plusHours(24)`"
        correct: false
    answer: '`plusDays` garde l''heure locale ; les trois autres ajoutent 24 heures exactes et décalent le rendez-vous le jour du changement.'
  - key: qcm-stocker
    format: multiple-choice
    question: Comment stocker l'horodatage d'événements pour qu'il ne soit jamais ambigu ?
    choices:
      - text: "En `Instant` (UTC)"
        correct: true
      - text: "En `OffsetDateTime`, avec le décalage"
        correct: true
      - text: "En `LocalDateTime` à l'heure de Paris"
        correct: false
      - text: "En texte `dd/MM/yyyy HH:mm`"
        correct: false
    answer: Sans décalage, 2 h 30 le 26 octobre désigne deux instants.
  - key: code-trou
    format: code-output
    question: |-
      ```java
      import java.time.*;
      ZonedDateTime z = ZonedDateTime.of(2025, 3, 30, 2, 30, 0, 0, ZoneId.of("Europe/Paris"));
      System.out.println(z.toLocalTime() + " " + z.getOffset());
      ```
    answer: '`03:30 +02:00` : l''heure inexistante est décalée après le trou.'
    check:
      output: "03:30 +02:00"
  - key: code-chevauchement
    format: code-output
    question: |-
      ```java
      import java.time.*;
      ZonedDateTime z = ZonedDateTime.of(2025, 10, 26, 2, 30, 0, 0, ZoneId.of("Europe/Paris"));
      System.out.println(z.getOffset() + " " + z.withLaterOffsetAtOverlap().getOffset());
      ```
    answer: '`+02:00 +01:00` : 2 h 30 existe deux fois cette nuit-là.'
    check:
      output: "+02:00 +01:00"
  - key: code-jour-23h
    format: code-output
    question: |-
      ```java
      import java.time.*;
      ZoneId paris = ZoneId.of("Europe/Paris");
      ZonedDateTime debut = LocalDate.of(2025, 3, 30).atStartOfDay(paris);
      System.out.println(Duration.between(debut, debut.plusDays(1)).toHours());
      ```
    answer: '`23` : le jour du passage à l''heure d''été dure 23 heures.'
    check:
      output: "23"
  - key: code-regles
    format: code-output
    question: |-
      ```java
      import java.time.*;
      var regles = ZoneId.of("Europe/Paris").getRules();
      System.out.println(regles.isDaylightSavings(Instant.parse("2025-07-01T00:00:00Z")) + " "
              + regles.isDaylightSavings(Instant.parse("2025-01-01T00:00:00Z")));
      ```
    answer: '`true false` : l''heure d''été s''applique en juillet, pas en janvier.'
    check:
      output: "true false"
  - key: bug-heures-travaillees
    format: bug-fix
    question: |-
      La nuit du changement d'heure d'automne, les infirmiers sont payés une heure de moins :
      ```java
      long heures = Duration.between(debutService, finService).toHours();   // deux LocalDateTime
      ```
    answer: |-
      ```java
      ZoneId paris = ZoneId.of("Europe/Paris");
      long heures = Duration.between(debutService.atZone(paris), finService.atZone(paris)).toHours();
      ```
      Entre deux `LocalDateTime`, Java ignore le changement d'heure. En les plaçant dans leur fuseau, la durée réelle
      (une heure de plus cette nuit-là) est comptée. (Pour la nuit de 2 h 30 ambiguë, il faut aussi choisir le
      décalage.)
  - key: bug-tache-2h30
    format: bug-fix
    question: |-
      La purge quotidienne ne s'est pas exécutée le 30 mars, et deux fois le 26 octobre :
      ```java
      @Scheduled(cron = "0 30 2 * * ?")   // 2 h 30 heure de Paris
      void purger() { ... }
      ```
    answer: |-
      ```java
      @Scheduled(cron = "0 30 4 * * ?")   // 4 h 30, hors de la plage du changement d'heure
      void purger() { ... }
      ```
      À 2 h 30, l'heure locale n'existe pas au printemps et existe deux fois à l'automne. On planifie hors de la plage
      2 h - 3 h (ou en UTC), et la tâche doit de toute façon supporter une double exécution (idempotence).
  - key: bug-plus-24h
    format: bug-fix
    question: |-
      Le rappel quotidien de 8 h arrive à 9 h après le passage à l'heure d'été :
      ```java
      ZonedDateTime suivant = precedent.plusHours(24);
      ```
    answer: |-
      ```java
      ZonedDateTime suivant = precedent.plusDays(1);
      ```
      `plusHours(24)` ajoute 24 heures exactes, alors que le jour du changement n'en dure que 23. `plusDays(1)` garde
      l'heure locale.
  - key: bug-local-horodatage
    format: bug-fix
    question: |-
      Deux paiements enregistrés à « 2025-10-26T02:30 » ne peuvent pas être départagés :
      ```java
      paiement.setHorodatage(LocalDateTime.now(clock.withZone(ZoneId.of("Europe/Paris"))));
      ```
    answer: |-
      ```java
      paiement.setHorodatage(Instant.now(clock));
      ```
      Pendant le chevauchement d'automne, cette heure locale correspond à deux instants. Un `Instant` (ou un
      `OffsetDateTime`) enregistre le moment sans ambiguïté.
