notion: string-bases
lesson: |-
  `String` représente un texte : une suite de `char` (unités UTF-16), **immuable**. On la crée le plus souvent par un
  littéral : `String nom = "Ada";`.

  | Méthode | Rôle | Exemple avec `s = "Bonjour"` |
  |---|---|---|
  | `length()` | nombre de `char` | `7` |
  | `charAt(i)` | caractère à l'indice `i` (à partir de 0) | `charAt(0)` → `'B'` |
  | `substring(debut, fin)` | de `debut` inclus à `fin` **exclu** | `substring(1, 3)` → `"on"` |
  | `indexOf(x)` | première position, ou **-1** | `indexOf("jour")` → `3` |
  | `contains`, `startsWith`, `endsWith` | tests | `startsWith("Bon")` → `true` |
  | `replace(a, b)` | remplace toutes les occurrences (sans regex) | `replace("o", "0")` → `"B0nj0ur"` |
  | `toUpperCase()`, `toLowerCase()` | changer la casse | `"BONJOUR"` |
  | `isEmpty()`, `isBlank()` | vide, ou seulement des espaces | |

  - Les indices vont de `0` à `length() - 1` ; hors limites : `StringIndexOutOfBoundsException`.
  - Toutes les méthodes « de modification » renvoient une **nouvelle** chaîne : il faut récupérer le résultat.
  - `String` est `final`, implémente `CharSequence` et `Comparable<String>`.
  - Depuis Java 9 (*Compact Strings*), une chaîne qui ne contient que du Latin-1 est stockée sur un octet par caractère.

  **Piège classique** : `substring(debut, fin)` exclut `fin`. Pour les trois premiers caractères :
  `s.substring(0, 3)`.

  **En entretien** : « `String` est immuable ; `substring` exclut sa borne de fin, `indexOf` renvoie -1 si rien n'est
  trouvé, et on compare avec `equals`, jamais `==`. »
tour:
  - title: La classe String
    text: |-
      `String` est la classe des chaînes de caractères, et un littéral `"…"` en crée une. `length()` donne sa longueur,
      `charAt(i)` un caractère, `substring(debut, fin)` une partie, `indexOf` la position d'un texte ; `contains`,
      `startsWith`, `toUpperCase`, `strip` et `replace` font ce qu'ils disent.

      `isBlank()` (vide, ou faite d'espaces) et `repeat(n)` sont venus avec Java 11.
    example:
      files:
        Main.java: |-
          void main() {
              String langage = "  Java 25  ";
              String propre = langage.strip();
              IO.println("[" + propre + "] " + propre.length());
              IO.println(propre.charAt(0) + " " + propre.substring(0, 4) + " " + propre.indexOf("25"));
              IO.println(propre.contains("va") + " " + propre.startsWith("Ja") + " " + propre.toUpperCase());
              IO.println(propre.replace("25", "21") + " " + "ab".repeat(3) + " " + "   ".isBlank());
          }
      output: |-
        [Java 25] 7
        J Java 5
        true true JAVA 25
        Java 21 ababab true
cards:
  - key: compact-strings
    format: course
    question: C'est quoi les Compact Strings ?
    answer: Depuis Java 9, une String Latin-1 est stockée sur 1 octet par caractère au lieu de 2.
  - key: substring-bornes
    format: course
    question: Que renvoie `s.substring(debut, fin)` ?
    answer: Les caractères de l'indice `debut` inclus à l'indice `fin` exclu ; la longueur du résultat est `fin - debut`.
  - key: index-of
    format: course
    question: Que renvoie `indexOf` quand la recherche échoue ?
    answer: '`-1`. Il faut donc tester `>= 0` (ou utiliser `contains`) avant d''utiliser la position.'
  - key: hors-limites
    format: course
    question: Que se passe-t-il avec `"abc".charAt(5)` ?
    answer: "Une `StringIndexOutOfBoundsException` : les indices valides vont de 0 à `length() - 1`."
  - key: vf-indice-zero
    format: true-false
    question: Le premier caractère d'une chaîne est à l'indice 1.
    truth: false
    answer: Les indices commencent à 0.
  - key: vf-replace-tout
    format: true-false
    question: "`\"a-b-c\".replace(\"-\", \"+\")` remplace toutes les occurrences."
    truth: true
    answer: '`replace` remplace toutes les occurrences, sans expression régulière.'
  - key: vf-length-methode
    format: true-false
    question: La longueur d'une chaîne s'obtient avec `s.length`, comme pour un tableau.
    truth: false
    answer: "Pour une `String`, c'est une méthode : `s.length()`."
  - key: vf-starts-with-casse
    format: true-false
    question: "`\"Java\".startsWith(\"ja\")` vaut `true`."
    truth: false
    answer: Les comparaisons de `String` respectent la casse.
  - key: qcm-substring
    format: multiple-choice
    question: "Que renvoie `\"programme\".substring(3, 6)` ?"
    choices:
      - text: "\"gra\""
        correct: true
      - text: "\"gram\""
        correct: false
      - text: "\"ogr\""
        correct: false
      - text: "\"rog\""
        correct: false
    answer: Indices 3, 4 et 5 ; le 6 est exclu.
  - key: qcm-tests
    format: multiple-choice
    question: "Lesquelles valent `true` pour `s = \"fichier.txt\"` ?"
    choices:
      - text: "`s.endsWith(\".txt\")`"
        correct: true
      - text: "`s.contains(\"chi\")`"
        correct: true
      - text: "`s.indexOf(\"pdf\") >= 0`"
        correct: false
      - text: "`s.startsWith(\"Fic\")`"
        correct: false
    answer: '`indexOf` vaut -1, et la casse compte pour `startsWith`.'
  - key: qcm-longueur
    format: multiple-choice
    question: "Que vaut `\"Bonjour\".length()` ?"
    choices:
      - text: "7"
        correct: true
      - text: "6"
        correct: false
      - text: "8"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Sept caractères ; le dernier indice est 6.
  - key: qcm-dernier
    format: multiple-choice
    question: Comment obtenir le dernier caractère d'une chaîne non vide `s` ?
    choices:
      - text: "`s.charAt(s.length() - 1)`"
        correct: true
      - text: "`s.charAt(s.length())`"
        correct: false
      - text: "`s.charAt(-1)`"
        correct: false
      - text: "`s.last()`"
        correct: false
    answer: '`charAt(s.length())` lève une exception, et Java n''a pas d''indice négatif.'
  - key: trous-substring
    format: fill-in
    question: |-
      Complétez pour obtenir les trois premiers caractères :
      ```java
      String debut = s.substring(0, ___);
      ```
    blanks: [["3"]]
    answer: "La borne de fin est exclue : indices 0, 1 et 2."
  - key: trous-index-of
    format: fill-in
    question: |-
      Complétez pour savoir si la chaîne contient un `@` :
      ```java
      boolean email = s.indexOf('@') ___ 0;
      ```
    blanks: [[">="]]
    answer: '`indexOf` renvoie -1 si le caractère est absent, et 0 s''il est en première position.'
  - key: trous-majuscules
    format: fill-in
    question: |-
      Complétez pour mettre le code en majuscules :
      ```java
      String code = saisie.___();
      ```
    blanks: [[toUpperCase]]
    answer: La méthode renvoie une nouvelle chaîne, qu'on récupère.
  - key: trous-extension
    format: fill-in
    question: |-
      Complétez pour extraire l'extension de `"rapport.pdf"` :
      ```java
      String extension = nom.substring(nom.lastIndexOf('.') ___ 1);
      ```
    blanks: [["+"]]
    answer: On commence juste après le dernier point.
  - key: code-methodes
    format: code-output
    question: |-
      ```java
      String s = "Bonjour";
      System.out.println(s.length() + " " + s.charAt(0) + " " + s.substring(3) + " " + s.substring(1, 3));
      ```
    answer: '`7 B jour on`.'
    check:
      output: "7 B jour on"
  - key: code-index-of
    format: code-output
    question: |-
      ```java
      System.out.println("banane".indexOf('n') + " " + "banane".lastIndexOf('n') + " " + "banane".indexOf("z"));
      ```
    answer: '`2 4 -1`.'
    check:
      output: "2 4 -1"
  - key: code-hors-limites
    format: code-output
    question: |-
      ```java
      System.out.println("abc".substring(2, 5));
      ```
    answer: "Une `StringIndexOutOfBoundsException` : la fin dépasse la longueur."
    check:
      throws: StringIndexOutOfBoundsException
  - key: code-tests
    format: code-output
    question: |-
      ```java
      System.out.println("a-b-c".replace("-", "+") + " " + "Java".contains("av") + " " + "Java".startsWith("ja"));
      ```
    answer: '`a+b+c true false` : la casse compte pour `startsWith`.'
    check:
      output: "a+b+c true false"
  - key: bug-substring-fin
    format: bug-fix
    question: |-
      Le code postal extrait de `"75001 Paris"` vaut `"7500"` :
      ```java
      String codePostal = adresse.substring(0, 4);
      ```
    answer: |-
      ```java
      String codePostal = adresse.substring(0, 5);
      ```
      La borne de fin est exclue : pour cinq caractères, on s'arrête à l'indice 5.
  - key: bug-index-moins-un
    format: bug-fix
    question: |-
      Pour un email sans `@`, ce code renvoie l'email entier au lieu d'une erreur :
      ```java
      String domaine = email.substring(email.indexOf('@') + 1);
      ```
    answer: |-
      ```java
      int arobase = email.indexOf('@');
      if (arobase < 0) {
          throw new IllegalArgumentException("email invalide : " + email);
      }
      String domaine = email.substring(arobase + 1);
      ```
      `indexOf` renvoie -1, et `-1 + 1` vaut 0 : `substring(0)` renvoie toute la chaîne. On teste l'absence avant.
  - key: bug-resultat-ignore
    format: bug-fix
    question: |-
      Les espaces ne sont jamais retirés :
      ```java
      saisie.replace(" ", "");
      enregistrer(saisie);
      ```
    answer: |-
      ```java
      String sansEspaces = saisie.replace(" ", "");
      enregistrer(sansEspaces);
      ```
      Une `String` ne change jamais : `replace` renvoie une nouvelle chaîne, qu'il faut récupérer.
  - key: bug-dernier-caractere
    format: bug-fix
    question: |-
      Ce code lève une `StringIndexOutOfBoundsException` :
      ```java
      char dernier = mot.charAt(mot.length());
      ```
    answer: |-
      ```java
      char dernier = mot.charAt(mot.length() - 1);
      ```
      Le dernier indice vaut `length() - 1` (et il faut vérifier que le mot n'est pas vide).
