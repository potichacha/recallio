notion: locale-i18n
lesson: |-
  Une **`Locale`** désigne une langue et éventuellement un pays (`fr`, `fr-FR`, `fr-CA`, `pt-BR`). Elle pilote tout ce
  qui dépend des conventions locales : casse, nombres, dates, monnaies, tri, messages.

  ```java
  Locale fr = Locale.FRANCE;                      // constantes courantes
  Locale br = Locale.of("pt", "BR");              // Java 19 (les constructeurs sont dépréciés)
  Locale ca = Locale.forLanguageTag("fr-CA");     // depuis une étiquette BCP 47 (en-tête HTTP)

  "title".toUpperCase(Locale.of("tr"));           // "TİTLE" : le i turc devient İ
  "title".toUpperCase(Locale.ROOT);               // "TITLE"

  ResourceBundle messages = ResourceBundle.getBundle("messages", fr);   // messages_fr.properties
  MessageFormat.format(messages.getString("bienvenue"), nom);           // "Bonjour {0} !"
  ```

  - **`Locale.ROOT`** pour tout traitement **technique** (clés, identifiants, protocoles, noms de fichiers) : le résultat
    ne doit pas dépendre de la langue de la machine.
  - La **locale de l'utilisateur** pour l'affichage : elle vient de son profil ou de l'en-tête `Accept-Language`.
  - La locale par défaut de la JVM dépend du système : ne pas s'y fier côté serveur.
  - Les textes traduits vont dans des **`ResourceBundle`** (`messages.properties`, `messages_fr.properties`...), jamais en
    dur ni assemblés par concaténation (l'ordre des mots change selon les langues : on utilise des paramètres `{0}`).

  **Piège classique** : `cle.toLowerCase()` sans locale sur un serveur configuré en turc. `"ID"` devient `"ıd"` (i sans
  point), et la clé n'est plus trouvée.

  **En entretien** : « `Locale.ROOT` pour le technique, la locale de l'utilisateur pour l'affichage, et des
  `ResourceBundle` avec paramètres pour les messages. »
cards:
  - key: preciser-locale-touppercase
    format: course
    question: "Pourquoi préciser une `Locale` dans `toUpperCase` ?"
    choices:
      - {text: "Le résultat dépend de la locale (le i turc) : `Locale.ROOT` pour un traitement technique", correct: true}
      - {text: "Sans locale, `toUpperCase` ne traite que les lettres ASCII et laisse les accents", correct: false}
      - {text: "Sans locale, `toUpperCase` lève une exception sur un serveur mal configuré", correct: false}
      - {text: "La locale accélère la conversion, en évitant de lire la configuration du système", correct: false}
    answer: "Le résultat dépend de la locale : en turc, `i` devient `İ`, avec un point. Pour un traitement technique (clés, identifiants), `Locale.ROOT` donne le même résultat partout."
  - key: creer
    format: course
    question: Comment créer une `Locale` en Java récent ?
    choices:
      - {text: "Avec `Locale.of(\"pt\", \"BR\")`, `Locale.forLanguageTag(\"fr-CA\")` ou les constantes", correct: true}
      - {text: "Avec `new Locale(\"pt\", \"BR\")`, le seul moyen pour un pays sans constante", correct: false}
      - {text: "Avec `Locale.parse(\"pt_BR\")`, qui lit le format produit par `toString`", correct: false}
      - {text: "Avec `Locale.valueOf(\"PT_BR\")`, comme pour une constante d'enum", correct: false}
    answer: "Avec les constantes (`Locale.FRANCE`), `Locale.of(\"pt\", \"BR\")` (Java 19) ou `Locale.forLanguageTag(\"fr-CA\")` ; les constructeurs `new Locale(...)` sont dépréciés."
  - key: resource-bundle
    format: course
    question: À quoi sert un `ResourceBundle` ?
    choices:
      - {text: "À charger les textes traduits selon la locale, avec un repli sur le fichier par défaut", correct: true}
      - {text: "À regrouper les ressources statiques (images, feuilles de style) d'une application", correct: false}
      - {text: "À formater les nombres et les dates selon la locale de l'utilisateur", correct: false}
      - {text: "À détecter automatiquement la langue d'un texte saisi par l'utilisateur", correct: false}
    answer: À charger les textes traduits d'une application selon la locale (`messages_fr.properties`, `messages_en.properties`), avec un repli sur le fichier par défaut.
  - key: concatenation
    format: course
    question: Pourquoi ne pas assembler un message traduit par concaténation ?
    choices:
      - {text: "L'ordre des mots change d'une langue à l'autre : un gabarit (`{0}`) laisse chaque traduction placer les valeurs", correct: true}
      - {text: "La concaténation est lente et ralentit l'affichage de chaque page traduite", correct: false}
      - {text: "La concaténation perd les accents et les caractères spéciaux des traductions", correct: false}
      - {text: "Le `+` ne fonctionne qu'avec des chaînes ASCII, pas avec les autres alphabets", correct: false}
    answer: L'ordre des mots et les accords changent d'une langue à l'autre ; un gabarit avec des paramètres (`{0}`) laisse chaque traduction placer les valeurs.
  - key: vf-defaut
    format: true-false
    question: La locale par défaut de la JVM est la même sur toutes les machines.
    truth: false
    answer: Elle dépend du système et de sa configuration.
  - key: vf-turc
    format: true-false
    question: "`\"title\".toUpperCase(Locale.of(\"tr\"))` donne `\"TITLE\"`."
    truth: false
    answer: "En turc, `i` devient `İ` (i majuscule pointé) : `\"TİTLE\"`."
  - key: vf-root
    format: true-false
    question: "`Locale.ROOT` convient pour normaliser des clés techniques."
    truth: true
    answer: Le résultat ne dépend d'aucune langue.
  - key: vf-constructeur
    format: true-false
    question: "`new Locale(\"fr\", \"FR\")` est la façon recommandée depuis Java 19."
    truth: false
    answer: Les constructeurs sont dépréciés au profit de `Locale.of`.
  - key: qcm-technique
    format: multiple-choice
    question: Quelle locale utiliser pour mettre en minuscules l'identifiant d'un en-tête HTTP ?
    choices:
      - text: "`Locale.ROOT`"
        correct: true
      - text: "La locale de l'utilisateur"
        correct: false
      - text: "La locale par défaut de la JVM"
        correct: false
      - text: "`Locale.FRANCE`"
        correct: false
    answer: Un traitement technique ne doit pas dépendre d'une langue.
  - key: qcm-utilisateur
    format: multiple-choice
    question: D'où vient en général la locale d'affichage d'un utilisateur web ?
    choices:
      - text: "De son profil, ou de l'en-tête `Accept-Language`"
        correct: true
      - text: "De `Locale.getDefault()` sur le serveur"
        correct: false
      - text: "De son adresse IP, obligatoirement"
        correct: false
      - text: "Du fuseau horaire du serveur"
        correct: false
    answer: Le serveur n'a pas la langue de ses utilisateurs.
  - key: qcm-fichiers
    format: multiple-choice
    question: "Sur une JVM dont la locale par défaut est elle aussi `fr_CA`, quels fichiers `ResourceBundle.getBundle(\"messages\", Locale.of(\"fr\", \"CA\"))` essaie-t-il, dans l'ordre ?"
    choices:
      - {text: "`messages_fr_CA.properties`, puis `messages_fr.properties`, puis `messages.properties`", correct: true}
      - {text: "`messages.properties`, puis `messages_fr.properties`, puis `messages_fr_CA.properties`", correct: false}
      - {text: "`messages_fr_CA.properties`, puis `messages_CA.properties`, puis `messages.properties`", correct: false}
      - {text: "Seulement `messages_fr_CA.properties`, sinon une `MissingResourceException`", correct: false}
    answer: "Le chargement se replie du plus précis au plus général : la langue et le pays, puis la langue seule, puis le fichier par défaut ; le pays seul n'est jamais essayé. Si la locale par défaut de la JVM était autre (`en_US`), ses fichiers (`messages_en_US`, `messages_en`) seraient essayés avant `messages.properties`."
  - key: qcm-etiquette
    format: multiple-choice
    question: "Que renvoie `Locale.FRANCE.toLanguageTag()` ?"
    choices:
      - text: "\"fr-FR\""
        correct: true
      - text: "\"fr_FR\""
        correct: false
      - text: "\"FRANCE\""
        correct: false
      - text: "\"français\""
        correct: false
    answer: L'étiquette BCP 47 utilise un tiret ; `toString()` donne `fr_FR`.
  - key: code-turc
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("title".toUpperCase(Locale.of("tr")) + " " + "title".toUpperCase(Locale.ROOT));
      ```
    choices:
      - {text: "`TİTLE TITLE`", correct: true}
      - {text: "`TITLE TITLE`", correct: false}
      - {text: "`TİTLE TİTLE`", correct: false}
      - {text: "`TITLE TİTLE`", correct: false}
    answer: '`TİTLE TITLE` : en turc, le i minuscule devient un İ pointé.'
    check:
      output: "TİTLE TITLE"
  - key: code-pays
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Locale.forLanguageTag("fr-CA").getDisplayCountry(Locale.FRENCH));
      ```
    choices:
      - {text: "`Canada`", correct: true}
      - {text: "`CA`", correct: false}
      - {text: "`Québec`", correct: false}
      - {text: "`français (Canada)`", correct: false}
    answer: "`Canada` : `getDisplayCountry` donne le nom du pays, traduit dans la langue demandée ; `getCountry` donnerait le code `CA`."
    check:
      output: "Canada"
  - key: code-etiquette
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Locale.FRANCE.toLanguageTag() + " " + Locale.of("pt", "BR"));
      ```
    choices:
      - {text: "`fr-FR pt_BR`", correct: true}
      - {text: "`fr_FR pt_BR`", correct: false}
      - {text: "`fr-FR pt-BR`", correct: false}
      - {text: "`fr_FR pt-BR`", correct: false}
    answer: '`fr-FR pt_BR` : l''étiquette BCP 47 avec un tiret, `toString` avec un souligné.'
    check:
      output: "fr-FR pt_BR"
  - key: code-message-format
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(java.text.MessageFormat.format("{0} a {1} messages", "Ada", 3));
      ```
    choices:
      - {text: "`Ada a 3 messages`", correct: true}
      - {text: "`{0} a {1} messages`", correct: false}
      - {text: "`Ada a {1} messages`", correct: false}
      - {text: "`3 a Ada messages`", correct: false}
    answer: '`Ada a 3 messages` : les paramètres sont placés selon leur numéro.'
    check:
      output: "Ada a 3 messages"
  - key: bug-to-lower
    format: bug-fix
    question: |-
      Sur un serveur configuré en turc, les clés de configuration ne sont plus trouvées :
      ```java
      String cle = saisie.toLowerCase();
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`String cle = saisie.toLowerCase(Locale.ROOT);`", correct: true}
      - {text: "`String cle = saisie.toLowerCase(Locale.getDefault());`", correct: false}
      - {text: "`String cle = saisie.toUpperCase().toLowerCase();`", correct: false}
      - {text: "`String cle = saisie.strip().toLowerCase();`", correct: false}
    answer: |-
      ```java
      String cle = saisie.toLowerCase(Locale.ROOT);
      ```
      Sans argument, `toLowerCase` utilise la locale par défaut : en turc, `I` devient `ı` (sans point). `Locale.ROOT` donne
      le même résultat partout.
  - key: bug-constructeur
    format: bug-fix
    question: |-
      Comment moderniser cette ligne ?
      ```java
      Locale quebec = new Locale("fr", "CA");
      ```
    choices:
      - {text: "`Locale quebec = Locale.of(\"fr\", \"CA\");`", correct: true}
      - {text: "`Locale quebec = Locale.CANADA;`", correct: false}
      - {text: "`Locale quebec = Locale.forLanguageTag(\"fr_CA\");`", correct: false}
      - {text: "`Locale quebec = Locale.valueOf(\"fr_CA\");`", correct: false}
    answer: "Les constructeurs de `Locale` sont dépréciés depuis Java 19 : `Locale.of` les remplace. `Locale.CANADA` est l'anglais du Canada, et une étiquette BCP 47 s'écrit avec un tiret (`fr-CA`)."
  - key: bug-concatenation
    format: bug-fix
    question: |-
      La traduction allemande de ce message est grammaticalement fausse :
      ```java
      String message = traduire("vous_avez") + " " + n + " " + traduire("messages");
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un gabarit complet par langue, formaté par `MessageFormat` avec un paramètre `{0}`", correct: true}
      - {text: "Traduire chaque mot séparément, puis les assembler selon l'ordre du français", correct: false}
      - {text: "Assembler les morceaux avec un `StringBuilder` plutôt qu'avec l'opérateur `+`", correct: false}
      - {text: "Convertir le nombre avec `String.valueOf(n)` avant de l'insérer dans le message", correct: false}
    answer: |-
      ```java
      String message = MessageFormat.format(messages.getString("compteur_messages"), n);
      // messages_fr.properties : compteur_messages=Vous avez {0} messages
      // messages_de.properties : compteur_messages=Sie haben {0} Nachrichten
      ```
      Chaque langue ordonne ses mots à sa façon. Un gabarit complet par langue, avec des paramètres, laisse la
      traduction placer les valeurs (et `ChoiceFormat` gère le pluriel).
  - key: bug-locale-defaut-affichage
    format: bug-fix
    question: |-
      Tous les utilisateurs voient les dates en anglais, quelle que soit leur langue :
      ```java
      String date = d.format(DateTimeFormatter.ofPattern("d MMMM yyyy"));
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Passer la locale de l'utilisateur à `ofPattern`", correct: true}
      - {text: "Lancer la JVM du serveur avec `-Duser.language=fr`", correct: false}
      - {text: "Écrire le motif `d MMM yyyy`, avec le mois abrégé", correct: false}
      - {text: "Formater avec `ISO_LOCAL_DATE`, compris par tous", correct: false}
    answer: |-
      ```java
      String date = d.format(DateTimeFormatter.ofPattern("d MMMM yyyy", utilisateur.locale()));
      ```
      Sans locale, le formateur prend celle de la JVM du serveur. L'affichage utilise la locale de l'utilisateur.
