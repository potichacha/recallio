notion: locale-i18n
lesson: |-
  Une **`Locale`** désigne une langue et éventuellement un pays (`fr`, `fr-FR`, `fr-CA`, `pt-BR`). Elle pilote tout ce
  qui dépend des conventions locales : casse, nombres, dates, monnaies, tri, messages.

  ```java
  Locale fr = Locale.FRANCE;                      // constantes courantes
  Locale br = Locale.of("pt", "BR");              // Java 19 (les constructeurs sont dépréciés)
  Locale ca = Locale.forLanguageTag("fr-CA");     // depuis une étiquette BCP 47 (en-tête HTTP)

  "title".toUpperCase(Locale.of("tr"));           // "TİTLE" : le i turc devient İ
  "title".toUpperCase(Locale.ROOT);               // "TITLE"

  ResourceBundle messages = ResourceBundle.getBundle("messages", fr);   // messages_fr.properties
  MessageFormat.format(messages.getString("bienvenue"), nom);           // "Bonjour {0} !"
  ```

  - **`Locale.ROOT`** pour tout traitement **technique** (clés, identifiants, protocoles, noms de fichiers) : le résultat
    ne doit pas dépendre de la langue de la machine.
  - La **locale de l'utilisateur** pour l'affichage : elle vient de son profil ou de l'en-tête `Accept-Language`.
  - La locale par défaut de la JVM dépend du système : ne pas s'y fier côté serveur.
  - Les textes traduits vont dans des **`ResourceBundle`** (`messages.properties`, `messages_fr.properties`...), jamais en
    dur ni assemblés par concaténation (l'ordre des mots change selon les langues : on utilise des paramètres `{0}`).

  **Piège classique** : `cle.toLowerCase()` sans locale sur un serveur configuré en turc. `"ID"` devient `"ıd"` (i sans
  point), et la clé n'est plus trouvée.

  **En entretien** : « `Locale.ROOT` pour le technique, la locale de l'utilisateur pour l'affichage, et des
  `ResourceBundle` avec paramètres pour les messages. »
cards:
  - key: preciser-locale-touppercase
    format: course
    question: Pourquoi préciser une Locale dans toUpperCase ?
    answer: Le résultat dépend de la locale (cas du i turc) ; Locale.ROOT pour les traitements techniques.
  - key: creer
    format: course
    question: Comment créer une `Locale` en Java récent ?
    answer: Avec les constantes (`Locale.FRANCE`), `Locale.of("pt", "BR")` (Java 19) ou `Locale.forLanguageTag("fr-CA")` ; les constructeurs `new Locale(...)` sont dépréciés.
  - key: resource-bundle
    format: course
    question: À quoi sert un `ResourceBundle` ?
    answer: À charger les textes traduits d'une application selon la locale (`messages_fr.properties`, `messages_en.properties`), avec un repli sur le fichier par défaut.
  - key: concatenation
    format: course
    question: Pourquoi ne pas assembler un message traduit par concaténation ?
    answer: L'ordre des mots et les accords changent d'une langue à l'autre ; un gabarit avec des paramètres (`{0}`) laisse chaque traduction placer les valeurs.
  - key: vf-defaut
    format: true-false
    question: La locale par défaut de la JVM est la même sur toutes les machines.
    truth: false
    answer: Elle dépend du système et de sa configuration.
  - key: vf-turc
    format: true-false
    question: "`\"title\".toUpperCase(Locale.of(\"tr\"))` donne `\"TITLE\"`."
    truth: false
    answer: "En turc, `i` devient `İ` (i majuscule pointé) : `\"TİTLE\"`."
  - key: vf-root
    format: true-false
    question: "`Locale.ROOT` convient pour normaliser des clés techniques."
    truth: true
    answer: Le résultat ne dépend d'aucune langue.
  - key: vf-constructeur
    format: true-false
    question: "`new Locale(\"fr\", \"FR\")` est la façon recommandée depuis Java 19."
    truth: false
    answer: Les constructeurs sont dépréciés au profit de `Locale.of`.
  - key: qcm-technique
    format: multiple-choice
    question: Quelle locale utiliser pour mettre en minuscules l'identifiant d'un en-tête HTTP ?
    choices:
      - text: "`Locale.ROOT`"
        correct: true
      - text: "La locale de l'utilisateur"
        correct: false
      - text: "La locale par défaut de la JVM"
        correct: false
      - text: "`Locale.FRANCE`"
        correct: false
    answer: Un traitement technique ne doit pas dépendre d'une langue.
  - key: qcm-utilisateur
    format: multiple-choice
    question: D'où vient en général la locale d'affichage d'un utilisateur web ?
    choices:
      - text: "De son profil, ou de l'en-tête `Accept-Language`"
        correct: true
      - text: "De `Locale.getDefault()` sur le serveur"
        correct: false
      - text: "De son adresse IP, obligatoirement"
        correct: false
      - text: "Du fuseau horaire du serveur"
        correct: false
    answer: Le serveur n'a pas la langue de ses utilisateurs.
  - key: qcm-fichiers
    format: multiple-choice
    question: "Pour `ResourceBundle.getBundle(\"messages\", Locale.of(\"fr\", \"CA\"))`, quels fichiers peuvent être utilisés ?"
    choices:
      - text: "`messages_fr_CA.properties`, puis `messages_fr.properties`, puis `messages.properties`"
        correct: true
      - text: "Seulement `messages_fr_CA.properties`"
        correct: false
      - text: "`messages.properties` uniquement"
        correct: false
      - text: "`fr_CA_messages.properties`"
        correct: false
    answer: Le chargement se replie du plus précis au plus général.
  - key: qcm-etiquette
    format: multiple-choice
    question: "Que renvoie `Locale.FRANCE.toLanguageTag()` ?"
    choices:
      - text: "\"fr-FR\""
        correct: true
      - text: "\"fr_FR\""
        correct: false
      - text: "\"FRANCE\""
        correct: false
      - text: "\"français\""
        correct: false
    answer: L'étiquette BCP 47 utilise un tiret ; `toString()` donne `fr_FR`.
  - key: code-turc
    format: code-output
    question: |-
      ```java
      System.out.println("title".toUpperCase(Locale.of("tr")) + " " + "title".toUpperCase(Locale.ROOT));
      ```
    answer: '`TİTLE TITLE` : en turc, le i minuscule devient un İ pointé.'
    check:
      output: "TİTLE TITLE"
  - key: code-pays
    format: code-output
    question: |-
      ```java
      System.out.println(Locale.forLanguageTag("fr-CA").getDisplayCountry(Locale.FRENCH));
      ```
    answer: '`Canada`.'
    check:
      output: "Canada"
  - key: code-etiquette
    format: code-output
    question: |-
      ```java
      System.out.println(Locale.FRANCE.toLanguageTag() + " " + Locale.of("pt", "BR"));
      ```
    answer: '`fr-FR pt_BR` : l''étiquette BCP 47 avec un tiret, `toString` avec un souligné.'
    check:
      output: "fr-FR pt_BR"
  - key: code-message-format
    format: code-output
    question: |-
      ```java
      System.out.println(java.text.MessageFormat.format("{0} a {1} messages", "Ada", 3));
      ```
    answer: '`Ada a 3 messages` : les paramètres sont placés selon leur numéro.'
    check:
      output: "Ada a 3 messages"
  - key: bug-to-lower
    format: bug-fix
    question: |-
      Sur un serveur configuré en turc, les clés de configuration ne sont plus trouvées :
      ```java
      String cle = saisie.toLowerCase();
      ```
    answer: |-
      ```java
      String cle = saisie.toLowerCase(Locale.ROOT);
      ```
      Sans argument, `toLowerCase` utilise la locale par défaut : en turc, `I` devient `ı` (sans point). `Locale.ROOT` donne
      le même résultat partout.
  - key: bug-constructeur
    format: bug-fix
    question: |-
      Modernisez :
      ```java
      Locale quebec = new Locale("fr", "CA");
      ```
    answer: |-
      ```java
      Locale quebec = Locale.of("fr", "CA");
      ```
      Les constructeurs de `Locale` sont dépréciés depuis Java 19.
  - key: bug-concatenation
    format: bug-fix
    question: |-
      La traduction allemande de ce message est grammaticalement fausse :
      ```java
      String message = traduire("vous_avez") + " " + n + " " + traduire("messages");
      ```
    answer: |-
      ```java
      String message = MessageFormat.format(messages.getString("compteur_messages"), n);
      // messages_fr.properties : compteur_messages=Vous avez {0} messages
      // messages_de.properties : compteur_messages=Sie haben {0} Nachrichten
      ```
      Chaque langue ordonne ses mots à sa façon. Un gabarit complet par langue, avec des paramètres, laisse la
      traduction placer les valeurs (et `ChoiceFormat` gère le pluriel).
  - key: bug-locale-defaut-affichage
    format: bug-fix
    question: |-
      Tous les utilisateurs voient les dates en anglais, quelle que soit leur langue :
      ```java
      String date = d.format(DateTimeFormatter.ofPattern("d MMMM yyyy"));
      ```
    answer: |-
      ```java
      String date = d.format(DateTimeFormatter.ofPattern("d MMMM yyyy", utilisateur.locale()));
      ```
      Sans locale, le formateur prend celle de la JVM du serveur. L'affichage utilise la locale de l'utilisateur.
