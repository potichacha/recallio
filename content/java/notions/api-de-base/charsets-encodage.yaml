notion: charsets-encodage
lesson: |-
  Une `String` contient des **caractères** ; un fichier, une requête réseau ou une base stockent des **octets**. Un
  **encodage** (`Charset`) fait la traduction, et les deux côtés doivent utiliser le même.

  ```java
  byte[] octets = "café".getBytes(StandardCharsets.UTF_8);   // 5 octets : é en prend 2
  String texte = new String(octets, StandardCharsets.UTF_8);  // "café"

  new String(octets, StandardCharsets.ISO_8859_1);            // "cafÃ©" : mauvais encodage
  ```

  | Encodage | Particularité |
  |---|---|
  | UTF-8 | tout Unicode, 1 à 4 octets par caractère, compatible ASCII ; le standard du web |
  | ISO-8859-1 (Latin-1) | 1 octet, Europe de l'Ouest seulement |
  | Windows-1252 | variante de Latin-1 (avec `€`), fréquente dans les vieux fichiers Windows |
  | UTF-16 | 2 ou 4 octets ; la représentation interne des `char` |

  - Depuis **Java 18** (JEP 400), l'encodage par défaut est **UTF-8** sur toutes les plateformes ; avant, il dépendait du
    système (Windows-1252 sur un Windows français).
  - On **précise toujours** l'encodage quand on convertit (`getBytes(UTF_8)`, `Files.readString(chemin, charset)`,
    `new InputStreamReader(in, UTF_8)`), avec les constantes de `StandardCharsets`.
  - Le **mojibake** (`Ã©` à la place de `é`) signale de l'UTF-8 lu comme du Latin-1 ; des `?` ou `�` signalent un
    caractère impossible à encoder ou à décoder.
  - Une longueur en caractères n'est pas une taille en octets : une colonne limitée à 10 octets n'accepte pas 10 `é`.

  **Piège classique** : `new String(octets)` ou `getBytes()` sans encodage. Le résultat dépendait de la machine avant
  Java 18, et dépend toujours de l'encodage réel des données.

  **En entretien** : « Toujours un encodage explicite aux frontières, UTF-8 de préférence ; le défaut est UTF-8 depuis
  Java 18. »
cards:
  - key: encodage-defaut-depuis-java-18
    format: course
    question: Quel est l'encodage par défaut depuis Java 18 ?
    answer: UTF-8 sur toutes les plateformes (JEP 400).
  - key: octets-vs-caracteres
    format: course
    question: Combien d'octets occupe `"é"` en UTF-8 et en ISO-8859-1 ?
    answer: Deux en UTF-8, un en ISO-8859-1 ; un caractère n'a pas une taille fixe en octets.
  - key: mojibake
    format: course
    question: Que signifie l'affichage `Ã©` à la place de `é` ?
    answer: "Des octets UTF-8 ont été décodés comme du Latin-1 (ou Windows-1252) : chaque octet du `é` est devenu un caractère."
  - key: explicite
    format: course
    question: Pourquoi préciser l'encodage même depuis Java 18 ?
    answer: Les données ne sont pas forcément en UTF-8 (fichiers anciens, systèmes tiers), le code doit dire ce qu'il attend, et il peut tourner sur une JVM plus ancienne ou configurée autrement.
  - key: vf-defaut-18
    format: true-false
    question: Depuis Java 18, l'encodage par défaut est UTF-8 sur Windows aussi.
    truth: true
    answer: JEP 400 l'a uniformisé sur toutes les plateformes.
  - key: vf-taille-fixe
    format: true-false
    question: En UTF-8, chaque caractère occupe un octet.
    truth: false
    answer: De 1 à 4 octets ; seul l'ASCII tient sur un octet.
  - key: vf-standard-charsets
    format: true-false
    question: "`StandardCharsets.UTF_8` évite l'exception vérifiée `UnsupportedEncodingException`."
    truth: true
    answer: Contrairement à `getBytes("UTF-8")`, la constante est garantie et ne lève rien.
  - key: vf-ascii
    format: true-false
    question: Un texte purement ASCII a les mêmes octets en UTF-8 et en ISO-8859-1.
    truth: true
    answer: Les deux encodages coïncident sur les 128 premiers caractères.
  - key: qcm-conversion
    format: multiple-choice
    question: Quelles conversions sont correctes et explicites ?
    choices:
      - text: "`texte.getBytes(StandardCharsets.UTF_8)`"
        correct: true
      - text: "`new String(octets, StandardCharsets.UTF_8)`"
        correct: true
      - text: "`texte.getBytes()`"
        correct: false
      - text: "`new String(octets)`"
        correct: false
    answer: Sans encodage, on dépend de celui par défaut de la JVM.
  - key: qcm-emoji
    format: multiple-choice
    question: "Combien d'octets occupe `\"😀\"` en UTF-8 ?"
    choices:
      - text: "4"
        correct: true
      - text: "2"
        correct: false
      - text: "1"
        correct: false
      - text: "3"
        correct: false
    answer: Un caractère hors du plan de base prend 4 octets en UTF-8 (et 2 `char` en Java).
  - key: qcm-lecture
    format: multiple-choice
    question: Comment lire un vieux fichier encodé en Windows-1252 ?
    choices:
      - text: "`Files.readString(chemin, Charset.forName(\"windows-1252\"))`"
        correct: true
      - text: "`Files.readString(chemin)`"
        correct: false
      - text: "`new String(Files.readAllBytes(chemin))`"
        correct: false
      - text: "`Files.readString(chemin, StandardCharsets.US_ASCII)`"
        correct: false
    answer: '`Files.readString` sans encodage suppose l''UTF-8.'
  - key: qcm-colonne
    format: multiple-choice
    question: "Une colonne `VARCHAR` limitée à 10 **octets** en UTF-8 refuse `\"éééééééééé\"` (10 caractères). Pourquoi ?"
    choices:
      - text: "Chaque `é` occupe 2 octets : 20 octets en tout"
        correct: true
      - text: "Les accents sont interdits en base"
        correct: false
      - text: "`length()` compte mal"
        correct: false
      - text: "La base attend de l'UTF-16"
        correct: false
    answer: '`length()` compte des `char`, la base des octets.'
  - key: code-octets
    format: code-output
    question: |-
      ```java
      import java.nio.charset.StandardCharsets;
      System.out.println("é".getBytes(StandardCharsets.UTF_8).length + " " + "é".getBytes(StandardCharsets.ISO_8859_1).length);
      ```
    answer: '`2 1`.'
    check:
      output: "2 1"
  - key: code-mojibake
    format: code-output
    question: |-
      ```java
      import java.nio.charset.StandardCharsets;
      byte[] utf8 = "café".getBytes(StandardCharsets.UTF_8);
      System.out.println(new String(utf8, StandardCharsets.ISO_8859_1));
      ```
    answer: '`cafÃ©` : les deux octets UTF-8 du `é` sont lus comme deux caractères Latin-1.'
    check:
      output: "cafÃ©"
  - key: code-emoji
    format: code-output
    question: |-
      ```java
      import java.nio.charset.StandardCharsets;
      System.out.println("😀".getBytes(StandardCharsets.UTF_8).length + " " + "😀".length());
      ```
    answer: '`4 2` : quatre octets en UTF-8, deux `char` en UTF-16.'
    check:
      output: "4 2"
  - key: code-aller-retour
    format: code-output
    question: |-
      ```java
      import java.nio.charset.StandardCharsets;
      String s = "Noël €";
      String retour = new String(s.getBytes(StandardCharsets.UTF_8), StandardCharsets.UTF_8);
      System.out.println(s.equals(retour) + " " + s.getBytes(StandardCharsets.UTF_8).length);
      ```
    answer: '`true 9` : le même encodage dans les deux sens ; `ë` prend 2 octets et `€` 3.'
    check:
      output: "true 9"
  - key: bug-new-string
    format: bug-fix
    question: |-
      Les accents d'un fichier exporté par un vieux logiciel Windows s'affichent mal :
      ```java
      String contenu = new String(Files.readAllBytes(chemin));
      ```
    answer: |-
      ```java
      String contenu = Files.readString(chemin, Charset.forName("windows-1252"));
      ```
      Sans encodage, on décode en UTF-8 (depuis Java 18) des octets qui sont en Windows-1252. On indique l'encodage réel
      du fichier.
  - key: bug-hachage
    format: bug-fix
    question: |-
      Le hachage d'un mot de passe accentué ne donne pas le même résultat sur le serveur Linux et sur un poste Windows
      en Java 17 :
      ```java
      byte[] empreinte = digest.digest(motDePasse.getBytes());
      ```
    answer: |-
      ```java
      byte[] empreinte = digest.digest(motDePasse.getBytes(StandardCharsets.UTF_8));
      ```
      Avant Java 18, `getBytes()` utilisait l'encodage du système : les octets d'un même texte différaient d'une
      machine à l'autre.
  - key: bug-reader
    format: bug-fix
    question: |-
      Une réponse HTTP en UTF-8 est mal décodée sur certaines machines :
      ```java
      BufferedReader lecteur = new BufferedReader(new InputStreamReader(connexion.getInputStream()));
      ```
    answer: |-
      ```java
      BufferedReader lecteur = new BufferedReader(
              new InputStreamReader(connexion.getInputStream(), StandardCharsets.UTF_8));
      ```
      `InputStreamReader` sans encodage utilise celui par défaut de la JVM. L'encodage annoncé par la réponse (ici
      UTF-8) doit être passé explicitement.
  - key: bug-unsupported-encoding
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      try {
          octets = texte.getBytes("UTF-8");
      } catch (UnsupportedEncodingException e) {
          throw new IllegalStateException(e);
      }
      ```
    answer: |-
      ```java
      octets = texte.getBytes(StandardCharsets.UTF_8);
      ```
      Les constantes de `StandardCharsets` sont garanties sur toute JVM : pas d'exception vérifiée, et pas de faute de
      frappe possible dans le nom.
