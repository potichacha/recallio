notion: string-concatenation
lesson: |-
  L'opérateur `+` concatène dès qu'un des deux opérandes est une `String`. Il s'évalue **de gauche à droite** :

  ```java
  1 + 2 + "a" + 1 + 2      // "3a12" : 1 + 2 d'abord, puis concaténation
  'a' + 1 + "b"            // "98b"  : char + int = int, puis concaténation
  "total : " + null        // "total : null"
  ```

  Côté performance :
  - **hors boucle**, `+` est efficace : depuis Java 9 (JEP 280), le compilateur produit un appel `invokedynamic` que la
    JVM optimise (`StringConcatFactory`) ;
  - **dans une boucle**, chaque `+=` crée une nouvelle chaîne et recopie tout ce qui précède : le coût devient
    **quadratique**. On utilise `StringBuilder`, `String.join` ou `Collectors.joining`.

  Autres moyens : `String.join(", ", liste)`, `"a".concat("b")` (qui lève une `NullPointerException` si l'argument est
  `null`), `String.format` et `formatted` pour un gabarit.

  Ce qu'il ne faut **pas** construire par concaténation : une **requête SQL** avec des valeurs saisies (injection, on
  utilise `PreparedStatement`), et un **message de journal** (on utilise les paramètres : `log.debug("id={}", id)`).

  **Piège classique** : `"Somme : " + a + b` affiche `Somme : 23` pour `a = 2` et `b = 3`. Il faut des parenthèses :
  `"Somme : " + (a + b)`.

  **En entretien** : « `+` est très bien hors boucle grâce à `invokedynamic` ; en boucle, `StringBuilder` ou `join` ; et
  jamais de concaténation pour du SQL. »
cards:
  - key: string-toujours-eviter
    format: course
    question: Le `+` sur les String est-il toujours à éviter ?
    answer: Non, hors boucle il est optimisé (invokedynamic depuis Java 9) ; c'est en boucle qu'il faut StringBuilder.
  - key: gauche-droite
    format: course
    question: Pourquoi `1 + 2 + "a"` vaut-il `"3a"` et `"a" + 1 + 2` vaut-il `"a12"` ?
    answer: "Le `+` s'évalue de gauche à droite : tant qu'aucun opérande n'est une `String`, c'est une addition ; ensuite, chaque `+` concatène."
  - key: boucle-quadratique
    format: course
    question: Pourquoi `+=` dans une boucle est-il coûteux ?
    answer: "Chaque itération crée une nouvelle chaîne en recopiant toute la précédente : pour n morceaux, on recopie de l'ordre de n² caractères."
  - key: sql
    format: course
    question: Pourquoi ne pas construire une requête SQL par concaténation ?
    answer: Une valeur saisie peut contenir du SQL (injection) ; un `PreparedStatement` avec des paramètres `?` transmet les valeurs séparément.
  - key: vf-null-concat
    format: true-false
    question: "`\"a\" + null` lève une `NullPointerException`."
    truth: false
    answer: "La concaténation écrit `null` : `\"anull\"`."
  - key: vf-concat-null
    format: true-false
    question: "`\"a\".concat(null)` lève une `NullPointerException`."
    truth: true
    answer: Contrairement à `+`, `concat` refuse un argument `null`.
  - key: vf-hors-boucle
    format: true-false
    question: "`String s = a + \" \" + b;` est plus lent qu'un `StringBuilder` écrit à la main."
    truth: false
    answer: Depuis Java 9, la JVM optimise ce `+` aussi bien, voire mieux.
  - key: vf-char-int
    format: true-false
    question: "`'a' + 1 + \"b\"` vaut `\"a1b\"`."
    truth: false
    answer: '`''a'' + 1` est d''abord une addition d''`int` (98), puis on concatène : `"98b"`.'
  - key: qcm-resultat
    format: multiple-choice
    question: "Que vaut `1 + 2 + \"a\" + 1 + 2` ?"
    choices:
      - text: "\"3a12\""
        correct: true
      - text: "\"12a12\""
        correct: false
      - text: "\"3a3\""
        correct: false
      - text: "\"6a\""
        correct: false
    answer: Addition tant qu'il n'y a pas de chaîne, concaténation ensuite.
  - key: qcm-boucle
    format: multiple-choice
    question: Comment assembler efficacement une liste de 100 000 chaînes séparées par des virgules ?
    choices:
      - text: "`String.join(\",\", liste)`"
        correct: true
      - text: "`liste.stream().collect(Collectors.joining(\",\"))`"
        correct: true
      - text: "Un `+=` dans une boucle `for`"
        correct: false
      - text: "`liste.toString()`"
        correct: false
    answer: '`toString()` ajouterait des crochets et des espaces.'
  - key: qcm-invokedynamic
    format: multiple-choice
    question: Comment le compilateur traduit-il `a + b + c` sur des chaînes depuis Java 9 ?
    choices:
      - text: "Par un appel `invokedynamic` optimisé par la JVM (`StringConcatFactory`)"
        correct: true
      - text: "Par une chaîne d'appels à `concat`"
        correct: false
      - text: "Par un `StringBuffer` synchronisé"
        correct: false
      - text: "Par une boucle sur les caractères"
        correct: false
    answer: Avant Java 9, c'était un `StringBuilder` généré.
  - key: qcm-journal
    format: multiple-choice
    question: Quelle écriture d'un message de journal est préférable ?
    choices:
      - text: "`log.debug(\"commande {} de {}\", id, client)`"
        correct: true
      - text: "`log.debug(\"commande \" + id + \" de \" + client)`"
        correct: false
      - text: "`log.debug(String.format(\"commande %s de %s\", id, client))`"
        correct: false
      - text: "`log.debug(id + client)`"
        correct: false
    answer: Avec des paramètres, le message n'est construit que si le niveau `debug` est actif.
  - key: code-string-null-system-out-println
    format: code-output
    question: '`String n = null; System.out.println(n + "a");`'
    answer: '`nulla`. Et `null instanceof Object` vaut `false`.'
    check:
      code: |-
        String n = null; System.out.println(n + "a");
      output: "nulla"
  - key: code-gauche-droite
    format: code-output
    question: |-
      ```java
      System.out.println(1 + 2 + "a" + 1 + 2);
      ```
    answer: '`3a12`.'
    check:
      output: "3a12"
  - key: code-char
    format: code-output
    question: |-
      ```java
      System.out.println('a' + 1 + "b" + 'c');
      ```
    answer: '`98bc` : `''a'' + 1` vaut 98, puis on concatène.'
    check:
      output: "98bc"
  - key: code-concat-null
    format: code-output
    question: |-
      ```java
      String suffixe = null;
      System.out.println("a".concat(suffixe));
      ```
    answer: "Une `NullPointerException` : `concat` refuse `null`."
    check:
      throws: NullPointerException
  - key: bug-boucle
    format: bug-fix
    question: |-
      La génération de ce rapport prend plusieurs minutes :
      ```java
      String rapport = "";
      for (Ligne l : lignes) {
          rapport += l.texte() + "\n";
      }
      ```
    answer: |-
      ```java
      StringBuilder rapport = new StringBuilder();
      for (Ligne l : lignes) {
          rapport.append(l.texte()).append('\n');
      }
      ```
      `+=` recopie tout le rapport à chaque ligne. Le `StringBuilder` ajoute à la fin sans recopier.
  - key: bug-sql
    format: bug-fix
    question: |-
      Une revue de sécurité signale ce code :
      ```java
      String sql = "SELECT * FROM client WHERE nom = '" + nom + "'";
      statement.executeQuery(sql);
      ```
    answer: |-
      ```java
      PreparedStatement requete = connexion.prepareStatement("SELECT * FROM client WHERE nom = ?");
      requete.setString(1, nom);
      requete.executeQuery();
      ```
      Un nom comme `' OR '1'='1` change le sens de la requête (injection SQL). Le paramètre est transmis séparément de la
      requête et ne peut pas en modifier la structure.
  - key: bug-journal
    format: bug-fix
    question: |-
      Le profilage montre que ce message coûte cher, alors que le niveau `debug` est désactivé en production :
      ```java
      log.debug("État du panier : " + panier.detailComplet());
      ```
    answer: |-
      ```java
      log.debug("État du panier : {}", panier);
      ```
      La concaténation est évaluée avant l'appel, même si le message n'est pas écrit. Avec un paramètre, le journal ne
      construit le texte (et n'appelle `toString`) que si le niveau est actif.
  - key: bug-virgule-finale
    format: bug-fix
    question: |-
      La liste affichée se termine par une virgule en trop : `rouge, vert, bleu, `.
      ```java
      StringBuilder sb = new StringBuilder();
      for (String c : couleurs) {
          sb.append(c).append(", ");
      }
      ```
    answer: |-
      ```java
      String texte = String.join(", ", couleurs);
      ```
      `String.join` ne place le séparateur qu'entre les éléments. (`StringJoiner` permet en plus un préfixe et un
      suffixe.)
