notion: string-concatenation
lesson: |-
  L'opérateur `+` concatène dès qu'un des deux opérandes est une `String`. Il s'évalue **de gauche à droite** :

  ```java
  1 + 2 + "a" + 1 + 2      // "3a12" : 1 + 2 d'abord, puis concaténation
  'a' + 1 + "b"            // "98b"  : char + int = int, puis concaténation
  "total : " + null        // "total : null"
  ```

  Côté performance :
  - **hors boucle**, `+` est efficace : depuis Java 9 (JEP 280), le compilateur produit un appel `invokedynamic` que la
    JVM optimise (`StringConcatFactory`) ;
  - **dans une boucle**, chaque `+=` crée une nouvelle chaîne et recopie tout ce qui précède : le coût devient
    **quadratique**. On utilise `StringBuilder`, `String.join` ou `Collectors.joining`.

  Autres moyens : `String.join(", ", liste)`, `"a".concat("b")` (qui lève une `NullPointerException` si l'argument est
  `null`), `String.format` et `formatted` pour un gabarit.

  Ce qu'il ne faut **pas** construire par concaténation : une **requête SQL** avec des valeurs saisies (injection, on
  utilise `PreparedStatement`), et un **message de journal** (on utilise les paramètres : `log.debug("id={}", id)`).

  **Piège classique** : `"Somme : " + a + b` affiche `Somme : 23` pour `a = 2` et `b = 3`. Il faut des parenthèses :
  `"Somme : " + (a + b)`.

  **En entretien** : « `+` est très bien hors boucle grâce à `invokedynamic` ; en boucle, `StringBuilder` ou `join` ; et
  jamais de concaténation pour du SQL. »
cards:
  - key: string-toujours-eviter
    format: course
    question: "Le `+` sur les `String` est-il toujours à éviter ?"
    choices:
      - {text: "Non : hors boucle il est optimisé ; c'est en boucle qu'il faut un `StringBuilder`", correct: true}
      - {text: "Oui : chaque `+` crée un `StringBuilder`, qu'il vaut mieux toujours écrire soi-même", correct: false}
      - {text: "Oui : il faut toujours passer par `concat`, bien plus rapide que `+`", correct: false}
      - {text: "Non, même en boucle : la JVM fusionne toujours les `+=` en un seul `StringBuilder`", correct: false}
    answer: "Non : hors boucle il est optimisé (`invokedynamic` depuis Java 9). En boucle, chaque `+=` recopie la chaîne : c'est là qu'il faut un `StringBuilder`."
  - key: gauche-droite
    format: course
    question: Pourquoi `1 + 2 + "a"` vaut-il `"3a"` et `"a" + 1 + 2` vaut-il `"a12"` ?
    choices:
      - {text: "Le `+` s'évalue de gauche à droite : addition tant qu'aucun opérande n'est une `String`", correct: true}
      - {text: "Le compilateur additionne d'abord tous les nombres, puis concatène les chaînes", correct: false}
      - {text: "Le `+` s'évalue de droite à gauche : la chaîne la plus à droite décide du sens", correct: false}
      - {text: "Une `String` en tête force la concaténation ; sinon, tout est additionné", correct: false}
    answer: "Le `+` s'évalue de gauche à droite : tant qu'aucun opérande n'est une `String`, c'est une addition ; ensuite, chaque `+` concatène."
  - key: boucle-quadratique
    format: course
    question: Pourquoi `+=` dans une boucle est-il coûteux ?
    choices:
      - {text: "Chaque tour recopie toute la chaîne précédente : de l'ordre de n² caractères", correct: true}
      - {text: "Chaque tour verrouille la chaîne, comme un `StringBuffer` synchronisé", correct: false}
      - {text: "Chaque tour ajoute une chaîne au pool, qui finit par saturer la mémoire", correct: false}
      - {text: "Le compilateur refuse d'optimiser toute boucle qui manipule une `String`", correct: false}
    answer: "Chaque itération crée une nouvelle chaîne en recopiant toute la précédente : pour n morceaux, on recopie de l'ordre de n² caractères."
  - key: sql
    format: course
    question: Pourquoi ne pas construire une requête SQL par concaténation ?
    choices:
      - {text: "Une valeur saisie peut contenir du SQL (injection) : un `PreparedStatement` la sépare", correct: true}
      - {text: "La concaténation est trop lente pour des requêtes appelées très souvent", correct: false}
      - {text: "La base refuse les requêtes qui dépassent une certaine longueur de texte", correct: false}
      - {text: "Les accents des valeurs saisies se perdent lors de la concaténation", correct: false}
    answer: "Une valeur saisie peut contenir du SQL (injection) ; un `PreparedStatement` avec des paramètres `?` transmet les valeurs séparément de la requête."
  - key: vf-null-concat
    format: true-false
    question: "`\"a\" + null` provoque une `NullPointerException` à l'exécution."
    truth: false
    answer: "La concaténation écrit `null` : `\"anull\"`."
  - key: vf-concat-null
    format: true-false
    question: "`\"a\".concat(null)` lève une `NullPointerException`."
    truth: true
    answer: Contrairement à `+`, `concat` refuse un argument `null`.
  - key: vf-hors-boucle
    format: true-false
    question: "`String s = a + \" \" + b;` est plus lent qu'un `StringBuilder` écrit à la main."
    truth: false
    answer: Depuis Java 9, la JVM optimise ce `+` aussi bien, voire mieux.
  - key: vf-char-int
    format: true-false
    question: "`'a' + 1 + \"b\"` vaut `\"a1b\"`."
    truth: false
    answer: '`''a'' + 1` est d''abord une addition d''`int` (98), puis on concatène : `"98b"`.'
  - key: qcm-resultat
    format: multiple-choice
    question: "Que vaut `1 + 2 + \"a\" + 1 + 2` ?"
    choices:
      - text: "\"3a12\""
        correct: true
      - text: "\"12a12\""
        correct: false
      - text: "\"3a3\""
        correct: false
      - text: "\"6a\""
        correct: false
    answer: Addition tant qu'il n'y a pas de chaîne, concaténation ensuite.
  - key: qcm-boucle
    format: multiple-choice
    question: "Laquelle de ces façons assemble efficacement 100 000 chaînes, séparées par des virgules ?"
    choices:
      - {text: "`String.join(\",\", liste)`", correct: true}
      - {text: "Un `+=` dans une boucle `for`", correct: false}
      - {text: "`liste.toString()`", correct: false}
      - {text: "`liste.stream().reduce(\"\", (a, b) -> a + \",\" + b)`", correct: false}
    answer: "`String.join` (comme `Collectors.joining(\",\")`) ne recopie rien. `+=` et `reduce` avec `+` recopient la chaîne à chaque élément, et `toString()` ajouterait des crochets et des espaces."
  - key: qcm-invokedynamic
    format: multiple-choice
    question: Comment le compilateur traduit-il `a + b + c` sur des chaînes depuis Java 9 ?
    choices:
      - {text: "Par un appel `invokedynamic` optimisé par la JVM (`StringConcatFactory`)", correct: true}
      - {text: "Par un `StringBuilder` généré, comme depuis Java 1.5", correct: false}
      - {text: "Par une chaîne d'appels à `concat`, un par opérande", correct: false}
      - {text: "Par un `StringBuffer` synchronisé, créé pour l'expression", correct: false}
    answer: Avant Java 9, c'était un `StringBuilder` généré.
  - key: qcm-journal
    format: multiple-choice
    question: Quelle écriture d'un message de journal est préférable ?
    choices:
      - text: "`log.debug(\"commande {} de {}\", id, client)`"
        correct: true
      - text: "`log.debug(\"commande \" + id + \" de \" + client)`"
        correct: false
      - text: "`log.debug(String.format(\"commande %s de %s\", id, client))`"
        correct: false
      - text: "`log.debug(id + client)`"
        correct: false
    answer: Avec des paramètres, le message n'est construit que si le niveau `debug` est actif.
  - key: code-string-null-system-out-println
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String n = null;
      System.out.println(n + "a");
      ```
    choices:
      - {text: "`nulla`", correct: true}
      - {text: "`a`", correct: false}
      - {text: "`null a`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: "`nulla` : la concaténation écrit `null` en toutes lettres, sans exception."
    check:
      code: |-
        String n = null; System.out.println(n + "a");
      output: "nulla"
  - key: code-gauche-droite
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(1 + 2 + "a" + 1 + 2);
      ```
    choices:
      - {text: "`3a12`", correct: true}
      - {text: "`3a3`", correct: false}
      - {text: "`12a12`", correct: false}
      - {text: "`12a3`", correct: false}
    answer: "`3a12` : `1 + 2` est une addition ; dès que `\"a\"` arrive, chaque `+` suivant concatène."
    check:
      output: "3a12"
  - key: code-char
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println('a' + 1 + "b" + 'c');
      ```
    choices:
      - {text: "`98bc`", correct: true}
      - {text: "`a1bc`", correct: false}
      - {text: "`bbc`", correct: false}
      - {text: "`98b99`", correct: false}
    answer: '`98bc` : `''a'' + 1` vaut 98, puis on concatène.'
    check:
      output: "98bc"
  - key: code-concat-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String suffixe = null;
      System.out.println("a".concat(suffixe));
      ```
    choices:
      - {text: "Une `NullPointerException`", correct: true}
      - {text: "`anull`", correct: false}
      - {text: "`a`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "Une `NullPointerException` : `concat` refuse `null`, alors que `+` aurait écrit `anull`."
    check:
      throws: NullPointerException
  - key: bug-boucle
    format: bug-fix
    question: |-
      La génération de ce rapport prend plusieurs minutes :
      ```java
      String rapport = "";
      for (Ligne l : lignes) {
          rapport += l.texte() + "\n";
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un `StringBuilder` et `append`, qui ajoute à la fin sans recopier", correct: true}
      - {text: "`rapport = rapport.concat(l.texte())`, plus rapide que `+=`", correct: false}
      - {text: "Un `String.format` à chaque tour, à la place du `+=`", correct: false}
      - {text: "Déclarer `rapport` en `final`, pour que le compilateur l'optimise", correct: false}
    answer: |-
      ```java
      StringBuilder rapport = new StringBuilder();
      for (Ligne l : lignes) {
          rapport.append(l.texte()).append('\n');
      }
      ```
      `+=` recopie tout le rapport à chaque ligne. Le `StringBuilder` ajoute à la fin sans recopier.
  - key: bug-sql
    format: bug-fix
    question: |-
      Une revue de sécurité signale ce code :
      ```java
      String sql = "SELECT * FROM client WHERE nom = '" + nom + "'";
      statement.executeQuery(sql);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un `PreparedStatement` avec un paramètre `?`, rempli par `setString`", correct: true}
      - {text: "Doubler les apostrophes de `nom` avec `replace(\"'\", \"''\")`", correct: false}
      - {text: "Construire la requête avec un `StringBuilder` plutôt qu'avec `+`", correct: false}
      - {text: "Construire la requête avec `String.format` et un `%s`", correct: false}
    answer: |-
      ```java
      PreparedStatement requete = connexion.prepareStatement("SELECT * FROM client WHERE nom = ?");
      requete.setString(1, nom);
      requete.executeQuery();
      ```
      Un nom comme `' OR '1'='1` change le sens de la requête (injection SQL). Le paramètre est transmis séparément de la
      requête et ne peut pas en modifier la structure.
  - key: bug-journal
    format: bug-fix
    question: |-
      Le profilage montre que ce message coûte cher, alors que le niveau `debug` est désactivé en production :
      ```java
      log.debug("État du panier : " + panier.detailComplet());
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`log.debug(\"État du panier : {}\", panier);`", correct: true}
      - {text: "`log.debug(\"État du panier : \".concat(panier.detailComplet()));`", correct: false}
      - {text: "`log.debug(String.format(\"État du panier : %s\", panier.detailComplet()));`", correct: false}
      - {text: "`log.info(\"État du panier : \" + panier.detailComplet());`", correct: false}
    answer: |-
      ```java
      log.debug("État du panier : {}", panier);
      ```
      La concaténation est évaluée avant l'appel, même si le message n'est pas écrit. Avec un paramètre, le journal ne
      construit le texte (et n'appelle `toString`) que si le niveau est actif.
  - key: bug-virgule-finale
    format: bug-fix
    question: |-
      La liste affichée se termine par une virgule en trop : `rouge, vert, bleu, `.
      ```java
      StringBuilder sb = new StringBuilder();
      for (String c : couleurs) {
          sb.append(c).append(", ");
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`String texte = String.join(\", \", couleurs);`", correct: true}
      - {text: "`String texte = sb.toString().strip();`", correct: false}
      - {text: "`String texte = sb.toString().replace(\", \", \"\");`", correct: false}
      - {text: "`sb.append(\", \").append(c)` à chaque tour", correct: false}
    answer: |-
      ```java
      String texte = String.join(", ", couleurs);
      ```
      `String.join` ne place le séparateur qu'entre les éléments. (`StringJoiner` permet en plus un préfixe et un
      suffixe.)
