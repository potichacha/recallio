notion: string-concatenation
cards:
  - key: string-toujours-eviter
    format: course
    question: Le `+` sur les String est-il toujours à éviter ?
    answer: Non, hors boucle il est optimisé (invokedynamic depuis Java 9) ; c'est en boucle qu'il faut StringBuilder.
  - key: code-string-null-system-out-println
    format: code-output
    question: '`String n = null; System.out.println(n + "a");`'
    answer: '`nulla`. Et `null instanceof Object` vaut `false`.'
