notion: system-runtime
lesson: |-
  `System` et `Runtime` donnent accès à l'environnement de la JVM :

  | Méthode | Rôle |
  |---|---|
  | `System.getenv("PORT")` | une variable d'environnement, ou `null` |
  | `System.getProperty("java.version")` | une propriété système (`-Dcle=valeur`) ; `getProperty(cle, defaut)` |
  | `System.currentTimeMillis()` | l'heure murale, en millisecondes depuis 1970 |
  | `System.nanoTime()` | un compteur **monotone**, pour mesurer une durée |
  | `System.arraycopy(src, i, dst, j, n)` | copie rapide entre tableaux |
  | `System.lineSeparator()` | `\n` ou `\r\n` selon le système |
  | `System.exit(code)` | arrête la JVM |
  | `Runtime.getRuntime().availableProcessors()` | le nombre de processeurs disponibles |
  | `Runtime.getRuntime().maxMemory()` | la taille maximale du tas |
  | `Runtime.getRuntime().addShutdownHook(thread)` | une action à l'arrêt de la JVM |

  ```java
  long debut = System.nanoTime();
  traiter();
  Duration duree = Duration.ofNanos(System.nanoTime() - debut);

  int port = Integer.parseInt(Objects.requireNonNullElse(System.getenv("PORT"), "8080"));
  ```

  - **Mesurer une durée** : `nanoTime`, jamais `currentTimeMillis`, qui peut reculer si l'heure du système est
    corrigée. Pour l'heure courante dans le code métier : une `Clock` injectée.
  - Une variable d'environnement absente vaut `null` : on prévoit un défaut ou une erreur claire au démarrage.
  - `System.exit` n'a rien à faire dans une bibliothèque ou un service : il tue la JVM entière, sans laisser l'appelant
    décider.
  - Un framework (Quarkus, Spring) lit déjà la configuration depuis l'environnement : on passe par lui plutôt que par
    `getenv` dispersés.

  **Piège classique** : mesurer un temps de réponse avec `currentTimeMillis`. Une synchronisation NTP peut donner une
  durée négative.

  **En entretien** : « `nanoTime` pour mesurer, `currentTimeMillis` (ou une `Clock`) pour dater ; `getenv` renvoie `null`
  si la variable manque. »
cards:
  - key: nano-vs-millis
    format: course
    question: Quelle différence entre `System.nanoTime()` et `System.currentTimeMillis()` ?
    answer: '`currentTimeMillis` donne l''heure murale (qui peut sauter si l''horloge du système est corrigée) ; `nanoTime` est un compteur monotone, sans origine fixe, fait pour mesurer des durées.'
  - key: getenv-null
    format: course
    question: Que renvoie `System.getenv("PORT")` si la variable n'est pas définie ?
    answer: '`null` : il faut prévoir une valeur par défaut ou échouer clairement au démarrage.'
  - key: exit
    format: course
    question: Pourquoi éviter `System.exit` dans une bibliothèque ?
    answer: Il arrête toute la JVM, y compris le serveur ou les tests qui l'appellent ; une exception laisse l'appelant décider.
  - key: proprietes
    format: course
    question: Quelle différence entre une propriété système et une variable d'environnement ?
    answer: Une propriété système est propre à la JVM (`-Dcle=valeur`, `System.getProperty`) ; une variable d'environnement vient du processus et du système (`System.getenv`).
  - key: vf-nano-heure
    format: true-false
    question: "`System.nanoTime()` donne l'heure actuelle en nanosecondes depuis 1970."
    truth: false
    answer: Son origine est arbitraire ; seule la différence entre deux valeurs a un sens.
  - key: vf-millis-recule
    format: true-false
    question: "`System.currentTimeMillis()` peut reculer."
    truth: true
    answer: Si l'horloge du système est corrigée (NTP, changement manuel).
  - key: vf-arraycopy
    format: true-false
    question: "`System.arraycopy` peut copier une partie d'un tableau vers un autre."
    truth: true
    answer: On donne la source, sa position, la destination, sa position et la longueur.
  - key: vf-processeurs
    format: true-false
    question: "`availableProcessors()` tient compte des limites d'un conteneur Docker."
    truth: true
    answer: Les JVM récentes respectent les limites de CPU du conteneur (*container awareness*).
  - key: qcm-mesurer
    format: multiple-choice
    question: Comment mesurer la durée d'un traitement ?
    choices:
      - text: "La différence de deux `System.nanoTime()`"
        correct: true
      - text: "La différence de deux `System.currentTimeMillis()`"
        correct: false
      - text: "La différence de deux `LocalDateTime.now()`"
        correct: false
      - text: "`Runtime.getRuntime().totalMemory()`"
        correct: false
    answer: Seul `nanoTime` est monotone et précis.
  - key: qcm-defaut
    format: multiple-choice
    question: Comment lire une propriété système avec une valeur par défaut ?
    choices:
      - text: "`System.getProperty(\"mode\", \"production\")`"
        correct: true
      - text: "`System.getProperty(\"mode\").orElse(\"production\")`"
        correct: false
      - text: "`System.getenv(\"mode\", \"production\")`"
        correct: false
      - text: "`System.property(\"mode\")`"
        correct: false
    answer: '`getProperty` a une surcharge avec défaut ; `getenv` non.'
  - key: qcm-pool
    format: multiple-choice
    question: Comment dimensionner un pool de threads de calcul selon la machine ?
    choices:
      - text: "`Runtime.getRuntime().availableProcessors()`"
        correct: true
      - text: "`Runtime.getRuntime().maxMemory()`"
        correct: false
      - text: "Une valeur fixe de 200"
        correct: false
      - text: "`System.nanoTime() % 16`"
        correct: false
    answer: Pour du calcul pur, autant de threads que de processeurs.
  - key: qcm-arret
    format: multiple-choice
    question: Comment exécuter une action quand la JVM s'arrête normalement ?
    choices:
      - text: "`Runtime.getRuntime().addShutdownHook(new Thread(action))`"
        correct: true
      - text: "Redéfinir `finalize()`"
        correct: false
      - text: "`System.exit(0)` en fin de `main`"
        correct: false
      - text: "`System.gc()`"
        correct: false
    answer: Un framework offre aussi ses propres événements d'arrêt (`@PreDestroy`, `ShutdownEvent`).
  - key: code-getenv
    format: code-output
    question: |-
      ```java
      System.out.println(System.getenv("VARIABLE_QUI_N_EXISTE_PAS_42") + " " + System.getProperty("absent.xyz", "défaut"));
      ```
    answer: '`null défaut`.'
    check:
      output: "null défaut"
  - key: code-arraycopy
    format: code-output
    question: |-
      ```java
      int[] source = {1, 2, 3, 4};
      int[] destination = new int[4];
      System.arraycopy(source, 1, destination, 0, 3);
      System.out.println(Arrays.toString(destination));
      ```
    answer: '`[2, 3, 4, 0]` : trois éléments copiés depuis l''indice 1.'
    check:
      output: "[2, 3, 4, 0]"
  - key: code-processeurs
    format: code-output
    question: |-
      ```java
      System.out.println(Runtime.getRuntime().availableProcessors() > 0);
      ```
    answer: '`true` : il y a toujours au moins un processeur disponible.'
    check:
      output: "true"
  - key: code-version
    format: code-output
    question: |-
      ```java
      System.out.println(Integer.parseInt(System.getProperty("java.specification.version")) >= 17);
      ```
    answer: '`true` sur toute JVM récente : la propriété donne la version de la plateforme (`25`).'
    check:
      output: "true"
  - key: bug-millis
    format: bug-fix
    question: |-
      Le tableau de bord affiche parfois des temps de réponse négatifs :
      ```java
      long debut = System.currentTimeMillis();
      traiter(requete);
      long duree = System.currentTimeMillis() - debut;
      ```
    answer: |-
      ```java
      long debut = System.nanoTime();
      traiter(requete);
      Duration duree = Duration.ofNanos(System.nanoTime() - debut);
      ```
      L'heure murale peut reculer lors d'une synchronisation. `nanoTime` est monotone. (Avec Micrometer, un `Timer` fait
      la mesure.)
  - key: bug-exit
    format: bug-fix
    question: |-
      Une bibliothèque d'import arrête tout le serveur quand un fichier est invalide :
      ```java
      if (!valide(fichier)) {
          System.err.println("fichier invalide");
          System.exit(1);
      }
      ```
    answer: |-
      ```java
      if (!valide(fichier)) {
          throw new FichierInvalide(fichier);
      }
      ```
      `System.exit` tue la JVM entière. Une exception laisse l'appelant (un serveur, un test) décider quoi faire.
  - key: bug-getenv
    format: bug-fix
    question: |-
      Le service plante au démarrage avec une `NumberFormatException: Cannot parse null string` :
      ```java
      int port = Integer.parseInt(System.getenv("PORT"));
      ```
    answer: |-
      ```java
      int port = Integer.parseInt(Objects.requireNonNullElse(System.getenv("PORT"), "8080"));
      ```
      Une variable absente vaut `null`. On donne un défaut (ou un message explicite) ; dans Quarkus, on déclarerait
      `quarkus.http.port=${PORT:8080}`.
  - key: bug-pool-fixe
    format: bug-fix
    question: |-
      Ce pool de calcul surcharge les petites machines et sous-utilise les grandes :
      ```java
      ExecutorService pool = Executors.newFixedThreadPool(8);
      ```
    answer: |-
      ```java
      ExecutorService pool = Executors.newFixedThreadPool(Runtime.getRuntime().availableProcessors());
      ```
      Pour du calcul, la bonne taille dépend du nombre de processeurs, que la JVM connaît (y compris les limites d'un
      conteneur).
