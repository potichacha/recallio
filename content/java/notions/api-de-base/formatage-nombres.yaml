notion: formatage-nombres
lesson: |-
  `java.text.NumberFormat` affiche (et lit) des nombres selon les conventions d'une **locale** :

  ```java
  NumberFormat.getInstance(Locale.US).format(1234567.891);          // "1,234,567.891"
  NumberFormat.getCurrencyInstance(Locale.US).format(1234.5);       // "$1,234.50"
  NumberFormat.getCurrencyInstance(Locale.FRANCE).format(1234.5);   // "1 234,50 €" (espaces insécables)
  NumberFormat.getPercentInstance(Locale.US).format(0.256);         // "26%"
  NumberFormat.getCompactNumberInstance(Locale.US, NumberFormat.Style.SHORT).format(12_000);   // "12K" (Java 12)

  DecimalFormat motif = new DecimalFormat("#,##0.00", DecimalFormatSymbols.getInstance(Locale.US));
  motif.format(0.5);                                                 // "0.50"
  ```

  - **Motifs** de `DecimalFormat` : `0` chiffre obligatoire, `#` chiffre facultatif, `,` séparateur de milliers, `.`
    séparateur décimal, `%` pourcentage.
  - Les séparateurs viennent de la locale : la France utilise une virgule décimale et un espace (insécable) pour les
    milliers.
  - `NumberFormat` et `DecimalFormat` **ne sont pas thread-safe** : pas d'instance `static` partagée entre threads.
  - `parse` lit un texte localisé, mais s'arrête au premier caractère invalide sans erreur (`"12abc"` donne 12) : on
    vérifie avec une `ParsePosition` que tout le texte a été lu.
  - Pour un montant, on formate un `BigDecimal` (pas un `double`), et l'on garde la devise avec la valeur.

  **Piège classique** : un `static final DecimalFormat` partagé par les threads d'un serveur, qui produit de temps en
  temps des nombres corrompus.

  **En entretien** : « `NumberFormat` pour afficher selon la locale, des motifs avec `DecimalFormat` ; ni l'un ni l'autre
  n'est thread-safe. »
cards:
  - key: role
    format: course
    question: À quoi sert `NumberFormat` ?
    answer: À formater et lire des nombres, des montants et des pourcentages selon les conventions d'une locale (séparateurs, symbole monétaire).
  - key: motifs
    format: course
    question: Que signifie le motif `"#,##0.00"` ?
    answer: Des milliers séparés, au moins un chiffre avant la virgule (`0`), et exactement deux décimales.
  - key: thread-safety
    format: course
    question: "`DecimalFormat` est-il thread-safe ?"
    answer: "Non : une instance partagée entre threads peut produire des résultats corrompus. On en crée une par usage, ou par thread."
  - key: parse-partiel
    format: course
    question: Que renvoie `NumberFormat.getInstance(Locale.US).parse("12abc")` ?
    answer: "12 : `parse` s'arrête au premier caractère invalide sans erreur ; une `ParsePosition` permet de vérifier que tout le texte a été lu."
  - key: vf-locale
    format: true-false
    question: Le formatage d'un nombre avec `NumberFormat` dépend de la locale.
    truth: true
    answer: Séparateurs décimal et de milliers, position du symbole monétaire.
  - key: vf-thread-safe
    format: true-false
    question: On peut partager un `static final NumberFormat` entre tous les threads d'un serveur.
    truth: false
    answer: '`NumberFormat` garde un état pendant le formatage.'
  - key: vf-compact
    format: true-false
    question: Java sait afficher `12000` sous la forme `12K`.
    truth: true
    answer: Avec `NumberFormat.getCompactNumberInstance` (Java 12).
  - key: vf-zero-diese
    format: true-false
    question: Dans un motif, `#` affiche toujours un chiffre, même zéro.
    truth: false
    answer: '`#` est facultatif ; c''est `0` qui force un chiffre.'
  - key: qcm-devise
    format: multiple-choice
    question: Comment afficher un montant en dollars américains ?
    choices:
      - text: "`NumberFormat.getCurrencyInstance(Locale.US).format(montant)`"
        correct: true
      - text: "`\"$\" + montant`"
        correct: false
      - text: "`String.format(\"%d $\", montant)`"
        correct: false
      - text: "`NumberFormat.getInstance().format(montant) + \"USD\"`"
        correct: false
    answer: Le format monétaire place le symbole et les séparateurs selon la locale.
  - key: qcm-motif
    format: multiple-choice
    question: "Que donne `new DecimalFormat(\"000\").format(7)` ?"
    choices:
      - text: "\"007\""
        correct: true
      - text: "\"7\""
        correct: false
      - text: "\"7.00\""
        correct: false
      - text: "\"000\""
        correct: false
    answer: Chaque `0` est un chiffre obligatoire.
  - key: qcm-pourcentage
    format: multiple-choice
    question: "Que donne `NumberFormat.getPercentInstance(Locale.US).format(0.256)` ?"
    choices:
      - text: "\"26%\""
        correct: true
      - text: "\"0.256%\""
        correct: false
      - text: "\"25.6%\""
        correct: false
      - text: "\"256%\""
        correct: false
    answer: La valeur est multipliée par 100 et arrondie sans décimale par défaut.
  - key: qcm-concurrence
    format: multiple-choice
    question: Comment utiliser `DecimalFormat` dans un service appelé par plusieurs threads ?
    choices:
      - text: "Créer une instance à chaque appel"
        correct: true
      - text: "Une instance par thread (`ThreadLocal`)"
        correct: true
      - text: "Une instance `static final` partagée"
        correct: false
      - text: "Une instance partagée, déclarée `volatile`"
        correct: false
    answer: '`volatile` ne protège pas l''état interne pendant le formatage.'
  - key: code-devise
    format: code-output
    question: |-
      ```java
      import java.text.NumberFormat;
      System.out.println(NumberFormat.getCurrencyInstance(Locale.US).format(1234.5));
      ```
    answer: '`$1,234.50`.'
    check:
      output: "$1,234.50"
  - key: code-motif
    format: code-output
    question: |-
      ```java
      import java.text.*;
      DecimalFormat f = new DecimalFormat("#,##0.00", DecimalFormatSymbols.getInstance(Locale.US));
      System.out.println(f.format(1234567.891) + " " + f.format(0.5));
      ```
    answer: '`1,234,567.89 0.50`.'
    check:
      output: "1,234,567.89 0.50"
  - key: code-pourcentage
    format: code-output
    question: |-
      ```java
      import java.text.NumberFormat;
      System.out.println(NumberFormat.getPercentInstance(Locale.US).format(0.256));
      ```
    answer: '`26%`.'
    check:
      output: "26%"
  - key: code-compact
    format: code-output
    question: |-
      ```java
      import java.text.NumberFormat;
      NumberFormat f = NumberFormat.getCompactNumberInstance(Locale.US, NumberFormat.Style.SHORT);
      System.out.println(f.format(12_000) + " " + f.format(1_000_000));
      ```
    answer: '`12K 1M`.'
    check:
      output: "12K 1M"
  - key: bug-partage
    format: bug-fix
    question: |-
      Sous charge, des montants s'affichent corrompus :
      ```java
      private static final DecimalFormat FORMAT = new DecimalFormat("#,##0.00");
      String afficher(BigDecimal m) { return FORMAT.format(m); }
      ```
    answer: |-
      ```java
      String afficher(BigDecimal m) {
          return new DecimalFormat("#,##0.00").format(m);
      }
      ```
      `DecimalFormat` n'est pas thread-safe. Une instance par appel (ou par thread) supprime le partage.
  - key: bug-parse-partiel
    format: bug-fix
    question: |-
      La saisie `"12abc"` est acceptée comme 12 :
      ```java
      Number n = NumberFormat.getInstance(Locale.FRANCE).parse(saisie);
      ```
    answer: |-
      ```java
      ParsePosition position = new ParsePosition(0);
      Number n = NumberFormat.getInstance(Locale.FRANCE).parse(saisie.strip(), position);
      if (n == null || position.getIndex() != saisie.strip().length()) {
          throw new SaisieInvalide(saisie);
      }
      ```
      `parse` s'arrête au premier caractère invalide sans erreur. La `ParsePosition` dit jusqu'où le texte a été lu.
  - key: bug-locale-utilisateur
    format: bug-fix
    question: |-
      Un utilisateur américain voit `1 234,50 €` au lieu de `$1,234.50` pour une commande en dollars :
      ```java
      String affichage = NumberFormat.getCurrencyInstance(Locale.FRANCE).format(montant);
      ```
    answer: |-
      ```java
      NumberFormat format = NumberFormat.getCurrencyInstance(localeUtilisateur);
      format.setCurrency(commande.devise());
      String affichage = format.format(commande.montant());
      ```
      La locale fixe les conventions d'affichage de l'utilisateur ; la devise vient de la commande. Ce sont deux
      informations différentes.
  - key: bug-concat-manuel
    format: bug-fix
    question: |-
      Simplifiez cet affichage de pourcentage :
      ```java
      String taux = Math.round(ratio * 100) + "%";
      ```
    answer: |-
      ```java
      String taux = NumberFormat.getPercentInstance(locale).format(ratio);
      ```
      `getPercentInstance` multiplie, arrondit et place le symbole selon la locale (certaines langues mettent un espace
      avant `%`).
