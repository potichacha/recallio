notion: cache-integer
lesson: |-
  `Integer.valueOf(n)`, donc l'autoboxing, renvoie une instance **mise en cache** pour les valeurs de **-128 à 127** :
  deux `Integer` de même petite valeur sont alors le **même objet**. Au-delà, chaque appel crée un nouvel objet.

  ```java
  Integer a = 127, b = 127;
  a == b;               // true  : même objet du cache
  Integer c = 128, d = 128;
  c == d;               // false : deux objets
  c.equals(d);          // true  : seule comparaison fiable
  c <= d && c >= d;     // true  : <= et >= déballent
  ```

  | Enveloppe | Cache |
  |---|---|
  | `Integer` | -128 à 127 (borne haute réglable : `-XX:AutoBoxCacheMax=...`) |
  | `Long`, `Short`, `Byte` | -128 à 127 |
  | `Character` | 0 à 127 |
  | `Boolean` | `TRUE` et `FALSE` |
  | `Double`, `Float` | aucun |

  Ce cache existe pour économiser la mémoire sur les petites valeurs très fréquentes. Il ne change pas la règle : on
  compare des enveloppes avec **`equals`** (ou `Objects.equals` si `null` est possible), ou on compare des primitifs.

  **Piège classique** : un test unitaire avec des petites valeurs (`id = 1`) où `==` « marche », et une production où les
  identifiants dépassent 127.

  **En entretien** : « `Integer` met en cache -128 à 127, d'où des `==` qui semblent fonctionner ; on compare toujours
  les enveloppes avec `equals`. »
cards:
  - key: explique-cache-integer
    format: course
    question: Explique le cache Integer.
    answer: Java cache les Integer de -128 à 127 ; dans cette plage `==` est true, au-delà false.
  - key: integer-valueof-rapport-new-integer
    format: course
    question: Que fait `Integer.valueOf` par rapport à `new Integer` ?
    answer: valueOf utilise le cache (-128 à 127) ; le constructeur est déprécié pour suppression.
  - key: autres-caches
    format: course
    question: Quelles autres enveloppes ont un cache ?
    answer: '`Long`, `Short` et `Byte` (-128 à 127), `Character` (0 à 127) et `Boolean` (`TRUE`, `FALSE`) ; `Double` et `Float` n''en ont pas.'
  - key: reglage
    format: course
    question: Peut-on agrandir le cache des `Integer` ?
    answer: Oui, sa borne haute avec l'option `-XX:AutoBoxCacheMax=<n>` ; mais un code correct ne doit pas en dépendre.
  - key: integer-1000-egal
    format: true-false
    question: Avec `Integer a = 1000, b = 1000;`, l'expression `a == b` vaut `true`.
    truth: false
    answer: "1000 est hors du cache des Integer (-128 à 127) : l'autoboxing crée deux objets distincts, que `==` compare par référence."
  - key: vf-double-cache
    format: true-false
    question: "`Double` met en cache ses petites valeurs, comme `Integer`."
    truth: false
    answer: '`Double.valueOf` crée toujours un nouvel objet.'
  - key: vf-moins-128
    format: true-false
    question: "Avec `Integer a = -128, b = -128;`, `a == b` vaut `true`."
    truth: true
    answer: "-128 est la borne basse du cache."
  - key: vf-equals-cache
    format: true-false
    question: "`equals` donne le bon résultat entre deux `Integer`, dans le cache comme en dehors."
    truth: true
    answer: Il compare les valeurs.
  - key: vaut-integer-valueof-127-integer-valueof
    format: multiple-choice
    question: Que vaut `Integer.valueOf(127) == Integer.valueOf(127)` ?
    choices:
      - text: '`true`'
        correct: true
      - text: '`false`'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: '`Integer.valueOf` réutilise des instances en cache pour les valeurs de -128 à 127 : les deux appels renvoient le même objet. Avec 128, le résultat serait `false` : il faut comparer des `Integer` avec `equals()`.'
  - key: qcm-plage
    format: multiple-choice
    question: Quelle est la plage par défaut du cache des `Integer` ?
    choices:
      - text: "-128 à 127"
        correct: true
      - text: "0 à 255"
        correct: false
      - text: "-1000 à 1000"
        correct: false
      - text: "0 à 127"
        correct: false
    answer: 0 à 127, c'est celle de `Character`.
  - key: qcm-fiable
    format: multiple-choice
    question: Quelles comparaisons de deux `Integer` non nuls sont fiables quelle que soit leur valeur ?
    choices:
      - text: "`a.equals(b)`"
        correct: true
      - text: "`a.intValue() == b.intValue()`"
        correct: true
      - text: "`a == b`"
        correct: false
      - text: "`System.identityHashCode(a) == System.identityHashCode(b)`"
        correct: false
    answer: '`==` et `identityHashCode` comparent les identités.'
  - key: qcm-character
    format: multiple-choice
    question: "Avec `Character a = 'é', b = 'é';` (code 233), que vaut `a == b` ?"
    choices:
      - text: "`false`"
        correct: true
      - text: "`true`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
      - text: "Une exception"
        correct: false
    answer: Le cache de `Character` s'arrête à 127.
  - key: code-integer-1000-b-1000-system
    format: code-output
    question: |-
      ```java
      Integer a = 1000, b = 1000;
      System.out.println((a == b) + " " + a.equals(b) + " " + (a <= b && a >= b));
      ```
    answer: '`false true true`. `==` compare les références (hors cache) ; `<=` et `>=` déballent en int.'
    check:
      output: "false true true"
  - key: code-long-x-127l-127l-z
    format: code-output
    question: '`Long x = 127L, y = 127L, z = 128L, w = 128L;` que valent `x == y` et `z == w` ?'
    answer: '`true` et `false` : Long a aussi un cache de -128 à 127.'
    check:
      code: |-
        Long x = 127L, y = 127L, z = 128L, w = 128L;
        System.out.println((x == y) + " " + (z == w));
      output: "true false"
  - key: code-double
    format: code-output
    question: |-
      ```java
      Double a = 1.0, b = 1.0;
      System.out.println((a == b) + " " + a.equals(b));
      ```
    answer: '`false true` : `Double` n''a pas de cache.'
    check:
      output: "false true"
  - key: code-character
    format: code-output
    question: |-
      ```java
      Character c1 = 'a', c2 = 'a';
      Character e1 = 'é', e2 = 'é';
      System.out.println((c1 == c2) + " " + (e1 == e2));
      ```
    answer: '`true false` : `a` (97) est dans le cache de `Character`, `é` (233) non.'
    check:
      output: "true false"
  - key: bug-quantites
    format: bug-fix
    question: |-
      Les commandes de plus de 127 articles ne sont jamais reconnues comme complètes :
      ```java
      if (commande.quantiteLivree() == commande.quantiteCommandee()) {   // deux Integer
          cloturer(commande);
      }
      ```
    answer: |-
      ```java
      if (commande.quantiteLivree().equals(commande.quantiteCommandee())) {
          cloturer(commande);
      }
      ```
      Jusqu'à 127, les deux `Integer` viennent du cache et `==` « marche » ; au-delà, ce sont deux objets.
  - key: bug-liste-doublons
    format: bug-fix
    question: |-
      Cette détection de doublons rate les grands identifiants :
      ```java
      for (int i = 0; i < ids.size(); i++)
          for (int j = i + 1; j < ids.size(); j++)
              if (ids.get(i) == ids.get(j)) doublon(ids.get(i));   // List<Integer>
      ```
    answer: |-
      ```java
      Set<Integer> vus = new HashSet<>();
      for (Integer id : ids) {
          if (!vus.add(id)) doublon(id);
      }
      ```
      `==` compare les références des `Integer`. Un `HashSet` utilise `equals` et `hashCode`, et trouve en plus les
      doublons en temps linéaire.
  - key: bug-map-comparaison
    format: bug-fix
    question: |-
      Deux stocks identiques sont signalés comme différents :
      ```java
      if (avant.get(produit) != apres.get(produit)) {   // Map<String, Integer>
          signalerChangement(produit);
      }
      ```
    answer: |-
      ```java
      if (!Objects.equals(avant.get(produit), apres.get(produit))) {
          signalerChangement(produit);
      }
      ```
      `!=` compare les références. `Objects.equals` compare les valeurs et gère le cas où le produit manque d'un côté.
  - key: bug-test-trompeur
    format: bug-fix
    question: |-
      Ce test passe alors que le code compare des `Integer` avec `==` :
      ```java
      @Test
      void deuxCommandesDeMemeQuantiteSontEquivalentes() {
          assertTrue(equivalentes(commande(5), commande(5)));
      }
      ```
    answer: |-
      ```java
      @Test
      void deuxCommandesDeMemeQuantiteSontEquivalentes() {
          assertTrue(equivalentes(commande(5), commande(5)));
          assertTrue(equivalentes(commande(1_000), commande(1_000)));
      }
      ```
      5 est dans le cache : le test ne peut pas voir le bug. Une valeur hors du cache le révèle (et l'on corrige le code
      avec `equals`).
