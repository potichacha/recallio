notion: cache-integer
cards:
  - key: explique-cache-integer
    format: course
    question: Explique le cache Integer.
    answer: Java cache les Integer de -128 à 127 ; dans cette plage `==` est true, au-delà false.
  - key: integer-valueof-rapport-new-integer
    format: course
    question: Que fait `Integer.valueOf` par rapport à `new Integer` ?
    answer: valueOf utilise le cache (-128 à 127) ; le constructeur est déprécié pour suppression.
  - key: vaut-integer-valueof-127-integer-valueof
    format: multiple-choice
    question: Que vaut `Integer.valueOf(127) == Integer.valueOf(127)` ?
    choices:
      - text: '`true`'
        correct: true
      - text: '`false`'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: '`Integer.valueOf` réutilise des instances en cache pour les valeurs de -128 à 127 : les deux appels renvoient le même objet. Avec 128, le résultat serait `false` : il faut comparer des `Integer` avec `equals()`.'
  - key: code-integer-1000-b-1000-system
    format: code-output
    question: |-
      ```java
      Integer a = 1000, b = 1000;
      System.out.println((a == b) + " " + a.equals(b) + " " + (a <= b && a >= b));
      ```
    answer: '`false true true`. `==` compare les références (hors cache) ; `<=` et `>=` déballent en int.'
  - key: code-long-x-127l-127l-z
    format: code-output
    question: '`Long x = 127L, y = 127L, z = 128L, w = 128L;` que valent `x == y` et `z == w` ?'
    answer: '`true` et `false` : Long a aussi un cache de -128 à 127.'
