notion: cache-integer
lesson: |-
  `Integer.valueOf(n)`, donc l'autoboxing, renvoie une instance **mise en cache** pour les valeurs de **-128 à 127** :
  deux `Integer` de même petite valeur sont alors le **même objet**. Au-delà, chaque appel crée un nouvel objet.

  ```java
  Integer a = 127, b = 127;
  a == b;               // true  : même objet du cache
  Integer c = 128, d = 128;
  c == d;               // false : deux objets
  c.equals(d);          // true  : seule comparaison fiable
  c <= d && c >= d;     // true  : <= et >= déballent
  ```

  | Enveloppe | Cache |
  |---|---|
  | `Integer` | -128 à 127 (borne haute réglable : `-XX:AutoBoxCacheMax=...`) |
  | `Long`, `Short`, `Byte` | -128 à 127 |
  | `Character` | 0 à 127 |
  | `Boolean` | `TRUE` et `FALSE` |
  | `Double`, `Float` | aucun |

  Ce cache existe pour économiser la mémoire sur les petites valeurs très fréquentes. Il ne change pas la règle : on
  compare des enveloppes avec **`equals`** (ou `Objects.equals` si `null` est possible), ou on compare des primitifs.

  **Piège classique** : un test unitaire avec des petites valeurs (`id = 1`) où `==` « marche », et une production où les
  identifiants dépassent 127.

  **En entretien** : « `Integer` met en cache -128 à 127, d'où des `==` qui semblent fonctionner ; on compare toujours
  les enveloppes avec `equals`. »
cards:
  - key: explique-cache-integer
    format: course
    question: "Que fait le cache des `Integer` ?"
    choices:
      - {text: "`Integer.valueOf` réutilise les objets de -128 à 127 : `==` y vaut `true`, au-delà `false`", correct: true}
      - {text: "`Integer.valueOf` réutilise les objets de 0 à 255 : `==` y vaut `true`, au-delà `false`", correct: false}
      - {text: "Il garde les mille derniers `Integer` créés, pour les réutiliser plus vite ensuite", correct: false}
      - {text: "Il rend égaux par `==` tous les `Integer` de même valeur, quelle que soit la valeur", correct: false}
    answer: "Java met en cache les `Integer` de -128 à 127 : l'autoboxing et `valueOf` y renvoient le même objet, et `==` vaut `true` ; au-delà, deux objets distincts, et `false`."
  - key: integer-valueof-rapport-new-integer
    format: course
    question: Que fait `Integer.valueOf` par rapport à `new Integer` ?
    choices:
      - {text: "`valueOf` passe par le cache (-128 à 127) ; le constructeur, déprécié, crée toujours un objet", correct: true}
      - {text: "`valueOf` crée toujours un objet ; le constructeur, recommandé, passe par le cache", correct: false}
      - {text: "Aucune différence : `valueOf` se contente d'appeler le constructeur", correct: false}
      - {text: "`valueOf` analyse une chaîne ; le constructeur ne prend qu'un `int`", correct: false}
    answer: "`valueOf` utilise le cache (-128 à 127) ; le constructeur crée toujours un nouvel objet, et il est déprécié pour suppression."
  - key: autres-caches
    format: course
    question: Quelles autres enveloppes ont un cache ?
    choices:
      - {text: "`Long`, `Short`, `Byte`, `Character` et `Boolean` ; ni `Double` ni `Float`", correct: true}
      - {text: "Toutes les enveloppes, `Double` et `Float` compris, de -128 à 127", correct: false}
      - {text: "Aucune : le cache est propre à `Integer`, pour l'autoboxing des `int`", correct: false}
      - {text: "`Double` et `Float` seulement, pour leurs valeurs entières de -128 à 127", correct: false}
    answer: '`Long`, `Short` et `Byte` (-128 à 127), `Character` (0 à 127) et `Boolean` (`TRUE`, `FALSE`) ; `Double` et `Float` n''en ont pas.'
  - key: reglage
    format: course
    question: Peut-on agrandir le cache des `Integer` ?
    choices:
      - {text: "Oui, sa borne haute, avec l'option `-XX:AutoBoxCacheMax=<n>`", correct: true}
      - {text: "Non : -128 à 127 est fixé une fois pour toutes par la spécification", correct: false}
      - {text: "Oui, ses deux bornes, avec `Integer.setCacheSize(min, max)`", correct: false}
      - {text: "Oui, sa borne basse, avec l'option `-XX:IntegerCacheMin=<n>`", correct: false}
    answer: "Oui, sa borne haute avec l'option `-XX:AutoBoxCacheMax=<n>` (la spécification n'impose que -128 à 127 au minimum) ; mais un code correct ne doit pas en dépendre."
  - key: integer-1000-egal
    format: true-false
    question: Avec `Integer a = 1000, b = 1000;`, l'expression `a == b` vaut `true`.
    truth: false
    answer: "1000 est hors du cache des Integer (-128 à 127) : l'autoboxing crée deux objets distincts, que `==` compare par référence."
  - key: vf-double-cache
    format: true-false
    question: "`Double` met en cache ses petites valeurs, comme `Integer`."
    truth: false
    answer: '`Double.valueOf` crée toujours un nouvel objet.'
  - key: vf-moins-128
    format: true-false
    question: "Avec `Integer a = -128, b = -128;`, `a == b` vaut `true`."
    truth: true
    answer: "-128 est la borne basse du cache."
  - key: vf-equals-cache
    format: true-false
    question: "`equals` donne le bon résultat entre deux `Integer`, dans le cache comme en dehors."
    truth: true
    answer: Il compare les valeurs.
  - key: vaut-integer-valueof-127-integer-valueof
    format: multiple-choice
    question: Que vaut `Integer.valueOf(127) == Integer.valueOf(127)` ?
    choices:
      - text: '`true`'
        correct: true
      - text: '`false`'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: '`Integer.valueOf` réutilise des instances en cache pour les valeurs de -128 à 127 : les deux appels renvoient le même objet. Avec 128, le résultat serait `false` : il faut comparer des `Integer` avec `equals()`.'
  - key: qcm-plage
    format: multiple-choice
    question: Quelle est la plage par défaut du cache des `Integer` ?
    choices:
      - text: "-128 à 127"
        correct: true
      - text: "0 à 255"
        correct: false
      - text: "-1000 à 1000"
        correct: false
      - text: "0 à 127"
        correct: false
    answer: 0 à 127, c'est celle de `Character`.
  - key: qcm-fiable
    format: multiple-choice
    question: "Laquelle de ces comparaisons de deux `Integer` non nuls est fiable, quelle que soit leur valeur ?"
    choices:
      - {text: "`a.equals(b)`", correct: true}
      - {text: "`a == b`", correct: false}
      - {text: "`System.identityHashCode(a) == System.identityHashCode(b)`", correct: false}
      - {text: "`a.toString() == b.toString()`", correct: false}
    answer: "`equals` compare les valeurs, comme `a.intValue() == b.intValue()`. Les trois autres comparent des identités d'objets, qui dépendent du cache."
  - key: qcm-character
    format: multiple-choice
    question: "Avec `Character a = 'é', b = 'é';` (code 233), que vaut `a == b` ?"
    choices:
      - text: "`false`"
        correct: true
      - text: "`true`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
      - text: "Une exception"
        correct: false
    answer: Le cache de `Character` s'arrête à 127.
  - key: code-integer-1000-b-1000-system
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Integer a = 1000, b = 1000;
      System.out.println((a == b) + " " + a.equals(b) + " " + (a <= b && a >= b));
      ```
    choices:
      - {text: "`false true true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`false true false`", correct: false}
      - {text: "`false false true`", correct: false}
    answer: '`false true true`. `==` compare les références (hors cache) ; `<=` et `>=` déballent en int.'
    check:
      output: "false true true"
  - key: code-long-x-127l-127l-z
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Long x = 127L, y = 127L, z = 128L, w = 128L;
      System.out.println((x == y) + " " + (z == w));
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : `Long` a aussi un cache de -128 à 127, et `==` compare les références."
    check:
      code: |-
        Long x = 127L, y = 127L, z = 128L, w = 128L;
        System.out.println((x == y) + " " + (z == w));
      output: "true false"
  - key: code-double
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Double a = 1.0, b = 1.0;
      System.out.println((a == b) + " " + a.equals(b));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`true false`", correct: false}
      - {text: "`false false`", correct: false}
    answer: '`false true` : `Double` n''a pas de cache.'
    check:
      output: "false true"
  - key: code-character
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Character c1 = 'a', c2 = 'a';
      Character e1 = 'é', e2 = 'é';
      System.out.println((c1 == c2) + " " + (e1 == e2));
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: '`true false` : `a` (97) est dans le cache de `Character`, `é` (233) non.'
    check:
      output: "true false"
  - key: bug-quantites
    format: bug-fix
    question: |-
      Les commandes de plus de 127 articles ne sont jamais reconnues comme complètes :
      ```java
      if (commande.quantiteLivree() == commande.quantiteCommandee()) {   // deux Integer
          cloturer(commande);
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`commande.quantiteLivree().equals(commande.quantiteCommandee())`", correct: true}
      - {text: "`commande.quantiteLivree() == Integer.valueOf(commande.quantiteCommandee())`", correct: false}
      - {text: "Lancer la JVM avec `-XX:AutoBoxCacheMax=100000`, pour couvrir les quantités", correct: false}
      - {text: "Comparer les `System.identityHashCode` des deux quantités avec `==`", correct: false}
    answer: |-
      ```java
      if (commande.quantiteLivree().equals(commande.quantiteCommandee())) {
          cloturer(commande);
      }
      ```
      Jusqu'à 127, les deux `Integer` viennent du cache et `==` « marche » ; au-delà, ce sont deux objets.
  - key: bug-liste-doublons
    format: bug-fix
    question: |-
      Cette détection de doublons rate les grands identifiants :
      ```java
      for (int i = 0; i < ids.size(); i++)
          for (int j = i + 1; j < ids.size(); j++)
              if (ids.get(i) == ids.get(j)) doublon(ids.get(i));   // List<Integer>
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un `HashSet<Integer>` vus : `if (!vus.add(id)) doublon(id);`", correct: true}
      - {text: "Trier la liste avant la double boucle, en gardant le `==`", correct: false}
      - {text: "Agrandir le cache des `Integer` jusqu'au plus grand identifiant", correct: false}
      - {text: "Parcourir la liste avec un `Iterator` plutôt qu'avec des indices", correct: false}
    answer: |-
      ```java
      Set<Integer> vus = new HashSet<>();
      for (Integer id : ids) {
          if (!vus.add(id)) doublon(id);
      }
      ```
      `==` compare les références des `Integer`. Un `HashSet` utilise `equals` et `hashCode`, et trouve en plus les
      doublons en temps linéaire.
  - key: bug-map-comparaison
    format: bug-fix
    question: |-
      Deux stocks identiques sont signalés comme différents :
      ```java
      if (avant.get(produit) != apres.get(produit)) {   // Map<String, Integer>
          signalerChangement(produit);
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`!Objects.equals(avant.get(produit), apres.get(produit))`", correct: true}
      - {text: "`avant.get(produit) != Integer.valueOf(apres.get(produit))`", correct: false}
      - {text: "`!avant.containsValue(apres.get(produit))`", correct: false}
      - {text: "`System.identityHashCode(avant.get(produit)) != System.identityHashCode(apres.get(produit))`", correct: false}
    answer: |-
      ```java
      if (!Objects.equals(avant.get(produit), apres.get(produit))) {
          signalerChangement(produit);
      }
      ```
      `!=` compare les références. `Objects.equals` compare les valeurs et gère le cas où le produit manque d'un côté.
  - key: bug-test-trompeur
    format: bug-fix
    question: |-
      Ce test passe alors que le code compare des `Integer` avec `==` :
      ```java
      @Test
      void deuxCommandesDeMemeQuantiteSontEquivalentes() {
          assertTrue(equivalentes(commande(5), commande(5)));
      }
      ```
      Que faut-il ajouter au test ?
    choices:
      - {text: "Un cas hors du cache, comme `commande(1_000)`, qui révèle le bug", correct: true}
      - {text: "Un second cas à 5, pour confirmer le premier résultat", correct: false}
      - {text: "Un cas à 127, la plus grande valeur du cache des `Integer`", correct: false}
      - {text: "Un cas à 0, la valeur limite la plus fréquente en production", correct: false}
    answer: |-
      ```java
      @Test
      void deuxCommandesDeMemeQuantiteSontEquivalentes() {
          assertTrue(equivalentes(commande(5), commande(5)));
          assertTrue(equivalentes(commande(1_000), commande(1_000)));
      }
      ```
      5 est dans le cache : le test ne peut pas voir le bug. Une valeur hors du cache le révèle (et l'on corrige le code
      avec `equals`).
