notion: string-format
lesson: |-
  `String.format(gabarit, valeurs...)` (ou `gabarit.formatted(valeurs...)`, ou `System.out.printf`) remplit un gabarit
  avec des **spécificateurs** `%` :

  | Spécificateur | Pour | Exemple |
  |---|---|---|
  | `%s` | tout objet (`toString`) | `"%s"` → `Ada` |
  | `%d` | entier | `"%5d"` → `   42` ; `"%05d"` → `00042` |
  | `%f` | décimal | `"%.2f"` → `3.14` |
  | `%x` | hexadécimal | `"%x"` → `ff` |
  | `%-10s` | aligné à gauche sur 10 | `ab        ` |
  | `%n` | retour à la ligne du système | |
  | `%%` | le caractère `%` | |

  ```java
  String.format(Locale.FRANCE, "%.2f €", 3.14159);   // "3,14 €"
  String.format(Locale.ROOT, "%.2f", 3.14159);       // "3.14"
  "%-8s|%5d".formatted("pommes", 12);                // "pommes  |   12"
  ```

  - Le résultat dépend de la **locale** pour les nombres (`3,14` en France, `3.14` aux États-Unis) : pour un fichier ou
    un protocole, on la précise (`Locale.ROOT`) ; pour l'affichage, on prend celle de l'utilisateur.
  - Un type incompatible (`%d` avec un `double`) lève une `IllegalFormatConversionException` ; une valeur manquante,
    une `MissingFormatArgumentException`.
  - Pour les journaux, on préfère les paramètres du logger (`log.info("id={}", id)`), évalués seulement si nécessaire.

  **Piège classique** : écrire un CSV avec `String.format("%.2f", prix)` sans locale. Sur un poste français, on obtient
  `3,14`, et la virgule décimale casse les colonnes.

  **En entretien** : « `%s`, `%d`, `%.2f`, `%n` ; et une locale explicite dès que le texte n'est pas destiné à un humain. »
tour:
  - title: Formater du texte
    text: |-
      `String.format("%s a %d ans", nom, age)` construit une chaîne à partir d'un **modèle** : `%s` pour une chaîne,
      `%d` pour un entier, `%.2f` pour un réel à deux décimales, `%n` pour un retour à la ligne, `%5d` pour une largeur.
      `"…".formatted(…)` fait la même chose, et `System.out.printf` affiche directement.

      Le format dépend de la **locale** : en français, une virgule sépare les décimales. On la précise quand le texte
      est destiné à un lecteur : `String.format(Locale.FRANCE, …)`.
    example:
      files:
        Main.java: |-
          void main() {
              String nom = "Ada";
              int age = 36;
              double moyenne = 15.456;
              IO.println(String.format("%s a %d ans", nom, age));
              IO.println("%s : %.2f".formatted("moyenne", moyenne));
              IO.println(String.format(Locale.FRANCE, "%.2f €", 1234.5));
              IO.println(String.format("[%5d] [%-6s] [%05.1f]", 42, "ok", 3.14159));
          }
      output: |-
        Ada a 36 ans
        moyenne : 15.46
        1234,50 €
        [   42] [ok    ] [003.1]
cards:
  - key: specificateurs
    format: course
    question: "Que formatent `%s`, `%d`, `%.2f` et `%n` ?"
    choices:
      - {text: "Un texte, un entier, un décimal à deux chiffres après la virgule, un retour à la ligne", correct: true}
      - {text: "Une chaîne, un `double`, un décimal arrondi à l'entier, un caractère nul", correct: false}
      - {text: "Un texte, une date, un décimal coupé en deux parties, un nombre entier", correct: false}
      - {text: "Un symbole, un décimal, un texte de deux caractères, un saut de page", correct: false}
    answer: "`%s` (texte), `%d` (entier), `%.2f` (décimal, deux chiffres), `%n` (retour à la ligne) ; et aussi `%x` (hexadécimal) et `%%` (le caractère %)."
  - key: largeur
    format: course
    question: Que signifient `%5d`, `%05d` et `%-10s` ?
    choices:
      - {text: "Un entier sur 5 caractères à droite ; complété par des zéros ; un texte sur 10 à gauche", correct: true}
      - {text: "Un entier sur 5 caractères à gauche ; complété par des espaces ; un texte sur 10 à droite", correct: false}
      - {text: "Un entier de 5 chiffres au plus ; le chiffre 0 puis 5 ; un texte tronqué à 10 caractères", correct: false}
      - {text: "5 décimales ; 5 zéros après la virgule ; un texte de moins de 10 caractères", correct: false}
    answer: Un entier sur 5 caractères aligné à droite ; complété par des zéros ; un texte sur 10 caractères aligné à gauche.
  - key: locale
    format: course
    question: Pourquoi préciser une `Locale` dans `String.format` ?
    choices:
      - {text: "Le séparateur décimal dépend de la locale : `3,14` en France, `3.14` aux États-Unis", correct: true}
      - {text: "Sans locale, `String.format` lève une exception sur un serveur mal configuré", correct: false}
      - {text: "La locale change l'ordre des arguments, pour suivre la grammaire de la langue", correct: false}
      - {text: "La locale traduit automatiquement le texte du gabarit dans la langue choisie", correct: false}
    answer: "Le séparateur décimal (et des milliers) dépend de la locale par défaut : `3,14` en France, `3.14` aux États-Unis. Pour un fichier ou un protocole, on fixe `Locale.ROOT`."
  - key: erreurs
    format: course
    question: Que se passe-t-il avec `String.format("%d", 3.5)` ?
    choices:
      - {text: "Une `IllegalFormatConversionException` : `%d` attend un entier", correct: true}
      - {text: "`3`, la partie entière de 3,5, sans arrondi", correct: false}
      - {text: "`4`, l'arrondi de 3,5 à l'entier le plus proche", correct: false}
      - {text: "`3.5`, le nombre affiché tel quel", correct: false}
    answer: "Une `IllegalFormatConversionException` : `%d` attend un entier ; il faut `%f` (ou `%.1f`)."
  - key: vf-locale-france
    format: true-false
    question: "`String.format(Locale.FRANCE, \"%.2f\", 3.14159)` donne `3,14`."
    truth: true
    answer: La locale française utilise la virgule décimale.
  - key: vf-d-double
    format: true-false
    question: "`%d` accepte un `double` et l'arrondit."
    truth: false
    answer: Il lève une `IllegalFormatConversionException`.
  - key: vf-formatted
    format: true-false
    question: "`\"%s ans\".formatted(36)` donne `36 ans`."
    truth: true
    answer: '`formatted` (Java 15) équivaut à `String.format`.'
  - key: vf-pourcent
    format: true-false
    question: Pour afficher le caractère `%`, on écrit `\%` dans le gabarit.
    truth: false
    answer: On écrit `%%`.
  - key: qcm-deux-decimales
    format: multiple-choice
    question: Quel gabarit affiche `12.50` pour `12.5` avec `Locale.ROOT` ?
    choices:
      - text: "`\"%.2f\"`"
        correct: true
      - text: "`\"%2f\"`"
        correct: false
      - text: "`\"%d.2\"`"
        correct: false
      - text: "`\"%f2\"`"
        correct: false
    answer: '`%.2f` : un décimal avec deux chiffres après la virgule.'
  - key: qcm-zeros
    format: multiple-choice
    question: Quel gabarit donne `00042` pour 42 ?
    choices:
      - text: "`\"%05d\"`"
        correct: true
      - text: "`\"%5d\"`"
        correct: false
      - text: "`\"%-5d\"`"
        correct: false
      - text: "`\"%0.5d\"`"
        correct: false
    answer: Le `0` complète par des zéros ; sans lui, par des espaces.
  - key: qcm-csv
    format: multiple-choice
    question: Pour écrire des prix dans un fichier CSV avec un point décimal, que faire ?
    choices:
      - text: "`String.format(Locale.ROOT, \"%.2f\", prix)`"
        correct: true
      - text: "`String.format(\"%.2f\", prix)`"
        correct: false
      - text: "`String.format(Locale.FRANCE, \"%.2f\", prix)`"
        correct: false
      - text: "`prix + \"\"`, toujours suffisant"
        correct: false
    answer: Sans locale, le résultat dépend de la machine.
  - key: qcm-printf
    format: multiple-choice
    question: "Laquelle de ces instructions affiche directement un texte formaté sur la console ?"
    choices:
      - {text: "`System.out.printf(\"%d%n\", 5)`", correct: true}
      - {text: "`System.out.println(\"%d%n\", 5)`", correct: false}
      - {text: "`String.format(\"%d%n\", 5)`", correct: false}
      - {text: "`\"%d%n\".formatted(5)`", correct: false}
    answer: "`printf` (comme `System.out.format`) formate et affiche. `String.format` et `formatted` renvoient une chaîne sans l'afficher, et `println` ne prend pas de gabarit."
  - key: trous-entier
    format: fill-in
    question: |-
      Complète pour afficher « 3 articles » :
      ```java
      String.format("___ articles", 3);
      ```
    blanks: [["%d"]]
    answer: '`%d` formate un entier.'
  - key: trous-decimales
    format: fill-in
    question: |-
      Complète pour afficher deux chiffres après la virgule :
      ```java
      String.format(Locale.ROOT, "Total : ___ €", 19.9);   // "Total : 19.90 €"
      ```
    blanks: [["%.2f"]]
    answer: '`%.2f` arrondit à deux décimales.'
  - key: trous-formatted
    format: fill-in
    question: |-
      Complète pour remplir le gabarit :
      ```java
      String message = "Bonjour %s".___(nom);
      ```
    blanks: [[formatted]]
    answer: '`formatted` (Java 15) est la version méthode de `String.format`.'
  - key: trous-gauche
    format: fill-in
    question: |-
      Complète pour aligner le nom à gauche sur 10 caractères :
      ```java
      String.format("___|%5d", nom, quantite);
      ```
    blanks: [["%-10s"]]
    answer: Le `-` aligne à gauche, `10` fixe la largeur.
  - key: code-alignement
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(String.format(Locale.ROOT, "%5d|%-5s|%05d", 42, "ab", 7));
      ```
    choices:
      - text: |-
          ```
             42|ab   |00007
          ```
        correct: true
      - text: |-
          ```
          42   |   ab|00007
          ```
        correct: false
      - text: |-
          ```
          00042|ab   |    7
          ```
        correct: false
      - text: |-
          ```
          42|ab|7
          ```
        correct: false
    answer: "`%5d` aligne 42 à droite sur 5 caractères, `%-5s` aligne `ab` à gauche, et `%05d` complète 7 par des zéros."
    check:
      output: "   42|ab   |00007"
  - key: code-locale
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(String.format(Locale.FRANCE, "%.2f", 3.14159) + " " + String.format(Locale.US, "%.2f", 3.14159));
      ```
    choices:
      - {text: "`3,14 3.14`", correct: true}
      - {text: "`3.14 3.14`", correct: false}
      - {text: "`3,14 3,14`", correct: false}
      - {text: "`3.14 3,14`", correct: false}
    answer: '`3,14 3.14` : le séparateur décimal dépend de la locale.'
    check:
      output: "3,14 3.14"
  - key: code-conversion
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(String.format("%d", 3.5));
      ```
    choices:
      - {text: "Une `IllegalFormatConversionException`", correct: true}
      - {text: "`3`, la partie entière du nombre", correct: false}
      - {text: "`4`, le nombre arrondi au plus proche", correct: false}
      - {text: "`3.5`, le nombre tel quel, sans format", correct: false}
    answer: "Une `IllegalFormatConversionException` : `%d` n'accepte pas un `double`."
    check:
      throws: IllegalFormatConversionException
  - key: code-hexa
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("%s a %d ans".formatted("Ada", 36) + " " + String.format("%x %%", 255));
      ```
    choices:
      - {text: "`Ada a 36 ans ff %`", correct: true}
      - {text: "`Ada a 36 ans FF %`", correct: false}
      - {text: "`Ada a 36 ans ff %%`", correct: false}
      - {text: "`Ada a 36 ans 255 %`", correct: false}
    answer: "`Ada a 36 ans ff %` : `%x` écrit 255 en hexadécimal minuscule, et `%%` produit un seul `%`."
    check:
      output: "Ada a 36 ans ff %"
  - key: bug-d-double
    format: bug-fix
    question: |-
      Ce code lève une `IllegalFormatConversionException` :
      ```java
      System.out.printf("Moyenne : %d%n", moyenne);   // double moyenne
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`System.out.printf(\"Moyenne : %.1f%n\", moyenne);`", correct: true}
      - {text: "`System.out.printf(\"Moyenne : %.1d%n\", moyenne);`", correct: false}
      - {text: "`System.out.printf(\"Moyenne : %ld%n\", moyenne);`", correct: false}
      - {text: "`System.out.printf(\"Moyenne : %d%n\", Double.valueOf(moyenne));`", correct: false}
    answer: |-
      ```java
      System.out.printf("Moyenne : %.1f%n", moyenne);
      ```
      `%d` n'accepte que des entiers ; un décimal se formate avec `%f` et sa précision.
  - key: bug-csv-locale
    format: bug-fix
    question: |-
      Sur les postes français, le fichier CSV produit a des colonnes décalées :
      ```java
      ligne = String.format("%s,%.2f", produit, prix);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`String.format(Locale.ROOT, \"%s,%.2f\", produit, prix)`", correct: true}
      - {text: "`String.format(Locale.FRANCE, \"%s,%.2f\", produit, prix)`", correct: false}
      - {text: "`String.format(\"%s,%f\", produit, prix)`", correct: false}
      - {text: "`String.format(\"%s,%.2f\", produit, prix).replace(',', '.')`", correct: false}
    answer: |-
      ```java
      ligne = String.format(Locale.ROOT, "%s,%.2f", produit, prix);
      ```
      Sans locale, `%.2f` utilise la virgule décimale sur un poste français, qui se confond avec le séparateur CSV. Un
      format de fichier fixe sa locale.
  - key: bug-argument-manquant
    format: bug-fix
    question: |-
      Ce code lève une `MissingFormatArgumentException` :
      ```java
      String.format("%s a commandé %d articles pour %.2f €", client, quantite);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Passer la troisième valeur : `client, quantite, total`", correct: true}
      - {text: "Retirer le `€` du gabarit, qui consomme un argument", correct: false}
      - {text: "Remplacer `%.2f` par `%f`, qui n'attend pas d'argument", correct: false}
      - {text: "Passer les deux arguments dans un `List.of(client, quantite)`", correct: false}
    answer: |-
      ```java
      String.format("%s a commandé %d articles pour %.2f €", client, quantite, total);
      ```
      Le gabarit attend trois valeurs ; il en manquait une. Chaque spécificateur consomme un argument, dans l'ordre.
  - key: bug-alignement-manuel
    format: bug-fix
    question: |-
      Comment simplifier cet alignement de colonnes ?
      ```java
      String nom = produit.nom();
      while (nom.length() < 15) nom += " ";
      System.out.println(nom + "|" + quantite);
      ```
    choices:
      - {text: "`System.out.printf(\"%-15s|%d%n\", produit.nom(), quantite);`", correct: true}
      - {text: "`System.out.printf(\"%15s|%d%n\", produit.nom(), quantite);`", correct: false}
      - {text: "`System.out.printf(\"%.15s|%d%n\", produit.nom(), quantite);`", correct: false}
      - {text: "`System.out.printf(\"%-15d|%s%n\", produit.nom(), quantite);`", correct: false}
    answer: "La largeur `%-15s` complète par des espaces à droite (alignement à gauche), sans boucle ni chaînes intermédiaires. Sans le `-`, le texte s'aligne à droite ; `%.15s` coupe sans compléter."
