notion: string-format
lesson: |-
  `String.format(gabarit, valeurs...)` (ou `gabarit.formatted(valeurs...)`, ou `System.out.printf`) remplit un gabarit
  avec des **spécificateurs** `%` :

  | Spécificateur | Pour | Exemple |
  |---|---|---|
  | `%s` | tout objet (`toString`) | `"%s"` → `Ada` |
  | `%d` | entier | `"%5d"` → `   42` ; `"%05d"` → `00042` |
  | `%f` | décimal | `"%.2f"` → `3.14` |
  | `%x` | hexadécimal | `"%x"` → `ff` |
  | `%-10s` | aligné à gauche sur 10 | `ab        ` |
  | `%n` | retour à la ligne du système | |
  | `%%` | le caractère `%` | |

  ```java
  String.format(Locale.FRANCE, "%.2f €", 3.14159);   // "3,14 €"
  String.format(Locale.ROOT, "%.2f", 3.14159);       // "3.14"
  "%-8s|%5d".formatted("pommes", 12);                // "pommes  |   12"
  ```

  - Le résultat dépend de la **locale** pour les nombres (`3,14` en France, `3.14` aux États-Unis) : pour un fichier ou
    un protocole, on la précise (`Locale.ROOT`) ; pour l'affichage, on prend celle de l'utilisateur.
  - Un type incompatible (`%d` avec un `double`) lève une `IllegalFormatConversionException` ; une valeur manquante,
    une `MissingFormatArgumentException`.
  - Pour les journaux, on préfère les paramètres du logger (`log.info("id={}", id)`), évalués seulement si nécessaire.

  **Piège classique** : écrire un CSV avec `String.format("%.2f", prix)` sans locale. Sur un poste français, on obtient
  `3,14`, et la virgule décimale casse les colonnes.

  **En entretien** : « `%s`, `%d`, `%.2f`, `%n` ; et une locale explicite dès que le texte n'est pas destiné à un humain. »
cards:
  - key: specificateurs
    format: course
    question: Citez les spécificateurs de format les plus courants.
    answer: '`%s` (texte), `%d` (entier), `%f` et `%.2f` (décimal, deux chiffres), `%x` (hexadécimal), `%n` (retour à la ligne), `%%` (le caractère %).'
  - key: largeur
    format: course
    question: Que signifient `%5d`, `%05d` et `%-10s` ?
    answer: Un entier sur 5 caractères aligné à droite ; complété par des zéros ; un texte sur 10 caractères aligné à gauche.
  - key: locale
    format: course
    question: Pourquoi préciser une `Locale` dans `String.format` ?
    answer: "Le séparateur décimal (et des milliers) dépend de la locale par défaut : `3,14` en France, `3.14` aux États-Unis. Pour un fichier ou un protocole, on fixe `Locale.ROOT`."
  - key: erreurs
    format: course
    question: Que se passe-t-il avec `String.format("%d", 3.5)` ?
    answer: "Une `IllegalFormatConversionException` : `%d` attend un entier ; il faut `%f` (ou `%.1f`)."
  - key: vf-locale-france
    format: true-false
    question: "`String.format(Locale.FRANCE, \"%.2f\", 3.14159)` donne `3,14`."
    truth: true
    answer: La locale française utilise la virgule décimale.
  - key: vf-d-double
    format: true-false
    question: "`%d` accepte un `double` et l'arrondit."
    truth: false
    answer: Il lève une `IllegalFormatConversionException`.
  - key: vf-formatted
    format: true-false
    question: "`\"%s ans\".formatted(36)` donne `36 ans`."
    truth: true
    answer: '`formatted` (Java 15) équivaut à `String.format`.'
  - key: vf-pourcent
    format: true-false
    question: Pour afficher le caractère `%`, on écrit `\%` dans le gabarit.
    truth: false
    answer: On écrit `%%`.
  - key: qcm-deux-decimales
    format: multiple-choice
    question: Quel gabarit affiche `12.50` pour `12.5` avec `Locale.ROOT` ?
    choices:
      - text: "`\"%.2f\"`"
        correct: true
      - text: "`\"%2f\"`"
        correct: false
      - text: "`\"%d.2\"`"
        correct: false
      - text: "`\"%f2\"`"
        correct: false
    answer: '`%.2f` : un décimal avec deux chiffres après la virgule.'
  - key: qcm-zeros
    format: multiple-choice
    question: Quel gabarit donne `00042` pour 42 ?
    choices:
      - text: "`\"%05d\"`"
        correct: true
      - text: "`\"%5d\"`"
        correct: false
      - text: "`\"%-5d\"`"
        correct: false
      - text: "`\"%0.5d\"`"
        correct: false
    answer: Le `0` complète par des zéros ; sans lui, par des espaces.
  - key: qcm-csv
    format: multiple-choice
    question: Pour écrire des prix dans un fichier CSV avec un point décimal, que faire ?
    choices:
      - text: "`String.format(Locale.ROOT, \"%.2f\", prix)`"
        correct: true
      - text: "`String.format(\"%.2f\", prix)`"
        correct: false
      - text: "`String.format(Locale.FRANCE, \"%.2f\", prix)`"
        correct: false
      - text: "`prix + \"\"`, toujours suffisant"
        correct: false
    answer: Sans locale, le résultat dépend de la machine.
  - key: qcm-printf
    format: multiple-choice
    question: Laquelle affiche directement un texte formaté sur la console ?
    choices:
      - text: "`System.out.printf(\"%d%n\", 5)`"
        correct: true
      - text: "`System.out.format(\"%d%n\", 5)`"
        correct: true
      - text: "`String.format(\"%d%n\", 5)`"
        correct: false
      - text: "`\"%d%n\".formatted(5)`"
        correct: false
    answer: Les deux dernières renvoient une chaîne sans l'afficher.
  - key: trous-entier
    format: fill-in
    question: |-
      Complétez pour afficher « 3 articles » :
      ```java
      String.format("___ articles", 3);
      ```
    blanks: [["%d"]]
    answer: '`%d` formate un entier.'
  - key: trous-decimales
    format: fill-in
    question: |-
      Complétez pour afficher deux chiffres après la virgule :
      ```java
      String.format(Locale.ROOT, "Total : ___ €", 19.9);   // "Total : 19.90 €"
      ```
    blanks: [["%.2f"]]
    answer: '`%.2f` arrondit à deux décimales.'
  - key: trous-formatted
    format: fill-in
    question: |-
      Complétez pour remplir le gabarit :
      ```java
      String message = "Bonjour %s".___(nom);
      ```
    blanks: [[formatted]]
    answer: '`formatted` (Java 15) est la version méthode de `String.format`.'
  - key: trous-gauche
    format: fill-in
    question: |-
      Complétez pour aligner le nom à gauche sur 10 caractères :
      ```java
      String.format("___|%5d", nom, quantite);
      ```
    blanks: [["%-10s"]]
    answer: Le `-` aligne à gauche, `10` fixe la largeur.
  - key: code-alignement
    format: code-output
    question: |-
      ```java
      System.out.println(String.format(Locale.ROOT, "%5d|%-5s|%05d", 42, "ab", 7));
      ```
    answer: '`   42|ab   |00007`.'
    check:
      output: "   42|ab   |00007"
  - key: code-locale
    format: code-output
    question: |-
      ```java
      System.out.println(String.format(Locale.FRANCE, "%.2f", 3.14159) + " " + String.format(Locale.US, "%.2f", 3.14159));
      ```
    answer: '`3,14 3.14` : le séparateur décimal dépend de la locale.'
    check:
      output: "3,14 3.14"
  - key: code-conversion
    format: code-output
    question: |-
      ```java
      System.out.println(String.format("%d", 3.5));
      ```
    answer: "Une `IllegalFormatConversionException` : `%d` n'accepte pas un `double`."
    check:
      throws: IllegalFormatConversionException
  - key: code-hexa
    format: code-output
    question: |-
      ```java
      System.out.println("%s a %d ans".formatted("Ada", 36) + " " + String.format("%x %%", 255));
      ```
    answer: '`Ada a 36 ans ff %`.'
    check:
      output: "Ada a 36 ans ff %"
  - key: bug-d-double
    format: bug-fix
    question: |-
      Ce code lève une `IllegalFormatConversionException` :
      ```java
      System.out.printf("Moyenne : %d%n", moyenne);   // double moyenne
      ```
    answer: |-
      ```java
      System.out.printf("Moyenne : %.1f%n", moyenne);
      ```
      `%d` n'accepte que des entiers ; un décimal se formate avec `%f` et sa précision.
  - key: bug-csv-locale
    format: bug-fix
    question: |-
      Sur les postes français, le fichier CSV produit a des colonnes décalées :
      ```java
      ligne = String.format("%s,%.2f", produit, prix);
      ```
    answer: |-
      ```java
      ligne = String.format(Locale.ROOT, "%s,%.2f", produit, prix);
      ```
      Sans locale, `%.2f` utilise la virgule décimale sur un poste français, qui se confond avec le séparateur CSV. Un
      format de fichier fixe sa locale.
  - key: bug-argument-manquant
    format: bug-fix
    question: |-
      Ce code lève une `MissingFormatArgumentException` :
      ```java
      String.format("%s a commandé %d articles pour %.2f €", client, quantite);
      ```
    answer: |-
      ```java
      String.format("%s a commandé %d articles pour %.2f €", client, quantite, total);
      ```
      Le gabarit attend trois valeurs ; il en manquait une. Chaque spécificateur consomme un argument, dans l'ordre.
  - key: bug-alignement-manuel
    format: bug-fix
    question: |-
      Simplifiez cet alignement de colonnes :
      ```java
      String nom = produit.nom();
      while (nom.length() < 15) nom += " ";
      System.out.println(nom + "|" + quantite);
      ```
    answer: |-
      ```java
      System.out.printf("%-15s|%d%n", produit.nom(), quantite);
      ```
      La largeur `%-15s` complète par des espaces, sans boucle ni chaînes intermédiaires.
