notion: autoboxing
lesson: |-
  Le compilateur convertit automatiquement entre primitifs et enveloppes :

  - **autoboxing** : `int` → `Integer` (il appelle `Integer.valueOf`) ;
  - **unboxing** : `Integer` → `int` (il appelle `intValue()`).

  ```java
  List<Integer> notes = new ArrayList<>();
  notes.add(15);                     // autoboxing
  int premiere = notes.get(0);       // unboxing

  Map<String, Integer> stock = new HashMap<>();
  int pommes = stock.get("pomme");   // NullPointerException si la clé est absente !
  ```

  L'unboxing a lieu partout où un primitif est attendu : affectation à un `int`, opérateurs arithmétiques et de
  comparaison (`<`, `+`), `switch`, et le **ternaire** dont un opérande est primitif.

  Ce qu'il faut surveiller :
  - **`null` déballé** : une `NullPointerException` sur une ligne sans appel de méthode visible ;
  - **`==` entre enveloppes** : comparaison de références, pas de valeurs (voir le cache des `Integer`) ;
  - **types mélangés** : `Long.equals(128)` compare un `Long` à un `Integer`, toujours faux ;
  - **performance** : un `Long somme` dans une boucle crée un objet à chaque tour.

  **Piège classique** : `Integer r = condition ? valeurNulle : 0;`. Comme `0` est un `int`, le ternaire est de type
  `int`, et `valeurNulle` est déballée : `NullPointerException`.

  **En entretien** : « L'autoboxing est pratique mais cache des `valueOf` et des `intValue()` : attention aux `null`
  déballés, aux `==` entre enveloppes et aux boucles sur des `Long`. »
tour:
  - title: Autoboxing et unboxing
    text: |-
      Java convertit seul un primitif en son enveloppe (*autoboxing*), et inversement (*unboxing*) : `Integer n = 5;` et
      `int m = n;` compilent. Pratique, mais deux pièges :

      - un `Integer` qui vaut `null`, déballé en `int`, lève une `NullPointerException` ; - `==` entre deux `Integer`
      compare des références : vrai pour les petites valeurs (de -128 à 127, mises en cache), faux au-delà.

      Le second est sournois : le code marche dans les tests, avec de petites valeurs, et échoue en production.
    example:
      files:
        Main.java: |-
          void main() {
              Integer a = 127, b = 127;
              Integer c = 1000, d = 1000;
              IO.println((a == b) + " " + (c == d) + " " + c.equals(d));

              Map<String, Integer> stock = new HashMap<>();
              try {
                  int pommes = stock.get("pommes");
                  IO.println(pommes);
              } catch (NullPointerException e) {
                  IO.println("NullPointerException : pas de pommes");
              }
              IO.println(stock.getOrDefault("pommes", 0));
          }
      output: |-
        true false true
        NullPointerException : pas de pommes
        0
cards:
  - key: quand-autoboxing-provoque-npe
    format: course
    question: Quand l'autoboxing provoque-t-il une NPE ?
    answer: À l'unboxing d'un wrapper null, par exemple `int x = map.get(cle)` quand la clé est absente.
  - key: traduction
    format: course
    question: En quoi le compilateur traduit-il `Integer n = 5;` et `int m = n;` ?
    answer: En `Integer n = Integer.valueOf(5);` et `int m = n.intValue();`.
  - key: ou-unboxing
    format: course
    question: Où l'unboxing a-t-il lieu implicitement ?
    answer: Dans une affectation à un primitif, les opérateurs arithmétiques et de comparaison (`+`, `<`), le `switch`, et un ternaire dont l'autre opérande est primitif.
  - key: types-melanges
    format: course
    question: Pourquoi `Long.valueOf(128).equals(128)` vaut-il `false` ?
    answer: '`128` est emballé en `Integer`, et `Long.equals` exige un `Long` : deux enveloppes de types différents ne sont jamais égales.'
  - key: vf-null-unboxing
    format: true-false
    question: Déballer un `Integer` qui vaut `null` donne 0.
    truth: false
    answer: Cela lève une `NullPointerException`.
  - key: vf-comparaison-mixte
    format: true-false
    question: "Avec `Integer a = 1000; int b = 1000;`, `a == b` vaut `true`."
    truth: true
    answer: "Un opérande est primitif : `a` est déballé, et l'on compare des valeurs."
  - key: vf-value-of
    format: true-false
    question: L'autoboxing d'un `int` appelle `Integer.valueOf`.
    truth: true
    answer: C'est pourquoi il profite du cache des petites valeurs.
  - key: vf-performance
    format: true-false
    question: "`Long somme = 0L; for (...) somme += i;` est aussi rapide qu'avec un `long`."
    truth: false
    answer: Chaque `+=` déballe, additionne et crée un nouveau `Long`.
  - key: qcm-npe
    format: multiple-choice
    question: "Avec `Map<String, Integer> m = new HashMap<>();`, quelles lignes lèvent une `NullPointerException` ?"
    choices:
      - text: "`int n = m.get(\"x\");`"
        correct: true
      - text: "`if (m.get(\"x\") > 0) { }`"
        correct: true
      - text: "`Integer n = m.get(\"x\");`"
        correct: false
      - text: "`int n = m.getOrDefault(\"x\", 0);`"
        correct: false
    answer: Le déballage de `null` lève l'exception ; rester en `Integer` ou donner une valeur par défaut l'évite.
  - key: qcm-ternaire
    format: multiple-choice
    question: "Avec `Integer v = null;`, que fait `Integer r = true ? v : 0;` ?"
    choices:
      - text: "Une `NullPointerException`"
        correct: true
      - text: "`r` vaut `null`"
        correct: false
      - text: "`r` vaut 0"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
    answer: "Le ternaire est de type `int` (à cause du `0`) : `v` est déballé."
  - key: qcm-incrementer
    format: multiple-choice
    question: Comment incrémenter proprement un compteur dans une `Map<String, Integer>` ?
    choices:
      - text: "`compteurs.merge(cle, 1, Integer::sum)`"
        correct: true
      - text: "`compteurs.put(cle, compteurs.getOrDefault(cle, 0) + 1)`"
        correct: true
      - text: "`compteurs.put(cle, compteurs.get(cle) + 1)`"
        correct: false
      - text: "`compteurs.get(cle)++`"
        correct: false
    answer: '`get(cle) + 1` déballe `null` pour une nouvelle clé ; `get(cle)++` ne compile pas.'
  - key: qcm-mixte
    format: multiple-choice
    question: "Avec `Long c = 128L;`, que vaut `c.equals(128L)` et `c.equals(128)` ?"
    choices:
      - text: "`true` puis `false`"
        correct: true
      - text: "`true` puis `true`"
        correct: false
      - text: "`false` puis `false`"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
    answer: '`128` sans suffixe devient un `Integer`.'
  - key: code-set-short-new-hashset-for
    format: code-output
    question: |-
      ```java
      Set<Short> s = new HashSet<>();
      for (short i = 0; i < 100; i++) { s.add(i); s.remove(i - 1); }
      System.out.println(s.size());
      ```
    answer: '`100` : `i - 1` est un int, autoboxé en Integer, qui n''est jamais égal à un Short. Aucun élément n''est supprimé.'
    check:
      output: "100"
  - key: code-integer-nul-null-boolean-cond
    format: code-output
    question: |-
      ```java
      Integer nul = null;
      boolean cond = true;
      Integer r = cond ? nul : 0;
      ```
    answer: 'NullPointerException : un opérande est `Integer`, l''autre `int`, donc le type du ternaire est `int` et `nul` est déballé. À l''inverse, `Integer r2 = false ? 1 : null;` donne `null` sans exception (type Integer).'
    check:
      throws: NullPointerException
  - key: code-mixte
    format: code-output
    question: |-
      ```java
      Integer a = 128;
      int b = 128;
      Long c = 128L;
      System.out.println((a == b) + " " + c.equals(128) + " " + c.equals(128L));
      ```
    answer: '`true false true` : `a` est déballé face à `b` ; `128` devient un `Integer`, différent d''un `Long`.'
    check:
      output: "true false true"
  - key: code-null-protege
    format: code-output
    question: |-
      ```java
      Map<String, Integer> stock = new HashMap<>();
      Integer pommes = stock.get("pomme");
      System.out.println(pommes == null ? "absent" : "stock " + (pommes + 1));
      ```
    answer: '`absent` : on garde un `Integer` et on teste `null` avant tout calcul.'
    check:
      output: "absent"
  - key: bug-get-unboxing
    format: bug-fix
    question: |-
      Ce compteur lève une `NullPointerException` pour un mot vu pour la première fois :
      ```java
      compteurs.put(mot, compteurs.get(mot) + 1);
      ```
    answer: |-
      ```java
      compteurs.merge(mot, 1, Integer::sum);
      ```
      `get` renvoie `null` pour une clé absente, et `null + 1` déballe `null`. `merge` insère 1 ou additionne.
  - key: bug-long-boucle
    format: bug-fix
    question: |-
      Cette somme d'un milliard de valeurs est dix fois plus lente que prévu :
      ```java
      Long somme = 0L;
      for (long i = 0; i < 1_000_000_000L; i++) {
          somme += i;
      }
      ```
    answer: |-
      ```java
      long somme = 0L;
      for (long i = 0; i < 1_000_000_000L; i++) {
          somme += i;
      }
      ```
      Une majuscule de trop : avec `Long`, chaque tour crée un objet (*Effective Java*, item 6).
  - key: bug-ternaire
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` quand le client n'a pas de remise :
      ```java
      Integer remise = client.estFidele() ? client.remise() : 0;   // remise() peut renvoyer null
      ```
    answer: |-
      ```java
      Integer remise = client.estFidele() ? client.remise() : Integer.valueOf(0);
      ```
      Avec `0` (un `int`), le ternaire devient de type `int` et déballe `client.remise()`. Deux opérandes `Integer`
      gardent un ternaire de type `Integer`. (Mieux : que `remise()` ne renvoie jamais `null`.)
  - key: bug-entite-null
    format: bug-fix
    question: |-
      Le chargement d'une commande lève une `NullPointerException` quand la colonne `remise` est vide en base :
      ```java
      @Column(name = "remise")
      private Integer remise;

      public int remise() { return remise; }
      ```
    answer: |-
      ```java
      public int remise() { return remise == null ? 0 : remise; }
      // ou une colonne NOT NULL DEFAULT 0, et un champ int
      ```
      Le champ `Integer` peut recevoir `null` de la base, et l'accesseur `int` le déballe. On décide explicitement de la
      valeur d'une absence (ou on l'interdit en base).
  - key: map-string-integer-provoque-nullpointerexception
    format: scenario
    question: Un `Map<String, Integer>` provoque une NullPointerException sur une ligne qui ne contient aucun appel de méthode visible.
    answer: |-
      Je soupçonnerais un **unboxing implicite** : `int total = compteurs.get(cle);` déballe le résultat, et si la clé est absente la map renvoie `null`, d'où la NPE. Depuis Java 14, le message de la NPE est explicite (*helpful NullPointerException*) et dit précisément ce qui était null.
      La correction : `compteurs.getOrDefault(cle, 0)`, ou `merge(cle, 1, Integer::sum)` pour incrémenter. Plus généralement, je reste attentif aux mélanges primitifs/wrappers dans les opérateurs ternaires et les comparaisons.
  - key: scenario-perf
    format: scenario
    question: Le profilage d'un calcul montre des millions d'objets `Long` alloués. Que cherches-tu ?
    answer: |-
      De l'autoboxing caché : une variable ou un accumulateur déclaré `Long` au lieu de `long`, une `List<Long>` ou une
      `Map<…, Long>` utilisée dans la boucle chaude, un `Stream<Long>` au lieu d'un `LongStream` (`mapToLong`, `sum()`).
      Je remplace par des primitifs dans le calcul et je ne reviens aux enveloppes qu'aux frontières (collections,
      API). Je mesure avant et après : le gain vient surtout de la pression réduite sur le GC.
  - key: scenario-dto
    format: scenario
    question: Dans un DTO d'API, déclares-tu un champ `quantite` en `int` ou en `Integer` ?
    answer: |-
      Ça dépend du sens de l'absence. Si la quantité est obligatoire, `int`... sauf que la désérialisation mettra 0 si
      le champ manque, sans erreur : je préfère alors `Integer` avec `@NotNull`, pour distinguer « absent » de « zéro »
      et renvoyer une erreur 400 claire. Si le champ est facultatif, `Integer` (null = non fourni). Dans le domaine, une
      fois validée, la valeur redevient un primitif ou un type dédié.
  - key: scenario-comparaison
    format: scenario
    question: Un test compare deux `Integer` avec `==` et passe ; le même code échoue en production. Comment l'expliques-tu ?
    answer: |-
      Le test utilise de petites valeurs, entre -128 et 127, que `Integer.valueOf` (donc l'autoboxing) met en cache : les
      deux variables désignent le même objet et `==` vaut `true`. En production, les valeurs sont plus grandes, chaque
      autoboxing crée un objet, et `==` compare deux références différentes. La correction : `equals` (ou
      `Objects.equals`), ou comparer des primitifs. J'ajouterais au test une valeur hors du cache pour qu'il échoue sur
      l'ancien code.
