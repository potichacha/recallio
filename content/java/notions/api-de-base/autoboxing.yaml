notion: autoboxing
lesson: |-
  Le compilateur convertit automatiquement entre primitifs et enveloppes :

  - **autoboxing** : `int` → `Integer` (il appelle `Integer.valueOf`) ;
  - **unboxing** : `Integer` → `int` (il appelle `intValue()`).

  ```java
  List<Integer> notes = new ArrayList<>();
  notes.add(15);                     // autoboxing
  int premiere = notes.get(0);       // unboxing

  Map<String, Integer> stock = new HashMap<>();
  int pommes = stock.get("pomme");   // NullPointerException si la clé est absente !
  ```

  L'unboxing a lieu partout où un primitif est attendu : affectation à un `int`, opérateurs arithmétiques et de
  comparaison (`<`, `+`), `switch`, et le **ternaire** dont un opérande est primitif.

  Ce qu'il faut surveiller :
  - **`null` déballé** : une `NullPointerException` sur une ligne sans appel de méthode visible ;
  - **`==` entre enveloppes** : comparaison de références, pas de valeurs (voir le cache des `Integer`) ;
  - **types mélangés** : `Long.equals(128)` compare un `Long` à un `Integer`, toujours faux ;
  - **performance** : un `Long somme` dans une boucle crée un objet à chaque tour.

  **Piège classique** : `Integer r = condition ? valeurNulle : 0;`. Comme `0` est un `int`, le ternaire est de type
  `int`, et `valeurNulle` est déballée : `NullPointerException`.

  **En entretien** : « L'autoboxing est pratique mais cache des `valueOf` et des `intValue()` : attention aux `null`
  déballés, aux `==` entre enveloppes et aux boucles sur des `Long`. »
tour:
  - title: Autoboxing et unboxing
    text: |-
      Java convertit seul un primitif en son enveloppe (*autoboxing*), et inversement (*unboxing*) : `Integer n = 5;` et
      `int m = n;` compilent. Pratique, mais deux pièges :

      - un `Integer` qui vaut `null`, déballé en `int`, lève une `NullPointerException` ; - `==` entre deux `Integer`
      compare des références : vrai pour les petites valeurs (de -128 à 127, mises en cache), faux au-delà.

      Le second est sournois : le code marche dans les tests, avec de petites valeurs, et échoue en production.
    example:
      files:
        Main.java: |-
          void main() {
              Integer a = 127, b = 127;
              Integer c = 1000, d = 1000;
              IO.println((a == b) + " " + (c == d) + " " + c.equals(d));

              Map<String, Integer> stock = new HashMap<>();
              try {
                  int pommes = stock.get("pommes");
                  IO.println(pommes);
              } catch (NullPointerException e) {
                  IO.println("NullPointerException : pas de pommes");
              }
              IO.println(stock.getOrDefault("pommes", 0));
          }
      output: |-
        true false true
        NullPointerException : pas de pommes
        0
cards:
  - key: quand-autoboxing-provoque-npe
    format: course
    question: "Quand l'autoboxing provoque-t-il une `NullPointerException` ?"
    choices:
      - {text: "Au déballage d'une enveloppe `null`, comme `int x = map.get(cle)` sur une clé absente", correct: true}
      - {text: "Quand on compare avec `==` deux `Integer` hors du cache de -128 à 127", correct: false}
      - {text: "Quand on passe `null` à une méthode dont le paramètre est un `Integer`", correct: false}
      - {text: "Quand on ajoute un `int` à une `List<Integer>` qui contient déjà `null`", correct: false}
    answer: "Au déballage d'une enveloppe `null` : `int x = map.get(cle)` appelle `intValue()` sur `null` quand la clé est absente. Comparer avec `==` hors du cache donne `false`, sans exception."
  - key: traduction
    format: course
    question: En quoi le compilateur traduit-il `Integer n = 5;` et `int m = n;` ?
    choices:
      - {text: "En `Integer.valueOf(5)` et `n.intValue()`", correct: true}
      - {text: "En `new Integer(5)` et `n.intValue()`", correct: false}
      - {text: "En `Integer.valueOf(5)` et `Integer.parseInt(n.toString())`", correct: false}
      - {text: "En simples conversions `(Integer) 5` et `(int) n`, sans appel", correct: false}
    answer: "En `Integer n = Integer.valueOf(5);` et `int m = n.intValue();`. C'est `valueOf`, et non `new Integer`, qui profite du cache des petites valeurs."
  - key: ou-unboxing
    format: course
    question: Où l'unboxing a-t-il lieu implicitement ?
    choices:
      - {text: "Dans une affectation à un primitif, les opérateurs (`+`, `<`), le `switch` et certains ternaires", correct: true}
      - {text: "Seulement dans une affectation explicite d'une enveloppe à une variable primitive", correct: false}
      - {text: "Seulement dans l'appel d'une méthode dont le paramètre est un type primitif", correct: false}
      - {text: "Jamais : il faut toujours appeler `intValue()` soi-même pour obtenir un primitif", correct: false}
    answer: "Dans une affectation à un primitif, les opérateurs arithmétiques et de comparaison (`+`, `<`), le `switch`, et un ternaire dont l'autre opérande est primitif : autant d'endroits où une enveloppe `null` lève une exception."
  - key: types-melanges
    format: course
    question: Pourquoi `Long.valueOf(128).equals(128)` vaut-il `false` ?
    choices:
      - {text: "`128` est emballé en `Integer`, et `Long.equals` exige un `Long`", correct: true}
      - {text: "128 sort du cache des `Long`, donc les deux objets diffèrent", correct: false}
      - {text: "`equals` compare les références des enveloppes, comme `==`", correct: false}
      - {text: "`Long.valueOf(128)` déborde et vaut -128 dans un `byte`", correct: false}
    answer: "`128` est emballé en `Integer`, et `Long.equals` exige un `Long` : deux enveloppes de types différents ne sont jamais égales. Le cache n'y est pour rien : `equals` compare les valeurs."
  - key: vf-null-unboxing
    format: true-false
    question: Déballer un `Integer` qui vaut `null` donne 0.
    truth: false
    answer: Cela lève une `NullPointerException`.
  - key: vf-comparaison-mixte
    format: true-false
    question: "Avec `Integer a = 1000; int b = 1000;`, `a == b` vaut `true`."
    truth: true
    answer: "Un opérande est primitif : `a` est déballé, et l'on compare des valeurs."
  - key: vf-value-of
    format: true-false
    question: L'autoboxing d'un `int` appelle `Integer.valueOf`.
    truth: true
    answer: C'est pourquoi il profite du cache des petites valeurs.
  - key: vf-performance
    format: true-false
    question: "`Long somme = 0L; for (...) somme += i;` est aussi rapide qu'avec un `long`."
    truth: false
    answer: Chaque `+=` déballe, additionne et crée un nouveau `Long`.
  - key: qcm-npe
    format: multiple-choice
    question: "Avec `Map<String, Integer> m = new HashMap<>();`, laquelle de ces lignes lève une `NullPointerException` ?"
    choices:
      - {text: "`int n = m.get(\"x\");`", correct: true}
      - {text: "`Integer n = m.get(\"x\");`", correct: false}
      - {text: "`int n = m.getOrDefault(\"x\", 0);`", correct: false}
      - {text: "`boolean absent = m.get(\"x\") == null;`", correct: false}
    answer: "`int n` déballe `null` et lève l'exception. Rester en `Integer`, comparer à `null` ou donner une valeur par défaut l'évite."
  - key: qcm-ternaire
    format: multiple-choice
    question: "Avec `Integer v = null;`, que fait `Integer r = true ? v : 0;` ?"
    choices:
      - text: "Une `NullPointerException`"
        correct: true
      - text: "`r` vaut `null`"
        correct: false
      - text: "`r` vaut 0"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
    answer: "Le ternaire est de type `int` (à cause du `0`) : `v` est déballé."
  - key: qcm-incrementer
    format: multiple-choice
    question: "Lequel de ces appels incrémente un compteur d'une `Map<String, Integer>`, même pour une clé encore absente ?"
    choices:
      - {text: "`compteurs.merge(cle, 1, Integer::sum)`", correct: true}
      - {text: "`compteurs.put(cle, compteurs.get(cle) + 1)`", correct: false}
      - {text: "`compteurs.compute(cle, (k, v) -> v + 1)`", correct: false}
      - {text: "`compteurs.get(cle)++`", correct: false}
    answer: "`merge` insère 1 ou additionne. `get(cle) + 1` et `v + 1` déballent `null` pour une nouvelle clé ; `get(cle)++` ne compile pas. (`put(cle, getOrDefault(cle, 0) + 1)` marche aussi.)"
  - key: qcm-mixte
    format: multiple-choice
    question: "Avec `Long c = 128L;`, que vaut `c.equals(128L)` et `c.equals(128)` ?"
    choices:
      - text: "`true` puis `false`"
        correct: true
      - text: "`true` puis `true`"
        correct: false
      - text: "`false` puis `false`"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
    answer: '`128` sans suffixe devient un `Integer`.'
  - key: code-set-short-new-hashset-for
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Set<Short> s = new HashSet<>();
      for (short i = 0; i < 100; i++) { s.add(i); s.remove(i - 1); }
      System.out.println(s.size());
      ```
    choices:
      - {text: "`100`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`99`", correct: false}
    answer: '`100` : `i - 1` est un int, autoboxé en Integer, qui n''est jamais égal à un Short. Aucun élément n''est supprimé.'
    check:
      output: "100"
  - key: code-integer-nul-null-boolean-cond
    format: code-output
    question: |-
      Que se passe-t-il à l'exécution de ce code ?
      ```java
      Integer nul = null;
      boolean cond = true;
      Integer r = cond ? nul : 0;
      ```
    choices:
      - {text: "Une `NullPointerException`", correct: true}
      - {text: "`r` vaut `null`", correct: false}
      - {text: "`r` vaut `0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: 'NullPointerException : un opérande est `Integer`, l''autre `int`, donc le type du ternaire est `int` et `nul` est déballé. À l''inverse, `Integer r2 = false ? 1 : null;` donne `null` sans exception (type Integer).'
    check:
      throws: NullPointerException
  - key: code-mixte
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Integer a = 128;
      int b = 128;
      Long c = 128L;
      System.out.println((a == b) + " " + c.equals(128) + " " + c.equals(128L));
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`false false true`", correct: false}
      - {text: "`true true true`", correct: false}
      - {text: "`false true true`", correct: false}
    answer: '`true false true` : `a` est déballé face à `b` ; `128` devient un `Integer`, différent d''un `Long`.'
    check:
      output: "true false true"
  - key: code-null-protege
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> stock = new HashMap<>();
      Integer pommes = stock.get("pomme");
      System.out.println(pommes == null ? "absent" : "stock " + (pommes + 1));
      ```
    choices:
      - {text: "`absent`", correct: true}
      - {text: "`stock 1`", correct: false}
      - {text: "`stock null`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: '`absent` : on garde un `Integer` et on teste `null` avant tout calcul.'
    check:
      output: "absent"
  - key: bug-get-unboxing
    format: bug-fix
    question: |-
      Ce compteur lève une `NullPointerException` pour un mot vu pour la première fois :
      ```java
      compteurs.put(mot, compteurs.get(mot) + 1);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`compteurs.merge(mot, 1, Integer::sum);`", correct: true}
      - {text: "`compteurs.put(mot, compteurs.get(mot) + Integer.valueOf(1));`", correct: false}
      - {text: "`compteurs.putIfAbsent(mot, compteurs.get(mot) + 1);`", correct: false}
      - {text: "`compteurs.put(mot, (Integer) (compteurs.get(mot) + 1));`", correct: false}
    answer: |-
      ```java
      compteurs.merge(mot, 1, Integer::sum);
      ```
      `get` renvoie `null` pour une clé absente, et `null + 1` déballe `null`. `merge` insère 1 ou additionne.
  - key: bug-long-boucle
    format: bug-fix
    question: |-
      Cette somme d'un milliard de valeurs est dix fois plus lente que prévu :
      ```java
      Long somme = 0L;
      for (long i = 0; i < 1_000_000_000L; i++) {
          somme += i;
      }
      ```
      Pourquoi ?
    choices:
      - {text: "`somme` est un `Long` : chaque tour déballe, additionne et crée un objet", correct: true}
      - {text: "Le compteur `long i` déborde avant d'atteindre un milliard", correct: false}
      - {text: "`+=` sur un `Long` passe par une conversion en `String`", correct: false}
      - {text: "Le JIT ne compile jamais une boucle de plus d'un million de tours", correct: false}
    answer: "Une majuscule de trop : avec `Long`, chaque `somme += i` crée un objet (*Effective Java*, item 6). La correction : `long somme = 0L;`."
  - key: bug-ternaire
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` quand le client n'a pas de remise :
      ```java
      Integer remise = client.estFidele() ? client.remise() : 0;   // remise() peut renvoyer null
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`client.estFidele() ? client.remise() : Integer.valueOf(0)`", correct: true}
      - {text: "`client.estFidele() ? (int) client.remise() : 0`", correct: false}
      - {text: "`client.estFidele() ? client.remise() : (int) 0`", correct: false}
      - {text: "`client.estFidele() ? client.remise().intValue() : 0`", correct: false}
    answer: |-
      ```java
      Integer remise = client.estFidele() ? client.remise() : Integer.valueOf(0);
      ```
      Avec `0` (un `int`), le ternaire devient de type `int` et déballe `client.remise()`. Deux opérandes `Integer`
      gardent un ternaire de type `Integer`. (Mieux : que `remise()` ne renvoie jamais `null`.)
  - key: bug-entite-null
    format: bug-fix
    question: |-
      Le chargement d'une commande lève une `NullPointerException` quand la colonne `remise` est vide en base :
      ```java
      @Column(name = "remise")
      private Integer remise;

      public int remise() { return remise; }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Décider la valeur d'une absence : `return remise == null ? 0 : remise;`", correct: true}
      - {text: "Annoter le champ `@NotNull`, pour que Hibernate remplace `null` par 0", correct: false}
      - {text: "Déclarer le champ en `int`, sans toucher à la colonne qui accepte `null`", correct: false}
      - {text: "Entourer chaque appel à `remise()` d'un `catch` de la `NullPointerException`", correct: false}
    answer: |-
      ```java
      public int remise() { return remise == null ? 0 : remise; }
      // ou une colonne NOT NULL DEFAULT 0, et un champ int
      ```
      Le champ `Integer` peut recevoir `null` de la base, et l'accesseur `int` le déballe. On décide explicitement de la
      valeur d'une absence (ou on l'interdit en base).
  - key: map-string-integer-provoque-nullpointerexception
    format: scenario
    question: "Un `Map<String, Integer>` provoque une `NullPointerException` sur une ligne qui ne contient aucun appel de méthode visible. Que soupçonnes-tu ?"
    choices:
      - {text: "Un déballage implicite : `int total = compteurs.get(cle)` sur une clé absente", correct: true}
      - {text: "Une `HashMap` modifiée par un autre thread pendant la lecture de la clé", correct: false}
      - {text: "Une clé `null`, que `HashMap` refuse dès l'insertion dans la table", correct: false}
      - {text: "Un bug du JIT, qui supprime parfois les vérifications de `null`", correct: false}
    answer: "Un unboxing implicite : la map renvoie `null` pour une clé absente, et `int total = compteurs.get(cle);` le déballe. Le message de la NPE (Java 14+) le dit ; on corrige avec `getOrDefault(cle, 0)` ou `merge(cle, 1, Integer::sum)`. `HashMap`, elle, accepte une clé `null`."
  - key: scenario-perf
    format: scenario
    question: Le profilage d'un calcul montre des millions d'objets `Long` alloués. Que cherches-tu ?
    choices:
      - {text: "De l'autoboxing caché : un accumulateur `Long`, une `List<Long>` ou un `Stream<Long>` en boucle", correct: true}
      - {text: "Une fuite mémoire : des `Long` gardés dans un cache statique qui n'est jamais vidé", correct: false}
      - {text: "Un mauvais réglage du GC : il faut agrandir le tas pour absorber ces allocations", correct: false}
      - {text: "Un cache des `Long` trop petit, à agrandir par une option de lancement de la JVM", correct: false}
    answer: "De l'autoboxing caché dans la boucle chaude : je passe aux primitifs (`long`, `LongStream`, `mapToLong`) et je ne reviens aux enveloppes qu'aux frontières. Agrandir le tas masquerait le symptôme ; je mesure avant et après."
  - key: scenario-dto
    format: scenario
    question: Dans un DTO d'API, déclares-tu un champ `quantite` en `int` ou en `Integer` ?
    choices:
      - {text: "`Integer` avec `@NotNull` s'il est obligatoire : un `int` vaudrait 0 sans erreur si le champ manque", correct: true}
      - {text: "`int` s'il est obligatoire : la désérialisation refusera d'elle-même un champ manquant", correct: false}
      - {text: "`int` toujours : les enveloppes sont plus lentes et ne servent à rien dans un DTO", correct: false}
      - {text: "`Integer` toujours, sans validation : `null` signifiera zéro pour le domaine", correct: false}
    answer: "Tout dépend du sens de l'absence : un `int` vaudrait 0 si le champ manque, sans erreur. `Integer` avec `@NotNull` distingue « absent » de « zéro » et renvoie une 400 claire ; facultatif, `Integer` seul (null = non fourni). Dans le domaine, la valeur validée redevient un primitif."
  - key: scenario-comparaison
    format: scenario
    question: Un test compare deux `Integer` avec `==` et passe ; le même code échoue en production. Comment l'expliques-tu ?
    choices:
      - {text: "Le test prend des valeurs de -128 à 127, en cache : `==` y compare le même objet", correct: true}
      - {text: "La production tourne sur une autre JVM, qui compare les `Integer` autrement", correct: false}
      - {text: "Le compilateur traduit `==` en `equals` dans les tests, mais pas en production", correct: false}
      - {text: "En production, des `Integer` créés par d'autres threads ne sont jamais égaux", correct: false}
    answer: "`Integer.valueOf` (donc l'autoboxing) met en cache les valeurs de -128 à 127 : le test compare le même objet. En production, les valeurs plus grandes créent deux objets, et `==` compare des références. La correction : `equals` (ou `Objects.equals`), et une valeur hors du cache dans le test."
