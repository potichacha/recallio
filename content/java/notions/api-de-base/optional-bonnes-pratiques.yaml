notion: optional-bonnes-pratiques
lesson: |-
  `Optional` a été conçu pour **un seul usage** : le **type de retour** d'une méthode dont le résultat peut manquer
  (*Effective Java*, item 55). Utilisé ailleurs, il complique le code plus qu'il ne l'aide.

  | Usage | Bonne pratique |
  |---|---|
  | type de retour qui peut manquer | ✓ `Optional<Client> trouver(Id id)` |
  | paramètre de méthode | ✗ : une surcharge, ou un paramètre nullable documenté |
  | champ (dont entité JPA) | ✗ : un champ nullable, et un accesseur qui renvoie `Optional` |
  | collection | ✗ `Optional<List<T>>` : une liste **vide** |
  | élément de collection ou clé de map | ✗ |
  | primitif | `OptionalInt`, `OptionalLong`, `OptionalDouble` |

  ```java
  record Client(String nom, Adresse adresse) {               // adresse peut valoir null
      Optional<Adresse> adresseConnue() {                    // l'absence apparaît dans l'API
          return Optional.ofNullable(adresse);
      }
  }

  client.adresseConnue().map(Adresse::ville).orElse("inconnue");
  ```

  - Une méthode qui renvoie `Optional` ne renvoie **jamais `null`** : ce serait pire que tout.
  - `Optional` n'est pas `Serializable` : une autre raison de ne pas en faire un champ.
  - Il ne remplace pas la validation : une valeur obligatoire se vérifie à l'entrée (`Objects.requireNonNull`), elle ne
    devient pas un `Optional`.
  - On évite `Optional.get()` ; on évite aussi les chaînes interminables de `map` quand un simple `if` serait plus clair.

  **Piège classique** : `Optional<List<Commande>> commandes()`. Une liste vide dit déjà « rien » ; l'`Optional` ajoute
  un second « rien » à traiter.

  **En entretien** : « `Optional` en type de retour seulement, jamais `null` à la place, jamais en champ ni en
  paramètre, et une collection vide plutôt qu'un `Optional` de collection. »
cards:
  - key: utiliser-optional
    format: course
    question: Où ne PAS utiliser Optional ?
    answer: En paramètre ou en champ. Uniquement en type de retour.
  - key: collection
    format: course
    question: Pourquoi ne pas renvoyer `Optional<List<T>>` ?
    answer: Une liste vide exprime déjà l'absence de résultats ; l'`Optional` ajoute un second cas vide à traiter sans rien apporter.
  - key: jamais-null
    format: course
    question: Que ne doit jamais renvoyer une méthode de type `Optional<T>` ?
    answer: '`null` : l''appelant appellerait `map` ou `orElse` dessus et obtiendrait une `NullPointerException`, ce qu''`Optional` devait justement éviter.'
  - key: champ
    format: course
    question: Comment exposer un champ facultatif d'une entité ?
    answer: Le champ reste un type ordinaire, qui peut valoir `null` ; un accesseur renvoie `Optional.ofNullable(champ)`.
  - key: vf-parametre
    format: true-false
    question: "`void envoyer(Optional<String> copie)` est une bonne signature."
    truth: false
    answer: L'appelant doit construire un `Optional` et peut quand même passer `null` ; une surcharge est plus claire.
  - key: vf-serializable
    format: true-false
    question: "`Optional` est `Serializable`."
    truth: false
    answer: "Il n'a pas été conçu pour être stocké : un champ `Optional` casse la sérialisation."
  - key: vf-retour
    format: true-false
    question: "`Optional` est fait pour le type de retour d'une méthode dont le résultat peut manquer."
    truth: true
    answer: C'est son usage prévu.
  - key: vf-validation
    format: true-false
    question: Une valeur obligatoire reçue d'une API peut être stockée dans un `Optional` pour éviter les `NullPointerException`.
    truth: false
    answer: Une valeur obligatoire se valide à l'entrée ; la mettre dans un `Optional` repousse l'erreur.
  - key: qcm-bons-usages
    format: multiple-choice
    question: Lesquels sont de bons usages d'`Optional` ?
    choices:
      - text: "`Optional<Client> trouverParEmail(String email)`"
        correct: true
      - text: "`OptionalDouble moyenne()` sur une liste peut-être vide"
        correct: true
      - text: "`private Optional<String> surnom;` dans une entité"
        correct: false
      - text: "`List<Optional<Commande>>`"
        correct: false
    answer: '`Optional` est un type de retour, pas un type de stockage.'
  - key: qcm-liste
    format: multiple-choice
    question: Une recherche ne trouve aucune commande. Que doit-elle renvoyer, si son type est `List<Commande>` ?
    choices:
      - text: "`List.of()`"
        correct: true
      - text: "`null`"
        correct: false
      - text: "`Optional.empty()`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: Une liste vide.
  - key: qcm-parametre
    format: multiple-choice
    question: Par quoi remplacer `void envoyer(String message, Optional<String> copie)` ?
    choices:
      - text: "Deux méthodes : `envoyer(message)` et `envoyer(message, copie)`"
        correct: true
      - text: "`void envoyer(String message, Optional<Optional<String>> copie)`"
        correct: false
      - text: "`void envoyer(Optional<String> message, Optional<String> copie)`"
        correct: false
      - text: "Rien, c'est la bonne pratique"
        correct: false
    answer: La surcharge dit clairement les deux façons d'appeler.
  - key: qcm-flat-map-stream
    format: multiple-choice
    question: Comment obtenir les emails connus d'une liste de clients, dont la méthode `email()` renvoie un `Optional<String>` ?
    choices:
      - text: "`clients.stream().map(Client::email).flatMap(Optional::stream).toList()`"
        correct: true
      - text: "`clients.stream().map(Client::email).map(Optional::get).toList()`"
        correct: false
      - text: "`clients.stream().map(Client::email).toList()`"
        correct: false
      - text: "`clients.stream().filter(Optional::isPresent).toList()`"
        correct: false
    answer: '`Optional::stream` donne un flux d''un élément ou vide, que `flatMap` aplatit.'
  - key: code-flat-map-stream
    format: code-output
    question: |-
      ```java
      List<Integer> presents = Stream.of(Optional.of(1), Optional.<Integer>empty(), Optional.of(3))
              .flatMap(Optional::stream)
              .toList();
      System.out.println(presents);
      ```
    answer: '`[1, 3]` : les `Optional` vides disparaissent.'
    check:
      output: "[1, 3]"
  - key: code-accesseur
    format: code-output
    question: |-
      ```java
      record Adresse(String ville) { }
      record Client(Adresse adresse) {
          Optional<Adresse> adresseConnue() { return Optional.ofNullable(adresse); }
      }
      Client c = new Client(null);
      System.out.println(c.adresseConnue().map(Adresse::ville).orElse("inconnue"));
      ```
    answer: '`inconnue` : le champ reste nullable, l''accesseur expose l''absence.'
    check:
      output: "inconnue"
  - key: code-optional-null
    format: code-output
    question: |-
      ```java
      static Optional<String> chercher() { return null; }
      System.out.println(chercher().isPresent());
      ```
    answer: "Une `NullPointerException` : une méthode `Optional` qui renvoie `null` trahit son contrat."
    check:
      throws: NullPointerException
  - key: code-serialisation
    format: code-output
    question: |-
      ```java
      var sortie = new ObjectOutputStream(new ByteArrayOutputStream());
      sortie.writeObject(Optional.of("x"));
      ```
    answer: "Une `NotSerializableException` : `Optional` n'est pas sérialisable."
    check:
      throws: NotSerializableException
  - key: bug-champ-entite
    format: bug-fix
    question: |-
      Hibernate refuse de mapper ce champ :
      ```java
      @Entity
      class Client {
          private Optional<String> surnom;
      }
      ```
    answer: |-
      ```java
      @Entity
      class Client {
          private String surnom;   // peut valoir null

          public Optional<String> surnom() {
              return Optional.ofNullable(surnom);
          }
      }
      ```
      `Optional` n'est pas fait pour être stocké (ni sérialisable). Le champ reste nullable et l'accesseur expose
      l'absence.
  - key: bug-optional-liste
    format: bug-fix
    question: |-
      Simplifiez cette signature et son usage :
      ```java
      Optional<List<Commande>> commandes(Client c);
      // appel : commandes(c).orElse(List.of()).forEach(...)
      ```
    answer: |-
      ```java
      List<Commande> commandes(Client c);   // une liste vide si aucune commande
      // appel : commandes(c).forEach(...)
      ```
      Une collection vide exprime déjà l'absence ; l'`Optional` ajoutait un cas à traiter.
  - key: bug-retour-null
    format: bug-fix
    question: |-
      Les appelants plantent malgré l'`Optional` :
      ```java
      Optional<Client> trouver(String email) {
          if (email == null) return null;
          return Optional.ofNullable(index.get(email));
      }
      ```
    answer: |-
      ```java
      Optional<Client> trouver(String email) {
          if (email == null) return Optional.empty();
          return Optional.ofNullable(index.get(email));
      }
      ```
      Une méthode de type `Optional` ne renvoie jamais `null` : l'appelant appelle `map` ou `orElse` sans tester.
  - key: bug-parametre-optional
    format: bug-fix
    question: |-
      Les appelants écrivent `rechercher("ada", Optional.empty())` partout :
      ```java
      List<Client> rechercher(String nom, Optional<String> ville) { ... }
      ```
    answer: |-
      ```java
      List<Client> rechercher(String nom) { ... }
      List<Client> rechercher(String nom, String ville) { ... }
      ```
      Un `Optional` en paramètre alourdit chaque appel. Deux surcharges (ou un objet de critères) disent les deux
      façons de chercher.
  - key: methode-retourne-parfois-null-provoque-npe
    format: scenario
    question: Une méthode retourne parfois null et provoque des NPE en cascade.
    answer: |-
      Je changerais la signature pour retourner `Optional<T>`. L'absence devient explicite dans le contrat et le compilateur force l'appelant à la traiter.
      Côté appelant, je chaînerais avec `map` et `orElseThrow` plutôt qu'un `isPresent/get`, qui ne fait que déguiser le null check.
      Mais attention à ne pas généraliser : Optional en paramètre ou en champ d'entité est un anti-pattern. Et quand le null vient d'une source externe, la bonne réponse est de **valider en entrée** plutôt que de propager l'incertitude dans tout le code.
  - key: scenario-revue-optional
    format: scenario
    question: En revue de code, tu vois des `Optional` partout, y compris en paramètres et en champs. Que dis-tu ?
    answer: |-
      Que l'intention est bonne (rendre l'absence visible) mais que l'outil est mal placé. Je propose une règle d'équipe :
      `Optional` en type de retour seulement ; en champ, un type nullable avec un accesseur `Optional` ; en paramètre, des
      surcharges ou un objet de paramètres ; pour les collections, une collection vide. Pour vraiment éviter les `null`,
      on peut aussi annoter les packages (`@NullMarked` de JSpecify) et laisser un outil comme NullAway vérifier le code.
  - key: scenario-dto-api
    format: scenario
    question: Un champ facultatif d'un DTO d'API doit-il être un `Optional` ?
    answer: |-
      Non : un DTO est sérialisé et désérialisé (Jackson), et `Optional` n'est pas fait pour être stocké dans un champ.
      Je déclare le champ en type ordinaire, nullable (ou avec une valeur par défaut), et je le documente comme
      facultatif dans l'OpenAPI. À la conversion vers le domaine, je décide explicitement de la valeur d'une absence.
      Si je dois distinguer « absent » de « null explicite » (un PATCH), il faut un autre mécanisme (JSON Merge Patch),
      pas un `Optional`.
  - key: scenario-recherche
    format: scenario
    question: Une méthode `trouver(id)` renvoie `null` si l'élément n'existe pas. Comment la fais-tu évoluer sans casser les appelants ?
    answer: |-
      J'ajoute une méthode `Optional<T> chercher(id)` à côté, je migre les appelants un par un, puis je supprime (ou je
      déprécie d'abord) l'ancienne. Chaque appelant doit décider : valeur par défaut (`orElse`), exception métier
      (`orElseThrow`), ou traitement de l'absence. Si la plupart des appelants supposent que l'élément existe, une
      méthode `obtenir(id)` qui lève une exception claire peut aussi être plus juste qu'un `Optional`.
