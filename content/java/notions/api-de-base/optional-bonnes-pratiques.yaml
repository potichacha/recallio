notion: optional-bonnes-pratiques
lesson: |-
  `Optional` a été conçu pour **un seul usage** : le **type de retour** d'une méthode dont le résultat peut manquer
  (*Effective Java*, item 55). Utilisé ailleurs, il complique le code plus qu'il ne l'aide.

  | Usage | Bonne pratique |
  |---|---|
  | type de retour qui peut manquer | ✓ `Optional<Client> trouver(Id id)` |
  | paramètre de méthode | ✗ : une surcharge, ou un paramètre nullable documenté |
  | champ (dont entité JPA) | ✗ : un champ nullable, et un accesseur qui renvoie `Optional` |
  | collection | ✗ `Optional<List<T>>` : une liste **vide** |
  | élément de collection ou clé de map | ✗ |
  | primitif | `OptionalInt`, `OptionalLong`, `OptionalDouble` |

  ```java
  record Client(String nom, Adresse adresse) {               // adresse peut valoir null
      Optional<Adresse> adresseConnue() {                    // l'absence apparaît dans l'API
          return Optional.ofNullable(adresse);
      }
  }

  client.adresseConnue().map(Adresse::ville).orElse("inconnue");
  ```

  - Une méthode qui renvoie `Optional` ne renvoie **jamais `null`** : ce serait pire que tout.
  - `Optional` n'est pas `Serializable` : une autre raison de ne pas en faire un champ.
  - Il ne remplace pas la validation : une valeur obligatoire se vérifie à l'entrée (`Objects.requireNonNull`), elle ne
    devient pas un `Optional`.
  - On évite `Optional.get()` ; on évite aussi les chaînes interminables de `map` quand un simple `if` serait plus clair.

  **Piège classique** : `Optional<List<Commande>> commandes()`. Une liste vide dit déjà « rien » ; l'`Optional` ajoute
  un second « rien » à traiter.

  **En entretien** : « `Optional` en type de retour seulement, jamais `null` à la place, jamais en champ ni en
  paramètre, et une collection vide plutôt qu'un `Optional` de collection. »
cards:
  - key: utiliser-optional
    format: course
    question: "Où ne faut-il pas utiliser `Optional` ?"
    choices:
      - {text: "En paramètre ou en champ : il est fait pour les types de retour", correct: true}
      - {text: "En type de retour : il est fait pour les paramètres et les champs", correct: false}
      - {text: "Dans un flux : il est fait pour les boucles classiques", correct: false}
      - {text: "Nulle part : il convient partout où une valeur peut manquer", correct: false}
    answer: "En paramètre ou en champ : `Optional` est un type de retour, qui dit à l'appelant qu'un résultat peut manquer."
  - key: collection
    format: course
    question: Pourquoi ne pas renvoyer `Optional<List<T>>` ?
    choices:
      - {text: "Une liste vide exprime déjà l'absence ; l'`Optional` ajoute un second cas vide", correct: true}
      - {text: "`Optional` ne peut pas contenir de collection : ça ne compile pas", correct: false}
      - {text: "Une liste dans un `Optional` devient immuable et ne peut plus changer", correct: false}
      - {text: "Les frameworks ne savent pas sérialiser une liste dans un `Optional`", correct: false}
    answer: Une liste vide exprime déjà l'absence de résultats ; l'`Optional` ajoute un second cas vide à traiter sans rien apporter.
  - key: jamais-null
    format: course
    question: Que ne doit jamais renvoyer une méthode de type `Optional<T>` ?
    choices:
      - {text: "`null`, sur lequel l'appelant obtiendrait une `NullPointerException`", correct: true}
      - {text: "`Optional.empty()`, qui doit rester réservé aux opérations sur les flux", correct: false}
      - {text: "Un `Optional` qui contient une collection vide, plutôt qu'une absence", correct: false}
      - {text: "Une valeur passée par `Objects.requireNonNull`, jugée alors redondante", correct: false}
    answer: '`null` : l''appelant appellerait `map` ou `orElse` dessus et obtiendrait une `NullPointerException`, ce qu''`Optional` devait justement éviter.'
  - key: champ
    format: course
    question: Comment exposer un champ facultatif d'une entité ?
    choices:
      - {text: "Un champ ordinaire, qui peut valoir `null`, et un accesseur qui renvoie `Optional.ofNullable`", correct: true}
      - {text: "Un champ `Optional<T>`, initialisé à `Optional.empty()`, et un accesseur qui le renvoie", correct: false}
      - {text: "Un champ ordinaire, et un accesseur qui renvoie `null` quand la valeur manque", correct: false}
      - {text: "Un champ ordinaire, initialisé à une valeur bidon comme une chaîne vide", correct: false}
    answer: Le champ reste un type ordinaire, qui peut valoir `null` ; un accesseur renvoie `Optional.ofNullable(champ)`.
  - key: vf-parametre
    format: true-false
    question: "`void envoyer(Optional<String> copie)` est une bonne signature."
    truth: false
    answer: L'appelant doit construire un `Optional` et peut quand même passer `null` ; une surcharge est plus claire.
  - key: vf-serializable
    format: true-false
    question: "`Optional` est `Serializable`."
    truth: false
    answer: "Il n'a pas été conçu pour être stocké : un champ `Optional` casse la sérialisation."
  - key: vf-retour
    format: true-false
    question: "`Optional` est fait pour le type de retour d'une méthode dont le résultat peut manquer."
    truth: true
    answer: C'est son usage prévu.
  - key: vf-validation
    format: true-false
    question: Une valeur obligatoire reçue d'une API peut être stockée dans un `Optional` pour éviter les `NullPointerException`.
    truth: false
    answer: Une valeur obligatoire se valide à l'entrée ; la mettre dans un `Optional` repousse l'erreur.
  - key: qcm-bons-usages
    format: multiple-choice
    question: "Lequel de ces usages d'`Optional` est un bon usage ?"
    choices:
      - {text: "`Optional<Client> trouverParEmail(String email)`", correct: true}
      - {text: "`private Optional<String> surnom;` dans une entité", correct: false}
      - {text: "`List<Optional<Commande>>`", correct: false}
      - {text: "`void envoyer(Optional<String> copie)`", correct: false}
    answer: "`Optional` est un type de retour, pas un type de stockage (champ, élément de collection) ni un paramètre. `OptionalDouble moyenne()` sur une liste peut-être vide en est un autre bon usage."
  - key: qcm-liste
    format: multiple-choice
    question: Une recherche ne trouve aucune commande. Que doit-elle renvoyer, si son type est `List<Commande>` ?
    choices:
      - text: "`List.of()`"
        correct: true
      - text: "`null`"
        correct: false
      - text: "`Optional.empty()`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: Une liste vide.
  - key: qcm-parametre
    format: multiple-choice
    question: Par quoi remplacer `void envoyer(String message, Optional<String> copie)` ?
    choices:
      - text: "Deux méthodes : `envoyer(message)` et `envoyer(message, copie)`"
        correct: true
      - text: "`void envoyer(String message, Optional<Optional<String>> copie)`"
        correct: false
      - text: "`void envoyer(Optional<String> message, Optional<String> copie)`"
        correct: false
      - text: "Rien, c'est la bonne pratique"
        correct: false
    answer: La surcharge dit clairement les deux façons d'appeler.
  - key: qcm-flat-map-stream
    format: multiple-choice
    question: Comment obtenir les emails connus d'une liste de clients, dont la méthode `email()` renvoie un `Optional<String>` ?
    choices:
      - text: "`clients.stream().map(Client::email).flatMap(Optional::stream).toList()`"
        correct: true
      - text: "`clients.stream().map(Client::email).map(Optional::get).toList()`"
        correct: false
      - text: "`clients.stream().map(Client::email).toList()`"
        correct: false
      - text: "`clients.stream().filter(Optional::isPresent).toList()`"
        correct: false
    answer: '`Optional::stream` donne un flux d''un élément ou vide, que `flatMap` aplatit.'
  - key: code-flat-map-stream
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> presents = Stream.of(Optional.of(1), Optional.<Integer>empty(), Optional.of(3))
              .flatMap(Optional::stream)
              .toList();
      System.out.println(presents);
      ```
    choices:
      - {text: "`[1, 3]`", correct: true}
      - {text: "`[1, null, 3]`", correct: false}
      - {text: "`[Optional[1], Optional[3]]`", correct: false}
      - {text: "Une `NoSuchElementException`", correct: false}
    answer: '`[1, 3]` : les `Optional` vides disparaissent.'
    check:
      output: "[1, 3]"
  - key: code-accesseur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Adresse(String ville) { }
      record Client(Adresse adresse) {
          Optional<Adresse> adresseConnue() { return Optional.ofNullable(adresse); }
      }
      Client c = new Client(null);
      System.out.println(c.adresseConnue().map(Adresse::ville).orElse("inconnue"));
      ```
    choices:
      - {text: "`inconnue`", correct: true}
      - {text: "`null`", correct: false}
      - {text: "`Optional.empty`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: '`inconnue` : le champ reste nullable, l''accesseur expose l''absence.'
    check:
      output: "inconnue"
  - key: code-optional-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static Optional<String> chercher() { return null; }
      System.out.println(chercher().isPresent());
      ```
    choices:
      - {text: "Une `NullPointerException`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`true`", correct: false}
      - {text: "`Optional.empty`", correct: false}
    answer: "Une `NullPointerException` : une méthode `Optional` qui renvoie `null` trahit son contrat."
    check:
      throws: NullPointerException
  - key: code-serialisation
    format: code-output
    question: |-
      Que se passe-t-il à l'exécution de ce code ?
      ```java
      var sortie = new ObjectOutputStream(new ByteArrayOutputStream());
      sortie.writeObject(Optional.of("x"));
      ```
    choices:
      - {text: "Une `NotSerializableException`", correct: true}
      - {text: "Rien : l'`Optional` est écrit dans le flux", correct: false}
      - {text: "Rien : seul son contenu, `x`, est écrit", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: "Une `NotSerializableException` : `Optional` n'est pas sérialisable."
    check:
      throws: NotSerializableException
  - key: bug-champ-entite
    format: bug-fix
    question: |-
      Hibernate refuse de mapper ce champ :
      ```java
      @Entity
      class Client {
          private Optional<String> surnom;
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un champ `String` nullable, et un accesseur qui renvoie `Optional.ofNullable(surnom)`", correct: true}
      - {text: "Initialiser le champ à `Optional.empty()`, pour que Hibernate en reconnaisse le type", correct: false}
      - {text: "Déclarer le champ `transient`, en gardant son type `Optional<String>`", correct: false}
      - {text: "Annoter le champ `@Column(nullable = true)`, en gardant son type `Optional<String>`", correct: false}
    answer: |-
      ```java
      @Entity
      class Client {
          private String surnom;   // peut valoir null

          public Optional<String> surnom() {
              return Optional.ofNullable(surnom);
          }
      }
      ```
      `Optional` n'est pas fait pour être stocké (ni sérialisable). Le champ reste nullable et l'accesseur expose
      l'absence.
  - key: bug-optional-liste
    format: bug-fix
    question: |-
      Comment simplifier cette signature et son usage ?
      ```java
      Optional<List<Commande>> commandes(Client c);
      // appel : commandes(c).orElse(List.of()).forEach(...)
      ```
    choices:
      - {text: "Renvoyer `List<Commande>`, vide s'il n'y a aucune commande", correct: true}
      - {text: "Renvoyer `List<Optional<Commande>>`, une absence par élément", correct: false}
      - {text: "Renvoyer `Optional<Commande[]>`, plus léger qu'une liste", correct: false}
      - {text: "Renvoyer `null` quand le client n'a passé aucune commande", correct: false}
    answer: |-
      ```java
      List<Commande> commandes(Client c);   // une liste vide si aucune commande
      // appel : commandes(c).forEach(...)
      ```
      Une collection vide exprime déjà l'absence ; l'`Optional` ajoutait un cas à traiter.
  - key: bug-retour-null
    format: bug-fix
    question: |-
      Les appelants plantent malgré l'`Optional` :
      ```java
      Optional<Client> trouver(String email) {
          if (email == null) return null;
          return Optional.ofNullable(index.get(email));
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if (email == null) return Optional.empty();`", correct: true}
      - {text: "`if (email == null) return Optional.of(null);`", correct: false}
      - {text: "Demander aux appelants de tester `trouver(email) != null`", correct: false}
      - {text: "Annoter le retour `@Nullable`, en gardant le `return null`", correct: false}
    answer: |-
      ```java
      Optional<Client> trouver(String email) {
          if (email == null) return Optional.empty();
          return Optional.ofNullable(index.get(email));
      }
      ```
      Une méthode de type `Optional` ne renvoie jamais `null` : l'appelant appelle `map` ou `orElse` sans tester.
  - key: bug-parametre-optional
    format: bug-fix
    question: |-
      Les appelants écrivent `rechercher("ada", Optional.empty())` partout :
      ```java
      List<Client> rechercher(String nom, Optional<String> ville) { ... }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Deux surcharges : `rechercher(nom)` et `rechercher(nom, ville)`", correct: true}
      - {text: "Une constante `SANS_VILLE = Optional.empty()`, à passer partout", correct: false}
      - {text: "Passer `null` plutôt qu'`Optional.empty()` pour la ville", correct: false}
      - {text: "Un paramètre `String... villes`, rempli au besoin", correct: false}
    answer: |-
      ```java
      List<Client> rechercher(String nom) { ... }
      List<Client> rechercher(String nom, String ville) { ... }
      ```
      Un `Optional` en paramètre alourdit chaque appel. Deux surcharges (ou un objet de critères) disent les deux
      façons de chercher.
  - key: methode-retourne-parfois-null-provoque-npe
    format: scenario
    question: "Une méthode renvoie parfois `null` et provoque des `NullPointerException` en cascade. Que fais-tu ?"
    choices:
      - {text: "Elle renvoie un `Optional<T>`, et ses appelants enchaînent `map` et `orElseThrow`", correct: true}
      - {text: "J'entoure chaque appel d'un `try` qui attrape la `NullPointerException`", correct: false}
      - {text: "Je passe aussi tous ses paramètres et les champs concernés en `Optional`", correct: false}
      - {text: "J'ajoute un `if (x != null)` partout où sa valeur est utilisée", correct: false}
    answer: "Elle renvoie un `Optional<T>` : l'absence devient explicite dans le contrat, et l'appelant la traite avec `map` et `orElseThrow` plutôt qu'un `isPresent`/`get`. Sans généraliser : `Optional` en paramètre ou en champ est un anti-pattern, et un `null` venu de l'extérieur se valide en entrée."
  - key: scenario-revue-optional
    format: scenario
    question: En revue de code, tu vois des `Optional` partout, y compris en paramètres et en champs. Que dis-tu ?
    choices:
      - {text: "Bonne intention, mauvais outil : `Optional` en retour seulement, des surcharges et des champs nullables ailleurs", correct: true}
      - {text: "Que c'est parfait : plus il y a d'`Optional`, moins il y aura de `NullPointerException`", correct: false}
      - {text: "Qu'il faut tous les retirer et revenir à des `null` documentés dans la Javadoc", correct: false}
      - {text: "Qu'il faut les garder, mais remplacer les `map` par des couples `isPresent` et `get`", correct: false}
    answer: "L'intention est bonne (rendre l'absence visible), l'outil est mal placé. Règle d'équipe : `Optional` en type de retour seulement ; en champ, un type nullable et un accesseur `Optional` ; en paramètre, des surcharges ; pour une collection, une collection vide. Pour aller plus loin, `@NullMarked` (JSpecify) et NullAway vérifient le code."
  - key: scenario-dto-api
    format: scenario
    question: Un champ facultatif d'un DTO d'API doit-il être un `Optional` ?
    choices:
      - {text: "Non : un type ordinaire nullable, documenté comme facultatif dans l'OpenAPI", correct: true}
      - {text: "Oui : Jackson lit et écrit un champ `Optional` sans aucun module particulier", correct: false}
      - {text: "Oui : c'est le seul moyen de distinguer un champ absent d'un `null` explicite", correct: false}
      - {text: "Non : un champ facultatif reçoit toujours une chaîne vide par défaut", correct: false}
    answer: "Non : un DTO est sérialisé par Jackson, et `Optional` n'est pas fait pour être stocké dans un champ. Le champ est d'un type ordinaire, nullable, documenté comme facultatif ; la conversion vers le domaine décide de la valeur d'une absence. Distinguer « absent » de « null explicite » (un PATCH) demande un autre mécanisme, JSON Merge Patch."
  - key: scenario-recherche
    format: scenario
    question: Une méthode `trouver(id)` renvoie `null` si l'élément n'existe pas. Comment la fais-tu évoluer sans casser les appelants ?
    choices:
      - {text: "Ajouter `Optional<T> chercher(id)` à côté, migrer les appelants, puis déprécier l'ancienne", correct: true}
      - {text: "Changer le type de retour de `trouver(id)` en `Optional<T>`, dans le même commit", correct: false}
      - {text: "Faire lever une exception à `trouver(id)` dès maintenant, sans prévenir les appelants", correct: false}
      - {text: "Garder le `null` et l'écrire dans la Javadoc de `trouver(id)`", correct: false}
    answer: "J'ajoute `Optional<T> chercher(id)` à côté, je migre les appelants un par un, puis je déprécie et supprime l'ancienne. Chaque appelant décide : défaut (`orElse`), exception métier (`orElseThrow`) ou traitement de l'absence. Si la plupart supposent que l'élément existe, un `obtenir(id)` qui lève une exception claire peut être plus juste."
