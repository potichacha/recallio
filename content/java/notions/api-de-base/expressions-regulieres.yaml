notion: expressions-regulieres
lesson: |-
  Une **expression régulière** décrit un motif de texte. En Java, on la compile en `Pattern` (immuable, thread-safe,
  à garder en `static final`), puis on l'applique avec un `Matcher` (avec état, à créer pour chaque texte).

  ```java
  private static final Pattern DATE = Pattern.compile("(?<annee>\\d{4})-(?<mois>\\d{2})-(?<jour>\\d{2})");

  Matcher m = DATE.matcher("Livré le 2025-03-14.");
  if (m.find()) {                       // find : le motif apparaît QUELQUE PART
      m.group("annee");                 // "2025"
  }
  DATE.matcher("2025-03-14").matches(); // matches : TOUT le texte correspond
  ```

  Repères : `\d` chiffre, `\w` lettre ou chiffre, `\s` blanc, `.` n'importe quel caractère, `[a-z]` classe, `^` et `$`
  ancres, `*` `+` `?` `{2,4}` quantificateurs, `(...)` groupe, `(?<nom>...)` groupe nommé, `|` alternative.

  - En Java, chaque `\` de la regex s'écrit `\\` dans le littéral : `"\\d+"`.
  - `String.matches`, `replaceAll` et `split` compilent la regex **à chaque appel** : dans une boucle, on garde un
    `Pattern`.
  - Les quantificateurs sont **gourmands** (`.*` prend le plus possible) ; `.*?` est **paresseux**.
  - `replaceAll` accepte des références de groupes (`$1`) ; pour remplacer par un texte quelconque, on l'échappe avec
    `Matcher.quoteReplacement`.
  - **ReDoS** : un motif comme `(a+)+$` explose en temps sur une entrée malveillante (*backtracking* exponentiel). On
    évite les quantificateurs imbriqués et on limite la taille des entrées.

  **Piège classique** : valider un format avec `find()`. `"\\d{5}"` trouve cinq chiffres **dans** `"123456"` ; pour
  valider, il faut `matches()` (ou des ancres `^...$`).

  **En entretien** : « Un `Pattern` compilé une fois, un `Matcher` par texte ; `matches` pour valider, `find` pour
  chercher ; et attention au ReDoS. »
cards:
  - key: replace-vs-replaceall
    format: course
    question: "Quelle différence entre `replace` et `replaceAll` ?"
    choices:
      - {text: "`replace` remplace un texte littéral ; `replaceAll` lit son premier argument comme une regex", correct: true}
      - {text: "`replace` ne remplace que la première occurrence ; `replaceAll` les remplace toutes", correct: false}
      - {text: "`replace` lit son premier argument comme une regex ; `replaceAll` remplace un texte littéral", correct: false}
      - {text: "`replace` ne prend que des `char` ; `replaceAll` accepte aussi des chaînes entières", correct: false}
    answer: "`replace` remplace un texte littéral, à toutes ses occurrences ; `replaceAll` interprète le premier argument comme une regex. La première occurrence seule, c'est `replaceFirst`."
  - key: pattern-matcher-sont-ils-thread-safe
    format: course
    question: "`Pattern` et `Matcher` sont-ils thread-safe ?"
    choices:
      - {text: "`Pattern` oui, il est immuable ; `Matcher` non, il garde un état", correct: true}
      - {text: "`Matcher` oui, il est immuable ; `Pattern` non, il garde un état", correct: false}
      - {text: "Les deux le sont, et se partagent librement entre threads", correct: false}
      - {text: "Aucun : il faut recompiler le motif dans chaque thread", correct: false}
    answer: "`Pattern` oui : on le compile une fois et on le partage. `Matcher` non : il garde sa position dans le texte, on en crée un par usage."
  - key: redos
    format: course
    question: "Qu'est-ce qu'un ReDoS ?"
    choices:
      - {text: "Un déni de service causé par une regex au backtracking exponentiel sur une entrée piégée", correct: true}
      - {text: "Une injection de code par une regex construite à partir d'une saisie utilisateur", correct: false}
      - {text: "Une regex qui épuise la mémoire du tas en compilant un motif trop long", correct: false}
      - {text: "Une attaque qui contourne une validation par regex avec des caractères Unicode", correct: false}
    answer: Un déni de service causé par une regex au backtracking exponentiel sur une entrée malveillante.
  - key: find-vs-matches
    format: course
    question: Quelle différence entre `find()` et `matches()` ?
    choices:
      - {text: "`find()` cherche le motif n'importe où ; `matches()` exige que tout le texte corresponde", correct: true}
      - {text: "`find()` exige que tout le texte corresponde ; `matches()` cherche le motif n'importe où", correct: false}
      - {text: "`find()` renvoie la position trouvée ; `matches()` renvoie le texte trouvé", correct: false}
      - {text: "`find()` ne cherche qu'au début du texte ; `matches()` le parcourt en entier", correct: false}
    answer: '`find()` cherche le motif n''importe où dans le texte (et peut être rappelé pour l''occurrence suivante) ; `matches()` exige que le texte entier corresponde.'
  - key: vf-matches-partiel
    format: true-false
    question: "`\"abc123\".matches(\"\\\\d+\")` vaut `true`."
    truth: false
    answer: '`matches` exige que toute la chaîne corresponde ; `"abc123"` contient des lettres.'
  - key: vf-pattern-static
    format: true-false
    question: Un `Pattern` peut être partagé en `static final` entre threads.
    truth: true
    answer: Il est immuable ; ce sont les `Matcher` qui ont un état.
  - key: vf-gourmand
    format: true-false
    question: "Le quantificateur `.*` est paresseux : il prend le moins de caractères possible."
    truth: false
    answer: Il est gourmand ; `.*?` est la version paresseuse.
  - key: vf-replace-all-regex
    format: true-false
    question: "`\"a.b\".replaceAll(\".\", \"-\")` renvoie `a-b`."
    truth: false
    answer: '`.` correspond à tout caractère : on obtient `---`. Il fallait `replace(".", "-")`.'
  - key: qcm-valider
    format: multiple-choice
    question: "Lequel de ces tests vérifie qu'un code postal fait exactement cinq chiffres ?"
    choices:
      - {text: "`codePostal.matches(\"\\\\d{5}\")`", correct: true}
      - {text: "`Pattern.compile(\"\\\\d{5}\").matcher(codePostal).find()`", correct: false}
      - {text: "`Pattern.compile(\"\\\\d{5}\").matcher(codePostal).lookingAt()`", correct: false}
      - {text: "`codePostal.contains(\"\\\\d{5}\")`", correct: false}
    answer: "`matches` porte sur tout le texte (comme `find` avec les ancres `^` et `$`). Sans ancres, `find` et `lookingAt` acceptent `\"123456\"` ; `contains` ne comprend pas les regex."
  - key: qcm-paresseux
    format: multiple-choice
    question: "Que renvoie `\"<a><b>\".replaceAll(\"<.*?>\", \"X\")` ?"
    choices:
      - text: "\"XX\""
        correct: true
      - text: "\"X\""
        correct: false
      - text: "\"<a><b>\""
        correct: false
      - text: "\"X><X\""
        correct: false
    answer: Le quantificateur paresseux s'arrête au premier `>` ; la version gourmande `<.*>` donnerait `X`.
  - key: qcm-groupe
    format: multiple-choice
    question: "Un `Matcher` a trouvé le motif `(?<annee>\\d{4})`. Quel appel renvoie l'année capturée ?"
    choices:
      - {text: "`matcher.group(\"annee\")`", correct: true}
      - {text: "`matcher.group(0)`", correct: false}
      - {text: "`matcher.start(\"annee\")`", correct: false}
      - {text: "`matcher.annee()`", correct: false}
    answer: "`group(\"annee\")`, ou `group(1)` si c'est le premier groupe. `group(0)` est la correspondance entière, et `start(\"annee\")` sa position."
  - key: qcm-redos
    format: multiple-choice
    question: Lequel de ces motifs est vulnérable au ReDoS ?
    choices:
      - text: "`^(a+)+$`"
        correct: true
      - text: "`^a+$`"
        correct: false
      - text: "`^[a-z]{1,20}$`"
        correct: false
      - text: "`^\\d{4}$`"
        correct: false
    answer: Le quantificateur imbriqué multiplie les façons de découper l'entrée en cas d'échec.
  - key: code-matches
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("abc123".matches("\\d+") + " " + "123".matches("\\d+"));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: '`false true` : `matches` porte sur tout le texte.'
    check:
      output: "false true"
  - key: code-groupes-nommes
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Matcher m = Pattern.compile("(?<annee>\\d{4})-(?<mois>\\d{2})").matcher("Le 2025-03 puis 2026-11");
      while (m.find()) {
          System.out.print(m.group("mois") + "/" + m.group("annee") + ";");
      }
      ```
    choices:
      - {text: "`03/2025;11/2026;`", correct: true}
      - {text: "`03/2025;`", correct: false}
      - {text: "`2025/03;2026/11;`", correct: false}
      - {text: "`11/2026;`", correct: false}
    answer: '`03/2025;11/2026;` : `find` avance d''occurrence en occurrence.'
    check:
      output: "03/2025;11/2026;"
  - key: code-gourmand
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("<a><b>".replaceAll("<.*>", "X") + " " + "<a><b>".replaceAll("<.*?>", "X"));
      ```
    choices:
      - {text: "`X XX`", correct: true}
      - {text: "`XX XX`", correct: false}
      - {text: "`X X`", correct: false}
      - {text: "`XX X`", correct: false}
    answer: "`X XX` : `.*` est gourmand et prend tout jusqu'au dernier `>` ; `.*?` est paresseux et s'arrête au premier."
    check:
      output: "X XX"
  - key: code-references
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("Lovelace, Ada".replaceAll("(\\w+), (\\w+)", "$2 $1"));
      ```
    choices:
      - {text: "`Ada Lovelace`", correct: true}
      - {text: "`$2 $1`", correct: false}
      - {text: "`Lovelace Ada`", correct: false}
      - {text: "`Lovelace, Ada`", correct: false}
    answer: '`Ada Lovelace` : `$1` et `$2` désignent les groupes capturés.'
    check:
      output: "Ada Lovelace"
  - key: bug-compile-boucle
    format: bug-fix
    question: |-
      Le profilage montre que cette validation coûte cher sur un million de lignes :
      ```java
      for (String ligne : lignes) {
          if (ligne.matches("[A-Z]{3}-\\d{4}")) { ... }
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Compiler le `Pattern` une fois, en constante, et appeler `matcher(ligne).matches()`", correct: true}
      - {text: "Remplacer `matches` par `contains`, qui fait le même contrôle en plus rapide", correct: false}
      - {text: "Paralléliser la boucle avec `parallelStream()`, sans toucher à la regex", correct: false}
      - {text: "Ajouter `^` et `$` au motif, pour que `matches` s'arrête plus tôt", correct: false}
    answer: |-
      ```java
      private static final Pattern REFERENCE = Pattern.compile("[A-Z]{3}-\\d{4}");

      for (String ligne : lignes) {
          if (REFERENCE.matcher(ligne).matches()) { ... }
      }
      ```
      `String.matches` recompile l'expression à chaque appel. Un `Pattern` compilé une fois (et thread-safe) évite ce
      travail.
  - key: bug-find-validation
    format: bug-fix
    question: |-
      Le code postal `"750012"` est accepté comme valide :
      ```java
      boolean valide = Pattern.compile("\\d{5}").matcher(codePostal).find();
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `matches()` au lieu de `find()`", correct: true}
      - {text: "Appeler `lookingAt()` au lieu de `find()`", correct: false}
      - {text: "Écrire le motif `[0-9]{5}`, plus strict", correct: false}
      - {text: "Appeler `find()` une seconde fois, pour vérifier", correct: false}
    answer: |-
      ```java
      boolean valide = Pattern.compile("\\d{5}").matcher(codePostal).matches();
      ```
      `find` trouve cinq chiffres à l'intérieur de six ; `matches` exige que tout le texte corresponde.
  - key: bug-replace-all-point
    format: bug-fix
    question: |-
      `"1.234.567"` devient `"---------"` au lieu de `"1234567"` :
      ```java
      String nombre = saisie.replaceAll(".", "");
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`saisie.replace(\".\", \"\")`", correct: true}
      - {text: "`saisie.replaceFirst(\".\", \"\")`", correct: false}
      - {text: "`saisie.replace('.', ' ')`", correct: false}
      - {text: "`saisie.replaceAll(\".*\", \"\")`", correct: false}
    answer: |-
      ```java
      String nombre = saisie.replace(".", "");
      ```
      `replaceAll` interprète `.` comme « n'importe quel caractère ». `replace` remplace le texte littéral (et remplace
      lui aussi toutes les occurrences).
  - key: bug-quote-replacement
    format: bug-fix
    question: |-
      Le remplacement échoue avec `IllegalArgumentException: Illegal group reference` quand le prix contient `$` :
      ```java
      String message = gabarit.replaceAll("\\{prix\\}", prix);   // prix = "12$"
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`gabarit.replace(\"{prix}\", prix)`, qui n'interprète pas le `$`", correct: true}
      - {text: "`gabarit.replaceAll(\"{prix}\", prix)`, sans échapper les accolades", correct: false}
      - {text: "Échapper le prix avec `Pattern.quote(prix)` avant le `replaceAll`", correct: false}
      - {text: "Attraper l'`IllegalArgumentException` et garder le gabarit tel quel", correct: false}
    answer: |-
      ```java
      String message = gabarit.replace("{prix}", prix);
      // ou, avec une regex : replaceAll("\\{prix\\}", Matcher.quoteReplacement(prix))
      ```
      Dans le remplacement de `replaceAll`, `$` et `\` ont un sens spécial. `replace` ne les interprète pas ; avec une
      regex, `Matcher.quoteReplacement` échappe le texte.
  - key: definition-redos
    format: definition
    question: "Que désigne le sigle ReDoS ?"
    choices:
      - {text: "Un déni de service par expression régulière", correct: true}
      - {text: "Une expression régulière récursive, qui s'appelle elle-même", correct: false}
      - {text: "Une redirection de domaine imposée par le serveur DNS", correct: false}
      - {text: "Une expression régulière déterministe, sans retour arrière", correct: false}
    answer: "*Regular expression Denial of Service* : une regex au backtracking exponentiel, qu'une entrée piégée fait tourner presque sans fin."
  - key: definition-groupe
    format: definition
    question: "Qu'est-ce qu'un groupe capturant, dans une expression régulière ?"
    choices:
      - {text: "Une partie du motif entre parenthèses, dont le texte trouvé se récupère ensuite", correct: true}
      - {text: "Une partie du motif entre parenthèses, qui ne garde pas le texte trouvé", correct: false}
      - {text: "Une classe de caractères entre crochets, comme `[a-z]`", correct: false}
      - {text: "Un ensemble de motifs compilés ensemble dans un même `Pattern`", correct: false}
    answer: "Une partie d'expression régulière entre parenthèses, dont le texte correspondant est récupérable (`group(1)`, `group(\"nom\")`, `$1`). `(?:...)` groupe sans capturer."
  - key: definition-paresseux
    format: definition
    question: "Qu'est-ce qu'un quantificateur paresseux ?"
    choices:
      - {text: "Un quantificateur suivi de `?` (`*?`, `+?`), qui prend le moins de caractères possible", correct: true}
      - {text: "Un quantificateur suivi de `+` (`*+`, `++`), qui ne revient jamais en arrière", correct: false}
      - {text: "Un quantificateur seul (`*`, `+`), qui prend le plus de caractères possible", correct: false}
      - {text: "Un quantificateur à bornes (`{2,5}`), évalué seulement quand le reste a échoué", correct: false}
    answer: "Un quantificateur suivi de `?` (`*?`, `+?`) prend le moins de caractères possible, au lieu du plus possible. Suivi de `+`, il est possessif ; seul, gourmand."
  - key: definition-ancre
    format: definition
    question: "Qu'est-ce qu'une ancre, dans une expression régulière ?"
    choices:
      - {text: "Un élément qui correspond à une position, non à un caractère, comme `^` ou `$`", correct: true}
      - {text: "Un groupe nommé, comme `(?<nom>...)`, qui sert de repère dans le motif", correct: false}
      - {text: "Un quantificateur qui fixe le nombre exact de répétitions, comme `{5}`", correct: false}
      - {text: "Une référence à un groupe déjà capturé, comme `$1` dans un remplacement", correct: false}
    answer: Un élément qui correspond à une position et non à un caractère, comme `^` (début) et `$` (fin).
