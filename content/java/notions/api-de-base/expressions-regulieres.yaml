notion: expressions-regulieres
lesson: |-
  Une **expression régulière** décrit un motif de texte. En Java, on la compile en `Pattern` (immuable, thread-safe,
  à garder en `static final`), puis on l'applique avec un `Matcher` (avec état, à créer pour chaque texte).

  ```java
  private static final Pattern DATE = Pattern.compile("(?<annee>\\d{4})-(?<mois>\\d{2})-(?<jour>\\d{2})");

  Matcher m = DATE.matcher("Livré le 2025-03-14.");
  if (m.find()) {                       // find : le motif apparaît QUELQUE PART
      m.group("annee");                 // "2025"
  }
  DATE.matcher("2025-03-14").matches(); // matches : TOUT le texte correspond
  ```

  Repères : `\d` chiffre, `\w` lettre ou chiffre, `\s` blanc, `.` n'importe quel caractère, `[a-z]` classe, `^` et `$`
  ancres, `*` `+` `?` `{2,4}` quantificateurs, `(...)` groupe, `(?<nom>...)` groupe nommé, `|` alternative.

  - En Java, chaque `\` de la regex s'écrit `\\` dans le littéral : `"\\d+"`.
  - `String.matches`, `replaceAll` et `split` compilent la regex **à chaque appel** : dans une boucle, on garde un
    `Pattern`.
  - Les quantificateurs sont **gourmands** (`.*` prend le plus possible) ; `.*?` est **paresseux**.
  - `replaceAll` accepte des références de groupes (`$1`) ; pour remplacer par un texte quelconque, on l'échappe avec
    `Matcher.quoteReplacement`.
  - **ReDoS** : un motif comme `(a+)+$` explose en temps sur une entrée malveillante (*backtracking* exponentiel). On
    évite les quantificateurs imbriqués et on limite la taille des entrées.

  **Piège classique** : valider un format avec `find()`. `"\\d{5}"` trouve cinq chiffres **dans** `"123456"` ; pour
  valider, il faut `matches()` (ou des ancres `^...$`).

  **En entretien** : « Un `Pattern` compilé une fois, un `Matcher` par texte ; `matches` pour valider, `find` pour
  chercher ; et attention au ReDoS. »
cards:
  - key: replace-vs-replaceall
    format: course
    question: replace vs replaceAll ?
    answer: replace remplace un littéral ; replaceAll interprète le premier argument comme une regex.
  - key: pattern-matcher-sont-ils-thread-safe
    format: course
    question: Pattern et Matcher sont-ils thread-safe ?
    answer: Pattern oui, Matcher non.
  - key: redos
    format: course
    question: C'est quoi un ReDoS ?
    answer: Un déni de service causé par une regex au backtracking exponentiel sur une entrée malveillante.
  - key: find-vs-matches
    format: course
    question: Quelle différence entre `find()` et `matches()` ?
    answer: '`find()` cherche le motif n''importe où dans le texte (et peut être rappelé pour l''occurrence suivante) ; `matches()` exige que le texte entier corresponde.'
  - key: vf-matches-partiel
    format: true-false
    question: "`\"abc123\".matches(\"\\\\d+\")` vaut `true`."
    truth: false
    answer: '`matches` exige que toute la chaîne corresponde ; `"abc123"` contient des lettres.'
  - key: vf-pattern-static
    format: true-false
    question: Un `Pattern` peut être partagé en `static final` entre threads.
    truth: true
    answer: Il est immuable ; ce sont les `Matcher` qui ont un état.
  - key: vf-gourmand
    format: true-false
    question: "Le quantificateur `.*` est paresseux : il prend le moins de caractères possible."
    truth: false
    answer: Il est gourmand ; `.*?` est la version paresseuse.
  - key: vf-replace-all-regex
    format: true-false
    question: "`\"a.b\".replaceAll(\".\", \"-\")` renvoie `a-b`."
    truth: false
    answer: '`.` correspond à tout caractère : on obtient `---`. Il fallait `replace(".", "-")`.'
  - key: qcm-valider
    format: multiple-choice
    question: Comment vérifier qu'un code postal fait exactement cinq chiffres ?
    choices:
      - text: "`codePostal.matches(\"\\\\d{5}\")`"
        correct: true
      - text: "`Pattern.compile(\"^\\\\d{5}$\").matcher(codePostal).find()`"
        correct: true
      - text: "`Pattern.compile(\"\\\\d{5}\").matcher(codePostal).find()`"
        correct: false
      - text: "`codePostal.contains(\"\\\\d{5}\")`"
        correct: false
    answer: Sans ancres, `find` accepte `"123456"` ; `contains` ne comprend pas les regex.
  - key: qcm-paresseux
    format: multiple-choice
    question: "Que renvoie `\"<a><b>\".replaceAll(\"<.*?>\", \"X\")` ?"
    choices:
      - text: "\"XX\""
        correct: true
      - text: "\"X\""
        correct: false
      - text: "\"<a><b>\""
        correct: false
      - text: "\"X><X\""
        correct: false
    answer: Le quantificateur paresseux s'arrête au premier `>` ; la version gourmande `<.*>` donnerait `X`.
  - key: qcm-groupe
    format: multiple-choice
    question: Comment récupérer l'année capturée par `(?<annee>\d{4})` ?
    choices:
      - text: "`matcher.group(\"annee\")`"
        correct: true
      - text: "`matcher.group(1)`, si c'est le premier groupe"
        correct: true
      - text: "`matcher.annee()`"
        correct: false
      - text: "`matcher.group(0)`"
        correct: false
    answer: Le groupe 0 est la correspondance entière.
  - key: qcm-redos
    format: multiple-choice
    question: Lequel de ces motifs est vulnérable au ReDoS ?
    choices:
      - text: "`^(a+)+$`"
        correct: true
      - text: "`^a+$`"
        correct: false
      - text: "`^[a-z]{1,20}$`"
        correct: false
      - text: "`^\\d{4}$`"
        correct: false
    answer: Le quantificateur imbriqué multiplie les façons de découper l'entrée en cas d'échec.
  - key: code-matches
    format: code-output
    question: |-
      ```java
      System.out.println("abc123".matches("\\d+") + " " + "123".matches("\\d+"));
      ```
    answer: '`false true` : `matches` porte sur tout le texte.'
    check:
      output: "false true"
  - key: code-groupes-nommes
    format: code-output
    question: |-
      ```java
      Matcher m = Pattern.compile("(?<annee>\\d{4})-(?<mois>\\d{2})").matcher("Le 2025-03 puis 2026-11");
      while (m.find()) {
          System.out.print(m.group("mois") + "/" + m.group("annee") + ";");
      }
      ```
    answer: '`03/2025;11/2026;` : `find` avance d''occurrence en occurrence.'
    check:
      output: "03/2025;11/2026;"
  - key: code-gourmand
    format: code-output
    question: |-
      ```java
      System.out.println("<a><b>".replaceAll("<.*>", "X") + " " + "<a><b>".replaceAll("<.*?>", "X"));
      ```
    answer: '`X XX` : gourmand, puis paresseux.'
    check:
      output: "X XX"
  - key: code-references
    format: code-output
    question: |-
      ```java
      System.out.println("Lovelace, Ada".replaceAll("(\\w+), (\\w+)", "$2 $1"));
      ```
    answer: '`Ada Lovelace` : `$1` et `$2` désignent les groupes capturés.'
    check:
      output: "Ada Lovelace"
  - key: bug-compile-boucle
    format: bug-fix
    question: |-
      Le profilage montre que cette validation coûte cher sur un million de lignes :
      ```java
      for (String ligne : lignes) {
          if (ligne.matches("[A-Z]{3}-\\d{4}")) { ... }
      }
      ```
    answer: |-
      ```java
      private static final Pattern REFERENCE = Pattern.compile("[A-Z]{3}-\\d{4}");

      for (String ligne : lignes) {
          if (REFERENCE.matcher(ligne).matches()) { ... }
      }
      ```
      `String.matches` recompile l'expression à chaque appel. Un `Pattern` compilé une fois (et thread-safe) évite ce
      travail.
  - key: bug-find-validation
    format: bug-fix
    question: |-
      Le code postal `"750012"` est accepté comme valide :
      ```java
      boolean valide = Pattern.compile("\\d{5}").matcher(codePostal).find();
      ```
    answer: |-
      ```java
      boolean valide = Pattern.compile("\\d{5}").matcher(codePostal).matches();
      ```
      `find` trouve cinq chiffres à l'intérieur de six ; `matches` exige que tout le texte corresponde.
  - key: bug-replace-all-point
    format: bug-fix
    question: |-
      `"1.234.567"` devient `"---------"` au lieu de `"1234567"` :
      ```java
      String nombre = saisie.replaceAll(".", "");
      ```
    answer: |-
      ```java
      String nombre = saisie.replace(".", "");
      ```
      `replaceAll` interprète `.` comme « n'importe quel caractère ». `replace` remplace le texte littéral (et remplace
      lui aussi toutes les occurrences).
  - key: bug-quote-replacement
    format: bug-fix
    question: |-
      Le remplacement échoue avec `IllegalArgumentException: Illegal group reference` quand le prix contient `$` :
      ```java
      String message = gabarit.replaceAll("\\{prix\\}", prix);   // prix = "12$"
      ```
    answer: |-
      ```java
      String message = gabarit.replace("{prix}", prix);
      // ou, avec une regex : replaceAll("\\{prix\\}", Matcher.quoteReplacement(prix))
      ```
      Dans le remplacement de `replaceAll`, `$` et `\` ont un sens spécial. `replace` ne les interprète pas ; avec une
      regex, `Matcher.quoteReplacement` échappe le texte.
  - key: definition-redos
    format: definition
    question: ReDoS
    answer: Déni de service par expression régulière
  - key: definition-groupe
    format: definition
    question: Groupe capturant
    answer: Une partie d'expression régulière entre parenthèses, dont le texte correspondant est récupérable (`group(1)`, `group("nom")`, `$1`).
  - key: definition-paresseux
    format: definition
    question: Quantificateur paresseux
    answer: Un quantificateur suivi de `?` (`*?`, `+?`) qui prend le moins de caractères possible, au lieu du plus possible.
  - key: definition-ancre
    format: definition
    question: Ancre (regex)
    answer: Un élément qui correspond à une position et non à un caractère, comme `^` (début) et `$` (fin).
