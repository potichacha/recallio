notion: expressions-regulieres
cards:
  - key: replace-vs-replaceall
    format: course
    question: replace vs replaceAll ?
    answer: replace remplace un littéral ; replaceAll interprète le premier argument comme une regex.
  - key: pattern-matcher-sont-ils-thread-safe
    format: course
    question: Pattern et Matcher sont-ils thread-safe ?
    answer: Pattern oui, Matcher non.
  - key: redos
    format: course
    question: C'est quoi un ReDoS ?
    answer: Un déni de service causé par une regex au backtracking exponentiel sur une entrée malveillante.
  - key: definition-redos
    format: definition
    question: ReDoS
    answer: Déni de service par expression régulière
