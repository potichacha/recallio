notion: optional-bases
lesson: |-
  `Optional<T>` est une boîte qui contient **une valeur ou rien**. Une méthode qui renvoie un `Optional` dit dans sa
  signature que le résultat peut manquer, et oblige l'appelant à traiter ce cas.

  ```java
  Optional<Client> client = depot.trouver(id);           // peut être vide

  Optional.of(valeur);          // valeur non nulle (sinon NullPointerException)
  Optional.ofNullable(peutEtreNull);
  Optional.empty();

  client.map(Client::email)                               // transforme si présent
        .filter(e -> e.endsWith(".fr"))                   // garde si la condition est vraie
        .orElse("aucun");                                 // valeur par défaut

  client.orElseThrow(() -> new ClientInconnu(id));        // ou une exception explicite
  client.ifPresentOrElse(this::notifier, this::journaliserAbsence);
  ```

  - **Obtenir la valeur** : `orElse(defaut)` (le défaut est **toujours évalué**), `orElseGet(() -> calcul)` (évalué
    seulement si vide), `orElseThrow()` (Java 10, lève `NoSuchElementException`), `orElseThrow(fabrique)`.
  - **Transformer** : `map`, `flatMap` (quand la fonction renvoie elle-même un `Optional`), `filter`, `or` (Java 9).
  - **Tester** : `isPresent()`, `isEmpty()` (Java 11) ; `ifPresent`, `ifPresentOrElse` (Java 9).
  - **Passer aux streams** : `stream()` (Java 9) ; `liste.stream().flatMap(Optional::stream)` garde les valeurs présentes.
  - Pour les primitifs : `OptionalInt`, `OptionalLong`, `OptionalDouble`.

  **Piège classique** : `if (opt.isPresent()) { x = opt.get(); }`. C'est un test de `null` déguisé ; on préfère `map`,
  `orElse` ou `orElseThrow`.

  **En entretien** : « `Optional` rend l'absence explicite dans le type de retour ; on le transforme avec `map` et on en
  sort avec `orElse`, `orElseGet` ou `orElseThrow`, pas avec `get`. »
cards:
  - key: orelse-vs-orelseget
    format: course
    question: "Quelle différence entre `orElse` et `orElseGet` ?"
    choices:
      - {text: "`orElse` évalue toujours son défaut ; `orElseGet` seulement si l'`Optional` est vide", correct: true}
      - {text: "`orElseGet` évalue toujours son défaut ; `orElse` seulement si l'`Optional` est vide", correct: false}
      - {text: "`orElse` lève une exception si l'`Optional` est vide ; `orElseGet` renvoie le défaut", correct: false}
      - {text: "Aucune : `orElseGet` est l'ancien nom d'`orElse`, gardé pour la compatibilité", correct: false}
    answer: "`orElse(valeur)` reçoit une valeur déjà calculée ; `orElseGet(fournisseur)` n'appelle le fournisseur que si l'`Optional` est vide. Pour un défaut coûteux, `orElseGet`."
  - key: aplatir-liste-optional
    format: course
    question: "Comment aplatir une liste d'`Optional`, en ne gardant que les valeurs présentes ?"
    choices:
      - {text: "`liste.stream().flatMap(Optional::stream)`", correct: true}
      - {text: "`liste.stream().map(Optional::get)`", correct: false}
      - {text: "`liste.stream().map(Optional::orElseThrow)`", correct: false}
      - {text: "`liste.stream().filter(Optional::isEmpty)`", correct: false}
    answer: "`Optional::stream` donne un flux d'un élément, ou vide, que `flatMap` aplatit. `get` et `orElseThrow` lèveraient une exception sur un `Optional` vide."
  - key: get-vs-orelsethrow-optional
    format: course
    question: "Quelle différence entre `get()` et `orElseThrow()` sur un `Optional` ?"
    choices:
      - {text: "Le même comportement, mais `orElseThrow()` dit clairement le risque d'exception", correct: true}
      - {text: "`get()` renvoie `null` si l'`Optional` est vide ; `orElseThrow()` lève une exception", correct: false}
      - {text: "`orElseThrow()` exige une fabrique d'exception en argument ; `get()` n'en prend pas", correct: false}
      - {text: "`get()` lève une exception vérifiée ; `orElseThrow()`, une exception non vérifiée", correct: false}
    answer: "Même comportement (une `NoSuchElementException` si l'`Optional` est vide), mais `orElseThrow()` (Java 10) exprime le risque ; `get()` est déconseillé."
  - key: map-vs-flatmap
    format: course
    question: Quand utiliser `flatMap` plutôt que `map` sur un `Optional` ?
    choices:
      - {text: "Quand la fonction renvoie elle-même un `Optional`, pour éviter un `Optional<Optional<T>>`", correct: true}
      - {text: "Quand l'`Optional` peut être vide : `map` lèverait alors une exception", correct: false}
      - {text: "Quand la fonction renvoie une liste, pour obtenir un flux de ses éléments", correct: false}
      - {text: "Quand la fonction peut renvoyer `null`, que seul `flatMap` change en vide", correct: false}
    answer: "Quand la fonction renvoie elle-même un `Optional` : `map` donnerait un `Optional<Optional<T>>`, `flatMap` l'aplatit. `map` gère déjà un `Optional` vide, et un résultat `null` (qu'il change en vide)."
  - key: vf-of-null
    format: true-false
    question: "`Optional.of(null)` renvoie un `Optional` vide."
    truth: false
    answer: Il lève une `NullPointerException` ; `Optional.ofNullable(null)` renvoie un `Optional` vide.
  - key: vf-orelse-evalue
    format: true-false
    question: "Dans `opt.orElse(calcul())`, `calcul()` n'est appelé que si `opt` est vide."
    truth: false
    answer: L'argument est évalué avant l'appel, donc toujours ; `orElseGet` le diffère.
  - key: vf-or-else-throw
    format: true-false
    question: "`Optional.empty().orElseThrow()` lève une `NoSuchElementException`."
    truth: true
    answer: Comme `get()`, mais le nom dit clairement le risque.
  - key: vf-map-vide
    format: true-false
    question: Sur un `Optional` vide, `map` n'appelle pas la fonction.
    truth: true
    answer: Il renvoie directement un `Optional` vide.
  - key: qcm-creer
    format: multiple-choice
    question: Comment créer un `Optional` à partir d'une valeur qui peut être `null` ?
    choices:
      - text: "`Optional.ofNullable(valeur)`"
        correct: true
      - text: "`Optional.of(valeur)`"
        correct: false
      - text: "`new Optional<>(valeur)`"
        correct: false
      - text: "`Optional.empty(valeur)`"
        correct: false
    answer: '`of` exige une valeur non nulle, et `Optional` n''a pas de constructeur public.'
  - key: qcm-obtenir
    format: multiple-choice
    question: "Laquelle de ces façons d'obtenir la valeur d'un `Optional` est recommandée quand son absence est une erreur ?"
    choices:
      - {text: "`opt.orElseThrow(() -> new ClientInconnu(id))`", correct: true}
      - {text: "`opt.get()` sans test", correct: false}
      - {text: "`if (opt.isPresent()) opt.get()`", correct: false}
      - {text: "`opt.orElse(null)`", correct: false}
    answer: "`orElseThrow` dit ce qui manque, avec une exception métier. `get` ne dit pas que la valeur peut manquer, le couple `isPresent`/`get` n'apporte rien sur un test de `null`, et `orElse(null)` fait revenir le `null`."
  - key: qcm-chainage
    format: multiple-choice
    question: "Que renvoie `Optional.of(\"Ada\").map(String::length).filter(n -> n > 5)` ?"
    choices:
      - text: "`Optional.empty()`"
        correct: true
      - text: "`Optional[3]`"
        correct: false
      - text: "`3`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: La longueur 3 ne passe pas le filtre.
  - key: qcm-primitif
    format: multiple-choice
    question: Quel type renvoie `IntStream.of(3, 1, 2).max()` ?
    choices:
      - text: "`OptionalInt`"
        correct: true
      - text: "`Optional<Integer>`"
        correct: false
      - text: "`int`"
        correct: false
      - text: "`Integer`"
        correct: false
    answer: Le flux peut être vide ; `OptionalInt` évite le boxing.
  - key: trous-of-nullable
    format: fill-in
    question: |-
      Complète pour envelopper une valeur qui peut être `null` :
      ```java
      Optional<String> surnom = Optional.___(client.surnom());
      ```
    blanks: [[ofNullable]]
    answer: '`of` lèverait une exception sur `null`.'
  - key: trous-map
    format: fill-in
    question: |-
      Complète pour obtenir la ville, si l'adresse est connue :
      ```java
      Optional<String> ville = adresse.___(Adresse::ville);
      ```
    blanks: [[map]]
    answer: '`map` transforme la valeur si elle est présente.'
  - key: trous-or-else
    format: fill-in
    question: |-
      Complète pour avoir « Anonyme » si aucun nom n'est trouvé :
      ```java
      String nom = depot.nom(id).___("Anonyme");
      ```
    blanks: [[orElse]]
    answer: "Une constante ne coûte rien à évaluer : `orElse` convient."
  - key: trous-or-else-throw
    format: fill-in
    question: |-
      Complète pour lever une exception métier si la commande n'existe pas :
      ```java
      Commande c = depot.trouver(id).___(() -> new CommandeInconnue(id));
      ```
    blanks: [[orElseThrow]]
    answer: '`orElseThrow` avec une fabrique d''exception.'
  - key: code-optional-ofnullable-null-map-string
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String nom = null;
      System.out.println(Optional.ofNullable(nom).map(String::length).orElse(-1));
      ```
    choices:
      - {text: "`-1`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: '`-1` : l''Optional est vide, `map` n''est pas appelé. Et `Optional.of(nom)` lèverait une NullPointerException.'
    check:
      code: |-
        String nom = null; System.out.println(Optional.ofNullable(nom).map(String::length).orElse(-1));
      output: "-1"
  - key: code-filter
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Optional.of("Ada").filter(n -> n.startsWith("B")).isPresent() + " " + Optional.empty().isEmpty());
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`false true` : `filter` vide l'`Optional` quand la condition échoue, et `Optional.empty()` est vide."
    check:
      output: "false true"
  - key: code-or-else-evalue
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static String defaut() { System.out.print("calcul "); return "x"; }
      System.out.println(Optional.of("a").orElse(defaut()) + " " + Optional.of("b").orElseGet(() -> defaut()));
      ```
    choices:
      - {text: "`calcul a b`", correct: true}
      - {text: "`a b`", correct: false}
      - {text: "`calcul a calcul b`", correct: false}
      - {text: "`a calcul b`", correct: false}
    answer: '`calcul a b` : `orElse` a évalué `defaut()` alors que la valeur était présente ; `orElseGet` ne l''a pas appelé.'
    check:
      output: "calcul a b"
  - key: code-of-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String nom = null;
      System.out.println(Optional.of(nom));
      ```
    choices:
      - {text: "Une `NullPointerException`", correct: true}
      - {text: "`Optional.empty`", correct: false}
      - {text: "`Optional[null]`", correct: false}
      - {text: "`null`", correct: false}
    answer: "Une `NullPointerException` : `of` refuse `null` ; `ofNullable` aurait donné `Optional.empty`."
    check:
      throws: NullPointerException
  - key: bug-is-present-get
    format: bug-fix
    question: |-
      Comment simplifier ce code ?
      ```java
      Optional<Client> client = depot.trouver(id);
      if (client.isPresent()) {
          return client.get().email();
      } else {
          return "inconnu";
      }
      ```
    choices:
      - {text: "`return depot.trouver(id).map(Client::email).orElse(\"inconnu\");`", correct: true}
      - {text: "`return depot.trouver(id).map(Client::email).get();`", correct: false}
      - {text: "`return depot.trouver(id).orElse(null).email();`", correct: false}
      - {text: "`return depot.trouver(id).get().email();`", correct: false}
    answer: |-
      ```java
      return depot.trouver(id)
              .map(Client::email)
              .orElse("inconnu");
      ```
      Le couple `isPresent`/`get` n'est qu'un test de `null` déguisé ; `map` et `orElse` expriment l'intention.
  - key: bug-or-else-couteux
    format: bug-fix
    question: |-
      Le profilage montre un appel réseau à chaque lecture, même quand la valeur est en cache :
      ```java
      Profil profil = cache.lire(id).orElse(serviceDistant.charger(id));
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`cache.lire(id).orElseGet(() -> serviceDistant.charger(id))`", correct: true}
      - {text: "Calculer `serviceDistant.charger(id)` dans une variable, passée à `orElse`", correct: false}
      - {text: "`cache.lire(id).filter(Objects::nonNull).orElse(serviceDistant.charger(id))`", correct: false}
      - {text: "Donner à `serviceDistant.charger` un délai d'expiration plus court", correct: false}
    answer: |-
      ```java
      Profil profil = cache.lire(id).orElseGet(() -> serviceDistant.charger(id));
      ```
      L'argument d'`orElse` est toujours évalué. `orElseGet` n'appelle le service que si le cache est vide.
  - key: bug-of-nullable
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` pour un client sans téléphone :
      ```java
      Optional<String> telephone() {
          return Optional.of(telephone);   // le champ peut valoir null
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`return Optional.ofNullable(telephone);`", correct: true}
      - {text: "`return Optional.of(telephone).or(Optional::empty);`", correct: false}
      - {text: "`return telephone == null ? null : Optional.of(telephone);`", correct: false}
      - {text: "`return Optional.of(Objects.toString(telephone));`", correct: false}
    answer: |-
      ```java
      Optional<String> telephone() {
          return Optional.ofNullable(telephone);
      }
      ```
      `Optional.of` exige une valeur non nulle ; `ofNullable` renvoie un `Optional` vide pour `null`.
  - key: bug-get-sans-test
    format: bug-fix
    question: |-
      Une `NoSuchElementException: No value present` remonte sans contexte :
      ```java
      Commande c = depot.trouver(id).get();
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`depot.trouver(id).orElseThrow(() -> new CommandeInconnue(id))`", correct: true}
      - {text: "`depot.trouver(id).orElse(null)`", correct: false}
      - {text: "`depot.trouver(id).stream().findFirst().get()`", correct: false}
      - {text: "`depot.trouver(id).isPresent() ? depot.trouver(id).get() : null`", correct: false}
    answer: |-
      ```java
      Commande c = depot.trouver(id)
              .orElseThrow(() -> new CommandeInconnue(id));
      ```
      Une exception métier dit ce qui manque (et peut se traduire en 404) ; `get` ne dit rien.
