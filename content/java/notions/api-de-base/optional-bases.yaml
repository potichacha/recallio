notion: optional-bases
lesson: |-
  `Optional<T>` est une boîte qui contient **une valeur ou rien**. Une méthode qui renvoie un `Optional` dit dans sa
  signature que le résultat peut manquer, et oblige l'appelant à traiter ce cas.

  ```java
  Optional<Client> client = depot.trouver(id);           // peut être vide

  Optional.of(valeur);          // valeur non nulle (sinon NullPointerException)
  Optional.ofNullable(peutEtreNull);
  Optional.empty();

  client.map(Client::email)                               // transforme si présent
        .filter(e -> e.endsWith(".fr"))                   // garde si la condition est vraie
        .orElse("aucun");                                 // valeur par défaut

  client.orElseThrow(() -> new ClientInconnu(id));        // ou une exception explicite
  client.ifPresentOrElse(this::notifier, this::journaliserAbsence);
  ```

  - **Obtenir la valeur** : `orElse(defaut)` (le défaut est **toujours évalué**), `orElseGet(() -> calcul)` (évalué
    seulement si vide), `orElseThrow()` (Java 10, lève `NoSuchElementException`), `orElseThrow(fabrique)`.
  - **Transformer** : `map`, `flatMap` (quand la fonction renvoie elle-même un `Optional`), `filter`, `or` (Java 9).
  - **Tester** : `isPresent()`, `isEmpty()` (Java 11) ; `ifPresent`, `ifPresentOrElse` (Java 9).
  - **Passer aux streams** : `stream()` (Java 9) ; `liste.stream().flatMap(Optional::stream)` garde les valeurs présentes.
  - Pour les primitifs : `OptionalInt`, `OptionalLong`, `OptionalDouble`.

  **Piège classique** : `if (opt.isPresent()) { x = opt.get(); }`. C'est un test de `null` déguisé ; on préfère `map`,
  `orElse` ou `orElseThrow`.

  **En entretien** : « `Optional` rend l'absence explicite dans le type de retour ; on le transforme avec `map` et on en
  sort avec `orElse`, `orElseGet` ou `orElseThrow`, pas avec `get`. »
cards:
  - key: orelse-vs-orelseget
    format: course
    question: orElse vs orElseGet ?
    answer: orElse évalue toujours le défaut ; orElseGet ne l'évalue que si nécessaire (lazy).
  - key: aplatir-liste-optional
    format: course
    question: Comment aplatir une liste d'Optional ?
    answer: '`liste.stream().flatMap(Optional::stream)`.'
  - key: get-vs-orelsethrow-optional
    format: course
    question: get() vs orElseThrow() sur Optional ?
    answer: Même comportement, mais orElseThrow() exprime explicitement le risque d'exception ; get() est déconseillé.
  - key: map-vs-flatmap
    format: course
    question: Quand utiliser `flatMap` plutôt que `map` sur un `Optional` ?
    answer: "Quand la fonction renvoie elle-même un `Optional` : `map` donnerait un `Optional<Optional<T>>`, `flatMap` l'aplatit."
  - key: vf-of-null
    format: true-false
    question: "`Optional.of(null)` renvoie un `Optional` vide."
    truth: false
    answer: Il lève une `NullPointerException` ; `Optional.ofNullable(null)` renvoie un `Optional` vide.
  - key: vf-orelse-evalue
    format: true-false
    question: "Dans `opt.orElse(calcul())`, `calcul()` n'est appelé que si `opt` est vide."
    truth: false
    answer: L'argument est évalué avant l'appel, donc toujours ; `orElseGet` le diffère.
  - key: vf-or-else-throw
    format: true-false
    question: "`Optional.empty().orElseThrow()` lève une `NoSuchElementException`."
    truth: true
    answer: Comme `get()`, mais le nom dit clairement le risque.
  - key: vf-map-vide
    format: true-false
    question: Sur un `Optional` vide, `map` n'appelle pas la fonction.
    truth: true
    answer: Il renvoie directement un `Optional` vide.
  - key: qcm-creer
    format: multiple-choice
    question: Comment créer un `Optional` à partir d'une valeur qui peut être `null` ?
    choices:
      - text: "`Optional.ofNullable(valeur)`"
        correct: true
      - text: "`Optional.of(valeur)`"
        correct: false
      - text: "`new Optional<>(valeur)`"
        correct: false
      - text: "`Optional.empty(valeur)`"
        correct: false
    answer: '`of` exige une valeur non nulle, et `Optional` n''a pas de constructeur public.'
  - key: qcm-obtenir
    format: multiple-choice
    question: Quelles façons d'obtenir la valeur d'un `Optional` sont recommandées ?
    choices:
      - text: "`opt.orElseThrow(() -> new ClientInconnu(id))`"
        correct: true
      - text: "`opt.orElseGet(this::valeurParDefaut)`"
        correct: true
      - text: "`opt.get()` sans test"
        correct: false
      - text: "`if (opt.isPresent()) opt.get()`"
        correct: false
    answer: '`get` ne dit pas que la valeur peut manquer, et le couple `isPresent`/`get` n''apporte rien sur un test de `null`.'
  - key: qcm-chainage
    format: multiple-choice
    question: "Que renvoie `Optional.of(\"Ada\").map(String::length).filter(n -> n > 5)` ?"
    choices:
      - text: "`Optional.empty()`"
        correct: true
      - text: "`Optional[3]`"
        correct: false
      - text: "`3`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: La longueur 3 ne passe pas le filtre.
  - key: qcm-primitif
    format: multiple-choice
    question: Quel type renvoie `IntStream.of(3, 1, 2).max()` ?
    choices:
      - text: "`OptionalInt`"
        correct: true
      - text: "`Optional<Integer>`"
        correct: false
      - text: "`int`"
        correct: false
      - text: "`Integer`"
        correct: false
    answer: Le flux peut être vide ; `OptionalInt` évite le boxing.
  - key: trous-of-nullable
    format: fill-in
    question: |-
      Complétez pour envelopper une valeur qui peut être `null` :
      ```java
      Optional<String> surnom = Optional.___(client.surnom());
      ```
    blanks: [[ofNullable]]
    answer: '`of` lèverait une exception sur `null`.'
  - key: trous-map
    format: fill-in
    question: |-
      Complétez pour obtenir la ville, si l'adresse est connue :
      ```java
      Optional<String> ville = adresse.___(Adresse::ville);
      ```
    blanks: [[map]]
    answer: '`map` transforme la valeur si elle est présente.'
  - key: trous-or-else
    format: fill-in
    question: |-
      Complétez pour avoir « Anonyme » si aucun nom n'est trouvé :
      ```java
      String nom = depot.nom(id).___("Anonyme");
      ```
    blanks: [[orElse]]
    answer: "Une constante ne coûte rien à évaluer : `orElse` convient."
  - key: trous-or-else-throw
    format: fill-in
    question: |-
      Complétez pour lever une exception métier si la commande n'existe pas :
      ```java
      Commande c = depot.trouver(id).___(() -> new CommandeInconnue(id));
      ```
    blanks: [[orElseThrow]]
    answer: '`orElseThrow` avec une fabrique d''exception.'
  - key: code-optional-ofnullable-null-map-string
    format: code-output
    question: '`String nom = null; System.out.println(Optional.ofNullable(nom).map(String::length).orElse(-1));`'
    answer: '`-1` : l''Optional est vide, `map` n''est pas appelé. Et `Optional.of(nom)` lèverait une NullPointerException.'
    check:
      code: |-
        String nom = null; System.out.println(Optional.ofNullable(nom).map(String::length).orElse(-1));
      output: "-1"
  - key: code-filter
    format: code-output
    question: |-
      ```java
      System.out.println(Optional.of("Ada").filter(n -> n.startsWith("B")).isPresent() + " " + Optional.empty().isEmpty());
      ```
    answer: '`false true`.'
    check:
      output: "false true"
  - key: code-or-else-evalue
    format: code-output
    question: |-
      ```java
      static String defaut() { System.out.print("calcul "); return "x"; }
      System.out.println(Optional.of("a").orElse(defaut()) + " " + Optional.of("b").orElseGet(() -> defaut()));
      ```
    answer: '`calcul a b` : `orElse` a évalué `defaut()` alors que la valeur était présente ; `orElseGet` ne l''a pas appelé.'
    check:
      output: "calcul a b"
  - key: code-of-null
    format: code-output
    question: |-
      ```java
      String nom = null;
      System.out.println(Optional.of(nom));
      ```
    answer: "Une `NullPointerException` : `of` refuse `null`."
    check:
      throws: NullPointerException
  - key: bug-is-present-get
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      Optional<Client> client = depot.trouver(id);
      if (client.isPresent()) {
          return client.get().email();
      } else {
          return "inconnu";
      }
      ```
    answer: |-
      ```java
      return depot.trouver(id)
              .map(Client::email)
              .orElse("inconnu");
      ```
      Le couple `isPresent`/`get` n'est qu'un test de `null` déguisé ; `map` et `orElse` expriment l'intention.
  - key: bug-or-else-couteux
    format: bug-fix
    question: |-
      Le profilage montre un appel réseau à chaque lecture, même quand la valeur est en cache :
      ```java
      Profil profil = cache.lire(id).orElse(serviceDistant.charger(id));
      ```
    answer: |-
      ```java
      Profil profil = cache.lire(id).orElseGet(() -> serviceDistant.charger(id));
      ```
      L'argument d'`orElse` est toujours évalué. `orElseGet` n'appelle le service que si le cache est vide.
  - key: bug-of-nullable
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` pour un client sans téléphone :
      ```java
      Optional<String> telephone() {
          return Optional.of(telephone);   // le champ peut valoir null
      }
      ```
    answer: |-
      ```java
      Optional<String> telephone() {
          return Optional.ofNullable(telephone);
      }
      ```
      `Optional.of` exige une valeur non nulle ; `ofNullable` renvoie un `Optional` vide pour `null`.
  - key: bug-get-sans-test
    format: bug-fix
    question: |-
      Une `NoSuchElementException: No value present` remonte sans contexte :
      ```java
      Commande c = depot.trouver(id).get();
      ```
    answer: |-
      ```java
      Commande c = depot.trouver(id)
              .orElseThrow(() -> new CommandeInconnue(id));
      ```
      Une exception métier dit ce qui manque (et peut se traduire en 404) ; `get` ne dit rien.
