notion: optional-bases
cards:
  - key: orelse-vs-orelseget
    format: course
    question: orElse vs orElseGet ?
    answer: orElse évalue toujours le défaut ; orElseGet ne l'évalue que si nécessaire (lazy).
  - key: aplatir-liste-optional
    format: course
    question: Comment aplatir une liste d'Optional ?
    answer: '`liste.stream().flatMap(Optional::stream)`.'
  - key: get-vs-orelsethrow-optional
    format: course
    question: get() vs orElseThrow() sur Optional ?
    answer: Même comportement, mais orElseThrow() exprime explicitement le risque d'exception ; get() est déconseillé.
  - key: code-optional-ofnullable-null-map-string
    format: code-output
    question: '`Optional.ofNullable(null).map(String::length).orElse(-1)`'
    answer: '`-1`. Et `Optional.of(null)` lève une NullPointerException.'
