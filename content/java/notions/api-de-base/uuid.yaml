notion: uuid
lesson: |-
  Un **UUID** est un identifiant de **128 bits**, écrit en 36 caractères hexadécimaux
  (`123e4567-e89b-12d3-a456-426614174000`). On peut en générer partout, sans coordination, avec une probabilité de
  collision négligeable.

  | Version | Construction | En Java |
  |---|---|---|
  | v4 | 122 bits **aléatoires** | `UUID.randomUUID()` (avec `SecureRandom`) |
  | v3 | hachage MD5 d'un nom (déterministe) | `UUID.nameUUIDFromBytes(octets)` |
  | v7 | horodatage en millisecondes + aléatoire : **ordonné dans le temps** | pas de fabrique dans le JDK 25 : une bibliothèque |

  ```java
  UUID id = UUID.randomUUID();
  id.version();                            // 4
  UUID.fromString("123e4567-e89b-12d3-a456-426614174000");   // IllegalArgumentException si mal formé
  ```

  - Comme **clé primaire**, un v4 aléatoire disperse les insertions dans l'index B-tree (fragmentation, pages
    froides) ; un **v7**, croissant dans le temps, s'insère en fin d'index comme une séquence. C'est le choix de Recallio
    (ADR 0008).
  - En base, un type natif (`uuid` en PostgreSQL, 16 octets) plutôt qu'un `VARCHAR(36)`.
  - On compare des `UUID` avec `equals`, pas leurs textes (la casse peut différer).
  - Un UUID n'est pas un secret : pour un jeton d'authentification, on veut des octets de `SecureRandom` dédiés.

  **Piège classique** : générer des identifiants avec `System.currentTimeMillis()` ou un compteur en mémoire. Deux
  créations dans la même milliseconde, ou deux instances du service, produisent le même identifiant.

  **En entretien** : « Un UUID se génère sans coordination ; v4 est aléatoire, v7 ordonné dans le temps, ce qui en fait
  une bonne clé primaire. »
tour:
  - title: UUID
    text: |-
      Un **UUID** est un identifiant de 128 bits, écrit en 36 caractères, qu'on peut générer sans coordination : deux
      machines n'en produiront pas deux identiques. `UUID.randomUUID()` en tire un au hasard (la version 4).

      `UUID.nameUUIDFromBytes` en dérive un d'un texte, toujours le même pour le même texte, et `UUID.fromString` relit
      un UUID écrit. Ce programme n'affiche pas de `randomUUID` : sa sortie changerait à chaque exécution.
    example:
      files:
        Main.java: |-
          void main() {
              UUID depuisUnNom = UUID.nameUUIDFromBytes("ada@example.com".getBytes(StandardCharsets.UTF_8));
              IO.println(depuisUnNom + " version " + depuisUnNom.version());
              UUID relu = UUID.fromString(depuisUnNom.toString());
              IO.println(relu.equals(depuisUnNom) + " " + relu.toString().length());
              IO.println(UUID.randomUUID().version());
          }
      output: |-
        3e3417d7-ef77-3593-aa67-34b916515ed5 version 3
        true 36
        4
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'un UUID ?
    choices:
      - {text: "Un identifiant de 128 bits, unique en pratique, généré sans coordination", correct: true}
      - {text: "Un identifiant de 64 bits, attribué par une autorité centrale", correct: false}
      - {text: "Un compteur croissant, attribué par la base de données", correct: false}
      - {text: "Une empreinte MD5 du contenu d'un objet, pour le comparer", correct: false}
    answer: Un identifiant de 128 bits, unique en pratique, qu'on peut générer n'importe où sans coordination (36 caractères en texte).
  - key: v4-vs-v7
    format: course
    question: Pourquoi préférer un UUID v7 à un v4 comme clé primaire ?
    choices:
      - {text: "Le v7 commence par un horodatage : les clés croissantes s'insèrent en fin d'index", correct: true}
      - {text: "Le v7 tient sur 64 bits : son index est deux fois plus petit que celui du v4", correct: false}
      - {text: "Le v7 est garanti unique, alors que le v4 produit souvent des doublons", correct: false}
      - {text: "Le v7 se génère sans `SecureRandom`, ce qui le rend plus difficile à deviner", correct: false}
    answer: "Le v7 commence par un horodatage : les nouvelles clés sont croissantes et s'insèrent en fin d'index B-tree, au lieu de se disperser comme les v4 aléatoires."
  - key: random-uuid
    format: course
    question: Quelle version produit `UUID.randomUUID()` ?
    choices:
      - {text: "Un UUID v4, construit à partir de 122 bits aléatoires", correct: true}
      - {text: "Un UUID v7, ordonné dans le temps par un horodatage", correct: false}
      - {text: "Un UUID v1, fondé sur l'adresse MAC et l'heure", correct: false}
      - {text: "Un UUID v3, calculé par un hachage MD5", correct: false}
    answer: Un UUID v4, construit à partir de 122 bits aléatoires (via `SecureRandom`).
  - key: stockage
    format: course
    question: Comment stocker un UUID en PostgreSQL ?
    choices:
      - {text: "Dans une colonne `uuid` (16 octets), plus compacte qu'un `VARCHAR(36)`", correct: true}
      - {text: "Dans un `VARCHAR(36)`, pour le lire facilement dans la base", correct: false}
      - {text: "Dans deux colonnes `BIGINT`, une pour chaque moitié", correct: false}
      - {text: "Dans un `TEXT`, pour accepter tous les formats de saisie", correct: false}
    answer: Dans une colonne de type `uuid` (16 octets), plus compacte et plus rapide à comparer qu'un `VARCHAR(36)`.
  - key: vf-coordination
    format: true-false
    question: Générer des UUID demande une base de données centrale.
    truth: false
    answer: "C'est leur intérêt : chaque service les génère seul."
  - key: vf-v7-jdk
    format: true-false
    question: Le JDK 25 fournit une fabrique d'UUID v7.
    truth: false
    answer: Il fournit les v4 (`randomUUID`) et v3 (`nameUUIDFromBytes`) ; pour v7, on utilise une bibliothèque ou une implémentation maison.
  - key: vf-ordonne
    format: true-false
    question: Les UUID v7 sont ordonnés selon leur date de création.
    truth: true
    answer: Leurs 48 premiers bits sont un horodatage en millisecondes.
  - key: vf-secret
    format: true-false
    question: Un UUID v4 convient comme jeton secret d'authentification.
    truth: false
    answer: "Ce n'est pas son rôle : un jeton se génère avec des octets dédiés de `SecureRandom`, en quantité suffisante."
  - key: qcm-version
    format: multiple-choice
    question: "Quelle version d'UUID est déterministe à partir d'un nom ?"
    choices:
      - text: "v3 (`UUID.nameUUIDFromBytes`)"
        correct: true
      - text: "v4 (`UUID.randomUUID`)"
        correct: false
      - text: "v7"
        correct: false
      - text: "Aucune"
        correct: false
    answer: Le même nom donne toujours le même UUID (v3 MD5, v5 SHA-1).
  - key: qcm-cle
    format: multiple-choice
    question: "Lequel de ces identifiants convient à des entités créées par plusieurs instances d'un service, sans passer par la base ?"
    choices:
      - {text: "Des UUID v7", correct: true}
      - {text: "`System.currentTimeMillis()`", correct: false}
      - {text: "Un compteur `static` en mémoire", correct: false}
      - {text: "Le `hashCode()` de l'entité", correct: false}
    answer: "Un UUID se génère partout sans coordination (une séquence de la base convient aussi, au prix d'un aller-retour). L'heure et un compteur en mémoire produisent des doublons entre instances, et un `hashCode` n'est pas unique."
  - key: qcm-comparer
    format: multiple-choice
    question: Comment comparer deux UUID ?
    choices:
      - text: "`a.equals(b)`"
        correct: true
      - text: "`a.toString().equals(b.toString())`, toujours fiable"
        correct: false
      - text: "`a == b`"
        correct: false
      - text: "`a.version() == b.version()`"
        correct: false
    answer: Un texte peut être en majuscules ou en minuscules ; `equals` compare les 128 bits.
  - key: qcm-format
    format: multiple-choice
    question: Combien de caractères compte un UUID sous forme de texte ?
    choices:
      - text: "36"
        correct: true
      - text: "32"
        correct: false
      - text: "16"
        correct: false
      - text: "128"
        correct: false
    answer: 32 chiffres hexadécimaux et 4 tirets.
  - key: code-random
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      UUID u = UUID.randomUUID();
      System.out.println(u.version() + " " + u.toString().length());
      ```
    choices:
      - {text: "`4 36`", correct: true}
      - {text: "`7 36`", correct: false}
      - {text: "`4 32`", correct: false}
      - {text: "`4 38`", correct: false}
    answer: "`4 36` : `randomUUID` produit un v4, écrit en 32 chiffres hexadécimaux et 4 tirets."
    check:
      output: "4 36"
  - key: code-nom
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      UUID a = UUID.nameUUIDFromBytes("ada".getBytes());
      UUID b = UUID.nameUUIDFromBytes("ada".getBytes());
      System.out.println(a.equals(b) + " " + a.version());
      ```
    choices:
      - {text: "`true 3`", correct: true}
      - {text: "`false 3`", correct: false}
      - {text: "`true 4`", correct: false}
      - {text: "`false 4`", correct: false}
    answer: '`true 3` : le même nom donne le même UUID v3.'
    check:
      output: "true 3"
  - key: code-from-string
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(UUID.fromString("pas-un-uuid"));
      ```
    choices:
      - {text: "Une `IllegalArgumentException`", correct: true}
      - {text: "`pas-un-uuid`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "Un UUID tiré au hasard", correct: false}
    answer: "Une `IllegalArgumentException` : le texte n'a pas le format d'un UUID."
    check:
      throws: IllegalArgumentException
  - key: code-casse
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      UUID u = UUID.fromString("123e4567-e89b-12d3-a456-426614174000");
      System.out.println(u.version() + " " + u.equals(UUID.fromString("123E4567-E89B-12D3-A456-426614174000")));
      ```
    choices:
      - {text: "`1 true`", correct: true}
      - {text: "`1 false`", correct: false}
      - {text: "`4 true`", correct: false}
      - {text: "`3 true`", correct: false}
    answer: '`1 true` : la version est le premier chiffre du troisième groupe, et la casse du texte n''importe pas.'
    check:
      output: "1 true"
  - key: bug-millis
    format: bug-fix
    question: |-
      Deux commandes créées en même temps ont reçu le même identifiant :
      ```java
      String id = "CMD-" + System.currentTimeMillis();
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`UUID id = UUID.randomUUID();` (ou un v7 si l'ordre compte)", correct: true}
      - {text: "`String id = \"CMD-\" + System.nanoTime();`", correct: false}
      - {text: "`String id = \"CMD-\" + LocalDateTime.now();`", correct: false}
      - {text: "`String id = \"CMD-\" + Instant.now().getEpochSecond();`", correct: false}
    answer: |-
      ```java
      UUID id = UUID.randomUUID();   // ou un UUID v7 si l'ordre de création compte
      ```
      Deux créations dans la même milliseconde (ou sur deux serveurs) produisent le même horodatage. Un UUID est unique
      sans coordination.
  - key: bug-varchar
    format: bug-fix
    question: |-
      Les index de la table sont deux fois plus gros que prévu :
      ```sql
      CREATE TABLE commande (id VARCHAR(36) PRIMARY KEY, ...);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`id UUID PRIMARY KEY`, le type natif sur 16 octets", correct: true}
      - {text: "`id CHAR(36) PRIMARY KEY`, de longueur fixe", correct: false}
      - {text: "`id TEXT PRIMARY KEY`, sans limite de taille", correct: false}
      - {text: "`id VARCHAR(32) PRIMARY KEY`, sans les tirets", correct: false}
    answer: |-
      ```sql
      CREATE TABLE commande (id UUID PRIMARY KEY, ...);
      ```
      Le type natif occupe 16 octets au lieu d'environ 37, et se compare plus vite. Les pilotes JDBC lisent directement
      un `java.util.UUID`.
  - key: bug-v4-index
    format: bug-fix
    question: |-
      Les insertions dans une très grosse table ralentissent, et l'index de clé primaire se fragmente :
      ```java
      this.id = UUID.randomUUID();
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Générer des UUID v7, qui commencent par un horodatage", correct: true}
      - {text: "Générer des UUID v3, calculés par hachage d'un nom", correct: false}
      - {text: "Ajouter un second index sur la colonne `id`", correct: false}
      - {text: "Stocker les UUID v4 en `VARCHAR(36)` plutôt qu'en `uuid`", correct: false}
    answer: |-
      ```java
      this.id = Uuid7.generer();   // une fabrique d'UUID v7 (bibliothèque ou code maison)
      ```
      Les v4 aléatoires s'insèrent n'importe où dans l'index B-tree. Les v7 commencent par un horodatage : les nouvelles
      clés arrivent en fin d'index.
  - key: bug-comparaison-texte
    format: bug-fix
    question: |-
      Ce contrôle d'accès refuse parfois le propriétaire légitime :
      ```java
      if (document.proprietaire().toString().equals(parametreId)) { ... }   // parametreId en majuscules
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`document.proprietaire().equals(UUID.fromString(parametreId))`", correct: true}
      - {text: "`document.proprietaire().toString() == parametreId`", correct: false}
      - {text: "`document.proprietaire().toString().contains(parametreId)`", correct: false}
      - {text: "`document.proprietaire().toString().compareTo(parametreId) == 0`", correct: false}
    answer: "`toString()` produit des minuscules, et le paramètre peut être en majuscules. On convertit le texte en `UUID` (ce qui valide aussi son format) et on compare les valeurs."
  - key: definition-uuid-v7
    format: definition
    question: "Qu'est-ce qu'un UUID v7 ?"
    choices:
      - {text: "Un UUID qui commence par un horodatage : ordonné dans le temps, adapté aux clés", correct: true}
      - {text: "Un UUID tiré de 122 bits aléatoires, produit par `UUID.randomUUID()`", correct: false}
      - {text: "Un UUID calculé par hachage MD5 d'un espace de noms et d'un nom", correct: false}
      - {text: "Un UUID fondé sur l'adresse MAC de la machine et sur l'heure", correct: false}
    answer: "Un identifiant unique ordonné dans le temps : ses premiers bits sont un horodatage, d'où des clés primaires croissantes. Le tirage aléatoire, c'est le v4 ; le hachage MD5, le v3."
  - key: definition-uuid
    format: definition
    question: "Que désigne le sigle UUID ?"
    choices:
      - {text: "*Universally Unique Identifier* : un identifiant de 128 bits, généré sans coordination", correct: true}
      - {text: "*Unique User Identifier* : l'identifiant d'un compte utilisateur, attribué à l'inscription", correct: false}
      - {text: "*Universal Unicode Identifier* : le code d'un caractère dans la table Unicode", correct: false}
      - {text: "*Uniform Update Index* : le numéro de version d'une ligne dans une base", correct: false}
    answer: Universally Unique Identifier, un identifiant de 128 bits unique en pratique, généré sans coordination.
  - key: definition-uuid-v4
    format: definition
    question: "Qu'est-ce qu'un UUID v4 ?"
    choices:
      - {text: "Un UUID tiré de bits aléatoires, produit en Java par `UUID.randomUUID()`", correct: true}
      - {text: "Un UUID qui commence par un horodatage, ordonné dans le temps", correct: false}
      - {text: "Un UUID calculé par hachage MD5 d'un espace de noms et d'un nom", correct: false}
      - {text: "Un UUID fondé sur l'adresse MAC de la machine et sur l'heure", correct: false}
    answer: Un UUID construit à partir de bits aléatoires, produit en Java par `UUID.randomUUID()`.
  - key: definition-uuid-v3
    format: definition
    question: "Qu'est-ce qu'un UUID v3 ?"
    choices:
      - {text: "Un UUID déterministe, calculé par hachage MD5 d'un espace de noms et d'un nom", correct: true}
      - {text: "Un UUID déterministe, calculé par hachage SHA-1 d'un espace de noms et d'un nom", correct: false}
      - {text: "Un UUID tiré de bits aléatoires, produit par `UUID.randomUUID()`", correct: false}
      - {text: "Un UUID qui commence par un horodatage, ordonné dans le temps", correct: false}
    answer: "Un UUID déterministe, calculé par hachage MD5 d'un espace de noms et d'un nom (`UUID.nameUUIDFromBytes`) : le même nom donne toujours le même UUID. Avec SHA-1, c'est le v5."
