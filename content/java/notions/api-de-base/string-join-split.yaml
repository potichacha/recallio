notion: string-join-split
lesson: |-
  **Découper** : `s.split(regex)` renvoie un tableau. **Assembler** : `String.join(separateur, elements)`,
  `StringJoiner` ou `Collectors.joining`.

  ```java
  "a,b,c".split(",");              // [a, b, c]
  "a.b".split("\\.");              // [a, b] : l'argument est une EXPRESSION RÉGULIÈRE
  "a b  c".split("\\s+");          // [a, b, c] : un ou plusieurs blancs
  "a,b,,".split(",");              // [a, b] : les chaînes vides FINALES sont supprimées
  "a,b,,".split(",", -1);          // [a, b, , ] : une limite négative les garde

  String.join(", ", List.of("x", "y"));            // "x, y"
  new StringJoiner(", ", "[", "]").add("a").add("b").toString();   // "[a, b]"
  ```

  - Les caractères spéciaux des regex (`. | * + ? ( ) [ ] { } \ ^ $`) doivent être échappés : `split("\\|")`, ou
    `split(Pattern.quote("|"))`.
  - La limite : `split(",", 2)` coupe au plus en deux morceaux (le reste reste entier).
  - `StringJoiner` gère préfixe, suffixe, et une valeur pour le cas vide (`setEmptyValue`).
  - Pour un vrai fichier CSV (guillemets, virgules dans les valeurs, RFC 4180), on utilise une bibliothèque.

  **Piège classique** : `split(".")` ou `split("|")`. Le point correspond à n'importe quel caractère, et le résultat
  est vide ; la barre est une alternative vide, qui coupe entre chaque caractère.

  **En entretien** : « `split` prend une regex et supprime les vides finaux sauf avec une limite négative ; `join` et
  `StringJoiner` assemblent sans séparateur en trop. »
tour:
  - title: Découper et assembler
    text: |-
      `split` découpe une chaîne selon un séparateur, qui est une **expression régulière** : un point, qui y signifie
      « n'importe quel caractère », doit être échappé. Piège : `split` supprime les morceaux vides **à la fin**.

      `String.join(", ", liste)` assemble avec un séparateur, et `StringJoiner` ajoute en plus un préfixe et un suffixe.
    example:
      files:
        Main.java: |-
          void main() {
              String csv = "Ada;36;Londres";
              String[] champs = csv.split(";");
              IO.println(champs.length + " " + champs[0] + " " + champs[2]);

              IO.println("a,b,,c,,".split(",").length);
              IO.println(String.join(" | ", List.of("Java", "Go", "Kotlin")));

              StringJoiner joiner = new StringJoiner(", ", "[", "]");
              joiner.add("un").add("deux");
              IO.println(joiner);
          }
      output: |-
        3 Ada Londres
        4
        Java | Go | Kotlin
        [un, deux]
    task:
      instructions: |-
        Découpe la phrase en mots, mets-les dans l'ordre inverse, et réassemble-les avec `String.join` : le programme
        doit afficher `Java aime Ada`.
      starter:
        Main.java: |-
          void main() {
              String phrase = "Ada aime Java";
              IO.println(phrase);
          }
      solution:
        Main.java: |-
          void main() {
              String phrase = "Ada aime Java";
              List<String> mots = new ArrayList<>(List.of(phrase.split(" ")));
              Collections.reverse(mots);
              IO.println(String.join(" ", mots));
          }
      output: |-
        Java aime Ada
cards:
  - key: b-split-renvoie-tableau-vide
    format: course
    question: Pourquoi `"a.b".split(".")` renvoie un tableau vide ?
    answer: Le point est un métacaractère regex qui correspond à tout ; il faut l'échapper.
  - key: renvoie-b-split-length
    format: course
    question: Que renvoie `"a,b,,".split(",").length` ?
    answer: 2, les chaînes vides finales sont supprimées (sauf avec une limite négative).
  - key: limite
    format: course
    question: Que fait `"cle=valeur=autre".split("=", 2)` ?
    answer: 'Il coupe au plus en deux morceaux : `["cle", "valeur=autre"]`. Utile pour une ligne `cle=valeur` dont la valeur peut contenir le séparateur.'
  - key: string-joiner
    format: course
    question: Qu'apporte `StringJoiner` par rapport à `String.join` ?
    answer: Un préfixe et un suffixe (`new StringJoiner(", ", "[", "]")`), une valeur pour le cas vide (`setEmptyValue`), et l'ajout élément par élément.
  - key: vf-regex
    format: true-false
    question: L'argument de `split` est une expression régulière.
    truth: true
    answer: D'où la nécessité d'échapper `.`, `|`, `+`...
  - key: vf-vides-milieu
    format: true-false
    question: "`\"a,,b\".split(\",\")` supprime la chaîne vide du milieu."
    truth: false
    answer: "Seules les chaînes vides finales sont supprimées : on obtient `[a, , b]`."
  - key: vf-join-dernier
    format: true-false
    question: "`String.join(\",\", liste)` place un séparateur après le dernier élément."
    truth: false
    answer: Le séparateur n'est placé qu'entre les éléments.
  - key: vf-quote
    format: true-false
    question: "`s.split(Pattern.quote(\"|\"))` coupe sur la barre verticale littérale."
    truth: true
    answer: '`Pattern.quote` échappe toute la chaîne.'
  - key: qcm-echapper
    format: multiple-choice
    question: Comment découper `"192.168.0.1"` en ses quatre nombres ?
    choices:
      - text: "`ip.split(\"\\\\.\")`"
        correct: true
      - text: "`ip.split(Pattern.quote(\".\"))`"
        correct: true
      - text: "`ip.split(\".\")`"
        correct: false
      - text: "`ip.split('.')`"
        correct: false
    answer: Le point doit être échappé ; `split` n'a pas de version à `char`.
  - key: qcm-vides
    format: multiple-choice
    question: "Que vaut `\"a,b,,\".split(\",\", -1).length` ?"
    choices:
      - text: "4"
        correct: true
      - text: "2"
        correct: false
      - text: "3"
        correct: false
      - text: "1"
        correct: false
    answer: La limite négative garde les deux chaînes vides finales.
  - key: qcm-blancs
    format: multiple-choice
    question: "Comment découper `\"a  b\\tc\"` sur tous les blancs, même répétés ?"
    choices:
      - text: "`s.split(\"\\\\s+\")`"
        correct: true
      - text: "`s.split(\" \")`"
        correct: false
      - text: "`s.split(\"\\\\s\")`"
        correct: false
      - text: "`s.split(\"+\")`"
        correct: false
    answer: '`\s+` correspond à un ou plusieurs blancs ; `" "` laisserait des chaînes vides et la tabulation.'
  - key: qcm-assembler
    format: multiple-choice
    question: Comment obtenir `"[a, b, c]"` à partir de la liste `a, b, c` ?
    choices:
      - text: "`liste.stream().collect(Collectors.joining(\", \", \"[\", \"]\"))`"
        correct: true
      - text: "`new StringJoiner(\", \", \"[\", \"]\")` en ajoutant chaque élément"
        correct: true
      - text: "`String.join(\"[, ]\", liste)`"
        correct: false
      - text: "`liste.split(\", \")`"
        correct: false
    answer: '`liste.toString()` donnerait aussi ce résultat pour des chaînes simples, mais sans contrôle du format.'
  - key: code-b-split-length-b-split
    format: code-output
    question: '`"a,b,,".split(",").length`, `"a,,b".split(",").length`, `"a,b,,".split(",", -1).length`, `"a.b".split(".").length` ?'
    answer: '`2`, `3`, `4`, `0`.'
    check:
      code: |-
        System.out.println("a,b,,".split(",").length + " " + "a,,b".split(",").length + " "
                + "a,b,,".split(",", -1).length + " " + "a.b".split(".").length);
      output: "2 3 4 0"
  - key: code-join
    format: code-output
    question: |-
      ```java
      System.out.println(String.join("-", "a", "b", "c") + " " + String.join("/", List.of("x", "y")));
      ```
    answer: '`a-b-c x/y`.'
    check:
      output: "a-b-c x/y"
  - key: code-joiner
    format: code-output
    question: |-
      ```java
      StringJoiner j = new StringJoiner(", ", "[", "]");
      j.setEmptyValue("(vide)");
      System.out.print(j + " ");
      j.add("a").add("b");
      System.out.println(j);
      ```
    answer: '`(vide) [a, b]`.'
    check:
      output: "(vide) [a, b]"
  - key: code-barre
    format: code-output
    question: |-
      ```java
      System.out.println(Arrays.toString("a|b|c".split("|")));
      ```
    answer: '`[a, |, b, |, c]` : `|` seul est une alternative vide, qui coupe entre chaque caractère.'
    check:
      output: "[a, |, b, |, c]"
  - key: bug-point
    format: bug-fix
    question: |-
      Ce code lève une `ArrayIndexOutOfBoundsException` :
      ```java
      String extension = nomFichier.split(".")[1];
      ```
    answer: |-
      ```java
      String extension = nomFichier.substring(nomFichier.lastIndexOf('.') + 1);
      ```
      `split(".")` coupe sur chaque caractère et renvoie un tableau vide. Pour une extension, `lastIndexOf` est plus
      juste (un nom comme `archive.tar.gz` a plusieurs points) ; sinon, `split("\\.")`.
  - key: bug-barre
    format: bug-fix
    question: |-
      Les champs d'une ligne `"Ada|Lovelace|1815"` sont découpés caractère par caractère :
      ```java
      String[] champs = ligne.split("|");
      ```
    answer: |-
      ```java
      String[] champs = ligne.split("\\|");
      ```
      `|` est l'alternative des expressions régulières ; échappée, c'est la barre littérale.
  - key: bug-colonnes-vides
    format: bug-fix
    question: |-
      Pour `"Ada;Lovelace;;"`, le tableau n'a que deux colonnes au lieu de quatre, et `champs[3]` lève une exception :
      ```java
      String[] champs = ligne.split(";");
      ```
    answer: |-
      ```java
      String[] champs = ligne.split(";", -1);
      ```
      Sans limite, les colonnes vides en fin de ligne sont supprimées ; une limite négative les garde.
  - key: bug-espaces-tags
    format: bug-fix
    question: |-
      Les tags saisis comme `"java, spring ,  docker"` gardent des espaces et ne correspondent à rien :
      ```java
      String[] tags = saisie.split(",");
      ```
    answer: |-
      ```java
      List<String> tags = Arrays.stream(saisie.split(","))
              .map(String::strip)
              .filter(t -> !t.isEmpty())
              .toList();
      ```
      On retire les blancs autour de chaque tag et on ignore les vides (ou `split("\\s*,\\s*")`, qui laisse les blancs
      de début et de fin de saisie).
  - key: import-csv-produit-colonnes-decalees-certaines
    format: scenario
    question: Un import CSV produit des colonnes décalées sur certaines lignes.
    answer: |-
      Je regarderais trois suspects. Le `split(",")` qui supprime les colonnes vides en fin de ligne, d'où un décalage : `split(",", -1)` les conserve. Les **valeurs contenant des virgules** entre guillemets, qu'un split naïf coupe en deux : il faut un vrai parseur CSV (OpenCSV, Apache Commons CSV, Jackson CSV). Et l'**encodage** : un BOM UTF-8 en tête de fichier ou un fichier en Windows-1252 lu en UTF-8 abîme la première colonne ou les accents.
      La leçon générale : le CSV a l'air simple mais a une spécification (RFC 4180), et on ne le parse pas à la main.
  - key: scenario-ligne-journal
    format: scenario
    question: Tu dois extraire la date, le niveau et le message de lignes de journal comme `2025-03-01 12:00:00 ERROR Connexion refusée`. Comment fais-tu ?
    answer: |-
      Un `split(" ", 4)` suffit si le format est fixe : la limite à 4 garde le message entier, espaces compris (date,
      heure, niveau, message). Si le format varie davantage, une expression régulière compilée une fois, avec des groupes
      nommés, rend l'extraction lisible et me permet de rejeter proprement une ligne qui ne correspond pas. Dans les deux
      cas, je teste avec des lignes réelles, y compris des messages vides ou multilignes, et je compte les lignes
      rejetées plutôt que de les ignorer en silence.
  - key: scenario-export
    format: scenario
    question: Tu dois produire un fichier où chaque ligne liste les identifiants d'une commande, séparés par des virgules. Comment l'écris-tu ?
    answer: |-
      Avec `String.join(",", ids)` ou `ids.stream().map(String::valueOf).collect(Collectors.joining(","))` : pas de
      virgule en trop, pas de concaténation en boucle. J'écris les lignes avec un `BufferedWriter` en UTF-8 explicite.
      Si une valeur peut contenir le séparateur, ce n'est plus un simple `join` : il faut l'échapper selon un format
      défini (CSV RFC 4180) et donc passer par une bibliothèque. Je documente le format (séparateur, encodage, fin de
      ligne) pour ceux qui liront le fichier.
  - key: scenario-cle-valeur
    format: scenario
    question: Un fichier de configuration contient des lignes `cle=valeur`, et certaines valeurs contiennent elles-mêmes `=`. Comment les lis-tu ?
    answer: |-
      Avec `ligne.split("=", 2)` : la limite garde tout ce qui suit le premier `=` dans la valeur. Je retire les blancs
      autour (`strip()`), j'ignore les lignes vides et les commentaires, et je signale une ligne sans `=` au lieu de
      planter sur l'indice 1. Et si le format ressemble à des propriétés Java, `java.util.Properties` sait déjà le lire,
      avec ses échappements.
