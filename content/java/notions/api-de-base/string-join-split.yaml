notion: string-join-split
lesson: |-
  **Découper** : `s.split(regex)` renvoie un tableau. **Assembler** : `String.join(separateur, elements)`,
  `StringJoiner` ou `Collectors.joining`.

  ```java
  "a,b,c".split(",");              // [a, b, c]
  "a.b".split("\\.");              // [a, b] : l'argument est une EXPRESSION RÉGULIÈRE
  "a b  c".split("\\s+");          // [a, b, c] : un ou plusieurs blancs
  "a,b,,".split(",");              // [a, b] : les chaînes vides FINALES sont supprimées
  "a,b,,".split(",", -1);          // [a, b, , ] : une limite négative les garde

  String.join(", ", List.of("x", "y"));            // "x, y"
  new StringJoiner(", ", "[", "]").add("a").add("b").toString();   // "[a, b]"
  ```

  - Les caractères spéciaux des regex (`. | * + ? ( ) [ ] { } \ ^ $`) doivent être échappés : `split("\\|")`, ou
    `split(Pattern.quote("|"))`.
  - La limite : `split(",", 2)` coupe au plus en deux morceaux (le reste reste entier).
  - `StringJoiner` gère préfixe, suffixe, et une valeur pour le cas vide (`setEmptyValue`).
  - Pour un vrai fichier CSV (guillemets, virgules dans les valeurs, RFC 4180), on utilise une bibliothèque.

  **Piège classique** : `split(".")` ou `split("|")`. Le point correspond à n'importe quel caractère, et le résultat
  est vide ; la barre est une alternative vide, qui coupe entre chaque caractère.

  **En entretien** : « `split` prend une regex et supprime les vides finaux sauf avec une limite négative ; `join` et
  `StringJoiner` assemblent sans séparateur en trop. »
tour:
  - title: Découper et assembler
    text: |-
      `split` découpe une chaîne selon un séparateur, qui est une **expression régulière** : un point, qui y signifie
      « n'importe quel caractère », doit être échappé. Piège : `split` supprime les morceaux vides **à la fin**.

      `String.join(", ", liste)` assemble avec un séparateur, et `StringJoiner` ajoute en plus un préfixe et un suffixe.
    example:
      files:
        Main.java: |-
          void main() {
              String csv = "Ada;36;Londres";
              String[] champs = csv.split(";");
              IO.println(champs.length + " " + champs[0] + " " + champs[2]);

              IO.println("a,b,,c,,".split(",").length);
              IO.println(String.join(" | ", List.of("Java", "Go", "Kotlin")));

              StringJoiner joiner = new StringJoiner(", ", "[", "]");
              joiner.add("un").add("deux");
              IO.println(joiner);
          }
      output: |-
        3 Ada Londres
        4
        Java | Go | Kotlin
        [un, deux]
    task:
      instructions: |-
        Découpe la phrase en mots, mets-les dans l'ordre inverse, et réassemble-les avec `String.join` : le programme
        doit afficher `Java aime Ada`.
      starter:
        Main.java: |-
          void main() {
              String phrase = "Ada aime Java";
              IO.println(phrase);
          }
      solution:
        Main.java: |-
          void main() {
              String phrase = "Ada aime Java";
              List<String> mots = new ArrayList<>(List.of(phrase.split(" ")));
              Collections.reverse(mots);
              IO.println(String.join(" ", mots));
          }
      output: |-
        Java aime Ada
cards:
  - key: b-split-renvoie-tableau-vide
    format: course
    question: "Pourquoi `\"a.b\".split(\".\")` renvoie-t-il un tableau vide ?"
    choices:
      - {text: "Le point est un métacaractère regex qui correspond à tout caractère : tout est séparateur", correct: true}
      - {text: "`split` ne coupe que sur des espaces et des virgules, et ignore les points", correct: false}
      - {text: "`split` attend un `char`, et la chaîne `\".\"` est donc ignorée sans erreur", correct: false}
      - {text: "Le point est réservé aux extensions de fichier, et `split` refuse de couper dessus", correct: false}
    answer: "Le point est un métacaractère regex qui correspond à tout caractère : chaque caractère devient un séparateur, et les morceaux, tous vides, sont supprimés. Il faut l'échapper : `split(\"\\\\.\")`."
  - key: renvoie-b-split-length
    format: course
    question: Que renvoie `"a,b,,".split(",").length` ?
    choices:
      - {text: "`2` : les chaînes vides finales sont supprimées", correct: true}
      - {text: "`4` : un morceau par séparateur, vides compris", correct: false}
      - {text: "`3` : seule la dernière chaîne vide est supprimée", correct: false}
      - {text: "Une `PatternSyntaxException` : deux virgules se suivent", correct: false}
    answer: "`2` : les chaînes vides finales sont supprimées, sauf avec une limite négative (`split(\",\", -1)` en donne 4)."
  - key: limite
    format: course
    question: Que fait `"cle=valeur=autre".split("=", 2)` ?
    choices:
      - {text: "Il coupe en deux morceaux au plus : `[\"cle\", \"valeur=autre\"]`", correct: true}
      - {text: "Il coupe au deuxième `=` : `[\"cle=valeur\", \"autre\"]`", correct: false}
      - {text: "Il garde les deux premiers morceaux : `[\"cle\", \"valeur\"]`", correct: false}
      - {text: "Il coupe partout, puis lève une exception au-delà de deux morceaux", correct: false}
    answer: 'Il coupe au plus en deux morceaux : `["cle", "valeur=autre"]`. Utile pour une ligne `cle=valeur` dont la valeur peut contenir le séparateur.'
  - key: string-joiner
    format: course
    question: Qu'apporte `StringJoiner` par rapport à `String.join` ?
    choices:
      - {text: "Un préfixe, un suffixe, une valeur pour le cas vide, et l'ajout élément par élément", correct: true}
      - {text: "La possibilité de découper une chaîne, à l'inverse de `String.join`", correct: false}
      - {text: "Un assemblage plus rapide : `String.join` recopie la chaîne à chaque élément", correct: false}
      - {text: "La synchronisation, pour assembler depuis plusieurs threads à la fois", correct: false}
    answer: Un préfixe et un suffixe (`new StringJoiner(", ", "[", "]")`), une valeur pour le cas vide (`setEmptyValue`), et l'ajout élément par élément.
  - key: vf-regex
    format: true-false
    question: L'argument de `split` est une expression régulière.
    truth: true
    answer: D'où la nécessité d'échapper `.`, `|`, `+`...
  - key: vf-vides-milieu
    format: true-false
    question: "`\"a,,b\".split(\",\")` supprime la chaîne vide du milieu."
    truth: false
    answer: "Seules les chaînes vides finales sont supprimées : on obtient `[a, , b]`."
  - key: vf-join-dernier
    format: true-false
    question: "`String.join(\",\", liste)` place un séparateur après le dernier élément."
    truth: false
    answer: Le séparateur n'est placé qu'entre les éléments.
  - key: vf-quote
    format: true-false
    question: "`s.split(Pattern.quote(\"|\"))` coupe sur la barre verticale littérale."
    truth: true
    answer: '`Pattern.quote` échappe toute la chaîne.'
  - key: qcm-echapper
    format: multiple-choice
    question: "Lequel de ces appels découpe `\"192.168.0.1\"` en ses quatre nombres ?"
    choices:
      - {text: "`ip.split(\"\\\\.\")`", correct: true}
      - {text: "`ip.split(\".\")`", correct: false}
      - {text: "`ip.split('.')`", correct: false}
      - {text: "`ip.split(\"|\")`", correct: false}
    answer: "Le point doit être échappé (comme avec `Pattern.quote(\".\")`). `split` n'a pas de version à `char`, et `|` seul coupe entre chaque caractère."
  - key: qcm-vides
    format: multiple-choice
    question: "Que vaut `\"a,b,,\".split(\",\", -1).length` ?"
    choices:
      - text: "4"
        correct: true
      - text: "2"
        correct: false
      - text: "3"
        correct: false
      - text: "1"
        correct: false
    answer: La limite négative garde les deux chaînes vides finales.
  - key: qcm-blancs
    format: multiple-choice
    question: "Comment découper `\"a  b\\tc\"` sur tous les blancs, même répétés ?"
    choices:
      - text: "`s.split(\"\\\\s+\")`"
        correct: true
      - text: "`s.split(\" \")`"
        correct: false
      - text: "`s.split(\"\\\\s\")`"
        correct: false
      - text: "`s.split(\"+\")`"
        correct: false
    answer: '`\s+` correspond à un ou plusieurs blancs ; `" "` laisserait des chaînes vides et la tabulation.'
  - key: qcm-assembler
    format: multiple-choice
    question: "Lequel de ces appels donne `\"[a, b, c]\"` à partir de la liste `a, b, c` ?"
    choices:
      - {text: "`liste.stream().collect(Collectors.joining(\", \", \"[\", \"]\"))`", correct: true}
      - {text: "`liste.stream().collect(Collectors.joining(\"[\", \", \", \"]\"))`", correct: false}
      - {text: "`String.join(\"[, ]\", liste)`", correct: false}
      - {text: "`liste.split(\", \")`", correct: false}
    answer: "`joining(séparateur, préfixe, suffixe)`, comme un `StringJoiner(\", \", \"[\", \"]\")` : l'ordre des arguments compte. `liste.toString()` donnerait le même texte ici, sans contrôle du format."
  - key: code-b-split-length-b-split
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("a,b,,".split(",").length + " " + "a,,b".split(",").length + " "
              + "a,b,,".split(",", -1).length + " " + "a.b".split(".").length);
      ```
    choices:
      - {text: "`2 3 4 0`", correct: true}
      - {text: "`2 3 4 3`", correct: false}
      - {text: "`4 3 4 0`", correct: false}
      - {text: "`2 2 4 0`", correct: false}
    answer: "`2 3 4 0` : les vides finaux sont supprimés, sauf avec une limite négative ; un vide au milieu reste ; et `.` coupe sur chaque caractère."
    check:
      code: |-
        System.out.println("a,b,,".split(",").length + " " + "a,,b".split(",").length + " "
                + "a,b,,".split(",", -1).length + " " + "a.b".split(".").length);
      output: "2 3 4 0"
  - key: code-join
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(String.join("-", "a", "b", "c") + " " + String.join("/", List.of("x", "y")));
      ```
    choices:
      - {text: "`a-b-c x/y`", correct: true}
      - {text: "`a-b-c- x/y/`", correct: false}
      - {text: "`-a-b-c /x/y`", correct: false}
      - {text: "`abc xy`", correct: false}
    answer: '`a-b-c x/y`.'
    check:
      output: "a-b-c x/y"
  - key: code-joiner
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      StringJoiner j = new StringJoiner(", ", "[", "]");
      j.setEmptyValue("(vide)");
      System.out.print(j + " ");
      j.add("a").add("b");
      System.out.println(j);
      ```
    choices:
      - {text: "`(vide) [a, b]`", correct: true}
      - {text: "`[] [a, b]`", correct: false}
      - {text: "`(vide) [a,b]`", correct: false}
      - {text: "`null [a, b]`", correct: false}
    answer: '`(vide) [a, b]`.'
    check:
      output: "(vide) [a, b]"
  - key: code-barre
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Arrays.toString("a|b|c".split("|")));
      ```
    choices:
      - {text: "`[a, |, b, |, c]`", correct: true}
      - {text: "`[a, b, c]`", correct: false}
      - {text: "`[a|b|c]`", correct: false}
      - {text: "`[]`", correct: false}
    answer: '`[a, |, b, |, c]` : `|` seul est une alternative vide, qui coupe entre chaque caractère.'
    check:
      output: "[a, |, b, |, c]"
  - key: bug-point
    format: bug-fix
    question: |-
      Ce code lève une `ArrayIndexOutOfBoundsException` :
      ```java
      String extension = nomFichier.split(".")[1];
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`nomFichier.substring(nomFichier.lastIndexOf('.') + 1)`", correct: true}
      - {text: "`nomFichier.substring(nomFichier.indexOf('.'))`", correct: false}
      - {text: "`nomFichier.split(\".\", 2)[1]`", correct: false}
      - {text: "`nomFichier.split(\".\")[0]`", correct: false}
    answer: |-
      ```java
      String extension = nomFichier.substring(nomFichier.lastIndexOf('.') + 1);
      ```
      `split(".")` coupe sur chaque caractère et renvoie un tableau vide. Pour une extension, `lastIndexOf` est plus
      juste (un nom comme `archive.tar.gz` a plusieurs points) ; sinon, `split("\\.")`.
  - key: bug-barre
    format: bug-fix
    question: |-
      Les champs d'une ligne `"Ada|Lovelace|1815"` sont découpés caractère par caractère :
      ```java
      String[] champs = ligne.split("|");
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`String[] champs = ligne.split(\"\\\\|\");`", correct: true}
      - {text: "`String[] champs = ligne.split(\"||\");`", correct: false}
      - {text: "`String[] champs = ligne.split(\"|\", -1);`", correct: false}
      - {text: "`String[] champs = ligne.split('|');`", correct: false}
    answer: |-
      ```java
      String[] champs = ligne.split("\\|");
      ```
      `|` est l'alternative des expressions régulières ; échappée, c'est la barre littérale.
  - key: bug-colonnes-vides
    format: bug-fix
    question: |-
      Pour `"Ada;Lovelace;;"`, le tableau n'a que deux colonnes au lieu de quatre, et `champs[3]` lève une exception :
      ```java
      String[] champs = ligne.split(";");
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`String[] champs = ligne.split(\";\", -1);`", correct: true}
      - {text: "`String[] champs = ligne.split(\";\", 0);`", correct: false}
      - {text: "`String[] champs = ligne.split(\";+\");`", correct: false}
      - {text: "`String[] champs = ligne.strip().split(\";\");`", correct: false}
    answer: |-
      ```java
      String[] champs = ligne.split(";", -1);
      ```
      Sans limite, les colonnes vides en fin de ligne sont supprimées ; une limite négative les garde.
  - key: bug-espaces-tags
    format: bug-fix
    question: |-
      Les tags saisis comme `"java, spring ,  docker"` gardent des espaces et ne correspondent à rien :
      ```java
      String[] tags = saisie.split(",");
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Découper, puis appliquer `strip` à chaque tag et retirer les vides", correct: true}
      - {text: "Appliquer `trim()` à la saisie entière, puis la découper", correct: false}
      - {text: "Découper sur `\", \"`, une virgule suivie d'un espace", correct: false}
      - {text: "Découper avec `split(\",\", -1)`, qui garde tous les morceaux", correct: false}
    answer: |-
      ```java
      List<String> tags = Arrays.stream(saisie.split(","))
              .map(String::strip)
              .filter(t -> !t.isEmpty())
              .toList();
      ```
      On retire les blancs autour de chaque tag et on ignore les vides (ou `split("\\s*,\\s*")`, qui laisse les blancs
      de début et de fin de saisie).
  - key: import-csv-produit-colonnes-decalees-certaines
    format: scenario
    question: "Un import CSV produit des colonnes décalées sur certaines lignes. Que soupçonnes-tu ?"
    choices:
      - {text: "Un `split(\",\")` naïf : colonnes vides finales perdues, virgules entre guillemets coupées", correct: true}
      - {text: "Un fichier trop gros, dont la JVM tronque certaines lignes pendant la lecture", correct: false}
      - {text: "Une locale mal réglée, qui inverse l'ordre des colonnes sur certaines lignes", correct: false}
      - {text: "Un tri des lignes appliqué avant le découpage, qui mélange les colonnes", correct: false}
    answer: "Le `split(\",\")` naïf : il supprime les colonnes vides en fin de ligne (`split(\",\", -1)` les garde) et coupe en deux une valeur entre guillemets qui contient une virgule. Le CSV a une spécification (RFC 4180) : on prend un vrai parseur (Commons CSV, Jackson CSV), et l'on vérifie l'encodage (BOM, Windows-1252)."
  - key: scenario-ligne-journal
    format: scenario
    question: Tu dois extraire la date, le niveau et le message de lignes de journal comme `2025-03-01 12:00:00 ERROR Connexion refusée`. Comment fais-tu ?
    choices:
      - {text: "Un `split(\" \", 4)`, qui garde le message entier, ou une regex compilée à groupes nommés", correct: true}
      - {text: "Un `split(\" \")`, puis les quatre premiers morceaux du tableau obtenu", correct: false}
      - {text: "Un `substring` à positions fixes pour la date, l'heure, le niveau et le message", correct: false}
      - {text: "Un `StringTokenizer` sur les espaces, plus rapide que `split`", correct: false}
    answer: "Un `split(\" \", 4)` suffit si le format est fixe : la limite à 4 garde le message entier, espaces compris. Si le format varie, une regex compilée une fois, à groupes nommés, rend l'extraction lisible et rejette proprement une ligne qui ne correspond pas. Les niveaux n'ont pas tous la même longueur (`INFO`, `ERROR`), d'où l'échec des positions fixes."
  - key: scenario-export
    format: scenario
    question: Tu dois produire un fichier où chaque ligne liste les identifiants d'une commande, séparés par des virgules. Comment l'écris-tu ?
    choices:
      - {text: "`String.join(\",\", ids)` (ou `Collectors.joining`), écrit en UTF-8 explicite", correct: true}
      - {text: "Une boucle avec `+=`, et une virgule ajoutée après chaque identifiant", correct: false}
      - {text: "`ids.toString()`, puis retirer les crochets avec `replace`", correct: false}
      - {text: "Un `StringBuffer` partagé, pour écrire depuis plusieurs threads", correct: false}
    answer: "`String.join(\",\", ids)` ou `Collectors.joining(\",\")` : pas de virgule en trop, pas de concaténation en boucle ; un `BufferedWriter` en UTF-8 explicite. Si une valeur peut contenir le séparateur, il faut l'échapper (CSV, RFC 4180), donc une bibliothèque. `toString()` laisserait aussi des espaces."
  - key: scenario-cle-valeur
    format: scenario
    question: Un fichier de configuration contient des lignes `cle=valeur`, et certaines valeurs contiennent elles-mêmes `=`. Comment les lis-tu ?
    choices:
      - {text: "`ligne.split(\"=\", 2)` : la limite garde dans la valeur tout ce qui suit le premier `=`", correct: true}
      - {text: "`ligne.split(\"=\")`, puis la valeur à l'indice 1 du tableau obtenu", correct: false}
      - {text: "`ligne.split(\"=\", -1)`, qui garde aussi les colonnes vides en fin de ligne", correct: false}
      - {text: "`ligne.substring(ligne.lastIndexOf('=') + 1)` pour obtenir la valeur", correct: false}
    answer: "Avec `ligne.split(\"=\", 2)` : la limite garde tout ce qui suit le premier `=`. Je retire les blancs (`strip()`), j'ignore les lignes vides et les commentaires, et je signale une ligne sans `=` au lieu de planter sur l'indice 1. Si le format ressemble à des propriétés Java, `java.util.Properties` sait déjà le lire."
