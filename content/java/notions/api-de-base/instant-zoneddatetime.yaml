notion: instant-zoneddatetime
lesson: |-
  Trois façons de désigner un moment précis :

  - **`Instant`** : un point sur la ligne du temps, en secondes et nanosecondes depuis le 1er janvier 1970 UTC
    (l'*epoch*). Indépendant de tout fuseau : `2025-07-01T10:00:00Z`.
  - **`ZonedDateTime`** : une date et une heure locales **dans un fuseau** (`ZoneId.of("Europe/Paris")`), avec ses
    règles d'heure d'été.
  - **`OffsetDateTime`** : une date et une heure avec un **décalage fixe** (`+02:00`), sans règles.

  ```java
  Instant i = Instant.parse("2025-07-01T10:00:00Z");
  ZonedDateTime paris = i.atZone(ZoneId.of("Europe/Paris"));       // 12:00 à Paris (UTC+2 l'été)
  paris.toInstant();                                               // retour à l'instant

  ZonedDateTime newYork = paris.withZoneSameInstant(ZoneId.of("America/New_York"));   // même instant, 06:00
  ZonedDateTime tokyo = paris.withZoneSameLocal(ZoneId.of("Asia/Tokyo"));             // même heure murale, autre instant
  ```

  - Un `ZoneId` (`Europe/Paris`) n'est pas un `ZoneOffset` (`+01:00`) : le décalage de Paris change deux fois par an.
  - Règle d'architecture : on **stocke et on échange des instants** (UTC, `timestamptz` en PostgreSQL, ISO 8601 avec `Z`
    ou un décalage), et l'on convertit au fuseau de l'utilisateur à l'**affichage**.
  - Pour comparer deux `ZonedDateTime` de fuseaux différents, `isEqual` ou `isBefore` (sur l'instant), pas `equals`
    (qui compare aussi le fuseau).
  - Jamais de fuseau par défaut implicite (`ZoneId.systemDefault()`) côté serveur : le résultat dépendrait de la
    machine.

  **Piège classique** : un décalage fixe `ZoneOffset.of("+01:00")` pour « l'heure de Paris ». Il est faux six mois par
  an.

  **En entretien** : « On stocke des instants en UTC et on convertit au fuseau de l'utilisateur à l'affichage ; un fuseau
  est un `ZoneId`, pas un décalage fixe. »
cards:
  - key: localdatetime-vs-zoneddatetime-vs-instant
    format: course
    question: "Que représentent `LocalDateTime`, `ZonedDateTime` et `Instant` ?"
    choices:
      - {text: "Une date-heure sans fuseau ; une date-heure avec fuseau et ses règles ; un point absolu en UTC", correct: true}
      - {text: "Un point absolu en UTC ; une date-heure sans fuseau ; une date-heure avec fuseau et ses règles", correct: false}
      - {text: "Une date-heure du fuseau par défaut ; une date-heure à décalage fixe ; un nombre de jours", correct: false}
      - {text: "Trois noms pour la même valeur, que seul le formatage à l'affichage distingue", correct: false}
    answer: "`LocalDateTime` n'a pas de fuseau ; `ZonedDateTime` a un fuseau et ses règles de changement d'heure ; `Instant` est un point absolu sur la ligne du temps, en UTC."
  - key: format-stocker-dates-base
    format: course
    question: Dans quel format stocker des dates en base ?
    choices:
      - {text: "En UTC (`Instant`, `timestamptz`), converties au fuseau de l'utilisateur à l'affichage", correct: true}
      - {text: "En heure locale du serveur (`LocalDateTime`), plus facile à lire dans la base", correct: false}
      - {text: "En texte au format `dd/MM/yyyy HH:mm`, lisible par tous les outils", correct: false}
      - {text: "En heure locale de l'utilisateur, sans fuseau, pour éviter toute conversion", correct: false}
    answer: En UTC (Instant / timestamp with time zone), conversion au fuseau de l'utilisateur à l'affichage.
  - key: zone-vs-offset
    format: course
    question: Quelle différence entre `ZoneId.of("Europe/Paris")` et `ZoneOffset.of("+01:00")` ?
    choices:
      - {text: "Le `ZoneId` porte les règles du fuseau, heure d'été comprise ; le `ZoneOffset` est fixe", correct: true}
      - {text: "Aucune : `Europe/Paris` est un simple alias de `+01:00`, toute l'année", correct: false}
      - {text: "Le `ZoneOffset` suit l'heure d'été ; le `ZoneId` est un décalage fixe", correct: false}
      - {text: "Le `ZoneId` ne sert qu'à l'affichage ; le `ZoneOffset`, qu'aux calculs", correct: false}
    answer: "Le `ZoneId` porte les règles du fuseau, dont l'heure d'été (+01:00 l'hiver, +02:00 l'été) ; le `ZoneOffset` est un décalage fixe."
  - key: same-instant-vs-same-local
    format: course
    question: Quelle différence entre `withZoneSameInstant` et `withZoneSameLocal` ?
    choices:
      - {text: "Le premier garde l'instant et change l'heure affichée ; le second garde l'heure et change l'instant", correct: true}
      - {text: "Le premier garde l'heure et change l'instant ; le second garde l'instant et change l'heure affichée", correct: false}
      - {text: "Les deux gardent l'instant ; le second ignore seulement les règles de l'heure d'été", correct: false}
      - {text: "Le premier convertit en UTC ; le second dans le fuseau par défaut de la machine", correct: false}
    answer: Le premier garde l'instant et change l'heure affichée (la même réunion vue d'un autre pays) ; le second garde l'heure murale et change l'instant (la même heure ailleurs).
  - key: vf-instant-utc
    format: true-false
    question: Un `Instant` dépend du fuseau horaire du serveur.
    truth: false
    answer: C'est un point absolu sur la ligne du temps, toujours exprimé en UTC.
  - key: vf-offset-paris
    format: true-false
    question: "`ZoneOffset.of(\"+01:00\")` représente correctement l'heure de Paris toute l'année."
    truth: false
    answer: Paris passe à +02:00 l'été ; il faut `ZoneId.of("Europe/Paris")`.
  - key: vf-equals-zones
    format: true-false
    question: Deux `ZonedDateTime` qui désignent le même instant dans deux fuseaux différents sont égaux selon `equals`.
    truth: false
    answer: '`equals` compare aussi le fuseau ; `isEqual` compare l''instant.'
  - key: vf-epoch
    format: true-false
    question: "`Instant.ofEpochSecond(0)` vaut `1970-01-01T00:00:00Z`."
    truth: true
    answer: C'est l'*epoch* Unix.
  - key: qcm-stocker
    format: multiple-choice
    question: Comment stocker l'horodatage d'un paiement en PostgreSQL ?
    choices:
      - text: "Un `Instant` dans une colonne `timestamptz`"
        correct: true
      - text: "Un `LocalDateTime` dans une colonne `timestamp`"
        correct: false
      - text: "Une chaîne au format `dd/MM/yyyy HH:mm`"
        correct: false
      - text: "Le fuseau du serveur, implicite"
        correct: false
    answer: Un instant est sans ambiguïté ; une date locale sans fuseau ne l'est pas.
  - key: qcm-conversion
    format: multiple-choice
    question: "Laquelle de ces expressions place un `Instant` à l'heure de Paris ?"
    choices:
      - {text: "`instant.atZone(ZoneId.of(\"Europe/Paris\"))`", correct: true}
      - {text: "`instant.atOffset(ZoneOffset.of(\"+01:00\"))`", correct: false}
      - {text: "`instant.plus(1, ChronoUnit.HOURS)`", correct: false}
      - {text: "`LocalDateTime.from(instant)`", correct: false}
    answer: "`atZone` (comme `ZonedDateTime.ofInstant`) applique les règles du fuseau. Un décalage fixe ou une heure ajoutée à la main ignorent l'heure d'été ; `LocalDateTime.from(instant)` lève une exception, faute de fuseau."
  - key: qcm-comparer
    format: multiple-choice
    question: "Lequel de ces tests vérifie que deux réunions (des `ZonedDateTime`), l'une à Paris et l'autre à New York, ont lieu au même instant ?"
    choices:
      - {text: "`paris.isEqual(newYork)`", correct: true}
      - {text: "`paris.equals(newYork)`", correct: false}
      - {text: "`paris.toLocalTime().equals(newYork.toLocalTime())`", correct: false}
      - {text: "`paris.toLocalDateTime().equals(newYork.toLocalDateTime())`", correct: false}
    answer: "`isEqual` compare les instants, comme `toInstant().equals(...)`. `equals` compare aussi les fuseaux, et les heures locales diffèrent forcément."
  - key: qcm-api
    format: multiple-choice
    question: "Lequel de ces formats désigne un instant sans ambiguïté dans une API ?"
    choices:
      - {text: "`2025-03-14T09:00:00Z`", correct: true}
      - {text: "`2025-03-14T10:00:00` (sans fuseau)", correct: false}
      - {text: "`14/03/2025 10:00`", correct: false}
      - {text: "`2025-03-14`", correct: false}
    answer: "L'UTC (`Z`), ou un décalage explicite comme `+01:00`, désigne un instant. Sans fuseau ni décalage, la valeur est une heure locale ; une date seule n'est pas un instant."
  - key: code-paris-ete
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      Instant i = Instant.parse("2025-07-01T10:00:00Z");
      System.out.println(i.atZone(ZoneId.of("Europe/Paris")).toLocalTime());
      ```
    choices:
      - {text: "`12:00`", correct: true}
      - {text: "`11:00`", correct: false}
      - {text: "`10:00`", correct: false}
      - {text: "`08:00`", correct: false}
    answer: '`12:00` : Paris est à UTC+2 en été.'
    check:
      output: "12:00"
  - key: code-same-instant
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      ZonedDateTime paris = ZonedDateTime.of(2025, 1, 15, 9, 0, 0, 0, ZoneId.of("Europe/Paris"));
      System.out.println(paris.withZoneSameInstant(ZoneId.of("America/New_York")).toLocalTime());
      ```
    choices:
      - {text: "`03:00`", correct: true}
      - {text: "`09:00`", correct: false}
      - {text: "`04:00`", correct: false}
      - {text: "`15:00`", correct: false}
    answer: '`03:00` : en hiver, Paris est à UTC+1 et New York à UTC-5.'
    check:
      output: "03:00"
  - key: code-same-local
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      ZonedDateTime paris = ZonedDateTime.of(2025, 1, 15, 9, 0, 0, 0, ZoneId.of("Europe/Paris"));
      System.out.println(paris.withZoneSameLocal(ZoneId.of("Asia/Tokyo")).toInstant());
      ```
    choices:
      - {text: "`2025-01-15T00:00:00Z`", correct: true}
      - {text: "`2025-01-15T08:00:00Z`", correct: false}
      - {text: "`2025-01-15T09:00:00Z`", correct: false}
      - {text: "`2025-01-14T16:00:00Z`", correct: false}
    answer: '`2025-01-15T00:00:00Z` : 9 h à Tokyo (UTC+9), c''est minuit en UTC.'
    check:
      output: "2025-01-15T00:00:00Z"
  - key: code-epoch
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.time.*;
      System.out.println(Instant.ofEpochSecond(0) + " " + Instant.parse("2025-01-01T00:00:00Z").getEpochSecond());
      ```
    choices:
      - {text: "`1970-01-01T00:00:00Z 1735689600`", correct: true}
      - {text: "`1970-01-01T00:00:00Z 1735689600000`", correct: false}
      - {text: "`1970-01-01T00:00Z 1735689600`", correct: false}
      - {text: "`0 1735689600`", correct: false}
    answer: "`1970-01-01T00:00:00Z 1735689600` : `Instant` s'affiche en ISO 8601, et `getEpochSecond` compte des secondes, pas des millisecondes."
    check:
      output: "1970-01-01T00:00:00Z 1735689600"
  - key: bug-local-horodatage
    format: bug-fix
    question: |-
      Après le déplacement des serveurs à Singapour, les horodatages des commandes sont décalés de sept heures :
      ```java
      commande.setCreeLe(LocalDateTime.now());
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`commande.setCreeLe(Instant.now(clock));`", correct: true}
      - {text: "`commande.setCreeLe(LocalDateTime.now().minusHours(7));`", correct: false}
      - {text: "`commande.setCreeLe(LocalDateTime.now(ZoneId.of(\"Asia/Singapore\")));`", correct: false}
      - {text: "`commande.setCreeLe(LocalDate.now().atStartOfDay());`", correct: false}
    answer: |-
      ```java
      commande.setCreeLe(Instant.now(clock));
      ```
      `LocalDateTime.now()` prend l'heure locale du serveur, sans fuseau : sa signification change avec la machine. Un
      `Instant` est absolu (et la `Clock` injectée rend le code testable).
  - key: bug-offset-fixe
    format: bug-fix
    question: |-
      L'été, les rappels des réunions à Paris partent une heure trop tôt :
      ```java
      ZonedDateTime rappel = rdv.atZone(ZoneOffset.of("+01:00")).minusHours(24);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`rdv.atZone(ZoneId.of(\"Europe/Paris\")).minusHours(24)`", correct: true}
      - {text: "`rdv.atZone(ZoneOffset.of(\"+02:00\")).minusHours(24)`", correct: false}
      - {text: "`rdv.atZone(ZoneOffset.UTC).minusHours(24)`", correct: false}
      - {text: "`rdv.atZone(ZoneOffset.of(\"+01:00\")).minusHours(23)`", correct: false}
    answer: |-
      ```java
      ZonedDateTime rappel = rdv.atZone(ZoneId.of("Europe/Paris")).minusHours(24);
      ```
      Un décalage fixe ignore l'heure d'été. Le `ZoneId` applique les règles du fuseau à chaque date.
  - key: bug-equals-zones
    format: bug-fix
    question: |-
      Ce test de conflit d'agenda rate deux réunions au même instant, saisies dans deux pays :
      ```java
      if (reunionA.debut().equals(reunionB.debut())) {   // ZonedDateTime
          signalerConflit();
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`reunionA.debut().isEqual(reunionB.debut())`", correct: true}
      - {text: "`reunionA.debut() == reunionB.debut()`", correct: false}
      - {text: "`reunionA.debut().getHour() == reunionB.debut().getHour()`", correct: false}
      - {text: "`reunionA.debut().toLocalDateTime().equals(reunionB.debut().toLocalDateTime())`", correct: false}
    answer: |-
      ```java
      if (reunionA.debut().isEqual(reunionB.debut())) {
          signalerConflit();
      }
      ```
      `equals` compare l'heure locale et le fuseau ; `isEqual` compare l'instant.
  - key: bug-fuseau-defaut
    format: bug-fix
    question: |-
      Le jour d'une commande diffère selon le serveur qui calcule le rapport :
      ```java
      LocalDate jour = commande.creeLe().atZone(ZoneId.systemDefault()).toLocalDate();
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`commande.creeLe().atZone(boutique.fuseau()).toLocalDate()`", correct: true}
      - {text: "`commande.creeLe().atZone(ZoneOffset.UTC).toLocalDate()`", correct: false}
      - {text: "`LocalDate.now()`, lu au moment où le rapport est calculé", correct: false}
      - {text: "`commande.creeLe().atZone(ZoneId.systemDefault()).toLocalDate().plusDays(1)`", correct: false}
    answer: "Le fuseau par défaut dépend de la machine. Le jour métier se calcule dans le fuseau du métier (la boutique, l'utilisateur), rendu explicite : l'UTC est stable d'un serveur à l'autre, mais donne le mauvais jour à minuit à Paris."
  - key: utilisateurs-plusieurs-pays-reservent-creneaux
    format: scenario
    question: "Des utilisateurs dans plusieurs pays réservent des créneaux. Comment gères-tu les dates ?"
    choices:
      - {text: "Des instants UTC en base, le `ZoneId` du lieu à part, et la conversion à l'affichage", correct: true}
      - {text: "L'heure locale saisie par chaque utilisateur, stockée en base sans aucun fuseau", correct: false}
      - {text: "L'heure locale du serveur partout, convertie ensuite par le navigateur de chacun", correct: false}
      - {text: "Des instants UTC en base, avec un décalage fixe par pays (`+01:00` pour la France)", correct: false}
    answer: "Je distingue l'instant de sa représentation : des instants UTC (`Instant`, `timestamptz`) en base et entre services, et le fuseau de l'utilisateur ou du lieu comme une donnée à part, un `ZoneId` (un décalage fixe change avec l'heure d'été). La conversion se fait à l'affichage et à la saisie ; pour un créneau futur récurrent, l'heure locale et le `ZoneId` sont plus justes, les règles d'un pays pouvant changer d'ici là."
  - key: scenario-serveurs-fuseaux
    format: scenario
    question: Tes serveurs tournent dans plusieurs régions cloud. Comment éviter que le fuseau de la machine influence les résultats ?
    choices:
      - {text: "Ne jamais dépendre du fuseau par défaut : des `Instant`, un `ZoneId` explicite, une `Clock` UTC", correct: true}
      - {text: "Régler chaque serveur dans le fuseau de sa région, pour que les heures locales soient justes", correct: false}
      - {text: "Stocker des `LocalDateTime` et documenter le fuseau utilisé par chaque région cloud", correct: false}
      - {text: "Convertir toutes les dates en texte avant de les échanger entre les régions", correct: false}
    answer: "Le code ne dépend jamais du fuseau par défaut : il stocke et compare des `Instant`, chaque conversion en date locale reçoit un `ZoneId` explicite, et une `Clock` UTC injectée donne l'heure. Par précaution, JVM et base tournent aussi en UTC, et une règle (test d'architecture, revue) interdit `ZoneId.systemDefault()` et `LocalDateTime.now()` sans argument."
  - key: scenario-affichage-utilisateur
    format: scenario
    question: Comment affiches-tu l'heure d'un événement à un utilisateur qui voyage ?
    choices:
      - {text: "Un `Instant` en base, converti au dernier moment dans le fuseau choisi par l'utilisateur", correct: true}
      - {text: "L'heure du serveur, que l'utilisateur convertit lui-même selon le pays où il se trouve", correct: false}
      - {text: "La `LocalDateTime` de création de l'événement, affichée telle quelle partout", correct: false}
      - {text: "Un `Instant` en base, affiché tel quel en UTC pour tous les utilisateurs", correct: false}
    answer: "L'événement est un `Instant` en base ; le fuseau d'affichage est une préférence de l'utilisateur (un `ZoneId`) ou celui de son navigateur. Je convertis au dernier moment (`instant.atZone(fuseau)`) et je formate avec sa locale. Pour un événement lié à un lieu (un vol, un concert), j'affiche plutôt l'heure du lieu, en précisant le fuseau."
  - key: scenario-planification
    format: scenario
    question: Un traitement doit s'exécuter « tous les jours à 8 h, heure de Paris ». Comment le planifies-tu ?
    choices:
      - {text: "Calculer chaque occurrence dans `Europe/Paris` avec `ZonedDateTime`, qui suit l'heure d'été", correct: true}
      - {text: "Un `cron` fixe à 7 h UTC, qui correspond à 8 h à Paris toute l'année", correct: false}
      - {text: "Un `cron` fixe à 8 h UTC, l'écart avec Paris étant négligeable", correct: false}
      - {text: "Une boucle qui dort `Duration.ofDays(1)` après chaque exécution de 8 h", correct: false}
    answer: "Je planifie dans le fuseau `Europe/Paris` : chaque prochaine occurrence se calcule avec `ZonedDateTime` (`demain.atTime(8, 0).atZone(paris)`), soit 7 h ou 6 h UTC selon la saison. Un `cron` en UTC serait décalé six mois par an. J'évite la plage 2 h - 3 h, et je teste les deux week-ends de changement d'heure avec une `Clock`."
