notion: biginteger
lesson: |-
  `BigInteger` représente un entier **sans limite de taille** : il grandit autant que nécessaire, là où un `long`
  s'arrête à 9 223 372 036 854 775 807.

  ```java
  BigInteger f = BigInteger.ONE;
  for (int i = 2; i <= 25; i++) {
      f = f.multiply(BigInteger.valueOf(i));      // 25! = 15511210043330985984000000
  }

  BigInteger.TWO.pow(100);                        // 1267650600228229401496703205376
  new BigInteger("123456789012345678901234567890");
  BigInteger.valueOf(48).gcd(BigInteger.valueOf(18));   // 6
  BigInteger.valueOf(17).isProbablePrime(20);     // true
  a.modPow(e, n);                                 // (a^e) mod n, la base du RSA
  ```

  - **Immuable**, comme `BigDecimal` : chaque opération renvoie un nouvel objet.
  - On le crée avec `BigInteger.valueOf(long)` ou `new BigInteger(String)` ; les constantes `ZERO`, `ONE`, `TWO`, `TEN`.
  - Pas d'opérateurs : `add`, `subtract`, `multiply`, `divide`, `mod`, `pow`, `compareTo`.
  - Il ne déborde jamais, mais il est bien plus **lent** qu'un `long` : on le réserve aux vrais grands nombres
    (cryptographie, combinatoire, identifiants de 128 bits).
  - `longValueExact()` convertit en `long`, et lève une exception si la valeur ne tient pas.

  **Piège classique** : `BigInteger.valueOf(Long.MAX_VALUE + 1)`. Le calcul déborde en `long` **avant** d'arriver dans le
  `BigInteger` ; il faut `BigInteger.valueOf(Long.MAX_VALUE).add(BigInteger.ONE)`.

  **En entretien** : « `BigInteger` pour les entiers sans limite, immuable et plus lent ; on fait tout le calcul en
  `BigInteger`, pas seulement le résultat. »
cards:
  - key: definition
    format: course
    question: À quoi sert `BigInteger` ?
    answer: À manipuler des entiers de taille arbitraire, qui ne débordent jamais (cryptographie, factorielles, grands identifiants).
  - key: creation
    format: course
    question: Comment crée-t-on un `BigInteger` ?
    answer: Avec `BigInteger.valueOf(long)`, `new BigInteger("...")` pour un nombre plus grand qu'un `long`, ou les constantes `ZERO`, `ONE`, `TWO`, `TEN`.
  - key: cout
    format: course
    question: Pourquoi ne pas utiliser `BigInteger` partout ?
    answer: "Chaque opération alloue un objet et travaille sur un tableau de chiffres : c'est beaucoup plus lent qu'un `long`."
  - key: conversion
    format: course
    question: Comment reconvertir un `BigInteger` en `long` en sécurité ?
    answer: Avec `longValueExact()`, qui lève une `ArithmeticException` si la valeur ne tient pas ; `longValue()` tronquerait en silence.
  - key: vf-deborde
    format: true-false
    question: "`BigInteger` peut déborder comme un `long`."
    truth: false
    answer: Il grandit autant que nécessaire.
  - key: vf-immuable
    format: true-false
    question: "`a.add(b)` modifie `a`."
    truth: false
    answer: '`BigInteger` est immuable : `add` renvoie un nouvel objet.'
  - key: vf-operateurs
    format: true-false
    question: "On peut écrire `a + b` avec deux `BigInteger`."
    truth: false
    answer: "Java n'a pas de surcharge d'opérateurs : on écrit `a.add(b)`."
  - key: vf-premier
    format: true-false
    question: "`isProbablePrime` peut tester si un grand nombre est premier."
    truth: true
    answer: Avec une probabilité d'erreur réglable (le paramètre de certitude).
  - key: qcm-creer
    format: multiple-choice
    question: Comment représenter 2⁷⁰ ?
    choices:
      - text: "`BigInteger.TWO.pow(70)`"
        correct: true
      - text: "`BigInteger.ONE.shiftLeft(70)`"
        correct: true
      - text: "`BigInteger.valueOf(1L << 70)`"
        correct: false
      - text: "`BigInteger.valueOf((long) Math.pow(2, 70))`"
        correct: false
    answer: '`1L << 70` se calcule en `long` (décalage modulo 64) ; `Math.pow` passe par un `double` et sature au cast.'
  - key: qcm-comparer
    format: multiple-choice
    question: Comment comparer deux `BigInteger` ?
    choices:
      - text: "`a.compareTo(b)`"
        correct: true
      - text: "`a.equals(b)`, pour l'égalité"
        correct: true
      - text: "`a == b`"
        correct: false
      - text: "`a < b`"
        correct: false
    answer: "Ce sont des objets : `==` compare les références, et `<` ne compile pas."
  - key: qcm-usage
    format: multiple-choice
    question: Dans quel cas `BigInteger` est-il justifié ?
    choices:
      - text: "Calculer 50!"
        correct: true
      - text: "Un calcul RSA avec `modPow`"
        correct: true
      - text: "Un compteur de visites"
        correct: false
      - text: "Un indice de boucle"
        correct: false
    answer: Un `long` suffit largement pour les deux derniers.
  - key: qcm-pgcd
    format: multiple-choice
    question: Quelle méthode donne le plus grand diviseur commun ?
    choices:
      - text: "`gcd`"
        correct: true
      - text: "`mod`"
        correct: false
      - text: "`divide`"
        correct: false
      - text: "`pgcd`"
        correct: false
    answer: '`gcd` (*greatest common divisor*).'
  - key: code-puissance
    format: code-output
    question: |-
      ```java
      System.out.println(BigInteger.TWO.pow(100));
      ```
    answer: '`1267650600228229401496703205376`.'
    check:
      output: "1267650600228229401496703205376"
  - key: code-factorielle
    format: code-output
    question: |-
      ```java
      BigInteger f = BigInteger.ONE;
      for (int i = 2; i <= 25; i++) {
          f = f.multiply(BigInteger.valueOf(i));
      }
      System.out.println(f);
      ```
    answer: '`15511210043330985984000000` : 25!, bien au-delà d''un `long`.'
    check:
      output: "15511210043330985984000000"
  - key: code-pgcd-premier
    format: code-output
    question: |-
      ```java
      System.out.println(BigInteger.valueOf(48).gcd(BigInteger.valueOf(18)) + " " + BigInteger.valueOf(17).isProbablePrime(20));
      ```
    answer: '`6 true`.'
    check:
      output: "6 true"
  - key: code-immuable
    format: code-output
    question: |-
      ```java
      BigInteger a = BigInteger.ONE;
      a.add(BigInteger.ONE);
      BigInteger b = a.add(BigInteger.ONE);
      System.out.println(a + " " + b);
      ```
    answer: '`1 2` : `add` ne modifie pas `a`.'
    check:
      output: "1 2"
  - key: bug-resultat-ignore
    format: bug-fix
    question: |-
      Cette factorielle vaut toujours 1 :
      ```java
      BigInteger f = BigInteger.ONE;
      for (int i = 2; i <= n; i++) {
          f.multiply(BigInteger.valueOf(i));
      }
      ```
    answer: |-
      ```java
      for (int i = 2; i <= n; i++) {
          f = f.multiply(BigInteger.valueOf(i));
      }
      ```
      `BigInteger` est immuable : il faut réaffecter le résultat.
  - key: bug-factorielle-long
    format: bug-fix
    question: |-
      `factorielle(25)` renvoie une valeur négative :
      ```java
      static long factorielle(int n) {
          long f = 1;
          for (int i = 2; i <= n; i++) f *= i;
          return f;
      }
      ```
    answer: |-
      ```java
      static BigInteger factorielle(int n) {
          BigInteger f = BigInteger.ONE;
          for (int i = 2; i <= n; i++) f = f.multiply(BigInteger.valueOf(i));
          return f;
      }
      ```
      21! dépasse déjà un `long`, qui déborde en silence. `BigInteger` ne déborde jamais.
  - key: bug-calcul-avant
    format: bug-fix
    question: |-
      Ce `BigInteger` vaut `-9223372036854775808` :
      ```java
      BigInteger suivant = BigInteger.valueOf(Long.MAX_VALUE + 1);
      ```
    answer: |-
      ```java
      BigInteger suivant = BigInteger.valueOf(Long.MAX_VALUE).add(BigInteger.ONE);
      ```
      L'addition se fait en `long`, où elle déborde, avant la conversion. Le calcul doit se faire en `BigInteger`.
  - key: bug-egal-egal
    format: bug-fix
    question: |-
      Ce test de signature échoue toujours :
      ```java
      if (calculee == attendue) {   // deux BigInteger
          accepter();
      }
      ```
    answer: |-
      ```java
      if (calculee.equals(attendue)) {
          accepter();
      }
      ```
      `==` compare les références de deux objets distincts. `equals` (ou `compareTo(...) == 0`) compare les valeurs.
