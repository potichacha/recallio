notion: biginteger
lesson: |-
  `BigInteger` représente un entier **sans limite de taille** : il grandit autant que nécessaire, là où un `long`
  s'arrête à 9 223 372 036 854 775 807.

  ```java
  BigInteger f = BigInteger.ONE;
  for (int i = 2; i <= 25; i++) {
      f = f.multiply(BigInteger.valueOf(i));      // 25! = 15511210043330985984000000
  }

  BigInteger.TWO.pow(100);                        // 1267650600228229401496703205376
  new BigInteger("123456789012345678901234567890");
  BigInteger.valueOf(48).gcd(BigInteger.valueOf(18));   // 6
  BigInteger.valueOf(17).isProbablePrime(20);     // true
  a.modPow(e, n);                                 // (a^e) mod n, la base du RSA
  ```

  - **Immuable**, comme `BigDecimal` : chaque opération renvoie un nouvel objet.
  - On le crée avec `BigInteger.valueOf(long)` ou `new BigInteger(String)` ; les constantes `ZERO`, `ONE`, `TWO`, `TEN`.
  - Pas d'opérateurs : `add`, `subtract`, `multiply`, `divide`, `mod`, `pow`, `compareTo`.
  - Il ne déborde jamais, mais il est bien plus **lent** qu'un `long` : on le réserve aux vrais grands nombres
    (cryptographie, combinatoire, identifiants de 128 bits).
  - `longValueExact()` convertit en `long`, et lève une exception si la valeur ne tient pas.

  **Piège classique** : `BigInteger.valueOf(Long.MAX_VALUE + 1)`. Le calcul déborde en `long` **avant** d'arriver dans le
  `BigInteger` ; il faut `BigInteger.valueOf(Long.MAX_VALUE).add(BigInteger.ONE)`.

  **En entretien** : « `BigInteger` pour les entiers sans limite, immuable et plus lent ; on fait tout le calcul en
  `BigInteger`, pas seulement le résultat. »
cards:
  - key: definition
    format: course
    question: À quoi sert `BigInteger` ?
    choices:
      - {text: "À manipuler des entiers de taille arbitraire, qui ne débordent jamais", correct: true}
      - {text: "À manipuler des décimaux exacts, comme des montants en euros", correct: false}
      - {text: "À ranger un `long` dans une collection, comme une enveloppe", correct: false}
      - {text: "À calculer plus vite qu'un `long` sur de très grands nombres", correct: false}
    answer: "À manipuler des entiers de taille arbitraire, qui ne débordent jamais (cryptographie, factorielles, grands identifiants). Les décimaux exacts, c'est `BigDecimal`."
  - key: creation
    format: course
    question: Comment crée-t-on un `BigInteger` ?
    choices:
      - {text: "Avec `BigInteger.valueOf(long)`, ou `new BigInteger(\"...\")` au-delà d'un `long`", correct: true}
      - {text: "Avec `new BigInteger(long)`, le seul constructeur public de la classe", correct: false}
      - {text: "Avec `BigInteger.parse(\"...\")`, sur le modèle de `Integer.parseInt`", correct: false}
      - {text: "Par l'autoboxing d'un `long` : `BigInteger b = 42L;`", correct: false}
    answer: Avec `BigInteger.valueOf(long)`, `new BigInteger("...")` pour un nombre plus grand qu'un `long`, ou les constantes `ZERO`, `ONE`, `TWO`, `TEN`.
  - key: cout
    format: course
    question: Pourquoi ne pas utiliser `BigInteger` partout ?
    choices:
      - {text: "Chaque opération alloue un objet sur un tableau de chiffres : bien plus lent qu'un `long`", correct: true}
      - {text: "Il perd de la précision au-delà de 64 bits, exactement comme un `double`", correct: false}
      - {text: "Il n'est pas sûr entre threads, contrairement à un `long`", correct: false}
      - {text: "Il ne sait représenter que des entiers positifs, sans signe", correct: false}
    answer: "Chaque opération alloue un objet et travaille sur un tableau de chiffres : c'est beaucoup plus lent qu'un `long`."
  - key: conversion
    format: course
    question: Comment reconvertir un `BigInteger` en `long` en sécurité ?
    choices:
      - {text: "Avec `longValueExact()`, qui lève une exception si la valeur ne tient pas", correct: true}
      - {text: "Avec `longValue()`, qui lève une exception si la valeur ne tient pas", correct: false}
      - {text: "Avec un cast `(long) grand`, que le compilateur vérifie", correct: false}
      - {text: "Avec `grand.intValue()`, puis un élargissement en `long`", correct: false}
    answer: Avec `longValueExact()`, qui lève une `ArithmeticException` si la valeur ne tient pas ; `longValue()` tronquerait en silence.
  - key: vf-deborde
    format: true-false
    question: "`BigInteger` peut déborder comme un `long`."
    truth: false
    answer: Il grandit autant que nécessaire.
  - key: vf-immuable
    format: true-false
    question: "`a.add(b)` modifie `a`."
    truth: false
    answer: '`BigInteger` est immuable : `add` renvoie un nouvel objet.'
  - key: vf-operateurs
    format: true-false
    question: "On peut écrire `a + b` avec deux `BigInteger`."
    truth: false
    answer: "Java n'a pas de surcharge d'opérateurs : on écrit `a.add(b)`."
  - key: vf-premier
    format: true-false
    question: "`isProbablePrime` peut tester si un grand nombre est premier."
    truth: true
    answer: Avec une probabilité d'erreur réglable (le paramètre de certitude).
  - key: qcm-creer
    format: multiple-choice
    question: "Laquelle de ces expressions vaut 2⁷⁰ ?"
    choices:
      - {text: "`BigInteger.TWO.pow(70)`", correct: true}
      - {text: "`BigInteger.TWO.shiftLeft(70)`", correct: false}
      - {text: "`BigInteger.valueOf(1L << 70)`", correct: false}
      - {text: "`BigInteger.valueOf((long) Math.pow(2, 70))`", correct: false}
    answer: "`TWO.pow(70)`, comme `ONE.shiftLeft(70)`. `TWO.shiftLeft(70)` vaut 2⁷¹ ; `1L << 70` se calcule en `long` (décalage modulo 64) ; `Math.pow` passe par un `double` et sature au cast."
  - key: qcm-comparer
    format: multiple-choice
    question: "Comment tester qu'un `BigInteger` `a` est plus petit que `b` ?"
    choices:
      - {text: "`a.compareTo(b) < 0`", correct: true}
      - {text: "`a < b`", correct: false}
      - {text: "`a.longValue() < b.longValue()`", correct: false}
      - {text: "`a.signum() < b.signum()`", correct: false}
    answer: "Ce sont des objets : `<` ne compile pas, et `compareTo` compare les valeurs. `longValue()` tronquerait les grands nombres, `signum()` ne donne que le signe. Pour l'égalité, `equals`."
  - key: qcm-usage
    format: multiple-choice
    question: "Dans lequel de ces cas `BigInteger` est-il justifié ?"
    choices:
      - {text: "Un calcul RSA avec `modPow`", correct: true}
      - {text: "Un compteur de visites", correct: false}
      - {text: "Un indice de boucle", correct: false}
      - {text: "Un identifiant de base en `BIGINT`", correct: false}
    answer: "Le RSA manipule des entiers de milliers de bits. Un `long` suffit pour les autres, `BIGINT` compris, qui tient sur 64 bits."
  - key: qcm-pgcd
    format: multiple-choice
    question: Quelle méthode donne le plus grand diviseur commun ?
    choices:
      - text: "`gcd`"
        correct: true
      - text: "`mod`"
        correct: false
      - text: "`divide`"
        correct: false
      - text: "`pgcd`"
        correct: false
    answer: '`gcd` (*greatest common divisor*).'
  - key: code-puissance
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(BigInteger.TWO.pow(100));
      ```
    choices:
      - {text: "`1267650600228229401496703205376`", correct: true}
      - {text: "`1.2676506002282294E30`", correct: false}
      - {text: "`9223372036854775807`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`1267650600228229401496703205376` : `BigInteger` affiche tous ses chiffres, sans notation scientifique ni débordement."
    check:
      output: "1267650600228229401496703205376"
  - key: code-factorielle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      BigInteger f = BigInteger.ONE;
      for (int i = 2; i <= 25; i++) {
          f = f.multiply(BigInteger.valueOf(i));
      }
      System.out.println(f);
      ```
    choices:
      - {text: "`15511210043330985984000000`", correct: true}
      - {text: "`7034535277573963776`", correct: false}
      - {text: "`1.5511210043330986E25`", correct: false}
      - {text: "Une `ArithmeticException`", correct: false}
    answer: "`15511210043330985984000000` : 25!, bien au-delà d'un `long` (qui, en débordant, aurait donné `7034535277573963776`)."
    check:
      output: "15511210043330985984000000"
  - key: code-pgcd-premier
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(BigInteger.valueOf(48).gcd(BigInteger.valueOf(18)) + " " + BigInteger.valueOf(17).isProbablePrime(20));
      ```
    choices:
      - {text: "`6 true`", correct: true}
      - {text: "`6 false`", correct: false}
      - {text: "`3 true`", correct: false}
      - {text: "`2 true`", correct: false}
    answer: "`6 true` : le PGCD de 48 et 18 est 6, et 17 est premier (`isProbablePrime` ne se trompe jamais sur un nombre premier)."
    check:
      output: "6 true"
  - key: code-immuable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      BigInteger a = BigInteger.ONE;
      a.add(BigInteger.ONE);
      BigInteger b = a.add(BigInteger.ONE);
      System.out.println(a + " " + b);
      ```
    choices:
      - {text: "`1 2`", correct: true}
      - {text: "`2 3`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`1 3`", correct: false}
    answer: '`1 2` : `add` ne modifie pas `a`.'
    check:
      output: "1 2"
  - key: bug-resultat-ignore
    format: bug-fix
    question: |-
      Cette factorielle vaut toujours 1 :
      ```java
      BigInteger f = BigInteger.ONE;
      for (int i = 2; i <= n; i++) {
          f.multiply(BigInteger.valueOf(i));
      }
      ```
      Pourquoi ?
    choices:
      - {text: "`BigInteger` est immuable : `multiply` renvoie un nouvel objet, ignoré ici", correct: true}
      - {text: "`BigInteger.ONE` est une constante partagée : la multiplier ne change rien", correct: false}
      - {text: "`BigInteger.valueOf(i)` renvoie l'objet en cache de 1 pour les petites valeurs", correct: false}
      - {text: "Le compilateur supprime l'appel, faute d'effet de bord visible dans la boucle", correct: false}
    answer: "`BigInteger` est immuable : il faut réaffecter le résultat, `f = f.multiply(BigInteger.valueOf(i));`."
  - key: bug-factorielle-long
    format: bug-fix
    question: |-
      `factorielle(25)` renvoie une valeur négative :
      ```java
      static long factorielle(int n) {
          long f = 1;
          for (int i = 2; i <= n; i++) f *= i;
          return f;
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Calculer et renvoyer un `BigInteger` : un `long` déborde en silence dès 21!", correct: true}
      - {text: "Déclarer `f` en `double`, qui ne déborde jamais et garde tous les chiffres", correct: false}
      - {text: "Multiplier avec `Math.multiplyExact`, qui donne le bon résultat en `long`", correct: false}
      - {text: "Déclarer `f` en `Long`, dont la capacité s'agrandit selon les besoins", correct: false}
    answer: |-
      ```java
      static BigInteger factorielle(int n) {
          BigInteger f = BigInteger.ONE;
          for (int i = 2; i <= n; i++) f = f.multiply(BigInteger.valueOf(i));
          return f;
      }
      ```
      21! dépasse déjà un `long`, qui déborde en silence. `BigInteger` ne déborde jamais.
  - key: bug-calcul-avant
    format: bug-fix
    question: |-
      Ce `BigInteger` vaut `-9223372036854775808` :
      ```java
      BigInteger suivant = BigInteger.valueOf(Long.MAX_VALUE + 1);
      ```
      Pourquoi ?
    choices:
      - {text: "L'addition déborde en `long` avant que `valueOf` ne crée le `BigInteger`", correct: true}
      - {text: "`valueOf` met en cache les grandes valeurs et renvoie la mauvaise instance", correct: false}
      - {text: "`BigInteger` ne sait pas représenter une valeur au-delà de `Long.MAX_VALUE`", correct: false}
      - {text: "`Long.MAX_VALUE + 1` est converti en `int` avant l'appel à `valueOf`", correct: false}
    answer: |-
      ```java
      BigInteger suivant = BigInteger.valueOf(Long.MAX_VALUE).add(BigInteger.ONE);
      ```
      L'addition se fait en `long`, où elle déborde, avant la conversion. Le calcul doit se faire en `BigInteger`.
  - key: bug-egal-egal
    format: bug-fix
    question: |-
      Ce test de signature échoue toujours :
      ```java
      if (calculee == attendue) {   // deux BigInteger
          accepter();
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if (calculee.equals(attendue))`", correct: true}
      - {text: "`if (calculee.intValue() == attendue.intValue())`", correct: false}
      - {text: "`if (calculee.toString() == attendue.toString())`", correct: false}
      - {text: "`if (calculee.hashCode() == attendue.hashCode())`", correct: false}
    answer: "`==` compare les références de deux objets distincts ; `equals` (ou `compareTo(...) == 0`) compare les valeurs. `intValue()` tronque, et deux nombres différents peuvent avoir le même `hashCode`."
