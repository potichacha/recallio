notion: math-classe
lesson: |-
  `java.lang.Math` regroupe les fonctions mathématiques, toutes `static` :

  | Méthode | Exemple | Résultat |
  |---|---|---|
  | `abs`, `max`, `min` | `Math.max(3, 7)` | `7` |
  | `pow`, `sqrt`, `cbrt`, `hypot` | `Math.pow(2, 10)` | `1024.0` (un `double`) |
  | `floor`, `ceil` | `Math.floor(-2.5)` | `-3.0` (vers -∞) |
  | `round` | `Math.round(2.5)` | `3` (un `long`) ; `Math.round(-2.5)` → `-2` |
  | `floorDiv`, `floorMod` | `Math.floorMod(-7, 3)` | `2` (toujours du signe du diviseur) |
  | `addExact`, `multiplyExact`... | `Math.addExact(a, b)` | exception en cas de débordement |
  | `random()` | | un `double` dans [0, 1) |

  - `round` arrondit au plus proche, et les `.5` **vers +∞** : `-2.5` donne `-2`. Pour un arrondi financier, on utilise
    `BigDecimal` et un `RoundingMode` explicite.
  - L'opérateur `%` garde le signe du dividende : `-7 % 3` vaut `-1`. Pour un indice (une case de table de hachage),
    `Math.floorMod` donne toujours un résultat entre 0 et le diviseur.
  - `Math.abs(Integer.MIN_VALUE)` reste négatif (débordement).
  - `StrictMath` garantit des résultats identiques bit à bit sur toutes les plateformes ; `Math` peut utiliser des
    instructions plus rapides du processeur.
  - Les `double` ne sont pas exacts : `0.1 + 0.2 == 0.3` est faux. On compare avec une tolérance.

  **Piège classique** : `Math.round(prix * 100) / 100` pour arrondir au centime. `round` renvoie un `long`, et la
  division entière perd les décimales : il faut `/ 100.0` (ou mieux, `BigDecimal`).

  **En entretien** : « `round` arrondit les .5 vers +∞, `%` garde le signe du dividende, `floorMod` pour un indice ; et
  jamais d'égalité stricte sur des `double`. »
tour:
  - title: La classe Math
    text: |-
      `Math` regroupe les fonctions mathématiques : `abs`, `max`, `min`, `pow`, `sqrt`, `round`, `floor`, `ceil`, et les
      constantes `PI` et `E`.

      Les entiers débordent en silence : `Integer.MAX_VALUE + 1` devient négatif. Quand un débordement serait un bug, on
      utilise les opérations **exactes**, `Math.addExact` ou `multiplyExact`, qui lèvent une `ArithmeticException` au
      lieu de tricher.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println(Math.abs(-7) + " " + Math.max(3, 9) + " " + Math.pow(2, 10) + " " + Math.sqrt(16));
              IO.println(Math.round(2.5) + " " + Math.floor(2.7) + " " + Math.ceil(2.1));
              IO.println(Integer.MAX_VALUE + 1);
              try {
                  Math.addExact(Integer.MAX_VALUE, 1);
              } catch (ArithmeticException e) {
                  IO.println(e.getMessage());
              }
          }
      output: |-
        7 9 1024.0 4.0
        3 2.0 3.0
        -2147483648
        integer overflow
cards:
  - key: vaut-math-round-2-5
    format: course
    question: Que vaut `Math.round(-2.5)` ?
    answer: "-2 (arrondi vers +∞ pour les .5)."
  - key: floor-mod
    format: course
    question: Quelle différence entre `-7 % 3` et `Math.floorMod(-7, 3)` ?
    answer: '`%` garde le signe du dividende (`-1`) ; `floorMod` donne un résultat du signe du diviseur (`2`), utile pour calculer un indice.'
  - key: double-egalite
    format: course
    question: Pourquoi `0.1 + 0.2 == 0.3` vaut-il `false` ?
    answer: 0,1 et 0,2 n'ont pas de représentation binaire exacte ; la somme vaut `0.30000000000000004`. On compare avec une tolérance (`Math.abs(a - b) < 1e-9`).
  - key: strict-math
    format: course
    question: Quelle différence entre `Math` et `StrictMath` ?
    answer: '`StrictMath` donne des résultats identiques bit à bit sur toutes les plateformes ; `Math` peut utiliser des implémentations plus rapides propres au processeur.'
  - key: vf-pow-int
    format: true-false
    question: "`Math.pow(2, 3)` renvoie l'`int` 8."
    truth: false
    answer: Il renvoie le `double` 8.0.
  - key: vf-floor-negatif
    format: true-false
    question: "`Math.floor(-2.5)` vaut -2.0."
    truth: false
    answer: '`floor` arrondit vers -∞ : -3.0.'
  - key: vf-round-long
    format: true-false
    question: "`Math.round(2.5)` renvoie un `long`."
    truth: true
    answer: Pour un argument `double`, `round` renvoie un `long` (pour un `float`, un `int`).
  - key: vf-random
    format: true-false
    question: "`Math.random()` peut renvoyer 1.0."
    truth: false
    answer: Il renvoie un `double` dans [0, 1), 1 exclu.
  - key: qcm-round
    format: multiple-choice
    question: "Que valent `Math.round(2.5)` et `Math.round(-2.5)` ?"
    choices:
      - text: "`3` et `-2`"
        correct: true
      - text: "`3` et `-3`"
        correct: false
      - text: "`2` et `-2`"
        correct: false
      - text: "`2` et `-3`"
        correct: false
    answer: Les .5 sont arrondis vers +∞.
  - key: qcm-indice
    format: multiple-choice
    question: Comment calculer un indice entre 0 et `n - 1` à partir d'un `hash` qui peut être négatif ?
    choices:
      - text: "`Math.floorMod(hash, n)`"
        correct: true
      - text: "`hash % n`"
        correct: false
      - text: "`Math.abs(hash) % n`"
        correct: false
      - text: "`Math.abs(hash % n) - 1`"
        correct: false
    answer: '`hash % n` peut être négatif, et `Math.abs(Integer.MIN_VALUE)` aussi.'
  - key: qcm-comparer-double
    format: multiple-choice
    question: Comment tester qu'un `double` calculé vaut 0,3 ?
    choices:
      - text: "`Math.abs(x - 0.3) < 1e-9`"
        correct: true
      - text: "`x == 0.3`"
        correct: false
      - text: "`x.equals(0.3)`"
        correct: false
      - text: "`(int) x == 0.3`"
        correct: false
    answer: Une égalité stricte échoue à cause des erreurs d'arrondi binaires.
  - key: qcm-exact
    format: multiple-choice
    question: Quelle méthode lève une exception plutôt que de déborder ?
    choices:
      - text: "`Math.multiplyExact(a, b)`"
        correct: true
      - text: "`Math.max(a, b)`"
        correct: false
      - text: "`Math.pow(a, b)`"
        correct: false
      - text: "`Math.floorDiv(a, b)`"
        correct: false
    answer: Les méthodes `*Exact` signalent le débordement par une `ArithmeticException`.
  - key: code-math-round-2-5-math
    format: code-output
    question: '`Math.round(-2.5)`, `Math.round(2.5)`, `Math.round(-2.6)` ?'
    answer: '`-2`, `3`, `-3` (arrondi vers +∞ à .5).'
    check:
      code: |-
        System.out.println(Math.round(-2.5) + " " + Math.round(2.5) + " " + Math.round(-2.6));
      output: "-2 3 -3"
  - key: code-floor-ceil
    format: code-output
    question: |-
      ```java
      System.out.println(Math.floor(-2.5) + " " + Math.ceil(-2.5) + " " + Math.abs(-3));
      ```
    answer: '`-3.0 -2.0 3`.'
    check:
      output: "-3.0 -2.0 3"
  - key: code-modulo
    format: code-output
    question: |-
      ```java
      System.out.println((-7 % 3) + " " + Math.floorMod(-7, 3) + " " + Math.floorDiv(-7, 2));
      ```
    answer: '`-1 2 -4` : `floorDiv` arrondit vers -∞, et `floorMod` suit le signe du diviseur.'
    check:
      output: "-1 2 -4"
  - key: code-pow
    format: code-output
    question: |-
      ```java
      System.out.println(Math.pow(2, 10) + " " + Math.sqrt(16) + " " + (0.1 + 0.2));
      ```
    answer: '`1024.0 4.0 0.30000000000000004`.'
    check:
      output: "1024.0 4.0 0.30000000000000004"
  - key: bug-indice-negatif
    format: bug-fix
    question: |-
      Cette table de hachage maison lève parfois une `ArrayIndexOutOfBoundsException` :
      ```java
      int indice = cle.hashCode() % cases.length;
      ```
    answer: |-
      ```java
      int indice = Math.floorMod(cle.hashCode(), cases.length);
      ```
      Un `hashCode` peut être négatif, et `%` garde le signe du dividende. `floorMod` donne toujours un indice valide.
  - key: bug-arrondi-centime
    format: bug-fix
    question: |-
      Ce prix arrondi au centime perd ses décimales (`12.0` au lieu de `12.35`) :
      ```java
      double arrondi = Math.round(prix * 100) / 100;
      ```
    answer: |-
      ```java
      double arrondi = Math.round(prix * 100) / 100.0;
      // pour un montant : new BigDecimal(String.valueOf(prix)).setScale(2, RoundingMode.HALF_UP)
      ```
      `Math.round` renvoie un `long` : divisé par l'`int` 100, c'est une division entière. Avec `100.0`, la division est
      décimale (et pour de l'argent, `BigDecimal` évite les surprises binaires).
  - key: bug-abs-min
    format: bug-fix
    question: |-
      Une fois sur quatre milliards, ce choix de serveur plante :
      ```java
      int numero = Math.abs(requete.hashCode()) % serveurs.size();
      ```
    answer: |-
      ```java
      int numero = Math.floorMod(requete.hashCode(), serveurs.size());
      ```
      `Math.abs(Integer.MIN_VALUE)` reste négatif, donc l'indice aussi. `floorMod` n'a pas ce cas particulier.
  - key: bug-egalite-double
    format: bug-fix
    question: |-
      Ce test échoue alors que le calcul est juste :
      ```java
      assertTrue(calculer() == 0.3);   // calculer() renvoie 0.1 + 0.2
      ```
    answer: |-
      ```java
      assertEquals(0.3, calculer(), 1e-9);
      ```
      Un `double` n'est pas exact : `0.1 + 0.2` vaut `0.30000000000000004`. On compare avec une tolérance.
