notion: assertj
lesson: |-
  **AssertJ** propose des assertions **fluides** : on part de la valeur testée, `assertThat(valeur)`, puis on enchaîne les
  vérifications adaptées à son type. Les messages d'échec sont détaillés.

  ```java
  import static org.assertj.core.api.Assertions.*;

  assertThat(total).isEqualTo(380);
  assertThat(nom).isNotBlank().startsWith("Ada").hasSize(12);
  assertThat(montant).isBetween(BigDecimal.ZERO, BigDecimal.TEN);
  assertThat(date).isAfter(hier).isBeforeOrEqualTo(aujourdhui);

  assertThat(villes).hasSize(3).contains("Paris").doesNotContain("Lyon");
  assertThat(villes).containsExactly("Lille", "Nantes", "Paris");          // ordre compris
  assertThat(villes).containsExactlyInAnyOrder("Paris", "Lille", "Nantes");

  assertThat(commandes)
          .extracting(Commande::client, Commande::total)
          .containsExactly(tuple("ada", 120), tuple("bob", 80));

  assertThat(resultat).isPresent().get().extracting(Client::nom).isEqualTo("Ada");   // Optional
  assertThat(map).containsEntry("fr", 3).doesNotContainKey("de");

  assertThatThrownBy(() -> compte.retirer(150))
          .isInstanceOf(SoldeInsuffisantException.class)
          .hasMessageContaining("insuffisant");

  assertThat(commande).usingRecursiveComparison().ignoringFields("id").isEqualTo(attendue);

  SoftAssertions.assertSoftly(s -> {                                       // toutes les erreurs ensemble
      s.assertThat(client.nom()).isEqualTo("Ada");
      s.assertThat(client.email()).endsWith("@exemple.org");
  });
  ```

  - L'ordre est naturel : la valeur testée d'abord, l'attendu dans la vérification ; pas de risque d'inverser comme avec
    `assertEquals`.
  - Les assertions sur les **collections** (`containsExactly`, `extracting`, `filteredOn`, `allSatisfy`) remplacent des
    boucles de vérification.
  - `usingRecursiveComparison()` compare deux objets champ par champ, sans `equals`.
  - `as("description")` ajoute du contexte au message d'échec.

  **Piège classique** : `assertThat(liste.contains("x"))` sans terminer. Cela compile, mais ne vérifie rien : il faut
  `assertThat(liste).contains("x")` (ou `.isTrue()`), sinon l'assertion n'est jamais évaluée.

  **En entretien** : « `assertThat(valeur)` puis des vérifications chaînées adaptées au type, très lisibles sur les
  collections et les exceptions, avec des messages d'échec précis. »
cards:
  - key: principe
    format: course
    question: Quel est le principe des assertions AssertJ ?
    answer: Partir de la valeur testée avec `assertThat(valeur)` et enchaîner des vérifications fluides adaptées à son type, avec des messages d'échec détaillés.
  - key: contains-exactly
    format: course
    question: Quelle différence entre `contains`, `containsExactly` et `containsExactlyInAnyOrder` ?
    answer: '`contains` vérifie la présence de certains éléments ; `containsExactly` exige tous les éléments, et eux seuls, dans l''ordre ; `containsExactlyInAnyOrder` les mêmes éléments, dans n''importe quel ordre.'
  - key: extracting
    format: course
    question: À quoi sert `extracting` ?
    answer: À extraire une ou plusieurs propriétés de chaque élément d'une collection pour les vérifier, par exemple `extracting(Commande::client).containsExactly("ada", "bob")`.
  - key: soft
    format: course
    question: Que sont les soft assertions ?
    answer: Des assertions qui ne s'arrêtent pas au premier échec et rapportent toutes les erreurs ensemble à la fin (`SoftAssertions.assertSoftly`).
  - key: vf-ordre
    format: true-false
    question: Avec AssertJ, on écrit `assertThat(valeurObtenue).isEqualTo(attendue)`.
    truth: true
    answer: La valeur testée d'abord, l'attendu dans la vérification.
  - key: vf-sans-verification
    format: true-false
    question: "`assertThat(liste.isEmpty());` seul vérifie que la liste est vide."
    truth: false
    answer: Sans vérification chaînée (`.isTrue()`), rien n'est vérifié.
  - key: vf-recursive
    format: true-false
    question: "`usingRecursiveComparison()` compare deux objets champ par champ, même sans `equals`."
    truth: true
    answer: On peut ignorer certains champs, comme un identifiant généré.
  - key: vf-exception
    format: true-false
    question: AssertJ permet de vérifier une exception et son message en une chaîne.
    truth: true
    answer: Avec `assertThatThrownBy(...).isInstanceOf(...).hasMessageContaining(...)`.
  - key: qcm-collections
    format: multiple-choice
    question: "La liste vaut `[\"b\", \"a\"]`. Quelles assertions réussissent ?"
    choices:
      - text: "`assertThat(l).containsExactlyInAnyOrder(\"a\", \"b\")`"
        correct: true
      - text: "`assertThat(l).contains(\"a\")`"
        correct: true
      - text: "`assertThat(l).containsExactly(\"a\", \"b\")`"
        correct: false
      - text: "`assertThat(l).hasSize(3)`"
        correct: false
    answer: '`containsExactly` vérifie aussi l''ordre.'
  - key: qcm-optional
    format: multiple-choice
    question: Comment vérifier un `Optional<Client>` qui doit contenir le client « Ada » ?
    choices:
      - text: "`assertThat(opt).isPresent().get().extracting(Client::nom).isEqualTo(\"Ada\")`"
        correct: true
      - text: "`assertThat(opt).hasValueSatisfying(c -> assertThat(c.nom()).isEqualTo(\"Ada\"))`"
        correct: true
      - text: "`assertThat(opt.get() == null)`"
        correct: false
      - text: "`assertEquals(opt, \"Ada\")`"
        correct: false
    answer: AssertJ a des assertions dédiées aux `Optional`.
  - key: qcm-message
    format: multiple-choice
    question: Comment ajouter du contexte au message d'échec ?
    choices:
      - text: "`assertThat(total).as(\"total du panier %s\", id).isEqualTo(380)`"
        correct: true
      - text: "`assertThat(total, \"message\")`"
        correct: false
      - text: "`assertThat(total).message(\"...\")`"
        correct: false
      - text: "Ce n'est pas possible"
        correct: false
    answer: '`as` doit précéder la vérification.'
  - key: qcm-tuple
    format: multiple-choice
    question: Comment vérifier le client et le total de chaque commande, dans l'ordre ?
    choices:
      - text: "`assertThat(commandes).extracting(Commande::client, Commande::total).containsExactly(tuple(\"ada\", 120), tuple(\"bob\", 80))`"
        correct: true
      - text: "Une boucle avec un `assertEquals` par champ, plus verbeuse"
        correct: false
      - text: "`assertThat(commandes).isEqualTo(\"ada 120 bob 80\")`"
        correct: false
      - text: "`assertThat(commandes).hasSize(2)` suffit"
        correct: false
    answer: '`extracting` à plusieurs propriétés produit des tuples.'
  - key: trous-assert-that
    format: fill-in
    question: |-
      Complétez :
      ```java
      ___(client.email()).endsWith("@exemple.org");
      ```
    blanks: [[assertThat]]
    answer: Le point d'entrée d'AssertJ.
  - key: trous-exactly
    format: fill-in
    question: |-
      Complétez pour vérifier les éléments et leur ordre :
      ```java
      assertThat(etapes).___("valider", "payer", "expédier");
      ```
    blanks: [[containsExactly]]
    answer: Tous les éléments, eux seuls, dans l'ordre.
  - key: trous-thrown
    format: fill-in
    question: |-
      Complétez :
      ```java
      assertThat___(() -> new Montant(-1)).isInstanceOf(IllegalArgumentException.class);
      ```
    blanks: [[ThrownBy]]
    answer: '`assertThatThrownBy`.'
  - key: trous-extracting
    format: fill-in
    question: |-
      Complétez pour vérifier les noms des clients :
      ```java
      assertThat(clients).___(Client::nom).containsExactly("Ada", "Bob");
      ```
    blanks: [[extracting]]
    answer: Une propriété extraite de chaque élément.
  - key: bug-assertion-orpheline
    format: bug-fix
    question: |-
      Ce test passe alors que la liste est vide :
      ```java
      assertThat(resultats.contains("rapport.pdf"));
      ```
    answer: |-
      ```java
      assertThat(resultats).contains("rapport.pdf");
      ```
      `assertThat(boolean)` sans vérification chaînée n'évalue rien. On passe la collection elle-même, puis la
      vérification.
  - key: bug-boucle
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      assertEquals(3, commandes.size());
      for (int i = 0; i < commandes.size(); i++) {
          assertEquals(attendus.get(i), commandes.get(i).client());
      }
      ```
    answer: |-
      ```java
      assertThat(commandes).extracting(Commande::client).containsExactlyElementsOf(attendus);
      ```
      Une seule assertion vérifie taille, contenu et ordre, avec un message qui montre les différences.
  - key: bug-equals-objet
    format: bug-fix
    question: |-
      Ce test échoue parce que l'identifiant généré diffère, alors que seul le contenu compte :
      ```java
      assertEquals(attendue, commandeCreee);
      ```
    answer: |-
      ```java
      assertThat(commandeCreee)
              .usingRecursiveComparison()
              .ignoringFields("id", "creeLe")
              .isEqualTo(attendue);
      ```
      La comparaison récursive vérifie les champs utiles et ignore ceux générés par le système.
  - key: bug-assertions-multiples
    format: bug-fix
    question: |-
      Il faut relancer ce test trois fois pour découvrir ses trois champs faux :
      ```java
      assertThat(dto.nom()).isEqualTo("Ada");
      assertThat(dto.email()).isEqualTo("ada@exemple.org");
      assertThat(dto.ville()).isEqualTo("Paris");
      ```
    answer: |-
      ```java
      SoftAssertions.assertSoftly(s -> {
          s.assertThat(dto.nom()).isEqualTo("Ada");
          s.assertThat(dto.email()).isEqualTo("ada@exemple.org");
          s.assertThat(dto.ville()).isEqualTo("Paris");
      });
      ```
      Les soft assertions rapportent toutes les erreurs en une exécution.
