notion: junit-bases
lesson: |-
  **JUnit** (Jupiter, versions 5 et 6) est le cadre de test standard en Java. Un test est une méthode annotée **`@Test`**
  qui vérifie un résultat avec des **assertions**.

  ```java
  import static org.junit.jupiter.api.Assertions.*;

  class PanierTest {

      private Panier panier;

      @BeforeEach
      void preparer() {                                  // avant CHAQUE test : un état neuf
          panier = new Panier();
      }

      @Test
      void totalEstLaSommeDesLignes() {
          // Arrange (Given)
          panier.ajouter(new Ligne("pomme", 2, 150));
          panier.ajouter(new Ligne("kiwi", 1, 80));
          // Act (When)
          int total = panier.total();
          // Assert (Then)
          assertEquals(380, total);
      }

      @Test
      void unPanierNeufEstVide() {
          assertTrue(panier.estVide());
          assertAll(() -> assertEquals(0, panier.total()),
                    () -> assertEquals(0, panier.nombreDeLignes()));
      }
  }
  ```

  - Les assertions principales : `assertEquals(attendu, obtenu)` (l'**attendu en premier**), `assertTrue`,
    `assertFalse`, `assertNull`, `assertNotNull`, `assertSame`, `assertThrows`, `assertAll` (toutes les vérifications,
    même si l'une échoue), `assertTimeout`.
  - Le cycle de vie : `@BeforeEach` / `@AfterEach` autour de **chaque** test ; `@BeforeAll` / `@AfterAll` **une fois** pour la
    classe (méthodes `static`, sauf `@TestInstance(PER_CLASS)`).
  - JUnit crée une **nouvelle instance** de la classe de test **par méthode** : les champs ne fuient pas d'un test à
    l'autre.
  - `@Disabled("raison")` désactive un test ; les méthodes et classes de test n'ont pas besoin d'être `public`.
  - La structure **Arrange-Act-Assert** (ou *Given-When-Then*) rend chaque test lisible : préparer, agir, vérifier.
  - JUnit 6 garde l'API Jupiter, impose Java 17 et unifie les numéros de version de ses modules.

  **Piège classique** : inverser les arguments de `assertEquals(total, 380)`. Le test marche, mais en cas d'échec le message
  annonce « expected: <le résultat> but was: <380> », ce qui égare le diagnostic.

  **En entretien** : « `@Test` et des assertions, l'attendu en premier ; `@BeforeEach` pour un état neuf à chaque test, une
  instance par méthode ; et une structure Arrange-Act-Assert avec un nom qui dit le comportement. »
tour:
  - title: JUnit
    text: |-
      **JUnit** est la bibliothèque de tests de Java. Une classe de test contient des méthodes annotées `@Test`, et
      chacune vérifie un comportement avec des **assertions** : `assertEquals(attendu, obtenu)`, `assertTrue`,
      `assertNull`… Une assertion fausse fait échouer le test.

      ```java
      class PanierTest {
          private Panier panier;

          @BeforeEach
          void creePanier() {
              panier = new Panier();
          }

          @Test
          void shouldAddTheItemsPrices() {
              panier.ajoute(12);
              panier.ajoute(8);
              assertEquals(20, panier.total());
          }
      }
      ```

      `@BeforeEach` s'exécute avant chaque test : chacun part d'un état neuf. Le bac à sable du Tour n'exécute que
      `main` : ce programme reproduit le test sans JUnit.
    example:
      files:
        Main.java: |-
          class Panier {
              private int total;

              void ajoute(int prix) {
                  total += prix;
              }

              int total() {
                  return total;
              }
          }

          void assertEquals(int attendu, int obtenu) {
              if (attendu != obtenu) {
                  throw new AssertionError("attendu " + attendu + " mais obtenu " + obtenu);
              }
          }

          void main() {
              Panier panier = new Panier();
              panier.ajoute(12);
              panier.ajoute(8);
              assertEquals(20, panier.total());
              IO.println("shouldAddTheItemsPrices : ok");
          }
      output: |-
        shouldAddTheItemsPrices : ok
cards:
  - key: junit-5-vs-junit-6
    format: course
    question: "Qu'est-ce qui change entre JUnit 5 et JUnit 6 ?"
    choices:
      - {text: "La même API Jupiter ; JUnit 6 impose Java 17 et unifie les versions", correct: true}
      - {text: "Une nouvelle API : toutes les annotations de JUnit 5 sont renommées", correct: false}
      - {text: "JUnit 6 retire `@Test`, au profit de méthodes nommées `test...`", correct: false}
      - {text: "JUnit 6 abandonne ses assertions, remplacées par celles d'AssertJ", correct: false}
    answer: "La même API Jupiter : les tests ne changent pas. JUnit 6 impose Java 17, unifie les numéros de version de ses modules et retire d'anciens modules dépréciés."
  - key: beforeeach-vs-beforeall
    format: course
    question: "Quelle différence entre `@BeforeEach` et `@BeforeAll` ?"
    choices:
      - {text: "Avant chaque test, contre une fois pour la classe (méthode `static` par défaut)", correct: true}
      - {text: "Une fois pour la classe, contre avant chaque test de la classe", correct: false}
      - {text: "Avant chaque test de la classe, contre avant chaque test de toute la suite", correct: false}
      - {text: "Avant les tests unitaires, contre avant les tests d'intégration", correct: false}
    answer: "`@BeforeEach` s'exécute avant chaque test ; `@BeforeAll`, une seule fois pour la classe, sur une méthode `static` (sauf avec `@TestInstance(PER_CLASS)`)."
  - key: junit-cree-instance-classe-test-methode
    format: course
    question: JUnit crée-t-il une instance de la classe de test par méthode ?
    choices:
      - {text: "Oui, par défaut, sauf avec `@TestInstance(PER_CLASS)`", correct: true}
      - {text: "Non : une seule instance sert à tous les tests de la classe", correct: false}
      - {text: "Oui, mais seulement pour les classes annotées `@Nested`", correct: false}
      - {text: "Non : les méthodes de test sont appelées comme des méthodes `static`", correct: false}
    answer: "Oui par défaut : chaque test part d'une instance neuve, ce qui évite qu'un champ d'instance fuie d'un test à l'autre. `@TestInstance(PER_CLASS)` partage une seule instance."
  - key: aaa
    format: course
    question: Qu'est-ce que la structure Arrange-Act-Assert ?
    choices:
      - {text: "Préparer les données, exécuter l'action testée, puis vérifier le résultat", correct: true}
      - {text: "Écrire l'assertion, puis l'action, puis préparer les données", correct: false}
      - {text: "Exécuter l'action, vérifier le résultat, puis nettoyer les données", correct: false}
      - {text: "Annoter la classe, ajouter les assertions, puis automatiser le test", correct: false}
    answer: "Organiser un test en trois temps : préparer les données (Arrange, ou Given), exécuter l'action testée (Act, When), puis vérifier le résultat (Assert, Then)."
  - key: assert-all
    format: course
    question: "À quoi sert `assertAll` de JUnit ?"
    choices:
      - {text: "À exécuter plusieurs assertions et à rapporter tous leurs échecs ensemble", correct: true}
      - {text: "À vérifier que toutes les méthodes de la classe sont bien testées", correct: false}
      - {text: "À lancer tous les tests de la classe en une seule exécution", correct: false}
      - {text: "À vérifier que tous les éléments d'une liste sont égaux entre eux", correct: false}
    answer: À exécuter plusieurs assertions et à rapporter tous leurs échecs ensemble, au lieu de s'arrêter à la première.
  - key: vf-ordre-args
    format: true-false
    question: "Dans `assertEquals`, la valeur attendue se place en premier."
    truth: true
    answer: Le message d'échec annonce « expected » puis « but was ».
  - key: vf-public
    format: true-false
    question: Avec JUnit Jupiter, une méthode de test doit être `public`.
    truth: false
    answer: La visibilité package suffit.
  - key: vf-champs-partages
    format: true-false
    question: Par défaut, un champ modifié par un test garde sa valeur pour le test suivant.
    truth: false
    answer: JUnit crée une nouvelle instance de la classe pour chaque méthode.
  - key: vf-before-all-static
    format: true-false
    question: Par défaut, une méthode `@BeforeAll` doit être `static`.
    truth: true
    answer: Sauf avec `@TestInstance(Lifecycle.PER_CLASS)`.
  - key: qcm-cycle
    format: multiple-choice
    question: Quelles annotations s'exécutent autour de chaque test ?
    choices:
      - text: "`@BeforeEach`"
        correct: true
      - text: "`@AfterEach`"
        correct: true
      - text: "`@BeforeAll`"
        correct: false
      - text: "`@AfterAll`"
        correct: false
    answer: '`@BeforeAll` et `@AfterAll` ne s''exécutent qu''une fois par classe.'
  - key: qcm-assertions
    format: multiple-choice
    question: Lesquelles sont des assertions de JUnit ?
    choices:
      - text: "`assertEquals`"
        correct: true
      - text: "`assertThrows`"
        correct: true
      - text: "`assertThat` dans `org.junit.jupiter.api.Assertions`"
        correct: false
      - text: "`assertFaster`"
        correct: false
    answer: '`assertThat` vient d''AssertJ (ou de Hamcrest).'
  - key: qcm-desactiver
    format: multiple-choice
    question: Comment désactiver temporairement un test en expliquant pourquoi ?
    choices:
      - text: "`@Disabled(\"en attente du correctif #42\")`"
        correct: true
      - text: "Commenter tout le test"
        correct: false
      - text: "Supprimer ses assertions"
        correct: false
      - text: "Le rendre `private`"
        correct: false
    answer: Le test reste visible dans les rapports, avec sa raison.
  - key: qcm-nom
    format: multiple-choice
    question: Quel nom de test est le plus utile ?
    choices:
      - {text: "`refuseUnRetraitSuperieurAuSolde`", correct: true}
      - {text: "`testRetraitAvecUnMontant`", correct: false}
      - {text: "`verifieLaMethodeRetirer`", correct: false}
      - {text: "`testRetraitOk`", correct: false}
    answer: "Il dit le comportement attendu et son contexte : un échec désigne directement ce qui est cassé. Les autres nomment la méthode testée, sans dire ce qu'on attend d'elle."
  - key: trous-test
    format: fill-in
    question: |-
      Complète pour déclarer un test :
      ```java
      @___
      void calculeLaRemise() { ... }
      ```
    blanks: [[Test]]
    answer: '`org.junit.jupiter.api.Test`.'
  - key: trous-before
    format: fill-in
    question: |-
      Complète pour préparer un état neuf avant chaque test :
      ```java
      @___
      void preparer() { stock = new Stock(); }
      ```
    blanks: [[BeforeEach]]
    answer: Exécutée avant chaque méthode de test.
  - key: trous-equals
    format: fill-in
    question: |-
      Complète l'assertion :
      ```java
      assertEquals(___, panier.total());
      ```
      (le total attendu est 380)
    blanks: [["380"]]
    answer: L'attendu en premier, le résultat ensuite.
  - key: trous-all
    format: fill-in
    question: |-
      Complète pour vérifier deux propriétés et voir tous les échecs :
      ```java
      ___(() -> assertEquals("Ada", client.nom()),
          () -> assertEquals("ada@exemple.org", client.email()));
      ```
    blanks: [[assertAll]]
    answer: Les deux assertions sont évaluées.
  - key: bug-ordre
    format: bug-fix
    question: |-
      En cas d'échec, le message de ce test induit en erreur. Quelle correction est la bonne ?
      ```java
      assertEquals(facture.montantTtc(), 120);
      ```
    choices:
      - {text: "`assertEquals(120, facture.montantTtc());`", correct: true}
      - {text: "`assertSame(facture.montantTtc(), 120);`", correct: false}
      - {text: "`assertEquals(facture.montantTtc(), 120, \"attendu\");`", correct: false}
      - {text: "`assertTrue(facture.montantTtc() == 120);`", correct: false}
    answer: |-
      ```java
      assertEquals(120, facture.montantTtc());
      ```
      L'attendu va en premier : le message d'échec dit alors « expected: <120> but was: <...> ».
  - key: bug-etat-statique
    format: bug-fix
    question: |-
      Ces tests passent seuls mais échouent ensemble, selon l'ordre. Pourquoi ?
      ```java
      class CompteurTest {
          static Compteur compteur = new Compteur();
          @Test void incremente() { compteur.incrementer(); assertEquals(1, compteur.valeur()); }
          @Test void demarreAZero() { assertEquals(0, compteur.valeur()); }
      }
      ```
    choices:
      - {text: "Le champ `static` partage le compteur entre les tests : il faut un état neuf par test", correct: true}
      - {text: "JUnit lance les tests en parallèle par défaut : il faut `@Execution(SAME_THREAD)`", correct: false}
      - {text: "`demarreAZero` doit passer en premier : il faut l'annoter `@Order(1)`", correct: false}
      - {text: "`assertEquals` compare des références : il faut `assertSame` sur des `int`", correct: false}
    answer: |-
      ```java
      class CompteurTest {
          private Compteur compteur;
          @BeforeEach void preparer() { compteur = new Compteur(); }
          @Test void incremente() { compteur.incrementer(); assertEquals(1, compteur.valeur()); }
          @Test void demarreAZero() { assertEquals(0, compteur.valeur()); }
      }
      ```
      Le champ `static` partageait l'état entre les tests. Un état neuf par test les rend indépendants.
  - key: bug-sans-assertion
    format: bug-fix
    question: |-
      Ce test passe toujours, même si le calcul est faux. Quelle correction est la bonne ?
      ```java
      @Test
      void calculeLaTva() {
          Facture f = new Facture(100);
          f.montantTtc();
      }
      ```
    choices:
      - {text: "Comparer le résultat à l'attendu : `assertEquals(120, f.montantTtc())`", correct: true}
      - {text: "Ajouter `assertDoesNotThrow(() -> f.montantTtc())` dans le test", correct: false}
      - {text: "Ajouter `assertNotNull(f.montantTtc())` à la fin du test", correct: false}
      - {text: "Annoter le test `@Timeout(1)` pour qu'il échoue s'il est lent", correct: false}
    answer: |-
      ```java
      @Test
      void calculeLaTvaAVingtPourCent() {
          Facture f = new Facture(100);
          assertEquals(120, f.montantTtc());
      }
      ```
      Un test sans assertion ne vérifie que l'absence d'exception. Il doit comparer le résultat à l'attendu.
  - key: bug-trop-de-choses
    format: bug-fix
    question: |-
      Quand ce test échoue, on ne sait pas quel comportement est cassé. Quelle correction est la bonne ?
      ```java
      @Test
      void testPanier() {
          panier.ajouter(pomme); assertEquals(1, panier.nombreDeLignes());
          panier.retirer(pomme); assertTrue(panier.estVide());
          panier.ajouter(kiwi); panier.vider(); assertEquals(0, panier.total());
      }
      ```
    choices:
      - {text: "Un test par comportement, nommé d'après lui", correct: true}
      - {text: "Ajouter un message à chacune des assertions", correct: false}
      - {text: "Renommer le test en `testPanierComplet`", correct: false}
      - {text: "Ajouter `@DisplayName(\"panier\")` au test", correct: false}
    answer: |-
      ```java
      @Test void ajouterUnArticleCreeUneLigne() { panier.ajouter(pomme); assertEquals(1, panier.nombreDeLignes()); }
      @Test void retirerLeDernierArticleVideLePanier() { panier.ajouter(pomme); panier.retirer(pomme); assertTrue(panier.estVide()); }
      @Test void viderRemetLeTotalAZero() { panier.ajouter(kiwi); panier.vider(); assertEquals(0, panier.total()); }
      ```
      Un test par comportement, nommé d'après lui : un échec désigne directement ce qui est cassé.
