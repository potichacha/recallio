notion: junit-bases
cards:
  - key: junit-5-vs-junit-6
    format: course
    question: JUnit 5 vs JUnit 6 ?
    answer: Même API Jupiter ; JUnit 6 impose Java 17, unifie les versions et retire d'anciens modules.
  - key: beforeeach-vs-beforeall
    format: course
    question: '@BeforeEach vs @BeforeAll ?'
    answer: Avant chaque test vs une fois pour la classe (méthode static par défaut).
  - key: junit-cree-instance-classe-test-methode
    format: course
    question: JUnit crée-t-il une instance de la classe de test par méthode ?
    answer: Oui par défaut, sauf @TestInstance(PER_CLASS).
