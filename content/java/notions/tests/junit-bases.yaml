notion: junit-bases
lesson: |-
  **JUnit** (Jupiter, versions 5 et 6) est le cadre de test standard en Java. Un test est une méthode annotée **`@Test`**
  qui vérifie un résultat avec des **assertions**.

  ```java
  import static org.junit.jupiter.api.Assertions.*;

  class PanierTest {

      private Panier panier;

      @BeforeEach
      void preparer() {                                  // avant CHAQUE test : un état neuf
          panier = new Panier();
      }

      @Test
      void totalEstLaSommeDesLignes() {
          // Arrange (Given)
          panier.ajouter(new Ligne("pomme", 2, 150));
          panier.ajouter(new Ligne("kiwi", 1, 80));
          // Act (When)
          int total = panier.total();
          // Assert (Then)
          assertEquals(380, total);
      }

      @Test
      void unPanierNeufEstVide() {
          assertTrue(panier.estVide());
          assertAll(() -> assertEquals(0, panier.total()),
                    () -> assertEquals(0, panier.nombreDeLignes()));
      }
  }
  ```

  - Les assertions principales : `assertEquals(attendu, obtenu)` (l'**attendu en premier**), `assertTrue`,
    `assertFalse`, `assertNull`, `assertNotNull`, `assertSame`, `assertThrows`, `assertAll` (toutes les vérifications,
    même si l'une échoue), `assertTimeout`.
  - Le cycle de vie : `@BeforeEach` / `@AfterEach` autour de **chaque** test ; `@BeforeAll` / `@AfterAll` **une fois** pour la
    classe (méthodes `static`, sauf `@TestInstance(PER_CLASS)`).
  - JUnit crée une **nouvelle instance** de la classe de test **par méthode** : les champs ne fuient pas d'un test à
    l'autre.
  - `@Disabled("raison")` désactive un test ; les méthodes et classes de test n'ont pas besoin d'être `public`.
  - La structure **Arrange-Act-Assert** (ou *Given-When-Then*) rend chaque test lisible : préparer, agir, vérifier.
  - JUnit 6 garde l'API Jupiter, impose Java 17 et unifie les numéros de version de ses modules.

  **Piège classique** : inverser les arguments de `assertEquals(total, 380)`. Le test marche, mais en cas d'échec le message
  annonce « expected: <le résultat> but was: <380> », ce qui égare le diagnostic.

  **En entretien** : « `@Test` et des assertions, l'attendu en premier ; `@BeforeEach` pour un état neuf à chaque test, une
  instance par méthode ; et une structure Arrange-Act-Assert avec un nom qui dit le comportement. »
tour:
  - title: JUnit
    text: |-
      **JUnit** est la bibliothèque de tests de Java. Une classe de test contient des méthodes annotées `@Test`, et
      chacune vérifie un comportement avec des **assertions** : `assertEquals(attendu, obtenu)`, `assertTrue`,
      `assertNull`… Une assertion fausse fait échouer le test.

      ```java
      class PanierTest {
          private Panier panier;

          @BeforeEach
          void creePanier() {
              panier = new Panier();
          }

          @Test
          void shouldAddTheItemsPrices() {
              panier.ajoute(12);
              panier.ajoute(8);
              assertEquals(20, panier.total());
          }
      }
      ```

      `@BeforeEach` s'exécute avant chaque test : chacun part d'un état neuf. Le bac à sable du Tour n'exécute que
      `main` : ce programme reproduit le test sans JUnit.
    example:
      files:
        Main.java: |-
          class Panier {
              private int total;

              void ajoute(int prix) {
                  total += prix;
              }

              int total() {
                  return total;
              }
          }

          void assertEquals(int attendu, int obtenu) {
              if (attendu != obtenu) {
                  throw new AssertionError("attendu " + attendu + " mais obtenu " + obtenu);
              }
          }

          void main() {
              Panier panier = new Panier();
              panier.ajoute(12);
              panier.ajoute(8);
              assertEquals(20, panier.total());
              IO.println("shouldAddTheItemsPrices : ok");
          }
      output: |-
        shouldAddTheItemsPrices : ok
cards:
  - key: junit-5-vs-junit-6
    format: course
    question: JUnit 5 vs JUnit 6 ?
    answer: Même API Jupiter ; JUnit 6 impose Java 17, unifie les versions et retire d'anciens modules.
  - key: beforeeach-vs-beforeall
    format: course
    question: '@BeforeEach vs @BeforeAll ?'
    answer: Avant chaque test vs une fois pour la classe (méthode static par défaut).
  - key: junit-cree-instance-classe-test-methode
    format: course
    question: JUnit crée-t-il une instance de la classe de test par méthode ?
    answer: Oui par défaut, sauf @TestInstance(PER_CLASS).
  - key: aaa
    format: course
    question: Qu'est-ce que la structure Arrange-Act-Assert ?
    answer: "Organiser un test en trois temps : préparer les données (Arrange, ou Given), exécuter l'action testée (Act, When), puis vérifier le résultat (Assert, Then)."
  - key: assert-all
    format: course
    question: À quoi sert `assertAll` ?
    answer: À exécuter plusieurs assertions et à rapporter tous leurs échecs ensemble, au lieu de s'arrêter à la première.
  - key: vf-ordre-args
    format: true-false
    question: "Dans `assertEquals`, la valeur attendue se place en premier."
    truth: true
    answer: Le message d'échec annonce « expected » puis « but was ».
  - key: vf-public
    format: true-false
    question: Avec JUnit Jupiter, une méthode de test doit être `public`.
    truth: false
    answer: La visibilité package suffit.
  - key: vf-champs-partages
    format: true-false
    question: Par défaut, un champ modifié par un test garde sa valeur pour le test suivant.
    truth: false
    answer: JUnit crée une nouvelle instance de la classe pour chaque méthode.
  - key: vf-before-all-static
    format: true-false
    question: Par défaut, une méthode `@BeforeAll` doit être `static`.
    truth: true
    answer: Sauf avec `@TestInstance(Lifecycle.PER_CLASS)`.
  - key: qcm-cycle
    format: multiple-choice
    question: Quelles annotations s'exécutent autour de chaque test ?
    choices:
      - text: "`@BeforeEach`"
        correct: true
      - text: "`@AfterEach`"
        correct: true
      - text: "`@BeforeAll`"
        correct: false
      - text: "`@AfterAll`"
        correct: false
    answer: '`@BeforeAll` et `@AfterAll` ne s''exécutent qu''une fois par classe.'
  - key: qcm-assertions
    format: multiple-choice
    question: Lesquelles sont des assertions de JUnit ?
    choices:
      - text: "`assertEquals`"
        correct: true
      - text: "`assertThrows`"
        correct: true
      - text: "`assertThat` dans `org.junit.jupiter.api.Assertions`"
        correct: false
      - text: "`assertFaster`"
        correct: false
    answer: '`assertThat` vient d''AssertJ (ou de Hamcrest).'
  - key: qcm-desactiver
    format: multiple-choice
    question: Comment désactiver temporairement un test en expliquant pourquoi ?
    choices:
      - text: "`@Disabled(\"en attente du correctif #42\")`"
        correct: true
      - text: "Commenter tout le test"
        correct: false
      - text: "Supprimer ses assertions"
        correct: false
      - text: "Le rendre `private`"
        correct: false
    answer: Le test reste visible dans les rapports, avec sa raison.
  - key: qcm-nom
    format: multiple-choice
    question: Quel nom de test est le plus utile ?
    choices:
      - text: "`refuseUnRetraitSuperieurAuSolde`"
        correct: true
      - text: "`testRetrait`"
        correct: false
      - text: "`test2`"
        correct: false
      - text: "`retraitOk`"
        correct: false
    answer: Il dit le comportement attendu et le contexte.
  - key: trous-test
    format: fill-in
    question: |-
      Complétez pour déclarer un test :
      ```java
      @___
      void calculeLaRemise() { ... }
      ```
    blanks: [[Test]]
    answer: '`org.junit.jupiter.api.Test`.'
  - key: trous-before
    format: fill-in
    question: |-
      Complétez pour préparer un état neuf avant chaque test :
      ```java
      @___
      void preparer() { stock = new Stock(); }
      ```
    blanks: [[BeforeEach]]
    answer: Exécutée avant chaque méthode de test.
  - key: trous-equals
    format: fill-in
    question: |-
      Complétez l'assertion :
      ```java
      assertEquals(___, panier.total());
      ```
      (le total attendu est 380)
    blanks: [["380"]]
    answer: L'attendu en premier, le résultat ensuite.
  - key: trous-all
    format: fill-in
    question: |-
      Complétez pour vérifier deux propriétés et voir tous les échecs :
      ```java
      ___(() -> assertEquals("Ada", client.nom()),
          () -> assertEquals("ada@exemple.org", client.email()));
      ```
    blanks: [[assertAll]]
    answer: Les deux assertions sont évaluées.
  - key: bug-ordre
    format: bug-fix
    question: |-
      En cas d'échec, le message de ce test induit en erreur :
      ```java
      assertEquals(facture.montantTtc(), 120);
      ```
    answer: |-
      ```java
      assertEquals(120, facture.montantTtc());
      ```
      L'attendu va en premier : le message d'échec dit alors « expected: <120> but was: <...> ».
  - key: bug-etat-statique
    format: bug-fix
    question: |-
      Ces tests passent seuls mais échouent ensemble, selon l'ordre :
      ```java
      class CompteurTest {
          static Compteur compteur = new Compteur();
          @Test void incremente() { compteur.incrementer(); assertEquals(1, compteur.valeur()); }
          @Test void demarreAZero() { assertEquals(0, compteur.valeur()); }
      }
      ```
    answer: |-
      ```java
      class CompteurTest {
          private Compteur compteur;
          @BeforeEach void preparer() { compteur = new Compteur(); }
          @Test void incremente() { compteur.incrementer(); assertEquals(1, compteur.valeur()); }
          @Test void demarreAZero() { assertEquals(0, compteur.valeur()); }
      }
      ```
      Le champ `static` partageait l'état entre les tests. Un état neuf par test les rend indépendants.
  - key: bug-sans-assertion
    format: bug-fix
    question: |-
      Ce test passe toujours, même si le calcul est faux :
      ```java
      @Test
      void calculeLaTva() {
          Facture f = new Facture(100);
          f.montantTtc();
      }
      ```
    answer: |-
      ```java
      @Test
      void calculeLaTvaAVingtPourCent() {
          Facture f = new Facture(100);
          assertEquals(120, f.montantTtc());
      }
      ```
      Un test sans assertion ne vérifie que l'absence d'exception. Il doit comparer le résultat à l'attendu.
  - key: bug-trop-de-choses
    format: bug-fix
    question: |-
      Quand ce test échoue, on ne sait pas quel comportement est cassé :
      ```java
      @Test
      void testPanier() {
          panier.ajouter(pomme); assertEquals(1, panier.nombreDeLignes());
          panier.retirer(pomme); assertTrue(panier.estVide());
          panier.ajouter(kiwi); panier.vider(); assertEquals(0, panier.total());
      }
      ```
    answer: |-
      ```java
      @Test void ajouterUnArticleCreeUneLigne() { panier.ajouter(pomme); assertEquals(1, panier.nombreDeLignes()); }
      @Test void retirerLeDernierArticleVideLePanier() { panier.ajouter(pomme); panier.retirer(pomme); assertTrue(panier.estVide()); }
      @Test void viderRemetLeTotalAZero() { panier.ajouter(kiwi); panier.vider(); assertEquals(0, panier.total()); }
      ```
      Un test par comportement, nommé d'après lui : un échec désigne directement ce qui est cassé.
