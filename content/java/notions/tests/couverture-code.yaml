notion: couverture-code
lesson: |-
  La **couverture de code** mesure la part du code **exécutée** par les tests. En Java, l'outil de référence est
  **JaCoCo** (un agent qui instrumente le bytecode pendant les tests, puis un rapport HTML et XML).

  Les mesures :
  - **lignes** : les lignes exécutées au moins une fois ;
  - **branches** : pour chaque `if`, `switch` ou opérateur `&&`/`||`, les deux issues ont-elles été parcourues ? Plus
    exigeante et plus parlante que les lignes ;
  - **méthodes**, **classes**, et la complexité cyclomatique couverte.

  ```xml
  <plugin>
    <groupId>org.jacoco</groupId>
    <artifactId>jacoco-maven-plugin</artifactId>
    <executions>
      <execution><goals><goal>prepare-agent</goal></goals></execution>
      <execution><id>rapport</id><phase>verify</phase><goals><goal>report</goal></goals></execution>
    </executions>
  </plugin>
  ```

  Ce qu'elle dit, et ce qu'elle ne dit pas :
  - une couverture **basse** est un signal fiable : des parties du code ne sont **jamais** exécutées par les tests ;
  - une couverture **haute** ne prouve **rien** sur la qualité : un test sans assertion couvre autant qu'un bon test.
    La couverture mesure l'**exécution**, pas la **vérification** ;
  - viser 100 % pousse à tester des getters et du code trivial, au détriment des cas qui comptent.

  Bonnes pratiques :
  - s'en servir comme **outil d'exploration** : repérer les branches non testées d'un module critique ;
  - suivre la **tendance** et la couverture des **nouvelles lignes** (dans les pull requests), plutôt qu'un seuil global ;
  - compléter par les **tests de mutation** (PIT), qui mesurent si les tests **détectent** réellement les erreurs ;
  - exclure le code généré.

  **Piège classique** : imposer 90 % de couverture comme objectif. Les équipes atteignent le chiffre avec des tests qui
  exécutent sans vérifier, et la qualité ne change pas (loi de Goodhart : une mesure qui devient un objectif cesse d'être une
  bonne mesure).

  **En entretien** : « JaCoCo mesure les lignes et les branches exécutées ; une couverture basse alerte, une couverture haute
  ne prouve rien. Je l'utilise pour trouver ce qui n'est pas testé, et PIT pour juger la force des tests. »
cards:
  - key: 100-couverture
    format: course
    question: Faut-il 100% de couverture ?
    answer: Non, la couverture ne mesure pas la qualité des assertions. Viser le métier critique.
  - key: lignes-branches
    format: course
    question: Quelle différence entre couverture de lignes et couverture de branches ?
    answer: La couverture de lignes compte les lignes exécutées ; celle des branches vérifie que chaque issue de chaque condition (`if`, `switch`, `&&`) a été parcourue. Une ligne avec un `if` peut être couverte sans que sa branche `else` le soit.
  - key: jacoco
    format: course
    question: Comment fonctionne JaCoCo ?
    answer: Un agent Java instrumente le bytecode pendant l'exécution des tests et enregistre ce qui est exécuté ; un goal produit ensuite un rapport HTML et XML.
  - key: bon-usage
    format: course
    question: Comment bien utiliser la couverture de code ?
    answer: Comme outil d'exploration pour trouver le code jamais testé, en suivant la tendance et la couverture des nouvelles lignes, plutôt que comme un objectif chiffré global.
  - key: vf-haute
    format: true-false
    question: Une couverture de 95 % garantit que les tests sont de bonne qualité.
    truth: false
    answer: Elle mesure ce qui est exécuté, pas ce qui est vérifié.
  - key: vf-basse
    format: true-false
    question: Une couverture très basse sur un module signale du code jamais exécuté par les tests.
    truth: true
    answer: C'est l'information la plus fiable qu'elle donne.
  - key: vf-branches
    format: true-false
    question: La couverture de branches est plus exigeante que la couverture de lignes.
    truth: true
    answer: Elle demande de parcourir chaque issue des conditions.
  - key: vf-assertion
    format: true-false
    question: Un test sans assertion augmente la couverture.
    truth: true
    answer: Il exécute le code sans rien vérifier, d'où les limites de la mesure.
  - key: qcm-mesures
    format: multiple-choice
    question: Que mesure la couverture de code ?
    choices:
      - text: "Les lignes et les branches exécutées pendant les tests"
        correct: true
      - text: "La justesse des assertions"
        correct: false
      - text: "Le nombre de bugs restants"
        correct: false
      - text: "La performance du code"
        correct: false
    answer: Elle ne dit rien de ce que les tests vérifient.
  - key: qcm-objectif
    format: multiple-choice
    question: Quel suivi de la couverture est le plus utile ?
    choices:
      - text: "La couverture des nouvelles lignes dans chaque pull request"
        correct: true
      - text: "La tendance du module, et les branches non couvertes du code critique"
        correct: true
      - text: "Un seuil global de 100 % imposé partout"
        correct: false
      - text: "Le nombre total de tests"
        correct: false
    answer: Un seuil global pousse à des tests sans valeur.
  - key: qcm-complement
    format: multiple-choice
    question: Quel outil complète la couverture en mesurant si les tests détectent les erreurs ?
    choices:
      - text: "Les tests de mutation (PIT)"
        correct: true
      - text: "Un formateur de code"
        correct: false
      - text: "Un profileur CPU"
        correct: false
      - text: "Le compilateur"
        correct: false
    answer: PIT introduit des erreurs et vérifie qu'un test échoue.
  - key: qcm-branche
    format: multiple-choice
    question: "Un seul test appelle `remise(150)` sur `if (montant >= 100) return 10; return 0;`. Que couvre-t-il ?"
    choices:
      - text: "La branche « vrai » seulement ; la branche « faux » n'est jamais exécutée"
        correct: true
      - text: "Toutes les branches"
        correct: false
      - text: "Aucune ligne"
        correct: false
      - text: "La borne de 100 exactement"
        correct: false
    answer: La couverture de branches le signale, la couverture de lignes moins clairement.
  - key: equipe-vise-80-couverture-mais-bugs
    format: scenario
    question: Ton équipe vise 80 % de couverture, mais des bugs passent quand même.
    answer: |-
      Parce que la couverture mesure les lignes **exécutées**, pas les comportements **vérifiés** : un test sans assertion couvre autant qu'un bon test. Je lancerais un **test de mutation** avec PIT sur les modules critiques : il montrera concrètement les endroits où on peut casser le code sans qu'aucun test ne le remarque.
      Ensuite je regarderais la nature des bugs échappés : sont-ils dans des cas limites (nulls, bornes, listes vides), dans l'intégration (requêtes SQL, sérialisation) ou dans la concurrence ? Chaque catégorie appelle un type de test différent. Et chaque bug corrigé reçoit un test de non-régression qui le reproduit d'abord.
  - key: scenario-seuil
    format: scenario
    question: La direction veut imposer 90 % de couverture sur tous les projets. Quelle est ta position ?
    answer: |-
      Je comprends l'objectif (de la qualité mesurable), mais un seuil global pousse à écrire des tests qui exécutent
      sans vérifier, sur du code trivial, pour atteindre le chiffre. Je proposerais plutôt : pas de baisse sur les
      nouvelles lignes (contrôle dans les pull requests), une attention particulière aux branches du code métier
      critique, des tests de mutation sur ces modules, et des indicateurs de résultat (bugs échappés en production, temps
      de correction). La couverture reste un outil d'exploration, pas une note.
  - key: scenario-explorer
    format: scenario
    question: Tu reprends un module critique de facturation. Comment utilises-tu le rapport JaCoCo ?
    answer: |-
      Je lis le rapport par classe et je cherche les branches rouges du code métier : les cas d'erreur jamais testés, les
      `else` oubliés, les conditions composées dont une moitié n'est jamais vraie. Ce sont autant de cas à spécifier par un
      test (en commençant par ceux qui touchent l'argent : arrondis, remises, taxes). Je n'écris pas de tests pour les
      getters ou le code généré, que j'exclus du rapport.
  - key: scenario-goodhart
    format: scenario
    question: Une équipe a atteint 95 % de couverture en trois semaines. Que vérifies-tu avant de t'en réjouir ?
    answer: |-
      Ce que vérifient ces nouveaux tests : des assertions réelles sur des résultats, ou de simples appels pour exécuter
      le code. Je lance PIT sur quelques modules : beaucoup de mutants survivants révèleraient des tests qui n'attrapent
      rien. Je regarde aussi si les cas limites et les erreurs sont couverts, et si les tests restent lisibles et rapides.
      Une hausse aussi rapide est souvent le signe que la mesure est devenue l'objectif.
