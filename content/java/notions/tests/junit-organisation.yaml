notion: junit-organisation
lesson: |-
  Une suite de tests se lit comme une **spécification** : on l'organise pour qu'un échec dise immédiatement quel
  comportement est cassé.

  ```java
  @DisplayName("Panier")
  class PanierTest {

      @Nested
      @DisplayName("quand il est vide")
      class Vide {
          @Test void aUnTotalNul() { ... }
          @Test void refuseLaValidation() { ... }
      }

      @Nested
      @DisplayName("avec des articles")
      class AvecArticles {
          @BeforeEach void ajouterDeuxArticles() { ... }      // s'ajoute à la préparation de la classe englobante
          @Test void additionneLesLignes() { ... }
      }
  }

  @Tag("lent")
  @Test void genereUnRapportComplet() { ... }
  ```

  - **`@Nested`** regroupe les tests par **contexte** (« quand il est vide », « avec des articles ») ; une classe imbriquée
    hérite de la préparation de la classe englobante.
  - **`@DisplayName`** donne un nom lisible dans les rapports ; un générateur (`@DisplayNameGeneration`) peut aussi
    transformer les noms de méthodes.
  - **`@Tag`** classe les tests (`lent`, `integration`) pour les filtrer : `mvn test -Dgroups=rapide`,
    `-DexcludedGroups=lent`.
  - Conventions :
    - une classe de test par classe testée, dans le même package (dossier `src/test/java`) : `PanierTest` ;
    - les tests d'intégration suffixés `IT` (lancés par Failsafe) ;
    - un nom de méthode qui décrit le comportement (`shouldResetStreakWhenADayIsMissed`,
      `refuseUnRetraitSuperieurAuSolde`), pas la méthode testée (`testRetirer`).
  - `@TestMethodOrder` impose un ordre, mais des tests qui en dépendent ne sont pas indépendants : à éviter.
  - Les **extensions** (`@ExtendWith`) ajoutent des comportements : Mockito, Quarkus, Testcontainers, un dossier temporaire
    (`@TempDir`).

  **Piège classique** : des tests qui ne passent que dans un certain ordre (le premier crée une donnée que le second
  utilise). Ils échouent dès qu'on en lance un seul ou que l'exécution devient parallèle.

  **En entretien** : « `@Nested` pour les contextes, `@DisplayName` pour la lisibilité, `@Tag` pour filtrer ; des noms qui
  décrivent le comportement, et des tests indépendants de leur ordre. »
cards:
  - key: nested
    format: course
    question: À quoi sert `@Nested` ?
    answer: À regrouper les tests d'une classe par contexte (« quand le panier est vide »), dans des classes imbriquées qui héritent de la préparation de la classe englobante.
  - key: tag
    format: course
    question: À quoi servent les `@Tag` ?
    answer: À classer les tests (`lent`, `integration`) pour les inclure ou les exclure d'une exécution, par exemple avec `-Dgroups` ou `-DexcludedGroups`.
  - key: nommage
    format: course
    question: Comment nommer une méthode de test ?
    answer: D'après le comportement attendu et son contexte (`refuseUnRetraitSuperieurAuSolde`, `shouldResetStreakWhenADayIsMissed`), pas d'après la méthode testée (`testRetirer`).
  - key: ordre
    format: course
    question: Pourquoi éviter que des tests dépendent de leur ordre d'exécution ?
    answer: Ils échouent dès qu'on en lance un seul, qu'on change l'ordre ou qu'on parallélise ; chaque test doit préparer son propre état.
  - key: vf-nested-before
    format: true-false
    question: Les méthodes `@BeforeEach` de la classe englobante s'exécutent aussi pour les tests d'une classe `@Nested`.
    truth: true
    answer: Puis celles de la classe imbriquée.
  - key: vf-display
    format: true-false
    question: "`@DisplayName` change le nom de la méthode Java."
    truth: false
    answer: Il ne change que le nom affiché dans les rapports.
  - key: vf-it
    format: true-false
    question: Par convention Maven, les tests d'intégration se suffixent `IT` et sont lancés par Failsafe.
    truth: true
    answer: Les tests `*Test` sont lancés par Surefire.
  - key: vf-ordre-garanti
    format: true-false
    question: JUnit garantit par défaut l'ordre d'écriture des méthodes de test.
    truth: false
    answer: L'ordre est déterministe mais volontairement non évident ; il ne faut pas en dépendre.
  - key: qcm-annotations
    format: multiple-choice
    question: Associez correctement annotation et rôle.
    choices:
      - text: "`@Nested` : regrouper par contexte"
        correct: true
      - text: "`@Tag` : filtrer l'exécution"
        correct: true
      - text: "`@DisplayName` : désactiver un test"
        correct: false
      - text: "`@TempDir` : imposer l'ordre des tests"
        correct: false
    answer: '`@TempDir` fournit un dossier temporaire nettoyé après le test.'
  - key: qcm-nom
    format: multiple-choice
    question: Quels noms de tests décrivent un comportement ?
    choices:
      - text: "`appliqueLaRemiseAPartirDe100Euros`"
        correct: true
      - text: "`shouldRejectExpiredInvitation`"
        correct: true
      - text: "`testCalculer`"
        correct: false
      - text: "`test1`"
        correct: false
    answer: Le nom dit ce qui est attendu, dans quel cas.
  - key: qcm-filtrer
    format: multiple-choice
    question: Comment exclure les tests marqués `@Tag("lent")` d'une exécution Maven ?
    choices:
      - text: "`mvn test -DexcludedGroups=lent`"
        correct: true
      - text: "`mvn test -Dskip=lent`"
        correct: false
      - text: "`mvn test -Ptag-lent`"
        correct: false
      - text: "Ce n'est pas possible"
        correct: false
    answer: '`-Dgroups=` inclut, `-DexcludedGroups=` exclut.'
  - key: qcm-extensions
    format: multiple-choice
    question: Quelles extensions JUnit sont courantes ?
    choices:
      - text: "`@ExtendWith(MockitoExtension.class)`"
        correct: true
      - text: "`@QuarkusTest` (qui enregistre l'extension Quarkus)"
        correct: true
      - text: "`@ExtendWith(String.class)`"
        correct: false
      - text: "`@Extends(Test.class)`"
        correct: false
    answer: Testcontainers en fournit aussi une (`@Testcontainers`).
  - key: trous-nested
    format: fill-in
    question: |-
      Complétez pour regrouper les tests d'un contexte :
      ```java
      @___
      class QuandLeCompteEstBloque { ... }
      ```
    blanks: [[Nested]]
    answer: Une classe imbriquée non statique.
  - key: trous-display
    format: fill-in
    question: |-
      Complétez pour un nom lisible dans le rapport :
      ```java
      @___("refuse un retrait supérieur au solde")
      @Test void retraitTropGrand() { ... }
      ```
    blanks: [[DisplayName]]
    answer: Le nom de la méthode reste inchangé.
  - key: trous-tag
    format: fill-in
    question: |-
      Complétez pour marquer un test lent :
      ```java
      @___("lent")
      @Test void importeUnFichierDe1Go() { ... }
      ```
    blanks: [[Tag]]
    answer: Il pourra être exclu des exécutions rapides.
  - key: trous-tempdir
    format: fill-in
    question: |-
      Complétez pour obtenir un dossier temporaire nettoyé après le test :
      ```java
      @Test void exporte(@___ Path dossier) { ... }
      ```
    blanks: [[TempDir]]
    answer: Une extension intégrée à JUnit.
