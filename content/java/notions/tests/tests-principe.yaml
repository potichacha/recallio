notion: tests-principe
lesson: |-
  Les tests automatisés servent à **changer le code sans peur** : ils détectent les régressions, documentent le
  comportement attendu et donnent un retour rapide.

  Les niveaux, du plus rapide au plus réaliste :

  | Niveau | Vérifie | Vitesse | Exemple |
  |---|---|---|---|
  | **unitaire** | une règle, une classe, sans infrastructure | millisecondes | le calcul d'un streak, l'algorithme FSRS |
  | **intégration** | une collaboration avec une vraie ressource | secondes | un repository contre PostgreSQL (Testcontainers), un endpoint REST |
  | **bout en bout** (E2E) | un parcours complet, comme un utilisateur | lent, fragile | se connecter, réviser une session (Playwright) |

  La **pyramide des tests** : beaucoup de tests unitaires (rapides, précis, stables), moins de tests d'intégration,
  très peu de tests de bout en bout. Plus un test est haut, plus il est lent, coûteux et difficile à diagnostiquer quand il
  échoue.

  D'autres familles :
  - les **tests de contrat** : deux services vérifient qu'ils respectent l'interface convenue (Pact), sans tout déployer ;
  - les **tests de caractérisation** : capturer le comportement actuel d'un code legacy avant de le modifier ;
  - les tests de **charge**, de **stress** et d'**endurance** (Gatling, k6) ;
  - les tests de **mutation** (PIT), qui vérifient que les tests détectent vraiment les erreurs.

  Un bon test est **FIRST** : rapide (*Fast*), indépendant des autres (*Isolated*), reproductible (*Repeatable*), qui
  conclut seul (*Self-validating* : il passe ou échoue, sans lecture humaine) et écrit au bon moment (*Timely*). Et son
  nom décrit le comportement attendu : `shouldResetStreakWhenADayIsMissed`.

  **Piège classique** : la pyramide inversée (le « cornet de glace »). Presque tout est testé de bout en bout : la suite
  dure une heure, échoue au hasard, et plus personne ne la lance.

  **En entretien** : « Beaucoup de tests unitaires rapides sur la logique, des tests d'intégration sur les frontières (base,
  HTTP) avec de vraies ressources, quelques tests de bout en bout sur les parcours critiques ; et des tests FIRST, nommés
  d'après le comportement. »
tour:
  - title: Pourquoi tester
    text: |-
      Un test **vérifie automatiquement** qu'un morceau de code fait ce qu'on attend. On distingue :

      - les tests **unitaires**, sur une classe ou une méthode isolée, rapides et nombreux ;
      - les tests **d'intégration**, sur plusieurs composants réunis, avec une base de données par exemple ;
      - les tests **de bout en bout**, sur l'application entière, comme un utilisateur.

      Lancés à chaque modification, ils signalent tout de suite ce qui casse, et permettent de modifier le code sans
      crainte. Ce programme fait à la main ce que fait un test : comparer un résultat à l'attendu.
    example:
      files:
        Main.java: |-
          int prixTtc(int prixHt) {
              return prixHt * 120 / 100;
          }

          void verifie(String nom, int obtenu, int attendu) {
              IO.println((obtenu == attendu ? "ok : " : "ÉCHEC : ") + nom + " donne " + obtenu);
          }

          void main() {
              verifie("100 HT", prixTtc(100), 120);
              verifie("0 HT", prixTtc(0), 0);
              verifie("15 HT", prixTtc(15), 18);
          }
      output: |-
        ok : 100 HT donne 120
        ok : 0 HT donne 0
        ok : 15 HT donne 18
    task:
      instructions: |-
        `prixTtc` tronque au lieu d'arrondir : pour 9 HT, elle donne 10, alors que 10,8 s'arrondit à 11. Corrige-la avec
        `Math.round(prixHt * 1.2)` : le programme doit afficher `ok : 9 HT donne 11`.
      starter:
        Main.java: |-
          int prixTtc(int prixHt) {
              return prixHt * 120 / 100;
          }

          void verifie(String nom, int obtenu, int attendu) {
              IO.println((obtenu == attendu ? "ok : " : "ÉCHEC : ") + nom + " donne " + obtenu);
          }

          void main() {
              verifie("9 HT", prixTtc(9), 11);
          }
      solution:
        Main.java: |-
          int prixTtc(int prixHt) {
              return (int) Math.round(prixHt * 1.2);
          }

          void verifie(String nom, int obtenu, int attendu) {
              IO.println((obtenu == attendu ? "ok : " : "ÉCHEC : ") + nom + " donne " + obtenu);
          }

          void main() {
              verifie("9 HT", prixTtc(9), 11);
          }
      output: |-
        ok : 9 HT donne 11
cards:
  - key: pyramide
    format: course
    question: Pourquoi la pyramide ?
    answer: Compromis économique, beaucoup de tests rapides et précis, peu de tests lents et fragiles.
  - key: test-contrat
    format: course
    question: C'est quoi un test de contrat ?
    answer: Une vérification que deux services respectent l'interface convenue, sans monter un E2E complet.
  - key: test-caracterisation
    format: course
    question: C'est quoi un test de caractérisation ?
    answer: Un test capturant le comportement actuel d'un code legacy, pour sécuriser un refactoring.
  - key: pact-vs-spring-cloud-contract
    format: course
    question: Pact vs Spring Cloud Contract ?
    answer: Contrats écrits par le consommateur vs contrats publiés par le fournisseur.
  - key: test-charge-vs-stress-vs-endurance
    format: course
    question: Test de charge vs stress vs endurance ?
    answer: Volume attendu / au-delà jusqu'à la rupture / longue durée pour révéler les dérives.
  - key: first
    format: course
    question: Que signifie l'acronyme FIRST pour un test ?
    answer: Fast (rapide), Isolated (indépendant des autres), Repeatable (reproductible), Self-validating (il conclut seul) et Timely (écrit au bon moment, idéalement avant ou avec le code).
  - key: vf-e2e-majorite
    format: true-false
    question: La majorité des tests d'une application devrait être des tests de bout en bout.
    truth: false
    answer: Ils sont lents et fragiles ; la base de la pyramide est faite de tests unitaires.
  - key: vf-independants
    format: true-false
    question: Un test ne doit pas dépendre de l'ordre d'exécution des autres tests.
    truth: true
    answer: Chaque test prépare et nettoie son propre état.
  - key: vf-unitaire-base
    format: true-false
    question: Un test unitaire a besoin d'une base de données.
    truth: false
    answer: Il teste la logique isolément ; la base relève des tests d'intégration.
  - key: vf-nom
    format: true-false
    question: "Un nom comme `shouldResetStreakWhenADayIsMissed` est préférable à `test1`."
    truth: true
    answer: Le nom documente le comportement et explique l'échec.
  - key: qcm-niveaux
    format: multiple-choice
    question: Associez correctement le test et son niveau.
    choices:
      - text: "Le calcul des intervalles FSRS : unitaire"
        correct: true
      - text: "Un repository JPA contre PostgreSQL dans un conteneur : intégration"
        correct: true
      - text: "Un parcours de connexion dans un navigateur : unitaire"
        correct: false
      - text: "Une règle de validation d'un DTO : bout en bout"
        correct: false
    answer: Le parcours navigateur est un test de bout en bout ; la validation se teste unitairement.
  - key: qcm-cornet
    format: multiple-choice
    question: Quels sont les symptômes d'une pyramide inversée ?
    choices:
      - text: "Une suite très lente"
        correct: true
      - text: "Des échecs aléatoires difficiles à diagnostiquer"
        correct: true
      - text: "Des tests qui s'exécutent en millisecondes"
        correct: false
      - text: "Un retour immédiat à chaque commit"
        correct: false
    answer: Les tests de bout en bout sont lents et dépendent de nombreux composants.
  - key: qcm-contrat
    format: multiple-choice
    question: À quoi sert un test de contrat entre deux services ?
    choices:
      - text: "Vérifier que le fournisseur respecte ce que le consommateur attend, sans déployer les deux ensemble"
        correct: true
      - text: "Mesurer les performances"
        correct: false
      - text: "Remplacer tous les tests unitaires"
        correct: false
      - text: "Signer juridiquement l'API"
        correct: false
    answer: Pact est l'outil le plus connu.
  - key: qcm-objectif
    format: multiple-choice
    question: Quel est le premier objectif d'une suite de tests automatisés ?
    choices:
      - text: "Permettre de modifier le code en détectant vite les régressions"
        correct: true
      - text: "Atteindre 100 % de couverture"
        correct: false
      - text: "Remplacer la documentation de l'API"
        correct: false
      - text: "Ralentir les livraisons pour plus de sécurité"
        correct: false
    answer: La couverture n'est qu'un indicateur.
  - key: testes-application-backend-concretement
    format: scenario
    question: Comment tu testes une application backend concrètement ?
    answer: |-
      Par niveau, selon la pyramide.
      La **base** : des tests unitaires sur la logique métier, sans base ni réseau, dépendances mockées. C'est là que je mets le plus d'effort, parce qu'ils tournent à chaque compilation et donnent un retour immédiat. Ils exigent un code découplé, d'où l'importance de l'injection par constructeur.
      Le **milieu** : les endpoints avec `@QuarkusTest` et REST-Assured, ou `@SpringBootTest` et MockMvc ; et la persistance avec **Testcontainers** sur une vraie base, parce qu'une base en mémoire masque les différences de comportement.
      Le **sommet** : très peu de tests bout en bout, réservés aux parcours critiques.
      Je regarderais aussi ce que les tests **vérifient réellement** : une couverture élevée sur des getters ne prouve rien. Je préfère cibler les règles métier et les cas limites, valeurs nulles, listes vides, bornes, erreurs.
  - key: tests-prennent-40-minutes-plus-personne
    format: scenario
    question: Les tests prennent 40 minutes, plus personne ne les lance.
    answer: |-
      Le problème n'est pas la durée en soi, c'est le **déséquilibre de la pyramide** : trop d'intégration et d'E2E, pas assez d'unitaires.
      Je commencerais par mesurer où le temps est passé, souvent une poignée de tests concentre l'essentiel. Ceux-là montent un contexte complet pour tester une logique qui pourrait l'être unitairement, ou attendent des timeouts.
      Les leviers : **convertir** en tests unitaires ceux qui n'ont pas besoin d'infrastructure ; **mutualiser** le contexte de test au lieu de le redémarrer par classe ; **paralléliser** l'exécution.
      Et surtout **séparer les cycles** : les unitaires tournent en local à chaque commit et doivent rester sous la minute ; l'intégration dans la CI ; les E2E la nuit ou sur la branche d'intégration.
      Le vrai enjeu est là : des tests qu'on ne lance pas ne protègent de rien.
  - key: scenario-bug-production
    format: scenario
    question: Un bug est remonté de production. Comment l'intègres-tu dans ta démarche de test ?
    answer: |-
      J'écris d'abord un test qui le reproduit, au niveau le plus bas possible (unitaire si la cause est une règle,
      intégration si elle tient à la base ou à la sérialisation), et je vérifie qu'il échoue. Puis je corrige, et le test
      passe : il protège désormais contre la régression. Je me demande aussi pourquoi les tests existants ne l'ont pas
      vu (cas limite oublié, test qui ne vérifiait rien) et si d'autres endroits du code ont le même défaut.
  - key: scenario-flaky
    format: scenario
    question: Un test échoue une fois sur vingt en CI. Que fais-tu ?
    answer: |-
      Je ne le relance pas jusqu'à ce qu'il passe : un test instable fait perdre confiance dans toute la suite. Je cherche la
      cause : dépendance au temps réel (`now()` au lieu d'une horloge fixe), à l'ordre des tests ou à un état partagé, à un
      `Thread.sleep` (remplacé par Awaitility), à un ordre non garanti (`HashMap`, résultats SQL sans `ORDER BY`), au
      réseau ou au hasard sans graine. Je le reproduis en le lançant en boucle, je corrige la cause, et en attendant je
      peux le mettre en quarantaine avec un ticket, jamais l'ignorer silencieusement.
