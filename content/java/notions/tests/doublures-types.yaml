notion: doublures-types
lesson: |-
  Une **doublure de test** (*test double*) remplace une dépendance réelle (base, API, horloge, envoi d'e-mails) pour tester
  une classe **isolément**, vite et de façon déterministe. Il en existe plusieurs sortes (vocabulaire de Gerard Meszaros) :

  | Doublure | Ce qu'elle fait | Exemple |
  |---|---|---|
  | **dummy** | passée seulement pour remplir un paramètre | un `null` ou un objet jamais utilisé |
  | **stub** | renvoie des **réponses préparées** | `tarifs.prix("A1")` renvoie toujours 100 |
  | **fake** | une **implémentation simplifiée** qui fonctionne vraiment | un repository en mémoire (`HashMap`) |
  | **spy** | un objet réel qui **enregistre** les appels (ou dont on remplace une partie) | compter les e-mails envoyés |
  | **mock** | un objet préprogrammé dont on **vérifie les interactions** | vérifier que `notifier.envoyer(client)` a été appelé |

  Deux styles de vérification :
  - par l'**état** : on vérifie le résultat ou l'état final (avec un stub ou un fake) ; robuste aux refactorings ;
  - par le **comportement** : on vérifie les appels faits aux collaborateurs (avec un mock) ; utile quand l'effet attendu
    **est** l'appel (envoyer un message, publier un événement), mais il couple le test à l'implémentation.

  Bonnes pratiques :
  - doubler les **frontières** (base, réseau, temps, système de fichiers), pas les objets métier simples, qu'on utilise
    réellement ;
  - ne pas mocker un type **qu'on ne possède pas** (une bibliothèque tierce) : on l'enveloppe dans un **adaptateur** à
    nous, qu'on double, et l'adaptateur est testé en intégration (WireMock, Testcontainers) ;
  - un **fake** en mémoire est souvent plus lisible qu'une forêt de `when(...)`, et réutilisable par plusieurs tests.

  **Piège classique** : tout mocker, jusqu'aux objets valeur. Les tests vérifient alors l'enchaînement des appels, cassent à
  chaque refactoring, et passent même si le code ne fait rien d'utile.

  **En entretien** : « Stub pour fournir des réponses, mock pour vérifier des appels, fake pour une implémentation légère,
  spy pour observer un objet réel ; je double les frontières, je préfère vérifier l'état, et je ne mocke pas ce que je ne
  possède pas. »
cards:
  - key: stub-vs-mock-vs-spy-vs
    format: course
    question: Stub vs mock vs spy vs fake ?
    answer: Valeurs prédéfinies / + vérification / objet réel partiellement remplacé / implémentation simplifiée réelle.
  - key: tester-appel-http-sortant
    format: course
    question: Comment tester un appel HTTP sortant ?
    answer: WireMock (ou MockRestServiceServer), en simulant aussi les erreurs et la latence.
  - key: mocker-bibliotheque-tierce-directement
    format: course
    question: Pourquoi ne pas mocker une bibliothèque tierce directement ?
    answer: On fige des hypothèses sur un code qu'on ne maîtrise pas ; on l'enveloppe dans un adaptateur qu'on mocke.
  - key: etat-comportement
    format: course
    question: Quelle différence entre vérification par l'état et par le comportement ?
    answer: Par l'état, on vérifie le résultat ou l'état final ; par le comportement, on vérifie les appels faits aux collaborateurs (avec un mock). La première résiste mieux aux refactorings.
  - key: vf-mock-tout
    format: true-false
    question: Il faut mocker tous les collaborateurs d'une classe, y compris les objets valeur.
    truth: false
    answer: On double les frontières ; les objets métier simples s'utilisent réellement.
  - key: vf-fake
    format: true-false
    question: Un repository en mémoire basé sur une `HashMap` est un fake.
    truth: true
    answer: Une implémentation simplifiée mais fonctionnelle.
  - key: vf-mock-verif
    format: true-false
    question: Un mock sert à vérifier qu'un appel a bien été fait.
    truth: true
    answer: C'est ce qui le distingue d'un simple stub.
  - key: vf-tiers
    format: true-false
    question: Mocker directement le client HTTP d'une bibliothèque tierce est la meilleure façon de tester l'intégration.
    truth: false
    answer: On l'enveloppe dans un adaptateur, testé en intégration contre WireMock.
  - key: qcm-types
    format: multiple-choice
    question: Associez correctement la doublure et son rôle.
    choices:
      - text: "Stub : renvoyer des réponses préparées"
        correct: true
      - text: "Mock : vérifier les interactions"
        correct: true
      - text: "Fake : un objet jamais utilisé"
        correct: false
      - text: "Dummy : une implémentation complète en mémoire"
        correct: false
    answer: Le dummy n'est jamais utilisé ; le fake est l'implémentation simplifiée.
  - key: qcm-doubler
    format: multiple-choice
    question: Que double-t-on en priorité dans un test unitaire ?
    choices:
      - text: "Les accès à la base et au réseau"
        correct: true
      - text: "L'horloge et les sources de hasard"
        correct: true
      - text: "Les records métier comme `Montant`"
        correct: false
      - text: "Les collections du JDK (`List`, `Map`)"
        correct: false
    answer: Ce qui est lent, non déterministe ou externe.
  - key: qcm-comportement
    format: multiple-choice
    question: Quand la vérification par le comportement (un mock) est-elle justifiée ?
    choices:
      - text: "Quand l'effet attendu est l'appel lui-même, comme envoyer un e-mail ou publier un événement"
        correct: true
      - text: "Pour vérifier le résultat d'un calcul"
        correct: false
      - text: "Pour tous les appels internes d'une classe"
        correct: false
      - text: "Jamais"
        correct: false
    answer: Un calcul se vérifie par son résultat.
  - key: qcm-adaptateur
    format: multiple-choice
    question: Comment tester un service qui utilise le SDK d'un fournisseur de paiement ?
    choices:
      - text: "Le service dépend d'une interface à nous, doublée en unitaire"
        correct: true
      - text: "L'adaptateur qui utilise le SDK est testé en intégration (WireMock ou bac à sable)"
        correct: true
      - text: "Mocker chaque classe du SDK dans les tests du service"
        correct: false
      - text: "Ne pas tester les paiements"
        correct: false
    answer: Le SDK reste derrière une frontière que nous maîtrisons.
  - key: testes-service-appelle-api-externe-paiement
    format: scenario
    question: Comment tu testes un service qui appelle une API externe de paiement ?
    answer: |-
      Par niveaux. En **unitaire**, le service dépend d'une interface `PasserellePaiement` que je mocke : je teste la logique (montants, règles, gestion des refus) sans réseau.
      En **intégration**, je teste l'adaptateur HTTP réel contre **WireMock** : réponses nominales, mais surtout les cas difficiles, comme un 500, un timeout, une réponse mal formée, un 429 avec `Retry-After`, pour vérifier timeouts, retries et circuit breaker.
      Si le fournisseur propose un **bac à sable**, quelques tests de bout en bout contre lui, dans un pipeline séparé parce qu'ils dépendent d'un tiers. Et l'idempotence se teste explicitement : rejouer la même requête ne doit pas débiter deux fois.
  - key: scenario-fragiles
    format: scenario
    question: Chaque refactoring casse des dizaines de tests remplis de `verify(...)`, alors que le comportement ne change pas. Que proposes-tu ?
    answer: |-
      Les tests vérifient l'implémentation (quels appels internes, dans quel ordre) au lieu du comportement. Je les
      réécris pour vérifier l'état ou le résultat observable : avec des fakes (un repository en mémoire) plutôt que des
      mocks, on vérifie ce qui a été enregistré et renvoyé. Je garde des `verify` seulement là où l'appel est l'effet
      attendu (un e-mail envoyé, un événement publié), et j'arrête de mocker les objets métier simples.
  - key: scenario-fake-repository
    format: scenario
    question: Plusieurs tests d'un service répètent les mêmes `when(repository...)`. Comment simplifier ?
    answer: |-
      J'écris un fake : une implémentation en mémoire de l'interface du repository (une `HashMap` indexée par
      identifiant), réutilisable par tous les tests. Les tests préparent des données en les enregistrant dans le fake,
      appellent le service, puis vérifient l'état du fake. C'est plus lisible, plus proche du vrai comportement, et cela
      ne casse pas si le service change l'ordre de ses appels. Un test d'intégration avec Testcontainers vérifie à part
      que le vrai repository se comporte comme le fake.
  - key: scenario-horloge
    format: scenario
    question: Comment tester une règle « une invitation expire au bout de 7 jours » sans attendre 7 jours ?
    answer: |-
      La classe ne lit pas l'heure avec `Instant.now()` : elle reçoit un `java.time.Clock` par injection. En production, on
      injecte `Clock.systemUTC()` ; en test, `Clock.fixed(...)` pour un instant précis, ou une horloge mutable que le test
      avance (`Clock.offset`). Je teste les bornes : 6 jours, 23 h et 59 min (encore valide), 7 jours pile, 7 jours et une
      seconde. C'est une doublure de l'horloge, la frontière la plus souvent oubliée.
