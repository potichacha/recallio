notion: doublures-types
lesson: |-
  Une **doublure de test** (*test double*) remplace une dépendance réelle (base, API, horloge, envoi d'e-mails) pour tester
  une classe **isolément**, vite et de façon déterministe. Il en existe plusieurs sortes (vocabulaire de Gerard Meszaros) :

  | Doublure | Ce qu'elle fait | Exemple |
  |---|---|---|
  | **dummy** | passée seulement pour remplir un paramètre | un `null` ou un objet jamais utilisé |
  | **stub** | renvoie des **réponses préparées** | `tarifs.prix("A1")` renvoie toujours 100 |
  | **fake** | une **implémentation simplifiée** qui fonctionne vraiment | un repository en mémoire (`HashMap`) |
  | **spy** | un objet réel qui **enregistre** les appels (ou dont on remplace une partie) | compter les e-mails envoyés |
  | **mock** | un objet préprogrammé dont on **vérifie les interactions** | vérifier que `notifier.envoyer(client)` a été appelé |

  Deux styles de vérification :
  - par l'**état** : on vérifie le résultat ou l'état final (avec un stub ou un fake) ; robuste aux refactorings ;
  - par le **comportement** : on vérifie les appels faits aux collaborateurs (avec un mock) ; utile quand l'effet attendu
    **est** l'appel (envoyer un message, publier un événement), mais il couple le test à l'implémentation.

  Bonnes pratiques :
  - doubler les **frontières** (base, réseau, temps, système de fichiers), pas les objets métier simples, qu'on utilise
    réellement ;
  - ne pas mocker un type **qu'on ne possède pas** (une bibliothèque tierce) : on l'enveloppe dans un **adaptateur** à
    nous, qu'on double, et l'adaptateur est testé en intégration (WireMock, Testcontainers) ;
  - un **fake** en mémoire est souvent plus lisible qu'une forêt de `when(...)`, et réutilisable par plusieurs tests.

  **Piège classique** : tout mocker, jusqu'aux objets valeur. Les tests vérifient alors l'enchaînement des appels, cassent à
  chaque refactoring, et passent même si le code ne fait rien d'utile.

  **En entretien** : « Stub pour fournir des réponses, mock pour vérifier des appels, fake pour une implémentation légère,
  spy pour observer un objet réel ; je double les frontières, je préfère vérifier l'état, et je ne mocke pas ce que je ne
  possède pas. »
cards:
  - key: stub-vs-mock-vs-spy-vs
    format: course
    question: "Quelle différence entre un stub, un mock, un spy et un fake ?"
    choices:
      - {text: "Stub : réponses préparées ; mock : vérifie les appels ; spy : objet réel en partie remplacé ; fake : version simplifiée qui marche", correct: true}
      - {text: "Stub : vérifie les appels ; mock : réponses préparées ; spy : objet réel en partie remplacé ; fake : version simplifiée qui marche", correct: false}
      - {text: "Stub : réponses préparées ; mock : vérifie les appels ; spy : version simplifiée qui marche ; fake : objet réel en partie remplacé", correct: false}
      - {text: "Stub : réponses préparées ; mock : objet réel en partie remplacé ; spy : vérifie les appels ; fake : objet jamais utilisé", correct: false}
    answer: "Un stub renvoie des valeurs prédéfinies ; un mock y ajoute la vérification des appels ; un spy est un objet réel dont on remplace une partie ; un fake, une implémentation simplifiée mais réelle (un repository en mémoire)."
  - key: tester-appel-http-sortant
    format: course
    question: "Comment tester un appel HTTP sortant vers une API externe ?"
    choices:
      - {text: "Avec un faux serveur comme WireMock, qui simule aussi les erreurs et la latence", correct: true}
      - {text: "En appelant la vraie API de production depuis chaque test, pour être réaliste", correct: false}
      - {text: "En mockant le `HttpClient` du JDK avec Mockito, méthode par méthode", correct: false}
      - {text: "En désactivant l'appel dans les tests par un `if` sur le profil actif", correct: false}
    answer: "Avec WireMock (ou `MockRestServiceServer`) : un vrai serveur HTTP local, qui simule aussi les erreurs (500, délai dépassé) et la latence. Mocker le client HTTP ne teste ni la sérialisation ni la gestion des erreurs réseau."
  - key: mocker-bibliotheque-tierce-directement
    format: course
    question: Pourquoi ne pas mocker une bibliothèque tierce directement ?
    choices:
      - {text: "On fige des hypothèses sur un code qu'on ne maîtrise pas ; on mocke un adaptateur à nous", correct: true}
      - {text: "Mockito ne sait pas créer de mock d'une classe venant d'un JAR externe", correct: false}
      - {text: "Les licences des bibliothèques interdisent d'en simuler le comportement", correct: false}
      - {text: "Un mock de bibliothèque tierce rend les tests beaucoup trop lents", correct: false}
    answer: On fige des hypothèses sur un code qu'on ne maîtrise pas ; on l'enveloppe dans un adaptateur qu'on mocke.
  - key: etat-comportement
    format: course
    question: Quelle différence entre vérification par l'état et par le comportement ?
    choices:
      - {text: "L'état vérifie le résultat final ; le comportement, les appels faits aux collaborateurs", correct: true}
      - {text: "L'état vérifie les appels faits aux collaborateurs ; le comportement, le résultat final", correct: false}
      - {text: "L'état vérifie les champs privés ; le comportement, les méthodes publiques", correct: false}
      - {text: "L'état se vérifie en intégration ; le comportement, en test unitaire seulement", correct: false}
    answer: Par l'état, on vérifie le résultat ou l'état final ; par le comportement, on vérifie les appels faits aux collaborateurs (avec un mock). La première résiste mieux aux refactorings.
  - key: vf-mock-tout
    format: true-false
    question: Il faut mocker tous les collaborateurs d'une classe, y compris les objets valeur.
    truth: false
    answer: On double les frontières ; les objets métier simples s'utilisent réellement.
  - key: vf-fake
    format: true-false
    question: Un repository en mémoire basé sur une `HashMap` est un fake.
    truth: true
    answer: Une implémentation simplifiée mais fonctionnelle.
  - key: vf-mock-verif
    format: true-false
    question: Un mock sert à vérifier qu'un appel a bien été fait.
    truth: true
    answer: C'est ce qui le distingue d'un simple stub.
  - key: vf-tiers
    format: true-false
    question: Mocker directement le client HTTP d'une bibliothèque tierce est la meilleure façon de tester l'intégration.
    truth: false
    answer: On l'enveloppe dans un adaptateur, testé en intégration contre WireMock.
  - key: qcm-types
    format: multiple-choice
    question: "Quelle association entre doublure et rôle est correcte ?"
    choices:
      - {text: "Stub : renvoyer des réponses préparées", correct: true}
      - {text: "Fake : un objet passé mais jamais utilisé", correct: false}
      - {text: "Dummy : une implémentation complète en mémoire", correct: false}
      - {text: "Spy : une implémentation simplifiée écrite à la main", correct: false}
    answer: "Un stub renvoie des réponses préparées, et un mock vérifie les interactions. Le dummy, lui, n'est jamais utilisé ; le fake est l'implémentation simplifiée ; le spy, un objet réel en partie remplacé."
  - key: qcm-doubler
    format: multiple-choice
    question: "Lesquelles de ces dépendances double-t-on en priorité dans un test unitaire ?"
    choices:
      - text: "Les accès à la base et au réseau"
        correct: true
      - text: "L'horloge et les sources de hasard"
        correct: true
      - text: "Les records métier comme `Montant`"
        correct: false
      - text: "Les collections du JDK (`List`, `Map`)"
        correct: false
    answer: Ce qui est lent, non déterministe ou externe.
  - key: qcm-comportement
    format: multiple-choice
    question: Quand la vérification par le comportement (un mock) est-elle justifiée ?
    choices:
      - {text: "Quand l'effet attendu est l'appel lui-même, comme envoyer un e-mail ou publier un événement", correct: true}
      - {text: "Pour vérifier le résultat d'un calcul, en contrôlant chacune de ses étapes intermédiaires", correct: false}
      - {text: "Pour tous les appels internes d'une classe, afin de documenter son implémentation", correct: false}
      - {text: "Jamais : un mock ne doit servir qu'à renvoyer des réponses préparées", correct: false}
    answer: Un calcul se vérifie par son résultat.
  - key: qcm-adaptateur
    format: multiple-choice
    question: "Comment tester unitairement un service qui utilise le SDK d'un fournisseur de paiement ?"
    choices:
      - {text: "Le service dépend d'une interface à nous, doublée dans le test", correct: true}
      - {text: "Mocker chaque classe du SDK dans les tests du service", correct: false}
      - {text: "Appeler le vrai fournisseur avec une carte de test à chaque test", correct: false}
      - {text: "Ne pas tester les paiements, trop liés au fournisseur", correct: false}
    answer: "Le SDK reste derrière une frontière à nous : le service dépend d'une interface, doublée en unitaire, et l'adaptateur qui utilise le SDK se teste en intégration (WireMock ou bac à sable). Mocker le SDK fige des hypothèses sur un code qu'on ne maîtrise pas."
  - key: testes-service-appelle-api-externe-paiement
    format: scenario
    question: "Comment testes-tu un service qui appelle une API externe de paiement ?"
    choices:
      - {text: "Par niveaux : interface mockée en unitaire, adaptateur contre WireMock, un peu de bac à sable", correct: true}
      - {text: "Contre la vraie API de production, avec de petits montants remboursés ensuite", correct: false}
      - {text: "Seulement en bout en bout, car un paiement ne se teste qu'en conditions réelles", correct: false}
      - {text: "En mockant le client HTTP partout, ce qui suffit à couvrir tous les cas d'erreur", correct: false}
    answer: |-
      Par niveaux. En **unitaire**, le service dépend d'une interface `PasserellePaiement` que je mocke : je teste la logique (montants, règles, gestion des refus) sans réseau.
      En **intégration**, je teste l'adaptateur HTTP réel contre **WireMock** : réponses nominales, mais surtout les cas difficiles, comme un 500, un timeout, une réponse mal formée, un 429 avec `Retry-After`, pour vérifier timeouts, retries et circuit breaker.
      Si le fournisseur propose un **bac à sable**, quelques tests de bout en bout contre lui, dans un pipeline séparé parce qu'ils dépendent d'un tiers. Et l'idempotence se teste explicitement : rejouer la même requête ne doit pas débiter deux fois.
  - key: scenario-fragiles
    format: scenario
    question: Chaque refactoring casse des dizaines de tests remplis de `verify(...)`, alors que le comportement ne change pas. Que proposes-tu ?
    choices:
      - {text: "Vérifier l'état ou le résultat observable, avec des fakes, et garder `verify` pour les effets", correct: true}
      - {text: "Supprimer les tests qui cassent : ils ne servent qu'à freiner les refactorings", correct: false}
      - {text: "Interdire les refactorings tant que tous les tests n'ont pas été réécrits", correct: false}
      - {text: "Passer tous les mocks en `lenient()` pour qu'ils tolèrent les changements", correct: false}
    answer: |-
      Les tests vérifient l'implémentation (quels appels internes, dans quel ordre) au lieu du comportement. Je les
      réécris pour vérifier l'état ou le résultat observable : avec des fakes (un repository en mémoire) plutôt que des
      mocks, on vérifie ce qui a été enregistré et renvoyé. Je garde des `verify` seulement là où l'appel est l'effet
      attendu (un e-mail envoyé, un événement publié), et j'arrête de mocker les objets métier simples.
  - key: scenario-fake-repository
    format: scenario
    question: Plusieurs tests d'un service répètent les mêmes `when(repository...)`. Comment simplifier ?
    choices:
      - {text: "Écrire un fake : un repository en mémoire, réutilisé par tous les tests", correct: true}
      - {text: "Regrouper tous les `when` dans un `@BeforeEach` commun à la classe", correct: false}
      - {text: "Brancher le vrai repository sur une base H2 en mémoire dans chaque test", correct: false}
      - {text: "Mocker le service lui-même, pour ne plus préparer le repository", correct: false}
    answer: |-
      J'écris un fake : une implémentation en mémoire de l'interface du repository (une `HashMap` indexée par
      identifiant), réutilisable par tous les tests. Les tests préparent des données en les enregistrant dans le fake,
      appellent le service, puis vérifient l'état du fake. C'est plus lisible, plus proche du vrai comportement, et cela
      ne casse pas si le service change l'ordre de ses appels. Un test d'intégration avec Testcontainers vérifie à part
      que le vrai repository se comporte comme le fake.
  - key: scenario-horloge
    format: scenario
    question: Comment tester une règle « une invitation expire au bout de 7 jours » sans attendre 7 jours ?
    choices:
      - {text: "Injecter un `Clock`, fixé dans le test, et tester les bornes autour de 7 jours", correct: true}
      - {text: "Changer la date système de la machine de test avant chaque exécution", correct: false}
      - {text: "Réduire la durée à 7 secondes en test, avec un `Thread.sleep(7000)`", correct: false}
      - {text: "Doubler `Instant.now()` avec `mockStatic` dans chacun des tests", correct: false}
    answer: |-
      La classe ne lit pas l'heure avec `Instant.now()` : elle reçoit un `java.time.Clock` par injection. En production, on
      injecte `Clock.systemUTC()` ; en test, `Clock.fixed(...)` pour un instant précis, ou une horloge mutable que le test
      avance (`Clock.offset`). Je teste les bornes : 6 jours, 23 h et 59 min (encore valide), 7 jours pile, 7 jours et une
      seconde. C'est une doublure de l'horloge, la frontière la plus souvent oubliée.
