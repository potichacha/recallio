notion: tdd
lesson: |-
  Le **développement piloté par les tests** (*Test-Driven Development*, Kent Beck) inverse l'ordre habituel : on écrit le
  **test d'abord**, puis le code qui le fait passer, en cycles très courts :

  ```
  ROUGE    : écrire un petit test qui échoue (il précise le comportement voulu)
  VERT     : écrire le code le plus simple qui le fait passer
  REFACTOR : améliorer le code (et les tests), tous les tests restant verts
  ```

  Exemple, une règle de remise :
  1. *Rouge* : `aucuneRemiseEnDessousDe100Euros` échoue (la classe n'existe pas encore).
  2. *Vert* : `return BigDecimal.ZERO;` suffit.
  3. *Rouge* : `dixPourCentAPartirDe100Euros` échoue.
  4. *Vert* : un `if` sur le montant.
  5. *Refactor* : extraire le seuil en constante, nommer clairement.
  6. On continue avec le cas suivant (les clients fidèles, le plafond...).

  Ce que TDD apporte :
  - une conception **pilotée par l'usage** : on écrit l'appel avant l'implémentation, donc des API simples ;
  - un code **testable** par construction, et une couverture qui vient d'elle-même ;
  - des **petits pas** : on sait toujours ce qui vient de casser ;
  - une liste de cas qui sert de **spécification** exécutable.

  Ses limites : moins naturel pour l'exploration (un prototype jetable), l'interface graphique, ou un code dont on ne sait
  pas encore ce qu'il doit faire. Ce n'est pas tout ou rien.

  Variantes : le **BDD** (*Behavior-Driven Development*) formule les tests en langage métier (*Given / When / Then*,
  Cucumber) ; l'école « de Londres » part de l'extérieur avec des mocks, l'école « de Chicago » part du domaine avec des
  objets réels.

  **Piège classique** : écrire tout le code, puis tous les tests « en TDD ». Ce n'est plus du TDD : les tests confirment
  l'implémentation au lieu de la guider, et l'on perd le bénéfice des petits pas.

  **En entretien** : « Rouge, vert, refactor, en cycles de quelques minutes : un petit test qui échoue, le code minimal pour
  le faire passer, puis on nettoie ; une conception guidée par l'usage, et une spécification exécutable. »
cards:
  - key: cycle
    format: course
    question: Quelles sont les trois étapes du cycle TDD ?
    answer: Rouge (écrire un petit test qui échoue), vert (écrire le code le plus simple qui le fait passer), refactor (améliorer le code et les tests, tout restant vert).
  - key: code-minimal
    format: course
    question: Pourquoi écrire « le code le plus simple » à l'étape verte ?
    answer: Pour ne pas anticiper des besoins non spécifiés ; c'est le test suivant qui forcera à généraliser, ce qui garde le code minimal et entièrement couvert.
  - key: apports
    format: course
    question: Qu'apporte TDD au-delà des tests ?
    answer: Une conception guidée par l'usage (l'appel est écrit avant l'implémentation), un code testable par construction, des petits pas qui localisent les erreurs, et une spécification exécutable.
  - key: limites
    format: course
    question: Quand TDD est-il moins adapté ?
    answer: Pour l'exploration ou un prototype jetable, l'interface graphique, ou quand on ne sait pas encore ce que le code doit faire.
  - key: vf-test-apres
    format: true-false
    question: En TDD, on écrit les tests après avoir terminé le code.
    truth: false
    answer: Le test vient d'abord, et guide le code.
  - key: vf-rouge
    format: true-false
    question: Voir le nouveau test échouer avant d'écrire le code fait partie du cycle.
    truth: true
    answer: Cela prouve que le test vérifie bien quelque chose.
  - key: vf-refactor
    format: true-false
    question: L'étape de refactoring peut changer le comportement du code.
    truth: false
    answer: Elle améliore la structure sans changer le comportement ; les tests restent verts.
  - key: vf-bdd
    format: true-false
    question: Le BDD formule les tests en langage métier, souvent sous la forme Given / When / Then.
    truth: true
    answer: Avec des outils comme Cucumber, ou simplement dans le nom et la structure des tests.
  - key: qcm-ordre
    format: multiple-choice
    question: Quel est l'ordre du cycle TDD ?
    choices:
      - text: "Rouge, vert, refactor"
        correct: true
      - text: "Vert, rouge, refactor"
        correct: false
      - text: "Refactor, rouge, vert"
        correct: false
      - text: "Code, test, livraison"
        correct: false
    answer: Un test qui échoue, le code qui le fait passer, puis le nettoyage.
  - key: qcm-apports
    format: multiple-choice
    question: Quels bénéfices attend-on de TDD ?
    choices:
      - text: "Des API simples, conçues depuis le point de vue de l'appelant"
        correct: true
      - text: "Un retour immédiat quand un changement casse quelque chose"
        correct: true
      - text: "L'absence totale de bugs"
        correct: false
      - text: "La suppression des tests d'intégration"
        correct: false
    answer: TDD réduit les bugs sans les supprimer, et ne remplace pas les autres niveaux de tests.
  - key: qcm-pas
    format: multiple-choice
    question: Pourquoi les cycles TDD doivent-ils être courts ?
    choices:
      - text: "Quand un test échoue, la cause est dans les quelques lignes écrites depuis le dernier vert"
        correct: true
      - text: "Pour écrire moins de tests"
        correct: false
      - text: "Parce que JUnit limite la durée d'un test"
        correct: false
      - text: "Pour éviter le refactoring"
        correct: false
    answer: Des pas de quelques minutes gardent le système toujours proche d'un état vert.
  - key: qcm-ecoles
    format: multiple-choice
    question: Quelle différence entre l'école « de Londres » et celle « de Chicago » ?
    choices:
      - text: "Londres part de l'extérieur avec des mocks ; Chicago part du domaine avec des objets réels"
        correct: true
      - text: "Londres n'écrit pas de tests"
        correct: false
      - text: "Chicago écrit les tests après le code"
        correct: false
      - text: "Aucune"
        correct: false
    answer: Deux styles complémentaires.
  - key: scenario-commencer
    format: scenario
    question: Comment démarrerais-tu en TDD l'implémentation d'une règle « un streak se remet à zéro si un jour est manqué » ?
    answer: |-
      Je liste d'abord les cas : aucun jour actif, un jour, plusieurs jours consécutifs, un jour manqué, un jour manqué
      puis repris, un changement de fuseau. Je commence par le plus simple (aucun jour actif → streak 0), je le vois échouer,
      j'écris le code minimal, puis j'ajoute un cas à la fois (deux jours consécutifs → 2, un jour manqué → 0...). Après
      chaque vert, je nettoie (noms, extraction du calcul de date). La date du jour est un paramètre (ou un `Clock`), ce
      qui rend chaque test déterministe.
  - key: scenario-legacy
    format: scenario
    question: Peut-on pratiquer TDD sur un code legacy sans tests ?
    answer: |-
      Oui, à petite échelle : pour chaque nouvelle fonctionnalité ou chaque bug, j'écris d'abord le test du comportement
      voulu (ou qui reproduit le bug), ce qui demande souvent d'ouvrir le code (extraire une méthode, injecter une
      dépendance) par des refactorings sûrs. Je pose aussi des tests de caractérisation autour de la zone à modifier. Le
      filet grandit au fil des changements, sans chercher à tout couvrir d'un coup.
  - key: scenario-sceptique
    format: scenario
    question: Un collègue pense que TDD fait perdre du temps. Que lui réponds-tu ?
    answer: |-
      Que le temps passé à écrire les tests est en partie repris sur le débogage et les retours en arrière : avec des pas
      courts, on sait tout de suite ce qui casse, et le code est testable par construction. Mais TDD n'est pas une
      religion : il est très rentable sur la logique métier (règles, calculs, états), moins sur une exploration ou de la
      plomberie. Je proposerais de l'essayer sur un module métier bien délimité et de juger sur les résultats (bugs,
      facilité de changement), plutôt que d'en débattre.
  - key: scenario-bug
    format: scenario
    question: Comment appliques-tu le cycle TDD à la correction d'un bug ?
    answer: |-
      Rouge : j'écris un test qui reproduit le bug et je vérifie qu'il échoue, pour la bonne raison. Vert : je corrige le
      code jusqu'à ce que ce test passe, sans casser les autres. Refactor : je nettoie la correction si besoin. Le test
      reste dans la suite comme test de non-régression ; et je me demande si d'autres cas voisins (bornes, valeurs nulles)
      méritent aussi un test.
  - key: definition-tdd-bdd
    format: definition
    question: TDD / BDD
    answer: Test-Driven / Behavior-Driven Development
  - key: definition-rouge-vert
    format: definition
    question: Rouge-vert-refactor
    answer: "Le cycle du TDD : un test qui échoue, le code minimal pour le faire passer, puis l'amélioration du code sans changer son comportement."
  - key: definition-refactoring
    format: definition
    question: Refactoring
    answer: Modifier la structure du code sans changer son comportement observable, sous la protection des tests.
  - key: definition-given-when-then
    format: definition
    question: Given / When / Then
    answer: La structure d'un scénario de test en trois temps (contexte, action, résultat attendu), popularisée par le BDD.
