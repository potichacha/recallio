notion: mutation-testing
lesson: |-
  Les **tests de mutation** mesurent la **force** des tests : l'outil introduit volontairement de petites erreurs dans le
  code (des **mutants**) et vérifie qu'au moins un test **échoue** pour chacune.

  Exemples de mutations :
  - `>=` devient `>` (une erreur de borne) ;
  - `a + b` devient `a - b` ;
  - une condition `if (x)` devient `if (true)` ou est niée ;
  - un `return valeur` devient `return 0` ou `return null` ;
  - un appel de méthode `void` est supprimé.

  Le vocabulaire :
  - un mutant **tué** : un test a échoué, il a détecté l'erreur ;
  - un mutant **survivant** : tous les tests passent malgré l'erreur, ils ne vérifient pas ce comportement ;
  - le **score de mutation** : la part des mutants tués.

  En Java, l'outil est **PIT** (*pitest*), avec un plugin Maven ou Gradle :

  ```
  mvn org.pitest:pitest-maven:mutationCoverage
  ```

  - PIT ne lance que les tests qui **couvrent** la ligne mutée, et analyse les modifications incrémentalement, mais
    l'analyse reste **coûteuse** : on la réserve aux modules **critiques** ou au code modifié dans une pull request.
  - Certains mutants sont **équivalents** : la mutation ne change pas le comportement (aucun test ne peut les tuer). On les
    ignore.
  - Un mutant survivant indique souvent une **assertion manquante** ou un **cas limite** non testé (la borne `>=`).
  - Là où la couverture dit « ce code est exécuté », la mutation dit « ce code est **vérifié** ».

  **Piège classique** : exiger un score de mutation de 100 %. Les mutants équivalents le rendent impossible, et l'on finit
  par écrire des tests artificiels ; on vise les survivants significatifs du code critique.

  **En entretien** : « PIT injecte des erreurs dans le code et vérifie qu'un test les détecte ; un mutant survivant révèle un
  test trop faible. C'est ce que la couverture ne mesure pas, mais c'est coûteux : sur le code critique. »
cards:
  - key: test-mutation
    format: course
    question: C'est quoi un test de mutation ?
    answer: Introduire des modifications dans le code et vérifier qu'un test échoue ; un mutant survivant révèle un test insuffisant (PIT).
  - key: survivant
    format: course
    question: Que signifie un mutant survivant ?
    answer: "Une modification du code qu'aucun test n'a détectée : les tests ne vérifient pas ce comportement (assertion manquante, cas limite non testé)."
  - key: equivalent
    format: course
    question: Qu'est-ce qu'un mutant équivalent ?
    answer: Une mutation qui ne change pas le comportement observable du programme ; aucun test ne peut la tuer, et on l'ignore.
  - key: cout
    format: course
    question: Pourquoi réserve-t-on les tests de mutation au code critique ?
    answer: Ils relancent les tests pour chaque mutant, ce qui coûte cher ; on les applique aux modules métier critiques ou au code modifié dans une pull request.
  - key: vf-tue
    format: true-false
    question: Un mutant est « tué » quand au moins un test échoue.
    truth: true
    answer: Les tests ont détecté l'erreur introduite.
  - key: vf-couverture
    format: true-false
    question: Une couverture de 100 % garantit un score de mutation de 100 %.
    truth: false
    answer: Des tests qui exécutent sans vérifier laissent survivre les mutants.
  - key: vf-score-100
    format: true-false
    question: Un score de mutation de 100 % est toujours atteignable.
    truth: false
    answer: Les mutants équivalents ne peuvent pas être tués.
  - key: vf-pit
    format: true-false
    question: PIT est l'outil de référence des tests de mutation en Java.
    truth: true
    answer: Il s'intègre à Maven et Gradle.
  - key: qcm-mutations
    format: multiple-choice
    question: Lesquelles sont des mutations typiques ?
    choices:
      - text: "Remplacer `>=` par `>`"
        correct: true
      - text: "Supprimer un appel de méthode `void`"
        correct: true
      - text: "Renommer une classe"
        correct: false
      - text: "Ajouter un commentaire"
        correct: false
    answer: Les mutations changent le comportement, pas la forme.
  - key: qcm-survivant
    format: multiple-choice
    question: "Le mutant `montant >= 100` → `montant > 100` survit. Que faut-il ajouter ?"
    choices:
      - text: "Un test avec un montant de 100 exactement"
        correct: true
      - text: "Un test avec un montant de 1 000"
        correct: false
      - text: "Un `@DisplayName`"
        correct: false
      - text: "Rien"
        correct: false
    answer: Seule la borne distingue les deux versions.
  - key: qcm-difference
    format: multiple-choice
    question: Que mesure la mutation que la couverture ne mesure pas ?
    choices:
      - text: "Si les tests détectent réellement les erreurs"
        correct: true
      - text: "Si le code est exécuté"
        correct: false
      - text: "La vitesse des tests"
        correct: false
      - text: "Le style du code"
        correct: false
    answer: La couverture dit « exécuté », la mutation dit « vérifié ».
  - key: qcm-usage
    format: multiple-choice
    question: Comment intégrer PIT raisonnablement dans un projet ?
    choices:
      - text: "Sur les modules métier critiques"
        correct: true
      - text: "Sur le code modifié dans les pull requests (analyse incrémentale)"
        correct: true
      - text: "Sur tout le projet à chaque commit, avec un seuil de 100 %"
        correct: false
      - text: "Uniquement sur le code généré"
        correct: false
    answer: Le coût et les mutants équivalents imposent de cibler.
  - key: scenario-introduire
    format: scenario
    question: Comment introduirais-tu les tests de mutation dans une équipe ?
    answer: |-
      Je commencerais par un module métier critique (le calcul des prix, par exemple), j'exécuterais PIT une fois et je
      montrerais les survivants concrets : une borne non testée, un résultat jamais vérifié. C'est plus parlant qu'un score.
      L'équipe corrige les tests sur les survivants significatifs. Ensuite, j'intégrerais PIT en analyse incrémentale sur
      les pull requests de ce module, sans seuil bloquant au début, puis avec un seuil raisonnable une fois l'habitude prise.
  - key: scenario-score
    format: scenario
    question: PIT affiche un score de mutation de 45 % alors que la couverture de lignes est de 90 %. Comment l'interprètes-tu ?
    answer: |-
      Le code est presque entièrement exécuté par les tests, mais plus de la moitié des erreurs introduites passent
      inaperçues : les tests exécutent sans vérifier assez (peu d'assertions, résultats non contrôlés, cas limites absents).
      Je lis les mutants survivants par classe, en priorité dans le code métier, et j'ajoute les assertions et les cas de
      bornes manquants. Ce décalage est exactement ce que les tests de mutation sont faits pour révéler.
  - key: scenario-lent
    format: scenario
    question: L'analyse PIT prend 40 minutes sur le projet. Comment la rendre exploitable ?
    answer: |-
      Je la cible : seulement les packages métier (filtres `targetClasses`), seulement les tests rapides (unitaires, sans
      conteneur), et en mode incrémental (historique d'analyse) pour ne muter que le code modifié. Sur les pull requests,
      l'analyse ne porte que sur les lignes changées ; l'analyse complète tourne la nuit. J'utilise plusieurs threads et des
      mutateurs choisis plutôt que tous. Une analyse qui ne tourne jamais ne sert à rien.
  - key: scenario-equivalent
    format: scenario
    question: Des développeurs écrivent des tests étranges pour tuer les derniers mutants. Que dis-tu ?
    answer: |-
      Que certains mutants ne doivent pas être tués : les mutants équivalents (la mutation ne change rien d'observable) ou
      ceux du code sans importance (journalisation, `toString`). Écrire des tests artificiels pour eux couple les tests à
      l'implémentation et nuit à leur lisibilité. On vise les survivants qui révèlent un vrai manque sur un comportement
      métier, on exclut le reste de l'analyse, et l'on ne fixe pas de seuil à 100 %.
