notion: mockito-bases
lesson: |-
  **Mockito** crée des doublures à partir d'une interface ou d'une classe : on programme leurs réponses (**stubbing**) et on
  vérifie leurs appels (**verify**).

  ```java
  @ExtendWith(MockitoExtension.class)
  class InscriptionServiceTest {

      @Mock ClientRepository clients;            // une doublure
      @Mock Notificateur notificateur;
      @InjectMocks InscriptionService service;   // la classe testée, construite avec les mocks

      @Test
      void inscritUnNouveauClientEtLeNotifie() {
          when(clients.existe("ada@exemple.org")).thenReturn(false);       // stubbing

          service.inscrire("ada@exemple.org");

          verify(clients).enregistrer(any(Client.class));                 // vérification
          verify(notificateur).envoyerBienvenue("ada@exemple.org");
          verifyNoMoreInteractions(notificateur);
      }

      @Test
      void refuseUnEmailDejaInscrit() {
          when(clients.existe("ada@exemple.org")).thenReturn(true);

          assertThrows(DejaInscritException.class, () -> service.inscrire("ada@exemple.org"));
          verify(clients, never()).enregistrer(any());
      }
  }
  ```

  - Un mock non programmé renvoie des **valeurs par défaut** : `null`, 0, `false`, une collection ou un `Optional` vide.
  - `when(...).thenReturn(...)`, `thenThrow(...)`, `thenAnswer(...)` programment les réponses ; on peut enchaîner
    plusieurs réponses (`thenReturn(1, 2, 3)`).
  - `verify(mock).methode(...)`, `verify(mock, times(2))`, `never()`, `atLeastOnce()` vérifient les appels.
  - Les **matchers** (`any()`, `eq(...)`, `argThat(...)`) assouplissent les arguments ; si l'un est un matcher, **tous**
    doivent l'être.
  - Le mode **strict** (par défaut avec `MockitoExtension`) signale un stub inutilisé
    (`UnnecessaryStubbingException`) : le test est trompeur ou obsolète.
  - **Injection par constructeur** dans la classe testée : `@InjectMocks` fonctionne, mais construire l'objet soi-même
    (`new InscriptionService(clients, notificateur)`) est plus explicite.

  **Piège classique** : stubber ce qu'on vérifie ensuite (`when(x.calculer()).thenReturn(5); ... assertEquals(5,
  x.calculer())`). Le test ne vérifie que Mockito lui-même, pas le code.

  **En entretien** : « `@Mock` et `when(...).thenReturn` pour préparer, `verify` pour vérifier les appels qui sont l'effet
  attendu ; des matchers cohérents, et le mode strict qui signale les stubs inutiles. »
cards:
  - key: unnecessarystubbingexception
    format: course
    question: "Que signale l'`UnnecessaryStubbingException` de Mockito ?"
    choices:
      - {text: "Un stub jamais utilisé, refusé par le mode strict de Mockito", correct: true}
      - {text: "Un mock créé mais jamais injecté dans la classe testée", correct: false}
      - {text: "Une méthode programmée deux fois avec deux réponses différentes", correct: false}
      - {text: "Un `verify` sur une méthode qui n'a jamais été programmée", correct: false}
    answer: "L'erreur du mode strict de Mockito pour un stub jamais utilisé par le test : il induit le lecteur en erreur, ou révèle un chemin qui n'est pas celui qu'on croyait."
  - key: defaut
    format: course
    question: Que renvoie une méthode d'un mock qui n'a pas été programmée ?
    choices:
      - {text: "Une valeur par défaut : `null`, 0, `false`, ou une collection vide", correct: true}
      - {text: "Elle lève une `UnsupportedOperationException` à l'appel", correct: false}
      - {text: "Elle appelle la vraie méthode de la classe doublée", correct: false}
      - {text: "Elle renvoie toujours `null`, même pour une collection", correct: false}
    answer: "Une valeur par défaut : `null` pour un objet, 0, `false`, et une collection, un `Optional` ou un stream vides. Appeler la vraie méthode, c'est le comportement d'un spy."
  - key: matchers
    format: course
    question: "Quelle règle s'applique aux matchers de Mockito, comme `any()` ou `eq()` ?"
    choices:
      - {text: "Si un argument utilise un matcher, tous les arguments de l'appel doivent en utiliser un", correct: true}
      - {text: "Un matcher ne s'utilise que dans `verify`, jamais dans un `when`", correct: false}
      - {text: "On ne peut utiliser qu'un seul matcher par appel de méthode", correct: false}
      - {text: "`any()` ne s'applique qu'aux objets, jamais aux types primitifs", correct: false}
    answer: Si un argument utilise un matcher (`any()`, `eq()`), tous les arguments de l'appel doivent en utiliser un ; sinon Mockito lève `InvalidUseOfMatchersException`.
  - key: verify-never
    format: course
    question: "Comment vérifier avec Mockito qu'une méthode n'a jamais été appelée ?"
    choices:
      - {text: "`verify(mock, never()).methode(...)`", correct: true}
      - {text: "`verify(mock, times(1)).methode(...)`", correct: false}
      - {text: "`verify(mock).methode(never())`", correct: false}
      - {text: "`when(mock.methode(...)).thenReturn(null)`", correct: false}
    answer: "`verify(mock, never()).methode(...)` : `never()` vaut `times(0)`. Il se passe en second argument de `verify`, pas comme argument de la méthode."
  - key: vf-defaut-null
    format: true-false
    question: "Une méthode non programmée d'un mock qui renvoie une `List` renvoie `null`."
    truth: false
    answer: Elle renvoie une liste vide.
  - key: vf-matchers
    format: true-false
    question: "`when(repo.chercher(any(), \"ada\"))` est valide."
    truth: false
    answer: Il faut `eq("ada")` dès qu'un autre argument est un matcher.
  - key: vf-strict
    format: true-false
    question: Avec `MockitoExtension`, un stub inutilisé fait échouer le test.
    truth: true
    answer: C'est le mode strict, qui signale les tests trompeurs.
  - key: vf-stub-verify
    format: true-false
    question: Il est utile de vérifier avec `verify` un appel qu'on a déjà stubbé et dont le résultat est utilisé.
    truth: false
    answer: Si le résultat est utilisé, le comportement observable le prouve déjà.
  - key: qcm-vocabulaire
    format: multiple-choice
    question: "Quelle association entre méthode Mockito et rôle est correcte ?"
    choices:
      - {text: "`verify(...)` : vérifier un appel", correct: true}
      - {text: "`any()` : vérifier qu'aucun appel n'a eu lieu", correct: false}
      - {text: "`thenThrow` : vérifier une exception levée par la classe testée", correct: false}
      - {text: "`when(...)` : vérifier qu'une méthode a été appelée", correct: false}
    answer: "`verify` vérifie un appel, et `when(...).thenReturn(...)` programme une réponse. `thenThrow` fait lever une exception par le mock, et `never()` vérifie l'absence d'appel."
  - key: qcm-nombre
    format: multiple-choice
    question: Comment vérifier qu'un e-mail a été envoyé exactement deux fois ?
    choices:
      - text: "`verify(mailer, times(2)).envoyer(any())`"
        correct: true
      - text: "`verify(mailer).envoyer(any()); verify(mailer).envoyer(any());`"
        correct: false
      - text: "`assertEquals(2, mailer.envoyer(any()))`"
        correct: false
      - text: "`verify(mailer, twice())`"
        correct: false
    answer: '`verify(mock)` équivaut à `times(1)`.'
  - key: qcm-exception
    format: multiple-choice
    question: "Comment simuler une panne du repository sur sa méthode `trouver`, qui renvoie une valeur ?"
    choices:
      - {text: "`when(repo.trouver(42)).thenThrow(new BaseIndisponibleException())`", correct: true}
      - {text: "`when(repo.trouver(42)).thenReturn(new BaseIndisponibleException())`", correct: false}
      - {text: "`assertThrows(BaseIndisponibleException.class, () -> repo.trouver(42))`", correct: false}
      - {text: "`verify(repo).trouver(42).thenThrow(new BaseIndisponibleException())`", correct: false}
    answer: "`thenThrow` fait lever l'exception au mock quand on l'appelle. Pour une méthode `void`, on écrit `doThrow(...).when(repo).enregistrer(any())`. `assertThrows` sur le mock testerait Mockito, pas le code."
  - key: qcm-piege
    format: multiple-choice
    question: "Que vérifie `when(calc.total()).thenReturn(10); assertEquals(10, calc.total());` si `calc` est un mock ?"
    choices:
      - {text: "Seulement que Mockito fonctionne, rien du code de production", correct: true}
      - {text: "Que le calcul du total est juste, avec la valeur 10", correct: false}
      - {text: "Que la méthode `total` est appelée exactement une fois", correct: false}
      - {text: "Rien, car ce code ne compile pas avec un mock", correct: false}
    answer: On ne teste jamais un mock ; on teste la classe qui l'utilise.
  - key: trous-when
    format: fill-in
    question: |-
      Complète pour programmer la réponse :
      ```java
      ___(tarifs.prix("A1")).thenReturn(150);
      ```
    blanks: [[when]]
    answer: Le point de départ du stubbing.
  - key: trous-verify
    format: fill-in
    question: |-
      Complète pour vérifier l'appel :
      ```java
      ___(notificateur).envoyerBienvenue("ada@exemple.org");
      ```
    blanks: [[verify]]
    answer: Vérifie un appel, une fois par défaut.
  - key: trous-never
    format: fill-in
    question: |-
      Complète pour vérifier qu'aucune commande n'a été enregistrée :
      ```java
      verify(commandes, ___()).enregistrer(any());
      ```
    blanks: [[never]]
    answer: Aucun appel attendu.
  - key: trous-mock
    format: fill-in
    question: |-
      Complète pour déclarer une doublure avec l'extension Mockito :
      ```java
      @___ ClientRepository clients;
      ```
    blanks: [[Mock]]
    answer: Créée par `MockitoExtension`.
  - key: bug-tester-mock
    format: bug-fix
    question: |-
      Ce test ne vérifie rien du code de production. Quelle correction est la bonne ?
      ```java
      @Mock Calculateur calc;
      @Test void calculeLeTotal() {
          when(calc.total(panier)).thenReturn(380);
          assertEquals(380, calc.total(panier));
      }
      ```
    choices:
      - {text: "Tester un vrai `Calculateur`, en ne doublant que ses dépendances", correct: true}
      - {text: "Ajouter `verify(calc).total(panier)` après l'assertion", correct: false}
      - {text: "Remplacer `@Mock` par `@Spy` sur le `Calculateur`", correct: false}
      - {text: "Programmer `thenReturn(381)` pour vérifier que le test échoue", correct: false}
    answer: |-
      ```java
      @Mock Tarifs tarifs;
      @Test void calculeLeTotal() {
          when(tarifs.prix("pomme")).thenReturn(150);
          Calculateur calc = new Calculateur(tarifs);
          assertEquals(300, calc.total(panierAvecDeuxPommes()));
      }
      ```
      On ne teste jamais un mock : on teste la vraie classe, en doublant seulement ses dépendances.
  - key: bug-matchers
    format: bug-fix
    question: |-
      Ce stub lève `InvalidUseOfMatchersException`. Quelle correction est la bonne ?
      ```java
      when(repo.chercher(any(), "ada")).thenReturn(List.of(client));
      ```
    choices:
      - {text: "`when(repo.chercher(any(), eq(\"ada\"))).thenReturn(List.of(client));`", correct: true}
      - {text: "`when(repo.chercher(any(), any(\"ada\"))).thenReturn(List.of(client));`", correct: false}
      - {text: "`when(repo.chercher(any(), \"ada\")).thenAnswer(i -> List.of(client));`", correct: false}
      - {text: "`doReturn(List.of(client)).when(repo).chercher(any(), \"ada\");`", correct: false}
    answer: |-
      ```java
      when(repo.chercher(any(), eq("ada"))).thenReturn(List.of(client));
      ```
      Dès qu'un argument est un matcher, tous doivent l'être : `eq` enveloppe la valeur exacte.
  - key: bug-stub-inutile
    format: bug-fix
    question: |-
      Le test échoue avec `UnnecessaryStubbingException`. Quelle correction est la bonne ?
      ```java
      when(clients.existe(any())).thenReturn(false);
      when(clients.trouver(any())).thenReturn(Optional.empty());   // jamais appelé par ce chemin
      service.inscrire("ada@exemple.org");
      ```
    choices:
      - {text: "Retirer le stub de `trouver`, que ce chemin n'utilise pas", correct: true}
      - {text: "Passer toute la classe de test en mode `lenient`", correct: false}
      - {text: "Ajouter `verify(clients).trouver(any())` à la fin du test", correct: false}
      - {text: "Déplacer les deux stubs dans un `@BeforeEach` commun", correct: false}
    answer: |-
      ```java
      when(clients.existe(any())).thenReturn(false);
      service.inscrire("ada@exemple.org");
      ```
      Le second stub n'est pas utilisé par ce scénario : il induit le lecteur en erreur. On le retire (ou, s'il devait
      servir, le test révèle un chemin non emprunté).
  - key: bug-verify-tout
    format: bug-fix
    question: |-
      Ce test casse à chaque réorganisation interne du service. Quelle correction est la bonne ?
      ```java
      verify(repo).trouver(42);
      verify(calculateur).appliquerRemise(any());
      verify(calculateur).arrondir(any());
      verify(repo).enregistrer(any());
      ```
    choices:
      - {text: "Vérifier le résultat observable (la commande enregistrée), pas chaque appel interne", correct: true}
      - {text: "Ajouter un `inOrder` pour fixer l'ordre des appels vérifiés une fois pour toutes", correct: false}
      - {text: "Remplacer chaque `verify` par `verify(..., atLeast(0))`, plus tolérant", correct: false}
      - {text: "Ajouter `verifyNoMoreInteractions` pour couvrir aussi les autres appels", correct: false}
    answer: |-
      ```java
      Commande enregistree = fakeRepo.trouver(42).orElseThrow();
      assertEquals(new BigDecimal("90.00"), enregistree.total());
      ```
      Les `verify` décrivaient l'implémentation pas à pas. On vérifie plutôt le résultat observable (ici avec un fake),
      et l'on garde `verify` pour les effets qui sont des appels (une notification).
