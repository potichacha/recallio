notion: mockito-bases
lesson: |-
  **Mockito** crée des doublures à partir d'une interface ou d'une classe : on programme leurs réponses (**stubbing**) et on
  vérifie leurs appels (**verify**).

  ```java
  @ExtendWith(MockitoExtension.class)
  class InscriptionServiceTest {

      @Mock ClientRepository clients;            // une doublure
      @Mock Notificateur notificateur;
      @InjectMocks InscriptionService service;   // la classe testée, construite avec les mocks

      @Test
      void inscritUnNouveauClientEtLeNotifie() {
          when(clients.existe("ada@exemple.org")).thenReturn(false);       // stubbing

          service.inscrire("ada@exemple.org");

          verify(clients).enregistrer(any(Client.class));                 // vérification
          verify(notificateur).envoyerBienvenue("ada@exemple.org");
          verifyNoMoreInteractions(notificateur);
      }

      @Test
      void refuseUnEmailDejaInscrit() {
          when(clients.existe("ada@exemple.org")).thenReturn(true);

          assertThrows(DejaInscritException.class, () -> service.inscrire("ada@exemple.org"));
          verify(clients, never()).enregistrer(any());
      }
  }
  ```

  - Un mock non programmé renvoie des **valeurs par défaut** : `null`, 0, `false`, une collection ou un `Optional` vide.
  - `when(...).thenReturn(...)`, `thenThrow(...)`, `thenAnswer(...)` programment les réponses ; on peut enchaîner
    plusieurs réponses (`thenReturn(1, 2, 3)`).
  - `verify(mock).methode(...)`, `verify(mock, times(2))`, `never()`, `atLeastOnce()` vérifient les appels.
  - Les **matchers** (`any()`, `eq(...)`, `argThat(...)`) assouplissent les arguments ; si l'un est un matcher, **tous**
    doivent l'être.
  - Le mode **strict** (par défaut avec `MockitoExtension`) signale un stub inutilisé
    (`UnnecessaryStubbingException`) : le test est trompeur ou obsolète.
  - **Injection par constructeur** dans la classe testée : `@InjectMocks` fonctionne, mais construire l'objet soi-même
    (`new InscriptionService(clients, notificateur)`) est plus explicite.

  **Piège classique** : stubber ce qu'on vérifie ensuite (`when(x.calculer()).thenReturn(5); ... assertEquals(5,
  x.calculer())`). Le test ne vérifie que Mockito lui-même, pas le code.

  **En entretien** : « `@Mock` et `when(...).thenReturn` pour préparer, `verify` pour vérifier les appels qui sont l'effet
  attendu ; des matchers cohérents, et le mode strict qui signale les stubs inutiles. »
cards:
  - key: unnecessarystubbingexception
    format: course
    question: C'est quoi UnnecessaryStubbingException ?
    answer: L'erreur du mode strict de Mockito pour un stub jamais utilisé.
  - key: defaut
    format: course
    question: Que renvoie une méthode d'un mock qui n'a pas été programmée ?
    answer: "Une valeur par défaut : `null` pour un objet, 0, `false`, et une collection, un `Optional` ou un stream vides."
  - key: matchers
    format: course
    question: Quelle règle s'applique aux matchers de Mockito ?
    answer: Si un argument utilise un matcher (`any()`, `eq()`), tous les arguments de l'appel doivent en utiliser un ; sinon Mockito lève `InvalidUseOfMatchersException`.
  - key: verify-never
    format: course
    question: Comment vérifier qu'une méthode n'a jamais été appelée ?
    answer: Avec `verify(mock, never()).methode(...)`.
  - key: vf-defaut-null
    format: true-false
    question: "Une méthode non programmée d'un mock qui renvoie une `List` renvoie `null`."
    truth: false
    answer: Elle renvoie une liste vide.
  - key: vf-matchers
    format: true-false
    question: "`when(repo.chercher(any(), \"ada\"))` est valide."
    truth: false
    answer: Il faut `eq("ada")` dès qu'un autre argument est un matcher.
  - key: vf-strict
    format: true-false
    question: Avec `MockitoExtension`, un stub inutilisé fait échouer le test.
    truth: true
    answer: C'est le mode strict, qui signale les tests trompeurs.
  - key: vf-stub-verify
    format: true-false
    question: Il est utile de vérifier avec `verify` un appel qu'on a déjà stubbé et dont le résultat est utilisé.
    truth: false
    answer: Si le résultat est utilisé, le comportement observable le prouve déjà.
  - key: qcm-vocabulaire
    format: multiple-choice
    question: Associez correctement la méthode Mockito et son rôle.
    choices:
      - text: "`when(...).thenReturn(...)` : programmer une réponse"
        correct: true
      - text: "`verify(...)` : vérifier un appel"
        correct: true
      - text: "`any()` : vérifier qu'aucun appel n'a eu lieu"
        correct: false
      - text: "`thenThrow` : vérifier une exception levée par la classe testée"
        correct: false
    answer: '`thenThrow` fait lever une exception par le mock.'
  - key: qcm-nombre
    format: multiple-choice
    question: Comment vérifier qu'un e-mail a été envoyé exactement deux fois ?
    choices:
      - text: "`verify(mailer, times(2)).envoyer(any())`"
        correct: true
      - text: "`verify(mailer).envoyer(any()); verify(mailer).envoyer(any());`"
        correct: false
      - text: "`assertEquals(2, mailer.envoyer(any()))`"
        correct: false
      - text: "`verify(mailer, twice())`"
        correct: false
    answer: '`verify(mock)` équivaut à `times(1)`.'
  - key: qcm-exception
    format: multiple-choice
    question: Comment simuler une panne du repository ?
    choices:
      - text: "`when(repo.trouver(42)).thenThrow(new BaseIndisponibleException())`"
        correct: true
      - text: "`doThrow(new BaseIndisponibleException()).when(repo).enregistrer(any())` pour une méthode `void`"
        correct: true
      - text: "`verify(repo).thenThrow(...)`"
        correct: false
      - text: "`assertThrows` sur le mock"
        correct: false
    answer: '`doThrow` sert aux méthodes `void`.'
  - key: qcm-piege
    format: multiple-choice
    question: "Que vérifie `when(calc.total()).thenReturn(10); assertEquals(10, calc.total());` si `calc` est un mock ?"
    choices:
      - text: "Seulement que Mockito fonctionne, rien du code de production"
        correct: true
      - text: "Que le calcul du total est juste"
        correct: false
      - text: "Que `total` est appelée une fois"
        correct: false
      - text: "Ne compile pas"
        correct: false
    answer: On ne teste jamais un mock ; on teste la classe qui l'utilise.
  - key: trous-when
    format: fill-in
    question: |-
      Complétez pour programmer la réponse :
      ```java
      ___(tarifs.prix("A1")).thenReturn(150);
      ```
    blanks: [[when]]
    answer: Le point de départ du stubbing.
  - key: trous-verify
    format: fill-in
    question: |-
      Complétez pour vérifier l'appel :
      ```java
      ___(notificateur).envoyerBienvenue("ada@exemple.org");
      ```
    blanks: [[verify]]
    answer: Vérifie un appel, une fois par défaut.
  - key: trous-never
    format: fill-in
    question: |-
      Complétez pour vérifier qu'aucune commande n'a été enregistrée :
      ```java
      verify(commandes, ___()).enregistrer(any());
      ```
    blanks: [[never]]
    answer: Aucun appel attendu.
  - key: trous-mock
    format: fill-in
    question: |-
      Complétez pour déclarer une doublure avec l'extension Mockito :
      ```java
      @___ ClientRepository clients;
      ```
    blanks: [[Mock]]
    answer: Créée par `MockitoExtension`.
  - key: bug-tester-mock
    format: bug-fix
    question: |-
      Ce test ne vérifie rien du code de production :
      ```java
      @Mock Calculateur calc;
      @Test void calculeLeTotal() {
          when(calc.total(panier)).thenReturn(380);
          assertEquals(380, calc.total(panier));
      }
      ```
    answer: |-
      ```java
      @Mock Tarifs tarifs;
      @Test void calculeLeTotal() {
          when(tarifs.prix("pomme")).thenReturn(150);
          Calculateur calc = new Calculateur(tarifs);
          assertEquals(300, calc.total(panierAvecDeuxPommes()));
      }
      ```
      On ne teste jamais un mock : on teste la vraie classe, en doublant seulement ses dépendances.
  - key: bug-matchers
    format: bug-fix
    question: |-
      Ce stub lève `InvalidUseOfMatchersException` :
      ```java
      when(repo.chercher(any(), "ada")).thenReturn(List.of(client));
      ```
    answer: |-
      ```java
      when(repo.chercher(any(), eq("ada"))).thenReturn(List.of(client));
      ```
      Dès qu'un argument est un matcher, tous doivent l'être : `eq` enveloppe la valeur exacte.
  - key: bug-stub-inutile
    format: bug-fix
    question: |-
      Le test échoue avec `UnnecessaryStubbingException` :
      ```java
      when(clients.existe(any())).thenReturn(false);
      when(clients.trouver(any())).thenReturn(Optional.empty());   // jamais appelé par ce chemin
      service.inscrire("ada@exemple.org");
      ```
    answer: |-
      ```java
      when(clients.existe(any())).thenReturn(false);
      service.inscrire("ada@exemple.org");
      ```
      Le second stub n'est pas utilisé par ce scénario : il induit le lecteur en erreur. On le retire (ou, s'il devait
      servir, le test révèle un chemin non emprunté).
  - key: bug-verify-tout
    format: bug-fix
    question: |-
      Ce test casse à chaque réorganisation interne du service :
      ```java
      verify(repo).trouver(42);
      verify(calculateur).appliquerRemise(any());
      verify(calculateur).arrondir(any());
      verify(repo).enregistrer(any());
      ```
    answer: |-
      ```java
      Commande enregistree = fakeRepo.trouver(42).orElseThrow();
      assertEquals(new BigDecimal("90.00"), enregistree.total());
      ```
      Les `verify` décrivaient l'implémentation pas à pas. On vérifie plutôt le résultat observable (ici avec un fake),
      et l'on garde `verify` pour les effets qui sont des appels (une notification).
