notion: junit-parametres
lesson: |-
  Un **test paramétré** exécute la même vérification sur **plusieurs jeux de données** : chaque jeu est un cas affiché
  séparément dans le rapport.

  ```java
  @ParameterizedTest
  @ValueSource(strings = {"", " ", "\t"})
  void refuseUnNomVide(String nom) {
      assertThrows(IllegalArgumentException.class, () -> new Client(nom));
  }

  @ParameterizedTest(name = "{0} jours d''inactivité → streak {1}")
  @CsvSource({
      "0, 5",
      "1, 0",
      "3, 0"
  })
  void calculeLeStreak(int joursManques, int streakAttendu) {
      assertEquals(streakAttendu, Streak.apres(5, joursManques));
  }

  @ParameterizedTest
  @EnumSource(value = Note.class, names = {"FACILE", "BIEN"})
  void lesBonnesNotesAllongentLIntervalle(Note note) { ... }

  @ParameterizedTest
  @MethodSource("commandesInvalides")
  void refuseLesCommandesInvalides(Commande c, String raison) { ... }

  static Stream<Arguments> commandesInvalides() {
      return Stream.of(
              Arguments.of(commandeSansLigne(), "aucune ligne"),
              Arguments.of(commandeMontantNegatif(), "montant négatif"));
  }
  ```

  Les sources :
  - `@ValueSource` : une liste de valeurs simples (`ints`, `strings`...) ;
  - `@CsvSource` / `@CsvFileSource` : plusieurs colonnes, converties vers les types des paramètres ;
  - `@EnumSource` : les constantes d'une enum (toutes, ou filtrées) ;
  - `@MethodSource` : une méthode qui fournit des `Arguments` (objets complexes) ;
  - `@NullSource`, `@EmptySource`, `@NullAndEmptySource` : les cas `null` et vide.

  - Le **nom** (`name = "..."`) rend chaque cas lisible dans le rapport.
  - Les tests paramétrés conviennent aux **règles** à vérifier sur des valeurs limites (bornes, cas vides, équivalences) ;
    ils deviennent illisibles s'ils mélangent des comportements différents avec des `if` dans le test.

  **Piège classique** : un test paramétré qui contient un `if` sur ses paramètres pour vérifier deux comportements
  différents. On en fait deux tests, chacun paramétré sur son cas.

  **En entretien** : « `@ParameterizedTest` avec `@ValueSource`, `@CsvSource`, `@EnumSource` ou `@MethodSource` ; un cas
  par jeu de données, nommé, pour les valeurs limites d'une même règle. »
cards:
  - key: ecrire-test-parametre
    format: course
    question: Comment écrire un test paramétré ?
    answer: '@ParameterizedTest avec @ValueSource, @CsvSource, @MethodSource ou @EnumSource.'
  - key: method-source
    format: course
    question: Quand utiliser `@MethodSource` ?
    answer: "Quand les données sont des objets complexes ou calculées : une méthode statique renvoie un `Stream<Arguments>` (ou une collection) fourni au test."
  - key: null-empty
    format: course
    question: Comment ajouter les cas `null` et vide à un test paramétré sur des chaînes ?
    answer: Avec `@NullAndEmptySource` (ou `@NullSource` et `@EmptySource`), combinable avec `@ValueSource`.
  - key: quand
    format: course
    question: Quand un test paramétré est-il approprié ?
    answer: Pour vérifier une même règle sur plusieurs valeurs (bornes, classes d'équivalence, cas vides) ; pas pour mélanger des comportements différents.
  - key: vf-rapport
    format: true-false
    question: Chaque jeu de données d'un test paramétré apparaît comme un cas séparé dans le rapport.
    truth: true
    answer: Un échec désigne précisément le jeu concerné.
  - key: vf-csv-conversion
    format: true-false
    question: "`@CsvSource` convertit automatiquement les valeurs vers les types des paramètres (`int`, enum...)."
    truth: true
    answer: Pour les types simples ; un convertisseur peut être ajouté pour les autres.
  - key: vf-test
    format: true-false
    question: Une méthode `@ParameterizedTest` doit aussi être annotée `@Test`.
    truth: false
    answer: '`@ParameterizedTest` remplace `@Test`.'
  - key: vf-if
    format: true-false
    question: Un `if` sur les paramètres pour vérifier deux comportements différents est une bonne pratique.
    truth: false
    answer: On écrit deux tests, chacun sur son comportement.
  - key: qcm-sources
    format: multiple-choice
    question: Associez correctement source et usage.
    choices:
      - text: "`@EnumSource` : chaque constante d'une enum"
        correct: true
      - text: "`@CsvSource` : plusieurs colonnes par cas"
        correct: true
      - text: "`@ValueSource` : des objets métier complexes"
        correct: false
      - text: "`@MethodSource` : uniquement des chaînes"
        correct: false
    answer: Les objets complexes passent par `@MethodSource`.
  - key: qcm-nom
    format: multiple-choice
    question: Comment rendre lisible le nom de chaque cas dans le rapport ?
    choices:
      - text: "`@ParameterizedTest(name = \"{0} → {1}\")`"
        correct: true
      - text: "`@DisplayName` sur chaque valeur de `@ValueSource`"
        correct: false
      - text: "Ce n'est pas possible"
        correct: false
      - text: "Renommer la méthode à chaque exécution"
        correct: false
    answer: '`{0}`, `{1}` désignent les arguments.'
  - key: qcm-bornes
    format: multiple-choice
    question: Une remise s'applique à partir de 100 €. Quelles valeurs tester ?
    choices:
      - text: "99,99 € et 100 €, de part et d'autre de la borne"
        correct: true
      - text: "0 € et un montant très élevé"
        correct: true
      - text: "Uniquement 50 €"
        correct: false
      - text: "Uniquement 100 €"
        correct: false
    answer: Les erreurs se cachent aux bornes.
  - key: qcm-null
    format: multiple-choice
    question: Quelle source fournit à la fois `null` et une chaîne vide ?
    choices:
      - text: "`@NullAndEmptySource`"
        correct: true
      - text: "`@ValueSource(strings = {null, \"\"})`"
        correct: false
      - text: "`@EmptySource` seul"
        correct: false
      - text: "`@NullSource` seul"
        correct: false
    answer: Une annotation ne peut pas contenir `null` dans `@ValueSource`.
  - key: trous-annotation
    format: fill-in
    question: |-
      Complétez :
      ```java
      @___
      @ValueSource(ints = {-1, 0})
      void refuseUneQuantiteNonPositive(int q) { ... }
      ```
    blanks: [[ParameterizedTest]]
    answer: Elle remplace `@Test`.
  - key: trous-csv
    format: fill-in
    question: |-
      Complétez la source à deux colonnes :
      ```java
      @ParameterizedTest
      @___({"100, 120", "50, 60"})
      void calculeLeTtc(int ht, int ttc) { assertEquals(ttc, Tva.ttc(ht)); }
      ```
    blanks: [[CsvSource]]
    answer: Chaque chaîne est une ligne.
  - key: trous-enum
    format: fill-in
    question: |-
      Complétez pour tester chaque statut :
      ```java
      @ParameterizedTest
      @___(Statut.class)
      void chaqueStatutALibelle(Statut s) { assertNotNull(s.libelle()); }
      ```
    blanks: [[EnumSource]]
    answer: Toutes les constantes, sauf filtre.
  - key: trous-method
    format: fill-in
    question: |-
      Complétez pour fournir des objets construits par une méthode :
      ```java
      @ParameterizedTest
      @___("cas")
      void valide(Commande c) { ... }
      ```
    blanks: [[MethodSource]]
    answer: La méthode `cas()` renvoie les arguments.
