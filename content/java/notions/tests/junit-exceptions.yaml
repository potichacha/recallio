notion: junit-exceptions
lesson: |-
  Pour vérifier qu'un code lève une exception, JUnit fournit **`assertThrows`** : il exécute un bloc, vérifie le type de
  l'exception levée et la **renvoie** pour qu'on en vérifie le contenu.

  ```java
  @Test
  void refuseUnRetraitSuperieurAuSolde() {
      Compte compte = new Compte(100);

      SoldeInsuffisantException e = assertThrows(SoldeInsuffisantException.class,
              () -> compte.retirer(150));

      assertEquals(100, e.soldeDisponible());
      assertEquals("solde insuffisant : 100 < 150", e.getMessage());
  }

  @Test
  void unDepotPositifNeLevePasDException() {
      assertDoesNotThrow(() -> compte.deposer(50));
  }
  ```

  - `assertThrows(Type.class, ...)` réussit si l'exception est de ce type **ou d'un sous-type** ;
    `assertThrowsExactly` exige le type exact.
  - Le bloc doit contenir **seulement l'appel testé** : si la préparation lève la même exception, le test passe pour une
    mauvaise raison.
  - On vérifie aussi le **contenu** de l'exception (message, champs, cause) quand il fait partie du contrat.
  - Si aucune exception n'est levée, `assertThrows` échoue avec un message explicite.
  - AssertJ propose une écriture fluide : `assertThatThrownBy(() -> compte.retirer(150))
    .isInstanceOf(SoldeInsuffisantException.class).hasMessageContaining("insuffisant")`.
  - Les anciens motifs (`@Test(expected = ...)` de JUnit 4, ou un `try { ...; fail(); } catch`) sont à remplacer.

  **Piège classique** : un bloc `assertThrows` qui englobe toute la préparation. Une `IllegalArgumentException` levée par un
  constructeur mal appelé fait passer un test qui devait vérifier une validation plus loin.

  **En entretien** : « `assertThrows` avec le seul appel testé dans le bloc, puis des assertions sur l'exception renvoyée ;
  `assertThrowsExactly` si le type exact compte. »
tour:
  - title: Tester une exception
    text: |-
      Pour vérifier qu'un code **lève** bien une exception, JUnit offre `assertThrows` : il exécute un lambda, échoue
      s'il ne lève rien, et renvoie l'exception pour qu'on vérifie son message.

      ```java
      @Test
      void shouldRefuseANegativeAmount() {
          var e = assertThrows(IllegalArgumentException.class, () -> compte.retire(-5));
          assertEquals("montant négatif : -5", e.getMessage());
      }
      ```

      Ce programme écrit son propre `assertThrows`, pour montrer ce qu'il fait.
    example:
      files:
        Main.java: |-
          <T extends Throwable> T assertThrows(Class<T> attendue, Runnable code) {
              try {
                  code.run();
              } catch (Throwable levee) {
                  if (attendue.isInstance(levee)) {
                      return attendue.cast(levee);
                  }
                  throw new AssertionError("attendu " + attendue.getSimpleName() + ", levé " + levee);
              }
              throw new AssertionError("aucune exception levée");
          }

          void retire(int montant) {
              if (montant < 0) {
                  throw new IllegalArgumentException("montant négatif : " + montant);
              }
          }

          void main() {
              var e = assertThrows(IllegalArgumentException.class, () -> retire(-5));
              IO.println(e.getMessage());
              try {
                  assertThrows(IllegalArgumentException.class, () -> retire(5));
              } catch (AssertionError echec) {
                  IO.println("échec du test : " + echec.getMessage());
              }
          }
      output: |-
        montant négatif : -5
        échec du test : aucune exception levée
cards:
  - key: assert-throws
    format: course
    question: Comment tester qu'une méthode lève une exception avec JUnit Jupiter ?
    choices:
      - {text: "Avec `assertThrows(Type.class, () -> appel())`, qui renvoie l'exception levée", correct: true}
      - {text: "Avec `@Test(expected = Type.class)` placé sur la méthode de test", correct: false}
      - {text: "Avec un `try` autour de l'appel et `assertTrue(true)` dans le `catch`", correct: false}
      - {text: "Avec `assertEquals(Type.class, appel())`, qui compare le type renvoyé", correct: false}
    answer: "Avec `assertThrows(TypeException.class, () -> appel())`, qui renvoie l'exception pour en vérifier le message ou les champs. `@Test(expected = ...)` est la syntaxe de JUnit 4, absente de Jupiter."
  - key: exactly
    format: course
    question: Quelle différence entre `assertThrows` et `assertThrowsExactly` ?
    choices:
      - {text: "`assertThrows` accepte aussi un sous-type ; `assertThrowsExactly` exige ce type précis", correct: true}
      - {text: "`assertThrows` exige ce type précis ; `assertThrowsExactly` accepte aussi un sous-type", correct: false}
      - {text: "`assertThrowsExactly` vérifie aussi le message ; `assertThrows`, seulement le type", correct: false}
      - {text: "Aucune : `assertThrowsExactly` est l'ancien nom, gardé pour compatibilité", correct: false}
    answer: '`assertThrows` accepte le type indiqué ou un sous-type ; `assertThrowsExactly` exige exactement ce type.'
  - key: bloc-minimal
    format: course
    question: Pourquoi le bloc passé à `assertThrows` doit-il ne contenir que l'appel testé ?
    choices:
      - {text: "Si la préparation lève la même exception, le test passe sans vérifier l'appel voulu", correct: true}
      - {text: "Parce qu'un bloc de plusieurs lignes ne compile pas dans une lambda", correct: false}
      - {text: "Parce que `assertThrows` n'exécute que la première instruction du bloc", correct: false}
      - {text: "Pour que le test s'exécute plus vite, le bloc étant compilé à part", correct: false}
    answer: Si la préparation lève la même exception, le test passe pour une mauvaise raison et ne vérifie plus le comportement voulu.
  - key: contenu
    format: course
    question: Que vérifier en plus du type de l'exception ?
    choices:
      - {text: "Son message, ses champs ou sa cause, quand ils font partie du contrat", correct: true}
      - {text: "Rien : le type suffit toujours à prouver le comportement attendu", correct: false}
      - {text: "Sa pile d'appels complète, comparée ligne par ligne à une référence", correct: false}
      - {text: "Le nom du thread qui l'a levée, pour les tests concurrents", correct: false}
    answer: Son message, ses champs ou sa cause quand ils font partie du contrat (le solde disponible, le code d'erreur), grâce à l'exception renvoyée par `assertThrows`.
  - key: vf-sous-type
    format: true-false
    question: "`assertThrows(RuntimeException.class, ...)` réussit si le code lève une `IllegalArgumentException`."
    truth: true
    answer: C'est un sous-type de `RuntimeException`.
  - key: vf-aucune
    format: true-false
    question: "`assertThrows` réussit si aucune exception n'est levée."
    truth: false
    answer: Il échoue avec un message qui l'indique.
  - key: vf-renvoie
    format: true-false
    question: "`assertThrows` renvoie l'exception levée."
    truth: true
    answer: On peut ensuite vérifier son contenu.
  - key: vf-expected
    format: true-false
    question: "`@Test(expected = ...)` est la façon recommandée de tester une exception avec JUnit Jupiter."
    truth: false
    answer: C'est l'ancienne syntaxe de JUnit 4 ; on utilise `assertThrows`.
  - key: qcm-ecriture
    format: multiple-choice
    question: Quelles écritures vérifient qu'une exception est levée ?
    choices:
      - text: "`assertThrows(StockEpuiseException.class, () -> stock.retirer(5))`"
        correct: true
      - text: "`assertThatThrownBy(() -> stock.retirer(5)).isInstanceOf(StockEpuiseException.class)`"
        correct: true
      - text: "`stock.retirer(5); assertTrue(true);`"
        correct: false
      - text: "`assertNull(stock.retirer(5))`"
        correct: false
    answer: La seconde utilise AssertJ.
  - key: qcm-piege
    format: multiple-choice
    question: "Quel est le défaut de `assertThrows(IllegalArgumentException.class, () -> { var c = new Commande(null); c.valider(); })` ?"
    choices:
      - {text: "Le constructeur peut lever l'exception, et le test ne vérifie alors pas `valider`", correct: true}
      - {text: "Aucun : le bloc contient bien l'appel à `valider`, qui est donc testé", correct: false}
      - {text: "Il ne compile pas : un bloc de plusieurs lignes est interdit ici", correct: false}
      - {text: "Il vérifie le message de l'exception au lieu de vérifier son type", correct: false}
    answer: On prépare l'objet hors du bloc.
  - key: qcm-pas-exception
    format: multiple-choice
    question: Comment affirmer explicitement qu'un appel ne lève pas d'exception ?
    choices:
      - text: "`assertDoesNotThrow(() -> appel())`"
        correct: true
      - text: "`assertThrows(null, ...)`"
        correct: false
      - text: "`assertNotThrows(...)`"
        correct: false
      - text: "Ce n'est pas possible"
        correct: false
    answer: Utile quand l'absence d'erreur est le comportement à documenter.
  - key: qcm-message
    format: multiple-choice
    question: "Comment vérifier le message exact de l'exception `e` renvoyée par `assertThrows` ?"
    choices:
      - {text: "`assertEquals(\"montant négatif\", e.getMessage())`", correct: true}
      - {text: "`assertEquals(\"montant négatif\", e.toString())`", correct: false}
      - {text: "`assertEquals(e, \"montant négatif\")`", correct: false}
      - {text: "`assertTrue(e.getMessage() != null)`", correct: false}
    answer: "`getMessage()` renvoie le message seul ; `toString()` le préfixe du nom de la classe. Si seul un fragment fait partie du contrat, `assertTrue(e.getMessage().contains(\"négatif\"))` suffit."
  - key: trous-throws
    format: fill-in
    question: |-
      Complète :
      ```java
      ___(MontantInvalideException.class, () -> new Montant(-5));
      ```
    blanks: [[assertThrows]]
    answer: Le type attendu, puis le code à exécuter.
  - key: trous-recuperer
    format: fill-in
    question: |-
      Complète pour vérifier le solde porté par l'exception :
      ```java
      var e = assertThrows(SoldeInsuffisantException.class, () -> compte.retirer(150));
      assertEquals(100, e.___());
      ```
    blanks: [[soldeDisponible]]
    answer: Une exception métier porte des données utiles.
  - key: trous-exact
    format: fill-in
    question: |-
      Complète pour exiger exactement ce type, sans sous-type :
      ```java
      assertThrows___(IllegalStateException.class, () -> machine.demarrer());
      ```
    blanks: [[Exactly]]
    answer: '`assertThrowsExactly`.'
  - key: trous-not
    format: fill-in
    question: |-
      Complète :
      ```java
      assert___(() -> validateur.verifier(commandeValide));
      ```
    blanks: [[DoesNotThrow]]
    answer: '`assertDoesNotThrow`.'
  - key: bug-try-fail
    format: bug-fix
    question: |-
      Quelle réécriture modernise ce test avec JUnit Jupiter ?
      ```java
      try {
          compte.retirer(150);
          fail("exception attendue");
      } catch (SoldeInsuffisantException e) {
          // ok
      }
      ```
    choices:
      - {text: "`var e = assertThrows(SoldeInsuffisantException.class, () -> compte.retirer(150));`", correct: true}
      - {text: "`assertDoesNotThrow(() -> compte.retirer(150));`", correct: false}
      - {text: "`@Test(expected = SoldeInsuffisantException.class)` sur la méthode", correct: false}
      - {text: "`assertThrows(Exception.class, () -> compte.retirer(150));`", correct: false}
    answer: |-
      ```java
      SoldeInsuffisantException e = assertThrows(SoldeInsuffisantException.class, () -> compte.retirer(150));
      assertEquals(100, e.soldeDisponible());
      ```
      `assertThrows` dit l'intention en une ligne et renvoie l'exception pour vérifier son contenu.
  - key: bug-bloc-large
    format: bug-fix
    question: |-
      Ce test passe alors que la validation de `confirmer` est cassée. Pourquoi ?
      ```java
      assertThrows(IllegalArgumentException.class, () -> {
          Commande c = new Commande(List.of());      // le constructeur refuse aussi une liste vide
          c.confirmer();
      });
      ```
    choices:
      - {text: "Le constructeur lève déjà l'exception : `confirmer` n'est jamais exécuté", correct: true}
      - {text: "`assertThrows` n'attrape pas les exceptions d'une lambda sur plusieurs lignes", correct: false}
      - {text: "`IllegalArgumentException` est une exception vérifiée, ignorée par JUnit", correct: false}
      - {text: "`List.of()` lève elle-même une exception quand on ne lui passe rien", correct: false}
    answer: |-
      ```java
      Commande c = new Commande(List.of(ligne));
      c.retirer(ligne);
      assertThrows(IllegalStateException.class, c::confirmer);
      ```
      Le constructeur levait déjà l'exception : `confirmer` n'était jamais exécuté. On prépare un objet valide hors du
      bloc, et le bloc ne contient que l'appel testé.
  - key: bug-type-trop-large
    format: bug-fix
    question: |-
      Ce test passe même quand le code lève une `NullPointerException` à cause d'un bug. Quelle correction est la bonne ?
      ```java
      assertThrows(RuntimeException.class, () -> service.reserver(siegeOccupe));
      ```
    choices:
      - {text: "Attendre l'exception métier précise, `SiegeDejaReserveException`", correct: true}
      - {text: "Attendre `Exception.class`, pour couvrir tous les cas possibles", correct: false}
      - {text: "Ajouter `assertNotNull(siegeOccupe)` juste avant l'appel", correct: false}
      - {text: "Entourer l'appel d'un `try` qui ignore la `NullPointerException`", correct: false}
    answer: |-
      ```java
      assertThrows(SiegeDejaReserveException.class, () -> service.reserver(siegeOccupe));
      ```
      Un type trop général accepte n'importe quelle erreur. On vérifie l'exception métier précise attendue.
  - key: bug-junit4
    format: bug-fix
    question: |-
      Quelle réécriture migre ce test JUnit 4 vers JUnit Jupiter ?
      ```java
      @Test(expected = IllegalArgumentException.class)
      public void refuseUnMontantNegatif() {
          new Montant(-1);
      }
      ```
    choices:
      - {text: "`@Test` seul, et `assertThrows(IllegalArgumentException.class, () -> new Montant(-1))`", correct: true}
      - {text: "Garder `@Test(expected = IllegalArgumentException.class)`, que Jupiter comprend aussi", correct: false}
      - {text: "`@Test` seul, et un `catch (IllegalArgumentException e) {}` vide autour de l'appel", correct: false}
      - {text: "`@ExpectedException(IllegalArgumentException.class)` à la place de `@Test`", correct: false}
    answer: |-
      ```java
      @Test
      void refuseUnMontantNegatif() {
          assertThrows(IllegalArgumentException.class, () -> new Montant(-1));
      }
      ```
      `@Test(expected)` n'existe pas dans Jupiter ; `assertThrows` cible précisément l'appel et permet de vérifier le message.
