notion: junit-exceptions
lesson: |-
  Pour vérifier qu'un code lève une exception, JUnit fournit **`assertThrows`** : il exécute un bloc, vérifie le type de
  l'exception levée et la **renvoie** pour qu'on en vérifie le contenu.

  ```java
  @Test
  void refuseUnRetraitSuperieurAuSolde() {
      Compte compte = new Compte(100);

      SoldeInsuffisantException e = assertThrows(SoldeInsuffisantException.class,
              () -> compte.retirer(150));

      assertEquals(100, e.soldeDisponible());
      assertEquals("solde insuffisant : 100 < 150", e.getMessage());
  }

  @Test
  void unDepotPositifNeLevePasDException() {
      assertDoesNotThrow(() -> compte.deposer(50));
  }
  ```

  - `assertThrows(Type.class, ...)` réussit si l'exception est de ce type **ou d'un sous-type** ;
    `assertThrowsExactly` exige le type exact.
  - Le bloc doit contenir **seulement l'appel testé** : si la préparation lève la même exception, le test passe pour une
    mauvaise raison.
  - On vérifie aussi le **contenu** de l'exception (message, champs, cause) quand il fait partie du contrat.
  - Si aucune exception n'est levée, `assertThrows` échoue avec un message explicite.
  - AssertJ propose une écriture fluide : `assertThatThrownBy(() -> compte.retirer(150))
    .isInstanceOf(SoldeInsuffisantException.class).hasMessageContaining("insuffisant")`.
  - Les anciens motifs (`@Test(expected = ...)` de JUnit 4, ou un `try { ...; fail(); } catch`) sont à remplacer.

  **Piège classique** : un bloc `assertThrows` qui englobe toute la préparation. Une `IllegalArgumentException` levée par un
  constructeur mal appelé fait passer un test qui devait vérifier une validation plus loin.

  **En entretien** : « `assertThrows` avec le seul appel testé dans le bloc, puis des assertions sur l'exception renvoyée ;
  `assertThrowsExactly` si le type exact compte. »
cards:
  - key: assert-throws
    format: course
    question: Comment tester qu'une méthode lève une exception avec JUnit Jupiter ?
    answer: Avec `assertThrows(TypeException.class, () -> appel())`, qui renvoie l'exception pour en vérifier le message ou les champs.
  - key: exactly
    format: course
    question: Quelle différence entre `assertThrows` et `assertThrowsExactly` ?
    answer: '`assertThrows` accepte le type indiqué ou un sous-type ; `assertThrowsExactly` exige exactement ce type.'
  - key: bloc-minimal
    format: course
    question: Pourquoi le bloc passé à `assertThrows` doit-il ne contenir que l'appel testé ?
    answer: Si la préparation lève la même exception, le test passe pour une mauvaise raison et ne vérifie plus le comportement voulu.
  - key: contenu
    format: course
    question: Que vérifier en plus du type de l'exception ?
    answer: Son message, ses champs ou sa cause quand ils font partie du contrat (le solde disponible, le code d'erreur), grâce à l'exception renvoyée par `assertThrows`.
  - key: vf-sous-type
    format: true-false
    question: "`assertThrows(RuntimeException.class, ...)` réussit si le code lève une `IllegalArgumentException`."
    truth: true
    answer: C'est un sous-type de `RuntimeException`.
  - key: vf-aucune
    format: true-false
    question: "`assertThrows` réussit si aucune exception n'est levée."
    truth: false
    answer: Il échoue avec un message qui l'indique.
  - key: vf-renvoie
    format: true-false
    question: "`assertThrows` renvoie l'exception levée."
    truth: true
    answer: On peut ensuite vérifier son contenu.
  - key: vf-expected
    format: true-false
    question: "`@Test(expected = ...)` est la façon recommandée de tester une exception avec JUnit Jupiter."
    truth: false
    answer: C'est l'ancienne syntaxe de JUnit 4 ; on utilise `assertThrows`.
  - key: qcm-ecriture
    format: multiple-choice
    question: Quelles écritures vérifient qu'une exception est levée ?
    choices:
      - text: "`assertThrows(StockEpuiseException.class, () -> stock.retirer(5))`"
        correct: true
      - text: "`assertThatThrownBy(() -> stock.retirer(5)).isInstanceOf(StockEpuiseException.class)`"
        correct: true
      - text: "`stock.retirer(5); assertTrue(true);`"
        correct: false
      - text: "`assertNull(stock.retirer(5))`"
        correct: false
    answer: La seconde utilise AssertJ.
  - key: qcm-piege
    format: multiple-choice
    question: "Quel est le défaut de `assertThrows(IllegalArgumentException.class, () -> { var c = new Commande(null); c.valider(); })` ?"
    choices:
      - text: "Le constructeur peut lever l'exception, et le test ne vérifie alors pas `valider`"
        correct: true
      - text: "Aucun"
        correct: false
      - text: "Il ne compile pas"
        correct: false
      - text: "Il vérifie le message"
        correct: false
    answer: On prépare l'objet hors du bloc.
  - key: qcm-pas-exception
    format: multiple-choice
    question: Comment affirmer explicitement qu'un appel ne lève pas d'exception ?
    choices:
      - text: "`assertDoesNotThrow(() -> appel())`"
        correct: true
      - text: "`assertThrows(null, ...)`"
        correct: false
      - text: "`assertNotThrows(...)`"
        correct: false
      - text: "Ce n'est pas possible"
        correct: false
    answer: Utile quand l'absence d'erreur est le comportement à documenter.
  - key: qcm-message
    format: multiple-choice
    question: "Comment vérifier le message de l'exception renvoyée `e` ?"
    choices:
      - text: "`assertEquals(\"montant négatif\", e.getMessage())`"
        correct: true
      - text: "`assertTrue(e.getMessage().contains(\"négatif\"))`"
        correct: true
      - text: "`assertEquals(e, \"montant négatif\")`"
        correct: false
      - text: "`assertNull(e)`"
        correct: false
    answer: Un message exact ou un fragment, selon ce qui fait partie du contrat.
  - key: trous-throws
    format: fill-in
    question: |-
      Complétez :
      ```java
      ___(MontantInvalideException.class, () -> new Montant(-5));
      ```
    blanks: [[assertThrows]]
    answer: Le type attendu, puis le code à exécuter.
  - key: trous-recuperer
    format: fill-in
    question: |-
      Complétez pour vérifier le solde porté par l'exception :
      ```java
      var e = assertThrows(SoldeInsuffisantException.class, () -> compte.retirer(150));
      assertEquals(100, e.___());
      ```
    blanks: [[soldeDisponible]]
    answer: Une exception métier porte des données utiles.
  - key: trous-exact
    format: fill-in
    question: |-
      Complétez pour exiger exactement ce type, sans sous-type :
      ```java
      assertThrows___(IllegalStateException.class, () -> machine.demarrer());
      ```
    blanks: [[Exactly]]
    answer: '`assertThrowsExactly`.'
  - key: trous-not
    format: fill-in
    question: |-
      Complétez :
      ```java
      assert___(() -> validateur.verifier(commandeValide));
      ```
    blanks: [[DoesNotThrow]]
    answer: '`assertDoesNotThrow`.'
  - key: bug-try-fail
    format: bug-fix
    question: |-
      Modernisez :
      ```java
      try {
          compte.retirer(150);
          fail("exception attendue");
      } catch (SoldeInsuffisantException e) {
          // ok
      }
      ```
    answer: |-
      ```java
      SoldeInsuffisantException e = assertThrows(SoldeInsuffisantException.class, () -> compte.retirer(150));
      assertEquals(100, e.soldeDisponible());
      ```
      `assertThrows` dit l'intention en une ligne et renvoie l'exception pour vérifier son contenu.
  - key: bug-bloc-large
    format: bug-fix
    question: |-
      Ce test passe alors que la validation de `confirmer` est cassée :
      ```java
      assertThrows(IllegalArgumentException.class, () -> {
          Commande c = new Commande(List.of());      // le constructeur refuse aussi une liste vide
          c.confirmer();
      });
      ```
    answer: |-
      ```java
      Commande c = new Commande(List.of(ligne));
      c.retirer(ligne);
      assertThrows(IllegalStateException.class, c::confirmer);
      ```
      Le constructeur levait déjà l'exception : `confirmer` n'était jamais exécuté. On prépare un objet valide hors du
      bloc, et le bloc ne contient que l'appel testé.
  - key: bug-type-trop-large
    format: bug-fix
    question: |-
      Ce test passe même quand le code lève une `NullPointerException` à cause d'un bug :
      ```java
      assertThrows(RuntimeException.class, () -> service.reserver(siegeOccupe));
      ```
    answer: |-
      ```java
      assertThrows(SiegeDejaReserveException.class, () -> service.reserver(siegeOccupe));
      ```
      Un type trop général accepte n'importe quelle erreur. On vérifie l'exception métier précise attendue.
  - key: bug-junit4
    format: bug-fix
    question: |-
      Migrez ce test JUnit 4 :
      ```java
      @Test(expected = IllegalArgumentException.class)
      public void refuseUnMontantNegatif() {
          new Montant(-1);
      }
      ```
    answer: |-
      ```java
      @Test
      void refuseUnMontantNegatif() {
          assertThrows(IllegalArgumentException.class, () -> new Montant(-1));
      }
      ```
      `@Test(expected)` n'existe pas dans Jupiter ; `assertThrows` cible précisément l'appel et permet de vérifier le message.
