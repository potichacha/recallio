notion: mockito-avance
cards:
  - key: doreturn-vs-when-thenreturn
    format: course
    question: doReturn vs when().thenReturn() ?
    answer: doReturn n'appelle pas la vraie méthode (indispensable avec un spy ou une méthode void) ; when appelle la méthode lors du stubbing.
  - key: mocker-methode-statique
    format: course
    question: Peut-on mocker une méthode statique ?
    answer: Oui avec mockStatic (mock maker inline), mais c'est souvent un signal de conception.
