notion: mockito-avance
lesson: |-
  Au-delà de `when` et `verify`, Mockito propose :

  ```java
  // Capturer l'argument passé à un mock pour l'examiner
  ArgumentCaptor<Email> captureur = ArgumentCaptor.forClass(Email.class);
  verify(mailer).envoyer(captureur.capture());
  assertThat(captureur.getValue().objet()).contains("Bienvenue");

  // Une réponse calculée à partir des arguments
  when(repo.enregistrer(any())).thenAnswer(invocation -> invocation.getArgument(0));

  // Méthodes void : la famille doXxx
  doThrow(new IOException("disque plein")).when(archiveur).archiver(any());
  doNothing().when(journal).ecrire(any());

  // Un spy : un objet réel dont on remplace une partie
  List<String> liste = spy(new ArrayList<>());
  doReturn(100).when(liste).size();               // doReturn : n'appelle pas la vraie méthode

  // Mocks de méthodes statiques et de constructeurs (mock maker inline, par défaut depuis Mockito 5)
  try (MockedStatic<UUID> uuid = mockStatic(UUID.class)) {
      uuid.when(UUID::randomUUID).thenReturn(UUID.fromString("..."));
      ...
  }                                                 // le mock statique cesse à la fermeture
  ```

  - **`ArgumentCaptor`** : vérifier le contenu d'un objet construit par le code testé et passé à un collaborateur.
  - **`thenAnswer`** : une réponse qui dépend des arguments (renvoyer l'entité enregistrée, simuler un identifiant).
  - **`doReturn` / `doThrow` / `doAnswer`** : obligatoires pour les méthodes `void` et pour les **spies** (avec un spy,
    `when(spy.methode())` appelle la vraie méthode pendant le stubbing).
  - Depuis **Mockito 5**, le *mock maker inline* est le défaut : il sait mocker les classes et méthodes **`final`**, les
    méthodes **statiques** (`mockStatic`) et les constructeurs (`mockConstruction`).
  - `@Captor`, `@Spy` existent en annotations ; `verify(mock, timeout(1000))` attend un appel asynchrone.

  Ces possibilités sont souvent des **signaux de conception** : devoir mocker une méthode statique (`LocalDate.now()`,
  `UUID.randomUUID()`) indique une dépendance cachée qu'il vaudrait mieux injecter (un `Clock`, un générateur
  d'identifiants).

  **Piège classique** : `when(spy.calculer()).thenReturn(5)` sur un spy. La vraie méthode est appelée pendant le stubbing,
  avec ses effets de bord (ou une exception) ; il faut `doReturn(5).when(spy).calculer()`.

  **En entretien** : « `ArgumentCaptor` pour examiner un argument, `thenAnswer` pour une réponse calculée, la famille `doXxx`
  pour les `void` et les spies ; mocker du statique est possible, mais signale souvent une dépendance à injecter. »
cards:
  - key: doreturn-vs-when-thenreturn
    format: course
    question: doReturn vs when().thenReturn() ?
    answer: doReturn n'appelle pas la vraie méthode (indispensable avec un spy ou une méthode void) ; when appelle la méthode lors du stubbing.
  - key: mocker-methode-statique
    format: course
    question: Peut-on mocker une méthode statique ?
    answer: Oui avec mockStatic (mock maker inline), mais c'est souvent un signal de conception.
  - key: captor
    format: course
    question: À quoi sert un `ArgumentCaptor` ?
    answer: À récupérer l'argument passé à un mock lors d'un appel, pour vérifier son contenu (par exemple l'e-mail construit par le code testé).
  - key: then-answer
    format: course
    question: Quand utiliser `thenAnswer` plutôt que `thenReturn` ?
    answer: Quand la réponse dépend des arguments de l'appel, par exemple renvoyer l'objet reçu par `enregistrer` ou générer un identifiant.
  - key: vf-final
    format: true-false
    question: Depuis Mockito 5, on peut mocker une classe `final` sans configuration particulière.
    truth: true
    answer: Le mock maker inline est le défaut.
  - key: vf-void-when
    format: true-false
    question: "`when(mock.methodeVoid()).thenThrow(...)` est valide pour une méthode `void`."
    truth: false
    answer: Elle ne renvoie rien à passer à `when` ; on écrit `doThrow(...).when(mock).methodeVoid()`.
  - key: vf-statique-ferme
    format: true-false
    question: Un `MockedStatic` doit être fermé (try-with-resources) pour cesser d'agir.
    truth: true
    answer: Sinon il fuit vers les autres tests du même thread.
  - key: vf-spy-reel
    format: true-false
    question: Un spy appelle les vraies méthodes de l'objet, sauf celles qu'on a remplacées.
    truth: true
    answer: C'est un objet réel observé.
  - key: qcm-captor
    format: multiple-choice
    question: "Comment vérifier l'objet `Email` passé à `mailer.envoyer` ?"
    choices:
      - text: "Un `ArgumentCaptor<Email>` capturé dans `verify(mailer).envoyer(captureur.capture())`"
        correct: true
      - text: "`verify(mailer).envoyer(argThat(e -> e.objet().contains(\"Bienvenue\")))`"
        correct: true
      - text: "`when(mailer.envoyer(any())).thenReturn(email)`"
        correct: false
      - text: "`assertEquals(email, mailer)`"
        correct: false
    answer: Le captor permet plusieurs assertions sur l'objet capturé.
  - key: qcm-spy
    format: multiple-choice
    question: Comment remplacer une méthode d'un spy sans appeler la vraie ?
    choices:
      - text: "`doReturn(valeur).when(spy).methode()`"
        correct: true
      - text: "`when(spy.methode()).thenReturn(valeur)`"
        correct: false
      - text: "`spy.methode() = valeur`"
        correct: false
      - text: "`verify(spy).methode()`"
        correct: false
    answer: '`when(spy.methode())` appellerait la vraie méthode pendant le stubbing.'
  - key: qcm-signal
    format: multiple-choice
    question: Un test doit mocker `LocalDate.now()`. Quelle amélioration de conception s'impose ?
    choices:
      - text: "Injecter un `Clock` et utiliser `LocalDate.now(clock)`"
        correct: true
      - text: "Mocker `LocalDate` avec `mockStatic` dans chaque test"
        correct: false
      - text: "Changer l'heure de la machine de test"
        correct: false
      - text: "Ne pas tester les dates"
        correct: false
    answer: Une dépendance explicite rend le code testable sans astuce.
  - key: qcm-asynchrone
    format: multiple-choice
    question: Comment vérifier qu'un mock est appelé par un traitement asynchrone dans la seconde ?
    choices:
      - text: "`verify(mock, timeout(1000)).methode()`"
        correct: true
      - text: "`Thread.sleep(1000); verify(mock).methode();`"
        correct: false
      - text: "`verify(mock).methode()` immédiatement"
        correct: false
      - text: "Impossible"
        correct: false
    answer: '`timeout` attend au plus le délai, et réussit dès que l''appel a lieu.'
