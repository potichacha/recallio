notion: nouveautes-java-21-25
lesson: |-
  **Java 21** (septembre 2023, LTS) et **Java 25** (septembre 2025, LTS) encadrent une série de changements importants :

  | Version | Apports marquants |
  |---|---|
  | **21** (LTS) | **threads virtuels**, **collections séquencées** (`getFirst`, `reversed`), **filtrage dans `switch`** et **motifs de record**, ZGC générationnel |
  | **22** | **variables et motifs anonymes** (`_`), **API FFM** (Foreign Function & Memory) définitive, lancement de programmes source à plusieurs fichiers |
  | **23** | commentaires Javadoc en **Markdown** (`///`), ZGC générationnel par défaut |
  | **24** | **gatherers** (`Stream.gather`), threads virtuels **sans épinglage** sur `synchronized`, chargement anticipé des classes (cache AOT), Security Manager désactivé définitivement, cryptographie post-quantique (ML-KEM, ML-DSA) |
  | **25** (LTS) | **fichiers source compacts** et `void main()` d'instance, **déclarations d'import de module** (`import module java.base;`), **corps de constructeur flexibles**, **`ScopedValue`** définitive, **en-têtes d'objets compacts** |

  ```java
  // Java 25 : un programme complet dans un fichier, sans classe déclarée
  void main() {
      IO.println("Bonjour");
  }
  ```

  - Les **threads virtuels** rendent le modèle « un thread par requête » abordable pour des millions de tâches
    bloquantes, sans programmation réactive.
  - Les **corps de constructeur flexibles** permettent de valider les arguments **avant** `super(...)`, tant qu'on ne
    touche pas à `this`.
  - Les **en-têtes d'objets compacts** (JEP 519, option `-XX:+UseCompactObjectHeaders` en 25) réduisent l'en-tête de chaque
    objet de 12 à 8 octets.
  - Plusieurs fonctionnalités restent en préversion en 25 : la concurrence structurée, les motifs primitifs, les stable
    values.

  **Piège classique** : citer la concurrence structurée comme définitive. En Java 25, elle est encore en préversion.

  **En entretien** : « 21 : threads virtuels, collections séquencées, filtrage dans `switch`. 22 à 24 : `_`, FFM,
  gatherers, fin de l'épinglage. 25 : `void main()`, imports de module, constructeurs flexibles, `ScopedValue`. »
cards:
  - key: apporte-java-25-point-entree-programmes
    format: course
    question: Qu'a apporté Java 25 au point d'entrée des programmes ?
    answer: 'Les compact source files et la méthode main d''instance : `void main()` sans déclarer de classe.'
  - key: flexible-constructor-bodies
    format: course
    question: C'est quoi les flexible constructor bodies ?
    answer: La possibilité d'écrire des instructions avant `super()`/`this()`, tant qu'elles n'utilisent pas `this` (Java 25).
  - key: apporte-java-27
    format: course
    question: Qu'apporte Java 27 ?
    answer: G1 par défaut partout, compact object headers par défaut, TLS 1.3 hybride post-quantique, masquage dans JFR.
  - key: java-21
    format: course
    question: Quels sont les apports majeurs de Java 21 ?
    answer: Les threads virtuels, les collections séquencées, le filtrage par motif dans `switch` et les motifs de record, et le ZGC générationnel.
  - key: epinglage
    format: course
    question: Qu'a changé Java 24 pour les threads virtuels ?
    answer: Un thread virtuel bloqué dans un bloc `synchronized` ne reste plus épinglé à son thread porteur (JEP 491), ce qui supprime la principale limite de Java 21.
  - key: import-module
    format: course
    question: Que fait `import module java.base;` (Java 25) ?
    answer: Il importe tous les paquets exportés par le module `java.base` (`java.util`, `java.io`...) en une ligne.
  - key: vf-virtuels-21
    format: true-false
    question: Les threads virtuels sont définitifs depuis Java 21.
    truth: true
    answer: JEP 444.
  - key: vf-structured
    format: true-false
    question: La concurrence structurée (`StructuredTaskScope`) est définitive en Java 25.
    truth: false
    answer: Elle est encore en préversion en Java 25.
  - key: vf-gatherers
    format: true-false
    question: Les gatherers sont définitifs depuis Java 24.
    truth: true
    answer: JEP 485.
  - key: vf-scoped
    format: true-false
    question: "`ScopedValue` est définitive en Java 25."
    truth: true
    answer: JEP 506, une alternative à `ThreadLocal` adaptée aux threads virtuels.
  - key: qcm-21
    format: multiple-choice
    question: Lesquels sont apparus (en version définitive) en Java 21 ?
    choices:
      - text: "Les collections séquencées"
        correct: true
      - text: "Les threads virtuels"
        correct: true
      - text: "Les gatherers"
        correct: false
      - text: "`void main()` sans classe"
        correct: false
    answer: Gatherers en 24, `void main()` en 25.
  - key: qcm-25
    format: multiple-choice
    question: Lesquels sont définitifs en Java 25 ?
    choices:
      - text: "Les corps de constructeur flexibles"
        correct: true
      - text: "Les déclarations d'import de module"
        correct: true
      - text: "Les motifs primitifs (`case int i`)"
        correct: false
      - text: "Les String templates"
        correct: false
    answer: Les motifs primitifs sont en préversion ; les String templates ont été retirés.
  - key: qcm-lts
    format: multiple-choice
    question: Quelles versions sont LTS ?
    choices:
      - text: "21"
        correct: true
      - text: "25"
        correct: true
      - text: "22"
        correct: false
      - text: "24"
        correct: false
    answer: Les versions intermédiaires ne sont supportées que six mois.
  - key: qcm-flexible
    format: multiple-choice
    question: Que permet un corps de constructeur flexible (Java 25) ?
    choices:
      - text: "Valider un argument avant `super(...)`"
        correct: true
      - text: "Appeler une méthode d'instance avant `super(...)`"
        correct: false
      - text: "Appeler `super(...)` deux fois"
        correct: false
      - text: "Omettre `super(...)` dans tous les cas"
        correct: false
    answer: Les instructions avant `super` ne doivent pas utiliser `this` (sauf pour initialiser des champs).
