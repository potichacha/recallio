notion: nouveautes-java-21-25
lesson: |-
  **Java 21** (septembre 2023, LTS) et **Java 25** (septembre 2025, LTS) encadrent une série de changements importants :

  | Version | Apports marquants |
  |---|---|
  | **21** (LTS) | **threads virtuels**, **collections séquencées** (`getFirst`, `reversed`), **filtrage dans `switch`** et **motifs de record**, ZGC générationnel |
  | **22** | **variables et motifs anonymes** (`_`), **API FFM** (Foreign Function & Memory) définitive, lancement de programmes source à plusieurs fichiers |
  | **23** | commentaires Javadoc en **Markdown** (`///`), ZGC générationnel par défaut |
  | **24** | **gatherers** (`Stream.gather`), threads virtuels **sans épinglage** sur `synchronized`, chargement anticipé des classes (cache AOT), Security Manager désactivé définitivement, cryptographie post-quantique (ML-KEM, ML-DSA) |
  | **25** (LTS) | **fichiers source compacts** et `void main()` d'instance, **déclarations d'import de module** (`import module java.base;`), **corps de constructeur flexibles**, **`ScopedValue`** définitive, **en-têtes d'objets compacts** |

  ```java
  // Java 25 : un programme complet dans un fichier, sans classe déclarée
  void main() {
      IO.println("Bonjour");
  }
  ```

  - Les **threads virtuels** rendent le modèle « un thread par requête » abordable pour des millions de tâches
    bloquantes, sans programmation réactive.
  - Les **corps de constructeur flexibles** permettent de valider les arguments **avant** `super(...)`, tant qu'on ne
    touche pas à `this`.
  - Les **en-têtes d'objets compacts** (JEP 519, option `-XX:+UseCompactObjectHeaders` en 25) réduisent l'en-tête de chaque
    objet de 12 à 8 octets.
  - Plusieurs fonctionnalités restent en préversion en 25 : la concurrence structurée, les motifs primitifs, les stable
    values.

  **Piège classique** : citer la concurrence structurée comme définitive. En Java 25, elle est encore en préversion.

  **En entretien** : « 21 : threads virtuels, collections séquencées, filtrage dans `switch`. 22 à 24 : `_`, FFM,
  gatherers, fin de l'épinglage. 25 : `void main()`, imports de module, constructeurs flexibles, `ScopedValue`. »
cards:
  - key: apporte-java-25-point-entree-programmes
    format: course
    question: Qu'a apporté Java 25 au point d'entrée des programmes ?
    choices:
      - {text: "Les fichiers source compacts : `void main()` sans déclarer de classe", correct: true}
      - {text: "Un `main` asynchrone, qui renvoie un `CompletableFuture<Void>`", correct: false}
      - {text: "L'obligation de déclarer `main` avec `throws Exception`", correct: false}
      - {text: "La fin de `main` : la JVM exécute le premier bloc `static`", correct: false}
    answer: |-
      Les fichiers source compacts et la méthode `main` d'instance : `void main()` suffit, sans déclarer de classe ni de
      paramètre.
  - key: flexible-constructor-bodies
    format: course
    question: "Que sont les corps de constructeur flexibles (flexible constructor bodies) ?"
    choices:
      - {text: "Des instructions permises avant `super()` ou `this()`, tant qu'elles n'utilisent pas `this`", correct: true}
      - {text: "Des instructions permises avant `super()`, y compris des appels de méthodes d'instance", correct: false}
      - {text: "Des constructeurs qui peuvent appeler `super()` plusieurs fois, selon une condition", correct: false}
      - {text: "Des constructeurs sans corps, que le compilateur complète à partir des champs", correct: false}
    answer: |-
      La possibilité d'écrire des instructions avant `super()` ou `this()`, tant qu'elles n'utilisent pas l'objet en
      construction (Java 25) : valider ou préparer les arguments, par exemple. Une méthode d'instance utiliserait `this`.
  - key: en-tetes-objets-compacts
    format: course
    question: "Quelle nouveauté de Java 25 réduit la mémoire occupée par chaque objet ?"
    choices:
      - {text: "Les en-têtes d'objets compacts, devenus une option du produit", correct: true}
      - {text: "La compression des chaînes en Latin-1 (compact strings)", correct: false}
      - {text: "Les types valeur du projet Valhalla, sans identité", correct: false}
      - {text: "Le mode générationnel de ZGC, devenu le seul possible", correct: false}
    answer: "Les en-têtes d'objets compacts (JEP 519) ramènent l'en-tête de chaque objet de 12 à 8 octets sur une JVM 64 bits. En Java 25, ils deviennent une option du produit (`-XX:+UseCompactObjectHeaders`), sans être activés par défaut. Les compact strings datent de Java 9, et les types valeur de Valhalla ne sont pas encore livrés."
  - key: java-21
    format: course
    question: Quels sont les apports majeurs de Java 21 ?
    choices:
      - {text: "Les threads virtuels, les collections séquencées et le filtrage par motif dans `switch`", correct: true}
      - {text: "Les records, les classes scellées et les blocs de texte, en version définitive", correct: false}
      - {text: "Les gatherers, les `ScopedValue` et le cache AOT, en version définitive", correct: false}
      - {text: "Les fichiers source compacts et les déclarations d'import de module", correct: false}
    answer: |-
      Les threads virtuels, les collections séquencées, le filtrage par motif dans `switch` et les motifs de record, et le
      ZGC générationnel. Records, classes scellées et blocs de texte datent de Java 15 à 17.
  - key: epinglage
    format: course
    question: Qu'a changé Java 24 pour les threads virtuels ?
    choices:
      - {text: "Un thread virtuel bloqué dans un `synchronized` n'est plus épinglé à son porteur", correct: true}
      - {text: "Les threads virtuels sont devenus définitifs, après deux préversions", correct: false}
      - {text: "Les threads virtuels ont reçu une priorité, réglable par `setPriority`", correct: false}
      - {text: "Un thread virtuel peut désormais devenir un thread de plateforme", correct: false}
    answer: |-
      Un thread virtuel bloqué dans un bloc `synchronized` ne reste plus épinglé à son thread porteur (JEP 491), ce qui
      supprime la principale limite de Java 21, où ils sont devenus définitifs.
  - key: import-module
    format: course
    question: Que fait `import module java.base;` (Java 25) ?
    choices:
      - {text: "Il importe tous les paquets exportés par le module `java.base`, en une ligne", correct: true}
      - {text: "Il déclare que le programme dépend de `java.base`, comme un `requires`", correct: false}
      - {text: "Il charge le module `java.base` au démarrage, sinon absent de la JVM", correct: false}
      - {text: "Il importe toutes les classes de `java.base`, paquets internes compris", correct: false}
    answer: |-
      Il importe tous les paquets exportés par le module `java.base` (`java.util`, `java.io`...) en une ligne. Les
      paquets non exportés restent inaccessibles.
  - key: vf-virtuels-21
    format: true-false
    question: Les threads virtuels sont définitifs depuis Java 21.
    truth: true
    answer: JEP 444.
  - key: vf-structured
    format: true-false
    question: La concurrence structurée (`StructuredTaskScope`) est définitive en Java 25.
    truth: false
    answer: Elle est encore en préversion en Java 25.
  - key: vf-gatherers
    format: true-false
    question: Les gatherers sont définitifs depuis Java 24.
    truth: true
    answer: JEP 485.
  - key: vf-scoped
    format: true-false
    question: "`ScopedValue` est définitive en Java 25."
    truth: true
    answer: JEP 506, une alternative à `ThreadLocal` adaptée aux threads virtuels.
  - key: qcm-21
    format: multiple-choice
    question: "Laquelle de ces fonctionnalités est apparue, en version définitive, en Java 21 ?"
    choices:
      - {text: "Les threads virtuels", correct: true}
      - {text: "Les gatherers", correct: false}
      - {text: "`void main()` sans classe", correct: false}
      - {text: "Les blocs de texte", correct: false}
    answer: |-
      Les threads virtuels (et les collections séquencées) sont définitifs en Java 21. Les gatherers datent de Java 24,
      `void main()` de Java 25, les blocs de texte de Java 15.
  - key: qcm-25
    format: multiple-choice
    question: "Laquelle de ces fonctionnalités est définitive en Java 25 ?"
    choices:
      - {text: "Les corps de constructeur flexibles", correct: true}
      - {text: "Les motifs primitifs (`case int i`)", correct: false}
      - {text: "Les String templates", correct: false}
      - {text: "Les classes valeur (Valhalla)", correct: false}
    answer: |-
      Les corps de constructeur flexibles (et les déclarations d'import de module) sont définitifs en Java 25. Les motifs
      primitifs sont en préversion, les String templates ont été retirés, et les classes valeur ne sont pas livrées.
  - key: qcm-lts
    format: multiple-choice
    question: "Laquelle de ces versions est une LTS ?"
    choices:
      - {text: "21", correct: true}
      - {text: "22", correct: false}
      - {text: "23", correct: false}
      - {text: "24", correct: false}
    answer: "21 est une LTS, comme 25. Les versions intermédiaires ne sont supportées que six mois, jusqu'à la suivante."
  - key: qcm-flexible
    format: multiple-choice
    question: Que permet un corps de constructeur flexible (Java 25) ?
    choices:
      - text: "Valider un argument avant `super(...)`"
        correct: true
      - text: "Appeler une méthode d'instance avant `super(...)`"
        correct: false
      - text: "Appeler `super(...)` deux fois"
        correct: false
      - text: "Omettre `super(...)` dans tous les cas"
        correct: false
    answer: Les instructions avant `super` ne doivent pas utiliser `this` (sauf pour initialiser des champs).
