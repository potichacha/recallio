notion: nouveautes-java-21-25
cards:
  - key: apporte-java-25-point-entree-programmes
    format: course
    question: Qu'a apporté Java 25 au point d'entrée des programmes ?
    answer: 'Les compact source files et la méthode main d''instance : `void main()` sans déclarer de classe.'
  - key: flexible-constructor-bodies
    format: course
    question: C'est quoi les flexible constructor bodies ?
    answer: La possibilité d'écrire des instructions avant `super()`/`this()`, tant qu'elles n'utilisent pas `this` (Java 25).
  - key: apporte-java-27
    format: course
    question: Qu'apporte Java 27 ?
    answer: G1 par défaut partout, compact object headers par défaut, TLS 1.3 hybride post-quantique, masquage dans JFR.
