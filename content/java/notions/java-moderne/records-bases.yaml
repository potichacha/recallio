notion: records-bases
lesson: |-
  Un **record** (Java 16) déclare une classe porteuse de données en une ligne : on donne ses **composants**, le
  compilateur génère le reste.

  ```java
  public record Point(int x, int y) {}

  Point p = new Point(1, 2);
  p.x();                         // 1 : l'accesseur porte le nom du composant (pas getX)
  p.equals(new Point(1, 2));     // true : égalité par valeur, sur tous les composants
  p.toString();                  // "Point[x=1, y=2]"
  ```

  Le compilateur génère :
  - un champ **`private final`** par composant ;
  - le **constructeur canonique** (tous les composants, dans l'ordre) ;
  - un **accesseur** par composant, du même nom (`x()`) ;
  - **`equals`**, **`hashCode`** et **`toString`** fondés sur tous les composants.

  On peut ajouter :
  - des **méthodes** (`double distance()`), des méthodes et champs **`static`** (fabriques, constantes) ;
  - d'autres **constructeurs**, qui doivent appeler le canonique (`this(...)`) ;
  - l'implémentation d'**interfaces** ;
  - des records **imbriqués** ou **locaux** (dans une méthode), implicitement `static`.

  Un record est fait pour les **valeurs** : DTO d'API, résultats, clés de map, événements, messages. Il convient mal aux
  entités JPA (qui ont besoin d'un constructeur sans argument et de champs modifiables).

  **Piège classique** : croire qu'un record est profondément immuable. `record Panier(List<String> articles)` garde la
  même référence à la liste, que l'appelant peut toujours modifier : il faut une copie défensive (`List.copyOf`).

  **En entretien** : « Un record déclare des composants et obtient champs `private final`, constructeur canonique,
  accesseurs, `equals`, `hashCode` et `toString` ; c'est l'outil des objets valeur. »
cards:
  - key: record
    format: course
    question: C'est quoi un record ?
    answer: Une classe immutable compacte générant constructeur, accesseurs, equals, hashCode, toString.
  - key: genere
    format: course
    question: Que génère le compilateur pour `record Point(int x, int y) {}` ?
    answer: Deux champs `private final`, le constructeur canonique `Point(int x, int y)`, les accesseurs `x()` et `y()`, et `equals`, `hashCode` et `toString` fondés sur `x` et `y`.
  - key: usages
    format: course
    question: Pour quels usages un record convient-il ?
    answer: "Les objets valeur : DTO d'API, résultats de calcul, clés de map composites, événements, messages ; mal pour les entités JPA, qui demandent un constructeur sans argument et des champs modifiables."
  - key: ajouter
    format: course
    question: Que peut-on ajouter dans le corps d'un record ?
    answer: Des méthodes, des membres `static` (champs, fabriques), d'autres constructeurs qui délèguent au canonique, et l'implémentation d'interfaces ; pas de champ d'instance supplémentaire.
  - key: vf-get
    format: true-false
    question: "L'accesseur du composant `nom` d'un record s'appelle `getNom()`."
    truth: false
    answer: Il s'appelle `nom()`.
  - key: vf-equals
    format: true-false
    question: Deux records de même type avec les mêmes composants sont égaux par `equals`.
    truth: true
    answer: L'égalité générée compare tous les composants.
  - key: vf-interface
    format: true-false
    question: Un record peut implémenter une interface.
    truth: true
    answer: Par exemple `record Euro(long centimes) implements Comparable<Euro>`.
  - key: vf-local
    format: true-false
    question: On peut déclarer un record à l'intérieur d'une méthode.
    truth: true
    answer: Un record local, pratique pour un résultat intermédiaire de stream.
  - key: qcm-genere
    format: multiple-choice
    question: Qu'est-ce qui est généré pour un record ?
    choices:
      - text: "`equals`, `hashCode` et `toString`"
        correct: true
      - text: "Le constructeur canonique"
        correct: true
      - text: "Des setters"
        correct: false
      - text: "Un constructeur sans argument"
        correct: false
    answer: "Les champs sont `final` : pas de setter ; seul le constructeur canonique existe par défaut."
  - key: qcm-to-string
    format: multiple-choice
    question: "Que renvoie `new Point(1, 2).toString()` pour `record Point(int x, int y)` ?"
    choices:
      - text: "`Point[x=1, y=2]`"
        correct: true
      - text: "`Point(1, 2)`"
        correct: false
      - text: "`Point@1b6d3586`"
        correct: false
      - text: "`{x=1, y=2}`"
        correct: false
    answer: Le nom du type, puis les composants entre crochets.
  - key: qcm-usage
    format: multiple-choice
    question: Pour lesquels un record est-il un bon choix ?
    choices:
      - text: "La réponse JSON d'un endpoint"
        correct: true
      - text: "Une clé de map composite (pays, code postal)"
        correct: true
      - text: "Une entité JPA modifiée au fil des transactions"
        correct: false
      - text: "Un service avec des dépendances injectées et un état qui évolue"
        correct: false
    answer: Un record représente une valeur, pas un objet à état changeant.
  - key: qcm-constructeur
    format: multiple-choice
    question: Comment ajouter un constructeur `Point()` qui crée l'origine ?
    choices:
      - text: "`Point() { this(0, 0); }`"
        correct: true
      - text: "`Point() { x = 0; y = 0; }`"
        correct: false
      - text: "`Point() { super(); }`"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: Un constructeur non canonique doit déléguer au canonique.
  - key: trous-declaration
    format: fill-in
    question: |-
      Complétez pour déclarer une valeur monétaire :
      ```java
      public ___ Montant(long centimes, String devise) {}
      ```
    blanks: [[record]]
    answer: Les composants sont entre parenthèses.
  - key: trous-accesseur
    format: fill-in
    question: |-
      Complétez l'appel de l'accesseur :
      ```java
      record Client(String email) {}
      String e = client.___();
      ```
    blanks: [[email]]
    answer: L'accesseur porte le nom du composant.
  - key: trous-fabrique
    format: fill-in
    question: |-
      Complétez la fabrique statique :
      ```java
      record Montant(long centimes) {
          ___ Montant zero() { return new Montant(0); }
      }
      ```
    blanks: [[static, public static]]
    answer: Les membres `static` sont permis dans un record.
  - key: trous-delegation
    format: fill-in
    question: |-
      Complétez le constructeur secondaire :
      ```java
      record Plage(int debut, int fin) {
          Plage(int taille) { ___(0, taille); }
      }
      ```
    blanks: [[this]]
    answer: Il délègue au constructeur canonique.
  - key: code-egalite
    format: code-output
    question: |-
      ```java
      record Point(int x, int y) {}
      Point a = new Point(1, 2);
      Point b = new Point(1, 2);
      System.out.println((a == b) + " " + a.equals(b) + " " + (a.hashCode() == b.hashCode()) + " " + a);
      ```
    answer: '`false true true Point[x=1, y=2]`.'
    check:
      output: "false true true Point[x=1, y=2]"
  - key: code-methode
    format: code-output
    question: |-
      ```java
      record Rectangle(int largeur, int hauteur) {
          int aire() { return largeur * hauteur; }
          static Rectangle carre(int c) { return new Rectangle(c, c); }
      }
      System.out.println(Rectangle.carre(3).aire() + " " + new Rectangle(2, 5).largeur());
      ```
    answer: '`9 2`.'
    check:
      output: "9 2"
  - key: code-cle-map
    format: code-output
    question: |-
      ```java
      record Cle(String pays, String code) {}
      Map<Cle, String> villes = new HashMap<>();
      villes.put(new Cle("FR", "75001"), "Paris");
      System.out.println(villes.get(new Cle("FR", "75001")));
      ```
    answer: '`Paris` : `equals` et `hashCode` générés en font une bonne clé.'
    check:
      output: "Paris"
  - key: code-champ
    format: code-output
    question: |-
      ```java
      record Compteur(int valeur) {
          private int increments;
      }
      ```
    answer: "Ne compile pas : un record ne peut pas déclarer de champ d'instance en plus de ses composants."
    check:
      compiles: false
  - key: bug-classe-boilerplate
    format: bug-fix
    question: |-
      Simplifiez cette classe de 40 lignes :
      ```java
      public final class Adresse {
          private final String rue;
          private final String ville;
          public Adresse(String rue, String ville) { this.rue = rue; this.ville = ville; }
          public String getRue() { return rue; }
          public String getVille() { return ville; }
          @Override public boolean equals(Object o) { ... }
          @Override public int hashCode() { ... }
          @Override public String toString() { ... }
      }
      ```
    answer: |-
      ```java
      public record Adresse(String rue, String ville) {}
      ```
      Le record génère tout cela, sans risque d'oublier un champ dans `equals` ou `hashCode`. Les appelants utilisent
      `rue()` au lieu de `getRue()`.
  - key: bug-liste-mutable
    format: bug-fix
    question: |-
      Le contenu d'une commande « immuable » change après sa création :
      ```java
      record Commande(String id, List<String> articles) {}
      List<String> l = new ArrayList<>(List.of("a"));
      Commande c = new Commande("1", l);
      l.add("b");             // c.articles() contient maintenant "b"
      ```
    answer: |-
      ```java
      record Commande(String id, List<String> articles) {
          Commande {
              articles = List.copyOf(articles);
          }
      }
      ```
      Le record garde la référence reçue. Une copie non modifiable dans le constructeur compact le protège.
  - key: bug-tableau
    format: bug-fix
    question: |-
      Deux signatures identiques ne sont pas égales :
      ```java
      record Signature(byte[] octets) {}
      new Signature(new byte[]{1}).equals(new Signature(new byte[]{1}));   // false
      ```
    answer: |-
      ```java
      record Signature(byte[] octets) {
          @Override public boolean equals(Object o) {
              return o instanceof Signature s && Arrays.equals(octets, s.octets);
          }
          @Override public int hashCode() { return Arrays.hashCode(octets); }
      }
      ```
      L'`equals` généré compare les tableaux avec `==`. Il faut redéfinir `equals` et `hashCode` avec `Arrays` (ou
      préférer une `List<Byte>` ou un type immuable).
  - key: bug-setter
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      record Prix(double valeur) {}
      Prix p = new Prix(10);
      p.valeur = 12;
      ```
    answer: |-
      ```java
      record Prix(double valeur) {
          Prix avecValeur(double nouvelle) { return new Prix(nouvelle); }
      }
      Prix p = new Prix(10).avecValeur(12);
      ```
      Les champs d'un record sont `final`. On crée une nouvelle valeur au lieu de modifier l'ancienne (une méthode
      « wither »).
