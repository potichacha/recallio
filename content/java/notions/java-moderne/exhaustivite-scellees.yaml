notion: exhaustivite-scellees
lesson: |-
  Sur un type **scellé**, le compilateur connaît tous les sous-types : un `switch` qui les traite tous est **exhaustif**
  sans `default`.

  ```java
  sealed interface Forme permits Cercle, Carre, Triangle {}
  record Cercle(double r) implements Forme {}
  record Carre(double c) implements Forme {}
  record Triangle(double b, double h) implements Forme {}

  static double aire(Forme f) {
      return switch (f) {                 // pas de default
          case Cercle c -> Math.PI * c.r() * c.r();
          case Carre c -> c.c() * c.c();
          case Triangle t -> t.b() * t.h() / 2;
      };
  }
  ```

  - Si l'on ajoute `record Losange(...) implements Forme` (et qu'on l'ajoute au `permits`), **chaque** `switch` sans
    `default` qui ne le traite pas **cesse de compiler**. Les oublis deviennent impossibles.
  - Un `default` supprime cette garantie : à éviter sur un type scellé.
  - L'exhaustivité suit la hiérarchie : un sous-type `sealed` doit être couvert par ses propres sous-types (ou par un cas
    sur lui-même), un sous-type `non-sealed` par un cas sur lui-même.
  - Les **gardes** `when` ne comptent pas pour l'exhaustivité : `case Cercle c when c.r() > 1` ne couvre pas tous les
    cercles.
  - Les motifs de record imbriqués comptent : `case Paire(Oui o, var x)` et `case Paire(Non n, var x)` couvrent `Paire`
    si `Oui`/`Non` couvrent le type scellé.
  - À l'exécution, si une classe recompilée séparément ajoute un cas inconnu, le `switch` lève une **`MatchException`**.
  - L'exhaustivité ne concerne que les `switch` **expressions** et les `switch` à motifs ; un vieux `switch` instruction
    sur une enum n'est pas vérifié.

  **Piège classique** : une garde sur le dernier cas (`case Triangle t when t.b() > 0`). Le `switch` n'est plus
  exhaustif : le compilateur exige un cas pour les triangles restants.

  **En entretien** : « Sur un type scellé, couvrir tous les sous-types suffit, sans `default` ; ajouter un cas casse la
  compilation partout où il manque. Les gardes ne comptent pas. »
cards:
  - key: interet-sealed-switch
    format: course
    question: Intérêt de sealed + switch ?
    answer: Exhaustivité vérifiée par le compilateur, sans `default`.
  - key: gardes
    format: course
    question: Les gardes `when` comptent-elles pour l'exhaustivité ?
    answer: "Non : un cas gardé ne couvre pas tout son type ; il faut aussi un cas sans garde (ou un `default`)."
  - key: match-exception
    format: course
    question: Que se passe-t-il à l'exécution si un `switch` exhaustif rencontre un sous-type inconnu à la compilation ?
    answer: Il lève une `MatchException` (cas d'une classe recompilée séparément avec un nouveau sous-type).
  - key: sous-hierarchie
    format: course
    question: Comment couvrir un sous-type lui-même `sealed` dans un `switch` exhaustif ?
    answer: Soit par un cas sur ce sous-type, soit par des cas sur tous ses propres sous-types autorisés.
  - key: vf-default-utile
    format: true-false
    question: Sur un type scellé, un `default` renforce la vérification d'exhaustivité.
    truth: false
    answer: "Il la supprime : un nouveau cas tombe dans le `default`."
  - key: vf-garde
    format: true-false
    question: "`case Cercle c when c.r() > 0` suffit à couvrir le sous-type `Cercle`."
    truth: false
    answer: La garde rend le cas partiel.
  - key: vf-ajout
    format: true-false
    question: Ajouter un sous-type autorisé fait échouer la compilation des `switch` exhaustifs qui ne le traitent pas.
    truth: true
    answer: C'est l'objectif.
  - key: vf-non-sealed
    format: true-false
    question: Un sous-type `non-sealed` doit être couvert par un cas sur lui-même (ou un supertype).
    truth: true
    answer: Ses sous-classes sont inconnues du compilateur.
  - key: qcm-exhaustif
    format: multiple-choice
    question: "Avec `sealed interface Resultat permits Ok, Erreur`, lesquels sont exhaustifs ?"
    choices:
      - text: "`case Ok o -> ...; case Erreur e -> ...;`"
        correct: true
      - text: "`case Ok o -> ...; case Erreur e when e.grave() -> ...; case Erreur e -> ...;`"
        correct: true
      - text: "`case Ok o -> ...; case Erreur e when e.grave() -> ...;`"
        correct: false
      - text: "`case Ok o -> ...;`"
        correct: false
    answer: Les erreurs non graves ne seraient couvertes par aucun cas.
  - key: qcm-ajout
    format: multiple-choice
    question: Que se passe-t-il quand on ajoute un sous-type autorisé à une interface scellée ?
    choices:
      - text: "Les `switch` sans `default` qui ne le traitent pas ne compilent plus"
        correct: true
      - text: "Les `switch` avec `default` compilent toujours et y envoient le nouveau cas"
        correct: true
      - text: "Tous les `switch` lèvent une exception à l'exécution"
        correct: false
      - text: "Rien ne change"
        correct: false
    answer: Le `default` masque l'oubli.
  - key: qcm-exception
    format: multiple-choice
    question: Quelle exception lève un `switch` exhaustif face à un cas imprévu à l'exécution ?
    choices:
      - text: "`MatchException`"
        correct: true
      - text: "`IllegalStateException`"
        correct: false
      - text: "`ClassCastException`"
        correct: false
      - text: "`IncompatibleClassChangeError`, toujours"
        correct: false
    answer: Le `default` implicite d'un `switch` à motifs exhaustif la lève depuis Java 21.
  - key: qcm-imbrique
    format: multiple-choice
    question: "Avec `sealed interface Bit permits Zero, Un` et `record Paire(Bit a, Bit b)`, quels cas couvrent `Paire` ?"
    choices:
      - text: "`case Paire(Zero z, var b) -> ...; case Paire(Un u, var b) -> ...;`"
        correct: true
      - text: "`case Paire(var a, var b) -> ...;`"
        correct: true
      - text: "`case Paire(Zero z, Zero y) -> ...; case Paire(Un u, Un v) -> ...;`"
        correct: false
      - text: "`case Paire(Zero z, var b) -> ...;`"
        correct: false
    answer: La troisième oublie les paires mixtes ; la dernière les paires commençant par `Un`.
  - key: code-exhaustif
    format: code-output
    question: |-
      ```java
      class Demo {
          sealed interface Forme permits Cercle, Carre {}
          record Cercle(double r) implements Forme {}
          record Carre(double c) implements Forme {}
          static String nom(Forme f) {
              return switch (f) {
                  case Cercle c -> "cercle";
                  case Carre c -> "carré";
              };
          }
      }
      System.out.println(Demo.nom(new Demo.Carre(2)));
      ```
    answer: '`carré` : exhaustif sans `default`.'
    check:
      output: "carré"
  - key: code-manquant
    format: code-output
    question: |-
      ```java
      class Demo {
          sealed interface Forme permits Cercle, Carre {}
          record Cercle(double r) implements Forme {}
          record Carre(double c) implements Forme {}
          static String nom(Forme f) {
              return switch (f) {
                  case Cercle c -> "cercle";
              };
          }
      }
      ```
    answer: "Ne compile pas : le `switch` ne couvre pas `Carre`."
    check:
      compiles: false
  - key: code-garde
    format: code-output
    question: |-
      ```java
      class Demo {
          sealed interface Forme permits Cercle, Carre {}
          record Cercle(double r) implements Forme {}
          record Carre(double c) implements Forme {}
          static String nom(Forme f) {
              return switch (f) {
                  case Cercle c -> "cercle";
                  case Carre c when c.c() > 1 -> "grand carré";
              };
          }
      }
      ```
    answer: "Ne compile pas : la garde laisse les petits carrés sans cas."
    check:
      compiles: false
  - key: code-imbrique
    format: code-output
    question: |-
      ```java
      class Demo {
          sealed interface Bit permits Zero, Un {}
          record Zero() implements Bit {}
          record Un() implements Bit {}
          record Paire(Bit a, Bit b) {}
          static int valeur(Paire p) {
              return switch (p) {
                  case Paire(Zero a, Zero b) -> 0;
                  case Paire(Zero a, Un b) -> 1;
                  case Paire(Un a, Zero b) -> 2;
                  case Paire(Un a, Un b) -> 3;
              };
          }
      }
      System.out.println(Demo.valeur(new Demo.Paire(new Demo.Un(), new Demo.Zero())));
      ```
    answer: '`2` : les quatre combinaisons couvrent `Paire`.'
    check:
      output: "2"
