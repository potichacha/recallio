notion: exhaustivite-scellees
lesson: |-
  Sur un type **scellé**, le compilateur connaît tous les sous-types : un `switch` qui les traite tous est **exhaustif**
  sans `default`.

  ```java
  sealed interface Forme permits Cercle, Carre, Triangle {}
  record Cercle(double r) implements Forme {}
  record Carre(double c) implements Forme {}
  record Triangle(double b, double h) implements Forme {}

  static double aire(Forme f) {
      return switch (f) {                 // pas de default
          case Cercle c -> Math.PI * c.r() * c.r();
          case Carre c -> c.c() * c.c();
          case Triangle t -> t.b() * t.h() / 2;
      };
  }
  ```

  - Si l'on ajoute `record Losange(...) implements Forme` (et qu'on l'ajoute au `permits`), **chaque** `switch` sans
    `default` qui ne le traite pas **cesse de compiler**. Les oublis deviennent impossibles.
  - Un `default` supprime cette garantie : à éviter sur un type scellé.
  - L'exhaustivité suit la hiérarchie : un sous-type `sealed` doit être couvert par ses propres sous-types (ou par un cas
    sur lui-même), un sous-type `non-sealed` par un cas sur lui-même.
  - Les **gardes** `when` ne comptent pas pour l'exhaustivité : `case Cercle c when c.r() > 1` ne couvre pas tous les
    cercles.
  - Les motifs de record imbriqués comptent : `case Paire(Oui o, var x)` et `case Paire(Non n, var x)` couvrent `Paire`
    si `Oui`/`Non` couvrent le type scellé.
  - À l'exécution, si une classe recompilée séparément ajoute un cas inconnu, le `switch` lève une **`MatchException`**.
  - L'exhaustivité ne concerne que les `switch` **expressions** et les `switch` à motifs ; un vieux `switch` instruction
    sur une enum n'est pas vérifié.

  **Piège classique** : une garde sur le dernier cas (`case Triangle t when t.b() > 0`). Le `switch` n'est plus
  exhaustif : le compilateur exige un cas pour les triangles restants.

  **En entretien** : « Sur un type scellé, couvrir tous les sous-types suffit, sans `default` ; ajouter un cas casse la
  compilation partout où il manque. Les gardes ne comptent pas. »
cards:
  - key: interet-sealed-switch
    format: course
    question: "Quel est l'intérêt d'un `switch` sur un type scellé ?"
    choices:
      - {text: "Le compilateur vérifie que tous les cas sont traités, sans `default`", correct: true}
      - {text: "Le `switch` s'exécute plus vite, grâce à une table de sauts", correct: false}
      - {text: "Le `switch` accepte `null` sans lever d'exception", correct: false}
      - {text: "Le `switch` n'a plus besoin de `break` entre les cas", correct: false}
    answer: |-
      L'exhaustivité est vérifiée par le compilateur, sans `default` : ajouter un sous-type fait échouer la compilation
      partout où il n'est pas traité. Un `switch` sur `null` lève toujours une `NullPointerException`, sauf `case null`.
  - key: gardes
    format: course
    question: Les gardes `when` comptent-elles pour l'exhaustivité ?
    choices:
      - {text: "Non : un cas gardé ne couvre pas tout son type, il faut aussi un cas sans garde", correct: true}
      - {text: "Oui : un cas gardé couvre tout son type, exactement comme un cas sans garde", correct: false}
      - {text: "Oui, à condition que les gardes des différents cas ne se recouvrent pas", correct: false}
      - {text: "Non : un `switch` qui contient une garde n'est jamais vérifié exhaustif", correct: false}
    answer: |-
      Non : un cas gardé ne couvre pas tout son type ; il faut aussi un cas sans garde (ou un `default`). Le compilateur
      ne raisonne pas sur le contenu des gardes.
  - key: match-exception
    format: course
    question: Que se passe-t-il à l'exécution si un `switch` exhaustif rencontre un sous-type inconnu à la compilation ?
    choices:
      - {text: "Il lève une `MatchException`", correct: true}
      - {text: "Il lève une `IncompatibleClassChangeError`", correct: false}
      - {text: "Il ne fait rien et renvoie `null`", correct: false}
      - {text: "Il exécute le premier cas du `switch`", correct: false}
    answer: |-
      Il lève une `MatchException` (cas d'une classe recompilée séparément avec un nouveau sous-type). Avant Java 21, un
      `switch` sur une enum levait une `IncompatibleClassChangeError` dans ce cas.
  - key: sous-hierarchie
    format: course
    question: Comment couvrir un sous-type lui-même `sealed` dans un `switch` exhaustif ?
    choices:
      - {text: "Par un cas sur ce sous-type, ou par des cas sur tous ses propres sous-types autorisés", correct: true}
      - {text: "Par un cas sur ce sous-type seulement : ses propres sous-types ne comptent pas", correct: false}
      - {text: "Par un `default` obligatoire, dès que la hiérarchie a plus d'un niveau", correct: false}
      - {text: "Par des cas sur ses sous-types seulement : un cas sur lui-même ne compile pas", correct: false}
    answer: Soit par un cas sur ce sous-type, soit par des cas sur tous ses propres sous-types autorisés.
  - key: vf-default-utile
    format: true-false
    question: Sur un type scellé, un `default` renforce la vérification d'exhaustivité.
    truth: false
    answer: "Il la supprime : un nouveau cas tombe dans le `default`."
  - key: vf-garde
    format: true-false
    question: "`case Cercle c when c.r() > 0` suffit à couvrir le sous-type `Cercle`."
    truth: false
    answer: La garde rend le cas partiel.
  - key: vf-ajout
    format: true-false
    question: Ajouter un sous-type autorisé fait échouer la compilation des `switch` exhaustifs qui ne le traitent pas.
    truth: true
    answer: C'est l'objectif.
  - key: vf-non-sealed
    format: true-false
    question: Un sous-type `non-sealed` doit être couvert par un cas sur lui-même (ou un supertype).
    truth: true
    answer: Ses sous-classes sont inconnues du compilateur.
  - key: qcm-exhaustif
    format: multiple-choice
    question: "Avec `sealed interface Resultat permits Ok, Erreur`, lesquels de ces `switch` sont exhaustifs ?"
    choices:
      - text: "`case Ok o -> ...; case Erreur e -> ...;`"
        correct: true
      - text: "`case Ok o -> ...; case Erreur e when e.grave() -> ...; case Erreur e -> ...;`"
        correct: true
      - text: "`case Ok o -> ...; case Erreur e when e.grave() -> ...;`"
        correct: false
      - text: "`case Ok o -> ...;`"
        correct: false
    answer: Les erreurs non graves ne seraient couvertes par aucun cas.
  - key: qcm-ajout
    format: multiple-choice
    question: "On ajoute un sous-type autorisé à une interface scellée. Que devient un `switch` sur cette interface qui a un `default` ?"
    choices:
      - {text: "Il compile toujours et envoie le nouveau cas dans le `default`", correct: true}
      - {text: "Il ne compile plus tant que le nouveau cas n'est pas traité", correct: false}
      - {text: "Il lève une `MatchException` quand arrive le nouveau cas", correct: false}
      - {text: "Il ignore le nouveau cas, sans entrer dans aucune branche", correct: false}
    answer: |-
      Le `default` masque l'oubli : le nouveau cas y tombe sans erreur. Seuls les `switch` sans `default` cessent de
      compiler, ce qui force à traiter le nouveau cas.
  - key: qcm-exception
    format: multiple-choice
    question: Quelle exception lève un `switch` exhaustif face à un cas imprévu à l'exécution ?
    choices:
      - text: "`MatchException`"
        correct: true
      - text: "`IllegalStateException`"
        correct: false
      - text: "`ClassCastException`"
        correct: false
      - text: "`IncompatibleClassChangeError`, toujours"
        correct: false
    answer: Le `default` implicite d'un `switch` à motifs exhaustif la lève depuis Java 21.
  - key: qcm-imbrique
    format: multiple-choice
    question: "Avec `sealed interface Bit permits Zero, Un` et `record Paire(Bit a, Bit b)`, lesquelles de ces listes de cas couvrent `Paire` ?"
    choices:
      - text: "`case Paire(Zero z, var b) -> ...; case Paire(Un u, var b) -> ...;`"
        correct: true
      - text: "`case Paire(var a, var b) -> ...;`"
        correct: true
      - text: "`case Paire(Zero z, Zero y) -> ...; case Paire(Un u, Un v) -> ...;`"
        correct: false
      - text: "`case Paire(Zero z, var b) -> ...;`"
        correct: false
    answer: La troisième oublie les paires mixtes ; la dernière les paires commençant par `Un`.
  - key: code-exhaustif
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Demo {
          sealed interface Forme permits Cercle, Carre {}
          record Cercle(double r) implements Forme {}
          record Carre(double c) implements Forme {}
          static String nom(Forme f) {
              return switch (f) {
                  case Cercle c -> "cercle";
                  case Carre c -> "carré";
              };
          }
      }
      System.out.println(Demo.nom(new Demo.Carre(2)));
      ```
    choices:
      - {text: "`carré`", correct: true}
      - {text: "`cercle`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Une `MatchException`", correct: false}
    answer: '`carré` : exhaustif sans `default`.'
    check:
      output: "carré"
  - key: code-manquant
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Demo {
          sealed interface Forme permits Cercle, Carre {}
          record Cercle(double r) implements Forme {}
          record Carre(double c) implements Forme {}
          static String nom(Forme f) {
              return switch (f) {
                  case Cercle c -> "cercle";
              };
          }
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Rien", correct: false}
      - {text: "Une `MatchException`", correct: false}
    answer: "Ne compile pas : le `switch` ne couvre pas `Carre`."
    check:
      compiles: false
  - key: code-garde
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Demo {
          sealed interface Forme permits Cercle, Carre {}
          record Cercle(double r) implements Forme {}
          record Carre(double c) implements Forme {}
          static String nom(Forme f) {
              return switch (f) {
                  case Cercle c -> "cercle";
                  case Carre c when c.c() > 1 -> "grand carré";
              };
          }
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Rien", correct: false}
      - {text: "Une `MatchException`", correct: false}
    answer: "Ne compile pas : la garde laisse les petits carrés sans cas."
    check:
      compiles: false
  - key: code-imbrique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Demo {
          sealed interface Bit permits Zero, Un {}
          record Zero() implements Bit {}
          record Un() implements Bit {}
          record Paire(Bit a, Bit b) {}
          static int valeur(Paire p) {
              return switch (p) {
                  case Paire(Zero a, Zero b) -> 0;
                  case Paire(Zero a, Un b) -> 1;
                  case Paire(Un a, Zero b) -> 2;
                  case Paire(Un a, Un b) -> 3;
              };
          }
      }
      System.out.println(Demo.valeur(new Demo.Paire(new Demo.Un(), new Demo.Zero())));
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "`0`", correct: false}
    answer: '`2` : les quatre combinaisons couvrent `Paire`.'
    check:
      output: "2"
