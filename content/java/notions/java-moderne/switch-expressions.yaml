notion: switch-expressions
cards:
  - key: switch-classique-vs-switch-expression
    format: course
    question: Switch classique vs switch expression ?
    answer: Le classique a du fall-through et nécessite des `break` ; l'expression (`->`) n'en a pas, retourne une valeur et doit être exhaustive.
  - key: yield
    format: course
    question: C'est quoi yield ?
    answer: Le mot-clé qui retourne une valeur depuis un bloc dans une switch expression.
