notion: switch-expressions
lesson: |-
  Depuis Java 14, `switch` peut être une **expression** qui produit une valeur, avec des étiquettes **`->`** :

  ```java
  int jours = switch (mois) {
      case FEVRIER -> bissextile ? 29 : 28;
      case AVRIL, JUIN, SEPTEMBRE, NOVEMBRE -> 30;     // plusieurs valeurs par cas
      default -> 31;
  };

  String libelle = switch (code) {
      case 200 -> "OK";
      case 404 -> "Introuvable";
      default -> {
          log.warn("code inattendu {}", code);
          yield "Erreur " + code;                      // yield renvoie la valeur d'un bloc
      }
  };
  ```

  - Avec `->`, **pas de fall-through** : seul le cas choisi s'exécute, sans `break`.
  - Un bloc `{ ... }` renvoie sa valeur avec **`yield`** (pas `return`, qui sortirait de la méthode).
  - Une expression `switch` doit être **exhaustive** : toutes les valeurs possibles doivent être couvertes, par les cas
    ou par un `default`. Sur une **enum**, lister toutes les constantes suffit, sans `default`.
  - La forme `->` s'utilise aussi en **instruction** (sans valeur), ce qui supprime les `break` oubliés.
  - Les deux syntaxes (`case X:` et `case X ->`) ne se mélangent pas dans un même `switch`.
  - Un `switch` expression sur une enum sans `default` qui couvre toutes les constantes reçoit un `default` implicite,
    qui lève une erreur si une nouvelle constante apparaît à l'exécution (enum recompilée séparément).

  **Piège classique** : ajouter un `default` à un `switch` exhaustif sur une enum. Le jour où une constante est ajoutée,
  le compilateur ne signale plus rien : elle tombe dans le `default`.

  **En entretien** : « Le `switch` expression avec `->` : pas de fall-through, une valeur, `yield` dans les blocs, et
  l'exhaustivité vérifiée par le compilateur, sans `default` sur une enum complète. »
cards:
  - key: switch-classique-vs-switch-expression
    format: course
    question: "Quelle différence entre le `switch` classique et le `switch` expression ?"
    choices:
      - {text: "Le classique a du fall-through et des `break` ; l'expression (`->`) renvoie une valeur, exhaustive", correct: true}
      - {text: "Le classique renvoie une valeur ; l'expression n'exécute que des instructions, sans valeur", correct: false}
      - {text: "Le classique accepte les chaînes ; l'expression n'accepte que les enums et les entiers", correct: false}
      - {text: "Aucune : l'expression n'est qu'une autre syntaxe, avec le même fall-through", correct: false}
    answer: |-
      Le classique a du fall-through et nécessite des `break` ; l'expression (`->`) n'en a pas, renvoie une valeur et doit
      être exhaustive.
  - key: yield
    format: course
    question: "À quoi sert `yield` dans un `switch` expression ?"
    choices:
      - {text: "À renvoyer la valeur d'un bloc `{ }` dans un `switch` expression", correct: true}
      - {text: "À céder le processeur à un autre thread, comme `Thread.yield()`", correct: false}
      - {text: "À passer au cas suivant, comme le fall-through du `switch` classique", correct: false}
      - {text: "À sortir de la méthode en renvoyant une valeur, comme `return`", correct: false}
    answer: |-
      C'est le mot-clé qui renvoie une valeur depuis un bloc dans un `switch` expression. Un `return` y est interdit : il
      sortirait de la méthode.
  - key: exhaustivite-enum
    format: course
    question: Pourquoi éviter un `default` dans un `switch` expression qui couvre toutes les constantes d'une enum ?
    choices:
      - {text: "Sans `default`, ajouter une constante fait échouer la compilation du `switch`", correct: true}
      - {text: "Un `default` ralentit le `switch`, qui ne peut plus utiliser de table de sauts", correct: false}
      - {text: "Un `default` est interdit dans un `switch` expression sur une enum", correct: false}
      - {text: "Sans `default`, une constante oubliée renvoie `null` au lieu d'échouer", correct: false}
    answer: |-
      Sans `default`, ajouter une constante fait échouer la compilation du `switch` ; avec, elle y tombe silencieusement.
      Le `default` reste permis, mais il masque les oublis.
  - key: plusieurs-valeurs
    format: course
    question: Comment traiter plusieurs valeurs dans un même cas ?
    choices:
      - {text: "En les séparant par des virgules : `case SAMEDI, DIMANCHE ->`", correct: true}
      - {text: "En les séparant par `||` : `case SAMEDI || DIMANCHE ->`", correct: false}
      - {text: "En les enchaînant : `case SAMEDI -> case DIMANCHE ->`", correct: false}
      - {text: "Avec une plage : `case SAMEDI..DIMANCHE ->`", correct: false}
    answer: En les séparant par des virgules, `case SAMEDI, DIMANCHE -> "week-end";`.
  - key: vf-break
    format: true-false
    question: Les cas `->` d'un `switch` ont besoin de `break`.
    truth: false
    answer: Il n'y a pas de fall-through avec `->`.
  - key: vf-return
    format: true-false
    question: Dans un bloc d'un `switch` expression, `return valeur;` renvoie la valeur du `switch`.
    truth: false
    answer: On utilise `yield` ; `return` n'est pas permis dans un `switch` expression.
  - key: vf-exhaustif
    format: true-false
    question: "Un `switch` expression sur un `int` sans `default` ne compile pas."
    truth: true
    answer: Les cas ne peuvent pas couvrir toutes les valeurs d'un `int`.
  - key: vf-instruction
    format: true-false
    question: La syntaxe `->` peut s'utiliser dans un `switch` qui ne renvoie pas de valeur.
    truth: true
    answer: Un `switch` instruction avec `->` évite les `break` oubliés.
  - key: qcm-valide
    format: multiple-choice
    question: Lesquelles compilent pour une enum `Feu { ROUGE, ORANGE, VERT }` ?
    choices:
      - text: "`String s = switch (f) { case ROUGE -> \"stop\"; case ORANGE, VERT -> \"passe\"; };`"
        correct: true
      - text: "`String s = switch (f) { case ROUGE -> \"stop\"; default -> \"passe\"; };`"
        correct: true
      - text: "`String s = switch (f) { case ROUGE -> \"stop\"; case VERT -> \"passe\"; };`"
        correct: false
      - text: "`String s = switch (f) { case ROUGE: \"stop\"; };`"
        correct: false
    answer: La troisième oublie ORANGE ; la dernière n'est pas une syntaxe valide.
  - key: qcm-yield
    format: multiple-choice
    question: "Comment renvoyer une valeur depuis le bloc `default -> { ... }` d'un `switch` expression ?"
    choices:
      - text: "`yield valeur;`"
        correct: true
      - text: "`return valeur;`"
        correct: false
      - text: "`break valeur;`"
        correct: false
      - text: "Écrire la valeur seule en dernière ligne"
        correct: false
    answer: '`yield` est un mot-clé contextuel, réservé à cet usage.'
  - key: qcm-melange
    format: multiple-choice
    question: Que dire d'un `switch` qui mélange `case 1:` et `case 2 ->` ?
    choices:
      - text: "Il ne compile pas"
        correct: true
      - text: "Il compile, avec fall-through pour le premier cas"
        correct: false
      - text: "Il compile, sans fall-through"
        correct: false
      - text: "Il compile avec un avertissement"
        correct: false
    answer: Les deux styles d'étiquettes sont exclusifs.
  - key: qcm-avantages
    format: multiple-choice
    question: "Quel avantage a un `switch` expression sur l'ancien `switch` ?"
    choices:
      - {text: "Pas de fall-through accidentel entre les cas", correct: true}
      - {text: "Il est toujours plus rapide à l'exécution", correct: false}
      - {text: "Il accepte des conditions comme `case x > 3`", correct: false}
      - {text: "Il ne lève jamais d'exception sur `null`", correct: false}
    answer: |-
      Les étiquettes `->` n'ont pas de fall-through, et le compilateur vérifie l'exhaustivité. Les conditions passent par
      les motifs et `when`, pas par des expressions de cas.
  - key: trous-fleche
    format: fill-in
    question: |-
      Complète :
      ```java
      String type = switch (jour) {
          case SAMEDI, DIMANCHE ___ "week-end";
          default ___ "semaine";
      };
      ```
    blanks: [["->"], ["->"]]
    answer: Les étiquettes `->` n'ont pas de fall-through.
  - key: trous-yield
    format: fill-in
    question: |-
      Complète :
      ```java
      int score = switch (niveau) {
          case FACILE -> 1;
          case DIFFICILE -> {
              int base = 3;
              ___ base * bonus;
          }
      };
      ```
    blanks: [[yield]]
    answer: '`yield` renvoie la valeur d''un bloc.'
  - key: trous-default
    format: fill-in
    question: |-
      Complète pour couvrir tous les autres codes :
      ```java
      String s = switch (code) {
          case 200 -> "OK";
          ___ -> "autre";
      };
      ```
    blanks: [[default]]
    answer: Un `int` exige un `default` pour être exhaustif.
  - key: trous-virgule
    format: fill-in
    question: |-
      Complète pour regrouper deux voyelles :
      ```java
      boolean v = switch (c) {
          case 'a'___ 'e' -> true;
          default -> false;
      };
      ```
    blanks: [[","]]
    answer: Plusieurs valeurs séparées par des virgules.
  - key: code-enum
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Feu { ROUGE, ORANGE, VERT }
      for (Feu f : Feu.values()) {
          System.out.print(switch (f) {
              case ROUGE -> "s";
              case ORANGE, VERT -> "p";
          });
      }
      ```
    choices:
      - {text: "`spp`", correct: true}
      - {text: "`sp`", correct: false}
      - {text: "`ssp`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`spp` : `ROUGE` donne `s`, `ORANGE` et `VERT` donnent `p` ; les cas couvrent toute l'enum, sans `default`."
    check:
      output: "spp"
  - key: code-yield
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int code = 503;
      String s = switch (code) {
          case 200 -> "OK";
          default -> {
              String famille = code >= 500 ? "serveur" : "client";
              yield "erreur " + famille;
          }
      };
      System.out.println(s);
      ```
    choices:
      - {text: "`erreur serveur`", correct: true}
      - {text: "`erreur client`", correct: false}
      - {text: "`OK`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: '`erreur serveur`.'
    check:
      output: "erreur serveur"
  - key: code-sans-fall-through
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int n = 1;
      switch (n) {
          case 1 -> System.out.print("un ");
          case 2 -> System.out.print("deux ");
          default -> System.out.print("autre ");
      }
      System.out.println("fin");
      ```
    choices:
      - {text: "`un fin`", correct: true}
      - {text: "`un deux autre fin`", correct: false}
      - {text: "`un deux fin`", correct: false}
      - {text: "`fin`", correct: false}
    answer: '`un fin` : pas de fall-through avec `->`.'
    check:
      output: "un fin"
  - key: code-non-exhaustif
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Taille { S, M, L }
      Taille t = Taille.M;
      int prix = switch (t) {
          case S -> 10;
          case M -> 12;
      };
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Rien", correct: false}
      - {text: "Une `MatchException`", correct: false}
    answer: "Ne compile pas : le `switch` expression ne couvre pas `L`."
    check:
      compiles: false
  - key: bug-fall-through
    format: bug-fix
    question: |-
      Ce code affiche « petit moyen grand » pour une petite taille. Quelle correction est la bonne ?
      ```java
      switch (taille) {
          case S: System.out.print("petit ");
          case M: System.out.print("moyen ");
          case L: System.out.print("grand ");
      }
      ```
    choices:
      - {text: "Passer aux étiquettes `->`, qui n'enchaînent pas les cas suivants", correct: true}
      - {text: "Ajouter un `default` à la fin du `switch`", correct: false}
      - {text: "Ranger les cas dans l'ordre inverse : `L`, `M`, puis `S`", correct: false}
      - {text: "Remplacer `print` par `println` dans chaque cas", correct: false}
    answer: |-
      ```java
      switch (taille) {
          case S -> System.out.print("petit ");
          case M -> System.out.print("moyen ");
          case L -> System.out.print("grand ");
      }
      ```
      Les `case X:` sans `break` enchaînent les cas suivants. Avec `->`, seul le cas choisi s'exécute.
  - key: bug-variable-switch
    format: bug-fix
    question: |-
      Comment simplifier ce code ?
      ```java
      String libelle;
      switch (statut) {
          case ACTIF: libelle = "Actif"; break;
          case SUSPENDU: libelle = "Suspendu"; break;
          default: libelle = "Inconnu";
      }
      ```
    choices:
      - {text: "Un `switch` expression qui initialise `libelle`, avec des cas `->`", correct: true}
      - {text: "Retirer les `break`, inutiles quand chaque cas affecte la variable", correct: false}
      - {text: "Remplacer le `switch` par `statut.name()`, qui donne le libellé", correct: false}
      - {text: "Déclarer `libelle` `final`, ce qui rend les `break` inutiles", correct: false}
    answer: |-
      ```java
      String libelle = switch (statut) {
          case ACTIF -> "Actif";
          case SUSPENDU -> "Suspendu";
          default -> "Inconnu";
      };
      ```
      Un `switch` expression initialise la variable directement, sans `break` ni affectations répétées. Si les cas
      couvrent un jour toutes les constantes de l'enum, on retirera le `default` pour que le compilateur signale les
      nouveaux statuts.
  - key: bug-return-yield
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      int remise = switch (client) {
          case VIP -> 20;
          default -> {
              int base = anciennete > 5 ? 10 : 0;
              return base;
          }
      };
      ```
    choices:
      - {text: "Remplacer `return base;` par `yield base;` dans le bloc", correct: true}
      - {text: "Remplacer `return base;` par `break base;` dans le bloc", correct: false}
      - {text: "Retirer les accolades autour du bloc `default`", correct: false}
      - {text: "Ajouter `return remise;` juste après le `switch`", correct: false}
    answer: |-
      ```java
      default -> {
          int base = anciennete > 5 ? 10 : 0;
          yield base;
      }
      ```
      Dans un `switch` expression, un bloc renvoie sa valeur avec `yield`.
  - key: bug-default-masque
    format: bug-fix
    question: |-
      Le statut `REMBOURSEE`, ajouté récemment, s'affiche « Inconnu » sans que personne ne l'ait vu. Quelle correction est la bonne ?
      ```java
      String s = switch (statut) {
          case PAYEE -> "Payée";
          case ANNULEE -> "Annulée";
          default -> "Inconnu";
      };
      ```
    choices:
      - {text: "Traiter `REMBOURSEE` et retirer le `default`, pour que le compilateur signale tout oubli", correct: true}
      - {text: "Traiter `REMBOURSEE` et garder le `default`, au cas où un autre statut arriverait", correct: false}
      - {text: "Lever une exception dans le `default`, au lieu de renvoyer « Inconnu »", correct: false}
      - {text: "Journaliser un avertissement dans le `default`, pour repérer les oublis", correct: false}
    answer: |-
      ```java
      String s = switch (statut) {
          case PAYEE -> "Payée";
          case ANNULEE -> "Annulée";
          case REMBOURSEE -> "Remboursée";
      };
      ```
      Sans `default`, le compilateur exige que toutes les constantes soient traitées : un nouveau statut fait échouer la
      compilation au lieu de tomber dans un cas fourre-tout.
