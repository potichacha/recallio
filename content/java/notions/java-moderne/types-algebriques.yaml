notion: types-algebriques
lesson: |-
  Les **types algébriques** viennent de la programmation fonctionnelle. Java 21 permet de les écrire avec deux outils :

  - le **produit** : un type qui contient *plusieurs valeurs à la fois*, c'est un **record** (`record Point(int x, int y)`) ;
  - la **somme** : un type qui est *un cas parmi plusieurs*, c'est une **interface scellée** dont chaque cas est un
    record.

  ```java
  sealed interface Resultat<T> permits Succes, Echec {}
  record Succes<T>(T valeur) implements Resultat<T> {}
  record Echec<T>(String message) implements Resultat<T> {}

  sealed interface Expr permits Nombre, Somme, Produit {}
  record Nombre(int valeur) implements Expr {}
  record Somme(Expr gauche, Expr droite) implements Expr {}
  record Produit(Expr gauche, Expr droite) implements Expr {}

  static int evaluer(Expr e) {
      return switch (e) {                                   // exhaustif : pas de default
          case Nombre n -> n.valeur();
          case Somme(Expr g, Expr d) -> evaluer(g) + evaluer(d);
          case Produit(Expr g, Expr d) -> evaluer(g) * evaluer(d);
      };
  }
  ```

  Ce style, **orienté données**, sépare les données (les records) des opérations (des `switch` exhaustifs) :
  - ajouter une **opération** (afficher, simplifier) = écrire une nouvelle méthode, sans toucher aux types ;
  - ajouter un **cas** = le compilateur signale tous les `switch` à compléter.

  Le polymorphisme classique fait l'inverse : ajouter un type est facile, ajouter une opération touche toutes les
  classes. C'est le compromis connu sous le nom d'*expression problem* : on choisit selon ce qui évolue le plus souvent.

  - On rend les **états impossibles irreprésentables** : une `Commande` « expédiée » a toujours un numéro de suivi, au
    lieu d'un champ facultatif.
  - Une enum suffit quand les cas ne portent **pas de données** différentes.

  **Piège classique** : ajouter un `default` dans le `switch` d'un type scellé. On perd la garantie d'exhaustivité : un
  nouveau cas tombe silencieusement dans le `default`.

  **En entretien** : « Records pour les produits, interface scellée pour les sommes, `switch` exhaustif pour les
  opérations ; un nouveau cas casse la compilation là où il manque. »
cards:
  - key: definition
    format: course
    question: Comment écrit-on un type algébrique en Java ?
    answer: Une interface scellée (le type somme, un cas parmi plusieurs) dont chaque cas est un record (le type produit, plusieurs valeurs ensemble), traités par des `switch` exhaustifs.
  - key: etats-impossibles
    format: course
    question: Que signifie « rendre les états impossibles irreprésentables » ?
    answer: Modéliser de sorte qu'un objet incohérent ne puisse pas être construit, par exemple un statut `Expediee(numeroSuivi)` qui porte toujours son numéro au lieu d'un champ facultatif.
  - key: expression-problem
    format: course
    question: Quel est le compromis entre types scellés avec `switch` et polymorphisme classique ?
    answer: Avec les types scellés, ajouter une opération est facile et ajouter un cas oblige à compléter les `switch` ; avec le polymorphisme, ajouter un type est facile mais ajouter une opération touche toutes les classes (l'expression problem).
  - key: enum-ou-sealed
    format: course
    question: Quand une enum suffit-elle à la place d'une interface scellée ?
    answer: Quand les cas ne portent pas de données propres à chaque instance ; dès qu'un cas a ses propres champs, une interface scellée de records.
  - key: vf-default
    format: true-false
    question: Un `default` dans un `switch` sur un type scellé est une bonne précaution.
    truth: false
    answer: "Il supprime la vérification d'exhaustivité : un nouveau cas y tombe sans erreur."
  - key: vf-recursif
    format: true-false
    question: Un record d'une hiérarchie scellée peut avoir des composants du type scellé lui-même.
    truth: true
    answer: Par exemple `record Somme(Expr gauche, Expr droite) implements Expr`.
  - key: vf-generique
    format: true-false
    question: Une interface scellée peut être générique, comme `Resultat<T>`.
    truth: true
    answer: Ses cas le sont aussi (`Succes<T>`, `Echec<T>`).
  - key: vf-ajout-cas
    format: true-false
    question: Ajouter un cas à une interface scellée fait échouer la compilation des `switch` exhaustifs qui ne le traitent pas.
    truth: true
    answer: "C'est l'intérêt principal : aucun oubli possible."
  - key: qcm-modele
    format: multiple-choice
    question: Comment modéliser le résultat d'une validation (valide, ou une liste d'erreurs) ?
    choices:
      - text: "`sealed interface Validation permits Valide, Invalide` avec `record Invalide(List<String> erreurs)`"
        correct: true
      - text: "Une classe avec un booléen `valide` et une liste `erreurs` souvent vide ou `null`"
        correct: false
      - text: "Une exception levée dans tous les cas"
        correct: false
      - text: "Un `Map<String, Object>`"
        correct: false
    answer: Chaque cas porte exactement ses données.
  - key: qcm-ajout
    format: multiple-choice
    question: Dans un modèle scellé avec `switch` exhaustifs, qu'est-ce qui est facile ?
    choices:
      - text: "Ajouter une nouvelle opération sur tous les cas"
        correct: true
      - text: "Ajouter un cas sans modifier aucun code existant"
        correct: false
      - text: "Laisser des clients externes ajouter leurs propres cas"
        correct: false
      - text: "Se passer de `switch`"
        correct: false
    answer: Ajouter un cas oblige à compléter les `switch`, ce qui est voulu.
  - key: qcm-produit-somme
    format: multiple-choice
    question: Associez les notions.
    choices:
      - text: "Type produit : un record"
        correct: true
      - text: "Type somme : une interface scellée"
        correct: true
      - text: "Type produit : une enum"
        correct: false
      - text: "Type somme : une classe abstraite ouverte"
        correct: false
    answer: Une hiérarchie ouverte ne garantit pas qu'on connaît tous les cas.
  - key: qcm-traitement
    format: multiple-choice
    question: Quelle écriture traite un `Resultat<T>` scellé de façon exhaustive ?
    choices:
      - text: "`switch (r) { case Succes<T> s -> ...; case Echec<T> e -> ...; }`"
        correct: true
      - text: "`if (r instanceof Succes) ... else ...`, sans garantie"
        correct: false
      - text: "`switch (r.getClass().getName())`"
        correct: false
      - text: "`r.equals(Succes.class)`"
        correct: false
    answer: Le `switch` à motifs est vérifié par le compilateur.
  - key: dois-modeliser-types-operations-dont-chacun
    format: scenario
    question: Tu dois modéliser des types d'opérations dont chacun a un comportement différent. Enum, hiérarchie de classes ou sealed ?
    answer: |-
      Si la liste est **fermée** et que les opérations sont des **singletons sans état variable**, une enum avec une implémentation par constante est idéale : compacte, sérialisable, utilisable dans un switch, avec EnumMap/EnumSet.
      Si chaque cas porte des **données différentes** par instance, une interface **sealed** avec des records : le compilateur garantit l'exhaustivité des switch.
      Et si la liste doit rester **ouverte** à des extensions (plugins, autres modules), une interface classique avec des implémentations injectées, éventuellement découvertes par `ServiceLoader` ou par le conteneur d'injection.
  - key: modelises-statuts-commande-chacun-portant
    format: scenario
    question: Tu modélises les statuts d'une commande, chacun portant des données différentes. Comment ?
    answer: |-
      Une interface **sealed** avec des **records** comme implémentations : `OrderStatus` autorisant `Pending`, `Shipped(trackingNumber)`, `Delivered(date)`, `Cancelled(reason)`.
      Le gain arrive au traitement : un `switch` sur le statut est **exhaustif**. Le compilateur sait qu'il n'existe que ces quatre cas, donc pas de `default` artificiel. Et surtout, si quelqu'un ajoute un statut demain, **tous les switch qui ne le traitent pas cessent de compiler** : l'oubli devient impossible.
      Comparé aux alternatives : une enum avec des champs optionnels force à porter des données nulles selon le cas ; une hiérarchie de classes ouverte ne donne aucune garantie d'exhaustivité, et un cas oublié tombe silencieusement dans le `default`.
  - key: pattern-matching-change-facon-concevoir
    format: scenario
    question: Comment le pattern matching change-t-il ta façon de concevoir ?
    answer: |-
      Il rend viable une approche orientée **données** à côté de l'orientée objet. Avec une hiérarchie `sealed` de records et un `switch` exhaustif, j'exprime un type algébrique : un ensemble fermé de cas, chacun avec ses données, et le compilateur vérifie que tous les cas sont traités.
      C'est particulièrement adapté quand les **opérations** évoluent plus souvent que les **types** (états d'une commande, résultats d'un calcul, messages d'un protocole) : ajouter une opération = écrire un switch, sans toucher aux classes. À l'inverse, quand les types évoluent souvent et que les opérations sont stables, le polymorphisme classique reste meilleur. C'est le vieux compromis du *expression problem*, et Java donne maintenant les deux outils.
  - key: scenario-erreurs-metier
    format: scenario
    question: Un service de virement peut échouer pour plusieurs raisons métier. Exceptions ou type résultat scellé ?
    answer: |-
      Pour des échecs **attendus** et que l'appelant doit traiter (solde insuffisant, compte bloqué, plafond dépassé), un
      type résultat scellé : `sealed interface ResultatVirement permits Effectue, SoldeInsuffisant, CompteBloque`, chaque
      cas avec ses données (le solde disponible, le motif du blocage). L'appelant fait un `switch` exhaustif, et le
      compilateur l'oblige à traiter chaque cas ; il voit tous les échecs possibles dans la signature. Je garde les
      exceptions pour les erreurs **techniques** ou les violations de contrat (base indisponible, argument `null`), que
      l'appelant ne sait pas traiter localement. Au bord de l'API REST, je traduis chaque cas en réponse Problem Details.
