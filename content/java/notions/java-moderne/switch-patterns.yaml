notion: switch-patterns
lesson: |-
  Depuis Java 21, les cas d'un `switch` peuvent être des **motifs de type**, avec des **gardes** `when` et un cas
  **`null`** :

  ```java
  static String decrire(Object o) {
      return switch (o) {
          case null -> "rien";
          case Integer i when i < 0 -> "entier négatif";
          case Integer i -> "entier " + i;
          case String s when s.isBlank() -> "chaîne vide";
          case String s -> "chaîne de " + s.length() + " caractères";
          case List<?> l -> "liste de " + l.size() + " éléments";
          default -> "autre : " + o.getClass().getSimpleName();
      };
  }
  ```

  - Les cas sont testés **dans l'ordre** : le premier qui correspond gagne. Un cas **dominé** (placé après un cas plus
    général qui le couvre, comme `case Integer i` avant `case Integer i when i < 0`) ne compile pas.
  - **`when`** ajoute une condition au motif ; la variable du motif y est utilisable.
  - **`null`** : sans `case null`, un `switch` sur une valeur `null` lève une `NullPointerException`. On peut écrire
    `case null, default -> ...`.
  - Le `switch` doit être **exhaustif** : sur `Object`, il faut un `default` ; sur un type **scellé**, couvrir tous les
    sous-types suffit.
  - Les motifs s'appliquent à tout type référence : interfaces, records, enums (on peut mélanger constantes qualifiées et
    motifs).

  C'est l'outil des traitements **par cas** sur des données : messages reçus, événements, nœuds d'un arbre, résultats
  d'une opération, en remplacement des chaînes de `if (x instanceof ...) else if`.

  **Piège classique** : placer le cas général avant le cas particulier (`case String s ->` puis
  `case String s when s.isEmpty() ->`). Le second est inatteignable : le compilateur le refuse.

  **En entretien** : « Des motifs de type testés dans l'ordre, des gardes `when`, `case null` explicite, et l'exhaustivité
  vérifiée : sans `default` sur un type scellé. »
cards:
  - key: sert-when-switch
    format: course
    question: "À quoi sert `when` dans un `switch` ?"
    choices:
      - {text: "C'est une garde : le cas ne s'applique que si la condition est vraie", correct: true}
      - {text: "C'est une boucle : le cas se répète tant que la condition reste vraie", correct: false}
      - {text: "Il remplace `default` : le cas s'applique quand aucun autre ne convient", correct: false}
      - {text: "Il retarde le cas, qui n'est essayé qu'après tous les autres", correct: false}
    answer: |-
      C'est une garde : le cas ne s'applique que si le motif correspond et que la condition est vraie, par exemple
      `case Integer i when i < 0`.
  - key: switch-patterns-gere-null
    format: course
    question: "Un `switch` à motifs gère-t-il `null` ?"
    choices:
      - {text: "Oui, avec un `case null` explicite ; sinon, il lève une `NullPointerException`", correct: true}
      - {text: "Oui : le `default` couvre aussi `null`, comme n'importe quelle autre valeur", correct: false}
      - {text: "Non : un `switch` à motifs lève toujours une exception sur une valeur `null`", correct: false}
      - {text: "Oui : `null` va dans le premier cas dont le motif est `Object o`", correct: false}
    answer: |-
      Oui avec un `case null` explicite (ou `case null, default`), sinon une `NullPointerException` est levée, même avec
      un `default`.
  - key: dominance
    format: course
    question: Qu'est-ce qu'un cas dominé dans un `switch` à motifs ?
    choices:
      - {text: "Un cas placé après un cas plus général qui couvre déjà ses valeurs : il ne compile pas", correct: true}
      - {text: "Un cas qui passe avant tous les autres, parce qu'il porte une garde `when`", correct: false}
      - {text: "Un cas choisi par défaut quand aucun motif ne correspond, comme un `default`", correct: false}
      - {text: "Un cas dont le motif est plus général que le type du `switch`, et qui gagne toujours", correct: false}
    answer: Un cas placé après un cas plus général qui couvre déjà toutes ses valeurs, par exemple `case CharSequence c` avant `case String s` ; il est inatteignable et ne compile pas.
  - key: ordre
    format: course
    question: Dans quel ordre les cas d'un `switch` à motifs sont-ils évalués ?
    choices:
      - {text: "Dans l'ordre d'écriture : le premier cas qui correspond, garde comprise, est choisi", correct: true}
      - {text: "Du plus particulier au plus général, quel que soit leur ordre d'écriture", correct: false}
      - {text: "Les cas gardés d'abord, puis les cas sans garde, chacun dans l'ordre d'écriture", correct: false}
      - {text: "Dans un ordre quelconque : la JVM choisit l'un des cas qui correspondent", correct: false}
    answer: "Dans l'ordre d'écriture : le premier cas dont le motif (et la garde) correspond est choisi ; on place donc les cas particuliers avant les cas généraux."
  - key: vf-null-npe
    format: true-false
    question: Un `switch` à motifs sans `case null` lève une `NullPointerException` si la valeur est `null`.
    truth: true
    answer: Le cas `default` ne couvre pas `null`.
  - key: vf-default-null
    format: true-false
    question: "On peut écrire `case null, default -> ...`."
    truth: true
    answer: Un seul cas pour `null` et tout le reste.
  - key: vf-ordre
    format: true-false
    question: "`case Integer i -> ...` placé avant `case Integer i when i > 0 -> ...` compile."
    truth: false
    answer: Le second cas est dominé, donc inatteignable.
  - key: vf-object-default
    format: true-false
    question: "Un `switch` à motifs sur un `Object` n'a pas besoin de `default`."
    truth: false
    answer: '`Object` n''est pas scellé : il faut un `default` (ou un `case Object o`).'
  - key: qcm-compile
    format: multiple-choice
    question: Lesquelles de ces suites de cas compilent pour un `switch (o)` sur un `Object` ?
    choices:
      - text: "`case String s when s.isEmpty() -> ...; case String s -> ...; default -> ...;`"
        correct: true
      - text: "`case null -> ...; case Integer i -> ...; default -> ...;`"
        correct: true
      - text: "`case String s -> ...; case String s when s.isEmpty() -> ...; default -> ...;`"
        correct: false
      - text: "`case Integer i -> ...; case String s -> ...;`"
        correct: false
    answer: La troisième a un cas dominé ; la dernière n'est pas exhaustive.
  - key: qcm-resultat
    format: multiple-choice
    question: "Que renvoie `switch (o) { case Integer i when i > 10 -> \"grand\"; case Integer i -> \"petit\"; default -> \"autre\"; }` pour `o = 5` ?"
    choices:
      - text: "\"petit\""
        correct: true
      - text: "\"grand\""
        correct: false
      - text: "\"autre\""
        correct: false
      - text: "Une exception"
        correct: false
    answer: La garde échoue, le cas suivant correspond.
  - key: qcm-remplacer
    format: multiple-choice
    question: Que remplace avantageusement un `switch` à motifs ?
    choices:
      - {text: "Une chaîne de `if (x instanceof A a) ... else if (x instanceof B b) ...`", correct: true}
      - {text: "Le polymorphisme dans tous les cas, devenu inutile avec les motifs", correct: false}
      - {text: "Les boucles `for` qui parcourent une liste d'objets de types variés", correct: false}
      - {text: "Les exceptions, chaque erreur devenant un cas du `switch`", correct: false}
    answer: Le polymorphisme reste préférable quand les types évoluent plus que les opérations.
  - key: qcm-enum
    format: multiple-choice
    question: "Comment traiter une constante d'enum et un autre type dans le même `switch` sur une `sealed interface Carte permits Couleur, Joker` (Couleur étant une enum) ?"
    choices:
      - text: "`case Couleur.COEUR -> ...; case Couleur c -> ...; case Joker j -> ...;`"
        correct: true
      - text: "`case COEUR -> ...; case Joker j -> ...;`, qui oublie les autres couleurs"
        correct: false
      - text: "Il faut deux `switch` séparés"
        correct: false
      - text: "`case \"COEUR\" -> ...`"
        correct: false
    answer: Depuis Java 21, constantes qualifiées et motifs de type se mélangent.
  - key: trous-when
    format: fill-in
    question: |-
      Complète la garde :
      ```java
      String s = switch (o) {
          case Integer i ___ i < 0 -> "négatif";
          case Integer i -> "positif ou nul";
          default -> "autre";
      };
      ```
    blanks: [[when]]
    answer: La garde ajoute une condition au motif.
  - key: trous-null
    format: fill-in
    question: |-
      Complète pour traiter `null` sans exception :
      ```java
      String s = switch (valeur) {
          case ___ -> "absent";
          case String t -> t;
          default -> valeur.toString();
      };
      ```
    blanks: [["null"]]
    answer: Sans `case null`, le `switch` lève une `NullPointerException`.
  - key: trous-motif
    format: fill-in
    question: |-
      Complète le motif de type :
      ```java
      double aire = switch (forme) {
          case Cercle ___ -> Math.PI * c.rayon() * c.rayon();
          case Carre k -> k.cote() * k.cote();
      };
      ```
    blanks: [[c]]
    answer: Le motif nomme la variable du cas.
  - key: trous-default
    format: fill-in
    question: |-
      Complète pour regrouper `null` et les autres cas :
      ```java
      String s = switch (o) {
          case String t -> t;
          case null, ___ -> "?";
      };
      ```
    blanks: [[default]]
    answer: '`case null, default` couvre tout le reste.'
  - key: code-motifs
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static String decrire(Object o) {
          return switch (o) {
              case null -> "rien";
              case Integer i when i < 0 -> "négatif";
              case Integer i -> "entier";
              case String s -> "chaîne " + s.length();
              default -> "autre";
          };
      }
      System.out.println(decrire(-3) + ", " + decrire(7) + ", " + decrire("abc") + ", " + decrire(null) + ", " + decrire(2.5));
      ```
    choices:
      - {text: "`négatif, entier, chaîne 3, rien, autre`", correct: true}
      - {text: "`entier, entier, chaîne 3, rien, autre`", correct: false}
      - {text: "`négatif, entier, chaîne 3, autre, autre`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: "`négatif, entier, chaîne 3, rien, autre` : les cas sont essayés dans l'ordre, et `case null` traite `null`."
    check:
      output: "négatif, entier, chaîne 3, rien, autre"
  - key: code-null-npe
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Object o = null;
      String s = switch (o) {
          case String t -> "chaîne";
          default -> "autre";
      };
      ```
    choices:
      - {text: "Une `NullPointerException`", correct: true}
      - {text: "Une `MatchException`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "Une `NullPointerException` : `default` ne couvre pas `null`."
    check:
      throws: NullPointerException
  - key: code-domine
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Object o = "x";
      String s = switch (o) {
          case CharSequence c -> "séquence";
          case String t -> "chaîne";
          default -> "autre";
      };
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Rien", correct: false}
      - {text: "Une `MatchException`", correct: false}
    answer: "Ne compile pas : `case String t` est dominé par `case CharSequence c`."
    check:
      compiles: false
  - key: code-garde
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      for (Object o : List.<Object>of("", "abc", 10)) {
          System.out.print(switch (o) {
              case String s when s.isEmpty() -> "[vide]";
              case String s -> s.toUpperCase();
              case Integer i -> "#" + i;
              default -> "?";
          } + " ");
      }
      ```
    choices:
      - {text: "`[vide] ABC #10`", correct: true}
      - {text: "`ABC #10`", correct: false}
      - {text: "`[vide] [vide] #10`", correct: false}
      - {text: "`[vide] ABC ?`", correct: false}
    answer: "`[vide] ABC #10` : la garde attrape la chaîne vide, le cas suivant les autres chaînes."
    check:
      output: "[vide] ABC #10"
  - key: bug-chaine-if
    format: bug-fix
    question: |-
      Quelle modernisation de ce code est la meilleure ?
      ```java
      String format(Object v) {
          if (v == null) return "-";
          if (v instanceof LocalDate d) return d.format(DATE);
          if (v instanceof Number n) return FORMAT_NOMBRE.format(n);
          return v.toString();
      }
      ```
    choices:
      - {text: "Un `switch` à motifs : `case null`, `case LocalDate d`, `case Number n`, `default`", correct: true}
      - {text: "Un `switch` à motifs sans `case null`, le `default` couvrant aussi `null`", correct: false}
      - {text: "Un `switch` sur `v.getClass().getSimpleName()`, un cas par nom de classe", correct: false}
      - {text: "Un `Optional.ofNullable(v)` qui enchaîne les trois conversions avec `map`", correct: false}
    answer: |-
      ```java
      String format(Object v) {
          return switch (v) {
              case null -> "-";
              case LocalDate d -> d.format(DATE);
              case Number n -> FORMAT_NOMBRE.format(n);
              default -> v.toString();
          };
      }
      ```
      Un seul `switch` lisible, avec `null` traité explicitement.
  - key: bug-domine
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      return switch (o) {
          case Integer i -> "entier";
          case Integer i when i == 0 -> "zéro";
          default -> "autre";
      };
      ```
    choices:
      - {text: "Placer le cas gardé `when i == 0` avant le cas général `Integer i`", correct: true}
      - {text: "Retirer le `default`, qui entre en conflit avec la garde", correct: false}
      - {text: "Ajouter un `break` après le cas général `Integer i`", correct: false}
      - {text: "Remplacer `when` par `if` dans le second cas", correct: false}
    answer: |-
      ```java
      return switch (o) {
          case Integer i when i == 0 -> "zéro";
          case Integer i -> "entier";
          default -> "autre";
      };
      ```
      Les cas sont évalués dans l'ordre : le cas particulier (avec garde) doit précéder le cas général.
  - key: bug-npe
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` quand le champ facultatif est absent. Quelle correction est la bonne ?
      ```java
      String libelle = switch (champ) {
          case String s -> s;
          case Integer i -> String.valueOf(i);
          default -> "inconnu";
      };
      ```
    choices:
      - {text: "Ajouter un `case null` en tête du `switch`", correct: true}
      - {text: "Déplacer le `default` en tête du `switch`", correct: false}
      - {text: "Ajouter un `case Object o` avant le `default`", correct: false}
      - {text: "Remplacer `default` par `case Object o`", correct: false}
    answer: |-
      ```java
      String libelle = switch (champ) {
          case null -> "";
          case String s -> s;
          case Integer i -> String.valueOf(i);
          default -> "inconnu";
      };
      ```
      Un `switch` sur une valeur `null` lève une exception, même avec un `default`. `case null` traite l'absence
      explicitement.
  - key: bug-condition-dans-cas
    format: bug-fix
    question: |-
      Comment simplifier ce code ?
      ```java
      return switch (o) {
          case Integer i -> {
              if (i > 100) yield "grand";
              else yield "petit";
          }
          default -> "autre";
      };
      ```
    choices:
      - {text: "Un cas gardé `case Integer i when i > 100`, puis un cas `case Integer i`", correct: true}
      - {text: "Un seul cas `case Integer i > 100`, sans garde ni bloc", correct: false}
      - {text: "Un ternaire dans le `default`, à la place du cas `Integer i`", correct: false}
      - {text: "Deux cas `case Integer i`, le premier avec `if` au lieu de `when`", correct: false}
    answer: |-
      ```java
      return switch (o) {
          case Integer i when i > 100 -> "grand";
          case Integer i -> "petit";
          default -> "autre";
      };
      ```
      Une garde `when` exprime la condition dans le cas lui-même, sans bloc ni `yield`.
