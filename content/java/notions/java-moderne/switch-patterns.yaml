notion: switch-patterns
lesson: |-
  Depuis Java 21, les cas d'un `switch` peuvent être des **motifs de type**, avec des **gardes** `when` et un cas
  **`null`** :

  ```java
  static String decrire(Object o) {
      return switch (o) {
          case null -> "rien";
          case Integer i when i < 0 -> "entier négatif";
          case Integer i -> "entier " + i;
          case String s when s.isBlank() -> "chaîne vide";
          case String s -> "chaîne de " + s.length() + " caractères";
          case List<?> l -> "liste de " + l.size() + " éléments";
          default -> "autre : " + o.getClass().getSimpleName();
      };
  }
  ```

  - Les cas sont testés **dans l'ordre** : le premier qui correspond gagne. Un cas **dominé** (placé après un cas plus
    général qui le couvre, comme `case Integer i` avant `case Integer i when i < 0`) ne compile pas.
  - **`when`** ajoute une condition au motif ; la variable du motif y est utilisable.
  - **`null`** : sans `case null`, un `switch` sur une valeur `null` lève une `NullPointerException`. On peut écrire
    `case null, default -> ...`.
  - Le `switch` doit être **exhaustif** : sur `Object`, il faut un `default` ; sur un type **scellé**, couvrir tous les
    sous-types suffit.
  - Les motifs s'appliquent à tout type référence : interfaces, records, enums (on peut mélanger constantes qualifiées et
    motifs).

  C'est l'outil des traitements **par cas** sur des données : messages reçus, événements, nœuds d'un arbre, résultats
  d'une opération, en remplacement des chaînes de `if (x instanceof ...) else if`.

  **Piège classique** : placer le cas général avant le cas particulier (`case String s ->` puis
  `case String s when s.isEmpty() ->`). Le second est inatteignable : le compilateur le refuse.

  **En entretien** : « Des motifs de type testés dans l'ordre, des gardes `when`, `case null` explicite, et l'exhaustivité
  vérifiée : sans `default` sur un type scellé. »
cards:
  - key: sert-when-switch
    format: course
    question: À quoi sert `when` dans un switch ?
    answer: 'C''est une garde : le cas ne s''applique que si la condition est vraie.'
  - key: switch-patterns-gere-null
    format: course
    question: Un switch à patterns gère-t-il null ?
    answer: Oui avec un `case null` explicite, sinon une NPE est levée.
  - key: dominance
    format: course
    question: Qu'est-ce qu'un cas dominé dans un `switch` à motifs ?
    answer: Un cas placé après un cas plus général qui couvre déjà toutes ses valeurs, par exemple `case CharSequence c` avant `case String s` ; il est inatteignable et ne compile pas.
  - key: ordre
    format: course
    question: Dans quel ordre les cas d'un `switch` à motifs sont-ils évalués ?
    answer: "Dans l'ordre d'écriture : le premier cas dont le motif (et la garde) correspond est choisi ; on place donc les cas particuliers avant les cas généraux."
  - key: vf-null-npe
    format: true-false
    question: Un `switch` à motifs sans `case null` lève une `NullPointerException` si la valeur est `null`.
    truth: true
    answer: Le cas `default` ne couvre pas `null`.
  - key: vf-default-null
    format: true-false
    question: "On peut écrire `case null, default -> ...`."
    truth: true
    answer: Un seul cas pour `null` et tout le reste.
  - key: vf-ordre
    format: true-false
    question: "`case Integer i -> ...` placé avant `case Integer i when i > 0 -> ...` compile."
    truth: false
    answer: Le second cas est dominé, donc inatteignable.
  - key: vf-object-default
    format: true-false
    question: "Un `switch` à motifs sur un `Object` n'a pas besoin de `default`."
    truth: false
    answer: '`Object` n''est pas scellé : il faut un `default` (ou un `case Object o`).'
  - key: qcm-compile
    format: multiple-choice
    question: Lesquelles de ces suites de cas compilent pour un `switch (o)` sur un `Object` ?
    choices:
      - text: "`case String s when s.isEmpty() -> ...; case String s -> ...; default -> ...;`"
        correct: true
      - text: "`case null -> ...; case Integer i -> ...; default -> ...;`"
        correct: true
      - text: "`case String s -> ...; case String s when s.isEmpty() -> ...; default -> ...;`"
        correct: false
      - text: "`case Integer i -> ...; case String s -> ...;`"
        correct: false
    answer: La troisième a un cas dominé ; la dernière n'est pas exhaustive.
  - key: qcm-resultat
    format: multiple-choice
    question: "Que renvoie `switch (o) { case Integer i when i > 10 -> \"grand\"; case Integer i -> \"petit\"; default -> \"autre\"; }` pour `o = 5` ?"
    choices:
      - text: "\"petit\""
        correct: true
      - text: "\"grand\""
        correct: false
      - text: "\"autre\""
        correct: false
      - text: "Une exception"
        correct: false
    answer: La garde échoue, le cas suivant correspond.
  - key: qcm-remplacer
    format: multiple-choice
    question: Que remplace avantageusement un `switch` à motifs ?
    choices:
      - text: "Une chaîne de `if (x instanceof A a) ... else if (x instanceof B b) ...`"
        correct: true
      - text: "Le polymorphisme dans tous les cas"
        correct: false
      - text: "Les boucles `for`"
        correct: false
      - text: "Les exceptions"
        correct: false
    answer: Le polymorphisme reste préférable quand les types évoluent plus que les opérations.
  - key: qcm-enum
    format: multiple-choice
    question: "Comment traiter une constante d'enum et un autre type dans le même `switch` sur une `sealed interface Carte permits Couleur, Joker` (Couleur étant une enum) ?"
    choices:
      - text: "`case Couleur.COEUR -> ...; case Couleur c -> ...; case Joker j -> ...;`"
        correct: true
      - text: "`case COEUR -> ...; case Joker j -> ...;`, qui oublie les autres couleurs"
        correct: false
      - text: "Il faut deux `switch` séparés"
        correct: false
      - text: "`case \"COEUR\" -> ...`"
        correct: false
    answer: Depuis Java 21, constantes qualifiées et motifs de type se mélangent.
  - key: trous-when
    format: fill-in
    question: |-
      Complétez la garde :
      ```java
      String s = switch (o) {
          case Integer i ___ i < 0 -> "négatif";
          case Integer i -> "positif ou nul";
          default -> "autre";
      };
      ```
    blanks: [[when]]
    answer: La garde ajoute une condition au motif.
  - key: trous-null
    format: fill-in
    question: |-
      Complétez pour traiter `null` sans exception :
      ```java
      String s = switch (valeur) {
          case ___ -> "absent";
          case String t -> t;
          default -> valeur.toString();
      };
      ```
    blanks: [["null"]]
    answer: Sans `case null`, le `switch` lève une `NullPointerException`.
  - key: trous-motif
    format: fill-in
    question: |-
      Complétez le motif de type :
      ```java
      double aire = switch (forme) {
          case Cercle ___ -> Math.PI * c.rayon() * c.rayon();
          case Carre k -> k.cote() * k.cote();
      };
      ```
    blanks: [[c]]
    answer: Le motif nomme la variable du cas.
  - key: trous-default
    format: fill-in
    question: |-
      Complétez pour regrouper `null` et les autres cas :
      ```java
      String s = switch (o) {
          case String t -> t;
          case null, ___ -> "?";
      };
      ```
    blanks: [[default]]
    answer: '`case null, default` couvre tout le reste.'
  - key: code-motifs
    format: code-output
    question: |-
      ```java
      static String decrire(Object o) {
          return switch (o) {
              case null -> "rien";
              case Integer i when i < 0 -> "négatif";
              case Integer i -> "entier";
              case String s -> "chaîne " + s.length();
              default -> "autre";
          };
      }
      System.out.println(decrire(-3) + ", " + decrire(7) + ", " + decrire("abc") + ", " + decrire(null) + ", " + decrire(2.5));
      ```
    answer: '`négatif, entier, chaîne 3, rien, autre`.'
    check:
      output: "négatif, entier, chaîne 3, rien, autre"
  - key: code-null-npe
    format: code-output
    question: |-
      ```java
      Object o = null;
      String s = switch (o) {
          case String t -> "chaîne";
          default -> "autre";
      };
      ```
    answer: "Une `NullPointerException` : `default` ne couvre pas `null`."
    check:
      throws: NullPointerException
  - key: code-domine
    format: code-output
    question: |-
      ```java
      Object o = "x";
      String s = switch (o) {
          case CharSequence c -> "séquence";
          case String t -> "chaîne";
          default -> "autre";
      };
      ```
    answer: "Ne compile pas : `case String t` est dominé par `case CharSequence c`."
    check:
      compiles: false
  - key: code-garde
    format: code-output
    question: |-
      ```java
      for (Object o : List.<Object>of("", "abc", 10)) {
          System.out.print(switch (o) {
              case String s when s.isEmpty() -> "[vide]";
              case String s -> s.toUpperCase();
              case Integer i -> "#" + i;
              default -> "?";
          } + " ");
      }
      ```
    answer: '`[vide] ABC #10`.'
    check:
      output: "[vide] ABC #10"
  - key: bug-chaine-if
    format: bug-fix
    question: |-
      Modernisez :
      ```java
      String format(Object v) {
          if (v == null) return "-";
          if (v instanceof LocalDate d) return d.format(DATE);
          if (v instanceof Number n) return FORMAT_NOMBRE.format(n);
          return v.toString();
      }
      ```
    answer: |-
      ```java
      String format(Object v) {
          return switch (v) {
              case null -> "-";
              case LocalDate d -> d.format(DATE);
              case Number n -> FORMAT_NOMBRE.format(n);
              default -> v.toString();
          };
      }
      ```
      Un seul `switch` lisible, avec `null` traité explicitement.
  - key: bug-domine
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      return switch (o) {
          case Integer i -> "entier";
          case Integer i when i == 0 -> "zéro";
          default -> "autre";
      };
      ```
    answer: |-
      ```java
      return switch (o) {
          case Integer i when i == 0 -> "zéro";
          case Integer i -> "entier";
          default -> "autre";
      };
      ```
      Les cas sont évalués dans l'ordre : le cas particulier (avec garde) doit précéder le cas général.
  - key: bug-npe
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` quand le champ facultatif est absent :
      ```java
      String libelle = switch (champ) {
          case String s -> s;
          case Integer i -> String.valueOf(i);
          default -> "inconnu";
      };
      ```
    answer: |-
      ```java
      String libelle = switch (champ) {
          case null -> "";
          case String s -> s;
          case Integer i -> String.valueOf(i);
          default -> "inconnu";
      };
      ```
      Un `switch` sur une valeur `null` lève une exception, même avec un `default`. `case null` traite l'absence
      explicitement.
  - key: bug-condition-dans-cas
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      return switch (o) {
          case Integer i -> {
              if (i > 100) yield "grand";
              else yield "petit";
          }
          default -> "autre";
      };
      ```
    answer: |-
      ```java
      return switch (o) {
          case Integer i when i > 100 -> "grand";
          case Integer i -> "petit";
          default -> "autre";
      };
      ```
      Une garde `when` exprime la condition dans le cas lui-même, sans bloc ni `yield`.
