notion: classes-scellees
lesson: |-
  Une classe ou interface **scellée** (`sealed`, Java 17) dit **exactement** quels types peuvent l'étendre ou
  l'implémenter. La hiérarchie devient fermée et connue du compilateur.

  ```java
  public sealed interface Paiement permits Carte, Virement, Especes {}

  public record Carte(String numero) implements Paiement {}
  public record Virement(String iban) implements Paiement {}
  public final class Especes implements Paiement {}
  ```

  Chaque sous-type autorisé doit dire comment il continue la hiérarchie :
  - **`final`** : plus aucun sous-type (les records et les enums le sont implicitement) ;
  - **`sealed`** : à son tour scellé, avec ses propres `permits` ;
  - **`non-sealed`** : rouvert, n'importe qui peut l'étendre.

  Règles :
  - les sous-types autorisés doivent être dans le **même module** (ou le même paquet sans module) ;
  - `permits` peut être omis si les sous-types sont dans le **même fichier** ;
  - un type non listé qui tente d'étendre la hiérarchie ne compile pas.

  Intérêts :
  - **documenter** et **imposer** un ensemble fermé de cas (les moyens de paiement, les états d'une commande, les nœuds
    d'une expression) ;
  - permettre des `switch` **exhaustifs** sans `default` : le compilateur connaît tous les cas ;
  - garder le contrôle d'une API : les utilisateurs d'une bibliothèque ne peuvent pas ajouter de sous-type.

  **Piège classique** : oublier le modificateur d'un sous-type (`class Especes implements Paiement`). Le compilateur
  exige `final`, `sealed` ou `non-sealed`.

  **En entretien** : « `sealed ... permits` fixe la liste des sous-types ; chacun est `final`, `sealed` ou `non-sealed`.
  C'est ce qui rend un `switch` exhaustif possible. »
cards:
  - key: sealed-class
    format: course
    question: "Qu'est-ce qu'une classe scellée (`sealed`) ?"
    choices:
      - {text: "Une classe qui restreint ses sous-types à ceux qu'elle autorise par `permits`", correct: true}
      - {text: "Une classe qu'aucune autre classe ne peut étendre, exactement comme `final`", correct: false}
      - {text: "Une classe dont les champs ne peuvent plus changer après la construction", correct: false}
      - {text: "Une classe que seules les classes de son package ont le droit d'étendre", correct: false}
    answer: |-
      Une classe (ou une interface) qui restreint ses sous-types directs à ceux qu'elle autorise, par `permits`
      (Java 17). Contrairement à une classe `final`, elle a des sous-types, mais une liste fermée.
  - key: modificateurs
    format: course
    question: Quels modificateurs un sous-type autorisé d'un type scellé doit-il porter ?
    choices:
      - {text: "`final`, `sealed` ou `non-sealed`", correct: true}
      - {text: "`final` uniquement", correct: false}
      - {text: "`abstract` ou `final`", correct: false}
      - {text: "Aucun : il hérite du `sealed` de son parent", correct: false}
    answer: '`final` (plus de sous-type), `sealed` (scellé à son tour) ou `non-sealed` (rouvert) ; les records et les enums sont implicitement `final`.'
  - key: permits-omis
    format: course
    question: Quand peut-on omettre la clause `permits` ?
    choices:
      - {text: "Quand tous les sous-types sont déclarés dans le même fichier source", correct: true}
      - {text: "Quand tous les sous-types sont dans le même package que le type scellé", correct: false}
      - {text: "Quand le type scellé est une interface plutôt qu'une classe abstraite", correct: false}
      - {text: "Jamais : la clause `permits` est obligatoire avec `sealed`", correct: false}
    answer: |-
      Quand tous les sous-types sont déclarés dans le même fichier source ; le compilateur les déduit. Le même package ne
      suffit pas.
  - key: interet
    format: course
    question: Quel est l'intérêt principal d'une hiérarchie scellée ?
    choices:
      - {text: "Fermer l'ensemble des cas, pour des `switch` exhaustifs sans `default`", correct: true}
      - {text: "Rendre les objets immuables, donc sûrs à partager entre threads", correct: false}
      - {text: "Accélérer les appels de méthodes, que la JVM met alors en ligne", correct: false}
      - {text: "Cacher les sous-types aux autres packages, comme une visibilité", correct: false}
    answer: "Fermer l'ensemble des cas : le compilateur connaît tous les sous-types, ce qui permet des `switch` exhaustifs sans `default` et empêche d'ajouter des cas imprévus."
  - key: vf-record-final
    format: true-false
    question: Un record qui implémente une interface scellée n'a pas besoin du mot-clé `final`.
    truth: true
    answer: Il est implicitement `final`.
  - key: vf-non-sealed
    format: true-false
    question: Un sous-type `non-sealed` peut être étendu par n'importe quelle classe.
    truth: true
    answer: Il rouvre la hiérarchie à partir de lui.
  - key: vf-modules
    format: true-false
    question: Les sous-types autorisés peuvent être dans n'importe quel module.
    truth: false
    answer: Ils doivent être dans le même module (ou le même paquet sans module nommé).
  - key: vf-interface
    format: true-false
    question: Une interface peut être scellée.
    truth: true
    answer: Par exemple `sealed interface Forme permits Cercle, Carre`.
  - key: qcm-modificateurs
    format: multiple-choice
    question: "Lequel de ces modificateurs convient à un sous-type autorisé d'un type scellé ?"
    choices:
      - {text: "`non-sealed`", correct: true}
      - {text: "`abstract` seul", correct: false}
      - {text: "`public` seul", correct: false}
      - {text: "`open`", correct: false}
    answer: |-
      `non-sealed` rouvre la hiérarchie ; `final` et `sealed` conviennent aussi. `abstract` doit être accompagné de
      `sealed` ou `non-sealed`, et `open` n'existe pas en Java (c'est du Kotlin).
  - key: qcm-usage
    format: multiple-choice
    question: "Pour lequel de ces cas une hiérarchie scellée est-elle adaptée ?"
    choices:
      - {text: "Les résultats possibles d'une opération (succès, erreur de validation, erreur technique)", correct: true}
      - {text: "Des plugins ajoutés par les clients de la bibliothèque", correct: false}
      - {text: "Des implémentations de stockage choisies par configuration et extensibles", correct: false}
      - {text: "Des stratégies de calcul que chaque équipe peut fournir à sa guise", correct: false}
    answer: |-
      Un ensemble fermé de cas, connu de l'auteur (les nœuds d'un arbre d'expressions aussi). Une hiérarchie ouverte par
      nature, faite pour être étendue par d'autres, ne doit pas être scellée.
  - key: qcm-erreur
    format: multiple-choice
    question: "Que se passe-t-il si `class Cheque implements Paiement` est ajouté alors que `Paiement` est `sealed permits Carte, Virement` ?"
    choices:
      - text: "Une erreur de compilation"
        correct: true
      - text: "Une exception au chargement de la classe"
        correct: false
      - text: "Rien, Cheque est accepté"
        correct: false
      - text: "Un avertissement seulement"
        correct: false
    answer: Seuls les types listés peuvent étendre la hiérarchie.
  - key: qcm-version
    format: multiple-choice
    question: Depuis quelle version les classes scellées sont-elles définitives ?
    choices:
      - text: "Java 17"
        correct: true
      - text: "Java 8"
        correct: false
      - text: "Java 11"
        correct: false
      - text: "Java 21"
        correct: false
    answer: Après deux préversions (Java 15 et 16).
  - key: trous-sealed
    format: fill-in
    question: |-
      Complète pour fermer la hiérarchie :
      ```java
      public ___ interface Forme ___ Cercle, Carre {}
      ```
    blanks: [[sealed], [permits]]
    answer: '`sealed` et la liste des sous-types autorisés.'
  - key: trous-final
    format: fill-in
    question: |-
      Complète pour qu'aucune classe n'étende `Especes` :
      ```java
      public ___ class Especes implements Paiement {}
      ```
    blanks: [[final]]
    answer: Un sous-type autorisé doit être `final`, `sealed` ou `non-sealed`.
  - key: trous-non-sealed
    format: fill-in
    question: |-
      Complète pour laisser les clients étendre `Personnalise` :
      ```java
      public ___ class Personnalise implements Theme {}
      ```
    blanks: [[non-sealed]]
    answer: '`non-sealed` rouvre la hiérarchie.'
  - key: trous-record
    format: fill-in
    question: |-
      Complète le sous-type autorisé, porteur d'un IBAN :
      ```java
      public ___ Virement(String iban) implements Paiement {}
      ```
    blanks: [[record]]
    answer: Un record est implicitement `final`.
  - key: code-hierarchie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Demo {
          sealed interface Forme permits Cercle, Carre {}
          record Cercle(double r) implements Forme {}
          record Carre(double c) implements Forme {}
      }
      System.out.println(Demo.Forme.class.isSealed() + " " + Demo.Forme.class.getPermittedSubclasses().length);
      ```
    choices:
      - {text: "`true 2`", correct: true}
      - {text: "`false 2`", correct: false}
      - {text: "`true 0`", correct: false}
      - {text: "`true 3`", correct: false}
    answer: '`true 2`.'
    check:
      output: "true 2"
  - key: code-sans-modificateur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Demo {
          sealed interface Paiement permits Especes {}
          class Especes implements Paiement {}
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Rien", correct: false}
      - {text: "Une `IncompatibleClassChangeError`", correct: false}
    answer: "Ne compile pas : `Especes` doit être `final`, `sealed` ou `non-sealed`."
    check:
      compiles: false
  - key: code-non-liste
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Demo {
          sealed interface Statut permits Ouvert {}
          record Ouvert() implements Statut {}
          record Ferme() implements Statut {}
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Rien", correct: false}
      - {text: "Une `IncompatibleClassChangeError`", correct: false}
    answer: "Ne compile pas : `Ferme` n'est pas dans la liste `permits`."
    check:
      compiles: false
  - key: code-non-sealed
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Demo {
          sealed interface Theme permits Clair, Personnalise {}
          record Clair() implements Theme {}
          non-sealed static class Personnalise implements Theme {}
          static class Rose extends Personnalise {}
      }
      System.out.println(new Demo.Rose() instanceof Demo.Theme);
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: '`true` : `Personnalise` rouvre la hiérarchie.'
    check:
      output: "true"
  - key: bug-modificateur
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      public sealed interface Notification permits Email, Sms {}
      public record Email(String adresse) implements Notification {}
      public class Sms implements Notification {}
      ```
    choices:
      - {text: "Déclarer `Sms` `final`, ou en faire un record", correct: true}
      - {text: "Retirer `public` devant la classe `Sms`", correct: false}
      - {text: "Déclarer `Sms` `abstract`, pour la laisser ouverte", correct: false}
      - {text: "Faire étendre `Email` à la classe `Sms`", correct: false}
    answer: |-
      ```java
      public final class Sms implements Notification {}
      // ou : public record Sms(String numero) implements Notification {}
      ```
      Un sous-type autorisé doit dire comment la hiérarchie continue : `final`, `sealed` ou `non-sealed`.
  - key: bug-enum-statuts
    format: bug-fix
    question: |-
      Les champs de `Commande` n'ont de sens que pour certains statuts, et valent souvent `null`. Quelle refonte est la bonne ?
      ```java
      enum Statut { EN_ATTENTE, EXPEDIEE, ANNULEE }
      class Commande { Statut statut; String numeroSuivi; String motifAnnulation; }   // souvent null
      ```
    choices:
      - {text: "Une interface scellée de statuts, chaque record portant ses propres données", correct: true}
      - {text: "Ajouter les champs `numeroSuivi` et `motif` à chaque constante de l'enum", correct: false}
      - {text: "Remplacer les champs `null` par des chaînes vides, plus sûres à manipuler", correct: false}
      - {text: "Envelopper `numeroSuivi` et `motifAnnulation` dans des `Optional`", correct: false}
    answer: |-
      ```java
      sealed interface Statut permits EnAttente, Expediee, Annulee {}
      record EnAttente() implements Statut {}
      record Expediee(String numeroSuivi) implements Statut {}
      record Annulee(String motif) implements Statut {}
      ```
      Chaque statut porte exactement ses données : plus de champs `null` selon le cas, et un `switch` exhaustif sur le
      statut.
  - key: bug-default-cache
    format: bug-fix
    question: |-
      Un nouveau moyen de paiement a été ajouté, et ce code le traite silencieusement comme une carte. Quelle correction est la bonne ?
      ```java
      interface Paiement {}
      String libelle(Paiement p) {
          if (p instanceof Virement) return "virement";
          return "carte";
      }
      ```
    choices:
      - {text: "Sceller `Paiement` et passer à un `switch` exhaustif, sans `default`", correct: true}
      - {text: "Ajouter un test `p instanceof Prelevement` avant le `return` final", correct: false}
      - {text: "Remplacer le `return \"carte\"` final par une exception levée", correct: false}
      - {text: "Ajouter à l'interface une méthode `default` qui renvoie `\"carte\"`", correct: false}
    answer: |-
      ```java
      sealed interface Paiement permits Carte, Virement, Prelevement {}

      String libelle(Paiement p) {
          return switch (p) {
              case Carte c -> "carte";
              case Virement v -> "virement";
              case Prelevement pr -> "prélèvement";
          };
      }
      ```
      Avec une interface scellée et un `switch` exhaustif sans `default`, ajouter un cas fait échouer la compilation
      partout où il n'est pas traité.
  - key: bug-hierarchie-ouverte
    format: bug-fix
    question: |-
      Une bibliothèque de stockage a scellé son interface, et les clients ne peuvent plus fournir leur propre implémentation. Quelle correction est la bonne ?
      ```java
      public sealed interface Stockage permits Disque, S3 {}
      ```
    choices:
      - {text: "Ne pas sceller `Stockage` : une interface faite pour être étendue reste ouverte", correct: true}
      - {text: "Ajouter chaque implémentation cliente à la liste `permits` de la bibliothèque", correct: false}
      - {text: "Demander aux clients d'étendre `Disque` ou `S3`, déjà autorisés", correct: false}
      - {text: "Déclarer `Stockage` `non-sealed`, en gardant `permits Disque, S3`", correct: false}
    answer: |-
      ```java
      public interface Stockage {}
      ```
      Une hiérarchie faite pour être étendue par d'autres (des plugins, des implémentations clientes) ne doit pas être
      scellée. Le scellement convient à un ensemble fermé de cas, connu de l'auteur.
