notion: classes-scellees
lesson: |-
  Une classe ou interface **scellée** (`sealed`, Java 17) dit **exactement** quels types peuvent l'étendre ou
  l'implémenter. La hiérarchie devient fermée et connue du compilateur.

  ```java
  public sealed interface Paiement permits Carte, Virement, Especes {}

  public record Carte(String numero) implements Paiement {}
  public record Virement(String iban) implements Paiement {}
  public final class Especes implements Paiement {}
  ```

  Chaque sous-type autorisé doit dire comment il continue la hiérarchie :
  - **`final`** : plus aucun sous-type (les records et les enums le sont implicitement) ;
  - **`sealed`** : à son tour scellé, avec ses propres `permits` ;
  - **`non-sealed`** : rouvert, n'importe qui peut l'étendre.

  Règles :
  - les sous-types autorisés doivent être dans le **même module** (ou le même paquet sans module) ;
  - `permits` peut être omis si les sous-types sont dans le **même fichier** ;
  - un type non listé qui tente d'étendre la hiérarchie ne compile pas.

  Intérêts :
  - **documenter** et **imposer** un ensemble fermé de cas (les moyens de paiement, les états d'une commande, les nœuds
    d'une expression) ;
  - permettre des `switch` **exhaustifs** sans `default` : le compilateur connaît tous les cas ;
  - garder le contrôle d'une API : les utilisateurs d'une bibliothèque ne peuvent pas ajouter de sous-type.

  **Piège classique** : oublier le modificateur d'un sous-type (`class Especes implements Paiement`). Le compilateur
  exige `final`, `sealed` ou `non-sealed`.

  **En entretien** : « `sealed ... permits` fixe la liste des sous-types ; chacun est `final`, `sealed` ou `non-sealed`.
  C'est ce qui rend un `switch` exhaustif possible. »
cards:
  - key: sealed-class
    format: course
    question: C'est quoi une sealed class ?
    answer: Une classe restreignant ses sous-types via `permits`.
  - key: modificateurs
    format: course
    question: Quels modificateurs un sous-type autorisé d'un type scellé doit-il porter ?
    answer: '`final` (plus de sous-type), `sealed` (scellé à son tour) ou `non-sealed` (rouvert) ; les records et les enums sont implicitement `final`.'
  - key: permits-omis
    format: course
    question: Quand peut-on omettre la clause `permits` ?
    answer: Quand tous les sous-types sont déclarés dans le même fichier source ; le compilateur les déduit.
  - key: interet
    format: course
    question: Quel est l'intérêt principal d'une hiérarchie scellée ?
    answer: "Fermer l'ensemble des cas : le compilateur connaît tous les sous-types, ce qui permet des `switch` exhaustifs sans `default` et empêche d'ajouter des cas imprévus."
  - key: vf-record-final
    format: true-false
    question: Un record qui implémente une interface scellée n'a pas besoin du mot-clé `final`.
    truth: true
    answer: Il est implicitement `final`.
  - key: vf-non-sealed
    format: true-false
    question: Un sous-type `non-sealed` peut être étendu par n'importe quelle classe.
    truth: true
    answer: Il rouvre la hiérarchie à partir de lui.
  - key: vf-modules
    format: true-false
    question: Les sous-types autorisés peuvent être dans n'importe quel module.
    truth: false
    answer: Ils doivent être dans le même module (ou le même paquet sans module nommé).
  - key: vf-interface
    format: true-false
    question: Une interface peut être scellée.
    truth: true
    answer: Par exemple `sealed interface Forme permits Cercle, Carre`.
  - key: qcm-modificateurs
    format: multiple-choice
    question: Quels modificateurs conviennent à un sous-type autorisé ?
    choices:
      - text: "`final`"
        correct: true
      - text: "`non-sealed`"
        correct: true
      - text: "`abstract` seul"
        correct: false
      - text: "`open`"
        correct: false
    answer: '`sealed` convient aussi ; `abstract` doit être accompagné de `sealed` ou `non-sealed`.'
  - key: qcm-usage
    format: multiple-choice
    question: Pour quels cas une hiérarchie scellée est-elle adaptée ?
    choices:
      - text: "Les résultats possibles d'une opération (succès, erreur de validation, erreur technique)"
        correct: true
      - text: "Les nœuds d'un arbre d'expressions (nombre, addition, multiplication)"
        correct: true
      - text: "Des plugins ajoutés par des clients de la bibliothèque"
        correct: false
      - text: "Des implémentations de stockage choisies par configuration et extensibles"
        correct: false
    answer: Une hiérarchie ouverte par nature ne doit pas être scellée.
  - key: qcm-erreur
    format: multiple-choice
    question: "Que se passe-t-il si `class Cheque implements Paiement` est ajouté alors que `Paiement` est `sealed permits Carte, Virement` ?"
    choices:
      - text: "Une erreur de compilation"
        correct: true
      - text: "Une exception au chargement de la classe"
        correct: false
      - text: "Rien, Cheque est accepté"
        correct: false
      - text: "Un avertissement seulement"
        correct: false
    answer: Seuls les types listés peuvent étendre la hiérarchie.
  - key: qcm-version
    format: multiple-choice
    question: Depuis quelle version les classes scellées sont-elles définitives ?
    choices:
      - text: "Java 17"
        correct: true
      - text: "Java 8"
        correct: false
      - text: "Java 11"
        correct: false
      - text: "Java 21"
        correct: false
    answer: Après deux préversions (Java 15 et 16).
  - key: trous-sealed
    format: fill-in
    question: |-
      Complétez pour fermer la hiérarchie :
      ```java
      public ___ interface Forme ___ Cercle, Carre {}
      ```
    blanks: [[sealed], [permits]]
    answer: '`sealed` et la liste des sous-types autorisés.'
  - key: trous-final
    format: fill-in
    question: |-
      Complétez pour qu'aucune classe n'étende `Especes` :
      ```java
      public ___ class Especes implements Paiement {}
      ```
    blanks: [[final]]
    answer: Un sous-type autorisé doit être `final`, `sealed` ou `non-sealed`.
  - key: trous-non-sealed
    format: fill-in
    question: |-
      Complétez pour laisser les clients étendre `Personnalise` :
      ```java
      public ___ class Personnalise implements Theme {}
      ```
    blanks: [[non-sealed]]
    answer: '`non-sealed` rouvre la hiérarchie.'
  - key: trous-record
    format: fill-in
    question: |-
      Complétez le sous-type autorisé, porteur d'un IBAN :
      ```java
      public ___ Virement(String iban) implements Paiement {}
      ```
    blanks: [[record]]
    answer: Un record est implicitement `final`.
  - key: code-hierarchie
    format: code-output
    question: |-
      ```java
      class Demo {
          sealed interface Forme permits Cercle, Carre {}
          record Cercle(double r) implements Forme {}
          record Carre(double c) implements Forme {}
      }
      System.out.println(Demo.Forme.class.isSealed() + " " + Demo.Forme.class.getPermittedSubclasses().length);
      ```
    answer: '`true 2`.'
    check:
      output: "true 2"
  - key: code-sans-modificateur
    format: code-output
    question: |-
      ```java
      class Demo {
          sealed interface Paiement permits Especes {}
          class Especes implements Paiement {}
      }
      ```
    answer: "Ne compile pas : `Especes` doit être `final`, `sealed` ou `non-sealed`."
    check:
      compiles: false
  - key: code-non-liste
    format: code-output
    question: |-
      ```java
      class Demo {
          sealed interface Statut permits Ouvert {}
          record Ouvert() implements Statut {}
          record Ferme() implements Statut {}
      }
      ```
    answer: "Ne compile pas : `Ferme` n'est pas dans la liste `permits`."
    check:
      compiles: false
  - key: code-non-sealed
    format: code-output
    question: |-
      ```java
      class Demo {
          sealed interface Theme permits Clair, Personnalise {}
          record Clair() implements Theme {}
          non-sealed static class Personnalise implements Theme {}
          static class Rose extends Personnalise {}
      }
      System.out.println(new Demo.Rose() instanceof Demo.Theme);
      ```
    answer: '`true` : `Personnalise` rouvre la hiérarchie.'
    check:
      output: "true"
  - key: bug-modificateur
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      public sealed interface Notification permits Email, Sms {}
      public record Email(String adresse) implements Notification {}
      public class Sms implements Notification {}
      ```
    answer: |-
      ```java
      public final class Sms implements Notification {}
      // ou : public record Sms(String numero) implements Notification {}
      ```
      Un sous-type autorisé doit dire comment la hiérarchie continue : `final`, `sealed` ou `non-sealed`.
  - key: bug-enum-statuts
    format: bug-fix
    question: |-
      Cette enum porte des données qui n'ont de sens que pour certains statuts :
      ```java
      enum Statut { EN_ATTENTE, EXPEDIEE, ANNULEE }
      class Commande { Statut statut; String numeroSuivi; String motifAnnulation; }   // souvent null
      ```
    answer: |-
      ```java
      sealed interface Statut permits EnAttente, Expediee, Annulee {}
      record EnAttente() implements Statut {}
      record Expediee(String numeroSuivi) implements Statut {}
      record Annulee(String motif) implements Statut {}
      ```
      Chaque statut porte exactement ses données : plus de champs `null` selon le cas, et un `switch` exhaustif sur le
      statut.
  - key: bug-default-cache
    format: bug-fix
    question: |-
      Un nouveau moyen de paiement a été ajouté, et ce code le traite silencieusement comme une carte :
      ```java
      interface Paiement {}
      String libelle(Paiement p) {
          if (p instanceof Virement) return "virement";
          return "carte";
      }
      ```
    answer: |-
      ```java
      sealed interface Paiement permits Carte, Virement, Prelevement {}

      String libelle(Paiement p) {
          return switch (p) {
              case Carte c -> "carte";
              case Virement v -> "virement";
              case Prelevement pr -> "prélèvement";
          };
      }
      ```
      Avec une interface scellée et un `switch` exhaustif sans `default`, ajouter un cas fait échouer la compilation
      partout où il n'est pas traité.
  - key: bug-hierarchie-ouverte
    format: bug-fix
    question: |-
      Une bibliothèque de stockage a scellé son interface, et les clients ne peuvent plus fournir leur propre implémentation :
      ```java
      public sealed interface Stockage permits Disque, S3 {}
      ```
    answer: |-
      ```java
      public interface Stockage {}
      ```
      Une hiérarchie faite pour être étendue par d'autres (des plugins, des implémentations clientes) ne doit pas être
      scellée. Le scellement convient à un ensemble fermé de cas, connu de l'auteur.
