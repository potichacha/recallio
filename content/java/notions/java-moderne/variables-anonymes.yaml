notion: variables-anonymes
lesson: |-
  Depuis Java 22 (JEP 456), le caractère **`_`** désigne une variable ou un motif **dont on n'utilise pas la valeur**.

  ```java
  // Motif anonyme : un composant ignoré
  if (o instanceof Point(int x, _)) { ... }
  case Commande(_, var lignes, _) -> lignes.size();

  // Variable anonyme : une déclaration obligatoire mais inutile
  for (var _ : lignes) compteur++;
  try { Integer.parseInt(s); } catch (NumberFormatException _) { return false; }
  map.forEach((_, valeur) -> total += valeur);
  try (var _ = verrou.acquerir()) { ... }               // une ressource gardée pour sa fermeture
  ```

  - `_` peut apparaître **plusieurs fois** dans une même portée : ce n'est pas un vrai nom.
  - On ne peut pas **lire** `_` : `System.out.println(_)` ne compile pas.
  - Dans un `switch`, plusieurs motifs peuvent partager un cas s'ils ne lient aucune variable :
    `case Carre _, Cercle _ -> "forme simple";`.
  - L'intérêt est la **clarté** : le lecteur sait que la valeur est volontairement ignorée, et les outils d'analyse ne
    signalent plus de variable inutilisée.
  - Avant Java 9, `_` était un identifiant valide ; il est devenu un mot réservé en Java 9, puis a reçu ce sens en
    Java 22.

  **Piège classique** : utiliser `_` pour une valeur dont on a besoin plus tard. Le compilateur refuse toute lecture :
  il faut alors lui donner un vrai nom.

  **En entretien** : « `_` marque une variable ou un composant volontairement ignoré : paramètre de lambda, exception
  attrapée, compteur de boucle, composant d'un motif de record. »
cards:
  - key: sert-depuis-java-22
    format: course
    question: À quoi sert `_` depuis Java 22 ?
    answer: À nommer une variable ou une composante de pattern inutilisée.
  - key: plusieurs
    format: course
    question: Peut-on utiliser `_` plusieurs fois dans la même portée ?
    answer: "Oui, puisque ce n'est pas un vrai nom : `(_, _) -> 0` ou `case Paire(_, _)`."
  - key: lecture
    format: course
    question: Peut-on lire la valeur d'une variable `_` ?
    answer: Non, toute lecture est une erreur de compilation ; si la valeur sert, il lui faut un vrai nom.
  - key: cas-groupes
    format: course
    question: Comment regrouper plusieurs motifs de type dans un même cas de `switch` ?
    answer: "Avec des motifs anonymes, qui ne lient aucune variable : `case Carre _, Cercle _ -> ...`."
  - key: vf-catch
    format: true-false
    question: "`catch (IOException _)` est valide en Java 22+."
    truth: true
    answer: L'exception est attrapée sans être nommée.
  - key: vf-lecture
    format: true-false
    question: "Après `for (var _ : liste)`, on peut afficher `_` dans la boucle."
    truth: false
    answer: '`_` ne peut pas être lu.'
  - key: vf-lambda
    format: true-false
    question: "`map.forEach((_, v) -> afficher(v))` compile en Java 22+."
    truth: true
    answer: La clé est ignorée volontairement.
  - key: vf-java8
    format: true-false
    question: "`_` est un identifiant ordinaire en Java 21."
    truth: false
    answer: C'est un mot réservé depuis Java 9 ; son sens « anonyme » arrive en Java 22.
  - key: qcm-valides
    format: multiple-choice
    question: Lesquels sont valides en Java 22+ ?
    choices:
      - text: "`case Point(int x, _) -> x`"
        correct: true
      - text: "`try (var _ = ouvrir()) { }`"
        correct: true
      - text: "`int _ = 3; System.out.println(_);`"
        correct: false
      - text: "`void traiter(String _)` pour un paramètre de méthode"
        correct: false
    answer: '`_` ne se lit pas ; il n''est pas permis comme paramètre de méthode.'
  - key: qcm-interet
    format: multiple-choice
    question: Quel est l'intérêt principal de `_` ?
    choices:
      - text: "Montrer que la valeur est volontairement ignorée"
        correct: true
      - text: "Supprimer les avertissements de variable inutilisée"
        correct: true
      - text: "Améliorer les performances"
        correct: false
      - text: "Rendre une variable globale"
        correct: false
    answer: C'est un outil de lisibilité.
  - key: qcm-switch
    format: multiple-choice
    question: "Quelle écriture regroupe deux sous-types dans un cas ?"
    choices:
      - text: "`case Carre _, Cercle _ -> \"simple\";`"
        correct: true
      - text: "`case Carre c, Cercle k -> \"simple\";`"
        correct: false
      - text: "`case Carre | Cercle -> \"simple\";`"
        correct: false
      - text: "`case (Carre, Cercle) -> \"simple\";`"
        correct: false
    answer: Des motifs qui lient des variables ne peuvent pas partager un cas.
  - key: qcm-version
    format: multiple-choice
    question: Depuis quelle version les variables et motifs anonymes sont-ils définitifs ?
    choices:
      - text: "Java 22"
        correct: true
      - text: "Java 17"
        correct: false
      - text: "Java 21, où ils étaient en préversion"
        correct: false
      - text: "Java 25"
        correct: false
    answer: JEP 456, après une préversion en Java 21.
  - key: code-motif
    format: code-output
    question: |-
      ```java
      record Point(int x, int y) {}
      Object o = new Point(4, 9);
      if (o instanceof Point(int x, _)) {
          System.out.println(x);
      }
      ```
    answer: '`4`.'
    check:
      output: "4"
  - key: code-boucle
    format: code-output
    question: |-
      ```java
      int n = 0;
      for (var _ : List.of("a", "b", "c")) n++;
      Map<String, Integer> m = new TreeMap<>(Map.of("x", 1, "y", 2));
      int[] total = {0};
      m.forEach((_, v) -> total[0] += v);
      System.out.println(n + " " + total[0]);
      ```
    answer: '`3 3`.'
    check:
      output: "3 3"
  - key: code-catch
    format: code-output
    question: |-
      ```java
      static boolean estNombre(String s) {
          try {
              Integer.parseInt(s);
              return true;
          } catch (NumberFormatException _) {
              return false;
          }
      }
      System.out.println(estNombre("12") + " " + estNombre("douze"));
      ```
    answer: '`true false`.'
    check:
      output: "true false"
  - key: code-lecture
    format: code-output
    question: |-
      ```java
      for (var _ : List.of(1, 2)) {
          System.out.println(_);
      }
      ```
    answer: "Ne compile pas : `_` ne peut pas être lu."
    check:
      compiles: false
