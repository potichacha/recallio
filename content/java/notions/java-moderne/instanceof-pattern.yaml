notion: instanceof-pattern
lesson: |-
  Depuis Java 16, `instanceof` peut **tester et nommer** en une fois : c'est le filtrage par motif (*pattern matching*).

  ```java
  // Avant : tester, puis caster
  if (obj instanceof String) {
      String s = (String) obj;
      System.out.println(s.length());
  }

  // Maintenant : la variable s n'existe que si le test réussit
  if (obj instanceof String s) {
      System.out.println(s.length());
  }

  if (obj instanceof String s && !s.isEmpty()) { ... }      // s utilisable dans la suite du &&
  if (!(obj instanceof Client c)) { return; }               // portée « inversée » :
  c.envoyer();                                              // c est utilisable après le return
  ```

  - La **variable de motif** n'est en portée que là où le test est certainement vrai : dans le `if`, après un `&&`, ou
    après un `if (!(... instanceof ...)) return;`.
  - Avec `||`, la variable n'est **pas** utilisable : le test peut avoir échoué.
  - `null instanceof X` vaut toujours `false` : pas besoin de tester `null` avant.
  - C'est la façon idiomatique d'écrire `equals` : `return o instanceof Point p && x == p.x && y == p.y;`.
  - Depuis Java 21, les **motifs de record** déconstruisent aussi : `if (o instanceof Point(int x, int y))`.

  **Piège classique** : `if (o instanceof String s || s.isEmpty())`. `s` n'est pas définie si le test échoue : ne compile
  pas. Il faut `&&`.

  **En entretien** : « `instanceof Type nom` teste et lie en une fois, sans cast ; la variable n'existe que là où le test
  est vrai, ce qui fonctionne avec `&&` et les retours anticipés. »
cards:
  - key: definition
    format: course
    question: Qu'apporte `obj instanceof String s` ?
    answer: "Le test et la conversion en une fois : si `obj` est une `String`, la variable `s` est déclarée et utilisable, sans cast explicite (Java 16)."
  - key: portee
    format: course
    question: Où la variable d'un motif `instanceof` est-elle utilisable ?
    answer: "Là où le test est certainement vrai : dans le bloc du `if`, à droite d'un `&&`, ou après un `if (!(x instanceof T t)) return;`."
  - key: null-faux
    format: course
    question: Faut-il tester `null` avant `obj instanceof String s` ?
    answer: "Non : `instanceof` vaut `false` pour `null`."
  - key: equals
    format: course
    question: Comment écrire `equals` avec le filtrage par motif ?
    answer: '`return o instanceof Point p && x == p.x && y == p.y;` : le test de type, le cast et la comparaison en une expression.'
  - key: vf-ou
    format: true-false
    question: "`if (o instanceof String s || s.isEmpty())` compile."
    truth: false
    answer: "Si le test échoue, `s` n'existe pas : le compilateur refuse."
  - key: vf-null
    format: true-false
    question: "`null instanceof Object o` vaut `true`."
    truth: false
    answer: '`instanceof` vaut toujours `false` pour `null`.'
  - key: vf-negation
    format: true-false
    question: "Après `if (!(o instanceof Client c)) return;`, on peut utiliser `c`."
    truth: true
    answer: Le compilateur sait que le test a réussi si l'on est arrivé là.
  - key: vf-version
    format: true-false
    question: Le filtrage par motif avec `instanceof` est définitif depuis Java 16.
    truth: true
    answer: Après des préversions en Java 14 et 15.
  - key: qcm-compile
    format: multiple-choice
    question: Lesquelles compilent ?
    choices:
      - text: "`if (o instanceof String s && s.length() > 3) { }`"
        correct: true
      - text: "`if (!(o instanceof String s)) return; s.length();`"
        correct: true
      - text: "`if (o instanceof String s || s.length() > 3) { }`"
        correct: false
      - text: "`if (o instanceof String s) { } s.length();`"
        correct: false
    answer: Avec `||` ou après le `if`, `s` n'est pas forcément définie.
  - key: qcm-equals
    format: multiple-choice
    question: Quelle est l'écriture idiomatique de `equals` pour `class Point { int x, y; }` ?
    choices:
      - text: "`return o instanceof Point p && x == p.x && y == p.y;`"
        correct: true
      - text: "`Point p = (Point) o; return x == p.x && y == p.y;`"
        correct: false
      - text: "`return o.equals(this);`"
        correct: false
      - text: "`return hashCode() == o.hashCode();`"
        correct: false
    answer: Le cast sans test lève une `ClassCastException` pour un autre type.
  - key: qcm-null
    format: multiple-choice
    question: "Que fait `if (valeur instanceof Integer i) { total += i; }` si `valeur` est `null` ?"
    choices:
      - text: "Rien, le test vaut `false`"
        correct: true
      - text: "Une `NullPointerException`"
        correct: false
      - text: "Ajoute 0"
        correct: false
      - text: "Ne compile pas"
        correct: false
    answer: Le test protège aussi contre `null`.
  - key: qcm-record
    format: multiple-choice
    question: "Comment extraire `x` et `y` d'un `Object o` qui est peut-être un `record Point(int x, int y)` ?"
    choices:
      - text: "`if (o instanceof Point(int x, int y)) { ... }`"
        correct: true
      - text: "`if (o instanceof Point p) { int x = p.x(); int y = p.y(); }`"
        correct: true
      - text: "`if (o instanceof Point(x, y)) { ... }`"
        correct: false
      - text: "`if (o == Point(int x, int y)) { ... }`"
        correct: false
    answer: Le motif de record (Java 21) déclare les types de ses composants (ou `var`).
  - key: trous-motif
    format: fill-in
    question: |-
      Complétez pour tester et nommer en une fois :
      ```java
      if (forme instanceof Cercle ___) {
          aire = Math.PI * c.rayon() * c.rayon();
      }
      ```
    blanks: [[c]]
    answer: La variable de motif est déclarée après le type.
  - key: trous-et
    format: fill-in
    question: |-
      Complétez pour n'accepter qu'une chaîne non vide :
      ```java
      if (saisie instanceof String s ___ !s.isBlank()) { traiter(s); }
      ```
    blanks: [["&&"]]
    answer: '`s` est utilisable à droite du `&&`.'
  - key: trous-sortie
    format: fill-in
    question: |-
      Complétez le retour anticipé :
      ```java
      if (!(evenement ___ Commande c)) {
          return;
      }
      facturer(c);
      ```
    blanks: [[instanceof]]
    answer: Après le `return`, `c` est utilisable.
  - key: trous-equals
    format: fill-in
    question: |-
      Complétez `equals` :
      ```java
      @Override public boolean equals(Object o) {
          return o instanceof Euro ___ && centimes == e.centimes;
      }
      ```
    blanks: [[e]]
    answer: Test, nommage et comparaison en une expression.
  - key: code-motif
    format: code-output
    question: |-
      ```java
      Object[] valeurs = {"java", 42, null, 3.5};
      for (Object v : valeurs) {
          if (v instanceof String s) System.out.print(s.length() + " ");
          else if (v instanceof Integer i && i > 40) System.out.print("grand ");
          else System.out.print("? ");
      }
      ```
    answer: '`4 grand ? ?` : `null` ne correspond à aucun type.'
    check:
      output: "4 grand ? ?"
  - key: code-negation
    format: code-output
    question: |-
      ```java
      static String decrire(Object o) {
          if (!(o instanceof String s)) {
              return "pas une chaîne";
          }
          return s.toUpperCase();
      }
      System.out.println(decrire("abc") + " / " + decrire(12));
      ```
    answer: '`ABC / pas une chaîne`.'
    check:
      output: "ABC / pas une chaîne"
  - key: code-ou
    format: code-output
    question: |-
      ```java
      Object o = "x";
      if (o instanceof String s || s.isEmpty()) {
          System.out.println("ok");
      }
      ```
    answer: "Ne compile pas : avec `||`, `s` peut ne pas exister."
    check:
      compiles: false
  - key: code-record
    format: code-output
    question: |-
      ```java
      record Point(int x, int y) {}
      Object o = new Point(3, 4);
      if (o instanceof Point(int x, int y) && x < y) {
          System.out.println(x + y);
      }
      ```
    answer: '`7`.'
    check:
      output: "7"
  - key: bug-cast
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      if (evenement instanceof Paiement) {
          Paiement p = (Paiement) evenement;
          comptabiliser(p.montant());
      }
      ```
    answer: |-
      ```java
      if (evenement instanceof Paiement p) {
          comptabiliser(p.montant());
      }
      ```
      Le motif teste et nomme en une fois, sans cast à répéter.
  - key: bug-equals
    format: bug-fix
    question: |-
      Simplifiez cet `equals` :
      ```java
      @Override public boolean equals(Object o) {
          if (o == null || getClass() != o.getClass()) return false;
          Produit autre = (Produit) o;
          return code.equals(autre.code);
      }
      ```
    answer: |-
      ```java
      @Override public boolean equals(Object o) {
          return o instanceof Produit autre && code.equals(autre.code);
      }
      ```
      `instanceof` gère `null`, le cast et le nommage. (Si `Produit` peut avoir des sous-classes, la comparaison des
      `getClass()` reste un choix délibéré ; pour une classe `final`, `instanceof` suffit.)
  - key: bug-portee
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      if (message instanceof Texte t) {
          journal.info("texte reçu");
      }
      envoyer(t.contenu());
      ```
    answer: |-
      ```java
      if (!(message instanceof Texte t)) {
          return;
      }
      journal.info("texte reçu");
      envoyer(t.contenu());
      ```
      La variable de motif n'existe que là où le test est certainement vrai : dans le bloc du `if`. Avec un retour
      anticipé sur le test inversé, elle reste utilisable dans la suite de la méthode.
  - key: bug-chaine-if
    format: bug-fix
    question: |-
      Modernisez :
      ```java
      double aire;
      if (f instanceof Cercle) {
          aire = Math.PI * ((Cercle) f).r() * ((Cercle) f).r();
      } else if (f instanceof Carre) {
          aire = ((Carre) f).c() * ((Carre) f).c();
      } else {
          throw new IllegalArgumentException();
      }
      ```
    answer: |-
      ```java
      double aire = switch (f) {
          case Cercle c -> Math.PI * c.r() * c.r();
          case Carre c -> c.c() * c.c();
      };
      ```
      Avec une interface `Forme` scellée, le `switch` à motifs est exhaustif, sans `else` défensif ni casts répétés.
