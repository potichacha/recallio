notion: record-patterns
lesson: |-
  Un **motif de record** (Java 21) **déconstruit** un record : il teste le type et extrait les composants en une fois.

  ```java
  record Point(int x, int y) {}
  record Segment(Point debut, Point fin) {}

  if (o instanceof Point(int x, int y)) {          // x et y extraits
      System.out.println(x + y);
  }

  static double longueur(Object o) {
      return switch (o) {
          case Segment(Point(var x1, var y1), Point(var x2, var y2))     // déconstruction imbriquée
                  -> Math.hypot(x2 - x1, y2 - y1);
          default -> 0;
      };
  }
  ```

  - Les composants s'écrivent avec leur **type** (`int x`) ou **`var`** ; les noms sont libres (ils n'ont pas à
    reprendre ceux du record).
  - On peut **imbriquer** les motifs pour aller chercher les données au fond d'une structure.
  - Les motifs se combinent avec les gardes : `case Point(int x, int y) when x == y -> "diagonale";`.
  - Un composant qu'on n'utilise pas s'écrit **`_`** (Java 22) : `case Point(int x, _)`.
  - Les motifs de record s'appliquent aux records **génériques** : `case Paire<String, Integer>(var k, var v)`, ou avec
    inférence `case Paire(var k, var v)`.
  - Un motif imbriqué ne correspond pas si un composant est `null` : `Segment(Point(...), ...)` échoue si `debut` est
    `null`.

  Avec une hiérarchie scellée de records, on obtient des traitements par cas très compacts : un interpréteur
  d'expressions, un routeur de messages, un calcul de prix selon le type de client.

  **Piège classique** : croire que le motif appelle les champs directement. Il passe par les **accesseurs** : un
  accesseur redéfini (par exemple qui copie une liste) est appelé à chaque déconstruction.

  **En entretien** : « Un motif de record teste le type et extrait les composants, avec `var` ou des types, imbriqué si
  besoin ; combiné à un type scellé, il donne des `switch` exhaustifs et compacts. »
cards:
  - key: record-pattern
    format: course
    question: "Qu'est-ce qu'un motif de record (record pattern) ?"
    choices:
      - {text: "La déstructuration d'un record dans un `instanceof` ou un `switch` : `Point(int x, int y)`", correct: true}
      - {text: "Un patron de conception qui remplace les classes de données par des records", correct: false}
      - {text: "La construction d'un record à partir d'une `Map` de ses composants", correct: false}
      - {text: "Un record générique, dont les composants ont des types paramétrés", correct: false}
    answer: |-
      La déstructuration d'un record dans un `instanceof` ou un `switch` : `case Point(int x, int y)` teste le type et
      extrait les composants en une fois (Java 21).
  - key: imbrication
    format: course
    question: Qu'est-ce qu'une déconstruction imbriquée ?
    choices:
      - {text: "Un motif de record dont les composants sont eux-mêmes des motifs, pour extraire en profondeur", correct: true}
      - {text: "Un record déclaré à l'intérieur d'un autre record, comme une classe imbriquée", correct: false}
      - {text: "Un `switch` placé dans un autre `switch`, pour traiter chaque sous-cas à part", correct: false}
      - {text: "Un appel en chaîne des accesseurs, comme `c.client().adresse().ville()`", correct: false}
    answer: |-
      Un motif de record dont les composants sont eux-mêmes des motifs, par exemple
      `case Segment(Point(var x1, var y1), Point p2)`, pour extraire des données en profondeur.
  - key: var-noms
    format: course
    question: Les noms des variables d'un motif de record doivent-ils reprendre ceux des composants ?
    choices:
      - {text: "Non, ils sont libres ; on peut aussi écrire `var` à la place du type", correct: true}
      - {text: "Oui : sinon le motif ne compile pas, faute de composant de ce nom", correct: false}
      - {text: "Oui, mais on peut omettre leur type, que le compilateur déduit", correct: false}
      - {text: "Non, mais le type reste obligatoire : `var` y est interdit", correct: false}
    answer: Non, ils sont libres ; on peut aussi écrire `var` à la place du type.
  - key: null-imbrique
    format: course
    question: "Dans `case Segment(Point(var x, var y), var fin)`, que se passe-t-il si le premier composant du `Segment` vaut `null` ?"
    choices:
      - {text: "Le motif ne correspond pas, et le cas suivant est essayé", correct: true}
      - {text: "Le `switch` lève une `NullPointerException`", correct: false}
      - {text: "Le motif correspond, avec `x` et `y` à 0", correct: false}
      - {text: "Le `switch` lève une `MatchException`", correct: false}
    answer: |-
      Un motif de record imbriqué, comme `Point(var x, var y)`, ne correspond pas à `null` : le cas suivant est essayé.
      Un `var` imbriqué, lui, correspond aussi à `null`.
  - key: vf-var
    format: true-false
    question: "`case Point(var a, var b)` est un motif de record valide."
    truth: true
    answer: '`var` laisse le compilateur inférer les types des composants.'
  - key: vf-accesseurs
    format: true-false
    question: La déconstruction d'un record lit les champs sans passer par les accesseurs.
    truth: false
    answer: Elle appelle les accesseurs.
  - key: vf-classe
    format: true-false
    question: On peut déconstruire une classe ordinaire avec un motif de record.
    truth: false
    answer: Seuls les records ont des motifs de déconstruction (pour l'instant).
  - key: vf-garde
    format: true-false
    question: "Une garde peut utiliser les variables d'un motif de record : `case Point(int x, int y) when x == y`."
    truth: true
    answer: Elles sont en portée dans la garde et dans le corps.
  - key: qcm-valide
    format: multiple-choice
    question: "Lesquels sont des motifs valides pour `record Point(int x, int y)` ?"
    choices:
      - text: "`Point(int x, int y)`"
        correct: true
      - text: "`Point(var a, var b)`"
        correct: true
      - text: "`Point(x, y)`"
        correct: false
      - text: "`Point(int x)`"
        correct: false
    answer: Il faut un type (ou `var`) pour chaque composant, et tous les composants.
  - key: qcm-imbrique
    format: multiple-choice
    question: "Comment extraire la ville d'une `Commande(Client client, ...)` où `Client(String nom, Adresse adresse)` et `Adresse(String ville)` ?"
    choices:
      - {text: "`case Commande(Client(var nom, Adresse(var ville)), var lignes) -> ville`", correct: true}
      - {text: "`case Commande(client.adresse.ville) -> ville`, en suivant les champs", correct: false}
      - {text: "`case Commande c -> c.ville`, le motif aplatissant toute la structure", correct: false}
      - {text: "Ce n'est pas possible en un seul motif : il faut des `if` imbriqués", correct: false}
    answer: Les motifs s'imbriquent pour descendre dans la structure.
  - key: qcm-inutilise
    format: multiple-choice
    question: "Comment ignorer le composant `y` de `Point(int x, int y)` dans un motif ?"
    choices:
      - {text: "`Point(int x, _)`", correct: true}
      - {text: "`Point(int x)`", correct: false}
      - {text: "`Point(int x, null)`", correct: false}
      - {text: "`Point(int x, ...)`", correct: false}
    answer: |-
      Le motif anonyme `_` (Java 22) remplace le composant inutilisé (`var _` aussi). Un motif de record doit avoir un
      motif pour chacun de ses composants.
  - key: qcm-version
    format: multiple-choice
    question: Depuis quelle version les motifs de record sont-ils définitifs ?
    choices:
      - text: "Java 21"
        correct: true
      - text: "Java 16"
        correct: false
      - text: "Java 17"
        correct: false
      - text: "Java 25"
        correct: false
    answer: En même temps que le filtrage dans `switch`.
  - key: code-instanceof
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Point(int x, int y) {}
      Object o = new Point(2, 5);
      if (o instanceof Point(int a, int b)) {
          System.out.println(a * b);
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`7`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: '`10` : les noms des variables sont libres.'
    check:
      output: "10"
  - key: code-imbrique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Point(int x, int y) {}
      record Segment(Point debut, Point fin) {}
      Object o = new Segment(new Point(0, 0), new Point(3, 4));
      String s = switch (o) {
          case Segment(Point(var x1, var y1), Point(var x2, var y2)) -> "longueur " + Math.hypot(x2 - x1, y2 - y1);
          default -> "?";
      };
      System.out.println(s);
      ```
    choices:
      - {text: "`longueur 5.0`", correct: true}
      - {text: "`longueur 5`", correct: false}
      - {text: "`longueur 7.0`", correct: false}
      - {text: "`?`", correct: false}
    answer: "`longueur 5.0` : le motif imbriqué extrait les quatre coordonnées, et `Math.hypot` renvoie un `double`."
    check:
      output: "longueur 5.0"
  - key: code-garde
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Point(int x, int y) {}
      for (Point p : List.of(new Point(1, 1), new Point(0, 5), new Point(2, 3))) {
          System.out.print(switch (p) {
              case Point(int x, int y) when x == y -> "diag ";
              case Point(int x, int y) when x == 0 -> "axe ";
              case Point(int x, int y) -> "autre ";
          });
      }
      ```
    choices:
      - {text: "`diag axe autre`", correct: true}
      - {text: "`diag axe axe`", correct: false}
      - {text: "`diag autre autre`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`diag axe autre` : les cas sont essayés dans l'ordre, et la première garde vraie l'emporte."
    check:
      output: "diag axe autre"
  - key: code-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Point(int x, int y) {}
      record Segment(Point debut, Point fin) {}
      Object o = new Segment(null, new Point(1, 1));
      System.out.println(switch (o) {
          case Segment(Point(var x, var y), var fin) -> "complet";
          case Segment(var debut, var fin) -> "début manquant";
          default -> "?";
      });
      ```
    choices:
      - {text: "`début manquant`", correct: true}
      - {text: "`complet`", correct: false}
      - {text: "`?`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: '`début manquant` : le motif imbriqué `Point(...)` ne correspond pas à `null`.'
    check:
      output: "début manquant"
  - key: bug-accesseurs-repetes
    format: bug-fix
    question: |-
      Comment simplifier ce code, avec `record Compte(String iban)` ?
      ```java
      if (evt instanceof Virement v) {
          String de = v.source().iban();
          String vers = v.destination().iban();
          long montant = v.montant();
          journaliser(de, vers, montant);
      }
      ```
    choices:
      - {text: "`evt instanceof Virement(Compte(var de), Compte(var vers), long montant)`", correct: true}
      - {text: "`evt instanceof Virement(var de, var vers, var montant)`, en un seul niveau", correct: false}
      - {text: "`evt instanceof Virement(de, vers, montant)`, sans écrire les types", correct: false}
      - {text: "`evt instanceof Virement v(de, vers, montant)`, nommé et déstructuré", correct: false}
    answer: |-
      ```java
      if (evt instanceof Virement(Compte(var de), Compte(var vers), long montant)) {
          journaliser(de, vers, montant);
      }
      ```
      Le motif de record extrait directement les données utiles (en supposant `record Compte(String iban)`).
  - key: bug-ordre-gardes
    format: bug-fix
    question: |-
      Ce code ne compile pas. Pourquoi ?
      ```java
      return switch (p) {
          case Point(int x, int y) -> "autre";
          case Point(int x, int y) when x == y -> "diagonale";
      };
      ```
    choices:
      - {text: "Le cas sans garde, placé en premier, domine le cas gardé qui le suit", correct: true}
      - {text: "Un `switch` sur un record exige un `default`, absent ici", correct: false}
      - {text: "Deux cas ne peuvent pas déclarer les mêmes variables `x` et `y`", correct: false}
      - {text: "Une garde `when` n'est permise que sur un motif de type simple", correct: false}
    answer: |-
      ```java
      return switch (p) {
          case Point(int x, int y) when x == y -> "diagonale";
          case Point(int x, int y) -> "autre";
      };
      ```
      Le cas sans garde couvre tout : celui avec garde, placé après, est dominé.
  - key: bug-variables-inutilisees
    format: bug-fix
    question: |-
      Ce motif déclare des variables jamais utilisées, et l'analyse statique s'en plaint. Quelle correction est la bonne ?
      ```java
      case Commande(Client client, List<Ligne> lignes, Statut statut) when lignes.isEmpty() -> "vide";
      ```
    choices:
      - {text: "Remplacer `client` et `statut` par le motif anonyme `_`", correct: true}
      - {text: "Remplacer `Client client` et `Statut statut` par `var` seul", correct: false}
      - {text: "Retirer `client` et `statut` du motif, qui ne garde que `lignes`", correct: false}
      - {text: "Remplacer `client` et `statut` par `null` dans le motif", correct: false}
    answer: |-
      ```java
      case Commande(_, List<Ligne> lignes, _) when lignes.isEmpty() -> "vide";
      ```
      Le motif anonyme `_` (Java 22) dit explicitement que ces composants ne servent pas.
  - key: bug-cast-composant
    format: bug-fix
    question: |-
      Comment simplifier ce cas, avec `record Reponse(Corps corps)` et `record Erreur(int code) implements Corps` ?
      ```java
      case Reponse r when r.corps() instanceof Erreur -> "erreur " + ((Erreur) r.corps()).code();
      ```
    choices:
      - {text: "`case Reponse(Erreur(var code)) -> \"erreur \" + code;`", correct: true}
      - {text: "`case Reponse(Erreur code) -> \"erreur \" + code;`", correct: false}
      - {text: "`case Reponse(var corps) -> \"erreur \" + corps.code();`", correct: false}
      - {text: "`case Reponse((Erreur) corps) -> \"erreur \" + corps.code();`", correct: false}
    answer: |-
      ```java
      case Reponse(Erreur(var code)) -> "erreur " + code;
      ```
      Un motif imbriqué teste le type du composant et l'extrait, sans cast. `Reponse(var corps)` donne un `Corps`, sans
      méthode `code()`.
