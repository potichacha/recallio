notion: nouveautes-java-11-17
lesson: |-
  Depuis Java 9, une nouvelle version sort **tous les six mois** (mars et septembre), et une version sur quatre (tous les
  deux ans depuis 2021) est **LTS** (support long) : 11, 17, 21, 25.

  | Version | Apports marquants |
  |---|---|
  | **9** (2017) | **modules** (JPMS), **JShell**, `List.of`/`Set.of`/`Map.of`, méthodes privées d'interface, `Optional.stream`, `takeWhile`/`dropWhile`, G1 par défaut |
  | **10** | **`var`** pour les variables locales |
  | **11** (LTS) | **`HttpClient`** standard, `String.isBlank`/`strip`/`lines`/`repeat`, `Files.readString`, `java Fichier.java` sans compiler ; **retrait** des modules Java EE (JAXB, JAX-WS) et de CORBA |
  | **12 à 13** | `Collectors.teeing`, `String.indent`, préversions des `switch` expressions et blocs de texte |
  | **14** | **`switch` expressions** définitives, messages de `NullPointerException` détaillés |
  | **15** | **blocs de texte** (`"""`), ZGC et Shenandoah prêts pour la production, retrait de Nashorn |
  | **16** | **records**, **`instanceof` à motif**, `Stream.toList()` |
  | **17** (LTS) | **classes scellées**, encapsulation forte des internes du JDK, nouveaux générateurs aléatoires |

  - Un **bloc de texte** écrit une chaîne sur plusieurs lignes sans échappements :
    `String json = """ { "nom": "ada" } """;`.
  - Les **messages de NPE détaillés** (JEP 358) disent quelle expression était `null` : `Cannot invoke "String.length()"
    because "client.nom" is null`.
  - Le passage de 8 à 11 est souvent le plus délicat : modules, retrait de Java EE, accès réflexifs aux internes.

  **Piège classique** : croire que `var` rend Java dynamiquement typé. Le type est inféré à la compilation et figé.

  **En entretien** : « 9 les modules et `List.of`, 10 `var`, 11 `HttpClient` et le retrait de Java EE, 14 les `switch`
  expressions, 15 les blocs de texte, 16 les records, 17 les classes scellées. »
cards:
  - key: rythme
    format: course
    question: À quel rythme sortent les versions de Java depuis Java 9, et lesquelles sont LTS ?
    answer: Tous les six mois (mars et septembre) ; les LTS récentes sont 11, 17, 21 et 25, une tous les deux ans depuis 2021.
  - key: java-11
    format: course
    question: Qu'apporte Java 11 ?
    answer: Le `HttpClient` standard, de nouvelles méthodes de `String` (`isBlank`, `strip`, `lines`, `repeat`), `Files.readString`, le lancement direct d'un fichier source, et le retrait des modules Java EE et de CORBA.
  - key: blocs-texte
    format: course
    question: Qu'est-ce qu'un bloc de texte (Java 15) ?
    answer: Une chaîne sur plusieurs lignes délimitée par `"""`, sans échappement des retours à la ligne ni des guillemets, avec une indentation commune retirée automatiquement.
  - key: npe-detaillees
    format: course
    question: Qu'ont apporté les messages de NullPointerException détaillés (Java 14) ?
    answer: Le message indique quelle expression était `null`, par exemple `because "client.adresse" is null`, ce qui évite de deviner dans une chaîne d'appels.
  - key: vf-var-dynamique
    format: true-false
    question: Avec `var`, le type d'une variable peut changer pendant l'exécution.
    truth: false
    answer: Il est inféré à la compilation et ne change plus.
  - key: vf-records-16
    format: true-false
    question: Les records sont définitifs depuis Java 16.
    truth: true
    answer: Comme le filtrage avec `instanceof`.
  - key: vf-jaxb
    format: true-false
    question: JAXB est toujours inclus dans le JDK 17.
    truth: false
    answer: "Il a été retiré en Java 11 : on l'ajoute en dépendance (Jakarta XML Binding)."
  - key: vf-lts
    format: true-false
    question: Java 17 est une version LTS.
    truth: true
    answer: Comme 11, 21 et 25.
  - key: qcm-versions
    format: multiple-choice
    question: Associez correctement les fonctionnalités à leur version définitive.
    choices:
      - text: "`var` : Java 10"
        correct: true
      - text: "Classes scellées : Java 17"
        correct: true
      - text: "Records : Java 11"
        correct: false
      - text: "Modules : Java 8"
        correct: false
    answer: Records en 16, modules en 9.
  - key: qcm-11
    format: multiple-choice
    question: Lesquels sont apparus en Java 11 ?
    choices:
      - text: "`HttpClient` (java.net.http)"
        correct: true
      - text: "`String.isBlank()`"
        correct: true
      - text: "Les blocs de texte"
        correct: false
      - text: "`Stream.toList()`"
        correct: false
    answer: Blocs de texte en 15, `toList()` en 16.
  - key: qcm-retrait
    format: multiple-choice
    question: Qu'a retiré Java 11 du JDK ?
    choices:
      - text: "Les modules Java EE (JAXB, JAX-WS, JAF)"
        correct: true
      - text: "CORBA"
        correct: true
      - text: "Les lambdas"
        correct: false
      - text: "`java.util.Date`"
        correct: false
    answer: '`Date` existe toujours, même si `java.time` est préférable.'
  - key: qcm-texte
    format: multiple-choice
    question: Quelle écriture est un bloc de texte valide ?
    choices:
      - text: "`String s = \"\"\"` suivi d'un retour à la ligne, du texte, puis `\"\"\";`"
        correct: true
      - text: "`String s = \"\"\"texte\"\"\";` sur une seule ligne"
        correct: false
      - text: "`String s = `texte`;`"
        correct: false
      - text: "`String s = '''texte''';`"
        correct: false
    answer: L'ouverture `"""` doit être suivie d'un retour à la ligne.
