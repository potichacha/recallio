notion: preview-incubation
lesson: |-
  Le JDK publie certaines nouveautés **avant** qu'elles soient définitives, pour recueillir des retours :

  - une fonctionnalité en **préversion** (*preview*, JEP 12) concerne le **langage** ou la **JVM** (ou une API du JDK) :
    elle est complète, mais peut **changer** ou **disparaître** à la version suivante. Il faut l'activer explicitement :

    ```
    javac --release 25 --enable-preview Main.java
    java --enable-preview Main
    ```

  - un **module d'incubation** (JEP 11) contient une **API** expérimentale, dans un module `jdk.incubator.*`, à ajouter
    avec `--add-modules jdk.incubator.vector`.

  Exemples :
  - les **String templates** ont été en préversion en Java 21 et 22, puis **retirés** en Java 23 ;
  - la **concurrence structurée** a été en incubation (19-20), puis en préversion depuis Java 21 ;
  - la **Vector API** (`jdk.incubator.vector`) est en incubation depuis Java 16, en attendant le projet Valhalla.

  Règles pratiques :
  - une classe compilée avec `--enable-preview` porte une marque dans son fichier `.class` : elle **ne s'exécute que sur
    la même version** du JDK, avec `--enable-preview` ;
  - on **n'utilise pas** de préversion en production : le code devra être modifié, et la montée de version bloquera ;
  - le compilateur affiche un avertissement à chaque usage.

  **Piège classique** : adopter une préversion « parce qu'elle sera sûrement finalisée ». Les String templates montrent
  qu'une fonctionnalité peut disparaître complètement.

  **En entretien** : « La préversion touche le langage, s'active avec `--enable-preview` et peut changer ou disparaître ;
  l'incubation concerne des API dans `jdk.incubator`. Ni l'une ni l'autre en production. »
cards:
  - key: string-templates-existent-ils
    format: course
    question: Les String templates existent-ils ?
    answer: Non, ils ont été en preview en Java 21-22 puis retirés en Java 23.
  - key: preview-vs-incubator
    format: course
    question: Preview vs incubator ?
    answer: Fonctionnalité du langage ou de l'API complète mais modifiable (--enable-preview) vs API expérimentale dans un module jdk.incubator.
  - key: activer
    format: course
    question: Comment activer une fonctionnalité en préversion ?
    answer: Avec `--enable-preview` à la compilation (avec `--release N`) et à l'exécution.
  - key: version-unique
    format: course
    question: Pourquoi une classe compilée avec `--enable-preview` pose-t-elle problème lors d'une montée de version ?
    answer: Elle est marquée comme dépendante des préversions de ce JDK précis et ne s'exécute que sur la même version, avec `--enable-preview` ; il faut la recompiler (et souvent adapter le code).
  - key: vf-production
    format: true-false
    question: Une fonctionnalité en préversion est sûre à utiliser en production.
    truth: false
    answer: Elle peut changer ou disparaître à la version suivante.
  - key: vf-templates
    format: true-false
    question: Les String templates ont été retirés après deux préversions.
    truth: true
    answer: Retirés en Java 23 pour être repensés.
  - key: vf-vector
    format: true-false
    question: La Vector API est dans un module d'incubation.
    truth: true
    answer: '`jdk.incubator.vector`, depuis Java 16.'
  - key: vf-flag
    format: true-false
    question: Une préversion est active par défaut.
    truth: false
    answer: Il faut `--enable-preview`.
  - key: qcm-difference
    format: multiple-choice
    question: Qu'est-ce qui distingue un module d'incubation ?
    choices:
      - text: "Une API expérimentale dans un module `jdk.incubator.*`"
        correct: true
      - text: "On l'ajoute avec `--add-modules`"
        correct: true
      - text: "Il modifie la syntaxe du langage"
        correct: false
      - text: "Il est garanti stable"
        correct: false
    answer: Les changements de langage passent par les préversions.
  - key: qcm-exemples
    format: multiple-choice
    question: Lesquelles ont été en préversion avant d'être définitives ?
    choices:
      - text: "Les records"
        correct: true
      - text: "Le filtrage dans `switch`"
        correct: true
      - text: "Les lambdas"
        correct: false
      - text: "Les génériques"
        correct: false
    answer: Le processus de préversion date de Java 12 environ.
  - key: qcm-commande
    format: multiple-choice
    question: Quelle commande compile un fichier qui utilise une préversion de Java 25 ?
    choices:
      - text: "`javac --release 25 --enable-preview Main.java`"
        correct: true
      - text: "`javac --preview Main.java`"
        correct: false
      - text: "`javac -Xpreview Main.java`"
        correct: false
      - text: "`javac Main.java`, automatiquement"
        correct: false
    answer: '`--enable-preview` exige aussi de préciser la version (`--release`).'
  - key: qcm-risque
    format: multiple-choice
    question: Quel est le principal risque à utiliser une préversion ?
    choices:
      - text: "Devoir réécrire le code quand la fonctionnalité change ou disparaît"
        correct: true
      - text: "Un programme plus lent"
        correct: false
      - text: "Une faille de sécurité garantie"
        correct: false
      - text: "L'impossibilité de compiler"
        correct: false
    answer: Et rester bloqué sur une version du JDK.
