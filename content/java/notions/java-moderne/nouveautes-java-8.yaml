notion: nouveautes-java-8
lesson: |-
  Java 8 (2014) est la version qui a le plus changé la façon d'écrire du Java :

  | Apport | Ce qu'il permet |
  |---|---|
  | **Lambdas** et **références de méthodes** | passer du comportement en argument : `liste.sort(comparing(Client::nom))` |
  | **Interfaces fonctionnelles** (`java.util.function`) | `Function`, `Predicate`, `Consumer`, `Supplier`... |
  | **Streams** | des traitements déclaratifs sur les collections : `filter`, `map`, `collect` |
  | **Méthodes `default` et `static` dans les interfaces** | faire évoluer une interface sans casser ses implémentations (`List.sort`, `Map.forEach`) |
  | **`Optional`** | exprimer une valeur absente dans un type de retour |
  | **`java.time`** (JSR 310) | des dates immuables et claires : `LocalDate`, `Instant`, `Duration`, `ZonedDateTime` |
  | **`CompletableFuture`** | composer des calculs asynchrones |
  | **Metaspace** | remplace la PermGen : plus d'`OutOfMemoryError: PermGen space` |

  Et aussi : `Map.computeIfAbsent`, `merge`, `getOrDefault` ; `String.join`, `StringJoiner` ; `Base64` ; les annotations
  répétables et sur les types ; le moteur JavaScript Nashorn (retiré depuis, en Java 15).

  Java 8 a longtemps été la version la plus utilisée en production. Son support public gratuit par Oracle s'est arrêté
  en 2019, mais des distributions (Temurin, Corretto...) l'ont maintenu bien plus longtemps.

  **Piège classique** : attribuer `var`, `List.of` ou les modules à Java 8. Ils viennent de Java 9 et 10.

  **En entretien** : « Java 8, ce sont les lambdas, les streams, les méthodes `default`, `Optional` et `java.time` : le
  passage à un style plus fonctionnel. »
cards:
  - key: apports
    format: course
    question: Quels sont les principaux apports de Java 8 ?
    answer: Les lambdas et références de méthodes, les streams, les méthodes `default` et `static` dans les interfaces, `Optional`, l'API `java.time` et `CompletableFuture`.
  - key: default
    format: course
    question: Pourquoi Java 8 a-t-il introduit les méthodes `default` ?
    answer: Pour faire évoluer des interfaces existantes (ajouter `stream()`, `forEach`, `sort`...) sans casser toutes leurs implémentations.
  - key: java-time
    format: course
    question: Que remplace `java.time` ?
    answer: Les classes `Date` et `Calendar`, mutables et mal conçues, par des types immuables et explicites (`LocalDate`, `Instant`, `ZonedDateTime`, `Duration`).
  - key: metaspace
    format: course
    question: Qu'a changé Java 8 dans le stockage des métadonnées de classes ?
    answer: La PermGen, de taille fixe, a été remplacée par le Metaspace, en mémoire native et extensible.
  - key: vf-var
    format: true-false
    question: "`var` est apparu en Java 8."
    truth: false
    answer: En Java 10.
  - key: vf-optional
    format: true-false
    question: "`Optional` est apparu en Java 8."
    truth: true
    answer: Avec les streams, qui l'utilisent (`findFirst`, `max`).
  - key: vf-list-of
    format: true-false
    question: "`List.of(...)` existe depuis Java 8."
    truth: false
    answer: Depuis Java 9.
  - key: vf-completable
    format: true-false
    question: "`CompletableFuture` est apparu en Java 8."
    truth: true
    answer: Pour composer des traitements asynchrones.
  - key: qcm-java8
    format: multiple-choice
    question: Lesquels sont apparus en Java 8 ?
    choices:
      - text: "Les lambdas"
        correct: true
      - text: "L'API `java.time`"
        correct: true
      - text: "Les modules (JPMS)"
        correct: false
      - text: "Les records"
        correct: false
    answer: Les modules datent de Java 9, les records de Java 16.
  - key: qcm-pas-java8
    format: multiple-choice
    question: Lesquels ne sont pas apparus en Java 8 ?
    choices:
      - text: "JShell"
        correct: true
      - text: "`HttpClient` standard"
        correct: true
      - text: "Les streams"
        correct: false
      - text: "Les méthodes `default`"
        correct: false
    answer: JShell vient de Java 9, `HttpClient` de Java 11.
  - key: qcm-permgen
    format: multiple-choice
    question: Quelle erreur Java 8 a-t-il fait disparaître en supprimant la PermGen ?
    choices:
      - text: "`OutOfMemoryError: PermGen space`"
        correct: true
      - text: "`StackOverflowError`"
        correct: false
      - text: "`OutOfMemoryError: Java heap space`"
        correct: false
      - text: "`NoClassDefFoundError`"
        correct: false
    answer: "Le Metaspace peut toutefois être plein (`OutOfMemoryError: Metaspace`)."
  - key: qcm-map
    format: multiple-choice
    question: Quelles méthodes de `Map` sont apparues en Java 8 ?
    choices:
      - text: "`computeIfAbsent`"
        correct: true
      - text: "`getOrDefault`"
        correct: true
      - text: "`Map.of`"
        correct: false
      - text: "`Map.entry`"
        correct: false
    answer: '`Map.of` et `Map.entry` viennent de Java 9.'
