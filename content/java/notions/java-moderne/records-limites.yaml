notion: records-limites
lesson: |-
  Un record est volontairement limité, pour rester une simple **valeur transparente** :

  | Interdit | Pourquoi |
  |---|---|
  | `extends` une classe | il étend déjà `java.lang.Record` |
  | être étendu | il est implicitement **`final`** |
  | un champ d'instance en plus des composants | l'état est exactement les composants |
  | modifier un champ | les champs sont **`final`** |
  | être `abstract` | |
  | un initialiseur d'instance (`{ ... }`) | |

  Permis : implémenter des interfaces, déclarer des méthodes, des membres `static`, des constructeurs supplémentaires,
  des annotations sur les composants, des génériques (`record Paire<A, B>(A gauche, B droite)`).

  Conséquences pratiques :
  - pas d'**entité JPA** en record : Hibernate a besoin d'un constructeur sans argument, de champs modifiables et de
    sous-classes proxy ;
  - pas d'**état caché** : un cache calculé paresseusement, un compteur, n'ont pas leur place dans un record ;
  - les accesseurs portent les noms des composants (`nom()`) : certaines vieilles bibliothèques attendent `getNom()`
    (Jackson et la plupart des frameworks récents gèrent les records) ;
  - la sérialisation Java d'un record passe toujours par le constructeur canonique, donc par sa validation.

  **Piège classique** : vouloir une hiérarchie de records (`record Chien extends Animal`). On partage le comportement
  par une **interface** (éventuellement `sealed`) que chaque record implémente.

  **En entretien** : « Un record est final, étend `Record`, n'a que ses composants comme état et des champs `final` ; il
  peut implémenter des interfaces. Pour une hiérarchie, une interface scellée et des records. »
cards:
  - key: limites-record
    format: course
    question: Limites d'un record ?
    answer: Implicitement final, champs finaux, ne peut pas hériter d'une classe.
  - key: hierarchie
    format: course
    question: Comment partager un comportement entre plusieurs records ?
    answer: Par une interface (éventuellement `sealed`) qu'ils implémentent, avec au besoin des méthodes `default` ; un record ne peut pas étendre une classe.
  - key: jpa
    format: course
    question: Pourquoi un record ne convient-il pas comme entité JPA ?
    answer: Hibernate a besoin d'un constructeur sans argument, de champs modifiables et de pouvoir créer des sous-classes proxy ; un record est final, à champs final, sans constructeur vide.
  - key: generiques
    format: course
    question: Un record peut-il être générique ?
    answer: Oui, par exemple `record Paire<A, B>(A gauche, B droite) {}`.
  - key: vf-extends
    format: true-false
    question: Un record peut étendre une classe abstraite.
    truth: false
    answer: Il étend implicitement `java.lang.Record`.
  - key: vf-final
    format: true-false
    question: Un record est implicitement `final`.
    truth: true
    answer: Aucune classe ne peut l'étendre.
  - key: vf-static
    format: true-false
    question: Un record peut déclarer un champ `static`.
    truth: true
    answer: Seuls les champs d'instance supplémentaires sont interdits.
  - key: vf-serialisation
    format: true-false
    question: La désérialisation Java d'un record contourne son constructeur.
    truth: false
    answer: Elle passe par le constructeur canonique, donc par sa validation.
  - key: qcm-interdit
    format: multiple-choice
    question: Qu'est-ce qu'un record ne peut pas faire ?
    choices:
      - text: "Déclarer un champ d'instance `private int cache;`"
        correct: true
      - text: "Étendre une classe (`extends Base`)"
        correct: true
      - text: "Implémenter `Comparable`"
        correct: false
      - text: "Déclarer une méthode `static`"
        correct: false
    answer: Interfaces et membres statiques sont permis.
  - key: qcm-super
    format: multiple-choice
    question: Quelle est la superclasse de tout record ?
    choices:
      - text: "`java.lang.Record`"
        correct: true
      - text: "`java.lang.Object` directement"
        correct: false
      - text: "`java.io.Serializable`"
        correct: false
      - text: "Aucune"
        correct: false
    answer: '`Record` étend lui-même `Object`.'
  - key: qcm-hierarchie
    format: multiple-choice
    question: Comment modéliser des formes (cercle, rectangle) en records partageant une méthode `aire()` ?
    choices:
      - text: "`sealed interface Forme { double aire(); }` et des records qui l'implémentent"
        correct: true
      - text: "`abstract record Forme` et des records qui l'étendent"
        correct: false
      - text: "`record Cercle extends Forme`"
        correct: false
      - text: "Un seul record avec un champ « type » et des champs facultatifs"
        correct: false
    answer: Les records ne s'étendent pas ; une interface les unit.
  - key: qcm-etat
    format: multiple-choice
    question: Un objet doit mémoriser un résultat calculé à la première demande. Record ou classe ?
    choices:
      - text: "Une classe, car il faut un champ supplémentaire modifiable"
        correct: true
      - text: "Un record avec un champ `private Integer cache`"
        correct: false
      - text: "Un record avec un initialiseur d'instance"
        correct: false
      - text: "Un record dont un composant est mis à jour"
        correct: false
    answer: L'état d'un record est exactement ses composants, figés à la construction.
  - key: code-extends
    format: code-output
    question: |-
      ```java
      class Animal {}
      record Chien(String nom) extends Animal {}
      ```
    answer: "Ne compile pas : un record ne peut pas étendre de classe."
    check:
      compiles: false
  - key: code-heritage-record
    format: code-output
    question: |-
      ```java
      record Point(int x, int y) {}
      System.out.println(Point.class.getSuperclass().getName() + " "
              + java.lang.reflect.Modifier.isFinal(Point.class.getModifiers()) + " " + Point.class.isRecord());
      ```
    answer: '`java.lang.Record true true`.'
    check:
      output: "java.lang.Record true true"
  - key: code-generique
    format: code-output
    question: |-
      ```java
      record Paire<A, B>(A gauche, B droite) {
          <C> Paire<A, C> avecDroite(C nouvelle) { return new Paire<>(gauche, nouvelle); }
      }
      System.out.println(new Paire<>("x", 1).avecDroite(true));
      ```
    answer: '`Paire[gauche=x, droite=true]`.'
    check:
      output: "Paire[gauche=x, droite=true]"
  - key: code-interface
    format: code-output
    question: |-
      ```java
      interface Forme { double aire(); default String decrire() { return "aire " + aire(); } }
      record Carre(double cote) implements Forme { public double aire() { return cote * cote; } }
      System.out.println(new Carre(3).decrire());
      ```
    answer: '`aire 9.0`.'
    check:
      output: "aire 9.0"
