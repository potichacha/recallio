notion: records-compact
lesson: |-
  Le **constructeur compact** d'un record s'écrit sans liste de paramètres. Il s'exécute **avant** l'affectation des
  champs, et sert à **valider** et **normaliser** les composants.

  ```java
  public record Email(String valeur) {
      public Email {                                   // pas de parenthèses : les paramètres sont implicites
          Objects.requireNonNull(valeur, "valeur");
          valeur = valeur.strip().toLowerCase(Locale.ROOT);    // on peut réaffecter le paramètre
          if (!valeur.contains("@")) {
              throw new IllegalArgumentException("email invalide : " + valeur);
          }
      }                                                // les champs reçoivent ensuite les paramètres
  }

  public record Equipe(String nom, List<String> membres) {
      public Equipe {
          membres = List.copyOf(membres);              // copie défensive, non modifiable
      }
  }
  ```

  - On **réaffecte les paramètres**, jamais les champs : `this.valeur = ...` est interdit dans le constructeur compact.
  - Les champs sont affectés **automatiquement** à la fin, avec les valeurs (éventuellement modifiées) des paramètres.
  - La validation dans le constructeur garantit qu'**aucune instance invalide** n'existe : c'est le principe « parse,
    don't validate ».
  - Pour une copie défensive complète, l'accesseur renvoie déjà la liste non modifiable ; pour un tableau, il faut aussi
    redéfinir l'accesseur (`return octets.clone();`).
  - On peut aussi écrire le constructeur canonique en entier (`public Email(String valeur) { this.valeur = ...; }`), mais
    le compact est plus court.

  **Piège classique** : `this.membres = List.copyOf(membres);` dans le constructeur compact. Cela ne compile pas : on
  réaffecte le paramètre (`membres = List.copyOf(membres);`), et le champ suit.

  **En entretien** : « Le constructeur compact valide et normalise les paramètres avant l'affectation automatique des
  champs ; c'est là que je mets les `requireNonNull`, les règles métier et les copies défensives. »
cards:
  - key: valider-record
    format: course
    question: "Comment valider les composants d'un record ?"
    choices:
      - {text: "Avec un constructeur compact, qui vérifie les paramètres avant l'affectation", correct: true}
      - {text: "Avec des setters qui vérifient chaque nouvelle valeur avant de l'affecter", correct: false}
      - {text: "Avec des accesseurs redéfinis, qui vérifient la valeur à chaque lecture", correct: false}
      - {text: "Avec une méthode `validate()`, appelée par le compilateur après construction", correct: false}
    answer: |-
      Avec un constructeur compact : il vérifie les paramètres (et lève une exception) avant l'affectation des champs, si
      bien qu'aucun record invalide ne peut exister.
  - key: compact-definition
    format: course
    question: Qu'est-ce qu'un constructeur compact ?
    choices:
      - {text: "Un constructeur canonique sans liste de paramètres, exécuté avant l'affectation des champs", correct: true}
      - {text: "Un constructeur canonique exécuté après l'affectation des champs, pour les relire", correct: false}
      - {text: "Un constructeur sans paramètre, que le record génère pour les frameworks", correct: false}
      - {text: "Un constructeur secondaire, plus court, qui délègue au canonique par `this(...)`", correct: false}
    answer: Un constructeur canonique écrit sans liste de paramètres ; il s'exécute avant l'affectation automatique des champs, avec les valeurs éventuellement modifiées des paramètres.
  - key: reaffecter
    format: course
    question: Comment normaliser une valeur dans un constructeur compact ?
    choices:
      - {text: "En réaffectant le paramètre, `nom = nom.strip();` : le champ reçoit ensuite cette valeur", correct: true}
      - {text: "En affectant le champ, `this.nom = nom.strip();`, comme dans un constructeur classique", correct: false}
      - {text: "En redéfinissant l'accesseur `nom()` pour qu'il renvoie `nom.strip()` à chaque appel", correct: false}
      - {text: "En appelant `this(nom.strip())` tout au début du constructeur compact", correct: false}
    answer: |-
      En réaffectant le paramètre (`nom = nom.strip();`) ; le champ reçoit ensuite cette valeur. Affecter `this.nom` est
      interdit, et normaliser dans l'accesseur laisserait le champ brut, que compare `equals`.
  - key: copie-defensive
    format: course
    question: Comment protéger un record contenant une liste ?
    choices:
      - {text: "Avec `membres = List.copyOf(membres);` dans le constructeur compact", correct: true}
      - {text: "Avec `Collections.unmodifiableList(membres)` dans l'accesseur, sans copie", correct: false}
      - {text: "En déclarant le composant `final List<String> membres` dans l'en-tête", correct: false}
      - {text: "Rien à faire : le record copie déjà la liste reçue à la construction", correct: false}
    answer: |-
      Avec `membres = List.copyOf(membres);` dans le constructeur compact : la copie est non modifiable et détachée de la
      liste de l'appelant. Une vue non modifiable suivrait toujours les changements de l'appelant.
  - key: vf-parentheses
    format: true-false
    question: Un constructeur compact s'écrit `public Email { ... }`, sans parenthèses.
    truth: true
    answer: Les paramètres sont ceux des composants.
  - key: vf-this
    format: true-false
    question: "On peut écrire `this.valeur = valeur.strip();` dans un constructeur compact."
    truth: false
    answer: Les champs sont affectés automatiquement à la fin ; on réaffecte le paramètre.
  - key: vf-exception
    format: true-false
    question: Un constructeur compact peut lever une exception pour refuser une valeur invalide.
    truth: true
    answer: Ainsi, aucune instance invalide n'existe.
  - key: vf-copyof
    format: true-false
    question: "`List.copyOf` accepte une liste contenant `null`."
    truth: false
    answer: Il lève une `NullPointerException`, ce qui sert aussi de validation.
  - key: qcm-ou
    format: multiple-choice
    question: Où placer la vérification qu'une `Plage(int debut, int fin)` a `debut <= fin` ?
    choices:
      - text: "Dans le constructeur compact"
        correct: true
      - text: "Dans chaque méthode qui utilise la plage"
        correct: false
      - text: "Dans l'accesseur `debut()`"
        correct: false
      - text: "Dans `toString()`"
        correct: false
    answer: Une fois à la construction, et l'invariant tient pour toujours.
  - key: qcm-normaliser
    format: multiple-choice
    question: Lesquelles normalisent correctement un code pays en majuscules ?
    choices:
      - text: "`public Pays { code = code.toUpperCase(Locale.ROOT); }`"
        correct: true
      - text: "`public Pays(String code) { this.code = code.toUpperCase(Locale.ROOT); }`"
        correct: true
      - text: "`public Pays { this.code = code.toUpperCase(Locale.ROOT); }`"
        correct: false
      - text: "`public String code() { return code.toUpperCase(); }`, qui laisse le champ brut"
        correct: false
    answer: Constructeur compact ou canonique complet ; la dernière garde un champ non normalisé (et casse `equals`).
  - key: qcm-tableau
    format: multiple-choice
    question: Comment rendre réellement immuable `record Image(byte[] pixels)` ?
    choices:
      - {text: "Copier le tableau dans le constructeur et dans l'accesseur (`clone()`)", correct: true}
      - {text: "Copier le tableau seulement dans le constructeur compact, avec `clone()`", correct: false}
      - {text: "Déclarer le composant `final byte[] pixels`, pour figer son contenu", correct: false}
      - {text: "Rien : un record est déjà immuable, tableau compris, par construction", correct: false}
    answer: Sans copie dans l'accesseur, l'appelant modifie le tableau interne.
  - key: qcm-ordre
    format: multiple-choice
    question: Quand les champs d'un record sont-ils affectés avec un constructeur compact ?
    choices:
      - {text: "À la fin du constructeur compact, avec les valeurs des paramètres", correct: true}
      - {text: "Avant l'exécution du constructeur compact, avec les valeurs reçues", correct: false}
      - {text: "Jamais automatiquement : il faut écrire `this.x = x` soi-même", correct: false}
      - {text: "Au premier appel d'un accesseur, de façon paresseuse", correct: false}
    answer: C'est pourquoi réaffecter un paramètre suffit à changer la valeur stockée.
  - key: trous-compact
    format: fill-in
    question: |-
      Complète le constructeur compact :
      ```java
      public record Age(int valeur) {
          public ___ {
              if (valeur < 0) throw new IllegalArgumentException("âge négatif");
          }
      }
      ```
    blanks: [[Age]]
    answer: Le nom du record, sans parenthèses.
  - key: trous-copy
    format: fill-in
    question: |-
      Complète la copie défensive :
      ```java
      public record Equipe(List<String> membres) {
          public Equipe {
              membres = List.___(membres);
          }
      }
      ```
    blanks: [[copyOf]]
    answer: '`List.copyOf` crée une copie non modifiable.'
  - key: trous-non-null
    format: fill-in
    question: |-
      Complète pour refuser `null` avec un message clair :
      ```java
      public record Client(String nom) {
          public Client {
              Objects.___(nom, "nom");
          }
      }
      ```
    blanks: [[requireNonNull]]
    answer: Une `NullPointerException` avec le nom du composant.
  - key: trous-normaliser
    format: fill-in
    question: |-
      Complète pour stocker le nom sans espaces autour :
      ```java
      public record Ville(String nom) {
          public Ville {
              ___ = nom.strip();
          }
      }
      ```
    blanks: [[nom]]
    answer: On réaffecte le paramètre, le champ suit.
  - key: code-normalisation
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Email(String valeur) {
          public Email {
              valeur = valeur.strip().toLowerCase();
          }
      }
      System.out.println(new Email("  Ada@Example.ORG ").valeur() + " "
              + new Email("a@b.c").equals(new Email(" A@B.C")));
      ```
    choices:
      - {text: "`ada@example.org true`", correct: true}
      - {text: "`ada@example.org false`", correct: false}
      - {text: "`Ada@Example.ORG false`", correct: false}
      - {text: "`Ada@Example.ORG true`", correct: false}
    answer: '`ada@example.org true` : la normalisation rend aussi `equals` cohérent.'
    check:
      output: "ada@example.org true"
  - key: code-validation
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Plage(int debut, int fin) {
          public Plage {
              if (debut > fin) throw new IllegalArgumentException(debut + " > " + fin);
          }
      }
      System.out.println(new Plage(1, 3));
      new Plage(5, 2);
      ```
    choices:
      - {text: "`Plage[debut=1, fin=3]`, puis une `IllegalArgumentException`", correct: true}
      - {text: "Une `IllegalArgumentException`, sans rien afficher avant", correct: false}
      - {text: "`Plage(1, 3)`, puis une `IllegalArgumentException`", correct: false}
      - {text: "`Plage[debut=1, fin=3]`, et aucune exception", correct: false}
    answer: '`Plage[debut=1, fin=3]`, puis une `IllegalArgumentException` : aucune plage invalide ne peut exister.'
    check:
      output: "Plage[debut=1, fin=3]"
      throws: IllegalArgumentException
  - key: code-copie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Equipe(List<String> membres) {
          public Equipe { membres = List.copyOf(membres); }
      }
      List<String> l = new ArrayList<>(List.of("ada"));
      Equipe e = new Equipe(l);
      l.add("bob");
      System.out.println(e.membres());
      e.membres().add("eve");
      ```
    choices:
      - {text: "`[ada]`, puis une `UnsupportedOperationException`", correct: true}
      - {text: "`[ada, bob]`, puis une `UnsupportedOperationException`", correct: false}
      - {text: "`[ada]`, et aucune exception", correct: false}
      - {text: "`[ada, bob]`, et aucune exception", correct: false}
    answer: '`[ada]`, puis une `UnsupportedOperationException` : la copie est détachée et non modifiable.'
    check:
      output: "[ada]"
      throws: UnsupportedOperationException
  - key: code-this
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Nom(String valeur) {
          Nom {
              this.valeur = valeur.strip();
          }
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Rien", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: "Ne compile pas : on ne peut pas affecter un champ dans un constructeur compact."
    check:
      compiles: false
  - key: bug-validation-dispersee
    format: bug-fix
    question: |-
      Chaque service vérifie la même règle avant d'utiliser une quantité. Quelle correction est la bonne ?
      ```java
      record Quantite(int valeur) {}
      if (q.valeur() <= 0) throw new IllegalArgumentException();   // répété partout
      ```
    choices:
      - {text: "Valider dans le constructeur compact de `Quantite`, une fois pour toutes", correct: true}
      - {text: "Extraire la vérification dans une méthode `static`, appelée par chaque service", correct: false}
      - {text: "Vérifier la règle dans l'accesseur `valeur()`, à chaque lecture", correct: false}
      - {text: "Remplacer `int` par `Integer`, pour signaler l'absence par `null`", correct: false}
    answer: |-
      ```java
      record Quantite(int valeur) {
          Quantite {
              if (valeur <= 0) throw new IllegalArgumentException("quantité non positive : " + valeur);
          }
      }
      ```
      La règle vit dans le type : une `Quantite` invalide ne peut plus exister, et les services n'ont plus à vérifier.
  - key: bug-this-champ
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      record Tag(String libelle) {
          Tag {
              this.libelle = libelle.toLowerCase(Locale.ROOT);
          }
      }
      ```
    choices:
      - {text: "Réaffecter le paramètre : `libelle = libelle.toLowerCase(Locale.ROOT);`", correct: true}
      - {text: "Déclarer le champ `libelle` sans `final` dans le corps du record", correct: false}
      - {text: "Appeler `super()` avant d'affecter `this.libelle`", correct: false}
      - {text: "Remplacer `Tag {` par `Tag() {`, un constructeur sans paramètre", correct: false}
    answer: |-
      ```java
      record Tag(String libelle) {
          Tag {
              libelle = libelle.toLowerCase(Locale.ROOT);
          }
      }
      ```
      Dans un constructeur compact, on réaffecte le paramètre ; le champ est affecté automatiquement à la fin.
  - key: bug-accesseur-tableau
    format: bug-fix
    question: |-
      L'appelant parvient à modifier les octets de cette clé « immuable ». Quelle correction est la bonne ?
      ```java
      record Cle(byte[] octets) {
          Cle { octets = octets.clone(); }
      }
      cle.octets()[0] = 0;
      ```
    choices:
      - {text: "Redéfinir l'accesseur `octets()` pour qu'il renvoie `octets.clone()`", correct: true}
      - {text: "Retirer `clone()` du constructeur compact, qui ne sert à rien", correct: false}
      - {text: "Déclarer le composant `final byte[] octets` dans l'en-tête", correct: false}
      - {text: "Copier deux fois le tableau dans le constructeur compact", correct: false}
    answer: |-
      ```java
      record Cle(byte[] octets) {
          Cle { octets = octets.clone(); }
          @Override public byte[] octets() { return octets.clone(); }
      }
      ```
      L'accesseur généré renvoie le tableau interne. Il faut aussi le copier en sortie.
  - key: bug-normalisation-accesseur
    format: bug-fix
    question: |-
      Deux codes postaux identiques à l'espace près ne sont pas égaux. Quelle correction est la bonne ?
      ```java
      record CodePostal(String valeur) {
          @Override public String valeur() { return valeur.strip(); }
      }
      new CodePostal("75001").equals(new CodePostal(" 75001"));   // false
      ```
    choices:
      - {text: "Normaliser dans le constructeur compact : `valeur = valeur.strip();`", correct: true}
      - {text: "Redéfinir aussi `toString` pour qu'il renvoie `valeur()`", correct: false}
      - {text: "Comparer les codes postaux avec `==` plutôt qu'avec `equals`", correct: false}
      - {text: "Appeler `strip()` dans l'accesseur, puis une seconde fois", correct: false}
    answer: |-
      ```java
      record CodePostal(String valeur) {
          CodePostal { valeur = valeur.strip(); }
      }
      ```
      `equals` compare les champs, pas les accesseurs. On normalise à la construction pour que le champ stocké soit déjà
      propre.
