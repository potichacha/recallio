notion: records-compact
lesson: |-
  Le **constructeur compact** d'un record s'écrit sans liste de paramètres. Il s'exécute **avant** l'affectation des
  champs, et sert à **valider** et **normaliser** les composants.

  ```java
  public record Email(String valeur) {
      public Email {                                   // pas de parenthèses : les paramètres sont implicites
          Objects.requireNonNull(valeur, "valeur");
          valeur = valeur.strip().toLowerCase(Locale.ROOT);    // on peut réaffecter le paramètre
          if (!valeur.contains("@")) {
              throw new IllegalArgumentException("email invalide : " + valeur);
          }
      }                                                // les champs reçoivent ensuite les paramètres
  }

  public record Equipe(String nom, List<String> membres) {
      public Equipe {
          membres = List.copyOf(membres);              // copie défensive, non modifiable
      }
  }
  ```

  - On **réaffecte les paramètres**, jamais les champs : `this.valeur = ...` est interdit dans le constructeur compact.
  - Les champs sont affectés **automatiquement** à la fin, avec les valeurs (éventuellement modifiées) des paramètres.
  - La validation dans le constructeur garantit qu'**aucune instance invalide** n'existe : c'est le principe « parse,
    don't validate ».
  - Pour une copie défensive complète, l'accesseur renvoie déjà la liste non modifiable ; pour un tableau, il faut aussi
    redéfinir l'accesseur (`return octets.clone();`).
  - On peut aussi écrire le constructeur canonique en entier (`public Email(String valeur) { this.valeur = ...; }`), mais
    le compact est plus court.

  **Piège classique** : `this.membres = List.copyOf(membres);` dans le constructeur compact. Cela ne compile pas : on
  réaffecte le paramètre (`membres = List.copyOf(membres);`), et le champ suit.

  **En entretien** : « Le constructeur compact valide et normalise les paramètres avant l'affectation automatique des
  champs ; c'est là que je mets les `requireNonNull`, les règles métier et les copies défensives. »
cards:
  - key: valider-record
    format: course
    question: Comment valider dans un record ?
    answer: Avec un compact constructor.
  - key: compact-definition
    format: course
    question: Qu'est-ce qu'un constructeur compact ?
    answer: Un constructeur canonique écrit sans liste de paramètres ; il s'exécute avant l'affectation automatique des champs, avec les valeurs éventuellement modifiées des paramètres.
  - key: reaffecter
    format: course
    question: Comment normaliser une valeur dans un constructeur compact ?
    answer: En réaffectant le paramètre (`nom = nom.strip();`) ; le champ reçoit ensuite cette valeur. Affecter `this.nom` est interdit.
  - key: copie-defensive
    format: course
    question: Comment protéger un record contenant une liste ?
    answer: "Avec `membres = List.copyOf(membres);` dans le constructeur compact : la copie est non modifiable et détachée de la liste de l'appelant."
  - key: vf-parentheses
    format: true-false
    question: Un constructeur compact s'écrit `public Email { ... }`, sans parenthèses.
    truth: true
    answer: Les paramètres sont ceux des composants.
  - key: vf-this
    format: true-false
    question: "On peut écrire `this.valeur = valeur.strip();` dans un constructeur compact."
    truth: false
    answer: Les champs sont affectés automatiquement à la fin ; on réaffecte le paramètre.
  - key: vf-exception
    format: true-false
    question: Un constructeur compact peut lever une exception pour refuser une valeur invalide.
    truth: true
    answer: Ainsi, aucune instance invalide n'existe.
  - key: vf-copyof
    format: true-false
    question: "`List.copyOf` accepte une liste contenant `null`."
    truth: false
    answer: Il lève une `NullPointerException`, ce qui sert aussi de validation.
  - key: qcm-ou
    format: multiple-choice
    question: Où placer la vérification qu'une `Plage(int debut, int fin)` a `debut <= fin` ?
    choices:
      - text: "Dans le constructeur compact"
        correct: true
      - text: "Dans chaque méthode qui utilise la plage"
        correct: false
      - text: "Dans l'accesseur `debut()`"
        correct: false
      - text: "Dans `toString()`"
        correct: false
    answer: Une fois à la construction, et l'invariant tient pour toujours.
  - key: qcm-normaliser
    format: multiple-choice
    question: Lesquelles normalisent correctement un code pays en majuscules ?
    choices:
      - text: "`public Pays { code = code.toUpperCase(Locale.ROOT); }`"
        correct: true
      - text: "`public Pays(String code) { this.code = code.toUpperCase(Locale.ROOT); }`"
        correct: true
      - text: "`public Pays { this.code = code.toUpperCase(Locale.ROOT); }`"
        correct: false
      - text: "`public String code() { return code.toUpperCase(); }`, qui laisse le champ brut"
        correct: false
    answer: Constructeur compact ou canonique complet ; la dernière garde un champ non normalisé (et casse `equals`).
  - key: qcm-tableau
    format: multiple-choice
    question: Comment rendre réellement immuable `record Image(byte[] pixels)` ?
    choices:
      - text: "Copier le tableau dans le constructeur et dans l'accesseur (`clone()`)"
        correct: true
      - text: "Seulement le rendre `final`"
        correct: false
      - text: "Copier seulement dans le constructeur"
        correct: false
      - text: "C'est déjà le cas"
        correct: false
    answer: Sans copie dans l'accesseur, l'appelant modifie le tableau interne.
  - key: qcm-ordre
    format: multiple-choice
    question: Quand les champs d'un record sont-ils affectés avec un constructeur compact ?
    choices:
      - text: "À la fin du constructeur compact, avec les valeurs des paramètres"
        correct: true
      - text: "Avant l'exécution du constructeur compact"
        correct: false
      - text: "Jamais, il faut le faire soi-même"
        correct: false
      - text: "Au premier appel d'un accesseur"
        correct: false
    answer: C'est pourquoi réaffecter un paramètre suffit à changer la valeur stockée.
  - key: trous-compact
    format: fill-in
    question: |-
      Complétez le constructeur compact :
      ```java
      public record Age(int valeur) {
          public ___ {
              if (valeur < 0) throw new IllegalArgumentException("âge négatif");
          }
      }
      ```
    blanks: [[Age]]
    answer: Le nom du record, sans parenthèses.
  - key: trous-copy
    format: fill-in
    question: |-
      Complétez la copie défensive :
      ```java
      public record Equipe(List<String> membres) {
          public Equipe {
              membres = List.___(membres);
          }
      }
      ```
    blanks: [[copyOf]]
    answer: '`List.copyOf` crée une copie non modifiable.'
  - key: trous-non-null
    format: fill-in
    question: |-
      Complétez pour refuser `null` avec un message clair :
      ```java
      public record Client(String nom) {
          public Client {
              Objects.___(nom, "nom");
          }
      }
      ```
    blanks: [[requireNonNull]]
    answer: Une `NullPointerException` avec le nom du composant.
  - key: trous-normaliser
    format: fill-in
    question: |-
      Complétez pour stocker le nom sans espaces autour :
      ```java
      public record Ville(String nom) {
          public Ville {
              ___ = nom.strip();
          }
      }
      ```
    blanks: [[nom]]
    answer: On réaffecte le paramètre, le champ suit.
  - key: code-normalisation
    format: code-output
    question: |-
      ```java
      record Email(String valeur) {
          public Email {
              valeur = valeur.strip().toLowerCase();
          }
      }
      System.out.println(new Email("  Ada@Example.ORG ").valeur() + " "
              + new Email("a@b.c").equals(new Email(" A@B.C")));
      ```
    answer: '`ada@example.org true` : la normalisation rend aussi `equals` cohérent.'
    check:
      output: "ada@example.org true"
  - key: code-validation
    format: code-output
    question: |-
      ```java
      record Plage(int debut, int fin) {
          public Plage {
              if (debut > fin) throw new IllegalArgumentException(debut + " > " + fin);
          }
      }
      System.out.println(new Plage(1, 3));
      new Plage(5, 2);
      ```
    answer: '`Plage[debut=1, fin=3]`, puis une `IllegalArgumentException` : aucune plage invalide ne peut exister.'
    check:
      output: "Plage[debut=1, fin=3]"
      throws: IllegalArgumentException
  - key: code-copie
    format: code-output
    question: |-
      ```java
      record Equipe(List<String> membres) {
          public Equipe { membres = List.copyOf(membres); }
      }
      List<String> l = new ArrayList<>(List.of("ada"));
      Equipe e = new Equipe(l);
      l.add("bob");
      System.out.println(e.membres());
      e.membres().add("eve");
      ```
    answer: '`[ada]`, puis une `UnsupportedOperationException` : la copie est détachée et non modifiable.'
    check:
      output: "[ada]"
      throws: UnsupportedOperationException
  - key: code-this
    format: code-output
    question: |-
      ```java
      record Nom(String valeur) {
          Nom {
              this.valeur = valeur.strip();
          }
      }
      ```
    answer: "Ne compile pas : on ne peut pas affecter un champ dans un constructeur compact."
    check:
      compiles: false
  - key: bug-validation-dispersee
    format: bug-fix
    question: |-
      Chaque service vérifie la même règle avant d'utiliser une quantité :
      ```java
      record Quantite(int valeur) {}
      if (q.valeur() <= 0) throw new IllegalArgumentException();   // répété partout
      ```
    answer: |-
      ```java
      record Quantite(int valeur) {
          Quantite {
              if (valeur <= 0) throw new IllegalArgumentException("quantité non positive : " + valeur);
          }
      }
      ```
      La règle vit dans le type : une `Quantite` invalide ne peut plus exister, et les services n'ont plus à vérifier.
  - key: bug-this-champ
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      record Tag(String libelle) {
          Tag {
              this.libelle = libelle.toLowerCase(Locale.ROOT);
          }
      }
      ```
    answer: |-
      ```java
      record Tag(String libelle) {
          Tag {
              libelle = libelle.toLowerCase(Locale.ROOT);
          }
      }
      ```
      Dans un constructeur compact, on réaffecte le paramètre ; le champ est affecté automatiquement à la fin.
  - key: bug-accesseur-tableau
    format: bug-fix
    question: |-
      L'appelant parvient à modifier les octets de cette clé « immuable » :
      ```java
      record Cle(byte[] octets) {
          Cle { octets = octets.clone(); }
      }
      cle.octets()[0] = 0;
      ```
    answer: |-
      ```java
      record Cle(byte[] octets) {
          Cle { octets = octets.clone(); }
          @Override public byte[] octets() { return octets.clone(); }
      }
      ```
      L'accesseur généré renvoie le tableau interne. Il faut aussi le copier en sortie.
  - key: bug-normalisation-accesseur
    format: bug-fix
    question: |-
      Deux codes postaux identiques à l'espace près ne sont pas égaux :
      ```java
      record CodePostal(String valeur) {
          @Override public String valeur() { return valeur.strip(); }
      }
      new CodePostal("75001").equals(new CodePostal(" 75001"));   // false
      ```
    answer: |-
      ```java
      record CodePostal(String valeur) {
          CodePostal { valeur = valeur.strip(); }
      }
      ```
      `equals` compare les champs, pas les accesseurs. On normalise à la construction pour que le champ stocké soit déjà
      propre.
