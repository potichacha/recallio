notion: migration-versions
cards:
  - key: passe-jaxb-passant-java-8-11
    format: course
    question: Que se passe-t-il pour JAXB en passant de Java 8 à 11 ?
    answer: Il a été retiré du JDK ; il faut l'ajouter en dépendance (Jakarta XML Binding).
  - key: equipe-java-17-passer-21-25
    format: scenario
    question: Ton équipe est sur Java 17. Faut-il passer à 21 ou à 25 ?
    answer: |-
      Je viserais directement la **25**, la LTS la plus récente : elle cumule les apports de 21 (virtual threads, pattern matching complet, sequenced collections) et ceux de 22 à 25 (fin du pinning sur `synchronized`, gatherers, ScopedValue, cache AOT pour le démarrage, compact object headers). Le coût de migration de 17 vers 25 n'est pas beaucoup plus élevé que vers 21.
      Je vérifierais la compatibilité de l'écosystème : version du framework (Spring Boot 3.x/4.x, Quarkus 3.x supportent Java 25), outils de build, bibliothèques qui manipulent le bytecode (Lombok, Mockito, ByteBuddy, Jacoco) qui doivent connaître le format de classe.
      Démarche : compiler et tester sur le nouveau JDK en CI en parallèle, corriger les avertissements, déployer progressivement en surveillant GC et latence. Et ne pas adopter de fonctionnalité en preview.
