notion: migration-versions
lesson: |-
  Monter de version de Java est surtout une affaire d'**écosystème** : le code compile en général, ce sont les
  bibliothèques, l'outillage et quelques comportements qui posent problème.

  **Les obstacles classiques** :
  - **retraits** : modules Java EE et CORBA (Java 11 : JAXB, JAX-WS à ajouter en dépendances Jakarta), Nashorn (15),
    Security Manager (désactivé en 24) ;
  - **encapsulation forte** des internes du JDK (Java 16-17) : les accès réflexifs à `sun.*` ou aux champs privés du JDK
    échouent (`InaccessibleObjectException`) sans `--add-opens` ;
  - **outils qui lisent le bytecode** (Lombok, Mockito/ByteBuddy, Jacoco, ASM, plugins Maven) : il faut des versions qui
    connaissent le nouveau format de classe ;
  - **changements de comportement** : UTF-8 par défaut (Java 18, JEP 400) au lieu de l'encodage de la plateforme, données
    de locale CLDR (Java 9) qui changent certains formats de date, choix du GC par défaut.

  **Les outils** :
  - **`jdeps --jdk-internals`** liste les dépendances aux API internes ;
  - **`jdeprscan`** liste les usages d'API dépréciées ou retirées ;
  - **`--release N`** dans le compilateur garantit qu'on n'utilise que l'API de la version N ;
  - un JAR **multi-release** peut embarquer du code spécifique à certaines versions.

  **La démarche** :
  1. mettre à jour le framework et les plugins de build vers des versions compatibles ;
  2. compiler et lancer les tests sur le nouveau JDK, en CI, en parallèle de l'ancien ;
  3. traiter les avertissements (dépréciations, accès illégaux) ;
  4. déployer progressivement en surveillant le GC, la mémoire et les latences ;
  5. n'adopter les nouvelles fonctionnalités du langage qu'ensuite, et jamais les préversions.

  **Piège classique** : sauter les versions LTS une à une sans mettre à jour les dépendances. Une vieille version de
  Lombok ou de Mockito casse la compilation ou les tests sur un nouveau JDK, bien avant le code métier.

  **En entretien** : « L'essentiel du travail est l'écosystème : framework, outils de bytecode, accès aux internes. Je
  m'appuie sur `jdeps` et `jdeprscan`, je teste en CI sur les deux JDK, puis je déploie progressivement. »
cards:
  - key: passe-jaxb-passant-java-8-11
    format: course
    question: Que se passe-t-il pour JAXB en passant de Java 8 à 11 ?
    answer: Il a été retiré du JDK ; il faut l'ajouter en dépendance (Jakarta XML Binding).
  - key: jdeps
    format: course
    question: À quoi sert `jdeps --jdk-internals` lors d'une migration ?
    answer: À lister les dépendances du code et des bibliothèques aux API internes du JDK (`sun.*`...), qui risquent de ne plus être accessibles.
  - key: encapsulation
    format: course
    question: Pourquoi des bibliothèques plantent-elles avec `InaccessibleObjectException` sur Java 17 ?
    answer: Les internes du JDK sont fortement encapsulés depuis Java 16-17 ; un accès réflexif à un champ privé du JDK est refusé sans `--add-opens` (la vraie solution est une version récente de la bibliothèque).
  - key: utf8
    format: course
    question: Quel changement de comportement Java 18 a-t-il apporté sur les fichiers texte ?
    answer: UTF-8 est devenu l'encodage par défaut (JEP 400) quelle que soit la plateforme ; un code qui comptait sur l'encodage du système (Windows-1252, par exemple) peut lire ou écrire différemment.
  - key: vf-bytecode
    format: true-false
    question: Les outils qui manipulent le bytecode (Lombok, Mockito, Jacoco) doivent souvent être mis à jour lors d'une montée de version de Java.
    truth: true
    answer: Ils doivent connaître le nouveau format de classe.
  - key: vf-release
    format: true-false
    question: "`--release 17` empêche d'utiliser une API apparue en Java 21, même en compilant avec un JDK 25."
    truth: true
    answer: Le compilateur vérifie l'API de la version cible.
  - key: vf-preview
    format: true-false
    question: Une migration est une bonne occasion d'adopter les fonctionnalités en préversion.
    truth: false
    answer: On migre d'abord à fonctionnalités constantes, et jamais vers les préversions.
  - key: vf-nashorn
    format: true-false
    question: Le moteur JavaScript Nashorn est toujours dans le JDK 17.
    truth: false
    answer: Il a été retiré en Java 15.
  - key: qcm-outils
    format: multiple-choice
    question: Quels outils aident à préparer une migration ?
    choices:
      - text: "`jdeps --jdk-internals`"
        correct: true
      - text: "`jdeprscan`"
        correct: true
      - text: "`jshell`"
        correct: false
      - text: "`jconsole`"
        correct: false
    answer: L'un repère les API internes, l'autre les API dépréciées ou retirées.
  - key: qcm-obstacles
    format: multiple-choice
    question: Qu'est-ce qui casse le plus souvent lors d'une montée de version de Java ?
    choices:
      - text: "Les bibliothèques qui accèdent aux internes du JDK par réflexion"
        correct: true
      - text: "Les outils de build et de bytecode trop anciens"
        correct: true
      - text: "Les boucles `for`"
        correct: false
      - text: "Les classes `String`"
        correct: false
    answer: Le code métier compile presque toujours.
  - key: qcm-demarche
    format: multiple-choice
    question: Quelle démarche de migration est la plus sûre ?
    choices:
      - text: "Mettre à jour framework et plugins, tester en CI sur les deux JDK, puis déployer progressivement"
        correct: true
      - text: "Changer le JDK en production et corriger les erreurs au fil de l'eau"
        correct: false
      - text: "Réécrire le code avec les nouvelles fonctionnalités avant de changer de JDK"
        correct: false
      - text: "Attendre que plus aucune bibliothèque ne change"
        correct: false
    answer: Petites étapes, vérifiées.
  - key: qcm-add-opens
    format: multiple-choice
    question: Une bibliothèque ancienne lève `InaccessibleObjectException` sur Java 17. Quelle solution privilégier ?
    choices:
      - text: "Mettre à jour la bibliothèque vers une version compatible"
        correct: true
      - text: "Ajouter `--add-opens` en attendant, en le documentant"
        correct: true
      - text: "`--illegal-access=permit`, qui n'existe plus en 17"
        correct: false
      - text: "Désactiver la JVM de sécurité"
        correct: false
    answer: '`--illegal-access` a été retiré en Java 17 ; `--add-opens` est un pis-aller.'
  - key: equipe-java-17-passer-21-25
    format: scenario
    question: Ton équipe est sur Java 17. Faut-il passer à 21 ou à 25 ?
    answer: |-
      Je viserais directement la **25**, la LTS la plus récente : elle cumule les apports de 21 (virtual threads, pattern matching complet, sequenced collections) et ceux de 22 à 25 (fin du pinning sur `synchronized`, gatherers, ScopedValue, cache AOT pour le démarrage, compact object headers). Le coût de migration de 17 vers 25 n'est pas beaucoup plus élevé que vers 21.
      Je vérifierais la compatibilité de l'écosystème : version du framework (Spring Boot 3.x/4.x, Quarkus 3.x supportent Java 25), outils de build, bibliothèques qui manipulent le bytecode (Lombok, Mockito, ByteBuddy, Jacoco) qui doivent connaître le format de classe.
      Démarche : compiler et tester sur le nouveau JDK en CI en parallèle, corriger les avertissements, déployer progressivement en surveillant GC et latence. Et ne pas adopter de fonctionnalité en preview.
  - key: scenario-java-8
    format: scenario
    question: Une application critique tourne encore sur Java 8. Comment organises-tu sa migration ?
    answer: |-
      Je commence par l'inventaire : `jdeps --jdk-internals` et `jdeprscan` sur le code et les dépendances, et la liste
      des bibliothèques avec leur version minimale compatible. Le saut 8 → 11 est le plus délicat (modules, retrait de
      JAXB et JAX-WS à remplacer par les dépendances Jakarta, accès aux internes) ; s'il y a beaucoup à faire, je passe
      d'abord à 11 ou 17 en production, puis à la LTS la plus récente. Je mets à jour le framework et les plugins, je
      fais tourner la CI sur les deux JDK, je compare les performances et le comportement (encodage, formats de date,
      GC), puis je déploie progressivement avec un retour arrière possible.
  - key: scenario-encodage
    format: scenario
    question: Après la migration de Java 17 à 21 sur un serveur Windows, des fichiers CSV exportés ont des accents cassés. Pourquoi ?
    answer: |-
      Depuis Java 18, l'encodage par défaut est UTF-8 partout (JEP 400), alors qu'avant il dépendait du système
      (Windows-1252 sur un Windows en français). Le code écrivait sans préciser l'encodage (`new FileWriter(f)`), et le
      fichier, désormais en UTF-8, est lu par un outil qui attend du Windows-1252. La correction durable est de toujours
      préciser l'encodage (`Files.newBufferedWriter(p, StandardCharsets.UTF_8)`, ou l'encodage attendu par le
      destinataire) ; `-Dfile.encoding=COMPAT` rétablit l'ancien comportement en dépannage.
  - key: scenario-bibliotheque-bloquante
    format: scenario
    question: Une bibliothèque interne, plus maintenue, empêche de passer à Java 21. Que fais-tu ?
    answer: |-
      Je mesure d'abord le problème : `jdeps` pour voir quelles API internes elle utilise, et un essai sous Java 21 pour
      voir ce qui casse réellement. Ensuite, selon la taille : la remplacer par une bibliothèque maintenue, la reprendre et
      la corriger (souvent quelques accès réflexifs), ou l'isoler derrière une interface pour la remplacer plus tard. En
      attendant, un `--add-opens` ciblé et documenté peut débloquer, avec un ticket pour le retirer. Je ne laisse pas une
      dépendance abandonnée bloquer indéfiniment les mises à jour de sécurité du JDK.
