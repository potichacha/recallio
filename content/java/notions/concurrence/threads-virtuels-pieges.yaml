notion: threads-virtuels-pieges
cards:
  - key: mettre-virtual-threads-pool
    format: course
    question: Faut-il mettre les virtual threads en pool ?
    answer: Non, on en crée un par tâche ; pour limiter la concurrence on utilise un Semaphore.
  - key: pinning
    format: course
    question: C'est quoi le pinning ?
    answer: Un virtual thread qui reste attaché à son carrier pendant un appel natif ou, avant Java 24, un bloc synchronized.
  - key: synchronized-toujours-probleme-avec-virtual
    format: course
    question: synchronized est-il toujours un problème avec les virtual threads ?
    answer: Plus depuis Java 24 (JEP 491) ; sur Java 21 à 23, ReentrantLock évitait le pinning.
  - key: avec-virtual-threads-service-milliers-appels
    format: scenario
    question: Avec des virtual threads, ton service fait des milliers d'appels simultanés à une base qui sature.
    answer: |-
      C'est l'effet pervers classique : les virtual threads suppriment la limite naturelle qu'imposait la taille du pool de threads. Avant, 200 threads = au plus 200 requêtes concurrentes vers la base ; maintenant, des milliers.
      La limite doit être **explicite et placée devant la ressource** : la taille du pool de connexions JDBC en est déjà une (les virtual threads attendront une connexion), et pour une API externe sans pool, un `Semaphore` qui borne les appels simultanés.
      Je vérifierais aussi les timeouts d'acquisition de connexion pour échouer vite plutôt que d'empiler des attentes, et je surveillerais le nombre de threads en attente du pool. Les virtual threads changent le coût d'un thread, pas la capacité des systèmes en aval.
