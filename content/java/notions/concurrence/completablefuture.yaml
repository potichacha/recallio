notion: completablefuture
cards:
  - key: thenapply-vs-thencompose
    format: course
    question: thenApply vs thenCompose ?
    answer: thenApply transforme (map) ; thenCompose enchaîne un autre future (flatMap).
  - key: thencombine-vs-thencompose
    format: course
    question: thenCombine vs thenCompose ?
    answer: Combiner deux futures indépendants vs enchaîner un future qui dépend du résultat du précédent.
  - key: handle-vs-whencomplete-vs-exceptionally
    format: course
    question: handle vs whenComplete vs exceptionally ?
    answer: handle transforme résultat ou erreur ; whenComplete observe sans modifier ; exceptionally ne traite que l'erreur.
  - key: pool-utilisent-methodes-async-sans-executor
    format: course
    question: Quel pool utilisent les méthodes async sans executor ?
    answer: Le ForkJoinPool commun ; en production, passer un executor dédié.
  - key: get-vs-join-completablefuture
    format: course
    question: get() vs join() sur CompletableFuture ?
    answer: get lève des exceptions checked (ExecutionException, InterruptedException) ; join lève une CompletionException unchecked.
  - key: endpoint-5-appels-externes-200ms-chacun
    format: scenario
    question: Un endpoint fait 5 appels externes de 200ms chacun, la réponse met 1 seconde.
    answer: |-
      Les appels sont séquentiels alors qu'ils semblent indépendants. Je les parallélise avec des `CompletableFuture` lancés ensemble, puis `allOf` pour attendre. Le temps total passe de la somme au maximum, soit environ 200ms.
      Trois précautions. Vérifier qu'ils sont **vraiment indépendants** : si l'un consomme le résultat du précédent, on ne peut pas. Utiliser un **pool dédié** plutôt que le ForkJoinPool commun, pour ne pas impacter le reste. Et mettre un **timeout individuel** sur chaque appel, sinon un service lent bloque toute la réponse.
      Si le volume d'appels concurrents est élevé, les virtual threads de Java 21 simplifient encore le modèle.
