notion: completablefuture
lesson: |-
  Un **`CompletableFuture<T>`** est un futur qu'on peut **composer** : on décrit ce qui se passe quand le résultat
  arrive, sans bloquer.

  ```java
  ExecutorService es = ...;                                      // un pool dédié, pas le pool commun

  CompletableFuture<Profil> profil = CompletableFuture
          .supplyAsync(() -> clients.charger(id), es)            // lancer
          .thenApply(Client::profil)                             // transformer (map)
          .thenCompose(p -> enrichir(p))                         // enchaîner un autre futur (flatMap)
          .orTimeout(2, TimeUnit.SECONDS)                        // délai (Java 9)
          .exceptionally(e -> Profil.inconnu());                 // repli en cas d'erreur

  CompletableFuture<Prix> prix = supplyAsync(() -> tarifs.prix(ref), es);
  CompletableFuture<Stock> stock = supplyAsync(() -> stocks.stock(ref), es);
  CompletableFuture<Fiche> fiche = prix.thenCombine(stock, Fiche::new);   // deux résultats indépendants

  CompletableFuture.allOf(f1, f2, f3).join();                    // attendre plusieurs futurs
  ```

  | Méthode | Rôle |
  |---|---|
  | `supplyAsync`, `runAsync` | lancer une tâche (avec ou sans résultat) |
  | `thenApply` | transformer le résultat |
  | `thenAccept`, `thenRun` | consommer le résultat, enchaîner une action |
  | `thenCompose` | enchaîner une étape qui renvoie elle-même un `CompletableFuture` |
  | `thenCombine` | combiner deux futurs indépendants |
  | `allOf`, `anyOf` | attendre tous / le premier |
  | `exceptionally`, `handle`, `whenComplete` | traiter l'erreur, transformer résultat ou erreur, observer |
  | `orTimeout`, `completeOnTimeout` | délai, ou valeur par défaut à l'expiration |

  - Sans executor, les méthodes `Async` utilisent le **`ForkJoinPool` commun** : à éviter pour des entrées-sorties.
  - Une exception dans une étape **saute** les étapes suivantes jusqu'au premier `exceptionally`/`handle` ; `join()` la
    relance dans une `CompletionException`, `get()` dans une `ExecutionException`.
  - `thenApply` sans `Async` s'exécute dans le thread qui termine l'étape précédente (ou dans l'appelant si elle est déjà
    terminée).
  - Avec les **threads virtuels**, un code séquentiel bloquant est souvent plus lisible pour enchaîner des appels ;
    `CompletableFuture` reste utile pour lancer des appels en parallèle et les combiner.

  **Piège classique** : `thenApply(p -> enrichir(p))` quand `enrichir` renvoie un `CompletableFuture`. On obtient un
  `CompletableFuture<CompletableFuture<Profil>>` ; il faut `thenCompose`.

  **En entretien** : « `thenApply` transforme, `thenCompose` enchaîne, `thenCombine` combine, `allOf` attend tout ;
  `exceptionally` et `orTimeout` pour l'erreur et le délai ; et toujours un executor dédié pour les entrées-sorties. »
cards:
  - key: thenapply-vs-thencompose
    format: course
    question: "Quelle différence entre `thenApply` et `thenCompose` ?"
    choices:
      - {text: "`thenCompose` transforme le résultat (map) ; `thenApply` enchaîne un autre futur (flatMap)", correct: false}
      - {text: "`thenApply` s'exécute dans le thread appelant ; `thenCompose` dans le pool commun", correct: false}
      - {text: "`thenApply` attend deux futurs à la fois ; `thenCompose` n'en attend qu'un seul", correct: false}
      - {text: "`thenApply` transforme le résultat (map) ; `thenCompose` enchaîne un autre futur (flatMap)", correct: true}
    answer: "`thenApply(f)` applique une fonction au résultat ; si `f` renvoie elle-même un futur, on obtient un futur de futur. `thenCompose` l'aplatit : c'est le `flatMap` des futurs."
  - key: thencombine-vs-thencompose
    format: course
    question: "Quelle différence entre `thenCombine` et `thenCompose` ?"
    choices:
      - {text: "`thenCompose` combine deux futurs indépendants ; `thenCombine` lance un futur qui dépend du premier", correct: false}
      - {text: "`thenCombine` combine deux futurs indépendants ; `thenCompose` lance un futur qui dépend du premier", correct: true}
      - {text: "`thenCombine` garde le premier des deux futurs terminé ; `thenCompose` attend les deux", correct: false}
      - {text: "`thenCombine` s'exécute sans pool ; `thenCompose` exige toujours un executor dédié", correct: false}
    answer: "`thenCombine` attend deux futurs lancés indépendamment et combine leurs résultats ; `thenCompose` lance le second à partir du résultat du premier, quand il en dépend."
  - key: handle-vs-whencomplete-vs-exceptionally
    format: course
    question: "Quelle différence entre `handle`, `whenComplete` et `exceptionally` ?"
    choices:
      - {text: "`whenComplete` transforme résultat ou erreur ; `handle` observe sans modifier ; `exceptionally` ne traite que l'erreur", correct: false}
      - {text: "`handle` ne traite que l'erreur ; `whenComplete` transforme le résultat ; `exceptionally` observe sans modifier", correct: false}
      - {text: "`handle` transforme résultat ou erreur ; `whenComplete` observe sans modifier ; `exceptionally` ne traite que l'erreur", correct: true}
      - {text: "`exceptionally` transforme résultat ou erreur ; `handle` et `whenComplete` ne font qu'observer, sans modifier", correct: false}
    answer: "`handle((r, e) -> ...)` reçoit le résultat ou l'erreur et renvoie une nouvelle valeur ; `whenComplete` voit les deux mais rend le futur tel quel ; `exceptionally` n'est appelé qu'en cas d'erreur, pour la remplacer."
  - key: pool-utilisent-methodes-async-sans-executor
    format: course
    question: "Quel pool utilisent les méthodes `...Async` de `CompletableFuture` appelées sans executor ?"
    choices:
      - {text: "Un pool de threads virtuels, créé par la JVM depuis Java 21", correct: false}
      - {text: "Un nouveau thread de plateforme, créé pour chaque tâche", correct: false}
      - {text: "Le thread qui appelle la méthode, de façon synchrone", correct: false}
      - {text: "Le `ForkJoinPool` commun, partagé avec les streams parallèles", correct: true}
    answer: "Le `ForkJoinPool.commonPool()`, dimensionné sur le nombre de cœurs et partagé avec les streams parallèles. En production, on passe un executor dédié, surtout pour des entrées-sorties."
  - key: get-vs-join-completablefuture
    format: course
    question: "Quelle différence entre `get()` et `join()` sur un `CompletableFuture` ?"
    choices:
      - {text: "`join` lève des exceptions vérifiées (`ExecutionException`) ; `get` une `CompletionException` non vérifiée", correct: false}
      - {text: "`get` lève des exceptions vérifiées (`ExecutionException`) ; `join` une `CompletionException` non vérifiée", correct: true}
      - {text: "`join` n'attend pas : il renvoie `null` si le futur n'est pas encore terminé, `get` attend", correct: false}
      - {text: "`get` attend la fin du futur ; `join` attend en plus la fin de tous les futurs qui en dépendent", correct: false}
    answer: "Les deux attendent le résultat. `get` déclare `ExecutionException` et `InterruptedException`, vérifiées ; `join` enveloppe l'erreur dans une `CompletionException` non vérifiée, plus pratique dans une lambda."
  - key: vf-propagation
    format: true-false
    question: Une exception dans `supplyAsync` fait sauter les `thenApply` suivants jusqu'au premier `exceptionally`.
    truth: true
    answer: Les étapes de transformation ne s'exécutent pas sur un futur en échec.
  - key: vf-allof
    format: true-false
    question: "`CompletableFuture.allOf(f1, f2)` renvoie directement les deux résultats."
    truth: false
    answer: Il renvoie un `CompletableFuture<Void>` ; on lit ensuite `f1.join()` et `f2.join()`.
  - key: vf-timeout
    format: true-false
    question: "`completeOnTimeout(valeur, 1, SECONDS)` termine le futur avec `valeur` s'il n'a pas fini à temps."
    truth: true
    answer: Depuis Java 9 ; `orTimeout` le fait échouer avec une `TimeoutException`.
  - key: vf-pool-commun
    format: true-false
    question: Le pool commun convient bien aux appels réseau lancés par `supplyAsync`.
    truth: false
    answer: Il est dimensionné pour le calcul et partagé par toute la JVM.
  - key: qcm-choisir
    format: multiple-choice
    question: "`charger(id)` renvoie `CompletableFuture<Client>`. Comment enchaîner après `trouverId(email)`, qui renvoie aussi un `CompletableFuture<Long>` ?"
    choices:
      - text: "`trouverId(email).thenCompose(this::charger)`"
        correct: true
      - text: "`trouverId(email).thenApply(this::charger)`, qui donne un futur de futur"
        correct: false
      - text: "`trouverId(email).thenCombine(this::charger)`"
        correct: false
      - text: "`trouverId(email).join().charger()`"
        correct: false
    answer: '`thenCompose` aplatit le futur renvoyé.'
  - key: qcm-paralleles
    format: multiple-choice
    question: "Laquelle de ces écritures construit la fiche à partir de deux futurs `prixF` et `stockF`, lancés en parallèle ?"
    choices:
      - {text: "`prixF.thenCompose(p -> stockF)`, qui garde les deux résultats", correct: false}
      - {text: "`prixF.thenCombine(stockF, Fiche::new)`", correct: true}
      - {text: "`prixF.applyToEither(stockF, ...)`, qui attend les deux résultats", correct: false}
      - {text: "`new Fiche(prixF.get(), stockF.get())`, avant de lancer `stockF`", correct: false}
    answer: "`thenCombine` attend les deux résultats indépendants et les combine (`allOf` suivi de `join` marche aussi). `thenCompose` ne garde que le futur renvoyé, et `applyToEither` ne prend que le premier terminé."
  - key: qcm-erreur
    format: multiple-choice
    question: "Laquelle de ces écritures fournit une valeur de repli quand le futur échoue ?"
    choices:
      - {text: "`whenComplete((r, e) -> valeurParDefaut)`", correct: false}
      - {text: "`thenApply(r -> valeurParDefaut)`", correct: false}
      - {text: "`exceptionally(e -> valeurParDefaut)`", correct: true}
      - {text: "`thenAccept(r -> valeurParDefaut)`", correct: false}
    answer: "`exceptionally` (comme `handle`, qui reçoit aussi l'erreur) remplace l'échec par une valeur. `whenComplete` observe sans remplacer le résultat, et `thenApply` n'est pas appelé en cas d'erreur."
  - key: qcm-join
    format: multiple-choice
    question: Quelle exception relance `join()` si le futur a échoué ?
    choices:
      - text: "`CompletionException`, avec l'exception d'origine en cause"
        correct: true
      - text: "`ExecutionException`"
        correct: false
      - text: "L'exception d'origine, toujours sans enveloppe"
        correct: false
      - text: "Aucune, il renvoie `null`"
        correct: false
    answer: '`get()` relance une `ExecutionException`, vérifiée.'
  - key: trous-supply
    format: fill-in
    question: |-
      Complète pour lancer le calcul dans le pool dédié :
      ```java
      CompletableFuture<Prix> f = CompletableFuture.___(() -> calculerPrix(ref), executor);
      ```
    blanks: [[supplyAsync]]
    answer: '`supplyAsync` pour une tâche avec résultat.'
  - key: trous-compose
    format: fill-in
    question: |-
      Complète pour enchaîner un appel qui renvoie un futur :
      ```java
      CompletableFuture<Commande> c = trouverClient(id).___(client -> derniereCommande(client));
      ```
    blanks: [[thenCompose]]
    answer: '`thenCompose` évite un futur de futur.'
  - key: trous-exceptionally
    format: fill-in
    question: |-
      Complète le repli :
      ```java
      recommandations(id).___(e -> List.of());
      ```
    blanks: [[exceptionally]]
    answer: En cas d'erreur, une liste vide.
  - key: trous-allof
    format: fill-in
    question: |-
      Complète pour attendre tous les envois :
      ```java
      CompletableFuture.___(envois.toArray(CompletableFuture[]::new)).join();
      ```
    blanks: [[allOf]]
    answer: '`allOf` se termine quand tous les futurs sont terminés.'
  - key: code-chaine
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String r = CompletableFuture.supplyAsync(() -> 20)
              .thenApply(x -> x + 1)
              .thenCompose(x -> CompletableFuture.supplyAsync(() -> x * 2))
              .thenApply(x -> "résultat " + x)
              .join();
      System.out.println(r);
      ```
    choices:
      - {text: "`résultat 41`", correct: false}
      - {text: "`résultat 40`", correct: false}
      - {text: "`résultat 21`", correct: false}
      - {text: "`résultat 42`", correct: true}
    answer: "`résultat 42` : 20, puis 21 avec `thenApply`, puis 42 avec `thenCompose`, qui aplatit le futur renvoyé, enfin la chaîne."
    check:
      output: "résultat 42"
  - key: code-combine
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      CompletableFuture<Integer> a = CompletableFuture.supplyAsync(() -> 3);
      CompletableFuture<Integer> b = CompletableFuture.supplyAsync(() -> 4);
      System.out.println(a.thenCombine(b, (x, y) -> x * y).join());
      ```
    choices:
      - {text: "`12`", correct: true}
      - {text: "`7`", correct: false}
      - {text: "`34`", correct: false}
      - {text: "`3`", correct: false}
    answer: "`12` : `thenCombine` attend les deux futurs et passe leurs résultats, 3 et 4, à la fonction."
    check:
      output: "12"
  - key: code-exceptionally
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int r = CompletableFuture.supplyAsync(() -> Integer.parseInt("x"))
              .thenApply(x -> { System.out.println("jamais"); return x; })
              .exceptionally(e -> -1)
              .join();
      System.out.println(r);
      ```
    choices:
      - text: |-
          ```
          jamais
          -1
          ```
        correct: false
      - {text: "Une `NumberFormatException`", correct: false}
      - {text: "Une `CompletionException`", correct: false}
      - {text: "`-1`", correct: true}
    answer: "`-1` : l'échec saute l'étape `thenApply` jusqu'à `exceptionally`, qui remplace l'erreur par `-1` ; `join` ne lève donc rien."
    check:
      output: "-1"
  - key: code-timeout
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      CompletableFuture<String> lent = new CompletableFuture<>();       // ne se termine jamais
      System.out.println(lent.completeOnTimeout("par défaut", 100, TimeUnit.MILLISECONDS).join());
      ```
    choices:
      - {text: "Rien : `join()` attend pour toujours", correct: false}
      - {text: "`par défaut`", correct: true}
      - {text: "Une `TimeoutException`", correct: false}
      - {text: "`null`", correct: false}
    answer: "`par défaut` : `completeOnTimeout` termine le futur avec cette valeur si rien n'arrive avant 100 ms. C'est `orTimeout` qui le ferait échouer avec une `TimeoutException`."
    check:
      output: "par défaut"
  - key: bug-apply-futur
    format: bug-fix
    question: |-
      Ce code ne compile pas : le type n'est pas celui attendu. Quelle correction est la bonne ?
      ```java
      CompletableFuture<Profil> p = chargerClient(id).thenApply(c -> chargerProfil(c));   // chargerProfil renvoie CompletableFuture<Profil>
      ```
    choices:
      - {text: "Remplacer `thenApply` par `thenCombine`", correct: false}
      - {text: "Remplacer `thenApply` par `thenApplyAsync`", correct: false}
      - {text: "Remplacer `thenApply` par `thenAccept`", correct: false}
      - {text: "Remplacer `thenApply` par `thenCompose`", correct: true}
    answer: |-
      ```java
      CompletableFuture<Profil> p = chargerClient(id).thenCompose(c -> chargerProfil(c));
      ```
      `thenApply` donnait un `CompletableFuture<CompletableFuture<Profil>>`. `thenCompose` aplatit l'étape asynchrone.
  - key: bug-pool-commun
    format: bug-fix
    question: |-
      Depuis l'ajout de ces appels, les streams parallèles de l'application sont devenus très lents. Pourquoi ?
      ```java
      CompletableFuture.supplyAsync(() -> api.appeler(requete));
      ```
    choices:
      - {text: "`supplyAsync` crée un thread de plateforme par appel, ce qui sature le processeur", correct: false}
      - {text: "Les streams parallèles attendent la fin de chaque `CompletableFuture` avant de démarrer", correct: false}
      - {text: "Sans executor, l'appel bloquant occupe un thread du `ForkJoinPool` commun, partagé avec les streams", correct: true}
      - {text: "`supplyAsync` exécute l'appel dans le thread appelant, qui bloque alors le stream", correct: false}
    answer: |-
      ```java
      private final ExecutorService appelsExternes = Executors.newVirtualThreadPerTaskExecutor();
      CompletableFuture.supplyAsync(() -> api.appeler(requete), appelsExternes);
      ```
      Sans executor, l'appel bloquant occupe un thread du pool ForkJoin commun, partagé avec les streams parallèles. Un
      executor dédié isole les entrées-sorties.
  - key: bug-join-sequentiel
    format: bug-fix
    question: |-
      Cet agrégateur n'est pas plus rapide que la version séquentielle. Pourquoi ?
      ```java
      Prix p = supplyAsync(this::prix, es).join();
      Stock s = supplyAsync(this::stock, es).join();
      return new Fiche(p, s);
      ```
    choices:
      - {text: "L'executor `es` n'a qu'un thread, puisque les tâches arrivent l'une après l'autre", correct: false}
      - {text: "Chaque `join()` attend la fin de l'appel avant que le suivant soit lancé", correct: true}
      - {text: "`supplyAsync` exécute la tâche dans le thread appelant quand on lui passe un executor", correct: false}
      - {text: "`join()` attend aussi la fin de toutes les autres tâches en cours dans `es`", correct: false}
    answer: |-
      ```java
      CompletableFuture<Prix> p = supplyAsync(this::prix, es);
      CompletableFuture<Stock> s = supplyAsync(this::stock, es);
      return p.thenCombine(s, Fiche::new).join();
      ```
      Chaque `join()` attendait avant de lancer l'appel suivant. On lance tout, puis on combine.
  - key: bug-erreur-silencieuse
    format: bug-fix
    question: |-
      L'envoi des notifications échoue parfois sans aucune trace. Quelle correction est la bonne ?
      ```java
      CompletableFuture.runAsync(() -> notifier(client), es);
      ```
    choices:
      - {text: "Remplacer `runAsync` par `supplyAsync`, qui relance les exceptions", correct: false}
      - {text: "Ajouter un `whenComplete` qui journalise l'erreur quand elle est présente", correct: true}
      - {text: "Retirer l'executor `es`, pour que le pool commun journalise les erreurs", correct: false}
      - {text: "Entourer l'appel à `runAsync` d'un `try`/`catch (Exception e)`", correct: false}
    answer: |-
      ```java
      CompletableFuture.runAsync(() -> notifier(client), es)
              .whenComplete((ok, erreur) -> {
                  if (erreur != null) log.error("notification de {} en échec", client.id(), erreur);
              });
      ```
      Un futur que personne ne lit garde son exception pour lui. `whenComplete` (ou `exceptionally`) la journalise.
  - key: endpoint-5-appels-externes-200ms-chacun
    format: scenario
    question: "Un endpoint fait 5 appels externes de 200 ms chacun, et met 1 seconde à répondre. Que fais-tu ?"
    choices:
      - {text: "Je lance chaque appel avec `supplyAsync(...).join()`, l'un après l'autre, dans le pool commun", correct: false}
      - {text: "J'augmente le nombre de threads du serveur HTTP qui reçoit les requêtes de l'endpoint", correct: false}
      - {text: "Je lance ensemble les appels indépendants, sur un pool dédié, chacun avec un délai, puis `allOf`", correct: true}
      - {text: "Je lance les 5 appels en parallèle sur le pool commun, sans délai, et j'attends le dernier", correct: false}
    answer: "Les appels sont séquentiels alors qu'ils semblent indépendants : lancés ensemble puis attendus avec `allOf`, ils prennent le maximum (200 ms) au lieu de la somme. Je vérifie qu'ils sont vraiment indépendants, j'utilise un pool dédié, et un délai par appel, pour qu'un service lent ne bloque pas toute la réponse."
  - key: scenario-degradation
    format: scenario
    question: Une page produit agrège le prix (indispensable), le stock (indispensable) et les avis (facultatifs). Comment gères-tu les pannes ?
    choices:
      - {text: "Appels parallèles avec délais ; un repli vide pour les trois, pour que la page n'échoue jamais", correct: false}
      - {text: "Appels l'un après l'autre, le prix d'abord, et une erreur 500 dès que l'un des trois échoue", correct: false}
      - {text: "Appels parallèles sans délai ; la page attend les avis autant que le prix et le stock", correct: false}
      - {text: "Appels parallèles avec délais ; repli vide pour les avis, échec clair pour le prix et le stock", correct: true}
    answer: "Les trois appels partent en parallèle sur un executor dédié, chacun avec un délai. Les avis ont un repli (`completeOnTimeout(List.of(), ...)` puis `exceptionally`), journalisé ; le prix et le stock n'en ont pas de silencieux : la page échoue clairement (ou sert un cache récent si le métier l'accepte). Je mesure le taux de replis par service."
  - key: scenario-virtuels
    format: scenario
    question: Avec les threads virtuels, faut-il encore utiliser `CompletableFuture` ?
    choices:
      - {text: "Non : les threads virtuels la rendent inutile, et elle ne fonctionne plus avec eux", correct: false}
      - {text: "Oui, partout : les threads virtuels ne servent qu'à remplacer le pool commun", correct: false}
      - {text: "Moins : un code bloquant dans un thread virtuel est plus lisible ; elle reste utile pour combiner", correct: true}
      - {text: "Oui : un thread virtuel ne peut pas bloquer sur une entrée-sortie, un futur si", correct: false}
    answer: "Moins qu'avant : pour des appels qui dépendent les uns des autres, un code séquentiel dans un thread virtuel se lit et se débogue mieux qu'une chaîne de `thenCompose`. `CompletableFuture` reste pratique pour combiner des appels indépendants ou s'interfacer avec des API asynchrones ; `StructuredTaskScope` (préversion en Java 25) vise ce dernier usage."
  - key: scenario-retry
    format: scenario
    question: Comment ajoutes-tu des réessais à un appel asynchrone qui échoue parfois ?
    choices:
      - {text: "Réessayer toute erreur aussitôt, en boucle, jusqu'à ce que l'appel finisse par réussir", correct: false}
      - {text: "Réessayer chaque appel trois fois sans délai, qu'il soit idempotent ou non", correct: false}
      - {text: "Ne jamais réessayer : un appel asynchrone qui échoue doit remonter l'erreur tout de suite", correct: false}
      - {text: "Réessayer les seules erreurs transitoires d'opérations idempotentes, en nombre borné, avec backoff", correct: true}
    answer: "Seulement les erreurs transitoires (délai, 503) et les opérations idempotentes, avec un nombre d'essais borné et un délai croissant (backoff exponentiel avec du hasard) : `exceptionallyCompose` et `delayedExecutor` le permettent. En pratique, une bibliothèque de résilience (Resilience4j, SmallRye Fault Tolerance) combine réessais, délais et coupe-circuit."
