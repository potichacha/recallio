notion: callable-future
lesson: |-
  Un **`Callable<V>`** est une tâche qui **renvoie une valeur** et peut lever une **exception vérifiée** (contrairement à
  `Runnable`). La soumettre à un pool donne un **`Future<V>`**, une poignée sur le résultat à venir.

  ```java
  Future<Rapport> f = pool.submit(() -> genererRapport());      // Callable<Rapport>

  // ... faire autre chose ...

  try {
      Rapport r = f.get(5, TimeUnit.SECONDS);                     // attend, au plus 5 s
  } catch (ExecutionException e) {
      Throwable cause = e.getCause();                             // l'exception levée par la tâche
  } catch (TimeoutException e) {
      f.cancel(true);                                             // interrompt la tâche
  } catch (InterruptedException e) {
      Thread.currentThread().interrupt();
  }

  List<Future<Prix>> resultats = pool.invokeAll(taches);         // attend toutes les tâches
  Prix premier = pool.invokeAny(taches);                          // le premier résultat réussi
  ```

  - `get()` **bloque** jusqu'au résultat ; sans délai, il peut attendre indéfiniment. On passe un **délai**.
  - Une exception levée par la tâche est **conservée** dans le `Future` et relancée à `get()`, enveloppée dans une
    **`ExecutionException`**. Si personne n'appelle `get()`, elle est **perdue** silencieusement.
  - `cancel(true)` interrompt la tâche si elle a commencé (elle doit réagir à l'interruption) ; `isDone()`,
    `isCancelled()` donnent l'état.
  - Java 19 a ajouté `resultNow()`, `exceptionNow()` et `state()` pour les futures déjà terminés.
  - `Future` ne se **compose** pas (pas de « puis faire ceci ») : pour enchaîner des traitements asynchrones, on utilise
    `CompletableFuture`.

  **Piège classique** : `pool.submit(tache);` sans jamais lire le `Future`. Si la tâche échoue, l'exception disparaît :
  aucun log, aucune alerte.

  **En entretien** : « `Callable` renvoie une valeur et peut lever une exception ; le `Future` la conserve et la relance à
  `get()` dans une `ExecutionException`. Je mets toujours un délai à `get`, et j'utilise `CompletableFuture` pour composer. »
cards:
  - key: runnable-vs-callable
    format: course
    question: "Quelle différence entre `Runnable` et `Callable` ?"
    choices:
      - {text: "`Callable` renvoie une valeur et peut lever une exception vérifiée ; `Runnable` non", correct: true}
      - {text: "`Runnable` renvoie une valeur et peut lever une exception vérifiée ; `Callable` non", correct: false}
      - {text: "`Callable` s'exécute dans un thread virtuel, `Runnable` dans un thread de plateforme", correct: false}
      - {text: "`Callable` se passe seulement à `execute`, `Runnable` seulement à `submit`", correct: false}
    answer: "`Callable<V>.call()` renvoie un `V` et déclare `throws Exception` ; `Runnable.run()` ne renvoie rien et ne lève que des exceptions non vérifiées. Les deux se soumettent à un `ExecutorService`."
  - key: devient-exception-tache-soumise-submit
    format: course
    question: "Que devient une exception levée par une tâche soumise avec `submit` ?"
    choices:
      - {text: "Elle remonte dans le thread qui a appelé `submit`, à la ligne de l'appel", correct: false}
      - {text: "Elle est gardée dans le `Future`, et relevée par `get()` dans une `ExecutionException`", correct: true}
      - {text: "Elle est passée à l'`UncaughtExceptionHandler`, qui l'affiche sur la sortie d'erreur", correct: false}
      - {text: "Elle arrête le pool, qui refuse ensuite toute nouvelle tâche soumise", correct: false}
    answer: "Elle est stockée dans le `Future` et relevée, enveloppée dans une `ExecutionException`, au `get()` ; sans `get()`, elle est perdue. C'est `execute` qui la passerait à l'`UncaughtExceptionHandler`."
  - key: get-delai
    format: course
    question: Pourquoi passer un délai à `Future.get` ?
    choices:
      - {text: "Sans délai, `get()` renvoie `null` tout de suite si la tâche n'est pas finie", correct: false}
      - {text: "Le délai borne la durée de la tâche, qui est arrêtée quand il expire", correct: false}
      - {text: "Sans délai, `get()` peut bloquer pour toujours si la tâche ne se termine jamais", correct: true}
      - {text: "Sans délai, `get()` lève une `TimeoutException` au bout de 30 secondes", correct: false}
    answer: "Sans délai, `get()` peut bloquer indéfiniment si la tâche ne se termine jamais (service distant bloqué, interblocage). Le délai borne l'attente, pas la tâche : il faut encore `cancel(true)` pour l'arrêter."
  - key: invoke
    format: course
    question: Que font `invokeAll` et `invokeAny` ?
    choices:
      - {text: "`invokeAll` renvoie le premier succès et annule les autres ; `invokeAny` attend la fin de toutes les tâches", correct: false}
      - {text: "`invokeAll` lance les tâches l'une après l'autre ; `invokeAny` les lance toutes en parallèle", correct: false}
      - {text: "`invokeAll` attend la fin de toutes les tâches ; `invokeAny` renvoie le premier succès et annule les autres", correct: true}
      - {text: "`invokeAll` ne renvoie rien ; `invokeAny` renvoie la liste des résultats déjà disponibles", correct: false}
    answer: '`invokeAll` exécute une liste de tâches et attend qu''elles soient toutes terminées ; `invokeAny` renvoie le résultat de la première tâche réussie et annule les autres.'
  - key: vf-exception-checked
    format: true-false
    question: Un `Callable` peut lever une exception vérifiée.
    truth: true
    answer: '`call()` déclare `throws Exception`.'
  - key: vf-get-bloque
    format: true-false
    question: "`Future.get()` sans argument rend la main immédiatement si la tâche n'est pas finie."
    truth: false
    answer: Il bloque jusqu'à la fin de la tâche.
  - key: vf-cancel
    format: true-false
    question: "`cancel(true)` arrête de force une tâche qui ne vérifie jamais l'interruption."
    truth: false
    answer: Il interrompt le thread ; la tâche doit réagir à l'interruption.
  - key: vf-compose
    format: true-false
    question: "`Future` permet d'enchaîner un traitement à la fin de la tâche, sans bloquer."
    truth: false
    answer: Il faut bloquer avec `get()` ; `CompletableFuture` permet de composer.
  - key: qcm-exception
    format: multiple-choice
    question: "Une tâche lève `IOException`. Que lève `future.get()` ?"
    choices:
      - {text: "L'`IOException` elle-même, relancée telle quelle par `get()`", correct: false}
      - {text: "Une `RuntimeException` qui enveloppe l'`IOException`", correct: false}
      - {text: "Une `ExecutionException` dont la cause est l'`IOException`", correct: true}
      - {text: "Rien : `get()` renvoie `null` et l'erreur est perdue", correct: false}
    answer: '`getCause()` donne l''exception d''origine.'
  - key: qcm-perdue
    format: multiple-choice
    question: "Laquelle de ces pratiques évite qu'une erreur d'une tâche soumise par `submit` passe inaperçue ?"
    choices:
      - {text: "Attraper et journaliser l'exception dans la tâche elle-même", correct: true}
      - {text: "Soumettre la tâche une seconde fois si la première a échoué", correct: false}
      - {text: "Augmenter la taille du pool, pour absorber les erreurs", correct: false}
      - {text: "Déclarer la tâche comme un `Runnable` plutôt qu'un `Callable`", correct: false}
    answer: "Une tâche qui attrape et journalise ses exceptions ne perd rien ; lire chaque `Future` avec `get()`, ou `CompletableFuture.whenComplete`, marche aussi. Un `Runnable` soumis par `submit` garde lui aussi son exception dans le `Future`."
  - key: qcm-timeout
    format: multiple-choice
    question: "Que lève `f.get(1, SECONDS)` si la tâche n'a pas fini à temps ?"
    choices:
      - text: "`TimeoutException`"
        correct: true
      - text: "`InterruptedException`"
        correct: false
      - text: "`CancellationException`"
        correct: false
      - text: "Rien, il renvoie `null`"
        correct: false
    answer: La tâche continue ; on peut l'annuler avec `cancel(true)`.
  - key: qcm-premier
    format: multiple-choice
    question: Trois serveurs miroirs peuvent répondre ; on veut la première réponse réussie. Que choisir ?
    choices:
      - text: "`pool.invokeAny(taches)`"
        correct: true
      - text: "`pool.invokeAll(taches)`"
        correct: false
      - text: "Trois `get()` successifs"
        correct: false
      - text: "`pool.execute(taches)`"
        correct: false
    answer: '`invokeAny` annule les tâches restantes.'
  - key: trous-get
    format: fill-in
    question: |-
      Complète pour attendre le résultat au plus 2 secondes :
      ```java
      Prix prix = futur.___(2, TimeUnit.SECONDS);
      ```
    blanks: [[get]]
    answer: Un délai évite de bloquer indéfiniment.
  - key: trous-cause
    format: fill-in
    question: |-
      Complète pour retrouver l'exception levée par la tâche :
      ```java
      } catch (ExecutionException e) {
          Throwable origine = e.___();
      }
      ```
    blanks: [[getCause]]
    answer: L'exception de la tâche est la cause de l'`ExecutionException`.
  - key: trous-cancel
    format: fill-in
    question: |-
      Complète pour interrompre la tâche trop lente :
      ```java
      } catch (TimeoutException e) {
          futur.___(true);
      }
      ```
    blanks: [[cancel]]
    answer: '`true` interrompt le thread si la tâche a commencé.'
  - key: trous-callable
    format: fill-in
    question: |-
      Complète le type de la tâche qui renvoie un résultat :
      ```java
      ___<Integer> tache = () -> compterLignes(fichier);
      ```
    blanks: [[Callable]]
    answer: '`Callable` renvoie une valeur et peut lever une exception vérifiée.'
  - key: code-get
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      try (ExecutorService pool = Executors.newFixedThreadPool(2)) {
          Future<Integer> f = pool.submit(() -> 6 * 7);
          System.out.println(f.get() + " " + f.isDone());
      }
      ```
    choices:
      - {text: "`42 true`", correct: true}
      - {text: "`42 false`", correct: false}
      - {text: "`null true`", correct: false}
      - {text: "`null false`", correct: false}
    answer: "`42 true` : `get()` attend la fin de la tâche et renvoie son résultat ; après lui, `isDone()` vaut forcément `true`."
    check:
      output: "42 true"
  - key: code-execution-exception
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      try (ExecutorService pool = Executors.newSingleThreadExecutor()) {
          Future<Integer> f = pool.submit(() -> Integer.parseInt("abc"));
          try {
              f.get();
          } catch (ExecutionException e) {
              System.out.println(e.getCause().getClass().getSimpleName());
          }
      }
      ```
    choices:
      - {text: "`ExecutionException`", correct: false}
      - {text: "`IllegalArgumentException`", correct: false}
      - {text: "`NumberFormatException`", correct: true}
      - {text: "`RuntimeException`", correct: false}
    answer: "`NumberFormatException` : `get()` lève une `ExecutionException` dont la cause est l'exception d'origine de la tâche."
    check:
      output: "NumberFormatException"
  - key: code-invoke-all
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      try (ExecutorService pool = Executors.newFixedThreadPool(3)) {
          List<Callable<Integer>> taches = List.of(() -> 1, () -> 2, () -> 3);
          int total = 0;
          for (Future<Integer> f : pool.invokeAll(taches)) total += f.get();
          System.out.println(total);
      }
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "`3`", correct: false}
    answer: '`6` : `invokeAll` renvoie les futures dans l''ordre des tâches, toutes terminées.'
    check:
      output: "6"
  - key: code-result-now
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      try (ExecutorService pool = Executors.newSingleThreadExecutor()) {
          Future<String> f = pool.submit(() -> "ok");
          f.get();
          System.out.println(f.state() + " " + f.resultNow());
      }
      ```
    choices:
      - {text: "`DONE ok`", correct: false}
      - {text: "`SUCCESS ok`", correct: true}
      - {text: "`COMPLETED ok`", correct: false}
      - {text: "`SUCCESS Optional[ok]`", correct: false}
    answer: "`SUCCESS ok` : depuis Java 19, `state()` renvoie l'état du `Future` (`SUCCESS` ici) et `resultNow()` son résultat, sans attendre ni exception vérifiée."
    check:
      output: "SUCCESS ok"
  - key: bug-future-ignore
    format: bug-fix
    question: |-
      Des imports échouent sans aucune trace dans les logs. Pourquoi ?
      ```java
      for (Fichier f : fichiers) {
          pool.submit(() -> importer(f));
      }
      ```
    choices:
      - {text: "Le pool journalise les exceptions vérifiées, mais avale les exceptions non vérifiées", correct: false}
      - {text: "La boucle soumet trop vite, et le pool rejette les dernières tâches sans rien dire", correct: false}
      - {text: "Le niveau de log des threads du pool est réglé sur `ERROR`, qui masque les traces", correct: false}
      - {text: "L'exception reste dans un `Future` que personne ne lit, et `submit` ne la journalise pas", correct: true}
    answer: |-
      ```java
      for (Fichier f : fichiers) {
          pool.submit(() -> {
              try {
                  importer(f);
              } catch (Exception e) {
                  log.error("échec de l'import de {}", f.nom(), e);
              }
          });
      }
      ```
      L'exception restait dans un `Future` que personne ne lisait. On la journalise dans la tâche (ou on lit les futures,
      ou on passe à `CompletableFuture` avec `whenComplete`).
  - key: bug-get-sans-delai
    format: bug-fix
    question: |-
      Une requête reste bloquée indéfiniment quand le service de stock ne répond plus. Quelle correction est la bonne ?
      ```java
      Stock s = pool.submit(() -> clientStock.consulter(ref)).get();
      ```
    choices:
      - {text: "`get()` dans un `catch (InterruptedException e)` qui renvoie un stock vide", correct: false}
      - {text: "`isDone()` testé avant `get()`, pour n'attendre que si la tâche a fini", correct: false}
      - {text: "`get(2, TimeUnit.SECONDS)`, puis `cancel(true)` sur `TimeoutException`", correct: true}
      - {text: "Un pool plus grand, pour qu'un autre thread prenne le relais de l'appel", correct: false}
    answer: |-
      ```java
      Future<Stock> f = pool.submit(() -> clientStock.consulter(ref));
      try {
          Stock s = f.get(2, TimeUnit.SECONDS);
      } catch (TimeoutException e) {
          f.cancel(true);
          throw new StockIndisponibleException(ref, e);
      }
      ```
      `get()` sans délai attend pour toujours. Un délai borne l'attente, et l'annulation libère le thread. (Le client
      HTTP doit aussi avoir ses propres délais.)
  - key: bug-get-sequentiel
    format: bug-fix
    question: |-
      Ces trois appels « parallèles » prennent la somme de leurs durées. Pourquoi ?
      ```java
      Prix p = pool.submit(this::prix).get();
      Stock s = pool.submit(this::stock).get();
      Avis a = pool.submit(this::avis).get();
      ```
    choices:
      - {text: "Le pool n'a qu'un thread par défaut, quel que soit le nombre de tâches", correct: false}
      - {text: "Les références de méthode `this::prix` s'exécutent dans le thread appelant", correct: false}
      - {text: "Chaque `get()` attend la fin de sa tâche avant que la suivante soit soumise", correct: true}
      - {text: "`submit` exécute la tâche tout de suite dans le thread appelant, puis rend la main", correct: false}
    answer: |-
      ```java
      Future<Prix> fp = pool.submit(this::prix);
      Future<Stock> fs = pool.submit(this::stock);
      Future<Avis> fa = pool.submit(this::avis);
      Prix p = fp.get(); Stock s = fs.get(); Avis a = fa.get();
      ```
      Chaque `get()` attendait la fin de la tâche avant de soumettre la suivante. On soumet tout, puis on attend.
  - key: bug-interrupted
    format: bug-fix
    question: |-
      Ton collègue te demande d'améliorer cette gestion des exceptions. Quelle version est la bonne ?
      ```java
      try {
          return f.get(1, SECONDS);
      } catch (Exception e) {
          return null;
      }
      ```
    choices:
      - {text: "Garder `catch (Exception e)`, mais journaliser `e` avant de renvoyer `null`", correct: false}
      - {text: "Remplacer `return null` par `throw new RuntimeException(e)`, pour tous les cas", correct: false}
      - {text: "Ajouter `finally { f.cancel(true); }` et garder le `return null` du `catch`", correct: false}
      - {text: "Un `catch` par cas : réinterrompre, relancer la cause, annuler quand le délai est dépassé", correct: true}
    answer: |-
      ```java
      try {
          return f.get(1, SECONDS);
      } catch (InterruptedException e) {
          Thread.currentThread().interrupt();
          throw new IllegalStateException("attente interrompue", e);
      } catch (ExecutionException e) {
          throw new IllegalStateException("la tâche a échoué", e.getCause());
      } catch (TimeoutException e) {
          f.cancel(true);
          throw new IllegalStateException("délai dépassé", e);
      }
      ```
      Un `catch (Exception)` qui renvoie `null` cache l'erreur, perd l'interruption et laisse tourner la tâche. Chaque
      cas a son traitement.
  - key: taches-soumises-executorservice-echouent-sans
    format: scenario
    question: "Des tâches soumises à un `ExecutorService` échouent sans aucune trace dans les logs. Que fais-tu ?"
    choices:
      - {text: "J'installe `Thread.setDefaultUncaughtExceptionHandler`, qui recevra désormais l'exception", correct: false}
      - {text: "Je fais traiter l'erreur : `get()` sur chaque `Future`, ou un `try`/`catch` qui journalise dans la tâche", correct: true}
      - {text: "J'augmente la taille du pool, pour que les tâches n'échouent plus faute de thread libre", correct: false}
      - {text: "Je passe le niveau de log à `DEBUG`, pour voir les erreurs que le pool masque d'habitude", correct: false}
    answer: "Avec `submit`, l'exception reste dans le `Future`, que personne ne lit : ni les logs ni l'`UncaughtExceptionHandler` ne la voient. On lit les futures, on journalise dans la tâche (ou par `whenComplete`, `afterExecute`), et on nomme les threads pour savoir d'où vient l'erreur."
  - key: scenario-lot
    format: scenario
    question: Tu dois traiter 10 000 fichiers en parallèle et produire un rapport des succès et des échecs. Comment organises-tu le code ?
    choices:
      - {text: "Un `parallelStream()` sur les 10 000 fichiers, qui s'arrête à la première exception levée", correct: false}
      - {text: "10 000 threads de plateforme, un par fichier, lancés tous ensemble pour aller plus vite", correct: false}
      - {text: "Une tâche `Callable` par fichier, qui attrape ses erreurs et renvoie son résultat, sur un pool adapté", correct: true}
      - {text: "Un seul `Runnable` qui traite les fichiers en boucle et s'arrête au premier échec", correct: false}
    answer: "Un pool dimensionné selon le traitement, une `Callable<Resultat>` par fichier qui attrape ses propres exceptions (un fichier défectueux n'arrête pas les autres), puis le rapport construit à partir des futures. Avec beaucoup de tâches, je borne celles en vol (file bornée ou sémaphore) et je respecte l'interruption."
  - key: scenario-timeout-global
    format: scenario
    question: Une page agrège trois services ; elle doit répondre en moins d'une seconde, même si un service est lent. Comment ?
    choices:
      - {text: "Les trois appels en parallèle, puis un `get()` sans délai sur chacun, l'un après l'autre", correct: false}
      - {text: "Les trois appels en parallèle, chacun avec un délai et une valeur de repli (`completeOnTimeout`)", correct: true}
      - {text: "Les trois appels l'un après l'autre, avec un délai d'une seconde sur chacun d'eux", correct: false}
      - {text: "Un cache devant chaque service, et une erreur 504 dès que l'un d'eux est lent", correct: false}
    answer: "Les trois appels partent en parallèle, chacun avec son délai (client HTTP et attente du résultat) et une valeur de repli pour les données facultatives : `completeOnTimeout(defaut, 800, MILLISECONDS)` le dit directement. La page répond dans le délai, dégradée si besoin, et je mesure le taux de replis."
  - key: scenario-annulation
    format: scenario
    question: Un utilisateur annule une génération de rapport longue. Comment l'arrêter réellement ?
    choices:
      - {text: "`cancel(true)` sur son `Future`, et une tâche qui teste l'interruption et s'arrête proprement", correct: true}
      - {text: "`cancel(false)` sur son `Future`, qui arrête la tâche à la prochaine instruction", correct: false}
      - {text: "`cancel(true)` sur son `Future` : l'interruption arrête la tâche, où qu'elle en soit", correct: false}
      - {text: "`shutdownNow()` sur le pool, qui tue de force le thread qui exécute la tâche", correct: false}
    answer: "`cancel(true)` interrompt le thread, mais la tâche doit coopérer : tester `isInterrupted()` entre deux lots, réagir aux `InterruptedException`, puis s'arrêter proprement (ressources fermées, fichier partiel supprimé). Sans cette coopération, elle continue après l'annulation."
