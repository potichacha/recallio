notion: reactif-principe
cards:
  - key: apporte-programmation-reactive
    format: course
    question: Qu'apporte la programmation réactive ?
    answer: Un modèle non bloquant qui sert beaucoup de requêtes avec peu de threads, et une backpressure native.
  - key: backpressure
    format: course
    question: C'est quoi la backpressure ?
    answer: Le mécanisme par lequel le consommateur demande au producteur un nombre limité d'éléments (request(n)).
  - key: utiliser-jpa-avec-webflux
    format: course
    question: Peut-on utiliser JPA avec WebFlux ?
    answer: Pas correctement, JPA est bloquant ; utiliser R2DBC ou isoler les appels.
