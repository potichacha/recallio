notion: wait-notify
cards:
  - key: appeler-wait-boucle
    format: course
    question: Pourquoi appeler wait() dans une boucle ?
    answer: À cause des réveils intempestifs et parce que la condition a pu changer entre la notification et le réveil.
  - key: sleep-vs-wait
    format: course
    question: sleep vs wait ?
    answer: sleep garde les verrous ; wait relâche le moniteur. wait doit être appelé en détenant le moniteur.
  - key: notify-vs-notifyall
    format: course
    question: notify vs notifyAll ?
    answer: Réveille un thread arbitraire vs tous les threads en attente ; notifyAll est plus sûr si plusieurs conditions partagent le même moniteur.
