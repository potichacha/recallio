notion: wait-notify
lesson: |-
  `wait`, `notify` et `notifyAll` (méthodes d'`Object`) permettent à un thread d'**attendre une condition** qu'un autre
  thread rendra vraie. C'est le mécanisme bas niveau sur lequel reposent les files bloquantes.

  ```java
  class Boite<T> {
      private T contenu;

      synchronized void deposer(T valeur) throws InterruptedException {
          while (contenu != null) {
              wait();                      // relâche le moniteur et attend
          }
          contenu = valeur;
          notifyAll();                     // réveille les threads en attente
      }

      synchronized T prendre() throws InterruptedException {
          while (contenu == null) {
              wait();
          }
          T v = contenu;
          contenu = null;
          notifyAll();
          return v;
      }
  }
  ```

  Règles :
  - on appelle `wait`/`notify` **en détenant le moniteur** de l'objet (dans un bloc `synchronized` sur lui), sinon
    `IllegalMonitorStateException` ;
  - `wait()` **relâche** le moniteur pendant l'attente et le reprend avant de revenir ;
  - on teste toujours la condition dans une **boucle `while`**, jamais un `if` : un thread peut se réveiller sans
    notification (*spurious wakeup*), ou la condition a pu changer entre la notification et son réveil ;
  - **`notifyAll`** est plus sûr que `notify` quand plusieurs conditions partagent le même moniteur : `notify` peut
    réveiller un thread qui attend une autre condition.

  En pratique, on n'écrit presque plus ce code : **`BlockingQueue`**, `CountDownLatch`, `Semaphore` ou un
  `ReentrantLock` avec des `Condition` séparées font cela plus clairement.

  **Piège classique** : `if (contenu == null) wait();`. Après un réveil intempestif, ou si un autre thread a pris la valeur
  entre-temps, le thread continue avec une condition fausse.

  **En entretien** : « `wait` dans une boucle `while`, en détenant le moniteur, qu'il relâche ; `notifyAll` par défaut. Et
  en vrai, une `BlockingQueue`. »
cards:
  - key: appeler-wait-boucle
    format: course
    question: "Pourquoi appeler `wait()` dans une boucle ?"
    choices:
      - {text: "À cause des réveils intempestifs, et parce que la condition a pu changer avant le réveil", correct: true}
      - {text: "Parce que `wait()` rend la main au bout d'une seconde, et qu'il faut recommencer", correct: false}
      - {text: "Parce que le compilateur refuse un `wait()` placé hors d'une boucle", correct: false}
      - {text: "Pour garder le moniteur pendant toute l'attente, entre deux appels", correct: false}
    answer: À cause des réveils intempestifs et parce que la condition a pu changer entre la notification et le réveil.
  - key: sleep-vs-wait
    format: course
    question: "Quelle différence entre `sleep` et `wait` ?"
    choices:
      - {text: "`wait` garde les verrous ; `sleep` relâche le moniteur, qu'il faut détenir pour l'appeler", correct: false}
      - {text: "`sleep` garde les verrous ; `wait` relâche le moniteur, qu'il faut détenir pour l'appeler", correct: true}
      - {text: "Aucune : `wait` est l'ancien nom de `sleep`, sans durée maximale", correct: false}
      - {text: "`sleep` s'appelle sur un objet, `wait` est une méthode statique de `Thread`", correct: false}
    answer: sleep garde les verrous ; wait relâche le moniteur. wait doit être appelé en détenant le moniteur.
  - key: notify-vs-notifyall
    format: course
    question: "Quelle différence entre `notify` et `notifyAll` ?"
    choices:
      - {text: "`notify` réveille tous les threads en attente, `notifyAll` ceux de toute la JVM", correct: false}
      - {text: "`notify` réveille un seul thread en attente, `notifyAll` tous ; le second est plus sûr", correct: true}
      - {text: "`notify` réveille le premier arrivé, `notifyAll` le plus prioritaire", correct: false}
      - {text: "`notify` rend le moniteur tout de suite, `notifyAll` à la fin du bloc", correct: false}
    answer: Réveille un thread arbitraire vs tous les threads en attente ; notifyAll est plus sûr si plusieurs conditions partagent le même moniteur.
  - key: alternative
    format: course
    question: Que préférer à `wait`/`notify` dans du code moderne ?
    choices:
      - {text: "`Thread.sleep` dans une boucle, plus simple et sans verrou", correct: false}
      - {text: "Les outils de `java.util.concurrent` : `BlockingQueue`, `CountDownLatch`, `Condition`", correct: true}
      - {text: "`Thread.suspend` et `Thread.resume`, qui évitent le moniteur", correct: false}
      - {text: "Des champs `volatile` testés en boucle jusqu'au changement", correct: false}
    answer: "Les outils de `java.util.concurrent` : `BlockingQueue` pour un producteur-consommateur, `CountDownLatch`, `Semaphore`, ou `ReentrantLock` avec des `Condition` séparées."
  - key: vf-moniteur
    format: true-false
    question: On peut appeler `wait()` hors d'un bloc `synchronized` sur l'objet.
    truth: false
    answer: Il lève `IllegalMonitorStateException`.
  - key: vf-relache
    format: true-false
    question: "`wait()` relâche le moniteur pendant l'attente."
    truth: true
    answer: Et le reprend avant de revenir.
  - key: vf-spurious
    format: true-false
    question: Un thread peut sortir de `wait()` sans avoir été notifié.
    truth: true
    answer: Un réveil intempestif, d'où la boucle `while`.
  - key: vf-notify-tous
    format: true-false
    question: "`notify()` réveille tous les threads en attente sur l'objet."
    truth: false
    answer: Un seul, arbitraire ; `notifyAll()` les réveille tous.
  - key: qcm-correct
    format: multiple-choice
    question: Quelle attente est correcte ?
    choices:
      - text: "`synchronized (this) { while (!pret) wait(); }`"
        correct: true
      - text: "`synchronized (this) { if (!pret) wait(); }`"
        correct: false
      - text: "`while (!pret) wait();` hors de tout bloc synchronized"
        correct: false
      - text: "`synchronized (this) { while (!pret) Thread.sleep(10); }`"
        correct: false
    answer: Le `sleep` sous verrou empêche l'autre thread de changer `pret`.
  - key: qcm-notifyall
    format: multiple-choice
    question: Pourquoi `notify()` peut-il provoquer un blocage dans une boîte producteur-consommateur ?
    choices:
      - {text: "Parce qu'il relâche le moniteur avant que le thread réveillé ne le reprenne", correct: false}
      - {text: "Parce qu'il réveille tous les threads, qui se disputent le moniteur sans fin", correct: false}
      - {text: "Il peut réveiller un thread qui attend l'autre condition, qui se rendort, et personne ne progresse", correct: true}
      - {text: "Parce qu'il doit être appelé hors du moniteur, où il ne réveille personne", correct: false}
    answer: Avec un seul moniteur pour deux conditions, `notifyAll` est plus sûr.
  - key: qcm-exception
    format: multiple-choice
    question: Quelle exception lève `wait()` appelé sans détenir le moniteur ?
    choices:
      - text: "`IllegalMonitorStateException`"
        correct: true
      - text: "`InterruptedException`"
        correct: false
      - text: "`IllegalStateException`"
        correct: false
      - text: "`ConcurrentModificationException`"
        correct: false
    answer: '`InterruptedException` sert à l''interruption pendant l''attente.'
  - key: qcm-remplacer
    format: multiple-choice
    question: Un producteur et un consommateur échangent des messages. Que choisir ?
    choices:
      - text: "Une `BlockingQueue` (`put` / `take`)"
        correct: true
      - text: "Un `wait`/`notify` écrit à la main, plus sûr"
        correct: false
      - text: "Une `ArrayList` partagée et `Thread.sleep`"
        correct: false
      - text: "Une variable `volatile` par message"
        correct: false
    answer: '`BlockingQueue` encapsule exactement ce mécanisme.'
  - key: bug-if
    format: bug-fix
    question: |-
      Le consommateur lit parfois `null`. Quelle correction est la bonne ?
      ```java
      synchronized T prendre() throws InterruptedException {
          if (contenu == null) wait();
          T v = contenu;
          contenu = null;
          return v;
      }
      ```
    choices:
      - {text: "Remplacer `wait()` par `Thread.sleep(100)`, puis relire `contenu`", correct: false}
      - {text: "Déclarer `contenu` `volatile`, pour que la valeur soit visible", correct: false}
      - {text: "Appeler `wait()` deux fois de suite, pour être sûr d'être réveillé", correct: false}
      - {text: "Retester la condition dans une boucle `while`, et notifier les producteurs après la prise", correct: true}
    answer: |-
      ```java
      synchronized T prendre() throws InterruptedException {
          while (contenu == null) wait();
          T v = contenu;
          contenu = null;
          notifyAll();
          return v;
      }
      ```
      Après un réveil (intempestif, ou parce qu'un autre consommateur a pris la valeur avant), la condition doit être
      retestée. Le `notifyAll` réveille aussi les producteurs qui attendent une boîte vide.
  - key: bug-hors-moniteur
    format: bug-fix
    question: |-
      Ce code lève `IllegalMonitorStateException`. Pourquoi ?
      ```java
      void signaler() {
          pret = true;
          verrou.notifyAll();
      }
      ```
    choices:
      - {text: "`notifyAll` exige de détenir le moniteur de `verrou`, absent ici", correct: true}
      - {text: "`notifyAll` ne peut réveiller que des threads démons", correct: false}
      - {text: "`pret` doit être `volatile` avant d'appeler `notifyAll`", correct: false}
      - {text: "Aucun thread n'attend sur `verrou` au moment de `notifyAll`", correct: false}
    answer: |-
      ```java
      void signaler() {
          synchronized (verrou) {
              pret = true;
              verrou.notifyAll();
          }
      }
      ```
      `notify`/`notifyAll` exigent de détenir le moniteur de l'objet ; la condition est aussi modifiée sous ce verrou.
  - key: bug-sleep-polling
    format: bug-fix
    question: |-
      Ce consommateur consomme du CPU et réagit avec retard. Quelle correction est la bonne ?
      ```java
      while (true) {
          if (!messages.isEmpty()) traiter(messages.remove(0));
          else Thread.sleep(50);
      }
      ```
    choices:
      - {text: "Réduire le `sleep` à 1 ms, pour réagir plus vite aux messages", correct: false}
      - {text: "Remplacer `Thread.sleep(50)` par `Thread.yield()`", correct: false}
      - {text: "Déclarer la liste `messages` `volatile`, sans changer la boucle", correct: false}
      - {text: "Une `BlockingQueue`, dont `take()` attend un message sans consommer de CPU", correct: true}
    answer: |-
      ```java
      BlockingQueue<Message> messages = new LinkedBlockingQueue<>();
      while (!Thread.currentThread().isInterrupted()) {
          traiter(messages.take());        // attend sans consommer de CPU
      }
      ```
      Une attente active avec `sleep` est lente et coûteuse (et la liste partagée n'est pas thread-safe). `take()` bloque
      jusqu'à l'arrivée d'un message.
  - key: bug-notify
    format: bug-fix
    question: |-
      Producteurs et consommateurs se bloquent parfois tous ensemble. Quelle correction est la bonne ?
      ```java
      synchronized void deposer(T v) throws InterruptedException {
          while (plein()) wait();
          ajouter(v);
          notify();
      }
      ```
    choices:
      - {text: "Remplacer la boucle `while (plein())` par un simple `if (plein())`", correct: false}
      - {text: "Appeler `notify()` avant `ajouter(v)`, pour réveiller plus tôt", correct: false}
      - {text: "Retirer `synchronized` de `deposer`, pour ne pas bloquer les consommateurs", correct: false}
      - {text: "Remplacer `notify()` par `notifyAll()`, ou passer à deux `Condition` séparées", correct: true}
    answer: |-
      ```java
      synchronized void deposer(T v) throws InterruptedException {
          while (plein()) wait();
          ajouter(v);
          notifyAll();
      }
      ```
      Producteurs et consommateurs attendent sur le même moniteur : `notify` peut réveiller un autre producteur, qui se
      rendort, et le consommateur n'est jamais réveillé. `notifyAll` (ou deux `Condition` séparées) évite ce blocage.
