notion: conditions-course
lesson: |-
  Une **condition de course** (*race condition*) survient quand le résultat dépend de l'**ordre** dans lequel des threads
  s'entrelacent sur un état partagé.

  ```java
  class Compteur {
      private int valeur;
      void incrementer() { valeur++; }      // lire, ajouter 1, écrire : trois étapes
  }
  ```

  Deux threads peuvent lire tous deux 41, écrire tous deux 42 : un incrément est **perdu**. Les deux motifs classiques :

  - **lire-modifier-écrire** : `compteur++`, `total += x`, `liste.add` sur une `ArrayList` partagée ;
  - **vérifier-puis-agir** (*check-then-act*) : `if (!map.containsKey(k)) map.put(k, v);`,
    `if (solde >= montant) solde -= montant;`, l'initialisation paresseuse `if (instance == null) instance = new ...`.
    Entre le test et l'action, un autre thread a pu changer l'état.

  Une **section critique** est la portion de code qui manipule l'état partagé et doit s'exécuter **sans interruption par
  un autre thread** sur cet état. On la protège par :
  - un **verrou** (`synchronized`, `ReentrantLock`) ;
  - une opération **atomique** (`AtomicInteger.incrementAndGet`, `ConcurrentHashMap.merge`, `putIfAbsent`) ;
  - ou, mieux, en **supprimant le partage** (objets immuables, données confinées à un thread).

  - Une **data race** est plus précise : deux accès concurrents à la même variable, dont au moins une écriture, sans
    relation *happens-before*. On peut avoir une condition de course sans data race (chaque accès est synchronisé, mais
    pas la séquence) et inversement.
  - Ces bugs sont **intermittents** : ils apparaissent sous charge, rarement en test.

  **Piège classique** : rendre chaque méthode thread-safe et croire la séquence sûre. `if (!map.containsKey(k))
  map.put(k, v)` sur une `ConcurrentHashMap` reste une condition de course : il faut `putIfAbsent` ou `computeIfAbsent`.

  **En entretien** : « Lire-modifier-écrire et vérifier-puis-agir sont les deux formes de condition de course ; on rend la
  séquence atomique (verrou, opération atomique) ou on supprime le partage. »
cards:
  - key: data-race-vs-race-condition
    format: course
    question: "Quelle différence entre une data race et une race condition ?"
    choices:
      - {text: "Data race : des accès concurrents non synchronisés à une variable ; race condition : un défaut logique lié à l'entrelacement", correct: true}
      - {text: "Race condition : des accès concurrents non synchronisés à une variable ; data race : un défaut logique lié à l'entrelacement", correct: false}
      - {text: "Data race : deux threads qui attendent le même verrou ; race condition : deux threads bloqués l'un par l'autre, pour toujours", correct: false}
      - {text: "Aucune : ce sont deux noms du même bug, l'un employé pour Java et l'autre pour le C et le C++", correct: false}
    answer: "Une data race, ce sont deux accès à la même variable, dont une écriture, sans synchronisation. Une race condition est un défaut logique qui dépend de l'ordre des threads (« vérifier-puis-agir ») : elle peut exister sans data race, avec des opérations chacune atomique."
  - key: count-plus-plus
    format: course
    question: Pourquoi `compteur++` n'est-il pas sûr entre plusieurs threads ?
    choices:
      - {text: "Le JIT peut exécuter `compteur++` avant l'initialisation du champ par le constructeur", correct: false}
      - {text: "C'est trois opérations (lire, ajouter, écrire) : deux threads peuvent perdre un incrément", correct: true}
      - {text: "`compteur++` déborde quand deux threads l'exécutent exactement au même instant", correct: false}
      - {text: "Un `int` est écrit en deux moitiés de 16 bits, qu'un autre thread peut voir séparées", correct: false}
    answer: C'est trois opérations (lire, ajouter, écrire) ; deux threads peuvent lire la même valeur et l'un des incréments est perdu.
  - key: check-then-act
    format: course
    question: Qu'est-ce qu'un motif « vérifier-puis-agir » ?
    choices:
      - {text: "Un test suivi d'une action qui en dépend ; un autre thread peut changer l'état entre les deux", correct: true}
      - {text: "Une vérification faite après l'action, pour l'annuler si l'état est devenu faux entre-temps", correct: false}
      - {text: "Un test répété en boucle, sans verrou, jusqu'à ce que l'état attendu apparaisse enfin", correct: false}
      - {text: "Une action précédée d'une vérification des droits de l'utilisateur sur la ressource", correct: false}
    answer: Un test suivi d'une action qui en dépend (`if (!contains) put`, `if (solde >= m) solde -= m`) ; entre les deux, un autre thread peut changer l'état.
  - key: section-critique
    format: course
    question: Comment protéger une section critique ?
    choices:
      - {text: "En déclarant `volatile` tous les champs que la section critique lit ou écrit", correct: false}
      - {text: "En ajoutant un `Thread.sleep` avant la section, pour laisser les autres threads finir", correct: false}
      - {text: "En appelant `Thread.yield()` à l'entrée, pour céder le processeur aux autres threads", correct: false}
      - {text: "Par un verrou, une opération atomique, ou en supprimant le partage (immuabilité, confinement)", correct: true}
    answer: Par un verrou (`synchronized`, `ReentrantLock`), par une opération atomique (`AtomicInteger`, `ConcurrentHashMap.merge`), ou en supprimant le partage (immuabilité, confinement).
  - key: vf-concurrenthashmap
    format: true-false
    question: "Avec une `ConcurrentHashMap`, `if (!m.containsKey(k)) m.put(k, v);` est sans risque."
    truth: false
    answer: Chaque appel est sûr, pas leur séquence ; `putIfAbsent` est atomique.
  - key: vf-intermittent
    format: true-false
    question: Une condition de course produit toujours un résultat faux.
    truth: false
    answer: Seulement quand l'entrelacement fautif se produit, souvent rarement.
  - key: vf-locales
    format: true-false
    question: Une variable locale d'une méthode ne peut pas provoquer de condition de course.
    truth: true
    answer: Elle est propre au thread (tant qu'elle ne référence pas un objet partagé).
  - key: vf-volatile
    format: true-false
    question: Déclarer le compteur `volatile` empêche la perte d'incréments.
    truth: false
    answer: '`volatile` garantit la visibilité, pas l''atomicité de `++`.'
  - key: qcm-motifs
    format: multiple-choice
    question: Lesquels contiennent une condition de course si `solde` est partagé ?
    choices:
      - text: "`if (solde >= m) solde -= m;`"
        correct: true
      - text: "`solde += depot;`"
        correct: true
      - text: "`int copie = 42; copie++;` (variable locale)"
        correct: false
      - text: "Lire un champ `final` initialisé dans le constructeur"
        correct: false
    answer: Un champ `final` immuable ne change jamais après la construction.
  - key: qcm-correctifs
    format: multiple-choice
    question: "Laquelle de ces corrections répare un compteur partagé qui perd des incréments ?"
    choices:
      - {text: "Déclarer le champ `volatile`", correct: false}
      - {text: "Ajouter `Thread.sleep(1)` avant l'incrément", correct: false}
      - {text: "`AtomicInteger.incrementAndGet()`", correct: true}
      - {text: "Déclarer le champ `static`", correct: false}
    answer: "`incrementAndGet` est atomique (une méthode `synchronized` marche aussi). `volatile` garantit la visibilité, pas l'atomicité de `++`, et `sleep` ne fait que changer la probabilité du bug."
  - key: qcm-atomique-map
    format: multiple-choice
    question: "Laquelle de ces écritures ajoute une valeur seulement si la clé est absente, de façon atomique ?"
    choices:
      - {text: "`map.putIfAbsent(k, v)` sur une `HashMap` partagée", correct: false}
      - {text: "`map.putIfAbsent(k, v)` sur une `ConcurrentHashMap`", correct: true}
      - {text: "`if (map.get(k) == null) map.put(k, v);`", correct: false}
      - {text: "`if (!map.containsKey(k)) map.put(k, v);`", correct: false}
    answer: "`putIfAbsent` (comme `computeIfAbsent`) teste et écrit d'un bloc sur une `ConcurrentHashMap`. Les deux `if` sont des « vérifier-puis-agir », et une `HashMap` n'est pas faite pour être partagée."
  - key: qcm-supprimer
    format: multiple-choice
    question: "Quelle approche évite les conditions de course à la source ?"
    choices:
      - {text: "Ajouter des verrous partout, sur chaque méthode de chaque classe", correct: false}
      - {text: "Réduire le nombre de cœurs, pour que les threads s'entrelacent moins", correct: false}
      - {text: "Ne pas partager d'état modifiable (objets immuables, données par thread)", correct: true}
      - {text: "Tester plus souvent, sous charge, jusqu'à ne plus voir le bug", correct: false}
    answer: Pas de partage modifiable, pas de condition de course.
  - key: code-atomique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.util.concurrent.atomic.AtomicInteger;
      AtomicInteger compteur = new AtomicInteger();
      List<Thread> threads = new ArrayList<>();
      for (int i = 0; i < 4; i++) {
          threads.add(Thread.ofPlatform().start(() -> {
              for (int j = 0; j < 10_000; j++) compteur.incrementAndGet();
          }));
      }
      for (Thread t : threads) t.join();
      System.out.println(compteur.get());
      ```
    choices:
      - {text: "Un nombre variable, inférieur à `40000`", correct: false}
      - {text: "`40000`", correct: true}
      - {text: "`10000`", correct: false}
      - {text: "`0`", correct: false}
    answer: '`40000`, toujours : l''incrément atomique ne perd rien.'
    check:
      output: "40000"
  - key: code-synchronized
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Compteur {
          private int valeur;
          synchronized void incrementer() { valeur++; }
          synchronized int valeur() { return valeur; }
      }
      Compteur c = new Compteur();
      Thread a = Thread.ofPlatform().start(() -> { for (int i = 0; i < 50_000; i++) c.incrementer(); });
      Thread b = Thread.ofPlatform().start(() -> { for (int i = 0; i < 50_000; i++) c.incrementer(); });
      a.join();
      b.join();
      System.out.println(c.valeur());
      ```
    choices:
      - {text: "`100000`", correct: true}
      - {text: "Un nombre variable, inférieur à `100000`", correct: false}
      - {text: "`50000`", correct: false}
      - {text: "`0`", correct: false}
    answer: '`100000`, toujours : la section critique est protégée.'
    check:
      output: "100000"
  - key: code-merge
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> visites = new ConcurrentHashMap<>();
      try (var pool = Executors.newFixedThreadPool(4)) {
          for (int i = 0; i < 1000; i++) {
              pool.submit(() -> visites.merge("accueil", 1, Integer::sum));
          }
      }
      System.out.println(visites.get("accueil"));
      ```
    choices:
      - {text: "`1000`", correct: true}
      - {text: "Un nombre variable, inférieur à `1000`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "`1`", correct: false}
    answer: '`1000` : `merge` est atomique sur une `ConcurrentHashMap`, et `close()` attend la fin des tâches.'
    check:
      output: "1000"
  - key: code-confinement
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static int somme(List<Integer> l) {
          int total = 0;                 // locale : propre au thread qui exécute la méthode
          for (int x : l) total += x;
          return total;
      }
      try (var pool = Executors.newFixedThreadPool(2)) {
          var a = pool.submit(() -> somme(List.of(1, 2, 3)));
          var b = pool.submit(() -> somme(List.of(10, 20)));
          System.out.println(a.get() + " " + b.get());
      }
      ```
    choices:
      - {text: "`36 36`", correct: false}
      - {text: "`6 36`", correct: false}
      - {text: "`6 30`", correct: true}
      - {text: "`30 6`", correct: false}
    answer: '`6 30` : chaque appel a ses propres variables locales.'
    check:
      output: "6 30"
  - key: bug-check-then-act
    format: bug-fix
    question: |-
      Deux sessions sont parfois créées pour le même utilisateur. Quelle correction est la bonne ?
      ```java
      if (!sessions.containsKey(id)) {             // ConcurrentHashMap
          sessions.put(id, new Session(id));
      }
      ```
    choices:
      - {text: "`sessions.computeIfAbsent(id, Session::new);`", correct: true}
      - {text: "`if (sessions.get(id) == null) sessions.put(id, new Session(id));`", correct: false}
      - {text: "`sessions.put(id, new Session(id));`, sans le test", correct: false}
      - {text: "Déclarer le champ `sessions` `volatile`", correct: false}
    answer: |-
      ```java
      sessions.computeIfAbsent(id, Session::new);
      ```
      Le test et l'insertion n'étaient pas atomiques ensemble. `computeIfAbsent` fait les deux en une opération atomique.
  - key: bug-solde
    format: bug-fix
    question: |-
      Le solde devient parfois négatif alors que le code le vérifie. Quelle correction est la bonne ?
      ```java
      void retirer(long montant) {
          if (solde >= montant) {
              solde -= montant;
          }
      }
      ```
    choices:
      - {text: "Rendre `retirer` `synchronized`, comme tous les accès à `solde`", correct: true}
      - {text: "Déclarer `solde` `volatile`, pour que le test voie la dernière valeur", correct: false}
      - {text: "Retester `solde >= montant` juste après la soustraction", correct: false}
      - {text: "Remplacer `solde -= montant` par `solde = solde - montant`", correct: false}
    answer: |-
      ```java
      synchronized void retirer(long montant) {
          if (solde >= montant) {
              solde -= montant;
          }
      }
      // (et toutes les autres lectures et écritures de solde synchronisées sur le même verrou)
      ```
      Deux retraits peuvent passer le test avant que l'un des deux ne soustraie. Le test et l'action doivent former une
      seule section critique.
  - key: bug-arraylist
    format: bug-fix
    question: |-
      Ce code perd des résultats, et lève parfois `ArrayIndexOutOfBoundsException`. Quelle correction est la bonne ?
      ```java
      List<Resultat> resultats = new ArrayList<>();
      taches.parallelStream().forEach(t -> resultats.add(t.executer()));
      ```
    choices:
      - {text: "Laisser le stream construire la liste : `.map(Tache::executer).toList()`", correct: true}
      - {text: "Remplacer `parallelStream()` par `stream().parallel()`", correct: false}
      - {text: "Créer la liste avec `new ArrayList<>(taches.size())`, assez grande", correct: false}
      - {text: "Déclarer la variable `resultats` `final`", correct: false}
    answer: |-
      ```java
      List<Resultat> resultats = taches.parallelStream().map(Tache::executer).toList();
      ```
      Plusieurs threads ajoutaient dans la même `ArrayList`, non thread-safe. Le stream construit lui-même la liste,
      correctement.
  - key: bug-volatile
    format: bug-fix
    question: |-
      Le nombre de requêtes compté est inférieur au nombre réel. Pourquoi ?
      ```java
      private volatile long requetes;
      void compter() { requetes++; }
      ```
    choices:
      - {text: "`volatile` rend la valeur visible, mais `++` reste lire, modifier, écrire", correct: true}
      - {text: "`volatile` ne s'applique pas aux `long`, qui restent écrits en deux fois", correct: false}
      - {text: "`volatile` garde une copie de la valeur dans chaque thread, qui compte à part", correct: false}
      - {text: "`requetes++` déborde dès que deux threads l'exécutent en même temps", correct: false}
    answer: |-
      ```java
      private final LongAdder requetes = new LongAdder();
      void compter() { requetes.increment(); }
      ```
      `volatile` rend la valeur visible, mais `++` reste lire-modifier-écrire. `LongAdder` (ou `AtomicLong`) incrémente
      atomiquement, et `LongAdder` supporte mieux une forte contention.
  - key: compteur-donne-valeurs-incoherentes-prod-mais
    format: scenario
    question: "Un compteur donne des valeurs incohérentes en production, mais pas en test. Qu'en penses-tu ?"
    choices:
      - {text: "Un problème de visibilité : déclarer le compteur `volatile` suffira", correct: false}
      - {text: "Un bug de la JVM de production, à corriger en changeant de version", correct: false}
      - {text: "Une condition de course : `count++` n'est pas atomique, il faut un `AtomicInteger`", correct: true}
      - {text: "Un débordement d'entier, qui n'arrive qu'avec le volume de la production", correct: false}
    answer: "Une condition de course, visible seulement sous concurrence réelle : deux threads lisent la même valeur avant d'incrémenter, et un incrément est perdu. `volatile` ne règle que la visibilité ; `AtomicInteger.incrementAndGet()` rend l'opération atomique. Ces bugs ne se reproduisent presque jamais en test, faute de charge."
  - key: scenario-double-reservation
    format: scenario
    question: Deux clients ont réservé le même siège au même moment. Comment l'empêcher ?
    choices:
      - {text: "Un bloc `synchronized` autour de la réservation, dans le code du service Java", correct: false}
      - {text: "Un second test « siège libre ? », relu en base juste avant l'insertion", correct: false}
      - {text: "Une garantie en base : contrainte d'unicité (siège, séance) ou `UPDATE` conditionnel vérifié", correct: true}
      - {text: "Une `BlockingQueue` en mémoire, qui sérialise les réservations du service", correct: false}
    answer: "C'est un « vérifier-puis-agir » réparti : avec plusieurs instances du service, un verrou Java ne suffit pas, la garantie doit venir de la base. Une contrainte d'unicité fait échouer la seconde insertion, ou un `UPDATE ... WHERE client IS NULL` dont on vérifie le nombre de lignes, ou un verrouillage optimiste ; le service répond « siège déjà réservé »."
  - key: scenario-reproduire
    format: scenario
    question: Comment écrirais-tu un test qui met en évidence une condition de course supposée ?
    choices:
      - {text: "Un seul test avec deux threads : s'il passe, le code est prouvé sans condition de course", correct: false}
      - {text: "Un test exécuté pas à pas dans le débogueur, pour suivre chaque thread un par un", correct: false}
      - {text: "Beaucoup de threads lancés ensemble (`CountDownLatch`), puis un invariant vérifié, plusieurs fois", correct: true}
      - {text: "Un test séquentiel qui appelle l'opération des milliers de fois, dans le thread principal", correct: false}
    answer: "Des dizaines de threads qui répètent l'opération des milliers de fois, lâchés ensemble par un `CountDownLatch`, puis un invariant vérifié (total attendu, aucun doublon), le tout répété. Un échec prouve le problème, un succès ne prouve rien : jcstress aide pour les cas fins, et rien ne remplace le raisonnement sur l'état partagé."
  - key: scenario-singleton-etat
    format: scenario
    question: En revue, tu vois un bean singleton Spring avec un champ `private List<Ligne> lignesCourantes` rempli pendant le traitement d'une requête. Que dis-tu ?
    choices:
      - {text: "Rien : Spring crée un bean singleton par requête, la liste n'est pas partagée", correct: false}
      - {text: "Il faut déclarer le champ `volatile`, pour que chaque requête voie sa liste", correct: false}
      - {text: "Une condition de course : le bean est partagé, la liste doit devenir une variable locale", correct: true}
      - {text: "Il faut une `CopyOnWriteArrayList`, pour que la liste devienne thread-safe", correct: false}
    answer: "Le bean est partagé par toutes les requêtes : deux requêtes simultanées remplissent la même liste et mélangent leurs lignes. Une liste thread-safe ne change rien à ce mélange ; il faut supprimer l'état (variable locale, paramètre, ou objet de travail créé par requête)."
