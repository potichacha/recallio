notion: conditions-course
lesson: |-
  Une **condition de course** (*race condition*) survient quand le résultat dépend de l'**ordre** dans lequel des threads
  s'entrelacent sur un état partagé.

  ```java
  class Compteur {
      private int valeur;
      void incrementer() { valeur++; }      // lire, ajouter 1, écrire : trois étapes
  }
  ```

  Deux threads peuvent lire tous deux 41, écrire tous deux 42 : un incrément est **perdu**. Les deux motifs classiques :

  - **lire-modifier-écrire** : `compteur++`, `total += x`, `liste.add` sur une `ArrayList` partagée ;
  - **vérifier-puis-agir** (*check-then-act*) : `if (!map.containsKey(k)) map.put(k, v);`,
    `if (solde >= montant) solde -= montant;`, l'initialisation paresseuse `if (instance == null) instance = new ...`.
    Entre le test et l'action, un autre thread a pu changer l'état.

  Une **section critique** est la portion de code qui manipule l'état partagé et doit s'exécuter **sans interruption par
  un autre thread** sur cet état. On la protège par :
  - un **verrou** (`synchronized`, `ReentrantLock`) ;
  - une opération **atomique** (`AtomicInteger.incrementAndGet`, `ConcurrentHashMap.merge`, `putIfAbsent`) ;
  - ou, mieux, en **supprimant le partage** (objets immuables, données confinées à un thread).

  - Une **data race** est plus précise : deux accès concurrents à la même variable, dont au moins une écriture, sans
    relation *happens-before*. On peut avoir une condition de course sans data race (chaque accès est synchronisé, mais
    pas la séquence) et inversement.
  - Ces bugs sont **intermittents** : ils apparaissent sous charge, rarement en test.

  **Piège classique** : rendre chaque méthode thread-safe et croire la séquence sûre. `if (!map.containsKey(k))
  map.put(k, v)` sur une `ConcurrentHashMap` reste une condition de course : il faut `putIfAbsent` ou `computeIfAbsent`.

  **En entretien** : « Lire-modifier-écrire et vérifier-puis-agir sont les deux formes de condition de course ; on rend la
  séquence atomique (verrou, opération atomique) ou on supprime le partage. »
cards:
  - key: data-race-vs-race-condition
    format: course
    question: Data race vs race condition ?
    answer: Accès concurrent non synchronisé à une variable vs défaut logique dépendant de l'entrelacement (check-then-act).
  - key: count-plus-plus
    format: course
    question: Pourquoi `compteur++` n'est-il pas sûr entre plusieurs threads ?
    answer: C'est trois opérations (lire, ajouter, écrire) ; deux threads peuvent lire la même valeur et l'un des incréments est perdu.
  - key: check-then-act
    format: course
    question: Qu'est-ce qu'un motif « vérifier-puis-agir » ?
    answer: Un test suivi d'une action qui en dépend (`if (!contains) put`, `if (solde >= m) solde -= m`) ; entre les deux, un autre thread peut changer l'état.
  - key: section-critique
    format: course
    question: Comment protéger une section critique ?
    answer: Par un verrou (`synchronized`, `ReentrantLock`), par une opération atomique (`AtomicInteger`, `ConcurrentHashMap.merge`), ou en supprimant le partage (immuabilité, confinement).
  - key: vf-concurrenthashmap
    format: true-false
    question: "Avec une `ConcurrentHashMap`, `if (!m.containsKey(k)) m.put(k, v);` est sans risque."
    truth: false
    answer: Chaque appel est sûr, pas leur séquence ; `putIfAbsent` est atomique.
  - key: vf-intermittent
    format: true-false
    question: Une condition de course produit toujours un résultat faux.
    truth: false
    answer: Seulement quand l'entrelacement fautif se produit, souvent rarement.
  - key: vf-locales
    format: true-false
    question: Une variable locale d'une méthode ne peut pas provoquer de condition de course.
    truth: true
    answer: Elle est propre au thread (tant qu'elle ne référence pas un objet partagé).
  - key: vf-volatile
    format: true-false
    question: Déclarer le compteur `volatile` empêche la perte d'incréments.
    truth: false
    answer: '`volatile` garantit la visibilité, pas l''atomicité de `++`.'
  - key: qcm-motifs
    format: multiple-choice
    question: Lesquels contiennent une condition de course si `solde` est partagé ?
    choices:
      - text: "`if (solde >= m) solde -= m;`"
        correct: true
      - text: "`solde += depot;`"
        correct: true
      - text: "`int copie = 42; copie++;` (variable locale)"
        correct: false
      - text: "Lire un champ `final` initialisé dans le constructeur"
        correct: false
    answer: Un champ `final` immuable ne change jamais après la construction.
  - key: qcm-correctifs
    format: multiple-choice
    question: Comment corriger un compteur partagé qui perd des incréments ?
    choices:
      - text: "`AtomicInteger.incrementAndGet()`"
        correct: true
      - text: "Une méthode `synchronized void incrementer()`"
        correct: true
      - text: "Déclarer le champ `volatile`"
        correct: false
      - text: "Ajouter `Thread.sleep(1)` avant l'incrément"
        correct: false
    answer: '`sleep` ne fait que changer la probabilité du bug.'
  - key: qcm-atomique-map
    format: multiple-choice
    question: Quelle écriture ajoute une valeur seulement si la clé est absente, de façon atomique ?
    choices:
      - text: "`map.putIfAbsent(k, v)` sur une `ConcurrentHashMap`"
        correct: true
      - text: "`map.computeIfAbsent(k, x -> v)` sur une `ConcurrentHashMap`"
        correct: true
      - text: "`if (map.get(k) == null) map.put(k, v);`"
        correct: false
      - text: "`if (!map.containsKey(k)) map.put(k, v);`"
        correct: false
    answer: Les deux dernières sont des « vérifier-puis-agir ».
  - key: qcm-supprimer
    format: multiple-choice
    question: Quelle approche évite le problème à la source ?
    choices:
      - text: "Ne pas partager d'état modifiable (objets immuables, données par thread)"
        correct: true
      - text: "Ajouter des verrous partout"
        correct: false
      - text: "Réduire le nombre de cœurs"
        correct: false
      - text: "Tester plus souvent"
        correct: false
    answer: Pas de partage modifiable, pas de condition de course.
  - key: code-atomique
    format: code-output
    question: |-
      ```java
      import java.util.concurrent.atomic.AtomicInteger;
      AtomicInteger compteur = new AtomicInteger();
      List<Thread> threads = new ArrayList<>();
      for (int i = 0; i < 4; i++) {
          threads.add(Thread.ofPlatform().start(() -> {
              for (int j = 0; j < 10_000; j++) compteur.incrementAndGet();
          }));
      }
      for (Thread t : threads) t.join();
      System.out.println(compteur.get());
      ```
    answer: '`40000`, toujours : l''incrément atomique ne perd rien.'
    check:
      output: "40000"
  - key: code-synchronized
    format: code-output
    question: |-
      ```java
      class Compteur {
          private int valeur;
          synchronized void incrementer() { valeur++; }
          synchronized int valeur() { return valeur; }
      }
      Compteur c = new Compteur();
      Thread a = Thread.ofPlatform().start(() -> { for (int i = 0; i < 50_000; i++) c.incrementer(); });
      Thread b = Thread.ofPlatform().start(() -> { for (int i = 0; i < 50_000; i++) c.incrementer(); });
      a.join();
      b.join();
      System.out.println(c.valeur());
      ```
    answer: '`100000`, toujours : la section critique est protégée.'
    check:
      output: "100000"
  - key: code-merge
    format: code-output
    question: |-
      ```java
      Map<String, Integer> visites = new ConcurrentHashMap<>();
      try (var pool = Executors.newFixedThreadPool(4)) {
          for (int i = 0; i < 1000; i++) {
              pool.submit(() -> visites.merge("accueil", 1, Integer::sum));
          }
      }
      System.out.println(visites.get("accueil"));
      ```
    answer: '`1000` : `merge` est atomique sur une `ConcurrentHashMap`, et `close()` attend la fin des tâches.'
    check:
      output: "1000"
  - key: code-confinement
    format: code-output
    question: |-
      ```java
      static int somme(List<Integer> l) {
          int total = 0;                 // locale : propre au thread qui exécute la méthode
          for (int x : l) total += x;
          return total;
      }
      try (var pool = Executors.newFixedThreadPool(2)) {
          var a = pool.submit(() -> somme(List.of(1, 2, 3)));
          var b = pool.submit(() -> somme(List.of(10, 20)));
          System.out.println(a.get() + " " + b.get());
      }
      ```
    answer: '`6 30` : chaque appel a ses propres variables locales.'
    check:
      output: "6 30"
  - key: bug-check-then-act
    format: bug-fix
    question: |-
      Deux sessions sont parfois créées pour le même utilisateur :
      ```java
      if (!sessions.containsKey(id)) {             // ConcurrentHashMap
          sessions.put(id, new Session(id));
      }
      ```
    answer: |-
      ```java
      sessions.computeIfAbsent(id, Session::new);
      ```
      Le test et l'insertion n'étaient pas atomiques ensemble. `computeIfAbsent` fait les deux en une opération atomique.
  - key: bug-solde
    format: bug-fix
    question: |-
      Le solde devient parfois négatif alors que le code le vérifie :
      ```java
      void retirer(long montant) {
          if (solde >= montant) {
              solde -= montant;
          }
      }
      ```
    answer: |-
      ```java
      synchronized void retirer(long montant) {
          if (solde >= montant) {
              solde -= montant;
          }
      }
      // (et toutes les autres lectures et écritures de solde synchronisées sur le même verrou)
      ```
      Deux retraits peuvent passer le test avant que l'un des deux ne soustraie. Le test et l'action doivent former une
      seule section critique.
  - key: bug-arraylist
    format: bug-fix
    question: |-
      Ce code perd des résultats, et lève parfois `ArrayIndexOutOfBoundsException` :
      ```java
      List<Resultat> resultats = new ArrayList<>();
      taches.parallelStream().forEach(t -> resultats.add(t.executer()));
      ```
    answer: |-
      ```java
      List<Resultat> resultats = taches.parallelStream().map(Tache::executer).toList();
      ```
      Plusieurs threads ajoutaient dans la même `ArrayList`, non thread-safe. Le stream construit lui-même la liste,
      correctement.
  - key: bug-volatile
    format: bug-fix
    question: |-
      Le nombre de requêtes compté est inférieur au nombre réel :
      ```java
      private volatile long requetes;
      void compter() { requetes++; }
      ```
    answer: |-
      ```java
      private final LongAdder requetes = new LongAdder();
      void compter() { requetes.increment(); }
      ```
      `volatile` rend la valeur visible, mais `++` reste lire-modifier-écrire. `LongAdder` (ou `AtomicLong`) incrémente
      atomiquement, et `LongAdder` supporte mieux une forte contention.
  - key: compteur-donne-valeurs-incoherentes-prod-mais
    format: scenario
    question: Un compteur donne des valeurs incohérentes en prod mais pas en test.
    answer: |-
      C'est une **race condition**, qui n'apparaît que sous concurrence réelle. `count++` n'est pas atomique : deux threads lisent la même valeur avant d'incrémenter, et une incrémentation est perdue.
      `volatile` ne corrige pas ça, il ne traite que la visibilité, pas l'atomicité. La solution simple est `AtomicInteger.incrementAndGet()`, qui s'appuie sur une instruction CPU atomique sans verrou.
      Ce cas illustre bien pourquoi les bugs de concurrence ne se reproduisent presque jamais en test : ils dépendent d'un entrelacement de threads qui n'arrive que sous charge.
  - key: scenario-double-reservation
    format: scenario
    question: Deux clients ont réservé le même siège au même moment. Comment l'empêcher ?
    answer: |-
      C'est un « vérifier-puis-agir » réparti : chaque requête a vu le siège libre avant que l'autre n'écrive. Si plusieurs
      instances du service tournent, un verrou Java ne suffit pas : la garantie doit venir de la base. Une contrainte
      d'unicité (siège, séance) fait échouer la seconde insertion ; ou une mise à jour conditionnelle
      (`UPDATE siege SET client = ? WHERE id = ? AND client IS NULL`) dont on vérifie le nombre de lignes modifiées ; ou un
      verrouillage optimiste par version. Le service traduit ensuite l'échec en réponse claire (« siège déjà réservé »).
  - key: scenario-reproduire
    format: scenario
    question: Comment écrirais-tu un test qui met en évidence une condition de course supposée ?
    answer: |-
      Je lance de nombreux threads (des dizaines) qui exécutent la même opération des milliers de fois, en les faisant
      démarrer ensemble avec un `CountDownLatch`, puis je vérifie un invariant (le total attendu, l'absence de doublon).
      Je répète le test plusieurs fois. Un échec prouve le problème ; un succès ne prouve rien, d'où l'intérêt d'outils
      comme jcstress pour les cas fins. Surtout, je raisonne sur le code : identifier l'état partagé et vérifier que chaque
      séquence lire-modifier-écrire ou vérifier-puis-agir est atomique.
  - key: scenario-singleton-etat
    format: scenario
    question: En revue, tu vois un bean singleton Spring avec un champ `private List<Ligne> lignesCourantes` rempli pendant le traitement d'une requête. Que dis-tu ?
    answer: |-
      Que c'est une condition de course : le bean est partagé par toutes les requêtes, donc deux requêtes simultanées
      remplissent et lisent la même liste, et se mélangent leurs lignes. Je propose de supprimer l'état : la liste devient
      une variable locale, passée en paramètre aux méthodes qui en ont besoin, ou un objet de travail créé par requête. Un
      bean singleton doit rester sans état modifiable (ou ne garder que des données thread-safe et partagées à dessein,
      comme un cache concurrent).
