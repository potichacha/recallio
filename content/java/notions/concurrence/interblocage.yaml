notion: interblocage
lesson: |-
  Un **interblocage** (*deadlock*) survient quand des threads s'attendent **mutuellement** : chacun détient un verrou dont
  l'autre a besoin, et aucun ne lâche le sien.

  ```java
  // Thread 1 : virement(a, b)            Thread 2 : virement(b, a)
  synchronized (a) {                      synchronized (b) {
      synchronized (b) { ... }   ⇄            synchronized (a) { ... }
  }                                       }
  ```

  Quatre conditions doivent être réunies (Coffman) : exclusion mutuelle, détention en attendant un autre verrou, pas de
  préemption, **attente circulaire**. On en casse une, le plus souvent la dernière :
  - **ordre global** de prise des verrous : toujours verrouiller le compte de plus petit identifiant d'abord ;
  - **`tryLock` avec délai** (`ReentrantLock`) : abandonner et réessayer plutôt qu'attendre indéfiniment ;
  - **ne pas appeler de code inconnu** (écouteurs, callbacks) en détenant un verrou ;
  - **un seul verrou** ou, mieux, **pas de verrou** : structures concurrentes, objets immuables, files de messages.

  Deux cousins :
  - la **famine** (*starvation*) : un thread n'obtient jamais la ressource, parce que d'autres passent toujours avant
    (verrou non équitable, threads trop prioritaires, tâches longues qui monopolisent un pool) ;
  - le **livelock** : les threads ne sont pas bloqués, ils réagissent sans cesse l'un à l'autre (chacun cède, réessaie,
    recède...) sans jamais progresser ; un délai aléatoire avant de réessayer le casse.

  Un interblocage existe aussi **sans verrou explicite** : des tâches d'un pool de taille fixe qui attendent le résultat
  d'autres tâches soumises au même pool, une connexion à la base attendue par des threads qui en détiennent déjà une.

  **Diagnostic** : un **thread dump** (`jstack`, `jcmd <pid> Thread.print`) détecte et affiche les interblocages sur
  moniteurs et `ReentrantLock` (« Found one Java-level deadlock »).

  **Piège classique** : un virement qui verrouille toujours « source puis destination ». Deux virements croisés
  simultanés se bloquent pour toujours.

  **En entretien** : « Attente circulaire de verrous ; je l'évite par un ordre global de verrouillage, `tryLock` avec délai,
  aucun appel extérieur sous verrou, et je le diagnostique avec un thread dump. »
cards:
  - key: deadlock
    format: course
    question: "Qu'est-ce qu'un interblocage (deadlock) ?"
    choices:
      - {text: "Un thread qui tourne en boucle sans jamais rendre la main au processeur", correct: false}
      - {text: "Un thread qui n'obtient jamais la ressource, toujours servie à d'autres", correct: false}
      - {text: "Des threads qui attendent chacun un verrou détenu par un autre, sans fin", correct: true}
      - {text: "Deux threads qui modifient la même variable sans synchronisation", correct: false}
    answer: "Deux threads (ou plus) attendent mutuellement un verrou détenu par l'autre : aucun ne peut avancer. Un thread toujours servi après les autres, c'est la famine, pas l'interblocage."
  - key: livelock-vs-deadlock
    format: course
    question: "Quelle différence entre un livelock et un deadlock ?"
    choices:
      - {text: "Deadlock : les threads s'agitent sans progresser ; livelock : ils restent bloqués", correct: false}
      - {text: "Un livelock est un deadlock que la JVM a détecté et rompu automatiquement", correct: false}
      - {text: "Le deadlock concerne les verrous, le livelock seulement les entrées-sorties", correct: false}
      - {text: "Deadlock : les threads restent bloqués ; livelock : ils s'agitent sans progresser", correct: true}
    answer: "Deadlock : les threads sont bloqués, le CPU est au repos. Livelock : ils réagissent l'un à l'autre (chacun cède, puis réessaie) et consomment du CPU sans jamais avancer."
  - key: famine
    format: course
    question: "Qu'est-ce que la famine (starvation) d'un thread ?"
    choices:
      - {text: "Deux threads qui s'attendent mutuellement, chacun tenant un verrou", correct: false}
      - {text: "Un thread qui consomme à lui seul toute la mémoire disponible du tas", correct: false}
      - {text: "Un thread qui n'obtient jamais la ressource, toujours servie à d'autres", correct: true}
      - {text: "Un thread de pool arrêté parce que sa file de tâches est vide", correct: false}
    answer: "Un thread qui n'obtient jamais la ressource dont il a besoin, parce que d'autres passent toujours avant lui (verrou non équitable, tâches longues qui monopolisent un pool). Contrairement à l'interblocage, le système avance, mais pas lui."
  - key: ordre-global
    format: course
    question: Comment l'ordre global de verrouillage évite-t-il l'interblocage ?
    choices:
      - {text: "Il permet à la JVM de détecter le cycle et d'interrompre l'un des threads", correct: false}
      - {text: "Si tous prennent les verrous dans le même ordre, aucune attente circulaire n'est possible", correct: true}
      - {text: "Il garantit qu'un seul thread de l'application détient un verrou à la fois", correct: false}
      - {text: "Il rend les verrous réentrants : un thread peut les reprendre sans bloquer", correct: false}
    answer: Si tous les threads prennent les verrous dans le même ordre (par exemple par identifiant croissant), aucune attente circulaire n'est possible.
  - key: diagnostic
    format: course
    question: Comment diagnostiquer un interblocage en production ?
    choices:
      - {text: "Avec un heap dump (`jmap`), qui liste les objets actuellement verrouillés", correct: false}
      - {text: "En lisant les logs du GC, qui notent chaque thread resté bloqué", correct: false}
      - {text: "Avec un thread dump (`jcmd <pid> Thread.print`), qui signale le deadlock", correct: true}
      - {text: "En surveillant le CPU : un interblocage le fait monter à 100 %", correct: false}
    answer: Avec un thread dump (`jstack <pid>` ou `jcmd <pid> Thread.print`), qui signale « Found one Java-level deadlock » et montre quel thread détient et attend quel verrou.
  - key: vf-sans-verrou
    format: true-false
    question: Un interblocage nécessite forcément des blocs `synchronized`.
    truth: false
    answer: Des tâches d'un pool plein qui attendent d'autres tâches du même pool, ou des connexions épuisées, suffisent.
  - key: vf-ordre
    format: true-false
    question: Prendre toujours les verrous dans le même ordre global empêche l'interblocage sur ces verrous.
    truth: true
    answer: L'attente circulaire devient impossible.
  - key: vf-livelock
    format: true-false
    question: Dans un livelock, les threads sont à l'état `BLOCKED`.
    truth: false
    answer: Ils s'exécutent, mais sans progresser.
  - key: vf-trylock
    format: true-false
    question: "`tryLock` avec un délai permet de sortir d'une attente qui pourrait être un interblocage."
    truth: true
    answer: Le thread abandonne, relâche ses verrous et réessaie plus tard.
  - key: qcm-prevenir
    format: multiple-choice
    question: "Quelle pratique prévient l'interblocage ?"
    choices:
      - {text: "Augmenter la priorité des threads", correct: false}
      - {text: "Prendre les verrous toujours dans le même ordre", correct: true}
      - {text: "Ajouter des `Thread.sleep` entre les prises de verrou", correct: false}
      - {text: "Rendre les verrous équitables (`fair`)", correct: false}
    answer: "Un ordre global de verrouillage supprime l'attente circulaire. Un `sleep` ou une priorité changent seulement la probabilité du blocage, et l'équité évite la famine, pas l'interblocage."
  - key: qcm-conditions
    format: multiple-choice
    question: Laquelle est une des quatre conditions nécessaires à un interblocage ?
    choices:
      - text: "L'attente circulaire"
        correct: true
      - text: "Un processeur à un seul cœur"
        correct: false
      - text: "Un ramasse-miettes actif"
        correct: false
      - text: "Des threads virtuels"
        correct: false
    answer: Les trois autres sont l'exclusion mutuelle, la détention en attente et l'absence de préemption.
  - key: qcm-pool
    format: multiple-choice
    question: "Un pool de 4 threads exécute 4 tâches qui attendent chacune `pool.submit(sousTache).get()`. Que se passe-t-il ?"
    choices:
      - text: "Un interblocage : les sous-tâches n'ont aucun thread libre"
        correct: true
      - text: "Le pool crée automatiquement des threads supplémentaires"
        correct: false
      - text: "Les sous-tâches s'exécutent dans le thread appelant"
        correct: false
      - text: "Une exception immédiate"
        correct: false
    answer: Un pool fixe ne grandit pas ; ses threads attendent des tâches qu'ils devraient exécuter.
  - key: qcm-livelock
    format: multiple-choice
    question: Comment casser un livelock où deux threads cèdent et réessaient en même temps ?
    choices:
      - text: "Un délai aléatoire avant de réessayer"
        correct: true
      - text: "Supprimer tout délai"
        correct: false
      - text: "Augmenter le nombre de threads"
        correct: false
      - text: "Utiliser `notify` au lieu de `notifyAll`"
        correct: false
    answer: Le hasard désynchronise les tentatives.
  - key: bug-virement
    format: bug-fix
    question: |-
      Deux virements croisés simultanés (A vers B, B vers A) bloquent l'application. Quelle correction est la bonne ?
      ```java
      void virer(Compte source, Compte dest, long m) {
          synchronized (source) {
              synchronized (dest) {
                  source.debiter(m); dest.crediter(m);
              }
          }
      }
      ```
    choices:
      - {text: "Inverser les deux blocs : verrouiller `dest` d'abord, puis `source`", correct: false}
      - {text: "Verrouiller les deux comptes dans un ordre global, par exemple par identifiant croissant", correct: true}
      - {text: "Ajouter un `Thread.sleep` entre les deux blocs `synchronized`", correct: false}
      - {text: "Déclarer `volatile` les champs de solde des deux comptes", correct: false}
    answer: |-
      ```java
      void virer(Compte source, Compte dest, long m) {
          Compte premier = source.id() < dest.id() ? source : dest;
          Compte second = premier == source ? dest : source;
          synchronized (premier) {
              synchronized (second) {
                  source.debiter(m); dest.crediter(m);
              }
          }
      }
      ```
      Chaque thread verrouillait d'abord sa source : attente circulaire. Un ordre global (par identifiant) supprime le
      cycle.
  - key: bug-callback
    format: bug-fix
    question: |-
      Un écouteur qui appelle à son tour le service provoque un interblocage. Quelle correction est la bonne ?
      ```java
      synchronized void mettreAJour(Etat e) {
          this.etat = e;
          for (Ecouteur l : ecouteurs) l.notifier(e);      // code extérieur sous verrou
      }
      ```
    choices:
      - {text: "Déclarer la liste `ecouteurs` `volatile` pour que chacun voie le nouvel état", correct: false}
      - {text: "Mettre à jour l'état sous verrou, puis notifier une copie des écouteurs hors verrou", correct: true}
      - {text: "Remplacer `synchronized` par un `ReentrantLock` pris autour de toute la boucle", correct: false}
      - {text: "Notifier les écouteurs avant de modifier l'état, toujours sous le verrou", correct: false}
    answer: |-
      ```java
      void mettreAJour(Etat e) {
          List<Ecouteur> aPrevenir;
          synchronized (this) {
              this.etat = e;
              aPrevenir = List.copyOf(ecouteurs);
          }
          for (Ecouteur l : aPrevenir) l.notifier(e);      // hors verrou
      }
      ```
      Un code extérieur appelé sous verrou peut prendre d'autres verrous dans un ordre inconnu. On met à jour l'état sous
      verrou, puis on notifie hors verrou.
  - key: bug-pool
    format: bug-fix
    question: |-
      Sous charge, ce traitement se fige complètement. Pourquoi ?
      ```java
      ExecutorService pool = Executors.newFixedThreadPool(8);
      Future<Rapport> f = pool.submit(() -> {
          Future<Donnees> d = pool.submit(this::charger);   // même pool
          return construire(d.get());
      });
      ```
    choices:
      - {text: "Les 8 threads attendent des sous-tâches restées dans la file du même pool", correct: true}
      - {text: "`submit` dans une tâche lève une exception que le `Future` avale", correct: false}
      - {text: "La file du pool est bornée et rejette les sous-tâches en trop", correct: false}
      - {text: "Un `FixedThreadPool` ne crée ses threads qu'à son arrêt", correct: false}
    answer: |-
      ```java
      CompletableFuture<Rapport> rapport = CompletableFuture
              .supplyAsync(this::charger, poolEntreesSorties)
              .thenApply(this::construire);
      ```
      Quand les 8 threads attendent tous une sous-tâche placée dans la file du même pool, plus personne ne l'exécute. On
      compose sans bloquer (ou on utilise deux pools distincts, ou des threads virtuels).
  - key: bug-trylock
    format: bug-fix
    question: |-
      Ce code peut attendre indéfiniment deux ressources partagées avec d'autres modules. Quelle correction est la bonne ?
      ```java
      verrouA.lock();
      verrouB.lock();
      try { traiter(); } finally { verrouB.unlock(); verrouA.unlock(); }
      ```
    choices:
      - {text: "Prendre les verrous avec `lockInterruptibly()` pour pouvoir les rendre ensuite", correct: false}
      - {text: "Prendre chaque verrou par `tryLock` avec un délai, tout relâcher et réessayer en cas d'échec", correct: true}
      - {text: "Rendre les verrous équitables, avec `new ReentrantLock(true)`, pour servir chacun", correct: false}
      - {text: "Rendre `verrouA` avant `verrouB` dans le `finally`, dans l'ordre de leur prise", correct: false}
    answer: |-
      ```java
      if (verrouA.tryLock(1, SECONDS)) {
          try {
              if (verrouB.tryLock(1, SECONDS)) {
                  try { traiter(); } finally { verrouB.unlock(); }
              } else {
                  planifierNouvelEssai();
              }
          } finally {
              verrouA.unlock();
          }
      }
      ```
      Avec `tryLock` et un délai, le thread abandonne au lieu de rester bloqué, relâche ce qu'il détient et réessaie
      (avec un délai aléatoire, pour éviter un livelock).
  - key: scenario-application-figee
    format: scenario
    question: "L'application est figée en production, le CPU est à zéro. Que fais-tu d'abord ?"
    choices:
      - {text: "Je prends plusieurs thread dumps, à quelques secondes d'intervalle, pour voir ce que les threads attendent", correct: true}
      - {text: "J'augmente la taille du tas (`-Xmx`) : un CPU à zéro signale un manque de mémoire", correct: false}
      - {text: "Je double le nombre de threads des pools pour absorber les requêtes en attente", correct: false}
      - {text: "Je prends un heap dump et je cherche les objets les plus gros en mémoire", correct: false}
    answer: |-
      Un CPU à zéro avec des requêtes en attente évoque un blocage, pas une surcharge. Je prends plusieurs thread dumps
      (`jcmd <pid> Thread.print`) à quelques secondes d'intervalle : la JVM signale les interblocages de moniteurs et de
      `ReentrantLock`, sinon je cherche les threads `BLOCKED` ou `WAITING` et ce qu'ils attendent (un verrou, une
      connexion du pool de base, un `Future.get()` dans un pool saturé). Je redémarre pour rétablir le service, puis je
      corrige la cause : ordre des verrous, appel extérieur sous verrou, pool partagé entre tâches dépendantes.
  - key: scenario-conception
    format: scenario
    question: Comment conçois-tu un module pour qu'il ne puisse pas provoquer d'interblocage ?
    choices:
      - {text: "Je n'utilise que `synchronized`, dont la JVM sait rompre seule les cycles d'attente", correct: false}
      - {text: "Je donne une priorité plus haute aux threads qui détiennent déjà un verrou", correct: false}
      - {text: "J'évite de prendre plusieurs verrous : état immuable, structures concurrentes ou un seul thread propriétaire", correct: true}
      - {text: "J'imbrique les verrous librement, avec des `Thread.sleep` pour espacer les prises", correct: false}
    answer: |-
      En évitant d'avoir à prendre plusieurs verrous : état immuable, structures concurrentes (`ConcurrentHashMap`,
      `AtomicReference`), ou un seul thread propriétaire de l'état à qui les autres envoient des messages (une file). Si
      plusieurs verrous sont inévitables, je fixe un ordre global documenté, je ne fais ni entrée-sortie ni appel
      extérieur sous verrou, je borne les attentes par des délais (`tryLock`, timeouts des pools de connexions), et je
      sépare les pools des tâches qui dépendent les unes des autres.
  - key: scenario-base-donnees
    format: scenario
    question: Deux transactions concurrentes en base se bloquent mutuellement et l'une est annulée par PostgreSQL. Comment le traites-tu ?
    choices:
      - {text: "Je passe en isolation `SERIALIZABLE`, qui empêche tout interblocage entre transactions", correct: false}
      - {text: "Je désactive la détection d'interblocage de PostgreSQL pour éviter les annulations", correct: false}
      - {text: "Je mets à jour les lignes dans un ordre stable, et je rejoue la transaction annulée si elle est idempotente", correct: true}
      - {text: "Je rends `synchronized` la méthode Java qui ouvre la transaction, et rien d'autre", correct: false}
    answer: |-
      La base détecte l'interblocage et annule une des transactions (`deadlock detected`). Je l'évite en mettant à jour
      les lignes dans un ordre stable (par identifiant), en gardant les transactions courtes, et en verrouillant
      explicitement dès le début ce qu'on va modifier (`SELECT ... FOR UPDATE` dans l'ordre). Comme il peut toujours
      arriver, je traite l'échec comme transitoire : la transaction est rejouée quelques fois avec un délai, si
      l'opération est idempotente.
  - key: scenario-famine
    format: scenario
    question: Des petites requêtes rapides attendent parfois longtemps derrière des exports lourds dans le même pool. Que proposes-tu ?
    choices:
      - {text: "J'agrandis le pool partagé jusqu'à ce que les requêtes rapides n'attendent plus", correct: false}
      - {text: "Je donne aux threads des requêtes rapides une priorité plus haute (`setPriority`)", correct: false}
      - {text: "Je sépare les charges : un pool borné pour les exports, un autre pour les requêtes interactives", correct: true}
      - {text: "Je rends le pool équitable, pour que chaque tâche passe à son tour dans l'ordre", correct: false}
    answer: |-
      C'est une forme de famine : les tâches longues monopolisent les threads. Je sépare les charges : un pool dédié (et
      borné) aux exports, un autre pour les requêtes interactives, pour que les unes ne bloquent jamais les autres
      (principe de la cloison, *bulkhead*). Je peux aussi découper les exports en morceaux, ou les déplacer dans une file
      traitée en arrière-plan. Des métriques sur la taille des files et le temps d'attente confirment l'effet.
