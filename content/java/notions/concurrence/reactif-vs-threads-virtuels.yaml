notion: reactif-vs-threads-virtuels
cards:
  - key: virtual-threads-rendent-ils-reactif-obsolete
    format: course
    question: Les virtual threads rendent-ils le réactif obsolète ?
    answer: Non, mais ils couvrent l'essentiel du besoin de scalabilité I/O ; le réactif garde l'avantage sur le streaming et la backpressure.
  - key: equipe-hesite-migrer-service-spring-mvc
    format: scenario
    question: L'équipe hésite à migrer un service Spring MVC vers WebFlux pour la performance.
    answer: |-
      Je demanderais d'abord ce qu'on mesure comme limite. Si c'est le nombre de requêtes concurrentes qui attendent de l'I/O, activer les **virtual threads** dans Spring Boot (`spring.threads.virtual.enabled=true`) donne souvent le gain recherché sans toucher au code.
      Une migration vers WebFlux implique de remplacer toute la chaîne bloquante (JPA par R2DBC, clients HTTP, bibliothèques), de former l'équipe et d'accepter un débogage plus difficile. Elle se justifie si le service fait du **streaming**, a besoin de backpressure de bout en bout, ou s'intègre dans une chaîne déjà réactive. Sinon c'est beaucoup de risque pour un gain qu'on peut obtenir autrement.
