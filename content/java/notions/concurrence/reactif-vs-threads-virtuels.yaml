notion: reactif-vs-threads-virtuels
lesson: |-
  Réactif et threads virtuels répondent au **même problème** : servir beaucoup de requêtes qui **attendent** (réseau,
  base) sans un thread de plateforme coûteux par requête. Ils le résolvent différemment :

  | | Réactif (Reactor, Mutiny) | Threads virtuels |
  |---|---|---|
  | style | pipelines d'opérateurs, non bloquant | code séquentiel, bloquant |
  | écosystème | pilotes réactifs requis (R2DBC, clients réactifs) | bibliothèques bloquantes classiques (JDBC, JPA) |
  | lisibilité, débogage | plus difficiles (traces fragmentées) | traces de pile complètes, débogueur classique |
  | contre-pression | native, de bout en bout | à construire (files bornées, sémaphores) |
  | streaming | excellent (flux infinis, SSE, WebSocket) | possible, moins naturel |
  | contexte | `Context` de Reactor | `ScopedValue`, ou `ThreadLocal` léger |
  | disponibilité | depuis longtemps | Java 21 (mieux avec 24 : plus d'épinglage sur `synchronized`) |

  Comment choisir :
  - un service **CRUD** ou d'**agrégation** qui appelle des bases et des API : **threads virtuels**, avec un framework
    classique (`spring.threads.virtual.enabled=true`, `@RunOnVirtualThread` dans Quarkus) ;
  - du **streaming** d'événements, une contre-pression de bout en bout, une chaîne **déjà réactive** : le **réactif** reste
    pertinent ;
  - une application existante en **WebFlux** qui fonctionne : pas de réécriture sans raison mesurée ;
  - dans les deux cas, les ressources aval gardent leurs limites : on borne et on met des délais.

  Quarkus illustre le mélange : un cœur réactif (Vert.x, Mutiny), et le choix, méthode par méthode, d'un mode
  réactif, bloquant sur un pool, ou bloquant sur un thread virtuel.

  **Piège classique** : réécrire un service Spring MVC en WebFlux « pour les performances ». Les threads virtuels donnent
  souvent le même gain de concurrence pour une ligne de configuration, sans toucher au code ni à l'équipe.

  **En entretien** : « Les threads virtuels couvrent l'essentiel de la scalabilité des entrées-sorties avec un code
  simple ; le réactif garde l'avantage pour le streaming et la contre-pression de bout en bout. Je choisis selon le
  besoin mesuré. »
cards:
  - key: virtual-threads-rendent-ils-reactif-obsolete
    format: course
    question: Les virtual threads rendent-ils le réactif obsolète ?
    answer: Non, mais ils couvrent l'essentiel du besoin de scalabilité I/O ; le réactif garde l'avantage sur le streaming et la backpressure.
  - key: meme-probleme
    format: course
    question: Quel problème commun résolvent le réactif et les threads virtuels ?
    answer: Servir un grand nombre de requêtes qui attendent des entrées-sorties sans immobiliser un thread de plateforme coûteux par requête.
  - key: ecosysteme
    format: course
    question: Quelle contrainte d'écosystème distingue les deux approches ?
    answer: Le réactif exige des bibliothèques non bloquantes sur toute la chaîne (R2DBC, clients réactifs) ; les threads virtuels fonctionnent avec les bibliothèques bloquantes classiques (JDBC, JPA).
  - key: quarkus
    format: course
    question: Comment Quarkus combine-t-il les deux modèles ?
    answer: Son cœur est réactif (Vert.x, Mutiny), et chaque point d'entrée peut être réactif, bloquant sur un pool de travail, ou bloquant sur un thread virtuel (`@RunOnVirtualThread`).
  - key: vf-jpa-virtuels
    format: true-false
    question: JPA fonctionne avec des threads virtuels.
    truth: true
    answer: Les appels bloquants démontent simplement le thread virtuel.
  - key: vf-contre-pression
    format: true-false
    question: Les threads virtuels apportent une contre-pression de bout en bout comme Reactive Streams.
    truth: false
    answer: Elle se construit à part (files bornées, sémaphores).
  - key: vf-reecrire
    format: true-false
    question: Un service WebFlux qui fonctionne bien doit être réécrit avec des threads virtuels.
    truth: false
    answer: Pas sans raison mesurée.
  - key: vf-debogage
    format: true-false
    question: Les traces de pile sont plus lisibles avec des threads virtuels qu'avec un pipeline réactif.
    truth: true
    answer: Le code séquentiel garde une pile d'appels complète.
  - key: qcm-choix
    format: multiple-choice
    question: Pour quels cas les threads virtuels sont-ils le choix le plus simple ?
    choices:
      - text: "Une API CRUD sur PostgreSQL avec JPA"
        correct: true
      - text: "Un agrégateur qui appelle cinq API par requête"
        correct: true
      - text: "Un flux continu de cotations boursières poussé à des milliers de clients"
        correct: false
      - text: "Une chaîne Kafka réactive de bout en bout"
        correct: false
    answer: Le streaming et les chaînes réactives restent le terrain du réactif.
  - key: qcm-activer
    format: multiple-choice
    question: Comment profiter des threads virtuels sans réécrire un service Spring MVC ?
    choices:
      - text: "`spring.threads.virtual.enabled=true` (Spring Boot 3.2+)"
        correct: true
      - text: "Migrer vers WebFlux"
        correct: false
      - text: "Remplacer JPA par R2DBC"
        correct: false
      - text: "Augmenter la taille du pool Tomcat à 10 000"
        correct: false
    answer: Une ligne de configuration, avec Java 21+.
  - key: qcm-commun
    format: multiple-choice
    question: Quelle précaution vaut dans les deux modèles ?
    choices:
      - text: "Borner les appels aux ressources aval et mettre des délais"
        correct: true
      - text: "Supprimer les pools de connexions"
        correct: false
      - text: "Désactiver les logs"
        correct: false
      - text: "Utiliser `Thread.sleep` pour réguler le débit"
        correct: false
    answer: Le nombre de requêtes servies ne change pas la capacité de la base.
  - key: qcm-reactif
    format: multiple-choice
    question: Qu'est-ce que le réactif fait mieux que les threads virtuels ?
    choices:
      - text: "Le streaming de flux continus avec contre-pression"
        correct: true
      - text: "La composition d'événements dans le temps (fenêtres, débouncing, `switchMap`)"
        correct: true
      - text: "La lisibilité d'un CRUD simple"
        correct: false
      - text: "L'utilisation de JDBC"
        correct: false
    answer: Ses opérateurs sont faits pour les flux d'événements.
  - key: equipe-hesite-migrer-service-spring-mvc
    format: scenario
    question: L'équipe hésite à migrer un service Spring MVC vers WebFlux pour la performance.
    answer: |-
      Je demanderais d'abord ce qu'on mesure comme limite. Si c'est le nombre de requêtes concurrentes qui attendent de l'I/O, activer les **virtual threads** dans Spring Boot (`spring.threads.virtual.enabled=true`) donne souvent le gain recherché sans toucher au code.
      Une migration vers WebFlux implique de remplacer toute la chaîne bloquante (JPA par R2DBC, clients HTTP, bibliothèques), de former l'équipe et d'accepter un débogage plus difficile. Elle se justifie si le service fait du **streaming**, a besoin de backpressure de bout en bout, ou s'intègre dans une chaîne déjà réactive. Sinon c'est beaucoup de risque pour un gain qu'on peut obtenir autrement.
  - key: scenario-nouveau-projet
    format: scenario
    question: Pour un nouveau projet Java 25, choisirais-tu un framework réactif ou bloquant ?
    answer: |-
      Par défaut, un modèle bloquant sur threads virtuels : code séquentiel, bibliothèques classiques (JPA, JDBC), traces
      de pile complètes, équipe opérationnelle tout de suite, et une scalabilité suffisante pour la grande majorité des
      services d'entrées-sorties. Je garderais le réactif pour les parties qui font réellement du streaming (événements
      serveur, WebSocket, traitement de flux Kafka) ou qui ont besoin de contre-pression. Des frameworks comme Quarkus
      permettent de mélanger les deux selon les points d'entrée.
  - key: scenario-mesurer
    format: scenario
    question: Comment compares-tu objectivement les deux approches pour un service donné ?
    answer: |-
      Avec un test de charge réaliste (Gatling, k6) sur deux prototypes du chemin critique : même scénario, mêmes
      dépendances simulées avec leurs latences réelles. Je compare le débit, la latence (percentiles 95 et 99), la mémoire
      et le CPU sous charge croissante, puis le comportement en cas de lenteur d'une dépendance. J'ajoute les critères
      non mesurables par un benchmark : complexité du code, facilité de débogage, compétences de l'équipe. Souvent, les
      performances sont proches et ce sont ces derniers critères qui décident.
  - key: scenario-mixte
    format: scenario
    question: Un service doit à la fois exposer un CRUD classique et pousser des notifications en temps réel aux navigateurs. Comment l'organises-tu ?
    answer: |-
      Le CRUD en style bloquant sur threads virtuels, avec JPA : simple et lisible. Les notifications en temps réel avec
      un point d'entrée réactif (SSE ou WebSocket avec Reactor ou Mutiny), qui pousse un flux d'événements alimenté par
      un bus (Kafka, ou un `Sinks.Many` en mémoire pour une seule instance) avec une stratégie de contre-pression pour
      les clients lents (abandon des anciens messages). Les deux coexistent dans la même application, chaque partie
      utilisant le modèle adapté.
