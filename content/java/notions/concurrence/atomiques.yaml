notion: atomiques
lesson: |-
  Les classes de `java.util.concurrent.atomic` font des mises à jour **atomiques sans verrou**, grâce à l'instruction
  processeur **CAS** (*compare-and-swap*) : « si la valeur vaut encore A, remplace-la par B, sinon échoue ».

  ```java
  AtomicInteger compteur = new AtomicInteger();
  compteur.incrementAndGet();                       // ++compteur, atomique
  compteur.addAndGet(5);
  compteur.updateAndGet(x -> Math.min(x * 2, 100));  // fonction appliquée atomiquement
  compteur.accumulateAndGet(7, Math::max);

  AtomicBoolean demarre = new AtomicBoolean();
  if (demarre.compareAndSet(false, true)) { demarrer(); }   // un seul thread gagne

  AtomicReference<Config> config = new AtomicReference<>(Config.defaut());
  config.updateAndGet(c -> c.avecDelai(30));

  LongAdder requetes = new LongAdder();             // compteur très sollicité
  requetes.increment();
  long total = requetes.sum();
  ```

  - Une boucle **CAS** : lire la valeur, calculer la nouvelle, `compareAndSet` ; si un autre thread est passé entre-temps,
    recommencer. `updateAndGet` fait cette boucle pour nous : la fonction peut donc être appelée **plusieurs fois** et
    doit être **sans effet de bord**.
  - **`LongAdder`** répartit les incréments sur plusieurs cellules : bien plus rapide sous forte contention, mais `sum()`
    n'est pas un instantané exact pendant les mises à jour. Idéal pour des métriques ; `AtomicLong` pour un identifiant
    ou une valeur lue souvent.
  - Les atomiques protègent **une** variable. Deux variables liées (un minimum et un maximum) demandent un verrou, ou un
    objet immuable dans une `AtomicReference`.
  - Le **problème ABA** : un CAS réussit si la valeur est revenue à A après être passée par B ; `AtomicStampedReference`
    ajoute un compteur de version.

  **Piège classique** : `if (compteur.get() < max) compteur.incrementAndGet();`. Chaque appel est atomique, pas la séquence :
  on dépasse le maximum. Il faut `updateAndGet(x -> x < max ? x + 1 : x)` ou une boucle `compareAndSet`.

  **En entretien** : « Des mises à jour atomiques par CAS, sans verrou ; `updateAndGet` avec une fonction pure,
  `LongAdder` pour les compteurs très sollicités, et un verrou dès que plusieurs variables doivent changer ensemble. »
cards:
  - key: cas
    format: course
    question: "Qu'est-ce que le CAS (Compare-And-Swap) ?"
    choices:
      - {text: "Une instruction atomique du processeur : elle écrit seulement si la valeur est encore celle attendue", correct: true}
      - {text: "Un verrou léger que la JVM pose sur un objet le temps d'une seule écriture", correct: false}
      - {text: "Une copie de la variable dans chaque thread, fusionnée à la fin du calcul", correct: false}
      - {text: "Un mot-clé Java qui rend une méthode atomique, comme `synchronized`", correct: false}
    answer: "Compare-And-Swap : une instruction atomique du processeur qui remplace la valeur seulement si elle vaut encore celle attendue. Les classes `Atomic*` s'en servent pour se passer de verrou."
  - key: longadder-vs-atomiclong
    format: course
    question: "Quand préférer `LongAdder` à `AtomicLong` ?"
    choices:
      - {text: "Pour un compteur incrémenté par beaucoup de threads et lu rarement, comme une métrique", correct: true}
      - {text: "Pour un identifiant unique, qu'on lit juste après chaque incrément", correct: false}
      - {text: "Pour une valeur qu'on compare et remplace avec `compareAndSet`", correct: false}
      - {text: "Pour un compteur lu très souvent et rarement modifié par les threads", correct: false}
    answer: "`LongAdder` répartit les écritures sous contention et ne les additionne qu'à la lecture (`sum()`) : idéal pour des métriques. `AtomicLong` reste le bon choix pour une valeur lue souvent, un identifiant ou un `compareAndSet`."
  - key: probleme-aba
    format: course
    question: "Qu'est-ce que le problème ABA ?"
    choices:
      - {text: "Un CAS réussit alors que la valeur a changé, puis est revenue à l'identique", correct: true}
      - {text: "Deux threads s'attendent, chacun tenant le verrou dont l'autre a besoin", correct: false}
      - {text: "Un CAS échoue sans fin, car un autre thread modifie toujours la valeur", correct: false}
      - {text: "Une lecture voit une valeur `long` à moitié écrite, sur 64 bits", correct: false}
    answer: "Entre la lecture et le CAS, la valeur passe de A à B puis revient à A : le CAS réussit sans voir le changement. `AtomicStampedReference` ajoute un numéro de version pour le détecter."
  - key: update-pure
    format: course
    question: Pourquoi la fonction passée à `updateAndGet` doit-elle être sans effet de bord ?
    choices:
      - {text: "Elle peut être rejouée plusieurs fois, si un autre thread modifie la valeur entre-temps", correct: true}
      - {text: "Elle s'exécute sous un verrou, et un effet de bord risquerait un interblocage", correct: false}
      - {text: "Elle s'exécute dans un autre thread, qui ne voit pas les variables de l'appelant", correct: false}
      - {text: "Le JIT supprime les effets de bord des fonctions passées aux classes atomiques", correct: false}
    answer: Parce qu'elle est appelée dans une boucle CAS et peut être rejouée plusieurs fois si un autre thread modifie la valeur entre-temps.
  - key: plusieurs-variables
    format: course
    question: Comment mettre à jour atomiquement deux valeurs liées (min et max) ?
    choices:
      - {text: "Deux `AtomicLong`, mis à jour l'un après l'autre avec `accumulateAndGet`", correct: false}
      - {text: "Les regrouper dans un objet immuable, remplacé par `AtomicReference.updateAndGet`", correct: true}
      - {text: "Deux champs `volatile`, écrits dans le même ordre par chaque thread", correct: false}
      - {text: "Deux `AtomicLong`, lus ensemble avec `get()` dans la même instruction", correct: false}
    answer: "Un objet immuable qui porte les deux valeurs, remplacé en bloc par `AtomicReference.updateAndGet` (ou un verrou). Deux atomiques séparées sont chacune cohérente, mais pas leur couple."
  - key: vf-verrou
    format: true-false
    question: "`AtomicInteger.incrementAndGet` utilise un verrou."
    truth: false
    answer: Il repose sur une instruction CAS du processeur.
  - key: vf-sequence
    format: true-false
    question: "`if (a.get() < 10) a.incrementAndGet();` garantit que `a` ne dépasse jamais 10."
    truth: false
    answer: Le test et l'incrément ne sont pas atomiques ensemble.
  - key: vf-longadder-sum
    format: true-false
    question: "`LongAdder.sum()` est un instantané exact même pendant des incréments concurrents."
    truth: false
    answer: C'est une somme des cellules à un moment non garanti ; elle est exacte une fois les mises à jour terminées.
  - key: vf-compare
    format: true-false
    question: "`compareAndSet(false, true)` sur un `AtomicBoolean` ne réussit que pour un seul thread."
    truth: true
    answer: Les suivants trouvent `true` et échouent.
  - key: qcm-compteur
    format: multiple-choice
    question: Quel choix pour un compteur de requêtes incrémenté par des centaines de threads et lu toutes les minutes ?
    choices:
      - text: "`LongAdder`"
        correct: true
      - text: "`AtomicLong`, correct mais plus lent sous contention"
        correct: false
      - text: "`volatile long`"
        correct: false
      - text: "`long` dans une méthode `synchronized`"
        correct: false
    answer: '`LongAdder` réduit la contention sur une seule variable.'
  - key: qcm-borne
    format: multiple-choice
    question: "Laquelle de ces instructions incrémente un compteur `AtomicInteger c` sans jamais dépasser 100, atomiquement ?"
    choices:
      - {text: "`if (c.get() < 100) c.incrementAndGet();`", correct: false}
      - {text: "`c.updateAndGet(x -> x < 100 ? x + 1 : x)`", correct: true}
      - {text: "`c.set(Math.min(c.get() + 1, 100))`", correct: false}
      - {text: "`c.incrementAndGet(); if (c.get() > 100) c.set(100);`", correct: false}
    answer: "`updateAndGet` rejoue la fonction dans une boucle CAS jusqu'à réussir (une boucle `compareAndSet` écrite à la main marche aussi). Les autres lisent puis écrivent en deux temps : un autre thread peut passer entre les deux."
  - key: qcm-une-fois
    format: multiple-choice
    question: Comment garantir qu'une initialisation ne s'exécute qu'une fois, même appelée par plusieurs threads ?
    choices:
      - text: "`if (fait.compareAndSet(false, true)) initialiser();`"
        correct: true
      - text: "`if (!fait.get()) { fait.set(true); initialiser(); }`"
        correct: false
      - text: "`volatile boolean fait; if (!fait) { initialiser(); fait = true; }`"
        correct: false
      - text: "`fait.set(true); initialiser();`"
        correct: false
    answer: '`compareAndSet` fait du test et de l''écriture une seule opération.'
  - key: qcm-reference
    format: multiple-choice
    question: "À quoi sert `AtomicReference<V>` ?"
    choices:
      - {text: "Remplacer atomiquement une référence, par exemple vers un objet immuable", correct: true}
      - {text: "Rendre l'objet référencé thread-safe, quelles que soient ses méthodes", correct: false}
      - {text: "Donner à chaque thread sa propre copie de l'objet référencé", correct: false}
      - {text: "Verrouiller l'objet référencé pendant chacun de ses appels de méthode", correct: false}
    answer: Seule la référence est atomique ; l'objet doit être immuable pour être sûr.
  - key: trous-increment
    format: fill-in
    question: |-
      Complète l'incrément atomique :
      ```java
      int numero = compteur.___();
      ```
    blanks: [[incrementAndGet, getAndIncrement]]
    answer: Renvoie la valeur après (ou avant) l'incrément.
  - key: trous-cas
    format: fill-in
    question: |-
      Complète pour qu'un seul thread démarre le service :
      ```java
      if (demarre.___(false, true)) {
          lancer();
      }
      ```
    blanks: [[compareAndSet]]
    answer: Le CAS ne réussit qu'une fois.
  - key: trous-update
    format: fill-in
    question: |-
      Complète pour garder le maximum observé :
      ```java
      maximum.___(x -> Math.max(x, mesure));
      ```
    blanks: [[updateAndGet, getAndUpdate]]
    answer: Ou `accumulateAndGet(mesure, Math::max)`.
  - key: trous-adder
    format: fill-in
    question: |-
      Complète le compteur de métriques :
      ```java
      private final ___ appels = new ___();
      void compter() { appels.increment(); }
      ```
    blanks: [[LongAdder], [LongAdder]]
    answer: Pensé pour les incréments très concurrents.
  - key: code-operations
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.util.concurrent.atomic.*;
      AtomicInteger a = new AtomicInteger(5);
      System.out.println(a.getAndIncrement() + " " + a.incrementAndGet() + " " + a.addAndGet(10)
              + " " + a.updateAndGet(x -> x * 2) + " " + a.accumulateAndGet(100, Math::min));
      ```
    choices:
      - {text: "`5 7 17 34 34`", correct: true}
      - {text: "`6 7 17 34 34`", correct: false}
      - {text: "`5 6 16 32 32`", correct: false}
      - {text: "`5 7 17 34 100`", correct: false}
    answer: "`5 7 17 34 34` : `getAndIncrement` renvoie l'ancienne valeur (5) puis passe à 6, `incrementAndGet` la nouvelle (7), puis 17, 34, et `accumulateAndGet(100, Math::min)` garde `min(34, 100)`."
    check:
      output: "5 7 17 34 34"
  - key: code-cas
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.util.concurrent.atomic.*;
      AtomicInteger a = new AtomicInteger(1);
      System.out.println(a.compareAndSet(1, 2) + " " + a.compareAndSet(1, 3) + " " + a.get());
      ```
    choices:
      - {text: "`true true 3`", correct: false}
      - {text: "`true false 1`", correct: false}
      - {text: "`false false 1`", correct: false}
      - {text: "`true false 2`", correct: true}
    answer: '`true false 2` : le second CAS échoue, la valeur n''est plus 1.'
    check:
      output: "true false 2"
  - key: code-adder
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.util.concurrent.atomic.*;
      LongAdder adder = new LongAdder();
      try (var pool = Executors.newFixedThreadPool(8)) {
          for (int i = 0; i < 1000; i++) pool.submit(adder::increment);
      }
      System.out.println(adder.sum());
      ```
    choices:
      - {text: "`1000`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`8`", correct: false}
      - {text: "`999`", correct: false}
    answer: "`1000` : la fermeture du pool (try-with-resources) attend la fin des tâches, et `LongAdder` ne perd aucun incrément. `sum()` est exact une fois les écritures finies."
    check:
      output: "1000"
  - key: code-une-fois
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.util.concurrent.atomic.*;
      AtomicBoolean fait = new AtomicBoolean();
      AtomicInteger initialisations = new AtomicInteger();
      try (var pool = Executors.newFixedThreadPool(8)) {
          for (int i = 0; i < 100; i++) {
              pool.submit(() -> { if (fait.compareAndSet(false, true)) initialisations.incrementAndGet(); });
          }
      }
      System.out.println(initialisations.get());
      ```
    choices:
      - {text: "`100`", correct: false}
      - {text: "`8`", correct: false}
      - {text: "`1`", correct: true}
      - {text: "`0`", correct: false}
    answer: "`1` : `compareAndSet(false, true)` ne réussit qu'une fois ; les 99 autres essais trouvent `true` et échouent."
    check:
      output: "1"
  - key: bug-sequence
    format: bug-fix
    question: |-
      Plus de places que prévu sont vendues. Quelle correction est la bonne ?
      ```java
      private final AtomicInteger vendues = new AtomicInteger();
      boolean vendre() {
          if (vendues.get() < CAPACITE) {
              vendues.incrementAndGet();
              return true;
          }
          return false;
      }
      ```
    choices:
      - {text: "Déclarer `vendues` `volatile`, pour que chaque thread voie la dernière valeur", correct: false}
      - {text: "Une boucle `compareAndSet` qui n'incrémente que si la valeur lue n'a pas changé", correct: true}
      - {text: "Remplacer `incrementAndGet()` par `getAndIncrement()`, qui lit avant d'écrire", correct: false}
      - {text: "Relire `vendues.get()` juste avant `incrementAndGet()`, pour confirmer", correct: false}
    answer: |-
      ```java
      boolean vendre() {
          while (true) {
              int actuel = vendues.get();
              if (actuel >= CAPACITE) return false;
              if (vendues.compareAndSet(actuel, actuel + 1)) return true;
          }
      }
      ```
      Plusieurs threads passent le test avant l'incrément. La boucle CAS n'incrémente que si la valeur n'a pas changé
      depuis la lecture.
  - key: bug-effet-bord
    format: bug-fix
    question: |-
      Le journal montre parfois deux lignes pour une seule mise à jour. Pourquoi ?
      ```java
      solde.updateAndGet(s -> {
          journal.info("ancien solde {}", s);
          return s + depot;
      });
      ```
    choices:
      - {text: "La fonction d'`updateAndGet` est rejouée quand un autre thread modifie la valeur entre-temps", correct: true}
      - {text: "`updateAndGet` appelle toujours la fonction deux fois : une pour calculer, une pour vérifier", correct: false}
      - {text: "Le journal n'est pas thread-safe et duplique les lignes écrites au même moment", correct: false}
      - {text: "`depot` change pendant l'appel, et `updateAndGet` relance alors un second dépôt", correct: false}
    answer: |-
      ```java
      long ancien = solde.getAndAdd(depot);
      journal.info("ancien solde {}", ancien);
      ```
      La fonction d'`updateAndGet` est rejouée si un autre thread modifie la valeur entre-temps : son effet de bord se
      répète. On garde la fonction pure, et on journalise après, avec la valeur renvoyée.
  - key: bug-deux-variables
    format: bug-fix
    question: |-
      Le minimum et le maximum sont parfois incohérents (min > max). Quelle correction est la bonne ?
      ```java
      private final AtomicLong min = new AtomicLong(Long.MAX_VALUE);
      private final AtomicLong max = new AtomicLong(Long.MIN_VALUE);
      void mesurer(long v) { min.accumulateAndGet(v, Math::min); max.accumulateAndGet(v, Math::max); }
      Plage plage() { return new Plage(min.get(), max.get()); }
      ```
    choices:
      - {text: "Déclarer `min` et `max` `volatile`, en plus d'être atomiques", correct: false}
      - {text: "Inverser l'ordre des deux `accumulateAndGet` dans `mesurer`", correct: false}
      - {text: "Remplacer `accumulateAndGet` par `updateAndGet` sur chaque champ", correct: false}
      - {text: "Un record `Plage` immuable, remplacé en bloc dans une `AtomicReference`", correct: true}
    answer: |-
      ```java
      record Plage(long min, long max) {
          Plage avec(long v) { return new Plage(Math.min(min, v), Math.max(max, v)); }
      }
      private final AtomicReference<Plage> plage = new AtomicReference<>(new Plage(Long.MAX_VALUE, Long.MIN_VALUE));
      void mesurer(long v) { plage.updateAndGet(p -> p.avec(v)); }
      Plage plage() { return plage.get(); }
      ```
      Deux atomiques séparées ne forment pas un état cohérent. Un objet immuable remplacé en bloc garde les deux valeurs
      ensemble.
  - key: bug-synchronized-compteur
    format: bug-fix
    question: |-
      Ce compteur de métriques, appelé à chaque requête, devient un point de contention. Quelle correction est la bonne ?
      ```java
      private long requetes;
      synchronized void compter() { requetes++; }
      ```
    choices:
      - {text: "Un champ `volatile long`, incrémenté sans `synchronized`", correct: false}
      - {text: "Un `LongAdder`, qui répartit les incréments et les additionne à la lecture", correct: true}
      - {text: "Un bloc `synchronized (this)` autour du seul `requetes++`", correct: false}
      - {text: "Un `ReentrantLock` équitable à la place de `synchronized`", correct: false}
    answer: |-
      ```java
      private final LongAdder requetes = new LongAdder();
      void compter() { requetes.increment(); }
      long requetes() { return requetes.sum(); }
      ```
      Un verrou sérialise tous les threads. `LongAdder` répartit les incréments et ne les combine qu'à la lecture.
  - key: definition-cas
    format: definition
    question: "Que signifie CAS, en programmation concurrente ?"
    choices:
      - {text: "Concurrent Access Synchronization : le verrou interne de chaque objet Java", correct: false}
      - {text: "Copy-And-Share : la copie d'une variable dans le cache de chaque thread", correct: false}
      - {text: "Cache-Aware Scheduling : la répartition des threads selon les caches", correct: false}
      - {text: "Compare-And-Swap : une instruction atomique à la base des classes `Atomic*`", correct: true}
    answer: "Compare-And-Swap : une instruction atomique qui remplace une valeur seulement si elle vaut encore celle attendue. Elle est à la base des classes `Atomic*`."
  - key: definition-sans-verrou
    format: definition
    question: "Qu'est-ce qu'un algorithme sans verrou (lock-free) ?"
    choices:
      - {text: "Un algorithme où chaque thread progresse en un nombre borné d'étapes, quoi qu'il arrive", correct: false}
      - {text: "Un algorithme qui n'utilise que des variables locales, jamais partagées entre threads", correct: false}
      - {text: "Un algorithme qui remplace tous ses verrous par de simples champs `volatile`", correct: false}
      - {text: "Un algorithme où au moins un thread progresse toujours, sans blocage, grâce à des CAS", correct: true}
    answer: "Au moins un thread progresse toujours, sans blocage, en général grâce à des CAS. Garantir que **chaque** thread progresse en un nombre borné d'étapes, c'est plus fort : on dit « sans attente » (wait-free)."
  - key: definition-contention
    format: definition
    question: "Qu'est-ce que la contention ?"
    choices:
      - {text: "Deux threads qui attendent chacun un verrou que tient l'autre, pour toujours", correct: false}
      - {text: "Beaucoup de threads qui se disputent la même ressource, et qui attendent ou réessaient", correct: true}
      - {text: "Un thread qui n'obtient jamais le processeur, car d'autres passent toujours avant", correct: false}
      - {text: "Deux threads qui modifient la même variable sans aucune synchronisation", correct: false}
    answer: "La concurrence de nombreux threads pour la même ressource (un verrou, une variable), qui les fait attendre ou réessayer. L'attente mutuelle sans fin, c'est un interblocage ; le thread jamais servi, une famine."
  - key: definition-aba
    format: definition
    question: "Que désigne le problème ABA, avec un CAS ?"
    choices:
      - {text: "Un CAS réussit car la valeur est revenue à A, alors qu'elle est passée par B entre-temps", correct: true}
      - {text: "Deux CAS sur A et B, faits dans un ordre différent par deux threads, s'attendent", correct: false}
      - {text: "Un CAS sur A échoue toujours, car un thread B le modifie à chaque fois avant lui", correct: false}
      - {text: "Un thread lit A, un autre écrit B, et le premier ne voit jamais la valeur B", correct: false}
    answer: Un CAS qui réussit parce que la valeur est revenue à A, alors qu'elle a été modifiée entre-temps (A, puis B, puis A).
