notion: cycle-vie-thread
cards:
  - key: etats-thread
    format: course
    question: Les états d'un thread ?
    answer: NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, TERMINATED.
  - key: blocked-vs-waiting
    format: course
    question: BLOCKED vs WAITING ?
    answer: BLOCKED attend un moniteur synchronized ; WAITING attend une notification ou un autre thread (wait, join, park).
  - key: bien-gerer-interruptedexception
    format: course
    question: Comment bien gérer une InterruptedException ?
    answer: La propager, ou restaurer le drapeau avec Thread.currentThread().interrupt() ; ne jamais l'avaler.
