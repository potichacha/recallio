notion: dimensionner-pool
lesson: |-
  La bonne taille d'un pool dépend de **ce que font les tâches** :

  - des tâches **de calcul** (CPU) occupent un cœur tout le temps : au-delà du nombre de cœurs, les threads se disputent
    le processeur. Taille ≈ **nombre de cœurs** (`Runtime.getRuntime().availableProcessors()`), parfois + 1 ;
  - des tâches **d'entrée-sortie** passent l'essentiel de leur temps à **attendre** (base, réseau). Pendant ce temps, le
    cœur est libre : on peut avoir plus de threads. La formule de Goetz :

    ```
    threads ≈ cœurs × utilisation visée × (1 + temps d'attente / temps de calcul)
    ```

    8 cœurs, des tâches qui attendent 90 ms et calculent 10 ms : 8 × (1 + 9) = 80 threads.

  Mais la vraie limite est souvent **en aval** :
  - un pool de 200 threads face à un pool de **20 connexions** à la base : 180 threads attendent une connexion ;
  - un service distant qui supporte 50 requêtes simultanées.

  La taille du pool se cale donc aussi sur la ressource la plus contrainte, et on **mesure** : temps d'attente dans la
  file, utilisation du CPU, latence, nombre de threads actifs (métriques Micrometer des executors).

  Autres règles :
  - **séparer** les pools par type de charge (une cloison, *bulkhead*) : un pool pour le calcul, un pour les appels lents,
    pour qu'un service lent ne paralyse pas tout ;
  - **borner** la file d'attente, et choisir une politique de rejet ;
  - dans un conteneur, `availableProcessors()` respecte la limite de CPU du conteneur (JVM récentes) ;
  - avec les **threads virtuels**, on ne dimensionne plus de pool pour les entrées-sorties : un thread par tâche, et un
    `Semaphore` pour borner l'accès à la ressource aval.

  **Piège classique** : un pool énorme « pour aller plus vite » devant une base de données. On ne fait que déplacer
  l'attente vers le pool de connexions, avec plus de mémoire et de changements de contexte.

  **En entretien** : « Calcul : le nombre de cœurs. Entrées-sorties : cœurs × (1 + attente/calcul), plafonné par la
  ressource aval. Pools séparés par charge, files bornées, et on mesure. Avec des threads virtuels, on borne par
  sémaphore. »
cards:
  - key: dimensionner-pool
    format: course
    question: "Comment dimensionner un pool de threads ?"
    choices:
      - {text: "Calcul : cœurs × (1 + attente / calcul) ; entrées-sorties : le nombre de cœurs, plafonné par l'aval", correct: false}
      - {text: "Toujours 200 threads, la valeur par défaut des serveurs HTTP, quelle que soit la charge", correct: false}
      - {text: "Autant de threads que de requêtes simultanées attendues, pour qu'aucune ne patiente jamais", correct: false}
      - {text: "Calcul : le nombre de cœurs ; entrées-sorties : cœurs × (1 + attente / calcul), plafonné par l'aval", correct: true}
    answer: "Pour du calcul pur, autant de threads que de cœurs : plus n'ajoute que des changements de contexte. Pour des entrées-sorties, cœurs × (1 + attente / calcul), plafonné par ce que la ressource aval supporte."
  - key: limite-aval
    format: course
    question: Pourquoi la ressource aval limite-t-elle la taille utile d'un pool ?
    choices:
      - {text: "Le système d'exploitation refuse de créer plus de threads que de connexions ouvertes", correct: false}
      - {text: "La JVM limite le nombre de threads d'un pool au nombre de connexions à la base", correct: false}
      - {text: "Les threads en plus ne font qu'attendre cette ressource bornée, en coûtant mémoire et contexte", correct: true}
      - {text: "Chaque thread en plus ouvre sa connexion, ce qui fait tomber la base aussitôt", correct: false}
    answer: Si les tâches attendent toutes une ressource bornée (20 connexions à la base), les threads en plus ne font qu'attendre cette ressource, avec un coût en mémoire et en contexte.
  - key: cloison
    format: course
    question: Pourquoi séparer les pools par type de charge ?
    choices:
      - {text: "Pour qu'une charge lente ou bloquée n'occupe pas tous les threads et ne paralyse pas le reste", correct: true}
      - {text: "Pour que chaque pool ait ses propres réglages de ramasse-miettes et de mémoire", correct: false}
      - {text: "Pour que les tâches lentes s'exécutent plus vite, sans concurrence avec les rapides", correct: false}
      - {text: "Pour réduire le nombre total de threads de l'application, et donc sa mémoire", correct: false}
    answer: Pour qu'une charge lente ou bloquée (appels à un service défaillant) n'occupe pas tous les threads et ne paralyse pas les autres traitements (principe de la cloison, bulkhead).
  - key: virtuels
    format: course
    question: Comment limite-t-on la concurrence avec des threads virtuels ?
    choices:
      - {text: "Un pool fixe de threads virtuels, dimensionné sur le nombre de cœurs de la machine", correct: false}
      - {text: "On ne la limite pas : les threads virtuels ne coûtent rien, ni à la JVM ni à l'aval", correct: false}
      - {text: "Un thread virtuel par tâche, et un `Semaphore` qui borne l'accès à la ressource aval", correct: true}
      - {text: "Un `newCachedThreadPool`, qui réutilise les threads virtuels déjà créés", correct: false}
    answer: "Un thread virtuel par tâche, et un `Semaphore` (ou la taille du pool de connexions) qui borne l'accès à la ressource aval. Mettre des threads virtuels en pool n'a pas de sens : ils sont faits pour être jetables."
  - key: vf-cpu
    format: true-false
    question: Pour des tâches de calcul pur, un pool de la taille du nombre de cœurs est un bon point de départ.
    truth: true
    answer: Plus de threads se disputeraient les cœurs.
  - key: vf-io-plus
    format: true-false
    question: Des tâches qui attendent beaucoup (réseau) justifient plus de threads que de cœurs.
    truth: true
    answer: Le cœur est libre pendant l'attente.
  - key: vf-plus-grand
    format: true-false
    question: Augmenter la taille du pool accélère toujours un service qui appelle une base de données.
    truth: false
    answer: Au-delà du nombre de connexions disponibles, les threads attendent une connexion.
  - key: vf-conteneur
    format: true-false
    question: Dans un conteneur limité à 2 CPU, une JVM récente renvoie 2 avec `availableProcessors()`.
    truth: true
    answer: Elle tient compte des limites du conteneur (cgroups).
  - key: qcm-formule
    format: multiple-choice
    question: "8 cœurs, des tâches qui calculent 10 ms et attendent 40 ms. Quelle taille de pool suggère la formule ?"
    choices:
      - text: "40"
        correct: true
      - text: "8"
        correct: false
      - text: "80"
        correct: false
      - text: "400"
        correct: false
    answer: 8 × (1 + 40/10) = 40, à plafonner selon la ressource aval.
  - key: qcm-mesurer
    format: multiple-choice
    question: "Quelle mesure guide le mieux le dimensionnement d'un pool ?"
    choices:
      - {text: "Le nombre de requêtes reçues depuis le démarrage", correct: false}
      - {text: "Le temps d'attente des tâches dans la file", correct: true}
      - {text: "La quantité de mémoire du tas déjà utilisée", correct: false}
      - {text: "Le nombre de threads démons de la JVM", correct: false}
    answer: "Le temps d'attente en file, avec l'utilisation du CPU et la latence, montre si le pool est trop petit ou si l'aval sature. Les métriques des executors (Micrometer) les exposent."
  - key: qcm-base
    format: multiple-choice
    question: "Un service a un pool de 200 threads et un pool de 10 connexions à la base. Que se passe-t-il sous charge ?"
    choices:
      - text: "Jusqu'à 190 threads attendent une connexion"
        correct: true
      - text: "La base reçoit 200 requêtes simultanées"
        correct: false
      - text: "Les requêtes vont 20 fois plus vite"
        correct: false
      - text: "Une erreur au démarrage"
        correct: false
    answer: La limite réelle est le pool de connexions.
  - key: qcm-separer
    format: multiple-choice
    question: "Quelle mesure empêche un service partenaire lent de paralyser toutes les requêtes ?"
    choices:
      - {text: "Un seul grand pool, partagé par tous les traitements de l'application", correct: false}
      - {text: "Des délais d'attente plus longs sur les appels à ce service partenaire", correct: false}
      - {text: "Un pool plus grand, pour que les appels lents laissent des threads libres", correct: false}
      - {text: "Un pool (ou un sémaphore) dédié et borné pour les appels à ce service", correct: true}
    answer: "Une cloison (bulkhead) limite les threads que ce service peut occuper ; avec des délais courts sur ses appels, la panne ne se propage pas. Un pool plus grand ne fait que retarder la saturation."
  - key: scenario-dimensionner
    format: scenario
    question: Comment choisis-tu la taille du pool d'un service qui appelle une API externe pour chaque requête ?
    choices:
      - {text: "Le nombre de cœurs de la machine, comme pour un traitement de calcul pur, sans autre mesure", correct: false}
      - {text: "Un pool illimité (`newCachedThreadPool`), pour ne jamais faire attendre une seule requête", correct: false}
      - {text: "Cœurs × (1 + attente / calcul) mesurés, plafonné par le quota de l'API, avec file bornée et métriques", correct: true}
      - {text: "Autant de threads que l'API accepte de requêtes par seconde, sans file ni délai sur les appels", correct: false}
    answer: "Je mesure le temps de calcul et d'attente d'une tâche, j'en tire cœurs × (1 + attente / calcul) comme point de départ, plafonné par le quota de l'API et le pool de connexions HTTP. File bornée, politique de rejet, délais sur les appels, et métriques du pool pour ajuster en charge réelle ; sur Java 21+, des threads virtuels avec un sémaphore."
  - key: scenario-pool-sature
    format: scenario
    question: Les métriques montrent une file d'attente du pool qui grossit et une latence qui explose, avec un CPU à 20 %. Que conclus-tu ?
    choices:
      - {text: "Les threads attendent une ressource aval lente ou un verrou ; agrandir le pool aggraverait tout", correct: true}
      - {text: "Le pool est trop petit pour la charge : il faut doubler son nombre de threads tout de suite", correct: false}
      - {text: "Le CPU est sous-utilisé : il faut paralléliser davantage le calcul de chaque tâche", correct: false}
      - {text: "Le ramasse-miettes bloque les threads : il faut augmenter la taille du tas de la JVM", correct: false}
    answer: "Avec un CPU à 20 %, les threads ne calculent pas, ils attendent : une ressource aval lente ou saturée, ou un verrou disputé. Un thread dump montre où ils attendent ; on réduit le temps passé en aval, on ajoute délais et coupe-circuit, ou on isole cette charge dans son pool."
  - key: scenario-calcul
    format: scenario
    question: Un traitement de redimensionnement d'images doit traiter un lot le plus vite possible sur un serveur de 16 cœurs. Quelle configuration ?
    choices:
      - {text: "Un pool de 200 threads, pour que le processeur ne reste jamais inactif pendant le lot", correct: false}
      - {text: "Un thread virtuel par image, pour lancer tout le lot en même temps, sans aucune attente", correct: false}
      - {text: "Un pool de 16 threads (ou 15), avec une file bornée qui fournit les images au rythme du calcul", correct: true}
      - {text: "Un seul thread, pour éviter tout changement de contexte entre deux images du lot", correct: false}
    answer: "C'est du calcul pur : un thread par cœur (ou un de moins pour le système), et une file bornée qui limite les images décompressées en mémoire. Plus de threads n'ajouterait que des changements de contexte ; je vérifie que le CPU approche 100 % et que les fichiers ne deviennent pas le goulot."
  - key: scenario-virtuels
    format: scenario
    question: Un collègue propose de remplacer tous les pools par des threads virtuels. Qu'en penses-tu ?
    choices:
      - {text: "Oui partout : les threads virtuels sont plus rapides, y compris pour le calcul pur", correct: false}
      - {text: "Non : les threads virtuels sont encore en préversion, même en Java 25", correct: false}
      - {text: "Oui pour les tâches qui attendent, avec une limite explicite sur l'aval ; non pour le calcul pur", correct: true}
      - {text: "Oui, sans autre limite : la taille des pools n'a plus aucune utilité désormais", correct: false}
    answer: "Pour les tâches qui attendent (HTTP, base), oui : un thread par tâche, plus de pool à dimensionner. Mais la limite qu'imposait le pool doit devenir explicite (`Semaphore`, pool de connexions), sinon la base est inondée ; pour le calcul pur, un pool de la taille des cœurs reste le bon outil."
