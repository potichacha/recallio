notion: fork-join
cards:
  - key: work-stealing
    format: course
    question: C'est quoi le work stealing ?
    answer: Les threads inactifs d'un ForkJoinPool volent des tâches dans les files des threads occupés.
  - key: recursivetask-vs-recursiveaction
    format: course
    question: RecursiveTask vs RecursiveAction ?
    answer: Avec résultat vs sans résultat.
