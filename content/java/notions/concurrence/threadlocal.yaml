notion: threadlocal
lesson: |-
  Un **`ThreadLocal<T>`** donne à **chaque thread sa propre valeur** d'une même variable : ce qu'un thread y range, les
  autres ne le voient pas.

  ```java
  private static final ThreadLocal<Utilisateur> COURANT = new ThreadLocal<>();

  void traiterRequete(Requete r) {
      COURANT.set(authentifier(r));
      try {
          service.executer();                 // peut lire COURANT.get() sans paramètre
      } finally {
          COURANT.remove();                   // indispensable dans un pool
      }
  }

  private static final ThreadLocal<DateTimeFormatter> FORMAT =      // un objet non thread-safe par thread
          ThreadLocal.withInitial(() -> DateTimeFormatter.ofPattern("dd/MM/yyyy"));
  ```

  Usages :
  - un **contexte implicite** par requête : utilisateur connecté, identifiant de corrélation des logs (le MDC de SLF4J),
    transaction (les frameworks s'en servent) ;
  - un objet **coûteux et non thread-safe** par thread (l'ancien `SimpleDateFormat`).

  Les dangers :
  - dans un **pool**, les threads sont réutilisés : une valeur non retirée **fuit** vers la requête suivante (données d'un
    autre utilisateur !) et retient de la mémoire ; on appelle **`remove()`** dans un `finally` ;
  - dans un serveur d'applications, une valeur dont la classe vient de l'application peut retenir tout le chargeur de
    classes après un redéploiement : fuite de Metaspace ;
  - avec des **millions de threads virtuels**, une valeur par thread multiplie la mémoire ; les **`ScopedValue`**
    (Java 25) sont l'alternative, immuables et liées à une portée ;
  - c'est une forme d'**état global caché** : les dépendances ne sont plus visibles dans les signatures.
  - `InheritableThreadLocal` copie la valeur aux threads enfants à leur création, pas aux tâches d'un pool existant.

  **Piège classique** : un filtre HTTP qui fait `set()` sans `remove()`. La requête suivante, servie par le même thread du
  pool, voit l'utilisateur de la précédente.

  **En entretien** : « Une valeur par thread, pratique pour un contexte de requête, mais avec un pool il faut toujours
  `remove()` dans un `finally` ; avec les threads virtuels, je préfère `ScopedValue`. »
cards:
  - key: danger-threadlocal
    format: course
    question: "Quel est le danger d'un `ThreadLocal` dans un pool de threads ?"
    choices:
      - {text: "Deux threads du pool peuvent lire et modifier la même valeur en même temps", correct: false}
      - {text: "La valeur est perdue chaque fois que le pool réutilise le thread", correct: false}
      - {text: "Le thread recyclé garde la valeur : fuite de mémoire et de données, sauf `remove()`", correct: true}
      - {text: "Chaque `get()` prend un verrou global, ce qui ralentit tout le pool", correct: false}
    answer: Dans un pool, le thread recyclé garde la valeur → fuite mémoire et de données. Nettoyer avec remove().
  - key: definition
    format: course
    question: Qu'est-ce qu'un `ThreadLocal` ?
    choices:
      - {text: "Une variable partagée par tous les threads, protégée par un verrou interne", correct: false}
      - {text: "Une variable dont chaque thread a sa propre valeur, invisible des autres threads", correct: true}
      - {text: "Une variable locale de méthode, rangée dans la pile du thread courant", correct: false}
      - {text: "Une variable héritée par tous les threads créés par le thread courant", correct: false}
    answer: Une variable dont chaque thread a sa propre valeur, invisible des autres threads.
  - key: usages
    format: course
    question: À quoi sert typiquement un `ThreadLocal` ?
    choices:
      - {text: "Porter un contexte de requête implicite, ou une instance par thread d'un objet non thread-safe", correct: true}
      - {text: "Partager une valeur modifiable entre tous les threads, sans verrou", correct: false}
      - {text: "Transmettre un résultat d'un thread à un autre, comme un `Future`", correct: false}
      - {text: "Compter les threads actifs d'un pool, à la place d'un `AtomicInteger`", correct: false}
    answer: À porter un contexte de requête implicite (utilisateur, identifiant de corrélation, transaction) ou à donner à chaque thread son instance d'un objet non thread-safe.
  - key: alternative
    format: course
    question: Quelle alternative à `ThreadLocal` pour les threads virtuels ?
    choices:
      - {text: "`InheritableThreadLocal`, qui copie la valeur dans chaque thread virtuel créé", correct: false}
      - {text: "`ScopedValue`, une valeur immuable liée à une portée, sans `remove()` à oublier", correct: true}
      - {text: "Un champ statique `volatile`, lu par tous les threads virtuels", correct: false}
      - {text: "Une `ConcurrentHashMap` indexée par l'identifiant du thread porteur", correct: false}
    answer: '`ScopedValue` (définitive en Java 25) : une valeur immuable liée à une portée d''exécution, sans `remove` à oublier ni copie par thread.'
  - key: vf-partage
    format: true-false
    question: Deux threads qui lisent le même `ThreadLocal` voient la même valeur.
    truth: false
    answer: Chacun voit la sienne.
  - key: vf-remove
    format: true-false
    question: Dans un pool de threads, il faut appeler `remove()` après usage.
    truth: true
    answer: Sinon le thread réutilisé garde la valeur pour la tâche suivante.
  - key: vf-inheritable
    format: true-false
    question: "Une valeur d'`InheritableThreadLocal` est transmise aux tâches soumises à un pool déjà créé."
    truth: false
    answer: Elle est copiée à la création d'un thread enfant ; les threads du pool existent déjà.
  - key: vf-with-initial
    format: true-false
    question: "`ThreadLocal.withInitial(fabrique)` crée une valeur à la première lecture de chaque thread."
    truth: true
    answer: La fabrique est appelée par thread, à la demande.
  - key: qcm-fuite
    format: multiple-choice
    question: Que risque un `ThreadLocal` non nettoyé dans un serveur web ?
    choices:
      - {text: "Une erreur de compilation dès qu'il est déclaré `static`", correct: false}
      - {text: "Un interblocage entre les threads qui partagent le pool", correct: false}
      - {text: "La perte de sa valeur au milieu de la requête en cours", correct: false}
      - {text: "Une requête voit les données de la précédente, servie par le même thread", correct: true}
    answer: "Les threads du pool vivent bien plus longtemps que les requêtes : la suivante hérite de la valeur, et la mémoire n'est jamais libérée. D'où `remove()` dans un `finally`."
  - key: qcm-nettoyage
    format: multiple-choice
    question: Où appeler `remove()` ?
    choices:
      - {text: "Au démarrage de l'application, une fois pour toutes", correct: false}
      - {text: "Dans un `finally`, autour du traitement qui a fait `set()`", correct: true}
      - {text: "Dans le constructeur de la classe qui le déclare", correct: false}
      - {text: "Nulle part : le GC s'en charge à la fin de la requête", correct: false}
    answer: Le `finally` garantit le nettoyage même en cas d'exception.
  - key: qcm-mdc
    format: multiple-choice
    question: Sur quoi repose le MDC (contexte de diagnostic) de SLF4J/Logback ?
    choices:
      - text: "Un `ThreadLocal`"
        correct: true
      - text: "Une variable statique partagée"
        correct: false
      - text: "Une base de données"
        correct: false
      - text: "Les paramètres de chaque méthode"
        correct: false
    answer: D'où la nécessité de le nettoyer, et de le propager à la main entre threads.
  - key: qcm-inconvenient
    format: multiple-choice
    question: "Quel est l'inconvénient d'un `ThreadLocal` comme mécanisme de contexte ?"
    choices:
      - {text: "Il est plus lent qu'une base de données", correct: false}
      - {text: "Il est interdit dans les applications web", correct: false}
      - {text: "Il ne fonctionne qu'avec les threads virtuels", correct: false}
      - {text: "Le contexte ne suit pas une tâche passée à un autre thread", correct: true}
    answer: "Le contexte reste attaché au thread : un appel asynchrone le perd s'il n'est pas transmis explicitement. C'est aussi une dépendance cachée, absente des signatures."
  - key: code-par-thread
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      ThreadLocal<String> nom = new ThreadLocal<>();
      nom.set("main");
      Thread t = new Thread(() -> System.out.print(nom.get() + " "));
      t.start();
      t.join();
      System.out.println(nom.get());
      ```
    choices:
      - {text: "`main main`", correct: false}
      - {text: "`null null`", correct: false}
      - {text: "`main null`", correct: false}
      - {text: "`null main`", correct: true}
    answer: '`null main` : le thread `t` n''a pas de valeur.'
    check:
      output: "null main"
  - key: code-initial
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] creations = {0};
      ThreadLocal<StringBuilder> tampon = ThreadLocal.withInitial(() -> { creations[0]++; return new StringBuilder(); });
      tampon.get().append("a");
      tampon.get().append("b");
      System.out.println(tampon.get() + " " + creations[0]);
      ```
    choices:
      - {text: "`ab 3`", correct: false}
      - {text: "`ab 1`", correct: true}
      - {text: "`b 3`", correct: false}
      - {text: "`ab 2`", correct: false}
    answer: '`ab 1` : une seule création pour le thread courant.'
    check:
      output: "ab 1"
  - key: code-pool-fuite
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      ThreadLocal<String> utilisateur = new ThreadLocal<>();
      try (var pool = Executors.newSingleThreadExecutor()) {
          pool.submit(() -> utilisateur.set("ada")).get();
          System.out.println(pool.submit(() -> utilisateur.get()).get());
      }
      ```
    choices:
      - {text: "`null`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
      - {text: "`ada`", correct: true}
      - {text: "Rien", correct: false}
    answer: '`ada` : la seconde tâche, sur le même thread, voit la valeur laissée par la première.'
    check:
      output: "ada"
  - key: code-remove
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      ThreadLocal<Integer> t = ThreadLocal.withInitial(() -> 0);
      t.set(42);
      t.remove();
      System.out.println(t.get());
      ```
    choices:
      - {text: "`42`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
      - {text: "`0`", correct: true}
    answer: '`0` : après `remove()`, la valeur initiale est recréée.'
    check:
      output: "0"
  - key: bug-filtre
    format: bug-fix
    question: |-
      Des utilisateurs voient parfois le panier d'un autre. Quelle correction est la bonne ?
      ```java
      public void filtrer(Requete r, Chaine chaine) {
          CONTEXTE.set(authentifier(r));
          chaine.continuer(r);
      }
      ```
    choices:
      - {text: "Appeler `CONTEXTE.remove()` dans un `finally`, après `chaine.continuer(r)`", correct: true}
      - {text: "Déclarer `CONTEXTE` `volatile`, pour que chaque thread voie la bonne valeur", correct: false}
      - {text: "Rendre `filtrer` `synchronized`, pour ne servir qu'une requête à la fois", correct: false}
      - {text: "Remplacer le `ThreadLocal` de `CONTEXTE` par un `InheritableThreadLocal`", correct: false}
    answer: |-
      ```java
      public void filtrer(Requete r, Chaine chaine) {
          CONTEXTE.set(authentifier(r));
          try {
              chaine.continuer(r);
          } finally {
              CONTEXTE.remove();
          }
      }
      ```
      Le thread du pool est réutilisé pour la requête suivante : sans `remove()`, elle hérite de l'utilisateur précédent.
  - key: bug-asynchrone
    format: bug-fix
    question: |-
      L'identifiant de corrélation disparaît des logs des traitements asynchrones. Quelle correction est la bonne ?
      ```java
      MDC.put("correlation", id);
      executor.submit(() -> traiter(commande));    // les logs de traiter() n'ont plus l'identifiant
      ```
    choices:
      - {text: "Appeler `MDC.put` une seconde fois, juste après `executor.submit`", correct: false}
      - {text: "Copier le contexte du MDC à la soumission, le poser dans la tâche, puis le vider", correct: true}
      - {text: "Déclarer le MDC `volatile`, pour qu'il soit visible des threads du pool", correct: false}
      - {text: "Remplacer l'executor par un `ForkJoinPool`, qui transmet le MDC", correct: false}
    answer: |-
      ```java
      Map<String, String> contexte = MDC.getCopyOfContextMap();
      executor.submit(() -> {
          MDC.setContextMap(contexte);
          try {
              traiter(commande);
          } finally {
              MDC.clear();
          }
      });
      ```
      Le MDC repose sur un `ThreadLocal` : il ne suit pas la tâche dans un autre thread. On le copie à la soumission,
      puis on le nettoie.
  - key: bug-simpledateformat
    format: bug-fix
    question: |-
      Ce formateur partagé produit parfois des dates absurdes sous charge. Quelle correction est la bonne ?
      ```java
      private static final SimpleDateFormat FORMAT = new SimpleDateFormat("dd/MM/yyyy");
      ```
    choices:
      - {text: "Le remplacer par un `DateTimeFormatter`, immuable et thread-safe", correct: true}
      - {text: "Le déclarer `volatile`, pour que chaque thread voie le même formateur", correct: false}
      - {text: "Le recréer dans un bloc `static` à chaque démarrage de l'application", correct: false}
      - {text: "Retirer `final`, pour que chaque thread puisse le remplacer au besoin", correct: false}
    answer: |-
      ```java
      private static final DateTimeFormatter FORMAT = DateTimeFormatter.ofPattern("dd/MM/yyyy");
      ```
      `SimpleDateFormat` n'est pas thread-safe. Plutôt qu'un `ThreadLocal<SimpleDateFormat>`, on utilise
      `DateTimeFormatter`, immuable et thread-safe.
  - key: bug-virtuels
    format: bug-fix
    question: |-
      Avec un thread virtuel par requête (un million de requêtes simultanées), la mémoire explose. Pourquoi ?
      ```java
      private static final ThreadLocal<byte[]> TAMPON = ThreadLocal.withInitial(() -> new byte[64 * 1024]);
      ```
    choices:
      - {text: "Chaque thread virtuel, jamais réutilisé, alloue son propre tampon : un million de tampons", correct: true}
      - {text: "Les threads virtuels copient tous les `ThreadLocal` de leur porteur à chaque montage", correct: false}
      - {text: "`withInitial` alloue le tampon pour tous les threads, même ceux qui ne s'en servent pas", correct: false}
      - {text: "Le ramasse-miettes ne collecte jamais la mémoire d'un `ThreadLocal`", correct: false}
    answer: |-
      ```java
      byte[] tampon = new byte[64 * 1024];      // local à la requête, libéré à la fin
      // ou un pool d'objets borné, partagé
      ```
      Un `ThreadLocal` de cache n'a de sens que pour quelques threads réutilisés. Avec un thread virtuel par tâche, chaque
      tâche alloue son tampon une fois et ne le réutilise jamais : la mémoire est multipliée sans gain.
