notion: synchroniseurs
lesson: |-
  Les **synchroniseurs** coordonnent des threads autour d'un événement ou d'une ressource :

  | Synchroniseur | Rôle | Réutilisable |
  |---|---|---|
  | **`CountDownLatch(n)`** | des threads attendent (`await`) que le compteur tombe à zéro (`countDown`) | non |
  | **`CyclicBarrier(n)`** | n threads s'attendent mutuellement à un point de rendez-vous, puis repartent ensemble | oui |
  | **`Semaphore(n)`** | n permis : `acquire` en prend un (ou attend), `release` le rend ; borne l'accès à une ressource | oui |
  | **`Phaser`** | barrière à phases successives, avec un nombre de participants variable | oui |

  ```java
  // Attendre que 3 services aient démarré
  CountDownLatch prets = new CountDownLatch(3);
  services.forEach(s -> pool.submit(() -> { s.demarrer(); prets.countDown(); }));
  prets.await(30, TimeUnit.SECONDS);

  // Pas plus de 10 appels simultanés à un service fragile
  Semaphore limite = new Semaphore(10);
  limite.acquire();
  try {
      appelerService();
  } finally {
      limite.release();
  }
  ```

  - Un `CountDownLatch` sert aussi dans les **tests** : faire démarrer de nombreux threads au même instant pour
    provoquer une concurrence réelle.
  - `await` et `acquire` se donnent un **délai** (`tryAcquire(délai)`) pour ne pas bloquer indéfiniment.
  - `release()` dans un `finally`, sinon les permis fuient et la ressource finit par être bloquée.
  - Un `Semaphore(1)` ressemble à un verrou, mais **n'est pas réentrant** et peut être rendu par un autre thread.
  - Avec les **threads virtuels**, un `Semaphore` est la bonne façon de limiter la concurrence vers une ressource
    (plutôt qu'un pool de taille fixe).

  **Piège classique** : `acquire()` sans `release()` dans un `finally`. Chaque exception perd un permis, jusqu'à ce que
  plus aucun thread ne puisse passer.

  **En entretien** : « `CountDownLatch` pour attendre n événements, `CyclicBarrier` pour un rendez-vous répété,
  `Semaphore` pour borner l'accès à une ressource, avec `release` dans un `finally`. »
cards:
  - key: latch
    format: course
    question: À quoi sert un `CountDownLatch` ?
    answer: À faire attendre des threads (`await`) jusqu'à ce que n événements aient eu lieu (`countDown` n fois) ; il ne se réinitialise pas.
  - key: barrier
    format: course
    question: Quelle différence entre `CountDownLatch` et `CyclicBarrier` ?
    answer: Le latch attend des événements et sert une fois ; la barrière fait s'attendre n threads entre eux à un point de rendez-vous, et se réutilise à chaque cycle.
  - key: semaphore
    format: course
    question: À quoi sert un `Semaphore` ?
    answer: À limiter le nombre de threads qui accèdent en même temps à une ressource, avec n permis pris par `acquire` et rendus par `release`.
  - key: tests
    format: course
    question: Comment un `CountDownLatch` aide-t-il à tester du code concurrent ?
    answer: "Les threads attendent tous un latch à 1, puis le test fait `countDown()` : ils démarrent au même instant, ce qui maximise la concurrence réelle."
  - key: vf-latch-reutilisable
    format: true-false
    question: Un `CountDownLatch` arrivé à zéro peut être remis à sa valeur initiale.
    truth: false
    answer: Il sert une fois ; `CyclicBarrier` ou `Phaser` se réutilisent.
  - key: vf-semaphore-reentrant
    format: true-false
    question: Un `Semaphore(1)` est réentrant comme un `ReentrantLock`.
    truth: false
    answer: Un second `acquire` du même thread attend un permis.
  - key: vf-release-autre
    format: true-false
    question: Un permis de `Semaphore` peut être rendu par un autre thread que celui qui l'a pris.
    truth: true
    answer: Le sémaphore ne connaît pas de propriétaire.
  - key: vf-virtuels
    format: true-false
    question: Avec des threads virtuels, un `Semaphore` permet de borner les appels simultanés à un service.
    truth: true
    answer: C'est l'approche recommandée, plutôt qu'un pool de taille fixe.
  - key: qcm-choix
    format: multiple-choice
    question: Associez correctement besoin et synchroniseur.
    choices:
      - text: "Attendre que 5 tâches de démarrage soient terminées : `CountDownLatch`"
        correct: true
      - text: "Au plus 20 connexions simultanées à un serveur : `Semaphore`"
        correct: true
      - text: "Un compteur de requêtes : `CyclicBarrier`"
        correct: false
      - text: "Exclure deux écritures d'un champ : `CountDownLatch`"
        correct: false
    answer: Un compteur passe par un atomique, une exclusion par un verrou.
  - key: qcm-release
    format: multiple-choice
    question: Comment utiliser correctement un `Semaphore` ?
    choices:
      - text: "`acquire(); try { ... } finally { release(); }`"
        correct: true
      - text: "`if (tryAcquire(1, SECONDS)) { try { ... } finally { release(); } }`"
        correct: true
      - text: "`acquire(); ...; release();` sans `finally`"
        correct: false
      - text: "`release(); ...; acquire();`"
        correct: false
    answer: Le `finally` garantit que le permis est rendu.
  - key: qcm-barrier
    format: multiple-choice
    question: Dans une simulation, 4 threads calculent chacun une partie d'une étape, puis doivent tous attendre avant l'étape suivante. Que choisir ?
    choices:
      - text: "`CyclicBarrier(4)`"
        correct: true
      - text: "`Phaser`, avec 4 participants"
        correct: true
      - text: "`CountDownLatch(4)`, recréé... impossible à réutiliser proprement"
        correct: false
      - text: "`Semaphore(4)`"
        correct: false
    answer: La barrière se réarme à chaque étape.
  - key: qcm-delai
    format: multiple-choice
    question: Pourquoi utiliser `latch.await(30, SECONDS)` plutôt que `await()` ?
    choices:
      - text: "Pour ne pas attendre indéfiniment si un événement n'arrive jamais"
        correct: true
      - text: "Pour accélérer le décompte"
        correct: false
      - text: "Pour réinitialiser le latch"
        correct: false
      - text: "C'est obligatoire"
        correct: false
    answer: '`await` avec délai renvoie `false` si le délai expire.'
  - key: code-latch
    format: code-output
    question: |-
      ```java
      CountDownLatch prets = new CountDownLatch(3);
      try (var pool = Executors.newFixedThreadPool(3)) {
          for (int i = 0; i < 3; i++) pool.submit(prets::countDown);
          System.out.println(prets.await(5, TimeUnit.SECONDS) + " " + prets.getCount());
      }
      ```
    answer: '`true 0`.'
    check:
      output: "true 0"
  - key: code-semaphore
    format: code-output
    question: |-
      ```java
      Semaphore s = new Semaphore(2);
      System.out.println(s.tryAcquire() + " " + s.tryAcquire() + " " + s.tryAcquire() + " " + s.availablePermits());
      s.release();
      System.out.println(s.availablePermits());
      ```
    answer: '`true true false 0`, puis `1`.'
    check:
      output: "true true false 0\n1"
  - key: code-maximum
    format: code-output
    question: |-
      ```java
      import java.util.concurrent.atomic.AtomicInteger;
      Semaphore limite = new Semaphore(3);
      AtomicInteger enCours = new AtomicInteger();
      AtomicInteger maximum = new AtomicInteger();
      try (var pool = Executors.newFixedThreadPool(10)) {
          for (int i = 0; i < 50; i++) {
              pool.submit(() -> {
                  limite.acquire();
                  try {
                      maximum.accumulateAndGet(enCours.incrementAndGet(), Math::max);
                      Thread.sleep(5);
                      enCours.decrementAndGet();
                  } finally {
                      limite.release();
                  }
                  return null;
              });
          }
      }
      System.out.println(maximum.get() <= 3);
      ```
    answer: '`true` : jamais plus de 3 tâches à la fois dans la section protégée.'
    check:
      output: "true"
  - key: code-barrier
    format: code-output
    question: |-
      ```java
      CyclicBarrier barriere = new CyclicBarrier(2, () -> System.out.println("étape franchie"));
      try (var pool = Executors.newFixedThreadPool(2)) {
          for (int i = 0; i < 2; i++) pool.submit(() -> { barriere.await(); return null; });
      }
      System.out.println("fin");
      ```
    answer: '`étape franchie`, puis `fin` : l''action de la barrière s''exécute quand les deux threads sont arrivés.'
    check:
      output: "étape franchie\nfin"
