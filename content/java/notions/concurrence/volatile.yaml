notion: volatile
lesson: |-
  Sans synchronisation, un thread **peut ne jamais voir** une écriture faite par un autre : les valeurs restent dans les
  registres ou les caches du processeur, et le compilateur JIT peut réordonner ou sortir une lecture d'une boucle.

  ```java
  class Tache implements Runnable {
      private volatile boolean arretDemande;      // sans volatile, la boucle peut ne jamais s'arrêter

      public void run() {
          while (!arretDemande) {
              travailler();
          }
      }

      void arreter() { arretDemande = true; }
  }
  ```

  Un champ **`volatile`** garantit :
  - la **visibilité** : chaque lecture voit la dernière écriture faite par n'importe quel thread ;
  - l'**ordre** : tout ce qu'un thread a écrit **avant** une écriture `volatile` est visible par un thread qui lit cette
    variable ensuite (relation *happens-before*) ; ce qui permet de **publier** un objet construit.

  Ce que `volatile` ne garantit **pas** : l'**atomicité** des opérations composées. `compteur++` sur un `volatile` perd
  toujours des incréments ; `if (x == null) x = ...` reste une condition de course.

  Quand l'utiliser :
  - un **drapeau** écrit par un thread et lu par d'autres (arrêt, configuration rechargée) ;
  - la **publication** d'une référence vers un objet **immuable** remplacé en bloc (`volatile Config config`) ;
  - le double-checked locking.

  Pour un compteur ou une mise à jour qui dépend de l'ancienne valeur : `AtomicInteger`, `LongAdder` ou un verrou.
  Les écritures de `long` et `double` non `volatile` peuvent même être coupées en deux (non atomiques sur 32 bits).

  **Piège classique** : `volatile int compteur; compteur++;` en croyant le compteur thread-safe. Il est visible, pas
  atomique.

  **En entretien** : « `volatile` donne visibilité et ordre, pas atomicité : parfait pour un drapeau ou publier un objet
  immuable, insuffisant pour un compteur. »
cards:
  - key: volatile
    format: course
    question: "Que fait `volatile` sur un champ ?"
    choices:
      - {text: "Il garantit l'atomicité des opérations comme `x++`, pas la visibilité", correct: false}
      - {text: "Il garantit l'exclusion mutuelle, comme un bloc `synchronized`", correct: false}
      - {text: "Il empêche toute modification du champ après son initialisation", correct: false}
      - {text: "Il garantit la visibilité des écritures entre threads, pas l'atomicité", correct: true}
    answer: "Il garantit la visibilité : une écriture est vue par les lectures suivantes des autres threads. Il ne rend pas `x++` atomique, et n'exclut personne."
  - key: volatile-suffit-compteur
    format: course
    question: "Pourquoi `volatile` ne suffit-il pas pour un compteur ?"
    choices:
      - {text: "Parce qu'une lecture `volatile` peut renvoyer une ancienne valeur, gardée en cache", correct: false}
      - {text: "`compteur++` fait trois opérations (lire, ajouter, écrire) qui ne sont pas atomiques", correct: true}
      - {text: "Parce que `volatile` ne s'applique pas aux types primitifs comme `int`", correct: false}
      - {text: "Parce que `volatile` rend le champ constant après sa première écriture", correct: false}
    answer: "`compteur++` lit, ajoute puis écrit : deux threads peuvent lire la même valeur et perdre un incrément. `volatile` garantit la visibilité de chaque lecture, pas l'atomicité de la séquence."
  - key: drapeau
    format: course
    question: Pourquoi un drapeau d'arrêt doit-il être `volatile` ?
    choices:
      - {text: "Sans lui, le thread qui boucle peut ne jamais voir l'écriture : le JIT peut sortir la lecture de la boucle", correct: true}
      - {text: "Sans lui, deux threads pourraient écrire le drapeau en même temps et le corrompre", correct: false}
      - {text: "Sans lui, le drapeau reprendrait sa valeur initiale à chaque tour de boucle", correct: false}
      - {text: "Sans lui, le thread qui écrit le drapeau resterait bloqué jusqu'à sa lecture", correct: false}
    answer: Sans `volatile` (ni synchronisation), le thread qui boucle peut ne jamais voir l'écriture de l'autre thread, la lecture pouvant même être sortie de la boucle par le JIT.
  - key: publication
    format: course
    question: Comment `volatile` aide-t-il à publier un objet ?
    choices:
      - {text: "`volatile` rend l'objet référencé immuable, donc partageable sans risque", correct: false}
      - {text: "`volatile` copie l'objet dans la mémoire de chaque thread qui le lit", correct: false}
      - {text: "Ce qui est écrit avant d'affecter la référence `volatile` est visible de qui la lit ensuite", correct: true}
      - {text: "`volatile` verrouille l'objet référencé pendant sa construction", correct: false}
    answer: Ce qu'un thread a écrit avant d'affecter une référence `volatile` est visible par le thread qui lit cette référence ensuite ; un objet immuable ainsi publié est vu complètement construit.
  - key: vf-atomique
    format: true-false
    question: "`volatile` rend `compteur++` atomique."
    truth: false
    answer: Il ne rend atomiques que les lectures et écritures simples.
  - key: vf-visibilite
    format: true-false
    question: Une lecture d'un champ `volatile` voit la dernière écriture faite par un autre thread.
    truth: true
    answer: C'est sa garantie de visibilité.
  - key: vf-long
    format: true-false
    question: Les écritures d'un `long` non `volatile` peuvent ne pas être atomiques.
    truth: true
    answer: La spécification autorise leur découpage en deux écritures de 32 bits ; `volatile` l'interdit.
  - key: vf-remplace-synchronized
    format: true-false
    question: "`volatile` peut remplacer `synchronized` pour protéger un « vérifier-puis-agir »."
    truth: false
    answer: Le test et l'action ne deviennent pas atomiques ensemble.
  - key: qcm-usage
    format: multiple-choice
    question: "Pour quel usage `volatile` suffit-il ?"
    choices:
      - {text: "Un drapeau d'arrêt écrit par un thread et lu par un autre", correct: true}
      - {text: "Un compteur incrémenté par plusieurs threads", correct: false}
      - {text: "Un solde débité après vérification", correct: false}
      - {text: "Une liste à laquelle plusieurs threads ajoutent des éléments", correct: false}
    answer: "Un drapeau écrit par un thread et lu par un autre, comme une référence vers une configuration immuable remplacée en bloc. Dès qu'une écriture dépend de la valeur lue, il faut de l'atomicité."
  - key: qcm-garanties
    format: multiple-choice
    question: "Lesquelles de ces garanties offre `volatile` ?"
    choices:
      - text: "La visibilité des écritures"
        correct: true
      - text: "Un ordre (happens-before) entre l'écriture et les lectures suivantes"
        correct: true
      - text: "L'atomicité de `x += 1`"
        correct: false
      - text: "L'exclusion mutuelle"
        correct: false
    answer: Pour l'exclusion mutuelle, il faut un verrou.
  - key: qcm-compteur
    format: multiple-choice
    question: Quel remplacement corrige `private volatile int vues; void vue() { vues++; }` ?
    choices:
      - {text: "`AtomicInteger vues; vues.incrementAndGet();`", correct: true}
      - {text: "`private volatile long vues;`", correct: false}
      - {text: "`private static volatile int vues;`", correct: false}
      - {text: "`private transient volatile int vues;`", correct: false}
    answer: "`AtomicInteger` (comme `LongAdder`) fait l'incrément atomiquement. Le type, `static` ou `transient` ne changent rien à l'atomicité de `++`."
  - key: qcm-jit
    format: multiple-choice
    question: "Pourquoi `while (!arret) { }` peut-il boucler à l'infini si `arret` n'est pas `volatile` ?"
    choices:
      - text: "Le JIT peut lire `arret` une seule fois et sortir la lecture de la boucle"
        correct: true
      - text: "Parce que `boolean` n'est pas thread-safe"
        correct: false
      - text: "Parce que la boucle est vide"
        correct: false
      - text: "Parce qu'un autre thread ne peut pas écrire un champ privé"
        correct: false
    answer: Sans relation happens-before, cette optimisation est permise.
  - key: trous-drapeau
    format: fill-in
    question: |-
      Complète pour que l'arrêt soit vu par le thread qui boucle :
      ```java
      private ___ boolean actif = true;
      ```
    blanks: [[volatile]]
    answer: Le drapeau est écrit par un thread, lu par un autre.
  - key: trous-config
    format: fill-in
    question: |-
      Complète pour publier une nouvelle configuration immuable à tous les threads :
      ```java
      private ___ Config config;
      void recharger() { config = Config.lire(); }
      ```
    blanks: [[volatile]]
    answer: La référence remplacée en bloc est vue par tous.
  - key: trous-atomique
    format: fill-in
    question: |-
      Complète pour un compteur réellement atomique :
      ```java
      private final AtomicInteger vues = new AtomicInteger();
      void vue() { vues.___(); }
      ```
    blanks: [[incrementAndGet, getAndIncrement]]
    answer: Une opération atomique remplace `volatile` + `++`.
  - key: trous-boucle
    format: fill-in
    question: |-
      Complète la boucle qui s'arrête quand on le demande :
      ```java
      private volatile boolean arretDemande;
      public void run() {
          while (!___) { traiter(); }
      }
      ```
    blanks: [[arretDemande]]
    answer: La lecture `volatile` est refaite à chaque tour.
  - key: bug-drapeau
    format: bug-fix
    question: |-
      Ce thread ne s'arrête jamais en production, alors que `arreter()` est bien appelé. Quelle correction est la bonne ?
      ```java
      private boolean actif = true;
      public void run() { while (actif) { traiter(); } }
      public void arreter() { actif = false; }
      ```
    choices:
      - {text: "Déclarer le champ `actif` `volatile`", correct: true}
      - {text: "Déclarer le champ `actif` `final`", correct: false}
      - {text: "Déclarer le champ `actif` `static`", correct: false}
      - {text: "Ajouter `Thread.yield()` dans `arreter()`", correct: false}
    answer: |-
      ```java
      private volatile boolean actif = true;
      ```
      Sans `volatile`, l'écriture d'un thread peut ne jamais être vue par l'autre (le JIT peut même lire le champ une
      seule fois). `volatile` garantit la visibilité. (L'interruption du thread est une autre solution.)
  - key: bug-compteur
    format: bug-fix
    question: |-
      Les statistiques sous-estiment le nombre d'appels. Quelle correction est la bonne ?
      ```java
      private volatile int appels;
      void enregistrer() { appels++; }
      ```
    choices:
      - {text: "Un `LongAdder` (ou un `AtomicInteger`), qui incrémente atomiquement", correct: true}
      - {text: "Passer `appels` en `volatile long`, pour éviter le débordement", correct: false}
      - {text: "Remplacer `appels++` par `appels += 1`, en une seule opération", correct: false}
      - {text: "Déclarer `appels` `static volatile`, partagé par toutes les instances", correct: false}
    answer: |-
      ```java
      private final LongAdder appels = new LongAdder();
      void enregistrer() { appels.increment(); }
      ```
      `volatile` ne rend pas `++` atomique. `LongAdder` (ou `AtomicInteger`) fait l'incrément atomiquement.
  - key: bug-publication
    format: bug-fix
    question: |-
      Un thread lit parfois une configuration à moitié initialisée. Quelle correction est la bonne ?
      ```java
      private Config config;              // remplacée par un thread de rechargement
      void recharger() {
          Config c = new Config();
          c.charger();
          config = c;
      }
      ```
    choices:
      - {text: "Déclarer la référence `config` `volatile`", correct: true}
      - {text: "Rendre `recharger()` `synchronized`, sans toucher aux lectures", correct: false}
      - {text: "Appeler `charger()` après l'affectation de `config`", correct: false}
      - {text: "Déclarer la variable locale `c` `final`", correct: false}
    answer: |-
      ```java
      private volatile Config config;
      ```
      Sans `volatile`, l'affectation de la référence peut être vue avant les écritures faites par `charger()`. Avec
      `volatile`, tout ce qui précède l'affectation est visible pour qui lit la référence (et `Config` gagne à être
      immuable).
  - key: bug-check-then-act
    format: bug-fix
    question: |-
      Le rapport est parfois généré deux fois, malgré le `volatile`. Quelle correction est la bonne ?
      ```java
      private volatile boolean genere;
      void generer() {
          if (!genere) {
              faireLeRapport();
              genere = true;
          }
      }
      ```
    choices:
      - {text: "Un `AtomicBoolean` et `compareAndSet(false, true)` avant de générer", correct: true}
      - {text: "Écrire `genere = true` avant `faireLeRapport()`, avec `volatile`", correct: false}
      - {text: "Lire `genere` deux fois de suite avant de générer, pour confirmer", correct: false}
      - {text: "Remplacer `volatile` par `transient` sur le champ `genere`", correct: false}
    answer: |-
      ```java
      private final AtomicBoolean genere = new AtomicBoolean();
      void generer() {
          if (genere.compareAndSet(false, true)) {
              faireLeRapport();
          }
      }
      ```
      Deux threads peuvent lire `false` avant que l'un n'écrive `true`. `compareAndSet` rend le test et l'écriture
      atomiques : un seul thread gagne.
