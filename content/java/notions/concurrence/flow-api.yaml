notion: flow-api
lesson: |-
  `java.util.concurrent.Flow` (Java 9) reprend les quatre interfaces de **Reactive Streams** dans le JDK :

  | Interface | Rôle |
  |---|---|
  | `Flow.Publisher<T>` | produit des éléments ; `subscribe(subscriber)` |
  | `Flow.Subscriber<T>` | les reçoit : `onSubscribe`, `onNext`, `onError`, `onComplete` |
  | `Flow.Subscription` | le lien entre les deux : `request(n)`, `cancel()` |
  | `Flow.Processor<T, R>` | à la fois abonné et éditeur (une étape intermédiaire) |

  ```java
  class Afficheur implements Flow.Subscriber<String> {
      private Flow.Subscription abonnement;
      public void onSubscribe(Flow.Subscription s) { abonnement = s; s.request(1); }     // contre-pression
      public void onNext(String item) { System.out.println(item); abonnement.request(1); }
      public void onError(Throwable e) { e.printStackTrace(); }
      public void onComplete() { System.out.println("fin"); }
  }

  try (SubmissionPublisher<String> editeur = new SubmissionPublisher<>()) {
      editeur.subscribe(new Afficheur());
      editeur.submit("a");
      editeur.submit("b");
  }                                      // close() signale la fin aux abonnés
  ```

  - Le protocole : `onSubscribe` d'abord, puis au plus autant d'`onNext` que d'éléments **demandés**, puis **un seul**
    signal de fin, `onError` ou `onComplete`.
  - **`SubmissionPublisher`** est la seule implémentation fournie : il délivre de façon asynchrone (pool commun par défaut)
    avec un tampon par abonné ; `submit` bloque si le tampon est plein, `offer` peut abandonner.
  - `Flow` sert surtout d'**interface commune** : on n'écrit presque jamais ses propres `Publisher` (le protocole est
    exigeant, la Reactive Streams TCK le vérifie) ; on utilise Reactor ou Mutiny, compatibles via des adaptateurs
    (`JdkFlowAdapter`, `AdaptersToFlow`).
  - Le `HttpClient` du JDK s'appuie sur `Flow` pour lire ou envoyer des corps en flux.

  **Piège classique** : un abonné qui ne fait jamais `request`. Il ne reçoit rien : la contre-pression attend une demande
  explicite.

  **En entretien** : « Les quatre interfaces de Reactive Streams dans le JDK : `Publisher`, `Subscriber`, `Subscription`,
  `Processor`, avec `request(n)` pour la contre-pression ; un socle commun, qu'on utilise via Reactor ou Mutiny. »
cards:
  - key: quatre-interfaces-reactive-streams
    format: course
    question: "Quelles sont les quatre interfaces de Reactive Streams, dans `java.util.concurrent.Flow` ?"
    choices:
      - {text: "`Publisher`, `Subscriber`, `Observer`, `Emitter`", correct: false}
      - {text: "`Publisher`, `Subscriber`, `Subscription`, `Processor`", correct: true}
      - {text: "`Producer`, `Consumer`, `Subscription`, `Processor`", correct: false}
      - {text: "`Flux`, `Mono`, `Subscriber`, `Scheduler`", correct: false}
    answer: "`Publisher` produit, `Subscriber` reçoit, `Subscription` porte les demandes (`request`, `cancel`), `Processor` est les deux à la fois. `Flux` et `Mono` sont des types de Reactor."
  - key: protocole
    format: course
    question: Dans quel ordre un `Subscriber` reçoit-il ses signaux ?
    choices:
      - {text: "`onSubscribe`, puis au plus autant d'`onNext` que demandés, puis `onError` ou `onComplete`", correct: true}
      - {text: "`onNext` dès la souscription, puis `onSubscribe` au premier élément, puis `onComplete`", correct: false}
      - {text: "`onSubscribe`, puis tous les `onNext` du flux, sans demande, puis `onError` et `onComplete`", correct: false}
      - {text: "`onSubscribe`, puis des `onNext` sans limite, puis un `onComplete` après chaque lot", correct: false}
    answer: '`onSubscribe` d''abord, puis au plus autant d''`onNext` que d''éléments demandés, puis un seul signal de fin, `onError` ou `onComplete`.'
  - key: submission-publisher
    format: course
    question: Qu'est-ce que `SubmissionPublisher` ?
    choices:
      - {text: "Une interface du JDK qu'on implémente pour publier des événements synchrones", correct: false}
      - {text: "L'implémentation de `Flow.Publisher` du JDK, asynchrone, avec un tampon par abonné", correct: true}
      - {text: "Un `Subscriber` du JDK qui soumet chaque élément reçu à un `ExecutorService`", correct: false}
      - {text: "Une classe de Reactor qui adapte un `Flux` vers l'API `Flow` du JDK", correct: false}
    answer: La seule implémentation de `Flow.Publisher` du JDK ; elle délivre les éléments de façon asynchrone, avec un tampon par abonné.
  - key: role
    format: course
    question: Pourquoi écrit-on rarement ses propres `Flow.Publisher` ?
    choices:
      - {text: "L'interface `Flow.Publisher` est scellée, et refuse toute autre implémentation", correct: false}
      - {text: "Un `Flow.Publisher` écrit à la main ne peut pas servir à Reactor ni à Mutiny", correct: false}
      - {text: "Le protocole (demandes, concurrence, signaux de fin) est difficile à respecter seul", correct: true}
      - {text: "`Flow.Publisher` est en préversion, à activer avec `--enable-preview`", correct: false}
    answer: Le protocole (demandes, concurrence, signaux de fin) est difficile à respecter ; on utilise des bibliothèques comme Reactor ou Mutiny, et `Flow` sert d'interface commune.
  - key: vf-sans-request
    format: true-false
    question: Un abonné qui ne fait jamais `request` reçoit quand même tous les éléments.
    truth: false
    answer: Il ne reçoit rien ; il doit demander.
  - key: vf-deux-fins
    format: true-false
    question: Un `Subscriber` peut recevoir `onComplete` puis `onError`.
    truth: false
    answer: Un seul signal de fin est permis.
  - key: vf-java9
    format: true-false
    question: "`java.util.concurrent.Flow` existe depuis Java 9."
    truth: true
    answer: Il reprend Reactive Streams.
  - key: vf-processor
    format: true-false
    question: Un `Flow.Processor` est à la fois un `Subscriber` et un `Publisher`.
    truth: true
    answer: Il transforme les éléments entre deux étapes.
  - key: qcm-methodes
    format: multiple-choice
    question: Quelles méthodes appartiennent à `Flow.Subscription` ?
    choices:
      - text: "`request(long n)`"
        correct: true
      - text: "`cancel()`"
        correct: true
      - text: "`onNext(T item)`"
        correct: false
      - text: "`subscribe(Subscriber s)`"
        correct: false
    answer: '`onNext` est sur le `Subscriber`, `subscribe` sur le `Publisher`.'
  - key: qcm-fin
    format: multiple-choice
    question: "Quelle méthode d'un `SubmissionPublisher` signale une fin normale du flux à ses abonnés ?"
    choices:
      - {text: "`closeExceptionally(e)`, qui provoque `onComplete`", correct: false}
      - {text: "`close()`, qui provoque `onComplete`", correct: true}
      - {text: "`submit(null)`, qui provoque `onComplete`", correct: false}
      - {text: "`cancel()`, qui provoque `onComplete`", correct: false}
    answer: "`close()` signale une fin normale (`onComplete`) ; `closeExceptionally(e)` signale un échec (`onError`). `null` n'est pas un élément valide, et `cancel` appartient à la `Subscription`."
  - key: qcm-adaptateurs
    format: multiple-choice
    question: Comment faire communiquer un `Flux` Reactor avec du code qui attend un `Flow.Publisher` ?
    choices:
      - {text: "Ce n'est pas possible : Reactor n'implémente pas `Flow`", correct: false}
      - {text: "En convertissant d'abord le flux entier en `List`", correct: false}
      - {text: "Avec les adaptateurs fournis par Reactor (`JdkFlowAdapter`)", correct: true}
      - {text: "En s'abonnant au `Flux`, puis avec `Thread.join()`", correct: false}
    answer: Reactor et Mutiny savent convertir vers et depuis `Flow`.
  - key: qcm-jdk
    format: multiple-choice
    question: Quelle API du JDK utilise `Flow` pour envoyer ou recevoir des données en flux ?
    choices:
      - {text: "`java.util.Scanner` (`hasNext`, `next`), ligne par ligne", correct: false}
      - {text: "`java.net.http.HttpClient` (`BodyPublisher`, `BodySubscriber`)", correct: true}
      - {text: "`java.io.FileInputStream` (`read`, `transferTo`)", correct: false}
      - {text: "`java.time.Clock` (`instant`, `millis`), pour cadencer", correct: false}
    answer: Les corps de requête et de réponse reposent sur `Flow`.
  - key: code-consume
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> recus = new CopyOnWriteArrayList<>();
      CompletableFuture<Void> fin;
      try (SubmissionPublisher<String> editeur = new SubmissionPublisher<>()) {
          fin = editeur.consume(recus::add);
          editeur.submit("a");
          editeur.submit("b");
      }
      fin.join();
      System.out.println(recus);
      ```
    choices:
      - {text: "`[]`", correct: false}
      - {text: "`[a, b]`", correct: true}
      - {text: "`[b, a]`", correct: false}
      - {text: "`[a]`", correct: false}
    answer: '`[a, b]` : `close()` signale la fin, et `join` attend que tout soit consommé.'
    check:
      output: "[a, b]"
  - key: code-subscriber
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      CountDownLatch termine = new CountDownLatch(1);
      StringBuffer sortie = new StringBuffer();
      try (SubmissionPublisher<Integer> editeur = new SubmissionPublisher<>()) {
          editeur.subscribe(new Flow.Subscriber<>() {
              Flow.Subscription s;
              public void onSubscribe(Flow.Subscription s) { this.s = s; s.request(1); }
              public void onNext(Integer x) { sortie.append(x * 10).append(' '); s.request(1); }
              public void onError(Throwable e) { }
              public void onComplete() { sortie.append("fin"); termine.countDown(); }
          });
          editeur.submit(1);
          editeur.submit(2);
      }
      termine.await();
      System.out.println(sortie);
      ```
    choices:
      - {text: "`10 fin`", correct: false}
      - {text: "`10 20 fin`", correct: true}
      - {text: "`1 2 fin`", correct: false}
      - {text: "`10 20`", correct: false}
    answer: "`10 20 fin` : l'abonné demande un élément à la souscription, puis un de plus après chacun ; la fermeture de l'éditeur envoie `onComplete`, attendu par le `CountDownLatch`."
    check:
      output: "10 20 fin"
  - key: code-abonnes
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      try (SubmissionPublisher<String> editeur = new SubmissionPublisher<>()) {
          editeur.consume(x -> {});
          editeur.consume(x -> {});
          System.out.println(editeur.getNumberOfSubscribers());
      }
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Une `IllegalStateException`", correct: false}
    answer: "`2` : chaque `consume` abonne un nouveau consommateur, même sans élément publié."
    check:
      output: "2"
  - key: code-sans-request
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.util.concurrent.atomic.AtomicInteger;
      AtomicInteger recus = new AtomicInteger();
      CountDownLatch abonne = new CountDownLatch(1);
      try (SubmissionPublisher<String> editeur = new SubmissionPublisher<>()) {
          editeur.subscribe(new Flow.Subscriber<>() {
              public void onSubscribe(Flow.Subscription s) { abonne.countDown(); }   // aucune demande
              public void onNext(String x) { recus.incrementAndGet(); }
              public void onError(Throwable e) { }
              public void onComplete() { }
          });
          abonne.await();
          editeur.submit("a");
          Thread.sleep(100);
          System.out.println(recus.get());
      }
      ```
    choices:
      - {text: "`1`", correct: false}
      - {text: "Une `IllegalStateException`", correct: false}
      - {text: "Rien : `submit` bloque, faute de demande", correct: false}
      - {text: "`0`", correct: true}
    answer: "`0` : sans `request`, aucun élément n'est délivré ; il attend dans le tampon de l'abonné (assez grand pour que `submit` ne bloque pas)."
    check:
      output: "0"
