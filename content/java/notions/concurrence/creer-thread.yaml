notion: creer-thread
lesson: |-
  Un thread exécute une tâche, décrite par un **`Runnable`** (une méthode `run()` sans résultat).

  ```java
  Runnable tache = () -> System.out.println("dans " + Thread.currentThread().getName());

  Thread t = new Thread(tache, "travailleur-1");
  t.start();            // crée un nouveau thread, qui appellera run()
  t.join();             // attend la fin de t

  Thread v = Thread.ofVirtual().start(tache);              // un thread virtuel (Java 21)
  Thread p = Thread.ofPlatform().name("calcul").start(tache);
  ```

  - **`start()`** crée le thread système et y exécute `run()` ; **`run()`** appelé directement s'exécute dans le thread
    **courant**, comme un appel de méthode ordinaire.
  - On ne peut appeler `start()` **qu'une fois** par objet `Thread` : un second appel lève
    `IllegalThreadStateException`.
  - On **passe un `Runnable`** plutôt que d'étendre `Thread` : la tâche reste séparée du mécanisme d'exécution, et peut
    être confiée plus tard à un `ExecutorService`.
  - L'ordre d'exécution entre threads n'est **pas garanti** : un thread démarré peut s'exécuter avant ou après la suite
    du thread qui l'a lancé.
  - Une exception non attrapée dans `run()` **termine le thread** (et s'affiche), sans remonter au thread parent ; on
    peut la capter avec un `UncaughtExceptionHandler`.
  - Donner un **nom** aux threads facilite les logs et les thread dumps.
  - Dans une application, on crée rarement des `Thread` à la main : on utilise un **`ExecutorService`**.

  **Piège classique** : appeler `run()` au lieu de `start()`. Tout s'exécute séquentiellement dans le thread courant, sans
  erreur, et le parallélisme attendu n'a jamais lieu.

  **En entretien** : « Un `Runnable` décrit la tâche, `start()` lance un nouveau thread, `run()` n'est qu'un appel de
  méthode ; en pratique, je passe par un `ExecutorService`. »
cards:
  - key: start-vs-run
    format: course
    question: start() vs run() ?
    answer: start() crée un thread ; run() s'exécute dans le thread courant.
  - key: runnable-vs-extends
    format: course
    question: Pourquoi passer un `Runnable` plutôt qu'étendre `Thread` ?
    answer: "Pour séparer la tâche du mécanisme d'exécution : le `Runnable` peut être confié à un `ExecutorService`, et la classe reste libre d'étendre autre chose."
  - key: exception-run
    format: course
    question: Que se passe-t-il si `run()` lève une exception non attrapée ?
    answer: Le thread se termine et l'exception est passée à l'`UncaughtExceptionHandler` (par défaut, elle est affichée) ; elle ne remonte pas au thread qui l'a démarré.
  - key: start-deux-fois
    format: course
    question: Peut-on démarrer deux fois le même objet `Thread` ?
    answer: Non, un second `start()` lève `IllegalThreadStateException` ; il faut créer un nouveau `Thread`.
  - key: vf-ordre
    format: true-false
    question: Un thread démarré avec `start()` s'exécute toujours avant la ligne suivante du thread qui l'a lancé.
    truth: false
    answer: L'ordre n'est pas garanti ; il faut `join()` ou un autre mécanisme pour attendre.
  - key: vf-run-thread
    format: true-false
    question: "`t.run()` exécute la tâche dans un nouveau thread."
    truth: false
    answer: Dans le thread courant.
  - key: vf-virtuel
    format: true-false
    question: "`Thread.ofVirtual().start(tache)` crée un thread virtuel."
    truth: true
    answer: Depuis Java 21.
  - key: vf-exception-parent
    format: true-false
    question: Une exception levée dans un thread est relancée dans le thread qui l'a démarré.
    truth: false
    answer: Elle reste dans son thread ; un `Future` permet en revanche de la récupérer.
  - key: qcm-lancer
    format: multiple-choice
    question: Lesquelles exécutent la tâche dans un nouveau thread ?
    choices:
      - text: "`new Thread(tache).start()`"
        correct: true
      - text: "`Thread.ofVirtual().start(tache)`"
        correct: true
      - text: "`new Thread(tache).run()`"
        correct: false
      - text: "`tache.run()`"
        correct: false
    answer: '`run()` est un appel de méthode ordinaire.'
  - key: qcm-application
    format: multiple-choice
    question: Dans une application, quelle façon d'exécuter des tâches en arrière-plan privilégier ?
    choices:
      - text: "Un `ExecutorService`"
        correct: true
      - text: "Un `new Thread(...)` par tâche, partout dans le code"
        correct: false
      - text: "Une sous-classe de `Thread` par tâche"
        correct: false
      - text: "Des appels à `run()`"
        correct: false
    answer: Le pool gère la création, la réutilisation et l'arrêt des threads.
  - key: qcm-nom
    format: multiple-choice
    question: Pourquoi nommer ses threads ?
    choices:
      - text: "Pour les repérer dans les logs et les thread dumps"
        correct: true
      - text: "Pour les rendre plus rapides"
        correct: false
      - text: "Pour pouvoir les démarrer deux fois"
        correct: false
      - text: "C'est obligatoire"
        correct: false
    answer: '`pool-3-thread-7` dit peu ; `export-factures-2` dit tout.'
  - key: qcm-exception
    format: multiple-choice
    question: "Que fait `t.start(); t.start();` ?"
    choices:
      - text: "Le second appel lève `IllegalThreadStateException`"
        correct: true
      - text: "Deux threads s'exécutent"
        correct: false
      - text: "Le second appel est ignoré"
        correct: false
      - text: "Ne compile pas"
        correct: false
    answer: Un objet `Thread` ne se démarre qu'une fois.
  - key: trous-start
    format: fill-in
    question: |-
      Complétez pour exécuter la tâche dans un nouveau thread :
      ```java
      Thread t = new Thread(() -> envoyer(rapport));
      t.___();
      ```
    blanks: [[start]]
    answer: '`start()` crée le thread, qui appelle `run()`.'
  - key: trous-join
    format: fill-in
    question: |-
      Complétez pour attendre la fin du thread :
      ```java
      t.start();
      t.___();
      afficher(resultat);
      ```
    blanks: [[join]]
    answer: '`join()` bloque jusqu''à la fin de `t`.'
  - key: trous-runnable
    format: fill-in
    question: |-
      Complétez le type de la tâche :
      ```java
      ___ tache = () -> nettoyerCache();
      new Thread(tache).start();
      ```
    blanks: [[Runnable]]
    answer: Une tâche sans résultat.
  - key: trous-virtuel
    format: fill-in
    question: |-
      Complétez pour démarrer un thread virtuel :
      ```java
      Thread t = Thread.___().start(tache);
      ```
    blanks: [[ofVirtual]]
    answer: Java 21.
  - key: code-thread-new-thread-system-out
    format: code-output
    question: '`Thread t = new Thread(() -> System.out.println(Thread.currentThread().getName())); t.run();`'
    answer: '`main` : run() s''exécute dans le thread courant ; il faut start().'
    check:
      code: |-
        Thread t = new Thread(() -> System.out.println(Thread.currentThread().getName())); t.run();
      output: "main"
  - key: code-start-join
    format: code-output
    question: |-
      ```java
      Thread t = new Thread(() -> System.out.println(Thread.currentThread().getName()), "travailleur");
      t.start();
      t.join();
      System.out.println("fin");
      ```
    answer: '`travailleur`, puis `fin` : `join` attend la fin du thread.'
    check:
      output: "travailleur\nfin"
  - key: code-deux-start
    format: code-output
    question: |-
      ```java
      Thread t = new Thread(() -> {});
      t.start();
      t.join();
      t.start();
      ```
    answer: Une `IllegalThreadStateException` au second `start()`.
    check:
      throws: IllegalThreadStateException
  - key: code-virtuel
    format: code-output
    question: |-
      ```java
      Thread t = Thread.ofVirtual().start(() -> System.out.println(Thread.currentThread().isVirtual()));
      t.join();
      ```
    answer: '`true`.'
    check:
      output: "true"
  - key: bug-run
    format: bug-fix
    question: |-
      Ces exports devaient s'exécuter en parallèle, mais prennent la somme de leurs durées :
      ```java
      for (Export e : exports) {
          new Thread(e::executer).run();
      }
      ```
    answer: |-
      ```java
      try (var executor = Executors.newFixedThreadPool(4)) {
          for (Export e : exports) {
              executor.submit(e::executer);
          }
      }   // close() attend la fin des tâches (Java 19+)
      ```
      `run()` exécutait chaque export dans le thread courant, l'un après l'autre. `start()` (ou mieux, un pool) les lance
      dans d'autres threads.
  - key: bug-pas-de-join
    format: bug-fix
    question: |-
      Le résultat est parfois vide :
      ```java
      List<String> lignes = new CopyOnWriteArrayList<>();
      Thread t = new Thread(() -> lignes.addAll(charger()));
      t.start();
      afficher(lignes);
      ```
    answer: |-
      ```java
      t.start();
      t.join();
      afficher(lignes);
      ```
      Rien ne garantit que le thread a fini avant l'affichage. `join()` attend sa fin (et garantit la visibilité de ses
      écritures).
  - key: bug-extends-thread
    format: bug-fix
    question: |-
      Améliorez :
      ```java
      class Rapport extends Thread {
          @Override public void run() { generer(); }
      }
      new Rapport().start();
      ```
    answer: |-
      ```java
      class Rapport implements Runnable {
          @Override public void run() { generer(); }
      }
      executor.submit(new Rapport());
      ```
      La tâche n'a pas à être un thread : un `Runnable` se confie à un pool, se teste sans thread et laisse la classe
      libre d'étendre autre chose.
  - key: bug-exception-perdue
    format: bug-fix
    question: |-
      Une erreur dans l'import en arrière-plan passe inaperçue, l'appelant croit que tout a réussi :
      ```java
      new Thread(() -> importer(fichier)).start();
      ```
    answer: |-
      ```java
      Future<?> resultat = executor.submit(() -> importer(fichier));
      // plus tard :
      resultat.get();    // relance l'exception dans une ExecutionException
      ```
      Une exception dans un thread ne remonte pas à l'appelant. Un `Future` la conserve et la relance à `get()` (ou un
      `UncaughtExceptionHandler` la journalise au minimum).
