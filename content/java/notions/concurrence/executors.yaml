notion: executors
cards:
  - key: politiques-rejet-threadpoolexecutor
    format: course
    question: Les politiques de rejet de ThreadPoolExecutor ?
    answer: AbortPolicy, CallerRunsPolicy, DiscardPolicy, DiscardOldestPolicy.
  - key: maximumpoolsize-sert-rien-avec-file-illimitee
    format: course
    question: Pourquoi maximumPoolSize ne sert à rien avec une file illimitée ?
    answer: Les threads au-delà du core ne sont créés que quand la file est pleine, ce qui n'arrive jamais.
  - key: nommer-threads-pool
    format: course
    question: Pourquoi nommer les threads d'un pool ?
    answer: Pour rendre les thread dumps et les logs lisibles.
  - key: arreter-proprement-executorservice
    format: course
    question: Comment arrêter proprement un ExecutorService ?
    answer: shutdown, awaitTermination avec timeout, puis shutdownNow si nécessaire ; ou close() depuis Java 19.
