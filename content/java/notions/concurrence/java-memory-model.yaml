notion: java-memory-model
lesson: |-
  Le **modèle mémoire Java** (JMM, JSR 133, Java 5) dit **quand une écriture faite par un thread est garantie visible**
  par un autre. Sans ces règles, le compilateur, le JIT et le processeur peuvent **réordonner** les instructions et garder
  des valeurs en cache, tant que le résultat reste le même **pour un seul thread**.

  La notion centrale est la relation **happens-before** : si une action A *happens-before* une action B, alors B voit les
  effets de A (et de tout ce qui précède A). Les principales règles :

  | Règle | A happens-before B |
  |---|---|
  | ordre du programme | dans un même thread, chaque instruction avant les suivantes |
  | verrou | rendre un moniteur avant de le reprendre (même moniteur) |
  | `volatile` | écrire une variable `volatile` avant de la lire |
  | démarrage | `t.start()` avant toute action de `t` |
  | fin | toute action de `t` avant le retour de `t.join()` |
  | `final` | la fin du constructeur avant la lecture des champs `final` (si `this` ne s'est pas échappé) |
  | transitivité | si A hb B et B hb C, alors A hb C |

  Les bibliothèques en ajoutent : mettre un élément dans une `BlockingQueue` ou une `ConcurrentHashMap` *happens-before* de
  le lire, la fin d'une tâche *happens-before* le retour de `Future.get()`.

  - Une **data race** est un couple d'accès à la même variable, dont une écriture, **sans** relation happens-before. Un
    programme sans data race se comporte comme s'il était séquentiellement cohérent.
  - Les **champs `final`** donnent une garantie spéciale : un objet **immuable** correctement construit est vu complet
    par tous les threads, même publié sans synchronisation.
  - La **publication sûre** d'un objet passe par un champ `volatile`, un verrou, un champ `final` ou une collection
    concurrente.

  **Piège classique** : raisonner en « temps réel » (« l'écriture a eu lieu avant, donc l'autre thread la voit »). Seule
  une relation happens-before garantit la visibilité.

  **En entretien** : « Le JMM définit la visibilité par la relation happens-before : verrous, `volatile`, `start`, `join`,
  champs `final`, et les collections concurrentes. Sans elle, aucune garantie. »
cards:
  - key: relation-happens-before
    format: course
    question: C'est quoi la relation happens-before ?
    answer: La garantie du JMM qu'une action est visible et ordonnée avant une autre (verrou, volatile, start, join, champs final).
  - key: pourquoi-jmm
    format: course
    question: Pourquoi Java a-t-il besoin d'un modèle mémoire ?
    answer: Parce que le compilateur, le JIT et le processeur réordonnent les instructions et gardent des valeurs en cache ; le JMM définit quand une écriture est garantie visible par un autre thread.
  - key: final
    format: course
    question: Quelle garantie particulière offrent les champs `final` ?
    answer: Après la fin du constructeur (si `this` ne s'est pas échappé), tout thread qui voit l'objet voit ses champs `final` initialisés, même sans synchronisation.
  - key: publication-sure
    format: course
    question: Comment publier un objet de façon sûre ?
    answer: Par un champ `volatile`, sous un verrou, par un champ `final` d'un objet correctement construit, ou par une collection concurrente (`ConcurrentHashMap`, `BlockingQueue`).
  - key: vf-temps-reel
    format: true-false
    question: Si un thread écrit une variable « avant » qu'un autre la lise dans le temps, le second voit forcément la valeur.
    truth: false
    answer: Seule une relation happens-before le garantit.
  - key: vf-join
    format: true-false
    question: Après `t.join()`, le thread appelant voit toutes les écritures faites par `t`.
    truth: true
    answer: La fin de `t` happens-before le retour de `join`.
  - key: vf-reordonner
    format: true-false
    question: Le JIT peut réordonner des instructions indépendantes d'un même thread.
    truth: true
    answer: Tant que le résultat est le même pour ce thread ; d'autres threads peuvent observer l'ordre changé.
  - key: vf-queue
    format: true-false
    question: Mettre un objet dans une `BlockingQueue` happens-before de le retirer dans un autre thread.
    truth: true
    answer: Les collections concurrentes documentent ces garanties.
  - key: qcm-regles
    format: multiple-choice
    question: Lesquelles créent une relation happens-before ?
    choices:
      - text: "Rendre un moniteur, puis le reprendre dans un autre thread"
        correct: true
      - text: "Écrire un champ `volatile`, puis le lire dans un autre thread"
        correct: true
      - text: "Écrire un champ ordinaire, puis attendre une seconde"
        correct: false
      - text: "Écrire dans deux champs ordinaires dans un ordre précis"
        correct: false
    answer: Une attente ou un ordre d'écriture ne garantissent rien.
  - key: qcm-start
    format: multiple-choice
    question: "Un thread écrit `config = ...` puis appelle `t.start()`. Que voit `t` ?"
    choices:
      - text: "La valeur écrite, car `start` happens-before les actions de `t`"
        correct: true
      - text: "Peut-être une ancienne valeur"
        correct: false
      - text: "Toujours `null`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: Ce qui précède `start()` est visible par le nouveau thread.
  - key: qcm-data-race
    format: multiple-choice
    question: Qu'est-ce qu'une data race au sens du JMM ?
    choices:
      - text: "Deux accès à la même variable, dont une écriture, sans relation happens-before"
        correct: true
      - text: "Deux threads qui lisent la même variable"
        correct: false
      - text: "Deux threads qui prennent le même verrou"
        correct: false
      - text: "Un thread qui écrit une variable locale"
        correct: false
    answer: Deux lectures seules ne posent pas de problème.
  - key: qcm-immuable
    format: multiple-choice
    question: Pourquoi un objet immuable (champs `final`) peut-il être partagé sans verrou ?
    choices:
      - text: "Le JMM garantit la visibilité des champs `final` après la construction, et rien ne change ensuite"
        correct: true
      - text: "Parce que les objets immuables sont copiés pour chaque thread"
        correct: false
      - text: "Parce que le GC les protège"
        correct: false
      - text: "Ce n'est pas possible"
        correct: false
    answer: À condition que `this` ne s'échappe pas pendant la construction.
  - key: definition-jmm
    format: definition
    question: JMM
    answer: 'Java Memory Model : règles de visibilité et d''ordonnancement (happens-before)'
  - key: definition-happens-before
    format: definition
    question: Happens-before
    answer: La relation du modèle mémoire qui garantit qu'une action et tout ce qui la précède sont visibles par une autre action.
  - key: definition-publication-sure
    format: definition
    question: Publication sûre
    answer: Rendre un objet accessible à d'autres threads de façon qu'ils le voient complètement construit (via `volatile`, verrou, champ `final` ou collection concurrente).
  - key: definition-data-race
    format: definition
    question: Data race
    answer: Deux accès concurrents à une même variable, dont au moins une écriture, sans relation happens-before entre eux.
