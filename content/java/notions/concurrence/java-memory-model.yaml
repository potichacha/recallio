notion: java-memory-model
cards:
  - key: relation-happens-before
    format: course
    question: C'est quoi la relation happens-before ?
    answer: La garantie du JMM qu'une action est visible et ordonnée avant une autre (verrou, volatile, start, join, champs final).
  - key: definition-jmm
    format: definition
    question: JMM
    answer: 'Java Memory Model : règles de visibilité et d''ordonnancement (happens-before)'
