notion: java-memory-model
lesson: |-
  Le **modèle mémoire Java** (JMM, JSR 133, Java 5) dit **quand une écriture faite par un thread est garantie visible**
  par un autre. Sans ces règles, le compilateur, le JIT et le processeur peuvent **réordonner** les instructions et garder
  des valeurs en cache, tant que le résultat reste le même **pour un seul thread**.

  La notion centrale est la relation **happens-before** : si une action A *happens-before* une action B, alors B voit les
  effets de A (et de tout ce qui précède A). Les principales règles :

  | Règle | A happens-before B |
  |---|---|
  | ordre du programme | dans un même thread, chaque instruction avant les suivantes |
  | verrou | rendre un moniteur avant de le reprendre (même moniteur) |
  | `volatile` | écrire une variable `volatile` avant de la lire |
  | démarrage | `t.start()` avant toute action de `t` |
  | fin | toute action de `t` avant le retour de `t.join()` |
  | `final` | la fin du constructeur avant la lecture des champs `final` (si `this` ne s'est pas échappé) |
  | transitivité | si A hb B et B hb C, alors A hb C |

  Les bibliothèques en ajoutent : mettre un élément dans une `BlockingQueue` ou une `ConcurrentHashMap` *happens-before* de
  le lire, la fin d'une tâche *happens-before* le retour de `Future.get()`.

  - Une **data race** est un couple d'accès à la même variable, dont une écriture, **sans** relation happens-before. Un
    programme sans data race se comporte comme s'il était séquentiellement cohérent.
  - Les **champs `final`** donnent une garantie spéciale : un objet **immuable** correctement construit est vu complet
    par tous les threads, même publié sans synchronisation.
  - La **publication sûre** d'un objet passe par un champ `volatile`, un verrou, un champ `final` ou une collection
    concurrente.

  **Piège classique** : raisonner en « temps réel » (« l'écriture a eu lieu avant, donc l'autre thread la voit »). Seule
  une relation happens-before garantit la visibilité.

  **En entretien** : « Le JMM définit la visibilité par la relation happens-before : verrous, `volatile`, `start`, `join`,
  champs `final`, et les collections concurrentes. Sans elle, aucune garantie. »
cards:
  - key: relation-happens-before
    format: course
    question: "Qu'est-ce que la relation happens-before ?"
    choices:
      - {text: "L'ordre dans lequel le processeur exécute réellement les instructions", correct: false}
      - {text: "L'ordre chronologique des actions, mesuré par l'horloge du système", correct: false}
      - {text: "La règle qui fixe quel thread obtient un verrou en premier", correct: false}
      - {text: "La garantie qu'une action est visible et ordonnée avant une autre, entre threads", correct: true}
    answer: "La garantie du JMM qu'une action est visible et ordonnée avant une autre (verrou, `volatile`, `start`, `join`, champs `final`). Ce n'est pas l'ordre réel d'exécution : c'est une garantie de visibilité."
  - key: pourquoi-jmm
    format: course
    question: Pourquoi Java a-t-il besoin d'un modèle mémoire ?
    choices:
      - {text: "Pour décider quand le ramasse-miettes peut libérer un objet partagé entre threads", correct: false}
      - {text: "Pour répartir le tas entre les threads, chacun ayant sa zone de mémoire privée", correct: false}
      - {text: "Compilateur, JIT et processeur réordonnent et cachent les valeurs : il dit quand une écriture devient visible", correct: true}
      - {text: "Pour fixer la taille maximale de la pile de chaque thread de la JVM", correct: false}
    answer: Parce que le compilateur, le JIT et le processeur réordonnent les instructions et gardent des valeurs en cache ; le JMM définit quand une écriture est garantie visible par un autre thread.
  - key: final
    format: course
    question: Quelle garantie particulière offrent les champs `final` ?
    choices:
      - {text: "Un champ `final` est copié dans le cache de chaque thread, qui le lit sans conflit", correct: false}
      - {text: "Après le constructeur, tout thread qui voit l'objet voit ses champs `final` initialisés", correct: true}
      - {text: "Un champ `final` rend immuables aussi les objets qu'il référence", correct: false}
      - {text: "Un champ `final` est lu sous un verrou implicite posé par la JVM à chaque accès", correct: false}
    answer: Après la fin du constructeur (si `this` ne s'est pas échappé), tout thread qui voit l'objet voit ses champs `final` initialisés, même sans synchronisation.
  - key: publication-sure
    format: course
    question: Comment publier un objet de façon sûre ?
    choices:
      - {text: "En l'affectant à un champ ordinaire, juste à la fin de son constructeur", correct: false}
      - {text: "En le rangeant dans un champ `static` ordinaire, visible de tous les threads", correct: false}
      - {text: "Par un champ `volatile`, un verrou, un champ `final` ou une collection concurrente", correct: true}
      - {text: "En attendant quelques millisecondes avant de le passer aux autres threads", correct: false}
    answer: Par un champ `volatile`, sous un verrou, par un champ `final` d'un objet correctement construit, ou par une collection concurrente (`ConcurrentHashMap`, `BlockingQueue`).
  - key: vf-temps-reel
    format: true-false
    question: Si un thread écrit une variable « avant » qu'un autre la lise dans le temps, le second voit forcément la valeur.
    truth: false
    answer: Seule une relation happens-before le garantit.
  - key: vf-join
    format: true-false
    question: Après `t.join()`, le thread appelant voit toutes les écritures faites par `t`.
    truth: true
    answer: La fin de `t` happens-before le retour de `join`.
  - key: vf-reordonner
    format: true-false
    question: Le JIT peut réordonner des instructions indépendantes d'un même thread.
    truth: true
    answer: Tant que le résultat est le même pour ce thread ; d'autres threads peuvent observer l'ordre changé.
  - key: vf-queue
    format: true-false
    question: Mettre un objet dans une `BlockingQueue` happens-before de le retirer dans un autre thread.
    truth: true
    answer: Les collections concurrentes documentent ces garanties.
  - key: qcm-regles
    format: multiple-choice
    question: "Laquelle de ces actions crée une relation happens-before ?"
    choices:
      - {text: "Écrire un champ `volatile`, puis le lire dans un autre thread", correct: true}
      - {text: "Écrire un champ ordinaire, puis attendre une seconde", correct: false}
      - {text: "Écrire dans deux champs ordinaires dans un ordre précis", correct: false}
      - {text: "Relire un champ ordinaire en boucle jusqu'à voir la valeur", correct: false}
    answer: "L'écriture d'un `volatile` happens-before sa lecture par un autre thread, comme rendre puis reprendre un moniteur. Une attente ou un ordre d'écriture ne garantissent rien."
  - key: qcm-start
    format: multiple-choice
    question: "Un thread écrit `config = ...` puis appelle `t.start()`. Que voit `t` ?"
    choices:
      - {text: "Peut-être une ancienne valeur, faute de `volatile` sur `config`", correct: false}
      - {text: "Toujours `null`, car `t` travaille sur sa propre copie des champs", correct: false}
      - {text: "La valeur écrite, car `start` happens-before les actions de `t`", correct: true}
      - {text: "Une exception, car `config` est lu par `t` sans aucun verrou", correct: false}
    answer: Ce qui précède `start()` est visible par le nouveau thread.
  - key: qcm-data-race
    format: multiple-choice
    question: Qu'est-ce qu'une data race au sens du JMM ?
    choices:
      - {text: "Deux accès à la même variable, dont une écriture, sans relation happens-before", correct: true}
      - {text: "Deux threads qui lisent la même variable au même moment, sans verrou", correct: false}
      - {text: "Deux threads qui prennent le même verrou l'un après l'autre, sans attendre", correct: false}
      - {text: "Un thread qui écrit une variable locale pendant qu'un autre la lit", correct: false}
    answer: Deux lectures seules ne posent pas de problème.
  - key: qcm-immuable
    format: multiple-choice
    question: Pourquoi un objet immuable (champs `final`) peut-il être partagé sans verrou ?
    choices:
      - {text: "Le JMM garantit la visibilité des champs `final` après la construction, et rien ne change ensuite", correct: true}
      - {text: "Parce que la JVM copie les objets immuables dans le cache de chaque thread lecteur", correct: false}
      - {text: "Parce que le GC range les objets immuables dans une zone du tas protégée en écriture", correct: false}
      - {text: "Parce que la JVM verrouille tout objet immuable pendant chacune de ses lectures", correct: false}
    answer: À condition que `this` ne s'échappe pas pendant la construction.
  - key: definition-jmm
    format: definition
    question: "Qu'est-ce que le JMM ?"
    choices:
      - {text: "Le découpage de la mémoire de la JVM en tas, piles et Metaspace", correct: false}
      - {text: "Les règles du ramasse-miettes pour libérer les objets inaccessibles", correct: false}
      - {text: "Les règles de visibilité et d'ordre des accès mémoire entre threads (happens-before)", correct: true}
      - {text: "Les options `-Xms` et `-Xmx` qui fixent la taille du tas de la JVM", correct: false}
    answer: "*Java Memory Model* : les règles de visibilité et d'ordonnancement (happens-before) entre threads. Le découpage en tas, piles et Metaspace est l'organisation de la mémoire, pas son modèle."
  - key: definition-happens-before
    format: definition
    question: "Que désigne le terme happens-before ?"
    choices:
      - {text: "L'ordre chronologique réel des instructions, tel que le processeur les exécute", correct: false}
      - {text: "La règle qui donne le verrou au thread qui l'a demandé le premier", correct: false}
      - {text: "La garantie qu'une action, et tout ce qui la précède, est visible par une autre action", correct: true}
      - {text: "L'ordre dans lequel le compilateur range les instructions dans le bytecode", correct: false}
    answer: La relation du modèle mémoire qui garantit qu'une action et tout ce qui la précède sont visibles par une autre action.
  - key: definition-publication-sure
    format: definition
    question: "Qu'appelle-t-on une publication sûre ?"
    choices:
      - {text: "Publier une API dont toutes les méthodes publiques sont `synchronized`", correct: false}
      - {text: "Rendre un objet accessible aux autres threads de sorte qu'ils le voient complètement construit", correct: true}
      - {text: "Garder un objet accessible au seul thread qui l'a créé, sans le partager", correct: false}
      - {text: "Donner à chaque thread sa propre copie de l'objet, pour ne rien partager", correct: false}
    answer: Rendre un objet accessible à d'autres threads de façon qu'ils le voient complètement construit (via `volatile`, verrou, champ `final` ou collection concurrente).
  - key: definition-data-race
    format: definition
    question: "Que désigne une data race ?"
    choices:
      - {text: "Deux accès concurrents à une variable, dont une écriture, sans happens-before entre eux", correct: true}
      - {text: "Deux threads en compétition pour obtenir le même verrou au même moment", correct: false}
      - {text: "Un résultat qui dépend de l'ordre des threads, même avec des accès synchronisés", correct: false}
      - {text: "Deux threads qui lisent en même temps une variable partagée non `volatile`", correct: false}
    answer: "Deux accès concurrents à une même variable, dont au moins une écriture, sans relation happens-before entre eux. Un résultat qui dépend de l'ordre des threads malgré la synchronisation, c'est une race condition."
