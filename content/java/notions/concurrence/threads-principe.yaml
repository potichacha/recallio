notion: threads-principe
lesson: |-
  - Un **processus** est un programme en cours d'exécution, avec sa propre mémoire : une JVM est un processus.
  - Un **thread** est un fil d'exécution **à l'intérieur** d'un processus. Les threads d'un même processus partagent le
    **tas** (les objets) mais chacun a sa **pile** (variables locales, appels en cours).

  ```
  Processus JVM
  ├── tas partagé : objets, champs statiques
  ├── thread main      → sa pile
  ├── thread http-1    → sa pile
  └── thread GC ...    → sa pile
  ```

  Deux notions à ne pas confondre :
  - la **concurrence** : plusieurs tâches **progressent en même temps** du point de vue du programme, en s'entrelaçant
    (même sur un seul cœur) ; c'est une question de **structure** (gérer plusieurs choses) ;
  - le **parallélisme** : plusieurs tâches **s'exécutent au même instant** sur plusieurs cœurs ; c'est une question
    d'**exécution** (aller plus vite).

  Pourquoi plusieurs threads :
  - servir plusieurs **requêtes** à la fois (un serveur web) ;
  - ne pas **bloquer** pendant une entrée-sortie (attendre la base, le réseau) ;
  - exploiter **plusieurs cœurs** pour un calcul lourd.

  Le prix :
  - le partage du tas crée des **conditions de course** : deux threads qui modifient le même objet sans coordination
    produisent des résultats faux ;
  - les bugs dépendent de l'**entrelacement** : ils sont rares, non reproductibles, et apparaissent sous charge ;
  - un thread de plateforme coûte (environ 1 Mo de pile réservée, un thread du système) : on ne peut pas en créer des
    millions, d'où les **pools** et les **threads virtuels** (Java 21).

  **Piège classique** : croire que plus de threads veut dire plus de vitesse. Au-delà du nombre de cœurs pour du calcul,
  les threads se disputent le processeur et les changements de contexte coûtent.

  **En entretien** : « Les threads partagent le tas, chacun a sa pile ; la concurrence structure plusieurs tâches, le
  parallélisme les exécute en même temps sur plusieurs cœurs. Le partage impose de synchroniser. »
cards:
  - key: processus-thread
    format: course
    question: Quelle différence entre un processus et un thread ?
    answer: Un processus a sa propre mémoire ; les threads d'un même processus partagent le tas (les objets) et ont chacun leur pile.
  - key: concurrence-parallelisme
    format: course
    question: Quelle différence entre concurrence et parallélisme ?
    answer: La concurrence, c'est gérer plusieurs tâches qui progressent en s'entrelaçant (même sur un cœur) ; le parallélisme, c'est en exécuter plusieurs au même instant sur plusieurs cœurs.
  - key: partage
    format: course
    question: Qu'est-ce que les threads partagent, et qu'est-ce qui leur est propre ?
    answer: Ils partagent le tas (objets, champs statiques) ; chacun a sa pile (variables locales, paramètres, appels en cours).
  - key: pourquoi
    format: course
    question: Pourquoi utiliser plusieurs threads ?
    answer: Servir plusieurs requêtes à la fois, ne pas bloquer pendant les entrées-sorties, et exploiter plusieurs cœurs pour un calcul lourd.
  - key: vf-pile
    format: true-false
    question: Les variables locales d'une méthode sont partagées entre les threads qui l'exécutent.
    truth: false
    answer: Chaque thread a sa pile ; seuls les objets du tas sont partagés.
  - key: vf-un-coeur
    format: true-false
    question: La concurrence est possible sur une machine à un seul cœur.
    truth: true
    answer: Les threads s'entrelacent ; seul le parallélisme exige plusieurs cœurs.
  - key: vf-plus-threads
    format: true-false
    question: Pour un calcul pur, doubler le nombre de threads au-delà du nombre de cœurs double la vitesse.
    truth: false
    answer: Les threads se disputent les cœurs, et les changements de contexte coûtent.
  - key: vf-reproductible
    format: true-false
    question: Un bug de concurrence se reproduit en général facilement en test.
    truth: false
    answer: Il dépend de l'entrelacement des threads, souvent rare et lié à la charge.
  - key: qcm-partage
    format: multiple-choice
    question: Qu'est-ce qui est partagé entre les threads d'une JVM ?
    choices:
      - text: "Les objets du tas"
        correct: true
      - text: "Les champs statiques"
        correct: true
      - text: "Les variables locales"
        correct: false
      - text: "Les paramètres de méthode"
        correct: false
    answer: Une variable locale qui référence un objet partagé donne toutefois accès à cet objet.
  - key: qcm-parallelisme
    format: multiple-choice
    question: Lequel décrit le parallélisme ?
    choices:
      - text: "Quatre calculs exécutés au même instant sur quatre cœurs"
        correct: true
      - text: "Un serveur qui alterne entre mille requêtes sur un cœur"
        correct: false
      - text: "Une tâche qui attend une réponse réseau"
        correct: false
      - text: "Une boucle qui s'exécute plus vite"
        correct: false
    answer: L'alternance sur un cœur est de la concurrence.
  - key: qcm-cout
    format: multiple-choice
    question: Pourquoi ne crée-t-on pas un thread de plateforme par tâche pour un million de tâches ?
    choices:
      - text: "Chaque thread réserve une pile et correspond à un thread du système"
        correct: true
      - text: "La JVM limite le nombre de threads à 100"
        correct: false
      - text: "Les threads ne peuvent pas partager d'objets"
        correct: false
      - text: "Un thread ne peut exécuter qu'une seule méthode"
        correct: false
    answer: D'où les pools de threads, et les threads virtuels pour les tâches bloquantes.
  - key: qcm-risques
    format: multiple-choice
    question: Quels risques introduit le partage d'objets entre threads ?
    choices:
      - text: "Des mises à jour perdues"
        correct: true
      - text: "Un thread qui ne voit pas les écritures d'un autre"
        correct: true
      - text: "Une erreur de compilation"
        correct: false
      - text: "La duplication automatique des objets"
        correct: false
    answer: Atomicité et visibilité sont les deux problèmes à traiter.
  - key: scenario-expliquer
    format: scenario
    question: Explique à un développeur junior la différence entre concurrence et parallélisme, avec un exemple.
    answer: |-
      Je prends un cuisinier : s'il prépare trois plats en passant de l'un à l'autre pendant que l'eau chauffe, c'est de
      la **concurrence**, plusieurs tâches avancent mais une seule action à la fois. S'ils sont trois cuisiniers, chacun
      sur un plat, c'est du **parallélisme**. En Java, un serveur qui gère mille requêtes en attente de la base est
      surtout concurrent (les threads attendent), un calcul d'images sur huit cœurs est parallèle. La concurrence sert à
      ne pas rester bloqué, le parallélisme à aller plus vite ; les deux imposent de protéger les données partagées.
  - key: scenario-bug-sous-charge
    format: scenario
    question: Un bug n'apparaît qu'en production sous forte charge, jamais en local. À quoi penses-tu ?
    answer: |-
      À un problème de concurrence : un état partagé modifié sans synchronisation (un compteur, une `HashMap`, un
      `SimpleDateFormat` partagé, un champ d'un singleton), dont l'entrelacement fautif ne se produit qu'avec beaucoup de
      threads simultanés. Je cherche les objets partagés (singletons, champs statiques, beans) qui ont un état modifiable,
      je vérifie leur protection, et j'essaie de reproduire avec un test de charge ou un test concurrent qui lance de
      nombreux threads. Les logs avec le nom du thread et un thread dump aident à voir qui fait quoi au même moment.
  - key: scenario-plus-de-threads
    format: scenario
    question: Un traitement par lots est lent. Un collègue propose de passer le pool de 8 à 200 threads. Qu'en penses-tu ?
    answer: |-
      Ça dépend de ce que font les tâches. Si elles calculent (CPU), 200 threads sur 8 cœurs n'ajoutent rien : ils se
      disputent les cœurs et les changements de contexte ralentissent. Si elles attendent beaucoup (base, HTTP), plus de
      threads peut aider, mais la limite se déplace alors vers la ressource attendue : 200 requêtes simultanées peuvent
      saturer le pool de connexions de la base. Je mesure d'abord où le temps est passé (profilage, temps d'attente),
      puis je dimensionne ; pour beaucoup de tâches bloquantes, des threads virtuels avec une concurrence bornée sont une
      bonne option.
  - key: scenario-etat-partage
    format: scenario
    question: Comment réduis-tu les risques liés au partage d'état entre threads dans un service ?
    answer: |-
      En partageant le moins possible : des objets **immuables** (records), des données **confinées** au thread de la
      requête (variables locales, objets créés par requête), des services **sans état**. Pour ce qui doit être partagé,
      des structures conçues pour (`ConcurrentHashMap`, `AtomicLong`, `BlockingQueue`) plutôt que des verrous écrits à la
      main. Et je documente la politique de thread-safety de chaque classe partagée.
