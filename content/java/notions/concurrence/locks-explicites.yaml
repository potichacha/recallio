notion: locks-explicites
lesson: |-
  `java.util.concurrent.locks` offre des verrous plus souples que `synchronized`, au prix d'un déverrouillage **manuel**.

  ```java
  private final ReentrantLock verrou = new ReentrantLock();

  void deposer(long m) {
      verrou.lock();
      try {
          solde += m;
      } finally {
          verrou.unlock();             // toujours dans un finally
      }
  }

  if (verrou.tryLock(200, TimeUnit.MILLISECONDS)) { try { ... } finally { verrou.unlock(); } }
  ```

  | Verrou | Apport |
  |---|---|
  | **`ReentrantLock`** | `tryLock` (avec ou sans délai), `lockInterruptibly`, mode **équitable** (`new ReentrantLock(true)`), plusieurs **`Condition`** |
  | **`ReentrantReadWriteLock`** | plusieurs **lecteurs** simultanés, un seul **écrivain** : utile si les lectures dominent |
  | **`StampedLock`** | lecture **optimiste** sans verrou (`tryOptimisticRead` puis `validate`) ; **non réentrant** |

  ```java
  private final Condition nonVide = verrou.newCondition();
  // consommateur : while (file.isEmpty()) nonVide.await();
  // producteur   : file.add(x); nonVide.signal();
  ```

  - Une `Condition` remplace `wait`/`notify`, avec **une condition par motif d'attente** (non plein, non vide).
  - Le mode équitable évite la famine mais réduit le débit.
  - `synchronized` reste le **choix par défaut** : plus simple, impossible d'oublier de déverrouiller, et optimisé par la
    JVM. On passe à `ReentrantLock` pour `tryLock`, l'interruptibilité, l'équité ou plusieurs conditions.
  - Avant Java 24, `ReentrantLock` évitait l'épinglage des threads virtuels que provoquait `synchronized`.

  **Piège classique** : `verrou.lock(); traiter(); verrou.unlock();` sans `try/finally`. Si `traiter()` lève une exception,
  le verrou n'est jamais rendu et tous les autres threads se bloquent.

  **En entretien** : « `ReentrantLock` apporte `tryLock`, équité, interruptibilité et `Condition`, mais impose
  `unlock()` dans un `finally` ; `ReadWriteLock` pour beaucoup de lectures ; `synchronized` par défaut. »
cards:
  - key: reentrantlock-vs-synchronized
    format: course
    question: "Qu'apporte `ReentrantLock` par rapport à `synchronized` ?"
    choices:
      - {text: "La réentrance : avec `synchronized`, un thread se bloquerait sur son propre verrou", correct: false}
      - {text: "La garantie de visibilité des écritures, absente avec `synchronized`", correct: false}
      - {text: "La libération automatique du verrou en cas d'exception, sans `finally`", correct: false}
      - {text: "`tryLock`, une attente bornée ou interruptible, l'équité et plusieurs conditions", correct: true}
    answer: "`ReentrantLock` ajoute `tryLock`, le délai, l'attente interruptible, l'équité et plusieurs `Condition`. `synchronized` est lui aussi réentrant, garantit la même visibilité, et lui seul rend le verrou automatiquement."
  - key: stampedlock
    format: course
    question: "Qu'est-ce qu'un `StampedLock` ?"
    choices:
      - {text: "Un verrou de lecture-écriture réentrant, qui remplace `ReentrantReadWriteLock`", correct: false}
      - {text: "Un verrou qui horodate chaque demande pour servir les threads dans l'ordre", correct: false}
      - {text: "Un verrou avec une lecture optimiste sans blocage, validée après coup ; non réentrant", correct: true}
      - {text: "Un verrou réservé aux threads virtuels, qui ne les épingle pas à leur porteur", correct: false}
    answer: Un verrou avec un mode de lecture optimiste sans blocage, validé a posteriori ; non réentrant.
  - key: finally
    format: course
    question: Pourquoi `unlock()` doit-il être dans un `finally` ?
    choices:
      - {text: "Parce qu'un `unlock()` hors d'un `finally` lève une `IllegalMonitorStateException`", correct: false}
      - {text: "Parce que le compilateur refuse un `lock()` sans `unlock()` dans un `finally`", correct: false}
      - {text: "Sinon une exception avant `unlock()` laisse le verrou pris, et les autres threads se bloquent", correct: true}
      - {text: "Pour que le verrou soit rendu avant que le ramasse-miettes ne collecte l'objet", correct: false}
    answer: Sinon une exception entre `lock()` et `unlock()` laisse le verrou pris pour toujours, et tous les autres threads se bloquent.
  - key: read-write
    format: course
    question: Quand utiliser un `ReentrantReadWriteLock` ?
    choices:
      - {text: "Quand les écritures dominent : plusieurs écrivains en même temps, un lecteur seul", correct: false}
      - {text: "Quand un thread doit reprendre plusieurs fois de suite le même verrou", correct: false}
      - {text: "Quand on veut lire sans aucun verrou et valider la lecture après coup", correct: false}
      - {text: "Quand les lectures dominent : plusieurs lecteurs en même temps, un écrivain seul", correct: true}
    answer: "Quand les lectures dominent largement les écritures : plusieurs lecteurs peuvent lire en même temps, un écrivain a l'exclusivité."
  - key: vf-defaut
    format: true-false
    question: "`ReentrantLock` est toujours préférable à `synchronized`."
    truth: false
    answer: '`synchronized` reste le choix par défaut ; `ReentrantLock` sert quand on a besoin de ses fonctions.'
  - key: vf-stamped-reentrant
    format: true-false
    question: "`StampedLock` est réentrant."
    truth: false
    answer: Reprendre un verrou qu'on détient bloque le thread.
  - key: vf-equitable
    format: true-false
    question: Un `ReentrantLock` équitable sert les threads dans l'ordre d'arrivée, au prix du débit.
    truth: true
    answer: Il évite la famine.
  - key: vf-condition
    format: true-false
    question: Un `ReentrantLock` peut avoir plusieurs `Condition`.
    truth: true
    answer: Par exemple « non plein » et « non vide », contrairement au moniteur unique de `wait`/`notify`.
  - key: qcm-fonctions
    format: multiple-choice
    question: Qu'offre `ReentrantLock` que `synchronized` n'offre pas ?
    choices:
      - {text: "L'exclusion mutuelle", correct: false}
      - {text: "`tryLock`, avec ou sans délai", correct: true}
      - {text: "La garantie de visibilité", correct: false}
      - {text: "La réentrance", correct: false}
    answer: "`tryLock` (comme plusieurs `Condition` par verrou) n'existe qu'avec `ReentrantLock`. Exclusion, visibilité et réentrance sont communes aux deux."
  - key: qcm-usage-forme
    format: multiple-choice
    question: Quelle utilisation est correcte ?
    choices:
      - text: "`verrou.lock(); try { traiter(); } finally { verrou.unlock(); }`"
        correct: true
      - text: "`verrou.lock(); traiter(); verrou.unlock();`"
        correct: false
      - text: "`try { verrou.lock(); traiter(); } finally { }`"
        correct: false
      - text: "`synchronized (verrou) { traiter(); }`, équivalent"
        correct: false
    answer: Le dernier utilise le moniteur de l'objet, pas le `ReentrantLock`.
  - key: qcm-cache
    format: multiple-choice
    question: Un cache est lu des milliers de fois par seconde et rechargé une fois par heure. Quel verrou ?
    choices:
      - {text: "`synchronized` sur toutes les lectures et sur le rechargement de la map", correct: false}
      - {text: "Un `ReentrantLock` équitable, pour que chaque lecteur passe à son tour", correct: false}
      - {text: "Aucun verrou, sur une `HashMap` modifiée en place lors du rechargement", correct: false}
      - {text: "Un `ReentrantReadWriteLock`, ou une référence `volatile` vers une map immuable", correct: true}
    answer: Les lectures ne doivent pas s'exclure entre elles.
  - key: qcm-stamped
    format: multiple-choice
    question: "Comment s'utilise la lecture optimiste d'un `StampedLock` ?"
    choices:
      - {text: "`lock()` puis `unlock()` dans un `finally`, exactement comme un `ReentrantLock`", correct: false}
      - {text: "`tryOptimisticRead()`, puis lire sans rien vérifier : la lecture est déjà protégée", correct: false}
      - {text: "`long s = tryOptimisticRead();` lire, puis `validate(s)` ; si invalide, relire sous verrou de lecture", correct: true}
      - {text: "`readLock()` pour lire, puis `validate(s)` pour rendre le verrou après la lecture", correct: false}
    answer: La lecture optimiste ne bloque pas, mais doit être validée.
  - key: code-trylock
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.util.concurrent.locks.*;
      ReentrantLock verrou = new ReentrantLock();
      verrou.lock();
      Thread t = Thread.ofPlatform().start(() -> System.out.println("autre : " + verrou.tryLock()));
      t.join();
      System.out.println("moi : " + verrou.tryLock() + " " + verrou.getHoldCount());
      ```
    choices:
      - text: |-
          ```
          autre : false
          moi : true 1
          ```
        correct: false
      - text: |-
          ```
          autre : true
          moi : true 2
          ```
        correct: false
      - text: |-
          ```
          autre : false
          moi : false 1
          ```
        correct: false
      - text: |-
          ```
          autre : false
          moi : true 2
          ```
        correct: true
    answer: '`autre : false`, puis `moi : true 2` : le verrou est réentrant pour son détenteur.'
    check:
      output: "autre : false\nmoi : true 2"
  - key: code-read-write
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.util.concurrent.locks.*;
      ReentrantReadWriteLock rw = new ReentrantReadWriteLock();
      rw.readLock().lock();
      Thread t = Thread.ofPlatform().start(() ->
              System.out.println(rw.readLock().tryLock() + " " + rw.writeLock().tryLock()));
      t.join();
      ```
    choices:
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
      - {text: "`true false`", correct: true}
    answer: '`true false` : plusieurs lecteurs, mais pas d''écrivain pendant une lecture.'
    check:
      output: "true false"
  - key: code-unlock-sans-lock
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.util.concurrent.locks.*;
      new ReentrantLock().unlock();
      ```
    choices:
      - {text: "Rien", correct: false}
      - {text: "Une `IllegalStateException`", correct: false}
      - {text: "Une `IllegalMonitorStateException`", correct: true}
      - {text: "Ça ne compile pas", correct: false}
    answer: "Une `IllegalMonitorStateException` : on ne peut rendre qu'un verrou qu'on détient."
    check:
      throws: IllegalMonitorStateException
  - key: code-finally
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.util.concurrent.locks.*;
      ReentrantLock verrou = new ReentrantLock();
      try {
          verrou.lock();
          try {
              throw new IllegalStateException();
          } finally {
              verrou.unlock();
          }
      } catch (IllegalStateException e) {
          System.out.println(verrou.isLocked());
      }
      ```
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Une `IllegalStateException`", correct: false}
    answer: '`false` : le `finally` a rendu le verrou malgré l''exception.'
    check:
      output: "false"
  - key: bug-sans-finally
    format: bug-fix
    question: |-
      Après une erreur de validation, toutes les commandes suivantes restent bloquées. Quelle correction est la bonne ?
      ```java
      verrou.lock();
      valider(commande);       // peut lever une exception
      enregistrer(commande);
      verrou.unlock();
      ```
    choices:
      - {text: "Faire le travail dans un `try` ouvert juste après `lock()`, et `unlock()` dans le `finally`", correct: true}
      - {text: "Appeler `unlock()` dans un `catch` qui intercepte l'exception de validation", correct: false}
      - {text: "Remplacer `lock()` par `tryLock()`, qui rend seul le verrou en cas d'exception", correct: false}
      - {text: "Rendre le verrou réentrant, pour que le thread suivant puisse le reprendre", correct: false}
    answer: |-
      ```java
      verrou.lock();
      try {
          valider(commande);
          enregistrer(commande);
      } finally {
          verrou.unlock();
      }
      ```
      L'exception sautait `unlock()` : le verrou restait pris. Le `finally` le rend dans tous les cas.
  - key: bug-lock-dans-try
    format: bug-fix
    question: |-
      Ce code lève parfois `IllegalMonitorStateException` au lieu de l'erreur d'origine. Pourquoi ?
      ```java
      try {
          verrou.lockInterruptibly();
          traiter();
      } finally {
          verrou.unlock();
      }
      ```
    choices:
      - {text: "`ReentrantLock` refuse qu'on appelle `unlock()` depuis un bloc `finally`", correct: false}
      - {text: "Si `lockInterruptibly()` est interrompu, le `finally` rend un verrou jamais pris", correct: true}
      - {text: "`lockInterruptibly()` ne peut pas s'appeler à l'intérieur d'un bloc `try`", correct: false}
      - {text: "`unlock()` doit être appelé par un autre thread que celui qui a pris le verrou", correct: false}
    answer: |-
      ```java
      verrou.lockInterruptibly();
      try {
          traiter();
      } finally {
          verrou.unlock();
      }
      ```
      Si `lockInterruptibly()` est interrompu, le verrou n'est pas pris, mais le `finally` tente de le rendre. On prend le
      verrou avant le `try`.
  - key: bug-synchronized-lectures
    format: bug-fix
    question: |-
      Ce registre, presque toujours lu, est un goulot d'étranglement. Quelle correction est la bonne ?
      ```java
      synchronized Tarif tarif(String code) { return tarifs.get(code); }
      synchronized void recharger(Map<String, Tarif> nouveaux) { tarifs = new HashMap<>(nouveaux); }
      ```
    choices:
      - {text: "Remplacer `synchronized` par un `ReentrantLock` équitable sur les deux méthodes", correct: false}
      - {text: "Publier une map immuable par une référence `volatile`, lue sans verrou", correct: true}
      - {text: "Retirer `synchronized` des deux méthodes et garder la `HashMap` telle quelle", correct: false}
      - {text: "Envelopper la map dans `Collections.synchronizedMap`, sans autre changement", correct: false}
    answer: |-
      ```java
      private volatile Map<String, Tarif> tarifs = Map.of();
      Tarif tarif(String code) { return tarifs.get(code); }
      void recharger(Map<String, Tarif> nouveaux) { tarifs = Map.copyOf(nouveaux); }
      ```
      Les lectures s'excluaient entre elles. Une map immuable publiée par une référence `volatile` se lit sans verrou ;
      un `ReentrantReadWriteLock` serait l'autre option si la map devait être modifiée en place.
  - key: bug-condition-unique
    format: bug-fix
    question: |-
      Producteurs et consommateurs se réveillent inutilement en permanence. Quelle correction est la bonne ?
      ```java
      synchronized void deposer(T x) throws InterruptedException {
          while (plein()) wait();
          ajouter(x);
          notifyAll();
      }
      ```
    choices:
      - {text: "Remplacer `notifyAll()` par `notify()`, sans rien changer d'autre", correct: false}
      - {text: "Remplacer la boucle `while (plein())` par un simple `if (plein())`", correct: false}
      - {text: "Ajouter un `Thread.sleep` avant `wait()` pour espacer les réveils", correct: false}
      - {text: "Un `ReentrantLock` avec deux `Condition`, `nonPlein` et `nonVide`, et `signal()`", correct: true}
    answer: |-
      ```java
      private final ReentrantLock verrou = new ReentrantLock();
      private final Condition nonPlein = verrou.newCondition();
      private final Condition nonVide = verrou.newCondition();

      void deposer(T x) throws InterruptedException {
          verrou.lock();
          try {
              while (plein()) nonPlein.await();
              ajouter(x);
              nonVide.signal();          // ne réveille qu'un consommateur
          } finally {
              verrou.unlock();
          }
      }
      ```
      Avec deux `Condition`, on réveille seulement ceux qui attendent la bonne condition. (Une `ArrayBlockingQueue` fait
      exactement cela.)
