notion: reactor-bases
lesson: |-
  **Project Reactor** (utilisé par Spring WebFlux) a deux types de base :
  - **`Mono<T>`** : **0 ou 1** élément (une réponse HTTP, une ligne en base) ;
  - **`Flux<T>`** : **0 à N** éléments, éventuellement infinis (un flux d'événements, des lignes).

  ```java
  Mono<Client> client = clientRepository.findById(id);              // rien n'est exécuté ici

  Flux<String> villes = client
          .flatMapMany(c -> commandeRepository.findByClient(c.id()))   // Mono → Flux
          .filter(Commande::livree)
          .map(Commande::ville)
          .distinct()
          .timeout(Duration.ofSeconds(2))
          .onErrorResume(e -> Flux.empty());

  Mono<Tableau> tableau = Mono.zip(prix(ref), stock(ref), avis(ref))     // trois appels en parallèle
          .map(t -> new Tableau(t.getT1(), t.getT2(), t.getT3()));
  ```

  Les opérateurs essentiels :
  - **`map`** (transformation synchrone), **`flatMap`** (étape asynchrone, concurrente, **sans ordre garanti**),
    **`concatMap`** (asynchrone, **séquentielle**, garde l'ordre), **`switchMap`** (annule l'étape en cours à chaque
    nouvel élément) ;
  - `zip`, `merge`, `concat` pour combiner ; `timeout`, `retryWhen`, `onErrorResume`, `onErrorReturn` pour la résilience ;
  - **`subscribeOn`** choisit le thread où démarre la source, **`publishOn`** celui des opérateurs suivants ;
    `Schedulers.boundedElastic()` pour isoler un appel bloquant inévitable.

  Règles :
  - **rien ne se passe sans abonnement** (`subscribe`, ou le framework qui s'abonne à ce que renvoie le contrôleur) ;
  - **jamais `block()`** dans du code réactif (seulement en test, ou à la frontière d'un code bloquant) ;
  - un flux **froid** (*cold*) rejoue sa source pour chaque abonné (deux abonnements = deux requêtes en base) ; un flux
    **chaud** (*hot*) émet indépendamment des abonnés ;
  - le contexte (MDC, sécurité) passe par le **`Context`** de Reactor, pas par `ThreadLocal` ;
  - tester avec **`StepVerifier`** ; déboguer avec `checkpoint()`, `log()` et le ReactorDebugAgent.

  **Piège classique** : construire un `Mono` sans que personne ne s'y abonne (`repository.save(x);` sans retour ni
  `subscribe`). La sauvegarde n'a jamais lieu, sans aucune erreur.

  **En entretien** : « `Mono` pour 0 ou 1, `Flux` pour 0 à N ; `map`, `flatMap`, `concatMap`, `zip` ; rien sans abonnement,
  jamais de `block`, et `boundedElastic` pour isoler le bloquant. »
cards:
  - key: mono-vs-flux
    format: course
    question: "Quelle différence entre `Mono` et `Flux` ?"
    choices:
      - {text: "`Mono` est synchrone, `Flux` est asynchrone", correct: false}
      - {text: "`Mono` émet de 0 à N éléments, `Flux` 0 ou 1 élément", correct: false}
      - {text: "`Mono` émet 0 ou 1 élément, `Flux` de 0 à N éléments", correct: true}
      - {text: "`Mono` est toujours froid, `Flux` toujours chaud", correct: false}
    answer: 0..1 élément vs 0..N éléments.
  - key: passe-si-abonne
    format: course
    question: "Que se passe-t-il si personne ne s'abonne à un pipeline Reactor ?"
    choices:
      - {text: "Il s'exécute une fois, et son résultat est perdu", correct: false}
      - {text: "Rien : le pipeline n'est qu'une description, jamais exécutée", correct: true}
      - {text: "Il s'exécute dès le premier appel de `map` ou `filter`", correct: false}
      - {text: "Il lève une exception à la fin de la requête", correct: false}
    answer: "Rien : le pipeline n'est qu'une description, qui ne s'exécute qu'à l'abonnement. Une sauvegarde à laquelle personne ne s'abonne n'a donc jamais lieu, sans erreur."
  - key: cold-vs-hot-publisher
    format: course
    question: "Quelle différence entre un publisher froid (cold) et un publisher chaud (hot) ?"
    choices:
      - {text: "Le froid rejoue la source pour chaque abonné ; le chaud émet indépendamment des abonnés", correct: true}
      - {text: "Le froid émet indépendamment des abonnés ; le chaud rejoue la source pour chacun", correct: false}
      - {text: "Le froid est synchrone, le chaud s'exécute toujours sur un autre thread", correct: false}
      - {text: "Le froid garde en cache tous ses éléments, le chaud n'en garde aucun", correct: false}
    answer: Cold rejoue la source pour chaque abonné ; hot émet indépendamment des abonnés.
  - key: map-vs-flatmap-vs-concatmap
    format: course
    question: "Quelle différence entre `map`, `flatMap` et `concatMap` ?"
    choices:
      - {text: "Synchrone ; asynchrone séquentiel qui garde l'ordre ; asynchrone concurrent sans ordre", correct: false}
      - {text: "Asynchrone ; synchrone qui aplatit les listes ; synchrone qui concatène les chaînes", correct: false}
      - {text: "Les trois sont asynchrones ; seul `concatMap` accepte un `Mono` en retour", correct: false}
      - {text: "Synchrone ; asynchrone concurrent sans ordre garanti ; asynchrone séquentiel qui garde l'ordre", correct: true}
    answer: Transformation synchrone ; asynchrone concurrente sans ordre garanti ; asynchrone séquentielle qui préserve l'ordre.
  - key: sert-switchmap
    format: course
    question: "À quoi sert `switchMap` ?"
    choices:
      - {text: "Traiter les éléments un par un, dans leur ordre d'arrivée, sans en annuler aucun", correct: false}
      - {text: "Annuler le traitement en cours quand un nouvel élément arrive (recherche à la frappe)", correct: true}
      - {text: "Faire passer les opérateurs suivants sur un autre ordonnanceur (`Scheduler`)", correct: false}
      - {text: "Remplacer le flux par un flux de repli quand une erreur survient", correct: false}
    answer: Annuler le traitement en cours quand un nouvel élément arrive (recherche à la frappe).
  - key: subscribeon-vs-publishon
    format: course
    question: "Quelle différence entre `subscribeOn` et `publishOn` ?"
    choices:
      - {text: "`publishOn` choisit le thread de la source ; `subscribeOn` change celui des opérateurs suivants", correct: false}
      - {text: "`subscribeOn` démarre l'abonnement, `publishOn` publie le résultat au client", correct: false}
      - {text: "`subscribeOn` choisit le thread de la source ; `publishOn` change celui des opérateurs suivants", correct: true}
      - {text: "Aucune : ce sont deux noms du même opérateur, gardés pour la compatibilité", correct: false}
    answer: subscribeOn choisit le thread d'exécution de la source ; publishOn change le thread des opérateurs suivants.
  - key: appel-bloquant-inevitable-flux-reactif
    format: course
    question: Que faire d'un appel bloquant inévitable dans un flux réactif ?
    choices:
      - {text: "L'exécuter sur `Schedulers.parallel()`, le pool de calcul du pipeline", correct: false}
      - {text: "L'appeler dans un `map`, puisqu'il ne bloque qu'un seul élément", correct: false}
      - {text: "L'isoler sur `Schedulers.boundedElastic()`, un pool prévu pour le bloquant", correct: true}
      - {text: "Appeler `block()` sur le flux, puis faire l'appel hors du pipeline", correct: false}
    answer: L'isoler sur Schedulers.boundedElastic().
  - key: jamais-appeler-block-controleur-webflux
    format: course
    question: "Pourquoi ne jamais appeler `block()` dans un contrôleur WebFlux ?"
    choices:
      - {text: "Il immobilise un thread de la boucle d'événements et effondre le débit", correct: true}
      - {text: "Il annule l'abonnement et renvoie toujours une réponse vide au client", correct: false}
      - {text: "Il désactive la contre-pression pour toutes les requêtes suivantes", correct: false}
      - {text: "Il crée un nouveau thread de plateforme pour chaque requête reçue", correct: false}
    answer: "Il bloquerait un thread de la boucle d'événements, qui sert à lui seul de nombreuses requêtes : le débit s'effondre. Sur ces threads, Reactor refuse d'ailleurs `block()` par une `IllegalStateException`."
  - key: propager-contexte-mdc-trace-reactif
    format: course
    question: Comment propager le contexte (MDC, trace) en réactif ?
    choices:
      - {text: "Par le `Context` de Reactor et la bibliothèque context-propagation, pas par `ThreadLocal`", correct: true}
      - {text: "Par un `ThreadLocal`, que Reactor recopie seul d'un opérateur à l'autre", correct: false}
      - {text: "Par une variable `static` partagée, mise à jour au début de chaque requête", correct: false}
      - {text: "Par un `InheritableThreadLocal`, hérité par les threads de l'ordonnanceur", correct: false}
    answer: Via le Context de Reactor et la bibliothèque context-propagation, pas via ThreadLocal.
  - key: uni-vs-multi
    format: course
    question: "Que sont `Uni` et `Multi` ?"
    choices:
      - {text: "Les équivalents Mutiny de `Mono` et `Flux`", correct: true}
      - {text: "Les équivalents Mutiny de `Flux` et `Mono`", correct: false}
      - {text: "Deux ordonnanceurs de Reactor, monothread et multithread", correct: false}
      - {text: "Les résultats de `CompletableFuture`, pour un ou plusieurs éléments", correct: false}
    answer: "Les équivalents Mutiny (Quarkus) de `Mono` et `Flux` : `Uni` émet au plus un élément, `Multi` plusieurs."
  - key: deboguer-flux-reactor
    format: course
    question: Comment déboguer un flux Reactor ?
    choices:
      - {text: "Un point d'arrêt dans chaque lambda : la pile montre tout le pipeline", correct: false}
      - {text: "`checkpoint()`, `log()`, `Hooks.onOperatorDebug()` en dev, ou ReactorDebugAgent", correct: true}
      - {text: "Un `block()` après chaque opérateur, pour voir les valeurs intermédiaires", correct: false}
      - {text: "`Thread.dumpStack()` dans `subscribe`, qui montre l'opérateur fautif", correct: false}
    answer: checkpoint(), log(), Hooks.onOperatorDebug() en dev, ReactorDebugAgent.
  - key: vf-flatmap-ordre
    format: true-false
    question: "`flatMap` sur un `Flux` garantit que les résultats sortent dans l'ordre des éléments d'entrée."
    truth: false
    answer: Les étapes s'exécutent en concurrence ; `concatMap` (ou `flatMapSequential`) garde l'ordre.
  - key: vf-zip
    format: true-false
    question: "`Mono.zip(a, b, c)` s'abonne aux trois sources en parallèle."
    truth: true
    answer: Il attend les trois résultats et les combine.
  - key: vf-block-test
    format: true-false
    question: "`block()` est acceptable dans un test unitaire."
    truth: true
    answer: Même si `StepVerifier` est préférable pour vérifier les signaux.
  - key: vf-cold-double
    format: true-false
    question: S'abonner deux fois à un `Mono` froid issu d'une requête en base exécute la requête deux fois.
    truth: true
    answer: Chaque abonnement rejoue la source ; `cache()` partage le résultat.
  - key: qcm-type
    format: multiple-choice
    question: Quel type pour une méthode qui cherche un client par identifiant ?
    choices:
      - text: "`Mono<Client>`"
        correct: true
      - text: "`Flux<Client>`"
        correct: false
      - text: "`Mono<List<Client>>`"
        correct: false
      - text: "`Client`, en bloquant"
        correct: false
    answer: 0 ou 1 résultat.
  - key: qcm-operateur
    format: multiple-choice
    question: "Pour chaque identifiant, on appelle un service asynchrone, un appel à la fois, et l'ordre des résultats doit suivre celui des identifiants. Quel opérateur ?"
    choices:
      - {text: "`flatMap`", correct: false}
      - {text: "`concatMap`", correct: true}
      - {text: "`map`", correct: false}
      - {text: "`switchMap`", correct: false}
    answer: "`concatMap` attend chaque appel avant le suivant et garde l'ordre (`flatMapSequential` le garde aussi, en parallèle). `flatMap` mélange l'ordre, `switchMap` annule les appels en cours, `map` ne gère pas l'asynchrone."
  - key: qcm-erreurs
    format: multiple-choice
    question: "Lesquelles de ces écritures fournissent une valeur de repli quand un appel échoue ?"
    choices:
      - text: "`onErrorResume(e -> Mono.just(defaut))`"
        correct: true
      - text: "`onErrorReturn(defaut)`"
        correct: true
      - text: "Un `try/catch` autour de la construction du `Mono`"
        correct: false
      - text: "`block()` puis un `catch`"
        correct: false
    answer: L'erreur arrive de façon asynchrone, sous forme de signal.
  - key: qcm-tester
    format: multiple-choice
    question: Comment tester un `Flux` ?
    choices:
      - {text: "Avec `Thread.sleep(1000)` puis une vérification de la liste", correct: false}
      - {text: "Avec `assertEquals(List.of(...), flux)` directement", correct: false}
      - {text: "Avec `StepVerifier.create(flux).expectNext(...).verifyComplete()`", correct: true}
      - {text: "Avec `flux.subscribe()` puis un `assertTrue` juste après", correct: false}
    answer: '`StepVerifier` vérifie chaque signal, y compris les erreurs et la fin.'
  - key: endpoint-doit-agreger-trois-appels-services
    format: scenario
    question: "Un endpoint doit agréger trois appels de services en parallèle, avec un timeout global. Comment l'écris-tu en Reactor ?"
    choices:
      - {text: "Trois `block()` successifs, puis un `Mono.just` qui assemble les trois résultats", correct: false}
      - {text: "`appelA().concatWith(appelB()).concatWith(appelC())`, avec un `timeout` à la fin", correct: false}
      - {text: "`Mono.zip(appelA(), appelB(), appelC())`, un `timeout` par appel et un `timeout` global", correct: true}
      - {text: "`Flux.merge(appelA(), appelB(), appelC())`, puis un `Thread.sleep` du délai global", correct: false}
    answer: |-
      En Reactor, `Mono.zip(appelA(), appelB(), appelC())` lance les trois en parallèle et attend les trois résultats. J'ajouterais un `timeout` sur chaque appel (pour qu'un service lent n'empoisonne pas les autres) et un `timeout` global, plus un `onErrorResume` par appel si une réponse partielle est acceptable fonctionnellement.
      En impératif avec des virtual threads, l'équivalent est trois `CompletableFuture` sur un executor de virtual threads, puis `allOf(...).orTimeout(...)` ; ou la `StructuredTaskScope` si on accepte une API en preview, qui annule automatiquement les autres appels si l'un échoue.
  - key: service-webflux-devient-tres-lent-50
    format: scenario
    question: "Un service WebFlux devient très lent dès 50 requêtes simultanées, alors que le CPU est bas. Que soupçonnes-tu ?"
    choices:
      - {text: "Un pool de threads trop petit : il faut passer Netty à 500 threads", correct: false}
      - {text: "Une fuite mémoire, à confirmer par un heap dump", correct: false}
      - {text: "Un appel bloquant sur la boucle d'événements, à confirmer par un thread dump", correct: true}
      - {text: "Un manque de cœurs : il faut ajouter des processeurs à la machine", correct: false}
    answer: |-
      CPU bas et débit effondré sur WebFlux, c'est le symptôme typique d'un **appel bloquant sur l'event loop** : quelques threads seulement, et chacun reste coincé à attendre.
      Je prendrais un thread dump pour voir ce que font les threads `reactor-http-nio` : s'ils sont dans un appel JDBC, un `block()`, un client HTTP synchrone ou un `Thread.sleep`, le coupable est trouvé. BlockHound en test permet de le détecter systématiquement.
      La correction est de rendre l'appel non bloquant, ou à défaut de l'isoler sur `boundedElastic`.
  - key: scenario-sauvegarde-perdue
    format: scenario
    question: Une sauvegarde en base dans un service WebFlux n'a jamais lieu, sans aucune erreur. Pourquoi ?
    choices:
      - {text: "La transaction n'est pas validée : il faut ajouter `@Transactional` sur la méthode", correct: false}
      - {text: "L'appel a lieu sur un autre thread, dont l'erreur s'écrit dans un autre log", correct: false}
      - {text: "Personne ne s'abonne au `Mono` de `save` : il faut le chaîner dans le pipeline renvoyé", correct: true}
      - {text: "Il manque un `subscribe()` isolé juste après `save`, qui suffirait à corriger", correct: false}
    answer: |-
      Le `Mono` de la sauvegarde a été créé mais personne ne s'y est abonné : `repository.save(entite);` sans utiliser le
      résultat. En réactif, rien ne s'exécute sans abonnement. La correction : chaîner la sauvegarde dans le pipeline
      renvoyé au framework (`return valider(x).flatMap(repository::save).map(Reponse::de);`), qui s'y abonne. Je ne
      mets pas de `subscribe()` isolé, qui détacherait l'opération du cycle de la requête (erreurs perdues, pas de
      contre-pression).
  - key: scenario-double-requete
    format: scenario
    question: Les logs montrent que la même requête SQL part deux fois pour une seule requête HTTP. Comment est-ce possible en Reactor ?
    choices:
      - {text: "Le pilote R2DBC rejoue toute requête qui dépasse son délai, sans le signaler", correct: false}
      - {text: "Le `Mono` est froid : chaque abonnement rejoue la requête ; s'y abonner une fois, ou `cache()`", correct: true}
      - {text: "`zip` exécute toujours chaque source deux fois, pour vérifier le résultat", correct: false}
      - {text: "Le `Mono` est chaud : il émet à chaque requête HTTP reçue par le serveur", correct: false}
    answer: |-
      Le `Mono` (ou `Flux`) issu de la requête est froid : chaque abonnement rejoue la source. S'il est utilisé deux fois
      dans le pipeline (par exemple dans deux branches d'un `zip`, ou lu à deux endroits), la requête part deux fois.
      Je restructure pour ne s'y abonner qu'une fois (un `flatMap` qui passe le résultat aux deux usages), ou j'utilise
      `cache()` pour partager le résultat entre les abonnés de cette requête HTTP.
