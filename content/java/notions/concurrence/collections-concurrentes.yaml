notion: collections-concurrentes
cards:
  - key: concurrenthashmap-utilise-encore-segments
    format: course
    question: ConcurrentHashMap utilise-t-elle encore des segments ?
    answer: 'Non depuis Java 8 : CAS sur bucket vide, synchronized sur le premier nœud sinon, lectures sans verrou.'
  - key: concurrenthashmap-refuse-null
    format: course
    question: Pourquoi ConcurrentHashMap refuse null ?
    answer: Pour qu'un get qui renvoie null signifie sans ambiguïté "absent", sans verrou supplémentaire.
  - key: computeifabsent-concurrenthashmap-atomique
    format: course
    question: computeIfAbsent sur ConcurrentHashMap est-il atomique ?
    answer: Oui pour la clé concernée ; la fonction doit rester courte et ne pas modifier la map.
  - key: synchronizedmap-vs-concurrenthashmap
    format: course
    question: synchronizedMap vs ConcurrentHashMap ?
    answer: Un verrou global sur chaque méthode vs verrouillage fin et lectures sans verrou.
  - key: liste-partagee-lue-permanence-dizaines-threads
    format: scenario
    question: Une liste partagée est lue en permanence par des dizaines de threads et modifiée une fois par heure.
    answer: |-
      C'est le cas d'école de `CopyOnWriteArrayList` : les lectures sont sans verrou et ne voient jamais d'état intermédiaire, et le coût de la copie à chaque écriture est négligeable vu la fréquence.
      Une alternative tout aussi bonne : une référence `volatile` (ou `AtomicReference`) vers une **liste immuable**, remplacée en bloc à chaque mise à jour. Les lecteurs lisent toujours une version cohérente. À l'inverse, avec des écritures fréquentes, CopyOnWrite deviendrait catastrophique.
  - key: if-map-containskey-k-map-put
    format: course
    question: Pourquoi `if (!map.containsKey(k)) map.put(k, v)` est faux même avec une ConcurrentHashMap ?
    answer: C'est un check-then-act non atomique ; utiliser putIfAbsent ou computeIfAbsent.
  - key: arrayblockingqueue-vs-linkedblockingqueue
    format: course
    question: ArrayBlockingQueue vs LinkedBlockingQueue ?
    answer: Bornée sur tableau vs chaînée, illimitée par défaut (risque de saturation mémoire).
  - key: synchronousqueue
    format: course
    question: C'est quoi une SynchronousQueue ?
    answer: 'Une file de capacité zéro : chaque put attend un take.'
  - key: implemente-producteur-consommateur
    format: scenario
    question: Implémente un producteur-consommateur.
    answer: |-
      Avec une `BlockingQueue` **bornée**, qui gère toute la synchronisation :
      ```java
      BlockingQueue<Tache> file = new ArrayBlockingQueue<>(1000);
      // producteur
      file.put(tache);              // bloque si la file est pleine : backpressure
      // consommateur
      while (!Thread.currentThread().isInterrupted()) {
          Tache t = file.take();    // bloque si la file est vide
          traiter(t);
      }
      ```
      La borne est essentielle : une file illimitée masque un consommateur trop lent jusqu'à l'OutOfMemory. Pour arrêter proprement, j'interromprais les consommateurs (take lève InterruptedException), ou j'enverrais une *poison pill*, un élément spécial qui signifie 'fin'. Pour plusieurs consommateurs, un ExecutorService qui lit la file convient très bien.
  - key: concois-cache-calculs-couteux-accede-nombreux
    format: scenario
    question: Comment tu conçois un cache de calculs coûteux accédé par de nombreux threads, sans calculer deux fois la même clé ?
    answer: |-
      `ConcurrentHashMap.computeIfAbsent(cle, this::calculer)` garantit qu'une seule exécution a lieu par clé, les autres threads attendant le résultat. Attention : pendant le calcul, d'autres opérations sur la même zone de la map peuvent être bloquées, donc la fonction doit rester raisonnablement rapide et ne jamais modifier la map.
      Pour un calcul long ou de l'I/O, je stockerais plutôt des `CompletableFuture` : `computeIfAbsent(cle, k -> CompletableFuture.supplyAsync(() -> calculer(k), executor))`. L'insertion est instantanée et tous les demandeurs partagent le même future.
      Et en pratique, si j'ai besoin d'expiration et de taille maximale, Caffeine fait exactement ça avec `AsyncLoadingCache`.
