notion: collections-concurrentes
lesson: |-
  `java.util.concurrent` fournit des collections conçues pour être partagées entre threads, bien plus efficaces que les
  enveloppes `Collections.synchronizedXxx` (un verrou global sur chaque méthode).

  | Collection | Pour | Particularités |
  |---|---|---|
  | **`ConcurrentHashMap`** | une map partagée | lectures sans verrou, écritures verrouillées par case ; opérations atomiques `putIfAbsent`, `computeIfAbsent`, `merge`, `compute` ; refuse `null` |
  | **`CopyOnWriteArrayList`** | beaucoup de lectures, très peu d'écritures | chaque écriture copie le tableau ; itération sur un instantané, jamais de `ConcurrentModificationException` |
  | **`BlockingQueue`** | producteur-consommateur | `put` attend s'il n'y a pas de place, `take` attend un élément |
  | `ConcurrentLinkedQueue`, `ConcurrentLinkedDeque` | files non bloquantes | algorithmes sans verrou |
  | `ConcurrentSkipListMap`, `ConcurrentSkipListSet` | une map ou un ensemble **trié** partagé | équivalents concurrents de `TreeMap` et `TreeSet` |

  Les `BlockingQueue` :
  - **`ArrayBlockingQueue`** : bornée, sur un tableau ;
  - **`LinkedBlockingQueue`** : chaînée, **illimitée par défaut** (lui donner une capacité) ;
  - `PriorityBlockingQueue`, `DelayQueue`, `SynchronousQueue` (capacité zéro : chaque `put` attend un `take`).

  ```java
  Map<String, LongAdder> compteurs = new ConcurrentHashMap<>();
  compteurs.computeIfAbsent(page, p -> new LongAdder()).increment();

  Set<String> vus = ConcurrentHashMap.newKeySet();      // un Set concurrent
  ```

  - Chaque opération est sûre, mais une **séquence** d'opérations ne l'est pas : `containsKey` puis `put` reste une
    condition de course ; on utilise les opérations atomiques.
  - `size()` et l'itération d'une `ConcurrentHashMap` sont **faiblement cohérentes** : elles reflètent un état à peu près
    actuel, sans exception.

  **Piège classique** : une `LinkedBlockingQueue` sans capacité entre un producteur rapide et un consommateur lent. La
  file grossit jusqu'à l'`OutOfMemoryError` au lieu de ralentir le producteur.

  **En entretien** : « `ConcurrentHashMap` et ses opérations atomiques, `CopyOnWriteArrayList` pour les lectures
  massives, une `BlockingQueue` **bornée** pour le producteur-consommateur ; et jamais de vérifier-puis-agir en deux
  appels. »
cards:
  - key: concurrenthashmap-utilise-encore-segments
    format: course
    question: "Depuis Java 8, comment `ConcurrentHashMap` se protège-t-elle des écritures concurrentes ?"
    choices:
      - {text: "Seize segments, chacun protégé par son propre `ReentrantLock`", correct: false}
      - {text: "Un seul verrou global, pris par chaque écriture comme par chaque lecture", correct: false}
      - {text: "Une copie complète de la table à chaque écriture, comme `CopyOnWriteArrayList`", correct: false}
      - {text: "Un CAS sur un bucket vide, sinon `synchronized` sur le premier nœud du bucket", correct: true}
    answer: "Plus de segments depuis Java 8 : un CAS pour remplir un bucket vide, sinon `synchronized` sur le premier nœud du bucket ; les lectures se font sans verrou. Les segments verrouillés, c'était Java 7."
  - key: concurrenthashmap-refuse-null
    format: course
    question: "Pourquoi `ConcurrentHashMap` refuse-t-elle les valeurs `null` ?"
    choices:
      - {text: "Pour qu'un `get` qui renvoie `null` veuille dire « absente », sans ambiguïté ni verrou", correct: true}
      - {text: "Parce que `null` n'a pas de `hashCode()`, nécessaire pour placer l'entrée dans un bucket", correct: false}
      - {text: "Parce qu'un `null` casserait le CAS, qui compare les valeurs avec `equals`", correct: false}
      - {text: "Pour économiser la mémoire des entrées vides dans les buckets de la table", correct: false}
    answer: "Dans une map partagée, un `get` qui renvoie `null` doit vouloir dire « absente » : sinon il faudrait un `containsKey` séparé, et un autre thread pourrait écrire entre les deux. `HashMap` accepte `null`, car elle n'est pas faite pour être partagée."
  - key: computeifabsent-concurrenthashmap-atomique
    format: course
    question: "`computeIfAbsent` est-il atomique sur une `ConcurrentHashMap` ?"
    choices:
      - {text: "Oui, pour la clé concernée ; la fonction doit rester courte et ne pas modifier la map", correct: true}
      - {text: "Non : deux threads peuvent calculer la même clé, et le dernier écrase le premier", correct: false}
      - {text: "Oui, et la fonction peut appeler d'autres opérations sur la même map sans risque", correct: false}
      - {text: "Seulement si la fonction passée est elle-même `synchronized`, sinon elle peut doubler", correct: false}
    answer: "Oui : la fonction est appelée au plus une fois par clé absente, et les autres threads attendent. Elle bloque une partie de la map pendant ce temps : elle doit rester courte et ne jamais modifier la map."
  - key: synchronizedmap-vs-concurrenthashmap
    format: course
    question: "Quelle différence entre `Collections.synchronizedMap` et `ConcurrentHashMap` ?"
    choices:
      - {text: "`ConcurrentHashMap` prend un verrou global par appel ; `synchronizedMap` verrouille finement et lit sans verrou", correct: false}
      - {text: "`synchronizedMap` rend atomiques les opérations composées (`get` puis `put`) ; `ConcurrentHashMap` non", correct: false}
      - {text: "`synchronizedMap` prend un verrou global par appel ; `ConcurrentHashMap` verrouille finement et lit sans verrou", correct: true}
      - {text: "Aucune, sinon que `synchronizedMap` accepte les `null` et garde l'ordre d'insertion des clés", correct: false}
    answer: "`synchronizedMap` enveloppe chaque méthode dans un verrou global, même pour lire ; `ConcurrentHashMap` lit sans verrou et verrouille finement les écritures. Aucune des deux ne rend atomique un `get` suivi d'un `put`."
  - key: if-map-containskey-k-map-put
    format: course
    question: "Pourquoi `if (!map.containsKey(k)) map.put(k, v)` est-il faux, même avec une `ConcurrentHashMap` ?"
    choices:
      - {text: "`containsKey` lit une copie ancienne de la map, qui n'est jamais à jour", correct: false}
      - {text: "Un autre thread peut écrire entre le test et le `put` : il faut `putIfAbsent`", correct: true}
      - {text: "`put` lève une exception quand la clé existe déjà dans la map", correct: false}
      - {text: "`containsKey` garde un verrou qui bloque le `put`, d'où un interblocage", correct: false}
    answer: "C'est un « vérifier puis agir » non atomique : chaque appel est sûr, pas leur enchaînement. `putIfAbsent` ou `computeIfAbsent` font le test et l'écriture d'un bloc."
  - key: arrayblockingqueue-vs-linkedblockingqueue
    format: course
    question: "Quelle différence entre `ArrayBlockingQueue` et `LinkedBlockingQueue` ?"
    choices:
      - {text: "`ArrayBlockingQueue` est bornée, sur un tableau ; `LinkedBlockingQueue` est chaînée, illimitée par défaut", correct: true}
      - {text: "`LinkedBlockingQueue` est bornée, sur un tableau ; `ArrayBlockingQueue` est chaînée, illimitée par défaut", correct: false}
      - {text: "`ArrayBlockingQueue` ne bloque jamais ; `LinkedBlockingQueue` bloque seulement quand elle est vide", correct: false}
      - {text: "`ArrayBlockingQueue` trie ses éléments ; `LinkedBlockingQueue` garde leur ordre d'arrivée", correct: false}
    answer: "`ArrayBlockingQueue` a une capacité fixe ; `LinkedBlockingQueue` est chaînée et, sans capacité donnée, accepte tout, jusqu'à saturer la mémoire si le consommateur ne suit pas."
  - key: synchronousqueue
    format: course
    question: "Qu'est-ce qu'une `SynchronousQueue` ?"
    choices:
      - {text: "Une file illimitée dont chaque méthode est `synchronized`, comme `Vector`", correct: false}
      - {text: "Une file qui range ses éléments par priorité, protégée par un verrou", correct: false}
      - {text: "Une file de capacité zéro : chaque `put` attend qu'un autre thread fasse `take`", correct: true}
      - {text: "Une file d'un seul élément, que `put` remplace s'il n'a pas été pris", correct: false}
    answer: "Une file de capacité zéro : chaque `put` attend un `take`, c'est une remise de main à main. `Executors.newCachedThreadPool` s'en sert pour passer chaque tâche directement à un thread."
  - key: vf-cow-iteration
    format: true-false
    question: Itérer une `CopyOnWriteArrayList` pendant qu'un autre thread la modifie lève une `ConcurrentModificationException`.
    truth: false
    answer: L'itérateur parcourt un instantané.
  - key: vf-cow-ecritures
    format: true-false
    question: "`CopyOnWriteArrayList` convient à une liste modifiée des milliers de fois par seconde."
    truth: false
    answer: Chaque écriture copie tout le tableau.
  - key: vf-take
    format: true-false
    question: "`take()` sur une `BlockingQueue` vide attend qu'un élément arrive."
    truth: true
    answer: '`poll()` renvoie `null` immédiatement (ou après un délai).'
  - key: vf-size
    format: true-false
    question: "`ConcurrentHashMap.size()` donne toujours la taille exacte au même instant pour tous les threads."
    truth: false
    answer: C'est une estimation faiblement cohérente pendant les mises à jour concurrentes.
  - key: qcm-choix
    format: multiple-choice
    question: "Quel couple besoin et collection est le bon ?"
    choices:
      - {text: "Une file de tâches entre threads : une `ArrayList` synchronisée", correct: false}
      - {text: "Un ensemble trié partagé entre threads : un `TreeSet`", correct: false}
      - {text: "Des écouteurs lus à chaque événement, rarement ajoutés : `CopyOnWriteArrayList`", correct: true}
      - {text: "Un compteur par clé, très sollicité : une `HashMap<K, Integer>`", correct: false}
    answer: "`CopyOnWriteArrayList` convient aux lectures fréquentes et aux écritures rares. Une file entre threads, c'est une `BlockingQueue` ; un ensemble trié partagé, une `ConcurrentSkipListSet` ; un compteur par clé, une `ConcurrentHashMap<K, LongAdder>`."
  - key: qcm-atomiques
    format: multiple-choice
    question: Lesquelles sont atomiques sur une `ConcurrentHashMap` ?
    choices:
      - text: "`merge(k, 1, Integer::sum)`"
        correct: true
      - text: "`computeIfAbsent(k, f)`"
        correct: true
      - text: "`put(k, get(k) + 1)`"
        correct: false
      - text: "`if (!containsKey(k)) put(k, v)`"
        correct: false
    answer: Les deux dernières combinent deux appels.
  - key: qcm-set
    format: multiple-choice
    question: "Quelle instruction donne un `Set` concurrent efficace, sans ordre ?"
    choices:
      - {text: "`new HashSet<>()`, partagé entre threads", correct: false}
      - {text: "`new ConcurrentHashSet<>()`", correct: false}
      - {text: "`new TreeSet<>()`, partagé entre threads", correct: false}
      - {text: "`ConcurrentHashMap.newKeySet()`", correct: true}
    answer: "`ConcurrentHashMap.newKeySet()` donne un ensemble adossé à une `ConcurrentHashMap` (`ConcurrentSkipListSet` s'il doit être trié). `ConcurrentHashSet` n'existe pas dans le JDK."
  - key: qcm-borne
    format: multiple-choice
    question: Pourquoi borner une `LinkedBlockingQueue` entre producteur et consommateur ?
    choices:
      - {text: "Pour que `take` ne bloque plus quand la file est vide", correct: false}
      - {text: "Pour que `put` fasse attendre le producteur quand le consommateur ne suit pas", correct: true}
      - {text: "Pour que les éléments soient rangés par ordre de priorité", correct: false}
      - {text: "Pour que plusieurs consommateurs lisent le même élément", correct: false}
    answer: "C'est la contre-pression : une file pleine fait attendre le producteur, au lieu d'accumuler les éléments jusqu'à l'`OutOfMemoryError`."
  - key: code-merge
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      ConcurrentHashMap<String, Integer> m = new ConcurrentHashMap<>();
      try (var pool = Executors.newFixedThreadPool(8)) {
          for (int i = 0; i < 1000; i++) {
              String cle = i % 2 == 0 ? "pair" : "impair";
              pool.submit(() -> m.merge(cle, 1, Integer::sum));
          }
      }
      System.out.println(m.get("pair") + " " + m.get("impair"));
      ```
    choices:
      - {text: "`500 500`", correct: true}
      - {text: "`1000 1000`", correct: false}
      - {text: "`null null`", correct: false}
      - {text: "Deux nombres sous `500`, variables d'une exécution à l'autre", correct: false}
    answer: "`500 500` : `merge` lit et écrit d'un bloc, atomiquement, et la fermeture du pool attend la fin des 1000 tâches."
    check:
      output: "500 500"
  - key: code-null
    format: code-output
    question: |-
      Que se passe-t-il à l'exécution de ce code ?
      ```java
      Map<String, String> m = new ConcurrentHashMap<>();
      m.put("a", null);
      ```
    choices:
      - {text: "Rien : `null` est enregistré sous la clé `a`", correct: false}
      - {text: "Une `NullPointerException`", correct: true}
      - {text: "Une `IllegalArgumentException`", correct: false}
      - {text: "Une `UnsupportedOperationException`", correct: false}
    answer: "Une `NullPointerException` : `ConcurrentHashMap` refuse les valeurs (et les clés) `null`."
    check:
      throws: NullPointerException
  - key: code-cow
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = new CopyOnWriteArrayList<>(List.of(1, 2, 3));
      for (Integer x : l) {
          if (x == 1) l.add(4);
      }
      System.out.println(l);
      ```
    choices:
      - {text: "`[1, 2, 3, 4]`", correct: true}
      - {text: "Une `ConcurrentModificationException`", correct: false}
      - {text: "`[1, 2, 3]`", correct: false}
      - {text: "`[1, 4, 2, 3]`", correct: false}
    answer: "`[1, 2, 3, 4]`, sans exception : l'itération parcourt l'instantané de départ, et l'ajout crée une nouvelle copie du tableau."
    check:
      output: "[1, 2, 3, 4]"
  - key: code-queue
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      BlockingQueue<String> file = new ArrayBlockingQueue<>(1);
      System.out.println(file.offer("a") + " " + file.offer("b") + " " + file.poll() + " " + file.poll());
      ```
    choices:
      - {text: "`true true a b`", correct: false}
      - {text: "`true false a null`", correct: true}
      - {text: "`true false a a`", correct: false}
      - {text: "`true true a null`", correct: false}
    answer: '`true false a null` : la file bornée refuse le second élément, `poll` renvoie `null` quand elle est vide.'
    check:
      output: "true false a null"
  - key: bug-synchronized-map
    format: bug-fix
    question: |-
      Ce cache partagé est un goulot d'étranglement sous charge. Quelle correction est la bonne ?
      ```java
      private final Map<String, Produit> cache = Collections.synchronizedMap(new HashMap<>());
      ```
    choices:
      - {text: "Une `Hashtable`, dont chaque méthode est déjà `synchronized`", correct: false}
      - {text: "Une `HashMap` simple, puisque les lectures sont sûres sans verrou", correct: false}
      - {text: "Un `ReentrantReadWriteLock` ajouté autour de la `synchronizedMap`", correct: false}
      - {text: "Une `ConcurrentHashMap`, qui lit sans verrou et verrouille finement les écritures", correct: true}
    answer: |-
      ```java
      private final Map<String, Produit> cache = new ConcurrentHashMap<>();
      ```
      `synchronizedMap` prend un verrou global à chaque appel, même pour lire. `ConcurrentHashMap` lit sans verrou et
      verrouille finement les écritures.
  - key: bug-file-illimitee
    format: bug-fix
    question: |-
      Lors des pics, le service d'ingestion finit en `OutOfMemoryError`. Quelle correction est la bonne ?
      ```java
      private final BlockingQueue<Evenement> file = new LinkedBlockingQueue<>();
      ```
    choices:
      - {text: "Une `ConcurrentLinkedQueue`, plus rapide car sans verrou", correct: false}
      - {text: "Plus de mémoire pour la JVM (`-Xmx`), pour absorber les pics", correct: false}
      - {text: "Une file bornée, comme `ArrayBlockingQueue(10_000)`, qui fait attendre le producteur", correct: true}
      - {text: "Une `PriorityBlockingQueue`, qui traite d'abord les événements urgents", correct: false}
    answer: |-
      ```java
      private final BlockingQueue<Evenement> file = new ArrayBlockingQueue<>(10_000);
      // le producteur fait put() (attend) ou offer(e, délai) (et rejette proprement)
      ```
      Une file illimitée absorbe tout en mémoire quand le consommateur ne suit pas. Une file bornée fait attendre le
      producteur (ou lui permet de rejeter), ce qui rend la saturation visible.
  - key: bug-iteration-arraylist
    format: bug-fix
    question: |-
      La diffusion d'événements lève parfois `ConcurrentModificationException` quand un écouteur s'inscrit au même moment. Quelle correction est la bonne ?
      ```java
      private final List<Ecouteur> ecouteurs = new ArrayList<>();
      void diffuser(Evenement e) { for (Ecouteur l : ecouteurs) l.recevoir(e); }
      void inscrire(Ecouteur l) { ecouteurs.add(l); }
      ```
    choices:
      - {text: "Un `Vector`, dont chaque méthode est déjà `synchronized`", correct: false}
      - {text: "Déclarer la liste `volatile`, pour que chaque ajout soit visible", correct: false}
      - {text: "Une `CopyOnWriteArrayList`, qui itère sur un instantané sans verrou", correct: true}
      - {text: "Une `LinkedList`, dont l'itérateur tolère les ajouts en cours", correct: false}
    answer: |-
      ```java
      private final List<Ecouteur> ecouteurs = new CopyOnWriteArrayList<>();
      ```
      Les inscriptions sont rares, les diffusions fréquentes : `CopyOnWriteArrayList` itère sur un instantané, sans verrou
      ni exception.
  - key: bug-get-put
    format: bug-fix
    question: |-
      Ce compteur par endpoint perd des appels, bien qu'il utilise une `ConcurrentHashMap`. Quelle correction est la bonne ?
      ```java
      Integer n = compteurs.get(endpoint);
      compteurs.put(endpoint, n == null ? 1 : n + 1);
      ```
    choices:
      - {text: "`compteurs.put(endpoint, compteurs.getOrDefault(endpoint, 0) + 1)`", correct: false}
      - {text: "`compteurs.merge(endpoint, 1, Integer::sum)`", correct: true}
      - {text: "`compteurs.putIfAbsent(endpoint, n == null ? 1 : n + 1)`", correct: false}
      - {text: "Déclarer le champ `compteurs` `volatile`", correct: false}
    answer: |-
      ```java
      compteurs.merge(endpoint, 1, Integer::sum);
      ```
      `get` puis `put` laissent un autre thread écrire entre les deux. `merge` fait la lecture et l'écriture d'un bloc,
      atomiquement.
  - key: liste-partagee-lue-permanence-dizaines-threads
    format: scenario
    question: "Une liste partagée est lue en permanence par des dizaines de threads et modifiée une fois par heure. Quelle structure choisis-tu ?"
    choices:
      - {text: "Une `Collections.synchronizedList`, dont chaque lecture prend le verrou de la liste", correct: false}
      - {text: "Une `ArrayList` simple : les écritures sont si rares qu'aucun conflit n'arrivera", correct: false}
      - {text: "Une `ConcurrentLinkedQueue`, parcourue en entier à chaque lecture des threads", correct: false}
      - {text: "Une `CopyOnWriteArrayList`, ou une liste immuable remplacée en bloc par une référence `volatile`", correct: true}
    answer: "C'est le cas d'école de `CopyOnWriteArrayList` : lectures sans verrou, jamais d'état intermédiaire, et une copie par écriture négligeable à ce rythme. Une liste immuable derrière une référence `volatile` (ou `AtomicReference`) marche aussi ; avec des écritures fréquentes, la copie deviendrait ruineuse."
  - key: implemente-producteur-consommateur
    format: scenario
    question: "Comment implémentes-tu un producteur-consommateur entre threads ?"
    choices:
      - {text: "Une `BlockingQueue` bornée : `put` attend si elle est pleine, `take` si elle est vide", correct: true}
      - {text: "Une `LinkedBlockingQueue` sans borne, pour que le producteur n'attende jamais", correct: false}
      - {text: "Une `ArrayList` partagée, que le consommateur interroge en boucle active", correct: false}
      - {text: "Une `ConcurrentLinkedQueue`, avec un `Thread.sleep` quand elle est vide", correct: false}
    answer: "Une `BlockingQueue` **bornée** gère toute la synchronisation : `put` bloque si elle est pleine (contre-pression), `take` si elle est vide. Une file illimitée masque un consommateur trop lent jusqu'à l'`OutOfMemoryError` ; pour arrêter, on interrompt les consommateurs ou on envoie une *poison pill*."
  - key: concois-cache-calculs-couteux-accede-nombreux
    format: scenario
    question: "Comment conçois-tu un cache de calculs coûteux, partagé par de nombreux threads, sans calculer deux fois la même clé ?"
    choices:
      - {text: "`get`, puis `put` si la valeur manque, sur une `ConcurrentHashMap` partagée par tous", correct: false}
      - {text: "Une `HashMap` dans un `ThreadLocal`, pour que chaque thread ait son propre cache", correct: false}
      - {text: "`ConcurrentHashMap.computeIfAbsent`, avec des `CompletableFuture` comme valeurs si le calcul est long", correct: true}
      - {text: "`putIfAbsent(cle, calculer(cle))`, atomique sur une `ConcurrentHashMap` partagée", correct: false}
    answer: "`computeIfAbsent(cle, this::calculer)` ne calcule qu'une fois par clé, les autres threads attendent ; la fonction doit rester rapide et ne jamais modifier la map. Pour un calcul long, on stocke des `CompletableFuture` (insertion instantanée, futur partagé) ; avec expiration et taille maximale, Caffeine le fait. `putIfAbsent(cle, calculer(cle))` calcule avant même de tester la clé."
  - key: scenario-dedoublonnage
    format: scenario
    question: Plusieurs consommateurs reçoivent des messages qui peuvent arriver en double ; chaque message ne doit être traité qu'une fois. Comment ?
    choices:
      - {text: "Un ensemble concurrent des identifiants vus : `vus.add(id)` ne renvoie `true` qu'une fois", correct: true}
      - {text: "Un `HashSet` des identifiants vus, testé avec `contains` avant chaque `add`", correct: false}
      - {text: "Un `contains`, puis un `add`, sur un ensemble `ConcurrentHashMap.newKeySet()`", correct: false}
      - {text: "Une `CopyOnWriteArrayList` des identifiants, parcourue avant chaque traitement", correct: false}
    answer: "Dans une instance, `if (vus.add(message.id())) traiter(message)` avec `vus = ConcurrentHashMap.newKeySet()` : `add` est atomique, et sa taille doit être bornée (expiration). Avec plusieurs instances, une contrainte d'unicité en base, insérée dans la transaction du traitement, rend l'opération idempotente."
