notion: masquage-champs-static
lesson: |-
  Seules les **méthodes d'instance** sont polymorphes. Les **champs** et les **méthodes `static`** de même nom dans une
  sous-classe ne redéfinissent rien : ils **masquent** (*hide*) ceux du parent, et l'accès est résolu à la compilation,
  selon le **type déclaré**.

  ```java
  class Parent {
      String nom = "parent";
      static String s() { return "Parent.s"; }
  }
  class Enfant extends Parent {
      String nom = "enfant";                 // un second champ, qui masque le premier
      static String s() { return "Enfant.s"; }
  }

  Parent p = new Enfant();
  p.nom;              // "parent" : type déclaré Parent
  ((Enfant) p).nom;   // "enfant"
  p.s();              // "Parent.s" : méthode static, type déclaré
  ```

  - Un objet `Enfant` contient **deux** champs `nom` ; les méthodes de `Parent` ne voient que le leur.
  - `@Override` sur une méthode `static` est une erreur de compilation.
  - Une méthode d'instance ne peut pas masquer une méthode `static` du parent, ni l'inverse : erreur de compilation.

  En pratique : on ne redéclare jamais un champ du parent, et on appelle une méthode `static` par le **nom de sa
  classe**. Le masquage devient alors invisible.

  **Piège classique** : attendre un comportement polymorphe d'une méthode `static` (une fabrique, une configuration
  « surchargée » dans une sous-classe de test). C'est toujours la version du type déclaré qui s'exécute.

  **En entretien** : « Les champs et les méthodes `static` ne sont pas polymorphes : ils sont masqués, et résolus sur
  le type déclaré. »
cards:
  - key: redefinir-methode-static
    format: course
    question: "Peut-on redéfinir une méthode `static` ?"
    choices:
      - {text: "Non, elle est masquée : l'appel suit le type déclaré", correct: true}
      - {text: "Oui, comme toute méthode, si la signature est identique", correct: false}
      - {text: "Oui, à condition d'annoter la version de l'enfant `@Override`", correct: false}
      - {text: "Non, et la redéclarer dans l'enfant ne compile pas", correct: false}
    answer: |-
      Non, elle est masquée : l'appel est résolu selon le type déclaré. La redéclarer dans l'enfant compile, mais ne
      crée aucun polymorphisme.
  - key: champs-sont-ils-polymorphes
    format: course
    question: "Les champs sont-ils polymorphes ?"
    choices:
      - {text: "Non : leur accès dépend du type déclaré de la référence", correct: true}
      - {text: "Oui : leur accès dépend du type réel de l'objet", correct: false}
      - {text: "Oui, s'ils sont déclarés `protected` ou `public`", correct: false}
      - {text: "Non, sauf les champs `static`, lus à l'exécution", correct: false}
    answer: "Non, leur accès dépend du type déclaré. Seules les méthodes d'instance sont polymorphes."
  - key: deux-champs
    format: course
    question: "Combien de champs `nom` contient un objet `Enfant` si `Parent` et `Enfant` en déclarent chacun un ?"
    choices:
      - {text: "Deux : celui de `Parent` et celui d'`Enfant`, qui le masque", correct: true}
      - {text: "Un seul : celui d'`Enfant` remplace celui de `Parent`", correct: false}
      - {text: "Un seul : celui de `Parent`, l'autre est ignoré", correct: false}
      - {text: "Aucun : la double déclaration ne compile pas", correct: false}
    answer: "Deux : celui de `Parent`, que voient les méthodes de `Parent`, et celui d'`Enfant`, qui le masque dans `Enfant`."
  - key: eviter-masquage
    format: course
    question: "Comment éviter les pièges du masquage ?"
    choices:
      - {text: "Ne pas redéclarer les champs du parent, les garder `private`, appeler les `static` par leur classe", correct: true}
      - {text: "Annoter chaque champ redéclaré avec `@Override`, et appeler les `static` sur une instance", correct: false}
      - {text: "Déclarer tous les champs `protected`, pour que l'enfant réutilise ceux du parent", correct: false}
      - {text: "Redéclarer chaque champ dans l'enfant, pour que chaque classe lise toujours le sien", correct: false}
    answer: |-
      Ne jamais redéclarer un champ du parent, garder les champs `private`, et appeler les méthodes `static` par le nom
      de leur classe.
  - key: vf-static-polymorphe
    format: true-false
    question: "Avec `Parent p = new Enfant();`, `p.s()` appelle la méthode `static` d'`Enfant`."
    truth: false
    answer: "Une méthode `static` est résolue sur le type déclaré : celle de `Parent`."
  - key: vf-override-static
    format: true-false
    question: "`@Override` peut s'appliquer à une méthode `static`."
    truth: false
    answer: Une méthode `static` ne redéfinit rien ; l'annotation provoque une erreur de compilation.
  - key: vf-champ-type-declare
    format: true-false
    question: L'accès à un champ dépend du type déclaré de la variable.
    truth: true
    answer: Les champs ne sont pas polymorphes.
  - key: vf-instance-masque-static
    format: true-false
    question: Une sous-classe peut déclarer une méthode d'instance de même signature qu'une méthode `static` du parent.
    truth: false
    answer: C'est une erreur de compilation, dans un sens comme dans l'autre.
  - key: qcm-resolution
    format: multiple-choice
    question: Qu'est-ce qui est résolu selon le type **réel** de l'objet ?
    choices:
      - text: "Une méthode d'instance redéfinie"
        correct: true
      - text: "Un champ"
        correct: false
      - text: "Une méthode `static`"
        correct: false
      - text: "Une méthode `private`"
        correct: false
    answer: Seules les méthodes d'instance non `private` participent à la liaison dynamique.
  - key: qcm-lire-champ-parent
    format: multiple-choice
    question: "Dans `Enfant`, qui masque le champ `nom` de `Parent`, quelle expression lit celui de `Parent` ?"
    choices:
      - {text: "`super.nom`", correct: true}
      - {text: "`this.nom`", correct: false}
      - {text: "`nom`", correct: false}
      - {text: "`Parent.nom`", correct: false}
    answer: |-
      Un champ se résout sur le type de l'expression : `super.nom` (comme `((Parent) this).nom`) atteint celui du
      parent. `this.nom` et `nom` lisent celui d'`Enfant`, et `Parent.nom` ne vaut que pour un champ `static`.
  - key: qcm-bonne-pratique
    format: multiple-choice
    question: Quelle pratique évite d'être surpris par le masquage d'une méthode `static` ?
    choices:
      - {text: "L'appeler par le nom de sa classe : `Enfant.s()`", correct: true}
      - {text: "L'appeler sur une instance : `enfant.s()`", correct: false}
      - {text: "Ajouter `@Override` sur la version de l'enfant", correct: false}
      - {text: "La rendre `protected` dans le parent et l'enfant", correct: false}
    answer: Le nom de la classe dit clairement quelle version s'exécute.
  - key: qcm-compile
    format: multiple-choice
    question: "Le parent déclare `static void m()`. Laquelle de ces déclarations dans l'enfant compile ?"
    choices:
      - {text: "`static void m()`", correct: true}
      - {text: "`void m()`", correct: false}
      - {text: "`@Override static void m()`", correct: false}
      - {text: "`@Override void m()`", correct: false}
    answer: |-
      Redéclarer `static void m()` masque la méthode du parent. En faire une méthode d'instance, ou annoter
      `@Override`, ne compile pas : une méthode `static` ne se redéfinit pas.
  - key: code-class-parent-string-name-parent
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Parent { String name = "parent"; static String s() { return "Parent.s"; } }
      class Child extends Parent { String name = "child"; static String s() { return "Child.s"; } }
      Parent p = new Child();
      System.out.println(p.name + " " + ((Child) p).name + " " + p.s());
      ```
    choices:
      - {text: "`parent child Parent.s`", correct: true}
      - {text: "`child child Child.s`", correct: false}
      - {text: "`parent child Child.s`", correct: false}
      - {text: "`child child Parent.s`", correct: false}
    answer: "`parent child Parent.s` : les champs et les méthodes `static` sont résolus selon le **type déclaré**."
    check:
      output: "parent child Parent.s"
  - key: code-static-appelee-parent
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class A {
          static String nom() { return "A"; }
          String appel() { return nom(); }
      }
      class B extends A {
          static String nom() { return "B"; }
      }
      System.out.println(new B().appel());
      ```
    choices:
      - {text: "`A`", correct: true}
      - {text: "`B`", correct: false}
      - {text: "`AB`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`A` : dans `A`, `nom()` désigne `A.nom()`, quel que soit l'objet."
    check:
      output: "A"
  - key: code-override-static
    format: code-output
    question: |-
      ```java
      class A { static void m() { } }
      class B extends A {
          @Override static void m() { }
      }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas : `@Override` sur une méthode `static`", correct: true}
      - {text: "Oui : `B.m()` redéfinit `A.m()`, l'annotation est juste", correct: false}
      - {text: "Oui : `B.m()` masque `A.m()`, l'annotation est ignorée", correct: false}
      - {text: "Oui, mais le chargement de `B` lève une erreur", correct: false}
    answer: |-
      Non : `method does not override or implement a method from a supertype`. Une méthode `static` se masque, elle ne
      se redéfinit pas : `@Override` y est refusé.
    check:
      compiles: false
  - key: code-instance-vs-static
    format: code-output
    question: |-
      ```java
      class A { void m() { } }
      class B extends A {
          static void m() { }
      }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas : une `static` ne remplace pas une méthode d'instance", correct: true}
      - {text: "Oui : `B.m()` masque la méthode d'instance `A.m()`", correct: false}
      - {text: "Oui : `B.m()` redéfinit `A.m()`, en version `static`", correct: false}
      - {text: "Oui, mais un appel `a.m()` lève une erreur à l'exécution", correct: false}
    answer: |-
      Non : `m() in B cannot override m() in A; overriding method is static`. Une méthode `static` ne peut ni redéfinir
      ni masquer une méthode d'instance.
    check:
      compiles: false
  - key: bug-config-static
    format: bug-fix
    question: |-
      Dans les tests, on obtient toujours « prod ». Quelle correction est la bonne ?
      ```java
      class Config { static String env() { return "prod"; } }
      class ConfigTest extends Config { static String env() { return "test"; } }

      Config c = new ConfigTest();
      c.env();   // "prod"
      ```
    choices:
      - {text: "Faire de `env()` une méthode d'instance, redéfinie dans `ConfigTest`", correct: true}
      - {text: "Ajouter `@Override` sur la méthode `env()` de `ConfigTest`", correct: false}
      - {text: "Rendre `Config.env()` `final`, pour imposer la version de l'enfant", correct: false}
      - {text: "Appeler `super.env()` dans la méthode `env()` de `ConfigTest`", correct: false}
    answer: |-
      ```java
      class Config { String env() { return "prod"; } }
      class ConfigTest extends Config {
          @Override String env() { return "test"; }
      }
      ```
      Une méthode `static` n'est pas polymorphe : via le type `Config`, c'est `Config.env()` qui s'exécute. Pour
      pouvoir la remplacer, on en fait une méthode d'instance (et l'on injecte la configuration).
  - key: bug-champ-masque
    format: bug-fix
    question: |-
      Le prix TTC d'un livre vaut toujours 0. Quelle correction est la bonne ?
      ```java
      class Produit {
          protected double prix;
          double ttc() { return prix * 1.2; }
      }
      class Livre extends Produit {
          protected double prix;
          Livre(double prix) { this.prix = prix; }
      }
      ```
    choices:
      - {text: "Supprimer le `prix` de `Livre`, et le passer au constructeur de `Produit`", correct: true}
      - {text: "Déclarer le `prix` de `Livre` `public`, pour qu'il remplace l'autre", correct: false}
      - {text: "Déclarer le `prix` de `Produit` `static`, pour le partager avec `Livre`", correct: false}
      - {text: "Annoter le champ `prix` de `Livre` avec `@Override`", correct: false}
    answer: |-
      ```java
      class Produit {
          private final double prix;
          Produit(double prix) { this.prix = prix; }
          double ttc() { return prix * 1.2; }
      }
      class Livre extends Produit {
          Livre(double prix) { super(prix); }
      }
      ```
      `Livre` déclarait un second champ `prix` qui masque celui de `Produit` ; `ttc()` lit celui de `Produit`, resté
      à 0. Un seul champ, initialisé par le constructeur du parent.
  - key: bug-logger-herite
    format: bug-fix
    question: |-
      Les messages de `ServiceCommande` apparaissent sous le nom « ServiceBase » dans les journaux. Quelle correction
      est la bonne ?
      ```java
      class ServiceBase {
          protected static final Logger LOG = Logger.getLogger(ServiceBase.class.getName());
      }
      class ServiceCommande extends ServiceBase {
          void traiter() { LOG.info("traitement"); }
      }
      ```
    choices:
      - {text: "Déclarer dans `ServiceCommande` son propre `LOG` `private`, à son nom", correct: true}
      - {text: "Initialiser `LOG` avec `getClass().getName()` dans `ServiceBase`", correct: false}
      - {text: "Retirer `final` de `LOG`, pour que chaque sous-classe le recrée", correct: false}
      - {text: "Rendre `LOG` `public`, pour que chaque sous-classe l'hérite à son nom", correct: false}
    answer: |-
      ```java
      class ServiceCommande extends ServiceBase {
          private static final Logger LOG = Logger.getLogger(ServiceCommande.class.getName());
          void traiter() { LOG.info("traitement"); }
      }
      ```
      Un champ `static` appartient à la classe qui le déclare : l'héritage ne le « recrée » pas pour chaque
      sous-classe (et `getClass()` n'existe pas dans un contexte `static`). Chaque classe déclare son propre journal
      `private`.
  - key: bug-override-static
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      abstract class Forme { static Forme creer() { return null; } }
      class Cercle extends Forme {
          @Override static Forme creer() { return new Cercle(); }
      }
      ```
      On voulait que chaque forme sache créer « sa » forme. Quelle correction est la bonne ?
    choices:
      - {text: "Retirer `@Override` : une fabrique `static` par classe, appelée par son nom", correct: true}
      - {text: "Retirer `static` du seul `creer()` de `Cercle`, en gardant `@Override`", correct: false}
      - {text: "Déclarer `creer()` `abstract static` dans `Forme`", correct: false}
      - {text: "Faire de `Forme` une interface, où `@Override` est permis sur une `static`", correct: false}
    answer: |-
      ```java
      class Cercle extends Forme {
          static Cercle creer() { return new Cercle(); }
      }
      // l'appelant choisit explicitement : Cercle.creer()
      ```
      Une méthode `static` ne se redéfinit pas. Une fabrique statique par classe, appelée par son nom, suffit ; si le
      choix doit être dynamique, on passe par une fabrique objet (`Supplier<Forme>`) ou une méthode d'instance.
