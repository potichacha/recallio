notion: masquage-champs-static
lesson: |-
  Seules les **méthodes d'instance** sont polymorphes. Les **champs** et les **méthodes `static`** de même nom dans une
  sous-classe ne redéfinissent rien : ils **masquent** (*hide*) ceux du parent, et l'accès est résolu à la compilation,
  selon le **type déclaré**.

  ```java
  class Parent {
      String nom = "parent";
      static String s() { return "Parent.s"; }
  }
  class Enfant extends Parent {
      String nom = "enfant";                 // un second champ, qui masque le premier
      static String s() { return "Enfant.s"; }
  }

  Parent p = new Enfant();
  p.nom;              // "parent" : type déclaré Parent
  ((Enfant) p).nom;   // "enfant"
  p.s();              // "Parent.s" : méthode static, type déclaré
  ```

  - Un objet `Enfant` contient **deux** champs `nom` ; les méthodes de `Parent` ne voient que le leur.
  - `@Override` sur une méthode `static` est une erreur de compilation.
  - Une méthode d'instance ne peut pas masquer une méthode `static` du parent, ni l'inverse : erreur de compilation.

  En pratique : on ne redéclare jamais un champ du parent, et on appelle une méthode `static` par le **nom de sa
  classe**. Le masquage devient alors invisible.

  **Piège classique** : attendre un comportement polymorphe d'une méthode `static` (une fabrique, une configuration
  « surchargée » dans une sous-classe de test). C'est toujours la version du type déclaré qui s'exécute.

  **En entretien** : « Les champs et les méthodes `static` ne sont pas polymorphes : ils sont masqués, et résolus sur
  le type déclaré. »
cards:
  - key: redefinir-methode-static
    format: course
    question: Peut-on redéfinir une méthode static ?
    answer: 'Non, elle est masquée : l''appel est résolu selon le type déclaré.'
  - key: champs-sont-ils-polymorphes
    format: course
    question: Les champs sont-ils polymorphes ?
    answer: Non, leur accès dépend du type déclaré.
  - key: deux-champs
    format: course
    question: Combien de champs `nom` contient un objet `Enfant` si `Parent` et `Enfant` en déclarent chacun un ?
    answer: "Deux : celui de `Parent`, que voient les méthodes de `Parent`, et celui d'`Enfant`, qui le masque dans `Enfant`."
  - key: eviter-masquage
    format: course
    question: Comment éviter les pièges du masquage ?
    answer: Ne jamais redéclarer un champ du parent, garder les champs `private`, et appeler les méthodes `static` par le nom de leur classe.
  - key: vf-static-polymorphe
    format: true-false
    question: "Avec `Parent p = new Enfant();`, `p.s()` appelle la méthode `static` d'`Enfant`."
    truth: false
    answer: "Une méthode `static` est résolue sur le type déclaré : celle de `Parent`."
  - key: vf-override-static
    format: true-false
    question: "`@Override` peut s'appliquer à une méthode `static`."
    truth: false
    answer: Une méthode `static` ne redéfinit rien ; l'annotation provoque une erreur de compilation.
  - key: vf-champ-type-declare
    format: true-false
    question: L'accès à un champ dépend du type déclaré de la variable.
    truth: true
    answer: Les champs ne sont pas polymorphes.
  - key: vf-instance-masque-static
    format: true-false
    question: Une sous-classe peut déclarer une méthode d'instance de même signature qu'une méthode `static` du parent.
    truth: false
    answer: C'est une erreur de compilation, dans un sens comme dans l'autre.
  - key: qcm-resolution
    format: multiple-choice
    question: Qu'est-ce qui est résolu selon le type **réel** de l'objet ?
    choices:
      - text: "Une méthode d'instance redéfinie"
        correct: true
      - text: "Un champ"
        correct: false
      - text: "Une méthode `static`"
        correct: false
      - text: "Une méthode `private`"
        correct: false
    answer: Seules les méthodes d'instance non `private` participent à la liaison dynamique.
  - key: qcm-lire-champ-parent
    format: multiple-choice
    question: Dans `Enfant`, qui masque le champ `nom` de `Parent`, comment lire celui de `Parent` ?
    choices:
      - text: "`super.nom`"
        correct: true
      - text: "`((Parent) this).nom`"
        correct: true
      - text: "`this.nom`"
        correct: false
      - text: "`nom`"
        correct: false
    answer: "Un champ se résout sur le type de l'expression : `super` ou un cast vers `Parent` atteignent celui du parent."
  - key: qcm-bonne-pratique
    format: multiple-choice
    question: Quelle pratique évite d'être surpris par le masquage d'une méthode `static` ?
    choices:
      - text: "L'appeler par le nom de sa classe : `Enfant.s()`"
        correct: true
      - text: "L'appeler sur une instance"
        correct: false
      - text: "Ajouter `@Override`"
        correct: false
      - text: "La rendre `protected`"
        correct: false
    answer: Le nom de la classe dit clairement quelle version s'exécute.
  - key: qcm-compile
    format: multiple-choice
    question: "Le parent déclare `static void m()`. Quelles déclarations dans l'enfant compilent ?"
    choices:
      - text: "`static void m()`"
        correct: true
      - text: "`static void m(int x)`"
        correct: true
      - text: "`void m()`"
        correct: false
      - text: "`@Override static void m()`"
        correct: false
    answer: Masquer ou surcharger est permis ; transformer en méthode d'instance ou annoter `@Override` ne l'est pas.
  - key: code-class-parent-string-name-parent
    format: code-output
    question: |-
      ```java
      class Parent { String name = "parent"; static String s() { return "Parent.s"; } }
      class Child extends Parent { String name = "child"; static String s() { return "Child.s"; } }
      Parent p = new Child();
      System.out.println(p.name + " " + ((Child) p).name + " " + p.s());
      ```
    answer: '`parent child Parent.s` : les champs et les méthodes static sont résolus selon le **type déclaré**.'
    check:
      output: "parent child Parent.s"
  - key: code-static-appelee-parent
    format: code-output
    question: |-
      ```java
      class A {
          static String nom() { return "A"; }
          String appel() { return nom(); }
      }
      class B extends A {
          static String nom() { return "B"; }
      }
      System.out.println(new B().appel());
      ```
    answer: '`A` : dans `A`, `nom()` désigne `A.nom()`, quel que soit l''objet.'
    check:
      output: "A"
  - key: code-override-static
    format: code-output
    question: |-
      ```java
      class A { static void m() { } }
      class B extends A {
          @Override static void m() { }
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `method does not override or implement a method from a supertype`.'
    check:
      compiles: false
  - key: code-instance-vs-static
    format: code-output
    question: |-
      ```java
      class A { void m() { } }
      class B extends A {
          static void m() { }
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `m() in B cannot override m() in A; overriding method is static`.'
    check:
      compiles: false
  - key: bug-config-static
    format: bug-fix
    question: |-
      Dans les tests, on obtient toujours « prod » :
      ```java
      class Config { static String env() { return "prod"; } }
      class ConfigTest extends Config { static String env() { return "test"; } }

      Config c = new ConfigTest();
      c.env();   // "prod"
      ```
    answer: |-
      ```java
      class Config { String env() { return "prod"; } }
      class ConfigTest extends Config {
          @Override String env() { return "test"; }
      }
      ```
      Une méthode `static` n'est pas polymorphe : via le type `Config`, c'est `Config.env()` qui s'exécute. Pour
      pouvoir la remplacer, on en fait une méthode d'instance (et l'on injecte la configuration).
  - key: bug-champ-masque
    format: bug-fix
    question: |-
      Le prix TTC d'un livre vaut toujours 0 :
      ```java
      class Produit {
          protected double prix;
          double ttc() { return prix * 1.2; }
      }
      class Livre extends Produit {
          protected double prix;
          Livre(double prix) { this.prix = prix; }
      }
      ```
    answer: |-
      ```java
      class Produit {
          private final double prix;
          Produit(double prix) { this.prix = prix; }
          double ttc() { return prix * 1.2; }
      }
      class Livre extends Produit {
          Livre(double prix) { super(prix); }
      }
      ```
      `Livre` déclarait un second champ `prix` qui masque celui de `Produit` ; `ttc()` lit celui de `Produit`, resté
      à 0. Un seul champ, initialisé par le constructeur du parent.
  - key: bug-logger-herite
    format: bug-fix
    question: |-
      Les messages de `ServiceCommande` apparaissent sous le nom « ServiceBase » dans les journaux :
      ```java
      class ServiceBase {
          protected static final Logger LOG = Logger.getLogger(ServiceBase.class.getName());
      }
      class ServiceCommande extends ServiceBase {
          void traiter() { LOG.info("traitement"); }
      }
      ```
    answer: |-
      ```java
      class ServiceCommande extends ServiceBase {
          private static final Logger LOG = Logger.getLogger(ServiceCommande.class.getName());
          void traiter() { LOG.info("traitement"); }
      }
      ```
      Un champ `static` appartient à la classe qui le déclare : l'héritage ne le « recrée » pas pour chaque
      sous-classe. Chaque classe déclare son propre journal `private`.
  - key: bug-override-static
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      abstract class Forme { static Forme creer() { return null; } }
      class Cercle extends Forme {
          @Override static Forme creer() { return new Cercle(); }
      }
      ```
      On voulait que chaque forme sache créer « sa » forme.
    answer: |-
      ```java
      class Cercle extends Forme {
          static Cercle creer() { return new Cercle(); }
      }
      // l'appelant choisit explicitement : Cercle.creer()
      ```
      Une méthode `static` ne se redéfinit pas. Une fabrique statique par classe, appelée par son nom, suffit ; si le
      choix doit être dynamique, on passe par une fabrique objet (`Supplier<Forme>`) ou une méthode d'instance.
