notion: comparable-comparator
lesson: |-
  Deux façons de définir un **ordre** entre objets :

  - **`Comparable<T>`**, implémentée par la classe elle-même : son **ordre naturel**, unique (`String` par ordre
    alphabétique, `Integer` par valeur, `LocalDate` chronologiquement) ;
  - **`Comparator<T>`**, un objet à part : **autant d'ordres que l'on veut**, sans modifier la classe.

  `compare` et `compareTo` renvoient un nombre **négatif** (avant), **zéro** (à égalité) ou **positif** (après).

  ```java
  record Version(int majeure, int mineure) implements Comparable<Version> {
      @Override
      public int compareTo(Version autre) {
          int c = Integer.compare(majeure, autre.majeure);
          return c != 0 ? c : Integer.compare(mineure, autre.mineure);
      }
  }

  personnes.sort(Comparator.comparing(Personne::nom));                  // par nom
  personnes.sort(Comparator.comparingInt(Personne::age)
          .thenComparing(Personne::nom)                                 // à âge égal, par nom
          .reversed());                                                 // le tout inversé
  ```

  - `Collections.sort`, `TreeSet` et `TreeMap` utilisent l'ordre naturel, ou un `Comparator` fourni.
  - Un `TreeSet` considère comme **doublons** deux éléments dont `compareTo` vaut 0, même si `equals` dit le
    contraire : on garde `compareTo` **cohérent avec `equals`** autant que possible.
  - Fabriques utiles : `Comparator.naturalOrder()`, `reverseOrder()`, `nullsFirst(...)`, `comparingInt`.

  **Piège classique** : `return a - b;` pour comparer des entiers. La soustraction peut **déborder**
  (`Integer.MIN_VALUE - 1` devient positif) : on écrit `Integer.compare(a, b)`.

  **En entretien** : « `Comparable` pour l'ordre naturel, dans la classe ; `Comparator` pour les autres ordres, composés
  avec `comparing` et `thenComparing` ; jamais de soustraction. »
cards:
  - key: comparable-vs-comparator
    format: course
    question: Comparable vs Comparator ?
    answer: Ordre naturel interne vs ordre externe, plusieurs possibles.
  - key: valeur-retour
    format: course
    question: Que renvoie `compareTo` ?
    answer: Un entier négatif si l'objet vient avant l'autre, zéro s'ils sont à égalité, positif s'il vient après (seul le signe compte).
  - key: soustraction
    format: course
    question: Pourquoi ne pas écrire `return a - b;` dans un comparateur ?
    answer: La soustraction d'`int` peut déborder et donner le mauvais signe (`Integer.MIN_VALUE - 1` est positif) ; `Integer.compare(a, b)` est toujours correct.
  - key: coherence-equals
    format: course
    question: Que signifie « `compareTo` cohérent avec `equals` » ?
    answer: '`a.compareTo(b) == 0` exactement quand `a.equals(b)` ; sinon un `TreeSet` et un `HashSet` ne voient pas les mêmes doublons (exemple : `BigDecimal("1.0")` et `BigDecimal("1.00")`).'
  - key: vf-un-ordre
    format: true-false
    question: Une classe ne peut avoir qu'un seul ordre naturel.
    truth: true
    answer: Elle n'implémente `compareTo` qu'une fois ; les autres ordres sont des `Comparator`.
  - key: vf-treeset-equals
    format: true-false
    question: "Un `TreeSet` utilise `equals` pour détecter les doublons."
    truth: false
    answer: "Il utilise `compareTo` (ou le `Comparator`) : un résultat nul suffit à rejeter l'élément."
  - key: vf-modifier-classe
    format: true-false
    question: On peut trier une classe d'une bibliothèque qui n'implémente pas `Comparable`.
    truth: true
    answer: Avec un `Comparator`, qui ne demande pas de modifier la classe.
  - key: vf-moins-un
    format: true-false
    question: "`compareTo` doit renvoyer exactement -1, 0 ou 1."
    truth: false
    answer: Seul le signe compte ; il ne faut donc pas tester `== -1`.
  - key: qcm-tri
    format: multiple-choice
    question: Comment trier des personnes par âge, puis par nom à âge égal ?
    choices:
      - text: "`Comparator.comparingInt(Personne::age).thenComparing(Personne::nom)`"
        correct: true
      - text: "`Comparator.comparing(Personne::nom).thenComparing(Personne::age)`"
        correct: false
      - text: "`Comparator.comparingInt(Personne::age).reversed()`"
        correct: false
      - text: "Deux appels `sort` successifs, d'abord par âge puis par nom"
        correct: false
    answer: Deux tris successifs donneraient l'ordre par nom (le tri est stable, c'est le dernier qui l'emporte).
  - key: qcm-compare
    format: multiple-choice
    question: Quelle implémentation compare correctement deux `int` ?
    choices:
      - text: "`Integer.compare(a, b)`"
        correct: true
      - text: "`a - b`"
        correct: false
      - text: "`a > b ? 1 : 0`"
        correct: false
      - text: "`a == b ? 0 : -1`"
        correct: false
    answer: Les deux dernières ne savent pas dire « après » ou « avant » dans les deux sens.
  - key: qcm-decroissant
    format: multiple-choice
    question: Comment trier des chaînes en ordre décroissant ?
    choices:
      - text: "`liste.sort(Comparator.reverseOrder())`"
        correct: true
      - text: "`liste.sort(Comparator.<String>naturalOrder().reversed())`"
        correct: true
      - text: "`liste.sort(null)`"
        correct: false
      - text: "`Collections.sort(liste); Collections.shuffle(liste);`"
        correct: false
    answer: '`sort(null)` utilise l''ordre naturel croissant.'
  - key: qcm-treeset
    format: multiple-choice
    question: "Un `TreeSet<Personne>` trié par nom reçoit deux personnes différentes nommées « Ada ». Combien en garde-t-il ?"
    choices:
      - text: "1"
        correct: true
      - text: "2"
        correct: false
      - text: "0"
        correct: false
      - text: "Une exception est levée"
        correct: false
    answer: "Le comparateur les juge égales : la seconde est considérée comme un doublon."
  - key: trous-implements
    format: fill-in
    question: |-
      Complétez pour donner un ordre naturel aux versions :
      ```java
      record Version(int majeure, int mineure) implements ___<Version> { ... }
      ```
    blanks: [[Comparable]]
    answer: '`Comparable<Version>` impose `compareTo(Version)`.'
  - key: trous-compare
    format: fill-in
    question: |-
      Complétez sans risque de débordement :
      ```java
      public int compareTo(Version autre) {
          return Integer.___(majeure, autre.majeure);
      }
      ```
    blanks: [[compare]]
    answer: '`Integer.compare` renvoie le bon signe pour toutes les valeurs.'
  - key: trous-comparing
    format: fill-in
    question: |-
      Complétez pour trier les produits par prix :
      ```java
      produits.sort(Comparator.___(Produit::prix));
      ```
    blanks: [[comparing, comparingDouble]]
    answer: '`comparing` (ou `comparingDouble`, sans boxing) construit un comparateur à partir d''une clé.'
  - key: trous-reversed
    format: fill-in
    question: |-
      Complétez pour trier du plus cher au moins cher :
      ```java
      produits.sort(Comparator.comparingDouble(Produit::prix).___());
      ```
    blanks: [[reversed]]
    answer: '`reversed()` inverse l''ordre du comparateur.'
  - key: code-ordre-naturel
    format: code-output
    question: |-
      ```java
      List<String> fruits = new ArrayList<>(List.of("poire", "Abricot", "banane"));
      Collections.sort(fruits);
      System.out.println(fruits);
      ```
    answer: '`[Abricot, banane, poire]` : l''ordre naturel des chaînes suit les codes des caractères, majuscules avant minuscules.'
    check:
      output: "[Abricot, banane, poire]"
  - key: code-then-comparing
    format: code-output
    question: |-
      ```java
      record Personne(String nom, int age) { }
      List<Personne> l = new ArrayList<>(List.of(
              new Personne("Bob", 30), new Personne("Ada", 30), new Personne("Cy", 25)));
      l.sort(Comparator.comparingInt(Personne::age).thenComparing(Personne::nom));
      System.out.println(l.stream().map(Personne::nom).toList());
      ```
    answer: '`[Cy, Ada, Bob]` : par âge, puis par nom à âge égal.'
    check:
      output: "[Cy, Ada, Bob]"
  - key: code-soustraction
    format: code-output
    question: |-
      ```java
      Comparator<Integer> faux = (a, b) -> a - b;
      System.out.println(faux.compare(Integer.MIN_VALUE, 1) > 0);
      ```
    answer: '`true` : la soustraction déborde, et le comparateur juge le plus petit entier plus grand que 1.'
    check:
      output: "true"
  - key: code-bigdecimal
    format: code-output
    question: |-
      ```java
      var a = new BigDecimal("1.0");
      var b = new BigDecimal("1.00");
      System.out.println(new HashSet<>(List.of(a, b)).size() + " " + new TreeSet<>(List.of(a, b)).size());
      ```
    answer: '`2 1` : `equals` compare aussi l''échelle, `compareTo` seulement la valeur.'
    check:
      output: "2 1"
  - key: bug-soustraction
    format: bug-fix
    question: |-
      Ce tri place parfois les grands montants négatifs en dernier :
      ```java
      operations.sort((a, b) -> a.montant() - b.montant());   // montant() : int
      ```
    answer: |-
      ```java
      operations.sort(Comparator.comparingInt(Operation::montant));
      ```
      La soustraction déborde pour des valeurs éloignées. `comparingInt` (ou `Integer.compare`) donne toujours le bon
      signe.
  - key: bug-treeset-nom
    format: bug-fix
    question: |-
      Des clients disparaissent de l'ensemble trié dès que deux d'entre eux portent le même nom :
      ```java
      Set<Client> clients = new TreeSet<>(Comparator.comparing(Client::nom));
      ```
    answer: |-
      ```java
      Set<Client> clients = new TreeSet<>(Comparator.comparing(Client::nom)
              .thenComparing(Client::id));
      ```
      Pour un `TreeSet`, un comparateur qui renvoie 0 signifie « doublon ». On départage par un critère unique pour que
      l'ordre ne fusionne pas des éléments différents.
  - key: bug-sans-comparable
    format: bug-fix
    question: |-
      `Collections.sort(commandes)` ne compile pas (`no suitable method found for sort`) : `Commande` n'est pas
      `Comparable`.
      ```java
      Collections.sort(commandes);
      ```
    answer: |-
      ```java
      commandes.sort(Comparator.comparing(Commande::date));
      ```
      Une commande n'a pas d'ordre naturel évident (date ? montant ?) : un `Comparator` explicite dit lequel on veut, sans
      imposer un ordre unique à la classe.
  - key: bug-reversed-chaine
    format: bug-fix
    question: |-
      On veut les scores du plus haut au plus bas, et à score égal les noms dans l'ordre alphabétique, mais les noms
      sortent à l'envers :
      ```java
      joueurs.sort(Comparator.comparingInt(Joueur::score)
              .thenComparing(Joueur::nom)
              .reversed());
      ```
    answer: |-
      ```java
      joueurs.sort(Comparator.comparingInt(Joueur::score).reversed()
              .thenComparing(Joueur::nom));
      ```
      `reversed()` inverse tout le comparateur construit jusque-là, critère secondaire compris. On l'applique juste
      après le critère à inverser.
