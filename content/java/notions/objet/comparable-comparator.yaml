notion: comparable-comparator
lesson: |-
  Deux façons de définir un **ordre** entre objets :

  - **`Comparable<T>`**, implémentée par la classe elle-même : son **ordre naturel**, unique (`String` par ordre
    alphabétique, `Integer` par valeur, `LocalDate` chronologiquement) ;
  - **`Comparator<T>`**, un objet à part : **autant d'ordres que l'on veut**, sans modifier la classe.

  `compare` et `compareTo` renvoient un nombre **négatif** (avant), **zéro** (à égalité) ou **positif** (après).

  ```java
  record Version(int majeure, int mineure) implements Comparable<Version> {
      @Override
      public int compareTo(Version autre) {
          int c = Integer.compare(majeure, autre.majeure);
          return c != 0 ? c : Integer.compare(mineure, autre.mineure);
      }
  }

  personnes.sort(Comparator.comparing(Personne::nom));                  // par nom
  personnes.sort(Comparator.comparingInt(Personne::age)
          .thenComparing(Personne::nom)                                 // à âge égal, par nom
          .reversed());                                                 // le tout inversé
  ```

  - `Collections.sort`, `TreeSet` et `TreeMap` utilisent l'ordre naturel, ou un `Comparator` fourni.
  - Un `TreeSet` considère comme **doublons** deux éléments dont `compareTo` vaut 0, même si `equals` dit le
    contraire : on garde `compareTo` **cohérent avec `equals`** autant que possible.
  - Fabriques utiles : `Comparator.naturalOrder()`, `reverseOrder()`, `nullsFirst(...)`, `comparingInt`.

  **Piège classique** : `return a - b;` pour comparer des entiers. La soustraction peut **déborder**
  (`Integer.MIN_VALUE - 1` devient positif) : on écrit `Integer.compare(a, b)`.

  **En entretien** : « `Comparable` pour l'ordre naturel, dans la classe ; `Comparator` pour les autres ordres, composés
  avec `comparing` et `thenComparing` ; jamais de soustraction. »
tour:
  - title: Comparable et Comparator
    text: |-
      Pour trier des objets, Java doit savoir les comparer. Deux façons :

      - la classe implémente `Comparable` et sa méthode `compareTo` : c'est son **ordre naturel**, comme l'ordre
      alphabétique des `String` ; - un `Comparator` décrit un ordre à part, qu'on passe au tri :
      `Comparator.comparing(Personne::age)`, qui se combine avec `thenComparing` et `reversed()`.

      `compareTo` renvoie un nombre négatif, nul ou positif, selon que l'objet vient avant l'autre, avec lui, ou après.
    example:
      files:
        Main.java: |-
          record Personne(String nom, int age) implements Comparable<Personne> {
              public int compareTo(Personne autre) {
                  return nom.compareTo(autre.nom);
              }
          }

          String noms(List<Personne> personnes) {
              StringJoiner noms = new StringJoiner(", ");
              for (Personne p : personnes) {
                  noms.add(p.nom());
              }
              return noms.toString();
          }

          void main() {
              List<Personne> equipe = new ArrayList<>(List.of(
                      new Personne("Grace", 85), new Personne("Linus", 36), new Personne("Ada", 41)));
              Collections.sort(equipe);
              IO.println(noms(equipe));

              equipe.sort(Comparator.comparing(Personne::age));
              IO.println(noms(equipe));
          }
      output: |-
        Ada, Grace, Linus
        Linus, Ada, Grace
cards:
  - key: comparable-vs-comparator
    format: course
    question: "Quelle différence entre `Comparable` et `Comparator` ?"
    choices:
      - {text: "`Comparable` donne l'ordre naturel, dans la classe ; `Comparator`, un ordre externe parmi d'autres", correct: true}
      - {text: "`Comparator` donne l'ordre naturel, dans la classe ; `Comparable`, un ordre externe parmi d'autres", correct: false}
      - {text: "`Comparable` sert à trier les listes ; `Comparator` ne sert qu'à trier les tableaux", correct: false}
      - {text: "Aucune : `Comparator` est le nouveau nom de `Comparable`, depuis Java 8", correct: false}
    answer: |-
      `Comparable` (`compareTo`) est implémentée par la classe elle-même : un seul ordre, l'ordre naturel. Un
      `Comparator` (`compare`) est externe : on en écrit autant qu'on veut d'ordres.
  - key: valeur-retour
    format: course
    question: "Que renvoie `a.compareTo(b)` ?"
    choices:
      - {text: "Un entier négatif si `a` vient avant `b`, zéro à égalité, positif s'il vient après", correct: true}
      - {text: "Un entier positif si `a` vient avant `b`, zéro à égalité, négatif s'il vient après", correct: false}
      - {text: "Exactement -1, 0 ou 1 : toute autre valeur rend le tri incorrect", correct: false}
      - {text: "Un booléen : `true` si `a` vient avant `b`, `false` sinon", correct: false}
    answer: |-
      Seul le signe compte : négatif si `a` vient avant, zéro à égalité, positif après. Rien n'impose -1 ou 1 : un code
      qui teste `== 1` est fragile.
  - key: soustraction
    format: course
    question: "Pourquoi ne pas écrire `return a - b;` dans un comparateur d'`int` ?"
    choices:
      - {text: "La soustraction peut déborder et donner le mauvais signe pour des valeurs éloignées", correct: true}
      - {text: "Le résultat doit valoir -1, 0 ou 1, ce que la soustraction ne garantit pas", correct: false}
      - {text: "Elle trie en ordre décroissant, alors qu'on attend l'ordre croissant", correct: false}
      - {text: "Elle est plus lente que `Integer.compare`, qui ne fait aucun calcul", correct: false}
    answer: |-
      `Integer.MIN_VALUE - 1` déborde et devient positif : le comparateur se trompe de signe. `Integer.compare(a, b)`
      est toujours juste ; quant à la valeur exacte, seul son signe compte.
  - key: coherence-equals
    format: course
    question: "Que signifie « `compareTo` cohérent avec `equals` » ?"
    choices:
      - {text: "`a.compareTo(b) == 0` exactement quand `a.equals(b)` est vrai", correct: true}
      - {text: "`a.compareTo(b) == 1` exactement quand `a.equals(b)` est vrai", correct: false}
      - {text: "`compareTo` doit appeler `equals` avant de comparer les champs", correct: false}
      - {text: "`equals` et `compareTo` doivent être déclarées dans la même classe", correct: false}
    answer: |-
      Les deux disent « égaux » pour les mêmes objets. Sinon un `TreeSet` (qui suit `compareTo`) et un `HashSet` (qui
      suit `equals`) ne voient pas les mêmes doublons : `BigDecimal("1.0")` et `BigDecimal("1.00")` en sont l'exemple.
  - key: vf-un-ordre
    format: true-false
    question: Une classe ne peut avoir qu'un seul ordre naturel.
    truth: true
    answer: Elle n'implémente `compareTo` qu'une fois ; les autres ordres sont des `Comparator`.
  - key: vf-treeset-equals
    format: true-false
    question: "Un `TreeSet` utilise `equals` pour détecter les doublons."
    truth: false
    answer: "Il utilise `compareTo` (ou le `Comparator`) : un résultat nul suffit à rejeter l'élément."
  - key: vf-modifier-classe
    format: true-false
    question: On peut trier une classe d'une bibliothèque qui n'implémente pas `Comparable`.
    truth: true
    answer: Avec un `Comparator`, qui ne demande pas de modifier la classe.
  - key: vf-moins-un
    format: true-false
    question: "`compareTo` doit renvoyer exactement -1, 0 ou 1."
    truth: false
    answer: Seul le signe compte ; il ne faut donc pas tester `== -1`.
  - key: qcm-tri
    format: multiple-choice
    question: Comment trier des personnes par âge, puis par nom à âge égal ?
    choices:
      - text: "`Comparator.comparingInt(Personne::age).thenComparing(Personne::nom)`"
        correct: true
      - text: "`Comparator.comparing(Personne::nom).thenComparing(Personne::age)`"
        correct: false
      - text: "`Comparator.comparingInt(Personne::age).reversed()`"
        correct: false
      - text: "Deux appels `sort` successifs, d'abord par âge puis par nom"
        correct: false
    answer: Deux tris successifs donneraient l'ordre par nom (le tri est stable, c'est le dernier qui l'emporte).
  - key: qcm-compare
    format: multiple-choice
    question: Quelle implémentation compare correctement deux `int` ?
    choices:
      - text: "`Integer.compare(a, b)`"
        correct: true
      - text: "`a - b`"
        correct: false
      - text: "`a > b ? 1 : 0`"
        correct: false
      - text: "`a == b ? 0 : -1`"
        correct: false
    answer: Les deux dernières ne savent pas dire « après » ou « avant » dans les deux sens.
  - key: qcm-decroissant
    format: multiple-choice
    question: "Quelle instruction trie une liste de chaînes en ordre décroissant ?"
    choices:
      - {text: "`liste.sort(Comparator.reverseOrder())`", correct: true}
      - {text: "`liste.sort(Comparator.naturalOrder())`", correct: false}
      - {text: "`liste.sort(null)`", correct: false}
      - {text: "`Collections.sort(liste); Collections.shuffle(liste);`", correct: false}
    answer: |-
      `reverseOrder()` inverse l'ordre naturel. `sort(null)` et `naturalOrder()` trient en ordre croissant, et
      `shuffle` mélange au hasard.
  - key: qcm-treeset
    format: multiple-choice
    question: "Un `TreeSet<Personne>` trié par nom reçoit deux personnes différentes nommées « Ada ». Combien en garde-t-il ?"
    choices:
      - text: "1"
        correct: true
      - text: "2"
        correct: false
      - text: "0"
        correct: false
      - text: "Une exception est levée"
        correct: false
    answer: "Le comparateur les juge égales : la seconde est considérée comme un doublon."
  - key: trous-implements
    format: fill-in
    question: |-
      Complète pour donner un ordre naturel aux versions :
      ```java
      record Version(int majeure, int mineure) implements ___<Version> { ... }
      ```
    blanks: [[Comparable]]
    answer: '`Comparable<Version>` impose `compareTo(Version)`.'
  - key: trous-compare
    format: fill-in
    question: |-
      Complète sans risque de débordement :
      ```java
      public int compareTo(Version autre) {
          return Integer.___(majeure, autre.majeure);
      }
      ```
    blanks: [[compare]]
    answer: '`Integer.compare` renvoie le bon signe pour toutes les valeurs.'
  - key: trous-comparing
    format: fill-in
    question: |-
      Complète pour trier les produits par prix :
      ```java
      produits.sort(Comparator.___(Produit::prix));
      ```
    blanks: [[comparing, comparingDouble]]
    answer: '`comparing` (ou `comparingDouble`, sans boxing) construit un comparateur à partir d''une clé.'
  - key: trous-reversed
    format: fill-in
    question: |-
      Complète pour trier du plus cher au moins cher :
      ```java
      produits.sort(Comparator.comparingDouble(Produit::prix).___());
      ```
    blanks: [[reversed]]
    answer: '`reversed()` inverse l''ordre du comparateur.'
  - key: code-ordre-naturel
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> fruits = new ArrayList<>(List.of("poire", "Abricot", "banane"));
      Collections.sort(fruits);
      System.out.println(fruits);
      ```
    choices:
      - {text: "`[Abricot, banane, poire]`", correct: true}
      - {text: "`[banane, poire, Abricot]`", correct: false}
      - {text: "`[poire, Abricot, banane]`", correct: false}
      - {text: "`[poire, banane, Abricot]`", correct: false}
    answer: '`[Abricot, banane, poire]` : l''ordre naturel des chaînes suit les codes des caractères, majuscules avant minuscules.'
    check:
      output: "[Abricot, banane, poire]"
  - key: code-then-comparing
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Personne(String nom, int age) { }
      List<Personne> l = new ArrayList<>(List.of(
              new Personne("Bob", 30), new Personne("Ada", 30), new Personne("Cy", 25)));
      l.sort(Comparator.comparingInt(Personne::age).thenComparing(Personne::nom));
      System.out.println(l.stream().map(Personne::nom).toList());
      ```
    choices:
      - {text: "`[Cy, Ada, Bob]`", correct: true}
      - {text: "`[Cy, Bob, Ada]`", correct: false}
      - {text: "`[Ada, Bob, Cy]`", correct: false}
      - {text: "`[Bob, Ada, Cy]`", correct: false}
    answer: '`[Cy, Ada, Bob]` : par âge, puis par nom à âge égal.'
    check:
      output: "[Cy, Ada, Bob]"
  - key: code-soustraction
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Comparator<Integer> faux = (a, b) -> a - b;
      System.out.println(faux.compare(Integer.MIN_VALUE, 1) > 0);
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "Une `ArithmeticException`, car la soustraction déborde", correct: false}
      - {text: "Ça ne compile pas : `a - b` sur deux `Integer`", correct: false}
    answer: '`true` : la soustraction déborde, et le comparateur juge le plus petit entier plus grand que 1.'
    check:
      output: "true"
  - key: code-bigdecimal
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      var a = new BigDecimal("1.0");
      var b = new BigDecimal("1.00");
      System.out.println(new HashSet<>(List.of(a, b)).size() + " " + new TreeSet<>(List.of(a, b)).size());
      ```
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`1 2`", correct: false}
    answer: '`2 1` : `equals` compare aussi l''échelle, `compareTo` seulement la valeur.'
    check:
      output: "2 1"
  - key: bug-soustraction
    format: bug-fix
    question: |-
      Ce tri place parfois les grands montants négatifs en dernier. Quelle correction est la bonne ?
      ```java
      operations.sort((a, b) -> a.montant() - b.montant());   // montant() : int
      ```
    choices:
      - {text: "Trier avec `Comparator.comparingInt(Operation::montant)`", correct: true}
      - {text: "Inverser la soustraction : `b.montant() - a.montant()`", correct: false}
      - {text: "Prendre la valeur absolue : `Math.abs(a.montant() - b.montant())`", correct: false}
      - {text: "Ajouter `.reversed()` pour remettre les négatifs en tête", correct: false}
    answer: |-
      ```java
      operations.sort(Comparator.comparingInt(Operation::montant));
      ```
      La soustraction déborde pour des valeurs éloignées et donne le mauvais signe. `comparingInt` (ou
      `Integer.compare`) compare sans calcul : le signe est toujours juste.
  - key: bug-treeset-nom
    format: bug-fix
    question: |-
      Des clients disparaissent de l'ensemble trié dès que deux d'entre eux portent le même nom. Pourquoi ?
      ```java
      Set<Client> clients = new TreeSet<>(Comparator.comparing(Client::nom));
      ```
    choices:
      - {text: "Pour un `TreeSet`, un comparateur qui renvoie 0 désigne un doublon : le second est ignoré", correct: true}
      - {text: "Le `TreeSet` compare avec `equals`, que `Client` ne redéfinit pas, et confond les clients", correct: false}
      - {text: "`Comparator.comparing` trie mal les chaînes accentuées et écrase les noms en double", correct: false}
      - {text: "Un `TreeSet` ne garde que les éléments dont la classe implémente `Comparable`", correct: false}
    answer: |-
      ```java
      Set<Client> clients = new TreeSet<>(Comparator.comparing(Client::nom)
              .thenComparing(Client::id));
      ```
      Un `TreeSet` ne consulte que son comparateur : 0 veut dire « même élément ». On départage par un critère unique
      pour ne pas fusionner des clients différents.
  - key: bug-sans-comparable
    format: bug-fix
    question: |-
      `Collections.sort(commandes)` ne compile pas (`no suitable method found for sort`) : `Commande` n'est pas
      `Comparable`. Quelle correction est la bonne ?
      ```java
      Collections.sort(commandes);
      ```
    choices:
      - {text: "Passer un comparateur : `commandes.sort(Comparator.comparing(Commande::date))`", correct: true}
      - {text: "Appeler `commandes.sort(null)`, qui choisit un ordre à partir des champs", correct: false}
      - {text: "Passer par un tableau : `Arrays.sort(commandes.toArray())`, qui accepte tout objet", correct: false}
      - {text: "Caster la liste en `List<Comparable>` avant d'appeler `Collections.sort`", correct: false}
    answer: |-
      ```java
      commandes.sort(Comparator.comparing(Commande::date));
      ```
      Une commande n'a pas d'ordre naturel évident (date ? montant ?) : un `Comparator` explicite dit lequel on veut.
      `sort(null)`, `Arrays.sort` ou un cast exigent `Comparable` et lèvent une `ClassCastException` à l'exécution.
  - key: bug-reversed-chaine
    format: bug-fix
    question: |-
      On veut les scores du plus haut au plus bas, et à score égal les noms dans l'ordre alphabétique, mais les noms
      sortent à l'envers. Quelle correction est la bonne ?
      ```java
      joueurs.sort(Comparator.comparingInt(Joueur::score)
              .thenComparing(Joueur::nom)
              .reversed());
      ```
    choices:
      - {text: "Appeler `reversed()` juste après `comparingInt(Joueur::score)`, avant `thenComparing`", correct: true}
      - {text: "Remplacer `reversed()` par un `Collections.reverse(joueurs)` juste après le tri", correct: false}
      - {text: "Remplacer `comparingInt` par `comparing`, qui respecte le sens de chaque critère", correct: false}
      - {text: "Retirer `thenComparing` : à score égal, les noms restent dans l'ordre alphabétique", correct: false}
    answer: |-
      ```java
      joueurs.sort(Comparator.comparingInt(Joueur::score).reversed()
              .thenComparing(Joueur::nom));
      ```
      `reversed()` inverse tout le comparateur construit jusque-là, critère secondaire compris. On l'applique juste
      après le critère à inverser.
