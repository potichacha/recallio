notion: abstraite-vs-interface
cards:
  - key: classe-abstraite-vs-interface
    format: course
    question: Classe abstraite vs interface ?
    answer: Abstraite = état + code partagé, héritage simple. Interface = contrat transversal, implémentation multiple.
  - key: decides-classe-abstraite-interface
    format: scenario
    question: Comment tu décides entre classe abstraite et interface ?
    answer: |-
      Deux questions. Ai-je du **code ou de l'état à partager** entre des classes vraiment apparentées ? Si oui, classe abstraite : elle peut porter des champs, un constructeur, des méthodes concrètes.
      Est-ce que je définis un **contrat** que des classes potentiellement sans lien vont remplir ? Alors interface, et ça autorise l'implémentation multiple, ce que l'héritage simple interdit.
      Par défaut je penche vers l'interface : elle ne consomme pas l'unique droit d'héritage de la classe, et depuis Java 8 les méthodes `default` permettent déjà de partager du comportement. La classe abstraite reste pertinente quand il y a un vrai **état** commun à initialiser.
