notion: abstraite-vs-interface
lesson: |-
  | | Classe abstraite | Interface |
  |---|---|---|
  | État (champs d'instance) | oui | non (seulement des constantes) |
  | Constructeur | oui | non |
  | Héritage | **une seule** par classe | **plusieurs** par classe |
  | Méthodes concrètes | oui, de toute visibilité | `default`, `static`, `private` (Java 8 et 9) |
  | Relation exprimée | « est un » entre classes apparentées | « sait faire » : une capacité, un contrat |

  ```java
  abstract class Document {                 // état commun à des classes apparentées
      private final String titre;
      protected Document(String titre) { this.titre = titre; }
      public String titre() { return titre; }
  }

  interface Exportable {                    // une capacité, que n'importe quelle classe peut avoir
      String exporter();
  }

  class Facture extends Document implements Exportable { ... }
  class Photo implements Exportable { ... }   // pas un Document, mais exportable
  ```

  Démarche : on part d'une **interface** (elle n'utilise pas l'unique droit d'héritage et se double facilement en
  test) ; on ajoute une **classe abstraite** quand plusieurs implémentations partagent un vrai **état** ou une
  initialisation. Les deux se combinent souvent : `List` (interface) et `AbstractList` (squelette d'implémentation).

  **Piège classique** : choisir la classe abstraite par habitude, puis découvrir qu'une classe qui étend déjà autre
  chose doit aussi remplir ce contrat. Avec une interface, c'était possible.

  **En entretien** : « Interface pour un contrat ou une capacité, classe abstraite pour partager un état entre classes
  apparentées ; et souvent les deux, l'interface comme type et la classe abstraite comme squelette. »
cards:
  - key: classe-abstraite-vs-interface
    format: course
    question: Classe abstraite vs interface ?
    answer: Abstraite = état + code partagé, héritage simple. Interface = contrat transversal, implémentation multiple.
  - key: choix-par-defaut
    format: course
    question: Que choisir par défaut, et pourquoi ?
    answer: "Une interface : elle ne consomme pas l'unique héritage de classe, s'implémente par des classes sans lien et se remplace facilement par un double de test."
  - key: squelette
    format: course
    question: Qu'est-ce qu'une implémentation squelette (comme `AbstractList`) ?
    answer: Une classe abstraite qui implémente l'essentiel d'une interface à partir de quelques méthodes abstraites, pour faciliter l'écriture d'implémentations, tandis que l'interface reste le type utilisé.
  - key: quand-abstraite
    format: course
    question: Quand une classe abstraite est-elle le bon choix ?
    answer: Quand des classes apparentées partagent un état (des champs), une initialisation (un constructeur) ou des méthodes `protected` non publiques.
  - key: vf-interface-constructeur
    format: true-false
    question: Une interface peut déclarer un constructeur.
    truth: false
    answer: Seules les classes, abstraites ou non, ont des constructeurs.
  - key: vf-combiner
    format: true-false
    question: Une classe peut étendre une classe abstraite et implémenter plusieurs interfaces.
    truth: true
    answer: "`class Facture extends Document implements Exportable, Comparable<Facture>` est valide."
  - key: vf-default-etat
    format: true-false
    question: Depuis les méthodes `default`, une interface peut tout faire comme une classe abstraite.
    truth: false
    answer: Elle n'a toujours ni état, ni constructeur, ni méthodes `protected`.
  - key: vf-classes-sans-lien
    format: true-false
    question: Une interface convient pour une capacité partagée par des classes sans lien entre elles.
    truth: true
    answer: Une photo et une facture peuvent toutes deux être `Exportable`.
  - key: qcm-choix-interface
    format: multiple-choice
    question: Dans quels cas une interface est-elle le meilleur choix ?
    choices:
      - text: "Des classes sans lien doivent partager une capacité"
        correct: true
      - text: "On veut pouvoir remplacer l'implémentation par un double en test"
        correct: true
      - text: "Les implémentations doivent partager des champs initialisés par un constructeur"
        correct: false
      - text: "On a besoin de méthodes `protected`"
        correct: false
    answer: Les deux derniers besoins demandent une classe abstraite.
  - key: qcm-difference
    format: multiple-choice
    question: Qu'est-ce qu'une classe abstraite peut avoir et une interface non ?
    choices:
      - text: "Des champs d'instance"
        correct: true
      - text: "Un constructeur"
        correct: true
      - text: "Des méthodes avec du code"
        correct: false
      - text: "Des méthodes `static`"
        correct: false
    answer: Les interfaces ont du code (`default`, `static`, `private`), mais pas d'état.
  - key: qcm-jdk
    format: multiple-choice
    question: Quel couple de la JDK combine une interface et son squelette abstrait ?
    choices:
      - text: "`List` et `AbstractList`"
        correct: true
      - text: "`String` et `StringBuilder`"
        correct: false
      - text: "`Object` et `Class`"
        correct: false
      - text: "`Integer` et `Number`"
        correct: false
    answer: On type avec `List`, on implémente en étendant `AbstractList`.
  - key: qcm-heritage-pris
    format: multiple-choice
    question: "`Rapport` étend déjà `Document`. Il doit aussi être « planifiable ». Que doit être `Planifiable` ?"
    choices:
      - text: "Une interface"
        correct: true
      - text: "Une classe abstraite"
        correct: false
      - text: "Une classe concrète"
        correct: false
      - text: "Une enum"
        correct: false
    answer: '`Rapport` ne peut étendre qu''une classe : la capacité doit être une interface.'
  - key: decides-classe-abstraite-interface
    format: scenario
    question: Comment tu décides entre classe abstraite et interface ?
    answer: |-
      Deux questions. Ai-je du **code ou de l'état à partager** entre des classes vraiment apparentées ? Si oui, classe abstraite : elle peut porter des champs, un constructeur, des méthodes concrètes.
      Est-ce que je définis un **contrat** que des classes potentiellement sans lien vont remplir ? Alors interface, et ça autorise l'implémentation multiple, ce que l'héritage simple interdit.
      Par défaut je penche vers l'interface : elle ne consomme pas l'unique droit d'héritage de la classe, et depuis Java 8 les méthodes `default` permettent déjà de partager du comportement. La classe abstraite reste pertinente quand il y a un vrai **état** commun à initialiser.
  - key: scenario-repository
    format: scenario
    question: Tu conçois l'accès aux données d'une application (commandes, clients). Interface ou classe abstraite ?
    answer: |-
      Une interface par agrégat (`DepotCommandes` avec `trouver`, `enregistrer`) : le domaine ne dépend que de ce
      contrat, qu'on implémente en PostgreSQL en production et en mémoire dans les tests. Si plusieurs implémentations
      JPA partagent du code (gestion de l'`EntityManager`, pagination), j'ajoute une classe abstraite **côté
      infrastructure** qu'elles étendent ; elle ne remonte jamais dans le domaine, qui reste typé par l'interface.
  - key: scenario-evolution
    format: scenario
    question: Une interface publique de ta bibliothèque doit gagner une nouvelle méthode. Quelles options ?
    answer: |-
      Ajouter une méthode abstraite casserait toutes les implémentations des utilisateurs. J'ajoute plutôt une méthode
      `default` avec un comportement raisonnable, documentée, que les implémentations peuvent redéfinir. Si aucun
      comportement par défaut n'a de sens, je crée une nouvelle interface qui étend l'ancienne. Une classe abstraite
      aurait permis d'ajouter une méthode concrète facilement, mais au prix de l'héritage unique : c'est pour cela que
      la JDK publie une interface et, à côté, un squelette abstrait.
  - key: scenario-hierarchie-paiement
    format: scenario
    question: Modélise des moyens de paiement (carte, virement, portefeuille) qui partagent un montant maximal et une devise.
    answer: |-
      Le type exposé est une interface `MoyenPaiement` (`payer(montant)`), éventuellement `sealed` si la liste est
      fermée, pour pouvoir écrire un `switch` exhaustif. L'état commun (plafond, devise, validation du montant) va dans
      une classe abstraite `MoyenPaiementBase` qui implémente l'interface, avec un constructeur qui valide et une
      méthode modèle `payer` qui vérifie le plafond avant d'appeler l'étape abstraite `executer`. Si un futur moyen ne
      partage pas cet état, il implémente directement l'interface.
