notion: abstraite-vs-interface
lesson: |-
  | | Classe abstraite | Interface |
  |---|---|---|
  | État (champs d'instance) | oui | non (seulement des constantes) |
  | Constructeur | oui | non |
  | Héritage | **une seule** par classe | **plusieurs** par classe |
  | Méthodes concrètes | oui, de toute visibilité | `default`, `static`, `private` (Java 8 et 9) |
  | Relation exprimée | « est un » entre classes apparentées | « sait faire » : une capacité, un contrat |

  ```java
  abstract class Document {                 // état commun à des classes apparentées
      private final String titre;
      protected Document(String titre) { this.titre = titre; }
      public String titre() { return titre; }
  }

  interface Exportable {                    // une capacité, que n'importe quelle classe peut avoir
      String exporter();
  }

  class Facture extends Document implements Exportable { ... }
  class Photo implements Exportable { ... }   // pas un Document, mais exportable
  ```

  Démarche : on part d'une **interface** (elle n'utilise pas l'unique droit d'héritage et se double facilement en
  test) ; on ajoute une **classe abstraite** quand plusieurs implémentations partagent un vrai **état** ou une
  initialisation. Les deux se combinent souvent : `List` (interface) et `AbstractList` (squelette d'implémentation).

  **Piège classique** : choisir la classe abstraite par habitude, puis découvrir qu'une classe qui étend déjà autre
  chose doit aussi remplir ce contrat. Avec une interface, c'était possible.

  **En entretien** : « Interface pour un contrat ou une capacité, classe abstraite pour partager un état entre classes
  apparentées ; et souvent les deux, l'interface comme type et la classe abstraite comme squelette. »
cards:
  - key: classe-abstraite-vs-interface
    format: course
    question: "Quelle est la différence essentielle entre une classe abstraite et une interface ?"
    choices:
      - {text: "L'abstraite porte état et code, en héritage simple ; l'interface est un contrat, implémentable en multiple", correct: true}
      - {text: "L'interface porte état et code, en héritage simple ; l'abstraite est un contrat, implémentable en multiple", correct: false}
      - {text: "L'abstraite ne contient aucun code ; l'interface peut porter des champs d'instance et un constructeur", correct: false}
      - {text: "Aucune depuis Java 8 : les méthodes `default` rendent les deux constructions strictement équivalentes", correct: false}
    answer: |-
      Une classe abstraite porte un **état** et du code partagé, mais une classe n'en étend qu'une ; une interface est un
      **contrat** transversal, et une classe peut en implémenter plusieurs. Les méthodes `default` n'ont pas donné d'état
      aux interfaces.
  - key: choix-par-defaut
    format: course
    question: "Entre une interface et une classe abstraite, que choisir par défaut, et pourquoi ?"
    choices:
      - {text: "L'interface : elle ne consomme pas l'unique héritage de classe et se remplace facilement en test", correct: true}
      - {text: "La classe abstraite : elle seule peut contenir des méthodes avec du code", correct: false}
      - {text: "La classe abstraite : ses appels de méthode sont plus rapides que ceux d'une interface", correct: false}
      - {text: "L'interface : elle seule permet de déclarer des champs `protected` partagés", correct: false}
    answer: |-
      Une interface : elle ne consomme pas l'unique héritage de classe, s'implémente par des classes sans lien et se
      remplace facilement par un double de test. Depuis Java 8, elle peut aussi porter du code (`default`).
  - key: squelette
    format: course
    question: "Qu'est-ce qu'une implémentation squelette, comme `AbstractList` ?"
    choices:
      - {text: "Une classe abstraite qui implémente l'essentiel d'une interface à partir de quelques méthodes abstraites", correct: true}
      - {text: "Une interface vide qui marque les classes capables d'être parcourues comme des listes", correct: false}
      - {text: "Une classe finale qui fournit l'implémentation unique et officielle d'une interface", correct: false}
      - {text: "Une classe générée par le compilateur pour chaque interface implémentée par une lambda", correct: false}
    answer: |-
      Une classe abstraite qui implémente l'essentiel d'une interface à partir de quelques méthodes abstraites, pour
      faciliter l'écriture d'implémentations, tandis que l'interface (`List`) reste le type utilisé.
  - key: quand-abstraite
    format: course
    question: "Quand une classe abstraite est-elle le bon choix ?"
    choices:
      - {text: "Quand des classes apparentées partagent des champs, un constructeur ou des méthodes `protected`", correct: true}
      - {text: "Quand des classes sans lien entre elles doivent partager une même capacité", correct: false}
      - {text: "Quand une même classe doit hériter de plusieurs types à la fois", correct: false}
      - {text: "Quand on veut remplacer facilement l'implémentation par un double de test", correct: false}
    answer: |-
      Quand des classes apparentées partagent un état (des champs), une initialisation (un constructeur) ou des méthodes
      `protected` non publiques. Une capacité partagée par des classes sans lien relève d'une interface.
  - key: vf-interface-constructeur
    format: true-false
    question: Une interface peut déclarer un constructeur.
    truth: false
    answer: Seules les classes, abstraites ou non, ont des constructeurs.
  - key: vf-combiner
    format: true-false
    question: Une classe peut étendre une classe abstraite et implémenter plusieurs interfaces.
    truth: true
    answer: "`class Facture extends Document implements Exportable, Comparable<Facture>` est valide."
  - key: vf-default-etat
    format: true-false
    question: Depuis les méthodes `default`, une interface peut tout faire comme une classe abstraite.
    truth: false
    answer: Elle n'a toujours ni état, ni constructeur, ni méthodes `protected`.
  - key: vf-classes-sans-lien
    format: true-false
    question: Une interface convient pour une capacité partagée par des classes sans lien entre elles.
    truth: true
    answer: Une photo et une facture peuvent toutes deux être `Exportable`.
  - key: qcm-choix-interface
    format: multiple-choice
    question: "Dans lequel de ces cas une interface est-elle le meilleur choix ?"
    choices:
      - {text: "Des classes sans lien doivent partager une capacité", correct: true}
      - {text: "Les implémentations doivent partager des champs initialisés par un constructeur", correct: false}
      - {text: "Les implémentations ont besoin de méthodes `protected` communes", correct: false}
      - {text: "Les implémentations doivent partager un état mutable commun", correct: false}
    answer: |-
      Une interface convient à une capacité transversale, implémentée par des classes sans lien. Des champs, un
      constructeur ou des méthodes `protected` partagés demandent une classe abstraite.
  - key: qcm-difference
    format: multiple-choice
    question: "Lesquels de ces éléments une classe abstraite peut-elle avoir, et une interface non ?"
    choices:
      - text: "Des champs d'instance"
        correct: true
      - text: "Un constructeur"
        correct: true
      - text: "Des méthodes avec du code"
        correct: false
      - text: "Des méthodes `static`"
        correct: false
    answer: Les interfaces ont du code (`default`, `static`, `private`), mais pas d'état.
  - key: qcm-jdk
    format: multiple-choice
    question: Quel couple de la JDK combine une interface et son squelette abstrait ?
    choices:
      - text: "`List` et `AbstractList`"
        correct: true
      - text: "`String` et `StringBuilder`"
        correct: false
      - text: "`Object` et `Class`"
        correct: false
      - text: "`Integer` et `Number`"
        correct: false
    answer: On type avec `List`, on implémente en étendant `AbstractList`.
  - key: qcm-heritage-pris
    format: multiple-choice
    question: "`Rapport` étend déjà `Document`. Il doit aussi être « planifiable ». Que doit être `Planifiable` ?"
    choices:
      - text: "Une interface"
        correct: true
      - text: "Une classe abstraite"
        correct: false
      - text: "Une classe concrète"
        correct: false
      - text: "Une enum"
        correct: false
    answer: '`Rapport` ne peut étendre qu''une classe : la capacité doit être une interface.'
  - key: decides-classe-abstraite-interface
    format: scenario
    question: "En entretien, on te demande comment tu décides entre classe abstraite et interface. Que réponds-tu ?"
    choices:
      - {text: "Interface par défaut pour un contrat ; classe abstraite si des classes apparentées partagent un état", correct: true}
      - {text: "Classe abstraite par défaut, car elle seule peut porter du code partagé entre les implémentations", correct: false}
      - {text: "Interface toujours : depuis Java 8, elle peut aussi porter des champs d'instance et un constructeur", correct: false}
      - {text: "Classe abstraite dès qu'une même classe doit remplir plusieurs contrats à la fois", correct: false}
    answer: |-
      Un **contrat** que des classes sans lien vont remplir appelle une interface, qui autorise l'implémentation
      multiple et ne consomme pas l'unique héritage. La classe abstraite reste pertinente quand des classes vraiment
      apparentées partagent un **état** à initialiser. Les méthodes `default` partagent du code, jamais un état.
  - key: scenario-repository
    format: scenario
    question: "Tu conçois l'accès aux données d'une application (commandes, clients). Interface ou classe abstraite ?"
    choices:
      - {text: "Une interface par agrégat, implémentée en PostgreSQL en production et en mémoire dans les tests", correct: true}
      - {text: "Une classe abstraite par agrégat, que le domaine étend pour y ajouter ses propres requêtes SQL", correct: false}
      - {text: "Une classe concrète par agrégat, qui utilise directement l'`EntityManager` depuis le domaine", correct: false}
      - {text: "Une seule classe abstraite générique pour tous les agrégats, exposée telle quelle au domaine", correct: false}
    answer: |-
      Une interface par agrégat (`DepotCommandes` avec `trouver`, `enregistrer`) : le domaine ne dépend que de ce
      contrat. Si plusieurs implémentations JPA partagent du code, une classe abstraite peut les aider **côté
      infrastructure**, sans jamais remonter dans le domaine.
  - key: scenario-evolution
    format: scenario
    question: "Une interface publique de ta bibliothèque doit gagner une nouvelle méthode. Que fais-tu ?"
    choices:
      - {text: "J'ajoute une méthode `default` au comportement raisonnable, que les implémentations peuvent redéfinir", correct: true}
      - {text: "J'ajoute une méthode abstraite : les utilisateurs n'auront qu'à l'implémenter dans leurs classes", correct: false}
      - {text: "Je transforme l'interface en classe abstraite pour y ajouter une méthode concrète", correct: false}
      - {text: "J'ajoute une méthode `static` dans l'interface, que chaque implémentation redéfinira", correct: false}
    answer: |-
      Une méthode abstraite casserait toutes les implémentations des utilisateurs : une méthode `default` documentée
      évite cela. Si aucun comportement par défaut n'a de sens, une nouvelle interface étend l'ancienne. Passer à une
      classe abstraite coûterait aux utilisateurs leur unique héritage.
  - key: scenario-hierarchie-paiement
    format: scenario
    question: |-
      Tu modélises des moyens de paiement (carte, virement, portefeuille) qui partagent un montant maximal et une devise.
      Quelle conception choisis-tu ?
    choices:
      - {text: "Une interface `MoyenPaiement`, et une classe abstraite qui l'implémente pour porter l'état commun", correct: true}
      - {text: "Une classe abstraite `MoyenPaiement` seule, que chaque moyen doit étendre, même sans cet état", correct: false}
      - {text: "Une interface `MoyenPaiement` avec des champs `plafond` et `devise` que chaque moyen remplit", correct: false}
      - {text: "Trois classes indépendantes qui recopient chacune la validation du plafond et de la devise", correct: false}
    answer: |-
      Le type exposé est une interface `MoyenPaiement` (éventuellement `sealed`, pour un `switch` exhaustif). L'état
      commun (plafond, devise, validation) va dans une classe abstraite `MoyenPaiementBase` qui l'implémente ; un futur
      moyen qui ne partage pas cet état implémente directement l'interface. Une interface ne peut pas porter de champs
      d'instance.
