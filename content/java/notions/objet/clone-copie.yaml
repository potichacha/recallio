notion: clone-copie
lesson: |-
  Copier un objet, c'est créer un objet distinct de même état. Deux profondeurs :

  - **copie superficielle** (*shallow*) : les champs sont recopiés, mais les objets qu'ils référencent sont
    **partagés** ;
  - **copie profonde** (*deep*) : les objets référencés sont eux aussi copiés, récursivement.

  ```java
  int[][] grille = {{1, 2}, {3, 4}};
  int[][] superficielle = grille.clone();       // nouveau tableau externe, mêmes lignes
  superficielle[0][0] = 9;                      // modifie aussi grille[0][0]

  class Equipe {
      private final List<String> membres;
      Equipe(Equipe autre) {                    // constructeur de copie
          this.membres = new ArrayList<>(autre.membres);   // copie de la liste
      }
  }
  ```

  - `Object.clone()` est `protected`, exige l'interface marqueur `Cloneable` (sinon `CloneNotSupportedException`),
    n'appelle aucun constructeur et fait une copie **superficielle**. Il faut le redéfinir avec soin et caster le
    résultat : on l'évite (*Effective Java*, item 13).
  - Exception : `tableau.clone()` est public, simple et correct pour un tableau de primitives ou d'objets immuables.
  - Alternatives : **constructeur de copie** (`new Equipe(autre)`), **fabrique** (`Equipe.copieDe(autre)`), et pour les
    collections `new ArrayList<>(liste)` ou `List.copyOf(liste)` (copie immuable).
  - Un objet **immuable** n'a pas besoin d'être copié : on le partage.

  **Piège classique** : croire que `new ArrayList<>(liste)` copie les éléments. Elle crée une nouvelle liste qui
  contient les **mêmes** objets ; s'ils sont mutables, les deux listes voient leurs modifications.

  **En entretien** : « Je préfère un constructeur de copie à `clone()`, et je décide explicitement de la profondeur ;
  les objets immuables, eux, se partagent. »
cards:
  - key: copie-superficielle-vs-profonde
    format: course
    question: Copie superficielle vs profonde ?
    answer: 'Superficielle : les références internes sont partagées ; profonde : les objets référencés sont aussi copiés.'
  - key: eviter-clone
    format: course
    question: Pourquoi éviter clone() ?
    answer: Pas d'appel de constructeur, copie superficielle, exception checked, cast ; on préfère un constructeur de copie.
  - key: clone-tableau
    format: course
    question: Peut-on utiliser `clone()` sur un tableau ?
    answer: "Oui : c'est public, sans exception vérifiée, et correct pour des primitives ou des objets immuables ; pour des objets mutables ou un tableau à plusieurs dimensions, la copie reste superficielle."
  - key: immuable-partage
    format: course
    question: Faut-il copier un objet immuable ?
    answer: "Non : personne ne peut le modifier, on peut le partager sans risque (c'est l'un des grands avantages de l'immuabilité)."
  - key: vf-clone-constructeur
    format: true-false
    question: "`Object.clone()` appelle le constructeur de la classe."
    truth: false
    answer: Il crée la copie sans passer par un constructeur, donc sans ses validations.
  - key: vf-new-arraylist
    format: true-false
    question: "`new ArrayList<>(liste)` copie aussi les objets contenus."
    truth: false
    answer: "C'est une copie superficielle : les deux listes partagent les mêmes éléments."
  - key: vf-cloneable
    format: true-false
    question: Sans `Cloneable`, `super.clone()` lève `CloneNotSupportedException`.
    truth: true
    answer: '`Object.clone()` vérifie l''interface marqueur.'
  - key: vf-copy-of
    format: true-false
    question: "`List.copyOf(liste)` renvoie une liste non modifiable."
    truth: true
    answer: Un `add` lève `UnsupportedOperationException` ; les éléments restent partagés.
  - key: qcm-alternatives
    format: multiple-choice
    question: Que préférer à `clone()` pour copier un objet ?
    choices:
      - text: "Un constructeur de copie"
        correct: true
      - text: "Une fabrique de copie"
        correct: true
      - text: "Une sérialisation puis désérialisation systématique"
        correct: false
      - text: "Une affectation `b = a`"
        correct: false
    answer: L'affectation copie la référence, pas l'objet.
  - key: qcm-superficielle
    format: multiple-choice
    question: "Après `int[][] h = g.clone();`, qu'est-ce qui est partagé entre `g` et `h` ?"
    choices:
      - text: "Les tableaux internes (les lignes)"
        correct: true
      - text: "Rien, tout est copié"
        correct: false
      - text: "Le tableau externe"
        correct: false
      - text: "Seulement la première ligne"
        correct: false
    answer: '`clone` copie le tableau externe, qui contient des références vers les mêmes lignes.'
  - key: qcm-profonde
    format: multiple-choice
    question: Comment copier en profondeur un `int[][]` ?
    choices:
      - text: "Copier chaque ligne : `Arrays.stream(g).map(int[]::clone).toArray(int[][]::new)`"
        correct: true
      - text: "`g.clone()`"
        correct: false
      - text: "`Arrays.copyOf(g, g.length)`"
        correct: false
      - text: "`int[][] h = g;`"
        correct: false
    answer: '`clone` et `copyOf` ne copient que le niveau externe.'
  - key: qcm-immuable
    format: multiple-choice
    question: Lequel de ces objets peut être partagé sans copie ?
    choices:
      - text: "Une `String`"
        correct: true
      - text: "Un `ArrayList`"
        correct: false
      - text: "Un `StringBuilder`"
        correct: false
      - text: "Un `java.util.Date`"
        correct: false
    answer: '`String` est immuable ; les autres peuvent être modifiés.'
  - key: code-clone-tableau
    format: code-output
    question: |-
      ```java
      int[] a = {1, 2};
      int[] b = a.clone();
      b[0] = 9;
      System.out.println(a[0] + " " + b[0]);
      ```
    answer: '`1 9` : pour des primitives, `clone` d''un tableau donne une copie indépendante.'
    check:
      output: "1 9"
  - key: code-clone-2d
    format: code-output
    question: |-
      ```java
      int[][] g = {{1}, {2}};
      int[][] h = g.clone();
      h[0][0] = 9;
      h[1] = new int[]{5};
      System.out.println(g[0][0] + " " + g[1][0]);
      ```
    answer: '`9 2` : les lignes sont partagées, mais remplacer une ligne de `h` ne touche pas `g`.'
    check:
      output: "9 2"
  - key: code-constructeur-partage
    format: code-output
    question: |-
      ```java
      class Equipe {
          final List<String> membres;
          Equipe(List<String> m) { membres = m; }
          Equipe(Equipe autre) { membres = autre.membres; }
      }
      Equipe a = new Equipe(new ArrayList<>(List.of("Ada")));
      Equipe b = new Equipe(a);
      b.membres.add("Bob");
      System.out.println(a.membres);
      ```
    answer: '`[Ada, Bob]` : le constructeur de copie partage la liste au lieu de la copier.'
    check:
      output: "[Ada, Bob]"
  - key: code-liste-superficielle
    format: code-output
    question: |-
      ```java
      List<StringBuilder> l = new ArrayList<>(List.of(new StringBuilder("a")));
      List<StringBuilder> copie = new ArrayList<>(l);
      copie.get(0).append("b");
      copie.add(new StringBuilder("c"));
      System.out.println(l);
      ```
    answer: '`[ab]` : la liste est copiée, pas ses éléments mutables.'
    check:
      output: "[ab]"
  - key: bug-clone-superficiel
    format: bug-fix
    question: |-
      Modifier la copie d'une commande modifie aussi l'originale :
      ```java
      class Commande implements Cloneable {
          private List<Ligne> lignes = new ArrayList<>();
          @Override public Commande clone() throws CloneNotSupportedException {
              return (Commande) super.clone();
          }
      }
      ```
    answer: |-
      ```java
      class Commande {
          private final List<Ligne> lignes;
          Commande(Commande autre) {
              this.lignes = new ArrayList<>(autre.lignes);   // Ligne est immuable
          }
      }
      ```
      `super.clone()` copie la référence de la liste : les deux commandes partagent la même. Le constructeur de copie
      crée une nouvelle liste (et copierait aussi les lignes si elles étaient mutables).
  - key: bug-constructeur-copie-partage
    format: bug-fix
    question: |-
      Le planning copié pour la semaine suivante modifie aussi le planning original :
      ```java
      Planning(Planning autre) {
          this.creneaux = autre.creneaux;   // List<Creneau>, Creneau mutable
      }
      ```
    answer: |-
      ```java
      Planning(Planning autre) {
          this.creneaux = autre.creneaux.stream()
                  .map(Creneau::new)        // constructeur de copie de Creneau
                  .collect(Collectors.toCollection(ArrayList::new));
      }
      ```
      Il fallait une copie profonde : une nouvelle liste **et** de nouveaux créneaux, puisqu'ils sont mutables. (Rendre
      `Creneau` immuable dispenserait de les copier.)
  - key: bug-grille-clone
    format: bug-fix
    question: |-
      Annuler un coup ne restaure pas la grille de jeu sauvegardée :
      ```java
      int[][] sauvegarde = grille.clone();
      jouer(grille);
      grille = sauvegarde;
      ```
    answer: |-
      ```java
      int[][] sauvegarde = Arrays.stream(grille).map(int[]::clone).toArray(int[][]::new);
      ```
      `clone` sur un tableau à deux dimensions ne copie que le tableau externe : les lignes, modifiées par `jouer`,
      sont partagées. On copie chaque ligne.
  - key: bug-copie-inutile
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      String copieNom = new String(client.nom());
      LocalDate copieDate = LocalDate.of(d.getYear(), d.getMonth(), d.getDayOfMonth());
      ```
    answer: |-
      ```java
      String nom = client.nom();
      LocalDate date = d;
      ```
      `String` et `LocalDate` sont immuables : les copier ne protège de rien et alloue pour rien. On partage les objets
      immuables.
