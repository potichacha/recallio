notion: tostring
lesson: |-
  `toString()` donne une **représentation textuelle** d'un objet, destinée aux humains : journaux, débogage, messages
  d'erreur. Elle est appelée implicitement par la concaténation (`"x = " + objet`) et par `System.out.println(objet)`.

  ```java
  class Produit {
      private final String nom;
      private final double prix;

      @Override
      public String toString() {
          return "Produit[nom=" + nom + ", prix=" + prix + "]";
      }
  }

  record Point(int x, int y) { }
  new Point(1, 2).toString();    // "Point[x=1, y=2]" : généré pour les records
  ```

  - Sans redéfinition : `getClass().getName() + "@" + Integer.toHexString(hashCode())`, par exemple
    `com.app.Produit@1b6d3586`. Peu utile.
  - Les collections affichent leurs éléments (`[a, b]`, `{cle=valeur}`) en appelant leur `toString`.
  - Les **tableaux** ne la redéfinissent pas : `[I@6d06d69c`. On utilise `Arrays.toString` ou `Arrays.deepToString`.
  - `String.valueOf(null)` (sur un `Object`) et la concaténation écrivent `null` sans exception ; `objet.toString()`
    sur une référence nulle lève une `NullPointerException`.
  - Ne jamais y mettre de **données sensibles** (mot de passe, jeton, numéro de carte) : elles finissent dans les
    journaux.

  **Piège classique** : analyser le résultat de `toString()` pour en extraire une valeur. Son format n'est pas un
  contrat : on expose un accesseur.

  **En entretien** : « Je redéfinis `toString` pour le débogage et les journaux, sans données sensibles et sans jamais
  le parser ; les records le génèrent. »
tour:
  - title: toString
    text: |-
      `toString()` donne la représentation textuelle d'un objet : c'est elle qu'utilisent `IO.println`, la concaténation
      avec une chaîne et les débogueurs. Celle d'`Object` affiche le nom de la classe et un code de hachage, comme
      `Point@1b6d3586` : peu lisible.

      On la redéfinit pour montrer l'état utile de l'objet. Les records en ont une toute faite, qui liste leurs
      composants.
    example:
      files:
        Main.java: |-
          class Point {
              final int x;
              final int y;

              Point(int x, int y) {
                  this.x = x;
                  this.y = y;
              }

              @Override
              public String toString() {
                  return "(" + x + ", " + y + ")";
              }
          }

          class Brut {}

          record Couleur(int rouge, int vert, int bleu) {}

          void main() {
              IO.println(new Point(1, 2));
              IO.println("point : " + new Point(3, 4));
              IO.println(new Couleur(255, 128, 0));
              IO.println(new Brut().toString().startsWith("Main$Brut@"));
          }
      output: |-
        (1, 2)
        point : (3, 4)
        Couleur[rouge=255, vert=128, bleu=0]
        true
    task:
      instructions: |-
        Donne à `Temperature` une méthode `toString`, pour que le programme affiche `21.5 °C`.
      starter:
        Main.java: |-
          class Temperature {
              final double degres;

              Temperature(double degres) {
                  this.degres = degres;
              }
          }

          void main() {
              IO.println(new Temperature(21.5).toString().startsWith("Main$Temperature@"));
          }
      solution:
        Main.java: |-
          class Temperature {
              final double degres;

              Temperature(double degres) {
                  this.degres = degres;
              }

              @Override
              public String toString() {
                  return degres + " °C";
              }
          }

          void main() {
              IO.println(new Temperature(21.5));
          }
      output: |-
        21.5 °C
cards:
  - key: renvoie-tostring-defaut
    format: course
    question: "Que renvoie `toString()` par défaut, quand la classe ne le redéfinit pas ?"
    choices:
      - {text: "Le nom de la classe, `@`, puis le `hashCode` en hexadécimal", correct: true}
      - {text: "La liste des champs et de leurs valeurs, comme un record", correct: false}
      - {text: "Une chaîne vide, tant que la méthode n'est pas redéfinie", correct: false}
      - {text: "L'adresse mémoire exacte de l'objet, écrite en décimal", correct: false}
    answer: "Le nom de la classe, `@`, puis le hash en hexadécimal (`Produit@1b6d3586`). Seuls les records génèrent un `toString` qui affiche leurs composants."
  - key: appel-implicite
    format: course
    question: Quand `toString()` est-elle appelée implicitement ?
    choices:
      - {text: "Lors d'une concaténation avec une `String`, ou par `println(objet)`", correct: true}
      - {text: "À chaque affectation de l'objet à une variable de type `String`", correct: false}
      - {text: "Lors de chaque comparaison de l'objet avec `equals`", correct: false}
      - {text: "Quand le ramasse-miettes libère la mémoire de l'objet", correct: false}
    answer: Lors d'une concaténation avec une `String`, par `System.out.println(objet)`, `String.valueOf(objet)`, et par le `toString` des collections pour chaque élément.
  - key: donnees-sensibles
    format: course
    question: Que ne faut-il jamais mettre dans un `toString()` ?
    choices:
      - {text: "Des données sensibles (mot de passe, jeton), qui finissent dans les journaux", correct: true}
      - {text: "Des appels à d'autres méthodes de l'objet, interdits dans `toString`", correct: false}
      - {text: "Des champs `private`, invisibles en dehors de la classe", correct: false}
      - {text: "Des nombres décimaux, que `toString` ne sait pas formater", correct: false}
    answer: "Des données sensibles (mot de passe, jeton, données personnelles) : la méthode finit dans les journaux et les messages d'erreur."
  - key: tableaux
    format: course
    question: "Quelle méthode affiche les éléments d'un tableau d'`int`, plutôt que `[I@...` ?"
    choices:
      - {text: "`Arrays.toString(t)`, qui parcourt les éléments", correct: true}
      - {text: "`t.toString()`, que chaque tableau redéfinit", correct: false}
      - {text: "`String.valueOf(t)`, qui convertit chaque élément", correct: false}
      - {text: "`List.of(t).toString()`, qui affiche chaque `int`", correct: false}
    answer: "`Arrays.toString(t)`, ou `Arrays.deepToString(t)` pour un tableau de tableaux. Un tableau ne redéfinit pas `toString` : `t.toString()` donne seulement `[I@...`."
  - key: vf-record
    format: true-false
    question: Un record génère automatiquement un `toString()` qui affiche ses composants.
    truth: true
    answer: Par exemple `Point[x=1, y=2]`.
  - key: vf-contrat
    format: true-false
    question: On peut s'appuyer sur le format de `toString()` pour retrouver les valeurs d'un objet.
    truth: false
    answer: Ce format n'est pas un contrat ; on expose des accesseurs.
  - key: vf-concat-null
    format: true-false
    question: "`\"valeur : \" + objet` lève une `NullPointerException` si `objet` vaut `null`."
    truth: false
    answer: La concaténation écrit `null`.
  - key: vf-collections
    format: true-false
    question: "`List.of(a, b).toString()` utilise le `toString()` de `a` et de `b`."
    truth: true
    answer: Les collections affichent chaque élément avec son propre `toString`.
  - key: qcm-defaut
    format: multiple-choice
    question: "Que peut afficher `System.out.println(new Produit())` si `Produit` ne redéfinit pas `toString` ?"
    choices:
      - text: "`com.app.Produit@1b6d3586`"
        correct: true
      - text: "Les valeurs de ses champs"
        correct: false
      - text: "`Produit`"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
    answer: Le nom complet de la classe, `@`, et le hash en hexadécimal.
  - key: qcm-tableau
    format: multiple-choice
    question: "Comment afficher `[1, 2, 3]` pour `int[] t = {1, 2, 3};` ?"
    choices:
      - text: "`Arrays.toString(t)`"
        correct: true
      - text: "`t.toString()`"
        correct: false
      - text: "`String.valueOf(t)`"
        correct: false
      - text: "`List.of(t).toString()`"
        correct: false
    answer: '`List.of(t)` créerait une liste contenant un seul élément, le tableau.'
  - key: qcm-null
    format: multiple-choice
    question: "Avec `Object o = null;`, laquelle de ces expressions lève une `NullPointerException` ?"
    choices:
      - {text: "`System.out.println(o)`", correct: false}
      - {text: "`String.valueOf(o)`", correct: false}
      - {text: "`o.toString()`", correct: true}
      - {text: "`\"valeur : \" + o`", correct: false}
    answer: "Appeler une méthode sur `null` lève une `NullPointerException` ; `println`, `String.valueOf` et la concaténation écrivent simplement `null`."
  - key: qcm-bon-tostring
    format: multiple-choice
    question: Que mettre dans le `toString()` d'une classe `Utilisateur` ?
    choices:
      - text: "Son identifiant et son nom d'affichage"
        correct: true
      - text: "Son mot de passe haché"
        correct: false
      - text: "Son jeton d'accès"
        correct: false
      - text: "Son numéro de carte bancaire"
        correct: false
    answer: Ce qui aide au débogage, sans donnée sensible.
  - key: trous-override
    format: fill-in
    question: |-
      Complète la redéfinition :
      ```java
      @Override
      public String ___() {
          return "Point(" + x + ", " + y + ")";
      }
      ```
    blanks: [[toString]]
    answer: La signature exacte est `public String toString()`.
  - key: trous-arrays
    format: fill-in
    question: |-
      Complète pour afficher `[3, 1, 2]` :
      ```java
      int[] t = {3, 1, 2};
      System.out.println(Arrays.___(t));
      ```
    blanks: [[toString]]
    answer: '`Arrays.toString` affiche les éléments d''un tableau.'
  - key: trous-deep
    format: fill-in
    question: |-
      Complète pour afficher `[[1, 2], [3]]` :
      ```java
      int[][] grille = {{1, 2}, {3}};
      System.out.println(Arrays.___(grille));
      ```
    blanks: [[deepToString]]
    answer: '`Arrays.toString` afficherait les adresses des tableaux internes.'
  - key: trous-nom-simple
    format: fill-in
    question: |-
      Complète pour afficher le nom court de la classe, sans le package :
      ```java
      return getClass().___() + "[id=" + id + "]";
      ```
    blanks: [[getSimpleName]]
    answer: '`getName()` donnerait le nom complet, avec le package.'
  - key: code-record
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Point(int x, int y) { }
      System.out.println(new Point(1, 2));
      ```
    choices:
      - {text: "`Point[x=1, y=2]`", correct: true}
      - {text: "`Point(1, 2)`", correct: false}
      - {text: "`Point@1b6d3586`", correct: false}
      - {text: "`Point{x=1, y=2}`", correct: false}
    answer: '`Point[x=1, y=2]` : le `toString` généré du record.'
    check:
      output: "Point[x=1, y=2]"
  - key: code-tableau
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] t = {1, 2};
      System.out.println(Arrays.toString(t) + " " + t.toString().startsWith("[I@"));
      ```
    choices:
      - {text: "`[1, 2] true`", correct: true}
      - {text: "`[1, 2] false`", correct: false}
      - {text: "`[I@1b6d3586 true`", correct: false}
      - {text: "`{1, 2} true`", correct: false}
    answer: '`[1, 2] true` : le `toString` d''un tableau d''`int` commence par `[I@`.'
    check:
      output: "[1, 2] true"
  - key: code-concatenation
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Produit {
          String nom = "stylo";
          double prix = 1.5;
          @Override public String toString() { return nom + " (" + prix + " €)"; }
      }
      System.out.println("Article : " + new Produit());
      ```
    choices:
      - {text: "`Article : stylo (1.5 €)`", correct: true}
      - {text: "`Article : Produit@1b6d3586`", correct: false}
      - {text: "`Article : stylo (1,5 €)`", correct: false}
      - {text: "`Article : stylo 1.5`", correct: false}
    answer: '`Article : stylo (1.5 €)` : la concaténation appelle `toString`.'
    check:
      output: "Article : stylo (1.5 €)"
  - key: code-liste
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Point(int x, int y) { }
      System.out.println(List.of(new Point(1, 2), new Point(3, 4)));
      ```
    choices:
      - {text: "`[Point[x=1, y=2], Point[x=3, y=4]]`", correct: true}
      - {text: "`[Point@1b6d3586, Point@4554617c]`", correct: false}
      - {text: "`[Point(1, 2), Point(3, 4)]`", correct: false}
      - {text: "`List[Point[x=1, y=2], Point[x=3, y=4]]`", correct: false}
    answer: '`[Point[x=1, y=2], Point[x=3, y=4]]` : la liste appelle le `toString` de chaque élément.'
    check:
      output: "[Point[x=1, y=2], Point[x=3, y=4]]"
  - key: bug-tableau-journal
    format: bug-fix
    question: |-
      Le journal affiche `Notes : [D@7a81197d` :
      ```java
      log.info("Notes : " + notes);   // double[] notes
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Journaliser `Arrays.toString(notes)`, qui affiche les éléments", correct: true}
      - {text: "Journaliser `notes.toString()`, qui appelle le `toString` des éléments", correct: false}
      - {text: "Caster `notes` en `Object` avant de le concaténer au message", correct: false}
      - {text: "Journaliser `String.valueOf(notes)` au lieu de concaténer", correct: false}
    answer: |-
      ```java
      log.info("Notes : {}", Arrays.toString(notes));
      ```
      Un tableau ne redéfinit pas `toString` : `Arrays.toString` affiche ses éléments. (Le message paramétré évite
      aussi de construire la chaîne si le niveau est désactivé.)
  - key: bug-mot-de-passe
    format: bug-fix
    question: |-
      Des mots de passe apparaissent dans les journaux d'erreur :
      ```java
      record Identifiants(String login, String motDePasse) { }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Redéfinir le `toString` du record pour masquer le mot de passe", correct: true}
      - {text: "Déclarer le composant `motDePasse` `private` dans le record", correct: false}
      - {text: "Marquer `motDePasse` `transient` pour l'exclure du `toString`", correct: false}
      - {text: "Passer le niveau des journaux d'erreur à `DEBUG`", correct: false}
    answer: |-
      ```java
      record Identifiants(String login, String motDePasse) {
          @Override
          public String toString() {
              return "Identifiants[login=" + login + ", motDePasse=****]";
          }
      }
      ```
      Le `toString` généré d'un record affiche tous ses composants. On le redéfinit pour masquer les données
      sensibles.
  - key: bug-faute-signature
    format: bug-fix
    question: |-
      `System.out.println(produit)` affiche toujours `Produit@1b6d3586` :
      ```java
      public String tostring() {
          return nom + " " + prix;
      }
      ```
      Pourquoi ?
    choices:
      - {text: "`tostring` en minuscule est une autre méthode : `toString` reste celle d'`Object`", correct: true}
      - {text: "`toString` doit être `static` pour que `println` puisse l'appeler", correct: false}
      - {text: "`println` n'appelle `toString` que pour les records et les enums", correct: false}
      - {text: "La concaténation de `nom` et de `prix` échoue en silence", correct: false}
    answer: |-
      ```java
      @Override
      public String toString() {
          return nom + " " + prix;
      }
      ```
      `tostring` (minuscule) est une autre méthode ; `@Override` aurait signalé la faute à la compilation.
  - key: bug-parser-tostring
    format: bug-fix
    question: |-
      Ce code casse dès que le format d'affichage d'une commande change :
      ```java
      String id = commande.toString().split("id=")[1].split(",")[0];
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Lire l'identifiant par un accesseur, `commande.id()`", correct: true}
      - {text: "Découper la chaîne avec une expression régulière plus robuste", correct: false}
      - {text: "Figer le format de `toString` par un test, pour qu'il ne change plus", correct: false}
      - {text: "Passer par `String.valueOf(commande)` au lieu de `toString()`", correct: false}
    answer: |-
      ```java
      String id = commande.id();
      ```
      `toString` sert à l'affichage, son format n'est pas un contrat. On expose la valeur par un accesseur.
