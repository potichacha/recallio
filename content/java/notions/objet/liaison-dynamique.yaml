notion: liaison-dynamique
lesson: |-
  La **liaison dynamique** (*dynamic dispatch*, appel virtuel) est le mécanisme qui réalise le polymorphisme : pour un
  appel `objet.methode()`, la JVM choisit **à l'exécution** l'implémentation de la classe **réelle** de l'objet, en
  remontant la hiérarchie jusqu'à la première version trouvée.

  ```java
  class A {
      String qui() { return "A"; }
      String dire() { return "je suis " + qui(); }   // appel virtuel, même depuis A
  }
  class B extends A { @Override String qui() { return "B"; } }
  class C extends B { }                              // hérite de B.qui()

  A x = new C();
  x.dire();   // "je suis B"
  ```

  Ce qui est lié **à la compilation** (liaison statique), selon le type déclaré :
  - le choix de la **surcharge** (la signature) ;
  - les méthodes `static`, `private` et les appels `super.m()` ;
  - l'accès aux **champs**.

  Les méthodes `final` ne peuvent pas être redéfinies : il n'y a qu'une version, que le JIT peut appeler directement.
  Les méthodes d'instance sont virtuelles **par défaut** en Java (contrairement au C++, où il faut `virtual`).

  **Piège classique** : croire qu'un appel fait **depuis** une méthode du parent utilise la version du parent. Dans
  `dire()`, `qui()` est un appel sur `this`, donc virtuel : la version de l'objet réel.

  **En entretien** : « En Java, les méthodes d'instance sont virtuelles par défaut : la JVM choisit la version du type
  réel ; seuls les `static`, `private`, `final`, `super` et la surcharge sont liés à la compilation. »
cards:
  - key: liaison-statique-vs-dynamique
    format: course
    question: Liaison statique vs dynamique ?
    answer: Résolue à la compilation (surcharge, static, private, final) vs à l'exécution (redéfinition).
  - key: recherche-methode
    format: course
    question: Comment la JVM trouve-t-elle la méthode à exécuter pour `x.m()` ?
    answer: Elle part de la classe réelle de l'objet et remonte la hiérarchie jusqu'à la première classe qui définit `m` avec cette signature.
  - key: virtuel-par-defaut
    format: course
    question: En Java, faut-il marquer une méthode pour qu'elle soit virtuelle ?
    answer: "Non : toute méthode d'instance non `private`, non `final` et non `static` est virtuelle par défaut (en C++, il faut `virtual`)."
  - key: appel-depuis-parent
    format: course
    question: Si une méthode du parent appelle `qui()`, quelle version s'exécute sur un objet de la sous-classe ?
    answer: "Celle de la sous-classe : l'appel se fait sur `this`, dont le type réel est la sous-classe."
  - key: vf-champs-dynamiques
    format: true-false
    question: L'accès à un champ est résolu à l'exécution selon le type réel.
    truth: false
    answer: Les champs sont résolus à la compilation, selon le type déclaré.
  - key: vf-super-statique
    format: true-false
    question: "`super.m()` appelle toujours la version du parent direct, quel que soit l'objet."
    truth: true
    answer: Un appel `super` est lié statiquement.
  - key: vf-heritee
    format: true-false
    question: Si `C` étend `B` sans redéfinir `m()`, un appel `m()` sur un `C` exécute la version de `B`.
    truth: true
    answer: La recherche remonte jusqu'à la première version trouvée.
  - key: vf-depuis-parent
    format: true-false
    question: Un appel de méthode écrit dans le code du parent exécute toujours la version du parent.
    truth: false
    answer: Il exécute la version de l'objet réel, sauf pour les méthodes `private`, `static` ou `final`.
  - key: qcm-dynamique
    format: multiple-choice
    question: Lesquels de ces appels sont résolus à l'exécution ?
    choices:
      - text: "Un appel à une méthode d'instance redéfinie"
        correct: true
      - text: "Un appel à une méthode `static`"
        correct: false
      - text: "Un appel à une méthode `private`"
        correct: false
      - text: "Un appel `super.m()`"
        correct: false
    answer: Seule la redéfinition passe par la liaison dynamique.
  - key: qcm-version
    format: multiple-choice
    question: "`A` définit `m()`, `B extends A` la redéfinit, `C extends B` ne la redéfinit pas. Avec `A x = new C();`, quelle version exécute `x.m()` ?"
    choices:
      - text: "Celle de `B`"
        correct: true
      - text: "Celle de `A`"
        correct: false
      - text: "Celle de `C`, qui n'existe pas, donc erreur"
        correct: false
      - text: "Aucune, `x` est un `A`"
        correct: false
    answer: "La JVM part de `C` et remonte : la première version trouvée est celle de `B`."
  - key: qcm-compilation
    format: multiple-choice
    question: Qu'est-ce que le compilateur fige, même pour un appel virtuel ?
    choices:
      - text: "La signature de la méthode appelée (choix de la surcharge)"
        correct: true
      - text: "La classe dont la version sera exécutée"
        correct: false
      - text: "Le type réel de l'objet"
        correct: false
      - text: "Le nombre de sous-classes"
        correct: false
    answer: La signature est choisie à la compilation ; l'implémentation à l'exécution.
  - key: qcm-cpp
    format: multiple-choice
    question: Que faut-il écrire en Java pour qu'une méthode d'instance soit virtuelle ?
    choices:
      - text: "Rien, c'est le comportement par défaut"
        correct: true
      - text: "`virtual`"
        correct: false
      - text: "`@Virtual`"
        correct: false
      - text: "`abstract`, obligatoirement"
        correct: false
    answer: Au contraire, `final` empêche la redéfinition.
  - key: code-recherche
    format: code-output
    question: |-
      ```java
      class A {
          String qui() { return "A"; }
          String dire() { return "je suis " + qui(); }
      }
      class B extends A { String qui() { return "B"; } }
      class C extends B { }
      A x = new C();
      System.out.println(x.dire());
      ```
    answer: '`je suis B` : `dire()` appelle `qui()` sur `this`, un `C`, qui hérite de la version de `B`.'
    check:
      output: "je suis B"
  - key: code-chaine-super
    format: code-output
    question: |-
      ```java
      class A { String m() { return "A"; } }
      class B extends A { String m() { return "B" + super.m(); } }
      class C extends B { String m() { return "C" + super.m(); } }
      A x = new C();
      System.out.println(x.m());
      ```
    answer: '`CBA` : l''appel virtuel choisit `C.m()`, puis chaque `super.m()` remonte d''un niveau.'
    check:
      output: "CBA"
  - key: code-static-instance
    format: code-output
    question: |-
      ```java
      class A {
          static String s() { return "As"; }
          String i() { return "Ai"; }
      }
      class B extends A {
          static String s() { return "Bs"; }
          String i() { return "Bi"; }
      }
      A x = new B();
      System.out.println(x.s() + " " + x.i());
      ```
    answer: '`As Bi` : la méthode `static` suit le type déclaré, la méthode d''instance le type réel.'
    check:
      output: "As Bi"
  - key: code-final-appel-virtuel
    format: code-output
    question: |-
      ```java
      class A {
          final String f() { return "A.f " + g(); }
          String g() { return "A.g"; }
      }
      class B extends A { String g() { return "B.g"; } }
      System.out.println(new B().f());
      ```
    answer: '`A.f B.g` : `f` ne peut pas être redéfinie, mais l''appel à `g` qu''elle contient reste virtuel.'
    check:
      output: "A.f B.g"
  - key: bug-appel-depuis-parent
    format: bug-fix
    question: |-
      Le journal du parent affiche le montant remisé au lieu du montant brut :
      ```java
      class Commande {
          double montant() { return brut; }
          void journaliser() { log.info("brut : {}", montant()); }
      }
      class CommandeRemisee extends Commande {
          @Override double montant() { return super.montant() * 0.9; }
      }
      ```
    answer: |-
      ```java
      class Commande {
          double montant() { return brut; }
          private double montantBrut() { return brut; }
          void journaliser() { log.info("brut : {}", montantBrut()); }
      }
      ```
      `montant()` est virtuel : depuis le parent, c'est la version remisée qui s'exécute. Quand on veut vraiment la
      valeur du parent, on passe par une méthode `private` (ou on lit le champ).
  - key: bug-methode-sensible
    format: bug-fix
    question: |-
      Une sous-classe a contourné la vérification des droits en redéfinissant `verifierDroits()` :
      ```java
      class Service {
          void executer(Requete r) { verifierDroits(r); traiter(r); }
          protected void verifierDroits(Requete r) { ... }
          protected void traiter(Requete r) { ... }
      }
      ```
    answer: |-
      ```java
      class Service {
          final void executer(Requete r) { verifierDroits(r); traiter(r); }
          private void verifierDroits(Requete r) { ... }
          protected void traiter(Requete r) { ... }
      }
      ```
      Une méthode redéfinissable est un point d'extension. La vérification devient `private` (et `executer` `final`) :
      seules les parties prévues restent redéfinissables.
  - key: bug-static-polymorphe
    format: bug-fix
    question: |-
      Le calcul de remise des clients premium n'est jamais appliqué :
      ```java
      class Client { static double remise() { return 0; } }
      class ClientPremium extends Client { static double remise() { return 0.1; } }

      double appliquer(Client c, double prix) { return prix * (1 - c.remise()); }
      ```
    answer: |-
      ```java
      class Client { double remise() { return 0; } }
      class ClientPremium extends Client {
          @Override double remise() { return 0.1; }
      }
      ```
      Les méthodes `static` sont liées à la compilation, sur le type déclaré `Client`. Pour un choix selon l'objet, il
      faut une méthode d'instance.
  - key: bug-champ-dynamique
    format: bug-fix
    question: |-
      Le taux affiché vaut toujours celui du parent :
      ```java
      class Compte { double taux = 0.01; }
      class Livret extends Compte { double taux = 0.03; }

      Compte c = new Livret();
      System.out.println(c.taux);   // 0.01
      ```
    answer: |-
      ```java
      class Compte { double taux() { return 0.01; } }
      class Livret extends Compte {
          @Override double taux() { return 0.03; }
      }
      ```
      Les champs ne sont pas virtuels : `c.taux` lit celui du type déclaré. Une méthode redéfinie donne le
      comportement polymorphe attendu.
