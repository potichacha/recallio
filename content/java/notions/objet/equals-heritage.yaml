notion: equals-heritage
lesson: |-
  Un `equals` correct devient difficile dès qu'une **sous-classe ajoute un champ** à l'égalité. Exemple classique :
  `Point(x)` et `PointCouleur(x, couleur)`.

  - Avec **`instanceof`** dans les deux classes, la **symétrie** casse : `point.equals(pointRouge)` est vrai (le point
    ne regarde que `x`), mais `pointRouge.equals(point)` est faux (un `Point` n'est pas un `PointCouleur`).
  - Si `PointCouleur` ignore la couleur face à un simple `Point`, c'est la **transitivité** qui casse : rouge = point,
    point = bleu, mais rouge ≠ bleu.
  - Avec **`getClass()`**, le contrat est respecté, mais une sous-classe **sans nouveau champ** n'est plus jamais égale
    à son parent, ce qui viole la substitution de Liskov (un `PointNomme(1)` n'égale pas `Point(1)`).

  ```java
  // la solution qui respecte tout : la composition
  record Point(int x, int y) { }
  record PointCouleur(Point point, Couleur couleur) { }   // contient un point, n'en est pas un
  ```

  Conclusion (*Effective Java*, item 10) : on ne peut pas étendre une classe instanciable en ajoutant un champ à
  l'égalité tout en gardant le contrat. Les remèdes :
  - préférer la **composition** et une vue (`pointCouleur.point()`) ;
  - déclarer les classes de valeur **`final`**, ou en faire des **records** ;
  - n'utiliser `instanceof` que si la classe est `final` ou si l'`equals` est lui-même `final` et défini une fois pour
    toute la hiérarchie (les sous-classes n'ajoutent rien à l'égalité).

  **Piège classique** : `java.sql.Timestamp` étend `java.util.Date` et ajoute les nanosecondes à l'égalité : mélanger
  les deux dans une collection donne des résultats asymétriques.

  **En entretien** : « `instanceof` peut casser la symétrie, `getClass` casse la substitution ; pour ajouter un champ à
  l'égalité, je compose au lieu d'hériter. »
cards:
  - key: getclass-instanceof-equals
    format: course
    question: '`getClass()` ou `instanceof` dans equals ?'
    answer: getClass garantit la symétrie entre classe et sous-classe ; instanceof est plus souple mais peut casser la symétrie si une sous-classe ajoute des champs.
  - key: probleme
    format: course
    question: Pourquoi une sous-classe qui ajoute un champ à `equals` pose-t-elle problème ?
    answer: Elle ne peut pas comparer ce champ à un objet du parent qui ne l'a pas sans casser soit la symétrie, soit la transitivité du contrat.
  - key: liskov-getclass
    format: course
    question: Quel défaut a un `equals` basé sur `getClass()` ?
    answer: "Une sous-classe, même sans nouveau champ, n'est jamais égale à un objet du parent de même état : elle n'est plus substituable (principe de Liskov)."
  - key: solution
    format: course
    question: Comment ajouter un champ à l'égalité sans casser le contrat ?
    answer: "Par composition : la nouvelle classe **contient** un objet de l'ancienne au lieu d'en hériter (et l'expose par une méthode de vue)."
  - key: vf-instanceof-symetrie
    format: true-false
    question: Si `Point` et `PointCouleur extends Point` utilisent tous deux `instanceof` dans `equals`, la symétrie peut être cassée.
    truth: true
    answer: Le point accepte le point coloré, mais le point coloré refuse le simple point.
  - key: vf-getclass-liskov
    format: true-false
    question: Avec un `equals` basé sur `getClass()`, un objet d'une sous-classe peut être égal à un objet du parent.
    truth: false
    answer: Les classes doivent être exactement les mêmes.
  - key: vf-record
    format: true-false
    question: Un record ne peut pas être étendu, ce qui évite ce problème.
    truth: true
    answer: Les records sont implicitement `final`.
  - key: vf-solution-heritage
    format: true-false
    question: Il existe une façon d'étendre une classe instanciable en ajoutant un champ à l'égalité qui respecte tout le contrat et la substitution.
    truth: false
    answer: "C'est impossible (*Effective Java*, item 10) : on compose."
  - key: qcm-casse
    format: multiple-choice
    question: "`PointCouleur` ignore la couleur face à un `Point`, mais la compare face à un autre `PointCouleur`. Quelle propriété casse ?"
    choices:
      - text: "La transitivité"
        correct: true
      - text: "La réflexivité"
        correct: false
      - text: "La cohérence"
        correct: false
      - text: "`equals(null)` faux"
        correct: false
    answer: Rouge égale le point, le point égale bleu, mais rouge n'égale pas bleu.
  - key: qcm-remedes
    format: multiple-choice
    question: Quelles solutions évitent le problème ?
    choices:
      - text: "Composer au lieu d'hériter"
        correct: true
      - text: "Déclarer la classe de valeur `final` ou en faire un record"
        correct: true
      - text: "Comparer les `toString()`"
        correct: false
      - text: "Ne pas redéfinir `hashCode`"
        correct: false
    answer: Sans héritage qui ajoute des champs, le contrat se respecte simplement.
  - key: qcm-instanceof-sur
    format: multiple-choice
    question: Quand `instanceof` dans `equals` est-il sans risque ?
    choices:
      - text: "Quand la classe est `final`"
        correct: true
      - text: "Quand `equals` est `final` et défini une fois pour toute la hiérarchie"
        correct: true
      - text: "Quand la sous-classe ajoute un champ à l'égalité"
        correct: false
      - text: "Jamais"
        correct: false
    answer: Le risque vient des sous-classes qui redéfinissent `equals` avec des champs en plus.
  - key: qcm-jdk
    format: multiple-choice
    question: Quel couple de la JDK illustre ce piège ?
    choices:
      - text: "`java.sql.Timestamp` et `java.util.Date`"
        correct: true
      - text: "`String` et `StringBuilder`"
        correct: false
      - text: "`Integer` et `Long`"
        correct: false
      - text: "`ArrayList` et `LinkedList`"
        correct: false
    answer: '`Timestamp` ajoute les nanosecondes et casse la symétrie avec `Date`.'
  - key: code-symetrie
    format: code-output
    question: |-
      ```java
      class Point {
          final int x;
          Point(int x) { this.x = x; }
          @Override public boolean equals(Object o) { return o instanceof Point p && p.x == x; }
      }
      class PointCouleur extends Point {
          final String couleur;
          PointCouleur(int x, String c) { super(x); couleur = c; }
          @Override public boolean equals(Object o) {
              return o instanceof PointCouleur p && p.x == x && p.couleur.equals(couleur);
          }
      }
      Point p = new Point(1);
      PointCouleur pc = new PointCouleur(1, "rouge");
      System.out.println(p.equals(pc) + " " + pc.equals(p));
      ```
    answer: '`true false` : la symétrie est cassée.'
    check:
      output: "true false"
  - key: code-getclass
    format: code-output
    question: |-
      ```java
      class Point {
          final int x;
          Point(int x) { this.x = x; }
          @Override public boolean equals(Object o) {
              return o != null && o.getClass() == getClass() && ((Point) o).x == x;
          }
      }
      class PointNomme extends Point { PointNomme(int x) { super(x); } }
      System.out.println(new Point(1).equals(new PointNomme(1)) + " " + new PointNomme(1).equals(new PointNomme(1)));
      ```
    answer: '`false true` : sans nouveau champ, la sous-classe n''est pourtant jamais égale au parent.'
    check:
      output: "false true"
  - key: code-transitivite
    format: code-output
    question: |-
      ```java
      class Point {
          final int x;
          Point(int x) { this.x = x; }
          @Override public boolean equals(Object o) { return o instanceof Point p && p.x == x; }
      }
      class PointCouleur extends Point {
          final String couleur;
          PointCouleur(int x, String c) { super(x); couleur = c; }
          @Override public boolean equals(Object o) {
              if (!(o instanceof Point)) return false;
              if (!(o instanceof PointCouleur pc)) return o.equals(this);
              return super.equals(o) && pc.couleur.equals(couleur);
          }
      }
      PointCouleur rouge = new PointCouleur(1, "rouge");
      Point p = new Point(1);
      PointCouleur bleu = new PointCouleur(1, "bleu");
      System.out.println(rouge.equals(p) + " " + p.equals(bleu) + " " + rouge.equals(bleu));
      ```
    answer: '`true true false` : la transitivité est cassée.'
    check:
      output: "true true false"
  - key: code-composition
    format: code-output
    question: |-
      ```java
      record Point(int x) { }
      record PointCouleur(Point point, String couleur) { }
      PointCouleur rouge = new PointCouleur(new Point(1), "rouge");
      System.out.println(rouge.point().equals(new Point(1)) + " " + rouge.equals(new PointCouleur(new Point(1), "bleu")));
      ```
    answer: '`true false` : par composition, chaque type a un `equals` cohérent, et la vue `point()` permet de comparer les positions.'
    check:
      output: "true false"
  - key: bug-symetrie-heritage
    format: bug-fix
    question: |-
      Un `Set<Produit>` qui mélange des produits et des produits en promotion se comporte de façon imprévisible :
      ```java
      class Produit {
          @Override public boolean equals(Object o) { return o instanceof Produit p && ref.equals(p.ref); }
      }
      class ProduitPromo extends Produit {
          @Override public boolean equals(Object o) {
              return o instanceof ProduitPromo p && super.equals(o) && remise == p.remise;
          }
      }
      ```
    answer: |-
      ```java
      final class Produit { ... }                          // equals sur ref

      record Promotion(Produit produit, double remise) { }  // compose au lieu d'hériter
      ```
      La sous-classe ajoutait un champ à l'égalité : `produit.equals(promo)` était vrai, `promo.equals(produit)` faux. Par
      composition, chaque type a son propre `equals`, et l'on ne mélange plus deux notions dans une collection.
  - key: bug-getclass-proxy
    format: bug-fix
    question: |-
      Une entité chargée par Hibernate (un proxy, sous-classe générée) n'est jamais égale à la même entité chargée
      normalement :
      ```java
      @Override
      public boolean equals(Object o) {
          return o != null && getClass() == o.getClass() && id.equals(((Client) o).id);
      }
      ```
    answer: |-
      ```java
      @Override
      public final boolean equals(Object o) {
          return o instanceof Client c && id != null && id.equals(c.id());
      }
      ```
      Le proxy est une sous-classe : `getClass()` diffère. Un `equals` `final` avec `instanceof`, défini une fois pour
      la hiérarchie, et qui passe par l'accesseur (le proxy peut ne pas avoir chargé ses champs), reste symétrique.
  - key: bug-classe-valeur-extensible
    format: bug-fix
    question: |-
      Une équipe a étendu la classe `Montant` pour ajouter une devise à l'égalité, et les comparaisons sont devenues
      incohérentes :
      ```java
      public class Montant {
          private final long centimes;
          @Override public boolean equals(Object o) { return o instanceof Montant m && centimes == m.centimes; }
      }
      ```
    answer: |-
      ```java
      public record Montant(long centimes, Devise devise) { }
      ```
      Une classe de valeur extensible invite ce genre de sous-classe. Un record (ou une classe `final`) l'empêche, et
      la devise fait partie de la valeur dès le départ.
  - key: bug-melange-types
    format: bug-fix
    question: |-
      `dates.contains(timestamp)` et `timestamps.contains(date)` ne donnent pas le même résultat :
      ```java
      List<Date> dates = new ArrayList<>(List.of(date));
      Timestamp timestamp = new Timestamp(date.getTime());
      ```
    answer: |-
      ```java
      List<Instant> instants = new ArrayList<>(List.of(date.toInstant()));
      instants.contains(timestamp.toInstant());
      ```
      `Timestamp` étend `Date` en ajoutant les nanosecondes à l'égalité : la symétrie est cassée. On convertit tout vers
      un seul type de valeur, `Instant`, avant de comparer.
