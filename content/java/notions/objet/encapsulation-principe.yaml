notion: encapsulation-principe
lesson: |-
  **Encapsuler**, c'est cacher l'état d'un objet derrière des méthodes qui garantissent ses **invariants** : les règles
  toujours vraies pour un objet valide (un solde jamais négatif, une date de fin après la date de début).

  ```java
  public class Panier {
      private static final int MAX = 10;
      private final List<String> articles = new ArrayList<>();

      public void ajouter(String article) {
          if (articles.size() == MAX) {
              throw new IllegalStateException("panier plein");
          }
          articles.add(article);
      }

      public List<String> articles() {
          return Collections.unmodifiableList(articles);   // on ne rend pas la liste interne
      }
  }
  ```

  - Les champs sont **`private`** ; on expose des **comportements** (`ajouter`, `retirer`), pas des setters sur tout.
  - Un getter qui renvoie une collection ou un objet mutable interne **casse** l'encapsulation : on renvoie une vue non
    modifiable ou une copie.
  - **Tell, don't ask** : on demande à l'objet d'agir (`compte.retirer(50)`) plutôt que de lire son état pour décider à
    sa place (`if (compte.getSolde() >= 50) compte.setSolde(...)`).
  - Bénéfice : on peut changer la représentation interne (une `List` devient une `Map`) sans toucher aux appelants.

  **Piège classique** : générer un getter et un setter pour chaque champ. Les champs sont privés, mais n'importe qui peut
  les mettre dans n'importe quel état : c'est une structure de données déguisée, sans encapsulation.

  **En entretien** : « L'encapsulation protège les invariants : état privé, comportements publics, et jamais de
  référence vers l'état mutable interne. »
tour:
  - title: L'encapsulation
    text: |-
      L'**encapsulation** cache l'état d'un objet derrière ses méthodes : les champs sont `private`, et seules les
      méthodes peuvent les changer. Elles garantissent ainsi des **invariants** : un solde jamais négatif, une date
      toujours valide.

      Un accesseur donne à lire, et une méthode qui modifie vérifie avant d'écrire. Des *setters* pour tous les champs
      reviendraient à tout ouvrir : on n'expose que les opérations qui ont un sens.
    example:
      files:
        Main.java: |-
          void main() {
              Compte compte = new Compte();
              compte.depose(50);
              try {
                  compte.retire(80);
              } catch (IllegalArgumentException e) {
                  IO.println(e.getMessage());
              }
              IO.println("solde : " + compte.solde());
          }
        Compte.java: |-
          public class Compte {
              private double solde;

              public double solde() {
                  return solde;
              }

              public void depose(double montant) {
                  if (montant <= 0) {
                      throw new IllegalArgumentException("dépôt impossible : " + montant);
                  }
                  solde += montant;
              }

              public void retire(double montant) {
                  if (montant <= 0 || montant > solde) {
                      throw new IllegalArgumentException("retrait impossible : " + montant);
                  }
                  solde -= montant;
              }
          }
      output: |-
        retrait impossible : 80.0
        solde : 50.0
cards:
  - key: tell-don-ask
    format: course
    question: C'est quoi "tell, don't ask" ?
    answer: Demander à l'objet d'agir plutôt que de lire son état pour décider à sa place.
  - key: getters-setters-sont-ils-encapsulation
    format: course
    question: Les getters/setters sont-ils de l'encapsulation ?
    answer: 'Pas en soi : des setters sur tout l''état contournent les invariants.'
  - key: invariant
    format: course
    question: Qu'est-ce qu'un invariant de classe ?
    answer: Une règle toujours vraie pour tout objet valide de la classe (un solde jamais négatif) ; le constructeur l'établit et chaque méthode la préserve.
  - key: getter-collection
    format: course
    question: Pourquoi ne pas renvoyer directement la liste interne d'un objet ?
    answer: L'appelant pourrait la modifier sans passer par les méthodes de l'objet, et contourner ses règles. On renvoie une vue non modifiable (`Collections.unmodifiableList`) ou une copie (`List.copyOf`).
  - key: vf-private-suffit
    format: true-false
    question: Des champs `private` avec un getter et un setter publics pour chacun garantissent l'encapsulation.
    truth: false
    answer: "Le setter laisse mettre l'objet dans n'importe quel état : les invariants ne sont plus protégés."
  - key: vf-representation
    format: true-false
    question: L'encapsulation permet de changer la représentation interne d'une classe sans modifier ses appelants.
    truth: true
    answer: Tant que les méthodes publiques gardent leur contrat, l'intérieur peut évoluer.
  - key: vf-getter-liste
    format: true-false
    question: Renvoyer la `List` interne dans un getter est sans risque si le champ est `private`.
    truth: false
    answer: L'appelant reçoit la même liste et peut la modifier ; `private` protège la variable, pas l'objet.
  - key: vf-constructeur-invariant
    format: true-false
    question: Le constructeur doit établir les invariants de l'objet.
    truth: true
    answer: Un objet doit être valide dès sa création ; les méthodes préservent ensuite ces règles.
  - key: qcm-tell-dont-ask
    format: multiple-choice
    question: Quel code respecte le mieux « tell, don't ask » ?
    choices:
      - text: "`compte.retirer(50);`"
        correct: true
      - text: "`if (compte.getSolde() >= 50) compte.setSolde(compte.getSolde() - 50);`"
        correct: false
      - text: "`compte.solde -= 50;`"
        correct: false
      - text: "`Banque.retirer(compte.getSolde(), 50);`"
        correct: false
    answer: La règle « pas de retrait au-delà du solde » vit dans `Compte`, au lieu d'être répétée chez chaque appelant.
  - key: qcm-getter-sur
    format: multiple-choice
    question: Quels getters ne cassent pas l'encapsulation d'une liste interne `articles` ?
    choices:
      - text: "`return Collections.unmodifiableList(articles);`"
        correct: true
      - text: "`return List.copyOf(articles);`"
        correct: true
      - text: "`return articles;`"
        correct: false
      - text: "`return (List<String>) articles;`"
        correct: false
    answer: Une vue non modifiable ou une copie immuable empêchent l'appelant de modifier la liste interne.
  - key: qcm-benefice
    format: multiple-choice
    question: Quel est le premier bénéfice de l'encapsulation ?
    choices:
      - text: "Protéger les invariants de l'objet"
        correct: true
      - text: "Rendre le code plus rapide"
        correct: false
      - text: "Réduire le nombre de classes"
        correct: false
      - text: "Éviter d'écrire des constructeurs"
        correct: false
    answer: Personne ne peut mettre l'objet dans un état invalide.
  - key: qcm-setter-utile
    format: multiple-choice
    question: Plutôt qu'un `setStatut(Statut s)` sur une commande, que proposer ?
    choices:
      - text: "Des méthodes métier comme `payer()`, `expedier()`, `annuler()`, qui vérifient les transitions"
        correct: true
      - text: "Rendre le champ `statut` public"
        correct: false
      - text: "Un `setStatut` qui accepte une `String`"
        correct: false
      - text: "Supprimer le statut"
        correct: false
    answer: Chaque méthode vérifie que la transition est permise (on n'expédie pas une commande annulée).
  - key: bug-getter-liste
    format: bug-fix
    question: |-
      Le panier est limité à 10 articles, et pourtant on en trouve 50 :
      ```java
      public List<String> articles() {
          return articles;
      }
      // ailleurs : panier.articles().add("vélo");
      ```
    answer: |-
      ```java
      public List<String> articles() {
          return Collections.unmodifiableList(articles);
      }
      ```
      Le getter rendait la liste interne : on pouvait y ajouter sans passer par `ajouter`, qui vérifie la limite.
  - key: bug-setter-invariant
    format: bug-fix
    question: |-
      Des réservations se terminent avant d'avoir commencé :
      ```java
      public void setDebut(LocalDate debut) { this.debut = debut; }
      public void setFin(LocalDate fin) { this.fin = fin; }
      ```
    answer: |-
      ```java
      public void deplacer(LocalDate debut, LocalDate fin) {
          if (fin.isBefore(debut)) {
              throw new IllegalArgumentException("fin avant le début");
          }
          this.debut = debut;
          this.fin = fin;
      }
      ```
      Deux setters indépendants ne peuvent pas vérifier une règle qui lie les deux champs. Une seule méthode métier
      modifie les deux ensemble et garde l'invariant.
  - key: bug-ask
    format: bug-fix
    question: |-
      La règle du découvert est dupliquée dans cinq services, et l'un d'eux l'a oubliée :
      ```java
      if (compte.getSolde() - montant >= -compte.getDecouvert()) {
          compte.setSolde(compte.getSolde() - montant);
      }
      ```
    answer: |-
      ```java
      compte.retirer(montant);

      // dans Compte
      public void retirer(double montant) {
          if (solde - montant < -decouvert) {
              throw new IllegalStateException("découvert dépassé");
          }
          solde -= montant;
      }
      ```
      « Tell, don't ask » : la règle vit une seule fois, dans l'objet qui possède les données.
  - key: bug-date-mutable
    format: bug-fix
    question: |-
      Un appelant modifie la date de création d'un document après coup :
      ```java
      public Date creation() {
          return creation;   // champ java.util.Date
      }
      // ailleurs : document.creation().setTime(0);
      ```
    answer: |-
      ```java
      private final Instant creation;

      public Instant creation() {
          return creation;
      }
      ```
      `Date` est mutable : la rendre, c'est donner accès à l'état interne. `Instant` est immuable et se partage sans
      risque (à défaut, on renverrait `new Date(creation.getTime())`).
  - key: scenario-anemique
    format: scenario
    question: Tu découvres un modèle où toutes les classes n'ont que des getters et des setters, et toute la logique est dans des services. Ton avis ?
    answer: |-
      C'est un **modèle anémique** : les objets sont des sacs de données, et les règles métier sont éparpillées dans
      les services, souvent dupliquées. Je ne réécris pas tout d'un coup : je déplace progressivement chaque règle vers
      l'objet qui détient les données (`commande.annuler()` vérifie elle-même qu'elle n'est pas expédiée), je remplace
      les setters par des méthodes métier et je retire les setters devenus inutiles. Pour de simples DTO aux frontières
      (API, persistance), des données sans comportement restent légitimes, idéalement en records.
  - key: scenario-changer-representation
    format: scenario
    question: Une classe stocke une liste de produits et la recherche par identifiant devient lente. Comment l'encapsulation t'aide-t-elle ?
    answer: |-
      Si la liste est privée et que les appelants passent par `produit(id)` et `ajouter(produit)`, je remplace la
      `List` par une `Map<Id, Produit>` sans toucher à un seul appelant : seule l'implémentation interne change. Si au
      contraire un getter exposait la liste, chaque appelant qui l'itère ou la modifie serait à revoir : c'est le coût
      concret d'une encapsulation cassée.
  - key: scenario-getters-generes
    format: scenario
    question: Un collègue génère systématiquement getters et setters pour tous les champs. Que lui dis-tu ?
    answer: |-
      Que chaque accesseur est une porte ouverte qu'il faudra maintenir. Je commencerais sans : j'ajoute un getter
      quand un appelant en a vraiment besoin, et je remplace les setters par des méthodes qui expriment une intention
      et vérifient les règles (`changerAdresse`, `augmenter`). Pour les objets qui ne sont que des données, un record
      immuable donne les accesseurs sans setter. Le but n'est pas de cacher les champs pour la forme, mais d'empêcher
      les états invalides.
  - key: scenario-invariants
    format: scenario
    question: Comment garantis-tu qu'un objet `Reservation` ne soit jamais dans un état invalide ?
    answer: |-
      Je liste ses invariants (fin après début, nombre de personnes positif, pas de modification après annulation), je
      les vérifie dans le constructeur pour qu'aucun objet invalide n'existe, puis je n'expose que des méthodes métier
      qui les préservent, chacune refusant une transition interdite par une exception claire. Les champs sont privés et
      si possible `final` ; aucune collection interne n'est exposée. Des tests unitaires couvrent chaque règle,
      y compris les refus.
