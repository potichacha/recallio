notion: encapsulation-principe
lesson: |-
  **Encapsuler**, c'est cacher l'état d'un objet derrière des méthodes qui garantissent ses **invariants** : les règles
  toujours vraies pour un objet valide (un solde jamais négatif, une date de fin après la date de début).

  ```java
  public class Panier {
      private static final int MAX = 10;
      private final List<String> articles = new ArrayList<>();

      public void ajouter(String article) {
          if (articles.size() == MAX) {
              throw new IllegalStateException("panier plein");
          }
          articles.add(article);
      }

      public List<String> articles() {
          return Collections.unmodifiableList(articles);   // on ne rend pas la liste interne
      }
  }
  ```

  - Les champs sont **`private`** ; on expose des **comportements** (`ajouter`, `retirer`), pas des setters sur tout.
  - Un getter qui renvoie une collection ou un objet mutable interne **casse** l'encapsulation : on renvoie une vue non
    modifiable ou une copie.
  - **Tell, don't ask** : on demande à l'objet d'agir (`compte.retirer(50)`) plutôt que de lire son état pour décider à
    sa place (`if (compte.getSolde() >= 50) compte.setSolde(...)`).
  - Bénéfice : on peut changer la représentation interne (une `List` devient une `Map`) sans toucher aux appelants.

  **Piège classique** : générer un getter et un setter pour chaque champ. Les champs sont privés, mais n'importe qui peut
  les mettre dans n'importe quel état : c'est une structure de données déguisée, sans encapsulation.

  **En entretien** : « L'encapsulation protège les invariants : état privé, comportements publics, et jamais de
  référence vers l'état mutable interne. »
tour:
  - title: L'encapsulation
    text: |-
      L'**encapsulation** cache l'état d'un objet derrière ses méthodes : les champs sont `private`, et seules les
      méthodes peuvent les changer. Elles garantissent ainsi des **invariants** : un solde jamais négatif, une date
      toujours valide.

      Un accesseur donne à lire, et une méthode qui modifie vérifie avant d'écrire. Des *setters* pour tous les champs
      reviendraient à tout ouvrir : on n'expose que les opérations qui ont un sens.
    example:
      files:
        Main.java: |-
          void main() {
              Compte compte = new Compte();
              compte.depose(50);
              try {
                  compte.retire(80);
              } catch (IllegalArgumentException e) {
                  IO.println(e.getMessage());
              }
              IO.println("solde : " + compte.solde());
          }
        Compte.java: |-
          public class Compte {
              private double solde;

              public double solde() {
                  return solde;
              }

              public void depose(double montant) {
                  if (montant <= 0) {
                      throw new IllegalArgumentException("dépôt impossible : " + montant);
                  }
                  solde += montant;
              }

              public void retire(double montant) {
                  if (montant <= 0 || montant > solde) {
                      throw new IllegalArgumentException("retrait impossible : " + montant);
                  }
                  solde -= montant;
              }
          }
      output: |-
        retrait impossible : 80.0
        solde : 50.0
cards:
  - key: tell-don-ask
    format: course
    question: "Que veut dire le principe « tell, don't ask » ?"
    choices:
      - {text: "Demander à l'objet d'agir, plutôt que lire son état pour décider à sa place", correct: true}
      - {text: "Lire l'état de l'objet par ses getters, puis décider dans le service appelant", correct: false}
      - {text: "Exposer chaque champ par un setter, pour que l'appelant fixe l'état voulu", correct: false}
      - {text: "Préférer les exceptions aux codes de retour pour signaler une erreur", correct: false}
    answer: |-
      On demande à l'objet d'agir (`compte.retirer(montant)`) plutôt que de lire son état pour décider à sa place : la
      règle vit une seule fois, dans l'objet qui possède les données.
  - key: getters-setters-sont-ils-encapsulation
    format: course
    question: "Des getters et des setters sur tous les champs, est-ce de l'encapsulation ?"
    choices:
      - {text: "Pas en soi : des setters sur tout l'état laissent contourner les invariants", correct: true}
      - {text: "Oui : dès que les champs sont `private`, l'objet est bien encapsulé", correct: false}
      - {text: "Oui, à condition que l'IDE les génère, pour qu'ils restent simples", correct: false}
      - {text: "Non : l'encapsulation interdit tout getter, seules les méthodes métier comptent", correct: false}
    answer: |-
      Pas en soi : des setters sur tout l'état laissent n'importe qui casser les invariants. L'encapsulation, c'est
      empêcher les états invalides, pas seulement cacher les champs.
  - key: invariant
    format: course
    question: Qu'est-ce qu'un invariant de classe ?
    choices:
      - {text: "Une règle toujours vraie pour tout objet valide, établie au constructeur et préservée ensuite", correct: true}
      - {text: "Un champ `final` dont la valeur ne change plus après la construction de l'objet", correct: false}
      - {text: "Une constante `static final`, partagée par tous les objets de la classe", correct: false}
      - {text: "Une règle vérifiée dans les tests unitaires, mais pas dans le code de la classe", correct: false}
    answer: |-
      Une règle toujours vraie pour tout objet valide de la classe (un solde jamais négatif) : le constructeur l'établit
      et chaque méthode la préserve.
  - key: getter-collection
    format: course
    question: Pourquoi ne pas renvoyer directement la liste interne d'un objet ?
    choices:
      - {text: "L'appelant pourrait la modifier sans passer par l'objet, et contourner ses règles", correct: true}
      - {text: "Renvoyer une liste coûte une copie complète de ses éléments à chaque appel", correct: false}
      - {text: "Le compilateur refuse de renvoyer un champ `private` depuis une méthode `public`", correct: false}
      - {text: "Le ramasse-miettes ne pourrait plus jamais récupérer l'objet propriétaire", correct: false}
    answer: |-
      L'appelant pourrait la modifier sans passer par les méthodes de l'objet, et contourner ses règles. On renvoie une
      vue non modifiable (`Collections.unmodifiableList`) ou une copie (`List.copyOf`).
  - key: vf-private-suffit
    format: true-false
    question: Des champs `private` avec un getter et un setter publics pour chacun garantissent l'encapsulation.
    truth: false
    answer: "Le setter laisse mettre l'objet dans n'importe quel état : les invariants ne sont plus protégés."
  - key: vf-representation
    format: true-false
    question: L'encapsulation permet de changer la représentation interne d'une classe sans modifier ses appelants.
    truth: true
    answer: Tant que les méthodes publiques gardent leur contrat, l'intérieur peut évoluer.
  - key: vf-getter-liste
    format: true-false
    question: Renvoyer la `List` interne dans un getter est sans risque si le champ est `private`.
    truth: false
    answer: L'appelant reçoit la même liste et peut la modifier ; `private` protège la variable, pas l'objet.
  - key: vf-constructeur-invariant
    format: true-false
    question: Le constructeur doit établir les invariants de l'objet.
    truth: true
    answer: Un objet doit être valide dès sa création ; les méthodes préservent ensuite ces règles.
  - key: qcm-tell-dont-ask
    format: multiple-choice
    question: Quel code respecte le mieux « tell, don't ask » ?
    choices:
      - text: "`compte.retirer(50);`"
        correct: true
      - text: "`if (compte.getSolde() >= 50) compte.setSolde(compte.getSolde() - 50);`"
        correct: false
      - text: "`compte.solde -= 50;`"
        correct: false
      - text: "`Banque.retirer(compte.getSolde(), 50);`"
        correct: false
    answer: La règle « pas de retrait au-delà du solde » vit dans `Compte`, au lieu d'être répétée chez chaque appelant.
  - key: qcm-getter-sur
    format: multiple-choice
    question: "Lequel de ces getters laisse l'appelant modifier la liste interne `articles` ?"
    choices:
      - {text: "`return articles;`", correct: true}
      - {text: "`return List.copyOf(articles);`", correct: false}
      - {text: "`return Collections.unmodifiableList(articles);`", correct: false}
      - {text: "`return new ArrayList<>(articles);`", correct: false}
    answer: |-
      `return articles;` rend la liste elle-même. Une vue non modifiable, une copie immuable ou même une copie
      modifiable protègent la liste interne.
  - key: qcm-benefice
    format: multiple-choice
    question: Quel est le premier bénéfice de l'encapsulation ?
    choices:
      - text: "Protéger les invariants de l'objet"
        correct: true
      - text: "Rendre le code plus rapide"
        correct: false
      - text: "Réduire le nombre de classes"
        correct: false
      - text: "Éviter d'écrire des constructeurs"
        correct: false
    answer: Personne ne peut mettre l'objet dans un état invalide.
  - key: qcm-setter-utile
    format: multiple-choice
    question: Plutôt qu'un `setStatut(Statut s)` sur une commande, que proposer ?
    choices:
      - {text: "Des méthodes métier comme `payer()`, `expedier()`, `annuler()`, qui vérifient les transitions", correct: true}
      - {text: "Rendre le champ `statut` public, pour que chaque service le change directement", correct: false}
      - {text: "Un `setStatut(String s)` qui accepte le nom du statut, plus souple à appeler", correct: false}
      - {text: "Supprimer le champ et recalculer le statut à chaque lecture depuis la base", correct: false}
    answer: Chaque méthode vérifie que la transition est permise (on n'expédie pas une commande annulée).
  - key: bug-getter-liste
    format: bug-fix
    question: |-
      Le panier est limité à 10 articles, et pourtant on en trouve 50. Quelle correction est la bonne ?
      ```java
      public List<String> articles() {
          return articles;
      }
      // ailleurs : panier.articles().add("vélo");
      ```
    choices:
      - {text: "Renvoyer une vue non modifiable : `Collections.unmodifiableList(articles)`", correct: true}
      - {text: "Déclarer le champ `final` : `private final List<String> articles`", correct: false}
      - {text: "Vérifier la limite de 10 dans le getter, avant de renvoyer `articles`", correct: false}
      - {text: "Rendre le getter `synchronized`, pour que les ajouts passent un par un", correct: false}
    answer: |-
      ```java
      public List<String> articles() {
          return Collections.unmodifiableList(articles);
      }
      ```
      Le getter rendait la liste interne : on pouvait y ajouter sans passer par `ajouter`, qui vérifie la limite.
      `final` ne fige que la référence.
  - key: bug-setter-invariant
    format: bug-fix
    question: |-
      Des réservations se terminent avant d'avoir commencé. Quelle correction est la bonne ?
      ```java
      public void setDebut(LocalDate debut) { this.debut = debut; }
      public void setFin(LocalDate fin) { this.fin = fin; }
      ```
    choices:
      - {text: "Remplacer les deux setters par `deplacer(debut, fin)`, qui vérifie la règle", correct: true}
      - {text: "Vérifier dans `setFin` que `fin` suit `debut`, en gardant `setDebut` tel quel", correct: false}
      - {text: "Rendre les deux setters `synchronized`, pour éviter les modifications croisées", correct: false}
      - {text: "Appeler `setDebut` avant `setFin` partout, et le noter dans la documentation", correct: false}
    answer: |-
      ```java
      public void deplacer(LocalDate debut, LocalDate fin) {
          if (fin.isBefore(debut)) {
              throw new IllegalArgumentException("fin avant le début");
          }
          this.debut = debut;
          this.fin = fin;
      }
      ```
      Deux setters indépendants ne peuvent pas vérifier une règle qui lie les deux champs (`setDebut` la casserait
      encore). Une seule méthode métier modifie les deux ensemble et garde l'invariant.
  - key: bug-ask
    format: bug-fix
    question: |-
      La règle du découvert est dupliquée dans cinq services, et l'un d'eux l'a oubliée. Quelle correction est la
      bonne ?
      ```java
      if (compte.getSolde() - montant >= -compte.getDecouvert()) {
          compte.setSolde(compte.getSolde() - montant);
      }
      ```
    choices:
      - {text: "Déplacer la règle dans `Compte.retirer(montant)`, et retirer `setSolde`", correct: true}
      - {text: "Copier la condition dans le service qui l'a oubliée, à l'identique", correct: false}
      - {text: "Extraire la condition dans une classe utilitaire, appelée par chaque service", correct: false}
      - {text: "Journaliser dans `setSolde` chaque solde qui passe sous le découvert", correct: false}
    answer: |-
      ```java
      compte.retirer(montant);

      // dans Compte
      public void retirer(double montant) {
          if (solde - montant < -decouvert) {
              throw new IllegalStateException("découvert dépassé");
          }
          solde -= montant;
      }
      ```
      « Tell, don't ask » : la règle vit une seule fois, dans l'objet qui possède les données. Une classe utilitaire
      laisserait encore un service l'oublier et appeler `setSolde`.
  - key: bug-date-mutable
    format: bug-fix
    question: |-
      Un appelant modifie la date de création d'un document après coup. Quelle correction est la bonne ?
      ```java
      public Date creation() {
          return creation;   // champ java.util.Date
      }
      // ailleurs : document.creation().setTime(0);
      ```
    choices:
      - {text: "Stocker et renvoyer un `Instant`, immuable, à la place de la `Date`", correct: true}
      - {text: "Déclarer le champ `final` : `private final Date creation;`", correct: false}
      - {text: "Déclarer l'accesseur `final`, pour qu'aucune sous-classe ne le change", correct: false}
      - {text: "Renvoyer `(Date) creation`, un cast qui détache la date du champ", correct: false}
    answer: |-
      ```java
      private final Instant creation;

      public Instant creation() {
          return creation;
      }
      ```
      `Date` est mutable : la rendre, c'est donner accès à l'état interne. `Instant` est immuable et se partage sans
      risque (à défaut, on renverrait `new Date(creation.getTime())`).
  - key: scenario-anemique
    format: scenario
    question: |-
      Tu découvres un modèle où toutes les classes n'ont que des getters et des setters, et toute la logique est dans des
      services. Que fais-tu ?
    choices:
      - {text: "Je déplace peu à peu chaque règle dans l'objet qui détient les données, et je retire les setters", correct: true}
      - {text: "Je réécris tout d'un coup en modèle riche, avant d'accepter toute nouvelle fonctionnalité", correct: false}
      - {text: "Je garde ce modèle : mettre la logique dans les services est la bonne pratique en Java", correct: false}
      - {text: "Je rends les champs publics, puisque ces getters et setters n'apportent rien", correct: false}
    answer: |-
      C'est un **modèle anémique** : les règles sont éparpillées dans les services, souvent dupliquées. On les déplace
      progressivement vers l'objet qui détient les données (`commande.annuler()` vérifie elle-même qu'elle n'est pas
      expédiée), sans tout réécrire d'un coup ; de simples DTO aux frontières restent légitimes, idéalement en records.
  - key: scenario-changer-representation
    format: scenario
    question: |-
      Une classe stocke une liste de produits et la recherche par identifiant devient lente. Comment l'encapsulation
      t'aide-t-elle ?
    choices:
      - {text: "Si la liste est privée derrière `produit(id)`, je passe à une `Map` sans toucher aux appelants", correct: true}
      - {text: "Elle n'aide pas : il faut de toute façon revoir chaque appelant qui fait la recherche", correct: false}
      - {text: "J'ajoute un getter de `Map` à côté de celui de la liste, pour les appelants pressés", correct: false}
      - {text: "Je rends la liste publique, pour que chaque appelant optimise sa propre recherche", correct: false}
    answer: |-
      Si les appelants passent par `produit(id)` et `ajouter(produit)`, je remplace la `List` par une
      `Map<Id, Produit>` sans toucher à un seul appelant. Si un getter exposait la liste, chaque appelant serait à
      revoir : c'est le coût concret d'une encapsulation cassée.
  - key: scenario-getters-generes
    format: scenario
    question: Un collègue génère systématiquement getters et setters pour tous les champs. Que lui dis-tu ?
    choices:
      - {text: "Qu'on n'ajoute un getter qu'au besoin, et qu'on remplace les setters par des méthodes métier", correct: true}
      - {text: "Que c'est la bonne pratique : tout champ `private` doit avoir son getter et son setter", correct: false}
      - {text: "Que des champs `public` seraient plus simples : ces accesseurs n'ajoutent que du code", correct: false}
      - {text: "Qu'il garde les setters, mais les annote `@Deprecated` pour décourager leur usage", correct: false}
    answer: |-
      Chaque accesseur est une porte ouverte à maintenir : on ajoute un getter quand un appelant en a vraiment besoin, et
      on remplace les setters par des méthodes qui expriment une intention et vérifient les règles (`changerAdresse`).
      Pour de simples données, un record immuable donne les accesseurs sans setter.
  - key: scenario-invariants
    format: scenario
    question: Comment garantis-tu qu'un objet `Reservation` ne soit jamais dans un état invalide ?
    choices:
      - {text: "Je vérifie ses invariants au constructeur, puis n'expose que des méthodes qui les préservent", correct: true}
      - {text: "J'ajoute une méthode `estValide()` que chaque service appelle avant d'utiliser l'objet", correct: false}
      - {text: "Je valide l'objet dans le contrôleur REST, à l'entrée de la requête, puis je fais confiance", correct: false}
      - {text: "Je garde des setters sur tous les champs, et un batch vérifie la base chaque nuit", correct: false}
    answer: |-
      Je liste ses invariants (fin après début, pas de modification après annulation), je les vérifie dans le
      constructeur, puis je n'expose que des méthodes métier qui les préservent et refusent une transition interdite.
      Champs privés et si possible `final`, aucune collection interne exposée, et des tests pour chaque règle.
