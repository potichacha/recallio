notion: encapsulation-principe
cards:
  - key: tell-don-ask
    format: course
    question: C'est quoi "tell, don't ask" ?
    answer: Demander à l'objet d'agir plutôt que de lire son état pour décider à sa place.
  - key: getters-setters-sont-ils-encapsulation
    format: course
    question: Les getters/setters sont-ils de l'encapsulation ?
    answer: 'Pas en soi : des setters sur tout l''état contournent les invariants.'
