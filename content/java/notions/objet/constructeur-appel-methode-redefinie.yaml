notion: constructeur-appel-methode-redefinie
cards:
  - key: appeler-methode-redefinissable-constructeur
    format: course
    question: Pourquoi ne pas appeler une méthode redéfinissable dans un constructeur ?
    answer: La version de la sous-classe s'exécute avant l'initialisation de ses champs.
  - key: code-class-parent-parent-init-void
    format: code-output
    question: |-
      ```java
      class Parent { Parent() { init(); } void init() {} }
      class Child extends Parent {
          String v = "set";
          void init() { System.out.println("init v=" + v); }
      }
      new Child();
      ```
    answer: '`init v=null` : le constructeur du parent appelle la version redéfinie avant l''initialisation des champs de l''enfant.'
    check:
      output: "init v=null"
