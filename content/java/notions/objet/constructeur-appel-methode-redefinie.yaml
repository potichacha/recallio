notion: constructeur-appel-methode-redefinie
lesson: |-
  Pendant le constructeur du parent, l'objet est **déjà** du type de l'enfant, mais les champs de l'enfant ne sont
  **pas encore** initialisés. Si le parent appelle une méthode redéfinie, c'est la version de l'enfant qui s'exécute,
  sur un objet à moitié construit.

  ```java
  class Parent {
      Parent() { init(); }
      void init() { }
  }
  class Enfant extends Parent {
      private final List<String> tags = new ArrayList<>();
      @Override
      void init() { tags.add("nouveau"); }   // NullPointerException : tags vaut encore null
  }
  new Enfant();
  ```

  L'ordre réel : allocation (champs à 0 / `null` / `false`), constructeur du parent (qui appelle `init()` de
  l'enfant), **puis** les initialiseurs de champs de l'enfant, puis le corps de son constructeur.

  - Même un champ `final` peut être vu à sa valeur par défaut, s'il est affecté dans le constructeur. (Un `final`
    initialisé par une **constante** à la déclaration est une exception : la valeur est recopiée à la compilation.)
  - Remèdes : n'appeler depuis un constructeur que des méthodes `private`, `final` ou `static` ; passer les valeurs au
    constructeur du parent ; ou construire puis initialiser dans une **fabrique statique**.
  - Même famille de problèmes : laisser **s'échapper `this`** depuis un constructeur (s'inscrire comme écouteur,
    démarrer un thread qui l'utilise).

  **Piège classique** : un patron « méthode modèle » où le constructeur abstrait appelle `configurer()`, que chaque
  sous-classe redéfinit en lisant ses propres champs.

  **En entretien** : « Un constructeur ne doit appeler que des méthodes non redéfinissables : sinon la sous-classe
  s'exécute avant que ses champs soient initialisés. »
cards:
  - key: appeler-methode-redefinissable-constructeur
    format: course
    question: Pourquoi ne pas appeler une méthode redéfinissable dans un constructeur ?
    answer: La version de la sous-classe s'exécute avant l'initialisation de ses champs.
  - key: etat-pendant-parent
    format: course
    question: Dans quel état sont les champs de l'enfant pendant le constructeur du parent ?
    answer: "À leurs valeurs par défaut (0, `false`, `null`) : leurs initialiseurs ne s'exécutent qu'après le retour du constructeur du parent."
  - key: remedes
    format: course
    question: Comment éviter ce piège ?
    answer: N'appeler depuis un constructeur que des méthodes `private`, `final` ou `static` ; passer les valeurs nécessaires au constructeur du parent ; ou initialiser après construction, dans une fabrique statique.
  - key: echappement-this
    format: course
    question: Qu'est-ce que l'échappement de `this` dans un constructeur ?
    answer: "Rendre l'objet accessible à d'autres (l'inscrire comme écouteur, le passer à un thread) avant la fin de sa construction : ils peuvent l'utiliser à moitié initialisé."
  - key: vf-version-enfant
    format: true-false
    question: Si le constructeur du parent appelle une méthode redéfinie, c'est la version du parent qui s'exécute.
    truth: false
    answer: "L'objet est déjà un `Enfant` : c'est sa version qui s'exécute."
  - key: vf-final-defaut
    format: true-false
    question: Un champ `final` affecté dans le constructeur de l'enfant peut être lu à 0 depuis le constructeur du parent.
    truth: true
    answer: Le constructeur du parent s'exécute avant celui de l'enfant, qui n'a pas encore affecté le champ.
  - key: vf-private-sur
    format: true-false
    question: Appeler une méthode `private` depuis un constructeur ne présente pas ce risque.
    truth: true
    answer: "Une méthode `private` ne peut pas être redéfinie : c'est toujours la version de la classe qui s'exécute."
  - key: vf-ordre-initialiseurs
    format: true-false
    question: Les initialiseurs de champs de l'enfant s'exécutent avant le constructeur du parent.
    truth: false
    answer: Ils s'exécutent juste après le retour de `super(...)`.
  - key: qcm-sur
    format: multiple-choice
    question: Lesquelles de ces méthodes peut-on appeler sans risque depuis un constructeur ?
    choices:
      - text: "Une méthode `private`"
        correct: true
      - text: "Une méthode `final`"
        correct: true
      - text: "Une méthode `static`"
        correct: true
      - text: "Une méthode `protected` non finale"
        correct: false
    answer: Seules les méthodes qu'une sous-classe ne peut pas redéfinir sont sûres.
  - key: qcm-valeur-vue
    format: multiple-choice
    question: "L'enfant déclare `private String nom = \"Rex\";` et redéfinit `afficher()`, appelée par le constructeur du parent. Que voit `afficher()` ?"
    choices:
      - text: "`null`"
        correct: true
      - text: "`\"Rex\"`"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
      - text: "`\"\"`"
        correct: false
    answer: L'initialiseur `= "Rex"` ne s'est pas encore exécuté.
  - key: qcm-solution
    format: multiple-choice
    question: Une classe abstraite doit appeler `configurer()` après la construction complète. Quelle solution choisir ?
    choices:
      - text: "Une fabrique statique qui construit l'objet, puis appelle `configurer()`"
        correct: true
      - text: "Appeler `configurer()` en dernière ligne du constructeur abstrait"
        correct: false
      - text: "Rendre les champs de l'enfant `static`"
        correct: false
      - text: "Mettre `configurer()` en `protected`"
        correct: false
    answer: Même en dernière ligne, le constructeur du parent s'exécute avant ceux de l'enfant.
  - key: qcm-echappement
    format: multiple-choice
    question: Lequel de ces constructeurs laisse échapper `this` ?
    choices:
      - text: "`Fenetre(Bus bus) { bus.abonner(this); ... }`"
        correct: true
      - text: "`Fenetre(String titre) { this.titre = titre; }`"
        correct: false
      - text: "`Fenetre() { this(\"Sans titre\"); }`"
        correct: false
      - text: "`Fenetre(int l) { largeur = Math.max(l, 100); }`"
        correct: false
    answer: Le bus peut appeler la fenêtre avant la fin de sa construction (et, en concurrence, la voir incomplète).
  - key: code-class-parent-parent-init-void
    format: code-output
    question: |-
      ```java
      class Parent { Parent() { init(); } void init() {} }
      class Child extends Parent {
          String v = "set";
          void init() { System.out.println("init v=" + v); }
      }
      new Child();
      ```
    answer: '`init v=null` : le constructeur du parent appelle la version redéfinie avant l''initialisation des champs de l''enfant.'
    check:
      output: "init v=null"
  - key: code-final-zero
    format: code-output
    question: |-
      ```java
      class Parent {
          Parent() { afficher(); }
          void afficher() { }
      }
      class Enfant extends Parent {
          final int taille;
          Enfant() { taille = 42; }
          @Override void afficher() { System.out.println("taille=" + taille); }
      }
      new Enfant();
      ```
    answer: '`taille=0` : même `final`, le champ n''est affecté qu''après le constructeur du parent.'
    check:
      output: "taille=0"
  - key: code-constante
    format: code-output
    question: |-
      ```java
      class Parent {
          Parent() { afficher(); }
          void afficher() { }
      }
      class Enfant extends Parent {
          final int taille = 42;
          @Override void afficher() { System.out.println("taille=" + taille); }
      }
      new Enfant();
      ```
    answer: '`taille=42` : un champ `final` initialisé par une constante est une variable constante, dont la valeur est recopiée à la compilation.'
    check:
      output: "taille=42"
  - key: code-npe
    format: code-output
    question: |-
      ```java
      class Parent {
          Parent() { System.out.println(description()); }
          String description() { return "parent"; }
      }
      class Enfant extends Parent {
          private final List<String> tags = new ArrayList<>(List.of("a"));
          @Override String description() { return "tags " + tags.size(); }
      }
      new Enfant();
      ```
    answer: "Une `NullPointerException` : `tags` vaut encore `null` quand le parent appelle `description()`."
    check:
      throws: NullPointerException
  - key: bug-methode-modele
    format: bug-fix
    question: |-
      `new RapportPdf("titre")` lève une `NullPointerException` :
      ```java
      abstract class Rapport {
          Rapport() { configurer(); }
          abstract void configurer();
      }
      class RapportPdf extends Rapport {
          private final String titre;
          RapportPdf(String titre) { this.titre = titre; }
          @Override void configurer() { System.out.println(titre.toUpperCase()); }
      }
      ```
    answer: |-
      ```java
      class RapportPdf extends Rapport {
          private final String titre;
          private RapportPdf(String titre) { this.titre = titre; }

          static RapportPdf creer(String titre) {
              RapportPdf rapport = new RapportPdf(titre);
              rapport.configurer();
              return rapport;
          }
      }
      ```
      Le constructeur de `Rapport` appelait `configurer()` avant que `titre` soit affecté. La fabrique statique ne
      configure qu'un objet entièrement construit (et `Rapport` n'appelle plus rien dans son constructeur).
  - key: bug-validation-redefinie
    format: bug-fix
    question: |-
      La validation d'un compte d'épargne refuse tous les montants :
      ```java
      class Compte {
          Compte(double solde) { valider(solde); }
          void valider(double solde) { if (solde < 0) throw new IllegalArgumentException(); }
      }
      class Epargne extends Compte {
          private final double plafond = calculerPlafond();
          Epargne(double solde) { super(solde); }
          @Override void valider(double solde) {
              if (solde > plafond) throw new IllegalArgumentException("plafond");
          }
      }
      ```
    answer: |-
      ```java
      class Compte {
          Compte(double solde) { validerSolde(solde); }
          private static void validerSolde(double solde) {
              if (solde < 0) throw new IllegalArgumentException();
          }
      }
      class Epargne extends Compte {
          private final double plafond = calculerPlafond();
          Epargne(double solde) {
              super(solde);
              if (solde > plafond) throw new IllegalArgumentException("plafond");
          }
      }
      ```
      La version redéfinie lisait `plafond` à 0 : tout solde positif dépassait le « plafond ». Le parent valide par une
      méthode non redéfinissable, et l'enfant fait sa propre validation dans son constructeur.
  - key: bug-ecouteur-constructeur
    format: bug-fix
    question: |-
      Le bus appelle parfois `surMessage` d'une fenêtre dont le champ `zone` vaut `null` :
      ```java
      class Fenetre {
          private final ZoneTexte zone;
          Fenetre(Bus bus) {
              bus.abonner(this);
              zone = new ZoneTexte();
          }
          void surMessage(String m) { zone.afficher(m); }
      }
      ```
    answer: |-
      ```java
      class Fenetre {
          private final ZoneTexte zone = new ZoneTexte();

          static Fenetre ouvrir(Bus bus) {
              Fenetre fenetre = new Fenetre();
              bus.abonner(fenetre);
              return fenetre;
          }
      }
      ```
      `this` s'échappait avant la fin du constructeur : le bus pouvait l'appeler à moitié construit. On ne publie
      l'objet qu'une fois entièrement initialisé.
  - key: bug-description-enfant
    format: bug-fix
    question: |-
      Le journal affiche « Création de null » pour chaque produit :
      ```java
      class Entite {
          Entite() { System.out.println("Création de " + nom()); }
          String nom() { return "entité"; }
      }
      class Produit extends Entite {
          private final String libelle;
          Produit(String libelle) { this.libelle = libelle; }
          @Override String nom() { return libelle; }
      }
      ```
    answer: |-
      ```java
      class Entite {
          private final String nom;
          Entite(String nom) {
              this.nom = nom;
              System.out.println("Création de " + nom);
          }
      }
      class Produit extends Entite {
          Produit(String libelle) { super(libelle); }
      }
      ```
      `nom()` redéfinie lisait `libelle` avant son affectation. En passant la valeur au constructeur du parent, il
      n'appelle plus rien de redéfinissable.
