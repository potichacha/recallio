notion: heritage-vs-composition
lesson: |-
  Deux façons de réutiliser du code :

  - l'**héritage** (« est un ») : `class Pile extends ArrayList` ;
  - la **composition** (« a un ») : la classe contient un objet et lui **délègue** le travail.

  ```java
  class EnsembleCompte {
      private final Set<String> elements = new HashSet<>();   // composition
      private int ajouts;

      boolean ajouter(String e) {
          ajouts++;
          return elements.add(e);                             // délégation
      }
  }
  ```

  Pourquoi **préférer la composition** (*Effective Java*, item 18) :
  - l'héritage couple la sous-classe aux **détails d'implémentation** du parent : si `HashSet.addAll` appelle `add` en
    interne, une sous-classe qui compte dans les deux compte deux fois (**classe de base fragile**) ;
  - il expose **toute** l'API du parent, même ce qui n'a pas de sens pour l'enfant ;
  - il est figé à la compilation ; la composition se change à l'exécution (injection d'une stratégie) et se teste avec
    un double.

  L'héritage reste juste pour une vraie relation « est un », substituable, avec un parent **conçu pour être étendu**
  (documenté, méthodes `protected` prévues), ou bien `final`.

  **Agrégation et composition** : dans la composition au sens strict, l'objet contenu naît et meurt avec son
  conteneur ; dans l'agrégation, il existe indépendamment (un étudiant survit à la fermeture de son cours).

  **Piège classique** : hériter pour récupérer trois méthodes utiles. On hérite aussi des vingt autres, et de leurs
  futurs changements.

  **En entretien** : « Je préfère la composition : elle ne dépend que de l'API publique de l'objet utilisé ; l'héritage
  est réservé aux vraies relations "est un". »
cards:
  - key: preferer-composition
    format: course
    question: Pourquoi préférer la composition ?
    answer: L'héritage couple fortement (classe de base fragile) et rigidifie ; la composition est plus flexible.
  - key: agregation-vs-composition
    format: course
    question: Agrégation vs composition ?
    answer: Le contenu survit au conteneur / meurt avec lui.
  - key: classe-base-fragile
    format: course
    question: Qu'est-ce que le problème de la classe de base fragile ?
    answer: Une sous-classe dépend des détails internes de son parent ; un changement anodin du parent (une méthode qui en appelle une autre) casse la sous-classe sans que son code ait bougé.
  - key: delegation
    format: course
    question: Qu'est-ce que la délégation ?
    answer: Une classe qui contient un objet et lui transmet les appels (`elements.add(e)`), en n'exposant que les opérations qu'elle choisit.
  - key: vf-heritage-reutilisation
    format: true-false
    question: L'héritage est la meilleure façon de réutiliser trois méthodes d'une classe existante.
    truth: false
    answer: On hérite aussi de toute son API et de ses détails internes ; la composition ne prend que ce qu'il faut.
  - key: vf-composition-execution
    format: true-false
    question: Avec la composition, on peut changer l'objet utilisé à l'exécution.
    truth: true
    answer: On peut injecter une autre implémentation, ou un double dans un test.
  - key: vf-est-un
    format: true-false
    question: Une `Voiture` qui étend `Moteur` respecte la relation « est un ».
    truth: false
    answer: "Une voiture **a** un moteur : c'est une composition."
  - key: vf-heritage-legitime
    format: true-false
    question: L'héritage reste pertinent pour une vraie relation « est un » avec un parent conçu pour être étendu.
    truth: true
    answer: La composition est un choix par défaut, pas une interdiction de l'héritage.
  - key: qcm-composition
    format: multiple-choice
    question: Lequel de ces codes utilise la composition ?
    choices:
      - text: "`class Pile { private final Deque<Integer> elements = new ArrayDeque<>(); }`"
        correct: true
      - text: "`class Pile extends ArrayDeque<Integer> { }`"
        correct: false
      - text: "`class Pile implements Deque<Integer> { }` sans aucun champ"
        correct: false
      - text: "`abstract class Pile { }`"
        correct: false
    answer: La pile **contient** un `Deque` et lui délègue le travail.
  - key: qcm-defauts-heritage
    format: multiple-choice
    question: Quels sont les défauts de l'héritage utilisé pour réutiliser du code ?
    choices:
      - text: "Il expose toute l'API du parent"
        correct: true
      - text: "Il dépend des détails internes du parent"
        correct: true
      - text: "Il est figé à la compilation"
        correct: true
      - text: "Il empêche d'appeler les méthodes du parent"
        correct: false
    answer: D'où la règle « préférer la composition à l'héritage ».
  - key: qcm-compteur
    format: multiple-choice
    question: "Une sous-classe de `HashSet` compte les ajouts dans `add` et dans `addAll`. Après `addAll(List.of(\"a\", \"b\", \"c\"))`, le compteur vaut 6. Pourquoi ?"
    choices:
      - text: "`HashSet.addAll` appelle `add` pour chaque élément, déjà redéfini"
        correct: true
      - text: "`addAll` ajoute chaque élément deux fois"
        correct: false
      - text: "Un `HashSet` garde les doublons"
        correct: false
      - text: "Le compteur est `static`"
        correct: false
    answer: "C'est l'exemple de la classe de base fragile : la sous-classe dépend d'un détail d'implémentation."
  - key: qcm-agregation
    format: multiple-choice
    question: Laquelle de ces relations est une agrégation plutôt qu'une composition ?
    choices:
      - text: "Une équipe et ses joueurs, qui existent sans elle"
        correct: true
      - text: "Une commande et ses lignes de commande"
        correct: false
      - text: "Une maison et ses pièces"
        correct: false
      - text: "Un document et ses paragraphes"
        correct: false
    answer: Dans l'agrégation, les éléments survivent au conteneur.
  - key: classe-base-8-sous-classes-chaque
    format: scenario
    question: Une classe de base a 8 sous-classes et chaque besoin ajoute une méthode dans la base.
    answer: |-
      Symptôme d'héritage sur-utilisé : la base devient un fourre-tout, et chaque modification impacte les 8 sous-classes, donc chaque ajout est risqué. C'est exactement le problème de la classe de base fragile.
      Je basculerais vers la **composition** : chaque classe assemble les comportements dont elle a besoin, injectés sous forme d'interfaces. Un comportement qui varie devient une Strategy injectée plutôt qu'une méthode surchargée.
      Le gain : ajouter un comportement ne touche plus le code existant (c'est de l'Open/Closed) et on peut combiner librement au lieu d'être prisonnier d'une hiérarchie figée.
      Je procéderais progressivement, en commençant par le comportement qui varie le plus, et avec des tests de caractérisation avant de toucher quoi que ce soit.
  - key: scenario-explosion-combinaisons
    format: scenario
    question: On a `Notification`, `NotificationEmail`, `NotificationSms`, et on veut maintenant chacune « urgente » ou « groupée ». Comment modélises-tu ?
    answer: |-
      Par héritage, chaque combinaison deviendrait une classe (`NotificationEmailUrgente`, `NotificationSmsGroupee`...) :
      le nombre de classes explose. Je sépare les deux axes : un **canal** (`interface Canal { void envoyer(Message m); }`
      avec `Email` et `Sms`) et des **décorateurs** ou des options (urgence, regroupement) qui enveloppent un canal.
      `new Groupee(new Urgente(new Email()))` combine à volonté, et chaque nouveau canal ou option ne demande qu'une
      classe.
  - key: scenario-heriter-framework
    format: scenario
    question: Un collègue veut étendre une classe d'une bibliothèque tierce pour modifier un comportement. Tes réserves ?
    answer: |-
      La classe n'est sans doute pas conçue pour être étendue : on dépendrait de ses détails internes, qui peuvent
      changer à la prochaine version sans que ce soit considéré comme une rupture. Je préfère l'envelopper : une classe
      à nous qui la contient et ne délègue que ce dont on a besoin (un adaptateur ou un décorateur), derrière une
      interface à nous. On isole ainsi la dépendance, on peut la remplacer dans les tests, et une mise à jour ne touche
      qu'un seul endroit.
  - key: scenario-quand-heriter
    format: scenario
    question: Donne un cas où tu choisirais l'héritage plutôt que la composition.
    answer: |-
      Quand la relation « est un » est vraie et stable, et que le parent est conçu pour l'extension : par exemple une
      hiérarchie scellée de types métier (`sealed interface Paiement permits Carte, Virement`), ou une classe abstraite
      d'un framework prévue pour ça (`AbstractList`, une classe de test de base bien documentée). Je vérifie la
      substitution : tout code qui manipule le parent doit fonctionner avec l'enfant sans surprise. Si je n'hérite que
      pour récupérer du code, je compose.
