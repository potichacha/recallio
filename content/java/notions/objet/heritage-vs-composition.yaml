notion: heritage-vs-composition
cards:
  - key: preferer-composition
    format: course
    question: Pourquoi préférer la composition ?
    answer: L'héritage couple fortement (classe de base fragile) et rigidifie ; la composition est plus flexible.
  - key: agregation-vs-composition
    format: course
    question: Agrégation vs composition ?
    answer: Le contenu survit au conteneur / meurt avec lui.
  - key: classe-base-8-sous-classes-chaque
    format: scenario
    question: Une classe de base a 8 sous-classes et chaque besoin ajoute une méthode dans la base.
    answer: |-
      Symptôme d'héritage sur-utilisé : la base devient un fourre-tout, et chaque modification impacte les 8 sous-classes, donc chaque ajout est risqué. C'est exactement le problème de la classe de base fragile.
      Je basculerais vers la **composition** : chaque classe assemble les comportements dont elle a besoin, injectés sous forme d'interfaces. Un comportement qui varie devient une Strategy injectée plutôt qu'une méthode surchargée.
      Le gain : ajouter un comportement ne touche plus le code existant (c'est de l'Open/Closed) et on peut combiner librement au lieu d'être prisonnier d'une hiérarchie figée.
      Je procéderais progressivement, en commençant par le comportement qui varie le plus, et avec des tests de caractérisation avant de toucher quoi que ce soit.
