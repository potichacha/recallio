notion: heritage-vs-composition
lesson: |-
  Deux façons de réutiliser du code :

  - l'**héritage** (« est un ») : `class Pile extends ArrayList` ;
  - la **composition** (« a un ») : la classe contient un objet et lui **délègue** le travail.

  ```java
  class EnsembleCompte {
      private final Set<String> elements = new HashSet<>();   // composition
      private int ajouts;

      boolean ajouter(String e) {
          ajouts++;
          return elements.add(e);                             // délégation
      }
  }
  ```

  Pourquoi **préférer la composition** (*Effective Java*, item 18) :
  - l'héritage couple la sous-classe aux **détails d'implémentation** du parent : si `HashSet.addAll` appelle `add` en
    interne, une sous-classe qui compte dans les deux compte deux fois (**classe de base fragile**) ;
  - il expose **toute** l'API du parent, même ce qui n'a pas de sens pour l'enfant ;
  - il est figé à la compilation ; la composition se change à l'exécution (injection d'une stratégie) et se teste avec
    un double.

  L'héritage reste juste pour une vraie relation « est un », substituable, avec un parent **conçu pour être étendu**
  (documenté, méthodes `protected` prévues), ou bien `final`.

  **Agrégation et composition** : dans la composition au sens strict, l'objet contenu naît et meurt avec son
  conteneur ; dans l'agrégation, il existe indépendamment (un étudiant survit à la fermeture de son cours).

  **Piège classique** : hériter pour récupérer trois méthodes utiles. On hérite aussi des vingt autres, et de leurs
  futurs changements.

  **En entretien** : « Je préfère la composition : elle ne dépend que de l'API publique de l'objet utilisé ; l'héritage
  est réservé aux vraies relations "est un". »
cards:
  - key: preferer-composition
    format: course
    question: "Pourquoi préférer la composition à l'héritage ?"
    choices:
      - {text: "L'héritage couple fortement au parent et se fige ; la composition reste souple", correct: true}
      - {text: "La composition est plus rapide à l'exécution que les appels hérités", correct: false}
      - {text: "L'héritage interdit de redéfinir les méthodes du parent", correct: false}
      - {text: "La composition donne accès aux champs `private` de l'objet contenu", correct: false}
    answer: "L'héritage couple fortement la sous-classe aux détails du parent (classe de base fragile) et se fige à la compilation ; la composition est plus flexible. Ce n'est pas une question de performance."
  - key: agregation-vs-composition
    format: course
    question: "Quelle différence entre agrégation et composition ?"
    choices:
      - {text: "En agrégation, la partie survit au tout ; en composition, elle meurt avec lui", correct: true}
      - {text: "En composition, la partie survit au tout ; en agrégation, elle meurt avec lui", correct: false}
      - {text: "L'agrégation passe par l'héritage ; la composition, par un champ", correct: false}
      - {text: "Aucune : ce sont deux noms de la même relation en UML", correct: false}
    answer: "En agrégation, le contenu existe indépendamment du conteneur (un employé survit à son équipe) ; en composition, il naît et meurt avec lui (les lignes d'une commande)."
  - key: classe-base-fragile
    format: course
    question: Qu'est-ce que le problème de la classe de base fragile ?
    choices:
      - {text: "Un changement anodin du parent casse une sous-classe dont le code n'a pas bougé", correct: true}
      - {text: "Un parent sans constructeur public, que personne ne peut étendre", correct: false}
      - {text: "Une classe abstraite dont aucune sous-classe n'implémente les méthodes", correct: false}
      - {text: "Un parent qui lève une exception dès qu'une sous-classe le redéfinit", correct: false}
    answer: "Une sous-classe dépend des détails internes de son parent ; un changement anodin du parent (une méthode qui en appelle une autre) casse la sous-classe sans que son code ait bougé."
  - key: delegation
    format: course
    question: Qu'est-ce que la délégation ?
    choices:
      - {text: "Une classe contient un objet et lui transmet les appels qu'elle choisit d'exposer", correct: true}
      - {text: "Une sous-classe appelle `super` pour réutiliser le code de son parent", correct: false}
      - {text: "Une interface laisse ses implémentations écrire le code de ses méthodes", correct: false}
      - {text: "Un objet confie sa création à une fabrique statique de sa classe", correct: false}
    answer: "Une classe qui contient un objet et lui transmet les appels (`elements.add(e)`), en n'exposant que les opérations qu'elle choisit. Appeler `super`, c'est de l'héritage."
  - key: vf-heritage-reutilisation
    format: true-false
    question: L'héritage est la meilleure façon de réutiliser trois méthodes d'une classe existante.
    truth: false
    answer: On hérite aussi de toute son API et de ses détails internes ; la composition ne prend que ce qu'il faut.
  - key: vf-composition-execution
    format: true-false
    question: Avec la composition, on peut changer l'objet utilisé à l'exécution.
    truth: true
    answer: On peut injecter une autre implémentation, ou un double dans un test.
  - key: vf-est-un
    format: true-false
    question: Une `Voiture` qui étend `Moteur` respecte la relation « est un ».
    truth: false
    answer: "Une voiture **a** un moteur : c'est une composition."
  - key: vf-heritage-legitime
    format: true-false
    question: L'héritage reste pertinent pour une vraie relation « est un » avec un parent conçu pour être étendu.
    truth: true
    answer: La composition est un choix par défaut, pas une interdiction de l'héritage.
  - key: qcm-composition
    format: multiple-choice
    question: Lequel de ces codes utilise la composition ?
    choices:
      - text: "`class Pile { private final Deque<Integer> elements = new ArrayDeque<>(); }`"
        correct: true
      - text: "`class Pile extends ArrayDeque<Integer> { }`"
        correct: false
      - text: "`class Pile implements Deque<Integer> { }` sans aucun champ"
        correct: false
      - text: "`abstract class Pile { }`"
        correct: false
    answer: La pile **contient** un `Deque` et lui délègue le travail.
  - key: qcm-defauts-heritage
    format: multiple-choice
    question: "Quel reproche fait-on à l'héritage utilisé seulement pour réutiliser du code ?"
    choices:
      - {text: "Il expose toute l'API du parent, même ce qui n'a pas de sens", correct: true}
      - {text: "Il empêche d'appeler les méthodes du parent", correct: false}
      - {text: "Il interdit de redéfinir les méthodes du parent", correct: false}
      - {text: "Il oblige à recopier le code du parent dans l'enfant", correct: false}
    answer: "Il expose toute l'API du parent, dépend de ses détails internes et se fige à la compilation : d'où la règle « préférer la composition à l'héritage ». Il n'empêche pourtant pas d'appeler ni de redéfinir le parent."
  - key: qcm-compteur
    format: multiple-choice
    question: "Une sous-classe de `HashSet` compte les ajouts dans `add` et dans `addAll`. Après `addAll(List.of(\"a\", \"b\", \"c\"))`, le compteur vaut 6. Pourquoi ?"
    choices:
      - {text: "`HashSet.addAll` appelle `add` pour chaque élément, déjà redéfini", correct: true}
      - {text: "`addAll` ajoute chaque élément deux fois dans l'ensemble", correct: false}
      - {text: "Un `HashSet` garde les doublons ajoutés par `addAll`", correct: false}
      - {text: "Le compteur est `static`, partagé par tous les ensembles", correct: false}
    answer: "C'est l'exemple de la classe de base fragile : la sous-classe dépend d'un détail d'implémentation."
  - key: qcm-agregation
    format: multiple-choice
    question: Laquelle de ces relations est une agrégation plutôt qu'une composition ?
    choices:
      - text: "Une équipe et ses joueurs, qui existent sans elle"
        correct: true
      - text: "Une commande et ses lignes de commande"
        correct: false
      - text: "Une maison et ses pièces"
        correct: false
      - text: "Un document et ses paragraphes"
        correct: false
    answer: Dans l'agrégation, les éléments survivent au conteneur.
  - key: classe-base-8-sous-classes-chaque
    format: scenario
    question: "Une classe de base a 8 sous-classes, et chaque nouveau besoin ajoute une méthode dans la base. Que proposes-tu ?"
    choices:
      - {text: "Passer peu à peu à la composition : des comportements injectés par interfaces", correct: true}
      - {text: "Ajouter une neuvième sous-classe qui regroupe les nouveaux besoins", correct: false}
      - {text: "Rendre toutes les méthodes de la base `final`, pour la stabiliser", correct: false}
      - {text: "Fusionner les 8 sous-classes dans la base, avec des `if` sur le type", correct: false}
    answer: |-
      C'est de l'héritage sur-utilisé : la base devient un fourre-tout, et chaque ajout touche les 8 sous-classes
      (classe de base fragile). Je passe progressivement à la composition : chaque classe assemble des comportements
      injectés par interfaces (une stratégie pour ce qui varie), en commençant par ce qui varie le plus, avec des tests
      de caractérisation avant de toucher au code.
  - key: scenario-explosion-combinaisons
    format: scenario
    question: On a `Notification`, `NotificationEmail`, `NotificationSms`, et on veut maintenant chacune « urgente » ou « groupée ». Comment modélises-tu ?
    choices:
      - {text: "Une interface `Canal` (email, SMS) et des décorateurs pour l'urgence et le regroupement", correct: true}
      - {text: "Une sous-classe par combinaison, comme `NotificationEmailUrgente`", correct: false}
      - {text: "Un `enum` qui liste chaque combinaison, et un `switch` dans `envoyer`", correct: false}
      - {text: "Une classe `Notification` abstraite avec une méthode par combinaison", correct: false}
    answer: |-
      Par héritage, chaque combinaison deviendrait une classe (`NotificationEmailUrgente`, `NotificationSmsGroupee`...) :
      le nombre de classes explose. Je sépare les deux axes : un **canal** (`interface Canal`, avec `Email` et `Sms`) et
      des **décorateurs** (urgence, regroupement) qui enveloppent un canal : `new Groupee(new Urgente(new Email()))`.
      Chaque nouveau canal ou option ne demande qu'une classe.
  - key: scenario-heriter-framework
    format: scenario
    question: "Un collègue veut étendre une classe d'une bibliothèque tierce pour modifier un comportement. Que lui conseilles-tu ?"
    choices:
      - {text: "L'envelopper dans une classe à nous, derrière une interface à nous, et déléguer", correct: true}
      - {text: "L'étendre, mais redéfinir toutes ses méthodes pour maîtriser son comportement", correct: false}
      - {text: "Copier son code source dans le projet et le modifier directement", correct: false}
      - {text: "L'étendre sans crainte : c'est sûr tant que la classe n'est pas `final`", correct: false}
    answer: |-
      La classe n'est sans doute pas conçue pour l'extension : on dépendrait de détails internes qui peuvent changer à la
      prochaine version. Je l'enveloppe dans une classe à nous (adaptateur ou décorateur), derrière une interface à nous :
      la dépendance est isolée, remplaçable en test, et une mise à jour ne touche qu'un endroit.
  - key: scenario-quand-heriter
    format: scenario
    question: "Dans quel cas choisirais-tu l'héritage plutôt que la composition ?"
    choices:
      - {text: "Une relation « est un » vraie et stable, avec un parent conçu pour l'extension", correct: true}
      - {text: "Dès qu'une classe a besoin de quelques méthodes utiles d'une autre", correct: false}
      - {text: "Quand on veut exposer toute l'API d'une classe tierce sans l'écrire", correct: false}
      - {text: "Quand deux classes ont des champs de mêmes noms et de mêmes types", correct: false}
    answer: |-
      Quand la relation « est un » est vraie et stable, et que le parent est conçu pour l'extension : une hiérarchie
      scellée de types métier, ou une classe abstraite prévue pour ça (`AbstractList`). Tout code qui manipule le parent
      doit fonctionner avec l'enfant ; si je n'hérite que pour récupérer du code, je compose.
