notion: classes-imbriquees-static
lesson: |-
  Une **classe imbriquée `static`** est déclarée dans une autre classe, avec `static`. Elle n'est **liée à aucune
  instance** de l'englobante : c'est une classe ordinaire, rangée dans l'espace de noms de l'englobante.

  ```java
  public class Pizza {
      private final String taille;
      private final boolean fromage;

      private Pizza(Builder b) {        // seul le Builder construit une pizza
          taille = b.taille;
          fromage = b.fromage;
      }

      public static class Builder {
          private String taille = "M";
          private boolean fromage;

          public Builder taille(String t) { taille = t; return this; }
          public Builder fromage() { fromage = true; return this; }
          public Pizza construire() { return new Pizza(this); }
      }
  }

  Pizza p = new Pizza.Builder().taille("L").fromage().construire();
  ```

  - On la crée sans instance englobante : `new Pizza.Builder()`.
  - Elle accède aux membres `private` de l'englobante, y compris ses constructeurs, mais n'a **pas** de `this`
    englobant : pour lire un champ d'instance, il lui faut une référence.
  - Usages : le **Builder**, les nœuds d'une structure (`Node` dans `LinkedList`, `Map.Entry`), une classe d'aide
    utilisée seulement par l'englobante (déclarée alors `private`).

  C'est le **choix par défaut** pour une classe membre : on ne passe à une classe interne que si elle doit accéder à
  l'instance englobante.

  **Piège classique** : oublier `static` sur un `Builder` ou un nœud. Ça compile depuis les méthodes d'instance,
  mais chaque objet garde une référence inutile, et `new Pizza.Builder()` ne fonctionne plus.

  **En entretien** : « Une classe imbriquée `static` n'a pas de référence vers une instance englobante ; c'est le choix
  par défaut, la classe interne n'est justifiée que si elle a besoin de cette instance. »
cards:
  - key: classe-imbriquee-static-vs-classe-interne
    format: course
    question: Classe imbriquée static vs classe interne ?
    answer: La classe interne détient une référence vers l'instance englobante ; la static non.
  - key: creation
    format: course
    question: Comment crée-t-on un objet d'une classe imbriquée `static` ?
    answer: "Sans instance englobante : `new Externe.Imbriquee()`."
  - key: usages
    format: course
    question: Citez des usages typiques d'une classe imbriquée `static`.
    answer: Le Builder d'une classe, les nœuds d'une structure de données (`Map.Entry`, le `Node` de `LinkedList`), une classe d'aide `private` utilisée seulement par l'englobante.
  - key: choix-defaut
    format: course
    question: Faut-il déclarer une classe membre `static` ou non par défaut ?
    answer: '`static` par défaut ; une classe interne seulement si elle a besoin de l''instance englobante (*Effective Java*, item 24).'
  - key: vf-instance-englobante
    format: true-false
    question: Une classe imbriquée `static` garde une référence vers une instance de l'englobante.
    truth: false
    answer: C'est justement ce qui la distingue d'une classe interne.
  - key: vf-private-statique
    format: true-false
    question: Une classe imbriquée `static` peut appeler un constructeur `private` de l'englobante.
    truth: true
    answer: Elle fait partie de la même classe de premier niveau ; c'est ce qu'utilise le Builder.
  - key: vf-champ-instance
    format: true-false
    question: Une classe imbriquée `static` peut lire directement un champ d'instance de l'englobante.
    truth: false
    answer: Elle n'a pas d'instance englobante ; il lui faut une référence explicite vers un objet.
  - key: vf-map-entry
    format: true-false
    question: "`Map.Entry` est un type imbriqué dans l'interface `Map`."
    truth: true
    answer: Les types imbriqués dans une interface sont implicitement `static`.
  - key: qcm-creer
    format: multiple-choice
    question: Comment créer le `Builder`, classe imbriquée `static` de `Pizza` ?
    choices:
      - text: "`new Pizza.Builder()`"
        correct: true
      - text: "`new Pizza().new Builder()`"
        correct: false
      - text: "`Pizza.new Builder()`"
        correct: false
      - text: "`Pizza.Builder.create()`, obligatoirement"
        correct: false
    answer: Aucune pizza n'est nécessaire pour créer son builder.
  - key: qcm-acces
    format: multiple-choice
    question: À quoi une classe imbriquée `static` a-t-elle accès directement ?
    choices:
      - text: "Aux champs `private static` de l'englobante"
        correct: true
      - text: "Aux constructeurs `private` de l'englobante"
        correct: true
      - text: "Aux champs d'instance de l'englobante, sans référence"
        correct: false
      - text: "À `Externe.this`"
        correct: false
    answer: Elle a tous les droits d'accès, mais pas d'instance englobante.
  - key: qcm-choix
    format: multiple-choice
    question: Lesquelles de ces classes membres devraient être `static` ?
    choices:
      - text: "Le nœud d'une liste chaînée, qui ne lit que ses propres champs"
        correct: true
      - text: "Le Builder d'une classe immuable"
        correct: true
      - text: "L'itérateur qui parcourt les données de sa collection"
        correct: false
      - text: "Un écouteur qui modifie l'état de sa fenêtre"
        correct: false
    answer: Les deux dernières utilisent l'instance englobante.
  - key: qcm-private
    format: multiple-choice
    question: Une classe d'aide n'est utilisée que par sa classe englobante. Comment la déclarer ?
    choices:
      - text: "`private static class`"
        correct: true
      - text: "`public class`, dans un autre fichier"
        correct: false
      - text: "`protected class`"
        correct: false
      - text: "`public static class`"
        correct: false
    answer: '`private` la cache, `static` évite la référence inutile.'
  - key: code-noeud
    format: code-output
    question: |-
      ```java
      class Liste {
          static class Noeud {
              final int valeur;
              Noeud(int valeur) { this.valeur = valeur; }
          }
      }
      Liste.Noeud n = new Liste.Noeud(5);
      System.out.println(n.valeur);
      ```
    answer: '`5` : aucune liste n''est nécessaire pour créer un nœud.'
    check:
      output: "5"
  - key: code-champ-instance
    format: code-output
    question: |-
      ```java
      class Externe {
          int x;
          static class Imbriquee {
              int lire() { return x; }
          }
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `non-static variable x cannot be referenced from a static context`.'
    check:
      compiles: false
  - key: code-private-static
    format: code-output
    question: |-
      ```java
      class Externe {
          private static int secret = 42;
          static class Imbriquee {
              int lire() { return secret; }
          }
      }
      System.out.println(new Externe.Imbriquee().lire());
      ```
    answer: '`42` : la classe imbriquée lit le champ `private static` de l''englobante.'
    check:
      output: "42"
  - key: code-builder
    format: code-output
    question: |-
      ```java
      class Pizza {
          private final String taille;
          private final boolean fromage;
          private Pizza(Builder b) { taille = b.taille; fromage = b.fromage; }
          public String toString() { return taille + (fromage ? "+fromage" : ""); }
          static class Builder {
              private String taille = "M";
              private boolean fromage;
              Builder taille(String t) { taille = t; return this; }
              Builder fromage() { fromage = true; return this; }
              Pizza construire() { return new Pizza(this); }
          }
      }
      System.out.println(new Pizza.Builder().taille("L").fromage().construire());
      ```
    answer: '`L+fromage` : le builder imbriqué appelle le constructeur `private` de `Pizza`.'
    check:
      output: "L+fromage"
  - key: bug-builder-non-static
    format: bug-fix
    question: |-
      Ce code ne compile pas (`an enclosing instance that contains Pizza.Builder is required`) :
      ```java
      class Pizza {
          class Builder { ... }
      }
      Pizza p = new Pizza.Builder().taille("L").construire();
      ```
    answer: |-
      ```java
      class Pizza {
          static class Builder { ... }
      }
      ```
      Un builder sert justement à créer la première pizza : il ne peut pas dépendre d'une pizza existante. Il doit
      être `static`.
  - key: bug-reference-explicite
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      class Compte {
          private double solde;
          static class Releve {
              String imprimer() { return "Solde : " + solde; }
          }
      }
      ```
    answer: |-
      ```java
      class Compte {
          private double solde;
          static class Releve {
              private final Compte compte;
              Releve(Compte compte) { this.compte = compte; }
              String imprimer() { return "Solde : " + compte.solde; }
          }
      }
      ```
      Une classe `static` n'a pas d'instance englobante : on lui passe le compte explicitement (elle peut alors lire
      son champ `private`).
  - key: bug-classe-aide-publique
    format: bug-fix
    question: |-
      Une classe d'aide interne au calcul des tarifs est utilisée (et figée) par d'autres équipes :
      ```java
      public class Tarification {
          public static class Palier { ... }   // détail d'implémentation
      }
      ```
    answer: |-
      ```java
      public class Tarification {
          private static class Palier { ... }
      }
      ```
      Un détail d'implémentation imbriqué reste `private` : on peut le changer sans prévenir personne.
  - key: bug-noeud-interne
    format: bug-fix
    question: |-
      Chaque nœud d'une liste chaînée maison pèse une référence de plus que nécessaire :
      ```java
      class MaListe<T> {
          class Noeud {
              T valeur;
              Noeud suivant;
          }
      }
      ```
    answer: |-
      ```java
      class MaListe<T> {
          private static class Noeud<T> {
              T valeur;
              Noeud<T> suivant;
          }
      }
      ```
      Le nœud ne lit rien de sa liste : `static` supprime la référence cachée. Il devient générique, car il ne voit
      plus le `T` de la liste.
