notion: references-null
lesson: |-
  Une variable de type objet contient une **référence** : l'adresse d'un objet sur le tas, ou **`null`** (aucun objet).

  ```java
  StringBuilder a = new StringBuilder("x");
  StringBuilder b = a;          // b est un alias : même objet
  b.append("y");
  System.out.println(a);        // xy

  String nom = null;
  nom.length();                 // NullPointerException
  ```

  - **Affecter** une référence copie l'adresse, pas l'objet : `a` et `b` sont deux **alias** du même objet.
  - Appeler une méthode ou lire un champ sur `null` lève une **`NullPointerException`**. Depuis Java 14, son message
    précise quelle expression valait `null` (*helpful NullPointerExceptions*).
  - `null` se compare avec `==` ; `null instanceof X` vaut `false` ; la concaténation `"a" + null` donne `"anull"`.
  - Se protéger : valider tôt (`Objects.requireNonNull`), renvoyer une collection vide plutôt que `null`, écrire
    `"ACTIF".equals(statut)`, utiliser `Optional` en retour quand l'absence est normale.

  **Piège classique** : le déballage automatique d'un `Integer` qui vaut `null`, par exemple le résultat de
  `map.get(cle)` rangé dans un `int`. La `NullPointerException` surgit sur une ligne qui ne contient aucun appel.

  **En entretien** : « Une référence peut valoir `null` ; on évite les NPE en validant à l'entrée, en ne renvoyant
  jamais `null` pour une collection et en réservant `Optional` aux valeurs de retour. »
cards:
  - key: reference-vs-objet
    format: course
    question: Que contient une variable de type objet ?
    answer: Une référence vers un objet du tas, ou `null` ; jamais l'objet lui-même.
  - key: alias
    format: course
    question: Que se passe-t-il quand on écrit `b = a` avec deux variables de type objet ?
    answer: "La référence est copiée : `a` et `b` désignent le même objet, et une modification par l'une se voit par l'autre."
  - key: eviter-npe
    format: course
    question: Comment limiter les `NullPointerException` ?
    answer: Valider les arguments tôt (`Objects.requireNonNull`), renvoyer des collections vides plutôt que `null`, comparer avec la constante en premier (`"X".equals(v)`), utiliser `Optional` en retour quand l'absence est attendue.
  - key: helpful-npe
    format: course
    question: Qu'apportent les *helpful NullPointerExceptions* de Java 14 ?
    answer: Un message qui dit quelle expression valait `null` et ce qu'on voulait en faire, par exemple `Cannot invoke "String.length()" because "nom" is null`.
  - key: vf-copie-objet
    format: true-false
    question: "`b = a;` crée une copie de l'objet référencé par `a`."
    truth: false
    answer: Seule la référence est copiée ; il n'y a toujours qu'un objet.
  - key: vf-instanceof-null
    format: true-false
    question: "`null instanceof String` vaut `false`."
    truth: true
    answer: '`instanceof` renvoie toujours `false` pour `null`, sans exception.'
  - key: vf-concatenation-null
    format: true-false
    question: "`\"a\" + null` lève une `NullPointerException`."
    truth: false
    answer: "La concaténation écrit `null` en toutes lettres : `\"anull\"`."
  - key: vf-null-egal-null
    format: true-false
    question: "`null == null` vaut `true`."
    truth: true
    answer: Deux références nulles sont égales au sens de `==`.
  - key: qcm-npe
    format: multiple-choice
    question: Avec `String s = null;`, quelles instructions lèvent une `NullPointerException` ?
    choices:
      - text: "`s.length()`"
        correct: true
      - text: "`s.equals(\"x\")`"
        correct: true
      - text: "`\"x\".equals(s)`"
        correct: false
      - text: "`System.out.println(s)`"
        correct: false
    answer: Seul un appel **sur** `s` échoue ; passer `null` en argument est permis.
  - key: qcm-retour-collection
    format: multiple-choice
    question: Une méthode ne trouve aucune commande. Que doit-elle renvoyer, si son type de retour est `List<Commande>` ?
    choices:
      - text: "Une liste vide (`List.of()`)"
        correct: true
      - text: "`null`"
        correct: false
      - text: "Une exception"
        correct: false
      - text: "Une liste contenant `null`"
        correct: false
    answer: L'appelant peut itérer sans tester ; `null` l'obligerait à vérifier à chaque fois.
  - key: qcm-unboxing
    format: multiple-choice
    question: "Pourquoi `int stock = stocks.get(\"pomme\");` peut-il lever une `NullPointerException` ?"
    choices:
      - text: "`get` renvoie `null` si la clé manque, et le déballage en `int` échoue"
        correct: true
      - text: "`stocks` n'est pas initialisée"
        correct: false
      - text: "Une `Map` ne peut pas contenir d'`Integer`"
        correct: false
      - text: "`\"pomme\"` vaut `null`"
        correct: false
    answer: '`getOrDefault("pomme", 0)` évite le problème.'
  - key: qcm-requirenonnull
    format: multiple-choice
    question: Que fait `Objects.requireNonNull(client, "client")` ?
    choices:
      - text: "Renvoie `client`, ou lève une `NullPointerException` de message « client » s'il est `null`"
        correct: true
      - text: "Remplace `client` par un objet vide s'il est `null`"
        correct: false
      - text: "Renvoie `false` si `client` est `null`"
        correct: false
      - text: "Ne compile qu'avec un `Optional`"
        correct: false
    answer: Il fait échouer tôt et clairement, au lieu d'une NPE plus loin.
  - key: code-string-valueof-object-null-string
    format: code-output
    question: '`String.valueOf((Object) null)` et `String.valueOf((char[]) null)` ?'
    answer: '`"null"` et NullPointerException. Attention : `String.valueOf(null)` sans cast choisit la surcharge `char[]` (la plus spécifique) et lève une NPE.'
    check:
      code: |-
        System.out.println(String.valueOf((Object) null));
        System.out.println(String.valueOf((char[]) null));
      output: "null"
      throws: NullPointerException
  - key: code-int-1-2-3-int
    format: code-output
    question: '`int[] a = {1, 2, 3}; int[] b = a; b[0] = 9; System.out.println(a[0]);`'
    answer: '`9` : les deux variables référencent le même tableau.'
    check:
      code: |-
        int[] a = {1, 2, 3}; int[] b = a; b[0] = 9; System.out.println(a[0]);
      output: "9"
  - key: code-alias-builder
    format: code-output
    question: |-
      ```java
      StringBuilder a = new StringBuilder("x");
      StringBuilder b = a;
      b.append("y");
      b = new StringBuilder("z");
      System.out.println(a + " " + b);
      ```
    answer: '`xy z` : `append` modifie l''objet partagé, puis `b` est redirigée vers un nouvel objet sans toucher `a`.'
    check:
      output: "xy z"
  - key: code-null-operations
    format: code-output
    question: |-
      ```java
      String s = null;
      System.out.println(s + "!");
      System.out.println(s instanceof String);
      System.out.println(s.length());
      ```
    answer: '`null!`, puis `false`, puis une `NullPointerException`.'
    check:
      output: |-
        null!
        false
      throws: NullPointerException
  - key: bug-equals-constante
    format: bug-fix
    question: |-
      Ce test lève une `NullPointerException` quand le statut n'est pas renseigné :
      ```java
      if (commande.statut().equals("PAYEE")) {
          expedier(commande);
      }
      ```
    answer: |-
      ```java
      if ("PAYEE".equals(commande.statut())) {
          expedier(commande);
      }
      ```
      La constante ne vaut jamais `null` ; `equals(null)` renvoie simplement `false`. (Mieux encore : une enum.)
  - key: bug-retour-null
    format: bug-fix
    question: |-
      Plusieurs appelants plantent sur `for (Commande c : commandes(client))` :
      ```java
      List<Commande> commandes(Client client) {
          if (client.estNouveau()) {
              return null;
          }
          return depot.trouver(client);
      }
      ```
    answer: |-
      ```java
      List<Commande> commandes(Client client) {
          if (client.estNouveau()) {
              return List.of();
          }
          return depot.trouver(client);
      }
      ```
      Une collection vide dit « rien » sans obliger chaque appelant à tester `null`.
  - key: bug-get-unboxing
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` pour un produit absent :
      ```java
      int quantite = stocks.get(produit);
      ```
    answer: |-
      ```java
      int quantite = stocks.getOrDefault(produit, 0);
      ```
      `get` renvoie `null` pour une clé absente, et son déballage en `int` échoue.
  - key: bug-chaine-appels
    format: bug-fix
    question: |-
      Ce code plante pour un client sans adresse :
      ```java
      String ville = client.adresse().ville();
      ```
      où `adresse()` renvoie `null` si l'adresse n'est pas connue.
    answer: |-
      ```java
      // adresse() renvoie désormais un Optional<Adresse>
      String ville = client.adresse()
              .map(Adresse::ville)
              .orElse("inconnue");
      ```
      Quand l'absence est un cas normal, `Optional` en retour oblige l'appelant à la traiter, au lieu d'une NPE
      surprise.
  - key: definition-npe
    format: definition
    question: NPE
    answer: NullPointerException
  - key: definition-reference
    format: definition
    question: Référence
    answer: La valeur d'une variable de type objet, qui désigne un objet du tas (ou `null`).
  - key: definition-alias
    format: definition
    question: Alias
    answer: Deux variables ou plus qui référencent le même objet.
  - key: definition-null
    format: definition
    question: "`null`"
    answer: La référence qui ne désigne aucun objet.
