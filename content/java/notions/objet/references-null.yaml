notion: references-null
cards:
  - key: code-string-valueof-object-null-string
    format: code-output
    question: '`String.valueOf((Object) null)` et `String.valueOf((char[]) null)` ?'
    answer: '`"null"` et NullPointerException. Attention : `String.valueOf(null)` sans cast choisit la surcharge `char[]` (la plus spécifique) et lève une NPE.'
  - key: code-int-1-2-3-int
    format: code-output
    question: '`int[] a = {1, 2, 3}; int[] b = a; b[0] = 9; System.out.println(a[0]);`'
    answer: '`9` : les deux variables référencent le même tableau.'
  - key: definition-npe
    format: definition
    question: NPE
    answer: NullPointerException
