notion: references-null
lesson: |-
  Une variable de type objet contient une **référence** : l'adresse d'un objet sur le tas, ou **`null`** (aucun objet).

  ```java
  StringBuilder a = new StringBuilder("x");
  StringBuilder b = a;          // b est un alias : même objet
  b.append("y");
  System.out.println(a);        // xy

  String nom = null;
  nom.length();                 // NullPointerException
  ```

  - **Affecter** une référence copie l'adresse, pas l'objet : `a` et `b` sont deux **alias** du même objet.
  - Appeler une méthode ou lire un champ sur `null` lève une **`NullPointerException`**. Depuis Java 14, son message
    précise quelle expression valait `null` (*helpful NullPointerExceptions*).
  - `null` se compare avec `==` ; `null instanceof X` vaut `false` ; la concaténation `"a" + null` donne `"anull"`.
  - Se protéger : valider tôt (`Objects.requireNonNull`), renvoyer une collection vide plutôt que `null`, écrire
    `"ACTIF".equals(statut)`, utiliser `Optional` en retour quand l'absence est normale.

  **Piège classique** : le déballage automatique d'un `Integer` qui vaut `null`, par exemple le résultat de
  `map.get(cle)` rangé dans un `int`. La `NullPointerException` surgit sur une ligne qui ne contient aucun appel.

  **En entretien** : « Une référence peut valoir `null` ; on évite les NPE en validant à l'entrée, en ne renvoyant
  jamais `null` pour une collection et en réservant `Optional` aux valeurs de retour. »
tour:
  - title: Références et null
    text: |-
      Plusieurs variables peuvent désigner le **même objet** : ce sont des alias, et une modification par l'une se voit
      par toutes.

      Une référence `null` ne désigne rien : s'en servir lève une `NullPointerException`, dont le message dit
      précisément ce qui valait `null`. On s'en protège en vérifiant, ou mieux, en ne laissant pas `null` entrer :
      `Objects.requireNonNull` à l'entrée d'une méthode, ou `Optional` pour un résultat qui peut manquer.
    example:
      files:
        Main.java: |-
          class Boite {
              String contenu;
          }

          Boite trouve(String piece) {
              return null;
          }

          void main() {
              Boite a = new Boite();
              Boite b = a;
              b.contenu = "livres";
              IO.println(a.contenu);

              try {
                  IO.println(trouve("cave").contenu);
              } catch (NullPointerException e) {
                  IO.println(e.getMessage());
              }
          }
      output: |-
        livres
        Cannot read field "contenu" because the return value of "Main.trouve(String)" is null
cards:
  - key: reference-vs-objet
    format: course
    question: Que contient une variable de type objet ?
    choices:
      - {text: "Une référence vers un objet du tas, ou `null`", correct: true}
      - {text: "L'objet lui-même, copié dans la pile du thread", correct: false}
      - {text: "Une copie de tous les champs de l'objet", correct: false}
      - {text: "Le nom de la classe et le `hashCode` de l'objet", correct: false}
    answer: Une référence vers un objet du tas, ou `null` ; jamais l'objet lui-même.
  - key: alias
    format: course
    question: Que se passe-t-il quand on écrit `b = a` avec deux variables de type objet ?
    choices:
      - {text: "`a` et `b` désignent le même objet : une modification par l'une se voit par l'autre", correct: true}
      - {text: "L'objet est copié : `a` et `b` désignent deux objets indépendants", correct: false}
      - {text: "`b` reçoit une copie superficielle de `a`, comme avec `clone()`", correct: false}
      - {text: "`a` devient `null`, car la référence est déplacée vers `b`", correct: false}
    answer: "La référence est copiée : `a` et `b` désignent le même objet, et une modification par l'une se voit par l'autre."
  - key: eviter-npe
    format: course
    question: "Quelle pratique limite les `NullPointerException` ?"
    choices:
      - {text: "Valider tôt avec `requireNonNull`, et renvoyer des collections vides plutôt que `null`", correct: true}
      - {text: "Entourer chaque appel d'un `try` qui attrape la `NullPointerException`", correct: false}
      - {text: "Initialiser chaque champ à `null` explicitement dans le constructeur", correct: false}
      - {text: "Comparer avec `v.equals(\"X\")` plutôt qu'avec `\"X\".equals(v)`", correct: false}
    answer: "Valider les arguments tôt (`Objects.requireNonNull`), renvoyer des collections vides plutôt que `null`, comparer avec la constante en premier (`\"X\".equals(v)`), et utiliser `Optional` en retour quand l'absence est attendue. Attraper la NPE ne fait que cacher le bug."
  - key: helpful-npe
    format: course
    question: Qu'apportent les *helpful NullPointerExceptions* de Java 14 ?
    choices:
      - {text: "Un message qui dit quelle expression valait `null` et ce qu'on voulait en faire", correct: true}
      - {text: "Une exception vérifiée, que le compilateur oblige à traiter", correct: false}
      - {text: "La valeur par défaut à utiliser à la place de la référence nulle", correct: false}
      - {text: "Une NPE qui ne remonte plus la pile d'appels, pour aller plus vite", correct: false}
    answer: Un message qui dit quelle expression valait `null` et ce qu'on voulait en faire, par exemple `Cannot invoke "String.length()" because "nom" is null`.
  - key: vf-copie-objet
    format: true-false
    question: "`b = a;` crée une copie de l'objet référencé par `a`."
    truth: false
    answer: Seule la référence est copiée ; il n'y a toujours qu'un objet.
  - key: vf-instanceof-null
    format: true-false
    question: "`null instanceof String` vaut `false`."
    truth: true
    answer: '`instanceof` renvoie toujours `false` pour `null`, sans exception.'
  - key: vf-concatenation-null
    format: true-false
    question: "Avec `String nom = null;`, l'expression `\"Bonjour \" + nom` lève une `NullPointerException`."
    truth: false
    answer: "La concaténation écrit `null` en toutes lettres : `\"Bonjour null\"`."
  - key: vf-null-egal-null
    format: true-false
    question: "`null == null` vaut `true`."
    truth: true
    answer: Deux références nulles sont égales au sens de `==`.
  - key: qcm-npe
    format: multiple-choice
    question: "Avec `String s = null;`, laquelle de ces instructions lève une `NullPointerException` ?"
    choices:
      - {text: "`s.length()`", correct: true}
      - {text: "`\"x\".equals(s)`", correct: false}
      - {text: "`System.out.println(s)`", correct: false}
      - {text: "`String t = s + \"!\";`", correct: false}
    answer: "Seul un appel **sur** `s` échoue ; passer `null` en argument ou le concaténer est permis (la concaténation écrit `null`)."
  - key: qcm-retour-collection
    format: multiple-choice
    question: Une méthode ne trouve aucune commande. Que doit-elle renvoyer, si son type de retour est `List<Commande>` ?
    choices:
      - text: "Une liste vide (`List.of()`)"
        correct: true
      - text: "`null`"
        correct: false
      - text: "Une exception"
        correct: false
      - text: "Une liste contenant `null`"
        correct: false
    answer: L'appelant peut itérer sans tester ; `null` l'obligerait à vérifier à chaque fois.
  - key: qcm-unboxing
    format: multiple-choice
    question: "Pourquoi `int stock = stocks.get(\"pomme\");` peut-il lever une `NullPointerException` ?"
    choices:
      - {text: "`get` renvoie `null` si la clé manque, et le déballage en `int` échoue", correct: true}
      - {text: "`stocks` n'est pas initialisée tant qu'on n'y a rien ajouté", correct: false}
      - {text: "Une `Map` ne peut pas contenir d'`Integer`, seulement des `int`", correct: false}
      - {text: "`\"pomme\"` vaut `null` tant que la chaîne n'est pas internée", correct: false}
    answer: '`getOrDefault("pomme", 0)` évite le problème.'
  - key: qcm-requirenonnull
    format: multiple-choice
    question: Que fait `Objects.requireNonNull(client, "client")` ?
    choices:
      - {text: "Renvoie `client`, ou lève une `NullPointerException` de message « client » s'il est `null`", correct: true}
      - {text: "Remplace `client` par un objet vide, créé avec son constructeur par défaut, s'il est `null`", correct: false}
      - {text: "Renvoie `false` si `client` est `null` et `true` sinon, sans jamais lever d'exception", correct: false}
      - {text: "Lève une `IllegalArgumentException` de message « client » si `client` est `null`", correct: false}
    answer: Il fait échouer tôt et clairement, au lieu d'une NPE plus loin.
  - key: code-string-valueof-object-null-string
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(String.valueOf((Object) null));
      System.out.println(String.valueOf((char[]) null));
      ```
    choices:
      - {text: "`null`, puis une `NullPointerException`", correct: true}
      - text: |-
          ```
          null
          null
          ```
        correct: false
      - {text: "Une `NullPointerException` dès la première ligne", correct: false}
      - {text: "`null`, puis une ligne vide", correct: false}
    answer: '`"null"` et NullPointerException. Attention : `String.valueOf(null)` sans cast choisit la surcharge `char[]` (la plus spécifique) et lève une NPE.'
    check:
      code: |-
        System.out.println(String.valueOf((Object) null));
        System.out.println(String.valueOf((char[]) null));
      output: "null"
      throws: NullPointerException
  - key: code-int-1-2-3-int
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] a = {1, 2, 3};
      int[] b = a;
      b[0] = 9;
      System.out.println(a[0]);
      ```
    choices:
      - {text: "`9`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`[9, 2, 3]`", correct: false}
    answer: '`9` : les deux variables référencent le même tableau.'
    check:
      code: |-
        int[] a = {1, 2, 3}; int[] b = a; b[0] = 9; System.out.println(a[0]);
      output: "9"
  - key: code-alias-builder
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      StringBuilder a = new StringBuilder("x");
      StringBuilder b = a;
      b.append("y");
      b = new StringBuilder("z");
      System.out.println(a + " " + b);
      ```
    choices:
      - {text: "`xy z`", correct: true}
      - {text: "`x z`", correct: false}
      - {text: "`z z`", correct: false}
      - {text: "`xy xy`", correct: false}
    answer: '`xy z` : `append` modifie l''objet partagé, puis `b` est redirigée vers un nouvel objet sans toucher `a`.'
    check:
      output: "xy z"
  - key: code-null-operations
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = null;
      System.out.println(s + "!");
      System.out.println(s instanceof String);
      System.out.println(s.length());
      ```
    choices:
      - {text: "`null!`, puis `false`, puis une `NullPointerException`", correct: true}
      - {text: "Une `NullPointerException` dès la première ligne", correct: false}
      - {text: "`null!`, puis `true`, puis une `NullPointerException`", correct: false}
      - {text: "`null!`, puis `false`, puis `0`", correct: false}
    answer: '`null!`, puis `false`, puis une `NullPointerException`.'
    check:
      output: |-
        null!
        false
      throws: NullPointerException
  - key: bug-equals-constante
    format: bug-fix
    question: |-
      Ce test lève une `NullPointerException` quand le statut n'est pas renseigné :
      ```java
      if (commande.statut().equals("PAYEE")) {
          expedier(commande);
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `\"PAYEE\".equals(commande.statut())`, la constante en premier", correct: true}
      - {text: "Écrire `commande.statut() == \"PAYEE\"` pour éviter l'appel de méthode", correct: false}
      - {text: "Entourer le test d'un `try` qui attrape la `NullPointerException`", correct: false}
      - {text: "Écrire `commande.statut().equalsIgnoreCase(\"PAYEE\")`", correct: false}
    answer: |-
      ```java
      if ("PAYEE".equals(commande.statut())) {
          expedier(commande);
      }
      ```
      La constante ne vaut jamais `null` ; `equals(null)` renvoie simplement `false`. (Mieux encore : une enum.)
  - key: bug-retour-null
    format: bug-fix
    question: |-
      Plusieurs appelants plantent sur `for (Commande c : commandes(client))` :
      ```java
      List<Commande> commandes(Client client) {
          if (client.estNouveau()) {
              return null;
          }
          return depot.trouver(client);
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renvoyer `List.of()` au lieu de `null` pour un nouveau client", correct: true}
      - {text: "Demander à chaque appelant de tester `null` avant sa boucle", correct: false}
      - {text: "Lever une `NullPointerException` explicite pour un nouveau client", correct: false}
      - {text: "Renvoyer un `Optional<List<Commande>>` vide pour un nouveau client", correct: false}
    answer: |-
      ```java
      List<Commande> commandes(Client client) {
          if (client.estNouveau()) {
              return List.of();
          }
          return depot.trouver(client);
      }
      ```
      Une collection vide dit « rien » sans obliger chaque appelant à tester `null`.
  - key: bug-get-unboxing
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` pour un produit absent :
      ```java
      int quantite = stocks.get(produit);
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`int quantite = stocks.getOrDefault(produit, 0);`", correct: true}
      - {text: "`int quantite = (int) stocks.get(produit);`", correct: false}
      - {text: "`int quantite = stocks.get(produit).intValue();`", correct: false}
      - {text: "`int quantite = Integer.valueOf(stocks.get(produit));`", correct: false}
    answer: |-
      ```java
      int quantite = stocks.getOrDefault(produit, 0);
      ```
      `get` renvoie `null` pour une clé absente, et son déballage en `int` échoue.
  - key: bug-chaine-appels
    format: bug-fix
    question: |-
      Ce code plante pour un client sans adresse :
      ```java
      String ville = client.adresse().ville();
      ```
      où `adresse()` renvoie `null` si l'adresse n'est pas connue.
      Quelle correction est la bonne ?
    choices:
      - {text: "Faire renvoyer un `Optional<Adresse>` à `adresse()`, puis `map` et `orElse`", correct: true}
      - {text: "Attraper la `NullPointerException` et renvoyer « inconnue »", correct: false}
      - {text: "Appeler `Objects.requireNonNull(client)` juste avant la ligne", correct: false}
      - {text: "Initialiser `ville` à `null` avant l'appel, par précaution", correct: false}
    answer: |-
      ```java
      // adresse() renvoie désormais un Optional<Adresse>
      String ville = client.adresse()
              .map(Adresse::ville)
              .orElse("inconnue");
      ```
      Quand l'absence est un cas normal, `Optional` en retour oblige l'appelant à la traiter, au lieu d'une NPE
      surprise.
  - key: definition-npe
    format: definition
    question: "Que signifie le sigle NPE ?"
    choices:
      - {text: "`NullPointerException`, levée quand on utilise une référence `null`", correct: true}
      - {text: "`NoPermissionException`, levée quand un accès est refusé", correct: false}
      - {text: "`NumberParseException`, levée quand une chaîne n'est pas un nombre", correct: false}
      - {text: "`NativePointerError`, levée quand la mémoire native est épuisée", correct: false}
    answer: "NPE = `NullPointerException` : elle est levée quand on appelle une méthode ou qu'on lit un champ sur une référence `null`."
  - key: definition-reference
    format: definition
    question: "Qu'appelle-t-on la référence d'un objet, en Java ?"
    choices:
      - {text: "La valeur d'une variable de type objet, qui désigne un objet du tas ou `null`", correct: true}
      - {text: "Une copie de l'objet, rangée dans la pile du thread qui l'utilise", correct: false}
      - {text: "L'adresse mémoire brute de l'objet, qu'on peut incrémenter comme en C", correct: false}
      - {text: "Le nom de la classe de l'objet, utilisé par le ramasse-miettes", correct: false}
    answer: "La valeur d'une variable de type objet, qui désigne un objet du tas (ou `null`). Contrairement à un pointeur C, on ne peut ni la lire comme une adresse ni faire de calcul dessus."
  - key: definition-alias
    format: definition
    question: "Que désigne un alias, pour des objets Java ?"
    choices:
      - {text: "Deux variables ou plus qui référencent le même objet", correct: true}
      - {text: "Deux objets distincts dont tous les champs sont égaux", correct: false}
      - {text: "Un second nom donné à une classe lors de son import", correct: false}
      - {text: "Une copie d'un objet obtenue avec la méthode `clone()`", correct: false}
    answer: "Deux variables ou plus qui référencent le même objet : une modification faite par l'une se voit par l'autre."
  - key: definition-null
    format: definition
    question: "Que représente la valeur `null` pour une variable de type objet ?"
    choices:
      - {text: "Une référence qui ne désigne aucun objet", correct: true}
      - {text: "Un objet vide, dont tous les champs valent 0", correct: false}
      - {text: "La valeur entière 0, comme en C", correct: false}
      - {text: "Une variable qui n'a pas encore été déclarée", correct: false}
    answer: La référence qui ne désigne aucun objet.
