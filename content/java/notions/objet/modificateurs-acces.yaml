notion: modificateurs-acces
lesson: |-
  Quatre niveaux d'accès, du plus fermé au plus ouvert :

  | Modificateur | Classe | Package | Sous-classe (autre package) | Partout |
  |---|---|---|---|---|
  | `private` | ✓ | | | |
  | *(aucun)* : package-private | ✓ | ✓ | | |
  | `protected` | ✓ | ✓ | ✓ | |
  | `public` | ✓ | ✓ | ✓ | ✓ |

  ```java
  public class Compte {            // visible partout
      private double solde;        // seulement dans Compte
      int version;                 // dans le package
      protected void journaliser() { }  // package + sous-classes
      public double solde() { return solde; }
  }
  ```

  - Une classe **de premier niveau** est `public` ou package-private, jamais `private` ni `protected` ; un fichier a au
    plus une classe `public`, qui porte son nom.
  - Une redéfinition ne peut **pas réduire** la visibilité (une méthode `public` reste `public`).
  - Les méthodes d'une interface sont `public` par défaut, ses champs `public static final`.
  - Avec les modules (Java 9), `public` ne sort du module que si son package est **exporté**.

  Règle de conception : **le moins visible possible**. Tout ce qui est `private` peut changer sans casser personne.

  **Piège classique** : croire que `protected` est plus restrictif que l'absence de modificateur. C'est l'inverse :
  `protected` ajoute les sous-classes des autres packages au package.

  **En entretien** : « private, package-private, protected, public ; on part du plus fermé et on n'ouvre que ce qui
  fait partie du contrat. »
tour:
  - title: Les modificateurs d'accès
    text: |-
      Quatre niveaux d'accès, du plus fermé au plus ouvert :

      - `private` : la classe seulement ;
      - sans mot-clé (*package-private*) : les classes du même package ;
      - `protected` : le package, plus les sous-classes ;
      - `public` : tout le monde.

      On donne à chaque membre l'accès le plus restreint qui suffit : des champs `private`, et `public` pour ce que la
      classe offre vraiment.

      Essaie : dans `Main.java`, lis `compteur.valeur` au lieu d'appeler `compteur.valeur()`.
    example:
      files:
        Main.java: |-
          void main() {
              Compteur compteur = new Compteur();
              compteur.incremente();
              compteur.incremente();
              IO.println(compteur.valeur());
          }
        Compteur.java: |-
          public class Compteur {
              private int valeur;

              public void incremente() {
                  valeur++;
              }

              public int valeur() {
                  return valeur;
              }
          }
      output: |-
        2
cards:
  - key: package-private
    format: course
    question: Comment fait-on du package-private ?
    answer: En ne mettant aucun modificateur.
  - key: declarer-classe-premier-niveau-private
    format: course
    question: Peut-on déclarer une classe de premier niveau private ?
    answer: 'Non : public ou package-private uniquement.'
  - key: protected
    format: course
    question: Qui peut accéder à un membre `protected` ?
    answer: La classe, tout son package, et les sous-classes situées dans d'autres packages.
  - key: moindre-visibilite
    format: course
    question: Pourquoi choisir la visibilité la plus restreinte possible ?
    answer: Ce qui est privé peut être modifié sans casser de code extérieur ; chaque membre public devient un contrat qu'il faut maintenir.
  - key: vf-protected-restrictif
    format: true-false
    question: "`protected` est plus restrictif que l'absence de modificateur."
    truth: false
    answer: '`protected` ajoute les sous-classes des autres packages : il est plus ouvert que package-private.'
  - key: vf-reduire-visibilite
    format: true-false
    question: Une sous-classe peut redéfinir une méthode `public` en la rendant `protected`.
    truth: false
    answer: Une redéfinition ne peut pas réduire la visibilité ; elle peut seulement l'élargir.
  - key: vf-interface-public
    format: true-false
    question: Une méthode abstraite déclarée sans modificateur dans une interface est `public`.
    truth: true
    answer: Les méthodes abstraites d'une interface sont implicitement `public abstract`.
  - key: vf-plusieurs-public
    format: true-false
    question: Un fichier `.java` peut contenir deux classes `public` de premier niveau.
    truth: false
    answer: Au plus une, qui porte le nom du fichier.
  - key: qcm-private
    format: multiple-choice
    question: Qui peut lire un champ `private` de la classe `Compte` ?
    choices:
      - text: "Le code de la classe `Compte`, y compris ses classes imbriquées"
        correct: true
      - text: "Les autres classes du même package"
        correct: false
      - text: "Les sous-classes de `Compte`"
        correct: false
      - text: "Tout le monde, par un getter implicite"
        correct: false
    answer: '`private` limite l''accès au corps de la classe de premier niveau.'
  - key: qcm-ordre
    format: multiple-choice
    question: Quel ordre va du plus fermé au plus ouvert ?
    choices:
      - text: "`private`, package-private, `protected`, `public`"
        correct: true
      - text: "`private`, `protected`, package-private, `public`"
        correct: false
      - text: "package-private, `private`, `protected`, `public`"
        correct: false
      - text: "`protected`, `private`, package-private, `public`"
        correct: false
    answer: '`protected` inclut tout le package, plus les sous-classes.'
  - key: qcm-classe-premier-niveau
    format: multiple-choice
    question: Quels modificateurs d'accès une classe de premier niveau peut-elle avoir ?
    choices:
      - text: "`public`"
        correct: true
      - text: "Aucun (package-private)"
        correct: true
      - text: "`private`"
        correct: false
      - text: "`protected`"
        correct: false
    answer: '`private` et `protected` n''ont de sens que pour un membre d''une autre classe.'
  - key: qcm-module
    format: multiple-choice
    question: Avec les modules Java, quand une classe `public` est-elle visible depuis un autre module ?
    choices:
      - text: "Quand son package est exporté (`exports`) par son module"
        correct: true
      - text: "Toujours, `public` suffit"
        correct: false
      - text: "Jamais"
        correct: false
      - text: "Seulement par réflexion"
        correct: false
    answer: "Le module ajoute un niveau : `public` et exporté."
  - key: trous-private
    format: fill-in
    question: |-
      Complétez pour que le solde ne soit accessible qu'à l'intérieur de la classe :
      ```java
      public class Compte {
          ___ double solde;
      }
      ```
    blanks: [[private]]
    answer: Le solde n'est modifiable que par les méthodes de `Compte`, qui garantissent ses règles.
  - key: trous-protected
    format: fill-in
    question: |-
      Complétez pour que les sous-classes, même dans d'autres packages, puissent redéfinir cette méthode sans qu'elle
      soit publique :
      ```java
      ___ abstract double calculerRemise();
      ```
    blanks: [[protected]]
    answer: '`protected` ouvre la méthode aux sous-classes sans l''exposer à tous.'
  - key: trous-public
    format: fill-in
    question: |-
      Complétez pour que toutes les classes puissent appeler cette méthode :
      ```java
      ___ double solde() { return solde; }
      ```
    blanks: [[public]]
    answer: '`public` fait de la méthode une partie du contrat de la classe.'
  - key: trous-package-private
    format: fill-in
    question: |-
      Complétez le modificateur que le compilateur ajoute implicitement à cette méthode d'interface :
      ```java
      interface Forme {
          ___ abstract double aire();
      }
      ```
    blanks: [[public]]
    answer: Les méthodes abstraites d'une interface sont implicitement `public abstract`.
  - key: bug-champ-public
    format: bug-fix
    question: |-
      Des soldes négatifs apparaissent, alors que `retirer` les refuse :
      ```java
      public class Compte {
          public double solde;
          public void retirer(double montant) {
              if (montant > solde) throw new IllegalStateException("solde insuffisant");
              solde -= montant;
          }
      }
      ```
    answer: |-
      ```java
      public class Compte {
          private double solde;
          ...
      }
      ```
      Un champ `public` laisse n'importe quel code écrire `compte.solde = -500` sans passer par `retirer`. En le
      rendant `private`, la règle ne peut plus être contournée.
  - key: bug-reduire-visibilite
    format: bug-fix
    question: |-
      Ce code ne compile pas (`attempting to assign weaker access privileges`) :
      ```java
      class Animal {
          public String cri() { return "..."; }
      }
      class Chat extends Animal {
          protected String cri() { return "miaou"; }
      }
      ```
    answer: |-
      ```java
      class Chat extends Animal {
          @Override
          public String cri() { return "miaou"; }
      }
      ```
      Une redéfinition ne peut pas réduire la visibilité : un `Chat` doit pouvoir s'utiliser partout où un `Animal` le
      peut.
  - key: bug-classe-private
    format: bug-fix
    question: |-
      Ce fichier `Outils.java` ne compile pas (`modifier private not allowed here`) :
      ```java
      private class Outils {
          static int doubler(int x) { return x * 2; }
      }
      ```
    answer: |-
      ```java
      final class Outils {
          private Outils() { }
          static int doubler(int x) { return x * 2; }
      }
      ```
      Une classe de premier niveau est `public` ou package-private. Pour la cacher hors du package, on omet le
      modificateur ; pour empêcher l'instanciation, on rend le constructeur `private`.
  - key: bug-tout-public
    format: bug-fix
    question: |-
      Un refactoring interne casse trois autres équipes, qui appelaient une méthode d'aide :
      ```java
      public class Facturation {
          public double arrondirInterne(double montant) { ... }
          public Facture facturer(Commande c) { ... }
      }
      ```
    answer: |-
      ```java
      public class Facturation {
          private double arrondirInterne(double montant) { ... }
          public Facture facturer(Commande c) { ... }
      }
      ```
      Tout ce qui est `public` devient un contrat. Une méthode d'aide reste `private` (ou package-private pour la
      tester) : on peut la changer sans prévenir personne.
