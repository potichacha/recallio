notion: fabriques-statiques
lesson: |-
  Une **fabrique statique** est une méthode `static` qui renvoie une instance, à la place (ou en plus) d'un
  constructeur (*Effective Java*, item 1) :

  ```java
  public record Temperature(double kelvin) {
      public static Temperature celsius(double c)    { return new Temperature(c + 273.15); }
      public static Temperature fahrenheit(double f) { return new Temperature((f - 32) * 5 / 9 + 273.15); }
  }

  Temperature t = Temperature.celsius(20);       // le nom dit ce que signifie le nombre
  ```

  Ses avantages sur un constructeur :
  - un **nom** qui explique (deux constructeurs `Temperature(double)` seraient impossibles) ;
  - pas obligée de créer un objet : elle peut renvoyer une instance **en cache** (`Integer.valueOf`, `Boolean.valueOf`) ;
  - elle peut renvoyer un **sous-type**, choisi selon les arguments (`EnumSet.noneOf`, `List.of`), et cacher la classe
    réelle ;
  - elle peut renvoyer `Optional` ou lever une exception plus parlante.

  Conventions de nom : `of` (`List.of`), `from` (conversion), `valueOf`, `parse` (`LocalDate.parse`), `getInstance`,
  `newInstance`, `create`. Ses limites : une classe sans constructeur public ne peut pas être étendue, et les fabriques
  se repèrent moins bien qu'un constructeur dans la documentation.

  **Piège classique** : `new BigDecimal(0.1)` donne `0.1000000000000000055511151231257827...`, la valeur exacte du
  `double`. La fabrique `BigDecimal.valueOf(0.1)` passe par la représentation textuelle et donne `0.1`.

  **En entretien** : « Une fabrique statique a un nom, peut mettre en cache et renvoyer un sous-type ; je la préfère
  quand un constructeur serait ambigu. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'une fabrique statique ?
    choices:
      - {text: "Une méthode `static` qui renvoie une instance, comme `List.of` ou `Integer.valueOf`", correct: true}
      - {text: "Un constructeur `static`, appelé une seule fois au chargement de la classe", correct: false}
      - {text: "Une classe dédiée qui crée les objets d'une autre, comme une usine abstraite", correct: false}
      - {text: "Un champ `static final` qui garde l'unique instance de la classe", correct: false}
    answer: "Une méthode `static` qui renvoie une instance de la classe (ou d'un sous-type), comme `List.of` ou `Integer.valueOf`, à la place d'un appel direct au constructeur. Ce n'est pas le patron « fabrique abstraite », qui est une classe à part."
  - key: avantages
    format: course
    question: Quels avantages a une fabrique statique sur un constructeur ?
    choices:
      - {text: "Un nom explicite, une instance en cache, un sous-type choisi selon les arguments", correct: true}
      - {text: "Une exécution toujours plus rapide, car elle n'alloue jamais d'objet", correct: false}
      - {text: "Une classe plus facile à étendre par héritage qu'avec un constructeur", correct: false}
      - {text: "Un objet neuf garanti à chaque appel, contrairement à `new`", correct: false}
    answer: "Un nom explicite, la possibilité de renvoyer une instance en cache, un sous-type choisi selon les arguments, ou un `Optional`. Elle rend au contraire la classe plus difficile à étendre si les constructeurs deviennent privés."
  - key: limites
    format: course
    question: Quelles limites ont les fabriques statiques ?
    choices:
      - {text: "Une classe aux constructeurs tous `private` ne peut plus être étendue", correct: true}
      - {text: "Une fabrique ne peut pas renvoyer un sous-type de sa classe", correct: false}
      - {text: "Une fabrique ne peut pas prendre de paramètres, à la différence d'un constructeur", correct: false}
      - {text: "Une fabrique crée forcément un nouvel objet à chaque appel", correct: false}
    answer: "Une classe dont les constructeurs sont tous `private` ne peut pas être étendue, et les fabriques sont moins visibles qu'un constructeur dans la documentation (d'où les conventions de nom)."
  - key: conventions
    format: course
    question: "Quelle liste ne contient que des noms conventionnels de fabriques statiques ?"
    choices:
      - {text: "`of`, `from`, `valueOf`, `getInstance`", correct: true}
      - {text: "`of`, `build`, `setValue`, `getInstance`", correct: false}
      - {text: "`of`, `from`, `toString`, `clone`", correct: false}
      - {text: "`init`, `from`, `valueOf`, `finalize`", correct: false}
    answer: "`of`, `from`, `valueOf`, `parse`, `getInstance`, `newInstance`, `create` (ou le nom du type : `Collections.list`). `build` termine un builder, et `toString` ou `clone` ne créent pas d'instance par la classe."
  - key: vf-cache
    format: true-false
    question: Une fabrique statique crée forcément un nouvel objet à chaque appel.
    truth: false
    answer: '`Integer.valueOf(5)` renvoie une instance en cache.'
  - key: vf-sous-type
    format: true-false
    question: Une fabrique statique peut renvoyer un objet d'une sous-classe non publique.
    truth: true
    answer: C'est ce que fait `List.of`, dont la classe réelle est cachée.
  - key: vf-meme-signature
    format: true-false
    question: Une classe peut avoir deux constructeurs `Temperature(double celsius)` et `Temperature(double fahrenheit)`.
    truth: false
    answer: Ils ont la même signature ; deux fabriques nommées résolvent le problème.
  - key: vf-big-decimal
    format: true-false
    question: "`new BigDecimal(0.1)` et `BigDecimal.valueOf(0.1)` donnent la même valeur."
    truth: false
    answer: Le constructeur prend la valeur binaire exacte du `double`, la fabrique sa représentation décimale `0.1`.
  - key: qcm-cache
    format: multiple-choice
    question: "Laquelle de ces écritures peut réutiliser une instance existante ?"
    choices:
      - {text: "`Integer.valueOf(42)`", correct: true}
      - {text: "`new Integer(42)`", correct: false}
      - {text: "`new String(\"a\")`", correct: false}
      - {text: "`new StringBuilder(\"a\")`", correct: false}
    answer: "`valueOf` peut renvoyer une instance en cache (de -128 à 127 pour `Integer`) ; un `new` crée toujours un nouvel objet (et `new Integer` est déprécié pour suppression)."
  - key: qcm-nommage
    format: multiple-choice
    question: Quelle fabrique convertit une chaîne en date ?
    choices:
      - text: "`LocalDate.parse(\"2025-01-31\")`"
        correct: true
      - text: "`new LocalDate(\"2025-01-31\")`"
        correct: false
      - text: "`LocalDate.getInstance(\"2025-01-31\")`"
        correct: false
      - text: "`LocalDate.toDate(\"2025-01-31\")`"
        correct: false
    answer: '`LocalDate` n''a pas de constructeur public : on passe par `of`, `parse`, `now`.'
  - key: qcm-immuable
    format: multiple-choice
    question: "Que renvoie `List.of(1, 2)` ?"
    choices:
      - {text: "Une liste immuable, d'une classe interne à la JDK", correct: true}
      - {text: "Une `ArrayList` modifiable, comme `new ArrayList<>()`", correct: false}
      - {text: "Une `LinkedList` qui garde l'ordre d'insertion", correct: false}
      - {text: "Un tableau `int[]` emballé par `Arrays.asList`", correct: false}
    answer: La fabrique cache la classe réelle et promet seulement l'interface `List`.
  - key: qcm-quand
    format: multiple-choice
    question: "Dans lesquels de ces cas préférer une fabrique statique à un constructeur ?"
    choices:
      - text: "Deux façons de construire auraient la même signature"
        correct: true
      - text: "On veut réutiliser des instances"
        correct: true
      - text: "On veut que la classe soit facilement étendue par héritage"
        correct: false
      - text: "On veut forcer l'appelant à écrire `new`"
        correct: false
    answer: Une classe sans constructeur public ne peut pas être étendue.
  - key: trous-static
    format: fill-in
    question: |-
      Complète la fabrique :
      ```java
      public ___ Temperature celsius(double c) {
          return new Temperature(c + 273.15);
      }
      ```
    blanks: [[static]]
    answer: La méthode s'appelle sur la classe, sans instance.
  - key: trous-of
    format: fill-in
    question: |-
      Complète pour créer une liste immuable de trois éléments :
      ```java
      List<String> couleurs = List.___("rouge", "vert", "bleu");
      ```
    blanks: [[of]]
    answer: '`List.of` est la fabrique conventionnelle des collections immuables.'
  - key: trous-value-of
    format: fill-in
    question: |-
      Complète pour obtenir exactement le décimal 0.1 :
      ```java
      BigDecimal taux = BigDecimal.___(0.1);
      ```
    blanks: [[valueOf]]
    answer: '`valueOf` passe par `Double.toString`, qui donne `0.1`.'
  - key: trous-constructeur-prive
    format: fill-in
    question: |-
      Complète pour obliger à passer par les fabriques :
      ```java
      public final class Temperature {
          ___ Temperature(double kelvin) { ... }
          public static Temperature celsius(double c) { ... }
      }
      ```
    blanks: [[private]]
    answer: Un constructeur `private` n'est appelable que par la classe, donc par ses fabriques.
  - key: code-cache-integer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Integer a = Integer.valueOf(127), b = Integer.valueOf(127);
      Integer c = Integer.valueOf(128), d = Integer.valueOf(128);
      System.out.println((a == b) + " " + (c == d));
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : `valueOf` met en cache les valeurs de -128 à 127 ; au-delà, chaque appel crée un objet, et `==` compare les références."
    check:
      output: "true false"
  - key: code-list-of
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = List.of(1, 2);
      l.add(3);
      ```
    choices:
      - {text: "Une `UnsupportedOperationException`", correct: true}
      - {text: "Rien : la liste vaut ensuite `[1, 2, 3]`", correct: false}
      - {text: "Une `IndexOutOfBoundsException`", correct: false}
      - {text: "Une `IllegalStateException`", correct: false}
    answer: "Une `UnsupportedOperationException` : la liste renvoyée est immuable."
    check:
      throws: UnsupportedOperationException
  - key: code-nommee
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Temperature(double kelvin) {
          static Temperature celsius(double c) { return new Temperature(c + 273.15); }
      }
      System.out.println(Temperature.celsius(0).kelvin());
      ```
    choices:
      - {text: "`273.15`", correct: true}
      - {text: "`0.0`", correct: false}
      - {text: "`-273.15`", correct: false}
      - {text: "`273.0`", correct: false}
    answer: '`273.15` : le nom de la fabrique dit l''unité du paramètre.'
    check:
      output: "273.15"
  - key: code-big-decimal
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(BigDecimal.valueOf(0.1) + " " + new BigDecimal(0.1).toString().startsWith("0.1000000000000000055"));
      ```
    choices:
      - {text: "`0.1 true`", correct: true}
      - {text: "`0.1 false`", correct: false}
      - {text: "`0.10 true`", correct: false}
      - {text: "`0.1000000000000000055 false`", correct: false}
    answer: "`0.1 true` : `valueOf` passe par `Double.toString` et donne `0.1`, tandis que le constructeur garde la valeur binaire exacte du `double`."
    check:
      output: "0.1 true"
  - key: bug-constructeurs-ambigus
    format: bug-fix
    question: |-
      Ce code ne compile pas (`constructor Distance(double) is already defined`). Quelle correction est la bonne ?
      ```java
      record Distance(double metres) {
          Distance(double kilometres) { this(kilometres * 1000); }
      }
      ```
    choices:
      - {text: "Des fabriques nommées : `Distance.kilometres(km)` et `Distance.metres(m)`", correct: true}
      - {text: "Renommer le paramètre du second constructeur en `km`", correct: false}
      - {text: "Ajouter `@Override` au constructeur qui prend des kilomètres", correct: false}
      - {text: "Déclarer le second constructeur `private` pour le distinguer", correct: false}
    answer: |-
      ```java
      record Distance(double metres) {
          static Distance kilometres(double km) { return new Distance(km * 1000); }
          static Distance metres(double m) { return new Distance(m); }
      }
      ```
      Deux constructeurs ne peuvent pas avoir la même signature. Des fabriques nommées lèvent l'ambiguïté, et l'appel
      dit l'unité : `Distance.kilometres(3)`.
  - key: bug-big-decimal
    format: bug-fix
    question: |-
      Ce calcul financier donne des montants comme `0.1000000000000000055511151231257827`. Quelle correction est la bonne ?
      ```java
      BigDecimal taux = new BigDecimal(0.1);
      ```
    choices:
      - {text: "`new BigDecimal(\"0.1\")` ou `BigDecimal.valueOf(0.1)`", correct: true}
      - {text: "`new BigDecimal(0.1).setScale(2)`", correct: false}
      - {text: "`new BigDecimal((float) 0.1)`", correct: false}
      - {text: "`new BigDecimal(Double.valueOf(0.1))`", correct: false}
    answer: |-
      ```java
      BigDecimal taux = new BigDecimal("0.1");
      // ou : BigDecimal.valueOf(0.1)
      ```
      Le constructeur `BigDecimal(double)` prend la valeur binaire exacte du `double`, qui n'est pas 0,1. Le constructeur
      à `String` ou la fabrique `valueOf` donnent le décimal attendu.
  - key: bug-new-integer
    format: bug-fix
    question: |-
      Ce code est signalé comme déprécié pour suppression et crée des objets inutiles. Quelle correction est la bonne ?
      ```java
      Integer quantite = new Integer(5);
      Boolean actif = new Boolean(true);
      ```
    choices:
      - {text: "`Integer.valueOf(5)` et `Boolean.TRUE`", correct: true}
      - {text: "`new Integer(\"5\")` et `new Boolean(\"true\")`", correct: false}
      - {text: "`Integer.getInteger(\"5\")` et `Boolean.getBoolean(\"true\")`", correct: false}
      - {text: "`Integer.parseInt(5)` et `Boolean.parseBoolean(true)`", correct: false}
    answer: |-
      ```java
      Integer quantite = Integer.valueOf(5);
      Boolean actif = Boolean.TRUE;
      ```
      Les constructeurs des enveloppes sont dépréciés pour suppression ; `valueOf` réutilise les instances en cache (et
      l'autoboxing l'appelle déjà : `Integer quantite = 5;`).
  - key: bug-implementation-exposee
    format: bug-fix
    question: |-
      Changer la représentation interne casse les appelants, qui dépendent de la classe concrète. Quelle correction est la bonne ?
      ```java
      public class Paniers {
          public static ArrayList<Article> vide() { return new ArrayList<>(); }
      }
      ```
    choices:
      - {text: "Déclarer le retour `List<Article>` plutôt qu'`ArrayList<Article>`", correct: true}
      - {text: "Rendre la méthode non `static`, pour pouvoir la redéfinir", correct: false}
      - {text: "Garder `ArrayList<Article>` mais le documenter comme interne", correct: false}
      - {text: "Rendre la classe `Paniers` `final` pour figer son contrat", correct: false}
    answer: |-
      ```java
      public class Paniers {
          public static List<Article> vide() { return new ArrayList<>(); }
      }
      ```
      Une fabrique peut cacher sa classe réelle : en promettant seulement l'interface `List`, on reste libre de changer
      d'implémentation.
