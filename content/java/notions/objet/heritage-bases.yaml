notion: heritage-bases
lesson: |-
  L'**héritage** (`extends`) crée une classe à partir d'une autre : la sous-classe **est un** cas particulier de la
  classe parente, reprend ses membres et peut en ajouter ou en redéfinir.

  ```java
  class Animal {
      protected final String nom;
      Animal(String nom) { this.nom = nom; }
      String cri() { return "..."; }
      String presenter() { return nom + " fait " + cri(); }
  }

  class Chat extends Animal {
      Chat(String nom) { super(nom); }        // les constructeurs ne s'héritent pas
      @Override String cri() { return "miaou"; }
  }

  new Chat("Félix").presenter();              // "Félix fait miaou"
  ```

  - Une classe n'étend **qu'une seule** classe ; sans `extends`, elle étend `Object`.
  - Sont hérités : les membres `public` et `protected`, et les membres package-private si l'on est dans le même
    package. Les champs `private` existent dans l'objet mais ne sont **pas accessibles** à la sous-classe.
  - Les **constructeurs ne s'héritent pas** : chaque classe déclare les siens et appelle celui du parent.
  - Un objet de la sous-classe peut s'utiliser partout où l'on attend le parent : c'est la base du polymorphisme.

  L'héritage n'est justifié que par une vraie relation **« est un »** et un comportement substituable (principe de
  Liskov) ; pour réutiliser du code, on préfère la composition.

  **Piège classique** : appeler `new Chat("Félix")` en croyant que le constructeur `Animal(String)` est hérité. Il faut
  le déclarer dans `Chat`.

  **En entretien** : « `extends` exprime une relation "est un" ; on hérite des membres accessibles, pas des
  constructeurs, et d'une seule classe à la fois. »
tour:
  - title: L'héritage
    text: |-
      `class Chien extends Animal` : `Chien` **hérite** des champs et des méthodes d'`Animal`, et peut en ajouter. Une
      classe n'a qu'une classe parente ; sans `extends`, c'est `Object`.

      Les membres `private` du parent existent dans l'objet, mais la sous-classe ne peut pas y toucher, et les
      constructeurs ne s'héritent pas. On réserve l'héritage aux vraies relations « est un » : un chien *est un* animal.
      Pour réutiliser du code, la composition convient souvent mieux.
    example:
      files:
        Main.java: |-
          void main() {
              Chien rex = new Chien("Rex");
              IO.println(rex.presente());
              IO.println(rex.aboie());
          }
        Animal.java: |-
          public class Animal {
              protected final String nom;

              public Animal(String nom) {
                  this.nom = nom;
              }

              public String presente() {
                  return "Je suis " + nom;
              }
          }
        Chien.java: |-
          public class Chien extends Animal {
              public Chien(String nom) {
                  super(nom);
              }

              public String aboie() {
                  return nom + " : ouaf !";
              }
          }
      output: |-
        Je suis Rex
        Rex : ouaf !
cards:
  - key: constructeurs-heritent-ils
    format: course
    question: Les constructeurs s'héritent-ils ?
    answer: Non.
  - key: heritage-simple
    format: course
    question: Combien de classes une classe Java peut-elle étendre ?
    answer: Une seule (héritage simple de classes) ; elle peut en revanche implémenter plusieurs interfaces.
  - key: ce-qui-est-herite
    format: course
    question: Qu'hérite une sous-classe ?
    answer: Les membres `public` et `protected` (et package-private dans le même package). Les champs `private` existent dans l'objet mais ne lui sont pas accessibles ; les constructeurs ne sont pas hérités.
  - key: est-un
    format: course
    question: Quand l'héritage est-il justifié ?
    answer: Quand la sous-classe **est un** cas particulier du parent et peut le remplacer partout sans surprise (principe de substitution de Liskov).
  - key: vf-object-racine
    format: true-false
    question: Une classe qui n'écrit pas `extends` hérite de `Object`.
    truth: true
    answer: '`Object` est la racine de toutes les classes.'
  - key: vf-private-accessible
    format: true-false
    question: Une sous-classe peut lire directement les champs `private` de son parent.
    truth: false
    answer: Ils existent dans l'objet mais ne sont accessibles que dans la classe parente.
  - key: vf-deux-parents
    format: true-false
    question: "`class C extends A, B` est permis si `A` et `B` sont des classes."
    truth: false
    answer: Java n'a pas d'héritage multiple de classes.
  - key: vf-substitution
    format: true-false
    question: Un objet `Chat` peut être passé à une méthode qui attend un `Animal`.
    truth: true
    answer: Un `Chat` est un `Animal`.
  - key: qcm-mot-cle
    format: multiple-choice
    question: Quel mot-clé déclare qu'une classe hérite d'une autre ?
    choices:
      - text: "`extends`"
        correct: true
      - text: "`implements`"
        correct: false
      - text: "`inherits`"
        correct: false
      - text: "`super`"
        correct: false
    answer: '`implements` sert aux interfaces.'
  - key: qcm-herite
    format: multiple-choice
    question: Lesquels de ces membres du parent sont accessibles à une sous-classe située dans un autre package ?
    choices:
      - text: "Les méthodes `public`"
        correct: true
      - text: "Les méthodes `protected`"
        correct: true
      - text: "Les champs `private`"
        correct: false
      - text: "Les constructeurs"
        correct: false
    answer: Les membres package-private ne seraient accessibles que dans le même package.
  - key: qcm-relation
    format: multiple-choice
    question: Lequel de ces héritages respecte la relation « est un » ?
    choices:
      - text: "`class Voiture extends Vehicule`"
        correct: true
      - text: "`class Voiture extends Moteur`"
        correct: false
      - text: "`class Client extends ArrayList<Commande>`"
        correct: false
      - text: "`class Facture extends Imprimante`"
        correct: false
    answer: Une voiture **a** un moteur (composition) ; elle **est** un véhicule.
  - key: qcm-constructeur
    format: multiple-choice
    question: "`Animal` n'a que le constructeur `Animal(String nom)`. Que doit faire `Chat` pour qu'on puisse écrire `new Chat(\"Félix\")` ?"
    choices:
      - text: "Déclarer `Chat(String nom) { super(nom); }`"
        correct: true
      - text: "Rien, le constructeur est hérité"
        correct: false
      - text: "Déclarer `Chat() { }`"
        correct: false
      - text: "Rendre `Animal` abstraite"
        correct: false
    answer: Les constructeurs ne s'héritent pas ; on les déclare et on délègue au parent.
  - key: code-redefinition-appelee
    format: code-output
    question: |-
      ```java
      class Animal {
          String cri() { return "..."; }
          String presenter() { return "Je fais " + cri(); }
      }
      class Chat extends Animal {
          String cri() { return "miaou"; }
      }
      System.out.println(new Chat().presenter());
      ```
    answer: '`Je fais miaou` : `presenter` est héritée, et elle appelle la version de `cri` du `Chat`.'
    check:
      output: "Je fais miaou"
  - key: code-champ-herite
    format: code-output
    question: |-
      ```java
      class Vehicule { int roues = 4; }
      class Moto extends Vehicule {
          Moto() { roues = 2; }
      }
      System.out.println(new Moto().roues + " " + new Vehicule().roues);
      ```
    answer: '`2 4` : la moto a hérité du champ et l''a modifié dans son propre objet.'
    check:
      output: "2 4"
  - key: code-instanceof
    format: code-output
    question: |-
      ```java
      class Animal { }
      class Chat extends Animal { }
      Object o = new Chat();
      System.out.println((o instanceof Animal) + " " + (o instanceof Object));
      ```
    answer: '`true true` : un `Chat` est un `Animal`, et tout objet est un `Object`.'
    check:
      output: "true true"
  - key: code-heritage-multiple
    format: code-output
    question: |-
      ```java
      class A { }
      class B { }
      class C extends A, B { }
      ```
      Ce code compile-t-il ?
    answer: "Non : une classe n'étend qu'une seule classe."
    check:
      compiles: false
  - key: bug-champ-private
    format: bug-fix
    question: |-
      Ce code ne compile pas (`solde has private access in Compte`) :
      ```java
      class Compte {
          private double solde;
          void deposer(double montant) { solde += montant; }
          double solde() { return solde; }
      }
      class Epargne extends Compte {
          void verserInterets() { solde *= 1.02; }
      }
      ```
    answer: |-
      ```java
      class Epargne extends Compte {
          void verserInterets() { deposer(solde() * 0.02); }
      }
      ```
      Le champ `private` reste réservé à `Compte` : la sous-classe passe par ses méthodes, qui gardent les règles. (Le
      rendre `protected` affaiblirait l'encapsulation.)
  - key: bug-constructeur-herite
    format: bug-fix
    question: |-
      `new Chat("Félix")` ne compile pas (`constructor Chat in class Chat cannot be applied to given types`) :
      ```java
      class Animal {
          final String nom;
          Animal(String nom) { this.nom = nom; }
      }
      class Chat extends Animal {
          Chat() { super("inconnu"); }
      }
      ```
    answer: |-
      ```java
      class Chat extends Animal {
          Chat(String nom) { super(nom); }
      }
      ```
      Les constructeurs ne s'héritent pas : `Chat` doit déclarer le constructeur qu'on veut appeler.
  - key: bug-pile-arraylist
    format: bug-fix
    question: |-
      On peut insérer au milieu de cette « pile », ce qui casse l'ordre LIFO :
      ```java
      class Pile<T> extends ArrayList<T> {
          void empiler(T e) { add(e); }
          T depiler() { return remove(size() - 1); }
      }
      // ailleurs : pile.add(0, x);
      ```
    answer: |-
      ```java
      class Pile<T> {
          private final Deque<T> elements = new ArrayDeque<>();
          void empiler(T e) { elements.push(e); }
          T depiler() { return elements.pop(); }
      }
      ```
      Une pile n'**est** pas une liste : l'héritage expose toutes les méthodes de `ArrayList`. La composition n'expose
      que les opérations voulues.
  - key: bug-heritage-multiple
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      class CanardRobot extends Volant, Electrique { }
      ```
      `Volant` et `Electrique` décrivent chacun une capacité.
    answer: |-
      ```java
      interface Volant { void voler(); }
      interface Electrique { void recharger(); }

      class CanardRobot implements Volant, Electrique {
          public void voler() { ... }
          public void recharger() { ... }
      }
      ```
      Une classe n'étend qu'une classe, mais implémente autant d'interfaces qu'elle veut : les capacités s'expriment
      en interfaces.
