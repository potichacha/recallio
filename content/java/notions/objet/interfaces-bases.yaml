notion: interfaces-bases
lesson: |-
  Une **interface** est un **contrat** : la liste des méthodes qu'une classe s'engage à fournir, sans dire comment.

  ```java
  interface Volant { String voler(); }
  interface Nageur { String nager(); }

  class Canard implements Volant, Nageur {      // plusieurs interfaces à la fois
      @Override public String voler() { return "vole"; }
      @Override public String nager() { return "nage"; }
  }

  Volant v = new Canard();                      // le canard s'utilise comme un Volant
  ```

  - Une classe n'étend **qu'une** classe, mais **implémente** autant d'interfaces qu'elle veut ; une interface peut
    **étendre** plusieurs interfaces (`interface Amphibie extends Volant, Nageur`).
  - Les méthodes abstraites d'une interface sont implicitement **`public abstract`** ; ses champs sont implicitement
    **`public static final`** (des constantes).
  - On ne peut pas instancier une interface ; on instancie une classe qui l'implémente, une classe anonyme, ou une
    **lambda** si l'interface est fonctionnelle (une seule méthode abstraite).
  - Une interface décrit souvent une **capacité** (`Comparable`, `Iterable`, `AutoCloseable`) partagée par des
    classes sans lien entre elles.
  - Programmer « contre une interface » (`List`, `Repository`) découple l'appelant de l'implémentation et facilite les
    tests (on injecte un double).

  **Piège classique** : implémenter une méthode d'interface sans `public`. Elle serait package-private, une visibilité
  réduite : erreur de compilation.

  **En entretien** : « Une interface définit un contrat, sans état ; une classe peut en implémenter plusieurs, et le
  code qui dépend de l'interface ignore l'implémentation. »
tour:
  - title: Les interfaces
    text: |-
      Une **interface** est un contrat : une liste de méthodes, sans état. Une classe la réalise avec `implements`, et
      **peut** en réaliser plusieurs, alors qu'elle n'hérite que d'une classe.

      Une interface peut aussi offrir des méthodes `default`, avec un corps, et des méthodes `static`. On programme
      « contre l'interface » : une variable de type `List` plutôt qu'`ArrayList`.
    example:
      files:
        Main.java: |-
          interface Volant {
              String vole();
          }

          interface Nageur {
              String nage();

              default String plonge() {
                  return "plonge, puis " + nage();
              }
          }

          class Canard implements Volant, Nageur {
              public String vole() {
                  return "vole bas";
              }

              public String nage() {
                  return "nage en surface";
              }
          }

          void main() {
              Canard canard = new Canard();
              Volant v = canard;
              Nageur n = canard;
              IO.println(v.vole());
              IO.println(n.plonge());
          }
      output: |-
        vole bas
        plonge, puis nage en surface
    task:
      instructions: |-
        Ajoute une classe `Pingouin` qui n'est que `Nageur` (il « nage en profondeur »), et fais plonger un pingouin :
        le programme doit afficher `plonge, puis nage en profondeur`.
      starter:
        Main.java: |-
          interface Nageur {
              String nage();

              default String plonge() {
                  return "plonge, puis " + nage();
              }
          }

          void main() {
              IO.println("aucun nageur");
          }
      solution:
        Main.java: |-
          interface Nageur {
              String nage();

              default String plonge() {
                  return "plonge, puis " + nage();
              }
          }

          class Pingouin implements Nageur {
              public String nage() {
                  return "nage en profondeur";
              }
          }

          void main() {
              IO.println(new Pingouin().plonge());
          }
      output: |-
        plonge, puis nage en profondeur
cards:
  - key: instancier-interface
    format: course
    question: "Peut-on instancier une interface ?"
    choices:
      - {text: "Non, mais une classe anonyme ou une lambda peut l'implémenter", correct: true}
      - {text: "Oui, avec `new`, si elle n'a que des méthodes `default`", correct: false}
      - {text: "Oui, si elle est fonctionnelle : `new Runnable()` suffit", correct: false}
      - {text: "Non, et une classe anonyme ne peut pas l'implémenter non plus", correct: false}
    answer: |-
      Non : `new Runnable()` ne compile pas. On instancie une classe qui l'implémente, une classe anonyme ou une
      lambda.
  - key: java-supporte-heritage-multiple
    format: course
    question: "Java supporte-t-il l'héritage multiple ?"
    choices:
      - {text: "Pas de classes, mais une classe peut implémenter plusieurs interfaces", correct: true}
      - {text: "Oui : une classe peut étendre plusieurs classes, séparées par des virgules", correct: false}
      - {text: "Non, ni de classes ni d'interfaces : un seul parent en tout", correct: false}
      - {text: "Oui pour les classes abstraites, non pour les classes concrètes", correct: false}
    answer: |-
      Pas de classes : `extends` n'accepte qu'une classe parente. D'interfaces, oui : une classe en implémente
      plusieurs, et une interface en étend plusieurs.
  - key: champs-interface
    format: course
    question: "Que sont les champs déclarés dans une interface ?"
    choices:
      - {text: "Des constantes, implicitement `public static final`", correct: true}
      - {text: "Des champs d'instance, copiés dans chaque implémentation", correct: false}
      - {text: "Des champs `private`, visibles des seules méthodes `default`", correct: false}
      - {text: "Des variables `static` que les implémentations peuvent modifier", correct: false}
    answer: |-
      Des constantes, implicitement `public static final` : une interface n'a pas d'état d'instance, et personne ne
      peut les réaffecter.
  - key: programmer-interface
    format: course
    question: "Pourquoi « programmer contre une interface » ?"
    choices:
      - {text: "L'appelant dépend du contrat : on change l'implémentation sans le toucher", correct: true}
      - {text: "Un appel passé par une interface est plus rapide qu'un appel direct", correct: false}
      - {text: "Une interface garantit qu'aucune exception n'atteint l'appelant", correct: false}
      - {text: "Le compilateur exige un type interface pour les paramètres publics", correct: false}
    answer: |-
      L'appelant dépend du contrat, pas de l'implémentation : on peut la remplacer (autre stockage, double de test)
      sans modifier l'appelant.
  - key: vf-plusieurs-interfaces
    format: true-false
    question: Une classe peut implémenter plusieurs interfaces.
    truth: true
    answer: C'est la forme d'héritage multiple qu'autorise Java.
  - key: vf-champ-modifiable
    format: true-false
    question: Un champ déclaré dans une interface peut être modifié par les classes qui l'implémentent.
    truth: false
    answer: "Il est implicitement `final` : c'est une constante."
  - key: vf-interface-extends
    format: true-false
    question: Une interface peut étendre plusieurs interfaces.
    truth: true
    answer: "`interface Amphibie extends Volant, Nageur` est valide."
  - key: vf-implementation-package
    format: true-false
    question: Une classe peut implémenter une méthode d'interface sans le modificateur `public`.
    truth: false
    answer: La méthode d'interface est `public` ; l'implémentation ne peut pas réduire sa visibilité.
  - key: qcm-mot-cle
    format: multiple-choice
    question: Quel mot-clé utilise une classe pour respecter une interface ?
    choices:
      - text: "`implements`"
        correct: true
      - text: "`extends`"
        correct: false
      - text: "`inherits`"
        correct: false
      - text: "`uses`"
        correct: false
    answer: Une interface qui en étend une autre utilise `extends`.
  - key: qcm-instancier
    format: multiple-choice
    question: "Lequel de ces codes fournit un `Comparator<String>` qui fonctionne ?"
    choices:
      - {text: "`Comparator<String> c = (a, b) -> a.length() - b.length();`", correct: true}
      - {text: "`Comparator<String> c = new Comparator<String>();`", correct: false}
      - {text: "`Comparator<String> c = Comparator.class.newInstance();`", correct: false}
      - {text: "`Comparator<String> c = (Comparator<String>) new Object();`", correct: false}
    answer: |-
      `Comparator` est une interface fonctionnelle : une lambda l'implémente. On ne fait pas `new` sur une interface,
      et caster un simple `Object` lève une `ClassCastException`.
  - key: qcm-capacite
    format: multiple-choice
    question: Lesquelles de ces interfaces de la JDK décrivent une capacité ?
    choices:
      - text: "`Comparable`"
        correct: true
      - text: "`AutoCloseable`"
        correct: true
      - text: "`Iterable`"
        correct: true
      - text: "`Object`"
        correct: false
    answer: '`Object` est une classe, la racine de toutes les classes.'
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle déclaration de variable dépend le moins de l'implémentation ?
    choices:
      - text: "`Repository depot = new DepotPostgres();`"
        correct: true
      - text: "`DepotPostgres depot = new DepotPostgres();`"
        correct: false
      - text: "`var depot = new DepotPostgres();`"
        correct: false
      - text: "`Object depot = new DepotPostgres();`"
        correct: false
    answer: Le reste du code ne voit que le contrat `Repository`.
  - key: trous-implements
    format: fill-in
    question: |-
      Complète pour que `Canard` soit à la fois volant et nageur :
      ```java
      class Canard ___ Volant, Nageur { ... }
      ```
    blanks: [[implements]]
    answer: Une classe implémente plusieurs interfaces, séparées par des virgules.
  - key: trous-interface
    format: fill-in
    question: |-
      Complète pour déclarer un contrat :
      ```java
      ___ Notificateur {
          void envoyer(String message);
      }
      ```
    blanks: [[interface]]
    answer: La méthode est implicitement `public abstract`.
  - key: trous-extends
    format: fill-in
    question: |-
      Complète pour qu'une interface combine deux autres :
      ```java
      interface Amphibie ___ Volant, Nageur { }
      ```
    blanks: [[extends]]
    answer: Entre interfaces, on utilise `extends`, y compris pour plusieurs parents.
  - key: trous-public
    format: fill-in
    question: |-
      Complète l'implémentation :
      ```java
      class Email implements Notificateur {
          @Override
          ___ void envoyer(String message) { ... }
      }
      ```
    blanks: [[public]]
    answer: La méthode d'interface est `public`, l'implémentation aussi.
  - key: code-multiple
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      interface Volant { String voler(); }
      interface Nageur { String nager(); }
      class Canard implements Volant, Nageur {
          public String voler() { return "vole"; }
          public String nager() { return "nage"; }
      }
      Canard c = new Canard();
      Volant v = c;
      Nageur n = c;
      System.out.println(v.voler() + " " + n.nager());
      ```
    choices:
      - {text: "`vole nage`", correct: true}
      - {text: "`vole vole`", correct: false}
      - {text: "`nage vole`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`vole nage` : le même objet, vu par deux interfaces."
    check:
      output: "vole nage"
  - key: code-constante
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      interface Config { int MAX = 3; }
      Config.MAX = 4;
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Rien : `MAX` passe à 4", correct: false}
      - {text: "Rien : l'affectation est ignorée", correct: false}
      - {text: "Une `IllegalStateException`", correct: false}
    answer: "Ça ne compile pas : `MAX` est implicitement `public static final`, on ne peut pas le réaffecter."
    check:
      compiles: false
  - key: code-instanceof-interfaces
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Object o = new ArrayList<String>();
      System.out.println((o instanceof List) + " " + (o instanceof Collection) + " " + (o instanceof Map));
      ```
    choices:
      - {text: "`true true false`", correct: true}
      - {text: "`true false false`", correct: false}
      - {text: "`false true false`", correct: false}
      - {text: "`true true true`", correct: false}
    answer: "`true true false` : `ArrayList` implémente `List`, qui étend `Collection` ; pas `Map`."
    check:
      output: "true true false"
  - key: code-lambda
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Comparator<String> parLongueur = (a, b) -> a.length() - b.length();
      List<String> mots = new ArrayList<>(List.of("ccc", "a", "bb"));
      mots.sort(parLongueur);
      System.out.println(mots);
      ```
    choices:
      - {text: "`[a, bb, ccc]`", correct: true}
      - {text: "`[ccc, bb, a]`", correct: false}
      - {text: "`[ccc, a, bb]`", correct: false}
      - {text: "`[a, ccc, bb]`", correct: false}
    answer: "`[a, bb, ccc]` : la lambda implémente l'unique méthode abstraite de `Comparator`, et trie par longueur croissante."
    check:
      output: "[a, bb, ccc]"
  - key: bug-methode-manquante
    format: bug-fix
    question: |-
      Ce code ne compile pas (`Sms is not abstract and does not override abstract method envoyer(String)`). Quelle
      correction est la bonne ?
      ```java
      interface Notificateur { void envoyer(String message); }
      class Sms implements Notificateur {
          public void envoyerSms(String message) { ... }
      }
      ```
    choices:
      - {text: "Implémenter `public void envoyer(String message)`, avec `@Override`", correct: true}
      - {text: "Ajouter `@Override` au-dessus de la méthode `envoyerSms`", correct: false}
      - {text: "Déclarer `envoyerSms` avec le mot-clé `default`", correct: false}
      - {text: "Retirer `public` de la méthode `envoyerSms`", correct: false}
    answer: |-
      ```java
      class Sms implements Notificateur {
          @Override
          public void envoyer(String message) { ... }
      }
      ```
      Une classe concrète doit implémenter toutes les méthodes de l'interface, avec la même signature.
  - key: bug-new-interface
    format: bug-fix
    question: |-
      Ce code ne compile pas (`Runnable is abstract; cannot be instantiated`). Quelle correction est la bonne ?
      ```java
      Runnable tache = new Runnable();
      ```
    choices:
      - {text: "Une lambda : `() -> System.out.println(\"tâche\")`", correct: true}
      - {text: "Écrire `new Runnable<>()`, avec le losange", correct: false}
      - {text: "Importer `java.lang.Runnable` explicitement", correct: false}
      - {text: "Écrire `Runnable.new()` à la place de `new`", correct: false}
    answer: |-
      ```java
      Runnable tache = () -> System.out.println("tâche");
      ```
      On n'instancie pas une interface : on fournit une implémentation, ici une lambda (`Runnable` n'a qu'une méthode
      abstraite).
  - key: bug-dependance-concrete
    format: bug-fix
    question: |-
      Le service de commande est impossible à tester sans base PostgreSQL. Quelle correction est la bonne ?
      ```java
      class ServiceCommande {
          private final DepotPostgres depot = new DepotPostgres();
      }
      ```
    choices:
      - {text: "Dépendre d'une interface `DepotCommandes`, reçue par le constructeur", correct: true}
      - {text: "Rendre le champ `depot` `static`, pour le partager entre les tests", correct: false}
      - {text: "Retirer `final` et ajouter un setter appelé avant chaque test", correct: false}
      - {text: "Créer une sous-classe de `ServiceCommande` dans chaque test", correct: false}
    answer: |-
      ```java
      interface DepotCommandes { void enregistrer(Commande c); }

      class ServiceCommande {
          private final DepotCommandes depot;
          ServiceCommande(DepotCommandes depot) { this.depot = depot; }
      }
      ```
      Le service dépend d'une interface, reçue par son constructeur : en test, on lui passe une implémentation en
      mémoire.
  - key: bug-constantes-interface
    format: bug-fix
    question: |-
      Des classes implémentent une interface seulement pour accéder à ses constantes. Quelle correction est la bonne ?
      ```java
      interface Constantes {
          double TVA = 0.2;
          int MAX_ARTICLES = 10;
      }
      class Panier implements Constantes { ... }
      ```
    choices:
      - {text: "Ranger les constantes dans une classe utilitaire `final`, sans l'implémenter", correct: true}
      - {text: "Garder l'interface, mais déclarer chaque constante `static final`", correct: false}
      - {text: "Remplacer `implements` par `extends` pour hériter des constantes", correct: false}
      - {text: "Rien : implémenter l'interface est la façon prévue de les partager", correct: false}
    answer: |-
      ```java
      final class Constantes {
          private Constantes() { }
          static final double TVA = 0.2;
          static final int MAX_ARTICLES = 10;
      }
      // Panier utilise Constantes.TVA, ou un import static
      ```
      L'« interface de constantes » est un anti-patron (*Effective Java*, item 22) : elle expose ces constantes dans
      l'API de `Panier` et ne décrit aucun contrat. Une classe utilitaire (ou une enum) les regroupe sans implémentation.
