notion: interfaces-bases
cards:
  - key: instancier-interface
    format: course
    question: Peut-on instancier une interface ?
    answer: Non, mais on peut instancier une classe anonyme ou une lambda qui l'implémente.
  - key: java-supporte-heritage-multiple
    format: course
    question: Java supporte-t-il l'héritage multiple ?
    answer: Pas de classes ; d'interfaces oui.
