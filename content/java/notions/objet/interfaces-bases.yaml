notion: interfaces-bases
lesson: |-
  Une **interface** est un **contrat** : la liste des méthodes qu'une classe s'engage à fournir, sans dire comment.

  ```java
  interface Volant { String voler(); }
  interface Nageur { String nager(); }

  class Canard implements Volant, Nageur {      // plusieurs interfaces à la fois
      @Override public String voler() { return "vole"; }
      @Override public String nager() { return "nage"; }
  }

  Volant v = new Canard();                      // le canard s'utilise comme un Volant
  ```

  - Une classe n'étend **qu'une** classe, mais **implémente** autant d'interfaces qu'elle veut ; une interface peut
    **étendre** plusieurs interfaces (`interface Amphibie extends Volant, Nageur`).
  - Les méthodes abstraites d'une interface sont implicitement **`public abstract`** ; ses champs sont implicitement
    **`public static final`** (des constantes).
  - On ne peut pas instancier une interface ; on instancie une classe qui l'implémente, une classe anonyme, ou une
    **lambda** si l'interface est fonctionnelle (une seule méthode abstraite).
  - Une interface décrit souvent une **capacité** (`Comparable`, `Iterable`, `AutoCloseable`) partagée par des
    classes sans lien entre elles.
  - Programmer « contre une interface » (`List`, `Repository`) découple l'appelant de l'implémentation et facilite les
    tests (on injecte un double).

  **Piège classique** : implémenter une méthode d'interface sans `public`. Elle serait package-private, une visibilité
  réduite : erreur de compilation.

  **En entretien** : « Une interface définit un contrat, sans état ; une classe peut en implémenter plusieurs, et le
  code qui dépend de l'interface ignore l'implémentation. »
tour:
  - title: Les interfaces
    text: |-
      Une **interface** est un contrat : une liste de méthodes, sans état. Une classe la réalise avec `implements`, et
      **peut** en réaliser plusieurs, alors qu'elle n'hérite que d'une classe.

      Une interface peut aussi offrir des méthodes `default`, avec un corps, et des méthodes `static`. On programme
      « contre l'interface » : une variable de type `List` plutôt qu'`ArrayList`.
    example:
      files:
        Main.java: |-
          interface Volant {
              String vole();
          }

          interface Nageur {
              String nage();

              default String plonge() {
                  return "plonge, puis " + nage();
              }
          }

          class Canard implements Volant, Nageur {
              public String vole() {
                  return "vole bas";
              }

              public String nage() {
                  return "nage en surface";
              }
          }

          void main() {
              Canard canard = new Canard();
              Volant v = canard;
              Nageur n = canard;
              IO.println(v.vole());
              IO.println(n.plonge());
          }
      output: |-
        vole bas
        plonge, puis nage en surface
    task:
      instructions: |-
        Ajoute une classe `Pingouin` qui n'est que `Nageur` (il « nage en profondeur »), et fais plonger un pingouin :
        le programme doit afficher `plonge, puis nage en profondeur`.
      starter:
        Main.java: |-
          interface Nageur {
              String nage();

              default String plonge() {
                  return "plonge, puis " + nage();
              }
          }

          void main() {
              IO.println("aucun nageur");
          }
      solution:
        Main.java: |-
          interface Nageur {
              String nage();

              default String plonge() {
                  return "plonge, puis " + nage();
              }
          }

          class Pingouin implements Nageur {
              public String nage() {
                  return "nage en profondeur";
              }
          }

          void main() {
              IO.println(new Pingouin().plonge());
          }
      output: |-
        plonge, puis nage en profondeur
cards:
  - key: instancier-interface
    format: course
    question: Peut-on instancier une interface ?
    answer: Non, mais on peut instancier une classe anonyme ou une lambda qui l'implémente.
  - key: java-supporte-heritage-multiple
    format: course
    question: Java supporte-t-il l'héritage multiple ?
    answer: Pas de classes ; d'interfaces oui.
  - key: champs-interface
    format: course
    question: Que sont les champs déclarés dans une interface ?
    answer: Des constantes, implicitement `public static final`.
  - key: programmer-interface
    format: course
    question: Pourquoi « programmer contre une interface » ?
    answer: "L'appelant dépend du contrat, pas de l'implémentation : on peut la remplacer (autre stockage, double de test) sans modifier l'appelant."
  - key: vf-plusieurs-interfaces
    format: true-false
    question: Une classe peut implémenter plusieurs interfaces.
    truth: true
    answer: C'est la forme d'héritage multiple qu'autorise Java.
  - key: vf-champ-modifiable
    format: true-false
    question: Un champ déclaré dans une interface peut être modifié par les classes qui l'implémentent.
    truth: false
    answer: "Il est implicitement `final` : c'est une constante."
  - key: vf-interface-extends
    format: true-false
    question: Une interface peut étendre plusieurs interfaces.
    truth: true
    answer: "`interface Amphibie extends Volant, Nageur` est valide."
  - key: vf-implementation-package
    format: true-false
    question: Une classe peut implémenter une méthode d'interface sans le modificateur `public`.
    truth: false
    answer: La méthode d'interface est `public` ; l'implémentation ne peut pas réduire sa visibilité.
  - key: qcm-mot-cle
    format: multiple-choice
    question: Quel mot-clé utilise une classe pour respecter une interface ?
    choices:
      - text: "`implements`"
        correct: true
      - text: "`extends`"
        correct: false
      - text: "`inherits`"
        correct: false
      - text: "`uses`"
        correct: false
    answer: Une interface qui en étend une autre utilise `extends`.
  - key: qcm-instancier
    format: multiple-choice
    question: "Comment obtenir un objet de type `Comparator<String>` ?"
    choices:
      - text: "Une lambda : `(a, b) -> a.length() - b.length()`"
        correct: true
      - text: "Une classe qui `implements Comparator<String>`"
        correct: true
      - text: "`new Comparator<String>()`"
        correct: false
      - text: "`Comparator.class.newInstance()`"
        correct: false
    answer: '`Comparator` est une interface fonctionnelle : une lambda l''implémente.'
  - key: qcm-capacite
    format: multiple-choice
    question: Lesquelles de ces interfaces de la JDK décrivent une capacité ?
    choices:
      - text: "`Comparable`"
        correct: true
      - text: "`AutoCloseable`"
        correct: true
      - text: "`Iterable`"
        correct: true
      - text: "`Object`"
        correct: false
    answer: '`Object` est une classe, la racine de toutes les classes.'
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle déclaration de variable dépend le moins de l'implémentation ?
    choices:
      - text: "`Repository depot = new DepotPostgres();`"
        correct: true
      - text: "`DepotPostgres depot = new DepotPostgres();`"
        correct: false
      - text: "`var depot = new DepotPostgres();`"
        correct: false
      - text: "`Object depot = new DepotPostgres();`"
        correct: false
    answer: Le reste du code ne voit que le contrat `Repository`.
  - key: trous-implements
    format: fill-in
    question: |-
      Complétez pour que `Canard` soit à la fois volant et nageur :
      ```java
      class Canard ___ Volant, Nageur { ... }
      ```
    blanks: [[implements]]
    answer: Une classe implémente plusieurs interfaces, séparées par des virgules.
  - key: trous-interface
    format: fill-in
    question: |-
      Complétez pour déclarer un contrat :
      ```java
      ___ Notificateur {
          void envoyer(String message);
      }
      ```
    blanks: [[interface]]
    answer: La méthode est implicitement `public abstract`.
  - key: trous-extends
    format: fill-in
    question: |-
      Complétez pour qu'une interface combine deux autres :
      ```java
      interface Amphibie ___ Volant, Nageur { }
      ```
    blanks: [[extends]]
    answer: Entre interfaces, on utilise `extends`, y compris pour plusieurs parents.
  - key: trous-public
    format: fill-in
    question: |-
      Complétez l'implémentation :
      ```java
      class Email implements Notificateur {
          @Override
          ___ void envoyer(String message) { ... }
      }
      ```
    blanks: [[public]]
    answer: La méthode d'interface est `public`, l'implémentation aussi.
  - key: code-multiple
    format: code-output
    question: |-
      ```java
      interface Volant { String voler(); }
      interface Nageur { String nager(); }
      class Canard implements Volant, Nageur {
          public String voler() { return "vole"; }
          public String nager() { return "nage"; }
      }
      Canard c = new Canard();
      Volant v = c;
      Nageur n = c;
      System.out.println(v.voler() + " " + n.nager());
      ```
    answer: '`vole nage` : le même objet, vu par deux interfaces.'
    check:
      output: "vole nage"
  - key: code-constante
    format: code-output
    question: |-
      ```java
      interface Config { int MAX = 3; }
      Config.MAX = 4;
      ```
      Ce code compile-t-il ?
    answer: 'Non : `MAX` est implicitement `public static final`.'
    check:
      compiles: false
  - key: code-instanceof-interfaces
    format: code-output
    question: |-
      ```java
      Object o = new ArrayList<String>();
      System.out.println((o instanceof List) + " " + (o instanceof Collection) + " " + (o instanceof Map));
      ```
    answer: '`true true false` : `ArrayList` implémente `List`, qui étend `Collection` ; pas `Map`.'
    check:
      output: "true true false"
  - key: code-lambda
    format: code-output
    question: |-
      ```java
      Comparator<String> parLongueur = (a, b) -> a.length() - b.length();
      List<String> mots = new ArrayList<>(List.of("ccc", "a", "bb"));
      mots.sort(parLongueur);
      System.out.println(mots);
      ```
    answer: '`[a, bb, ccc]` : la lambda implémente l''unique méthode abstraite de `Comparator`.'
    check:
      output: "[a, bb, ccc]"
  - key: bug-methode-manquante
    format: bug-fix
    question: |-
      Ce code ne compile pas (`Sms is not abstract and does not override abstract method envoyer(String)`) :
      ```java
      interface Notificateur { void envoyer(String message); }
      class Sms implements Notificateur {
          public void envoyerSms(String message) { ... }
      }
      ```
    answer: |-
      ```java
      class Sms implements Notificateur {
          @Override
          public void envoyer(String message) { ... }
      }
      ```
      Une classe concrète doit implémenter toutes les méthodes de l'interface, avec la même signature.
  - key: bug-new-interface
    format: bug-fix
    question: |-
      Ce code ne compile pas (`Runnable is abstract; cannot be instantiated`) :
      ```java
      Runnable tache = new Runnable();
      ```
    answer: |-
      ```java
      Runnable tache = () -> System.out.println("tâche");
      ```
      On n'instancie pas une interface : on fournit une implémentation, ici une lambda (`Runnable` n'a qu'une méthode
      abstraite).
  - key: bug-dependance-concrete
    format: bug-fix
    question: |-
      Le service de commande est impossible à tester sans base PostgreSQL :
      ```java
      class ServiceCommande {
          private final DepotPostgres depot = new DepotPostgres();
      }
      ```
    answer: |-
      ```java
      interface DepotCommandes { void enregistrer(Commande c); }

      class ServiceCommande {
          private final DepotCommandes depot;
          ServiceCommande(DepotCommandes depot) { this.depot = depot; }
      }
      ```
      Le service dépend d'une interface, reçue par son constructeur : en test, on lui passe une implémentation en
      mémoire.
  - key: bug-constantes-interface
    format: bug-fix
    question: |-
      Des classes implémentent une interface seulement pour accéder à ses constantes :
      ```java
      interface Constantes {
          double TVA = 0.2;
          int MAX_ARTICLES = 10;
      }
      class Panier implements Constantes { ... }
      ```
    answer: |-
      ```java
      final class Constantes {
          private Constantes() { }
          static final double TVA = 0.2;
          static final int MAX_ARTICLES = 10;
      }
      // Panier utilise Constantes.TVA, ou un import static
      ```
      L'« interface de constantes » est un anti-patron (*Effective Java*, item 22) : elle expose ces constantes dans
      l'API de `Panier` et ne décrit aucun contrat. Une classe utilitaire (ou une enum) les regroupe sans implémentation.
