notion: classe-object
lesson: |-
  **`java.lang.Object`** est la racine de toutes les classes, tableaux compris : toute classe en hérite, directement ou
  non. Ses méthodes forment le socle commun de tous les objets :

  | Méthode | Rôle | Par défaut |
  |---|---|---|
  | `equals(Object)` | égalité logique | identité (`==`) |
  | `hashCode()` | code pour les tables de hachage | dérivé de l'identité |
  | `toString()` | représentation textuelle | `NomDeClasse@1b6d3586` |
  | `getClass()` | la classe réelle de l'objet | `final`, non redéfinissable |
  | `clone()` | copie (`protected`, exige `Cloneable`) | copie superficielle |
  | `wait()`, `notify()`, `notifyAll()` | coordination de threads sur un moniteur | `final` |
  | `finalize()` | appelée avant récupération | dépréciée, à ne plus utiliser |

  ```java
  Object o = "texte";
  o.getClass();                 // class java.lang.String : le type réel
  o.equals("texte");            // true : String redéfinit equals

  int[] a = {1, 2}, b = {1, 2};
  a.equals(b);                  // false : un tableau garde l'equals d'Object
  Arrays.equals(a, b);          // true
  ```

  On redéfinit couramment `equals`, `hashCode` et `toString` ; jamais `getClass`, `wait` ni `notify`, qui sont `final`.

  **Piège classique** : comparer deux tableaux avec `equals`. Les tableaux ne redéfinissent rien : c'est une
  comparaison d'identité. On utilise `Arrays.equals` (ou `Arrays.deepEquals` pour des tableaux imbriqués).

  **En entretien** : « Object fournit equals, hashCode, toString, getClass, clone, wait/notify ; on redéfinit les trois
  premiers, et equals par défaut compare les identités. »
tour:
  - title: La classe Object
    text: |-
      Toute classe hérite, directement ou non, d'`Object`. Elle en reçoit quelques méthodes :

      - `toString()`, sa représentation en texte ;
      - `equals(Object)` et `hashCode()`, l'égalité et le code de hachage, qui vont ensemble ;
      - `getClass()`, la classe réelle de l'objet.

      Par défaut, `equals` compare les références, comme `==`. Les classes de valeur (`String`, `Integer`, les records)
      le redéfinissent pour comparer le contenu.
    example:
      files:
        Main.java: |-
          class Boite {
              final int taille;

              Boite(int taille) {
                  this.taille = taille;
              }
          }

          record Taille(int valeur) {}

          void main() {
              Boite a = new Boite(3);
              Boite b = new Boite(3);
              IO.println(a.equals(b) + " " + a.equals(a));
              IO.println(new Taille(3).equals(new Taille(3)));
              IO.println(new Taille(3).hashCode() == new Taille(3).hashCode());
              IO.println(a.getClass().getSimpleName());
              Object o = "texte";
              IO.println(o.getClass().getName());
          }
      output: |-
        false true
        true
        true
        Boite
        java.lang.String
cards:
  - key: sont-methodes-classe-object
    format: course
    question: "Laquelle de ces listes donne les méthodes de la classe `Object` ?"
    choices:
      - {text: "`equals`, `hashCode`, `toString`, `getClass`, `clone`, `wait`, `notify`, `notifyAll`, `finalize`", correct: true}
      - {text: "`equals`, `hashCode`, `toString`, `compareTo`, `clone`, `wait`, `notify`, `notifyAll`, `finalize`", correct: false}
      - {text: "`equals`, `hashCode`, `toString`, `getClass`, `clone`, `sleep`, `notify`, `notifyAll`, `finalize`", correct: false}
      - {text: "`equals`, `hashCode`, `toString`, `getClass`, `copy`, `wait`, `notify`, `notifyAll`, `close`", correct: false}
    answer: |-
      `equals`, `hashCode`, `toString`, `getClass`, `clone`, `wait`, `notify`, `notifyAll` et `finalize` (dépréciée).
      `compareTo` vient de `Comparable`, `sleep` de `Thread`.
  - key: equals-defaut
    format: course
    question: "Que fait `equals` s'il n'est pas redéfini ?"
    choices:
      - {text: "Il compare les identités, comme `==`", correct: true}
      - {text: "Il compare les champs un par un, par réflexion", correct: false}
      - {text: "Il compare les résultats de `hashCode`", correct: false}
      - {text: "Il compare les résultats de `toString`", correct: false}
    answer: |-
      Il compare les identités, comme `==` : deux objets distincts de même contenu sont différents. Comparer les champs
      demande de redéfinir `equals`.
  - key: methodes-final
    format: course
    question: "Quelles méthodes d'`Object` ne peut-on pas redéfinir ?"
    choices:
      - {text: "`getClass`, `wait`, `notify` et `notifyAll`, qui sont `final`", correct: true}
      - {text: "`equals`, `hashCode` et `toString`, qui sont `final`", correct: false}
      - {text: "`clone` et `finalize`, qui sont `final`", correct: false}
      - {text: "Aucune : toutes les méthodes d'`Object` se redéfinissent", correct: false}
    answer: |-
      Les méthodes `final` : `getClass`, `wait`, `notify` et `notifyAll`. `clone` et `finalize` sont `protected`, et se
      redéfinissent.
  - key: tableaux-object
    format: course
    question: "Les tableaux héritent-ils d'`Object` ?"
    choices:
      - {text: "Oui, sans redéfinir `equals`, `hashCode` ni `toString` : on passe par `Arrays`", correct: true}
      - {text: "Non : un tableau est un type primitif, sans aucune méthode", correct: false}
      - {text: "Oui, et ils redéfinissent `equals` pour comparer leurs contenus", correct: false}
      - {text: "Seulement les tableaux d'objets ; les tableaux de primitifs, non", correct: false}
    answer: |-
      Oui, mais ils ne redéfinissent ni `equals`, ni `hashCode`, ni `toString` : on utilise `Arrays.equals`,
      `Arrays.hashCode` et `Arrays.toString`.
  - key: vf-racine
    format: true-false
    question: Toute classe Java hérite, directement ou indirectement, d'`Object`.
    truth: true
    answer: C'est la racine de la hiérarchie ; les tableaux aussi sont des `Object`.
  - key: vf-get-class
    format: true-false
    question: On peut redéfinir `getClass()`.
    truth: false
    answer: Elle est `final`.
  - key: vf-equals-tableaux
    format: true-false
    question: "`new int[]{1}.equals(new int[]{1})` vaut `true`."
    truth: false
    answer: Les tableaux gardent l'`equals` d'`Object`, qui compare les identités.
  - key: vf-finalize
    format: true-false
    question: "`finalize()` est la bonne façon de libérer une ressource."
    truth: false
    answer: Elle est dépréciée (pour suppression) ; on ferme les ressources avec `try-with-resources`.
  - key: qcm-redefinies
    format: multiple-choice
    question: "Laquelle de ces méthodes d'`Object` ne peut-on pas redéfinir ?"
    choices:
      - {text: "`getClass`", correct: true}
      - {text: "`equals`", correct: false}
      - {text: "`hashCode`", correct: false}
      - {text: "`toString`", correct: false}
    answer: "`getClass` est `final` ; `equals`, `hashCode` et `toString` se redéfinissent couramment."
  - key: qcm-type-reel
    format: multiple-choice
    question: "Avec `Object o = new ArrayList<String>();`, que renvoie `o.getClass().getSimpleName()` ?"
    choices:
      - text: "`ArrayList`"
        correct: true
      - text: "`Object`"
        correct: false
      - text: "`List`"
        correct: false
      - text: "`ArrayList<String>`"
        correct: false
    answer: '`getClass` donne la classe réelle ; les génériques sont effacés à l''exécution.'
  - key: qcm-tableaux
    format: multiple-choice
    question: Comment comparer le contenu de deux `int[]` ?
    choices:
      - text: "`Arrays.equals(a, b)`"
        correct: true
      - text: "`a.equals(b)`"
        correct: false
      - text: "`a == b`"
        correct: false
      - text: "`Objects.equals(a, b)`"
        correct: false
    answer: '`Objects.equals` délègue à `a.equals(b)`, donc compare aussi les identités.'
  - key: qcm-wait
    format: multiple-choice
    question: À quoi servent `wait` et `notify` ?
    choices:
      - text: "À coordonner des threads sur le moniteur d'un objet"
        correct: true
      - text: "À mettre en pause le ramasse-miettes"
        correct: false
      - text: "À attendre la fin d'une méthode"
        correct: false
      - text: "À notifier les écouteurs d'une interface graphique"
        correct: false
    answer: On les appelle dans un bloc `synchronized` sur cet objet ; en pratique, on préfère `java.util.concurrent`.
  - key: code-get-class
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Object o = "x";
      Object n = 42;
      System.out.println(o.getClass().getSimpleName() + " " + n.getClass().getSimpleName());
      ```
    choices:
      - {text: "`String Integer`", correct: true}
      - {text: "`Object Object`", correct: false}
      - {text: "`String int`", correct: false}
      - {text: "`java.lang.String java.lang.Integer`", correct: false}
    answer: "`String Integer` : `getClass` renvoie le type réel, pas le type déclaré ; `42` est autoboxé en `Integer`."
    check:
      output: "String Integer"
  - key: code-tableaux
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] a = {1, 2};
      int[] b = {1, 2};
      System.out.println(a.equals(b) + " " + Arrays.equals(a, b));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`false true` : `equals` d'un tableau compare les identités ; seul `Arrays.equals` compare les contenus."
    check:
      output: "false true"
  - key: code-equals-defaut
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Point {
          final int x;
          Point(int x) { this.x = x; }
      }
      Point p = new Point(1);
      System.out.println(p.equals(new Point(1)) + " " + p.equals(p));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`false true` : sans redéfinition, `equals` compare les identités."
    check:
      output: "false true"
  - key: code-wait-final
    format: code-output
    question: |-
      ```java
      class Tache {
          public void wait() { }
      }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Ça ne compile pas : `wait()` est `final` dans `Object`", correct: true}
      - {text: "Ça compile : `Tache` redéfinit simplement `wait()`", correct: false}
      - {text: "Ça compile, avec un avertissement : il manque `@Override`", correct: false}
      - {text: "Ça compile, mais l'appel de `wait()` lève une exception", correct: false}
    answer: "Non : `wait()` est `final` dans `Object` et ne peut pas être redéfinie."
    check:
      compiles: false
  - key: bug-tableaux-equals
    format: bug-fix
    question: |-
      Cette vérification d'un code PIN échoue toujours. Quelle correction est la bonne ?
      ```java
      int[] saisi = lire();
      int[] attendu = {1, 2, 3, 4};
      if (saisi.equals(attendu)) {
          deverrouiller();
      }
      ```
    choices:
      - {text: "Comparer les contenus avec `Arrays.equals(saisi, attendu)`", correct: true}
      - {text: "Comparer avec `saisi == attendu`, plus strict qu'`equals`", correct: false}
      - {text: "Comparer `saisi.hashCode() == attendu.hashCode()`", correct: false}
      - {text: "Comparer `saisi.toString().equals(attendu.toString())`", correct: false}
    answer: |-
      ```java
      if (Arrays.equals(saisi, attendu)) {
          deverrouiller();
      }
      ```
      `equals` sur un tableau compare les identités : deux tableaux distincts ne sont jamais égaux, et `hashCode` ou
      `toString` en dépendent aussi. (Pour un secret, on préférerait même `MessageDigest.isEqual`, à temps constant.)
  - key: bug-nom-classe
    format: bug-fix
    question: |-
      Ce test de type casse dès qu'on renomme ou déplace la classe. Quelle correction est la bonne ?
      ```java
      if (utilisateur.getClass().getName().equals("com.app.Admin")) {
          ((Admin) utilisateur).gerer();
      }
      ```
    choices:
      - {text: "Tester `utilisateur instanceof Admin admin`, vérifié par le compilateur", correct: true}
      - {text: "Comparer `getClass().getSimpleName()` au texte `\"Admin\"`", correct: false}
      - {text: "Comparer `getClass().getName()` en ignorant la casse", correct: false}
      - {text: "Attraper la `ClassCastException` levée par le transtypage", correct: false}
    answer: |-
      ```java
      if (utilisateur instanceof Admin admin) {
          admin.gerer();
      }
      ```
      Comparer des noms de classe en texte échappe au compilateur et ignore les sous-classes. `instanceof` est vérifié
      et accepte les sous-types.
  - key: bug-liste-tableaux
    format: bug-fix
    question: |-
      `coordonnees.contains(new int[]{2, 3})` renvoie toujours `false`. Quelle correction est la bonne ?
      ```java
      List<int[]> coordonnees = new ArrayList<>();
      coordonnees.add(new int[]{2, 3});
      ```
    choices:
      - {text: "Remplacer `int[]` par un record `Coordonnee(int x, int y)`", correct: true}
      - {text: "Remplacer `ArrayList` par une `LinkedList`", correct: false}
      - {text: "Remplacer `contains` par `indexOf(...) >= 0`", correct: false}
      - {text: "Trier la liste avant d'appeler `contains`", correct: false}
    answer: |-
      ```java
      record Coordonnee(int x, int y) { }
      List<Coordonnee> coordonnees = new ArrayList<>();
      coordonnees.add(new Coordonnee(2, 3));
      coordonnees.contains(new Coordonnee(2, 3));   // true
      ```
      `contains` (comme `indexOf`) utilise `equals`, qui compare l'identité des tableaux. Un record a un `equals` sur
      ses composants.
  - key: bug-wait-sans-verrou
    format: bug-fix
    question: |-
      Ce code lève une `IllegalMonitorStateException`. Pourquoi ?
      ```java
      Object verrou = new Object();
      verrou.wait();
      ```
    choices:
      - {text: "`wait` exige de détenir le moniteur de l'objet, dans un bloc `synchronized`", correct: true}
      - {text: "`wait` ne s'appelle que sur un objet `Thread`, pas sur un simple `Object`", correct: false}
      - {text: "`wait` doit recevoir en paramètre une durée maximale d'attente", correct: false}
      - {text: "L'objet `verrou` doit être déclaré `volatile` pour servir de verrou", correct: false}
    answer: |-
      ```java
      synchronized (verrou) {
          while (!pret) {
              verrou.wait();
          }
      }
      ```
      `wait` exige de détenir le moniteur de l'objet (un bloc `synchronized`) et s'appelle dans une boucle qui revérifie
      la condition. En pratique, `CountDownLatch` ou `CompletableFuture` évitent ces subtilités.
