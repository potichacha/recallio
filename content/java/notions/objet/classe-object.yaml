notion: classe-object
lesson: |-
  **`java.lang.Object`** est la racine de toutes les classes, tableaux compris : toute classe en hérite, directement ou
  non. Ses méthodes forment le socle commun de tous les objets :

  | Méthode | Rôle | Par défaut |
  |---|---|---|
  | `equals(Object)` | égalité logique | identité (`==`) |
  | `hashCode()` | code pour les tables de hachage | dérivé de l'identité |
  | `toString()` | représentation textuelle | `NomDeClasse@1b6d3586` |
  | `getClass()` | la classe réelle de l'objet | `final`, non redéfinissable |
  | `clone()` | copie (`protected`, exige `Cloneable`) | copie superficielle |
  | `wait()`, `notify()`, `notifyAll()` | coordination de threads sur un moniteur | `final` |
  | `finalize()` | appelée avant récupération | dépréciée, à ne plus utiliser |

  ```java
  Object o = "texte";
  o.getClass();                 // class java.lang.String : le type réel
  o.equals("texte");            // true : String redéfinit equals

  int[] a = {1, 2}, b = {1, 2};
  a.equals(b);                  // false : un tableau garde l'equals d'Object
  Arrays.equals(a, b);          // true
  ```

  On redéfinit couramment `equals`, `hashCode` et `toString` ; jamais `getClass`, `wait` ni `notify`, qui sont `final`.

  **Piège classique** : comparer deux tableaux avec `equals`. Les tableaux ne redéfinissent rien : c'est une
  comparaison d'identité. On utilise `Arrays.equals` (ou `Arrays.deepEquals` pour des tableaux imbriqués).

  **En entretien** : « Object fournit equals, hashCode, toString, getClass, clone, wait/notify ; on redéfinit les trois
  premiers, et equals par défaut compare les identités. »
cards:
  - key: sont-methodes-classe-object
    format: course
    question: Quelles sont les méthodes de la classe Object ?
    answer: equals, hashCode, toString, getClass, clone, wait, notify, notifyAll, finalize (dépréciée).
  - key: equals-defaut
    format: course
    question: Que fait `equals` s'il n'est pas redéfini ?
    answer: "Il compare les identités, comme `==` : deux objets distincts de même contenu sont différents."
  - key: methodes-final
    format: course
    question: Quelles méthodes d'`Object` ne peut-on pas redéfinir ?
    answer: "Les méthodes `final` : `getClass`, `wait`, `notify` et `notifyAll`."
  - key: tableaux-object
    format: course
    question: Les tableaux héritent-ils d'`Object` ?
    answer: "Oui, mais ils ne redéfinissent ni `equals`, ni `hashCode`, ni `toString` : on utilise `Arrays.equals`, `Arrays.hashCode` et `Arrays.toString`."
  - key: vf-racine
    format: true-false
    question: Toute classe Java hérite, directement ou indirectement, d'`Object`.
    truth: true
    answer: C'est la racine de la hiérarchie ; les tableaux aussi sont des `Object`.
  - key: vf-get-class
    format: true-false
    question: On peut redéfinir `getClass()`.
    truth: false
    answer: Elle est `final`.
  - key: vf-equals-tableaux
    format: true-false
    question: "`new int[]{1}.equals(new int[]{1})` vaut `true`."
    truth: false
    answer: Les tableaux gardent l'`equals` d'`Object`, qui compare les identités.
  - key: vf-finalize
    format: true-false
    question: "`finalize()` est la bonne façon de libérer une ressource."
    truth: false
    answer: Elle est dépréciée (pour suppression) ; on ferme les ressources avec `try-with-resources`.
  - key: qcm-redefinies
    format: multiple-choice
    question: Quelles méthodes d'`Object` redéfinit-on couramment ?
    choices:
      - text: "`equals`"
        correct: true
      - text: "`hashCode`"
        correct: true
      - text: "`toString`"
        correct: true
      - text: "`getClass`"
        correct: false
    answer: '`getClass` est `final`.'
  - key: qcm-type-reel
    format: multiple-choice
    question: "Avec `Object o = new ArrayList<String>();`, que renvoie `o.getClass().getSimpleName()` ?"
    choices:
      - text: "`ArrayList`"
        correct: true
      - text: "`Object`"
        correct: false
      - text: "`List`"
        correct: false
      - text: "`ArrayList<String>`"
        correct: false
    answer: '`getClass` donne la classe réelle ; les génériques sont effacés à l''exécution.'
  - key: qcm-tableaux
    format: multiple-choice
    question: Comment comparer le contenu de deux `int[]` ?
    choices:
      - text: "`Arrays.equals(a, b)`"
        correct: true
      - text: "`a.equals(b)`"
        correct: false
      - text: "`a == b`"
        correct: false
      - text: "`Objects.equals(a, b)`"
        correct: false
    answer: '`Objects.equals` délègue à `a.equals(b)`, donc compare aussi les identités.'
  - key: qcm-wait
    format: multiple-choice
    question: À quoi servent `wait` et `notify` ?
    choices:
      - text: "À coordonner des threads sur le moniteur d'un objet"
        correct: true
      - text: "À mettre en pause le ramasse-miettes"
        correct: false
      - text: "À attendre la fin d'une méthode"
        correct: false
      - text: "À notifier les écouteurs d'une interface graphique"
        correct: false
    answer: On les appelle dans un bloc `synchronized` sur cet objet ; en pratique, on préfère `java.util.concurrent`.
  - key: code-get-class
    format: code-output
    question: |-
      ```java
      Object o = "x";
      Object n = 42;
      System.out.println(o.getClass().getSimpleName() + " " + n.getClass().getSimpleName());
      ```
    answer: '`String Integer` : `getClass` renvoie le type réel, pas le type déclaré.'
    check:
      output: "String Integer"
  - key: code-tableaux
    format: code-output
    question: |-
      ```java
      int[] a = {1, 2};
      int[] b = {1, 2};
      System.out.println(a.equals(b) + " " + Arrays.equals(a, b));
      ```
    answer: '`false true` : seul `Arrays.equals` compare les contenus.'
    check:
      output: "false true"
  - key: code-equals-defaut
    format: code-output
    question: |-
      ```java
      class Point {
          final int x;
          Point(int x) { this.x = x; }
      }
      Point p = new Point(1);
      System.out.println(p.equals(new Point(1)) + " " + p.equals(p));
      ```
    answer: '`false true` : sans redéfinition, `equals` compare les identités.'
    check:
      output: "false true"
  - key: code-wait-final
    format: code-output
    question: |-
      ```java
      class Tache {
          public void wait() { }
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `wait()` est `final` dans `Object` et ne peut pas être redéfinie.'
    check:
      compiles: false
  - key: bug-tableaux-equals
    format: bug-fix
    question: |-
      Cette vérification d'un code PIN échoue toujours :
      ```java
      int[] saisi = lire();
      int[] attendu = {1, 2, 3, 4};
      if (saisi.equals(attendu)) {
          deverrouiller();
      }
      ```
    answer: |-
      ```java
      if (Arrays.equals(saisi, attendu)) {
          deverrouiller();
      }
      ```
      `equals` sur un tableau compare les identités : deux tableaux distincts ne sont jamais égaux. (Pour un secret,
      on préférerait même `MessageDigest.isEqual`, à temps constant.)
  - key: bug-nom-classe
    format: bug-fix
    question: |-
      Ce test de type casse dès qu'on renomme ou déplace la classe :
      ```java
      if (utilisateur.getClass().getName().equals("com.app.Admin")) {
          ((Admin) utilisateur).gerer();
      }
      ```
    answer: |-
      ```java
      if (utilisateur instanceof Admin admin) {
          admin.gerer();
      }
      ```
      Comparer des noms de classe en texte échappe au compilateur et ignore les sous-classes. `instanceof` est vérifié
      et accepte les sous-types.
  - key: bug-liste-tableaux
    format: bug-fix
    question: |-
      `coordonnees.contains(new int[]{2, 3})` renvoie toujours `false` :
      ```java
      List<int[]> coordonnees = new ArrayList<>();
      coordonnees.add(new int[]{2, 3});
      ```
    answer: |-
      ```java
      record Coordonnee(int x, int y) { }
      List<Coordonnee> coordonnees = new ArrayList<>();
      coordonnees.add(new Coordonnee(2, 3));
      coordonnees.contains(new Coordonnee(2, 3));   // true
      ```
      `contains` utilise `equals`, qui compare l'identité des tableaux. Un record a un `equals` sur ses composants.
  - key: bug-wait-sans-verrou
    format: bug-fix
    question: |-
      Ce code lève une `IllegalMonitorStateException` :
      ```java
      Object verrou = new Object();
      verrou.wait();
      ```
    answer: |-
      ```java
      synchronized (verrou) {
          while (!pret) {
              verrou.wait();
          }
      }
      ```
      `wait` exige de détenir le moniteur de l'objet (un bloc `synchronized`) et s'appelle dans une boucle qui revérifie
      la condition. En pratique, `CountDownLatch` ou `CompletableFuture` évitent ces subtilités.
