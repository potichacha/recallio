notion: classes-internes
lesson: |-
  Une **classe interne** est une classe déclarée dans une autre, **sans `static`**. Chacun de ses objets est attaché à
  un objet de la classe englobante, dont il garde une **référence cachée**.

  ```java
  class Equipe {
      private int buts;

      class Joueur {                    // classe interne
          void marquer() {
              buts++;                   // accède directement à l'état de SON équipe
          }
      }
  }

  Equipe equipe = new Equipe();
  Equipe.Joueur joueur = equipe.new Joueur();   // il faut une instance englobante
  ```

  - La classe interne accède à **tous** les membres de l'englobante, même `private`.
  - On la crée **depuis une instance** : `new Joueur()` dans une méthode d'instance d'`Equipe`, ou
    `equipe.new Joueur()` de l'extérieur. Depuis une méthode `static`, il n'y a pas d'instance : erreur.
  - `Equipe.this` désigne l'instance englobante, utile quand un nom est masqué.
  - Depuis Java 16, une classe interne peut déclarer des membres `static`.

  Usage typique : un objet qui n'a de sens qu'attaché à un autre, comme l'itérateur d'une collection, qui lit les
  données de **sa** collection.

  **Piège classique** : déclarer interne une classe qui n'utilise pas l'instance englobante. Elle garde quand même
  (souvent) une référence vers elle, qui coûte de la mémoire et peut empêcher sa récupération. Dans ce cas, on la
  déclare `static`.

  **En entretien** : « Une classe interne est liée à une instance de l'englobante et y accède directement ; si elle
  n'en a pas besoin, on la rend `static`. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'une classe interne ?
    answer: Une classe déclarée dans une autre sans `static` ; chacun de ses objets est lié à une instance de la classe englobante, dont il garde une référence.
  - key: creation
    format: course
    question: Comment crée-t-on un objet d'une classe interne depuis l'extérieur ?
    answer: "Avec une instance englobante : `Equipe.Joueur j = equipe.new Joueur();`."
  - key: externe-this
    format: course
    question: À quoi sert `Externe.this` dans une classe interne ?
    answer: À désigner l'instance englobante, par exemple pour lire un champ de l'englobante masqué par un champ de même nom de la classe interne.
  - key: acces-private
    format: course
    question: Une classe interne peut-elle lire les champs `private` de l'englobante ?
    answer: Oui, elle accède à tous ses membres, y compris privés ; l'inverse est vrai aussi.
  - key: vf-instance-requise
    format: true-false
    question: On peut créer un objet d'une classe interne sans instance de la classe englobante.
    truth: false
    answer: Il lui faut une instance à laquelle s'attacher ; c'est la différence avec une classe imbriquée `static`.
  - key: vf-private
    format: true-false
    question: Une classe interne accède aux champs `private` de la classe englobante.
    truth: true
    answer: Elles font partie de la même classe de premier niveau.
  - key: vf-reference
    format: true-false
    question: Un objet d'une classe interne garde une référence vers l'instance englobante.
    truth: true
    answer: C'est ce qui lui permet d'accéder à son état.
  - key: vf-depuis-static
    format: true-false
    question: Une méthode `static` de la classe englobante peut écrire `new Interne()`.
    truth: false
    answer: Il n'y a pas d'instance englobante dans un contexte `static`.
  - key: qcm-creer
    format: multiple-choice
    question: Avec `Equipe e = new Equipe();`, comment créer un `Equipe.Joueur` (classe interne) ?
    choices:
      - text: "`e.new Joueur()`"
        correct: true
      - text: "`new Equipe.Joueur()`"
        correct: false
      - text: "`Equipe.new Joueur()`"
        correct: false
      - text: "`new Joueur(e)`, obligatoirement"
        correct: false
    answer: '`new Equipe.Joueur()` ne fonctionnerait que pour une classe imbriquée `static`.'
  - key: qcm-usage
    format: multiple-choice
    question: Pour quel objet une classe interne est-elle bien adaptée ?
    choices:
      - text: "L'itérateur d'une collection, qui lit ses données"
        correct: true
      - text: "Le `Builder` d'une classe"
        correct: false
      - text: "Un nœud de liste chaînée qui ne lit pas la liste"
        correct: false
      - text: "Une classe utilitaire de calcul"
        correct: false
    answer: "Les autres n'ont pas besoin de l'instance englobante : des classes `static` suffisent."
  - key: qcm-masquage
    format: multiple-choice
    question: "Dans la classe interne, un champ `nom` masque celui de l'englobante `Externe`. Comment lire celui de l'englobante ?"
    choices:
      - text: "`Externe.this.nom`"
        correct: true
      - text: "`super.nom`"
        correct: false
      - text: "`this.nom`"
        correct: false
      - text: "`Externe.nom`"
        correct: false
    answer: '`Externe.nom` ne vaudrait que pour un champ `static`.'
  - key: qcm-cout
    format: multiple-choice
    question: Que coûte une classe interne qui n'utilise pas l'instance englobante ?
    choices:
      - text: "Une référence inutile, qui peut retenir l'englobante en mémoire"
        correct: true
      - text: "Rien"
        correct: false
      - text: "Une copie complète de l'englobante"
        correct: false
      - text: "Un thread supplémentaire"
        correct: false
    answer: "D'où la règle : préférer une classe imbriquée `static` (*Effective Java*, item 24)."
  - key: code-acces-etat
    format: code-output
    question: |-
      ```java
      class Compteur {
          private int total;
          class Incrementeur { void plus() { total++; } }
          int total() { return total; }
      }
      Compteur c = new Compteur();
      Compteur.Incrementeur i = c.new Incrementeur();
      i.plus();
      i.plus();
      System.out.println(c.total());
      ```
    answer: '`2` : l''incrémenteur modifie le champ privé de son compteur.'
    check:
      output: "2"
  - key: code-externe-this
    format: code-output
    question: |-
      ```java
      class Externe {
          String nom = "externe";
          class Interne {
              String nom = "interne";
              String noms() { return nom + " " + Externe.this.nom; }
          }
      }
      System.out.println(new Externe().new Interne().noms());
      ```
    answer: '`interne externe` : `nom` désigne le champ de la classe interne, `Externe.this.nom` celui de l''englobante.'
    check:
      output: "interne externe"
  - key: code-depuis-static
    format: code-output
    question: |-
      ```java
      class Externe {
          class Interne { }
          static Interne creer() { return new Interne(); }
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `non-static variable this cannot be referenced from a static context`.'
    check:
      compiles: false
  - key: code-meme-englobante
    format: code-output
    question: |-
      ```java
      class Equipe {
          int buts;
          class Joueur { void marquer() { buts++; } }
      }
      Equipe e = new Equipe();
      Equipe.Joueur a = e.new Joueur();
      Equipe.Joueur b = e.new Joueur();
      a.marquer();
      b.marquer();
      b.marquer();
      System.out.println(e.buts);
      ```
    answer: '`3` : les deux joueurs sont attachés à la même équipe.'
    check:
      output: "3"
  - key: bug-new-statique
    format: bug-fix
    question: |-
      Ce code ne compile pas (`non-static variable this cannot be referenced from a static context`) :
      ```java
      class Liste {
          class Noeud { int valeur; Noeud suivant; }
          static Noeud creerNoeud(int v) {
              Noeud n = new Noeud();
              n.valeur = v;
              return n;
          }
      }
      ```
    answer: |-
      ```java
      class Liste {
          static class Noeud { int valeur; Noeud suivant; }
          ...
      }
      ```
      Le nœud n'a pas besoin de sa liste : en le déclarant `static`, on le crée sans instance englobante (et il ne
      retient plus la liste).
  - key: bug-creation-externe
    format: bug-fix
    question: |-
      Ce code ne compile pas (`an enclosing instance that contains Equipe.Joueur is required`) :
      ```java
      Equipe.Joueur j = new Equipe.Joueur();
      ```
      `Joueur` est une classe interne qui modifie le score de son équipe.
    answer: |-
      ```java
      Equipe equipe = new Equipe();
      Equipe.Joueur j = equipe.new Joueur();
      ```
      Un joueur appartient à une équipe : il faut l'instance englobante. (Une méthode `equipe.recruter()` qui renvoie
      `new Joueur()` serait plus lisible pour l'appelant.)
  - key: bug-masquage
    format: bug-fix
    question: |-
      La méthode de la classe interne lit son propre champ au lieu de celui de la fenêtre :
      ```java
      class Fenetre {
          String titre = "Accueil";
          class Bouton {
              String titre = "OK";
              String libelle() { return titre + " - " + titre; }   // on veut "OK - Accueil"
          }
      }
      ```
    answer: |-
      ```java
      String libelle() { return titre + " - " + Fenetre.this.titre; }
      ```
      Le champ de la classe interne masque celui de l'englobante ; `Fenetre.this.titre` désigne celui de la fenêtre.
      (Renommer l'un des deux champs serait encore plus clair.)
  - key: bug-interne-inutile
    format: bug-fix
    question: |-
      Chaque `Commande` en cache retient en mémoire le gros `Rapport` qui l'a créée :
      ```java
      class Rapport {
          private final byte[] donnees = new byte[10_000_000];
          class Ligne { final String texte; Ligne(String t) { texte = t; } }
          Ligne ligne(String t) { return new Ligne(t); }
      }
      ```
    answer: |-
      ```java
      class Rapport {
          private final byte[] donnees = new byte[10_000_000];
          static class Ligne { final String texte; Ligne(String t) { texte = t; } }
          Ligne ligne(String t) { return new Ligne(t); }
      }
      ```
      `Ligne` n'utilise pas son rapport, mais en tant que classe interne elle en garde la référence : tant qu'une ligne
      vit, le rapport et ses 10 Mo aussi. Une classe imbriquée `static` n'a pas cette référence.
