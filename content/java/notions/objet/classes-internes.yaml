notion: classes-internes
lesson: |-
  Une **classe interne** est une classe déclarée dans une autre, **sans `static`**. Chacun de ses objets est attaché à
  un objet de la classe englobante, dont il garde une **référence cachée**.

  ```java
  class Equipe {
      private int buts;

      class Joueur {                    // classe interne
          void marquer() {
              buts++;                   // accède directement à l'état de SON équipe
          }
      }
  }

  Equipe equipe = new Equipe();
  Equipe.Joueur joueur = equipe.new Joueur();   // il faut une instance englobante
  ```

  - La classe interne accède à **tous** les membres de l'englobante, même `private`.
  - On la crée **depuis une instance** : `new Joueur()` dans une méthode d'instance d'`Equipe`, ou
    `equipe.new Joueur()` de l'extérieur. Depuis une méthode `static`, il n'y a pas d'instance : erreur.
  - `Equipe.this` désigne l'instance englobante, utile quand un nom est masqué.
  - Depuis Java 16, une classe interne peut déclarer des membres `static`.

  Usage typique : un objet qui n'a de sens qu'attaché à un autre, comme l'itérateur d'une collection, qui lit les
  données de **sa** collection.

  **Piège classique** : déclarer interne une classe qui n'utilise pas l'instance englobante. Elle garde quand même
  (souvent) une référence vers elle, qui coûte de la mémoire et peut empêcher sa récupération. Dans ce cas, on la
  déclare `static`.

  **En entretien** : « Une classe interne est liée à une instance de l'englobante et y accède directement ; si elle
  n'en a pas besoin, on la rend `static`. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'une classe interne ?"
    choices:
      - {text: "Une classe déclarée dans une autre sans `static`, dont chaque objet est lié à une instance englobante", correct: true}
      - {text: "Une classe déclarée dans une autre avec `static`, sans lien avec une instance englobante", correct: false}
      - {text: "Une classe sans nom, déclarée et instanciée en une seule expression avec `new`", correct: false}
      - {text: "Une classe déclarée dans le corps d'une méthode, visible seulement dans ce bloc", correct: false}
    answer: |-
      Une classe déclarée dans une autre sans `static` ; chacun de ses objets est lié à une instance de la classe
      englobante, dont il garde une référence. Avec `static`, c'est une classe imbriquée.
  - key: creation
    format: course
    question: "Comment crée-t-on un objet d'une classe interne depuis l'extérieur ?"
    choices:
      - {text: "Depuis une instance englobante : `equipe.new Joueur()`", correct: true}
      - {text: "Sans instance englobante : `new Equipe.Joueur()`", correct: false}
      - {text: "Avec `Equipe.this.new Joueur()`, depuis n'importe où", correct: false}
      - {text: "Par réflexion seulement, avec `Joueur.class`", correct: false}
    answer: |-
      Avec une instance englobante : `Equipe.Joueur j = equipe.new Joueur();`. `new Equipe.Joueur()` est la forme d'une
      classe imbriquée `static`.
  - key: externe-this
    format: course
    question: "À quoi sert `Externe.this` dans une classe interne ?"
    choices:
      - {text: "À désigner l'instance englobante, par exemple quand un champ homonyme la masque", correct: true}
      - {text: "À désigner la classe englobante, pour appeler ses méthodes `static`", correct: false}
      - {text: "À créer une nouvelle instance de la classe englobante", correct: false}
      - {text: "À désigner l'objet de la classe interne lui-même", correct: false}
    answer: |-
      À désigner l'instance englobante, par exemple pour lire un champ de l'englobante masqué par un champ de même nom de
      la classe interne. `this` seul désigne l'objet interne.
  - key: acces-private
    format: course
    question: "Une classe interne peut-elle lire les champs `private` de l'englobante ?"
    choices:
      - {text: "Oui, et l'englobante lit aussi les membres privés de la classe interne", correct: true}
      - {text: "Non : seulement ses champs `protected` et `public`", correct: false}
      - {text: "Oui, mais l'englobante ne lit pas les membres privés de l'interne", correct: false}
      - {text: "Seulement ceux qui sont aussi déclarés `static`", correct: false}
    answer: "Oui, elle accède à tous ses membres, y compris privés ; l'inverse est vrai aussi."
  - key: vf-instance-requise
    format: true-false
    question: On peut créer un objet d'une classe interne sans instance de la classe englobante.
    truth: false
    answer: Il lui faut une instance à laquelle s'attacher ; c'est la différence avec une classe imbriquée `static`.
  - key: vf-private
    format: true-false
    question: Une classe interne accède aux champs `private` de la classe englobante.
    truth: true
    answer: Elles font partie de la même classe de premier niveau.
  - key: vf-reference
    format: true-false
    question: Un objet d'une classe interne garde une référence vers l'instance englobante.
    truth: true
    answer: C'est ce qui lui permet d'accéder à son état.
  - key: vf-depuis-static
    format: true-false
    question: Une méthode `static` de la classe englobante peut écrire `new Interne()`.
    truth: false
    answer: Il n'y a pas d'instance englobante dans un contexte `static`.
  - key: qcm-creer
    format: multiple-choice
    question: Avec `Equipe e = new Equipe();`, comment créer un `Equipe.Joueur` (classe interne) ?
    choices:
      - text: "`e.new Joueur()`"
        correct: true
      - text: "`new Equipe.Joueur()`"
        correct: false
      - text: "`Equipe.new Joueur()`"
        correct: false
      - text: "`new Joueur(e)`, obligatoirement"
        correct: false
    answer: '`new Equipe.Joueur()` ne fonctionnerait que pour une classe imbriquée `static`.'
  - key: qcm-usage
    format: multiple-choice
    question: Pour quel objet une classe interne est-elle bien adaptée ?
    choices:
      - text: "L'itérateur d'une collection, qui lit ses données"
        correct: true
      - text: "Le `Builder` d'une classe"
        correct: false
      - text: "Un nœud de liste chaînée qui ne lit pas la liste"
        correct: false
      - text: "Une classe utilitaire de calcul"
        correct: false
    answer: "Les autres n'ont pas besoin de l'instance englobante : des classes `static` suffisent."
  - key: qcm-masquage
    format: multiple-choice
    question: "Dans la classe interne, un champ `nom` masque celui de l'englobante `Externe`. Comment lire celui de l'englobante ?"
    choices:
      - text: "`Externe.this.nom`"
        correct: true
      - text: "`super.nom`"
        correct: false
      - text: "`this.nom`"
        correct: false
      - text: "`Externe.nom`"
        correct: false
    answer: '`Externe.nom` ne vaudrait que pour un champ `static`.'
  - key: qcm-cout
    format: multiple-choice
    question: Que coûte une classe interne qui n'utilise pas l'instance englobante ?
    choices:
      - {text: "Une référence inutile, qui peut retenir l'englobante en mémoire", correct: true}
      - {text: "Rien : le compilateur retire la référence si elle ne sert pas", correct: false}
      - {text: "Une copie complète de l'englobante, faite à chaque création", correct: false}
      - {text: "Un thread supplémentaire, créé avec chaque objet interne", correct: false}
    answer: "D'où la règle : préférer une classe imbriquée `static` (*Effective Java*, item 24)."
  - key: code-acces-etat
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Compteur {
          private int total;
          class Incrementeur { void plus() { total++; } }
          int total() { return total; }
      }
      Compteur c = new Compteur();
      Compteur.Incrementeur i = c.new Incrementeur();
      i.plus();
      i.plus();
      System.out.println(c.total());
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2` : l'incrémenteur modifie le champ privé de son compteur."
    check:
      output: "2"
  - key: code-externe-this
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Externe {
          String nom = "externe";
          class Interne {
              String nom = "interne";
              String noms() { return nom + " " + Externe.this.nom; }
          }
      }
      System.out.println(new Externe().new Interne().noms());
      ```
    choices:
      - {text: "`interne externe`", correct: true}
      - {text: "`interne interne`", correct: false}
      - {text: "`externe externe`", correct: false}
      - {text: "`externe interne`", correct: false}
    answer: "`interne externe` : `nom` désigne le champ de la classe interne, `Externe.this.nom` celui de l'englobante."
    check:
      output: "interne externe"
  - key: code-depuis-static
    format: code-output
    question: |-
      ```java
      class Externe {
          class Interne { }
          static Interne creer() { return new Interne(); }
      }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Ça ne compile pas : une méthode `static` n'a pas d'instance englobante", correct: true}
      - {text: "Ça compile : `creer()` renvoie un nouvel objet `Interne`", correct: false}
      - {text: "Ça compile, mais `creer()` lève une `NullPointerException`", correct: false}
      - {text: "Ça compile : `Interne` y devient `static` automatiquement", correct: false}
    answer: |-
      Non : `non-static variable this cannot be referenced from a static context`. Créer un `Interne` demande une
      instance englobante, qu'une méthode `static` n'a pas.
    check:
      compiles: false
  - key: code-meme-englobante
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Equipe {
          int buts;
          class Joueur { void marquer() { buts++; } }
      }
      Equipe e = new Equipe();
      Equipe.Joueur a = e.new Joueur();
      Equipe.Joueur b = e.new Joueur();
      a.marquer();
      b.marquer();
      b.marquer();
      System.out.println(e.buts);
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`3` : les deux joueurs sont attachés à la même équipe, et modifient le même champ `buts`."
    check:
      output: "3"
  - key: bug-new-statique
    format: bug-fix
    question: |-
      Ce code ne compile pas (`non-static variable this cannot be referenced from a static context`). Quelle correction
      est la bonne ?
      ```java
      class Liste {
          class Noeud { int valeur; Noeud suivant; }
          static Noeud creerNoeud(int v) {
              Noeud n = new Noeud();
              n.valeur = v;
              return n;
          }
      }
      ```
    choices:
      - {text: "Déclarer `Noeud` en `static`, puisqu'il n'a pas besoin de sa liste", correct: true}
      - {text: "Écrire `Liste.this.new Noeud()` dans `creerNoeud`", correct: false}
      - {text: "Déclarer la classe `Noeud` en `private`", correct: false}
      - {text: "Rendre `public` le constructeur de `Noeud`", correct: false}
    answer: |-
      ```java
      class Liste {
          static class Noeud { int valeur; Noeud suivant; }
          ...
      }
      ```
      Le nœud n'a pas besoin de sa liste : en le déclarant `static`, on le crée sans instance englobante (et il ne
      retient plus la liste). `Liste.this` n'existe pas dans une méthode `static`.
  - key: bug-creation-externe
    format: bug-fix
    question: |-
      Ce code ne compile pas (`an enclosing instance that contains Equipe.Joueur is required`). `Joueur` est une classe
      interne qui modifie le score de son équipe. Quelle correction est la bonne ?
      ```java
      Equipe.Joueur j = new Equipe.Joueur();
      ```
    choices:
      - {text: "Créer le joueur depuis une équipe : `equipe.new Joueur()`", correct: true}
      - {text: "Déclarer `Joueur` en `static`, en gardant l'accès au score", correct: false}
      - {text: "Rendre `public` le constructeur de la classe `Joueur`", correct: false}
      - {text: "Écrire `new Equipe.this.Joueur()` à la place", correct: false}
    answer: |-
      ```java
      Equipe equipe = new Equipe();
      Equipe.Joueur j = equipe.new Joueur();
      ```
      Un joueur appartient à une équipe : il faut l'instance englobante. `static` lui ferait perdre l'accès au score de
      son équipe. (Une méthode `equipe.recruter()` qui renvoie `new Joueur()` serait plus lisible pour l'appelant.)
  - key: bug-masquage
    format: bug-fix
    question: |-
      La méthode de la classe interne lit son propre champ au lieu de celui de la fenêtre. Quelle correction est la
      bonne ?
      ```java
      class Fenetre {
          String titre = "Accueil";
          class Bouton {
              String titre = "OK";
              String libelle() { return titre + " - " + titre; }   // on veut "OK - Accueil"
          }
      }
      ```
    choices:
      - {text: "Écrire `Fenetre.this.titre` pour le second titre", correct: true}
      - {text: "Écrire `this.titre` pour le second titre", correct: false}
      - {text: "Écrire `super.titre` pour le second titre", correct: false}
      - {text: "Écrire `Fenetre.titre` pour le second titre", correct: false}
    answer: |-
      ```java
      String libelle() { return titre + " - " + Fenetre.this.titre; }
      ```
      Le champ de la classe interne masque celui de l'englobante ; `Fenetre.this.titre` désigne celui de la fenêtre.
      (Renommer l'un des deux champs serait encore plus clair.)
  - key: bug-interne-inutile
    format: bug-fix
    question: |-
      Chaque `Ligne` gardée en cache retient en mémoire le gros `Rapport` qui l'a créée. Quelle correction est la bonne ?
      ```java
      class Rapport {
          private final byte[] donnees = new byte[10_000_000];
          class Ligne { final String texte; Ligne(String t) { texte = t; } }
          Ligne ligne(String t) { return new Ligne(t); }
      }
      ```
    choices:
      - {text: "Déclarer `Ligne` en `static`, pour supprimer la référence cachée au rapport", correct: true}
      - {text: "Déclarer le tableau `donnees` en `transient` dans le rapport", correct: false}
      - {text: "Appeler `System.gc()` après chaque création de ligne", correct: false}
      - {text: "Déclarer `Ligne` en `final` pour la rendre immuable", correct: false}
    answer: |-
      ```java
      class Rapport {
          private final byte[] donnees = new byte[10_000_000];
          static class Ligne { final String texte; Ligne(String t) { texte = t; } }
          Ligne ligne(String t) { return new Ligne(t); }
      }
      ```
      `Ligne` n'utilise pas son rapport, mais en tant que classe interne elle en garde la référence : tant qu'une ligne
      vit, le rapport et ses 10 Mo aussi. Une classe imbriquée `static` n'a pas cette référence.
