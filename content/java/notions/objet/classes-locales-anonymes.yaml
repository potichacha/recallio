notion: classes-locales-anonymes
lesson: |-
  Deux sortes de classes se déclarent **dans un bloc de code** :

  - une **classe locale**, nommée, déclarée dans une méthode et visible seulement dans ce bloc (depuis Java 16, aussi
    des **records**, enums et interfaces locaux) ;
  - une **classe anonyme**, sans nom, déclarée et instanciée en une seule expression :
    `new Interface() { ... }` ou `new Parent(args) { ... }`.

  ```java
  static String bornes(List<Integer> notes) {
      record Bornes(int min, int max) { }                 // record local
      Bornes b = new Bornes(Collections.min(notes), Collections.max(notes));
      return b.min() + "-" + b.max();
  }

  Iterator<Integer> troisPremiers = new Iterator<>() {   // classe anonyme, avec un état
      private int n = 0;
      public boolean hasNext() { return n < 3; }
      public Integer next() { return ++n; }
  };
  ```

  - Elles peuvent **capturer** les variables locales de la méthode, à condition qu'elles soient **effectivement
    finales** (jamais réaffectées). La valeur est copiée dans l'objet.
  - Dans une classe anonyme, `this` désigne **l'objet anonyme** ; dans une lambda, `this` désigne l'objet englobant.
  - Pour une interface fonctionnelle (une seule méthode abstraite), on préfère une **lambda**. La classe anonyme reste
    utile pour plusieurs méthodes, un état propre ou l'extension d'une classe.

  **Piège classique** : modifier un compteur local depuis une classe anonyme ou une lambda. La variable doit être
  effectivement finale : erreur de compilation. Il faut un champ, un `AtomicInteger`, ou mieux un calcul sans
  mutation.

  **En entretien** : « Une classe anonyme se déclare et s'instancie en une expression ; elle capture des variables
  effectivement finales, et on la remplace par une lambda quand l'interface est fonctionnelle. »
cards:
  - key: classe-anonyme
    format: course
    question: Qu'est-ce qu'une classe anonyme ?
    answer: Une classe sans nom, déclarée et instanciée en une seule expression (`new Interface() { ... }`), qui implémente une interface ou étend une classe.
  - key: effectivement-final
    format: course
    question: Que veut dire « effectivement finale » ?
    answer: Une variable locale jamais réaffectée après son initialisation, même sans le mot-clé `final` ; seules celles-là peuvent être capturées par une classe locale, anonyme ou une lambda.
  - key: this-anonyme-lambda
    format: course
    question: Que désigne `this` dans une classe anonyme, et dans une lambda ?
    answer: Dans une classe anonyme, l'objet anonyme lui-même ; dans une lambda, l'objet de la méthode englobante (une lambda n'introduit pas de nouveau `this`).
  - key: anonyme-ou-lambda
    format: course
    question: Quand préférer une classe anonyme à une lambda ?
    answer: Quand il faut plusieurs méthodes, un état propre (des champs) ou étendre une classe ; pour une interface fonctionnelle, la lambda est plus concise.
  - key: vf-capture-modifiable
    format: true-false
    question: Une classe anonyme peut modifier une variable locale de la méthode qui la crée.
    truth: false
    answer: Elle ne capture que des variables effectivement finales.
  - key: vf-record-local
    format: true-false
    question: Depuis Java 16, on peut déclarer un record dans une méthode.
    truth: true
    answer: Les records, enums et interfaces locaux sont permis.
  - key: vf-anonyme-etat
    format: true-false
    question: Une classe anonyme peut avoir des champs.
    truth: true
    answer: Contrairement à une lambda, elle peut porter un état.
  - key: vf-anonyme-constructeur
    format: true-false
    question: Une classe anonyme peut déclarer un constructeur.
    truth: false
    answer: Elle n'a pas de nom ; elle passe ses arguments au constructeur du parent et peut utiliser un bloc d'initialisation.
  - key: qcm-capture
    format: multiple-choice
    question: "Dans `void m() { int a = 1; int b = 2; b++; Runnable r = new Runnable() { public void run() { ... } }; }`, quelles variables le `run` peut-il lire ?"
    choices:
      - text: "`a`"
        correct: true
      - text: "`b`"
        correct: false
      - text: "Les deux"
        correct: false
      - text: "Aucune"
        correct: false
    answer: '`b` est réaffectée, elle n''est pas effectivement finale.'
  - key: qcm-remplacer
    format: multiple-choice
    question: Par quoi remplacer `new Comparator<String>() { public int compare(String a, String b) { return a.length() - b.length(); } }` ?
    choices:
      - text: "`Comparator.comparingInt(String::length)`"
        correct: true
      - text: "`(a, b) -> a.length() - b.length()`"
        correct: true
      - text: "`new Comparator<String>()`"
        correct: false
      - text: "`String::compareTo`"
        correct: false
    answer: '`Comparator` est fonctionnelle : une lambda ou une fabrique suffisent ; `String::compareTo` comparerait l''ordre alphabétique.'
  - key: qcm-anonyme-utile
    format: multiple-choice
    question: Dans quel cas une classe anonyme reste-t-elle le bon outil ?
    choices:
      - text: "Implémenter `Iterator`, qui a deux méthodes abstraites et un état"
        correct: true
      - text: "Implémenter `Runnable` en une ligne"
        correct: false
      - text: "Implémenter `Comparator` par longueur"
        correct: false
      - text: "Implémenter `Predicate<String>`"
        correct: false
    answer: "Les trois autres sont des interfaces fonctionnelles : une lambda suffit."
  - key: qcm-portee
    format: multiple-choice
    question: Où une classe locale est-elle visible ?
    choices:
      - text: "Seulement dans le bloc où elle est déclarée"
        correct: true
      - text: "Dans toute la classe englobante"
        correct: false
      - text: "Dans tout le package"
        correct: false
      - text: "Partout, si elle est `public`"
        correct: false
    answer: Une classe locale ne peut d'ailleurs pas avoir de modificateur d'accès.
  - key: code-capture-modifiee
    format: code-output
    question: |-
      ```java
      static Runnable creer() {
          int compteur = 0;
          compteur++;
          return new Runnable() {
              public void run() { System.out.println(compteur); }
          };
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `local variables referenced from an inner class must be final or effectively final`.'
    check:
      compiles: false
  - key: code-iterator-anonyme
    format: code-output
    question: |-
      ```java
      Iterator<Integer> trois = new Iterator<>() {
          private int n = 0;
          public boolean hasNext() { return n < 3; }
          public Integer next() { return ++n; }
      };
      while (trois.hasNext()) {
          System.out.print(trois.next());
      }
      ```
    answer: '`123` : la classe anonyme garde son propre état entre les appels.'
    check:
      output: "123"
  - key: code-this
    format: code-output
    question: |-
      ```java
      class Test {
          String nom() { return "Test"; }
          void lancer() {
              Runnable anonyme = new Runnable() {
                  public void run() { System.out.print(this.getClass().isAnonymousClass() + " "); }
              };
              Runnable lambda = () -> System.out.print(this.nom());
              anonyme.run();
              lambda.run();
          }
      }
      new Test().lancer();
      ```
    answer: '`true Test` : `this` désigne l''objet anonyme dans la classe anonyme, et l''objet `Test` dans la lambda.'
    check:
      output: "true Test"
  - key: code-record-local
    format: code-output
    question: |-
      ```java
      static String bornes(List<Integer> notes) {
          record Bornes(int min, int max) { }
          Bornes b = new Bornes(Collections.min(notes), Collections.max(notes));
          return b.min() + "-" + b.max();
      }
      System.out.println(bornes(List.of(12, 8, 17)));
      ```
    answer: '`8-17` : un record local regroupe deux valeurs sans créer de classe visible ailleurs.'
    check:
      output: "8-17"
  - key: bug-compteur-capture
    format: bug-fix
    question: |-
      Ce code ne compile pas (`local variables referenced from a lambda expression must be final or effectively final`) :
      ```java
      int total = 0;
      commandes.forEach(c -> total += c.montant());
      ```
    answer: |-
      ```java
      int total = commandes.stream()
              .mapToInt(Commande::montant)
              .sum();
      ```
      On ne modifie pas une variable locale depuis une lambda (ou une classe anonyme) : on exprime le calcul sans
      mutation, ici une somme.
  - key: bug-anonyme-verbeuse
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      bouton.surClic(new EcouteurClic() {
          @Override
          public void clic(Evenement e) {
              enregistrer(e);
          }
      });
      ```
      `EcouteurClic` n'a qu'une méthode abstraite.
    answer: |-
      ```java
      bouton.surClic(e -> enregistrer(e));
      // ou : bouton.surClic(this::enregistrer);
      ```
      Pour une interface fonctionnelle, une lambda (ou une référence de méthode) remplace la classe anonyme.
  - key: bug-this-anonyme
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: method rafraichir()`) :
      ```java
      class Ecran {
          void rafraichir() { ... }
          void demarrer(Minuteur m) {
              m.chaqueSeconde(new Runnable() {
                  public void run() { this.rafraichir(); }
              });
          }
      }
      ```
    answer: |-
      ```java
      void demarrer(Minuteur m) {
          m.chaqueSeconde(() -> rafraichir());
      }
      ```
      Dans la classe anonyme, `this` désigne le `Runnable`, qui n'a pas de `rafraichir`. Une lambda n'introduit pas de
      `this` : l'appel vise l'`Ecran` (sinon, il fallait `Ecran.this.rafraichir()`).
  - key: bug-paire-anonyme
    format: bug-fix
    question: |-
      Pour renvoyer deux valeurs, la méthode remplit un tableau d'`Object` :
      ```java
      Object[] resultat = { min, max };
      int min2 = (int) resultat[0];
      ```
    answer: |-
      ```java
      record Bornes(int min, int max) { }
      Bornes resultat = new Bornes(min, max);
      int min2 = resultat.min();
      ```
      Un record (éventuellement local, s'il ne sert qu'à cette méthode) nomme et type chaque valeur : plus de cast,
      plus d'indice magique.
