notion: membres-static
cards:
  - key: classe-utilitaire-instanciee-partout-alors
    format: scenario
    question: Une classe utilitaire est instanciée partout alors qu'elle n'a que des méthodes static.
    answer: |-
      Je lui donnerais un constructeur `private` (éventuellement qui lève une exception pour bloquer aussi la réflexion) et je la déclarerais `final`. Ça documente l'intention et empêche l'instanciation et l'héritage.
      Mais je me demanderais aussi si ces méthodes statiques ne gênent pas les tests : une méthode statique ne se mocke pas facilement. Si elle dépend d'un état externe (horloge, configuration, réseau), mieux vaut en faire un bean injecté.
