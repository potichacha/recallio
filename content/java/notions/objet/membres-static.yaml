notion: membres-static
lesson: |-
  Un membre **`static`** appartient à la **classe**, pas à ses objets : il existe en un seul exemplaire, partagé par
  toutes les instances, et s'utilise sans objet.

  ```java
  class Ticket {
      static int crees;                    // un seul compteur pour toute la classe
      static final int MAX = 100;          // constante de classe
      final int numero;                    // un numéro par objet

      Ticket() {
          numero = ++crees;
      }

      static boolean complet() {           // pas de this ici
          return crees >= MAX;
      }
  }
  Ticket.complet();                        // appel par le nom de la classe
  ```

  - Une méthode `static` ne peut pas lire un champ d'instance ni appeler une méthode d'instance sans objet.
  - On peut écrire `objet.membreStatique`, mais c'est trompeur : le compilateur l'appelle sur la **classe**, même si
    `objet` vaut `null`. On écrit toujours `Classe.membre`.
  - Usages sains : **constantes** (`static final`, en `MAJUSCULES_SOULIGNEES`), **fabriques** (`List.of`), **fonctions
    pures** (`Math.max`), compteurs globaux.
  - Un état `static` **mutable** est un état global : partagé entre les threads et entre les tests, difficile à
    remplacer dans un test.

  **Piège classique** : une collection `static` dans laquelle on ajoute sans jamais retirer. Elle vit aussi longtemps
  que la classe, c'est-à-dire en général toute la vie de l'application : une fuite mémoire.

  **En entretien** : « `static` = un seul exemplaire pour la classe ; parfait pour les constantes et les fonctions
  pures, à éviter pour un état mutable. »
tour:
  - title: Les membres static
    text: |-
      Un champ `static` appartient à la **classe** : tous ses objets le partagent, et il existe même sans aucun objet.
      C'est le bon endroit pour un compteur d'instances, ou une constante.

      Une méthode `static` ne voit que les membres `static` : elle n'a pas de `this`. Le piège : un champ `static`
      modifiable est un état global, partagé par tout le programme, qui complique les tests et la concurrence.
    example:
      files:
        Main.java: |-
          void main() {
              Ticket a = new Ticket();
              Ticket b = new Ticket();
              IO.println(a.numero() + " " + b.numero());
              IO.println("tickets émis : " + Ticket.emis());
          }
        Ticket.java: |-
          public class Ticket {
              private static int emis = 0;
              private final int numero;

              public Ticket() {
                  emis++;
                  numero = emis;
              }

              int numero() {
                  return numero;
              }

              static int emis() {
                  return emis;
              }
          }
      output: |-
        1 2
        tickets émis : 2
cards:
  - key: definition-static
    format: course
    question: Qu'est-ce qu'un champ `static` ?
    answer: "Un champ qui appartient à la classe : il existe en un seul exemplaire, partagé par toutes les instances."
  - key: acces-instance
    format: course
    question: Pourquoi une méthode `static` ne peut-elle pas lire un champ d'instance ?
    answer: "Elle s'exécute sans objet courant (pas de `this`) : il n'y a pas de champ d'instance à lire, sauf si on lui passe un objet."
  - key: etat-global
    format: course
    question: Pourquoi se méfier d'un champ `static` mutable ?
    answer: C'est un état global, partagé par tous les threads (risque de concurrence) et par tous les tests (qui deviennent dépendants de leur ordre), et difficile à remplacer par un double de test.
  - key: usages-sains
    format: course
    question: Quels sont les bons usages de `static` ?
    answer: Les constantes (`static final`), les fabriques statiques (`List.of`), les fonctions pures sans état (`Math.max`) et les classes utilitaires.
  - key: vf-partage
    format: true-false
    question: Toutes les instances d'une classe partagent le même champ `static`.
    truth: true
    answer: Il n'en existe qu'un exemplaire, attaché à la classe.
  - key: vf-instance-null
    format: true-false
    question: "Appeler une méthode `static` via une variable qui vaut `null` lève une `NullPointerException`."
    truth: false
    answer: L'appel est résolu sur le type déclaré de la variable, sans regarder l'objet.
  - key: vf-static-this
    format: true-false
    question: Une méthode `static` peut appeler une méthode d'instance de sa classe sans objet.
    truth: false
    answer: Il lui faut un objet sur lequel appeler la méthode d'instance.
  - key: vf-constante
    format: true-false
    question: Par convention, une constante `static final` s'écrit en majuscules séparées par des soulignés.
    truth: true
    answer: Par exemple `TAILLE_MAX` ou `TAUX_TVA`.
  - key: qcm-appel
    format: multiple-choice
    question: Quelle est la bonne façon d'appeler la méthode `static` `Tarif.calculer()` ?
    choices:
      - text: "`Tarif.calculer()`"
        correct: true
      - text: "`new Tarif().calculer()`"
        correct: false
      - text: "`this.calculer()` depuis une autre classe"
        correct: false
      - text: "`Tarif::calculer()`"
        correct: false
    answer: Par le nom de la classe ; passer par un objet compile mais trompe le lecteur.
  - key: qcm-compile
    format: multiple-choice
    question: Dans une méthode `static` de la classe `Compte`, qu'est-ce qui compile ?
    choices:
      - text: "Lire un champ `static` de `Compte`"
        correct: true
      - text: "Lire le champ d'instance `solde` d'un `Compte c` reçu en paramètre : `c.solde`"
        correct: true
      - text: "Lire directement le champ d'instance `solde`"
        correct: false
      - text: "Utiliser `this`"
        correct: false
    answer: Sans objet courant, un champ d'instance ne se lit qu'au travers d'une référence explicite.
  - key: qcm-bon-candidat
    format: multiple-choice
    question: Lequel de ces membres a le plus de raisons d'être `static` ?
    choices:
      - text: "`static final double TAUX_TVA = 0.2;`"
        correct: true
      - text: "Le `solde` d'un compte"
        correct: false
      - text: "Le panier de l'utilisateur connecté"
        correct: false
      - text: "La liste des commandes en cours, modifiée par toutes les requêtes"
        correct: false
    answer: Une constante immuable ; les autres sont un état propre à un objet ou un état global mutable.
  - key: qcm-duree-vie
    format: multiple-choice
    question: Combien de temps vit un champ `static` ?
    choices:
      - text: "Autant que sa classe chargée, en général toute la vie de l'application"
        correct: true
      - text: "Jusqu'à la fin de la méthode qui l'utilise"
        correct: false
      - text: "Jusqu'au prochain passage du ramasse-miettes"
        correct: false
      - text: "Autant que le dernier objet créé de la classe"
        correct: false
    answer: C'est pourquoi une collection `static` qui grossit est une fuite mémoire classique.
  - key: code-compteur
    format: code-output
    question: |-
      ```java
      class Ticket {
          static int crees;
          final int numero;
          Ticket() { numero = ++crees; }
      }
      new Ticket();
      new Ticket();
      Ticket t = new Ticket();
      System.out.println(t.numero + " " + Ticket.crees);
      ```
    answer: '`3 3` : le compteur est partagé, chaque ticket garde son numéro.'
    check:
      output: "3 3"
  - key: code-liste-partagee
    format: code-output
    question: |-
      ```java
      class Panier {
          static List<String> articles = new ArrayList<>();
      }
      Panier a = new Panier();
      Panier b = new Panier();
      a.articles.add("pomme");
      System.out.println(b.articles);
      ```
    answer: '`[pomme]` : les deux paniers partagent la même liste `static`.'
    check:
      output: "[pomme]"
  - key: code-reference-null
    format: code-output
    question: |-
      ```java
      class Outils {
          static String nom() { return "outils"; }
      }
      Outils o = null;
      System.out.println(o.nom());
      ```
    answer: '`outils` : l''appel est résolu sur la classe, la valeur `null` n''est jamais utilisée.'
    check:
      output: "outils"
  - key: code-champ-instance
    format: code-output
    question: |-
      ```java
      class Compte {
          double solde;
          static double lire() { return solde; }
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `non-static variable solde cannot be referenced from a static context`.'
    check:
      compiles: false
  - key: bug-compteur-instance
    format: bug-fix
    question: |-
      Chaque commande reçoit le numéro 1 :
      ```java
      class Commande {
          int prochainNumero = 1;
          final int numero;
          Commande() { numero = prochainNumero++; }
      }
      ```
    answer: |-
      ```java
      class Commande {
          private static int prochainNumero = 1;
          final int numero;
          Commande() { numero = prochainNumero++; }
      }
      ```
      Le compteur doit être partagé par toutes les commandes, donc `static`. (En multithread, il faudrait un
      `AtomicInteger`.)
  - key: bug-acces-par-instance
    format: bug-fix
    question: |-
      Ce code semble endormir le thread `t`, mais c'est le thread courant qui s'arrête une seconde :
      ```java
      Thread t = new Thread(tache);
      t.sleep(1000);
      ```
    answer: |-
      ```java
      Thread.sleep(1000);
      ```
      `sleep` est `static` : il endort le thread **courant**, pas `t`. L'appeler par la classe rend le comportement
      évident.
  - key: bug-cache-fuite
    format: bug-fix
    question: |-
      La mémoire du serveur grossit jusqu'à `OutOfMemoryError` :
      ```java
      class Historique {
          static final List<Requete> TOUTES = new ArrayList<>();
          static void enregistrer(Requete r) { TOUTES.add(r); }
      }
      ```
    answer: |-
      ```java
      class Historique {
          private static final int TAILLE = 1_000;
          private final Deque<Requete> recentes = new ArrayDeque<>();

          void enregistrer(Requete r) {
              if (recentes.size() == TAILLE) {
                  recentes.removeFirst();
              }
              recentes.addLast(r);
          }
      }
      ```
      Une collection `static` vit toute la vie de l'application et retient tout ce qu'on y met. On borne sa taille
      (et une instance injectée remplace l'état global).
  - key: bug-static-test
    format: bug-fix
    question: |-
      Les tests passent seuls, mais échouent quand ils tournent ensemble :
      ```java
      class Configuration {
          static String langue = "fr";
      }
      // un test fait Configuration.langue = "en"; et ne le remet jamais
      ```
    answer: |-
      ```java
      record Configuration(String langue) {}
      // chaque objet qui en a besoin reçoit sa Configuration par son constructeur
      ```
      L'état `static` mutable fuit d'un test à l'autre. Une configuration immuable, passée par le constructeur, rend
      chaque test indépendant.
  - key: classe-utilitaire-instanciee-partout-alors
    format: scenario
    question: Une classe utilitaire est instanciée partout alors qu'elle n'a que des méthodes static.
    answer: |-
      Je lui donnerais un constructeur `private` (éventuellement qui lève une exception pour bloquer aussi la réflexion) et je la déclarerais `final`. Ça documente l'intention et empêche l'instanciation et l'héritage.
      Mais je me demanderais aussi si ces méthodes statiques ne gênent pas les tests : une méthode statique ne se mocke pas facilement. Si elle dépend d'un état externe (horloge, configuration, réseau), mieux vaut en faire un bean injecté.
  - key: scenario-static-ou-instance
    format: scenario
    question: Comment décides-tu qu'une méthode doit être `static` ?
    answer: |-
      Une méthode peut être `static` si elle ne dépend que de ses paramètres et ne touche à aucun état d'objet : une
      fonction pure comme `Montants.arrondir(valeur)`. Dès qu'elle dépend d'un état ou d'une ressource externe (base,
      horloge, configuration), j'en fais une méthode d'instance d'un objet injecté : on peut alors la remplacer dans un
      test et changer d'implémentation. Je me méfie aussi des méthodes `static` qui grossissent : c'est souvent un objet
      qui n'ose pas dire son nom.
  - key: scenario-date-format-partage
    format: scenario
    question: Sous charge, des dates formatées sortent corrompues. Le code utilise un `static final SimpleDateFormat`. Ton analyse ?
    answer: |-
      `SimpleDateFormat` n'est pas thread-safe : il garde un état interne pendant le formatage, et le partager via un
      champ `static` entre les threads mélange leurs calculs. Je le remplace par `DateTimeFormatter` (java.time), qui
      est immuable et donc partageable sans risque en `static final`. Si on ne peut pas migrer, un `ThreadLocal` ou une
      instance par appel. Leçon générale : un `static` partagé doit être immuable ou thread-safe.
  - key: scenario-tests-ordre
    format: scenario
    question: Une suite de tests échoue selon l'ordre d'exécution. Comment cherches-tu la cause ?
    answer: |-
      Je soupçonne un état partagé qui survit entre les tests : un champ `static` mutable, un singleton, une variable
      système, une base non nettoyée. Je lance le test fautif seul (il passe ?), puis avec le test précédent, pour isoler
      le couple. Une fois l'état trouvé, je corrige à la racine : supprimer l'état global (injection, objets immuables),
      ou à défaut le réinitialiser dans un `@BeforeEach`. Je ne fixe pas l'ordre des tests, qui ne ferait que cacher le
      problème.
