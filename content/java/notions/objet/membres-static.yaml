notion: membres-static
lesson: |-
  Un membre **`static`** appartient à la **classe**, pas à ses objets : il existe en un seul exemplaire, partagé par
  toutes les instances, et s'utilise sans objet.

  ```java
  class Ticket {
      static int crees;                    // un seul compteur pour toute la classe
      static final int MAX = 100;          // constante de classe
      final int numero;                    // un numéro par objet

      Ticket() {
          numero = ++crees;
      }

      static boolean complet() {           // pas de this ici
          return crees >= MAX;
      }
  }
  Ticket.complet();                        // appel par le nom de la classe
  ```

  - Une méthode `static` ne peut pas lire un champ d'instance ni appeler une méthode d'instance sans objet.
  - On peut écrire `objet.membreStatique`, mais c'est trompeur : le compilateur l'appelle sur la **classe**, même si
    `objet` vaut `null`. On écrit toujours `Classe.membre`.
  - Usages sains : **constantes** (`static final`, en `MAJUSCULES_SOULIGNEES`), **fabriques** (`List.of`), **fonctions
    pures** (`Math.max`), compteurs globaux.
  - Un état `static` **mutable** est un état global : partagé entre les threads et entre les tests, difficile à
    remplacer dans un test.

  **Piège classique** : une collection `static` dans laquelle on ajoute sans jamais retirer. Elle vit aussi longtemps
  que la classe, c'est-à-dire en général toute la vie de l'application : une fuite mémoire.

  **En entretien** : « `static` = un seul exemplaire pour la classe ; parfait pour les constantes et les fonctions
  pures, à éviter pour un état mutable. »
tour:
  - title: Les membres static
    text: |-
      Un champ `static` appartient à la **classe** : tous ses objets le partagent, et il existe même sans aucun objet.
      C'est le bon endroit pour un compteur d'instances, ou une constante.

      Une méthode `static` ne voit que les membres `static` : elle n'a pas de `this`. Le piège : un champ `static`
      modifiable est un état global, partagé par tout le programme, qui complique les tests et la concurrence.
    example:
      files:
        Main.java: |-
          void main() {
              Ticket a = new Ticket();
              Ticket b = new Ticket();
              IO.println(a.numero() + " " + b.numero());
              IO.println("tickets émis : " + Ticket.emis());
          }
        Ticket.java: |-
          public class Ticket {
              private static int emis = 0;
              private final int numero;

              public Ticket() {
                  emis++;
                  numero = emis;
              }

              int numero() {
                  return numero;
              }

              static int emis() {
                  return emis;
              }
          }
      output: |-
        1 2
        tickets émis : 2
cards:
  - key: definition-static
    format: course
    question: "Qu'est-ce qu'un champ `static` ?"
    choices:
      - {text: "Un champ de la classe, en un seul exemplaire partagé par toutes les instances", correct: true}
      - {text: "Un champ dont la valeur ne peut plus changer après son initialisation", correct: false}
      - {text: "Un champ copié dans chaque instance, mais invisible des sous-classes", correct: false}
      - {text: "Un champ rangé sur la pile, plus rapide à lire qu'un champ ordinaire", correct: false}
    answer: |-
      Un champ qui appartient à la classe : il existe en un seul exemplaire, partagé par toutes les instances. Un champ
      qui ne change plus est `final`, pas `static`.
  - key: acces-instance
    format: course
    question: "Pourquoi une méthode `static` ne peut-elle pas lire un champ d'instance ?"
    choices:
      - {text: "Elle s'exécute sans objet courant : sans `this`, pas de champ d'instance", correct: true}
      - {text: "Les champs d'instance sont `private` par défaut, invisibles d'une `static`", correct: false}
      - {text: "Une méthode `static` s'exécute avant la création de tout objet du programme", correct: false}
      - {text: "Le compilateur l'interdit pour des raisons de performance seulement", correct: false}
    answer: |-
      Elle s'exécute sans objet courant (pas de `this`) : il n'y a pas de champ d'instance à lire, sauf si on lui passe
      un objet.
  - key: etat-global
    format: course
    question: "Pourquoi se méfier d'un champ `static` mutable ?"
    choices:
      - {text: "C'est un état global, partagé par tous les threads et tous les tests", correct: true}
      - {text: "Il est recopié dans chaque instance, ce qui gaspille de la mémoire", correct: false}
      - {text: "Il est remis à zéro à chaque passage du ramasse-miettes", correct: false}
      - {text: "Il n'est visible que dans le thread qui l'a initialisé", correct: false}
    answer: |-
      C'est un état global, partagé par tous les threads (risque de concurrence) et par tous les tests (qui deviennent
      dépendants de leur ordre), et difficile à remplacer par un double de test.
  - key: usages-sains
    format: course
    question: "Quelle liste ne réunit que de bons usages de `static` ?"
    choices:
      - {text: "Constantes, fabriques statiques, fonctions pures et classes utilitaires", correct: true}
      - {text: "Caches et compteurs mutables partagés, pour éviter de passer des objets", correct: false}
      - {text: "Services qui accèdent à la base, pour les appeler sans injection", correct: false}
      - {text: "Réglages modifiables par les tests, pour les changer facilement", correct: false}
    answer: |-
      Les constantes (`static final`), les fabriques statiques (`List.of`), les fonctions pures sans état (`Math.max`)
      et les classes utilitaires. Un état mutable ou une ressource externe en `static` devient un état global.
  - key: vf-partage
    format: true-false
    question: Toutes les instances d'une classe partagent le même champ `static`.
    truth: true
    answer: Il n'en existe qu'un exemplaire, attaché à la classe.
  - key: vf-instance-null
    format: true-false
    question: "Appeler une méthode `static` via une variable qui vaut `null` lève une `NullPointerException`."
    truth: false
    answer: L'appel est résolu sur le type déclaré de la variable, sans regarder l'objet.
  - key: vf-static-this
    format: true-false
    question: Une méthode `static` peut appeler une méthode d'instance de sa classe sans objet.
    truth: false
    answer: Il lui faut un objet sur lequel appeler la méthode d'instance.
  - key: vf-constante
    format: true-false
    question: Par convention, une constante `static final` s'écrit en majuscules séparées par des soulignés.
    truth: true
    answer: Par exemple `TAILLE_MAX` ou `TAUX_TVA`.
  - key: qcm-appel
    format: multiple-choice
    question: Quelle est la bonne façon d'appeler la méthode `static` `Tarif.calculer()` ?
    choices:
      - text: "`Tarif.calculer()`"
        correct: true
      - text: "`new Tarif().calculer()`"
        correct: false
      - text: "`this.calculer()` depuis une autre classe"
        correct: false
      - text: "`Tarif::calculer()`"
        correct: false
    answer: Par le nom de la classe ; passer par un objet compile mais trompe le lecteur.
  - key: qcm-compile
    format: multiple-choice
    question: "Dans une méthode `static` de la classe `Compte`, laquelle de ces lectures compile ?"
    choices:
      - {text: "`c.solde`, où `c` est un `Compte` reçu en paramètre", correct: true}
      - {text: "`solde`, le champ d'instance, lu directement", correct: false}
      - {text: "`this.solde`", correct: false}
      - {text: "`super.solde`", correct: false}
    answer: |-
      Sans objet courant, un champ d'instance ne se lit qu'au travers d'une référence explicite ; `this` et `super`
      n'existent pas dans une méthode `static`.
  - key: qcm-bon-candidat
    format: multiple-choice
    question: Lequel de ces membres a le plus de raisons d'être `static` ?
    choices:
      - text: "`static final double TAUX_TVA = 0.2;`"
        correct: true
      - text: "Le `solde` d'un compte"
        correct: false
      - text: "Le panier de l'utilisateur connecté"
        correct: false
      - text: "La liste des commandes en cours, modifiée par toutes les requêtes"
        correct: false
    answer: Une constante immuable ; les autres sont un état propre à un objet ou un état global mutable.
  - key: qcm-duree-vie
    format: multiple-choice
    question: Combien de temps vit un champ `static` ?
    choices:
      - {text: "Autant que sa classe chargée, en général toute la vie de l'application", correct: true}
      - {text: "Jusqu'à la fin de la méthode qui l'a utilisé pour la dernière fois", correct: false}
      - {text: "Jusqu'au prochain passage du ramasse-miettes, qui le remet à zéro", correct: false}
      - {text: "Autant que le dernier objet de la classe encore référencé", correct: false}
    answer: C'est pourquoi une collection `static` qui grossit est une fuite mémoire classique.
  - key: code-compteur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Ticket {
          static int crees;
          final int numero;
          Ticket() { numero = ++crees; }
      }
      new Ticket();
      new Ticket();
      Ticket t = new Ticket();
      System.out.println(t.numero + " " + Ticket.crees);
      ```
    choices:
      - {text: "`3 3`", correct: true}
      - {text: "`1 3`", correct: false}
      - {text: "`3 1`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`3 3` : le compteur est partagé, chaque ticket garde son numéro."
    check:
      output: "3 3"
  - key: code-liste-partagee
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Panier {
          static List<String> articles = new ArrayList<>();
      }
      Panier a = new Panier();
      Panier b = new Panier();
      a.articles.add("pomme");
      System.out.println(b.articles);
      ```
    choices:
      - {text: "`[pomme]`", correct: true}
      - {text: "`[]`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `[pomme]` : les deux paniers partagent la même liste `static`. Y accéder par une instance compile, avec un
      simple avertissement.
    check:
      output: "[pomme]"
  - key: code-reference-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Outils {
          static String nom() { return "outils"; }
      }
      Outils o = null;
      System.out.println(o.nom());
      ```
    choices:
      - {text: "`outils`", correct: true}
      - {text: "Une `NullPointerException`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`outils` : l'appel est résolu sur la classe, la valeur `null` n'est jamais utilisée."
    check:
      output: "outils"
  - key: code-champ-instance
    format: code-output
    question: |-
      ```java
      class Compte {
          double solde;
          static double lire() { return solde; }
      }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas : `solde` n'est pas `static`", correct: true}
      - {text: "Oui : `lire()` renvoie `0.0`, la valeur par défaut", correct: false}
      - {text: "Oui, mais `lire()` lève une `NullPointerException`", correct: false}
      - {text: "Oui : `lire()` renvoie le solde du dernier compte", correct: false}
    answer: |-
      Non : `non-static variable solde cannot be referenced from a static context`. Sans objet courant, il n'y a pas de
      `solde` à lire.
    check:
      compiles: false
  - key: bug-compteur-instance
    format: bug-fix
    question: |-
      Chaque commande reçoit le numéro 1. Quelle correction est la bonne ?
      ```java
      class Commande {
          int prochainNumero = 1;
          final int numero;
          Commande() { numero = prochainNumero++; }
      }
      ```
    choices:
      - {text: "Déclarer `prochainNumero` `static`, partagé par toutes les commandes", correct: true}
      - {text: "Déclarer `prochainNumero` `final`, pour qu'il garde sa valeur", correct: false}
      - {text: "Écrire `++prochainNumero` au lieu de `prochainNumero++`", correct: false}
      - {text: "Initialiser `prochainNumero` dans le constructeur", correct: false}
    answer: |-
      ```java
      class Commande {
          private static int prochainNumero = 1;
          final int numero;
          Commande() { numero = prochainNumero++; }
      }
      ```
      Le compteur doit être partagé par toutes les commandes, donc `static`. (En multithread, il faudrait un
      `AtomicInteger`.)
  - key: bug-acces-par-instance
    format: bug-fix
    question: |-
      Ce code semble endormir le thread `t`, mais c'est le thread courant qui s'arrête une seconde. Pourquoi ?
      ```java
      Thread t = new Thread(tache);
      t.sleep(1000);
      ```
    choices:
      - {text: "`sleep` est `static` : il endort toujours le thread courant", correct: true}
      - {text: "`t` n'est pas démarré : `sleep` se reporte sur le courant", correct: false}
      - {text: "`sleep` attend la fin de `t`, comme `join`, avant de rendre la main", correct: false}
      - {text: "`t.sleep` ne vaut que pour un thread démon, sinon le courant", correct: false}
    answer: |-
      ```java
      Thread.sleep(1000);
      ```
      `sleep` est `static` : il endort le thread **courant**, pas `t`. L'appeler par la classe rend le comportement
      évident.
  - key: bug-cache-fuite
    format: bug-fix
    question: |-
      La mémoire du serveur grossit jusqu'à `OutOfMemoryError`. Quelle correction est la bonne ?
      ```java
      class Historique {
          static final List<Requete> TOUTES = new ArrayList<>();
          static void enregistrer(Requete r) { TOUTES.add(r); }
      }
      ```
    choices:
      - {text: "Borner l'historique (les 1 000 dernières requêtes), dans une instance", correct: true}
      - {text: "Remplacer l'`ArrayList` par une `LinkedList`, qui libère mieux la mémoire", correct: false}
      - {text: "Appeler `System.gc()` après chaque appel à `enregistrer`", correct: false}
      - {text: "Retirer `final` du champ, pour que le ramasse-miettes le libère", correct: false}
    answer: |-
      ```java
      class Historique {
          private static final int TAILLE = 1_000;
          private final Deque<Requete> recentes = new ArrayDeque<>();

          void enregistrer(Requete r) {
              if (recentes.size() == TAILLE) {
                  recentes.removeFirst();
              }
              recentes.addLast(r);
          }
      }
      ```
      Une collection `static` vit toute la vie de l'application et retient tout ce qu'on y met. On borne sa taille
      (et une instance injectée remplace l'état global).
  - key: bug-static-test
    format: bug-fix
    question: |-
      Les tests passent seuls, mais échouent quand ils tournent ensemble. Quelle correction est la bonne ?
      ```java
      class Configuration {
          static String langue = "fr";
      }
      // un test fait Configuration.langue = "en"; et ne le remet jamais
      ```
    choices:
      - {text: "Une configuration immuable, passée à chaque objet par son constructeur", correct: true}
      - {text: "Imposer l'ordre des tests, pour que celui qui passe à « en » soit le dernier", correct: false}
      - {text: "Rendre le champ `langue` `volatile`, pour que chaque test voie sa valeur", correct: false}
      - {text: "Déclarer `langue` `final`, puis la modifier par réflexion dans les tests", correct: false}
    answer: |-
      ```java
      record Configuration(String langue) {}
      // chaque objet qui en a besoin reçoit sa Configuration par son constructeur
      ```
      L'état `static` mutable fuit d'un test à l'autre. Une configuration immuable, passée par le constructeur, rend
      chaque test indépendant ; imposer l'ordre des tests ne ferait que cacher le problème.
  - key: classe-utilitaire-instanciee-partout-alors
    format: scenario
    question: "Une classe utilitaire, qui n'a que des méthodes `static`, est instanciée partout. Que fais-tu ?"
    choices:
      - {text: "Un constructeur `private` et une classe `final` : ni instance ni héritage", correct: true}
      - {text: "La déclarer `abstract`, pour qu'on ne puisse plus l'instancier", correct: false}
      - {text: "Passer ses méthodes en méthodes d'instance, pour justifier les `new`", correct: false}
      - {text: "Rien : instancier une classe utilitaire ne coûte rien", correct: false}
    answer: |-
      Un constructeur `private` (qui peut lever une exception, contre la réflexion) et une classe `final` : ça
      documente l'intention et empêche l'instanciation et l'héritage ; `abstract` laisserait en hériter. Si ces
      méthodes dépendent d'un état externe (horloge, configuration), mieux vaut en faire un objet injecté.
  - key: scenario-static-ou-instance
    format: scenario
    question: "Comment décides-tu qu'une méthode doit être `static` ?"
    choices:
      - {text: "Si elle ne dépend que de ses paramètres, sans état ni ressource externe", correct: true}
      - {text: "Si elle est appelée souvent : un appel `static` évite de créer des objets", correct: false}
      - {text: "Si elle lit la configuration ou l'horloge, partagées par toute l'application", correct: false}
      - {text: "Si elle est courte : au-delà de dix lignes, c'est une méthode d'instance", correct: false}
    answer: |-
      Une méthode peut être `static` si elle ne dépend que de ses paramètres : une fonction pure comme
      `Montants.arrondir(valeur)`. Dès qu'elle dépend d'un état ou d'une ressource externe (base, horloge,
      configuration), j'en fais une méthode d'instance d'un objet injecté, qu'on peut remplacer dans un test.
  - key: scenario-date-format-partage
    format: scenario
    question: |-
      Sous charge, des dates formatées sortent corrompues. Le code utilise un `static final SimpleDateFormat`. Quelle
      est ton analyse ?
    choices:
      - {text: "`SimpleDateFormat` n'est pas thread-safe : passer à `DateTimeFormatter`, immuable", correct: true}
      - {text: "Le fuseau horaire diffère selon les threads : fixer `TimeZone` sur le formateur", correct: false}
      - {text: "Le champ `static final` est copié par thread : le rendre `volatile` pour le partager", correct: false}
      - {text: "Le motif de date est mal écrit : le corriger dans la déclaration du formateur", correct: false}
    answer: |-
      `SimpleDateFormat` garde un état interne pendant le formatage : partagé entre les threads, il mélange leurs
      calculs. `DateTimeFormatter` (java.time) est immuable, donc partageable en `static final` ; à défaut, un
      `ThreadLocal` ou une instance par appel. Un `static` partagé doit être immuable ou thread-safe.
  - key: scenario-tests-ordre
    format: scenario
    question: "Une suite de tests échoue selon l'ordre d'exécution. Comment cherches-tu la cause ?"
    choices:
      - {text: "Chercher un état partagé (un `static` mutable), isoler le couple de tests, le supprimer", correct: true}
      - {text: "Fixer l'ordre des tests avec `@TestMethodOrder`, pour retrouver un ordre stable", correct: false}
      - {text: "Relancer la suite jusqu'à ce qu'elle passe, puis marquer le test comme instable", correct: false}
      - {text: "Exécuter chaque test dans sa propre JVM, pour ne plus voir le problème", correct: false}
    answer: |-
      Je soupçonne un état qui survit entre les tests (champ `static` mutable, singleton, base non nettoyée). Je lance
      le test fautif seul, puis avec le précédent, pour isoler le couple, et je supprime l'état global (ou le
      réinitialise dans un `@BeforeEach`). Fixer l'ordre ne ferait que cacher le problème.
