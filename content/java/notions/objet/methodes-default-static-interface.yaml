notion: methodes-default-static-interface
lesson: |-
  Depuis Java 8 (et 9 pour `private`), une interface peut contenir du code :

  | Méthode | Rôle | Appel |
  |---|---|---|
  | `default` | une implémentation par défaut, redéfinissable | sur un objet : `liste.forEach(...)` |
  | `static` | une fonction utilitaire liée à l'interface | par l'interface : `Comparator.naturalOrder()` |
  | `private` (Java 9) | factoriser du code entre méthodes `default` | à l'intérieur de l'interface |

  ```java
  interface Salueur {
      String nom();                                  // abstraite

      default String saluer() {                      // s'appuie sur la méthode abstraite
          return prefixe() + nom();
      }

      static Salueur de(String nom) {                // fabrique
          return () -> nom;
      }

      private String prefixe() { return "Bonjour "; }
  }

  Salueur.de("Ada").saluer();   // "Bonjour Ada"
  ```

  - Les méthodes `default` ont permis de faire **évoluer** des interfaces existantes sans casser leurs implémentations
    (`Collection.stream()`, `List.sort()`, `Iterable.forEach()`).
  - Une méthode `static` d'interface **ne s'hérite pas** : on l'appelle par le nom de l'interface, jamais par une
    classe qui l'implémente.
  - Une interface n'a toujours **pas d'état** : une méthode `default` ne peut s'appuyer que sur les autres méthodes.
  - Une méthode `default` ne peut pas redéfinir `equals`, `hashCode` ou `toString` : la classe gagne toujours.

  **Piège classique** : appeler `MaClasse.utilitaire()` pour une méthode `static` déclarée dans l'interface que
  `MaClasse` implémente. Ça ne compile pas.

  **En entretien** : « `default` donne un comportement par défaut et fait évoluer une interface sans casser ses
  implémentations ; `static` y range des utilitaires, appelés par le nom de l'interface. »
cards:
  - key: interface-avoir-methodes-private
    format: course
    question: "Une interface peut-elle avoir des méthodes `private` ?"
    choices:
      - {text: "Oui, depuis Java 9, pour factoriser du code entre méthodes `default`", correct: true}
      - {text: "Non : toute méthode d'interface est implicitement `public`", correct: false}
      - {text: "Oui, depuis Java 8, mais seulement des méthodes `private abstract`", correct: false}
      - {text: "Non, sauf dans une interface `sealed`, réservée à ses sous-types", correct: false}
    answer: |-
      Oui depuis Java 9, pour factoriser du code entre méthodes `default` (ou `static`) sans l'exposer aux
      implémentations. Avant Java 9, toute méthode d'interface était `public`.
  - key: methodes-static-interface-heritent-elles
    format: course
    question: "Les méthodes `static` d'une interface s'héritent-elles ?"
    choices:
      - {text: "Non : on les appelle par le nom de l'interface, `Outils.version()`", correct: true}
      - {text: "Oui : les classes qui implémentent l'interface en héritent", correct: false}
      - {text: "Oui, mais seulement par les interfaces qui l'étendent", correct: false}
      - {text: "Non, et une interface ne peut de toute façon pas en déclarer", correct: false}
    answer: |-
      Non, on les appelle via le nom de l'interface : ni les classes qui l'implémentent ni les interfaces qui l'étendent
      n'en héritent.
  - key: pourquoi-default
    format: course
    question: "Pourquoi les méthodes `default` ont-elles été ajoutées en Java 8 ?"
    choices:
      - {text: "Pour faire évoluer des interfaces très implémentées sans casser les classes existantes", correct: true}
      - {text: "Pour permettre l'héritage multiple d'état entre interfaces et classes", correct: false}
      - {text: "Pour remplacer les classes abstraites, dépréciées depuis Java 8", correct: false}
      - {text: "Pour que les interfaces puissent redéfinir `equals` et `hashCode`", correct: false}
    answer: |-
      Pour faire évoluer des interfaces très implémentées (comme `Collection`, avec `stream()`) sans casser toutes les
      classes existantes.
  - key: default-sans-etat
    format: course
    question: "Sur quoi une méthode `default` peut-elle s'appuyer ?"
    choices:
      - {text: "Sur les autres méthodes de l'interface et sur ses paramètres", correct: true}
      - {text: "Sur les champs d'instance déclarés dans l'interface", correct: false}
      - {text: "Sur les champs `private` de la classe qui implémente l'interface", correct: false}
      - {text: "Sur les méthodes `private` de la classe qui l'implémente", correct: false}
    answer: |-
      Sur les autres méthodes de l'interface (abstraites ou non) et sur ses paramètres ; une interface n'a pas de
      champs d'instance, et elle ne voit pas les membres `private` de ses implémentations.
  - key: vf-default-redefinissable
    format: true-false
    question: Une classe peut redéfinir une méthode `default` de l'interface qu'elle implémente.
    truth: true
    answer: La version de la classe remplace alors la version par défaut.
  - key: vf-static-par-classe
    format: true-false
    question: Une méthode `static` d'interface peut s'appeler par le nom d'une classe qui implémente l'interface.
    truth: false
    answer: "Elle ne s'hérite pas : seul `Interface.methode()` compile."
  - key: vf-tostring-default
    format: true-false
    question: Une interface peut fournir une version `default` de `toString()`.
    truth: false
    answer: Le compilateur refuse une méthode `default` qui redéfinit une méthode d'`Object`.
  - key: vf-etat
    format: true-false
    question: Grâce aux méthodes `default`, une interface peut avoir des champs d'instance.
    truth: false
    answer: Une interface n'a que des constantes ; elle reste sans état.
  - key: qcm-exemples-default
    format: multiple-choice
    question: Lesquelles de ces méthodes de la JDK sont des méthodes `default` ?
    choices:
      - text: "`Collection.stream()`"
        correct: true
      - text: "`Iterable.forEach(...)`"
        correct: true
      - text: "`List.of(...)`"
        correct: false
      - text: "`Comparator.naturalOrder()`"
        correct: false
    answer: '`List.of` et `Comparator.naturalOrder` sont des méthodes `static` d''interface.'
  - key: qcm-appel-static
    format: multiple-choice
    question: "Comment appeler la méthode `static` `of` de l'interface `List` ?"
    choices:
      - text: "`List.of(1, 2)`"
        correct: true
      - text: "`ArrayList.of(1, 2)`"
        correct: false
      - text: "`new ArrayList<>().of(1, 2)`"
        correct: false
      - text: "`List.super.of(1, 2)`"
        correct: false
    answer: Une méthode `static` d'interface s'appelle par le nom de l'interface.
  - key: qcm-private
    format: multiple-choice
    question: À quoi sert une méthode `private` dans une interface ?
    choices:
      - {text: "Factoriser du code commun à plusieurs méthodes `default` ou `static`", correct: true}
      - {text: "Déclarer un champ caché, propre à chaque implémentation", correct: false}
      - {text: "Forcer les classes qui l'implémentent à écrire une méthode", correct: false}
      - {text: "Masquer une méthode d'`Object`, comme `toString`, aux appelants", correct: false}
    answer: Elle n'est visible que dans l'interface.
  - key: qcm-evolution
    format: multiple-choice
    question: On ajoute une méthode à une interface publique implémentée par cent classes. Que faire pour ne casser personne ?
    choices:
      - {text: "L'ajouter en `default`, avec une implémentation raisonnable", correct: true}
      - {text: "L'ajouter en abstraite, et laisser chaque classe l'implémenter", correct: false}
      - {text: "L'ajouter en `private`, pour qu'aucune classe ne la voie", correct: false}
      - {text: "L'ajouter en `static`, redéfinie par les classes qui le veulent", correct: false}
    answer: |-
      Une méthode abstraite ajoutée obligerait les cent classes à l'implémenter ; une `static` ne se redéfinit pas, et
      une `private` ne sert à personne dehors.
  - key: code-default-et-redefinition
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      interface Animal {
          default String cri() { return "..."; }
      }
      class Chat implements Animal {
          @Override public String cri() { return "miaou"; }
      }
      class Poisson implements Animal { }
      System.out.println(new Chat().cri() + " " + new Poisson().cri());
      ```
    choices:
      - {text: "`miaou ...`", correct: true}
      - {text: "`... ...`", correct: false}
      - {text: "`miaou miaou`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`miaou ...` : le chat redéfinit la méthode, le poisson garde la version par défaut."
    check:
      output: "miaou ..."
  - key: code-default-lambda
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      interface Salueur {
          String nom();
          default String saluer() { return "Bonjour " + nom(); }
      }
      Salueur s = () -> "Ada";
      System.out.println(s.saluer());
      ```
    choices:
      - {text: "`Bonjour Ada`", correct: true}
      - {text: "`Bonjour null`", correct: false}
      - {text: "`Ada`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `Bonjour Ada` : l'interface n'a qu'une méthode abstraite, `nom()`, que la lambda implémente ; la méthode `default`
      s'appuie dessus.
    check:
      output: "Bonjour Ada"
  - key: code-static-par-classe
    format: code-output
    question: |-
      ```java
      interface Outils { static String version() { return "1.0"; } }
      class Impl implements Outils { }
      System.out.println(Impl.version());
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas : il faut écrire `Outils.version()`", correct: true}
      - {text: "Oui, et il affiche `1.0`", correct: false}
      - {text: "Oui, mais l'appel lève une `NoSuchMethodError`", correct: false}
      - {text: "Oui, et il affiche `null`", correct: false}
    answer: "Non : une méthode `static` d'interface ne s'hérite pas, il faut `Outils.version()`."
    check:
      compiles: false
  - key: code-default-tostring
    format: code-output
    question: |-
      ```java
      interface Affichable {
          default String toString() { return "affichable"; }
      }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas : une `default` ne redéfinit pas `Object`", correct: true}
      - {text: "Oui : les classes qui l'implémentent affichent « affichable »", correct: false}
      - {text: "Oui, mais seulement si l'interface n'a pas d'autre méthode", correct: false}
      - {text: "Oui : une interface peut redéfinir toute méthode d'`Object`", correct: false}
    answer: |-
      Non : une méthode `default` ne peut pas redéfinir une méthode d'`Object`. Toute classe hérite déjà de
      `Object.toString()`, qui l'emporterait toujours sur l'interface.
    check:
      compiles: false
  - key: bug-evolution-cassante
    format: bug-fix
    question: |-
      L'ajout d'une méthode à l'interface publique `Exportable` casse la compilation de dizaines de classes. Quelle
      correction est la bonne ?
      ```java
      interface Exportable {
          String exporter();
          String extension();   // ajoutée
      }
      ```
    choices:
      - {text: "Déclarer `extension()` en `default`, avec une valeur raisonnable", correct: true}
      - {text: "Déclarer `extension()` en `static`, pour n'obliger personne", correct: false}
      - {text: "Déclarer `extension()` en `private`, pour la cacher aux classes", correct: false}
      - {text: "Déclarer `Exportable` `abstract`, pour dispenser les classes", correct: false}
    answer: |-
      ```java
      interface Exportable {
          String exporter();
          default String extension() { return "txt"; }
      }
      ```
      Une méthode `default` donne une implémentation à toutes les classes existantes ; celles qui le veulent la
      redéfinissent. Une `static`, elle, ne se redéfinit pas.
  - key: bug-static-via-classe
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: method parDefaut()`). Quelle correction est la bonne ?
      ```java
      interface Politique { static Politique parDefaut() { return new PolitiqueStricte(); } }
      class PolitiqueStricte implements Politique { }

      Politique p = PolitiqueStricte.parDefaut();
      ```
    choices:
      - {text: "Appeler `Politique.parDefaut()`, par le nom de l'interface", correct: true}
      - {text: "Déclarer `parDefaut()` en `default` au lieu de `static`", correct: false}
      - {text: "Ajouter `public` devant `parDefaut()` dans l'interface", correct: false}
      - {text: "Ajouter `import static` de `PolitiqueStricte.parDefaut`", correct: false}
    answer: |-
      ```java
      Politique p = Politique.parDefaut();
      ```
      Une méthode `static` d'interface ne s'hérite pas : on l'appelle par le nom de l'interface.
  - key: bug-duplication-default
    format: bug-fix
    question: |-
      Deux méthodes `default` répètent la même mise en forme. Quelle correction est la bonne ?
      ```java
      interface Journal {
          void ecrire(String ligne);
          default void info(String m) { ecrire("[" + LocalTime.now() + "] INFO " + m); }
          default void erreur(String m) { ecrire("[" + LocalTime.now() + "] ERREUR " + m); }
      }
      ```
    choices:
      - {text: "Factoriser la mise en forme dans une méthode `private` de l'interface", correct: true}
      - {text: "Factoriser la mise en forme dans une constante `String` de l'interface", correct: false}
      - {text: "Recopier la mise en forme dans chaque classe qui implémente `Journal`", correct: false}
      - {text: "Remplacer `info` et `erreur` par une seule méthode abstraite", correct: false}
    answer: |-
      ```java
      interface Journal {
          void ecrire(String ligne);
          default void info(String m) { ecrire(ligne("INFO", m)); }
          default void erreur(String m) { ecrire(ligne("ERREUR", m)); }

          private String ligne(String niveau, String m) {
              return "[" + LocalTime.now() + "] " + niveau + " " + m;
          }
      }
      ```
      Depuis Java 9, une méthode `private` d'interface factorise le code commun sans l'exposer aux implémentations.
  - key: bug-etat-interface
    format: bug-fix
    question: |-
      Ce compteur « par objet » est partagé par toutes les implémentations. Quelle correction est la bonne ?
      ```java
      interface Compteur {
          int[] VALEUR = {0};
          default void incrementer() { VALEUR[0]++; }
      }
      ```
    choices:
      - {text: "Une classe (abstraite) avec un champ d'instance `private int valeur`", correct: true}
      - {text: "Remplacer le tableau par un `AtomicInteger`, dans l'interface", correct: false}
      - {text: "Déclarer le champ `VALEUR` `private` dans l'interface", correct: false}
      - {text: "Retirer le `final` implicite du tableau `VALEUR`", correct: false}
    answer: |-
      ```java
      abstract class Compteur {
          private int valeur;
          void incrementer() { valeur++; }
          int valeur() { return valeur; }
      }
      ```
      Un champ d'interface est `static final` : ce tableau est un état global partagé, atomique ou pas. Un état propre
      à chaque objet demande une classe (ici abstraite si l'on veut la faire étendre).
