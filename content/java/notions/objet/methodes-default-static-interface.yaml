notion: methodes-default-static-interface
cards:
  - key: interface-avoir-methodes-private
    format: course
    question: Une interface peut-elle avoir des méthodes private ?
    answer: Oui depuis Java 9, pour factoriser du code entre méthodes default.
  - key: methodes-static-interface-heritent-elles
    format: course
    question: Les méthodes static d'interface s'héritent-elles ?
    answer: Non, on les appelle via le nom de l'interface.
