notion: polymorphisme-principe
lesson: |-
  Le **polymorphisme**, c'est manipuler des objets de classes différentes par un **même type déclaré** (une interface
  ou une classe parente), chacun réagissant **à sa façon** au même appel.

  ```java
  interface Forme {
      double aire();
  }
  record Carre(double cote) implements Forme {
      public double aire() { return cote * cote; }
  }
  record Cercle(double rayon) implements Forme {
      public double aire() { return Math.PI * rayon * rayon; }
  }

  double total = 0;
  for (Forme f : List.of(new Carre(2), new Cercle(1))) {
      total += f.aire();            // chaque forme calcule sa propre aire
  }
  ```

  - Le code appelant ne dépend que du **type déclaré** (`Forme`) : ajouter un `Triangle` ne change pas la boucle. C'est
    le principe **ouvert/fermé** (ouvert à l'extension, fermé à la modification).
  - On déclare les variables avec le type le plus général utile : `List<String> noms = new ArrayList<>();`.
  - Le type **déclaré** dit quelles méthodes on peut appeler ; le type **réel** décide quelle version s'exécute.

  **Piège classique** : une cascade de `if (f instanceof Carre) ... else if (f instanceof Cercle) ...`. Chaque nouvelle
  forme oblige à modifier tous ces endroits ; le comportement doit vivre dans les formes elles-mêmes.

  **En entretien** : « Le polymorphisme, c'est un type déclaré et plusieurs comportements : le code appelant reste le
  même quand on ajoute une implémentation. »
tour:
  - title: Le polymorphisme
    text: |-
      Une variable d'un type parent peut désigner un objet de n'importe quelle sous-classe, et l'appel de méthode va à
      la version de l'objet réel : c'est le **polymorphisme**. Le code qui manipule des `Forme` n'a pas à connaître
      chaque sorte de forme.

      Ajouter une nouvelle forme ne demande alors aucun changement dans ce code : une nouvelle classe suffit.
    example:
      files:
        Main.java: |-
          class Forme {
              double aire() {
                  return 0;
              }
          }

          class Carre extends Forme {
              private final double cote;

              Carre(double cote) {
                  this.cote = cote;
              }

              @Override
              double aire() {
                  return cote * cote;
              }
          }

          class Cercle extends Forme {
              private final double rayon;

              Cercle(double rayon) {
                  this.rayon = rayon;
              }

              @Override
              double aire() {
                  return Math.PI * rayon * rayon;
              }
          }

          void main() {
              List<Forme> formes = List.of(new Carre(2), new Cercle(1), new Carre(1));
              double total = 0;
              for (Forme f : formes) {
                  total += f.aire();
              }
              IO.println(String.format("%.2f", total));
          }
      output: |-
        8.14
cards:
  - key: definition
    format: course
    question: Qu'est-ce que le polymorphisme ?
    answer: La capacité de manipuler des objets de classes différentes par un même type (interface ou parent), chacun exécutant sa propre version d'une méthode.
  - key: ouvert-ferme
    format: course
    question: Quel lien entre polymorphisme et principe ouvert/fermé ?
    answer: Grâce au polymorphisme, on ajoute un comportement en écrivant une nouvelle implémentation, sans modifier le code qui manipule le type général.
  - key: declare-vs-reel
    format: course
    question: Quel rôle jouent le type déclaré et le type réel ?
    answer: Le type déclaré détermine les méthodes qu'on peut appeler (vérifié à la compilation) ; le type réel de l'objet détermine la version exécutée.
  - key: type-general
    format: course
    question: Pourquoi écrire `List<String> noms = new ArrayList<>();` plutôt que `ArrayList<String> noms = ...` ?
    answer: Le code ne dépend que du contrat `List` ; on peut changer d'implémentation (`LinkedList`, `List.of`) sans toucher au reste.
  - key: vf-meme-appel
    format: true-false
    question: Avec le polymorphisme, le même appel `f.aire()` peut exécuter des codes différents.
    truth: true
    answer: La version exécutée dépend de l'objet réel.
  - key: vf-instanceof-necessaire
    format: true-false
    question: Pour profiter du polymorphisme, il faut tester le type avec `instanceof` avant chaque appel.
    truth: false
    answer: "C'est justement ce que le polymorphisme évite : l'objet choisit lui-même sa version."
  - key: vf-interface
    format: true-false
    question: Une interface suffit pour faire du polymorphisme, sans héritage de classe.
    truth: true
    answer: Plusieurs classes qui implémentent la même interface sont interchangeables.
  - key: vf-methodes-enfant
    format: true-false
    question: "Avec `Forme f = new Carre(2);`, on peut appeler sur `f` une méthode qui n'existe que dans `Carre`."
    truth: false
    answer: Le type déclaré `Forme` limite les appels aux méthodes de `Forme`.
  - key: qcm-avantage
    format: multiple-choice
    question: Quel est le principal avantage du polymorphisme ?
    choices:
      - text: "Ajouter un nouveau type sans modifier le code qui manipule le type général"
        correct: true
      - text: "Accélérer l'exécution des méthodes"
        correct: false
      - text: "Éviter d'écrire des interfaces"
        correct: false
      - text: "Permettre l'héritage multiple"
        correct: false
    answer: Le code appelant reste fermé à la modification.
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle déclaration rend le code le moins dépendant d'une implémentation ?
    choices:
      - text: "`Map<String, Integer> stock = new HashMap<>();`"
        correct: true
      - text: "`HashMap<String, Integer> stock = new HashMap<>();`"
        correct: false
      - text: "`Object stock = new HashMap<>();`"
        correct: false
      - text: "`var stock = new HashMap<String, Integer>();`"
        correct: false
    answer: '`Map` donne tout ce qu''il faut sans figer `HashMap` ; `Object` serait trop général pour s''en servir.'
  - key: qcm-signe
    format: multiple-choice
    question: Lequel de ces signes indique un polymorphisme manquant ?
    choices:
      - text: "Un `switch` sur un champ `type` répété dans plusieurs classes"
        correct: true
      - text: "Une interface avec deux implémentations"
        correct: false
      - text: "Une méthode `@Override`"
        correct: false
      - text: "Une liste typée par une interface"
        correct: false
    answer: Chaque nouveau type obligerait à modifier tous ces `switch`.
  - key: qcm-version
    format: multiple-choice
    question: "Avec `Object o = List.of(1, 2);`, quelle méthode `toString` est appelée par `System.out.println(o)` ?"
    choices:
      - text: "Celle de l'implémentation de liste, qui affiche `[1, 2]`"
        correct: true
      - text: "Celle d'`Object`, qui affiche `ClasseListe@1b6d3586`"
        correct: false
      - text: "Aucune, `println` lit les champs"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: '`toString` est redéfinie : c''est la version du type réel qui s''exécute.'
  - key: trous-interface
    format: fill-in
    question: |-
      Complétez pour que toutes les formes s'utilisent de la même façon :
      ```java
      interface Forme {
          double ___();
      }
      class Carre implements Forme {
          public double aire() { return cote * cote; }
      }
      ```
    blanks: [[aire]]
    answer: Le contrat commun déclare la méthode que chaque forme implémente.
  - key: trous-implements
    format: fill-in
    question: |-
      Complétez pour que `Cercle` soit utilisable comme une `Forme` :
      ```java
      class Cercle ___ Forme {
          public double aire() { return Math.PI * r * r; }
      }
      ```
    blanks: [[implements]]
    answer: '`implements` déclare que la classe respecte le contrat de l''interface.'
  - key: trous-type-declare
    format: fill-in
    question: |-
      Complétez avec le type le plus général qui permet d'appeler `aire()` :
      ```java
      ___ f = new Cercle(1);
      double a = f.aire();
      ```
    blanks: [[Forme]]
    answer: Déclarer `Forme` permet de remplacer le cercle par n'importe quelle autre forme.
  - key: trous-liste
    format: fill-in
    question: |-
      Complétez pour déclarer une liste de formes quelconques :
      ```java
      List<___> formes = List.of(new Carre(2), new Cercle(1));
      ```
    blanks: [[Forme]]
    answer: La liste accepte toutes les implémentations de `Forme`.
  - key: code-aire-totale
    format: code-output
    question: |-
      ```java
      abstract class Forme { abstract double aire(); }
      class Carre extends Forme {
          final double c;
          Carre(double c) { this.c = c; }
          double aire() { return c * c; }
      }
      class Rond extends Forme {
          final double r;
          Rond(double r) { this.r = r; }
          double aire() { return 3 * r * r; }
      }
      double total = 0;
      for (Forme f : List.of(new Carre(2), new Rond(1))) {
          total += f.aire();
      }
      System.out.println(total);
      ```
    answer: '`7.0` : 4 pour le carré et 3 pour le rond (avec π arrondi à 3), chacun avec sa propre méthode.'
    check:
      output: "7.0"
  - key: code-interface
    format: code-output
    question: |-
      ```java
      interface Salutation { String saluer(); }
      class Fr implements Salutation { public String saluer() { return "Bonjour"; } }
      class En implements Salutation { public String saluer() { return "Hello"; } }
      for (Salutation s : List.of(new Fr(), new En())) {
          System.out.print(s.saluer() + ";");
      }
      ```
    answer: '`Bonjour;Hello;` : le même appel, deux comportements.'
    check:
      output: "Bonjour;Hello;"
  - key: code-tostring
    format: code-output
    question: |-
      ```java
      Object o = List.of(1, 2);
      Object p = "texte";
      System.out.println(o + " " + p);
      ```
    answer: '`[1, 2] texte` : la concaténation appelle `toString`, et chaque objet utilise sa version.'
    check:
      output: "[1, 2] texte"
  - key: code-tableau-animaux
    format: code-output
    question: |-
      ```java
      class Animal { String cri() { return "..."; } }
      class Chat extends Animal { String cri() { return "miaou"; } }
      class Chien extends Animal { String cri() { return "ouaf"; } }
      Animal[] animaux = { new Chat(), new Chien(), new Animal() };
      for (Animal a : animaux) {
          System.out.print(a.cri() + ";");
      }
      ```
    answer: '`miaou;ouaf;...;` : chaque élément exécute la version de sa classe.'
    check:
      output: "miaou;ouaf;...;"
  - key: bug-cascade-instanceof
    format: bug-fix
    question: |-
      Chaque nouvelle forme oblige à modifier ce calcul (et trois autres semblables) :
      ```java
      double aire(Object f) {
          if (f instanceof Carre c) return c.cote() * c.cote();
          if (f instanceof Cercle c) return Math.PI * c.rayon() * c.rayon();
          throw new IllegalArgumentException("forme inconnue");
      }
      ```
    answer: |-
      ```java
      interface Forme { double aire(); }

      record Carre(double cote) implements Forme {
          public double aire() { return cote * cote; }
      }
      record Cercle(double rayon) implements Forme {
          public double aire() { return Math.PI * rayon * rayon; }
      }
      // l'appelant écrit simplement f.aire()
      ```
      Le comportement passe dans chaque forme : un `Triangle` s'ajoute sans toucher au code existant. (Si les formes
      forment un ensemble fermé, une interface `sealed` et un `switch` exhaustif sont une alternative.)
  - key: bug-champ-type
    format: bug-fix
    question: |-
      Le calcul des frais se répète avec un `switch` partout où l'on manipule un abonnement :
      ```java
      class Abonnement {
          String type;   // "BASIC", "PREMIUM"
      }
      double frais(Abonnement a) {
          return switch (a.type) {
              case "BASIC" -> 5;
              case "PREMIUM" -> 0;
              default -> throw new IllegalStateException();
          };
      }
      ```
    answer: |-
      ```java
      enum Abonnement {
          BASIC { double frais() { return 5; } },
          PREMIUM { double frais() { return 0; } };

          abstract double frais();
      }
      ```
      Un champ « type » en chaîne simule le polymorphisme à la main. Une enum (ou une interface et ses
      implémentations) met chaque comportement avec sa variante et supprime les `switch` dispersés.
  - key: bug-type-concret
    format: bug-fix
    question: |-
      Pour passer de `ArrayList` à `List.of` dans un test, il faut modifier quinze signatures :
      ```java
      ArrayList<Commande> filtrer(ArrayList<Commande> commandes) { ... }
      ```
    answer: |-
      ```java
      List<Commande> filtrer(List<Commande> commandes) { ... }
      ```
      En déclarant le type général (`List`), la méthode accepte toutes les implémentations ; le choix de la classe
      concrète reste à un seul endroit.
  - key: bug-downcast-appel
    format: bug-fix
    question: |-
      Ce code lève une `ClassCastException` dès qu'on ajoute un virement :
      ```java
      for (MoyenPaiement m : moyens) {
          ((Carte) m).payer(total);
      }
      ```
      `payer` n'est déclarée que dans `Carte`.
    answer: |-
      ```java
      interface MoyenPaiement { void payer(double montant); }

      for (MoyenPaiement m : moyens) {
          m.payer(total);
      }
      ```
      Le cast contournait l'absence de `payer` dans le type général. En la déclarant dans l'interface, chaque moyen de
      paiement l'implémente et la boucle n'a plus besoin de connaître les classes concrètes.
