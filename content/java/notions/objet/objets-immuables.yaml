notion: objets-immuables
lesson: |-
  Un objet **immuable** ne change plus après sa construction. Pour « modifier », on crée un **nouvel objet**.

  Les règles (*Effective Java*, item 17) :
  1. aucune méthode qui modifie l'état (pas de setter) ;
  2. la classe ne peut pas être étendue (`final`, ou un record) ;
  3. tous les champs sont `private final` ;
  4. aucun accès aux objets **mutables** internes : copie défensive à l'entrée et à la sortie.

  ```java
  public record Equipe(String nom, List<String> membres) {
      public Equipe {
          membres = List.copyOf(membres);           // copie immuable : l'appelant garde sa liste pour lui
      }

      public Equipe avec(String membre) {           // « modification » = nouvel objet
          var nouveaux = new ArrayList<>(membres);
          nouveaux.add(membre);
          return new Equipe(nom, nouveaux);
      }
  }
  ```

  Les bénéfices :
  - **thread-safe** sans verrou : on peut le partager entre threads ;
  - de bonnes **clés** de `HashMap` et éléments de `HashSet` (le hash ne change jamais) ;
  - on peut le **partager** et le mettre en cache sans copie ;
  - plus simple à raisonner : un invariant vérifié au constructeur reste vrai pour toujours.

  Exemples de la JDK : `String`, `Integer` et les autres enveloppes, `BigDecimal`, `LocalDate`, `Instant`, `Duration`,
  `List.of(...)`. Le coût : un nouvel objet à chaque « modification », en général négligeable.

  **Piège classique** : croire qu'un record est forcément immuable. Ses champs sont `final`, mais une `List` passée au
  constructeur reste la liste de l'appelant, qui peut la modifier : il faut une copie dans le constructeur compact.

  **En entretien** : « Champs `private final`, classe `final`, pas de setter, copies défensives des objets mutables ;
  c'est thread-safe par construction. »
cards:
  - key: regles
    format: course
    question: Quelles sont les règles d'une classe immuable ?
    answer: Pas de méthode qui modifie l'état, classe `final` (ou record), champs `private final`, et copies défensives des objets mutables reçus ou renvoyés.
  - key: benefices
    format: course
    question: Quels sont les avantages des objets immuables ?
    answer: Ils sont thread-safe sans verrou, font de bonnes clés de `HashMap`, se partagent et se mettent en cache sans copie, et leurs invariants restent vrais pour toujours.
  - key: modifier
    format: course
    question: Comment « modifier » un objet immuable ?
    answer: En créant un nouvel objet avec la valeur changée (`date.plusDays(1)`, `point.avecX(5)`), l'original restant intact.
  - key: record-mutable
    format: course
    question: Un record est-il toujours immuable ?
    answer: "Non : ses champs sont `final`, mais s'il contient une collection ou un objet mutable, il faut le copier dans le constructeur compact (`membres = List.copyOf(membres)`)."
  - key: vf-string
    format: true-false
    question: "`s.toUpperCase()` modifie la chaîne `s`."
    truth: false
    answer: '`String` est immuable : la méthode renvoie une nouvelle chaîne.'
  - key: vf-thread-safe
    format: true-false
    question: Un objet vraiment immuable peut être partagé entre threads sans synchronisation.
    truth: true
    answer: Personne ne peut le modifier, il n'y a donc pas de course à protéger.
  - key: vf-final-suffit
    format: true-false
    question: Des champs `final` suffisent à rendre une classe immuable.
    truth: false
    answer: Un champ `final` peut référencer un objet mutable, et une sous-classe peut ajouter un état modifiable.
  - key: vf-local-date
    format: true-false
    question: "`LocalDate` est immuable."
    truth: true
    answer: '`plusDays`, `withYear`... renvoient de nouvelles dates.'
  - key: qcm-immuables
    format: multiple-choice
    question: Lesquels de ces types de la JDK sont immuables ?
    choices:
      - text: "`String`"
        correct: true
      - text: "`BigDecimal`"
        correct: true
      - text: "`LocalDate`"
        correct: true
      - text: "`java.util.Date`"
        correct: false
    answer: '`Date` a des setters ; c''est l''une des raisons de son remplacement par `java.time`.'
  - key: qcm-necessaire
    format: multiple-choice
    question: Que faut-il pour qu'une classe contenant une `List<String>` soit immuable ?
    choices:
      - text: "Copier la liste dans le constructeur (`List.copyOf`)"
        correct: true
      - text: "Ne jamais renvoyer une liste modifiable"
        correct: true
      - text: "Déclarer le champ `volatile`"
        correct: false
      - text: "Synchroniser l'accesseur"
        correct: false
    answer: Avec `List.copyOf`, la liste stockée est elle-même immuable et peut être renvoyée telle quelle.
  - key: qcm-cout
    format: multiple-choice
    question: Quel est le principal coût de l'immuabilité ?
    choices:
      - text: "Un nouvel objet à chaque « modification »"
        correct: true
      - text: "Une synchronisation obligatoire"
        correct: false
      - text: "L'impossibilité d'avoir des méthodes"
        correct: false
      - text: "Une mauvaise compatibilité avec les collections"
        correct: false
    answer: En général négligeable ; pour de nombreuses modifications, on utilise un compagnon mutable (`StringBuilder`).
  - key: qcm-wither
    format: multiple-choice
    question: "Avec `record Point(int x, int y)`, comment obtenir le même point avec `x = 5` ?"
    choices:
      - text: "Une méthode `avecX(5)` qui renvoie `new Point(5, y)`"
        correct: true
      - text: "`point.x = 5;`"
        correct: false
      - text: "`point.setX(5);`, générée par le record"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: Un record n'a pas de setter ; on crée un nouveau point.
  - key: code-string
    format: code-output
    question: |-
      ```java
      String s = "abc";
      s.toUpperCase();
      String t = s.toUpperCase();
      System.out.println(s + " " + t);
      ```
    answer: '`abc ABC` : `toUpperCase` renvoie une nouvelle chaîne, `s` ne change pas.'
    check:
      output: "abc ABC"
  - key: code-wither
    format: code-output
    question: |-
      ```java
      record Point(int x, int y) {
          Point avecX(int nx) { return new Point(nx, y); }
      }
      Point a = new Point(1, 2);
      Point b = a.avecX(5);
      System.out.println(a + " " + b);
      ```
    answer: '`Point[x=1, y=2] Point[x=5, y=2]` : l''original reste intact.'
    check:
      output: "Point[x=1, y=2] Point[x=5, y=2]"
  - key: code-record-liste
    format: code-output
    question: |-
      ```java
      record Equipe(List<String> membres) { }
      List<String> liste = new ArrayList<>(List.of("Ada"));
      Equipe e = new Equipe(liste);
      liste.add("Bob");
      System.out.println(e.membres());
      ```
    answer: '`[Ada, Bob]` : le record partage la liste de l''appelant, il n''est pas immuable.'
    check:
      output: "[Ada, Bob]"
  - key: code-local-date
    format: code-output
    question: |-
      ```java
      LocalDate d = LocalDate.of(2025, 1, 31);
      d.plusDays(1);
      System.out.println(d + " " + d.plusMonths(1));
      ```
    answer: '`2025-01-31 2025-02-28` : `d` ne change jamais, et `plusMonths` ajuste au dernier jour de février.'
    check:
      code: |-
        import java.time.LocalDate;
        LocalDate d = LocalDate.of(2025, 1, 31);
        d.plusDays(1);
        System.out.println(d + " " + d.plusMonths(1));
      output: "2025-01-31 2025-02-28"
  - key: bug-resultat-ignore
    format: bug-fix
    question: |-
      La date d'échéance n'est jamais repoussée :
      ```java
      void prolonger(Abonnement a) {
          a.echeance().plusMonths(1);
      }
      ```
      `echeance()` renvoie une `LocalDate`.
    answer: |-
      ```java
      Abonnement prolonger(Abonnement a) {
          return a.avecEcheance(a.echeance().plusMonths(1));
      }
      ```
      `LocalDate` est immuable : `plusMonths` renvoie une nouvelle date, ignorée ici. On utilise le résultat (et, si
      l'abonnement est immuable aussi, on renvoie un nouvel abonnement).
  - key: bug-record-liste
    format: bug-fix
    question: |-
      Une commande « immuable » voit ses lignes changer après coup :
      ```java
      record Commande(String id, List<Ligne> lignes) { }
      ```
    answer: |-
      ```java
      record Commande(String id, List<Ligne> lignes) {
          Commande {
              lignes = List.copyOf(lignes);
          }
      }
      ```
      Le record gardait la liste de l'appelant. Le constructeur compact la remplace par une copie immuable (qui refuse
      aussi les `null`).
  - key: bug-setter
    format: bug-fix
    question: |-
      Une `Devise` sert de clé de `HashMap`, et un appel à `setCode` l'a rendue introuvable :
      ```java
      public class Devise {
          private String code;
          public void setCode(String code) { this.code = code; }
          // equals et hashCode sur code
      }
      ```
    answer: |-
      ```java
      public record Devise(String code) {
          public Devise {
              Objects.requireNonNull(code);
          }
      }
      ```
      Une clé dont le hash change se perd dans la table. Une valeur immuable (ici un record) ne peut plus changer
      après sa création.
  - key: bug-sous-classe
    format: bug-fix
    question: |-
      Une sous-classe a rendu modifiable un `Montant` censé être immuable :
      ```java
      public class Montant {
          private final long centimes;
          public Montant(long centimes) { this.centimes = centimes; }
          public long centimes() { return centimes; }
      }
      ```
    answer: |-
      ```java
      public final class Montant {
          ...
      }
      ```
      Sans `final`, une sous-classe peut ajouter un état mutable et redéfinir `centimes()`. Une classe immuable
      interdit l'héritage (ou devient un record).
  - key: concois-classe-thread-safe-sans-synchronisation
    format: scenario
    question: Comment tu conçois une classe thread-safe sans synchronisation ?
    answer: |-
      L'**immutabilité** : une classe immutable est thread-safe par construction, sans verrou, donc sans contention ni risque de deadlock.
      Concrètement : tous les champs `final`, aucun setter, initialisation complète dans le constructeur, classe `final` pour empêcher qu'une sous-classe casse l'invariant, et **copies défensives** si un champ est une collection ou un objet mutable, sinon l'appelant garde une référence sur l'intérieur et peut le modifier.
      C'est l'approche de `String`, de `Integer` et des records. Plus simple et plus performant que de synchroniser.
  - key: scenario-valeur-metier
    format: scenario
    question: Comment modélises-tu une somme d'argent dans un domaine métier ?
    answer: |-
      Par un objet de valeur immuable, par exemple `record Montant(long centimes, Currency devise)`, qui valide ses
      invariants dans le constructeur compact (devise non nulle). Les opérations renvoient de nouveaux montants
      (`ajouter`, `multiplier`) et refusent de mélanger les devises. Je stocke des centimes entiers (ou un `BigDecimal`)
      plutôt qu'un `double`, pour éviter les erreurs d'arrondi. Immuable, il se partage, se met en cache et sert de clé
      sans risque.
  - key: scenario-perf
    format: scenario
    question: Un collègue craint que créer un nouvel objet à chaque modification soit trop lent. Que réponds-tu ?
    answer: |-
      Qu'en général, ce n'est pas mesurable : les objets de courte durée sont très bon marché pour les GC générationnels,
      et l'immuabilité évite des copies défensives et des verrous ailleurs. Si une mesure montre un vrai problème, par
      exemple de nombreuses modifications successives dans une boucle, on utilise un compagnon mutable local
      (`StringBuilder` pour `String`, une `ArrayList` construite puis figée avec `List.copyOf`), sans exposer d'état
      mutable. On optimise sur mesure, pas par principe.
  - key: scenario-migration-date
    format: scenario
    question: Ton code utilise `java.util.Date` partout, et des bugs viennent de dates modifiées par erreur. Que proposes-tu ?
    answer: |-
      Migrer progressivement vers `java.time` : `Instant` pour un moment, `LocalDate` pour une date sans heure,
      `ZonedDateTime` quand le fuseau compte. Ces types sont immuables, la cause des bugs disparaît. Je commence par les
      frontières (API, persistance, où des convertisseurs existent : `date.toInstant()`, `Date.from(instant)`), puis je
      remplace les champs du domaine. En attendant, chaque `Date` reçue ou renvoyée est copiée défensivement.
