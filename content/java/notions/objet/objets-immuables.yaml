notion: objets-immuables
lesson: |-
  Un objet **immuable** ne change plus après sa construction. Pour « modifier », on crée un **nouvel objet**.

  Les règles (*Effective Java*, item 17) :
  1. aucune méthode qui modifie l'état (pas de setter) ;
  2. la classe ne peut pas être étendue (`final`, ou un record) ;
  3. tous les champs sont `private final` ;
  4. aucun accès aux objets **mutables** internes : copie défensive à l'entrée et à la sortie.

  ```java
  public record Equipe(String nom, List<String> membres) {
      public Equipe {
          membres = List.copyOf(membres);           // copie immuable : l'appelant garde sa liste pour lui
      }

      public Equipe avec(String membre) {           // « modification » = nouvel objet
          var nouveaux = new ArrayList<>(membres);
          nouveaux.add(membre);
          return new Equipe(nom, nouveaux);
      }
  }
  ```

  Les bénéfices :
  - **thread-safe** sans verrou : on peut le partager entre threads ;
  - de bonnes **clés** de `HashMap` et éléments de `HashSet` (le hash ne change jamais) ;
  - on peut le **partager** et le mettre en cache sans copie ;
  - plus simple à raisonner : un invariant vérifié au constructeur reste vrai pour toujours.

  Exemples de la JDK : `String`, `Integer` et les autres enveloppes, `BigDecimal`, `LocalDate`, `Instant`, `Duration`,
  `List.of(...)`. Le coût : un nouvel objet à chaque « modification », en général négligeable.

  **Piège classique** : croire qu'un record est forcément immuable. Ses champs sont `final`, mais une `List` passée au
  constructeur reste la liste de l'appelant, qui peut la modifier : il faut une copie dans le constructeur compact.

  **En entretien** : « Champs `private final`, classe `final`, pas de setter, copies défensives des objets mutables ;
  c'est thread-safe par construction. »
cards:
  - key: regles
    format: course
    question: "Quelles sont les règles d'une classe immuable ?"
    choices:
      - {text: "Aucune méthode qui modifie l'état, classe `final`, champs `private final`, copies défensives", correct: true}
      - {text: "Des champs `private` et des setters qui valident chaque nouvelle valeur avant de l'écrire", correct: false}
      - {text: "Des champs `volatile`, et des méthodes `synchronized` pour toute modification de l'état", correct: false}
      - {text: "Des champs `final`, en gardant telles quelles les listes reçues par le constructeur", correct: false}
    answer: |-
      Pas de méthode qui modifie l'état, classe `final` (ou record), champs `private final`, et copies défensives des
      objets mutables reçus ou renvoyés. Un champ `final` fige la référence, pas la liste qu'elle désigne.
  - key: benefices
    format: course
    question: "Quels sont les avantages des objets immuables ?"
    choices:
      - {text: "Thread-safe sans verrou, bonnes clés de `HashMap`, partageables sans copie", correct: true}
      - {text: "Plus rapides à créer, car la JVM les range hors du tas, sans ramasse-miettes", correct: false}
      - {text: "Plus légers, car la JVM ne garde qu'un exemplaire de chaque valeur possible", correct: false}
      - {text: "Sérialisables d'office, sans avoir à implémenter `Serializable`", correct: false}
    answer: |-
      Ils sont thread-safe sans verrou, font de bonnes clés de `HashMap`, se partagent et se mettent en cache sans
      copie, et leurs invariants restent vrais pour toujours.
  - key: modifier
    format: course
    question: "Comment obtient-on la version « modifiée » d'un objet immuable ?"
    choices:
      - {text: "En créant un nouvel objet avec la valeur changée, l'original intact", correct: true}
      - {text: "En appelant un setter, qui modifie l'objet en place", correct: false}
      - {text: "Par réflexion, en levant le `final` du champ à changer", correct: false}
      - {text: "En le clonant avec `clone()`, puis en modifiant le clone", correct: false}
    answer: |-
      En créant un nouvel objet avec la valeur changée (`date.plusDays(1)`, `point.avecX(5)`), l'original restant
      intact.
  - key: record-mutable
    format: course
    question: "Un record est-il toujours immuable ?"
    choices:
      - {text: "Non : s'il contient une liste mutable, il faut la copier dans son constructeur", correct: true}
      - {text: "Oui : ses champs sont `final`, donc tout ce qu'ils contiennent est figé", correct: false}
      - {text: "Oui : le compilateur copie lui-même les collections qu'il reçoit", correct: false}
      - {text: "Non : ses champs ne sont pas `final`, on peut les réaffecter", correct: false}
    answer: |-
      Non : ses champs sont `final`, mais s'il contient une collection ou un objet mutable, il faut le copier dans le
      constructeur compact (`membres = List.copyOf(membres)`).
  - key: vf-string
    format: true-false
    question: "`s.toUpperCase()` modifie la chaîne `s`."
    truth: false
    answer: '`String` est immuable : la méthode renvoie une nouvelle chaîne.'
  - key: vf-thread-safe
    format: true-false
    question: Un objet vraiment immuable peut être partagé entre threads sans synchronisation.
    truth: true
    answer: Personne ne peut le modifier, il n'y a donc pas de course à protéger.
  - key: vf-final-suffit
    format: true-false
    question: Des champs `final` suffisent à rendre une classe immuable.
    truth: false
    answer: Un champ `final` peut référencer un objet mutable, et une sous-classe peut ajouter un état modifiable.
  - key: vf-local-date
    format: true-false
    question: "`LocalDate` est immuable."
    truth: true
    answer: '`plusDays`, `withYear`... renvoient de nouvelles dates.'
  - key: qcm-immuables
    format: multiple-choice
    question: Lesquels de ces types de la JDK sont immuables ?
    choices:
      - text: "`String`"
        correct: true
      - text: "`BigDecimal`"
        correct: true
      - text: "`LocalDate`"
        correct: true
      - text: "`java.util.Date`"
        correct: false
    answer: '`Date` a des setters ; c''est l''une des raisons de son remplacement par `java.time`.'
  - key: qcm-necessaire
    format: multiple-choice
    question: "Pour qu'une classe contenant une `List<String>` soit immuable, que faut-il faire de la liste reçue ?"
    choices:
      - {text: "La copier dans le constructeur, avec `List.copyOf`", correct: true}
      - {text: "La garder telle quelle, dans un champ `final`", correct: false}
      - {text: "La garder dans un champ déclaré `volatile`", correct: false}
      - {text: "La renvoyer par un accesseur `synchronized`", correct: false}
    answer: |-
      Avec `List.copyOf`, la liste stockée est elle-même immuable et peut être renvoyée telle quelle. Un champ `final`
      fige la référence, pas le contenu de la liste.
  - key: qcm-cout
    format: multiple-choice
    question: Quel est le principal coût de l'immuabilité ?
    choices:
      - text: "Un nouvel objet à chaque « modification »"
        correct: true
      - text: "Une synchronisation obligatoire"
        correct: false
      - text: "L'impossibilité d'avoir des méthodes"
        correct: false
      - text: "Une mauvaise compatibilité avec les collections"
        correct: false
    answer: En général négligeable ; pour de nombreuses modifications, on utilise un compagnon mutable (`StringBuilder`).
  - key: qcm-wither
    format: multiple-choice
    question: "Avec `record Point(int x, int y)`, comment obtenir le même point avec `x = 5` ?"
    choices:
      - text: "Une méthode `avecX(5)` qui renvoie `new Point(5, y)`"
        correct: true
      - text: "`point.x = 5;`"
        correct: false
      - text: "`point.setX(5);`, générée par le record"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: Un record n'a pas de setter ; on crée un nouveau point.
  - key: code-string
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = "abc";
      s.toUpperCase();
      String t = s.toUpperCase();
      System.out.println(s + " " + t);
      ```
    choices:
      - {text: "`abc ABC`", correct: true}
      - {text: "`ABC ABC`", correct: false}
      - {text: "`abc abc`", correct: false}
      - {text: "`ABC abc`", correct: false}
    answer: "`abc ABC` : `toUpperCase` renvoie une nouvelle chaîne, `s` ne change pas."
    check:
      output: "abc ABC"
  - key: code-wither
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Point(int x, int y) {
          Point avecX(int nx) { return new Point(nx, y); }
      }
      Point a = new Point(1, 2);
      Point b = a.avecX(5);
      System.out.println(a + " " + b);
      ```
    choices:
      - {text: "`Point[x=1, y=2] Point[x=5, y=2]`", correct: true}
      - {text: "`Point[x=5, y=2] Point[x=5, y=2]`", correct: false}
      - {text: "`Point[x=1, y=2] Point[x=1, y=2]`", correct: false}
      - {text: "`Point(1, 2) Point(5, 2)`", correct: false}
    answer: "`Point[x=1, y=2] Point[x=5, y=2]` : `avecX` crée un nouveau point, l'original reste intact."
    check:
      output: "Point[x=1, y=2] Point[x=5, y=2]"
  - key: code-record-liste
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Equipe(List<String> membres) { }
      List<String> liste = new ArrayList<>(List.of("Ada"));
      Equipe e = new Equipe(liste);
      liste.add("Bob");
      System.out.println(e.membres());
      ```
    choices:
      - {text: "`[Ada, Bob]`", correct: true}
      - {text: "`[Ada]`", correct: false}
      - {text: "`[Bob]`", correct: false}
      - {text: "Une `UnsupportedOperationException`", correct: false}
    answer: "`[Ada, Bob]` : le record partage la liste de l'appelant, il n'est pas immuable."
    check:
      output: "[Ada, Bob]"
  - key: code-local-date
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      LocalDate d = LocalDate.of(2025, 1, 31);
      d.plusDays(1);
      System.out.println(d + " " + d.plusMonths(1));
      ```
    choices:
      - {text: "`2025-01-31 2025-02-28`", correct: true}
      - {text: "`2025-02-01 2025-03-01`", correct: false}
      - {text: "`2025-01-31 2025-03-03`", correct: false}
      - {text: "`2025-02-01 2025-02-28`", correct: false}
    answer: "`2025-01-31 2025-02-28` : `d` ne change jamais, et `plusMonths` ajuste au dernier jour de février."
    check:
      code: |-
        import java.time.LocalDate;
        LocalDate d = LocalDate.of(2025, 1, 31);
        d.plusDays(1);
        System.out.println(d + " " + d.plusMonths(1));
      output: "2025-01-31 2025-02-28"
  - key: bug-resultat-ignore
    format: bug-fix
    question: |-
      La date d'échéance n'est jamais repoussée :
      ```java
      void prolonger(Abonnement a) {
          a.echeance().plusMonths(1);
      }
      ```
      `echeance()` renvoie une `LocalDate`. Quelle correction est la bonne ?
    choices:
      - {text: "Utiliser la date renvoyée par `plusMonths`, dans un nouvel abonnement", correct: true}
      - {text: "Remplacer `plusMonths(1)` par `withMonth(1)`, qui modifie la date", correct: false}
      - {text: "Appeler `plusMonths(1)` sur une copie obtenue par `clone()`", correct: false}
      - {text: "Déclarer l'échéance `volatile`, pour que le changement se voie", correct: false}
    answer: |-
      ```java
      Abonnement prolonger(Abonnement a) {
          return a.avecEcheance(a.echeance().plusMonths(1));
      }
      ```
      `LocalDate` est immuable : `plusMonths` renvoie une nouvelle date, ignorée ici. On utilise le résultat (et, si
      l'abonnement est immuable aussi, on renvoie un nouvel abonnement).
  - key: bug-record-liste
    format: bug-fix
    question: |-
      Une commande « immuable » voit ses lignes changer après coup. Quelle correction est la bonne ?
      ```java
      record Commande(String id, List<Ligne> lignes) { }
      ```
    choices:
      - {text: "Copier `lignes` avec `List.copyOf` dans le constructeur compact", correct: true}
      - {text: "Envelopper `lignes` dans `Collections.unmodifiableList` dans le constructeur", correct: false}
      - {text: "Renvoyer `new ArrayList<>(lignes)` depuis l'accesseur seulement", correct: false}
      - {text: "Déclarer le composant `final List<Ligne> lignes`", correct: false}
    answer: |-
      ```java
      record Commande(String id, List<Ligne> lignes) {
          Commande {
              lignes = List.copyOf(lignes);
          }
      }
      ```
      Le record gardait la liste de l'appelant. Le constructeur compact la remplace par une copie immuable (qui refuse
      aussi les `null`). `unmodifiableList` ne serait qu'une vue : la liste de l'appelant pourrait encore changer.
  - key: bug-setter
    format: bug-fix
    question: |-
      Une `Devise` sert de clé de `HashMap`, et un appel à `setCode` l'a rendue introuvable. Quelle correction est la
      bonne ?
      ```java
      public class Devise {
          private String code;
          public void setCode(String code) { this.code = code; }
          // equals et hashCode sur code
      }
      ```
    choices:
      - {text: "Faire de `Devise` une valeur immuable, un record sans setter", correct: true}
      - {text: "Recalculer le `hashCode` dans `setCode`, avant d'écrire le code", correct: false}
      - {text: "Remplacer la `HashMap` par une `TreeMap`, qui ignore le hash", correct: false}
      - {text: "Retirer `hashCode`, et ne garder qu'`equals` sur le code", correct: false}
    answer: |-
      ```java
      public record Devise(String code) {
          public Devise {
              Objects.requireNonNull(code);
          }
      }
      ```
      Une clé dont le hash change se perd dans la table. Une valeur immuable (ici un record) ne peut plus changer
      après sa création.
  - key: bug-sous-classe
    format: bug-fix
    question: |-
      Une sous-classe a rendu modifiable un `Montant` censé être immuable. Quelle correction est la bonne ?
      ```java
      public class Montant {
          private final long centimes;
          public Montant(long centimes) { this.centimes = centimes; }
          public long centimes() { return centimes; }
      }
      ```
    choices:
      - {text: "Déclarer `Montant` `final`, ou en faire un record", correct: true}
      - {text: "Déclarer la méthode `centimes()` `synchronized`", correct: false}
      - {text: "Déclarer le constructeur de `Montant` `protected`", correct: false}
      - {text: "Ajouter un setter `private` pour `centimes`", correct: false}
    answer: |-
      ```java
      public final class Montant {
          ...
      }
      ```
      Sans `final`, une sous-classe peut ajouter un état mutable et redéfinir `centimes()`. Une classe immuable
      interdit l'héritage (ou devient un record).
  - key: concois-classe-thread-safe-sans-synchronisation
    format: scenario
    question: "Comment conçois-tu une classe thread-safe sans synchronisation ?"
    choices:
      - {text: "Par l'immuabilité : champs `final`, pas de setter, classe `final`, copies défensives", correct: true}
      - {text: "Par des champs `volatile` : chaque écriture devient visible et atomique", correct: false}
      - {text: "Par des collections synchronisées pour chaque champ, sans verrou explicite", correct: false}
      - {text: "Par un singleton : une instance unique ne peut pas être mal partagée", correct: false}
    answer: |-
      Par l'immuabilité : une classe immuable est thread-safe par construction, sans verrou ni risque d'interblocage.
      Champs `final`, aucun setter, classe `final`, et copies défensives des objets mutables : c'est l'approche de
      `String` et des records. `volatile` rend une écriture visible, mais pas une suite d'opérations atomique.
  - key: scenario-valeur-metier
    format: scenario
    question: "Comment modélises-tu une somme d'argent dans un domaine métier ?"
    choices:
      - {text: "Un record immuable (centimes entiers, devise), dont les opérations renvoient un nouveau montant", correct: true}
      - {text: "Un `double` pour la somme et une `String` pour la devise, dans des champs publics", correct: false}
      - {text: "Une classe mutable dont `ajouter()` modifie la somme en place, plus économe", correct: false}
      - {text: "Un `float` arrondi à deux décimales, dans un objet doté de setters", correct: false}
    answer: |-
      Par un objet de valeur immuable, par exemple `record Montant(long centimes, Currency devise)`, qui valide ses
      invariants dans le constructeur compact. Ses opérations renvoient de nouveaux montants et refusent de mélanger
      les devises ; des centimes entiers (ou un `BigDecimal`) évitent les erreurs d'arrondi du `double`.
  - key: scenario-perf
    format: scenario
    question: "Un collègue craint que créer un nouvel objet à chaque modification soit trop lent. Que réponds-tu ?"
    choices:
      - {text: "Que c'est rarement mesurable ; si une mesure le montre, un compagnon mutable local", correct: true}
      - {text: "Qu'il a raison : on rend mutable toute classe modifiée souvent", correct: false}
      - {text: "Qu'on peut réutiliser l'objet en changeant ses champs `final` par réflexion", correct: false}
      - {text: "Qu'il suffit d'appeler `System.gc()` après chaque modification", correct: false}
    answer: |-
      Les objets de courte durée coûtent très peu aux GC générationnels, et l'immuabilité évite ailleurs des copies et
      des verrous. Si une mesure montre un vrai problème, on utilise un compagnon mutable local (`StringBuilder`, une
      `ArrayList` figée ensuite par `List.copyOf`), sans exposer d'état mutable.
  - key: scenario-migration-date
    format: scenario
    question: "Ton code utilise `java.util.Date` partout, et des bugs viennent de dates modifiées par erreur. Que proposes-tu ?"
    choices:
      - {text: "Migrer vers `java.time` (immuable), par les frontières, avec des copies défensives d'ici là", correct: true}
      - {text: "Déclarer chaque champ `Date` `final`, ce qui empêche toute modification de la date", correct: false}
      - {text: "Remplacer `Date` par `Calendar`, plus complet et protégé contre les modifications", correct: false}
      - {text: "Tout remplacer d'un coup par des `long` en millisecondes, sans type dédié", correct: false}
    answer: |-
      Migrer progressivement vers `java.time` (`Instant`, `LocalDate`, `ZonedDateTime`), des types immuables : la cause
      des bugs disparaît. On commence par les frontières (API, persistance, avec `date.toInstant()` et
      `Date.from(instant)`), et d'ici là chaque `Date` reçue ou renvoyée est copiée. `final` ne fige que la référence.
