notion: enumset-enummap
lesson: |-
  Pour des ensembles et des tables dont les clés sont des enums, la JDK offre deux implémentations spécialisées :

  - **`EnumSet`** : un ensemble de constantes, stocké comme un **vecteur de bits** (un `long` pour 64 constantes au
    plus). Ses opérations sont aussi rapides que des opérations bit à bit.
  - **`EnumMap`** : une table dont les clés sont des constantes, stockée comme un **tableau indexé par l'ordinal**.

  ```java
  enum Jour { LUN, MAR, MER, JEU, VEN, SAM, DIM }

  Set<Jour> weekend = EnumSet.of(Jour.SAM, Jour.DIM);
  Set<Jour> semaine = EnumSet.complementOf(EnumSet.of(Jour.SAM, Jour.DIM));
  Set<Jour> milieu  = EnumSet.range(Jour.MAR, Jour.JEU);       // MAR, MER, JEU
  Set<Jour> aucun   = EnumSet.noneOf(Jour.class);

  Map<Jour, Integer> heures = new EnumMap<>(Jour.class);
  heures.put(Jour.VEN, 7);
  heures.put(Jour.LUN, 8);    // l'itération suit l'ordre des constantes : LUN, puis VEN
  ```

  - L'itération suit **l'ordre de déclaration** des constantes, quel que soit l'ordre d'ajout.
  - `EnumMap` refuse les clés `null` ; `EnumSet` refuse les éléments `null`.
  - `EnumSet` remplace les **drapeaux en bits** (`int LECTURE = 1, ECRITURE = 2`) : même efficacité, mais typé et
    lisible (*Effective Java*, item 36).
  - `EnumMap` remplace un tableau indexé par `ordinal()` (item 37).

  **Piège classique** : `EnumSet.of()` sans argument ne compile pas ; l'ensemble vide s'écrit
  `EnumSet.noneOf(Jour.class)`.

  **En entretien** : « Pour des clés enum, `EnumSet` et `EnumMap` sont compacts, rapides et ordonnés ; ils remplacent les
  drapeaux binaires et les tableaux indexés par l'ordinal. »
cards:
  - key: enummap-enumset
    format: course
    question: EnumMap et EnumSet, pourquoi ?
    answer: Implémentations compactes et très rapides basées sur l'ordinal (tableau, vecteur de bits).
  - key: ordre
    format: course
    question: Dans quel ordre itère-t-on sur un `EnumSet` ou les clés d'une `EnumMap` ?
    answer: Dans l'ordre de déclaration des constantes, quel que soit l'ordre d'ajout.
  - key: remplace-drapeaux
    format: course
    question: Que remplace avantageusement `EnumSet` ?
    answer: "Les drapeaux en bits (`int` combinés par `|`) : il est aussi efficace, mais typé, lisible et imprimable."
  - key: fabriques
    format: course
    question: Citez quatre façons de créer un `EnumSet`.
    answer: '`EnumSet.of(a, b)`, `noneOf(Jour.class)` (vide), `allOf(Jour.class)` (toutes), `range(a, c)` et `complementOf(ensemble)`.'
  - key: vf-ordre-ajout
    format: true-false
    question: Un `EnumSet` itère dans l'ordre où l'on a ajouté les constantes.
    truth: false
    answer: Il itère dans l'ordre de déclaration de l'enum.
  - key: vf-null-enummap
    format: true-false
    question: Une `EnumMap` accepte une clé `null`.
    truth: false
    answer: Elle lève une `NullPointerException`.
  - key: vf-bits
    format: true-false
    question: Un `EnumSet` de moins de 64 constantes tient dans un seul `long`.
    truth: true
    answer: C'est un vecteur de bits, d'où ses performances.
  - key: vf-of-vide
    format: true-false
    question: "`EnumSet.of()` crée un ensemble vide."
    truth: false
    answer: Il faut au moins un argument ; l'ensemble vide est `EnumSet.noneOf(Jour.class)`.
  - key: qcm-vide
    format: multiple-choice
    question: Comment créer un `EnumSet<Droit>` vide ?
    choices:
      - text: "`EnumSet.noneOf(Droit.class)`"
        correct: true
      - text: "`EnumSet.of()`"
        correct: false
      - text: "`new EnumSet<>()`"
        correct: false
      - text: "`EnumSet.empty()`"
        correct: false
    answer: '`EnumSet` est abstraite ; on passe par ses fabriques.'
  - key: qcm-creer-map
    format: multiple-choice
    question: "Comment créer une `EnumMap` avec des clés `Jour` ?"
    choices:
      - text: "`new EnumMap<>(Jour.class)`"
        correct: true
      - text: "`new EnumMap<>()`"
        correct: false
      - text: "`EnumMap.of(Jour.class)`"
        correct: false
      - text: "`new EnumMap<>(Jour.values())`"
        correct: false
    answer: Le constructeur a besoin de la classe de l'enum pour dimensionner son tableau.
  - key: qcm-semaine
    format: multiple-choice
    question: Quelle expression donne les jours ouvrés, sachant le week-end ?
    choices:
      - text: "`EnumSet.complementOf(weekend)`"
        correct: true
      - text: "`EnumSet.range(Jour.LUN, Jour.VEN)`"
        correct: true
      - text: "`EnumSet.noneOf(weekend)`"
        correct: false
      - text: "`EnumSet.allOf(weekend)`"
        correct: false
    answer: '`complementOf` prend le reste, `range` les constantes entre deux bornes incluses.'
  - key: qcm-remplacer
    format: multiple-choice
    question: "Que remplacer par une `EnumMap<Plante, Set<Plante>>` (Effective Java, item 37) ?"
    choices:
      - text: "Un tableau de listes indexé par `plante.ordinal()`"
        correct: true
      - text: "Une `List<Plante>`"
        correct: false
      - text: "Une constante `static final`"
        correct: false
      - text: "Un `switch`"
        correct: false
    answer: Le tableau indexé par l'ordinal n'est ni typé ni sûr.
  - key: code-range
    format: code-output
    question: |-
      ```java
      enum Jour { LUN, MAR, MER, JEU, VEN, SAM, DIM }
      System.out.println(EnumSet.range(Jour.MAR, Jour.JEU));
      ```
    answer: '`[MAR, MER, JEU]` : les deux bornes sont incluses.'
    check:
      output: "[MAR, MER, JEU]"
  - key: code-complement
    format: code-output
    question: |-
      ```java
      enum Jour { LUN, MAR, MER, JEU, VEN, SAM, DIM }
      Set<Jour> ouvres = EnumSet.complementOf(EnumSet.of(Jour.SAM, Jour.DIM));
      System.out.println(ouvres.size() + " " + ouvres.contains(Jour.MER));
      ```
    answer: '`5 true`.'
    check:
      output: "5 true"
  - key: code-ordre-map
    format: code-output
    question: |-
      ```java
      enum Jour { LUN, MAR, MER, JEU, VEN }
      Map<Jour, Integer> heures = new EnumMap<>(Jour.class);
      heures.put(Jour.VEN, 7);
      heures.put(Jour.LUN, 8);
      System.out.println(heures);
      ```
    answer: '`{LUN=8, VEN=7}` : l''ordre suit la déclaration des constantes.'
    check:
      output: "{LUN=8, VEN=7}"
  - key: code-null
    format: code-output
    question: |-
      ```java
      enum Jour { LUN, MAR }
      Map<Jour, Integer> heures = new EnumMap<>(Jour.class);
      heures.put(null, 3);
      ```
    answer: "Une `NullPointerException` : une `EnumMap` refuse les clés `null`."
    check:
      throws: NullPointerException
  - key: bug-drapeaux
    format: bug-fix
    question: |-
      Modernisez ces droits en drapeaux binaires :
      ```java
      static final int LECTURE = 1, ECRITURE = 2, SUPPRESSION = 4;
      int droits = LECTURE | ECRITURE;
      boolean peutEcrire = (droits & ECRITURE) != 0;
      ```
    answer: |-
      ```java
      enum Droit { LECTURE, ECRITURE, SUPPRESSION }
      Set<Droit> droits = EnumSet.of(Droit.LECTURE, Droit.ECRITURE);
      boolean peutEcrire = droits.contains(Droit.ECRITURE);
      ```
      `EnumSet` est aussi compact qu'un `int` de drapeaux, mais typé (on ne peut pas y mettre 8) et lisible
      (`[LECTURE, ECRITURE]` à l'affichage).
  - key: bug-of-vide
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      Set<Droit> droits = EnumSet.of();
      ```
    answer: |-
      ```java
      Set<Droit> droits = EnumSet.noneOf(Droit.class);
      ```
      `EnumSet.of` exige au moins un élément ; l'ensemble vide a besoin de connaître la classe de l'enum.
  - key: bug-tableau-ordinal
    format: bug-fix
    question: |-
      Ce comptage par statut casse dès qu'on réordonne l'enum, et il n'est pas typé :
      ```java
      int[] parStatut = new int[Statut.values().length];
      for (Commande c : commandes) {
          parStatut[c.statut().ordinal()]++;
      }
      ```
    answer: |-
      ```java
      Map<Statut, Integer> parStatut = new EnumMap<>(Statut.class);
      for (Commande c : commandes) {
          parStatut.merge(c.statut(), 1, Integer::sum);
      }
      ```
      Une `EnumMap` est aussi rapide qu'un tableau indexé par l'ordinal, mais typée et lisible. (En stream :
      `groupingBy(Commande::statut, () -> new EnumMap<>(Statut.class), counting())`.)
  - key: bug-hashset-enum
    format: bug-fix
    question: |-
      Ce code d'un chemin critique alloue beaucoup pour un simple ensemble de jours :
      ```java
      Set<Jour> ouverts = new HashSet<>(List.of(Jour.LUN, Jour.MAR, Jour.MER));
      ```
    answer: |-
      ```java
      Set<Jour> ouverts = EnumSet.of(Jour.LUN, Jour.MAR, Jour.MER);
      ```
      Un `HashSet` crée une entrée par élément et calcule des hachages ; un `EnumSet` tient dans un `long` et itère
      dans l'ordre des jours.
