notion: enumset-enummap
lesson: |-
  Pour des ensembles et des tables dont les clés sont des enums, la JDK offre deux implémentations spécialisées :

  - **`EnumSet`** : un ensemble de constantes, stocké comme un **vecteur de bits** (un `long` pour 64 constantes au
    plus). Ses opérations sont aussi rapides que des opérations bit à bit.
  - **`EnumMap`** : une table dont les clés sont des constantes, stockée comme un **tableau indexé par l'ordinal**.

  ```java
  enum Jour { LUN, MAR, MER, JEU, VEN, SAM, DIM }

  Set<Jour> weekend = EnumSet.of(Jour.SAM, Jour.DIM);
  Set<Jour> semaine = EnumSet.complementOf(EnumSet.of(Jour.SAM, Jour.DIM));
  Set<Jour> milieu  = EnumSet.range(Jour.MAR, Jour.JEU);       // MAR, MER, JEU
  Set<Jour> aucun   = EnumSet.noneOf(Jour.class);

  Map<Jour, Integer> heures = new EnumMap<>(Jour.class);
  heures.put(Jour.VEN, 7);
  heures.put(Jour.LUN, 8);    // l'itération suit l'ordre des constantes : LUN, puis VEN
  ```

  - L'itération suit **l'ordre de déclaration** des constantes, quel que soit l'ordre d'ajout.
  - `EnumMap` refuse les clés `null` ; `EnumSet` refuse les éléments `null`.
  - `EnumSet` remplace les **drapeaux en bits** (`int LECTURE = 1, ECRITURE = 2`) : même efficacité, mais typé et
    lisible (*Effective Java*, item 36).
  - `EnumMap` remplace un tableau indexé par `ordinal()` (item 37).

  **Piège classique** : `EnumSet.of()` sans argument ne compile pas ; l'ensemble vide s'écrit
  `EnumSet.noneOf(Jour.class)`.

  **En entretien** : « Pour des clés enum, `EnumSet` et `EnumMap` sont compacts, rapides et ordonnés ; ils remplacent les
  drapeaux binaires et les tableaux indexés par l'ordinal. »
cards:
  - key: enummap-enumset
    format: course
    question: "Pourquoi préférer `EnumMap` et `EnumSet` à `HashMap` et `HashSet` quand les clés sont les constantes d'un enum ?"
    choices:
      - {text: "Ils s'appuient sur l'ordinal (tableau, bits) : compacts et très rapides", correct: true}
      - {text: "Ils acceptent les clés `null`, que `HashMap` refuse pour un enum", correct: false}
      - {text: "Ils sont synchronisés, donc sûrs entre plusieurs threads", correct: false}
      - {text: "Ils rangent les constantes dans l'ordre alphabétique de leur nom", correct: false}
    answer: "Ils s'appuient sur l'ordinal des constantes : un tableau pour `EnumMap`, un vecteur de bits pour `EnumSet`. Ils ne sont pas synchronisés pour autant, et refusent `null`."
  - key: ordre
    format: course
    question: Dans quel ordre itère-t-on sur un `EnumSet` ou les clés d'une `EnumMap` ?
    choices:
      - {text: "Dans l'ordre de déclaration des constantes", correct: true}
      - {text: "Dans l'ordre d'ajout des éléments", correct: false}
      - {text: "Dans l'ordre alphabétique des noms", correct: false}
      - {text: "Dans un ordre imprévisible, comme un `HashSet`", correct: false}
    answer: "Dans l'ordre de déclaration des constantes (celui de l'ordinal), quel que soit l'ordre d'ajout."
  - key: remplace-drapeaux
    format: course
    question: Que remplace avantageusement `EnumSet` ?
    choices:
      - {text: "Les drapeaux en bits, des `int` combinés par `|`", correct: true}
      - {text: "Les tableaux indexés par l'ordinal d'un enum", correct: false}
      - {text: "Les `switch` sur les constantes d'un enum", correct: false}
      - {text: "Les listes triées de chaînes de caractères", correct: false}
    answer: "Les drapeaux en bits (`int` combinés par `|`) : `EnumSet` est aussi efficace, mais typé, lisible et imprimable. Le tableau indexé par l'ordinal, lui, se remplace par une `EnumMap`."
  - key: fabriques
    format: course
    question: "Quelle liste ne contient que de vraies fabriques d'`EnumSet` ?"
    choices:
      - {text: "`of`, `noneOf`, `allOf`, `range`", correct: true}
      - {text: "`of`, `empty`, `all`, `between`", correct: false}
      - {text: "`of`, `noneOf`, `values`, `subSet`", correct: false}
      - {text: "`create`, `noneOf`, `allOf`, `range`", correct: false}
    answer: "`EnumSet.of(a, b)`, `noneOf(Jour.class)` (vide), `allOf(Jour.class)` (toutes), `range(a, c)`, et aussi `complementOf(ensemble)`. `EnumSet` n'a pas de constructeur public."
  - key: vf-ordre-ajout
    format: true-false
    question: Un `EnumSet` itère dans l'ordre où l'on a ajouté les constantes.
    truth: false
    answer: Il itère dans l'ordre de déclaration de l'enum.
  - key: vf-null-enummap
    format: true-false
    question: Une `EnumMap` accepte une clé `null`.
    truth: false
    answer: Elle lève une `NullPointerException`.
  - key: vf-bits
    format: true-false
    question: Un `EnumSet` de moins de 64 constantes tient dans un seul `long`.
    truth: true
    answer: C'est un vecteur de bits, d'où ses performances.
  - key: vf-of-vide
    format: true-false
    question: "`EnumSet.of()` crée un ensemble vide."
    truth: false
    answer: Il faut au moins un argument ; l'ensemble vide est `EnumSet.noneOf(Jour.class)`.
  - key: qcm-vide
    format: multiple-choice
    question: Comment créer un `EnumSet<Droit>` vide ?
    choices:
      - text: "`EnumSet.noneOf(Droit.class)`"
        correct: true
      - text: "`EnumSet.of()`"
        correct: false
      - text: "`new EnumSet<>()`"
        correct: false
      - text: "`EnumSet.empty()`"
        correct: false
    answer: '`EnumSet` est abstraite ; on passe par ses fabriques.'
  - key: qcm-creer-map
    format: multiple-choice
    question: "Comment créer une `EnumMap` avec des clés `Jour` ?"
    choices:
      - text: "`new EnumMap<>(Jour.class)`"
        correct: true
      - text: "`new EnumMap<>()`"
        correct: false
      - text: "`EnumMap.of(Jour.class)`"
        correct: false
      - text: "`new EnumMap<>(Jour.values())`"
        correct: false
    answer: Le constructeur a besoin de la classe de l'enum pour dimensionner son tableau.
  - key: qcm-semaine
    format: multiple-choice
    question: "Quelle expression donne les jours ouvrés à partir de l'ensemble `weekend` ?"
    choices:
      - {text: "`EnumSet.complementOf(weekend)`", correct: true}
      - {text: "`EnumSet.noneOf(weekend)`", correct: false}
      - {text: "`EnumSet.allOf(weekend)`", correct: false}
      - {text: "`EnumSet.copyOf(weekend)`", correct: false}
    answer: "`complementOf` prend les constantes absentes de `weekend`. `copyOf` le recopierait, et `noneOf` comme `allOf` attendent une classe (`Jour.class`)."
  - key: qcm-remplacer
    format: multiple-choice
    question: "Que remplacer par une `EnumMap<Plante, Set<Plante>>` (Effective Java, item 37) ?"
    choices:
      - {text: "Un tableau de listes indexé par `plante.ordinal()`", correct: true}
      - {text: "Une `List<Plante>` parcourue à chaque recherche", correct: false}
      - {text: "Une constante `static final` par cycle de vie", correct: false}
      - {text: "Un `switch` sur la plante dans chaque méthode", correct: false}
    answer: Le tableau indexé par l'ordinal n'est ni typé ni sûr.
  - key: code-range
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Jour { LUN, MAR, MER, JEU, VEN, SAM, DIM }
      System.out.println(EnumSet.range(Jour.MAR, Jour.JEU));
      ```
    choices:
      - {text: "`[MAR, MER, JEU]`", correct: true}
      - {text: "`[MAR, MER]`", correct: false}
      - {text: "`[MER]`", correct: false}
      - {text: "`[MAR, JEU]`", correct: false}
    answer: "`[MAR, MER, JEU]` : `range` prend toutes les constantes entre les deux bornes, incluses."
    check:
      output: "[MAR, MER, JEU]"
  - key: code-complement
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Jour { LUN, MAR, MER, JEU, VEN, SAM, DIM }
      Set<Jour> ouvres = EnumSet.complementOf(EnumSet.of(Jour.SAM, Jour.DIM));
      System.out.println(ouvres.size() + " " + ouvres.contains(Jour.MER));
      ```
    choices:
      - {text: "`5 true`", correct: true}
      - {text: "`2 false`", correct: false}
      - {text: "`5 false`", correct: false}
      - {text: "`7 true`", correct: false}
    answer: "`5 true` : le complément de {SAM, DIM} contient les cinq autres jours, dont MER."
    check:
      output: "5 true"
  - key: code-ordre-map
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Jour { LUN, MAR, MER, JEU, VEN }
      Map<Jour, Integer> heures = new EnumMap<>(Jour.class);
      heures.put(Jour.VEN, 7);
      heures.put(Jour.LUN, 8);
      System.out.println(heures);
      ```
    choices:
      - {text: "`{LUN=8, VEN=7}`", correct: true}
      - {text: "`{VEN=7, LUN=8}`", correct: false}
      - {text: "`[LUN, VEN]`", correct: false}
      - {text: "`{LUN=8, MAR=null, MER=null, JEU=null, VEN=7}`", correct: false}
    answer: "`{LUN=8, VEN=7}` : l'ordre suit la déclaration des constantes, pas l'ordre d'ajout, et seules les clés présentes s'affichent."
    check:
      output: "{LUN=8, VEN=7}"
  - key: code-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Jour { LUN, MAR }
      Map<Jour, Integer> heures = new EnumMap<>(Jour.class);
      heures.put(null, 3);
      ```
    choices:
      - {text: "Une `NullPointerException`", correct: true}
      - {text: "Rien : la clé `null` est acceptée", correct: false}
      - {text: "Une `IllegalArgumentException`", correct: false}
      - {text: "Une `ClassCastException`", correct: false}
    answer: "Une `NullPointerException` : une `EnumMap` refuse les clés `null`, contrairement à une `HashMap`."
    check:
      throws: NullPointerException
  - key: bug-drapeaux
    format: bug-fix
    question: |-
      Ces droits sont codés en drapeaux binaires. Quelle modernisation est la bonne ?
      ```java
      static final int LECTURE = 1, ECRITURE = 2, SUPPRESSION = 4;
      int droits = LECTURE | ECRITURE;
      boolean peutEcrire = (droits & ECRITURE) != 0;
      ```
    choices:
      - {text: "Un `enum Droit` et un `EnumSet<Droit>`, testé par `contains`", correct: true}
      - {text: "Un `BitSet` indexé par les constantes `int` existantes", correct: false}
      - {text: "Une `HashMap<String, Boolean>` qui donne l'état de chaque droit", correct: false}
      - {text: "Des constantes `long` au lieu d'`int`, pour plus de droits", correct: false}
    answer: |-
      ```java
      enum Droit { LECTURE, ECRITURE, SUPPRESSION }
      Set<Droit> droits = EnumSet.of(Droit.LECTURE, Droit.ECRITURE);
      boolean peutEcrire = droits.contains(Droit.ECRITURE);
      ```
      `EnumSet` est aussi compact qu'un `int` de drapeaux, mais typé (on ne peut pas y mettre 8) et lisible
      (`[LECTURE, ECRITURE]` à l'affichage).
  - key: bug-of-vide
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      Set<Droit> droits = EnumSet.of();
      ```
    choices:
      - {text: "`EnumSet.noneOf(Droit.class)`", correct: true}
      - {text: "`EnumSet.of(null)`", correct: false}
      - {text: "`new EnumSet<Droit>()`", correct: false}
      - {text: "`EnumSet.allOf(Droit.class)`", correct: false}
    answer: |-
      ```java
      Set<Droit> droits = EnumSet.noneOf(Droit.class);
      ```
      `EnumSet.of` exige au moins un élément ; l'ensemble vide a besoin de connaître la classe de l'enum. `allOf`
      compilerait, mais donnerait tous les droits.
  - key: bug-tableau-ordinal
    format: bug-fix
    question: |-
      Ce comptage par statut casse dès qu'on réordonne l'enum, et il n'est pas typé. Quelle correction est la bonne ?
      ```java
      int[] parStatut = new int[Statut.values().length];
      for (Commande c : commandes) {
          parStatut[c.statut().ordinal()]++;
      }
      ```
    choices:
      - {text: "Une `EnumMap<Statut, Integer>` remplie par `merge(statut, 1, Integer::sum)`", correct: true}
      - {text: "Un tableau indexé par `statut.name().hashCode()` plutôt que l'ordinal", correct: false}
      - {text: "Une `HashMap<Integer, Integer>` dont les clés sont les ordinaux", correct: false}
      - {text: "Un `int[]` trié par nom de statut avant chaque comptage", correct: false}
    answer: |-
      ```java
      Map<Statut, Integer> parStatut = new EnumMap<>(Statut.class);
      for (Commande c : commandes) {
          parStatut.merge(c.statut(), 1, Integer::sum);
      }
      ```
      Une `EnumMap` est aussi rapide qu'un tableau indexé par l'ordinal, mais typée et lisible. (En stream :
      `groupingBy(Commande::statut, () -> new EnumMap<>(Statut.class), counting())`.)
  - key: bug-hashset-enum
    format: bug-fix
    question: |-
      Ce code d'un chemin critique alloue beaucoup pour un simple ensemble de jours. Quelle correction est la bonne ?
      ```java
      Set<Jour> ouverts = new HashSet<>(List.of(Jour.LUN, Jour.MAR, Jour.MER));
      ```
    choices:
      - {text: "`EnumSet.of(Jour.LUN, Jour.MAR, Jour.MER)`", correct: true}
      - {text: "`new TreeSet<>(List.of(Jour.LUN, Jour.MAR, Jour.MER))`", correct: false}
      - {text: "`new LinkedHashSet<>(List.of(Jour.LUN, Jour.MAR, Jour.MER))`", correct: false}
      - {text: "`new HashSet<>(16)`, rempli ensuite par trois `add`", correct: false}
    answer: |-
      ```java
      Set<Jour> ouverts = EnumSet.of(Jour.LUN, Jour.MAR, Jour.MER);
      ```
      Un `HashSet` crée une entrée par élément et calcule des hachages ; un `EnumSet` tient dans un `long` et itère
      dans l'ordre des jours.
