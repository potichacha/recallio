notion: copies-defensives
lesson: |-
  Quand une classe reçoit ou expose un objet **mutable**, elle partage cet objet avec l'extérieur. Une **copie
  défensive** coupe ce lien :

  ```java
  public final class Periode {
      private final Date debut;
      private final Date fin;

      public Periode(Date debut, Date fin) {
          this.debut = new Date(debut.getTime());   // 1. copier d'abord...
          this.fin = new Date(fin.getTime());
          if (this.debut.after(this.fin)) {         // 2. ...puis valider la copie
              throw new IllegalArgumentException("début après la fin");
          }
      }

      public Date debut() {
          return new Date(debut.getTime());         // 3. copier en sortie
      }
  }
  ```

  - **En entrée** : copier **avant** de valider, et valider la copie. Sinon un autre thread peut modifier l'argument
    entre la vérification et la copie (*time-of-check / time-of-use*).
  - **En sortie** : ne jamais renvoyer la référence interne d'un objet mutable.
  - Pour les collections : `List.copyOf` (copie immuable, refuse les `null`, et ne recopie pas une liste déjà
    immuable), `new ArrayList<>(liste)` (copie modifiable), `Collections.unmodifiableList` (une **vue** : elle protège
    en sortie, mais suit les changements de la liste interne).
  - Le meilleur remède : des types **immuables** (`Instant`, `LocalDate`, `List.of`), qui n'ont pas besoin d'être
    copiés.
  - Pas de `clone()` pour copier un argument : sa classe réelle peut être une sous-classe malveillante.

  **Piège classique** : valider l'argument puis le copier. Entre les deux, un autre thread peut changer la valeur
  validée.

  **En entretien** : « On copie les objets mutables reçus, avant de les valider, et on ne rend jamais une référence
  interne ; mieux encore, on utilise des types immuables. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'une copie défensive ?
    choices:
      - {text: "La copie d'un objet mutable reçu ou renvoyé, pour protéger l'état interne de la classe", correct: true}
      - {text: "La copie de sauvegarde d'un objet, gardée pour le restaurer après une erreur", correct: false}
      - {text: "Une copie profonde par `clone()` de tout objet reçu, mutable ou non", correct: false}
      - {text: "La copie d'un objet immuable, faite pour pouvoir le modifier sans risque", correct: false}
    answer: |-
      La copie d'un objet mutable reçu en argument ou renvoyé par un accesseur, pour que l'extérieur ne puisse pas
      modifier l'état interne de la classe. Un objet immuable n'en a pas besoin.
  - key: ordre
    format: course
    question: "Pourquoi copier un argument mutable avant de le valider, et pas après ?"
    choices:
      - {text: "Un autre thread pourrait le modifier entre la validation et la copie", correct: true}
      - {text: "Valider une copie est plus rapide que valider l'objet d'origine", correct: false}
      - {text: "Le compilateur refuse de valider un argument qui n'a pas été copié", correct: false}
      - {text: "La copie remet les champs à zéro, ce qui simplifie la validation", correct: false}
    answer: |-
      Si l'on valide l'argument puis qu'on le copie, un autre thread peut le modifier entre les deux (*time-of-check /
      time-of-use*) ; en validant la copie, on valide ce qu'on garde.
  - key: vue-vs-copie
    format: course
    question: Quelle différence entre `Collections.unmodifiableList(l)` et `List.copyOf(l)` ?
    choices:
      - {text: "La première est une vue en lecture seule qui suit `l` ; la seconde, une copie immuable indépendante", correct: true}
      - {text: "La première est une copie immuable indépendante ; la seconde, une vue en lecture seule qui suit `l`", correct: false}
      - {text: "La première copie `l` et reste modifiable ; la seconde est une vue en lecture seule de `l`", correct: false}
      - {text: "Aucune : ce sont deux copies immuables de `l`, seul le nom de la méthode change", correct: false}
    answer: |-
      `unmodifiableList` est une vue en lecture seule qui suit les changements de `l` ; `List.copyOf` est une copie
      immuable indépendante (qui refuse les `null`).
  - key: clone-argument
    format: course
    question: Pourquoi ne pas utiliser `clone()` pour copier un argument ?
    choices:
      - {text: "Sa classe réelle peut être une sous-classe au `clone()` incorrect ou malveillant", correct: true}
      - {text: "`clone()` est dépréciée depuis Java 9 et sera bientôt retirée de la JDK", correct: false}
      - {text: "`clone()` ne copie que les champs `final`, et laisse les autres à zéro", correct: false}
      - {text: "`clone()` est toujours plus lent qu'un constructeur de copie", correct: false}
    answer: |-
      La classe réelle de l'argument peut être une sous-classe dont le `clone()` est malveillant ou incorrect ; on copie
      avec un constructeur ou une fabrique d'un type qu'on maîtrise.
  - key: vf-immuables
    format: true-false
    question: Un argument de type `LocalDate` doit être copié défensivement.
    truth: false
    answer: '`LocalDate` est immuable : on peut garder la référence.'
  - key: vf-vue
    format: true-false
    question: "`Collections.unmodifiableList(interne)` reflète les modifications ultérieures de `interne`."
    truth: true
    answer: C'est une vue, pas une copie.
  - key: vf-copy-of-null
    format: true-false
    question: "`List.copyOf` accepte une liste qui contient `null`."
    truth: false
    answer: Elle lève une `NullPointerException`.
  - key: vf-sortie
    format: true-false
    question: Si un champ est `private final`, on peut renvoyer sans risque la liste mutable qu'il référence.
    truth: false
    answer: L'appelant reçoit la même liste et peut la modifier.
  - key: qcm-entree
    format: multiple-choice
    question: "Dans le constructeur, que faire d'une `List<String>` reçue qu'on veut garder telle quelle, sans la modifier ?"
    choices:
      - {text: "`this.noms = List.copyOf(noms);`", correct: true}
      - {text: "`this.noms = noms;`", correct: false}
      - {text: "`this.noms = Collections.unmodifiableList(noms);`", correct: false}
      - {text: "`this.noms = Collections.synchronizedList(noms);`", correct: false}
    answer: |-
      `List.copyOf` garde une copie immuable, indépendante de la liste de l'appelant. Une vue (non modifiable ou
      synchronisée) suivrait ses changements. S'il faut la modifier en interne, on prend `new ArrayList<>(noms)`.
  - key: qcm-ordre
    format: multiple-choice
    question: Dans quel ordre traiter un argument mutable dans un constructeur ?
    choices:
      - text: "Copier, puis valider la copie"
        correct: true
      - text: "Valider l'argument, puis le copier"
        correct: false
      - text: "Valider seulement"
        correct: false
      - text: "Copier seulement, la validation est inutile"
        correct: false
    answer: On valide ce qu'on garde, et personne d'autre ne peut le modifier.
  - key: qcm-a-copier
    format: multiple-choice
    question: Lesquels de ces arguments faut-il copier défensivement ?
    choices:
      - text: "Un `java.util.Date`"
        correct: true
      - text: "Un `int[]`"
        correct: true
      - text: "Une `String`"
        correct: false
      - text: "Un `Instant`"
        correct: false
    answer: Seuls les objets mutables ont besoin d'une copie.
  - key: qcm-remede
    format: multiple-choice
    question: Quelle est la meilleure façon d'éviter les copies défensives ?
    choices:
      - text: "Utiliser des types immuables"
        correct: true
      - text: "Synchroniser toutes les méthodes"
        correct: false
      - text: "Rendre les champs `public`"
        correct: false
      - text: "Utiliser `clone()` partout"
        correct: false
    answer: Un objet immuable se partage sans risque.
  - key: code-sans-copie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      final class Periode {
          private final Date debut;
          Periode(Date debut) { this.debut = debut; }
          Date debut() { return debut; }
      }
      Date d = new Date(0);
      Periode p = new Periode(d);
      d.setTime(1000);
      System.out.println(p.debut().getTime());
      ```
    choices:
      - {text: "`1000`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Une `IllegalStateException` : `debut` est `final`", correct: false}
      - {text: "Ça ne compile pas : `debut` est `final`", correct: false}
    answer: '`1000` : sans copie, l''appelant modifie l''état interne de la période.'
    check:
      output: "1000"
  - key: code-avec-copie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      final class Periode {
          private final Date debut;
          Periode(Date debut) { this.debut = new Date(debut.getTime()); }
          Date debut() { return new Date(debut.getTime()); }
      }
      Date d = new Date(0);
      Periode p = new Periode(d);
      d.setTime(1000);
      p.debut().setTime(2000);
      System.out.println(p.debut().getTime());
      ```
    choices:
      - {text: "`0`", correct: true}
      - {text: "`1000`", correct: false}
      - {text: "`2000`", correct: false}
      - {text: "`3000`", correct: false}
    answer: '`0` : les copies en entrée et en sortie protègent l''état interne.'
    check:
      output: "0"
  - key: code-copy-of-null
    format: code-output
    question: |-
      Que se passe-t-il à l'exécution de ce code ?
      ```java
      List<String> avecNull = Arrays.asList("a", null);
      List<String> copie = List.copyOf(avecNull);
      ```
    choices:
      - {text: "Une `NullPointerException`", correct: true}
      - {text: "Une `UnsupportedOperationException`", correct: false}
      - {text: "Rien : `copie` contient `a` et `null`", correct: false}
      - {text: "Rien : `copie` ignore le `null` et contient `a`", correct: false}
    answer: "Une `NullPointerException` : `List.copyOf` refuse les `null`."
    check:
      throws: NullPointerException
  - key: code-vue
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> interne = new ArrayList<>(List.of("a"));
      List<String> vue = Collections.unmodifiableList(interne);
      List<String> copie = List.copyOf(interne);
      interne.add("b");
      System.out.println(vue + " " + copie);
      ```
    choices:
      - {text: "`[a, b] [a]`", correct: true}
      - {text: "`[a] [a]`", correct: false}
      - {text: "`[a, b] [a, b]`", correct: false}
      - {text: "`[a] [a, b]`", correct: false}
    answer: '`[a, b] [a]` : la vue suit la liste interne, la copie non.'
    check:
      output: "[a, b] [a]"
  - key: bug-entree
    format: bug-fix
    question: |-
      Le planning d'une salle change quand l'appelant réutilise son tableau. Quelle correction est la bonne ?
      ```java
      Salle(int[] creneaux) {
          this.creneaux = creneaux;
      }
      ```
    choices:
      - {text: "Garder sa propre copie : `this.creneaux = creneaux.clone();`", correct: true}
      - {text: "Déclarer le champ `final` : `private final int[] creneaux;`", correct: false}
      - {text: "Déclarer le paramètre `final` : `Salle(final int[] creneaux)`", correct: false}
      - {text: "Passer par une variable locale : `int[] c = creneaux;`", correct: false}
    answer: |-
      ```java
      Salle(int[] creneaux) {
          this.creneaux = creneaux.clone();
      }
      ```
      Un tableau est mutable : on garde sa propre copie (pour un tableau de primitives, `clone()` est sûr et simple).
      `final` fige la référence, pas le contenu du tableau.
  - key: bug-sortie
    format: bug-fix
    question: |-
      Un appelant a vidé la liste des administrateurs. Quelle correction est la bonne ?
      ```java
      public List<Utilisateur> administrateurs() {
          return administrateurs;
      }
      // ailleurs : groupe.administrateurs().clear();
      ```
    choices:
      - {text: "Renvoyer une copie immuable : `return List.copyOf(administrateurs);`", correct: true}
      - {text: "Déclarer le champ `final` : `private final List<Utilisateur> administrateurs`", correct: false}
      - {text: "Déclarer l'accesseur `final`, pour qu'aucune sous-classe ne le redéfinisse", correct: false}
      - {text: "Déclarer l'accesseur `synchronized`, pour que `clear()` attende son tour", correct: false}
    answer: |-
      ```java
      public List<Utilisateur> administrateurs() {
          return List.copyOf(administrateurs);
      }
      ```
      L'accesseur rendait la liste interne. Une copie immuable (ou une vue non modifiable) empêche l'appelant de la
      modifier ; `final` ne protège que la référence.
  - key: bug-ordre-validation
    format: bug-fix
    question: |-
      Une revue de sécurité signale ce constructeur. Pourquoi ?
      ```java
      Periode(Date debut, Date fin) {
          if (debut.after(fin)) throw new IllegalArgumentException();
          this.debut = new Date(debut.getTime());
          this.fin = new Date(fin.getTime());
      }
      ```
    choices:
      - {text: "Un autre thread peut modifier `debut` ou `fin` entre la validation et la copie", correct: true}
      - {text: "La copie par `new Date(...getTime())` perd le fuseau horaire des dates reçues", correct: false}
      - {text: "`debut.after(fin)` compare les références des dates, pas leurs instants", correct: false}
      - {text: "Un argument invalide doit lever une `NullPointerException`, pas une autre", correct: false}
    answer: |-
      ```java
      Periode(Date debut, Date fin) {
          this.debut = new Date(debut.getTime());
          this.fin = new Date(fin.getTime());
          if (this.debut.after(this.fin)) throw new IllegalArgumentException();
      }
      ```
      Entre la validation et la copie, un autre thread peut modifier `debut` ou `fin`. On copie d'abord et on valide les
      copies. (Avec `Instant`, immuable, le problème disparaît.)
  - key: bug-vue-entree
    format: bug-fix
    question: |-
      L'ensemble des droits d'un rôle change quand l'appelant modifie son ensemble après la création. Quelle correction
      est la bonne ?
      ```java
      Role(Set<Droit> droits) {
          this.droits = Collections.unmodifiableSet(droits);
      }
      ```
    choices:
      - {text: "Garder une vraie copie : `this.droits = Set.copyOf(droits);`", correct: true}
      - {text: "Garder une vue synchronisée : `Collections.synchronizedSet(droits)`", correct: false}
      - {text: "Déclarer le champ `final`, pour que l'ensemble ne change plus", correct: false}
      - {text: "Renvoyer aussi `Collections.unmodifiableSet(droits)` dans l'accesseur", correct: false}
    answer: |-
      ```java
      Role(Set<Droit> droits) {
          this.droits = Set.copyOf(droits);
      }
      ```
      Une vue non modifiable empêche le rôle de modifier l'ensemble, mais pas l'appelant, qui garde l'original. En
      entrée, il faut une vraie copie.
