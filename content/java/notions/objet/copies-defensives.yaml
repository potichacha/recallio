notion: copies-defensives
lesson: |-
  Quand une classe reçoit ou expose un objet **mutable**, elle partage cet objet avec l'extérieur. Une **copie
  défensive** coupe ce lien :

  ```java
  public final class Periode {
      private final Date debut;
      private final Date fin;

      public Periode(Date debut, Date fin) {
          this.debut = new Date(debut.getTime());   // 1. copier d'abord...
          this.fin = new Date(fin.getTime());
          if (this.debut.after(this.fin)) {         // 2. ...puis valider la copie
              throw new IllegalArgumentException("début après la fin");
          }
      }

      public Date debut() {
          return new Date(debut.getTime());         // 3. copier en sortie
      }
  }
  ```

  - **En entrée** : copier **avant** de valider, et valider la copie. Sinon un autre thread peut modifier l'argument
    entre la vérification et la copie (*time-of-check / time-of-use*).
  - **En sortie** : ne jamais renvoyer la référence interne d'un objet mutable.
  - Pour les collections : `List.copyOf` (copie immuable, refuse les `null`, et ne recopie pas une liste déjà
    immuable), `new ArrayList<>(liste)` (copie modifiable), `Collections.unmodifiableList` (une **vue** : elle protège
    en sortie, mais suit les changements de la liste interne).
  - Le meilleur remède : des types **immuables** (`Instant`, `LocalDate`, `List.of`), qui n'ont pas besoin d'être
    copiés.
  - Pas de `clone()` pour copier un argument : sa classe réelle peut être une sous-classe malveillante.

  **Piège classique** : valider l'argument puis le copier. Entre les deux, un autre thread peut changer la valeur
  validée.

  **En entretien** : « On copie les objets mutables reçus, avant de les valider, et on ne rend jamais une référence
  interne ; mieux encore, on utilise des types immuables. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'une copie défensive ?
    answer: La copie d'un objet mutable reçu en argument ou renvoyé par un accesseur, pour que l'extérieur ne puisse pas modifier l'état interne de la classe.
  - key: ordre
    format: course
    question: Pourquoi copier avant de valider ?
    answer: Si l'on valide l'argument puis qu'on le copie, un autre thread peut le modifier entre les deux (*time-of-check / time-of-use*) ; en validant la copie, on valide ce qu'on garde.
  - key: vue-vs-copie
    format: course
    question: Quelle différence entre `Collections.unmodifiableList(l)` et `List.copyOf(l)` ?
    answer: La première est une vue en lecture seule qui suit les changements de `l` ; la seconde est une copie immuable indépendante (qui refuse les `null`).
  - key: clone-argument
    format: course
    question: Pourquoi ne pas utiliser `clone()` pour copier un argument ?
    answer: Sa classe réelle peut être une sous-classe dont le `clone()` est malveillant ou incorrect ; on copie avec un constructeur ou une fabrique d'un type qu'on maîtrise.
  - key: vf-immuables
    format: true-false
    question: Un argument de type `LocalDate` doit être copié défensivement.
    truth: false
    answer: '`LocalDate` est immuable : on peut garder la référence.'
  - key: vf-vue
    format: true-false
    question: "`Collections.unmodifiableList(interne)` reflète les modifications ultérieures de `interne`."
    truth: true
    answer: C'est une vue, pas une copie.
  - key: vf-copy-of-null
    format: true-false
    question: "`List.copyOf` accepte une liste qui contient `null`."
    truth: false
    answer: Elle lève une `NullPointerException`.
  - key: vf-sortie
    format: true-false
    question: Si un champ est `private final`, on peut renvoyer sans risque la liste mutable qu'il référence.
    truth: false
    answer: L'appelant reçoit la même liste et peut la modifier.
  - key: qcm-entree
    format: multiple-choice
    question: Que faire, dans le constructeur, d'une `List<String>` reçue qu'on veut garder ?
    choices:
      - text: "`this.noms = List.copyOf(noms);`"
        correct: true
      - text: "`this.noms = new ArrayList<>(noms);`, si l'on doit la modifier en interne"
        correct: true
      - text: "`this.noms = noms;`"
        correct: false
      - text: "`this.noms = Collections.unmodifiableList(noms);`"
        correct: false
    answer: La vue non modifiable suivrait les changements faits par l'appelant sur sa liste.
  - key: qcm-ordre
    format: multiple-choice
    question: Dans quel ordre traiter un argument mutable dans un constructeur ?
    choices:
      - text: "Copier, puis valider la copie"
        correct: true
      - text: "Valider l'argument, puis le copier"
        correct: false
      - text: "Valider seulement"
        correct: false
      - text: "Copier seulement, la validation est inutile"
        correct: false
    answer: On valide ce qu'on garde, et personne d'autre ne peut le modifier.
  - key: qcm-a-copier
    format: multiple-choice
    question: Lesquels de ces arguments faut-il copier défensivement ?
    choices:
      - text: "Un `java.util.Date`"
        correct: true
      - text: "Un `int[]`"
        correct: true
      - text: "Une `String`"
        correct: false
      - text: "Un `Instant`"
        correct: false
    answer: Seuls les objets mutables ont besoin d'une copie.
  - key: qcm-remede
    format: multiple-choice
    question: Quelle est la meilleure façon d'éviter les copies défensives ?
    choices:
      - text: "Utiliser des types immuables"
        correct: true
      - text: "Synchroniser toutes les méthodes"
        correct: false
      - text: "Rendre les champs `public`"
        correct: false
      - text: "Utiliser `clone()` partout"
        correct: false
    answer: Un objet immuable se partage sans risque.
  - key: code-sans-copie
    format: code-output
    question: |-
      ```java
      final class Periode {
          private final Date debut;
          Periode(Date debut) { this.debut = debut; }
          Date debut() { return debut; }
      }
      Date d = new Date(0);
      Periode p = new Periode(d);
      d.setTime(1000);
      System.out.println(p.debut().getTime());
      ```
    answer: '`1000` : sans copie, l''appelant modifie l''état interne de la période.'
    check:
      output: "1000"
  - key: code-avec-copie
    format: code-output
    question: |-
      ```java
      final class Periode {
          private final Date debut;
          Periode(Date debut) { this.debut = new Date(debut.getTime()); }
          Date debut() { return new Date(debut.getTime()); }
      }
      Date d = new Date(0);
      Periode p = new Periode(d);
      d.setTime(1000);
      p.debut().setTime(2000);
      System.out.println(p.debut().getTime());
      ```
    answer: '`0` : les copies en entrée et en sortie protègent l''état interne.'
    check:
      output: "0"
  - key: code-copy-of-null
    format: code-output
    question: |-
      ```java
      List<String> avecNull = Arrays.asList("a", null);
      List<String> copie = List.copyOf(avecNull);
      ```
    answer: "Une `NullPointerException` : `List.copyOf` refuse les `null`."
    check:
      throws: NullPointerException
  - key: code-vue
    format: code-output
    question: |-
      ```java
      List<String> interne = new ArrayList<>(List.of("a"));
      List<String> vue = Collections.unmodifiableList(interne);
      List<String> copie = List.copyOf(interne);
      interne.add("b");
      System.out.println(vue + " " + copie);
      ```
    answer: '`[a, b] [a]` : la vue suit la liste interne, la copie non.'
    check:
      output: "[a, b] [a]"
  - key: bug-entree
    format: bug-fix
    question: |-
      Le planning d'une salle change quand l'appelant réutilise son tableau :
      ```java
      Salle(int[] creneaux) {
          this.creneaux = creneaux;
      }
      ```
    answer: |-
      ```java
      Salle(int[] creneaux) {
          this.creneaux = creneaux.clone();
      }
      ```
      Un tableau est mutable : on garde sa propre copie (pour un tableau de primitives, `clone()` est sûr et simple).
  - key: bug-sortie
    format: bug-fix
    question: |-
      Un appelant a vidé la liste des administrateurs :
      ```java
      public List<Utilisateur> administrateurs() {
          return administrateurs;
      }
      // ailleurs : groupe.administrateurs().clear();
      ```
    answer: |-
      ```java
      public List<Utilisateur> administrateurs() {
          return List.copyOf(administrateurs);
      }
      ```
      L'accesseur rendait la liste interne. Une copie immuable (ou une vue non modifiable) empêche l'appelant de la
      modifier.
  - key: bug-ordre-validation
    format: bug-fix
    question: |-
      Une revue de sécurité signale ce constructeur :
      ```java
      Periode(Date debut, Date fin) {
          if (debut.after(fin)) throw new IllegalArgumentException();
          this.debut = new Date(debut.getTime());
          this.fin = new Date(fin.getTime());
      }
      ```
    answer: |-
      ```java
      Periode(Date debut, Date fin) {
          this.debut = new Date(debut.getTime());
          this.fin = new Date(fin.getTime());
          if (this.debut.after(this.fin)) throw new IllegalArgumentException();
      }
      ```
      Entre la validation et la copie, un autre thread peut modifier `debut` ou `fin`. On copie d'abord et on valide les
      copies. (Avec `Instant`, immuable, le problème disparaît.)
  - key: bug-vue-entree
    format: bug-fix
    question: |-
      L'ensemble des droits d'un rôle change quand l'appelant modifie son ensemble après la création :
      ```java
      Role(Set<Droit> droits) {
          this.droits = Collections.unmodifiableSet(droits);
      }
      ```
    answer: |-
      ```java
      Role(Set<Droit> droits) {
          this.droits = Set.copyOf(droits);
      }
      ```
      Une vue non modifiable empêche le rôle de modifier l'ensemble, mais pas l'appelant, qui garde l'original. En
      entrée, il faut une vraie copie.
