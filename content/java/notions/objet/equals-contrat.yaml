notion: equals-contrat
lesson: |-
  Redéfinir `equals`, c'est dire quand deux objets **distincts** représentent la **même valeur**. Les collections
  (`contains`, `remove`, `HashSet`, `HashMap`) s'appuient sur le **contrat** d'`equals`, pour tout `x`, `y`, `z` non
  nuls :

  1. **réflexivité** : `x.equals(x)` ;
  2. **symétrie** : `x.equals(y)` si et seulement si `y.equals(x)` ;
  3. **transitivité** : si `x.equals(y)` et `y.equals(z)`, alors `x.equals(z)` ;
  4. **cohérence** : le résultat ne change pas tant que les objets ne changent pas ;
  5. **`x.equals(null)` vaut `false`**, sans exception.

  ```java
  @Override
  public boolean equals(Object autre) {               // paramètre Object, sinon c'est une surcharge
      if (this == autre) return true;                  // raccourci
      if (!(autre instanceof Client c)) return false;  // écarte null et les autres types
      return email.equals(c.email)
              && Objects.equals(telephone, c.telephone);   // champ qui peut être null
  }
  // et hashCode, sur les mêmes champs
  ```

  - On compare les champs **significatifs** ; `Double.compare` pour les décimaux, `Objects.equals` pour les champs
    qui peuvent valoir `null`, `Arrays.equals` pour les tableaux.
  - Redéfinir `equals` impose de redéfinir **`hashCode`** avec.
  - Un **record** génère `equals` et `hashCode` sur tous ses composants.

  **Piège classique** : la symétrie cassée par une comparaison avec un autre type. Si `Nom.equals(String)` vaut `true`,
  `String.equals(Nom)` vaudra toujours `false`, et une collection se comportera de façon imprévisible.

  **En entretien** : « Réflexif, symétrique, transitif, cohérent, et faux pour `null` ; paramètre `Object`, `instanceof`,
  les champs significatifs, et `hashCode` redéfini avec. »
cards:
  - key: 5-proprietes-contrat-equals
    format: course
    question: "Quelles sont les cinq propriétés du contrat d'`equals` ?"
    choices:
      - {text: "Réflexivité, symétrie, transitivité, cohérence, et `equals(null)` faux", correct: true}
      - {text: "Réflexivité, symétrie, transitivité, immuabilité, et `equals(null)` vrai", correct: false}
      - {text: "Symétrie, transitivité, cohérence, unicité du hash, et `equals(null)` faux", correct: false}
      - {text: "Réflexivité, symétrie, associativité, cohérence, et `equals(null)` faux", correct: false}
    answer: "Réflexivité, symétrie, transitivité, cohérence (le même résultat tant que rien ne change), et `x.equals(null)` faux. Des objets différents peuvent partager un hash : ce n'est pas une règle d'`equals`."
  - key: symetrie
    format: course
    question: Que signifie la symétrie d'`equals` ?
    choices:
      - {text: "Si `a.equals(b)` est vrai, alors `b.equals(a)` l'est aussi", correct: true}
      - {text: "Si `a.equals(b)` et `b.equals(c)`, alors `a.equals(c)`", correct: false}
      - {text: "`a.equals(a)` est vrai pour tout objet `a` non nul", correct: false}
      - {text: "Si `a.equals(b)`, alors `a.hashCode() == b.hashCode()`", correct: false}
    answer: "Si `a.equals(b)` est vrai, alors `b.equals(a)` doit l'être aussi, et inversement. Les autres choix décrivent la transitivité, la réflexivité et le contrat de `hashCode`."
  - key: champ-null
    format: course
    question: Comment comparer dans `equals` un champ qui peut valoir `null` ?
    choices:
      - {text: "Avec `Objects.equals(a, b)`, qui gère `null` des deux côtés", correct: true}
      - {text: "Avec `a.equals(b)`, qui renvoie `false` si `a` vaut `null`", correct: false}
      - {text: "Avec `a == b`, qui suffit pour comparer tous les objets", correct: false}
      - {text: "Avec `a.hashCode() == b.hashCode()`, plus rapide", correct: false}
    answer: "`Objects.equals(a, b)` gère `null` des deux côtés sans exception ; `a.equals(b)` lève une `NullPointerException` quand `a` vaut `null`."
  - key: hashcode-avec
    format: course
    question: Pourquoi faut-il redéfinir `hashCode` en même temps qu'`equals` ?
    choices:
      - {text: "Deux objets égaux doivent avoir le même hash, sinon `HashSet` ne les retrouve pas", correct: true}
      - {text: "Le compilateur refuse une classe qui redéfinit `equals` sans `hashCode`", correct: false}
      - {text: "`equals` appelle `hashCode` en interne pour comparer les champs", correct: false}
      - {text: "Deux objets différents doivent avoir des hash différents, sinon ils se confondent", correct: false}
    answer: "Deux objets égaux doivent avoir le même hash ; sinon `HashSet` et `HashMap` les rangent dans des cases différentes et ne les retrouvent pas. Le compilateur, lui, ne dit rien."
  - key: vf-equals-null
    format: true-false
    question: "`x.equals(null)` peut lever une `NullPointerException` selon le contrat."
    truth: false
    answer: Le contrat impose de renvoyer `false`.
  - key: vf-parametre
    format: true-false
    question: "`public boolean equals(Client c)` redéfinit `Object.equals`."
    truth: false
    answer: C'est une surcharge ; il faut un paramètre `Object`.
  - key: vf-record
    format: true-false
    question: Un record génère un `equals` qui compare tous ses composants.
    truth: true
    answer: Et un `hashCode` cohérent.
  - key: vf-transitivite
    format: true-false
    question: La transitivité impose que si `a` égale `b` et `b` égale `c`, alors `a` égale `c`.
    truth: true
    answer: C'est l'une des cinq règles du contrat.
  - key: qcm-proprietes
    format: multiple-choice
    question: Lesquelles font partie du contrat d'`equals` ?
    choices:
      - text: "La symétrie"
        correct: true
      - text: "La transitivité"
        correct: true
      - text: "`x.equals(null)` vaut `false`"
        correct: true
      - text: "Deux objets différents ont des `hashCode` différents"
        correct: false
    answer: Des objets différents peuvent avoir le même hash (collision).
  - key: qcm-null-safe
    format: multiple-choice
    question: "Que vaut `Objects.equals(null, null)` ?"
    choices:
      - text: "`true`"
        correct: true
      - text: "`false`"
        correct: false
      - text: "Une `NullPointerException`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Deux `null` sont considérés égaux ; `Objects.equals("a", null)` vaut `false`.
  - key: qcm-decimal
    format: multiple-choice
    question: Comment comparer deux champs `double` dans `equals` ?
    choices:
      - text: "`Double.compare(a, b) == 0`"
        correct: true
      - text: "`a == b`, qui gère tous les cas"
        correct: false
      - text: "`a.equals(b)`"
        correct: false
      - text: "`Math.abs(a - b) < 0.1`"
        correct: false
    answer: '`==` échoue pour `NaN` et confond `0.0` et `-0.0` ; une tolérance casserait la transitivité.'
  - key: qcm-instanceof
    format: multiple-choice
    question: "Que garantit `if (!(autre instanceof Client c)) return false;` au début d'`equals` ?"
    choices:
      - {text: "Qu'on renvoie `false` pour `null` et pour un autre type", correct: true}
      - {text: "Que `autre` est exactement la même instance que `this`", correct: false}
      - {text: "Que `hashCode` reste cohérent avec le résultat d'`equals`", correct: false}
      - {text: "Que tous les champs de `autre` sont différents de `null`", correct: false}
    answer: '`instanceof` vaut `false` pour `null`.'
  - key: trous-object
    format: fill-in
    question: |-
      Complète la signature :
      ```java
      @Override
      public boolean equals(___ autre) { ... }
      ```
    blanks: [[Object]]
    answer: Avec un autre type de paramètre, ce serait une surcharge.
  - key: trous-instanceof
    format: fill-in
    question: |-
      Complète pour écarter `null` et les autres types en une fois :
      ```java
      if (!(autre ___ Client c)) {
          return false;
      }
      ```
    blanks: [[instanceof]]
    answer: Le motif donne aussi `c`, déjà casté.
  - key: trous-objects-equals
    format: fill-in
    question: |-
      Complète pour comparer un champ qui peut valoir `null` :
      ```java
      return Objects.___(telephone, c.telephone);
      ```
    blanks: [[equals]]
    answer: '`Objects.equals` ne lève jamais de `NullPointerException`.'
  - key: trous-identite
    format: fill-in
    question: |-
      Complète le raccourci du début d'`equals` :
      ```java
      if (___ == autre) {
          return true;
      }
      ```
    blanks: [[this]]
    answer: Un objet est toujours égal à lui-même (réflexivité).
  - key: code-symetrie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      final class Nom {
          private final String s;
          Nom(String s) { this.s = s; }
          @Override public boolean equals(Object o) {
              if (o instanceof Nom n) return s.equalsIgnoreCase(n.s);
              if (o instanceof String str) return s.equalsIgnoreCase(str);
              return false;
          }
      }
      Nom n = new Nom("Ada");
      System.out.println(n.equals("ada") + " " + "ada".equals(n));
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : la symétrie est cassée, `Nom` se dit égal à la chaîne mais `String.equals` ne connaît pas `Nom`."
    check:
      output: "true false"
  - key: code-objects-equals
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Objects.equals(null, null) + " " + Objects.equals("a", null) + " " + Objects.equals("a", "a"));
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`false false true`", correct: false}
      - {text: "`true true true`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: "`true false true` : `Objects.equals` considère deux `null` comme égaux, et ne lève jamais de `NullPointerException`."
    check:
      output: "true false true"
  - key: code-nan
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println((Double.NaN == Double.NaN) + " " + Double.valueOf(Double.NaN).equals(Double.NaN));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: '`false true` : `==` suit l''IEEE 754, `Double.equals` respecte la réflexivité.'
    check:
      output: "false true"
  - key: code-record
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Point(int x, int y) { }
      System.out.println(new Point(1, 2).equals(new Point(1, 2)) + " " + new Point(1, 2).equals(new Point(2, 1)));
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : l'`equals` généré par un record compare les composants un à un, dans l'ordre."
    check:
      output: "true false"
  - key: bug-champ-null
    format: bug-fix
    question: |-
      `equals` lève une `NullPointerException` pour un client sans téléphone. Quelle correction est la bonne ?
      ```java
      return email.equals(c.email) && telephone.equals(c.telephone);
      ```
    choices:
      - {text: "Comparer avec `Objects.equals(telephone, c.telephone)`", correct: true}
      - {text: "Comparer `telephone` avec `==` au lieu d'`equals`", correct: false}
      - {text: "Entourer le `return` d'un `try` qui renvoie `false`", correct: false}
      - {text: "Retirer `telephone` d'`equals`, le garder dans `hashCode`", correct: false}
    answer: |-
      ```java
      return email.equals(c.email) && Objects.equals(telephone, c.telephone);
      ```
      `telephone` peut valoir `null` : `Objects.equals` gère ce cas. (`email` étant obligatoire, il est validé dans le
      constructeur.)
  - key: bug-symetrie-string
    format: bug-fix
    question: |-
      `liste.contains("ada")` et `liste.contains(new Nom("ada"))` donnent des résultats incohérents. Quelle correction est la bonne ?
      ```java
      @Override
      public boolean equals(Object o) {
          if (o instanceof String s) return valeur.equalsIgnoreCase(s);
          return o instanceof Nom n && valeur.equalsIgnoreCase(n.valeur);
      }
      ```
    choices:
      - {text: "Ne comparer qu'à un `Nom` : retirer la branche `String`", correct: true}
      - {text: "Ajouter la même branche `String` dans `hashCode`", correct: false}
      - {text: "Remplacer `equalsIgnoreCase` par `equals` partout", correct: false}
      - {text: "Comparer les `toString()`, quel que soit le type", correct: false}
    answer: |-
      ```java
      @Override
      public boolean equals(Object o) {
          return o instanceof Nom n && valeur.equalsIgnoreCase(n.valeur);
      }
      ```
      Un `Nom` ne peut pas se déclarer égal à une `String`, qui ne le lui rendra jamais : la symétrie est cassée. On ne
      compare qu'avec son propre type (et `hashCode` doit alors utiliser la version en minuscules).
  - key: bug-equals-decimal
    format: bug-fix
    question: |-
      Deux mesures `NaN` (non mesurées) ne sont jamais égales, et une liste n'arrive pas à retirer la sienne. Quelle correction est la bonne ?
      ```java
      return autre instanceof Mesure m && valeur == m.valeur;
      ```
    choices:
      - {text: "Comparer avec `Double.compare(valeur, m.valeur) == 0`", correct: true}
      - {text: "Comparer avec `Math.abs(valeur - m.valeur) < 1e-9`", correct: false}
      - {text: "Comparer avec `(float) valeur == (float) m.valeur`", correct: false}
      - {text: "Renvoyer `true` dès que `valeur` vaut `Double.NaN`", correct: false}
    answer: |-
      ```java
      return autre instanceof Mesure m && Double.compare(valeur, m.valeur) == 0;
      ```
      `NaN == NaN` est faux, ce qui casse la réflexivité. `Double.compare` traite `NaN` comme égal à lui-même (et
      distingue `0.0` de `-0.0`, comme `Double.hashCode`).
  - key: bug-equals-sans-hashcode
    format: bug-fix
    question: |-
      Après avoir redéfini `equals`, un `HashSet<Client>` garde toujours des doublons. Pourquoi ?
      ```java
      @Override
      public boolean equals(Object o) {
          return o instanceof Client c && email.equals(c.email);
      }
      ```
    choices:
      - {text: "`hashCode` n'est pas redéfini : deux clients égaux ont des hash différents", correct: true}
      - {text: "`equals` doit prendre un `Client` en paramètre, pas un `Object`", correct: false}
      - {text: "`HashSet` compare toujours avec `==`, jamais avec `equals`", correct: false}
      - {text: "`equals` doit être `final` pour que `HashSet` l'utilise", correct: false}
    answer: |-
      ```java
      @Override
      public int hashCode() {
          return email.hashCode();
      }
      ```
      Sans `hashCode` redéfini, deux clients égaux ont des hash différents et tombent dans des cases différentes du
      `HashSet`, qui n'appelle alors jamais `equals`.
