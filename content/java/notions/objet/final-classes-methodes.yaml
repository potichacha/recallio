notion: final-classes-methodes
lesson: |-
  `final` veut dire « ne peut plus changer », avec un sens propre à chaque cible :

  | Sur | Effet |
  |---|---|
  | une **variable** (locale, paramètre, champ) | affectée **une seule fois** |
  | une **méthode** | ne peut pas être **redéfinie** |
  | une **classe** | ne peut pas être **étendue** (`String`, `Integer`...) |

  ```java
  public final class Montant {          // aucune sous-classe
      private final long centimes;      // affecté une fois, dans le constructeur

      public Montant(long centimes) { this.centimes = centimes; }

      public final String afficher() {  // redondant ici : la classe est déjà final
          return centimes / 100 + " €";
      }
  }
  ```

  - `final` sur une référence fige **la référence**, pas l'objet : une `final List` peut toujours recevoir des
    éléments.
  - Un champ `final` doit être affecté exactement une fois : à la déclaration, dans un bloc d'initialisation ou dans
    **chaque** constructeur.
  - Une classe `final` protège ses invariants : personne ne peut la sous-classer pour changer son comportement. C'est
    une condition des classes immuables.
  - Les classes **scellées** (`sealed`, Java 17) sont l'intermédiaire : on liste les sous-classes permises.

  Ne pas confondre : **`final`** (ne change plus), **`finally`** (bloc toujours exécuté après un `try`) et
  **`finalize`** (méthode appelée avant le GC, dépréciée).

  **Piège classique** : croire que `final List<String> noms` est une liste immuable. Il faut `List.of(...)` ou
  `List.copyOf(...)`.

  **En entretien** : « `final` empêche la réaffectation d'une variable, la redéfinition d'une méthode, l'héritage d'une
  classe ; il ne rend pas un objet immuable. »
cards:
  - key: final-finally-finalize
    format: course
    question: final / finally / finalize ?
    answer: Immutabilité / bloc toujours exécuté / méthode pré-GC dépréciée.
  - key: final-trois-sens
    format: course
    question: Que signifie `final` sur une variable, une méthode, une classe ?
    answer: Variable affectée une seule fois ; méthode non redéfinissable ; classe non extensible.
  - key: final-reference
    format: course
    question: Une `final List<String>` est-elle immuable ?
    answer: "Non : la référence ne peut plus changer, mais la liste peut toujours être modifiée. Pour une liste immuable, `List.of` ou `List.copyOf`."
  - key: pourquoi-classe-final
    format: course
    question: Pourquoi déclarer une classe `final` ?
    answer: Pour empêcher qu'une sous-classe modifie son comportement ou casse ses invariants ; c'est indispensable pour une classe immuable comme `String`.
  - key: vf-string-final
    format: true-false
    question: La classe `String` est `final`.
    truth: true
    answer: On ne peut pas l'étendre, ce qui protège son immuabilité.
  - key: vf-final-immuable
    format: true-false
    question: Un champ `final StringBuilder` ne peut plus être modifié.
    truth: false
    answer: La référence est figée, mais `append` modifie toujours l'objet.
  - key: vf-champ-final-constructeur
    format: true-false
    question: Un champ `final` sans valeur à la déclaration peut être affecté dans le constructeur.
    truth: true
    answer: Il doit l'être exactement une fois dans chaque constructeur.
  - key: vf-methode-final-surcharge
    format: true-false
    question: Une méthode `final` ne peut pas être surchargée.
    truth: false
    answer: Elle ne peut pas être **redéfinie** ; la surcharge (même nom, autres paramètres) reste permise.
  - key: qcm-effets
    format: multiple-choice
    question: Que permet d'empêcher `final` ?
    choices:
      - text: "La réaffectation d'une variable"
        correct: true
      - text: "La redéfinition d'une méthode"
        correct: true
      - text: "L'héritage d'une classe"
        correct: true
      - text: "La modification de l'objet référencé"
        correct: false
    answer: '`final` porte sur la variable, la méthode ou la classe, jamais sur le contenu d''un objet.'
  - key: qcm-classes-final
    format: multiple-choice
    question: Lesquelles de ces classes de la JDK sont `final` ?
    choices:
      - text: "`String`"
        correct: true
      - text: "`Integer`"
        correct: true
      - text: "`ArrayList`"
        correct: false
      - text: "`Object`"
        correct: false
    answer: Les classes immuables de valeur sont `final` ; `ArrayList` et `Object` s'étendent.
  - key: qcm-finally
    format: multiple-choice
    question: Lequel de ces mots désigne un bloc exécuté après un `try`, qu'il y ait eu une exception ou non ?
    choices:
      - text: "`finally`"
        correct: true
      - text: "`final`"
        correct: false
      - text: "`finalize`"
        correct: false
      - text: "`finish`"
        correct: false
    answer: '`finally` ; `finalize` est une méthode dépréciée liée au GC.'
  - key: qcm-sealed
    format: multiple-choice
    question: Quelle option permet d'autoriser **certaines** sous-classes seulement ?
    choices:
      - text: "Une classe `sealed ... permits A, B`"
        correct: true
      - text: "Une classe `final`"
        correct: false
      - text: "Une classe `abstract`"
        correct: false
      - text: "Un constructeur `public`"
        correct: false
    answer: '`final` interdit toute sous-classe ; `sealed` les énumère.'
  - key: code-final-liste
    format: code-output
    question: |-
      ```java
      static void ajouter() {
          final List<String> noms = new ArrayList<>();
          noms.add("Ada");
          noms.add("Alan");
          System.out.println(noms);
      }
      ajouter();
      ```
    answer: '`[Ada, Alan]` : `final` fige la référence, pas le contenu de la liste.'
    check:
      output: "[Ada, Alan]"
  - key: code-classe-final
    format: code-output
    question: |-
      ```java
      final class Montant { }
      class Remise extends Montant { }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `cannot inherit from final Montant`.'
    check:
      # JShell ignore « final » sur une déclaration de premier niveau : on enveloppe les deux classes.
      code: |-
        class Exemple {
            final class Montant { }
            class Remise extends Montant { }
        }
      compiles: false
  - key: code-methode-final
    format: code-output
    question: |-
      ```java
      class Compte {
          final double frais() { return 2.0; }
      }
      class ComptePremium extends Compte {
          double frais() { return 0.0; }
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `frais()` est `final` et ne peut pas être redéfinie.'
    check:
      compiles: false
  - key: code-variable-final
    format: code-output
    question: |-
      ```java
      static int calculer() {
          final int base = 10;
          base = 20;
          return base;
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `cannot assign a value to final variable base`.'
    check:
      compiles: false
  - key: bug-final-pas-immuable
    format: bug-fix
    question: |-
      Les codes pays « constants » sont modifiés par un appelant :
      ```java
      public static final List<String> PAYS = new ArrayList<>(List.of("FR", "BE", "CH"));
      // ailleurs : Config.PAYS.add("XX");
      ```
    answer: |-
      ```java
      public static final List<String> PAYS = List.of("FR", "BE", "CH");
      ```
      `final` empêche seulement de réaffecter `PAYS` ; `List.of` crée une liste immuable, et `add` lève
      `UnsupportedOperationException`.
  - key: bug-final-non-affecte
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable id might not have been initialized`) :
      ```java
      class Client {
          private final String id;
          Client(String id) { this.id = id; }
          Client() { }
      }
      ```
    answer: |-
      ```java
      class Client {
          private final String id;
          Client(String id) { this.id = id; }
          Client() { this(UUID.randomUUID().toString()); }
      }
      ```
      Un champ `final` doit être affecté dans **chaque** constructeur ; déléguer avec `this(...)` règle le cas.
  - key: bug-classe-immuable-extensible
    format: bug-fix
    question: |-
      Une classe « immuable » se retrouve modifiée par une sous-classe :
      ```java
      public class Montant {
          private final long centimes;
          public Montant(long centimes) { this.centimes = centimes; }
          public long centimes() { return centimes; }
      }
      // ailleurs : class MontantVariable extends Montant { long valeur; public long centimes() { return valeur; } }
      ```
    answer: |-
      ```java
      public final class Montant {
          ...
      }
      ```
      Sans `final`, une sous-classe peut redéfinir les accesseurs et se faire passer pour un `Montant` qui change. Une
      classe immuable est `final` (ou un record, qui l'est d'office).
  - key: bug-final-pour-modifier
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot assign a value to final variable total`) :
      ```java
      final int total = 0;
      for (int p : prix) {
          total += p;
      }
      ```
    answer: |-
      ```java
      int total = 0;
      for (int p : prix) {
          total += p;
      }
      ```
      Un accumulateur change à chaque tour : il ne peut pas être `final`.
