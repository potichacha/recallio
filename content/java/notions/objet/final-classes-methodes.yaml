notion: final-classes-methodes
lesson: |-
  `final` veut dire « ne peut plus changer », avec un sens propre à chaque cible :

  | Sur | Effet |
  |---|---|
  | une **variable** (locale, paramètre, champ) | affectée **une seule fois** |
  | une **méthode** | ne peut pas être **redéfinie** |
  | une **classe** | ne peut pas être **étendue** (`String`, `Integer`...) |

  ```java
  public final class Montant {          // aucune sous-classe
      private final long centimes;      // affecté une fois, dans le constructeur

      public Montant(long centimes) { this.centimes = centimes; }

      public final String afficher() {  // redondant ici : la classe est déjà final
          return centimes / 100 + " €";
      }
  }
  ```

  - `final` sur une référence fige **la référence**, pas l'objet : une `final List` peut toujours recevoir des
    éléments.
  - Un champ `final` doit être affecté exactement une fois : à la déclaration, dans un bloc d'initialisation ou dans
    **chaque** constructeur.
  - Une classe `final` protège ses invariants : personne ne peut la sous-classer pour changer son comportement. C'est
    une condition des classes immuables.
  - Les classes **scellées** (`sealed`, Java 17) sont l'intermédiaire : on liste les sous-classes permises.

  Ne pas confondre : **`final`** (ne change plus), **`finally`** (bloc toujours exécuté après un `try`) et
  **`finalize`** (méthode appelée avant le GC, dépréciée).

  **Piège classique** : croire que `final List<String> noms` est une liste immuable. Il faut `List.of(...)` ou
  `List.copyOf(...)`.

  **En entretien** : « `final` empêche la réaffectation d'une variable, la redéfinition d'une méthode, l'héritage d'une
  classe ; il ne rend pas un objet immuable. »
cards:
  - key: final-finally-finalize
    format: course
    question: "Quelle différence entre `final`, `finally` et `finalize` ?"
    choices:
      - {text: "Modificateur qui fige / bloc toujours exécuté / méthode dépréciée appelée avant le GC", correct: true}
      - {text: "Bloc toujours exécuté / modificateur qui fige / méthode dépréciée appelée avant le GC", correct: false}
      - {text: "Modificateur qui fige / méthode dépréciée appelée avant le GC / bloc toujours exécuté", correct: false}
      - {text: "Trois variantes du même mot-clé, qui interdisent chacune de modifier ce qu'elles déclarent", correct: false}
    answer: "`final` fige une variable, une méthode ou une classe ; `finally` est le bloc d'un `try` toujours exécuté ; `finalize` est la méthode, dépréciée, que le GC appelait avant de récupérer un objet."
  - key: final-trois-sens
    format: course
    question: Que signifie `final` sur une variable, une méthode, une classe ?
    choices:
      - {text: "Variable affectée une seule fois ; méthode non redéfinissable ; classe non extensible", correct: true}
      - {text: "Variable constante à la compilation ; méthode non surchargeable ; classe non instanciable", correct: false}
      - {text: "Objet référencé immuable ; méthode non redéfinissable ; classe non instanciable", correct: false}
      - {text: "Variable affectée une seule fois ; méthode `static` implicite ; classe non extensible", correct: false}
    answer: "Variable affectée une seule fois ; méthode non redéfinissable ; classe non extensible. `final` ne rend pas l'objet référencé immuable, et une méthode `final` reste surchargeable."
  - key: final-reference
    format: course
    question: Une `final List<String>` est-elle immuable ?
    choices:
      - {text: "Non : la référence est figée, mais la liste reste modifiable", correct: true}
      - {text: "Oui : `final` interdit d'ajouter ou de retirer des éléments", correct: false}
      - {text: "Oui : son `add` lève une `UnsupportedOperationException`", correct: false}
      - {text: "Non : `final` n'a aucun effet sur une variable de type objet", correct: false}
    answer: "Non : la référence ne peut plus changer, mais la liste peut toujours être modifiée. Pour une liste immuable, `List.of` ou `List.copyOf`."
  - key: pourquoi-classe-final
    format: course
    question: Pourquoi déclarer une classe `final` ?
    choices:
      - {text: "Pour qu'aucune sous-classe ne change son comportement ni ne casse ses invariants", correct: true}
      - {text: "Pour que ses objets soient immuables, même avec des champs non `final`", correct: false}
      - {text: "Pour que ses méthodes s'exécutent plus vite grâce à l'inlining", correct: false}
      - {text: "Pour qu'on ne puisse plus créer d'instance de la classe", correct: false}
    answer: "Pour empêcher qu'une sous-classe modifie son comportement ou casse ses invariants ; c'est indispensable pour une classe immuable comme `String`. `final` seul ne rend pas les objets immuables."
  - key: vf-string-final
    format: true-false
    question: "`String` est déclarée `final` : aucune classe ne peut l'étendre."
    truth: true
    answer: On ne peut pas l'étendre, ce qui protège son immuabilité.
  - key: vf-final-immuable
    format: true-false
    question: Un champ `final StringBuilder` ne peut plus être modifié.
    truth: false
    answer: La référence est figée, mais `append` modifie toujours l'objet.
  - key: vf-champ-final-constructeur
    format: true-false
    question: Un champ `final` sans valeur à la déclaration peut être affecté dans le constructeur.
    truth: true
    answer: Il doit l'être exactement une fois dans chaque constructeur.
  - key: vf-methode-final-surcharge
    format: true-false
    question: Une méthode `final` ne peut pas être surchargée.
    truth: false
    answer: Elle ne peut pas être **redéfinie** ; la surcharge (même nom, autres paramètres) reste permise.
  - key: qcm-effets
    format: multiple-choice
    question: "Lesquelles de ces modifications le mot-clé `final` empêche-t-il ?"
    choices:
      - text: "La réaffectation d'une variable"
        correct: true
      - text: "La redéfinition d'une méthode"
        correct: true
      - text: "L'héritage d'une classe"
        correct: true
      - text: "La modification de l'objet référencé"
        correct: false
    answer: '`final` porte sur la variable, la méthode ou la classe, jamais sur le contenu d''un objet.'
  - key: qcm-classes-final
    format: multiple-choice
    question: Lesquelles de ces classes de la JDK sont `final` ?
    choices:
      - text: "`String`"
        correct: true
      - text: "`Integer`"
        correct: true
      - text: "`ArrayList`"
        correct: false
      - text: "`Object`"
        correct: false
    answer: Les classes immuables de valeur sont `final` ; `ArrayList` et `Object` s'étendent.
  - key: qcm-finally
    format: multiple-choice
    question: Lequel de ces mots désigne un bloc exécuté après un `try`, qu'il y ait eu une exception ou non ?
    choices:
      - text: "`finally`"
        correct: true
      - text: "`final`"
        correct: false
      - text: "`finalize`"
        correct: false
      - text: "`finish`"
        correct: false
    answer: '`finally` ; `finalize` est une méthode dépréciée liée au GC.'
  - key: qcm-sealed
    format: multiple-choice
    question: Quelle option permet d'autoriser **certaines** sous-classes seulement ?
    choices:
      - text: "Une classe `sealed ... permits A, B`"
        correct: true
      - text: "Une classe `final`"
        correct: false
      - text: "Une classe `abstract`"
        correct: false
      - text: "Un constructeur `public`"
        correct: false
    answer: '`final` interdit toute sous-classe ; `sealed` les énumère.'
  - key: code-final-liste
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void ajouter() {
          final List<String> noms = new ArrayList<>();
          noms.add("Ada");
          noms.add("Alan");
          System.out.println(noms);
      }
      ajouter();
      ```
    choices:
      - {text: "`[Ada, Alan]`", correct: true}
      - {text: "`[]`", correct: false}
      - {text: "Ça ne compile pas : `noms` est `final`", correct: false}
      - {text: "Une `UnsupportedOperationException`", correct: false}
    answer: '`[Ada, Alan]` : `final` fige la référence, pas le contenu de la liste.'
    check:
      output: "[Ada, Alan]"
  - key: code-classe-final
    format: code-output
    question: |-
      ```java
      final class Montant { }
      class Remise extends Montant { }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas : `Montant` est `final`", correct: true}
      - {text: "Oui : `final` ne concerne que les champs de la classe", correct: false}
      - {text: "Oui, mais `new Remise()` lève une exception", correct: false}
      - {text: "Oui, avec un simple avertissement du compilateur", correct: false}
    answer: "Non : `cannot inherit from final Montant`. Une classe `final` ne peut pas être étendue."
    check:
      # JShell ignore « final » sur une déclaration de premier niveau : on enveloppe les deux classes.
      code: |-
        class Exemple {
            final class Montant { }
            class Remise extends Montant { }
        }
      compiles: false
  - key: code-methode-final
    format: code-output
    question: |-
      ```java
      class Compte {
          final double frais() { return 2.0; }
      }
      class ComptePremium extends Compte {
          double frais() { return 0.0; }
      }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas : `frais()` est `final`", correct: true}
      - {text: "Oui : `ComptePremium` redéfinit `frais()`", correct: false}
      - {text: "Oui : c'est une surcharge, pas une redéfinition", correct: false}
      - {text: "Oui, mais `frais()` renvoie toujours `2.0`", correct: false}
    answer: "Non : `frais()` est `final` et ne peut pas être redéfinie. La même signature n'est pas une surcharge."
    check:
      compiles: false
  - key: code-variable-final
    format: code-output
    question: |-
      ```java
      static int calculer() {
          final int base = 10;
          base = 20;
          return base;
      }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas : `base` est `final`", correct: true}
      - {text: "Oui, et la méthode renvoie `20`", correct: false}
      - {text: "Oui, et la méthode renvoie `10`", correct: false}
      - {text: "Oui, mais une exception est levée à l'exécution", correct: false}
    answer: 'Non : `cannot assign a value to final variable base`.'
    check:
      compiles: false
  - key: bug-final-pas-immuable
    format: bug-fix
    question: |-
      Les codes pays « constants » sont modifiés par un appelant. Quelle correction est la bonne ?
      ```java
      public static final List<String> PAYS = new ArrayList<>(List.of("FR", "BE", "CH"));
      // ailleurs : Config.PAYS.add("XX");
      ```
    choices:
      - {text: "`List.of(\"FR\", \"BE\", \"CH\")`, une liste immuable", correct: true}
      - {text: "`new LinkedList<>(List.of(\"FR\", \"BE\", \"CH\"))`", correct: false}
      - {text: "`Collections.synchronizedList` autour de la liste", correct: false}
      - {text: "Ajouter `volatile` à la déclaration de `PAYS`", correct: false}
    answer: |-
      ```java
      public static final List<String> PAYS = List.of("FR", "BE", "CH");
      ```
      `final` empêche seulement de réaffecter `PAYS` ; `List.of` crée une liste immuable, et `add` lève
      `UnsupportedOperationException`.
  - key: bug-final-non-affecte
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable id might not have been initialized`). Quelle correction est la bonne ?
      ```java
      class Client {
          private final String id;
          Client(String id) { this.id = id; }
          Client() { }
      }
      ```
    choices:
      - {text: "Faire déléguer `Client()` à l'autre constructeur avec `this(...)`", correct: true}
      - {text: "Retirer `final` du champ `id`, qui vaudra alors `null`", correct: false}
      - {text: "Affecter `id` dans une méthode `init()` appelée par `Client()`", correct: false}
      - {text: "Affecter `id` dans un bloc `static` de la classe", correct: false}
    answer: |-
      ```java
      class Client {
          private final String id;
          Client(String id) { this.id = id; }
          Client() { this(UUID.randomUUID().toString()); }
      }
      ```
      Un champ `final` doit être affecté dans **chaque** constructeur ; déléguer avec `this(...)` règle le cas.
  - key: bug-classe-immuable-extensible
    format: bug-fix
    question: |-
      Une classe « immuable » se retrouve modifiée par une sous-classe. Quelle correction est la bonne ?
      ```java
      public class Montant {
          private final long centimes;
          public Montant(long centimes) { this.centimes = centimes; }
          public long centimes() { return centimes; }
      }
      // ailleurs : class MontantVariable extends Montant { long valeur; public long centimes() { return valeur; } }
      ```
    choices:
      - {text: "Déclarer la classe `final`, ou en faire un record", correct: true}
      - {text: "Déclarer le champ `centimes` `private static final`", correct: false}
      - {text: "Déclarer l'accesseur `centimes()` `protected`", correct: false}
      - {text: "Recopier `centimes` à chaque appel de l'accesseur", correct: false}
    answer: |-
      ```java
      public final class Montant {
          ...
      }
      ```
      Sans `final`, une sous-classe peut redéfinir les accesseurs et se faire passer pour un `Montant` qui change. Une
      classe immuable est `final` (ou un record, qui l'est d'office).
  - key: bug-final-pour-modifier
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot assign a value to final variable total`). Quelle correction est la bonne ?
      ```java
      final int total = 0;
      for (int p : prix) {
          total += p;
      }
      ```
    choices:
      - {text: "Retirer `final` : un accumulateur change à chaque tour", correct: true}
      - {text: "Déclarer aussi `p` `final` dans la boucle", correct: false}
      - {text: "Écrire `total = total + p` au lieu de `total += p`", correct: false}
      - {text: "Déclarer `total` en champ `static final` de la classe", correct: false}
    answer: |-
      ```java
      int total = 0;
      for (int p : prix) {
          total += p;
      }
      ```
      Un accumulateur change à chaque tour : il ne peut pas être `final`.
