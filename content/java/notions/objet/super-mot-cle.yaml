notion: super-mot-cle
lesson: |-
  `super` donne accès à la partie « parent » de l'objet, sous deux formes :

  1. **`super(...)`**, dans un constructeur : appelle un constructeur du parent. Si on ne l'écrit pas, le compilateur
     ajoute `super()` (sans argument), qui doit donc exister.
  2. **`super.methode()`** : appelle la version du parent d'une méthode redéfinie, souvent pour **compléter** son
     comportement plutôt que le remplacer.

  ```java
  class Salarie {
      private final String nom;
      Salarie(String nom) { this.nom = nom; }
      double salaire() { return 2000; }
  }

  class Manager extends Salarie {
      Manager(String nom) {
          super(nom);                       // initialise la partie Salarie
      }
      @Override
      double salaire() {
          return super.salaire() + 500;     // la version du parent, plus une prime
      }
  }
  ```

  - Les constructeurs s'exécutent du haut vers le bas de la hiérarchie : `Object`, puis le parent, puis l'enfant.
  - `super(...)` et `this(...)` ne peuvent pas être appelés tous les deux dans le même constructeur. Jusqu'à Java 24,
    `super(...)` devait être la première instruction ; Java 25 accepte des instructions avant (pour valider les
    arguments), tant qu'elles n'utilisent pas `this` (JEP 513).
  - `super.super.methode()` n'existe pas : on n'atteint que le parent direct.

  **Piège classique** : écrire `salaire()` au lieu de `super.salaire()` dans la redéfinition. La méthode s'appelle
  elle-même à l'infini : `StackOverflowError`.

  **En entretien** : « `super(...)` construit la partie parent, implicitement `super()` si on ne l'écrit pas ;
  `super.m()` appelle la version du parent d'une méthode redéfinie. »
tour:
  - title: super
    text: |-
      `super(…)`, en **première** instruction d'un constructeur, appelle un constructeur du parent ; sans lui, Java
      insère `super()`, qui doit alors exister. Le parent est ainsi toujours initialisé avant l'enfant.

      `super.methode()` appelle la version du parent d'une méthode redéfinie : on étend son comportement au lieu de le
      réécrire.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println(new Employe("Ada", 3000).fiche());
              IO.println(new Manager("Grace", 4000, 500).fiche());
          }
        Employe.java: |-
          public class Employe {
              private final String nom;
              private final double salaire;

              public Employe(String nom, double salaire) {
                  this.nom = nom;
                  this.salaire = salaire;
              }

              public double paie() {
                  return salaire;
              }

              public String fiche() {
                  return nom + " : " + paie();
              }
          }
        Manager.java: |-
          public class Manager extends Employe {
              private final double prime;

              public Manager(String nom, double salaire, double prime) {
                  super(nom, salaire);
                  this.prime = prime;
              }

              @Override
              public double paie() {
                  return super.paie() + prime;
              }
          }
      output: |-
        Ada : 3000.0
        Grace : 4500.0
cards:
  - key: passe-si-parent-constructeur-sans-argument
    format: course
    question: Que se passe-t-il si le parent n'a pas de constructeur sans argument ?
    answer: L'enfant doit appeler explicitement `super(args)`, sinon erreur de compilation.
  - key: super-implicite
    format: course
    question: Que fait le compilateur si un constructeur n'appelle ni `super(...)` ni `this(...)` ?
    answer: Il insère un appel `super()` au constructeur sans argument du parent.
  - key: super-methode
    format: course
    question: À quoi sert `super.methode()` ?
    answer: À appeler la version du parent d'une méthode redéfinie, par exemple pour compléter son résultat au lieu de le réécrire.
  - key: ordre-constructeurs
    format: course
    question: Dans quel ordre s'exécutent les constructeurs d'une hiérarchie `A` ← `B` ← `C` lors de `new C()` ?
    answer: 'Celui de `A` d''abord (après `Object`), puis `B`, puis `C` : chaque constructeur appelle celui de son parent avant d''exécuter son propre corps.'
  - key: vf-super-implicite
    format: true-false
    question: Si l'on n'écrit pas `super(...)`, aucun constructeur du parent n'est appelé.
    truth: false
    answer: "Le compilateur insère `super()` : un constructeur du parent est toujours appelé."
  - key: vf-super-super
    format: true-false
    question: "`super.super.toString()` appelle la méthode du grand-parent."
    truth: false
    answer: Cette syntaxe n'existe pas ; `super` ne désigne que le parent direct.
  - key: vf-this-et-super
    format: true-false
    question: Un constructeur peut appeler à la fois `this(...)` et `super(...)`.
    truth: false
    answer: L'un ou l'autre ; c'est le constructeur appelé par `this(...)` qui appellera `super(...)`.
  - key: vf-ordre
    format: true-false
    question: Le constructeur du parent s'exécute avant le corps du constructeur de l'enfant.
    truth: true
    answer: La partie parent de l'objet est initialisée en premier.
  - key: qcm-appel-parent
    format: multiple-choice
    question: Dans `Manager.salaire()`, comment obtenir le salaire calculé par `Salarie` ?
    choices:
      - text: "`super.salaire()`"
        correct: true
      - text: "`salaire()`"
        correct: false
      - text: "`this.salaire()`"
        correct: false
      - text: "`Salarie.salaire()`"
        correct: false
    answer: '`salaire()` et `this.salaire()` rappellent la version du `Manager` : récursion infinie.'
  - key: qcm-compile
    format: multiple-choice
    question: "`Animal` n'a que `Animal(String nom)`. Quels constructeurs de `Chien extends Animal` compilent ?"
    choices:
      - text: "`Chien() { super(\"Rex\"); }`"
        correct: true
      - text: "`Chien(String nom) { super(nom); }`"
        correct: true
      - text: "`Chien() { }`"
        correct: false
      - text: "`Chien(String nom) { this.nom = nom; }`"
        correct: false
    answer: Sans appel explicite, le compilateur insère `super()`, qui n'existe pas ici.
  - key: qcm-recursion
    format: multiple-choice
    question: "Que se passe-t-il avec `@Override String toString() { return \"Chien \" + toString(); }` ?"
    choices:
      - text: "Une `StackOverflowError` à l'appel"
        correct: true
      - text: "Le `toString` d'`Object` est appelé"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
      - text: "Affiche « Chien » seulement"
        correct: false
    answer: La méthode s'appelle elle-même ; il fallait `super.toString()`.
  - key: qcm-champ-masque
    format: multiple-choice
    question: Si l'enfant déclare un champ `nom` qui masque celui du parent, comment l'enfant lit-il celui du parent ?
    choices:
      - text: "`super.nom`"
        correct: true
      - text: "`this.nom`"
        correct: false
      - text: "`nom`"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: '`super.nom` désigne le champ du parent (masquer un champ reste une mauvaise idée).'
  - key: trous-super-constructeur
    format: fill-in
    question: |-
      Complétez pour transmettre le nom au constructeur d'`Animal` :
      ```java
      Chien(String nom) {
          ___(nom);
      }
      ```
    blanks: [[super]]
    answer: '`super(nom)` appelle `Animal(String)`.'
  - key: trous-super-methode
    format: fill-in
    question: |-
      Complétez pour ajouter une prime au salaire de base :
      ```java
      @Override
      double salaire() {
          return ___.salaire() + 500;
      }
      ```
    blanks: [[super]]
    answer: '`super.salaire()` appelle la version du parent.'
  - key: trous-tostring
    format: fill-in
    question: |-
      Complétez pour compléter la description du parent :
      ```java
      @Override
      public String toString() {
          return super.___() + " [premium]";
      }
      ```
    blanks: [[toString]]
    answer: La redéfinition réutilise le résultat du parent et y ajoute une précision.
  - key: trous-deux-arguments
    format: fill-in
    question: |-
      Complétez pour qu'un carré soit un rectangle de côtés égaux :
      ```java
      class Carre extends Rectangle {
          Carre(int cote) {
              super(cote, ___);
          }
      }
      ```
    blanks: [[cote]]
    answer: Le constructeur de l'enfant choisit les arguments passés au parent.
  - key: code-chaine
    format: code-output
    question: |-
      ```java
      class A { A() { System.out.print("A"); } }
      class B extends A { B() { System.out.print("B"); } }
      class C extends B { C() { System.out.print("C"); } }
      new C();
      ```
    answer: '`ABC` : chaque constructeur appelle d''abord `super()`, implicitement.'
    check:
      output: "ABC"
  - key: code-super-methode
    format: code-output
    question: |-
      ```java
      class Salarie { double salaire() { return 2000; } }
      class Manager extends Salarie {
          @Override double salaire() { return super.salaire() + 500; }
      }
      System.out.println(new Manager().salaire());
      ```
    answer: '`2500.0` : la version du parent, plus la prime.'
    check:
      output: "2500.0"
  - key: code-sans-super-explicite
    format: code-output
    question: |-
      ```java
      class Animal { Animal(String nom) { } }
      class Chien extends Animal { Chien() { } }
      ```
      Ce code compile-t-il ?
    answer: 'Non : le compilateur insère `super()`, mais `Animal` n''a pas de constructeur sans argument.'
    check:
      compiles: false
  - key: code-arguments-parent
    format: code-output
    question: |-
      ```java
      class Forme {
          final String nom;
          Forme(String nom) { this.nom = nom; System.out.print("F"); }
      }
      class Carre extends Forme {
          Carre() { super("carré"); System.out.print(" " + nom); }
      }
      new Carre();
      ```
    answer: '`F carré` : la partie `Forme` est construite d''abord, et son champ est prêt quand le corps de `Carre` s''exécute.'
    check:
      output: "F carré"
  - key: bug-recursion
    format: bug-fix
    question: |-
      `new Manager().salaire()` lève une `StackOverflowError` :
      ```java
      @Override
      double salaire() {
          return salaire() + 500;
      }
      ```
    answer: |-
      ```java
      @Override
      double salaire() {
          return super.salaire() + 500;
      }
      ```
      Sans `super.`, la méthode s'appelle elle-même indéfiniment.
  - key: bug-super-manquant
    format: bug-fix
    question: |-
      Ce code ne compile pas (`constructor Animal in class Animal cannot be applied to given types`) :
      ```java
      class Animal {
          private final String nom;
          Animal(String nom) { this.nom = nom; }
      }
      class Chien extends Animal {
          Chien(String nom) { }
      }
      ```
    answer: |-
      ```java
      class Chien extends Animal {
          Chien(String nom) { super(nom); }
      }
      ```
      Faute d'appel explicite, le compilateur insère `super()`, qui n'existe pas. On transmet le nom au parent.
  - key: bug-champ-redeclare
    format: bug-fix
    question: |-
      `chien.presenter()` affiche « null aboie » :
      ```java
      class Animal {
          protected String nom;
          String presenter() { return nom + " aboie"; }
      }
      class Chien extends Animal {
          protected String nom;
          Chien(String nom) { this.nom = nom; }
      }
      ```
    answer: |-
      ```java
      class Animal {
          private final String nom;
          Animal(String nom) { this.nom = nom; }
          String presenter() { return nom + " aboie"; }
      }
      class Chien extends Animal {
          Chien(String nom) { super(nom); }
      }
      ```
      Le champ redéclaré dans `Chien` masque celui d'`Animal`, que `presenter` lit et qui reste `null`. On garde un
      seul champ, initialisé par `super(nom)`.
  - key: bug-comportement-perdu
    format: bug-fix
    question: |-
      Depuis cette redéfinition, la commande n'est plus enregistrée en base, seulement journalisée :
      ```java
      class CommandeJournalisee extends ServiceCommande {
          @Override
          void enregistrer(Commande c) {
              journal.info("commande {}", c.id());
          }
      }
      ```
    answer: |-
      ```java
      @Override
      void enregistrer(Commande c) {
          super.enregistrer(c);
          journal.info("commande {}", c.id());
      }
      ```
      La redéfinition remplaçait le comportement du parent au lieu de le compléter : `super.enregistrer(c)` le
      conserve. (Un décorateur, par composition, ferait la même chose sans héritage.)
