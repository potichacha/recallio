notion: surcharge-vs-redefinition
lesson: |-
  Deux mécanismes, deux moments de décision :

  | | Surcharge (*overloading*) | Redéfinition (*overriding*) |
  |---|---|---|
  | Où | dans une même classe (ou héritée) | dans une sous-classe |
  | Signature | **paramètres différents** | **mêmes paramètres** |
  | Choisie | à la **compilation**, selon les types **déclarés** des arguments | à l'**exécution**, selon le type **réel** de l'objet |

  ```java
  class Animal { String parler() { return "animal"; } }
  class Chien extends Animal { @Override String parler() { return "chien"; } }

  class Dresseur {
      String saluer(Animal a) { return "Animal:" + a.parler(); }
      String saluer(Chien c)  { return "Chien:" + c.parler(); }
  }

  Animal a = new Chien();
  new Dresseur().saluer(a);   // "Animal:chien"
  ```

  La surcharge a choisi `saluer(Animal)` (le type déclaré de `a`), puis la redéfinition a choisi `Chien.parler()` (le
  type réel). Java ne fait du choix dynamique que sur l'objet **à gauche du point**, jamais sur les arguments.

  **Piège classique** : changer le type d'un paramètre dans une sous-classe en croyant redéfinir. On crée une
  surcharge, et l'appel par le type parent continue d'utiliser l'ancienne méthode. `@Override` le détecte.

  **En entretien** : « La surcharge se résout à la compilation sur les types déclarés des arguments ; la redéfinition à
  l'exécution sur le type réel de l'objet. »
cards:
  - key: overloading-vs-overriding
    format: course
    question: Overloading vs overriding ?
    answer: Surcharge résolue à la compilation selon le type déclaré ; redéfinition résolue à l'exécution selon le type réel.
  - key: dispatch-simple
    format: course
    question: Java choisit-il la méthode selon le type réel des arguments ?
    answer: "Non : seul l'objet sur lequel on appelle la méthode est examiné à l'exécution (*single dispatch*) ; les arguments comptent par leur type déclaré, à la compilation."
  - key: changer-parametre
    format: course
    question: Que se passe-t-il si une sous-classe déclare une méthode de même nom avec un autre type de paramètre ?
    answer: "C'est une surcharge, pas une redéfinition : un appel fait via le type parent continue d'utiliser la méthode du parent."
  - key: list-remove
    format: course
    question: Pourquoi `liste.remove(1)` sur une `List<Integer>` est-il piégeux ?
    answer: "La surcharge choisit `remove(int index)`, plus spécifique que `remove(Object)` : on retire l'élément à l'indice 1, pas la valeur 1. Pour la valeur, `remove(Integer.valueOf(1))`."
  - key: vf-surcharge-execution
    format: true-false
    question: La surcharge à appeler est choisie à l'exécution, selon le type réel des arguments.
    truth: false
    answer: Elle est choisie à la compilation, selon leur type déclaré.
  - key: vf-redefinition-execution
    format: true-false
    question: La version d'une méthode redéfinie est choisie à l'exécution.
    truth: true
    answer: Selon le type réel de l'objet.
  - key: vf-meme-classe
    format: true-false
    question: Une classe peut surcharger une méthode héritée de son parent.
    truth: true
    answer: Ajouter `m(String)` à côté d'un `m(Object)` hérité est une surcharge.
  - key: vf-type-retour
    format: true-false
    question: Deux méthodes qui ne diffèrent que par le type de retour sont deux surcharges valides.
    truth: false
    answer: "Le type de retour ne suffit pas à distinguer deux méthodes : le compilateur refuse."
  - key: qcm-resultat
    format: multiple-choice
    question: "Avec `Object o = \"texte\";` et les surcharges `f(Object)` et `f(String)`, quelle est appelée par `f(o)` ?"
    choices:
      - text: "`f(Object)`"
        correct: true
      - text: "`f(String)`"
        correct: false
      - text: "Les deux"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: La surcharge suit le type déclaré, `Object`.
  - key: qcm-moment
    format: multiple-choice
    question: Qu'est-ce qui est décidé à la compilation ?
    choices:
      - text: "Le choix entre plusieurs surcharges"
        correct: true
      - text: "La version d'une méthode redéfinie"
        correct: false
      - text: "Le type réel d'un objet"
        correct: false
      - text: "La classe chargée à l'exécution"
        correct: false
    answer: Le compilateur fige la signature ; la JVM choisit ensuite l'implémentation.
  - key: qcm-redefinition
    format: multiple-choice
    question: "Le parent a `void definir(int x)`. Laquelle de ces méthodes de l'enfant le **redéfinit** ?"
    choices:
      - text: "`void definir(int valeur)`"
        correct: true
      - text: "`void definir(Integer x)`"
        correct: false
      - text: "`void definir(long x)`"
        correct: false
      - text: "`void definir(int x, int y)`"
        correct: false
    answer: Le nom des paramètres ne compte pas, leurs types oui ; les autres sont des surcharges.
  - key: qcm-remove
    format: multiple-choice
    question: "Avec `List<Integer> l = new ArrayList<>(List.of(10, 20, 30));`, que devient `l` après `l.remove(1)` ?"
    choices:
      - text: "`[10, 30]`"
        correct: true
      - text: "`[20, 30]`"
        correct: false
      - text: "`[10, 20, 30]`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: '`remove(int)` retire l''élément d''indice 1.'
  - key: code-surcharge-et-redefinition
    format: code-output
    question: |-
      ```java
      class Animal { String parler() { return "animal"; } }
      class Chien extends Animal { @Override String parler() { return "chien"; } }
      class Dresseur {
          String saluer(Animal a) { return "Animal:" + a.parler(); }
          String saluer(Chien c) { return "Chien:" + c.parler(); }
      }
      Animal a = new Chien();
      System.out.println(new Dresseur().saluer(a));
      ```
    answer: '`Animal:chien` : la surcharge suit le type déclaré de `a`, la redéfinition son type réel.'
    check:
      output: "Animal:chien"
  - key: code-fausse-redefinition
    format: code-output
    question: |-
      ```java
      class Parent { String m(Object o) { return "Parent"; } }
      class Enfant extends Parent { String m(String s) { return "Enfant"; } }
      Parent p = new Enfant();
      System.out.println(p.m("x"));
      ```
    answer: '`Parent` : `Enfant.m(String)` est une surcharge ; via le type `Parent`, seule `m(Object)` existe.'
    check:
      output: "Parent"
  - key: code-deux-surcharges
    format: code-output
    question: |-
      ```java
      class Parent { String m(Object o) { return "Parent"; } }
      class Enfant extends Parent { String m(String s) { return "Enfant"; } }
      Enfant e = new Enfant();
      System.out.println(e.m("x") + " " + e.m(42));
      ```
    answer: '`Enfant Parent` : via `Enfant`, les deux surcharges existent ; 42 ne peut aller qu''à `m(Object)`.'
    check:
      output: "Enfant Parent"
  - key: code-remove
    format: code-output
    question: |-
      ```java
      List<Integer> l = new ArrayList<>(List.of(10, 20, 1));
      l.remove(1);
      System.out.print(l + " ");
      l.remove(Integer.valueOf(1));
      System.out.println(l);
      ```
    answer: '`[10, 1] [10]` : `remove(int)` retire par indice, `remove(Object)` par valeur.'
    check:
      output: "[10, 1] [10]"
  - key: bug-fausse-redefinition
    format: bug-fix
    question: |-
      Le tarif réduit n'est jamais appliqué quand on passe par le type parent :
      ```java
      class Tarif { double prix(int age) { return 10; } }
      class TarifReduit extends Tarif {
          double prix(Integer age) { return age < 12 ? 5 : 10; }
      }
      Tarif t = new TarifReduit();
      t.prix(8);   // 10
      ```
    answer: |-
      ```java
      class TarifReduit extends Tarif {
          @Override
          double prix(int age) { return age < 12 ? 5 : 10; }
      }
      ```
      Avec `Integer`, c'est une surcharge : via `Tarif`, seule `prix(int)` est visible. `@Override` aurait refusé la
      version fautive.
  - key: bug-surcharge-polymorphe
    format: bug-fix
    question: |-
      Toutes les formes sont dessinées comme des formes génériques :
      ```java
      void dessiner(Forme f) { ... }
      void dessiner(Cercle c) { ... }

      for (Forme f : formes) {
          dessiner(f);   // toujours dessiner(Forme)
      }
      ```
    answer: |-
      ```java
      abstract class Forme { abstract void dessiner(Ecran ecran); }
      class Cercle extends Forme {
          @Override void dessiner(Ecran ecran) { ... }
      }

      for (Forme f : formes) {
          f.dessiner(ecran);
      }
      ```
      La surcharge est choisie à la compilation, sur le type déclaré `Forme`. Pour un choix selon le type réel, il
      faut une méthode redéfinie dans chaque forme (ou un `switch` sur un type scellé).
  - key: bug-remove-indice
    format: bug-fix
    question: |-
      On veut retirer le code d'erreur 404 de la liste, mais on obtient une `IndexOutOfBoundsException` :
      ```java
      List<Integer> codes = new ArrayList<>(List.of(200, 404, 500));
      codes.remove(404);
      ```
    answer: |-
      ```java
      codes.remove(Integer.valueOf(404));
      ```
      `remove(404)` choisit la surcharge `remove(int index)` ; pour retirer une valeur, il faut passer un `Integer`.
  - key: bug-equals-type-parametre
    format: bug-fix
    question: |-
      `liste.contains(new Produit("A1"))` renvoie `false` alors qu'un produit A1 est dans la liste :
      ```java
      class Produit {
          final String code;
          Produit(String code) { this.code = code; }
          boolean equals(Produit autre) { return code.equals(autre.code); }
      }
      ```
    answer: |-
      ```java
      @Override
      public boolean equals(Object autre) {
          return autre instanceof Produit p && code.equals(p.code);
      }

      @Override
      public int hashCode() {
          return code.hashCode();
      }
      ```
      `contains` appelle `equals(Object)` ; la version à paramètre `Produit` est une surcharge qu'il ne voit pas.
