notion: classes-abstraites
lesson: |-
  Une **classe abstraite** (`abstract class`) est une classe **incomplète** : on ne peut pas l'instancier, seulement
  l'étendre. Elle peut déclarer des **méthodes abstraites**, sans corps, que chaque sous-classe concrète doit
  implémenter.

  ```java
  abstract class Boisson {
      private final int temperature;               // un état commun

      protected Boisson(int temperature) {         // un constructeur, appelé par super(...)
          this.temperature = temperature;
      }

      public final String preparer() {             // l'algorithme commun (méthode modèle)
          return "chauffer à " + temperature + "°, " + infuser();
      }

      protected abstract String infuser();         // l'étape qui varie
  }

  class The extends Boisson {
      The() { super(80); }
      @Override protected String infuser() { return "infuser 3 min"; }
  }
  ```

  - Une classe qui a **une** méthode abstraite doit être déclarée `abstract` ; l'inverse n'est pas obligatoire.
  - Une classe abstraite peut avoir des **champs**, des **constructeurs** et des méthodes concrètes : c'est ce qui la
    distingue d'une interface.
  - Une sous-classe concrète doit implémenter **toutes** les méthodes abstraites, sinon elle doit être abstraite
    elle aussi.
  - Usage typique : le patron **méthode modèle** (*template method*), où le parent fixe l'algorithme et les enfants
    fournissent les étapes.

  **Piège classique** : `abstract` et `final` sur la même méthode (ou la même classe). L'un exige une redéfinition,
  l'autre l'interdit : le compilateur refuse.

  **En entretien** : « Une classe abstraite factorise l'état et le code de classes apparentées, et laisse des méthodes
  abstraites à implémenter ; on ne l'instancie jamais directement. »
cards:
  - key: instancier-classe-abstraite
    format: course
    question: Peut-on instancier une classe abstraite ?
    answer: 'Non, mais on peut créer une sous-classe anonyme : `new Abstraite() { ... }`.'
  - key: classe-abstraite-contenir-aucune-methode
    format: course
    question: Une classe abstraite peut-elle ne contenir aucune méthode abstraite ?
    answer: Oui, pour empêcher son instanciation directe.
  - key: classe-non-abstraite-avoir-methode-abstraite
    format: course
    question: Une classe non abstraite peut-elle avoir une méthode abstraite ?
    answer: Non.
  - key: classe-abstraite-avoir-constructeur
    format: course
    question: Une classe abstraite peut-elle avoir un constructeur ?
    answer: Oui, appelé par les sous-classes via super().
  - key: vf-champs
    format: true-false
    question: Une classe abstraite peut avoir des champs d'instance.
    truth: true
    answer: C'est l'une de ses différences avec une interface.
  - key: vf-abstract-final
    format: true-false
    question: Une méthode peut être à la fois `abstract` et `final`.
    truth: false
    answer: '`abstract` exige une redéfinition, `final` l''interdit.'
  - key: vf-sous-classe-incomplete
    format: true-false
    question: Une sous-classe qui n'implémente pas toutes les méthodes abstraites doit être déclarée `abstract`.
    truth: true
    answer: Sinon, le compilateur refuse la classe concrète incomplète.
  - key: vf-methodes-concretes
    format: true-false
    question: Une classe abstraite ne peut contenir que des méthodes abstraites.
    truth: false
    answer: Elle peut mêler méthodes abstraites et concrètes.
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle déclaration d'une méthode abstraite est correcte ?
    choices:
      - text: "`abstract double aire();`"
        correct: true
      - text: "`abstract double aire() { }`"
        correct: false
      - text: "`double aire() = 0;`"
        correct: false
      - text: "`virtual double aire();`"
        correct: false
    answer: Une méthode abstraite n'a pas de corps, juste un point-virgule.
  - key: qcm-contenu
    format: multiple-choice
    question: Que peut contenir une classe abstraite ?
    choices:
      - text: "Des champs d'instance"
        correct: true
      - text: "Un constructeur"
        correct: true
      - text: "Des méthodes concrètes"
        correct: true
      - text: "Un `new` d'elle-même, sans sous-classe"
        correct: false
    answer: Tout ce que contient une classe, plus des méthodes abstraites.
  - key: qcm-methode-modele
    format: multiple-choice
    question: Dans le patron méthode modèle, que contient la classe abstraite ?
    choices:
      - text: "L'algorithme général, avec des étapes abstraites que les sous-classes fournissent"
        correct: true
      - text: "Seulement des constantes"
        correct: false
      - text: "Une méthode `main`"
        correct: false
      - text: "La liste de toutes ses sous-classes"
        correct: false
    answer: La méthode modèle est souvent `final`, pour que l'ordre des étapes ne change pas.
  - key: qcm-anonyme
    format: multiple-choice
    question: Que crée `new Tache() { void executer() { } }` si `Tache` est abstraite ?
    choices:
      - text: "Un objet d'une sous-classe anonyme de `Tache`"
        correct: true
      - text: "Un objet `Tache`, malgré l'abstraction"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
      - text: "Une interface"
        correct: false
    answer: La classe anonyme implémente la méthode abstraite.
  - key: trous-abstract-classe
    format: fill-in
    question: |-
      Complétez pour qu'on ne puisse pas instancier `Forme` directement :
      ```java
      public ___ class Forme {
          abstract double aire();
      }
      ```
    blanks: [[abstract]]
    answer: Une classe qui contient une méthode abstraite doit être `abstract`.
  - key: trous-abstract-methode
    format: fill-in
    question: |-
      Complétez pour obliger chaque sous-classe à fournir son calcul :
      ```java
      abstract class Taxe {
          protected ___ double taux();
      }
      ```
    blanks: [[abstract]]
    answer: Une méthode abstraite n'a pas de corps.
  - key: trous-extends
    format: fill-in
    question: |-
      Complétez pour que `Cercle` soit une forme concrète :
      ```java
      class Cercle ___ Forme {
          @Override double aire() { return Math.PI * r * r; }
      }
      ```
    blanks: [[extends]]
    answer: On étend une classe abstraite avec `extends`.
  - key: trous-super
    format: fill-in
    question: |-
      Complétez pour initialiser l'état porté par la classe abstraite :
      ```java
      class The extends Boisson {
          The() { ___(80); }
      }
      ```
    blanks: [[super]]
    answer: Le constructeur de la classe abstraite s'appelle par `super(...)`.
  - key: code-instancier
    format: code-output
    question: |-
      ```java
      abstract class Forme { }
      Forme f = new Forme();
      ```
      Ce code compile-t-il ?
    answer: 'Non : `Forme is abstract; cannot be instantiated`.'
    check:
      compiles: false
  - key: code-methode-modele
    format: code-output
    question: |-
      ```java
      abstract class Boisson {
          final String preparer() { return chauffer() + ", " + infuser(); }
          private String chauffer() { return "eau chaude"; }
          abstract String infuser();
      }
      class The extends Boisson { String infuser() { return "thé"; } }
      System.out.println(new The().preparer());
      ```
    answer: '`eau chaude, thé` : l''algorithme du parent appelle l''étape fournie par l''enfant.'
    check:
      output: "eau chaude, thé"
  - key: code-anonyme
    format: code-output
    question: |-
      ```java
      abstract class Salut { abstract String dire(); }
      Salut s = new Salut() {
          String dire() { return "coucou"; }
      };
      System.out.println(s.dire());
      ```
    answer: '`coucou` : la classe anonyme est une sous-classe concrète de `Salut`.'
    check:
      output: "coucou"
  - key: code-constructeur
    format: code-output
    question: |-
      ```java
      abstract class Base { Base() { System.out.print("Base "); } }
      class Concrete extends Base { Concrete() { System.out.print("Concrete"); } }
      new Concrete();
      ```
    answer: '`Base Concrete` : le constructeur de la classe abstraite s''exécute pour chaque sous-classe.'
    check:
      output: "Base Concrete"
  - key: bug-methode-non-implementee
    format: bug-fix
    question: |-
      Ce code ne compile pas (`Carre is not abstract and does not override abstract method perimetre()`) :
      ```java
      abstract class Forme {
          abstract double aire();
          abstract double perimetre();
      }
      class Carre extends Forme {
          double cote;
          double aire() { return cote * cote; }
      }
      ```
    answer: |-
      ```java
      class Carre extends Forme {
          double cote;
          @Override double aire() { return cote * cote; }
          @Override double perimetre() { return 4 * cote; }
      }
      ```
      Une classe concrète doit implémenter toutes les méthodes abstraites héritées.
  - key: bug-abstract-final
    format: bug-fix
    question: |-
      Ce code ne compile pas (`illegal combination of modifiers: abstract and final`) :
      ```java
      abstract class Export {
          public final abstract String format();
      }
      ```
    answer: |-
      ```java
      abstract class Export {
          public abstract String format();
      }
      ```
      Une méthode abstraite doit être redéfinie ; `final` l'interdirait. C'est la méthode modèle qui l'appelle qu'on
      rend `final`, pas l'étape abstraite.
  - key: bug-corps-abstrait
    format: bug-fix
    question: |-
      Ce code ne compile pas (`abstract methods cannot have a body`) :
      ```java
      abstract class Animal {
          abstract String cri() { return "..."; }
      }
      ```
    answer: |-
      ```java
      abstract class Animal {
          abstract String cri();
      }
      ```
      Une méthode abstraite n'a pas de corps. Si l'on veut une valeur par défaut, on écrit une méthode concrète, que
      les sous-classes peuvent redéfinir.
  - key: bug-ordre-etapes
    format: bug-fix
    question: |-
      Une sous-classe a redéfini `importer()` et oublie désormais la validation :
      ```java
      abstract class Import {
          void importer(Path p) { lire(p); valider(); enregistrer(); }
          abstract void lire(Path p);
          abstract void valider();
          abstract void enregistrer();
      }
      ```
    answer: |-
      ```java
      abstract class Import {
          final void importer(Path p) { lire(p); valider(); enregistrer(); }
          protected abstract void lire(Path p);
          protected abstract void valider();
          protected abstract void enregistrer();
      }
      ```
      La méthode modèle fixe l'ordre des étapes : `final`, elle ne peut plus être redéfinie, et seules les étapes
      restent ouvertes aux sous-classes.
