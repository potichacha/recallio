notion: classes-abstraites
cards:
  - key: instancier-classe-abstraite
    format: course
    question: Peut-on instancier une classe abstraite ?
    answer: 'Non, mais on peut créer une sous-classe anonyme : `new Abstraite() { ... }`.'
  - key: classe-abstraite-contenir-aucune-methode
    format: course
    question: Une classe abstraite peut-elle ne contenir aucune méthode abstraite ?
    answer: Oui, pour empêcher son instanciation directe.
  - key: classe-non-abstraite-avoir-methode-abstraite
    format: course
    question: Une classe non abstraite peut-elle avoir une méthode abstraite ?
    answer: Non.
  - key: classe-abstraite-avoir-constructeur
    format: course
    question: Une classe abstraite peut-elle avoir un constructeur ?
    answer: Oui, appelé par les sous-classes via super().
