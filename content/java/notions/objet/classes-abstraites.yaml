notion: classes-abstraites
lesson: |-
  Une **classe abstraite** (`abstract class`) est une classe **incomplète** : on ne peut pas l'instancier, seulement
  l'étendre. Elle peut déclarer des **méthodes abstraites**, sans corps, que chaque sous-classe concrète doit
  implémenter.

  ```java
  abstract class Boisson {
      private final int temperature;               // un état commun

      protected Boisson(int temperature) {         // un constructeur, appelé par super(...)
          this.temperature = temperature;
      }

      public final String preparer() {             // l'algorithme commun (méthode modèle)
          return "chauffer à " + temperature + "°, " + infuser();
      }

      protected abstract String infuser();         // l'étape qui varie
  }

  class The extends Boisson {
      The() { super(80); }
      @Override protected String infuser() { return "infuser 3 min"; }
  }
  ```

  - Une classe qui a **une** méthode abstraite doit être déclarée `abstract` ; l'inverse n'est pas obligatoire.
  - Une classe abstraite peut avoir des **champs**, des **constructeurs** et des méthodes concrètes : c'est ce qui la
    distingue d'une interface.
  - Une sous-classe concrète doit implémenter **toutes** les méthodes abstraites, sinon elle doit être abstraite
    elle aussi.
  - Usage typique : le patron **méthode modèle** (*template method*), où le parent fixe l'algorithme et les enfants
    fournissent les étapes.

  **Piège classique** : `abstract` et `final` sur la même méthode (ou la même classe). L'un exige une redéfinition,
  l'autre l'interdit : le compilateur refuse.

  **En entretien** : « Une classe abstraite factorise l'état et le code de classes apparentées, et laisse des méthodes
  abstraites à implémenter ; on ne l'instancie jamais directement. »
tour:
  - title: Les classes abstraites
    text: |-
      Une classe `abstract` ne s'instancie pas : elle sert de base à des sous-classes. Elle peut déclarer des méthodes
      `abstract`, sans corps, que chaque sous-classe concrète **doit** écrire, à côté de méthodes ordinaires qu'elle
      partage.

      C'est le motif de la *méthode patron* : la classe abstraite fixe l'algorithme (`decrit`), et laisse les étapes
      variables (`aire`) à ses sous-classes.
    example:
      files:
        Main.java: |-
          abstract class Forme {
              abstract double aire();

              String decrit() {
                  return getClass().getSimpleName() + String.format(" : %.2f", aire());
              }
          }

          class Carre extends Forme {
              private final double cote;

              Carre(double cote) {
                  this.cote = cote;
              }

              @Override
              double aire() {
                  return cote * cote;
              }
          }

          class Cercle extends Forme {
              private final double rayon;

              Cercle(double rayon) {
                  this.rayon = rayon;
              }

              @Override
              double aire() {
                  return Math.PI * rayon * rayon;
              }
          }

          void main() {
              for (Forme f : List.of(new Carre(2), new Cercle(1))) {
                  IO.println(f.decrit());
              }
          }
      output: |-
        Carre : 4.00
        Cercle : 3.14
cards:
  - key: instancier-classe-abstraite
    format: course
    question: "Peut-on instancier une classe abstraite ?"
    choices:
      - {text: "Non, mais on peut créer une sous-classe anonyme : `new Abstraite() { ... }`", correct: true}
      - {text: "Oui, avec `new`, tant qu'elle n'a aucune méthode abstraite", correct: false}
      - {text: "Oui, mais ses méthodes abstraites lèvent une exception à l'appel", correct: false}
      - {text: "Non, et rien ne permet de l'utiliser sans une sous-classe nommée", correct: false}
    answer: "Non, mais on peut créer une sous-classe anonyme : `new Abstraite() { ... }`, qui fournit les méthodes manquantes."
  - key: classe-abstraite-contenir-aucune-methode
    format: course
    question: "Une classe abstraite peut-elle ne contenir aucune méthode abstraite ?"
    choices:
      - {text: "Oui, pour empêcher qu'on l'instancie directement", correct: true}
      - {text: "Non : le compilateur exige au moins une méthode abstraite", correct: false}
      - {text: "Oui, mais elle devient alors une interface", correct: false}
      - {text: "Non : elle doit alors être déclarée `final`", correct: false}
    answer: "Oui, pour empêcher son instanciation directe ; le compilateur n'exige aucune méthode abstraite."
  - key: classe-non-abstraite-avoir-methode-abstraite
    format: course
    question: "Une classe non abstraite peut-elle avoir une méthode abstraite ?"
    choices:
      - {text: "Non : une classe qui en déclare une doit être `abstract`", correct: true}
      - {text: "Oui, si une sous-classe implémente cette méthode", correct: false}
      - {text: "Oui, et la méthode lève une exception si on l'appelle", correct: false}
      - {text: "Oui, si la méthode abstraite est aussi `static`", correct: false}
    answer: "Non. Une classe qui déclare (ou hérite sans l'implémenter) une méthode abstraite doit être `abstract`."
  - key: classe-abstraite-avoir-constructeur
    format: course
    question: "Une classe abstraite peut-elle avoir un constructeur ?"
    choices:
      - {text: "Oui, appelé par les sous-classes avec `super(...)`", correct: true}
      - {text: "Non, puisqu'on ne peut pas l'instancier", correct: false}
      - {text: "Oui, mais il doit être `public` et sans paramètre", correct: false}
      - {text: "Oui, appelé directement avec `new` sur la classe", correct: false}
    answer: "Oui, appelé par les sous-classes via `super(...)` ; il initialise l'état que porte la classe abstraite."
  - key: vf-champs
    format: true-false
    question: Une classe abstraite peut avoir des champs d'instance.
    truth: true
    answer: C'est l'une de ses différences avec une interface.
  - key: vf-abstract-final
    format: true-false
    question: Une méthode peut être à la fois `abstract` et `final`.
    truth: false
    answer: '`abstract` exige une redéfinition, `final` l''interdit.'
  - key: vf-sous-classe-incomplete
    format: true-false
    question: Une sous-classe qui n'implémente pas toutes les méthodes abstraites doit être déclarée `abstract`.
    truth: true
    answer: Sinon, le compilateur refuse la classe concrète incomplète.
  - key: vf-methodes-concretes
    format: true-false
    question: Une classe abstraite ne peut contenir que des méthodes abstraites.
    truth: false
    answer: Elle peut mêler méthodes abstraites et concrètes.
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle déclaration d'une méthode abstraite est correcte ?
    choices:
      - text: "`abstract double aire();`"
        correct: true
      - text: "`abstract double aire() { }`"
        correct: false
      - text: "`double aire() = 0;`"
        correct: false
      - text: "`virtual double aire();`"
        correct: false
    answer: Une méthode abstraite n'a pas de corps, juste un point-virgule.
  - key: qcm-contenu
    format: multiple-choice
    question: "Lequel de ces éléments une classe abstraite ne peut-elle pas contenir ?"
    choices:
      - {text: "Un `new Forme()` qui l'instancie directement", correct: true}
      - {text: "Des champs d'instance, privés ou protégés", correct: false}
      - {text: "Un constructeur, même avec des paramètres", correct: false}
      - {text: "Des méthodes concrètes, avec leur corps", correct: false}
    answer: |-
      Une classe abstraite contient tout ce que contient une classe (champs, constructeur, méthodes concrètes), plus des
      méthodes abstraites ; mais on ne l'instancie jamais directement.
  - key: qcm-methode-modele
    format: multiple-choice
    question: Dans le patron méthode modèle, que contient la classe abstraite ?
    choices:
      - {text: "L'algorithme général, avec des étapes abstraites que les sous-classes fournissent", correct: true}
      - {text: "Seulement des constantes, partagées par toutes les sous-classes", correct: false}
      - {text: "Une méthode `main` qui lance chaque sous-classe à tour de rôle", correct: false}
      - {text: "La liste de toutes ses sous-classes, pour choisir laquelle instancier", correct: false}
    answer: La méthode modèle est souvent `final`, pour que l'ordre des étapes ne change pas.
  - key: qcm-anonyme
    format: multiple-choice
    question: Que crée `new Tache() { void executer() { } }` si `Tache` est abstraite ?
    choices:
      - text: "Un objet d'une sous-classe anonyme de `Tache`"
        correct: true
      - text: "Un objet `Tache`, malgré l'abstraction"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
      - text: "Une interface"
        correct: false
    answer: La classe anonyme implémente la méthode abstraite.
  - key: trous-abstract-classe
    format: fill-in
    question: |-
      Complète pour qu'on ne puisse pas instancier `Forme` directement :
      ```java
      public ___ class Forme {
          abstract double aire();
      }
      ```
    blanks: [[abstract]]
    answer: Une classe qui contient une méthode abstraite doit être `abstract`.
  - key: trous-abstract-methode
    format: fill-in
    question: |-
      Complète pour obliger chaque sous-classe à fournir son calcul :
      ```java
      abstract class Taxe {
          protected ___ double taux();
      }
      ```
    blanks: [[abstract]]
    answer: Une méthode abstraite n'a pas de corps.
  - key: trous-extends
    format: fill-in
    question: |-
      Complète pour que `Cercle` soit une forme concrète :
      ```java
      class Cercle ___ Forme {
          @Override double aire() { return Math.PI * r * r; }
      }
      ```
    blanks: [[extends]]
    answer: On étend une classe abstraite avec `extends`.
  - key: trous-super
    format: fill-in
    question: |-
      Complète pour initialiser l'état porté par la classe abstraite :
      ```java
      class The extends Boisson {
          The() { ___(80); }
      }
      ```
    blanks: [[super]]
    answer: Le constructeur de la classe abstraite s'appelle par `super(...)`.
  - key: code-instancier
    format: code-output
    question: |-
      ```java
      abstract class Forme { }
      Forme f = new Forme();
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Ça ne compile pas : `Forme` est abstraite", correct: true}
      - {text: "Ça compile : `Forme` n'a aucune méthode abstraite", correct: false}
      - {text: "Ça compile, mais lève une `InstantiationException`", correct: false}
      - {text: "Ça compile et crée une sous-classe anonyme vide", correct: false}
    answer: "Non : `Forme is abstract; cannot be instantiated`, même sans méthode abstraite."
    check:
      compiles: false
  - key: code-methode-modele
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      abstract class Boisson {
          final String preparer() { return chauffer() + ", " + infuser(); }
          private String chauffer() { return "eau chaude"; }
          abstract String infuser();
      }
      class The extends Boisson { String infuser() { return "thé"; } }
      System.out.println(new The().preparer());
      ```
    choices:
      - {text: "`eau chaude, thé`", correct: true}
      - {text: "`thé, eau chaude`", correct: false}
      - {text: "`eau chaude, null`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`eau chaude, thé` : l'algorithme du parent appelle l'étape fournie par l'enfant."
    check:
      output: "eau chaude, thé"
  - key: code-anonyme
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      abstract class Salut { abstract String dire(); }
      Salut s = new Salut() {
          String dire() { return "coucou"; }
      };
      System.out.println(s.dire());
      ```
    choices:
      - {text: "`coucou`", correct: true}
      - {text: "`null`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Une `AbstractMethodError`", correct: false}
    answer: "`coucou` : la classe anonyme est une sous-classe concrète de `Salut`."
    check:
      output: "coucou"
  - key: code-constructeur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      abstract class Base { Base() { System.out.print("Base "); } }
      class Concrete extends Base { Concrete() { System.out.print("Concrete"); } }
      new Concrete();
      ```
    choices:
      - {text: "`Base Concrete`", correct: true}
      - {text: "`Concrete`", correct: false}
      - {text: "`ConcreteBase`", correct: false}
      - {text: "`Base`", correct: false}
    answer: "`Base Concrete` : le constructeur de la classe abstraite s'exécute d'abord, pour chaque sous-classe."
    check:
      output: "Base Concrete"
  - key: bug-methode-non-implementee
    format: bug-fix
    question: |-
      Ce code ne compile pas (`Carre is not abstract and does not override abstract method perimetre()`). Quelle
      correction est la bonne ?
      ```java
      abstract class Forme {
          abstract double aire();
          abstract double perimetre();
      }
      class Carre extends Forme {
          double cote;
          double aire() { return cote * cote; }
      }
      ```
    choices:
      - {text: "Implémenter `perimetre()` dans `Carre`, avec `@Override`", correct: true}
      - {text: "Retirer `abstract` de `perimetre()` dans `Forme`, sans corps", correct: false}
      - {text: "Ajouter `@Override` sur la méthode `aire()` de `Carre`", correct: false}
      - {text: "Déclarer la classe `Carre` en `final`", correct: false}
    answer: |-
      ```java
      class Carre extends Forme {
          double cote;
          @Override double aire() { return cote * cote; }
          @Override double perimetre() { return 4 * cote; }
      }
      ```
      Une classe concrète doit implémenter toutes les méthodes abstraites héritées.
  - key: bug-abstract-final
    format: bug-fix
    question: |-
      Ce code ne compile pas (`illegal combination of modifiers: abstract and final`). Quelle correction est la bonne ?
      ```java
      abstract class Export {
          public final abstract String format();
      }
      ```
    choices:
      - {text: "Retirer `final` : une méthode abstraite doit pouvoir être redéfinie", correct: true}
      - {text: "Retirer `abstract` de la classe `Export`, et garder la méthode", correct: false}
      - {text: "Remplacer `public` par `private` devant la méthode", correct: false}
      - {text: "Ajouter un corps vide `{ }` à `format()`, sans changer les mots-clés", correct: false}
    answer: |-
      ```java
      abstract class Export {
          public abstract String format();
      }
      ```
      Une méthode abstraite doit être redéfinie ; `final` l'interdirait. C'est la méthode modèle qui l'appelle qu'on
      rend `final`, pas l'étape abstraite.
  - key: bug-corps-abstrait
    format: bug-fix
    question: |-
      Ce code ne compile pas (`abstract methods cannot have a body`). Quelle correction est la bonne ?
      ```java
      abstract class Animal {
          abstract String cri() { return "..."; }
      }
      ```
    choices:
      - {text: "Retirer le corps : `abstract String cri();`", correct: true}
      - {text: "Retirer `abstract` de la classe `Animal`", correct: false}
      - {text: "Ajouter `final` à la méthode `cri()`", correct: false}
      - {text: "Remplacer `return \"...\"` par `return null`", correct: false}
    answer: |-
      ```java
      abstract class Animal {
          abstract String cri();
      }
      ```
      Une méthode abstraite n'a pas de corps. Si l'on veut une valeur par défaut, on écrit une méthode concrète, que
      les sous-classes peuvent redéfinir.
  - key: bug-ordre-etapes
    format: bug-fix
    question: |-
      Une sous-classe a redéfini `importer()` et oublie désormais la validation. Quelle correction est la bonne ?
      ```java
      abstract class Import {
          void importer(Path p) { lire(p); valider(); enregistrer(); }
          abstract void lire(Path p);
          abstract void valider();
          abstract void enregistrer();
      }
      ```
    choices:
      - {text: "Déclarer `importer` en `final`, pour que seules les étapes restent ouvertes", correct: true}
      - {text: "Déclarer `valider` en `final`, pour qu'aucune sous-classe ne l'oublie", correct: false}
      - {text: "Déclarer `importer` en `private`, pour la cacher aux sous-classes", correct: false}
      - {text: "Appeler `valider()` une seconde fois dans chaque `enregistrer()`", correct: false}
    answer: |-
      ```java
      abstract class Import {
          final void importer(Path p) { lire(p); valider(); enregistrer(); }
          protected abstract void lire(Path p);
          protected abstract void valider();
          protected abstract void enregistrer();
      }
      ```
      La méthode modèle fixe l'ordre des étapes : `final`, elle ne peut plus être redéfinie, et seules les étapes
      restent ouvertes aux sous-classes. Une étape abstraite ne peut pas être `final`.
