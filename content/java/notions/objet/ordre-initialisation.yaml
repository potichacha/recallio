notion: ordre-initialisation
lesson: |-
  L'initialisation d'une classe et de ses objets suit un ordre précis :

  1. **Une seule fois**, au premier usage de la classe : les champs `static` et les blocs `static { }`, **dans l'ordre
     du texte** (après ceux de la classe parente).
  2. **À chaque `new`** :
     1. le constructeur du parent (`super(...)`, implicite ou explicite), et ainsi de suite jusqu'à `Object` ;
     2. les initialiseurs de champs et les blocs d'instance `{ }`, dans l'ordre du texte ;
     3. le reste du corps du constructeur.

  ```java
  class A {
      static { System.out.print("S"); }   // une fois
      { System.out.print("I"); }          // à chaque objet, avant le constructeur
      A() { System.out.print("C"); }
  }
  new A(); new A();                       // SICIC
  ```

  - Un champ ne peut pas être **lu** par un initialiseur placé avant sa déclaration (`illegal forward reference`).
  - Une exception dans l'initialisation `static` devient une `ExceptionInInitializerError`, et la classe reste
    inutilisable (`NoClassDefFoundError` ensuite).

  **Piège classique** : un champ `static` qui construit une instance avant que les autres champs `static` dont elle a
  besoin soient initialisés : elle les voit à `null`.

  **En entretien** : « D'abord le `static`, une fois ; puis à chaque `new` : le parent, les champs et blocs d'instance
  dans l'ordre du texte, enfin le constructeur. »
cards:
  - key: ordre-initialisation-lors-new-enfant
    format: course
    question: Ordre d'initialisation lors d'un `new Enfant()` ?
    answer: 'Statique parent, statique enfant (une seule fois), puis instance parent (champs, blocs, constructeur), puis instance enfant.'
  - key: blocs-static
    format: course
    question: Quand un bloc `static { }` s'exécute-t-il ?
    answer: Une seule fois, au premier usage de la classe (création d'un objet, appel d'une méthode ou accès à un champ `static`).
  - key: bloc-instance
    format: course
    question: Qu'est-ce qu'un bloc d'initialisation d'instance ?
    answer: Un bloc `{ }` dans la classe, exécuté à chaque création d'objet, après le constructeur parent et avant le corps du constructeur, avec les initialiseurs de champs dans l'ordre du texte.
  - key: exception-static
    format: course
    question: Que se passe-t-il si un bloc `static` lève une exception ?
    answer: Elle est enveloppée dans une `ExceptionInInitializerError` ; la classe reste inutilisable et les usages suivants lèvent `NoClassDefFoundError`.
  - key: vf-static-chaque-objet
    format: true-false
    question: Un bloc `static` s'exécute à chaque création d'objet.
    truth: false
    answer: Il s'exécute une seule fois, au chargement et à l'initialisation de la classe.
  - key: vf-parent-dabord
    format: true-false
    question: Le constructeur du parent s'exécute avant les initialiseurs de champs de l'enfant.
    truth: true
    answer: Les champs de l'enfant sont initialisés juste après le retour de `super(...)`.
  - key: vf-ordre-texte
    format: true-false
    question: Les initialiseurs de champs et les blocs d'instance s'exécutent dans l'ordre où ils sont écrits.
    truth: true
    answer: C'est l'ordre du texte de la classe qui compte.
  - key: vf-avant-constructeur
    format: true-false
    question: Le corps du constructeur s'exécute avant les blocs d'initialisation d'instance.
    truth: false
    answer: Les blocs d'instance et les initialiseurs de champs passent avant le reste du corps du constructeur.
  - key: qcm-ordre
    format: multiple-choice
    question: Lors du premier `new Enfant()`, qu'est-ce qui s'exécute en premier ?
    choices:
      - text: "Les initialisations static du parent"
        correct: true
      - text: "Les initialisations static de l'enfant"
        correct: false
      - text: "Le constructeur de l'enfant"
        correct: false
      - text: "Les blocs d'instance de l'enfant"
        correct: false
    answer: Le parent est initialisé avant l'enfant, et le `static` avant l'instance.
  - key: qcm-forward
    format: multiple-choice
    question: Pourquoi `int a = b + 1; int b = 2;` ne compile-t-il pas dans une classe ?
    choices:
      - text: "`a` lit `b` avant sa déclaration (illegal forward reference)"
        correct: true
      - text: "Un champ ne peut pas dépendre d'un autre"
        correct: false
      - text: "Il faut un bloc `static`"
        correct: false
      - text: "`b` doit être `final`"
        correct: false
    answer: Les initialiseurs s'exécutent dans l'ordre du texte ; le compilateur interdit de lire un champ déclaré plus bas.
  - key: qcm-nombre-executions
    format: multiple-choice
    question: Combien de fois s'exécute un bloc `static` si l'on crée 10 objets de la classe ?
    choices:
      - text: "1"
        correct: true
      - text: "10"
        correct: false
      - text: "11"
        correct: false
      - text: "0"
        correct: false
    answer: Une seule fois, à l'initialisation de la classe.
  - key: qcm-erreur
    format: multiple-choice
    question: Quelle erreur signale une exception levée pendant l'initialisation `static` d'une classe ?
    choices:
      - text: "`ExceptionInInitializerError`"
        correct: true
      - text: "`ClassNotFoundException`"
        correct: false
      - text: "`IllegalStateException`"
        correct: false
      - text: "`StackOverflowError`"
        correct: false
    answer: L'exception d'origine est sa cause (`getCause()`).
  - key: code-static-instance
    format: code-output
    question: |-
      ```java
      class A {
          static { System.out.print("S"); }
          { System.out.print("I"); }
          A() { System.out.print("C"); }
      }
      new A();
      new A();
      ```
    answer: '`SICIC` : le bloc `static` une fois, puis bloc d''instance et constructeur pour chaque objet.'
    check:
      output: "SICIC"
  - key: code-parent-enfant
    format: code-output
    question: |-
      ```java
      class Parent { Parent() { System.out.print("P"); } }
      class Enfant extends Parent {
          String x = trace("x");
          Enfant() { System.out.print("E"); }
          static String trace(String s) { System.out.print(s); return s; }
      }
      new Enfant();
      ```
    answer: '`PxE` : le constructeur parent, puis les champs de l''enfant, puis le corps de son constructeur.'
    check:
      output: "PxE"
  - key: code-ordre-texte
    format: code-output
    question: |-
      ```java
      class B {
          int a = 1;
          { a = 2; }
          int b = a * 10;
      }
      System.out.println(new B().b);
      ```
    answer: '`20` : le bloc s''exécute entre les deux initialiseurs, dans l''ordre du texte.'
    check:
      output: "20"
  - key: code-static-ordre
    format: code-output
    question: |-
      ```java
      class C {
          static int x = 5;
          static { x = x * 2; }
          static int y = x + 1;
      }
      System.out.println(C.y);
      ```
    answer: '`11` : `x` vaut 5, puis 10, puis `y` reçoit 11.'
    check:
      output: "11"
  - key: bug-static-ordre
    format: bug-fix
    question: |-
      `Config.INSTANCE` lève une `NullPointerException` à sa création :
      ```java
      class Config {
          static final Config INSTANCE = new Config();
          static final Map<String, String> DEFAUTS = new HashMap<>();

          private final String langue;
          private Config() { langue = DEFAUTS.getOrDefault("langue", "fr"); }
      }
      ```
    answer: |-
      ```java
      class Config {
          static final Map<String, String> DEFAUTS = new HashMap<>();
          static final Config INSTANCE = new Config();
          ...
      }
      ```
      Les champs `static` s'initialisent dans l'ordre du texte : `INSTANCE` était créé quand `DEFAUTS` valait encore
      `null`. On déclare d'abord ce dont le constructeur a besoin.
  - key: bug-forward-reference
    format: bug-fix
    question: |-
      Ce code ne compile pas (`illegal forward reference`) :
      ```java
      class Prix {
          double ttc = ht * 1.2;
          double ht = 100;
      }
      ```
    answer: |-
      ```java
      class Prix {
          double ht = 100;
          double ttc = ht * 1.2;
      }
      ```
      Un initialiseur ne peut pas lire un champ déclaré plus bas : on suit l'ordre des dépendances.
  - key: bug-static-exception
    format: bug-fix
    question: |-
      Si le fichier manque, toute l'application tombe avec `ExceptionInInitializerError`, puis
      `NoClassDefFoundError` à chaque usage :
      ```java
      class Tarifs {
          static final List<String> LIGNES;
          static {
              try {
                  LIGNES = Files.readAllLines(Path.of("tarifs.csv"));
              } catch (IOException e) {
                  throw new UncheckedIOException(e);
              }
          }
      }
      ```
    answer: |-
      ```java
      class Tarifs {
          private final List<String> lignes;

          Tarifs(Path fichier) throws IOException {
              this.lignes = Files.readAllLines(fichier);
          }
      }
      ```
      Une initialisation `static` qui échoue rend la classe inutilisable pour toujours. Une lecture de fichier se fait
      dans un constructeur ou une méthode, où l'erreur se traite (et où le chemin devient testable).
  - key: bug-champ-oublie
    format: bug-fix
    question: |-
      Selon le constructeur utilisé, `tags.add(...)` lève une `NullPointerException` :
      ```java
      class Article {
          private List<String> tags;
          Article() { tags = new ArrayList<>(); }
          Article(String titre) { this.titre = titre; }
      }
      ```
    answer: |-
      ```java
      class Article {
          private final List<String> tags = new ArrayList<>();
          Article() { }
          Article(String titre) { this.titre = titre; }
      }
      ```
      Un initialiseur de champ s'exécute pour tous les constructeurs : l'initialisation n'est plus oubliée dans l'un
      d'eux.
