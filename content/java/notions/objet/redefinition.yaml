notion: redefinition
lesson: |-
  **Redéfinir** (*override*) une méthode, c'est en donner une nouvelle version dans une sous-classe. À l'exécution,
  c'est la version du **type réel** de l'objet qui s'exécute.

  Règles d'une redéfinition :
  - même **nom** et mêmes **types de paramètres** ;
  - type de retour identique ou **covariant** (un sous-type : `Chat reproduire()` redéfinit `Animal reproduire()`) ;
  - visibilité **égale ou plus large** ;
  - pas de nouvelle exception **vérifiée** plus large (on peut en lever moins, ou des sous-types) ;
  - les méthodes `private`, `static` et `final` ne se redéfinissent pas.

  ```java
  class Point {
      private final int x;
      Point(int x) { this.x = x; }

      @Override                              // le compilateur vérifie qu'on redéfinit bien
      public boolean equals(Object autre) {  // Object, pas Point !
          return autre instanceof Point p && p.x == x;
      }
  }
  ```

  **`@Override`** n'est pas obligatoire, mais transforme une faute (nom mal écrit, mauvais type de paramètre) en erreur
  de compilation, au lieu d'une nouvelle méthode qui ne redéfinit rien.

  **Piège classique** : `public boolean equals(Point p)`. C'est une **surcharge**, pas une redéfinition : `HashSet`,
  `List.contains` et tous ceux qui appellent `equals(Object)` ne la voient jamais.

  **En entretien** : « Redéfinir, c'est même signature, retour covariant, visibilité non réduite, pas d'exception
  vérifiée plus large ; et toujours `@Override`. »
cards:
  - key: redefinir-methode-private
    format: course
    question: Peut-on redéfinir une méthode private ?
    answer: Non, elle n'est pas visible ; une méthode de même signature dans l'enfant est une méthode indépendante.
  - key: type-retour-covariant
    format: course
    question: C'est quoi un type de retour covariant ?
    answer: Une redéfinition peut retourner un sous-type du type de retour du parent.
  - key: reduire-visibilite-redefinition
    format: course
    question: Peut-on réduire la visibilité dans une redéfinition ?
    answer: Non, seulement l'élargir.
  - key: role-override
    format: course
    question: À quoi sert l'annotation `@Override` ?
    answer: Elle demande au compilateur de vérifier que la méthode redéfinit bien une méthode du parent ; une faute de nom ou de paramètre devient une erreur de compilation.
  - key: exceptions-redefinition
    format: course
    question: Quelles exceptions une redéfinition peut-elle déclarer ?
    answer: Les mêmes exceptions vérifiées, des sous-types, moins, ou aucune ; jamais une exception vérifiée nouvelle ou plus large. Les exceptions non vérifiées sont libres.
  - key: vf-override-obligatoire
    format: true-false
    question: Sans `@Override`, une méthode de même signature ne redéfinit pas celle du parent.
    truth: false
    answer: Elle la redéfinit quand même ; l'annotation sert seulement à faire vérifier l'intention.
  - key: vf-equals-point
    format: true-false
    question: "`public boolean equals(Point p)` redéfinit `Object.equals`."
    truth: false
    answer: Le paramètre doit être de type `Object` ; avec `Point`, c'est une surcharge.
  - key: vf-covariant
    format: true-false
    question: Une redéfinition peut renvoyer un sous-type du type de retour d'origine.
    truth: true
    answer: C'est le type de retour covariant (Java 5).
  - key: vf-exception-verifiee
    format: true-false
    question: Une redéfinition peut ajouter `throws IOException` alors que la méthode d'origine ne déclare rien.
    truth: false
    answer: Un appelant qui utilise le type parent ne s'y attendrait pas ; le compilateur refuse.
  - key: qcm-redefinition-valide
    format: multiple-choice
    question: "Le parent déclare `protected Animal creer() throws IOException`. Quelles redéfinitions compilent ?"
    choices:
      - text: "`public Chat creer()`"
        correct: true
      - text: "`protected Animal creer() throws FileNotFoundException`"
        correct: true
      - text: "`private Animal creer()`"
        correct: false
      - text: "`protected Animal creer() throws Exception`"
        correct: false
    answer: On peut élargir la visibilité, renvoyer un sous-type et lever moins ou plus précis ; pas l'inverse.
  - key: qcm-non-redefinissable
    format: multiple-choice
    question: Quelles méthodes ne peuvent pas être redéfinies ?
    choices:
      - text: "Les méthodes `final`"
        correct: true
      - text: "Les méthodes `private`"
        correct: true
      - text: "Les méthodes `static`"
        correct: true
      - text: "Les méthodes `protected`"
        correct: false
    answer: Une méthode `static` peut être masquée, ce qui n'est pas une redéfinition.
  - key: qcm-override-detecte
    format: multiple-choice
    question: Quelle erreur `@Override` permet-il de détecter ?
    choices:
      - text: "Une méthode `hashcode()` écrite au lieu de `hashCode()`"
        correct: true
      - text: "Une boucle infinie dans la méthode"
        correct: false
      - text: "Une `NullPointerException`"
        correct: false
      - text: "Un mauvais nom de variable locale"
        correct: false
    answer: Sans l'annotation, `hashcode()` serait une nouvelle méthode, et `hashCode()` resterait celle d'`Object`.
  - key: qcm-version-executee
    format: multiple-choice
    question: "Avec `Animal a = new Chat();`, quelle version de `a.cri()` s'exécute ?"
    choices:
      - text: "Celle de `Chat`, le type réel"
        correct: true
      - text: "Celle d'`Animal`, le type déclaré"
        correct: false
      - text: "Les deux"
        correct: false
      - text: "Ça dépend de l'ordre des imports"
        correct: false
    answer: Une méthode redéfinie est choisie à l'exécution, selon l'objet.
  - key: trous-override
    format: fill-in
    question: |-
      Complétez pour que le compilateur vérifie la redéfinition :
      ```java
      @___
      public String toString() { return "Point(" + x + ")"; }
      ```
    blanks: [[Override]]
    answer: '`@Override` signale toute faute de signature.'
  - key: trous-equals-object
    format: fill-in
    question: |-
      Complétez le type du paramètre pour redéfinir `equals` :
      ```java
      @Override
      public boolean equals(___ autre) { ... }
      ```
    blanks: [[Object]]
    answer: '`equals` prend un `Object` ; un autre type ferait une surcharge.'
  - key: trous-covariant
    format: fill-in
    question: |-
      Complétez pour que `copier()` d'un `Chat` renvoie directement un `Chat` :
      ```java
      class Chat extends Animal {
          @Override
          ___ copier() { return new Chat(); }
      }
      ```
    blanks: [[Chat]]
    answer: Le type de retour covariant évite un cast chez l'appelant.
  - key: trous-visibilite
    format: fill-in
    question: |-
      Complétez pour implémenter la méthode `double aire();` de l'interface `Forme` :
      ```java
      class Cercle implements Forme {
          @Override
          ___ double aire() { return Math.PI * r * r; }
      }
      ```
    blanks: [[public]]
    answer: "Les méthodes d'interface sont `public` : l'implémentation doit l'être aussi."
  - key: code-override-faute
    format: code-output
    question: |-
      ```java
      class Animal { String cri() { return "..."; } }
      class Chat extends Animal {
          @Override String cris() { return "miaou"; }
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `method does not override or implement a method from a supertype`.'
    check:
      compiles: false
  - key: code-equals-surcharge
    format: code-output
    question: |-
      ```java
      class Point {
          final int x;
          Point(int x) { this.x = x; }
          public boolean equals(Point autre) { return autre.x == x; }
      }
      Object a = new Point(1);
      Object b = new Point(1);
      System.out.println(a.equals(b) + " " + new Point(1).equals(new Point(1)));
      ```
    answer: '`false true` : via `Object`, c''est `Object.equals` qui s''exécute ; `equals(Point)` n''est qu''une surcharge.'
    check:
      output: "false true"
  - key: code-covariant
    format: code-output
    question: |-
      ```java
      class Animal { Animal reproduire() { return new Animal(); } }
      class Chat extends Animal {
          @Override Chat reproduire() { return new Chat(); }
      }
      Chat petit = new Chat().reproduire();
      System.out.println(petit.getClass().getSimpleName());
      ```
    answer: '`Chat` : le type de retour covariant permet d''écrire `Chat petit` sans cast.'
    check:
      output: "Chat"
  - key: code-private-non-redefinie
    format: code-output
    question: |-
      ```java
      class Parent {
          private String nom() { return "parent"; }
          String appeler() { return nom(); }
      }
      class Enfant extends Parent {
          String nom() { return "enfant"; }
      }
      System.out.println(new Enfant().appeler());
      ```
    answer: '`parent` : une méthode `private` n''est pas redéfinie, `Enfant.nom()` est une autre méthode.'
    check:
      output: "parent"
  - key: bug-equals-point
    format: bug-fix
    question: |-
      Un `HashSet<Point>` garde des doublons, alors que `equals` est écrit :
      ```java
      public boolean equals(Point autre) {
          return x == autre.x && y == autre.y;
      }
      ```
    answer: |-
      ```java
      @Override
      public boolean equals(Object autre) {
          return autre instanceof Point p && x == p.x && y == p.y;
      }

      @Override
      public int hashCode() {
          return Objects.hash(x, y);
      }
      ```
      Avec un paramètre `Point`, c'est une surcharge que les collections n'appellent jamais. On redéfinit
      `equals(Object)`, avec `@Override`, et `hashCode` avec.
  - key: bug-hashcode-faute
    format: bug-fix
    question: |-
      Deux clients égaux tombent dans des cases différentes d'une `HashMap` :
      ```java
      public int hashcode() {
          return Objects.hash(email);
      }
      ```
    answer: |-
      ```java
      @Override
      public int hashCode() {
          return Objects.hash(email);
      }
      ```
      `hashcode` (minuscule) est une nouvelle méthode : `hashCode` reste celle d'`Object`. `@Override` aurait signalé la
      faute à la compilation.
  - key: bug-exception-verifiee
    format: bug-fix
    question: |-
      Ce code ne compile pas (`overridden method does not throw IOException`) :
      ```java
      interface Source { String lire(); }

      class SourceFichier implements Source {
          @Override
          public String lire() throws IOException {
              return Files.readString(chemin);
          }
      }
      ```
    answer: |-
      ```java
      @Override
      public String lire() {
          try {
              return Files.readString(chemin);
          } catch (IOException e) {
              throw new UncheckedIOException(e);
          }
      }
      ```
      Une redéfinition ne peut pas ajouter d'exception vérifiée : on l'enveloppe dans une exception non vérifiée (ou
      on fait évoluer le contrat de l'interface).
  - key: bug-visibilite-interface
    format: bug-fix
    question: |-
      Ce code ne compile pas (`attempting to assign weaker access privileges; was public`) :
      ```java
      interface Forme { double aire(); }

      class Carre implements Forme {
          double aire() { return cote * cote; }
      }
      ```
    answer: |-
      ```java
      class Carre implements Forme {
          @Override
          public double aire() { return cote * cote; }
      }
      ```
      La méthode de l'interface est implicitement `public` ; sans modificateur, l'implémentation serait
      package-private, une visibilité réduite.
