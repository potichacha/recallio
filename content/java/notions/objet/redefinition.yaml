notion: redefinition
lesson: |-
  **Redéfinir** (*override*) une méthode, c'est en donner une nouvelle version dans une sous-classe. À l'exécution,
  c'est la version du **type réel** de l'objet qui s'exécute.

  Règles d'une redéfinition :
  - même **nom** et mêmes **types de paramètres** ;
  - type de retour identique ou **covariant** (un sous-type : `Chat reproduire()` redéfinit `Animal reproduire()`) ;
  - visibilité **égale ou plus large** ;
  - pas de nouvelle exception **vérifiée** plus large (on peut en lever moins, ou des sous-types) ;
  - les méthodes `private`, `static` et `final` ne se redéfinissent pas.

  ```java
  class Point {
      private final int x;
      Point(int x) { this.x = x; }

      @Override                              // le compilateur vérifie qu'on redéfinit bien
      public boolean equals(Object autre) {  // Object, pas Point !
          return autre instanceof Point p && p.x == x;
      }
  }
  ```

  **`@Override`** n'est pas obligatoire, mais transforme une faute (nom mal écrit, mauvais type de paramètre) en erreur
  de compilation, au lieu d'une nouvelle méthode qui ne redéfinit rien.

  **Piège classique** : `public boolean equals(Point p)`. C'est une **surcharge**, pas une redéfinition : `HashSet`,
  `List.contains` et tous ceux qui appellent `equals(Object)` ne la voient jamais.

  **En entretien** : « Redéfinir, c'est même signature, retour covariant, visibilité non réduite, pas d'exception
  vérifiée plus large ; et toujours `@Override`. »
tour:
  - title: La redéfinition
    text: |-
      Une sous-classe **redéfinit** (*override*) une méthode de son parent en la réécrivant avec la même signature. À
      l'exécution, c'est la version de l'objet réel qui s'exécute, même à travers une variable du type parent.

      `@Override` demande au compilateur de vérifier qu'on redéfinit bien une méthode : une faute de frappe dans le nom
      devient une erreur, au lieu d'une nouvelle méthode jamais appelée. Une redéfinition ne peut pas restreindre la
      visibilité de la méthode.
    example:
      files:
        Main.java: |-
          class Forme {
              double aire() {
                  return 0;
              }

              String decrit() {
                  return getClass().getSimpleName() + " d'aire " + aire();
              }
          }

          class Carre extends Forme {
              private final double cote;

              Carre(double cote) {
                  this.cote = cote;
              }

              @Override
              double aire() {
                  return cote * cote;
              }
          }

          void main() {
              Forme f = new Carre(3);
              IO.println(f.decrit());
              IO.println(new Forme().decrit());
          }
      output: |-
        Carre d'aire 9.0
        Forme d'aire 0.0
    task:
      instructions: |-
        Ajoute une classe `Cercle`, qui redéfinit `aire` (π × r², avec `Math.PI`), et affiche `new Cercle(1).decrit()` :
        le programme doit afficher `Cercle d'aire 3.141592653589793`.
      starter:
        Main.java: |-
          class Forme {
              double aire() {
                  return 0;
              }

              String decrit() {
                  return getClass().getSimpleName() + " d'aire " + aire();
              }
          }

          void main() {
              IO.println(new Forme().decrit());
          }
      solution:
        Main.java: |-
          class Forme {
              double aire() {
                  return 0;
              }

              String decrit() {
                  return getClass().getSimpleName() + " d'aire " + aire();
              }
          }

          class Cercle extends Forme {
              private final double rayon;

              Cercle(double rayon) {
                  this.rayon = rayon;
              }

              @Override
              double aire() {
                  return Math.PI * rayon * rayon;
              }
          }

          void main() {
              IO.println(new Cercle(1).decrit());
          }
      output: |-
        Cercle d'aire 3.141592653589793
cards:
  - key: redefinir-methode-private
    format: course
    question: "Peut-on redéfinir une méthode `private` ?"
    choices:
      - {text: "Non : l'enfant ne la voit pas ; une méthode de même signature y est indépendante", correct: true}
      - {text: "Oui, à condition d'annoter la méthode de l'enfant avec `@Override`", correct: false}
      - {text: "Oui, mais seulement si l'enfant est dans le même package que le parent", correct: false}
      - {text: "Non, sauf si l'enfant déclare elle aussi sa méthode `private`", correct: false}
    answer: "Non, elle n'est pas visible : une méthode de même signature dans l'enfant est une méthode indépendante. Avec `@Override`, le compilateur refuserait même cette méthode."
  - key: type-retour-covariant
    format: course
    question: "Qu'est-ce qu'un type de retour covariant ?"
    choices:
      - {text: "Une redéfinition qui renvoie un sous-type du type de retour du parent", correct: true}
      - {text: "Une redéfinition qui renvoie un super-type du type de retour du parent", correct: false}
      - {text: "Une surcharge qui ne diffère de l'originale que par son type de retour", correct: false}
      - {text: "Un type de retour générique, déduit à chaque appel par le compilateur", correct: false}
    answer: "Une redéfinition peut renvoyer un sous-type du type de retour du parent : `Chat copier()` redéfinit `Animal copier()`. L'inverse, un type plus large, ne compile pas."
  - key: reduire-visibilite-redefinition
    format: course
    question: Peut-on réduire la visibilité dans une redéfinition ?
    choices:
      - {text: "Non : on peut garder la visibilité ou l'élargir, jamais la réduire", correct: true}
      - {text: "Oui : chaque redéfinition choisit librement sa propre visibilité", correct: false}
      - {text: "Oui, mais seulement de `public` vers `protected`", correct: false}
      - {text: "Non : la visibilité doit rester exactement la même", correct: false}
    answer: "Non, seulement la garder ou l'élargir : un appelant qui voit la méthode par le type parent doit pouvoir l'appeler sur n'importe quel enfant."
  - key: role-override
    format: course
    question: À quoi sert l'annotation `@Override` ?
    choices:
      - {text: "Faire vérifier au compilateur que la méthode redéfinit bien une méthode du parent", correct: true}
      - {text: "Forcer la redéfinition de la méthode dans toutes les sous-classes", correct: false}
      - {text: "Empêcher les sous-classes de redéfinir à nouveau la méthode", correct: false}
      - {text: "Rendre la méthode prioritaire sur celle du parent à l'exécution", correct: false}
    answer: Elle demande au compilateur de vérifier que la méthode redéfinit bien une méthode du parent ; une faute de nom ou de paramètre devient une erreur de compilation.
  - key: exceptions-redefinition
    format: course
    question: Quelles exceptions une redéfinition peut-elle déclarer ?
    choices:
      - {text: "Les mêmes vérifiées, des sous-types, moins ou aucune ; jamais une vérifiée plus large", correct: true}
      - {text: "N'importe lesquelles, tant que la signature et le type de retour restent identiques", correct: false}
      - {text: "Exactement les mêmes exceptions que le parent, ni plus ni moins", correct: false}
      - {text: "Des exceptions vérifiées plus larges, comme `Exception` au lieu d'`IOException`", correct: false}
    answer: Les mêmes exceptions vérifiées, des sous-types, moins, ou aucune ; jamais une exception vérifiée nouvelle ou plus large. Les exceptions non vérifiées sont libres.
  - key: vf-override-obligatoire
    format: true-false
    question: Sans `@Override`, une méthode de même signature ne redéfinit pas celle du parent.
    truth: false
    answer: Elle la redéfinit quand même ; l'annotation sert seulement à faire vérifier l'intention.
  - key: vf-equals-point
    format: true-false
    question: "`public boolean equals(Point p)` redéfinit `Object.equals`."
    truth: false
    answer: Le paramètre doit être de type `Object` ; avec `Point`, c'est une surcharge.
  - key: vf-covariant
    format: true-false
    question: Une redéfinition peut renvoyer un sous-type du type de retour d'origine.
    truth: true
    answer: C'est le type de retour covariant (Java 5).
  - key: vf-exception-verifiee
    format: true-false
    question: Une redéfinition peut ajouter `throws IOException` alors que la méthode d'origine ne déclare rien.
    truth: false
    answer: Un appelant qui utilise le type parent ne s'y attendrait pas ; le compilateur refuse.
  - key: qcm-redefinition-valide
    format: multiple-choice
    question: "Le parent déclare `protected Animal creer() throws IOException`. Lesquelles de ces redéfinitions compilent ?"
    choices:
      - text: "`public Chat creer()`"
        correct: true
      - text: "`protected Animal creer() throws FileNotFoundException`"
        correct: true
      - text: "`private Animal creer()`"
        correct: false
      - text: "`protected Animal creer() throws Exception`"
        correct: false
    answer: On peut élargir la visibilité, renvoyer un sous-type et lever moins ou plus précis ; pas l'inverse.
  - key: qcm-non-redefinissable
    format: multiple-choice
    question: "Laquelle de ces méthodes une sous-classe peut-elle redéfinir ?"
    choices:
      - {text: "Une méthode `final`", correct: false}
      - {text: "Une méthode `private`", correct: false}
      - {text: "Une méthode `static`", correct: false}
      - {text: "Une méthode `protected`", correct: true}
    answer: "Une méthode `protected` se redéfinit, en gardant ou en élargissant sa visibilité. `final` l'interdit, `private` est invisible de l'enfant, et une méthode `static` est masquée, ce qui n'est pas une redéfinition."
  - key: qcm-override-detecte
    format: multiple-choice
    question: Quelle erreur `@Override` permet-il de détecter ?
    choices:
      - {text: "Une méthode `hashcode()` écrite au lieu de `hashCode()`", correct: true}
      - {text: "Une boucle infinie dans le corps de la méthode redéfinie", correct: false}
      - {text: "Une `NullPointerException` levée par la méthode du parent", correct: false}
      - {text: "Un mauvais nom de variable locale dans la méthode", correct: false}
    answer: Sans l'annotation, `hashcode()` serait une nouvelle méthode, et `hashCode()` resterait celle d'`Object`.
  - key: qcm-version-executee
    format: multiple-choice
    question: "Avec `Animal a = new Chat();`, quelle version de `a.cri()` s'exécute ?"
    choices:
      - text: "Celle de `Chat`, le type réel"
        correct: true
      - text: "Celle d'`Animal`, le type déclaré"
        correct: false
      - text: "Les deux"
        correct: false
      - text: "Ça dépend de l'ordre des imports"
        correct: false
    answer: Une méthode redéfinie est choisie à l'exécution, selon l'objet.
  - key: trous-override
    format: fill-in
    question: |-
      Complète pour que le compilateur vérifie la redéfinition :
      ```java
      @___
      public String toString() { return "Point(" + x + ")"; }
      ```
    blanks: [[Override]]
    answer: '`@Override` signale toute faute de signature.'
  - key: trous-equals-object
    format: fill-in
    question: |-
      Complète le type du paramètre pour redéfinir `equals` :
      ```java
      @Override
      public boolean equals(___ autre) { ... }
      ```
    blanks: [[Object]]
    answer: '`equals` prend un `Object` ; un autre type ferait une surcharge.'
  - key: trous-covariant
    format: fill-in
    question: |-
      Complète pour que `copier()` d'un `Chat` renvoie directement un `Chat` :
      ```java
      class Chat extends Animal {
          @Override
          ___ copier() { return new Chat(); }
      }
      ```
    blanks: [[Chat]]
    answer: Le type de retour covariant évite un cast chez l'appelant.
  - key: trous-visibilite
    format: fill-in
    question: |-
      Complète pour implémenter la méthode `double aire();` de l'interface `Forme` :
      ```java
      class Cercle implements Forme {
          @Override
          ___ double aire() { return Math.PI * r * r; }
      }
      ```
    blanks: [[public]]
    answer: "Les méthodes d'interface sont `public` : l'implémentation doit l'être aussi."
  - key: code-override-faute
    format: code-output
    question: |-
      ```java
      class Animal { String cri() { return "..."; } }
      class Chat extends Animal {
          @Override String cris() { return "miaou"; }
      }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Oui, sans erreur ni avertissement", correct: false}
      - {text: "Oui, avec un simple avertissement", correct: false}
      - {text: "Oui : `@Override` renomme `cris` en `cri`", correct: false}
    answer: "Non : `method does not override or implement a method from a supertype`. Sans `@Override`, `cris` serait une nouvelle méthode, et la faute passerait inaperçue."
    check:
      compiles: false
  - key: code-equals-surcharge
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Point {
          final int x;
          Point(int x) { this.x = x; }
          public boolean equals(Point autre) { return autre.x == x; }
      }
      Object a = new Point(1);
      Object b = new Point(1);
      System.out.println(a.equals(b) + " " + new Point(1).equals(new Point(1)));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: '`false true` : via `Object`, c''est `Object.equals` qui s''exécute ; `equals(Point)` n''est qu''une surcharge.'
    check:
      output: "false true"
  - key: code-covariant
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Animal { Animal reproduire() { return new Animal(); } }
      class Chat extends Animal {
          @Override Chat reproduire() { return new Chat(); }
      }
      Chat petit = new Chat().reproduire();
      System.out.println(petit.getClass().getSimpleName());
      ```
    choices:
      - {text: "`Chat`", correct: true}
      - {text: "`Animal`", correct: false}
      - {text: "Ça ne compile pas : il faut caster en `Chat`", correct: false}
      - {text: "Une `ClassCastException`", correct: false}
    answer: '`Chat` : le type de retour covariant permet d''écrire `Chat petit` sans cast.'
    check:
      output: "Chat"
  - key: code-private-non-redefinie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Parent {
          private String nom() { return "parent"; }
          String appeler() { return nom(); }
      }
      class Enfant extends Parent {
          String nom() { return "enfant"; }
      }
      System.out.println(new Enfant().appeler());
      ```
    choices:
      - {text: "`parent`", correct: true}
      - {text: "`enfant`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "Ça ne compile pas : `nom()` est privée", correct: false}
    answer: '`parent` : une méthode `private` n''est pas redéfinie, `Enfant.nom()` est une autre méthode.'
    check:
      output: "parent"
  - key: bug-equals-point
    format: bug-fix
    question: |-
      Un `HashSet<Point>` garde des doublons, alors que `equals` est écrit :
      ```java
      public boolean equals(Point autre) {
          return x == autre.x && y == autre.y;
      }
      ```
      Pourquoi ?
    choices:
      - {text: "`equals(Point)` est une surcharge : `HashSet` appelle `equals(Object)` et `hashCode`", correct: true}
      - {text: "`equals` doit comparer les champs avec `equals`, pas avec `==`", correct: false}
      - {text: "`HashSet` n'utilise jamais `equals`, seulement `==` sur les références", correct: false}
      - {text: "Il manque `final` sur les champs `x` et `y` du point", correct: false}
    answer: |-
      ```java
      @Override
      public boolean equals(Object autre) {
          return autre instanceof Point p && x == p.x && y == p.y;
      }

      @Override
      public int hashCode() {
          return Objects.hash(x, y);
      }
      ```
      Avec un paramètre `Point`, c'est une surcharge que les collections n'appellent jamais. On redéfinit
      `equals(Object)`, avec `@Override`, et `hashCode` avec.
  - key: bug-hashcode-faute
    format: bug-fix
    question: |-
      Deux clients égaux tombent dans des cases différentes d'une `HashMap` :
      ```java
      public int hashcode() {
          return Objects.hash(email);
      }
      ```
      Pourquoi ?
    choices:
      - {text: "`hashcode` en minuscule est une nouvelle méthode : `hashCode` reste celle d'`Object`", correct: true}
      - {text: "`Objects.hash` renvoie un résultat différent à chaque appel", correct: false}
      - {text: "`hashCode` doit combiner tous les champs, pas seulement `email`", correct: false}
      - {text: "Une `HashMap` n'appelle `hashCode` que pour les clés de type `String`", correct: false}
    answer: |-
      ```java
      @Override
      public int hashCode() {
          return Objects.hash(email);
      }
      ```
      `hashcode` (minuscule) est une nouvelle méthode : `hashCode` reste celle d'`Object`. `@Override` aurait signalé la
      faute à la compilation.
  - key: bug-exception-verifiee
    format: bug-fix
    question: |-
      Ce code ne compile pas (`overridden method does not throw IOException`) :
      ```java
      interface Source { String lire(); }

      class SourceFichier implements Source {
          @Override
          public String lire() throws IOException {
              return Files.readString(chemin);
          }
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Attraper l'`IOException` et la relancer dans une `UncheckedIOException`", correct: true}
      - {text: "Déclarer `throws Exception` sur la redéfinition, pour couvrir `IOException`", correct: false}
      - {text: "Retirer `@Override` pour que la clause `throws` soit acceptée", correct: false}
      - {text: "Remplacer `throws IOException` par `throws Throwable` sur `lire()`", correct: false}
    answer: |-
      ```java
      @Override
      public String lire() {
          try {
              return Files.readString(chemin);
          } catch (IOException e) {
              throw new UncheckedIOException(e);
          }
      }
      ```
      Une redéfinition ne peut pas ajouter d'exception vérifiée : on l'enveloppe dans une exception non vérifiée (ou
      on fait évoluer le contrat de l'interface).
  - key: bug-visibilite-interface
    format: bug-fix
    question: |-
      Ce code ne compile pas (`attempting to assign weaker access privileges; was public`) :
      ```java
      interface Forme { double aire(); }

      class Carre implements Forme {
          double aire() { return cote * cote; }
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Déclarer `aire()` `public` dans `Carre`, comme dans l'interface", correct: true}
      - {text: "Déclarer `aire()` `protected` dans l'interface `Forme`", correct: false}
      - {text: "Ajouter `@Override` sans changer la visibilité de `aire()`", correct: false}
      - {text: "Déclarer `aire()` `private` dans `Carre` pour la cacher", correct: false}
    answer: |-
      ```java
      class Carre implements Forme {
          @Override
          public double aire() { return cote * cote; }
      }
      ```
      La méthode de l'interface est implicitement `public` ; sans modificateur, l'implémentation serait
      package-private, une visibilité réduite.
