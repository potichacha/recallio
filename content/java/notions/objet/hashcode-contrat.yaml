notion: hashcode-contrat
lesson: |-
  Les tables de hachage (`HashMap`, `HashSet`) rangent chaque objet dans une **case** choisie d'après son
  `hashCode()`, puis comparent avec `equals` seulement les objets de la même case. D'où le **contrat** :

  1. deux objets **égaux** (`equals`) doivent avoir le **même** `hashCode` ;
  2. deux objets différents **peuvent** avoir le même `hashCode` (une **collision**), mais mieux vaut que ce soit rare ;
  3. `hashCode` reste le même tant que les champs utilisés par `equals` ne changent pas.

  ```java
  @Override
  public int hashCode() {
      return Objects.hash(nom, age);        // les MÊMES champs qu'equals
  }

  // équivalent, sans tableau ni boxing :
  @Override
  public int hashCode() {
      int h = nom.hashCode();
      h = 31 * h + Integer.hashCode(age);
      return h;
  }
  ```

  - Oublier `hashCode` : deux objets égaux tombent dans des cases différentes, et `HashSet` garde des doublons.
  - Une **clé mutable** modifiée après insertion change de hash : elle reste dans l'ancienne case et devient
    **introuvable**. Les clés doivent être immuables.
  - Un `hashCode` constant (`return 1;`) respecte le contrat mais met tout dans une case : la table devient lente.
  - Les **records** génèrent `equals` et `hashCode` cohérents.

  **Piège classique** : calculer `hashCode` sur des champs différents de ceux d'`equals` (par exemple l'`id` d'un côté,
  l'`email` de l'autre). Deux objets égaux n'ont plus le même hash.

  **En entretien** : « Égaux implique même hash, l'inverse n'est pas vrai ; `hashCode` utilise les mêmes champs
  qu'`equals`, et une clé de map doit être immuable. »
cards:
  - key: contrat-equals-hashcode
    format: course
    question: Le contrat equals/hashCode ?
    answer: Si equals est vrai, hashCode doit être égal, sinon les collections hash perdent les objets.
  - key: fonctionnement-hashmap
    format: course
    question: Comment une `HashMap` utilise-t-elle `hashCode` et `equals` ?
    answer: Le hash choisit la case ; dans cette case, `equals` identifie la bonne clé. Sans hash cohérent, `equals` n'est même pas appelé sur le bon objet.
  - key: cle-mutable
    format: course
    question: Pourquoi une clé de `HashMap` doit-elle être immuable ?
    answer: "Si un champ utilisé par `hashCode` change après l'insertion, l'objet reste rangé dans l'ancienne case : il devient introuvable, même avec la même référence."
  - key: hash-constant
    format: course
    question: Un `hashCode` qui renvoie toujours 1 est-il valide ?
    answer: "Il respecte le contrat, mais toutes les clés tombent dans la même case : les recherches deviennent linéaires (ou logarithmiques depuis Java 8, avec les arbres), au lieu de constantes."
  - key: vf-differents-hash
    format: true-false
    question: Deux objets différents ont toujours des `hashCode` différents.
    truth: false
    answer: Les collisions sont permises (`"Aa"` et `"BB"` ont le même hash).
  - key: vf-egaux-hash
    format: true-false
    question: Deux objets égaux au sens d'`equals` doivent avoir le même `hashCode`.
    truth: true
    answer: C'est la règle centrale du contrat.
  - key: vf-meme-champs
    format: true-false
    question: "`hashCode` peut utiliser des champs qu'`equals` ignore."
    truth: false
    answer: Deux objets égaux pourraient alors avoir des hash différents ; `hashCode` doit utiliser les champs d'`equals` (ou un sous-ensemble).
  - key: vf-record
    format: true-false
    question: Un record génère un `hashCode` cohérent avec son `equals`.
    truth: true
    answer: Les deux portent sur tous ses composants.
  - key: qcm-oubli
    format: multiple-choice
    question: Que se passe-t-il si l'on redéfinit `equals` sans `hashCode` ?
    choices:
      - text: "Un `HashSet` peut garder deux objets égaux"
        correct: true
      - text: "Le code ne compile pas"
        correct: false
      - text: "`equals` cesse de fonctionner"
        correct: false
      - text: "Rien, `hashCode` est déduit d'`equals`"
        correct: false
    answer: Les deux objets égaux tombent dans des cases différentes.
  - key: qcm-implementation
    format: multiple-choice
    question: Quelles implémentations sont correctes pour un `equals` sur `nom` et `age` ?
    choices:
      - text: "`return Objects.hash(nom, age);`"
        correct: true
      - text: "`return 31 * nom.hashCode() + age;`"
        correct: true
      - text: "`return Objects.hash(nom, age, LocalTime.now());`"
        correct: false
      - text: "`return System.identityHashCode(this);`"
        correct: false
    answer: Le hash doit dépendre des seuls champs d'`equals`, et être stable.
  - key: qcm-cle
    format: multiple-choice
    question: Lesquels de ces types font de bonnes clés de `HashMap` ?
    choices:
      - text: "`String`"
        correct: true
      - text: "Un record aux composants immuables"
        correct: true
      - text: "Une classe mutable dont `hashCode` utilise des champs modifiables"
        correct: false
      - text: "Un tableau `int[]`"
        correct: false
    answer: Un tableau compare les identités, et une clé mutable peut devenir introuvable.
  - key: qcm-collision
    format: multiple-choice
    question: Qu'est-ce qu'une collision de hachage ?
    choices:
      - text: "Deux objets différents qui ont le même `hashCode`"
        correct: true
      - text: "Deux objets égaux qui ont des `hashCode` différents"
        correct: false
      - text: "Une `HashMap` pleine"
        correct: false
      - text: "Une exception levée par `hashCode`"
        correct: false
    answer: Elle est permise ; c'est la seconde situation qui viole le contrat.
  - key: code-aa-hashcode-bb-hashcode
    format: code-output
    question: '`"Aa".hashCode() == "BB".hashCode()` ?'
    answer: '`true` (2112) : collision classique.'
    check:
      code: |-
        System.out.println("Aa".hashCode() == "BB".hashCode());
      output: "true"
  - key: code-sans-hashcode
    format: code-output
    question: |-
      ```java
      class Point {
          final int x;
          Point(int x) { this.x = x; }
          @Override public boolean equals(Object o) { return o instanceof Point p && p.x == x; }
      }
      Set<Point> points = new HashSet<>();
      points.add(new Point(1));
      points.add(new Point(1));
      System.out.println(points.size());
      ```
    answer: '`2` : sans `hashCode` redéfini, les deux points égaux tombent dans des cases différentes.'
    check:
      output: "2"
  - key: code-cle-mutable
    format: code-output
    question: |-
      ```java
      class Cle {
          int v;
          Cle(int v) { this.v = v; }
          @Override public boolean equals(Object o) { return o instanceof Cle c && c.v == v; }
          @Override public int hashCode() { return v; }
      }
      Map<Cle, String> m = new HashMap<>();
      Cle k = new Cle(1);
      m.put(k, "un");
      k.v = 2;
      System.out.println(m.get(k) + " " + m.get(new Cle(1)) + " " + m.size());
      ```
    answer: '`null null 1` : la clé modifiée est rangée sous l''ancien hash ; ni elle ni une clé égale à l''ancienne valeur ne la retrouvent.'
    check:
      output: "null null 1"
  - key: code-record
    format: code-output
    question: |-
      ```java
      record Point(int x, int y) { }
      Set<Point> points = new HashSet<>(List.of(new Point(1, 2)));
      System.out.println(points.contains(new Point(1, 2)));
      ```
    answer: '`true` : le record a un `equals` et un `hashCode` cohérents.'
    check:
      output: "true"
  - key: completer-hashcode-objects-hash
    format: fill-in
    question: |-
      Complétez pour que deux `Point` égaux aient le même hash :
      ```java
      @Override
      public int ___() {
          return Objects.___(x, y);
      }
      ```
    blanks: [[hashCode], [hash]]
    answer: "On redéfinit `hashCode` sur les mêmes champs qu'`equals` ; `Objects.hash` combine leurs hash."
  - key: trous-31
    format: fill-in
    question: |-
      Complétez la combinaison classique de deux champs :
      ```java
      int h = Integer.hashCode(x);
      h = ___ * h + Integer.hashCode(y);
      return h;
      ```
    blanks: [["31"]]
    answer: Un multiplicateur premier impair, qui répartit bien les valeurs et que la JVM optimise (`(h << 5) - h`).
  - key: trous-meme-champ
    format: fill-in
    question: |-
      `equals` compare seulement l'email. Complétez `hashCode` :
      ```java
      @Override
      public int hashCode() {
          return ___.hashCode();
      }
      ```
    blanks: [[email]]
    answer: Le hash utilise les mêmes champs qu'`equals`.
  - key: trous-arrays
    format: fill-in
    question: |-
      Complétez pour hacher un champ tableau selon son contenu :
      ```java
      return Arrays.___(coefficients);
      ```
    blanks: [[hashCode]]
    answer: '`coefficients.hashCode()` dépendrait de l''identité du tableau.'
  - key: bug-champs-differents
    format: bug-fix
    question: |-
      Deux clients égaux ne se retrouvent pas dans une `HashMap` :
      ```java
      @Override public boolean equals(Object o) { return o instanceof Client c && email.equals(c.email); }
      @Override public int hashCode() { return Objects.hash(id, email); }
      ```
    answer: |-
      ```java
      @Override public int hashCode() { return email.hashCode(); }
      ```
      `hashCode` utilisait `id`, qu'`equals` ignore : deux clients de même email mais d'`id` différents étaient égaux
      avec des hash différents.
  - key: bug-cle-mutable
    format: bug-fix
    question: |-
      Après un changement de nom, le joueur devient introuvable dans la table des scores :
      ```java
      class Joueur {
          String nom;
          @Override public boolean equals(Object o) { return o instanceof Joueur j && nom.equals(j.nom); }
          @Override public int hashCode() { return nom.hashCode(); }
      }
      scores.put(joueur, 10);
      joueur.nom = "Ada L.";
      ```
    answer: |-
      ```java
      record IdJoueur(UUID valeur) { }
      Map<IdJoueur, Integer> scores = new HashMap<>();
      scores.put(joueur.id(), 10);
      ```
      Une clé dont le hash change après insertion est perdue. On indexe par une valeur immuable (un identifiant) et non
      par un objet modifiable.
  - key: bug-hash-instable
    format: bug-fix
    question: |-
      Les éléments d'un `HashSet` ne sont jamais retrouvés :
      ```java
      @Override
      public int hashCode() {
          return Objects.hash(code, System.nanoTime());
      }
      ```
    answer: |-
      ```java
      @Override
      public int hashCode() {
          return code.hashCode();
      }
      ```
      Un hash doit être stable : il change ici à chaque appel, donc la recherche ne regarde jamais la bonne case.
  - key: bug-hash-constant
    format: bug-fix
    question: |-
      Une `HashMap` d'un million de produits est très lente, alors que le code « fonctionne » :
      ```java
      @Override
      public int hashCode() {
          return 42;
      }
      ```
    answer: |-
      ```java
      @Override
      public int hashCode() {
          return Objects.hash(reference, fournisseur);
      }
      ```
      Un hash constant respecte le contrat mais met toutes les clés dans la même case : chaque recherche parcourt la
      case. On combine les champs d'`equals` pour bien répartir les clés.
  - key: deux-objets-identiques-sont-consideres
    format: scenario
    question: Deux objets identiques sont considérés différents dans une HashMap. Comment tu investigues ?
    answer: |-
      Je vérifierais d'abord que `equals` et `hashCode` sont redéfinis **tous les deux** et de façon **cohérente** : sur les mêmes champs. Si equals compare l'email mais que hashCode se base sur l'id, deux objets 'égaux' tombent dans des buckets différents et ne se rencontrent jamais.
      Je vérifierais ensuite que les champs utilisés sont **immutables** : si on modifie un champ après insertion, le hashCode change, l'objet reste physiquement dans l'ancien bucket, et il devient introuvable même par lui-même. C'est pour ça qu'une clé de map doit toujours être immutable.
  - key: scenario-hashmap-lente
    format: scenario
    question: Une `HashMap` utilisée comme cache devient lente quand elle grossit. Que vérifies-tu ?
    answer: |-
      La qualité du `hashCode` des clés : un hash constant ou mal réparti (par exemple calculé sur un seul champ qui varie
      peu) entasse les clés dans quelques cases. Je mesure la répartition (nombre de hash distincts sur un échantillon).
      Si les clés sont `Comparable`, Java 8+ transforme les cases surchargées en arbres, ce qui limite les dégâts mais
      ne les supprime pas. Je vérifie aussi que le cache a une limite de taille : une table qui grossit sans fin est une
      fuite, pas un problème de hash.
  - key: scenario-entite-jpa
    format: scenario
    question: Sur quels champs baser `equals` et `hashCode` d'une entité JPA ?
    answer: |-
      Pas sur l'identifiant généré par la base s'il est `null` avant l'enregistrement : le hash changerait au `persist`
      et l'entité se perdrait dans un `HashSet`. Deux options : une **clé métier** immuable (un numéro de commande, un
      ISBN), ou un identifiant **attribué à la création** (un UUID généré dans le constructeur). Avec un id généré par
      la base, la pratique courante est un `equals` sur l'id non nul et un `hashCode` constant par classe, en acceptant
      son coût. Dans tous les cas, jamais de champs mutables ni d'associations paresseuses.
  - key: scenario-expliquer-contrat
    format: scenario
    question: Explique à un junior pourquoi il doit toujours redéfinir `hashCode` avec `equals`.
    answer: |-
      J'explique comment cherche une `HashMap` : elle calcule le hash de la clé pour choisir un tiroir, puis compare avec
      `equals` seulement ce qu'il y a dans ce tiroir. Si deux objets égaux ont des hash différents, ils sont rangés dans
      deux tiroirs, et `equals` n'est jamais appelé entre eux : le `HashSet` garde le doublon, `get` renvoie `null`.
      Ensuite, le geste concret : redéfinir les deux sur les mêmes champs, avec `@Override`, ou utiliser un record ;
      et un test qui met deux objets égaux dans un `HashSet` et vérifie sa taille.
