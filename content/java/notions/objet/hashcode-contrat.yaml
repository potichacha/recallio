notion: hashcode-contrat
lesson: |-
  Les tables de hachage (`HashMap`, `HashSet`) rangent chaque objet dans une **case** choisie d'après son
  `hashCode()`, puis comparent avec `equals` seulement les objets de la même case. D'où le **contrat** :

  1. deux objets **égaux** (`equals`) doivent avoir le **même** `hashCode` ;
  2. deux objets différents **peuvent** avoir le même `hashCode` (une **collision**), mais mieux vaut que ce soit rare ;
  3. `hashCode` reste le même tant que les champs utilisés par `equals` ne changent pas.

  ```java
  @Override
  public int hashCode() {
      return Objects.hash(nom, age);        // les MÊMES champs qu'equals
  }

  // équivalent, sans tableau ni boxing :
  @Override
  public int hashCode() {
      int h = nom.hashCode();
      h = 31 * h + Integer.hashCode(age);
      return h;
  }
  ```

  - Oublier `hashCode` : deux objets égaux tombent dans des cases différentes, et `HashSet` garde des doublons.
  - Une **clé mutable** modifiée après insertion change de hash : elle reste dans l'ancienne case et devient
    **introuvable**. Les clés doivent être immuables.
  - Un `hashCode` constant (`return 1;`) respecte le contrat mais met tout dans une case : la table devient lente.
  - Les **records** génèrent `equals` et `hashCode` cohérents.

  **Piège classique** : calculer `hashCode` sur des champs différents de ceux d'`equals` (par exemple l'`id` d'un côté,
  l'`email` de l'autre). Deux objets égaux n'ont plus le même hash.

  **En entretien** : « Égaux implique même hash, l'inverse n'est pas vrai ; `hashCode` utilise les mêmes champs
  qu'`equals`, et une clé de map doit être immuable. »
cards:
  - key: contrat-equals-hashcode
    format: course
    question: "Que dit le contrat entre `equals` et `hashCode` ?"
    choices:
      - {text: "Deux objets égaux selon `equals` ont forcément le même `hashCode`", correct: true}
      - {text: "Deux objets de même `hashCode` sont forcément égaux selon `equals`", correct: false}
      - {text: "Deux objets différents ont forcément des `hashCode` différents", correct: false}
      - {text: "`hashCode` doit renvoyer l'adresse mémoire de l'objet", correct: false}
    answer: "Si `equals` est vrai, les `hashCode` doivent être égaux, sinon les collections à hachage perdent les objets. L'inverse n'est pas exigé : deux objets différents peuvent partager un hash (une collision)."
  - key: fonctionnement-hashmap
    format: course
    question: Comment une `HashMap` utilise-t-elle `hashCode` et `equals` ?
    choices:
      - {text: "Le hash choisit la case ; dans cette case, `equals` trouve la bonne clé", correct: true}
      - {text: "`equals` choisit la case ; dans cette case, le hash trouve la bonne clé", correct: false}
      - {text: "Seul le hash sert : deux clés de même hash sont la même clé", correct: false}
      - {text: "Seul `equals` sert : la table compare la clé à toutes les autres", correct: false}
    answer: Le hash choisit la case ; dans cette case, `equals` identifie la bonne clé. Sans hash cohérent, `equals` n'est même pas appelé sur le bon objet.
  - key: cle-mutable
    format: course
    question: Pourquoi une clé de `HashMap` doit-elle être immuable ?
    choices:
      - {text: "Si son hash change après l'insertion, elle reste dans l'ancienne case, introuvable", correct: true}
      - {text: "Le compilateur refuse une clé dont les champs ne sont pas `final`", correct: false}
      - {text: "La `HashMap` recopie la clé à l'insertion et perd ses modifications", correct: false}
      - {text: "Une clé modifiée lève une `ConcurrentModificationException` à la lecture", correct: false}
    answer: "Si un champ utilisé par `hashCode` change après l'insertion, l'objet reste rangé dans l'ancienne case : il devient introuvable, même avec la même référence."
  - key: hash-constant
    format: course
    question: Un `hashCode` qui renvoie toujours 1 est-il valide ?
    choices:
      - {text: "Oui, mais toutes les clés tombent dans la même case : les recherches ralentissent", correct: true}
      - {text: "Non : deux objets différents doivent toujours avoir des hash différents", correct: false}
      - {text: "Non : la `HashMap` lève une exception quand deux clés ont le même hash", correct: false}
      - {text: "Oui, et il accélère les recherches : une seule case à regarder pour toutes", correct: false}
    answer: "Il respecte le contrat, mais toutes les clés tombent dans la même case : les recherches deviennent linéaires (ou logarithmiques depuis Java 8, avec les arbres), au lieu de constantes. Des objets différents peuvent partager un hash."
  - key: vf-differents-hash
    format: true-false
    question: Deux objets différents ont toujours des `hashCode` différents.
    truth: false
    answer: Les collisions sont permises (`"Aa"` et `"BB"` ont le même hash).
  - key: vf-egaux-hash
    format: true-false
    question: Deux objets égaux au sens d'`equals` doivent avoir le même `hashCode`.
    truth: true
    answer: C'est la règle centrale du contrat.
  - key: vf-meme-champs
    format: true-false
    question: "`hashCode` peut utiliser des champs qu'`equals` ignore."
    truth: false
    answer: Deux objets égaux pourraient alors avoir des hash différents ; `hashCode` doit utiliser les champs d'`equals` (ou un sous-ensemble).
  - key: vf-record
    format: true-false
    question: Un record génère un `hashCode` cohérent avec son `equals`.
    truth: true
    answer: Les deux portent sur tous ses composants.
  - key: qcm-oubli
    format: multiple-choice
    question: Que se passe-t-il si l'on redéfinit `equals` sans `hashCode` ?
    choices:
      - text: "Un `HashSet` peut garder deux objets égaux"
        correct: true
      - text: "Le code ne compile pas"
        correct: false
      - text: "`equals` cesse de fonctionner"
        correct: false
      - text: "Rien, `hashCode` est déduit d'`equals`"
        correct: false
    answer: Les deux objets égaux tombent dans des cases différentes.
  - key: qcm-implementation
    format: multiple-choice
    question: "`equals` compare `nom` et `age`. Laquelle de ces implémentations de `hashCode` est correcte ?"
    choices:
      - {text: "`return Objects.hash(nom, age);`", correct: true}
      - {text: "`return Objects.hash(nom, age, LocalTime.now());`", correct: false}
      - {text: "`return System.identityHashCode(this);`", correct: false}
      - {text: "`return Objects.hash(id, nom, age);`", correct: false}
    answer: "Le hash doit dépendre des seuls champs d'`equals`, et être stable : `31 * nom.hashCode() + age` conviendrait aussi. L'heure, l'identité de l'objet ou un champ ignoré par `equals` cassent le contrat."
  - key: qcm-cle
    format: multiple-choice
    question: "Lequel de ces types fait une bonne clé de `HashMap` ?"
    choices:
      - {text: "Un record aux composants immuables", correct: true}
      - {text: "Une classe dont `hashCode` lit des champs modifiables", correct: false}
      - {text: "Un tableau `int[]`", correct: false}
      - {text: "Un `StringBuilder`", correct: false}
    answer: "Un record immuable a un `equals` et un `hashCode` cohérents et stables, comme `String`. Un tableau ou un `StringBuilder` comparent les identités, et une clé mutable peut devenir introuvable."
  - key: qcm-collision
    format: multiple-choice
    question: Qu'est-ce qu'une collision de hachage ?
    choices:
      - text: "Deux objets différents qui ont le même `hashCode`"
        correct: true
      - text: "Deux objets égaux qui ont des `hashCode` différents"
        correct: false
      - text: "Une `HashMap` pleine"
        correct: false
      - text: "Une exception levée par `hashCode`"
        correct: false
    answer: Elle est permise ; c'est la seconde situation qui viole le contrat.
  - key: code-aa-hashcode-bb-hashcode
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("Aa".hashCode() == "BB".hashCode());
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`2112`", correct: false}
    answer: "`true` : les deux chaînes ont le hash 2112, une collision classique. Des objets différents peuvent partager un hash."
    check:
      code: |-
        System.out.println("Aa".hashCode() == "BB".hashCode());
      output: "true"
  - key: code-sans-hashcode
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Point {
          final int x;
          Point(int x) { this.x = x; }
          @Override public boolean equals(Object o) { return o instanceof Point p && p.x == x; }
      }
      Set<Point> points = new HashSet<>();
      points.add(new Point(1));
      points.add(new Point(1));
      System.out.println(points.size());
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas : `hashCode` manque", correct: false}
    answer: '`2` : sans `hashCode` redéfini, les deux points égaux tombent dans des cases différentes.'
    check:
      output: "2"
  - key: code-cle-mutable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Cle {
          int v;
          Cle(int v) { this.v = v; }
          @Override public boolean equals(Object o) { return o instanceof Cle c && c.v == v; }
          @Override public int hashCode() { return v; }
      }
      Map<Cle, String> m = new HashMap<>();
      Cle k = new Cle(1);
      m.put(k, "un");
      k.v = 2;
      System.out.println(m.get(k) + " " + m.get(new Cle(1)) + " " + m.size());
      ```
    choices:
      - {text: "`null null 1`", correct: true}
      - {text: "`un null 1`", correct: false}
      - {text: "`null un 1`", correct: false}
      - {text: "`un un 1`", correct: false}
    answer: '`null null 1` : la clé modifiée est rangée sous l''ancien hash ; ni elle ni une clé égale à l''ancienne valeur ne la retrouvent.'
    check:
      output: "null null 1"
  - key: code-record
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Point(int x, int y) { }
      Set<Point> points = new HashSet<>(List.of(new Point(1, 2)));
      System.out.println(points.contains(new Point(1, 2)));
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`[Point[x=1, y=2]]`", correct: false}
    answer: '`true` : le record a un `equals` et un `hashCode` cohérents.'
    check:
      output: "true"
  - key: completer-hashcode-objects-hash
    format: fill-in
    question: |-
      Complète pour que deux `Point` égaux aient le même hash :
      ```java
      @Override
      public int ___() {
          return Objects.___(x, y);
      }
      ```
    blanks: [[hashCode], [hash]]
    answer: "On redéfinit `hashCode` sur les mêmes champs qu'`equals` ; `Objects.hash` combine leurs hash."
  - key: trous-31
    format: fill-in
    question: |-
      Complète la combinaison classique de deux champs :
      ```java
      int h = Integer.hashCode(x);
      h = ___ * h + Integer.hashCode(y);
      return h;
      ```
    blanks: [["31"]]
    answer: Un multiplicateur premier impair, qui répartit bien les valeurs et que la JVM optimise (`(h << 5) - h`).
  - key: trous-meme-champ
    format: fill-in
    question: |-
      `equals` compare seulement l'email. Complète `hashCode` :
      ```java
      @Override
      public int hashCode() {
          return ___.hashCode();
      }
      ```
    blanks: [[email]]
    answer: Le hash utilise les mêmes champs qu'`equals`.
  - key: trous-arrays
    format: fill-in
    question: |-
      Complète pour hacher un champ tableau selon son contenu :
      ```java
      return Arrays.___(coefficients);
      ```
    blanks: [[hashCode]]
    answer: '`coefficients.hashCode()` dépendrait de l''identité du tableau.'
  - key: bug-champs-differents
    format: bug-fix
    question: |-
      Deux clients égaux ne se retrouvent pas dans une `HashMap`. Pourquoi ?
      ```java
      @Override public boolean equals(Object o) { return o instanceof Client c && email.equals(c.email); }
      @Override public int hashCode() { return Objects.hash(id, email); }
      ```
    choices:
      - {text: "`hashCode` utilise `id`, qu'`equals` ignore : deux clients égaux ont des hash différents", correct: true}
      - {text: "`equals` doit aussi comparer `id`, sans quoi il n'est pas symétrique", correct: false}
      - {text: "`HashMap` appelle `equals` avant `hashCode`, qui ne sert donc à rien ici", correct: false}
      - {text: "`Objects.hash` ne sait combiner que des chaînes, pas un identifiant numérique", correct: false}
    answer: |-
      ```java
      @Override public int hashCode() { return email.hashCode(); }
      ```
      `hashCode` utilisait `id`, qu'`equals` ignore : deux clients de même email mais d'`id` différents étaient égaux
      avec des hash différents.
  - key: bug-cle-mutable
    format: bug-fix
    question: |-
      Après un changement de nom, le joueur devient introuvable dans la table des scores. Quelle correction est la bonne ?
      ```java
      class Joueur {
          String nom;
          @Override public boolean equals(Object o) { return o instanceof Joueur j && nom.equals(j.nom); }
          @Override public int hashCode() { return nom.hashCode(); }
      }
      scores.put(joueur, 10);
      joueur.nom = "Ada L.";
      ```
    choices:
      - {text: "Indexer les scores par un identifiant immuable du joueur", correct: true}
      - {text: "Remplacer la `HashMap` par une `TreeMap` triée par nom", correct: false}
      - {text: "Déclarer `nom` `volatile` pour que la table voie le changement", correct: false}
      - {text: "Utiliser une `LinkedHashMap`, qui garde l'ordre d'insertion", correct: false}
    answer: |-
      ```java
      record IdJoueur(UUID valeur) { }
      Map<IdJoueur, Integer> scores = new HashMap<>();
      scores.put(joueur.id(), 10);
      ```
      Une clé dont le hash change après insertion est perdue. On indexe par une valeur immuable (un identifiant) et non
      par un objet modifiable.
  - key: bug-hash-instable
    format: bug-fix
    question: |-
      Les éléments d'un `HashSet` ne sont jamais retrouvés. Quelle correction est la bonne ?
      ```java
      @Override
      public int hashCode() {
          return Objects.hash(code, System.nanoTime());
      }
      ```
    choices:
      - {text: "Un hash stable, sur les seuls champs d'`equals` : `code.hashCode()`", correct: true}
      - {text: "`Objects.hash(code, System.currentTimeMillis())`, moins précis", correct: false}
      - {text: "`System.identityHashCode(this)`, propre à chaque objet", correct: false}
      - {text: "Garder le premier hash calculé dans un champ, et le resservir", correct: false}
    answer: |-
      ```java
      @Override
      public int hashCode() {
          return code.hashCode();
      }
      ```
      Un hash doit être stable : il change ici à chaque appel, donc la recherche ne regarde jamais la bonne case.
  - key: bug-hash-constant
    format: bug-fix
    question: |-
      Une `HashMap` d'un million de produits est très lente, alors que le code « fonctionne ». Quelle correction est la bonne ?
      ```java
      @Override
      public int hashCode() {
          return 42;
      }
      ```
    choices:
      - {text: "Combiner les champs d'`equals` : `Objects.hash(reference, fournisseur)`", correct: true}
      - {text: "Renvoyer un nombre aléatoire, pour bien répartir les clés", correct: false}
      - {text: "Porter la capacité initiale de la `HashMap` à deux millions", correct: false}
      - {text: "Remplacer `42` par un nombre premier, comme `31`", correct: false}
    answer: |-
      ```java
      @Override
      public int hashCode() {
          return Objects.hash(reference, fournisseur);
      }
      ```
      Un hash constant respecte le contrat mais met toutes les clés dans la même case : chaque recherche parcourt la
      case. On combine les champs d'`equals` pour bien répartir les clés.
  - key: deux-objets-identiques-sont-consideres
    format: scenario
    question: "Deux objets identiques sont considérés différents dans une `HashMap`. Que vérifies-tu en premier ?"
    choices:
      - {text: "Que `equals` et `hashCode` sont redéfinis tous deux, sur les mêmes champs immuables", correct: true}
      - {text: "Que la `HashMap` a une capacité initiale assez grande pour les deux objets", correct: false}
      - {text: "Que les deux objets sont bien la même instance, comparée avec `==`", correct: false}
      - {text: "Que la `HashMap` est synchronisée, sans quoi elle confond les objets", correct: false}
    answer: |-
      D'abord que `equals` et `hashCode` sont redéfinis **tous les deux**, sur les **mêmes champs** : sinon deux objets
      égaux tombent dans des cases différentes et ne se rencontrent jamais. Ensuite que ces champs sont **immuables** :
      un champ modifié après l'insertion change le hash, et l'objet devient introuvable, même par lui-même.
  - key: scenario-hashmap-lente
    format: scenario
    question: Une `HashMap` utilisée comme cache devient lente quand elle grossit. Que vérifies-tu ?
    choices:
      - {text: "La répartition du `hashCode` des clés, et la taille maximale du cache", correct: true}
      - {text: "Le facteur de charge : le passer à 1.0 réglera la lenteur", correct: false}
      - {text: "La synchronisation : remplacer la table par une `Hashtable`", correct: false}
      - {text: "Le ramasse-miettes : appeler `System.gc()` quand la table grossit", correct: false}
    answer: |-
      D'abord la qualité du `hashCode` des clés : un hash constant ou mal réparti entasse les clés dans quelques cases
      (Java 8+ transforme les cases surchargées en arbres, ce qui limite les dégâts sans les supprimer). Ensuite la
      limite de taille : un cache qui grossit sans fin est une fuite, pas un problème de hash.
  - key: scenario-entite-jpa
    format: scenario
    question: "Sur quels champs baser `equals` et `hashCode` d'une entité JPA dont l'identifiant est généré par la base ?"
    choices:
      - {text: "Une clé métier immuable, ou un UUID attribué dès la création de l'entité", correct: true}
      - {text: "L'identifiant généré par la base, même s'il vaut `null` avant le `persist`", correct: false}
      - {text: "Tous les champs de l'entité, associations paresseuses comprises", correct: false}
      - {text: "Les champs modifiables affichés à l'écran, comme le nom et l'adresse", correct: false}
    answer: |-
      Une **clé métier** immuable (un numéro de commande, un ISBN) ou un identifiant **attribué à la création** (un UUID
      généré dans le constructeur). L'id généré par la base vaut `null` avant le `persist` : le hash changerait et
      l'entité se perdrait dans un `HashSet` (à défaut, un `equals` sur l'id non nul et un `hashCode` constant par
      classe). Jamais de champs mutables ni d'associations paresseuses.
  - key: scenario-expliquer-contrat
    format: scenario
    question: "Tu expliques à un junior pourquoi il doit toujours redéfinir `hashCode` avec `equals`. Quel argument donnes-tu ?"
    choices:
      - {text: "La `HashMap` choisit la case par le hash, puis n'appelle `equals` que dans cette case", correct: true}
      - {text: "Le compilateur refuse une classe qui redéfinit `equals` sans redéfinir `hashCode`", correct: false}
      - {text: "`equals` appelle `hashCode` en interne : sans lui, il renverrait toujours `false`", correct: false}
      - {text: "Sans `hashCode`, `equals` devient lent car il doit comparer tous les champs", correct: false}
    answer: |-
      Une `HashMap` choisit un tiroir par le hash, puis compare avec `equals` seulement dans ce tiroir : deux objets
      égaux de hash différents ne se rencontrent jamais (doublon dans un `HashSet`, `get` qui renvoie `null`). Le geste :
      redéfinir les deux sur les mêmes champs, ou utiliser un record, et le tester avec deux objets égaux dans un
      `HashSet`.
