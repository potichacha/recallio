notion: builder-java
lesson: |-
  Quand un objet a **beaucoup de paramètres**, dont plusieurs facultatifs, les constructeurs deviennent illisibles :
  `new Requete("/api", "GET", 30, true, null, 3)`. Le **builder** (*Effective Java*, item 2) nomme chaque paramètre :

  ```java
  public final class Requete {
      private final String url;
      private final String methode;
      private final int delaiSecondes;

      private Requete(Builder b) {
          url = b.url;
          methode = b.methode;
          delaiSecondes = b.delaiSecondes;
      }

      public static Builder pour(String url) { return new Builder(url); }   // paramètre obligatoire

      public static final class Builder {
          private final String url;
          private String methode = "GET";            // valeurs par défaut
          private int delaiSecondes = 30;

          private Builder(String url) { this.url = Objects.requireNonNull(url); }

          public Builder methode(String m) { methode = m; return this; }
          public Builder delai(int s) { delaiSecondes = s; return this; }

          public Requete construire() {
              if (delaiSecondes <= 0) throw new IllegalStateException("délai invalide");
              return new Requete(this);              // l'objet naît complet et valide
          }
      }
  }

  Requete r = Requete.pour("/api").methode("POST").delai(5).construire();
  ```

  - L'objet construit peut être **immuable** : tout est fixé dans `construire()`.
  - La **validation** des règles qui lient plusieurs paramètres se fait dans `construire()`.
  - Les paramètres **obligatoires** passent par la fabrique ou le constructeur du builder.
  - Exemples de la JDK : `StringBuilder`, `HttpRequest.newBuilder()`, `Stream.builder()`, `Locale.Builder`.
  - Pour deux ou trois paramètres, un constructeur ou un record suffit ; le builder a un coût (du code).

  **Piège classique** : le patron JavaBeans (constructeur vide + setters). L'objet existe dans un état **incomplet**
  entre les appels, et ne peut pas être immuable.

  **En entretien** : « Au-delà de quatre ou cinq paramètres, surtout facultatifs, j'utilise un builder : lisible, il
  produit un objet immuable et validé en une fois. »
cards:
  - key: probleme
    format: course
    question: Quel problème le builder résout-il ?
    answer: Les constructeurs à nombreux paramètres (constructeurs télescopiques), illisibles et faciles à mal remplir, surtout quand plusieurs paramètres sont facultatifs ou de même type.
  - key: vs-javabeans
    format: course
    question: Pourquoi un builder plutôt qu'un constructeur vide et des setters ?
    answer: Avec les setters, l'objet existe dans un état incomplet et ne peut pas être immuable ; le builder ne livre l'objet qu'une fois complet et validé.
  - key: validation
    format: course
    question: Où valider les règles qui lient plusieurs paramètres d'un builder ?
    answer: Dans la méthode `construire()` (ou dans le constructeur privé de l'objet), juste avant de créer l'objet.
  - key: quand-eviter
    format: course
    question: Quand un builder est-il superflu ?
    answer: "Pour deux ou trois paramètres obligatoires : un constructeur, une fabrique ou un record est plus simple."
  - key: vf-immuable
    format: true-false
    question: L'objet construit par un builder peut être immuable.
    truth: true
    answer: Tous ses champs sont fixés dans `construire()`.
  - key: vf-string-builder
    format: true-false
    question: "`StringBuilder` est une application du patron builder."
    truth: true
    answer: On accumule des morceaux, puis `toString()` produit la `String` immuable.
  - key: vf-javabeans
    format: true-false
    question: Le patron JavaBeans (setters) garantit qu'un objet n'est jamais utilisé incomplet.
    truth: false
    answer: Entre deux setters, l'objet existe dans un état partiel.
  - key: vf-builder-static
    format: true-false
    question: La classe `Builder` imbriquée est en général `static`.
    truth: true
    answer: On crée le builder avant que l'objet existe ; il n'a pas besoin d'instance englobante.
  - key: qcm-lisible
    format: multiple-choice
    question: Laquelle de ces créations est la plus lisible ?
    choices:
      - text: "`Requete.pour(\"/api\").methode(\"POST\").delai(5).construire()`"
        correct: true
      - text: "`new Requete(\"/api\", \"POST\", 5, true, null)`"
        correct: false
      - text: "`new Requete().setUrl(\"/api\")` sans fin"
        correct: false
      - text: "`Requete.creer(new Object[]{\"/api\", \"POST\", 5})`"
        correct: false
    answer: Chaque valeur est nommée, et les paramètres facultatifs omis gardent leur valeur par défaut.
  - key: qcm-obligatoire
    format: multiple-choice
    question: Comment imposer un paramètre obligatoire avec un builder ?
    choices:
      - text: "Le demander à la fabrique du builder : `Requete.pour(url)`"
        correct: true
      - text: "Le vérifier dans `construire()`"
        correct: true
      - text: "Lui donner une valeur par défaut `null`"
        correct: false
      - text: "C'est impossible avec un builder"
        correct: false
    answer: Le premier est vérifié par le compilateur, le second à l'exécution.
  - key: qcm-jdk
    format: multiple-choice
    question: Lesquels sont des builders de la JDK ?
    choices:
      - text: "`HttpRequest.newBuilder()`"
        correct: true
      - text: "`Stream.builder()`"
        correct: true
      - text: "`List.of(...)`"
        correct: false
      - text: "`Integer.valueOf(...)`"
        correct: false
    answer: Les deux derniers sont des fabriques statiques.
  - key: qcm-retour
    format: multiple-choice
    question: Que renvoient les méthodes de réglage d'un builder, comme `delai(5)` ?
    choices:
      - text: "Le builder lui-même (`this`), pour chaîner les appels"
        correct: true
      - text: "L'objet final"
        correct: false
      - text: "`void`"
        correct: false
      - text: "Un nouveau builder vide"
        correct: false
    answer: Seul `construire()` renvoie l'objet final.
  - key: code-defauts
    format: code-output
    question: |-
      ```java
      final class Requete {
          final String url; final String methode; final int delai;
          private Requete(Builder b) { url = b.url; methode = b.methode; delai = b.delai; }
          static Builder pour(String url) { return new Builder(url); }
          static final class Builder {
              private final String url;
              private String methode = "GET";
              private int delai = 30;
              private Builder(String url) { this.url = url; }
              Builder methode(String m) { methode = m; return this; }
              Builder delai(int s) { delai = s; return this; }
              Requete construire() { return new Requete(this); }
          }
      }
      Requete r = Requete.pour("/api").delai(5).construire();
      System.out.println(r.methode + " " + r.url + " " + r.delai);
      ```
    answer: '`GET /api 5` : la méthode garde sa valeur par défaut.'
    check:
      output: "GET /api 5"
  - key: code-validation
    format: code-output
    question: |-
      ```java
      final class Alarme {
          final int heure;
          private Alarme(int heure) { this.heure = heure; }
          static final class Builder {
              private int heure = -1;
              Builder heure(int h) { heure = h; return this; }
              Alarme construire() {
                  if (heure < 0 || heure > 23) throw new IllegalStateException("heure invalide");
                  return new Alarme(heure);
              }
          }
      }
      System.out.println(new Alarme.Builder().heure(7).construire().heure);
      new Alarme.Builder().construire();
      ```
    answer: '`7`, puis une `IllegalStateException` : sans heure, `construire()` refuse de créer l''alarme.'
    check:
      output: "7"
      throws: IllegalStateException
  - key: code-string-builder
    format: code-output
    question: |-
      ```java
      String s = new StringBuilder("a").append(1).append('b').insert(0, "<").toString();
      System.out.println(s);
      ```
    answer: '`<a1b` : le builder accumule, `toString()` produit la chaîne immuable.'
    check:
      output: "<a1b"
  - key: code-stream-builder
    format: code-output
    question: |-
      ```java
      Stream<String> flux = Stream.<String>builder().add("x").add("y").build();
      System.out.println(flux.toList());
      ```
    answer: '`[x, y]`.'
    check:
      output: "[x, y]"
  - key: bug-telescopique
    format: bug-fix
    question: |-
      Un appel a inversé le délai et le nombre de tentatives, sans aucune erreur de compilation :
      ```java
      new Client("https://api", 3, 30, true, false);   // (url, delai, tentatives, cache, journal)
      ```
    answer: |-
      ```java
      Client client = Client.pour("https://api")
              .delai(Duration.ofSeconds(3))
              .tentatives(30)
              .avecCache()
              .construire();
      ```
      Plusieurs paramètres de même type se confondent sans que le compilateur puisse aider. Le builder nomme chacun
      (et un type dédié comme `Duration` empêche encore plus de les mélanger).
  - key: bug-javabeans
    format: bug-fix
    question: |-
      Un thread utilise parfois une configuration à moitié remplie :
      ```java
      Configuration c = new Configuration();
      partager(c);
      c.setUrl(url);
      c.setDelai(30);
      ```
    answer: |-
      ```java
      Configuration c = Configuration.pour(url)
              .delai(30)
              .construire();
      partager(c);
      ```
      Avec des setters, l'objet existe incomplet et mutable. Le builder ne livre qu'un objet complet, immuable donc
      partageable sans risque.
  - key: bug-liste-partagee
    format: bug-fix
    question: |-
      Réutiliser un builder modifie les objets déjà construits :
      ```java
      Builder ajouter(String tag) { tags.add(tag); return this; }
      Article construire() { return new Article(titre, tags); }   // Article garde la liste telle quelle
      ```
    answer: |-
      ```java
      Article construire() { return new Article(titre, List.copyOf(tags)); }
      ```
      L'article partageait la liste du builder : un `ajouter` ultérieur la modifiait. `construire()` donne à chaque objet
      sa propre copie immuable.
  - key: bug-validation-manquante
    format: bug-fix
    question: |-
      Des réservations dont la fin précède le début sont créées :
      ```java
      Reservation construire() {
          return new Reservation(debut, fin);
      }
      ```
    answer: |-
      ```java
      Reservation construire() {
          Objects.requireNonNull(debut, "début");
          Objects.requireNonNull(fin, "fin");
          if (fin.isBefore(debut)) {
              throw new IllegalStateException("fin avant le début");
          }
          return new Reservation(debut, fin);
      }
      ```
      Une règle qui lie deux paramètres ne peut être vérifiée qu'une fois tous fournis : c'est le rôle de
      `construire()`.
