notion: builder-java
lesson: |-
  Quand un objet a **beaucoup de paramètres**, dont plusieurs facultatifs, les constructeurs deviennent illisibles :
  `new Requete("/api", "GET", 30, true, null, 3)`. Le **builder** (*Effective Java*, item 2) nomme chaque paramètre :

  ```java
  public final class Requete {
      private final String url;
      private final String methode;
      private final int delaiSecondes;

      private Requete(Builder b) {
          url = b.url;
          methode = b.methode;
          delaiSecondes = b.delaiSecondes;
      }

      public static Builder pour(String url) { return new Builder(url); }   // paramètre obligatoire

      public static final class Builder {
          private final String url;
          private String methode = "GET";            // valeurs par défaut
          private int delaiSecondes = 30;

          private Builder(String url) { this.url = Objects.requireNonNull(url); }

          public Builder methode(String m) { methode = m; return this; }
          public Builder delai(int s) { delaiSecondes = s; return this; }

          public Requete construire() {
              if (delaiSecondes <= 0) throw new IllegalStateException("délai invalide");
              return new Requete(this);              // l'objet naît complet et valide
          }
      }
  }

  Requete r = Requete.pour("/api").methode("POST").delai(5).construire();
  ```

  - L'objet construit peut être **immuable** : tout est fixé dans `construire()`.
  - La **validation** des règles qui lient plusieurs paramètres se fait dans `construire()`.
  - Les paramètres **obligatoires** passent par la fabrique ou le constructeur du builder.
  - Exemples de la JDK : `StringBuilder`, `HttpRequest.newBuilder()`, `Stream.builder()`, `Locale.Builder`.
  - Pour deux ou trois paramètres, un constructeur ou un record suffit ; le builder a un coût (du code).

  **Piège classique** : le patron JavaBeans (constructeur vide + setters). L'objet existe dans un état **incomplet**
  entre les appels, et ne peut pas être immuable.

  **En entretien** : « Au-delà de quatre ou cinq paramètres, surtout facultatifs, j'utilise un builder : lisible, il
  produit un objet immuable et validé en une fois. »
cards:
  - key: probleme
    format: course
    question: "Quel problème le builder résout-il ?"
    choices:
      - {text: "Les constructeurs à nombreux paramètres, illisibles et faciles à mal remplir", correct: true}
      - {text: "La création d'une seule instance, partagée par toute l'application", correct: false}
      - {text: "Le choix, à l'exécution, de la sous-classe concrète à instancier", correct: false}
      - {text: "L'ajout de comportements à un objet sans modifier sa classe", correct: false}
    answer: |-
      Les constructeurs à nombreux paramètres (constructeurs télescopiques), illisibles et faciles à mal remplir, surtout
      quand plusieurs paramètres sont facultatifs ou de même type. L'instance unique est le rôle du singleton.
  - key: vs-javabeans
    format: course
    question: "Pourquoi un builder plutôt qu'un constructeur vide et des setters ?"
    choices:
      - {text: "Le builder ne livre l'objet qu'une fois complet et validé, et cet objet peut être immuable", correct: true}
      - {text: "Les setters sont plus lents, car chaque appel crée une copie complète de l'objet", correct: false}
      - {text: "Le builder évite d'écrire un constructeur : le compilateur le génère à sa place", correct: false}
      - {text: "Les setters ne peuvent pas recevoir de paramètres d'un type objet, seulement des primitifs", correct: false}
    answer: |-
      Avec les setters, l'objet existe dans un état incomplet et ne peut pas être immuable ; le builder ne livre l'objet
      qu'une fois complet et validé.
  - key: validation
    format: course
    question: "Où valider les règles qui lient plusieurs paramètres d'un builder ?"
    choices:
      - {text: "Dans `construire()`, juste avant de créer l'objet, quand tout est fourni", correct: true}
      - {text: "Dans chaque méthode de réglage, dès que le paramètre est reçu", correct: false}
      - {text: "Dans le code appelant, après avoir reçu l'objet construit", correct: false}
      - {text: "Nulle part : un builder garantit déjà la cohérence des paramètres", correct: false}
    answer: |-
      Dans `construire()` (ou dans le constructeur privé de l'objet), juste avant de créer l'objet : une règle qui lie
      deux paramètres ne se vérifie qu'une fois les deux fournis, pas dans chaque méthode de réglage.
  - key: quand-eviter
    format: course
    question: "Quand un builder est-il superflu ?"
    choices:
      - {text: "Pour deux ou trois paramètres obligatoires : un constructeur ou un record suffit", correct: true}
      - {text: "Dès qu'un paramètre est facultatif : on préfère alors des setters", correct: false}
      - {text: "Quand l'objet construit doit être immuable et partagé entre threads", correct: false}
      - {text: "Quand plusieurs paramètres ont le même type, comme deux `int`", correct: false}
    answer: |-
      Pour deux ou trois paramètres obligatoires : un constructeur, une fabrique ou un record est plus simple. Le builder
      se justifie avec beaucoup de paramètres, facultatifs ou de même type.
  - key: vf-immuable
    format: true-false
    question: L'objet construit par un builder peut être immuable.
    truth: true
    answer: Tous ses champs sont fixés dans `construire()`.
  - key: vf-string-builder
    format: true-false
    question: "`StringBuilder` est une application du patron builder."
    truth: true
    answer: On accumule des morceaux, puis `toString()` produit la `String` immuable.
  - key: vf-javabeans
    format: true-false
    question: Le patron JavaBeans (setters) garantit qu'un objet n'est jamais utilisé incomplet.
    truth: false
    answer: Entre deux setters, l'objet existe dans un état partiel.
  - key: vf-builder-static
    format: true-false
    question: La classe `Builder` imbriquée est en général `static`.
    truth: true
    answer: On crée le builder avant que l'objet existe ; il n'a pas besoin d'instance englobante.
  - key: qcm-lisible
    format: multiple-choice
    question: Laquelle de ces créations est la plus lisible ?
    choices:
      - text: "`Requete.pour(\"/api\").methode(\"POST\").delai(5).construire()`"
        correct: true
      - text: "`new Requete(\"/api\", \"POST\", 5, true, null)`"
        correct: false
      - text: "`new Requete().setUrl(\"/api\")` sans fin"
        correct: false
      - text: "`Requete.creer(new Object[]{\"/api\", \"POST\", 5})`"
        correct: false
    answer: Chaque valeur est nommée, et les paramètres facultatifs omis gardent leur valeur par défaut.
  - key: qcm-obligatoire
    format: multiple-choice
    question: "Comment imposer un paramètre obligatoire d'un builder de sorte que le compilateur le vérifie ?"
    choices:
      - {text: "Le demander à la fabrique du builder : `Requete.pour(url)`", correct: true}
      - {text: "Le vérifier dans `construire()` avec `Objects.requireNonNull`", correct: false}
      - {text: "Lui donner une valeur par défaut `null` dans le builder", correct: false}
      - {text: "C'est impossible avec un builder", correct: false}
    answer: |-
      Demandé par la fabrique du builder, il ne peut pas être oublié : le compilateur l'exige. La vérification dans
      `construire()` marche aussi, mais seulement à l'exécution.
  - key: qcm-jdk
    format: multiple-choice
    question: Lesquels sont des builders de la JDK ?
    choices:
      - text: "`HttpRequest.newBuilder()`"
        correct: true
      - text: "`Stream.builder()`"
        correct: true
      - text: "`List.of(...)`"
        correct: false
      - text: "`Integer.valueOf(...)`"
        correct: false
    answer: Les deux derniers sont des fabriques statiques.
  - key: qcm-retour
    format: multiple-choice
    question: Que renvoient les méthodes de réglage d'un builder, comme `delai(5)` ?
    choices:
      - {text: "Le builder lui-même (`this`), pour chaîner les appels", correct: true}
      - {text: "L'objet final, déjà construit avec ce réglage", correct: false}
      - {text: "`void`, car un réglage ne fait que modifier un champ", correct: false}
      - {text: "Un nouveau builder vide, prêt pour le réglage suivant", correct: false}
    answer: Seul `construire()` renvoie l'objet final.
  - key: code-defauts
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      final class Requete {
          final String url; final String methode; final int delai;
          private Requete(Builder b) { url = b.url; methode = b.methode; delai = b.delai; }
          static Builder pour(String url) { return new Builder(url); }
          static final class Builder {
              private final String url;
              private String methode = "GET";
              private int delai = 30;
              private Builder(String url) { this.url = url; }
              Builder methode(String m) { methode = m; return this; }
              Builder delai(int s) { delai = s; return this; }
              Requete construire() { return new Requete(this); }
          }
      }
      Requete r = Requete.pour("/api").delai(5).construire();
      System.out.println(r.methode + " " + r.url + " " + r.delai);
      ```
    choices:
      - {text: "`GET /api 5`", correct: true}
      - {text: "`null /api 5`", correct: false}
      - {text: "`GET /api 30`", correct: false}
      - {text: "`null /api 30`", correct: false}
    answer: "`GET /api 5` : la méthode garde sa valeur par défaut, et `delai(5)` remplace les 30 secondes."
    check:
      output: "GET /api 5"
  - key: code-validation
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      final class Alarme {
          final int heure;
          private Alarme(int heure) { this.heure = heure; }
          static final class Builder {
              private int heure = -1;
              Builder heure(int h) { heure = h; return this; }
              Alarme construire() {
                  if (heure < 0 || heure > 23) throw new IllegalStateException("heure invalide");
                  return new Alarme(heure);
              }
          }
      }
      System.out.println(new Alarme.Builder().heure(7).construire().heure);
      new Alarme.Builder().construire();
      ```
    choices:
      - {text: "`7`, puis une `IllegalStateException`", correct: true}
      - {text: "`7`, puis rien d'autre", correct: false}
      - {text: "Une `IllegalStateException` sans rien avant", correct: false}
      - {text: "`7`, puis une `NullPointerException`", correct: false}
    answer: "`7`, puis une `IllegalStateException` : sans heure, `construire()` refuse de créer l'alarme."
    check:
      output: "7"
      throws: IllegalStateException
  - key: code-string-builder
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = new StringBuilder("a").append(1).append('b').insert(0, "<").toString();
      System.out.println(s);
      ```
    choices:
      - {text: "`<a1b`", correct: true}
      - {text: "`a1b<`", correct: false}
      - {text: "`a1b`", correct: false}
      - {text: "`<a198`", correct: false}
    answer: "`<a1b` : `insert(0, ...)` ajoute au début ; le builder accumule, `toString()` produit la chaîne immuable."
    check:
      output: "<a1b"
  - key: code-stream-builder
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Stream<String> flux = Stream.<String>builder().add("x").add("y").build();
      System.out.println(flux.toList());
      ```
    choices:
      - {text: "`[x, y]`", correct: true}
      - {text: "`[y, x]`", correct: false}
      - {text: "`[x]`", correct: false}
      - {text: "`xy`", correct: false}
    answer: "`[x, y]` : le builder garde l'ordre des `add`, et `toList()` les rassemble dans une liste."
    check:
      output: "[x, y]"
  - key: bug-telescopique
    format: bug-fix
    question: |-
      Un appel a inversé le délai et le nombre de tentatives, sans aucune erreur de compilation. Quelle correction est
      la bonne ?
      ```java
      new Client("https://api", 3, 30, true, false);   // (url, delai, tentatives, cache, journal)
      ```
    choices:
      - {text: "Un builder qui nomme chaque paramètre, avec un type `Duration` pour le délai", correct: true}
      - {text: "Un commentaire à chaque appel, qui rappelle l'ordre exact des paramètres", correct: false}
      - {text: "Un constructeur vide et des setters, appelés juste après la création", correct: false}
      - {text: "Un tableau `Object[]` qui regroupe tous les paramètres en un seul argument", correct: false}
    answer: |-
      ```java
      Client client = Client.pour("https://api")
              .delai(Duration.ofSeconds(3))
              .tentatives(30)
              .avecCache()
              .construire();
      ```
      Plusieurs paramètres de même type se confondent sans que le compilateur puisse aider. Le builder nomme chacun, et
      un type dédié comme `Duration` empêche encore plus de les mélanger ; des setters laisseraient l'objet incomplet.
  - key: bug-javabeans
    format: bug-fix
    question: |-
      Un thread utilise parfois une configuration à moitié remplie. Quelle correction est la bonne ?
      ```java
      Configuration c = new Configuration();
      partager(c);
      c.setUrl(url);
      c.setDelai(30);
      ```
    choices:
      - {text: "Construire la configuration complète et immuable avec un builder, puis la partager", correct: true}
      - {text: "Rendre les setters `synchronized`, en gardant le même ordre d'appels", correct: false}
      - {text: "Déclarer la variable `c` en `final` pour figer la configuration", correct: false}
      - {text: "Appeler `partager(c)` depuis un nouveau thread, démarré aussitôt", correct: false}
    answer: |-
      ```java
      Configuration c = Configuration.pour(url)
              .delai(30)
              .construire();
      partager(c);
      ```
      Avec des setters, l'objet existe incomplet et mutable. Le builder ne livre qu'un objet complet, immuable donc
      partageable sans risque ; `final` fige la référence, pas l'objet.
  - key: bug-liste-partagee
    format: bug-fix
    question: |-
      Réutiliser un builder modifie les objets déjà construits. Quelle correction est la bonne ?
      ```java
      Builder ajouter(String tag) { tags.add(tag); return this; }
      Article construire() { return new Article(titre, tags); }   // Article garde la liste telle quelle
      ```
    choices:
      - {text: "Dans `construire()`, donner à l'article sa copie : `List.copyOf(tags)`", correct: true}
      - {text: "Déclarer le champ `tags` du builder en `final`, pour qu'il ne change plus", correct: false}
      - {text: "Vider la liste `tags` au début de chaque appel à `ajouter`", correct: false}
      - {text: "Renvoyer `new Builder()` dans `ajouter` au lieu de `this`", correct: false}
    answer: |-
      ```java
      Article construire() { return new Article(titre, List.copyOf(tags)); }
      ```
      L'article partageait la liste du builder : un `ajouter` ultérieur la modifiait. `construire()` donne à chaque objet
      sa propre copie immuable ; `final` ne figerait que la référence, pas le contenu de la liste.
  - key: bug-validation-manquante
    format: bug-fix
    question: |-
      Des réservations dont la fin précède le début sont créées. Quelle correction est la bonne ?
      ```java
      Reservation construire() {
          return new Reservation(debut, fin);
      }
      ```
    choices:
      - {text: "Dans `construire()`, refuser une fin avant le début par une `IllegalStateException`", correct: true}
      - {text: "Échanger les deux dates dans le constructeur pour remettre la plus petite au début", correct: false}
      - {text: "Laisser l'appelant vérifier les dates après avoir reçu la réservation", correct: false}
      - {text: "Donner à `fin` une valeur par défaut égale à `debut` dans le builder", correct: false}
    answer: |-
      ```java
      Reservation construire() {
          Objects.requireNonNull(debut, "début");
          Objects.requireNonNull(fin, "fin");
          if (fin.isBefore(debut)) {
              throw new IllegalStateException("fin avant le début");
          }
          return new Reservation(debut, fin);
      }
      ```
      Une règle qui lie deux paramètres ne peut être vérifiée qu'une fois tous fournis : c'est le rôle de
      `construire()`. Échanger les dates en silence masquerait l'erreur de l'appelant.
