notion: constructeurs
lesson: |-
  Un **constructeur** initialise un objet au moment de sa création. Il porte le **nom de la classe** et n'a **pas de
  type de retour** (pas même `void`).

  ```java
  class Compte {
      private final String titulaire;
      private double solde;

      Compte(String titulaire, double soldeInitial) {
          if (soldeInitial < 0) {
              throw new IllegalArgumentException("solde négatif");
          }
          this.titulaire = titulaire;
          this.solde = soldeInitial;
      }

      Compte(String titulaire) {
          this(titulaire, 0);   // délègue au constructeur principal
      }
  }
  ```

  - **Constructeur par défaut** : si la classe ne déclare **aucun** constructeur, le compilateur en ajoute un, sans
    paramètre. Dès qu'on en écrit un, il disparaît.
  - **Surcharge** : plusieurs constructeurs aux paramètres différents ; `this(...)` appelle un autre constructeur de
    la classe et évite de dupliquer le code.
  - Un constructeur **valide** ses arguments : un objet mal construit ne doit jamais exister.
  - `this(...)` et `super(...)` doivent venir avant tout usage de l'objet. Jusqu'à Java 24, c'était obligatoirement la
    première instruction ; Java 25 autorise des instructions avant, qui ne touchent pas à `this` (JEP 513).

  **Piège classique** : `void Compte() { ... }` n'est pas un constructeur mais une méthode qui porte le nom de la
  classe ; elle n'est jamais appelée par `new`.

  **En entretien** : « Le constructeur garantit qu'un objet naît valide ; le constructeur par défaut n'existe que si on
  n'en déclare aucun, et `this(...)` chaîne les constructeurs. »
tour:
  - title: Les constructeurs
    text: |-
      Un **constructeur** initialise un objet au moment de sa création : il porte le nom de la classe, et n'a pas de
      type de retour. `new Point(1, 2)` appelle le constructeur à deux paramètres.

      Sans constructeur écrit, Java en fournit un sans paramètre ; dès qu'on en écrit un, celui-là disparaît. On peut en
      avoir plusieurs, et `this(…)` en appelle un autre de la même classe, pour ne pas répéter le code.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println(new Point(1, 2).decrit());
              IO.println(new Point().decrit());
          }
        Point.java: |-
          public class Point {
              private final int x;
              private final int y;

              public Point(int x, int y) {
                  this.x = x;
                  this.y = y;
              }

              public Point() {
                  this(0, 0);
              }

              String decrit() {
                  return "(" + x + ", " + y + ")";
              }
          }
      output: |-
        (1, 2)
        (0, 0)
cards:
  - key: quand-compilateur-ajoute-constructeur-defaut
    format: course
    question: Quand le compilateur ajoute-t-il un constructeur par défaut ?
    choices:
      - {text: "Seulement si la classe ne déclare aucun constructeur", correct: true}
      - {text: "Toujours, en plus des constructeurs que la classe déclare", correct: false}
      - {text: "Seulement si la classe n'a aucun champ à initialiser", correct: false}
      - {text: "Seulement si tous les constructeurs déclarés ont des paramètres", correct: false}
    answer: |-
      Seulement si la classe ne déclare aucun constructeur : dès qu'on en écrit un, même avec des paramètres, le
      constructeur sans paramètre disparaît.
  - key: type-retour
    format: course
    question: Un constructeur a-t-il un type de retour ?
    choices:
      - {text: "Non, pas même `void` : `void NomDeLaClasse()` serait une méthode", correct: true}
      - {text: "Oui, `void`, mais on a le droit de l'omettre à l'écriture", correct: false}
      - {text: "Oui, le type de sa classe, qu'on peut écrire avant le nom", correct: false}
      - {text: "Non, mais on peut écrire `void` sans que rien ne change", correct: false}
    answer: |-
      Non, pas même `void`. Une « méthode » `void NomDeLaClasse()` est une méthode ordinaire, pas un constructeur : elle
      n'est jamais appelée par `new`.
  - key: this-appel
    format: course
    question: À quoi sert `this(...)` dans un constructeur ?
    choices:
      - {text: "À appeler un autre constructeur de la même classe, pour centraliser l'initialisation", correct: true}
      - {text: "À appeler le constructeur de la classe parente, avant le reste du corps", correct: false}
      - {text: "À créer une copie de l'objet courant, avec les mêmes valeurs de champs", correct: false}
      - {text: "À désigner le champ qui porte le même nom qu'un paramètre", correct: false}
    answer: |-
      `this(...)` appelle un autre constructeur de la même classe, pour regrouper l'initialisation et la validation à un
      seul endroit. Le constructeur du parent, c'est `super(...)`.
  - key: validation
    format: course
    question: Pourquoi valider les arguments dans le constructeur ?
    choices:
      - {text: "Pour qu'aucun objet invalide ne puisse exister : on lève une exception avant d'affecter", correct: true}
      - {text: "Parce que le compilateur refuse un constructeur qui ne valide pas ses arguments", correct: false}
      - {text: "Pour remplacer en silence les valeurs fausses par des valeurs par défaut", correct: false}
      - {text: "Pour que le ramasse-miettes récupère aussitôt un objet invalide", correct: false}
    answer: |-
      Pour qu'aucun objet invalide ne puisse exister : on lève une exception (`IllegalArgumentException`, ou
      `NullPointerException` via `Objects.requireNonNull`) avant d'affecter les champs.
  - key: vf-defaut-toujours
    format: true-false
    question: Le compilateur ajoute toujours un constructeur sans paramètre.
    truth: false
    answer: Seulement si la classe n'en déclare aucun.
  - key: vf-void
    format: true-false
    question: "`void Point() { }` est un constructeur de la classe `Point`."
    truth: false
    answer: Avec un type de retour, c'est une méthode qui porte le nom de la classe.
  - key: vf-surcharge
    format: true-false
    question: Une classe peut avoir plusieurs constructeurs.
    truth: true
    answer: Ils se distinguent par leurs paramètres (surcharge).
  - key: vf-private
    format: true-false
    question: Un constructeur peut être `private`.
    truth: true
    answer: C'est courant pour une classe utilitaire, un singleton ou une classe qui n'offre que des fabriques statiques.
  - key: qcm-compile
    format: multiple-choice
    question: "La classe `Personne` déclare seulement `Personne(String nom)`. Lequel de ces appels compile ?"
    choices:
      - text: "`new Personne(\"Ada\")`"
        correct: true
      - text: "`new Personne()`"
        correct: false
      - text: "`Personne(\"Ada\")`"
        correct: false
      - text: "`new Personne(\"Ada\", 36)`"
        correct: false
    answer: Le constructeur sans paramètre n'existe plus dès qu'un autre est déclaré.
  - key: qcm-delegation
    format: multiple-choice
    question: Comment un constructeur appelle-t-il un autre constructeur de la même classe ?
    choices:
      - text: "`this(...)`"
        correct: true
      - text: "`super(...)`"
        correct: false
      - text: "`new NomDeLaClasse(...)`"
        correct: false
      - text: "`NomDeLaClasse(...)`"
        correct: false
    answer: '`super(...)` appelle le constructeur du parent ; `new` créerait un second objet.'
  - key: qcm-exception
    format: multiple-choice
    question: Quelle exception lever pour un argument invalide dans un constructeur ?
    choices:
      - text: "`IllegalArgumentException`"
        correct: true
      - text: "`Exception`"
        correct: false
      - text: "`Error`"
        correct: false
      - text: "Aucune, on met une valeur par défaut en silence"
        correct: false
    answer: Une exception non vérifiée et précise, qui dit pourquoi l'argument est refusé.
  - key: qcm-nom
    format: multiple-choice
    question: Quel est le nom d'un constructeur de la classe `Facture` ?
    choices:
      - text: "`Facture`"
        correct: true
      - text: "`init`"
        correct: false
      - text: "`constructor`"
        correct: false
      - text: "`new`"
        correct: false
    answer: Un constructeur porte exactement le nom de sa classe.
  - key: trous-delegation
    format: fill-in
    question: |-
      Complète pour qu'un rectangle sans argument mesure 1 × 1 :
      ```java
      Rectangle() {
          ___(1, 1);
      }
      ```
    blanks: [[this]]
    answer: '`this(...)` délègue au constructeur `Rectangle(int, int)`.'
  - key: trous-validation
    format: fill-in
    question: |-
      Complète pour refuser un âge négatif :
      ```java
      Personne(int age) {
          if (age < 0) {
              ___ new IllegalArgumentException("âge négatif");
          }
          this.age = age;
      }
      ```
    blanks: [[throw]]
    answer: '`throw` lève l''exception, et l''objet n''est jamais construit.'
  - key: trous-champ
    format: fill-in
    question: |-
      Complète le constructeur :
      ```java
      class Ville {
          private final String nom;
          ___(String nom) {
              this.nom = nom;
          }
      }
      ```
    blanks: [[Ville]]
    answer: Le constructeur porte le nom de la classe, sans type de retour.
  - key: trous-requirenonnull
    format: fill-in
    question: |-
      Complète pour refuser un nom `null` avec une `NullPointerException` explicite :
      ```java
      this.nom = Objects.___(nom, "nom");
      ```
    blanks: [[requireNonNull]]
    answer: '`Objects.requireNonNull` renvoie l''argument ou lève une exception avec le message donné.'
  - key: code-methode-void
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Point {
          int x;
          void Point() { x = 5; }
      }
      System.out.println(new Point().x);
      ```
    choices:
      - {text: "`0`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "Ça ne compile pas : un constructeur ne peut pas être `void`", correct: false}
    answer: '`0` : `void Point()` est une méthode, jamais appelée ; le constructeur par défaut laisse `x` à 0.'
    check:
      output: "0"
  - key: code-chaine-constructeurs
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Rect {
          Rect() { this(1); System.out.print("A"); }
          Rect(int c) { this(c, c); System.out.print("B"); }
          Rect(int l, int h) { System.out.print("C"); }
      }
      new Rect();
      ```
    choices:
      - {text: "`CBA`", correct: true}
      - {text: "`ABC`", correct: false}
      - {text: "`A`", correct: false}
      - {text: "`C`", correct: false}
    answer: '`CBA` : chaque constructeur délègue d''abord, puis exécute la suite de son corps.'
    check:
      output: "CBA"
  - key: code-sans-defaut
    format: code-output
    question: |-
      Ce code compile-t-il ?
      ```java
      class Personne {
          Personne(String nom) {}
      }
      new Personne();
      ```
    choices:
      - {text: "Ça ne compile pas : `Personne()` n'existe pas", correct: true}
      - {text: "Ça compile : le compilateur ajoute toujours `Personne()`", correct: false}
      - {text: "Ça compile : `new Personne()` passe `null` pour `nom`", correct: false}
      - {text: "Ça compile, mais lève une exception à l'exécution", correct: false}
    answer: |-
      Ça ne compile pas : le constructeur sans paramètre n'existe pas, puisqu'un autre est déclaré. Java n'a pas de
      valeur par défaut pour les paramètres.
    check:
      compiles: false
  - key: code-validation
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Age {
          final int valeur;
          Age(int valeur) {
              if (valeur < 0) throw new IllegalArgumentException("âge négatif");
              this.valeur = valeur;
          }
      }
      System.out.println(new Age(30).valeur);
      new Age(-1);
      ```
    choices:
      - {text: "`30`, puis une `IllegalArgumentException`", correct: true}
      - {text: "`30` seulement : `new Age(-1)` renvoie `null`", correct: false}
      - {text: "`30`, puis rien : l'objet garde `valeur` à 0", correct: false}
      - {text: "Ça ne compile pas : `valeur` peut rester sans valeur", correct: false}
    answer: '`30`, puis une `IllegalArgumentException` : le second objet n''est jamais construit.'
    check:
      output: "30"
      throws: IllegalArgumentException
  - key: bug-constructeur-void
    format: bug-fix
    question: |-
      Le titre reste `null` après `new Livre()`. Pourquoi ?
      ```java
      class Livre {
          String titre;
          public void Livre() {
              titre = "Sans titre";
          }
      }
      ```
    choices:
      - {text: "Avec `void`, `Livre()` est une méthode ordinaire, pas un constructeur", correct: true}
      - {text: "Un constructeur `public` doit écrire `this.titre` pour toucher le champ", correct: false}
      - {text: "Le champ `titre` doit être `final` pour être affecté dans un constructeur", correct: false}
      - {text: "Le constructeur par défaut passe après `Livre()` et remet `titre` à `null`", correct: false}
    answer: |-
      ```java
      public Livre() {
          titre = "Sans titre";
      }
      ```
      Avec `void`, c'est une méthode ordinaire, jamais appelée par `new` ; un constructeur n'a pas de type de retour.
  - key: bug-defaut-disparu
    format: bug-fix
    question: |-
      Depuis qu'on a ajouté un constructeur, `new Client()` ne compile plus. Quelle correction est la bonne ?
      ```java
      class Client {
          String nom;
          Client(String nom) { this.nom = nom; }
      }
      ```
    choices:
      - {text: "Déclarer aussi `Client()`, qui délègue avec `this(\"Anonyme\")`", correct: true}
      - {text: "Donner une valeur par défaut au paramètre : `Client(String nom = \"Anonyme\")`", correct: false}
      - {text: "Rendre `Client(String)` `public`, pour que celui par défaut revienne", correct: false}
      - {text: "Appeler `super()` dans `Client(String)`, pour garder `Client()`", correct: false}
    answer: |-
      ```java
      class Client {
          String nom;
          Client() { this("Anonyme"); }
          Client(String nom) { this.nom = nom; }
      }
      ```
      Le constructeur par défaut disparaît dès qu'on en déclare un ; on le réécrit explicitement s'il est nécessaire.
      Java n'a pas de valeur par défaut pour les paramètres.
  - key: bug-duplication
    format: bug-fix
    question: |-
      La validation a été corrigée dans un constructeur mais oubliée dans l'autre. Quelle correction est la bonne ?
      ```java
      Compte(String titulaire) {
          this.titulaire = titulaire;
          this.solde = 0;
      }
      Compte(String titulaire, double solde) {
          if (solde < 0) throw new IllegalArgumentException("solde négatif");
          this.titulaire = Objects.requireNonNull(titulaire);
          this.solde = solde;
      }
      ```
    choices:
      - {text: "Faire déléguer le premier au second : `this(titulaire, 0);`", correct: true}
      - {text: "Faire déléguer le second au premier : `this(titulaire);`, puis affecter `solde`", correct: false}
      - {text: "Appeler `super(titulaire, 0);` dans le premier constructeur", correct: false}
      - {text: "Valider dans un setter `setSolde`, appelé après chaque `new`", correct: false}
    answer: |-
      ```java
      Compte(String titulaire) {
          this(titulaire, 0);
      }
      ```
      Le constructeur secondaire délègue au principal avec `this(...)` : la validation n'existe qu'à un endroit.
  - key: bug-objet-invalide
    format: bug-fix
    question: |-
      On trouve en base des produits au prix négatif. Quelle correction est la bonne ?
      ```java
      Produit(String nom, double prix) {
          this.nom = nom;
          this.prix = prix;
      }
      ```
    choices:
      - {text: "Refuser dans le constructeur un prix négatif, avec une `IllegalArgumentException`", correct: true}
      - {text: "Vérifier le prix dans le service qui enregistre, juste avant d'écrire en base", correct: false}
      - {text: "Remplacer en silence un prix négatif par sa valeur absolue, dans le constructeur", correct: false}
      - {text: "Ajouter un setter `setPrix` qui vérifie le prix, et l'appeler après `new`", correct: false}
    answer: |-
      ```java
      Produit(String nom, double prix) {
          if (prix < 0) {
              throw new IllegalArgumentException("prix négatif : " + prix);
          }
          this.nom = Objects.requireNonNull(nom, "nom");
          this.prix = prix;
      }
      ```
      Le constructeur est le seul passage obligé : y valider garantit qu'aucun produit invalide n'existe, quel que soit
      le code qui le crée.
