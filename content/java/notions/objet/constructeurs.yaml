notion: constructeurs
lesson: |-
  Un **constructeur** initialise un objet au moment de sa création. Il porte le **nom de la classe** et n'a **pas de
  type de retour** (pas même `void`).

  ```java
  class Compte {
      private final String titulaire;
      private double solde;

      Compte(String titulaire, double soldeInitial) {
          if (soldeInitial < 0) {
              throw new IllegalArgumentException("solde négatif");
          }
          this.titulaire = titulaire;
          this.solde = soldeInitial;
      }

      Compte(String titulaire) {
          this(titulaire, 0);   // délègue au constructeur principal
      }
  }
  ```

  - **Constructeur par défaut** : si la classe ne déclare **aucun** constructeur, le compilateur en ajoute un, sans
    paramètre. Dès qu'on en écrit un, il disparaît.
  - **Surcharge** : plusieurs constructeurs aux paramètres différents ; `this(...)` appelle un autre constructeur de
    la classe et évite de dupliquer le code.
  - Un constructeur **valide** ses arguments : un objet mal construit ne doit jamais exister.
  - `this(...)` et `super(...)` doivent venir avant tout usage de l'objet. Jusqu'à Java 24, c'était obligatoirement la
    première instruction ; Java 25 autorise des instructions avant, qui ne touchent pas à `this` (JEP 513).

  **Piège classique** : `void Compte() { ... }` n'est pas un constructeur mais une méthode qui porte le nom de la
  classe ; elle n'est jamais appelée par `new`.

  **En entretien** : « Le constructeur garantit qu'un objet naît valide ; le constructeur par défaut n'existe que si on
  n'en déclare aucun, et `this(...)` chaîne les constructeurs. »
cards:
  - key: quand-compilateur-ajoute-constructeur-defaut
    format: course
    question: Quand le compilateur ajoute-t-il un constructeur par défaut ?
    answer: Seulement si la classe ne déclare aucun constructeur.
  - key: type-retour
    format: course
    question: Un constructeur a-t-il un type de retour ?
    answer: Non, pas même `void`. Une « méthode » `void NomDeLaClasse()` est une méthode ordinaire, pas un constructeur.
  - key: this-appel
    format: course
    question: À quoi sert `this(...)` dans un constructeur ?
    answer: À appeler un autre constructeur de la même classe, pour regrouper l'initialisation et la validation à un seul endroit.
  - key: validation
    format: course
    question: Pourquoi valider les arguments dans le constructeur ?
    answer: "Pour qu'aucun objet invalide ne puisse exister : on lève une exception (`IllegalArgumentException`, `NullPointerException` via `Objects.requireNonNull`) avant d'affecter les champs."
  - key: vf-defaut-toujours
    format: true-false
    question: Le compilateur ajoute toujours un constructeur sans paramètre.
    truth: false
    answer: Seulement si la classe n'en déclare aucun.
  - key: vf-void
    format: true-false
    question: "`void Point() { }` est un constructeur de la classe `Point`."
    truth: false
    answer: Avec un type de retour, c'est une méthode qui porte le nom de la classe.
  - key: vf-surcharge
    format: true-false
    question: Une classe peut avoir plusieurs constructeurs.
    truth: true
    answer: Ils se distinguent par leurs paramètres (surcharge).
  - key: vf-private
    format: true-false
    question: Un constructeur peut être `private`.
    truth: true
    answer: C'est courant pour une classe utilitaire, un singleton ou une classe qui n'offre que des fabriques statiques.
  - key: qcm-compile
    format: multiple-choice
    question: "La classe `Personne` déclare seulement `Personne(String nom)`. Quels appels compilent ?"
    choices:
      - text: "`new Personne(\"Ada\")`"
        correct: true
      - text: "`new Personne()`"
        correct: false
      - text: "`Personne(\"Ada\")`"
        correct: false
      - text: "`new Personne(\"Ada\", 36)`"
        correct: false
    answer: Le constructeur sans paramètre n'existe plus dès qu'un autre est déclaré.
  - key: qcm-delegation
    format: multiple-choice
    question: Comment un constructeur appelle-t-il un autre constructeur de la même classe ?
    choices:
      - text: "`this(...)`"
        correct: true
      - text: "`super(...)`"
        correct: false
      - text: "`new NomDeLaClasse(...)`"
        correct: false
      - text: "`NomDeLaClasse(...)`"
        correct: false
    answer: '`super(...)` appelle le constructeur du parent ; `new` créerait un second objet.'
  - key: qcm-exception
    format: multiple-choice
    question: Quelle exception lever pour un argument invalide dans un constructeur ?
    choices:
      - text: "`IllegalArgumentException`"
        correct: true
      - text: "`Exception`"
        correct: false
      - text: "`Error`"
        correct: false
      - text: "Aucune, on met une valeur par défaut en silence"
        correct: false
    answer: Une exception non vérifiée et précise, qui dit pourquoi l'argument est refusé.
  - key: qcm-nom
    format: multiple-choice
    question: Quel est le nom d'un constructeur de la classe `Facture` ?
    choices:
      - text: "`Facture`"
        correct: true
      - text: "`init`"
        correct: false
      - text: "`constructor`"
        correct: false
      - text: "`new`"
        correct: false
    answer: Un constructeur porte exactement le nom de sa classe.
  - key: trous-delegation
    format: fill-in
    question: |-
      Complétez pour qu'un rectangle sans argument mesure 1 × 1 :
      ```java
      Rectangle() {
          ___(1, 1);
      }
      ```
    blanks: [[this]]
    answer: '`this(...)` délègue au constructeur `Rectangle(int, int)`.'
  - key: trous-validation
    format: fill-in
    question: |-
      Complétez pour refuser un âge négatif :
      ```java
      Personne(int age) {
          if (age < 0) {
              ___ new IllegalArgumentException("âge négatif");
          }
          this.age = age;
      }
      ```
    blanks: [[throw]]
    answer: '`throw` lève l''exception, et l''objet n''est jamais construit.'
  - key: trous-champ
    format: fill-in
    question: |-
      Complétez le constructeur :
      ```java
      class Ville {
          private final String nom;
          ___(String nom) {
              this.nom = nom;
          }
      }
      ```
    blanks: [[Ville]]
    answer: Le constructeur porte le nom de la classe, sans type de retour.
  - key: trous-requirenonnull
    format: fill-in
    question: |-
      Complétez pour refuser un nom `null` avec une `NullPointerException` explicite :
      ```java
      this.nom = Objects.___(nom, "nom");
      ```
    blanks: [[requireNonNull]]
    answer: '`Objects.requireNonNull` renvoie l''argument ou lève une exception avec le message donné.'
  - key: code-methode-void
    format: code-output
    question: |-
      ```java
      class Point {
          int x;
          void Point() { x = 5; }
      }
      System.out.println(new Point().x);
      ```
    answer: '`0` : `void Point()` est une méthode, jamais appelée ; le constructeur par défaut laisse `x` à 0.'
    check:
      output: "0"
  - key: code-chaine-constructeurs
    format: code-output
    question: |-
      ```java
      class Rect {
          Rect() { this(1); System.out.print("A"); }
          Rect(int c) { this(c, c); System.out.print("B"); }
          Rect(int l, int h) { System.out.print("C"); }
      }
      new Rect();
      ```
    answer: '`CBA` : chaque constructeur délègue d''abord, puis exécute la suite de son corps.'
    check:
      output: "CBA"
  - key: code-sans-defaut
    format: code-output
    question: |-
      ```java
      class Personne {
          Personne(String nom) {}
      }
      new Personne();
      ```
      Ce code compile-t-il ?
    answer: "Non : le constructeur sans paramètre n'existe pas, puisqu'un autre est déclaré."
    check:
      compiles: false
  - key: code-validation
    format: code-output
    question: |-
      ```java
      class Age {
          final int valeur;
          Age(int valeur) {
              if (valeur < 0) throw new IllegalArgumentException("âge négatif");
              this.valeur = valeur;
          }
      }
      System.out.println(new Age(30).valeur);
      new Age(-1);
      ```
    answer: '`30`, puis une `IllegalArgumentException` : le second objet n''est jamais construit.'
    check:
      output: "30"
      throws: IllegalArgumentException
  - key: bug-constructeur-void
    format: bug-fix
    question: |-
      Le titre reste `null` après `new Livre()` :
      ```java
      class Livre {
          String titre;
          public void Livre() {
              titre = "Sans titre";
          }
      }
      ```
    answer: |-
      ```java
      public Livre() {
          titre = "Sans titre";
      }
      ```
      Avec `void`, c'est une méthode ordinaire ; un constructeur n'a pas de type de retour.
  - key: bug-defaut-disparu
    format: bug-fix
    question: |-
      Depuis qu'on a ajouté un constructeur, `new Client()` ne compile plus :
      ```java
      class Client {
          String nom;
          Client(String nom) { this.nom = nom; }
      }
      ```
    answer: |-
      ```java
      class Client {
          String nom;
          Client() { this("Anonyme"); }
          Client(String nom) { this.nom = nom; }
      }
      ```
      Le constructeur par défaut disparaît dès qu'on en déclare un ; on le réécrit explicitement s'il est nécessaire.
  - key: bug-duplication
    format: bug-fix
    question: |-
      La validation a été corrigée dans un constructeur mais oubliée dans l'autre :
      ```java
      Compte(String titulaire) {
          this.titulaire = titulaire;
          this.solde = 0;
      }
      Compte(String titulaire, double solde) {
          if (solde < 0) throw new IllegalArgumentException("solde négatif");
          this.titulaire = Objects.requireNonNull(titulaire);
          this.solde = solde;
      }
      ```
    answer: |-
      ```java
      Compte(String titulaire) {
          this(titulaire, 0);
      }
      ```
      Le constructeur secondaire délègue au principal avec `this(...)` : la validation n'existe qu'à un endroit.
  - key: bug-objet-invalide
    format: bug-fix
    question: |-
      On trouve en base des produits au prix négatif :
      ```java
      Produit(String nom, double prix) {
          this.nom = nom;
          this.prix = prix;
      }
      ```
    answer: |-
      ```java
      Produit(String nom, double prix) {
          if (prix < 0) {
              throw new IllegalArgumentException("prix négatif : " + prix);
          }
          this.nom = Objects.requireNonNull(nom, "nom");
          this.prix = prix;
      }
      ```
      Le constructeur est le seul passage obligé : y valider garantit qu'aucun produit invalide n'existe.
