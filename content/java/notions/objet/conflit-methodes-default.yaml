notion: conflit-methodes-default
lesson: |-
  Une classe peut hériter de **plusieurs** versions d'une même méthode : d'une classe parente et d'interfaces avec
  `default`. Trois règles tranchent, dans l'ordre :

  1. **La classe gagne** : une méthode déclarée dans la classe ou dans une classe parente l'emporte sur toute méthode
     `default`.
  2. **L'interface la plus spécifique gagne** : si `B extends A` et que les deux définissent `m()`, c'est celle de `B`.
  3. Sinon, c'est **ambigu** : la classe doit **redéfinir** la méthode, et peut appeler une version précise avec
     `Interface.super.m()`.

  ```java
  interface Volant  { default String bouger() { return "voler"; } }
  interface Nageur  { default String bouger() { return "nager"; } }

  class Canard implements Volant, Nageur {
      @Override
      public String bouger() {                         // obligatoire : conflit
          return Volant.super.bouger() + " et " + Nageur.super.bouger();
      }
  }
  ```

  C'est la version Java du **problème du diamant** : l'héritage multiple d'interfaces est permis parce qu'elles n'ont
  pas d'état, et que le conflit de comportement se résout explicitement à la compilation.

  **Piège classique** : croire qu'une méthode `default` d'une interface peut remplacer celle d'une classe parente. La
  classe gagne toujours ; la méthode `default` est ignorée.

  **En entretien** : « Classe d'abord, puis l'interface la plus spécifique ; sinon on redéfinit et on choisit avec
  `X.super.m()`. »
cards:
  - key: probleme-diamant
    format: course
    question: Problème du diamant ?
    answer: Deux `default` identiques → la classe doit redéfinir pour trancher.
  - key: appeler-methode-default-interface-precise-cas
    format: course
    question: Comment appeler la méthode default d'une interface précise en cas de conflit ?
    answer: '`MonInterface.super.methode()`.'
  - key: classe-gagne
    format: course
    question: Une classe hérite de `m()` par sa classe parente et par une méthode `default` d'interface. Laquelle s'applique ?
    answer: "Celle de la classe parente : la classe gagne toujours sur les méthodes `default`."
  - key: plus-specifique
    format: course
    question: Si `B extends A` et que les deux interfaces définissent `default m()`, laquelle hérite une classe qui implémente `A` et `B` ?
    answer: Celle de `B`, l'interface la plus spécifique ; il n'y a pas de conflit.
  - key: vf-conflit-compile
    format: true-false
    question: Une classe qui implémente deux interfaces sans lien, ayant chacune `default String m()`, compile sans redéfinir `m()`.
    truth: false
    answer: Le conflit est une erreur de compilation ; la classe doit redéfinir `m()`.
  - key: vf-classe-gagne
    format: true-false
    question: Une méthode héritée d'une classe parente l'emporte sur une méthode `default` d'interface.
    truth: true
    answer: C'est la première règle de résolution.
  - key: vf-super-syntaxe
    format: true-false
    question: "`Volant.super.bouger()` appelle la méthode `default` de l'interface `Volant`."
    truth: true
    answer: Cette syntaxe n'est permise que pour une interface directement implémentée.
  - key: vf-abstraite-et-default
    format: true-false
    question: Si une interface déclare `m()` abstraite et une autre la déclare `default`, la classe hérite automatiquement de la version `default`.
    truth: false
    answer: "C'est aussi un conflit : la classe doit fournir `m()`."
  - key: qcm-resolution
    format: multiple-choice
    question: Quel est l'ordre des règles de résolution ?
    choices:
      - text: "La classe, puis l'interface la plus spécifique, puis la redéfinition explicite"
        correct: true
      - text: "L'ordre des interfaces dans `implements`"
        correct: false
      - text: "L'interface déclarée en premier dans le fichier"
        correct: false
      - text: "La méthode la plus récente"
        correct: false
    answer: L'ordre d'écriture des interfaces ne compte jamais.
  - key: qcm-syntaxe
    format: multiple-choice
    question: Dans une classe qui implémente `A` et `B`, comment appeler la version `default` de `A` ?
    choices:
      - text: "`A.super.m()`"
        correct: true
      - text: "`super.A.m()`"
        correct: false
      - text: "`A.m()`"
        correct: false
      - text: "`((A) this).m()`"
        correct: false
    answer: '`((A) this).m()` rappellerait la version de la classe : récursion infinie.'
  - key: qcm-pourquoi-possible
    format: multiple-choice
    question: Pourquoi Java autorise-t-il l'héritage multiple d'interfaces mais pas de classes ?
    choices:
      - text: "Les interfaces n'ont pas d'état, et les conflits de méthodes se résolvent à la compilation"
        correct: true
      - text: "Les interfaces sont plus rapides"
        correct: false
      - text: "Les classes ne peuvent pas avoir de méthodes"
        correct: false
      - text: "C'est une limite de la JVM sans raison de conception"
        correct: false
    answer: Le diamant d'état (deux copies d'un champ) ne peut pas se produire avec des interfaces.
  - key: qcm-compile
    format: multiple-choice
    question: "`A` et `B` (sans lien) ont `default String m()`. Quelles classes `C implements A, B` compilent ?"
    choices:
      - text: "Avec `public String m() { return A.super.m(); }`"
        correct: true
      - text: "Avec `public String m() { return \"C\"; }`"
        correct: true
      - text: "Sans redéfinir `m()`"
        correct: false
      - text: "Avec `String m() { return \"C\"; }` (sans `public`)"
        correct: false
    answer: La redéfinition est obligatoire, et `public` comme toute méthode d'interface.
  - key: code-classe-gagne
    format: code-output
    question: |-
      ```java
      interface Volant { default String bouger() { return "voler"; } }
      class Animal { public String bouger() { return "marcher"; } }
      class Canard extends Animal implements Volant { }
      System.out.println(new Canard().bouger());
      ```
    answer: '`marcher` : la méthode de la classe parente l''emporte sur la méthode `default`.'
    check:
      output: "marcher"
  - key: code-plus-specifique
    format: code-output
    question: |-
      ```java
      interface A { default String m() { return "A"; } }
      interface B extends A { default String m() { return "B"; } }
      class C implements A, B { }
      System.out.println(new C().m());
      ```
    answer: '`B` : l''interface la plus spécifique gagne.'
    check:
      output: "B"
  - key: code-conflit
    format: code-output
    question: |-
      ```java
      interface A { default String m() { return "A"; } }
      interface B { default String m() { return "B"; } }
      class C implements A, B { }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `class C inherits unrelated defaults for m() from types A and B`.'
    check:
      compiles: false
  - key: code-super-choisi
    format: code-output
    question: |-
      ```java
      interface A { default String m() { return "A"; } }
      interface B { default String m() { return "B"; } }
      class C implements A, B {
          public String m() { return A.super.m() + B.super.m(); }
      }
      System.out.println(new C().m());
      ```
    answer: '`AB` : la classe tranche le conflit et combine les deux versions.'
    check:
      output: "AB"
  - key: bug-conflit
    format: bug-fix
    question: |-
      Ce code ne compile pas (`inherits unrelated defaults for afficher()`) :
      ```java
      interface Imprimable { default String afficher() { return "imprimable"; } }
      interface Partageable { default String afficher() { return "partageable"; } }
      class Rapport implements Imprimable, Partageable { }
      ```
    answer: |-
      ```java
      class Rapport implements Imprimable, Partageable {
          @Override
          public String afficher() {
              return Imprimable.super.afficher();
          }
      }
      ```
      Deux versions `default` sans lien : la classe doit redéfinir la méthode et choisir (ou combiner).
  - key: bug-recursion-cast
    format: bug-fix
    question: |-
      `rapport.afficher()` lève une `StackOverflowError` :
      ```java
      class Rapport implements Imprimable, Partageable {
          @Override
          public String afficher() {
              return ((Imprimable) this).afficher();
          }
      }
      ```
    answer: |-
      ```java
      @Override
      public String afficher() {
          return Imprimable.super.afficher();
      }
      ```
      Caster `this` ne change pas l'objet : l'appel est virtuel et rappelle `Rapport.afficher()`. Seul
      `Imprimable.super.afficher()` atteint la version `default`.
  - key: bug-default-ignoree
    format: bug-fix
    question: |-
      La nouvelle méthode `default` de `Tracable` n'est jamais utilisée par `Commande` :
      ```java
      interface Tracable { default String identifiant() { return "TRACE-" + UUID.randomUUID(); } }
      class Entite { public String identifiant() { return id.toString(); } }
      class Commande extends Entite implements Tracable { }
      ```
    answer: |-
      ```java
      class Commande extends Entite implements Tracable {
          @Override
          public String identifiant() {
              return Tracable.super.identifiant();
          }
      }
      ```
      La méthode héritée de la classe `Entite` gagne toujours sur la méthode `default`. Si l'on veut la version de
      l'interface, il faut le dire explicitement (et se demander si les deux notions d'identifiant doivent vraiment
      porter le même nom).
  - key: bug-abstraite-et-default
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      interface Source { String lire(); }
      interface SourceParDefaut { default String lire() { return ""; } }
      class Fichier implements Source, SourceParDefaut { }
      ```
    answer: |-
      ```java
      class Fichier implements Source, SourceParDefaut {
          @Override
          public String lire() {
              return SourceParDefaut.super.lire();
          }
      }
      ```
      Une méthode abstraite et une méthode `default` de même signature, venues d'interfaces sans lien, sont en conflit :
      la classe doit fournir l'implémentation, quitte à déléguer à la version `default`.
