notion: conflit-methodes-default
lesson: |-
  Une classe peut hériter de **plusieurs** versions d'une même méthode : d'une classe parente et d'interfaces avec
  `default`. Trois règles tranchent, dans l'ordre :

  1. **La classe gagne** : une méthode déclarée dans la classe ou dans une classe parente l'emporte sur toute méthode
     `default`.
  2. **L'interface la plus spécifique gagne** : si `B extends A` et que les deux définissent `m()`, c'est celle de `B`.
  3. Sinon, c'est **ambigu** : la classe doit **redéfinir** la méthode, et peut appeler une version précise avec
     `Interface.super.m()`.

  ```java
  interface Volant  { default String bouger() { return "voler"; } }
  interface Nageur  { default String bouger() { return "nager"; } }

  class Canard implements Volant, Nageur {
      @Override
      public String bouger() {                         // obligatoire : conflit
          return Volant.super.bouger() + " et " + Nageur.super.bouger();
      }
  }
  ```

  C'est la version Java du **problème du diamant** : l'héritage multiple d'interfaces est permis parce qu'elles n'ont
  pas d'état, et que le conflit de comportement se résout explicitement à la compilation.

  **Piège classique** : croire qu'une méthode `default` d'une interface peut remplacer celle d'une classe parente. La
  classe gagne toujours ; la méthode `default` est ignorée.

  **En entretien** : « Classe d'abord, puis l'interface la plus spécifique ; sinon on redéfinit et on choisit avec
  `X.super.m()`. »
cards:
  - key: probleme-diamant
    format: course
    question: "Qu'est-ce que le problème du diamant avec les méthodes `default` ?"
    choices:
      - {text: "Une classe hérite de deux `default` de même signature, d'interfaces sans lien : elle doit trancher", correct: true}
      - {text: "Une classe hérite de deux `default` de même signature : la JVM prend celle écrite en premier", correct: false}
      - {text: "Une interface étend deux classes qui ont la même méthode, ce que le compilateur refuse", correct: false}
      - {text: "Une classe hérite d'un même champ par deux interfaces, et en garde deux copies", correct: false}
    answer: |-
      Deux interfaces sans lien fournissent la même méthode `default` : le compilateur refuse de choisir, et la classe
      doit la redéfinir (avec `A.super.m()` au besoin). L'ordre dans `implements` ne compte jamais.
  - key: appeler-methode-default-interface-precise-cas
    format: course
    question: "En cas de conflit, comment appeler la méthode `default` d'une interface précise ?"
    choices:
      - {text: "`MonInterface.super.methode()`", correct: true}
      - {text: "`super.methode()`", correct: false}
      - {text: "`((MonInterface) this).methode()`", correct: false}
      - {text: "`MonInterface.methode()`", correct: false}
    answer: |-
      `MonInterface.super.methode()` vise la version `default` de cette interface. `super.methode()` désigne la classe
      parente, un cast de `this` rappelle la méthode redéfinie (l'appel reste virtuel), et `MonInterface.methode()` ne
      vaut que pour une méthode `static`.
  - key: classe-gagne
    format: course
    question: Une classe hérite de `m()` par sa classe parente et par une méthode `default` d'interface. Laquelle s'applique ?
    choices:
      - {text: "Celle de la classe parente : la classe gagne toujours sur une `default`", correct: true}
      - {text: "Celle de l'interface : la méthode `default` est la plus récente", correct: false}
      - {text: "Aucune : le compilateur signale un conflit que la classe doit trancher", correct: false}
      - {text: "Celle qui est écrite en dernier dans `extends ... implements`", correct: false}
    answer: |-
      Celle de la classe parente : une méthode héritée d'une classe gagne toujours sur une méthode `default`. Il n'y a
      donc pas de conflit à trancher.
  - key: plus-specifique
    format: course
    question: Si `B extends A` et que les deux interfaces définissent `default m()`, laquelle hérite une classe qui implémente `A` et `B` ?
    choices:
      - {text: "Celle de `B`, l'interface la plus spécifique : il n'y a pas de conflit", correct: true}
      - {text: "Celle de `A`, l'interface parente, dont `B` hérite la méthode", correct: false}
      - {text: "Aucune : le compilateur exige que la classe redéfinisse `m()`", correct: false}
      - {text: "Celle de l'interface écrite en premier dans `implements`", correct: false}
    answer: "Celle de `B`, l'interface la plus spécifique, qui redéfinit celle de `A` ; il n'y a pas de conflit."
  - key: vf-conflit-compile
    format: true-false
    question: Une classe qui implémente deux interfaces sans lien, ayant chacune `default String m()`, compile sans redéfinir `m()`.
    truth: false
    answer: Le conflit est une erreur de compilation ; la classe doit redéfinir `m()`.
  - key: vf-classe-gagne
    format: true-false
    question: Une méthode héritée d'une classe parente l'emporte sur une méthode `default` d'interface.
    truth: true
    answer: C'est la première règle de résolution.
  - key: vf-super-syntaxe
    format: true-false
    question: "`Volant.super.bouger()` appelle la méthode `default` de l'interface `Volant`."
    truth: true
    answer: Cette syntaxe n'est permise que pour une interface directement implémentée.
  - key: vf-abstraite-et-default
    format: true-false
    question: Si une interface déclare `m()` abstraite et une autre la déclare `default`, la classe hérite automatiquement de la version `default`.
    truth: false
    answer: "C'est aussi un conflit : la classe doit fournir `m()`."
  - key: qcm-resolution
    format: multiple-choice
    question: "Dans quel ordre Java applique-t-il les règles qui choisissent une méthode héritée de plusieurs côtés ?"
    choices:
      - {text: "La classe, puis l'interface la plus spécifique, puis la redéfinition explicite", correct: true}
      - {text: "L'ordre des interfaces dans `implements`, de gauche à droite, puis la classe parente", correct: false}
      - {text: "L'interface déclarée en premier dans le fichier source, puis celle qui la suit", correct: false}
      - {text: "La méthode compilée le plus récemment, puis la classe parente, puis l'interface", correct: false}
    answer: |-
      La classe gagne, puis l'interface la plus spécifique ; sinon la classe doit redéfinir la méthode. L'ordre
      d'écriture des interfaces ne compte jamais.
  - key: qcm-syntaxe
    format: multiple-choice
    question: Dans une classe qui implémente `A` et `B`, comment appeler la version `default` de `A` ?
    choices:
      - text: "`A.super.m()`"
        correct: true
      - text: "`super.A.m()`"
        correct: false
      - text: "`A.m()`"
        correct: false
      - text: "`((A) this).m()`"
        correct: false
    answer: '`((A) this).m()` rappellerait la version de la classe : récursion infinie.'
  - key: qcm-pourquoi-possible
    format: multiple-choice
    question: Pourquoi Java autorise-t-il l'héritage multiple d'interfaces mais pas de classes ?
    choices:
      - {text: "Les interfaces n'ont pas d'état, et les conflits de méthodes se résolvent à la compilation", correct: true}
      - {text: "Les interfaces n'ont jamais de méthodes avec du code, donc aucun conflit n'est possible", correct: false}
      - {text: "Les interfaces sont plus rapides à appeler, ce qui compense le coût des conflits", correct: false}
      - {text: "La JVM ne sait charger qu'une classe parente, une limite sans raison de conception", correct: false}
    answer: |-
      Le diamant d'état (deux copies d'un champ) ne peut pas se produire avec des interfaces. Depuis Java 8, elles ont
      du code (`default`), mais un conflit se tranche à la compilation.
  - key: qcm-compile
    format: multiple-choice
    question: "`A` et `B` (sans lien) ont `default String m()`. Laquelle de ces classes `C implements A, B` compile ?"
    choices:
      - {text: "Avec `public String m() { return A.super.m(); }`", correct: true}
      - {text: "Avec `public String m() { return super.m(); }`", correct: false}
      - {text: "Avec `String m() { return \"C\"; }` (sans `public`)", correct: false}
      - {text: "Sans redéfinir `m()`, puisque les deux versions existent", correct: false}
    answer: |-
      La redéfinition est obligatoire, et `public` comme toute méthode d'interface ; `A.super.m()` choisit la version de
      `A`. `super.m()` viserait `Object`, qui n'a pas de `m()`.
  - key: code-classe-gagne
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      interface Volant { default String bouger() { return "voler"; } }
      class Animal { public String bouger() { return "marcher"; } }
      class Canard extends Animal implements Volant { }
      System.out.println(new Canard().bouger());
      ```
    choices:
      - {text: "`marcher`", correct: true}
      - {text: "`voler`", correct: false}
      - {text: "`marchervoler`", correct: false}
      - {text: "Ça ne compile pas : `bouger()` est en conflit", correct: false}
    answer: '`marcher` : la méthode de la classe parente l''emporte sur la méthode `default`.'
    check:
      output: "marcher"
  - key: code-plus-specifique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      interface A { default String m() { return "A"; } }
      interface B extends A { default String m() { return "B"; } }
      class C implements A, B { }
      System.out.println(new C().m());
      ```
    choices:
      - {text: "`B`", correct: true}
      - {text: "`A`", correct: false}
      - {text: "`AB`", correct: false}
      - {text: "Ça ne compile pas : `C` doit redéfinir `m()`", correct: false}
    answer: '`B` : l''interface la plus spécifique gagne.'
    check:
      output: "B"
  - key: code-conflit
    format: code-output
    question: |-
      Ce code compile-t-il ? Si oui, que renvoie `new C().m()` ?
      ```java
      interface A { default String m() { return "A"; } }
      interface B { default String m() { return "B"; } }
      class C implements A, B { }
      ```
    choices:
      - {text: "Ça ne compile pas : `C` hérite de deux `default` sans lien", correct: true}
      - {text: "Ça compile, et `new C().m()` renvoie `\"A\"`", correct: false}
      - {text: "Ça compile, et `new C().m()` renvoie `\"B\"`", correct: false}
      - {text: "Ça compile, mais l'appel lève une exception", correct: false}
    answer: |-
      Ça ne compile pas : `class C inherits unrelated defaults for m() from types A and B`. La classe doit redéfinir
      `m()` pour trancher ; l'ordre dans `implements` ne choisit rien.
    check:
      compiles: false
  - key: code-super-choisi
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      interface A { default String m() { return "A"; } }
      interface B { default String m() { return "B"; } }
      class C implements A, B {
          public String m() { return A.super.m() + B.super.m(); }
      }
      System.out.println(new C().m());
      ```
    choices:
      - {text: "`AB`", correct: true}
      - {text: "`BA`", correct: false}
      - {text: "`A`", correct: false}
      - {text: "Ça ne compile pas : `A` et `B` sont en conflit", correct: false}
    answer: '`AB` : la classe tranche le conflit et combine les deux versions.'
    check:
      output: "AB"
  - key: bug-conflit
    format: bug-fix
    question: |-
      Ce code ne compile pas (`inherits unrelated defaults for afficher()`). Quelle correction est la bonne ?
      ```java
      interface Imprimable { default String afficher() { return "imprimable"; } }
      interface Partageable { default String afficher() { return "partageable"; } }
      class Rapport implements Imprimable, Partageable { }
      ```
    choices:
      - {text: "Redéfinir `afficher()` dans `Rapport`, en appelant `Imprimable.super.afficher()`", correct: true}
      - {text: "Redéfinir `afficher()` dans `Rapport`, en appelant `super.afficher()`", correct: false}
      - {text: "Inverser l'ordre : `implements Partageable, Imprimable`", correct: false}
      - {text: "Déclarer `Rapport` `abstract`, pour laisser le choix à ses sous-classes", correct: false}
    answer: |-
      ```java
      class Rapport implements Imprimable, Partageable {
          @Override
          public String afficher() {
              return Imprimable.super.afficher();
          }
      }
      ```
      Deux versions `default` sans lien : la classe doit redéfinir la méthode et choisir (ou combiner). `super.afficher()`
      viserait `Object`, et ni l'ordre ni `abstract` ne lèvent le conflit.
  - key: bug-recursion-cast
    format: bug-fix
    question: |-
      `rapport.afficher()` lève une `StackOverflowError`. Pourquoi ?
      ```java
      class Rapport implements Imprimable, Partageable {
          @Override
          public String afficher() {
              return ((Imprimable) this).afficher();
          }
      }
      ```
    choices:
      - {text: "Caster `this` ne change pas l'objet : l'appel reste virtuel et rappelle `Rapport.afficher()`", correct: true}
      - {text: "Le cast vers `Imprimable` échoue en silence et la méthode se relance pour réessayer", correct: false}
      - {text: "Une méthode `default` redéfinie s'appelle toujours elle-même, quelle que soit la syntaxe", correct: false}
      - {text: "`Imprimable` et `Partageable` sont en conflit, et la JVM alterne entre leurs deux versions", correct: false}
    answer: |-
      ```java
      @Override
      public String afficher() {
          return Imprimable.super.afficher();
      }
      ```
      Caster `this` ne change pas l'objet : l'appel est virtuel et rappelle `Rapport.afficher()`, sans fin. Seul
      `Imprimable.super.afficher()` atteint la version `default`.
  - key: bug-default-ignoree
    format: bug-fix
    question: |-
      La nouvelle méthode `default` de `Tracable` n'est jamais utilisée par `Commande`. Pourquoi ?
      ```java
      interface Tracable { default String identifiant() { return "TRACE-" + UUID.randomUUID(); } }
      class Entite { public String identifiant() { return id.toString(); } }
      class Commande extends Entite implements Tracable { }
      ```
    choices:
      - {text: "La méthode héritée de la classe `Entite` gagne toujours sur une méthode `default`", correct: true}
      - {text: "`Tracable` est écrite après `Entite` : l'ordre de déclaration la fait passer après", correct: false}
      - {text: "Une méthode `default` ne s'applique qu'aux classes qui n'ont pas de classe parente", correct: false}
      - {text: "`UUID.randomUUID()` n'est appelé qu'une fois, au chargement de l'interface", correct: false}
    answer: |-
      ```java
      class Commande extends Entite implements Tracable {
          @Override
          public String identifiant() {
              return Tracable.super.identifiant();
          }
      }
      ```
      La méthode héritée de la classe `Entite` gagne toujours sur la méthode `default`. Pour la version de l'interface,
      il faut le dire explicitement (et se demander si les deux identifiants doivent vraiment porter le même nom).
  - key: bug-abstraite-et-default
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      interface Source { String lire(); }
      interface SourceParDefaut { default String lire() { return ""; } }
      class Fichier implements Source, SourceParDefaut { }
      ```
    choices:
      - {text: "Redéfinir `lire()` dans `Fichier`, en déléguant à `SourceParDefaut.super.lire()`", correct: true}
      - {text: "Inverser l'ordre des interfaces : `implements SourceParDefaut, Source`", correct: false}
      - {text: "Rendre `lire()` `default` dans `Source` aussi, avec un corps qui renvoie `\"\"`", correct: false}
      - {text: "Redéfinir `lire()` dans `Fichier`, en déléguant à `super.lire()`", correct: false}
    answer: |-
      ```java
      class Fichier implements Source, SourceParDefaut {
          @Override
          public String lire() {
              return SourceParDefaut.super.lire();
          }
      }
      ```
      Une méthode abstraite et une méthode `default` de même signature, venues d'interfaces sans lien, sont en conflit :
      la classe doit fournir l'implémentation, quitte à déléguer à la version `default`.
