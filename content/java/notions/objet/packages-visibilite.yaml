notion: packages-visibilite
lesson: |-
  Un **package** regroupe des classes liées et forme un espace de noms. Il se déclare en **première ligne** du fichier,
  et l'arborescence des dossiers suit son nom :

  ```java
  // fichier src/main/java/com/recallio/content/Carte.java
  package com.recallio.content;

  import java.util.List;                 // une classe
  import java.time.*;                    // toutes les classes du package java.time
  import static java.lang.Math.max;      // un membre static

  public class Carte { ... }
  ```

  - Convention : le **nom de domaine inversé** (`com.entreprise.projet.module`), en minuscules.
  - `java.lang` (`String`, `Math`...) est importé d'office ; les classes du même package aussi.
  - `import java.util.*;` n'importe **pas** les sous-packages (`java.util.function` est un autre package).
  - Les packages ne sont **pas hiérarchiques** pour l'accès : `com.a.b` ne voit pas les membres package-private de
    `com.a`. Pour la visibilité, ce sont deux packages sans lien.
  - Deux classes de même nom (`java.util.Date` et `java.sql.Date`) : on en importe une et on écrit l'autre en **nom
    complet**.
  - Le **package par défaut** (pas de `package`) est réservé aux essais : on ne peut pas en importer de classe.

  On utilise la visibilité **package-private** pour cacher les classes d'implémentation d'un module : seul ce qui est
  `public` forme son API.

  **Piège classique** : penser que `com.boutique.commande.interne` peut utiliser les classes package-private de
  `com.boutique.commande`. Ce n'est pas le cas.

  **En entretien** : « Un package est un espace de noms et une frontière de visibilité ; les sous-packages n'ont aucun
  accès privilégié à leur parent. »
cards:
  - key: role-package
    format: course
    question: À quoi sert un package ?
    answer: À regrouper des classes liées, à éviter les collisions de noms (espace de noms) et à délimiter la visibilité package-private.
  - key: sous-packages
    format: course
    question: "`com.app.service.interne` a-t-il accès aux membres package-private de `com.app.service` ?"
    answer: "Non : pour l'accès, deux packages sont indépendants, même si l'un « contient » l'autre dans son nom."
  - key: collision-noms
    format: course
    question: Comment utiliser `java.util.Date` et `java.sql.Date` dans le même fichier ?
    answer: On importe l'une et on écrit l'autre avec son nom complet (`java.sql.Date`).
  - key: import-static
    format: course
    question: Que fait `import static` ?
    answer: "Il importe des membres `static` (méthodes, constantes) pour les utiliser sans le nom de la classe : `import static java.lang.Math.max;` puis `max(a, b)`."
  - key: vf-java-lang
    format: true-false
    question: Il faut importer `java.lang.String` pour utiliser `String`.
    truth: false
    answer: '`java.lang` est importé automatiquement.'
  - key: vf-etoile-sous-packages
    format: true-false
    question: "`import java.util.*;` importe aussi `java.util.function.Function`."
    truth: false
    answer: L'étoile n'importe que les classes du package lui-même, pas celles des sous-packages.
  - key: vf-premiere-ligne
    format: true-false
    question: La déclaration `package` doit être la première instruction du fichier.
    truth: true
    answer: Seuls des commentaires (et des annotations de package dans `package-info.java`) peuvent la précéder.
  - key: vf-package-defaut
    format: true-false
    question: On peut importer une classe du package par défaut depuis un package nommé.
    truth: false
    answer: "C'est impossible : le package par défaut ne sert qu'aux essais."
  - key: qcm-nom
    format: multiple-choice
    question: Quel nom de package respecte les conventions ?
    choices:
      - text: "`com.boutique.facturation`"
        correct: true
      - text: "`Com.Boutique.Facturation`"
        correct: false
      - text: "`facturation_Boutique`"
        correct: false
      - text: "`boutique-facturation`"
        correct: false
    answer: Domaine inversé, en minuscules, séparé par des points (un tiret n'est pas permis).
  - key: qcm-dossier
    format: multiple-choice
    question: Où doit se trouver le fichier de la classe `com.app.Client` ?
    choices:
      - text: "`com/app/Client.java`, sous la racine des sources"
        correct: true
      - text: "N'importe où, le package suffit"
        correct: false
      - text: "`com.app/Client.java`"
        correct: false
      - text: "`Client/com/app.java`"
        correct: false
    answer: L'arborescence suit le nom du package (le compilateur et les outils de build l'attendent).
  - key: qcm-api-module
    format: multiple-choice
    question: Comment cacher les classes d'implémentation d'un package aux autres packages ?
    choices:
      - text: "Les déclarer sans modificateur (package-private)"
        correct: true
      - text: "Les déclarer `private`"
        correct: false
      - text: "Les déclarer `protected`"
        correct: false
      - text: "Les mettre dans un sous-package"
        correct: false
    answer: Une classe de premier niveau package-private n'est visible que dans son package.
  - key: qcm-import-utile
    format: multiple-choice
    question: Lesquels de ces imports sont inutiles ?
    choices:
      - text: "`import java.lang.Math;`"
        correct: true
      - text: "Importer une classe du même package"
        correct: true
      - text: "`import java.util.List;`"
        correct: false
      - text: "`import java.time.LocalDate;`"
        correct: false
    answer: '`java.lang` et le package courant sont visibles sans import.'
  - key: trous-package
    format: fill-in
    question: |-
      Complétez la première ligne du fichier `com/boutique/Panier.java` :
      ```java
      ___ com.boutique;

      public class Panier { }
      ```
    blanks: [[package]]
    answer: La déclaration `package` vient en tête du fichier.
  - key: trous-import
    format: fill-in
    question: |-
      Complétez pour utiliser `LocalDate` :
      ```java
      ___ java.time.LocalDate;
      ```
    blanks: [[import]]
    answer: '`import` permet d''écrire le nom simple de la classe.'
  - key: trous-import-static
    format: fill-in
    question: |-
      Complétez pour pouvoir écrire `assertEquals(...)` sans préfixe :
      ```java
      import ___ org.junit.jupiter.api.Assertions.assertEquals;
      ```
    blanks: [[static]]
    answer: '`import static` importe un membre `static`.'
  - key: trous-nom-complet
    format: fill-in
    question: |-
      `java.util.Date` est importé ; complétez pour utiliser aussi la `Date` de `java.sql` :
      ```java
      ___.Date dateSql = new java.sql.Date(0);
      ```
    blanks: [[java.sql]]
    answer: En cas de collision, on écrit le nom complet de la seconde classe.
  - key: bug-sous-package
    format: bug-fix
    question: |-
      Ce code ne compile pas (`Tarif is not public in com.boutique.prix; cannot be accessed from outside package`) :
      ```java
      package com.boutique.prix.interne;

      class Calcul {
          double total(com.boutique.prix.Tarif t) { ... }
      }
      ```
      `Tarif` est une classe package-private de `com.boutique.prix`.
    answer: |-
      ```java
      package com.boutique.prix;

      class Calcul {
          double total(Tarif t) { ... }
      }
      ```
      Un sous-package n'a aucun accès privilégié : on rapproche `Calcul` de `Tarif` dans le même package (ou on rend
      `Tarif` public si elle fait vraiment partie de l'API).
  - key: bug-collision
    format: bug-fix
    question: |-
      Ce code ne compile pas (`a type with the same simple name Date is already defined by the single-type-import`) :
      ```java
      import java.util.Date;
      import java.sql.Date;
      ```
    answer: |-
      ```java
      import java.util.Date;

      // plus bas
      java.sql.Date dateSql = new java.sql.Date(maintenant.getTime());
      ```
      Deux imports ne peuvent pas donner le même nom simple : l'une des classes s'écrit en nom complet. (En code
      récent, `java.time` remplace d'ailleurs les deux.)
  - key: bug-etoile
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: class Function`) :
      ```java
      import java.util.*;

      Function<String, Integer> longueur = String::length;
      ```
    answer: |-
      ```java
      import java.util.function.Function;
      ```
      `java.util.*` n'importe pas les sous-packages : `java.util.function` est un package distinct.
  - key: bug-package-dossier
    format: bug-fix
    question: |-
      Maven ne trouve pas la classe, qui compile pourtant seule. Le fichier est
      `src/main/java/Client.java` et commence par :
      ```java
      package com.boutique.client;
      ```
    answer: |-
      Déplacer le fichier dans `src/main/java/com/boutique/client/Client.java`.

      L'arborescence doit suivre le nom du package : les outils (Maven, l'IDE, le chargement des classes) cherchent
      `com/boutique/client/Client.class`.
