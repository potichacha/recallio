notion: packages-visibilite
lesson: |-
  Un **package** regroupe des classes liées et forme un espace de noms. Il se déclare en **première ligne** du fichier,
  et l'arborescence des dossiers suit son nom :

  ```java
  // fichier src/main/java/com/recallio/content/Carte.java
  package com.recallio.content;

  import java.util.List;                 // une classe
  import java.time.*;                    // toutes les classes du package java.time
  import static java.lang.Math.max;      // un membre static

  public class Carte { ... }
  ```

  - Convention : le **nom de domaine inversé** (`com.entreprise.projet.module`), en minuscules.
  - `java.lang` (`String`, `Math`...) est importé d'office ; les classes du même package aussi.
  - `import java.util.*;` n'importe **pas** les sous-packages (`java.util.function` est un autre package).
  - Les packages ne sont **pas hiérarchiques** pour l'accès : `com.a.b` ne voit pas les membres package-private de
    `com.a`. Pour la visibilité, ce sont deux packages sans lien.
  - Deux classes de même nom (`java.util.Date` et `java.sql.Date`) : on en importe une et on écrit l'autre en **nom
    complet**.
  - Le **package par défaut** (pas de `package`) est réservé aux essais : on ne peut pas en importer de classe.

  On utilise la visibilité **package-private** pour cacher les classes d'implémentation d'un module : seul ce qui est
  `public` forme son API.

  **Piège classique** : penser que `com.boutique.commande.interne` peut utiliser les classes package-private de
  `com.boutique.commande`. Ce n'est pas le cas.

  **En entretien** : « Un package est un espace de noms et une frontière de visibilité ; les sous-packages n'ont aucun
  accès privilégié à leur parent. »
tour:
  - title: Packages et visibilité
    text: |-
      Un **package** regroupe des classes liées, et forme un espace de noms. Son nom suit l'arborescence des dossiers :
      `geometrie/Cercle.java` commence par `package geometrie;`.

      Un membre sans modificateur n'est visible que dans son package. Depuis un autre package, on n'accède qu'aux
      classes et aux membres `public` (et `protected` pour une sous-classe). Ici, `Main` utilise la classe `Cercle` du
      package `geometrie`.

      Essaie : appelle `c.diametre()` dans `main`.
    example:
      files:
        Main.java: |-
          import geometrie.Cercle;

          void main() {
              Cercle c = new Cercle(1);
              IO.println(String.format("%.2f", c.aire()));
          }
        geometrie/Cercle.java: |-
          package geometrie;

          public class Cercle {
              private final double rayon;

              public Cercle(double rayon) {
                  this.rayon = rayon;
              }

              public double aire() {
                  return Math.PI * rayon * rayon;
              }

              double diametre() {
                  return 2 * rayon;
              }
          }
      output: |-
        3.14
cards:
  - key: role-package
    format: course
    question: "Quels sont les trois rôles d'un package en Java ?"
    choices:
      - {text: "Regrouper des classes liées, éviter les collisions de noms, délimiter la visibilité", correct: true}
      - {text: "Compiler les classes ensemble, les charger plus vite, les rendre toutes publiques", correct: false}
      - {text: "Regrouper des classes, partager leurs champs `static`, permettre l'héritage multiple", correct: false}
      - {text: "Ranger les fichiers sur le disque, chiffrer le bytecode, limiter la mémoire allouée", correct: false}
    answer: "Un package regroupe des classes liées, sert d'espace de noms (deux `Date` peuvent coexister) et délimite la visibilité package-private. Il ne change rien à la vitesse de compilation ni de chargement."
  - key: sous-packages
    format: course
    question: "`com.app.service.interne` a-t-il accès aux membres package-private de `com.app.service` ?"
    choices:
      - {text: "Non : deux packages sont indépendants, quel que soit leur nom", correct: true}
      - {text: "Oui : un sous-package hérite des accès de son package parent", correct: false}
      - {text: "Oui, mais seulement pour les membres `protected` du parent", correct: false}
      - {text: "Seulement si les deux packages sont dans le même JAR", correct: false}
    answer: "Non : pour l'accès, deux packages sont indépendants, même si l'un « contient » l'autre dans son nom. La hiérarchie des noms n'est qu'une convention de rangement."
  - key: collision-noms
    format: course
    question: Comment utiliser `java.util.Date` et `java.sql.Date` dans le même fichier ?
    choices:
      - {text: "Importer l'une, et écrire l'autre avec son nom complet", correct: true}
      - {text: "Importer les deux : le compilateur choisit selon l'usage", correct: false}
      - {text: "Renommer l'une à l'import : `import java.sql.Date as DateSql;`", correct: false}
      - {text: "C'est impossible : il faut deux fichiers séparés", correct: false}
    answer: "On importe l'une et on écrit l'autre avec son nom complet (`java.sql.Date`). Java n'a pas d'alias d'import, et deux imports du même nom simple ne compilent pas."
  - key: import-static
    format: course
    question: Que fait `import static` ?
    choices:
      - {text: "Il importe des membres `static` pour les utiliser sans le nom de leur classe", correct: true}
      - {text: "Il importe une classe et rend toutes ses méthodes `static`", correct: false}
      - {text: "Il importe une classe une seule fois, au démarrage de la JVM", correct: false}
      - {text: "Il importe un package entier, avec tous ses sous-packages", correct: false}
    answer: "Il importe des membres `static` (méthodes, constantes) : après `import static java.lang.Math.max;`, on écrit `max(a, b)` au lieu de `Math.max(a, b)`."
  - key: vf-java-lang
    format: true-false
    question: "Une classe doit importer `java.lang.Math` pour appeler `Math.max`."
    truth: false
    answer: '`java.lang` est importé automatiquement.'
  - key: vf-etoile-sous-packages
    format: true-false
    question: "`import java.util.*;` importe aussi `java.util.function.Function`."
    truth: false
    answer: L'étoile n'importe que les classes du package lui-même, pas celles des sous-packages.
  - key: vf-premiere-ligne
    format: true-false
    question: La déclaration `package` doit être la première instruction du fichier.
    truth: true
    answer: Seuls des commentaires (et des annotations de package dans `package-info.java`) peuvent la précéder.
  - key: vf-package-defaut
    format: true-false
    question: On peut importer une classe du package par défaut depuis un package nommé.
    truth: false
    answer: "C'est impossible : le package par défaut ne sert qu'aux essais."
  - key: qcm-nom
    format: multiple-choice
    question: "Une boutique possède le domaine boutique.com. Quel nom donne-t-elle au package de sa facturation ?"
    choices:
      - text: "`com.boutique.facturation`"
        correct: true
      - text: "`Com.Boutique.Facturation`"
        correct: false
      - text: "`facturation_Boutique`"
        correct: false
      - text: "`boutique-facturation`"
        correct: false
    answer: Domaine inversé, en minuscules, séparé par des points (un tiret n'est pas permis).
  - key: qcm-dossier
    format: multiple-choice
    question: Où doit se trouver le fichier de la classe `com.app.Client` ?
    choices:
      - text: "`com/app/Client.java`, sous la racine des sources"
        correct: true
      - text: "N'importe où, le package suffit"
        correct: false
      - text: "`com.app/Client.java`"
        correct: false
      - text: "`Client/com/app.java`"
        correct: false
    answer: L'arborescence suit le nom du package (le compilateur et les outils de build l'attendent).
  - key: qcm-api-module
    format: multiple-choice
    question: Comment cacher les classes d'implémentation d'un package aux autres packages ?
    choices:
      - text: "Les déclarer sans modificateur (package-private)"
        correct: true
      - text: "Les déclarer `private`"
        correct: false
      - text: "Les déclarer `protected`"
        correct: false
      - text: "Les mettre dans un sous-package"
        correct: false
    answer: Une classe de premier niveau package-private n'est visible que dans son package.
  - key: qcm-import-utile
    format: multiple-choice
    question: Lesquels de ces imports sont inutiles ?
    choices:
      - text: "`import java.lang.Math;`"
        correct: true
      - text: "Importer une classe du même package"
        correct: true
      - text: "`import java.util.List;`"
        correct: false
      - text: "`import java.time.LocalDate;`"
        correct: false
    answer: '`java.lang` et le package courant sont visibles sans import.'
  - key: trous-package
    format: fill-in
    question: |-
      Complète la première ligne du fichier `com/boutique/Panier.java` :
      ```java
      ___ com.boutique;

      public class Panier { }
      ```
    blanks: [[package]]
    answer: La déclaration `package` vient en tête du fichier.
  - key: trous-import
    format: fill-in
    question: |-
      Complète la ligne qui permet d'écrire `LocalDate` sans son package :
      ```java
      ___ java.time.LocalDate;
      ```
    blanks: [[import]]
    answer: '`import` permet d''écrire le nom simple de la classe.'
  - key: trous-import-static
    format: fill-in
    question: |-
      Complète pour pouvoir écrire `assertEquals(...)` sans préfixe :
      ```java
      import ___ org.junit.jupiter.api.Assertions.assertEquals;
      ```
    blanks: [[static]]
    answer: '`import static` importe un membre `static`.'
  - key: trous-nom-complet
    format: fill-in
    question: |-
      `java.util.Date` est importé ; complète pour utiliser aussi la `Date` de `java.sql` :
      ```java
      ___.Date dateSql = new java.sql.Date(0);
      ```
    blanks: [[java.sql]]
    answer: En cas de collision, on écrit le nom complet de la seconde classe.
  - key: bug-sous-package
    format: bug-fix
    question: |-
      Ce code ne compile pas (`Tarif is not public in com.boutique.prix; cannot be accessed from outside package`) :
      ```java
      package com.boutique.prix.interne;

      class Calcul {
          double total(com.boutique.prix.Tarif t) { ... }
      }
      ```
      `Tarif` est une classe package-private de `com.boutique.prix`.
      Quelle correction est la bonne ?
    choices:
      - {text: "Placer `Calcul` dans le package `com.boutique.prix`, à côté de `Tarif`", correct: true}
      - {text: "Ajouter `import com.boutique.prix.Tarif;` en tête du fichier", correct: false}
      - {text: "Rendre `Calcul` publique pour qu'elle puisse voir `Tarif`", correct: false}
      - {text: "Déclarer `Tarif` `protected` pour l'ouvrir aux sous-packages", correct: false}
    answer: |-
      ```java
      package com.boutique.prix;

      class Calcul {
          double total(Tarif t) { ... }
      }
      ```
      Un sous-package n'a aucun accès privilégié : on rapproche `Calcul` de `Tarif` dans le même package (ou on rend
      `Tarif` public si elle fait vraiment partie de l'API).
  - key: bug-collision
    format: bug-fix
    question: |-
      Ce code ne compile pas (`a type with the same simple name Date is already defined by the single-type-import`) :
      ```java
      import java.util.Date;
      import java.sql.Date;
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Garder un seul import, et écrire l'autre `Date` avec son nom complet", correct: true}
      - {text: "Importer `java.util.*` et `java.sql.*` à la place des deux classes", correct: false}
      - {text: "Inverser l'ordre des deux imports pour que le second l'emporte", correct: false}
      - {text: "Écrire `import java.sql.Date as DateSql;` pour renommer la seconde", correct: false}
    answer: |-
      ```java
      import java.util.Date;

      // plus bas
      java.sql.Date dateSql = new java.sql.Date(maintenant.getTime());
      ```
      Deux imports ne peuvent pas donner le même nom simple : l'une des classes s'écrit en nom complet. (En code
      récent, `java.time` remplace d'ailleurs les deux.)
  - key: bug-etoile
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: class Function`) :
      ```java
      import java.util.*;

      Function<String, Integer> longueur = String::length;
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Importer `java.util.function.Function` : l'étoile n'inclut pas les sous-packages", correct: true}
      - {text: "Écrire `import java.util.**;` pour importer aussi les sous-packages", correct: false}
      - {text: "Ajouter `import static java.util.*;` pour importer les interfaces", correct: false}
      - {text: "Remplacer `String::length` par la lambda `s -> s.length()`", correct: false}
    answer: |-
      ```java
      import java.util.function.Function;
      ```
      `java.util.*` n'importe pas les sous-packages : `java.util.function` est un package distinct.
  - key: bug-package-dossier
    format: bug-fix
    question: |-
      Maven ne trouve pas la classe, qui compile pourtant seule. Le fichier est
      `src/main/java/Client.java` et commence par :
      ```java
      package com.boutique.client;
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Déplacer le fichier dans `src/main/java/com/boutique/client/`", correct: true}
      - {text: "Renommer le fichier en `com.boutique.client.Client.java`", correct: false}
      - {text: "Ajouter `import com.boutique.client.*;` aux classes qui l'utilisent", correct: false}
      - {text: "Déclarer la classe `public` pour que Maven la trouve", correct: false}
    answer: |-
      Déplacer le fichier dans `src/main/java/com/boutique/client/Client.java`.

      L'arborescence doit suivre le nom du package : les outils (Maven, l'IDE, le chargement des classes) cherchent
      `com/boutique/client/Client.class`.
