notion: upcast-downcast
lesson: |-
  Convertir une référence ne change **jamais l'objet** : seulement le type par lequel on le regarde.

  - **Upcast** (vers le parent) : toujours sûr, **implicite**. `Animal a = new Chat();`
  - **Downcast** (vers l'enfant) : **explicite**, vérifié à l'exécution. Si l'objet n'est pas du bon type :
    **`ClassCastException`**.

  ```java
  Animal a = new Chat();      // upcast implicite
  a.cri();                    // "miaou" : l'objet reste un Chat
  // a.ronronner();           // ne compile pas : Animal n'a pas cette méthode

  Chat c = (Chat) a;          // downcast : vérifié à l'exécution, ici ok
  c.ronronner();

  Animal b = new Chien();
  Chat erreur = (Chat) b;     // ClassCastException
  ```

  - Le compilateur refuse un cast **impossible** entre types sans lien (`(String) Integer.valueOf(1)`) : erreur de
    compilation, pas d'exécution.
  - Avant un downcast, on vérifie le type avec **`instanceof`**, idéalement sous sa forme à motif :
    `if (a instanceof Chat c) c.ronronner();`.
  - Un downcast fréquent est un **signal** : il manque souvent une méthode dans le type parent (polymorphisme).

  **Piège classique** : caster un objet en croyant changer sa classe. `(Chat) chien` ne transforme pas un chien en
  chat : il échoue.

  **En entretien** : « L'upcast est implicite et toujours sûr ; le downcast est explicite, vérifié à l'exécution, et on
  le protège par `instanceof`. »
cards:
  - key: upcast
    format: course
    question: Qu'est-ce qu'un upcast ?
    answer: "La conversion d'une référence vers un type parent (`Animal a = chat;`) : implicite et toujours sûre."
  - key: downcast
    format: course
    question: Qu'est-ce qu'un downcast, et que risque-t-on ?
    answer: La conversion explicite vers un sous-type (`(Chat) animal`) ; si l'objet n'est pas de ce type, la JVM lève une `ClassCastException`.
  - key: objet-inchange
    format: course
    question: Un cast change-t-il l'objet ?
    answer: "Non : il change seulement le type de la référence par laquelle on le manipule ; l'objet garde sa classe et son comportement."
  - key: cast-impossible
    format: course
    question: Quand un cast est-il refusé dès la compilation ?
    answer: Quand les deux types ne peuvent avoir aucun objet commun, par exemple deux classes sans lien d'héritage (`(String) Integer.valueOf(1)`).
  - key: vf-upcast-explicite
    format: true-false
    question: Un upcast doit être écrit explicitement avec un cast.
    truth: false
    answer: "Il est implicite : un `Chat` est un `Animal`."
  - key: vf-downcast-verifie
    format: true-false
    question: Un downcast est vérifié à l'exécution.
    truth: true
    answer: Une `ClassCastException` est levée si l'objet n'est pas du type demandé.
  - key: vf-cast-change-classe
    format: true-false
    question: "`(Chat) animal` transforme l'objet en `Chat`."
    truth: false
    answer: L'objet ne change pas ; si ce n'est pas un `Chat`, le cast échoue.
  - key: vf-methode-apres-upcast
    format: true-false
    question: "Après `Animal a = new Chat();`, `a.cri()` exécute la version de `Chat`."
    truth: true
    answer: L'upcast ne change que le type déclaré ; l'objet reste un `Chat`.
  - key: qcm-exception
    format: multiple-choice
    question: Quelle exception lève un downcast vers un type que l'objet n'a pas ?
    choices:
      - text: "`ClassCastException`"
        correct: true
      - text: "`IllegalArgumentException`"
        correct: false
      - text: "`TypeMismatchException`"
        correct: false
      - text: "`NullPointerException`"
        correct: false
    answer: Un cast de `null` réussit d'ailleurs toujours (il donne `null`).
  - key: qcm-compile
    format: multiple-choice
    question: Avec `Animal a = new Chat();`, quelles instructions compilent ?
    choices:
      - text: "`a.cri();` (déclarée dans `Animal`)"
        correct: true
      - text: "`((Chat) a).ronronner();`"
        correct: true
      - text: "`a.ronronner();` (déclarée dans `Chat` seulement)"
        correct: false
      - text: "`Chat c = a;`"
        correct: false
    answer: Le type déclaré limite les appels ; l'affectation vers `Chat` exige un cast explicite.
  - key: qcm-sur
    format: multiple-choice
    question: Comment rendre sûr un downcast ?
    choices:
      - text: "Le protéger par `if (a instanceof Chat c)`"
        correct: true
      - text: "L'entourer d'un `try/catch (Exception e)` vide"
        correct: false
      - text: "Caster deux fois"
        correct: false
      - text: "Caster vers `Object` d'abord"
        correct: false
    answer: '`instanceof` à motif vérifie et caste en une fois.'
  - key: qcm-signal
    format: multiple-choice
    question: Que révèlent souvent de nombreux downcasts dans un code ?
    choices:
      - text: "Une méthode qui manque dans le type parent"
        correct: true
      - text: "Un bon usage du polymorphisme"
        correct: false
      - text: "Un problème de performance du ramasse-miettes"
        correct: false
      - text: "Une faute de frappe"
        correct: false
    answer: Si chaque appelant doit retrouver le type concret, le comportement devrait être polymorphe.
  - key: trous-downcast
    format: fill-in
    question: |-
      Complétez pour récupérer le `Chat` et le faire ronronner :
      ```java
      Animal a = new Chat();
      Chat c = (___) a;
      c.ronronner();
      ```
    blanks: [[Chat]]
    answer: Le downcast s'écrit avec le type cible entre parenthèses.
  - key: trous-instanceof-motif
    format: fill-in
    question: |-
      Complétez pour tester et caster en une fois :
      ```java
      if (a instanceof Chat ___) {
          c.ronronner();
      }
      ```
    blanks: [[c]]
    answer: Le motif `instanceof Chat c` déclare la variable `c` déjà castée.
  - key: trous-upcast
    format: fill-in
    question: |-
      Complétez avec le type parent pour que la variable accepte n'importe quel animal :
      ```java
      ___ a = new Chien();
      ```
    blanks: [[Animal]]
    answer: L'upcast est implicite.
  - key: trous-cast-double
    format: fill-in
    question: |-
      Complétez pour obtenir un `int` à partir d'un `Object` qui contient un `Integer` :
      ```java
      Object o = 42;
      int n = (___) o;
      ```
    blanks: [[Integer, int]]
    answer: Le cast vers `Integer` (ou directement `int`, depuis Java 7) puis le déballage donnent 42.
  - key: code-class-cast
    format: code-output
    question: |-
      ```java
      class Animal { }
      class Chat extends Animal { }
      class Chien extends Animal { }
      Animal a = new Chien();
      Chat c = (Chat) a;
      ```
    answer: "Une `ClassCastException` : l'objet est un `Chien`, pas un `Chat`."
    check:
      throws: ClassCastException
  - key: code-upcast-comportement
    format: code-output
    question: |-
      ```java
      class Animal { String cri() { return "..."; } }
      class Chat extends Animal {
          String cri() { return "miaou"; }
          String ronronner() { return "rrr"; }
      }
      Animal a = new Chat();
      System.out.println(a.cri() + " " + ((Chat) a).ronronner());
      ```
    answer: '`miaou rrr` : l''upcast ne change pas l''objet, et le downcast redonne accès à `ronronner`.'
    check:
      output: "miaou rrr"
  - key: code-methode-invisible
    format: code-output
    question: |-
      ```java
      class Animal { }
      class Chat extends Animal { void ronronner() { } }
      Animal a = new Chat();
      a.ronronner();
      ```
      Ce code compile-t-il ?
    answer: 'Non : `cannot find symbol` ; le type déclaré `Animal` n''a pas de méthode `ronronner`.'
    check:
      compiles: false
  - key: code-cast-null
    format: code-output
    question: |-
      ```java
      Object o = null;
      String s = (String) o;
      System.out.println(s);
      ```
    answer: '`null` : caster `null` réussit toujours.'
    check:
      output: "null"
  - key: bug-cast-aveugle
    format: bug-fix
    question: |-
      Ce code lève une `ClassCastException` dès qu'un événement n'est pas un clic :
      ```java
      void traiter(Evenement e) {
          Clic clic = (Clic) e;
          enregistrer(clic.position());
      }
      ```
    answer: |-
      ```java
      void traiter(Evenement e) {
          if (e instanceof Clic clic) {
              enregistrer(clic.position());
          }
      }
      ```
      Le downcast n'est vérifié qu'à l'exécution : on teste le type avant, ici avec `instanceof` à motif.
  - key: bug-catch-cast
    format: bug-fix
    question: |-
      Ce code « marche » mais cache toutes les erreurs :
      ```java
      try {
          Admin admin = (Admin) utilisateur;
          admin.gerer();
      } catch (Exception e) {
          // pas un admin
      }
      ```
    answer: |-
      ```java
      if (utilisateur instanceof Admin admin) {
          admin.gerer();
      }
      ```
      Attraper `Exception` pour tester un type masque aussi les vraies erreurs levées par `gerer()`. `instanceof`
      exprime le test directement.
  - key: bug-cast-impossible
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: Integer cannot be converted to String`) :
      ```java
      Integer code = 404;
      String texte = (String) code;
      ```
    answer: |-
      ```java
      String texte = String.valueOf(code);
      ```
      Un cast ne convertit pas une valeur d'un type en un autre type sans lien : il ne fait que changer le regard sur
      un objet. Pour obtenir du texte, on convertit (`String.valueOf`, `toString`).
  - key: bug-downcast-recurrent
    format: bug-fix
    question: |-
      Chaque appelant caste vers la classe concrète pour obtenir le libellé :
      ```java
      String libelle = (n instanceof Email e) ? e.libelleEmail()
              : ((Sms) n).libelleSms();
      ```
    answer: |-
      ```java
      interface Notification { String libelle(); }

      String libelle = n.libelle();
      ```
      Les downcasts répétés montrent qu'il manque une méthode commune : déclarée dans l'interface, elle est
      implémentée par chaque notification.
