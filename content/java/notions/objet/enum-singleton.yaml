notion: enum-singleton
lesson: |-
  Une enum à **une seule constante** est la façon la plus sûre d'écrire un singleton en Java (*Effective Java*,
  item 3) :

  ```java
  enum Horloge {
      INSTANCE;

      private final Clock clock = Clock.systemUTC();

      Instant maintenant() { return clock.instant(); }
  }

  Horloge.INSTANCE.maintenant();
  ```

  Ce que la JVM garantit sans code de notre part :
  - **une seule instance**, créée de façon **thread-safe** à l'initialisation de la classe (au premier usage) ;
  - la **sérialisation** ne crée pas de copie : la désérialisation renvoie la même constante ;
  - la **réflexion** ne peut pas appeler le constructeur : `Constructor.newInstance` lève
    `IllegalArgumentException` (« Cannot reflectively create enum objects »).

  Les variantes classiques (champ `static final` et constructeur privé, initialisation paresseuse avec double
  vérification et `volatile`) demandent du code pour obtenir ces garanties, et la double vérification est souvent
  écrite fausse.

  Limites : une enum ne peut pas étendre une classe, et un singleton reste un **état global**, difficile à remplacer
  dans un test. Dans une application à injection de dépendances (Quarkus, Spring), on préfère un bean
  `@ApplicationScoped` ou `@Singleton`, injecté par son interface.

  **Piège classique** : mettre un état mutable propre à une requête ou à un utilisateur dans un singleton. Il est
  partagé par tous les threads.

  **En entretien** : « Le singleton par enum est sûr face à la concurrence, à la sérialisation et à la réflexion ; mais
  dans une application moderne, on laisse le conteneur d'injection gérer l'unicité. »
cards:
  - key: pourquoi-enum
    format: course
    question: Pourquoi l'enum est-elle la meilleure façon d'écrire un singleton ?
    answer: La JVM garantit une instance unique, créée de façon thread-safe, que ni la sérialisation ni la réflexion ne peuvent dupliquer, sans aucun code de notre part.
  - key: reflexion
    format: course
    question: Que se passe-t-il si l'on tente de créer une instance d'enum par réflexion ?
    answer: '`Constructor.newInstance` lève une `IllegalArgumentException` : « Cannot reflectively create enum objects ».'
  - key: limites
    format: course
    question: Quelles sont les limites du singleton par enum ?
    answer: Il ne peut pas étendre une classe, et reste un état global, difficile à remplacer par un double dans les tests.
  - key: injection
    format: course
    question: Dans une application Quarkus ou Spring, comment obtenir un objet unique ?
    answer: "Avec un bean de portée application (`@ApplicationScoped`, `@Singleton`) injecté par son interface : le conteneur gère l'unicité, et les tests peuvent fournir une autre implémentation."
  - key: vf-thread-safe
    format: true-false
    question: La création de la constante d'un singleton enum est thread-safe sans synchronisation explicite.
    truth: true
    answer: L'initialisation d'une classe est garantie thread-safe par la JVM.
  - key: vf-serialisation-copie
    format: true-false
    question: Désérialiser un singleton enum crée une seconde instance.
    truth: false
    answer: La désérialisation d'une enum renvoie la constante existante.
  - key: vf-extends
    format: true-false
    question: Un singleton enum peut étendre une classe abstraite.
    truth: false
    answer: Une enum étend déjà `java.lang.Enum` ; elle peut seulement implémenter des interfaces.
  - key: vf-etat-partage
    format: true-false
    question: Un champ mutable d'un singleton est partagé par tous les threads.
    truth: true
    answer: "Il n'y a qu'une instance : son état est global."
  - key: qcm-garanties
    format: multiple-choice
    question: Que garantit la JVM pour un singleton enum ?
    choices:
      - text: "Une instance unique créée de façon thread-safe"
        correct: true
      - text: "Pas de copie à la désérialisation"
        correct: true
      - text: "Pas d'instance créée par réflexion"
        correct: true
      - text: "La sûreté des champs mutables entre threads"
        correct: false
    answer: L'unicité est garantie ; la sûreté de son état mutable reste à notre charge.
  - key: qcm-double-verification
    format: multiple-choice
    question: Dans un singleton paresseux à double vérification, quel mot-clé est indispensable sur le champ ?
    choices:
      - text: "`volatile`"
        correct: true
      - text: "`transient`"
        correct: false
      - text: "`final`"
        correct: false
      - text: "`synchronized`"
        correct: false
    answer: Sans `volatile`, un thread peut voir un objet partiellement construit ; l'enum évite ce piège.
  - key: qcm-alternative
    format: multiple-choice
    question: Que préférer à un singleton dans un service Quarkus testable ?
    choices:
      - text: "Un bean `@ApplicationScoped` injecté par son interface"
        correct: true
      - text: "Un champ `public static` modifiable"
        correct: false
      - text: "Un singleton à double vérification"
        correct: false
      - text: "Une variable globale `ThreadLocal`"
        correct: false
    answer: Le conteneur garantit l'unicité, et un test peut injecter un double.
  - key: qcm-acces
    format: multiple-choice
    question: "Comment accède-t-on au singleton `enum Config { INSTANCE; }` ?"
    choices:
      - text: "`Config.INSTANCE`"
        correct: true
      - text: "`new Config()`"
        correct: false
      - text: "`Config.getInstance()`, générée automatiquement"
        correct: false
      - text: "`Config.values()`, obligatoirement"
        correct: false
    answer: La constante est elle-même l'instance.
  - key: code-etat-partage
    format: code-output
    question: |-
      ```java
      enum Compteur {
          INSTANCE;
          private int n;
          int suivant() { return ++n; }
      }
      Compteur.INSTANCE.suivant();
      System.out.println(Compteur.INSTANCE.suivant());
      ```
    answer: '`2` : il n''existe qu''une instance, dont l''état est partagé.'
    check:
      output: "2"
  - key: code-reflexion
    format: code-output
    question: |-
      ```java
      enum Unique { INSTANCE }
      var constructeur = Unique.class.getDeclaredConstructors()[0];
      constructeur.setAccessible(true);
      constructeur.newInstance("COPIE", 1);
      ```
    answer: "Une `IllegalArgumentException` : « Cannot reflectively create enum objects »."
    check:
      throws: IllegalArgumentException
  - key: code-value-of
    format: code-output
    question: |-
      ```java
      enum Unique { INSTANCE }
      System.out.println((Unique.INSTANCE == Unique.valueOf("INSTANCE")) + " " + Unique.values().length);
      ```
    answer: '`true 1` : une seule constante, toujours la même instance.'
    check:
      output: "true 1"
  - key: code-serialisation
    format: code-output
    question: |-
      ```java
      enum Unique { INSTANCE }
      var octets = new ByteArrayOutputStream();
      try (var sortie = new ObjectOutputStream(octets)) {
          sortie.writeObject(Unique.INSTANCE);
      }
      try (var entree = new ObjectInputStream(new ByteArrayInputStream(octets.toByteArray()))) {
          System.out.println(entree.readObject() == Unique.INSTANCE);
      }
      ```
    answer: '`true` : la désérialisation renvoie la constante existante.'
    check:
      output: "true"
  - key: bug-double-verification
    format: bug-fix
    question: |-
      Ce singleton paresseux peut, sous charge, renvoyer un objet partiellement construit :
      ```java
      class Registre {
          private static Registre instance;
          static Registre get() {
              if (instance == null) {
                  synchronized (Registre.class) {
                      if (instance == null) instance = new Registre();
                  }
              }
              return instance;
          }
      }
      ```
    answer: |-
      ```java
      enum Registre {
          INSTANCE;
          ...
      }
      ```
      Sans `volatile`, la double vérification n'est pas sûre avec le modèle mémoire Java. L'enum (ou un champ
      `static final`, voire le patron *holder*) délègue la sûreté à l'initialisation de classe.
  - key: bug-champ-public
    format: bug-fix
    question: |-
      Un test a remplacé le singleton et n'a jamais remis l'original :
      ```java
      class Config {
          public static Config INSTANCE = new Config();
      }
      // dans un test : Config.INSTANCE = new ConfigDeTest();
      ```
    answer: |-
      ```java
      interface Config { String langue(); }

      @ApplicationScoped
      class ConfigFichier implements Config { ... }

      // les classes reçoivent Config par leur constructeur ; un test leur passe une ConfigDeTest
      ```
      Un champ `static` modifiable est un état global que chacun peut écraser. On injecte la dépendance : le test
      choisit son implémentation sans toucher à l'état partagé.
  - key: bug-etat-requete
    format: bug-fix
    question: |-
      Sous charge, des utilisateurs voient le panier d'autres utilisateurs :
      ```java
      enum PanierCourant {
          INSTANCE;
          private final List<String> articles = new ArrayList<>();
          void ajouter(String a) { articles.add(a); }
      }
      ```
    answer: |-
      ```java
      class Panier {
          private final List<String> articles = new ArrayList<>();
          void ajouter(String a) { articles.add(a); }
      }
      // un panier par utilisateur, conservé en session ou en base
      ```
      Un singleton n'existe qu'une fois pour toute l'application : son état est partagé par toutes les requêtes. Un
      état propre à un utilisateur n'a rien à y faire.
  - key: bug-reflexion-classique
    format: bug-fix
    question: |-
      Une bibliothèque de sérialisation crée une seconde instance de ce singleton :
      ```java
      class Horloge implements Serializable {
          static final Horloge INSTANCE = new Horloge();
          private Horloge() { }
      }
      ```
    answer: |-
      ```java
      enum Horloge {
          INSTANCE;
      }
      ```
      La désérialisation d'une classe ordinaire crée un nouvel objet (sauf avec une méthode `readResolve`). Une enum
      garantit l'unicité face à la sérialisation et à la réflexion sans code supplémentaire.
