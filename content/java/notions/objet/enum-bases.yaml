notion: enum-bases
cards:
  - key: enum-avoir-constructeur-public
    format: course
    question: Une enum peut-elle avoir un constructeur public ?
    answer: Non, il est implicitement privé.
  - key: enum-heriter-classe
    format: course
    question: Une enum peut-elle hériter d'une classe ?
    answer: Non (elle étend déjà Enum) ; elle peut implémenter des interfaces.
  - key: persister-ordinal
    format: course
    question: Pourquoi ne pas persister ordinal() ?
    answer: Réordonner ou insérer une constante change les ordinaux et corrompt les données existantes.
