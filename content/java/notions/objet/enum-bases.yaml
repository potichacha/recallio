notion: enum-bases
lesson: |-
  Une **enum** déclare un type dont les valeurs sont une liste **fermée** de constantes :

  ```java
  enum Feu { VERT, ORANGE, ROUGE }

  Feu f = Feu.ORANGE;
  String action = switch (f) {          // switch exhaustif : pas de default nécessaire
      case VERT -> "passer";
      case ORANGE -> "ralentir";
      case ROUGE -> "s'arrêter";
  };

  Feu.values();            // [VERT, ORANGE, ROUGE], dans l'ordre de déclaration
  Feu.valueOf("ROUGE");    // ROUGE ; un nom inconnu lève IllegalArgumentException
  f.name();                // "ORANGE"
  f.ordinal();             // 1 : la position, à partir de 0
  ```

  - Chaque constante est un **objet unique** : on les compare avec `==` sans risque.
  - Une enum étend implicitement `java.lang.Enum` : elle ne peut pas étendre une autre classe, mais peut implémenter
    des interfaces. Ses constructeurs sont implicitement `private` : on ne fait jamais `new Feu()`.
  - Les enums sont `Comparable` (dans l'ordre de déclaration) et `Serializable`.
  - Un `switch` sur une enum peut être **exhaustif** : si l'on ajoute une constante, chaque `switch` expression qui ne
    la traite pas cesse de compiler.

  **Piège classique** : enregistrer `ordinal()` en base. Insérer ou réordonner une constante change les numéros et
  corrompt les données : on persiste `name()` (ou un code explicite).

  **En entretien** : « Une enum est un ensemble fermé de constantes typées et uniques ; on les compare avec `==` et on
  persiste leur nom, jamais leur ordinal. »
tour:
  - title: Les enums
    text: |-
      Une **enum** déclare un type aux valeurs fixées d'avance : `enum Saison { PRINTEMPS, ETE, AUTOMNE, HIVER }`.
      Chaque valeur est un objet unique, qu'on compare avec `==`.

      `values()` les liste dans l'ordre de déclaration, `valueOf("ETE")` en retrouve une par son nom, et `ordinal()`
      donne sa position. Une enum peut avoir des champs, un constructeur et des méthodes, et s'utilise naturellement
      dans un `switch`.
    example:
      files:
        Main.java: |-
          enum Saison {
              PRINTEMPS("mars"),
              ETE("juin"),
              AUTOMNE("septembre"),
              HIVER("décembre");

              private final String debut;

              Saison(String debut) {
                  this.debut = debut;
              }

              String debut() {
                  return debut;
              }
          }

          void main() {
              for (Saison s : Saison.values()) {
                  IO.println(s.ordinal() + " " + s + " commence en " + s.debut());
              }
              Saison ete = Saison.valueOf("ETE");
              IO.println(ete == Saison.ETE);
              String conseil = switch (ete) {
                  case ETE -> "crème solaire";
                  case HIVER -> "écharpe";
                  default -> "parapluie";
              };
              IO.println(conseil);
          }
      output: |-
        0 PRINTEMPS commence en mars
        1 ETE commence en juin
        2 AUTOMNE commence en septembre
        3 HIVER commence en décembre
        true
        crème solaire
cards:
  - key: enum-avoir-constructeur-public
    format: course
    question: "Une enum peut-elle avoir un constructeur `public` ?"
    choices:
      - {text: "Non : son constructeur est implicitement privé", correct: true}
      - {text: "Oui, pour créer de nouvelles constantes à l'exécution", correct: false}
      - {text: "Oui, mais seulement si l'enum déclare des champs", correct: false}
      - {text: "Non : une enum ne peut déclarer aucun constructeur", correct: false}
    answer: |-
      Non : le constructeur d'une enum est implicitement privé, et `public` ne compile pas. Les seules instances sont
      les constantes déclarées ; une enum peut tout de même avoir un constructeur privé, avec des paramètres.
  - key: enum-heriter-classe
    format: course
    question: "Une enum peut-elle hériter d'une classe ?"
    choices:
      - {text: "Non : elle étend déjà `Enum`, mais elle peut implémenter des interfaces", correct: true}
      - {text: "Oui, avec `extends`, comme toute classe qui n'est pas `final`", correct: false}
      - {text: "Oui, mais seulement d'une autre enum, avec `extends`", correct: false}
      - {text: "Non, et elle ne peut pas non plus implémenter d'interface", correct: false}
    answer: "Non : elle étend déjà `java.lang.Enum`, et Java n'a qu'un héritage de classe. Elle peut implémenter des interfaces."
  - key: persister-ordinal
    format: course
    question: "Pourquoi ne pas enregistrer en base l'`ordinal()` d'une constante d'enum ?"
    choices:
      - {text: "Réordonner ou insérer une constante change les ordinaux, et corrompt les données", correct: true}
      - {text: "`ordinal()` change à chaque démarrage, selon l'ordre de chargement des classes", correct: false}
      - {text: "`ordinal()` commence à 1, ce qui décale toutes les valeurs relues", correct: false}
      - {text: "Un entier prend plus de place en base que le nom de la constante", correct: false}
    answer: |-
      L'ordinal est la position de la constante (à partir de 0) : réordonner ou insérer une constante le change et
      corrompt les données existantes. On enregistre le nom (`name()`).
  - key: comparer-enums
    format: course
    question: Comment compare-t-on deux valeurs d'enum ?
    choices:
      - {text: "Avec `==` : chaque constante est unique, et c'est sûr même avec `null`", correct: true}
      - {text: "Avec `equals` seulement : `==` compare les références, c'est risqué", correct: false}
      - {text: "En comparant leurs noms : `a.name().equals(b.name())`", correct: false}
      - {text: "Avec `compareTo(...) == 0`, seule méthode fiable pour une enum", correct: false}
    answer: |-
      Avec `==` : chaque constante est une instance unique. C'est sûr même avec `null`, contrairement à `equals` appelé
      sur une référence nulle.
  - key: vf-new
    format: true-false
    question: On peut créer une nouvelle valeur d'enum avec `new`.
    truth: false
    answer: Les constructeurs d'une enum sont privés ; les seules valeurs sont les constantes déclarées.
  - key: vf-value-of-inconnu
    format: true-false
    question: "`Feu.valueOf(\"BLEU\")` renvoie `null`."
    truth: false
    answer: Elle lève une `IllegalArgumentException`.
  - key: vf-interface
    format: true-false
    question: Une enum peut implémenter une interface.
    truth: true
    answer: "`enum Operation implements IntBinaryOperator` est valide."
  - key: vf-values-ordre
    format: true-false
    question: "`values()` renvoie les constantes dans l'ordre de déclaration."
    truth: true
    answer: Dans un nouveau tableau à chaque appel.
  - key: qcm-ordinal
    format: multiple-choice
    question: "Avec `enum Jour { LUNDI, MARDI, MERCREDI }`, que vaut `Jour.MERCREDI.ordinal()` ?"
    choices:
      - text: "2"
        correct: true
      - text: "3"
        correct: false
      - text: "\"MERCREDI\""
        correct: false
      - text: "1"
        correct: false
    answer: Les ordinaux commencent à 0.
  - key: qcm-persister
    format: multiple-choice
    question: Que stocker en base pour une valeur d'enum ?
    choices:
      - text: "Son nom (`name()`) ou un code explicite"
        correct: true
      - text: "Son ordinal (`ordinal()`)"
        correct: false
      - text: "Son `hashCode()`"
        correct: false
      - text: "Le résultat de `toString()`, redéfinissable"
        correct: false
    answer: Le nom ne change pas quand on insère une constante ; `toString()` peut être redéfini pour l'affichage.
  - key: qcm-heritage
    format: multiple-choice
    question: "Laquelle de ces choses une enum peut-elle faire ?"
    choices:
      - {text: "Implémenter des interfaces", correct: true}
      - {text: "Étendre une autre classe", correct: false}
      - {text: "Avoir un constructeur `public`", correct: false}
      - {text: "Être étendue par une autre enum", correct: false}
    answer: |-
      Une enum peut implémenter des interfaces, et avoir des champs et des méthodes. Elle étend déjà `java.lang.Enum`,
      son constructeur est privé, et aucune autre enum ne peut l'étendre.
  - key: qcm-switch
    format: multiple-choice
    question: Quel avantage a un `switch` expression sur une enum sans `default` ?
    choices:
      - text: "Le compilateur signale une constante non traitée"
        correct: true
      - text: "Il est plus rapide qu'un `if`"
        correct: false
      - text: "Il gère `null` sans exception"
        correct: false
      - text: "Il trie les constantes"
        correct: false
    answer: Ajouter une constante rend visible chaque `switch` à compléter.
  - key: trous-enum
    format: fill-in
    question: |-
      Complète pour déclarer les trois couleurs du feu :
      ```java
      ___ Feu { VERT, ORANGE, ROUGE }
      ```
    blanks: [[enum]]
    answer: Le mot-clé `enum` déclare un type énuméré.
  - key: trous-values
    format: fill-in
    question: |-
      Complète pour parcourir toutes les constantes :
      ```java
      for (Feu f : Feu.___()) {
          System.out.println(f);
      }
      ```
    blanks: [[values]]
    answer: '`values()` renvoie un tableau des constantes, dans l''ordre de déclaration.'
  - key: trous-value-of
    format: fill-in
    question: |-
      Complète pour retrouver la constante à partir de son nom :
      ```java
      Feu f = Feu.___("ROUGE");
      ```
    blanks: [[valueOf]]
    answer: '`valueOf` lève `IllegalArgumentException` pour un nom inconnu.'
  - key: trous-comparaison
    format: fill-in
    question: |-
      Complète avec l'opérateur idiomatique pour comparer deux constantes :
      ```java
      if (feu ___ Feu.ROUGE) {
          freiner();
      }
      ```
    blanks: [["=="]]
    answer: Les constantes sont uniques ; `==` est sûr et ne lève pas d'exception si `feu` vaut `null`.
  - key: code-methodes
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Jour { LUNDI, MARDI, MERCREDI }
      System.out.println(Jour.MARDI.ordinal() + " " + Jour.valueOf("MERCREDI") + " " + Jour.values().length);
      ```
    choices:
      - {text: "`1 MERCREDI 3`", correct: true}
      - {text: "`2 MERCREDI 3`", correct: false}
      - {text: "`1 MERCREDI 2`", correct: false}
      - {text: "`2 MERCREDI 2`", correct: false}
    answer: "`1 MERCREDI 3` : `ordinal()` commence à 0, et `values()` renvoie les trois constantes."
    check:
      output: "1 MERCREDI 3"
  - key: code-value-of-casse
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Jour { LUNDI, MARDI }
      System.out.println(Jour.valueOf("lundi"));
      ```
    choices:
      - {text: "Une `IllegalArgumentException`", correct: true}
      - {text: "`LUNDI` : `valueOf` ignore la casse", correct: false}
      - {text: "`null` : aucun nom ne correspond", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: "Une `IllegalArgumentException` : `valueOf` respecte la casse exacte du nom."
    check:
      throws: IllegalArgumentException
  - key: code-switch
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Feu { VERT, ORANGE, ROUGE }
      static String action(Feu f) {
          return switch (f) {
              case VERT -> "passer";
              case ORANGE -> "ralentir";
              case ROUGE -> "s'arrêter";
          };
      }
      System.out.println(action(Feu.ORANGE));
      ```
    choices:
      - {text: "`ralentir`", correct: true}
      - {text: "`passer`", correct: false}
      - {text: "`ORANGE`", correct: false}
      - {text: "Ça ne compile pas : il manque un `default`", correct: false}
    answer: "`ralentir`. Le `switch` expression couvre toutes les constantes : il n'a pas besoin de `default`."
    check:
      output: "ralentir"
  - key: code-comparaison
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Jour { LUNDI, MARDI, MERCREDI }
      System.out.println((Jour.LUNDI.compareTo(Jour.MERCREDI) < 0) + " " + (Jour.LUNDI == Jour.valueOf("LUNDI")));
      ```
    choices:
      - {text: "`true true`", correct: true}
      - {text: "`true false`", correct: false}
      - {text: "`false true`", correct: false}
      - {text: "`false false`", correct: false}
    answer: '`true true` : les enums se comparent dans l''ordre de déclaration, et `valueOf` renvoie la même instance.'
    check:
      output: "true true"
  - key: bug-ordinal-base
    format: bug-fix
    question: |-
      Depuis qu'on a ajouté `EN_ATTENTE` en tête de l'enum, toutes les commandes en base ont changé de statut. Quelle
      correction est la bonne ?
      ```java
      enum Statut { EN_ATTENTE, PAYEE, EXPEDIEE }
      requete.setInt(1, commande.statut().ordinal());
      ```
    choices:
      - {text: "Enregistrer le nom, `name()`, et relire avec `Statut.valueOf`", correct: true}
      - {text: "Enregistrer `ordinal() + 1`, pour que l'ajout en tête ne décale plus rien", correct: false}
      - {text: "Enregistrer `hashCode()`, unique pour chaque constante de l'enum", correct: false}
      - {text: "Enregistrer `toString()`, et relire avec un `switch` sur le texte", correct: false}
    answer: |-
      ```java
      requete.setString(1, commande.statut().name());
      // et à la lecture : Statut.valueOf(resultat.getString("statut"))
      ```
      L'ordinal dépend de la position des constantes. Le nom est stable (avec JPA : `@Enumerated(EnumType.STRING)`) ;
      `toString()` peut être redéfini, et `hashCode()` change d'une exécution à l'autre.
  - key: bug-comparaison-texte
    format: bug-fix
    question: |-
      Ce test fonctionne, mais il est fragile. Quelle version est la meilleure ?
      ```java
      if (commande.statut().toString().equals("PAYEE")) {
          expedier(commande);
      }
      ```
    choices:
      - {text: "`if (commande.statut() == Statut.PAYEE)`", correct: true}
      - {text: "`if (commande.statut().name() == \"PAYEE\")`", correct: false}
      - {text: "`if (\"PAYEE\".equals(commande.statut().toString()))`", correct: false}
      - {text: "`if (commande.statut().equals(\"PAYEE\"))`", correct: false}
    answer: |-
      ```java
      if (commande.statut() == Statut.PAYEE) {
          expedier(commande);
      }
      ```
      Comparer des chaînes perd la vérification du compilateur (une faute de frappe passe) et casse si `toString()` est
      redéfini. `==` sur la constante est sûr et lisible.
  - key: bug-value-of-saisie
    format: bug-fix
    question: |-
      L'API renvoie une erreur 500 quand le client envoie `?tri=prix` en minuscules. Quelle correction est la bonne ?
      ```java
      Tri tri = Tri.valueOf(parametre);
      ```
    choices:
      - {text: "Mettre la saisie en majuscules (`Locale.ROOT`), et traduire l'exception en erreur 400", correct: true}
      - {text: "Mettre la saisie en majuscules, et laisser l'exception remonter en erreur 500", correct: false}
      - {text: "Entourer `valueOf` d'un `try` qui renvoie `null` quand le nom est inconnu", correct: false}
      - {text: "Appeler `Tri.valueOf(parametre.trim())`, qui ignore aussi la casse", correct: false}
    answer: |-
      ```java
      Tri tri;
      try {
          tri = Tri.valueOf(parametre.toUpperCase(Locale.ROOT));
      } catch (IllegalArgumentException e) {
          throw new ParametreInvalide("tri inconnu : " + parametre);
      }
      ```
      `valueOf` est sensible à la casse et lève une exception pour un nom inconnu : on normalise la saisie et on
      traduit l'erreur en réponse 400.
  - key: bug-switch-oubli
    format: bug-fix
    question: |-
      La nouvelle constante `CLIGNOTANT` est silencieusement traitée comme un feu rouge. Quelle correction est la bonne ?
      ```java
      String action;
      switch (feu) {
          case VERT: action = "passer"; break;
          case ORANGE: action = "ralentir"; break;
          default: action = "s'arrêter";
      }
      ```
    choices:
      - {text: "Un `switch` expression sans `default`, avec un `case` par constante", correct: true}
      - {text: "Ranger les `case` dans l'ordre de déclaration des constantes", correct: false}
      - {text: "Ajouter `assert feu != Feu.CLIGNOTANT;` juste avant le `switch`", correct: false}
      - {text: "Remplacer le `switch` par des `if` sur `feu.name()`", correct: false}
    answer: |-
      ```java
      String action = switch (feu) {
          case VERT -> "passer";
          case ORANGE -> "ralentir";
          case ROUGE -> "s'arrêter";
          case CLIGNOTANT -> "céder le passage";
      };
      ```
      Le `default` absorbait toute nouvelle constante. Un `switch` expression sans `default` est vérifié exhaustif :
      une constante oubliée devient une erreur de compilation.
