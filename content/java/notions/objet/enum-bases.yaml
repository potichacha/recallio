notion: enum-bases
lesson: |-
  Une **enum** déclare un type dont les valeurs sont une liste **fermée** de constantes :

  ```java
  enum Feu { VERT, ORANGE, ROUGE }

  Feu f = Feu.ORANGE;
  String action = switch (f) {          // switch exhaustif : pas de default nécessaire
      case VERT -> "passer";
      case ORANGE -> "ralentir";
      case ROUGE -> "s'arrêter";
  };

  Feu.values();            // [VERT, ORANGE, ROUGE], dans l'ordre de déclaration
  Feu.valueOf("ROUGE");    // ROUGE ; un nom inconnu lève IllegalArgumentException
  f.name();                // "ORANGE"
  f.ordinal();             // 1 : la position, à partir de 0
  ```

  - Chaque constante est un **objet unique** : on les compare avec `==` sans risque.
  - Une enum étend implicitement `java.lang.Enum` : elle ne peut pas étendre une autre classe, mais peut implémenter
    des interfaces. Ses constructeurs sont implicitement `private` : on ne fait jamais `new Feu()`.
  - Les enums sont `Comparable` (dans l'ordre de déclaration) et `Serializable`.
  - Un `switch` sur une enum peut être **exhaustif** : si l'on ajoute une constante, chaque `switch` expression qui ne
    la traite pas cesse de compiler.

  **Piège classique** : enregistrer `ordinal()` en base. Insérer ou réordonner une constante change les numéros et
  corrompt les données : on persiste `name()` (ou un code explicite).

  **En entretien** : « Une enum est un ensemble fermé de constantes typées et uniques ; on les compare avec `==` et on
  persiste leur nom, jamais leur ordinal. »
cards:
  - key: enum-avoir-constructeur-public
    format: course
    question: Une enum peut-elle avoir un constructeur public ?
    answer: Non, il est implicitement privé.
  - key: enum-heriter-classe
    format: course
    question: Une enum peut-elle hériter d'une classe ?
    answer: Non (elle étend déjà Enum) ; elle peut implémenter des interfaces.
  - key: persister-ordinal
    format: course
    question: Pourquoi ne pas persister ordinal() ?
    answer: Réordonner ou insérer une constante change les ordinaux et corrompt les données existantes.
  - key: comparer-enums
    format: course
    question: Comment compare-t-on deux valeurs d'enum ?
    answer: "Avec `==` : chaque constante est une instance unique. C'est sûr même avec `null`, contrairement à `equals` appelé sur une référence nulle."
  - key: vf-new
    format: true-false
    question: On peut créer une nouvelle valeur d'enum avec `new`.
    truth: false
    answer: Les constructeurs d'une enum sont privés ; les seules valeurs sont les constantes déclarées.
  - key: vf-value-of-inconnu
    format: true-false
    question: "`Feu.valueOf(\"BLEU\")` renvoie `null`."
    truth: false
    answer: Elle lève une `IllegalArgumentException`.
  - key: vf-interface
    format: true-false
    question: Une enum peut implémenter une interface.
    truth: true
    answer: "`enum Operation implements IntBinaryOperator` est valide."
  - key: vf-values-ordre
    format: true-false
    question: "`values()` renvoie les constantes dans l'ordre de déclaration."
    truth: true
    answer: Dans un nouveau tableau à chaque appel.
  - key: qcm-ordinal
    format: multiple-choice
    question: "Avec `enum Jour { LUNDI, MARDI, MERCREDI }`, que vaut `Jour.MERCREDI.ordinal()` ?"
    choices:
      - text: "2"
        correct: true
      - text: "3"
        correct: false
      - text: "\"MERCREDI\""
        correct: false
      - text: "1"
        correct: false
    answer: Les ordinaux commencent à 0.
  - key: qcm-persister
    format: multiple-choice
    question: Que stocker en base pour une valeur d'enum ?
    choices:
      - text: "Son nom (`name()`) ou un code explicite"
        correct: true
      - text: "Son ordinal (`ordinal()`)"
        correct: false
      - text: "Son `hashCode()`"
        correct: false
      - text: "Le résultat de `toString()`, redéfinissable"
        correct: false
    answer: Le nom ne change pas quand on insère une constante ; `toString()` peut être redéfini pour l'affichage.
  - key: qcm-heritage
    format: multiple-choice
    question: Que peut faire une enum ?
    choices:
      - text: "Implémenter des interfaces"
        correct: true
      - text: "Avoir des champs et des méthodes"
        correct: true
      - text: "Étendre une autre classe"
        correct: false
      - text: "Avoir un constructeur `public`"
        correct: false
    answer: Elle étend déjà `java.lang.Enum`.
  - key: qcm-switch
    format: multiple-choice
    question: Quel avantage a un `switch` expression sur une enum sans `default` ?
    choices:
      - text: "Le compilateur signale une constante non traitée"
        correct: true
      - text: "Il est plus rapide qu'un `if`"
        correct: false
      - text: "Il gère `null` sans exception"
        correct: false
      - text: "Il trie les constantes"
        correct: false
    answer: Ajouter une constante rend visible chaque `switch` à compléter.
  - key: trous-enum
    format: fill-in
    question: |-
      Complétez pour déclarer les trois couleurs du feu :
      ```java
      ___ Feu { VERT, ORANGE, ROUGE }
      ```
    blanks: [[enum]]
    answer: Le mot-clé `enum` déclare un type énuméré.
  - key: trous-values
    format: fill-in
    question: |-
      Complétez pour parcourir toutes les constantes :
      ```java
      for (Feu f : Feu.___()) {
          System.out.println(f);
      }
      ```
    blanks: [[values]]
    answer: '`values()` renvoie un tableau des constantes, dans l''ordre de déclaration.'
  - key: trous-value-of
    format: fill-in
    question: |-
      Complétez pour retrouver la constante à partir de son nom :
      ```java
      Feu f = Feu.___("ROUGE");
      ```
    blanks: [[valueOf]]
    answer: '`valueOf` lève `IllegalArgumentException` pour un nom inconnu.'
  - key: trous-comparaison
    format: fill-in
    question: |-
      Complétez avec l'opérateur idiomatique pour comparer deux constantes :
      ```java
      if (feu ___ Feu.ROUGE) {
          freiner();
      }
      ```
    blanks: [["=="]]
    answer: Les constantes sont uniques ; `==` est sûr et ne lève pas d'exception si `feu` vaut `null`.
  - key: code-methodes
    format: code-output
    question: |-
      ```java
      enum Jour { LUNDI, MARDI, MERCREDI }
      System.out.println(Jour.MARDI.ordinal() + " " + Jour.valueOf("MERCREDI") + " " + Jour.values().length);
      ```
    answer: '`1 MERCREDI 3`.'
    check:
      output: "1 MERCREDI 3"
  - key: code-value-of-casse
    format: code-output
    question: |-
      ```java
      enum Jour { LUNDI, MARDI }
      System.out.println(Jour.valueOf("lundi"));
      ```
    answer: "Une `IllegalArgumentException` : `valueOf` respecte la casse exacte du nom."
    check:
      throws: IllegalArgumentException
  - key: code-switch
    format: code-output
    question: |-
      ```java
      enum Feu { VERT, ORANGE, ROUGE }
      static String action(Feu f) {
          return switch (f) {
              case VERT -> "passer";
              case ORANGE -> "ralentir";
              case ROUGE -> "s'arrêter";
          };
      }
      System.out.println(action(Feu.ORANGE));
      ```
    answer: '`ralentir`.'
    check:
      output: "ralentir"
  - key: code-comparaison
    format: code-output
    question: |-
      ```java
      enum Jour { LUNDI, MARDI, MERCREDI }
      System.out.println((Jour.LUNDI.compareTo(Jour.MERCREDI) < 0) + " " + (Jour.LUNDI == Jour.valueOf("LUNDI")));
      ```
    answer: '`true true` : les enums se comparent dans l''ordre de déclaration, et `valueOf` renvoie la même instance.'
    check:
      output: "true true"
  - key: bug-ordinal-base
    format: bug-fix
    question: |-
      Depuis qu'on a ajouté `EN_ATTENTE` en tête de l'enum, toutes les commandes en base ont changé de statut :
      ```java
      enum Statut { EN_ATTENTE, PAYEE, EXPEDIEE }
      requete.setInt(1, commande.statut().ordinal());
      ```
    answer: |-
      ```java
      requete.setString(1, commande.statut().name());
      // et à la lecture : Statut.valueOf(resultat.getString("statut"))
      ```
      L'ordinal dépend de la position des constantes. Le nom est stable (avec JPA : `@Enumerated(EnumType.STRING)`).
  - key: bug-comparaison-texte
    format: bug-fix
    question: |-
      Simplifiez et fiabilisez ce test :
      ```java
      if (commande.statut().toString().equals("PAYEE")) {
          expedier(commande);
      }
      ```
    answer: |-
      ```java
      if (commande.statut() == Statut.PAYEE) {
          expedier(commande);
      }
      ```
      Comparer des chaînes perd la vérification du compilateur (une faute de frappe passe) et casse si `toString()` est
      redéfini. `==` sur la constante est sûr et lisible.
  - key: bug-value-of-saisie
    format: bug-fix
    question: |-
      L'API renvoie une erreur 500 quand le client envoie `?tri=prix` en minuscules :
      ```java
      Tri tri = Tri.valueOf(parametre);
      ```
    answer: |-
      ```java
      Tri tri;
      try {
          tri = Tri.valueOf(parametre.toUpperCase(Locale.ROOT));
      } catch (IllegalArgumentException e) {
          throw new ParametreInvalide("tri inconnu : " + parametre);
      }
      ```
      `valueOf` est sensible à la casse et lève une exception pour un nom inconnu : on normalise la saisie et on
      traduit l'erreur en réponse 400.
  - key: bug-switch-oubli
    format: bug-fix
    question: |-
      La nouvelle constante `CLIGNOTANT` est silencieusement traitée comme un feu rouge :
      ```java
      String action;
      switch (feu) {
          case VERT: action = "passer"; break;
          case ORANGE: action = "ralentir"; break;
          default: action = "s'arrêter";
      }
      ```
    answer: |-
      ```java
      String action = switch (feu) {
          case VERT -> "passer";
          case ORANGE -> "ralentir";
          case ROUGE -> "s'arrêter";
          case CLIGNOTANT -> "céder le passage";
      };
      ```
      Le `default` absorbait toute nouvelle constante. Un `switch` expression sans `default` est vérifié exhaustif :
      une constante oubliée devient une erreur de compilation.
