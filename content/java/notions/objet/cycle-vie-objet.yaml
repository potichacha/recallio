notion: cycle-vie-objet
lesson: |-
  Un objet naît avec `new`, vit tant qu'on peut l'**atteindre**, puis disparaît quand le **ramasse-miettes** (*garbage
  collector*, GC) récupère sa mémoire.

  1. **Création** : `new` réserve la mémoire sur le **tas**, initialise les champs et appelle le constructeur.
  2. **Utilisation** : l'objet reste vivant tant qu'il est **accessible** depuis une **racine** : une variable locale
     d'un thread actif, un champ `static`, une référence JNI... directement ou par une chaîne de références.
  3. **Inaccessibilité** : plus aucune chaîne ne mène à lui. Il devient éligible au GC.
  4. **Récupération** : le GC libère sa mémoire, **quand il le décide**.

  ```java
  void traiter() {
      Rapport r = new Rapport();   // accessible par la variable locale r
      r.generer();
  }                                // à la sortie, plus rien ne mène au rapport : éligible
  ```

  - Java n'a **pas de destructeur** et on ne libère jamais la mémoire à la main ; `System.gc()` n'est qu'une suggestion.
  - Deux objets qui se référencent l'un l'autre mais qu'aucune racine n'atteint sont récupérés : le GC ne compte pas
    les références, il parcourt ce qui est accessible.
  - Une **fuite mémoire** en Java, c'est un objet devenu inutile mais **toujours accessible** : une collection `static`
    qui grossit, un écouteur jamais retiré, un cache sans limite.
  - Les **ressources** (fichiers, connexions) ne se libèrent pas par le GC : on les ferme avec `try-with-resources`.

  **Piège classique** : compter sur le GC pour fermer un fichier. Rien ne garantit quand (ni si) il passera ; la
  ressource doit être fermée explicitement.

  **En entretien** : « Un objet vit tant qu'il est accessible depuis une racine ; le GC récupère les objets
  inaccessibles quand il veut, et une fuite, c'est un objet inutile resté accessible. »
cards:
  - key: quand-eligible
    format: course
    question: Quand un objet devient-il éligible au ramasse-miettes ?
    answer: Quand plus aucune chaîne de références ne le relie à une racine (variable locale d'un thread actif, champ `static`...).
  - key: racines
    format: course
    question: Que sont les racines du GC ?
    answer: "Les points de départ du parcours des objets vivants : variables locales et paramètres des threads actifs, champs `static` des classes chargées, références JNI."
  - key: fuite-java
    format: course
    question: Comment peut-on avoir une fuite mémoire avec un ramasse-miettes ?
    answer: "En gardant accessible un objet devenu inutile : collection `static` qui grossit, écouteur jamais désinscrit, cache sans limite ni expiration."
  - key: ressources
    format: course
    question: Le GC ferme-t-il les fichiers et les connexions ?
    answer: "Non, pas de façon fiable : on ne sait pas quand il passe. Les ressources se ferment explicitement, avec `try-with-resources`."
  - key: vf-destructeur
    format: true-false
    question: Java a des destructeurs, appelés quand un objet sort de portée.
    truth: false
    answer: Il n'y a pas de destructeur ; la mémoire est récupérée par le GC, à un moment non déterminé.
  - key: vf-system-gc
    format: true-false
    question: "`System.gc()` force le ramasse-miettes à s'exécuter immédiatement."
    truth: false
    answer: Ce n'est qu'une suggestion, que la JVM peut ignorer.
  - key: vf-cycle
    format: true-false
    question: Deux objets qui se référencent mutuellement ne sont jamais récupérés.
    truth: false
    answer: "S'ils ne sont accessibles depuis aucune racine, le GC les récupère : il ne compte pas les références."
  - key: vf-tas
    format: true-false
    question: Les objets créés avec `new` sont alloués sur le tas.
    truth: true
    answer: Les variables locales qui les référencent vivent sur la pile du thread.
  - key: qcm-eligible
    format: multiple-choice
    question: Après `Client c = new Client(); c = null;`, que devient l'objet `Client` ?
    choices:
      - text: "Il est éligible au GC, s'il n'est référencé nulle part ailleurs"
        correct: true
      - text: "Il est détruit immédiatement"
        correct: false
      - text: "Il reste en mémoire jusqu'à la fin du programme"
        correct: false
      - text: "Il lève une `NullPointerException`"
        correct: false
    answer: Éligible ne veut pas dire récupéré tout de suite.
  - key: qcm-fuite
    format: multiple-choice
    question: Lesquels peuvent provoquer une fuite mémoire ?
    choices:
      - text: "Un `static Map` utilisé comme cache sans limite"
        correct: true
      - text: "Un écouteur ajouté à chaque ouverture d'écran et jamais retiré"
        correct: true
      - text: "Une variable locale qui référence un gros objet pendant un appel"
        correct: false
      - text: "Deux objets inaccessibles qui se référencent"
        correct: false
    answer: Une fuite, c'est un objet inutile toujours accessible ; une variable locale disparaît à la fin de l'appel.
  - key: qcm-liberer
    format: multiple-choice
    question: Comment libère-t-on la mémoire d'un objet en Java ?
    choices:
      - text: "On cesse de le référencer, et le GC s'en charge"
        correct: true
      - text: "`delete objet;`"
        correct: false
      - text: "`objet.free();`"
        correct: false
      - text: "`System.gc(objet);`"
        correct: false
    answer: Il n'y a pas de libération manuelle.
  - key: qcm-fermer
    format: multiple-choice
    question: Quelle est la bonne façon de garantir la fermeture d'un fichier ?
    choices:
      - text: "`try-with-resources`"
        correct: true
      - text: "Attendre le passage du GC"
        correct: false
      - text: "Redéfinir `finalize()`"
        correct: false
      - text: "Mettre la variable à `null`"
        correct: false
    answer: '`finalize` est déprécié et imprévisible ; `try-with-resources` ferme la ressource à la sortie du bloc.'
  - key: bug-ecouteur
    format: bug-fix
    question: |-
      Chaque ouverture de la fenêtre de recherche fait grossir la mémoire, même après sa fermeture :
      ```java
      class Recherche {
          Recherche(Bus bus) {
              bus.abonner(this::surEvenement);
          }
      }
      ```
    answer: |-
      ```java
      class Recherche implements AutoCloseable {
          private final Bus bus;
          private final Abonnement abonnement;

          Recherche(Bus bus) {
              this.bus = bus;
              this.abonnement = bus.abonner(this::surEvenement);
          }

          @Override
          public void close() {
              bus.desabonner(abonnement);
          }
      }
      ```
      Le bus garde une référence vers chaque fenêtre abonnée : elles restent accessibles pour toujours. On se
      désabonne à la fermeture.
  - key: bug-cache-sans-limite
    format: bug-fix
    question: |-
      Le cache des profils finit par remplir le tas :
      ```java
      private static final Map<Long, Profil> CACHE = new HashMap<>();

      Profil profil(long id) {
          return CACHE.computeIfAbsent(id, depot::charger);
      }
      ```
    answer: |-
      ```java
      private final Map<Long, Profil> cache = new LinkedHashMap<>(16, 0.75f, true) {
          @Override
          protected boolean removeEldestEntry(Map.Entry<Long, Profil> plusAncienne) {
              return size() > 10_000;
          }
      };
      ```
      Un cache sans limite retient chaque profil chargé. On borne sa taille (ici un LRU), ou on utilise une
      bibliothèque de cache avec expiration (Caffeine).
  - key: bug-system-gc
    format: bug-fix
    question: |-
      Ce traitement est lent et provoque des pauses :
      ```java
      for (Lot lot : lots) {
          traiter(lot);
          System.gc();
      }
      ```
    answer: |-
      ```java
      for (Lot lot : lots) {
          traiter(lot);
      }
      ```
      Appeler `System.gc()` déclenche souvent un GC complet, coûteux, sans rien régler : la JVM sait quand
      récupérer la mémoire. Si la mémoire manque vraiment, on cherche ce qui reste accessible.
  - key: bug-fichier-gc
    format: bug-fix
    question: |-
      Sous charge, l'application échoue avec `Too many open files` :
      ```java
      String premiereLigne(Path p) throws IOException {
          BufferedReader lecteur = Files.newBufferedReader(p);
          return lecteur.readLine();
      }
      ```
    answer: |-
      ```java
      String premiereLigne(Path p) throws IOException {
          try (BufferedReader lecteur = Files.newBufferedReader(p)) {
              return lecteur.readLine();
          }
      }
      ```
      Le lecteur n'est jamais fermé : le GC ne libère pas le descripteur de fichier à temps.
      `try-with-resources` le ferme dès la sortie du bloc.
  - key: definition-gc
    format: definition
    question: Ramasse-miettes (garbage collector)
    answer: Le mécanisme de la JVM qui récupère automatiquement la mémoire des objets devenus inaccessibles.
  - key: definition-tas
    format: definition
    question: Tas (heap)
    answer: La zone mémoire où sont alloués les objets, partagée par tous les threads et gérée par le GC.
  - key: definition-racine
    format: definition
    question: Racine du GC (GC root)
    answer: Une référence toujours vivante (variable locale d'un thread actif, champ `static`...) d'où part le parcours des objets accessibles.
  - key: definition-fuite
    format: definition
    question: Fuite mémoire (en Java)
    answer: Un objet devenu inutile mais toujours accessible, que le GC ne peut donc pas récupérer.
