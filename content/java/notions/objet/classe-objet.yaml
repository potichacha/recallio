notion: classe-objet
lesson: |-
  Une **classe** est un plan : elle décrit l'**état** (les champs) et le **comportement** (les méthodes) d'une famille
  d'objets. Un **objet** (une **instance**) est un exemplaire créé à partir de ce plan avec `new`.

  ```java
  class Chien {
      String nom;

      void aboyer() {
          System.out.println(nom + " aboie");
      }
  }

  Chien rex = new Chien();   // new crée l'objet, rex en garde la référence
  rex.nom = "Rex";
  rex.aboyer();              // Rex aboie
  ```

  - Chaque objet a son **état** propre (ses valeurs de champs) et son **identité** : deux chiens de même nom restent
    deux objets distincts (`a == b` est faux).
  - Une variable de type classe contient une **référence** vers l'objet, pas l'objet lui-même.
  - Les quatre piliers de la programmation objet : **encapsulation**, **héritage**, **polymorphisme**, **abstraction**.

  **Piège classique** : confondre « même état » et « même objet ». `==` compare les identités ; pour comparer les
  contenus, il faut `equals` (redéfini).

  **En entretien** : « La classe est le plan, l'objet une instance avec son état et son identité ; `new` crée l'objet
  et renvoie une référence. »
tour:
  - title: Classes et objets
    text: |-
      Une **classe** décrit un type d'objets : leurs champs (l'état) et leurs méthodes (le comportement). `new` crée un
      **objet**, une instance de la classe, et renvoie une référence vers lui.

      En Java, chaque classe publique a son propre fichier, du même nom : ici `Chat.java`, à côté de `Main.java`. Chaque
      objet a ses propres champs : modifier l'un ne touche pas l'autre.
    example:
      files:
        Main.java: |-
          void main() {
              Chat felix = new Chat();
              felix.nom = "Félix";
              felix.age = 3;
              Chat tom = new Chat();
              tom.nom = "Tom";
              IO.println(felix.presente());
              IO.println(tom.presente());
          }
        Chat.java: |-
          public class Chat {
              String nom;
              int age;

              String presente() {
                  return nom + " a " + age + " ans";
              }
          }
      output: |-
        Félix a 3 ans
        Tom a 0 ans
cards:
  - key: 4-piliers
    format: course
    question: "Quels sont les quatre piliers de la programmation objet ?"
    choices:
      - {text: "Encapsulation, héritage, polymorphisme, abstraction", correct: true}
      - {text: "Encapsulation, héritage, polymorphisme, compilation", correct: false}
      - {text: "Classe, objet, méthode, attribut", correct: false}
      - {text: "Encapsulation, héritage, récursivité, abstraction", correct: false}
    answer: "Encapsulation, héritage, polymorphisme et abstraction. Classe, objet et méthode sont des notions, pas des piliers."
  - key: classe-vs-objet
    format: course
    question: "Quelle différence entre une classe et un objet ?"
    choices:
      - {text: "La classe est le plan ; l'objet, une instance avec son état et son identité", correct: true}
      - {text: "L'objet est le plan ; la classe, une instance créée avec `new`", correct: false}
      - {text: "Aucune : ce sont deux noms pour la même notion", correct: false}
      - {text: "La classe existe à l'exécution ; l'objet, seulement à la compilation", correct: false}
    answer: "La classe est le plan ; l'objet est une instance de ce plan, avec son état et son identité."
  - key: role-new
    format: course
    question: "Que fait l'opérateur `new` ?"
    choices:
      - {text: "Il alloue l'objet sur le tas, appelle le constructeur et renvoie une référence", correct: true}
      - {text: "Il copie un objet existant de la même classe et renvoie la copie", correct: false}
      - {text: "Il déclare une variable du type de la classe, sans créer d'objet", correct: false}
      - {text: "Il alloue l'objet sur la pile et le libère à la fin de la méthode", correct: false}
    answer: |-
      Il alloue un nouvel objet sur le tas, initialise ses champs, appelle le constructeur et renvoie une référence vers
      l'objet.
  - key: etat-identite
    format: course
    question: "Quelle différence entre l'état et l'identité d'un objet ?"
    choices:
      - {text: "L'état, ce sont les valeurs des champs ; l'identité distingue l'objet de tous les autres", correct: true}
      - {text: "L'état est fixé à la création ; l'identité, ce sont les valeurs des champs", correct: false}
      - {text: "L'identité se compare avec `equals` ; l'état, avec `==`", correct: false}
      - {text: "Aucune : deux objets de même état ont forcément la même identité", correct: false}
    answer: |-
      L'état, ce sont les valeurs de ses champs, qui peuvent changer ; l'identité distingue l'objet de tous les autres,
      même de ceux qui ont le même état. `==` compare les identités.
  - key: vf-meme-etat
    format: true-false
    question: Deux objets créés avec `new` et dont les champs ont les mêmes valeurs sont le même objet.
    truth: false
    answer: "Ils ont le même état mais deux identités : `a == b` est faux."
  - key: vf-plusieurs-instances
    format: true-false
    question: Une classe peut servir à créer autant d'objets qu'on veut.
    truth: true
    answer: Chaque `new` crée une nouvelle instance, avec son propre état.
  - key: vf-variable-objet
    format: true-false
    question: Une variable de type `Chien` contient l'objet lui-même.
    truth: false
    answer: Elle contient une référence vers l'objet, qui vit sur le tas.
  - key: vf-methodes-partagees
    format: true-false
    question: Les méthodes d'instance agissent sur l'état de l'objet sur lequel on les appelle.
    truth: true
    answer: '`rex.aboyer()` lit le `nom` de `rex`, pas celui d''un autre chien.'
  - key: qcm-creer
    format: multiple-choice
    question: Comment crée-t-on un objet de la classe `Livre` ?
    choices:
      - text: "`Livre l = new Livre();`"
        correct: true
      - text: "`Livre l = Livre();`"
        correct: false
      - text: "`Livre l = new Livre;`"
        correct: false
      - text: "`Livre l = Livre.create();`, obligatoirement"
        correct: false
    answer: '`new` suivi d''un appel de constructeur.'
  - key: qcm-piliers
    format: multiple-choice
    question: "Lequel de ces concepts fait partie des quatre piliers de la programmation objet ?"
    choices:
      - {text: "L'encapsulation", correct: true}
      - {text: "La compilation", correct: false}
      - {text: "La récursivité", correct: false}
      - {text: "La concurrence", correct: false}
    answer: "Encapsulation, héritage, polymorphisme et abstraction ; les autres existent hors de la programmation objet."
  - key: qcm-classe-contient
    format: multiple-choice
    question: Que décrit une classe ?
    choices:
      - text: "L'état et le comportement de ses instances"
        correct: true
      - text: "Seulement des données"
        correct: false
      - text: "Un seul objet précis"
        correct: false
      - text: "L'adresse mémoire de ses objets"
        correct: false
    answer: Des champs (l'état) et des méthodes (le comportement).
  - key: qcm-comparer
    format: multiple-choice
    question: Que compare `a == b` quand `a` et `b` sont des objets ?
    choices:
      - text: "Leurs références (sont-ils le même objet ?)"
        correct: true
      - text: "La valeur de tous leurs champs"
        correct: false
      - text: "Leur `toString()`"
        correct: false
      - text: "Leur classe seulement"
        correct: false
    answer: '`==` compare les identités ; `equals` compare les contenus s''il est redéfini.'
  - key: code-identite
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Chien { String nom; }
      Chien a = new Chien();
      a.nom = "Rex";
      Chien b = new Chien();
      b.nom = "Rex";
      System.out.println((a == b) + " " + a.nom.equals(b.nom));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`false true` : deux objets distincts, avec le même nom."
    check:
      output: "false true"
  - key: code-etats-separes
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Compteur {
          int valeur;
          void incrementer() { valeur++; }
      }
      Compteur c1 = new Compteur();
      Compteur c2 = new Compteur();
      c1.incrementer();
      c1.incrementer();
      c2.incrementer();
      System.out.println(c1.valeur + " " + c2.valeur);
      ```
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`2 1` : chaque objet a son propre champ `valeur`."
    check:
      output: "2 1"
  - key: code-meme-reference
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Boite { int contenu; }
      Boite a = new Boite();
      Boite b = a;
      b.contenu = 5;
      System.out.println(a.contenu);
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`5` : `b = a` copie la référence, il n'y a qu'un seul objet."
    check:
      output: "5"
  - key: code-classe
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Livre {}
      Livre l = new Livre();
      System.out.println(l.getClass().getSimpleName());
      ```
    choices:
      - {text: "`Livre`", correct: true}
      - {text: "`Object`", correct: false}
      - {text: "`class Livre`", correct: false}
      - {text: "`Livre@1b6d3586`", correct: false}
    answer: "`Livre` : chaque objet connaît sa classe, et `getSimpleName()` donne son nom court."
    check:
      output: "Livre"
  - key: explique-4-piliers-oop-avec-seul
    format: scenario
    question: |-
      En entretien, on te demande d'illustrer les quatre piliers de la programmation objet avec un système de paiement.
      Quelle illustration est juste ?
    choices:
      - {text: "Interface `MoyenPaiement` : abstraction ; plafond privé : encapsulation ; carte premium : héritage ; `moyen.payer()` : polymorphisme", correct: true}
      - {text: "Interface `MoyenPaiement` : encapsulation ; plafond privé : abstraction ; carte premium : polymorphisme ; `moyen.payer()` : héritage", correct: false}
      - {text: "Interface `MoyenPaiement` : héritage ; plafond privé : encapsulation ; carte premium : abstraction ; `moyen.payer()` : polymorphisme", correct: false}
      - {text: "Interface `MoyenPaiement` : abstraction ; plafond public : encapsulation ; carte premium : polymorphisme ; `instanceof` : héritage", correct: false}
    answer: |-
      **Abstraction** : `MoyenPaiement.payer(montant)` dit *quoi* sans dire *comment*. **Encapsulation** : `CarteBancaire`
      garde son plafond privé et refuse un paiement au-delà. **Héritage** : `CarteBancairePremium` étend `CarteBancaire`.
      **Polymorphisme** : le service appelle `moyen.payer(total)` sans savoir quel moyen il manipule.
  - key: scenario-expliquer-debutant
    format: scenario
    question: "Un stagiaire te demande la différence entre une classe et un objet. Que lui réponds-tu ?"
    choices:
      - {text: "La classe est le plan d'une maison ; chaque `new` construit une maison, avec son adresse et son existence propres", correct: true}
      - {text: "La classe est la maison construite ; l'objet est le plan qui décrit toutes les maisons possibles", correct: false}
      - {text: "Classe et objet sont la même chose ; « objet » est juste le mot employé une fois le programme lancé", correct: false}
      - {text: "Deux `new` avec la même adresse donnent la même maison : un objet se résume à son contenu", correct: false}
    answer: |-
      La classe est un **moule**, un plan d'architecte : on n'habite pas un plan. Les objets sont les maisons construites
      à partir de lui, chacune avec son état (son adresse) et son identité : deux `new` donnent deux maisons, même avec
      la même adresse.
  - key: scenario-tableaux-paralleles
    format: scenario
    question: |-
      Un code gère des employés avec trois tableaux : `String[] noms`, `int[] ages`, `double[] salaires`, où l'indice i
      désigne le même employé. Que proposes-tu ?
    choices:
      - {text: "Une classe ou un record `Employe` (nom, âge, salaire), manipulé dans une `List<Employe>`", correct: true}
      - {text: "Un seul tableau `Object[]` où chaque employé occupe trois cases consécutives", correct: false}
      - {text: "Garder les trois tableaux, avec une méthode qui les trie ensemble à chaque modification", correct: false}
      - {text: "Une `Map<String, Double>` du nom vers le salaire, et les âges dans un tableau à part", correct: false}
    answer: |-
      Regrouper ces données dans une classe (ou un record) `Employe`, manipulée dans une `List<Employe>`. Les tableaux
      parallèles sont fragiles : un tri ou une suppression oubliée sur un seul tableau désynchronise tout. La classe
      accueille ensuite le comportement (`augmenter(pourcentage)`) et ses règles.
  - key: scenario-identifier-classes
    format: scenario
    question: Comment identifies-tu les classes d'une application de gestion de bibliothèque ?
    choices:
      - {text: "Je pars des noms du métier (livre, exemplaire, adhérent, emprunt) ; les verbes donnent les méthodes", correct: true}
      - {text: "Je pars des tables de la base de données : une classe par table, sans aucune méthode métier", correct: false}
      - {text: "Je pars des écrans : une classe par page, qui porte les données et les règles affichées", correct: false}
      - {text: "Je crée une seule classe `Bibliotheque` qui gère tout, et je la découpe plus tard si besoin", correct: false}
    answer: |-
      Le vocabulaire du métier : les **noms** importants donnent des classes candidates, les **verbes** (emprunter,
      rendre) des méthodes. Chaque classe a une responsabilité claire et ses règles, et on distingue les notions
      proches : un `Livre` (le titre) n'est pas un `Exemplaire` (l'objet qu'on prête).
  - key: definition-pojo
    format: definition
    question: "Qu'est-ce qu'un POJO ?"
    choices:
      - {text: "Un « Plain Old Java Object » : un objet ordinaire, sans dépendance à un framework", correct: true}
      - {text: "Un objet sérialisable, avec un constructeur vide et des getters et setters", correct: false}
      - {text: "Un « Persistent Object » : une entité liée à une table de la base de données", correct: false}
      - {text: "Un objet dont tous les champs sont publics et qui n'a aucune méthode", correct: false}
    answer: |-
      **Plain Old Java Object** : un objet Java ordinaire, qui n'étend ni n'implémente rien qu'impose un framework. Le
      JavaBean, lui, ajoute des conventions (constructeur vide, accesseurs, sérialisable).
  - key: definition-instance
    format: definition
    question: "Qu'est-ce qu'une instance ?"
    choices:
      - {text: "Un objet créé à partir d'une classe, avec `new`", correct: true}
      - {text: "Le plan qui décrit les champs et les méthodes d'un objet", correct: false}
      - {text: "Une variable qui contient la référence d'un objet", correct: false}
      - {text: "Un champ partagé par tous les objets d'une classe", correct: false}
    answer: "Un objet créé à partir d'une classe, avec `new`. Le plan, c'est la classe ; la variable n'en garde qu'une référence."
  - key: definition-etat
    format: definition
    question: "Qu'appelle-t-on l'état d'un objet ?"
    choices:
      - {text: "L'ensemble des valeurs de ses champs à un instant donné", correct: true}
      - {text: "Ce qui le distingue de tout autre objet, même de même contenu", correct: false}
      - {text: "L'ensemble des méthodes que déclare sa classe", correct: false}
      - {text: "Le type déclaré de la variable qui le référence", correct: false}
    answer: "L'ensemble des valeurs de ses champs à un instant donné. Ce qui le distingue des autres objets, c'est son identité."
  - key: definition-identite
    format: definition
    question: "Qu'appelle-t-on l'identité d'un objet ?"
    choices:
      - {text: "Ce qui le distingue de tout autre objet, même de même état ; `==` la compare", correct: true}
      - {text: "L'ensemble des valeurs de ses champs ; `equals` la compare", correct: false}
      - {text: "Le nom de sa classe, tel que le renvoie `getClass()`", correct: false}
      - {text: "Le résultat de son `hashCode`, unique pour chaque objet", correct: false}
    answer: "Ce qui le distingue de tout autre objet, même de même état ; `==` compare les identités, `equals` le plus souvent les états."
