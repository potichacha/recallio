notion: classe-objet
lesson: |-
  Une **classe** est un plan : elle décrit l'**état** (les champs) et le **comportement** (les méthodes) d'une famille
  d'objets. Un **objet** (une **instance**) est un exemplaire créé à partir de ce plan avec `new`.

  ```java
  class Chien {
      String nom;

      void aboyer() {
          System.out.println(nom + " aboie");
      }
  }

  Chien rex = new Chien();   // new crée l'objet, rex en garde la référence
  rex.nom = "Rex";
  rex.aboyer();              // Rex aboie
  ```

  - Chaque objet a son **état** propre (ses valeurs de champs) et son **identité** : deux chiens de même nom restent
    deux objets distincts (`a == b` est faux).
  - Une variable de type classe contient une **référence** vers l'objet, pas l'objet lui-même.
  - Les quatre piliers de la programmation objet : **encapsulation**, **héritage**, **polymorphisme**, **abstraction**.

  **Piège classique** : confondre « même état » et « même objet ». `==` compare les identités ; pour comparer les
  contenus, il faut `equals` (redéfini).

  **En entretien** : « La classe est le plan, l'objet une instance avec son état et son identité ; `new` crée l'objet
  et renvoie une référence. »
cards:
  - key: 4-piliers
    format: course
    question: Les 4 piliers ?
    answer: Encapsulation, Héritage, Polymorphisme, Abstraction.
  - key: classe-vs-objet
    format: course
    question: Classe vs objet ?
    answer: Le plan vs une instance avec son état et son identité.
  - key: role-new
    format: course
    question: Que fait l'opérateur `new` ?
    answer: Il alloue un nouvel objet sur le tas, initialise ses champs, appelle le constructeur et renvoie une référence vers l'objet.
  - key: etat-identite
    format: course
    question: Quelle différence entre l'état et l'identité d'un objet ?
    answer: L'état, ce sont les valeurs de ses champs, qui peuvent changer ; l'identité distingue l'objet de tous les autres, même de ceux qui ont le même état.
  - key: vf-meme-etat
    format: true-false
    question: Deux objets créés avec `new` et dont les champs ont les mêmes valeurs sont le même objet.
    truth: false
    answer: "Ils ont le même état mais deux identités : `a == b` est faux."
  - key: vf-plusieurs-instances
    format: true-false
    question: Une classe peut servir à créer autant d'objets qu'on veut.
    truth: true
    answer: Chaque `new` crée une nouvelle instance, avec son propre état.
  - key: vf-variable-objet
    format: true-false
    question: Une variable de type `Chien` contient l'objet lui-même.
    truth: false
    answer: Elle contient une référence vers l'objet, qui vit sur le tas.
  - key: vf-methodes-partagees
    format: true-false
    question: Les méthodes d'instance agissent sur l'état de l'objet sur lequel on les appelle.
    truth: true
    answer: '`rex.aboyer()` lit le `nom` de `rex`, pas celui d''un autre chien.'
  - key: qcm-creer
    format: multiple-choice
    question: Comment crée-t-on un objet de la classe `Livre` ?
    choices:
      - text: "`Livre l = new Livre();`"
        correct: true
      - text: "`Livre l = Livre();`"
        correct: false
      - text: "`Livre l = new Livre;`"
        correct: false
      - text: "`Livre l = Livre.create();`, obligatoirement"
        correct: false
    answer: '`new` suivi d''un appel de constructeur.'
  - key: qcm-piliers
    format: multiple-choice
    question: Lesquels font partie des quatre piliers de la programmation objet ?
    choices:
      - text: "L'encapsulation"
        correct: true
      - text: "Le polymorphisme"
        correct: true
      - text: "La compilation"
        correct: false
      - text: "La récursivité"
        correct: false
    answer: Encapsulation, héritage, polymorphisme et abstraction.
  - key: qcm-classe-contient
    format: multiple-choice
    question: Que décrit une classe ?
    choices:
      - text: "L'état et le comportement de ses instances"
        correct: true
      - text: "Seulement des données"
        correct: false
      - text: "Un seul objet précis"
        correct: false
      - text: "L'adresse mémoire de ses objets"
        correct: false
    answer: Des champs (l'état) et des méthodes (le comportement).
  - key: qcm-comparer
    format: multiple-choice
    question: Que compare `a == b` quand `a` et `b` sont des objets ?
    choices:
      - text: "Leurs références (sont-ils le même objet ?)"
        correct: true
      - text: "La valeur de tous leurs champs"
        correct: false
      - text: "Leur `toString()`"
        correct: false
      - text: "Leur classe seulement"
        correct: false
    answer: '`==` compare les identités ; `equals` compare les contenus s''il est redéfini.'
  - key: code-identite
    format: code-output
    question: |-
      ```java
      class Chien { String nom; }
      Chien a = new Chien();
      a.nom = "Rex";
      Chien b = new Chien();
      b.nom = "Rex";
      System.out.println((a == b) + " " + a.nom.equals(b.nom));
      ```
    answer: '`false true` : deux objets distincts, avec le même nom.'
    check:
      output: "false true"
  - key: code-etats-separes
    format: code-output
    question: |-
      ```java
      class Compteur {
          int valeur;
          void incrementer() { valeur++; }
      }
      Compteur c1 = new Compteur();
      Compteur c2 = new Compteur();
      c1.incrementer();
      c1.incrementer();
      c2.incrementer();
      System.out.println(c1.valeur + " " + c2.valeur);
      ```
    answer: '`2 1` : chaque objet a son propre champ `valeur`.'
    check:
      output: "2 1"
  - key: code-meme-reference
    format: code-output
    question: |-
      ```java
      class Boite { int contenu; }
      Boite a = new Boite();
      Boite b = a;
      b.contenu = 5;
      System.out.println(a.contenu);
      ```
    answer: '`5` : `b = a` copie la référence, il n''y a qu''un seul objet.'
    check:
      output: "5"
  - key: code-classe
    format: code-output
    question: |-
      ```java
      class Livre {}
      Livre l = new Livre();
      System.out.println(l.getClass().getSimpleName());
      ```
    answer: '`Livre` : chaque objet connaît sa classe.'
    check:
      output: "Livre"
  - key: explique-4-piliers-oop-avec-seul
    format: scenario
    question: Explique les 4 piliers de l'OOP avec un seul exemple.
    answer: 'Un système de paiement. **Abstraction** : une interface `MoyenPaiement` avec `payer(montant)`, qui dit *quoi* sans dire *comment*. **Encapsulation** : une classe `CarteBancaire` garde son numéro et son plafond privés et refuse un paiement au-delà du plafond, aucun code extérieur ne peut contourner la règle. **Héritage** : une `CarteBancairePremium` étend `CarteBancaire` en relevant le plafond, en restant substituable. **Polymorphisme** : le service de commande appelle `moyen.payer(total)` sans savoir s''il manipule une carte, un virement ou un portefeuille électronique ; ajouter un nouveau moyen ne modifie pas ce service.'
  - key: scenario-expliquer-debutant
    format: scenario
    question: Un stagiaire te demande la différence entre une classe et un objet. Comment l'expliques-tu ?
    answer: |-
      Avec une analogie puis du code. La classe est un **moule** ou un plan d'architecte : elle dit qu'une maison a des
      pièces et une adresse, mais on n'habite pas un plan. Les objets sont les maisons construites à partir de ce plan :
      chacune a sa propre adresse (son état) et existe à part (son identité). En Java, `class Maison { String adresse; }`
      est le plan, `new Maison()` construit une maison ; deux `new` donnent deux maisons, même si on leur donne la même
      adresse.
  - key: scenario-tableaux-paralleles
    format: scenario
    question: |-
      Un code gère des employés avec trois tableaux : `String[] noms`, `int[] ages`, `double[] salaires`, où l'indice i
      désigne le même employé. Que proposes-tu ?
    answer: |-
      Regrouper ces données dans une classe (ou un record) `Employe` avec `nom`, `age` et `salaire`, et manipuler une
      `List<Employe>`. Les tableaux parallèles sont fragiles : un tri ou une suppression oubliée sur un seul tableau
      désynchronise tout. Une classe garde les données d'un employé ensemble, et accueille ensuite le comportement qui
      les concerne (`augmenter(pourcentage)`), avec ses règles.
  - key: scenario-identifier-classes
    format: scenario
    question: Comment identifies-tu les classes d'une application de gestion de bibliothèque ?
    answer: |-
      Je pars du vocabulaire du métier : les **noms** importants (livre, exemplaire, adhérent, emprunt) donnent des
      classes candidates, les **verbes** (emprunter, rendre, réserver) des méthodes. Je vérifie que chaque classe a une
      responsabilité claire et ses règles (un adhérent ne peut pas avoir plus de cinq emprunts), et je distingue les
      notions proches : un `Livre` (le titre) n'est pas un `Exemplaire` (l'objet physique qu'on prête). Je commence
      simple et je fais évoluer le modèle avec les cas d'usage.
  - key: definition-pojo
    format: definition
    question: POJO
    answer: Plain Old Java Object
  - key: definition-instance
    format: definition
    question: Instance
    answer: Un objet créé à partir d'une classe, avec `new`.
  - key: definition-etat
    format: definition
    question: État d'un objet
    answer: L'ensemble des valeurs de ses champs à un instant donné.
  - key: definition-identite
    format: definition
    question: Identité d'un objet
    answer: Ce qui le distingue de tout autre objet, même de même état ; `==` compare les identités.
