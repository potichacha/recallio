notion: interfaces-marqueurs
lesson: |-
  Une **interface marqueur** ne déclare **aucune méthode** : elle signale seulement qu'une classe a une propriété, que
  d'autres codes testent avec `instanceof`.

  | Interface | Ce qu'elle signale | Qui la teste |
  |---|---|---|
  | `Serializable` | l'objet peut être sérialisé | `ObjectOutputStream` (sinon `NotSerializableException`) |
  | `Cloneable` | `Object.clone()` est permis | `Object.clone()` (sinon `CloneNotSupportedException`) |
  | `RandomAccess` | l'accès par indice est rapide | les algorithmes de `Collections` |

  ```java
  if (liste instanceof RandomAccess) {
      for (int i = 0; i < liste.size(); i++) { ... }   // ArrayList : get(i) en temps constant
  } else {
      for (var e : liste) { ... }                        // LinkedList : on itère
  }
  ```

  - Avantage sur une annotation : un marqueur est un **type**, vérifiable à la compilation (une méthode peut exiger
    un paramètre `Serializable`).
  - Aujourd'hui, on préfère souvent les **annotations** (`@FunctionalInterface`, `@Entity`) pour les métadonnées qui
    ne servent pas de type.
  - `Cloneable` est un mauvais exemple de conception : il change le comportement d'une méthode d'`Object` sans en
    déclarer aucune. Les constructeurs de copie sont préférables.

  **Piège classique** : sérialiser un objet dont un **champ** n'est pas `Serializable`. Marquer la classe ne suffit
  pas : tout le graphe d'objets doit l'être (ou les champs être `transient`).

  **En entretien** : « Une interface marqueur n'a pas de méthode ; elle donne un type qu'on teste avec `instanceof`,
  comme `Serializable` ou `RandomAccess`. »
cards:
  - key: interface-marqueur
    format: course
    question: Qu'est-ce qu'une interface marqueur ?
    answer: Une interface sans méthode qui signale une capacité (Serializable, Cloneable).
  - key: random-access
    format: course
    question: À quoi sert `RandomAccess` ?
    answer: Elle signale qu'une liste offre un accès par indice rapide (`ArrayList`) ; des algorithmes choisissent alors une boucle par indice plutôt qu'un itérateur.
  - key: marqueur-vs-annotation
    format: course
    question: Interface marqueur ou annotation ?
    answer: Le marqueur définit un type, vérifiable à la compilation (`void envoyer(Serializable s)`) ; l'annotation porte des métadonnées sans créer de type et peut s'appliquer à autre chose qu'une classe.
  - key: cloneable-defaut
    format: course
    question: Pourquoi `Cloneable` est-il un exemple critiqué ?
    answer: "Il ne déclare pas `clone()` : il modifie le comportement de la méthode `protected` d'`Object`, qui lève `CloneNotSupportedException` sans lui. Les constructeurs de copie sont plus clairs."
  - key: vf-methodes
    format: true-false
    question: Une interface marqueur déclare au moins une méthode.
    truth: false
    answer: Elle n'en déclare aucune ; sa seule présence a un sens.
  - key: vf-serializable-graphe
    format: true-false
    question: Il suffit que la classe implémente `Serializable` pour que tous ses objets se sérialisent.
    truth: false
    answer: Ses champs doivent l'être aussi (ou être `transient`), sinon `NotSerializableException`.
  - key: vf-arraylist
    format: true-false
    question: "`ArrayList` implémente `RandomAccess`."
    truth: true
    answer: Son accès par indice est en temps constant, contrairement à `LinkedList`.
  - key: vf-clone-sans-marqueur
    format: true-false
    question: Appeler `super.clone()` dans une classe qui n'implémente pas `Cloneable` lève `CloneNotSupportedException`.
    truth: true
    answer: '`Object.clone()` vérifie le marqueur.'
  - key: qcm-marqueurs
    format: multiple-choice
    question: Lesquelles sont des interfaces marqueurs ?
    choices:
      - text: "`Serializable`"
        correct: true
      - text: "`Cloneable`"
        correct: true
      - text: "`RandomAccess`"
        correct: true
      - text: "`Comparable`"
        correct: false
    answer: '`Comparable` déclare `compareTo`.'
  - key: qcm-exception-serialisation
    format: multiple-choice
    question: Quelle exception lève la sérialisation d'un objet non `Serializable` ?
    choices:
      - text: "`NotSerializableException`"
        correct: true
      - text: "`ClassCastException`"
        correct: false
      - text: "`UnsupportedOperationException`"
        correct: false
      - text: "`IllegalStateException`"
        correct: false
    answer: C'est une `IOException`, levée par `ObjectOutputStream.writeObject`.
  - key: qcm-transient
    format: multiple-choice
    question: Comment exclure un champ de la sérialisation ?
    choices:
      - text: "Le déclarer `transient`"
        correct: true
      - text: "Le déclarer `volatile`"
        correct: false
      - text: "Le déclarer `final`"
        correct: false
      - text: "Le déclarer `static final`, obligatoirement"
        correct: false
    answer: Un champ `transient` est ignoré, et revient à sa valeur par défaut à la désérialisation.
  - key: qcm-alternative
    format: multiple-choice
    question: Que préférer à `Cloneable` pour copier un objet ?
    choices:
      - text: "Un constructeur de copie ou une fabrique de copie"
        correct: true
      - text: "La sérialisation dans un tableau d'octets"
        correct: false
      - text: "Une copie par réflexion"
        correct: false
      - text: "Un `static` partagé"
        correct: false
    answer: '`new Point(autre)` ou `Point.copie(autre)` sont explicites et typés (*Effective Java*, item 13).'
  - key: code-random-access
    format: code-output
    question: |-
      ```java
      List<Integer> a = new ArrayList<>();
      List<Integer> b = new LinkedList<>();
      System.out.println((a instanceof RandomAccess) + " " + (b instanceof RandomAccess));
      ```
    answer: '`true false` : seule `ArrayList` offre un accès par indice rapide.'
    check:
      output: "true false"
  - key: code-clone-sans-marqueur
    format: code-output
    question: |-
      ```java
      class Point {
          Object copie() throws CloneNotSupportedException { return clone(); }
      }
      new Point().copie();
      ```
    answer: "Une `CloneNotSupportedException` : `Point` n'implémente pas `Cloneable`."
    check:
      throws: CloneNotSupportedException
  - key: code-serialisation-refusee
    format: code-output
    question: |-
      ```java
      class Session { String utilisateur = "ada"; }
      var sortie = new ObjectOutputStream(new ByteArrayOutputStream());
      sortie.writeObject(new Session());
      ```
    answer: "Une `NotSerializableException` : `Session` n'implémente pas `Serializable`."
    check:
      throws: NotSerializableException
  - key: code-clone-avec-marqueur
    format: code-output
    question: |-
      ```java
      class Point implements Cloneable {
          int x = 3;
          Point copie() throws CloneNotSupportedException { return (Point) clone(); }
      }
      Point p = new Point();
      Point q = p.copie();
      System.out.println(q.x + " " + (p == q));
      ```
    answer: '`3 false` : avec le marqueur, `clone()` crée une copie superficielle, un autre objet.'
    check:
      output: "3 false"
  - key: bug-champ-non-serialisable
    format: bug-fix
    question: |-
      La mise en session échoue avec `NotSerializableException: Connexion`, alors que la classe est `Serializable` :
      ```java
      class Panier implements Serializable {
          private final List<String> articles = new ArrayList<>();
          private final Connexion connexion;
      }
      ```
    answer: |-
      ```java
      class Panier implements Serializable {
          private final List<String> articles = new ArrayList<>();
          private transient Connexion connexion;
      }
      ```
      Tout le graphe d'objets doit être sérialisable. Une connexion ne se sérialise pas : on la marque `transient` et on
      la récupère après désérialisation (ou, mieux, on ne la garde pas dans le panier).
  - key: bug-clone-oublie
    format: bug-fix
    question: |-
      `facture.copie()` lève `CloneNotSupportedException` :
      ```java
      class Facture {
          Facture copie() throws CloneNotSupportedException {
              return (Facture) super.clone();
          }
      }
      ```
    answer: |-
      ```java
      class Facture {
          Facture(Facture autre) {
              this.numero = autre.numero;
              this.lignes = new ArrayList<>(autre.lignes);
          }
      }
      ```
      Il manquait le marqueur `Cloneable`. Plutôt que de l'ajouter, un constructeur de copie est explicite, sans
      exception vérifiée, et copie la liste au lieu de la partager.
  - key: bug-boucle-indice
    format: bug-fix
    question: |-
      Ce parcours devient très lent sur une `LinkedList` de 100 000 éléments :
      ```java
      for (int i = 0; i < liste.size(); i++) {
          traiter(liste.get(i));
      }
      ```
    answer: |-
      ```java
      for (Element e : liste) {
          traiter(e);
      }
      ```
      Sur une liste sans `RandomAccess`, chaque `get(i)` parcourt la liste : la boucle devient quadratique. La boucle
      `for-each` utilise l'itérateur, efficace pour toutes les listes.
  - key: bug-annotation-marqueur
    format: bug-fix
    question: |-
      Une méthode doit n'accepter que des objets « exportables », mais l'erreur n'apparaît qu'à l'exécution :
      ```java
      @interface Exportable { }

      void exporter(Object o) {
          if (!o.getClass().isAnnotationPresent(Exportable.class)) {
              throw new IllegalArgumentException("non exportable");
          }
      }
      ```
    answer: |-
      ```java
      interface Exportable { }

      void exporter(Exportable o) { ... }
      ```
      Une annotation ne crée pas de type : le contrôle se fait à l'exécution (et exige une rétention `RUNTIME`). Une
      interface marqueur permet au compilateur de refuser un objet non exportable.
