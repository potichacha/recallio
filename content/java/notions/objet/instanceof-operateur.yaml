notion: instanceof-operateur
lesson: |-
  `x instanceof T` vaut `true` si l'objet référencé par `x` **est un** `T` (sa classe, une sous-classe ou une
  implémentation de `T`), et `false` si `x` vaut `null`.

  Depuis Java 16, la forme **à motif** (*pattern matching*) teste et caste en une fois :

  ```java
  Object o = "texte";

  // avant Java 16
  if (o instanceof String) {
      String s = (String) o;
      System.out.println(s.length());
  }

  // avec motif
  if (o instanceof String s && s.length() > 3) {
      System.out.println(s.toUpperCase());
  }

  // portée par le flux : s est utilisable après le if qui sort
  if (!(o instanceof String s)) {
      return;
  }
  System.out.println(s.length());
  ```

  - La variable du motif n'existe que là où le test est **certainement vrai** : avec `&&` oui, avec `||` non.
  - Le compilateur refuse un test **impossible** : `"a" instanceof Integer` ne compile pas.
  - Depuis Java 21, le `switch` accepte aussi des motifs de type (`case Cercle c -> ...`) et des motifs de record
    (`case Point(int x, int y) -> ...`).
  - `instanceof` est parfait pour `equals` ou pour un type venu de l'extérieur ; une cascade de `instanceof` sur ses
    propres types signale plutôt un polymorphisme manquant.

  **Piège classique** : `o instanceof String s || s.isEmpty()`. Si le test est faux, `s` n'existe pas : erreur de
  compilation.

  **En entretien** : « `instanceof` teste le type réel, vaut `false` pour `null`, et sa forme à motif évite le cast
  manuel. »
cards:
  - key: definition
    format: course
    question: Que vérifie `x instanceof T` ?
    answer: Que l'objet référencé par `x` est un `T` (de la classe `T`, d'une sous-classe ou d'une implémentation) ; c'est faux si `x` vaut `null`.
  - key: motif
    format: course
    question: Qu'apporte `instanceof` à motif (Java 16) ?
    answer: Il teste le type et déclare une variable déjà castée (`o instanceof String s`), sans cast manuel ni risque de se tromper de type.
  - key: portee
    format: course
    question: Où la variable d'un motif `instanceof` est-elle utilisable ?
    answer: "Là où le test est certainement vrai : dans le `if`, à droite d'un `&&`, ou après un `if (!(o instanceof T t)) return;`."
  - key: switch-motifs
    format: course
    question: Comment Java 21 étend-il le filtrage par motif ?
    answer: Le `switch` accepte des motifs de type (`case Cercle c ->`) et de record (`case Point(int x, int y) ->`), avec une vérification d'exhaustivité sur les types scellés.
  - key: vf-null
    format: true-false
    question: "`null instanceof Object` vaut `true`."
    truth: false
    answer: '`instanceof` vaut toujours `false` pour `null`.'
  - key: vf-sous-classe
    format: true-false
    question: Un objet `Chat` est `instanceof Animal` si `Chat` étend `Animal`.
    truth: true
    answer: '`instanceof` accepte la classe et tous ses parents.'
  - key: vf-ou
    format: true-false
    question: "`if (o instanceof String s || s.isEmpty())` compile."
    truth: false
    answer: Si le test est faux, on évalue `s.isEmpty()` alors que `s` n'existe pas.
  - key: vf-impossible
    format: true-false
    question: "`\"texte\" instanceof Integer` compile et vaut `false`."
    truth: false
    answer: Le compilateur refuse un test entre types incompatibles.
  - key: qcm-resultat
    format: multiple-choice
    question: "Avec `Object o = 42;`, quels tests valent `true` ?"
    choices:
      - text: "`o instanceof Integer`"
        correct: true
      - text: "`o instanceof Number`"
        correct: true
      - text: "`o instanceof Comparable`"
        correct: true
      - text: "`o instanceof String`"
        correct: false
    answer: '`Integer` étend `Number` et implémente `Comparable`.'
  - key: qcm-portee
    format: multiple-choice
    question: Lesquels de ces codes compilent ?
    choices:
      - text: "`if (o instanceof String s && !s.isEmpty()) { }`"
        correct: true
      - text: "`if (!(o instanceof String s)) return; s.length();`"
        correct: true
      - text: "`if (o instanceof String s || s.isEmpty()) { }`"
        correct: false
      - text: "`if (o instanceof String s) { } s.length();`"
        correct: false
    answer: La variable n'existe que là où le test est certainement vrai.
  - key: qcm-equals
    format: multiple-choice
    question: "Dans `equals(Object autre)`, pourquoi `autre instanceof Point p` suffit-il à gérer `null` ?"
    choices:
      - text: "`instanceof` vaut `false` pour `null`"
        correct: true
      - text: "`equals` n'est jamais appelée avec `null`"
        correct: false
      - text: "Le compilateur ajoute le test"
        correct: false
      - text: "Il ne le gère pas, il faut un `if` en plus"
        correct: false
    answer: Le contrat d'`equals` impose `x.equals(null) == false` ; `instanceof` le garantit.
  - key: qcm-switch
    format: multiple-choice
    question: Quelle écriture Java 21 traite chaque forme selon son type ?
    choices:
      - text: "`switch (f) { case Cercle c -> ...; case Carre c -> ...; }`"
        correct: true
      - text: "`switch (f.getClass()) { case Cercle -> ...; }`"
        correct: false
      - text: "`switch (f instanceof) { ... }`"
        correct: false
      - text: "`switch (typeof f) { ... }`"
        correct: false
    answer: Le motif de type dans le `switch` ; avec une interface `sealed`, le compilateur vérifie l'exhaustivité.
  - key: trous-motif
    format: fill-in
    question: |-
      Complétez pour tester et caster en une fois :
      ```java
      if (o ___ String s) {
          System.out.println(s.length());
      }
      ```
    blanks: [[instanceof]]
    answer: '`instanceof` à motif déclare `s`, de type `String`.'
  - key: trous-et
    format: fill-in
    question: |-
      Complétez pour n'afficher que les chaînes non vides :
      ```java
      if (o instanceof String s ___ !s.isEmpty()) {
          System.out.println(s);
      }
      ```
    blanks: [["&&"]]
    answer: "Avec `&&`, la partie droite n'est évaluée que si le test a réussi : `s` y existe."
  - key: trous-equals
    format: fill-in
    question: |-
      Complétez le début de `equals` :
      ```java
      @Override
      public boolean equals(Object autre) {
          return autre instanceof Point ___ && x == p.x && y == p.y;
      }
      ```
    blanks: [[p]]
    answer: Le motif écarte `null` et les autres types, puis donne `p` déjà casté.
  - key: trous-sortie
    format: fill-in
    question: |-
      Complétez pour sortir si `o` n'est pas une chaîne, puis utiliser `s` ensuite :
      ```java
      if (___(o instanceof String s)) {
          return;
      }
      System.out.println(s.toUpperCase());
      ```
    blanks: [["!"]]
    answer: "Après ce `if`, le test est certainement vrai : `s` reste utilisable."
  - key: code-motif-et
    format: code-output
    question: |-
      ```java
      Object o = "texte";
      if (o instanceof String s && s.length() > 3) {
          System.out.println(s.toUpperCase());
      }
      ```
    answer: '`TEXTE` : le test réussit, et `s` est déjà une `String`.'
    check:
      output: "TEXTE"
  - key: code-null
    format: code-output
    question: |-
      ```java
      Object o = null;
      System.out.println((o instanceof Object) + " " + (o == null));
      ```
    answer: '`false true` : `instanceof` vaut `false` pour `null`.'
    check:
      output: "false true"
  - key: code-impossible
    format: code-output
    question: |-
      ```java
      String s = "a";
      System.out.println(s instanceof Integer);
      ```
      Ce code compile-t-il ?
    answer: 'Non : `incompatible types: String cannot be converted to Integer`.'
    check:
      compiles: false
  - key: code-filtrer-nombres
    format: code-output
    question: |-
      ```java
      Object[] valeurs = { 1, "deux", 3.7, 'c' };
      for (Object v : valeurs) {
          if (v instanceof Number n) {
              System.out.print(n.intValue() + ";");
          }
      }
      ```
    answer: '`1;3;` : `Integer` et `Double` sont des `Number` ; ni `String` ni `Character` ne le sont.'
    check:
      output: "1;3;"
  - key: bug-cast-redondant
    format: bug-fix
    question: |-
      Simplifiez ce code (Java 16+) :
      ```java
      if (o instanceof Commande) {
          Commande c = (Commande) o;
          traiter(c);
      }
      ```
    answer: |-
      ```java
      if (o instanceof Commande c) {
          traiter(c);
      }
      ```
      Le motif teste et caste en une seule fois, sans risque de caster vers un autre type que celui testé.
  - key: bug-ou
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: variable s`) :
      ```java
      if (o instanceof String s || s.isBlank()) {
          return "à traiter";
      }
      ```
      On veut traiter les chaînes non blanches.
    answer: |-
      ```java
      if (o instanceof String s && !s.isBlank()) {
          return "à traiter";
      }
      ```
      À droite de `||`, le test `instanceof` a échoué : `s` n'existe pas. Avec `&&`, la partie droite n'est évaluée que
      si `o` est bien une `String`.
  - key: bug-equals-getclass-null
    format: bug-fix
    question: |-
      `point.equals(null)` lève une `NullPointerException` :
      ```java
      @Override
      public boolean equals(Object autre) {
          Point p = (Point) autre;
          return x == p.x && y == p.y;
      }
      ```
    answer: |-
      ```java
      @Override
      public boolean equals(Object autre) {
          return autre instanceof Point p && x == p.x && y == p.y;
      }
      ```
      Le cast sans test échoue sur `null` (NPE à `p.x`) et sur un autre type (`ClassCastException`) ; `instanceof`
      renvoie `false` dans les deux cas, comme l'exige le contrat d'`equals`.
  - key: bug-cascade
    format: bug-fix
    question: |-
      Cette cascade oublie silencieusement les nouvelles formes :
      ```java
      double aire(Forme f) {
          if (f instanceof Cercle c) return Math.PI * c.r() * c.r();
          if (f instanceof Carre c) return c.cote() * c.cote();
          return 0;
      }
      ```
      `Forme` est une interface `sealed` qui autorise `Cercle`, `Carre` et `Triangle`.
    answer: |-
      ```java
      double aire(Forme f) {
          return switch (f) {
              case Cercle c -> Math.PI * c.r() * c.r();
              case Carre c -> c.cote() * c.cote();
              case Triangle t -> t.base() * t.hauteur() / 2;
          };
      }
      ```
      Le `return 0` cachait le `Triangle` oublié. Un `switch` à motifs sur un type scellé est vérifié exhaustif : une
      forme non traitée devient une erreur de compilation.
