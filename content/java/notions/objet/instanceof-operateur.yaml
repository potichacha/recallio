notion: instanceof-operateur
lesson: |-
  `x instanceof T` vaut `true` si l'objet référencé par `x` **est un** `T` (sa classe, une sous-classe ou une
  implémentation de `T`), et `false` si `x` vaut `null`.

  Depuis Java 16, la forme **à motif** (*pattern matching*) teste et caste en une fois :

  ```java
  Object o = "texte";

  // avant Java 16
  if (o instanceof String) {
      String s = (String) o;
      System.out.println(s.length());
  }

  // avec motif
  if (o instanceof String s && s.length() > 3) {
      System.out.println(s.toUpperCase());
  }

  // portée par le flux : s est utilisable après le if qui sort
  if (!(o instanceof String s)) {
      return;
  }
  System.out.println(s.length());
  ```

  - La variable du motif n'existe que là où le test est **certainement vrai** : avec `&&` oui, avec `||` non.
  - Le compilateur refuse un test **impossible** : `"a" instanceof Integer` ne compile pas.
  - Depuis Java 21, le `switch` accepte aussi des motifs de type (`case Cercle c -> ...`) et des motifs de record
    (`case Point(int x, int y) -> ...`).
  - `instanceof` est parfait pour `equals` ou pour un type venu de l'extérieur ; une cascade de `instanceof` sur ses
    propres types signale plutôt un polymorphisme manquant.

  **Piège classique** : `o instanceof String s || s.isEmpty()`. Si le test est faux, `s` n'existe pas : erreur de
  compilation.

  **En entretien** : « `instanceof` teste le type réel, vaut `false` pour `null`, et sa forme à motif évite le cast
  manuel. »
tour:
  - title: instanceof
    text: |-
      `x instanceof Chien` vaut `true` si l'objet désigné par `x` est un `Chien` (ou une sous-classe), et `false` pour
      `null`. Depuis Java 16, le **pattern matching** déclare en même temps une variable du bon type :
      `if (x instanceof Chien c)`, sans transtypage, et on peut y ajouter une condition avec `&&`.

      Une cascade de `instanceof` se remplace avantageusement par un `switch` sur les types, avec des records et des
      interfaces scellées (Java 21).
    example:
      files:
        Main.java: |-
          record Chien(String nom) {}

          record Chat(String nom, int vies) {}

          String decrit(Object o) {
              if (o instanceof Chien c) {
                  return "chien " + c.nom();
              } else if (o instanceof Chat chat && chat.vies() > 1) {
                  return "chat " + chat.nom() + " à " + chat.vies() + " vies";
              }
              return "inconnu";
          }

          void main() {
              IO.println(decrit(new Chien("Rex")));
              IO.println(decrit(new Chat("Tom", 9)));
              IO.println(decrit("une chaîne"));
              IO.println(null instanceof Object);
          }
      output: |-
        chien Rex
        chat Tom à 9 vies
        inconnu
        false
cards:
  - key: definition
    format: course
    question: "Que vérifie `x instanceof T` ?"
    choices:
      - {text: "Que l'objet référencé par `x` est un `T` ou un sous-type, et que `x` n'est pas `null`", correct: true}
      - {text: "Que la classe exacte de l'objet est `T`, sous-classes exclues", correct: false}
      - {text: "Que le type déclaré de la variable `x` est `T`, à la compilation", correct: false}
      - {text: "Que `x` est un `T`, `null` compris : `null` est de tous les types", correct: false}
    answer: |-
      Que l'objet référencé par `x` est un `T` (de la classe `T`, d'une sous-classe ou d'une implémentation) ; c'est
      faux si `x` vaut `null`. C'est `getClass() == T.class` qui exigerait la classe exacte.
  - key: motif
    format: course
    question: "Qu'apporte `instanceof` à motif (Java 16) ?"
    choices:
      - {text: "Il teste le type et déclare une variable déjà castée : `o instanceof String s`", correct: true}
      - {text: "Il accepte `null` comme une instance de tous les types testés", correct: false}
      - {text: "Il compare la classe exacte de l'objet, sans les sous-classes", correct: false}
      - {text: "Il caste d'abord, puis lève une exception si le type est faux", correct: false}
    answer: |-
      Il teste le type et déclare une variable déjà castée (`o instanceof String s`), sans cast manuel ni risque de se
      tromper de type.
  - key: portee
    format: course
    question: "Après `o instanceof String s`, où peut-on utiliser la variable `s` ?"
    choices:
      - {text: "Là où le test est certainement vrai : dans le `if`, après un `&&`", correct: true}
      - {text: "Partout dans la méthode, dès la ligne du test", correct: false}
      - {text: "Seulement dans le bloc du `if`, jamais ailleurs", correct: false}
      - {text: "Dans le `if`, et à droite d'un `||` qui suit le test", correct: false}
    answer: |-
      Là où le test est certainement vrai : dans le `if`, à droite d'un `&&`, ou après un
      `if (!(o instanceof String s)) return;`. À droite d'un `||`, le test a pu échouer : `s` n'y existe pas.
  - key: switch-motifs
    format: course
    question: "Comment Java 21 étend-il le filtrage par motif ?"
    choices:
      - {text: "Le `switch` accepte des motifs de type et de record, exhaustifs sur les types scellés", correct: true}
      - {text: "Le `switch` accepte des expressions régulières dans ses `case`, vérifiées à la compilation", correct: false}
      - {text: "`instanceof` accepte plusieurs types à la fois, séparés par `|`, dans un seul test", correct: false}
      - {text: "Le `switch` compare les objets avec `equals`, quel que soit leur type déclaré", correct: false}
    answer: |-
      Le `switch` accepte des motifs de type (`case Cercle c ->`) et de record (`case Point(int x, int y) ->`), avec
      une vérification d'exhaustivité sur les types scellés.
  - key: vf-null
    format: true-false
    question: "`null instanceof Object` vaut `true`."
    truth: false
    answer: '`instanceof` vaut toujours `false` pour `null`.'
  - key: vf-sous-classe
    format: true-false
    question: Un objet `Chat` est `instanceof Animal` si `Chat` étend `Animal`.
    truth: true
    answer: '`instanceof` accepte la classe et tous ses parents.'
  - key: vf-ou
    format: true-false
    question: "La condition `if (o instanceof String s || s.isEmpty())` compile sans erreur."
    truth: false
    answer: Si le test est faux, on évalue `s.isEmpty()` alors que `s` n'existe pas.
  - key: vf-impossible
    format: true-false
    question: "`\"texte\" instanceof Integer` compile et vaut `false`."
    truth: false
    answer: Le compilateur refuse un test entre types incompatibles.
  - key: qcm-resultat
    format: multiple-choice
    question: "Avec `Object o = 42;`, lequel de ces tests vaut `false` ?"
    choices:
      - {text: "`o instanceof Integer`", correct: false}
      - {text: "`o instanceof Number`", correct: false}
      - {text: "`o instanceof Comparable`", correct: false}
      - {text: "`o instanceof String`", correct: true}
    answer: "`42` devient un `Integer`, qui étend `Number` et implémente `Comparable` : seul le test sur `String` échoue."
  - key: qcm-portee
    format: multiple-choice
    question: "Lequel de ces codes compile ?"
    choices:
      - {text: "`if (o instanceof String s && !s.isEmpty()) { }`", correct: true}
      - {text: "`if (o instanceof String s || s.isEmpty()) { }`", correct: false}
      - {text: "`if (o instanceof String s) { } s.length();`", correct: false}
      - {text: "`if (!(o instanceof String s)) { s.length(); }`", correct: false}
    answer: |-
      La variable n'existe que là où le test est certainement vrai : à droite d'un `&&`, oui ; à droite d'un `||`,
      après un `if` sans sortie ou dans le bloc d'un test nié, non.
  - key: qcm-equals
    format: multiple-choice
    question: "Dans `equals(Object autre)`, pourquoi `autre instanceof Point p` suffit-il à gérer `null` ?"
    choices:
      - text: "`instanceof` vaut `false` pour `null`"
        correct: true
      - text: "`equals` n'est jamais appelée avec `null`"
        correct: false
      - text: "Le compilateur ajoute le test"
        correct: false
      - text: "Il ne le gère pas, il faut un `if` en plus"
        correct: false
    answer: Le contrat d'`equals` impose `x.equals(null) == false` ; `instanceof` le garantit.
  - key: qcm-switch
    format: multiple-choice
    question: Quelle écriture Java 21 traite chaque forme selon son type ?
    choices:
      - text: "`switch (f) { case Cercle c -> ...; case Carre c -> ...; }`"
        correct: true
      - text: "`switch (f.getClass()) { case Cercle -> ...; }`"
        correct: false
      - text: "`switch (f instanceof) { ... }`"
        correct: false
      - text: "`switch (typeof f) { ... }`"
        correct: false
    answer: Le motif de type dans le `switch` ; avec une interface `sealed`, le compilateur vérifie l'exhaustivité.
  - key: trous-motif
    format: fill-in
    question: |-
      Complète pour tester et caster en une fois :
      ```java
      if (o ___ String s) {
          System.out.println(s.length());
      }
      ```
    blanks: [[instanceof]]
    answer: '`instanceof` à motif déclare `s`, de type `String`.'
  - key: trous-et
    format: fill-in
    question: |-
      Complète pour n'afficher que les chaînes non vides :
      ```java
      if (o instanceof String s ___ !s.isEmpty()) {
          System.out.println(s);
      }
      ```
    blanks: [["&&"]]
    answer: "Avec `&&`, la partie droite n'est évaluée que si le test a réussi : `s` y existe."
  - key: trous-equals
    format: fill-in
    question: |-
      Complète le début de `equals` :
      ```java
      @Override
      public boolean equals(Object autre) {
          return autre instanceof Point ___ && x == p.x && y == p.y;
      }
      ```
    blanks: [[p]]
    answer: Le motif écarte `null` et les autres types, puis donne `p` déjà casté.
  - key: trous-sortie
    format: fill-in
    question: |-
      Complète pour sortir si `o` n'est pas une chaîne, puis utiliser `s` ensuite :
      ```java
      if (___(o instanceof String s)) {
          return;
      }
      System.out.println(s.toUpperCase());
      ```
    blanks: [["!"]]
    answer: "Après ce `if`, le test est certainement vrai : `s` reste utilisable."
  - key: code-motif-et
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Object o = "texte";
      if (o instanceof String s && s.length() > 3) {
          System.out.println(s.toUpperCase());
      }
      ```
    choices:
      - {text: "`TEXTE`", correct: true}
      - {text: "`texte`", correct: false}
      - {text: "`true`", correct: false}
      - {text: "Rien", correct: false}
    answer: "`TEXTE` : le test réussit (cinq caractères), et `s` est déjà une `String`."
    check:
      output: "TEXTE"
  - key: code-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Object o = null;
      System.out.println((o instanceof Object) + " " + (o == null));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: "`false true` : `instanceof` vaut `false` pour `null`, sans lever d'exception."
    check:
      output: "false true"
  - key: code-impossible
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = "a";
      System.out.println(s instanceof Integer);
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`true`", correct: false}
      - {text: "Une `ClassCastException`", correct: false}
    answer: |-
      Ça ne compile pas (`incompatible types: String cannot be converted to Integer`) : une `String` ne peut jamais être
      un `Integer`, le compilateur refuse le test.
    check:
      compiles: false
  - key: code-filtrer-nombres
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Object[] valeurs = { 1, "deux", 3.7, 'c' };
      for (Object v : valeurs) {
          if (v instanceof Number n) {
              System.out.print(n.intValue() + ";");
          }
      }
      ```
    choices:
      - {text: "`1;3;`", correct: true}
      - {text: "`1;3.7;`", correct: false}
      - {text: "`1;4;`", correct: false}
      - {text: "`1;3;99;`", correct: false}
    answer: |-
      `1;3;` : `Integer` et `Double` sont des `Number`, et `intValue()` tronque 3,7 en 3 ; ni `String` ni `Character`
      ne sont des `Number`.
    check:
      output: "1;3;"
  - key: bug-cast-redondant
    format: bug-fix
    question: |-
      Ce code teste puis caste à la main. Quelle écriture Java 16+ est la bonne ?
      ```java
      if (o instanceof Commande) {
          Commande c = (Commande) o;
          traiter(c);
      }
      ```
    choices:
      - {text: "`if (o instanceof Commande c) { traiter(c); }`", correct: true}
      - {text: "`if (o instanceof (Commande) c) { traiter(c); }`", correct: false}
      - {text: "`if ((Commande) o instanceof c) { traiter(c); }`", correct: false}
      - {text: "`Commande c = o instanceof Commande; traiter(c);`", correct: false}
    answer: |-
      ```java
      if (o instanceof Commande c) {
          traiter(c);
      }
      ```
      Le motif teste et caste en une seule fois, sans risque de caster vers un autre type que celui testé.
  - key: bug-ou
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: variable s`) :
      ```java
      if (o instanceof String s || s.isBlank()) {
          return "à traiter";
      }
      ```
      On veut traiter les chaînes non blanches. Quelle correction est la bonne ?
    choices:
      - {text: "Remplacer `||` par `&&`, et tester `!s.isBlank()`", correct: true}
      - {text: "Déclarer `String s;` avant le `if`, sans valeur", correct: false}
      - {text: "Inverser les deux côtés du `||`", correct: false}
      - {text: "Caster à droite : `((String) o).isBlank()`", correct: false}
    answer: |-
      ```java
      if (o instanceof String s && !s.isBlank()) {
          return "à traiter";
      }
      ```
      À droite de `||`, le test `instanceof` a échoué : `s` n'existe pas. Avec `&&`, la partie droite n'est évaluée que
      si `o` est bien une `String`.
  - key: bug-equals-getclass-null
    format: bug-fix
    question: |-
      `point.equals(null)` lève une `NullPointerException`. Quelle correction est la bonne ?
      ```java
      @Override
      public boolean equals(Object autre) {
          Point p = (Point) autre;
          return x == p.x && y == p.y;
      }
      ```
    choices:
      - {text: "`return autre instanceof Point p && x == p.x && y == p.y;`", correct: true}
      - {text: "Ajouter `if (autre == null) throw new IllegalArgumentException();`", correct: false}
      - {text: "Remplacer le cast par `Point p = Point.class.cast(autre);`", correct: false}
      - {text: "Comparer `this == autre` au lieu de comparer les champs", correct: false}
    answer: |-
      ```java
      @Override
      public boolean equals(Object autre) {
          return autre instanceof Point p && x == p.x && y == p.y;
      }
      ```
      Le cast sans test échoue sur `null` (NPE à `p.x`) et sur un autre type (`ClassCastException`) ; `instanceof`
      renvoie `false` dans les deux cas, comme l'exige le contrat d'`equals`.
  - key: bug-cascade
    format: bug-fix
    question: |-
      Cette cascade oublie silencieusement les nouvelles formes :
      ```java
      double aire(Forme f) {
          if (f instanceof Cercle c) return Math.PI * c.r() * c.r();
          if (f instanceof Carre c) return c.cote() * c.cote();
          return 0;
      }
      ```
      `Forme` est une interface `sealed` qui autorise `Cercle`, `Carre` et `Triangle`. Quelle correction est la bonne ?
    choices:
      - {text: "Un `switch` à motifs sur `f`, sans `default`, vérifié exhaustif", correct: true}
      - {text: "Un `switch` à motifs sur `f`, avec un `default -> 0` final", correct: false}
      - {text: "Remplacer `return 0` par `return -1`, pour repérer l'oubli", correct: false}
      - {text: "Ajouter un dernier `if` qui teste `f instanceof Forme`", correct: false}
    answer: |-
      ```java
      double aire(Forme f) {
          return switch (f) {
              case Cercle c -> Math.PI * c.r() * c.r();
              case Carre c -> c.cote() * c.cote();
              case Triangle t -> t.base() * t.hauteur() / 2;
          };
      }
      ```
      Le `return 0` cachait le `Triangle` oublié. Un `switch` à motifs sur un type scellé, sans `default`, est vérifié
      exhaustif : une forme non traitée devient une erreur de compilation. Un `default` la cacherait de nouveau.
