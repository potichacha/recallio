notion: enum-champs-methodes
lesson: |-
  Une enum est une vraie classe : ses constantes peuvent porter des **données**, et elle peut avoir des **méthodes**,
  y compris un comportement **propre à chaque constante**.

  ```java
  enum Operation {
      PLUS("+") {
          int appliquer(int a, int b) { return a + b; }
      },
      FOIS("*") {
          int appliquer(int a, int b) { return a * b; }
      };

      private final String symbole;

      Operation(String symbole) {          // implicitement private
          this.symbole = symbole;
      }

      String symbole() { return symbole; }

      abstract int appliquer(int a, int b); // chaque constante l'implémente
  }

  Operation.FOIS.appliquer(2, 3);         // 6
  ```

  - La liste des constantes vient **en premier**, terminée par `;` s'il y a autre chose ensuite.
  - Chaque constante appelle le constructeur avec ses arguments ; les champs sont en général `final`.
  - Une constante avec un corps `{ ... }` est une **sous-classe anonyme** de l'enum : `getClass()` diffère alors de
    `getDeclaringClass()`.
  - Pour retrouver une constante à partir d'un champ, on construit une `Map` dans un bloc `static` (le constructeur
    ne peut pas lire un champ `static` non constant).
  - Ces méthodes remplacent les `switch` dispersés : le comportement vit avec la constante.

  **Piège classique** : enregistrer chaque constante dans une `Map` `static` depuis le constructeur. Les constantes
  sont créées **avant** les autres champs `static` : le compilateur l'interdit (`illegal reference to static field
  from initializer`).

  **En entretien** : « Une enum peut porter des champs, un constructeur privé et des méthodes, même abstraites pour un
  comportement par constante ; c'est souvent mieux qu'un `switch`. »
cards:
  - key: champs
    format: course
    question: Comment associer une donnée à chaque constante d'une enum ?
    answer: 'Avec un champ (souvent `final`) et un constructeur : `PIECE_UN(1)`, et `Piece(int valeur) { this.valeur = valeur; }`.'
  - key: methode-abstraite
    format: course
    question: Comment donner un comportement différent à chaque constante ?
    answer: En déclarant une méthode `abstract` dans l'enum et en l'implémentant dans le corps de chaque constante (`PLUS { int appliquer(...) { ... } }`).
  - key: corps-constante
    format: course
    question: Qu'est-ce qu'une constante d'enum avec un corps ?
    answer: Une sous-classe anonyme de l'enum ; c'est pourquoi `getClass()` ne renvoie plus l'enum, alors que `getDeclaringClass()` si.
  - key: recherche
    format: course
    question: Comment retrouver une constante à partir d'un de ses champs (un symbole, un code) ?
    answer: Avec une méthode `static` qui parcourt `values()`, ou une `Map` remplie dans un bloc `static` après la création des constantes.
  - key: vf-constructeur-public
    format: true-false
    question: Le constructeur d'une enum peut être `public`.
    truth: false
    answer: Il est implicitement `private`, et ne peut être ni `public` ni `protected`.
  - key: vf-constantes-dabord
    format: true-false
    question: Les constantes d'une enum doivent être déclarées avant ses champs et ses méthodes.
    truth: true
    answer: La liste des constantes vient en premier, terminée par un point-virgule.
  - key: vf-abstraite
    format: true-false
    question: Une enum peut déclarer une méthode `abstract`.
    truth: true
    answer: Chaque constante doit alors l'implémenter dans son corps.
  - key: vf-static-constructeur
    format: true-false
    question: Le constructeur d'une enum peut ajouter la constante à une `Map` `static` de l'enum.
    truth: false
    answer: Les constantes sont créées avant les autres champs `static` ; le compilateur refuse cet accès.
  - key: qcm-syntaxe
    format: multiple-choice
    question: Quelle déclaration est correcte ?
    choices:
      - text: "`enum Piece { UN(1), DEUX(2); final int valeur; Piece(int v) { valeur = v; } }`"
        correct: true
      - text: "`enum Piece { final int valeur; UN(1), DEUX(2); }`"
        correct: false
      - text: "`enum Piece { UN = 1, DEUX = 2 }`"
        correct: false
      - text: "`enum Piece { UN(1), DEUX(2) public Piece(int v) { } }`"
        correct: false
    answer: Les constantes en premier, puis `;`, puis les membres ; le constructeur n'est jamais `public`.
  - key: qcm-get-class
    format: multiple-choice
    question: "Quelle méthode renvoie toujours la classe de l'enum, même pour une constante avec un corps ?"
    choices:
      - text: "`getDeclaringClass()`"
        correct: true
      - text: "`getClass()`"
        correct: false
      - text: "`getSuperclass()`"
        correct: false
      - text: "`name()`"
        correct: false
    answer: '`getClass()` renvoie la sous-classe anonyme de la constante.'
  - key: qcm-remplacer-switch
    format: multiple-choice
    question: Un `switch` sur l'enum `Abonnement` calcule les frais à cinq endroits du code. Que faire ?
    choices:
      - text: "Ajouter un champ `frais` (ou une méthode `frais()`) à l'enum"
        correct: true
      - text: "Ajouter un sixième `switch`"
        correct: false
      - text: "Remplacer l'enum par des chaînes"
        correct: false
      - text: "Utiliser l'ordinal comme montant"
        correct: false
    answer: La donnée vit avec sa constante, et une nouvelle constante doit la fournir.
  - key: qcm-interface
    format: multiple-choice
    question: "Comment permettre d'ajouter des opérations hors de l'enum `Operation` ?"
    choices:
      - text: "Lui faire implémenter une interface `OperationBinaire`, que d'autres classes peuvent implémenter"
        correct: true
      - text: "L'étendre avec `extends Operation`"
        correct: false
      - text: "Ajouter des constantes à l'exécution"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: Une enum est fermée, mais l'interface qu'elle implémente reste ouverte (*Effective Java*, item 38).
  - key: code-champ
    format: code-output
    question: |-
      ```java
      enum Piece {
          UN(1), DEUX(2), CINQ(5);
          final int valeur;
          Piece(int valeur) { this.valeur = valeur; }
      }
      int total = 0;
      for (Piece p : Piece.values()) {
          total += p.valeur;
      }
      System.out.println(total);
      ```
    answer: '`8` : chaque constante porte sa valeur.'
    check:
      output: "8"
  - key: code-comportement
    format: code-output
    question: |-
      ```java
      enum Operation {
          PLUS { int appliquer(int a, int b) { return a + b; } },
          FOIS { int appliquer(int a, int b) { return a * b; } };
          abstract int appliquer(int a, int b);
      }
      System.out.println(Operation.PLUS.appliquer(2, 3) + " " + Operation.FOIS.appliquer(2, 3));
      ```
    answer: '`5 6` : chaque constante a sa propre implémentation.'
    check:
      output: "5 6"
  - key: code-get-class
    format: code-output
    question: |-
      ```java
      enum Operation {
          PLUS { int appliquer(int a, int b) { return a + b; } };
          abstract int appliquer(int a, int b);
      }
      System.out.println((Operation.PLUS.getClass() == Operation.class) + " "
              + (Operation.PLUS.getDeclaringClass() == Operation.class));
      ```
    answer: '`false true` : la constante avec un corps est une sous-classe anonyme de l''enum.'
    check:
      output: "false true"
  - key: code-recherche
    format: code-output
    question: |-
      ```java
      enum Devise {
          EUR("€"), USD("$");
          private static final Map<String, Devise> PAR_SYMBOLE = new HashMap<>();
          static {
              for (Devise d : values()) {
                  PAR_SYMBOLE.put(d.symbole, d);
              }
          }
          final String symbole;
          Devise(String symbole) { this.symbole = symbole; }
          static Devise deSymbole(String s) { return PAR_SYMBOLE.get(s); }
      }
      System.out.println(Devise.deSymbole("$"));
      ```
    answer: '`USD` : la table est remplie dans le bloc `static`, après la création des constantes.'
    check:
      output: "USD"
  - key: bug-map-constructeur
    format: bug-fix
    question: |-
      Ce code ne compile pas (`illegal reference to static field from initializer`) :
      ```java
      enum Devise {
          EUR("€"), USD("$");
          private static final Map<String, Devise> PAR_SYMBOLE = new HashMap<>();
          Devise(String symbole) {
              PAR_SYMBOLE.put(symbole, this);
          }
      }
      ```
    answer: |-
      ```java
      enum Devise {
          EUR("€"), USD("$");
          private static final Map<String, Devise> PAR_SYMBOLE = new HashMap<>();
          static {
              for (Devise d : values()) PAR_SYMBOLE.put(d.symbole, d);
          }
          private final String symbole;
          Devise(String symbole) { this.symbole = symbole; }
      }
      ```
      Les constantes sont construites avant l'initialisation de `PAR_SYMBOLE`, qui vaut encore `null`. On remplit la
      table dans un bloc `static`, placé après les constantes.
  - key: bug-switch-disperse
    format: bug-fix
    question: |-
      Chaque nouvel abonnement oblige à modifier ce calcul, et deux autres semblables :
      ```java
      double frais(Abonnement a) {
          return switch (a) {
              case BASIC -> 5.0;
              case PREMIUM -> 0.0;
          };
      }
      ```
    answer: |-
      ```java
      enum Abonnement {
          BASIC(5.0), PREMIUM(0.0);

          private final double frais;
          Abonnement(double frais) { this.frais = frais; }
          double frais() { return frais; }
      }
      ```
      La donnée vit avec sa constante : une nouvelle constante ne compile pas sans ses frais, et les `switch`
      disparaissent.
  - key: bug-ordinal-donnee
    format: bug-fix
    question: |-
      Le taux de TVA est calculé à partir de la position de la constante :
      ```java
      enum Taux { REDUIT, INTERMEDIAIRE, NORMAL }
      double[] VALEURS = { 0.055, 0.10, 0.20 };
      double taux = VALEURS[t.ordinal()];
      ```
    answer: |-
      ```java
      enum Taux {
          REDUIT(0.055), INTERMEDIAIRE(0.10), NORMAL(0.20);

          private final double valeur;
          Taux(double valeur) { this.valeur = valeur; }
          double valeur() { return valeur; }
      }
      ```
      Le tableau parallèle se désynchronise dès qu'on insère une constante. Un champ d'instance lie la valeur à sa
      constante (*Effective Java*, item 35).
  - key: bug-constructeur-public
    format: bug-fix
    question: |-
      Ce code ne compile pas (`modifier public not allowed here`) :
      ```java
      enum Couleur {
          ROUGE("#f00"), VERT("#0f0");
          private final String hexa;
          public Couleur(String hexa) { this.hexa = hexa; }
      }
      ```
    answer: |-
      ```java
      enum Couleur {
          ROUGE("#f00"), VERT("#0f0");
          private final String hexa;
          Couleur(String hexa) { this.hexa = hexa; }
      }
      ```
      Le constructeur d'une enum est implicitement privé : on n'écrit pas de modificateur (ou `private`).
