notion: enum-champs-methodes
lesson: |-
  Une enum est une vraie classe : ses constantes peuvent porter des **données**, et elle peut avoir des **méthodes**,
  y compris un comportement **propre à chaque constante**.

  ```java
  enum Operation {
      PLUS("+") {
          int appliquer(int a, int b) { return a + b; }
      },
      FOIS("*") {
          int appliquer(int a, int b) { return a * b; }
      };

      private final String symbole;

      Operation(String symbole) {          // implicitement private
          this.symbole = symbole;
      }

      String symbole() { return symbole; }

      abstract int appliquer(int a, int b); // chaque constante l'implémente
  }

  Operation.FOIS.appliquer(2, 3);         // 6
  ```

  - La liste des constantes vient **en premier**, terminée par `;` s'il y a autre chose ensuite.
  - Chaque constante appelle le constructeur avec ses arguments ; les champs sont en général `final`.
  - Une constante avec un corps `{ ... }` est une **sous-classe anonyme** de l'enum : `getClass()` diffère alors de
    `getDeclaringClass()`.
  - Pour retrouver une constante à partir d'un champ, on construit une `Map` dans un bloc `static` (le constructeur
    ne peut pas lire un champ `static` non constant).
  - Ces méthodes remplacent les `switch` dispersés : le comportement vit avec la constante.

  **Piège classique** : enregistrer chaque constante dans une `Map` `static` depuis le constructeur. Les constantes
  sont créées **avant** les autres champs `static` : le compilateur l'interdit (`illegal reference to static field
  from initializer`).

  **En entretien** : « Une enum peut porter des champs, un constructeur privé et des méthodes, même abstraites pour un
  comportement par constante ; c'est souvent mieux qu'un `switch`. »
cards:
  - key: champs
    format: course
    question: Comment associer une donnée à chaque constante d'une enum ?
    choices:
      - {text: "Avec un champ `final` et un constructeur : `UN(1)` appelle `Piece(int valeur)`", correct: true}
      - {text: "Avec une `Map` globale qui associe à chaque `ordinal()` sa donnée", correct: false}
      - {text: "Avec un setter public, appelé une fois au démarrage de l'application", correct: false}
      - {text: "Impossible : une constante d'enum ne peut porter aucune donnée", correct: false}
    answer: |-
      Avec un champ (souvent `final`) et un constructeur : `PIECE_UN(1)`, et `Piece(int valeur) { this.valeur = valeur; }`.
      La donnée vit avec sa constante, sans table à part indexée par l'ordinal.
  - key: methode-abstraite
    format: course
    question: Comment donner un comportement différent à chaque constante ?
    choices:
      - {text: "Déclarer une méthode `abstract` dans l'enum, implémentée dans le corps de chaque constante", correct: true}
      - {text: "Faire étendre l'enum par une sous-classe par constante, déclarée avec `extends`", correct: false}
      - {text: "Déclarer une interface par constante, que l'enum implémente toutes à la fois", correct: false}
      - {text: "Impossible : toutes les constantes partagent les mêmes méthodes, sans exception", correct: false}
    answer: |-
      On déclare une méthode `abstract` dans l'enum et on l'implémente dans le corps de chaque constante
      (`PLUS { int appliquer(...) { ... } }`) ; le compilateur exige qu'aucune constante ne l'oublie.
  - key: corps-constante
    format: course
    question: Qu'est-ce qu'une constante d'enum avec un corps ?
    choices:
      - {text: "Une sous-classe anonyme de l'enum : `getClass()` ne renvoie plus l'enum", correct: true}
      - {text: "Une constante avec ses propres champs, de la classe exacte de l'enum", correct: false}
      - {text: "Une enum imbriquée dans l'enum, qui déclare ses propres constantes", correct: false}
      - {text: "Une constante `static` ordinaire, initialisée par un bloc d'instance", correct: false}
    answer: |-
      Une sous-classe anonyme de l'enum ; c'est pourquoi `getClass()` ne renvoie plus l'enum, alors que
      `getDeclaringClass()` si.
  - key: recherche
    format: course
    question: Comment retrouver une constante à partir d'un de ses champs (un symbole, un code) ?
    choices:
      - {text: "Par une `Map` remplie dans un bloc `static`, ou en parcourant `values()`", correct: true}
      - {text: "Par une `Map` remplie dans le constructeur de l'enum, à chaque constante", correct: false}
      - {text: "Avec `valueOf(symbole)`, qui cherche aussi dans les champs des constantes", correct: false}
      - {text: "Avec `ordinal()`, qui range les constantes selon leur symbole", correct: false}
    answer: |-
      Avec une méthode `static` qui parcourt `values()`, ou une `Map` remplie dans un bloc `static` après la création des
      constantes. Le constructeur ne peut pas toucher un champ `static` de l'enum, et `valueOf` ne connaît que les noms.
  - key: vf-constructeur-public
    format: true-false
    question: Le constructeur d'une enum peut être `public`.
    truth: false
    answer: Il est implicitement `private`, et ne peut être ni `public` ni `protected`.
  - key: vf-constantes-dabord
    format: true-false
    question: Les constantes d'une enum doivent être déclarées avant ses champs et ses méthodes.
    truth: true
    answer: La liste des constantes vient en premier, terminée par un point-virgule.
  - key: vf-abstraite
    format: true-false
    question: Une enum peut déclarer une méthode `abstract`.
    truth: true
    answer: Chaque constante doit alors l'implémenter dans son corps.
  - key: vf-static-constructeur
    format: true-false
    question: Le constructeur d'une enum peut ajouter la constante à une `Map` `static` de l'enum.
    truth: false
    answer: Les constantes sont créées avant les autres champs `static` ; le compilateur refuse cet accès.
  - key: qcm-syntaxe
    format: multiple-choice
    question: Quelle déclaration est correcte ?
    choices:
      - text: "`enum Piece { UN(1), DEUX(2); final int valeur; Piece(int v) { valeur = v; } }`"
        correct: true
      - text: "`enum Piece { final int valeur; UN(1), DEUX(2); }`"
        correct: false
      - text: "`enum Piece { UN = 1, DEUX = 2 }`"
        correct: false
      - text: "`enum Piece { UN(1), DEUX(2) public Piece(int v) { } }`"
        correct: false
    answer: Les constantes en premier, puis `;`, puis les membres ; le constructeur n'est jamais `public`.
  - key: qcm-get-class
    format: multiple-choice
    question: "Quelle méthode renvoie toujours la classe de l'enum, même pour une constante avec un corps ?"
    choices:
      - text: "`getDeclaringClass()`"
        correct: true
      - text: "`getClass()`"
        correct: false
      - text: "`getSuperclass()`"
        correct: false
      - text: "`name()`"
        correct: false
    answer: '`getClass()` renvoie la sous-classe anonyme de la constante.'
  - key: qcm-remplacer-switch
    format: multiple-choice
    question: Un `switch` sur l'enum `Abonnement` calcule les frais à cinq endroits du code. Que faire ?
    choices:
      - {text: "Ajouter un champ `frais` (ou une méthode `frais()`) à l'enum", correct: true}
      - {text: "Ajouter un sixième `switch` là où les frais manquent", correct: false}
      - {text: "Remplacer l'enum par des chaînes, plus faciles à comparer", correct: false}
      - {text: "Utiliser l'ordinal de chaque constante comme montant", correct: false}
    answer: La donnée vit avec sa constante, et une nouvelle constante doit la fournir.
  - key: qcm-interface
    format: multiple-choice
    question: "Comment permettre d'ajouter des opérations hors de l'enum `Operation` ?"
    choices:
      - {text: "Lui faire implémenter une interface `OperationBinaire`, que d'autres classes peuvent implémenter", correct: true}
      - {text: "L'étendre avec `extends Operation` dans une autre enum, qui ajoute ses propres constantes", correct: false}
      - {text: "Ajouter des constantes à l'exécution, en appelant `Operation.valueOf` sur un nouveau nom", correct: false}
      - {text: "C'est impossible : une enum est fermée, et aucune opération ne peut s'y ajouter", correct: false}
    answer: Une enum est fermée, mais l'interface qu'elle implémente reste ouverte (*Effective Java*, item 38).
  - key: code-champ
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Piece {
          UN(1), DEUX(2), CINQ(5);
          final int valeur;
          Piece(int valeur) { this.valeur = valeur; }
      }
      int total = 0;
      for (Piece p : Piece.values()) {
          total += p.valeur;
      }
      System.out.println(total);
      ```
    choices:
      - {text: "`8`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
    answer: '`8` : chaque constante porte sa valeur.'
    check:
      output: "8"
  - key: code-comportement
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Operation {
          PLUS { int appliquer(int a, int b) { return a + b; } },
          FOIS { int appliquer(int a, int b) { return a * b; } };
          abstract int appliquer(int a, int b);
      }
      System.out.println(Operation.PLUS.appliquer(2, 3) + " " + Operation.FOIS.appliquer(2, 3));
      ```
    choices:
      - {text: "`5 6`", correct: true}
      - {text: "`6 5`", correct: false}
      - {text: "`5 5`", correct: false}
      - {text: "`11`", correct: false}
    answer: '`5 6` : chaque constante a sa propre implémentation.'
    check:
      output: "5 6"
  - key: code-get-class
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Operation {
          PLUS { int appliquer(int a, int b) { return a + b; } };
          abstract int appliquer(int a, int b);
      }
      System.out.println((Operation.PLUS.getClass() == Operation.class) + " "
              + (Operation.PLUS.getDeclaringClass() == Operation.class));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`true false`", correct: false}
      - {text: "`false false`", correct: false}
    answer: '`false true` : la constante avec un corps est une sous-classe anonyme de l''enum.'
    check:
      output: "false true"
  - key: code-recherche
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Devise {
          EUR("€"), USD("$");
          private static final Map<String, Devise> PAR_SYMBOLE = new HashMap<>();
          static {
              for (Devise d : values()) {
                  PAR_SYMBOLE.put(d.symbole, d);
              }
          }
          final String symbole;
          Devise(String symbole) { this.symbole = symbole; }
          static Devise deSymbole(String s) { return PAR_SYMBOLE.get(s); }
      }
      System.out.println(Devise.deSymbole("$"));
      ```
    choices:
      - {text: "`USD`", correct: true}
      - {text: "`null`", correct: false}
      - {text: "`$`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: '`USD` : la table est remplie dans le bloc `static`, après la création des constantes.'
    check:
      output: "USD"
  - key: bug-map-constructeur
    format: bug-fix
    question: |-
      Ce code ne compile pas (`illegal reference to static field from initializer`). Quelle correction est la bonne ?
      ```java
      enum Devise {
          EUR("€"), USD("$");
          private static final Map<String, Devise> PAR_SYMBOLE = new HashMap<>();
          Devise(String symbole) {
              PAR_SYMBOLE.put(symbole, this);
          }
      }
      ```
    choices:
      - {text: "Garder le symbole dans un champ, et remplir la table dans un bloc `static`", correct: true}
      - {text: "Déclarer `PAR_SYMBOLE` en tête de l'enum, avant les constantes", correct: false}
      - {text: "Retirer `final` de `PAR_SYMBOLE`, pour le remplir dans le constructeur", correct: false}
      - {text: "Rendre `PAR_SYMBOLE` non `static`, pour qu'il existe dans le constructeur", correct: false}
    answer: |-
      ```java
      enum Devise {
          EUR("€"), USD("$");
          private static final Map<String, Devise> PAR_SYMBOLE = new HashMap<>();
          static {
              for (Devise d : values()) PAR_SYMBOLE.put(d.symbole, d);
          }
          private final String symbole;
          Devise(String symbole) { this.symbole = symbole; }
      }
      ```
      Les constantes sont construites avant l'initialisation de `PAR_SYMBOLE`, qui vaut encore `null`. On remplit la
      table dans un bloc `static`, placé après les constantes (qui doivent toujours venir en tête).
  - key: bug-switch-disperse
    format: bug-fix
    question: |-
      Chaque nouvel abonnement oblige à modifier ce calcul, et deux autres semblables. Quelle correction est la bonne ?
      ```java
      double frais(Abonnement a) {
          return switch (a) {
              case BASIC -> 5.0;
              case PREMIUM -> 0.0;
          };
      }
      ```
    choices:
      - {text: "Donner à l'enum un champ `frais`, fourni par chaque constante", correct: true}
      - {text: "Ajouter `default -> 0.0` à chaque `switch`, pour les prochains", correct: false}
      - {text: "Regrouper les trois `switch` dans une classe utilitaire", correct: false}
      - {text: "Ranger les frais dans un tableau indexé par `ordinal()`", correct: false}
    answer: |-
      ```java
      enum Abonnement {
          BASIC(5.0), PREMIUM(0.0);

          private final double frais;
          Abonnement(double frais) { this.frais = frais; }
          double frais() { return frais; }
      }
      ```
      La donnée vit avec sa constante : une nouvelle constante ne compile pas sans ses frais, et les `switch`
      disparaissent. Un `default` les ferait au contraire oublier en silence.
  - key: bug-ordinal-donnee
    format: bug-fix
    question: |-
      Le taux de TVA est calculé à partir de la position de la constante. Quelle correction est la bonne ?
      ```java
      enum Taux { REDUIT, INTERMEDIAIRE, NORMAL }
      double[] VALEURS = { 0.055, 0.10, 0.20 };
      double taux = VALEURS[t.ordinal()];
      ```
    choices:
      - {text: "Un champ `valeur` dans l'enum, fourni par chaque constante : `REDUIT(0.055)`", correct: true}
      - {text: "Une `Map<Integer, Double>` indexée par `ordinal()`, à la place du tableau", correct: false}
      - {text: "Garder le tableau, en ajoutant toujours les nouveaux taux à la fin", correct: false}
      - {text: "Trier le tableau au démarrage, dans l'ordre de déclaration des constantes", correct: false}
    answer: |-
      ```java
      enum Taux {
          REDUIT(0.055), INTERMEDIAIRE(0.10), NORMAL(0.20);

          private final double valeur;
          Taux(double valeur) { this.valeur = valeur; }
          double valeur() { return valeur; }
      }
      ```
      Le tableau parallèle se désynchronise dès qu'on insère une constante. Un champ d'instance lie la valeur à sa
      constante (*Effective Java*, item 35).
  - key: bug-constructeur-public
    format: bug-fix
    question: |-
      Ce code ne compile pas (`modifier public not allowed here`). Quelle correction est la bonne ?
      ```java
      enum Couleur {
          ROUGE("#f00"), VERT("#0f0");
          private final String hexa;
          public Couleur(String hexa) { this.hexa = hexa; }
      }
      ```
    choices:
      - {text: "Retirer `public` : le constructeur d'une enum est implicitement privé", correct: true}
      - {text: "Remplacer `public` par `protected`, pour que les constantes l'appellent", correct: false}
      - {text: "Déclarer l'enum `public`, ce qui autorise un constructeur `public`", correct: false}
      - {text: "Rendre aussi `public` le champ `hexa`, pour l'accorder au constructeur", correct: false}
    answer: |-
      ```java
      enum Couleur {
          ROUGE("#f00"), VERT("#0f0");
          private final String hexa;
          Couleur(String hexa) { this.hexa = hexa; }
      }
      ```
      Le constructeur d'une enum est implicitement privé : on n'écrit pas de modificateur (ou `private`).
