notion: champs-methodes-instance
lesson: |-
  Un **champ d'instance** est une variable déclarée dans la classe, hors de toute méthode : chaque objet en a sa propre
  copie. Une **méthode d'instance** s'appelle sur un objet et lit ou modifie son état.

  ```java
  class Compte {
      private double solde;            // champ d'instance

      void deposer(double montant) {   // méthode d'instance
          this.solde += montant;
      }

      Compte avec(double montant) {
          deposer(montant);
          return this;                 // renvoie l'objet courant : appels chaînés
      }
  }
  ```

  Le mot-clé **`this`** désigne l'objet courant, celui sur lequel la méthode est appelée. Il sert à :
  - lever l'ambiguïté quand un paramètre porte le nom d'un champ : `this.nom = nom;` ;
  - passer l'objet courant à une autre méthode : `registre.inscrire(this)` ;
  - renvoyer l'objet pour chaîner les appels : `return this;`.

  Une méthode `static` n'a **pas** de `this` : elle ne peut pas lire un champ d'instance sans un objet.

  **Piège classique** : `nom = nom;` dans un setter. Le paramètre masque le champ : la ligne affecte le paramètre à
  lui-même, et le champ reste `null`.

  **En entretien** : « `this` est la référence vers l'objet courant ; on s'en sert surtout quand un paramètre masque un
  champ. »
cards:
  - key: champ-instance
    format: course
    question: Qu'est-ce qu'un champ d'instance ?
    answer: Une variable déclarée dans la classe hors des méthodes, dont chaque objet possède sa propre copie.
  - key: role-this
    format: course
    question: À quoi sert `this` ?
    answer: Il désigne l'objet courant ; il lève l'ambiguïté entre un champ et un paramètre de même nom, permet de passer l'objet ou de le renvoyer pour chaîner les appels.
  - key: this-static
    format: course
    question: Pourquoi ne peut-on pas utiliser `this` dans une méthode `static` ?
    answer: "Une méthode `static` appartient à la classe et s'appelle sans objet : il n'y a pas d'objet courant à désigner."
  - key: masquage-parametre
    format: course
    question: Que se passe-t-il si un paramètre porte le même nom qu'un champ ?
    answer: Le paramètre **masque** le champ dans la méthode ; pour atteindre le champ, il faut écrire `this.nom`.
  - key: vf-copie-par-objet
    format: true-false
    question: Chaque objet a sa propre copie des champs d'instance.
    truth: true
    answer: C'est ce qui les distingue des champs `static`, partagés par la classe.
  - key: vf-this-static
    format: true-false
    question: On peut utiliser `this` dans une méthode `static`.
    truth: false
    answer: Il n'y a pas d'objet courant dans une méthode `static`.
  - key: vf-setter-sans-this
    format: true-false
    question: Dans `void setNom(String nom) { nom = nom; }`, le champ `nom` est modifié.
    truth: false
    answer: "Le paramètre masque le champ : il faut `this.nom = nom;`."
  - key: vf-retour-this
    format: true-false
    question: Une méthode peut renvoyer `this`.
    truth: true
    answer: C'est ce qui permet d'enchaîner les appels (`builder.a().b().c()`).
  - key: qcm-setter
    format: multiple-choice
    question: Quel setter modifie vraiment le champ `prix` ?
    choices:
      - text: "`void setPrix(double prix) { this.prix = prix; }`"
        correct: true
      - text: "`void setPrix(double prix) { prix = prix; }`"
        correct: false
      - text: "`void setPrix(double prix) { prix = this.prix; }`"
        correct: false
      - text: "`void setPrix(double p) { double prix = p; }`"
        correct: false
    answer: Seul `this.prix` désigne le champ ; la dernière version déclare une variable locale.
  - key: qcm-usages-this
    format: multiple-choice
    question: Quels sont des usages valides de `this` ?
    choices:
      - text: "`this.nom = nom;`"
        correct: true
      - text: "`return this;`"
        correct: true
      - text: "`registre.ajouter(this);`"
        correct: true
      - text: "`this = autre;`"
        correct: false
    answer: '`this` est une référence en lecture seule : on ne peut pas la réaffecter.'
  - key: qcm-appel-static
    format: multiple-choice
    question: Pourquoi `main` ne peut-il pas appeler directement la méthode d'instance `afficher()` de sa classe ?
    choices:
      - text: "`main` est `static` : il n'y a pas d'objet sur lequel appeler `afficher`"
        correct: true
      - text: "`afficher` est privée"
        correct: false
      - text: "Une méthode ne peut jamais en appeler une autre"
        correct: false
      - text: "`main` doit être déclarée en dernier"
        correct: false
    answer: Il faut d'abord créer un objet, `new App().afficher()`, ou rendre `afficher` `static`.
  - key: qcm-chainage
    format: multiple-choice
    question: Que doit renvoyer `ajouter` pour permettre `panier.ajouter(a).ajouter(b)` ?
    choices:
      - text: "`this`, de type `Panier`"
        correct: true
      - text: "`void`"
        correct: false
      - text: "`null`"
        correct: false
      - text: "L'article ajouté"
        correct: false
    answer: Chaque appel renvoie le panier, sur lequel on rappelle `ajouter`.
  - key: trous-this
    format: fill-in
    question: |-
      Complétez pour que le constructeur range le paramètre dans le champ :
      ```java
      class Produit {
          private String nom;
          Produit(String nom) {
              ___.nom = nom;
          }
      }
      ```
    blanks: [[this]]
    answer: '`this.nom` désigne le champ, `nom` seul le paramètre.'
  - key: trous-retour-this
    format: fill-in
    question: |-
      Complétez pour pouvoir chaîner les appels :
      ```java
      Panier ajouter(Article a) {
          articles.add(a);
          return ___;
      }
      ```
    blanks: [[this]]
    answer: Renvoyer l'objet courant permet `panier.ajouter(a).ajouter(b)`.
  - key: trous-appel-instance
    format: fill-in
    question: |-
      Complétez pour appeler la méthode d'instance `demarrer` depuis `main` :
      ```java
      public static void main(String[] args) {
          ___ App().demarrer();
      }
      ```
    blanks: [[new]]
    answer: Une méthode d'instance s'appelle sur un objet, qu'il faut d'abord créer.
  - key: trous-passer-this
    format: fill-in
    question: |-
      Complétez pour que l'abonné s'inscrive lui-même auprès du journal :
      ```java
      class Abonne {
          void sAbonner(Journal journal) {
              journal.inscrire(___);
          }
      }
      ```
    blanks: [[this]]
    answer: '`this` passe l''objet courant en argument.'
  - key: code-masquage
    format: code-output
    question: |-
      ```java
      class Personne {
          String nom;
          void setNom(String nom) { nom = nom; }
      }
      Personne p = new Personne();
      p.setNom("Ada");
      System.out.println(p.nom);
      ```
    answer: '`null` : le paramètre est affecté à lui-même, le champ n''est jamais touché.'
    check:
      output: "null"
  - key: code-chainage
    format: code-output
    question: |-
      ```java
      class Texte {
          StringBuilder sb = new StringBuilder();
          Texte ajouter(String s) { sb.append(s); return this; }
      }
      System.out.println(new Texte().ajouter("a").ajouter("b").ajouter("c").sb);
      ```
    answer: '`abc` : chaque appel renvoie le même objet.'
    check:
      output: "abc"
  - key: code-etat-modifie
    format: code-output
    question: |-
      ```java
      class Thermostat {
          int consigne = 19;
          void monter() { consigne++; }
      }
      Thermostat salon = new Thermostat();
      Thermostat chambre = new Thermostat();
      salon.monter();
      salon.monter();
      System.out.println(salon.consigne + " " + chambre.consigne);
      ```
    answer: '`21 19` : la méthode modifie seulement l''état de l''objet sur lequel on l''appelle.'
    check:
      output: "21 19"
  - key: code-this-identite
    format: code-output
    question: |-
      ```java
      class Noeud {
          boolean estLuiMeme(Noeud autre) { return this == autre; }
      }
      Noeud a = new Noeud();
      Noeud b = new Noeud();
      System.out.println(a.estLuiMeme(a) + " " + a.estLuiMeme(b));
      ```
    answer: '`true false` : `this` est la référence de l''objet sur lequel on appelle la méthode.'
    check:
      output: "true false"
  - key: bug-setter
    format: bug-fix
    question: |-
      Après `client.setEmail("ada@exemple.fr")`, l'email reste `null` :
      ```java
      void setEmail(String email) {
          email = email;
      }
      ```
    answer: |-
      ```java
      void setEmail(String email) {
          this.email = email;
      }
      ```
      Le paramètre masque le champ ; `this.email` désigne le champ de l'objet.
  - key: bug-contexte-static
    format: bug-fix
    question: |-
      Ce code ne compile pas (`non-static method afficher() cannot be referenced from a static context`) :
      ```java
      public class App {
          void afficher() { System.out.println("Bonjour"); }

          public static void main(String[] args) {
              afficher();
          }
      }
      ```
    answer: |-
      ```java
      public static void main(String[] args) {
          new App().afficher();
      }
      ```
      `main` est `static` et n'a pas d'objet courant : on crée une instance (ou on rend `afficher` `static` si elle
      n'utilise aucun état).
  - key: bug-variable-locale
    format: bug-fix
    question: |-
      Le compteur de visites reste toujours à 0 :
      ```java
      class Page {
          int visites;
          void visiter() {
              int visites = 0;
              visites++;
          }
      }
      ```
    answer: |-
      ```java
      void visiter() {
          visites++;
      }
      ```
      La variable locale `visites` masque le champ : on incrémente une copie jetée à la fin de la méthode.
  - key: bug-constructeur-locale
    format: bug-fix
    question: |-
      Le champ `nom` reste `null` après `new Ville("Lyon")` :
      ```java
      class Ville {
          private String nom;
          Ville(String n) {
              String nom = n;
          }
      }
      ```
    answer: |-
      ```java
      Ville(String nom) {
          this.nom = nom;
      }
      ```
      `String nom = n;` déclare une variable locale au lieu d'affecter le champ.
