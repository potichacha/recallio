notion: champs-methodes-instance
lesson: |-
  Un **champ d'instance** est une variable déclarée dans la classe, hors de toute méthode : chaque objet en a sa propre
  copie. Une **méthode d'instance** s'appelle sur un objet et lit ou modifie son état.

  ```java
  class Compte {
      private double solde;            // champ d'instance

      void deposer(double montant) {   // méthode d'instance
          this.solde += montant;
      }

      Compte avec(double montant) {
          deposer(montant);
          return this;                 // renvoie l'objet courant : appels chaînés
      }
  }
  ```

  Le mot-clé **`this`** désigne l'objet courant, celui sur lequel la méthode est appelée. Il sert à :
  - lever l'ambiguïté quand un paramètre porte le nom d'un champ : `this.nom = nom;` ;
  - passer l'objet courant à une autre méthode : `registre.inscrire(this)` ;
  - renvoyer l'objet pour chaîner les appels : `return this;`.

  Une méthode `static` n'a **pas** de `this` : elle ne peut pas lire un champ d'instance sans un objet.

  **Piège classique** : `nom = nom;` dans un setter. Le paramètre masque le champ : la ligne affecte le paramètre à
  lui-même, et le champ reste `null`.

  **En entretien** : « `this` est la référence vers l'objet courant ; on s'en sert surtout quand un paramètre masque un
  champ. »
tour:
  - title: Méthodes et this
    text: |-
      Une méthode d'instance s'exécute **sur un objet** : elle lit et modifie ses champs. Dans la méthode, `this`
      désigne cet objet ; on l'écrit surtout pour distinguer un champ d'un paramètre du même nom :
      `this.solde = solde;`.

      Deux objets de la même classe partagent les méthodes, mais chacun garde ses champs.
    example:
      files:
        Main.java: |-
          void main() {
              Compte compte = new Compte();
              compte.depose(100);
              compte.retire(30);
              Compte autre = new Compte();
              autre.depose(5);
              IO.println(compte.solde + " " + autre.solde);
          }
        Compte.java: |-
          public class Compte {
              double solde;

              void depose(double montant) {
                  this.solde += montant;
              }

              void retire(double montant) {
                  solde -= montant;
              }
          }
      output: |-
        70.0 5.0
    task:
      instructions: |-
        Ajoute à `Compte` une méthode `vire(Compte destination, double montant)`, qui retire du compte et dépose sur la
        destination. Vire 30 de `compte` vers `autre` : le programme doit afficher `40.0 35.0`.
      starter:
        Main.java: |-
          void main() {
              Compte compte = new Compte();
              compte.depose(100);
              compte.retire(30);
              Compte autre = new Compte();
              autre.depose(5);
              IO.println(compte.solde + " " + autre.solde);
          }
        Compte.java: |-
          public class Compte {
              double solde;

              void depose(double montant) {
                  this.solde += montant;
              }

              void retire(double montant) {
                  solde -= montant;
              }
          }
      solution:
        Main.java: |-
          void main() {
              Compte compte = new Compte();
              compte.depose(100);
              compte.retire(30);
              Compte autre = new Compte();
              autre.depose(5);
              compte.vire(autre, 30);
              IO.println(compte.solde + " " + autre.solde);
          }
        Compte.java: |-
          public class Compte {
              double solde;

              void depose(double montant) {
                  this.solde += montant;
              }

              void retire(double montant) {
                  solde -= montant;
              }

              void vire(Compte destination, double montant) {
                  retire(montant);
                  destination.depose(montant);
              }
          }
      output: |-
        40.0 35.0
cards:
  - key: champ-instance
    format: course
    question: "Qu'est-ce qu'un champ d'instance ?"
    choices:
      - {text: "Une variable de la classe, hors des méthodes, dont chaque objet a sa propre copie", correct: true}
      - {text: "Une variable de la classe, hors des méthodes, partagée par tous les objets", correct: false}
      - {text: "Une variable déclarée dans une méthode, qui disparaît à la fin de l'appel", correct: false}
      - {text: "Une constante `final` de la classe, fixée une fois pour toutes à la compilation", correct: false}
    answer: |-
      Une variable déclarée dans la classe hors des méthodes, dont chaque objet possède sa propre copie. Partagée par
      tous les objets, ce serait un champ `static`.
  - key: role-this
    format: course
    question: "À quoi sert `this` ?"
    choices:
      - {text: "À désigner l'objet courant, par exemple pour distinguer un champ d'un paramètre homonyme", correct: true}
      - {text: "À désigner la classe parente, pour appeler une méthode qu'on a redéfinie", correct: false}
      - {text: "À désigner la classe courante, pour appeler ses méthodes `static`", correct: false}
      - {text: "À créer une nouvelle instance de la classe courante, comme `new`", correct: false}
    answer: |-
      Il désigne l'objet courant ; il lève l'ambiguïté entre un champ et un paramètre de même nom, permet de passer
      l'objet ou de le renvoyer pour chaîner les appels. La classe parente, c'est `super`.
  - key: this-static
    format: course
    question: "Pourquoi ne peut-on pas utiliser `this` dans une méthode `static` ?"
    choices:
      - {text: "Une méthode `static` s'appelle sans objet : il n'y a pas d'objet courant", correct: true}
      - {text: "`this` est réservé aux constructeurs, il n'existe dans aucune méthode", correct: false}
      - {text: "Une méthode `static` ne peut accéder à aucun champ, même `static`", correct: false}
      - {text: "On peut, mais `this` y désigne la classe au lieu d'un objet", correct: false}
    answer: |-
      Une méthode `static` appartient à la classe et s'appelle sans objet : il n'y a pas d'objet courant à désigner.
      Elle peut en revanche lire les champs `static`.
  - key: masquage-parametre
    format: course
    question: "Que se passe-t-il si un paramètre porte le même nom qu'un champ ?"
    choices:
      - {text: "Le paramètre masque le champ : il faut écrire `this.nom` pour atteindre le champ", correct: true}
      - {text: "Le code ne compile pas : un paramètre ne peut pas porter le nom d'un champ", correct: false}
      - {text: "Le champ masque le paramètre : `nom` désigne toujours le champ", correct: false}
      - {text: "Java affecte automatiquement le paramètre au champ du même nom", correct: false}
    answer: "Le paramètre **masque** le champ dans la méthode ; pour atteindre le champ, il faut écrire `this.nom`."
  - key: vf-copie-par-objet
    format: true-false
    question: Chaque objet a sa propre copie des champs d'instance.
    truth: true
    answer: C'est ce qui les distingue des champs `static`, partagés par la classe.
  - key: vf-this-static
    format: true-false
    question: On peut utiliser `this` dans une méthode `static`.
    truth: false
    answer: Il n'y a pas d'objet courant dans une méthode `static`.
  - key: vf-setter-sans-this
    format: true-false
    question: Dans `void setNom(String nom) { nom = nom; }`, le champ `nom` est modifié.
    truth: false
    answer: "Le paramètre masque le champ : il faut `this.nom = nom;`."
  - key: vf-retour-this
    format: true-false
    question: Une méthode peut renvoyer `this`.
    truth: true
    answer: C'est ce qui permet d'enchaîner les appels (`builder.a().b().c()`).
  - key: qcm-setter
    format: multiple-choice
    question: Quel setter modifie vraiment le champ `prix` ?
    choices:
      - text: "`void setPrix(double prix) { this.prix = prix; }`"
        correct: true
      - text: "`void setPrix(double prix) { prix = prix; }`"
        correct: false
      - text: "`void setPrix(double prix) { prix = this.prix; }`"
        correct: false
      - text: "`void setPrix(double p) { double prix = p; }`"
        correct: false
    answer: Seul `this.prix` désigne le champ ; la dernière version déclare une variable locale.
  - key: qcm-usages-this
    format: multiple-choice
    question: "Lequel de ces usages de `this` ne compile pas ?"
    choices:
      - {text: "`this = autre;`", correct: true}
      - {text: "`this.nom = nom;`", correct: false}
      - {text: "`return this;`", correct: false}
      - {text: "`registre.ajouter(this);`", correct: false}
    answer: "`this` est une référence en lecture seule : on ne peut pas la réaffecter. Les trois autres usages sont valides."
  - key: qcm-appel-static
    format: multiple-choice
    question: Pourquoi `main` ne peut-il pas appeler directement la méthode d'instance `afficher()` de sa classe ?
    choices:
      - {text: "`main` est `static` : il n'y a pas d'objet sur lequel appeler `afficher`", correct: true}
      - {text: "`afficher` est privée, donc invisible depuis une méthode `static`", correct: false}
      - {text: "Une méthode `static` ne peut appeler aucune autre méthode de sa classe", correct: false}
      - {text: "`main` doit être déclarée après `afficher` dans le fichier source", correct: false}
    answer: Il faut d'abord créer un objet, `new App().afficher()`, ou rendre `afficher` `static`.
  - key: qcm-chainage
    format: multiple-choice
    question: Que doit renvoyer `ajouter` pour permettre `panier.ajouter(a).ajouter(b)` ?
    choices:
      - text: "`this`, de type `Panier`"
        correct: true
      - text: "`void`"
        correct: false
      - text: "`null`"
        correct: false
      - text: "L'article ajouté"
        correct: false
    answer: Chaque appel renvoie le panier, sur lequel on rappelle `ajouter`.
  - key: trous-this
    format: fill-in
    question: |-
      Complète pour que le constructeur range le paramètre dans le champ :
      ```java
      class Produit {
          private String nom;
          Produit(String nom) {
              ___.nom = nom;
          }
      }
      ```
    blanks: [[this]]
    answer: '`this.nom` désigne le champ, `nom` seul le paramètre.'
  - key: trous-retour-this
    format: fill-in
    question: |-
      Complète pour pouvoir chaîner les appels :
      ```java
      Panier ajouter(Article a) {
          articles.add(a);
          return ___;
      }
      ```
    blanks: [[this]]
    answer: Renvoyer l'objet courant permet `panier.ajouter(a).ajouter(b)`.
  - key: trous-appel-instance
    format: fill-in
    question: |-
      Complète pour appeler la méthode d'instance `demarrer` depuis `main` :
      ```java
      public static void main(String[] args) {
          ___ App().demarrer();
      }
      ```
    blanks: [[new]]
    answer: Une méthode d'instance s'appelle sur un objet, qu'il faut d'abord créer.
  - key: trous-passer-this
    format: fill-in
    question: |-
      Complète pour que l'abonné s'inscrive lui-même auprès du journal :
      ```java
      class Abonne {
          void sAbonner(Journal journal) {
              journal.inscrire(___);
          }
      }
      ```
    blanks: [[this]]
    answer: '`this` passe l''objet courant en argument.'
  - key: code-masquage
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Personne {
          String nom;
          void setNom(String nom) { nom = nom; }
      }
      Personne p = new Personne();
      p.setNom("Ada");
      System.out.println(p.nom);
      ```
    choices:
      - {text: "`null`", correct: true}
      - {text: "`Ada`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: "`null` : le paramètre est affecté à lui-même, le champ n'est jamais touché."
    check:
      output: "null"
  - key: code-chainage
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Texte {
          StringBuilder sb = new StringBuilder();
          Texte ajouter(String s) { sb.append(s); return this; }
      }
      System.out.println(new Texte().ajouter("a").ajouter("b").ajouter("c").sb);
      ```
    choices:
      - {text: "`abc`", correct: true}
      - {text: "`c`", correct: false}
      - {text: "`a`", correct: false}
      - {text: "`cba`", correct: false}
    answer: "`abc` : chaque appel renvoie le même objet, dont le `StringBuilder` accumule les trois lettres."
    check:
      output: "abc"
  - key: code-etat-modifie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Thermostat {
          int consigne = 19;
          void monter() { consigne++; }
      }
      Thermostat salon = new Thermostat();
      Thermostat chambre = new Thermostat();
      salon.monter();
      salon.monter();
      System.out.println(salon.consigne + " " + chambre.consigne);
      ```
    choices:
      - {text: "`21 19`", correct: true}
      - {text: "`21 21`", correct: false}
      - {text: "`20 19`", correct: false}
      - {text: "`19 19`", correct: false}
    answer: "`21 19` : la méthode modifie seulement l'état de l'objet sur lequel on l'appelle."
    check:
      output: "21 19"
  - key: code-this-identite
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Noeud {
          boolean estLuiMeme(Noeud autre) { return this == autre; }
      }
      Noeud a = new Noeud();
      Noeud b = new Noeud();
      System.out.println(a.estLuiMeme(a) + " " + a.estLuiMeme(b));
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : `this` est la référence de l'objet sur lequel on appelle la méthode."
    check:
      output: "true false"
  - key: bug-setter
    format: bug-fix
    question: |-
      Après `client.setEmail("ada@exemple.fr")`, l'email reste `null`. Pourquoi ?
      ```java
      void setEmail(String email) {
          email = email;
      }
      ```
    choices:
      - {text: "Le paramètre masque le champ : `email = email` l'affecte à lui-même", correct: true}
      - {text: "Le champ `email` doit être `public` pour qu'un setter le modifie", correct: false}
      - {text: "Une méthode `void` ne peut pas modifier l'état de son objet", correct: false}
      - {text: "Le setter doit renvoyer la nouvelle valeur pour qu'elle soit gardée", correct: false}
    answer: |-
      ```java
      void setEmail(String email) {
          this.email = email;
      }
      ```
      Le paramètre masque le champ ; `this.email` désigne le champ de l'objet.
  - key: bug-contexte-static
    format: bug-fix
    question: |-
      Ce code ne compile pas (`non-static method afficher() cannot be referenced from a static context`). Quelle
      correction est la bonne ?
      ```java
      public class App {
          void afficher() { System.out.println("Bonjour"); }

          public static void main(String[] args) {
              afficher();
          }
      }
      ```
    choices:
      - {text: "Créer un objet dans `main` : `new App().afficher();`", correct: true}
      - {text: "Écrire `this.afficher();` dans `main`", correct: false}
      - {text: "Déclarer `afficher` en `private` dans `App`", correct: false}
      - {text: "Écrire `super.afficher();` dans `main`", correct: false}
    answer: |-
      ```java
      public static void main(String[] args) {
          new App().afficher();
      }
      ```
      `main` est `static` et n'a pas d'objet courant, donc pas de `this` : on crée une instance (ou on rend `afficher`
      `static` si elle n'utilise aucun état).
  - key: bug-variable-locale
    format: bug-fix
    question: |-
      Le compteur de visites reste toujours à 0. Pourquoi ?
      ```java
      class Page {
          int visites;
          void visiter() {
              int visites = 0;
              visites++;
          }
      }
      ```
    choices:
      - {text: "La variable locale `visites` masque le champ : on incrémente une copie jetée", correct: true}
      - {text: "Un champ `int` ne peut pas être incrémenté par une méthode d'instance", correct: false}
      - {text: "`visites++` incrémente après la lecture : la valeur n'est jamais gardée", correct: false}
      - {text: "Le champ `visites` doit être initialisé explicitement à 0 dans la classe", correct: false}
    answer: |-
      ```java
      void visiter() {
          visites++;
      }
      ```
      La variable locale `visites` masque le champ : on incrémente une copie jetée à la fin de la méthode.
  - key: bug-constructeur-locale
    format: bug-fix
    question: |-
      Le champ `nom` reste `null` après `new Ville("Lyon")`. Pourquoi ?
      ```java
      class Ville {
          private String nom;
          Ville(String n) {
              String nom = n;
          }
      }
      ```
    choices:
      - {text: "`String nom = n;` déclare une variable locale au lieu d'affecter le champ", correct: true}
      - {text: "Un constructeur ne peut pas affecter un champ `private`", correct: false}
      - {text: "Le paramètre doit porter exactement le même nom que le champ", correct: false}
      - {text: "Il manque un `return this;` à la fin du constructeur", correct: false}
    answer: |-
      ```java
      Ville(String nom) {
          this.nom = nom;
      }
      ```
      `String nom = n;` déclare une variable locale au lieu d'affecter le champ, qui garde sa valeur par défaut `null`.
