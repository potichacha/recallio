notion: singleton-java
lesson: |-
  Un **singleton** est une classe dont il n'existe **qu'une instance**, accessible globalement. Variantes classiques :

  ```java
  // 1. champ static final : simple, créé au chargement de la classe
  public final class Horloge {
      public static final Horloge INSTANCE = new Horloge();
      private Horloge() { }
  }

  // 2. idiome du holder : paresseux et thread-safe, sans verrou
  public final class Registre {
      private Registre() { }
      private static final class Holder {
          static final Registre INSTANCE = new Registre();   // créé au premier appel de get()
      }
      public static Registre get() { return Holder.INSTANCE; }
  }

  // 3. enum : le plus sûr (sérialisation, réflexion)
  public enum Configuration { INSTANCE; }
  ```

  - Le constructeur `private` empêche `new`, mais pas la **réflexion** (`setAccessible(true)`) ni la
    **désérialisation** : seule l'enum les bloque sans code supplémentaire.
  - La **double vérification** (`if (instance == null) synchronized ...`) n'est correcte qu'avec un champ `volatile` :
    on préfère le holder.
  - Exemples dans la JDK : `Runtime.getRuntime()`, `Collections.emptyList()`.

  Le singleton reste un **état global** et une **dépendance cachée** : le code qui écrit `Registre.get()` ne peut pas
  recevoir un autre registre dans un test. Avec un conteneur d'injection (Quarkus, Spring), on déclare un bean
  `@ApplicationScoped` et on l'injecte : l'unicité est garantie sans singleton codé à la main.

  **Piège classique** : l'initialisation paresseuse naïve, `if (instance == null) instance = new Registre();`. Deux
  threads peuvent passer le test en même temps et créer deux instances.

  **En entretien** : « Holder ou enum pour un singleton sûr ; mais je préfère un bean injecté, testable, à un singleton
  global. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'un singleton ?
    answer: Une classe qui n'a qu'une seule instance, accessible globalement (champ `static`, méthode `getInstance()` ou constante d'enum).
  - key: holder
    format: course
    question: Comment fonctionne l'idiome du holder ?
    answer: L'instance est un champ `static final` d'une classe imbriquée privée ; la JVM n'initialise cette classe qu'au premier appel de `get()`, de façon thread-safe, sans verrou.
  - key: defauts
    format: course
    question: Quels défauts a un singleton ?
    answer: "C'est un état global et une dépendance cachée : difficile à remplacer dans un test, il couple le code qui l'appelle à une implémentation précise."
  - key: injection
    format: course
    question: Comment obtenir une instance unique sans singleton codé à la main ?
    answer: "Avec un conteneur d'injection : un bean `@ApplicationScoped` (Quarkus, CDI) ou un bean Spring par défaut, injecté par son interface."
  - key: vf-constructeur-prive
    format: true-false
    question: Un constructeur `private` empêche toute création d'une seconde instance, même par réflexion.
    truth: false
    answer: '`setAccessible(true)` permet d''appeler un constructeur privé ; seule une enum s''y oppose.'
  - key: vf-paresseux-naif
    format: true-false
    question: "`if (instance == null) instance = new Registre();` est thread-safe."
    truth: false
    answer: Deux threads peuvent passer le test ensemble et créer deux instances.
  - key: vf-holder
    format: true-false
    question: L'idiome du holder crée l'instance au premier appel de `get()`.
    truth: true
    answer: La classe holder n'est initialisée qu'à son premier usage.
  - key: vf-runtime
    format: true-false
    question: "`Runtime.getRuntime()` renvoie toujours la même instance."
    truth: true
    answer: C'est un singleton de la JDK.
  - key: qcm-sur
    format: multiple-choice
    question: Quelles variantes sont thread-safe sans verrou explicite ?
    choices:
      - text: "Un champ `static final` initialisé à la déclaration"
        correct: true
      - text: "L'idiome du holder"
        correct: true
      - text: "Une enum à une constante"
        correct: true
      - text: "L'initialisation paresseuse sans `synchronized`"
        correct: false
    answer: Les trois premières s'appuient sur l'initialisation de classe, garantie par la JVM.
  - key: qcm-dcl
    format: multiple-choice
    question: Que faut-il pour que la double vérification soit correcte ?
    choices:
      - text: "Déclarer le champ `volatile`"
        correct: true
      - text: "Déclarer le champ `transient`"
        correct: false
      - text: "Une seule vérification suffit"
        correct: false
      - text: "Rendre la classe `abstract`"
        correct: false
    answer: Sans `volatile`, un thread peut voir l'objet avant la fin de sa construction.
  - key: qcm-test
    format: multiple-choice
    question: "Un service appelle `Horloge.INSTANCE.maintenant()`. Comment le rendre testable ?"
    choices:
      - text: "Lui injecter une `Clock` (ou une interface `Horloge`) par son constructeur"
        correct: true
      - text: "Modifier `Horloge.INSTANCE` dans le test"
        correct: false
      - text: "Ajouter `Thread.sleep` dans le test"
        correct: false
      - text: "Ce n'est pas possible"
        correct: false
    answer: La dépendance devient explicite, et le test fournit une horloge fixe.
  - key: qcm-plus-sur
    format: multiple-choice
    question: Quelle variante résiste à la sérialisation et à la réflexion sans code supplémentaire ?
    choices:
      - text: "L'enum"
        correct: true
      - text: "Le champ `static final`"
        correct: false
      - text: "L'idiome du holder"
        correct: false
      - text: "La double vérification"
        correct: false
    answer: Les autres demandent `readResolve` et une garde dans le constructeur.
  - key: code-eager
    format: code-output
    question: |-
      ```java
      class Config {
          static final Config INSTANCE = new Config();
          private Config() { System.out.print("init "); }
      }
      System.out.print("avant ");
      Config c = Config.INSTANCE;
      System.out.println(c == Config.INSTANCE);
      ```
    answer: '`avant init true` : l''instance est créée à l''initialisation de la classe, à son premier usage.'
    check:
      output: "avant init true"
  - key: code-holder
    format: code-output
    question: |-
      ```java
      class Registre {
          private Registre() { System.out.print("création "); }
          static void bonjour() { System.out.print("bonjour "); }
          private static class Holder { static final Registre INSTANCE = new Registre(); }
          static Registre get() { return Holder.INSTANCE; }
      }
      Registre.bonjour();
      Registre.get();
      System.out.println(Registre.get() == Registre.get());
      ```
    answer: '`bonjour création true` : utiliser la classe ne crée pas l''instance ; le premier `get()` si, une seule fois.'
    check:
      output: "bonjour création true"
  - key: code-reflexion
    format: code-output
    question: |-
      ```java
      class Unique {
          static final Unique INSTANCE = new Unique();
          private Unique() { }
      }
      var constructeur = Unique.class.getDeclaredConstructor();
      constructeur.setAccessible(true);
      System.out.println(constructeur.newInstance() == Unique.INSTANCE);
      ```
    answer: '`false` : la réflexion a créé une seconde instance malgré le constructeur privé.'
    check:
      output: "false"
  - key: code-runtime
    format: code-output
    question: |-
      ```java
      System.out.println((Runtime.getRuntime() == Runtime.getRuntime()) + " " + (Collections.emptyList() == Collections.emptyList()));
      ```
    answer: '`true true` : deux instances uniques de la JDK.'
    check:
      output: "true true"
  - key: bug-paresseux
    format: bug-fix
    question: |-
      Sous charge, deux registres sont parfois créés :
      ```java
      class Registre {
          private static Registre instance;
          static Registre get() {
              if (instance == null) {
                  instance = new Registre();
              }
              return instance;
          }
      }
      ```
    answer: |-
      ```java
      class Registre {
          private Registre() { }
          private static final class Holder {
              static final Registre INSTANCE = new Registre();
          }
          static Registre get() { return Holder.INSTANCE; }
      }
      ```
      Deux threads peuvent passer le test `null` en même temps. Le holder délègue la création à l'initialisation de
      classe, thread-safe et paresseuse.
  - key: bug-dcl
    format: bug-fix
    question: |-
      Une revue signale cette double vérification :
      ```java
      private static Cache instance;
      static Cache get() {
          if (instance == null) {
              synchronized (Cache.class) {
                  if (instance == null) instance = new Cache();
              }
          }
          return instance;
      }
      ```
    answer: |-
      ```java
      private static volatile Cache instance;
      ```
      Sans `volatile`, un autre thread peut voir une référence non nulle vers un objet pas encore construit. Le champ
      `volatile` corrige le problème ; le holder ou l'enum l'évitent.
  - key: bug-dependance-cachee
    format: bug-fix
    question: |-
      Ce service est impossible à tester sans envoyer de vrais courriels :
      ```java
      class Inscription {
          void inscrire(Client c) {
              ServiceMail.getInstance().envoyer(c.email(), "Bienvenue");
          }
      }
      ```
    answer: |-
      ```java
      class Inscription {
          private final Messagerie messagerie;
          Inscription(Messagerie messagerie) { this.messagerie = messagerie; }
          void inscrire(Client c) { messagerie.envoyer(c.email(), "Bienvenue"); }
      }
      ```
      Le singleton est une dépendance cachée. Injectée par le constructeur (et typée par une interface), elle se
      remplace par un double dans les tests ; le conteneur garantit l'unicité en production.
  - key: bug-champ-modifiable
    format: bug-fix
    question: |-
      Un module a remplacé le singleton par erreur :
      ```java
      public class Horloge {
          public static Horloge INSTANCE = new Horloge();
          public Horloge() { }
      }
      ```
    answer: |-
      ```java
      public final class Horloge {
          public static final Horloge INSTANCE = new Horloge();
          private Horloge() { }
      }
      ```
      Un champ non `final` peut être réaffecté, et un constructeur public permet d'autres instances. Le singleton exige
      `static final` et un constructeur privé (ou une enum).
