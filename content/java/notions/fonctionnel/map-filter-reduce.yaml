notion: map-filter-reduce
lesson: |-
  Trois opérations couvrent la plupart des traitements :

  - **`filter(predicat)`** garde les éléments pour lesquels le prédicat est vrai ;
  - **`map(fonction)`** transforme chaque élément en un autre (éventuellement d'un autre type) ;
  - **`reduce`** combine tous les éléments en une seule valeur.

  ```java
  int totalPaye = commandes.stream()
          .filter(Commande::payee)                // Stream<Commande>
          .map(Commande::montant)                 // Stream<Integer>
          .reduce(0, Integer::sum);               // 0 si aucune commande

  Optional<Integer> max = notes.stream().reduce(Integer::max);   // sans valeur initiale : Optional
  ```

  `reduce` existe en trois formes :
  - `reduce(identite, accumulateur)` : renvoie une valeur, `identite` pour un stream vide ;
  - `reduce(accumulateur)` : renvoie un `Optional`, vide pour un stream vide ;
  - `reduce(identite, accumulateur, combineur)` : quand le résultat a un autre type que les éléments (utile en
    parallèle).

  - L'**identité** doit être neutre (`0` pour la somme, `1` pour le produit, `""` pour la concaténation), et
    l'accumulateur **associatif** : sinon le résultat est faux en parallèle.
  - Pour les cas courants, il existe plus lisible : `mapToInt(...).sum()`, `max(comparator)`, `count()`,
    `Collectors.joining()`. `reduce` reste utile pour une combinaison métier (fusionner des objets, `BigDecimal::add`).
  - `map` change le type du stream ; `filter` jamais.

  **Piège classique** : `reduce(10, Integer::sum)` pour « ajouter 10 au total ». En parallèle, l'identité est ajoutée à
  chaque morceau : le résultat dépend du découpage. L'identité doit être neutre.

  **En entretien** : « `filter` sélectionne, `map` transforme, `reduce` combine avec une identité neutre et une opération
  associative ; pour une somme, je préfère `mapToInt(...).sum()`. »
cards:
  - key: completer-filter-map
    format: fill-in
    question: |-
      Complète pour obtenir les noms en majuscules des utilisateurs actifs :
      ```java
      List<String> noms = utilisateurs.stream()
          .___(Utilisateur::actif)
          .___(u -> u.nom().toUpperCase())
          .toList();
      ```
    blanks: [[filter], [map]]
    answer: "`filter` garde les éléments qui satisfont le prédicat, `map` transforme chaque élément."
  - key: trois
    format: course
    question: "Que font `filter`, `map` et `reduce` sur un stream ?"
    choices:
      - {text: "`filter` garde selon un prédicat, `map` transforme, `reduce` combine en une valeur", correct: true}
      - {text: "`filter` transforme, `map` garde selon un prédicat, `reduce` combine en une valeur", correct: false}
      - {text: "`filter` garde selon un prédicat, `map` combine en une valeur, `reduce` transforme", correct: false}
      - {text: "`filter` retire les doublons, `map` range en clé-valeur, `reduce` réduit la taille", correct: false}
    answer: '`filter` garde les éléments qui satisfont un prédicat, `map` transforme chaque élément, `reduce` combine tous les éléments en une valeur.'
  - key: reduce-formes
    format: course
    question: "Que renvoie `reduce` avec et sans valeur initiale ?"
    choices:
      - {text: "Avec une identité, une valeur (l'identité si le stream est vide) ; sans, un `Optional`", correct: true}
      - {text: "Avec une identité, un `Optional` ; sans, une valeur, ou `null` si le stream est vide", correct: false}
      - {text: "Toujours une valeur ; sans identité, une exception si le stream est vide", correct: false}
      - {text: "Toujours un `Optional`, vide si le stream l'est, avec ou sans identité", correct: false}
    answer: Avec une identité, une valeur (l'identité pour un stream vide) ; sans, un `Optional`, vide pour un stream vide.
  - key: identite-associative
    format: course
    question: "Quelles propriétés doivent avoir l'identité et l'accumulateur de `reduce` ?"
    choices:
      - {text: "Une identité neutre (`0` pour `+`) et un accumulateur associatif", correct: true}
      - {text: "Une identité non nulle et un accumulateur commutatif", correct: false}
      - {text: "Une identité égale au premier élément et un accumulateur sans état", correct: false}
      - {text: "Aucune : seul le type renvoyé par l'accumulateur compte", correct: false}
    answer: "L'identité doit être neutre (`0` pour `+`, `1` pour `×`) et l'accumulateur associatif ; sinon le résultat change en parallèle. La commutativité n'est pas exigée : l'ordre de rencontre est respecté."
  - key: reduce-ou-pas
    format: course
    question: "Quand préférer autre chose que `reduce` ?"
    choices:
      - {text: "Pour les cas courants, déjà écrits : `sum()`, `max`, `count`, `Collectors.joining`", correct: true}
      - {text: "Toujours : `reduce` est déconseillé depuis Java 16, au profit de `collect`", correct: false}
      - {text: "Pour une combinaison métier, que `reduce` ne sait pas exprimer", correct: false}
      - {text: "Sur un stream parallèle, où `reduce` donne toujours un résultat faux", correct: false}
    answer: "Pour les cas courants, qui ont plus lisible : `mapToInt(...).sum()`, `max`, `count`, `Collectors.joining` ; `reduce` reste utile pour une combinaison métier, et il est juste en parallèle avec un accumulateur associatif."
  - key: vf-map-type
    format: true-false
    question: "`map` peut changer le type des éléments du stream."
    truth: true
    answer: Par exemple `Stream<Commande>` vers `Stream<Integer>`.
  - key: vf-reduce-vide
    format: true-false
    question: "`Stream.<Integer>empty().reduce(0, Integer::sum)` lève une exception."
    truth: false
    answer: Il renvoie l'identité, 0.
  - key: vf-reduce-optional
    format: true-false
    question: "`reduce(Integer::max)` renvoie un `Optional<Integer>`."
    truth: true
    answer: Le stream peut être vide.
  - key: vf-filter-garde
    format: true-false
    question: "`filter(p)` retire les éléments pour lesquels `p` est vrai."
    truth: false
    answer: Il les **garde**.
  - key: qcm-somme
    format: multiple-choice
    question: "Quelle expression donne la somme des montants (`int`) des commandes ?"
    choices:
      - {text: "`commandes.stream().mapToInt(Commande::montant).sum()`", correct: true}
      - {text: "`commandes.stream().mapToInt(Commande::montant).count()`", correct: false}
      - {text: "`commandes.stream().map(Commande::montant).reduce(1, Integer::sum)`", correct: false}
      - {text: "`commandes.stream().filter(Commande::montant).sum()`", correct: false}
    answer: "`mapToInt(...).sum()` additionne sans boxing. `count` compte les commandes ; l'identité de la somme est 0, pas 1 ; `filter` attend un prédicat."
  - key: qcm-identite
    format: multiple-choice
    question: Quelle identité pour un produit avec `reduce(identite, (a, b) -> a * b)` ?
    choices:
      - text: "1"
        correct: true
      - text: "0"
        correct: false
      - text: "-1"
        correct: false
      - text: "`null`"
        correct: false
    answer: 1 est neutre pour la multiplication ; 0 donnerait toujours 0.
  - key: qcm-bigdecimal
    format: multiple-choice
    question: Comment additionner des montants `BigDecimal` ?
    choices:
      - text: "`montants.stream().reduce(BigDecimal.ZERO, BigDecimal::add)`"
        correct: true
      - text: "`montants.stream().mapToInt(BigDecimal::intValue).sum()`"
        correct: false
      - text: "`montants.stream().reduce(BigDecimal.ONE, BigDecimal::add)`"
        correct: false
      - text: "`montants.stream().sum()`"
        correct: false
    answer: '`intValue` perd les décimales ; un `Stream<BigDecimal>` n''a pas de `sum`.'
  - key: qcm-associatif
    format: multiple-choice
    question: "Lequel de ces accumulateurs est sûr pour `reduce`, y compris en parallèle ?"
    choices:
      - {text: "`Integer::sum`", correct: true}
      - {text: "`(a, b) -> a - b`", correct: false}
      - {text: "`(a, b) -> a / b`", correct: false}
      - {text: "`(a, b) -> a * 2 + b`", correct: false}
    answer: "L'addition est associative : regrouper autrement ne change rien. La soustraction, la division et `a * 2 + b` dépendent du regroupement, donc du découpage parallèle."
  - key: trous-reduce
    format: fill-in
    question: |-
      Complète pour concaténer les mots :
      ```java
      String phrase = mots.stream().___("", String::concat);
      ```
    blanks: [[reduce]]
    answer: '`Collectors.joining()` serait plus efficace pour de nombreuses chaînes.'
  - key: trous-identite
    format: fill-in
    question: |-
      Complète l'identité de la somme :
      ```java
      int total = quantites.stream().reduce(___, Integer::sum);
      ```
    blanks: [["0"]]
    answer: 0 est neutre pour l'addition.
  - key: trous-map
    format: fill-in
    question: |-
      Complète pour obtenir les longueurs des mots :
      ```java
      List<Integer> longueurs = mots.stream().___(String::length).toList();
      ```
    blanks: [[map]]
    answer: '`map` transforme chaque mot en sa longueur.'
  - key: code-pipeline
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int r = Stream.of(1, 2, 3, 4, 5)
              .filter(n -> n % 2 == 1)
              .map(n -> n * n)
              .reduce(0, Integer::sum);
      System.out.println(r);
      ```
    choices:
      - {text: "`35`", correct: true}
      - {text: "`9`", correct: false}
      - {text: "`55`", correct: false}
      - {text: "`20`", correct: false}
    answer: '`35` : 1 + 9 + 25.'
    check:
      output: "35"
  - key: code-optional
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Stream.of(4, 9, 2).reduce(Integer::max) + " " + Stream.<Integer>empty().reduce(Integer::max));
      ```
    choices:
      - {text: "`Optional[9] Optional.empty`", correct: true}
      - {text: "`9 null`", correct: false}
      - {text: "`9 0`", correct: false}
      - {text: "`Optional[9] null`", correct: false}
    answer: "`Optional[9] Optional.empty` : sans identité, `reduce` renvoie un `Optional`, vide pour un stream vide."
    check:
      output: "Optional[9] Optional.empty"
  - key: code-identite-vide
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Stream.<Integer>empty().reduce(0, Integer::sum) + " " + Stream.of(2, 3).reduce(1, (a, b) -> a * b));
      ```
    choices:
      - {text: "`0 6`", correct: true}
      - {text: "`null 6`", correct: false}
      - {text: "`0 5`", correct: false}
      - {text: "`1 6`", correct: false}
    answer: "`0 6` : un stream vide renvoie l'identité, et 1 × 2 × 3 = 6."
    check:
      output: "0 6"
  - key: code-map-type
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Stream.of("a", "bbb", "cc").map(String::length).filter(n -> n > 1).toList());
      ```
    choices:
      - {text: "`[3, 2]`", correct: true}
      - {text: "`[bbb, cc]`", correct: false}
      - {text: "`[1, 3, 2]`", correct: false}
      - {text: "`[3]`", correct: false}
    answer: '`[3, 2]`.'
    check:
      output: "[3, 2]"
  - key: bug-boucle-accumulation
    format: bug-fix
    question: |-
      Comment réécrire cette boucle avec un stream ?
      ```java
      int total = 0;
      for (Ligne l : lignes) {
          if (l.quantite() > 0) {
              total += l.quantite() * l.prixUnitaire();
          }
      }
      ```
    choices:
      - {text: "`lignes.stream().filter(l -> l.quantite() > 0).mapToInt(l -> l.quantite() * l.prixUnitaire()).sum()`", correct: true}
      - {text: "`lignes.stream().mapToInt(l -> l.quantite() * l.prixUnitaire()).filter(m -> m > 0).count()`", correct: false}
      - {text: "`lignes.stream().filter(l -> l.quantite() > 0).map(l -> l.quantite() * l.prixUnitaire()).count()`", correct: false}
      - {text: "`lignes.stream().filter(l -> l.quantite() > 0).forEach(l -> total += l.quantite() * l.prixUnitaire())`", correct: false}
    answer: |-
      ```java
      int total = lignes.stream()
              .filter(l -> l.quantite() > 0)
              .mapToInt(l -> l.quantite() * l.prixUnitaire())
              .sum();
      ```
      `filter` sélectionne, `mapToInt` calcule chaque montant sans boxing, `sum` additionne.
  - key: bug-identite
    format: bug-fix
    question: |-
      Ce total est faux d'un multiple de 100 en parallèle. Quelle correction est la bonne ?
      ```java
      int total = montants.parallelStream().reduce(100, Integer::sum);   // 100 de frais fixes
      ```
    choices:
      - {text: "`100 + montants.parallelStream().reduce(0, Integer::sum)`", correct: true}
      - {text: "`montants.stream().parallel().reduce(100, Integer::sum)`", correct: false}
      - {text: "`montants.parallelStream().reduce(100, (a, b) -> a + b)`", correct: false}
      - {text: "`montants.parallelStream().reduce(0, Integer::sum) + 100 * montants.size()`", correct: false}
    answer: |-
      ```java
      int total = 100 + montants.parallelStream().reduce(0, Integer::sum);
      ```
      En parallèle, l'identité est utilisée pour chaque morceau : les 100 sont ajoutés plusieurs fois. L'identité doit être
      neutre ; la constante s'ajoute après.
  - key: bug-get
    format: bug-fix
    question: |-
      Ce code lève une `NoSuchElementException` quand la liste est vide. Quelle correction est la bonne ?
      ```java
      int plusGrand = notes.stream().reduce(Integer::max).get();
      ```
    choices:
      - {text: "`notes.stream().reduce(Integer::max).orElse(0)`", correct: true}
      - {text: "`notes.stream().reduce(Integer::max).orElseThrow()`", correct: false}
      - {text: "`notes.stream().reduce(0, Integer::max).get()`", correct: false}
      - {text: "`notes.stream().max(Integer::max).get()`", correct: false}
    answer: |-
      ```java
      int plusGrand = notes.stream().reduce(Integer::max).orElse(0);
      // ou : notes.stream().mapToInt(Integer::intValue).max().orElse(0)
      ```
      Sans identité, `reduce` renvoie un `Optional`, vide pour une liste vide : on fournit une valeur par défaut.
  - key: bug-soustraction
    format: bug-fix
    question: |-
      Ce calcul « solde = premier montant moins tous les suivants » donne des résultats variables en parallèle. Pourquoi ?
      ```java
      int solde = mouvements.parallelStream().reduce((a, b) -> a - b).orElse(0);
      ```
    choices:
      - {text: "La soustraction n'est pas associative : le résultat dépend du regroupement", correct: true}
      - {text: "`orElse(0)` est appelé avant la fin du calcul des morceaux parallèles", correct: false}
      - {text: "`reduce` sans identité perd le premier élément quand il est parallèle", correct: false}
      - {text: "Les entiers débordent plus souvent en parallèle qu'en séquentiel", correct: false}
    answer: |-
      ```java
      int solde = mouvements.get(0) - mouvements.stream().skip(1).mapToInt(Integer::intValue).sum();
      ```
      La soustraction n'est pas associative : `reduce` peut regrouper les éléments dans n'importe quel ordre de calcul.
      On reformule avec une somme, qui l'est.
