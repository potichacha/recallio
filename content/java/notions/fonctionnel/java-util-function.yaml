notion: java-util-function
lesson: |-
  Le paquet `java.util.function` fournit les interfaces fonctionnelles de base. Inutile d'en inventer : on choisit selon
  **ce qui entre et ce qui sort**.

  | Interface | Méthode | Entrée → sortie | Exemple |
  |---|---|---|---|
  | `Function<T, R>` | `apply` | T → R | `String::length` |
  | `Predicate<T>` | `test` | T → boolean | `String::isBlank` |
  | `Consumer<T>` | `accept` | T → rien | `System.out::println` |
  | `Supplier<T>` | `get` | rien → T | `ArrayList::new` |
  | `UnaryOperator<T>` | `apply` | T → T | `String::strip` |
  | `BiFunction<T, U, R>` | `apply` | (T, U) → R | `String::repeat` |
  | `BinaryOperator<T>` | `apply` | (T, T) → T | `Integer::sum` |
  | `BiConsumer<T, U>`, `BiPredicate<T, U>` | `accept`, `test` | (T, U) → rien / boolean | `map.forEach(...)` |

  ```java
  Predicate<String> nonVide = s -> !s.isBlank();
  Function<String, Integer> longueur = String::length;
  Supplier<LocalDate> aujourdhui = LocalDate::now;
  Consumer<String> journal = log::info;

  if (nonVide.test(saisie)) journal.accept("longueur : " + longueur.apply(saisie));
  ```

  - `UnaryOperator<T>` étend `Function<T, T>`, `BinaryOperator<T>` étend `BiFunction<T, T, T>`.
  - Un **`Supplier`** sert aussi à **différer** un calcul : `Optional.orElseGet(supplier)` ou
    `log.debug(() -> cher())` ne l'appellent que si nécessaire.
  - Ces interfaces ne déclarent **aucune exception vérifiée**.
  - Pour les primitifs, des versions spécialisées évitent le boxing (`IntPredicate`, `ToIntFunction`...).

  **Piège classique** : confondre `Consumer` et `Function`. Un `Consumer` ne renvoie rien : `list.forEach` en attend un,
  `stream.map` attend une `Function`.

  **En entretien** : « Function transforme, Predicate teste, Consumer consomme, Supplier fournit ; les variantes Bi
  prennent deux arguments, les Operator gardent le même type. »
cards:
  - key: quatre
    format: course
    question: "Que font `Function`, `Predicate`, `Consumer` et `Supplier` ?"
    choices:
      - {text: "`Function` transforme, `Predicate` teste, `Consumer` consomme, `Supplier` fournit sans argument", correct: true}
      - {text: "`Function` transforme, `Predicate` fournit, `Consumer` teste, `Supplier` consomme sans retour", correct: false}
      - {text: "`Function` teste, `Predicate` transforme, `Consumer` fournit, `Supplier` consomme sans retour", correct: false}
      - {text: "`Function` transforme, `Predicate` teste, `Consumer` fournit sans argument, `Supplier` consomme", correct: false}
    answer: '`Function<T, R>` transforme un T en R, `Predicate<T>` teste un T (boolean), `Consumer<T>` consomme un T sans rien renvoyer, `Supplier<T>` fournit un T sans argument.'
  - key: operator
    format: course
    question: "Quelle différence entre `Function<T, T>` et `UnaryOperator<T>` ?"
    choices:
      - {text: "`UnaryOperator<T>` étend `Function<T, T>` : même type en entrée et en sortie", correct: true}
      - {text: "`UnaryOperator<T>` ne prend aucun argument, `Function<T, T>` en prend un", correct: false}
      - {text: "`UnaryOperator<T>` évite le boxing des primitifs, contrairement à `Function`", correct: false}
      - {text: "`Function<T, T>` peut lever une exception vérifiée, `UnaryOperator<T>` non", correct: false}
    answer: "`UnaryOperator<T>` est une `Function<T, T>` (elle l'étend) : entrée et sortie du même type ; le nom dit l'intention. Pour éviter le boxing, il y a `IntUnaryOperator` et ses semblables."
  - key: supplier-differer
    format: course
    question: "Pourquoi `Optional.orElseGet` prend-il un `Supplier` plutôt qu'une valeur ?"
    choices:
      - {text: "Pour différer le calcul : la valeur par défaut n'est calculée que si l'`Optional` est vide", correct: true}
      - {text: "Pour pouvoir renvoyer `null`, qu'`orElse` refuse en levant une `NullPointerException`", correct: false}
      - {text: "Pour mettre la valeur par défaut en cache, calculée une seule fois pour tous les appels", correct: false}
      - {text: "Pour calculer la valeur par défaut dans un autre thread, sans bloquer l'appelant", correct: false}
    answer: "Pour différer le calcul : la valeur par défaut n'est calculée que si l'`Optional` est vide."
  - key: bi
    format: course
    question: "À quoi servent `BiFunction` et `BinaryOperator` ?"
    choices:
      - {text: "`BiFunction<T, U, R>` prend deux arguments, renvoie un R ; `BinaryOperator<T>` prend deux T, renvoie un T", correct: true}
      - {text: "`BiFunction<T, U, R>` renvoie deux résultats ; `BinaryOperator<T>` prend un T et renvoie un booléen", correct: false}
      - {text: "`BiFunction<T, U, R>` applique deux fonctions de suite ; `BinaryOperator<T>` compare deux T entre eux", correct: false}
      - {text: "`BiFunction<T, U, R>` prend deux T, renvoie un T ; `BinaryOperator<T>` prend deux types, renvoie un R", correct: false}
    answer: "`BiFunction<T, U, R>` prend deux arguments et renvoie un R ; `BinaryOperator<T>` prend deux T et renvoie un T (par exemple `Integer::sum` pour un `reduce`)."
  - key: vf-consumer-retour
    format: true-false
    question: Un `Consumer<T>` renvoie une valeur.
    truth: false
    answer: '`accept` renvoie `void`.'
  - key: vf-predicate
    format: true-false
    question: La méthode d'un `Predicate` s'appelle `test`.
    truth: true
    answer: Elle renvoie un `boolean`.
  - key: vf-exception
    format: true-false
    question: "`Function.apply` peut lever une `IOException` déclarée."
    truth: false
    answer: Les interfaces de `java.util.function` ne déclarent aucune exception vérifiée.
  - key: vf-binary-operator
    format: true-false
    question: "`BinaryOperator<T>` est une `BiFunction<T, T, T>`."
    truth: true
    answer: Elle l'étend, et ajoute `minBy` et `maxBy`.
  - key: qcm-choix
    format: multiple-choice
    question: Quel type pour une fonction qui prend une `Commande` et dit si elle est payée ?
    choices:
      - text: "`Predicate<Commande>`"
        correct: true
      - text: "`Function<Commande, Boolean>`, qui boxe le résultat"
        correct: false
      - text: "`Consumer<Commande>`"
        correct: false
      - text: "`Supplier<Boolean>`"
        correct: false
    answer: '`Predicate` renvoie un `boolean` primitif et offre `and`, `or`, `negate`.'
  - key: qcm-references
    format: multiple-choice
    question: "Laquelle de ces affectations d'une référence de méthode compile ?"
    choices:
      - {text: "`Supplier<List<String>> s = ArrayList::new;`", correct: true}
      - {text: "`Predicate<String> p = String::length;`", correct: false}
      - {text: "`Supplier<String> s = String::toUpperCase;`", correct: false}
      - {text: "`Function<String, Boolean> f = String::length;`", correct: false}
    answer: "`ArrayList::new` ne prend rien et fournit une liste : c'est un `Supplier`. `length` renvoie un `int`, ni `boolean` ni `Boolean` ; `toUpperCase` a besoin d'une chaîne en entrée."
  - key: qcm-attendu
    format: multiple-choice
    question: Quelle interface attend `Iterable.forEach` ?
    choices:
      - text: "`Consumer<? super T>`"
        correct: true
      - text: "`Function<T, R>`"
        correct: false
      - text: "`Predicate<T>`"
        correct: false
      - text: "`Runnable`"
        correct: false
    answer: '`forEach` exécute une action sur chaque élément, sans résultat.'
  - key: qcm-reduce
    format: multiple-choice
    question: "Quel type attend le second argument de `stream.reduce(0, ...)` sur un `Stream<Integer>` ?"
    choices:
      - text: "`BinaryOperator<Integer>`"
        correct: true
      - text: "`UnaryOperator<Integer>`"
        correct: false
      - text: "`BiConsumer<Integer, Integer>`"
        correct: false
      - text: "`Supplier<Integer>`"
        correct: false
    answer: Deux valeurs du même type en entrée, une en sortie, par exemple `Integer::sum`.
  - key: trous-predicate
    format: fill-in
    question: |-
      Complète :
      ```java
      Predicate<String> email = s -> s.contains("@");
      boolean ok = email.___("ada@example.org");
      ```
    blanks: [[test]]
    answer: '`Predicate.test` renvoie un `boolean`.'
  - key: trous-supplier
    format: fill-in
    question: |-
      Complète le type d'une fabrique de listes :
      ```java
      ___<List<String>> fabrique = ArrayList::new;
      ```
    blanks: [[Supplier]]
    answer: Rien en entrée, une liste en sortie.
  - key: trous-consumer
    format: fill-in
    question: |-
      Complète :
      ```java
      Consumer<String> afficher = System.out::println;
      afficher.___("bonjour");
      ```
    blanks: [[accept]]
    answer: '`Consumer.accept` ne renvoie rien.'
  - key: trous-function
    format: fill-in
    question: |-
      Complète le type :
      ```java
      ___<String, Integer> longueur = String::length;
      ```
    blanks: [[Function]]
    answer: Une `String` en entrée, un `Integer` en sortie.
  - key: code-quatre
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Function<String, Integer> longueur = String::length;
      Predicate<Integer> pair = n -> n % 2 == 0;
      Supplier<String> mot = () -> "java";
      Consumer<Object> afficher = System.out::println;
      afficher.accept(pair.test(longueur.apply(mot.get())));
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`java`", correct: false}
    answer: '`true` : « java » a 4 lettres, et 4 est pair.'
    check:
      output: "true"
  - key: code-binary
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      BinaryOperator<Integer> plusGrand = BinaryOperator.maxBy(Comparator.naturalOrder());
      BiFunction<String, Integer, String> repeter = String::repeat;
      System.out.println(plusGrand.apply(3, 7) + repeter.apply("ab", 2));
      ```
    choices:
      - {text: "`7abab`", correct: true}
      - {text: "`3abab`", correct: false}
      - {text: "`7ab2`", correct: false}
      - {text: "`10abab`", correct: false}
    answer: "`7abab` : `maxBy` garde le plus grand des deux, et `\"ab\".repeat(2)` donne `abab`."
    check:
      output: "7abab"
  - key: code-supplier-paresseux
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Supplier<String> cher = () -> { System.out.print("calcul "); return "défaut"; };
      System.out.println(Optional.of("valeur").orElseGet(cher));
      ```
    choices:
      - {text: "`valeur`", correct: true}
      - {text: "`calcul valeur`", correct: false}
      - {text: "`calcul défaut`", correct: false}
      - {text: "`défaut`", correct: false}
    answer: "`valeur` : l'`Optional` est plein, le `Supplier` n'est jamais appelé. Avec `orElse(cher.get())`, `calcul` se serait affiché."
    check:
      output: "valeur"
  - key: code-unary
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      UnaryOperator<String> crier = s -> s.toUpperCase() + "!";
      List<String> mots = new ArrayList<>(List.of("oui", "non"));
      mots.replaceAll(crier);
      System.out.println(mots);
      ```
    choices:
      - {text: "`[OUI!, NON!]`", correct: true}
      - {text: "`[oui, non]`", correct: false}
      - {text: "`[OUI, NON]`", correct: false}
      - {text: "`[oui!, non!]`", correct: false}
    answer: '`[OUI!, NON!]` : `replaceAll` attend un `UnaryOperator`.'
    check:
      output: "[OUI!, NON!]"
  - key: bug-orelse
    format: bug-fix
    question: |-
      Le profilage montre que `chargerDefaut()`, coûteux, est appelé à chaque fois. Quelle correction est la bonne ?
      ```java
      Config c = cache.trouver(cle).orElse(chargerDefaut());
      ```
    choices:
      - {text: "`cache.trouver(cle).orElseGet(this::chargerDefaut)`", correct: true}
      - {text: "`cache.trouver(cle).orElse(this::chargerDefaut)`", correct: false}
      - {text: "`cache.trouver(cle).or(() -> chargerDefaut())`", correct: false}
      - {text: "Ranger `chargerDefaut()` dans une variable avant `orElse`", correct: false}
    answer: |-
      ```java
      Config c = cache.trouver(cle).orElseGet(this::chargerDefaut);
      ```
      L'argument d'`orElse` est évalué avant l'appel, même dans une variable ; un `Supplier` n'est appelé que si
      l'`Optional` est vide. `or` attend un `Supplier` d'`Optional`, pas d'une valeur.
  - key: bug-function-boolean
    format: bug-fix
    question: |-
      Comment améliorer le type de cette fonction ?
      ```java
      Function<Utilisateur, Boolean> estAdmin = u -> u.role() == Role.ADMIN;
      ```
    choices:
      - {text: "`Predicate<Utilisateur>`, qui renvoie un `boolean` sans boxing", correct: true}
      - {text: "`Function<Utilisateur, boolean>`, avec le type primitif", correct: false}
      - {text: "`Supplier<Boolean>`, qui renvoie le booléen sans argument", correct: false}
      - {text: "`Consumer<Utilisateur>`, qui teste sans rien renvoyer", correct: false}
    answer: |-
      ```java
      Predicate<Utilisateur> estAdmin = u -> u.role() == Role.ADMIN;
      ```
      `Predicate` renvoie un `boolean` sans boxing, s'utilise directement dans `filter`, et se combine avec `and`, `or`,
      `negate`.
  - key: bug-interface-maison
    format: bug-fix
    question: |-
      Comment simplifier ce code ?
      ```java
      interface Transformateur { String transformer(String s); }
      Transformateur t = String::strip;
      ```
    choices:
      - {text: "`UnaryOperator<String> t = String::strip;`", correct: true}
      - {text: "`Supplier<String> t = String::strip;`", correct: false}
      - {text: "`Predicate<String> t = String::strip;`", correct: false}
      - {text: "`Consumer<String> t = String::strip;`", correct: false}
    answer: |-
      ```java
      UnaryOperator<String> t = String::strip;
      ```
      L'interface existe dans le JDK, avec `andThen` et `compose` en prime. Un `Consumer` compilerait, mais jetterait le
      résultat.
  - key: bug-foreach-map
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      List<Integer> longueurs = mots.stream().forEach(String::length).toList();
      ```
    choices:
      - {text: "Remplacer `forEach` par `map`, qui transforme chaque élément", correct: true}
      - {text: "Remplacer `toList()` par `collect(Collectors.toList())`", correct: false}
      - {text: "Remplacer `String::length` par la lambda `s -> s.length()`", correct: false}
      - {text: "Remplacer `forEach` par `forEachOrdered`, qui rend le stream", correct: false}
    answer: |-
      ```java
      List<Integer> longueurs = mots.stream().map(String::length).toList();
      ```
      `forEach` prend un `Consumer` et ne renvoie rien ; transformer les éléments demande une `Function`, donc `map`.
