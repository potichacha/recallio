notion: java-util-function
lesson: |-
  Le paquet `java.util.function` fournit les interfaces fonctionnelles de base. Inutile d'en inventer : on choisit selon
  **ce qui entre et ce qui sort**.

  | Interface | Méthode | Entrée → sortie | Exemple |
  |---|---|---|---|
  | `Function<T, R>` | `apply` | T → R | `String::length` |
  | `Predicate<T>` | `test` | T → boolean | `String::isBlank` |
  | `Consumer<T>` | `accept` | T → rien | `System.out::println` |
  | `Supplier<T>` | `get` | rien → T | `ArrayList::new` |
  | `UnaryOperator<T>` | `apply` | T → T | `String::strip` |
  | `BiFunction<T, U, R>` | `apply` | (T, U) → R | `String::repeat` |
  | `BinaryOperator<T>` | `apply` | (T, T) → T | `Integer::sum` |
  | `BiConsumer<T, U>`, `BiPredicate<T, U>` | `accept`, `test` | (T, U) → rien / boolean | `map.forEach(...)` |

  ```java
  Predicate<String> nonVide = s -> !s.isBlank();
  Function<String, Integer> longueur = String::length;
  Supplier<LocalDate> aujourdhui = LocalDate::now;
  Consumer<String> journal = log::info;

  if (nonVide.test(saisie)) journal.accept("longueur : " + longueur.apply(saisie));
  ```

  - `UnaryOperator<T>` étend `Function<T, T>`, `BinaryOperator<T>` étend `BiFunction<T, T, T>`.
  - Un **`Supplier`** sert aussi à **différer** un calcul : `Optional.orElseGet(supplier)` ou
    `log.debug(() -> cher())` ne l'appellent que si nécessaire.
  - Ces interfaces ne déclarent **aucune exception vérifiée**.
  - Pour les primitifs, des versions spécialisées évitent le boxing (`IntPredicate`, `ToIntFunction`...).

  **Piège classique** : confondre `Consumer` et `Function`. Un `Consumer` ne renvoie rien : `list.forEach` en attend un,
  `stream.map` attend une `Function`.

  **En entretien** : « Function transforme, Predicate teste, Consumer consomme, Supplier fournit ; les variantes Bi
  prennent deux arguments, les Operator gardent le même type. »
cards:
  - key: quatre
    format: course
    question: Que font `Function`, `Predicate`, `Consumer` et `Supplier` ?
    answer: '`Function<T, R>` transforme un T en R, `Predicate<T>` teste un T (boolean), `Consumer<T>` consomme un T sans rien renvoyer, `Supplier<T>` fournit un T sans argument.'
  - key: operator
    format: course
    question: Quelle différence entre `Function<T, T>` et `UnaryOperator<T>` ?
    answer: '`UnaryOperator<T>` est une `Function<T, T>` (elle l''étend) : entrée et sortie du même type ; le nom dit l''intention.'
  - key: supplier-differer
    format: course
    question: Pourquoi `orElseGet` prend-il un `Supplier` plutôt qu'une valeur ?
    answer: "Pour différer le calcul : la valeur par défaut n'est calculée que si l'`Optional` est vide."
  - key: bi
    format: course
    question: À quoi servent `BiFunction` et `BinaryOperator` ?
    answer: '`BiFunction<T, U, R>` prend deux arguments et renvoie un R ; `BinaryOperator<T>` prend deux T et renvoie un T (par exemple `Integer::sum` pour un `reduce`).'
  - key: vf-consumer-retour
    format: true-false
    question: Un `Consumer<T>` renvoie une valeur.
    truth: false
    answer: '`accept` renvoie `void`.'
  - key: vf-predicate
    format: true-false
    question: La méthode d'un `Predicate` s'appelle `test`.
    truth: true
    answer: Elle renvoie un `boolean`.
  - key: vf-exception
    format: true-false
    question: "`Function.apply` peut lever une `IOException` déclarée."
    truth: false
    answer: Les interfaces de `java.util.function` ne déclarent aucune exception vérifiée.
  - key: vf-binary-operator
    format: true-false
    question: "`BinaryOperator<T>` est une `BiFunction<T, T, T>`."
    truth: true
    answer: Elle l'étend, et ajoute `minBy` et `maxBy`.
  - key: qcm-choix
    format: multiple-choice
    question: Quel type pour une fonction qui prend une `Commande` et dit si elle est payée ?
    choices:
      - text: "`Predicate<Commande>`"
        correct: true
      - text: "`Function<Commande, Boolean>`, qui boxe le résultat"
        correct: false
      - text: "`Consumer<Commande>`"
        correct: false
      - text: "`Supplier<Boolean>`"
        correct: false
    answer: '`Predicate` renvoie un `boolean` primitif et offre `and`, `or`, `negate`.'
  - key: qcm-references
    format: multiple-choice
    question: Associez correctement les références de méthode à leur type.
    choices:
      - text: "`Supplier<List<String>> s = ArrayList::new;`"
        correct: true
      - text: "`Consumer<String> c = System.out::println;`"
        correct: true
      - text: "`Predicate<String> p = String::length;`"
        correct: false
      - text: "`Supplier<String> s = String::toUpperCase;`"
        correct: false
    answer: '`length` renvoie un `int`, pas un `boolean` ; `toUpperCase` a besoin d''une chaîne en entrée.'
  - key: qcm-attendu
    format: multiple-choice
    question: Quelle interface attend `Iterable.forEach` ?
    choices:
      - text: "`Consumer<? super T>`"
        correct: true
      - text: "`Function<T, R>`"
        correct: false
      - text: "`Predicate<T>`"
        correct: false
      - text: "`Runnable`"
        correct: false
    answer: '`forEach` exécute une action sur chaque élément, sans résultat.'
  - key: qcm-reduce
    format: multiple-choice
    question: "Quel type attend le second argument de `stream.reduce(0, ...)` sur un `Stream<Integer>` ?"
    choices:
      - text: "`BinaryOperator<Integer>`"
        correct: true
      - text: "`UnaryOperator<Integer>`"
        correct: false
      - text: "`BiConsumer<Integer, Integer>`"
        correct: false
      - text: "`Supplier<Integer>`"
        correct: false
    answer: Deux valeurs du même type en entrée, une en sortie, par exemple `Integer::sum`.
  - key: trous-predicate
    format: fill-in
    question: |-
      Complétez :
      ```java
      Predicate<String> email = s -> s.contains("@");
      boolean ok = email.___("ada@example.org");
      ```
    blanks: [[test]]
    answer: '`Predicate.test` renvoie un `boolean`.'
  - key: trous-supplier
    format: fill-in
    question: |-
      Complétez le type d'une fabrique de listes :
      ```java
      ___<List<String>> fabrique = ArrayList::new;
      ```
    blanks: [[Supplier]]
    answer: Rien en entrée, une liste en sortie.
  - key: trous-consumer
    format: fill-in
    question: |-
      Complétez :
      ```java
      Consumer<String> afficher = System.out::println;
      afficher.___("bonjour");
      ```
    blanks: [[accept]]
    answer: '`Consumer.accept` ne renvoie rien.'
  - key: trous-function
    format: fill-in
    question: |-
      Complétez le type :
      ```java
      ___<String, Integer> longueur = String::length;
      ```
    blanks: [[Function]]
    answer: Une `String` en entrée, un `Integer` en sortie.
  - key: code-quatre
    format: code-output
    question: |-
      ```java
      Function<String, Integer> longueur = String::length;
      Predicate<Integer> pair = n -> n % 2 == 0;
      Supplier<String> mot = () -> "java";
      Consumer<Object> afficher = System.out::println;
      afficher.accept(pair.test(longueur.apply(mot.get())));
      ```
    answer: '`true` : « java » a 4 lettres, et 4 est pair.'
    check:
      output: "true"
  - key: code-binary
    format: code-output
    question: |-
      ```java
      BinaryOperator<Integer> plusGrand = BinaryOperator.maxBy(Comparator.naturalOrder());
      BiFunction<String, Integer, String> repeter = String::repeat;
      System.out.println(plusGrand.apply(3, 7) + repeter.apply("ab", 2));
      ```
    answer: '`7abab`.'
    check:
      output: "7abab"
  - key: code-supplier-paresseux
    format: code-output
    question: |-
      ```java
      Supplier<String> cher = () -> { System.out.print("calcul "); return "défaut"; };
      System.out.println(Optional.of("valeur").orElseGet(cher));
      ```
    answer: '`valeur` : le `Supplier` n''est jamais appelé.'
    check:
      output: "valeur"
  - key: code-unary
    format: code-output
    question: |-
      ```java
      UnaryOperator<String> crier = s -> s.toUpperCase() + "!";
      List<String> mots = new ArrayList<>(List.of("oui", "non"));
      mots.replaceAll(crier);
      System.out.println(mots);
      ```
    answer: '`[OUI!, NON!]` : `replaceAll` attend un `UnaryOperator`.'
    check:
      output: "[OUI!, NON!]"
  - key: bug-orelse
    format: bug-fix
    question: |-
      Le profilage montre que `chargerDefaut()`, coûteux, est appelé à chaque fois :
      ```java
      Config c = cache.trouver(cle).orElse(chargerDefaut());
      ```
    answer: |-
      ```java
      Config c = cache.trouver(cle).orElseGet(this::chargerDefaut);
      ```
      L'argument d'`orElse` est évalué avant l'appel ; un `Supplier` n'est appelé que si l'`Optional` est vide.
  - key: bug-function-boolean
    format: bug-fix
    question: |-
      Améliorez ce type :
      ```java
      Function<Utilisateur, Boolean> estAdmin = u -> u.role() == Role.ADMIN;
      ```
    answer: |-
      ```java
      Predicate<Utilisateur> estAdmin = u -> u.role() == Role.ADMIN;
      ```
      `Predicate` renvoie un `boolean` sans boxing, s'utilise directement dans `filter`, et se combine avec `and`, `or`,
      `negate`.
  - key: bug-interface-maison
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      interface Transformateur { String transformer(String s); }
      Transformateur t = String::strip;
      ```
    answer: |-
      ```java
      UnaryOperator<String> t = String::strip;
      ```
      L'interface existe dans le JDK, avec `andThen` et `compose` en prime.
  - key: bug-foreach-map
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      List<Integer> longueurs = mots.stream().forEach(String::length).toList();
      ```
    answer: |-
      ```java
      List<Integer> longueurs = mots.stream().map(String::length).toList();
      ```
      `forEach` prend un `Consumer` et ne renvoie rien ; transformer les éléments demande une `Function`, donc `map`.
