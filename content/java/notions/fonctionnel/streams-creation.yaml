notion: streams-creation
cards:
  - key: creer-stream-infini
    format: course
    question: Comment créer un stream infini ?
    answer: '`Stream.iterate` ou `Stream.generate`, borné ensuite par `limit` ou `takeWhile`.'
  - key: traitement-lit-fichier-logs-5-go
    format: scenario
    question: Un traitement lit un fichier de logs de 5 Go et doit compter les erreurs par code.
    answer: |-
      Je lirais en flux avec `Files.lines(path)` dans un **try-with-resources** (le stream tient un descripteur de fichier ouvert), puis `filter` sur les lignes d'erreur, `map` pour extraire le code, et `groupingBy(code, counting())`.
      La mémoire reste bornée par le nombre de codes distincts, pas par la taille du fichier, puisque `Files.lines` est paresseux.
      Si c'est trop lent, je mesurerais avant de paralléliser : la lecture disque est souvent le goulot, et un stream parallèle sur des lignes de fichier se découpe moins bien qu'une collection en mémoire.
