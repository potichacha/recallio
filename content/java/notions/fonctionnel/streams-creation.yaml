notion: streams-creation
lesson: |-
  Un stream se crée depuis de nombreuses sources :

  ```java
  liste.stream();                                  // une collection
  Stream.of("a", "b", "c");                        // des valeurs
  Stream.ofNullable(peutEtreNull);                 // 0 ou 1 élément (Java 9)
  Stream.empty();
  Arrays.stream(tableau);                          // un tableau (IntStream pour un int[])
  map.entrySet().stream();                         // une map, par ses entrées

  Stream.iterate(1, x -> x * 2);                   // infini : 1, 2, 4, 8...
  Stream.iterate(1, x -> x < 100, x -> x * 2);     // borné (Java 9), comme une boucle for
  Stream.generate(UUID::randomUUID);               // infini, chaque élément fourni par un Supplier
  Stream.concat(s1, s2);                           // deux streams bout à bout

  try (Stream<String> lignes = Files.lines(chemin)) {   // un fichier, ligne par ligne, paresseusement
      ...
  }
  "a,b,c".chars(); texte.lines(); Pattern.compile(",").splitAsStream(s);
  new Random().ints(5, 0, 100);                    // 5 entiers aléatoires
  ```

  - `iterate` et `generate` sans borne sont **infinis** : il faut `limit`, `takeWhile` ou une opération qui court-circuite.
  - **`Files.lines`** garde le fichier ouvert : on le ferme avec un **try-with-resources**. Il lit paresseusement, donc
    la mémoire ne dépend pas de la taille du fichier.
  - `Stream.of(tableau)` sur un `int[]` donne un `Stream<int[]>` d'un seul élément : pour les primitifs, `Arrays.stream`
    ou `IntStream.of`.
  - Un `Builder` (`Stream.builder()`) existe, mais une liste suffit presque toujours.

  **Piège classique** : `Stream.generate(...)` ou `iterate` à deux arguments suivi de `toList()` sans borne : le programme
  ne termine jamais et finit en `OutOfMemoryError`.

  **En entretien** : « `stream()`, `Stream.of`, `Arrays.stream`, `iterate`/`generate` bornés par `limit`, et
  `Files.lines` dans un try-with-resources pour lire un gros fichier en flux. »
cards:
  - key: creer-stream-infini
    format: course
    question: Comment créer un stream infini ?
    answer: '`Stream.iterate` ou `Stream.generate`, borné ensuite par `limit` ou `takeWhile`.'
  - key: files-lines
    format: course
    question: Pourquoi `Files.lines` doit-il être dans un try-with-resources ?
    answer: Le stream garde le fichier ouvert jusqu'à sa fermeture ; sans `close`, le descripteur de fichier fuit.
  - key: iterate-trois
    format: course
    question: Que fait `Stream.iterate(1, x -> x <= 100, x -> x * 2)` ?
    answer: Il produit 1, 2, 4... tant que la condition est vraie (jusqu'à 64), comme une boucle `for` (Java 9).
  - key: of-nullable
    format: course
    question: À quoi sert `Stream.ofNullable(x)` ?
    answer: À obtenir un stream vide si `x` est `null`, et d'un élément sinon (Java 9), utile dans un `flatMap`.
  - key: vf-generate
    format: true-false
    question: "`Stream.generate(Math::random)` produit un stream fini."
    truth: false
    answer: Il est infini ; on le borne avec `limit`.
  - key: vf-of-tableau
    format: true-false
    question: "`Stream.of(new int[]{1, 2, 3}).count()` vaut 3."
    truth: false
    answer: "Il vaut 1 : c'est un `Stream<int[]>` d'un seul tableau ; `Arrays.stream` donne un `IntStream`."
  - key: vf-lines-paresseux
    format: true-false
    question: "`Files.lines` charge tout le fichier en mémoire."
    truth: false
    answer: Il lit les lignes à la demande.
  - key: vf-concat
    format: true-false
    question: "`Stream.concat(a, b)` met les éléments de `a` puis ceux de `b`."
    truth: true
    answer: Pour plus de deux streams, `Stream.of(a, b, c).flatMap(s -> s)`.
  - key: qcm-tableau
    format: multiple-choice
    question: Comment obtenir un `IntStream` depuis un `int[] notes` ?
    choices:
      - text: "`Arrays.stream(notes)`"
        correct: true
      - text: "`IntStream.of(notes)`"
        correct: true
      - text: "`Stream.of(notes)`"
        correct: false
      - text: "`notes.stream()`"
        correct: false
    answer: Un tableau n'a pas de méthode `stream()`.
  - key: qcm-fini
    format: multiple-choice
    question: Lesquelles produisent un stream fini ?
    choices:
      - text: "`Stream.iterate(0, i -> i < 10, i -> i + 1)`"
        correct: true
      - text: "`Stream.generate(() -> \"x\").limit(3)`"
        correct: true
      - text: "`Stream.iterate(0, i -> i + 1)`"
        correct: false
      - text: "`Stream.generate(() -> \"x\")`"
        correct: false
    answer: La version à trois arguments d'`iterate` porte sa propre condition d'arrêt.
  - key: qcm-fichier
    format: multiple-choice
    question: Comment compter les lignes non vides d'un fichier de 10 Go ?
    choices:
      - text: "`try (var l = Files.lines(p)) { n = l.filter(s -> !s.isBlank()).count(); }`"
        correct: true
      - text: "`Files.readAllLines(p).stream().filter(...).count()`"
        correct: false
      - text: "`Files.readString(p).lines().filter(...).count()`"
        correct: false
      - text: "`Files.lines(p).filter(...).count()`, sans fermeture"
        correct: false
    answer: Les deux suivantes chargent tout en mémoire ; la dernière laisse le fichier ouvert.
  - key: qcm-aleatoire
    format: multiple-choice
    question: Comment produire 5 entiers aléatoires entre 0 et 99 ?
    choices:
      - text: "`new Random().ints(5, 0, 100)`"
        correct: true
      - text: "`Stream.generate(() -> random.nextInt(100)).limit(5)`"
        correct: true
      - text: "`IntStream.range(0, 100).limit(5)`"
        correct: false
      - text: "`Stream.of(Math.random()).limit(5)`"
        correct: false
    answer: '`range` donne 0, 1, 2, 3, 4 ; `Stream.of` un seul élément.'
  - key: code-iterate
    format: code-output
    question: |-
      ```java
      System.out.println(Stream.iterate(1, x -> x <= 20, x -> x * 3).toList() + " "
              + Stream.iterate("a", s -> s + "a").limit(3).toList());
      ```
    answer: '`[1, 3, 9] [a, aa, aaa]`.'
    check:
      output: "[1, 3, 9] [a, aa, aaa]"
  - key: code-of-tableau
    format: code-output
    question: |-
      ```java
      int[] t = {1, 2, 3};
      Integer[] u = {1, 2, 3};
      System.out.println(Stream.of(t).count() + " " + Stream.of(u).count() + " " + Arrays.stream(t).sum());
      ```
    answer: '`1 3 6` : un `int[]` est un seul objet pour `Stream.of`.'
    check:
      output: "1 3 6"
  - key: code-generate
    format: code-output
    question: |-
      ```java
      int[] compteur = {0};
      System.out.println(Stream.generate(() -> ++compteur[0]).limit(4).toList());
      ```
    answer: '`[1, 2, 3, 4]`.'
    check:
      output: "[1, 2, 3, 4]"
  - key: code-concat-nullable
    format: code-output
    question: |-
      ```java
      String absent = null;
      System.out.println(Stream.concat(Stream.of("a"), Stream.ofNullable(absent)).toList() + " "
              + "x\ny\nz".lines().count());
      ```
    answer: '`[a] 3`.'
    check:
      output: "[a] 3"
  - key: traitement-lit-fichier-logs-5-go
    format: scenario
    question: Un traitement lit un fichier de logs de 5 Go et doit compter les erreurs par code.
    answer: |-
      Je lirais en flux avec `Files.lines(path)` dans un **try-with-resources** (le stream tient un descripteur de fichier ouvert), puis `filter` sur les lignes d'erreur, `map` pour extraire le code, et `groupingBy(code, counting())`.
      La mémoire reste bornée par le nombre de codes distincts, pas par la taille du fichier, puisque `Files.lines` est paresseux.
      Si c'est trop lent, je mesurerais avant de paralléliser : la lecture disque est souvent le goulot, et un stream parallèle sur des lignes de fichier se découpe moins bien qu'une collection en mémoire.
  - key: scenario-jeu-de-test
    format: scenario
    question: Tu dois générer 10 000 utilisateurs de test avec des identifiants uniques. Comment, avec des streams ?
    answer: |-
      `IntStream.rangeClosed(1, 10_000).mapToObj(i -> new Utilisateur("user-" + i, "user" + i + "@test.local")).toList()`.
      Un index séquentiel garantit l'unicité et rend les données reproductibles, ce qui aide au débogage. Si j'ai besoin
      de hasard (âges, villes), je passe un `Random` initialisé avec une graine fixe (`new Random(42)`) pour que le jeu de
      données soit le même à chaque exécution du test. `Stream.generate` conviendrait si chaque élément était
      indépendant, mais il faudrait un `limit`.
  - key: scenario-pagination-api
    format: scenario
    question: Une API externe renvoie des pages de résultats, avec un jeton de page suivante. Comment exposer tous les résultats comme un stream ?
    answer: |-
      Avec `Stream.iterate` à trois arguments sur les pages : la première page, la condition « la page existe », et le
      passage à la suivante :
      ```java
      Stream.iterate(api.page(null), Objects::nonNull,
                      p -> p.jetonSuivant() == null ? null : api.page(p.jetonSuivant()))
              .flatMap(p -> p.elements().stream());
      ```
      Le stream reste paresseux : un `findFirst` ou un `limit` n'appelle que les pages nécessaires. Je gère les erreurs
      réseau (réessais, délai) dans `api.page`, et je documente que chaque consommation du stream refait les appels.
  - key: scenario-fusion-sources
    format: scenario
    question: Tu dois traiter ensemble les clients d'une base, d'un fichier CSV et d'une API, avec le même pipeline.
    answer: |-
      Je fais renvoyer à chaque source un `Stream<Client>` (le CSV par `Files.lines` puis un `map` de parsing, la base et
      l'API via leurs adaptateurs), puis je les assemble : `Stream.of(base, csv, api).flatMap(s -> s)`, ou `Stream.concat`
      pour deux sources. Le pipeline commun (validation, dédoublonnage par email avec `distinct` sur une clé normalisée,
      enrichissement) s'écrit une fois. Je ferme les ressources (le fichier) avec un try-with-resources, ou via
      `onClose`, et je garde le traitement de chaque source testable isolément.
