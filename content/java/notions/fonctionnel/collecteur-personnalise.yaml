notion: collecteur-personnalise
lesson: |-
  Quand aucun collecteur de `Collectors` ne convient, on en écrit un avec **`Collector.of`**. Un collecteur a quatre
  fonctions, et des caractéristiques :

  | Partie | Rôle |
  |---|---|
  | `supplier` | crée un conteneur vide (l'accumulateur mutable) |
  | `accumulator` | ajoute un élément au conteneur |
  | `combiner` | fusionne deux conteneurs (utilisé en parallèle) |
  | `finisher` | transforme le conteneur en résultat final (facultatif) |
  | caractéristiques | `IDENTITY_FINISH`, `UNORDERED`, `CONCURRENT` |

  ```java
  // Collecter dans un StringJoiner, puis en String
  Collector<String, StringJoiner, String> enListe = Collector.of(
          () -> new StringJoiner(", ", "[", "]"),     // supplier
          StringJoiner::add,                         // accumulator
          StringJoiner::merge,                       // combiner
          StringJoiner::toString);                   // finisher

  // Un collecteur qui calcule min et max en un passage
  Collector<Integer, int[], String> minMax = Collector.of(
          () -> new int[]{Integer.MAX_VALUE, Integer.MIN_VALUE},
          (a, x) -> { a[0] = Math.min(a[0], x); a[1] = Math.max(a[1], x); },
          (a, b) -> { a[0] = Math.min(a[0], b[0]); a[1] = Math.max(a[1], b[1]); return a; },
          a -> a[0] + ".." + a[1]);
  ```

  - Le **combineur** doit être correct, même si l'on n'utilise pas de stream parallèle : rien ne l'empêche d'être appelé.
  - Sans finisher, le résultat est le conteneur lui-même (caractéristique `IDENTITY_FINISH` implicite).
  - Avant d'écrire un collecteur, on vérifie les composables : `collectingAndThen`, `teeing`, `reducing`, `mapping`,
    `filtering` couvrent beaucoup de cas.
  - Un collecteur nommé (`MesCollecteurs.versCsv()`) se réutilise et se teste comme une fonction.

  **Piège classique** : un combineur qui renvoie un nouveau conteneur vide, ou qui oublie un des deux. En parallèle, des
  éléments disparaissent sans erreur.

  **En entretien** : « `Collector.of(supplier, accumulator, combiner, finisher)` : un conteneur mutable, une façon d'y
  ajouter, une façon d'en fusionner deux et une finition. Mais je compose d'abord les collecteurs existants. »
cards:
  - key: quatre-fonctions
    format: course
    question: Quelles sont les quatre fonctions d'un `Collector` ?
    answer: Le supplier (crée le conteneur), l'accumulator (y ajoute un élément), le combiner (fusionne deux conteneurs) et le finisher (produit le résultat final).
  - key: combineur
    format: course
    question: Quand le combineur d'un collecteur est-il appelé ?
    answer: Quand le stream est parallèle, pour fusionner les conteneurs des différents morceaux ; il doit donc être correct dans tous les cas.
  - key: identity-finish
    format: course
    question: Que signifie la caractéristique `IDENTITY_FINISH` ?
    answer: "Que le conteneur est lui-même le résultat : le finisher est l'identité et peut être omis."
  - key: avant-ecrire
    format: course
    question: Que vérifier avant d'écrire son propre collecteur ?
    answer: Si une composition des collecteurs existants (`collectingAndThen`, `teeing`, `reducing`, `mapping`, `filtering`) ne suffit pas déjà.
  - key: vf-finisher
    format: true-false
    question: Le finisher est obligatoire dans `Collector.of`.
    truth: false
    answer: Une surcharge à trois fonctions existe ; le conteneur est alors le résultat.
  - key: vf-combiner-sequentiel
    format: true-false
    question: Sur un stream séquentiel, un combineur faux est sans danger, donc on peut l'ignorer.
    truth: false
    answer: Le stream peut devenir parallèle, et le contrat exige un combineur correct.
  - key: vf-mutable
    format: true-false
    question: Le conteneur d'un collecteur est en général un objet mutable.
    truth: true
    answer: C'est la différence avec `reduce`, qui combine des valeurs immuables.
  - key: vf-concurrent
    format: true-false
    question: "La caractéristique `CONCURRENT` signifie que plusieurs threads peuvent accumuler dans le même conteneur."
    truth: true
    answer: Le conteneur doit alors être thread-safe (par exemple une `ConcurrentHashMap`).
  - key: qcm-parties
    format: multiple-choice
    question: "Dans `Collector.of(ArrayList::new, List::add, (a, b) -> { a.addAll(b); return a; })`, quel est le rôle de `List::add` ?"
    choices:
      - text: "L'accumulateur"
        correct: true
      - text: "Le supplier"
        correct: false
      - text: "Le combineur"
        correct: false
      - text: "Le finisher"
        correct: false
    answer: Il ajoute un élément au conteneur.
  - key: qcm-composer
    format: multiple-choice
    question: Comment obtenir une liste non modifiable des noms, sans écrire de collecteur ?
    choices:
      - text: "`collectingAndThen(mapping(Client::nom, toList()), List::copyOf)`"
        correct: true
      - text: "`map(Client::nom).toList()`"
        correct: true
      - text: "`Collector.of(...)` à quatre fonctions, obligatoirement"
        correct: false
      - text: "`collect(toSet())`"
        correct: false
    answer: Composer suffit ; `toSet` perdrait l'ordre et les doublons.
  - key: qcm-combineur-faux
    format: multiple-choice
    question: "Quel est le défaut du combineur `(a, b) -> a` pour un collecteur qui remplit des listes ?"
    choices:
      - text: "Il perd les éléments de `b` en parallèle"
        correct: true
      - text: "Il ne compile pas"
        correct: false
      - text: "Il double les éléments"
        correct: false
      - text: "Aucun"
        correct: false
    answer: "Il faut fusionner : `a.addAll(b); return a;`."
  - key: qcm-signature
    format: multiple-choice
    question: "Que désignent les trois types de `Collector<T, A, R>` ?"
    choices:
      - text: "T les éléments, A le conteneur intermédiaire, R le résultat"
        correct: true
      - text: "T le résultat, A les éléments, R le conteneur"
        correct: false
      - text: "T le type de clé, A la valeur, R la map"
        correct: false
      - text: "Trois types d'éléments acceptés"
        correct: false
    answer: Le type A est souvent caché par un joker (`?`).
  - key: code-joiner
    format: code-output
    question: |-
      ```java
      Collector<String, StringJoiner, String> enListe = Collector.of(
              () -> new StringJoiner(", ", "<", ">"),
              StringJoiner::add,
              StringJoiner::merge,
              StringJoiner::toString);
      System.out.println(Stream.of("a", "b", "c").collect(enListe));
      ```
    answer: '`<a, b, c>`.'
    check:
      output: "<a, b, c>"
  - key: code-min-max
    format: code-output
    question: |-
      ```java
      Collector<Integer, int[], String> minMax = Collector.of(
              () -> new int[]{Integer.MAX_VALUE, Integer.MIN_VALUE},
              (a, x) -> { a[0] = Math.min(a[0], x); a[1] = Math.max(a[1], x); },
              (a, b) -> { a[0] = Math.min(a[0], b[0]); a[1] = Math.max(a[1], b[1]); return a; },
              a -> a[0] + ".." + a[1]);
      System.out.println(Stream.of(5, 2, 9, 4).collect(minMax));
      ```
    answer: '`2..9`.'
    check:
      output: "2..9"
  - key: code-parallele
    format: code-output
    question: |-
      ```java
      Collector<Integer, List<Integer>, List<Integer>> versListe = Collector.of(
              ArrayList::new, List::add, (a, b) -> { a.addAll(b); return a; });
      System.out.println(IntStream.rangeClosed(1, 1000).boxed().parallel().collect(versListe).size());
      ```
    answer: '`1000` : avec un combineur correct, le résultat parallèle est complet.'
    check:
      output: "1000"
  - key: code-sans-finisher
    format: code-output
    question: |-
      ```java
      Collector<String, StringBuilder, StringBuilder> concat = Collector.of(
              StringBuilder::new, StringBuilder::append, StringBuilder::append);
      System.out.println(Stream.of("x", "y", "z").collect(concat).reverse());
      ```
    answer: '`zyx` : sans finisher, le résultat est le `StringBuilder` lui-même.'
    check:
      output: "zyx"
