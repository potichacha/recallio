notion: collecteur-personnalise
lesson: |-
  Quand aucun collecteur de `Collectors` ne convient, on en écrit un avec **`Collector.of`**. Un collecteur a quatre
  fonctions, et des caractéristiques :

  | Partie | Rôle |
  |---|---|
  | `supplier` | crée un conteneur vide (l'accumulateur mutable) |
  | `accumulator` | ajoute un élément au conteneur |
  | `combiner` | fusionne deux conteneurs (utilisé en parallèle) |
  | `finisher` | transforme le conteneur en résultat final (facultatif) |
  | caractéristiques | `IDENTITY_FINISH`, `UNORDERED`, `CONCURRENT` |

  ```java
  // Collecter dans un StringJoiner, puis en String
  Collector<String, StringJoiner, String> enListe = Collector.of(
          () -> new StringJoiner(", ", "[", "]"),     // supplier
          StringJoiner::add,                         // accumulator
          StringJoiner::merge,                       // combiner
          StringJoiner::toString);                   // finisher

  // Un collecteur qui calcule min et max en un passage
  Collector<Integer, int[], String> minMax = Collector.of(
          () -> new int[]{Integer.MAX_VALUE, Integer.MIN_VALUE},
          (a, x) -> { a[0] = Math.min(a[0], x); a[1] = Math.max(a[1], x); },
          (a, b) -> { a[0] = Math.min(a[0], b[0]); a[1] = Math.max(a[1], b[1]); return a; },
          a -> a[0] + ".." + a[1]);
  ```

  - Le **combineur** doit être correct, même si l'on n'utilise pas de stream parallèle : rien ne l'empêche d'être appelé.
  - Sans finisher, le résultat est le conteneur lui-même (caractéristique `IDENTITY_FINISH` implicite).
  - Avant d'écrire un collecteur, on vérifie les composables : `collectingAndThen`, `teeing`, `reducing`, `mapping`,
    `filtering` couvrent beaucoup de cas.
  - Un collecteur nommé (`MesCollecteurs.versCsv()`) se réutilise et se teste comme une fonction.

  **Piège classique** : un combineur qui renvoie un nouveau conteneur vide, ou qui oublie un des deux. En parallèle, des
  éléments disparaissent sans erreur.

  **En entretien** : « `Collector.of(supplier, accumulator, combiner, finisher)` : un conteneur mutable, une façon d'y
  ajouter, une façon d'en fusionner deux et une finition. Mais je compose d'abord les collecteurs existants. »
cards:
  - key: quatre-fonctions
    format: course
    question: "Quelles sont les quatre fonctions d'un `Collector` ?"
    choices:
      - {text: "Le supplier, l'accumulator, le combiner et le finisher", correct: true}
      - {text: "Le supplier, le filter, le mapper et le reducer", correct: false}
      - {text: "La source, l'accumulator, le merger et le finisher", correct: false}
      - {text: "Le supplier, le consumer, le combiner et les characteristics", correct: false}
    answer: "Le supplier (crée le conteneur), l'accumulator (y ajoute un élément), le combiner (fusionne deux conteneurs) et le finisher (produit le résultat final). Les caractéristiques ne sont pas une fonction : ce sont des indications pour le stream."
  - key: combineur
    format: course
    question: "Quand le combineur d'un collecteur est-il appelé ?"
    choices:
      - {text: "Quand le stream est parallèle, pour fusionner les conteneurs des morceaux", correct: true}
      - {text: "À la fin de chaque collecte, pour produire le résultat final", correct: false}
      - {text: "Pour chaque élément, afin de l'ajouter au conteneur courant", correct: false}
      - {text: "Quand le stream est vide, pour fournir une valeur par défaut", correct: false}
    answer: "Quand le stream est parallèle, pour fusionner les conteneurs des différents morceaux ; il doit donc être correct dans tous les cas. Le résultat final vient du finisher, et chaque élément passe par l'accumulator."
  - key: identity-finish
    format: course
    question: "Que signifie la caractéristique `IDENTITY_FINISH` d'un collecteur ?"
    choices:
      - {text: "Le conteneur est lui-même le résultat : le finisher peut être omis", correct: true}
      - {text: "Le collecteur garde l'ordre de rencontre des éléments du stream", correct: false}
      - {text: "Plusieurs threads peuvent remplir un seul conteneur partagé", correct: false}
      - {text: "Le résultat est une collection non modifiable, rendue telle quelle", correct: false}
    answer: "Que le conteneur est lui-même le résultat : le finisher est l'identité et peut être omis. Un seul conteneur partagé entre threads, c'est la caractéristique `CONCURRENT`."
  - key: avant-ecrire
    format: course
    question: "Que vérifier avant d'écrire son propre collecteur avec `Collector.of` ?"
    choices:
      - {text: "Qu'une composition des collecteurs existants (`teeing`, `mapping`...) ne suffit pas", correct: true}
      - {text: "Que le stream est séquentiel, car `Collector.of` ne marche pas en parallèle", correct: false}
      - {text: "Que le résultat est une `List`, le seul type qu'un collecteur sait produire", correct: false}
      - {text: "Que les éléments sont immuables, sans quoi l'accumulateur ne peut pas les ranger", correct: false}
    answer: "Si une composition des collecteurs existants (`collectingAndThen`, `teeing`, `reducing`, `mapping`, `filtering`) ne suffit pas déjà. Un collecteur maison marche aussi en parallèle, à condition d'avoir un combineur correct."
  - key: vf-finisher
    format: true-false
    question: Le finisher est obligatoire dans `Collector.of`.
    truth: false
    answer: Une surcharge à trois fonctions existe ; le conteneur est alors le résultat.
  - key: vf-combiner-sequentiel
    format: true-false
    question: Sur un stream séquentiel, un combineur faux est sans danger, donc on peut l'ignorer.
    truth: false
    answer: Le stream peut devenir parallèle, et le contrat exige un combineur correct.
  - key: vf-mutable
    format: true-false
    question: Le conteneur d'un collecteur est en général un objet mutable.
    truth: true
    answer: C'est la différence avec `reduce`, qui combine des valeurs immuables.
  - key: vf-concurrent
    format: true-false
    question: "La caractéristique `CONCURRENT` signifie que plusieurs threads peuvent accumuler dans le même conteneur."
    truth: true
    answer: Le conteneur doit alors être thread-safe (par exemple une `ConcurrentHashMap`).
  - key: qcm-parties
    format: multiple-choice
    question: "Dans `Collector.of(ArrayList::new, List::add, (a, b) -> { a.addAll(b); return a; })`, quel est le rôle de `List::add` ?"
    choices:
      - text: "L'accumulateur"
        correct: true
      - text: "Le supplier"
        correct: false
      - text: "Le combineur"
        correct: false
      - text: "Le finisher"
        correct: false
    answer: Il ajoute un élément au conteneur.
  - key: qcm-composer
    format: multiple-choice
    question: "Lesquelles de ces expressions donnent une liste non modifiable des noms, sans écrire de collecteur ?"
    choices:
      - text: "`collectingAndThen(mapping(Client::nom, toList()), List::copyOf)`"
        correct: true
      - text: "`map(Client::nom).toList()`"
        correct: true
      - text: "`Collector.of(...)` à quatre fonctions, obligatoirement"
        correct: false
      - text: "`collect(toSet())`"
        correct: false
    answer: Composer suffit ; `toSet` perdrait l'ordre et les doublons.
  - key: qcm-combineur-faux
    format: multiple-choice
    question: "Quel est le défaut du combineur `(a, b) -> a` pour un collecteur qui remplit des listes ?"
    choices:
      - text: "Il perd les éléments de `b` en parallèle"
        correct: true
      - text: "Il ne compile pas"
        correct: false
      - text: "Il double les éléments"
        correct: false
      - text: "Aucun"
        correct: false
    answer: "Il faut fusionner : `a.addAll(b); return a;`."
  - key: qcm-signature
    format: multiple-choice
    question: "Que désignent les trois types de `Collector<T, A, R>` ?"
    choices:
      - text: "T les éléments, A le conteneur intermédiaire, R le résultat"
        correct: true
      - text: "T le résultat, A les éléments, R le conteneur"
        correct: false
      - text: "T le type de clé, A la valeur, R la map"
        correct: false
      - text: "Trois types d'éléments acceptés"
        correct: false
    answer: Le type A est souvent caché par un joker (`?`).
  - key: code-joiner
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Collector<String, StringJoiner, String> enListe = Collector.of(
              () -> new StringJoiner(", ", "<", ">"),
              StringJoiner::add,
              StringJoiner::merge,
              StringJoiner::toString);
      System.out.println(Stream.of("a", "b", "c").collect(enListe));
      ```
    choices:
      - {text: "`<a, b, c>`", correct: true}
      - {text: "`<a>, <b>, <c>`", correct: false}
      - {text: "`a, b, c`", correct: false}
      - {text: "`[a, b, c]`", correct: false}
    answer: "`<a, b, c>` : un seul `StringJoiner` reçoit les trois éléments, et met le préfixe et le suffixe autour de l'ensemble."
    check:
      output: "<a, b, c>"
  - key: code-min-max
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Collector<Integer, int[], String> minMax = Collector.of(
              () -> new int[]{Integer.MAX_VALUE, Integer.MIN_VALUE},
              (a, x) -> { a[0] = Math.min(a[0], x); a[1] = Math.max(a[1], x); },
              (a, b) -> { a[0] = Math.min(a[0], b[0]); a[1] = Math.max(a[1], b[1]); return a; },
              a -> a[0] + ".." + a[1]);
      System.out.println(Stream.of(5, 2, 9, 4).collect(minMax));
      ```
    choices:
      - {text: "`2..9`", correct: true}
      - {text: "`9..2`", correct: false}
      - {text: "`5..4`", correct: false}
      - {text: "`[2, 9]`", correct: false}
    answer: "`2..9` : la case 0 garde le minimum, la case 1 le maximum, et le finisher les met en forme."
    check:
      output: "2..9"
  - key: code-parallele
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Collector<Integer, List<Integer>, List<Integer>> versListe = Collector.of(
              ArrayList::new, List::add, (a, b) -> { a.addAll(b); return a; });
      System.out.println(IntStream.rangeClosed(1, 1000).boxed().parallel().collect(versListe).size());
      ```
    choices:
      - {text: "`1000`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Un nombre qui varie, souvent sous 1000", correct: false}
      - {text: "Une `ConcurrentModificationException`", correct: false}
    answer: '`1000` : avec un combineur correct, le résultat parallèle est complet.'
    check:
      output: "1000"
  - key: code-sans-finisher
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Collector<String, StringBuilder, StringBuilder> concat = Collector.of(
              StringBuilder::new, StringBuilder::append, StringBuilder::append);
      System.out.println(Stream.of("x", "y", "z").collect(concat).reverse());
      ```
    choices:
      - {text: "`zyx`", correct: true}
      - {text: "`xyz`", correct: false}
      - {text: "`[z, y, x]`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`zyx` : sans finisher, le résultat est le `StringBuilder` lui-même, que `reverse` retourne. `Collector.of` existe bien à trois fonctions, sans finisher."
    check:
      output: "zyx"
