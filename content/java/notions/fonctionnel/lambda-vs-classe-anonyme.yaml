notion: lambda-vs-classe-anonyme
lesson: |-
  Une lambda ressemble à une classe anonyme qui implémente une interface, mais elles diffèrent sur plusieurs points :

  | | Classe anonyme | Lambda |
  |---|---|---|
  | `this` | l'objet anonyme | l'instance **englobante** |
  | portée | nouvelle : peut masquer des variables | partagée avec la méthode englobante |
  | cible | interface **ou classe** (même abstraite), plusieurs méthodes | interface fonctionnelle seulement |
  | état | peut avoir des champs | aucun champ |
  | compilation | un fichier `Englobante$1.class` | une méthode privée + `invokedynamic` |
  | objet créé | à chaque évaluation | une seule instance si rien n'est capturé |

  ```java
  class Bouton {
      String nom = "ok";
      void brancher() {
          Runnable lambda = () -> System.out.println(this.nom);     // this = le Bouton
          Runnable anonyme = new Runnable() {
              public void run() { System.out.println(this); }       // this = l'objet anonyme
          };
      }
  }
  ```

  - À la compilation, le corps d'une lambda devient une **méthode privée** de la classe englobante. Au premier appel,
    l'instruction **`invokedynamic`** demande à `LambdaMetafactory` de fabriquer la classe qui implémente l'interface.
  - Une lambda **sans capture** est en pratique une instance unique réutilisée ; une lambda qui capture crée un objet à
    chaque évaluation.
  - Il faut encore une classe anonyme pour : étendre une classe abstraite, implémenter plusieurs méthodes, garder un
    état, ou se référencer soi-même (`this`).
  - Les traces de pile d'une lambda montrent des noms synthétiques (`lambda$brancher$0`).

  **Piège classique** : une lambda qui capture `this` sans le voir (en utilisant un champ) retient l'objet englobant.
  Enregistrée comme écouteur longue durée, elle peut causer une fuite mémoire.

  **En entretien** : « Dans une lambda, `this` est l'objet englobant ; elle n'a pas de portée propre ni d'état, et elle
  est compilée en méthode privée appelée via `invokedynamic`, sans fichier .class par lambda. »
cards:
  - key: difference-this-lambda-classe-anonyme
    format: course
    question: Différence entre `this` dans une lambda et dans une classe anonyme ?
    answer: 'Lambda : l''instance englobante ; anonyme : l''objet anonyme lui-même.'
  - key: invokedynamic
    format: course
    question: Comment une lambda est-elle compilée ?
    answer: Son corps devient une méthode privée de la classe englobante, et l'instruction `invokedynamic` fait fabriquer à l'exécution (par `LambdaMetafactory`) l'objet qui implémente l'interface ; il n'y a pas de fichier `.class` par lambda.
  - key: encore-anonyme
    format: course
    question: Quand faut-il encore une classe anonyme plutôt qu'une lambda ?
    answer: Pour étendre une classe (même abstraite), implémenter plusieurs méthodes, garder un état dans des champs ou se référencer soi-même.
  - key: portee
    format: course
    question: Pourquoi une classe anonyme peut-elle déclarer une variable du même nom qu'une variable locale, et pas une lambda ?
    answer: La classe anonyme ouvre une nouvelle portée et peut masquer la variable ; la lambda partage la portée de la méthode englobante.
  - key: vf-this
    format: true-false
    question: Dans une lambda, `this` désigne la lambda elle-même.
    truth: false
    answer: Il désigne l'instance de la classe englobante.
  - key: vf-classe-abstraite
    format: true-false
    question: Une lambda peut implémenter une classe abstraite à une seule méthode abstraite.
    truth: false
    answer: Seulement une interface fonctionnelle ; une classe abstraite demande une classe anonyme.
  - key: vf-fichier
    format: true-false
    question: Chaque lambda produit son propre fichier `.class` à la compilation.
    truth: false
    answer: Contrairement aux classes anonymes (`Englobante$1.class`).
  - key: vf-instance-unique
    format: true-false
    question: Une lambda qui ne capture rien peut être réutilisée comme une instance unique.
    truth: true
    answer: Le JDK actuel crée une seule instance ; une lambda qui capture en crée une par évaluation.
  - key: qcm-anonyme
    format: multiple-choice
    question: Dans quels cas une lambda ne convient-elle pas ?
    choices:
      - text: "Implémenter une interface à deux méthodes abstraites"
        correct: true
      - text: "Étendre `TimerTask` (une classe abstraite)"
        correct: true
      - text: "Implémenter `Comparator`"
        correct: false
      - text: "Implémenter `Runnable`"
        correct: false
    answer: '`Comparator` et `Runnable` sont des interfaces fonctionnelles.'
  - key: qcm-compilation
    format: multiple-choice
    question: Quelle instruction de bytecode crée l'objet d'une lambda ?
    choices:
      - text: "`invokedynamic`"
        correct: true
      - text: "`new`"
        correct: false
      - text: "`invokestatic`"
        correct: false
      - text: "`invokevirtual`"
        correct: false
    answer: La classe d'implémentation est générée à l'exécution par `LambdaMetafactory`.
  - key: qcm-fuite
    format: multiple-choice
    question: Pourquoi une lambda enregistrée comme écouteur global peut-elle provoquer une fuite mémoire ?
    choices:
      - text: "Si elle utilise un champ, elle capture `this` et retient l'objet englobant"
        correct: true
      - text: "Parce que les lambdas ne sont jamais récupérées par le GC"
        correct: false
      - text: "Parce que chaque appel crée une nouvelle classe"
        correct: false
      - text: "Parce qu'elle copie tous les champs de l'objet"
        correct: false
    answer: Tant que l'écouteur est enregistré, l'objet englobant reste accessible.
  - key: qcm-etat
    format: multiple-choice
    question: Un comparateur doit compter ses appels dans un champ. Que choisir ?
    choices:
      - text: "Une classe anonyme (ou nommée) avec un champ"
        correct: true
      - text: "Une lambda avec un champ local"
        correct: false
      - text: "Une lambda qui modifie une variable locale"
        correct: false
      - text: "Une référence de méthode"
        correct: false
    answer: Une lambda n'a pas de champs ; une variable locale capturée ne peut pas être modifiée.
  - key: code-this
    format: code-output
    question: |-
      ```java
      class Bouton {
          String nom = "ok";
          public String toString() { return "Bouton"; }
          void tester() {
              Runnable lambda = () -> System.out.print(this + " ");
              Runnable anonyme = new Runnable() {
                  public void run() { System.out.print(this.getClass().isAnonymousClass()); }
              };
              lambda.run();
              anonyme.run();
          }
      }
      new Bouton().tester();
      ```
    answer: '`Bouton true` : dans la lambda, `this` est le bouton ; dans la classe anonyme, l''objet anonyme.'
    check:
      output: "Bouton true"
  - key: code-masquage
    format: code-output
    question: |-
      ```java
      static String tester() {
          String x = "externe";
          Supplier<String> anonyme = new Supplier<>() {
              public String get() { String x = "interne"; return x; }
          };
          return anonyme.get();
      }
      System.out.println(tester());
      ```
    answer: '`interne` : la classe anonyme a sa propre portée et peut masquer `x`.'
    check:
      output: "interne"
  - key: code-etat
    format: code-output
    question: |-
      ```java
      Supplier<Integer> compteur = new Supplier<>() {
          private int n;
          public Integer get() { return ++n; }
      };
      compteur.get();
      compteur.get();
      System.out.println(compteur.get());
      ```
    answer: '`3` : une classe anonyme peut garder un état dans un champ.'
    check:
      output: "3"
  - key: code-classe-lambda
    format: code-output
    question: |-
      ```java
      Runnable r = () -> {};
      System.out.println(r.getClass().isAnonymousClass() + " " + r.getClass().isSynthetic());
      ```
    answer: '`false true` : la classe d''une lambda est générée (synthétique), pas une classe anonyme du code source.'
    check:
      output: "false true"
