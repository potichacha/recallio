notion: flatmap
lesson: |-
  `map` transforme **un élément en un élément**. `flatMap` transforme **un élément en un stream**, puis **aplatit** tous
  ces streams en un seul.

  ```java
  record Commande(String client, List<String> produits) {}

  commandes.stream().map(Commande::produits);                     // Stream<List<String>> : des listes
  commandes.stream().flatMap(c -> c.produits().stream());         // Stream<String> : tous les produits

  Stream.of("a b", "c").flatMap(l -> Arrays.stream(l.split(" ")));   // a, b, c
  ```

  Usages typiques :
  - parcourir une relation un-à-plusieurs (commandes → lignes, services → employés) ;
  - découper des lignes en mots ;
  - éliminer les `Optional` vides : `ids.stream().map(repo::trouver).flatMap(Optional::stream)` ;
  - produire zéro, un ou plusieurs éléments par élément.

  - `flatMap` existe aussi sur `Optional` (`Optional<Optional<T>>` → `Optional<T>`) et en versions primitives
    (`flatMapToInt`).
  - Depuis Java 16, **`mapMulti`** fait la même chose de façon impérative, sans créer de petits streams :
    `.<String>mapMulti((c, sortie) -> c.produits().forEach(sortie))`.

  **Piège classique** : `map(c -> c.produits().stream())`. On obtient un `Stream<Stream<String>>`, et `toList()` donne une
  liste de streams, pas de produits.

  **En entretien** : « `map` fait 1 → 1, `flatMap` fait 1 → n puis aplatit : c'est l'outil des relations un-à-plusieurs
  et des `Optional` à filtrer. »
cards:
  - key: map-vs-flatmap
    format: course
    question: "Quelle différence entre `map` et `flatMap` sur un stream ?"
    choices:
      - {text: "`map` transforme un élément en un résultat ; `flatMap` en un stream, qu'il aplatit", correct: true}
      - {text: "`map` transforme un élément en un stream ; `flatMap` en un seul résultat, à plat", correct: false}
      - {text: "`flatMap` est la version parallèle de `map`, qui découpe le stream en morceaux", correct: false}
      - {text: "`flatMap` transforme une `Map` en stream de paires, `map` une liste en stream", correct: false}
    answer: "`map` transforme un élément en un résultat (1 → 1) ; `flatMap` transforme un élément en stream (1 → n), puis aplatit tous ces streams en un seul."
  - key: optional-stream
    format: course
    question: "Comment garder seulement les valeurs présentes d'un `Stream<Optional<T>>` ?"
    choices:
      - {text: "`flatMap(Optional::stream)`, qui donne zéro ou un élément par `Optional`", correct: true}
      - {text: "`map(Optional::get)`, qui lit la valeur de chaque `Optional` du stream", correct: false}
      - {text: "`filter(Objects::nonNull)`, qui retire les `Optional` vides du stream", correct: false}
      - {text: "`map(o -> o.orElse(null))`, qui remplace chaque absence par rien", correct: false}
    answer: "`flatMap(Optional::stream)` : un `Optional` vide donne un stream vide, un `Optional` plein un stream d'un élément. `get` lèverait une exception sur un vide, et un `Optional` vide n'est pas `null`."
  - key: zero-un-plusieurs
    format: course
    question: "Combien d'éléments un élément peut-il produire avec `flatMap` ?"
    choices:
      - {text: "Autant qu'on veut, zéro compris, avec un `Stream.empty()`", correct: true}
      - {text: "Exactement un, comme avec `map`, mais sous forme de stream", correct: false}
      - {text: "Au moins un : un stream vide lève une exception", correct: false}
      - {text: "Au plus un : les éléments en trop sont ignorés", correct: false}
    answer: "Autant qu'on veut, y compris zéro (un `Stream.empty()`), ce qui permet de filtrer et transformer en une étape."
  - key: map-multi
    format: course
    question: "Qu'est-ce que `mapMulti` (Java 16) ?"
    choices:
      - {text: "Une alternative impérative à `flatMap` : on passe zéro, un ou plusieurs résultats à un `Consumer`", correct: true}
      - {text: "Une version parallèle de `map`, qui applique plusieurs fonctions en même temps à chaque élément", correct: false}
      - {text: "Un collecteur qui range chaque élément dans plusieurs maps à la fois, une par clé calculée", correct: false}
      - {text: "Une opération qui applique la même fonction plusieurs fois de suite, jusqu'à un point fixe", correct: false}
    answer: "Une alternative impérative à `flatMap` : la fonction reçoit l'élément et un `Consumer` auquel elle passe zéro, un ou plusieurs résultats, sans créer de stream intermédiaire."
  - key: vf-stream-de-streams
    format: true-false
    question: "`liste.stream().map(l -> l.stream())` donne un `Stream<Stream<T>>`."
    truth: true
    answer: Il faut `flatMap` pour aplatir.
  - key: vf-zero
    format: true-false
    question: "`flatMap` peut produire zéro élément pour un élément source."
    truth: true
    answer: En renvoyant un stream vide.
  - key: vf-optional
    format: true-false
    question: "`Optional` a aussi une méthode `flatMap`."
    truth: true
    answer: Pour enchaîner des fonctions qui renvoient elles-mêmes un `Optional`.
  - key: vf-ordre
    format: true-false
    question: "Sur un stream séquentiel ordonné, `flatMap` garde l'ordre : les éléments du premier sous-stream, puis ceux du second."
    truth: true
    answer: Les sous-streams sont concaténés dans l'ordre.
  - key: qcm-mots
    format: multiple-choice
    question: Comment obtenir tous les mots d'une liste de lignes ?
    choices:
      - text: "`lignes.stream().flatMap(l -> Arrays.stream(l.split(\" \")))`"
        correct: true
      - text: "`lignes.stream().map(l -> l.split(\" \"))`"
        correct: false
      - text: "`lignes.stream().map(l -> Arrays.stream(l.split(\" \")))`"
        correct: false
      - text: "`lignes.stream().filter(l -> l.contains(\" \"))`"
        correct: false
    answer: Les deux `map` donnent un stream de tableaux ou de streams.
  - key: qcm-optional
    format: multiple-choice
    question: "`ids.stream().map(repo::trouver)` donne un `Stream<Optional<Client>>`. Lesquelles de ces suites donnent les clients trouvés ?"
    choices:
      - text: "`.flatMap(Optional::stream)`"
        correct: true
      - text: "`.filter(Optional::isPresent).map(Optional::get)`"
        correct: true
      - text: "`.map(Optional::get)`"
        correct: false
      - text: "`.map(Optional::orElseThrow)`"
        correct: false
    answer: Les deux dernières lèvent une exception pour un `Optional` vide.
  - key: qcm-type
    format: multiple-choice
    question: "Quel est le type de `services.stream().flatMap(s -> s.employes().stream())` si `employes()` renvoie `List<Employe>` ?"
    choices:
      - text: "`Stream<Employe>`"
        correct: true
      - text: "`Stream<List<Employe>>`"
        correct: false
      - text: "`List<Employe>`"
        correct: false
      - text: "`Stream<Stream<Employe>>`"
        correct: false
    answer: '`flatMap` aplatit les sous-streams.'
  - key: qcm-primitif
    format: multiple-choice
    question: "Quelle expression additionne toutes les quantités de toutes les lignes de toutes les commandes ?"
    choices:
      - {text: "`commandes.stream().flatMap(c -> c.lignes().stream()).mapToInt(Ligne::quantite).sum()`", correct: true}
      - {text: "`commandes.stream().flatMap(Commande::lignes).mapToInt(Ligne::quantite).sum()`", correct: false}
      - {text: "`commandes.stream().map(Commande::lignes).mapToInt(Ligne::quantite).sum()`", correct: false}
      - {text: "`commandes.stream().mapToInt(Commande::lignes).sum()`", correct: false}
    answer: "Il faut aplatir les lignes avant d'en extraire les quantités, et `flatMap` attend une fonction qui renvoie un stream : `Commande::lignes` renvoie une liste, ce qui ne compile pas."
  - key: trous-flatmap
    format: fill-in
    question: |-
      Complète pour obtenir toutes les lignes de toutes les commandes :
      ```java
      List<Ligne> toutes = commandes.stream().___(c -> c.lignes().stream()).toList();
      ```
    blanks: [[flatMap]]
    answer: '`flatMap` aplatit les listes de lignes.'
  - key: trous-optional
    format: fill-in
    question: |-
      Complète pour ne garder que les clients trouvés :
      ```java
      List<Client> trouves = ids.stream().map(repo::trouver).flatMap(Optional::___).toList();
      ```
    blanks: [[stream]]
    answer: '`Optional.stream()` (Java 9) donne zéro ou un élément.'
  - key: trous-arrays
    format: fill-in
    question: |-
      Complète pour découper les lignes en mots :
      ```java
      lignes.stream().flatMap(l -> ___.stream(l.split(" "))).toList();
      ```
    blanks: [[Arrays]]
    answer: '`Arrays.stream` transforme le tableau en stream.'
  - key: trous-to-int
    format: fill-in
    question: |-
      Complète pour aplatir directement en `IntStream` :
      ```java
      int total = paniers.stream().___(p -> p.quantites().stream().mapToInt(Integer::intValue)).sum();
      ```
    blanks: [[flatMapToInt]]
    answer: La version primitive de `flatMap`.
  - key: code-flatmap
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<List<Integer>> l = List.of(List.of(1, 2), List.of(), List.of(3));
      System.out.println(l.stream().flatMap(List::stream).map(x -> x * 10).toList());
      ```
    choices:
      - {text: "`[10, 20, 30]`", correct: true}
      - {text: "`[[10, 20], [], [30]]`", correct: false}
      - {text: "`[10, 20, null, 30]`", correct: false}
      - {text: "`[1, 2, 3]`", correct: false}
    answer: "`[10, 20, 30]` : la liste vide ne produit aucun élément, et `flatMap` aplatit les deux autres."
    check:
      output: "[10, 20, 30]"
  - key: code-map-imbrique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<List<Integer>> l = List.of(List.of(1, 2), List.of(3));
      System.out.println(l.stream().map(List::size).toList() + " " + l.stream().flatMap(List::stream).count());
      ```
    choices:
      - {text: "`[2, 1] 3`", correct: true}
      - {text: "`[2, 1] 2`", correct: false}
      - {text: "`[1, 2, 3] 3`", correct: false}
      - {text: "`[2, 1] [1, 2, 3]`", correct: false}
    answer: "`[2, 1] 3` : `map` donne une taille par liste ; `flatMap` aplatit, et `count` compte les trois nombres."
    check:
      output: "[2, 1] 3"
  - key: code-optional
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Optional<String>> l = List.of(Optional.of("a"), Optional.empty(), Optional.of("c"));
      System.out.println(l.stream().flatMap(Optional::stream).toList());
      ```
    choices:
      - {text: "`[a, c]`", correct: true}
      - {text: "`[a, null, c]`", correct: false}
      - {text: "`[Optional[a], Optional[c]]`", correct: false}
      - {text: "`[a, Optional.empty, c]`", correct: false}
    answer: "`[a, c]` : un `Optional` vide donne un stream vide, les autres leur valeur."
    check:
      output: "[a, c]"
  - key: code-mots
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Stream.of("le chat", "le chien")
              .flatMap(l -> Arrays.stream(l.split(" ")))
              .distinct()
              .toList());
      ```
    choices:
      - {text: "`[le, chat, chien]`", correct: true}
      - {text: "`[le, chat, le, chien]`", correct: false}
      - {text: "`[chat, chien, le]`", correct: false}
      - {text: "`[le chat, le chien]`", correct: false}
    answer: "`[le, chat, chien]` : `distinct` retire le second `le` et garde l'ordre de première apparition."
    check:
      output: "[le, chat, chien]"
  - key: transforme-liste-commandes-chacune-avec-lignes
    format: scenario
    question: "Tu dois transformer une liste de commandes, chacune avec ses lignes, en une liste unique de produits distincts et triés. Quel pipeline écris-tu ?"
    choices:
      - {text: "`flatMap(c -> c.lignes().stream())`, puis `map(Ligne::produit)`, `distinct()`, `sorted()`, `toList()`", correct: true}
      - {text: "`map(Commande::lignes)`, puis `distinct()`, `sorted()` et `toList()`, sur les listes de lignes", correct: false}
      - {text: "`flatMap(c -> c.lignes().stream())`, puis `map(Ligne::produit)` et `collect(toSet())`, déjà trié", correct: false}
      - {text: "Deux boucles imbriquées qui ajoutent chaque produit à une `ArrayList`, puis `Collections.sort`", correct: false}
    answer: |-
      ```java
      List<String> produits = commandes.stream()
          .flatMap(c -> c.lignes().stream())
          .map(Ligne::produit)
          .distinct()
          .sorted()
          .toList();
      ```
      "`flatMap` aplatit les listes de lignes ; `distinct` utilise equals/hashCode ; `toList()` renvoie une liste non modifiable, ce qui est généralement ce qu'on veut pour un résultat."
  - key: scenario-competences
    format: scenario
    question: "Chaque employé a une liste de compétences. Comment donnes-tu, pour chaque compétence, le nombre d'employés qui l'ont ?"
    choices:
      - {text: "`flatMap` sur les compétences distinctes de chaque employé, puis `groupingBy(identity(), counting())`", correct: true}
      - {text: "`groupingBy(Employe::competences, counting())`, qui compte les employés par liste de compétences", correct: false}
      - {text: "`map(e -> e.competences().size())`, puis `sum()`, pour le total des compétences de chacun", correct: false}
      - {text: "`collect(toMap(Employe::competences, e -> 1L))`, qui associe chaque compétence à un employé", correct: false}
    answer: |-
      ```java
      Map<String, Long> parCompetence = employes.stream()
              .flatMap(e -> e.competences().stream().distinct())
              .collect(Collectors.groupingBy(Function.identity(), TreeMap::new, Collectors.counting()));
      ```
      `flatMap` produit une occurrence par couple (employé, compétence) ; le `distinct` interne évite de compter deux fois un
      employé qui aurait la même compétence en double. `groupingBy` avec `counting` compte, et la `TreeMap` trie par
      compétence. Si je dois garder les employés eux-mêmes, je crée d'abord des paires (un record `Affectation`).
  - key: scenario-optional-chaine
    format: scenario
    question: "Pour une liste d'identifiants, tu charges les utilisateurs (certains n'existent pas), puis leur adresse (facultative), et tu renvoies les villes distinctes. Comment écartes-tu les absences ?"
    choices:
      - {text: "`flatMap(Optional::stream)` après chaque recherche, puis `map(Adresse::ville)` et `toSet()`", correct: true}
      - {text: "`map(Optional::get)` après chaque recherche, puis `map(Adresse::ville)` et `toSet()`", correct: false}
      - {text: "`filter(Objects::nonNull)` après chaque recherche, puis `map(Adresse::ville)` et `toSet()`", correct: false}
      - {text: "Un `try`/`catch` de `NoSuchElementException` autour du pipeline, qui ignore les absences", correct: false}
    answer: |-
      ```java
      Set<String> villes = ids.stream()
              .map(repo::trouver)                  // Stream<Optional<Utilisateur>>
              .flatMap(Optional::stream)           // les utilisateurs trouvés
              .map(Utilisateur::adresse)           // Optional<Adresse>
              .flatMap(Optional::stream)
              .map(Adresse::ville)
              .collect(Collectors.toSet());
      ```
      `flatMap(Optional::stream)` élimine les absences sans `isPresent`/`get`. Pour un grand nombre d'identifiants, je
      chargerais en une requête (`repo.trouverTous(ids)`) plutôt qu'un appel par identifiant.
  - key: scenario-arbre
    format: scenario
    question: "Tu dois lister tous les fichiers d'une arborescence de dossiers en mémoire (un dossier contient des fichiers et des sous-dossiers). Comment, avec des streams ?"
    choices:
      - {text: "Une méthode récursive : `Stream.concat` des fichiers et du `flatMap` récursif des sous-dossiers", correct: true}
      - {text: "Un `map` sur les sous-dossiers, qui donne un `Stream<Stream<Fichier>>` à parcourir ensuite", correct: false}
      - {text: "Un `Stream.iterate` sur le dossier racine, qui descend tout seul dans les sous-dossiers", correct: false}
      - {text: "Un `parallelStream()` sur la racine, qui explore chaque sous-dossier dans son propre thread", correct: false}
    answer: |-
      Avec une méthode récursive qui renvoie un stream :
      ```java
      Stream<Fichier> tousLesFichiers(Dossier d) {
          return Stream.concat(
                  d.fichiers().stream(),
                  d.sousDossiers().stream().flatMap(this::tousLesFichiers));
      }
      ```
      `flatMap` aplatit les fichiers de chaque sous-dossier, récursivement. Le stream reste paresseux : un `findFirst` ou un
      `limit` arrête le parcours tôt. Sur une arborescence très profonde, une pile explicite (`ArrayDeque`) éviterait un
      débordement de pile ; et pour le vrai disque, `Files.walk` fait tout cela.
