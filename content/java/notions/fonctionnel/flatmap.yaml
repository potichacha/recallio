notion: flatmap
lesson: |-
  `map` transforme **un élément en un élément**. `flatMap` transforme **un élément en un stream**, puis **aplatit** tous
  ces streams en un seul.

  ```java
  record Commande(String client, List<String> produits) {}

  commandes.stream().map(Commande::produits);                     // Stream<List<String>> : des listes
  commandes.stream().flatMap(c -> c.produits().stream());         // Stream<String> : tous les produits

  Stream.of("a b", "c").flatMap(l -> Arrays.stream(l.split(" ")));   // a, b, c
  ```

  Usages typiques :
  - parcourir une relation un-à-plusieurs (commandes → lignes, services → employés) ;
  - découper des lignes en mots ;
  - éliminer les `Optional` vides : `ids.stream().map(repo::trouver).flatMap(Optional::stream)` ;
  - produire zéro, un ou plusieurs éléments par élément.

  - `flatMap` existe aussi sur `Optional` (`Optional<Optional<T>>` → `Optional<T>`) et en versions primitives
    (`flatMapToInt`).
  - Depuis Java 16, **`mapMulti`** fait la même chose de façon impérative, sans créer de petits streams :
    `.<String>mapMulti((c, sortie) -> c.produits().forEach(sortie))`.

  **Piège classique** : `map(c -> c.produits().stream())`. On obtient un `Stream<Stream<String>>`, et `toList()` donne une
  liste de streams, pas de produits.

  **En entretien** : « `map` fait 1 → 1, `flatMap` fait 1 → n puis aplatit : c'est l'outil des relations un-à-plusieurs
  et des `Optional` à filtrer. »
cards:
  - key: map-vs-flatmap
    format: course
    question: map vs flatMap ?
    answer: map transforme 1→1 ; flatMap transforme 1→stream et aplatit.
  - key: optional-stream
    format: course
    question: Comment garder seulement les valeurs présentes d'un `Stream<Optional<T>>` ?
    answer: '`flatMap(Optional::stream)` : un `Optional` vide donne un stream vide, un `Optional` plein un stream d''un élément.'
  - key: zero-un-plusieurs
    format: course
    question: Combien d'éléments un élément peut-il produire avec `flatMap` ?
    answer: Autant qu'on veut, y compris zéro (un `Stream.empty()`), ce qui permet de filtrer et transformer en une étape.
  - key: map-multi
    format: course
    question: Qu'est-ce que `mapMulti` (Java 16) ?
    answer: "Une alternative impérative à `flatMap` : la fonction reçoit l'élément et un `Consumer` auquel elle passe zéro, un ou plusieurs résultats, sans créer de stream intermédiaire."
  - key: vf-stream-de-streams
    format: true-false
    question: "`liste.stream().map(l -> l.stream())` donne un `Stream<Stream<T>>`."
    truth: true
    answer: Il faut `flatMap` pour aplatir.
  - key: vf-zero
    format: true-false
    question: "`flatMap` peut produire zéro élément pour un élément source."
    truth: true
    answer: En renvoyant un stream vide.
  - key: vf-optional
    format: true-false
    question: "`Optional` a aussi une méthode `flatMap`."
    truth: true
    answer: Pour enchaîner des fonctions qui renvoient elles-mêmes un `Optional`.
  - key: vf-ordre
    format: true-false
    question: "Sur un stream séquentiel ordonné, `flatMap` garde l'ordre : les éléments du premier sous-stream, puis ceux du second."
    truth: true
    answer: Les sous-streams sont concaténés dans l'ordre.
  - key: qcm-mots
    format: multiple-choice
    question: Comment obtenir tous les mots d'une liste de lignes ?
    choices:
      - text: "`lignes.stream().flatMap(l -> Arrays.stream(l.split(\" \")))`"
        correct: true
      - text: "`lignes.stream().map(l -> l.split(\" \"))`"
        correct: false
      - text: "`lignes.stream().map(l -> Arrays.stream(l.split(\" \")))`"
        correct: false
      - text: "`lignes.stream().filter(l -> l.contains(\" \"))`"
        correct: false
    answer: Les deux `map` donnent un stream de tableaux ou de streams.
  - key: qcm-optional
    format: multiple-choice
    question: "`ids.stream().map(repo::trouver)` donne un `Stream<Optional<Client>>`. Comment obtenir les clients trouvés ?"
    choices:
      - text: "`.flatMap(Optional::stream)`"
        correct: true
      - text: "`.filter(Optional::isPresent).map(Optional::get)`"
        correct: true
      - text: "`.map(Optional::get)`"
        correct: false
      - text: "`.map(Optional::orElseThrow)`"
        correct: false
    answer: Les deux dernières lèvent une exception pour un `Optional` vide.
  - key: qcm-type
    format: multiple-choice
    question: "Quel est le type de `services.stream().flatMap(s -> s.employes().stream())` si `employes()` renvoie `List<Employe>` ?"
    choices:
      - text: "`Stream<Employe>`"
        correct: true
      - text: "`Stream<List<Employe>>`"
        correct: false
      - text: "`List<Employe>`"
        correct: false
      - text: "`Stream<Stream<Employe>>`"
        correct: false
    answer: '`flatMap` aplatit les sous-streams.'
  - key: qcm-primitif
    format: multiple-choice
    question: Comment additionner toutes les quantités de toutes les lignes de toutes les commandes ?
    choices:
      - text: "`commandes.stream().flatMap(c -> c.lignes().stream()).mapToInt(Ligne::quantite).sum()`"
        correct: true
      - text: "`commandes.stream().flatMapToInt(c -> c.lignes().stream().mapToInt(Ligne::quantite)).sum()`"
        correct: true
      - text: "`commandes.stream().map(Commande::lignes).mapToInt(Ligne::quantite).sum()`"
        correct: false
      - text: "`commandes.stream().mapToInt(Commande::lignes).sum()`"
        correct: false
    answer: Il faut aplatir les lignes avant d'en extraire les quantités.
  - key: trous-flatmap
    format: fill-in
    question: |-
      Complétez pour obtenir toutes les lignes de toutes les commandes :
      ```java
      List<Ligne> toutes = commandes.stream().___(c -> c.lignes().stream()).toList();
      ```
    blanks: [[flatMap]]
    answer: '`flatMap` aplatit les listes de lignes.'
  - key: trous-optional
    format: fill-in
    question: |-
      Complétez pour ne garder que les clients trouvés :
      ```java
      List<Client> trouves = ids.stream().map(repo::trouver).flatMap(Optional::___).toList();
      ```
    blanks: [[stream]]
    answer: '`Optional.stream()` (Java 9) donne zéro ou un élément.'
  - key: trous-arrays
    format: fill-in
    question: |-
      Complétez pour découper les lignes en mots :
      ```java
      lignes.stream().flatMap(l -> ___.stream(l.split(" "))).toList();
      ```
    blanks: [[Arrays]]
    answer: '`Arrays.stream` transforme le tableau en stream.'
  - key: trous-to-int
    format: fill-in
    question: |-
      Complétez pour aplatir directement en `IntStream` :
      ```java
      int total = paniers.stream().___(p -> p.quantites().stream().mapToInt(Integer::intValue)).sum();
      ```
    blanks: [[flatMapToInt]]
    answer: La version primitive de `flatMap`.
  - key: code-flatmap
    format: code-output
    question: |-
      ```java
      List<List<Integer>> l = List.of(List.of(1, 2), List.of(), List.of(3));
      System.out.println(l.stream().flatMap(List::stream).map(x -> x * 10).toList());
      ```
    answer: '`[10, 20, 30]`.'
    check:
      output: "[10, 20, 30]"
  - key: code-map-imbrique
    format: code-output
    question: |-
      ```java
      List<List<Integer>> l = List.of(List.of(1, 2), List.of(3));
      System.out.println(l.stream().map(List::size).toList() + " " + l.stream().flatMap(List::stream).count());
      ```
    answer: '`[2, 1] 3`.'
    check:
      output: "[2, 1] 3"
  - key: code-optional
    format: code-output
    question: |-
      ```java
      List<Optional<String>> l = List.of(Optional.of("a"), Optional.empty(), Optional.of("c"));
      System.out.println(l.stream().flatMap(Optional::stream).toList());
      ```
    answer: '`[a, c]`.'
    check:
      output: "[a, c]"
  - key: code-mots
    format: code-output
    question: |-
      ```java
      System.out.println(Stream.of("le chat", "le chien")
              .flatMap(l -> Arrays.stream(l.split(" ")))
              .distinct()
              .toList());
      ```
    answer: '`[le, chat, chien]`.'
    check:
      output: "[le, chat, chien]"
  - key: transforme-liste-commandes-chacune-avec-lignes
    format: scenario
    question: Transforme une liste de commandes, chacune avec ses lignes, en liste unique de produits distincts triés.
    answer: |-
      ```java
      List<String> produits = commandes.stream()
          .flatMap(c -> c.lignes().stream())
          .map(Ligne::produit)
          .distinct()
          .sorted()
          .toList();
      ```
      "`flatMap` aplatit les listes de lignes ; `distinct` utilise equals/hashCode ; `toList()` renvoie une liste non modifiable, ce qui est généralement ce qu'on veut pour un résultat."
  - key: scenario-competences
    format: scenario
    question: Chaque employé a une liste de compétences. Donne, pour chaque compétence, le nombre d'employés qui l'ont.
    answer: |-
      ```java
      Map<String, Long> parCompetence = employes.stream()
              .flatMap(e -> e.competences().stream().distinct())
              .collect(Collectors.groupingBy(Function.identity(), TreeMap::new, Collectors.counting()));
      ```
      `flatMap` produit une occurrence par couple (employé, compétence) ; le `distinct` interne évite de compter deux fois un
      employé qui aurait la même compétence en double. `groupingBy` avec `counting` compte, et la `TreeMap` trie par
      compétence. Si je dois garder les employés eux-mêmes, je crée d'abord des paires (un record `Affectation`).
  - key: scenario-optional-chaine
    format: scenario
    question: Pour une liste d'identifiants, charge les utilisateurs (certains n'existent pas), puis leur adresse (facultative), et renvoie les villes distinctes.
    answer: |-
      ```java
      Set<String> villes = ids.stream()
              .map(repo::trouver)                  // Stream<Optional<Utilisateur>>
              .flatMap(Optional::stream)           // les utilisateurs trouvés
              .map(Utilisateur::adresse)           // Optional<Adresse>
              .flatMap(Optional::stream)
              .map(Adresse::ville)
              .collect(Collectors.toSet());
      ```
      `flatMap(Optional::stream)` élimine les absences sans `isPresent`/`get`. Pour un grand nombre d'identifiants, je
      chargerais en une requête (`repo.trouverTous(ids)`) plutôt qu'un appel par identifiant.
  - key: scenario-arbre
    format: scenario
    question: Tu dois lister tous les fichiers d'une arborescence de dossiers en mémoire (un dossier contient des fichiers et des sous-dossiers). Comment, avec des streams ?
    answer: |-
      Avec une méthode récursive qui renvoie un stream :
      ```java
      Stream<Fichier> tousLesFichiers(Dossier d) {
          return Stream.concat(
                  d.fichiers().stream(),
                  d.sousDossiers().stream().flatMap(this::tousLesFichiers));
      }
      ```
      `flatMap` aplatit les fichiers de chaque sous-dossier, récursivement. Le stream reste paresseux : un `findFirst` ou un
      `limit` arrête le parcours tôt. Sur une arborescence très profonde, une pile explicite (`ArrayDeque`) éviterait un
      débordement de pile ; et pour le vrai disque, `Files.walk` fait tout cela.
