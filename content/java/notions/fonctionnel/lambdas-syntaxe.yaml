notion: lambdas-syntaxe
lesson: |-
  Une **lambda** est une fonction anonyme : `(paramètres) -> corps`. Elle implémente la méthode unique d'une interface
  fonctionnelle.

  ```java
  Runnable r = () -> System.out.println("go");                // aucun paramètre
  Predicate<String> vide = s -> s.isEmpty();                  // un paramètre : parenthèses facultatives
  BinaryOperator<Integer> somme = (a, b) -> a + b;            // plusieurs : parenthèses obligatoires
  Comparator<String> c = (String a, String b) -> a.compareTo(b);   // types explicites (tous ou aucun)
  BiFunction<Integer, Integer, Integer> f = (var a, var b) -> a * b; // var (Java 11), pour y mettre des annotations

  Function<String, Integer> longueur = s -> {                 // corps en bloc
      String t = s.strip();
      return t.length();                                      // return obligatoire dans un bloc
  };
  ```

  - Corps **expression** : sa valeur est le résultat, sans `return` ni accolades.
  - Corps **bloc** : des instructions entre accolades, avec `return` si la méthode renvoie une valeur.
  - Les types des paramètres sont **inférés** du type cible ; on les écrit tous ou aucun.
  - Une lambda n'introduit pas de nouvelle portée pour les noms : un paramètre ne peut pas porter le nom d'une variable
    locale existante.
  - Bonne pratique : des lambdas **courtes** ; au-delà de quelques lignes, une méthode nommée et une référence de méthode
    (`this::calculer`) se lisent mieux.

  **Piège classique** : `x -> { x * 2 }`. Dans un bloc, il faut une instruction : `x -> { return x * 2; }`, ou plus
  simplement `x -> x * 2`.

  **En entretien** : « `(params) -> expression` ou `(params) -> { bloc; }`, types inférés depuis l'interface cible. Je
  garde les lambdas courtes et j'extrais une méthode dès qu'elles grossissent. »
cards:
  - key: syntaxe
    format: course
    question: Quelles sont les deux formes de corps d'une lambda ?
    answer: Une expression (`x -> x * 2`), dont la valeur est le résultat, ou un bloc (`x -> { ...; return y; }`), avec `return` si une valeur est attendue.
  - key: parentheses
    format: course
    question: Quand les parenthèses autour des paramètres sont-elles obligatoires ?
    answer: Sans paramètre (`() -> ...`), avec plusieurs paramètres, ou dès qu'on écrit un type ; elles sont facultatives pour un unique paramètre sans type.
  - key: inference
    format: course
    question: D'où viennent les types des paramètres d'une lambda ?
    answer: De la méthode de l'interface fonctionnelle cible ; on peut les écrire explicitement (ou avec `var`), mais tous ou aucun.
  - key: longueur
    format: course
    question: Que faire d'une lambda de quinze lignes ?
    answer: "L'extraire dans une méthode nommée et passer une référence de méthode : le nom documente l'intention, et la méthode se teste seule."
  - key: vf-return-expression
    format: true-false
    question: "`x -> return x * 2` est une lambda valide."
    truth: false
    answer: '`return` exige un bloc : `x -> { return x * 2; }`, ou `x -> x * 2`.'
  - key: vf-parentheses-un
    format: true-false
    question: "`s -> s.length()` et `(s) -> s.length()` sont équivalentes."
    truth: true
    answer: Les parenthèses sont facultatives pour un seul paramètre sans type.
  - key: vf-melange-types
    format: true-false
    question: "`(String a, b) -> a + b` est valide."
    truth: false
    answer: On type tous les paramètres ou aucun.
  - key: vf-meme-nom
    format: true-false
    question: Un paramètre de lambda peut porter le nom d'une variable locale de la méthode englobante.
    truth: false
    answer: "La lambda partage la portée englobante : c'est une erreur de compilation."
  - key: qcm-valides
    format: multiple-choice
    question: Lesquelles sont des lambdas valides pour un `BinaryOperator<Integer>` ?
    choices:
      - text: "`(a, b) -> a + b`"
        correct: true
      - text: "`(var a, var b) -> a + b`"
        correct: true
      - text: "`a, b -> a + b`"
        correct: false
      - text: "`(a, b) -> { a + b }`"
        correct: false
    answer: Plusieurs paramètres exigent des parenthèses, et un bloc exige une instruction (`return a + b;`).
  - key: qcm-runnable
    format: multiple-choice
    question: Quelle lambda convient à un `Runnable` ?
    choices:
      - text: "`() -> System.out.println(\"ok\")`"
        correct: true
      - text: "`x -> System.out.println(x)`"
        correct: false
      - text: "`() -> { return 1; }`"
        correct: false
      - text: "`-> System.out.println(\"ok\")`"
        correct: false
    answer: '`run()` ne prend rien et ne renvoie rien.'
  - key: qcm-var
    format: multiple-choice
    question: Pourquoi écrire `(var x) -> ...` plutôt que `x -> ...` ?
    choices:
      - text: "Pour pouvoir annoter le paramètre, par exemple `(@NonNull var x) -> ...`"
        correct: true
      - text: "Pour rendre le code plus rapide"
        correct: false
      - text: "Pour autoriser un type différent de celui de l'interface"
        correct: false
      - text: "C'est obligatoire depuis Java 11"
        correct: false
    answer: Une annotation a besoin d'un type, et `var` en tient lieu.
  - key: qcm-bloc
    format: multiple-choice
    question: Quelles lambdas compilent pour une `Function<String, Integer>` ?
    choices:
      - text: "`s -> s.length()`"
        correct: true
      - text: "`s -> { return s.length(); }`"
        correct: true
      - text: "`s -> { s.length(); }`"
        correct: false
      - text: "`() -> 0`"
        correct: false
    answer: Un bloc sans `return` ne renvoie rien ; `Function` attend un paramètre.
  - key: trous-fleche
    format: fill-in
    question: |-
      Complétez la lambda qui double un entier :
      ```java
      UnaryOperator<Integer> doubler = x ___ x * 2;
      ```
    blanks: [["->"]]
    answer: La flèche sépare paramètres et corps.
  - key: trous-return
    format: fill-in
    question: |-
      Complétez le corps en bloc :
      ```java
      Function<String, String> nettoyer = s -> {
          String t = s.strip();
          ___ t.toLowerCase();
      };
      ```
    blanks: [[return]]
    answer: Un bloc qui produit une valeur a besoin de `return`.
  - key: trous-sans-parametre
    format: fill-in
    question: |-
      Complétez la lambda sans paramètre :
      ```java
      Supplier<List<String>> fabrique = ___ -> new ArrayList<>();
      ```
    blanks: [["()"]]
    answer: Des parenthèses vides pour zéro paramètre.
  - key: trous-deux-parametres
    format: fill-in
    question: |-
      Complétez pour comparer deux chaînes par longueur :
      ```java
      Comparator<String> parLongueur = ___ -> Integer.compare(a.length(), b.length());
      ```
    blanks: [["(a, b)", "(a,b)"]]
    answer: Deux paramètres entre parenthèses.
  - key: code-expression
    format: code-output
    question: |-
      ```java
      BinaryOperator<Integer> f = (a, b) -> a * b + 1;
      System.out.println(f.apply(3, 4));
      ```
    answer: '`13`.'
    check:
      output: "13"
  - key: code-bloc
    format: code-output
    question: |-
      ```java
      Function<String, Integer> f = s -> {
          int n = s.strip().length();
          return n * 10;
      };
      System.out.println(f.apply("  ab "));
      ```
    answer: '`20`.'
    check:
      output: "20"
  - key: code-bloc-sans-return
    format: code-output
    question: |-
      ```java
      Function<Integer, Integer> f = x -> { x * 2; };
      ```
    answer: "Ne compile pas : `x * 2;` n'est pas une instruction, et le bloc ne renvoie rien."
    check:
      compiles: false
  - key: code-meme-nom
    format: code-output
    question: |-
      ```java
      void test() {
          String s = "a";
          Predicate<String> p = s -> s.isEmpty();
      }
      ```
    answer: "Ne compile pas : le paramètre `s` masquerait la variable locale `s`."
    check:
      compiles: false
  - key: bug-return
    format: bug-fix
    question: |-
      Corrigez :
      ```java
      Function<Integer, Integer> carre = x -> { x * x };
      ```
    answer: |-
      ```java
      Function<Integer, Integer> carre = x -> x * x;
      ```
      Un bloc exige des instructions et un `return` ; une expression seule suffit ici.
  - key: bug-lambda-longue
    format: bug-fix
    question: |-
      Rendez ce pipeline lisible :
      ```java
      commandes.stream().filter(c -> {
          if (c.statut() != Statut.PAYEE) return false;
          if (c.date().isBefore(debut)) return false;
          return c.lignes().stream().anyMatch(l -> l.quantite() > 10);
      }).toList();
      ```
    answer: |-
      ```java
      commandes.stream().filter(this::estGrossePayeeRecente).toList();

      private boolean estGrossePayeeRecente(Commande c) {
          return c.statut() == Statut.PAYEE
                  && !c.date().isBefore(debut)
                  && c.lignes().stream().anyMatch(l -> l.quantite() > 10);
      }
      ```
      Une méthode nommée dit ce que fait le filtre, et se teste seule.
  - key: bug-types-mixtes
    format: bug-fix
    question: |-
      Corrigez :
      ```java
      BiFunction<String, Integer, String> repeter = (String s, n) -> s.repeat(n);
      ```
    answer: |-
      ```java
      BiFunction<String, Integer, String> repeter = (s, n) -> s.repeat(n);
      ```
      On type tous les paramètres ou aucun ; l'inférence suffit ici.
  - key: bug-parentheses
    format: bug-fix
    question: |-
      Corrigez :
      ```java
      BinaryOperator<Integer> max = a, b -> Math.max(a, b);
      ```
    answer: |-
      ```java
      BinaryOperator<Integer> max = (a, b) -> Math.max(a, b);
      // ou : BinaryOperator<Integer> max = Math::max;
      ```
      Plusieurs paramètres exigent des parenthèses.
