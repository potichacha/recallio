notion: lambdas-syntaxe
lesson: |-
  Une **lambda** est une fonction anonyme : `(paramètres) -> corps`. Elle implémente la méthode unique d'une interface
  fonctionnelle.

  ```java
  Runnable r = () -> System.out.println("go");                // aucun paramètre
  Predicate<String> vide = s -> s.isEmpty();                  // un paramètre : parenthèses facultatives
  BinaryOperator<Integer> somme = (a, b) -> a + b;            // plusieurs : parenthèses obligatoires
  Comparator<String> c = (String a, String b) -> a.compareTo(b);   // types explicites (tous ou aucun)
  BiFunction<Integer, Integer, Integer> f = (var a, var b) -> a * b; // var (Java 11), pour y mettre des annotations

  Function<String, Integer> longueur = s -> {                 // corps en bloc
      String t = s.strip();
      return t.length();                                      // return obligatoire dans un bloc
  };
  ```

  - Corps **expression** : sa valeur est le résultat, sans `return` ni accolades.
  - Corps **bloc** : des instructions entre accolades, avec `return` si la méthode renvoie une valeur.
  - Les types des paramètres sont **inférés** du type cible ; on les écrit tous ou aucun.
  - Une lambda n'introduit pas de nouvelle portée pour les noms : un paramètre ne peut pas porter le nom d'une variable
    locale existante.
  - Bonne pratique : des lambdas **courtes** ; au-delà de quelques lignes, une méthode nommée et une référence de méthode
    (`this::calculer`) se lisent mieux.

  **Piège classique** : `x -> { x * 2 }`. Dans un bloc, il faut une instruction : `x -> { return x * 2; }`, ou plus
  simplement `x -> x * 2`.

  **En entretien** : « `(params) -> expression` ou `(params) -> { bloc; }`, types inférés depuis l'interface cible. Je
  garde les lambdas courtes et j'extrais une méthode dès qu'elles grossissent. »
cards:
  - key: syntaxe
    format: course
    question: "Quelles sont les deux formes de corps d'une lambda ?"
    choices:
      - {text: "Une expression, dont la valeur est le résultat, ou un bloc, avec `return` si besoin", correct: true}
      - {text: "Une expression entre parenthèses, ou un bloc qui renvoie toujours `void`", correct: false}
      - {text: "Un bloc entre accolades, ou une référence de méthode qui le remplace", correct: false}
      - {text: "Une expression sans `return`, ou une expression suivie de `return` en fin de ligne", correct: false}
    answer: Une expression (`x -> x * 2`), dont la valeur est le résultat, ou un bloc (`x -> { ...; return y; }`), avec `return` si une valeur est attendue.
  - key: parentheses
    format: course
    question: "Quand les parenthèses autour des paramètres d'une lambda sont-elles obligatoires ?"
    choices:
      - {text: "Sans paramètre, avec plusieurs paramètres, ou dès qu'on écrit un type", correct: true}
      - {text: "Toujours : `x -> x * 2` ne compile pas sans parenthèses autour de `x`", correct: false}
      - {text: "Seulement avec plusieurs paramètres : `-> 42` suffit sans paramètre", correct: false}
      - {text: "Seulement quand le corps de la lambda est un bloc entre accolades", correct: false}
    answer: Sans paramètre (`() -> ...`), avec plusieurs paramètres, ou dès qu'on écrit un type ; elles sont facultatives pour un unique paramètre sans type.
  - key: inference
    format: course
    question: "D'où viennent les types des paramètres d'une lambda ?"
    choices:
      - {text: "De la méthode de l'interface cible ; on peut les écrire, mais tous ou aucun", correct: true}
      - {text: "Des valeurs passées au premier appel, comme pour un type dynamique", correct: false}
      - {text: "Du corps de la lambda : le compilateur les déduit des opérations faites", correct: false}
      - {text: "Toujours d'`Object`, sauf si on écrit les types un par un", correct: false}
    answer: De la méthode de l'interface fonctionnelle cible ; on peut les écrire explicitement (ou avec `var`), mais tous ou aucun.
  - key: longueur
    format: course
    question: "Que faire d'une lambda de quinze lignes ?"
    choices:
      - {text: "L'extraire dans une méthode nommée, et passer une référence de méthode", correct: true}
      - {text: "La garder telle quelle : une lambda s'exécute plus vite qu'une méthode", correct: false}
      - {text: "La découper en plusieurs lambdas imbriquées, dans le même appel", correct: false}
      - {text: "La transformer en classe anonyme, plus adaptée aux longs traitements", correct: false}
    answer: "L'extraire dans une méthode nommée et passer une référence de méthode : le nom documente l'intention, et la méthode se teste seule."
  - key: vf-return-expression
    format: true-false
    question: "`x -> return x * 2` est une lambda valide."
    truth: false
    answer: '`return` exige un bloc : `x -> { return x * 2; }`, ou `x -> x * 2`.'
  - key: vf-parentheses-un
    format: true-false
    question: "`s -> s.length()` et `(s) -> s.length()` sont équivalentes."
    truth: true
    answer: Les parenthèses sont facultatives pour un seul paramètre sans type.
  - key: vf-melange-types
    format: true-false
    question: "`(String a, b) -> a + b` est valide."
    truth: false
    answer: On type tous les paramètres ou aucun.
  - key: vf-meme-nom
    format: true-false
    question: Un paramètre de lambda peut porter le nom d'une variable locale de la méthode englobante.
    truth: false
    answer: "La lambda partage la portée englobante : c'est une erreur de compilation."
  - key: qcm-valides
    format: multiple-choice
    question: Lesquelles sont des lambdas valides pour un `BinaryOperator<Integer>` ?
    choices:
      - text: "`(a, b) -> a + b`"
        correct: true
      - text: "`(var a, var b) -> a + b`"
        correct: true
      - text: "`a, b -> a + b`"
        correct: false
      - text: "`(a, b) -> { a + b }`"
        correct: false
    answer: Plusieurs paramètres exigent des parenthèses, et un bloc exige une instruction (`return a + b;`).
  - key: qcm-runnable
    format: multiple-choice
    question: Quelle lambda convient à un `Runnable` ?
    choices:
      - text: "`() -> System.out.println(\"ok\")`"
        correct: true
      - text: "`x -> System.out.println(x)`"
        correct: false
      - text: "`() -> { return 1; }`"
        correct: false
      - text: "`-> System.out.println(\"ok\")`"
        correct: false
    answer: '`run()` ne prend rien et ne renvoie rien.'
  - key: qcm-var
    format: multiple-choice
    question: Pourquoi écrire `(var x) -> ...` plutôt que `x -> ...` ?
    choices:
      - text: "Pour pouvoir annoter le paramètre, par exemple `(@NonNull var x) -> ...`"
        correct: true
      - text: "Pour rendre le code plus rapide"
        correct: false
      - text: "Pour autoriser un type différent de celui de l'interface"
        correct: false
      - text: "C'est obligatoire depuis Java 11"
        correct: false
    answer: Une annotation a besoin d'un type, et `var` en tient lieu.
  - key: qcm-bloc
    format: multiple-choice
    question: "Quelle lambda compile pour une `Function<String, Integer>` ?"
    choices:
      - {text: "`s -> s.length()`", correct: true}
      - {text: "`s -> { s.length(); }`", correct: false}
      - {text: "`s -> { s.length() }`", correct: false}
      - {text: "`() -> 0`", correct: false}
    answer: "Une expression seule renvoie sa valeur. Un bloc a besoin d'instructions terminées par `;` et d'un `return` pour renvoyer une valeur ; `Function` attend un paramètre."
  - key: trous-fleche
    format: fill-in
    question: |-
      Complète la lambda qui double un entier :
      ```java
      UnaryOperator<Integer> doubler = x ___ x * 2;
      ```
    blanks: [["->"]]
    answer: La flèche sépare paramètres et corps.
  - key: trous-return
    format: fill-in
    question: |-
      Complète le corps en bloc :
      ```java
      Function<String, String> nettoyer = s -> {
          String t = s.strip();
          ___ t.toLowerCase();
      };
      ```
    blanks: [[return]]
    answer: Un bloc qui produit une valeur a besoin de `return`.
  - key: trous-sans-parametre
    format: fill-in
    question: |-
      Complète la lambda sans paramètre :
      ```java
      Supplier<List<String>> fabrique = ___ -> new ArrayList<>();
      ```
    blanks: [["()"]]
    answer: Des parenthèses vides pour zéro paramètre.
  - key: trous-deux-parametres
    format: fill-in
    question: |-
      Complète pour comparer deux chaînes par longueur :
      ```java
      Comparator<String> parLongueur = ___ -> Integer.compare(a.length(), b.length());
      ```
    blanks: [["(a, b)", "(a,b)"]]
    answer: Deux paramètres entre parenthèses.
  - key: code-expression
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      BinaryOperator<Integer> f = (a, b) -> a * b + 1;
      System.out.println(f.apply(3, 4));
      ```
    choices:
      - {text: "`13`", correct: true}
      - {text: "`15`", correct: false}
      - {text: "`12`", correct: false}
      - {text: "`16`", correct: false}
    answer: "`13` : 3 × 4 + 1, la multiplication passant avant l'addition."
    check:
      output: "13"
  - key: code-bloc
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Function<String, Integer> f = s -> {
          int n = s.strip().length();
          return n * 10;
      };
      System.out.println(f.apply("  ab "));
      ```
    choices:
      - {text: "`20`", correct: true}
      - {text: "`50`", correct: false}
      - {text: "`30`", correct: false}
      - {text: "`2`", correct: false}
    answer: "`20` : `strip` retire les espaces, `\"ab\"` a deux caractères, et le bloc renvoie 2 × 10."
    check:
      output: "20"
  - key: code-bloc-sans-return
    format: code-output
    question: |-
      Que se passe-t-il à la compilation de ce code ?
      ```java
      Function<Integer, Integer> f = x -> { x * 2; };
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Ça compile : la lambda renvoie `x * 2`", correct: false}
      - {text: "Ça compile : la lambda renvoie `null`", correct: false}
      - {text: "Ça compile, avec un avertissement", correct: false}
    answer: "Ne compile pas : `x * 2;` n'est pas une instruction, et le bloc ne renvoie rien. Il faut `x -> x * 2`, ou `{ return x * 2; }`."
    check:
      compiles: false
  - key: code-meme-nom
    format: code-output
    question: |-
      Que se passe-t-il à la compilation de ce code ?
      ```java
      void test() {
          String s = "a";
          Predicate<String> p = s -> s.isEmpty();
      }
      ```
    choices:
      - {text: "Ça ne compile pas : `s` est déjà déclarée", correct: true}
      - {text: "Ça compile : le paramètre `s` masque la variable locale", correct: false}
      - {text: "Ça compile, et la variable `s` vaut ensuite `null`", correct: false}
      - {text: "Ça compile, avec un avertissement sur le masquage", correct: false}
    answer: "Ne compile pas : la lambda partage la portée de la méthode, et son paramètre `s` masquerait la variable locale `s`. Une classe anonyme, elle, ouvrirait une nouvelle portée."
    check:
      compiles: false
  - key: bug-return
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      Function<Integer, Integer> carre = x -> { x * x };
      ```
    choices:
      - {text: "`Function<Integer, Integer> carre = x -> x * x;`", correct: true}
      - {text: "`Function<Integer, Integer> carre = x -> { x * x; };`", correct: false}
      - {text: "`Function<Integer, Integer> carre = (x) -> { x * x };`", correct: false}
      - {text: "`Function<Integer, Integer> carre = x -> return x * x;`", correct: false}
    answer: |-
      ```java
      Function<Integer, Integer> carre = x -> x * x;
      ```
      Un bloc exige des instructions et un `return` ; une expression seule suffit ici.
  - key: bug-lambda-longue
    format: bug-fix
    question: |-
      Comment rendre ce pipeline lisible ?
      ```java
      commandes.stream().filter(c -> {
          if (c.statut() != Statut.PAYEE) return false;
          if (c.date().isBefore(debut)) return false;
          return c.lignes().stream().anyMatch(l -> l.quantite() > 10);
      }).toList();
      ```
    choices:
      - {text: "Extraire la condition dans une méthode nommée : `filter(this::estGrossePayeeRecente)`", correct: true}
      - {text: "Remplacer la lambda par une classe anonyme qui implémente `Predicate<Commande>`", correct: false}
      - {text: "Écrire tout le corps de la lambda sur une seule ligne, sans les `if`", correct: false}
      - {text: "Remplacer le `filter` par une boucle `for`, avec les trois `if` imbriqués", correct: false}
    answer: |-
      ```java
      commandes.stream().filter(this::estGrossePayeeRecente).toList();

      private boolean estGrossePayeeRecente(Commande c) {
          return c.statut() == Statut.PAYEE
                  && !c.date().isBefore(debut)
                  && c.lignes().stream().anyMatch(l -> l.quantite() > 10);
      }
      ```
      Une méthode nommée dit ce que fait le filtre, et se teste seule.
  - key: bug-types-mixtes
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      BiFunction<String, Integer, String> repeter = (String s, n) -> s.repeat(n);
      ```
    choices:
      - {text: "`(s, n) -> s.repeat(n)` : tous les types inférés, ou tous écrits", correct: true}
      - {text: "`(String s, int n) -> s.repeat(n)` : le type primitif écrit", correct: false}
      - {text: "`(String s, var n) -> s.repeat(n)` : `var` pour le second seul", correct: false}
      - {text: "`String s, n -> s.repeat(n)` : sans parenthèses autour", correct: false}
    answer: |-
      ```java
      BiFunction<String, Integer, String> repeter = (s, n) -> s.repeat(n);
      ```
      On type tous les paramètres ou aucun ; l'inférence suffit ici. Un type écrit doit être exactement celui de
      l'interface : `int` à la place d'`Integer` ne compile pas.
  - key: bug-parentheses
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      BinaryOperator<Integer> max = a, b -> Math.max(a, b);
      ```
    choices:
      - {text: "`BinaryOperator<Integer> max = (a, b) -> Math.max(a, b);`", correct: true}
      - {text: "`BinaryOperator<Integer> max = a, b -> { Math.max(a, b); };`", correct: false}
      - {text: "`BinaryOperator<Integer> max = [a, b] -> Math.max(a, b);`", correct: false}
      - {text: "`BinaryOperator<Integer> max = (a, b) => Math.max(a, b);`", correct: false}
    answer: |-
      ```java
      BinaryOperator<Integer> max = (a, b) -> Math.max(a, b);
      // ou : BinaryOperator<Integer> max = Math::max;
      ```
      Plusieurs paramètres exigent des parenthèses.
