notion: interfaces-fonctionnelles
lesson: |-
  Une **interface fonctionnelle** a **une seule méthode abstraite** (SAM, *Single Abstract Method*). C'est le type
  qu'attend une lambda ou une référence de méthode : la lambda en fournit l'implémentation.

  ```java
  @FunctionalInterface
  interface Validateur {
      boolean valider(String saisie);              // l'unique méthode abstraite

      default Validateur et(Validateur autre) {    // les méthodes default ne comptent pas
          return s -> valider(s) && autre.valider(s);
      }

      static Validateur nonVide() {                // les méthodes static non plus
          return s -> !s.isBlank();
      }
  }

  Validateur court = s -> s.length() <= 20;
  ```

  - Les méthodes **`default`** et **`static`** ne comptent pas, ni les méthodes publiques d'`Object` redéclarées
    (`equals`, `toString`) : `Comparator` déclare `equals` et reste fonctionnelle.
  - **`@FunctionalInterface`** est facultative, mais le compilateur **vérifie** alors qu'il y a exactement une méthode
    abstraite : on ne casse pas l'interface par mégarde en ajoutant une méthode.
  - Le JDK en contient beaucoup : `Runnable`, `Callable`, `Comparator`, et tout `java.util.function` (`Function`,
    `Predicate`...). On en écrit une soi-même quand un **nom métier** rend le code plus clair, ou quand il faut une
    exception vérifiée dans la signature.
  - Une même lambda peut avoir plusieurs types : `() -> "x"` est un `Supplier<String>` ou un `Callable<String>` selon
    le contexte. C'est le **type cible** qui décide.

  **Piège classique** : ajouter une seconde méthode abstraite à une interface utilisée par des lambdas. Toutes les lambdas
  cassent ; avec `@FunctionalInterface`, l'erreur apparaît à l'endroit de l'interface.

  **En entretien** : « Une seule méthode abstraite ; les `default` et `static` ne comptent pas. `@FunctionalInterface` le
  fait vérifier par le compilateur. »
cards:
  - key: interface-fonctionnelle
    format: course
    question: "Qu'est-ce qu'une interface fonctionnelle ?"
    choices:
      - {text: "Une interface à une seule méthode abstraite, qu'une lambda peut implémenter", correct: true}
      - {text: "Une interface sans méthode abstraite, faite seulement de méthodes `default`", correct: false}
      - {text: "Une interface du paquet `java.util.function`, et seulement celles-là", correct: false}
      - {text: "Toute interface annotée `@FunctionalInterface`, quel que soit son contenu", correct: false}
    answer: "Une interface à une seule méthode abstraite, implémentable par lambda. L'annotation est facultative, et `Runnable` ou `Comparator` en sont, hors de `java.util.function`."
  - key: annotation
    format: course
    question: "À quoi sert `@FunctionalInterface` ?"
    choices:
      - {text: "À faire vérifier qu'il n'y a qu'une méthode abstraite ; elle reste facultative", correct: true}
      - {text: "À permettre aux lambdas d'implémenter l'interface, ce qu'elles ne font pas sans elle", correct: false}
      - {text: "À générer une classe d'implémentation à la compilation, comme un proxy", correct: false}
      - {text: "À interdire les méthodes `default` dans l'interface, pour qu'elle reste simple", correct: false}
    answer: "Elle documente l'intention et fait vérifier par le compilateur que l'interface a exactement une méthode abstraite. Elle est facultative : une lambda implémente toute interface à une seule méthode abstraite."
  - key: default-static
    format: course
    question: "Une interface fonctionnelle peut-elle avoir des méthodes `default` et `static` ?"
    choices:
      - {text: "Oui, autant qu'on veut : seules les méthodes abstraites comptent", correct: true}
      - {text: "Non : une seule méthode en tout, sinon elle n'est plus fonctionnelle", correct: false}
      - {text: "Des méthodes `static` oui, mais aucune méthode `default`", correct: false}
      - {text: "Une seule méthode `default` au plus, en plus de l'abstraite", correct: false}
    answer: Oui, autant qu'on veut ; seules les méthodes abstraites comptent (et les méthodes publiques d'`Object` redéclarées ne comptent pas non plus).
  - key: type-cible
    format: course
    question: "Comment le compilateur sait-il quelle interface une lambda implémente ?"
    choices:
      - {text: "Par le type cible : le type attendu là où la lambda apparaît (variable, paramètre, retour)", correct: true}
      - {text: "Par le nom des méthodes appelées dans le corps de la lambda, qu'il rapproche des interfaces", correct: false}
      - {text: "Par une annotation sur la lambda, obligatoire dès que plusieurs interfaces conviendraient", correct: false}
      - {text: "Par le nombre de paramètres de la lambda : chacun correspond à une seule interface du JDK", correct: false}
    answer: Par le type cible, c'est-à-dire le type attendu là où la lambda apparaît (variable, paramètre, retour) ; la même lambda peut implémenter des interfaces différentes selon le contexte.
  - key: vf-default
    format: true-false
    question: Une interface fonctionnelle ne peut pas avoir de méthode `default`.
    truth: false
    answer: Elle peut en avoir plusieurs ; une seule méthode abstraite est exigée.
  - key: vf-annotation-obligatoire
    format: true-false
    question: Sans `@FunctionalInterface`, une interface à une méthode abstraite ne peut pas recevoir de lambda.
    truth: false
    answer: L'annotation est facultative ; elle ne fait qu'ajouter une vérification.
  - key: vf-comparator
    format: true-false
    question: "`Comparator` est une interface fonctionnelle, bien qu'elle déclare `compare` et `equals`."
    truth: true
    answer: '`equals` est une méthode publique d''`Object` : elle ne compte pas.'
  - key: vf-runnable
    format: true-false
    question: "`Runnable` est une interface fonctionnelle."
    truth: true
    answer: Sa seule méthode abstraite est `run()`.
  - key: qcm-fonctionnelles
    format: multiple-choice
    question: Lesquelles sont des interfaces fonctionnelles ?
    choices:
      - text: "`Runnable`"
        correct: true
      - text: "`Comparator<T>`"
        correct: true
      - text: "`List<E>`"
        correct: false
      - text: "`Iterator<E>`"
        correct: false
    answer: '`List` a de nombreuses méthodes abstraites ; `Iterator` en a deux (`hasNext`, `next`).'
  - key: qcm-compte
    format: multiple-choice
    question: "Laquelle de ces méthodes compte dans le décompte des méthodes abstraites d'une interface fonctionnelle ?"
    choices:
      - {text: "Une méthode abstraite héritée d'une super-interface", correct: true}
      - {text: "Une méthode `default` déclarée dans l'interface", correct: false}
      - {text: "Une méthode `static` déclarée dans l'interface", correct: false}
      - {text: "Une redéclaration abstraite de `equals(Object)`", correct: false}
    answer: "Une méthode abstraite héritée compte. Les méthodes `default` et `static`, et les méthodes publiques d'`Object` redéclarées, ne comptent pas."
  - key: qcm-propre
    format: multiple-choice
    question: "Dans quel cas écrire sa propre interface fonctionnelle plutôt qu'utiliser `java.util.function` ?"
    choices:
      - {text: "Quand la méthode doit déclarer une exception vérifiée", correct: true}
      - {text: "Toujours : les interfaces du JDK sont déconseillées", correct: false}
      - {text: "Pour pouvoir utiliser une lambda, ce que le JDK ne permet pas seul", correct: false}
      - {text: "Quand la méthode prend un paramètre et renvoie un booléen", correct: false}
    answer: "`Function` ou `Predicate` ne déclarent aucune exception vérifiée : une interface maison le peut. Un nom métier qui rend le code plus clair est l'autre bonne raison ; tester un paramètre, `Predicate` le fait déjà."
  - key: qcm-erreur
    format: multiple-choice
    question: "Que se passe-t-il si l'on ajoute une seconde méthode abstraite à une interface annotée `@FunctionalInterface` ?"
    choices:
      - text: "Une erreur de compilation sur l'interface"
        correct: true
      - text: "Une erreur à l'exécution de la lambda"
        correct: false
      - text: "La lambda implémente la première méthode"
        correct: false
      - text: "Rien"
        correct: false
    answer: C'est tout l'intérêt de l'annotation.
  - key: trous-annotation
    format: fill-in
    question: |-
      Complète pour faire vérifier l'interface par le compilateur :
      ```java
      @___
      interface Regle {
          boolean respectee(Commande c);
      }
      ```
    blanks: [[FunctionalInterface]]
    answer: L'annotation garantit une seule méthode abstraite.
  - key: trous-lambda
    format: fill-in
    question: |-
      Complète l'appel de la méthode de l'interface :
      ```java
      @FunctionalInterface
      interface Remise { double appliquer(double prix); }

      Remise soldes = prix -> prix * 0.8;
      double prixFinal = soldes.___(100);
      ```
    blanks: [[appliquer]]
    answer: Une lambda s'appelle par la méthode de son interface.
  - key: trous-default
    format: fill-in
    question: |-
      Complète pour ajouter une méthode concrète sans casser l'interface fonctionnelle :
      ```java
      @FunctionalInterface
      interface Regle {
          boolean respectee(Commande c);

          ___ Regle inverse() { return c -> !respectee(c); }
      }
      ```
    blanks: [[default]]
    answer: Une méthode `default` ne compte pas comme méthode abstraite.
  - key: trous-runnable
    format: fill-in
    question: |-
      Complète avec l'interface fonctionnelle du JDK sans paramètre ni résultat :
      ```java
      ___ tache = () -> System.out.println("fini");
      new Thread(tache).start();
      ```
    blanks: [[Runnable]]
    answer: '`Runnable.run()` ne prend rien et ne renvoie rien.'
  - key: code-propre
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      @FunctionalInterface
      interface Operation {
          int appliquer(int a, int b);
          default Operation puisDoubler() { return (a, b) -> appliquer(a, b) * 2; }
      }
      Operation somme = (a, b) -> a + b;
      System.out.println(somme.appliquer(2, 3) + " " + somme.puisDoubler().appliquer(2, 3));
      ```
    choices:
      - {text: "`5 10`", correct: true}
      - {text: "`5 5`", correct: false}
      - {text: "`10 10`", correct: false}
      - {text: "`5 7`", correct: false}
    answer: "`5 10` : la méthode `default` renvoie une nouvelle opération qui double le résultat de `somme`."
    check:
      output: "5 10"
  - key: code-type-cible
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Supplier<String> s = () -> "a";
      Callable<String> c = () -> "b";
      System.out.println(s.get() + c.call());
      ```
    choices:
      - {text: "`ab`", correct: true}
      - {text: "`ba`", correct: false}
      - {text: "`aa`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`ab` : deux lambdas de même forme, deux interfaces cibles. Le type de la variable décide de l'interface implémentée."
    check:
      output: "ab"
  - key: code-deux-methodes
    format: code-output
    question: |-
      Que se passe-t-il à la compilation de ce code ?
      ```java
      @FunctionalInterface
      interface Convertisseur {
          String convertir(int x);
          String inverser(String s);
      }
      ```
    choices:
      - {text: "Ça ne compile pas : deux méthodes abstraites", correct: true}
      - {text: "Ça compile : l'annotation n'est qu'une documentation", correct: false}
      - {text: "Ça compile, mais aucune lambda ne pourra l'implémenter", correct: false}
      - {text: "Ça compile, avec un simple avertissement", correct: false}
    answer: "Ne compile pas : une interface annotée `@FunctionalInterface` ne peut avoir qu'une méthode abstraite."
    check:
      compiles: false
  - key: code-static
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      @FunctionalInterface
      interface Filtre {
          boolean garder(String s);
          static Filtre nonVide() { return s -> !s.isEmpty(); }
      }
      System.out.println(Filtre.nonVide().garder("") + " " + Filtre.nonVide().garder("x"));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true false`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`false true` : une méthode `static` ne compte pas comme méthode abstraite, l'interface reste fonctionnelle."
    check:
      output: "false true"
  - key: bug-classe-anonyme
    format: bug-fix
    question: |-
      Comment simplifier cette classe anonyme ?
      ```java
      Comparator<Produit> parPrix = new Comparator<Produit>() {
          @Override
          public int compare(Produit a, Produit b) {
              return Double.compare(a.prix(), b.prix());
          }
      };
      ```
    choices:
      - {text: "`Comparator<Produit> parPrix = Comparator.comparingDouble(Produit::prix);`", correct: true}
      - {text: "`Comparator<Produit> parPrix = (a, b) -> a.prix() - b.prix();`", correct: false}
      - {text: "`Comparator<Produit> parPrix = Comparator.naturalOrder();`", correct: false}
      - {text: "`Comparator<Produit> parPrix = Produit::prix;`", correct: false}
    answer: |-
      ```java
      Comparator<Produit> parPrix = Comparator.comparingDouble(Produit::prix);
      // ou : (a, b) -> Double.compare(a.prix(), b.prix())
      ```
      `Comparator` est une interface fonctionnelle : une lambda ou une méthode de fabrique remplace la classe anonyme.
  - key: bug-seconde-methode
    format: bug-fix
    question: |-
      Après cet ajout, toutes les lambdas `Regle` du projet ne compilent plus. Quelle correction est la bonne ?
      ```java
      interface Regle {
          boolean respectee(Commande c);
          String description();          // ajouté
      }
      ```
    choices:
      - {text: "Faire de `description` une méthode `default`, et annoter l'interface `@FunctionalInterface`", correct: true}
      - {text: "Annoter l'interface `@FunctionalInterface`, pour que les lambdas l'acceptent de nouveau", correct: false}
      - {text: "Déclarer `description` en `static`, pour que chaque règle ait sa propre description", correct: false}
      - {text: "Remplacer chaque lambda par une référence de méthode, qui choisit seule la bonne méthode", correct: false}
    answer: |-
      ```java
      @FunctionalInterface
      interface Regle {
          boolean respectee(Commande c);
          default String description() { return "règle"; }
      }
      ```
      Une seconde méthode abstraite retire le caractère fonctionnel. Une méthode `default` ajoute le comportement sans le
      casser, et l'annotation protège l'interface à l'avenir.
  - key: bug-reinventer
    format: bug-fix
    question: |-
      Cette interface ne sert qu'à filtrer des listes. Comment la simplifier ?
      ```java
      interface FiltreUtilisateur {
          boolean test(Utilisateur u);
      }
      ```
    choices:
      - {text: "La remplacer par `Predicate<Utilisateur>`, qui a déjà `and`, `or` et `negate`", correct: true}
      - {text: "La remplacer par `Function<Utilisateur, Boolean>`, plus générale et réutilisable", correct: false}
      - {text: "La remplacer par `Supplier<Boolean>`, qui renvoie le résultat du test", correct: false}
      - {text: "L'annoter `@FunctionalInterface`, sans quoi `filter` refuse ses lambdas", correct: false}
    answer: |-
      ```java
      Predicate<Utilisateur> filtre = Utilisateur::actif;
      ```
      `Predicate<T>` existe déjà, avec `and`, `or` et `negate`, et il est accepté par `filter` et `removeIf`. Une
      interface maison n'apporte rien ici, faute de nom métier ou d'exception vérifiée.
  - key: bug-exception-verifiee
    format: bug-fix
    question: |-
      Cette lambda ne compile pas, car `Files.readString` déclare `IOException`. Quelle correction est la bonne ?
      ```java
      Function<Path, String> lecteur = chemin -> Files.readString(chemin);
      ```
    choices:
      - {text: "Une interface maison, dont la méthode déclare `throws IOException`", correct: true}
      - {text: "Ajouter `throws IOException` à la méthode qui crée la lambda", correct: false}
      - {text: "Remplacer la lambda par la référence de méthode `Files::readString`", correct: false}
      - {text: "Annoter la variable `@SuppressWarnings(\"unchecked\")`", correct: false}
    answer: |-
      ```java
      @FunctionalInterface
      interface Lecteur {
          String lire(Path chemin) throws IOException;
      }
      Lecteur lecteur = Files::readString;
      ```
      `Function.apply` ne déclare aucune exception vérifiée. Une interface qui la déclare, ou un try/catch qui la
      transforme en `UncheckedIOException`, résout le problème.
