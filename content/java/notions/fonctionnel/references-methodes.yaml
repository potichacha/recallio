notion: references-methodes
lesson: |-
  Une **référence de méthode** est un raccourci pour une lambda qui ne fait qu'appeler une méthode existante :
  `Classe::methode` ou `objet::methode`.

  | Sorte | Écriture | Lambda équivalente |
  |---|---|---|
  | méthode statique | `Integer::parseInt` | `s -> Integer.parseInt(s)` |
  | méthode d'un objet donné | `System.out::println` | `x -> System.out.println(x)` |
  | méthode d'instance d'un objet quelconque | `String::toUpperCase` | `s -> s.toUpperCase()` |
  | constructeur | `ArrayList::new` | `() -> new ArrayList<>()` |
  | constructeur de tableau | `String[]::new` | `n -> new String[n]` |

  ```java
  noms.stream().map(String::strip).filter(Predicate.not(String::isEmpty)).forEach(System.out::println);
  List<Utilisateur> u = ids.stream().map(this::charger).toList();
  String[] tableau = noms.stream().toArray(String[]::new);
  ```

  - Pour `String::toUpperCase` (« objet quelconque »), le **premier paramètre** de la fonction devient l'objet sur
    lequel la méthode est appelée : `BiFunction<String, Integer, String> f = String::repeat` appelle `a.repeat(b)`.
  - Pour `objet::methode`, l'objet est évalué **une fois**, à la création de la référence (s'il est `null`, la
    `NullPointerException` survient immédiatement).
  - La surcharge est résolue selon le **type cible** : `Integer::toString` peut être ambigu.
  - Une référence est plus lisible quand le nom de la méthode dit tout ; une lambda reste préférable quand elle ajoute un
    argument ou une petite logique (`s -> s.substring(1)`).

  **Piège classique** : `Predicate<String> p = !String::isEmpty;`. Une référence ne se nie pas : on écrit
  `Predicate.not(String::isEmpty)`.

  **En entretien** : « Quatre sortes : statique, objet lié, objet arbitraire (le premier argument devient le receveur) et
  constructeur. Je les utilise quand le nom de la méthode suffit. »
cards:
  - key: quatre-sortes
    format: course
    question: Quelles sont les quatre sortes de références de méthode ?
    answer: Statique (`Integer::parseInt`), d'instance d'un objet donné (`System.out::println`), d'instance d'un objet quelconque du type (`String::length`) et de constructeur (`ArrayList::new`).
  - key: objet-quelconque
    format: course
    question: Dans `Function<String, Integer> f = String::length`, sur quel objet `length` est-elle appelée ?
    answer: "Sur l'argument de la fonction : le premier paramètre devient l'objet receveur, `f.apply(s)` appelle `s.length()`."
  - key: evaluation-objet
    format: course
    question: Quand l'objet de `objet::methode` est-il évalué ?
    answer: Une seule fois, à la création de la référence ; s'il est `null`, la `NullPointerException` est levée à ce moment-là.
  - key: quand-lambda
    format: course
    question: Quand préférer une lambda à une référence de méthode ?
    answer: Quand il faut ajouter un argument ou une petite logique (`s -> s.substring(1)`), ou quand la référence serait ambiguë ; la référence quand le nom de la méthode dit tout.
  - key: vf-constructeur
    format: true-false
    question: "`ArrayList::new` peut servir de `Supplier<List<String>>`."
    truth: true
    answer: Elle appelle le constructeur sans argument.
  - key: vf-negation
    format: true-false
    question: "`!String::isEmpty` est une référence de méthode valide."
    truth: false
    answer: On écrit `Predicate.not(String::isEmpty)`.
  - key: vf-premier-receveur
    format: true-false
    question: "`BiFunction<String, String, Boolean> f = String::startsWith;` appelle `a.startsWith(b)`."
    truth: true
    answer: Le premier argument est le receveur, le second l'argument de la méthode.
  - key: vf-null
    format: true-false
    question: "`Supplier<Integer> s = chaineNulle::length;` ne lève une exception qu'à l'appel de `s.get()`."
    truth: false
    answer: "L'objet est évalué à la création de la référence : la `NullPointerException` survient tout de suite."
  - key: qcm-equivalence
    format: multiple-choice
    question: Quelles équivalences sont justes ?
    choices:
      - text: "`Integer::parseInt` ≡ `s -> Integer.parseInt(s)`"
        correct: true
      - text: "`String::toLowerCase` ≡ `s -> s.toLowerCase()`"
        correct: true
      - text: "`System.out::println` ≡ `() -> System.out.println()`"
        correct: false
      - text: "`ArrayList::new` ≡ `list -> new ArrayList<>(list)`, toujours"
        correct: false
    answer: '`println` reçoit l''élément ; `ArrayList::new` dépend du type cible (sans argument pour un `Supplier`).'
  - key: qcm-tableau
    format: multiple-choice
    question: Comment obtenir un `String[]` depuis un `Stream<String>` ?
    choices:
      - text: "`stream.toArray(String[]::new)`"
        correct: true
      - text: "`stream.toArray()`, qui renvoie un `Object[]`"
        correct: false
      - text: "`stream.toArray(String::new)`"
        correct: false
      - text: "`(String[]) stream.toList()`"
        correct: false
    answer: '`String[]::new` est un `IntFunction<String[]>`.'
  - key: qcm-this
    format: multiple-choice
    question: "Dans une méthode d'instance, que désigne `this::valider` ?"
    choices:
      - text: "La méthode `valider` de l'objet courant"
        correct: true
      - text: "Une méthode statique `valider`"
        correct: false
      - text: "Un nouvel objet à chaque appel"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
    answer: C'est une référence liée à l'instance courante.
  - key: qcm-not
    format: multiple-choice
    question: Comment garder les chaînes non vides d'un stream avec une référence de méthode ?
    choices:
      - text: "`filter(Predicate.not(String::isBlank))`"
        correct: true
      - text: "`filter(!String::isBlank)`"
        correct: false
      - text: "`filter(String::isBlank.negate())`"
        correct: false
      - text: "`filter(String::isNotBlank)`"
        correct: false
    answer: '`Predicate.not` (Java 11) nie une référence de méthode.'
  - key: trous-statique
    format: fill-in
    question: |-
      Complétez pour convertir des chaînes en entiers :
      ```java
      List<Integer> nombres = saisies.stream().map(Integer::___).toList();
      ```
    blanks: [[parseInt, valueOf]]
    answer: Une référence vers une méthode statique.
  - key: trous-println
    format: fill-in
    question: |-
      Complétez :
      ```java
      noms.forEach(System.out___println);
      ```
    blanks: [["::"]]
    answer: Le séparateur des références de méthode.
  - key: trous-constructeur
    format: fill-in
    question: |-
      Complétez pour construire un `Client` par nom :
      ```java
      List<Client> clients = noms.stream().map(Client::___).toList();
      ```
    blanks: [[new]]
    answer: Une référence de constructeur (ici `Client(String)`).
  - key: trous-not
    format: fill-in
    question: |-
      Complétez pour garder les lignes non vides :
      ```java
      lignes.stream().filter(Predicate.___(String::isBlank)).toList();
      ```
    blanks: [[not]]
    answer: '`Predicate.not` inverse un prédicat.'
  - key: code-receveur
    format: code-output
    question: |-
      ```java
      BiFunction<String, Integer, String> f = String::repeat;
      Function<String, Integer> g = String::length;
      System.out.println(f.apply("ab", 3) + g.apply("xyz"));
      ```
    answer: '`ababab3`.'
    check:
      output: "ababab3"
  - key: code-constructeur
    format: code-output
    question: |-
      ```java
      Supplier<List<String>> s = ArrayList::new;
      Function<Integer, int[]> tableau = int[]::new;
      List<String> l = s.get();
      l.add("x");
      System.out.println(l + " " + tableau.apply(3).length);
      ```
    answer: '`[x] 3`.'
    check:
      output: "[x] 3"
  - key: code-objet-evalue
    format: code-output
    question: |-
      ```java
      StringBuilder sb = new StringBuilder("a");
      Supplier<String> lire = sb::toString;
      sb.append("b");
      System.out.println(lire.get());
      ```
    answer: '`ab` : la référence pointe vers le même objet, modifié entre-temps.'
    check:
      output: "ab"
  - key: code-null
    format: code-output
    question: |-
      ```java
      String s = null;
      Supplier<Integer> longueur = s::length;
      System.out.println("créé");
      ```
    answer: "Une `NullPointerException` avant tout affichage : l'objet est évalué à la création de la référence."
    check:
      throws: NullPointerException
  - key: bug-lambda-inutile
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      noms.stream().map(n -> n.toUpperCase()).forEach(n -> System.out.println(n));
      ```
    answer: |-
      ```java
      noms.stream().map(String::toUpperCase).forEach(System.out::println);
      ```
      Une lambda qui ne fait qu'appeler une méthode se remplace par sa référence.
  - key: bug-negation
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      lignes.stream().filter(!String::isBlank).toList();
      ```
    answer: |-
      ```java
      lignes.stream().filter(Predicate.not(String::isBlank)).toList();
      ```
      Une référence de méthode n'a pas de type tant qu'elle n'a pas de cible : l'opérateur `!` ne s'y applique pas.
  - key: bug-toarray
    format: bug-fix
    question: |-
      Ce code lève une `ClassCastException` :
      ```java
      String[] t = (String[]) noms.stream().toArray();
      ```
    answer: |-
      ```java
      String[] t = noms.stream().toArray(String[]::new);
      ```
      `toArray()` sans argument crée un `Object[]`, qu'on ne peut pas convertir en `String[]`.
  - key: bug-reference-forcee
    format: bug-fix
    question: |-
      Rendez lisible :
      ```java
      codes.stream().map(this::extraireApresLePremierCaractere).toList();

      private String extraireApresLePremierCaractere(String s) { return s.substring(1); }
      ```
    answer: |-
      ```java
      codes.stream().map(s -> s.substring(1)).toList();
      ```
      Une méthode créée seulement pour obtenir une référence alourdit le code ; une lambda courte qui ajoute un argument se
      lit directement.
