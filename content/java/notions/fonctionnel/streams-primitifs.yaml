notion: streams-primitifs
lesson: |-
  `IntStream`, `LongStream` et `DoubleStream` manipulent des **primitifs**, sans boxing, et ajoutent des opérations
  numériques.

  ```java
  IntStream.range(0, 5);                 // 0, 1, 2, 3, 4   (borne haute exclue)
  IntStream.rangeClosed(1, 5);           // 1 à 5 inclus
  int total = commandes.stream().mapToInt(Commande::quantite).sum();
  OptionalDouble moyenne = notes.stream().mapToInt(Integer::intValue).average();
  IntSummaryStatistics stats = IntStream.of(4, 8, 6).summaryStatistics();   // min, max, moyenne, somme, nombre
  ```

  - On y entre avec `mapToInt`, `mapToLong`, `mapToDouble` (ou `IntStream.of`, `Arrays.stream(int[])`,
    `String.chars()`).
  - On en sort avec **`boxed()`** (vers `Stream<Integer>`) ou **`mapToObj`** (vers des objets).
  - `sum()` renvoie un nombre (0 si vide) ; `average()`, `min()` et `max()` renvoient un **`OptionalInt`** /
    **`OptionalDouble`**, vides si le stream l'est.
  - `range` remplace la boucle `for` à index : `IntStream.range(0, liste.size()).filter(i -> ...)`.
  - `sum()` sur un `IntStream` **déborde** silencieusement : pour de grands totaux, `mapToLong` ou `asLongStream()`.

  **Piège classique** : `IntStream.range(1, 10)` pour « de 1 à 10 ». La borne haute est exclue : on obtient 1 à 9 ;
  `rangeClosed(1, 10)` inclut 10.

  **En entretien** : « Les streams primitifs évitent le boxing et offrent `sum`, `average`, `summaryStatistics` ; `range`
  exclut la borne haute, `rangeClosed` l'inclut ; `boxed` ramène vers un `Stream` d'objets. »
cards:
  - key: eviter-boxing-stream-numerique
    format: course
    question: Comment éviter le boxing dans un stream numérique ?
    answer: IntStream/LongStream/DoubleStream via mapToInt, etc.
  - key: renvoie-intstream-average
    format: course
    question: Que renvoie `IntStream.average()` ?
    answer: Un OptionalDouble (vide si le stream est vide).
  - key: range
    format: course
    question: Quelle différence entre `IntStream.range(a, b)` et `rangeClosed(a, b)` ?
    answer: '`range` exclut la borne haute `b`, `rangeClosed` l''inclut.'
  - key: sortir
    format: course
    question: Comment repasser d'un `IntStream` à un `Stream` d'objets ?
    answer: Avec `boxed()` (vers `Stream<Integer>`) ou `mapToObj(f)` (vers un autre type d'objet).
  - key: vf-sum-vide
    format: true-false
    question: "`IntStream.empty().sum()` renvoie 0."
    truth: true
    answer: Contrairement à `average`, qui renvoie un `OptionalDouble` vide.
  - key: vf-range
    format: true-false
    question: "`IntStream.range(1, 5).count()` vaut 5."
    truth: false
    answer: "Il vaut 4 : 1, 2, 3, 4."
  - key: vf-debordement
    format: true-false
    question: "`IntStream.sum()` lève une exception en cas de débordement."
    truth: false
    answer: Il déborde silencieusement ; `mapToLong` ou `asLongStream` évitent le problème.
  - key: vf-max
    format: true-false
    question: "`IntStream.max()` renvoie un `OptionalInt`."
    truth: true
    answer: Vide pour un stream vide.
  - key: qcm-entree
    format: multiple-choice
    question: Comment obtenir un `IntStream` ?
    choices:
      - text: "`liste.stream().mapToInt(Integer::intValue)`"
        correct: true
      - text: "`\"abc\".chars()`"
        correct: true
      - text: "`Stream.of(1, 2, 3)`"
        correct: false
      - text: "`List.of(1, 2).intStream()`"
        correct: false
    answer: '`Stream.of(1, 2, 3)` donne un `Stream<Integer>`.'
  - key: qcm-stats
    format: multiple-choice
    question: Comment obtenir en un seul parcours le minimum, le maximum et la moyenne des âges ?
    choices:
      - text: "`personnes.stream().mapToInt(Personne::age).summaryStatistics()`"
        correct: true
      - text: "Trois streams séparés avec `min`, `max` et `average`, en trois parcours"
        correct: false
      - text: "`personnes.stream().stats()`"
        correct: false
      - text: "`Collections.summary(personnes)`"
        correct: false
    answer: '`IntSummaryStatistics` donne nombre, somme, min, max et moyenne.'
  - key: qcm-boucle-index
    format: multiple-choice
    question: Comment obtenir les index des éléments vides d'une liste ?
    choices:
      - text: "`IntStream.range(0, l.size()).filter(i -> l.get(i).isEmpty()).boxed().toList()`"
        correct: true
      - text: "`l.stream().filter(String::isEmpty).map(l::indexOf).toList()`, faux en cas de doublons"
        correct: false
      - text: "`l.stream().mapToInt(String::isEmpty).toList()`"
        correct: false
      - text: "`IntStream.rangeClosed(0, l.size())...`, qui déborde de la liste"
        correct: false
    answer: '`indexOf` renvoie toujours le premier index ; `rangeClosed` irait jusqu''à `size()`.'
  - key: qcm-grand-total
    format: multiple-choice
    question: Comment additionner des millions de montants en centimes (`int`) sans débordement ?
    choices:
      - text: "`montants.stream().mapToLong(Integer::longValue).sum()`"
        correct: true
      - text: "`montants.stream().mapToInt(Integer::intValue).asLongStream().sum()`"
        correct: true
      - text: "`montants.stream().mapToInt(Integer::intValue).sum()`"
        correct: false
      - text: "`(long) montants.stream().mapToInt(Integer::intValue).sum()`"
        correct: false
    answer: "Le cast arrive trop tard : la somme a déjà débordé en `int`."
  - key: code-range
    format: code-output
    question: |-
      ```java
      System.out.println(IntStream.range(1, 5).sum() + " " + IntStream.rangeClosed(1, 5).sum());
      ```
    answer: '`10 15`.'
    check:
      output: "10 15"
  - key: code-average
    format: code-output
    question: |-
      ```java
      System.out.println(IntStream.of(1, 2, 4).average().getAsDouble() + " " + IntStream.empty().average());
      ```
    answer: '`2.3333333333333335 OptionalDouble.empty`.'
    check:
      output: "2.3333333333333335 OptionalDouble.empty"
  - key: code-stats
    format: code-output
    question: |-
      ```java
      IntSummaryStatistics s = IntStream.of(4, 8, 6).summaryStatistics();
      System.out.println(s.getMin() + " " + s.getMax() + " " + s.getAverage() + " " + s.getSum());
      ```
    answer: '`4 8 6.0 18`.'
    check:
      output: "4 8 6.0 18"
  - key: code-chars
    format: code-output
    question: |-
      ```java
      System.out.println("banane".chars().filter(c -> c == 'a').count() + " "
              + "abc".chars().mapToObj(c -> String.valueOf((char) (c + 1))).toList());
      ```
    answer: '`2 [b, c, d]`.'
    check:
      output: "2 [b, c, d]"
