notion: streams-primitifs
lesson: |-
  `IntStream`, `LongStream` et `DoubleStream` manipulent des **primitifs**, sans boxing, et ajoutent des opérations
  numériques.

  ```java
  IntStream.range(0, 5);                 // 0, 1, 2, 3, 4   (borne haute exclue)
  IntStream.rangeClosed(1, 5);           // 1 à 5 inclus
  int total = commandes.stream().mapToInt(Commande::quantite).sum();
  OptionalDouble moyenne = notes.stream().mapToInt(Integer::intValue).average();
  IntSummaryStatistics stats = IntStream.of(4, 8, 6).summaryStatistics();   // min, max, moyenne, somme, nombre
  ```

  - On y entre avec `mapToInt`, `mapToLong`, `mapToDouble` (ou `IntStream.of`, `Arrays.stream(int[])`,
    `String.chars()`).
  - On en sort avec **`boxed()`** (vers `Stream<Integer>`) ou **`mapToObj`** (vers des objets).
  - `sum()` renvoie un nombre (0 si vide) ; `average()`, `min()` et `max()` renvoient un **`OptionalInt`** /
    **`OptionalDouble`**, vides si le stream l'est.
  - `range` remplace la boucle `for` à index : `IntStream.range(0, liste.size()).filter(i -> ...)`.
  - `sum()` sur un `IntStream` **déborde** silencieusement : pour de grands totaux, `mapToLong` ou `asLongStream()`.

  **Piège classique** : `IntStream.range(1, 10)` pour « de 1 à 10 ». La borne haute est exclue : on obtient 1 à 9 ;
  `rangeClosed(1, 10)` inclut 10.

  **En entretien** : « Les streams primitifs évitent le boxing et offrent `sum`, `average`, `summaryStatistics` ; `range`
  exclut la borne haute, `rangeClosed` l'inclut ; `boxed` ramène vers un `Stream` d'objets. »
cards:
  - key: eviter-boxing-stream-numerique
    format: course
    question: "Comment éviter le boxing dans un stream numérique ?"
    choices:
      - {text: "Avec `IntStream`, `LongStream` ou `DoubleStream`, via `mapToInt` et ses semblables", correct: true}
      - {text: "Avec `Stream<Integer>`, que le JIT convertit toujours en `int` sans aucun coût", correct: false}
      - {text: "Avec `map(Integer::valueOf)`, qui réutilise les objets du cache d'`Integer`", correct: false}
      - {text: "Avec `parallel()`, qui répartit le coût du boxing entre les threads du pool", correct: false}
    answer: IntStream/LongStream/DoubleStream via mapToInt, etc.
  - key: renvoie-intstream-average
    format: course
    question: "Que renvoie `IntStream.average()` ?"
    choices:
      - {text: "Un `OptionalDouble`, vide si le stream est vide", correct: true}
      - {text: "Un `int`, arrondi à l'entier inférieur", correct: false}
      - {text: "Un `double`, qui vaut `0.0` si le stream est vide", correct: false}
      - {text: "Un `Optional<Integer>`, vide si le stream est vide", correct: false}
    answer: "Un `OptionalDouble` (vide si le stream est vide) : une moyenne n'est pas entière, et un stream vide n'en a pas."
  - key: range
    format: course
    question: "Quelle différence entre `IntStream.range(a, b)` et `rangeClosed(a, b)` ?"
    choices:
      - {text: "`range` exclut la borne haute `b`, `rangeClosed` l'inclut", correct: true}
      - {text: "`range` inclut la borne haute `b`, `rangeClosed` l'exclut", correct: false}
      - {text: "`range` exclut la borne basse `a`, `rangeClosed` l'inclut", correct: false}
      - {text: "Aucune : `rangeClosed` ferme le stream après son dernier élément", correct: false}
    answer: '`range` exclut la borne haute `b`, `rangeClosed` l''inclut.'
  - key: sortir
    format: course
    question: "Comment repasser d'un `IntStream` à un `Stream` d'objets ?"
    choices:
      - {text: "Avec `boxed()` vers un `Stream<Integer>`, ou `mapToObj(f)` vers un autre type", correct: true}
      - {text: "Avec `map(Integer::valueOf)`, qui renvoie directement un `Stream<Integer>`", correct: false}
      - {text: "Avec un simple cast : `(Stream<Integer>) intStream`", correct: false}
      - {text: "Avec `toList()`, puis `stream()` sur la liste d'`int` obtenue", correct: false}
    answer: "Avec `boxed()` (vers `Stream<Integer>`) ou `mapToObj(f)` (vers un autre type d'objet). Le `map` d'un `IntStream` renvoie un autre `IntStream`."
  - key: vf-sum-vide
    format: true-false
    question: "`IntStream.empty().sum()` renvoie 0."
    truth: true
    answer: Contrairement à `average`, qui renvoie un `OptionalDouble` vide.
  - key: vf-range
    format: true-false
    question: "`IntStream.range(1, 5).count()` vaut 5."
    truth: false
    answer: "Il vaut 4 : 1, 2, 3, 4."
  - key: vf-debordement
    format: true-false
    question: "`IntStream.sum()` lève une exception en cas de débordement."
    truth: false
    answer: Il déborde silencieusement ; `mapToLong` ou `asLongStream` évitent le problème.
  - key: vf-max
    format: true-false
    question: "`IntStream.max()` renvoie un `OptionalInt`."
    truth: true
    answer: Vide pour un stream vide.
  - key: qcm-entree
    format: multiple-choice
    question: "Quelle expression donne un `IntStream` ?"
    choices:
      - {text: "`\"abc\".chars()`", correct: true}
      - {text: "`Stream.of(1, 2, 3)`", correct: false}
      - {text: "`List.of(1, 2).intStream()`", correct: false}
      - {text: "`liste.stream().map(Integer::intValue)`", correct: false}
    answer: "`chars()` donne un `IntStream` des caractères (comme `liste.stream().mapToInt(Integer::intValue)`). `map` garde un `Stream<Integer>`, comme `Stream.of(1, 2, 3)`, et `intStream()` n'existe pas."
  - key: qcm-stats
    format: multiple-choice
    question: Comment obtenir en un seul parcours le minimum, le maximum et la moyenne des âges ?
    choices:
      - text: "`personnes.stream().mapToInt(Personne::age).summaryStatistics()`"
        correct: true
      - text: "Trois streams séparés avec `min`, `max` et `average`, en trois parcours"
        correct: false
      - text: "`personnes.stream().stats()`"
        correct: false
      - text: "`Collections.summary(personnes)`"
        correct: false
    answer: '`IntSummaryStatistics` donne nombre, somme, min, max et moyenne.'
  - key: qcm-boucle-index
    format: multiple-choice
    question: Comment obtenir les index des éléments vides d'une liste ?
    choices:
      - text: "`IntStream.range(0, l.size()).filter(i -> l.get(i).isEmpty()).boxed().toList()`"
        correct: true
      - text: "`l.stream().filter(String::isEmpty).map(l::indexOf).toList()`, faux en cas de doublons"
        correct: false
      - text: "`l.stream().mapToInt(String::isEmpty).toList()`"
        correct: false
      - text: "`IntStream.rangeClosed(0, l.size())...`, qui déborde de la liste"
        correct: false
    answer: '`indexOf` renvoie toujours le premier index ; `rangeClosed` irait jusqu''à `size()`.'
  - key: qcm-grand-total
    format: multiple-choice
    question: "Quelle expression additionne des millions de montants en centimes (`int`) sans débordement ?"
    choices:
      - {text: "`montants.stream().mapToLong(Integer::longValue).sum()`", correct: true}
      - {text: "`montants.stream().mapToInt(Integer::intValue).sum()`", correct: false}
      - {text: "`(long) montants.stream().mapToInt(Integer::intValue).sum()`", correct: false}
      - {text: "`montants.stream().mapToInt(Integer::intValue).sum() * 1L`", correct: false}
    answer: "`mapToLong` additionne en `long` dès le premier terme (comme `asLongStream()`). Un cast ou un `* 1L` arrivent trop tard : la somme a déjà débordé en `int`."
  - key: code-range
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(IntStream.range(1, 5).sum() + " " + IntStream.rangeClosed(1, 5).sum());
      ```
    choices:
      - {text: "`10 15`", correct: true}
      - {text: "`15 15`", correct: false}
      - {text: "`10 10`", correct: false}
      - {text: "`4 5`", correct: false}
    answer: "`10 15` : `range(1, 5)` donne 1 à 4, `rangeClosed(1, 5)` ajoute 5."
    check:
      output: "10 15"
  - key: code-average
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(IntStream.of(1, 2, 4).average().getAsDouble() + " " + IntStream.empty().average());
      ```
    choices:
      - {text: "`2.3333333333333335 OptionalDouble.empty`", correct: true}
      - {text: "`2.3333333333333335 0.0`", correct: false}
      - {text: "`2 OptionalDouble.empty`", correct: false}
      - {text: "`2.3333333333333335 NaN`", correct: false}
    answer: '`2.3333333333333335 OptionalDouble.empty`.'
    check:
      output: "2.3333333333333335 OptionalDouble.empty"
  - key: code-stats
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      IntSummaryStatistics s = IntStream.of(4, 8, 6).summaryStatistics();
      System.out.println(s.getMin() + " " + s.getMax() + " " + s.getAverage() + " " + s.getSum());
      ```
    choices:
      - {text: "`4 8 6.0 18`", correct: true}
      - {text: "`4 8 6 18`", correct: false}
      - {text: "`4 6 6.0 18`", correct: false}
      - {text: "`8 4 6.0 18`", correct: false}
    answer: "`4 8 6.0 18` : `getAverage` renvoie un `double`, d'où `6.0`."
    check:
      output: "4 8 6.0 18"
  - key: code-chars
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println("banane".chars().filter(c -> c == 'a').count() + " "
              + "abc".chars().mapToObj(c -> String.valueOf((char) (c + 1))).toList());
      ```
    choices:
      - {text: "`2 [b, c, d]`", correct: true}
      - {text: "`3 [b, c, d]`", correct: false}
      - {text: "`2 [98, 99, 100]`", correct: false}
      - {text: "`2 [a, b, c]`", correct: false}
    answer: "`2 [b, c, d]` : « banane » a deux `a` ; chaque code de caractère + 1, recasté en `char`, donne la lettre suivante."
    check:
      output: "2 [b, c, d]"
