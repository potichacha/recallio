notion: stream-tolist
lesson: |-
  Pour obtenir une liste depuis un stream, trois écritures coexistent :

  | Écriture | Liste obtenue |
  |---|---|
  | `stream.toList()` (Java 16) | **non modifiable** ; accepte les `null` |
  | `collect(Collectors.toList())` | aucune garantie (une `ArrayList` en pratique, modifiable) |
  | `collect(Collectors.toUnmodifiableList())` (Java 10) | non modifiable ; **refuse les `null`** |
  | `collect(Collectors.toCollection(ArrayList::new))` | une `ArrayList`, garantie modifiable |

  ```java
  List<String> noms = clients.stream().map(Client::nom).toList();     // le choix par défaut
  noms.add("x");                                                       // UnsupportedOperationException

  List<String> aCompleter = clients.stream().map(Client::nom)
          .collect(Collectors.toCollection(ArrayList::new));           // quand on doit la modifier
  ```

  - `toList()` est le **défaut** : plus court, et un résultat non modifiable évite les surprises.
  - Si la liste doit être modifiée ensuite, on le dit avec `toCollection(ArrayList::new)` (ou `new ArrayList<>(...)`),
    plutôt que de compter sur le comportement non garanti de `Collectors.toList()`.
  - Remplacer `collect(Collectors.toList())` par `toList()` dans un code existant peut casser un appelant qui modifiait
    la liste : à vérifier.

  **Piège classique** : migrer en masse vers `toList()`, puis découvrir en production un `UnsupportedOperationException`
  dans un code qui faisait `resultat.add(...)` ou `resultat.sort(...)`.

  **En entretien** : « `toList()` renvoie une liste non modifiable et c'est mon défaut ; si je dois modifier le résultat,
  `toCollection(ArrayList::new)`. `Collectors.toList()` ne garantit rien. »
cards:
  - key: tolist-vs-collect-collectors-tolist
    format: course
    question: '`toList()` vs `collect(Collectors.toList())` ?'
    answer: toList() renvoie une liste non modifiable ; Collectors.toList() ne garantit rien (en pratique modifiable).
  - key: modifiable
    format: course
    question: Comment obtenir une liste garantie modifiable depuis un stream ?
    answer: '`collect(Collectors.toCollection(ArrayList::new))`.'
  - key: elements-null
    format: course
    question: Quelle différence entre `toList()` et `Collectors.toUnmodifiableList()` face à `null` ?
    answer: '`toList()` accepte les éléments `null` ; `toUnmodifiableList()` lève une `NullPointerException`.'
  - key: migration
    format: course
    question: Pourquoi remplacer `collect(Collectors.toList())` par `toList()` demande-t-il une vérification ?
    answer: Parce qu'un appelant qui modifiait la liste (`add`, `sort`, `remove`) lèvera désormais une `UnsupportedOperationException`.
  - key: vf-tolist-modifiable
    format: true-false
    question: La liste renvoyée par `stream.toList()` est modifiable.
    truth: false
    answer: Elle est non modifiable.
  - key: vf-collectors-garantie
    format: true-false
    question: "La Javadoc garantit que `Collectors.toList()` renvoie une `ArrayList`."
    truth: false
    answer: Aucune garantie de type, de mutabilité ni de sérialisabilité.
  - key: vf-tolist-null
    format: true-false
    question: "`Stream.of(\"a\", null).toList()` lève une exception."
    truth: false
    answer: '`toList()` accepte `null`.'
  - key: vf-sort
    format: true-false
    question: "On peut appeler `sort` sur le résultat de `toList()`."
    truth: false
    answer: '`sort` modifie la liste : `UnsupportedOperationException`.'
  - key: qcm-defaut
    format: multiple-choice
    question: Quelle écriture choisir par défaut pour un résultat qu'on ne modifiera pas ?
    choices:
      - text: "`stream.toList()`"
        correct: true
      - text: "`stream.collect(Collectors.toList())`"
        correct: false
      - text: "`new ArrayList<>(stream.toList())`"
        correct: false
      - text: "`stream.toArray()`"
        correct: false
    answer: Plus court, et non modifiable.
  - key: qcm-modifier
    format: multiple-choice
    question: Le résultat doit ensuite recevoir des éléments. Que choisir ?
    choices:
      - text: "`collect(Collectors.toCollection(ArrayList::new))`"
        correct: true
      - text: "`new ArrayList<>(stream.toList())`"
        correct: true
      - text: "`stream.toList()`"
        correct: false
      - text: "`collect(Collectors.toUnmodifiableList())`"
        correct: false
    answer: Les deux dernières sont non modifiables.
  - key: qcm-null
    format: multiple-choice
    question: Lesquelles lèvent une exception pour un élément `null` ?
    choices:
      - text: "`collect(Collectors.toUnmodifiableList())`"
        correct: true
      - text: "`List.copyOf(...)` sur le résultat"
        correct: true
      - text: "`toList()`"
        correct: false
      - text: "`collect(Collectors.toList())`"
        correct: false
    answer: Les collections immuables de `List.of`/`copyOf` refusent `null`, pas `toList()`.
  - key: qcm-depuis
    format: multiple-choice
    question: Depuis quelle version `Stream.toList()` existe-t-il ?
    choices:
      - text: "Java 16"
        correct: true
      - text: "Java 8"
        correct: false
      - text: "Java 11"
        correct: false
      - text: "Java 21"
        correct: false
    answer: '`Collectors.toUnmodifiableList()` date de Java 10.'
  - key: code-stream-of-1-2-tolist
    format: code-output
    question: '`Stream.of(1, 2).toList().add(3);`'
    answer: 'UnsupportedOperationException : toList() renvoie une liste non modifiable.'
    check:
      code: |-
        Stream.of(1, 2).toList().add(3);
      throws: UnsupportedOperationException
  - key: code-to-collection
    format: code-output
    question: |-
      ```java
      List<Integer> l = Stream.of(3, 1, 2).collect(Collectors.toCollection(ArrayList::new));
      l.add(0);
      Collections.sort(l);
      System.out.println(l);
      ```
    answer: '`[0, 1, 2, 3]`.'
    check:
      output: "[0, 1, 2, 3]"
  - key: code-null
    format: code-output
    question: |-
      ```java
      System.out.println(Stream.of("a", null).toList());
      Stream.of("a", null).collect(Collectors.toUnmodifiableList());
      ```
    answer: '`[a, null]`, puis une `NullPointerException`.'
    check:
      output: "[a, null]"
      throws: NullPointerException
  - key: code-sort
    format: code-output
    question: |-
      ```java
      List<Integer> l = Stream.of(2, 1).toList();
      System.out.println(l);
      l.sort(null);
      ```
    answer: '`[2, 1]`, puis une `UnsupportedOperationException`.'
    check:
      output: "[2, 1]"
      throws: UnsupportedOperationException
