notion: stream-tolist
lesson: |-
  Pour obtenir une liste depuis un stream, trois écritures coexistent :

  | Écriture | Liste obtenue |
  |---|---|
  | `stream.toList()` (Java 16) | **non modifiable** ; accepte les `null` |
  | `collect(Collectors.toList())` | aucune garantie (une `ArrayList` en pratique, modifiable) |
  | `collect(Collectors.toUnmodifiableList())` (Java 10) | non modifiable ; **refuse les `null`** |
  | `collect(Collectors.toCollection(ArrayList::new))` | une `ArrayList`, garantie modifiable |

  ```java
  List<String> noms = clients.stream().map(Client::nom).toList();     // le choix par défaut
  noms.add("x");                                                       // UnsupportedOperationException

  List<String> aCompleter = clients.stream().map(Client::nom)
          .collect(Collectors.toCollection(ArrayList::new));           // quand on doit la modifier
  ```

  - `toList()` est le **défaut** : plus court, et un résultat non modifiable évite les surprises.
  - Si la liste doit être modifiée ensuite, on le dit avec `toCollection(ArrayList::new)` (ou `new ArrayList<>(...)`),
    plutôt que de compter sur le comportement non garanti de `Collectors.toList()`.
  - Remplacer `collect(Collectors.toList())` par `toList()` dans un code existant peut casser un appelant qui modifiait
    la liste : à vérifier.

  **Piège classique** : migrer en masse vers `toList()`, puis découvrir en production un `UnsupportedOperationException`
  dans un code qui faisait `resultat.add(...)` ou `resultat.sort(...)`.

  **En entretien** : « `toList()` renvoie une liste non modifiable et c'est mon défaut ; si je dois modifier le résultat,
  `toCollection(ArrayList::new)`. `Collectors.toList()` ne garantit rien. »
cards:
  - key: tolist-vs-collect-collectors-tolist
    format: course
    question: "Quelle différence entre `toList()` et `collect(Collectors.toList())` ?"
    choices:
      - {text: "`toList()` renvoie une liste non modifiable ; `Collectors.toList()` ne garantit rien", correct: true}
      - {text: "`Collectors.toList()` renvoie une liste non modifiable ; `toList()` une `ArrayList`", correct: false}
      - {text: "Aucune : `toList()` n'est qu'un raccourci de `collect(Collectors.toList())`", correct: false}
      - {text: "`toList()` refuse les éléments `null` ; `Collectors.toList()` les accepte", correct: false}
    answer: "`toList()` (Java 16) renvoie une liste non modifiable ; `Collectors.toList()` ne garantit rien (en pratique modifiable). Les deux acceptent les éléments `null`."
  - key: modifiable
    format: course
    question: "Comment obtenir une liste garantie modifiable depuis un stream ?"
    choices:
      - {text: "`collect(Collectors.toCollection(ArrayList::new))`", correct: true}
      - {text: "`collect(Collectors.toList())`, garanti modifiable", correct: false}
      - {text: "`collect(Collectors.toUnmodifiableList())`", correct: false}
      - {text: "`toList()`, qui renvoie une `ArrayList`", correct: false}
    answer: "`collect(Collectors.toCollection(ArrayList::new))` garantit le type. `Collectors.toList()` est modifiable en pratique, sans que ce soit garanti ; `toList()` est non modifiable."
  - key: elements-null
    format: course
    question: "Quelle différence entre `toList()` et `Collectors.toUnmodifiableList()` face à `null` ?"
    choices:
      - {text: "`toList()` accepte les `null` ; `toUnmodifiableList()` lève une `NullPointerException`", correct: true}
      - {text: "`toUnmodifiableList()` accepte les `null` ; `toList()` lève une `NullPointerException`", correct: false}
      - {text: "Les deux lèvent une `NullPointerException` dès le premier élément `null`", correct: false}
      - {text: "Les deux acceptent les `null`, et les rangent à la fin de la liste", correct: false}
    answer: '`toList()` accepte les éléments `null` ; `toUnmodifiableList()` lève une `NullPointerException`.'
  - key: migration
    format: course
    question: "Pourquoi remplacer `collect(Collectors.toList())` par `toList()` demande-t-il une vérification ?"
    choices:
      - {text: "Un appelant qui modifiait la liste lèvera une `UnsupportedOperationException`", correct: true}
      - {text: "`toList()` renvoie les éléments dans l'ordre inverse de `Collectors.toList()`", correct: false}
      - {text: "`toList()` est plus lent : il recopie la liste une seconde fois", correct: false}
      - {text: "`toList()` refuse les éléments `null`, que `Collectors.toList()` acceptait", correct: false}
    answer: "Parce qu'un appelant qui modifiait la liste (`add`, `sort`, `remove`) lèvera désormais une `UnsupportedOperationException`. Les `null`, eux, restent acceptés."
  - key: vf-tolist-modifiable
    format: true-false
    question: La liste renvoyée par `stream.toList()` est modifiable.
    truth: false
    answer: Elle est non modifiable.
  - key: vf-collectors-garantie
    format: true-false
    question: "La Javadoc garantit que `Collectors.toList()` renvoie une `ArrayList`."
    truth: false
    answer: Aucune garantie de type, de mutabilité ni de sérialisabilité.
  - key: vf-tolist-null
    format: true-false
    question: "`Stream.of(\"a\", null).toList()` lève une exception."
    truth: false
    answer: '`toList()` accepte `null`.'
  - key: vf-sort
    format: true-false
    question: "On peut appeler `sort` sur le résultat de `toList()`."
    truth: false
    answer: '`sort` modifie la liste : `UnsupportedOperationException`.'
  - key: qcm-defaut
    format: multiple-choice
    question: Quelle écriture choisir par défaut pour un résultat qu'on ne modifiera pas ?
    choices:
      - text: "`stream.toList()`"
        correct: true
      - text: "`stream.collect(Collectors.toList())`"
        correct: false
      - text: "`new ArrayList<>(stream.toList())`"
        correct: false
      - text: "`stream.toArray()`"
        correct: false
    answer: Plus court, et non modifiable.
  - key: qcm-modifier
    format: multiple-choice
    question: "Quelle expression choisir, si le résultat doit ensuite recevoir des éléments ?"
    choices:
      - {text: "`collect(Collectors.toCollection(ArrayList::new))`", correct: true}
      - {text: "`collect(Collectors.toUnmodifiableList())`", correct: false}
      - {text: "`List.copyOf(stream.toList())`", correct: false}
      - {text: "`stream.toList()`", correct: false}
    answer: "`toCollection(ArrayList::new)` garantit une liste modifiable (comme `new ArrayList<>(stream.toList())`). Les trois autres sont non modifiables."
  - key: qcm-null
    format: multiple-choice
    question: Lesquelles lèvent une exception pour un élément `null` ?
    choices:
      - text: "`collect(Collectors.toUnmodifiableList())`"
        correct: true
      - text: "`List.copyOf(...)` sur le résultat"
        correct: true
      - text: "`toList()`"
        correct: false
      - text: "`collect(Collectors.toList())`"
        correct: false
    answer: Les collections immuables de `List.of`/`copyOf` refusent `null`, pas `toList()`.
  - key: qcm-depuis
    format: multiple-choice
    question: Depuis quelle version `Stream.toList()` existe-t-il ?
    choices:
      - text: "Java 16"
        correct: true
      - text: "Java 8"
        correct: false
      - text: "Java 11"
        correct: false
      - text: "Java 21"
        correct: false
    answer: '`Collectors.toUnmodifiableList()` date de Java 10.'
  - key: code-stream-of-1-2-tolist
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Stream.of(1, 2).toList().add(3);
      ```
    choices:
      - {text: "Une `UnsupportedOperationException`", correct: true}
      - {text: "Rien : la liste reçoit `3`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "Une `UnsupportedOperationException` : `toList()` renvoie une liste non modifiable."
    check:
      code: |-
        Stream.of(1, 2).toList().add(3);
      throws: UnsupportedOperationException
  - key: code-to-collection
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = Stream.of(3, 1, 2).collect(Collectors.toCollection(ArrayList::new));
      l.add(0);
      Collections.sort(l);
      System.out.println(l);
      ```
    choices:
      - {text: "`[0, 1, 2, 3]`", correct: true}
      - {text: "`[3, 1, 2, 0]`", correct: false}
      - {text: "`[1, 2, 3]`", correct: false}
      - {text: "Une `UnsupportedOperationException`", correct: false}
    answer: "`[0, 1, 2, 3]` : `toCollection(ArrayList::new)` donne une liste modifiable, qu'on peut compléter et trier."
    check:
      output: "[0, 1, 2, 3]"
  - key: code-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Stream.of("a", null).toList());
      Stream.of("a", null).collect(Collectors.toUnmodifiableList());
      ```
    choices:
      - {text: "`[a, null]`, puis une `NullPointerException`", correct: true}
      - {text: "`[a]`, puis une `NullPointerException`", correct: false}
      - {text: "Une `NullPointerException`, sans rien afficher", correct: false}
      - {text: "`[a, null]`", correct: false}
    answer: "`[a, null]`, puis une `NullPointerException` : `toList()` accepte `null`, `toUnmodifiableList()` le refuse."
    check:
      output: "[a, null]"
      throws: NullPointerException
  - key: code-sort
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = Stream.of(2, 1).toList();
      System.out.println(l);
      l.sort(null);
      ```
    choices:
      - {text: "`[2, 1]`, puis une `UnsupportedOperationException`", correct: true}
      - {text: "`[2, 1]`", correct: false}
      - {text: "`[1, 2]`", correct: false}
      - {text: "Une `NullPointerException` : le comparateur vaut `null`", correct: false}
    answer: "`[2, 1]`, puis une `UnsupportedOperationException` : la liste de `toList()` ne se trie pas. Un comparateur `null` voudrait dire l'ordre naturel."
    check:
      output: "[2, 1]"
      throws: UnsupportedOperationException
