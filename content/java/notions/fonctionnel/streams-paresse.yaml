notion: streams-paresse
lesson: |-
  Les opérations intermédiaires sont **paresseuses** : elles décrivent le traitement, et rien ne s'exécute avant
  l'opération terminale. Les éléments traversent ensuite le pipeline **un par un**, verticalement :

  ```java
  Stream.of("a", "b", "c")
          .peek(s -> System.out.print("lu " + s + ", "))
          .map(String::toUpperCase)
          .filter(s -> !s.equals("A"))
          .findFirst();
  // lu a, lu b,   → "B" trouvé : "c" n'est jamais lu
  ```

  Conséquences :
  - **Court-circuit** : `findFirst`, `anyMatch`, `limit` s'arrêtent dès que possible, ce qui rend possibles les streams
    infinis (`Stream.iterate(1, x -> x * 2).limit(10)`).
  - Les opérations **avec état** (`sorted`, `distinct`) font exception : `sorted` doit voir **tous** les éléments avant
    d'en émettre un.
  - `count()` peut même ne rien parcourir quand la taille est connue (une liste sans `filter`) : les `peek` et `map` ne
    s'exécutent pas.

  Un stream ne s'utilise **qu'une fois** : une seconde opération terminale lève une `IllegalStateException`. Pour
  recommencer, on recrée le stream depuis la source, ou on garde un `Supplier<Stream<T>>`.

  - `peek` sert au **débogage**, pas à la logique : il peut être sauté.

  **Piège classique** : garder un `Stream` dans une variable et l'utiliser deux fois (`s.count()` puis `s.toList()`). La
  seconde lève `IllegalStateException: stream has already been operated upon or closed`.

  **En entretien** : « Rien ne s'exécute avant l'opération terminale, puis chaque élément traverse tout le pipeline, ce
  qui permet le court-circuit ; et un stream ne se consomme qu'une fois. »
cards:
  - key: reutiliser-stream
    format: course
    question: "Peut-on réutiliser un stream déjà consommé ?"
    choices:
      - {text: "Non : une seconde opération terminale lève une `IllegalStateException`", correct: true}
      - {text: "Oui : il repart du début à chaque nouvelle opération terminale", correct: false}
      - {text: "Oui, après un appel à `reset()` sur le stream", correct: false}
      - {text: "Non : il est vide, et le second parcours ne renvoie rien", correct: false}
    answer: "Non : un stream ne se consomme qu'une fois, une seconde opération terminale lève une `IllegalStateException`. On recrée le stream depuis sa source."
  - key: elements-traversent-ils-pipeline-etape-etape
    format: course
    question: "Les éléments traversent-ils le pipeline étape par étape, ou un par un ?"
    choices:
      - {text: "Un par un : chaque élément traverse tout le pipeline, ce qui permet le court-circuit", correct: true}
      - {text: "Étape par étape : chaque opération traite tous les éléments avant la suivante", correct: false}
      - {text: "Par lots de 64 éléments, pour profiter au mieux du cache du processeur", correct: false}
      - {text: "Dans l'ordre inverse des opérations, de la terminale vers la source", correct: false}
    answer: "Un par un (exécution verticale), ce qui permet le court-circuit. Seules les opérations à état, comme `sorted`, attendent tous les éléments."
  - key: peek-affiche-parfois-rien
    format: course
    question: "Pourquoi `peek` n'affiche-t-il parfois rien ?"
    choices:
      - {text: "Il n'y a pas d'opération terminale, ou `count()` connaissait la taille sans parcourir", correct: true}
      - {text: "`peek` est désactivé hors du mode débogage de la JVM, donc en production", correct: false}
      - {text: "`peek` n'est appelé que sur le dernier élément, quand le stream se termine", correct: false}
      - {text: "La sortie de `peek` est tamponnée, et perdue quand le stream est parallèle", correct: false}
    answer: "Il n'y a pas d'opération terminale, ou `count()` a calculé la taille sans exécuter le pipeline (Java 9+)."
  - key: sorted-barriere
    format: course
    question: "Pourquoi `sorted` casse-t-elle le traitement élément par élément ?"
    choices:
      - {text: "Opération à état, elle doit recevoir tous les éléments avant d'émettre le plus petit", correct: true}
      - {text: "Elle trie chaque élément seul, puis attend le suivant pour les comparer", correct: false}
      - {text: "Elle copie le stream dans une liste, puis relance le pipeline depuis le début", correct: false}
      - {text: "Elle s'exécute dans un autre thread, qui attend la fin de la source", correct: false}
    answer: "C'est une opération avec état : elle doit recevoir tous les éléments avant d'émettre le plus petit ; un stream infini trié ne termine jamais."
  - key: vf-execution
    format: true-false
    question: "`stream.map(f)` appelle `f` immédiatement sur chaque élément."
    truth: false
    answer: Rien ne s'exécute avant l'opération terminale.
  - key: vf-infini
    format: true-false
    question: "`Stream.iterate(1, x -> x + 1).limit(5).toList()` termine."
    truth: true
    answer: '`limit` court-circuite le stream infini.'
  - key: vf-deux-terminales
    format: true-false
    question: On peut appeler `count()` puis `toList()` sur le même objet `Stream`.
    truth: false
    answer: La seconde opération terminale lève une `IllegalStateException`.
  - key: vf-find-first
    format: true-false
    question: "`findFirst` sur un stream de un million d'éléments peut n'en traiter qu'un seul."
    truth: true
    answer: Grâce à l'exécution verticale et au court-circuit (sauf opération avec état comme `sorted`).
  - key: qcm-reutiliser
    format: multiple-choice
    question: "Quelle façon de calculer deux résultats à partir des mêmes données est correcte ?"
    choices:
      - {text: "Garder un `Supplier<Stream<T>>` et appeler `get()` à chaque calcul", correct: true}
      - {text: "Réutiliser la même variable `Stream` pour les deux calculs", correct: false}
      - {text: "Appeler `reset()` sur le stream entre les deux calculs", correct: false}
      - {text: "Appeler `parallel()`, qui fait les deux calculs en même temps", correct: false}
    answer: "Un stream ne se consomme qu'une fois et n'a pas de `reset` : on en recrée un par calcul, depuis la collection ou par un `Supplier<Stream<T>>`."
  - key: qcm-court-circuit
    format: multiple-choice
    question: "Lesquelles de ces opérations court-circuitent un stream ?"
    choices:
      - text: "`anyMatch`"
        correct: true
      - text: "`limit`"
        correct: true
      - text: "`sorted`"
        correct: false
      - text: "`count` sur un stream filtré"
        correct: false
    answer: '`sorted` doit tout voir ; `count` après un `filter` doit tout parcourir.'
  - key: qcm-peek
    format: multiple-choice
    question: À quoi sert `peek` ?
    choices:
      - text: "Observer les éléments pendant le débogage"
        correct: true
      - text: "Modifier une base de données pour chaque élément"
        correct: false
      - text: "Forcer l'exécution du pipeline"
        correct: false
      - text: "Compter les éléments"
        correct: false
    answer: "Il peut être sauté (par exemple par `count`) : la logique métier n'y a pas sa place."
  - key: qcm-ordre
    format: multiple-choice
    question: "Que s'affiche-t-il avec `Stream.of(1, 2).peek(x -> print(\"a\" + x)).map(x -> x).peek(x -> print(\"b\" + x)).toList()` ?"
    choices:
      - text: "a1 b1 a2 b2"
        correct: true
      - text: "a1 a2 b1 b2"
        correct: false
      - text: "b1 b2 a1 a2"
        correct: false
      - text: "Rien"
        correct: false
    answer: Chaque élément traverse tout le pipeline avant le suivant.
  - key: code-stream-of-1-2-3
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Stream.of(1, 2, 3).peek(System.out::println).map(x -> x * 2);
      ```
    choices:
      - {text: "Rien", correct: true}
      - text: |-
          ```
          1
          2
          3
          ```
        correct: false
      - text: |-
          ```
          2
          4
          6
          ```
        correct: false
      - {text: "`1`", correct: false}
    answer: "Rien n'est affiché : sans opération terminale, le pipeline ne s'exécute pas."
    check:
      code: |-
        Stream.of(1, 2, 3).peek(System.out::println).map(x -> x * 2);
      output: ""
  - key: code-list-of-1-2-3
    format: code-output
    question: |-
      Qu'affiche ce code, en Java 9 et plus ?
      ```java
      System.out.println(List.of(1, 2, 3).stream().peek(System.out::println).count());
      ```
    choices:
      - {text: "`3`", correct: true}
      - text: |-
          ```
          1
          2
          3
          3
          ```
        correct: false
      - {text: "`0`", correct: false}
      - {text: "`1 2 3 3`", correct: false}
    answer: "`3`, sans aucun `peek` affiché : la taille de la liste est connue, `count` ne parcourt pas le pipeline."
    check:
      code: |-
        System.out.println(List.of(1, 2, 3).stream().peek(System.out::println).count());
      output: "3"
  - key: code-vertical
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Stream.of("a", "b", "c")
              .peek(s -> System.out.print(s))
              .map(String::toUpperCase)
              .peek(s -> System.out.print(s))
              .toList();
      ```
    choices:
      - {text: "`aAbBcC`", correct: true}
      - {text: "`abcABC`", correct: false}
      - {text: "`ABCabc`", correct: false}
      - {text: "`abc`", correct: false}
    answer: "`aAbBcC` : chaque élément traverse tout le pipeline avant que le suivant n'entre."
    check:
      output: "aAbBcC"
  - key: code-court-circuit
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Optional<Integer> premier = Stream.of(1, 2, 3, 4)
              .peek(x -> System.out.print(x + " "))
              .filter(x -> x % 2 == 0)
              .findFirst();
      System.out.println("-> " + premier.get());
      ```
    choices:
      - {text: "`1 2 -> 2`", correct: true}
      - {text: "`1 2 3 4 -> 2`", correct: false}
      - {text: "`2 -> 2`", correct: false}
      - {text: "`1 2 3 4 -> 4`", correct: false}
    answer: "`1 2 -> 2` : `findFirst` court-circuite, 3 et 4 ne sont jamais lus."
    check:
      output: "1 2 -> 2"
  - key: code-reutilisation
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Stream<String> s = Stream.of("a", "b");
      System.out.println(s.count());
      System.out.println(s.toList());
      ```
    choices:
      - {text: "`2`, puis une `IllegalStateException`", correct: true}
      - text: |-
          ```
          2
          [a, b]
          ```
        correct: false
      - {text: "`2`, puis `[]`", correct: false}
      - {text: "Une `IllegalStateException`, sans rien afficher", correct: false}
    answer: '`2`, puis une `IllegalStateException` : le stream est déjà consommé.'
    check:
      output: "2"
      throws: IllegalStateException
  - key: code-sorted
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Stream.of(3, 1, 2)
              .peek(x -> System.out.print("a" + x + " "))
              .sorted()
              .forEach(x -> System.out.print("b" + x + " "));
      ```
    choices:
      - {text: "`a3 a1 a2 b1 b2 b3`", correct: true}
      - {text: "`a3 b3 a1 b1 a2 b2`", correct: false}
      - {text: "`a1 a2 a3 b1 b2 b3`", correct: false}
      - {text: "`a3 a1 a2 b3 b1 b2`", correct: false}
    answer: "`a3 a1 a2 b1 b2 b3` : `sorted` attend tous les éléments avant d'émettre, dans l'ordre trié."
    check:
      output: "a3 a1 a2 b1 b2 b3"
  - key: bug-reutilisation
    format: bug-fix
    question: |-
      Ce code lève une `IllegalStateException`. Quelle correction est la bonne ?
      ```java
      Stream<Commande> payees = commandes.stream().filter(Commande::payee);
      long nombre = payees.count();
      List<Commande> liste = payees.toList();
      ```
    choices:
      - {text: "Matérialiser une fois avec `toList()`, puis prendre `liste.size()` pour le nombre", correct: true}
      - {text: "Appeler `payees.reset()` entre l'appel à `count()` et celui à `toList()`", correct: false}
      - {text: "Inverser les deux lignes : `toList()` d'abord, puis `count()` sur le même stream", correct: false}
      - {text: "Déclarer `payees` en `final`, pour que le stream reste réutilisable", correct: false}
    answer: |-
      ```java
      List<Commande> liste = commandes.stream().filter(Commande::payee).toList();
      long nombre = liste.size();
      ```
      Un stream ne se consomme qu'une fois. On matérialise le résultat une fois, ou on recrée le stream.
  - key: bug-peek-logique
    format: bug-fix
    question: |-
      Les notifications ne partent pas, alors que le compte est juste. Pourquoi ?
      ```java
      long envoyees = clients.stream().peek(notifier::envoyer).count();
      ```
    choices:
      - {text: "`count` connaît la taille de la source sans parcourir le pipeline : `peek` est sauté", correct: true}
      - {text: "`peek` s'exécute dans un autre thread, qui n'a pas le temps de finir avant `count`", correct: false}
      - {text: "`notifier::envoyer` n'est évalué qu'une fois, à la création de la référence", correct: false}
      - {text: "`peek` n'est appelé que pour le dernier élément, juste avant l'opération terminale", correct: false}
    answer: |-
      ```java
      clients.forEach(notifier::envoyer);
      long envoyees = clients.size();
      ```
      `count` sur une source de taille connue ne parcourt pas le pipeline : `peek` est sauté. Une action se fait dans
      `forEach`, pas dans `peek`.
  - key: bug-sorted-infini
    format: bug-fix
    question: |-
      Ce code ne termine jamais. Quelle correction est la bonne ?
      ```java
      List<Integer> petits = Stream.iterate(100, x -> x - 1).sorted().limit(3).toList();
      ```
    choices:
      - {text: "`Stream.iterate(100, x -> x - 1).limit(3).sorted().toList()`", correct: true}
      - {text: "`Stream.iterate(100, x -> x - 1).sorted().parallel().limit(3).toList()`", correct: false}
      - {text: "`Stream.iterate(100, x -> x - 1).sorted(Comparator.reverseOrder()).limit(3).toList()`", correct: false}
      - {text: "`Stream.iterate(100, x -> x - 1).sorted().findFirst()`", correct: false}
    answer: |-
      ```java
      List<Integer> petits = Stream.iterate(100, x -> x - 1).limit(3).sorted().toList();
      ```
      `sorted` attend tous les éléments d'un stream infini. On borne d'abord avec `limit`, puis on trie. (Si l'on voulait
      les trois plus petits d'un ensemble fini, on bornerait la source avant.)
  - key: bug-ordre-filtre
    format: bug-fix
    question: |-
      Ce pipeline appelle `enrichir` (une requête réseau) sur tous les clients, alors que seuls dix sont affichés. Quelle correction est la bonne ?
      ```java
      clients.stream().map(this::enrichir).sorted(parNom).filter(Client::actif).limit(10).toList();
      ```
    choices:
      - {text: "`filter(Client::actif).sorted(parNom).limit(10).map(this::enrichir)`", correct: true}
      - {text: "`map(this::enrichir).filter(Client::actif).sorted(parNom).limit(10)`", correct: false}
      - {text: "`sorted(parNom).map(this::enrichir).limit(10).filter(Client::actif)`", correct: false}
      - {text: "`parallel().map(this::enrichir).sorted(parNom).filter(Client::actif).limit(10)`", correct: false}
    answer: |-
      ```java
      clients.stream().filter(Client::actif).sorted(parNom).limit(10).map(this::enrichir).toList();
      ```
      `sorted` doit tout voir, donc tout ce qui la précède s'exécute sur tous les éléments. On filtre et on trie sur les
      données locales, on borne, puis on n'enrichit que les dix restants.
