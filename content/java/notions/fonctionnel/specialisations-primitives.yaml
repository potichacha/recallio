notion: specialisations-primitives
lesson: |-
  Les génériques n'acceptent pas les primitifs : une `Function<Integer, Integer>` **boxe** chaque entier. Pour l'éviter,
  `java.util.function` propose des versions spécialisées pour `int`, `long` et `double` :

  | Famille | Exemples | Rôle |
  |---|---|---|
  | `IntXxx` | `IntPredicate`, `IntFunction<R>`, `IntConsumer`, `IntSupplier`, `IntUnaryOperator`, `IntBinaryOperator` | l'entrée est un `int` |
  | `ToIntXxx` | `ToIntFunction<T>`, `ToIntBiFunction<T, U>` | la sortie est un `int` |
  | `IntToXxx` | `IntToLongFunction`, `IntToDoubleFunction` | `int` vers un autre primitif |
  | `ObjIntConsumer<T>` | | un objet et un `int` |
  | `BooleanSupplier` | | le seul pour `boolean` |

  Les méthodes portent le nom du type : `applyAsInt`, `getAsDouble`, `applyAsLong`.

  ```java
  IntPredicate pair = n -> n % 2 == 0;
  ToIntFunction<String> longueur = String::length;
  IntBinaryOperator somme = Integer::sum;

  int total = mots.stream().mapToInt(longueur).sum();   // mapToInt attend une ToIntFunction
  ```

  - Elles vont de pair avec `IntStream`, `LongStream` et `DoubleStream`, et avec `Comparator.comparingInt`.
  - Il n'y a rien pour `byte`, `short`, `char` et `float` : on passe par `int` ou `double`.
  - Le gain compte sur de gros volumes ou des boucles chaudes ; ailleurs, la lisibilité prime.

  **Piège classique** : `stream.map(String::length).reduce(0, Integer::sum)`. Chaque longueur est boxée ;
  `mapToInt(String::length).sum()` reste en primitifs.

  **En entretien** : « Les versions `Int`, `Long`, `Double` évitent le boxing : `IntPredicate`, `ToIntFunction`,
  `applyAsInt` ; elles alimentent les streams primitifs. »
cards:
  - key: pourquoi
    format: course
    question: Pourquoi existe-t-il `IntPredicate` alors que `Predicate<Integer>` existe ?
    answer: "Pour éviter le boxing : les génériques n'acceptent que des objets, donc `Predicate<Integer>` emballe chaque `int` dans un `Integer`."
  - key: nommage
    format: course
    question: Que signifient les préfixes `Int` et `ToInt` dans `IntFunction<R>` et `ToIntFunction<T>` ?
    answer: '`IntFunction<R>` prend un `int` et renvoie un R ; `ToIntFunction<T>` prend un T et renvoie un `int` (méthode `applyAsInt`).'
  - key: types-absents
    format: course
    question: Existe-t-il un `CharPredicate` ou un `FloatFunction` ?
    answer: "Non : seuls `int`, `long` et `double` ont leurs interfaces (plus `BooleanSupplier`) ; on passe par `int` ou `double`."
  - key: methodes
    format: course
    question: Comment s'appelle la méthode d'un `ToDoubleFunction<T>` ?
    answer: '`applyAsDouble`.'
  - key: vf-boxing
    format: true-false
    question: Une `Function<Integer, Integer>` manipule des `int` sans boxing.
    truth: false
    answer: Elle manipule des `Integer` ; `IntUnaryOperator` évite le boxing.
  - key: vf-mapto
    format: true-false
    question: "`mapToInt` attend une `ToIntFunction`."
    truth: true
    answer: Il produit un `IntStream`.
  - key: vf-boolean
    format: true-false
    question: "`BooleanSupplier` est la seule spécialisation pour `boolean`."
    truth: true
    answer: Pour tester, `Predicate` renvoie déjà un `boolean` primitif.
  - key: vf-int-supplier
    format: true-false
    question: La méthode d'un `IntSupplier` s'appelle `get`.
    truth: false
    answer: '`getAsInt`.'
  - key: qcm-type
    format: multiple-choice
    question: Quel type pour une fonction qui donne le prix en centimes (`int`) d'un `Produit` ?
    choices:
      - text: "`ToIntFunction<Produit>`"
        correct: true
      - text: "`IntFunction<Produit>`"
        correct: false
      - text: "`Function<Produit, int>`"
        correct: false
      - text: "`IntSupplier`"
        correct: false
    answer: '`Function<Produit, int>` ne compile pas ; `IntFunction` prendrait un `int` en entrée.'
  - key: qcm-comparing
    format: multiple-choice
    question: Quelle écriture évite le boxing pour trier des produits par stock (`int`) ?
    choices:
      - text: "`Comparator.comparingInt(Produit::stock)`"
        correct: true
      - text: "`Comparator.comparing(Produit::stock)`"
        correct: false
      - text: "`(a, b) -> Integer.valueOf(a.stock()).compareTo(b.stock())`"
        correct: false
      - text: "`Comparator.naturalOrder()`"
        correct: false
    answer: '`comparingInt` prend une `ToIntFunction`.'
  - key: qcm-binaire
    format: multiple-choice
    question: Quelles références conviennent à un `IntBinaryOperator` ?
    choices:
      - text: "`Integer::sum`"
        correct: true
      - text: "`Math::max`"
        correct: true
      - text: "`String::length`"
        correct: false
      - text: "`Integer::toString`"
        correct: false
    answer: Deux `int` en entrée, un `int` en sortie.
  - key: qcm-somme
    format: multiple-choice
    question: Quelle somme des longueurs reste en primitifs ?
    choices:
      - text: "`mots.stream().mapToInt(String::length).sum()`"
        correct: true
      - text: "`mots.stream().map(String::length).reduce(0, Integer::sum)`"
        correct: false
      - text: "`mots.stream().collect(Collectors.summingInt(String::length))`, qui renvoie un `Integer`"
        correct: false
      - text: "`mots.stream().map(String::length).toList()`"
        correct: false
    answer: '`summingInt` calcule en primitifs mais renvoie un `Integer` boxé ; `mapToInt(...).sum()` donne un `int`.'
  - key: code-int-predicate
    format: code-output
    question: |-
      ```java
      IntPredicate pair = n -> n % 2 == 0;
      System.out.println(IntStream.rangeClosed(1, 10).filter(pair.negate()).sum());
      ```
    answer: '`25` : la somme des impairs de 1 à 9.'
    check:
      output: "25"
  - key: code-to-int
    format: code-output
    question: |-
      ```java
      ToIntFunction<String> longueur = String::length;
      System.out.println(longueur.applyAsInt("lambda") + Stream.of("a", "bb").mapToInt(longueur).sum());
      ```
    answer: '`9` : 6 + 3.'
    check:
      output: "9"
  - key: code-int-function
    format: code-output
    question: |-
      ```java
      IntFunction<String> etoiles = n -> "*".repeat(n);
      IntUnaryOperator triple = n -> n * 3;
      System.out.println(etoiles.apply(triple.applyAsInt(1)));
      ```
    answer: '`***`.'
    check:
      output: "***"
  - key: code-binary
    format: code-output
    question: |-
      ```java
      IntBinaryOperator max = Math::max;
      System.out.println(IntStream.of(4, 9, 2).reduce(Integer.MIN_VALUE, max));
      ```
    answer: '`9`.'
    check:
      output: "9"
