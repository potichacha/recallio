notion: streams-terminales
lesson: |-
  L'opération terminale déclenche le pipeline et produit le résultat :

  | Opération | Résultat |
  |---|---|
  | `forEach(action)` | rien (un effet) ; `forEachOrdered` garantit l'ordre en parallèle |
  | `count()` | `long` |
  | `anyMatch`, `allMatch`, `noneMatch` | `boolean`, avec court-circuit |
  | `findFirst()`, `findAny()` | `Optional<T>` |
  | `min(comparateur)`, `max(comparateur)` | `Optional<T>` |
  | `toList()`, `collect(...)`, `toArray()` | une collection, un tableau |
  | `reduce(...)` | une valeur combinée |

  ```java
  boolean urgence = tickets.stream().anyMatch(t -> t.priorite() == Priorite.HAUTE);
  Optional<Produit> moinsCher = produits.stream().min(Comparator.comparing(Produit::prix));
  Optional<Client> premierVip = clients.stream().filter(Client::vip).findFirst();
  ```

  - Sur un stream **vide** : `allMatch` vaut `true`, `anyMatch` `false`, `noneMatch` `true` (vérité « vide »).
  - `findFirst`, `min` et `max` renvoient un **`Optional`**, vide pour un stream vide : on le traite (`orElse`,
    `ifPresent`) au lieu d'appeler `get()`.
  - `findAny` peut renvoyer n'importe quel élément : plus rapide en parallèle, à n'utiliser que si l'élément n'importe
    pas.
  - `anyMatch` vaut mieux que `filter(...).count() > 0` : il s'arrête au premier élément trouvé.
  - `forEach` est une **fin** de pipeline pour un effet (afficher, envoyer) ; pour construire une collection, on
    utilise `toList` ou `collect`.

  **Piège classique** : `liste.stream().filter(p).findFirst().get()`. Si rien ne correspond, `NoSuchElementException` ;
  on choisit `orElse`, `orElseThrow(() -> new ClientIntrouvable(id))` ou `ifPresent`.

  **En entretien** : « `anyMatch` court-circuite, `findFirst`, `min` et `max` renvoient un `Optional`, et `allMatch` sur
  un stream vide vaut `true`. »
cards:
  - key: findfirst-vs-findany
    format: course
    question: "Quelle différence entre `findFirst` et `findAny` ?"
    choices:
      - {text: "`findFirst` respecte l'ordre ; `findAny` peut renvoyer n'importe lequel, plus vite en parallèle", correct: true}
      - {text: "`findAny` respecte l'ordre ; `findFirst` peut renvoyer n'importe lequel, plus vite en parallèle", correct: false}
      - {text: "`findFirst` renvoie un `Optional`, `findAny` l'élément lui-même, ou `null` s'il n'y en a pas", correct: false}
      - {text: "`findAny` parcourt tout le stream, `findFirst` s'arrête au premier élément trouvé", correct: false}
    answer: "`findFirst` respecte l'ordre de rencontre ; `findAny` peut renvoyer n'importe quel élément, plus rapide en parallèle. Les deux renvoient un `Optional` et court-circuitent."
  - key: match-vide
    format: course
    question: "Que valent `allMatch`, `anyMatch` et `noneMatch` sur un stream vide ?"
    choices:
      - {text: "`true`, `false` et `true`", correct: true}
      - {text: "`false`, `false` et `true`", correct: false}
      - {text: "`false`, `false` et `false`", correct: false}
      - {text: "`true`, `true` et `true`", correct: false}
    answer: '`true`, `false` et `true` : « tous » et « aucun » sont vrais quand il n''y a aucun élément.'
  - key: min-max
    format: course
    question: "Pourquoi `min` et `max` d'un stream renvoient-ils un `Optional` ?"
    choices:
      - {text: "Parce que le stream peut être vide : il n'a alors ni minimum ni maximum", correct: true}
      - {text: "Parce que le comparateur peut renvoyer `null` pour deux éléments égaux", correct: false}
      - {text: "Pour pouvoir les enchaîner avec `map` et `filter`, comme un stream", correct: false}
      - {text: "Parce que deux éléments peuvent être ex aequo, et l'`Optional` les garde", correct: false}
    answer: "Parce que le stream peut être vide : il n'y a alors ni minimum ni maximum."
  - key: any-vs-count
    format: course
    question: "Pourquoi préférer `anyMatch(p)` à `filter(p).count() > 0` ?"
    choices:
      - {text: "`anyMatch` s'arrête au premier élément qui correspond ; `count` parcourt tout", correct: true}
      - {text: "`count` s'arrête au premier élément qui correspond ; `anyMatch` parcourt tout", correct: false}
      - {text: "`filter(p).count()` ne compile pas sur un stream de types primitifs", correct: false}
      - {text: "`anyMatch` s'exécute toujours en parallèle, `count` jamais", correct: false}
    answer: '`anyMatch` s''arrête au premier élément qui correspond ; `count` parcourt tout le stream.'
  - key: vf-all-match
    format: true-false
    question: "`Stream.empty().allMatch(x -> false)` vaut `true`."
    truth: true
    answer: Aucun élément ne contredit le prédicat.
  - key: vf-count-type
    format: true-false
    question: "`count()` renvoie un `int`."
    truth: false
    answer: Un `long`.
  - key: vf-find-first-optional
    format: true-false
    question: "`findFirst()` renvoie `null` pour un stream vide."
    truth: false
    answer: Un `Optional` vide.
  - key: vf-for-each-ordre
    format: true-false
    question: "Sur un stream parallèle, `forEach` respecte l'ordre de la source."
    truth: false
    answer: Il faut `forEachOrdered`.
  - key: qcm-optional
    format: multiple-choice
    question: "Laquelle de ces opérations renvoie un `Optional` ?"
    choices:
      - {text: "`findFirst()`", correct: true}
      - {text: "`count()`", correct: false}
      - {text: "`anyMatch(p)`", correct: false}
      - {text: "`toList()`", correct: false}
    answer: "`findFirst` (comme `max(comparateur)`) renvoie un `Optional`, vide pour un stream vide. `count` renvoie un `long`, `anyMatch` un `boolean`, `toList` une liste, vide au besoin."
  - key: qcm-existe
    format: multiple-choice
    question: Comment savoir si au moins une commande dépasse 1 000 € ?
    choices:
      - text: "`commandes.stream().anyMatch(c -> c.total() > 1000)`"
        correct: true
      - text: "`commandes.stream().filter(c -> c.total() > 1000).count() > 0`, qui parcourt tout"
        correct: false
      - text: "`commandes.stream().allMatch(c -> c.total() > 1000)`"
        correct: false
      - text: "`commandes.stream().findAny(c -> c.total() > 1000)`"
        correct: false
    answer: '`findAny` ne prend pas de prédicat.'
  - key: qcm-plus-cher
    format: multiple-choice
    question: Comment obtenir le produit le plus cher ?
    choices:
      - text: "`produits.stream().max(Comparator.comparing(Produit::prix))`"
        correct: true
      - text: "`produits.stream().sorted(comparing(Produit::prix).reversed()).findFirst()`, plus coûteux"
        correct: false
      - text: "`produits.stream().max()`"
        correct: false
      - text: "`produits.stream().mapToDouble(Produit::prix).max()`, qui perd le produit"
        correct: false
    answer: '`max` est en O(n), sans tri ; la dernière donne le prix, pas le produit.'
  - key: qcm-get
    format: multiple-choice
    question: Comment traiter le `Optional<Client>` de `findFirst()` quand le client doit exister ?
    choices:
      - text: "`orElseThrow(() -> new ClientIntrouvable(id))`"
        correct: true
      - text: "`get()`, sans vérifier"
        correct: false
      - text: "`orElse(null)`, puis l'utiliser directement"
        correct: false
      - text: "Le comparer à `null`"
        correct: false
    answer: Une exception métier explicite dit ce qui manque.
  - key: trous-any
    format: fill-in
    question: |-
      Complète pour savoir si un ticket est urgent :
      ```java
      boolean urgent = tickets.stream().___(Ticket::urgent);
      ```
    blanks: [[anyMatch]]
    answer: '`anyMatch` court-circuite au premier ticket urgent.'
  - key: trous-none
    format: fill-in
    question: |-
      Complète pour vérifier qu'aucune ligne n'a de quantité négative :
      ```java
      boolean valide = lignes.stream().___(l -> l.quantite() < 0);
      ```
    blanks: [[noneMatch]]
    answer: Vrai si aucun élément ne satisfait le prédicat.
  - key: trous-min
    format: fill-in
    question: |-
      Complète pour obtenir le vol le moins cher :
      ```java
      Optional<Vol> vol = vols.stream().___(Comparator.comparing(Vol::prix));
      ```
    blanks: [[min]]
    answer: '`min` renvoie un `Optional`.'
  - key: trous-find-first
    format: fill-in
    question: |-
      Complète pour trouver le premier administrateur :
      ```java
      Optional<Utilisateur> admin = utilisateurs.stream().filter(Utilisateur::admin).___();
      ```
    blanks: [[findFirst]]
    answer: '`findFirst` respecte l''ordre de la liste.'
  - key: code-match
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = List.of(2, 4, 7);
      System.out.println(l.stream().anyMatch(x -> x > 5) + " " + l.stream().allMatch(x -> x % 2 == 0)
              + " " + Stream.<Integer>empty().allMatch(x -> x > 100));
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`true false false`", correct: false}
      - {text: "`false false true`", correct: false}
      - {text: "`true true true`", correct: false}
    answer: "`true false true` : 7 dépasse 5, 7 est impair, et `allMatch` est vrai sur un stream vide."
    check:
      output: "true false true"
  - key: code-min-max
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> mots = List.of("kiwi", "ananas", "fraise");
      System.out.println(mots.stream().max(Comparator.comparing(String::length)).get() + " "
              + mots.stream().min(Comparator.naturalOrder()).get());
      ```
    choices:
      - {text: "`ananas ananas`", correct: true}
      - {text: "`fraise ananas`", correct: false}
      - {text: "`ananas kiwi`", correct: false}
      - {text: "`kiwi ananas`", correct: false}
    answer: '`ananas ananas` : « ananas » est le plus long (premier des deux de six lettres) et le premier alphabétiquement.'
    check:
      output: "ananas ananas"
  - key: code-court-circuit
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      boolean trouve = Stream.of(1, 2, 3, 4)
              .peek(x -> System.out.print(x))
              .anyMatch(x -> x == 2);
      System.out.println(" " + trouve);
      ```
    choices:
      - {text: "`12 true`", correct: true}
      - {text: "`1234 true`", correct: false}
      - {text: "`2 true`", correct: false}
      - {text: "`12 false`", correct: false}
    answer: '`12 true` : `anyMatch` s''arrête au 2.'
    check:
      output: "12 true"
  - key: code-find-first-vide
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Stream.of(1, 3).filter(x -> x % 2 == 0).findFirst().orElse(-1)
              + " " + Stream.of(1, 3).count());
      ```
    choices:
      - {text: "`-1 2`", correct: true}
      - {text: "`null 2`", correct: false}
      - {text: "`-1 0`", correct: false}
      - {text: "Une `NoSuchElementException`", correct: false}
    answer: "`-1 2` : aucun nombre pair, `orElse` fournit -1 ; le second stream compte ses deux éléments."
    check:
      output: "-1 2"
  - key: bug-count-existence
    format: bug-fix
    question: |-
      Comment simplifier et accélérer ce test ?
      ```java
      if (utilisateurs.stream().filter(u -> u.email().equals(email)).count() > 0) { ... }
      ```
    choices:
      - {text: "`utilisateurs.stream().anyMatch(u -> u.email().equals(email))`", correct: true}
      - {text: "`utilisateurs.stream().allMatch(u -> u.email().equals(email))`", correct: false}
      - {text: "`utilisateurs.parallelStream().filter(u -> u.email().equals(email)).count() > 0`", correct: false}
      - {text: "`utilisateurs.stream().filter(u -> u.email().equals(email)).toList().size() > 0`", correct: false}
    answer: |-
      ```java
      if (utilisateurs.stream().anyMatch(u -> u.email().equals(email))) { ... }
      ```
      `anyMatch` s'arrête au premier utilisateur trouvé ; `count` parcourt toute la liste.
  - key: bug-get
    format: bug-fix
    question: |-
      Ce code lève une `NoSuchElementException` sans message utile. Quelle correction est la bonne ?
      ```java
      Client c = clients.stream().filter(x -> x.id().equals(id)).findFirst().get();
      ```
    choices:
      - {text: "`.findFirst().orElseThrow(() -> new ClientIntrouvableException(id))`", correct: true}
      - {text: "`.findFirst().orElseThrow()`, sans argument, qui lève la même exception", correct: false}
      - {text: "`.findAny().get()`, qui s'arrête plus tôt sur la liste", correct: false}
      - {text: "`.findFirst().get()` dans un `try` qui ignore l'exception", correct: false}
    answer: |-
      ```java
      Client c = clients.stream()
              .filter(x -> x.id().equals(id))
              .findFirst()
              .orElseThrow(() -> new ClientIntrouvableException(id));
      ```
      Un `Optional` vide se traite explicitement : une exception métier dit quel client manque.
  - key: bug-sorted-first
    format: bug-fix
    question: |-
      Comment simplifier ce code ?
      ```java
      Produit moinsCher = produits.stream().sorted(Comparator.comparing(Produit::prix)).findFirst().orElseThrow();
      ```
    choices:
      - {text: "`produits.stream().min(Comparator.comparing(Produit::prix)).orElseThrow()`", correct: true}
      - {text: "`produits.stream().max(Comparator.comparing(Produit::prix)).orElseThrow()`", correct: false}
      - {text: "`produits.stream().sorted(Comparator.comparing(Produit::prix)).findAny().orElseThrow()`", correct: false}
      - {text: "`produits.stream().sorted().findFirst().orElseThrow()`", correct: false}
    answer: |-
      ```java
      Produit moinsCher = produits.stream().min(Comparator.comparing(Produit::prix)).orElseThrow();
      ```
      `min` trouve le plus petit en un parcours (O(n)) ; trier coûte O(n log n) et de la mémoire.
  - key: bug-foreach-collecte
    format: bug-fix
    question: |-
      Comment réécrire ce code sans effet de bord ?
      ```java
      List<String> emails = new ArrayList<>();
      clients.stream().filter(Client::actif).forEach(c -> emails.add(c.email()));
      ```
    choices:
      - {text: "`clients.stream().filter(Client::actif).map(Client::email).toList()`", correct: true}
      - {text: "`clients.parallelStream().filter(Client::actif).forEach(c -> emails.add(c.email()))`", correct: false}
      - {text: "`clients.stream().filter(Client::actif).peek(c -> emails.add(c.email())).toList()`", correct: false}
      - {text: "`clients.stream().map(Client::email).filter(Client::actif).toList()`", correct: false}
    answer: |-
      ```java
      List<String> emails = clients.stream().filter(Client::actif).map(Client::email).toList();
      ```
      `forEach` qui remplit une liste extérieure est fragile (et faux en parallèle) ; `map` puis `toList` construit le
      résultat directement.
