notion: streams-terminales
lesson: |-
  L'opération terminale déclenche le pipeline et produit le résultat :

  | Opération | Résultat |
  |---|---|
  | `forEach(action)` | rien (un effet) ; `forEachOrdered` garantit l'ordre en parallèle |
  | `count()` | `long` |
  | `anyMatch`, `allMatch`, `noneMatch` | `boolean`, avec court-circuit |
  | `findFirst()`, `findAny()` | `Optional<T>` |
  | `min(comparateur)`, `max(comparateur)` | `Optional<T>` |
  | `toList()`, `collect(...)`, `toArray()` | une collection, un tableau |
  | `reduce(...)` | une valeur combinée |

  ```java
  boolean urgence = tickets.stream().anyMatch(t -> t.priorite() == Priorite.HAUTE);
  Optional<Produit> moinsCher = produits.stream().min(Comparator.comparing(Produit::prix));
  Optional<Client> premierVip = clients.stream().filter(Client::vip).findFirst();
  ```

  - Sur un stream **vide** : `allMatch` vaut `true`, `anyMatch` `false`, `noneMatch` `true` (vérité « vide »).
  - `findFirst`, `min` et `max` renvoient un **`Optional`**, vide pour un stream vide : on le traite (`orElse`,
    `ifPresent`) au lieu d'appeler `get()`.
  - `findAny` peut renvoyer n'importe quel élément : plus rapide en parallèle, à n'utiliser que si l'élément n'importe
    pas.
  - `anyMatch` vaut mieux que `filter(...).count() > 0` : il s'arrête au premier élément trouvé.
  - `forEach` est une **fin** de pipeline pour un effet (afficher, envoyer) ; pour construire une collection, on
    utilise `toList` ou `collect`.

  **Piège classique** : `liste.stream().filter(p).findFirst().get()`. Si rien ne correspond, `NoSuchElementException` ;
  on choisit `orElse`, `orElseThrow(() -> new ClientIntrouvable(id))` ou `ifPresent`.

  **En entretien** : « `anyMatch` court-circuite, `findFirst`, `min` et `max` renvoient un `Optional`, et `allMatch` sur
  un stream vide vaut `true`. »
cards:
  - key: findfirst-vs-findany
    format: course
    question: findFirst vs findAny ?
    answer: findFirst respecte l'ordre ; findAny peut renvoyer n'importe quel élément, plus rapide en parallèle.
  - key: match-vide
    format: course
    question: Que valent `allMatch`, `anyMatch` et `noneMatch` sur un stream vide ?
    answer: '`true`, `false` et `true` : « tous » et « aucun » sont vrais quand il n''y a aucun élément.'
  - key: min-max
    format: course
    question: Pourquoi `min` et `max` renvoient-ils un `Optional` ?
    answer: "Parce que le stream peut être vide : il n'y a alors ni minimum ni maximum."
  - key: any-vs-count
    format: course
    question: Pourquoi préférer `anyMatch(p)` à `filter(p).count() > 0` ?
    answer: '`anyMatch` s''arrête au premier élément qui correspond ; `count` parcourt tout le stream.'
  - key: vf-all-match
    format: true-false
    question: "`Stream.empty().allMatch(x -> false)` vaut `true`."
    truth: true
    answer: Aucun élément ne contredit le prédicat.
  - key: vf-count-type
    format: true-false
    question: "`count()` renvoie un `int`."
    truth: false
    answer: Un `long`.
  - key: vf-find-first-optional
    format: true-false
    question: "`findFirst()` renvoie `null` pour un stream vide."
    truth: false
    answer: Un `Optional` vide.
  - key: vf-for-each-ordre
    format: true-false
    question: "Sur un stream parallèle, `forEach` respecte l'ordre de la source."
    truth: false
    answer: Il faut `forEachOrdered`.
  - key: qcm-optional
    format: multiple-choice
    question: Lesquelles renvoient un `Optional` ?
    choices:
      - text: "`findFirst()`"
        correct: true
      - text: "`max(comparateur)`"
        correct: true
      - text: "`count()`"
        correct: false
      - text: "`anyMatch(p)`"
        correct: false
    answer: '`count` renvoie un `long`, `anyMatch` un `boolean`.'
  - key: qcm-existe
    format: multiple-choice
    question: Comment savoir si au moins une commande dépasse 1 000 € ?
    choices:
      - text: "`commandes.stream().anyMatch(c -> c.total() > 1000)`"
        correct: true
      - text: "`commandes.stream().filter(c -> c.total() > 1000).count() > 0`, qui parcourt tout"
        correct: false
      - text: "`commandes.stream().allMatch(c -> c.total() > 1000)`"
        correct: false
      - text: "`commandes.stream().findAny(c -> c.total() > 1000)`"
        correct: false
    answer: '`findAny` ne prend pas de prédicat.'
  - key: qcm-plus-cher
    format: multiple-choice
    question: Comment obtenir le produit le plus cher ?
    choices:
      - text: "`produits.stream().max(Comparator.comparing(Produit::prix))`"
        correct: true
      - text: "`produits.stream().sorted(comparing(Produit::prix).reversed()).findFirst()`, plus coûteux"
        correct: false
      - text: "`produits.stream().max()`"
        correct: false
      - text: "`produits.stream().mapToDouble(Produit::prix).max()`, qui perd le produit"
        correct: false
    answer: '`max` est en O(n), sans tri ; la dernière donne le prix, pas le produit.'
  - key: qcm-get
    format: multiple-choice
    question: Comment traiter le `Optional<Client>` de `findFirst()` quand le client doit exister ?
    choices:
      - text: "`orElseThrow(() -> new ClientIntrouvable(id))`"
        correct: true
      - text: "`get()`, sans vérifier"
        correct: false
      - text: "`orElse(null)`, puis l'utiliser directement"
        correct: false
      - text: "Le comparer à `null`"
        correct: false
    answer: Une exception métier explicite dit ce qui manque.
  - key: trous-any
    format: fill-in
    question: |-
      Complétez pour savoir si un ticket est urgent :
      ```java
      boolean urgent = tickets.stream().___(Ticket::urgent);
      ```
    blanks: [[anyMatch]]
    answer: '`anyMatch` court-circuite au premier ticket urgent.'
  - key: trous-none
    format: fill-in
    question: |-
      Complétez pour vérifier qu'aucune ligne n'a de quantité négative :
      ```java
      boolean valide = lignes.stream().___(l -> l.quantite() < 0);
      ```
    blanks: [[noneMatch]]
    answer: Vrai si aucun élément ne satisfait le prédicat.
  - key: trous-min
    format: fill-in
    question: |-
      Complétez pour obtenir le vol le moins cher :
      ```java
      Optional<Vol> vol = vols.stream().___(Comparator.comparing(Vol::prix));
      ```
    blanks: [[min]]
    answer: '`min` renvoie un `Optional`.'
  - key: trous-find-first
    format: fill-in
    question: |-
      Complétez pour trouver le premier administrateur :
      ```java
      Optional<Utilisateur> admin = utilisateurs.stream().filter(Utilisateur::admin).___();
      ```
    blanks: [[findFirst]]
    answer: '`findFirst` respecte l''ordre de la liste.'
  - key: code-match
    format: code-output
    question: |-
      ```java
      List<Integer> l = List.of(2, 4, 7);
      System.out.println(l.stream().anyMatch(x -> x > 5) + " " + l.stream().allMatch(x -> x % 2 == 0)
              + " " + Stream.<Integer>empty().allMatch(x -> x > 100));
      ```
    answer: '`true false true`.'
    check:
      output: "true false true"
  - key: code-min-max
    format: code-output
    question: |-
      ```java
      List<String> mots = List.of("kiwi", "ananas", "fraise");
      System.out.println(mots.stream().max(Comparator.comparing(String::length)).get() + " "
              + mots.stream().min(Comparator.naturalOrder()).get());
      ```
    answer: '`ananas ananas` : « ananas » est le plus long (premier des deux de six lettres) et le premier alphabétiquement.'
    check:
      output: "ananas ananas"
  - key: code-court-circuit
    format: code-output
    question: |-
      ```java
      boolean trouve = Stream.of(1, 2, 3, 4)
              .peek(x -> System.out.print(x))
              .anyMatch(x -> x == 2);
      System.out.println(" " + trouve);
      ```
    answer: '`12 true` : `anyMatch` s''arrête au 2.'
    check:
      output: "12 true"
  - key: code-find-first-vide
    format: code-output
    question: |-
      ```java
      System.out.println(Stream.of(1, 3).filter(x -> x % 2 == 0).findFirst().orElse(-1)
              + " " + Stream.of(1, 3).count());
      ```
    answer: '`-1 2`.'
    check:
      output: "-1 2"
  - key: bug-count-existence
    format: bug-fix
    question: |-
      Simplifiez et accélérez :
      ```java
      if (utilisateurs.stream().filter(u -> u.email().equals(email)).count() > 0) { ... }
      ```
    answer: |-
      ```java
      if (utilisateurs.stream().anyMatch(u -> u.email().equals(email))) { ... }
      ```
      `anyMatch` s'arrête au premier utilisateur trouvé ; `count` parcourt toute la liste.
  - key: bug-get
    format: bug-fix
    question: |-
      Ce code lève une `NoSuchElementException` sans message utile :
      ```java
      Client c = clients.stream().filter(x -> x.id().equals(id)).findFirst().get();
      ```
    answer: |-
      ```java
      Client c = clients.stream()
              .filter(x -> x.id().equals(id))
              .findFirst()
              .orElseThrow(() -> new ClientIntrouvableException(id));
      ```
      Un `Optional` vide se traite explicitement : une exception métier dit quel client manque.
  - key: bug-sorted-first
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      Produit moinsCher = produits.stream().sorted(Comparator.comparing(Produit::prix)).findFirst().orElseThrow();
      ```
    answer: |-
      ```java
      Produit moinsCher = produits.stream().min(Comparator.comparing(Produit::prix)).orElseThrow();
      ```
      `min` trouve le plus petit en un parcours (O(n)) ; trier coûte O(n log n) et de la mémoire.
  - key: bug-foreach-collecte
    format: bug-fix
    question: |-
      Réécrivez sans effet de bord :
      ```java
      List<String> emails = new ArrayList<>();
      clients.stream().filter(Client::actif).forEach(c -> emails.add(c.email()));
      ```
    answer: |-
      ```java
      List<String> emails = clients.stream().filter(Client::actif).map(Client::email).toList();
      ```
      `forEach` qui remplit une liste extérieure est fragile (et faux en parallèle) ; `map` puis `toList` construit le
      résultat directement.
