notion: tomap-doublons
lesson: |-
  `Collectors.toMap(cle, valeur)` construit une `Map`, mais **lève une `IllegalStateException`** dès que deux éléments
  produisent la **même clé** : il ne sait pas laquelle garder.

  ```java
  Map<String, Client> parEmail = clients.stream()
          .collect(toMap(Client::email, c -> c));                 // IllegalStateException: Duplicate key ...

  Map<String, Client> parEmail = clients.stream()
          .collect(toMap(Client::email, c -> c, (premier, second) -> premier));   // garde le premier

  Map<String, Integer> totaux = ventes.stream()
          .collect(toMap(Vente::produit, Vente::quantite, Integer::sum));         // additionne

  Map<String, Client> trie = clients.stream()
          .collect(toMap(Client::email, c -> c, (a, b) -> a, TreeMap::new));       // choisir la map
  ```

  - Le troisième argument, la **fonction de fusion**, décide : garder le premier, le dernier, combiner, ou lever une
    exception métier explicite.
  - Le quatrième argument choisit l'implémentation de la map (par défaut une `HashMap`, sans ordre).
  - `toMap` **refuse les valeurs `null`** (`NullPointerException`, même sans doublon) ; les clés `null` passent avec une
    `HashMap`.
  - Si plusieurs valeurs par clé sont attendues, ce n'est pas `toMap` mais **`groupingBy`**.
  - `toUnmodifiableMap` (Java 10) existe aussi, avec ou sans fonction de fusion.

  **Piège classique** : un `toMap(Client::email, ...)` qui marche en test, puis plante en production le jour où deux
  comptes partagent un email. Il faut décider, dès l'écriture, ce que signifie un doublon.

  **En entretien** : « `toMap` lève une exception sur les clés en double : je fournis une fonction de fusion, ou j'utilise
  `groupingBy` si plusieurs valeurs par clé sont normales ; et `toMap` refuse les valeurs `null`. »
cards:
  - key: piege-tomap
    format: course
    question: Piège du toMap ?
    answer: Exception sur clés dupliquées, fournir une merge function.
  - key: fusion
    format: course
    question: Que fait la fonction de fusion de `toMap(cle, valeur, fusion)` ?
    answer: Elle reçoit l'ancienne et la nouvelle valeur d'une clé en double et renvoie celle à garder (ou leur combinaison).
  - key: valeurs-null
    format: course
    question: Que se passe-t-il si la fonction de valeur de `toMap` renvoie `null` ?
    answer: Une `NullPointerException`, même sans doublon, car l'implémentation utilise `merge`.
  - key: grouping
    format: course
    question: Quand utiliser `groupingBy` plutôt que `toMap` ?
    answer: Quand plusieurs éléments par clé sont normaux et qu'on veut les garder (en liste ou agrégés), et non en choisir un.
  - key: vf-doublon
    format: true-false
    question: "Sans fonction de fusion, `toMap` garde la dernière valeur d'une clé en double."
    truth: false
    answer: Il lève une `IllegalStateException`.
  - key: vf-map-fabrique
    format: true-false
    question: "`toMap` permet de choisir l'implémentation de la map."
    truth: true
    answer: Avec le quatrième argument, par exemple `TreeMap::new`.
  - key: vf-null
    format: true-false
    question: "`toMap` accepte une valeur `null`."
    truth: false
    answer: Il lève une `NullPointerException`.
  - key: vf-somme
    format: true-false
    question: "`toMap(Vente::produit, Vente::quantite, Integer::sum)` additionne les quantités d'un même produit."
    truth: true
    answer: La fonction de fusion combine les valeurs.
  - key: qcm-garder-premier
    format: multiple-choice
    question: Comment indexer des utilisateurs par email en gardant le premier en cas de doublon ?
    choices:
      - text: "`toMap(User::email, u -> u, (a, b) -> a)`"
        correct: true
      - text: "`toMap(User::email, u -> u, (a, b) -> b)`"
        correct: false
      - text: "`toMap(User::email, u -> u)`"
        correct: false
      - text: "`groupingBy(User::email)`"
        correct: false
    answer: '`(a, b) -> b` garde le dernier ; sans fusion, exception ; `groupingBy` garde tout en liste.'
  - key: qcm-exception
    format: multiple-choice
    question: Quelle exception lève `toMap` sur une clé en double sans fonction de fusion ?
    choices:
      - text: "`IllegalStateException`"
        correct: true
      - text: "`IllegalArgumentException`"
        correct: false
      - text: "`DuplicateKeyException`"
        correct: false
      - text: "`ConcurrentModificationException`"
        correct: false
    answer: Avec un message « Duplicate key ... ».
  - key: qcm-plusieurs
    format: multiple-choice
    question: Un client peut avoir plusieurs commandes. Comment obtenir les commandes par client ?
    choices:
      - text: "`groupingBy(Commande::client)`"
        correct: true
      - text: "`toMap(Commande::client, c -> c)`"
        correct: false
      - text: "`toMap(Commande::client, c -> c, (a, b) -> a)`, qui perd des commandes"
        correct: false
      - text: "`partitioningBy(Commande::client)`"
        correct: false
    answer: '`toMap` garde une valeur par clé.'
  - key: qcm-ordre
    format: multiple-choice
    question: Comment garder l'ordre du stream dans la map produite ?
    choices:
      - text: "`toMap(cle, valeur, (a, b) -> a, LinkedHashMap::new)`"
        correct: true
      - text: "`toMap(cle, valeur)`"
        correct: false
      - text: "`sorted().collect(toMap(cle, valeur))`"
        correct: false
      - text: "`toMap(cle, valeur, LinkedHashMap::new)`"
        correct: false
    answer: "La fabrique est le quatrième argument : il faut fournir une fonction de fusion avant."
  - key: code-stream-of-collect-collectors-tomap
    format: code-output
    question: '`Stream.of("a", "a").collect(Collectors.toMap(x -> x, x -> 1));`'
    answer: IllegalStateException (clé dupliquée sans fonction de fusion).
    check:
      code: |-
        Stream.of("a", "a").collect(Collectors.toMap(x -> x, x -> 1));
      throws: IllegalStateException
  - key: code-fusion
    format: code-output
    question: |-
      ```java
      Map<String, Integer> compte = Stream.of("a", "bb", "a", "a")
              .collect(Collectors.toMap(s -> s, s -> 1, Integer::sum, TreeMap::new));
      System.out.println(compte);
      ```
    answer: '`{a=3, bb=1}`.'
    check:
      output: "{a=3, bb=1}"
  - key: code-null
    format: code-output
    question: |-
      ```java
      Map<String, String> m = new HashMap<>();
      m.put("a", null);
      System.out.println(m);
      Stream.of("a").collect(Collectors.toMap(s -> s, s -> null));
      ```
    answer: '`{a=null}`, puis une `NullPointerException` : une `HashMap` accepte `null`, pas `toMap`.'
    check:
      output: "{a=null}"
      throws: NullPointerException
  - key: code-premier-dernier
    format: code-output
    question: |-
      ```java
      record U(String email, int id) {}
      List<U> l = List.of(new U("x", 1), new U("x", 2));
      System.out.println(l.stream().collect(Collectors.toMap(U::email, U::id, (a, b) -> a)) + " "
              + l.stream().collect(Collectors.toMap(U::email, U::id, (a, b) -> b)));
      ```
    answer: '`{x=1} {x=2}`.'
    check:
      output: "{x=1} {x=2}"
  - key: bug-doublon-production
    format: bug-fix
    question: |-
      Ce code plante en production avec `IllegalStateException: Duplicate key` :
      ```java
      Map<String, Produit> parNom = produits.stream().collect(toMap(Produit::nom, p -> p));
      ```
      Deux produits peuvent porter le même nom ; on veut garder le moins cher.
    answer: |-
      ```java
      Map<String, Produit> parNom = produits.stream()
              .collect(toMap(Produit::nom, p -> p, BinaryOperator.minBy(comparing(Produit::prix))));
      ```
      La fonction de fusion dit quoi faire d'un doublon : ici, garder le moins cher.
  - key: bug-perte
    format: bug-fix
    question: |-
      Il manque des commandes dans l'écran « commandes par client » :
      ```java
      Map<Long, Commande> parClient = commandes.stream()
              .collect(toMap(Commande::clientId, c -> c, (a, b) -> b));
      ```
    answer: |-
      ```java
      Map<Long, List<Commande>> parClient = commandes.stream()
              .collect(groupingBy(Commande::clientId));
      ```
      La fusion gardait une seule commande par client et jetait les autres. Plusieurs valeurs par clé appellent
      `groupingBy`.
  - key: bug-valeur-null
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` quand un client n'a pas de téléphone :
      ```java
      Map<Long, String> telephones = clients.stream().collect(toMap(Client::id, Client::telephone));
      ```
    answer: |-
      ```java
      Map<Long, String> telephones = clients.stream()
              .filter(c -> c.telephone() != null)
              .collect(toMap(Client::id, Client::telephone));
      ```
      `toMap` refuse les valeurs `null`. On exclut les absents (ou on stocke un `Optional`, ou une valeur par défaut, selon
      le besoin).
  - key: bug-ordre
    format: bug-fix
    question: |-
      Le menu s'affiche dans le désordre, alors que les rubriques sont triées :
      ```java
      Map<String, Rubrique> menu = rubriques.stream()
              .sorted(comparing(Rubrique::position))
              .collect(toMap(Rubrique::code, r -> r));
      ```
    answer: |-
      ```java
      Map<String, Rubrique> menu = rubriques.stream()
              .sorted(comparing(Rubrique::position))
              .collect(toMap(Rubrique::code, r -> r, (a, b) -> a, LinkedHashMap::new));
      ```
      Une `HashMap` perd l'ordre du stream. Une `LinkedHashMap` le garde.
