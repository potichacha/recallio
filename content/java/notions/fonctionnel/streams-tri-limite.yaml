notion: streams-tri-limite
lesson: |-
  Plusieurs opérations intermédiaires réordonnent, dédoublonnent ou découpent un stream :

  | Opération | Effet |
  |---|---|
  | `sorted()`, `sorted(comparateur)` | trie (ordre naturel ou comparateur) ; tri stable |
  | `distinct()` | retire les doublons, selon `equals` et `hashCode`, en gardant la première occurrence |
  | `limit(n)` | garde les n premiers |
  | `skip(n)` | saute les n premiers |
  | `takeWhile(p)` (Java 9) | garde les éléments **tant que** p est vrai, puis s'arrête |
  | `dropWhile(p)` (Java 9) | saute les éléments tant que p est vrai, puis garde **tout le reste** |

  ```java
  Stream.of(1, 2, 5, 3, 6).takeWhile(x -> x < 4);   // 1, 2      (s'arrête à 5)
  Stream.of(1, 2, 5, 3, 6).filter(x -> x < 4);      // 1, 2, 3   (teste tout)
  Stream.of(1, 2, 5, 3, 6).dropWhile(x -> x < 4);   // 5, 3, 6

  produits.stream().sorted(comparing(Produit::prix)).skip(20).limit(10);   // une « page » de 10
  ```

  - `sorted` et `distinct` sont **avec état** : `sorted` doit tout recevoir avant d'émettre, `distinct` mémorise les
    éléments vus. Ils coûtent en mémoire et freinent le parallélisme.
  - `limit` et `takeWhile` **court-circuitent** : ils bornent un stream infini.
  - `takeWhile` et `dropWhile` n'ont de sens que sur un stream **ordonné** (sur des données triées, typiquement).
  - Paginer avec `skip`/`limit` en mémoire suppose d'avoir tout chargé : pour une base, on pagine dans la requête.

  **Piège classique** : `takeWhile` à la place de `filter` sur des données non triées. Il s'arrête au premier élément qui
  échoue et perd tous les suivants, même ceux qui satisfont le prédicat.

  **En entretien** : « `filter` teste tout, `takeWhile` s'arrête au premier échec ; `sorted` et `distinct` ont un état,
  `limit` court-circuite. »
cards:
  - key: takewhile-vs-filter
    format: course
    question: "Quelle différence entre `takeWhile` et `filter` ?"
    choices:
      - {text: "`filter` teste tous les éléments ; `takeWhile` s'arrête au premier qui échoue", correct: true}
      - {text: "`takeWhile` teste tous les éléments ; `filter` s'arrête au premier qui échoue", correct: false}
      - {text: "`takeWhile` garde les éléments qui échouent au prédicat, `filter` les autres", correct: false}
      - {text: "Aucune sur un stream fini : `takeWhile` ne sert que sur un stream infini", correct: false}
    answer: filter teste tous les éléments ; takeWhile s'arrête au premier élément qui échoue.
  - key: operation-stateful
    format: course
    question: "Qu'est-ce qu'une opération avec état (stateful) dans un stream ?"
    choices:
      - {text: "Une opération qui doit voir plusieurs éléments, voire tous, avant d'émettre : `sorted`, `distinct`", correct: true}
      - {text: "Une opération qui modifie un état extérieur au stream, comme un compteur partagé entre threads", correct: false}
      - {text: "Une opération terminale, qui garde le résultat final en mémoire une fois le parcours fini", correct: false}
      - {text: "Une opération qui traite chaque élément indépendamment des autres, comme `map` ou `filter`", correct: false}
    answer: 'sorted, distinct : elles ont besoin de voir plusieurs éléments (voire tous) avant d''émettre.'
  - key: distinct
    format: course
    question: "Sur quoi `distinct` se fonde-t-il pour repérer les doublons ?"
    choices:
      - {text: "Sur `equals` et `hashCode`, en gardant la première occurrence", correct: true}
      - {text: "Sur `==`, en gardant la dernière occurrence de chaque objet", correct: false}
      - {text: "Sur `compareTo`, en triant d'abord les éléments du stream", correct: false}
      - {text: "Sur `toString`, en comparant le texte de chaque élément", correct: false}
    answer: Sur `equals` et `hashCode` ; il garde la première occurrence (sur un stream ordonné).
  - key: drop-while
    format: course
    question: "Que fait `dropWhile(p)` sur un stream ?"
    choices:
      - {text: "Il saute les éléments tant que `p` est vrai, puis garde tous les suivants", correct: true}
      - {text: "Il retire tous les éléments qui satisfont `p`, où qu'ils soient dans le stream", correct: false}
      - {text: "Il garde les éléments tant que `p` est vrai, puis arrête le stream", correct: false}
      - {text: "Il saute les éléments tant que `p` est faux, puis garde tous les suivants", correct: false}
    answer: "Il saute les éléments tant que `p` est vrai, puis garde tous les éléments suivants, même ceux qui satisfont `p`. Retirer tous ceux qui satisfont `p`, c'est un `filter` inversé."
  - key: vf-take-while
    format: true-false
    question: "`Stream.of(1, 5, 2).takeWhile(x -> x < 3)` donne `1, 2`."
    truth: false
    answer: "Il donne seulement `1` : il s'arrête à 5."
  - key: vf-limit-infini
    format: true-false
    question: "`limit` permet de terminer un stream infini."
    truth: true
    answer: Il court-circuite après n éléments.
  - key: vf-sorted-stable
    format: true-false
    question: "`sorted` garde l'ordre d'origine des éléments égaux, sur un stream ordonné."
    truth: true
    answer: Le tri est stable.
  - key: vf-skip
    format: true-false
    question: "`skip(3)` sur un stream de deux éléments lève une exception."
    truth: false
    answer: Il renvoie un stream vide.
  - key: qcm-page
    format: multiple-choice
    question: Comment obtenir la troisième page de 10 produits triés par nom ?
    choices:
      - text: "`sorted(comparing(Produit::nom)).skip(20).limit(10)`"
        correct: true
      - text: "`skip(20).limit(10).sorted(comparing(Produit::nom))`"
        correct: false
      - text: "`sorted(comparing(Produit::nom)).limit(10).skip(20)`"
        correct: false
      - text: "`sorted(comparing(Produit::nom)).skip(30).limit(10)`"
        correct: false
    answer: Trier d'abord, puis sauter deux pages et en garder une.
  - key: qcm-stateful
    format: multiple-choice
    question: Lesquelles sont des opérations avec état ?
    choices:
      - text: "`sorted`"
        correct: true
      - text: "`distinct`"
        correct: true
      - text: "`map`"
        correct: false
      - text: "`filter`"
        correct: false
    answer: '`map` et `filter` traitent chaque élément indépendamment.'
  - key: qcm-entete
    format: multiple-choice
    question: Comment ignorer les lignes de commentaire (`#`) en tête d'un fichier, mais pas celles qui suivent ?
    choices:
      - text: "`lignes.dropWhile(l -> l.startsWith(\"#\"))`"
        correct: true
      - text: "`lignes.filter(l -> !l.startsWith(\"#\"))`"
        correct: false
      - text: "`lignes.takeWhile(l -> l.startsWith(\"#\"))`"
        correct: false
      - text: "`lignes.skip(1)`"
        correct: false
    answer: '`filter` retirerait aussi les commentaires plus loin ; `skip(1)` suppose une seule ligne.'
  - key: qcm-distinct-records
    format: multiple-choice
    question: "`Stream.of(new Point(1, 2), new Point(1, 2)).distinct().count()` vaut 1 dans quel cas ?"
    choices:
      - {text: "Si `Point` est un record", correct: true}
      - {text: "Si `Point` est une classe sans `equals`", correct: false}
      - {text: "Si `Point` redéfinit seulement `toString`", correct: false}
      - {text: "Toujours, quel que soit `Point`", correct: false}
    answer: "Un record a `equals` et `hashCode` générés à partir de ses composants (une classe qui les redéfinit marche aussi). Sans `equals`, deux instances sont distinctes, quel que soit leur `toString`."
  - key: code-take-drop
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = List.of(1, 2, 5, 3, 6);
      System.out.println(l.stream().takeWhile(x -> x < 4).toList() + " "
              + l.stream().dropWhile(x -> x < 4).toList() + " "
              + l.stream().filter(x -> x < 4).toList());
      ```
    choices:
      - {text: "`[1, 2] [5, 3, 6] [1, 2, 3]`", correct: true}
      - {text: "`[1, 2, 3] [5, 6] [1, 2, 3]`", correct: false}
      - {text: "`[1, 2] [5, 6] [1, 2, 3]`", correct: false}
      - {text: "`[1, 2] [3, 5, 6] [1, 2, 3]`", correct: false}
    answer: "`[1, 2] [5, 3, 6] [1, 2, 3]` : `takeWhile` s'arrête au 5, `dropWhile` garde tout à partir du 5 (3 compris), et `filter` teste chaque élément."
    check:
      output: "[1, 2] [5, 3, 6] [1, 2, 3]"
  - key: code-skip-limit
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(IntStream.rangeClosed(1, 10).skip(3).limit(4).boxed().toList());
      ```
    choices:
      - {text: "`[4, 5, 6, 7]`", correct: true}
      - {text: "`[3, 4, 5, 6]`", correct: false}
      - {text: "`[4, 5, 6, 7, 8]`", correct: false}
      - {text: "`[1, 2, 3, 4]`", correct: false}
    answer: '`[4, 5, 6, 7]`.'
    check:
      output: "[4, 5, 6, 7]"
  - key: code-distinct-sorted
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Stream.of("b", "a", "c", "a", "b").distinct().sorted(Comparator.reverseOrder()).toList());
      ```
    choices:
      - {text: "`[c, b, a]`", correct: true}
      - {text: "`[a, b, c]`", correct: false}
      - {text: "`[c, b, b, a, a]`", correct: false}
      - {text: "`[b, a, c]`", correct: false}
    answer: '`[c, b, a]`.'
    check:
      output: "[c, b, a]"
  - key: code-infini
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Stream.iterate(1, x -> x * 3).takeWhile(x -> x < 100).toList());
      ```
    choices:
      - {text: "`[1, 3, 9, 27, 81]`", correct: true}
      - {text: "`[1, 3, 9, 27, 81, 243]`", correct: false}
      - {text: "`[3, 9, 27, 81]`", correct: false}
      - {text: "Rien : le stream est infini", correct: false}
    answer: "`[1, 3, 9, 27, 81]` : `takeWhile` arrête le stream infini au premier élément qui dépasse 100."
    check:
      output: "[1, 3, 9, 27, 81]"
