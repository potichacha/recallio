notion: streams-tri-limite
lesson: |-
  Plusieurs opérations intermédiaires réordonnent, dédoublonnent ou découpent un stream :

  | Opération | Effet |
  |---|---|
  | `sorted()`, `sorted(comparateur)` | trie (ordre naturel ou comparateur) ; tri stable |
  | `distinct()` | retire les doublons, selon `equals` et `hashCode`, en gardant la première occurrence |
  | `limit(n)` | garde les n premiers |
  | `skip(n)` | saute les n premiers |
  | `takeWhile(p)` (Java 9) | garde les éléments **tant que** p est vrai, puis s'arrête |
  | `dropWhile(p)` (Java 9) | saute les éléments tant que p est vrai, puis garde **tout le reste** |

  ```java
  Stream.of(1, 2, 5, 3, 6).takeWhile(x -> x < 4);   // 1, 2      (s'arrête à 5)
  Stream.of(1, 2, 5, 3, 6).filter(x -> x < 4);      // 1, 2, 3   (teste tout)
  Stream.of(1, 2, 5, 3, 6).dropWhile(x -> x < 4);   // 5, 3, 6

  produits.stream().sorted(comparing(Produit::prix)).skip(20).limit(10);   // une « page » de 10
  ```

  - `sorted` et `distinct` sont **avec état** : `sorted` doit tout recevoir avant d'émettre, `distinct` mémorise les
    éléments vus. Ils coûtent en mémoire et freinent le parallélisme.
  - `limit` et `takeWhile` **court-circuitent** : ils bornent un stream infini.
  - `takeWhile` et `dropWhile` n'ont de sens que sur un stream **ordonné** (sur des données triées, typiquement).
  - Paginer avec `skip`/`limit` en mémoire suppose d'avoir tout chargé : pour une base, on pagine dans la requête.

  **Piège classique** : `takeWhile` à la place de `filter` sur des données non triées. Il s'arrête au premier élément qui
  échoue et perd tous les suivants, même ceux qui satisfont le prédicat.

  **En entretien** : « `filter` teste tout, `takeWhile` s'arrête au premier échec ; `sorted` et `distinct` ont un état,
  `limit` court-circuite. »
cards:
  - key: takewhile-vs-filter
    format: course
    question: takeWhile vs filter ?
    answer: filter teste tous les éléments ; takeWhile s'arrête au premier élément qui échoue.
  - key: operation-stateful
    format: course
    question: Une opération stateful ?
    answer: 'sorted, distinct : elles ont besoin de voir plusieurs éléments (voire tous) avant d''émettre.'
  - key: distinct
    format: course
    question: Sur quoi `distinct` se fonde-t-il pour repérer les doublons ?
    answer: Sur `equals` et `hashCode` ; il garde la première occurrence (sur un stream ordonné).
  - key: drop-while
    format: course
    question: Que fait `dropWhile(p)` ?
    answer: Il saute les éléments tant que `p` est vrai, puis garde tous les éléments suivants, même ceux qui satisfont `p`.
  - key: vf-take-while
    format: true-false
    question: "`Stream.of(1, 5, 2).takeWhile(x -> x < 3)` donne `1, 2`."
    truth: false
    answer: "Il donne seulement `1` : il s'arrête à 5."
  - key: vf-limit-infini
    format: true-false
    question: "`limit` permet de terminer un stream infini."
    truth: true
    answer: Il court-circuite après n éléments.
  - key: vf-sorted-stable
    format: true-false
    question: "`sorted` garde l'ordre d'origine des éléments égaux, sur un stream ordonné."
    truth: true
    answer: Le tri est stable.
  - key: vf-skip
    format: true-false
    question: "`skip(3)` sur un stream de deux éléments lève une exception."
    truth: false
    answer: Il renvoie un stream vide.
  - key: qcm-page
    format: multiple-choice
    question: Comment obtenir la troisième page de 10 produits triés par nom ?
    choices:
      - text: "`sorted(comparing(Produit::nom)).skip(20).limit(10)`"
        correct: true
      - text: "`skip(20).limit(10).sorted(comparing(Produit::nom))`"
        correct: false
      - text: "`sorted(comparing(Produit::nom)).limit(10).skip(20)`"
        correct: false
      - text: "`sorted(comparing(Produit::nom)).skip(30).limit(10)`"
        correct: false
    answer: Trier d'abord, puis sauter deux pages et en garder une.
  - key: qcm-stateful
    format: multiple-choice
    question: Lesquelles sont des opérations avec état ?
    choices:
      - text: "`sorted`"
        correct: true
      - text: "`distinct`"
        correct: true
      - text: "`map`"
        correct: false
      - text: "`filter`"
        correct: false
    answer: '`map` et `filter` traitent chaque élément indépendamment.'
  - key: qcm-entete
    format: multiple-choice
    question: Comment ignorer les lignes de commentaire (`#`) en tête d'un fichier, mais pas celles qui suivent ?
    choices:
      - text: "`lignes.dropWhile(l -> l.startsWith(\"#\"))`"
        correct: true
      - text: "`lignes.filter(l -> !l.startsWith(\"#\"))`"
        correct: false
      - text: "`lignes.takeWhile(l -> l.startsWith(\"#\"))`"
        correct: false
      - text: "`lignes.skip(1)`"
        correct: false
    answer: '`filter` retirerait aussi les commentaires plus loin ; `skip(1)` suppose une seule ligne.'
  - key: qcm-distinct-records
    format: multiple-choice
    question: "`Stream.of(new Point(1, 2), new Point(1, 2)).distinct().count()` vaut 1 si..."
    choices:
      - text: "`Point` est un record"
        correct: true
      - text: "`Point` redéfinit `equals` et `hashCode`"
        correct: true
      - text: "`Point` est une classe sans `equals`"
        correct: false
      - text: "Toujours"
        correct: false
    answer: Sans `equals`, deux instances sont distinctes.
  - key: code-take-drop
    format: code-output
    question: |-
      ```java
      List<Integer> l = List.of(1, 2, 5, 3, 6);
      System.out.println(l.stream().takeWhile(x -> x < 4).toList() + " "
              + l.stream().dropWhile(x -> x < 4).toList() + " "
              + l.stream().filter(x -> x < 4).toList());
      ```
    answer: '`[1, 2] [5, 3, 6] [1, 2, 3]`.'
    check:
      output: "[1, 2] [5, 3, 6] [1, 2, 3]"
  - key: code-skip-limit
    format: code-output
    question: |-
      ```java
      System.out.println(IntStream.rangeClosed(1, 10).skip(3).limit(4).boxed().toList());
      ```
    answer: '`[4, 5, 6, 7]`.'
    check:
      output: "[4, 5, 6, 7]"
  - key: code-distinct-sorted
    format: code-output
    question: |-
      ```java
      System.out.println(Stream.of("b", "a", "c", "a", "b").distinct().sorted(Comparator.reverseOrder()).toList());
      ```
    answer: '`[c, b, a]`.'
    check:
      output: "[c, b, a]"
  - key: code-infini
    format: code-output
    question: |-
      ```java
      System.out.println(Stream.iterate(1, x -> x * 3).takeWhile(x -> x < 100).toList());
      ```
    answer: '`[1, 3, 9, 27, 81]`.'
    check:
      output: "[1, 3, 9, 27, 81]"
