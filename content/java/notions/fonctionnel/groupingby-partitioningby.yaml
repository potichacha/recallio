notion: groupingby-partitioningby
lesson: |-
  **`groupingBy(classifieur)`** range les éléments dans une `Map` dont les clés sont les résultats du classifieur, et les
  valeurs la liste des éléments de chaque groupe. **`partitioningBy(predicat)`** est le cas particulier à deux groupes :
  `true` et `false`.

  ```java
  Map<String, List<Employe>> parService = employes.stream().collect(groupingBy(Employe::service));
  Map<Boolean, List<Employe>> cadres = employes.stream().collect(partitioningBy(Employe::cadre));
  ```

  Un **collecteur en aval** (*downstream*), en dernier argument, dit quoi faire de chaque groupe au lieu d'en faire une
  liste :

  ```java
  groupingBy(Employe::service, counting());                             // Map<String, Long>
  groupingBy(Employe::service, averagingDouble(Employe::salaire));      // Map<String, Double>
  groupingBy(Employe::service, mapping(Employe::nom, toList()));        // Map<String, List<String>>
  groupingBy(Employe::service, maxBy(comparing(Employe::salaire)));     // Map<String, Optional<Employe>>
  groupingBy(Employe::service, TreeMap::new, counting());               // une TreeMap, triée par service
  groupingBy(Employe::service, groupingBy(Employe::ville));             // groupes imbriqués
  ```

  - Par défaut, la map est une `HashMap` (aucun ordre) et les groupes des `ArrayList` ; le deuxième argument choisit la
    map (`TreeMap::new`, `LinkedHashMap::new`).
  - `partitioningBy` contient **toujours** les deux clés, même si un groupe est vide ; `groupingBy` ne crée que les
    groupes non vides.
  - Les collecteurs en aval évitent de construire les listes intermédiaires : on compte ou on somme au fil de l'eau.
  - Le classifieur ne doit pas renvoyer `null` (`NullPointerException`).
  - `filtering` et `flatMapping` (Java 9) filtrent ou aplatissent **dans** chaque groupe, en gardant les groupes vides.

  **Piège classique** : `groupingBy(...)` puis un second stream sur chaque liste pour compter. Le collecteur en aval
  `counting()` fait les deux en un passage.

  **En entretien** : « `groupingBy(cle, aval)` regroupe et agrège en une passe ; `partitioningBy` pour deux groupes, avec
  toujours les deux clés ; `TreeMap::new` pour trier les groupes. »
cards:
  - key: downstream-collector
    format: course
    question: C'est quoi un downstream collector ?
    answer: Le second argument de groupingBy, qui traite chaque groupe (counting, mapping, summing).
  - key: choisir-type-map-groupingby
    format: course
    question: Comment choisir le type de map d'un groupingBy ?
    answer: '`groupingBy(f, TreeMap::new, downstream)`.'
  - key: partitioning
    format: course
    question: Quelle différence entre `partitioningBy` et `groupingBy` sur un prédicat ?
    answer: '`partitioningBy` contient toujours les deux clés `true` et `false`, même vides, et utilise une map spécialisée ; `groupingBy` ne crée que les groupes non vides.'
  - key: mapping
    format: course
    question: Comment obtenir, par service, la liste des noms (et non des employés) ?
    answer: '`groupingBy(Employe::service, mapping(Employe::nom, toList()))`.'
  - key: vf-ordre
    format: true-false
    question: "`groupingBy` sans fabrique de map renvoie une map triée par clé."
    truth: false
    answer: Une `HashMap`, sans ordre ; `TreeMap::new` la trie.
  - key: vf-partition-vide
    format: true-false
    question: "`partitioningBy` contient la clé `false` même si tous les éléments satisfont le prédicat."
    truth: true
    answer: Associée à une liste vide.
  - key: vf-counting-long
    format: true-false
    question: "`groupingBy(f, counting())` donne une `Map<K, Long>`."
    truth: true
    answer: '`counting` produit un `Long`.'
  - key: vf-max-by
    format: true-false
    question: "`groupingBy(f, maxBy(c))` donne directement l'élément maximal de chaque groupe, sans `Optional`."
    truth: false
    answer: Il donne un `Optional` par groupe ; `collectingAndThen(maxBy(c), Optional::get)` le déballe.
  - key: qcm-compter
    format: multiple-choice
    question: Comment compter les commandes par statut ?
    choices:
      - text: "`collect(groupingBy(Commande::statut, counting()))`"
        correct: true
      - text: "`collect(groupingBy(Commande::statut)).size()`"
        correct: false
      - text: "`collect(partitioningBy(Commande::statut))`"
        correct: false
      - text: "`collect(toMap(Commande::statut, c -> 1))`"
        correct: false
    answer: '`size()` donne le nombre de statuts ; `toMap` échoue sur les doublons de clé.'
  - key: qcm-deux-groupes
    format: multiple-choice
    question: Comment séparer les commandes payées des autres ?
    choices:
      - text: "`collect(partitioningBy(Commande::payee))`"
        correct: true
      - text: "`collect(groupingBy(Commande::payee))`, qui peut manquer une clé"
        correct: false
      - text: "`filter(Commande::payee).toList()`, qui perd les autres"
        correct: false
      - text: "`collect(toMap(Commande::payee, c -> c))`"
        correct: false
    answer: '`partitioningBy` garantit les deux groupes.'
  - key: qcm-tri
    format: multiple-choice
    question: Comment obtenir la moyenne des notes par matière, triée par matière ?
    choices:
      - text: "`groupingBy(Note::matiere, TreeMap::new, averagingDouble(Note::valeur))`"
        correct: true
      - text: "`groupingBy(Note::matiere, averagingDouble(Note::valeur))`, sans ordre"
        correct: false
      - text: "`sorted().collect(groupingBy(Note::matiere))`"
        correct: false
      - text: "`groupingBy(Note::matiere, TreeMap::new)`"
        correct: false
    answer: Trier le stream ne trie pas la `HashMap` produite ; la dernière n'existe pas sans collecteur en aval.
  - key: qcm-imbrique
    format: multiple-choice
    question: "Quel est le type de `employes.stream().collect(groupingBy(Employe::pays, groupingBy(Employe::ville, counting())))` ?"
    choices:
      - text: "`Map<String, Map<String, Long>>`"
        correct: true
      - text: "`Map<String, Long>`"
        correct: false
      - text: "`Map<String, List<Map<String, Long>>>`"
        correct: false
      - text: "`Map<Map<String, String>, Long>`"
        correct: false
    answer: Le collecteur en aval est lui-même un `groupingBy`.
  - key: trous-grouping
    format: fill-in
    question: |-
      Complétez pour regrouper les clients par ville :
      ```java
      Map<String, List<Client>> parVille = clients.stream().collect(Collectors.___(Client::ville));
      ```
    blanks: [[groupingBy]]
    answer: Chaque valeur est la liste des clients de la ville.
  - key: trous-counting
    format: fill-in
    question: |-
      Complétez pour compter les clients par ville :
      ```java
      Map<String, Long> n = clients.stream().collect(groupingBy(Client::ville, Collectors.___()));
      ```
    blanks: [[counting]]
    answer: '`counting` est un collecteur en aval.'
  - key: trous-partition
    format: fill-in
    question: |-
      Complétez pour séparer les majeurs des mineurs :
      ```java
      Map<Boolean, List<Personne>> m = personnes.stream().collect(Collectors.___(p -> p.age() >= 18));
      ```
    blanks: [[partitioningBy]]
    answer: Deux clés, `true` et `false`.
  - key: trous-mapping
    format: fill-in
    question: |-
      Complétez pour obtenir les emails par service :
      ```java
      Map<String, Set<String>> emails = employes.stream()
              .collect(groupingBy(Employe::service, Collectors.___(Employe::email, toSet())));
      ```
    blanks: [[mapping]]
    answer: '`mapping` transforme les éléments de chaque groupe.'
  - key: code-grouping-tri
    format: code-output
    question: |-
      ```java
      Map<Character, Long> parInitiale = Stream.of("ada", "bob", "alan", "carl", "bea")
              .collect(Collectors.groupingBy(s -> s.charAt(0), TreeMap::new, Collectors.counting()));
      System.out.println(parInitiale);
      ```
    answer: '`{a=2, b=2, c=1}`.'
    check:
      output: "{a=2, b=2, c=1}"
  - key: code-partition
    format: code-output
    question: |-
      ```java
      System.out.println(Stream.of(1, 3, 5).collect(Collectors.partitioningBy(x -> x % 2 == 0)));
      ```
    answer: '`{false=[1, 3, 5], true=[]}` : la clé `true` existe, avec une liste vide.'
    check:
      output: "{false=[1, 3, 5], true=[]}"
  - key: code-mapping
    format: code-output
    question: |-
      ```java
      Map<Integer, String> initiales = Stream.of("kiwi", "ananas", "figue", "abricot")
              .collect(Collectors.groupingBy(String::length, TreeMap::new,
                      Collectors.mapping(s -> s.substring(0, 1), Collectors.joining())));
      System.out.println(initiales);
      ```
    answer: '`{4=k, 5=f, 6=a, 7=a}`.'
    check:
      output: "{4=k, 5=f, 6=a, 7=a}"
  - key: code-partition-counting
    format: code-output
    question: |-
      ```java
      System.out.println(IntStream.rangeClosed(1, 10).boxed()
              .collect(Collectors.partitioningBy(x -> x > 7, Collectors.summingInt(x -> x))));
      ```
    answer: '`{false=28, true=27}`.'
    check:
      output: "{false=28, true=27}"
  - key: retourne-chaque-ville-nombre-utilisateurs-actifs
    format: scenario
    question: Retourne, pour chaque ville, le nombre d'utilisateurs actifs.
    answer: |-
      Je filtrerais puis grouperais avec un downstream collector :
      ```java
      users.stream()
           .filter(User::isActive)
           .collect(groupingBy(User::getCity, counting()));
      ```
      Ça produit directement une `Map<String, Long>`. L'intérêt du downstream, c'est qu'on ne construit jamais les listes intermédiaires : on compte au fil de l'eau.
  - key: donne-salaire-moyen-departement-trie-departement
    format: scenario
    question: Donne le salaire moyen par département, trié par département, uniquement pour les employés actifs.
    answer: |-
      ```java
      Map<String, Double> moyenne = employes.stream()
          .filter(Employe::actif)
          .collect(groupingBy(Employe::departement, TreeMap::new,
                              averagingDouble(Employe::salaire)));
      ```
      "La TreeMap trie par clé. Si je voulais le meilleur salarié de chaque département : `groupingBy(Employe::departement, maxBy(comparing(Employe::salaire)))`, qui donne des Optional ; avec `collectingAndThen(maxBy(...), Optional::get)` pour les déballer, sachant qu'un groupe n'est jamais vide."
  - key: scenario-tableau-bord
    format: scenario
    question: Pour un tableau de bord, donne le chiffre d'affaires par mois et par catégorie de produit.
    answer: |-
      ```java
      Map<YearMonth, Map<String, BigDecimal>> ca = ventes.stream()
              .collect(groupingBy(v -> YearMonth.from(v.date()), TreeMap::new,
                      groupingBy(Vente::categorie, TreeMap::new,
                              reducing(BigDecimal.ZERO, Vente::montant, BigDecimal::add))));
      ```
      Un `groupingBy` imbriqué, des `TreeMap` pour l'ordre chronologique et alphabétique, et `reducing` pour sommer des
      `BigDecimal`. Pour un vrai tableau de bord sur des millions de ventes, je ferais ce calcul en SQL (`GROUP BY
      date_trunc('month', date), categorie`) plutôt que de tout charger en mémoire.
  - key: scenario-groupes-vides
    format: scenario
    question: Tu dois afficher, pour chaque jour de la semaine, le nombre de commandes, y compris les jours sans commande.
    answer: |-
      `groupingBy` ne crée pas les groupes vides. Je pars donc de toutes les clés possibles : `new EnumMap<>(DayOfWeek.class)`
      rempli de 0 pour chaque jour, puis je fusionne le résultat du `groupingBy(c -> c.date().getDayOfWeek(), counting())`
      avec `putAll`. Ou plus directement : `Arrays.stream(DayOfWeek.values()).collect(toMap(j -> j, j -> compte.getOrDefault(j, 0L),
      (a, b) -> a, () -> new EnumMap<>(DayOfWeek.class)))`. L'`EnumMap` donne en prime l'ordre des jours.
