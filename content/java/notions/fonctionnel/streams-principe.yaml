notion: streams-principe
lesson: |-
  Un **stream** décrit un traitement sur une suite d'éléments, sous forme de **pipeline** en trois parties :

  ```java
  List<String> noms = clients.stream()            // 1. une source
          .filter(Client::actif)                  // 2. des opérations intermédiaires (0 ou plus)
          .map(Client::nom)
          .sorted()
          .toList();                              // 3. une opération terminale (exactement une)
  ```

  - La **source** : une collection (`stream()`), un tableau (`Arrays.stream`), `Stream.of`, un fichier (`Files.lines`)...
  - Les opérations **intermédiaires** (`filter`, `map`, `sorted`, `distinct`, `limit`...) renvoient un nouveau stream et
    sont **paresseuses** : elles ne font rien tant qu'il n'y a pas d'opération terminale.
  - L'opération **terminale** (`toList`, `collect`, `forEach`, `count`, `reduce`, `anyMatch`, `findFirst`...) déclenche
    le traitement et produit un résultat ou un effet.

  Un stream n'est **pas une collection** :
  - il ne stocke pas les éléments, il les fait passer ;
  - il **ne modifie pas** sa source : `filter` ne retire rien de la liste d'origine ;
  - il ne se parcourt **qu'une fois** ;
  - il peut être infini (`Stream.iterate`), à condition d'être borné avant la fin.

  Le style est **déclaratif** : on dit *quoi* obtenir (les noms triés des clients actifs), pas *comment* boucler.

  **Piège classique** : croire que `liste.stream().filter(...)` retire des éléments de `liste`. La liste est intacte ;
  pour la modifier, `liste.removeIf(...)`.

  **En entretien** : « Une source, des opérations intermédiaires paresseuses qui renvoient un stream, une opération
  terminale qui déclenche tout. Le stream ne stocke rien, ne modifie pas sa source et ne sert qu'une fois. »
cards:
  - key: intermediaire-vs-terminale
    format: course
    question: Intermédiaire vs terminale ?
    answer: Intermédiaire = lazy, retourne un stream. Terminale = déclenche l'exécution.
  - key: trois-parties
    format: course
    question: Quelles sont les trois parties d'un pipeline de stream ?
    answer: Une source (collection, tableau, fichier...), zéro ou plusieurs opérations intermédiaires, et exactement une opération terminale.
  - key: pas-collection
    format: course
    question: En quoi un stream diffère-t-il d'une collection ?
    answer: Il ne stocke pas les éléments, ne modifie pas sa source, ne se parcourt qu'une fois et peut être infini ; c'est une description de traitement, pas un conteneur.
  - key: source-intacte
    format: course
    question: "`liste.stream().filter(x -> x > 0).toList()` modifie-t-il `liste` ?"
    answer: Non, il produit une nouvelle liste ; la source est intacte. Pour retirer des éléments de la liste, on utilise `removeIf`.
  - key: vf-modifie-source
    format: true-false
    question: "`filter` retire des éléments de la collection source."
    truth: false
    answer: Un stream ne modifie pas sa source.
  - key: vf-terminale-unique
    format: true-false
    question: Un pipeline a exactement une opération terminale.
    truth: true
    answer: Après elle, le stream est consommé.
  - key: vf-intermediaire-stream
    format: true-false
    question: Une opération intermédiaire renvoie un `Stream`.
    truth: true
    answer: C'est ce qui permet de les chaîner.
  - key: vf-stocke
    format: true-false
    question: Un stream stocke ses éléments comme une liste.
    truth: false
    answer: Il les fait passer depuis la source jusqu'à l'opération terminale.
  - key: qcm-terminales
    format: multiple-choice
    question: Lesquelles sont des opérations terminales ?
    choices:
      - text: "`toList()`"
        correct: true
      - text: "`count()`"
        correct: true
      - text: "`map(...)`"
        correct: false
      - text: "`sorted()`"
        correct: false
    answer: '`map` et `sorted` renvoient un stream.'
  - key: qcm-intermediaires
    format: multiple-choice
    question: Lesquelles sont des opérations intermédiaires ?
    choices:
      - text: "`filter`"
        correct: true
      - text: "`distinct`"
        correct: true
      - text: "`forEach`"
        correct: false
      - text: "`anyMatch`"
        correct: false
    answer: '`forEach` et `anyMatch` terminent le pipeline.'
  - key: qcm-sources
    format: multiple-choice
    question: Lesquelles créent un stream ?
    choices:
      - text: "`List.of(1, 2).stream()`"
        correct: true
      - text: "`Arrays.stream(tableau)`"
        correct: true
      - text: "`new Stream<>()`"
        correct: false
      - text: "`List.of(1, 2).toStream()`"
        correct: false
    answer: '`Stream` est une interface, sans constructeur public.'
  - key: qcm-declaratif
    format: multiple-choice
    question: Que décrit un pipeline de stream ?
    choices:
      - text: "Le résultat voulu, plutôt que la façon de boucler"
        correct: true
      - text: "Un algorithme pas à pas avec des index"
        correct: false
      - text: "Une nouvelle structure de données stockée"
        correct: false
      - text: "Un traitement forcément parallèle"
        correct: false
    answer: Un stream est séquentiel par défaut ; `parallel()` le rend parallèle.
  - key: trous-source
    format: fill-in
    question: |-
      Complétez pour obtenir un stream depuis la liste :
      ```java
      long n = commandes.___().filter(Commande::payee).count();
      ```
    blanks: [[stream]]
    answer: '`Collection.stream()` crée la source.'
  - key: trous-terminale
    format: fill-in
    question: |-
      Complétez avec l'opération terminale qui produit une liste :
      ```java
      List<String> villes = clients.stream().map(Client::ville).distinct().___();
      ```
    blanks: [[toList]]
    answer: '`toList()` (Java 16) renvoie une liste non modifiable.'
  - key: trous-tableau
    format: fill-in
    question: |-
      Complétez pour streamer un tableau :
      ```java
      int max = ___.stream(notes).max().orElse(0);
      ```
    blanks: [[Arrays]]
    answer: '`Arrays.stream(int[])` donne un `IntStream`.'
  - key: trous-intermediaire
    format: fill-in
    question: |-
      Complétez pour garder les produits en stock :
      ```java
      List<Produit> dispo = produits.stream().___(p -> p.stock() > 0).toList();
      ```
    blanks: [[filter]]
    answer: '`filter` garde les éléments qui satisfont le prédicat.'
  - key: code-pipeline
    format: code-output
    question: |-
      ```java
      List<String> mots = List.of("pomme", "kiwi", "banane", "figue");
      System.out.println(mots.stream().filter(m -> m.length() > 4).map(String::toUpperCase).sorted().toList());
      ```
    answer: '`[BANANE, FIGUE, POMME]`.'
    check:
      output: "[BANANE, FIGUE, POMME]"
  - key: code-source-intacte
    format: code-output
    question: |-
      ```java
      List<Integer> l = new ArrayList<>(List.of(1, -2, 3));
      List<Integer> positifs = l.stream().filter(x -> x > 0).toList();
      System.out.println(l + " " + positifs);
      ```
    answer: '`[1, -2, 3] [1, 3]` : la source est intacte.'
    check:
      output: "[1, -2, 3] [1, 3]"
  - key: code-count
    format: code-output
    question: |-
      ```java
      System.out.println(Stream.of("a", "bb", "cc", "d").map(String::length).filter(n -> n == 2).count());
      ```
    answer: '`2`.'
    check:
      output: "2"
  - key: code-sans-terminale
    format: code-output
    question: |-
      ```java
      List<Integer> vus = new ArrayList<>();
      Stream<Integer> s = Stream.of(1, 2, 3).map(x -> { vus.add(x); return x; });
      System.out.println(vus.size());
      ```
    answer: '`0` : sans opération terminale, `map` ne s''exécute pas.'
    check:
      output: "0"
