notion: streams-vs-boucles
lesson: |-
  Un stream n'est pas « mieux » qu'une boucle par principe : chacun a ses cas.

  **Le stream gagne** quand le traitement est une suite de transformations sur une collection :

  ```java
  List<String> villes = clients.stream()
          .filter(Client::actif)
          .map(Client::ville)
          .distinct()
          .sorted()
          .toList();
  ```

  Chaque étape a un nom, le résultat est construit sans variable mutable, et l'on peut ajouter une étape sans tout
  réécrire.

  **La boucle gagne** quand :
  - il faut **sortir tôt** avec plusieurs conditions, ou gérer des **exceptions vérifiées** ;
  - plusieurs variables évoluent ensemble (un état, l'élément précédent, un index) ;
  - on modifie la collection ou des tableaux en place ;
  - le traitement est un **chemin critique** de performances, mesuré comme tel ;
  - le stream obtenu est acrobatique (des `reduce` imbriqués, un `AtomicInteger` pour compter, des `peek` partout).

  Performances :
  - un stream a un petit coût fixe (objets du pipeline, lambdas) : sur de petites collections dans une boucle chaude, une
    boucle `for` peut être plus rapide ;
  - le JIT optimise bien les deux, et le boxing (`Stream<Integer>`) pèse souvent plus que le choix stream/boucle ;
  - la seule réponse sérieuse vient d'une **mesure** (JMH), sur le vrai code.

  **Piège classique** : convertir chaque boucle en stream pour « faire moderne ». Un stream de quinze lignes avec un état
  extérieur est moins lisible et plus fragile que la boucle qu'il remplace.

  **En entretien** : « Je choisis la lisibilité : un stream pour une chaîne de transformations, une boucle pour un état,
  une sortie anticipée ou une exception vérifiée ; les performances, je les mesure. »
cards:
  - key: stream-plus-rapide-boucle
    format: course
    question: Un stream est-il plus rapide qu'une boucle ?
    answer: Pas en général ; il apporte lisibilité et composabilité. Il faut mesurer.
  - key: quand-stream
    format: course
    question: Quand un stream est-il le meilleur choix ?
    answer: "Pour une chaîne de transformations sur une collection (filtrer, transformer, regrouper, agréger), sans état partagé : chaque étape est nommée et le résultat construit directement."
  - key: quand-boucle
    format: course
    question: Quand une boucle classique est-elle préférable ?
    answer: Quand il faut gérer un état qui évolue (élément précédent, plusieurs variables), sortir tôt sur des conditions complexes, gérer des exceptions vérifiées, ou modifier des données en place.
  - key: boxing
    format: course
    question: Qu'est-ce qui pèse souvent plus lourd que le choix entre stream et boucle ?
    answer: "Le boxing : un `Stream<Integer>` crée des objets là où un `IntStream` ou une boucle sur `int` n'en crée pas."
  - key: vf-toujours-stream
    format: true-false
    question: Il faut remplacer toutes les boucles par des streams en Java moderne.
    truth: false
    answer: On choisit la forme la plus lisible pour chaque traitement.
  - key: vf-exception
    format: true-false
    question: Les exceptions vérifiées sont plus simples à gérer dans une boucle que dans un stream.
    truth: true
    answer: Les interfaces de `java.util.function` n'en déclarent aucune.
  - key: vf-cout-fixe
    format: true-false
    question: Un stream a un coût fixe qui peut compter sur de très petites collections appelées très souvent.
    truth: true
    answer: La création du pipeline et des lambdas a un coût, souvent négligeable ailleurs.
  - key: vf-mesure
    format: true-false
    question: On peut affirmer qu'une version est plus rapide en lisant le code.
    truth: false
    answer: "Le JIT optimise différemment selon le contexte : seule une mesure tranche."
  - key: qcm-stream
    format: multiple-choice
    question: Pour quel traitement un stream est-il le plus naturel ?
    choices:
      - text: "Les emails distincts des clients actifs, triés"
        correct: true
      - text: "Trouver deux éléments consécutifs dont la somme dépasse un seuil"
        correct: false
      - text: "Lire des fichiers en gérant chaque `IOException` différemment"
        correct: false
      - text: "Inverser un tableau en place"
        correct: false
    answer: Les autres demandent un état, des exceptions vérifiées ou une modification en place.
  - key: qcm-signaux
    format: multiple-choice
    question: Quels signes indiquent qu'un stream serait mieux écrit en boucle ?
    choices:
      - text: "Un `AtomicInteger` modifié depuis un `forEach` pour compter"
        correct: true
      - text: "Un `try/catch` dans chaque lambda pour une exception vérifiée"
        correct: true
      - text: "Une chaîne `filter`, `map`, `toList` de trois lignes"
        correct: false
      - text: "Un `groupingBy` avec `counting()`"
        correct: false
    answer: Un état extérieur et des exceptions enveloppées partout trahissent un stream forcé.
  - key: qcm-mesurer
    format: multiple-choice
    question: Comment comparer sérieusement les performances d'un stream et d'une boucle ?
    choices:
      - text: "Avec JMH, sur des données réalistes"
        correct: true
      - text: "Avec `System.currentTimeMillis()` autour d'un seul appel"
        correct: false
      - text: "En comptant les lignes de code"
        correct: false
      - text: "En lisant le bytecode"
        correct: false
    answer: JMH gère le préchauffage du JIT et les pièges des micro-benchmarks.
  - key: qcm-lisible
    format: multiple-choice
    question: Quel critère doit guider le choix par défaut ?
    choices:
      - text: "La lisibilité et la maintenabilité"
        correct: true
      - text: "La modernité du style"
        correct: false
      - text: "Le plus petit nombre de lignes"
        correct: false
      - text: "Une règle d'équipe « jamais de boucle »"
        correct: false
    answer: Les performances viennent ensuite, mesurées, sur les chemins critiques.
  - key: scenario-revue
    format: scenario
    question: En revue de code, un collègue a transformé une boucle simple en stream de quinze lignes avec un `AtomicInteger` et deux `peek`. Que dis-tu ?
    answer: |-
      Que le stream n'est pas un but : ici, il cache un état partagé (l'`AtomicInteger`) et des effets de bord (les `peek`),
      ce qui le rend moins lisible et fragile si quelqu'un le parallélise. Je propose soit de revenir à la boucle, claire
      avec son état local, soit de reformuler en vrai pipeline sans état (un `count`, un `groupingBy`, un `partitioningBy`)
      si le calcul s'y prête. Le critère est simple : que le prochain lecteur comprenne en une lecture.
  - key: scenario-chemin-critique
    format: scenario
    question: Le profilage montre qu'un stream sur de petites listes, appelé des millions de fois, pèse dans une boucle chaude. Que fais-tu ?
    answer: |-
      D'abord je confirme avec un benchmark JMH isolé, en comparant le stream à une boucle sur le même jeu de données. Je
      regarde aussi le boxing : passer à `IntStream` ou à des primitifs suffit parfois. Si la boucle gagne nettement, je la
      garde pour ce chemin critique, avec un commentaire qui renvoie à la mesure, pour qu'on ne la « modernise » pas plus
      tard. Ailleurs dans le code, je garde les streams.
  - key: scenario-sortie-anticipee
    format: scenario
    question: Tu dois parcourir des transactions et t'arrêter dès que le solde cumulé devient négatif, en renvoyant la transaction fautive. Stream ou boucle ?
    answer: |-
      Une boucle : il y a un état cumulé (le solde) et une sortie anticipée qui dépend de cet état. En stream, il faudrait
      un compteur extérieur dans un `filter`, ce qui viole le contrat des streams, ou un `Gatherers.scan` suivi d'un
      appariement avec la transaction, nettement moins lisible. Une boucle `for` de cinq lignes, avec une variable `solde`
      et un `return` dès qu'il devient négatif, dit exactement l'intention.
  - key: scenario-equipe
    format: scenario
    question: Ton équipe débat d'une règle « streams partout ». Quelle position défends-tu ?
    answer: |-
      Pas de règle absolue, mais un critère : la lisibilité pour le prochain lecteur. Les streams pour les chaînes de
      transformations et les agrégations (avec les collecteurs), les boucles pour les traitements à état, les sorties
      anticipées complexes et les exceptions vérifiées. On interdit plutôt les anti-motifs : état extérieur modifié depuis
      un stream, `peek` pour la logique, `parallel()` sans mesure. Et sur les performances, on mesure au lieu d'en débattre.
