notion: spliterator
lesson: |-
  Un **`Spliterator`** (*splittable iterator*) est la source sous-jacente de tout stream. Il sait :

  - **avancer** : `tryAdvance(action)` traite l'élément suivant s'il existe, et renvoie `false` à la fin ;
  - **se découper** : `trySplit()` renvoie un nouveau spliterator pour une partie des éléments (ou `null`), c'est ce qui
    permet le parallélisme ;
  - **estimer sa taille** : `estimateSize()` ;
  - **décrire ses propriétés** : `characteristics()`, des indicateurs comme `ORDERED`, `SIZED`, `SUBSIZED`, `DISTINCT`,
    `SORTED`, `NONNULL`, `IMMUTABLE`.

  ```java
  Spliterator<String> s = List.of("a", "b", "c", "d").spliterator();
  Spliterator<String> moitie = s.trySplit();      // "a", "b" ; s garde "c", "d"
  s.tryAdvance(System.out::println);              // c
  s.hasCharacteristics(Spliterator.SIZED);        // true

  Stream<Ligne> lignes = StreamSupport.stream(new MonSpliterator(source), false);   // un stream sur une source maison
  ```

  - Les caractéristiques servent d'**optimisations** : avec `SIZED`, `count()` n'a pas à parcourir ; avec `DISTINCT`,
    `distinct()` ne fait rien ; avec `SORTED`, `sorted()` peut être sauté.
  - La qualité du découpage fait la performance parallèle : un `ArrayList` se coupe en deux moitiés exactes, une
    `LinkedList` ou un `Iterator` se découpent mal.
  - Pour une source maison, on étend souvent `Spliterators.AbstractSpliterator` et l'on ne code que `tryAdvance` ; ou
    l'on adapte un `Iterator` avec `Spliterators.spliteratorUnknownSize(iterator, ORDERED)`.

  **Piège classique** : déclarer des caractéristiques fausses (`SIZED` sur une source de taille inconnue, `SORTED` sans
  l'être). Le stream s'appuie dessus et produit des résultats faux.

  **En entretien** : « Le spliterator est l'itérateur des streams : `tryAdvance` pour avancer, `trySplit` pour le
  parallélisme, et des caractéristiques qui permettent des optimisations. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un `Spliterator` ?"
    choices:
      - {text: "L'itérateur des streams, qui sait avancer, se découper pour le parallélisme et estimer sa taille", correct: true}
      - {text: "Un collecteur qui découpe le résultat d'un stream en plusieurs listes de taille fixe", correct: false}
      - {text: "Une sous-classe d'`Iterator` qui ajoute `remove` et `previous` pour revenir en arrière", correct: false}
      - {text: "Le pool de threads qui exécute les streams parallèles, découpé en files de tâches", correct: false}
    answer: L'itérateur sous-jacent des streams, qui sait avancer (`tryAdvance`), se découper pour le parallélisme (`trySplit`), estimer sa taille et décrire ses caractéristiques.
  - key: try-split
    format: course
    question: "À quoi sert `trySplit()` sur un `Spliterator` ?"
    choices:
      - {text: "À détacher une partie des éléments pour un autre thread ; `null` quand c'est fini", correct: true}
      - {text: "À séparer les éléments en deux listes, selon un prédicat donné", correct: false}
      - {text: "À couper le stream après n éléments, comme le fait `limit`", correct: false}
      - {text: "À essayer d'avancer d'un élément, et à renvoyer `false` à la fin", correct: false}
    answer: "À détacher une partie des éléments dans un nouveau spliterator, pour qu'un autre thread la traite ; il renvoie `null` quand le découpage n'est plus possible ou utile. Avancer d'un élément, c'est `tryAdvance`."
  - key: caracteristiques
    format: course
    question: "À quoi servent les caractéristiques d'un spliterator (`SIZED`, `DISTINCT`, `SORTED`...) ?"
    choices:
      - {text: "À permettre des optimisations, comme `count()` sans parcours si `SIZED`", correct: true}
      - {text: "À imposer un ordre de tri au stream, quel que soit l'ordre de la source", correct: false}
      - {text: "À choisir le nombre de threads utilisés par un stream parallèle", correct: false}
      - {text: "À vérifier les éléments à l'exécution, et à lever une exception sinon", correct: false}
    answer: "À permettre des optimisations : par exemple, `count()` sans parcours si `SIZED`, `distinct()` inutile si `DISTINCT`."
  - key: source-maison
    format: course
    question: "Comment créer un stream sur une source personnalisée ?"
    choices:
      - {text: "Avec `StreamSupport.stream(spliterator, parallele)`, souvent sur un `AbstractSpliterator`", correct: true}
      - {text: "Avec `Stream.of(source)`, qui parcourt tout objet qui implémente `Iterator`", correct: false}
      - {text: "En étendant la classe `Stream`, puis en redéfinissant `forEach` et `map`", correct: false}
      - {text: "Avec `Collections.stream(source)`, qui adapte toute source à un stream", correct: false}
    answer: Avec `StreamSupport.stream(spliterator, parallele)`, le spliterator étendant souvent `Spliterators.AbstractSpliterator` (seul `tryAdvance` à écrire), ou adapté d'un `Iterator` avec `Spliterators.spliteratorUnknownSize`.
  - key: vf-try-advance
    format: true-false
    question: "`tryAdvance` renvoie `false` quand il n'y a plus d'élément."
    truth: true
    answer: Sinon il applique l'action à l'élément suivant et renvoie `true`.
  - key: vf-split-null
    format: true-false
    question: "`trySplit` peut renvoyer `null`."
    truth: true
    answer: Quand il ne peut ou ne veut plus découper.
  - key: vf-mentir
    format: true-false
    question: Déclarer `SIZED` sur une source de taille inconnue est sans conséquence.
    truth: false
    answer: Le stream s'appuie sur cette information et peut produire des résultats faux.
  - key: vf-linkedlist
    format: true-false
    question: Une `ArrayList` se découpe mieux qu'une `LinkedList`.
    truth: true
    answer: Un index de milieu suffit pour la couper en deux.
  - key: qcm-methodes
    format: multiple-choice
    question: "Laquelle de ces méthodes appartient à `Spliterator` ?"
    choices:
      - {text: "`trySplit`", correct: true}
      - {text: "`hasNext`", correct: false}
      - {text: "`parallel`", correct: false}
      - {text: "`split`", correct: false}
    answer: "`trySplit` (avec `tryAdvance`) appartient à `Spliterator` ; `hasNext` est sur `Iterator`, `parallel` sur `Stream`, et `split` sur `String`."
  - key: qcm-optimisation
    format: multiple-choice
    question: Quelle caractéristique permet à `count()` de répondre sans parcourir les éléments ?
    choices:
      - text: "`SIZED`"
        correct: true
      - text: "`ORDERED`"
        correct: false
      - text: "`NONNULL`"
        correct: false
      - text: "`IMMUTABLE`"
        correct: false
    answer: La taille exacte est connue d'avance.
  - key: qcm-adapter
    format: multiple-choice
    question: Comment transformer un `Iterator<Ligne>` existant en `Stream<Ligne>` ?
    choices:
      - {text: "`StreamSupport.stream(Spliterators.spliteratorUnknownSize(it, Spliterator.ORDERED), false)`", correct: true}
      - {text: "`Spliterators.spliteratorUnknownSize(it, Spliterator.ORDERED).stream()`", correct: false}
      - {text: "`StreamSupport.stream(it, Spliterator.ORDERED, false)`", correct: false}
      - {text: "`Stream.of(it)`", correct: false}
    answer: "`StreamSupport` construit le stream sur un spliterator, que `spliteratorUnknownSize` adapte de l'itérateur. Un `Spliterator` n'a pas de méthode `stream()`, et `Stream.of(it)` donnerait un stream d'un seul élément, l'itérateur."
  - key: qcm-parallele
    format: multiple-choice
    question: Pourquoi un stream parallèle sur `Spliterators.spliteratorUnknownSize(...)` se parallélise-t-il mal ?
    choices:
      - {text: "Sans taille ni accès direct, le découpage se fait par lots lus séquentiellement", correct: true}
      - {text: "Les itérateurs sont interdits en parallèle : le stream repasse en séquentiel", correct: false}
      - {text: "Il est toujours trié, et le tri final empêche de le découper en morceaux", correct: false}
      - {text: "Il se parallélise parfaitement : la taille inconnue n'a aucune importance", correct: false}
    answer: Le découpage d'un itérateur exige de lire les éléments pour les répartir.
  - key: code-split
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Spliterator<String> s = List.of("a", "b", "c", "d").spliterator();
      Spliterator<String> premiere = s.trySplit();
      premiere.forEachRemaining(System.out::print);
      System.out.print("|");
      s.forEachRemaining(System.out::print);
      ```
    choices:
      - {text: "`ab|cd`", correct: true}
      - {text: "`abcd|`", correct: false}
      - {text: "`cd|ab`", correct: false}
      - {text: "`a|bcd`", correct: false}
    answer: "`ab|cd` : la partie détachée prend la première moitié, et le spliterator d'origine garde la seconde."
    check:
      output: "ab|cd"
  - key: code-try-advance
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Spliterator<Integer> s = List.of(1, 2).spliterator();
      System.out.println(s.tryAdvance(x -> {}) + " " + s.tryAdvance(x -> {}) + " " + s.tryAdvance(x -> {}));
      ```
    choices:
      - {text: "`true true false`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`false true true`", correct: false}
      - {text: "`true false false`", correct: false}
    answer: "`true true false` : chaque appel consomme un élément ; le troisième n'en trouve plus."
    check:
      output: "true true false"
  - key: code-caracteristiques
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(new ArrayList<>(List.of(1)).spliterator().hasCharacteristics(Spliterator.SIZED) + " "
              + new HashSet<>(Set.of(1)).spliterator().hasCharacteristics(Spliterator.DISTINCT) + " "
              + new HashSet<>(Set.of(1)).spliterator().hasCharacteristics(Spliterator.ORDERED));
      ```
    choices:
      - {text: "`true true false`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`true false false`", correct: false}
      - {text: "`false true false`", correct: false}
    answer: '`true true false` : un `HashSet` est sans doublon et sans ordre.'
    check:
      output: "true true false"
  - key: code-abstract
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Compteur extends Spliterators.AbstractSpliterator<Integer> {
          private int n = 0;
          Compteur() { super(Long.MAX_VALUE, Spliterator.ORDERED); }
          public boolean tryAdvance(Consumer<? super Integer> action) {
              if (n >= 3) return false;
              action.accept(++n);
              return true;
          }
      }
      System.out.println(StreamSupport.stream(new Compteur(), false).map(x -> x * 10).toList());
      ```
    choices:
      - {text: "`[10, 20, 30]`", correct: true}
      - {text: "`[0, 10, 20]`", correct: false}
      - {text: "`[10, 20, 30, 40]`", correct: false}
      - {text: "Rien : le stream ne finit jamais", correct: false}
    answer: "`[10, 20, 30]` : `++n` donne 1, 2 puis 3, et `tryAdvance` renvoie `false` ensuite. La taille `Long.MAX_VALUE` n'est qu'une estimation."
    check:
      output: "[10, 20, 30]"
