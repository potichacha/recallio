notion: composition-fonctions
lesson: |-
  Les interfaces fonctionnelles ont des méthodes `default` qui **assemblent** des fonctions en de nouvelles fonctions.

  ```java
  Function<String, String> nettoyer = String::strip;
  Function<String, String> normaliser = nettoyer.andThen(String::toLowerCase);   // strip, puis toLowerCase
  Function<String, Integer> longueurNettoyee = nettoyer.andThen(String::length);

  Predicate<Utilisateur> actif = Utilisateur::actif;
  Predicate<Utilisateur> cible = actif.and(u -> u.age() >= 18).or(Utilisateur::admin);
  Predicate<Utilisateur> inactif = actif.negate();          // ou Predicate.not(Utilisateur::actif)

  Comparator<Employe> tri = Comparator.comparing(Employe::service)
          .thenComparing(Employe::salaire, Comparator.reverseOrder())
          .thenComparing(Employe::nom);
  ```

  | Méthode | Effet |
  |---|---|
  | `f.andThen(g)` | `g(f(x))` : f d'abord |
  | `f.compose(g)` | `f(g(x))` : g d'abord |
  | `Function.identity()` | `x -> x` |
  | `p.and(q)`, `p.or(q)`, `p.negate()`, `Predicate.not(p)` | combinaisons logiques, avec court-circuit |
  | `Consumer.andThen` | deux actions à la suite |
  | `Comparator.comparing`, `thenComparing`, `reversed`, `nullsFirst` | tris composés |

  - On construit ainsi des règles **réutilisables et nommées** (`estMajeur.and(estActif)`) plutôt que de grosses lambdas.
  - Pour combiner une liste de prédicats : `regles.stream().reduce(x -> true, Predicate::and)`.

  **Piège classique** : `comparing(Employe::salaire).thenComparing(Employe::nom).reversed()`. `reversed()` inverse **tout**
  le comparateur, nom compris ; pour inverser un seul critère, on le passe avec `Comparator.reverseOrder()`.

  **En entretien** : « `andThen` applique d'abord la fonction appelante, `compose` d'abord l'argument ; `and`, `or`,
  `negate` combinent les prédicats, `thenComparing` enchaîne les critères de tri. »
cards:
  - key: andthen-vs-compose
    format: course
    question: andThen vs compose ?
    answer: f.andThen(g) applique f puis g ; f.compose(g) applique g puis f.
  - key: inverser-seul-critere-tri
    format: course
    question: Comment inverser un seul critère de tri ?
    answer: '`thenComparing(extracteur, Comparator.reverseOrder())`.'
  - key: predicats
    format: course
    question: Comment combiner deux prédicats ?
    answer: Avec `p.and(q)`, `p.or(q)` et `p.negate()` (ou `Predicate.not(p)`) ; `and` et `or` court-circuitent comme `&&` et `||`.
  - key: liste-predicats
    format: course
    question: Comment combiner une liste de prédicats en un seul qui exige tous les critères ?
    answer: '`regles.stream().reduce(x -> true, Predicate::and)` ; avec `Predicate::or` et `x -> false` pour « au moins un ».'
  - key: vf-andthen
    format: true-false
    question: "`f.andThen(g)` calcule `g(f(x))`."
    truth: true
    answer: f d'abord, puis g sur son résultat.
  - key: vf-reversed
    format: true-false
    question: "`comparing(A).thenComparing(B).reversed()` n'inverse que le critère B."
    truth: false
    answer: Il inverse tout le comparateur.
  - key: vf-court-circuit
    format: true-false
    question: "`p.and(q)` n'évalue pas `q` si `p` est faux."
    truth: true
    answer: Comme `&&`.
  - key: vf-identity
    format: true-false
    question: "`Function.identity()` renvoie son argument tel quel."
    truth: true
    answer: Utile par exemple dans `toMap(Function.identity(), ...)`.
  - key: qcm-ordre
    format: multiple-choice
    question: "Avec `f = x -> x + 1` et `g = x -> x * 2`, que vaut `f.compose(g).apply(3)` ?"
    choices:
      - text: "7"
        correct: true
      - text: "8"
        correct: false
      - text: "6"
        correct: false
      - text: "4"
        correct: false
    answer: '`compose` applique g d''abord : 3 × 2 + 1.'
  - key: qcm-tri
    format: multiple-choice
    question: Comment trier par service croissant, puis par salaire décroissant ?
    choices:
      - text: "`comparing(Employe::service).thenComparing(Employe::salaire, reverseOrder())`"
        correct: true
      - text: "`comparing(Employe::service).thenComparing(comparing(Employe::salaire).reversed())`"
        correct: true
      - text: "`comparing(Employe::service).thenComparing(Employe::salaire).reversed()`"
        correct: false
      - text: "`comparing(Employe::salaire).reversed().thenComparing(Employe::service)`"
        correct: false
    answer: La troisième inverse aussi le service ; la dernière trie d'abord par salaire.
  - key: qcm-negation
    format: multiple-choice
    question: Comment obtenir les utilisateurs non bannis ?
    choices:
      - text: "`filter(Predicate.not(Utilisateur::banni))`"
        correct: true
      - text: "`filter(u -> !u.banni())`"
        correct: true
      - text: "`filter(Utilisateur::banni.negate())`"
        correct: false
      - text: "`filter(!Utilisateur::banni)`"
        correct: false
    answer: Une référence de méthode n'a pas de méthode `negate` tant qu'elle n'est pas typée.
  - key: qcm-consumer
    format: multiple-choice
    question: "Que fait `Consumer<String> c = journal::info; c.andThen(audit::enregistrer).accept(\"x\")` ?"
    choices:
      - text: "Journalise « x », puis l'enregistre dans l'audit"
        correct: true
      - text: "N'appelle que l'audit"
        correct: false
      - text: "Appelle l'audit avec le résultat du journal"
        correct: false
      - text: "Ne compile pas"
        correct: false
    answer: '`Consumer.andThen` exécute deux actions à la suite, sur la même valeur.'
  - key: trous-andthen
    format: fill-in
    question: |-
      Complétez pour nettoyer puis mettre en minuscules :
      ```java
      Function<String, String> normaliser = ((Function<String, String>) String::strip).___(String::toLowerCase);
      ```
    blanks: [[andThen]]
    answer: '`andThen` applique d''abord `strip`.'
  - key: trous-and
    format: fill-in
    question: |-
      Complétez pour exiger les deux règles :
      ```java
      Predicate<Commande> eligible = payee.___(livrable);
      ```
    blanks: [[and]]
    answer: '`and` combine avec court-circuit.'
  - key: trous-then-comparing
    format: fill-in
    question: |-
      Complétez pour trier par nom, puis par prénom :
      ```java
      Comparator<Personne> tri = Comparator.comparing(Personne::nom).___(Personne::prenom);
      ```
    blanks: [[thenComparing]]
    answer: Le second critère départage les égalités.
  - key: trous-reverse
    format: fill-in
    question: |-
      Complétez pour trier par note décroissante, puis par nom croissant :
      ```java
      Comparator<Eleve> tri = Comparator.comparing(Eleve::note, Comparator.___())
              .thenComparing(Eleve::nom);
      ```
    blanks: [[reverseOrder]]
    answer: Seul le critère de la note est inversé.
  - key: code-compose
    format: code-output
    question: |-
      ```java
      Function<Integer, Integer> plus1 = x -> x + 1;
      Function<Integer, Integer> fois2 = x -> x * 2;
      System.out.println(plus1.andThen(fois2).apply(3) + " " + plus1.compose(fois2).apply(3));
      ```
    answer: '`8 7`.'
    check:
      output: "8 7"
  - key: code-predicats
    format: code-output
    question: |-
      ```java
      Predicate<Integer> pair = n -> n % 2 == 0;
      Predicate<Integer> grand = n -> n > 5;
      System.out.println(Stream.of(2, 4, 7, 8, 9).filter(pair.and(grand).or(n -> n == 2)).toList());
      ```
    answer: '`[2, 8]`.'
    check:
      output: "[2, 8]"
  - key: code-reversed
    format: code-output
    question: |-
      ```java
      record E(String service, int salaire) {}
      List<E> l = new ArrayList<>(List.of(new E("b", 1), new E("a", 1), new E("a", 2)));
      l.sort(Comparator.comparing(E::service).thenComparingInt(E::salaire).reversed());
      System.out.println(l.stream().map(e -> e.service() + e.salaire()).toList());
      ```
    answer: '`[b1, a2, a1]` : `reversed()` inverse les deux critères.'
    check:
      output: "[b1, a2, a1]"
  - key: code-reduce-predicats
    format: code-output
    question: |-
      ```java
      List<Predicate<String>> regles = List.of(s -> !s.isEmpty(), s -> s.length() < 5, s -> s.startsWith("a"));
      Predicate<String> toutes = regles.stream().reduce(x -> true, Predicate::and);
      System.out.println(toutes.test("abc") + " " + toutes.test("abcdef"));
      ```
    answer: '`true false`.'
    check:
      output: "true false"
  - key: bug-reversed-global
    format: bug-fix
    question: |-
      Le classement doit être par score décroissant, puis par nom croissant ; mais les noms sortent aussi à l'envers :
      ```java
      joueurs.sort(Comparator.comparingInt(Joueur::score).thenComparing(Joueur::nom).reversed());
      ```
    answer: |-
      ```java
      joueurs.sort(Comparator.comparingInt(Joueur::score).reversed().thenComparing(Joueur::nom));
      ```
      `reversed()` inverse tout ce qui le précède. Placé juste après le score, il n'inverse que ce critère.
  - key: bug-grosse-lambda
    format: bug-fix
    question: |-
      Rendez ces règles réutilisables :
      ```java
      clients.stream().filter(c -> c.actif() && c.age() >= 18 && !c.bloque()).toList();
      ```
    answer: |-
      ```java
      Predicate<Client> actif = Client::actif;
      Predicate<Client> majeur = c -> c.age() >= 18;
      Predicate<Client> bloque = Client::bloque;

      clients.stream().filter(actif.and(majeur).and(bloque.negate())).toList();
      ```
      Chaque règle a un nom, se teste seule et se recombine ailleurs.
  - key: bug-ordre-compose
    format: bug-fix
    question: |-
      Ce code doit retirer les espaces **puis** prendre les trois premiers caractères, mais `"  abcdef"` donne `"a"` :
      ```java
      Function<String, String> troisPremiers = s -> s.substring(0, 3);
      Function<String, String> f = troisPremiers.andThen(String::strip);
      ```
    answer: |-
      ```java
      Function<String, String> f = troisPremiers.compose(String::strip);
      // ou : ((Function<String, String>) String::strip).andThen(troisPremiers)
      ```
      `andThen` appliquait d'abord `troisPremiers` (`"  a"`), puis `strip`. `compose` applique d'abord son argument.
  - key: bug-tri-manuel
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      commandes.sort((a, b) -> {
          int c = a.client().compareTo(b.client());
          if (c != 0) return c;
          return b.date().compareTo(a.date());
      });
      ```
    answer: |-
      ```java
      commandes.sort(Comparator.comparing(Commande::client)
              .thenComparing(Commande::date, Comparator.reverseOrder()));
      ```
      La composition dit les critères et leur sens, sans arithmétique de comparaison.
