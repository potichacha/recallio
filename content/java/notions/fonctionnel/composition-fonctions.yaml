notion: composition-fonctions
cards:
  - key: andthen-vs-compose
    format: course
    question: andThen vs compose ?
    answer: f.andThen(g) applique f puis g ; f.compose(g) applique g puis f.
  - key: inverser-seul-critere-tri
    format: course
    question: Comment inverser un seul critère de tri ?
    answer: '`thenComparing(extracteur, Comparator.reverseOrder())`.'
