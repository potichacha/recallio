notion: composition-fonctions
lesson: |-
  Les interfaces fonctionnelles ont des méthodes `default` qui **assemblent** des fonctions en de nouvelles fonctions.

  ```java
  Function<String, String> nettoyer = String::strip;
  Function<String, String> normaliser = nettoyer.andThen(String::toLowerCase);   // strip, puis toLowerCase
  Function<String, Integer> longueurNettoyee = nettoyer.andThen(String::length);

  Predicate<Utilisateur> actif = Utilisateur::actif;
  Predicate<Utilisateur> cible = actif.and(u -> u.age() >= 18).or(Utilisateur::admin);
  Predicate<Utilisateur> inactif = actif.negate();          // ou Predicate.not(Utilisateur::actif)

  Comparator<Employe> tri = Comparator.comparing(Employe::service)
          .thenComparing(Employe::salaire, Comparator.reverseOrder())
          .thenComparing(Employe::nom);
  ```

  | Méthode | Effet |
  |---|---|
  | `f.andThen(g)` | `g(f(x))` : f d'abord |
  | `f.compose(g)` | `f(g(x))` : g d'abord |
  | `Function.identity()` | `x -> x` |
  | `p.and(q)`, `p.or(q)`, `p.negate()`, `Predicate.not(p)` | combinaisons logiques, avec court-circuit |
  | `Consumer.andThen` | deux actions à la suite |
  | `Comparator.comparing`, `thenComparing`, `reversed`, `nullsFirst` | tris composés |

  - On construit ainsi des règles **réutilisables et nommées** (`estMajeur.and(estActif)`) plutôt que de grosses lambdas.
  - Pour combiner une liste de prédicats : `regles.stream().reduce(x -> true, Predicate::and)`.

  **Piège classique** : `comparing(Employe::salaire).thenComparing(Employe::nom).reversed()`. `reversed()` inverse **tout**
  le comparateur, nom compris ; pour inverser un seul critère, on le passe avec `Comparator.reverseOrder()`.

  **En entretien** : « `andThen` applique d'abord la fonction appelante, `compose` d'abord l'argument ; `and`, `or`,
  `negate` combinent les prédicats, `thenComparing` enchaîne les critères de tri. »
cards:
  - key: andthen-vs-compose
    format: course
    question: "Quelle différence entre `f.andThen(g)` et `f.compose(g)` ?"
    choices:
      - {text: "`f.andThen(g)` applique `f` puis `g` ; `f.compose(g)` applique `g` puis `f`", correct: true}
      - {text: "`f.andThen(g)` applique `g` puis `f` ; `f.compose(g)` applique `f` puis `g`", correct: false}
      - {text: "Aucune : ce sont deux noms de la même composition, `f` puis `g`", correct: false}
      - {text: "`andThen` lance `f` et `g` en parallèle, `compose` l'un après l'autre", correct: false}
    answer: "`f.andThen(g)` applique `f` puis `g` ; `f.compose(g)` applique `g` puis `f`, comme la notation mathématique f(g(x))."
  - key: inverser-seul-critere-tri
    format: course
    question: "Comment inverser un seul critère d'un tri composé, sans toucher aux précédents ?"
    choices:
      - {text: "`thenComparing(extracteur, Comparator.reverseOrder())`", correct: true}
      - {text: "`thenComparing(extracteur).reversed()`", correct: false}
      - {text: "`reversed().thenComparing(extracteur)`", correct: false}
      - {text: "`thenComparing(extracteur.negate())`", correct: false}
    answer: "`thenComparing(extracteur, Comparator.reverseOrder())` n'inverse que ce critère. Un `reversed()` inverse tout ce qui le précède dans la chaîne."
  - key: predicats
    format: course
    question: "Comment combiner deux prédicats `p` et `q` ?"
    choices:
      - {text: "Avec `p.and(q)`, `p.or(q)` et `p.negate()`, qui court-circuitent comme `&&`", correct: true}
      - {text: "Avec `p && q` et `p || q`, directement, comme pour deux variables booléennes", correct: false}
      - {text: "Avec `p.andThen(q)`, qui ne teste `q` que si `p` est vrai pour l'élément", correct: false}
      - {text: "Avec `Predicate.all(p, q)` et `Predicate.any(p, q)`, deux fabriques du JDK", correct: false}
    answer: "Avec `p.and(q)`, `p.or(q)` et `p.negate()` (ou `Predicate.not(p)`) ; `and` et `or` court-circuitent comme `&&` et `||`. Ces opérateurs, eux, ne s'appliquent qu'à des booléens, pas à des prédicats."
  - key: liste-predicats
    format: course
    question: "Comment combiner une liste de prédicats en un seul qui exige tous les critères ?"
    choices:
      - {text: "`regles.stream().reduce(x -> true, Predicate::and)`", correct: true}
      - {text: "`regles.stream().reduce(x -> false, Predicate::and)`", correct: false}
      - {text: "`regles.stream().reduce(x -> true, Predicate::or)`", correct: false}
      - {text: "`regles.stream().allMatch(Predicate::and)`", correct: false}
    answer: "`regles.stream().reduce(x -> true, Predicate::and)` ; avec `Predicate::or` et `x -> false` pour « au moins un ». Partir de `x -> false` avec `and` donnerait un prédicat toujours faux."
  - key: vf-andthen
    format: true-false
    question: "`f.andThen(g)` calcule `g(f(x))`."
    truth: true
    answer: f d'abord, puis g sur son résultat.
  - key: vf-reversed
    format: true-false
    question: "`comparing(A).thenComparing(B).reversed()` n'inverse que le critère B."
    truth: false
    answer: Il inverse tout le comparateur.
  - key: vf-court-circuit
    format: true-false
    question: "`p.and(q)` n'évalue pas `q` si `p` est faux."
    truth: true
    answer: Comme `&&`.
  - key: vf-identity
    format: true-false
    question: "`Function.identity()` renvoie son argument tel quel."
    truth: true
    answer: Utile par exemple dans `toMap(Function.identity(), ...)`.
  - key: qcm-ordre
    format: multiple-choice
    question: "Avec `f = x -> x + 1` et `g = x -> x * 2`, que vaut `f.compose(g).apply(3)` ?"
    choices:
      - text: "7"
        correct: true
      - text: "8"
        correct: false
      - text: "6"
        correct: false
      - text: "4"
        correct: false
    answer: '`compose` applique g d''abord : 3 × 2 + 1.'
  - key: qcm-tri
    format: multiple-choice
    question: "Quel comparateur trie par service croissant, puis par salaire décroissant ?"
    choices:
      - {text: "`comparing(Employe::service).thenComparing(Employe::salaire, reverseOrder())`", correct: true}
      - {text: "`comparing(Employe::service).reversed().thenComparing(Employe::salaire)`", correct: false}
      - {text: "`comparing(Employe::service).thenComparing(Employe::salaire).reversed()`", correct: false}
      - {text: "`comparing(Employe::salaire).reversed().thenComparing(Employe::service)`", correct: false}
    answer: "`reverseOrder()` en second argument n'inverse que le salaire. Un `reversed()` inverse tout ce qui le précède : le service seul, ou les deux critères en fin de chaîne ; la dernière trie d'abord par salaire."
  - key: qcm-negation
    format: multiple-choice
    question: "Lesquelles de ces écritures gardent les utilisateurs non bannis ?"
    choices:
      - text: "`filter(Predicate.not(Utilisateur::banni))`"
        correct: true
      - text: "`filter(u -> !u.banni())`"
        correct: true
      - text: "`filter(Utilisateur::banni.negate())`"
        correct: false
      - text: "`filter(!Utilisateur::banni)`"
        correct: false
    answer: Une référence de méthode n'a pas de méthode `negate` tant qu'elle n'est pas typée.
  - key: qcm-consumer
    format: multiple-choice
    question: "Que fait `Consumer<String> c = journal::info; c.andThen(audit::enregistrer).accept(\"x\")` ?"
    choices:
      - text: "Journalise « x », puis l'enregistre dans l'audit"
        correct: true
      - text: "N'appelle que l'audit"
        correct: false
      - text: "Appelle l'audit avec le résultat du journal"
        correct: false
      - text: "Ne compile pas"
        correct: false
    answer: '`Consumer.andThen` exécute deux actions à la suite, sur la même valeur.'
  - key: trous-andthen
    format: fill-in
    question: |-
      Complète pour nettoyer puis mettre en minuscules :
      ```java
      Function<String, String> normaliser = ((Function<String, String>) String::strip).___(String::toLowerCase);
      ```
    blanks: [[andThen]]
    answer: '`andThen` applique d''abord `strip`.'
  - key: trous-and
    format: fill-in
    question: |-
      Complète pour exiger les deux règles :
      ```java
      Predicate<Commande> eligible = payee.___(livrable);
      ```
    blanks: [[and]]
    answer: '`and` combine avec court-circuit.'
  - key: trous-then-comparing
    format: fill-in
    question: |-
      Complète pour trier par nom, puis par prénom :
      ```java
      Comparator<Personne> tri = Comparator.comparing(Personne::nom).___(Personne::prenom);
      ```
    blanks: [[thenComparing]]
    answer: Le second critère départage les égalités.
  - key: trous-reverse
    format: fill-in
    question: |-
      Complète pour trier par note décroissante, puis par nom croissant :
      ```java
      Comparator<Eleve> tri = Comparator.comparing(Eleve::note, Comparator.___())
              .thenComparing(Eleve::nom);
      ```
    blanks: [[reverseOrder]]
    answer: Seul le critère de la note est inversé.
  - key: code-compose
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Function<Integer, Integer> plus1 = x -> x + 1;
      Function<Integer, Integer> fois2 = x -> x * 2;
      System.out.println(plus1.andThen(fois2).apply(3) + " " + plus1.compose(fois2).apply(3));
      ```
    choices:
      - {text: "`8 7`", correct: true}
      - {text: "`7 8`", correct: false}
      - {text: "`8 8`", correct: false}
      - {text: "`7 7`", correct: false}
    answer: "`8 7` : `andThen` fait (3 + 1) × 2 = 8 ; `compose` applique d'abord `fois2`, puis `plus1` : 3 × 2 + 1 = 7."
    check:
      output: "8 7"
  - key: code-predicats
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Predicate<Integer> pair = n -> n % 2 == 0;
      Predicate<Integer> grand = n -> n > 5;
      System.out.println(Stream.of(2, 4, 7, 8, 9).filter(pair.and(grand).or(n -> n == 2)).toList());
      ```
    choices:
      - {text: "`[2, 8]`", correct: true}
      - {text: "`[8]`", correct: false}
      - {text: "`[2, 4, 8]`", correct: false}
      - {text: "`[2, 8, 9]`", correct: false}
    answer: "`[2, 8]` : 8 est pair et plus grand que 5 ; 2 passe par le `or`. 4 est pair mais trop petit."
    check:
      output: "[2, 8]"
  - key: code-reversed
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record E(String service, int salaire) {}
      List<E> l = new ArrayList<>(List.of(new E("b", 1), new E("a", 1), new E("a", 2)));
      l.sort(Comparator.comparing(E::service).thenComparingInt(E::salaire).reversed());
      System.out.println(l.stream().map(e -> e.service() + e.salaire()).toList());
      ```
    choices:
      - {text: "`[b1, a2, a1]`", correct: true}
      - {text: "`[b1, a1, a2]`", correct: false}
      - {text: "`[a1, a2, b1]`", correct: false}
      - {text: "`[a2, a1, b1]`", correct: false}
    answer: '`[b1, a2, a1]` : `reversed()` inverse les deux critères.'
    check:
      output: "[b1, a2, a1]"
  - key: code-reduce-predicats
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Predicate<String>> regles = List.of(s -> !s.isEmpty(), s -> s.length() < 5, s -> s.startsWith("a"));
      Predicate<String> toutes = regles.stream().reduce(x -> true, Predicate::and);
      System.out.println(toutes.test("abc") + " " + toutes.test("abcdef"));
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : `\"abc\"` respecte les trois règles ; `\"abcdef\"` a six caractères, la deuxième règle échoue."
    check:
      output: "true false"
  - key: bug-reversed-global
    format: bug-fix
    question: |-
      Le classement doit être par score décroissant, puis par nom croissant ; mais les noms sortent aussi à l'envers. Quelle correction est la bonne ?
      ```java
      joueurs.sort(Comparator.comparingInt(Joueur::score).thenComparing(Joueur::nom).reversed());
      ```
    choices:
      - {text: "`comparingInt(Joueur::score).reversed().thenComparing(Joueur::nom)`", correct: true}
      - {text: "`comparingInt(Joueur::score).reversed().thenComparing(Joueur::nom).reversed()`", correct: false}
      - {text: "`comparing(Joueur::nom).thenComparingInt(Joueur::score).reversed()`", correct: false}
      - {text: "`comparingInt(Joueur::score).thenComparing(Joueur::nom.reversed())`", correct: false}
    answer: |-
      ```java
      joueurs.sort(Comparator.comparingInt(Joueur::score).reversed().thenComparing(Joueur::nom));
      ```
      `reversed()` inverse tout ce qui le précède. Placé juste après le score, il n'inverse que ce critère.
  - key: bug-grosse-lambda
    format: bug-fix
    question: |-
      Comment rendre ces règles réutilisables ?
      ```java
      clients.stream().filter(c -> c.actif() && c.age() >= 18 && !c.bloque()).toList();
      ```
    choices:
      - {text: "Un `Predicate` nommé par règle, combinés par `actif.and(majeur).and(bloque.negate())`", correct: true}
      - {text: "Remplacer `&&` par `&`, pour que les trois règles soient évaluées à chaque élément", correct: false}
      - {text: "Passer le stream en `parallel()`, pour évaluer les trois règles en même temps", correct: false}
      - {text: "Déplacer la condition dans un `if`, à l'intérieur d'un `forEach` sur les clients", correct: false}
    answer: |-
      ```java
      Predicate<Client> actif = Client::actif;
      Predicate<Client> majeur = c -> c.age() >= 18;
      Predicate<Client> bloque = Client::bloque;

      clients.stream().filter(actif.and(majeur).and(bloque.negate())).toList();
      ```
      Chaque règle a un nom, se teste seule et se recombine ailleurs.
  - key: bug-ordre-compose
    format: bug-fix
    question: |-
      Ce code doit retirer les espaces **puis** prendre les trois premiers caractères, mais `"  abcdef"` donne `"a"`. Quelle correction est la bonne ?
      ```java
      Function<String, String> troisPremiers = s -> s.substring(0, 3);
      Function<String, String> f = troisPremiers.andThen(String::strip);
      ```
    choices:
      - {text: "`troisPremiers.compose(String::strip)`, qui applique `strip` d'abord", correct: true}
      - {text: "`((Function<String, String>) String::strip).compose(troisPremiers)`", correct: false}
      - {text: "`troisPremiers.andThen(String::trim)`, qui retire aussi les espaces", correct: false}
      - {text: "Remplacer `substring(0, 3)` par `substring(2, 5)`, pour sauter les espaces", correct: false}
    answer: |-
      ```java
      Function<String, String> f = troisPremiers.compose(String::strip);
      // ou : ((Function<String, String>) String::strip).andThen(troisPremiers)
      ```
      `andThen` appliquait d'abord `troisPremiers` (`"  a"`), puis `strip`. `compose` applique d'abord son argument.
  - key: bug-tri-manuel
    format: bug-fix
    question: |-
      Comment simplifier ce tri ?
      ```java
      commandes.sort((a, b) -> {
          int c = a.client().compareTo(b.client());
          if (c != 0) return c;
          return b.date().compareTo(a.date());
      });
      ```
    choices:
      - {text: "`comparing(Commande::client).thenComparing(Commande::date, reverseOrder())`", correct: true}
      - {text: "`comparing(Commande::client).thenComparing(Commande::date).reversed()`", correct: false}
      - {text: "`comparing(Commande::date).reversed().thenComparing(Commande::client)`", correct: false}
      - {text: "`comparing(Commande::client).thenComparing(Commande::date)`", correct: false}
    answer: |-
      ```java
      commandes.sort(Comparator.comparing(Commande::client)
              .thenComparing(Commande::date, Comparator.reverseOrder()));
      ```
      La composition dit les critères et leur sens, sans arithmétique de comparaison.
