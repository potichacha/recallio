notion: capture-variables
lesson: |-
  Une lambda peut utiliser les variables de la méthode qui l'entoure : elle les **capture**. Mais une variable locale
  capturée doit être **effectivement finale** : jamais réaffectée après son initialisation, même sans le mot `final`.

  ```java
  int seuil = 10;                                   // effectivement finale
  Predicate<Integer> grand = n -> n > seuil;        // OK

  int total = 0;
  liste.forEach(n -> total += n);                   // ne compile pas : total est modifiée
  ```

  - La lambda capture une **copie de la valeur** : elle peut vivre plus longtemps que la méthode (dans un autre thread,
    dans un champ). Autoriser la modification créerait deux variables divergentes et des courses entre threads.
  - Les **champs** (`this.compteur`) et les variables **statiques** ne sont pas concernés : la lambda capture `this`, et
    le champ peut changer. C'est permis, mais c'est un état partagé, pas forcément thread-safe.
  - Capturer un **objet mutable** est permis (la référence ne change pas) : `liste.forEach(n -> cumul.add(n))`. C'est
    souvent le signe qu'il faut plutôt un `reduce`, un `sum` ou un `collect`.
  - Le contournement `int[] total = {0}` compile, mais cache un effet de bord : à éviter.

  **Piège classique** : réaffecter la variable **après** la lambda (`seuil = 20;` plus bas). Elle cesse d'être
  effectivement finale, et la lambda déjà écrite ne compile plus.

  **En entretien** : « Les variables locales capturées doivent être effectivement finales, car la lambda en garde une
  copie ; pour accumuler, j'utilise `sum`, `reduce` ou `collect`, pas un compteur modifié. »
cards:
  - key: variable-capturee-doit-etre-effectivement-finale
    format: course
    question: "Pourquoi une variable locale capturée par une lambda doit-elle être effectivement finale ?"
    choices:
      - {text: "La lambda en capture une copie : la modifier créerait deux valeurs incohérentes", correct: true}
      - {text: "Une lambda s'exécute toujours dans un autre thread que la méthode qui la crée", correct: false}
      - {text: "Le JIT ne sait pas compiler une lambda qui lit une variable modifiable", correct: false}
      - {text: "Pour que la lambda puisse être sérialisée sans erreur, comme un objet", correct: false}
    answer: "La lambda capture une **copie** de la valeur : autoriser la modification créerait une incohérence entre la variable et sa copie (et des problèmes de concurrence). Rien n'oblige une lambda à tourner dans un autre thread : c'est sa durée de vie, qui peut dépasser celle de la méthode, qui impose la copie."
  - key: effectivement-finale
    format: course
    question: "Que veut dire « effectivement finale » pour une variable locale ?"
    choices:
      - {text: "Elle n'est jamais réaffectée après son initialisation, sans porter le mot `final`", correct: true}
      - {text: "Elle porte le mot `final` explicitement, avant d'être capturée par une lambda", correct: false}
      - {text: "Elle désigne un objet immuable, dont l'état ne change jamais après sa création", correct: false}
      - {text: "Elle n'est plus modifiée après la création de la lambda, même si elle l'était avant", correct: false}
    answer: "Une variable jamais réaffectée après son initialisation : elle pourrait recevoir le mot `final` sans erreur, mais il n'est pas nécessaire. Une réaffectation, avant ou après la lambda, lui retire ce statut."
  - key: champs
    format: course
    question: "Une lambda peut-elle modifier un champ de la classe qui l'entoure ?"
    choices:
      - {text: "Oui : elle capture `this`, pas la valeur du champ, qui reste un état partagé", correct: true}
      - {text: "Non : un champ capturé doit être effectivement final, comme une variable locale", correct: false}
      - {text: "Seulement si le champ est déclaré `volatile`, pour rester visible des threads", correct: false}
      - {text: "Seulement si le champ est `static`, car il n'appartient alors à aucun objet", correct: false}
    answer: "Oui : elle capture `this`, pas la valeur du champ. C'est permis, mais c'est un état partagé, pas thread-safe sans précaution."
  - key: contournement
    format: course
    question: "Pourquoi éviter `int[] total = {0}; liste.forEach(n -> total[0] += n);` ?"
    choices:
      - {text: "C'est un effet de bord mutable, faux en parallèle, quand `mapToInt(...).sum()` dit le calcul", correct: true}
      - {text: "Ça ne compile pas : `total` est modifiée, elle n'est donc pas effectivement finale", correct: false}
      - {text: "Ça lève une `ArrayIndexOutOfBoundsException` dès le deuxième élément de la liste", correct: false}
      - {text: "Le tableau est copié dans la lambda : `total[0]` vaut toujours 0 à la fin de la boucle", correct: false}
    answer: "Cela contourne la règle par un effet de bord mutable, fragile et faux en parallèle ; `liste.stream().mapToInt(...).sum()` exprime le calcul directement. Le code compile bien : la référence `total` n'est jamais réaffectée, seule la case du tableau change."
  - key: vf-final-obligatoire
    format: true-false
    question: Une variable locale doit porter le mot `final` pour être capturée.
    truth: false
    answer: Il suffit qu'elle soit effectivement finale.
  - key: vf-objet-mutable
    format: true-false
    question: Une lambda peut appeler `liste.add(x)` sur une liste locale capturée.
    truth: true
    answer: La référence ne change pas ; seul l'objet est modifié.
  - key: vf-reaffectation-apres
    format: true-false
    question: Réaffecter une variable après la lambda qui la capture est permis.
    truth: false
    answer: La variable n'est alors plus effectivement finale, et la lambda ne compile pas.
  - key: vf-copie
    format: true-false
    question: Une lambda capture la valeur des variables locales au moment de sa création.
    truth: true
    answer: C'est pourquoi on interdit de les modifier ensuite.
  - key: qcm-compile
    format: multiple-choice
    question: "Dans une méthode, lesquelles de ces lignes compilent ?"
    choices:
      - text: "`int n = 5; Runnable r = () -> System.out.println(n);`"
        correct: true
      - text: "`List<String> l = new ArrayList<>(); Runnable r = () -> l.add(\"x\");`"
        correct: true
      - text: "`int n = 5; Runnable r = () -> n++;`"
        correct: false
      - text: "`int n = 5; n = 6; Runnable r = () -> System.out.println(n);`"
        correct: false
    answer: Une variable modifiée, avant ou après, n'est pas effectivement finale.
  - key: qcm-accumuler
    format: multiple-choice
    question: "Quelle expression additionne les montants d'une liste sans compteur modifié par une lambda ?"
    choices:
      - {text: "`montants.stream().mapToInt(Integer::intValue).sum()`", correct: true}
      - {text: "`montants.stream().mapToInt(Integer::intValue).count()`", correct: false}
      - {text: "`int[] t = {0}; montants.forEach(m -> t[0] += m);`", correct: false}
      - {text: "`int t = 0; montants.forEach(m -> t += m);`", correct: false}
    answer: "`sum` additionne sans état partagé. `count` compte les éléments au lieu de les additionner ; le tableau `t` compile mais cache un effet de bord ; `t += m` ne compile pas."
  - key: qcm-raison
    format: multiple-choice
    question: "Pourquoi Java exige-t-il qu'une variable locale capturée par une lambda soit effectivement finale ?"
    choices:
      - {text: "Une lambda peut s'exécuter plus tard, ailleurs, avec sa propre copie de la valeur", correct: true}
      - {text: "Parce qu'une lambda ne peut lire aucune variable locale de la méthode", correct: false}
      - {text: "Pour des raisons de performances uniquement, sans autre conséquence", correct: false}
      - {text: "Parce que les variables locales sont rangées dans le tas, partagé par tous", correct: false}
    answer: "Une variable locale vit sur la pile d'un thread ; la lambda peut lui survivre, et en garde donc une copie. Interdire la modification évite qu'elles divergent, et des courses entre threads sur des variables de pile."
  - key: qcm-champ
    format: multiple-choice
    question: "Dans une méthode d'instance, que permet `() -> compteur++` si `compteur` est un champ ?"
    choices:
      - text: "Ça compile, car la lambda capture `this`"
        correct: true
      - text: "Ça ne compile pas"
        correct: false
      - text: "Ça modifie une copie locale du champ"
        correct: false
      - text: "Ça rend le champ `final`"
        correct: false
    answer: Permis, mais attention en concurrence.
  - key: code-capture
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static List<Integer> grands(List<Integer> l) {
          int seuil = 10;
          return l.stream().filter(n -> n > seuil).toList();
      }
      System.out.println(grands(List.of(5, 12, 30)));
      ```
    choices:
      - {text: "`[12, 30]`", correct: true}
      - {text: "`[5]`", correct: false}
      - {text: "`[5, 12, 30]`", correct: false}
      - {text: "Ça ne compile pas : `seuil` est une variable locale", correct: false}
    answer: "`[12, 30]` : `seuil` n'est jamais réaffectée, elle est effectivement finale et la lambda peut la lire."
    check:
      output: "[12, 30]"
  - key: code-modification
    format: code-output
    question: |-
      Qu'affiche `total(List.of(1, 2, 3))` ?
      ```java
      static int total(List<Integer> l) {
          int total = 0;
          l.forEach(n -> total += n);
          return total;
      }
      ```
    choices:
      - {text: "Ça ne compile pas : `total` est modifiée dans la lambda", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Une `ConcurrentModificationException`", correct: false}
    answer: "Ne compile pas : `total` est modifiée, elle n'est pas effectivement finale."
    check:
      compiles: false
  - key: code-mutable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static List<String> copie(List<String> l) {
          List<String> resultat = new ArrayList<>();
          l.forEach(s -> resultat.add(s.toUpperCase()));
          return resultat;
      }
      System.out.println(copie(List.of("a", "b")));
      ```
    choices:
      - {text: "`[A, B]`", correct: true}
      - {text: "`[]`", correct: false}
      - {text: "`[a, b]`", correct: false}
      - {text: "Ça ne compile pas : `resultat` est modifiée dans la lambda", correct: false}
    answer: '`[A, B]` : la référence `resultat` ne change pas, seul l''objet est modifié.'
    check:
      output: "[A, B]"
  - key: code-reaffectation-apres
    format: code-output
    question: |-
      Qu'affiche `tache().run()` ?
      ```java
      static Runnable tache() {
          String message = "a";
          Runnable r = () -> System.out.println(message);
          message = "b";
          return r;
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`a`", correct: false}
      - {text: "`b`", correct: false}
      - {text: "`a`, puis `b`", correct: false}
    answer: "Ne compile pas : la réaffectation qui suit rend `message` non effectivement finale."
    check:
      compiles: false
  - key: bug-compteur
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      int actifs = 0;
      utilisateurs.forEach(u -> { if (u.actif()) actifs++; });
      ```
    choices:
      - {text: "`long actifs = utilisateurs.stream().filter(Utilisateur::actif).count();`", correct: true}
      - {text: "Déclarer `final int actifs = 0;` pour que la lambda ait le droit de l'incrémenter", correct: false}
      - {text: "Remplacer `actifs++` par `actifs = actifs + 1`, que la lambda a le droit d'écrire", correct: false}
      - {text: "Déclarer `actifs` en `volatile int`, pour la partager avec la lambda", correct: false}
    answer: |-
      ```java
      long actifs = utilisateurs.stream().filter(Utilisateur::actif).count();
      ```
      La variable capturée ne peut pas être modifiée ; `count` exprime directement le comptage.
  - key: bug-tableau
    format: bug-fix
    question: |-
      Ce contournement compile, mais donne des totaux faux une fois le stream rendu parallèle. Quelle correction est la bonne ?
      ```java
      double[] total = {0};
      lignes.parallelStream().forEach(l -> total[0] += l.montant());
      ```
    choices:
      - {text: "`lignes.parallelStream().mapToDouble(Ligne::montant).sum()`", correct: true}
      - {text: "Déclarer le tableau `volatile`, pour que chaque thread voie la dernière valeur", correct: false}
      - {text: "Remplacer `double[]` par `Double[]`, un objet partagé correctement entre threads", correct: false}
      - {text: "Remplacer `parallelStream()` par `stream().parallel()`, mieux synchronisé", correct: false}
    answer: |-
      ```java
      double total = lignes.parallelStream().mapToDouble(Ligne::montant).sum();
      ```
      Plusieurs threads modifient la même case sans synchronisation et perdent des additions. `sum` combine correctement
      les résultats partiels.
  - key: bug-reaffectation
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      String prefixe = "LOG";
      if (urgent) prefixe = "ALERTE";
      messages.forEach(m -> System.out.println(prefixe + " " + m));
      ```
    choices:
      - {text: "Une seule affectation : `String prefixe = urgent ? \"ALERTE\" : \"LOG\";`", correct: true}
      - {text: "Déclarer `final String prefixe = \"LOG\";`, puis garder le `if` tel quel", correct: false}
      - {text: "Remplacer la lambda par la référence de méthode `System.out::println`", correct: false}
      - {text: "Déplacer le `if` après le `forEach`, pour que la lambda lise `\"LOG\"`", correct: false}
    answer: |-
      ```java
      String prefixe = urgent ? "ALERTE" : "LOG";
      messages.forEach(m -> System.out.println(prefixe + " " + m));
      ```
      Une variable affectée deux fois n'est pas effectivement finale. Une seule affectation (ici une ternaire) règle le
      problème.
  - key: bug-boucle
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      for (int i = 0; i < 3; i++) {
          executor.submit(() -> traiter(i));
      }
      ```
    choices:
      - {text: "Copier `i` à chaque tour, `int numero = i;`, et capturer `numero`", correct: true}
      - {text: "Déclarer le compteur `final int i` dans l'en-tête de la boucle `for`", correct: false}
      - {text: "Remplacer `submit` par `execute`, qui accepte une variable modifiée", correct: false}
      - {text: "Déclarer `i` avant la boucle, pour qu'il ne soit plus local au `for`", correct: false}
    answer: |-
      ```java
      for (int i = 0; i < 3; i++) {
          int numero = i;
          executor.submit(() -> traiter(numero));
      }
      ```
      Le compteur `i` est modifié à chaque tour ; une copie locale par tour est effectivement finale. (Une boucle
      for-each, `for (int n : numeros)`, a cette propriété directement.)
