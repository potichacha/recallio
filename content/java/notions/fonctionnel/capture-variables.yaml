notion: capture-variables
lesson: |-
  Une lambda peut utiliser les variables de la méthode qui l'entoure : elle les **capture**. Mais une variable locale
  capturée doit être **effectivement finale** : jamais réaffectée après son initialisation, même sans le mot `final`.

  ```java
  int seuil = 10;                                   // effectivement finale
  Predicate<Integer> grand = n -> n > seuil;        // OK

  int total = 0;
  liste.forEach(n -> total += n);                   // ne compile pas : total est modifiée
  ```

  - La lambda capture une **copie de la valeur** : elle peut vivre plus longtemps que la méthode (dans un autre thread,
    dans un champ). Autoriser la modification créerait deux variables divergentes et des courses entre threads.
  - Les **champs** (`this.compteur`) et les variables **statiques** ne sont pas concernés : la lambda capture `this`, et
    le champ peut changer. C'est permis, mais c'est un état partagé, pas forcément thread-safe.
  - Capturer un **objet mutable** est permis (la référence ne change pas) : `liste.forEach(n -> cumul.add(n))`. C'est
    souvent le signe qu'il faut plutôt un `reduce`, un `sum` ou un `collect`.
  - Le contournement `int[] total = {0}` compile, mais cache un effet de bord : à éviter.

  **Piège classique** : réaffecter la variable **après** la lambda (`seuil = 20;` plus bas). Elle cesse d'être
  effectivement finale, et la lambda déjà écrite ne compile plus.

  **En entretien** : « Les variables locales capturées doivent être effectivement finales, car la lambda en garde une
  copie ; pour accumuler, j'utilise `sum`, `reduce` ou `collect`, pas un compteur modifié. »
cards:
  - key: variable-capturee-doit-etre-effectivement-finale
    format: course
    question: Pourquoi une variable capturée doit-elle être effectivement finale ?
    answer: La lambda capture une copie de la valeur ; autoriser la modification créerait une incohérence (et des problèmes de concurrence).
  - key: effectivement-finale
    format: course
    question: Que veut dire « effectivement finale » ?
    answer: Une variable jamais réaffectée après son initialisation ; elle pourrait recevoir le mot `final` sans erreur, mais il n'est pas nécessaire.
  - key: champs
    format: course
    question: Une lambda peut-elle modifier un champ de la classe ?
    answer: "Oui : elle capture `this`, pas la valeur du champ. C'est permis, mais c'est un état partagé, pas thread-safe sans précaution."
  - key: contournement
    format: course
    question: Pourquoi éviter `int[] total = {0}; liste.forEach(n -> total[0] += n);` ?
    answer: Cela contourne la règle par un effet de bord mutable, fragile et faux en parallèle ; `liste.stream().mapToInt(...).sum()` exprime le calcul directement.
  - key: vf-final-obligatoire
    format: true-false
    question: Une variable locale doit porter le mot `final` pour être capturée.
    truth: false
    answer: Il suffit qu'elle soit effectivement finale.
  - key: vf-objet-mutable
    format: true-false
    question: Une lambda peut appeler `liste.add(x)` sur une liste locale capturée.
    truth: true
    answer: La référence ne change pas ; seul l'objet est modifié.
  - key: vf-reaffectation-apres
    format: true-false
    question: Réaffecter une variable après la lambda qui la capture est permis.
    truth: false
    answer: La variable n'est alors plus effectivement finale, et la lambda ne compile pas.
  - key: vf-copie
    format: true-false
    question: Une lambda capture la valeur des variables locales au moment de sa création.
    truth: true
    answer: C'est pourquoi on interdit de les modifier ensuite.
  - key: qcm-compile
    format: multiple-choice
    question: Dans une méthode, lesquelles compilent ?
    choices:
      - text: "`int n = 5; Runnable r = () -> System.out.println(n);`"
        correct: true
      - text: "`List<String> l = new ArrayList<>(); Runnable r = () -> l.add(\"x\");`"
        correct: true
      - text: "`int n = 5; Runnable r = () -> n++;`"
        correct: false
      - text: "`int n = 5; n = 6; Runnable r = () -> System.out.println(n);`"
        correct: false
    answer: Une variable modifiée, avant ou après, n'est pas effectivement finale.
  - key: qcm-accumuler
    format: multiple-choice
    question: Comment additionner les montants d'une liste sans compteur modifié par une lambda ?
    choices:
      - text: "`montants.stream().mapToInt(Integer::intValue).sum()`"
        correct: true
      - text: "`montants.stream().reduce(0, Integer::sum)`"
        correct: true
      - text: "`int[] t = {0}; montants.forEach(m -> t[0] += m);`"
        correct: false
      - text: "`int t = 0; montants.forEach(m -> t += m);`"
        correct: false
    answer: La dernière ne compile pas ; l'avant-dernière compile mais cache un effet de bord.
  - key: qcm-raison
    format: multiple-choice
    question: Pourquoi Java impose-t-il cette règle ?
    choices:
      - text: "Une lambda peut s'exécuter plus tard, ailleurs, avec sa copie de la valeur"
        correct: true
      - text: "Pour éviter des courses entre threads sur des variables de pile"
        correct: true
      - text: "Parce que les lambdas ne peuvent lire aucune variable"
        correct: false
      - text: "Pour des raisons de performances uniquement"
        correct: false
    answer: Une variable locale vit sur la pile d'un thread ; la lambda peut lui survivre.
  - key: qcm-champ
    format: multiple-choice
    question: "Dans une méthode d'instance, que permet `() -> compteur++` si `compteur` est un champ ?"
    choices:
      - text: "Ça compile, car la lambda capture `this`"
        correct: true
      - text: "Ça ne compile pas"
        correct: false
      - text: "Ça modifie une copie locale du champ"
        correct: false
      - text: "Ça rend le champ `final`"
        correct: false
    answer: Permis, mais attention en concurrence.
  - key: code-capture
    format: code-output
    question: |-
      ```java
      static List<Integer> grands(List<Integer> l) {
          int seuil = 10;
          return l.stream().filter(n -> n > seuil).toList();
      }
      System.out.println(grands(List.of(5, 12, 30)));
      ```
    answer: '`[12, 30]`.'
    check:
      output: "[12, 30]"
  - key: code-modification
    format: code-output
    question: |-
      ```java
      static int total(List<Integer> l) {
          int total = 0;
          l.forEach(n -> total += n);
          return total;
      }
      ```
    answer: "Ne compile pas : `total` est modifiée, elle n'est pas effectivement finale."
    check:
      compiles: false
  - key: code-mutable
    format: code-output
    question: |-
      ```java
      static List<String> copie(List<String> l) {
          List<String> resultat = new ArrayList<>();
          l.forEach(s -> resultat.add(s.toUpperCase()));
          return resultat;
      }
      System.out.println(copie(List.of("a", "b")));
      ```
    answer: '`[A, B]` : la référence `resultat` ne change pas, seul l''objet est modifié.'
    check:
      output: "[A, B]"
  - key: code-reaffectation-apres
    format: code-output
    question: |-
      ```java
      static Runnable tache() {
          String message = "a";
          Runnable r = () -> System.out.println(message);
          message = "b";
          return r;
      }
      ```
    answer: "Ne compile pas : la réaffectation qui suit rend `message` non effectivement finale."
    check:
      compiles: false
  - key: bug-compteur
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      int actifs = 0;
      utilisateurs.forEach(u -> { if (u.actif()) actifs++; });
      ```
    answer: |-
      ```java
      long actifs = utilisateurs.stream().filter(Utilisateur::actif).count();
      ```
      La variable capturée ne peut pas être modifiée ; `count` exprime directement le comptage.
  - key: bug-tableau
    format: bug-fix
    question: |-
      Ce contournement compile, mais donne des totaux faux une fois le stream rendu parallèle :
      ```java
      double[] total = {0};
      lignes.parallelStream().forEach(l -> total[0] += l.montant());
      ```
    answer: |-
      ```java
      double total = lignes.parallelStream().mapToDouble(Ligne::montant).sum();
      ```
      Plusieurs threads modifient la même case sans synchronisation et perdent des additions. `sum` combine correctement
      les résultats partiels.
  - key: bug-reaffectation
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      String prefixe = "LOG";
      if (urgent) prefixe = "ALERTE";
      messages.forEach(m -> System.out.println(prefixe + " " + m));
      ```
    answer: |-
      ```java
      String prefixe = urgent ? "ALERTE" : "LOG";
      messages.forEach(m -> System.out.println(prefixe + " " + m));
      ```
      Une variable affectée deux fois n'est pas effectivement finale. Une seule affectation (ici une ternaire) règle le
      problème.
  - key: bug-boucle
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      for (int i = 0; i < 3; i++) {
          executor.submit(() -> traiter(i));
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < 3; i++) {
          int numero = i;
          executor.submit(() -> traiter(numero));
      }
      ```
      Le compteur `i` est modifié à chaque tour ; une copie locale par tour est effectivement finale. (Une boucle
      for-each, `for (int n : numeros)`, a cette propriété directement.)
