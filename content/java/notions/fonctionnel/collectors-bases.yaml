notion: collectors-bases
lesson: |-
  `collect(collecteur)` est l'opération terminale qui **rassemble** les éléments dans un résultat. La classe
  `Collectors` fournit les collecteurs courants :

  ```java
  List<String> noms = s.collect(Collectors.toList());               // ou s.toList()
  Set<String> villes = s.collect(Collectors.toSet());
  Map<Long, Client> parId = clients.stream().collect(Collectors.toMap(Client::id, c -> c));
  String csv = noms.stream().collect(Collectors.joining(", ", "[", "]"));   // [a, b, c]
  long n = s.collect(Collectors.counting());
  int total = lignes.stream().collect(Collectors.summingInt(Ligne::quantite));
  double moyenne = notes.stream().collect(Collectors.averagingDouble(Note::valeur));
  TreeSet<String> tries = s.collect(Collectors.toCollection(TreeSet::new));

  var minMax = notes.stream().collect(Collectors.teeing(       // deux collecteurs, un passage (Java 12)
          Collectors.minBy(naturalOrder()), Collectors.maxBy(naturalOrder()),
          (min, max) -> new Intervalle(min.orElseThrow(), max.orElseThrow())));
  ```

  - **`joining`** est la bonne façon de concaténer des chaînes : un seul `StringBuilder`, avec séparateur, préfixe et
    suffixe.
  - `toSet()` ne garantit **aucun ordre** ; `toCollection(TreeSet::new)` ou `LinkedHashSet::new` pour en avoir un.
  - `toMap` lève une exception si deux éléments ont la **même clé** (voir la notion dédiée), et refuse les valeurs `null`.
  - `collectingAndThen(collecteur, finition)` transforme le résultat final (par exemple le rendre non modifiable).
  - `counting`, `summingInt`, `averagingDouble`, `minBy`, `mapping`... servent surtout comme **collecteurs en aval** d'un
    `groupingBy` ; seuls, `count()`, `mapToInt().sum()` ou `min()` se lisent mieux.

  **Piège classique** : concaténer avec `reduce("", (a, b) -> a + ", " + b)`. Le résultat commence par `", "`, et chaque
  étape crée une nouvelle chaîne ; `joining(", ")` fait juste et efficace.

  **En entretien** : « `toList`, `toSet`, `toMap`, `joining`, `toCollection` pour choisir l'implémentation, et `teeing`
  pour deux résultats en un passage. »
cards:
  - key: sert-collectors-teeing
    format: course
    question: À quoi sert Collectors.teeing ?
    answer: Combiner deux collecteurs en un seul passage puis fusionner leurs résultats (Java 12).
  - key: joining
    format: course
    question: Comment concaténer des chaînes avec un séparateur, un préfixe et un suffixe ?
    answer: '`Collectors.joining(", ", "[", "]")` : un seul `StringBuilder`, et aucun séparateur en trop.'
  - key: to-collection
    format: course
    question: Comment choisir l'implémentation de la collection produite par un stream ?
    answer: Avec `Collectors.toCollection(fabrique)`, par exemple `toCollection(TreeSet::new)` ou `toCollection(ArrayDeque::new)`.
  - key: collecting-and-then
    format: course
    question: À quoi sert `collectingAndThen` ?
    answer: À appliquer une transformation au résultat d'un collecteur, par exemple `collectingAndThen(toList(), Collections::unmodifiableList)`.
  - key: vf-to-set-ordre
    format: true-false
    question: "`Collectors.toSet()` garde l'ordre du stream."
    truth: false
    answer: Aucun ordre n'est garanti ; `toCollection(LinkedHashSet::new)` le garde.
  - key: vf-joining-vide
    format: true-false
    question: "`Stream.<String>empty().collect(joining(\",\", \"[\", \"]\"))` donne `[]`."
    truth: true
    answer: Le préfixe et le suffixe sont toujours ajoutés.
  - key: vf-counting
    format: true-false
    question: "`Collectors.counting()` produit un `Integer`."
    truth: false
    answer: Un `Long`.
  - key: vf-teeing
    format: true-false
    question: "`teeing` parcourt le stream deux fois."
    truth: false
    answer: Il envoie chaque élément aux deux collecteurs en un seul passage.
  - key: qcm-concatener
    format: multiple-choice
    question: Comment obtenir `"ada, alan, grace"` depuis la liste de noms ?
    choices:
      - text: "`noms.stream().collect(Collectors.joining(\", \"))`"
        correct: true
      - text: "`String.join(\", \", noms)`"
        correct: true
      - text: "`noms.stream().reduce(\"\", (a, b) -> a + \", \" + b)`"
        correct: false
      - text: "`noms.toString()`"
        correct: false
    answer: '`reduce` commencerait par `", "` ; `toString` ajoute des crochets.'
  - key: qcm-trie
    format: multiple-choice
    question: Comment collecter des mots dans un ensemble trié ?
    choices:
      - text: "`collect(Collectors.toCollection(TreeSet::new))`"
        correct: true
      - text: "`collect(Collectors.toSet())`"
        correct: false
      - text: "`sorted().collect(Collectors.toSet())`"
        correct: false
      - text: "`collect(Collectors.toSortedSet())`"
        correct: false
    answer: '`toSet` peut perdre l''ordre du tri ; `toSortedSet` n''existe pas.'
  - key: qcm-teeing
    format: multiple-choice
    question: Comment obtenir en un passage le nombre de commandes et leur montant total ?
    choices:
      - text: "`collect(teeing(counting(), summingInt(Commande::montant), Bilan::new))`"
        correct: true
      - text: "Deux streams : `count()` puis `mapToInt(...).sum()`, en deux passages"
        correct: false
      - text: "`collect(toMap(...))`"
        correct: false
      - text: "`collect(joining())`"
        correct: false
    answer: '`teeing` combine deux collecteurs et fusionne leurs résultats.'
  - key: qcm-moyenne
    format: multiple-choice
    question: Que renvoie `Stream.<Integer>empty().collect(Collectors.averagingInt(i -> i))` ?
    choices:
      - text: "0.0"
        correct: true
      - text: "Un `OptionalDouble` vide"
        correct: false
      - text: "`NaN`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: Contrairement à `IntStream.average()`, qui renvoie un `OptionalDouble`.
  - key: trous-joining
    format: fill-in
    question: |-
      Complétez pour produire `"a;b;c"` :
      ```java
      String s = Stream.of("a", "b", "c").collect(Collectors.___(";"));
      ```
    blanks: [[joining]]
    answer: '`joining` avec un séparateur.'
  - key: trous-to-collection
    format: fill-in
    question: |-
      Complétez pour obtenir une `ArrayDeque` :
      ```java
      Deque<Tache> file = taches.stream().collect(Collectors.toCollection(___::new));
      ```
    blanks: [[ArrayDeque]]
    answer: '`toCollection` prend un `Supplier` de collection.'
  - key: trous-to-map
    format: fill-in
    question: |-
      Complétez pour indexer les produits par code :
      ```java
      Map<String, Produit> parCode = produits.stream().collect(Collectors.___(Produit::code, p -> p));
      ```
    blanks: [[toMap]]
    answer: Clé, puis valeur.
  - key: trous-summing
    format: fill-in
    question: |-
      Complétez pour sommer les quantités :
      ```java
      int total = lignes.stream().collect(Collectors.___(Ligne::quantite));
      ```
    blanks: [[summingInt]]
    answer: '`mapToInt(Ligne::quantite).sum()` est équivalent, et plus direct seul.'
  - key: code-joining
    format: code-output
    question: |-
      ```java
      System.out.println(Stream.of("a", "b", "c").collect(Collectors.joining(", ", "[", "]")) + " "
              + Stream.<String>empty().collect(Collectors.joining(", ", "[", "]")));
      ```
    answer: '`[a, b, c] []`.'
    check:
      output: "[a, b, c] []"
  - key: code-teeing
    format: code-output
    question: |-
      ```java
      String r = Stream.of(4, 8, 6).collect(Collectors.teeing(
              Collectors.counting(),
              Collectors.summingInt(x -> x),
              (n, somme) -> n + " éléments, total " + somme));
      System.out.println(r);
      ```
    answer: '`3 éléments, total 18`.'
    check:
      output: "3 éléments, total 18"
  - key: code-to-collection
    format: code-output
    question: |-
      ```java
      Set<String> fruits = Stream.of("poire", "abricot", "kiwi").collect(Collectors.toCollection(TreeSet::new));
      System.out.println(fruits);
      ```
    answer: '`[abricot, kiwi, poire]`.'
    check:
      output: "[abricot, kiwi, poire]"
  - key: code-moyenne
    format: code-output
    question: |-
      ```java
      System.out.println(Stream.of(1, 2).collect(Collectors.averagingInt(x -> x)) + " "
              + Stream.<Integer>empty().collect(Collectors.averagingInt(x -> x)) + " "
              + Stream.of("a", "b").collect(Collectors.counting()));
      ```
    answer: '`1.5 0.0 2`.'
    check:
      output: "1.5 0.0 2"
  - key: bug-reduce-concat
    format: bug-fix
    question: |-
      Le résultat commence par une virgule :
      ```java
      String liste = noms.stream().reduce("", (a, b) -> a + ", " + b);
      ```
    answer: |-
      ```java
      String liste = noms.stream().collect(Collectors.joining(", "));
      ```
      `joining` place le séparateur entre les éléments seulement, avec un seul `StringBuilder`.
  - key: bug-to-set-ordre
    format: bug-fix
    question: |-
      Les tags s'affichent dans un ordre différent de celui saisi :
      ```java
      Set<String> tags = saisie.stream().map(String::strip).collect(Collectors.toSet());
      ```
    answer: |-
      ```java
      Set<String> tags = saisie.stream().map(String::strip).collect(Collectors.toCollection(LinkedHashSet::new));
      ```
      `toSet` ne garantit aucun ordre. Un `LinkedHashSet` garde l'ordre de première apparition, sans doublon.
  - key: bug-deux-passages
    format: bug-fix
    question: |-
      Ce code relit deux fois un stream coûteux (une requête) :
      ```java
      long nombre = requete().count();
      int total = requete().mapToInt(Vente::montant).sum();
      ```
    answer: |-
      ```java
      record Bilan(long nombre, int total) {}
      Bilan b = requete().collect(Collectors.teeing(
              Collectors.counting(),
              Collectors.summingInt(Vente::montant),
              Bilan::new));
      ```
      `teeing` calcule les deux résultats en un seul passage.
  - key: bug-string-builder
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      StringBuilder sb = new StringBuilder();
      for (int i = 0; i < codes.size(); i++) {
          if (i > 0) sb.append(" | ");
          sb.append(codes.get(i));
      }
      String s = sb.toString();
      ```
    answer: |-
      ```java
      String s = String.join(" | ", codes);
      // ou, après des transformations : codes.stream()...collect(Collectors.joining(" | "))
      ```
      La gestion du séparateur est déjà écrite dans le JDK.
