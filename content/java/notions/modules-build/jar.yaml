notion: jar
lesson: |-
  Un **JAR** (*Java ARchive*) est un fichier **ZIP** qui contient des classes compilées, des ressources et un **manifeste**
  (`META-INF/MANIFEST.MF`).

  ```
  jar --create --file app.jar --main-class com.recallio.App -C classes .   # créer
  jar tf app.jar                                                             # lister le contenu
  java -jar app.jar                                                          # lancer
  ```

  ```
  Manifest-Version: 1.0
  Main-Class: com.recallio.App
  Class-Path: lib/jackson-databind.jar lib/commons-lang3.jar
  Implementation-Version: 1.4.2
  ```

  - **`Main-Class`** rend le JAR **exécutable** avec `java -jar` ; **`Class-Path`** liste d'autres JAR, en chemins
    **relatifs** au JAR, séparés par des espaces.
  - Un JAR ordinaire ne contient **que le code du projet** : ses dépendances doivent être fournies à côté.
  - Un **« fat JAR »** (ou *uber JAR*) embarque toutes les dépendances : un seul fichier à déployer. Spring Boot produit
    un JAR exécutable avec ses dépendances imbriquées (et son propre lanceur) ; le plugin Shade de Maven fusionne les
    classes (attention aux fichiers de configuration en double, comme les `META-INF/services`).
  - Quarkus produit par défaut une arborescence `quarkus-app/` avec un `quarkus-run.jar` et ses bibliothèques à côté : les
    couches de l'image Docker se réutilisent mieux.
  - Un JAR peut être **signé**, et **multi-release** (des classes spécifiques à certaines versions de Java sous
    `META-INF/versions/N/`).
  - Le contenu d'un JAR se lit avec n'importe quel outil ZIP : ce n'est **pas** une protection du code.

  **Piège classique** : lancer avec `java -jar` un JAR construit sans `Main-Class`. La JVM répond « no main manifest
  attribute, in app.jar ».

  **En entretien** : « Un ZIP de classes avec un manifeste ; `Main-Class` le rend exécutable, `Class-Path` référence ses
  dépendances, ou un fat JAR les embarque toutes. »
tour:
  - title: Les archives JAR
    text: |-
      Un **JAR** (*Java ARchive*) est un fichier ZIP qui regroupe des classes compilées et des ressources, avec un
      **manifeste**, `META-INF/MANIFEST.MF`. On le crée avec l'outil `jar`, ou plus souvent avec Maven ou Gradle.

      Un JAR **exécutable** indique sa classe principale dans son manifeste (`Main-Class: fr.recallio.Main`), et
      `java -jar app.jar` la lance. Ce programme fabrique un petit JAR en mémoire avec `java.util.jar`, puis le relit.
      L'import explicite d'`Attributes` lève une ambiguïté : le module `java.base` en contient deux.
    example:
      files:
        Main.java: |-
          import java.util.jar.Attributes;

          void main() throws IOException {
              Manifest manifeste = new Manifest();
              manifeste.getMainAttributes().put(Attributes.Name.MANIFEST_VERSION, "1.0");
              manifeste.getMainAttributes().put(Attributes.Name.MAIN_CLASS, "fr.recallio.Main");

              ByteArrayOutputStream octets = new ByteArrayOutputStream();
              try (JarOutputStream jar = new JarOutputStream(octets, manifeste)) {
                  jar.putNextEntry(new JarEntry("fr/recallio/Main.class"));
                  jar.write(new byte[] {(byte) 0xCA, (byte) 0xFE, (byte) 0xBA, (byte) 0xBE});
                  jar.closeEntry();
              }

              try (JarInputStream lu = new JarInputStream(new ByteArrayInputStream(octets.toByteArray()))) {
                  IO.println("Main-Class : " + lu.getManifest().getMainAttributes().getValue("Main-Class"));
                  for (JarEntry entree = lu.getNextJarEntry(); entree != null; entree = lu.getNextJarEntry()) {
                      IO.println("entrée : " + entree.getName());
                  }
              }
          }
      output: |-
        Main-Class : fr.recallio.Main
        entrée : fr/recallio/Main.class
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'un fichier JAR ?
    answer: Une archive ZIP qui contient des classes compilées, des ressources et un manifeste (`META-INF/MANIFEST.MF`).
  - key: executable
    format: course
    question: Qu'est-ce qui rend un JAR exécutable avec `java -jar` ?
    answer: L'attribut `Main-Class` du manifeste, qui désigne la classe contenant `main` ; `Class-Path` indique ses dépendances.
  - key: fat-jar
    format: course
    question: Qu'est-ce qu'un fat JAR ?
    answer: Un JAR qui embarque toutes les dépendances de l'application, pour la déployer en un seul fichier.
  - key: shade
    format: course
    question: Quel piège présente la fusion de dépendances dans un fat JAR (plugin Shade) ?
    answer: Des fichiers de même nom (comme `META-INF/services/...`) venant de plusieurs JAR s'écrasent, sauf configuration pour les fusionner ; et des classes en double peuvent se masquer.
  - key: vf-zip
    format: true-false
    question: Un fichier JAR est une archive ZIP.
    truth: true
    answer: On peut l'ouvrir avec n'importe quel outil ZIP.
  - key: vf-dependances
    format: true-false
    question: Un JAR produit par `mvn package` sans plugin particulier contient toutes ses dépendances.
    truth: false
    answer: Il ne contient que le code du projet.
  - key: vf-class-path
    format: true-false
    question: Les chemins de l'attribut `Class-Path` sont relatifs à l'emplacement du JAR.
    truth: true
    answer: Ils sont séparés par des espaces.
  - key: vf-protection
    format: true-false
    question: Empaqueter le code dans un JAR le protège contre la lecture.
    truth: false
    answer: Les classes s'extraient et se décompilent facilement.
  - key: qcm-manifeste
    format: multiple-choice
    question: Quels attributs trouve-t-on dans un manifeste ?
    choices:
      - text: "`Main-Class`"
        correct: true
      - text: "`Class-Path`"
        correct: true
      - text: "`Java-Home`"
        correct: false
      - text: "`Heap-Size`"
        correct: false
    answer: '`Implementation-Version` et `Automatic-Module-Name` aussi.'
  - key: qcm-erreur
    format: multiple-choice
    question: "`java -jar app.jar` répond « no main manifest attribute ». Pourquoi ?"
    choices:
      - text: "Le manifeste n'a pas d'attribut `Main-Class`"
        correct: true
      - text: "Le JAR est corrompu, toujours"
        correct: false
      - text: "La JVM est trop ancienne"
        correct: false
      - text: "Le JAR est trop gros"
        correct: false
    answer: Il faut configurer le plugin de build (ou `jar --main-class`).
  - key: qcm-lister
    format: multiple-choice
    question: Comment vérifier le contenu d'un JAR livré ?
    choices:
      - text: "`jar tf app.jar`"
        correct: true
      - text: "`unzip -l app.jar`"
        correct: true
      - text: "`java -version app.jar`"
        correct: false
      - text: "`javac app.jar`"
        correct: false
    answer: Utile pour vérifier qu'une ressource ou une dépendance est bien présente.
  - key: qcm-multi-release
    format: multiple-choice
    question: Qu'est-ce qu'un JAR multi-release ?
    choices:
      - text: "Un JAR qui contient des versions de classes spécifiques à certaines versions de Java (`META-INF/versions/N/`)"
        correct: true
      - text: "Un JAR publié plusieurs fois"
        correct: false
      - text: "Un JAR qui contient plusieurs applications"
        correct: false
      - text: "Un JAR compressé en plusieurs morceaux"
        correct: false
    answer: La JVM choisit la version adaptée à son niveau.
  - key: trous-lancer
    format: fill-in
    question: |-
      Complétez pour lancer un JAR exécutable :
      ```
      java ___ app.jar
      ```
    blanks: [["-jar"]]
    answer: Le classpath vient alors du manifeste.
  - key: trous-main-class
    format: fill-in
    question: |-
      Complétez le manifeste :
      ```
      Manifest-Version: 1.0
      ___: com.recallio.App
      ```
    blanks: [[Main-Class]]
    answer: La classe qui contient `main`.
  - key: trous-lister
    format: fill-in
    question: |-
      Complétez pour lister le contenu de l'archive :
      ```
      jar ___ app.jar
      ```
    blanks: [[tf]]
    answer: '`t` pour lister, `f` pour désigner le fichier.'
  - key: trous-manifeste
    format: fill-in
    question: |-
      Complétez le chemin du manifeste dans un JAR :
      ```
      ___/MANIFEST.MF
      ```
    blanks: [[META-INF]]
    answer: Le dossier des métadonnées de l'archive.
