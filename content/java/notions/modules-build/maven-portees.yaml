notion: maven-portees
lesson: |-
  La **portée** (*scope*) d'une dépendance dit **à quels classpaths** elle appartient (compilation, tests, exécution) et si
  elle est **transmise** aux projets qui dépendent de nous :

  | Portée | Compilation | Tests | Exécution (livrée) | Transitive |
  |---|---|---|---|---|
  | **`compile`** (défaut) | oui | oui | oui | oui |
  | **`provided`** | oui | oui | non : fournie par l'environnement | non |
  | **`runtime`** | non | oui | oui | oui |
  | **`test`** | non (code principal) | oui | non | non |
  | `import` | — | — | — | importe un BOM dans `dependencyManagement` |

  ```xml
  <dependency>
    <groupId>org.postgresql</groupId>
    <artifactId>postgresql</artifactId>
    <scope>runtime</scope>                     <!-- le pilote : utilisé par JDBC à l'exécution, jamais importé -->
  </dependency>
  <dependency>
    <groupId>org.junit.jupiter</groupId>
    <artifactId>junit-jupiter</artifactId>
    <scope>test</scope>
  </dependency>
  <dependency>
    <groupId>jakarta.servlet</groupId>
    <artifactId>jakarta.servlet-api</artifactId>
    <scope>provided</scope>                    <!-- fournie par le serveur d'applications -->
  </dependency>
  ```

  - **`runtime`** : le code ne s'en sert qu'à l'exécution (pilote JDBC, implémentation de journalisation) ; le
    compilateur empêche de dépendre par erreur de ses classes.
  - **`provided`** : présente à la compilation, mais **non livrée** ; l'environnement d'exécution doit la fournir (serveur
    d'applications, annotations utilisées seulement à la compilation). Si personne ne la fournit :
    `NoClassDefFoundError` à l'exécution.
  - **`test`** : les bibliothèques de test ne doivent jamais se retrouver dans le livrable.
  - `<optional>true</optional>` empêche une dépendance d'être transmise aux projets qui dépendent de nous.

  **Piège classique** : JUnit ou Mockito en portée `compile`. Ils se retrouvent dans le JAR livré et dans le classpath de
  tous les projets qui dépendent du nôtre.

  **En entretien** : « `compile` partout, `provided` fournie par l'environnement et non livrée, `runtime` seulement à
  l'exécution, `test` seulement pour les tests ; seules `compile` et `runtime` sont transitives. »
cards:
  - key: difference-scopes-compile-provided-runtime-test
    format: course
    question: Différence entre les scopes compile, provided, runtime, test ?
    answer: Partout / fourni par le conteneur à l'exécution / nécessaire seulement à l'exécution / seulement pour les tests.
  - key: runtime-usage
    format: course
    question: Pourquoi mettre un pilote JDBC en portée `runtime` ?
    answer: Le code ne l'utilise qu'à l'exécution, via l'API JDBC ; la portée `runtime` empêche d'importer ses classes par erreur, tout en le livrant.
  - key: provided-risque
    format: course
    question: Quel risque présente la portée `provided` ?
    answer: La dépendance n'est pas livrée ; si l'environnement d'exécution ne la fournit pas, l'application lève `NoClassDefFoundError`.
  - key: optional
    format: course
    question: À quoi sert `<optional>true</optional>` sur une dépendance ?
    answer: À l'utiliser dans notre projet sans la transmettre aux projets qui dépendent de nous ; ils devront la déclarer eux-mêmes s'ils en ont besoin.
  - key: vf-defaut
    format: true-false
    question: La portée par défaut d'une dépendance Maven est `compile`.
    truth: true
    answer: Elle est disponible partout et transitive.
  - key: vf-test-transitive
    format: true-false
    question: Une dépendance de portée `test` est transmise aux projets qui dépendent du nôtre.
    truth: false
    answer: Elle reste propre à nos tests.
  - key: vf-provided-livree
    format: true-false
    question: Une dépendance `provided` est incluse dans le JAR exécutable de l'application.
    truth: false
    answer: Elle est censée être fournie par l'environnement.
  - key: vf-runtime-compile
    format: true-false
    question: Le code principal peut importer une classe d'une dépendance `runtime`.
    truth: false
    answer: Elle n'est pas sur le classpath de compilation.
  - key: qcm-portees
    format: multiple-choice
    question: Associez correctement dépendance et portée.
    choices:
      - text: "JUnit : `test`"
        correct: true
      - text: "Pilote PostgreSQL : `runtime`"
        correct: true
      - text: "Mockito : `compile`"
        correct: false
      - text: "Jackson utilisé par le code : `provided` dans une application autonome"
        correct: false
    answer: Une application autonome doit livrer Jackson (`compile`).
  - key: qcm-transitives
    format: multiple-choice
    question: Quelles portées sont transitives ?
    choices:
      - text: "`compile`"
        correct: true
      - text: "`runtime`"
        correct: true
      - text: "`test`"
        correct: false
      - text: "`provided`"
        correct: false
    answer: '`test` et `provided` restent dans le projet qui les déclare.'
  - key: qcm-import
    format: multiple-choice
    question: À quoi sert la portée `import` ?
    choices:
      - text: "À importer un BOM dans `dependencyManagement` (avec `<type>pom</type>`)"
        correct: true
      - text: "À importer un package Java"
        correct: false
      - text: "À copier une dépendance dans le projet"
        correct: false
      - text: "À ignorer une dépendance"
        correct: false
    answer: Le BOM fournit alors ses versions.
  - key: qcm-noclassdef
    format: multiple-choice
    question: "Une application autonome lève `NoClassDefFoundError` sur une classe d'une dépendance déclarée en `provided`. Pourquoi ?"
    choices:
      - text: "La dépendance n'a pas été livrée et aucun environnement ne la fournit"
        correct: true
      - text: "La dépendance est trop récente"
        correct: false
      - text: "Le JAR est corrompu"
        correct: false
      - text: "La portée `provided` interdit la réflexion"
        correct: false
    answer: Il faut la passer en `compile` (ou `runtime`).
  - key: trous-test
    format: fill-in
    question: |-
      Complétez pour que AssertJ ne serve qu'aux tests :
      ```xml
      <dependency>
        <groupId>org.assertj</groupId>
        <artifactId>assertj-core</artifactId>
        <scope>___</scope>
      </dependency>
      ```
    blanks: [[test]]
    answer: Elle n'est ni livrée ni transmise.
  - key: trous-runtime
    format: fill-in
    question: |-
      Complétez pour le pilote JDBC :
      ```xml
      <artifactId>postgresql</artifactId>
      <scope>___</scope>
      ```
    blanks: [[runtime]]
    answer: Utilisé à l'exécution, jamais importé.
  - key: trous-provided
    format: fill-in
    question: |-
      Complétez pour l'API servlet fournie par le serveur :
      ```xml
      <artifactId>jakarta.servlet-api</artifactId>
      <scope>___</scope>
      ```
    blanks: [[provided]]
    answer: Présente à la compilation, non livrée.
  - key: trous-optional
    format: fill-in
    question: |-
      Complétez pour ne pas transmettre cette dépendance aux utilisateurs de la bibliothèque :
      ```xml
      <artifactId>caffeine</artifactId>
      <___>true</___>
      ```
    blanks: [[optional], [optional]]
    answer: Les utilisateurs l'ajouteront s'ils activent la fonction qui en dépend.
  - key: bug-junit-compile
    format: bug-fix
    question: |-
      Le JAR livré contient JUnit et Mockito, et les projets qui dépendent de la bibliothèque les récupèrent :
      ```xml
      <dependency>
        <groupId>org.junit.jupiter</groupId>
        <artifactId>junit-jupiter</artifactId>
      </dependency>
      ```
    answer: |-
      ```xml
      <dependency>
        <groupId>org.junit.jupiter</groupId>
        <artifactId>junit-jupiter</artifactId>
        <scope>test</scope>
      </dependency>
      ```
      Sans portée, la dépendance est en `compile` : livrée et transmise. Les bibliothèques de test vont en `test`.
  - key: bug-provided-autonome
    format: bug-fix
    question: |-
      Ce JAR exécutable lève `NoClassDefFoundError: com/fasterxml/jackson/databind/ObjectMapper` au démarrage :
      ```xml
      <artifactId>jackson-databind</artifactId>
      <scope>provided</scope>
      ```
    answer: |-
      ```xml
      <artifactId>jackson-databind</artifactId>
      <!-- portée compile par défaut -->
      ```
      Une application autonome n'a pas d'environnement qui fournit Jackson : la portée `provided` l'excluait du livrable.
  - key: bug-driver-compile
    format: bug-fix
    question: |-
      Des classes internes du pilote PostgreSQL se retrouvent importées dans le code métier :
      ```xml
      <artifactId>postgresql</artifactId>
      ```
    answer: |-
      ```xml
      <artifactId>postgresql</artifactId>
      <scope>runtime</scope>
      ```
      En portée `runtime`, le pilote est livré mais absent du classpath de compilation : le code ne peut dépendre que de
      l'API JDBC standard.
  - key: bug-test-dans-main
    format: bug-fix
    question: |-
      La compilation du code principal échoue : « package org.assertj.core.api does not exist ».
      ```java
      // src/main/java/com/recallio/Verification.java
      import static org.assertj.core.api.Assertions.assertThat;
      ```
    answer: |-
      ```java
      // src/main/java/com/recallio/Verification.java
      if (montant.signum() < 0) {
          throw new IllegalArgumentException("montant négatif");
      }
      // et les assertions AssertJ restent dans src/test/java
      ```
      AssertJ est en portée `test` : elle n'existe pas pour le code principal. Les vérifications de production utilisent
      des exceptions (ou `Objects.requireNonNull`), pas une bibliothèque de test.
