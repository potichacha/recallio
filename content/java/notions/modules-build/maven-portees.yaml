notion: maven-portees
lesson: |-
  La **portée** (*scope*) d'une dépendance dit **à quels classpaths** elle appartient (compilation, tests, exécution) et si
  elle est **transmise** aux projets qui dépendent de nous :

  | Portée | Compilation | Tests | Exécution (livrée) | Transitive |
  |---|---|---|---|---|
  | **`compile`** (défaut) | oui | oui | oui | oui |
  | **`provided`** | oui | oui | non : fournie par l'environnement | non |
  | **`runtime`** | non | oui | oui | oui |
  | **`test`** | non (code principal) | oui | non | non |
  | `import` | — | — | — | importe un BOM dans `dependencyManagement` |

  ```xml
  <dependency>
    <groupId>org.postgresql</groupId>
    <artifactId>postgresql</artifactId>
    <scope>runtime</scope>                     <!-- le pilote : utilisé par JDBC à l'exécution, jamais importé -->
  </dependency>
  <dependency>
    <groupId>org.junit.jupiter</groupId>
    <artifactId>junit-jupiter</artifactId>
    <scope>test</scope>
  </dependency>
  <dependency>
    <groupId>jakarta.servlet</groupId>
    <artifactId>jakarta.servlet-api</artifactId>
    <scope>provided</scope>                    <!-- fournie par le serveur d'applications -->
  </dependency>
  ```

  - **`runtime`** : le code ne s'en sert qu'à l'exécution (pilote JDBC, implémentation de journalisation) ; le
    compilateur empêche de dépendre par erreur de ses classes.
  - **`provided`** : présente à la compilation, mais **non livrée** ; l'environnement d'exécution doit la fournir (serveur
    d'applications, annotations utilisées seulement à la compilation). Si personne ne la fournit :
    `NoClassDefFoundError` à l'exécution.
  - **`test`** : les bibliothèques de test ne doivent jamais se retrouver dans le livrable.
  - `<optional>true</optional>` empêche une dépendance d'être transmise aux projets qui dépendent de nous.

  **Piège classique** : JUnit ou Mockito en portée `compile`. Ils se retrouvent dans le JAR livré et dans le classpath de
  tous les projets qui dépendent du nôtre.

  **En entretien** : « `compile` partout, `provided` fournie par l'environnement et non livrée, `runtime` seulement à
  l'exécution, `test` seulement pour les tests ; seules `compile` et `runtime` sont transitives. »
cards:
  - key: difference-scopes-compile-provided-runtime-test
    format: course
    question: "Laquelle de ces descriptions des portées Maven `compile`, `provided`, `runtime` et `test` est juste ?"
    choices:
      - {text: "`compile` partout ; `provided` fournie par le serveur ; `runtime` à l'exécution seule ; `test` aux tests", correct: true}
      - {text: "`compile` partout ; `provided` à l'exécution seule ; `runtime` fournie par le serveur ; `test` aux tests", correct: false}
      - {text: "`compile` à la compilation seule ; `provided` livrée ; `runtime` à l'exécution seule ; `test` aux tests", correct: false}
      - {text: "`compile` partout ; `provided` aux tests ; `runtime` fournie par le serveur ; `test` en CI seule", correct: false}
    answer: "`compile` sert partout et se livre ; `provided` est fournie par le conteneur à l'exécution ; `runtime` n'est nécessaire qu'à l'exécution ; `test` ne sert qu'aux tests."
  - key: runtime-usage
    format: course
    question: Pourquoi mettre un pilote JDBC en portée `runtime` ?
    choices:
      - {text: "Le code ne passe que par l'API JDBC : `runtime` livre le pilote sans permettre d'importer ses classes", correct: true}
      - {text: "Pour qu'il ne soit pas livré : le serveur de base de données le fournit à l'application", correct: false}
      - {text: "Pour accélérer la compilation, le pilote n'étant chargé qu'à la première requête", correct: false}
      - {text: "Parce qu'un pilote JDBC déclaré en portée `compile` est refusé par Maven", correct: false}
    answer: Le code ne l'utilise qu'à l'exécution, via l'API JDBC ; la portée `runtime` empêche d'importer ses classes par erreur, tout en le livrant.
  - key: provided-risque
    format: course
    question: Quel risque présente la portée `provided` ?
    choices:
      - {text: "Elle n'est pas livrée : sans environnement qui la fournit, `NoClassDefFoundError`", correct: true}
      - {text: "Elle est livrée deux fois, une par le projet et une par le serveur", correct: false}
      - {text: "Elle manque à la compilation, ce qui casse le build du projet", correct: false}
      - {text: "Elle se transmet aux projets qui dépendent du nôtre, avec sa version", correct: false}
    answer: La dépendance n'est pas livrée ; si l'environnement d'exécution ne la fournit pas, l'application lève `NoClassDefFoundError`.
  - key: optional
    format: course
    question: À quoi sert `<optional>true</optional>` sur une dépendance ?
    choices:
      - {text: "À l'utiliser dans le projet sans la transmettre aux projets qui dépendent de lui", correct: true}
      - {text: "À ne la télécharger que si le réseau est disponible au moment du build", correct: false}
      - {text: "À rendre le build possible même si elle manque à la compilation", correct: false}
      - {text: "À ne la charger qu'à l'exécution, comme le fait la portée `runtime`", correct: false}
    answer: À l'utiliser dans notre projet sans la transmettre aux projets qui dépendent de nous ; ils devront la déclarer eux-mêmes s'ils en ont besoin.
  - key: vf-defaut
    format: true-false
    question: La portée par défaut d'une dépendance Maven est `compile`.
    truth: true
    answer: Elle est disponible partout et transitive.
  - key: vf-test-transitive
    format: true-false
    question: Une dépendance de portée `test` est transmise aux projets qui dépendent du nôtre.
    truth: false
    answer: Elle reste propre à nos tests.
  - key: vf-provided-livree
    format: true-false
    question: Une dépendance `provided` est incluse dans le JAR exécutable de l'application.
    truth: false
    answer: Elle est censée être fournie par l'environnement.
  - key: vf-runtime-compile
    format: true-false
    question: Le code principal peut importer une classe d'une dépendance `runtime`.
    truth: false
    answer: Elle n'est pas sur le classpath de compilation.
  - key: qcm-portees
    format: multiple-choice
    question: "Quelle association entre dépendance et portée est correcte ?"
    choices:
      - {text: "Pilote PostgreSQL : `runtime`", correct: true}
      - {text: "Mockito : `compile`", correct: false}
      - {text: "Jackson, utilisé par le code d'une application autonome : `provided`", correct: false}
      - {text: "JUnit : `runtime`", correct: false}
    answer: "Le pilote ne sert qu'à l'exécution, via l'API JDBC : `runtime`. Mockito et JUnit vont en `test`, et une application autonome doit livrer Jackson (`compile`)."
  - key: qcm-transitives
    format: multiple-choice
    question: Quelles portées sont transitives ?
    choices:
      - text: "`compile`"
        correct: true
      - text: "`runtime`"
        correct: true
      - text: "`test`"
        correct: false
      - text: "`provided`"
        correct: false
    answer: '`test` et `provided` restent dans le projet qui les déclare.'
  - key: qcm-import
    format: multiple-choice
    question: À quoi sert la portée `import` ?
    choices:
      - {text: "À importer un BOM dans `dependencyManagement` (avec `<type>pom</type>`)", correct: true}
      - {text: "À importer les classes d'un package Java dans tout le projet", correct: false}
      - {text: "À copier le JAR d'une dépendance dans les sources du projet", correct: false}
      - {text: "À importer les plugins d'un autre POM dans la section `build`", correct: false}
    answer: Le BOM fournit alors ses versions.
  - key: qcm-noclassdef
    format: multiple-choice
    question: "Une application autonome lève `NoClassDefFoundError` sur une classe d'une dépendance déclarée en `provided`. Pourquoi ?"
    choices:
      - {text: "La dépendance n'a pas été livrée et aucun environnement ne la fournit", correct: true}
      - {text: "La dépendance est trop récente pour la version de Java utilisée", correct: false}
      - {text: "Le JAR de la dépendance a été corrompu pendant le téléchargement", correct: false}
      - {text: "La portée `provided` interdit d'instancier ses classes par réflexion", correct: false}
    answer: Il faut la passer en `compile` (ou `runtime`).
  - key: trous-test
    format: fill-in
    question: |-
      Complète pour que AssertJ ne serve qu'aux tests :
      ```xml
      <dependency>
        <groupId>org.assertj</groupId>
        <artifactId>assertj-core</artifactId>
        <scope>___</scope>
      </dependency>
      ```
    blanks: [[test]]
    answer: Elle n'est ni livrée ni transmise.
  - key: trous-runtime
    format: fill-in
    question: |-
      Complète pour le pilote JDBC :
      ```xml
      <artifactId>postgresql</artifactId>
      <scope>___</scope>
      ```
    blanks: [[runtime]]
    answer: Utilisé à l'exécution, jamais importé.
  - key: trous-provided
    format: fill-in
    question: |-
      Complète pour l'API servlet fournie par le serveur :
      ```xml
      <artifactId>jakarta.servlet-api</artifactId>
      <scope>___</scope>
      ```
    blanks: [[provided]]
    answer: Présente à la compilation, non livrée.
  - key: trous-optional
    format: fill-in
    question: |-
      Complète pour ne pas transmettre cette dépendance aux utilisateurs de la bibliothèque :
      ```xml
      <artifactId>caffeine</artifactId>
      <___>true</___>
      ```
    blanks: [[optional], [optional]]
    answer: Les utilisateurs l'ajouteront s'ils activent la fonction qui en dépend.
  - key: bug-junit-compile
    format: bug-fix
    question: |-
      Le JAR livré contient JUnit, et les projets qui dépendent de la bibliothèque le récupèrent. Quelle correction est la bonne ?
      ```xml
      <dependency>
        <groupId>org.junit.jupiter</groupId>
        <artifactId>junit-jupiter</artifactId>
      </dependency>
      ```
    choices:
      - {text: "Ajouter `<scope>test</scope>` à la dépendance", correct: true}
      - {text: "Ajouter `<scope>provided</scope>` à la dépendance", correct: false}
      - {text: "Ajouter `<optional>true</optional>` à la dépendance", correct: false}
      - {text: "Ajouter `<scope>runtime</scope>` à la dépendance", correct: false}
    answer: |-
      ```xml
      <dependency>
        <groupId>org.junit.jupiter</groupId>
        <artifactId>junit-jupiter</artifactId>
        <scope>test</scope>
      </dependency>
      ```
      Sans portée, la dépendance est en `compile` : livrée et transmise. Les bibliothèques de test vont en `test`.
  - key: bug-provided-autonome
    format: bug-fix
    question: |-
      Ce JAR exécutable lève `NoClassDefFoundError: com/fasterxml/jackson/databind/ObjectMapper` au démarrage. Quelle correction est la bonne ?
      ```xml
      <artifactId>jackson-databind</artifactId>
      <scope>provided</scope>
      ```
    choices:
      - {text: "Retirer `<scope>provided</scope>`, pour revenir à la portée `compile`", correct: true}
      - {text: "Passer la portée à `test`, pour que Jackson soit chargé à part", correct: false}
      - {text: "Ajouter `<optional>true</optional>`, pour le charger à la demande", correct: false}
      - {text: "Lancer le JAR avec `-cp jackson-databind.jar` en plus de `-jar`", correct: false}
    answer: |-
      ```xml
      <artifactId>jackson-databind</artifactId>
      <!-- portée compile par défaut -->
      ```
      Une application autonome n'a pas d'environnement qui fournit Jackson : la portée `provided` l'excluait du livrable.
  - key: bug-driver-compile
    format: bug-fix
    question: |-
      Des classes internes du pilote PostgreSQL se retrouvent importées dans le code métier. Quelle correction est la bonne ?
      ```xml
      <artifactId>postgresql</artifactId>
      ```
    choices:
      - {text: "Déclarer le pilote en portée `runtime`", correct: true}
      - {text: "Déclarer le pilote en portée `provided`", correct: false}
      - {text: "Déclarer le pilote en portée `test`", correct: false}
      - {text: "Marquer le pilote `<optional>true</optional>`", correct: false}
    answer: |-
      ```xml
      <artifactId>postgresql</artifactId>
      <scope>runtime</scope>
      ```
      En portée `runtime`, le pilote est livré mais absent du classpath de compilation : le code ne peut dépendre que de
      l'API JDBC standard.
  - key: bug-test-dans-main
    format: bug-fix
    question: |-
      La compilation du code principal échoue : « package org.assertj.core.api does not exist ». Quelle correction est la bonne ?
      ```java
      // src/main/java/com/recallio/Verification.java
      import static org.assertj.core.api.Assertions.assertThat;
      ```
    choices:
      - {text: "Vérifier par une exception, et garder AssertJ dans les tests", correct: true}
      - {text: "Passer AssertJ de la portée `test` à la portée `compile`", correct: false}
      - {text: "Remplacer l'import statique par un import de la classe `Assertions`", correct: false}
      - {text: "Déplacer la classe `Verification` dans `src/test/java`", correct: false}
    answer: |-
      ```java
      // src/main/java/com/recallio/Verification.java
      if (montant.signum() < 0) {
          throw new IllegalArgumentException("montant négatif");
      }
      // et les assertions AssertJ restent dans src/test/java
      ```
      AssertJ est en portée `test` : elle n'existe pas pour le code principal. Les vérifications de production utilisent
      des exceptions (ou `Objects.requireNonNull`) ; passer AssertJ en `compile` livrerait une bibliothèque de test.
