notion: modules-principe
lesson: |-
  Le **système de modules** (JPMS, Java 9) regroupe des packages dans un **module** qui déclare explicitement ce dont il
  dépend et ce qu'il expose, dans un fichier **`module-info.java`** à la racine des sources :

  ```java
  module com.recallio.vente {
      requires com.recallio.stock;               // dépend de ce module
      requires transitive com.recallio.commun;    // et l'expose à ceux qui dépendent de nous
      requires java.net.http;
      requires static lombok;                     // seulement à la compilation

      exports com.recallio.vente.api;             // seul ce package est accessible aux autres modules
      exports com.recallio.vente.spi to com.recallio.admin;   // export qualifié, pour un module précis
  }
  ```

  Ce que les modules apportent :
  - une **encapsulation forte** : un type `public` d'un package **non exporté** reste **inaccessible** aux autres modules,
    à la compilation comme à l'exécution (y compris par réflexion) ;
  - une **configuration fiable** : un module requis absent, ou deux modules qui contiennent le même package, empêchent le
    démarrage, au lieu d'échouer plus tard ;
  - un JDK lui-même découpé en modules (`java.base`, `java.sql`, `java.net.http`...), ce qui permet des runtimes réduits
    avec `jlink`.

  - `java.base` est requis **implicitement**.
  - Les modules se placent sur le **module path** (`--module-path`), pas sur le classpath :
    `java --module-path mods -m com.recallio.vente/com.recallio.vente.App`.
  - `requires transitive` : un module qui utilise des types d'un autre dans son API publique doit le rendre visible à ses
    propres utilisateurs.
  - En pratique, beaucoup d'applications restent sur le **classpath** (le *module sans nom*) ; les modules servent surtout
    aux bibliothèques, au JDK et aux runtimes `jlink`. Les frameworks reposent largement sur la réflexion, ce qui
    demande des `opens`.

  **Piège classique** : exposer dans l'API d'un module (une méthode publique d'un package exporté) un type d'un module qu'il
  requiert sans `transitive`. Les modules utilisateurs ne peuvent pas compiler leurs appels.

  **En entretien** : « `module-info.java` déclare `requires` et `exports` : seuls les packages exportés sont accessibles,
  même aux types `public` ; les dépendances sont vérifiées au démarrage. Beaucoup d'applications restent pourtant sur le
  classpath. »
cards:
  - key: sert-module-info-java
    format: course
    question: À quoi sert module-info.java ?
    answer: Déclarer le nom du module, ses dépendances (requires), ses packages exportés et ouverts à la réflexion, les services utilisés et fournis.
  - key: requires-transitive
    format: course
    question: C'est quoi requires transitive ?
    answer: Une dépendance automatiquement visible par les modules qui dépendent du module courant.
  - key: encapsulation
    format: course
    question: Qu'est-ce que l'encapsulation forte des modules ?
    answer: Un type public d'un package non exporté est inaccessible aux autres modules, à la compilation comme à l'exécution, y compris par réflexion.
  - key: configuration-fiable
    format: course
    question: Qu'est-ce que la configuration fiable apportée par les modules ?
    answer: La JVM vérifie au démarrage que chaque module requis est présent et qu'aucun package n'est fourni par deux modules ; un problème empêche le lancement au lieu d'éclater plus tard.
  - key: vf-public
    format: true-false
    question: Avec les modules, un type `public` est toujours accessible depuis n'importe quel module.
    truth: false
    answer: Seulement si son package est exporté.
  - key: vf-java-base
    format: true-false
    question: Il faut écrire `requires java.base;` dans chaque module.
    truth: false
    answer: '`java.base` est requis implicitement.'
  - key: vf-static
    format: true-false
    question: "`requires static` déclare une dépendance nécessaire à la compilation, facultative à l'exécution."
    truth: true
    answer: Utile pour des annotations ou des outils de compilation.
  - key: vf-classpath
    format: true-false
    question: Une application doit obligatoirement être modulaire depuis Java 9.
    truth: false
    answer: Le classpath reste pris en charge ; le code y forme le module sans nom.
  - key: qcm-mots-cles
    format: multiple-choice
    question: Lesquels sont des mots-clés de `module-info.java` ?
    choices:
      - text: "`requires`"
        correct: true
      - text: "`exports`"
        correct: true
      - text: "`imports`"
        correct: false
      - text: "`depends`"
        correct: false
    answer: Il y a aussi `opens`, `uses` et `provides`.
  - key: qcm-api
    format: multiple-choice
    question: "Le module `vente` expose une méthode publique qui renvoie un type du module `commun`. Que faut-il écrire ?"
    choices:
      - text: "`requires transitive com.recallio.commun;`"
        correct: true
      - text: "`requires com.recallio.commun;` suffit toujours"
        correct: false
      - text: "`exports com.recallio.commun;` dans `vente`"
        correct: false
      - text: "`opens com.recallio.commun;`"
        correct: false
    answer: Les utilisateurs de `vente` pourront ainsi lire le type de `commun`.
  - key: qcm-export-qualifie
    format: multiple-choice
    question: "Que signifie `exports com.recallio.interne to com.recallio.admin;` ?"
    choices:
      - text: "Le package n'est accessible qu'au module `com.recallio.admin`"
        correct: true
      - text: "Le package est accessible à tous"
        correct: false
      - text: "Le module `admin` est requis"
        correct: false
      - text: "Le package est ouvert à la réflexion"
        correct: false
    answer: Un export qualifié limite l'accès à des modules nommés.
  - key: qcm-lancer
    format: multiple-choice
    question: Comment lancer une application modulaire ?
    choices:
      - text: "`java --module-path mods -m com.recallio.vente/com.recallio.vente.App`"
        correct: true
      - text: "`java -cp mods com.recallio.vente`"
        correct: false
      - text: "`java -jar module-info.java`"
        correct: false
      - text: "`java --module com.recallio.vente.App`"
        correct: false
    answer: '`-m` donne le module et, après la barre oblique, la classe principale.'
  - key: trous-exports
    format: fill-in
    question: |-
      Complétez pour rendre le package d'API accessible :
      ```java
      module com.recallio.stock {
          ___ com.recallio.stock.api;
      }
      ```
    blanks: [[exports]]
    answer: Les autres packages restent encapsulés.
  - key: trous-requires
    format: fill-in
    question: |-
      Complétez pour utiliser le client HTTP du JDK :
      ```java
      module com.recallio.notifications {
          ___ java.net.http;
      }
      ```
    blanks: [[requires]]
    answer: '`java.net.http` n''est pas dans `java.base`.'
  - key: trous-transitive
    format: fill-in
    question: |-
      Complétez pour exposer le module commun aux utilisateurs :
      ```java
      requires ___ com.recallio.commun;
      ```
    blanks: [[transitive]]
    answer: Les modules qui requièrent celui-ci liront aussi `commun`.
  - key: trous-fichier
    format: fill-in
    question: |-
      Complétez le nom du fichier qui déclare un module :
      ```
      src/main/java/___.java
      ```
    blanks: [[module-info]]
    answer: À la racine des sources du module.
  - key: definition-jpms
    format: definition
    question: JPMS
    answer: Java Platform Module System (Java 9, module-info.java)
  - key: definition-module-path
    format: definition
    question: Module path
    answer: L'équivalent du classpath pour les modules (`--module-path`), où les dépendances sont déclarées et vérifiées.
  - key: definition-export
    format: definition
    question: Export (JPMS)
    answer: La déclaration qui rend les types publics d'un package accessibles aux autres modules.
  - key: definition-module-sans-nom
    format: definition
    question: Module sans nom (unnamed module)
    answer: Le module implicite qui regroupe tout le code chargé depuis le classpath ; il lit tous les modules mais aucun module nommé ne peut le requérir.
