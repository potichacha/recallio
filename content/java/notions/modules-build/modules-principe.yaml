notion: modules-principe
cards:
  - key: sert-module-info-java
    format: course
    question: À quoi sert module-info.java ?
    answer: Déclarer le nom du module, ses dépendances (requires), ses packages exportés et ouverts à la réflexion, les services utilisés et fournis.
  - key: requires-transitive
    format: course
    question: C'est quoi requires transitive ?
    answer: Une dépendance automatiquement visible par les modules qui dépendent du module courant.
  - key: definition-jpms
    format: definition
    question: JPMS
    answer: Java Platform Module System (Java 9, module-info.java)
