notion: modules-principe
lesson: |-
  Le **système de modules** (JPMS, Java 9) regroupe des packages dans un **module** qui déclare explicitement ce dont il
  dépend et ce qu'il expose, dans un fichier **`module-info.java`** à la racine des sources :

  ```java
  module com.recallio.vente {
      requires com.recallio.stock;               // dépend de ce module
      requires transitive com.recallio.commun;    // et l'expose à ceux qui dépendent de nous
      requires java.net.http;
      requires static lombok;                     // seulement à la compilation

      exports com.recallio.vente.api;             // seul ce package est accessible aux autres modules
      exports com.recallio.vente.spi to com.recallio.admin;   // export qualifié, pour un module précis
  }
  ```

  Ce que les modules apportent :
  - une **encapsulation forte** : un type `public` d'un package **non exporté** reste **inaccessible** aux autres modules,
    à la compilation comme à l'exécution (y compris par réflexion) ;
  - une **configuration fiable** : un module requis absent, ou deux modules qui contiennent le même package, empêchent le
    démarrage, au lieu d'échouer plus tard ;
  - un JDK lui-même découpé en modules (`java.base`, `java.sql`, `java.net.http`...), ce qui permet des runtimes réduits
    avec `jlink`.

  - `java.base` est requis **implicitement**.
  - Les modules se placent sur le **module path** (`--module-path`), pas sur le classpath :
    `java --module-path mods -m com.recallio.vente/com.recallio.vente.App`.
  - `requires transitive` : un module qui utilise des types d'un autre dans son API publique doit le rendre visible à ses
    propres utilisateurs.
  - En pratique, beaucoup d'applications restent sur le **classpath** (le *module sans nom*) ; les modules servent surtout
    aux bibliothèques, au JDK et aux runtimes `jlink`. Les frameworks reposent largement sur la réflexion, ce qui
    demande des `opens`.

  **Piège classique** : exposer dans l'API d'un module (une méthode publique d'un package exporté) un type d'un module qu'il
  requiert sans `transitive`. Les modules utilisateurs ne peuvent pas compiler leurs appels.

  **En entretien** : « `module-info.java` déclare `requires` et `exports` : seuls les packages exportés sont accessibles,
  même aux types `public` ; les dépendances sont vérifiées au démarrage. Beaucoup d'applications restent pourtant sur le
  classpath. »
cards:
  - key: sert-module-info-java
    format: course
    question: "À quoi sert le fichier `module-info.java` ?"
    choices:
      - {text: "À déclarer le nom du module, ses dépendances, ses packages exportés et ses services", correct: true}
      - {text: "À lister les dépendances Maven du module, à la place du POM", correct: false}
      - {text: "À décrire le JAR, comme `Main-Class`, à la place du manifeste", correct: false}
      - {text: "À documenter le module pour la Javadoc, sans effet sur la compilation", correct: false}
    answer: "À déclarer le nom du module, ses dépendances (`requires`), ses packages exportés et ouverts à la réflexion, les services utilisés et fournis. Il ne remplace pas le POM : Maven télécharge toujours les dépendances."
  - key: requires-transitive
    format: course
    question: "Que signifie `requires transitive` dans `module-info.java` ?"
    choices:
      - {text: "La dépendance devient lisible par les modules qui dépendent du module courant", correct: true}
      - {text: "La dépendance n'est requise qu'à la compilation, et peut manquer à l'exécution", correct: false}
      - {text: "Toutes les dépendances de cette dépendance sont ajoutées au module path", correct: false}
      - {text: "La dépendance est chargée seulement au premier usage, pas au démarrage", correct: false}
    answer: "La dépendance devient automatiquement lisible par les modules qui dépendent du module courant, utile quand ses types apparaissent dans notre API. Une dépendance de compilation seule, c'est `requires static`."
  - key: encapsulation
    format: course
    question: Qu'est-ce que l'encapsulation forte des modules ?
    choices:
      - {text: "Un type public d'un package non exporté reste inaccessible aux autres modules, même par réflexion", correct: true}
      - {text: "Les champs privés d'une classe deviennent inaccessibles, même à ses propres méthodes", correct: false}
      - {text: "Un module ne peut contenir que des classes `final`, pour qu'on n'en hérite pas", correct: false}
      - {text: "Les classes d'un module sont signées dans le JAR, pour qu'on ne puisse pas les modifier", correct: false}
    answer: Un type public d'un package non exporté est inaccessible aux autres modules, à la compilation comme à l'exécution, y compris par réflexion.
  - key: configuration-fiable
    format: course
    question: Qu'est-ce que la configuration fiable apportée par les modules ?
    choices:
      - {text: "La JVM vérifie au démarrage que les modules requis sont là et qu'aucun package n'est en double", correct: true}
      - {text: "La JVM vérifie la signature numérique de chaque module avant de le charger en mémoire", correct: false}
      - {text: "Les fichiers de configuration de l'application sont validés dès la compilation", correct: false}
      - {text: "Les modules se rechargent automatiquement quand leur configuration change", correct: false}
    answer: La JVM vérifie au démarrage que chaque module requis est présent et qu'aucun package n'est fourni par deux modules ; un problème empêche le lancement au lieu d'éclater plus tard.
  - key: vf-public
    format: true-false
    question: Avec les modules, un type `public` est toujours accessible depuis n'importe quel module.
    truth: false
    answer: Seulement si son package est exporté.
  - key: vf-java-base
    format: true-false
    question: Il faut écrire `requires java.base;` dans chaque module.
    truth: false
    answer: '`java.base` est requis implicitement.'
  - key: vf-static
    format: true-false
    question: "`requires static` déclare une dépendance nécessaire à la compilation, facultative à l'exécution."
    truth: true
    answer: Utile pour des annotations ou des outils de compilation.
  - key: vf-classpath
    format: true-false
    question: Une application doit obligatoirement être modulaire depuis Java 9.
    truth: false
    answer: Le classpath reste pris en charge ; le code y forme le module sans nom.
  - key: qcm-mots-cles
    format: multiple-choice
    question: Lesquels sont des mots-clés de `module-info.java` ?
    choices:
      - text: "`requires`"
        correct: true
      - text: "`exports`"
        correct: true
      - text: "`imports`"
        correct: false
      - text: "`depends`"
        correct: false
    answer: Il y a aussi `opens`, `uses` et `provides`.
  - key: qcm-api
    format: multiple-choice
    question: "Le module `vente` expose une méthode publique qui renvoie un type du module `commun`. Que faut-il écrire ?"
    choices:
      - text: "`requires transitive com.recallio.commun;`"
        correct: true
      - text: "`requires com.recallio.commun;` suffit toujours"
        correct: false
      - text: "`exports com.recallio.commun;` dans `vente`"
        correct: false
      - text: "`opens com.recallio.commun;`"
        correct: false
    answer: Les utilisateurs de `vente` pourront ainsi lire le type de `commun`.
  - key: qcm-export-qualifie
    format: multiple-choice
    question: "Que signifie `exports com.recallio.interne to com.recallio.admin;` ?"
    choices:
      - {text: "Le package n'est accessible qu'au module `com.recallio.admin`", correct: true}
      - {text: "Le package est accessible à tous, et en priorité à `admin`", correct: false}
      - {text: "Le module courant requiert le module `com.recallio.admin`", correct: false}
      - {text: "Le package est ouvert à la réflexion du module `admin`", correct: false}
    answer: Un export qualifié limite l'accès à des modules nommés.
  - key: qcm-lancer
    format: multiple-choice
    question: Comment lancer une application modulaire ?
    choices:
      - {text: "`java --module-path mods -m com.recallio.vente/com.recallio.vente.App`", correct: true}
      - {text: "`java -cp mods com.recallio.vente/com.recallio.vente.App`", correct: false}
      - {text: "`java --module-path mods -jar com.recallio.vente.App`", correct: false}
      - {text: "`java --module com.recallio.vente.App -p mods/vente.jar`", correct: false}
    answer: '`-m` donne le module et, après la barre oblique, la classe principale.'
  - key: trous-exports
    format: fill-in
    question: |-
      Complète pour rendre le package d'API accessible :
      ```java
      module com.recallio.stock {
          ___ com.recallio.stock.api;
      }
      ```
    blanks: [[exports]]
    answer: Les autres packages restent encapsulés.
  - key: trous-requires
    format: fill-in
    question: |-
      Complète pour utiliser le client HTTP du JDK :
      ```java
      module com.recallio.notifications {
          ___ java.net.http;
      }
      ```
    blanks: [[requires]]
    answer: '`java.net.http` n''est pas dans `java.base`.'
  - key: trous-transitive
    format: fill-in
    question: |-
      Complète pour exposer le module commun aux utilisateurs :
      ```java
      requires ___ com.recallio.commun;
      ```
    blanks: [[transitive]]
    answer: Les modules qui requièrent celui-ci liront aussi `commun`.
  - key: trous-fichier
    format: fill-in
    question: |-
      Complète le nom du fichier qui déclare un module :
      ```
      src/main/java/___.java
      ```
    blanks: [[module-info]]
    answer: À la racine des sources du module.
  - key: definition-jpms
    format: definition
    question: "Que désigne JPMS ?"
    choices:
      - {text: "Le système de modules de Java (Java 9), déclaré dans `module-info.java`", correct: true}
      - {text: "Le gestionnaire de paquets de Java, qui télécharge les dépendances", correct: false}
      - {text: "Le modèle mémoire qui règle le partage des données entre threads", correct: false}
      - {text: "Le format des JAR exécutables, décrit par leur manifeste", correct: false}
    answer: "Java Platform Module System, arrivé avec Java 9 : chaque module se déclare dans `module-info.java`. Le modèle mémoire des threads, c'est le JMM."
  - key: definition-module-path
    format: definition
    question: "Que désigne le module path ?"
    choices:
      - {text: "L'équivalent du classpath pour les modules (`--module-path`), aux dépendances vérifiées", correct: true}
      - {text: "Le dossier où le JDK range ses propres modules au format `.jmod`, `jmods`", correct: false}
      - {text: "Le chemin où Maven range un module téléchargé, dans le dépôt local `~/.m2`", correct: false}
      - {text: "La liste des packages qu'un module exporte, déclarée dans `module-info.java`", correct: false}
    answer: L'équivalent du classpath pour les modules (`--module-path`), où les dépendances sont déclarées et vérifiées.
  - key: definition-export
    format: definition
    question: "Que désigne un export, dans JPMS ?"
    choices:
      - {text: "La déclaration qui rend les types publics d'un package accessibles aux autres modules", correct: true}
      - {text: "La déclaration qui ouvre un package à la réflexion profonde des autres modules", correct: false}
      - {text: "La déclaration qui rend une dépendance lisible par les utilisateurs du module", correct: false}
      - {text: "L'opération qui empaquette un module dans un JAR modulaire", correct: false}
    answer: "La déclaration `exports` rend les types publics d'un package accessibles aux autres modules. Ouvrir à la réflexion, c'est `opens` ; rendre une dépendance lisible, `requires transitive`."
  - key: definition-module-sans-nom
    format: definition
    question: "Que désigne le module sans nom (unnamed module) ?"
    choices:
      - {text: "Le module implicite du code chargé depuis le classpath, qu'aucun module nommé ne peut requérir", correct: true}
      - {text: "Un JAR non modulaire placé sur le module path, nommé d'après son fichier", correct: false}
      - {text: "Un module déclaré dans `module-info.java` sans aucune clause `exports`", correct: false}
      - {text: "Le module `java.base`, que tout module lit sans avoir à le déclarer", correct: false}
    answer: Le module implicite qui regroupe tout le code chargé depuis le classpath ; il lit tous les modules mais aucun module nommé ne peut le requérir.
