notion: maven-pom
lesson: |-
  Un projet Maven est décrit par son **POM** (`pom.xml`, *Project Object Model*) :

  ```xml
  <project>
    <modelVersion>4.0.0</modelVersion>

    <groupId>com.recallio</groupId>              <!-- l'organisation (domaine inversé) -->
    <artifactId>recallio-backend</artifactId>     <!-- le nom de l'artefact -->
    <version>1.4.0-SNAPSHOT</version>             <!-- la version -->
    <packaging>jar</packaging>

    <properties>
      <maven.compiler.release>25</maven.compiler.release>
      <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
      <jackson.version>2.18.2</jackson.version>
    </properties>

    <dependencies>
      <dependency>
        <groupId>com.fasterxml.jackson.core</groupId>
        <artifactId>jackson-databind</artifactId>
        <version>${jackson.version}</version>
      </dependency>
    </dependencies>
  </project>
  ```

  - Les **coordonnées** `groupId:artifactId:version` (GAV) identifient chaque artefact de façon unique.
  - Une version **`-SNAPSHOT`** est une version **en développement**, qui peut changer et qui est retéléchargée ; une
    version de **release** (`1.4.0`) est **immuable** : on ne la republie jamais, on en publie une nouvelle.
  - Le **versionnage sémantique** (SemVer) : `MAJEUR.MINEUR.CORRECTIF` ; une version majeure peut casser la
    compatibilité.
  - Les **propriétés** centralisent les versions et les réglages (`maven.compiler.release` fixe la version de Java cible
    et l'API utilisable).
  - Les artefacts viennent de **dépôts** : le dépôt local `~/.m2/repository`, Maven Central, et souvent un **dépôt
    d'entreprise** (Nexus, Artifactory) qui sert de miroir et héberge les artefacts internes.
  - Un POM peut hériter d'un **parent** (`<parent>`), comme `spring-boot-starter-parent` ou le POM parent du projet.
  - **`mvn help:effective-pom`** affiche le POM final, après héritage, profils et valeurs par défaut.

  **Piège classique** : dépendre d'une version `SNAPSHOT` d'une autre équipe dans une release. Le build n'est plus
  reproductible : la même commande produit un résultat différent d'un jour à l'autre.

  **En entretien** : « Le POM donne les coordonnées GAV, les propriétés et les dépendances ; les SNAPSHOT changent, les
  releases sont immuables ; `help:effective-pom` montre le POM réel. »
tour:
  - title: Le POM de Maven
    text: |-
      Maven décrit un projet dans son **POM**, `pom.xml` : ses coordonnées (`groupId`, `artifactId`, `version`), sa
      version de Java, et ses **dépendances**, qu'il télécharge depuis un dépôt comme Maven Central, avec leurs propres
      dépendances :

      ```xml
      <dependency>
          <groupId>org.junit.jupiter</groupId>
          <artifactId>junit-jupiter</artifactId>
          <version>6.0.0</version>
          <scope>test</scope>
      </dependency>
      ```

      `mvn package` compile, teste et produit le JAR ; le *scope* `test` réserve une dépendance aux tests. Ce programme
      décompose des coordonnées Maven, écrites sous leur forme courte.
    example:
      files:
        Main.java: |-
          record Coordonnees(String groupId, String artifactId, String version) {
              static Coordonnees lit(String texte) {
                  String[] parties = texte.split(":");
                  if (parties.length != 3) {
                      throw new IllegalArgumentException("groupId:artifactId:version attendu : " + texte);
                  }
                  return new Coordonnees(parties[0], parties[1], parties[2]);
              }
          }

          void main() {
              Coordonnees junit = Coordonnees.lit("org.junit.jupiter:junit-jupiter:6.0.0");
              IO.println(junit.artifactId() + " " + junit.version());
              IO.println(junit.groupId().replace('.', '/') + "/" + junit.artifactId() + "/" + junit.version());
          }
      output: |-
        junit-jupiter 6.0.0
        org/junit/jupiter/junit-jupiter/6.0.0
cards:
  - key: signifie-snapshot
    format: course
    question: "Que signifie le suffixe `SNAPSHOT` d'une version Maven ?"
    choices:
      - {text: "Une version en développement, qui peut changer et se retélécharger", correct: true}
      - {text: "Une copie figée d'une release, conservée comme sauvegarde", correct: false}
      - {text: "Une version publiée et immuable, prête pour la production", correct: false}
      - {text: "Une version expérimentale, construite seulement sur le poste de son auteur", correct: false}
    answer: "Une version en développement : le même numéro peut désigner un contenu différent d'un jour à l'autre, et Maven la retélécharge régulièrement. À proscrire en production, où l'on veut une release immuable."
  - key: sert-help-effective-pom
    format: course
    question: "À quoi sert `mvn help:effective-pom` ?"
    choices:
      - {text: "À afficher le POM final, après héritage, BOM et profils", correct: true}
      - {text: "À vérifier que le POM respecte les bonnes pratiques de Maven", correct: false}
      - {text: "À reformater le `pom.xml` du projet et trier ses dépendances", correct: false}
      - {text: "À afficher l'aide de chaque plugin déclaré dans le POM", correct: false}
    answer: "À afficher le POM final, après héritage, import des BOM, profils et valeurs par défaut : c'est lui que Maven exécute vraiment. Il ne vérifie ni ne modifie rien."
  - key: role-nexus-artifactory
    format: course
    question: "Quel rôle joue un dépôt comme Nexus ou Artifactory ?"
    choices:
      - {text: "Proxy et cache des dépôts publics, et hébergement des artefacts internes", correct: true}
      - {text: "Serveur d'intégration continue, qui construit et teste les projets", correct: false}
      - {text: "Outil d'analyse, qui signale les failles dans le code source", correct: false}
      - {text: "Gestionnaire de versions, comme Git, réservé aux fichiers binaires", correct: false}
    answer: "Un proxy et un cache des dépôts publics (Maven Central), et l'hébergement des artefacts internes. Il ne construit rien : c'est le rôle de la CI."
  - key: republier-version-release
    format: course
    question: "Peut-on republier une version de release déjà publiée ?"
    choices:
      - {text: "Non : une release est immuable, on publie une nouvelle version", correct: true}
      - {text: "Oui : la nouvelle publication remplace l'ancienne partout", correct: false}
      - {text: "Oui, si l'on garde le même `groupId` et le même `artifactId`", correct: false}
      - {text: "Oui, mais seulement dans les 24 heures qui suivent la publication", correct: false}
    answer: "Non : une release est immuable, et ceux qui l'ont déjà téléchargée la gardent en cache. On publie une nouvelle version, par exemple un correctif."
  - key: gav
    format: course
    question: "Que sont les coordonnées GAV d'un artefact Maven ?"
    choices:
      - {text: "Le triplet `groupId:artifactId:version`, qui identifie un artefact", correct: true}
      - {text: "Le triplet `groupId:artifactId:packaging`, qui situe un fichier", correct: false}
      - {text: "Le chemin du JAR dans le dépôt local `~/.m2` de la machine", correct: false}
      - {text: "L'adresse du dépôt distant d'où vient l'artefact téléchargé", correct: false}
    answer: Le triplet `groupId:artifactId:version` qui identifie de façon unique un artefact Maven.
  - key: vf-snapshot-prod
    format: true-false
    question: Une release peut dépendre d'une version SNAPSHOT sans risque.
    truth: false
    answer: Le build n'est plus reproductible ; le plugin release l'interdit d'ailleurs.
  - key: vf-local
    format: true-false
    question: Maven garde les artefacts téléchargés dans `~/.m2/repository`.
    truth: true
    answer: C'est le dépôt local, à mettre en cache dans la CI.
  - key: vf-release
    format: true-false
    question: "`maven.compiler.release` fixe la version de Java cible et l'API utilisable."
    truth: true
    answer: Comme l'option `--release` de `javac`.
  - key: vf-semver
    format: true-false
    question: En versionnage sémantique, passer de 2.3.1 à 2.4.0 peut casser la compatibilité.
    truth: false
    answer: Une version mineure ajoute des fonctions compatibles ; seule une version majeure peut casser.
  - key: qcm-coordonnees
    format: multiple-choice
    question: "Dans les coordonnées `com.recallio:recallio-backend:1.5.0`, que désigne `recallio-backend` ?"
    choices:
      - {text: "L'`artifactId`", correct: true}
      - {text: "Le `groupId`", correct: false}
      - {text: "Le `packaging`", correct: false}
      - {text: "Le `classifier`", correct: false}
    answer: "Les coordonnées se lisent `groupId:artifactId:version` : `com.recallio` est le `groupId`, `1.5.0` la version. Le `packaging` et le `classifier` complètent parfois l'identification."
  - key: qcm-proprietes
    format: multiple-choice
    question: "Lesquels de ces usages conviennent aux `<properties>` d'un POM ?"
    choices:
      - text: "Centraliser des versions réutilisées par `${...}`"
        correct: true
      - text: "Régler des plugins (encodage, version de Java)"
        correct: true
      - text: "Déclarer les dépendances"
        correct: false
      - text: "Stocker des mots de passe"
        correct: false
    answer: "Une propriété centralise une version réutilisée par `${...}` ou règle un plugin (encodage, `maven.compiler.release`). Les dépendances se déclarent dans `<dependencies>`, et les secrets vont dans l'environnement ou `settings.xml`, jamais dans le POM."
  - key: qcm-depot
    format: multiple-choice
    question: "Lesquels de ces services fournit un dépôt d'entreprise comme Nexus ou Artifactory ?"
    choices:
      - text: "Un miroir et un cache de Maven Central"
        correct: true
      - text: "L'hébergement des artefacts internes"
        correct: true
      - text: "La compilation du code"
        correct: false
      - text: "L'exécution des tests"
        correct: false
    answer: "Un miroir et un cache de Maven Central, et l'hébergement des artefacts internes : les builds sont plus rapides et plus fiables. Compiler et tester restent le travail de Maven et de la CI."
  - key: qcm-semver
    format: multiple-choice
    question: Une bibliothèque passe de 3.2.5 à 4.0.0. Qu'en déduire ?
    choices:
      - text: "Elle peut contenir des changements incompatibles"
        correct: true
      - text: "Elle ne contient que des corrections"
        correct: false
      - text: "Elle est forcément compatible"
        correct: false
      - text: "C'est une version de développement"
        correct: false
    answer: Une montée majeure se teste avec soin.
  - key: trous-gav
    format: fill-in
    question: |-
      Complète les coordonnées :
      ```xml
      <___>com.recallio</___>
      <artifactId>recallio-backend</artifactId>
      ```
    blanks: [[groupId], [groupId]]
    answer: L'organisation, en domaine inversé.
  - key: trous-snapshot
    format: fill-in
    question: |-
      Complète la version en développement :
      ```xml
      <version>1.5.0-___</version>
      ```
    blanks: [[SNAPSHOT]]
    answer: Elle peut changer jusqu'à la release.
  - key: trous-propriete
    format: fill-in
    question: |-
      Complète pour réutiliser la propriété `jackson.version` :
      ```xml
      <version>___</version>
      ```
    blanks: [["${jackson.version}"]]
    answer: Une version définie une fois, utilisée partout.
  - key: trous-effectif
    format: fill-in
    question: |-
      Complète la commande qui affiche le POM final :
      ```
      mvn help:___
      ```
    blanks: [[effective-pom]]
    answer: Après héritage, profils et valeurs par défaut.
  - key: definition-semver
    format: definition
    question: "Que désigne SemVer ?"
    choices:
      - {text: "Le versionnage sémantique, `MAJEUR.MINEUR.CORRECTIF`", correct: true}
      - {text: "Le suffixe des versions en développement, `-SNAPSHOT`", correct: false}
      - {text: "Le versionnage par date de publication, comme `2026.11`", correct: false}
      - {text: "La numérotation par build, augmentée à chaque commit", correct: false}
    answer: "Le versionnage sémantique, `MAJEUR.MINEUR.CORRECTIF` : la majeure change sur une rupture de compatibilité, la mineure pour un ajout compatible, le correctif pour une correction."
  - key: definition-pom
    format: definition
    question: "Que désigne le POM, dans Maven ?"
    choices:
      - {text: "Le `pom.xml`, qui décrit le projet : coordonnées, dépendances, plugins", correct: true}
      - {text: "Le dépôt local où Maven range les dépendances téléchargées", correct: false}
      - {text: "Le fichier de la machine qui configure miroirs et identifiants", correct: false}
      - {text: "Le plugin de Maven qui empaquette le projet en JAR", correct: false}
    answer: "Project Object Model : le fichier `pom.xml` qui décrit un projet Maven (coordonnées, dépendances, plugins). Miroirs et identifiants vont dans `settings.xml`, propre à la machine."
  - key: definition-gav
    format: definition
    question: "Que désigne GAV, dans Maven ?"
    choices:
      - {text: "`groupId`, `artifactId`, `version` : les coordonnées d'un artefact", correct: true}
      - {text: "`group`, `api`, `version` : les trois blocs d'un script Gradle", correct: false}
      - {text: "Le format d'archive des artefacts publiés dans un dépôt", correct: false}
      - {text: "Le dépôt central de Maven, d'où viennent les dépendances", correct: false}
    answer: "`groupId`, `artifactId`, `version` : les coordonnées qui identifient un artefact, de façon unique, dans un dépôt."
  - key: definition-snapshot
    format: definition
    question: "Que désigne une version SNAPSHOT ?"
    choices:
      - {text: "Une version en développement, qui peut changer, par opposition à une release immuable", correct: true}
      - {text: "Une release figée, publiée une fois pour toutes dans le dépôt de l'entreprise", correct: false}
      - {text: "Une sauvegarde du dépôt local, faite avant une montée de version", correct: false}
      - {text: "Une version corrective, qui ne change que le dernier chiffre du numéro", correct: false}
    answer: Le suffixe d'une version en développement, susceptible de changer, par opposition à une release immuable.
