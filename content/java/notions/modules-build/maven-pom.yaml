notion: maven-pom
lesson: |-
  Un projet Maven est décrit par son **POM** (`pom.xml`, *Project Object Model*) :

  ```xml
  <project>
    <modelVersion>4.0.0</modelVersion>

    <groupId>com.recallio</groupId>              <!-- l'organisation (domaine inversé) -->
    <artifactId>recallio-backend</artifactId>     <!-- le nom de l'artefact -->
    <version>1.4.0-SNAPSHOT</version>             <!-- la version -->
    <packaging>jar</packaging>

    <properties>
      <maven.compiler.release>25</maven.compiler.release>
      <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
      <jackson.version>2.18.2</jackson.version>
    </properties>

    <dependencies>
      <dependency>
        <groupId>com.fasterxml.jackson.core</groupId>
        <artifactId>jackson-databind</artifactId>
        <version>${jackson.version}</version>
      </dependency>
    </dependencies>
  </project>
  ```

  - Les **coordonnées** `groupId:artifactId:version` (GAV) identifient chaque artefact de façon unique.
  - Une version **`-SNAPSHOT`** est une version **en développement**, qui peut changer et qui est retéléchargée ; une
    version de **release** (`1.4.0`) est **immuable** : on ne la republie jamais, on en publie une nouvelle.
  - Le **versionnage sémantique** (SemVer) : `MAJEUR.MINEUR.CORRECTIF` ; une version majeure peut casser la
    compatibilité.
  - Les **propriétés** centralisent les versions et les réglages (`maven.compiler.release` fixe la version de Java cible
    et l'API utilisable).
  - Les artefacts viennent de **dépôts** : le dépôt local `~/.m2/repository`, Maven Central, et souvent un **dépôt
    d'entreprise** (Nexus, Artifactory) qui sert de miroir et héberge les artefacts internes.
  - Un POM peut hériter d'un **parent** (`<parent>`), comme `spring-boot-starter-parent` ou le POM parent du projet.
  - **`mvn help:effective-pom`** affiche le POM final, après héritage, profils et valeurs par défaut.

  **Piège classique** : dépendre d'une version `SNAPSHOT` d'une autre équipe dans une release. Le build n'est plus
  reproductible : la même commande produit un résultat différent d'un jour à l'autre.

  **En entretien** : « Le POM donne les coordonnées GAV, les propriétés et les dépendances ; les SNAPSHOT changent, les
  releases sont immuables ; `help:effective-pom` montre le POM réel. »
tour:
  - title: Le POM de Maven
    text: |-
      Maven décrit un projet dans son **POM**, `pom.xml` : ses coordonnées (`groupId`, `artifactId`, `version`), sa
      version de Java, et ses **dépendances**, qu'il télécharge depuis un dépôt comme Maven Central, avec leurs propres
      dépendances :

      ```xml
      <dependency>
          <groupId>org.junit.jupiter</groupId>
          <artifactId>junit-jupiter</artifactId>
          <version>6.0.0</version>
          <scope>test</scope>
      </dependency>
      ```

      `mvn package` compile, teste et produit le JAR ; le *scope* `test` réserve une dépendance aux tests. Ce programme
      décompose des coordonnées Maven, écrites sous leur forme courte.
    example:
      files:
        Main.java: |-
          record Coordonnees(String groupId, String artifactId, String version) {
              static Coordonnees lit(String texte) {
                  String[] parties = texte.split(":");
                  if (parties.length != 3) {
                      throw new IllegalArgumentException("groupId:artifactId:version attendu : " + texte);
                  }
                  return new Coordonnees(parties[0], parties[1], parties[2]);
              }
          }

          void main() {
              Coordonnees junit = Coordonnees.lit("org.junit.jupiter:junit-jupiter:6.0.0");
              IO.println(junit.artifactId() + " " + junit.version());
              IO.println(junit.groupId().replace('.', '/') + "/" + junit.artifactId() + "/" + junit.version());
          }
      output: |-
        junit-jupiter 6.0.0
        org/junit/jupiter/junit-jupiter/6.0.0
cards:
  - key: signifie-snapshot
    format: course
    question: Que signifie SNAPSHOT ?
    answer: Une version en développement, re-téléchargée régulièrement, à proscrire en production.
  - key: sert-help-effective-pom
    format: course
    question: À quoi sert help:effective-pom ?
    answer: Afficher le pom final après héritage, BOM et profils.
  - key: role-nexus-artifactory
    format: course
    question: Rôle de Nexus ou Artifactory ?
    answer: Proxy et cache des dépôts publics, hébergement des artefacts internes.
  - key: republier-version-release
    format: course
    question: Peut-on republier une version de release ?
    answer: Non, une release est immuable ; on publie une nouvelle version.
  - key: gav
    format: course
    question: Que sont les coordonnées GAV ?
    answer: Le triplet `groupId:artifactId:version` qui identifie de façon unique un artefact Maven.
  - key: vf-snapshot-prod
    format: true-false
    question: Une release peut dépendre d'une version SNAPSHOT sans risque.
    truth: false
    answer: Le build n'est plus reproductible ; le plugin release l'interdit d'ailleurs.
  - key: vf-local
    format: true-false
    question: Maven garde les artefacts téléchargés dans `~/.m2/repository`.
    truth: true
    answer: C'est le dépôt local, à mettre en cache dans la CI.
  - key: vf-release
    format: true-false
    question: "`maven.compiler.release` fixe la version de Java cible et l'API utilisable."
    truth: true
    answer: Comme l'option `--release` de `javac`.
  - key: vf-semver
    format: true-false
    question: En versionnage sémantique, passer de 2.3.1 à 2.4.0 peut casser la compatibilité.
    truth: false
    answer: Une version mineure ajoute des fonctions compatibles ; seule une version majeure peut casser.
  - key: qcm-coordonnees
    format: multiple-choice
    question: Quels éléments forment les coordonnées d'un artefact ?
    choices:
      - text: "`groupId`"
        correct: true
      - text: "`artifactId` et `version`"
        correct: true
      - text: "`packageName`"
        correct: false
      - text: "`mainClass`"
        correct: false
    answer: Le `packaging` et le `classifier` complètent parfois l'identification.
  - key: qcm-proprietes
    format: multiple-choice
    question: À quoi servent les `<properties>` d'un POM ?
    choices:
      - text: "Centraliser des versions réutilisées par `${...}`"
        correct: true
      - text: "Régler des plugins (encodage, version de Java)"
        correct: true
      - text: "Déclarer les dépendances"
        correct: false
      - text: "Stocker des mots de passe"
        correct: false
    answer: Les secrets vont dans l'environnement ou `settings.xml`, jamais dans le POM.
  - key: qcm-depot
    format: multiple-choice
    question: Que fournit un dépôt d'entreprise comme Nexus ou Artifactory ?
    choices:
      - text: "Un miroir et un cache de Maven Central"
        correct: true
      - text: "L'hébergement des artefacts internes"
        correct: true
      - text: "La compilation du code"
        correct: false
      - text: "L'exécution des tests"
        correct: false
    answer: Il rend les builds plus rapides et plus fiables.
  - key: qcm-semver
    format: multiple-choice
    question: Une bibliothèque passe de 3.2.5 à 4.0.0. Qu'en déduire ?
    choices:
      - text: "Elle peut contenir des changements incompatibles"
        correct: true
      - text: "Elle ne contient que des corrections"
        correct: false
      - text: "Elle est forcément compatible"
        correct: false
      - text: "C'est une version de développement"
        correct: false
    answer: Une montée majeure se teste avec soin.
  - key: trous-gav
    format: fill-in
    question: |-
      Complétez les coordonnées :
      ```xml
      <___>com.recallio</___>
      <artifactId>recallio-backend</artifactId>
      ```
    blanks: [[groupId], [groupId]]
    answer: L'organisation, en domaine inversé.
  - key: trous-snapshot
    format: fill-in
    question: |-
      Complétez la version en développement :
      ```xml
      <version>1.5.0-___</version>
      ```
    blanks: [[SNAPSHOT]]
    answer: Elle peut changer jusqu'à la release.
  - key: trous-propriete
    format: fill-in
    question: |-
      Complétez pour réutiliser la propriété `jackson.version` :
      ```xml
      <version>___</version>
      ```
    blanks: [["${jackson.version}"]]
    answer: Une version définie une fois, utilisée partout.
  - key: trous-effectif
    format: fill-in
    question: |-
      Complétez la commande qui affiche le POM final :
      ```
      mvn help:___
      ```
    blanks: [[effective-pom]]
    answer: Après héritage, profils et valeurs par défaut.
  - key: definition-semver
    format: definition
    question: SemVer
    answer: Versioning sémantique MAJEUR.MINEUR.CORRECTIF
  - key: definition-pom
    format: definition
    question: POM
    answer: 'Project Object Model : le fichier `pom.xml` qui décrit un projet Maven (coordonnées, dépendances, plugins).'
  - key: definition-gav
    format: definition
    question: GAV
    answer: groupId, artifactId, version, les coordonnées qui identifient un artefact.
  - key: definition-snapshot
    format: definition
    question: SNAPSHOT
    answer: Le suffixe d'une version en développement, susceptible de changer, par opposition à une release immuable.
