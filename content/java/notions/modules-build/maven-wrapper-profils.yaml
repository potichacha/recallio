notion: maven-wrapper-profils
cards:
  - key: sert-maven-wrapper
    format: course
    question: À quoi sert le Maven Wrapper ?
    answer: Garantir une version identique de Maven partout sans installation préalable.
  - key: contient-settings-xml
    format: course
    question: Que contient settings.xml ?
    answer: 'La configuration propre à la machine : miroirs, identifiants, profils.'
  - key: build-passe-poste-mais-echoue-ci
    format: scenario
    question: Un build passe sur ton poste mais échoue en CI.
    answer: |-
      Je chercherais une différence d'environnement : version de Maven ou du JDK (d'où le wrapper et une toolchain explicite), un artefact présent dans mon `~/.m2` local mais absent du dépôt de l'entreprise (une dépendance installée à la main), un SNAPSHOT différent, un profil activé localement, une variable d'environnement, ou des tests qui dépendent de l'ordre, du fuseau horaire ou de la locale.
      Je reproduirais dans un conteneur propre avec la même image que la CI et `-U` pour forcer les mises à jour : si ça échoue aussi, c'est mon poste qui masquait le problème.
