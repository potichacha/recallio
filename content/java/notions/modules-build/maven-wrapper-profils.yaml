notion: maven-wrapper-profils
lesson: |-
  **Le wrapper Maven** (`mvnw`) garantit que tout le monde (développeurs, CI) utilise **la même version de Maven**, sans
  installation préalable :

  ```
  mvn wrapper:wrapper -Dmaven=3.9.9      # génère mvnw, mvnw.cmd et .mvn/wrapper/maven-wrapper.properties
  ./mvnw verify                          # télécharge la version fixée au premier lancement, puis l'utilise
  ```
  On versionne `mvnw`, `mvnw.cmd` et le dossier `.mvn/` dans le dépôt. Le dossier `.mvn/` peut aussi contenir
  `jvm.config` (options de la JVM de Maven) et `maven.config` (options de ligne de commande par défaut).

  **Les profils** modifient le build selon le contexte :

  ```xml
  <profiles>
    <profile>
      <id>native</id>
      <properties><quarkus.native.enabled>true</quarkus.native.enabled></properties>
    </profile>
    <profile>
      <id>ci</id>
      <activation><property><name>env.CI</name></property></activation>   <!-- activé si la variable CI existe -->
      <build> ... </build>
    </profile>
  </profiles>
  ```
  ```
  ./mvnw -Pnative package                # activer un profil
  ./mvnw help:active-profiles            # voir les profils actifs
  ```

  - Activation : explicite (`-P`), par propriété, par variable d'environnement, par JDK, par système d'exploitation, ou par
    présence d'un fichier.
  - Les profils servent aux **variantes de build** (image native, couverture de code, publication), **pas** à la
    configuration d'exécution par environnement (dev, prod) : celle-ci va dans la configuration de l'application (profils
    Quarkus ou Spring, variables d'environnement), pour qu'un **même artefact** soit déployé partout.

  **`settings.xml`** (`~/.m2/settings.xml`) contient ce qui est propre à la **machine** : miroirs (le dépôt d'entreprise),
  identifiants des dépôts, proxys. Il n'est **pas** versionné avec le projet, et les mots de passe y sont chiffrés ou
  remplacés par des variables d'environnement.

  **Piège classique** : un profil Maven `prod` qui change l'URL de la base dans l'artefact. On ne déploie plus en
  production l'artefact testé en recette ; la configuration d'exécution doit venir de l'environnement.

  **En entretien** : « Le wrapper fige la version de Maven pour tous ; les profils servent aux variantes de build, pas
  aux environnements d'exécution ; `settings.xml` garde les miroirs et identifiants propres à la machine. »
cards:
  - key: sert-maven-wrapper
    format: course
    question: À quoi sert le Maven Wrapper ?
    answer: Garantir une version identique de Maven partout sans installation préalable.
  - key: contient-settings-xml
    format: course
    question: Que contient settings.xml ?
    answer: 'La configuration propre à la machine : miroirs, identifiants, profils.'
  - key: profils-role
    format: course
    question: À quoi doivent servir les profils Maven ?
    answer: Aux variantes de build (image native, couverture, publication) ; pas à la configuration d'exécution par environnement, qui doit venir de l'environnement pour déployer le même artefact partout.
  - key: activation
    format: course
    question: Comment un profil Maven peut-il être activé ?
    answer: Explicitement avec `-P`, ou automatiquement selon une propriété, une variable d'environnement, la version du JDK, le système d'exploitation ou la présence d'un fichier.
  - key: vf-versionner
    format: true-false
    question: Les fichiers `mvnw`, `mvnw.cmd` et `.mvn/` se versionnent avec le projet.
    truth: true
    answer: C'est ce qui fige la version de Maven pour tous.
  - key: vf-settings-depot
    format: true-false
    question: Le fichier `~/.m2/settings.xml` se versionne dans le dépôt du projet.
    truth: false
    answer: Il est propre à la machine et peut contenir des identifiants.
  - key: vf-active
    format: true-false
    question: "`mvn help:active-profiles` affiche les profils actifs."
    truth: true
    answer: Utile quand un profil s'active automatiquement sans qu'on le sache.
  - key: vf-jvm-config
    format: true-false
    question: "`.mvn/jvm.config` permet de passer des options à la JVM qui exécute Maven."
    truth: true
    answer: Par exemple de la mémoire ou des `--add-exports` pour un outil d'analyse.
  - key: qcm-wrapper
    format: multiple-choice
    question: Quels avantages apporte le wrapper Maven ?
    choices:
      - text: "La même version de Maven en local et en CI"
        correct: true
      - text: "Aucun Maven à installer au préalable"
        correct: true
      - text: "Des builds deux fois plus rapides"
        correct: false
      - text: "La gestion des versions des dépendances"
        correct: false
    answer: Les versions des dépendances restent dans le POM.
  - key: qcm-profil-usage
    format: multiple-choice
    question: Pour lesquels un profil Maven est-il adapté ?
    choices:
      - text: "Construire une image native"
        correct: true
      - text: "Activer la mesure de couverture en CI"
        correct: true
      - text: "Changer l'URL de la base de production dans l'artefact"
        correct: false
      - text: "Stocker un mot de passe"
        correct: false
    answer: La configuration d'exécution vient de l'environnement.
  - key: qcm-settings
    format: multiple-choice
    question: Que trouve-t-on dans `settings.xml` ?
    choices:
      - text: "Le miroir vers le dépôt d'entreprise"
        correct: true
      - text: "Les identifiants des dépôts"
        correct: true
      - text: "Les dépendances du projet"
        correct: false
      - text: "Le code source"
        correct: false
    answer: Les mots de passe y sont chiffrés ou lus dans l'environnement.
  - key: qcm-activer
    format: multiple-choice
    question: Comment activer le profil `native` ?
    choices:
      - text: "`./mvnw -Pnative package`"
        correct: true
      - text: "`./mvnw --profile=native`"
        correct: false
      - text: "`./mvnw native`"
        correct: false
      - text: "`./mvnw -Dprofile native`"
        correct: false
    answer: Plusieurs profils se séparent par des virgules (`-Pnative,ci`).
  - key: build-passe-poste-mais-echoue-ci
    format: scenario
    question: Un build passe sur ton poste mais échoue en CI.
    answer: |-
      Je chercherais une différence d'environnement : version de Maven ou du JDK (d'où le wrapper et une toolchain explicite), un artefact présent dans mon `~/.m2` local mais absent du dépôt de l'entreprise (une dépendance installée à la main), un SNAPSHOT différent, un profil activé localement, une variable d'environnement, ou des tests qui dépendent de l'ordre, du fuseau horaire ou de la locale.
      Je reproduirais dans un conteneur propre avec la même image que la CI et `-U` pour forcer les mises à jour : si ça échoue aussi, c'est mon poste qui masquait le problème.
  - key: scenario-profil-prod
    format: scenario
    question: Un projet utilise des profils Maven `dev`, `recette` et `prod` qui changent les URL et les identifiants dans l'artefact. Que proposes-tu ?
    answer: |-
      De construire un seul artefact, identique pour tous les environnements, et de sortir la configuration d'exécution
      dans l'environnement : variables d'environnement, profils de configuration du framework (`%prod.` dans Quarkus,
      `application-prod.yml` dans Spring), secrets fournis par l'orchestrateur. On déploie alors en production exactement
      ce qui a été testé en recette, et les secrets ne sont plus dans l'artefact. Les profils Maven restent pour les
      variantes de build (image native, couverture).
  - key: scenario-identifiants
    format: scenario
    question: La CI doit publier des artefacts vers le dépôt d'entreprise. Comment fournis-tu les identifiants à Maven ?
    answer: |-
      Par un `settings.xml` propre à la CI (généré par l'étape `setup-java` de GitHub Actions, par exemple) dont la section
      `<servers>` lit les identifiants dans des variables d'environnement (`${env.DEPOT_UTILISATEUR}`), elles-mêmes
      alimentées par les secrets de la CI. Rien dans le dépôt, rien dans le POM, et un compte de service aux droits limités
      à la publication. En local, chaque développeur garde ses propres identifiants dans son `~/.m2/settings.xml`, chiffrés
      si possible.
  - key: scenario-version-maven
    format: scenario
    question: "Une nouvelle personne ne parvient pas à construire le projet : son Maven est trop ancien pour un plugin. Comment éviter ce problème pour toute l'équipe ?"
    answer: |-
      Avec le wrapper Maven versionné dans le dépôt : chacun lance `./mvnw`, qui télécharge la version fixée dans
      `.mvn/wrapper/maven-wrapper.properties`. J'ajoute la règle `requireMavenVersion` (et `requireJavaVersion`) du plugin
      enforcer pour un message clair si quelqu'un utilise un `mvn` installé. Le README indique de passer par `./mvnw`, et la
      CI fait de même, pour que local et CI soient identiques.
