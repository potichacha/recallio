notion: maven-multimodules
lesson: |-
  Un projet **multi-modules** regroupe plusieurs modules Maven sous un **POM d'agrégation** (souvent aussi le **parent**) :

  ```xml
  <!-- pom.xml racine -->
  <groupId>com.recallio</groupId>
  <artifactId>recallio-parent</artifactId>
  <version>1.4.0-SNAPSHOT</version>
  <packaging>pom</packaging>

  <modules>
    <module>domaine</module>
    <module>infrastructure</module>
    <module>application</module>
  </modules>

  <dependencyManagement> ... </dependencyManagement>     <!-- versions communes -->
  <build><pluginManagement> ... </pluginManagement></build>
  ```
  ```xml
  <!-- application/pom.xml -->
  <parent>
    <groupId>com.recallio</groupId>
    <artifactId>recallio-parent</artifactId>
    <version>1.4.0-SNAPSHOT</version>
  </parent>
  <artifactId>application</artifactId>
  <dependencies>
    <dependency>
      <groupId>com.recallio</groupId>
      <artifactId>domaine</artifactId>
      <version>${project.version}</version>
    </dependency>
  </dependencies>
  ```

  - L'**agrégation** (`<modules>`) permet de tout construire en une commande ; l'**héritage** (`<parent>`) partage la
    configuration. Les deux sont souvent dans le même POM, mais ce sont deux notions distinctes.
  - Le **réacteur** (*reactor*) calcule l'**ordre de construction** à partir des dépendances entre modules ; un **cycle**
    entre modules est interdit.
  - Construire une partie :
    - `mvn -pl application -am verify` : le module et les modules dont il dépend (*also make*) ;
    - `mvn -pl domaine -amd verify` : le module et ceux qui dépendent de lui (*also make dependents*) ;
    - `mvn -T 1C verify` : en parallèle quand l'ordre le permet.
  - Des modules Maven rendent les **frontières** vérifiables par le compilateur : un module `domaine` sans dépendance vers
    JPA ne **peut pas** importer JPA. Un monolithe modulaire peut aussi n'être qu'un module Maven, avec des règles
    ArchUnit sur les packages ; le choix se discute (et se consigne dans un ADR).
  - Tous les modules partagent en général la **même version** (`${project.version}`), et sont publiés ensemble.

  **Piège classique** : construire un module seul (`cd application && mvn verify`) après avoir modifié `domaine`. Maven
  utilise l'ancien `domaine` installé dans `~/.m2` ; on construit depuis la racine avec `-pl ... -am`.

  **En entretien** : « Un POM d'agrégation et parent, un réacteur qui ordonne les modules, `-pl` et `-am` pour construire une
  partie ; des modules Maven rendent les dépendances entre couches vérifiables à la compilation. »
cards:
  - key: construire-seul-module-dependances
    format: course
    question: Comment construire un seul module et ses dépendances ?
    answer: '`mvn -pl module -am install`.'
  - key: agregation-heritage
    format: course
    question: Quelle différence entre agrégation et héritage dans Maven ?
    answer: L'agrégation (`<modules>`) construit plusieurs modules en une commande ; l'héritage (`<parent>`) partage la configuration et les versions. Un même POM fait souvent les deux.
  - key: reacteur
    format: course
    question: Qu'est-ce que le réacteur Maven ?
    answer: Le mécanisme qui calcule l'ordre de construction des modules d'après leurs dépendances (et refuse les cycles).
  - key: frontieres
    format: course
    question: Quel intérêt architectural ont les modules Maven ?
    answer: Les dépendances entre parties deviennent vérifiées par le compilateur ; un module qui ne déclare pas une dépendance ne peut pas en importer les classes.
  - key: vf-packaging
    format: true-false
    question: Le POM parent d'un projet multi-modules a un packaging `pom`.
    truth: true
    answer: Il ne produit pas de JAR lui-même.
  - key: vf-cycle
    format: true-false
    question: Deux modules Maven peuvent dépendre l'un de l'autre.
    truth: false
    answer: Le réacteur refuse les cycles.
  - key: vf-amd
    format: true-false
    question: "`-amd` construit aussi les modules qui dépendent du module choisi."
    truth: true
    answer: Utile pour vérifier l'impact d'un changement.
  - key: vf-ordre-xml
    format: true-false
    question: Les modules sont construits dans l'ordre où ils apparaissent dans `<modules>`.
    truth: false
    answer: L'ordre vient des dépendances entre modules.
  - key: qcm-commandes
    format: multiple-choice
    question: Associez correctement l'option et son effet.
    choices:
      - text: "`-pl module` : construire seulement ce module"
        correct: true
      - text: "`-am` : ajouter les modules dont il dépend"
        correct: true
      - text: "`-amd` : ignorer les dépendances"
        correct: false
      - text: "`-T 1C` : un seul thread"
        correct: false
    answer: '`-T 1C` signifie un thread par cœur.'
  - key: qcm-version
    format: multiple-choice
    question: Comment référencer un module frère dans les dépendances ?
    choices:
      - text: "Avec `<version>${project.version}</version>`"
        correct: true
      - text: "Avec la version déclarée dans `dependencyManagement` du parent"
        correct: true
      - text: "Avec `<version>LATEST</version>`"
        correct: false
      - text: "Sans dépendance, l'agrégation suffit"
        correct: false
    answer: Les modules partagent en général la même version.
  - key: qcm-ancien
    format: multiple-choice
    question: "Après une modification de `domaine`, `cd application && mvn verify` utilise l'ancien code de `domaine`. Pourquoi ?"
    choices:
      - text: "Maven prend la version de `domaine` installée dans `~/.m2`"
        correct: true
      - text: "Le cache du compilateur est plein"
        correct: false
      - text: "`domaine` est en portée `test`"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: Depuis la racine, `mvn -pl application -am verify` reconstruit `domaine`.
  - key: qcm-management
    format: multiple-choice
    question: Où centraliser les versions des dépendances et des plugins d'un projet multi-modules ?
    choices:
      - text: "Dans le POM parent, sous `dependencyManagement` et `pluginManagement`"
        correct: true
      - text: "Dans chaque module, séparément"
        correct: false
      - text: "Dans `settings.xml`"
        correct: false
      - text: "Dans un fichier texte à part"
        correct: false
    answer: Les modules déclarent leurs dépendances sans version.
  - key: scenario-decouper
    format: scenario
    question: Découperais-tu un monolithe modulaire en plusieurs modules Maven ou garderais-tu un seul module avec des règles ArchUnit ?
    answer: |-
      Plusieurs modules Maven donnent une garantie forte : le compilateur interdit une dépendance non déclarée, et le
      domaine ne peut pas importer JPA s'il n'en dépend pas. Le coût : plus de POM, des builds un peu plus complexes, et une
      friction pour les refactorisations qui traversent les modules. Un seul module avec ArchUnit est plus simple et
      vérifie les règles dans les tests, au prix d'une garantie plus tardive. Je commencerais simple (un module + ArchUnit)
      et je découperais quand les frontières sont stables ou que les équipes se séparent, en consignant le choix dans un
      ADR.
  - key: scenario-build-lent
    format: scenario
    question: Le build complet d'un projet de 30 modules prend 20 minutes, alors que les développeurs ne touchent qu'un ou deux modules. Que proposes-tu ?
    answer: |-
      En local, construire seulement ce qui est concerné : `mvn -pl module-modifie -amd verify` vérifie le module et ceux
      qui en dépendent. Activer la parallélisation (`-T 1C`) et le cache du dépôt local. En CI, mettre en cache `~/.m2` et
      envisager un cache de build (extension Maven Build Cache, ou Develocity) qui réutilise les résultats des modules non
      modifiés. Je regarderais aussi les dépendances entre modules : un module « commun » dont tout dépend déclenche la
      reconstruction de tout le projet à chaque changement.
  - key: scenario-cycle
    format: scenario
    question: Deux modules ont besoin l'un de l'autre, et Maven refuse le cycle. Comment le résous-tu ?
    answer: |-
      Un cycle signale une frontière mal placée. J'extrais ce dont les deux ont besoin dans un troisième module dont ils
      dépendent tous deux (des interfaces, des types communs), ou j'inverse une dépendance : le module de plus haut niveau
      définit une interface (un port) que l'autre implémente, et l'injection relie les deux à l'exécution. Parfois, les
      deux modules n'en forment en réalité qu'un et il vaut mieux les fusionner.
  - key: scenario-versions
    format: scenario
    question: Faut-il que tous les modules d'un projet aient la même version ?
    answer: |-
      Dans la plupart des projets applicatifs, oui : ils sont construits, testés et livrés ensemble, et une version commune
      (`${project.version}`) évite les combinaisons incohérentes. Des versions indépendantes ont du sens pour des
      bibliothèques publiées séparément, consommées par d'autres équipes à leur rythme ; il faut alors un vrai versionnage
      sémantique par module et des dépendances entre modules qui pointent vers des versions publiées, ce qui complique la
      livraison.
