notion: classpath
lesson: |-
  Le **classpath** est la liste des emplacements (dossiers et fichiers JAR) où la JVM et le compilateur cherchent les
  classes et les ressources.

  ```
  javac -cp lib/commons.jar -d classes src/com/recallio/App.java
  java -cp classes:lib/commons.jar:lib/jackson.jar com.recallio.App      # « ; » comme séparateur sous Windows
  java -cp "lib/*" com.recallio.App                                      # tous les JAR d'un dossier
  java -jar app.jar                                                      # le classpath vient du manifeste du JAR
  ```

  - Une classe `com.recallio.App` est cherchée comme `com/recallio/App.class` dans **chaque entrée, dans l'ordre** : la
    **première trouvée gagne**. Deux versions d'une bibliothèque sur le classpath, c'est l'une des deux, au hasard de
    l'ordre (le « JAR hell »).
  - Sans `-cp`, le classpath est la variable d'environnement `CLASSPATH`, sinon le dossier courant `.`.
  - Avec **`java -jar`**, l'option `-cp` est **ignorée** : seul l'attribut `Class-Path` du manifeste compte.
  - Les **ressources** (fichiers de configuration, modèles) se lisent depuis le classpath avec
    `getResourceAsStream("/config.properties")` : elles peuvent être dans un JAR, pas forcément sur le disque.
  - Une classe absente à l'exécution alors qu'elle était là à la compilation : `NoClassDefFoundError`. Une recherche par
    nom qui échoue : `ClassNotFoundException`.
  - Maven et Gradle construisent le classpath à partir des dépendances déclarées : on le voit avec
    `mvn dependency:build-classpath`.
  - Le **module path** (`--module-path`, Java 9) est l'alternative pour les modules, avec des dépendances explicites et
    sans doublons de packages.

  **Piège classique** : ajouter `-cp` à une commande `java -jar app.jar` pour fournir une bibliothèque. Elle est ignorée,
  et l'application lève `NoClassDefFoundError`.

  **En entretien** : « La liste ordonnée des dossiers et JAR où chercher les classes ; la première trouvée gagne, d'où le
  JAR hell ; et `java -jar` ignore `-cp` au profit du manifeste. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce que le classpath ?
    choices:
      - {text: "La liste ordonnée des dossiers et JAR où la JVM et `javac` cherchent les classes", correct: true}
      - {text: "La variable qui indique où est installé le JDK, comme `JAVA_HOME`", correct: false}
      - {text: "Le dossier où Maven range les dépendances téléchargées, `~/.m2`", correct: false}
      - {text: "La liste des modules du JDK chargés au démarrage de la JVM", correct: false}
    answer: "La liste ordonnée des dossiers et fichiers JAR où la JVM et le compilateur cherchent les classes et les ressources. Ce n'est ni `JAVA_HOME` (l'emplacement du JDK) ni le dépôt local de Maven."
  - key: ordre
    format: course
    question: Que se passe-t-il si une même classe est présente dans deux JAR du classpath ?
    choices:
      - {text: "La JVM charge la première trouvée dans l'ordre du classpath et ignore l'autre", correct: true}
      - {text: "La JVM refuse de démarrer et signale la classe en double", correct: false}
      - {text: "La JVM charge la plus récente des deux, d'après le numéro de version", correct: false}
      - {text: "Le compilateur refuse de compiler tant qu'un des JAR n'est pas retiré", correct: false}
    answer: "La JVM charge la première trouvée dans l'ordre du classpath ; l'autre est ignorée, ce qui provoque des erreurs si les versions diffèrent. Refuser un package en double, c'est le module path : le classpath, lui, ne vérifie rien."
  - key: java-jar
    format: course
    question: Pourquoi `-cp` n'a-t-il aucun effet avec `java -jar` ?
    choices:
      - {text: "Avec `-jar`, le classpath vient du seul attribut `Class-Path` du manifeste", correct: true}
      - {text: "Parce que `-cp` doit être placé après le nom du JAR pour être lu", correct: false}
      - {text: "Parce que `-jar` ajoute `-cp` au classpath, mais en dernier dans l'ordre", correct: false}
      - {text: "Parce que `-cp` est réservé à `javac` et ignoré par la commande `java`", correct: false}
    answer: Avec `-jar`, le classpath est entièrement défini par l'attribut `Class-Path` du manifeste du JAR ; `-cp` et `CLASSPATH` sont ignorés.
  - key: ressources
    format: course
    question: Comment lire un fichier de configuration placé dans le classpath ?
    choices:
      - {text: "Avec `getResourceAsStream(\"/config.properties\")`, en flux", correct: true}
      - {text: "Avec `new File(\"src/main/resources/config.properties\")`", correct: false}
      - {text: "Avec `Path.of(\"config.properties\")`, relatif au dossier courant", correct: false}
      - {text: "Avec `System.getProperty(\"config.properties\")`", correct: false}
    answer: "Avec `MaClasse.class.getResourceAsStream(\"/config.properties\")` (ou le `ClassLoader`), en flux, car la ressource peut être dans un JAR. Un `File` marche dans l'IDE, mais pas dans un JAR, où la ressource n'est pas un fichier."
  - key: vf-premier
    format: true-false
    question: Sur le classpath, la dernière occurrence d'une classe l'emporte.
    truth: false
    answer: C'est la première trouvée, dans l'ordre des entrées.
  - key: vf-separateur
    format: true-false
    question: Le séparateur des entrées du classpath est `:` sous Linux et `;` sous Windows.
    truth: true
    answer: '`File.pathSeparator` le donne dans le code.'
  - key: vf-joker
    format: true-false
    question: "`-cp \"lib/*\"` ajoute tous les JAR du dossier `lib`."
    truth: true
    answer: Mais pas ses sous-dossiers ni les fichiers `.class` qu'il contient.
  - key: vf-defaut
    format: true-false
    question: Sans `-cp` ni variable `CLASSPATH`, le classpath est vide.
    truth: false
    answer: Il vaut le dossier courant `.`.
  - key: qcm-lancement
    format: multiple-choice
    question: "Quelle commande lance la classe `com.recallio.App`, compilée dans `classes`, avec ses dépendances du dossier `lib` (sous Linux) ?"
    choices:
      - {text: "`java -cp \"classes:lib/*\" com.recallio.App`", correct: true}
      - {text: "`java -jar app.jar -cp lib/*`", correct: false}
      - {text: "`java com/recallio/App.class`", correct: false}
      - {text: "`java -cp \"classes;lib/*\" com.recallio.App`", correct: false}
    answer: "Le classpath liste `classes` et `lib/*`, séparés par `:` sous Linux (`;` sous Windows), puis vient le nom complet de la classe. Après `-jar`, `-cp` est ignoré et passe en argument à l'application."
  - key: qcm-erreurs
    format: multiple-choice
    question: Une classe présente à la compilation manque à l'exécution. Quelle erreur ?
    choices:
      - text: "`NoClassDefFoundError`"
        correct: true
      - text: "`ClassNotFoundException`, uniquement pour une recherche par nom"
        correct: false
      - text: "`NullPointerException`"
        correct: false
      - text: "`UnsupportedClassVersionError`"
        correct: false
    answer: '`ClassNotFoundException` vient de `Class.forName` ou d''un chargement dynamique.'
  - key: qcm-voir
    format: multiple-choice
    question: "Quelle commande affiche le classpath qu'utilise un projet Maven ?"
    choices:
      - {text: "`mvn dependency:build-classpath`", correct: true}
      - {text: "`mvn help:effective-pom`", correct: false}
      - {text: "`mvn help:system`", correct: false}
      - {text: "`mvn validate`", correct: false}
    answer: "`dependency:build-classpath` donne la liste des JAR, dans l'ordre. `help:effective-pom` montre le POM final, pas le classpath ; à l'exécution, `System.getProperty(\"java.class.path\")` le donne."
  - key: qcm-module-path
    format: multiple-choice
    question: "Quelle garantie le module path apporte-t-il, que le classpath n'a pas ?"
    choices:
      - {text: "Il refuse qu'un même package vienne de deux modules", correct: true}
      - {text: "Il exécute le code plus vite, grâce à un JIT dédié", correct: false}
      - {text: "Il télécharge les modules manquants au démarrage", correct: false}
      - {text: "Il charge deux versions d'un même module côte à côte", correct: false}
    answer: "Le module path vérifie au démarrage les dépendances déclarées entre modules et interdit les packages en double ; le classpath accepte tout, dans l'ordre. Il ne rend pas le code plus rapide."
  - key: scenario-noclassdef
    format: scenario
    question: "Une application lève `NoClassDefFoundError: org/apache/commons/lang3/StringUtils` au lancement, alors qu'elle compile. Que vérifies-tu ?"
    choices:
      - {text: "Que la bibliothèque est bien livrée, présente sur le classpath à l'exécution", correct: true}
      - {text: "Que le code compile avec la bonne version de Java, en relançant `javac`", correct: false}
      - {text: "Que la classe `StringUtils` a bien un constructeur public sans paramètre", correct: false}
      - {text: "Que la mémoire de la JVM suffit, en augmentant `-Xmx` au lancement", correct: false}
    answer: |-
      Que la bibliothèque est bien sur le classpath à l'exécution : si l'application est lancée avec `java -jar`, que le
      manifeste la référence (`Class-Path`) ou que le JAR est un « fat JAR » qui l'embarque ; si la dépendance est en
      portée `provided` ou `test` dans Maven, elle n'est pas livrée. Je regarde aussi si l'erreur cache un échec
      d'initialisation de la classe (une `ExceptionInInitializerError` plus haut dans les journaux). Je vérifie le
      contenu réel du livrable avec `jar tf`.
  - key: scenario-deux-versions
    format: scenario
    question: En production, une classe se comporte comme une ancienne version alors que le projet dépend de la nouvelle. Comment le prouves-tu ?
    choices:
      - {text: "Je regarde de quel JAR la classe est chargée (`-verbose:class` ou `getCodeSource()`)", correct: true}
      - {text: "Je relis le POM : la version déclarée est forcément celle qui est chargée", correct: false}
      - {text: "Je vide le cache `~/.m2` du serveur de production et je redémarre l'application", correct: false}
      - {text: "Je recompile le projet en local : si les tests passent, la version est la bonne", correct: false}
    answer: |-
      Je regarde d'où la classe a été chargée : `MaClasse.class.getProtectionDomain().getCodeSource().getLocation()` (ou
      l'option `-verbose:class`, qui journalise chaque classe chargée et son JAR). Si elle vient d'un autre JAR que prévu,
      deux versions sont sur le classpath (une dépendance transitive, ou un JAR ajouté par le serveur). Je confirme avec
      `mvn dependency:tree`, puis j'exclus la version en trop ou j'aligne les versions, et j'ajoute la règle de convergence
      du plugin enforcer.
  - key: scenario-ressource
    format: scenario
    question: Un fichier de modèles se lit bien depuis l'IDE mais pas une fois l'application empaquetée en JAR. Pourquoi ?
    choices:
      - {text: "Le code la lit comme un fichier du disque, alors qu'elle est une entrée du JAR", correct: true}
      - {text: "Le JAR compresse la ressource, qu'il faut décompresser avant de la lire", correct: false}
      - {text: "Maven n'empaquette pas `src/main/resources` sans configuration particulière", correct: false}
      - {text: "L'encodage du fichier change à l'empaquetage et rend sa lecture impossible", correct: false}
    answer: |-
      Le code le lisait probablement comme un fichier (`new File("src/main/resources/modele.txt")` ou `Path.of(...)`), ce
      qui marche dans l'IDE où les ressources existent sur le disque. Dans un JAR, la ressource est une entrée de l'archive,
      pas un fichier. Il faut la lire depuis le classpath, en flux : `getClass().getResourceAsStream("/modele.txt")`,
      ce qui fonctionne dans les deux cas.
  - key: scenario-ordre
    format: scenario
    question: Comment éviter que l'ordre du classpath change le comportement d'une application ?
    choices:
      - {text: "N'avoir jamais deux versions d'une classe : versions alignées, conflits refusés au build", correct: true}
      - {text: "Trier les JAR du dossier `lib` par ordre alphabétique avant chaque livraison", correct: false}
      - {text: "Placer à la main la bonne version en tête de `-cp` sur chaque serveur", correct: false}
      - {text: "Renommer les JAR en double pour qu'ils passent après les autres dans `lib`", correct: false}
    answer: |-
      En n'ayant jamais deux versions d'une même classe : aligner les versions avec `dependencyManagement` ou un BOM,
      exclure les doublons transitifs, et faire échouer le build en cas de conflit (enforcer avec
      `dependencyConvergence` et `banDuplicateClasses`). Livrer un artefact dont le classpath est figé (un JAR avec un
      manifeste ou une image de conteneur construite par l'outil de build) plutôt qu'un dossier `lib` rempli à la main. Le
      module path, qui interdit les packages en double, est une autre garantie.
