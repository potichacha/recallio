notion: packages-imports
lesson: |-
  Un **package** regroupe des classes liées et leur donne un **espace de noms** : deux classes `Commande` peuvent
  coexister dans `com.recallio.vente` et `com.recallio.stock`.

  ```java
  package com.recallio.vente;                // première instruction du fichier

  import java.util.List;                     // une classe
  import java.time.*;                        // toutes les classes publiques d'un package (pas ses sous-packages)
  import static java.lang.Math.max;          // un membre statique
  import static java.util.Map.entry;

  public class Panier {
      private final List<LocalDate> dates;   // List et LocalDate sont importées
      int plusGrand(int a, int b) { return max(a, b); }
  }
  ```

  - Le nom complet (*fully qualified name*) d'une classe est `package.Classe` : `com.recallio.vente.Panier`.
  - **Convention** : le nom de domaine inversé, en minuscules (`com.entreprise.projet.module`) ; l'arborescence des
    dossiers suit le package (`com/recallio/vente/Panier.java`).
  - `java.lang` est importé **implicitement** (`String`, `Math`, `Integer`...).
  - Un import ne charge rien et ne coûte rien à l'exécution : il évite seulement d'écrire le nom complet.
  - `import java.util.*` n'importe pas `java.util.concurrent` : les sous-packages sont des packages distincts.
  - En cas de **conflit** de noms (`java.util.Date` et `java.sql.Date`), on importe l'un et l'on écrit l'autre en nom
    complet.
  - Un membre sans modificateur est **package-private** : visible seulement dans son package, ce qui permet de cacher des
    classes internes d'un module métier.
  - Java 25 ajoute l'**import de module** : `import module java.base;` importe tous les packages exportés par un module.

  **Piège classique** : abuser des imports statiques (`import static org.Util.*;`). Le lecteur ne sait plus d'où vient
  une méthode ; on les réserve aux usages clairs (assertions de test, constantes, `Map.entry`).

  **En entretien** : « Un package est un espace de noms qui suit l'arborescence et le domaine inversé ; `java.lang` est
  implicite, un import ne coûte rien à l'exécution, et `*` n'importe pas les sous-packages. »
tour:
  - title: Packages et imports
    text: |-
      `import java.util.List;` permet d'écrire `List` au lieu de `java.util.List`. `import java.util.*;` importe tout un
      package, mais pas ses sous-packages. Un **import statique**, `import static java.lang.Math.max;`, importe un
      membre `static` : on écrit alors `max(3, 5)`.

      Les imports ne chargent rien : ils ne servent qu'au compilateur. Quand deux classes ont le même nom, comme
      `java.util.List` et `java.awt.List`, on écrit le nom complet.
    example:
      files:
        Main.java: |-
          import static java.lang.Math.PI;
          import static java.lang.Math.max;

          import java.util.ArrayList;
          import java.util.List;

          public class Main {
              public static void main(String[] args) {
                  List<Integer> valeurs = new ArrayList<>(List.of(3, 8, 5));
                  int plusGrand = 0;
                  for (int v : valeurs) {
                      plusGrand = max(plusGrand, v);
                  }
                  System.out.println(plusGrand + " " + (PI > 3));
                  java.util.Map<String, Integer> nomComplet = java.util.Map.of("a", 1);
                  System.out.println(nomComplet);
              }
          }
      output: |-
        8 true
        {a=1}
cards:
  - key: role
    format: course
    question: À quoi sert un package ?
    answer: À regrouper des classes liées dans un espace de noms (deux classes de même nom peuvent coexister dans deux packages) et à contrôler la visibilité (package-private).
  - key: convention
    format: course
    question: Quelle est la convention de nommage des packages ?
    answer: Le nom de domaine inversé, en minuscules (`com.entreprise.projet.module`), et une arborescence de dossiers qui reproduit le package.
  - key: import-statique
    format: course
    question: Qu'est-ce qu'un import statique ?
    answer: Un import d'un membre statique (`import static java.lang.Math.max;`) qui permet de l'utiliser sans préfixer par sa classe.
  - key: conflit
    format: course
    question: Comment utiliser à la fois `java.util.Date` et `java.sql.Date` dans un fichier ?
    answer: En important l'une et en écrivant l'autre avec son nom complet.
  - key: vf-java-lang
    format: true-false
    question: Il faut importer `java.lang.String` pour utiliser `String`.
    truth: false
    answer: '`java.lang` est importé implicitement.'
  - key: vf-etoile
    format: true-false
    question: "`import java.util.*;` importe aussi les classes de `java.util.concurrent`."
    truth: false
    answer: Un sous-package est un package distinct.
  - key: vf-cout
    format: true-false
    question: Les imports ralentissent le démarrage de l'application.
    truth: false
    answer: Ils n'existent qu'à la compilation ; le bytecode contient les noms complets.
  - key: vf-package-private
    format: true-false
    question: Une classe sans modificateur d'accès n'est visible que dans son package.
    truth: true
    answer: C'est la visibilité package-private.
  - key: qcm-valides
    format: multiple-choice
    question: Lesquelles sont des déclarations valides ?
    choices:
      - text: "`import java.util.List;`"
        correct: true
      - text: "`import static java.util.Objects.requireNonNull;`"
        correct: true
      - text: "`import java.util.List.*;` pour importer les méthodes de `List`"
        correct: false
      - text: "`package Com.Recallio;` placé après les imports"
        correct: false
    answer: '`package` vient en premier, et les membres s''importent avec `import static`.'
  - key: qcm-nom-complet
    format: multiple-choice
    question: "Quel est le nom complet de la classe `Panier` déclarée dans `package com.recallio.vente;` ?"
    choices:
      - text: "`com.recallio.vente.Panier`"
        correct: true
      - text: "`Panier`"
        correct: false
      - text: "`vente.Panier`"
        correct: false
      - text: "`com/recallio/vente/Panier.java`"
        correct: false
    answer: Le dernier est le chemin du fichier source.
  - key: qcm-statique-usage
    format: multiple-choice
    question: Pour quels usages un import statique est-il raisonnable ?
    choices:
      - text: "Les assertions dans les tests (`assertEquals`, `assertThat`)"
        correct: true
      - text: "Des fabriques courantes (`Map.entry`, `Collectors.toList`)"
        correct: true
      - text: "`import static` de toutes les méthodes de toutes les classes utilitaires du projet"
        correct: false
      - text: "Remplacer tous les appels de méthodes d'instance"
        correct: false
    answer: Il faut que l'origine reste évidente pour le lecteur.
  - key: qcm-module
    format: multiple-choice
    question: "Que fait `import module java.base;` (Java 25) ?"
    choices:
      - text: "Il importe tous les packages exportés par le module `java.base`"
        correct: true
      - text: "Il crée un module"
        correct: false
      - text: "Il charge toutes les classes au démarrage"
        correct: false
      - text: "Il remplace `module-info.java`"
        correct: false
    answer: Pratique pour les petits programmes et l'enseignement.
  - key: trous-package
    format: fill-in
    question: |-
      Complétez la première ligne du fichier `com/recallio/stock/Article.java` :
      ```java
      ___ com.recallio.stock;
      ```
    blanks: [[package]]
    answer: La déclaration de package vient en premier.
  - key: trous-static
    format: fill-in
    question: |-
      Complétez pour utiliser `assertEquals` sans préfixe :
      ```java
      import ___ org.junit.jupiter.api.Assertions.assertEquals;
      ```
    blanks: [[static]]
    answer: Un import statique.
  - key: trous-import
    format: fill-in
    question: |-
      Complétez pour utiliser `LocalDate` :
      ```java
      ___ java.time.LocalDate;
      ```
    blanks: [[import]]
    answer: '`java.time` n''est pas importé implicitement.'
  - key: trous-nom-complet
    format: fill-in
    question: |-
      Complétez pour utiliser la date SQL sans conflit avec `java.util.Date` importée :
      ```java
      java.___.Date naissance = resultat.getDate("naissance");
      ```
    blanks: [[sql]]
    answer: Le nom complet lève l'ambiguïté.
  - key: code-statique
    format: code-output
    question: |-
      ```java
      import static java.lang.Math.max;
      import static java.lang.Math.abs;
      System.out.println(max(3, abs(-7)));
      ```
    answer: '`7`.'
    check:
      output: "7"
  - key: code-nom-complet
    format: code-output
    question: |-
      ```java
      java.util.List<String> l = java.util.List.of("a", "b");
      System.out.println(l.getClass().getPackageName().startsWith("java.util") + " " + String.class.getPackageName());
      ```
    answer: '`true java.lang`.'
    check:
      output: "true java.lang"
  - key: code-entry
    format: code-output
    question: |-
      ```java
      import static java.util.Map.entry;
      var m = java.util.Map.ofEntries(entry("a", 1), entry("b", 2));
      System.out.println(m.get("b"));
      ```
    answer: '`2`.'
    check:
      output: "2"
  - key: code-classe-nom
    format: code-output
    question: |-
      ```java
      System.out.println(java.time.LocalDate.class.getName() + " " + java.time.LocalDate.class.getSimpleName());
      ```
    answer: '`java.time.LocalDate LocalDate`.'
    check:
      output: "java.time.LocalDate LocalDate"
  - key: bug-conflit
    format: bug-fix
    question: |-
      Ce fichier ne compile pas (« reference to Date is ambiguous ») :
      ```java
      import java.util.*;
      import java.sql.*;
      Date d = new Date();
      ```
    answer: |-
      ```java
      import java.time.LocalDate;
      LocalDate d = LocalDate.now();
      // ou : import java.util.Date; et java.sql.Date en nom complet là où il sert
      ```
      Deux imports en `*` exposent deux `Date`. On importe précisément ce qu'on utilise (et, pour une date, `java.time`
      remplace avantageusement les deux).
  - key: bug-statiques-partout
    format: bug-fix
    question: |-
      Le lecteur ne sait plus d'où viennent les méthodes :
      ```java
      import static com.recallio.util.Outils.*;
      import static com.recallio.util.Formats.*;
      ...
      return formater(calculer(normaliser(saisie)));
      ```
    answer: |-
      ```java
      import com.recallio.util.Formats;
      import com.recallio.util.Outils;
      ...
      return Formats.formater(Outils.calculer(Outils.normaliser(saisie)));
      ```
      Les imports statiques en `*` de classes utilitaires cachent l'origine des méthodes. On les réserve aux cas évidents
      (assertions, fabriques bien connues).
  - key: bug-package-dossier
    format: bug-fix
    question: |-
      Le fichier `src/main/java/com/recallio/Commande.java` contient `package com.recallio.vente;`, et Maven ne trouve plus
      la classe dans les autres modules. Corrigez.
    answer: |-
      ```
      src/main/java/com/recallio/vente/Commande.java      # déplacer le fichier
      ```
      L'arborescence doit reproduire le package : les outils (et le classpath) cherchent `com/recallio/vente/Commande.class`.
      Le fichier se déplace dans le dossier qui correspond à son package.
  - key: bug-nom-package
    format: bug-fix
    question: |-
      Corrigez ce nom de package :
      ```java
      package Com.Recallio.GestionDesVentes;
      ```
    answer: |-
      ```java
      package com.recallio.ventes;
      ```
      La convention veut des minuscules, sans majuscules ni mots collés en CamelCase, à partir du domaine inversé. Cela
      évite aussi les problèmes sur les systèmes de fichiers insensibles à la casse.
