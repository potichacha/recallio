notion: maven-vs-gradle
lesson: |-
  Maven et Gradle font le même travail (résoudre les dépendances, compiler, tester, empaqueter, publier) avec deux
  philosophies :

  | | Maven | Gradle |
  |---|---|---|
  | description | XML **déclaratif**, cycle de vie fixe | script (**Kotlin** ou Groovy), graphe de tâches |
  | convention | forte : la même structure partout | conventions, mais tout est programmable |
  | performance | correcte ; cache de build en extension | **incrémental**, cache de build, démon : souvent plus rapide |
  | conflits de versions | la plus **proche** | la plus **haute** |
  | lisibilité | prévisible, verbeuse | concise, mais un script peut devenir complexe |
  | écosystème | standard de fait du monde Java d'entreprise | standard d'Android, fréquent en Kotlin |
  | personnalisation | via des plugins (écrire un plugin pour une logique propre) | dans le script ou des plugins de convention |

  Comment choisir :
  - **Maven** pour un projet d'entreprise classique : la rigidité est une qualité (n'importe qui comprend n'importe quel
    POM), l'outillage et la documentation sont partout, les frameworks (Quarkus, Spring) le prennent en charge en
    premier ;
  - **Gradle** pour un très gros projet multi-modules où la vitesse de build compte, un projet Android ou Kotlin, ou une
    logique de build vraiment spécifique ;
  - dans les deux cas : un **wrapper** versionné, des versions **centralisées** (BOM, catalogue de versions), et une CI
    qui met en cache dépendances et résultats.

  Changer d'outil sur un projet existant coûte cher (scripts, CI, habitudes) pour un gain souvent modeste : ce n'est
  justifié que par une douleur mesurée (des builds trop lents malgré le cache).

  **Piège classique** : un script Gradle qui devient un programme de 2 000 lignes, plein de logique conditionnelle. Le
  build n'est plus compréhensible ; la logique doit aller dans des plugins de convention testés.

  **En entretien** : « Maven : XML déclaratif et conventions fortes, prévisible ; Gradle : script, build incrémental et
  cache, plus rapide et plus souple. Je choisis selon le projet et l'équipe, et je ne migre que pour une raison mesurée. »
cards:
  - key: gradle-souvent-plus-rapide
    format: course
    question: Pourquoi Gradle est-il souvent plus rapide ?
    answer: Builds incrémentaux, cache de build réutilisable, démon.
  - key: philosophies
    format: course
    question: Quelle différence de philosophie entre Maven et Gradle ?
    answer: Maven décrit le build en XML déclaratif avec un cycle de vie fixe et des conventions fortes ; Gradle le décrit par un script (Kotlin ou Groovy) qui construit un graphe de tâches, plus souple et programmable.
  - key: quand-maven
    format: course
    question: Dans quels cas préférer Maven ?
    answer: "Pour un projet d'entreprise classique où la prévisibilité compte : n'importe qui comprend un POM, l'outillage et la documentation sont partout, et les frameworks le prennent en charge en premier."
  - key: quand-gradle
    format: course
    question: Dans quels cas préférer Gradle ?
    answer: Pour un très gros projet multi-modules où la vitesse de build compte, un projet Android ou Kotlin, ou une logique de build vraiment spécifique.
  - key: vf-conflits
    format: true-false
    question: Maven et Gradle retiennent par défaut la même version en cas de conflit.
    truth: false
    answer: Maven la plus proche, Gradle la plus haute.
  - key: vf-android
    format: true-false
    question: Gradle est l'outil de build standard d'Android.
    truth: true
    answer: Le plugin Android est un plugin Gradle.
  - key: vf-migration
    format: true-false
    question: Migrer un gros projet de Maven vers Gradle est une opération légère.
    truth: false
    answer: Scripts, CI et habitudes changent ; le gain doit être mesuré avant.
  - key: vf-wrapper
    format: true-false
    question: Les deux outils proposent un wrapper qui fige leur version.
    truth: true
    answer: '`mvnw` et `gradlew`.'
  - key: qcm-forces
    format: multiple-choice
    question: Quelles sont des forces de Maven ?
    choices:
      - text: "Des conventions fortes et un build prévisible"
        correct: true
      - text: "Une prise en charge omniprésente dans l'écosystème Java d'entreprise"
        correct: true
      - text: "Un build incrémental natif très poussé"
        correct: false
      - text: "Un script programmable sans limite"
        correct: false
    answer: Ce sont plutôt des forces de Gradle.
  - key: qcm-gradle
    format: multiple-choice
    question: Quelles sont des forces de Gradle ?
    choices:
      - text: "Le build incrémental et le cache de build"
        correct: true
      - text: "Un DSL Kotlin concis et vérifié par l'IDE"
        correct: true
      - text: "Un format XML standardisé"
        correct: false
      - text: "Une impossibilité de personnaliser"
        correct: false
    answer: La souplesse a pour revers des scripts parfois complexes.
  - key: qcm-choix
    format: multiple-choice
    question: Une équipe Java d'entreprise démarre un service Quarkus classique. Quel choix raisonnable ?
    choices:
      - text: "Maven, avec le wrapper et le BOM de Quarkus"
        correct: true
      - text: "Gradle, obligatoirement"
        correct: false
      - text: "Aucun outil de build, des scripts shell"
        correct: false
      - text: "Ant"
        correct: false
    answer: Gradle conviendrait aussi ; l'important est la cohérence et l'outillage de l'équipe.
  - key: qcm-dette
    format: multiple-choice
    question: Comment éviter qu'un build Gradle devienne incompréhensible ?
    choices:
      - text: "Déplacer la logique dans des plugins de convention testés"
        correct: true
      - text: "Centraliser les versions dans un catalogue de versions"
        correct: true
      - text: "Mettre toute la logique conditionnelle dans le script principal"
        correct: false
      - text: "Copier le script dans chaque module"
        correct: false
    answer: Un build se maintient comme du code.
  - key: scenario-choisir
    format: scenario
    question: On te demande de choisir l'outil de build d'un nouveau projet. Comment décides-tu ?
    answer: |-
      Je regarde l'équipe et l'écosystème : ce que l'équipe maîtrise, ce que les frameworks et la CI de l'entreprise
      supportent, la taille prévue du projet. Pour un service d'entreprise classique, Maven : prévisible, connu de tous,
      bien outillé. Pour un projet Kotlin ou Android, ou un très gros multi-modules où la vitesse de build sera critique,
      Gradle. Dans les deux cas : wrapper versionné, versions centralisées, cache en CI. Je consigne le choix dans un ADR.
  - key: scenario-migrer
    format: scenario
    question: Un collègue propose de migrer le projet de Maven vers Gradle « parce que c'est plus moderne ». Que réponds-tu ?
    answer: |-
      Que « moderne » n'est pas un besoin : je demande quelle douleur on veut résoudre. Si ce sont des builds trop lents,
      j'essaie d'abord le cache du dépôt local en CI, `-T 1C`, `-pl -amd` en local et l'extension de cache de build de
      Maven ; je mesure. Si la douleur persiste et qu'elle est significative, une migration peut se justifier, mais elle
      coûte (réécriture, CI, formation, plugins à retrouver) : je la planifierais avec un prototype et des mesures avant
      et après.
  - key: scenario-standardiser
    format: scenario
    question: Ton entreprise a vingt services, certains en Maven, d'autres en Gradle. Faut-il standardiser ?
    answer: |-
      Un standard aide : des pipelines de CI communs, un savoir partagé, des montées de version groupées, un parent ou des
      plugins de convention communs. Mais migrer vingt services a un coût réel. Je fixerais le standard pour les nouveaux
      services, je fournirais un parent Maven (ou un plugin de convention Gradle) qui encapsule les règles communes, et je
      ne migrerais les existants qu'à l'occasion d'un chantier important sur chacun, pas en bloc.
  - key: scenario-script-complexe
    format: scenario
    question: Le script Gradle d'un projet fait 1 500 lignes, et plus personne n'ose le modifier. Que fais-tu ?
    answer: |-
      Je le traite comme du code legacy : j'extrais la logique répétée dans des plugins de convention (dans `buildSrc` ou
      un build inclus), testés et documentés ; je centralise les versions dans le catalogue `libs.versions.toml` ; je
      supprime les tâches et conditions mortes. J'avance par petites étapes, en vérifiant que les artefacts produits
      restent identiques (contenu des JAR, tests), et j'ajoute un scan de build (`--scan`) pour comprendre ce qui
      s'exécute.
