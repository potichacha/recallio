notion: gradle-bases
lesson: |-
  **Gradle** décrit le build avec un **script** (en Kotlin, `build.gradle.kts`, ou en Groovy, `build.gradle`) plutôt
  qu'avec du XML. Le build est un graphe de **tâches**.

  ```kotlin
  // build.gradle.kts
  plugins {
      java
      application
  }

  java {
      toolchain { languageVersion = JavaLanguageVersion.of(25) }   // le JDK utilisé, téléchargé si besoin
  }

  repositories { mavenCentral() }

  dependencies {
      implementation("com.fasterxml.jackson.core:jackson-databind:2.18.2")
      runtimeOnly("org.postgresql:postgresql:42.7.4")
      testImplementation("org.junit.jupiter:junit-jupiter:5.11.3")
      testRuntimeOnly("org.junit.platform:junit-platform-launcher")
  }

  application { mainClass = "com.recallio.App" }

  tasks.test { useJUnitPlatform() }
  ```
  ```
  ./gradlew build          # compile, teste, empaquette (le wrapper, comme mvnw)
  ./gradlew test
  ./gradlew tasks          # les tâches disponibles
  ./gradlew dependencies   # l'arbre des dépendances
  ```

  Les **configurations** de dépendances (l'équivalent des portées) :
  - **`implementation`** : utilisée par le module, **non exposée** à la compilation de ses consommateurs ;
  - **`api`** (plugin `java-library`) : exposée, car elle fait partie de l'API publique du module ;
  - `compileOnly` (à la compilation seulement, comme `provided`), `runtimeOnly` (à l'exécution), `testImplementation`.

  Ce qui le distingue :
  - un build **incrémental** : une tâche dont les entrées n'ont pas changé est sautée (*up-to-date*) ;
  - un **cache de build**, local ou partagé, qui réutilise les sorties d'autres machines ;
  - un **démon** qui garde la JVM de Gradle chaude entre deux builds ;
  - en cas de conflit de versions, la version **la plus haute** est retenue (Maven : la plus proche) ;
  - les **catalogues de versions** (`gradle/libs.versions.toml`) centralisent les versions.

  **Piège classique** : tout déclarer en `api` dans une bibliothèque. Chaque dépendance interne fuit dans le classpath de
  compilation des consommateurs, qui recompilent dès qu'elle change.

  **En entretien** : « Un script Kotlin ou Groovy, un graphe de tâches incrémental avec cache et démon ; `implementation`
  par défaut, `api` seulement pour ce qui fait partie de l'API publique ; la version la plus haute gagne. »
cards:
  - key: implementation-vs-api-gradle
    format: course
    question: implementation vs api en Gradle ?
    answer: Dépendance non exposée aux consommateurs vs exposée (transitive à la compilation).
  - key: gradle-resout-conflit-versions
    format: course
    question: Comment Gradle résout-il un conflit de versions ?
    answer: Par défaut, la version la plus haute.
  - key: incremental
    format: course
    question: Qu'est-ce qu'un build incrémental dans Gradle ?
    answer: Gradle compare les entrées et sorties de chaque tâche ; une tâche dont rien n'a changé est sautée (up-to-date), ce qui accélère les builds successifs.
  - key: toolchain
    format: course
    question: À quoi sert une toolchain Java dans Gradle ?
    answer: À fixer la version du JDK utilisée pour compiler et tester, indépendamment du JDK qui exécute Gradle ; Gradle peut la télécharger.
  - key: vf-xml
    format: true-false
    question: Un build Gradle se décrit en XML, comme Maven.
    truth: false
    answer: Avec un script en Kotlin (`build.gradle.kts`) ou en Groovy.
  - key: vf-wrapper
    format: true-false
    question: "`./gradlew` est le wrapper de Gradle, équivalent de `mvnw`."
    truth: true
    answer: Il fige la version de Gradle utilisée.
  - key: vf-cache
    format: true-false
    question: Le cache de build de Gradle peut être partagé entre machines.
    truth: true
    answer: Un cache distant réutilise les sorties produites par la CI ou d'autres développeurs.
  - key: vf-compile-only
    format: true-false
    question: "`compileOnly` correspond à la portée `provided` de Maven."
    truth: true
    answer: Présente à la compilation, absente à l'exécution.
  - key: qcm-configurations
    format: multiple-choice
    question: Associez correctement configuration et usage.
    choices:
      - text: "`testImplementation` : JUnit"
        correct: true
      - text: "`runtimeOnly` : un pilote JDBC"
        correct: true
      - text: "`api` : toutes les dépendances par défaut"
        correct: false
      - text: "`compileOnly` : une bibliothèque nécessaire à l'exécution"
        correct: false
    answer: '`implementation` est le bon défaut.'
  - key: qcm-rapidite
    format: multiple-choice
    question: Qu'est-ce qui rend Gradle souvent rapide ?
    choices:
      - text: "Le build incrémental"
        correct: true
      - text: "Le cache de build et le démon"
        correct: true
      - text: "L'absence de tests"
        correct: false
      - text: "Le format XML"
        correct: false
    answer: Les tâches inchangées ne sont pas réexécutées.
  - key: qcm-commandes
    format: multiple-choice
    question: Quelle commande affiche l'arbre des dépendances d'un projet Gradle ?
    choices:
      - text: "`./gradlew dependencies`"
        correct: true
      - text: "`./gradlew tree`"
        correct: false
      - text: "`./gradlew dependency:tree`"
        correct: false
      - text: "`./gradlew show`"
        correct: false
    answer: '`dependencyInsight --dependency nom` explique le choix d''une version.'
  - key: qcm-api
    format: multiple-choice
    question: "Une bibliothèque renvoie des objets Jackson (`JsonNode`) dans son API publique. Comment déclarer Jackson ?"
    choices:
      - text: "`api(...)`, car les consommateurs doivent voir ses types"
        correct: true
      - text: "`implementation(...)`, toujours"
        correct: false
      - text: "`testImplementation(...)`"
        correct: false
      - text: "`compileOnly(...)`"
        correct: false
    answer: Si Jackson restait interne, `implementation` suffirait.
  - key: trous-implementation
    format: fill-in
    question: |-
      Complétez pour une dépendance interne au module :
      ```kotlin
      dependencies {
          ___("com.google.guava:guava:33.3.1-jre")
      }
      ```
    blanks: [[implementation]]
    answer: Le bon défaut, non exposé aux consommateurs.
  - key: trous-test
    format: fill-in
    question: |-
      Complétez pour une dépendance de test :
      ```kotlin
      ___("org.assertj:assertj-core:3.26.3")
      ```
    blanks: [[testImplementation]]
    answer: Elle n'est visible que des tests.
  - key: trous-wrapper
    format: fill-in
    question: |-
      Complétez pour construire avec le wrapper :
      ```
      ./___ build
      ```
    blanks: [[gradlew]]
    answer: Comme `./mvnw` pour Maven.
  - key: trous-fichier
    format: fill-in
    question: |-
      Complétez le nom du script de build en Kotlin :
      ```
      build.gradle.___
      ```
    blanks: [[kts]]
    answer: Le DSL Kotlin, avec complétion et vérification dans l'IDE.
