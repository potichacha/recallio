notion: gradle-bases
cards:
  - key: implementation-vs-api-gradle
    format: course
    question: implementation vs api en Gradle ?
    answer: Dépendance non exposée aux consommateurs vs exposée (transitive à la compilation).
  - key: gradle-resout-conflit-versions
    format: course
    question: Comment Gradle résout-il un conflit de versions ?
    answer: Par défaut, la version la plus haute.
