notion: gradle-bases
lesson: |-
  **Gradle** décrit le build avec un **script** (en Kotlin, `build.gradle.kts`, ou en Groovy, `build.gradle`) plutôt
  qu'avec du XML. Le build est un graphe de **tâches**.

  ```kotlin
  // build.gradle.kts
  plugins {
      java
      application
  }

  java {
      toolchain { languageVersion = JavaLanguageVersion.of(25) }   // le JDK utilisé, téléchargé si besoin
  }

  repositories { mavenCentral() }

  dependencies {
      implementation("com.fasterxml.jackson.core:jackson-databind:2.18.2")
      runtimeOnly("org.postgresql:postgresql:42.7.4")
      testImplementation("org.junit.jupiter:junit-jupiter:5.11.3")
      testRuntimeOnly("org.junit.platform:junit-platform-launcher")
  }

  application { mainClass = "com.recallio.App" }

  tasks.test { useJUnitPlatform() }
  ```
  ```
  ./gradlew build          # compile, teste, empaquette (le wrapper, comme mvnw)
  ./gradlew test
  ./gradlew tasks          # les tâches disponibles
  ./gradlew dependencies   # l'arbre des dépendances
  ```

  Les **configurations** de dépendances (l'équivalent des portées) :
  - **`implementation`** : utilisée par le module, **non exposée** à la compilation de ses consommateurs ;
  - **`api`** (plugin `java-library`) : exposée, car elle fait partie de l'API publique du module ;
  - `compileOnly` (à la compilation seulement, comme `provided`), `runtimeOnly` (à l'exécution), `testImplementation`.

  Ce qui le distingue :
  - un build **incrémental** : une tâche dont les entrées n'ont pas changé est sautée (*up-to-date*) ;
  - un **cache de build**, local ou partagé, qui réutilise les sorties d'autres machines ;
  - un **démon** qui garde la JVM de Gradle chaude entre deux builds ;
  - en cas de conflit de versions, la version **la plus haute** est retenue (Maven : la plus proche) ;
  - les **catalogues de versions** (`gradle/libs.versions.toml`) centralisent les versions.

  **Piège classique** : tout déclarer en `api` dans une bibliothèque. Chaque dépendance interne fuit dans le classpath de
  compilation des consommateurs, qui recompilent dès qu'elle change.

  **En entretien** : « Un script Kotlin ou Groovy, un graphe de tâches incrémental avec cache et démon ; `implementation`
  par défaut, `api` seulement pour ce qui fait partie de l'API publique ; la version la plus haute gagne. »
cards:
  - key: implementation-vs-api-gradle
    format: course
    question: "Quelle différence entre `implementation` et `api` dans les dépendances Gradle ?"
    choices:
      - {text: "`implementation` reste interne au module ; `api` est exposée à ses consommateurs", correct: true}
      - {text: "`implementation` sert à l'exécution seule ; `api` à la compilation seule", correct: false}
      - {text: "`api` est réservée aux tests ; `implementation` au code principal", correct: false}
      - {text: "`api` est l'ancien nom de `implementation`, déprécié depuis Gradle 7", correct: false}
    answer: "Une dépendance `implementation` n'est pas visible à la compilation des modules qui dépendent du nôtre ; une dépendance `api` l'est (transitive à la compilation). L'ancien `compile`, retiré, se comportait comme `api`."
  - key: gradle-resout-conflit-versions
    format: course
    question: "Comment Gradle résout-il, par défaut, un conflit entre deux versions d'une même dépendance ?"
    choices:
      - {text: "Il retient la version la plus haute", correct: true}
      - {text: "Il retient la version la plus proche dans l'arbre", correct: false}
      - {text: "Il retient la première déclarée dans le script", correct: false}
      - {text: "Il fait échouer le build jusqu'à ce qu'on choisisse", correct: false}
    answer: "Par défaut, la plus haute des versions demandées. La plus proche dans l'arbre (*nearest wins*), c'est la règle de Maven ; échouer sur un conflit demande `failOnVersionConflict()`."
  - key: incremental
    format: course
    question: Qu'est-ce qu'un build incrémental dans Gradle ?
    choices:
      - {text: "Gradle saute les tâches dont les entrées et les sorties n'ont pas changé", correct: true}
      - {text: "Gradle compile seulement les fichiers modifiés depuis le dernier commit Git", correct: false}
      - {text: "Gradle construit les modules un par un, dans l'ordre de leurs dépendances", correct: false}
      - {text: "Gradle relance le build à chaque enregistrement d'un fichier source", correct: false}
    answer: Gradle compare les entrées et sorties de chaque tâche ; une tâche dont rien n'a changé est sautée (up-to-date), ce qui accélère les builds successifs.
  - key: toolchain
    format: course
    question: À quoi sert une toolchain Java dans Gradle ?
    choices:
      - {text: "À fixer le JDK qui compile et teste, indépendamment de celui qui lance Gradle", correct: true}
      - {text: "À choisir la version de Gradle utilisée, comme le fait le wrapper", correct: false}
      - {text: "À enchaîner les tâches de compilation, de test et d'empaquetage", correct: false}
      - {text: "À régler la mémoire allouée au démon Gradle et à ses workers", correct: false}
    answer: À fixer la version du JDK utilisée pour compiler et tester, indépendamment du JDK qui exécute Gradle ; Gradle peut la télécharger.
  - key: vf-xml
    format: true-false
    question: Un build Gradle se décrit en XML, comme Maven.
    truth: false
    answer: Avec un script en Kotlin (`build.gradle.kts`) ou en Groovy.
  - key: vf-wrapper
    format: true-false
    question: "`./gradlew` est le wrapper de Gradle, équivalent de `mvnw`."
    truth: true
    answer: Il fige la version de Gradle utilisée.
  - key: vf-cache
    format: true-false
    question: Le cache de build de Gradle peut être partagé entre machines.
    truth: true
    answer: Un cache distant réutilise les sorties produites par la CI ou d'autres développeurs.
  - key: vf-compile-only
    format: true-false
    question: "`compileOnly` correspond à la portée `provided` de Maven."
    truth: true
    answer: Présente à la compilation, absente à l'exécution.
  - key: qcm-configurations
    format: multiple-choice
    question: "Quelle association entre configuration Gradle et usage est correcte ?"
    choices:
      - {text: "`runtimeOnly` : un pilote JDBC", correct: true}
      - {text: "`api` : toutes les dépendances, par défaut", correct: false}
      - {text: "`compileOnly` : une bibliothèque nécessaire à l'exécution", correct: false}
      - {text: "`implementation` : JUnit et AssertJ", correct: false}
    answer: "Un pilote JDBC n'est utilisé qu'à l'exécution, via l'API JDBC : `runtimeOnly`. JUnit va en `testImplementation`, et le bon défaut est `implementation`, pas `api`."
  - key: qcm-rapidite
    format: multiple-choice
    question: "Lesquels de ces mécanismes rendent Gradle souvent rapide ?"
    choices:
      - {text: "Le build incrémental, qui saute les tâches à jour", correct: true}
      - {text: "Le cache de build et le démon, gardé chaud entre deux builds", correct: true}
      - {text: "Un format de build en XML, rapide à analyser", correct: false}
      - {text: "Des tests désactivés par défaut", correct: false}
    answer: "Les tâches inchangées ne sont pas réexécutées, leurs résultats peuvent venir du cache, et le démon évite de redémarrer une JVM. Gradle n'est pas en XML, et il lance bien les tests."
  - key: qcm-commandes
    format: multiple-choice
    question: Quelle commande affiche l'arbre des dépendances d'un projet Gradle ?
    choices:
      - text: "`./gradlew dependencies`"
        correct: true
      - text: "`./gradlew tree`"
        correct: false
      - text: "`./gradlew dependency:tree`"
        correct: false
      - text: "`./gradlew show`"
        correct: false
    answer: '`dependencyInsight --dependency nom` explique le choix d''une version.'
  - key: qcm-api
    format: multiple-choice
    question: "Une bibliothèque renvoie des objets Jackson (`JsonNode`) dans son API publique. Comment déclarer Jackson ?"
    choices:
      - {text: "`api(...)`, car les consommateurs doivent voir ses types", correct: true}
      - {text: "`implementation(...)`, car c'est toujours le bon défaut", correct: false}
      - {text: "`compileOnly(...)`, car l'application cliente fournit Jackson", correct: false}
      - {text: "`runtimeOnly(...)`, car Jackson ne sert qu'à l'exécution", correct: false}
    answer: Si Jackson restait interne, `implementation` suffirait.
  - key: trous-implementation
    format: fill-in
    question: |-
      Complète pour une dépendance interne au module :
      ```kotlin
      dependencies {
          ___("com.google.guava:guava:33.3.1-jre")
      }
      ```
    blanks: [[implementation]]
    answer: Le bon défaut, non exposé aux consommateurs.
  - key: trous-test
    format: fill-in
    question: |-
      Complète pour une dépendance de test :
      ```kotlin
      ___("org.assertj:assertj-core:3.26.3")
      ```
    blanks: [[testImplementation]]
    answer: Elle n'est visible que des tests.
  - key: trous-wrapper
    format: fill-in
    question: |-
      Complète pour construire avec le wrapper :
      ```
      ./___ build
      ```
    blanks: [[gradlew]]
    answer: Comme `./mvnw` pour Maven.
  - key: trous-fichier
    format: fill-in
    question: |-
      Complète le nom du script de build en Kotlin :
      ```
      build.gradle.___
      ```
    blanks: [[kts]]
    answer: Le DSL Kotlin, avec complétion et vérification dans l'IDE.
