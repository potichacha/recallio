notion: maven-transitives
lesson: |-
  Une dépendance a ses propres dépendances, qui deviennent les nôtres : ce sont les **dépendances transitives**. Si
  plusieurs chemins mènent à une même bibliothèque en **versions différentes**, Maven en garde **une seule** :

  - la plus **proche** dans l'arbre (*nearest wins*) ;
  - à égalité de profondeur, la **première déclarée**.

  ```
  mon-service
  ├── client-a ──► guava 32.1    (profondeur 2)
  └── client-b ──► lib-x ──► guava 25.0   (profondeur 3)       → guava 32.1 est retenue
  ```

  Attention : Maven ne choisit **pas** la plus récente. La version retenue peut être plus ancienne que celle qu'une autre
  bibliothèque attend, d'où des `NoSuchMethodError` à l'exécution.

  Les outils :

  ```xml
  <dependencyManagement>                          <!-- fixe les versions, n'ajoute aucune dépendance -->
    <dependencies>
      <dependency>
        <groupId>io.quarkus.platform</groupId>
        <artifactId>quarkus-bom</artifactId>
        <version>3.17.0</version>
        <type>pom</type>
        <scope>import</scope>                     <!-- un BOM : un ensemble cohérent de versions -->
      </dependency>
      <dependency>
        <groupId>com.google.guava</groupId>
        <artifactId>guava</artifactId>
        <version>33.3.1-jre</version>             <!-- impose cette version partout, même en transitive -->
      </dependency>
    </dependencies>
  </dependencyManagement>

  <dependency>
    <groupId>com.exemple</groupId>
    <artifactId>client-b</artifactId>
    <exclusions>
      <exclusion>                                 <!-- retire une dépendance transitive -->
        <groupId>commons-logging</groupId>
        <artifactId>commons-logging</artifactId>
      </exclusion>
    </exclusions>
  </dependency>
  ```

  - **`mvn dependency:tree`** montre l'arbre ; `-Dverbose` affiche aussi les versions écartées.
  - **`dependencyManagement`** fixe une version **sans ajouter** la dépendance ; `dependencies` l'ajoute réellement.
  - Un **BOM** (*Bill of Materials*) importe un ensemble de versions testées ensemble (Spring Boot, Quarkus, Jackson) ;
    on peut en importer plusieurs, contrairement au **parent**, unique.
  - Le plugin **enforcer** (`dependencyConvergence`, `requireUpperBoundDeps`) fait échouer le build en cas de conflit.

  **Piège classique** : croire que Maven retient la version la plus récente. Il retient la plus proche, qui peut être
  ancienne, et la bibliothèque qui attendait la version récente plante à l'exécution.

  **En entretien** : « Nearest wins, pas la plus récente ; je lis `dependency:tree`, je fixe les versions par
  `dependencyManagement` et les BOM, j'exclus les intrus, et l'enforcer fait échouer le build en cas de conflit. »
cards:
  - key: maven-resout-conflit-versions
    format: course
    question: "Comment Maven résout-il un conflit entre deux versions d'une même dépendance ?"
    choices:
      - {text: "La plus proche du projet dans l'arbre gagne, puis la première déclarée", correct: true}
      - {text: "La plus haute des deux versions gagne, comme dans Gradle", correct: false}
      - {text: "La dernière déclarée dans le POM gagne, quelle que soit sa profondeur", correct: false}
      - {text: "Le build échoue tant qu'on n'a pas choisi la version à la main", correct: false}
    answer: "*Nearest wins* : la version la plus proche du projet dans l'arbre, puis, à égalité, la première déclarée. Ce n'est pas forcément la plus haute, contrairement à Gradle."
  - key: diagnostiquer-conflit
    format: course
    question: "Comment diagnostiquer un conflit de versions avec Maven ?"
    choices:
      - {text: "Avec `mvn dependency:tree`, qui montre le chemin de chaque version", correct: true}
      - {text: "Avec `mvn help:effective-pom`, qui liste les versions écartées", correct: false}
      - {text: "Avec `mvn clean install -U`, qui signale chaque conflit trouvé", correct: false}
      - {text: "Avec `mvn versions:display-dependency-updates`, qui les compare", correct: false}
    answer: "`mvn dependency:tree` (avec `-Dverbose` pour voir les versions écartées) montre quelle dépendance tire quelle version. `-U` force seulement la mise à jour des SNAPSHOT."
  - key: bom
    format: course
    question: "Qu'est-ce qu'un BOM, dans Maven ?"
    choices:
      - {text: "Un POM importé qui fixe un ensemble cohérent de versions, comme `spring-boot-dependencies`", correct: true}
      - {text: "Un POM parent dont on hérite la configuration et les plugins, un seul par projet", correct: false}
      - {text: "La liste des dépendances transitives, produite par `mvn dependency:tree`", correct: false}
      - {text: "Un fat JAR qui embarque toutes les dépendances d'un framework, prêtes à l'emploi", correct: false}
    answer: "Un POM importé (portée `import`) qui fixe un ensemble cohérent de versions, comme `spring-boot-dependencies`. Contrairement à un parent, il n'apporte que des versions, et on peut en importer plusieurs."
  - key: dependencymanagement-vs-dependencies
    format: course
    question: "Quelle différence entre `dependencyManagement` et `dependencies` dans un POM ?"
    choices:
      - {text: "Le premier fixe des versions sans ajouter la dépendance ; le second l'ajoute vraiment", correct: true}
      - {text: "Le premier ajoute les dépendances au parent ; le second à chaque module", correct: false}
      - {text: "Le premier sert aux dépendances de test ; le second au code principal", correct: false}
      - {text: "Aucune : `dependencyManagement` est l'ancien nom de `dependencies`", correct: false}
    answer: "`dependencyManagement` fixe des versions (et des portées) sans ajouter la dépendance ; `dependencies` l'ajoute réellement, et peut alors omettre la version."
  - key: parent-vs-bom
    format: course
    question: "Quelle différence entre un POM parent et un BOM ?"
    choices:
      - {text: "Le parent transmet configuration et versions (un seul) ; le BOM, des versions (plusieurs)", correct: true}
      - {text: "Le parent fixe seulement les versions ; le BOM transmet aussi les plugins", correct: false}
      - {text: "On peut hériter de plusieurs parents, mais n'importer qu'un seul BOM", correct: false}
      - {text: "Aucune : un BOM est un parent déclaré avec `<scope>import</scope>`", correct: false}
    answer: "Un parent transmet configuration, plugins et versions, et un projet n'en a qu'un ; un BOM n'apporte que des versions, et on peut en importer plusieurs."
  - key: vf-plus-recente
    format: true-false
    question: En cas de conflit, Maven retient toujours la version la plus récente.
    truth: false
    answer: Il retient la plus proche dans l'arbre, puis la première déclarée.
  - key: vf-dm-ajoute
    format: true-false
    question: Déclarer une dépendance dans `dependencyManagement` l'ajoute au projet.
    truth: false
    answer: Elle ne fait que fixer sa version si elle est utilisée.
  - key: vf-plusieurs-bom
    format: true-false
    question: Un projet peut importer plusieurs BOM.
    truth: true
    answer: Contrairement au parent, unique.
  - key: vf-gradle
    format: true-false
    question: Gradle et Maven résolvent les conflits de la même façon.
    truth: false
    answer: Gradle retient par défaut la version la plus haute.
  - key: qcm-retenue
    format: multiple-choice
    question: "`A → guava 30` (profondeur 2) et `B → C → guava 33` (profondeur 3). Quelle version Maven retient-il ?"
    choices:
      - text: "guava 30, la plus proche"
        correct: true
      - text: "guava 33, la plus récente"
        correct: false
      - text: "Les deux"
        correct: false
      - text: "Aucune, le build échoue"
        correct: false
    answer: Sauf si une version est imposée par `dependencyManagement`.
  - key: qcm-imposer
    format: multiple-choice
    question: "Lesquelles de ces solutions imposent la version d'une dépendance transitive dans tout le projet ?"
    choices:
      - text: "La déclarer dans `dependencyManagement`"
        correct: true
      - text: "Importer un BOM qui la fixe"
        correct: true
      - text: "Copier son JAR dans `src/main/resources`"
        correct: false
      - text: "La déclarer en portée `test`"
        correct: false
    answer: '`dependencyManagement` s''applique aussi aux dépendances transitives.'
  - key: qcm-exclure
    format: multiple-choice
    question: "Comment empêcher `client-b` d'apporter `commons-logging` ?"
    choices:
      - text: "Une `<exclusion>` dans la déclaration de `client-b`"
        correct: true
      - text: "Déclarer `commons-logging` en portée `test`"
        correct: false
      - text: "Supprimer le JAR de `~/.m2`"
        correct: false
      - text: "Ajouter `commons-logging` deux fois"
        correct: false
    answer: L'exclusion retire la dépendance transitive de l'arbre.
  - key: qcm-enforcer
    format: multiple-choice
    question: Quelles règles du plugin enforcer détectent les conflits de versions ?
    choices:
      - text: "`dependencyConvergence`"
        correct: true
      - text: "`requireUpperBoundDeps`"
        correct: true
      - text: "`requireJavaVersion`"
        correct: false
      - text: "`requireMavenVersion`"
        correct: false
    answer: Les deux dernières vérifient l'environnement de build.
  - key: bug-version-partout
    format: bug-fix
    question: |-
      Chaque module déclare sa propre version de Jackson, et elles divergent. Quelle correction est la bonne ?
      ```xml
      <!-- module-a -->  <artifactId>jackson-databind</artifactId> <version>2.15.0</version>
      <!-- module-b -->  <artifactId>jackson-databind</artifactId> <version>2.18.2</version>
      ```
    choices:
      - {text: "Fixer la version une fois dans le parent (par le BOM de Jackson) et l'omettre dans les modules", correct: true}
      - {text: "Aligner à la main les deux modules sur 2.18.2, en recopiant la version dans chacun", correct: false}
      - {text: "Retirer la dépendance d'un module, pour qu'il reçoive celle de l'autre", correct: false}
      - {text: "Déclarer Jackson en portée `provided` dans les deux modules", correct: false}
    answer: |-
      ```xml
      <!-- pom parent -->
      <dependencyManagement>
        <dependencies>
          <dependency>
            <groupId>com.fasterxml.jackson</groupId>
            <artifactId>jackson-bom</artifactId>
            <version>2.18.2</version>
            <type>pom</type>
            <scope>import</scope>
          </dependency>
        </dependencies>
      </dependencyManagement>
      <!-- modules : la dépendance sans version -->
      ```
      Les versions se fixent une fois, dans le parent (ici par le BOM de Jackson) ; les modules déclarent la dépendance
      sans version.
  - key: bug-ajout-manuel
    format: bug-fix
    question: |-
      Pour corriger un `NoSuchMethodError` sur Guava, un développeur a ajouté une dépendance directe à une troisième
      version, sans regarder l'arbre. Quelle correction est la bonne ?
      ```xml
      <dependency><groupId>com.google.guava</groupId><artifactId>guava</artifactId><version>31.0-jre</version></dependency>
      ```
    choices:
      - {text: "Lire l'arbre avec `-Dverbose`, puis imposer une version compatible dans `dependencyManagement`", correct: true}
      - {text: "Garder la dépendance directe, mais monter sa version à la plus récente publiée", correct: false}
      - {text: "Exclure Guava de toutes les dépendances et ne garder que la version 31.0", correct: false}
      - {text: "Passer la dépendance directe en `runtime`, pour qu'elle gagne à l'exécution", correct: false}
    answer: |-
      ```
      mvn dependency:tree -Dverbose -Dincludes=com.google.guava
      ```
      ```xml
      <dependencyManagement>
        <dependencies>
          <dependency><groupId>com.google.guava</groupId><artifactId>guava</artifactId><version>33.3.1-jre</version></dependency>
        </dependencies>
      </dependencyManagement>
      ```
      On identifie d'abord quelles bibliothèques demandent quelles versions, puis on impose la version compatible avec
      toutes (souvent la plus haute), une seule fois, dans `dependencyManagement`.
  - key: bug-logging-double
    format: bug-fix
    question: |-
      Au démarrage : « SLF4J: Class path contains multiple SLF4J providers ». Une dépendance apporte `slf4j-simple`. Quelle correction est la bonne ?
      ```xml
      <dependency>
        <groupId>com.exemple</groupId>
        <artifactId>client-meteo</artifactId>
      </dependency>
      ```
    choices:
      - {text: "Exclure `slf4j-simple` de la dépendance `client-meteo`", correct: true}
      - {text: "Retirer l'implémentation de journalisation de l'application", correct: false}
      - {text: "Déclarer `client-meteo` en portée `runtime`", correct: false}
      - {text: "Revenir à SLF4J 1.x, qui tolère plusieurs implémentations", correct: false}
    answer: |-
      ```xml
      <dependency>
        <groupId>com.exemple</groupId>
        <artifactId>client-meteo</artifactId>
        <exclusions>
          <exclusion>
            <groupId>org.slf4j</groupId>
            <artifactId>slf4j-simple</artifactId>
          </exclusion>
        </exclusions>
      </dependency>
      ```
      Une bibliothèque ne devrait pas imposer d'implémentation de journalisation. L'exclusion la retire, et
      l'application garde la sienne.
  - key: bug-enforcer-absent
    format: bug-fix
    question: |-
      Les conflits de versions ne sont découverts qu'en production. Quelle protection ajouter au build ?
      ```xml
      <build><plugins><!-- aucun contrôle des dépendances --></plugins></build>
      ```
    choices:
      - {text: "Le plugin enforcer, avec la règle `dependencyConvergence`", correct: true}
      - {text: "Le plugin enforcer, avec la règle `requireJavaVersion`", correct: false}
      - {text: "L'option `-U`, qui force la mise à jour des dépendances", correct: false}
      - {text: "Le plugin Shade, qui fusionne les dépendances en un JAR", correct: false}
    answer: |-
      ```xml
      <plugin>
        <groupId>org.apache.maven.plugins</groupId>
        <artifactId>maven-enforcer-plugin</artifactId>
        <executions>
          <execution>
            <goals><goal>enforce</goal></goals>
            <configuration>
              <rules>
                <dependencyConvergence/>
              </rules>
            </configuration>
          </execution>
        </executions>
      </plugin>
      ```
      La règle fait échouer le build dès que deux chemins mènent à des versions différentes d'une même dépendance.
  - key: definition-bom
    format: definition
    question: "Que désigne un BOM (Bill of Materials) dans Maven ?"
    choices:
      - {text: "Un POM qui fixe un ensemble cohérent de versions, importé par d'autres projets", correct: true}
      - {text: "Un POM parent dont on hérite les plugins et la configuration", correct: false}
      - {text: "L'inventaire des composants livrés, produit pour un audit de sécurité", correct: false}
      - {text: "L'arbre des dépendances du projet, affiché par Maven", correct: false}
    answer: "Bill of Materials : un POM qui fixe un ensemble cohérent de versions, importé en portée `import`. L'inventaire des composants livrés pour un audit s'appelle un SBOM."
  - key: definition-transitive
    format: definition
    question: "Qu'est-ce qu'une dépendance transitive ?"
    choices:
      - {text: "Une dépendance d'une de nos dépendances, ajoutée automatiquement au projet", correct: true}
      - {text: "Une dépendance déclarée directement dans le POM du projet", correct: false}
      - {text: "Une dépendance qui ne sert qu'à l'exécution, en portée `runtime`", correct: false}
      - {text: "Une dépendance partagée entre plusieurs modules du même projet", correct: false}
    answer: Une dépendance d'une de nos dépendances, ajoutée automatiquement au projet.
  - key: definition-nearest-wins
    format: definition
    question: "Que désigne la règle « nearest wins » de Maven ?"
    choices:
      - {text: "En cas de conflit, la version la plus proche du projet dans l'arbre est retenue", correct: true}
      - {text: "En cas de conflit, la version la plus haute des deux est retenue", correct: false}
      - {text: "En cas de conflit, le dépôt le plus proche fournit la dépendance", correct: false}
      - {text: "En cas de conflit, la dernière dépendance déclarée dans le POM gagne", correct: false}
    answer: La règle de Maven qui retient, en cas de conflit, la version la plus proche du projet dans l'arbre des dépendances.
  - key: definition-exclusion
    format: definition
    question: "Que désigne une exclusion, dans Maven ?"
    choices:
      - {text: "La déclaration qui retire une dépendance transitive apportée par une dépendance", correct: true}
      - {text: "La portée qui retire une dépendance du livrable, comme `provided`", correct: false}
      - {text: "La règle qui interdit à un module de dépendre d'un autre module", correct: false}
      - {text: "L'option qui saute un module pendant la construction du projet", correct: false}
    answer: La déclaration qui retire une dépendance transitive apportée par une dépendance.
