notion: maven-transitives
cards:
  - key: maven-resout-conflit-versions
    format: course
    question: Comment Maven résout un conflit de versions ?
    answer: '"Nearest wins", la plus proche dans l''arbre, puis la première déclarée.'
  - key: diagnostiquer-conflit
    format: course
    question: Comment diagnostiquer un conflit ?
    answer: '`mvn dependency:tree`.'
  - key: bom
    format: course
    question: C'est quoi un BOM ?
    answer: 'Un pom importé fixant un ensemble cohérent de versions (ex : spring-boot-dependencies).'
  - key: dependencymanagement-vs-dependencies
    format: course
    question: dependencyManagement vs dependencies ?
    answer: Le premier fixe les versions sans ajouter la dépendance ; le second l'ajoute réellement.
  - key: parent-vs-bom
    format: course
    question: Parent vs BOM ?
    answer: Héritage de configuration et versions (un seul parent) vs import de versions uniquement (plusieurs possibles).
  - key: definition-bom
    format: definition
    question: BOM
    answer: 'Bill of Materials : pom fixant un ensemble cohérent de versions'
