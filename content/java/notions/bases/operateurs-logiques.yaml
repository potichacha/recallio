notion: operateurs-logiques
lesson: |-
  Les opérateurs logiques combinent des booléens :

  | Opérateur | Vrai quand... |
  |---|---|
  | `a && b` | `a` **et** `b` sont vrais |
  | `a \|\| b` | `a` **ou** `b` (au moins l'un) est vrai |
  | `!a` | `a` est faux |

  `&&` et `||` évaluent **en court-circuit** : ils s'arrêtent dès que le résultat est connu.

  ```java
  if (texte != null && texte.length() > 3) { ... }   // si texte est null, length() n'est jamais appelé
  if (stock == 0 || commande.estAnnulee()) { ... }   // si stock vaut 0, on ne regarde pas la suite
  ```

  - L'**ordre compte** : on place d'abord le test qui protège (`texte != null`), puis celui qui en dépend.
  - `&` et `|` existent aussi : ils évaluent **toujours** les deux côtés. On les réserve au calcul bit à bit.
  - `!` passe avant `&&`, qui passe avant `||` : `a || b && c` se lit `a || (b && c)`. Des parenthèses lèvent le doute.
  - Pour inverser une condition (lois de De Morgan) : `!(a && b)` équivaut à `!a || !b`.

  **Piège classique** : `if (age > 18 || age < 65)` pour « entre 18 et 65 ». Tout âge vérifie l'une des deux
  conditions : il faut `&&`.

  **En entretien** : « `&&` et `||` court-circuitent : on s'en sert pour protéger un appel, comme un test de `null`
  avant d'appeler une méthode. »
cards:
  - key: vs
    format: course
    question: '`&&` vs `&` ?'
    answer: '`&&` court-circuite ; `&` évalue toujours les deux opérandes (et sert aussi d''opérateur bit à bit).'
  - key: court-circuit
    format: course
    question: Qu'est-ce que l'évaluation en court-circuit ?
    answer: |-
      `&&` n'évalue pas son côté droit si le gauche est faux, et `||` ne l'évalue pas si le gauche est vrai : le
      résultat est déjà connu.
  - key: proteger-un-appel
    format: course
    question: Pourquoi écrire `texte != null && texte.isEmpty()` dans cet ordre ?
    answer: |-
      Parce que si `texte` est `null`, `&&` s'arrête au premier test : `isEmpty()` n'est jamais appelé, et on évite la
      `NullPointerException`. Dans l'autre ordre, l'appel aurait lieu en premier.
  - key: de-morgan
    format: course
    question: À quoi équivaut `!(a && b)` ?
    answer: 'À `!a || !b` (loi de De Morgan) ; de même, `!(a || b)` équivaut à `!a && !b`.'
  - key: vf-court-circuit-et
    format: true-false
    question: Dans `a && b`, si `a` est faux, `b` n'est pas évalué.
    truth: true
    answer: "Le résultat est forcément faux : `&&` s'arrête."
  - key: vf-ou-exclusif
    format: true-false
    question: "`a || b` est faux quand `a` et `b` sont tous les deux vrais."
    truth: false
    answer: '`||` est un « ou » inclusif : il est vrai dès qu''au moins un côté l''est. Le « ou exclusif » s''écrit `^`.'
  - key: vf-et-simple
    format: true-false
    question: "`a & b`, entre deux booléens, évalue toujours `b`."
    truth: true
    answer: '`&` ne court-circuite pas ; on lui préfère `&&` pour les conditions.'
  - key: vf-priorite
    format: true-false
    question: "`a || b && c` se lit `(a || b) && c`."
    truth: false
    answer: '`&&` passe avant `||` : on lit `a || (b && c)`. Des parenthèses rendent l''intention claire.'
  - key: qcm-protection-null
    format: multiple-choice
    question: Quelle condition ne lève jamais de `NullPointerException` quand `nom` vaut `null` ?
    choices:
      - text: "`nom != null && nom.length() > 0`"
        correct: true
      - text: "`nom.length() > 0 && nom != null`"
        correct: false
      - text: "`nom != null & nom.length() > 0`"
        correct: false
      - text: "`nom.length() > 0 || nom != null`"
        correct: false
    answer: Le test de `null` vient d'abord, avec `&&` pour s'arrêter ; `&` évaluerait quand même `length()`.
  - key: qcm-entre-deux
    format: multiple-choice
    question: Quelle condition est vraie pour un âge entre 18 et 65 ans inclus ?
    choices:
      - text: "`age >= 18 && age <= 65`"
        correct: true
      - text: "`age >= 18 || age <= 65`"
        correct: false
      - text: "`!(age < 18) || !(age > 65)`"
        correct: false
      - text: "`age >= 18 & age <= 65 || true`"
        correct: false
    answer: "Les deux bornes doivent être respectées en même temps : `&&`."
  - key: qcm-inverser
    format: multiple-choice
    question: Quelle expression équivaut à `!(estConnecte && estAdmin)` ?
    choices:
      - text: "`!estConnecte || !estAdmin`"
        correct: true
      - text: "`!estConnecte && !estAdmin`"
        correct: false
      - text: "`estConnecte || estAdmin`"
        correct: false
      - text: "`!estConnecte && estAdmin`"
        correct: false
    answer: 'Loi de De Morgan : la négation d''un « et » est le « ou » des négations.'
  - key: qcm-valeur
    format: multiple-choice
    question: Que vaut `true || false && false` ?
    choices:
      - text: "`true`"
        correct: true
      - text: "`false`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: '`&&` d''abord : `false && false` vaut `false`, puis `true || false` vaut `true`.'
  - key: trous-et
    format: fill-in
    question: |-
      Complétez pour n'accepter que les commandes payées **et** expédiées :
      ```java
      if (payee ___ expediee) {
      }
      ```
    blanks: [["&&"]]
    answer: '`&&` exige que les deux soient vrais.'
  - key: trous-ou
    format: fill-in
    question: |-
      Complétez pour offrir la livraison aux clients premium **ou** aux paniers de plus de 50 € :
      ```java
      boolean livraisonOfferte = estPremium ___ total > 50;
      ```
    blanks: [["||"]]
    answer: '`||` : une seule des deux conditions suffit.'
  - key: trous-non
    format: fill-in
    question: |-
      Complétez pour afficher un message quand la liste n'est **pas** vide :
      ```java
      if (___liste.isEmpty()) {
          System.out.println("Il y a des éléments");
      }
      ```
    blanks: [["!"]]
    answer: '`!` inverse le booléen.'
  - key: trous-protection
    format: fill-in
    question: |-
      Complétez pour ne jamais appeler `length()` sur `null` :
      ```java
      if (texte ___ null && texte.length() > 3) {
      }
      ```
    blanks: [["!="]]
    answer: Si `texte` est `null`, `&&` s'arrête avant d'appeler `length()`.
  - key: code-court-circuit-division
    format: code-output
    question: |-
      ```java
      int x = 0;
      if (x != 0 && 10 / x > 1) {
          System.out.println("grand");
      }
      System.out.println("ok");
      ```
    answer: '`ok` : `x != 0` est faux, donc `10 / x` n''est jamais calculé, et il n''y a pas d''exception.'
    check:
      output: "ok"
  - key: code-ou-court-circuit
    format: code-output
    question: |-
      ```java
      int n = 0;
      boolean b = true || ++n > 0;
      System.out.println(b + " " + n);
      ```
    answer: '`true 0` : `||` s''arrête au premier `true`, et `++n` n''est jamais exécuté.'
    check:
      output: "true 0"
  - key: code-priorite
    format: code-output
    question: |-
      ```java
      System.out.println(!true || false && true);
      ```
    answer: '`false` : `!true` vaut `false`, `false && true` vaut `false`, puis `false || false` vaut `false`.'
    check:
      output: "false"
  - key: code-et-simple
    format: code-output
    question: |-
      ```java
      int n = 0;
      boolean r = (n > 0) & (++n > 0);
      System.out.println(r + " " + n);
      ```
    answer: '`false 1` : `&` évalue les deux côtés, donc `++n` s''exécute même si le premier est faux.'
    check:
      output: "false 1"
  - key: bug-et-simple
    format: bug-fix
    question: |-
      Ce code lève une `ArithmeticException` quand `quantite` vaut 0 :
      ```java
      if (quantite != 0 & total / quantite > 10) {
          System.out.println("Prix unitaire élevé");
      }
      ```
    answer: |-
      ```java
      if (quantite != 0 && total / quantite > 10) {
      ```
      `&` évalue toujours les deux côtés ; `&&` s'arrête si `quantite` vaut 0.
  - key: bug-ou-au-lieu-de-et
    format: bug-fix
    question: |-
      Cette condition « entre 18 et 65 ans » est vraie pour tout le monde :
      ```java
      if (age >= 18 || age <= 65) {
          System.out.println("Éligible");
      }
      ```
    answer: |-
      ```java
      if (age >= 18 && age <= 65) {
      ```
      Tout âge vérifie au moins une des deux conditions ; il faut les deux à la fois.
  - key: bug-ordre-null
    format: bug-fix
    question: |-
      Ce test lève une `NullPointerException` quand `email` vaut `null` :
      ```java
      if (email.contains("@") && email != null) {
          envoyer(email);
      }
      ```
    answer: |-
      ```java
      if (email != null && email.contains("@")) {
      ```
      Le test de `null` doit venir en premier, pour que `&&` s'arrête avant l'appel.
  - key: bug-negation-mal-placee
    format: bug-fix
    question: |-
      Ce code ne compile pas (`bad operand type int for unary operator '!'`) :
      ```java
      if (!x == 5) {
          System.out.println("Ce n'est pas 5");
      }
      ```
    answer: |-
      ```java
      if (x != 5) {
      ```
      `!` s'applique à `x` (un `int`) avant la comparaison. On écrit `x != 5`, ou `!(x == 5)`.
