notion: switch-classique
cards:
  - key: types-switch
    format: course
    question: Sur quels types peut-on faire un switch ?
    answer: Historiquement int (et types plus petits), char, String, enum, wrappers ; depuis Java 21, tout type via le pattern matching.
  - key: code-switch-1-case-1-system
    format: code-output
    question: |-
      ```java
      switch (1) {
          case 1: System.out.print("1");
          case 2: System.out.print("2");
          default: System.out.println("d");
      }
      ```
    answer: '`12d` : sans `break`, l''exécution continue dans les cas suivants (fall-through).'
    check:
      output: "12d"
