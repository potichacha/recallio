notion: switch-classique
lesson: |-
  Le `switch` choisit un bloc selon la **valeur** d'une expression :

  ```java
  switch (jour) {
      case "samedi":
      case "dimanche":
          System.out.println("Week-end");
          break;
      case "lundi":
          System.out.println("Courage");
          break;
      default:
          System.out.println("Semaine");
  }
  ```

  - Il marche sur `int` (et `byte`, `short`, `char`), leurs équivalents objets, les `String` et les `enum`.
  - Les `case` sont des **constantes**, toutes différentes.
  - Sans **`break`**, l'exécution **continue** dans le `case` suivant : c'est le *fall-through*. Utile pour regrouper
    des cas (samedi et dimanche), source de bugs quand on l'oublie.
  - `default` traite toutes les autres valeurs ; on le met en dernier.
  - Avec une `String` ou un `enum` qui vaut `null`, le `switch` classique lève une `NullPointerException`.

  Depuis Java 14, l'**expression** `switch` avec `->` (pas de fall-through, une valeur renvoyée) est préférable ; le
  `switch` classique reste courant dans le code existant.

  **Piège classique** : oublier un `break`. Le `case` suivant s'exécute aussi, sans erreur ni avertissement.

  **En entretien** : « Le `switch` classique tombe d'un `case` à l'autre sans `break` ; pour du code neuf, on préfère le
  `switch` avec flèches, sans fall-through. »
tour:
  - title: Le switch classique
    text: |-
      Le `switch` classique saute au `case` qui correspond à la valeur, puis **continue** dans les cas suivants jusqu'à
      un `break` : c'est le *fall-through*. Oublier un `break` est une erreur classique.

      Depuis Java 14, la forme **flèche**, `case 1 -> …`, ne déborde jamais, et `switch` devient une expression qui
      produit une valeur. On la préfère dans du code nouveau.
    example:
      files:
        Main.java: |-
          void main() {
              int jour = 6;
              switch (jour) {
                  case 6:
                  case 7:
                      IO.println("week-end");
                      break;
                  default:
                      IO.println("semaine");
              }

              String nom = switch (jour) {
                  case 1 -> "lundi";
                  case 6 -> "samedi";
                  default -> "un autre jour";
              };
              IO.println(nom);
          }
      output: |-
        week-end
        samedi
    task:
      instructions: |-
        Ce `switch` oublie un `break` : corrige-le pour qu'il n'affiche que `lundi`.
      starter:
        Main.java: |-
          void main() {
              int jour = 1;
              switch (jour) {
                  case 1:
                      IO.println("lundi");
                  case 2:
                      IO.println("mardi");
                      break;
                  default:
                      IO.println("autre jour");
              }
          }
      solution:
        Main.java: |-
          void main() {
              int jour = 1;
              switch (jour) {
                  case 1:
                      IO.println("lundi");
                      break;
                  case 2:
                      IO.println("mardi");
                      break;
                  default:
                      IO.println("autre jour");
              }
          }
      output: |-
        lundi
cards:
  - key: types-switch
    format: course
    question: Sur quels types peut-on faire un switch ?
    answer: int (et byte, short, char), leurs wrappers, String (Java 7), enum ; et depuis Java 21, n'importe quel type avec le pattern matching.
  - key: fall-through
    format: course
    question: Qu'est-ce que le *fall-through* d'un `switch` ?
    answer: |-
      Sans `break`, l'exécution continue dans le `case` suivant, quelle que soit sa valeur. On s'en sert pour regrouper
      plusieurs valeurs sur le même code ; oublié, c'est un bug.
  - key: role-default
    format: course
    question: À quoi sert `default` dans un `switch` ?
    answer: À traiter toutes les valeurs qu'aucun `case` ne prévoit ; il est facultatif, mais recommandé.
  - key: switch-null
    format: course
    question: Que se passe-t-il si l'on fait un `switch` classique sur une `String` qui vaut `null` ?
    answer: |-
      Une `NullPointerException`. Il faut tester `null` avant ; depuis Java 21, un `switch` avec motifs peut avoir un
      `case null`.
  - key: vf-break-obligatoire
    format: true-false
    question: Sans `break`, un `case` classique ne compile pas.
    truth: false
    answer: "Il compile : l'exécution continue simplement dans le `case` suivant (fall-through)."
  - key: vf-string
    format: true-false
    question: On peut faire un `switch` sur une `String`.
    truth: true
    answer: Depuis Java 7 ; la comparaison se fait avec `equals`.
  - key: vf-case-variable
    format: true-false
    question: Un `case` peut contenir une variable, comme `case seuil:`.
    truth: false
    answer: Un `case` attend une constante connue à la compilation (littéral, constante `final`, valeur d'`enum`).
  - key: vf-default-dernier
    format: true-false
    question: "`default` doit obligatoirement être le dernier `case`."
    truth: false
    answer: Il peut être n'importe où, mais on le met en dernier pour la lisibilité (et attention au fall-through).
  - key: qcm-sortie-fall-through
    format: multiple-choice
    question: "`switch (2) { case 1: print(\"A\"); case 2: print(\"B\"); case 3: print(\"C\"); }` affiche :"
    choices:
      - text: "BC"
        correct: true
      - text: "B"
        correct: false
      - text: "ABC"
        correct: false
      - text: "Rien"
        correct: false
    answer: On entre au `case 2`, puis, sans `break`, on continue dans le `case 3`.
  - key: qcm-types
    format: multiple-choice
    question: Sur quels types un `switch` classique (sans motifs) est-il possible ?
    choices:
      - text: "`int`"
        correct: true
      - text: "`String`"
        correct: true
      - text: "Un `enum`"
        correct: true
      - text: "`double`"
        correct: false
    answer: Pas de `switch` sur `double`, `float`, `long` ni `boolean`.
  - key: qcm-regrouper
    format: multiple-choice
    question: Comment faire exécuter le même code pour « samedi » et « dimanche » dans un `switch` classique ?
    choices:
      - text: "Écrire `case \"samedi\":` puis `case \"dimanche\":` juste au-dessus du code"
        correct: true
      - text: "`case \"samedi\" || \"dimanche\":`"
        correct: false
      - text: "`case \"samedi\" && \"dimanche\":`"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: Deux `case` sans code entre eux partagent le même bloc, grâce au fall-through.
  - key: qcm-oubli-break
    format: multiple-choice
    question: Qu'arrive-t-il quand on oublie le `break` d'un `case` ?
    choices:
      - text: "Le code du `case` suivant s'exécute aussi"
        correct: true
      - text: "Le code ne compile pas"
        correct: false
      - text: "Une exception est levée"
        correct: false
      - text: "Le `switch` recommence"
        correct: false
    answer: "Aucune erreur ni avertissement : c'est ce qui rend l'oubli dangereux."
  - key: trous-break
    format: fill-in
    question: |-
      Complétez pour ne pas tomber dans le `case` suivant :
      ```java
      case 1:
          System.out.println("un");
          ___;
      case 2:
      ```
    blanks: [[break]]
    answer: '`break` sort du `switch`.'
  - key: trous-default
    format: fill-in
    question: |-
      Complétez pour traiter toutes les autres valeurs :
      ```java
      switch (code) {
          case 200: message = "OK"; break;
          case 404: message = "Introuvable"; break;
          ___: message = "Autre";
      }
      ```
    blanks: [[default]]
    answer: '`default` traite les valeurs qu''aucun `case` ne prévoit.'
  - key: trous-case
    format: fill-in
    question: |-
      Complétez :
      ```java
      switch (choix) {
          ___ 'o':
              confirmer();
              break;
      }
      ```
    blanks: [[case]]
    answer: Chaque valeur prévue s'annonce par `case`.
  - key: trous-mot-cle
    format: fill-in
    question: |-
      Complétez :
      ```java
      ___ (jour) {
          case "lundi": System.out.println("Courage"); break;
      }
      ```
    blanks: [[switch]]
    answer: '`switch` évalue l''expression entre parenthèses, puis saute au `case` correspondant.'
  - key: code-switch-1-case-1-system
    format: code-output
    question: |-
      ```java
      switch (1) {
          case 1: System.out.print("1");
          case 2: System.out.print("2");
          default: System.out.println("d");
      }
      ```
    answer: '`12d` : sans `break`, l''exécution continue dans les cas suivants (fall-through).'
    check:
      output: "12d"
  - key: code-avec-break
    format: code-output
    question: |-
      ```java
      int n = 2;
      switch (n) {
          case 1: System.out.println("un"); break;
          case 2: System.out.println("deux"); break;
          default: System.out.println("autre");
      }
      ```
    answer: '`deux` : le `break` arrête l''exécution après le bon `case`.'
    check:
      output: "deux"
  - key: code-regroupement
    format: code-output
    question: |-
      ```java
      String jour = "dimanche";
      switch (jour) {
          case "samedi":
          case "dimanche":
              System.out.println("week-end");
              break;
          default:
              System.out.println("semaine");
      }
      ```
    answer: '`week-end` : `samedi` et `dimanche` partagent le même bloc.'
    check:
      output: "week-end"
  - key: code-switch-null
    format: code-output
    question: |-
      ```java
      String jour = null;
      switch (jour) {
          case "lundi": System.out.println("lundi"); break;
          default: System.out.println("autre");
      }
      ```
    answer: "Une `NullPointerException` : même le `default` ne rattrape pas `null` dans un `switch` classique."
    check:
      throws: NullPointerException
  - key: bug-break-oublie
    format: bug-fix
    question: |-
      Pour une commande « standard », ce code facture aussi l'express :
      ```java
      switch (livraison) {
          case "standard":
              frais = 4.90;
          case "express":
              frais = 9.90;
              break;
      }
      ```
    answer: |-
      ```java
      case "standard":
          frais = 4.90;
          break;
      ```
      Sans `break`, l'exécution continue dans `express`, qui écrase les frais.
  - key: bug-case-variable
    format: bug-fix
    question: |-
      Ce code ne compile pas (`constant expression required`) :
      ```java
      int seuil = 100;
      switch (montant) {
          case seuil: alerter(); break;
      }
      ```
    answer: |-
      ```java
      final int SEUIL = 100;
      switch (montant) {
          case SEUIL: alerter(); break;
      }
      ```
      Un `case` attend une constante. Si le seuil peut varier, un `if (montant == seuil)` convient mieux.
  - key: bug-switch-double
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      double note = 15.5;
      switch (note) {
          case 15.5: System.out.println("Bien"); break;
      }
      ```
    answer: |-
      ```java
      if (note >= 14) {
          System.out.println("Bien");
      }
      ```
      Pas de `switch` sur un `double` ; et pour des intervalles de valeurs, un `if` est de toute façon le bon outil.
  - key: bug-switch-null
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` quand le pays n'est pas renseigné :
      ```java
      switch (pays) {
          case "FR": tva = 0.20; break;
          default: tva = 0.0;
      }
      ```
    answer: |-
      ```java
      if (pays == null) {
          tva = 0.0;
      } else {
          switch (pays) {
              case "FR": tva = 0.20; break;
              default: tva = 0.0;
          }
      }
      ```
      Le `switch` classique ne tolère pas `null`, même avec un `default` : il faut le tester avant.
