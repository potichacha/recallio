notion: char-unicode
lesson: |-
  Un `char` est un entier **non signé sur 16 bits** (0 à 65 535) : une **unité de code UTF-16**, pas forcément un
  caractère entier.

  - Les caractères courants (lettres, chiffres, la plupart des alphabets) tiennent dans un `char` : `'A'` vaut 65,
    `'é'` vaut 233.
  - Les caractères au-delà de U+FFFF (émojis, certains idéogrammes) occupent **deux `char`** : une **paire de
    substitution** (*surrogate pair*). Leur valeur Unicode complète est un **point de code** (`int`).

  ```java
  String s = "😀";
  s.length();                       // 2 : deux unités UTF-16
  s.codePointCount(0, s.length());  // 1 : un seul caractère
  s.codePointAt(0);                 // 128512 (U+1F600)
  ```

  - Un `char` se manipule comme un nombre : `'a' + 1` vaut 98, `c++` passe à la lettre suivante.
  - `Character` offre les tests et conversions : `isLetter`, `isDigit`, `toUpperCase`, `getNumericValue`... Leurs
    versions à `int` gèrent tous les points de code.
  - `'A'` écrit un caractère par son code (ici `A`).

  **Piège classique** : couper une chaîne avec `substring(0, n)` ou la parcourir `char` par `char` : un émoji peut être
  coupé en deux. On travaille alors sur les points de code (`codePoints()`, `offsetByCodePoints`).

  **En entretien** : « Un `char` est une unité UTF-16, pas un caractère : `length()` compte les unités, `codePointCount`
  les caractères. »
cards:
  - key: length-vaut-2
    format: course
    question: Pourquoi `"😀".length()` vaut 2 ?
    answer: Le caractère est hors du plan de base et occupe une paire de substitution UTF-16.
  - key: taille-char
    format: course
    question: Qu'est-ce qu'un `char` en Java ?
    answer: Un entier non signé sur 16 bits (0 à 65 535), qui représente une unité de code UTF-16.
  - key: point-de-code
    format: course
    question: Qu'est-ce qu'un point de code ?
    answer: Le numéro Unicode d'un caractère (un `int`, par exemple U+1F600). Au-delà de U+FFFF, il faut deux `char` pour le représenter.
  - key: compter-caracteres
    format: course
    question: Comment compter les caractères réels d'une chaîne qui peut contenir des émojis ?
    answer: '`s.codePointCount(0, s.length())` ou `s.codePoints().count()` ; `length()` compte les unités UTF-16.'
  - key: vf-16-bits
    format: true-false
    question: Un `char` est un entier non signé sur 16 bits.
    truth: true
    answer: Il va de 0 à 65 535.
  - key: vf-tout-unicode
    format: true-false
    question: Un `char` peut contenir n'importe quel caractère Unicode.
    truth: false
    answer: Les caractères au-delà de U+FFFF, comme les émojis, demandent deux `char`.
  - key: vf-majuscules
    format: true-false
    question: "`'A' < 'a'` est vrai."
    truth: true
    answer: "Les codes sont comparés : 65 < 97."
  - key: vf-negatif
    format: true-false
    question: "`char c = -1;` compile."
    truth: false
    answer: "Un `char` n'est jamais négatif : la constante -1 est hors de sa plage."
  - key: qcm-plage
    format: multiple-choice
    question: Quelle est la plage d'un `char` ?
    choices:
      - text: "0 à 65 535"
        correct: true
      - text: "-128 à 127"
        correct: false
      - text: "-32 768 à 32 767"
        correct: false
      - text: "0 à 255"
        correct: false
    answer: 16 bits non signés ; -128 à 127 est la plage d'un `byte`.
  - key: qcm-compter
    format: multiple-choice
    question: Quelles expressions comptent les caractères réels de `s`, émojis compris ?
    choices:
      - text: "`s.codePointCount(0, s.length())`"
        correct: true
      - text: "`s.codePoints().count()`"
        correct: true
      - text: "`s.length()`"
        correct: false
      - text: "`s.toCharArray().length`"
        correct: false
    answer: '`length()` et `toCharArray()` comptent les unités UTF-16.'
  - key: qcm-valeur
    format: multiple-choice
    question: Que vaut `(int) 'a'` ?
    choices:
      - text: "97"
        correct: true
      - text: "65"
        correct: false
      - text: "1"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Le code de `a` est 97 ; celui de `A` est 65.
  - key: qcm-chiffre
    format: multiple-choice
    question: Quelle expression convertit le caractère `'7'` en l'entier 7 ?
    choices:
      - text: "`Character.getNumericValue('7')`"
        correct: true
      - text: "`'7' - '0'`"
        correct: true
      - text: "`(int) '7'`"
        correct: false
      - text: "`Integer.parseInt('7')`"
        correct: false
    answer: '`(int) ''7''` donne son code (55) ; `parseInt` attend une `String`, pas un `char`.'
  - key: code-emoji
    format: code-output
    question: |-
      ```java
      String s = "😀";
      System.out.println(s.length() + " " + s.codePointCount(0, s.length()));
      ```
    answer: '`2 1` : deux unités UTF-16 pour un seul caractère.'
    check:
      output: "2 1"
  - key: code-increment
    format: code-output
    question: |-
      ```java
      char c = 'A';
      c++;
      System.out.println(c);
      ```
    answer: '`B` : `++` augmente le code et garde le type `char`.'
    check:
      output: "B"
  - key: code-code-a
    format: code-output
    question: |-
      ```java
      System.out.println((int) 'a' + " " + (char) 66);
      ```
    answer: '`97 B` : un `char` et un `int` se convertissent l''un en l''autre par un cast.'
    check:
      output: "97 B"
  - key: code-chiffre
    format: code-output
    question: |-
      ```java
      char c = '7';
      System.out.println(Character.isDigit(c) + " " + (c - '0'));
      ```
    answer: '`true 7` : les chiffres se suivent dans la table, `''7'' - ''0''` vaut 7.'
    check:
      output: "true 7"
  - key: bug-substring-emoji
    format: bug-fix
    question: |-
      Ce résumé affiche parfois un caractère cassé à la fin quand le texte contient des émojis :
      ```java
      String resume = texte.substring(0, 20);
      ```
    answer: |-
      ```java
      int fin = texte.offsetByCodePoints(0, Math.min(20, texte.codePointCount(0, texte.length())));
      String resume = texte.substring(0, fin);
      ```
      `substring` coupe en unités UTF-16 et peut séparer les deux moitiés d'un émoji ; on compte en points de code.
  - key: bug-longueur-pseudo
    format: bug-fix
    question: |-
      Un pseudo de 10 émojis est refusé comme « trop long (20 caractères max) » alors qu'il n'en fait que 10 :
      ```java
      if (pseudo.length() > 20) {
          refuser();
      }
      ```
    answer: |-
      ```java
      if (pseudo.codePointCount(0, pseudo.length()) > 20) {
          refuser();
      }
      ```
      `length()` compte deux unités par émoji ; `codePointCount` compte les caractères.
  - key: bug-majuscule-manuelle
    format: bug-fix
    question: |-
      Cette mise en majuscule transforme `é` en un caractère inattendu :
      ```java
      char majuscule = (char) (c - 32);
      ```
    answer: |-
      ```java
      char majuscule = Character.toUpperCase(c);
      ```
      L'écart de 32 ne vaut que pour l'ASCII ; `Character.toUpperCase` connaît les règles d'Unicode.
  - key: bug-chiffre-code
    format: bug-fix
    question: |-
      La somme des chiffres de `"123"` donne 150 au lieu de 6 :
      ```java
      int somme = 0;
      for (char c : "123".toCharArray()) {
          somme += c;
      }
      ```
    answer: |-
      ```java
      for (char c : "123".toCharArray()) {
          somme += c - '0';
      }
      ```
      Un `char` ajouté à un `int` apporte son code (49, 50, 51) ; `c - '0'` ou `Character.getNumericValue(c)` donne
      la valeur du chiffre.
