notion: char-unicode
lesson: |-
  Un `char` est un entier **non signé sur 16 bits** (0 à 65 535) : une **unité de code UTF-16**, pas forcément un
  caractère entier.

  - Les caractères courants (lettres, chiffres, la plupart des alphabets) tiennent dans un `char` : `'A'` vaut 65,
    `'é'` vaut 233.
  - Les caractères au-delà de U+FFFF (émojis, certains idéogrammes) occupent **deux `char`** : une **paire de
    substitution** (*surrogate pair*). Leur valeur Unicode complète est un **point de code** (`int`).

  ```java
  String s = "😀";
  s.length();                       // 2 : deux unités UTF-16
  s.codePointCount(0, s.length());  // 1 : un seul caractère
  s.codePointAt(0);                 // 128512 (U+1F600)
  ```

  - Un `char` se manipule comme un nombre : `'a' + 1` vaut 98, `c++` passe à la lettre suivante.
  - `Character` offre les tests et conversions : `isLetter`, `isDigit`, `toUpperCase`, `getNumericValue`... Leurs
    versions à `int` gèrent tous les points de code.
  - `'A'` écrit un caractère par son code (ici `A`).

  **Piège classique** : couper une chaîne avec `substring(0, n)` ou la parcourir `char` par `char` : un émoji peut être
  coupé en deux. On travaille alors sur les points de code (`codePoints()`, `offsetByCodePoints`).

  **En entretien** : « Un `char` est une unité UTF-16, pas un caractère : `length()` compte les unités, `codePointCount`
  les caractères. »
cards:
  - key: length-vaut-2
    format: course
    question: "Pourquoi `\"😀\".length()` vaut-il 2 ?"
    choices:
      - {text: "L'émoji est hors du plan de base : il occupe deux `char`, une paire de substitution", correct: true}
      - {text: "`length()` compte les octets, et l'émoji en occupe deux en UTF-8", correct: false}
      - {text: "`length()` compte aussi le caractère de fin de chaîne, comme en C", correct: false}
      - {text: "L'émoji est formé de deux caractères : le visage et sa couleur", correct: false}
    answer: "Le caractère est hors du plan de base (au-delà de U+FFFF) et occupe une paire de substitution UTF-16 : deux `char`. `length()` compte ces unités, pas les octets ni les caractères."
  - key: taille-char
    format: course
    question: "Qu'est-ce qu'un `char` en Java ?"
    choices:
      - {text: "Un entier non signé sur 16 bits : une unité de code UTF-16", correct: true}
      - {text: "Un entier signé sur 8 bits : un caractère ASCII, comme en C", correct: false}
      - {text: "Un caractère Unicode complet, émojis compris, sur 32 bits", correct: false}
      - {text: "Une chaîne d'un seul caractère, un objet comme `String`", correct: false}
    answer: "Un entier non signé sur 16 bits (0 à 65 535), qui représente une unité de code UTF-16. Un émoji en demande deux."
  - key: point-de-code
    format: course
    question: "Qu'est-ce qu'un point de code ?"
    choices:
      - {text: "Le numéro Unicode d'un caractère, comme U+1F600 ; au-delà de U+FFFF, il prend deux `char`", correct: true}
      - {text: "Une unité de 16 bits de l'encodage UTF-16 : exactement un `char`, quel que soit le caractère", correct: false}
      - {text: "Un octet d'un caractère encodé en UTF-8 ; un émoji en compte quatre, un `é` deux", correct: false}
      - {text: "La position d'un caractère dans une chaîne, celle que renvoie `indexOf`", correct: false}
    answer: "Le numéro Unicode d'un caractère (un `int`, par exemple U+1F600). Au-delà de U+FFFF, il faut deux `char` pour le représenter : point de code et unité UTF-16 ne coïncident que dans le plan de base."
  - key: compter-caracteres
    format: course
    question: "Comment compter les caractères réels d'une chaîne `s` qui peut contenir des émojis ?"
    choices:
      - {text: "`s.codePointCount(0, s.length())`", correct: true}
      - {text: "`s.length()`", correct: false}
      - {text: "`s.toCharArray().length`", correct: false}
      - {text: "`s.getBytes().length`", correct: false}
    answer: "`s.codePointCount(0, s.length())` (ou `s.codePoints().count()`) compte les points de code ; `length()` et `toCharArray()` comptent les unités UTF-16, `getBytes()` les octets."
  - key: vf-16-bits
    format: true-false
    question: Un `char` est un entier non signé sur 16 bits.
    truth: true
    answer: Il va de 0 à 65 535.
  - key: vf-tout-unicode
    format: true-false
    question: Un `char` peut contenir n'importe quel caractère Unicode.
    truth: false
    answer: Les caractères au-delà de U+FFFF, comme les émojis, demandent deux `char`.
  - key: vf-majuscules
    format: true-false
    question: "`'A' < 'a'` est vrai."
    truth: true
    answer: "Les codes sont comparés : 65 < 97."
  - key: vf-negatif
    format: true-false
    question: "`char c = -1;` compile."
    truth: false
    answer: "Un `char` n'est jamais négatif : la constante -1 est hors de sa plage."
  - key: qcm-plage
    format: multiple-choice
    question: Quelle est la plage d'un `char` ?
    choices:
      - text: "0 à 65 535"
        correct: true
      - text: "-128 à 127"
        correct: false
      - text: "-32 768 à 32 767"
        correct: false
      - text: "0 à 255"
        correct: false
    answer: 16 bits non signés ; -128 à 127 est la plage d'un `byte`.
  - key: qcm-compter
    format: multiple-choice
    question: Quelles expressions comptent les caractères réels de `s`, émojis compris ?
    choices:
      - text: "`s.codePointCount(0, s.length())`"
        correct: true
      - text: "`s.codePoints().count()`"
        correct: true
      - text: "`s.length()`"
        correct: false
      - text: "`s.toCharArray().length`"
        correct: false
    answer: '`length()` et `toCharArray()` comptent les unités UTF-16.'
  - key: qcm-valeur
    format: multiple-choice
    question: Que vaut `(int) 'a'` ?
    choices:
      - text: "97"
        correct: true
      - text: "65"
        correct: false
      - text: "1"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Le code de `a` est 97 ; celui de `A` est 65.
  - key: qcm-chiffre
    format: multiple-choice
    question: Quelle expression convertit le caractère `'7'` en l'entier 7 ?
    choices:
      - {text: "`'7' - '0'`", correct: true}
      - {text: "`(int) '7'`", correct: false}
      - {text: "`Integer.parseInt('7')`", correct: false}
      - {text: "`Integer.valueOf('7')`", correct: false}
    answer: "`'7' - '0'` vaut 7 : les chiffres se suivent dans la table (`Character.getNumericValue('7')` marche aussi). `(int) '7'` et `Integer.valueOf('7')` donnent son code (55) ; `parseInt` attend une `String`, pas un `char`."
  - key: code-emoji
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = "😀";
      System.out.println(s.length() + " " + s.codePointCount(0, s.length()));
      ```
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`4 1`", correct: false}
    answer: "`2 1` : deux unités UTF-16 (`length()`) pour un seul point de code."
    check:
      output: "2 1"
  - key: code-increment
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      char c = 'A';
      c++;
      System.out.println(c);
      ```
    choices:
      - {text: "`B`", correct: true}
      - {text: "`66`", correct: false}
      - {text: "`A`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`B` : `++` augmente le code et garde le type `char`, donc `println` affiche un caractère, pas `66`."
    check:
      output: "B"
  - key: code-code-a
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println((int) 'a' + " " + (char) 66);
      ```
    choices:
      - {text: "`97 B`", correct: true}
      - {text: "`65 B`", correct: false}
      - {text: "`97 66`", correct: false}
      - {text: "`a B`", correct: false}
    answer: "`97 B` : un `char` et un `int` se convertissent l'un en l'autre par un cast. `65` est le code de `'A'` majuscule."
    check:
      output: "97 B"
  - key: code-chiffre
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      char c = '7';
      System.out.println(Character.isDigit(c) + " " + (c - '0'));
      ```
    choices:
      - {text: "`true 7`", correct: true}
      - {text: "`true 55`", correct: false}
      - {text: "`false 7`", correct: false}
      - {text: "`1 7`", correct: false}
    answer: "`true 7` : les chiffres se suivent dans la table, `'7' - '0'` vaut 7. `55` est le code de `'7'`."
    check:
      output: "true 7"
  - key: bug-substring-emoji
    format: bug-fix
    question: |-
      Ce résumé affiche parfois un caractère cassé à la fin quand le texte contient des émojis. Pourquoi ?
      ```java
      String resume = texte.substring(0, 20);
      ```
    choices:
      - {text: "`substring` coupe en unités UTF-16 et peut séparer les deux moitiés d'un émoji", correct: true}
      - {text: "`substring` coupe en octets UTF-8, et un émoji en occupe quatre", correct: false}
      - {text: "La console ne sait pas afficher un émoji en fin de ligne", correct: false}
      - {text: "`substring(0, 20)` coupe le 20e caractère, qui reste à moitié affiché", correct: false}
    answer: |-
      ```java
      int fin = texte.offsetByCodePoints(0, Math.min(20, texte.codePointCount(0, texte.length())));
      String resume = texte.substring(0, fin);
      ```
      `substring` coupe en unités UTF-16 et peut séparer les deux moitiés d'un émoji ; on compte en points de code.
  - key: bug-longueur-pseudo
    format: bug-fix
    question: |-
      Un pseudo de 10 émojis est refusé comme « trop long (20 caractères max) » alors qu'il n'en fait que 10. Quelle correction est la bonne ?
      ```java
      if (pseudo.length() > 20) {
          refuser();
      }
      ```
    choices:
      - {text: "`if (pseudo.codePointCount(0, pseudo.length()) > 20)`", correct: true}
      - {text: "`if (pseudo.length() / 2 > 20)`", correct: false}
      - {text: "`if (pseudo.getBytes().length > 20)`", correct: false}
      - {text: "`if (pseudo.toCharArray().length > 20)`", correct: false}
    answer: |-
      ```java
      if (pseudo.codePointCount(0, pseudo.length()) > 20) {
          refuser();
      }
      ```
      `length()` compte deux unités par émoji ; `codePointCount` compte les caractères. Diviser par 2 fausserait la longueur d'un pseudo sans émoji.
  - key: bug-majuscule-manuelle
    format: bug-fix
    question: |-
      Cette mise en majuscule transforme `é` en un caractère inattendu. Quelle correction est la bonne ?
      ```java
      char majuscule = (char) (c - 32);
      ```
    choices:
      - {text: "`char majuscule = Character.toUpperCase(c);`", correct: true}
      - {text: "`char majuscule = (char) (c + 32);`", correct: false}
      - {text: "`char majuscule = (char) (c - 'a' + 'A');`", correct: false}
      - {text: "`char majuscule = (char) (c & 0x5F);`", correct: false}
    answer: |-
      ```java
      char majuscule = Character.toUpperCase(c);
      ```
      L'écart de 32 ne vaut que pour l'ASCII, quelle que soit la façon de l'écrire ; `Character.toUpperCase` connaît les règles d'Unicode.
  - key: bug-chiffre-code
    format: bug-fix
    question: |-
      La somme des chiffres de `"123"` donne 150 au lieu de 6. Quelle correction est la bonne ?
      ```java
      int somme = 0;
      for (char c : "123".toCharArray()) {
          somme += c;
      }
      ```
    choices:
      - {text: "`somme += c - '0';`", correct: true}
      - {text: "`somme += (int) c;`", correct: false}
      - {text: "`somme += Integer.valueOf(c);`", correct: false}
      - {text: "`somme += (char) c;`", correct: false}
    answer: |-
      ```java
      for (char c : "123".toCharArray()) {
          somme += c - '0';
      }
      ```
      Un `char` ajouté à un `int` apporte son code (49, 50, 51), cast ou pas ; `c - '0'` ou `Character.getNumericValue(c)` donne la valeur du chiffre.
