notion: break-continue-etiquettes
lesson: |-
  Deux instructions changent le cours d'une boucle :

  - **`break`** sort **immédiatement** de la boucle ;
  - **`continue`** abandonne le tour en cours et passe **au tour suivant**.

  ```java
  for (int n : nombres) {
      if (n < 0) {
          continue;            // on ignore les négatifs
      }
      if (n == 0) {
          break;               // 0 marque la fin des données
      }
      System.out.println(n);
  }
  ```

  Dans des boucles **imbriquées**, `break` ne sort que de la boucle **la plus intérieure**. Une **étiquette** permet de
  sortir des deux d'un coup :

  ```java
  recherche:
  for (int[] ligne : grille) {
      for (int case_ : ligne) {
          if (case_ == cible) {
              break recherche;   // sort des deux boucles
          }
      }
  }
  ```

  Les étiquettes sont rares et peu lisibles : on préfère souvent extraire la recherche dans une méthode et faire un
  `return`.

  **Piège classique** : un `continue` dans un `while` placé **avant** l'incrément. Le tour suivant retrouve la même
  valeur, et la boucle ne s'arrête plus.

  **En entretien** : « `break` sort de la boucle, `continue` passe au tour suivant ; pour sortir de plusieurs boucles,
  une méthode avec `return` vaut mieux qu'une étiquette. »
cards:
  - key: sortir-deux-boucles-imbriquees-coup
    format: course
    question: Comment sortir de deux boucles imbriquées d'un coup ?
    answer: Avec un break étiqueté (break label), ou en extrayant une méthode avec return.
  - key: break-vs-continue
    format: course
    question: Quelle différence entre `break` et `continue` ?
    answer: '`break` quitte la boucle ; `continue` saute la fin du tour en cours et passe au suivant.'
  - key: break-interieur
    format: course
    question: Dans deux boucles imbriquées, de quelle boucle sort un `break` simple ?
    answer: De la boucle la plus intérieure seulement ; la boucle extérieure continue.
  - key: preferer-methode
    format: course
    question: Pourquoi préférer une méthode avec `return` à un `break` étiqueté ?
    answer: |-
      Une méthode nommée (`trouverPosition`) dit ce que fait la recherche, et `return` en sort de toute façon, quel que
      soit le nombre de boucles. Les étiquettes sont rares et rendent le flot plus difficile à suivre.
  - key: vf-break-sort
    format: true-false
    question: "`break` sort immédiatement de la boucle."
    truth: true
    answer: L'exécution reprend après la boucle.
  - key: vf-continue-arrete
    format: true-false
    question: "`continue` arrête la boucle."
    truth: false
    answer: Il passe au tour suivant ; c'est `break` qui arrête.
  - key: vf-break-imbrique
    format: true-false
    question: Un `break` simple dans une boucle imbriquée sort de toutes les boucles.
    truth: false
    answer: Seulement de la plus intérieure ; il faut une étiquette (ou un `return`) pour les autres.
  - key: vf-break-switch
    format: true-false
    question: "`break` sert aussi à sortir d'un `switch` classique."
    truth: true
    answer: C'est lui qui évite le fall-through d'un `case` au suivant.
  - key: qcm-sortie-continue
    format: multiple-choice
    question: "Qu'affiche `for (int i = 0; i < 5; i++) { if (i == 2) continue; System.out.print(i); }` ?"
    choices:
      - text: "0134"
        correct: true
      - text: "01"
        correct: false
      - text: "01234"
        correct: false
      - text: "234"
        correct: false
    answer: Le tour `i == 2` est sauté, les autres s'affichent.
  - key: qcm-sortie-break
    format: multiple-choice
    question: "Qu'affiche `for (int i = 0; i < 5; i++) { if (i == 2) break; System.out.print(i); }` ?"
    choices:
      - text: "01"
        correct: true
      - text: "0134"
        correct: false
      - text: "012"
        correct: false
      - text: "Rien"
        correct: false
    answer: La boucle s'arrête dès que `i` vaut 2, avant de l'afficher.
  - key: qcm-sortir-deux
    format: multiple-choice
    question: Comment sortir de deux boucles imbriquées dès qu'on trouve la cible ?
    choices:
      - text: "Un `break` étiqueté"
        correct: true
      - text: "Une méthode qui fait `return`"
        correct: true
      - text: "Un `break` simple"
        correct: false
      - text: "Un `continue`"
        correct: false
    answer: Un `break` simple ne sort que d'une boucle ; `return` sort de toute la méthode.
  - key: qcm-premier-trouve
    format: multiple-choice
    question: On cherche le premier nombre négatif d'un tableau. Que faire une fois trouvé ?
    choices:
      - text: "`break`, pour arrêter de parcourir"
        correct: true
      - text: "`continue`, pour passer au suivant"
        correct: false
      - text: "Rien, la boucle continue"
        correct: false
      - text: "Relancer la boucle"
        correct: false
    answer: "Inutile de parcourir le reste : `break` arrête la recherche."
  - key: trous-sauter
    format: fill-in
    question: |-
      Complétez pour ignorer les lignes vides :
      ```java
      for (String ligne : lignes) {
          if (ligne.isBlank()) {
              ___;
          }
          traiter(ligne);
      }
      ```
    blanks: [[continue]]
    answer: '`continue` passe à la ligne suivante sans traiter la ligne vide.'
  - key: trous-arreter
    format: fill-in
    question: |-
      Complétez pour arrêter au mot « FIN » :
      ```java
      for (String mot : mots) {
          if (mot.equals("FIN")) {
              ___;
          }
          System.out.println(mot);
      }
      ```
    blanks: [[break]]
    answer: '`break` quitte la boucle.'
  - key: trous-etiquette
    format: fill-in
    question: |-
      Complétez pour sortir des deux boucles :
      ```java
      recherche:
      for (int[] ligne : grille) {
          for (int valeur : ligne) {
              if (valeur == cible) {
                  break ___;
              }
          }
      }
      ```
    blanks: [[recherche]]
    answer: '`break` suivi de l''étiquette sort de la boucle qu''elle nomme.'
  - key: trous-return
    format: fill-in
    question: |-
      Complétez pour renvoyer l'indice du premier négatif, ou -1 :
      ```java
      int premierNegatif(int[] t) {
          for (int i = 0; i < t.length; i++) {
              if (t[i] < 0) {
                  ___ i;
              }
          }
          return -1;
      }
      ```
    blanks: [[return]]
    answer: '`return` sort de la boucle et de la méthode à la fois.'
  - key: code-continue
    format: code-output
    question: |-
      ```java
      for (int i = 1; i <= 5; i++) {
          if (i % 2 == 0) {
              continue;
          }
          System.out.print(i);
      }
      ```
    answer: '`135` : les nombres pairs sont sautés.'
    check:
      output: "135"
  - key: code-break
    format: code-output
    question: |-
      ```java
      int[] t = {3, 7, -1, 4};
      int somme = 0;
      for (int x : t) {
          if (x < 0) {
              break;
          }
          somme += x;
      }
      System.out.println(somme);
      ```
    answer: '`10` : on additionne 3 et 7, puis on s''arrête au premier négatif.'
    check:
      output: "10"
  - key: code-break-interieur
    format: code-output
    question: |-
      ```java
      for (int i = 0; i < 2; i++) {
          for (int j = 0; j < 3; j++) {
              if (j == 1) {
                  break;
              }
              System.out.print(i + "" + j + " ");
          }
      }
      ```
    answer: '`00 10 ` : le `break` ne sort que de la boucle sur `j` ; la boucle sur `i` continue.'
    check:
      output: "00 10"
  - key: code-etiquette
    format: code-output
    question: |-
      ```java
      exterieure:
      for (int i = 0; i < 3; i++) {
          for (int j = 0; j < 3; j++) {
              if (i * j == 2) {
                  break exterieure;
              }
              System.out.print(i + "" + j + " ");
          }
      }
      ```
    answer: '`00 01 02 10 11 ` : à `i = 1, j = 2`, le produit vaut 2 et l''on sort des deux boucles.'
    check:
      code: |-
        void run() {
            exterieure:
            for (int i = 0; i < 3; i++) {
                for (int j = 0; j < 3; j++) {
                    if (i * j == 2) {
                        break exterieure;
                    }
                    System.out.print(i + "" + j + " ");
                }
            }
        }
        run();
      output: "00 01 02 10 11"
  - key: bug-continue-avant-increment
    format: bug-fix
    question: |-
      Cette boucle ne s'arrête jamais dès qu'elle rencontre une valeur négative :
      ```java
      int i = 0;
      while (i < valeurs.length) {
          if (valeurs[i] < 0) {
              continue;
          }
          total += valeurs[i];
          i++;
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < valeurs.length; i++) {
          if (valeurs[i] < 0) {
              continue;
          }
          total += valeurs[i];
      }
      ```
      Le `continue` sautait l'incrément : `i` restait sur la valeur négative. Dans un `for`, la mise à jour a lieu même
      après un `continue`.
  - key: bug-break-insuffisant
    format: bug-fix
    question: |-
      Une fois la cible trouvée, la recherche continue dans les lignes suivantes :
      ```java
      for (int[] ligne : grille) {
          for (int valeur : ligne) {
              if (valeur == cible) {
                  trouve = true;
                  break;
              }
          }
      }
      ```
    answer: |-
      ```java
      boolean contient(int[][] grille, int cible) {
          for (int[] ligne : grille) {
              for (int valeur : ligne) {
                  if (valeur == cible) {
                      return true;
                  }
              }
          }
          return false;
      }
      ```
      Le `break` ne sortait que de la boucle intérieure. Une méthode avec `return` sort de tout (une étiquette le ferait
      aussi).
  - key: bug-break-au-lieu-de-continue
    format: bug-fix
    question: |-
      On veut ignorer les articles en rupture, mais le total s'arrête au premier d'entre eux :
      ```java
      for (Article a : panier) {
          if (a.enRupture()) {
              break;
          }
          total += a.prix();
      }
      ```
    answer: |-
      ```java
      if (a.enRupture()) {
          continue;
      }
      ```
      `break` arrête toute la boucle ; `continue` saute seulement cet article.
  - key: bug-continue-hors-boucle
    format: bug-fix
    question: |-
      Ce code ne compile pas (`continue outside of loop`) :
      ```java
      if (commande.estVide()) {
          continue;
      }
      expedier(commande);
      ```
    answer: |-
      ```java
      if (!commande.estVide()) {
          expedier(commande);
      }
      ```
      `continue` n'a de sens que dans une boucle ; ailleurs, on inverse la condition (ou on sort de la méthode avec
      `return`).
