notion: conventions-nommage
lesson: |-
  Le compilateur accepte presque n'importe quel nom ; les **conventions** rendent le code lisible par tous les
  développeurs Java :

  | Élément | Convention | Exemple |
  |---|---|---|
  | Classe, interface, record, enum | `PascalCase` (un nom) | `CommandeClient` |
  | Méthode | `camelCase` (souvent un verbe) | `calculerTotal()` |
  | Variable, paramètre, champ | `camelCase` | `montantTotal` |
  | Constante (`static final`) | `MAJUSCULES_SOULIGNÉES` | `TAUX_TVA` |
  | Package | minuscules, nom de domaine inversé | `fr.recallio.caisse` |

  - Un booléen se lit comme une question : `estValide`, `aDesErreurs`, ou `isValid` en anglais.
  - Pas de préfixes hérités d'autres langages (`m_nom`, `strNom`) ni d'abréviations obscures (`cmdCl`).
  - Java distingue majuscules et minuscules : `total` et `Total` sont deux noms différents.

  **Piège classique** : une classe en minuscules (`class commande`) ou une constante en camelCase (`tauxTva`). Ça
  compile, mais tout lecteur Java est induit en erreur.

  **En entretien** : « PascalCase pour les types, camelCase pour les méthodes et les variables, majuscules pour les
  constantes, minuscules pour les packages. »
tour:
  - title: Les conventions de nommage
    text: |-
      Java a des conventions que tout le monde suit :

      - les classes, interfaces, enums et records en `PascalCase` : `CompteBancaire` ;
      - les méthodes et les variables en `camelCase` : `soldeActuel`, `calculeInterets()` ;
      - les constantes (`static final`) en majuscules séparées par des `_` : `TAUX_MAXIMUM` ;
      - les packages en minuscules, à l'envers d'un nom de domaine : `fr.recallio.revision`.

      Les noms sont explicites : `nombreDeCartes` plutôt que `n`, sauf pour un indice de boucle.
    example:
      files:
        Main.java: |-
          static final double TAUX_MAXIMUM = 0.05;

          record CompteBancaire(String titulaire, double solde) {
              double calculeInterets() {
                  return solde * TAUX_MAXIMUM;
              }
          }

          void main() {
              CompteBancaire compte = new CompteBancaire("Ada", 1000);
              IO.println(compte.titulaire() + " : " + compte.calculeInterets());
          }
      output: |-
        Ada : 50.0
cards:
  - key: convention-classe
    format: course
    question: Comment nomme-t-on une classe en Java ?
    choices:
      - text: "En majuscules, comme `COMMANDE_CLIENT`"
        correct: false
      - text: "En minuscules, comme `commandeclient`"
        correct: false
      - text: "En `camelCase`, avec un verbe, comme `traiterCommande`"
        correct: false
      - text: "En `PascalCase`, avec un nom, comme `CommandeClient`"
        correct: true
    answer: En `PascalCase`, avec un nom (et non un verbe) qui décrit ce qu'elle représente, comme `CommandeClient`.
  - key: convention-constante
    format: course
    question: Comment nomme-t-on une constante (`static final`) ?
    choices:
      - text: "En `PascalCase` : `TauxTva`"
        correct: false
      - text: "En `camelCase` : `tauxTva`"
        correct: false
      - text: "En majuscules, mots séparés par des soulignés : `TAUX_TVA`"
        correct: true
      - text: "Avec le préfixe `k` : `kTauxTva`"
        correct: false
    answer: En majuscules, les mots séparés par des soulignés, comme `TAUX_TVA` ou `NOMBRE_MAX_ESSAIS`.
  - key: convention-package
    format: course
    question: Comment nomme-t-on un package ?
    choices:
      - text: "Avec des soulignés : `fr_recallio_caisse`"
        correct: false
      - text: "En `PascalCase` : `Fr.Recallio.Caisse`"
        correct: false
      - text: "En minuscules, à partir d'un nom de domaine inversé : `fr.recallio.caisse`"
        correct: true
      - text: "En majuscules : `FR.RECALLIO.CAISSE`"
        correct: false
    answer: En minuscules, à partir d'un nom de domaine inversé, comme `fr.recallio.caisse`.
  - key: convention-booleen
    format: course
    question: Comment nommer une variable booléenne lisiblement ?
    choices:
      - text: "Avec une seule lettre : `b`, `f`"
        correct: false
      - text: "Avec un préfixe de type : `bValide`, `flgErreurs`"
        correct: false
      - text: "Comme une question dont la réponse est oui ou non : `estValide`, `aDesErreurs`"
        correct: true
      - text: "Avec un verbe à l'infinitif : `valider`, `verifier`"
        correct: false
    answer: Comme une question dont la réponse est oui ou non, par exemple `estValide`, `aDesErreurs` ou `isEmpty`.
  - key: vf-camelcase-methodes
    format: true-false
    question: Les méthodes et les variables s'écrivent en `camelCase`.
    truth: true
    answer: Par exemple `calculerTotal()` et `montantTotal`.
  - key: vf-compilateur-impose
    format: true-false
    question: Le compilateur refuse une classe nommée en minuscules, comme `class commande`.
    truth: false
    answer: "Le compilateur l'accepte : les conventions sont une règle d'équipe, pas de langage."
  - key: vf-casse
    format: true-false
    question: En Java, `total` et `Total` désignent la même variable.
    truth: false
    answer: "Java distingue les majuscules et les minuscules : ce sont deux noms différents."
  - key: vf-package-majuscules
    format: true-false
    question: Un nom de package s'écrit en PascalCase, comme `Fr.Recallio.Caisse`.
    truth: false
    answer: Les packages s'écrivent entièrement en minuscules.
  - key: qcm-nom-de-classe
    format: multiple-choice
    question: Quel nom respecte la convention pour une classe ?
    choices:
      - text: "`FactureClient`"
        correct: true
      - text: "`factureClient`"
        correct: false
      - text: "`FACTURE_CLIENT`"
        correct: false
      - text: "`facture_client`"
        correct: false
    answer: Les types s'écrivent en PascalCase.
  - key: qcm-nom-de-constante
    format: multiple-choice
    question: Quel nom respecte la convention pour une constante ?
    choices:
      - text: "`TAUX_TVA`"
        correct: true
      - text: "`tauxTva`"
        correct: false
      - text: "`TauxTva`"
        correct: false
      - text: "`taux-tva`"
        correct: false
    answer: Les constantes s'écrivent en majuscules, mots séparés par des soulignés (et un tiret est interdit dans un nom).
  - key: qcm-noms-de-methode
    format: multiple-choice
    question: Quels noms conviennent à une méthode ?
    choices:
      - text: "`calculerTotal`"
        correct: true
      - text: "`envoyerFacture`"
        correct: true
      - text: "`CalculerTotal`"
        correct: false
      - text: "`calculer_total`"
        correct: false
    answer: Une méthode s'écrit en camelCase et commence souvent par un verbe.
  - key: qcm-nom-de-package
    format: multiple-choice
    question: Quel nom de package respecte les conventions ?
    choices:
      - text: "`fr.recallio.facturation`"
        correct: true
      - text: "`Fr.Recallio.Facturation`"
        correct: false
      - text: "`facturation_recallio`"
        correct: false
      - text: "`FR.RECALLIO`"
        correct: false
    answer: Des minuscules, à partir d'un nom de domaine inversé.
  - key: bug-classe-minuscule
    format: bug-fix
    question: |-
      Ce code compile, mais la relecture refuse ses noms. Quelle correction est la bonne ?
      ```java
      public class commande_client {
          private double Montant;
      }
      ```
    choices:
      - text: "La classe `COMMANDE_CLIENT` et le champ `MONTANT`"
        correct: false
      - text: "La classe `commandeClient` et le champ `Montant`"
        correct: false
      - text: "La classe `Commande_Client` et le champ `_montant`"
        correct: false
      - text: "La classe `CommandeClient` et le champ `montant`"
        correct: true
    answer: |-
      ```java
      public class CommandeClient {
          private double montant;
      }
      ```
      La classe s'écrit en PascalCase (et le fichier devient `CommandeClient.java`), le champ en camelCase.
  - key: bug-constante
    format: bug-fix
    question: |-
      Quel nom convient à cette constante ?
      ```java
      private static final double tauxTva = 0.2;
      ```
    choices:
      - text: "`tauxtva`"
        correct: false
      - text: "`TauxTva`"
        correct: false
      - text: "`TAUX_TVA`"
        correct: true
      - text: "`TAUX-TVA`"
        correct: false
    answer: |-
      ```java
      private static final double TAUX_TVA = 0.2;
      ```
      Une constante (`static final` d'une valeur immuable) s'écrit en majuscules, mots séparés par des soulignés.
  - key: bug-noms-obscurs
    format: bug-fix
    question: |-
      Quels noms rendent ce code lisible ?
      ```java
      int n = cmd.getNbArt();
      boolean flg = n > 0;
      ```
    choices:
      - text: "`n1` et `b1`"
        correct: false
      - text: "`nbArt` et `flag`"
        correct: false
      - text: "`NOMBRE_ARTICLES` et `A_DES_ARTICLES`"
        correct: false
      - text: "`nombreArticles` et `aDesArticles`"
        correct: true
    answer: |-
      ```java
      int nombreArticles = commande.nombreArticles();
      boolean aDesArticles = nombreArticles > 0;
      ```
      Des noms complets disent ce que contient la variable ; un booléen se lit comme une question.
  - key: bug-prefixes
    format: bug-fix
    question: |-
      Ce code vient d'un autre langage. Quelle version suit les conventions Java ?
      ```java
      private String m_strNom;
      public String GetNom() { return m_strNom; }
      ```
    choices:
      - text: "Un champ `m_nom` et une méthode `GetNom()`"
        correct: false
      - text: "Un champ `nom` et une méthode `getNom()`"
        correct: true
      - text: "Un champ `strNom` et une méthode `getNom()`"
        correct: false
      - text: "Un champ `Nom` et une méthode `GetNom()`"
        correct: false
    answer: |-
      ```java
      private String nom;
      public String getNom() { return nom; }
      ```
      Pas de préfixes de type ou de membre (`m_`, `str`) en Java, et les méthodes commencent par une minuscule.
