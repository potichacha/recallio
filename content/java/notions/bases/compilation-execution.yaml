notion: compilation-execution
lesson: |-
  Deux commandes, deux étapes :

  ```
  javac Bonjour.java    # compile : produit Bonjour.class (le bytecode)
  java Bonjour          # exécute : la JVM charge la classe Bonjour et appelle main
  ```

  - `javac` prend un **fichier** (avec son extension `.java`) ; `java` prend un **nom de classe** (sans extension).
  - Les erreurs de **compilation** (syntaxe, types) sont signalées par `javac`, avant toute exécution ; les erreurs
    d'**exécution** (une exception, une classe introuvable) arrivent pendant `java`.
  - `javac -d out` range les `.class` dans un dossier ; `java -cp out Bonjour` dit à la JVM où les chercher
    (le **classpath**).

  Depuis Java 11, on peut lancer un **fichier source unique** sans compiler à part : `java Bonjour.java`. Java 22 étend
  cela aux programmes de plusieurs fichiers. C'est idéal pour un script ou un essai ; un vrai projet utilise un outil de
  build (Maven, Gradle).

  **Piège classique** : `java Bonjour.class`. La JVM attend un nom de classe, pas un fichier : il faut `java Bonjour`.

  **En entretien** : « `javac` compile le source en bytecode, `java` démarre une JVM qui charge la classe depuis le
  classpath et appelle `main`. »
cards:
  - key: javac-vs-java
    format: course
    question: Quel est le rôle de `javac`, et celui de `java` ?
    answer: '`javac` compile le code source en bytecode (`.class`) ; `java` démarre une JVM qui exécute ce bytecode.'
  - key: lancer-fichier-source
    format: course
    question: Comment lancer un programme d'un seul fichier sans le compiler à part ?
    answer: '`java Bonjour.java` (depuis Java 11) : la JVM compile en mémoire puis exécute.'
  - key: classpath
    format: course
    question: Qu'est-ce que le classpath ?
    answer: |-
      La liste des dossiers et des archives `.jar` où la JVM cherche les classes. On la donne avec `-cp`
      (ou `--class-path`).
  - key: compilation-vs-execution
    format: course
    question: Quelle différence entre une erreur de compilation et une erreur d'exécution ?
    answer: |-
      Une erreur de **compilation** est détectée par `javac` (syntaxe, types) : aucun `.class` n'est produit. Une erreur
      d'**exécution** survient pendant que le programme tourne, comme une exception ou une classe introuvable.
  - key: vf-javac-class
    format: true-false
    question: "`javac Bonjour.java` produit un fichier `Bonjour.class`."
    truth: true
    answer: Le fichier `.class` contient le bytecode de la classe `Bonjour`.
  - key: vf-java-extension
    format: true-false
    question: Pour exécuter une classe compilée, on tape `java Bonjour.class`.
    truth: false
    answer: '`java` attend un **nom de classe**, sans extension : `java Bonjour`.'
  - key: vf-source-unique
    format: true-false
    question: Depuis Java 11, `java Bonjour.java` exécute un programme d'un seul fichier sans `javac` préalable.
    truth: true
    answer: La JVM compile le fichier en mémoire, puis l'exécute ; aucun `.class` n'est écrit sur le disque.
  - key: vf-erreur-compilation-execute
    format: true-false
    question: Si `javac` signale une erreur, le programme s'exécute quand même jusqu'à la ligne fautive.
    truth: false
    answer: "Une erreur de compilation empêche de produire le `.class` : il n'y a rien à exécuter."
  - key: qcm-compiler
    format: multiple-choice
    question: Quelle commande compile `Bonjour.java` ?
    choices:
      - text: "`javac Bonjour.java`"
        correct: true
      - text: "`java Bonjour`"
        correct: false
      - text: "`javac Bonjour`"
        correct: false
      - text: "`jar Bonjour.java`"
        correct: false
    answer: '`javac` prend le fichier source, avec son extension.'
  - key: qcm-executer
    format: multiple-choice
    question: Après `javac Bonjour.java`, quelles commandes exécutent le programme ?
    choices:
      - text: "`java Bonjour`"
        correct: true
      - text: "`java -cp . Bonjour`"
        correct: true
      - text: "`java Bonjour.class`"
        correct: false
      - text: "`javac Bonjour`"
        correct: false
    answer: '`java` prend un nom de classe ; `-cp .` précise que les classes sont dans le dossier courant (c''est déjà le défaut).'
  - key: qcm-option-classpath
    format: multiple-choice
    question: Quelle option indique à `java` où chercher les classes ?
    choices:
      - text: "`-cp` (ou `--class-path`)"
        correct: true
      - text: "`-d`"
        correct: false
      - text: "`-source`"
        correct: false
      - text: "`-verbose`"
        correct: false
    answer: '`-cp` donne le classpath ; `-d` est une option de `javac` qui choisit le dossier de sortie des `.class`.'
  - key: qcm-detecte-javac
    format: multiple-choice
    question: Laquelle de ces erreurs est détectée par `javac` ?
    choices:
      - text: "Un point-virgule manquant"
        correct: true
      - text: "Une division par zéro entière à l'exécution"
        correct: false
      - text: "Un fichier lu par le programme qui n'existe pas"
        correct: false
      - text: "Une classe absente du classpath au lancement"
        correct: false
    answer: Le compilateur vérifie la syntaxe et les types ; le reste n'arrive qu'à l'exécution.
  - key: trous-compiler-executer
    format: fill-in
    question: |-
      Complétez les deux commandes qui compilent puis exécutent `Bonjour.java` :
      ```
      ___ Bonjour.java
      ___ Bonjour
      ```
    blanks: [[javac], [java]]
    answer: '`javac` compile le fichier, `java` exécute la classe.'
  - key: trous-dossier-sortie
    format: fill-in
    question: |-
      Complétez pour ranger les `.class` dans `out`, puis exécuter depuis ce dossier :
      ```
      javac ___ out Bonjour.java
      java ___ out Bonjour
      ```
    blanks: [[-d], [-cp, --class-path, -classpath]]
    answer: '`-d` choisit le dossier de sortie de `javac` ; `-cp` donne le classpath à `java`.'
  - key: trous-source-unique
    format: fill-in
    question: |-
      Complétez pour lancer directement le fichier source, sans `javac` :
      ```
      java ___
      ```
    blanks: [[Bonjour.java]]
    answer: Avec l'extension `.java`, la JVM compile le fichier en mémoire avant de l'exécuter.
  - key: trous-extension-bytecode
    format: fill-in
    question: |-
      Complétez : `javac` transforme `Bonjour.java` en `Bonjour.___`, qui contient du ___.
    blanks: [[class], [bytecode]]
    answer: Le fichier `.class` contient le bytecode, que la JVM exécute.
  - key: situation-classe-introuvable
    format: scenario
    question: Un débutant a compilé avec `javac -d out Bonjour.java`, puis tape `java Bonjour` depuis le même dossier. La JVM répond qu'elle ne trouve pas la classe. Pourquoi ?
    answer: |-
      Les `.class` sont dans `out`, et la JVM cherche par défaut dans le dossier courant. Il faut lui donner le
      classpath : `java -cp out Bonjour`. Si la classe est dans un package, il faut aussi son nom complet
      (`java -cp out fr.recallio.Bonjour`).
  - key: situation-script-rapide
    format: scenario
    question: Vous voulez tester une idée en Java en trois lignes, sans créer de projet. Comment faites-vous ?
    answer: |-
      Soit **`jshell`**, la boucle interactive, pour essayer des instructions une à une ; soit un fichier unique lancé
      par **`java Essai.java`**, sans compilation préalable. Pas besoin de Maven ni d'IDE pour ça.
  - key: situation-versions
    format: scenario
    question: Le programme compilé sur votre poste échoue sur le serveur avec `UnsupportedClassVersionError`. Que s'est-il passé ?
    answer: |-
      Le bytecode a été produit pour une version de Java plus récente que celle de la JVM du serveur (par exemple
      compilé pour 25, exécuté sur 21). Soit on met à jour la JVM du serveur, soit on compile pour la version cible avec
      `javac --release 21` (en Maven : `maven.compiler.release`).
  - key: situation-erreur-compilation
    format: scenario
    question: "Un débutant vous montre un message de `javac` qui commence par `Bonjour.java:3: error:`. Comment l'aidez-vous à le lire ?"
    answer: |-
      Le message donne le **fichier** et la **ligne** (3) de l'erreur, puis sa nature (`';' expected`,
      `cannot find symbol`...). Une petite flèche `^` désigne l'endroit précis. On corrige la première erreur d'abord :
      les suivantes en découlent souvent.
