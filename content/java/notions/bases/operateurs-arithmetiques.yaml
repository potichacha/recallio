notion: operateurs-arithmetiques
cards:
  - key: vaut-7-3
    format: course
    question: Que vaut `-7 % 3` ?
    answer: -1, le signe suit le dividende ; Math.floorMod(-7, 3) vaut 2.
  - key: 10-0-vs-10-0-0
    format: course
    question: '`10 / 0` vs `10.0 / 0` ?'
    answer: ArithmeticException vs Infinity.
  - key: code-system-out-println-1-2
    format: code-output
    question: '`System.out.println(1 / 2 * 2.0 + " " + 1 / 2.0 * 2);`'
    answer: '`0.0 1.0` : `1 / 2` est une division entière qui vaut 0.'
  - key: code-system-out-println-10-3
    format: code-output
    question: '`System.out.println(10 / 3 + " " + 10 % 3 + " " + (-10 % 3));`'
    answer: '`3 1 -1`.'
