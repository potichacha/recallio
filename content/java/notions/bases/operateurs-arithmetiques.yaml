notion: operateurs-arithmetiques
lesson: |-
  Les cinq opérateurs arithmétiques : `+`, `-`, `*`, `/` et `%` (le **reste** de la division, ou *modulo*).

  ```java
  int q = 17 / 5;      // 3 : entre deux entiers, la division est entière
  int r = 17 % 5;      // 2 : le reste
  double d = 17 / 5.0; // 3.4 : un opérande à virgule rend la division décimale
  ```

  - Entre deux entiers, `/` **tronque vers zéro** : `7 / 2` vaut 3 et `-7 / 2` vaut -3.
  - Le signe de `%` suit celui du **dividende** : `-7 % 3` vaut -1. Pour un reste toujours positif (un jour de la
    semaine, un indice circulaire), on utilise `Math.floorMod(-7, 3)`, qui vaut 2.
  - `n % 2 == 0` teste si `n` est pair ; `/` et `%` ensemble découpent une quantité (des secondes en minutes et en
    secondes, des centimes en euros et en centimes).
  - Une division **entière** par zéro lève une `ArithmeticException` ; une division **flottante** par zéro donne
    `Infinity`.
  - `*`, `/` et `%` passent avant `+` et `-` ; à priorité égale, on calcule de gauche à droite.

  **Piège classique** : `int pourcentage = reussis / total * 100;` donne presque toujours 0 : `reussis / total` est une
  division entière, nulle tant que `reussis < total`. On multiplie d'abord : `reussis * 100 / total`.

  **En entretien** : « Entre entiers, `/` tronque et `%` garde le signe du dividende ; la division entière par zéro lève
  une exception, la flottante non. »
tour:
  - title: Les opérateurs arithmétiques
    text: |-
      `+`, `-`, `*`, `/` et `%` (le reste) s'appliquent aux nombres. Entre deux entiers, `/` fait une **division
      entière** : `17 / 5` vaut 3, et le reste `17 % 5` vaut 2. Diviser un entier par zéro lève une
      `ArithmeticException` ; un `double` divisé par zéro donne l'infini.

      Le signe du reste suit celui du dividende : `-7 % 3` vaut -1. Et `+` concatène aussi les chaînes, de gauche à
      droite : `"1" + 2 + 3` donne `"123"`, mais `1 + 2 + "3"` donne `"33"`.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println(17 / 5 + " " + 17 % 5);
              IO.println(-7 % 3);
              IO.println(17 / 5.0);
              IO.println(1.0 / 0);
              IO.println("1" + 2 + 3);
              IO.println(1 + 2 + "3");
          }
      output: |-
        3 2
        -1
        3.4
        Infinity
        123
        33
cards:
  - key: vaut-7-3
    format: course
    question: Que vaut `-7 % 3` ?
    answer: "-1, le signe suit le dividende ; Math.floorMod(-7, 3) vaut 2."
  - key: 10-0-vs-10-0-0
    format: course
    question: '`10 / 0` vs `10.0 / 0` ?'
    answer: ArithmeticException vs Infinity.
  - key: role-modulo
    format: course
    question: À quoi sert l'opérateur `%` ?
    answer: |-
      Il donne le **reste** de la division : `17 % 5` vaut 2. Il sert à tester la parité (`n % 2 == 0`), à découper une
      quantité ou à revenir au début d'un cycle.
  - key: division-entiere-tronque
    format: course
    question: Que vaut `7 / 2` en Java, et pourquoi ?
    answer: '`3` : entre deux entiers, la division est entière et tronque vers zéro. `7 / 2.0` vaut 3.5.'
  - key: vf-division-entiere
    format: true-false
    question: "`7 / 2` vaut `3.5` en Java."
    truth: false
    answer: "Entre deux `int`, la division est entière : `7 / 2` vaut 3."
  - key: vf-signe-modulo
    format: true-false
    question: "`-7 % 3` vaut `2`."
    truth: false
    answer: "Le reste prend le signe du dividende : `-7 % 3` vaut -1. `Math.floorMod(-7, 3)` vaut 2."
  - key: vf-division-zero
    format: true-false
    question: "`10 / 0`, entre entiers, lève une `ArithmeticException`."
    truth: true
    answer: La division entière par zéro est interdite ; avec un flottant, on obtiendrait `Infinity`.
  - key: vf-priorite-multiplication
    format: true-false
    question: "`2 + 3 * 4` vaut `20`."
    truth: false
    answer: '`*` passe avant `+` : 2 + 12 = 14.'
  - key: qcm-17-modulo-5
    format: multiple-choice
    question: Que vaut `17 % 5` ?
    choices:
      - text: "2"
        correct: true
      - text: "3"
        correct: false
      - text: "3.4"
        correct: false
      - text: "12"
        correct: false
    answer: "17 = 3 × 5 + 2 : le reste vaut 2."
  - key: qcm-tester-parite
    format: multiple-choice
    question: Quelle condition est vraie quand `n` est pair ?
    choices:
      - text: "`n % 2 == 0`"
        correct: true
      - text: "`n / 2 == 0`"
        correct: false
      - text: "`n % 2 == 1`"
        correct: false
      - text: "`n * 2 == 0`"
        correct: false
    answer: Un nombre pair a un reste nul dans la division par 2 (et `n % 2 == 1` échoue pour un impair négatif, qui donne -1).
  - key: qcm-division-decimale
    format: multiple-choice
    question: Quelles expressions valent `3.5` ?
    choices:
      - text: "`7 / 2.0`"
        correct: true
      - text: "`7.0 / 2`"
        correct: true
      - text: "`7 / 2`"
        correct: false
      - text: "`(double) (7 / 2)`"
        correct: false
    answer: Il suffit d'un opérande à virgule ; convertir le résultat d'une division entière arrive trop tard (3.0).
  - key: qcm-reste-positif
    format: multiple-choice
    question: Quelle méthode donne un reste toujours positif, par exemple pour un indice circulaire ?
    choices:
      - text: "`Math.floorMod(a, b)`"
        correct: true
      - text: "`Math.abs(a % b)`"
        correct: false
      - text: "`a % b`"
        correct: false
      - text: "`Math.round(a / b)`"
        correct: false
    answer: '`Math.floorMod(-1, 7)` vaut 6, là où `-1 % 7` vaut -1 ; `Math.abs` donnerait 1, ce qui est faux pour un cycle.'
  - key: trous-quotient-reste
    format: fill-in
    question: |-
      Complétez pour découper `secondes` en minutes et en secondes restantes :
      ```java
      int minutes = secondes ___ 60;
      int reste = secondes ___ 60;
      ```
    blanks: [["/"], ["%"]]
    answer: Le quotient donne les minutes entières, le reste les secondes qui restent.
  - key: trous-parite
    format: fill-in
    question: |-
      Complétez le test de parité :
      ```java
      boolean estPair = n ___ 2 == 0;
      ```
    blanks: [["%"]]
    answer: Un nombre pair a un reste nul quand on le divise par 2.
  - key: trous-division-decimale
    format: fill-in
    question: |-
      Complétez pour que la division garde ses décimales :
      ```java
      double moitie = 7 / ___;
      ```
    blanks: [["2.0", "2d", "2D", "2.", "(double) 2"]]
    answer: Un opérande à virgule suffit à rendre la division décimale.
  - key: trous-pourcentage
    format: fill-in
    question: |-
      Complétez pour calculer un pourcentage entier sans le perdre dans une division entière :
      ```java
      int pourcentage = reussis * ___ / total;
      ```
    blanks: [["100"]]
    answer: On multiplie avant de diviser, pour que la division entière ne tronque qu'à la fin.
  - key: code-system-out-println-1-2
    format: code-output
    question: '`System.out.println(1 / 2 * 2.0 + " " + 1 / 2.0 * 2);`'
    answer: '`0.0 1.0` : `1 / 2` est une division entière qui vaut 0.'
    check:
      code: |-
        System.out.println(1 / 2 * 2.0 + " " + 1 / 2.0 * 2);
      output: "0.0 1.0"
  - key: code-system-out-println-10-3
    format: code-output
    question: '`System.out.println(10 / 3 + " " + 10 % 3 + " " + (-10 % 3));`'
    answer: '`3 1 -1`.'
    check:
      code: |-
        System.out.println(10 / 3 + " " + 10 % 3 + " " + (-10 % 3));
      output: "3 1 -1"
  - key: code-negatifs
    format: code-output
    question: |-
      ```java
      System.out.println((-7 / 2) + " " + (7 % -3));
      ```
    answer: '`-3 1` : la division tronque vers zéro, et le reste prend le signe du dividende (7).'
    check:
      output: "-3 1"
  - key: code-division-par-zero
    format: code-output
    question: |-
      ```java
      int total = 0;
      System.out.println(10 / total);
      ```
    answer: "Une `ArithmeticException` (`/ by zero`) : la division entière par zéro est interdite."
    check:
      throws: ArithmeticException
  - key: bug-pourcentage-nul
    format: bug-fix
    question: |-
      Avec 45 réponses justes sur 60, ce pourcentage vaut 0 :
      ```java
      int pourcentage = reussis / total * 100;
      ```
    answer: |-
      ```java
      int pourcentage = reussis * 100 / total;
      ```
      `reussis / total` est une division entière, nulle tant que `reussis < total`. En multipliant d'abord, seule la
      dernière division tronque : 4500 / 60 = 75.
  - key: bug-impair-negatif
    format: bug-fix
    question: |-
      Ce test répond « pair » pour -3 :
      ```java
      boolean estImpair = n % 2 == 1;
      ```
    answer: |-
      ```java
      boolean estImpair = n % 2 != 0;
      ```
      Pour un nombre négatif, le reste est négatif : `-3 % 2` vaut -1, pas 1. Comparer à 0 marche dans tous les cas.
  - key: bug-indice-circulaire
    format: bug-fix
    question: |-
      Pour reculer d'une case dans un tableau circulaire de `taille` éléments, ce code donne un indice négatif quand
      `indice` vaut 0 :
      ```java
      int precedent = (indice - 1) % taille;
      ```
    answer: |-
      ```java
      int precedent = Math.floorMod(indice - 1, taille);
      ```
      `-1 % taille` vaut -1 ; `Math.floorMod` donne un reste toujours positif, ici `taille - 1`.
  - key: bug-moyenne-zero-element
    format: bug-fix
    question: |-
      Ce calcul plante avec une `ArithmeticException` quand le panier est vide :
      ```java
      int prixMoyen = total / nombreArticles;
      ```
    answer: |-
      ```java
      int prixMoyen = nombreArticles == 0 ? 0 : total / nombreArticles;
      ```
      Une division entière par zéro lève une exception : on traite le cas vide avant de diviser.
