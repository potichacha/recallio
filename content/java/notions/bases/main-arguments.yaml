notion: main-arguments
lesson: |-
  Les mots tapés après le nom de la classe arrivent dans le tableau `args` de `main` :

  ```
  java Calcul 12 7
  ```
  ```java
  public static void main(String[] args) {
      int a = Integer.parseInt(args[0]);   // "12" → 12
      int b = Integer.parseInt(args[1]);   // "7" → 7
      System.out.println(a + b);
  }
  ```

  - Les arguments sont toujours des **chaînes** ; on les convertit (`Integer.parseInt`, `Double.parseDouble`).
  - `args` n'est jamais `null` : sans argument, c'est un tableau **vide**. On vérifie `args.length` avant de lire.
  - Un argument contenant des espaces s'écrit entre guillemets : `java Bonjour "Ada Lovelace"`.
  - **`System.exit(code)`** arrête la JVM immédiatement. Par convention, `0` signifie « succès », toute autre valeur une
    erreur : les scripts et la CI lisent ce code.
  - Dans une application serveur ou une bibliothèque, on n'appelle jamais `System.exit` : il arrêterait tout le
    processus.

  **Piège classique** : lire `args[0]` sans vérifier qu'il existe. Lancé sans argument, le programme plante avec une
  `ArrayIndexOutOfBoundsException` au lieu d'un message d'usage clair.

  **En entretien** : « `args` contient les arguments en chaînes, vide s'il n'y en a pas ; le code de sortie de
  `System.exit` dit au système si le programme a réussi. »
cards:
  - key: surcharger-main
    format: course
    question: Peut-on surcharger `main` ?
    answer: Oui, mais seule la signature `main(String[])` (ou, depuis Java 25, `main()`) sert de point d'entrée à la JVM.
  - key: type-des-arguments
    format: course
    question: De quel type sont les arguments de la ligne de commande ?
    answer: Ce sont des `String` ; on les convertit au besoin, par exemple avec `Integer.parseInt(args[0])`.
  - key: sans-argument
    format: course
    question: Que vaut `args` quand on lance le programme sans argument ?
    answer: Un tableau **vide** (`args.length == 0`), jamais `null`.
  - key: code-de-sortie
    format: course
    question: Que signifie le code passé à `System.exit` ?
    answer: |-
      Il dit au système comment le programme s'est terminé : `0` pour un succès, une autre valeur pour une erreur. Les
      scripts et la CI s'en servent pour savoir si une étape a réussi.
  - key: vf-args-null
    format: true-false
    question: Sans argument, `args` vaut `null`.
    truth: false
    answer: C'est un tableau vide.
  - key: vf-entier-direct
    format: true-false
    question: "Avec `java Calcul 12`, `args[0]` est l'entier 12."
    truth: false
    answer: C'est la chaîne `"12"`, qu'il faut convertir.
  - key: vf-exit-zero
    format: true-false
    question: Par convention, `System.exit(0)` signale un succès.
    truth: true
    answer: Une valeur non nulle signale une erreur.
  - key: vf-exit-serveur
    format: true-false
    question: Une méthode d'une application web peut appeler `System.exit(1)` pour signaler une erreur.
    truth: false
    answer: Elle arrêterait tout le serveur ; on lève une exception, que le framework transforme en réponse d'erreur.
  - key: qcm-premier-argument
    format: multiple-choice
    question: "Avec `java Copie source.txt cible.txt`, que vaut `args[1]` ?"
    choices:
      - text: "\"cible.txt\""
        correct: true
      - text: "\"source.txt\""
        correct: false
      - text: "\"Copie\""
        correct: false
      - text: "\"java\""
        correct: false
    answer: "Le nom de la classe n'est pas dans `args` : `args[0]` est `source.txt`, `args[1]` est `cible.txt`."
  - key: qcm-convertir
    format: multiple-choice
    question: Comment obtenir l'entier passé en premier argument ?
    choices:
      - text: "`Integer.parseInt(args[0])`"
        correct: true
      - text: "`(int) args[0]`"
        correct: false
      - text: "`args[0].toInt()`"
        correct: false
      - text: "`args.getInt(0)`"
        correct: false
    answer: Un cast ne convertit pas un texte ; `parseInt` l'analyse.
  - key: qcm-espaces
    format: multiple-choice
    question: Comment passer « Ada Lovelace » comme un seul argument ?
    choices:
      - text: "`java Bonjour \"Ada Lovelace\"`"
        correct: true
      - text: "`java Bonjour Ada Lovelace`"
        correct: false
      - text: "`java Bonjour Ada+Lovelace`"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: Sans guillemets, l'espace sépare deux arguments.
  - key: qcm-verifier
    format: multiple-choice
    question: Quelle vérification évite une exception quand l'utilisateur oublie l'argument ?
    choices:
      - text: "`if (args.length == 0)`"
        correct: true
      - text: "`if (args == null)`"
        correct: false
      - text: "`if (args[0] == null)`"
        correct: false
      - text: "`if (args[0].isEmpty())`"
        correct: false
    answer: '`args` n''est jamais `null`, et lire `args[0]` sur un tableau vide lève déjà l''exception.'
  - key: code-longueur
    format: code-output
    question: |-
      ```java
      public class Compte {
          public static void main(String[] args) {
              System.out.println(args.length);
          }
      }
      ```
      lancé par `java Compte un deux trois`
    answer: '`3` : trois arguments.'
    check:
      code: |-
        public class Compte {
            public static void main(String[] args) {
                System.out.println(args.length);
            }
        }
        Compte.main(new String[] {"un", "deux", "trois"});
      output: "3"
  - key: code-somme
    format: code-output
    question: |-
      ```java
      public static void main(String[] args) {
          System.out.println(args[0] + args[1]);
      }
      ```
      lancé avec les arguments `2` et `3`
    answer: '`23` : ce sont des chaînes, que `+` concatène.'
    check:
      code: |-
        class Somme {
            public static void main(String[] args) {
                System.out.println(args[0] + args[1]);
            }
        }
        Somme.main(new String[] {"2", "3"});
      output: "23"
  - key: code-sans-argument
    format: code-output
    question: |-
      ```java
      public static void main(String[] args) {
          System.out.println("Bonjour " + args[0]);
      }
      ```
      lancé sans argument
    answer: "Une `ArrayIndexOutOfBoundsException` : `args` est vide."
    check:
      code: |-
        class Bonjour {
            public static void main(String[] args) {
                System.out.println("Bonjour " + args[0]);
            }
        }
        Bonjour.main(new String[0]);
      throws: ArrayIndexOutOfBoundsException
  - key: code-parse
    format: code-output
    question: |-
      ```java
      public static void main(String[] args) {
          int a = Integer.parseInt(args[0]);
          int b = Integer.parseInt(args[1]);
          System.out.println(a + b);
      }
      ```
      lancé avec les arguments `2` et `3`
    answer: '`5` : les chaînes sont converties en entiers avant l''addition.'
    check:
      code: |-
        class Calcul {
            public static void main(String[] args) {
                int a = Integer.parseInt(args[0]);
                int b = Integer.parseInt(args[1]);
                System.out.println(a + b);
            }
        }
        Calcul.main(new String[] {"2", "3"});
      output: "5"
  - key: bug-sans-verification
    format: bug-fix
    question: |-
      Lancé sans argument, ce programme plante avec une `ArrayIndexOutOfBoundsException` :
      ```java
      public static void main(String[] args) {
          String fichier = args[0];
          traiter(fichier);
      }
      ```
    answer: |-
      ```java
      public static void main(String[] args) {
          if (args.length == 0) {
              System.err.println("Usage : java Traitement <fichier>");
              System.exit(1);
          }
          traiter(args[0]);
      }
      ```
      On vérifie le nombre d'arguments et on affiche un message d'usage, avec un code de sortie d'erreur.
  - key: bug-concatenation
    format: bug-fix
    question: |-
      Avec `java Calcul 2 3`, ce programme affiche `23` au lieu de `5` :
      ```java
      System.out.println(args[0] + args[1]);
      ```
    answer: |-
      ```java
      System.out.println(Integer.parseInt(args[0]) + Integer.parseInt(args[1]));
      ```
      Les arguments sont des chaînes : il faut les convertir avant d'additionner.
  - key: bug-exit-dans-bibliotheque
    format: bug-fix
    question: |-
      Cette méthode d'une bibliothèque arrête tout le programme qui l'utilise :
      ```java
      public static Config charger(Path fichier) {
          if (!Files.exists(fichier)) {
              System.exit(1);
          }
          return lire(fichier);
      }
      ```
    answer: |-
      ```java
      if (!Files.exists(fichier)) {
          throw new IllegalArgumentException("Fichier de configuration introuvable : " + fichier);
      }
      ```
      Une bibliothèque signale l'erreur par une exception ; c'est à l'application de décider de s'arrêter.
  - key: bug-code-succes
    format: bug-fix
    question: |-
      La CI considère cette étape comme réussie alors que la validation a échoué :
      ```java
      if (!erreurs.isEmpty()) {
          afficher(erreurs);
          System.exit(0);
      }
      ```
    answer: |-
      ```java
      System.exit(1);
      ```
      `0` signifie « succès » ; un échec doit renvoyer un code non nul, que la CI détecte.
