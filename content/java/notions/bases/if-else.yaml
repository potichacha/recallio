notion: if-else
lesson: |-
  `if` exécute un bloc seulement si une condition (un `boolean`) est vraie ; `else` donne l'autre chemin, et `else if`
  enchaîne d'autres conditions.

  ```java
  if (note >= 16) {
      mention = "Très bien";
  } else if (note >= 10) {
      mention = "Admis";
  } else {
      mention = "Ajourné";
  }
  ```

  - Les conditions sont testées **dans l'ordre**, et seule la **première vraie** s'exécute. On met donc les cas les
    plus restrictifs en premier.
  - La condition est toujours un `boolean` : `if (n)` ne compile pas pour un `int` (contrairement au C).
  - Sans accolades, seule **la ligne suivante** dépend du `if`. On met toujours des accolades : c'est la source de
    bugs classiques quand on ajoute une ligne.
  - Un `else` se rattache au `if` le plus proche.
  - Pour éviter l'imbrication profonde, on sort tôt (*garde*) : `if (panier.isEmpty()) return 0;`.

  **Piège classique** : un point-virgule après la condition, `if (x > 0);`. Le `if` contrôle alors une instruction vide,
  et le bloc qui suit s'exécute toujours.

  **En entretien** : « Les branches sont testées dans l'ordre et une seule s'exécute ; on garde des accolades partout et
  on préfère des retours anticipés à l'imbrication. »
tour:
  - title: if, else if, else
    text: |-
      `if` exécute un bloc si sa condition, entre parenthèses, est vraie ; `else if` enchaîne d'autres conditions, et
      `else` couvre le reste. La condition doit être un `boolean` : `if (n)` ne compile pas en Java.

      Les accolades sont facultatives pour une seule instruction, mais on les met toujours : elles évitent qu'une ligne
      ajoutée plus tard sorte du `if` sans qu'on s'en aperçoive.
    example:
      files:
        Main.java: |-
          String mention(int note) {
              if (note >= 16) {
                  return "très bien";
              } else if (note >= 12) {
                  return "bien";
              } else {
                  return "à revoir";
              }
          }

          void main() {
              for (int note : new int[] {18, 13, 7}) {
                  IO.println(note + " : " + mention(note));
              }
          }
      output: |-
        18 : très bien
        13 : bien
        7 : à revoir
    task:
      instructions: |-
        Ajoute la mention `assez bien`, de 10 inclus à 12 exclu : le programme doit afficher `11 : assez bien`.
      starter:
        Main.java: |-
          String mention(int note) {
              if (note >= 16) {
                  return "très bien";
              } else if (note >= 12) {
                  return "bien";
              } else {
                  return "à revoir";
              }
          }

          void main() {
              IO.println(11 + " : " + mention(11));
          }
      solution:
        Main.java: |-
          String mention(int note) {
              if (note >= 16) {
                  return "très bien";
              } else if (note >= 12) {
                  return "bien";
              } else if (note >= 10) {
                  return "assez bien";
              } else {
                  return "à revoir";
              }
          }

          void main() {
              IO.println(11 + " : " + mention(11));
          }
      output: |-
        11 : assez bien
cards:
  - key: ordre-des-branches
    format: course
    question: Dans une chaîne `if / else if / else`, combien de branches s'exécutent ?
    choices:
      - {text: "Une seule : la première dont la condition est vraie, sinon le `else`", correct: true}
      - {text: "Toutes celles dont la condition est vraie, dans l'ordre du code", correct: false}
      - {text: "Une seule : la dernière dont la condition est vraie, sinon le `else`", correct: false}
      - {text: "La première vraie, puis le `else` final, qui s'exécute toujours", correct: false}
    answer: "Une seule : la **première** dont la condition est vraie, ou le `else` si aucune ne l'est."
  - key: condition-booleenne
    format: course
    question: Quel type doit avoir la condition d'un `if` ?
    choices:
      - {text: "`boolean` : `if (n)` ne compile pas pour un `int`", correct: true}
      - {text: "`int` : 0 vaut faux, toute autre valeur vaut vrai", correct: false}
      - {text: "N'importe quel type : `null` et 0 valent faux", correct: false}
      - {text: "`boolean` ou `String` : une chaîne vide vaut faux", correct: false}
    answer: '`boolean`. `if (n)` ne compile pas pour un `int` : on écrit `if (n != 0)`.'
  - key: accolades
    format: course
    question: Pourquoi mettre des accolades même autour d'une seule instruction ?
    choices:
      - {text: "Sans elles, seule la ligne suivante dépend du `if`, même si on en indente une seconde", correct: true}
      - {text: "Sans elles, le compilateur refuse un `if` qui n'a pas de `else`", correct: false}
      - {text: "Sans elles, le `if` s'exécute deux fois quand la condition est vraie", correct: false}
      - {text: "Pour la vitesse : la JVM optimise mieux un bloc entre accolades qu'une ligne seule", correct: false}
    answer: |-
      Sans accolades, seule la ligne suivante dépend du `if`. En ajoutant une seconde ligne indentée, on croit
      l'ajouter au `if`, alors qu'elle s'exécute toujours.
  - key: garde
    format: course
    question: Qu'est-ce qu'une clause de garde ?
    choices:
      - {text: "Un test en début de méthode qui en sort tout de suite pour un cas particulier", correct: true}
      - {text: "Un `try` / `catch` placé autour de tout le corps d'une méthode", correct: false}
      - {text: "Un `else` final qui attrape tous les cas non prévus par les `if`", correct: false}
      - {text: "Une condition répétée à la fin d'une boucle pour décider d'en sortir", correct: false}
    answer: |-
      Un test en début de méthode qui en sort tout de suite (`if (liste.isEmpty()) return 0;`) : le cas normal se lit
      ensuite sans imbrication.
  - key: vf-premiere-vraie
    format: true-false
    question: Dans un `if / else if`, si plusieurs conditions sont vraies, toutes les branches correspondantes s'exécutent.
    truth: false
    answer: Seule la première branche vraie s'exécute ; les suivantes sont ignorées.
  - key: vf-if-entier
    format: true-false
    question: "`if (1) { ... }` compile en Java."
    truth: false
    answer: La condition doit être un `boolean` ; `1` est un `int`.
  - key: vf-else-facultatif
    format: true-false
    question: Le `else` est facultatif.
    truth: true
    answer: Sans `else`, il ne se passe rien quand la condition est fausse.
  - key: vf-point-virgule
    format: true-false
    question: "Avec `if (x > 0);` suivi d'un bloc, le bloc ne s'exécute que si `x` est positif."
    truth: false
    answer: "Le point-virgule termine le `if` (sur une instruction vide) : le bloc qui suit s'exécute toujours."
  - key: qcm-quelle-branche
    format: multiple-choice
    question: "Avec `note = 18`, quelle branche s'exécute ? `if (note >= 10) A else if (note >= 16) B else C`"
    choices:
      - text: "A"
        correct: true
      - text: "B"
        correct: false
      - text: "A puis B"
        correct: false
      - text: "C"
        correct: false
    answer: '`note >= 10` est vraie en premier : seule A s''exécute. Il fallait tester `>= 16` d''abord.'
  - key: qcm-condition-valide
    format: multiple-choice
    question: Quelles conditions compilent, avec `int n` et `boolean actif` ?
    choices:
      - text: "`if (actif)`"
        correct: true
      - text: "`if (n > 0 && actif)`"
        correct: true
      - text: "`if (n)`"
        correct: false
      - text: "`if (n = 0)`"
        correct: false
    answer: La condition doit être un booléen ; `n = 0` est une affectation, qui vaut un `int`.
  - key: qcm-else-rattachement
    format: multiple-choice
    question: À quel `if` se rattache le `else` dans `if (a) if (b) x(); else y();` ?
    choices:
      - text: "Au `if (b)`, le plus proche"
        correct: true
      - text: "Au `if (a)`"
        correct: false
      - text: "Aux deux"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Un `else` se rattache au `if` le plus proche ; des accolades lèvent toute ambiguïté.
  - key: qcm-garde
    format: multiple-choice
    question: Quelle écriture évite l'imbrication pour un panier vide ?
    choices:
      - text: "`if (panier.isEmpty()) { return 0; }` en début de méthode"
        correct: true
      - text: "Un `else` après chaque ligne"
        correct: false
      - text: "Tout le calcul dans `if (!panier.isEmpty()) { ... }`"
        correct: false
      - text: "Un `try` autour du calcul"
        correct: false
    answer: Une clause de garde traite le cas particulier et sort ; le reste de la méthode reste à plat.
  - key: trous-sinon
    format: fill-in
    question: |-
      Complète pour donner le statut d'un mineur :
      ```java
      if (age >= 18) {
          statut = "majeur";
      } ___ {
          statut = "mineur";
      }
      ```
    blanks: [[else]]
    answer: '`else` donne le chemin quand la condition est fausse.'
  - key: trous-sinon-si
    format: fill-in
    question: |-
      Complète pour tester un second cas :
      ```java
      if (temperature > 30) {
          conseil = "Hydrate-toi";
      } ___ ___ (temperature < 0) {
          conseil = "Couvre-toi";
      }
      ```
    blanks: [[else], [if]]
    answer: '`else if` enchaîne une autre condition, testée seulement si la première est fausse.'
  - key: trous-condition
    format: fill-in
    question: |-
      Complète pour n'afficher que les quantités positives :
      ```java
      if (quantite ___ 0) {
          System.out.println(quantite);
      }
      ```
    blanks: [[">"]]
    answer: "La condition doit être un booléen : une comparaison."
  - key: trous-garde
    format: fill-in
    question: |-
      Complète la clause de garde :
      ```java
      double moyenne(int[] notes) {
          if (notes.length == 0) {
              ___ 0;
          }
          // ...
      }
      ```
    blanks: [[return]]
    answer: '`return` sort immédiatement de la méthode.'
  - key: code-ordre
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int note = 18;
      if (note >= 10) {
          System.out.println("Admis");
      } else if (note >= 16) {
          System.out.println("Très bien");
      }
      ```
    choices:
      - {text: "`Admis`", correct: true}
      - {text: "`Très bien`", correct: false}
      - text: |-
          ```
          Admis
          Très bien
          ```
        correct: false
      - {text: "Rien", correct: false}
    answer: '`Admis` : la première condition vraie l''emporte, la seconde n''est jamais testée.'
    check:
      output: "Admis"
  - key: code-sans-accolades
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int x = -1;
      if (x > 0)
          System.out.println("positif");
          System.out.println("fin");
      ```
    choices:
      - {text: "`fin`", correct: true}
      - {text: "Rien", correct: false}
      - text: |-
          ```
          positif
          fin
          ```
        correct: false
      - {text: "`positif`", correct: false}
    answer: '`fin` : sans accolades, seule la première ligne dépend du `if` ; l''indentation de la seconde ne change rien.'
    check:
      output: "fin"
  - key: code-point-virgule
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int x = -5;
      if (x > 0); {
          System.out.println("positif");
      }
      ```
    choices:
      - {text: "`positif`", correct: true}
      - {text: "Rien", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "`-5`", correct: false}
    answer: '`positif` : le `;` termine le `if`, et le bloc qui suit s''exécute toujours.'
    check:
      output: "positif"
  - key: code-else-if
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int t = 15;
      if (t > 30) {
          System.out.println("chaud");
      } else if (t > 10) {
          System.out.println("doux");
      } else {
          System.out.println("froid");
      }
      ```
    choices:
      - {text: "`doux`", correct: true}
      - {text: "`froid`", correct: false}
      - {text: "`chaud`", correct: false}
      - text: |-
          ```
          doux
          froid
          ```
        correct: false
    answer: '`doux` : `t > 30` est faux, `t > 10` est vrai.'
    check:
      output: "doux"
  - key: bug-ordre-des-conditions
    format: bug-fix
    question: |-
      La mention « Très bien » n'est jamais donnée. Quelle correction est la bonne ?
      ```java
      if (note >= 10) {
          mention = "Admis";
      } else if (note >= 16) {
          mention = "Très bien";
      }
      ```
    choices:
      - {text: "Tester `note >= 16` en premier, puis `note >= 10` dans le `else if`", correct: true}
      - {text: "Remplacer `else if` par `else`, pour que la seconde branche s'exécute", correct: false}
      - {text: "Écrire `note > 16` au lieu de `note >= 16` dans la seconde condition", correct: false}
      - {text: "Ajouter un `else` final qui donne « Très bien » aux autres notes", correct: false}
    answer: |-
      ```java
      if (note >= 16) {
          mention = "Très bien";
      } else if (note >= 10) {
          mention = "Admis";
      }
      ```
      Une note de 16 est aussi `>= 10` : la première branche l'attrape. On teste le cas le plus restrictif d'abord.
  - key: bug-point-virgule
    format: bug-fix
    question: |-
      Le message s'affiche même pour un solde positif. Quelle correction est la bonne ?
      ```java
      if (solde < 0); {
          System.out.println("Découvert !");
      }
      ```
    choices:
      - {text: "Retirer le `;` placé juste après `if (solde < 0)`", correct: true}
      - {text: "Écrire `solde <= 0` à la place de `solde < 0`", correct: false}
      - {text: "Ajouter un `;` après l'accolade fermante du bloc", correct: false}
      - {text: "Ajouter un `else { }` vide après le bloc", correct: false}
    answer: |-
      ```java
      if (solde < 0) {
          System.out.println("Découvert !");
      }
      ```
      Le point-virgule termine le `if` ; le bloc n'en dépendait plus.
  - key: bug-accolades
    format: bug-fix
    question: |-
      Le compteur augmente même quand la commande n'est pas payée. Quelle correction est la bonne ?
      ```java
      if (commande.estPayee())
          expedier(commande);
          expediees++;
      ```
    choices:
      - {text: "Entourer les deux instructions d'accolades `{ }` après le `if`", correct: true}
      - {text: "Indenter `expediees++;` d'un cran de plus que `expedier`", correct: false}
      - {text: "Mettre les deux instructions sur la même ligne que le `if`", correct: false}
      - {text: "Ajouter un `;` juste après `if (commande.estPayee())`", correct: false}
    answer: |-
      ```java
      if (commande.estPayee()) {
          expedier(commande);
          expediees++;
      }
      ```
      Sans accolades, seul `expedier` dépendait du `if`.
  - key: bug-condition-entiere
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: int cannot be converted to boolean`). Quelle correction est la bonne ?
      ```java
      int erreurs = verifier(formulaire);
      if (erreurs) {
          afficherErreurs();
      }
      ```
    choices:
      - {text: "`if (erreurs > 0) {`", correct: true}
      - {text: "`if ((boolean) erreurs) {`", correct: false}
      - {text: "`if (erreurs = 1) {`", correct: false}
      - {text: "`if (!erreurs) {`", correct: false}
    answer: |-
      ```java
      if (erreurs > 0) {
          afficherErreurs();
      }
      ```
      En Java, la condition est un booléen : il faut comparer le nombre.
