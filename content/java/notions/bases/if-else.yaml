notion: if-else
lesson: |-
  `if` exécute un bloc seulement si une condition (un `boolean`) est vraie ; `else` donne l'autre chemin, et `else if`
  enchaîne d'autres conditions.

  ```java
  if (note >= 16) {
      mention = "Très bien";
  } else if (note >= 10) {
      mention = "Admis";
  } else {
      mention = "Ajourné";
  }
  ```

  - Les conditions sont testées **dans l'ordre**, et seule la **première vraie** s'exécute. On met donc les cas les
    plus restrictifs en premier.
  - La condition est toujours un `boolean` : `if (n)` ne compile pas pour un `int` (contrairement au C).
  - Sans accolades, seule **la ligne suivante** dépend du `if`. On met toujours des accolades : c'est la source de
    bugs classiques quand on ajoute une ligne.
  - Un `else` se rattache au `if` le plus proche.
  - Pour éviter l'imbrication profonde, on sort tôt (*garde*) : `if (panier.isEmpty()) return 0;`.

  **Piège classique** : un point-virgule après la condition, `if (x > 0);`. Le `if` contrôle alors une instruction vide,
  et le bloc qui suit s'exécute toujours.

  **En entretien** : « Les branches sont testées dans l'ordre et une seule s'exécute ; on garde des accolades partout et
  on préfère des retours anticipés à l'imbrication. »
cards:
  - key: ordre-des-branches
    format: course
    question: Dans une chaîne `if / else if / else`, combien de branches s'exécutent ?
    answer: "Une seule : la **première** dont la condition est vraie, ou le `else` si aucune ne l'est."
  - key: condition-booleenne
    format: course
    question: Quel type doit avoir la condition d'un `if` ?
    answer: '`boolean`. `if (n)` ne compile pas pour un `int` : on écrit `if (n != 0)`.'
  - key: accolades
    format: course
    question: Pourquoi mettre des accolades même autour d'une seule instruction ?
    answer: |-
      Sans accolades, seule la ligne suivante dépend du `if`. En ajoutant une seconde ligne indentée, on croit
      l'ajouter au `if`, alors qu'elle s'exécute toujours.
  - key: garde
    format: course
    question: Qu'est-ce qu'une clause de garde ?
    answer: |-
      Un test en début de méthode qui en sort tout de suite (`if (liste.isEmpty()) return 0;`) : le cas normal se lit
      ensuite sans imbrication.
  - key: vf-premiere-vraie
    format: true-false
    question: Dans un `if / else if`, si plusieurs conditions sont vraies, toutes les branches correspondantes s'exécutent.
    truth: false
    answer: Seule la première branche vraie s'exécute ; les suivantes sont ignorées.
  - key: vf-if-entier
    format: true-false
    question: "`if (1) { ... }` compile en Java."
    truth: false
    answer: La condition doit être un `boolean` ; `1` est un `int`.
  - key: vf-else-facultatif
    format: true-false
    question: Le `else` est facultatif.
    truth: true
    answer: Sans `else`, il ne se passe rien quand la condition est fausse.
  - key: vf-point-virgule
    format: true-false
    question: "Avec `if (x > 0);` suivi d'un bloc, le bloc ne s'exécute que si `x` est positif."
    truth: false
    answer: "Le point-virgule termine le `if` (sur une instruction vide) : le bloc qui suit s'exécute toujours."
  - key: qcm-quelle-branche
    format: multiple-choice
    question: "Avec `note = 18`, quelle branche s'exécute ? `if (note >= 10) A else if (note >= 16) B else C`"
    choices:
      - text: "A"
        correct: true
      - text: "B"
        correct: false
      - text: "A puis B"
        correct: false
      - text: "C"
        correct: false
    answer: '`note >= 10` est vraie en premier : seule A s''exécute. Il fallait tester `>= 16` d''abord.'
  - key: qcm-condition-valide
    format: multiple-choice
    question: Quelles conditions compilent, avec `int n` et `boolean actif` ?
    choices:
      - text: "`if (actif)`"
        correct: true
      - text: "`if (n > 0 && actif)`"
        correct: true
      - text: "`if (n)`"
        correct: false
      - text: "`if (n = 0)`"
        correct: false
    answer: La condition doit être un booléen ; `n = 0` est une affectation, qui vaut un `int`.
  - key: qcm-else-rattachement
    format: multiple-choice
    question: À quel `if` se rattache le `else` dans `if (a) if (b) x(); else y();` ?
    choices:
      - text: "Au `if (b)`, le plus proche"
        correct: true
      - text: "Au `if (a)`"
        correct: false
      - text: "Aux deux"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Un `else` se rattache au `if` le plus proche ; des accolades lèvent toute ambiguïté.
  - key: qcm-garde
    format: multiple-choice
    question: Quelle écriture évite l'imbrication pour un panier vide ?
    choices:
      - text: "`if (panier.isEmpty()) { return 0; }` en début de méthode"
        correct: true
      - text: "Un `else` après chaque ligne"
        correct: false
      - text: "Tout le calcul dans `if (!panier.isEmpty()) { ... }`"
        correct: false
      - text: "Un `try` autour du calcul"
        correct: false
    answer: Une clause de garde traite le cas particulier et sort ; le reste de la méthode reste à plat.
  - key: trous-sinon
    format: fill-in
    question: |-
      Complétez :
      ```java
      if (age >= 18) {
          statut = "majeur";
      } ___ {
          statut = "mineur";
      }
      ```
    blanks: [[else]]
    answer: '`else` donne le chemin quand la condition est fausse.'
  - key: trous-sinon-si
    format: fill-in
    question: |-
      Complétez pour tester un second cas :
      ```java
      if (temperature > 30) {
          conseil = "Hydratez-vous";
      } ___ ___ (temperature < 0) {
          conseil = "Couvrez-vous";
      }
      ```
    blanks: [[else], [if]]
    answer: '`else if` enchaîne une autre condition, testée seulement si la première est fausse.'
  - key: trous-condition
    format: fill-in
    question: |-
      Complétez pour n'afficher que les quantités positives :
      ```java
      if (quantite ___ 0) {
          System.out.println(quantite);
      }
      ```
    blanks: [[">"]]
    answer: "La condition doit être un booléen : une comparaison."
  - key: trous-garde
    format: fill-in
    question: |-
      Complétez la clause de garde :
      ```java
      double moyenne(int[] notes) {
          if (notes.length == 0) {
              ___ 0;
          }
          // ...
      }
      ```
    blanks: [[return]]
    answer: '`return` sort immédiatement de la méthode.'
  - key: code-ordre
    format: code-output
    question: |-
      ```java
      int note = 18;
      if (note >= 10) {
          System.out.println("Admis");
      } else if (note >= 16) {
          System.out.println("Très bien");
      }
      ```
    answer: '`Admis` : la première condition vraie l''emporte, la seconde n''est jamais testée.'
    check:
      output: "Admis"
  - key: code-sans-accolades
    format: code-output
    question: |-
      ```java
      int x = -1;
      if (x > 0)
          System.out.println("positif");
          System.out.println("fin");
      ```
    answer: '`fin` : sans accolades, seule la première ligne dépend du `if` ; l''indentation de la seconde ne change rien.'
    check:
      output: "fin"
  - key: code-point-virgule
    format: code-output
    question: |-
      ```java
      int x = -5;
      if (x > 0); {
          System.out.println("positif");
      }
      ```
    answer: '`positif` : le `;` termine le `if`, et le bloc qui suit s''exécute toujours.'
    check:
      output: "positif"
  - key: code-else-if
    format: code-output
    question: |-
      ```java
      int t = 15;
      if (t > 30) {
          System.out.println("chaud");
      } else if (t > 10) {
          System.out.println("doux");
      } else {
          System.out.println("froid");
      }
      ```
    answer: '`doux` : `t > 30` est faux, `t > 10` est vrai.'
    check:
      output: "doux"
  - key: bug-ordre-des-conditions
    format: bug-fix
    question: |-
      La mention « Très bien » n'est jamais donnée :
      ```java
      if (note >= 10) {
          mention = "Admis";
      } else if (note >= 16) {
          mention = "Très bien";
      }
      ```
    answer: |-
      ```java
      if (note >= 16) {
          mention = "Très bien";
      } else if (note >= 10) {
          mention = "Admis";
      }
      ```
      Une note de 16 est aussi `>= 10` : la première branche l'attrape. On teste le cas le plus restrictif d'abord.
  - key: bug-point-virgule
    format: bug-fix
    question: |-
      Le message s'affiche même pour un solde positif :
      ```java
      if (solde < 0); {
          System.out.println("Découvert !");
      }
      ```
    answer: |-
      ```java
      if (solde < 0) {
          System.out.println("Découvert !");
      }
      ```
      Le point-virgule termine le `if` ; le bloc n'en dépendait plus.
  - key: bug-accolades
    format: bug-fix
    question: |-
      Le compteur augmente même quand la commande n'est pas payée :
      ```java
      if (commande.estPayee())
          expedier(commande);
          expediees++;
      ```
    answer: |-
      ```java
      if (commande.estPayee()) {
          expedier(commande);
          expediees++;
      }
      ```
      Sans accolades, seul `expedier` dépendait du `if`.
  - key: bug-condition-entiere
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: int cannot be converted to boolean`) :
      ```java
      int erreurs = verifier(formulaire);
      if (erreurs) {
          afficherErreurs();
      }
      ```
    answer: |-
      ```java
      if (erreurs > 0) {
          afficherErreurs();
      }
      ```
      En Java, la condition est un booléen : il faut comparer le nombre.
