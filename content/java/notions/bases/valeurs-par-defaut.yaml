notion: valeurs-par-defaut
lesson: |-
  Java ne laisse jamais lire une mémoire non initialisée, mais les règles diffèrent selon l'endroit :

  | Où | Valeur sans initialisation |
  |---|---|
  | **Champ** (d'instance ou `static`) | une valeur par défaut |
  | **Élément de tableau** | une valeur par défaut |
  | **Variable locale** | **aucune** : la lire est une erreur de compilation |

  Les valeurs par défaut : `0` pour les entiers, `0.0` pour `float` et `double`, `false` pour `boolean`, `'\u0000'`
  pour `char`, et **`null`** pour toute référence (`String`, `Integer`, tableaux, objets).

  ```java
  class Compteur {
      int valeur;       // 0
      String nom;       // null
  }

  void calculer() {
      int total;
      System.out.println(total); // erreur : variable total might not have been initialized
  }
  ```

  Le compilateur vérifie l'**affectation certaine** (*definite assignment*) : chaque chemin doit avoir affecté la
  variable locale avant sa lecture. Un champ `final`, lui, doit être affecté exactement une fois, au plus tard dans le
  constructeur.

  **Piège classique** : un champ `Integer` ou `String` vaut `null`, pas 0 ni "" ; l'utiliser comme un nombre ou une
  chaîne lève une `NullPointerException`.

  **En entretien** : « Les champs et les tableaux ont des valeurs par défaut (0, false, null) ; les variables locales
  n'en ont pas et doivent être initialisées avant lecture. »
tour:
  - title: Les valeurs par défaut
    text: |-
      Un **champ** non initialisé reçoit une valeur par défaut : `0` pour les nombres, `false` pour un `boolean`, le
      caractère nul pour un `char`, et `null` pour une référence. Les éléments d'un nouveau tableau aussi.

      Une **variable locale**, elle, n'a pas de valeur par défaut : le compilateur refuse de la lire avant de lui en
      avoir donné une.
    example:
      files:
        Main.java: |-
          class Reglages {
              int volume;
              boolean muet;
              String theme;
          }

          void main() {
              Reglages r = new Reglages();
              IO.println(r.volume + " " + r.muet + " " + r.theme);
              double[] mesures = new double[3];
              IO.println(Arrays.toString(mesures));
          }
      output: |-
        0 false null
        [0.0, 0.0, 0.0]
cards:
  - key: valeur-defaut-variable-locale
    format: course
    question: "Quelle est la valeur par défaut d'une variable locale ?"
    choices:
      - {text: "Aucune : la lire sans l'initialiser ne compile pas", correct: true}
      - {text: "0, `false` ou `null` selon son type, comme un champ", correct: false}
      - {text: "`null`, quel que soit son type", correct: false}
      - {text: "Ce qui traînait en mémoire, comme en C", correct: false}
    answer: "Aucune : il faut l'initialiser, sinon erreur de compilation. Les champs et les cases de tableau, eux, ont une valeur par défaut (0, `false`, `null`)."
  - key: valeurs-champs
    format: course
    question: "Quelles sont les valeurs par défaut des champs selon leur type ?"
    choices:
      - {text: "0 pour les nombres, `false`, `'\\u0000'` pour `char` et `null` pour les références", correct: true}
      - {text: "0 pour les nombres, `false`, `' '` pour `char` et `\"\"` pour une `String`", correct: false}
      - {text: "Aucune : un champ jamais affecté fait échouer la compilation", correct: false}
      - {text: "`null` pour tous les champs, types primitifs compris", correct: false}
    answer: "`0` pour les entiers, `0.0` pour les décimaux, `false` pour `boolean`, `'\\u0000'` pour `char`, `null` pour les références. Une `String` non affectée vaut donc `null`, pas `\"\"`."
  - key: elements-tableau
    format: course
    question: "Que contient `new String[3]` juste après sa création ?"
    choices:
      - {text: "Trois `null`", correct: true}
      - {text: "Trois chaînes vides `\"\"`", correct: false}
      - {text: "Rien : sa longueur reste 0 jusqu'au premier ajout", correct: false}
      - {text: "Des valeurs au hasard, à initialiser", correct: false}
    answer: "Trois `null` : les éléments d'un tableau reçoivent la valeur par défaut de leur type, et celle d'une référence est `null`. La longueur, elle, vaut 3 dès la création."
  - key: affectation-certaine
    format: course
    question: "Qu'est-ce que l'affectation certaine (*definite assignment*) ?"
    choices:
      - {text: "La vérification, par le compilateur, qu'une variable locale est affectée sur tous les chemins avant d'être lue", correct: true}
      - {text: "La règle qui donne 0, `false` ou `null` à toute variable que le programme n'a pas encore affectée", correct: false}
      - {text: "La vérification, par la JVM à l'exécution, qu'aucune variable n'est lue avant d'avoir reçu une valeur", correct: false}
      - {text: "La règle qui interdit d'affecter deux fois une même variable locale, sauf si elle est déclarée `var`", correct: false}
    answer: "La vérification, par le compilateur, que chaque chemin du code affecte une variable locale (ou un champ `final`) avant qu'elle soit lue. Elle a lieu à la compilation, pas à l'exécution."
  - key: vf-locale-zero
    format: true-false
    question: Une variable locale `int` non initialisée vaut 0.
    truth: false
    answer: La lire ne compile pas ; seuls les champs et les éléments de tableau valent 0 par défaut.
  - key: vf-boolean-champ
    format: true-false
    question: Un champ `boolean` non initialisé vaut `false`.
    truth: true
    answer: C'est sa valeur par défaut.
  - key: vf-integer-zero
    format: true-false
    question: Un champ `Integer` non initialisé vaut 0.
    truth: false
    answer: "C'est une référence : il vaut `null`."
  - key: vf-static
    format: true-false
    question: Un champ `static int` non initialisé vaut 0.
    truth: true
    answer: Les champs `static` reçoivent les mêmes valeurs par défaut que les champs d'instance.
  - key: qcm-defaut-double
    format: multiple-choice
    question: Que contient l'élément `t[0]` de `double[] t = new double[5];` ?
    choices:
      - text: "`0.0`"
        correct: true
      - text: "`null`"
        correct: false
      - text: "`NaN`"
        correct: false
      - text: "Une valeur indéterminée"
        correct: false
    answer: Les éléments d'un tableau de `double` valent `0.0`.
  - key: qcm-compile
    format: multiple-choice
    question: Lesquelles de ces lectures compilent ?
    choices:
      - text: "Lire un champ `int` jamais affecté"
        correct: true
      - text: "Lire un élément de `new int[3]`"
        correct: true
      - text: "Lire une variable locale `int` jamais affectée"
        correct: false
      - text: "Lire une variable locale affectée dans un seul des deux cas d'un `if`"
        correct: false
    answer: Une variable locale doit être affectée sur tous les chemins avant sa lecture.
  - key: qcm-char
    format: multiple-choice
    question: Quelle est la valeur par défaut d'un champ `char` ?
    choices:
      - text: "`'\\u0000'`"
        correct: true
      - text: "`' '` (une espace)"
        correct: false
      - text: "`null`"
        correct: false
      - text: "`'0'`"
        correct: false
    answer: Le caractère de code 0, qui n'est ni une espace ni le chiffre zéro.
  - key: qcm-final
    format: multiple-choice
    question: "Où peut-on affecter un champ d'instance `final` déclaré sans valeur ?"
    choices:
      - {text: "Dans chaque constructeur", correct: true}
      - {text: "Dans n'importe quelle méthode de la classe", correct: false}
      - {text: "Dans un bloc `static` de la classe", correct: false}
      - {text: "Nulle part : il garde sa valeur par défaut, 0", correct: false}
    answer: "Dans chaque constructeur (ou dans un bloc d'initialisation d'instance) : il doit être affecté exactement une fois pendant la construction de l'objet. Une méthode peut être appelée plusieurs fois, et un bloc `static` ne connaît aucun objet."
  - key: code-champs
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Profil {
          int age;
          String nom;
          boolean actif;
      }
      Profil p = new Profil();
      System.out.println(p.age + " " + p.nom + " " + p.actif);
      ```
    choices:
      - {text: "`0 null false`", correct: true}
      - {text: "`null null null`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: "`0 null false` : les valeurs par défaut des champs. Contrairement aux variables locales, un champ jamais affecté se lit sans erreur, et concaténer `null` n'en lève pas."
    check:
      output: "0 null false"
  - key: code-tableau-double
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      double[] notes = new double[3];
      String[] noms = new String[2];
      System.out.println(notes[1] + " " + noms[0]);
      ```
    choices:
      - {text: "`0.0 null`", correct: true}
      - {text: "`0 null`", correct: false}
      - {text: "`null null`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: "`0.0 null` : chaque case reçoit la valeur par défaut de son type, `0.0` pour un `double` et `null` pour une `String`, pas une chaîne vide."
    check:
      output: "0.0 null"
  - key: code-locale
    format: code-output
    question: |-
      ```java
      static int calculer() {
          int total;
          return total + 1;
      }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas : `total` est lue sans avoir été initialisée", correct: true}
      - {text: "Oui : `total` vaut 0 par défaut, et la méthode renvoie 1", correct: false}
      - {text: "Oui, mais l'appel lève une `NullPointerException`", correct: false}
      - {text: "Oui, avec un simple avertissement ; la méthode renvoie 1", correct: false}
    answer: "Non : `variable total might not have been initialized`. Une variable locale n'a pas de valeur par défaut, contrairement à un champ."
    check:
      compiles: false
  - key: code-unboxing-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Integer[] scores = new Integer[2];
      int premier = scores[0];
      System.out.println(premier);
      ```
    choices:
      - {text: "Une `NullPointerException`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "Une `NullPointerException` : l'élément d'un `Integer[]` vaut `null`, pas 0, et le déballer en `int` échoue. Le compilateur accepte ce déballage automatique."
    check:
      throws: NullPointerException
  - key: bug-locale
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable somme might not have been initialized`). Quelle correction est la bonne ?
      ```java
      int somme;
      for (int n : nombres) {
          somme += n;
      }
      ```
    choices:
      - {text: "Initialiser avant la boucle : `int somme = 0;`", correct: true}
      - {text: "Déclarer `Integer somme;`, qui vaut `null` par défaut", correct: false}
      - {text: "Écrire `somme = somme + n;` au lieu de `+=`", correct: false}
      - {text: "Déclarer la variable `static int somme;`", correct: false}
    answer: |-
      ```java
      int somme = 0;
      for (int n : nombres) {
          somme += n;
      }
      ```
      Une variable locale n'a pas de valeur par défaut, `Integer` pas plus qu'`int` : on l'initialise avant la boucle.
  - key: bug-champ-integer
    format: bug-fix
    question: |-
      `panier.ajouter()` lève une `NullPointerException`. Quelle correction est la bonne ?
      ```java
      class Panier {
          private Integer quantite;
          void ajouter() { quantite++; }
      }
      ```
    choices:
      - {text: "Déclarer le champ en `int` : `private int quantite;`", correct: true}
      - {text: "Écrire `quantite += 1;` au lieu de `quantite++;`", correct: false}
      - {text: "Écrire `++quantite;` au lieu de `quantite++;`", correct: false}
      - {text: "Déclarer le champ `static Integer quantite;`", correct: false}
    answer: |-
      ```java
      class Panier {
          private int quantite;
          void ajouter() { quantite++; }
      }
      ```
      Un champ `Integer` vaut `null` par défaut ; un `int` vaut 0. On garde le primitif quand l'absence de valeur n'a pas de sens. Toute écriture de l'incrément déballe `null` et échoue pareil.
  - key: bug-champ-string
    format: bug-fix
    question: |-
      `new Message().longueur()` lève une `NullPointerException`. Quelle correction est la bonne ?
      ```java
      class Message {
          private String texte;
          int longueur() { return texte.length(); }
      }
      ```
    choices:
      - {text: "Initialiser le champ : `private String texte = \"\";`", correct: true}
      - {text: "Rendre le champ `final` : `private final String texte;`", correct: false}
      - {text: "Rendre le champ `static` : `private static String texte;`", correct: false}
      - {text: "Remplacer `texte.length()` par `texte.size()`", correct: false}
    answer: |-
      ```java
      class Message {
          private String texte = "";
          int longueur() { return texte.length(); }
      }
      ```
      Un champ `String` vaut `null`, pas `""` ; on l'initialise (ou on l'impose dans le constructeur). Un champ `final` jamais affecté ne compilerait même pas.
  - key: bug-chemin-incomplet
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable remise might not have been initialized`). Quelle correction est la bonne ?
      ```java
      double remise;
      if (client.estFidele()) {
          remise = 0.1;
      }
      return prix * (1 - remise);
      ```
    choices:
      - {text: "`double remise = client.estFidele() ? 0.1 : 0.0;`", correct: true}
      - {text: "Déclarer `Double remise;` à la place de `double remise;`", correct: false}
      - {text: "Déclarer `final double remise;` à la place", correct: false}
      - {text: "Déplacer `remise = 0.1;` après le `if`, hors du bloc", correct: false}
    answer: |-
      ```java
      double remise = client.estFidele() ? 0.1 : 0.0;
      return prix * (1 - remise);
      ```
      Quand le client n'est pas fidèle, `remise` n'est jamais affectée : il faut une valeur sur tous les chemins. Sortir l'affectation du `if` compilerait, mais donnerait la remise à tout le monde.
