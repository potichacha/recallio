notion: commentaires-javadoc
lesson: |-
  Java a trois formes de commentaires :

  ```java
  // commentaire sur une ligne

  /* commentaire
     sur plusieurs lignes */

  /**
   * Commentaire Javadoc : documente l'élément qui le suit.
   *
   * @param prixHt le prix hors taxes
   * @return le prix toutes taxes comprises
   * @throws IllegalArgumentException si le prix est négatif
   */
  public static double ttc(double prixHt) { ... }
  ```

  - La **Javadoc** (`/** ... */`) se place juste avant une classe, une méthode ou un champ. L'outil `javadoc` en tire une
    documentation HTML, et l'IDE l'affiche au survol.
  - Ses balises courantes : `@param`, `@return`, `@throws`, `@see`, `{@code ...}` pour du code, `{@link ...}` pour un
    lien vers un autre élément.
  - Un bon commentaire explique le **pourquoi** (une contrainte, un choix, un piège), pas le **quoi** que le code dit
    déjà : `i++; // incrémente i` n'apporte rien.
  - On documente en Javadoc l'**API publique** : ce qu'un appelant doit savoir sans lire le code.

  **Piège classique** : un commentaire qui n'est plus à jour. Le code a changé, le commentaire non : il trompe le
  lecteur, ce qui est pire que pas de commentaire.

  **En entretien** : « Javadoc pour le contrat de l'API publique, commentaires ordinaires pour le pourquoi ; le code
  bien nommé dit le quoi. »
tour:
  - title: Commentaires et Javadoc
    text: |-
      Java a trois formes de commentaires : `//` jusqu'à la fin de la ligne, `/* … */` sur plusieurs lignes, et
      `/** … */`, le commentaire **Javadoc**, placé juste avant une classe ou une méthode pour la documenter.

      L'outil `javadoc` en tire une documentation HTML, et les balises `@param`, `@return` et `@throws` décrivent les
      paramètres, le résultat et les exceptions.
    example:
      files:
        Main.java: |-
          /**
           * Calcule l'aire d'un rectangle.
           *
           * @param largeur la largeur, en mètres
           * @param hauteur la hauteur, en mètres
           * @return l'aire, en mètres carrés
           */
          double aire(double largeur, double hauteur) {
              return largeur * hauteur; // une simple multiplication
          }

          void main() {
              /* Un commentaire
                 sur plusieurs lignes. */
              IO.println(aire(3, 4.5));
          }
      output: |-
        13.5
cards:
  - key: trois-formes
    format: course
    question: Quelles sont les trois formes de commentaires en Java ?
    choices:
      - text: "`//`, `#` et `<!-- ... -->`"
        correct: false
      - text: "`//`, `/* ... */` et `/** ... */`"
        correct: true
      - text: "`//` seulement, au début de chaque ligne"
        correct: false
      - text: "`/* ... */`, `--` et `'''`"
        correct: false
    answer: '`//` sur une ligne, `/* ... */` sur plusieurs lignes, et `/** ... */` pour la Javadoc.'
  - key: role-javadoc
    format: course
    question: À quoi sert un commentaire Javadoc ?
    choices:
      - text: "À marquer le code à supprimer plus tard"
        correct: false
      - text: "À désactiver du code pendant les tests"
        correct: false
      - text: "À documenter l'élément qui le suit ; l'outil `javadoc` en tire une documentation HTML"
        correct: true
      - text: "À donner des consignes au compilateur"
        correct: false
    answer: |-
      À documenter l'élément qui le suit (classe, méthode, champ) : l'outil `javadoc` en génère une documentation HTML,
      et l'IDE l'affiche au survol.
  - key: balises
    format: course
    question: "Lesquelles de ces balises existent en Javadoc ?"
    choices:
      - text: "`@throws`"
        correct: true
      - text: "`@param`"
        correct: true
      - text: "`@return`"
        correct: true
      - text: "`@output`"
        correct: false
      - text: "`@input`"
        correct: false
    answer: "`@param` (un paramètre), `@return` (la valeur renvoyée), `@throws` (une exception possible) ; aussi `{@code}`, `{@link}` et `@see`. `@input` et `@output` n'existent pas."
  - key: pourquoi-pas-quoi
    format: course
    question: Que doit expliquer un bon commentaire ?
    choices:
      - text: "Le pourquoi : une contrainte, un choix, un piège"
        correct: true
      - text: "Le quoi : ce que fait chaque ligne"
        correct: false
      - text: "L'historique des modifications du fichier"
        correct: false
      - text: "Le nom de l'auteur de chaque ligne"
        correct: false
    answer: Le **pourquoi** (une contrainte, un choix, un piège) ; le **quoi** se lit dans un code bien nommé.
  - key: vf-javadoc-syntaxe
    format: true-false
    question: Un commentaire Javadoc commence par `/**`.
    truth: true
    answer: Avec deux étoiles ; `/*` avec une seule est un commentaire ordinaire.
  - key: vf-compile
    format: true-false
    question: Les commentaires sont compilés dans le bytecode.
    truth: false
    answer: Le compilateur les ignore ; ils ne servent qu'aux lecteurs (et à l'outil `javadoc`).
  - key: vf-commentaire-obsolete
    format: true-false
    question: Un commentaire qui n'est plus à jour est inoffensif.
    truth: false
    answer: Il trompe le lecteur, ce qui est pire que pas de commentaire du tout.
  - key: vf-imbriquer
    format: true-false
    question: On peut imbriquer un `/* ... */` dans un autre `/* ... */`.
    truth: false
    answer: Le premier `*/` rencontré ferme le commentaire ; la suite devient du code invalide.
  - key: qcm-balise-retour
    format: multiple-choice
    question: Quelle balise Javadoc décrit la valeur renvoyée par une méthode ?
    choices:
      - text: "`@return`"
        correct: true
      - text: "`@param`"
        correct: false
      - text: "`@throws`"
        correct: false
      - text: "`@result`"
        correct: false
    answer: '`@return`, une seule fois par méthode non `void`.'
  - key: qcm-utile
    format: multiple-choice
    question: Lequel de ces commentaires est utile ?
    choices:
      - text: "`// Le fournisseur renvoie les montants en centimes`"
        correct: true
      - text: "`// incrémente i`"
        correct: false
      - text: "`// boucle`"
        correct: false
      - text: "`// return du résultat`"
        correct: false
    answer: Il donne une information qu'on ne lit pas dans le code ; les autres répètent le code.
  - key: qcm-ou-placer
    format: multiple-choice
    question: Où place-t-on la Javadoc d'une méthode ?
    choices:
      - text: "Juste avant la déclaration de la méthode"
        correct: true
      - text: "À la première ligne du corps de la méthode"
        correct: false
      - text: "À la fin du fichier"
        correct: false
      - text: "Dans un fichier séparé"
        correct: false
    answer: La Javadoc documente l'élément qui la suit immédiatement.
  - key: qcm-code-inline
    format: multiple-choice
    question: Comment écrire un morceau de code dans une phrase de Javadoc ?
    choices:
      - text: "`{@code null}`"
        correct: true
      - text: "`@code null`"
        correct: false
      - text: "`'null'`"
        correct: false
      - text: "`${null}`"
        correct: false
    answer: '`{@code ...}` affiche le texte en police de code, sans interpréter le HTML.'
  - key: bug-commentaire-faux
    format: bug-fix
    question: |-
      Le code est juste, mais le commentaire ment. Quelle correction est la bonne ?
      ```java
      // Renvoie le prix hors taxes
      static double prix(double ht) {
          return ht * 1.2;
      }
      ```
    choices:
      - text: "Dire que la méthode renvoie le prix TTC, et la renommer `prixTtc`"
        correct: true
      - text: "Remplacer `//` par `/*`"
        correct: false
      - text: "Ajouter `@return` au commentaire `//`"
        correct: false
      - text: "Retirer `* 1.2`, pour que le code suive le commentaire"
        correct: false
    answer: |-
      ```java
      /** Le prix toutes taxes comprises, avec une TVA de 20 %. */
      static double prixTtc(double ht) {
          return ht * 1.2;
      }
      ```
      Le commentaire était resté sur l'ancien comportement ; renommer la méthode rend aussi le code plus clair.
  - key: bug-commentaire-inutile
    format: bug-fix
    question: |-
      Ces commentaires répètent le code. Comment l'améliorer ?
      ```java
      // on parcourt la liste
      for (Commande c : liste) {
          // si la commande a plus de 30 jours
          if (c.age() > 30) {
              archiver(c);
          }
      }
      ```
    choices:
      - text: "Raccourcir les commentaires"
        correct: false
      - text: "Supprimer les commentaires et nommer clairement : `commandes`, `estAncienne()`"
        correct: true
      - text: "Transformer chaque commentaire en Javadoc"
        correct: false
      - text: "Commenter aussi les lignes restantes"
        correct: false
    answer: |-
      ```java
      for (Commande commande : commandes) {
          if (commande.estAncienne()) {
              archiver(commande);
          }
      }
      ```
      Des noms explicites (`commandes`, `estAncienne`) disent ce que disaient les commentaires, sans risque qu'ils
      vieillissent.
  - key: bug-commentaire-imbrique
    format: bug-fix
    question: |-
      Ce code ne compile pas. Pourquoi ?
      ```java
      /* désactivé pour l'instant
         calculer(); /* étape lente */
         envoyer();
      */
      ```
    choices:
      - text: "Le premier `*/` ferme le commentaire : `envoyer(); */` devient du code invalide"
        correct: true
      - text: "Un commentaire ne peut pas contenir d'accent"
        correct: false
      - text: "Un commentaire `/* ... */` doit tenir sur une ligne"
        correct: false
      - text: "La méthode `calculer()` n'existe pas"
        correct: false
    answer: |-
      ```java
      // désactivé pour l'instant
      // calculer(); // étape lente
      // envoyer();
      ```
      Le premier `*/` ferme le commentaire, et `envoyer(); */` devient du code invalide. Avec `//` sur chaque ligne, le
      problème disparaît (et un gestionnaire de versions vaut mieux que du code commenté).
  - key: bug-javadoc-incomplete
    format: bug-fix
    question: |-
      La Javadoc ne dit rien du cas d'erreur, que l'appelant découvre en production. Que faut-il ajouter à la Javadoc ?
      ```java
      /** Retire le montant du compte. */
      public void debiter(double montant) {
          if (montant > solde) throw new IllegalStateException("Solde insuffisant");
          solde -= montant;
      }
      ```
    choices:
      - text: "Une balise `@return`, qui décrit le nouveau solde"
        correct: false
      - text: "Une balise `@deprecated`"
        correct: false
      - text: "Une balise `@throws IllegalStateException`, qui dit quand elle est levée"
        correct: true
      - text: "Rien : une exception n'a pas sa place dans la Javadoc"
        correct: false
    answer: |-
      ```java
      /**
       * Retire le montant du compte.
       *
       * @param montant le montant à retirer, positif
       * @throws IllegalStateException si le solde est insuffisant
       */
      ```
      La Javadoc décrit le contrat complet : paramètres, résultat et exceptions possibles.
