notion: tableaux-multidimensionnels
lesson: |-
  Un tableau à deux dimensions est un **tableau de tableaux** :

  ```java
  int[][] grille = new int[3][4];      // 3 lignes de 4 colonnes, remplies de 0
  grille[1][2] = 7;                     // ligne 1, colonne 2
  int[][] dames = {{1, 0}, {0, 1}};     // créé et rempli d'un coup
  ```

  - `grille.length` est le nombre de **lignes** ; `grille[i].length` le nombre de colonnes de la ligne `i`.
  - On parcourt avec deux boucles imbriquées : les lignes, puis les colonnes de chaque ligne.
  - Les lignes peuvent avoir des longueurs différentes : c'est un tableau **irrégulier** (*jagged*).
    ```java
    int[][] triangle = new int[3][];  // les lignes restent à créer
    triangle[0] = new int[1];
    triangle[1] = new int[2];
    ```
  - On affiche avec `Arrays.deepToString`, et on compare avec `Arrays.deepEquals`.

  **Piège classique** : utiliser `grille.length` comme nombre de colonnes. Sur une grille de 3 × 4, la boucle des
  colonnes s'arrêterait à 3 ; sur une grille irrégulière, elle déborderait. On prend toujours `grille[i].length`.

  **En entretien** : « En Java, un tableau 2D est un tableau de tableaux : chaque ligne est un objet, qui peut avoir sa
  propre longueur. »
cards:
  - key: tableau-de-tableaux
    format: course
    question: Comment Java représente-t-il un tableau à deux dimensions ?
    answer: "Comme un tableau de tableaux : `int[][]` est un tableau dont chaque case est un `int[]`, une ligne."
  - key: dimensions
    format: course
    question: Dans `int[][] g = new int[3][4];`, que valent `g.length` et `g[0].length` ?
    answer: '`3` (le nombre de lignes) et `4` (le nombre de colonnes de la ligne 0).'
  - key: irregulier
    format: course
    question: Qu'est-ce qu'un tableau irrégulier (*jagged array*) ?
    answer: Un tableau 2D dont les lignes ont des longueurs différentes, possible parce que chaque ligne est un tableau indépendant.
  - key: afficher-2d
    format: course
    question: Comment afficher le contenu d'un tableau 2D ?
    answer: '`Arrays.deepToString(grille)`, qui donne par exemple `[[1, 0], [0, 1]]`.'
  - key: vf-meme-longueur
    format: true-false
    question: Toutes les lignes d'un `int[][]` ont forcément la même longueur.
    truth: false
    answer: "Chaque ligne est un tableau indépendant : ses longueurs peuvent varier."
  - key: vf-length-lignes
    format: true-false
    question: "`grille.length` donne le nombre de lignes."
    truth: true
    answer: Le nombre de colonnes d'une ligne est `grille[i].length`.
  - key: vf-lignes-null
    format: true-false
    question: "Après `int[][] t = new int[3][];`, `t[0]` vaut `null`."
    truth: true
    answer: Seul le tableau des lignes est créé ; chaque ligne reste à créer.
  - key: vf-deep-equals
    format: true-false
    question: "`Arrays.equals` compare correctement le contenu de deux tableaux 2D."
    truth: false
    answer: Elle comparerait les références des lignes ; il faut `Arrays.deepEquals`.
  - key: qcm-acces
    format: multiple-choice
    question: Comment lire la case de la ligne 2, colonne 0 ?
    choices:
      - text: "`grille[2][0]`"
        correct: true
      - text: "`grille[0][2]`"
        correct: false
      - text: "`grille[2, 0]`"
        correct: false
      - text: "`grille(2)(0)`"
        correct: false
    answer: D'abord la ligne, puis la colonne, chacune entre crochets.
  - key: qcm-nombre-cases
    format: multiple-choice
    question: Combien de cases contient `new int[4][5]` ?
    choices:
      - text: "20"
        correct: true
      - text: "9"
        correct: false
      - text: "5"
        correct: false
      - text: "4"
        correct: false
    answer: 4 lignes de 5 colonnes.
  - key: qcm-boucle-colonnes
    format: multiple-choice
    question: Quelle borne utiliser pour les colonnes de la ligne `i` ?
    choices:
      - text: "`grille[i].length`"
        correct: true
      - text: "`grille.length`"
        correct: false
      - text: "`grille[0].length`, pour toutes les lignes"
        correct: false
      - text: "`grille.length - i`"
        correct: false
    answer: Chaque ligne a sa propre longueur ; `grille[0].length` ne convient que si la grille est régulière.
  - key: qcm-deep-to-string
    format: multiple-choice
    question: "Qu'affiche `Arrays.deepToString(new int[][] {{1, 2}, {3}})` ?"
    choices:
      - text: "`[[1, 2], [3]]`"
        correct: true
      - text: "`[1, 2, 3]`"
        correct: false
      - text: "`[[1, 2], [3, 0]]`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: "Le tableau est irrégulier : la seconde ligne n'a qu'une case."
  - key: code-somme-grille
    format: code-output
    question: |-
      ```java
      int[][] g = {{1, 2}, {3, 4}};
      int somme = 0;
      for (int[] ligne : g) {
          for (int x : ligne) {
              somme += x;
          }
      }
      System.out.println(somme);
      ```
    answer: '`10` : 1 + 2 + 3 + 4.'
    check:
      output: "10"
  - key: code-dimensions
    format: code-output
    question: |-
      ```java
      int[][] g = new int[3][4];
      System.out.println(g.length + " " + g[0].length);
      ```
    answer: '`3 4` : 3 lignes de 4 colonnes.'
    check:
      output: "3 4"
  - key: code-irregulier
    format: code-output
    question: |-
      ```java
      int[][] t = {{1}, {1, 2}, {1, 2, 3}};
      System.out.println(t[2].length + " " + t[1][1]);
      ```
    answer: '`3 2` : la ligne 2 a trois cases, et la ligne 1 contient 2 en colonne 1.'
    check:
      output: "3 2"
  - key: code-ligne-null
    format: code-output
    question: |-
      ```java
      int[][] t = new int[2][];
      System.out.println(t[0]);
      ```
    answer: '`null` : les lignes n''ont pas encore été créées.'
    check:
      output: "null"
  - key: bug-colonnes
    format: bug-fix
    question: |-
      Sur une grille de 3 lignes et 4 colonnes, la dernière colonne n'est jamais affichée :
      ```java
      for (int i = 0; i < grille.length; i++) {
          for (int j = 0; j < grille.length; j++) {
              System.out.print(grille[i][j]);
          }
      }
      ```
    answer: |-
      ```java
      for (int j = 0; j < grille[i].length; j++) {
      ```
      `grille.length` est le nombre de lignes ; les colonnes se comptent avec `grille[i].length`.
  - key: bug-ligne-non-creee
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` :
      ```java
      int[][] triangle = new int[3][];
      triangle[0][0] = 1;
      ```
    answer: |-
      ```java
      int[][] triangle = new int[3][];
      triangle[0] = new int[1];
      triangle[0][0] = 1;
      ```
      Avec `new int[3][]`, les lignes valent `null` : il faut créer chacune avant d'y écrire.
  - key: bug-deep-equals
    format: bug-fix
    question: |-
      Ce test échoue alors que les deux grilles sont identiques :
      ```java
      assertTrue(Arrays.equals(attendue, obtenue));
      ```
    answer: |-
      ```java
      assertTrue(Arrays.deepEquals(attendue, obtenue));
      ```
      `Arrays.equals` compare les lignes par référence ; `deepEquals` compare leur contenu.
  - key: bug-inversion
    format: bug-fix
    question: |-
      Ce code lève une `ArrayIndexOutOfBoundsException` sur une grille de 2 lignes et 3 colonnes :
      ```java
      for (int i = 0; i < grille[0].length; i++) {
          for (int j = 0; j < grille.length; j++) {
              total += grille[i][j];
          }
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < grille.length; i++) {
          for (int j = 0; j < grille[i].length; j++) {
              total += grille[i][j];
          }
      }
      ```
      Les bornes étaient inversées : `i` (les lignes) allait jusqu'au nombre de colonnes.
