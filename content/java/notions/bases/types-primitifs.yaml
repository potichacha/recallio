notion: types-primitifs
lesson: |-
  Java a **huit types primitifs** : des valeurs simples, rangées directement dans la variable (pas d'objet).

  | Type | Taille | Valeurs |
  |---|---|---|
  | `byte` | 8 bits | -128 à 127 |
  | `short` | 16 bits | -32 768 à 32 767 |
  | `int` | 32 bits | environ ± 2,1 milliards |
  | `long` | 64 bits | environ ± 9,2 × 10¹⁸ |
  | `float` | 32 bits | nombre à virgule, ~7 chiffres significatifs |
  | `double` | 64 bits | nombre à virgule, ~15 chiffres significatifs |
  | `char` | 16 bits | un caractère UTF-16, de 0 à 65 535 |
  | `boolean` | (non précisée) | `true` ou `false` |

  - Un **littéral entier** (`42`) est un `int` ; pour un `long`, on ajoute `L` : `10_000_000_000L`.
  - Un **littéral à virgule** (`3.14`) est un `double` ; pour un `float`, on ajoute `f` : `3.14f`.
  - Un `char` s'écrit entre apostrophes (`'A'`), une chaîne entre guillemets (`"A"`) : ce n'est pas le même type.
  - `String` n'est **pas** un primitif : c'est une classe.

  Au quotidien : `int` pour compter, `long` pour les grands nombres (identifiants, durées en millisecondes), `double`
  pour les calculs à virgule, `boolean` pour les conditions. Pour de l'argent, aucun : on utilise `BigDecimal`.

  **Piège classique** : `long population = 8000000000;` ne compile pas. Le littéral est un `int`, trop grand : il faut
  `8000000000L`.

  **En entretien** : « Huit primitifs, quatre entiers de 8 à 64 bits, deux flottants, `char` sur 16 bits et `boolean` ;
  un littéral entier est un `int`, un littéral à virgule un `double`. »
tour:
  - title: Les types primitifs
    text: |-
      Java a huit types **primitifs**, qui ne sont pas des objets :

      - les entiers `byte` (8 bits), `short` (16), `int` (32) et `long` (64) ;
      - les flottants `float` (32 bits) et `double` (64) ;
      - `char`, un caractère UTF-16 sur 16 bits ;
      - `boolean`, qui vaut `true` ou `false`.

      Leur taille est la même sur toutes les machines. Un entier qui dépasse sa plage **déborde** en silence :
      `Integer.MAX_VALUE + 1` donne le plus petit `int`.
    example:
      files:
        Main.java: |-
          void main() {
              int entier = 42;
              long grand = 9_000_000_000L;
              double prix = 19.99;
              char lettre = 'é';
              boolean actif = true;
              IO.println(entier + " " + grand + " " + prix + " " + lettre + " " + actif);
              IO.println(Integer.MAX_VALUE + " " + (Integer.MAX_VALUE + 1));
              IO.println(Byte.MIN_VALUE + " " + Byte.MAX_VALUE);
          }
      output: |-
        42 9000000000 19.99 é true
        2147483647 -2147483648
        -128 127
    task:
      instructions: |-
        Fais afficher la plus grande valeur d'un `long`, avec la constante `Long.MAX_VALUE` : le programme doit afficher
        `9223372036854775807`.
      starter:
        Main.java: |-
          void main() {
              IO.println(Integer.MAX_VALUE);
          }
      solution:
        Main.java: |-
          void main() {
              IO.println(Long.MAX_VALUE);
          }
      output: |-
        9223372036854775807
cards:
  - key: combien-types-primitifs
    format: course
    question: Combien de types primitifs ?
    answer: 8, byte, short, int, long, float, double, char, boolean.
  - key: taille-int-long-char
    format: course
    question: Taille d'un int, d'un long, d'un char ?
    answer: 32 bits, 64 bits, 16 bits (unité UTF-16).
  - key: entiers-et-tailles
    format: course
    question: Quels sont les types entiers, et leurs tailles ?
    answer: '`byte` (8 bits), `short` (16), `int` (32) et `long` (64), tous signés.'
  - key: suffixe-l
    format: course
    question: Pourquoi écrit-on `10_000_000_000L` avec un `L` ?
    answer: |-
      Parce qu'un littéral entier est un `int` par défaut, et 10 milliards dépasse sa capacité. Le suffixe `L` en fait un
      `long`.
  - key: vf-string-primitif
    format: true-false
    question: "`String` est un type primitif."
    truth: false
    answer: '`String` est une classe ; les huit primitifs sont `byte`, `short`, `int`, `long`, `float`, `double`, `char` et `boolean`.'
  - key: vf-char-16-bits
    format: true-false
    question: Un `char` occupe 16 bits.
    truth: true
    answer: Il contient une unité de code UTF-16, de 0 à 65 535.
  - key: vf-byte-200
    format: true-false
    question: Un `byte` peut contenir la valeur 200.
    truth: false
    answer: Un `byte` va de -128 à 127.
  - key: vf-litteral-double
    format: true-false
    question: Le littéral `3.14` est de type `double`.
    truth: true
    answer: Un littéral à virgule est un `double` par défaut ; `3.14f` est un `float`.
  - key: qcm-pas-primitif
    format: multiple-choice
    question: Lequel n'est pas un type primitif ?
    choices:
      - text: "`String`"
        correct: true
      - text: "`int`"
        correct: false
      - text: "`boolean`"
        correct: false
      - text: "`char`"
        correct: false
    answer: '`String` est une classe de `java.lang`.'
  - key: qcm-taille-int
    format: multiple-choice
    question: Quelle est la taille d'un `int` ?
    choices:
      - text: "32 bits"
        correct: true
      - text: "16 bits"
        correct: false
      - text: "64 bits"
        correct: false
      - text: "Elle dépend de la machine"
        correct: false
    answer: Un `int` fait toujours 32 bits, quelle que soit la machine, contrairement au C.
  - key: qcm-type-litteral-entier
    format: multiple-choice
    question: De quel type est le littéral `42` ?
    choices:
      - text: "`int`"
        correct: true
      - text: "`long`"
        correct: false
      - text: "`short`"
        correct: false
      - text: "`byte`"
        correct: false
    answer: Un littéral entier est un `int`, sauf suffixe `L`.
  - key: qcm-nombres-a-virgule
    format: multiple-choice
    question: Quels types primitifs représentent des nombres à virgule ?
    choices:
      - text: "`float`"
        correct: true
      - text: "`double`"
        correct: true
      - text: "`long`"
        correct: false
      - text: "`short`"
        correct: false
    answer: '`float` (32 bits) et `double` (64 bits) ; on utilise `double` par défaut.'
  - key: trous-long
    format: fill-in
    question: |-
      Complétez avec le type qui convient :
      ```java
      ___ grand = 10_000_000_000L;
      ```
    blanks: [[long]]
    answer: Le suffixe `L` désigne un `long`, le seul entier assez grand pour 10 milliards.
  - key: trous-suffixe-float
    format: fill-in
    question: |-
      Complétez le littéral pour qu'il soit un `float` :
      ```java
      float taux = 0.5___;
      ```
    blanks: [[f, F]]
    answer: Sans suffixe, `0.5` est un `double`, qu'on ne peut pas affecter à un `float` sans cast.
  - key: trous-char
    format: fill-in
    question: |-
      Complétez avec le type qui convient :
      ```java
      ___ initiale = 'J';
      ```
    blanks: [[char]]
    answer: Les apostrophes délimitent un `char`.
  - key: trous-boolean
    format: fill-in
    question: |-
      Complétez avec le type qui convient :
      ```java
      ___ estMajeur = age >= 18;
      ```
    blanks: [[boolean]]
    answer: Une comparaison donne un `boolean`.
  - key: code-limites-byte
    format: code-output
    question: |-
      ```java
      System.out.println(Byte.MAX_VALUE + " " + Byte.MIN_VALUE);
      ```
    answer: '`127 -128` : un `byte` va de -128 à 127.'
    check:
      output: "127 -128"
  - key: code-max-int
    format: code-output
    question: |-
      ```java
      System.out.println(Integer.MAX_VALUE);
      ```
    answer: '`2147483647`, soit 2³¹ - 1.'
    check:
      output: "2147483647"
  - key: code-char-en-int
    format: code-output
    question: |-
      ```java
      System.out.println((int) 'A');
      ```
    answer: '`65` : un `char` est un nombre, le code du caractère.'
    check:
      output: "65"
  - key: code-max-char
    format: code-output
    question: |-
      ```java
      System.out.println(Character.MAX_VALUE + 0);
      ```
    answer: '`65535` : un `char` est un entier non signé sur 16 bits, et `+ 0` le convertit en `int` pour l''affichage.'
    check:
      output: "65535"
  - key: bug-long-sans-l
    format: bug-fix
    question: |-
      Ce code ne compile pas (`integer number too large`) :
      ```java
      long population = 8000000000;
      ```
    answer: |-
      ```java
      long population = 8_000_000_000L;
      ```
      Le littéral est un `int` par défaut, trop petit pour 8 milliards : le suffixe `L` en fait un `long`.
  - key: bug-float-sans-f
    format: bug-fix
    question: |-
      Ce code ne compile pas (`possible lossy conversion from double to float`) :
      ```java
      float prix = 9.99;
      ```
    answer: |-
      ```java
      float prix = 9.99f;
      ```
      `9.99` est un `double` ; le suffixe `f` en fait un `float`. Pour un prix, on préférerait d'ailleurs `BigDecimal`.
  - key: bug-boolean-entier
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      boolean actif = 1;
      ```
    answer: |-
      ```java
      boolean actif = true;
      ```
      En Java, un `boolean` vaut `true` ou `false`, jamais un nombre (contrairement au C).
  - key: bug-char-chaine
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      char lettre = "A";
      ```
    answer: |-
      ```java
      char lettre = 'A';
      ```
      Les guillemets créent une `String` ; un `char` s'écrit entre apostrophes.
