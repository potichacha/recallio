notion: methodes-statiques
lesson: |-
  `static` attache un membre à la **classe** plutôt qu'à chaque objet :

  ```java
  public class Compteur {
      private static int total = 0;      // un seul total, partagé par tous les compteurs
      private int valeur = 0;            // une valeur par objet

      public void incrementer() {
          valeur++;
          total++;
      }

      public static int total() {        // s'appelle sans objet : Compteur.total()
          return total;
      }
  }
  ```

  - Un **champ `static`** existe en un seul exemplaire, quel que soit le nombre d'objets.
  - Une **méthode `static`** s'appelle sur la classe (`Math.max(a, b)`) ; elle n'a pas de `this`, donc ne peut pas
    utiliser directement les champs ou méthodes d'instance.
  - Usages typiques : méthodes utilitaires sans état (`Math`, `Arrays`, `Integer.parseInt`), constantes
    (`static final`), méthodes de fabrique (`List.of`).
  - Un champ `static` **modifiable** est un état global partagé : difficile à tester et dangereux avec plusieurs
    threads. On le réserve aux constantes.

  **Piège classique** : appeler une méthode d'instance depuis `main`, qui est `static`. Le compilateur refuse
  (`non-static method cannot be referenced from a static context`) : il faut un objet.

  **En entretien** : « `static` appartient à la classe, sans `this` ; à réserver aux utilitaires sans état et aux
  constantes. »
tour:
  - title: Les méthodes static
    text: |-
      Une méthode `static` appartient à la **classe**, pas à un objet : on l'appelle avec le nom de la classe, comme
      `Math.max(3, 5)`, sans rien créer. Elle ne peut pas utiliser `this`, ni les champs d'instance.

      Un champ `static` est partagé par tous les objets de la classe. Dans la forme classique, `main` est `static` : la
      JVM l'appelle sans créer d'objet. Les classes utilitaires comme `Math` ou `Arrays` n'ont que des membres `static`.
    example:
      files:
        Main.java: |-
          public class Main {
              static int compteur = 0;

              static int suivant() {
                  compteur++;
                  return compteur;
              }

              public static void main(String[] args) {
                  IO.println(Math.max(3, 5) + " " + Math.abs(-7));
                  suivant();
                  suivant();
                  IO.println("compteur : " + Main.suivant());
              }
          }
      output: |-
        5 7
        compteur : 3
cards:
  - key: definition
    format: course
    question: Que signifie `static` sur un champ ?
    choices:
      - {text: "Le champ appartient à la classe : un seul exemplaire, partagé par tous les objets", correct: true}
      - {text: "Le champ ne peut plus changer de valeur après son initialisation", correct: false}
      - {text: "Chaque objet reçoit sa propre copie du champ, créée avec lui", correct: false}
      - {text: "Le champ n'est visible que depuis les méthodes de sa classe", correct: false}
    answer: "Que le champ appartient à la **classe** : il en existe un seul exemplaire, partagé par tous les objets."
  - key: sans-this
    format: course
    question: Pourquoi une méthode `static` ne peut-elle pas utiliser directement un champ d'instance ?
    choices:
      - {text: "Elle s'appelle sans objet : il n'y a pas de `this`, donc pas de champ d'instance", correct: true}
      - {text: "Les champs d'instance sont privés, et une méthode `static` est publique", correct: false}
      - {text: "Une méthode `static` ne peut lire que des constantes `static final`", correct: false}
      - {text: "Ce serait trop lent : il faudrait chercher le champ dans chaque objet créé", correct: false}
    answer: "Parce qu'elle s'appelle sans objet : il n'y a pas de `this`, donc pas de champ d'instance à lire."
  - key: usages
    format: course
    question: Quand une méthode `static` est-elle un bon choix ?
    choices:
      - {text: "Pour une méthode utilitaire sans état, qui ne dépend que de ses paramètres", correct: true}
      - {text: "Pour une méthode qui lit ou modifie les champs de l'objet courant", correct: false}
      - {text: "Pour toute méthode appelée souvent, puisqu'un appel `static` est plus rapide", correct: false}
      - {text: "Pour une méthode qu'une sous-classe doit pouvoir redéfinir", correct: false}
    answer: Pour une méthode utilitaire **sans état**, qui ne dépend que de ses paramètres (`Math.max`, `Integer.parseInt`), et pour les méthodes de fabrique (`List.of`).
  - key: etat-global
    format: course
    question: Pourquoi se méfier d'un champ `static` modifiable ?
    choices:
      - {text: "C'est un état global : un test peut influencer le suivant, et des threads le modifier ensemble", correct: true}
      - {text: "Il est recréé à chaque nouvel objet et perd sa valeur précédente", correct: false}
      - {text: "Le ramasse-miettes peut le libérer à tout moment, même s'il sert encore", correct: false}
      - {text: "Il ralentit chaque appel de méthode, qui doit le recharger depuis la classe", correct: false}
    answer: |-
      C'est un état global, partagé par tout le programme : un test peut influencer le suivant, et plusieurs threads
      peuvent le modifier en même temps. On le réserve aux constantes `static final`.
  - key: vf-un-exemplaire
    format: true-false
    question: Chaque objet a sa propre copie d'un champ `static`.
    truth: false
    answer: Un champ `static` existe en un seul exemplaire, attaché à la classe.
  - key: vf-appel-classe
    format: true-false
    question: On appelle une méthode `static` sur le nom de la classe, sans créer d'objet.
    truth: true
    answer: Comme `Math.sqrt(2)` ou `Integer.parseInt("3")`.
  - key: vf-this
    format: true-false
    question: Une méthode `static` peut utiliser `this`.
    truth: false
    answer: "Elle n'est liée à aucun objet : `this` n'existe pas."
  - key: vf-depuis-main
    format: true-false
    question: Depuis `main` (classique, `static`), on peut appeler directement une méthode d'instance de la même classe.
    truth: false
    answer: Il faut d'abord créer un objet, puis appeler la méthode sur lui.
  - key: qcm-appel
    format: multiple-choice
    question: Comment appelle-t-on la méthode `static int max(int a, int b)` de la classe `Calculs` ?
    choices:
      - text: "`Calculs.max(3, 5)`"
        correct: true
      - text: "`new Calculs().max(3, 5)`, recommandé"
        correct: false
      - text: "`max.Calculs(3, 5)`"
        correct: false
      - text: "`this.max(3, 5)`"
        correct: false
    answer: Sur le nom de la classe ; l'appel sur un objet compile mais trompe le lecteur.
  - key: qcm-compteur
    format: multiple-choice
    question: "On crée trois objets dont le constructeur fait `total++` sur un champ `static int total = 0`. Que vaut `total` ?"
    choices:
      - text: "3"
        correct: true
      - text: "1"
        correct: false
      - text: "0"
        correct: false
      - text: "Ça dépend de l'objet"
        correct: false
    answer: "Le champ est partagé : chaque construction l'incrémente."
  - key: qcm-bon-usage
    format: multiple-choice
    question: Laquelle de ces méthodes a le plus de sens en `static` ?
    choices:
      - text: "`static double convertirEnCelsius(double fahrenheit)`"
        correct: true
      - text: "`static double soldeDuCompte()`, sur la classe `Compte`"
        correct: false
      - text: "`static String nomDuClient()`, sur la classe `Client`"
        correct: false
      - text: "`static void ajouterArticle(Article a)`, sur la classe `Panier`"
        correct: false
    answer: La conversion ne dépend que de son paramètre ; les autres dépendent de l'état d'un objet précis.
  - key: qcm-erreur
    format: multiple-choice
    question: "Que signifie l'erreur `non-static variable nom cannot be referenced from a static context` ?"
    choices:
      - {text: "Une méthode `static` essaie de lire un champ d'instance", correct: true}
      - {text: "Le champ `nom` n'est déclaré nulle part dans la classe", correct: false}
      - {text: "Le champ `nom` est `private` et donc invisible ici", correct: false}
      - {text: "Le champ `nom` vaut `null` au moment où on le lit", correct: false}
    answer: Sans objet, il n'y a pas de champ d'instance à lire.
  - key: code-champ-partage
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Ticket {
          static int compteur = 0;
          int numero;
          Ticket() {
              compteur++;
              numero = compteur;
          }
      }
      new Ticket();
      Ticket t = new Ticket();
      System.out.println(t.numero + " " + Ticket.compteur);
      ```
    choices:
      - {text: "`2 2`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`2 1`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: '`2 2` : le compteur est partagé, et le second ticket reçoit le numéro 2.'
    check:
      output: "2 2"
  - key: code-utilitaire
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Conversions {
          static double enCelsius(double f) {
              return (f - 32) * 5 / 9;
          }
      }
      System.out.println(Conversions.enCelsius(212));
      ```
    choices:
      - {text: "`100.0`", correct: true}
      - {text: "`100`", correct: false}
      - {text: "`99.99999999999999`", correct: false}
      - {text: "`212.0`", correct: false}
    answer: '`100.0` : l''eau bout à 212 °F, soit 100 °C.'
    check:
      output: "100.0"
  - key: code-instances-separees
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Boite {
          static int partage = 0;
          int propre = 0;
      }
      Boite a = new Boite();
      Boite b = new Boite();
      a.propre = 5;
      Boite.partage = 7;
      System.out.println(b.propre + " " + Boite.partage);
      ```
    choices:
      - {text: "`0 7`", correct: true}
      - {text: "`5 7`", correct: false}
      - {text: "`0 0`", correct: false}
      - {text: "`5 0`", correct: false}
    answer: '`0 7` : chaque boîte a son `propre`, mais `partage` est commun à toutes.'
    check:
      output: "0 7"
  - key: code-math
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Math.max(3, 8) + Math.abs(-2));
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`82`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "`11`", correct: false}
    answer: '`10` : 8 + 2, deux méthodes `static` appelées sur la classe `Math`.'
    check:
      output: "10"
  - key: bug-instance-depuis-main
    format: bug-fix
    question: |-
      Ce code ne compile pas (`non-static method saluer() cannot be referenced from a static context`). Quelle correction est la bonne ?
      ```java
      public class Accueil {
          void saluer() {
              System.out.println("Bonjour");
          }

          public static void main(String[] args) {
              saluer();
          }
      }
      ```
    choices:
      - {text: "Appeler la méthode sur un objet : `new Accueil().saluer();`", correct: true}
      - {text: "Appeler la méthode sur l'objet courant : `this.saluer();`", correct: false}
      - {text: "Appeler la méthode par sa classe : `Accueil.saluer();`", correct: false}
      - {text: "Déclarer `saluer` `public` pour que `main` la voie", correct: false}
    answer: |-
      ```java
      public static void main(String[] args) {
          new Accueil().saluer();
      }
      ```
      `main` est `static` : il faut un objet pour appeler une méthode d'instance (ou rendre `saluer` `static`).
  - key: bug-etat-partage
    format: bug-fix
    question: |-
      Chaque panier semble contenir les articles de tous les autres. Quelle correction est la bonne ?
      ```java
      public class Panier {
          private static List<String> articles = new ArrayList<>();

          public void ajouter(String article) {
              articles.add(article);
          }
      }
      ```
    choices:
      - {text: "Retirer `static` : `private final List<String> articles = new ArrayList<>();`", correct: true}
      - {text: "Ajouter `final` : `private static final List<String> articles = new ArrayList<>();`", correct: false}
      - {text: "Rendre la méthode `ajouter` `static` pour qu'elle vise le bon panier", correct: false}
      - {text: "Recréer la liste dans `ajouter` : `articles = new ArrayList<>();` avant le `add`", correct: false}
    answer: |-
      ```java
      private final List<String> articles = new ArrayList<>();
      ```
      Un champ `static` est partagé par tous les paniers ; chaque panier a besoin de sa propre liste.
  - key: bug-this-static
    format: bug-fix
    question: |-
      Ce code ne compile pas (`non-static variable this cannot be referenced from a static context`). Quelle correction est la bonne ?
      ```java
      public class Compte {
          private double solde;

          public static double solde() {
              return this.solde;
          }
      }
      ```
    choices:
      - {text: "Retirer `static` de la méthode : le solde est propre à chaque compte", correct: true}
      - {text: "Rendre le champ `static` aussi : `private static double solde;`", correct: false}
      - {text: "Remplacer `this.solde` par `Compte.solde` dans la méthode", correct: false}
      - {text: "Remplacer `this.solde` par `solde` tout court, sans `this`", correct: false}
    answer: |-
      ```java
      public double solde() {
          return this.solde;
      }
      ```
      Le solde est propre à chaque compte : la méthode doit être une méthode d'instance.
  - key: bug-constante-mutable
    format: bug-fix
    question: |-
      Un test modifie ce seuil et fait échouer les tests suivants. Quelle correction est la bonne ?
      ```java
      public class Alerte {
          public static int seuil = 100;
      }
      ```
    choices:
      - {text: "En faire une constante : `public static final int SEUIL = 100;`", correct: true}
      - {text: "Le rendre `private static` et l'exposer par un setter public", correct: false}
      - {text: "Le déclarer `volatile` pour que chaque test relise sa valeur", correct: false}
      - {text: "Remettre `seuil` à 100 au début de chaque test qui le lit", correct: false}
    answer: |-
      ```java
      public static final int SEUIL = 100;
      ```
      Un champ `static` modifiable est un état global ; s'il doit varier, on le passe en paramètre ou par configuration.
