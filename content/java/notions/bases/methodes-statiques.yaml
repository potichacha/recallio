notion: methodes-statiques
lesson: |-
  `static` attache un membre à la **classe** plutôt qu'à chaque objet :

  ```java
  public class Compteur {
      private static int total = 0;      // un seul total, partagé par tous les compteurs
      private int valeur = 0;            // une valeur par objet

      public void incrementer() {
          valeur++;
          total++;
      }

      public static int total() {        // s'appelle sans objet : Compteur.total()
          return total;
      }
  }
  ```

  - Un **champ `static`** existe en un seul exemplaire, quel que soit le nombre d'objets.
  - Une **méthode `static`** s'appelle sur la classe (`Math.max(a, b)`) ; elle n'a pas de `this`, donc ne peut pas
    utiliser directement les champs ou méthodes d'instance.
  - Usages typiques : méthodes utilitaires sans état (`Math`, `Arrays`, `Integer.parseInt`), constantes
    (`static final`), méthodes de fabrique (`List.of`).
  - Un champ `static` **modifiable** est un état global partagé : difficile à tester et dangereux avec plusieurs
    threads. On le réserve aux constantes.

  **Piège classique** : appeler une méthode d'instance depuis `main`, qui est `static`. Le compilateur refuse
  (`non-static method cannot be referenced from a static context`) : il faut un objet.

  **En entretien** : « `static` appartient à la classe, sans `this` ; à réserver aux utilitaires sans état et aux
  constantes. »
cards:
  - key: definition
    format: course
    question: Que signifie `static` sur un champ ?
    answer: "Que le champ appartient à la **classe** : il en existe un seul exemplaire, partagé par tous les objets."
  - key: sans-this
    format: course
    question: Pourquoi une méthode `static` ne peut-elle pas utiliser directement un champ d'instance ?
    answer: "Parce qu'elle s'appelle sans objet : il n'y a pas de `this`, donc pas de champ d'instance à lire."
  - key: usages
    format: course
    question: Quand une méthode `static` est-elle un bon choix ?
    answer: Pour une méthode utilitaire **sans état**, qui ne dépend que de ses paramètres (`Math.max`, `Integer.parseInt`), et pour les méthodes de fabrique (`List.of`).
  - key: etat-global
    format: course
    question: Pourquoi se méfier d'un champ `static` modifiable ?
    answer: |-
      C'est un état global, partagé par tout le programme : un test peut influencer le suivant, et plusieurs threads
      peuvent le modifier en même temps. On le réserve aux constantes `static final`.
  - key: vf-un-exemplaire
    format: true-false
    question: Chaque objet a sa propre copie d'un champ `static`.
    truth: false
    answer: Un champ `static` existe en un seul exemplaire, attaché à la classe.
  - key: vf-appel-classe
    format: true-false
    question: On appelle une méthode `static` sur le nom de la classe, sans créer d'objet.
    truth: true
    answer: Comme `Math.sqrt(2)` ou `Integer.parseInt("3")`.
  - key: vf-this
    format: true-false
    question: Une méthode `static` peut utiliser `this`.
    truth: false
    answer: "Elle n'est liée à aucun objet : `this` n'existe pas."
  - key: vf-depuis-main
    format: true-false
    question: Depuis `main` (classique, `static`), on peut appeler directement une méthode d'instance de la même classe.
    truth: false
    answer: Il faut d'abord créer un objet, puis appeler la méthode sur lui.
  - key: qcm-appel
    format: multiple-choice
    question: Comment appelle-t-on la méthode `static int max(int a, int b)` de la classe `Calculs` ?
    choices:
      - text: "`Calculs.max(3, 5)`"
        correct: true
      - text: "`new Calculs().max(3, 5)`, recommandé"
        correct: false
      - text: "`max.Calculs(3, 5)`"
        correct: false
      - text: "`this.max(3, 5)`"
        correct: false
    answer: Sur le nom de la classe ; l'appel sur un objet compile mais trompe le lecteur.
  - key: qcm-compteur
    format: multiple-choice
    question: "On crée trois objets dont le constructeur fait `total++` sur un champ `static int total = 0`. Que vaut `total` ?"
    choices:
      - text: "3"
        correct: true
      - text: "1"
        correct: false
      - text: "0"
        correct: false
      - text: "Ça dépend de l'objet"
        correct: false
    answer: "Le champ est partagé : chaque construction l'incrémente."
  - key: qcm-bon-usage
    format: multiple-choice
    question: Laquelle de ces méthodes a le plus de sens en `static` ?
    choices:
      - text: "`static double convertirEnCelsius(double fahrenheit)`"
        correct: true
      - text: "`static double soldeDuCompte()`, sur la classe `Compte`"
        correct: false
      - text: "`static String nomDuClient()`, sur la classe `Client`"
        correct: false
      - text: "`static void ajouterArticle(Article a)`, sur la classe `Panier`"
        correct: false
    answer: La conversion ne dépend que de son paramètre ; les autres dépendent de l'état d'un objet précis.
  - key: qcm-erreur
    format: multiple-choice
    question: "Que signifie l'erreur `non-static variable nom cannot be referenced from a static context` ?"
    choices:
      - text: "Une méthode `static` essaie de lire un champ d'instance"
        correct: true
      - text: "Le champ `nom` n'existe pas"
        correct: false
      - text: "Le champ `nom` est `private`"
        correct: false
      - text: "`nom` vaut `null`"
        correct: false
    answer: Sans objet, il n'y a pas de champ d'instance à lire.
  - key: code-champ-partage
    format: code-output
    question: |-
      ```java
      class Ticket {
          static int compteur = 0;
          int numero;
          Ticket() {
              compteur++;
              numero = compteur;
          }
      }
      new Ticket();
      Ticket t = new Ticket();
      System.out.println(t.numero + " " + Ticket.compteur);
      ```
    answer: '`2 2` : le compteur est partagé, et le second ticket reçoit le numéro 2.'
    check:
      output: "2 2"
  - key: code-utilitaire
    format: code-output
    question: |-
      ```java
      class Conversions {
          static double enCelsius(double f) {
              return (f - 32) * 5 / 9;
          }
      }
      System.out.println(Conversions.enCelsius(212));
      ```
    answer: '`100.0` : l''eau bout à 212 °F, soit 100 °C.'
    check:
      output: "100.0"
  - key: code-instances-separees
    format: code-output
    question: |-
      ```java
      class Boite {
          static int partage = 0;
          int propre = 0;
      }
      Boite a = new Boite();
      Boite b = new Boite();
      a.propre = 5;
      Boite.partage = 7;
      System.out.println(b.propre + " " + Boite.partage);
      ```
    answer: '`0 7` : chaque boîte a son `propre`, mais `partage` est commun à toutes.'
    check:
      output: "0 7"
  - key: code-math
    format: code-output
    question: |-
      ```java
      System.out.println(Math.max(3, 8) + Math.abs(-2));
      ```
    answer: '`10` : 8 + 2, deux méthodes `static` appelées sur la classe `Math`.'
    check:
      output: "10"
  - key: bug-instance-depuis-main
    format: bug-fix
    question: |-
      Ce code ne compile pas (`non-static method saluer() cannot be referenced from a static context`) :
      ```java
      public class Accueil {
          void saluer() {
              System.out.println("Bonjour");
          }

          public static void main(String[] args) {
              saluer();
          }
      }
      ```
    answer: |-
      ```java
      public static void main(String[] args) {
          new Accueil().saluer();
      }
      ```
      `main` est `static` : il faut un objet pour appeler une méthode d'instance (ou rendre `saluer` `static`).
  - key: bug-etat-partage
    format: bug-fix
    question: |-
      Chaque panier semble contenir les articles de tous les autres :
      ```java
      public class Panier {
          private static List<String> articles = new ArrayList<>();

          public void ajouter(String article) {
              articles.add(article);
          }
      }
      ```
    answer: |-
      ```java
      private final List<String> articles = new ArrayList<>();
      ```
      Un champ `static` est partagé par tous les paniers ; chaque panier a besoin de sa propre liste.
  - key: bug-this-static
    format: bug-fix
    question: |-
      Ce code ne compile pas (`non-static variable this cannot be referenced from a static context`) :
      ```java
      public class Compte {
          private double solde;

          public static double solde() {
              return this.solde;
          }
      }
      ```
    answer: |-
      ```java
      public double solde() {
          return this.solde;
      }
      ```
      Le solde est propre à chaque compte : la méthode doit être une méthode d'instance.
  - key: bug-constante-mutable
    format: bug-fix
    question: |-
      Un test modifie ce seuil et fait échouer les tests suivants :
      ```java
      public class Alerte {
          public static int seuil = 100;
      }
      ```
    answer: |-
      ```java
      public static final int SEUIL = 100;
      ```
      Un champ `static` modifiable est un état global ; s'il doit varier, on le passe en paramètre ou par configuration.
