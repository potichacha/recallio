notion: var-inference
cards:
  - key: var-rend-java-dynamiquement-type
    format: course
    question: '`var` rend-il Java dynamiquement typé ?'
    answer: Non, le type est inféré et figé à la compilation ; uniquement pour les variables locales.
  - key: var
    format: course
    question: C'est quoi var ?
    answer: L'inférence de type pour les variables locales (Java 10).
