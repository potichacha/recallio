notion: var-inference
lesson: |-
  Depuis **Java 10**, `var` laisse le compilateur **déduire le type** d'une variable locale à partir de sa valeur :

  ```java
  var nom = "Ada";                       // String
  var total = 0L;                        // long
  var commandes = new ArrayList<Commande>();   // ArrayList<Commande>
  for (var commande : commandes) { ... }       // Commande
  ```

  - Le type est **fixé à la compilation**, comme si on l'avait écrit : Java reste typé statiquement. `nom = 42;` ne
    compile pas.
  - `var` ne sert que pour les **variables locales initialisées** (y compris dans un `for`, un try-with-resources ou
    les paramètres d'une lambda). Pas pour un champ, un paramètre de méthode ou un type de retour.
  - Il faut une valeur dont le type se déduit : `var x;` et `var x = null;` ne compilent pas.

  Bon usage : quand le type saute aux yeux à droite (`new`, littéral, nom de méthode clair). Mauvais usage : quand il
  faut deviner ce que renvoie une méthode (`var x = service.traiter();`).

  **Piège classique** : `var noms = new ArrayList<>();`. Le diamant n'a rien à inférer : on obtient une
  `ArrayList<Object>`. Il faut préciser `new ArrayList<String>()`.

  **En entretien** : « `var` est de l'inférence de type locale, résolue à la compilation ; c'est du sucre syntaxique,
  pas du typage dynamique. »
tour:
  - title: var
    text: |-
      Depuis Java 10, `var` laisse le compilateur **déduire** le type d'une variable locale de sa valeur :
      `var notes = new ArrayList<Integer>();`. Le type reste fixé : `var` n'est pas un type dynamique.

      `var` ne sert qu'aux variables locales initialisées, jamais aux champs ni aux paramètres. On l'emploie quand le
      type se lit déjà à droite du `=` ; quand il ne se devine pas, on l'écrit.

      Essaie : ajoute `nombre = "quarante-deux";`, puis exécute.
    example:
      files:
        Main.java: |-
          void main() {
              var nombre = 42;
              var texte = "Java";
              var notes = new ArrayList<Integer>();
              notes.add(12);
              notes.add(15);
              IO.println(nombre + 1);
              IO.println(texte.length());
              IO.println(notes + " " + notes.getClass().getSimpleName());
          }
      output: |-
        43
        4
        [12, 15] ArrayList
cards:
  - key: var-rend-java-dynamiquement-type
    format: course
    question: '`var` rend-il Java dynamiquement typé ?'
    answer: Non, le type est inféré et figé à la compilation ; uniquement pour les variables locales.
  - key: var
    format: course
    question: C'est quoi var ?
    answer: L'inférence de type pour les variables locales (Java 10).
  - key: ou-utiliser-var
    format: course
    question: Où peut-on utiliser `var` ?
    answer: |-
      Pour une variable locale initialisée, la variable d'une boucle `for` ou for-each, une ressource de
      try-with-resources et les paramètres d'une lambda. Jamais pour un champ, un paramètre de méthode ou un type de retour.
  - key: quand-eviter-var
    format: course
    question: Quand vaut-il mieux éviter `var` ?
    answer: |-
      Quand le type ne se voit pas à la lecture, par exemple `var x = service.traiter();` : le lecteur doit aller voir ce
      que renvoie la méthode. Le type explicite documente alors le code.
  - key: vf-sans-initialisation
    format: true-false
    question: "`var x;`, sans valeur, compile."
    truth: false
    answer: Sans valeur, le compilateur n'a rien d'où déduire le type.
  - key: vf-champ
    format: true-false
    question: On peut déclarer un champ de classe avec `var`.
    truth: false
    answer: '`var` est réservé aux variables locales.'
  - key: vf-changer-type
    format: true-false
    question: Après `var n = 10;`, l'instruction `n = "dix";` compile.
    truth: false
    answer: '`n` est un `int` pour toujours ; `var` n''en fait pas une variable sans type.'
  - key: vf-for-each
    format: true-false
    question: "`var` est utilisable comme variable d'une boucle for-each : `for (var c : commandes)`."
    truth: true
    answer: Le type de `c` est celui des éléments de `commandes`.
  - key: qcm-type-infere
    format: multiple-choice
    question: Quel est le type de `total` après `var total = 0L;` ?
    choices:
      - text: "`long`"
        correct: true
      - text: "`int`"
        correct: false
      - text: "`Long`"
        correct: false
      - text: "`Object`"
        correct: false
    answer: Le littéral `0L` est un `long` primitif.
  - key: qcm-compilent
    format: multiple-choice
    question: Quelles déclarations compilent ?
    choices:
      - text: "`var nom = \"Ada\";`"
        correct: true
      - text: "`for (var i = 0; i < 3; i++) { }`"
        correct: true
      - text: "`var x = null;`"
        correct: false
      - text: "`var t = {1, 2};`"
        correct: false
    answer: '`null` et un initialiseur de tableau seul ne donnent pas de type à inférer ; `var t = new int[] {1, 2};` compilerait.'
  - key: qcm-version
    format: multiple-choice
    question: Depuis quelle version de Java `var` existe-t-il ?
    choices:
      - text: "Java 10"
        correct: true
      - text: "Java 8"
        correct: false
      - text: "Java 17"
        correct: false
      - text: "Java 21"
        correct: false
    answer: Java 10 (JEP 286) ; Java 11 l'a étendu aux paramètres des lambdas.
  - key: qcm-diamant
    format: multiple-choice
    question: Quel est le type de `liste` après `var liste = new ArrayList<>();` ?
    choices:
      - text: "`ArrayList<Object>`"
        correct: true
      - text: "`ArrayList<String>`"
        correct: false
      - text: "`List<Object>`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: "Avec `var`, le diamant n'a pas de type cible : il retombe sur `Object`."
  - key: trous-chaine
    format: fill-in
    question: |-
      Complétez pour que le compilateur déduise le type :
      ```java
      ___ message = "Bonjour";
      ```
    blanks: [[var, String]]
    answer: '`var`, et `message` est une `String`.'
  - key: trous-for-each
    format: fill-in
    question: |-
      `articles` est une `List<String>`. Complétez la boucle :
      ```java
      for (___ article : articles) {
          System.out.println(article);
      }
      ```
    blanks: [[var, String]]
    answer: '`var` déduit `String`, le type des éléments.'
  - key: trous-suffixe-long
    format: fill-in
    question: |-
      Complétez pour que `compteur` soit un `long` :
      ```java
      var compteur = 0___;
      ```
    blanks: [[L, l]]
    answer: Sans suffixe, `0` est un `int` et `var` en ferait un `int`. On préfère `L`, qu'on ne confond pas avec 1.
  - key: trous-diamant
    format: fill-in
    question: |-
      Complétez pour obtenir une liste de chaînes, et non d'objets :
      ```java
      var noms = new ArrayList<___>();
      ```
    blanks: [[String]]
    answer: "Avec `var`, il faut écrire le type à droite : le diamant seul donnerait `ArrayList<Object>`."
  - key: bug-sans-valeur
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot infer type for local variable resultat`) :
      ```java
      var resultat;
      resultat = calculer();
      ```
    answer: |-
      ```java
      var resultat = calculer();
      ```
      `var` exige une valeur dès la déclaration, pour en déduire le type.
  - key: bug-null
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      var client = null;
      ```
    answer: |-
      ```java
      Client client = null;
      ```
      `null` n'a pas de type à inférer : il faut écrire le type.
  - key: bug-champ
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      public class Compteur {
          private var valeur = 0;
      }
      ```
    answer: |-
      ```java
      private int valeur = 0;
      ```
      `var` n'est permis que pour les variables locales, pas pour les champs.
  - key: bug-changement-de-type
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      var quantite = 10;
      quantite = "dix";
      ```
    answer: |-
      ```java
      var quantite = 10;
      String libelle = "dix";
      ```
      `quantite` est un `int` : elle ne contiendra jamais de texte. Une autre information mérite une autre variable.
