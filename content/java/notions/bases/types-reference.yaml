notion: types-reference
lesson: |-
  Java a deux familles de types :

  - les **primitifs** (`int`, `double`, `boolean`...) : la variable contient **la valeur elle-même** ;
  - les **types référence** (`String`, les tableaux, toutes les classes) : la variable contient une **référence** vers
    un objet, rangé dans le **tas** (*heap*).

  ```java
  StringBuilder a = new StringBuilder("x");
  StringBuilder b = a;      // b reçoit la même référence : un seul objet
  b.append("y");
  System.out.println(a);    // xy : a et b désignent le même objet
  ```

  - Copier une référence **partage** l'objet ; copier un primitif copie la valeur.
  - Une référence peut valoir **`null`** : elle ne désigne aucun objet. Appeler une méthode dessus lève une
    **`NullPointerException`**.
  - Un primitif ne peut jamais valoir `null` ; son équivalent objet (`Integer`, `Double`...) le peut.
  - `==` sur deux références compare **l'identité** (même objet ?), pas le contenu : pour le contenu, `equals`.

  **Piège classique** : comparer deux chaînes avec `==`. Deux `String` de même contenu peuvent être deux objets
  distincts : `==` répond alors `false`.

  **En entretien** : « Un primitif contient sa valeur ; une variable objet contient une référence vers un objet du tas,
  qui peut être `null`. Java passe tout par valeur : pour un objet, c'est la référence qui est copiée. »
cards:
  - key: java-pointeurs
    format: course
    question: Java a-t-il des pointeurs ?
    answer: Pas d'arithmétique de pointeurs ; il a des références, gérées par la JVM.
  - key: primitif-vs-reference
    format: course
    question: Que contient une variable de type primitif, et une variable de type référence ?
    answer: Un primitif contient sa **valeur** ; une variable de type référence contient une **référence** vers un objet du tas.
  - key: copie-de-reference
    format: course
    question: Après `b = a;` entre deux variables objets, que se passe-t-il si l'on modifie l'objet par `b` ?
    answer: '`a` voit la modification : les deux variables désignent **le même objet**.'
  - key: passage-par-valeur
    format: course
    question: Java passe-t-il les objets par référence ?
    answer: |-
      Non : Java passe **tout par valeur**. Pour un objet, la valeur copiée est la référence : la méthode peut modifier
      l'objet, mais réaffecter son paramètre ne change pas la variable de l'appelant.
  - key: vf-contient-objet
    format: true-false
    question: Une variable de type `String` contient l'objet chaîne lui-même.
    truth: false
    answer: Elle contient une référence vers l'objet, rangé dans le tas.
  - key: vf-int-null
    format: true-false
    question: Une variable `int` peut valoir `null`.
    truth: false
    answer: Un primitif a toujours une valeur ; `Integer`, son équivalent objet, peut valoir `null`.
  - key: vf-meme-objet
    format: true-false
    question: Après `StringBuilder b = a;`, `a` et `b` désignent le même objet.
    truth: true
    answer: Seule la référence est copiée ; il n'y a qu'un objet.
  - key: vf-npe
    format: true-false
    question: Appeler une méthode sur une référence `null` lève une `NullPointerException`.
    truth: true
    answer: Il n'y a aucun objet sur lequel appeler la méthode.
  - key: qcm-contenu-string
    format: multiple-choice
    question: Après `String s = "Ada";`, que contient `s` ?
    choices:
      - text: "Une référence vers un objet `String`"
        correct: true
      - text: "Les trois caractères eux-mêmes"
        correct: false
      - text: "Le nombre 3"
        correct: false
      - text: "`null`"
        correct: false
    answer: Toute variable d'un type classe contient une référence.
  - key: qcm-peuvent-etre-null
    format: multiple-choice
    question: Lesquelles de ces variables peuvent valoir `null` ?
    choices:
      - text: "`String s`"
        correct: true
      - text: "`Integer n`"
        correct: true
      - text: "`int n`"
        correct: false
      - text: "`boolean b`"
        correct: false
    answer: Seules les références peuvent valoir `null` ; les primitifs ont toujours une valeur.
  - key: qcm-ou-vivent-objets
    format: multiple-choice
    question: Où la JVM range-t-elle les objets créés avec `new` ?
    choices:
      - text: "Dans le tas (*heap*)"
        correct: true
      - text: "Dans le fichier `.class`"
        correct: false
      - text: "Dans le classpath"
        correct: false
      - text: "Directement dans la variable"
        correct: false
    answer: Les objets vivent dans le tas ; les variables locales, elles, sont sur la pile et contiennent des références.
  - key: qcm-defaut-champ-reference
    format: multiple-choice
    question: Quelle est la valeur d'un champ de type `String` jamais initialisé ?
    choices:
      - text: "`null`"
        correct: true
      - text: "Une chaîne vide `\"\"`"
        correct: false
      - text: "`0`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Un champ de type référence vaut `null` par défaut (une variable locale, elle, doit être initialisée).
  - key: code-objet-partage
    format: code-output
    question: |-
      ```java
      StringBuilder a = new StringBuilder("x");
      StringBuilder b = a;
      b.append("y");
      System.out.println(a);
      ```
    answer: '`xy` : `a` et `b` désignent le même objet.'
    check:
      output: "xy"
  - key: code-afficher-null
    format: code-output
    question: |-
      ```java
      String s = null;
      System.out.println(s);
      ```
    answer: '`null` : `println` affiche le mot `null` pour une référence vide, sans erreur.'
    check:
      output: "null"
  - key: code-methode-sur-null
    format: code-output
    question: |-
      ```java
      String s = null;
      System.out.println(s.length());
      ```
    answer: "Une `NullPointerException` : on ne peut pas appeler `length()` quand `s` ne désigne aucun objet."
    check:
      throws: NullPointerException
  - key: code-egal-egal-equals
    format: code-output
    question: |-
      ```java
      String a = new String("hi");
      String b = new String("hi");
      System.out.println((a == b) + " " + a.equals(b));
      ```
    answer: '`false true` : deux objets distincts (`==` compare l''identité) au contenu identique (`equals`).'
    check:
      output: "false true"
  - key: bug-int-null
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      int age = null;
      ```
    answer: |-
      ```java
      Integer age = null;
      ```
      Un primitif ne peut pas valoir `null`. Pour représenter « pas d'âge connu », on prend `Integer` (ou mieux, un
      `Optional` en retour de méthode).
  - key: bug-equals-sur-null
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` quand `nom` vaut `null` :
      ```java
      if (nom.equals("Ada")) {
          System.out.println("Bonjour Ada");
      }
      ```
    answer: |-
      ```java
      if ("Ada".equals(nom)) {
          System.out.println("Bonjour Ada");
      }
      ```
      On appelle `equals` sur la constante, qui n'est jamais `null` ; `"Ada".equals(null)` renvoie simplement `false`.
  - key: bug-comparer-chaines
    format: bug-fix
    question: |-
      Ce test échoue parfois alors que les deux chaînes ont le même contenu :
      ```java
      if (saisie == motDePasse) {
          System.out.println("Accès accordé");
      }
      ```
    answer: |-
      ```java
      if (saisie.equals(motDePasse)) {
          System.out.println("Accès accordé");
      }
      ```
      `==` compare les références : deux objets `String` distincts au même contenu donnent `false`. `equals` compare le
      contenu.
  - key: bug-champ-non-initialise
    format: bug-fix
    question: |-
      `ajouter` lève une `NullPointerException` :
      ```java
      public class Panier {
          private List<String> articles;

          void ajouter(String article) {
              articles.add(article);
          }
      }
      ```
    answer: |-
      ```java
      private List<String> articles = new ArrayList<>();
      ```
      Un champ de type référence vaut `null` tant qu'on ne lui a pas donné d'objet : il faut créer la liste.
  - key: definition-reference
    format: definition
    question: Référence
    answer: La valeur d'une variable de type objet, qui désigne un objet du tas sans le contenir.
  - key: definition-null
    format: definition
    question: "`null`"
    answer: La valeur d'une référence qui ne désigne aucun objet.
  - key: definition-npe
    format: definition
    question: "`NullPointerException`"
    answer: L'exception levée quand on utilise une référence `null` comme si elle désignait un objet.
  - key: definition-tas
    format: definition
    question: Tas (*heap*)
    answer: La zone mémoire de la JVM où vivent les objets, libérée par le ramasse-miettes.
