notion: types-reference
lesson: |-
  Java a deux familles de types :

  - les **primitifs** (`int`, `double`, `boolean`...) : la variable contient **la valeur elle-même** ;
  - les **types référence** (`String`, les tableaux, toutes les classes) : la variable contient une **référence** vers
    un objet, rangé dans le **tas** (*heap*).

  ```java
  StringBuilder a = new StringBuilder("x");
  StringBuilder b = a;      // b reçoit la même référence : un seul objet
  b.append("y");
  System.out.println(a);    // xy : a et b désignent le même objet
  ```

  - Copier une référence **partage** l'objet ; copier un primitif copie la valeur.
  - Une référence peut valoir **`null`** : elle ne désigne aucun objet. Appeler une méthode dessus lève une
    **`NullPointerException`**.
  - Un primitif ne peut jamais valoir `null` ; son équivalent objet (`Integer`, `Double`...) le peut.
  - `==` sur deux références compare **l'identité** (même objet ?), pas le contenu : pour le contenu, `equals`.

  **Piège classique** : comparer deux chaînes avec `==`. Deux `String` de même contenu peuvent être deux objets
  distincts : `==` répond alors `false`.

  **En entretien** : « Un primitif contient sa valeur ; une variable objet contient une référence vers un objet du tas,
  qui peut être `null`. Java passe tout par valeur : pour un objet, c'est la référence qui est copiée. »
tour:
  - title: Types primitifs et références
    text: |-
      Hors des huit primitifs, tout est **objet**, manipulé par une **référence** : `String`, les tableaux, les classes.
      Une variable de type référence ne contient pas l'objet, mais un moyen de le retrouver ; elle peut valoir `null`,
      et ne désigner aucun objet.

      Copier une référence ne copie pas l'objet : les deux variables désignent le même, et une modification par l'une se
      voit par l'autre. Un primitif, lui, est copié.
    example:
      files:
        Main.java: |-
          void main() {
              int a = 1;
              int b = a;
              b = 2;
              IO.println(a + " " + b);

              int[] t1 = {1, 2, 3};
              int[] t2 = t1;
              t2[0] = 99;
              IO.println(t1[0] + " " + t2[0]);

              String rien = null;
              IO.println(rien == null);
          }
      output: |-
        1 2
        99 99
        true
cards:
  - key: java-pointeurs
    format: course
    question: "Java a-t-il des pointeurs ?"
    choices:
      - {text: "Non : il a des références, gérées par la JVM, sans arithmétique de pointeurs", correct: true}
      - {text: "Oui, comme le C : on peut les incrémenter avec `++` pour parcourir la mémoire", correct: false}
      - {text: "Non : chaque affectation copie l'objet entier, il n'y a jamais de partage", correct: false}
      - {text: "Oui, mais seulement dans les méthodes déclarées `unsafe`, comme en C#", correct: false}
    answer: "Java n'a pas d'arithmétique de pointeurs : il a des **références**, gérées par la JVM. Une affectation copie la référence, pas l'objet : deux variables peuvent donc désigner le même objet."
  - key: primitif-vs-reference
    format: course
    question: "Que contient une variable de type primitif, et une variable de type référence ?"
    choices:
      - {text: "Le primitif contient sa valeur ; la référence désigne un objet du tas", correct: true}
      - {text: "Toutes deux contiennent directement leur valeur, objet compris", correct: false}
      - {text: "Le primitif désigne une valeur du tas ; la référence contient l'objet", correct: false}
      - {text: "Le primitif contient sa valeur ; la référence, une copie de l'objet", correct: false}
    answer: "Un primitif contient sa **valeur** ; une variable de type référence contient une **référence** vers un objet du tas, jamais l'objet lui-même."
  - key: copie-de-reference
    format: course
    question: "Après `b = a;` entre deux variables objets, que se passe-t-il si l'on modifie l'objet par `b` ?"
    choices:
      - {text: "`a` voit la modification : les deux désignent le même objet", correct: true}
      - {text: "`a` ne change pas : `b = a` a copié l'objet entier", correct: false}
      - {text: "`a` devient `null` : l'objet appartient désormais à `b`", correct: false}
      - {text: "Ça ne compile pas : il faut écrire `b = a.clone();`", correct: false}
    answer: "`a` voit la modification : `b = a` copie la référence, pas l'objet, et les deux variables désignent **le même objet**."
  - key: passage-par-valeur
    format: course
    question: "Java passe-t-il les objets par référence ?"
    choices:
      - {text: "Non : tout passe par valeur ; pour un objet, c'est la référence qui est copiée", correct: true}
      - {text: "Oui : la méthode reçoit la variable de l'appelant et peut la réaffecter", correct: false}
      - {text: "Non : l'objet entier est copié, la méthode travaille sur un double", correct: false}
      - {text: "Oui pour les objets, et par valeur pour les seuls types primitifs", correct: false}
    answer: "Non : Java passe **tout par valeur**. Pour un objet, la valeur copiée est la référence : la méthode peut modifier l'objet, mais réaffecter son paramètre ne change pas la variable de l'appelant."
  - key: vf-contient-objet
    format: true-false
    question: Une variable de type `String` contient l'objet chaîne lui-même.
    truth: false
    answer: Elle contient une référence vers l'objet, rangé dans le tas.
  - key: vf-int-null
    format: true-false
    question: Une variable `int` peut valoir `null`.
    truth: false
    answer: Un primitif a toujours une valeur ; `Integer`, son équivalent objet, peut valoir `null`.
  - key: vf-meme-objet
    format: true-false
    question: Après `StringBuilder b = a;`, `a` et `b` désignent le même objet.
    truth: true
    answer: Seule la référence est copiée ; il n'y a qu'un objet.
  - key: vf-npe
    format: true-false
    question: Appeler une méthode sur une référence `null` lève une `NullPointerException`.
    truth: true
    answer: Il n'y a aucun objet sur lequel appeler la méthode.
  - key: qcm-contenu-string
    format: multiple-choice
    question: Après `String s = "Ada";`, que contient `s` ?
    choices:
      - text: "Une référence vers un objet `String`"
        correct: true
      - text: "Les trois caractères eux-mêmes"
        correct: false
      - text: "Le nombre 3"
        correct: false
      - text: "`null`"
        correct: false
    answer: Toute variable d'un type classe contient une référence.
  - key: qcm-peuvent-etre-null
    format: multiple-choice
    question: Lesquelles de ces variables peuvent valoir `null` ?
    choices:
      - text: "`String s`"
        correct: true
      - text: "`Integer n`"
        correct: true
      - text: "`int n`"
        correct: false
      - text: "`boolean b`"
        correct: false
    answer: Seules les références peuvent valoir `null` ; les primitifs ont toujours une valeur.
  - key: qcm-ou-vivent-objets
    format: multiple-choice
    question: Où la JVM range-t-elle les objets créés avec `new` ?
    choices:
      - text: "Dans le tas (*heap*)"
        correct: true
      - text: "Dans le fichier `.class`"
        correct: false
      - text: "Dans le classpath"
        correct: false
      - text: "Directement dans la variable"
        correct: false
    answer: Les objets vivent dans le tas ; les variables locales, elles, sont sur la pile et contiennent des références.
  - key: qcm-defaut-champ-reference
    format: multiple-choice
    question: Quelle est la valeur d'un champ de type `String` jamais initialisé ?
    choices:
      - text: "`null`"
        correct: true
      - text: "Une chaîne vide `\"\"`"
        correct: false
      - text: "`0`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Un champ de type référence vaut `null` par défaut (une variable locale, elle, doit être initialisée).
  - key: code-objet-partage
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      StringBuilder a = new StringBuilder("x");
      StringBuilder b = a;
      b.append("y");
      System.out.println(a);
      ```
    choices:
      - {text: "`xy`", correct: true}
      - {text: "`x`", correct: false}
      - {text: "`y`", correct: false}
      - {text: "`null`", correct: false}
    answer: "`xy` : `b = a` copie la référence, donc `a` et `b` désignent le même objet, modifié par `append`."
    check:
      output: "xy"
  - key: code-afficher-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = null;
      System.out.println(s);
      ```
    choices:
      - {text: "`null`", correct: true}
      - {text: "Une `NullPointerException`", correct: false}
      - {text: "Une ligne vide", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`null` : `println` affiche le mot `null` pour une référence vide, sans erreur. L'exception ne vient que si l'on appelle une méthode sur `s`."
    check:
      output: "null"
  - key: code-methode-sur-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = null;
      System.out.println(s.length());
      ```
    choices:
      - {text: "Une `NullPointerException`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "Une `NullPointerException` : on ne peut pas appeler `length()` quand `s` ne désigne aucun objet. Le compilateur, lui, ne voit rien d'anormal."
    check:
      throws: NullPointerException
  - key: code-egal-egal-equals
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String a = new String("hi");
      String b = new String("hi");
      System.out.println((a == b) + " " + a.equals(b));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`false true` : `new` crée deux objets distincts (`==` compare l'identité), au contenu identique (`equals` compare le contenu)."
    check:
      output: "false true"
  - key: bug-int-null
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      int age = null;
      ```
    choices:
      - {text: "`Integer age = null;`", correct: true}
      - {text: "`int age = (int) null;`", correct: false}
      - {text: "`int? age = null;`", correct: false}
      - {text: "`long age = null;`", correct: false}
    answer: |-
      ```java
      Integer age = null;
      ```
      Un primitif ne peut pas valoir `null`, quel que soit son type ou un cast. Pour représenter « pas d'âge connu », on prend `Integer` (ou mieux, un `Optional` en retour de méthode).
  - key: bug-equals-sur-null
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` quand `nom` vaut `null`. Quelle correction est la bonne ?
      ```java
      if (nom.equals("Ada")) {
          System.out.println("Bonjour Ada");
      }
      ```
    choices:
      - {text: "`if (\"Ada\".equals(nom))`", correct: true}
      - {text: "`if (nom == \"Ada\")`", correct: false}
      - {text: "`if (nom.equals(\"Ada\") && nom != null)`", correct: false}
      - {text: "`if (nom.equalsIgnoreCase(\"Ada\"))`", correct: false}
    answer: |-
      ```java
      if ("Ada".equals(nom)) {
          System.out.println("Bonjour Ada");
      }
      ```
      On appelle `equals` sur la constante, qui n'est jamais `null` ; `"Ada".equals(null)` renvoie simplement `false`. Tester `nom != null` après l'appel arrive trop tard, et `==` compare les références.
  - key: bug-comparer-chaines
    format: bug-fix
    question: |-
      Ce test échoue parfois alors que les deux chaînes ont le même contenu. Quelle correction est la bonne ?
      ```java
      if (saisie == motDePasse) {
          System.out.println("Accès accordé");
      }
      ```
    choices:
      - {text: "`if (saisie.equals(motDePasse))`", correct: true}
      - {text: "`if (saisie === motDePasse)`", correct: false}
      - {text: "`if (saisie.hashCode() == motDePasse.hashCode())`", correct: false}
      - {text: "`if (saisie.toString() == motDePasse.toString())`", correct: false}
    answer: |-
      ```java
      if (saisie.equals(motDePasse)) {
          System.out.println("Accès accordé");
      }
      ```
      `==` compare les références : deux objets `String` distincts au même contenu donnent `false`. `equals` compare le contenu ; deux `hashCode` égaux ne prouvent pas l'égalité.
  - key: bug-champ-non-initialise
    format: bug-fix
    question: |-
      `ajouter` lève une `NullPointerException`. Quelle correction est la bonne ?
      ```java
      public class Panier {
          private List<String> articles;

          void ajouter(String article) {
              articles.add(article);
          }
      }
      ```
    choices:
      - {text: "`private List<String> articles = new ArrayList<>();`", correct: true}
      - {text: "`private List<String> articles = null;`", correct: false}
      - {text: "`private static List<String> articles;`", correct: false}
      - {text: "`public List<String> articles;`", correct: false}
    answer: |-
      ```java
      private List<String> articles = new ArrayList<>();
      ```
      Un champ de type référence vaut `null` tant qu'on ne lui a pas donné d'objet : il faut créer la liste. Changer sa visibilité ou le rendre `static` ne crée aucun objet.
  - key: definition-reference
    format: definition
    question: "Que désigne le mot « référence » pour une variable de type objet ?"
    choices:
      - {text: "La valeur de la variable, qui désigne un objet du tas sans le contenir", correct: true}
      - {text: "Une copie de l'objet, rangée dans la pile de la méthode", correct: false}
      - {text: "Une adresse mémoire qu'on peut incrémenter, comme un pointeur du C", correct: false}
      - {text: "Le nom de la variable, qui sert d'étiquette à l'objet", correct: false}
    answer: "La valeur d'une variable de type objet, qui désigne un objet du tas sans le contenir. Copier la variable copie la référence, pas l'objet."
  - key: definition-null
    format: definition
    question: "Que représente la valeur `null` pour une variable de type référence ?"
    choices:
      - {text: "Une référence qui ne désigne aucun objet", correct: true}
      - {text: "Un objet vide, créé par défaut par la JVM", correct: false}
      - {text: "La valeur zéro, comme `0` pour un `int`", correct: false}
      - {text: "Une chaîne vide, équivalente à `\"\"`", correct: false}
    answer: "La valeur d'une référence qui ne désigne aucun objet. Ce n'est ni un objet vide ni une chaîne vide : appeler une méthode dessus lève une `NullPointerException`."
  - key: definition-npe
    format: definition
    question: "Qu'est-ce qu'une `NullPointerException` ?"
    choices:
      - {text: "L'exception levée quand on utilise une référence `null` comme un objet", correct: true}
      - {text: "L'erreur de compilation d'une variable locale non initialisée", correct: false}
      - {text: "L'exception levée quand on lit un tableau hors de ses bornes", correct: false}
      - {text: "L'exception levée quand la mémoire du tas est épuisée", correct: false}
    answer: "L'exception levée quand on utilise une référence `null` comme si elle désignait un objet : appeler une méthode, lire un champ. Un tableau lu hors de ses bornes lève une `ArrayIndexOutOfBoundsException`."
  - key: definition-tas
    format: definition
    question: "Dans la JVM, qu'est-ce que le tas (*heap*) ?"
    choices:
      - {text: "La zone mémoire où vivent les objets, libérée par le ramasse-miettes", correct: true}
      - {text: "La zone mémoire des appels de méthode et de leurs variables locales", correct: false}
      - {text: "La zone où la JVM range le bytecode des classes chargées", correct: false}
      - {text: "Une structure de données triée, utilisée par `PriorityQueue`", correct: false}
    answer: "La zone mémoire de la JVM où vivent les objets, libérée par le ramasse-miettes. Les appels de méthode et leurs variables locales vivent, eux, dans la pile (*stack*) de chaque thread."
