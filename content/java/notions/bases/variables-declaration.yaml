notion: variables-declaration
lesson: |-
  Une variable est une case nommée qui contient une valeur d'un **type fixé** :

  ```java
  int age;          // déclaration : le type, puis le nom
  age = 30;         // affectation : on range une valeur
  int annee = 2026; // déclaration et initialisation en une fois
  age = age + 1;    // nouvelle affectation : l'ancienne valeur est remplacée
  ```

  - Le type ne change jamais : une variable `int` ne contiendra jamais de texte.
  - Une **variable locale** (déclarée dans une méthode) doit recevoir une valeur **avant d'être lue** ; sinon le
    compilateur refuse (`variable might not have been initialized`).
  - `=` **affecte** (de droite à gauche) ; il ne compare pas. La comparaison s'écrit `==`.
  - Un nom commence par une lettre (ou `_`, `$`), jamais par un chiffre, et ne peut pas être un mot réservé
    (`class`, `int`, `new`...).
  - Copier une variable primitive copie sa **valeur** : modifier la copie ne touche pas l'original.

  **Piège classique** : redéclarer une variable (`int total = 0; ... int total = 5;`) au lieu de lui affecter une
  nouvelle valeur (`total = 5;`). Le compilateur refuse deux variables du même nom dans la même portée.

  **En entretien** : « On déclare avec un type et un nom ; une variable locale doit être initialisée avant d'être lue,
  c'est vérifié à la compilation. »
tour:
  - title: Déclarer des variables
    text: |-
      On déclare une variable avec son type, puis son nom : `int age = 36;`. On peut la déclarer sans valeur et
      l'affecter plus tard, mais le compilateur refuse de lire une variable **locale** qui n'a pas encore de valeur.

      `=` affecte une valeur ; `+=`, `-=` et `*=` combinent un calcul et une affectation.

      Essaie : supprime la ligne `total = 0;`, puis exécute.
    example:
      files:
        Main.java: |-
          void main() {
              int age = 36;
              String prenom = "Ada";
              int total;
              total = 0;
              total += age;
              total *= 2;
              IO.println(prenom + " " + age + " " + total);
          }
      output: |-
        Ada 36 72
cards:
  - key: declarer-initialiser-affecter
    format: course
    question: "Quelle différence entre déclarer, initialiser et affecter une variable ?"
    choices:
      - {text: "Déclarer la crée, initialiser lui donne sa première valeur, affecter la remplace", correct: true}
      - {text: "Déclarer lui donne une valeur, initialiser la crée, affecter la rend constante", correct: false}
      - {text: "Ce sont trois noms de la même opération : écrire `int age = 30;`", correct: false}
      - {text: "Déclarer la crée avec la valeur 0 ; initialiser et affecter sont synonymes", correct: false}
    answer: "**Déclarer** crée la variable (`int age;`), **initialiser** lui donne sa première valeur (`int age = 30;`), **affecter** remplace sa valeur ensuite (`age = 31;`). Une variable locale déclarée n'a aucune valeur, pas même 0."
  - key: lire-non-initialisee
    format: course
    question: "Que se passe-t-il si on lit une variable locale jamais initialisée ?"
    choices:
      - {text: "Ça ne compile pas : Java vérifie l'initialisation avant l'exécution", correct: true}
      - {text: "Elle vaut 0, ou `null` pour une variable de type référence", correct: false}
      - {text: "Elle contient la valeur qui traînait en mémoire, comme en C", correct: false}
      - {text: "Une `NullPointerException` est levée à l'exécution", correct: false}
    answer: "Le code ne compile pas (`variable might not have been initialized`) : Java le vérifie avant l'exécution. Les valeurs par défaut (0, `null`) ne valent que pour les champs et les cases de tableau."
  - key: regles-de-nom
    format: course
    question: "Quelles règles un nom de variable doit-il respecter ?"
    choices:
      - {text: "Commencer par une lettre, `_` ou `$`, sans espace ni tiret, et ne pas être un mot réservé", correct: true}
      - {text: "Commencer par une lettre ou un chiffre, sans espace, et ne pas être un mot réservé", correct: false}
      - {text: "Commencer par une minuscule, sinon le code ne compile pas, et faire 32 caractères au plus", correct: false}
      - {text: "Commencer par une lettre ; les tirets sont permis, comme dans `nombre-total`", correct: false}
    answer: "Commencer par une lettre, `_` ou `$` (jamais un chiffre), ne contenir ni espace ni tiret, et ne pas être un mot réservé comme `class` ou `new`. La minuscule initiale et le camelCase sont une convention, pas une règle du compilateur."
  - key: copie-de-valeur
    format: course
    question: "Après `int b = a;`, modifier `b` change-t-il `a` ?"
    choices:
      - {text: "Non : `b = a` copie la valeur, les deux variables sont indépendantes", correct: true}
      - {text: "Oui : `b` et `a` désignent la même case mémoire", correct: false}
      - {text: "Oui, tant que `a` n'est pas déclarée `final`", correct: false}
      - {text: "Non, sauf si `b` est modifiée par `++`", correct: false}
    answer: "Non : pour un primitif, `b = a` copie la **valeur** ; les deux variables sont indépendantes."
  - key: vf-initialiser-avant-lecture
    format: true-false
    question: Une variable locale doit être initialisée avant d'être lue.
    truth: true
    answer: Le compilateur le vérifie ; sinon, erreur `variable might not have been initialized`.
  - key: vf-changer-type
    format: true-false
    question: Une variable déclarée `int` peut ensuite recevoir une chaîne de caractères.
    truth: false
    answer: Le type d'une variable est fixé à sa déclaration ; Java est typé statiquement.
  - key: vf-nom-chiffre
    format: true-false
    question: Un nom de variable peut commencer par un chiffre, comme `2essai`.
    truth: false
    answer: Un nom commence par une lettre, `_` ou `$` ; `essai2` est valide, `2essai` non.
  - key: vf-deux-declarations
    format: true-false
    question: "`int a = 1, b = 2;` déclare deux variables."
    truth: true
    answer: C'est permis, mais une déclaration par ligne reste plus lisible.
  - key: qcm-nom-valide
    format: multiple-choice
    question: Quel nom de variable est valide ?
    choices:
      - text: "`prixTotal`"
        correct: true
      - text: "`2prix`"
        correct: false
      - text: "`prix-total`"
        correct: false
      - text: "`class`"
        correct: false
    answer: Un nom ne commence pas par un chiffre, ne contient pas de tiret et n'est pas un mot réservé.
  - key: qcm-role-egal
    format: multiple-choice
    question: Que fait `x = 5;` quand `x` est déjà déclarée ?
    choices:
      - text: "Elle range 5 dans `x`, en remplaçant l'ancienne valeur"
        correct: true
      - text: "Elle compare `x` à 5"
        correct: false
      - text: "Elle déclare une nouvelle variable `x`"
        correct: false
      - text: "Elle ne compile pas"
        correct: false
    answer: '`=` affecte ; la comparaison s''écrit `==`.'
  - key: qcm-declarer-initialiser
    format: multiple-choice
    question: Quelle instruction déclare **et** initialise une variable ?
    choices:
      - text: "`int n = 0;`"
        correct: true
      - text: "`int n;`"
        correct: false
      - text: "`n = 0;`"
        correct: false
      - text: "`n == 0;`"
        correct: false
    answer: '`int n;` déclare seulement, `n = 0;` affecte seulement ; `n == 0` est une comparaison.'
  - key: qcm-valeurs-apres-copie
    format: multiple-choice
    question: Que valent `a` et `b` après `int a = 3; int b = a; b = 7;` ?
    choices:
      - text: "`a` vaut 3, `b` vaut 7"
        correct: true
      - text: "`a` et `b` valent 7"
        correct: false
      - text: "`a` et `b` valent 3"
        correct: false
      - text: "`a` vaut 7, `b` vaut 3"
        correct: false
    answer: '`b = a` copie la valeur 3 ; modifier `b` ensuite ne change pas `a`.'
  - key: trous-declarer-entier
    format: fill-in
    question: |-
      Complète pour déclarer un entier `age` qui vaut 30 :
      ```java
      ___ age ___ 30;
      ```
    blanks: [[int], ["="]]
    answer: Le type, le nom, puis `=` et la valeur.
  - key: trous-echange
    format: fill-in
    question: |-
      Complète pour échanger les valeurs de `a` et `b` :
      ```java
      int tmp = a;
      a = b;
      b = ___;
      ```
    blanks: [[tmp]]
    answer: '`tmp` a gardé l''ancienne valeur de `a`, écrasée entre-temps.'
  - key: trous-texte
    format: fill-in
    question: |-
      Complète avec un type qui convient :
      ```java
      ___ ville = "Lyon";
      ```
    blanks: [[String, var]]
    answer: '`String`, ou `var` qui laisse le compilateur l''inférer.'
  - key: trous-incrementer
    format: fill-in
    question: |-
      Complète pour ajouter 1 à `compteur` :
      ```java
      compteur = ___ + 1;
      ```
    blanks: [[compteur]]
    answer: On lit l'ancienne valeur, on ajoute 1, puis on range le résultat dans la même variable.
  - key: code-copie-independante
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int a = 5;
      int b = a;
      a = 10;
      System.out.println(b);
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`15`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`5` : `b` a reçu une copie de la valeur de `a` ; changer `a` ensuite ne le touche pas."
    check:
      code: |-
        void run() {
            int a = 5;
            int b = a;
            a = 10;
            System.out.println(b);
        }
        run();
      output: "5"
  - key: code-affectations-successives
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int x = 1;
      x = x + 1;
      x = x * 3;
      System.out.println(x);
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`9`", correct: false}
    answer: "`6` : `x` vaut 1, puis 2, puis 2 × 3. Chaque affectation part de la valeur laissée par la précédente."
    check:
      output: "6"
  - key: code-echange
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int a = 1, b = 2;
      int tmp = a;
      a = b;
      b = tmp;
      System.out.println(a + " " + b);
      ```
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`2 1` : les deux valeurs ont été échangées grâce à `tmp`. Sans elle, `a = b` aurait écrasé l'ancienne valeur de `a`, et on aurait `2 2`."
    check:
      output: "2 1"
  - key: code-chaine-reaffectee
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String nom = "Ada";
      nom = nom + " Lovelace";
      System.out.println(nom);
      ```
    choices:
      - {text: "`Ada Lovelace`", correct: true}
      - {text: "`Ada`", correct: false}
      - {text: "`Lovelace`", correct: false}
      - {text: "`AdaLovelace`", correct: false}
    answer: "`Ada Lovelace` : la nouvelle chaîne, avec l'espace de `\" Lovelace\"`, remplace l'ancienne dans `nom`."
    check:
      output: "Ada Lovelace"
  - key: bug-non-initialisee
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable total might not have been initialized`). Quelle correction est la bonne ?
      ```java
      int total;
      System.out.println(total);
      ```
    choices:
      - {text: "Initialiser la variable : `int total = 0;`", correct: true}
      - {text: "Remplacer `int` par `Integer`, qui vaut `null` par défaut", correct: false}
      - {text: "Déclarer la variable `final int total;`", correct: false}
      - {text: "Afficher avec `print` au lieu de `println`", correct: false}
    answer: |-
      ```java
      int total = 0;
      System.out.println(total);
      ```
      Une variable locale doit recevoir une valeur avant d'être lue. Une variable locale `Integer` n'a pas plus de valeur par défaut qu'un `int`.
  - key: bug-nom-chiffre
    format: bug-fix
    question: |-
      Ce code ne compile pas. Pourquoi ?
      ```java
      int 2emeEssai = 0;
      ```
    choices:
      - {text: "Un nom de variable ne peut pas commencer par un chiffre", correct: true}
      - {text: "Un nom de variable ne peut contenir aucun chiffre", correct: false}
      - {text: "Un nom de variable doit commencer par une majuscule", correct: false}
      - {text: "Les mots d'un nom doivent être séparés par un tiret", correct: false}
    answer: |-
      ```java
      int deuxiemeEssai = 0;
      ```
      Un nom de variable ne peut pas commencer par un chiffre ; il peut en contenir ensuite (`essai2` compile).
  - key: bug-type-incompatible
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: String cannot be converted to int`). Quelle correction est la bonne ?
      ```java
      int age = "30";
      ```
    choices:
      - {text: "Écrire le nombre sans guillemets : `int age = 30;`", correct: true}
      - {text: "Caster la chaîne : `int age = (int) \"30\";`", correct: false}
      - {text: "Changer le type : `char age = \"30\";`", correct: false}
      - {text: "Prendre des apostrophes : `int age = '30';`", correct: false}
    answer: |-
      ```java
      int age = 30;
      ```
      `"30"` est une chaîne ; un `int` reçoit un nombre, et aucun cast ne convertit une `String` en `int`. Pour convertir un texte saisi, on écrirait `Integer.parseInt("30")`.
  - key: bug-redeclaration
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable compteur is already defined`). Quelle correction est la bonne ?
      ```java
      int compteur = 0;
      int compteur = 1;
      ```
    choices:
      - {text: "Affecter sans redéclarer : `compteur = 1;`", correct: true}
      - {text: "Ajouter `final` devant la seconde déclaration", correct: false}
      - {text: "Écrire la seconde avec `var compteur = 1;`", correct: false}
      - {text: "Écrire la seconde avec `long compteur = 1;`", correct: false}
    answer: |-
      ```java
      int compteur = 0;
      compteur = 1;
      ```
      La variable existe déjà : on lui affecte une nouvelle valeur, sans la redéclarer, quel que soit le type écrit devant.
