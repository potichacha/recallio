notion: variables-declaration
lesson: |-
  Une variable est une case nommée qui contient une valeur d'un **type fixé** :

  ```java
  int age;          // déclaration : le type, puis le nom
  age = 30;         // affectation : on range une valeur
  int annee = 2026; // déclaration et initialisation en une fois
  age = age + 1;    // nouvelle affectation : l'ancienne valeur est remplacée
  ```

  - Le type ne change jamais : une variable `int` ne contiendra jamais de texte.
  - Une **variable locale** (déclarée dans une méthode) doit recevoir une valeur **avant d'être lue** ; sinon le
    compilateur refuse (`variable might not have been initialized`).
  - `=` **affecte** (de droite à gauche) ; il ne compare pas. La comparaison s'écrit `==`.
  - Un nom commence par une lettre (ou `_`, `$`), jamais par un chiffre, et ne peut pas être un mot réservé
    (`class`, `int`, `new`...).
  - Copier une variable primitive copie sa **valeur** : modifier la copie ne touche pas l'original.

  **Piège classique** : redéclarer une variable (`int total = 0; ... int total = 5;`) au lieu de lui affecter une
  nouvelle valeur (`total = 5;`). Le compilateur refuse deux variables du même nom dans la même portée.

  **En entretien** : « On déclare avec un type et un nom ; une variable locale doit être initialisée avant d'être lue,
  c'est vérifié à la compilation. »
tour:
  - title: Déclarer des variables
    text: |-
      On déclare une variable avec son type, puis son nom : `int age = 36;`. On peut la déclarer sans valeur et
      l'affecter plus tard, mais le compilateur refuse de lire une variable **locale** qui n'a pas encore de valeur.

      `=` affecte une valeur ; `+=`, `-=` et `*=` combinent un calcul et une affectation.

      Essaie : supprime la ligne `total = 0;`, puis exécute.
    example:
      files:
        Main.java: |-
          void main() {
              int age = 36;
              String prenom = "Ada";
              int total;
              total = 0;
              total += age;
              total *= 2;
              IO.println(prenom + " " + age + " " + total);
          }
      output: |-
        Ada 36 72
cards:
  - key: declarer-initialiser-affecter
    format: course
    question: Quelle différence entre déclarer, initialiser et affecter une variable ?
    answer: |-
      **Déclarer** crée la variable (`int age;`), **initialiser** lui donne sa première valeur (`int age = 30;`),
      **affecter** remplace sa valeur ensuite (`age = 31;`).
  - key: lire-non-initialisee
    format: course
    question: Que se passe-t-il si on lit une variable locale jamais initialisée ?
    answer: "Le code ne compile pas (`variable might not have been initialized`) : Java le vérifie avant l'exécution."
  - key: regles-de-nom
    format: course
    question: Quelles règles un nom de variable doit-il respecter ?
    answer: |-
      Commencer par une lettre, `_` ou `$` (jamais un chiffre), ne contenir ni espace ni tiret, et ne pas être un mot
      réservé comme `class` ou `new`. Par convention, il s'écrit en camelCase.
  - key: copie-de-valeur
    format: course
    question: Après `int b = a;`, modifier `b` change-t-il `a` ?
    answer: "Non : pour un primitif, `b = a` copie la **valeur** ; les deux variables sont indépendantes."
  - key: vf-initialiser-avant-lecture
    format: true-false
    question: Une variable locale doit être initialisée avant d'être lue.
    truth: true
    answer: Le compilateur le vérifie ; sinon, erreur `variable might not have been initialized`.
  - key: vf-changer-type
    format: true-false
    question: Une variable déclarée `int` peut ensuite recevoir une chaîne de caractères.
    truth: false
    answer: Le type d'une variable est fixé à sa déclaration ; Java est typé statiquement.
  - key: vf-nom-chiffre
    format: true-false
    question: Un nom de variable peut commencer par un chiffre, comme `2essai`.
    truth: false
    answer: Un nom commence par une lettre, `_` ou `$` ; `essai2` est valide, `2essai` non.
  - key: vf-deux-declarations
    format: true-false
    question: "`int a = 1, b = 2;` déclare deux variables."
    truth: true
    answer: C'est permis, mais une déclaration par ligne reste plus lisible.
  - key: qcm-nom-valide
    format: multiple-choice
    question: Quel nom de variable est valide ?
    choices:
      - text: "`prixTotal`"
        correct: true
      - text: "`2prix`"
        correct: false
      - text: "`prix-total`"
        correct: false
      - text: "`class`"
        correct: false
    answer: Un nom ne commence pas par un chiffre, ne contient pas de tiret et n'est pas un mot réservé.
  - key: qcm-role-egal
    format: multiple-choice
    question: Que fait `x = 5;` quand `x` est déjà déclarée ?
    choices:
      - text: "Elle range 5 dans `x`, en remplaçant l'ancienne valeur"
        correct: true
      - text: "Elle compare `x` à 5"
        correct: false
      - text: "Elle déclare une nouvelle variable `x`"
        correct: false
      - text: "Elle ne compile pas"
        correct: false
    answer: '`=` affecte ; la comparaison s''écrit `==`.'
  - key: qcm-declarer-initialiser
    format: multiple-choice
    question: Quelle instruction déclare **et** initialise une variable ?
    choices:
      - text: "`int n = 0;`"
        correct: true
      - text: "`int n;`"
        correct: false
      - text: "`n = 0;`"
        correct: false
      - text: "`n == 0;`"
        correct: false
    answer: '`int n;` déclare seulement, `n = 0;` affecte seulement ; `n == 0` est une comparaison.'
  - key: qcm-valeurs-apres-copie
    format: multiple-choice
    question: Que valent `a` et `b` après `int a = 3; int b = a; b = 7;` ?
    choices:
      - text: "`a` vaut 3, `b` vaut 7"
        correct: true
      - text: "`a` et `b` valent 7"
        correct: false
      - text: "`a` et `b` valent 3"
        correct: false
      - text: "`a` vaut 7, `b` vaut 3"
        correct: false
    answer: '`b = a` copie la valeur 3 ; modifier `b` ensuite ne change pas `a`.'
  - key: trous-declarer-entier
    format: fill-in
    question: |-
      Complétez pour déclarer un entier `age` qui vaut 30 :
      ```java
      ___ age ___ 30;
      ```
    blanks: [[int], ["="]]
    answer: Le type, le nom, puis `=` et la valeur.
  - key: trous-echange
    format: fill-in
    question: |-
      Complétez pour échanger les valeurs de `a` et `b` :
      ```java
      int tmp = a;
      a = b;
      b = ___;
      ```
    blanks: [[tmp]]
    answer: '`tmp` a gardé l''ancienne valeur de `a`, écrasée entre-temps.'
  - key: trous-texte
    format: fill-in
    question: |-
      Complétez avec un type qui convient :
      ```java
      ___ ville = "Lyon";
      ```
    blanks: [[String, var]]
    answer: '`String`, ou `var` qui laisse le compilateur l''inférer.'
  - key: trous-incrementer
    format: fill-in
    question: |-
      Complétez pour ajouter 1 à `compteur` :
      ```java
      compteur = ___ + 1;
      ```
    blanks: [[compteur]]
    answer: On lit l'ancienne valeur, on ajoute 1, puis on range le résultat dans la même variable.
  - key: code-copie-independante
    format: code-output
    question: |-
      ```java
      int a = 5;
      int b = a;
      a = 10;
      System.out.println(b);
      ```
    answer: '`5` : `b` a reçu une copie de la valeur de `a` ; changer `a` ensuite ne le touche pas.'
    check:
      code: |-
        void run() {
            int a = 5;
            int b = a;
            a = 10;
            System.out.println(b);
        }
        run();
      output: "5"
  - key: code-affectations-successives
    format: code-output
    question: |-
      ```java
      int x = 1;
      x = x + 1;
      x = x * 3;
      System.out.println(x);
      ```
    answer: '`6` : `x` vaut 1, puis 2, puis 2 × 3.'
    check:
      output: "6"
  - key: code-echange
    format: code-output
    question: |-
      ```java
      int a = 1, b = 2;
      int tmp = a;
      a = b;
      b = tmp;
      System.out.println(a + " " + b);
      ```
    answer: '`2 1` : les deux valeurs ont été échangées grâce à `tmp`.'
    check:
      output: "2 1"
  - key: code-chaine-reaffectee
    format: code-output
    question: |-
      ```java
      String nom = "Ada";
      nom = nom + " Lovelace";
      System.out.println(nom);
      ```
    answer: '`Ada Lovelace` : la nouvelle chaîne remplace l''ancienne dans `nom`.'
    check:
      output: "Ada Lovelace"
  - key: bug-non-initialisee
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable total might not have been initialized`) :
      ```java
      int total;
      System.out.println(total);
      ```
    answer: |-
      ```java
      int total = 0;
      System.out.println(total);
      ```
      Une variable locale doit recevoir une valeur avant d'être lue.
  - key: bug-nom-chiffre
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      int 2emeEssai = 0;
      ```
    answer: |-
      ```java
      int deuxiemeEssai = 0;
      ```
      Un nom de variable ne peut pas commencer par un chiffre.
  - key: bug-type-incompatible
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: String cannot be converted to int`) :
      ```java
      int age = "30";
      ```
    answer: |-
      ```java
      int age = 30;
      ```
      `"30"` est une chaîne ; un `int` reçoit un nombre. Pour convertir un texte saisi, on écrirait `Integer.parseInt("30")`.
  - key: bug-redeclaration
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable compteur is already defined`) :
      ```java
      int compteur = 0;
      int compteur = 1;
      ```
    answer: |-
      ```java
      int compteur = 0;
      compteur = 1;
      ```
      La variable existe déjà : on lui affecte une nouvelle valeur, sans la redéclarer.
