notion: boucle-while
lesson: |-
  `while` répète un bloc **tant que** sa condition est vraie ; la condition est testée **avant** chaque tour.

  ```java
  int restant = 3;
  while (restant > 0) {
      System.out.println(restant);
      restant--;
  }
  ```

  `do ... while` teste la condition **après** le tour : le bloc s'exécute **au moins une fois**.

  ```java
  String saisie;
  do {
      saisie = lireSaisie();
  } while (saisie.isBlank());      // on redemande tant que la saisie est vide
  ```

  - `while` convient quand on ne sait pas d'avance combien de tours il faudra (lire jusqu'à la fin d'un fichier,
    attendre une réponse valide) ; pour un nombre de tours connu, `for` est plus clair.
  - La condition doit finir par devenir fausse : quelque chose dans la boucle doit la faire évoluer.
  - `do ... while` se termine par un **point-virgule** après la condition.

  **Piège classique** : oublier de faire évoluer la variable testée (`restant--`). La condition reste vraie pour
  toujours : boucle infinie.

  **En entretien** : « `while` teste avant chaque tour et peut ne jamais s'exécuter ; `do-while` teste après et
  s'exécute au moins une fois. »
tour:
  - title: while et do-while
    text: |-
      `while (condition)` répète un bloc tant que la condition est vraie. Elle est testée **avant** chaque tour : le
      bloc peut ne jamais s'exécuter. `do { … } while (condition);` teste **après** : le bloc s'exécute au moins une
      fois.

      On choisit `while` quand on ne sait pas d'avance combien de tours il faudra, comme ici pour la suite de Syracuse.
    example:
      files:
        Main.java: |-
          void main() {
              int n = 27, etapes = 0;
              while (n != 1) {
                  n = n % 2 == 0 ? n / 2 : 3 * n + 1;
                  etapes++;
              }
              IO.println("étapes : " + etapes);

              int essais = 0;
              do {
                  essais++;
              } while (essais < 0);
              IO.println("essais : " + essais);
          }
      output: |-
        étapes : 111
        essais : 1
cards:
  - key: while-teste-avant
    format: course
    question: Quand la condition d'un `while` est-elle testée ?
    choices:
      - {text: "Avant chaque tour, dès le premier", correct: true}
      - {text: "Après chaque tour, comme un `do-while`", correct: false}
      - {text: "Une seule fois, avant le premier tour", correct: false}
      - {text: "Avant chaque tour, sauf le premier", correct: false}
    answer: "Avant chaque tour : si elle est fausse dès le départ, le bloc ne s'exécute jamais. C'est le `do-while` qui la teste après."
  - key: do-while
    format: course
    question: Qu'est-ce qui distingue `do ... while` de `while` ?
    choices:
      - {text: "Sa condition est testée après le tour : le bloc s'exécute au moins une fois", correct: true}
      - {text: "Sa condition est testée avant le tour, mais une seule fois au départ", correct: false}
      - {text: "Il s'arrête quand la condition devient vraie, et non fausse", correct: false}
      - {text: "Il ne peut pas contenir de `break` ni de `continue`", correct: false}
    answer: "La condition est testée **après** le tour : le bloc s'exécute **au moins une fois**."
  - key: while-ou-for
    format: course
    question: Quand préférer `while` à `for` ?
    choices:
      - {text: "Quand le nombre de tours n'est pas connu d'avance", correct: true}
      - {text: "Quand on parcourt un tableau du début à la fin", correct: false}
      - {text: "Quand on veut un compteur qui avance de 1 à chaque tour", correct: false}
      - {text: "Quand la boucle doit s'exécuter au moins une fois", correct: false}
    answer: "Quand le nombre de tours n'est pas connu d'avance (lire jusqu'à la fin des données, redemander une saisie invalide). Pour compter, `for` est plus lisible ; pour au moins un tour, c'est le `do-while`."
  - key: boucle-infinie
    format: course
    question: Pourquoi une boucle `while` peut-elle ne jamais s'arrêter ?
    choices:
      - {text: "Parce que rien dans la boucle ne rend la condition fausse", correct: true}
      - {text: "Parce que `while` n'a pas de limite de tours, contrairement à `for`", correct: false}
      - {text: "Parce que la condition n'est testée qu'une fois, au départ", correct: false}
      - {text: "Parce qu'une boucle `while` ne peut pas contenir de `break`", correct: false}
    answer: |-
      Parce que rien dans la boucle ne rend la condition fausse : on a oublié de faire évoluer la variable testée.
      `while (true)` est infini volontairement, et doit contenir un `break` ou un `return`.
  - key: vf-while-zero-tour
    format: true-false
    question: Le bloc d'un `while` s'exécute au moins une fois.
    truth: false
    answer: Si la condition est fausse dès le départ, il ne s'exécute pas ; c'est `do-while` qui garantit un tour.
  - key: vf-do-while-un-tour
    format: true-false
    question: Le bloc d'un `do ... while` s'exécute au moins une fois.
    truth: true
    answer: La condition n'est testée qu'après le premier tour.
  - key: vf-point-virgule-do
    format: true-false
    question: Un `do ... while` se termine par un point-virgule après la condition.
    truth: true
    answer: '`do { ... } while (condition);`'
  - key: vf-while-true
    format: true-false
    question: "`while (true)` ne compile pas."
    truth: false
    answer: C'est une boucle infinie volontaire, dont on sort par `break` ou `return`.
  - key: qcm-nombre-de-tours
    format: multiple-choice
    question: "Combien de fois `int i = 10; while (i < 5) { i++; }` exécute-t-il son bloc ?"
    choices:
      - text: "Aucune"
        correct: true
      - text: "Une"
        correct: false
      - text: "Cinq"
        correct: false
      - text: "À l'infini"
        correct: false
    answer: '`10 < 5` est faux dès le départ.'
  - key: qcm-saisie
    format: multiple-choice
    question: Quelle boucle convient le mieux pour redemander une saisie tant qu'elle est invalide ?
    choices:
      - text: "`do ... while`"
        correct: true
      - text: "`for` de 0 à 10"
        correct: false
      - text: "for-each"
        correct: false
      - text: "`switch`"
        correct: false
    answer: "Il faut lire au moins une fois avant de pouvoir vérifier : `do-while`."
  - key: qcm-infinie
    format: multiple-choice
    question: Quelle boucle ne s'arrête jamais ?
    choices:
      - text: "`int n = 3; while (n > 0) { System.out.println(n); }`"
        correct: true
      - text: "`int n = 3; while (n > 0) { n--; }`"
        correct: false
      - text: "`int n = 0; while (n > 0) { n++; }`"
        correct: false
      - text: "`int n = 3; do { n--; } while (n > 0);`"
        correct: false
    answer: '`n` ne change jamais dans la première : `n > 0` reste vrai.'
  - key: qcm-sortir-while-true
    format: multiple-choice
    question: "Quelle instruction quitte la boucle `while (true)` et continue après elle, dans la même méthode ?"
    choices:
      - {text: "`break`", correct: true}
      - {text: "`continue`", correct: false}
      - {text: "`System.exit(0)`", correct: false}
      - {text: "Aucune : un `while (true)` ne se quitte pas", correct: false}
    answer: "`break` quitte la boucle et l'exécution reprend après elle. `continue` passe au tour suivant, `return` quitterait la méthode entière, et `System.exit` arrête le programme."
  - key: trous-while
    format: fill-in
    question: |-
      Complète pour afficher 3, 2, 1 :
      ```java
      int n = 3;
      ___ (n > 0) {
          System.out.println(n);
          n___;
      }
      ```
    blanks: [[while], ["--"]]
    answer: '`while` répète tant que `n > 0`, et `n--` fait évoluer la condition.'
  - key: trous-do
    format: fill-in
    question: |-
      Complète pour lire au moins une fois :
      ```java
      ___ {
          saisie = lire();
      } while (saisie.isBlank());
      ```
    blanks: [[do]]
    answer: '`do` ouvre le bloc, exécuté avant le premier test.'
  - key: trous-fin-do-while
    format: fill-in
    question: |-
      Complète la fin du `do-while` :
      ```java
      do {
          essais++;
      } ___ (essais < 3)___
      ```
    blanks: [[while], [";"]]
    answer: Le `do-while` se termine par `while (condition);`.
  - key: trous-condition
    format: fill-in
    question: |-
      Complète pour diviser `n` par 2 tant qu'il est pair :
      ```java
      while (n % 2 ___ 0) {
          n = n / 2;
      }
      ```
    blanks: [["=="]]
    answer: On continue tant que le reste de la division par 2 est nul.
  - key: code-decompte
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int n = 3;
      while (n > 0) {
          System.out.print(n);
          n--;
      }
      ```
    choices:
      - {text: "`321`", correct: true}
      - {text: "`3210`", correct: false}
      - {text: "`123`", correct: false}
      - {text: "`32`", correct: false}
    answer: "`321` : trois tours, puis `n` vaut 0 et la condition `n > 0` devient fausse avant d'afficher 0."
    check:
      output: "321"
  - key: code-zero-tour
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int n = 0;
      while (n > 0) {
          System.out.println("tour");
      }
      System.out.println("fin");
      ```
    choices:
      - {text: "`fin`", correct: true}
      - text: |-
          ```
          tour
          fin
          ```
        correct: false
      - {text: "Rien : la boucle ne s'arrête jamais", correct: false}
      - {text: "`tour`", correct: false}
    answer: "`fin` : la condition `0 > 0` est fausse dès le départ, le bloc ne s'exécute jamais, et le programme passe à la suite."
    check:
      output: "fin"
  - key: code-do-while-un-tour
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int n = 0;
      do {
          System.out.println("tour");
      } while (n > 0);
      ```
    choices:
      - {text: "`tour`", correct: true}
      - {text: "Rien", correct: false}
      - text: |-
          ```
          tour
          tour
          ```
        correct: false
      - {text: "`tour`, répété sans fin", correct: false}
    answer: "`tour` : le bloc d'un `do-while` s'exécute une fois avant le premier test ; ensuite `0 > 0` est faux et la boucle s'arrête."
    check:
      output: "tour"
  - key: code-puissance-de-deux
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int n = 1;
      int tours = 0;
      while (n < 100) {
          n = n * 2;
          tours++;
      }
      System.out.println(n + " " + tours);
      ```
    choices:
      - {text: "`128 7`", correct: true}
      - {text: "`64 6`", correct: false}
      - {text: "`128 6`", correct: false}
      - {text: "`100 7`", correct: false}
    answer: "`128 7` : 1, 2, 4, ..., 64 sont inférieurs à 100 ; au 7ᵉ tour, `n` passe de 64 à 128, et le test suivant arrête la boucle."
    check:
      output: "128 7"
  - key: bug-pas-d-evolution
    format: bug-fix
    question: |-
      Cette boucle ne s'arrête jamais. Quelle correction est la bonne ?
      ```java
      int restant = 5;
      while (restant > 0) {
          System.out.println(restant);
      }
      ```
    choices:
      - {text: "Ajouter `restant--;` dans le corps de la boucle", correct: true}
      - {text: "Remplacer `restant > 0` par `restant >= 0`", correct: false}
      - {text: "Ajouter `restant--;` juste avant la boucle", correct: false}
      - {text: "Remplacer `while` par `do ... while`", correct: false}
    answer: |-
      ```java
      while (restant > 0) {
          System.out.println(restant);
          restant--;
      }
      ```
      Rien ne faisait évoluer `restant` : la condition restait vraie.
  - key: bug-saisie-avant
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable saisie might not have been initialized`). Quelle correction est la bonne ?
      ```java
      String saisie;
      while (saisie.isBlank()) {
          saisie = lire();
      }
      ```
    choices:
      - {text: "Un `do-while` : lire d'abord, tester ensuite", correct: true}
      - {text: "Initialiser `saisie` à `null` avant la boucle", correct: false}
      - {text: "Déclarer `saisie` à l'intérieur de la boucle", correct: false}
      - {text: "Remplacer `isBlank()` par `isEmpty()`", correct: false}
    answer: |-
      ```java
      String saisie;
      do {
          saisie = lire();
      } while (saisie.isBlank());
      ```
      On ne peut tester la saisie qu'après l'avoir lue au moins une fois : c'est un `do-while`. L'initialiser à `null` compilerait, mais lèverait une `NullPointerException` au premier test.
  - key: bug-point-virgule-while
    format: bug-fix
    question: |-
      Ce programme se fige sans rien afficher. Pourquoi ?
      ```java
      int i = 0;
      while (i < 3); {
          System.out.println(i);
          i++;
      }
      ```
    choices:
      - {text: "Le `;` après la condition donne au `while` un corps vide", correct: true}
      - {text: "`i` doit être déclarée dans la condition du `while`", correct: false}
      - {text: "`println` bloque tant que la boucle n'est pas finie", correct: false}
      - {text: "La condition devrait être `i <= 3` pour s'arrêter", correct: false}
    answer: |-
      ```java
      while (i < 3) {
          System.out.println(i);
          i++;
      }
      ```
      Le `;` après la condition donne au `while` un corps vide : `i` n'augmente jamais et la boucle tourne à l'infini.
  - key: bug-condition-inversee
    format: bug-fix
    question: |-
      On veut doubler le capital jusqu'à dépasser 1000, mais la boucle ne fait aucun tour. Quelle correction est la bonne ?
      ```java
      double capital = 100;
      while (capital > 1000) {
          capital = capital * 2;
      }
      ```
    choices:
      - {text: "Écrire `while (capital <= 1000)`", correct: true}
      - {text: "Écrire `while (capital >= 1000)`", correct: false}
      - {text: "Écrire `while (capital == 1000)`", correct: false}
      - {text: "Remplacer `while` par `do ... while`", correct: false}
    answer: |-
      ```java
      while (capital <= 1000) {
          capital = capital * 2;
      }
      ```
      La condition dit quand **continuer**, pas quand s'arrêter.
