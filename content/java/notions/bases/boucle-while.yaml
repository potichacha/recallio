notion: boucle-while
lesson: |-
  `while` répète un bloc **tant que** sa condition est vraie ; la condition est testée **avant** chaque tour.

  ```java
  int restant = 3;
  while (restant > 0) {
      System.out.println(restant);
      restant--;
  }
  ```

  `do ... while` teste la condition **après** le tour : le bloc s'exécute **au moins une fois**.

  ```java
  String saisie;
  do {
      saisie = lireSaisie();
  } while (saisie.isBlank());      // on redemande tant que la saisie est vide
  ```

  - `while` convient quand on ne sait pas d'avance combien de tours il faudra (lire jusqu'à la fin d'un fichier,
    attendre une réponse valide) ; pour un nombre de tours connu, `for` est plus clair.
  - La condition doit finir par devenir fausse : quelque chose dans la boucle doit la faire évoluer.
  - `do ... while` se termine par un **point-virgule** après la condition.

  **Piège classique** : oublier de faire évoluer la variable testée (`restant--`). La condition reste vraie pour
  toujours : boucle infinie.

  **En entretien** : « `while` teste avant chaque tour et peut ne jamais s'exécuter ; `do-while` teste après et
  s'exécute au moins une fois. »
cards:
  - key: while-teste-avant
    format: course
    question: Quand la condition d'un `while` est-elle testée ?
    answer: "Avant chaque tour : si elle est fausse dès le départ, le bloc ne s'exécute jamais."
  - key: do-while
    format: course
    question: Qu'est-ce qui distingue `do ... while` de `while` ?
    answer: "La condition est testée **après** le tour : le bloc s'exécute **au moins une fois**."
  - key: while-ou-for
    format: course
    question: Quand préférer `while` à `for` ?
    answer: |-
      Quand le nombre de tours n'est pas connu d'avance (lire jusqu'à la fin des données, redemander une saisie
      invalide). Pour compter, `for` est plus lisible.
  - key: boucle-infinie
    format: course
    question: Pourquoi une boucle `while` peut-elle ne jamais s'arrêter ?
    answer: |-
      Parce que rien dans la boucle ne rend la condition fausse : on a oublié de faire évoluer la variable testée.
      `while (true)` est infini volontairement, et doit contenir un `break` ou un `return`.
  - key: vf-while-zero-tour
    format: true-false
    question: Le bloc d'un `while` s'exécute au moins une fois.
    truth: false
    answer: Si la condition est fausse dès le départ, il ne s'exécute pas ; c'est `do-while` qui garantit un tour.
  - key: vf-do-while-un-tour
    format: true-false
    question: Le bloc d'un `do ... while` s'exécute au moins une fois.
    truth: true
    answer: La condition n'est testée qu'après le premier tour.
  - key: vf-point-virgule-do
    format: true-false
    question: Un `do ... while` se termine par un point-virgule après la condition.
    truth: true
    answer: '`do { ... } while (condition);`'
  - key: vf-while-true
    format: true-false
    question: "`while (true)` ne compile pas."
    truth: false
    answer: C'est une boucle infinie volontaire, dont on sort par `break` ou `return`.
  - key: qcm-nombre-de-tours
    format: multiple-choice
    question: "Combien de fois `int i = 10; while (i < 5) { i++; }` exécute-t-il son bloc ?"
    choices:
      - text: "Aucune"
        correct: true
      - text: "Une"
        correct: false
      - text: "Cinq"
        correct: false
      - text: "À l'infini"
        correct: false
    answer: '`10 < 5` est faux dès le départ.'
  - key: qcm-saisie
    format: multiple-choice
    question: Quelle boucle convient le mieux pour redemander une saisie tant qu'elle est invalide ?
    choices:
      - text: "`do ... while`"
        correct: true
      - text: "`for` de 0 à 10"
        correct: false
      - text: "for-each"
        correct: false
      - text: "`switch`"
        correct: false
    answer: "Il faut lire au moins une fois avant de pouvoir vérifier : `do-while`."
  - key: qcm-infinie
    format: multiple-choice
    question: Quelle boucle ne s'arrête jamais ?
    choices:
      - text: "`int n = 3; while (n > 0) { System.out.println(n); }`"
        correct: true
      - text: "`int n = 3; while (n > 0) { n--; }`"
        correct: false
      - text: "`int n = 0; while (n > 0) { n++; }`"
        correct: false
      - text: "`int n = 3; do { n--; } while (n > 0);`"
        correct: false
    answer: '`n` ne change jamais dans la première : `n > 0` reste vrai.'
  - key: qcm-sortir-while-true
    format: multiple-choice
    question: Comment sortir d'un `while (true)` ?
    choices:
      - text: "`break`"
        correct: true
      - text: "`return`"
        correct: true
      - text: "`continue`"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: '`break` quitte la boucle, `return` quitte la méthode ; `continue` passe au tour suivant.'
  - key: trous-while
    format: fill-in
    question: |-
      Complétez pour afficher 3, 2, 1 :
      ```java
      int n = 3;
      ___ (n > 0) {
          System.out.println(n);
          n___;
      }
      ```
    blanks: [[while], ["--"]]
    answer: '`while` répète tant que `n > 0`, et `n--` fait évoluer la condition.'
  - key: trous-do
    format: fill-in
    question: |-
      Complétez pour lire au moins une fois :
      ```java
      ___ {
          saisie = lire();
      } while (saisie.isBlank());
      ```
    blanks: [[do]]
    answer: '`do` ouvre le bloc, exécuté avant le premier test.'
  - key: trous-fin-do-while
    format: fill-in
    question: |-
      Complétez la fin du `do-while` :
      ```java
      do {
          essais++;
      } ___ (essais < 3)___
      ```
    blanks: [[while], [";"]]
    answer: Le `do-while` se termine par `while (condition);`.
  - key: trous-condition
    format: fill-in
    question: |-
      Complétez pour diviser `n` par 2 tant qu'il est pair :
      ```java
      while (n % 2 ___ 0) {
          n = n / 2;
      }
      ```
    blanks: [["=="]]
    answer: On continue tant que le reste de la division par 2 est nul.
  - key: code-decompte
    format: code-output
    question: |-
      ```java
      int n = 3;
      while (n > 0) {
          System.out.print(n);
          n--;
      }
      ```
    answer: '`321` : trois tours, puis `n` vaut 0 et la condition devient fausse.'
    check:
      output: "321"
  - key: code-zero-tour
    format: code-output
    question: |-
      ```java
      int n = 0;
      while (n > 0) {
          System.out.println("tour");
      }
      System.out.println("fin");
      ```
    answer: '`fin` : la condition est fausse dès le départ, le bloc ne s''exécute jamais.'
    check:
      output: "fin"
  - key: code-do-while-un-tour
    format: code-output
    question: |-
      ```java
      int n = 0;
      do {
          System.out.println("tour");
      } while (n > 0);
      ```
    answer: '`tour` : le bloc s''exécute une fois avant le premier test.'
    check:
      output: "tour"
  - key: code-puissance-de-deux
    format: code-output
    question: |-
      ```java
      int n = 1;
      int tours = 0;
      while (n < 100) {
          n = n * 2;
          tours++;
      }
      System.out.println(n + " " + tours);
      ```
    answer: '`128 7` : 1, 2, 4, ..., 64 sont inférieurs à 100 ; au 7ᵉ tour, `n` passe à 128.'
    check:
      output: "128 7"
  - key: bug-pas-d-evolution
    format: bug-fix
    question: |-
      Cette boucle ne s'arrête jamais :
      ```java
      int restant = 5;
      while (restant > 0) {
          System.out.println(restant);
      }
      ```
    answer: |-
      ```java
      while (restant > 0) {
          System.out.println(restant);
          restant--;
      }
      ```
      Rien ne faisait évoluer `restant` : la condition restait vraie.
  - key: bug-saisie-avant
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable saisie might not have been initialized`) :
      ```java
      String saisie;
      while (saisie.isBlank()) {
          saisie = lire();
      }
      ```
    answer: |-
      ```java
      String saisie;
      do {
          saisie = lire();
      } while (saisie.isBlank());
      ```
      On ne peut tester la saisie qu'après l'avoir lue au moins une fois : c'est un `do-while`.
  - key: bug-point-virgule-while
    format: bug-fix
    question: |-
      Ce programme se fige sans rien afficher :
      ```java
      int i = 0;
      while (i < 3); {
          System.out.println(i);
          i++;
      }
      ```
    answer: |-
      ```java
      while (i < 3) {
          System.out.println(i);
          i++;
      }
      ```
      Le `;` après la condition donne au `while` un corps vide : `i` n'augmente jamais et la boucle tourne à l'infini.
  - key: bug-condition-inversee
    format: bug-fix
    question: |-
      On veut doubler le capital jusqu'à dépasser 1000, mais la boucle ne fait aucun tour :
      ```java
      double capital = 100;
      while (capital > 1000) {
          capital = capital * 2;
      }
      ```
    answer: |-
      ```java
      while (capital <= 1000) {
          capital = capital * 2;
      }
      ```
      La condition dit quand **continuer**, pas quand s'arrêter.
