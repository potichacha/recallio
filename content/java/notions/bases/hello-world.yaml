notion: hello-world
lesson: |-
  Le plus petit programme Java complet :

  ```java
  public class Bonjour {
      public static void main(String[] args) {
          System.out.println("Bonjour !");
      }
  }
  ```

  - Tout code vit dans une **classe** (`Bonjour`), rangée dans un fichier qui porte son nom : `Bonjour.java`.
  - La JVM démarre le programme par la méthode **`main`**, qui doit être exactement `public static void main(String[] args)`
    (`args` contient les arguments de la ligne de commande ; le nom du paramètre est libre).
  - `System.out.println` écrit une ligne sur la sortie standard ; `System.out.print` écrit sans retour à la ligne.
  - Chaque instruction se termine par un **point-virgule**, et les blocs sont délimités par des **accolades**.

  Depuis **Java 25**, la forme s'assouplit : `main` peut être une méthode d'instance (sans `static` : la JVM crée alors
  l'objet), sans paramètre, et un fichier peut même se contenter d'un `void main() { ... }` sans classe déclarée. C'est
  pratique pour apprendre ; en projet, on garde la forme classique, comprise par toutes les versions.

  **Piège classique** : écrire `Main` au lieu de `main`, ou se tromper de type de paramètre (`String` au lieu de
  `String[]`). Le code compile, mais la JVM ne trouve pas le point d'entrée au lancement.

  **En entretien** : « Dans sa forme classique, `main` est `static` parce que la JVM l'appelle sans créer d'objet ;
  depuis Java 25, une méthode `main` d'instance est aussi acceptée. »
tour:
  - title: Le premier programme
    text: |-
      Depuis Java 25, un programme peut tenir dans un **fichier source compact** : une méthode `void main()` suffit,
      sans classe à déclarer, et `IO.println` affiche une ligne.

      La forme classique, que tu croiseras partout, déclare une classe publique et une méthode `public static void
      main(String[] args)` :

      ```java
      public class Main {
          public static void main(String[] args) {
              System.out.println("Bonjour, Java !");
          }
      }
      ```

      Les deux sont du Java. Ce Tour commence par la forme compacte, et passe aux classes quand elles deviennent utiles.

      Essaie : remplace un `IO.println` par `IO.print`, puis exécute.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println("Bonjour, Java !");
              IO.println("2 + 3 = " + (2 + 3));
          }
      output: |-
        Bonjour, Java !
        2 + 3 = 5
    task:
      instructions: |-
        Fais afficher `Java est sorti en 1995`, en calculant l'année avec `1990 + 5` : attention aux parenthèses, sans
        quoi `+` colle les deux nombres à la chaîne.
      starter:
        Main.java: |-
          void main() {
              IO.println("Java est sorti en ...");
          }
      solution:
        Main.java: |-
          void main() {
              IO.println("Java est sorti en " + (1990 + 5));
          }
      output: |-
        Java est sorti en 1995
cards:
  - key: role-de-main
    format: course
    question: À quoi sert la méthode `main` ?
    choices:
      - text: "Elle compile le programme avant de le lancer"
        correct: false
      - text: "C'est le point d'entrée : la JVM commence l'exécution par elle"
        correct: true
      - text: "Elle est appelée à la fin, pour fermer le programme"
        correct: false
      - text: "Elle déclare les variables globales du programme"
        correct: false
    answer: "C'est le **point d'entrée** du programme : la JVM commence l'exécution par elle."
  - key: pourquoi-static
    format: course
    question: Pourquoi la méthode `main` classique est-elle `static` ?
    choices:
      - text: "Pour qu'on ne puisse plus la modifier"
        correct: false
      - text: "Pour que la JVM puisse l'appeler sans créer d'objet"
        correct: true
      - text: "Pour qu'aucune autre classe ne puisse l'appeler"
        correct: false
      - text: "Pour qu'elle s'exécute plus vite"
        correct: false
    answer: |-
      Pour que la JVM puisse l'appeler **sans créer d'objet** : une méthode `static` appartient à la classe, pas à une
      instance. Depuis Java 25, une méthode `main` d'instance est aussi acceptée : la JVM crée alors l'objet.
  - key: println-vs-print
    format: course
    question: Quelle différence entre `System.out.println` et `System.out.print` ?
    choices:
      - text: "`println` écrit dans un fichier, `print` à l'écran"
        correct: false
      - text: "`print` passe à la ligne après le texte, `println` non"
        correct: false
      - text: "`println` passe à la ligne après le texte, `print` non"
        correct: true
      - text: "Aucune : ce sont deux noms de la même méthode"
        correct: false
    answer: '`println` ajoute un retour à la ligne après le texte ; `print` n''en ajoute pas.'
  - key: role-de-args
    format: course
    question: Que contient le paramètre `args` de `main` ?
    choices:
      - text: "Les variables d'environnement du système"
        correct: false
      - text: "Le nom du fichier source"
        correct: false
      - text: "Les arguments de la ligne de commande, dans un tableau de chaînes"
        correct: true
      - text: "Les options données à la JVM, comme `-Xmx`"
        correct: false
    answer: |-
      Les **arguments de la ligne de commande**, sous forme de tableau de chaînes : `java Bonjour Ada Alan` donne
      `args[0] = "Ada"` et `args[1] = "Alan"`.
  - key: vf-nom-fichier
    format: true-false
    question: Une classe `public class Bonjour` doit être rangée dans un fichier `Bonjour.java`.
    truth: true
    answer: Une classe publique porte le nom de son fichier, majuscules comprises.
  - key: vf-point-virgule
    format: true-false
    question: En Java, le point-virgule en fin d'instruction est facultatif.
    truth: false
    answer: Chaque instruction se termine par `;`. Sans lui, le code ne compile pas.
  - key: vf-main-sans-static
    format: true-false
    question: Depuis Java 25, la méthode `main` peut ne pas être `static`.
    truth: true
    answer: |-
      Java 25 accepte une méthode `main` d'instance : la JVM crée un objet de la classe (avec son constructeur sans
      paramètre) pour l'appeler. Avant Java 25, `static` était obligatoire.
  - key: vf-nom-args-libre
    format: true-false
    question: Le paramètre de `main` doit obligatoirement s'appeler `args`.
    truth: false
    answer: Seul le type compte (`String[]`) ; `args` n'est qu'une convention.
  - key: qcm-signature-main
    format: multiple-choice
    question: Quelle est la signature classique de `main`, reconnue par toutes les versions de Java ?
    choices:
      - text: "`public static void main(String[] args)`"
        correct: true
      - text: "`public static void main(String args)`"
        correct: false
      - text: "`public static int main(String[] args)`"
        correct: false
      - text: "`public static void Main(String[] args)`"
        correct: false
    answer: '`public`, `static`, `void`, le nom `main` en minuscules, et un paramètre `String[]`.'
  - key: qcm-ecrire-une-ligne
    format: multiple-choice
    question: Quelle instruction affiche « Bonjour » suivi d'un retour à la ligne ?
    choices:
      - text: "`System.out.println(\"Bonjour\");`"
        correct: true
      - text: "`System.out.print(\"Bonjour\");`"
        correct: false
      - text: "`println(\"Bonjour\");`"
        correct: false
      - text: "`System.println(\"Bonjour\");`"
        correct: false
    answer: '`print` n''ajoute pas de retour à la ligne, et `println` est une méthode de `System.out`.'
  - key: qcm-delimiteurs
    format: multiple-choice
    question: Qu'est-ce qui délimite le corps d'une méthode en Java ?
    choices:
      - text: "Des accolades `{ }`"
        correct: true
      - text: "L'indentation"
        correct: false
      - text: "Les mots-clés `begin` et `end`"
        correct: false
      - text: "Des parenthèses `( )`"
        correct: false
    answer: Les accolades délimitent classes, méthodes et blocs ; l'indentation n'a aucun sens pour le compilateur.
  - key: qcm-fichier-classe
    format: multiple-choice
    question: Dans quel fichier range-t-on `public class Salut` ?
    choices:
      - text: "`Salut.java`"
        correct: true
      - text: "`salut.java`"
        correct: false
      - text: "`Salut.class`"
        correct: false
      - text: "`Main.java`"
        correct: false
    answer: Le fichier porte le nom exact de la classe publique ; `Salut.class` est le bytecode produit par `javac`.
  - key: trous-main
    format: fill-in
    question: |-
      Complète le point d'entrée du programme :
      ```java
      public class Bonjour {
          public ___ void ___(String[] args) {
              System.out.println("Bonjour !");
          }
      }
      ```
    blanks: [[static], [main]]
    answer: '`static` (la JVM l''appelle sans objet) et `main`, en minuscules.'
  - key: trous-afficher
    format: fill-in
    question: |-
      Complète pour afficher « Bonjour » et passer à la ligne :
      ```java
      System.___.___("Bonjour");
      ```
    blanks: [[out], [println]]
    answer: '`System.out` est la sortie standard ; `println` ajoute le retour à la ligne.'
  - key: trous-classe
    format: fill-in
    question: |-
      Complète la déclaration de la classe rangée dans `Salut.java` :
      ```java
      public ___ ___ {
      }
      ```
    blanks: [[class], [Salut]]
    answer: Le mot-clé `class`, puis le nom exact du fichier.
  - key: trous-args
    format: fill-in
    question: |-
      Complète pour afficher le premier argument de la ligne de commande :
      ```java
      public static void main(String[] args) {
          System.out.println(___);
      }
      ```
    blanks: [["args[0]"]]
    answer: Les tableaux commencent à l'indice 0 ; `args[0]` est le premier argument.
  - key: code-print-println
    format: code-output
    question: |-
      ```java
      System.out.print("A");
      System.out.println("B");
      System.out.print("C");
      ```
    choices:
      - text: |-
          ```
          A
          B
          C
          ```
        correct: false
      - text: |-
          ```
          A
          BC
          ```
        correct: false
      - text: |-
          ```
          ABC
          ```
        correct: false
      - text: |-
          ```
          AB
          C
          ```
        correct: true
    answer: |-
      ```
      AB
      C
      ```
      `print` n'ajoute pas de retour à la ligne : `A` et `B` sont collés, puis `println` passe à la ligne avant `C`.
    check:
      output: |-
        AB
        C
  - key: code-concatenation
    format: code-output
    question: |-
      ```java
      System.out.println("1" + 2 + 3);
      ```
    choices:
      - text: "`123`"
        correct: true
      - text: "`1 2 3`"
        correct: false
      - text: "`15`"
        correct: false
      - text: "`6`"
        correct: false
    answer: '`123` : une fois la chaîne `"1"` en tête, chaque `+` concatène.'
    check:
      output: "123"
  - key: code-calcul-avant-chaine
    format: code-output
    question: |-
      ```java
      System.out.println(1 + 2 + "3");
      ```
    choices:
      - text: "`123`"
        correct: false
      - text: "`3 3`"
        correct: false
      - text: "`33`"
        correct: true
      - text: "`6`"
        correct: false
    answer: '`33` : `1 + 2` est calculé d''abord (3), puis concaténé avec `"3"`.'
    check:
      output: "33"
  - key: code-classe-main
    format: code-output
    question: |-
      ```java
      public class Bonjour {
          public static void main(String[] args) {
              System.out.println("Bonjour " + args.length);
          }
      }
      ```
      lancé par `java Bonjour Ada Alan`
    choices:
      - text: "`Bonjour Ada Alan`"
        correct: false
      - text: "`Bonjour 2`"
        correct: true
      - text: "`Bonjour 0`"
        correct: false
      - text: "`Bonjour 3`"
        correct: false
    answer: '`Bonjour 2` : `args` contient les deux arguments de la ligne de commande.'
    check:
      code: |-
        public class Bonjour {
            public static void main(String[] args) {
                System.out.println("Bonjour " + args.length);
            }
        }
        Bonjour.main(new String[] {"Ada", "Alan"});
      output: Bonjour 2
  - key: bug-main-majuscule
    format: bug-fix
    question: |-
      Le programme compile, mais `java Bonjour` répond que la classe n'a pas de méthode `main`. Pourquoi ?
      ```java
      public class Bonjour {
          public static void Main(String[] args) {
              System.out.println("Bonjour !");
          }
      }
      ```
    choices:
      - text: "Il manque un `return` à la fin de la méthode"
        correct: false
      - text: "La méthode doit être `private`"
        correct: false
      - text: "`Main` n'est pas `main` : Java distingue les majuscules"
        correct: true
      - text: "Le fichier doit s'appeler `Main.java`"
        correct: false
    answer: |-
      ```java
      public static void main(String[] args) {
      ```
      Java distingue les majuscules : `Main` n'est pas `main`. La JVM cherche exactement `main`.
  - key: bug-point-virgule
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction le fait compiler ?
      ```java
      public class Bonjour {
          public static void main(String[] args) {
              System.out.println("Bonjour !")
          }
      }
      ```
    choices:
      - text: "Ajouter `;` après `System.out.println(\"Bonjour !\")`"
        correct: true
      - text: "Remplacer `println` par `print`"
        correct: false
      - text: "Ajouter `return;` à la fin de `main`"
        correct: false
      - text: "Retirer `public` devant la classe"
        correct: false
    answer: |-
      ```java
      System.out.println("Bonjour !");
      ```
      Il manque le point-virgule qui termine l'instruction ; le compilateur signale `';' expected`.
  - key: bug-guillemets
    format: bug-fix
    question: |-
      Ce code ne compile pas. Pourquoi ?
      ```java
      System.out.println('Bonjour !');
      ```
    choices:
      - text: "`println` n'affiche que des nombres"
        correct: false
      - text: "Le point d'exclamation est interdit dans une chaîne"
        correct: false
      - text: "Une chaîne s'écrit entre guillemets ; les apostrophes sont pour un seul caractère"
        correct: true
      - text: "Il manque `import java.lang.System;`"
        correct: false
    answer: |-
      ```java
      System.out.println("Bonjour !");
      ```
      Les apostrophes délimitent un seul caractère (`char`, comme `'A'`) ; une chaîne s'écrit entre guillemets.
  - key: bug-mauvais-parametre
    format: bug-fix
    question: |-
      Le programme compile, mais `java Bonjour` répond qu'il ne trouve pas de méthode `main`. Pourquoi ?
      ```java
      public class Bonjour {
          public static void main(String args) {
              System.out.println("Bonjour !");
          }
      }
      ```
    choices:
      - text: "Le paramètre doit être un tableau : `String[] args`"
        correct: true
      - text: "`main` doit renvoyer un `int`"
        correct: false
      - text: "Le paramètre doit s'appeler `argv`"
        correct: false
      - text: "La classe doit s'appeler `Main`"
        correct: false
    answer: |-
      ```java
      public static void main(String[] args) {
      ```
      Le paramètre doit être un **tableau** de chaînes (`String[]`), ou absent depuis Java 25. Une méthode
      `main(String)` est une méthode ordinaire : la JVM ne la prend pas pour un point d'entrée.
