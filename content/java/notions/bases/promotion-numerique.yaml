notion: promotion-numerique
lesson: |-
  Dans une opération arithmétique, Java **promeut** d'abord les opérandes vers un type commun :

  1. `byte`, `short` et `char` deviennent toujours des **`int`**, même s'ils sont du même type ;
  2. si un opérande est `long`, `float` ou `double`, l'autre est converti vers le plus « large » d'entre eux
     (`int` < `long` < `float` < `double`).

  ```java
  byte a = 10, b = 20;
  byte c = a + b;          // ne compile pas : a + b est un int
  byte d = (byte) (a + b); // ok, cast explicite

  char lettre = 'A';
  System.out.println(lettre + 1);         // 66 : char promu en int
  System.out.println((char) (lettre + 1)); // B
  System.out.println("" + lettre + 1);     // A1 : concaténation, de gauche à droite
  ```

  - Le résultat d'une opération entre deux `byte` est un `int`, d'où les erreurs « possible lossy conversion ».
  - `int` × `double` donne un `double` : `5 / 2.0` vaut 2.5.
  - Les opérateurs composés (`+=`, `-=`...) contiennent un cast implicite : `b += 1` compile pour un `byte`.

  **Piège classique** : `'a' + 'b'` ne donne pas « ab » mais `195` : deux `char` additionnés sont promus en `int`.

  **En entretien** : « Toute opération sur des `byte`, `short` ou `char` se fait en `int` ; sinon, on monte vers le type
  le plus large des deux. »
cards:
  - key: regle-int
    format: course
    question: De quel type est le résultat de `byte + byte` ?
    answer: '`int` : `byte`, `short` et `char` sont toujours promus en `int` dans une opération.'
  - key: type-le-plus-large
    format: course
    question: De quel type est le résultat de `int * double` ?
    answer: '`double` : l''opérande le plus étroit est converti vers le type le plus large.'
  - key: char-arithmetique
    format: course
    question: Pourquoi `'A' + 1` vaut-il 66 ?
    answer: "Le `char` est promu en `int` (son code, 65), puis on ajoute 1. Pour obtenir `B`, on caste : `(char) ('A' + 1)`."
  - key: operateur-compose
    format: course
    question: Pourquoi `b += 1` compile-t-il pour un `byte` alors que `b = b + 1` ne compile pas ?
    answer: L'opérateur composé contient un cast implicite vers le type de `b` ; `b + 1`, lui, est un `int`.
  - key: vf-byte-plus-byte
    format: true-false
    question: "`byte c = a + b;` compile quand `a` et `b` sont des `byte`."
    truth: false
    answer: '`a + b` est un `int` : il faut un cast, `(byte) (a + b)`.'
  - key: vf-char-plus-char
    format: true-false
    question: "`'a' + 'b'` vaut la chaîne « ab »."
    truth: false
    answer: "Deux `char` sont promus en `int` : on obtient 97 + 98 = 195."
  - key: vf-int-double
    format: true-false
    question: "`5 / 2.0` vaut 2.5."
    truth: true
    answer: '`5` est promu en `double`, et la division devient décimale.'
  - key: vf-short-short
    format: true-false
    question: Le produit de deux `short` est un `short`.
    truth: false
    answer: C'est un `int`.
  - key: qcm-type-resultat
    format: multiple-choice
    question: "De quel type est `x * y` quand `x` est un `long` et `y` un `int` ?"
    choices:
      - text: "`long`"
        correct: true
      - text: "`int`"
        correct: false
      - text: "`double`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: L'`int` est promu en `long`, le plus large des deux.
  - key: qcm-compile
    format: multiple-choice
    question: Avec `short s = 1;`, quelles instructions compilent ?
    choices:
      - text: "`s += 2;`"
        correct: true
      - text: "`s = (short) (s + 2);`"
        correct: true
      - text: "`s = s + 2;`"
        correct: false
      - text: "`short t = s * 2;`"
        correct: false
    answer: '`s + 2` et `s * 2` sont des `int` ; le cast ou l''opérateur composé ramènent au `short`.'
  - key: qcm-char
    format: multiple-choice
    question: "Qu'affiche `System.out.println((char) ('a' + 2));` ?"
    choices:
      - text: "c"
        correct: true
      - text: "99"
        correct: false
      - text: "a2"
        correct: false
      - text: "Une erreur"
        correct: false
    answer: Le code de `a` (97) + 2 donne 99, que le cast reconvertit en `c`.
  - key: qcm-concatenation
    format: multiple-choice
    question: "Qu'affiche `System.out.println(\"\" + 'a' + 'b');` ?"
    choices:
      - text: "ab"
        correct: true
      - text: "195"
        correct: false
      - text: "a+b"
        correct: false
      - text: "Une erreur"
        correct: false
    answer: La chaîne vide en tête transforme chaque `+` en concaténation.
  - key: code-char-system-out-println-1
    format: code-output
    question: '`char c = ''A''; System.out.println(c + 1); System.out.println((char)(c + 1)); System.out.println("" + c + 1);`'
    answer: '`66`, `B`, `A1`.'
    check:
      code: |-
        char c = 'A'; System.out.println(c + 1); System.out.println((char)(c + 1)); System.out.println("" + c + 1);
      output: |-
        66
        B
        A1
  - key: code-system-out-println-b
    format: code-output
    question: '`System.out.println(''a'' + ''b'');`'
    answer: '`195` : deux char additionnés donnent un int. Avec `"" + ''a'' + ''b''` on obtient `ab`.'
    check:
      code: |-
        System.out.println('a' + 'b');
      output: "195"
  - key: code-int-double
    format: code-output
    question: |-
      ```java
      int quantite = 3;
      double prix = 2.5;
      System.out.println(quantite * prix);
      ```
    answer: '`7.5` : `quantite` est promu en `double`.'
    check:
      output: "7.5"
  - key: code-byte-compose
    format: code-output
    question: |-
      ```java
      byte b = 120;
      b += 10;
      System.out.println(b);
      ```
    answer: '`-126` : `+=` cache un cast vers `byte`, et 130 déborde (130 - 256).'
    check:
      output: "-126"
  - key: bug-byte-addition
    format: bug-fix
    question: |-
      Ce code ne compile pas (`possible lossy conversion from int to byte`) :
      ```java
      byte rouge = 100, vert = 50;
      byte total = rouge + vert;
      ```
    answer: |-
      ```java
      int total = rouge + vert;
      ```
      La somme de deux `byte` est un `int` (et 150 ne tiendrait d'ailleurs pas dans un `byte`). On garde un `int`.
  - key: bug-char-concat
    format: bug-fix
    question: |-
      On veut afficher les initiales « AL », mais ce code affiche `141` :
      ```java
      System.out.println(prenom.charAt(0) + nom.charAt(0));
      ```
    answer: |-
      ```java
      System.out.println("" + prenom.charAt(0) + nom.charAt(0));
      ```
      Deux `char` additionnés sont promus en `int` ; une chaîne en tête force la concaténation (ou `String.valueOf`).
  - key: bug-char-suivant
    format: bug-fix
    question: |-
      Ce code ne compile pas (`possible lossy conversion from int to char`) :
      ```java
      char lettre = 'a';
      char suivante = lettre + 1;
      ```
    answer: |-
      ```java
      char suivante = (char) (lettre + 1);
      ```
      `lettre + 1` est un `int` ; un cast le ramène en `char`.
  - key: bug-short-produit
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      short largeur = 30, hauteur = 40;
      short aire = largeur * hauteur;
      ```
    answer: |-
      ```java
      int aire = largeur * hauteur;
      ```
      Le produit de deux `short` est un `int` : on le range dans un `int`, ce qui évite aussi un débordement.
