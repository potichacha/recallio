notion: operateurs-binaires
lesson: |-
  Les opérateurs **bit à bit** travaillent sur la représentation binaire des entiers (`int` et `long` ; `byte`, `short`
  et `char` sont d'abord promus en `int`) :

  | Opérateur | Rôle | Exemple (5 = `0101`, 3 = `0011`) |
  |---|---|---|
  | `&` | ET | `5 & 3` = 1 (`0001`) |
  | `\|` | OU | `5 \| 3` = 7 (`0111`) |
  | `^` | OU exclusif | `5 ^ 3` = 6 (`0110`) |
  | `~` | NON (inverse tous les bits) | `~5` = -6 |
  | `<<` | décalage à gauche | `1 << 3` = 8 |
  | `>>` | décalage à droite **arithmétique** (garde le signe) | `-8 >> 1` = -4 |
  | `>>>` | décalage à droite **logique** (remplit de zéros) | `-1 >>> 28` = 15 |

  Usages : drapeaux (`flags & LECTURE`), masques (`couleur & 0xFF`), parité (`n & 1`), puissances de deux
  (`1 << n`), hachage (`HashMap` mélange les bits avec `^` et `>>>`).

  - `<< n` multiplie par 2ⁿ, `>> n` divise par 2ⁿ en arrondissant vers moins l'infini.
  - Le nombre de décalages est pris **modulo 32** pour un `int` (modulo 64 pour un `long`) : `1 << 32` vaut 1.
  - Sur des `boolean`, `&` et `|` existent aussi, mais **sans court-circuit** : les deux côtés sont évalués.

  **Piège classique** : la priorité. `==` passe avant `&`, donc `n & 1 == 0` se lit `n & (1 == 0)` et ne compile
  pas ; on écrit `(n & 1) == 0`.

  **En entretien** : « `>>` garde le signe, `>>>` remplit de zéros ; `&`, `|`, `^` servent aux masques et aux drapeaux. »
cards:
  - key: vs
    format: course
    question: "Quelle différence entre les décalages `>>` et `>>>` ?"
    choices:
      - {text: "`>>` conserve le signe, `>>>` fait entrer des zéros à gauche", correct: true}
      - {text: "`>>>` conserve le signe, `>>` fait entrer des zéros à gauche", correct: false}
      - {text: "`>>>` décale de trois bits d'un coup, `>>` d'un seul bit", correct: false}
      - {text: "Aucune pour un `int` : `>>>` n'existe que pour les `long`", correct: false}
    answer: Décalage arithmétique (conserve le signe) vs logique (remplit de zéros).
  - key: ou-exclusif
    format: course
    question: Que fait l'opérateur `^` sur deux entiers ?
    choices:
      - {text: "Un OU exclusif bit à bit : 1 là où les deux bits diffèrent", correct: true}
      - {text: "Une puissance : `5 ^ 3` vaut 125", correct: false}
      - {text: "Un OU bit à bit : 1 là où au moins un bit vaut 1", correct: false}
      - {text: "Un ET bit à bit : 1 là où les deux bits valent 1", correct: false}
    answer: "Un OU exclusif bit à bit : chaque bit du résultat vaut 1 si les deux bits diffèrent. `5 ^ 3` vaut 6."
  - key: masque
    format: course
    question: À quoi sert un masque comme `couleur & 0xFF` ?
    choices:
      - {text: "À ne garder que les 8 bits de poids faible, les autres à zéro", correct: true}
      - {text: "À mettre à 1 les 8 bits de poids faible, sans toucher aux autres", correct: false}
      - {text: "À limiter la valeur à 255 en la divisant par `0xFF`", correct: false}
      - {text: "À inverser les 8 bits de poids faible de la couleur", correct: false}
    answer: À ne garder que certains bits (ici les 8 derniers, la composante bleue d'une couleur RGB) en mettant les autres à zéro.
  - key: et-sans-court-circuit
    format: course
    question: Quelle différence entre `&` et `&&` sur des `boolean` ?
    choices:
      - {text: "`&&` n'évalue pas la droite si la gauche est fausse ; `&` évalue toujours les deux", correct: true}
      - {text: "`&` n'évalue pas la droite si la gauche est fausse ; `&&` évalue toujours les deux", correct: false}
      - {text: "Aucune : sur des `boolean`, `&` et `&&` sont deux écritures du même opérateur", correct: false}
      - {text: "`&` ne compile pas sur des `boolean` : il est réservé aux entiers, bit à bit", correct: false}
    answer: '`&&` court-circuite (n''évalue pas la droite si la gauche est fausse) ; `&` évalue toujours les deux côtés.'
  - key: vf-decalage-gauche
    format: true-false
    question: "`1 << 4` vaut 16."
    truth: true
    answer: Décaler de n bits à gauche multiplie par 2ⁿ.
  - key: vf-non
    format: true-false
    question: "`~5` vaut -5."
    truth: false
    answer: "En complément à deux, `~x` vaut `-x - 1` : `~5` vaut -6."
  - key: vf-modulo-32
    format: true-false
    question: "`1 << 32` vaut 0 pour un `int`."
    truth: false
    answer: "Le nombre de décalages est pris modulo 32 : `1 << 32` vaut 1."
  - key: vf-signe
    format: true-false
    question: "`-16 >> 2` vaut -4."
    truth: true
    answer: '`>>` recopie le bit de signe : le résultat reste négatif.'
  - key: qcm-parite
    format: multiple-choice
    question: Quelle expression teste qu'un `int n` est pair ?
    choices:
      - {text: "`(n & 1) == 0`", correct: true}
      - {text: "`n & 1 == 0`", correct: false}
      - {text: "`(n | 1) == 0`", correct: false}
      - {text: "`(n & 1) == 1`", correct: false}
    answer: "Le dernier bit d'un nombre pair est 0. Sans parenthèses, `==` serait évalué avant `&`, et `n & 1 == 0` ne compile pas ; `n % 2 == 0` marcherait aussi."
  - key: qcm-ou
    format: multiple-choice
    question: Que vaut `5 | 3` ?
    choices:
      - text: "7"
        correct: true
      - text: "8"
        correct: false
      - text: "1"
        correct: false
      - text: "6"
        correct: false
    answer: '`0101 | 0011` = `0111`, soit 7. `5 & 3` vaudrait 1 et `5 ^ 3` 6.'
  - key: qcm-logique
    format: multiple-choice
    question: Que vaut `-1 >>> 28` ?
    choices:
      - text: "15"
        correct: true
      - text: "-1"
        correct: false
      - text: "0"
        correct: false
      - text: "-15"
        correct: false
    answer: '`-1` a ses 32 bits à 1 ; `>>>` les décale en faisant entrer des zéros, il en reste quatre : 15.'
  - key: qcm-drapeau
    format: multiple-choice
    question: Avec `int LECTURE = 1, ECRITURE = 2;`, comment ajouter le droit d'écriture à `droits` ?
    choices:
      - text: "`droits |= ECRITURE`"
        correct: true
      - text: "`droits &= ECRITURE`"
        correct: false
      - text: "`droits ^= ~ECRITURE`"
        correct: false
      - text: "`droits = ECRITURE`"
        correct: false
    answer: Le OU allume le bit sans toucher aux autres ; `droits &= ~ECRITURE` l'éteindrait.
  - key: code-et-ou-xor
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println((6 & 3) + " " + (6 | 3) + " " + (6 ^ 3));
      ```
    choices:
      - {text: "`2 7 5`", correct: true}
      - {text: "`2 7 216`", correct: false}
      - {text: "`7 2 5`", correct: false}
      - {text: "`2 5 7`", correct: false}
    answer: '`2 7 5` : `110 & 011` = `010`, `110 | 011` = `111`, `110 ^ 011` = `101`.'
    check:
      output: "2 7 5"
  - key: code-decalages
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println((-8 >> 1) + " " + (3 << 2) + " " + (1 << 33));
      ```
    choices:
      - {text: "`-4 12 2`", correct: true}
      - {text: "`-4 12 0`", correct: false}
      - {text: "`2147483644 12 2`", correct: false}
      - {text: "`-4 6 8589934592`", correct: false}
    answer: '`-4 12 2` : `>>` garde le signe, `<< 2` multiplie par 4, et 33 décalages valent 33 modulo 32 = 1.'
    check:
      output: "-4 12 2"
  - key: code-non
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(~0 + " " + ~7);
      ```
    choices:
      - {text: "`-1 -8`", correct: true}
      - {text: "`1 0`", correct: false}
      - {text: "`0 -7`", correct: false}
      - {text: "`1 -7`", correct: false}
    answer: '`-1 -8` : `~x` vaut `-x - 1`.'
    check:
      output: "-1 -8"
  - key: code-sans-court-circuit
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int i = 0;
      boolean b = false & (++i > 0);
      System.out.println(b + " " + i);
      ```
    choices:
      - {text: "`false 1`", correct: true}
      - {text: "`false 0`", correct: false}
      - {text: "`true 1`", correct: false}
      - {text: "`0 1`", correct: false}
    answer: '`false 1` : `&` évalue la droite même quand la gauche est fausse ; avec `&&`, `i` vaudrait 0.'
    check:
      output: "false 1"
  - key: bug-priorite-parite
    format: bug-fix
    question: |-
      Ce code ne compile pas (`bad operand types for binary operator '&'`). Quelle correction est la bonne ?
      ```java
      if (n & 1 == 0) {
          System.out.println("pair");
      }
      ```
    choices:
      - {text: "Parenthéser le masque : `(n & 1) == 0`", correct: true}
      - {text: "Remplacer `&` par `&&` : `n && 1 == 0`", correct: false}
      - {text: "Comparer avec `equals` : `(n & 1).equals(0)`", correct: false}
      - {text: "Parenthéser la comparaison : `n & (1 == 0)`", correct: false}
    answer: |-
      ```java
      if ((n & 1) == 0) {
          System.out.println("pair");
      }
      ```
      `==` est prioritaire sur `&` : sans parenthèses, Java calcule `n & (1 == 0)`, un `int` avec un `boolean`.
  - key: bug-retirer-drapeau
    format: bug-fix
    question: |-
      On veut retirer le droit d'écriture, mais ce code l'ajoute quand il manquait. Quelle correction est la bonne ?
      ```java
      droits ^= ECRITURE;
      ```
    choices:
      - {text: "`droits &= ~ECRITURE;`", correct: true}
      - {text: "`droits |= ECRITURE;`", correct: false}
      - {text: "`droits &= ECRITURE;`", correct: false}
      - {text: "`droits -= ECRITURE;`", correct: false}
    answer: |-
      ```java
      droits &= ~ECRITURE;
      ```
      `^` inverse le bit (il l'allume s'il était éteint) ; `& ~ECRITURE` l'éteint dans tous les cas. `-=` ferait un
      calcul faux si le droit manquait déjà.
  - key: bug-octet-non-signe
    format: bug-fix
    question: |-
      La lecture d'un octet `0xFF` d'un fichier donne -1 au lieu de 255. Quelle correction est la bonne ?
      ```java
      byte b = donnees[i];
      int valeur = b;
      ```
    choices:
      - {text: "`int valeur = b & 0xFF;`", correct: true}
      - {text: "`int valeur = (int) b;`", correct: false}
      - {text: "`int valeur = b >>> 8;`", correct: false}
      - {text: "`int valeur = Math.abs(b);`", correct: false}
    answer: |-
      ```java
      int valeur = b & 0xFF;
      ```
      Un `byte` est signé : sa promotion en `int` recopie le signe. Le masque `0xFF` ne garde que les 8 bits de
      l'octet (ou `Byte.toUnsignedInt(b)`).
  - key: bug-decalage-signe
    format: bug-fix
    question: |-
      Ce calcul d'un indice de case à partir d'un hachage donne parfois un indice négatif. Quelle correction est la
      bonne ?
      ```java
      int indice = (hash >> 28);
      ```
    choices:
      - {text: "`int indice = (hash >>> 28);`", correct: true}
      - {text: "`int indice = (hash << 28);`", correct: false}
      - {text: "`int indice = (hash >> 28) & 1;`", correct: false}
      - {text: "`int indice = (int) (hash >> 28L);`", correct: false}
    answer: |-
      ```java
      int indice = (hash >>> 28);
      ```
      Pour un hachage négatif, `>>` recopie le bit de signe ; `>>>` fait entrer des zéros et donne toujours un
      résultat entre 0 et 15.
