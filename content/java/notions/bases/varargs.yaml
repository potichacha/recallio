notion: varargs
lesson: |-
  Les **varargs** (*arguments variables*) permettent d'appeler une méthode avec **autant d'arguments qu'on veut** :

  ```java
  static int somme(int... nombres) {    // nombres est un int[]
      int total = 0;
      for (int n : nombres) {
          total += n;
      }
      return total;
  }

  somme();            // 0 : un tableau vide
  somme(1, 2, 3);     // 6
  somme(new int[] {4, 5});   // on peut aussi passer un tableau
  ```

  - Dans la méthode, le paramètre est un **tableau**.
  - Un seul varargs par méthode, et c'est **le dernier** paramètre : `format(String motif, Object... valeurs)`.
  - Appelé sans argument, le varargs est un tableau **vide**, pas `null`.
  - Le varargs passe **en dernier** dans le choix entre surcharges.
  - On en voit partout dans la bibliothèque : `String.format`, `List.of`, `Arrays.asList`.

  **Piège classique** : passer `null` seul à un `Object...`. On ne sait plus si c'est un tableau `null` ou un tableau
  contenant `null` ; le compilateur avertit, et la méthode reçoit un tableau `null`.

  **En entretien** : « Un varargs est un tableau caché, forcément en dernier paramètre ; appelé sans argument, il est
  vide. »
cards:
  - key: sont-varargs
    format: course
    question: Que sont les varargs ?
    answer: Des arguments variables (`int... x`), vus comme un tableau ; un seul par méthode, en dernier paramètre.
  - key: type-dans-la-methode
    format: course
    question: Quel est le type du paramètre `String... noms` à l'intérieur de la méthode ?
    answer: '`String[]` : un tableau, qu''on parcourt comme n''importe quel tableau.'
  - key: sans-argument
    format: course
    question: Que reçoit `somme(int... n)` quand on l'appelle sans argument ?
    answer: Un tableau **vide** (`n.length == 0`), jamais `null`.
  - key: position
    format: course
    question: Où peut-on placer un varargs dans la liste des paramètres ?
    answer: "En **dernier** seulement, et un seul par méthode : `log(String niveau, Object... valeurs)`."
  - key: vf-dernier
    format: true-false
    question: "`static void f(int... a, String b)` compile."
    truth: false
    answer: Le varargs doit être le dernier paramètre.
  - key: vf-vide
    format: true-false
    question: "Appelé sans argument, `afficher(String... lignes)` reçoit `null`."
    truth: false
    answer: Il reçoit un tableau vide.
  - key: vf-tableau
    format: true-false
    question: On peut passer un tableau existant à un paramètre varargs.
    truth: true
    answer: '`somme(new int[] {1, 2})` est accepté : le varargs est un tableau.'
  - key: vf-deux-varargs
    format: true-false
    question: Une méthode peut avoir deux paramètres varargs.
    truth: false
    answer: Un seul, et en dernier.
  - key: qcm-signature
    format: multiple-choice
    question: Quelle signature est valide ?
    choices:
      - text: "`static String joindre(String sep, String... mots)`"
        correct: true
      - text: "`static String joindre(String... mots, String sep)`"
        correct: false
      - text: "`static String joindre(String... mots, String... seps)`"
        correct: false
      - text: "`static String joindre(... String mots)`"
        correct: false
    answer: Le varargs vient en dernier, une seule fois.
  - key: qcm-longueur
    format: multiple-choice
    question: "Avec `static int nb(Object... o) { return o.length; }`, que vaut `nb(1, \"a\", 2.0)` ?"
    choices:
      - text: "3"
        correct: true
      - text: "1"
        correct: false
      - text: "0"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Trois arguments, donc un tableau de trois éléments.
  - key: qcm-priorite
    format: multiple-choice
    question: "Avec `m(int a, int b)` et `m(int... a)`, quelle méthode appelle `m(1, 2)` ?"
    choices:
      - text: "`m(int, int)`"
        correct: true
      - text: "`m(int...)`"
        correct: false
      - text: "L'appel est ambigu"
        correct: false
    answer: Le varargs n'est choisi qu'en dernier recours.
  - key: qcm-exemples
    format: multiple-choice
    question: Lesquelles de ces méthodes de la bibliothèque standard utilisent un varargs ?
    choices:
      - text: "`String.format`"
        correct: true
      - text: "`List.of`"
        correct: true
      - text: "`String.length`"
        correct: false
      - text: "`Math.abs`"
        correct: false
    answer: '`String.format(String, Object...)`, et `List.of(E...)` au-delà de dix éléments.'
  - key: code-somme
    format: code-output
    question: |-
      ```java
      static int somme(int... n) {
          int t = 0;
          for (int x : n) t += x;
          return t;
      }
      System.out.println(somme() + " " + somme(1, 2, 3));
      ```
    answer: '`0 6` : sans argument, le tableau est vide et la somme vaut 0.'
    check:
      output: "0 6"
  - key: code-longueur
    format: code-output
    question: |-
      ```java
      static int compter(String... mots) {
          return mots.length;
      }
      System.out.println(compter("a", "b") + compter());
      ```
    answer: '`2` : 2 + 0.'
    check:
      output: "2"
  - key: code-tableau
    format: code-output
    question: |-
      ```java
      static int premier(int... n) {
          return n[0];
      }
      System.out.println(premier(new int[] {7, 8}));
      ```
    answer: '`7` : le tableau passé devient directement le varargs.'
    check:
      output: "7"
  - key: code-priorite
    format: code-output
    question: |-
      ```java
      static void m(int a, int b) { System.out.println("deux"); }
      static void m(int... a) { System.out.println("varargs"); }
      m(1, 2);
      m(1, 2, 3);
      ```
    answer: |-
      ```
      deux
      varargs
      ```
      La version exacte l'emporte quand elle convient ; sinon, seul le varargs accepte trois arguments.
    check:
      output: |-
        deux
        varargs
  - key: bug-position
    format: bug-fix
    question: |-
      Ce code ne compile pas (`varargs parameter must be the last parameter`) :
      ```java
      static void journaliser(Object... valeurs, String niveau) { }
      ```
    answer: |-
      ```java
      static void journaliser(String niveau, Object... valeurs) { }
      ```
      Le varargs doit être en dernier.
  - key: bug-premier-sans-verification
    format: bug-fix
    question: |-
      `max()`, appelé sans argument, lève une `ArrayIndexOutOfBoundsException` :
      ```java
      static int max(int... n) {
          int m = n[0];
          for (int x : n) m = Math.max(m, x);
          return m;
      }
      ```
    answer: |-
      ```java
      static int max(int premier, int... autres) {
          int m = premier;
          for (int x : autres) m = Math.max(m, x);
          return m;
      }
      ```
      Exiger un premier paramètre normal garantit au moins une valeur, vérifiée à la compilation.
  - key: bug-test-null
    format: bug-fix
    question: |-
      Ce test ne sert à rien, car appelée sans argument la méthode ne reçoit jamais `null` :
      ```java
      static void afficher(String... lignes) {
          if (lignes == null) {
              System.out.println("(rien)");
              return;
          }
          for (String l : lignes) System.out.println(l);
      }
      ```
    answer: |-
      ```java
      if (lignes.length == 0) {
          System.out.println("(rien)");
          return;
      }
      ```
      Sans argument, le varargs est un tableau **vide** ; c'est sa longueur qu'il faut tester.
  - key: bug-deux-varargs
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      static void comparer(int... a, int... b) { }
      ```
    answer: |-
      ```java
      static void comparer(int[] a, int[] b) { }
      ```
      Un seul varargs par méthode ; pour deux séries de valeurs, on prend deux tableaux (ou deux listes).
