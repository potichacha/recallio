notion: operateur-ternaire
lesson: |-
  L'opérateur ternaire choisit entre deux **valeurs** selon une condition :

  ```java
  String libelle = quantite > 1 ? "articles" : "article";
  // condition ? valeur si vraie : valeur si fausse
  ```

  - C'est une **expression** : il produit une valeur, qu'on range, qu'on renvoie ou qu'on affiche. Ce n'est pas une
    instruction : `x > 0 ? afficher("+") : afficher("-");` ne compile pas. Pour exécuter une action ou une autre, on
    écrit un `if`.
  - Les **deux branches** sont obligatoires, et leurs types doivent être compatibles avec la destination.
  - Entre deux nombres de types différents, la promotion numérique s'applique : `true ? 1 : 2.0` vaut `1.0`.
  - On peut l'imbriquer, mais au-delà d'un niveau, un `if` ou un `switch` se lit mieux.

  Il brille pour une valeur simple : un libellé au pluriel, un `max`, une valeur par défaut
  (`nom != null ? nom : "Anonyme"`).

  **Piège classique** : mélanger `Integer` et `int` dans les deux branches. Si la branche `Integer` vaut `null`, Java
  déballe la valeur pour obtenir un `int` et lève une `NullPointerException`.

  **En entretien** : « Le ternaire est une expression, à réserver aux choix de valeur simples ; dès qu'il faut agir ou
  imbriquer, un `if` est plus clair. »
tour:
  - title: L'opérateur ternaire
    text: |-
      `condition ? siVrai : siFaux` est une **expression** : elle choisit une valeur selon une condition. On l'emploie
      pour une affectation simple, comme `String parite = n % 2 == 0 ? "pair" : "impair";`, plutôt qu'un `if` de quatre
      lignes.

      Imbriquer des ternaires devient vite illisible : au-delà d'un choix simple, un `if` ou un `switch` vaut mieux.
    example:
      files:
        Main.java: |-
          void main() {
              for (int n = 1; n <= 3; n++) {
                  String parite = n % 2 == 0 ? "pair" : "impair";
                  IO.println(n + " est " + parite);
              }
              int stock = 0;
              IO.println(stock > 0 ? "disponible" : "épuisé");
          }
      output: |-
        1 est impair
        2 est pair
        3 est impair
        épuisé
cards:
  - key: syntaxe
    format: course
    question: Comment s'écrit l'opérateur ternaire ?
    answer: '`condition ? valeurSiVraie : valeurSiFausse`, par exemple `int max = a > b ? a : b;`.'
  - key: expression-pas-instruction
    format: course
    question: "Pourquoi `x > 0 ? afficher(\"+\") : afficher(\"-\");` ne compile-t-il pas ?"
    answer: |-
      Le ternaire est une **expression** : il doit produire une valeur qu'on utilise. Pour exécuter l'une ou l'autre
      action, on écrit un `if`.
  - key: quand-lutiliser
    format: course
    question: Quand préférer le ternaire à un `if` ?
    answer: |-
      Pour choisir une **valeur** simple (un libellé, un maximum, une valeur par défaut). Dès qu'il faut exécuter des
      actions, ou que les conditions s'imbriquent, un `if` est plus lisible.
  - key: promotion
    format: course
    question: "Que vaut `true ? 1 : 2.0`, et pourquoi ?"
    answer: '`1.0` : quand les deux branches sont des nombres de types différents, le résultat prend le type le plus large (`double`).'
  - key: vf-deux-branches
    format: true-false
    question: La branche `:` du ternaire est facultative.
    truth: false
    answer: "Le ternaire doit toujours produire une valeur : les deux branches sont obligatoires."
  - key: vf-expression
    format: true-false
    question: Le résultat d'un ternaire peut être passé directement à `System.out.println`.
    truth: true
    answer: "C'est une expression : `System.out.println(n % 2 == 0 ? \"pair\" : \"impair\");`."
  - key: vf-instruction-seule
    format: true-false
    question: "`a > b ? a++ : b++;` seul sur sa ligne compile."
    truth: false
    answer: "Un ternaire n'est pas une instruction : sa valeur doit être utilisée. On écrit un `if`."
  - key: vf-imbrication
    format: true-false
    question: On peut imbriquer un ternaire dans un autre.
    truth: true
    answer: "C'est permis, mais vite illisible : au-delà d'un niveau, on préfère un `if` ou un `switch`."
  - key: qcm-max
    format: multiple-choice
    question: Quelle expression vaut le plus grand de `a` et `b` ?
    choices:
      - text: "`a > b ? a : b`"
        correct: true
      - text: "`Math.max(a, b)`"
        correct: true
      - text: "`a > b ? b : a`"
        correct: false
      - text: "`a ? b : a > b`"
        correct: false
    answer: '`Math.max` fait la même chose, de façon plus lisible encore.'
  - key: qcm-valeur-defaut
    format: multiple-choice
    question: Quelle expression renvoie `"Anonyme"` quand `nom` vaut `null`, et `nom` sinon ?
    choices:
      - text: "`nom != null ? nom : \"Anonyme\"`"
        correct: true
      - text: "`nom == null ? nom : \"Anonyme\"`"
        correct: false
      - text: "`nom ? \"Anonyme\" : nom`"
        correct: false
      - text: "`nom != null : nom ? \"Anonyme\"`"
        correct: false
    answer: La condition d'abord, puis la valeur si elle est vraie, puis celle si elle est fausse.
  - key: qcm-pluriel
    format: multiple-choice
    question: "Que vaut `n > 1 ? \"articles\" : \"article\"` quand `n` vaut 1 ?"
    choices:
      - text: "`\"article\"`"
        correct: true
      - text: "`\"articles\"`"
        correct: false
      - text: "`null`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: '`1 > 1` est faux : on prend la seconde valeur.'
  - key: qcm-type-resultat
    format: multiple-choice
    question: "Quel est le type de `estVip ? 10 : 5.5` ?"
    choices:
      - text: "`double`"
        correct: true
      - text: "`int`"
        correct: false
      - text: "`Object`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: "Les deux branches sont promues au type le plus large : `10` devient `10.0`."
  - key: trous-pair-impair
    format: fill-in
    question: |-
      Complétez pour afficher « pair » ou « impair » :
      ```java
      String parite = n % 2 == 0 ___ "pair" ___ "impair";
      ```
    blanks: [["?"], [":"]]
    answer: '`?` sépare la condition de la première valeur, `:` les deux valeurs.'
  - key: trous-max
    format: fill-in
    question: |-
      Complétez pour obtenir le plus grand des deux :
      ```java
      int max = a > b ? ___ : ___;
      ```
    blanks: [[a], [b]]
    answer: Si `a > b`, on garde `a`, sinon `b`.
  - key: trous-defaut
    format: fill-in
    question: |-
      Complétez pour afficher « Anonyme » quand `nom` vaut `null` :
      ```java
      String affiche = nom ___ null ? nom : "Anonyme";
      ```
    blanks: [["!="]]
    answer: Si `nom` n'est pas `null`, on le garde ; sinon, la valeur par défaut.
  - key: trous-livraison
    format: fill-in
    question: |-
      Complétez : la livraison coûte 0 € au-delà de 50 € d'achats, et 4,90 € sinon.
      ```java
      double frais = total > 50 ? ___ : 4.90;
      ```
    blanks: [["0", "0.0", "0d", "0.0d"]]
    answer: La première valeur s'applique quand la condition est vraie.
  - key: code-parite
    format: code-output
    question: |-
      ```java
      int a = 7;
      System.out.println(a % 2 == 0 ? "pair" : "impair");
      ```
    answer: '`impair` : 7 % 2 vaut 1, la condition est fausse.'
    check:
      output: "impair"
  - key: code-imbrique
    format: code-output
    question: |-
      ```java
      int x = 3;
      int y = x > 5 ? 1 : x > 2 ? 2 : 3;
      System.out.println(y);
      ```
    answer: '`2` : `x > 5` est faux, on évalue `x > 2 ? 2 : 3`, et `x > 2` est vrai.'
    check:
      output: "2"
  - key: code-promotion
    format: code-output
    question: |-
      ```java
      System.out.println(true ? 1 : 2.0);
      ```
    answer: '`1.0` : les deux branches sont promues en `double`, même si c''est l''entier qui est choisi.'
    check:
      output: "1.0"
  - key: code-null
    format: code-output
    question: |-
      ```java
      String s = null;
      System.out.println(s == null ? "vide" : s.length());
      ```
    answer: '`vide` : la seconde branche, qui aurait levé une exception, n''est pas évaluée.'
    check:
      output: "vide"
  - key: bug-instruction
    format: bug-fix
    question: |-
      Ce code ne compile pas (`not a statement`) :
      ```java
      solde >= 0 ? System.out.println("Créditeur") : System.out.println("Débiteur");
      ```
    answer: |-
      ```java
      System.out.println(solde >= 0 ? "Créditeur" : "Débiteur");
      ```
      Le ternaire choisit une valeur, pas une action : on choisit le texte, puis on l'affiche une seule fois.
  - key: bug-branche-manquante
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      int max = a > b ? a;
      ```
    answer: |-
      ```java
      int max = a > b ? a : b;
      ```
      Le ternaire a toujours deux branches.
  - key: bug-types-incompatibles
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: bad type in conditional expression`) :
      ```java
      String libelle = n > 1 ? "articles" : 1;
      ```
    answer: |-
      ```java
      String libelle = n > 1 ? "articles" : "article";
      ```
      Les deux branches doivent convenir au type de la destination, ici une `String`.
  - key: bug-illisible
    format: bug-fix
    question: |-
      Ce code fonctionne, mais la relecture le refuse. Rendez-le lisible :
      ```java
      String mention = note >= 16 ? "Très bien" : note >= 14 ? "Bien" : note >= 12 ? "Assez bien" : note >= 10 ? "Passable" : "Ajourné";
      ```
    answer: |-
      ```java
      String mention;
      if (note >= 16) {
          mention = "Très bien";
      } else if (note >= 14) {
          mention = "Bien";
      } else if (note >= 12) {
          mention = "Assez bien";
      } else if (note >= 10) {
          mention = "Passable";
      } else {
          mention = "Ajourné";
      }
      ```
      Au-delà d'un niveau d'imbrication, une chaîne de `if` se lit bien mieux.
