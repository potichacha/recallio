notion: histoire-versions-java
lesson: |-
  Quelques repères :

  - **1995** : Sun Microsystems publie Java ; **2010** : Oracle rachète Sun.
  - **2006-2007** : Java devient open source, avec **OpenJDK**.
  - **Java 8** (2014) : lambdas et streams, la plus grosse évolution du langage.
  - Depuis **Java 9** (2017), une version sort **tous les six mois**, en mars et en septembre.
  - Certaines versions sont **LTS** (*Long-Term Support*), maintenues des années : 8, 11, 17, 21, 25. Depuis Java 17,
    une LTS sort tous les deux ans. Les versions intermédiaires ne sont maintenues que six mois, jusqu'à la suivante.
  - Les nouveautés passent par des **JEP** (*JDK Enhancement Proposals*), souvent d'abord en **preview** (à activer
    avec `--enable-preview`), puis définitives.

  En entreprise, on vise une **LTS** pour la production ; les versions intermédiaires servent à essayer les nouveautés.
  Les jalons récents : `var` (10), les `record` (16), les classes scellées (17), les threads virtuels (21), les
  méthodes `main` d'instance et les fichiers source compacts (25).

  **Piège classique** : croire que Java 9 ou 10 sont encore maintenues. Une version non LTS cesse de recevoir des
  correctifs dès la sortie de la suivante.

  **En entretien** : « Une version tous les six mois, une LTS tous les deux ans (21, puis 25) ; on met en production sur
  une LTS. »
tour:
  - title: Les versions de Java
    text: |-
      Java sort une version **tous les six mois**, en mars et en septembre, depuis Java 10 en 2018. Tous les deux ans,
      l'une d'elles est une **LTS** (*long-term support*), maintenue pendant des années : Java 17, 21, puis 25, sortie
      en septembre 2025.

      Les entreprises s'en tiennent souvent aux LTS. Chaque version apporte ses nouveautés : `var` (10), les records
      (16), le pattern matching dans `switch` et les threads virtuels (21), les fichiers source compacts (25)…
    example:
      files:
        Main.java: |-
          void main() {
              int version = Runtime.version().feature();
              int[] lts = {8, 11, 17, 21, 25};
              IO.println("version : " + version);
              IO.println("LTS : " + Arrays.toString(lts));
              IO.println("LTS ? " + Arrays.stream(lts).anyMatch(v -> v == version));
          }
      output: |-
        version : 25
        LTS : [8, 11, 17, 21, 25]
        LTS ? true
cards:
  - key: sont-versions-lts-java
    format: course
    question: Quelles sont les versions LTS de Java ?
    choices:
      - text: "8, 11, 17, 21 et 25"
        correct: true
      - text: "9, 12, 15, 18 et 21"
        correct: false
      - text: "Seulement la dernière version parue"
        correct: false
      - text: "Toutes les versions paires"
        correct: false
    answer: 8, 11, 17, 21, 25 ; depuis Java 17, une LTS sort tous les deux ans.
  - key: cadence-publication
    format: course
    question: "À quel rythme sort une nouvelle version de Java ?"
    choices:
      - text: "Sans calendrier, quand Oracle le décide"
        correct: false
      - text: "Tous les ans, en janvier"
        correct: false
      - text: "Tous les 3 ans"
        correct: false
      - text: "Tous les 6 mois, en mars et en septembre"
        correct: true
    answer: Une version tous les 6 mois (mars et septembre).
  - key: combien-temps-version-non-lts-supportee
    format: course
    question: "Combien de temps une version qui n'est pas LTS reçoit-elle des mises à jour ?"
    choices:
      - text: "8 ans, comme une LTS"
        correct: false
      - text: "2 ans"
        correct: false
      - text: "Elle n'en reçoit aucune"
        correct: false
      - text: "6 mois, jusqu'à la version suivante"
        correct: true
    answer: 6 mois, jusqu'à la version suivante.
  - key: java-8
    format: course
    question: Pourquoi Java 8 a-t-il tant marqué le langage ?
    choices:
      - text: "Il a introduit les threads virtuels"
        correct: false
      - text: "Il a apporté les lambdas et les streams"
        correct: true
      - text: "Il a été le premier Java open source"
        correct: false
      - text: "Il a apporté les génériques"
        correct: false
    answer: Il a apporté les **lambdas** et les **streams**, qui ont changé la façon d'écrire du Java (style fonctionnel).
  - key: vf-six-mois
    format: true-false
    question: Depuis Java 9, une nouvelle version de Java sort tous les six mois.
    truth: true
    answer: En mars et en septembre.
  - key: vf-toutes-lts
    format: true-false
    question: Toutes les versions de Java sont LTS.
    truth: false
    answer: Seules certaines le sont (8, 11, 17, 21, 25) ; les autres ne sont maintenues que six mois.
  - key: vf-oracle-createur
    format: true-false
    question: Java a été créé par Oracle.
    truth: false
    answer: Il a été créé chez Sun Microsystems (1995), qu'Oracle a racheté en 2010.
  - key: vf-preview
    format: true-false
    question: Une fonctionnalité en preview s'utilise sans aucune option de compilation.
    truth: false
    answer: Il faut l'activer avec `--enable-preview` ; elle peut encore changer avant d'être définitive.
  - key: qcm-lts
    format: multiple-choice
    question: Lesquelles de ces versions sont LTS ?
    choices:
      - text: "Java 17"
        correct: true
      - text: "Java 21"
        correct: true
      - text: "Java 19"
        correct: false
      - text: "Java 23"
        correct: false
    answer: Après 17, les LTS sont 21 et 25 ; les versions entre deux ne sont pas LTS.
  - key: qcm-lambdas
    format: multiple-choice
    question: Quelle version a introduit les lambdas et les streams ?
    choices:
      - text: "Java 8"
        correct: true
      - text: "Java 5"
        correct: false
      - text: "Java 11"
        correct: false
      - text: "Java 17"
        correct: false
    answer: Java 8, en 2014.
  - key: qcm-production
    format: multiple-choice
    question: Pour une application en production, quelle version choisir ?
    choices:
      - text: "Une version LTS récente"
        correct: true
      - text: "La toute dernière version, même non LTS"
        correct: false
      - text: "Java 8, la plus connue"
        correct: false
      - text: "Une version en preview"
        correct: false
    answer: Une LTS reçoit des correctifs de sécurité pendant des années.
  - key: qcm-jalons
    format: multiple-choice
    question: Quelle fonctionnalité est arrivée en Java 21, une LTS ?
    choices:
      - text: "Les threads virtuels"
        correct: true
      - text: "Les lambdas"
        correct: false
      - text: "Le mot-clé `var`"
        correct: false
      - text: "Les génériques"
        correct: false
    answer: Les threads virtuels (JEP 444) ; les lambdas datent de Java 8, `var` de Java 10, les génériques de Java 5.
  - key: definition-jep
    format: definition
    question: "Que désigne le sigle JEP ?"
    choices:
      - text: "*JVM Error Protocol* : le format des erreurs de la JVM"
        correct: false
      - text: "*Java Extended Package* : un package de la bibliothèque standard"
        correct: false
      - text: "*Java Execution Platform* : la plateforme qui exécute Java"
        correct: false
      - text: "*JDK Enhancement Proposal* : une proposition d'évolution du JDK"
        correct: true
    answer: "*JDK Enhancement Proposal* : la proposition d'évolution du JDK, comme la JEP 444 des threads virtuels."
  - key: definition-lts
    format: definition
    question: "Que désigne le sigle LTS ?"
    choices:
      - text: "*Long-Term Support* : une version maintenue plusieurs années"
        correct: true
      - text: "*Language Type System* : le système de types de Java"
        correct: false
      - text: "*Latest Technical Specification* : la dernière version parue"
        correct: false
      - text: "*Lightweight Test Suite* : une suite de tests légère"
        correct: false
    answer: "*Long-Term Support* : une version maintenue plusieurs années, comme Java 21 ou 25."
  - key: definition-preview
    format: definition
    question: "Qu'est-ce qu'une fonctionnalité en preview ?"
    choices:
      - text: "Une fonctionnalité qui sera retirée à la version suivante"
        correct: false
      - text: "Une fonctionnalité complète mais pas encore définitive, à activer avec `--enable-preview`"
        correct: true
      - text: "Une fonctionnalité réservée aux versions payantes"
        correct: false
      - text: "Une fonctionnalité active par défaut, mais pas encore documentée"
        correct: false
    answer: Une fonctionnalité complète mais pas encore définitive, à activer avec `--enable-preview`, qui peut encore changer.
  - key: definition-openjdk
    format: definition
    question: "Que désigne OpenJDK dans l'histoire de Java ?"
    choices:
      - text: "L'implémentation open source de référence, d'où viennent Temurin ou Oracle JDK"
        correct: true
      - text: "Un IDE open source pour Java"
        correct: false
      - text: "Le nom de Java avant son rachat par Oracle"
        correct: false
      - text: "Une version gratuite mais plus ancienne de Java"
        correct: false
    answer: L'implémentation open source de référence de Java, dont sont issues les distributions comme Temurin ou Oracle JDK.
