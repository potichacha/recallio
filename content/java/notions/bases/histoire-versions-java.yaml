notion: histoire-versions-java
cards:
  - key: sont-versions-lts-java
    format: course
    question: Quelles sont les versions LTS de Java ?
    answer: 8, 11, 17, 21, 25 ; la prochaine est 29 (septembre 2027).
  - key: cadence-publication
    format: course
    question: Quelle est la cadence de publication ?
    answer: Une version tous les six mois (mars et septembre) depuis Java 10, une LTS tous les deux ans depuis Java 17.
  - key: combien-temps-version-non-lts-supportee
    format: course
    question: Combien de temps une version non-LTS est-elle supportée ?
    answer: Six mois, jusqu'à la version suivante.
  - key: definition-jep
    format: definition
    question: JEP
    answer: 'JDK Enhancement Proposal : proposition d''évolution du JDK'
  - key: definition-lts
    format: definition
    question: LTS
    answer: 'Long-Term Support : versions 8, 11, 17, 21, 25 (puis 29)'
