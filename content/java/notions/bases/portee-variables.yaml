notion: portee-variables
lesson: |-
  La **portée** d'une variable, c'est la partie du code où on peut l'utiliser : de sa déclaration jusqu'à la fin du
  **bloc** `{ }` qui la contient.

  ```java
  int total = 0;
  for (int i = 0; i < 3; i++) {     // i n'existe que dans la boucle
      int carre = i * i;            // carre n'existe que dans ce bloc
      total += carre;
  }
  System.out.println(total);        // ok
  System.out.println(i);            // ne compile pas : i est hors de portée
  ```

  - Une variable déclarée dans un `if`, une boucle ou un bloc **disparaît à la fin de ce bloc**. Pour l'utiliser
    après, on la déclare avant.
  - Deux variables locales visibles au même endroit ne peuvent pas porter le même nom : on ne redéclare pas `i` dans
    une boucle qui l'utilise déjà. Deux boucles **successives**, en revanche, peuvent chacune avoir leur `i`.
  - Un paramètre ou une variable locale peut porter le nom d'un **champ** : il le masque, et on atteint le champ avec
    `this.nom`.
  - La **durée de vie** d'une variable locale s'arrête à la fin de son bloc ; l'objet qu'elle désignait survit tant
    qu'une autre référence le désigne.

  **Piège classique** : `nom = nom;` dans un constructeur. Le paramètre masque le champ, et la ligne recopie le paramètre
  sur lui-même : le champ reste `null`. Il faut `this.nom = nom;`.

  **En entretien** : « Une variable locale vit dans son bloc ; on réduit la portée au plus juste, et `this` lève
  l'ambiguïté entre un champ et un paramètre du même nom. »
tour:
  - title: La portée
    text: |-
      Une variable locale existe de sa déclaration jusqu'à la fin du **bloc** (`{ … }`) qui la contient. Une variable
      déclarée dans une boucle ou un `if` disparaît à la fin de ce bloc : on ne peut pas la lire après.

      Java interdit de déclarer une variable locale du même nom qu'une autre encore visible : pas de masquage entre
      variables locales. Un champ, en revanche, peut être masqué par un paramètre ; `this.nom` désigne alors le champ.

      Essaie : affiche `carre` après la boucle.
    example:
      files:
        Main.java: |-
          void main() {
              int total = 0;
              for (int i = 1; i <= 3; i++) {
                  int carre = i * i;
                  total += carre;
              }
              IO.println(total);
              {
                  String message = "dans un bloc";
                  IO.println(message);
              }
          }
      output: |-
        14
        dans un bloc
cards:
  - key: definition-portee
    format: course
    question: Qu'est-ce que la portée d'une variable ?
    answer: "La partie du code où elle est utilisable : de sa déclaration jusqu'à la fin du bloc `{ }` qui la contient."
  - key: portee-variable-boucle
    format: course
    question: Quelle est la portée de `i` dans `for (int i = 0; i < n; i++)` ?
    answer: "La boucle seulement : `i` n'existe plus après la boucle."
  - key: masquer-un-champ
    format: course
    question: Un paramètre peut-il porter le même nom qu'un champ ?
    answer: |-
      Oui : il **masque** le champ dans la méthode. On atteint alors le champ avec `this.nom`, comme dans un constructeur
      (`this.nom = nom;`).
  - key: duree-de-vie
    format: course
    question: Quand une variable locale cesse-t-elle d'exister ?
    answer: |-
      À la fin de son bloc. L'objet qu'elle désignait, lui, reste en mémoire tant qu'une autre référence le désigne ;
      ensuite, le ramasse-miettes le libère.
  - key: vf-apres-if
    format: true-false
    question: Une variable déclarée dans le bloc d'un `if` reste utilisable après le `if`.
    truth: false
    answer: Elle disparaît à la fin du bloc ; pour l'utiliser après, on la déclare avant le `if`.
  - key: vf-meme-nom-imbrique
    format: true-false
    question: Une boucle peut déclarer une variable `i` alors qu'une autre variable locale `i` est déjà visible.
    truth: false
    answer: Deux variables locales visibles au même endroit ne peuvent pas porter le même nom.
  - key: vf-parametre-champ
    format: true-false
    question: Un paramètre de méthode peut porter le même nom qu'un champ de la classe.
    truth: true
    answer: Il masque alors le champ, qu'on atteint avec `this`.
  - key: vf-i-apres-boucle
    format: true-false
    question: Après `for (int i = 0; i < 3; i++) { }`, on peut encore lire `i`.
    truth: false
    answer: '`i` n''existe que dans la boucle.'
  - key: qcm-visibilite-if
    format: multiple-choice
    question: "Dans `if (ok) { int total = 1; }`, où `total` est-il utilisable ?"
    choices:
      - text: "Seulement dans le bloc du `if`"
        correct: true
      - text: "Dans toute la méthode"
        correct: false
      - text: "Dans toute la classe"
        correct: false
      - text: "Après le `if` seulement"
        correct: false
    answer: Une variable locale vit dans son bloc.
  - key: qcm-atteindre-champ
    format: multiple-choice
    question: Le paramètre `nom` masque le champ `nom`. Comment atteindre le champ ?
    choices:
      - text: "`this.nom`"
        correct: true
      - text: "`nom`"
        correct: false
      - text: "`super.nom`"
        correct: false
      - text: "`champ.nom`"
        correct: false
    answer: '`this` désigne l''objet courant, et donc son champ.'
  - key: qcm-boucles-successives
    format: multiple-choice
    question: Lequel de ces morceaux de code compile ?
    choices:
      - text: "Deux boucles l'une après l'autre, chacune avec son `int i`"
        correct: true
      - text: "Une boucle `int i` imbriquée dans une autre boucle `int i`"
        correct: false
      - text: "`int x = 1;` puis `int x = 2;` dans le même bloc"
        correct: false
      - text: "Lire `i` après la fin de `for (int i ...)`"
        correct: false
    answer: Le `i` de la première boucle a disparu quand la seconde commence ; imbriqués, les deux seraient visibles en même temps.
  - key: qcm-fin-de-vie
    format: multiple-choice
    question: Quand une variable locale disparaît-elle ?
    choices:
      - text: "À la fin du bloc où elle est déclarée"
        correct: true
      - text: "À la fin du programme"
        correct: false
      - text: "Quand le ramasse-miettes passe"
        correct: false
      - text: "Jamais tant que la classe est chargée"
        correct: false
    answer: Le ramasse-miettes s'occupe des objets ; la variable, elle, disparaît avec son bloc.
  - key: code-bloc
    format: code-output
    question: |-
      ```java
      int x = 1;
      {
          int y = x + 1;
          x = y * 2;
      }
      System.out.println(x);
      ```
    answer: '`4` : `y` vaut 2 dans le bloc, et `x` reçoit 2 × 2 ; `x`, déclarée avant, survit au bloc.'
    check:
      output: "4"
  - key: code-boucles-successives
    format: code-output
    question: |-
      ```java
      for (int i = 0; i < 2; i++) { }
      for (int i = 5; i < 6; i++) {
          System.out.println(i);
      }
      ```
    answer: '`5` : chaque boucle a sa propre variable `i`.'
    check:
      output: "5"
  - key: code-parametre-masque
    format: code-output
    question: |-
      ```java
      class Compte {
          int solde = 10;

          void crediter(int solde) {
              solde = solde + 5;
          }
      }
      Compte c = new Compte();
      c.crediter(100);
      System.out.println(c.solde);
      ```
    answer: |-
      `10` : dans `crediter`, `solde` désigne le **paramètre**, qui masque le champ. On a modifié le paramètre, pas le
      champ ; il aurait fallu `this.solde = this.solde + solde;`.
    check:
      output: "10"
  - key: code-somme-carres
    format: code-output
    question: |-
      ```java
      int somme = 0;
      for (int i = 1; i <= 3; i++) {
          int carre = i * i;
          somme += carre;
      }
      System.out.println(somme);
      ```
    answer: '`14` : 1 + 4 + 9. `carre` est recréée à chaque tour, `somme` vit hors de la boucle.'
    check:
      output: "14"
  - key: bug-variable-hors-du-if
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: variable remise`) :
      ```java
      if (estFidele) {
          double remise = 0.1;
      }
      double total = prix * (1 - remise);
      ```
    answer: |-
      ```java
      double remise = 0;
      if (estFidele) {
          remise = 0.1;
      }
      double total = prix * (1 - remise);
      ```
      `remise` disparaissait à la fin du bloc du `if` ; déclarée avant, elle reste utilisable après.
  - key: bug-i-apres-boucle
    format: bug-fix
    question: |-
      On cherche l'indice du premier nombre négatif. Ce code ne compile pas :
      ```java
      for (int i = 0; i < nombres.length; i++) {
          if (nombres[i] < 0) {
              break;
          }
      }
      System.out.println("Premier négatif à l'indice " + i);
      ```
    answer: |-
      ```java
      int i = 0;
      while (i < nombres.length && nombres[i] >= 0) {
          i++;
      }
      System.out.println("Premier négatif à l'indice " + i);
      ```
      Le `i` d'un `for` n'existe que dans la boucle. Déclaré avant, il garde sa valeur après.
  - key: bug-this-oublie
    format: bug-fix
    question: |-
      Après `new Client("Ada")`, `getNom()` renvoie `null` :
      ```java
      public class Client {
          private String nom;

          public Client(String nom) {
              nom = nom;
          }
      }
      ```
    answer: |-
      ```java
      public Client(String nom) {
          this.nom = nom;
      }
      ```
      Le paramètre masque le champ : `nom = nom` recopie le paramètre sur lui-même. `this.nom` désigne le champ.
  - key: bug-redeclaration-imbriquee
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable i is already defined`) :
      ```java
      for (int i = 0; i < 3; i++) {
          for (int i = 0; i < 3; i++) {
              System.out.println(i);
          }
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < 3; i++) {
          for (int j = 0; j < 3; j++) {
              System.out.println(i + " " + j);
          }
      }
      ```
      Le `i` de la boucle extérieure est encore visible dans la boucle intérieure : il faut un autre nom.
