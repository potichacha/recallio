notion: jshell
lesson: |-
  **JShell**, livré avec le JDK depuis Java 9, est une boucle interactive (*REPL*) : on tape une instruction, elle
  s'exécute aussitôt.

  ```
  $ jshell
  jshell> int x = 21 * 2
  x ==> 42
  jshell> "Java".toUpperCase()
  $2 ==> "JAVA"
  jshell> /exit
  ```

  - Pas de classe ni de `main` : on tape des **instructions**, des **expressions** et des **déclarations** une à une.
  - Une expression non rangée reçoit un nom automatique (`$2`), qu'on peut réutiliser.
  - Le point-virgule final est facultatif pour une instruction seule.
  - Des **commandes** commencent par `/` : `/vars` (variables), `/methods`, `/imports`, `/list` (ce qu'on a tapé),
    `/open fichier.jsh`, `/exit`.
  - Les imports courants (`java.util.*`, `java.util.stream.*`, `java.io.*`...) sont déjà faits.
  - **Tab** complète les noms et affiche la documentation.

  Idéal pour vérifier un comportement en dix secondes (que vaut `-7 % 3` ?), apprendre une API ou préparer un exemple ;
  pas pour écrire une application.

  **Piège classique** : au premier niveau, JShell ignore `final` et `static`, et y fait des champs plutôt que des
  variables locales. Un comportement propre aux variables locales s'essaie donc dans une méthode.

  **En entretien** : « JShell sert à essayer une expression ou une API sans créer de projet ; c'est l'outil le plus
  rapide pour vérifier un doute. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce que JShell ?
    answer: "La boucle interactive (REPL) du JDK depuis Java 9 : on tape une instruction ou une expression, elle s'exécute aussitôt."
  - key: usages
    format: course
    question: À quoi sert JShell au quotidien ?
    answer: À vérifier un comportement en quelques secondes, découvrir une API ou préparer un exemple, sans créer de classe ni de projet.
  - key: commandes
    format: course
    question: Citez trois commandes de JShell.
    answer: '`/vars` (les variables), `/methods`, `/imports`, `/list` (l''historique), `/open` (charger un fichier), `/exit`.'
  - key: nom-automatique
    format: course
    question: Que devient la valeur d'une expression tapée dans JShell sans être rangée dans une variable ?
    answer: Elle reçoit un nom automatique comme `$1` ou `$2`, réutilisable dans les lignes suivantes.
  - key: vf-classe-requise
    format: true-false
    question: Dans JShell, il faut écrire une classe avec `main` pour exécuter du code.
    truth: false
    answer: On tape directement des instructions et des expressions.
  - key: vf-version
    format: true-false
    question: JShell est livré avec le JDK depuis Java 9.
    truth: true
    answer: C'est la JEP 222.
  - key: vf-imports
    format: true-false
    question: Dans JShell, il faut importer `java.util.List` avant de l'utiliser.
    truth: false
    answer: JShell importe d'office les packages courants, dont `java.util`.
  - key: vf-final
    format: true-false
    question: Au premier niveau de JShell, `final int x = 1;` crée une variable qu'on ne peut plus réaffecter.
    truth: false
    answer: JShell ignore `final` au premier niveau (avec un avertissement) ; pour tester `final`, on écrit une méthode.
  - key: qcm-lancer
    format: multiple-choice
    question: Comment lance-t-on JShell ?
    choices:
      - text: "La commande `jshell`"
        correct: true
      - text: "`java -shell`"
        correct: false
      - text: "`javac --interactive`"
        correct: false
      - text: "`jrepl`"
        correct: false
    answer: '`jshell` est un outil du JDK, comme `javac` et `java`.'
  - key: qcm-variables
    format: multiple-choice
    question: Quelle commande liste les variables déclarées dans la session ?
    choices:
      - text: "`/vars`"
        correct: true
      - text: "`/list`"
        correct: false
      - text: "`/types`"
        correct: false
      - text: "`/help`"
        correct: false
    answer: '`/list` affiche ce qu''on a tapé ; `/types` les classes déclarées.'
  - key: qcm-quitter
    format: multiple-choice
    question: Comment quitte-t-on JShell ?
    choices:
      - text: "`/exit`"
        correct: true
      - text: "`exit()`"
        correct: false
      - text: "`quit;`"
        correct: false
      - text: "`System.exit`, obligatoirement"
        correct: false
    answer: Les commandes de JShell commencent par `/`.
  - key: qcm-bon-usage
    format: multiple-choice
    question: Pour lequel de ces besoins JShell est-il le plus adapté ?
    choices:
      - text: "Vérifier ce que vaut `\\\"a,b,,\\\".split(\\\",\\\").length`"
        correct: true
      - text: "Écrire le backend d'une application web"
        correct: false
      - text: "Lancer les tests d'un projet Maven"
        correct: false
      - text: "Déployer une application en production"
        correct: false
    answer: JShell est fait pour essayer vite une expression ou une API.
