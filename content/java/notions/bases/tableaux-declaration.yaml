notion: tableaux-declaration
lesson: |-
  Un **tableau** range un nombre **fixe** de valeurs d'un même type, accessibles par leur **indice**, à partir de 0 :

  ```java
  int[] notes = new int[3];         // trois cases, valant 0 au départ
  notes[0] = 12;
  String[] jours = {"lun", "mar"};  // créé et rempli d'un coup
  int taille = jours.length;        // 2 : un champ, sans parenthèses
  ```

  - Le type s'écrit `int[]` ; la taille se choisit à la **création** (`new int[3]`) et ne change plus.
  - Les cases d'un tableau neuf valent la valeur par défaut du type : `0`, `0.0`, `false`, ou `null` pour des objets.
  - L'initialiseur `{...}` n'est permis qu'à la déclaration ; ailleurs, on écrit `new int[] {1, 2, 3}`.
  - Un tableau est un **objet** : la variable contient une référence, et deux variables peuvent désigner le même
    tableau.
  - Pour une taille qui varie (ajouter, retirer), on utilise une `List` (`ArrayList`), pas un tableau.

  **Piège classique** : afficher un tableau avec `System.out.println(notes)`. On obtient quelque chose comme `[I@1b6d3586`
  (son type et son code de hachage) ; il faut `Arrays.toString(notes)`.

  **En entretien** : « Un tableau a une taille fixée à la création et des indices de 0 à `length - 1` ; dès qu'il faut
  une taille variable, on prend une `ArrayList`. »
tour:
  - title: Les tableaux
    text: |-
      Un tableau a une **taille fixe**, choisie à sa création : `int[] notes = new int[3];` crée trois cases à 0. On
      peut aussi l'initialiser directement : `String[] jours = {"lun", "mar", "mer"};`.

      Un tableau est un objet, et la variable en est une référence. `notes.length` donne sa taille : c'est un champ,
      sans parenthèses. `Arrays.toString` l'affiche lisiblement ; afficher le tableau lui-même ne montrerait qu'une
      adresse.
    example:
      files:
        Main.java: |-
          void main() {
              int[] notes = new int[3];
              notes[0] = 12;
              IO.println(Arrays.toString(notes) + " " + notes.length);

              String[] jours = {"lun", "mar", "mer"};
              IO.println(jours[1] + " " + jours.length);
          }
      output: |-
        [12, 0, 0] 3
        mar 3
cards:
  - key: declarer-creer
    format: course
    question: Comment créer un tableau de 5 entiers ?
    choices:
      - {text: "`int[] t = new int[5];`", correct: true}
      - {text: "`int[5] t = new int[];`", correct: false}
      - {text: "`int t[5];`", correct: false}
      - {text: "`int[] t = new int(5);`", correct: false}
    answer: "`int[] t = new int[5];` : cinq cases, qui valent 0 au départ. La taille se donne à `new`, entre crochets ; `int t[5]` vient du C."
  - key: taille-fixe
    format: course
    question: Peut-on agrandir un tableau après sa création ?
    choices:
      - {text: "Non : sa taille est fixée à la création", correct: true}
      - {text: "Oui : en affectant une case au-delà de la fin", correct: false}
      - {text: "Oui : en modifiant son champ `length`", correct: false}
      - {text: "Oui : avec `t.add(x)`, comme une liste", correct: false}
    answer: "Non, sa taille est fixée à la création ; écrire au-delà lève une `ArrayIndexOutOfBoundsException`, et `length` est `final`. On crée un nouveau tableau plus grand (`Arrays.copyOf`) ou, mieux, on utilise une `ArrayList` quand la taille varie."
  - key: valeurs-par-defaut
    format: course
    question: Que contiennent les cases d'un tableau qu'on vient de créer avec `new` ?
    choices:
      - {text: "La valeur par défaut du type : `0`, `false` ou `null`", correct: true}
      - {text: "Rien : il faut les remplir avant de les lire", correct: false}
      - {text: "Ce qui traînait en mémoire, comme en C", correct: false}
      - {text: "`null` dans toutes les cases, même pour un `int[]`", correct: false}
    answer: "La valeur par défaut du type : `0` pour les nombres, `false` pour les booléens, `'\\u0000'` pour les `char`, `null` pour les objets."
  - key: afficher
    format: course
    question: "Quelle instruction affiche le contenu du tableau `t`, sous la forme `[1, 2, 3]` ?"
    choices:
      - {text: "`System.out.println(Arrays.toString(t));`", correct: true}
      - {text: "`System.out.println(t);`", correct: false}
      - {text: "`System.out.println(t.toString());`", correct: false}
      - {text: "`System.out.println(String.valueOf(t));`", correct: false}
    answer: "`Arrays.toString(t)` donne `[1, 2, 3]`. Un tableau ne redéfinit pas `toString` : `println(t)`, `t.toString()` et `String.valueOf(t)` n'affichent que le type et un code de hachage."
  - key: vf-premier-indice
    format: true-false
    question: Le premier élément d'un tableau a l'indice 1.
    truth: false
    answer: Les indices commencent à 0 ; le dernier est `length - 1`.
  - key: vf-length-methode
    format: true-false
    question: La taille d'un tableau s'obtient avec `t.length()`.
    truth: false
    answer: '`length` est un champ, sans parenthèses ; `length()` est la méthode des `String`.'
  - key: vf-defaut-objets
    format: true-false
    question: Les cases d'un `String[]` neuf valent `null`.
    truth: true
    answer: Pour un tableau d'objets, la valeur par défaut est `null`.
  - key: vf-tableau-objet
    format: true-false
    question: Un tableau Java est un objet.
    truth: true
    answer: Il vit dans le tas, la variable contient une référence, et il a un champ `length`.
  - key: qcm-creer
    format: multiple-choice
    question: Quelles déclarations créent un tableau de trois entiers ?
    choices:
      - text: "`int[] t = new int[3];`"
        correct: true
      - text: "`int[] t = {0, 0, 0};`"
        correct: true
      - text: "`int t[3];`"
        correct: false
      - text: "`int[] t = new int();`"
        correct: false
    answer: On donne la taille à `new`, ou les valeurs entre accolades ; `int t[3]` vient du C.
  - key: qcm-dernier-indice
    format: multiple-choice
    question: Quel est l'indice du dernier élément d'un tableau `t` ?
    choices:
      - text: "`t.length - 1`"
        correct: true
      - text: "`t.length`"
        correct: false
      - text: "`t.length + 1`"
        correct: false
      - text: "`-1`"
        correct: false
    answer: Avec des indices de 0 à `length - 1`, il y a bien `length` éléments.
  - key: qcm-defaut
    format: multiple-choice
    question: Que contient la case 0 d'un tableau créé par `new boolean[2]` ?
    choices:
      - text: "`false`"
        correct: true
      - text: "`true`"
        correct: false
      - text: "`null`"
        correct: false
      - text: "Une valeur aléatoire"
        correct: false
    answer: Un tableau neuf de booléens est rempli de `false` ; Java n'a jamais de valeur aléatoire.
  - key: qcm-taille-variable
    format: multiple-choice
    question: Pour une liste de courses dont on ajoute et retire des articles, que choisir ?
    choices:
      - text: "Une `ArrayList<String>`"
        correct: true
      - text: "Un `String[]` de taille 100"
        correct: false
      - text: "Un `String[]` qu'on agrandit avec `length++`"
        correct: false
      - text: "Une `String` séparée par des virgules"
        correct: false
    answer: Un tableau a une taille fixe ; une `ArrayList` grandit et rétrécit.
  - key: trous-creer
    format: fill-in
    question: |-
      Complète pour créer un tableau de 10 `double` :
      ```java
      double[] mesures = ___ double[10];
      ```
    blanks: [[new]]
    answer: '`new` crée le tableau, avec sa taille entre crochets.'
  - key: trous-type
    format: fill-in
    question: |-
      Complète le type :
      ```java
      ___ jours = {"lundi", "mardi", "mercredi"};
      ```
    blanks: [["String[]", var]]
    answer: "Un tableau de chaînes : `String[]`."
  - key: trous-affecter
    format: fill-in
    question: |-
      Complète pour ranger 20 dans la première case :
      ```java
      notes[___] = 20;
      ```
    blanks: [["0"]]
    answer: La première case a l'indice 0.
  - key: trous-afficher
    format: fill-in
    question: |-
      Complète pour afficher `[1, 2, 3]` :
      ```java
      int[] t = {1, 2, 3};
      System.out.println(Arrays.___(t));
      ```
    blanks: [[toString]]
    answer: '`Arrays.toString` met en forme le contenu.'
  - key: code-defauts
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] t = new int[3];
      t[1] = 7;
      System.out.println(Arrays.toString(t));
      ```
    choices:
      - {text: "`[0, 7, 0]`", correct: true}
      - {text: "`[7, 0, 0]`", correct: false}
      - {text: "`[0, 7]`", correct: false}
      - {text: "`[null, 7, null]`", correct: false}
    answer: "`[0, 7, 0]` : `t[1]` est la deuxième case, et les autres gardent la valeur par défaut d'un `int`, 0."
    check:
      output: "[0, 7, 0]"
  - key: code-length
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String[] jours = {"lun", "mar", "mer"};
      System.out.println(jours.length + " " + jours[jours.length - 1]);
      ```
    choices:
      - {text: "`3 mer`", correct: true}
      - {text: "`2 mer`", correct: false}
      - {text: "`3 mar`", correct: false}
      - {text: "Une `ArrayIndexOutOfBoundsException`", correct: false}
    answer: "`3 mer` : trois éléments, et le dernier est à l'indice `length - 1`, soit 2."
    check:
      output: "3 mer"
  - key: code-defaut-objet
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String[] noms = new String[2];
      System.out.println(noms[0]);
      ```
    choices:
      - {text: "`null`", correct: true}
      - {text: "Une `NullPointerException`", correct: false}
      - {text: "Une ligne vide : la chaîne `\"\"`", correct: false}
      - {text: "Une `ArrayIndexOutOfBoundsException`", correct: false}
    answer: "`null` : un tableau d'objets neuf est rempli de `null`, et `println` affiche le mot `null` sans erreur. Il faudrait appeler une méthode dessus pour une `NullPointerException`."
    check:
      output: "null"
  - key: code-meme-tableau
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] a = {1, 2};
      int[] b = a;
      b[0] = 9;
      System.out.println(a[0]);
      ```
    choices:
      - {text: "`9`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "`[9, 2]`", correct: false}
    answer: "`9` : `b = a` copie la référence, pas le tableau ; `a` et `b` désignent le même tableau."
    check:
      output: "9"
  - key: bug-println-tableau
    format: bug-fix
    question: |-
      Ce code affiche `[I@1b6d3586` au lieu des notes. Quelle correction est la bonne ?
      ```java
      System.out.println(notes);
      ```
    choices:
      - {text: "`System.out.println(Arrays.toString(notes));`", correct: true}
      - {text: "`System.out.println(notes.toString());`", correct: false}
      - {text: "`System.out.println(\"\" + notes);`", correct: false}
      - {text: "`System.out.print(notes);`", correct: false}
    answer: |-
      ```java
      System.out.println(Arrays.toString(notes));
      ```
      Un tableau ne redéfinit pas `toString` : `notes.toString()` et la concaténation donnent le même `[I@...`. Il faut `Arrays.toString`.
  - key: bug-taille-oubliee
    format: bug-fix
    question: |-
      Ce code ne compile pas (`array dimension missing`). Quelle correction est la bonne ?
      ```java
      int[] scores = new int[];
      ```
    choices:
      - {text: "Donner la taille : `new int[10]`", correct: true}
      - {text: "Écrire `new int()` au lieu de `new int[]`", correct: false}
      - {text: "Déclarer `int scores[]` au lieu de `int[] scores`", correct: false}
      - {text: "Écrire `new Integer[]` au lieu de `new int[]`", correct: false}
    answer: |-
      ```java
      int[] scores = new int[10];
      ```
      Il faut donner la taille à la création (ou les valeurs : `new int[] {1, 2}`).
  - key: bug-initialiseur
    format: bug-fix
    question: |-
      Ce code ne compile pas (`illegal start of expression`). Quelle correction est la bonne ?
      ```java
      int[] t;
      t = {1, 2, 3};
      ```
    choices:
      - {text: "Écrire `t = new int[] {1, 2, 3};`", correct: true}
      - {text: "Écrire `t = [1, 2, 3];`", correct: false}
      - {text: "Écrire `t = new int[3] {1, 2, 3};`", correct: false}
      - {text: "Écrire `t = (int[]) {1, 2, 3};`", correct: false}
    answer: |-
      ```java
      int[] t;
      t = new int[] {1, 2, 3};
      ```
      L'initialiseur seul `{...}` n'est permis qu'à la déclaration ; ailleurs, il faut `new int[]`, sans taille : `new int[3] {1, 2, 3}` ne compile pas.
  - key: bug-length-parentheses
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: method length()`). Quelle correction est la bonne ?
      ```java
      int nombre = prix.length();
      ```
    choices:
      - {text: "Écrire `prix.length`, sans parenthèses", correct: true}
      - {text: "Écrire `prix.size()`", correct: false}
      - {text: "Écrire `prix.getLength()`", correct: false}
      - {text: "Écrire `Arrays.length(prix)`", correct: false}
    answer: |-
      ```java
      int nombre = prix.length;
      ```
      Pour un tableau, `length` est un champ, sans parenthèses.
