notion: jdk-jre-jvm
cards:
  - key: jdk-vs-jre-vs-jvm
    format: course
    question: JDK vs JRE vs JVM ?
    answer: JVM = exécute le bytecode ; JRE = JVM + bibliothèques standard ; JDK = JRE + outils de développement (javac, jar, jcmd...).
  - key: difference-openjdk-oracle-jdk-temurin
    format: course
    question: Différence OpenJDK / Oracle JDK / Temurin ?
    answer: OpenJDK est le projet source ; Oracle JDK et Temurin (et Corretto, Zulu...) en sont des distributions, avec des licences et des supports différents.
  - key: definition-jdk-jre-jvm
    format: definition
    question: JDK, JRE, JVM
    answer: Kit de développement, environnement d'exécution, machine virtuelle
