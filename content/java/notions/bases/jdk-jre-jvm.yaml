notion: jdk-jre-jvm
lesson: |-
  Trois sigles, trois rôles, emboîtés comme des poupées russes :

  - la **JVM** (*Java Virtual Machine*) **exécute** le bytecode ;
  - le **JRE** (*Java Runtime Environment*) = la JVM + la **bibliothèque standard** (`java.lang`, `java.util`...) :
    tout ce qu'il faut pour **lancer** un programme ;
  - le **JDK** (*Java Development Kit*) = le JRE + les **outils de développement** : `javac` (compilateur), `jar`,
    `jshell`, `jcmd`, `jfr`...

  Pour **développer**, on installe un JDK. Pour seulement **exécuter**, un runtime suffit : Oracle ne distribue plus de
  JRE séparé depuis Java 11, mais certaines distributions (Temurin, par exemple en image Docker `-jre`) en proposent
  encore, et `jlink` construit un runtime réduit aux modules d'une application.

  **OpenJDK** est le projet open source de référence ; Temurin (Eclipse Adoptium), Corretto (Amazon), Zulu (Azul) ou
  Oracle JDK en sont des **distributions**, compilées et supportées par différents éditeurs.

  **Piège classique** : croire qu'un serveur qui n'a qu'un runtime peut compiler du code. Sans JDK, pas de `javac`.

  **En entretien** : « La JVM exécute, le JRE ajoute les bibliothèques pour lancer, le JDK ajoute les outils pour
  développer. »
tour:
  - title: JDK, JRE et JVM
    text: |-
      Trois sigles à distinguer :

      - la **JVM**, la machine virtuelle Java, exécute le bytecode, avec un compilateur à la volée (JIT) et un
      ramasse-miettes ; - le **JRE** était la JVM plus la bibliothèque standard : de quoi exécuter un programme. Il
      n'est plus distribué à part depuis Java 11 ; - le **JDK** contient tout cela, et les outils du développeur :
      `javac` (le compilateur), `java`, `jshell`, `javadoc`, `jar`…

      On installe donc un JDK, par exemple Eclipse Temurin. Ce programme interroge la JVM qui l'exécute.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println("machine virtuelle : " + System.getProperty("java.vm.name"));
              IO.println("version de Java : " + Runtime.version().feature());
              IO.println("ramasse-miettes actif : " + (Runtime.getRuntime().maxMemory() > 0));
          }
      output: |-
        machine virtuelle : OpenJDK 64-Bit Server VM
        version de Java : 25
        ramasse-miettes actif : true
cards:
  - key: jdk-vs-jre-vs-jvm
    format: course
    question: "Comment s'emboîtent le JDK, le JRE et la JVM ?"
    choices:
      - text: "La JVM contient le JRE, qui contient le JDK"
        correct: false
      - text: "Le JDK contient le JRE, qui contient la JVM"
        correct: true
      - text: "Ce sont trois noms du même logiciel"
        correct: false
      - text: "Le JRE contient le JDK, qui contient la JVM"
        correct: false
    answer: "La JVM exécute le bytecode ; le JRE, c'est la JVM plus la bibliothèque standard ; le JDK, c'est le JRE plus les outils de développement (`javac`, `jar`, `jcmd`...)."
  - key: difference-openjdk-oracle-jdk-temurin
    format: course
    question: "Quel lien y a-t-il entre OpenJDK, Oracle JDK et Temurin ?"
    choices:
      - text: "Ce sont trois langages différents, compatibles entre eux"
        correct: false
      - text: "OpenJDK est une copie libre d'Oracle JDK, avec moins de fonctionnalités"
        correct: false
      - text: "Temurin est la version payante d'Oracle JDK"
        correct: false
      - text: "OpenJDK est le projet source ; Oracle JDK et Temurin en sont des distributions"
        correct: true
    answer: "OpenJDK est le projet source ; Oracle JDK et Temurin (comme Corretto ou Zulu) en sont des distributions, avec des licences et des supports différents."
  - key: que-installer-pour-developper
    format: course
    question: Que faut-il installer pour développer en Java ?
    choices:
      - text: "Un navigateur web récent"
        correct: false
      - text: "Une JVM seule"
        correct: false
      - text: "Un JRE"
        correct: false
      - text: "Un JDK"
        correct: true
    answer: "Un **JDK** : il contient le compilateur `javac`, la JVM et la bibliothèque standard."
  - key: outils-du-jdk
    format: course
    question: "Lesquels de ces outils sont fournis par le JDK ?"
    choices:
      - text: "`jar`"
        correct: true
      - text: "`javac`"
        correct: true
      - text: "`mvn`"
        correct: false
      - text: "`npm`"
        correct: false
      - text: "`jshell`"
        correct: true
    answer: "`javac` (compilateur), `java` (lanceur), `jar` (archives), `jshell` (boucle interactive), `javadoc`, `jcmd` et `jfr` (diagnostic). Maven (`mvn`) et npm s'installent à part."
  - key: vf-jdk-contient-jvm
    format: true-false
    question: Le JDK contient une JVM.
    truth: true
    answer: Le JDK contient tout le runtime (JVM et bibliothèque standard), plus les outils de développement.
  - key: vf-jre-compile
    format: true-false
    question: Un JRE seul permet de compiler un fichier `.java`.
    truth: false
    answer: Le compilateur `javac` fait partie du JDK, pas du JRE.
  - key: vf-openjdk-distributions
    format: true-false
    question: Temurin et Corretto sont des distributions d'OpenJDK.
    truth: true
    answer: Ils sont compilés à partir du code d'OpenJDK, chacun avec son éditeur, sa licence et son support.
  - key: vf-jre-separe-depuis-11
    format: true-false
    question: Depuis Java 11, Oracle ne distribue plus de JRE séparé.
    truth: true
    answer: On installe un JDK, ou on construit un runtime réduit à l'application avec `jlink`.
  - key: qcm-contient-javac
    format: multiple-choice
    question: Lequel contient le compilateur `javac` ?
    choices:
      - text: "Le JDK"
        correct: true
      - text: "Le JRE"
        correct: false
      - text: "La JVM"
        correct: false
    answer: '`javac` est un outil de développement : il est dans le JDK.'
  - key: qcm-jre-contenu
    format: multiple-choice
    question: Que contient le JRE ?
    choices:
      - text: "La JVM"
        correct: true
      - text: "La bibliothèque standard (`java.lang`, `java.util`...)"
        correct: true
      - text: "Le compilateur `javac`"
        correct: false
      - text: "Le débogueur et les outils de profilage"
        correct: false
    answer: "Le JRE est fait pour exécuter : JVM et bibliothèques, sans outils de développement."
  - key: qcm-role-jvm
    format: multiple-choice
    question: Quel est le rôle de la JVM ?
    choices:
      - text: "Exécuter le bytecode"
        correct: true
      - text: "Compiler le code source en bytecode"
        correct: false
      - text: "Gérer les dépendances d'un projet"
        correct: false
      - text: "Formater le code"
        correct: false
    answer: La JVM exécute le bytecode (et gère la mémoire) ; `javac` le produit.
  - key: qcm-openjdk
    format: multiple-choice
    question: Qu'est-ce qu'OpenJDK ?
    choices:
      - text: "Le projet open source de référence de Java, d'où viennent les distributions"
        correct: true
      - text: "Une version payante de Java réservée aux entreprises"
        correct: false
      - text: "Un framework web"
        correct: false
      - text: "Un IDE pour Java"
        correct: false
    answer: Les distributions (Temurin, Corretto, Oracle JDK...) sont compilées à partir d'OpenJDK.
  - key: situation-javac-introuvable
    format: scenario
    question: "Sur le serveur d'intégration, `java -version` répond, mais `javac` est introuvable. Qu'en conclus-tu ?"
    choices:
      - text: "La machine n'a qu'un runtime (un JRE), pas de JDK"
        correct: true
      - text: "`javac` n'existe plus depuis Java 11"
        correct: false
      - text: "La JVM est abîmée et doit être réinstallée"
        correct: false
      - text: "Il faut lancer `java -compile` à la place"
        correct: false
    answer: |-
      Que la machine n'a qu'un **runtime** (un JRE, ou une image d'exécution réduite), pas de **JDK**. On peut y lancer
      des programmes, pas les compiler. Pour le build, il faut installer un JDK (par exemple Temurin) et vérifier que le
      `PATH` ou `JAVA_HOME` pointe sur lui.
  - key: situation-choisir-distribution
    format: scenario
    question: "Ton équipe démarre un projet et te demande quel JDK installer. Que conseilles-tu ?"
    choices:
      - text: "Une distribution d'OpenJDK comme Temurin, en version LTS, la même pour toute l'équipe"
        correct: true
      - text: "Oracle JDK : les autres distributions ne sont pas compatibles"
        correct: false
      - text: "La dernière version parue, chacun sur son poste"
        correct: false
      - text: "Un JRE : il suffit pour compiler"
        correct: false
    answer: |-
      Une distribution d'**OpenJDK** gratuite et maintenue, comme **Temurin** (Eclipse Adoptium) ou Corretto, dans une
      version **LTS** (21 ou 25). Toute l'équipe et la CI doivent utiliser la même version, fixée par exemple dans le
      build (Maven `maven.compiler.release`) et par un outil comme SDKMAN.
  - key: situation-image-docker
    format: scenario
    question: "Ton image Docker de production embarque un JDK complet. Comment l'alléger ?"
    choices:
      - text: "Retirer la JVM de l'image : le bytecode s'exécute seul"
        correct: false
      - text: "Désactiver le ramasse-miettes de la JVM"
        correct: false
      - text: "Partir d'une image JRE (ou d'un runtime fait avec `jlink`) et compiler dans une étape de build à part"
        correct: true
      - text: "Compresser le `.jar` une seconde fois"
        correct: false
    answer: |-
      En production, on n'a besoin que d'exécuter : pas de `javac`. On peut partir d'une image **JRE** (par exemple
      `eclipse-temurin:25-jre`), ou construire un runtime réduit aux modules utiles avec **`jlink`**. On compile dans
      une étape de build séparée (build multi-étapes) qui, elle, utilise un JDK.
  - key: situation-java-home
    format: scenario
    question: "Maven compile avec Java 17, alors que tu as installé Java 25. Où regardes-tu d'abord ?"
    choices:
      - text: "Les fichiers `.class` produits"
        correct: false
      - text: "La variable `JAVA_HOME`, que `mvn -version` affiche"
        correct: true
      - text: "La version de Maven : elle impose Java 17"
        correct: false
      - text: "Le code source : il doit déclarer sa version de Java"
        correct: false
    answer: |-
      Maven utilise le JDK désigné par **`JAVA_HOME`** (ou le premier `java` du `PATH`) : `mvn -version` affiche celui
      qu'il prend. Il faut faire pointer `JAVA_HOME` sur le JDK 25, et vérifier `maven.compiler.release` dans le
      `pom.xml`.
  - key: definition-jdk-jre-jvm
    format: definition
    question: "Que veulent dire les sigles JDK, JRE et JVM, dans cet ordre ?"
    choices:
      - text: "Environnement d'exécution, machine virtuelle, kit de développement"
        correct: false
      - text: "Machine virtuelle, kit de développement, environnement d'exécution"
        correct: false
      - text: "Kit de développement, machine virtuelle, environnement d'exécution"
        correct: false
      - text: "Kit de développement, environnement d'exécution, machine virtuelle"
        correct: true
    answer: "*Java Development Kit* (kit de développement), *Java Runtime Environment* (environnement d'exécution), *Java Virtual Machine* (machine virtuelle)."
  - key: definition-jvm
    format: definition
    question: "Que désigne le sigle JVM ?"
    choices:
      - text: "Le kit qui réunit tous les outils de développement"
        correct: false
      - text: "La machine virtuelle qui exécute le bytecode et gère la mémoire"
        correct: true
      - text: "Le format des archives `.jar`"
        correct: false
      - text: "Le compilateur qui transforme le code source en bytecode"
        correct: false
    answer: '*Java Virtual Machine* : la machine virtuelle qui exécute le bytecode et gère la mémoire.'
  - key: definition-jdk
    format: definition
    question: "Que désigne le sigle JDK ?"
    choices:
      - text: "La bibliothèque standard, sans la JVM"
        correct: false
      - text: "Un framework web pour Java"
        correct: false
      - text: "La machine virtuelle seule"
        correct: false
      - text: "Le runtime Java, plus les outils de développement (`javac`, `jar`, `jshell`...)"
        correct: true
    answer: '*Java Development Kit* : le runtime Java plus les outils de développement (`javac`, `jar`, `jshell`...).'
  - key: definition-openjdk
    format: definition
    question: "Que représente OpenJDK pour Temurin ou Corretto ?"
    choices:
      - text: "Le projet source à partir duquel ils sont compilés"
        correct: true
      - text: "Rien : ce sont des projets sans rapport"
        correct: false
      - text: "Un concurrent qui les remplace depuis Java 11"
        correct: false
      - text: "Leur version payante, avec support"
        correct: false
    answer: Le projet open source de référence de Java, dont sont issues les distributions comme Temurin ou Corretto.
