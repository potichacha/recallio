notion: tableaux-covariance
lesson: |-
  Les tableaux Java sont **covariants** : si `String` est un sous-type d'`Object`, alors `String[]` est un sous-type
  d'`Object[]`.

  ```java
  Object[] objets = new String[2];   // compile : un String[] EST un Object[]
  objets[0] = "texte";               // ok
  objets[1] = 42;                    // compile, mais ArrayStoreException à l'exécution
  ```

  - Le tableau garde son **vrai type** (ici `String[]`) et le vérifie à **chaque écriture** : y ranger un `Integer`
    lève une **`ArrayStoreException`**.
  - Le compilateur ne voit que `Object[]` : l'erreur n'apparaît qu'à l'exécution.
  - Les **génériques**, eux, sont **invariants** : `List<String>` n'est **pas** une `List<Object>`, et
    `List<Object> l = new ArrayList<String>();` ne compile pas. L'erreur est attrapée à la compilation.
  - C'est l'une des raisons de préférer les collections génériques aux tableaux dans une API.

  **Piège classique** : une méthode qui reçoit un `Object[]` et y écrit. Si l'appelant lui a passé un `String[]`, elle
  plante avec `ArrayStoreException`.

  **En entretien** : « Les tableaux sont covariants et vérifiés à l'exécution (`ArrayStoreException`) ; les génériques
  sont invariants et vérifiés à la compilation. »
cards:
  - key: passe-avec-object-o-new-string
    format: course
    question: Que se passe-t-il avec `Object[] o = new String[1]; o[0] = 1;` ?
    answer: ArrayStoreException à l'exécution, les tableaux étant covariants mais vérifiés au runtime.
  - key: covariance
    format: course
    question: Que signifie « les tableaux sont covariants » ?
    answer: "Qu'un tableau d'un sous-type est un sous-type du tableau du type parent : `String[]` peut être affecté à un `Object[]`."
  - key: verification
    format: course
    question: Comment Java empêche-t-il de ranger un `Integer` dans un `String[]` vu comme `Object[]` ?
    answer: Le tableau connaît son vrai type et vérifie chaque écriture à l'exécution ; une écriture incompatible lève `ArrayStoreException`.
  - key: generiques-invariants
    format: course
    question: "`List<String>` est-elle une `List<Object>` ?"
    answer: |-
      Non : les génériques sont **invariants**, et `List<Object> l = new ArrayList<String>();` ne compile pas. Pour
      accepter des listes de sous-types en lecture, on écrit `List<? extends Object>`.
  - key: vf-affectation-compile
    format: true-false
    question: "`Object[] o = new String[3];` compile."
    truth: true
    answer: Les tableaux sont covariants.
  - key: vf-erreur-compilation
    format: true-false
    question: "Ranger un `Integer` dans un `String[]` vu comme `Object[]` est refusé à la compilation."
    truth: false
    answer: "Le compilateur ne voit qu'un `Object[]` : l'erreur arrive à l'exécution (`ArrayStoreException`)."
  - key: vf-list-invariante
    format: true-false
    question: "`List<Object> l = new ArrayList<String>();` compile."
    truth: false
    answer: Les génériques sont invariants ; l'erreur est détectée à la compilation.
  - key: vf-type-reel
    format: true-false
    question: Un tableau connaît son type réel à l'exécution.
    truth: true
    answer: C'est ce qui lui permet de lever `ArrayStoreException` ; les génériques, eux, perdent leur type à l'exécution (effacement).
  - key: qcm-exception
    format: multiple-choice
    question: "Quelle exception lève `Object[] o = new String[1]; o[0] = 3.14;` ?"
    choices:
      - text: "`ArrayStoreException`"
        correct: true
      - text: "`ClassCastException`"
        correct: false
      - text: "`ArrayIndexOutOfBoundsException`"
        correct: false
      - text: "Aucune, le code ne compile pas"
        correct: false
    answer: "Le tableau est un `String[]` : il refuse un `Double`."
  - key: qcm-compile
    format: multiple-choice
    question: Lesquelles de ces lignes compilent ?
    choices:
      - text: "`Object[] o = new String[2];`"
        correct: true
      - text: "`Number[] n = new Integer[2];`"
        correct: true
      - text: "`List<Object> l = new ArrayList<String>();`"
        correct: false
      - text: "`String[] s = new Object[2];`"
        correct: false
    answer: Tableaux covariants (dans le sens sous-type → parent), génériques invariants.
  - key: qcm-difference
    format: multiple-choice
    question: Quelle différence entre tableaux et génériques face au typage ?
    choices:
      - text: "Tableaux covariants vérifiés à l'exécution, génériques invariants vérifiés à la compilation"
        correct: true
      - text: "Les deux sont covariants"
        correct: false
      - text: "Les deux sont vérifiés à la compilation uniquement"
        correct: false
      - text: "Tableaux invariants, génériques covariants"
        correct: false
    answer: C'est pourquoi les génériques attrapent plus d'erreurs avant l'exécution.
  - key: qcm-api
    format: multiple-choice
    question: Pourquoi préférer `List<String>` à `String[]` dans la signature d'une méthode publique ?
    choices:
      - text: "Le typage invariant attrape les erreurs à la compilation"
        correct: true
      - text: "Une liste est toujours plus rapide qu'un tableau"
        correct: false
      - text: "Les tableaux ne peuvent pas contenir de `String`"
        correct: false
      - text: "Une liste ne peut pas être `null`"
        correct: false
    answer: Avec un tableau covariant, une écriture incompatible ne serait détectée qu'à l'exécution.
  - key: code-array-store
    format: code-output
    question: |-
      ```java
      Object[] o = new String[2];
      o[0] = "a";
      o[1] = 42;
      ```
    answer: "Une `ArrayStoreException` à la troisième ligne : le tableau est réellement un `String[]`."
    check:
      throws: ArrayStoreException
  - key: code-classe-reelle
    format: code-output
    question: |-
      ```java
      Object[] o = new String[1];
      System.out.println(o.getClass().getSimpleName());
      ```
    answer: '`String[]` : le tableau garde son type réel, quel que soit le type de la variable.'
    check:
      output: "String[]"
  - key: code-ecriture-valide
    format: code-output
    question: |-
      ```java
      Number[] n = new Integer[2];
      n[0] = 5;
      System.out.println(n[0]);
      ```
    answer: '`5` : un `Integer` est accepté dans un `Integer[]`, même vu comme `Number[]`.'
    check:
      output: "5"
  - key: code-double-dans-integer
    format: code-output
    question: |-
      ```java
      Number[] n = new Integer[1];
      n[0] = 1.5;
      ```
    answer: "Une `ArrayStoreException` : `1.5` devient un `Double`, qu'un `Integer[]` refuse."
    check:
      throws: ArrayStoreException
  - key: bug-ecriture-object
    format: bug-fix
    question: |-
      Cette méthode plante avec `ArrayStoreException` quand on lui passe un `String[]` :
      ```java
      static void reinitialiser(Object[] valeurs) {
          for (int i = 0; i < valeurs.length; i++) {
              valeurs[i] = 0;
          }
      }
      ```
    answer: |-
      ```java
      static void reinitialiser(Object[] valeurs) {
          Arrays.fill(valeurs, null);
      }
      ```
      Ranger un `Integer` dans un tableau réellement `String[]` est interdit. On écrit `null`, accepté par tout tableau
      d'objets, ou on rend la méthode générique et typée.
  - key: bug-list-object
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: ArrayList<String> cannot be converted to List<Object>`) :
      ```java
      List<Object> elements = new ArrayList<String>();
      ```
    answer: |-
      ```java
      List<String> elements = new ArrayList<>();
      ```
      Les génériques sont invariants. Pour une méthode qui lit des listes de n'importe quel type, on écrit
      `List<?>` ou `List<? extends Object>`.
  - key: bug-api-tableau
    format: bug-fix
    question: |-
      Cette API accepte qu'on y range n'importe quoi, et l'erreur n'apparaît qu'à l'exécution :
      ```java
      public void ajouterTous(Object[] cible, Object element) {
          cible[0] = element;
      }
      ```
    answer: |-
      ```java
      public <T> void ajouterTous(List<T> cible, T element) {
          cible.add(element);
      }
      ```
      Avec une liste générique, un élément du mauvais type est refusé à la compilation.
  - key: bug-cast-tableau
    format: bug-fix
    question: |-
      Ce code lève une `ClassCastException` :
      ```java
      Object[] objets = new Object[] {"a", "b"};
      String[] chaines = (String[]) objets;
      ```
    answer: |-
      ```java
      String[] chaines = Arrays.copyOf(objets, objets.length, String[].class);
      ```
      Le tableau est réellement un `Object[]`, même s'il ne contient que des chaînes : on ne peut pas le convertir, il
      faut en copier le contenu dans un vrai `String[]`.
