notion: constantes-final
lesson: |-
  `final` interdit de **réaffecter** une variable : elle reçoit sa valeur une seule fois.

  ```java
  final int maxEssais = 3;
  maxEssais = 4;                 // ne compile pas

  final int seuil;               // valeur donnée plus tard, mais une seule fois
  seuil = estPremium ? 100 : 50;
  ```

  Une **constante**, c'est un champ `static final` d'une valeur immuable, nommé en majuscules :

  ```java
  public static final double TAUX_TVA = 0.20;
  ```

  - `final` fige la **variable**, pas l'objet : `final List<String> noms` interdit `noms = autreListe`, mais permet
    `noms.add("Ada")`. Pour une liste qu'on ne peut pas modifier, on crée une liste immuable (`List.of(...)`).
  - Une variable locale jamais réaffectée est **effectivement finale** : c'est ce qu'exige une lambda pour l'utiliser.
  - Mettre `final` sur une variable locale documente l'intention et évite une réaffectation par erreur ; c'est un choix
    de style, sans effet sur les performances.

  **Piège classique** : croire qu'un `static final List` est une constante. La référence ne change pas, mais le contenu
  si : n'importe quel code peut y ajouter des éléments.

  **En entretien** : « `final` empêche la réaffectation, pas la modification de l'objet ; une vraie constante est
  `static final` et d'un type immuable. »
cards:
  - key: final-list-rend-immutable
    format: course
    question: '`final List` rend-il immutable ?'
    answer: Non, on peut toujours `add`. Final fige la référence.
  - key: final-locale
    format: course
    question: Que signifie `final` sur une variable locale ?
    answer: Qu'elle ne reçoit sa valeur qu'une seule fois ; toute réaffectation est refusée à la compilation.
  - key: constante
    format: course
    question: Qu'est-ce qu'une constante en Java ?
    answer: |-
      Un champ `static final` d'une valeur immuable (un primitif, une `String`, un objet immuable), nommé en majuscules :
      `public static final double TAUX_TVA = 0.20;`.
  - key: final-sans-valeur
    format: course
    question: Peut-on déclarer une variable `final` sans lui donner de valeur tout de suite ?
    answer: |-
      Oui (*blank final*) : elle doit alors recevoir sa valeur **exactement une fois** avant d'être lue, ce que le
      compilateur vérifie.
  - key: vf-reaffecter
    format: true-false
    question: Une variable `final` peut être réaffectée une seconde fois.
    truth: false
    answer: '`final` interdit justement toute nouvelle affectation.'
  - key: vf-final-liste
    format: true-false
    question: "`final List<String> noms = new ArrayList<>();` empêche d'ajouter des éléments à la liste."
    truth: false
    answer: '`final` fige la référence `noms`, pas la liste : `noms.add("Ada")` fonctionne.'
  - key: vf-majuscules
    format: true-false
    question: Une constante `static final` s'écrit, par convention, en majuscules.
    truth: true
    answer: Par exemple `TAUX_TVA` ou `NOMBRE_MAX_ESSAIS`.
  - key: vf-blank-final
    format: true-false
    question: On peut écrire `final int x;`, puis lui donner sa valeur plus tard, une seule fois.
    truth: true
    answer: Le compilateur vérifie qu'elle est affectée exactement une fois avant d'être lue.
  - key: qcm-reaffectation
    format: multiple-choice
    question: Que se passe-t-il avec `final int max = 10; max = 20;` ?
    choices:
      - text: "Le code ne compile pas"
        correct: true
      - text: "`max` vaut 20"
        correct: false
      - text: "Une exception est levée à l'exécution"
        correct: false
      - text: "`max` reste à 10, sans erreur"
        correct: false
    answer: La réaffectation d'une variable `final` est détectée à la compilation.
  - key: qcm-declarer-constante
    format: multiple-choice
    question: Quelle déclaration correspond à une constante selon les conventions ?
    choices:
      - text: "`public static final double TAUX_TVA = 0.20;`"
        correct: true
      - text: "`public static double TAUX_TVA = 0.20;`"
        correct: false
      - text: "`public final double tauxTva = 0.20;`"
        correct: false
      - text: "`final double TauxTva = 0.20;`"
        correct: false
    answer: '`static` (une seule valeur pour la classe), `final` (non réaffectable) et un nom en majuscules.'
  - key: qcm-final-stringbuilder
    format: multiple-choice
    question: Avec `final StringBuilder sb = new StringBuilder();`, que peut-on faire ?
    choices:
      - text: "`sb.append(\"x\");`"
        correct: true
      - text: "`sb.setLength(0);`"
        correct: true
      - text: "`sb = new StringBuilder();`"
        correct: false
      - text: "`sb = null;`"
        correct: false
    answer: On peut modifier l'objet, mais pas réaffecter la variable.
  - key: qcm-interet-final-local
    format: multiple-choice
    question: Pourquoi marquer `final` une variable locale ?
    choices:
      - text: "Pour empêcher une réaffectation par erreur et montrer l'intention"
        correct: true
      - text: "Pour rendre l'objet qu'elle désigne immuable"
        correct: false
      - text: "Pour accélérer nettement le programme"
        correct: false
      - text: "Pour la rendre visible depuis d'autres classes"
        correct: false
    answer: C'est un outil de lisibilité et de sûreté, sans effet sur l'objet ni sur les performances.
  - key: trous-final
    format: fill-in
    question: |-
      Complétez pour que `MAX_ESSAIS` ne puisse jamais changer :
      ```java
      private static ___ int MAX_ESSAIS = 3;
      ```
    blanks: [[final]]
    answer: '`final` interdit la réaffectation ; avec `static`, c''est une constante de la classe.'
  - key: trous-static
    format: fill-in
    question: |-
      Complétez pour qu'il n'y ait qu'une seule valeur, partagée par toute la classe :
      ```java
      public ___ final double TAUX_TVA = 0.20;
      ```
    blanks: [[static]]
    answer: Sans `static`, chaque objet aurait sa propre copie de la valeur.
  - key: trous-reference-figee
    format: fill-in
    question: |-
      Complétez pour que `noms` désigne toujours la même liste :
      ```java
      ___ List<String> noms = new ArrayList<>();
      ```
    blanks: [[final]]
    answer: '`final` fige la référence ; la liste, elle, reste modifiable.'
  - key: trous-nom-constante
    format: fill-in
    question: |-
      Complétez le nom de la constante « nombre maximal de joueurs », selon les conventions :
      ```java
      static final int ___ = 100;
      ```
    blanks: [[MAX_JOUEURS, NOMBRE_MAX_JOUEURS, NB_MAX_JOUEURS, NOMBRE_MAXIMAL_JOUEURS]]
    answer: En majuscules, mots séparés par des soulignés, par exemple `MAX_JOUEURS`.
  - key: code-final-objet-modifiable
    format: code-output
    question: |-
      ```java
      final StringBuilder sb = new StringBuilder("a");
      sb.append("b");
      System.out.println(sb);
      ```
    answer: '`ab` : `final` n''empêche pas de modifier l''objet.'
    check:
      output: "ab"
  - key: code-final-tableau
    format: code-output
    question: |-
      ```java
      final int[] valeurs = {1, 2};
      valeurs[0] = 5;
      System.out.println(valeurs[0]);
      ```
    answer: '`5` : le tableau reste modifiable, seule la référence `valeurs` est figée.'
    check:
      output: "5"
  - key: code-blank-final
    format: code-output
    question: |-
      ```java
      final int x;
      x = 3;
      System.out.println(x * 2);
      ```
    answer: '`6` : `x` reçoit sa valeur une seule fois, après sa déclaration.'
    check:
      code: |-
        void run() {
            final int x;
            x = 3;
            System.out.println(x * 2);
        }
        run();
      output: "6"
  - key: code-final-liste
    format: code-output
    question: |-
      ```java
      final List<String> noms = new ArrayList<>();
      noms.add("Ada");
      noms.add("Alan");
      System.out.println(noms.size());
      ```
    answer: '`2` : la liste `final` accepte les ajouts.'
    check:
      output: "2"
  - key: bug-reaffecter-final
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot assign a value to final variable total`) :
      ```java
      final int total = 0;
      total = total + 5;
      ```
    answer: |-
      ```java
      int total = 0;
      total = total + 5;
      ```
      Une variable qu'on met à jour ne peut pas être `final`. Si la valeur initiale doit rester, on la range dans une
      autre variable.
  - key: bug-constante-modifiable
    format: bug-fix
    question: |-
      Cette « constante » peut être modifiée par n'importe quel code :
      ```java
      public static double taux_tva = 0.20;
      ```
    answer: |-
      ```java
      public static final double TAUX_TVA = 0.20;
      ```
      Sans `final`, la valeur se réaffecte ; et une constante s'écrit en majuscules.
  - key: bug-liste-constante
    format: bug-fix
    question: |-
      Un appelant a ajouté un jour de fermeture à cette « constante », qui a changé pour tout le programme :
      ```java
      public static final List<String> JOURS_FERMES = new ArrayList<>(List.of("dimanche"));
      ```
    answer: |-
      ```java
      public static final List<String> JOURS_FERMES = List.of("dimanche");
      ```
      `final` fige la référence, pas la liste. `List.of` crée une liste **immuable** : toute tentative d'ajout lève une
      `UnsupportedOperationException`.
  - key: bug-lambda-non-finale
    format: bug-fix
    question: |-
      Ce code ne compile pas (`local variables referenced from a lambda expression must be final or effectively final`) :
      ```java
      int compteur = 0;
      noms.forEach(nom -> compteur++);
      ```
    answer: |-
      ```java
      int compteur = 0;
      for (String nom : noms) {
          compteur++;
      }
      ```
      Une lambda ne peut utiliser qu'une variable locale jamais réaffectée. Une boucle classique le permet ; ici,
      `noms.size()` suffirait d'ailleurs.
