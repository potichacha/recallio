notion: constantes-final
lesson: |-
  `final` interdit de **réaffecter** une variable : elle reçoit sa valeur une seule fois.

  ```java
  final int maxEssais = 3;
  maxEssais = 4;                 // ne compile pas

  final int seuil;               // valeur donnée plus tard, mais une seule fois
  seuil = estPremium ? 100 : 50;
  ```

  Une **constante**, c'est un champ `static final` d'une valeur immuable, nommé en majuscules :

  ```java
  public static final double TAUX_TVA = 0.20;
  ```

  - `final` fige la **variable**, pas l'objet : `final List<String> noms` interdit `noms = autreListe`, mais permet
    `noms.add("Ada")`. Pour une liste qu'on ne peut pas modifier, on crée une liste immuable (`List.of(...)`).
  - Une variable locale jamais réaffectée est **effectivement finale** : c'est ce qu'exige une lambda pour l'utiliser.
  - Mettre `final` sur une variable locale documente l'intention et évite une réaffectation par erreur ; c'est un choix
    de style, sans effet sur les performances.

  **Piège classique** : croire qu'un `static final List` est une constante. La référence ne change pas, mais le contenu
  si : n'importe quel code peut y ajouter des éléments.

  **En entretien** : « `final` empêche la réaffectation, pas la modification de l'objet ; une vraie constante est
  `static final` et d'un type immuable. »
tour:
  - title: final et les constantes
    text: |-
      `final` interdit de réaffecter une variable : sa valeur est fixée une fois pour toutes. Une **constante** est un
      champ `static final`, nommé en majuscules : `static final int JOURS_PAR_SEMAINE = 7;`.

      Attention : `final` fixe la **référence**, pas l'objet. Une liste `final` ne peut pas être remplacée par une
      autre, mais on peut encore y ajouter des éléments. Pour un objet qui ne change pas, il faut un type immuable,
      comme `String` ou une liste créée par `List.of(…)`.
    example:
      files:
        Main.java: |-
          static final int JOURS_PAR_SEMAINE = 7;

          void main() {
              final int semaines = 3;
              IO.println(semaines * JOURS_PAR_SEMAINE);

              final List<String> langages = new ArrayList<>();
              langages.add("Java");
              IO.println(langages);
          }
      output: |-
        21
        [Java]
cards:
  - key: final-list-rend-immutable
    format: course
    question: "`final List` rend-il la liste immuable ?"
    choices:
      - {text: "Non : `final` fige la référence, on peut toujours appeler `add`", correct: true}
      - {text: "Oui : `add` et `remove` lèvent alors une exception", correct: false}
      - {text: "Oui, mais seulement si la liste est un `ArrayList`", correct: false}
      - {text: "Non : `final` n'a aucun effet sur une variable objet", correct: false}
    answer: "Non : `final` fige la **référence** (la variable désignera toujours la même liste), pas la liste, à qui on peut toujours `add`. Pour une liste immuable, on prend `List.of(...)`."
  - key: final-locale
    format: course
    question: "Que signifie `final` sur une variable locale ?"
    choices:
      - {text: "Elle ne reçoit sa valeur qu'une fois : la réaffecter ne compile pas", correct: true}
      - {text: "Elle est partagée par toutes les instances de la classe", correct: false}
      - {text: "Elle garde sa valeur d'un appel de la méthode à l'autre", correct: false}
      - {text: "Elle ne peut plus être lue après sa première utilisation", correct: false}
    answer: "Qu'elle ne reçoit sa valeur qu'une seule fois ; toute réaffectation est refusée à la compilation. Partager une valeur entre instances, c'est le rôle de `static`."
  - key: constante
    format: course
    question: "Qu'est-ce qu'une constante en Java ?"
    choices:
      - {text: "Un champ `static final` d'une valeur immuable, nommé en majuscules", correct: true}
      - {text: "Une variable déclarée avec le mot-clé `const`, comme en C++", correct: false}
      - {text: "Un champ `final` seul, nommé en majuscules, propre à chaque objet", correct: false}
      - {text: "Un champ `static` en majuscules, que la convention interdit de modifier", correct: false}
    answer: "Un champ `static final` d'une valeur immuable (un primitif, une `String`, un objet immuable), nommé en majuscules : `public static final double TAUX_TVA = 0.20;`. `const` est un mot réservé de Java, mais inutilisé."
  - key: final-sans-valeur
    format: course
    question: "Peut-on déclarer une variable `final` sans lui donner de valeur tout de suite ?"
    choices:
      - {text: "Oui : elle doit alors recevoir sa valeur exactement une fois avant d'être lue", correct: true}
      - {text: "Non : une variable `final` s'initialise sur la ligne même de sa déclaration", correct: false}
      - {text: "Oui : elle vaut alors 0 ou `null`, et le restera pour toujours", correct: false}
      - {text: "Oui : on peut alors l'affecter autant de fois qu'on veut avant de la lire", correct: false}
    answer: "Oui (*blank final*) : elle doit alors recevoir sa valeur **exactement une fois** avant d'être lue, ce que le compilateur vérifie."
  - key: vf-reaffecter
    format: true-false
    question: Une variable `final` peut être réaffectée une seconde fois.
    truth: false
    answer: '`final` interdit justement toute nouvelle affectation.'
  - key: vf-final-liste
    format: true-false
    question: "`final List<String> noms = new ArrayList<>();` empêche d'ajouter des éléments à la liste."
    truth: false
    answer: '`final` fige la référence `noms`, pas la liste : `noms.add("Ada")` fonctionne.'
  - key: vf-majuscules
    format: true-false
    question: Une constante `static final` s'écrit, par convention, en majuscules.
    truth: true
    answer: Par exemple `TAUX_TVA` ou `NOMBRE_MAX_ESSAIS`.
  - key: vf-blank-final
    format: true-false
    question: On peut écrire `final int x;`, puis lui donner sa valeur plus tard, une seule fois.
    truth: true
    answer: Le compilateur vérifie qu'elle est affectée exactement une fois avant d'être lue.
  - key: qcm-reaffectation
    format: multiple-choice
    question: Que se passe-t-il avec `final int max = 10; max = 20;` ?
    choices:
      - text: "Le code ne compile pas"
        correct: true
      - text: "`max` vaut 20"
        correct: false
      - text: "Une exception est levée à l'exécution"
        correct: false
      - text: "`max` reste à 10, sans erreur"
        correct: false
    answer: La réaffectation d'une variable `final` est détectée à la compilation.
  - key: qcm-declarer-constante
    format: multiple-choice
    question: Quelle déclaration correspond à une constante selon les conventions ?
    choices:
      - text: "`public static final double TAUX_TVA = 0.20;`"
        correct: true
      - text: "`public static double TAUX_TVA = 0.20;`"
        correct: false
      - text: "`public final double tauxTva = 0.20;`"
        correct: false
      - text: "`final double TauxTva = 0.20;`"
        correct: false
    answer: '`static` (une seule valeur pour la classe), `final` (non réaffectable) et un nom en majuscules.'
  - key: qcm-final-stringbuilder
    format: multiple-choice
    question: "Avec `final StringBuilder sb = new StringBuilder();`, laquelle de ces instructions compile ?"
    choices:
      - {text: "`sb.append(\"x\");`", correct: true}
      - {text: "`sb += \"x\";`", correct: false}
      - {text: "`sb = new StringBuilder();`", correct: false}
      - {text: "`sb = null;`", correct: false}
    answer: "On peut modifier l'objet (`append`, `setLength`), mais pas réaffecter la variable : `sb = ...` est refusé, et `sb += \"x\"` en est une réaffectation déguisée."
  - key: qcm-interet-final-local
    format: multiple-choice
    question: Pourquoi marquer `final` une variable locale ?
    choices:
      - text: "Pour empêcher une réaffectation par erreur et montrer l'intention"
        correct: true
      - text: "Pour rendre l'objet qu'elle désigne immuable"
        correct: false
      - text: "Pour accélérer nettement le programme"
        correct: false
      - text: "Pour la rendre visible depuis d'autres classes"
        correct: false
    answer: C'est un outil de lisibilité et de sûreté, sans effet sur l'objet ni sur les performances.
  - key: trous-final
    format: fill-in
    question: |-
      Complète pour que `MAX_ESSAIS` ne puisse jamais changer :
      ```java
      private static ___ int MAX_ESSAIS = 3;
      ```
    blanks: [[final]]
    answer: '`final` interdit la réaffectation ; avec `static`, c''est une constante de la classe.'
  - key: trous-static
    format: fill-in
    question: |-
      Complète pour qu'il n'y ait qu'une seule valeur, partagée par toute la classe :
      ```java
      public ___ final double TAUX_TVA = 0.20;
      ```
    blanks: [[static]]
    answer: Sans `static`, chaque objet aurait sa propre copie de la valeur.
  - key: trous-reference-figee
    format: fill-in
    question: |-
      Complète pour que `noms` désigne toujours la même liste :
      ```java
      ___ List<String> noms = new ArrayList<>();
      ```
    blanks: [[final]]
    answer: '`final` fige la référence ; la liste, elle, reste modifiable.'
  - key: trous-nom-constante
    format: fill-in
    question: |-
      Complète le nom de la constante « nombre maximal de joueurs », selon les conventions :
      ```java
      static final int ___ = 100;
      ```
    blanks: [[MAX_JOUEURS, NOMBRE_MAX_JOUEURS, NB_MAX_JOUEURS, NOMBRE_MAXIMAL_JOUEURS]]
    answer: En majuscules, mots séparés par des soulignés, par exemple `MAX_JOUEURS`.
  - key: code-final-objet-modifiable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      final StringBuilder sb = new StringBuilder("a");
      sb.append("b");
      System.out.println(sb);
      ```
    choices:
      - {text: "`ab`", correct: true}
      - {text: "`a`", correct: false}
      - {text: "`b`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`ab` : `final` empêche de réaffecter `sb`, pas de modifier l'objet qu'elle désigne."
    check:
      output: "ab"
  - key: code-final-tableau
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      final int[] valeurs = {1, 2};
      valeurs[0] = 5;
      System.out.println(valeurs[0]);
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`5` : le tableau reste modifiable, seule la référence `valeurs` est figée."
    check:
      output: "5"
  - key: code-blank-final
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      final int x;
      x = 3;
      System.out.println(x * 2);
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`6` : `x` reçoit sa valeur une seule fois, après sa déclaration, ce qu'une variable `final` permet."
    check:
      code: |-
        void run() {
            final int x;
            x = 3;
            System.out.println(x * 2);
        }
        run();
      output: "6"
  - key: code-final-liste
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      final List<String> noms = new ArrayList<>();
      noms.add("Ada");
      noms.add("Alan");
      System.out.println(noms.size());
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Une `UnsupportedOperationException`", correct: false}
    answer: "`2` : la liste `final` accepte les ajouts ; `final` fige seulement la référence `noms`."
    check:
      output: "2"
  - key: bug-reaffecter-final
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot assign a value to final variable total`). Quelle correction est la bonne ?
      ```java
      final int total = 0;
      total = total + 5;
      ```
    choices:
      - {text: "Retirer `final` : `int total = 0;`", correct: true}
      - {text: "Écrire `total += 5;` à la place", correct: false}
      - {text: "Déclarer `static final int total = 0;`", correct: false}
      - {text: "Déclarer `final Integer total = 0;`", correct: false}
    answer: |-
      ```java
      int total = 0;
      total = total + 5;
      ```
      Une variable qu'on met à jour ne peut pas être `final`, et `+=` reste une réaffectation. Si la valeur initiale doit rester, on la range dans une autre variable.
  - key: bug-constante-modifiable
    format: bug-fix
    question: |-
      Cette « constante » peut être modifiée par n'importe quel code. Quelle correction est la bonne ?
      ```java
      public static double taux_tva = 0.20;
      ```
    choices:
      - {text: "`public static final double TAUX_TVA = 0.20;`", correct: true}
      - {text: "`public static double TAUX_TVA = 0.20;`", correct: false}
      - {text: "`public static const double TAUX_TVA = 0.20;`", correct: false}
      - {text: "`public static volatile double TAUX_TVA = 0.20;`", correct: false}
    answer: |-
      ```java
      public static final double TAUX_TVA = 0.20;
      ```
      Sans `final`, la valeur se réaffecte, même écrite en majuscules ; et une constante s'écrit en majuscules. `const` est réservé, mais ne compile pas.
  - key: bug-liste-constante
    format: bug-fix
    question: |-
      Un appelant a ajouté un jour de fermeture à cette « constante », qui a changé pour tout le programme. Quelle correction est la bonne ?
      ```java
      public static final List<String> JOURS_FERMES = new ArrayList<>(List.of("dimanche"));
      ```
    choices:
      - {text: "Créer la liste avec `List.of(\"dimanche\")`, qui est immuable", correct: true}
      - {text: "Remplacer `ArrayList` par `LinkedList`, plus sûre à partager", correct: false}
      - {text: "Copier la liste dans un `new ArrayList<>(...)` à chaque lecture", correct: false}
      - {text: "Rendre le champ `volatile`, pour que personne ne le modifie", correct: false}
    answer: |-
      ```java
      public static final List<String> JOURS_FERMES = List.of("dimanche");
      ```
      `final` fige la référence, pas la liste. `List.of` crée une liste **immuable** : toute tentative d'ajout lève une `UnsupportedOperationException`.
  - key: bug-lambda-non-finale
    format: bug-fix
    question: |-
      Ce code ne compile pas (`local variables referenced from a lambda expression must be final or effectively final`). Quelle correction est la bonne ?
      ```java
      int compteur = 0;
      noms.forEach(nom -> compteur++);
      ```
    choices:
      - {text: "Une boucle for-each, qui peut modifier `compteur`", correct: true}
      - {text: "Déclarer la variable `final int compteur = 0;`", correct: false}
      - {text: "Écrire `++compteur` au lieu de `compteur++`", correct: false}
      - {text: "Déclarer la variable `var compteur = 0;`", correct: false}
    answer: |-
      ```java
      int compteur = 0;
      for (String nom : noms) {
          compteur++;
      }
      ```
      Une lambda ne peut utiliser qu'une variable locale jamais réaffectée ; la déclarer `final` interdirait justement `compteur++`. Une boucle classique le permet ; ici, `noms.size()` suffirait d'ailleurs.
