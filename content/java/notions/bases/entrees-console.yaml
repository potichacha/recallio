notion: entrees-console
lesson: |-
  Un programme lit le clavier par **`System.in`**, l'entrée standard. Deux outils courants :

  ```java
  Scanner scanner = new Scanner(System.in);
  System.out.print("Votre âge : ");
  int age = scanner.nextInt();             // lit un entier
  scanner.nextLine();                      // consomme la fin de ligne restante
  String nom = scanner.nextLine();         // lit toute une ligne

  BufferedReader lecteur = new BufferedReader(new InputStreamReader(System.in));
  String ligne = lecteur.readLine();       // null en fin d'entrée
  ```

  - **`Scanner`** découpe l'entrée en éléments (`nextInt`, `nextDouble`, `next`, `nextLine`) : pratique pour de petits
    programmes. Il lève `InputMismatchException` si le texte ne correspond pas au type demandé.
  - **`BufferedReader`** lit ligne par ligne, plus vite ; c'est le choix pour de gros volumes. `readLine()` renvoie
    `null` à la fin de l'entrée.
  - `hasNextInt()` vérifie avant de lire, pour redemander une saisie invalide.
  - On ne ferme pas un `Scanner` sur `System.in` qu'on réutilisera : le fermer ferme aussi `System.in`.

  **Piège classique** : `nextInt()` suivi de `nextLine()`. `nextInt` laisse la fin de ligne dans le tampon :
  `nextLine` la lit aussitôt et renvoie une chaîne vide. On ajoute un `nextLine()` pour la consommer.

  **En entretien** : « `Scanner` pour découper une saisie simple, `BufferedReader` pour lire beaucoup de lignes ; et
  attention à la fin de ligne laissée par `nextInt`. »
tour:
  - title: Lire des entrées
    text: |-
      `System.in` est l'entrée standard, un flux d'octets. Pour lire du texte, on l'enveloppe : `new Scanner(System.in)`
      découpe en mots et en nombres (`next`, `nextInt`, `nextLine`), et un `BufferedReader` lit ligne par ligne, plus
      vite. Java 25 ajoute `IO.readln`, qui affiche une question et lit la réponse.

      Le bac à sable n'a pas d'entrée standard : ce programme donne donc à `Scanner` une chaîne, qui se lit exactement
      comme le clavier.
    example:
      files:
        Main.java: |-
          void main() {
              Scanner sc = new Scanner("Ada 36\nGrace 85\n");
              while (sc.hasNext()) {
                  String nom = sc.next();
                  int age = sc.nextInt();
                  IO.println(nom + " a " + age + " ans");
              }
          }
      output: |-
        Ada a 36 ans
        Grace a 85 ans
cards:
  - key: lire-un-entier
    format: course
    question: Comment lire un entier tapé au clavier ?
    answer: "Avec un `Scanner` sur `System.in` : `int n = new Scanner(System.in).nextInt();`."
  - key: next-vs-next-line
    format: course
    question: Quelle différence entre `next()` et `nextLine()` d'un `Scanner` ?
    answer: '`next()` lit un mot (jusqu''à un espace) ; `nextLine()` lit toute la ligne, espaces compris.'
  - key: piege-next-int
    format: course
    question: Pourquoi `nextLine()` renvoie-t-il une chaîne vide juste après `nextInt()` ?
    answer: |-
      `nextInt()` lit le nombre mais laisse la fin de ligne dans le tampon ; `nextLine()` la lit aussitôt. On appelle
      un `nextLine()` de plus pour la consommer.
  - key: scanner-ou-buffered
    format: course
    question: Quand préférer `BufferedReader` à `Scanner` ?
    answer: "Pour lire beaucoup de lignes rapidement : `Scanner` découpe et analyse chaque élément, ce qui le rend plus lent."
  - key: vf-system-in
    format: true-false
    question: "`System.in` représente l'entrée standard, le clavier par défaut."
    truth: true
    answer: Elle peut aussi venir d'un fichier ou d'un autre programme, par redirection.
  - key: vf-read-line-null
    format: true-false
    question: "`BufferedReader.readLine()` renvoie `null` à la fin de l'entrée."
    truth: true
    answer: C'est ainsi qu'on détecte qu'il n'y a plus rien à lire.
  - key: vf-input-mismatch
    format: true-false
    question: "`nextInt()` sur la saisie « abc » renvoie 0."
    truth: false
    answer: Il lève une `InputMismatchException` ; `hasNextInt()` permet de vérifier avant.
  - key: vf-fermer-scanner
    format: true-false
    question: Fermer un `Scanner` sur `System.in` ferme aussi `System.in`.
    truth: true
    answer: On ne pourra plus lire le clavier ensuite ; on garde un seul `Scanner` pour tout le programme.
  - key: qcm-lire-ligne
    format: multiple-choice
    question: Quelle méthode lit « Ada Lovelace » en entier ?
    choices:
      - text: "`scanner.nextLine()`"
        correct: true
      - text: "`scanner.next()`"
        correct: false
      - text: "`scanner.nextInt()`"
        correct: false
      - text: "`scanner.hasNext()`"
        correct: false
    answer: '`next()` s''arrêterait à l''espace et renverrait « Ada ».'
  - key: qcm-verifier
    format: multiple-choice
    question: Comment savoir si la prochaine saisie est un entier, avant de la lire ?
    choices:
      - text: "`scanner.hasNextInt()`"
        correct: true
      - text: "`scanner.isInt()`"
        correct: false
      - text: "`scanner.nextInt() != null`"
        correct: false
      - text: "Avec un `try` autour de `parseInt` seulement"
        correct: false
    answer: '`hasNextInt()` regarde sans consommer.'
  - key: qcm-fin-entree
    format: multiple-choice
    question: Comment lire toutes les lignes jusqu'à la fin de l'entrée avec un `BufferedReader` ?
    choices:
      - text: "`while ((ligne = lecteur.readLine()) != null)`"
        correct: true
      - text: "`while (lecteur.hasNextLine())`"
        correct: false
      - text: "`for (String ligne : lecteur)`"
        correct: false
      - text: "`while (!lecteur.readLine().isEmpty())`"
        correct: false
    answer: '`readLine()` renvoie `null` à la fin ; `hasNextLine` est une méthode de `Scanner`.'
  - key: qcm-exception
    format: multiple-choice
    question: Quelle exception lève `nextInt()` quand l'utilisateur tape « douze » ?
    choices:
      - text: "`InputMismatchException`"
        correct: true
      - text: "`NumberFormatException`"
        correct: false
      - text: "`NullPointerException`"
        correct: false
      - text: "Aucune, il renvoie -1"
        correct: false
    answer: '`NumberFormatException` est celle de `Integer.parseInt`.'
  - key: code-scanner-chaine
    format: code-output
    question: |-
      ```java
      Scanner s = new Scanner("12 Ada");
      int n = s.nextInt();
      String nom = s.next();
      System.out.println(nom + " " + (n + 1));
      ```
    answer: '`Ada 13` : `nextInt` lit 12, `next` lit le mot suivant.'
    check:
      output: "Ada 13"
  - key: code-piege-next-line
    format: code-output
    question: |-
      ```java
      Scanner s = new Scanner("42\nAda\n");
      int age = s.nextInt();
      String nom = s.nextLine();
      System.out.println("[" + nom + "]");
      ```
    answer: '`[]` : `nextLine` lit la fin de ligne laissée par `nextInt`, et renvoie une chaîne vide.'
    check:
      output: "[]"
  - key: code-has-next-int
    format: code-output
    question: |-
      ```java
      Scanner s = new Scanner("abc 7");
      System.out.println(s.hasNextInt());
      s.next();
      System.out.println(s.hasNextInt());
      ```
    answer: |-
      ```
      false
      true
      ```
      « abc » n'est pas un entier ; une fois sauté, « 7 » l'est.
    check:
      output: |-
        false
        true
  - key: code-input-mismatch
    format: code-output
    question: |-
      ```java
      Scanner s = new Scanner("douze");
      int n = s.nextInt();
      ```
    answer: "Une `InputMismatchException` : « douze » n'est pas un entier."
    check:
      throws: InputMismatchException
  - key: bug-next-line-vide
    format: bug-fix
    question: |-
      Le nom lu est toujours vide :
      ```java
      int age = scanner.nextInt();
      String nom = scanner.nextLine();
      ```
    answer: |-
      ```java
      int age = scanner.nextInt();
      scanner.nextLine();
      String nom = scanner.nextLine();
      ```
      Le premier `nextLine()` consomme la fin de ligne laissée par `nextInt()`.
  - key: bug-saisie-invalide
    format: bug-fix
    question: |-
      Le programme plante si l'utilisateur tape des lettres :
      ```java
      int quantite = scanner.nextInt();
      ```
    answer: |-
      ```java
      while (!scanner.hasNextInt()) {
          System.out.println("Entrez un nombre :");
          scanner.next();
      }
      int quantite = scanner.nextInt();
      ```
      On vérifie avec `hasNextInt()`, et on jette la saisie invalide avant de redemander.
  - key: bug-scanner-ferme
    format: bug-fix
    question: |-
      La seconde lecture lève une `NoSuchElementException` :
      ```java
      static String lire() {
          try (Scanner s = new Scanner(System.in)) {
              return s.nextLine();
          }
      }
      String a = lire();
      String b = lire();
      ```
    answer: |-
      ```java
      private static final Scanner CLAVIER = new Scanner(System.in);

      static String lire() {
          return CLAVIER.nextLine();
      }
      ```
      Fermer le `Scanner` fermait `System.in` : la seconde lecture ne trouve plus rien. On garde un seul `Scanner` ouvert.
  - key: bug-gros-volume
    format: bug-fix
    question: |-
      Ce programme met plusieurs secondes à lire un million de lignes :
      ```java
      Scanner s = new Scanner(System.in);
      while (s.hasNextLine()) {
          traiter(s.nextLine());
      }
      ```
    answer: |-
      ```java
      BufferedReader lecteur = new BufferedReader(new InputStreamReader(System.in));
      String ligne;
      while ((ligne = lecteur.readLine()) != null) {
          traiter(ligne);
      }
      ```
      `BufferedReader` lit ligne par ligne sans l'analyse de `Scanner`, nettement plus vite sur de gros volumes.
