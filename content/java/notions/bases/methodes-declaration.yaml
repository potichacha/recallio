notion: methodes-declaration
lesson: |-
  Une **méthode** nomme un traitement réutilisable : elle reçoit des **paramètres** et peut **renvoyer** un résultat.

  ```java
  static double prixTtc(double prixHt, double taux) {   // type de retour, nom, paramètres
      return prixHt * (1 + taux);                        // return renvoie la valeur et sort
  }

  double prix = prixTtc(100, 0.2);                       // appel : 120.0
  ```

  - Le **type de retour** est écrit avant le nom ; `void` signifie « ne renvoie rien ».
  - Une méthode non `void` doit **renvoyer une valeur sur tous les chemins** ; sinon, le compilateur refuse
    (`missing return statement`).
  - `return` **sort immédiatement** de la méthode : le code qui le suit dans le même bloc n'est jamais exécuté.
  - À l'appel, on passe des **arguments** dans l'ordre et du type des paramètres.
  - Une bonne méthode fait **une seule chose**, porte un nom qui la décrit (souvent un verbe), et reste courte.

  **Piège classique** : appeler une méthode qui renvoie une valeur sans l'utiliser, comme `texte.trim();` seul. La
  chaîne nettoyée est perdue : il faut `texte = texte.trim();`.

  **En entretien** : « Une méthode a une signature (nom et types des paramètres), un type de retour, et ne fait qu'une
  chose ; `return` renvoie la valeur et sort. »
tour:
  - title: Les méthodes
    text: |-
      Une méthode déclare son type de retour, son nom et ses paramètres : `int carre(int x) { return x * x; }`. `void`
      indique qu'elle ne renvoie rien. Une méthode renvoie **une seule** valeur ; pour en renvoyer plusieurs, on renvoie
      un objet, souvent un record.

      Dans un fichier compact, les méthodes s'écrivent directement à côté de `main`. Dans une classe, ce sont ses
      membres.
    example:
      files:
        Main.java: |-
          int carre(int x) {
              return x * x;
          }

          record Division(int quotient, int reste) {}

          Division divise(int a, int b) {
              return new Division(a / b, a % b);
          }

          void affiche(String message) {
              IO.println("> " + message);
          }

          void main() {
              affiche("carré de 7 : " + carre(7));
              Division d = divise(17, 5);
              affiche(d.quotient() + " reste " + d.reste());
          }
      output: |-
        > carré de 7 : 49
        > 3 reste 2
    task:
      instructions: |-
        Complète `max3`, qui renvoie le plus grand de ses trois arguments (`Math.max` peut aider) : le programme doit
        afficher `9`.
      starter:
        Main.java: |-
          int max3(int a, int b, int c) {
              return a;
          }

          void main() {
              IO.println(max3(4, 9, 2));
          }
      solution:
        Main.java: |-
          int max3(int a, int b, int c) {
              return Math.max(a, Math.max(b, c));
          }

          void main() {
              IO.println(max3(4, 9, 2));
          }
      output: |-
        9
cards:
  - key: anatomie
    format: course
    question: Quelles sont les parties de la déclaration `static int carre(int n) { return n * n; }` ?
    answer: '`static` (modificateur), `int` (type de retour), `carre` (nom), `int n` (paramètre), et le corps entre accolades, avec `return`.'
  - key: void
    format: course
    question: Que signifie `void` comme type de retour ?
    answer: Que la méthode ne renvoie rien ; on l'appelle pour son effet (afficher, modifier un objet...).
  - key: return-sort
    format: course
    question: Que fait `return` ?
    answer: Il renvoie la valeur (si la méthode n'est pas `void`) et **sort immédiatement** de la méthode.
  - key: parametre-argument
    format: course
    question: Quelle différence entre un paramètre et un argument ?
    answer: Le **paramètre** est la variable déclarée dans la signature (`int n`) ; l'**argument** est la valeur passée à l'appel (`carre(5)`).
  - key: vf-return-obligatoire
    format: true-false
    question: Une méthode `int` peut se terminer sans `return` sur certains chemins.
    truth: false
    answer: Tous les chemins doivent renvoyer une valeur ; sinon, `missing return statement`.
  - key: vf-void-return
    format: true-false
    question: "Une méthode `void` peut contenir `return;` pour sortir plus tôt."
    truth: true
    answer: '`return;` sans valeur sort de la méthode.'
  - key: vf-apres-return
    format: true-false
    question: Les instructions écrites juste après un `return`, dans le même bloc, s'exécutent quand même.
    truth: false
    answer: Le compilateur les refuse même (`unreachable statement`).
  - key: vf-ignorer-retour
    format: true-false
    question: On peut appeler une méthode qui renvoie une valeur sans utiliser cette valeur.
    truth: true
    answer: C'est permis, mais souvent un bug (`texte.trim();` seul ne change rien).
  - key: qcm-signature
    format: multiple-choice
    question: Quelle déclaration correspond à « prend deux entiers, renvoie leur somme » ?
    choices:
      - text: "`static int somme(int a, int b)`"
        correct: true
      - text: "`static void somme(int a, int b)`"
        correct: false
      - text: "`static int somme(int a, b)`"
        correct: false
      - text: "`static somme(int a, int b) int`"
        correct: false
    answer: Le type de retour avant le nom, et un type pour chaque paramètre.
  - key: qcm-appel
    format: multiple-choice
    question: Avec `static double moyenne(double a, double b)`, quel appel compile ?
    choices:
      - text: "`double m = moyenne(12, 15);`"
        correct: true
      - text: "`double m = moyenne(12);`"
        correct: false
      - text: "`moyenne m = (12, 15);`"
        correct: false
      - text: "`double m = moyenne(\"12\", \"15\");`"
        correct: false
    answer: Deux arguments numériques ; les `int` sont convertis en `double`.
  - key: qcm-missing-return
    format: multiple-choice
    question: "Pourquoi `static int signe(int n) { if (n > 0) return 1; if (n < 0) return -1; }` ne compile-t-il pas ?"
    choices:
      - text: "Quand n vaut 0, aucun `return` n'est atteint"
        correct: true
      - text: "On ne peut pas avoir deux `return`"
        correct: false
      - text: "`signe` est un mot réservé"
        correct: false
      - text: "Il manque `void`"
        correct: false
    answer: Il faut un `return 0;` final pour couvrir le dernier cas.
  - key: qcm-bonne-methode
    format: multiple-choice
    question: Quel nom convient le mieux à une méthode qui calcule le total d'un panier ?
    choices:
      - text: "`calculerTotal`"
        correct: true
      - text: "`total2`"
        correct: false
      - text: "`faireTout`"
        correct: false
      - text: "`CalculerTotal`"
        correct: false
    answer: Un verbe en camelCase qui dit ce que fait la méthode.
  - key: trous-retour
    format: fill-in
    question: |-
      Complétez :
      ```java
      static int carre(int n) {
          ___ n * n;
      }
      ```
    blanks: [[return]]
    answer: '`return` renvoie la valeur calculée.'
  - key: trous-type-retour
    format: fill-in
    question: |-
      Complétez le type de retour d'une méthode qui ne renvoie rien :
      ```java
      static ___ afficher(String message) {
          System.out.println(message);
      }
      ```
    blanks: [[void]]
    answer: '`void` : la méthode agit sans renvoyer de valeur.'
  - key: trous-parametres
    format: fill-in
    question: |-
      Complétez les paramètres :
      ```java
      static boolean estEntre(int x, ___ min, int ___) {
          return x >= min && x <= max;
      }
      ```
    blanks: [[int], [max]]
    answer: Chaque paramètre a son type et son nom.
  - key: trous-utiliser-retour
    format: fill-in
    question: |-
      Complétez pour garder la chaîne nettoyée :
      ```java
      saisie ___ saisie.trim();
      ```
    blanks: [["="]]
    answer: '`trim` renvoie une nouvelle chaîne ; il faut la ranger.'
  - key: code-appel
    format: code-output
    question: |-
      ```java
      static int carre(int n) {
          return n * n;
      }
      System.out.println(carre(3) + carre(4));
      ```
    answer: '`25` : 9 + 16.'
    check:
      output: "25"
  - key: code-return-sort
    format: code-output
    question: |-
      ```java
      static String classer(int n) {
          if (n < 0) {
              return "négatif";
          }
          return "positif ou nul";
      }
      System.out.println(classer(-3));
      ```
    answer: '`négatif` : le premier `return` sort de la méthode.'
    check:
      output: "négatif"
  - key: code-retour-ignore
    format: code-output
    question: |-
      ```java
      String s = "  java  ";
      s.trim();
      System.out.println("[" + s + "]");
      ```
    answer: '`[  java  ]` : le résultat de `trim()` n''a pas été rangé ; `s` est inchangée.'
    check:
      output: "[  java  ]"
  - key: code-void
    format: code-output
    question: |-
      ```java
      static void saluer(String nom) {
          if (nom.isBlank()) {
              return;
          }
          System.out.println("Bonjour " + nom);
      }
      saluer("");
      saluer("Ada");
      ```
    answer: '`Bonjour Ada` : le premier appel sort tout de suite par `return;`.'
    check:
      output: "Bonjour Ada"
  - key: bug-missing-return
    format: bug-fix
    question: |-
      Ce code ne compile pas (`missing return statement`) :
      ```java
      static String mention(int note) {
          if (note >= 10) {
              return "Admis";
          }
      }
      ```
    answer: |-
      ```java
      static String mention(int note) {
          if (note >= 10) {
              return "Admis";
          }
          return "Ajourné";
      }
      ```
      Tous les chemins doivent renvoyer une valeur.
  - key: bug-retour-perdu
    format: bug-fix
    question: |-
      La saisie garde ses majuscules :
      ```java
      String saisie = lire();
      saisie.toLowerCase();
      chercher(saisie);
      ```
    answer: |-
      ```java
      saisie = saisie.toLowerCase();
      ```
      Les `String` sont immuables : `toLowerCase` renvoie une nouvelle chaîne, qu'il faut ranger.
  - key: bug-void-utilise
    format: bug-fix
    question: |-
      Ce code ne compile pas (`void type not allowed here`) :
      ```java
      static void calculerTotal(double[] prix) {
          double total = 0;
          for (double p : prix) total += p;
      }
      double t = calculerTotal(prix);
      ```
    answer: |-
      ```java
      static double calculerTotal(double[] prix) {
          double total = 0;
          for (double p : prix) total += p;
          return total;
      }
      ```
      Une méthode `void` ne renvoie rien : pour utiliser le total, il faut le renvoyer.
  - key: bug-code-inatteignable
    format: bug-fix
    question: |-
      Ce code ne compile pas (`unreachable statement`) :
      ```java
      static int doubler(int n) {
          return n * 2;
          System.out.println("doublé");
      }
      ```
    answer: |-
      ```java
      static int doubler(int n) {
          System.out.println("doublé");
          return n * 2;
      }
      ```
      Rien ne s'exécute après `return` : le compilateur refuse le code qui suit.
