notion: passage-par-valeur
lesson: |-
  Java passe **toujours** les arguments **par valeur** : la méthode reçoit une **copie** de ce qu'on lui passe.

  - Pour un **primitif**, c'est une copie du nombre : la méthode ne peut pas modifier la variable de l'appelant.
  - Pour un **objet**, c'est une copie de la **référence** : la méthode désigne **le même objet**, et peut donc le
    **modifier** ; mais si elle **réaffecte** son paramètre, l'appelant n'en voit rien.

  ```java
  static void modifier(int n, StringBuilder sb, StringBuilder autre) {
      n = 99;                    // copie locale : l'appelant ne voit rien
      sb.append("!");            // même objet : l'appelant voit le changement
      autre = new StringBuilder("neuf");   // réaffectation locale : l'appelant ne voit rien
  }
  ```

  Conséquence : on ne peut pas écrire en Java une méthode `echanger(a, b)` qui échange deux variables de l'appelant.

  **Piège classique** : croire que Java passe les objets « par référence ». Une méthode qui fait `liste = new
  ArrayList<>()` ne vide pas la liste de l'appelant ; `liste.clear()`, si.

  **En entretien** : « Java passe tout par valeur ; pour un objet, la valeur est une référence : la méthode peut
  modifier l'objet, pas la variable de l'appelant. »
cards:
  - key: java-passe-valeur-reference
    format: course
    question: Java passe par valeur ou référence ?
    answer: Toujours par valeur ; pour un objet, c'est la référence qui est copiée.
  - key: primitif-copie
    format: course
    question: Une méthode peut-elle modifier un `int` passé en argument ?
    answer: "Non : elle reçoit une copie de la valeur ; la variable de l'appelant reste inchangée."
  - key: objet-modifiable
    format: course
    question: Une méthode peut-elle modifier un objet passé en argument ?
    answer: |-
      Oui : elle reçoit une copie de la référence, qui désigne le même objet. Elle peut donc changer son contenu (`liste.add`,
      `sb.append`).
  - key: reaffectation
    format: course
    question: Si une méthode réaffecte son paramètre objet (`p = new Point()`), l'appelant voit-il le changement ?
    answer: "Non : seule la copie locale de la référence change ; la variable de l'appelant désigne toujours l'ancien objet."
  - key: vf-par-reference
    format: true-false
    question: Java passe les objets par référence.
    truth: false
    answer: Il passe par valeur une copie de la référence ; c'est différent, comme le montre la réaffectation.
  - key: vf-int-modifie
    format: true-false
    question: Après l'appel `incrementer(x)`, où la méthode fait `n++`, la variable `x` de l'appelant a augmenté.
    truth: false
    answer: '`n` est une copie de `x` ; il faudrait renvoyer la nouvelle valeur : `x = incrementer(x);`.'
  - key: vf-liste-modifiee
    format: true-false
    question: Une méthode qui appelle `liste.add("x")` sur son paramètre modifie la liste de l'appelant.
    truth: true
    answer: Les deux références désignent la même liste.
  - key: vf-echanger
    format: true-false
    question: On peut écrire en Java une méthode `echanger(int a, int b)` qui échange deux variables de l'appelant.
    truth: false
    answer: La méthode n'échange que ses copies. Il faut passer un objet ou un tableau qui contient les valeurs, ou renvoyer un résultat.
  - key: qcm-ce-qui-change
    format: multiple-choice
    question: "La méthode `m(StringBuilder sb)` fait `sb.append(\"b\"); sb = new StringBuilder(\"z\");`. L'appelant avait `sb = \"a\"`. Que contient son `sb` ?"
    choices:
      - text: "\"ab\""
        correct: true
      - text: "\"a\""
        correct: false
      - text: "\"z\""
        correct: false
      - text: "\"zb\""
        correct: false
    answer: L'ajout touche l'objet partagé ; la réaffectation ne change que la copie locale.
  - key: qcm-renvoyer
    format: multiple-choice
    question: Comment une méthode peut-elle « modifier » un `int` de l'appelant ?
    choices:
      - text: "En renvoyant la nouvelle valeur, que l'appelant range"
        correct: true
      - text: "En réaffectant son paramètre"
        correct: false
      - text: "En le déclarant `final`"
        correct: false
      - text: "Avec le mot-clé `ref`"
        correct: false
    answer: "Java n'a pas de passage par référence (`ref` vient de C#) : on renvoie la valeur."
  - key: qcm-vider
    format: multiple-choice
    question: Quelle instruction, dans une méthode qui reçoit `List<String> liste`, vide la liste de l'appelant ?
    choices:
      - text: "`liste.clear();`"
        correct: true
      - text: "`liste = new ArrayList<>();`"
        correct: false
      - text: "`liste = null;`"
        correct: false
      - text: "`liste = List.of();`"
        correct: false
    answer: Seul `clear()` agit sur l'objet partagé ; les autres réaffectent la copie locale.
  - key: qcm-tableau
    format: multiple-choice
    question: Une méthode reçoit `int[] t` et fait `t[0] = 7;`. Que voit l'appelant ?
    choices:
      - text: "Son tableau a 7 en première case"
        correct: true
      - text: "Rien ne change"
        correct: false
      - text: "Une exception"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: "Un tableau est un objet : la méthode écrit dans le même tableau."
  - key: code-primitif
    format: code-output
    question: |-
      ```java
      static void incrementer(int n) {
          n++;
      }
      int x = 5;
      incrementer(x);
      System.out.println(x);
      ```
    answer: '`5` : la méthode a incrémenté sa copie.'
    check:
      code: |-
        static void incrementer(int n) {
            n++;
        }
        void run() {
            int x = 5;
            incrementer(x);
            System.out.println(x);
        }
        run();
      output: "5"
  - key: code-objet-modifie
    format: code-output
    question: |-
      ```java
      static void ajouter(List<String> l) {
          l.add("b");
      }
      List<String> liste = new ArrayList<>(List.of("a"));
      ajouter(liste);
      System.out.println(liste);
      ```
    answer: '`[a, b]` : la méthode a modifié la même liste.'
    check:
      output: "[a, b]"
  - key: code-reaffectation
    format: code-output
    question: |-
      ```java
      static void remplacer(StringBuilder sb) {
          sb = new StringBuilder("neuf");
      }
      StringBuilder s = new StringBuilder("ancien");
      remplacer(s);
      System.out.println(s);
      ```
    answer: '`ancien` : la réaffectation ne change que la copie locale de la référence.'
    check:
      output: "ancien"
  - key: code-mixte
    format: code-output
    question: |-
      ```java
      static void m(StringBuilder sb) {
          sb.append("b");
          sb = new StringBuilder("z");
          sb.append("y");
      }
      StringBuilder s = new StringBuilder("a");
      m(s);
      System.out.println(s);
      ```
    answer: '`ab` : le premier ajout touche l''objet partagé ; ensuite, `sb` désigne un autre objet.'
    check:
      output: "ab"
  - key: bug-incrementer
    format: bug-fix
    question: |-
      Le score ne change jamais :
      ```java
      static void ajouterPoints(int score, int points) {
          score = score + points;
      }
      ajouterPoints(score, 10);
      ```
    answer: |-
      ```java
      static int ajouterPoints(int score, int points) {
          return score + points;
      }
      score = ajouterPoints(score, 10);
      ```
      La méthode modifiait sa copie ; on renvoie la nouvelle valeur.
  - key: bug-vider-liste
    format: bug-fix
    question: |-
      Après l'appel, le panier n'est pas vidé :
      ```java
      static void vider(List<Article> panier) {
          panier = new ArrayList<>();
      }
      ```
    answer: |-
      ```java
      static void vider(List<Article> panier) {
          panier.clear();
      }
      ```
      Réaffecter le paramètre ne touche pas la liste de l'appelant ; `clear()` agit sur l'objet partagé.
  - key: bug-echanger
    format: bug-fix
    question: |-
      Ces deux variables ne sont jamais échangées :
      ```java
      static void echanger(int a, int b) {
          int tmp = a;
          a = b;
          b = tmp;
      }
      echanger(x, y);
      ```
    answer: |-
      ```java
      static void echanger(int[] t, int i, int j) {
          int tmp = t[i];
          t[i] = t[j];
          t[j] = tmp;
      }
      ```
      La méthode n'échange que ses copies. On échange des cases d'un tableau (un objet partagé), ou on fait l'échange
      sur place, sans méthode.
  - key: bug-modification-surprise
    format: bug-fix
    question: |-
      Après l'appel, la liste de l'appelant a été triée sans qu'il le veuille :
      ```java
      static String plusPetit(List<String> noms) {
          Collections.sort(noms);
          return noms.get(0);
      }
      ```
    answer: |-
      ```java
      static String plusPetit(List<String> noms) {
          return Collections.min(noms);
      }
      ```
      La méthode modifiait l'objet de l'appelant. On évite de modifier un paramètre ; ici, `Collections.min` ne touche
      pas la liste.
