notion: passage-par-valeur
lesson: |-
  Java passe **toujours** les arguments **par valeur** : la méthode reçoit une **copie** de ce qu'on lui passe.

  - Pour un **primitif**, c'est une copie du nombre : la méthode ne peut pas modifier la variable de l'appelant.
  - Pour un **objet**, c'est une copie de la **référence** : la méthode désigne **le même objet**, et peut donc le
    **modifier** ; mais si elle **réaffecte** son paramètre, l'appelant n'en voit rien.

  ```java
  static void modifier(int n, StringBuilder sb, StringBuilder autre) {
      n = 99;                    // copie locale : l'appelant ne voit rien
      sb.append("!");            // même objet : l'appelant voit le changement
      autre = new StringBuilder("neuf");   // réaffectation locale : l'appelant ne voit rien
  }
  ```

  Conséquence : on ne peut pas écrire en Java une méthode `echanger(a, b)` qui échange deux variables de l'appelant.

  **Piège classique** : croire que Java passe les objets « par référence ». Une méthode qui fait `liste = new
  ArrayList<>()` ne vide pas la liste de l'appelant ; `liste.clear()`, si.

  **En entretien** : « Java passe tout par valeur ; pour un objet, la valeur est une référence : la méthode peut
  modifier l'objet, pas la variable de l'appelant. »
tour:
  - title: Le passage par valeur
    text: |-
      Java passe **toujours** les arguments par valeur : la méthode reçoit une copie. Pour un primitif, c'est une copie
      du nombre, et la modifier ne change rien chez l'appelant.

      Pour un objet, c'est une copie de la **référence** : la méthode peut modifier l'objet désigné, et l'appelant le
      voit. Mais si elle affecte un nouvel objet à son paramètre, l'appelant garde l'ancien.
    example:
      files:
        Main.java: |-
          void incremente(int n) {
              n++;
          }

          void ajoute(List<String> liste) {
              liste.add("ajouté");
          }

          void remplace(List<String> liste) {
              liste = new ArrayList<>();
              liste.add("perdu");
          }

          void main() {
              int x = 1;
              incremente(x);
              IO.println(x);

              List<String> liste = new ArrayList<>();
              ajoute(liste);
              remplace(liste);
              IO.println(liste);
          }
      output: |-
        1
        [ajouté]
cards:
  - key: java-passe-valeur-reference
    format: course
    question: "Java passe-t-il les arguments par valeur ou par référence ?"
    choices:
      - {text: "Toujours par valeur ; pour un objet, c'est la référence qui est copiée", correct: true}
      - {text: "Par valeur pour les primitifs, par référence pour les objets", correct: false}
      - {text: "Toujours par référence ; un primitif est d'abord emballé dans son wrapper", correct: false}
      - {text: "Par référence pour les objets modifiables, par valeur pour `String`", correct: false}
    answer: |-
      Toujours par valeur ; pour un objet, c'est la référence qui est copiée. La méthode peut modifier l'objet désigné,
      mais réaffecter son paramètre ne change pas la variable de l'appelant : ce n'est pas un passage par référence.
  - key: primitif-copie
    format: course
    question: Une méthode peut-elle modifier un `int` passé en argument ?
    choices:
      - {text: "Non : elle reçoit une copie, et la variable de l'appelant reste inchangée", correct: true}
      - {text: "Oui : le paramètre et la variable de l'appelant sont la même case", correct: false}
      - {text: "Oui, tant que le paramètre n'est pas déclaré `final`", correct: false}
      - {text: "Oui, si on déclare le paramètre `Integer` au lieu d'`int`", correct: false}
    answer: "Non : elle reçoit une copie de la valeur ; la variable de l'appelant reste inchangée."
  - key: objet-modifiable
    format: course
    question: Une méthode peut-elle modifier un objet passé en argument ?
    choices:
      - {text: "Oui : elle reçoit une copie de la référence, qui désigne le même objet", correct: true}
      - {text: "Non : elle reçoit une copie de l'objet entier, qu'elle modifie seule", correct: false}
      - {text: "Non : un objet passé en argument devient en lecture seule", correct: false}
      - {text: "Oui, mais seulement si la méthode renvoie ensuite l'objet modifié", correct: false}
    answer: |-
      Oui : elle reçoit une copie de la référence, qui désigne le même objet. Elle peut donc changer son contenu (`liste.add`,
      `sb.append`).
  - key: reaffectation
    format: course
    question: Si une méthode réaffecte son paramètre objet (`p = new Point()`), l'appelant voit-il le changement ?
    choices:
      - {text: "Non : seule la copie locale de la référence change", correct: true}
      - {text: "Oui : sa variable désigne désormais le nouvel objet", correct: false}
      - {text: "Oui, mais seulement à la fin de la méthode, au `return`", correct: false}
      - {text: "Non, car réaffecter un paramètre ne compile pas", correct: false}
    answer: "Non : seule la copie locale de la référence change ; la variable de l'appelant désigne toujours l'ancien objet."
  - key: vf-par-reference
    format: true-false
    question: Java passe les objets par référence.
    truth: false
    answer: Il passe par valeur une copie de la référence ; c'est différent, comme le montre la réaffectation.
  - key: vf-int-modifie
    format: true-false
    question: Après l'appel `incrementer(x)`, où la méthode fait `n++`, la variable `x` de l'appelant a augmenté.
    truth: false
    answer: '`n` est une copie de `x` ; il faudrait renvoyer la nouvelle valeur : `x = incrementer(x);`.'
  - key: vf-liste-modifiee
    format: true-false
    question: Une méthode qui appelle `liste.add("x")` sur son paramètre modifie la liste de l'appelant.
    truth: true
    answer: Les deux références désignent la même liste.
  - key: vf-echanger
    format: true-false
    question: On peut écrire en Java une méthode `echanger(int a, int b)` qui échange deux variables de l'appelant.
    truth: false
    answer: La méthode n'échange que ses copies. Il faut passer un objet ou un tableau qui contient les valeurs, ou renvoyer un résultat.
  - key: qcm-ce-qui-change
    format: multiple-choice
    question: "La méthode `m(StringBuilder sb)` fait `sb.append(\"b\"); sb = new StringBuilder(\"z\");`. L'appelant avait `sb = \"a\"`. Que contient son `sb` ?"
    choices:
      - text: "\"ab\""
        correct: true
      - text: "\"a\""
        correct: false
      - text: "\"z\""
        correct: false
      - text: "\"zb\""
        correct: false
    answer: L'ajout touche l'objet partagé ; la réaffectation ne change que la copie locale.
  - key: qcm-renvoyer
    format: multiple-choice
    question: Comment une méthode peut-elle « modifier » un `int` de l'appelant ?
    choices:
      - {text: "En renvoyant la nouvelle valeur, que l'appelant range", correct: true}
      - {text: "En réaffectant son paramètre avec la nouvelle valeur", correct: false}
      - {text: "En déclarant son paramètre `final` pour le partager", correct: false}
      - {text: "En recevant l'argument avec le mot-clé `ref`, comme en C#", correct: false}
    answer: "Java n'a pas de passage par référence (`ref` vient de C#) : on renvoie la valeur."
  - key: qcm-vider
    format: multiple-choice
    question: Quelle instruction, dans une méthode qui reçoit `List<String> liste`, vide la liste de l'appelant ?
    choices:
      - text: "`liste.clear();`"
        correct: true
      - text: "`liste = new ArrayList<>();`"
        correct: false
      - text: "`liste = null;`"
        correct: false
      - text: "`liste = List.of();`"
        correct: false
    answer: Seul `clear()` agit sur l'objet partagé ; les autres réaffectent la copie locale.
  - key: qcm-tableau
    format: multiple-choice
    question: Une méthode reçoit `int[] t` et fait `t[0] = 7;`. Que voit l'appelant ?
    choices:
      - text: "Son tableau a 7 en première case"
        correct: true
      - text: "Rien ne change"
        correct: false
      - text: "Une exception"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: "Un tableau est un objet : la méthode écrit dans le même tableau."
  - key: code-primitif
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void incrementer(int n) {
          n++;
      }
      int x = 5;
      incrementer(x);
      System.out.println(x);
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: '`5` : la méthode a incrémenté sa copie.'
    check:
      code: |-
        static void incrementer(int n) {
            n++;
        }
        void run() {
            int x = 5;
            incrementer(x);
            System.out.println(x);
        }
        run();
      output: "5"
  - key: code-objet-modifie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void ajouter(List<String> l) {
          l.add("b");
      }
      List<String> liste = new ArrayList<>(List.of("a"));
      ajouter(liste);
      System.out.println(liste);
      ```
    choices:
      - {text: "`[a, b]`", correct: true}
      - {text: "`[a]`", correct: false}
      - {text: "`[b]`", correct: false}
      - {text: "`[b, a]`", correct: false}
    answer: '`[a, b]` : la méthode a modifié la même liste.'
    check:
      output: "[a, b]"
  - key: code-reaffectation
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void remplacer(StringBuilder sb) {
          sb = new StringBuilder("neuf");
      }
      StringBuilder s = new StringBuilder("ancien");
      remplacer(s);
      System.out.println(s);
      ```
    choices:
      - {text: "`ancien`", correct: true}
      - {text: "`neuf`", correct: false}
      - {text: "`ancienneuf`", correct: false}
      - {text: "`null`", correct: false}
    answer: '`ancien` : la réaffectation ne change que la copie locale de la référence.'
    check:
      output: "ancien"
  - key: code-mixte
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void m(StringBuilder sb) {
          sb.append("b");
          sb = new StringBuilder("z");
          sb.append("y");
      }
      StringBuilder s = new StringBuilder("a");
      m(s);
      System.out.println(s);
      ```
    choices:
      - {text: "`ab`", correct: true}
      - {text: "`a`", correct: false}
      - {text: "`zy`", correct: false}
      - {text: "`aby`", correct: false}
    answer: '`ab` : le premier ajout touche l''objet partagé ; ensuite, `sb` désigne un autre objet.'
    check:
      output: "ab"
  - key: bug-incrementer
    format: bug-fix
    question: |-
      Le score ne change jamais. Quelle correction est la bonne ?
      ```java
      static void ajouterPoints(int score, int points) {
          score = score + points;
      }
      ajouterPoints(score, 10);
      ```
    choices:
      - {text: "Renvoyer `score + points` et écrire `score = ajouterPoints(score, 10);`", correct: true}
      - {text: "Écrire `score += points;` au lieu de `score = score + points;`", correct: false}
      - {text: "Déclarer le paramètre `Integer score`, un objet partagé avec l'appelant", correct: false}
      - {text: "Déclarer le paramètre `final int score` pour qu'il reste lié à l'appelant", correct: false}
    answer: |-
      ```java
      static int ajouterPoints(int score, int points) {
          return score + points;
      }
      score = ajouterPoints(score, 10);
      ```
      La méthode modifiait sa copie ; on renvoie la nouvelle valeur.
  - key: bug-vider-liste
    format: bug-fix
    question: |-
      Après l'appel, le panier n'est pas vidé. Quelle correction est la bonne ?
      ```java
      static void vider(List<Article> panier) {
          panier = new ArrayList<>();
      }
      ```
    choices:
      - {text: "Appeler `panier.clear();` au lieu de réaffecter le paramètre", correct: true}
      - {text: "Écrire `panier = null;` pour libérer la liste de l'appelant", correct: false}
      - {text: "Écrire `panier = List.of();`, une liste vide immuable", correct: false}
      - {text: "Déclarer le paramètre `final` pour toucher la liste de l'appelant", correct: false}
    answer: |-
      ```java
      static void vider(List<Article> panier) {
          panier.clear();
      }
      ```
      Réaffecter le paramètre ne touche pas la liste de l'appelant ; `clear()` agit sur l'objet partagé.
  - key: bug-echanger
    format: bug-fix
    question: |-
      Ces deux variables ne sont jamais échangées. Pourquoi ?
      ```java
      static void echanger(int a, int b) {
          int tmp = a;
          a = b;
          b = tmp;
      }
      echanger(x, y);
      ```
    choices:
      - {text: "La méthode reçoit des copies de `x` et `y`, et n'échange qu'elles", correct: true}
      - {text: "Les `int` sont immuables : on ne peut pas changer leur valeur", correct: false}
      - {text: "La variable `tmp` disparaît à la fin de la méthode, avec l'échange", correct: false}
      - {text: "Les paramètres d'une méthode sont `final` par défaut en Java", correct: false}
    answer: |-
      ```java
      static void echanger(int[] t, int i, int j) {
          int tmp = t[i];
          t[i] = t[j];
          t[j] = tmp;
      }
      ```
      La méthode n'échange que ses copies. On échange des cases d'un tableau (un objet partagé), ou on fait l'échange
      sur place, sans méthode.
  - key: bug-modification-surprise
    format: bug-fix
    question: |-
      Après l'appel, la liste de l'appelant a été triée sans qu'il le veuille. Quelle correction est la bonne ?
      ```java
      static String plusPetit(List<String> noms) {
          Collections.sort(noms);
          return noms.get(0);
      }
      ```
    choices:
      - {text: "`return Collections.min(noms);`, qui ne modifie pas la liste", correct: true}
      - {text: "Déclarer le paramètre `final List<String> noms` pour la protéger", correct: false}
      - {text: "Remplacer `Collections.sort(noms)` par `noms.sort(null)`", correct: false}
      - {text: "Copier la liste après le tri : `noms = new ArrayList<>(noms);`", correct: false}
    answer: |-
      ```java
      static String plusPetit(List<String> noms) {
          return Collections.min(noms);
      }
      ```
      La méthode modifiait l'objet de l'appelant. `Collections.min` ne touche pas la liste ; `final` n'empêcherait
      que de réaffecter le paramètre, pas de trier la liste.
