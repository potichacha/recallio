notion: boucles-imbriquees
lesson: |-
  Une boucle peut en contenir une autre : la boucle **intérieure** fait **tous** ses tours à chaque tour de la boucle
  **extérieure**.

  ```java
  for (int ligne = 1; ligne <= 3; ligne++) {
      for (int colonne = 1; colonne <= 3; colonne++) {
          System.out.print(ligne * colonne + " ");
      }
      System.out.println();
  }
  ```

  - Le nombre total de tours est le **produit** des deux : 3 × 3 = 9. Avec deux boucles sur `n` éléments, on fait
    `n²` tours : c'est une complexité **quadratique**, O(n²).
  - Pour 10 éléments, 100 tours, c'est instantané ; pour 100 000, 10 milliards, c'est inutilisable.
  - Le cas typique : comparer chaque élément à tous les autres (chercher des doublons, des paires). Une structure
    adaptée (un `HashSet`, une `HashMap`) ramène souvent le problème à **une seule** boucle, O(n).
  - Chaque boucle a son propre compteur (`i`, `j`) : réutiliser le même nom ne compile pas.

  **Piège classique** : la boucle intérieure qui recommence à 0 alors qu'elle devrait partir de `i + 1`. On compare
  alors chaque paire deux fois, et chaque élément à lui-même.

  **En entretien** : « Deux boucles imbriquées sur la même collection, c'est O(n²) ; on cherche une structure qui
  évite la seconde boucle, typiquement un `HashSet` des éléments déjà vus. »
cards:
  - key: nombre-de-tours
    format: course
    question: Combien de tours font deux boucles imbriquées de `n` et `m` tours ?
    answer: '`n × m` : la boucle intérieure fait tous ses tours à chaque tour de l''extérieure.'
  - key: complexite-quadratique
    format: course
    question: Pourquoi deux boucles imbriquées sur la même liste posent-elles problème sur de gros volumes ?
    answer: |-
      Elles font `n²` tours (complexité quadratique) : 10 000 éléments donnent 100 millions de tours. Le temps explose
      quand les données grandissent.
  - key: eviter-la-seconde-boucle
    format: course
    question: Comment détecter un doublon dans une liste sans deux boucles imbriquées ?
    answer: |-
      En une seule boucle, avec un `HashSet` des éléments déjà vus : `if (!vus.add(x))`, `x` est un doublon. On passe de
      O(n²) à O(n).
  - key: depart-i-plus-un
    format: course
    question: Pour comparer chaque paire d'éléments une seule fois, d'où part la boucle intérieure ?
    answer: "De `i + 1` : on ne compare pas un élément à lui-même, ni deux fois la même paire."
  - key: vf-produit
    format: true-false
    question: Deux boucles imbriquées de 10 tours chacune font 20 tours au total.
    truth: false
    answer: Elles en font 10 × 10 = 100.
  - key: vf-meme-compteur
    format: true-false
    question: Deux boucles imbriquées peuvent toutes les deux déclarer un compteur `int i`.
    truth: false
    answer: "Le `i` extérieur est encore visible dans la boucle intérieure : il faut un autre nom."
  - key: vf-hashset
    format: true-false
    question: Un `HashSet` permet de détecter des doublons en une seule boucle.
    truth: true
    answer: '`add` renvoie `false` si l''élément y est déjà, en temps constant en moyenne.'
  - key: vf-interieure-recommence
    format: true-false
    question: La boucle intérieure recommence depuis le début à chaque tour de la boucle extérieure.
    truth: true
    answer: Son initialisation est réexécutée à chaque tour extérieur.
  - key: qcm-tours
    format: multiple-choice
    question: "Combien de fois `x()` est-il appelé ? `for (int i = 0; i < 4; i++) for (int j = 0; j < 5; j++) x();`"
    choices:
      - text: "20"
        correct: true
      - text: "9"
        correct: false
      - text: "5"
        correct: false
      - text: "25"
        correct: false
    answer: 4 tours extérieurs × 5 tours intérieurs.
  - key: qcm-complexite
    format: multiple-choice
    question: Quelle est la complexité de deux boucles imbriquées qui parcourent chacune les `n` éléments d'une liste ?
    choices:
      - text: "O(n²)"
        correct: true
      - text: "O(n)"
        correct: false
      - text: "O(2n)"
        correct: false
      - text: "O(log n)"
        correct: false
    answer: '`n` tours intérieurs pour chacun des `n` tours extérieurs.'
  - key: qcm-paires
    format: multiple-choice
    question: Quelle boucle intérieure examine chaque paire `(i, j)` une seule fois, sans comparer un élément à lui-même ?
    choices:
      - text: "`for (int j = i + 1; j < n; j++)`"
        correct: true
      - text: "`for (int j = 0; j < n; j++)`"
        correct: false
      - text: "`for (int j = i; j < n; j++)`"
        correct: false
      - text: "`for (int j = 0; j < i + 1; j++)`"
        correct: false
    answer: Partir de `i + 1` évite `j == i` et les paires déjà vues.
  - key: qcm-alternative
    format: multiple-choice
    question: Quelle structure évite de comparer chaque élément à tous les autres pour trouver des doublons ?
    choices:
      - text: "Un `HashSet` des éléments déjà vus"
        correct: true
      - text: "Un second tableau de même taille"
        correct: false
      - text: "Une troisième boucle"
        correct: false
      - text: "Un `switch`"
        correct: false
    answer: Le test d'appartenance d'un `HashSet` est en temps constant en moyenne.
  - key: code-table
    format: code-output
    question: |-
      ```java
      for (int i = 1; i <= 2; i++) {
          for (int j = 1; j <= 3; j++) {
              System.out.print(i * j + " ");
          }
          System.out.println();
      }
      ```
    answer: |-
      ```
      1 2 3
      2 4 6
      ```
      La boucle intérieure fait ses 3 tours pour chaque ligne.
    check:
      output: |-
        1 2 3
        2 4 6
  - key: code-compteur
    format: code-output
    question: |-
      ```java
      int tours = 0;
      for (int i = 0; i < 3; i++) {
          for (int j = 0; j < 4; j++) {
              tours++;
          }
      }
      System.out.println(tours);
      ```
    answer: '`12` : 3 × 4 tours.'
    check:
      output: "12"
  - key: code-triangle
    format: code-output
    question: |-
      ```java
      for (int i = 1; i <= 3; i++) {
          for (int j = 1; j <= i; j++) {
              System.out.print("*");
          }
          System.out.println();
      }
      ```
    answer: |-
      ```
      *
      **
      ***
      ```
      La boucle intérieure dépend de `i` : un astérisque de plus à chaque ligne.
    check:
      output: |-
        *
        **
        ***
  - key: code-paires
    format: code-output
    question: |-
      ```java
      int[] t = {1, 2, 3};
      int paires = 0;
      for (int i = 0; i < t.length; i++) {
          for (int j = i + 1; j < t.length; j++) {
              paires++;
          }
      }
      System.out.println(paires);
      ```
    answer: '`3` : les paires (1,2), (1,3) et (2,3), chacune une seule fois.'
    check:
      output: "3"
  - key: bug-meme-compteur
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable i is already defined`) :
      ```java
      for (int i = 0; i < lignes; i++) {
          for (int i = 0; i < colonnes; i++) {
              afficher(i, i);
          }
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < lignes; i++) {
          for (int j = 0; j < colonnes; j++) {
              afficher(i, j);
          }
      }
      ```
      Chaque boucle a besoin de son propre compteur.
  - key: bug-paires-en-double
    format: bug-fix
    question: |-
      Ce code signale chaque doublon deux fois, et signale aussi chaque élément comme son propre doublon :
      ```java
      for (int i = 0; i < t.length; i++) {
          for (int j = 0; j < t.length; j++) {
              if (t[i] == t[j]) {
                  System.out.println("Doublon : " + t[i]);
              }
          }
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < t.length; i++) {
          for (int j = i + 1; j < t.length; j++) {
              if (t[i] == t[j]) {
                  System.out.println("Doublon : " + t[i]);
              }
          }
      }
      ```
      En partant de `i + 1`, on ne compare jamais un élément à lui-même, et chaque paire une seule fois.
  - key: bug-quadratique
    format: bug-fix
    question: |-
      Ce test de doublons met plusieurs minutes sur 200 000 commandes :
      ```java
      for (int i = 0; i < ids.size(); i++) {
          for (int j = i + 1; j < ids.size(); j++) {
              if (ids.get(i).equals(ids.get(j))) {
                  return true;
              }
          }
      }
      return false;
      ```
    answer: |-
      ```java
      Set<String> vus = new HashSet<>();
      for (String id : ids) {
          if (!vus.add(id)) {
              return true;
          }
      }
      return false;
      ```
      Deux boucles imbriquées font environ 20 milliards de comparaisons. Avec un `HashSet`, une seule boucle suffit.
  - key: bug-mauvaise-borne-interieure
    format: bug-fix
    question: |-
      On veut afficher une grille de `lignes` × `colonnes` cases, mais elle est carrée :
      ```java
      for (int i = 0; i < lignes; i++) {
          for (int j = 0; j < lignes; j++) {
              System.out.print("# ");
          }
          System.out.println();
      }
      ```
    answer: |-
      ```java
      for (int j = 0; j < colonnes; j++) {
      ```
      La boucle intérieure doit parcourir les colonnes, pas les lignes.
  - key: situation-temps-explose
    format: scenario
    question: Une fonction de rapprochement marchait en recette avec 1 000 lignes, mais met des heures en production sur 500 000. Que soupçonnez-vous ?
    answer: |-
      Une complexité **quadratique** : deux boucles imbriquées sur les mêmes données. 1 000² fait un million
      d'opérations, 500 000² en fait 250 milliards. Je chercherais à remplacer la boucle intérieure par une recherche dans
      une `HashMap` indexée par la clé de rapprochement, pour revenir à O(n).
  - key: situation-revue-de-code
    format: scenario
    question: En revue de code, vous voyez deux boucles imbriquées pour croiser une liste de clients et une liste de commandes. Que proposez-vous ?
    answer: |-
      Si les listes peuvent grandir, d'indexer l'une des deux dans une `Map` (par exemple les clients par identifiant),
      puis de parcourir l'autre une seule fois en cherchant dans la `Map`. On passe de clients × commandes opérations à
      clients + commandes. Pour de toutes petites listes, la version simple peut rester, si elle est plus lisible.
  - key: situation-quand-acceptable
    format: scenario
    question: Une collègue a lu que « les boucles imbriquées, c'est mal ». Est-ce toujours vrai ?
    answer: |-
      Non : parcourir une grille (lignes × colonnes) ou une matrice demande naturellement deux boucles, et chaque case
      n'est visitée qu'une fois. Le problème, c'est de comparer chaque élément d'une collection à tous les autres quand
      elle grossit. Il faut raisonner sur la taille des données, pas sur la forme du code.
  - key: situation-entretien-doublons
    format: scenario
    question: En entretien, on vous demande de trouver si un tableau contient deux nombres dont la somme vaut une cible. Comment présentez-vous votre solution ?
    answer: |-
      D'abord la solution directe : deux boucles imbriquées sur les paires, en O(n²). Puis l'amélioration : une seule
      boucle avec un `HashSet` des nombres déjà vus ; pour chaque `x`, on regarde si `cible - x` est dans l'ensemble.
      C'est O(n) en temps, au prix de O(n) en mémoire. Montrer ce passage de l'un à l'autre est souvent ce qu'on attend.
