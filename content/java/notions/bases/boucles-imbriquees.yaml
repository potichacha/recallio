notion: boucles-imbriquees
lesson: |-
  Une boucle peut en contenir une autre : la boucle **intérieure** fait **tous** ses tours à chaque tour de la boucle
  **extérieure**.

  ```java
  for (int ligne = 1; ligne <= 3; ligne++) {
      for (int colonne = 1; colonne <= 3; colonne++) {
          System.out.print(ligne * colonne + " ");
      }
      System.out.println();
  }
  ```

  - Le nombre total de tours est le **produit** des deux : 3 × 3 = 9. Avec deux boucles sur `n` éléments, on fait
    `n²` tours : c'est une complexité **quadratique**, O(n²).
  - Pour 10 éléments, 100 tours, c'est instantané ; pour 100 000, 10 milliards, c'est inutilisable.
  - Le cas typique : comparer chaque élément à tous les autres (chercher des doublons, des paires). Une structure
    adaptée (un `HashSet`, une `HashMap`) ramène souvent le problème à **une seule** boucle, O(n).
  - Chaque boucle a son propre compteur (`i`, `j`) : réutiliser le même nom ne compile pas.

  **Piège classique** : la boucle intérieure qui recommence à 0 alors qu'elle devrait partir de `i + 1`. On compare
  alors chaque paire deux fois, et chaque élément à lui-même.

  **En entretien** : « Deux boucles imbriquées sur la même collection, c'est O(n²) ; on cherche une structure qui
  évite la seconde boucle, typiquement un `HashSet` des éléments déjà vus. »
tour:
  - title: Les boucles imbriquées
    text: |-
      Une boucle dans une boucle exécute son corps `n × m` fois : c'est la façon naturelle de parcourir une grille, ou
      de comparer chaque élément à chacun des autres.

      Le coût grandit vite : deux boucles de 1 000 tours font un million d'itérations. Comparer chaque élément aux
      **suivants** seulement (`j` part de `i + 1`) divise le travail par deux ; souvent, un `Set` ou une `Map` évite
      même la seconde boucle.
    example:
      files:
        Main.java: |-
          void main() {
              for (int i = 1; i <= 3; i++) {
                  StringJoiner ligne = new StringJoiner(" ");
                  for (int j = 1; j <= 3; j++) {
                      ligne.add(String.valueOf(i * j));
                  }
                  IO.println(ligne);
              }

              int[] valeurs = {4, 7, 1, 7};
              for (int i = 0; i < valeurs.length; i++) {
                  for (int j = i + 1; j < valeurs.length; j++) {
                      if (valeurs[i] == valeurs[j]) {
                          IO.println("doublon : " + valeurs[i]);
                      }
                  }
              }
          }
      output: |-
        1 2 3
        2 4 6
        3 6 9
        doublon : 7
cards:
  - key: nombre-de-tours
    format: course
    question: Combien de tours font deux boucles imbriquées de `n` et `m` tours ?
    choices:
      - {text: "`n × m` tours", correct: true}
      - {text: "`n + m` tours", correct: false}
      - {text: "`n²` tours, quel que soit `m`", correct: false}
      - {text: "`max(n, m)` tours", correct: false}
    answer: "`n × m` : la boucle intérieure fait tous ses `m` tours à chaque tour de l'extérieure. `n + m` serait le cas de deux boucles l'une après l'autre."
  - key: complexite-quadratique
    format: course
    question: Pourquoi deux boucles imbriquées sur la même liste posent-elles problème sur de gros volumes ?
    choices:
      - {text: "Elles font `n²` tours : 10 000 éléments, 100 millions de tours", correct: true}
      - {text: "Elles font `2n` tours : deux fois plus que nécessaire", correct: false}
      - {text: "La JVM limite la profondeur des boucles imbriquées", correct: false}
      - {text: "Chaque boucle imbriquée copie la liste en mémoire", correct: false}
    answer: |-
      Elles font `n²` tours (complexité quadratique) : 10 000 éléments donnent 100 millions de tours. Le temps explose
      quand les données grandissent.
  - key: eviter-la-seconde-boucle
    format: course
    question: Comment détecter un doublon dans une liste sans deux boucles imbriquées ?
    choices:
      - {text: "Une seule boucle et un `HashSet` des éléments déjà vus", correct: true}
      - {text: "Une seule boucle qui compare chaque élément au suivant", correct: false}
      - {text: "Deux boucles, mais la seconde partie de `i + 1`", correct: false}
      - {text: "Une seule boucle et une `ArrayList` des éléments déjà vus", correct: false}
    answer: "En une seule boucle, avec un `HashSet` des éléments déjà vus : si `vus.add(x)` renvoie `false`, `x` est un doublon. On passe de O(n²) à O(n). Une `ArrayList` ferait un `contains` linéaire : on resterait en O(n²) ; comparer au suivant ne marche que sur une liste triée."
  - key: depart-i-plus-un
    format: course
    question: Pour comparer chaque paire d'éléments une seule fois, d'où part la boucle intérieure ?
    choices:
      - {text: "De `i + 1`", correct: true}
      - {text: "De `0`", correct: false}
      - {text: "De `i`", correct: false}
      - {text: "De `i - 1`", correct: false}
    answer: "De `i + 1` : on ne compare pas un élément à lui-même (ce que ferait `i`), ni deux fois la même paire (ce que ferait `0`)."
  - key: vf-produit
    format: true-false
    question: Deux boucles imbriquées de 10 tours chacune font 20 tours au total.
    truth: false
    answer: Elles en font 10 × 10 = 100.
  - key: vf-meme-compteur
    format: true-false
    question: Deux boucles imbriquées peuvent toutes les deux déclarer un compteur `int i`.
    truth: false
    answer: "Le `i` extérieur est encore visible dans la boucle intérieure : il faut un autre nom."
  - key: vf-hashset
    format: true-false
    question: Un `HashSet` permet de détecter des doublons en une seule boucle.
    truth: true
    answer: '`add` renvoie `false` si l''élément y est déjà, en temps constant en moyenne.'
  - key: vf-interieure-recommence
    format: true-false
    question: La boucle intérieure recommence depuis le début à chaque tour de la boucle extérieure.
    truth: true
    answer: Son initialisation est réexécutée à chaque tour extérieur.
  - key: qcm-tours
    format: multiple-choice
    question: "Combien de fois `x()` est-il appelé ? `for (int i = 0; i < 4; i++) for (int j = 0; j < 5; j++) x();`"
    choices:
      - text: "20"
        correct: true
      - text: "9"
        correct: false
      - text: "5"
        correct: false
      - text: "25"
        correct: false
    answer: 4 tours extérieurs × 5 tours intérieurs.
  - key: qcm-complexite
    format: multiple-choice
    question: Quelle est la complexité de deux boucles imbriquées qui parcourent chacune les `n` éléments d'une liste ?
    choices:
      - text: "O(n²)"
        correct: true
      - text: "O(n)"
        correct: false
      - text: "O(2n)"
        correct: false
      - text: "O(log n)"
        correct: false
    answer: '`n` tours intérieurs pour chacun des `n` tours extérieurs.'
  - key: qcm-paires
    format: multiple-choice
    question: Quelle boucle intérieure examine chaque paire `(i, j)` une seule fois, sans comparer un élément à lui-même ?
    choices:
      - text: "`for (int j = i + 1; j < n; j++)`"
        correct: true
      - text: "`for (int j = 0; j < n; j++)`"
        correct: false
      - text: "`for (int j = i; j < n; j++)`"
        correct: false
      - text: "`for (int j = 0; j < i + 1; j++)`"
        correct: false
    answer: Partir de `i + 1` évite `j == i` et les paires déjà vues.
  - key: qcm-alternative
    format: multiple-choice
    question: Quelle structure évite de comparer chaque élément à tous les autres pour trouver des doublons ?
    choices:
      - text: "Un `HashSet` des éléments déjà vus"
        correct: true
      - text: "Un second tableau de même taille"
        correct: false
      - text: "Une troisième boucle"
        correct: false
      - text: "Un `switch`"
        correct: false
    answer: Le test d'appartenance d'un `HashSet` est en temps constant en moyenne.
  - key: code-table
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      for (int i = 1; i <= 2; i++) {
          for (int j = 1; j <= 3; j++) {
              System.out.print(i * j + " ");
          }
          System.out.println();
      }
      ```
    choices:
      - text: |-
          ```
          1 2 3
          2 4 6
          ```
        correct: true
      - text: |-
          ```
          1 2 3 2 4 6
          ```
        correct: false
      - text: |-
          ```
          1 2
          2 4
          3 6
          ```
        correct: false
      - text: |-
          ```
          1 2 3
          4 5 6
          ```
        correct: false
    answer: |-
      ```
      1 2 3
      2 4 6
      ```
      La boucle intérieure fait ses 3 tours pour chaque ligne.
    check:
      output: |-
        1 2 3
        2 4 6
  - key: code-compteur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int tours = 0;
      for (int i = 0; i < 3; i++) {
          for (int j = 0; j < 4; j++) {
              tours++;
          }
      }
      System.out.println(tours);
      ```
    choices:
      - {text: "`12`", correct: true}
      - {text: "`7`", correct: false}
      - {text: "`20`", correct: false}
      - {text: "`4`", correct: false}
    answer: "`12` : 3 × 4 tours, car la boucle intérieure refait ses 4 tours à chacun des 3 tours de l'extérieure."
    check:
      output: "12"
  - key: code-triangle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      for (int i = 1; i <= 3; i++) {
          for (int j = 1; j <= i; j++) {
              System.out.print("*");
          }
          System.out.println();
      }
      ```
    choices:
      - text: |-
          ```
          *
          **
          ***
          ```
        correct: true
      - text: |-
          ```
          ***
          ***
          ***
          ```
        correct: false
      - text: |-
          ```
          ***
          **
          *
          ```
        correct: false
      - text: |-
          ```
          ******
          ```
        correct: false
    answer: |-
      ```
      *
      **
      ***
      ```
      La boucle intérieure dépend de `i` : un astérisque de plus à chaque ligne.
    check:
      output: |-
        *
        **
        ***
  - key: code-paires
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] t = {1, 2, 3};
      int paires = 0;
      for (int i = 0; i < t.length; i++) {
          for (int j = i + 1; j < t.length; j++) {
              paires++;
          }
      }
      System.out.println(paires);
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`9`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "`2`", correct: false}
    answer: "`3` : les paires (1,2), (1,3) et (2,3), chacune une seule fois, puisque `j` part de `i + 1`. En partant de 0, on en compterait 9."
    check:
      output: "3"
  - key: bug-meme-compteur
    format: bug-fix
    question: |-
      Ce code ne compile pas (`variable i is already defined`). Quelle correction est la bonne ?
      ```java
      for (int i = 0; i < lignes; i++) {
          for (int i = 0; i < colonnes; i++) {
              afficher(i, i);
          }
      }
      ```
    choices:
      - {text: "Un compteur `j` pour la boucle intérieure, et `afficher(i, j)`", correct: true}
      - {text: "Déclarer `int i` une seule fois, avant les deux boucles", correct: false}
      - {text: "Renommer le `i` de la boucle extérieure en `I`, et garder `afficher(i, i)`", correct: false}
      - {text: "Retirer `int` de la boucle intérieure : `for (i = 0; ...)`", correct: false}
    answer: |-
      ```java
      for (int i = 0; i < lignes; i++) {
          for (int j = 0; j < colonnes; j++) {
              afficher(i, j);
          }
      }
      ```
      Chaque boucle a besoin de son propre compteur. Réutiliser `i` sans le redéclarer compilerait, mais la boucle intérieure écraserait le compteur de l'extérieure.
  - key: bug-paires-en-double
    format: bug-fix
    question: |-
      Ce code signale chaque doublon deux fois, et signale aussi chaque élément comme son propre doublon. Quelle correction est la bonne ?
      ```java
      for (int i = 0; i < t.length; i++) {
          for (int j = 0; j < t.length; j++) {
              if (t[i] == t[j]) {
                  System.out.println("Doublon : " + t[i]);
              }
          }
      }
      ```
    choices:
      - {text: "Faire partir la boucle intérieure de `j = i + 1`", correct: true}
      - {text: "Faire partir la boucle intérieure de `j = 1`", correct: false}
      - {text: "Comparer avec `t[i].equals(t[j])` au lieu de `==`", correct: false}
      - {text: "Ajouter `break;` après l'affichage du doublon", correct: false}
    answer: |-
      ```java
      for (int i = 0; i < t.length; i++) {
          for (int j = i + 1; j < t.length; j++) {
              if (t[i] == t[j]) {
                  System.out.println("Doublon : " + t[i]);
              }
          }
      }
      ```
      En partant de `i + 1`, on ne compare jamais un élément à lui-même, et chaque paire une seule fois.
  - key: bug-quadratique
    format: bug-fix
    question: |-
      Ce test de doublons met plusieurs minutes sur 200 000 commandes. Quelle correction est la bonne ?
      ```java
      for (int i = 0; i < ids.size(); i++) {
          for (int j = i + 1; j < ids.size(); j++) {
              if (ids.get(i).equals(ids.get(j))) {
                  return true;
              }
          }
      }
      return false;
      ```
    choices:
      - {text: "Une seule boucle avec un `HashSet` : `if (!vus.add(id)) return true;`", correct: true}
      - {text: "Garder les deux boucles, mais en parcourant les indices à rebours", correct: false}
      - {text: "Remplacer `ids.get(i).equals(...)` par `ids.get(i) == ...`", correct: false}
      - {text: "Une seule boucle avec une `ArrayList` : `if (vus.contains(id))`", correct: false}
    answer: |-
      ```java
      Set<String> vus = new HashSet<>();
      for (String id : ids) {
          if (!vus.add(id)) {
              return true;
          }
      }
      return false;
      ```
      Deux boucles imbriquées font environ 20 milliards de comparaisons. Avec un `HashSet`, une seule boucle suffit ; une `ArrayList` ferait un `contains` linéaire, et on resterait quadratique.
  - key: bug-mauvaise-borne-interieure
    format: bug-fix
    question: |-
      On veut afficher une grille de `lignes` × `colonnes` cases, mais elle est carrée. Quelle correction est la bonne ?
      ```java
      for (int i = 0; i < lignes; i++) {
          for (int j = 0; j < lignes; j++) {
              System.out.print("# ");
          }
          System.out.println();
      }
      ```
    choices:
      - {text: "Borner la boucle intérieure par `j < colonnes`", correct: true}
      - {text: "Borner la boucle extérieure par `i < colonnes`", correct: false}
      - {text: "Borner la boucle intérieure par `j < lignes * colonnes`", correct: false}
      - {text: "Faire partir la boucle intérieure de `j = i`", correct: false}
    answer: |-
      ```java
      for (int j = 0; j < colonnes; j++) {
      ```
      La boucle intérieure doit parcourir les colonnes, pas les lignes.
  - key: situation-temps-explose
    format: scenario
    question: "Une fonction de rapprochement marchait en recette avec 1 000 lignes, mais met des heures en production sur 500 000. Que soupçonnes-tu ?"
    choices:
      - {text: "Deux boucles imbriquées sur les mêmes données : une complexité quadratique", correct: true}
      - {text: "Un manque de mémoire : il suffit d'augmenter `-Xmx` en production", correct: false}
      - {text: "Une base plus lente en production : il faut ajouter des index SQL", correct: false}
      - {text: "Une boucle infinie, qui ne se déclenche qu'au-delà de 1 000 lignes", correct: false}
    answer: "Une complexité **quadratique** : deux boucles imbriquées sur les mêmes données. 1 000² fait un million d'opérations, 500 000² en fait 250 milliards. On remplace la boucle intérieure par une recherche dans une `HashMap` indexée par la clé de rapprochement, pour revenir à O(n) ; plus de mémoire ne changerait rien au nombre d'opérations."
  - key: situation-revue-de-code
    format: scenario
    question: "En revue de code, tu vois deux boucles imbriquées pour croiser une liste de clients et une liste de commandes. Que proposes-tu ?"
    choices:
      - {text: "Indexer les clients dans une `Map` par identifiant, puis parcourir les commandes une fois", correct: true}
      - {text: "Trier les deux listes, puis garder les deux boucles imbriquées telles quelles", correct: false}
      - {text: "Paralléliser la boucle extérieure avec un `parallelStream()`", correct: false}
      - {text: "Remplacer les deux `for` par deux for-each, plus rapides", correct: false}
    answer: "Si les listes peuvent grandir, indexer l'une des deux dans une `Map` (par exemple les clients par identifiant), puis parcourir l'autre une seule fois en cherchant dans la `Map` : on passe de clients × commandes opérations à clients + commandes. Paralléliser divise le temps par le nombre de cœurs, sans changer la complexité. Pour de toutes petites listes, la version simple peut rester, si elle est plus lisible."
  - key: situation-quand-acceptable
    format: scenario
    question: Une collègue a lu que « les boucles imbriquées, c'est mal ». Est-ce toujours vrai ?
    choices:
      - {text: "Non : une grille en demande deux ; le problème, c'est comparer tout à tout", correct: true}
      - {text: "Oui : il faut toujours remplacer la boucle intérieure par une `Map`", correct: false}
      - {text: "Oui : la JVM n'optimise pas les boucles imbriquées, contrairement aux streams", correct: false}
      - {text: "Non : les boucles imbriquées ne coûtent rien tant qu'elles sont en `for`", correct: false}
    answer: |-
      Non : parcourir une grille (lignes × colonnes) ou une matrice demande naturellement deux boucles, et chaque case
      n'est visitée qu'une fois. Le problème, c'est de comparer chaque élément d'une collection à tous les autres quand
      elle grossit. Il faut raisonner sur la taille des données, pas sur la forme du code.
  - key: situation-entretien-doublons
    format: scenario
    question: "En entretien, on te demande de trouver si un tableau contient deux nombres dont la somme vaut une cible. Comment présentes-tu ta solution ?"
    choices:
      - {text: "D'abord les deux boucles en O(n²), puis une boucle avec un `HashSet`, en O(n)", correct: true}
      - {text: "Directement la version avec deux boucles : elle est assez rapide", correct: false}
      - {text: "Trier le tableau, puis garder deux boucles imbriquées sur le tableau trié", correct: false}
      - {text: "Directement un `HashSet`, sans parler de la solution naïve", correct: false}
    answer: |-
      D'abord la solution directe : deux boucles imbriquées sur les paires, en O(n²). Puis l'amélioration : une seule
      boucle avec un `HashSet` des nombres déjà vus ; pour chaque `x`, on regarde si `cible - x` est dans l'ensemble.
      C'est O(n) en temps, au prix de O(n) en mémoire. Montrer ce passage de l'un à l'autre est souvent ce qu'on attend.
