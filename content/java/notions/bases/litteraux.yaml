notion: litteraux
lesson: |-
  Un **littéral** est une valeur écrite directement dans le code :

  | Écriture | Type | Valeur |
  |---|---|---|
  | `42`, `-7` | `int` | entier en décimal |
  | `42L` | `long` | suffixe `L` |
  | `0x2A`, `0b101010`, `052` | `int` | hexadécimal, binaire, octal (zéro initial !) |
  | `3.14`, `1e3` | `double` | `1e3` vaut 1000.0 |
  | `3.14f` | `float` | suffixe `f` |
  | `'A'`, `'\n'`, `'\u00E9'` | `char` | un caractère, une séquence d'échappement, un code Unicode |
  | `"texte"` | `String` | une chaîne |
  | `"""` ... `"""` | `String` | un bloc de texte sur plusieurs lignes (Java 15) |
  | `true`, `false`, `null` | `boolean`, référence | |

  - Le **séparateur `_`** rend les grands nombres lisibles : `1_000_000`, `0xFF_FF`. Il est ignoré par le compilateur.
  - Les séquences d'échappement courantes : `\n` (retour à la ligne), `\t` (tabulation), `\"`, `\'`, `\\`.
  - Un **zéro initial** fait un nombre **octal** : `010` vaut 8. On n'écrit jamais de zéro devant un nombre décimal.

  **Piège classique** : `int code = 0123;` pour un code postal ou un code d'accès. Le zéro initial en fait un octal :
  `code` vaut 83.

  **En entretien** : « Un littéral entier est un `int` (suffixe `L` pour un `long`), un littéral à virgule un `double` ;
  et un zéro initial fait un octal. »
tour:
  - title: Les littéraux
    text: |-
      Un **littéral** écrit une valeur directement dans le code :

      - des entiers en décimal, en hexadécimal (`0xFF`) ou en binaire (`0b1010`), avec des `_` pour la lisibilité
      (`1_000_000`), et un `L` final pour un `long` ; - des flottants : `3.5` est un `double`, `3.5f` un `float`, `1e3`
      vaut mille ; - des caractères entre apostrophes, comme `'A'` ; - des chaînes entre guillemets, et des **blocs de
      texte** entre trois guillemets, sur plusieurs lignes, qui gardent leurs retours à la ligne et leur indentation
      relative.
    example:
      files:
        Main.java: |-
          void main() {
              int hexa = 0xFF;
              int binaire = 0b1010;
              long million = 1_000_000L;
              double scientifique = 1e3;
              float petit = 3.5f;
              char lettre = 'A';
              String bloc = """
                  Un bloc de texte
                    garde ses retours à la ligne.""";
              IO.println(hexa + " " + binaire + " " + million + " " + scientifique + " " + petit + " " + lettre);
              IO.println(bloc);
          }
      output: |-
        255 10 1000000 1000.0 3.5 A
        Un bloc de texte
          garde ses retours à la ligne.
cards:
  - key: litteral-1-000-000
    format: course
    question: "Qu'est-ce que le littéral `1_000_000` ?"
    choices:
      - {text: "Un `int` valide : les `_` ne servent qu'à la lisibilité", correct: true}
      - {text: "Une erreur de compilation : `_` est interdit dans un nombre", correct: false}
      - {text: "Un `long`, que les `_` signalent comme un grand nombre", correct: false}
      - {text: "Un `double`, les `_` jouant le rôle de la virgule", correct: false}
    answer: "Un `int` valide, qui vaut un million : depuis Java 7, les `_` placés entre deux chiffres servent à la lisibilité et ne changent ni la valeur ni le type."
  - key: bases-numeriques
    format: course
    question: "Comment écrire l'entier 42 en hexadécimal, en binaire et en octal ?"
    choices:
      - {text: "`0x2A`, `0b101010` et `052`", correct: true}
      - {text: "`0x2A`, `0b101010` et `0o52`", correct: false}
      - {text: "`0h2A`, `0b101010` et `0o52`", correct: false}
      - {text: "`#2A`, `101010b` et `052`", correct: false}
    answer: "`0x2A` (hexadécimal), `0b101010` (binaire), `052` (octal, avec un simple zéro initial) ; les trois valent 42. Le préfixe `0o` est celui de Python, pas de Java."
  - key: echappements
    format: course
    question: "Laquelle de ces séries ne contient que des séquences d'échappement valides dans une chaîne Java ?"
    choices:
      - {text: "`\\n`, `\\t` et `\\\"`", correct: true}
      - {text: "`\\n`, `\\t` et `\\d`", correct: false}
      - {text: "`/n`, `/t` et `/\"`", correct: false}
      - {text: "`%n`, `%t` et `%\"`", correct: false}
    answer: "`\\n` (retour à la ligne), `\\t` (tabulation) et `\\\"` (guillemet) ; il y a aussi `\\\\` (barre oblique inverse) et `\\u00E9` (un caractère Unicode). `\\d` n'existe pas : le compilateur le refuse, et `%n` n'a de sens que dans `printf`."
  - key: blocs-de-texte
    format: course
    question: "Depuis Java 15, comment écrit-on une chaîne sur plusieurs lignes sans `\\n` ni concaténation ?"
    choices:
      - {text: "Dans un bloc de texte, entre trois guillemets `\"\"\"`", correct: true}
      - {text: "Entre accents graves, comme en JavaScript", correct: false}
      - {text: "Avec une barre oblique inverse en fin de ligne", correct: false}
      - {text: "Avec l'annotation `@Multiline` sur la variable", correct: false}
    answer: "Avec un bloc de texte, délimité par trois guillemets (`\"\"\"`), depuis Java 15 : pratique pour du JSON, du SQL ou du HTML, sans `\\n` ni concaténation."
  - key: vf-zero-initial
    format: true-false
    question: "`010` vaut 10 en Java."
    truth: false
    answer: "Le zéro initial en fait un octal : `010` vaut 8."
  - key: vf-underscore
    format: true-false
    question: "`1_000` et `1000` sont le même nombre."
    truth: true
    answer: Le séparateur `_` n'est là que pour la lisibilité.
  - key: vf-exposant
    format: true-false
    question: "`1e3` est un littéral de type `int`."
    truth: false
    answer: "Avec un exposant, c'est un `double` : `1e3` vaut 1000.0."
  - key: vf-binaire
    format: true-false
    question: "`0b1010` vaut 10."
    truth: true
    answer: Le préfixe `0b` introduit un nombre binaire (Java 7).
  - key: qcm-type-litteral
    format: multiple-choice
    question: De quel type est `2.5f` ?
    choices:
      - text: "`float`"
        correct: true
      - text: "`double`"
        correct: false
      - text: "`Float`"
        correct: false
      - text: "`String`"
        correct: false
    answer: Le suffixe `f` fait un `float` primitif.
  - key: qcm-valeur-hexa
    format: multiple-choice
    question: Que vaut `0xFF` ?
    choices:
      - text: "255"
        correct: true
      - text: "15"
        correct: false
      - text: "256"
        correct: false
      - text: "-1"
        correct: false
    answer: F vaut 15, donc 15 × 16 + 15 = 255.
  - key: qcm-underscore-valide
    format: multiple-choice
    question: Quels littéraux sont valides ?
    choices:
      - text: "`1_000_000`"
        correct: true
      - text: "`0xFF_FF`"
        correct: true
      - text: "`_1000`"
        correct: false
      - text: "`1000_`"
        correct: false
    answer: Le `_` se place entre deux chiffres ; `_1000` serait un nom de variable.
  - key: qcm-retour-ligne
    format: multiple-choice
    question: Quelle séquence insère un retour à la ligne dans une chaîne ?
    choices:
      - text: "`\\n`"
        correct: true
      - text: "`\\t`"
        correct: false
      - text: "`/n`"
        correct: false
      - text: "`\\r\\t`"
        correct: false
    answer: '`\n` ; `\t` est une tabulation.'
  - key: trous-long
    format: fill-in
    question: |-
      Complète le littéral pour qu'il soit un `long` :
      ```java
      long populationMondiale = 8_000_000_000___;
      ```
    blanks: [[L, l]]
    answer: Sans suffixe, le littéral serait un `int`, trop petit.
  - key: trous-hexa
    format: fill-in
    question: |-
      Complète pour écrire 255 en hexadécimal :
      ```java
      int max = ___FF;
      ```
    blanks: [["0x", "0X"]]
    answer: Le préfixe `0x` introduit l'hexadécimal.
  - key: trous-separateur
    format: fill-in
    question: |-
      Complète pour écrire un million lisiblement :
      ```java
      int million = 1___000___000;
      ```
    blanks: [[_], [_]]
    answer: Le séparateur `_` regroupe les chiffres par milliers.
  - key: trous-guillemet
    format: fill-in
    question: |-
      Complète pour afficher : Il a dit "bonjour"
      ```java
      System.out.println("Il a dit ___bonjour___");
      ```
    blanks: [["\\\""], ["\\\""]]
    answer: '`\"` insère un guillemet sans fermer la chaîne.'
  - key: code-system-out-println-017
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(017);
      ```
    choices:
      - {text: "`15`", correct: true}
      - {text: "`17`", correct: false}
      - {text: "`017`", correct: false}
      - {text: "`23`", correct: false}
    answer: "`15` : un littéral entier qui commence par 0 est en octal, et 17 en octal vaut 1 × 8 + 7. Le zéro n'est pas affiché pour autant."
    check:
      code: |-
        System.out.println(017);
      output: "15"
  - key: code-bases
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(0x10 + 0b10 + 010);
      ```
    choices:
      - {text: "`26`", correct: true}
      - {text: "`28`", correct: false}
      - {text: "`18`", correct: false}
      - {text: "`30`", correct: false}
    answer: "`26` : 16 (hexadécimal) + 2 (binaire) + 8 (octal). Lire `010` comme un décimal donnerait 28."
    check:
      output: "26"
  - key: code-exposant
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(1e3 + " " + 2.5e-1);
      ```
    choices:
      - {text: "`1000.0 0.25`", correct: true}
      - {text: "`1000 0.25`", correct: false}
      - {text: "`1e3 2.5e-1`", correct: false}
      - {text: "`1000.0 -2.5`", correct: false}
    answer: "`1000.0 0.25` : un littéral avec exposant est un `double`, d'où le `.0`, et `e-1` divise par 10."
    check:
      output: "1000.0 0.25"
  - key: code-bloc-de-texte
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String json = """
          {"nom": "Ada"}
          """;
      System.out.print(json);
      ```
    choices:
      - {text: "`{\"nom\": \"Ada\"}`", correct: true}
      - text: |-
          ```
              {"nom": "Ada"}
          ```
        correct: false
      - {text: "`{nom: Ada}`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`{\"nom\": \"Ada\"}` : l'indentation commune est retirée, et le bloc se termine par un retour à la ligne. Dans un bloc de texte, les guillemets n'ont pas besoin d'être échappés."
    check:
      output: '{"nom": "Ada"}'
  - key: bug-octal
    format: bug-fix
    question: |-
      Le code d'accès 0123 n'est jamais reconnu. Pourquoi ?
      ```java
      int codeAttendu = 0123;
      if (saisie == codeAttendu) {
          ouvrir();
      }
      ```
    choices:
      - {text: "`0123` est un littéral octal : il vaut 83, pas 123", correct: true}
      - {text: "Le zéro initial est ignoré : `codeAttendu` vaut 123", correct: false}
      - {text: "`==` compare des références : il faut `equals`", correct: false}
      - {text: "Un `int` ne garde pas son zéro : il faut un `long`", correct: false}
    answer: "`0123` est un littéral octal : il vaut 83, si bien qu'une saisie de 123 ne lui est jamais égale. Écris `123` ; et si le zéro de tête compte, comme dans un code d'accès, garde le code dans une `String` et compare-le avec `equals`."
  - key: bug-long-sans-suffixe
    format: bug-fix
    question: |-
      Ce code ne compile pas (`integer number too large`). Quelle correction est la bonne ?
      ```java
      long octets = 5000000000;
      ```
    choices:
      - {text: "Ajouter le suffixe `L` : `5_000_000_000L`", correct: true}
      - {text: "Caster le littéral : `(long) 5000000000`", correct: false}
      - {text: "Déclarer `double octets = 5000000000;`", correct: false}
      - {text: "Déclarer `Long octets = 5000000000;`", correct: false}
    answer: |-
      ```java
      long octets = 5_000_000_000L;
      ```
      Sans suffixe, le littéral est un `int`, trop petit pour 5 milliards : changer le type de la variable ou caster n'y change rien, c'est le littéral qui est refusé.
  - key: bug-chemin-windows
    format: bug-fix
    question: |-
      Ce code ne compile pas (`illegal escape character`). Quelle correction est la bonne ?
      ```java
      String chemin = "C:\dossier\fichier.txt";
      ```
    choices:
      - {text: "`String chemin = \"C:\\\\dossier\\\\fichier.txt\";`", correct: true}
      - {text: "`String chemin = 'C:\\dossier\\fichier.txt';`", correct: false}
      - {text: "`String chemin = @\"C:\\dossier\\fichier.txt\";`", correct: false}
      - {text: "`String chemin = r\"C:\\dossier\\fichier.txt\";`", correct: false}
    answer: |-
      ```java
      String chemin = "C:\\dossier\\fichier.txt";
      ```
      `\d` n'est pas une séquence d'échappement valide : une barre oblique inverse s'écrit `\\`. Les chaînes `@"..."` (C#) et `r"..."` (Python) n'existent pas en Java. (Ou mieux, `Path.of("C:", "dossier", "fichier.txt")`.)
  - key: bug-concatenation-multiligne
    format: bug-fix
    question: |-
      Cette requête SQL est difficile à lire. Quelle écriture est la plus lisible, depuis Java 15 ?
      ```java
      String sql = "SELECT nom, email\n" +
                   "FROM client\n" +
                   "WHERE actif = true\n";
      ```
    choices:
      - {text: "Un bloc de texte entre `\"\"\"`, qui garde la mise en forme", correct: true}
      - {text: "Un `StringBuilder`, avec un `append` par ligne", correct: false}
      - {text: "Une chaîne entre accents graves, comme en JavaScript", correct: false}
      - {text: "Une seule longue ligne, sans aucun retour à la ligne", correct: false}
    answer: |-
      ```java
      String sql = """
          SELECT nom, email
          FROM client
          WHERE actif = true
          """;
      ```
      Un bloc de texte (Java 15) garde la mise en forme, sans `\n` ni concaténation. Les accents graves n'existent pas en Java.
