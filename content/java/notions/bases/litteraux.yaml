notion: litteraux
lesson: |-
  Un **littéral** est une valeur écrite directement dans le code :

  | Écriture | Type | Valeur |
  |---|---|---|
  | `42`, `-7` | `int` | entier en décimal |
  | `42L` | `long` | suffixe `L` |
  | `0x2A`, `0b101010`, `052` | `int` | hexadécimal, binaire, octal (zéro initial !) |
  | `3.14`, `1e3` | `double` | `1e3` vaut 1000.0 |
  | `3.14f` | `float` | suffixe `f` |
  | `'A'`, `'\n'`, `'\u00E9'` | `char` | un caractère, une séquence d'échappement, un code Unicode |
  | `"texte"` | `String` | une chaîne |
  | `"""` ... `"""` | `String` | un bloc de texte sur plusieurs lignes (Java 15) |
  | `true`, `false`, `null` | `boolean`, référence | |

  - Le **séparateur `_`** rend les grands nombres lisibles : `1_000_000`, `0xFF_FF`. Il est ignoré par le compilateur.
  - Les séquences d'échappement courantes : `\n` (retour à la ligne), `\t` (tabulation), `\"`, `\'`, `\\`.
  - Un **zéro initial** fait un nombre **octal** : `010` vaut 8. On n'écrit jamais de zéro devant un nombre décimal.

  **Piège classique** : `int code = 0123;` pour un code postal ou un code d'accès. Le zéro initial en fait un octal :
  `code` vaut 83.

  **En entretien** : « Un littéral entier est un `int` (suffixe `L` pour un `long`), un littéral à virgule un `double` ;
  et un zéro initial fait un octal. »
cards:
  - key: litteral-1-000-000
    format: course
    question: Qu'est-ce qu'un littéral `1_000_000` ?
    answer: Un int valide ; les underscores servent à la lisibilité (Java 7).
  - key: bases-numeriques
    format: course
    question: Comment écrire un entier en hexadécimal, en binaire et en octal ?
    answer: '`0x2A` (hexadécimal), `0b101010` (binaire), `052` (octal, avec un zéro initial) ; les trois valent 42.'
  - key: echappements
    format: course
    question: Citez trois séquences d'échappement dans une chaîne.
    answer: '`\n` (retour à la ligne), `\t` (tabulation), `\"` (guillemet), `\\` (barre oblique inverse), `\u00E9` (un caractère Unicode).'
  - key: blocs-de-texte
    format: course
    question: Qu'est-ce qu'un bloc de texte ?
    answer: |-
      Une chaîne sur plusieurs lignes délimitée par trois guillemets (`"""`), depuis Java 15 : pratique pour du JSON, du
      SQL ou du HTML, sans `\n` ni concaténation.
  - key: vf-zero-initial
    format: true-false
    question: "`010` vaut 10 en Java."
    truth: false
    answer: "Le zéro initial en fait un octal : `010` vaut 8."
  - key: vf-underscore
    format: true-false
    question: "`1_000` et `1000` sont le même nombre."
    truth: true
    answer: Le séparateur `_` n'est là que pour la lisibilité.
  - key: vf-exposant
    format: true-false
    question: "`1e3` est un littéral de type `int`."
    truth: false
    answer: "Avec un exposant, c'est un `double` : `1e3` vaut 1000.0."
  - key: vf-binaire
    format: true-false
    question: "`0b1010` vaut 10."
    truth: true
    answer: Le préfixe `0b` introduit un nombre binaire (Java 7).
  - key: qcm-type-litteral
    format: multiple-choice
    question: De quel type est `2.5f` ?
    choices:
      - text: "`float`"
        correct: true
      - text: "`double`"
        correct: false
      - text: "`Float`"
        correct: false
      - text: "`String`"
        correct: false
    answer: Le suffixe `f` fait un `float` primitif.
  - key: qcm-valeur-hexa
    format: multiple-choice
    question: Que vaut `0xFF` ?
    choices:
      - text: "255"
        correct: true
      - text: "15"
        correct: false
      - text: "256"
        correct: false
      - text: "-1"
        correct: false
    answer: F vaut 15, donc 15 × 16 + 15 = 255.
  - key: qcm-underscore-valide
    format: multiple-choice
    question: Quels littéraux sont valides ?
    choices:
      - text: "`1_000_000`"
        correct: true
      - text: "`0xFF_FF`"
        correct: true
      - text: "`_1000`"
        correct: false
      - text: "`1000_`"
        correct: false
    answer: Le `_` se place entre deux chiffres ; `_1000` serait un nom de variable.
  - key: qcm-retour-ligne
    format: multiple-choice
    question: Quelle séquence insère un retour à la ligne dans une chaîne ?
    choices:
      - text: "`\\n`"
        correct: true
      - text: "`\\t`"
        correct: false
      - text: "`/n`"
        correct: false
      - text: "`\\r\\t`"
        correct: false
    answer: '`\n` ; `\t` est une tabulation.'
  - key: trous-long
    format: fill-in
    question: |-
      Complétez le littéral pour qu'il soit un `long` :
      ```java
      long populationMondiale = 8_000_000_000___;
      ```
    blanks: [[L, l]]
    answer: Sans suffixe, le littéral serait un `int`, trop petit.
  - key: trous-hexa
    format: fill-in
    question: |-
      Complétez pour écrire 255 en hexadécimal :
      ```java
      int max = ___FF;
      ```
    blanks: [["0x", "0X"]]
    answer: Le préfixe `0x` introduit l'hexadécimal.
  - key: trous-separateur
    format: fill-in
    question: |-
      Complétez pour écrire un million lisiblement :
      ```java
      int million = 1___000___000;
      ```
    blanks: [[_], [_]]
    answer: Le séparateur `_` regroupe les chiffres par milliers.
  - key: trous-guillemet
    format: fill-in
    question: |-
      Complétez pour afficher : Il a dit "bonjour"
      ```java
      System.out.println("Il a dit ___bonjour___");
      ```
    blanks: [["\\\""], ["\\\""]]
    answer: '`\"` insère un guillemet sans fermer la chaîne.'
  - key: code-system-out-println-017
    format: code-output
    question: '`System.out.println(017);`'
    answer: '`15` : un littéral commençant par 0 est en octal.'
    check:
      code: |-
        System.out.println(017);
      output: "15"
  - key: code-bases
    format: code-output
    question: |-
      ```java
      System.out.println(0x10 + 0b10 + 010);
      ```
    answer: '`26` : 16 (hexadécimal) + 2 (binaire) + 8 (octal).'
    check:
      output: "26"
  - key: code-exposant
    format: code-output
    question: |-
      ```java
      System.out.println(1e3 + " " + 2.5e-1);
      ```
    answer: '`1000.0 0.25` : des littéraux `double` avec exposant.'
    check:
      output: "1000.0 0.25"
  - key: code-bloc-de-texte
    format: code-output
    question: |-
      ```java
      String json = """
          {"nom": "Ada"}
          """;
      System.out.print(json);
      ```
    answer: '`{"nom": "Ada"}` : l''indentation commune est retirée, et le bloc se termine par un retour à la ligne.'
    check:
      output: '{"nom": "Ada"}'
  - key: bug-octal
    format: bug-fix
    question: |-
      Le code d'accès 0123 n'est jamais reconnu :
      ```java
      int codeAttendu = 0123;
      if (saisie == codeAttendu) {
          ouvrir();
      }
      ```
    answer: |-
      ```java
      String codeAttendu = "0123";
      if (saisie.equals(codeAttendu)) {
          ouvrir();
      }
      ```
      `0123` est un octal, qui vaut 83. Un code avec des zéros significatifs est un texte, pas un nombre.
  - key: bug-long-sans-suffixe
    format: bug-fix
    question: |-
      Ce code ne compile pas (`integer number too large`) :
      ```java
      long octets = 5000000000;
      ```
    answer: |-
      ```java
      long octets = 5_000_000_000L;
      ```
      Sans suffixe, le littéral est un `int`, trop petit pour 5 milliards.
  - key: bug-chemin-windows
    format: bug-fix
    question: |-
      Ce code ne compile pas (`illegal escape character`) :
      ```java
      String chemin = "C:\dossier\fichier.txt";
      ```
    answer: |-
      ```java
      String chemin = "C:\\dossier\\fichier.txt";
      ```
      `\d` n'est pas une séquence d'échappement valide : une barre oblique inverse s'écrit `\\`. (Ou mieux,
      `Path.of("C:", "dossier", "fichier.txt")`.)
  - key: bug-concatenation-multiligne
    format: bug-fix
    question: |-
      Rendez cette requête SQL lisible :
      ```java
      String sql = "SELECT nom, email\n" +
                   "FROM client\n" +
                   "WHERE actif = true\n";
      ```
    answer: |-
      ```java
      String sql = """
          SELECT nom, email
          FROM client
          WHERE actif = true
          """;
      ```
      Un bloc de texte (Java 15) garde la mise en forme, sans `\n` ni concaténation.
