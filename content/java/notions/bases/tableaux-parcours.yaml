notion: tableaux-parcours
lesson: |-
  Deux façons de parcourir un tableau :

  ```java
  int[] t = {4, 8, 15};

  for (int i = 0; i < t.length; i++) {   // avec l'indice : lire, écrire, comparer des voisins
      t[i] = t[i] * 2;
  }

  for (int x : t) {                      // sans indice : seulement lire
      System.out.println(x);
  }
  ```

  - Les indices valides vont de **0 à `length - 1`**. Lire ou écrire en dehors lève une
    **`ArrayIndexOutOfBoundsException`**, avec l'indice fautif dans le message.
  - Les calculs classiques se font en un passage : somme, maximum, recherche, comptage.
  - Pour le maximum, on part du **premier élément**, pas de 0 : sinon, un tableau de négatifs donnerait 0.
  - Un tableau vide (`length == 0`) n'a pas de premier élément : on le traite avant.

  **Piège classique** : `for (int i = 0; i <= t.length; i++)`. Le dernier tour lit `t[t.length]`, qui n'existe pas.

  **En entretien** : « On parcourt de 0 inclus à `length` exclu ; for-each pour lire, `for` indexé pour écrire ou
  comparer des positions. »
cards:
  - key: indices-valides
    format: course
    question: Quels sont les indices valides d'un tableau de longueur `n` ?
    answer: De `0` à `n - 1` ; tout autre indice lève une `ArrayIndexOutOfBoundsException`.
  - key: exception-hors-bornes
    format: course
    question: Que se passe-t-il quand on lit `t[t.length]` ?
    answer: Une `ArrayIndexOutOfBoundsException`, dont le message donne l'indice demandé et la longueur du tableau.
  - key: maximum
    format: course
    question: Pourquoi initialiser le maximum avec le premier élément plutôt qu'avec 0 ?
    answer: Parce qu'un tableau ne contenant que des négatifs donnerait 0, une valeur qui n'y figure pas.
  - key: indexe-ou-for-each
    format: course
    question: Quand faut-il un `for` indexé plutôt qu'un for-each pour parcourir un tableau ?
    answer: Pour **modifier** les cases, connaître la **position**, comparer des **voisins** ou parcourir à **rebours**.
  - key: vf-exception
    format: true-false
    question: Lire `t[-1]` lève une `ArrayIndexOutOfBoundsException`.
    truth: true
    answer: Il n'y a pas d'indice négatif en Java (contrairement à Python).
  - key: vf-for-each-ecrit
    format: true-false
    question: Un for-each permet de modifier les cases d'un tableau de `int`.
    truth: false
    answer: La variable du for-each est une copie de la case ; pour écrire, il faut l'indice.
  - key: vf-maximum-zero
    format: true-false
    question: "Pour le maximum de `{-5, -2, -9}`, partir de `int max = 0;` donne le bon résultat."
    truth: false
    answer: On obtiendrait 0 ; il faut partir de `t[0]`, ici -5, pour trouver -2.
  - key: vf-vide
    format: true-false
    question: "`t[0]` sur un tableau vide lève une exception."
    truth: true
    answer: Un tableau de longueur 0 n'a aucune case ; on teste `t.length == 0` avant.
  - key: qcm-boucle-correcte
    format: multiple-choice
    question: Quelle boucle double chaque case du tableau `t` ?
    choices:
      - text: "`for (int i = 0; i < t.length; i++) t[i] *= 2;`"
        correct: true
      - text: "`for (int x : t) x *= 2;`"
        correct: false
      - text: "`for (int i = 0; i <= t.length; i++) t[i] *= 2;`"
        correct: false
      - text: "`for (int i = 1; i < t.length; i++) t[i] *= 2;`"
        correct: false
    answer: Il faut l'indice pour écrire, de 0 à `length` exclu.
  - key: qcm-derniere-case
    format: multiple-choice
    question: Comment lire la dernière case du tableau `t` ?
    choices:
      - text: "`t[t.length - 1]`"
        correct: true
      - text: "`t[t.length]`"
        correct: false
      - text: "`t[-1]`"
        correct: false
      - text: "`t.last()`"
        correct: false
    answer: Le dernier indice est `length - 1`.
  - key: qcm-exception
    format: multiple-choice
    question: Quelle exception lève un accès hors des bornes d'un tableau ?
    choices:
      - text: "`ArrayIndexOutOfBoundsException`"
        correct: true
      - text: "`NullPointerException`"
        correct: false
      - text: "`IllegalArgumentException`"
        correct: false
      - text: "`ArithmeticException`"
        correct: false
    answer: Son message indique l'indice demandé et la longueur.
  - key: qcm-voisins
    format: multiple-choice
    question: Pour vérifier qu'un tableau est trié, on compare `t[i]` et `t[i + 1]`. Quelle borne utiliser ?
    choices:
      - text: "`i < t.length - 1`"
        correct: true
      - text: "`i < t.length`"
        correct: false
      - text: "`i <= t.length`"
        correct: false
      - text: "`i < t.length + 1`"
        correct: false
    answer: Le dernier `i` doit laisser une case après lui pour `t[i + 1]`.
  - key: trous-somme
    format: fill-in
    question: |-
      Complétez pour additionner les cases :
      ```java
      int somme = 0;
      for (int i = 0; i < t.___; i++) {
          somme += t[___];
      }
      ```
    blanks: [[length], [i]]
    answer: On parcourt toutes les cases par leur indice.
  - key: trous-max
    format: fill-in
    question: |-
      Complétez la recherche du maximum :
      ```java
      int max = t[0];
      for (int x : t) {
          if (x ___ max) {
              max = x;
          }
      }
      ```
    blanks: [[">"]]
    answer: On garde la valeur si elle dépasse le maximum courant.
  - key: trous-dernier
    format: fill-in
    question: |-
      Complétez pour lire la dernière case :
      ```java
      int dernier = t[t.length ___ 1];
      ```
    blanks: [["-"]]
    answer: Le dernier indice est `length - 1`.
  - key: trous-rebours
    format: fill-in
    question: |-
      Complétez pour parcourir le tableau à rebours :
      ```java
      for (int i = t.length - 1; i >= ___; i--) {
          System.out.print(t[i]);
      }
      ```
    blanks: [["0"]]
    answer: On descend jusqu'à l'indice 0 inclus.
  - key: code-doubler
    format: code-output
    question: |-
      ```java
      int[] t = {1, 2, 3};
      for (int i = 0; i < t.length; i++) {
          t[i] = t[i] * 2;
      }
      System.out.println(Arrays.toString(t));
      ```
    answer: '`[2, 4, 6]` : chaque case est doublée en place.'
    check:
      output: "[2, 4, 6]"
  - key: code-max-negatifs
    format: code-output
    question: |-
      ```java
      int[] t = {-5, -2, -9};
      int max = t[0];
      for (int x : t) {
          if (x > max) {
              max = x;
          }
      }
      System.out.println(max);
      ```
    answer: '`-2` : on part du premier élément, et -2 est le plus grand.'
    check:
      output: "-2"
  - key: code-hors-bornes
    format: code-output
    question: |-
      ```java
      int[] t = new int[3];
      t[3] = 1;
      ```
    answer: "Une `ArrayIndexOutOfBoundsException` : les indices valides vont de 0 à 2."
    check:
      throws: ArrayIndexOutOfBoundsException
  - key: code-rebours
    format: code-output
    question: |-
      ```java
      char[] lettres = {'a', 'b', 'c'};
      for (int i = lettres.length - 1; i >= 0; i--) {
          System.out.print(lettres[i]);
      }
      ```
    answer: '`cba` : on parcourt du dernier indice jusqu''à 0.'
    check:
      output: "cba"
  - key: bug-depassement
    format: bug-fix
    question: |-
      Cette boucle lève une `ArrayIndexOutOfBoundsException` :
      ```java
      for (int i = 0; i <= temperatures.length; i++) {
          somme += temperatures[i];
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < temperatures.length; i++) {
      ```
      `<=` fait un tour de trop : le dernier indice est `length - 1`.
  - key: bug-max-zero
    format: bug-fix
    question: |-
      Le maximum de températures toutes négatives vaut 0 :
      ```java
      int max = 0;
      for (int t : temperatures) {
          if (t > max) {
              max = t;
          }
      }
      ```
    answer: |-
      ```java
      int max = temperatures[0];
      ```
      On part d'une vraie valeur du tableau (après avoir vérifié qu'il n'est pas vide).
  - key: bug-for-each-ecriture
    format: bug-fix
    question: |-
      On veut remettre les compteurs à zéro, mais le tableau ne change pas :
      ```java
      for (int c : compteurs) {
          c = 0;
      }
      ```
    answer: |-
      ```java
      Arrays.fill(compteurs, 0);
      ```
      La variable du for-each est une copie ; `Arrays.fill` (ou un `for` indexé) écrit dans le tableau.
  - key: bug-voisins
    format: bug-fix
    question: |-
      Ce test « le tableau est-il trié ? » lève une exception au dernier tour :
      ```java
      for (int i = 0; i < t.length; i++) {
          if (t[i] > t[i + 1]) {
              return false;
          }
      }
      return true;
      ```
    answer: |-
      ```java
      for (int i = 0; i < t.length - 1; i++) {
      ```
      Au dernier `i`, `t[i + 1]` sort du tableau : on s'arrête un cran plus tôt.
