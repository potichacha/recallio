notion: boucle-for-each
lesson: |-
  La boucle for-each (le « `for` amélioré ») parcourt **chaque élément** d'un tableau ou d'une collection, sans indice :

  ```java
  int[] notes = {12, 15, 9};
  for (int note : notes) {          // « pour chaque note de notes »
      System.out.println(note);
  }

  List<String> noms = List.of("Ada", "Alan");
  for (String nom : noms) {
      System.out.println(nom);
  }
  ```

  - Elle marche sur les tableaux et sur tout ce qui est `Iterable` (`List`, `Set`...). Pas sur une `Map` directement :
    on parcourt `map.entrySet()`, `keySet()` ou `values()`.
  - La variable de boucle est une **copie** de l'élément : lui affecter une valeur ne modifie pas le tableau.
  - On n'a pas l'indice. Pour le connaître, ou pour modifier le tableau à une position, on revient au `for` classique.
  - On ne retire pas d'élément d'une liste pendant qu'on la parcourt ainsi : `ConcurrentModificationException`. On
    utilise `removeIf`.

  **Piège classique** : `for (int note : notes) { note = note + 1; }`. Ça compile, mais le tableau ne change pas :
  seule la copie locale est modifiée.

  **En entretien** : « Le for-each est le choix par défaut pour lire une collection ; dès qu'on a besoin de l'indice ou
  de modifier, on revient au `for` classique ou à `removeIf`. »
tour:
  - title: La boucle for-each
    text: |-
      `for (Type element : collection)` parcourt un tableau ou une collection (tout `Iterable`), élément par élément,
      sans indice. C'est la boucle la plus lisible quand on n'a besoin que des éléments.

      On ne peut pas modifier la collection pendant qu'on la parcourt ainsi (une `ConcurrentModificationException`
      arrive), ni savoir à quel indice on est : pour cela, il reste la boucle `for` classique.
    example:
      files:
        Main.java: |-
          void main() {
              int[] notes = {12, 15, 20};
              int somme = 0;
              for (int note : notes) {
                  somme += note;
              }
              IO.println("somme : " + somme);

              for (String langage : List.of("Java", "Go", "Kotlin")) {
                  IO.println(langage.toUpperCase());
              }
          }
      output: |-
        somme : 47
        JAVA
        GO
        KOTLIN
cards:
  - key: syntaxe
    format: course
    question: Comment s'écrit une boucle for-each sur un tableau `notes` d'entiers ?
    choices:
      - {text: "`for (int note : notes) { ... }`", correct: true}
      - {text: "`for (int note in notes) { ... }`", correct: false}
      - {text: "`foreach (int note : notes) { ... }`", correct: false}
      - {text: "`for (notes : int note) { ... }`", correct: false}
    answer: "`for (int note : notes) { ... }` : à chaque tour, `note` vaut l'élément suivant. `in` et `foreach` viennent d'autres langages."
  - key: sur-quoi
    format: course
    question: Sur quoi peut-on utiliser une boucle for-each ?
    choices:
      - {text: "Sur un tableau et sur tout objet `Iterable` (`List`, `Set`...)", correct: true}
      - {text: "Sur les seules collections : `List`, `Set` et `Map` directement", correct: false}
      - {text: "Sur les seuls tableaux ; une `List` demande un `Iterator`", correct: false}
      - {text: "Sur tout objet qui a une méthode `size()` et `get(int)`", correct: false}
    answer: "Sur un tableau et sur tout objet `Iterable` (`List`, `Set`, `Queue`...). Une `Map` n'est pas `Iterable` : on parcourt `entrySet()`, `keySet()` ou `values()`."
  - key: copie
    format: course
    question: Affecter une valeur à la variable d'un for-each modifie-t-il le tableau ?
    choices:
      - {text: "Non : la variable est une copie de l'élément", correct: true}
      - {text: "Oui : la variable est un alias de la case du tableau", correct: false}
      - {text: "Oui, mais seulement pour un tableau d'objets", correct: false}
      - {text: "Non : le compilateur refuse d'affecter cette variable", correct: false}
    answer: "Non : la variable est une copie de l'élément, et lui affecter une valeur ne change pas le tableau. Le compilateur l'accepte pourtant (sauf si elle est `final`) ; pour modifier le tableau, il faut le `for` classique et l'indice."
  - key: limites
    format: course
    question: Quand le for-each ne suffit-il pas ?
    choices:
      - {text: "Quand il faut l'indice, modifier le tableau ou retirer des éléments", correct: true}
      - {text: "Quand la collection contient plus de quelques milliers d'éléments", correct: false}
      - {text: "Quand on parcourt un `Set`, qui n'a pas d'ordre garanti", correct: false}
      - {text: "Quand les éléments sont des types primitifs comme `int`", correct: false}
    answer: |-
      Quand on a besoin de l'indice (position, voisins, parcours à rebours), quand on veut modifier un tableau, ou
      retirer des éléments d'une liste pendant le parcours (on utilise alors `removeIf` ou un `Iterator`).
  - key: vf-indice
    format: true-false
    question: La boucle for-each donne accès à l'indice de l'élément courant.
    truth: false
    answer: Elle ne donne que l'élément ; pour l'indice, on utilise un `for` classique.
  - key: vf-liste
    format: true-false
    question: On peut parcourir une `List` avec une boucle for-each.
    truth: true
    answer: Toute `List` est `Iterable`.
  - key: vf-map
    format: true-false
    question: "On peut écrire `for (String cle : map)` directement sur une `Map`."
    truth: false
    answer: "Une `Map` n'est pas `Iterable` : on parcourt `map.keySet()`, `map.values()` ou `map.entrySet()`."
  - key: vf-modifier-copie
    format: true-false
    question: "Dans `for (int n : tableau) { n = 0; }`, le tableau est remis à zéro."
    truth: false
    answer: '`n` est une copie de chaque élément : le tableau ne change pas.'
  - key: qcm-syntaxe
    format: multiple-choice
    question: Quelle boucle parcourt la liste `noms` (une `List<String>`) ?
    choices:
      - {text: "`for (String nom : noms)`", correct: true}
      - {text: "`for (String nom : noms.length)`", correct: false}
      - {text: "`for (String nom in noms)`", correct: false}
      - {text: "`foreach (String nom : noms)`", correct: false}
    answer: "Le for-each utilise `:` suivi de la collection elle-même ; `in` et `foreach` viennent d'autres langages, et une `List` n'a pas de champ `length`. `for (var nom : noms)` marcherait aussi."
  - key: qcm-besoin-indice
    format: multiple-choice
    question: Pour afficher « 1. Ada », « 2. Alan »... à partir d'un tableau de noms, quelle boucle choisir ?
    choices:
      - text: "Un `for` classique, pour avoir l'indice"
        correct: true
      - text: "Un for-each"
        correct: false
      - text: "Un `do-while` sans compteur"
        correct: false
      - text: "Un `switch`"
        correct: false
    answer: Le numéro vient de l'indice (`i + 1`), que le for-each ne fournit pas.
  - key: qcm-parcourir-map
    format: multiple-choice
    question: Comment parcourir les couples clé-valeur d'une `Map<String, Integer> stock` ?
    choices:
      - text: "`for (Map.Entry<String, Integer> e : stock.entrySet())`"
        correct: true
      - text: "`for (String cle : stock)`"
        correct: false
      - text: "`for (int i = 0; i < stock.size(); i++) stock.get(i)`"
        correct: false
      - text: "`for (Integer v : stock.keySet())`"
        correct: false
    answer: '`entrySet()` donne les couples ; `keySet()` contient les clés (des `String` ici), `values()` les valeurs.'
  - key: qcm-retirer
    format: multiple-choice
    question: Comment retirer les chaînes vides d'une `List<String>` modifiable ?
    choices:
      - text: "`liste.removeIf(String::isEmpty)`"
        correct: true
      - text: "Un for-each qui appelle `liste.remove(s)`"
        correct: false
      - text: "`for (String s : liste) s = null;`"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: Retirer pendant un for-each lève une `ConcurrentModificationException` ; `removeIf` est fait pour ça.
  - key: trous-for-each
    format: fill-in
    question: |-
      Complète pour afficher chaque prénom :
      ```java
      for (String prenom ___ prenoms) {
          System.out.println(prenom);
      }
      ```
    blanks: [[":"]]
    answer: Les deux-points se lisent « dans ».
  - key: trous-type
    format: fill-in
    question: |-
      `prix` est un tableau de `double`. Complète :
      ```java
      for (___ p : prix) {
          total += p;
      }
      ```
    blanks: [[double, var]]
    answer: Le type de la variable est celui des éléments.
  - key: trous-entry-set
    format: fill-in
    question: |-
      Complète pour parcourir les couples clé-valeur :
      ```java
      for (Map.Entry<String, Integer> e : stock.___()) {
          System.out.println(e.getKey() + " : " + e.getValue());
      }
      ```
    blanks: [[entrySet]]
    answer: '`entrySet()` renvoie les entrées (clé et valeur) de la `Map`.'
  - key: trous-compter
    format: fill-in
    question: |-
      Complète pour compter les notes au-dessus de la moyenne :
      ```java
      int admis = 0;
      for (int note : notes) {
          if (note >= 10) {
              admis___;
          }
      }
      ```
    blanks: [["++", "+= 1"]]
    answer: On incrémente le compteur pour chaque note retenue.
  - key: code-somme
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] notes = {12, 15, 9};
      int somme = 0;
      for (int note : notes) {
          somme += note;
      }
      System.out.println(somme);
      ```
    choices:
      - {text: "`36`", correct: true}
      - {text: "`121509`", correct: false}
      - {text: "`12`", correct: false}
      - {text: "`27`", correct: false}
    answer: "`36` : 12 + 15 + 9. `somme` est un `int`, donc `+=` additionne."
    check:
      output: "36"
  - key: code-copie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] t = {1, 2, 3};
      for (int x : t) {
          x = x * 10;
      }
      System.out.println(t[0]);
      ```
    choices:
      - {text: "`1`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`30`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`1` : `x` est une copie de chaque élément ; la multiplier ne change pas le tableau, et `t[0]` vaut toujours 1."
    check:
      output: "1"
  - key: code-liste
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> noms = List.of("Ada", "Alan", "Grace");
      for (String nom : noms) {
          System.out.print(nom.charAt(0));
      }
      ```
    choices:
      - {text: "`AAG`", correct: true}
      - {text: "`Ada`", correct: false}
      - {text: "`A A G`", correct: false}
      - {text: "`aag`", correct: false}
    answer: "`AAG` : la première lettre de chaque nom, avec `print`, donc sans espace ni retour à la ligne."
    check:
      output: "AAG"
  - key: code-remove-pendant
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> l = new ArrayList<>(List.of("a", "b", "c"));
      for (String s : l) {
          if (s.equals("a")) {
              l.remove(s);
          }
      }
      ```
    choices:
      - {text: "Une `ConcurrentModificationException`", correct: true}
      - {text: "Rien : `a` est retiré sans erreur", correct: false}
      - {text: "Une `IndexOutOfBoundsException`", correct: false}
      - {text: "Une `UnsupportedOperationException`", correct: false}
    answer: "Une `ConcurrentModificationException` : la liste a changé pendant le parcours, et l'itérateur caché du for-each le détecte au tour suivant. `UnsupportedOperationException` viendrait d'une liste immuable, mais `new ArrayList<>(...)` est modifiable."
    check:
      throws: ConcurrentModificationException
  - key: bug-modifier-copie
    format: bug-fix
    question: |-
      On veut appliquer une remise de 10 % à chaque prix, mais le tableau ne change pas. Quelle correction est la bonne ?
      ```java
      for (double p : prix) {
          p = p * 0.9;
      }
      ```
    choices:
      - {text: "Un `for` classique qui écrit `prix[i] = prix[i] * 0.9`", correct: true}
      - {text: "Déclarer la variable `final double p` dans le for-each", correct: false}
      - {text: "Écrire `p *= 0.9` au lieu de `p = p * 0.9`", correct: false}
      - {text: "Remplacer `double p` par `Double p`, un objet", correct: false}
    answer: |-
      ```java
      for (int i = 0; i < prix.length; i++) {
          prix[i] = prix[i] * 0.9;
      }
      ```
      La variable du for-each est une copie ; pour écrire dans le tableau, il faut l'indice.
  - key: bug-map-directe
    format: bug-fix
    question: |-
      Ce code ne compile pas (`for-each not applicable to expression type`). Quelle correction est la bonne ?
      ```java
      Map<String, Integer> stock = chargerStock();
      for (String article : stock) {
          System.out.println(article);
      }
      ```
    choices:
      - {text: "Parcourir `stock.keySet()` au lieu de `stock`", correct: true}
      - {text: "Parcourir `stock.values()` au lieu de `stock`", correct: false}
      - {text: "Déclarer `var article` au lieu de `String article`", correct: false}
      - {text: "Parcourir `stock.size()` au lieu de `stock`", correct: false}
    answer: |-
      ```java
      for (String article : stock.keySet()) {
          System.out.println(article);
      }
      ```
      Une `Map` n'est pas `Iterable` : on parcourt ses clés, ses valeurs ou ses entrées. `values()` compilerait, mais donnerait des `Integer`, pas les articles.
  - key: bug-retirer-pendant
    format: bug-fix
    question: |-
      Ce code lève une `ConcurrentModificationException`. Quelle correction est la bonne ?
      ```java
      for (Commande c : commandes) {
          if (c.estAnnulee()) {
              commandes.remove(c);
          }
      }
      ```
    choices:
      - {text: "`commandes.removeIf(Commande::estAnnulee);`", correct: true}
      - {text: "Entourer `commandes.remove(c)` d'un `try`/`catch`", correct: false}
      - {text: "Déclarer la liste avec `List.of(...)`", correct: false}
      - {text: "Ajouter `continue;` après `commandes.remove(c)`", correct: false}
    answer: |-
      ```java
      commandes.removeIf(Commande::estAnnulee);
      ```
      On ne modifie pas une liste pendant qu'on la parcourt en for-each ; `removeIf` retire proprement.
  - key: bug-indice-necessaire
    format: bug-fix
    question: |-
      Ce code ne compile pas : on veut afficher la position de chaque joueur. Quelle correction est la bonne ?
      ```java
      for (String joueur : joueurs) {
          System.out.println((i + 1) + ". " + joueur);
      }
      ```
    choices:
      - {text: "Un `for` classique sur `i`, qui affiche `joueurs[i]`", correct: true}
      - {text: "Déclarer `int i` dans les parenthèses du for-each", correct: false}
      - {text: "Utiliser `joueur.index()` à la place de `i`", correct: false}
      - {text: "Remplacer `String joueur` par `var joueur`", correct: false}
    answer: |-
      ```java
      for (int i = 0; i < joueurs.length; i++) {
          System.out.println((i + 1) + ". " + joueurs[i]);
      }
      ```
      Le for-each n'a pas d'indice ; quand on en a besoin, on écrit un `for` classique.
