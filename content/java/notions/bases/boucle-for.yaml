notion: boucle-for
lesson: |-
  La boucle `for` réunit sur une ligne les trois parties d'une boucle qui **compte** :

  ```java
  for (int i = 0; i < 5; i++) {
      System.out.println(i);     // 0, 1, 2, 3, 4
  }
  // initialisation ; condition (testée avant chaque tour) ; mise à jour (après chaque tour)
  ```

  - On compte en général **à partir de 0** et **strictement en dessous** de la taille : `i < tableau.length`. Ce
    schéma donne exactement `length` tours et ne déborde pas.
  - La variable `i` n'existe que dans la boucle.
  - On peut compter à rebours (`i--`), par pas (`i += 2`), ou ne rien mettre : `for (;;)` est une boucle infinie.
  - Pour simplement parcourir les éléments d'un tableau ou d'une liste sans avoir besoin de l'indice, la boucle
    for-each est plus lisible.

  **Piège classique** : l'erreur « à un près » (*off-by-one*). `i <= tableau.length` fait un tour de trop et lève une
  `ArrayIndexOutOfBoundsException` ; `i = 1` saute le premier élément.

  **En entretien** : « Un `for` classique pour compter ou quand on a besoin de l'indice ; de 0 inclus à `length`
  exclu. »
tour:
  - title: La boucle for
    text: |-
      `for (initialisation; condition; mise à jour)` regroupe sur une ligne les trois éléments d'une boucle à compteur :
      `for (int i = 0; i < 3; i++)`. La variable de l'initialisation n'existe que dans la boucle.

      On peut avoir plusieurs variables, `for (int i = 0, j = 4; i < j; i++, j--)`, ou omettre une partie : `for (;;)`
      est une boucle infinie.
    example:
      files:
        Main.java: |-
          void main() {
              for (int i = 0; i < 3; i++) {
                  IO.println("tour " + i);
              }
              for (int i = 0, j = 4; i < j; i++, j--) {
                  IO.println(i + " " + j);
              }
          }
      output: |-
        tour 0
        tour 1
        tour 2
        0 4
        1 3
    task:
      instructions: |-
        Avec une boucle `for`, calcule la factorielle de 10 (le produit des entiers de 1 à 10) : le programme doit
        afficher `3628800`.
      starter:
        Main.java: |-
          void main() {
              long factorielle = 1;
              IO.println(factorielle);
          }
      solution:
        Main.java: |-
          void main() {
              long factorielle = 1;
              for (int i = 2; i <= 10; i++) {
                  factorielle *= i;
              }
              IO.println(factorielle);
          }
      output: |-
        3628800
cards:
  - key: trois-parties
    format: course
    question: Quelles sont les trois parties d'une boucle `for` ?
    choices:
      - {text: "L'initialisation, la condition et la mise à jour", correct: true}
      - {text: "La déclaration, le corps de la boucle et le `return`", correct: false}
      - {text: "La condition, le corps de la boucle et le `break`", correct: false}
      - {text: "Le compteur, la valeur maximale et le pas, fixé à 1", correct: false}
    answer: |-
      L'**initialisation** (`int i = 0`, une fois au début), la **condition** (testée avant chaque tour) et la **mise à
      jour** (`i++`, après chaque tour).
  - key: bornes-classiques
    format: course
    question: Pourquoi écrit-on `for (int i = 0; i < n; i++)` plutôt que `i <= n` ?
    choices:
      - {text: "Les indices vont de 0 à `n - 1` : `i < n` fait exactement `n` tours", correct: true}
      - {text: "`<` est plus rapide à évaluer que `<=` pour la JVM", correct: false}
      - {text: "`<=` est refusé par le compilateur dans la condition d'un `for`", correct: false}
      - {text: "`i <= n` fait un tour de moins et rate le dernier élément", correct: false}
    answer: "Les indices vont de 0 à `n - 1` : `i < n` fait exactement `n` tours, sans dépasser le dernier indice. `i <= n` en fait un de trop, pas un de moins."
  - key: off-by-one
    format: course
    question: Qu'est-ce qu'une erreur « à un près » (*off-by-one*) ?
    choices:
      - {text: "Une boucle qui fait un tour de trop ou de moins, à cause d'une borne", correct: true}
      - {text: "Un calcul décimal faux d'une unité, à cause de l'arrondi des `double`", correct: false}
      - {text: "Un entier qui dépasse sa valeur maximale et repart au minimum", correct: false}
      - {text: "Un compteur incrémenté par `i++` alors qu'il fallait `++i`", correct: false}
    answer: |-
      Une boucle qui fait un tour de trop ou de moins à cause d'une borne mal choisie (`<=` au lieu de `<`, départ à
      1 au lieu de 0). Sur un tableau, le tour de trop lève une `ArrayIndexOutOfBoundsException`.
  - key: for-ou-for-each
    format: course
    question: Quand préférer un `for` classique à un for-each ?
    choices:
      - {text: "Quand on a besoin de l'indice : voisins, rebours, écriture à une position", correct: true}
      - {text: "Toujours, car le for-each est plus lent : il crée un itérateur", correct: false}
      - {text: "Quand on parcourt une `List` plutôt qu'un tableau", correct: false}
      - {text: "Quand la collection peut contenir des valeurs `null`", correct: false}
    answer: "Quand on a besoin de l'**indice** (comparer deux éléments voisins, parcourir à rebours, modifier un tableau à une position). Sinon, le for-each est plus lisible, et sur un tableau il ne crée même pas d'itérateur."
  - key: vf-nombre-de-tours
    format: true-false
    question: "`for (int i = 0; i < 5; i++)` fait 5 tours."
    truth: true
    answer: '`i` prend les valeurs 0, 1, 2, 3 et 4.'
  - key: vf-i-apres
    format: true-false
    question: Après la boucle `for (int i = 0; ...)`, on peut encore utiliser `i`.
    truth: false
    answer: '`i` n''existe que dans la boucle.'
  - key: vf-condition-avant
    format: true-false
    question: La condition d'un `for` est testée avant le premier tour.
    truth: true
    answer: Si elle est fausse dès le départ, la boucle ne fait aucun tour.
  - key: vf-for-vide
    format: true-false
    question: "`for (;;) { }` ne compile pas."
    truth: false
    answer: "Les trois parties sont facultatives : `for (;;)` est une boucle infinie."
  - key: qcm-indices
    format: multiple-choice
    question: Quelle boucle parcourt tous les indices d'un tableau `t` ?
    choices:
      - text: "`for (int i = 0; i < t.length; i++)`"
        correct: true
      - text: "`for (int i = 0; i <= t.length; i++)`"
        correct: false
      - text: "`for (int i = 1; i < t.length; i++)`"
        correct: false
      - text: "`for (int i = 1; i <= t.length; i++)`"
        correct: false
    answer: Les indices vont de 0 à `t.length - 1`.
  - key: qcm-a-rebours
    format: multiple-choice
    question: Quelle boucle affiche 3, 2, 1 ?
    choices:
      - {text: "`for (int i = 3; i >= 1; i--)`", correct: true}
      - {text: "`for (int i = 3; i > 1; i--)`", correct: false}
      - {text: "`for (int i = 3; i >= 1; i++)`", correct: false}
      - {text: "`for (int i = 1; i <= 3; i--)`", correct: false}
    answer: "On part de 3 et on décrémente jusqu'à 1 inclus. `i > 1` s'arrête après 2 ; `i++` ne descend jamais ; partir de 1 avec `i--` ne monte jamais jusqu'à 3."
  - key: qcm-pas-de-deux
    format: multiple-choice
    question: Quelles valeurs prend `i` dans `for (int i = 0; i < 7; i += 2)` ?
    choices:
      - text: "0, 2, 4, 6"
        correct: true
      - text: "0, 2, 4, 6, 8"
        correct: false
      - text: "2, 4, 6"
        correct: false
      - text: "0, 1, 2, 3, 4, 5, 6"
        correct: false
    answer: '`i` augmente de 2 à chaque tour, tant qu''il reste inférieur à 7.'
  - key: qcm-ordre
    format: multiple-choice
    question: Dans quel ordre s'exécutent les parties d'un `for`, à chaque tour ?
    choices:
      - text: "Condition, corps, mise à jour"
        correct: true
      - text: "Mise à jour, condition, corps"
        correct: false
      - text: "Corps, condition, mise à jour"
        correct: false
      - text: "Corps, mise à jour, condition"
        correct: false
    answer: L'initialisation une fois, puis à chaque tour la condition, le corps, et la mise à jour.
  - key: trous-for-classique
    format: fill-in
    question: |-
      Complète pour afficher 0, 1, 2, 3, 4 :
      ```java
      for (int i = 0; i ___ 5; i___) {
          System.out.println(i);
      }
      ```
    blanks: [["<"], ["++"]]
    answer: De 0 inclus à 5 exclu, en ajoutant 1 à chaque tour.
  - key: trous-longueur
    format: fill-in
    question: |-
      Complète pour parcourir tout le tableau `notes` :
      ```java
      for (int i = 0; i < notes.___; i++) {
      }
      ```
    blanks: [[length]]
    answer: '`length` est la taille du tableau (un champ, sans parenthèses).'
  - key: trous-somme
    format: fill-in
    question: |-
      Complète pour additionner les entiers de 1 à 10 :
      ```java
      int somme = 0;
      for (int i = 1; i <= 10; i++) {
          somme ___ i;
      }
      ```
    blanks: [["+="]]
    answer: '`somme += i` ajoute `i` à la somme à chaque tour.'
  - key: trous-rebours
    format: fill-in
    question: |-
      Complète pour afficher 10, 9, ..., 1 :
      ```java
      for (int i = 10; i >= 1; i___) {
          System.out.println(i);
      }
      ```
    blanks: [["--"]]
    answer: On décrémente à chaque tour.
  - key: code-somme
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int somme = 0;
      for (int i = 1; i <= 4; i++) {
          somme += i;
      }
      System.out.println(somme);
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`1234`", correct: false}
    answer: "`10` : 1 + 2 + 3 + 4. La borne `i <= 4` inclut 4 ; `somme` est un `int`, donc `+=` additionne au lieu de concaténer."
    check:
      output: "10"
  - key: code-pas
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      for (int i = 0; i < 10; i += 3) {
          System.out.print(i + " ");
      }
      ```
    choices:
      - {text: "`0 3 6 9`", correct: true}
      - {text: "`0 3 6`", correct: false}
      - {text: "`3 6 9`", correct: false}
      - {text: "`0 3 6 9 12`", correct: false}
    answer: "`0 3 6 9` : `i` part de 0 et augmente de 3 tant qu'il reste inférieur à 10. 9 passe encore, 12 non."
    check:
      output: "0 3 6 9"
  - key: code-aucun-tour
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      for (int i = 5; i < 5; i++) {
          System.out.println("tour");
      }
      System.out.println("fin");
      ```
    choices:
      - {text: "`fin`", correct: true}
      - text: |-
          ```
          tour
          fin
          ```
        correct: false
      - text: |-
          ```
          tour
          tour
          tour
          tour
          tour
          fin
          ```
        correct: false
      - {text: "Rien", correct: false}
    answer: "`fin` : la condition `5 < 5` est fausse dès le départ, le corps ne s'exécute jamais. La ligne d'après, elle, s'exécute."
    check:
      output: "fin"
  - key: code-depassement
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] t = {1, 2, 3};
      for (int i = 0; i <= t.length; i++) {
          System.out.print(t[i]);
      }
      ```
    choices:
      - {text: "`123`, puis une `ArrayIndexOutOfBoundsException`", correct: true}
      - {text: "`123`", correct: false}
      - {text: "`1230`", correct: false}
      - {text: "Une `ArrayIndexOutOfBoundsException`, avant tout affichage", correct: false}
    answer: "`123` puis une `ArrayIndexOutOfBoundsException` : les trois premiers tours affichent, et le tour `i = 3` lit au-delà du dernier indice (2). Java ne renvoie jamais 0 pour une case absente."
    check:
      output: "123"
      throws: ArrayIndexOutOfBoundsException
  - key: bug-inferieur-ou-egal
    format: bug-fix
    question: |-
      Cette boucle lève une `ArrayIndexOutOfBoundsException`. Quelle correction est la bonne ?
      ```java
      for (int i = 0; i <= prix.length; i++) {
          total += prix[i];
      }
      ```
    choices:
      - {text: "Remplacer `i <= prix.length` par `i < prix.length`", correct: true}
      - {text: "Remplacer `i <= prix.length` par `i <= prix.length + 1`", correct: false}
      - {text: "Faire partir la boucle de `i = 1` au lieu de `i = 0`", correct: false}
      - {text: "Remplacer `prix.length` par `prix.length()`", correct: false}
    answer: |-
      ```java
      for (int i = 0; i < prix.length; i++) {
          total += prix[i];
      }
      ```
      Le dernier indice est `length - 1` : `<=` fait un tour de trop.
  - key: bug-depart-a-un
    format: bug-fix
    question: |-
      Le premier élément n'est jamais affiché. Quelle correction est la bonne ?
      ```java
      for (int i = 1; i < noms.length; i++) {
          System.out.println(noms[i]);
      }
      ```
    choices:
      - {text: "Faire partir la boucle de `i = 0`", correct: true}
      - {text: "Remplacer `i < noms.length` par `i <= noms.length`", correct: false}
      - {text: "Afficher `noms[i - 1]` au lieu de `noms[i]`", correct: false}
      - {text: "Remplacer `i++` par `++i`", correct: false}
    answer: |-
      ```java
      for (int i = 0; i < noms.length; i++) {
          System.out.println(noms[i]);
      }
      ```
      Les indices commencent à 0. Afficher `noms[i - 1]` montrerait bien le premier, mais plus le dernier.
  - key: bug-mauvaise-variable
    format: bug-fix
    question: |-
      Cette boucle ne s'arrête jamais. Pourquoi ?
      ```java
      for (int i = 0; i < 10; j++) {
          System.out.println(i);
      }
      ```
    choices:
      - {text: "La mise à jour incrémente `j` au lieu de `i`, qui reste à 0", correct: true}
      - {text: "La condition devrait être `i <= 10` pour finir", correct: false}
      - {text: "`println` remet `i` à 0 à chaque tour", correct: false}
      - {text: "`i` est déclarée dans le `for` et repart de 0 à chaque tour", correct: false}
    answer: |-
      ```java
      for (int i = 0; i < 10; i++) {
      ```
      On incrémentait une autre variable (`j`, déclarée ailleurs) : `i` restait à 0 et la condition `i < 10` restait vraie.
  - key: bug-point-virgule
    format: bug-fix
    question: |-
      Ce code n'affiche qu'une ligne, `5`, au lieu de 0 à 4. Pourquoi ?
      ```java
      int i;
      for (i = 0; i < 5; i++); {
          System.out.println(i);
      }
      ```
    choices:
      - {text: "Le `;` après le `for` lui donne un corps vide : le bloc ne s'exécute qu'après", correct: true}
      - {text: "`i` est déclarée hors du `for`, donc la boucle ne la modifie pas", correct: false}
      - {text: "Les accolades d'un bloc ne peuvent pas suivre un `for` sur la même ligne", correct: false}
      - {text: "`println` n'affiche que la dernière valeur d'une variable de boucle", correct: false}
    answer: |-
      ```java
      for (int i = 0; i < 5; i++) {
          System.out.println(i);
      }
      ```
      Le `;` donne au `for` un corps vide : la boucle tourne seule, puis le bloc s'exécute une fois avec `i` à 5.
