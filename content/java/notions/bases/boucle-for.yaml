notion: boucle-for
lesson: |-
  La boucle `for` réunit sur une ligne les trois parties d'une boucle qui **compte** :

  ```java
  for (int i = 0; i < 5; i++) {
      System.out.println(i);     // 0, 1, 2, 3, 4
  }
  // initialisation ; condition (testée avant chaque tour) ; mise à jour (après chaque tour)
  ```

  - On compte en général **à partir de 0** et **strictement en dessous** de la taille : `i < tableau.length`. Ce
    schéma donne exactement `length` tours et ne déborde pas.
  - La variable `i` n'existe que dans la boucle.
  - On peut compter à rebours (`i--`), par pas (`i += 2`), ou ne rien mettre : `for (;;)` est une boucle infinie.
  - Pour simplement parcourir les éléments d'un tableau ou d'une liste sans avoir besoin de l'indice, la boucle
    for-each est plus lisible.

  **Piège classique** : l'erreur « à un près » (*off-by-one*). `i <= tableau.length` fait un tour de trop et lève une
  `ArrayIndexOutOfBoundsException` ; `i = 1` saute le premier élément.

  **En entretien** : « Un `for` classique pour compter ou quand on a besoin de l'indice ; de 0 inclus à `length`
  exclu. »
cards:
  - key: trois-parties
    format: course
    question: Quelles sont les trois parties d'une boucle `for` ?
    answer: |-
      L'**initialisation** (`int i = 0`, une fois au début), la **condition** (testée avant chaque tour) et la **mise à
      jour** (`i++`, après chaque tour).
  - key: bornes-classiques
    format: course
    question: Pourquoi écrit-on `for (int i = 0; i < n; i++)` plutôt que `i <= n` ?
    answer: "Les indices vont de 0 à `n - 1` : `i < n` fait exactement `n` tours, sans dépasser le dernier indice."
  - key: off-by-one
    format: course
    question: Qu'est-ce qu'une erreur « à un près » (*off-by-one*) ?
    answer: |-
      Une boucle qui fait un tour de trop ou de moins à cause d'une borne mal choisie (`<=` au lieu de `<`, départ à
      1 au lieu de 0). Sur un tableau, le tour de trop lève une `ArrayIndexOutOfBoundsException`.
  - key: for-ou-for-each
    format: course
    question: Quand préférer un `for` classique à un for-each ?
    answer: Quand on a besoin de l'**indice** (comparer deux éléments voisins, parcourir à rebours, modifier un tableau à une position).
  - key: vf-nombre-de-tours
    format: true-false
    question: "`for (int i = 0; i < 5; i++)` fait 5 tours."
    truth: true
    answer: '`i` prend les valeurs 0, 1, 2, 3 et 4.'
  - key: vf-i-apres
    format: true-false
    question: Après la boucle `for (int i = 0; ...)`, on peut encore utiliser `i`.
    truth: false
    answer: '`i` n''existe que dans la boucle.'
  - key: vf-condition-avant
    format: true-false
    question: La condition d'un `for` est testée avant le premier tour.
    truth: true
    answer: Si elle est fausse dès le départ, la boucle ne fait aucun tour.
  - key: vf-for-vide
    format: true-false
    question: "`for (;;) { }` ne compile pas."
    truth: false
    answer: "Les trois parties sont facultatives : `for (;;)` est une boucle infinie."
  - key: qcm-indices
    format: multiple-choice
    question: Quelle boucle parcourt tous les indices d'un tableau `t` ?
    choices:
      - text: "`for (int i = 0; i < t.length; i++)`"
        correct: true
      - text: "`for (int i = 0; i <= t.length; i++)`"
        correct: false
      - text: "`for (int i = 1; i < t.length; i++)`"
        correct: false
      - text: "`for (int i = 1; i <= t.length; i++)`"
        correct: false
    answer: Les indices vont de 0 à `t.length - 1`.
  - key: qcm-a-rebours
    format: multiple-choice
    question: Quelle boucle affiche 3, 2, 1 ?
    choices:
      - text: "`for (int i = 3; i >= 1; i--)`"
        correct: true
      - text: "`for (int i = 3; i > 0; i--)`"
        correct: true
      - text: "`for (int i = 3; i >= 1; i++)`"
        correct: false
      - text: "`for (int i = 1; i <= 3; i--)`"
        correct: false
    answer: On part de 3 et on décrémente jusqu'à 1 inclus.
  - key: qcm-pas-de-deux
    format: multiple-choice
    question: Quelles valeurs prend `i` dans `for (int i = 0; i < 7; i += 2)` ?
    choices:
      - text: "0, 2, 4, 6"
        correct: true
      - text: "0, 2, 4, 6, 8"
        correct: false
      - text: "2, 4, 6"
        correct: false
      - text: "0, 1, 2, 3, 4, 5, 6"
        correct: false
    answer: '`i` augmente de 2 à chaque tour, tant qu''il reste inférieur à 7.'
  - key: qcm-ordre
    format: multiple-choice
    question: Dans quel ordre s'exécutent les parties d'un `for`, à chaque tour ?
    choices:
      - text: "Condition, corps, mise à jour"
        correct: true
      - text: "Mise à jour, condition, corps"
        correct: false
      - text: "Corps, condition, mise à jour"
        correct: false
      - text: "Corps, mise à jour, condition"
        correct: false
    answer: L'initialisation une fois, puis à chaque tour la condition, le corps, et la mise à jour.
  - key: trous-for-classique
    format: fill-in
    question: |-
      Complétez pour afficher 0, 1, 2, 3, 4 :
      ```java
      for (int i = 0; i ___ 5; i___) {
          System.out.println(i);
      }
      ```
    blanks: [["<"], ["++"]]
    answer: De 0 inclus à 5 exclu, en ajoutant 1 à chaque tour.
  - key: trous-longueur
    format: fill-in
    question: |-
      Complétez pour parcourir tout le tableau `notes` :
      ```java
      for (int i = 0; i < notes.___; i++) {
      }
      ```
    blanks: [[length]]
    answer: '`length` est la taille du tableau (un champ, sans parenthèses).'
  - key: trous-somme
    format: fill-in
    question: |-
      Complétez pour additionner les entiers de 1 à 10 :
      ```java
      int somme = 0;
      for (int i = 1; i <= 10; i++) {
          somme ___ i;
      }
      ```
    blanks: [["+="]]
    answer: '`somme += i` ajoute `i` à la somme à chaque tour.'
  - key: trous-rebours
    format: fill-in
    question: |-
      Complétez pour afficher 10, 9, ..., 1 :
      ```java
      for (int i = 10; i >= 1; i___) {
          System.out.println(i);
      }
      ```
    blanks: [["--"]]
    answer: On décrémente à chaque tour.
  - key: code-somme
    format: code-output
    question: |-
      ```java
      int somme = 0;
      for (int i = 1; i <= 4; i++) {
          somme += i;
      }
      System.out.println(somme);
      ```
    answer: '`10` : 1 + 2 + 3 + 4.'
    check:
      output: "10"
  - key: code-pas
    format: code-output
    question: |-
      ```java
      for (int i = 0; i < 10; i += 3) {
          System.out.print(i + " ");
      }
      ```
    answer: '`0 3 6 9 ` : `i` augmente de 3 tant qu''il reste inférieur à 10.'
    check:
      output: "0 3 6 9"
  - key: code-aucun-tour
    format: code-output
    question: |-
      ```java
      for (int i = 5; i < 5; i++) {
          System.out.println("tour");
      }
      System.out.println("fin");
      ```
    answer: '`fin` : la condition est fausse dès le départ.'
    check:
      output: "fin"
  - key: code-depassement
    format: code-output
    question: |-
      ```java
      int[] t = {1, 2, 3};
      for (int i = 0; i <= t.length; i++) {
          System.out.print(t[i]);
      }
      ```
    answer: '`123` puis une `ArrayIndexOutOfBoundsException` : le tour `i = 3` lit au-delà du dernier indice (2).'
    check:
      output: "123"
      throws: ArrayIndexOutOfBoundsException
  - key: bug-inferieur-ou-egal
    format: bug-fix
    question: |-
      Cette boucle lève une `ArrayIndexOutOfBoundsException` :
      ```java
      for (int i = 0; i <= prix.length; i++) {
          total += prix[i];
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < prix.length; i++) {
          total += prix[i];
      }
      ```
      Le dernier indice est `length - 1` : `<=` fait un tour de trop.
  - key: bug-depart-a-un
    format: bug-fix
    question: |-
      Le premier élément n'est jamais affiché :
      ```java
      for (int i = 1; i < noms.length; i++) {
          System.out.println(noms[i]);
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < noms.length; i++) {
          System.out.println(noms[i]);
      }
      ```
      Les indices commencent à 0.
  - key: bug-mauvaise-variable
    format: bug-fix
    question: |-
      Cette boucle ne s'arrête jamais :
      ```java
      for (int i = 0; i < 10; j++) {
          System.out.println(i);
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < 10; i++) {
      ```
      On incrémentait une autre variable : `i` restait à 0.
  - key: bug-point-virgule
    format: bug-fix
    question: |-
      Ce code n'affiche qu'une ligne, `5`, au lieu de 0 à 4 :
      ```java
      int i;
      for (i = 0; i < 5; i++); {
          System.out.println(i);
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < 5; i++) {
          System.out.println(i);
      }
      ```
      Le `;` donne au `for` un corps vide : la boucle tourne seule, puis le bloc s'exécute une fois avec `i` à 5.
