notion: arrays-utilitaires
cards:
  - key: comparer-contenu-deux-tableaux
    format: course
    question: Comment comparer le contenu de deux tableaux ?
    answer: '`Arrays.equals` (ou `Arrays.deepEquals` pour des tableaux imbriqués) ; `==` et `equals` comparent les références.'
  - key: code-new-int-1-equals-new
    format: code-output
    question: '`new int[]{1}.equals(new int[]{1})` et `Arrays.equals(new int[]{1}, new int[]{1})` ?'
    answer: '`false` et `true`.'
