notion: arrays-utilitaires
lesson: |-
  La classe **`java.util.Arrays`** regroupe les opérations courantes sur les tableaux :

  ```java
  int[] t = {5, 1, 4};
  Arrays.sort(t);                         // t devient {1, 4, 5}
  Arrays.toString(t);                     // "[1, 4, 5]"
  Arrays.binarySearch(t, 4);              // 1 : l'indice de 4 (tableau TRIÉ obligatoire)
  int[] copie = Arrays.copyOf(t, 5);      // {1, 4, 5, 0, 0} : copie, tronquée ou complétée
  Arrays.fill(t, 0);                      // remplit tout le tableau
  Arrays.equals(a, b);                    // compare le CONTENU de deux tableaux
  ```

  - `sort` trie **en place** : le tableau d'origine est modifié, rien n'est renvoyé.
  - `binarySearch` n'a de sens que sur un tableau **trié** ; sur un tableau désordonné, son résultat ne veut rien dire.
  - `a.equals(b)` compare les **références** (comme `==`) ; pour le contenu, `Arrays.equals(a, b)`. Pour des tableaux
    de tableaux, `deepEquals` et `deepToString`.
  - `Arrays.asList(...)` donne une vue `List` de taille fixe ; `List.of(...)` une liste immuable.

  **Piège classique** : `int[] trie = Arrays.sort(t);` ne compile pas. `sort` ne renvoie rien (`void`) : il trie `t`
  lui-même.

  **En entretien** : « `Arrays.equals` compare le contenu là où `equals` compare les références, `sort` trie en place,
  et `binarySearch` exige un tableau trié. »
tour:
  - title: La classe Arrays
    text: |-
      `java.util.Arrays` rassemble les opérations sur les tableaux :

      - `sort` trie, et `binarySearch` cherche dans un tableau **trié** ;
      - `fill` remplit, `copyOf` et `copyOfRange` copient ;
      - `equals` compare le contenu de deux tableaux, alors que `==` compare les références ;
      - `toString` affiche, et `asList` présente un tableau comme une liste.
    example:
      files:
        Main.java: |-
          void main() {
              int[] notes = {15, 9, 18, 12};
              Arrays.sort(notes);
              IO.println(Arrays.toString(notes));
              IO.println(Arrays.binarySearch(notes, 15));

              int[] copie = Arrays.copyOf(notes, 6);
              IO.println(Arrays.toString(copie));
              IO.println(Arrays.equals(notes, new int[] {9, 12, 15, 18}) + " " + (notes == copie));

              char[] ligne = new char[5];
              Arrays.fill(ligne, '-');
              IO.println(new String(ligne));
          }
      output: |-
        [9, 12, 15, 18]
        2
        [9, 12, 15, 18, 0, 0]
        true false
        -----
cards:
  - key: comparer-contenu-deux-tableaux
    format: course
    question: Comment comparer le contenu de deux tableaux ?
    answer: Arrays.equals (ou Arrays.deepEquals pour les tableaux multidimensionnels).
  - key: sort-en-place
    format: course
    question: Que renvoie `Arrays.sort(t)` ?
    answer: "Rien (`void`) : il trie le tableau **en place**, qui est donc modifié."
  - key: binary-search-prerequis
    format: course
    question: Que faut-il pour utiliser `Arrays.binarySearch` ?
    answer: |-
      Un tableau **trié**. La recherche dichotomique coupe le tableau en deux à chaque étape (O(log n)) ; sur un tableau
      non trié, le résultat n'a pas de sens.
  - key: copy-of
    format: course
    question: Que fait `Arrays.copyOf(t, n)` ?
    answer: Il renvoie un **nouveau** tableau de taille `n` avec les éléments de `t`, tronqué ou complété par des valeurs par défaut.
  - key: vf-equals
    format: true-false
    question: "`a.equals(b)` compare le contenu de deux tableaux."
    truth: false
    answer: "Les tableaux ne redéfinissent pas `equals` : elle compare les références. Il faut `Arrays.equals(a, b)`."
  - key: vf-sort-modifie
    format: true-false
    question: "`Arrays.sort(t)` modifie le tableau `t`."
    truth: true
    answer: Le tri se fait en place.
  - key: vf-binary-desordre
    format: true-false
    question: "`Arrays.binarySearch` fonctionne sur n'importe quel tableau."
    truth: false
    answer: Le tableau doit être trié dans l'ordre croissant.
  - key: vf-fill
    format: true-false
    question: "`Arrays.fill(t, 7)` met 7 dans toutes les cases de `t`."
    truth: true
    answer: Il remplit le tableau entier (ou une plage, avec ses autres variantes).
  - key: qcm-afficher
    format: multiple-choice
    question: Quelle expression donne `"[1, 2, 3]"` pour `int[] t = {1, 2, 3}` ?
    choices:
      - text: "`Arrays.toString(t)`"
        correct: true
      - text: "`t.toString()`"
        correct: false
      - text: "`String.valueOf(t)`"
        correct: false
      - text: "`\"\" + t`"
        correct: false
    answer: Les trois autres donnent le type et un code de hachage, comme `[I@1b6d3586`.
  - key: qcm-comparer
    format: multiple-choice
    question: "`int[] a = {1, 2}; int[] b = {1, 2};` : quelles expressions valent `true` ?"
    choices:
      - text: "`Arrays.equals(a, b)`"
        correct: true
      - text: "`a == b`"
        correct: false
      - text: "`a.equals(b)`"
        correct: false
      - text: "`a.length == b.length && a == b`"
        correct: false
    answer: Seul `Arrays.equals` compare le contenu ; `==` et `equals` comparent les références.
  - key: qcm-copie-plus-grande
    format: multiple-choice
    question: Que contient `Arrays.copyOf(new int[] {1, 2}, 4)` ?
    choices:
      - text: "`{1, 2, 0, 0}`"
        correct: true
      - text: "`{1, 2}`"
        correct: false
      - text: "`{1, 2, 1, 2}`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: La copie est complétée par la valeur par défaut, 0.
  - key: qcm-multidimensionnel
    format: multiple-choice
    question: Quelle méthode affiche correctement un tableau à deux dimensions ?
    choices:
      - text: "`Arrays.deepToString(grille)`"
        correct: true
      - text: "`Arrays.toString(grille)`"
        correct: false
      - text: "`grille.toString()`"
        correct: false
      - text: "`Arrays.asList(grille)`"
        correct: false
    answer: '`toString` afficherait les références des lignes ; `deepToString` descend dans chaque ligne.'
  - key: trous-trier
    format: fill-in
    question: |-
      Complétez pour trier les notes :
      ```java
      Arrays.___(notes);
      ```
    blanks: [[sort]]
    answer: '`Arrays.sort` trie en place.'
  - key: trous-comparer
    format: fill-in
    question: |-
      Complétez pour comparer le contenu de deux tableaux :
      ```java
      boolean memes = Arrays.___(attendu, obtenu);
      ```
    blanks: [[equals]]
    answer: '`Arrays.equals` compare case par case.'
  - key: trous-copier
    format: fill-in
    question: |-
      Complétez pour obtenir une copie deux fois plus grande :
      ```java
      int[] grand = Arrays.___(t, t.length * 2);
      ```
    blanks: [[copyOf]]
    answer: '`copyOf` crée un nouveau tableau de la taille demandée.'
  - key: trous-remplir
    format: fill-in
    question: |-
      Complétez pour mettre -1 dans toutes les cases :
      ```java
      Arrays.___(distances, -1);
      ```
    blanks: [[fill]]
    answer: '`fill` remplit tout le tableau avec la valeur donnée.'
  - key: code-new-int-1-equals-new
    format: code-output
    question: '`new int[]{1}.equals(new int[]{1})` et `Arrays.equals(new int[]{1}, new int[]{1})` ?'
    answer: '`false` et `true`.'
    check:
      code: |-
        System.out.println(new int[]{1}.equals(new int[]{1}) + " " + Arrays.equals(new int[]{1}, new int[]{1}));
      output: "false true"
  - key: code-sort
    format: code-output
    question: |-
      ```java
      int[] t = {5, 1, 4};
      Arrays.sort(t);
      System.out.println(Arrays.toString(t));
      ```
    answer: '`[1, 4, 5]` : le tableau est trié en place.'
    check:
      output: "[1, 4, 5]"
  - key: code-binary-search
    format: code-output
    question: |-
      ```java
      int[] t = {2, 4, 6, 8};
      System.out.println(Arrays.binarySearch(t, 6));
      ```
    answer: '`2` : l''indice de 6 dans le tableau trié.'
    check:
      output: "2"
  - key: code-copy-of
    format: code-output
    question: |-
      ```java
      int[] t = {1, 2, 3};
      System.out.println(Arrays.toString(Arrays.copyOf(t, 2)));
      ```
    answer: '`[1, 2]` : la copie est tronquée à 2 éléments.'
    check:
      output: "[1, 2]"
  - key: bug-sort-retour
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: void cannot be converted to int[]`) :
      ```java
      int[] tries = Arrays.sort(notes);
      ```
    answer: |-
      ```java
      int[] tries = Arrays.copyOf(notes, notes.length);
      Arrays.sort(tries);
      ```
      `sort` trie en place et ne renvoie rien. Pour garder l'original, on trie une copie.
  - key: bug-equals-tableaux
    format: bug-fix
    question: |-
      Ce test échoue alors que les deux tableaux contiennent les mêmes valeurs :
      ```java
      if (attendu.equals(obtenu)) {
          System.out.println("OK");
      }
      ```
    answer: |-
      ```java
      if (Arrays.equals(attendu, obtenu)) {
          System.out.println("OK");
      }
      ```
      `equals` sur un tableau compare les références.
  - key: bug-binary-search-non-trie
    format: bug-fix
    question: |-
      Cette recherche renvoie un résultat incohérent :
      ```java
      int[] codes = {42, 7, 19, 3};
      int position = Arrays.binarySearch(codes, 19);
      ```
    answer: |-
      ```java
      int[] codes = {42, 7, 19, 3};
      Arrays.sort(codes);
      int position = Arrays.binarySearch(codes, 19);
      ```
      `binarySearch` exige un tableau trié. Si l'ordre d'origine compte, une simple boucle de recherche convient mieux.
  - key: bug-to-string-2d
    format: bug-fix
    question: |-
      Ce code affiche `[[I@4e25154f, [I@70dea4e]` pour une grille :
      ```java
      System.out.println(Arrays.toString(grille));
      ```
    answer: |-
      ```java
      System.out.println(Arrays.deepToString(grille));
      ```
      Pour un tableau de tableaux, `deepToString` affiche le contenu de chaque ligne.
