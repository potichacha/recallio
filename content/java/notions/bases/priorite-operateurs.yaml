notion: priorite-operateurs
lesson: |-
  Deux règles décident du sens d'une expression :

  1. La **priorité** : quel opérateur s'applique en premier. Du plus fort au plus faible, en résumé :
     - postfixés `x++`, puis unaires `++x`, `-x`, `!`, `~` et les casts ;
     - `*`, `/`, `%`, puis `+`, `-`, puis les décalages `<<`, `>>` ;
     - comparaisons `<`, `>`, `instanceof`, puis `==`, `!=` ;
     - `&`, `^`, `|`, puis `&&`, puis `||` ;
     - le ternaire `? :`, et enfin les affectations `=`, `+=`...
  2. L'**associativité** : à priorité égale, la plupart des opérateurs vont de **gauche à droite**
     (`10 - 4 - 3` vaut 3) ; les affectations, le ternaire et les unaires vont de **droite à gauche**.

  En plus, Java **évalue les opérandes de gauche à droite** : dans `f() + g()`, `f` est appelée avant `g`.

  ```java
  2 + 3 * 4            // 14
  1 + 2 + "3"          // "33" : 1 + 2 d'abord, puis concaténation
  "3" + 1 + 2          // "312"
  true || false && false // true : && passe avant ||
  (double) 7 / 2       // 3.5 : le cast s'applique à 7 seulement
  ```

  **Piège classique** : la moyenne `a + b / 2`, qui divise seulement `b`. Dans le doute, on met des parenthèses : elles
  coûtent moins cher qu'un bug.

  **En entretien** : « Multiplication avant addition, `&&` avant `||`, affectation en dernier ; les opérandes sont
  évalués de gauche à droite, et des parenthèses rendent l'intention explicite. »
cards:
  - key: code-system-out-println-1-2
    format: code-output
    question: '`System.out.println(1 + 2 + "3" + 4 + 5);`'
    answer: '`3345` : évaluation de gauche à droite, 1 + 2 = 3, puis concaténation.'
    check:
      code: |-
        System.out.println(1 + 2 + "3" + 4 + 5);
      output: "3345"
  - key: priorite-associativite
    format: course
    question: Quelle différence entre priorité et associativité ?
    answer: La priorité décide quel opérateur s'applique d'abord (`*` avant `+`) ; l'associativité départage deux opérateurs de même priorité (`10 - 4 - 3` se lit `(10 - 4) - 3`).
  - key: ordre-evaluation
    format: course
    question: Dans quel ordre Java évalue-t-il les opérandes de `f() + g() * h()` ?
    answer: "De gauche à droite : `f`, puis `g`, puis `h`. La priorité décide seulement que le produit est calculé avant la somme."
  - key: et-ou
    format: course
    question: Comment se lit `a || b && c` ?
    answer: '`a || (b && c)` : `&&` est prioritaire sur `||`.'
  - key: cast-priorite
    format: course
    question: Pourquoi `(double) 7 / 2` vaut-il 3.5 mais `(double) (7 / 2)` vaut 3.0 ?
    answer: "Le cast est plus prioritaire que `/` : dans le premier cas il convertit 7 avant la division ; dans le second, la division entière a déjà donné 3."
  - key: vf-multiplication
    format: true-false
    question: "`2 + 3 * 4` vaut 20."
    truth: false
    answer: '`*` passe avant `+` : 2 + 12 = 14.'
  - key: vf-soustraction
    format: true-false
    question: "`10 - 4 - 3` vaut 3."
    truth: true
    answer: "La soustraction s'associe de gauche à droite : (10 - 4) - 3."
  - key: vf-et-ou
    format: true-false
    question: "`true || false && false` vaut `false`."
    truth: false
    answer: Il se lit `true || (false && false)`, qui vaut `true`.
  - key: vf-gauche-droite
    format: true-false
    question: Java évalue les opérandes d'une expression de gauche à droite.
    truth: true
    answer: Contrairement au C, l'ordre est garanti par la spécification.
  - key: qcm-concatenation
    format: multiple-choice
    question: Que vaut `"3" + 1 + 2` ?
    choices:
      - text: "\"312\""
        correct: true
      - text: "\"33\""
        correct: false
      - text: "6"
        correct: false
      - text: "\"3 + 1 + 2\""
        correct: false
    answer: De gauche à droite, la chaîne transforme chaque `+` suivant en concaténation.
  - key: qcm-ternaire
    format: multiple-choice
    question: "Que vaut `\"x\" + (n > 0 ? \"+\" : \"-\") + \"y\"` avec `n = 1` ?"
    choices:
      - text: "\"x+y\""
        correct: true
      - text: "\"x-y\""
        correct: false
      - text: "\"+\""
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Les parenthèses isolent le ternaire, qui sinon s'appliquerait à toute la concaténation de gauche.
  - key: qcm-plus-faible
    format: multiple-choice
    question: Lequel de ces opérateurs a la priorité la plus faible ?
    choices:
      - text: "`=`"
        correct: true
      - text: "`? :`"
        correct: false
      - text: "`||`"
        correct: false
      - text: "`==`"
        correct: false
    answer: Les affectations viennent en dernier, juste après le ternaire.
  - key: qcm-increment
    format: multiple-choice
    question: Avec `int i = 1;`, que vaut `i++ + i++` ?
    choices:
      - text: "3"
        correct: true
      - text: "2"
        correct: false
      - text: "4"
        correct: false
      - text: "Le résultat n'est pas défini"
        correct: false
    answer: "De gauche à droite : 1 (puis `i` vaut 2) + 2 (puis `i` vaut 3)."
  - key: code-moyenne
    format: code-output
    question: |-
      ```java
      int a = 10, b = 20;
      System.out.println(a + b / 2);
      System.out.println((a + b) / 2);
      ```
    answer: |-
      `20` puis `15` : sans parenthèses, seul `b` est divisé.
    check:
      output: |-
        20
        15
  - key: code-cast
    format: code-output
    question: |-
      ```java
      System.out.println((double) 7 / 2 + " " + (double) (7 / 2));
      ```
    answer: '`3.5 3.0` : le cast porte sur 7 dans le premier cas, sur le résultat de la division entière dans le second.'
    check:
      output: "3.5 3.0"
  - key: code-logique
    format: code-output
    question: |-
      ```java
      boolean a = true, b = false, c = false;
      System.out.println((a || b && c) + " " + ((a || b) && c));
      ```
    answer: '`true false` : sans parenthèses, `&&` est évalué avant `||`.'
    check:
      output: "true false"
  - key: code-increments
    format: code-output
    question: |-
      ```java
      int i = 1;
      int r = i++ + ++i * 2;
      System.out.println(r + " " + i);
      ```
    answer: '`7 3` : `i++` vaut 1 (puis `i` = 2), `++i` vaut 3, et 1 + 3 × 2 = 7.'
    check:
      output: "7 3"
  - key: bug-moyenne
    format: bug-fix
    question: |-
      Cette moyenne de deux notes est fausse :
      ```java
      double moyenne = note1 + note2 / 2;
      ```
    answer: |-
      ```java
      double moyenne = (note1 + note2) / 2;
      ```
      La division passe avant l'addition : sans parenthèses, seule `note2` est divisée.
  - key: bug-concatenation-somme
    format: bug-fix
    question: |-
      Avec `a = 2` et `b = 3`, ce code affiche « Total : 23 » :
      ```java
      System.out.println("Total : " + a + b);
      ```
    answer: |-
      ```java
      System.out.println("Total : " + (a + b));
      ```
      De gauche à droite, la chaîne transforme chaque `+` en concaténation ; les parenthèses font d'abord l'addition.
  - key: bug-ternaire-concatenation
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: String cannot be converted to boolean`) :
      ```java
      String texte = "Statut : " + actif ? "actif" : "inactif";
      ```
    answer: |-
      ```java
      String texte = "Statut : " + (actif ? "actif" : "inactif");
      ```
      Le ternaire est moins prioritaire que `+` : Java lit `("Statut : " + actif) ? ...`, une `String` à la place
      d'une condition. Les parenthèses isolent le ternaire.
  - key: bug-condition-melangee
    format: bug-fix
    question: |-
      On veut l'accès pour un admin, ou pour un membre dont le compte est actif, mais ce code laisse entrer un membre
      inactif et refuse un admin inactif :
      ```java
      if (estMembre || estAdmin && actif) {
          autoriser();
      }
      ```
    answer: |-
      ```java
      if (estAdmin || (estMembre && actif)) {
          autoriser();
      }
      ```
      `&&` passe avant `||` : le code se lisait `estMembre || (estAdmin && actif)`, l'inverse de l'intention. Des
      parenthèses explicites rendent la règle lisible.
