notion: priorite-operateurs
lesson: |-
  Deux règles décident du sens d'une expression :

  1. La **priorité** : quel opérateur s'applique en premier. Du plus fort au plus faible, en résumé :
     - postfixés `x++`, puis unaires `++x`, `-x`, `!`, `~` et les casts ;
     - `*`, `/`, `%`, puis `+`, `-`, puis les décalages `<<`, `>>` ;
     - comparaisons `<`, `>`, `instanceof`, puis `==`, `!=` ;
     - `&`, `^`, `|`, puis `&&`, puis `||` ;
     - le ternaire `? :`, et enfin les affectations `=`, `+=`...
  2. L'**associativité** : à priorité égale, la plupart des opérateurs vont de **gauche à droite**
     (`10 - 4 - 3` vaut 3) ; les affectations, le ternaire et les unaires vont de **droite à gauche**.

  En plus, Java **évalue les opérandes de gauche à droite** : dans `f() + g()`, `f` est appelée avant `g`.

  ```java
  2 + 3 * 4            // 14
  1 + 2 + "3"          // "33" : 1 + 2 d'abord, puis concaténation
  "3" + 1 + 2          // "312"
  true || false && false // true : && passe avant ||
  (double) 7 / 2       // 3.5 : le cast s'applique à 7 seulement
  ```

  **Piège classique** : la moyenne `a + b / 2`, qui divise seulement `b`. Dans le doute, on met des parenthèses : elles
  coûtent moins cher qu'un bug.

  **En entretien** : « Multiplication avant addition, `&&` avant `||`, affectation en dernier ; les opérandes sont
  évalués de gauche à droite, et des parenthèses rendent l'intention explicite. »
cards:
  - key: code-system-out-println-1-2
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(1 + 2 + "3" + 4 + 5);
      ```
    choices:
      - {text: "`3345`", correct: true}
      - {text: "`12345`", correct: false}
      - {text: "`339`", correct: false}
      - {text: "`15`", correct: false}
    answer: |-
      `3345` : évaluation de gauche à droite ; 1 + 2 = 3, puis la chaîne `"3"` fait de chaque `+` suivant une
      concaténation.
    check:
      code: |-
        System.out.println(1 + 2 + "3" + 4 + 5);
      output: "3345"
  - key: priorite-associativite
    format: course
    question: Quelle différence entre priorité et associativité ?
    choices:
      - {text: "La priorité fait passer `*` avant `+` ; l'associativité départage deux opérateurs de même priorité", correct: true}
      - {text: "La priorité fixe l'ordre d'évaluation des opérandes ; l'associativité, celui des opérateurs", correct: false}
      - {text: "L'associativité vaut pour les opérateurs logiques, la priorité pour les opérateurs arithmétiques", correct: false}
      - {text: "Aucune : ce sont deux noms de la même règle, celle qui fait passer `*` avant `+`", correct: false}
    answer: |-
      La priorité décide quel opérateur s'applique d'abord (`*` avant `+`) ; l'associativité départage deux opérateurs
      de même priorité (`10 - 4 - 3` se lit `(10 - 4) - 3`).
  - key: ordre-evaluation
    format: course
    question: Dans quel ordre Java évalue-t-il les opérandes de `f() + g() * h()` ?
    choices:
      - {text: "De gauche à droite : `f`, puis `g`, puis `h`", correct: true}
      - {text: "`g` et `h` d'abord, car `*` est prioritaire, puis `f`", correct: false}
      - {text: "De droite à gauche : `h`, puis `g`, puis `f`", correct: false}
      - {text: "Dans un ordre non garanti, choisi par la JVM", correct: false}
    answer: |-
      De gauche à droite : `f`, puis `g`, puis `h`. La priorité décide seulement que le produit est calculé avant la
      somme, pas l'ordre d'appel des méthodes.
  - key: et-ou
    format: course
    question: "Comment Java lit-il `a || b && c` ?"
    choices:
      - {text: "`a || (b && c)`", correct: true}
      - {text: "`(a || b) && c`", correct: false}
      - {text: "Ça ne compile pas sans parenthèses", correct: false}
    answer: "`a || (b && c)` : `&&` est prioritaire sur `||`, comme `*` sur `+`."
  - key: cast-priorite
    format: course
    question: Pourquoi `(double) 7 / 2` vaut-il 3.5 mais `(double) (7 / 2)` vaut 3.0 ?
    choices:
      - {text: "Le cast passe avant `/` : dans le premier cas, seul 7 est converti", correct: true}
      - {text: "`/` passe avant le cast : le premier cas convertit le résultat 3.5", correct: false}
      - {text: "Le cast tronque le résultat dans le second cas, pas dans le premier", correct: false}
      - {text: "Un cast devant une division la rend décimale, sauf entre parenthèses", correct: false}
    answer: |-
      Le cast est plus prioritaire que `/` : dans le premier cas il convertit 7 avant la division ; dans le second, la
      division entière a déjà donné 3, que le cast convertit en 3.0.
  - key: vf-multiplication
    format: true-false
    question: "`2 + 3 * 4` vaut 20."
    truth: false
    answer: '`*` passe avant `+` : 2 + 12 = 14.'
  - key: vf-soustraction
    format: true-false
    question: "`10 - 4 - 3` vaut 3."
    truth: true
    answer: "La soustraction s'associe de gauche à droite : (10 - 4) - 3."
  - key: vf-et-ou
    format: true-false
    question: "`true || false && false` vaut `false`."
    truth: false
    answer: Il se lit `true || (false && false)`, qui vaut `true`.
  - key: vf-gauche-droite
    format: true-false
    question: Java évalue les opérandes d'une expression de gauche à droite.
    truth: true
    answer: Contrairement au C, l'ordre est garanti par la spécification.
  - key: qcm-concatenation
    format: multiple-choice
    question: Que vaut `"3" + 1 + 2` ?
    choices:
      - text: "\"312\""
        correct: true
      - text: "\"33\""
        correct: false
      - text: "6"
        correct: false
      - text: "\"3 + 1 + 2\""
        correct: false
    answer: De gauche à droite, la chaîne transforme chaque `+` suivant en concaténation.
  - key: qcm-ternaire
    format: multiple-choice
    question: "Que vaut `\"x\" + (n > 0 ? \"+\" : \"-\") + \"y\"` avec `n = 1` ?"
    choices:
      - text: "\"x+y\""
        correct: true
      - text: "\"x-y\""
        correct: false
      - text: "\"+\""
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Les parenthèses isolent le ternaire, qui sinon s'appliquerait à toute la concaténation de gauche.
  - key: qcm-plus-faible
    format: multiple-choice
    question: Lequel de ces opérateurs a la priorité la plus faible ?
    choices:
      - text: "`=`"
        correct: true
      - text: "`? :`"
        correct: false
      - text: "`||`"
        correct: false
      - text: "`==`"
        correct: false
    answer: Les affectations viennent en dernier, juste après le ternaire.
  - key: qcm-increment
    format: multiple-choice
    question: Avec `int i = 1;`, que vaut `i++ + i++` ?
    choices:
      - text: "3"
        correct: true
      - text: "2"
        correct: false
      - text: "4"
        correct: false
      - text: "Le résultat n'est pas défini"
        correct: false
    answer: "De gauche à droite : 1 (puis `i` vaut 2) + 2 (puis `i` vaut 3)."
  - key: code-moyenne
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int a = 10, b = 20;
      System.out.println(a + b / 2);
      System.out.println((a + b) / 2);
      ```
    choices:
      - text: |-
          ```
          20
          15
          ```
        correct: true
      - text: |-
          ```
          15
          15
          ```
        correct: false
      - text: |-
          ```
          20
          20
          ```
        correct: false
      - text: |-
          ```
          15
          20
          ```
        correct: false
    answer: "`20` puis `15` : sans parenthèses, la division passe avant l'addition, et seul `b` est divisé."
    check:
      output: |-
        20
        15
  - key: code-cast
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println((double) 7 / 2 + " " + (double) (7 / 2));
      ```
    choices:
      - {text: "`3.5 3.0`", correct: true}
      - {text: "`3.5 3.5`", correct: false}
      - {text: "`3.0 3.0`", correct: false}
      - {text: "`3.0 3.5`", correct: false}
    answer: "`3.5 3.0` : le cast porte sur 7 dans le premier cas, sur le résultat de la division entière dans le second."
    check:
      output: "3.5 3.0"
  - key: code-logique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      boolean a = true, b = false, c = false;
      System.out.println((a || b && c) + " " + ((a || b) && c));
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
    answer: |-
      `true false` : sans parenthèses, `&&` est évalué avant `||`, donc `a || (b && c)` vaut `true` ; avec les
      parenthèses, `(a || b) && c` vaut `false`.
    check:
      output: "true false"
  - key: code-increments
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int i = 1;
      int r = i++ + ++i * 2;
      System.out.println(r + " " + i);
      ```
    choices:
      - {text: "`7 3`", correct: true}
      - {text: "`5 3`", correct: false}
      - {text: "`8 3`", correct: false}
      - {text: "`7 2`", correct: false}
    answer: "`7 3` : `i++` vaut 1 (puis `i` = 2), `++i` vaut 3, et 1 + 3 × 2 = 7."
    check:
      output: "7 3"
  - key: bug-moyenne
    format: bug-fix
    question: |-
      Cette moyenne de deux notes est fausse : elle donne 19.5 au lieu de 13.5. Quelle correction est la bonne ?
      ```java
      double note1 = 12, note2 = 15;
      double moyenne = note1 + note2 / 2;
      ```
    choices:
      - {text: "`double moyenne = (note1 + note2) / 2;`", correct: true}
      - {text: "`double moyenne = note1 + (note2 / 2);`", correct: false}
      - {text: "`double moyenne = note1 / 2 + note2;`", correct: false}
      - {text: "`double moyenne = (double) note1 + note2 / 2;`", correct: false}
    answer: |-
      ```java
      double moyenne = (note1 + note2) / 2;
      ```
      La division passe avant l'addition : sans parenthèses, seule `note2` est divisée. Un cast ne change rien à
      l'ordre des opérations.
  - key: bug-concatenation-somme
    format: bug-fix
    question: |-
      Avec `a = 2` et `b = 3`, ce code affiche « Total : 23 ». Quelle correction est la bonne ?
      ```java
      System.out.println("Total : " + a + b);
      ```
    choices:
      - {text: "`System.out.println(\"Total : \" + (a + b));`", correct: true}
      - {text: "`System.out.println((\"Total : \" + a) + b);`", correct: false}
      - {text: "`System.out.println(\"Total : \" + a + (int) b);`", correct: false}
      - {text: "`System.out.println(\"Total : \" + a + b + 0);`", correct: false}
    answer: |-
      ```java
      System.out.println("Total : " + (a + b));
      ```
      De gauche à droite, la chaîne transforme chaque `+` en concaténation ; les parenthèses font d'abord l'addition.
  - key: bug-ternaire-concatenation
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: String cannot be converted to boolean`). Quelle correction est la
      bonne ?
      ```java
      String texte = "Statut : " + actif ? "actif" : "inactif";
      ```
    choices:
      - {text: "`String texte = \"Statut : \" + (actif ? \"actif\" : \"inactif\");`", correct: true}
      - {text: "`String texte = (\"Statut : \" + actif) ? \"actif\" : \"inactif\";`", correct: false}
      - {text: "`String texte = \"Statut : \" + actif == true ? \"actif\" : \"inactif\";`", correct: false}
      - {text: "`String texte = \"Statut : \" + actif ? (\"actif\") : (\"inactif\");`", correct: false}
    answer: |-
      ```java
      String texte = "Statut : " + (actif ? "actif" : "inactif");
      ```
      Le ternaire est moins prioritaire que `+` : Java lit `("Statut : " + actif) ? ...`, une `String` à la place
      d'une condition. Les parenthèses isolent le ternaire.
  - key: bug-condition-melangee
    format: bug-fix
    question: |-
      On veut l'accès pour un admin, ou pour un membre dont le compte est actif, mais ce code laisse entrer un membre
      inactif et refuse un admin inactif. Quelle correction est la bonne ?
      ```java
      if (estMembre || estAdmin && actif) {
          autoriser();
      }
      ```
    choices:
      - {text: "`if (estAdmin || (estMembre && actif))`", correct: true}
      - {text: "`if ((estMembre || estAdmin) && actif)`", correct: false}
      - {text: "`if (estMembre && actif || estAdmin && actif)`", correct: false}
      - {text: "`if (estMembre || (estAdmin && actif))`", correct: false}
    answer: |-
      ```java
      if (estAdmin || (estMembre && actif)) {
          autoriser();
      }
      ```
      `&&` passe avant `||` : le code se lisait `estMembre || (estAdmin && actif)`, l'inverse de l'intention. Des
      parenthèses explicites rendent la règle lisible.
