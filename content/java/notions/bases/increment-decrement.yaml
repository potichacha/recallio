notion: increment-decrement
lesson: |-
  `++` ajoute 1 à une variable, `--` lui retire 1. Seuls, ils sont équivalents : `i++;` et `++i;` font la même chose
  que `i = i + 1;`.

  La différence n'apparaît que quand on **utilise la valeur** de l'expression :

  ```java
  int i = 5;
  int a = i++;   // suffixe : a reçoit l'ANCIENNE valeur (5), puis i passe à 6
  int b = ++i;   // préfixe : i passe à 7, puis b reçoit la NOUVELLE valeur (7)
  ```

  - **Suffixe** (`i++`) : renvoie la valeur d'avant, puis incrémente.
  - **Préfixe** (`++i`) : incrémente, puis renvoie la nouvelle valeur.
  - Ils ne s'appliquent qu'à une **variable** (pas à `5++`), et pas à une variable `final`.
  - L'usage courant, et le plus lisible, est seul sur sa ligne ou dans une boucle : `for (int i = 0; i < n; i++)`.

  **Piège classique** : `i = i++;`. L'expression `i++` vaut l'ancienne valeur, que l'affectation range de nouveau dans
  `i` : `i` ne change pas.

  **En entretien** : « Le suffixe renvoie l'ancienne valeur, le préfixe la nouvelle ; on évite de les mélanger dans une
  même expression, illisible. »
tour:
  - title: ++ et --
    text: |-
      `i++` ajoute 1 à `i`, et `i--` lui retire 1. Écrits **avant** la variable (`++i`), ils modifient d'abord et
      donnent la nouvelle valeur ; écrits **après** (`i++`), ils donnent l'ancienne valeur, puis modifient.

      La différence ne compte que si l'on utilise le résultat dans une expression. Seuls sur une ligne, `i++` et `++i`
      font la même chose ; mêlés à d'autres calculs, ils rendent le code difficile à lire.
    example:
      files:
        Main.java: |-
          void main() {
              int i = 5;
              int a = i++;
              IO.println(a + " " + i);

              int j = 5;
              int b = ++j;
              IO.println(b + " " + j);

              int k = 10;
              k--;
              IO.println(k);
          }
      output: |-
        5 6
        6 6
        9
cards:
  - key: i-vs-i
    format: course
    question: "Quelle différence entre `i++` et `++i` ?"
    choices:
      - {text: "`i++` renvoie l'ancienne valeur, `++i` la nouvelle", correct: true}
      - {text: "`++i` renvoie l'ancienne valeur, `i++` la nouvelle", correct: false}
      - {text: "`i++` modifie `i`, `++i` renvoie `i + 1` sans le modifier", correct: false}
      - {text: "Aucune : ce sont deux écritures du même opérateur", correct: false}
    answer: |-
      Les deux ajoutent 1 à `i`. Le post-incrément `i++` renvoie l'ancienne valeur, le pré-incrément `++i` la nouvelle :
      la différence ne se voit que si l'on utilise la valeur de l'expression.
  - key: seul-sur-sa-ligne
    format: course
    question: "`i++;` et `++i;`, seuls sur leur ligne, font-ils la même chose ?"
    choices:
      - {text: "Oui : la valeur n'est pas utilisée, seul reste l'ajout de 1", correct: true}
      - {text: "Non : `i++;` n'ajoute 1 qu'à la fin du bloc qui le contient", correct: false}
      - {text: "Non : `i++;` seul ne modifie pas `i`, il renvoie sa valeur", correct: false}
      - {text: "Non : `++i;` est plus rapide, car il ne copie pas `i`", correct: false}
    answer: |-
      Oui : la valeur de l'expression n'est pas utilisée, il ne reste que l'effet, ajouter 1 à `i`. Sur un `int`, le
      compilateur produit le même code dans les deux cas.
  - key: equivalent-long
    format: course
    question: À quoi équivaut `compteur--;` ?
    choices:
      - {text: "`compteur = compteur - 1;`", correct: true}
      - {text: "`compteur - 1;`", correct: false}
      - {text: "`compteur = compteur--;`", correct: false}
      - {text: "`compteur = -1;`", correct: false}
    answer: |-
      À `compteur = compteur - 1;` (ou `compteur -= 1;`). `compteur = compteur--;` laisserait `compteur` inchangé :
      l'affectation remet l'ancienne valeur.
  - key: sur-quoi-appliquer
    format: course
    question: Sur quoi peut-on appliquer `++` ?
    choices:
      - {text: "Sur une variable numérique modifiable : ni un littéral, ni un `final`", correct: true}
      - {text: "Sur toute expression numérique, littéraux compris : `5++` vaut 6", correct: false}
      - {text: "Sur une variable `int` uniquement, pas sur un `double` ni un `char`", correct: false}
      - {text: "Sur toute variable, même `final` : `++` n'est pas une affectation", correct: false}
    answer: |-
      Sur une variable numérique (ou un élément de tableau, un champ) qu'on peut modifier, `char` et `double` compris :
      ni sur une constante littérale comme `5`, ni sur une variable `final`, car `++` réaffecte la variable.
  - key: vf-suffixe-ancienne-valeur
    format: true-false
    question: "Après `int i = 5; int a = i++;`, `a` vaut 5."
    truth: true
    answer: "Le suffixe renvoie l'ancienne valeur, puis incrémente : `a` vaut 5 et `i` vaut 6."
  - key: vf-prefixe-ancienne-valeur
    format: true-false
    question: "Après `int i = 5; int b = ++i;`, `b` vaut 5."
    truth: false
    answer: "Le préfixe incrémente d'abord : `b` et `i` valent 6."
  - key: vf-i-egal-i-plus-plus
    format: true-false
    question: "`i = i++;` augmente `i` de 1."
    truth: false
    answer: '`i++` vaut l''ancienne valeur, que l''affectation remet dans `i` : `i` ne change pas.'
  - key: vf-litteral
    format: true-false
    question: "`5++` compile."
    truth: false
    answer: '`++` modifie une variable ; un littéral n''en est pas une.'
  - key: qcm-valeurs-suffixe
    format: multiple-choice
    question: Que valent `i` et `a` après `int i = 3; int a = i++;` ?
    choices:
      - text: "`i` vaut 4, `a` vaut 3"
        correct: true
      - text: "`i` et `a` valent 4"
        correct: false
      - text: "`i` et `a` valent 3"
        correct: false
      - text: "`i` vaut 3, `a` vaut 4"
        correct: false
    answer: Le suffixe renvoie l'ancienne valeur (3), puis incrémente `i`.
  - key: qcm-valeurs-prefixe
    format: multiple-choice
    question: Que valent `i` et `b` après `int i = 3; int b = ++i;` ?
    choices:
      - text: "`i` et `b` valent 4"
        correct: true
      - text: "`i` vaut 4, `b` vaut 3"
        correct: false
      - text: "`i` et `b` valent 3"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Le préfixe incrémente d'abord, puis renvoie la nouvelle valeur.
  - key: qcm-equivalents
    format: multiple-choice
    question: Quelles instructions ajoutent 1 à `n` ?
    choices:
      - text: "`n++;`"
        correct: true
      - text: "`n += 1;`"
        correct: true
      - text: "`n = n++;`"
        correct: false
      - text: "`n + 1;`"
        correct: false
    answer: '`n = n++` laisse `n` inchangé, et `n + 1;` seul ne compile pas (ce n''est pas une instruction).'
  - key: qcm-boucle-decroissante
    format: multiple-choice
    question: "Quel en-tête de boucle `for` compte à rebours de 3 jusqu'à 1 ?"
    choices:
      - text: "`for (int i = 3; i > 0; i--)`"
        correct: true
      - text: "`for (int i = 3; i > 0; i++)`"
        correct: false
      - text: "`for (int i = 3; i >= 0; i--)`"
        correct: false
      - text: "`for (int i = 0; i < 3; i--)`"
        correct: false
    answer: On part de 3 et on décrémente tant que `i > 0` ; avec `i >= 0`, on afficherait aussi 0.
  - key: trous-incrementer
    format: fill-in
    question: |-
      Complète pour ajouter 1 à `visites` :
      ```java
      visites___;
      ```
    blanks: [["++", "+= 1"]]
    answer: '`visites++` (ou `visites += 1`).'
  - key: trous-boucle
    format: fill-in
    question: |-
      Complète pour parcourir les indices 0, 1, 2 :
      ```java
      for (int i = 0; i < 3; ___) {
      }
      ```
    blanks: [["i++", "++i", "i += 1", "i = i + 1"]]
    answer: Chaque tour ajoute 1 à `i`.
  - key: trous-decompte
    format: fill-in
    question: |-
      Complète pour retirer une vie :
      ```java
      vies___;
      ```
    blanks: [["--", "-= 1"]]
    answer: '`vies--` retire 1.'
  - key: trous-prefixe
    format: fill-in
    question: |-
      Complète pour que `numero` reçoive la valeur **déjà** incrémentée de `dernier` :
      ```java
      int numero = ___dernier;
      ```
    blanks: [["++"]]
    answer: Le préfixe incrémente d'abord, puis renvoie la nouvelle valeur.
  - key: code-int-i-0-i-i
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int i = 0;
      i = i++;
      System.out.println(i);
      ```
    choices:
      - {text: "`0`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`0` : `i++` renvoie 0, puis l'incrément a lieu, puis l'affectation écrase `i` avec 0."
    check:
      code: |-
        int i = 0; i = i++; System.out.println(i);
      output: "0"
  - key: code-int-k-1-int-r
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int k = 1;
      int r = k++ + ++k;
      System.out.println(r + " " + k);
      ```
    choices:
      - {text: "`4 3`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`4 2`", correct: false}
      - {text: "`5 3`", correct: false}
    answer: "`4 3` : `k++` vaut 1 (et `k` passe à 2), puis `++k` passe `k` à 3 et vaut 3 ; `r` = 1 + 3 = 4."
    check:
      code: |-
        int k = 1; int r = k++ + ++k; System.out.println(r + " " + k);
      output: "4 3"
  - key: code-suffixe
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int i = 5;
      int j = i++;
      System.out.println(i + " " + j);
      ```
    choices:
      - {text: "`6 5`", correct: true}
      - {text: "`6 6`", correct: false}
      - {text: "`5 5`", correct: false}
      - {text: "`5 6`", correct: false}
    answer: "`6 5` : `j` reçoit l'ancienne valeur, puis `i` est incrémenté."
    check:
      output: "6 5"
  - key: code-prefixe
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int i = 5;
      int j = ++i;
      System.out.println(i + " " + j);
      ```
    choices:
      - {text: "`6 6`", correct: true}
      - {text: "`6 5`", correct: false}
      - {text: "`5 6`", correct: false}
      - {text: "`5 5`", correct: false}
    answer: "`6 6` : `i` est incrémenté d'abord, et `j` reçoit la nouvelle valeur."
    check:
      output: "6 6"
  - key: bug-boucle-infinie
    format: bug-fix
    question: |-
      Cette boucle ne s'arrête jamais. Pourquoi ?
      ```java
      for (int i = 0; i < 3; i = i++) {
          System.out.println(i);
      }
      ```
    choices:
      - {text: "`i = i++` remet l'ancienne valeur dans `i`, qui reste à 0", correct: true}
      - {text: "`i++` n'agit qu'après la condition, qui n'est jamais revue", correct: false}
      - {text: "La condition `i < 3` n'est évaluée qu'une fois, au départ", correct: false}
      - {text: "`i` est redéclaré et remis à 0 à chaque tour de la boucle", correct: false}
    answer: |-
      ```java
      for (int i = 0; i < 3; i++) {
          System.out.println(i);
      }
      ```
      `i = i++` remet l'ancienne valeur dans `i` : `i` reste à 0, et la condition, revue à chaque tour, reste vraie. Il
      suffit de `i++`.
  - key: bug-pas-une-instruction
    format: bug-fix
    question: |-
      On veut ajouter 1 à `compteur`, mais ce code ne compile pas (`not a statement`). Quelle correction est la bonne ?
      ```java
      compteur + 1;
      ```
    choices:
      - {text: "`compteur++;`", correct: true}
      - {text: "`compteur =+ 1;`", correct: false}
      - {text: "`(compteur + 1);`", correct: false}
      - {text: "`compteur + 1 = compteur;`", correct: false}
    answer: |-
      ```java
      compteur++;
      ```
      `compteur + 1` calcule une valeur sans la ranger nulle part ; `compteur++` modifie la variable. `compteur =+ 1`
      compile, mais range `+1` : `compteur` vaut alors 1.
  - key: bug-affichage-suffixe
    format: bug-fix
    question: |-
      On veut afficher le prochain numéro de ticket, mais ce code affiche le numéro actuel. Quelle correction est la
      bonne ?
      ```java
      System.out.println("Ticket n° " + numero++);
      ```
    choices:
      - {text: "`System.out.println(\"Ticket n° \" + ++numero);`", correct: true}
      - {text: "`System.out.println(\"Ticket n° \" + numero + 1);`", correct: false}
      - {text: "`System.out.println(\"Ticket n° \" + (numero++));`", correct: false}
      - {text: "`System.out.println(\"Ticket n° \" + numero += 1);`", correct: false}
    answer: |-
      ```java
      System.out.println("Ticket n° " + ++numero);
      ```
      Le suffixe renvoie l'ancienne valeur, même entre parenthèses ; le préfixe incrémente d'abord. `numero + 1`, après
      une chaîne, concatène « 1 ». Plus lisible encore : `numero++;` sur sa propre ligne, puis l'affichage.
  - key: bug-final
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot assign a value to final variable essais`). Quelle correction est la bonne ?
      ```java
      final int essais = 0;
      essais++;
      ```
    choices:
      - {text: "Retirer `final` : `int essais = 0;`", correct: true}
      - {text: "Écrire `essais += 1;` au lieu de `essais++;`", correct: false}
      - {text: "Écrire `++essais;` au lieu de `essais++;`", correct: false}
      - {text: "Déclarer `final Integer essais = 0;`", correct: false}
    answer: |-
      ```java
      int essais = 0;
      essais++;
      ```
      `++` réaffecte la variable, comme `+=` : impossible sur une variable `final`, quelle que soit l'écriture.
