notion: increment-decrement
cards:
  - key: i-vs-i
    format: course
    question: '`i++` vs `++i` ?'
    answer: Post-incrément (retourne l'ancienne valeur) vs pré-incrément (retourne la nouvelle).
  - key: code-int-i-0-i-i
    format: code-output
    question: '`int i = 0; i = i++; System.out.println(i);`'
    answer: '`0`. `i++` renvoie 0, puis l''incrément a lieu, puis l''affectation écrase avec 0.'
    check:
      code: |-
        int i = 0; i = i++; System.out.println(i);
      output: "0"
  - key: code-int-k-1-int-r
    format: code-output
    question: '`int k = 1; int r = k++ + ++k;` que valent r et k ?'
    answer: r = 4 (1 + 3), k = 3.
    check:
      code: |-
        int k = 1; int r = k++ + ++k; System.out.println(r + " " + k);
      output: "4 3"
