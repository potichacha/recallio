notion: flottants-precision
lesson: |-
  `float` et `double` suivent la norme **IEEE 754** : un nombre est stocké en **binaire**, avec un nombre limité de
  chiffres. Beaucoup de décimaux simples n'ont pas d'écriture binaire exacte, comme 1/3 n'en a pas en décimal :

  ```java
  System.out.println(0.1 + 0.2);         // 0.30000000000000004
  System.out.println(0.1 + 0.2 == 0.3);  // false
  ```

  - On ne compare donc pas deux résultats de calcul avec `==`, mais **à une tolérance près** :
    `Math.abs(a - b) < 1e-9`.
  - Pour de l'**argent**, ni `double` ni `float` : on utilise `BigDecimal` (ou des centimes dans un `long`).
  - Les flottants ont des valeurs spéciales, sans exception : `1.0 / 0` donne `Infinity`, `0.0 / 0` donne **`NaN`**
    (*Not a Number*), et il existe un `-0.0`.
  - `NaN` n'est égal à rien, pas même à lui-même : on le teste avec `Double.isNaN(x)`.

  `double` (64 bits, ~15 chiffres significatifs) est le choix par défaut ; `float` (~7 chiffres) ne sert que pour
  économiser de la mémoire sur de très gros volumes.

  **Piège classique** : une boucle `for (double x = 0; x != 1.0; x += 0.1)`. À cause des arrondis, `x` ne vaut jamais
  exactement 1.0 : la boucle ne s'arrête pas.

  **En entretien** : « Les flottants sont approximatifs en binaire : on les compare à une tolérance près, et on calcule
  l'argent en `BigDecimal`. »
cards:
  - key: 0-1-0-2-0-3
    format: course
    question: Pourquoi `0.1 + 0.2 != 0.3` ?
    answer: 0.1 et 0.2 n'ont pas de représentation binaire exacte en IEEE 754.
  - key: tester-double-nan
    format: course
    question: Comment tester qu'un double est NaN ?
    answer: Double.isNaN(x), car NaN != NaN.
  - key: comparer-doubles
    format: course
    question: Comment comparer deux `double` issus de calculs ?
    answer: À une tolérance près, par exemple `Math.abs(a - b) < 1e-9`, plutôt qu'avec `==`.
  - key: argent
    format: course
    question: Quel type utiliser pour des montants d'argent ?
    answer: '`BigDecimal`, qui calcule en décimal exact ; ou un nombre de centimes dans un `long`. Jamais `double`.'
  - key: vf-somme-exacte
    format: true-false
    question: "`0.1 + 0.2 == 0.3` vaut `true`."
    truth: false
    answer: La somme vaut 0.30000000000000004 en `double`.
  - key: vf-division-zero-flottante
    format: true-false
    question: Diviser un `double` par zéro lève une `ArithmeticException`.
    truth: false
    answer: Ça donne `Infinity` (ou `NaN` pour `0.0 / 0`). Seule la division **entière** par zéro lève une exception.
  - key: vf-nan-different
    format: true-false
    question: "`Double.NaN == Double.NaN` vaut `false`."
    truth: true
    answer: '`NaN` n''est égal à rien, pas même à lui-même ; on le teste avec `Double.isNaN`.'
  - key: vf-double-euros
    format: true-false
    question: Un `double` convient pour additionner des montants en euros.
    truth: false
    answer: Les centimes s'arrondissent mal en binaire ; on utilise `BigDecimal`.
  - key: qcm-un-sur-zero
    format: multiple-choice
    question: Que vaut `1.0 / 0` ?
    choices:
      - text: "`Infinity`"
        correct: true
      - text: "Une `ArithmeticException`"
        correct: false
      - text: "`0`"
        correct: false
      - text: "`NaN`"
        correct: false
    answer: Un flottant divisé par zéro donne l'infini (`NaN` seulement pour `0.0 / 0`).
  - key: qcm-tester-nan
    format: multiple-choice
    question: Comment savoir si `x` vaut `NaN` ?
    choices:
      - text: "`Double.isNaN(x)`"
        correct: true
      - text: "`x != x`"
        correct: true
      - text: "`x == Double.NaN`"
        correct: false
      - text: "`x.equals(Double.NaN)`"
        correct: false
    answer: '`NaN` est le seul nombre différent de lui-même ; `Double.isNaN` le dit plus lisiblement. `x` étant un primitif, il n''a pas de méthode `equals`.'
  - key: qcm-type-argent
    format: multiple-choice
    question: Quel type choisir pour le total d'une facture ?
    choices:
      - text: "`BigDecimal`"
        correct: true
      - text: "`double`"
        correct: false
      - text: "`float`"
        correct: false
      - text: "`int` en euros"
        correct: false
    answer: '`BigDecimal` calcule en décimal exact ; un `int` en euros perdrait les centimes.'
  - key: qcm-comparer-resultats
    format: multiple-choice
    question: Quelle condition compare correctement deux résultats de calcul `a` et `b` (des `double`) ?
    choices:
      - text: "`Math.abs(a - b) < 1e-9`"
        correct: true
      - text: "`a == b`"
        correct: false
      - text: "`a.equals(b)`"
        correct: false
      - text: "`(int) a == (int) b`"
        correct: false
    answer: Une tolérance absorbe les erreurs d'arrondi ; `==` exige une égalité au bit près.
  - key: code-system-out-println-0-1
    format: code-output
    question: '`System.out.println(0.1 + 0.2 == 0.3);`'
    answer: '`false` : imprécision binaire des flottants.'
    check:
      code: |-
        System.out.println(0.1 + 0.2 == 0.3);
      output: "false"
  - key: code-10-0-0-0-0
    format: code-output
    question: '`10.0 / 0` et `0.0 / 0` ?'
    answer: '`Infinity` et `NaN`, sans exception (alors que `10 / 0` lève ArithmeticException).'
    check:
      code: |-
        System.out.println(10.0 / 0 + " " + 0.0 / 0);
      output: "Infinity NaN"
  - key: code-double-nan-double-nan-double
    format: code-output
    question: '`Double.NaN == Double.NaN` et `Double.valueOf(Double.NaN).equals(Double.NaN)` ?'
    answer: '`false` et `true`.'
    check:
      code: |-
        System.out.println((Double.NaN == Double.NaN) + " " + Double.valueOf(Double.NaN).equals(Double.NaN));
      output: "false true"
  - key: code-somme-affichee
    format: code-output
    question: |-
      ```java
      System.out.println(0.1 + 0.2);
      ```
    answer: '`0.30000000000000004` : la somme binaire la plus proche n''est pas exactement 0.3.'
    check:
      output: "0.30000000000000004"
  - key: bug-egalite-stricte
    format: bug-fix
    question: |-
      Ce test n'affiche jamais « Exact » :
      ```java
      double total = 0.1 + 0.2;
      if (total == 0.3) {
          System.out.println("Exact");
      }
      ```
    answer: |-
      ```java
      if (Math.abs(total - 0.3) < 1e-9) {
          System.out.println("Exact");
      }
      ```
      On compare des flottants à une tolérance près.
  - key: bug-test-nan
    format: bug-fix
    question: |-
      Cette vérification ne détecte jamais un résultat invalide :
      ```java
      if (resultat == Double.NaN) {
          System.out.println("Calcul impossible");
      }
      ```
    answer: |-
      ```java
      if (Double.isNaN(resultat)) {
          System.out.println("Calcul impossible");
      }
      ```
      `NaN` n'est égal à rien, même pas à `Double.NaN` : `==` répond toujours `false`.
  - key: bug-facture-double
    format: bug-fix
    question: |-
      La facture affiche `0.30000000000000004 €` pour trois articles à 0,10 € :
      ```java
      double total = 0.10 * 3;
      ```
    answer: |-
      ```java
      BigDecimal total = new BigDecimal("0.10").multiply(BigDecimal.valueOf(3));
      ```
      `BigDecimal` calcule en décimal exact : le total vaut 0.30. On le crée à partir d'une **chaîne**, car
      `new BigDecimal(0.10)` hériterait de l'imprécision du `double`.
  - key: bug-boucle-infinie
    format: bug-fix
    question: |-
      Cette boucle ne s'arrête jamais :
      ```java
      for (double x = 0; x != 1.0; x += 0.1) {
          System.out.println(x);
      }
      ```
    answer: |-
      ```java
      for (int i = 0; i < 10; i++) {
          double x = i / 10.0;
          System.out.println(x);
      }
      ```
      À force d'arrondis, `x` ne vaut jamais exactement 1.0. On compte avec un entier, et on calcule `x` à partir de lui.
  - key: situation-facture-fausse
    format: scenario
    question: Un client signale une facture dont le total est faux d'un centime. Le code additionne les prix en `double`. Que proposez-vous ?
    answer: |-
      Les `double` représentent mal les décimaux, et les erreurs d'arrondi s'accumulent. Je passerais les montants en
      **`BigDecimal`**, créés à partir de chaînes, avec une règle d'arrondi explicite (`setScale(2,
      RoundingMode.HALF_EVEN)` par exemple) ; ou en centimes dans des `long`. Et j'ajouterais un test sur ce cas.
  - key: situation-test-flottant
    format: scenario
    question: "Un test unitaire échoue avec `expected: <0.3> but was: <0.30000000000000004>`. Comment le corriger ?"
    answer: |-
      Le calcul est juste, c'est la comparaison qui est trop stricte. JUnit compare les flottants avec une tolérance :
      `assertEquals(0.3, resultat, 1e-9)`. Si ce sont des montants, c'est le signe qu'il faudrait plutôt des
      `BigDecimal`.
  - key: situation-nan-tableau-de-bord
    format: scenario
    question: Le tableau de bord affiche `NaN` comme moyenne d'un nouvel utilisateur. D'où cela vient-il ?
    answer: |-
      D'une division `0.0 / 0` : une somme nulle divisée par zéro élément. Avec des flottants, il n'y a pas d'exception,
      juste `NaN`, qui contamine tous les calculs suivants. Il faut traiter le cas « aucune donnée » avant de diviser, et
      afficher par exemple « pas encore de note ».
  - key: situation-float-ou-double
    format: scenario
    question: Un collègue utilise `float` partout « pour gagner de la place ». Qu'en pensez-vous ?
    answer: |-
      Que c'est rarement utile : `float` n'a que ~7 chiffres significatifs, et les erreurs d'arrondi apparaissent vite.
      `double` est le choix par défaut. `float` se justifie pour de très gros volumes en mémoire (grands tableaux,
      calcul graphique), où la moitié de la place compte vraiment ; et pour l'argent, ni l'un ni l'autre.
