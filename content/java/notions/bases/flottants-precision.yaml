notion: flottants-precision
cards:
  - key: 0-1-0-2-0-3
    format: course
    question: Pourquoi `0.1 + 0.2 != 0.3` ?
    answer: 0.1 et 0.2 n'ont pas de représentation binaire exacte en IEEE 754.
  - key: tester-double-nan
    format: course
    question: Comment tester qu'un double est NaN ?
    answer: Double.isNaN(x), car NaN != NaN.
  - key: code-system-out-println-0-1
    format: code-output
    question: '`System.out.println(0.1 + 0.2 == 0.3);`'
    answer: '`false` : imprécision binaire des flottants.'
  - key: code-10-0-0-0-0
    format: code-output
    question: '`10.0 / 0` et `0.0 / 0` ?'
    answer: '`Infinity` et `NaN`, sans exception (alors que `10 / 0` lève ArithmeticException).'
  - key: code-double-nan-double-nan-double
    format: code-output
    question: '`Double.NaN == Double.NaN` et `Double.valueOf(Double.NaN).equals(Double.NaN)` ?'
    answer: '`false` et `true`.'
