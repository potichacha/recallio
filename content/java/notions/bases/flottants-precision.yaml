notion: flottants-precision
lesson: |-
  `float` et `double` suivent la norme **IEEE 754** : un nombre est stocké en **binaire**, avec un nombre limité de
  chiffres. Beaucoup de décimaux simples n'ont pas d'écriture binaire exacte, comme 1/3 n'en a pas en décimal :

  ```java
  System.out.println(0.1 + 0.2);         // 0.30000000000000004
  System.out.println(0.1 + 0.2 == 0.3);  // false
  ```

  - On ne compare donc pas deux résultats de calcul avec `==`, mais **à une tolérance près** :
    `Math.abs(a - b) < 1e-9`.
  - Pour de l'**argent**, ni `double` ni `float` : on utilise `BigDecimal` (ou des centimes dans un `long`).
  - Les flottants ont des valeurs spéciales, sans exception : `1.0 / 0` donne `Infinity`, `0.0 / 0` donne **`NaN`**
    (*Not a Number*), et il existe un `-0.0`.
  - `NaN` n'est égal à rien, pas même à lui-même : on le teste avec `Double.isNaN(x)`.

  `double` (64 bits, ~15 chiffres significatifs) est le choix par défaut ; `float` (~7 chiffres) ne sert que pour
  économiser de la mémoire sur de très gros volumes.

  **Piège classique** : une boucle `for (double x = 0; x != 1.0; x += 0.1)`. À cause des arrondis, `x` ne vaut jamais
  exactement 1.0 : la boucle ne s'arrête pas.

  **En entretien** : « Les flottants sont approximatifs en binaire : on les compare à une tolérance près, et on calcule
  l'argent en `BigDecimal`. »
cards:
  - key: 0-1-0-2-0-3
    format: course
    question: "Pourquoi `0.1 + 0.2 != 0.3` en Java ?"
    choices:
      - {text: "0.1 et 0.2 n'ont pas de représentation binaire exacte", correct: true}
      - {text: "Java arrondit chaque addition de `double` à 15 décimales", correct: false}
      - {text: "La somme est calculée en `float`, moins précis que `double`", correct: false}
      - {text: "`!=` compare les références de deux objets `Double`", correct: false}
    answer: |-
      0.1 et 0.2 n'ont pas de représentation binaire exacte en IEEE 754 : leur somme est le `double` le plus proche,
      0.30000000000000004. Ce n'est pas propre à Java : tout langage qui calcule en `double` donne le même résultat.
  - key: tester-double-nan
    format: course
    question: "Comment tester qu'un `double` vaut `NaN` ?"
    choices:
      - {text: "`Double.isNaN(x)`", correct: true}
      - {text: "`x == Double.NaN`", correct: false}
      - {text: "`Double.NaN.equals(x)`", correct: false}
      - {text: "`Double.isInfinite(x)`", correct: false}
    answer: "`Double.isNaN(x)`, car `NaN` n'est égal à rien, pas même à lui-même : `x == Double.NaN` vaut toujours `false`."
  - key: comparer-doubles
    format: course
    question: Comment comparer deux `double` issus de calculs ?
    choices:
      - {text: "À une tolérance près : `Math.abs(a - b) < 1e-9`", correct: true}
      - {text: "Avec `==`, qui compare les valeurs des primitifs", correct: false}
      - {text: "Avec `a.equals(b)`, qui compare les valeurs exactes", correct: false}
      - {text: "En les castant en `int` avant de les comparer", correct: false}
    answer: |-
      À une tolérance près, par exemple `Math.abs(a - b) < 1e-9`, plutôt qu'avec `==` : deux calculs justes peuvent
      différer au dernier bit.
  - key: argent
    format: course
    question: Quel type utiliser pour des montants d'argent ?
    choices:
      - {text: "`BigDecimal`, ou des centimes dans un `long`", correct: true}
      - {text: "`double`, bien plus précis que `float`", correct: false}
      - {text: "`float`, qui suffit pour deux décimales", correct: false}
      - {text: "`Double`, la classe enveloppe, plus sûre", correct: false}
    answer: |-
      `BigDecimal`, qui calcule en décimal exact ; ou un nombre de centimes dans un `long`. Jamais `double` ni `float`,
      qui ne représentent pas exactement 0,10.
  - key: vf-somme-exacte
    format: true-false
    question: "`0.1 + 0.2 == 0.3` vaut `true`."
    truth: false
    answer: La somme vaut 0.30000000000000004 en `double`.
  - key: vf-division-zero-flottante
    format: true-false
    question: Diviser un `double` par zéro lève une `ArithmeticException`.
    truth: false
    answer: Ça donne `Infinity` (ou `NaN` pour `0.0 / 0`). Seule la division **entière** par zéro lève une exception.
  - key: vf-nan-different
    format: true-false
    question: "`Double.NaN == Double.NaN` vaut `false`."
    truth: true
    answer: '`NaN` n''est égal à rien, pas même à lui-même ; on le teste avec `Double.isNaN`.'
  - key: vf-double-euros
    format: true-false
    question: Un `double` convient pour additionner des montants en euros.
    truth: false
    answer: Les centimes s'arrondissent mal en binaire ; on utilise `BigDecimal`.
  - key: qcm-un-sur-zero
    format: multiple-choice
    question: Que vaut `1.0 / 0` ?
    choices:
      - text: "`Infinity`"
        correct: true
      - text: "Une `ArithmeticException`"
        correct: false
      - text: "`0`"
        correct: false
      - text: "`NaN`"
        correct: false
    answer: Un flottant divisé par zéro donne l'infini (`NaN` seulement pour `0.0 / 0`).
  - key: qcm-tester-nan
    format: multiple-choice
    question: "Quelle expression teste correctement si le `double x` vaut `NaN` ?"
    choices:
      - {text: "`Double.isNaN(x)`", correct: true}
      - {text: "`x == Double.NaN`", correct: false}
      - {text: "`x.equals(Double.NaN)`", correct: false}
      - {text: "`x == 0.0 / 0`", correct: false}
    answer: |-
      `NaN` n'est égal à rien, pas même à lui-même : toute comparaison par `==` vaut `false` (d'où l'astuce `x != x`).
      `Double.isNaN` le dit lisiblement. `x` étant un primitif, il n'a pas de méthode `equals`.
  - key: qcm-type-argent
    format: multiple-choice
    question: Quel type choisir pour le total d'une facture ?
    choices:
      - text: "`BigDecimal`"
        correct: true
      - text: "`double`"
        correct: false
      - text: "`float`"
        correct: false
      - text: "`int` en euros"
        correct: false
    answer: '`BigDecimal` calcule en décimal exact ; un `int` en euros perdrait les centimes.'
  - key: qcm-comparer-resultats
    format: multiple-choice
    question: Quelle condition compare correctement deux résultats de calcul `a` et `b` (des `double`) ?
    choices:
      - text: "`Math.abs(a - b) < 1e-9`"
        correct: true
      - text: "`a == b`"
        correct: false
      - text: "`a.equals(b)`"
        correct: false
      - text: "`(int) a == (int) b`"
        correct: false
    answer: Une tolérance absorbe les erreurs d'arrondi ; `==` exige une égalité au bit près.
  - key: code-system-out-println-0-1
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(0.1 + 0.2 == 0.3);
      ```
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`false` : la somme vaut 0.30000000000000004, à cause de l'imprécision binaire des flottants."
    check:
      code: |-
        System.out.println(0.1 + 0.2 == 0.3);
      output: "false"
  - key: code-10-0-0-0-0
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(10.0 / 0 + " " + 0.0 / 0);
      ```
    choices:
      - {text: "`Infinity NaN`", correct: true}
      - {text: "`NaN NaN`", correct: false}
      - {text: "`Infinity 0.0`", correct: false}
      - {text: "Une `ArithmeticException`", correct: false}
    answer: |-
      `Infinity` et `NaN`, sans exception : la division par zéro en flottant suit IEEE 754, alors que `10 / 0`, entre
      entiers, lève une `ArithmeticException`.
    check:
      code: |-
        System.out.println(10.0 / 0 + " " + 0.0 / 0);
      output: "Infinity NaN"
  - key: code-double-nan-double-nan-double
    format: code-output
    question: |-
      Ce code compare `NaN` à lui-même, avec `==` puis avec `equals`. Qu'affiche-t-il ?
      ```java
      System.out.println((Double.NaN == Double.NaN) + " " + Double.valueOf(Double.NaN).equals(Double.NaN));
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: |-
      `false true` : `==` suit IEEE 754, où `NaN` n'est égal à rien ; `Double.equals` compare les bits, et considère
      `NaN` égal à lui-même pour que les collections fonctionnent.
    check:
      code: |-
        System.out.println((Double.NaN == Double.NaN) + " " + Double.valueOf(Double.NaN).equals(Double.NaN));
      output: "false true"
  - key: code-somme-affichee
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(0.1 + 0.2);
      ```
    choices:
      - {text: "`0.30000000000000004`", correct: true}
      - {text: "`0.3`", correct: false}
      - {text: "`0.29999999999999999`", correct: false}
      - {text: "`0.30000001`", correct: false}
    answer: "`0.30000000000000004` : la somme binaire la plus proche n'est pas exactement 0.3, et `println` l'affiche telle quelle."
    check:
      output: "0.30000000000000004"
  - key: bug-egalite-stricte
    format: bug-fix
    question: |-
      Ce test n'affiche jamais « Exact ». Quelle correction est la bonne ?
      ```java
      double total = 0.1 + 0.2;
      if (total == 0.3) {
          System.out.println("Exact");
      }
      ```
    choices:
      - {text: "`if (Math.abs(total - 0.3) < 1e-9)`", correct: true}
      - {text: "`if (total.equals(0.3))`", correct: false}
      - {text: "`if ((float) total == 0.3)`", correct: false}
      - {text: "`if (Double.compare(total, 0.3) == 0)`", correct: false}
    answer: |-
      ```java
      if (Math.abs(total - 0.3) < 1e-9) {
          System.out.println("Exact");
      }
      ```
      On compare des flottants à une tolérance près. `Double.compare` reste une comparaison exacte, et `total`, un
      primitif, n'a pas de méthode `equals`.
  - key: bug-test-nan
    format: bug-fix
    question: |-
      Cette vérification ne détecte jamais un résultat invalide. Quelle correction est la bonne ?
      ```java
      if (resultat == Double.NaN) {
          System.out.println("Calcul impossible");
      }
      ```
    choices:
      - {text: "`if (Double.isNaN(resultat))`", correct: true}
      - {text: "`if (resultat.equals(Double.NaN))`", correct: false}
      - {text: "`if (resultat == 0.0 / 0)`", correct: false}
      - {text: "`if (Double.isInfinite(resultat))`", correct: false}
    answer: |-
      ```java
      if (Double.isNaN(resultat)) {
          System.out.println("Calcul impossible");
      }
      ```
      `NaN` n'est égal à rien, même pas à `Double.NaN` : `==` répond toujours `false`.
  - key: bug-facture-double
    format: bug-fix
    question: |-
      La facture affiche `0.30000000000000004 €` pour trois articles à 0,10 €. Quelle correction est la bonne ?
      ```java
      double total = 0.10 * 3;
      ```
    choices:
      - {text: "`BigDecimal total = new BigDecimal(\"0.10\").multiply(BigDecimal.valueOf(3));`", correct: true}
      - {text: "`BigDecimal total = new BigDecimal(0.10).multiply(BigDecimal.valueOf(3));`", correct: false}
      - {text: "`float total = 0.10f * 3;`", correct: false}
      - {text: "`double total = Math.round(0.10 * 3);`", correct: false}
    answer: |-
      ```java
      BigDecimal total = new BigDecimal("0.10").multiply(BigDecimal.valueOf(3));
      ```
      `BigDecimal` calcule en décimal exact : le total vaut 0.30. On le crée à partir d'une **chaîne**, car
      `new BigDecimal(0.10)` hériterait de l'imprécision du `double`.
  - key: bug-boucle-infinie
    format: bug-fix
    question: |-
      Cette boucle ne s'arrête jamais. Quelle correction est la bonne ?
      ```java
      for (double x = 0; x != 1.0; x += 0.1) {
          System.out.println(x);
      }
      ```
    choices:
      - {text: "Compter avec un `int i` de 0 à 9, et calculer `x = i / 10.0`", correct: true}
      - {text: "Remplacer `x += 0.1` par `x += 0.1f`, plus court à arrondir", correct: false}
      - {text: "Déclarer `x` en `float` plutôt qu'en `double`", correct: false}
      - {text: "Remplacer la condition `x != 1.0` par `x != 1`", correct: false}
    answer: |-
      ```java
      for (int i = 0; i < 10; i++) {
          double x = i / 10.0;
          System.out.println(x);
      }
      ```
      À force d'arrondis, `x` ne vaut jamais exactement 1.0, en `float` pas plus qu'en `double`. On compte avec un
      entier, et on calcule `x` à partir de lui.
  - key: situation-facture-fausse
    format: scenario
    question: |-
      Un client signale une facture dont le total est faux d'un centime. Le code additionne les prix en `double`. Que
      proposes-tu ?
    choices:
      - {text: "Passer les montants en `BigDecimal` créés depuis des chaînes, avec un arrondi explicite", correct: true}
      - {text: "Garder les `double` et arrondir le total final avec `Math.round(total * 100) / 100.0`", correct: false}
      - {text: "Passer les montants en `float`, plus simples à arrondir à deux décimales", correct: false}
      - {text: "Garder le calcul et formater l'affichage avec `String.format(\"%.2f\", total)`", correct: false}
    answer: |-
      Les `double` représentent mal les décimaux, et les erreurs d'arrondi s'accumulent : arrondir à la fin ou à
      l'affichage masque l'écart sans le supprimer. Passe les montants en **`BigDecimal`**, créés à partir de chaînes,
      avec une règle d'arrondi explicite (`setScale(2, RoundingMode.HALF_EVEN)` par exemple), ou en centimes dans des
      `long` ; et ajoute un test sur ce cas.
  - key: situation-test-flottant
    format: scenario
    question: "Un test unitaire échoue avec `expected: <0.3> but was: <0.30000000000000004>`. Comment le corriger ?"
    choices:
      - {text: "Comparer avec une tolérance : `assertEquals(0.3, resultat, 1e-9)`", correct: true}
      - {text: "Remplacer la valeur attendue par `0.30000000000000004`", correct: false}
      - {text: "Corriger le calcul, faux de 4e-17, avant de toucher au test", correct: false}
      - {text: "Comparer les textes : `assertEquals(\"0.3\", \"\" + resultat)`", correct: false}
    answer: |-
      Le calcul est juste, c'est la comparaison qui est trop stricte. JUnit compare les flottants avec une tolérance :
      `assertEquals(0.3, resultat, 1e-9)`. Si ce sont des montants, c'est le signe qu'il faudrait plutôt des
      `BigDecimal`.
  - key: situation-nan-tableau-de-bord
    format: scenario
    question: Le tableau de bord affiche `NaN` comme moyenne d'un nouvel utilisateur. D'où cela vient-il ?
    choices:
      - {text: "D'une division `0.0 / 0` : une somme nulle, divisée par zéro élément", correct: true}
      - {text: "D'une note `null`, convertie en `double` pendant le calcul", correct: false}
      - {text: "D'un débordement de la somme des notes, calculée en `double`", correct: false}
      - {text: "D'une division entière `0 / 0`, que Java transforme en `NaN`", correct: false}
    answer: |-
      D'une division `0.0 / 0` : une somme nulle divisée par zéro élément. Avec des flottants, il n'y a pas d'exception,
      juste `NaN`, qui contamine tous les calculs suivants (entre entiers, `0 / 0` lèverait une
      `ArithmeticException`). Il faut traiter le cas « aucune donnée » avant de diviser, et afficher par exemple « pas
      encore de note ».
  - key: situation-float-ou-double
    format: scenario
    question: "Un collègue utilise `float` partout « pour gagner de la place ». Qu'en penses-tu ?"
    choices:
      - {text: "Rarement utile : 7 chiffres significatifs seulement, `double` reste le défaut", correct: true}
      - {text: "Bonne idée : `float` est aussi précis que `double`, en moitié moins de place", correct: false}
      - {text: "Bonne idée pour l'argent : `float` arrondit mieux les centimes", correct: false}
      - {text: "Mauvaise idée : `float` ne garde que deux chiffres après la virgule", correct: false}
    answer: |-
      C'est rarement utile : `float` n'a que ~7 chiffres significatifs, et les erreurs d'arrondi apparaissent vite.
      `double` est le choix par défaut. `float` se justifie pour de très gros volumes en mémoire (grands tableaux,
      calcul graphique), où la moitié de la place compte vraiment ; et pour l'argent, ni l'un ni l'autre.
