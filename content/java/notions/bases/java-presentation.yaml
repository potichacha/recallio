notion: java-presentation
lesson: |-
  **Java** est un langage orienté objet, à typage statique, créé en 1995 chez Sun et maintenu aujourd'hui par Oracle et la
  communauté OpenJDK.

  Son idée centrale : on ne compile pas pour un processeur, mais pour une **machine virtuelle**.

  1. `javac` compile le code source (`.java`) en **bytecode** (`.class`), un code intermédiaire indépendant de la machine.
  2. La **JVM** (Java Virtual Machine) exécute ce bytecode : elle l'interprète, puis compile à la volée en code natif
     (le **JIT**) les parties les plus utilisées.

  D'où le slogan *« write once, run anywhere »* : le même `.class` tourne sur Windows, Linux ou macOS, du moment qu'une
  JVM y est installée.

  La JVM apporte aussi la **gestion automatique de la mémoire** (le ramasse-miettes, *garbage collector*) : on crée des
  objets, on ne les libère jamais à la main.

  **Piège classique** : dire que Java est « interprété », donc lent. Grâce au JIT, du code Java qui tourne depuis
  quelques secondes est compilé en code natif optimisé.

  **En entretien** : « Java compile en bytecode, que la JVM exécute en l'interprétant puis en le compilant à la volée ;
  c'est ce qui le rend portable. »
tour:
  - title: Bienvenue
    text: |-
      Bienvenue dans le Tour de Java. Chaque page présente une notion en quelques lignes, avec un programme que tu peux
      **modifier et exécuter** ici même : change-le, casse-le, regarde ce que répond le compilateur.

      Java est né chez Sun en 1995 ; il appartient aujourd'hui à Oracle, avec une implémentation libre, OpenJDK. Le code
      Java est compilé en **bytecode**, que la **machine virtuelle Java** (JVM) exécute et optimise pendant
      l'exécution : le même bytecode tourne partout. Java a un typage statique, un **ramasse-miettes**, et une
      bibliothèque standard très riche.

      Ce Tour suppose que tu programmes déjà dans un autre langage, et utilise Java 25. Les questions à la fin de chaque
      notion vérifient ce que tu viens de voir, et « S'entraîner » ouvre toutes ses cartes.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println("Bienvenue dans le Tour de Java !");
              IO.println("Java " + Runtime.version().feature());
          }
      output: |-
        Bienvenue dans le Tour de Java !
        Java 25
cards:
  - key: java-compile-interprete
    format: course
    question: Java est-il compilé ou interprété ?
    choices:
      - text: "Compilé"
        correct: false
      - text: "Interprété"
        correct: false
      - text: "Les deux"
        correct: true
    answer: "Les deux : compilé en bytecode par `javac`, puis exécuté par la JVM, qui l'interprète et compile à la volée en code natif (JIT) les parties les plus utilisées."
  - key: java-portable
    format: course
    question: Pourquoi Java est-il portable ?
    choices:
      - text: "Java s'exécute sans rien installer sur la machine"
        correct: false
      - text: "Le bytecode est le même partout : seule la JVM change d'un système à l'autre"
        correct: true
      - text: "`javac` produit un exécutable pour chaque système"
        correct: false
      - text: "Le code source est recompilé automatiquement sur chaque système"
        correct: false
    answer: "Le bytecode ne dépend d'aucun système ; seule la JVM est propre à chaque système d'exploitation."
  - key: bytecode
    format: course
    question: Qu'est-ce que le bytecode ?
    choices:
      - text: "Le code machine d'un processeur, produit par `javac`"
        correct: false
      - text: "Un fichier de réglages de la JVM"
        correct: false
      - text: "Le code source Java, une fois mis en forme"
        correct: false
      - text: "Le code intermédiaire produit par `javac`, que la JVM exécute"
        correct: true
    answer: |-
      Le code intermédiaire produit par `javac`, rangé dans des fichiers `.class`. Il ne cible aucun processeur : c'est la
      JVM qui l'exécute.
  - key: memoire-automatique
    format: course
    question: Qui libère la mémoire des objets en Java ?
    choices:
      - text: "Le ramasse-miettes (*garbage collector*) de la JVM"
        correct: true
      - text: "Le système d'exploitation, à la fin de chaque méthode"
        correct: false
      - text: "Le développeur, en appelant `free` ou `delete`"
        correct: false
      - text: "Le compilateur `javac`"
        correct: false
    answer: |-
      Le **ramasse-miettes** (*garbage collector*) de la JVM : il libère les objets que plus rien ne référence. On ne
      libère jamais un objet à la main, contrairement à `free` en C.
  - key: vf-meme-class-partout
    format: true-false
    question: Le même fichier `.class` peut s'exécuter sur Windows et sur Linux sans être recompilé.
    truth: true
    answer: "C'est tout l'intérêt du bytecode : il suffit d'une JVM sur chaque système."
  - key: vf-java-lent-interprete
    format: true-false
    question: Java est lent parce qu'il est entièrement interprété.
    truth: false
    answer: |-
      La JVM interprète d'abord le bytecode, puis le **JIT** compile en code natif optimisé les méthodes les plus
      utilisées. Un programme qui tourne depuis un moment exécute surtout du code natif.
  - key: vf-javac-produit-exe
    format: true-false
    question: "`javac` produit un exécutable natif, comme un `.exe`."
    truth: false
    answer: '`javac` produit des fichiers `.class` contenant du bytecode, qu''on lance avec la commande `java`.'
  - key: vf-free-manuel
    format: true-false
    question: En Java, il faut libérer à la main la mémoire d'un objet dont on n'a plus besoin.
    truth: false
    answer: Le ramasse-miettes s'en charge dès que plus aucune référence ne pointe vers l'objet.
  - key: qcm-execute-bytecode
    format: multiple-choice
    question: Qu'est-ce qui exécute le bytecode Java ?
    choices:
      - text: "La JVM"
        correct: true
      - text: "Le compilateur `javac`"
        correct: false
      - text: "Le système d'exploitation directement"
        correct: false
      - text: "Le navigateur web"
        correct: false
    answer: '`javac` produit le bytecode ; la JVM l''exécute.'
  - key: qcm-write-once
    format: multiple-choice
    question: Que veut dire « write once, run anywhere » ?
    choices:
      - text: "Le même bytecode s'exécute sur tout système qui a une JVM"
        correct: true
      - text: "Un programme Java n'a jamais besoin d'être recompilé, même après modification"
        correct: false
      - text: "Java s'exécute sans aucun logiciel installé"
        correct: false
      - text: "Le code source se copie tel quel dans un autre langage"
        correct: false
    answer: "La portabilité vient du bytecode : la JVM, elle, est propre à chaque système."
  - key: qcm-jit
    format: multiple-choice
    question: À quoi sert le compilateur JIT ?
    choices:
      - text: "À compiler à la volée en code natif les parties du bytecode les plus exécutées"
        correct: true
      - text: "À transformer le code source `.java` en bytecode"
        correct: false
      - text: "À vérifier le style du code"
        correct: false
      - text: "À libérer la mémoire des objets inutilisés"
        correct: false
    answer: '*Just-In-Time* : il compile pendant l''exécution, là où c''est utile. `javac`, lui, compile avant.'
  - key: qcm-caracteristiques
    format: multiple-choice
    question: Quelles affirmations décrivent Java ?
    choices:
      - text: "Un langage orienté objet"
        correct: true
      - text: "Un langage à typage statique"
        correct: true
      - text: "Un langage à mémoire gérée par un ramasse-miettes"
        correct: true
      - text: "Un langage qu'on compile directement pour un processeur"
        correct: false
    answer: Orienté objet, typé statiquement, à mémoire gérée, et compilé pour une machine virtuelle.
  - key: situation-portabilite
    format: scenario
    question: "Ton collègue développe sur Mac, et la production tourne sous Linux. Il te demande s'il doit recompiler l'application pour Linux. Que lui réponds-tu ?"
    choices:
      - text: "Oui, mais seulement les classes qui lisent des fichiers"
        correct: false
      - text: "Oui : `javac` produit un exécutable propre à chaque système"
        correct: false
      - text: "Non, à condition de livrer aussi le code source sur le serveur"
        correct: false
      - text: "Non : le bytecode du `.jar` tourne sur toute JVM de version suffisante"
        correct: true
    answer: |-
      Non : le `.jar` contient du **bytecode**, indépendant du système. Il suffit qu'une **JVM** de la bonne version soit
      installée sur le serveur Linux. Seule précaution : viser la même version de Java (ou une plus récente) en
      production qu'à la compilation, et éviter le code qui dépend du système (chemins en dur, commandes shell).
  - key: situation-performances
    format: scenario
    question: "En réunion, quelqu'un affirme que Java est un mauvais choix pour un service rapide « parce qu'il est interprété ». Que lui réponds-tu ?"
    choices:
      - text: "Que `javac` compile Java en code natif, comme un compilateur C"
        correct: false
      - text: "Qu'il a raison : la JVM interprète le bytecode du début à la fin"
        correct: false
      - text: "Que le JIT compile en code natif les méthodes les plus utilisées : le vrai coût est le démarrage"
        correct: true
      - text: "Que la vitesse d'un service Java ne dépend que du ramasse-miettes"
        correct: false
    answer: |-
      Que la JVM n'interprète le bytecode qu'au démarrage : le **JIT** compile ensuite en code natif optimisé les
      méthodes les plus utilisées, en s'appuyant sur leur comportement réel. Un service Java « chaud » est du code natif.
      Le vrai coût est le **temps de démarrage** et la mémoire ; s'ils comptent (fonctions serverless), on regarde
      l'image native GraalVM ou CRaC.
  - key: situation-fuite-memoire
    format: scenario
    question: "Un débutant ne comprend pas pourquoi son programme manque de mémoire, alors que « Java libère tout seul la mémoire ». Quelle est l'explication la plus probable ?"
    choices:
      - text: "Le ramasse-miettes est désactivé par défaut"
        correct: false
      - text: "Il faut appeler `free` sur les gros objets"
        correct: false
      - text: "Java ne libère la mémoire qu'à la fin du programme"
        correct: false
      - text: "Le programme garde des références vers des objets inutiles, par exemple dans une liste qui grossit sans fin"
        correct: true
    answer: |-
      Le ramasse-miettes ne libère que les objets que **plus rien ne référence**. Si le programme garde des références
      (une liste ou un cache qui grossit sans fin, un écouteur jamais retiré), ces objets restent vivants : c'est une
      fuite mémoire, même en Java. Il faut chercher ce qui retient les objets, par exemple avec un *heap dump*.
  - key: situation-choisir-java
    format: scenario
    question: "Une startup hésite entre Java et un autre langage pour son backend. Lesquels de ces arguments plaident pour Java ?"
    choices:
      - text: "La plus faible consommation de mémoire"
        correct: false
      - text: "Un typage statique qui aide sur une grosse base de code"
        correct: true
      - text: "Le démarrage le plus rapide de tous les langages"
        correct: false
      - text: "Une JVM mûre et performante"
        correct: true
      - text: "Un écosystème très riche (Spring, Quarkus, des bibliothèques pour tout)"
        correct: true
    answer: |-
      Un écosystème très riche (Spring, Quarkus, bibliothèques pour tout), une JVM mûre et performante, un typage
      statique qui aide sur une grosse base de code, des outils solides (IDE, profilage, observabilité) et un vivier de
      développeurs important. Les versions LTS donnent de la stabilité. En contrepartie : une consommation mémoire plus
      élevée et un démarrage plus lent que du natif.
