notion: java-presentation
cards:
  - key: java-compile-interprete
    format: course
    question: Java est-il compilé ou interprété ?
    answer: 'Les deux : compilé en bytecode par javac, puis interprété et compilé à la volée en code natif par le JIT de la JVM.'
  - key: java-portable
    format: course
    question: Pourquoi Java est-il portable ?
    answer: Le bytecode est indépendant de la plateforme ; seule la JVM est spécifique à chaque OS.
