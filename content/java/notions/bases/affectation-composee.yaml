notion: affectation-composee
cards:
  - key: byte-b-1-b-b-1
    format: course
    question: Pourquoi `byte b = 1; b = b + 1;` ne compile pas mais `b += 1` oui ?
    answer: '`b + 1` est promu en int ; l''affectation composée contient un cast implicite.'
  - key: code-short-1-1-compile
    format: code-output
    question: '`short s = 1; s = s + 1;` compile-t-il ?'
    answer: Non, `s + 1` est un int. En revanche `s += 1;` compile (cast implicite) et donne 2.
