notion: affectation-composee
lesson: |-
  Une **affectation composée** combine une opération et une affectation : `+=`, `-=`, `*=`, `/=`, `%=`, et pour les
  bits `&=`, `|=`, `^=`, `<<=`, `>>=`, `>>>=`.

  `x op= y` équivaut à **`x = (T) (x op y)`**, où `T` est le type de `x`, avec `x` évalué une seule fois.

  ```java
  byte b = 10;
  b = b + 1;    // ne compile pas : b + 1 est un int
  b += 1;       // compile : cast implicite vers byte

  int total = 10;
  total += 2.9; // compile, total vaut 12 : la partie décimale est perdue sans avertissement

  String s = "score : ";
  s += 1 + 2;   // "score : 3" : la partie droite est calculée d'abord
  ```

  - Le **cast implicite** évite des casts verbeux, mais peut **tronquer** ou **déborder** en silence.
  - L'affectation est une **expression** qui vaut la valeur affectée, et elle s'associe de droite à gauche :
    `a = b = 0` affecte 0 à `b`, puis à `a`.
  - `+=` sur une `String` concatène (et crée une nouvelle chaîne à chaque fois).

  **Piège classique** : la faute de frappe `x =+ 5`, qui compile : c'est `x = +5`, une simple affectation.

  **En entretien** : « `x += y` contient un cast implicite vers le type de `x` : `b += 1` compile pour un `byte`, au
  risque de tronquer ou de déborder sans le dire. »
cards:
  - key: byte-b-1-b-b-1
    format: course
    question: Pourquoi `byte b = 1; b = b + 1;` ne compile pas mais `b += 1` oui ?
    choices:
      - {text: "`b + 1` est un `int`, et `+=` cache un cast vers `byte`", correct: true}
      - {text: "`b + 1` déborde, alors que `+=` vérifie la plage du `byte`", correct: false}
      - {text: "`+=` calcule en `byte`, alors que `+` calcule en `long`", correct: false}
      - {text: "Le littéral `1` n'est un `byte` que dans `b += 1`", correct: false}
    answer: |-
      `b + 1` est promu en `int` ; l'affectation composée contient un cast implicite vers `byte`. Elle ne vérifie rien :
      un débordement passe en silence.
  - key: equivalence
    format: course
    question: À quoi équivaut exactement `x op= y` ?
    choices:
      - {text: "`x = (T) (x op y)`, où `T` est le type de `x`", correct: true}
      - {text: "`x = x op y`, sans aucune conversion", correct: false}
      - {text: "`x = x op (T) y`, où `T` est le type de `x`", correct: false}
      - {text: "`x = (T) x op y`, où `T` est le type de `y`", correct: false}
    answer: |-
      À `x = (T) (x op y)`, où `T` est le type de `x`, et `x` n'est évalué qu'une fois. Le cast porte sur le résultat
      entier, pas sur `y`.
  - key: risque-cast
    format: course
    question: Quel risque fait courir le cast implicite de `+=` ?
    choices:
      - {text: "Une perte silencieuse : troncature ou débordement, sans erreur", correct: true}
      - {text: "Une `ClassCastException` si les types ne correspondent pas", correct: false}
      - {text: "Une erreur de compilation dès que la valeur ne tient pas", correct: false}
      - {text: "Une `ArithmeticException` levée en cas de débordement", correct: false}
    answer: |-
      Une perte silencieuse : `int i = 10; i += 2.9;` donne 12 (troncature), et `byte b = 127; b += 1;` donne -128
      (débordement). Ni le compilateur ni la JVM ne préviennent.
  - key: affectation-expression
    format: course
    question: Que fait `a = b = 0;` ?
    choices:
      - {text: "Il affecte 0 à `b`, puis la valeur de cette affectation, 0, à `a`", correct: true}
      - {text: "Il compare `b` à 0 et range le résultat booléen dans `a`", correct: false}
      - {text: "Il affecte l'ancienne valeur de `b` à `a`, puis 0 à `b`", correct: false}
      - {text: "Il ne compile pas : une affectation n'a pas de valeur", correct: false}
    answer: |-
      L'affectation est une expression qui vaut la valeur affectée et s'associe de droite à gauche : 0 est affecté à
      `b`, puis à `a`. La comparaison s'écrirait `==`.
  - key: vf-int-double
    format: true-false
    question: "`int i = 10; i += 2.5;` ne compile pas."
    truth: false
    answer: Il compile grâce au cast implicite, et `i` vaut 12.
  - key: vf-string
    format: true-false
    question: "`+=` fonctionne sur une `String`."
    truth: true
    answer: Il concatène et range une nouvelle chaîne dans la variable.
  - key: vf-faute-frappe
    format: true-false
    question: "`x =+ 5;` ne compile pas."
    truth: false
    answer: "Il compile : c'est `x = +5`, une affectation qui écrase `x`."
  - key: vf-droite-a-gauche
    format: true-false
    question: Les affectations s'évaluent de droite à gauche dans `a = b = c = 1;`.
    truth: true
    answer: '`c` reçoit 1, puis `b` reçoit la valeur de `c = 1`, puis `a`.'
  - key: qcm-compile-byte
    format: multiple-choice
    question: Avec `byte b = 5;`, quelles instructions compilent ?
    choices:
      - text: "`b += 3;`"
        correct: true
      - text: "`b *= 2;`"
        correct: true
      - text: "`b = b * 2;`"
        correct: false
      - text: "`b = b + 3;`"
        correct: false
    answer: Seules les affectations composées cachent un cast vers `byte`.
  - key: qcm-valeur-troncature
    format: multiple-choice
    question: Que vaut `n` après `int n = 7; n /= 2;` ?
    choices:
      - text: "3"
        correct: true
      - text: "3.5"
        correct: false
      - text: "4"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: "Division entière : 7 / 2 = 3."
  - key: qcm-droite-dabord
    format: multiple-choice
    question: Que vaut `x` après `int x = 2; x *= 3 + 1;` ?
    choices:
      - text: "8"
        correct: true
      - text: "7"
        correct: false
      - text: "6"
        correct: false
      - text: "9"
        correct: false
    answer: "La partie droite est calculée entière d'abord : `x = x * (3 + 1)`."
  - key: qcm-modulo
    format: multiple-choice
    question: Que vaut `n` après `int n = 17; n %= 5;` ?
    choices:
      - text: "2"
        correct: true
      - text: "3"
        correct: false
      - text: "12"
        correct: false
      - text: "0"
        correct: false
    answer: Le reste de 17 / 5 est 2.
  - key: code-short-1-1-compile
    format: code-output
    question: |-
      Ce code compile-t-il ?
      ```java
      short s = 1;
      s = s + 1;
      ```
    choices:
      - {text: "Non, ça ne compile pas : `s + 1` est un `int`", correct: true}
      - {text: "Oui, et `s` vaut ensuite 2", correct: false}
      - {text: "Oui, mais `s` reste à 1 : le calcul est perdu", correct: false}
      - {text: "Oui, mais une `ClassCastException` est levée", correct: false}
    answer: |-
      Non, `s + 1` est un `int`, qu'on ne range pas dans un `short` sans cast. En revanche `s += 1;` compile (cast
      implicite) et donne 2.
    check:
      code: |-
        short s = 1; s = s + 1;
      compiles: false
  - key: code-enchainement
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int x = 10;
      x -= 3;
      x *= 2;
      x %= 5;
      System.out.println(x);
      ```
    choices:
      - {text: "`4`", correct: true}
      - {text: "`14`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "`7`", correct: false}
    answer: "`4` : 10 - 3 = 7, 7 × 2 = 14, 14 % 5 = 4."
    check:
      output: "4"
  - key: code-troncature
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int total = 10;
      total += 2.9;
      System.out.println(total);
      ```
    choices:
      - {text: "`12`", correct: true}
      - {text: "`12.9`", correct: false}
      - {text: "`13`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `12` : `+=` cache un cast vers `int`, donc le code compile ; 12.9 est tronqué, et la partie décimale disparaît
      sans arrondi.
    check:
      output: "12"
  - key: code-string
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String s = "score : ";
      s += 1 + 2;
      s += "/" + 5;
      System.out.println(s);
      ```
    choices:
      - {text: "`score : 3/5`", correct: true}
      - {text: "`score : 12/5`", correct: false}
      - {text: "`score : 0`", correct: false}
      - {text: "`score : 3 / 5`", correct: false}
    answer: |-
      `score : 3/5` : la partie droite de `+=` est calculée avant la concaténation, donc `1 + 2` donne 3 ; il n'y a
      aucune division, `"/"` n'est qu'un texte.
    check:
      output: "score : 3/5"
  - key: bug-faute-frappe
    format: bug-fix
    question: |-
      Le total vaut toujours le dernier montant au lieu de la somme. Pourquoi ?
      ```java
      for (int montant : montants) {
          total =+ montant;
      }
      ```
    choices:
      - {text: "`=+` affecte `+montant` : l'opérateur composé s'écrit `+=`", correct: true}
      - {text: "`total` est remis à zéro à chaque tour de la boucle", correct: false}
      - {text: "La boucle for-each ne garde que le dernier élément", correct: false}
      - {text: "`montant` est une copie, que `=+` ne peut pas cumuler", correct: false}
    answer: |-
      ```java
      for (int montant : montants) {
          total += montant;
      }
      ```
      `=+` est une affectation de `+montant` (le `+` unaire) : chaque tour écrase le total. L'opérateur composé
      s'écrit `+=`.
  - key: bug-moyenne-tronquee
    format: bug-fix
    question: |-
      La moyenne perd ses décimales. Quelle correction est la bonne ?
      ```java
      int somme = 0;
      for (double note : notes) {
          somme += note;
      }
      double moyenne = (double) somme / notes.length;
      ```
    choices:
      - {text: "Déclarer `somme` en `double`", correct: true}
      - {text: "Écrire `somme = somme + note;` dans la boucle", correct: false}
      - {text: "Retirer le cast `(double)` du calcul de la moyenne", correct: false}
      - {text: "Déclarer `moyenne` en `float` plutôt qu'en `double`", correct: false}
    answer: |-
      ```java
      double somme = 0;
      for (double note : notes) {
          somme += note;
      }
      double moyenne = somme / notes.length;
      ```
      `somme += note` caste chaque note en `int` sans prévenir ; l'accumulateur doit être un `double`. Avec
      `somme = somme + note`, le code ne compilerait plus.
  - key: bug-short-plus
    format: bug-fix
    question: |-
      Ce code ne compile pas (`possible lossy conversion from int to short`). Quelle correction est la bonne ?
      ```java
      short compteur = 0;
      compteur = compteur + 1;
      ```
    choices:
      - {text: "`compteur += 1;`", correct: true}
      - {text: "`compteur = compteur + (short) 1;`", correct: false}
      - {text: "`compteur = (short) compteur + 1;`", correct: false}
      - {text: "`compteur = compteur + 1s;`", correct: false}
    answer: |-
      ```java
      short compteur = 0;
      compteur += 1;
      ```
      `compteur + 1` est un `int`, même si l'on caste un opérande ; `+=` (ou `compteur++`) contient le cast. Un `int`
      serait d'ailleurs plus simple.
  - key: bug-concatenation-boucle
    format: bug-fix
    question: |-
      Ce code est lent sur 100 000 lignes. Quelle correction est la bonne ?
      ```java
      String rapport = "";
      for (String ligne : lignes) {
          rapport += ligne + "\n";
      }
      ```
    choices:
      - {text: "Cumuler dans un `StringBuilder`, avec `append`", correct: true}
      - {text: "Remplacer `+=` par `rapport = rapport.concat(ligne + \"\\n\")`", correct: false}
      - {text: "Remplacer la boucle for-each par une boucle à indice", correct: false}
      - {text: "Appeler `rapport.intern()` après chaque ajout", correct: false}
    answer: |-
      ```java
      StringBuilder rapport = new StringBuilder();
      for (String ligne : lignes) {
          rapport.append(ligne).append("\n");
      }
      ```
      Chaque `+=` (ou `concat`) sur une `String` crée une nouvelle chaîne et recopie tout : le coût devient
      quadratique. Un `StringBuilder` (ou `String.join("\n", lignes)`) ajoute sans recopier.
