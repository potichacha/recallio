notion: surcharge
lesson: |-
  **Surcharger** une méthode, c'est déclarer plusieurs méthodes de **même nom** avec des **paramètres différents**
  (nombre, types ou ordre) :

  ```java
  static int aire(int cote) { return cote * cote; }
  static int aire(int largeur, int hauteur) { return largeur * hauteur; }
  static double aire(double rayon) { return Math.PI * rayon * rayon; }
  ```

  - Le compilateur choisit la méthode **à la compilation**, d'après le type **déclaré** des arguments.
  - Le **type de retour seul** ne suffit pas : deux méthodes qui ne diffèrent que par lui ne compilent pas.
  - Pour choisir, le compilateur cherche dans l'ordre : correspondance exacte, conversion élargissante (`int` →
    `long`), autoboxing (`int` → `Integer`), puis varargs. Parmi plusieurs candidates, il prend **la plus spécifique**.
  - Si deux candidates sont aussi bonnes l'une que l'autre, l'appel est **ambigu** et ne compile pas.

  À ne pas confondre avec la **redéfinition** (*override*) : même signature dans une sous-classe, choisie à
  l'exécution selon l'objet réel.

  **Piège classique** : `o(null)` avec `o(String)` et `o(Integer)`. Les deux acceptent `null` et aucune n'est plus
  spécifique : l'appel ne compile pas.

  **En entretien** : « La surcharge se résout à la compilation sur les types déclarés, la redéfinition à l'exécution
  sur le type réel. »
tour:
  - title: La surcharge
    text: |-
      Plusieurs méthodes peuvent porter le **même nom** si leurs paramètres diffèrent, en nombre ou en type : c'est la
      **surcharge**. Le compilateur choisit laquelle appeler d'après les types des arguments, à la compilation.

      Le type de retour ne suffit pas à distinguer deux méthodes. Et quand plusieurs conviennent, Java prend la plus
      précise : un `int` préfère `decrit(int)` à `decrit(double)`.
    example:
      files:
        Main.java: |-
          String decrit(int n) {
              return "un entier : " + n;
          }

          String decrit(double d) {
              return "un réel : " + d;
          }

          String decrit(String s) {
              return "une chaîne : " + s;
          }

          String decrit(int a, int b) {
              return "deux entiers : " + (a + b);
          }

          void main() {
              IO.println(decrit(3));
              IO.println(decrit(3.5));
              IO.println(decrit("trois"));
              IO.println(decrit(1, 2));
          }
      output: |-
        un entier : 3
        un réel : 3.5
        une chaîne : trois
        deux entiers : 3
cards:
  - key: ordre-resolution-surcharge
    format: course
    question: "Dans quel ordre le compilateur cherche-t-il la version d'une méthode surchargée à appeler ?"
    choices:
      - {text: "Correspondance exacte, puis élargissement, puis autoboxing, puis varargs", correct: true}
      - {text: "Correspondance exacte, puis autoboxing, puis élargissement, puis varargs", correct: false}
      - {text: "Correspondance exacte, puis varargs, puis élargissement, puis autoboxing", correct: false}
      - {text: "La première méthode compatible, dans l'ordre où la classe les déclare", correct: false}
    answer: |-
      Correspondance exacte, puis élargissement (`int` → `long`), puis autoboxing, puis varargs. L'élargissement passe
      avant l'autoboxing : avec `m(long)` et `m(Integer)`, l'appel `m(5)` choisit `m(long)`.
  - key: definition
    format: course
    question: Qu'est-ce que la surcharge d'une méthode ?
    choices:
      - {text: "Plusieurs méthodes de même nom dans la même classe, avec des paramètres différents", correct: true}
      - {text: "Une méthode de sous-classe qui remplace celle du parent, avec la même signature", correct: false}
      - {text: "Plusieurs méthodes de même nom et mêmes paramètres, aux types de retour différents", correct: false}
      - {text: "Une méthode qui accepte plus d'arguments qu'elle ne déclare de paramètres", correct: false}
    answer: Plusieurs méthodes de même nom dans la même classe, avec des listes de paramètres différentes (nombre, types ou ordre).
  - key: type-retour
    format: course
    question: Peut-on surcharger une méthode en ne changeant que son type de retour ?
    choices:
      - {text: "Non : le type de retour ne fait pas partie de la signature", correct: true}
      - {text: "Oui : le compilateur choisit selon la variable qui reçoit le résultat", correct: false}
      - {text: "Oui, si l'un des types de retour est un sous-type de l'autre", correct: false}
      - {text: "Oui, mais seulement pour des méthodes `static`", correct: false}
    answer: |-
      Non : la signature ne compte que le nom et les paramètres. Le compilateur ne saurait pas laquelle appeler, et
      refuse deux méthodes de même signature. Un type de retour plus précis n'est permis que pour une redéfinition.
  - key: surcharge-vs-redefinition
    format: course
    question: Quelle différence entre surcharge et redéfinition ?
    choices:
      - {text: "La surcharge se résout à la compilation, sur les types déclarés ; la redéfinition à l'exécution, sur le type réel", correct: true}
      - {text: "La surcharge se résout à l'exécution, sur le type réel ; la redéfinition à la compilation, sur les types déclarés", correct: false}
      - {text: "Les deux se résolvent à la compilation ; seule la redéfinition exige d'être dans une sous-classe", correct: false}
      - {text: "Les deux se résolvent à l'exécution ; seule la surcharge exige des paramètres différents", correct: false}
    answer: |-
      La **surcharge** (même nom, paramètres différents) est résolue à la compilation, sur les types déclarés. La
      **redéfinition** (même signature, dans une sous-classe) est résolue à l'exécution, sur le type réel de l'objet.
  - key: vf-compilation
    format: true-false
    question: Le choix entre deux méthodes surchargées se fait à la compilation.
    truth: true
    answer: Il dépend des types déclarés des arguments, pas de leur type réel à l'exécution.
  - key: vf-retour-seul
    format: true-false
    question: "`int lire()` et `String lire()` peuvent coexister dans la même classe."
    truth: false
    answer: "Même nom et mêmes paramètres : c'est la même signature, le type de retour n'y entre pas."
  - key: vf-ambiguite
    format: true-false
    question: Avec `o(String)` et `o(Integer)`, l'appel `o(null)` compile.
    truth: false
    answer: "Les deux acceptent `null` et aucune n'est plus spécifique : l'appel est ambigu."
  - key: vf-ordre-parametres
    format: true-false
    question: "`f(int, String)` et `f(String, int)` sont deux surcharges valides."
    truth: true
    answer: L'ordre des types fait partie de la signature.
  - key: qcm-choisie
    format: multiple-choice
    question: "Avec `m(long x)` et `m(Integer x)`, quelle méthode appelle `m(5)` ?"
    choices:
      - text: "`m(long)`"
        correct: true
      - text: "`m(Integer)`"
        correct: false
      - text: "Aucune, l'appel est ambigu"
        correct: false
      - text: "Les deux"
        correct: false
    answer: L'élargissement (`int` → `long`) passe avant l'autoboxing (`int` → `Integer`).
  - key: qcm-valide
    format: multiple-choice
    question: Quelles paires sont des surcharges valides ?
    choices:
      - text: "`aire(int)` et `aire(double)`"
        correct: true
      - text: "`aire(int)` et `aire(int, int)`"
        correct: true
      - text: "`int aire(int)` et `double aire(int)`"
        correct: false
      - text: "`aire(int a)` et `aire(int b)`"
        correct: false
    answer: Il faut des types ou un nombre de paramètres différents ; ni le nom des paramètres ni le type de retour ne comptent.
  - key: qcm-plus-specifique
    format: multiple-choice
    question: "Avec `o(Object)` et `o(String)`, quelle méthode appelle `o(\"a\")` ?"
    choices:
      - text: "`o(String)`"
        correct: true
      - text: "`o(Object)`"
        correct: false
      - text: "L'appel est ambigu"
        correct: false
    answer: Les deux conviennent, la plus spécifique l'emporte.
  - key: qcm-type-declare
    format: multiple-choice
    question: "`Object x = \"a\";` puis `o(x)`, avec `o(Object)` et `o(String)`. Quelle méthode est appelée ?"
    choices:
      - text: "`o(Object)`"
        correct: true
      - text: "`o(String)`"
        correct: false
      - text: "Ça dépend de l'exécution"
        correct: false
    answer: La surcharge se résout sur le type **déclaré**, `Object`, pas sur le type réel.
  - key: trous-surcharge
    format: fill-in
    question: |-
      Complète la surcharge qui accepte deux paramètres :
      ```java
      static int aire(int cote) { return cote * cote; }
      static int ___(int largeur, int hauteur) { return largeur * hauteur; }
      ```
    blanks: [[aire]]
    answer: Le même nom, avec d'autres paramètres.
  - key: trous-type-parametre
    format: fill-in
    question: |-
      Complète pour surcharger `afficher` sur les nombres à virgule :
      ```java
      static void afficher(int n) { System.out.println("entier " + n); }
      static void afficher(___ d) { System.out.println("décimal " + d); }
      ```
    blanks: [[double, float]]
    answer: Un type de paramètre différent suffit à distinguer les deux méthodes.
  - key: trous-cast-ambiguite
    format: fill-in
    question: |-
      Avec `o(String)` et `o(Integer)`, complète pour lever l'ambiguïté :
      ```java
      o((___) null);
      ```
    blanks: [[String, Integer]]
    answer: Le cast donne un type déclaré à `null`, ce qui désigne une seule méthode.
  - key: trous-nombre-parametres
    format: fill-in
    question: |-
      Complète l'appel de la version à trois paramètres :
      ```java
      static int max(int a, int b) { return Math.max(a, b); }
      static int max(int a, int b, int c) { return max(max(a, b), c); }
      int plusGrand = max(4, 9, ___);
      ```
    blanks: [["1", "2", "3", "5", "7", "0"]]
    answer: Avec trois arguments, c'est la version à trois paramètres qui est choisie.
  - key: code-static-void-o-object-x
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void o(Object x) { System.out.println("Object"); }
      static void o(String x) { System.out.println("String"); }
      o(null);
      ```
    choices:
      - {text: "`String`", correct: true}
      - {text: "`Object`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
    answer: '`String` : la surcharge la plus spécifique est choisie. Avec `o(String)` et `o(Integer)`, l''appel `o(null)` ne compilerait pas (ambiguïté).'
    check:
      output: "String"
  - key: code-elargissement
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void m(long x) { System.out.println("long"); }
      static void m(Integer x) { System.out.println("Integer"); }
      m(5);
      ```
    choices:
      - {text: "`long`", correct: true}
      - {text: "`Integer`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `long` : l'élargissement (`int` → `long`) passe avant l'autoboxing (`int` → `Integer`). L'appel n'est pas
      ambigu : le compilateur essaie l'élargissement d'abord.
    check:
      output: "long"
  - key: code-type-declare
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void o(Object x) { System.out.println("Object"); }
      static void o(String x) { System.out.println("String"); }
      Object valeur = "texte";
      o(valeur);
      ```
    choices:
      - {text: "`Object`", correct: true}
      - {text: "`String`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Une `ClassCastException`", correct: false}
    answer: |-
      `Object` : la surcharge se choisit à la compilation, sur le type déclaré de `valeur`, même si l'objet est
      réellement une `String`.
    check:
      output: "Object"
  - key: code-nombre-arguments
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static int aire(int c) { return c * c; }
      static int aire(int l, int h) { return l * h; }
      System.out.println(aire(3) + " " + aire(3, 4));
      ```
    choices:
      - {text: "`9 12`", correct: true}
      - {text: "`9 9`", correct: false}
      - {text: "`12 12`", correct: false}
      - {text: "`6 7`", correct: false}
    answer: '`9 12` : chaque appel choisit la version selon son nombre d''arguments.'
    check:
      output: "9 12"
  - key: bug-retour-seul
    format: bug-fix
    question: |-
      Ce code ne compile pas (`method convertir(String) is already defined`). Quelle correction est la bonne ?
      ```java
      static int convertir(String s) { return Integer.parseInt(s); }
      static double convertir(String s) { return Double.parseDouble(s); }
      ```
    choices:
      - {text: "Donner deux noms différents : `enEntier(String)` et `enDecimal(String)`", correct: true}
      - {text: "Caster à l'appel : `(double) convertir(s)` choisit la seconde méthode", correct: false}
      - {text: "Renommer le paramètre de la seconde : `convertir(String texte)`", correct: false}
      - {text: "Déclarer la seconde `private` pour distinguer les deux méthodes", correct: false}
    answer: |-
      ```java
      static int enEntier(String s) { return Integer.parseInt(s); }
      static double enDecimal(String s) { return Double.parseDouble(s); }
      ```
      Le type de retour ne distingue pas deux méthodes ; deux noms différents disent aussi mieux ce qu'elles font.
  - key: bug-ambiguite-null
    format: bug-fix
    question: |-
      Ce code ne compile pas (`reference to afficher is ambiguous`). Quelle correction est la bonne ?
      ```java
      static void afficher(String s) { }
      static void afficher(Integer i) { }
      afficher(null);
      ```
    choices:
      - {text: "`afficher((String) null);`", correct: true}
      - {text: "`afficher((Object) null);`", correct: false}
      - {text: "`afficher((null));`", correct: false}
      - {text: "`afficher(null, null);`", correct: false}
    answer: |-
      ```java
      afficher((String) null);
      ```
      `null` convient aux deux ; le cast désigne la méthode voulue.
  - key: bug-attente-type-reel
    format: bug-fix
    question: |-
      On attendait « chaîne », mais ce code affiche « objet ». Pourquoi ?
      ```java
      static void decrire(Object o) { System.out.println("objet"); }
      static void decrire(String s) { System.out.println("chaîne"); }
      Object valeur = "Ada";
      decrire(valeur);
      ```
    choices:
      - {text: "La surcharge se choisit sur le type déclaré, `Object`, pas sur le type réel", correct: true}
      - {text: "`\"Ada\"` devient un simple `Object` à l'affectation et perd son type `String`", correct: false}
      - {text: "La méthode déclarée en premier gagne quand plusieurs conviennent", correct: false}
      - {text: "`decrire(String)` ne s'applique qu'aux littéraux, pas aux variables", correct: false}
    answer: |-
      ```java
      String valeur = "Ada";
      decrire(valeur);
      ```
      La surcharge se résout sur le type **déclaré** : il faut déclarer `valeur` en `String`. Pour un choix selon le type
      réel, il faudrait un `instanceof` ou un `switch` sur le motif.
  - key: bug-parametres-memes-types
    format: bug-fix
    question: |-
      Ce code ne compile pas (`method aire(int,int) is already defined`). Pourquoi ?
      ```java
      static int aire(int largeur, int hauteur) { return largeur * hauteur; }
      static int aire(int base, int hauteur) { return base * hauteur / 2; }
      ```
    choices:
      - {text: "Le nom des paramètres ne compte pas : les deux ont la signature `aire(int, int)`", correct: true}
      - {text: "Deux méthodes surchargées ne peuvent pas avoir le même type de retour", correct: false}
      - {text: "Le second calcul divise par 2 et devrait renvoyer un `double`", correct: false}
      - {text: "Une méthode `static` ne peut pas être surchargée dans sa classe", correct: false}
    answer: |-
      ```java
      static int aireRectangle(int largeur, int hauteur) { return largeur * hauteur; }
      static int aireTriangle(int base, int hauteur) { return base * hauteur / 2; }
      ```
      Le nom des paramètres ne compte pas : les deux ont la signature `aire(int, int)`. Des noms de méthodes différents
      lèvent l'ambiguïté.
