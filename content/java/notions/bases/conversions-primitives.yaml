notion: conversions-primitives
lesson: |-
  Passer une valeur d'un type primitif à un autre, c'est une **conversion** :

  - **élargissante** (*widening*), vers un type plus grand : automatique.
    `byte` → `short` → `int` → `long` → `float` → `double`, et `char` → `int`.
    ```java
    int n = 42;
    long l = n;        // aucune perte possible : pas de cast
    double d = l;
    ```
  - **restrictive** (*narrowing*), vers un type plus petit : il faut un **cast** explicite, car on peut perdre de
    l'information.
    ```java
    double prix = 9.99;
    int entier = (int) prix;   // 9 : la partie décimale est tronquée, pas arrondie
    byte b = (byte) 200;       // -56 : la valeur dépasse et « fait le tour »
    ```

  Le cast d'un nombre à virgule vers un entier **tronque vers zéro** : `(int) 3.99` vaut 3, `(int) -3.99` vaut -3. Pour
  arrondir, on utilise `Math.round`.

  Un cast ne convertit **jamais un texte en nombre** : `(int) "42"` ne compile pas. On écrit `Integer.parseInt("42")`.

  **Piège classique** : `double moyenne = somme / nombre;` avec deux `int`. La division est **entière** (7 / 2 = 3),
  puis seulement convertie en `double` (3.0). Il faut convertir avant : `(double) somme / nombre`.

  **En entretien** : « Les conversions élargissantes sont implicites ; les restrictives demandent un cast et peuvent
  tronquer ou déborder sans erreur. »
cards:
  - key: elargissante
    format: course
    question: Qu'est-ce qu'une conversion élargissante ?
    answer: |-
      La conversion vers un type plus grand (`int` → `long`, `float` → `double`...). Elle est automatique, car la valeur
      tient toujours dans le type d'arrivée.
  - key: restrictive
    format: course
    question: Qu'est-ce qu'une conversion restrictive, et pourquoi faut-il un cast ?
    answer: |-
      La conversion vers un type plus petit (`double` → `int`, `int` → `byte`...). Elle peut perdre de l'information,
      alors Java exige un cast explicite : `(int) prix`.
  - key: cast-tronque
    format: course
    question: Que fait `(int)` appliqué à un `double` ?
    answer: Il **tronque vers zéro** la partie décimale, sans arrondir ; pour arrondir, on utilise `Math.round`.
  - key: division-entiere-double
    format: course
    question: Pourquoi `double d = 7 / 2;` donne-t-il `3.0` ?
    answer: |-
      `7 / 2` est une division **entière** entre deux `int`, qui donne 3 ; le résultat n'est converti en `double`
      qu'ensuite. Il faut un opérande `double` : `7.0 / 2` ou `(double) 7 / 2`.
  - key: vf-int-vers-long
    format: true-false
    question: Affecter un `int` à un `long` demande un cast explicite.
    truth: false
    answer: "C'est une conversion élargissante : elle est automatique."
  - key: vf-cast-arrondit
    format: true-false
    question: "`(int) 3.99` vaut 4."
    truth: false
    answer: "Le cast tronque : `(int) 3.99` vaut 3."
  - key: vf-perte-information
    format: true-false
    question: Une conversion restrictive peut perdre de l'information sans lever d'erreur.
    truth: true
    answer: '`(byte) 200` vaut -56 et `(int) 9.99` vaut 9, sans exception.'
  - key: vf-cast-chaine
    format: true-false
    question: "`(int) \"42\"` convertit la chaîne en nombre."
    truth: false
    answer: "Ça ne compile pas : un cast ne convertit pas un texte. On écrit `Integer.parseInt(\"42\")`."
  - key: qcm-compile-sans-cast
    format: multiple-choice
    question: Laquelle de ces lignes compile sans cast ?
    choices:
      - text: "`long l = 42;`"
        correct: true
      - text: "`int i = 42L;`"
        correct: false
      - text: "`float f = 1.5;`"
        correct: false
      - text: "`byte b = 300;`"
        correct: false
    answer: '`int` → `long` est élargissante ; `42L` est un `long`, `1.5` un `double` et 300 dépasse un `byte`.'
  - key: qcm-cast-negatif
    format: multiple-choice
    question: Que vaut `(int) -7.9` ?
    choices:
      - text: "-7"
        correct: true
      - text: "-8"
        correct: false
      - text: "7"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: "Le cast tronque **vers zéro** : -7.9 devient -7."
  - key: qcm-elargissantes
    format: multiple-choice
    question: Quelles conversions sont élargissantes ?
    choices:
      - text: "`int` → `long`"
        correct: true
      - text: "`float` → `double`"
        correct: true
      - text: "`double` → `int`"
        correct: false
      - text: "`long` → `short`"
        correct: false
    answer: Une conversion élargissante va vers un type plus grand.
  - key: qcm-texte-vers-entier
    format: multiple-choice
    question: Comment obtenir l'entier 42 à partir de la chaîne `"42"` ?
    choices:
      - text: "`Integer.parseInt(\"42\")`"
        correct: true
      - text: "`(int) \"42\"`"
        correct: false
      - text: "`\"42\".toInt()`"
        correct: false
      - text: "`int.parse(\"42\")`"
        correct: false
    answer: '`Integer.parseInt` analyse le texte ; elle lève `NumberFormatException` s''il ne contient pas un entier.'
  - key: trous-cast-int
    format: fill-in
    question: |-
      Complétez pour ranger la partie entière de 9.7 :
      ```java
      int entier = (___) 9.7;
      ```
    blanks: [[int]]
    answer: "Le cast `(int)` tronque : `entier` vaut 9."
  - key: trous-moyenne
    format: fill-in
    question: |-
      `somme` et `nombre` sont des `int`. Complétez pour calculer une vraie moyenne :
      ```java
      double moyenne = (___) somme / nombre;
      ```
    blanks: [[double]]
    answer: Convertir `somme` avant la division la rend décimale ; sinon elle serait entière.
  - key: trous-parse
    format: fill-in
    question: |-
      Complétez pour convertir le texte saisi en entier :
      ```java
      int n = Integer.___("42");
      ```
    blanks: [[parseInt]]
    answer: '`Integer.parseInt` lit un entier dans une chaîne (`Integer.valueOf` renverrait un `Integer`).'
  - key: trous-cast-byte
    format: fill-in
    question: |-
      Complétez pour ranger 100 dans un `byte` à partir d'un `int` :
      ```java
      int valeur = 100;
      byte petit = (___) valeur;
      ```
    blanks: [[byte]]
    answer: '`int` → `byte` est restrictive : il faut le cast, même si 100 tient dans un `byte`.'
  - key: code-int-3-99-int-3
    format: code-output
    question: '`(int) 3.99` et `(int) -3.99` ?'
    answer: '`3` et `-3` : le cast tronque vers zéro.'
    check:
      code: |-
        System.out.println((int) 3.99 + " " + (int) -3.99);
      output: "3 -3"
  - key: code-byte-b-byte-200-system
    format: code-output
    question: '`byte b = (byte) 200; System.out.println(b);`'
    answer: '`-56` : 200 - 256.'
    check:
      code: |-
        byte b = (byte) 200; System.out.println(b);
      output: "-56"
  - key: code-division-avant-conversion
    format: code-output
    question: |-
      ```java
      double d = 7 / 2;
      System.out.println(d);
      ```
    answer: '`3.0` : la division entière donne 3, converti ensuite en `double`.'
    check:
      output: "3.0"
  - key: code-char-et-int
    format: code-output
    question: |-
      ```java
      System.out.println((int) 'a' + " " + (char) 98);
      ```
    answer: '`97 b` : un `char` se convertit en son code, et le code 98 redevient le caractère `b`.'
    check:
      output: "97 b"
  - key: bug-perte-double
    format: bug-fix
    question: |-
      Ce code ne compile pas (`possible lossy conversion from double to int`) :
      ```java
      int total = 9.5;
      ```
    answer: |-
      ```java
      double total = 9.5;
      ```
      Une valeur à virgule se range dans un `double`. Si l'on voulait vraiment un entier, il faudrait un cast
      (`(int) 9.5`, qui donne 9).
  - key: bug-cast-chaine
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      String saisie = "42";
      int age = (int) saisie;
      ```
    answer: |-
      ```java
      int age = Integer.parseInt(saisie);
      ```
      Un cast ne transforme pas un texte en nombre : il faut l'analyser.
  - key: bug-moyenne-entiere
    format: bug-fix
    question: |-
      Avec `somme = 7` et `nombre = 2`, cette moyenne vaut 3.0 au lieu de 3.5 :
      ```java
      double moyenne = somme / nombre;
      ```
    answer: |-
      ```java
      double moyenne = (double) somme / nombre;
      ```
      Entre deux `int`, la division est entière ; convertir un opérande avant la division la rend décimale.
  - key: bug-byte-plus-un
    format: bug-fix
    question: |-
      Ce code ne compile pas (`possible lossy conversion from int to byte`) :
      ```java
      byte b = 10;
      b = b + 1;
      ```
    answer: |-
      ```java
      b += 1;
      ```
      `b + 1` est un `int` (promotion numérique). `+=` contient un cast implicite ; sinon, `b = (byte) (b + 1);`.
