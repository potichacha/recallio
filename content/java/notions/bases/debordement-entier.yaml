notion: debordement-entier
cards:
  - key: vaut-integer-max-value-1
    format: course
    question: Que vaut `Integer.MAX_VALUE + 1` ?
    answer: 'Integer.MIN_VALUE : le débordement est silencieux.'
  - key: detecter-debordement
    format: course
    question: Comment détecter un débordement ?
    answer: Math.addExact, multiplyExact, toIntExact, qui lèvent ArithmeticException.
  - key: code-system-out-println-math-abs
    format: code-output
    question: '`System.out.println(Math.abs(Integer.MIN_VALUE));`'
    answer: '`-2147483648` : la valeur positive n''est pas représentable.'
  - key: code-system-out-println-integer-max
    format: code-output
    question: '`System.out.println(Integer.MAX_VALUE + 1);`'
    answer: '`-2147483648` : débordement silencieux.'
