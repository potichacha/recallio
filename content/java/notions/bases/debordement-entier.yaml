notion: debordement-entier
lesson: |-
  Les entiers Java ont une plage fixe. Quand un calcul la dépasse, le résultat **déborde** et « fait le tour »,
  **sans erreur** :

  ```java
  int max = Integer.MAX_VALUE;     // 2 147 483 647
  System.out.println(max + 1);     // -2147483648 : on repasse au minimum
  ```

  - Le débordement est **silencieux** pour `int` et `long` : pas d'exception, juste une valeur fausse.
  - **`Math.addExact`**, `subtractExact`, `multiplyExact`, `toIntExact` lèvent une `ArithmeticException` au lieu de
    déborder : à utiliser quand un dépassement est possible et grave (montants, quantités).
  - Le calcul se fait dans le type des opérandes, **avant** l'affectation : `long ms = 30 * 24 * 3600 * 1000;` déborde
    en `int`, puis range la valeur fausse dans le `long`. On écrit `30L * 24 * 3600 * 1000`.
  - `Math.abs(Integer.MIN_VALUE)` reste **négatif** : la valeur positive correspondante n'est pas représentable.
  - Pour des nombres sans limite, `BigInteger` (ou `BigDecimal` pour des décimaux).

  **Piège classique** : le milieu de deux indices, `(debut + fin) / 2`. Sur de très grands tableaux, `debut + fin`
  déborde ; `debut + (fin - debut) / 2` reste correct.

  **En entretien** : « Le débordement des entiers est silencieux en Java ; on utilise `Math.addExact` quand il doit
  être détecté, et on calcule en `long` avant d'affecter. »
cards:
  - key: vaut-integer-max-value-1
    format: course
    question: Que vaut `Integer.MAX_VALUE + 1` ?
    answer: "Integer.MIN_VALUE (-2147483648) : débordement silencieux."
  - key: detecter-debordement
    format: course
    question: Comment détecter un débordement ?
    answer: Math.addExact / multiplyExact / toIntExact lèvent une ArithmeticException.
  - key: calcul-avant-affectation
    format: course
    question: Pourquoi `long ms = 30 * 24 * 3600 * 1000;` donne-t-il une valeur fausse ?
    answer: |-
      Le produit est calculé en `int`, où il déborde, **avant** d'être rangé dans le `long`. Un premier opérande `long`
      (`30L * ...`) fait tout le calcul en `long`.
  - key: abs-min-value
    format: course
    question: Pourquoi `Math.abs(Integer.MIN_VALUE)` est-il négatif ?
    answer: "Parce que +2 147 483 648 n'est pas représentable en `int` (le maximum est 2 147 483 647) : le résultat déborde et redonne le minimum."
  - key: vf-exception
    format: true-false
    question: Un débordement d'`int` lève une `ArithmeticException`.
    truth: false
    answer: Il est silencieux ; seules les méthodes `Math.*Exact` lèvent une exception.
  - key: vf-add-exact
    format: true-false
    question: "`Math.addExact(Integer.MAX_VALUE, 1)` lève une `ArithmeticException`."
    truth: true
    answer: "C'est son rôle : signaler le débordement au lieu de le cacher."
  - key: vf-long-sauve
    format: true-false
    question: Ranger le résultat dans un `long` suffit à éviter le débordement d'un calcul fait sur des `int`.
    truth: false
    answer: Le calcul a déjà débordé en `int` ; il faut un opérande `long` dès le départ.
  - key: vf-big-integer
    format: true-false
    question: "`BigInteger` ne déborde jamais."
    truth: true
    answer: Il grandit autant que nécessaire (au prix de la mémoire et de la vitesse).
  - key: qcm-milieu
    format: multiple-choice
    question: Quelle écriture du milieu de deux indices ne déborde jamais ?
    choices:
      - text: "`debut + (fin - debut) / 2`"
        correct: true
      - text: "`(debut + fin) / 2`"
        correct: false
      - text: "`(debut + fin) * 0.5`"
        correct: false
      - text: "`debut / 2 + fin`"
        correct: false
    answer: '`debut + fin` peut dépasser `Integer.MAX_VALUE` ; `fin - debut` reste dans la plage.'
  - key: qcm-detecter
    format: multiple-choice
    question: Quelle méthode multiplie deux `int` en levant une exception s'ils débordent ?
    choices:
      - text: "`Math.multiplyExact(a, b)`"
        correct: true
      - text: "`Math.multiply(a, b)`"
        correct: false
      - text: "`a * b`"
        correct: false
      - text: "`Integer.safeMultiply(a, b)`"
        correct: false
    answer: Les méthodes `*Exact` de `Math` signalent le dépassement.
  - key: qcm-calcul-long
    format: multiple-choice
    question: Quelle expression calcule correctement le nombre de millisecondes de 30 jours ?
    choices:
      - text: "`30L * 24 * 3600 * 1000`"
        correct: true
      - text: "`30 * 24 * 3600 * 1000`"
        correct: false
      - text: "`(long) (30 * 24 * 3600 * 1000)`"
        correct: false
      - text: "`30 * 24 * 3600 * 1000 + 0L`"
        correct: false
    answer: Le `long` doit entrer dans le calcul avant le débordement ; un cast ou un `+ 0L` après coup arrivent trop tard.
  - key: qcm-plage-int
    format: multiple-choice
    question: Quelle est la valeur maximale d'un `int` ?
    choices:
      - text: "2 147 483 647"
        correct: true
      - text: "4 294 967 295"
        correct: false
      - text: "32 767"
        correct: false
      - text: "9 223 372 036 854 775 807"
        correct: false
    answer: 2³¹ - 1 ; 32 767 est le maximum d'un `short`, et le dernier celui d'un `long`.
  - key: code-system-out-println-math-abs
    format: code-output
    question: '`System.out.println(Math.abs(Integer.MIN_VALUE));`'
    answer: '`-2147483648` : la valeur positive n''est pas représentable.'
    check:
      code: |-
        System.out.println(Math.abs(Integer.MIN_VALUE));
      output: "-2147483648"
  - key: code-system-out-println-integer-max
    format: code-output
    question: '`System.out.println(Integer.MAX_VALUE + 1);`'
    answer: '`-2147483648` : débordement silencieux.'
    check:
      code: |-
        System.out.println(Integer.MAX_VALUE + 1);
      output: "-2147483648"
  - key: code-add-exact
    format: code-output
    question: |-
      ```java
      System.out.println(Math.addExact(Integer.MAX_VALUE, 1));
      ```
    answer: Une `ArithmeticException` (`integer overflow`) au lieu d'une valeur fausse.
    check:
      throws: ArithmeticException
  - key: code-millisecondes
    format: code-output
    question: |-
      ```java
      long faux = 30 * 24 * 3600 * 1000;
      long juste = 30L * 24 * 3600 * 1000;
      System.out.println(faux + " " + juste);
      ```
    answer: '`-1702967296 2592000000` : la première multiplication déborde en `int` avant d''être rangée.'
    check:
      output: "-1702967296 2592000000"
  - key: bug-millisecondes
    format: bug-fix
    question: |-
      Cette durée de 25 jours devient négative :
      ```java
      long dureeMs = 25 * 24 * 60 * 60 * 1000;
      ```
    answer: |-
      ```java
      long dureeMs = 25L * 24 * 60 * 60 * 1000;
      ```
      Le calcul se faisait en `int`, qui déborde ; avec `25L`, tout est calculé en `long`. Plus lisible encore :
      `Duration.ofDays(25).toMillis()`.
  - key: bug-milieu
    format: bug-fix
    question: |-
      Cette recherche dichotomique plante sur un tableau de plus d'un milliard d'éléments :
      ```java
      int milieu = (debut + fin) / 2;
      ```
    answer: |-
      ```java
      int milieu = debut + (fin - debut) / 2;
      ```
      `debut + fin` peut dépasser `Integer.MAX_VALUE` et devenir négatif ; la différence, elle, reste dans la plage.
  - key: bug-total-silencieux
    format: bug-fix
    question: |-
      Le total des ventes devient négatif sans aucune erreur :
      ```java
      int total = 0;
      for (int vente : ventes) {
          total += vente;
      }
      ```
    answer: |-
      ```java
      long total = 0;
      for (int vente : ventes) {
          total = Math.addExact(total, vente);
      }
      ```
      Un `long` repousse la limite, et `Math.addExact` lève une exception plutôt que de renvoyer un total faux.
  - key: bug-to-int
    format: bug-fix
    question: |-
      Ce cast cache un débordement quand la taille dépasse 2 Go :
      ```java
      int taille = (int) fichier.length();
      ```
    answer: |-
      ```java
      int taille = Math.toIntExact(fichier.length());
      ```
      Un cast tronque silencieusement ; `Math.toIntExact` lève une exception si la valeur ne tient pas dans un `int`.
