notion: recursivite
lesson: |-
  Une méthode **récursive** s'appelle elle-même sur un problème **plus petit** :

  ```java
  static long factorielle(int n) {
      if (n <= 1) {
          return 1;                        // cas de base : on s'arrête
      }
      return n * factorielle(n - 1);       // appel récursif sur un problème plus petit
  }
  ```

  - Il faut un **cas de base**, atteint à coup sûr, sinon la récursion ne s'arrête jamais.
  - Chaque appel occupe de la place sur la **pile** d'exécution ; trop d'appels imbriqués (quelques milliers à quelques
    dizaines de milliers selon la JVM) lèvent une **`StackOverflowError`**.
  - Java n'optimise pas la récursion terminale : une boucle reste préférable pour un grand nombre d'itérations.
  - La récursion brille sur les structures **récursives** : arbres, dossiers, expressions imbriquées.
  - Une récursion naïve peut recalculer les mêmes valeurs : `fibonacci(n - 1) + fibonacci(n - 2)` est exponentiel.
    Mémoriser les résultats (*mémoïsation*) ou une boucle règle le problème.

  **Piège classique** : un cas de base qui n'est jamais atteint, comme `if (n == 0)` appelé avec un nombre négatif.
  La récursion descend indéfiniment jusqu'au `StackOverflowError`.

  **En entretien** : « Toute récursion a un cas de base et se rapproche de lui à chaque appel ; en Java, la profondeur
  est limitée par la pile, d'où `StackOverflowError`. »
tour:
  - title: La récursivité
    text: |-
      Une méthode **récursive** s'appelle elle-même, sur un problème plus petit, jusqu'à un **cas de base** qui
      s'arrête. Chaque appel occupe une place sur la pile ; trop d'appels imbriqués la font déborder :
      `StackOverflowError`.

      La récursivité convient aux structures récursives (arbres, expressions) ; pour une simple boucle, l'itération est
      plus sûre en Java, qui n'optimise pas les appels terminaux.
    example:
      files:
        Main.java: |-
          long factorielle(int n) {
              if (n <= 1) {
                  return 1;
              }
              return n * factorielle(n - 1);
          }

          int sansFin(int n) {
              return sansFin(n + 1);
          }

          void main() {
              IO.println(factorielle(10));
              try {
                  sansFin(0);
              } catch (StackOverflowError e) {
                  IO.println("la pile a débordé : " + e.getClass().getSimpleName());
              }
          }
      output: |-
        3628800
        la pile a débordé : StackOverflowError
    task:
      instructions: |-
        Écris `fibonacci` de façon récursive : `fibonacci(0)` vaut 0, `fibonacci(1)` vaut 1, et chaque terme est la
        somme des deux précédents. Le programme doit afficher `55`.
      starter:
        Main.java: |-
          int fibonacci(int n) {
              return 0;
          }

          void main() {
              IO.println(fibonacci(10));
          }
      solution:
        Main.java: |-
          int fibonacci(int n) {
              if (n < 2) {
                  return n;
              }
              return fibonacci(n - 1) + fibonacci(n - 2);
          }

          void main() {
              IO.println(fibonacci(10));
          }
      output: |-
        55
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'une méthode récursive ?
    choices:
      - {text: "Une méthode qui s'appelle elle-même sur un problème plus petit, jusqu'à un cas de base", correct: true}
      - {text: "Une méthode qui répète son corps dans une boucle jusqu'à une condition d'arrêt", correct: false}
      - {text: "Une méthode qui appelle une autre méthode de la même classe, jamais elle-même", correct: false}
      - {text: "Une méthode `static` qu'on peut rappeler autant de fois qu'on veut sans objet", correct: false}
    answer: "Une méthode qui s'appelle elle-même sur un problème plus petit, jusqu'à un cas de base. Une boucle répète aussi un traitement, mais sans que la méthode s'appelle : c'est l'itération."
  - key: cas-de-base
    format: course
    question: Pourquoi une récursion doit-elle avoir un cas de base ?
    choices:
      - {text: "Pour s'arrêter : sans lui, les appels s'empilent jusqu'à une `StackOverflowError`", correct: true}
      - {text: "Pour que le compilateur accepte la méthode : sans lui, le code ne compile pas", correct: false}
      - {text: "Pour initialiser les variables locales avant le premier appel récursif", correct: false}
      - {text: "Pour que le résultat soit mis en cache et ne soit pas recalculé à chaque appel", correct: false}
    answer: "Pour s'arrêter : sans lui, les appels s'empilent jusqu'à épuiser la pile (`StackOverflowError`). Le compilateur, lui, ne vérifie pas qu'une récursion s'arrête : le code compile."
  - key: stack-overflow
    format: course
    question: D'où vient une `StackOverflowError` ?
    choices:
      - {text: "Une récursion trop profonde remplit la pile d'exécution, de taille limitée", correct: true}
      - {text: "Trop d'objets créés remplissent le tas, et le ramasse-miettes ne suit plus", correct: false}
      - {text: "Un tableau est lu au-delà de sa dernière case, hors de ses bornes", correct: false}
      - {text: "Un calcul sur des `int` dépasse la valeur maximale et déborde", correct: false}
    answer: "Chaque appel de méthode occupe un cadre sur la pile d'exécution, de taille limitée. Une récursion trop profonde (ou infinie) la remplit. Un tas plein donne une autre erreur : `OutOfMemoryError`."
  - key: fibonacci-naif
    format: course
    question: Pourquoi `fib(n) = fib(n - 1) + fib(n - 2)` est-il lent pour `n` = 50 ?
    choices:
      - {text: "Il recalcule sans cesse les mêmes valeurs : le nombre d'appels croît exponentiellement", correct: true}
      - {text: "Chaque appel récursif crée un nouveau thread, et leur création coûte cher", correct: false}
      - {text: "Les `long` sont plus lents que les `int`, et chaque addition est convertie", correct: false}
      - {text: "La JVM n'optimise jamais les méthodes récursives, qui restent interprétées", correct: false}
    answer: "Il recalcule sans cesse les mêmes valeurs : le nombre d'appels croît de façon exponentielle. On mémorise les résultats déjà calculés, ou on calcule avec une boucle, en O(n)."
  - key: vf-cas-base
    format: true-false
    question: Une méthode récursive sans cas de base finit par s'arrêter seule.
    truth: false
    answer: Elle s'arrête sur une `StackOverflowError`, quand la pile est pleine.
  - key: vf-recursion-terminale
    format: true-false
    question: Java optimise la récursion terminale pour éviter de remplir la pile.
    truth: false
    answer: "La JVM ne le fait pas : une récursion profonde, même terminale, peut déborder."
  - key: vf-arbres
    format: true-false
    question: La récursion convient bien pour parcourir un arbre.
    truth: true
    answer: "Un arbre est une structure récursive : chaque nœud a des sous-arbres."
  - key: vf-error
    format: true-false
    question: "`StackOverflowError` est une `Exception`."
    truth: false
    answer: "C'est une `Error` : un problème grave qu'on ne rattrape normalement pas."
  - key: qcm-valeur
    format: multiple-choice
    question: "Avec `static int f(int n) { return n <= 0 ? 0 : n + f(n - 1); }`, que vaut `f(4)` ?"
    choices:
      - text: "10"
        correct: true
      - text: "4"
        correct: false
      - text: "24"
        correct: false
      - text: "Une `StackOverflowError`"
        correct: false
    answer: 4 + 3 + 2 + 1 + 0.
  - key: qcm-erreur
    format: multiple-choice
    question: Quelle erreur lève une récursion infinie ?
    choices:
      - text: "`StackOverflowError`"
        correct: true
      - text: "`OutOfMemoryError`"
        correct: false
      - text: "`ArithmeticException`"
        correct: false
      - text: "`IllegalStateException`"
        correct: false
    answer: Les appels remplissent la pile, pas le tas.
  - key: qcm-indispensable
    format: multiple-choice
    question: Que doit contenir toute méthode récursive correcte ?
    choices:
      - {text: "Un cas de base, et des appels qui s'en rapprochent", correct: true}
      - {text: "Une boucle `for` qui compte les appels", correct: false}
      - {text: "Une variable `static` qui garde le résultat", correct: false}
      - {text: "Un `try` qui rattrape la `StackOverflowError`", correct: false}
    answer: "Le cas de base arrête la récursion, et chaque appel doit s'en rapprocher. Rattraper la `StackOverflowError` ne fait que cacher une récursion qui ne s'arrête pas."
  - key: qcm-alternative
    format: multiple-choice
    question: Pour calculer la somme des nombres de 1 à un million, que préférer en Java ?
    choices:
      - text: "Une boucle"
        correct: true
      - text: "Une récursion simple"
        correct: false
      - text: "Deux récursions croisées"
        correct: false
      - text: "Une `StackOverflowError` rattrapée"
        correct: false
    answer: Un million d'appels imbriqués déborderait la pile ; une boucle (ou la formule n(n+1)/2) convient.
  - key: code-factorielle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static long factorielle(int n) {
          return n <= 1 ? 1 : n * factorielle(n - 1);
      }
      System.out.println(factorielle(5));
      ```
    choices:
      - {text: "`120`", correct: true}
      - {text: "`24`", correct: false}
      - {text: "`720`", correct: false}
      - {text: "`15`", correct: false}
    answer: "`120` : 5 × 4 × 3 × 2 × 1. `15` serait la somme 5 + 4 + 3 + 2 + 1, pas le produit."
    check:
      output: "120"
  - key: code-ordre-affichage
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void compter(int n) {
          if (n == 0) return;
          compter(n - 1);
          System.out.print(n);
      }
      compter(3);
      ```
    choices:
      - {text: "`321`", correct: false}
      - {text: "`123`", correct: true}
      - {text: "`0123`", correct: false}
      - {text: "`3210`", correct: false}
    answer: "`123` : chaque appel affiche **après** le retour de l'appel récursif, donc du plus petit au plus grand. Il faudrait afficher avant l'appel pour obtenir `321` ; et `compter(0)` s'arrête sans rien afficher."
    check:
      output: "123"
  - key: code-infinie
    format: code-output
    question: |-
      Que se passe-t-il quand on exécute ce code ?
      ```java
      static int f(int n) {
          return f(n + 1);
      }
      f(0);
      ```
    choices:
      - {text: "Une `StackOverflowError`", correct: true}
      - {text: "Une `OutOfMemoryError`", correct: false}
      - {text: "Rien : le programme tourne sans fin", correct: false}
      - {text: "Ça ne compile pas : `f` n'a pas de cas de base", correct: false}
    answer: "Une `StackOverflowError` : aucun cas de base n'arrête la récursion, et chaque appel empile un cadre jusqu'à remplir la pile. Le compilateur ne vérifie pas qu'une récursion s'arrête."
    check:
      throws: StackOverflowError
  - key: code-puissance
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static int puissance(int base, int exp) {
          if (exp == 0) return 1;
          return base * puissance(base, exp - 1);
      }
      System.out.println(puissance(2, 10));
      ```
    choices:
      - {text: "`512`", correct: false}
      - {text: "`2048`", correct: false}
      - {text: "`1024`", correct: true}
      - {text: "`20`", correct: false}
    answer: "`1024` : 2 multiplié dix fois par lui-même, car le cas de base `exp == 0` renvoie 1. `20` serait `2 * 10`, une multiplication et non une puissance."
    check:
      output: "1024"
  - key: bug-cas-base-manque
    format: bug-fix
    question: |-
      `somme(-1)` lève une `StackOverflowError`. Quelle correction est la bonne ?
      ```java
      static int somme(int n) {
          if (n == 0) return 0;
          return n + somme(n - 1);
      }
      ```
    choices:
      - {text: "Remplacer `n == 0` par `n <= 0` dans le cas de base", correct: true}
      - {text: "Remplacer `somme(n - 1)` par `somme(n + 1)` dans l'appel", correct: false}
      - {text: "Rattraper la `StackOverflowError` avec un `try`/`catch`", correct: false}
      - {text: "Déclarer `n` en `long` pour qu'il ne déborde pas", correct: false}
    answer: |-
      ```java
      static int somme(int n) {
          if (n <= 0) return 0;
          return n + somme(n - 1);
      }
      ```
      Avec un nombre négatif, `n == 0` n'est jamais atteint ; `n <= 0` arrête la récursion dans tous les cas. Appeler `somme(n + 1)` réglerait -1, mais ferait déborder la pile pour tout nombre positif.
  - key: bug-pas-de-progression
    format: bug-fix
    question: |-
      Ce code lève une `StackOverflowError`. Quelle correction est la bonne ?
      ```java
      static int longueur(String s) {
          if (s.isEmpty()) return 0;
          return 1 + longueur(s);
      }
      ```
    choices:
      - {text: "Appeler `longueur(s.substring(1))` : la chaîne privée de son premier caractère", correct: true}
      - {text: "Remplacer `s.isEmpty()` par `s == null` dans le cas de base", correct: false}
      - {text: "Appeler `longueur(s) - 1` pour réduire le résultat à chaque appel", correct: false}
      - {text: "Appeler `longueur(s.trim())` pour retirer un caractère à chaque appel", correct: false}
    answer: |-
      ```java
      return 1 + longueur(s.substring(1));
      ```
      L'appel récursif doit porter sur un problème plus petit : la chaîne privée de son premier caractère. `trim()` ne retire que les espaces des bords : `"abc"` reste `"abc"`, et la récursion ne s'arrête pas.
  - key: bug-fibonacci-lent
    format: bug-fix
    question: |-
      `fib(45)` met plusieurs secondes. Quelle correction est la bonne ?
      ```java
      static long fib(int n) {
          return n < 2 ? n : fib(n - 1) + fib(n - 2);
      }
      ```
    choices:
      - {text: "Calculer avec une boucle qui garde les deux derniers termes, en O(n)", correct: true}
      - {text: "Remplacer `long` par `int`, plus rapide à additionner", correct: false}
      - {text: "Augmenter la taille de la pile avec l'option `-Xss` de la JVM", correct: false}
      - {text: "Échanger l'ordre des appels : `fib(n - 2) + fib(n - 1)`", correct: false}
    answer: |-
      ```java
      static long fib(int n) {
          long a = 0, b = 1;
          for (int i = 0; i < n; i++) {
              long suivant = a + b;
              a = b;
              b = suivant;
          }
          return a;
      }
      ```
      La version naïve recalcule les mêmes termes un nombre exponentiel de fois ; la boucle est en O(n). Agrandir la pile ne change rien : la récursion n'est pas profonde, elle est seulement répétée.
  - key: bug-recursion-profonde
    format: bug-fix
    question: |-
      Cette méthode lève une `StackOverflowError` sur une liste de 100 000 éléments. Quelle correction est la bonne ?
      ```java
      static int total(List<Integer> l, int i) {
          if (i == l.size()) return 0;
          return l.get(i) + total(l, i + 1);
      }
      ```
    choices:
      - {text: "Remplacer la récursion par une boucle qui additionne les éléments", correct: true}
      - {text: "Ajouter un cas de base `if (l.isEmpty()) return 0;` en tête", correct: false}
      - {text: "Remplacer `List<Integer>` par un tableau `int[]`, plus léger", correct: false}
      - {text: "Passer `i + 2` à l'appel récursif pour diviser la profondeur par deux", correct: false}
    answer: |-
      ```java
      static int total(List<Integer> l) {
          int somme = 0;
          for (int x : l) somme += x;
          return somme;
      }
      ```
      Une récursion par élément est trop profonde pour la pile ; une boucle n'a pas cette limite. Le cas de base existe déjà : le problème est la profondeur, pas l'arrêt.
