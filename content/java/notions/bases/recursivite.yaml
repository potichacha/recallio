notion: recursivite
lesson: |-
  Une méthode **récursive** s'appelle elle-même sur un problème **plus petit** :

  ```java
  static long factorielle(int n) {
      if (n <= 1) {
          return 1;                        // cas de base : on s'arrête
      }
      return n * factorielle(n - 1);       // appel récursif sur un problème plus petit
  }
  ```

  - Il faut un **cas de base**, atteint à coup sûr, sinon la récursion ne s'arrête jamais.
  - Chaque appel occupe de la place sur la **pile** d'exécution ; trop d'appels imbriqués (quelques milliers à quelques
    dizaines de milliers selon la JVM) lèvent une **`StackOverflowError`**.
  - Java n'optimise pas la récursion terminale : une boucle reste préférable pour un grand nombre d'itérations.
  - La récursion brille sur les structures **récursives** : arbres, dossiers, expressions imbriquées.
  - Une récursion naïve peut recalculer les mêmes valeurs : `fibonacci(n - 1) + fibonacci(n - 2)` est exponentiel.
    Mémoriser les résultats (*mémoïsation*) ou une boucle règle le problème.

  **Piège classique** : un cas de base qui n'est jamais atteint, comme `if (n == 0)` appelé avec un nombre négatif.
  La récursion descend indéfiniment jusqu'au `StackOverflowError`.

  **En entretien** : « Toute récursion a un cas de base et se rapproche de lui à chaque appel ; en Java, la profondeur
  est limitée par la pile, d'où `StackOverflowError`. »
tour:
  - title: La récursivité
    text: |-
      Une méthode **récursive** s'appelle elle-même, sur un problème plus petit, jusqu'à un **cas de base** qui
      s'arrête. Chaque appel occupe une place sur la pile ; trop d'appels imbriqués la font déborder :
      `StackOverflowError`.

      La récursivité convient aux structures récursives (arbres, expressions) ; pour une simple boucle, l'itération est
      plus sûre en Java, qui n'optimise pas les appels terminaux.
    example:
      files:
        Main.java: |-
          long factorielle(int n) {
              if (n <= 1) {
                  return 1;
              }
              return n * factorielle(n - 1);
          }

          int sansFin(int n) {
              return sansFin(n + 1);
          }

          void main() {
              IO.println(factorielle(10));
              try {
                  sansFin(0);
              } catch (StackOverflowError e) {
                  IO.println("la pile a débordé : " + e.getClass().getSimpleName());
              }
          }
      output: |-
        3628800
        la pile a débordé : StackOverflowError
    task:
      instructions: |-
        Écris `fibonacci` de façon récursive : `fibonacci(0)` vaut 0, `fibonacci(1)` vaut 1, et chaque terme est la
        somme des deux précédents. Le programme doit afficher `55`.
      starter:
        Main.java: |-
          int fibonacci(int n) {
              return 0;
          }

          void main() {
              IO.println(fibonacci(10));
          }
      solution:
        Main.java: |-
          int fibonacci(int n) {
              if (n < 2) {
                  return n;
              }
              return fibonacci(n - 1) + fibonacci(n - 2);
          }

          void main() {
              IO.println(fibonacci(10));
          }
      output: |-
        55
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'une méthode récursive ?
    answer: Une méthode qui s'appelle elle-même sur un problème plus petit, jusqu'à un cas de base.
  - key: cas-de-base
    format: course
    question: Pourquoi une récursion doit-elle avoir un cas de base ?
    answer: "Pour s'arrêter : sans lui, les appels s'empilent jusqu'à épuiser la pile (`StackOverflowError`)."
  - key: stack-overflow
    format: course
    question: D'où vient une `StackOverflowError` ?
    answer: |-
      Chaque appel de méthode occupe un cadre sur la pile d'exécution, de taille limitée. Une récursion trop profonde
      (ou infinie) la remplit.
  - key: fibonacci-naif
    format: course
    question: Pourquoi `fib(n) = fib(n - 1) + fib(n - 2)` est-il lent pour `n` = 50 ?
    answer: |-
      Il recalcule sans cesse les mêmes valeurs : le nombre d'appels croît de façon exponentielle. On mémorise les
      résultats déjà calculés, ou on calcule avec une boucle, en O(n).
  - key: vf-cas-base
    format: true-false
    question: Une méthode récursive sans cas de base finit par s'arrêter seule.
    truth: false
    answer: Elle s'arrête sur une `StackOverflowError`, quand la pile est pleine.
  - key: vf-recursion-terminale
    format: true-false
    question: Java optimise la récursion terminale pour éviter de remplir la pile.
    truth: false
    answer: "La JVM ne le fait pas : une récursion profonde, même terminale, peut déborder."
  - key: vf-arbres
    format: true-false
    question: La récursion convient bien pour parcourir un arbre.
    truth: true
    answer: "Un arbre est une structure récursive : chaque nœud a des sous-arbres."
  - key: vf-error
    format: true-false
    question: "`StackOverflowError` est une `Exception`."
    truth: false
    answer: "C'est une `Error` : un problème grave qu'on ne rattrape normalement pas."
  - key: qcm-valeur
    format: multiple-choice
    question: "Avec `static int f(int n) { return n <= 0 ? 0 : n + f(n - 1); }`, que vaut `f(4)` ?"
    choices:
      - text: "10"
        correct: true
      - text: "4"
        correct: false
      - text: "24"
        correct: false
      - text: "Une `StackOverflowError`"
        correct: false
    answer: 4 + 3 + 2 + 1 + 0.
  - key: qcm-erreur
    format: multiple-choice
    question: Quelle erreur lève une récursion infinie ?
    choices:
      - text: "`StackOverflowError`"
        correct: true
      - text: "`OutOfMemoryError`"
        correct: false
      - text: "`ArithmeticException`"
        correct: false
      - text: "`IllegalStateException`"
        correct: false
    answer: Les appels remplissent la pile, pas le tas.
  - key: qcm-indispensable
    format: multiple-choice
    question: Que doit contenir toute méthode récursive correcte ?
    choices:
      - text: "Un cas de base"
        correct: true
      - text: "Un appel sur un problème plus proche du cas de base"
        correct: true
      - text: "Une boucle `for`"
        correct: false
      - text: "Une variable `static`"
        correct: false
    answer: Le cas de base arrête la récursion, et chaque appel doit s'en rapprocher.
  - key: qcm-alternative
    format: multiple-choice
    question: Pour calculer la somme des nombres de 1 à un million, que préférer en Java ?
    choices:
      - text: "Une boucle"
        correct: true
      - text: "Une récursion simple"
        correct: false
      - text: "Deux récursions croisées"
        correct: false
      - text: "Une `StackOverflowError` rattrapée"
        correct: false
    answer: Un million d'appels imbriqués déborderait la pile ; une boucle (ou la formule n(n+1)/2) convient.
  - key: code-factorielle
    format: code-output
    question: |-
      ```java
      static long factorielle(int n) {
          return n <= 1 ? 1 : n * factorielle(n - 1);
      }
      System.out.println(factorielle(5));
      ```
    answer: '`120` : 5 × 4 × 3 × 2 × 1.'
    check:
      output: "120"
  - key: code-ordre-affichage
    format: code-output
    question: |-
      ```java
      static void compter(int n) {
          if (n == 0) return;
          compter(n - 1);
          System.out.print(n);
      }
      compter(3);
      ```
    answer: '`123` : chaque appel affiche **après** le retour de l''appel récursif, donc du plus petit au plus grand.'
    check:
      output: "123"
  - key: code-infinie
    format: code-output
    question: |-
      ```java
      static int f(int n) {
          return f(n + 1);
      }
      f(0);
      ```
    answer: "Une `StackOverflowError` : aucun cas de base n'arrête la récursion."
    check:
      throws: StackOverflowError
  - key: code-puissance
    format: code-output
    question: |-
      ```java
      static int puissance(int base, int exp) {
          if (exp == 0) return 1;
          return base * puissance(base, exp - 1);
      }
      System.out.println(puissance(2, 10));
      ```
    answer: '`1024` : 2 multiplié dix fois par lui-même.'
    check:
      output: "1024"
  - key: bug-cas-base-manque
    format: bug-fix
    question: |-
      `somme(-1)` lève une `StackOverflowError` :
      ```java
      static int somme(int n) {
          if (n == 0) return 0;
          return n + somme(n - 1);
      }
      ```
    answer: |-
      ```java
      static int somme(int n) {
          if (n <= 0) return 0;
          return n + somme(n - 1);
      }
      ```
      Avec un nombre négatif, `n == 0` n'est jamais atteint ; `n <= 0` arrête la récursion dans tous les cas.
  - key: bug-pas-de-progression
    format: bug-fix
    question: |-
      Ce code lève une `StackOverflowError` :
      ```java
      static int longueur(String s) {
          if (s.isEmpty()) return 0;
          return 1 + longueur(s);
      }
      ```
    answer: |-
      ```java
      return 1 + longueur(s.substring(1));
      ```
      L'appel récursif doit porter sur un problème plus petit : la chaîne privée de son premier caractère.
  - key: bug-fibonacci-lent
    format: bug-fix
    question: |-
      `fib(45)` met plusieurs secondes :
      ```java
      static long fib(int n) {
          return n < 2 ? n : fib(n - 1) + fib(n - 2);
      }
      ```
    answer: |-
      ```java
      static long fib(int n) {
          long a = 0, b = 1;
          for (int i = 0; i < n; i++) {
              long suivant = a + b;
              a = b;
              b = suivant;
          }
          return a;
      }
      ```
      La version naïve recalcule les mêmes termes un nombre exponentiel de fois ; la boucle est en O(n).
  - key: bug-recursion-profonde
    format: bug-fix
    question: |-
      Cette méthode lève une `StackOverflowError` sur une liste de 100 000 éléments :
      ```java
      static int total(List<Integer> l, int i) {
          if (i == l.size()) return 0;
          return l.get(i) + total(l, i + 1);
      }
      ```
    answer: |-
      ```java
      static int total(List<Integer> l) {
          int somme = 0;
          for (int x : l) somme += x;
          return somme;
      }
      ```
      Une récursion par élément est trop profonde pour la pile ; une boucle n'a pas cette limite.
