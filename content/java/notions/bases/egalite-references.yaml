notion: egalite-references
lesson: |-
  `==` ne fait pas la même chose selon le type :

  - pour des **primitifs**, il compare les **valeurs** : `3 == 3` est vrai ;
  - pour des **objets**, il compare les **références** : vrai seulement si c'est **le même objet**.

  Pour comparer le **contenu** de deux objets, on appelle **`equals`** :

  ```java
  String a = new String("Java");
  String b = new String("Java");
  a == b;        // false : deux objets distincts
  a.equals(b);   // true : même contenu
  ```

  - `String`, `Integer`, `LocalDate`, les `record`... redéfinissent `equals` pour comparer leur contenu. Une classe à
    vous ne le fait pas d'office : sans redéfinition, `equals` se comporte comme `==`.
  - `==` entre deux `String` « marche » parfois, parce que les littéraux identiques partagent le même objet (le
    **pool** de chaînes). Il échoue dès qu'une chaîne vient d'un calcul ou d'une saisie : on ne s'y fie jamais.
  - Si une valeur peut être `null`, `Objects.equals(a, b)` compare sans risque d'exception.

  **Piège classique** : `Integer a = 1000, b = 1000; a == b` vaut `false`, alors qu'avec 100 il vaut `true` : Java garde
  en cache les `Integer` de -128 à 127. Les objets se comparent toujours avec `equals`.

  **En entretien** : « `==` compare les valeurs des primitifs mais l'identité des objets ; le contenu se compare avec
  `equals`, qu'on redéfinit, avec `hashCode`, dans ses propres classes. »
cards:
  - key: primitifs-vs-objets
    format: course
    question: '`==` sur primitifs vs objets ?'
    answer: Valeurs pour les primitifs, références pour les objets.
  - key: comparer-contenu
    format: course
    question: Comment compare-t-on le contenu de deux objets ?
    answer: "Avec `equals` : `a.equals(b)`. `==` ne dit que s'il s'agit du même objet."
  - key: pool-de-chaines
    format: course
    question: Pourquoi `"Java" == "Java"` vaut-il `true` ?
    answer: |-
      Parce que les littéraux identiques partagent un seul objet, rangé dans le **pool** de chaînes. Une chaîne issue
      d'un calcul ou d'une saisie est un autre objet : `==` échoue alors. On utilise toujours `equals`.
  - key: equals-par-defaut
    format: course
    question: Que fait `equals` dans une classe qui ne le redéfinit pas ?
    answer: |-
      La même chose que `==` : `Object.equals` compare les références. Pour comparer le contenu, il faut redéfinir
      `equals` (et `hashCode`), ou utiliser un `record` qui le fait tout seul.
  - key: affirmations-equals-sont-vraies
    format: multiple-choice
    question: Quelles affirmations sur `==` et `equals()` sont vraies ?
    choices:
      - text: Pour des objets, `==` compare les références
        correct: true
      - text: '`equals()` peut être redéfinie pour comparer le contenu'
        correct: true
      - text: '`==` appelle `equals()` en interne'
        correct: false
      - text: '`Object.equals()` compare le contenu des champs'
        correct: false
    answer: '`==` teste l''identité (même objet en mémoire). `Object.equals()` fait la même chose par défaut ; `String`, `Integer` ou un `record` la redéfinissent pour comparer le contenu, et `hashCode()` doit alors être redéfinie avec elle.'
  - key: qcm-comparer-saisie
    format: multiple-choice
    question: "`saisie` vient du clavier. Quelle condition teste si l'utilisateur a tapé « oui » ?"
    choices:
      - text: "`\"oui\".equals(saisie)`"
        correct: true
      - text: "`saisie.equals(\"oui\")`"
        correct: true
      - text: "`saisie == \"oui\"`"
        correct: false
      - text: "`saisie = \"oui\"`"
        correct: false
    answer: '`equals` compare le contenu ; appelé sur le littéral, il supporte aussi une `saisie` `null`.'
  - key: qcm-null-safe
    format: multiple-choice
    question: Quelle méthode compare deux objets qui peuvent valoir `null`, sans risque d'exception ?
    choices:
      - text: "`Objects.equals(a, b)`"
        correct: true
      - text: "`a.equals(b)`"
        correct: false
      - text: "`a == b`"
        correct: false
      - text: "`a.compareTo(b)`"
        correct: false
    answer: '`Objects.equals` vaut `true` si les deux sont `null`, `false` si un seul l''est, et appelle `equals` sinon.'
  - key: qcm-meme-objet
    format: multiple-choice
    question: Après `Client c1 = new Client("Ada"); Client c2 = c1;`, que vaut `c1 == c2` ?
    choices:
      - text: "`true`"
        correct: true
      - text: "`false`"
        correct: false
      - text: "Ça dépend de `equals`"
        correct: false
    answer: '`c2` reçoit la même référence : c''est le même objet.'
  - key: vf-equals-sur-string
    format: true-false
    question: Deux `String` de même contenu sont toujours `==`.
    truth: false
    answer: Seulement si c'est le même objet (comme deux littéraux identiques) ; une chaîne calculée est un autre objet.
  - key: vf-primitifs
    format: true-false
    question: Pour deux `int`, `==` compare leurs valeurs.
    truth: true
    answer: "Pour les primitifs, il n'y a pas de référence : `==` compare la valeur."
  - key: vf-cache-integer
    format: true-false
    question: "Avec `Integer a = 1000, b = 1000;`, `a == b` vaut `true`."
    truth: false
    answer: "Java ne garde en cache que les `Integer` de -128 à 127 : 1000 donne deux objets distincts."
  - key: vf-record
    format: true-false
    question: Deux `record` créés avec les mêmes valeurs sont égaux selon `equals`.
    truth: true
    answer: Un `record` génère `equals` (et `hashCode`) à partir de ses composants.
  - key: code-pool
    format: code-output
    question: |-
      ```java
      String a = "Java";
      String b = "Java";
      System.out.println(a == b);
      ```
    answer: '`true` : deux littéraux identiques désignent le même objet du pool de chaînes.'
    check:
      output: "true"
  - key: code-new-string
    format: code-output
    question: |-
      ```java
      String a = "Java";
      String c = new String("Java");
      System.out.println((a == c) + " " + a.equals(c));
      ```
    answer: '`false true` : `new` crée toujours un nouvel objet ; le contenu, lui, est le même.'
    check:
      output: "false true"
  - key: code-meme-objet
    format: code-output
    question: |-
      ```java
      Object o1 = new Object();
      Object o2 = o1;
      System.out.println(o1 == o2 && o1.equals(o2));
      ```
    answer: '`true` : `o2` désigne le même objet que `o1`, et un objet est toujours égal à lui-même.'
    check:
      output: "true"
  - key: code-record
    format: code-output
    question: |-
      ```java
      record Point(int x, int y) {}
      Point p = new Point(1, 2);
      Point q = new Point(1, 2);
      System.out.println(p.equals(q) + " " + (p == q));
      ```
    answer: '`true false` : même contenu (le `record` compare ses composants), mais deux objets distincts.'
    check:
      output: "true false"
  - key: bug-saisie
    format: bug-fix
    question: |-
      Ce test ne reconnaît jamais la réponse tapée au clavier, même quand c'est « oui » :
      ```java
      String saisie = scanner.nextLine();
      if (saisie == "oui") {
          confirmer();
      }
      ```
    answer: |-
      ```java
      if ("oui".equals(saisie)) {
          confirmer();
      }
      ```
      La chaîne lue au clavier est un nouvel objet : `==` compare les références et répond `false`.
  - key: bug-integer
    format: bug-fix
    question: |-
      Ce test marche avec de petites quantités, mais échoue à partir de 128 :
      ```java
      Integer stock = inventaire.get(article);
      Integer seuil = alertes.get(article);
      if (stock == seuil) {
          alerter(article);
      }
      ```
    answer: |-
      ```java
      if (stock.equals(seuil)) {
          alerter(article);
      }
      ```
      Les `Integer` de -128 à 127 sont partagés en cache, pas les autres : `==` compare alors deux objets distincts.
      Si l'un peut être `null`, on écrit `Objects.equals(stock, seuil)`.
  - key: bug-equals-non-redefini
    format: bug-fix
    question: |-
      `panier.contains(new Produit("REF-1"))` répond `false` alors que le panier contient ce produit :
      ```java
      public class Produit {
          private final String reference;

          public Produit(String reference) {
              this.reference = reference;
          }
      }
      ```
    answer: |-
      ```java
      public record Produit(String reference) {}
      ```
      `contains` utilise `equals`, qui compare les références tant qu'il n'est pas redéfini. Un `record` génère `equals`
      et `hashCode` à partir de ses composants ; sinon, on les redéfinit tous les deux.
  - key: bug-equals-null
    format: bug-fix
    question: |-
      Cette comparaison lève une `NullPointerException` quand `ancienEmail` vaut `null` :
      ```java
      if (ancienEmail.equals(nouvelEmail)) {
          return;
      }
      ```
    answer: |-
      ```java
      if (Objects.equals(ancienEmail, nouvelEmail)) {
          return;
      }
      ```
      `Objects.equals` gère `null` des deux côtés.
  - key: situation-tests-verts-prod-rouge
    format: scenario
    question: Une comparaison de chaînes avec `==` passe tous les tests, mais échoue en production sur des données venues de la base. Que se passe-t-il ?
    answer: |-
      Les tests comparaient des **littéraux**, qui partagent un même objet du pool de chaînes : `==` répondait `true` par
      chance. Les chaînes lues en base sont des objets neufs : `==` compare les références et répond `false`. Il faut
      `equals` (ou `Objects.equals` si une valeur peut être `null`), et un test avec une chaîne construite
      dynamiquement.
  - key: situation-cache-integer
    format: scenario
    question: Un bug n'apparaît que pour les identifiants supérieurs à 127. Le code compare des `Integer` avec `==`. Expliquez.
    answer: |-
      Java met en cache les `Integer` de -128 à 127 (`Integer.valueOf` les réutilise) : pour ces valeurs, l'autoboxing
      donne le même objet et `==` répond `true`. Au-delà, chaque valeur est un nouvel objet et `==` compare des
      références différentes. La correction : `equals`, ou des `int` primitifs si la valeur ne peut pas être absente.
  - key: situation-dedoublonner
    format: scenario
    question: Un `Set<Client>` contient des doublons de clients identiques. Où regardez-vous ?
    answer: |-
      Du côté de `equals` et `hashCode` de `Client` : un `HashSet` s'appuie sur eux pour détecter les doublons. S'ils ne
      sont pas redéfinis, deux objets de même contenu sont différents. Il faut les redéfinir **ensemble**, sur les champs
      qui définissent l'identité métier (ou utiliser un `record`).
  - key: situation-revue-de-code
    format: scenario
    question: En revue de code, vous voyez `if (statut == "ACTIF")`. Que demandez-vous ?
    answer: |-
      De comparer avec `equals` : `"ACTIF".equals(statut)`, qui supporte aussi un `statut` `null`. Mieux encore, si le
      statut ne prend que quelques valeurs, d'en faire un **enum** : on compare alors avec `==` sans risque, puisque
      chaque valeur d'enum est un objet unique.
