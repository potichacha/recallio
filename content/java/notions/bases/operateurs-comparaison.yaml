notion: operateurs-comparaison
lesson: |-
  Six opérateurs comparent deux valeurs et donnent un **`boolean`** :

  | Opérateur | Sens |
  |---|---|
  | `==` | égal à |
  | `!=` | différent de |
  | `<`, `>` | strictement inférieur, supérieur |
  | `<=`, `>=` | inférieur ou égal, supérieur ou égal |

  ```java
  boolean majeur = age >= 18;
  if (quantite != 0) { ... }
  ```

  - **`==` compare, `=` affecte** : `if (x = 10)` ne compile pas pour un `int` (le résultat n'est pas un booléen).
  - On ne chaîne pas les comparaisons : `0 < x < 10` ne compile pas. On écrit `x > 0 && x < 10`.
  - Un `char` se compare par son code : `'a' < 'b'` est vrai.
  - Avec `NaN`, toutes les comparaisons sont fausses (sauf `!=`).
  - Pour des **objets** (une `String` par exemple), `==` compare l'identité, pas le contenu : on utilise `equals`.

  **Piège classique** : écrire `=>` au lieu de `>=`. L'opérateur s'écrit toujours avec le signe `=` en second.

  **En entretien** : « Les comparaisons donnent un booléen ; `==` compare des valeurs pour les primitifs mais des
  références pour les objets. »
tour:
  - title: Les comparaisons
    text: |-
      `==`, `!=`, `<`, `<=`, `>` et `>=` comparent des nombres, et donnent un `boolean`. Les flottants réservent des
      surprises : `0.1 + 0.2 == 0.3` est faux, car ces nombres ne s'écrivent pas exactement en binaire. On compare alors
      avec une tolérance.

      Sur des objets, `==` compare les **références**, pas le contenu : pour les chaînes, on utilise `equals` (une page
      y est consacrée).
    example:
      files:
        Main.java: |-
          void main() {
              int a = 3, b = 5;
              IO.println((a < b) + " " + (a == b) + " " + (a != b));
              double somme = 0.1 + 0.2;
              IO.println(somme);
              IO.println(somme == 0.3);
              IO.println(Math.abs(somme - 0.3) < 1e-9);
          }
      output: |-
        true false true
        0.30000000000000004
        false
        true
cards:
  - key: six-operateurs
    format: course
    question: Quels sont les opérateurs de comparaison, et que renvoient-ils ?
    choices:
      - {text: "`==`, `!=`, `<`, `>`, `<=`, `>=` ; ils renvoient un `boolean`", correct: true}
      - {text: "`==`, `<>`, `<`, `>`, `<=`, `>=` ; ils renvoient un `boolean`", correct: false}
      - {text: "`==`, `!=`, `<`, `>`, `<=`, `>=` ; ils renvoient 1 ou 0", correct: false}
      - {text: "`=`, `!=`, `<`, `>`, `=<`, `=>` ; ils renvoient un `boolean`", correct: false}
    answer: '`==`, `!=`, `<`, `>`, `<=` et `>=` ; ils renvoient un `boolean`.'
  - key: egal-vs-double-egal
    format: course
    question: Quelle différence entre `=` et `==` ?
    choices:
      - {text: "`=` affecte une valeur ; `==` compare deux valeurs et renvoie un booléen", correct: true}
      - {text: "`==` affecte une valeur ; `=` compare deux valeurs et renvoie un booléen", correct: false}
      - {text: "`=` compare les valeurs ; `==` compare aussi les types, comme `===` ailleurs", correct: false}
      - {text: "Aucune : dans une condition, `=` et `==` sont tous deux acceptés", correct: false}
    answer: '`=` **affecte** une valeur à une variable ; `==` **compare** deux valeurs et renvoie un booléen.'
  - key: intervalle
    format: course
    question: Comment tester que `x` est strictement entre 0 et 10 ?
    choices:
      - {text: "`x > 0 && x < 10`", correct: true}
      - {text: "`0 < x < 10`", correct: false}
      - {text: "`x > 0 || x < 10`", correct: false}
      - {text: "`x >= 0 && x <= 10`", correct: false}
    answer: "Avec deux comparaisons reliées par `&&` : `x > 0 && x < 10`. Java n'accepte pas `0 < x < 10`."
  - key: comparer-chaines
    format: course
    question: Pourquoi ne compare-t-on pas deux chaînes avec `==` ?
    choices:
      - {text: "`==` compare les références : deux chaînes égales peuvent être deux objets", correct: true}
      - {text: "`==` ne compile pas entre deux `String` : il est réservé aux types primitifs", correct: false}
      - {text: "`==` compare les longueurs des chaînes, pas leurs caractères", correct: false}
      - {text: "`==` ignore la casse, alors que `equals` en tient compte", correct: false}
    answer: |-
      Parce que `==` compare les références : deux `String` de même contenu peuvent être deux objets distincts. Le
      contenu se compare avec `equals`.
  - key: vf-resultat-booleen
    format: true-false
    question: Une comparaison comme `a < b` renvoie un `boolean`.
    truth: true
    answer: Elle vaut `true` ou `false`, et peut se ranger dans une variable `boolean`.
  - key: vf-chainer
    format: true-false
    question: "`0 < x < 10` compile en Java."
    truth: false
    answer: '`0 < x` est un booléen, qu''on ne peut pas comparer à 10. On écrit `x > 0 && x < 10`.'
  - key: vf-char-comparable
    format: true-false
    question: "`'a' < 'b'` vaut `true`."
    truth: true
    answer: "Un `char` se compare par son code : 97 < 98."
  - key: vf-superieur-egal
    format: true-false
    question: L'opérateur « supérieur ou égal » s'écrit `=>`.
    truth: false
    answer: Il s'écrit `>=` ; `=>` ne compile pas.
  - key: qcm-plus-grand-ou-egal
    format: multiple-choice
    question: Quelle condition est vraie quand `age` vaut 18 ou plus ?
    choices:
      - text: "`age >= 18`"
        correct: true
      - text: "`age > 18`"
        correct: false
      - text: "`age => 18`"
        correct: false
      - text: "`age = 18`"
        correct: false
    answer: '`>` exclurait 18, `=>` ne compile pas et `=` est une affectation.'
  - key: qcm-different
    format: multiple-choice
    question: "Quelle expression signifie « `n` est différent de zéro » ?"
    choices:
      - {text: "`n != 0`", correct: true}
      - {text: "`n <> 0`", correct: false}
      - {text: "`n =! 0`", correct: false}
      - {text: "`!n == 0`", correct: false}
    answer: "`!=` est l'opérateur « différent » ; `<>` vient d'autres langages, `n =! 0` ne compile pas, et `!n` ne s'applique pas à un `int`. `!(n == 0)` marcherait aussi."
  - key: qcm-intervalle
    format: multiple-choice
    question: Quelle condition teste que `note` est entre 0 et 20, bornes comprises ?
    choices:
      - text: "`note >= 0 && note <= 20`"
        correct: true
      - text: "`0 <= note <= 20`"
        correct: false
      - text: "`note >= 0 || note <= 20`"
        correct: false
      - text: "`note > 0 && note < 20`"
        correct: false
    answer: Deux comparaisons, toutes deux vraies (`&&`), bornes comprises (`>=`, `<=`). Avec `||`, tout nombre passerait.
  - key: qcm-nan
    format: multiple-choice
    question: "`x` vaut `Double.NaN`. Quelles expressions valent `true` ?"
    choices:
      - text: "`x != x`"
        correct: true
      - text: "`x == x`"
        correct: false
      - text: "`x > 0`"
        correct: false
      - text: "`x <= 0`"
        correct: false
    answer: '`NaN` rend toutes les comparaisons fausses, sauf `!=`.'
  - key: trous-egalite
    format: fill-in
    question: |-
      Complète pour tester que `reponse` vaut 42 :
      ```java
      if (reponse ___ 42) {
      }
      ```
    blanks: [["=="]]
    answer: '`==` compare ; un seul `=` serait une affectation.'
  - key: trous-majeur
    format: fill-in
    question: |-
      Complète pour que `majeur` soit vrai à partir de 18 ans :
      ```java
      boolean majeur = age ___ 18;
      ```
    blanks: [[">="]]
    answer: '`>=` inclut 18.'
  - key: trous-different
    format: fill-in
    question: |-
      Complète pour n'afficher que les quantités non nulles :
      ```java
      if (quantite ___ 0) {
          System.out.println(quantite);
      }
      ```
    blanks: [["!=", ">"]]
    answer: '`!=` (différent de zéro), ou `>` si les quantités ne peuvent pas être négatives.'
  - key: trous-intervalle
    format: fill-in
    question: |-
      Complète pour tester que `x` est strictement entre 0 et 10 :
      ```java
      boolean dedans = x > 0 ___ x < 10;
      ```
    blanks: [["&&"]]
    answer: Les deux conditions doivent être vraies.
  - key: code-superieur-ou-egal
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println((3 >= 3) + " " + (3 > 3));
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`1 0`", correct: false}
    answer: '`true false` : 3 est égal à 3, mais pas strictement supérieur.'
    check:
      output: "true false"
  - key: code-char
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println('a' < 'b');
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`-1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: '`true` : les caractères se comparent par leur code (97 et 98).'
    check:
      output: "true"
  - key: code-different
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int x = 5;
      boolean resultat = x != 5;
      System.out.println(resultat);
      ```
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
    answer: '`false` : `x` vaut 5, il n''est donc pas différent de 5.'
    check:
      output: "false"
  - key: code-nan
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      double x = Double.NaN;
      System.out.println((x > 0) + " " + (x <= 0));
      ```
    choices:
      - {text: "`false false`", correct: true}
      - {text: "`false true`", correct: false}
      - {text: "`true false`", correct: false}
      - {text: "`NaN NaN`", correct: false}
    answer: '`false false` : `NaN` n''est ni positif, ni négatif, ni nul ; toute comparaison avec lui est fausse.'
    check:
      output: "false false"
  - key: bug-affectation-dans-if
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: int cannot be converted to boolean`). Quelle correction est la bonne ?
      ```java
      if (score = 100) {
          System.out.println("Parfait !");
      }
      ```
    choices:
      - {text: "`if (score == 100) {`", correct: true}
      - {text: "`if (score === 100) {`", correct: false}
      - {text: "`if (score.equals(100)) {`", correct: false}
      - {text: "`if ((boolean) (score = 100)) {`", correct: false}
    answer: |-
      ```java
      if (score == 100) {
      ```
      `=` affecte et vaut un `int` ; la condition attend un booléen, donné par `==`.
  - key: bug-comparaison-chainee
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      if (0 < temperature < 30) {
          System.out.println("Agréable");
      }
      ```
    choices:
      - {text: "`if (temperature > 0 && temperature < 30) {`", correct: true}
      - {text: "`if (temperature > 0 || temperature < 30) {`", correct: false}
      - {text: "`if ((0 < temperature) < 30) {`", correct: false}
      - {text: "`if (0 < temperature & < 30) {`", correct: false}
    answer: |-
      ```java
      if (temperature > 0 && temperature < 30) {
      ```
      Chaque comparaison donne un booléen ; on les relie avec `&&`.
  - key: bug-parite-affectation
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      boolean estPair = n % 2 = 0;
      ```
    choices:
      - {text: "`boolean estPair = n % 2 == 0;`", correct: true}
      - {text: "`boolean estPair = (n % 2 = 0);`", correct: false}
      - {text: "`boolean estPair = n % 2;`", correct: false}
      - {text: "`boolean estPair = n / 2 == 0;`", correct: false}
    answer: |-
      ```java
      boolean estPair = n % 2 == 0;
      ```
      Il faut comparer avec `==`, pas affecter avec `=`.
  - key: bug-fleche
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      if (age => 18) {
          System.out.println("Majeur");
      }
      ```
    choices:
      - {text: "`if (age >= 18) {`", correct: true}
      - {text: "`if (age > = 18) {`", correct: false}
      - {text: "`if (age =< 18) {`", correct: false}
      - {text: "`if (age > 18) {`", correct: false}
    answer: |-
      ```java
      if (age >= 18) {
      ```
      « Supérieur ou égal » s'écrit `>=`, le `=` en second.
