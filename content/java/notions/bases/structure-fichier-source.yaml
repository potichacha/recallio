notion: structure-fichier-source
lesson: |-
  Un fichier `.java` suit toujours le même ordre :

  ```java
  package fr.recallio.caisse;          // 1. le package (facultatif, une seule fois, en premier)

  import java.util.List;               // 2. les imports
  import java.time.LocalDate;

  public class Caisse {                // 3. les types : une seule classe publique
      // ...
  }
  ```

  - Le **package** range la classe dans un espace de noms ; il correspond aux **dossiers** : `fr/recallio/caisse/Caisse.java`.
  - Un **import** évite d'écrire le nom complet (`java.util.List`). `java.lang` (`String`, `System`, `Math`...) est
    importé d'office.
  - Un fichier contient **au plus une classe publique**, et le fichier porte son nom. Il peut contenir d'autres classes,
    non publiques, mais c'est rarement une bonne idée.

  Le **nom complet** d'une classe est son package suivi de son nom : `fr.recallio.caisse.Caisse`. C'est lui qu'on donne
  à `java` pour lancer une classe rangée dans un package.

  **Piège classique** : un fichier `Caisse.java` qui contient `public class Panier`. Le compilateur refuse : la classe
  publique doit porter le nom du fichier.

  **En entretien** : « Package, imports, puis une seule classe publique par fichier, qui porte son nom ; le package suit
  l'arborescence des dossiers. »
tour:
  - title: La structure d'un fichier
    text: |-
      Un fichier source classique contient, dans l'ordre :

      - une déclaration `package`, facultative, qui range la classe dans un espace de noms ;
      - des `import`, pour désigner les classes d'autres packages par leur nom court ;
      - une classe publique du **même nom** que le fichier : `public class Main` dans `Main.java`.

      Les classes de `java.lang`, comme `String` ou `Math`, n'ont pas besoin d'import. Un fichier compact importe en
      plus, tout seul, tout le module `java.base`.
    example:
      files:
        Main.java: |-
          import java.util.List;

          public class Main {
              public static void main(String[] args) {
                  List<String> langages = List.of("Java", "Go");
                  System.out.println(langages + " : " + langages.size());
              }
          }
      output: |-
        [Java, Go] : 2
cards:
  - key: ordre-des-elements
    format: course
    question: Dans quel ordre écrit-on un fichier source Java ?
    choices:
      - text: "Dans n'importe quel ordre"
        correct: false
      - text: "Les `import`, puis `package`, puis les classes"
        correct: false
      - text: "Les classes, puis les `import`, puis `package`"
        correct: false
      - text: "`package`, puis les `import`, puis les classes"
        correct: true
    answer: D'abord le `package`, puis les `import`, puis les classes (et autres types).
  - key: package-et-dossiers
    format: course
    question: À quoi correspond le package d'une classe sur le disque ?
    choices:
      - text: "À rien : le package n'a aucun effet sur le disque"
        correct: false
      - text: "À une archive `.jar` par package"
        correct: false
      - text: "Au nom du fichier `.java`"
        correct: false
      - text: "À son dossier : `fr.recallio.caisse` donne `fr/recallio/caisse/`"
        correct: true
    answer: 'À son dossier : la classe `fr.recallio.caisse.Caisse` est rangée dans `fr/recallio/caisse/Caisse.java`.'
  - key: java-lang-importe
    format: course
    question: Pourquoi peut-on utiliser `String` ou `System` sans `import` ?
    choices:
      - text: "Ce sont des mots-clés du langage"
        correct: false
      - text: "L'IDE ajoute l'import en cachette à la compilation"
        correct: false
      - text: "Toutes les classes du JDK sont importées d'office"
        correct: false
      - text: "Le package `java.lang` est importé automatiquement"
        correct: true
    answer: Parce que le package `java.lang` est importé automatiquement dans tous les fichiers.
  - key: nom-complet
    format: course
    question: Qu'est-ce que le nom complet (*fully qualified name*) d'une classe ?
    choices:
      - text: "Son nom suivi de ses types génériques, comme `ArrayList<String>`"
        correct: false
      - text: "Son nom suivi de `.class`, comme `ArrayList.class`"
        correct: false
      - text: "Son package suivi de son nom, comme `java.util.ArrayList`"
        correct: true
      - text: "Le chemin de son fichier, comme `java/util/ArrayList.java`"
        correct: false
    answer: 'Son package suivi de son nom, comme `java.util.ArrayList` : c''est ce qui la rend unique.'
  - key: vf-deux-publiques
    format: true-false
    question: Un fichier `.java` peut contenir deux classes publiques.
    truth: false
    answer: Au plus une classe publique par fichier, et le fichier porte son nom.
  - key: vf-import-java-lang
    format: true-false
    question: Il faut écrire `import java.lang.String;` pour utiliser `String`.
    truth: false
    answer: '`java.lang` est importé d''office ; cet import serait inutile.'
  - key: vf-package-en-premier
    format: true-false
    question: La déclaration `package` doit être la première instruction du fichier (hors commentaires).
    truth: true
    answer: Le package vient avant les imports et les classes.
  - key: vf-import-copie
    format: true-false
    question: Un `import` copie le code de la classe importée dans le fichier.
    truth: false
    answer: Un import ne fait que permettre d'écrire le nom court de la classe ; rien n'est copié.
  - key: qcm-premiere-ligne
    format: multiple-choice
    question: Quelle ligne peut venir en premier dans un fichier source (hors commentaires) ?
    choices:
      - text: "`package fr.recallio;`"
        correct: true
      - text: "`import java.util.List;` (si le fichier n'a pas de package)"
        correct: true
      - text: "`public class Caisse {`"
        correct: true
      - text: "`System.out.println(\"Bonjour\");`"
        correct: false
    answer: Le package vient en premier s'il existe, sinon les imports, sinon la classe. Une instruction n'a sa place que dans une méthode.
  - key: qcm-fichier-classe-publique
    format: multiple-choice
    question: Le fichier contient `public class Panier`. Comment doit-il s'appeler ?
    choices:
      - text: "`Panier.java`"
        correct: true
      - text: "`panier.java`"
        correct: false
      - text: "`Main.java`"
        correct: false
      - text: "N'importe quel nom finissant par `.java`"
        correct: false
    answer: Le nom exact de la classe publique, majuscules comprises.
  - key: qcm-importe-d-office
    format: multiple-choice
    question: Quel package est importé automatiquement ?
    choices:
      - text: "`java.lang`"
        correct: true
      - text: "`java.util`"
        correct: false
      - text: "`java.io`"
        correct: false
      - text: "`java.time`"
        correct: false
    answer: Seul `java.lang` (`String`, `System`, `Math`, `Integer`...) ; les autres s'importent.
  - key: qcm-chemin-du-fichier
    format: multiple-choice
    question: Où ranger la classe `com.exemple.web.Accueil` ?
    choices:
      - text: "`com/exemple/web/Accueil.java`"
        correct: true
      - text: "`com.exemple.web.Accueil.java`"
        correct: false
      - text: "`web/Accueil.java`"
        correct: false
      - text: "`Accueil/com/exemple/web.java`"
        correct: false
    answer: Chaque segment du package est un dossier.
  - key: trous-package-import
    format: fill-in
    question: |-
      Complète l'en-tête de `fr/recallio/caisse/Caisse.java`, qui utilise `List` :
      ```java
      ___ fr.recallio.caisse;

      ___ java.util.List;
      ```
    blanks: [[package], [import]]
    answer: Le package d'abord, puis les imports.
  - key: trous-nom-de-classe
    format: fill-in
    question: |-
      Complète la classe publique du fichier `Facture.java` :
      ```java
      public class ___ {
      }
      ```
    blanks: [[Facture]]
    answer: La classe publique porte le nom de son fichier.
  - key: trous-import-complet
    format: fill-in
    question: |-
      Complète l'import de la classe `LocalDate`, rangée dans le package `java.time` :
      ```java
      import ___;
      ```
    blanks: [[java.time.LocalDate]]
    answer: On importe une classe par son nom complet ; `java.time.*` importerait tout le package.
  - key: trous-nom-complet-lancement
    format: fill-in
    question: |-
      La classe `Caisse` est dans le package `fr.recallio` et compilée dans `out`. Complète la commande qui la lance :
      ```
      java -cp out ___
      ```
    blanks: [[fr.recallio.Caisse]]
    answer: '`java` attend le nom complet de la classe, package compris.'
  - key: bug-nom-fichier
    format: bug-fix
    question: |-
      Le fichier `Caisse.java` ne compile pas. Quelle correction le fait compiler ?
      ```java
      public class Panier {
      }
      ```
    choices:
      - text: "Ajouter une méthode `main` à la classe"
        correct: false
      - text: "Écrire `Class` avec une majuscule"
        correct: false
      - text: "Retirer les accolades vides"
        correct: false
      - text: "Renommer la classe en `Caisse`, ou le fichier en `Panier.java`"
        correct: true
    answer: |-
      ```java
      public class Caisse {
      }
      ```
      Une classe publique doit porter le nom de son fichier. Autre solution : renommer le fichier en `Panier.java`.
  - key: bug-import-avant-package
    format: bug-fix
    question: |-
      Ce fichier ne compile pas. Quelle correction le fait compiler ?
      ```java
      import java.util.List;
      package fr.recallio;

      public class Caisse {
      }
      ```
    choices:
      - text: "Supprimer l'`import` : `List` est importé d'office"
        correct: false
      - text: "Remplacer `package fr.recallio;` par `import fr.recallio.*;`"
        correct: false
      - text: "Écrire `package fr.recallio;` avant l'`import`"
        correct: true
      - text: "Ajouter `public` devant `package`"
        correct: false
    answer: |-
      ```java
      package fr.recallio;
      import java.util.List;

      public class Caisse {
      }
      ```
      Le `package` doit être la première déclaration du fichier, avant les imports.
  - key: bug-import-manquant
    format: bug-fix
    question: |-
      Ce code ne compile pas, avec `cannot find symbol` sur `List`. Quelle correction le fait compiler ?
      ```java
      public class Caisse {
          List<String> articles;
      }
      ```
    choices:
      - text: "Écrire `list` en minuscules"
        correct: false
      - text: "Déclarer le champ `public`"
        correct: false
      - text: "Ajouter `import java.lang.List;`"
        correct: false
      - text: "Ajouter `import java.util.List;` en tête du fichier"
        correct: true
    answer: |-
      ```java
      import java.util.List;

      public class Caisse {
          List<String> articles;
      }
      ```
      `List` vit dans `java.util`, qui n'est pas importé d'office (contrairement à `java.lang`).
  - key: bug-deux-classes-publiques
    format: bug-fix
    question: |-
      Le fichier `Caisse.java` ne compile pas. Quelle correction le fait compiler ?
      ```java
      public class Caisse {
      }

      public class Ticket {
      }
      ```
    choices:
      - text: "Ranger `Ticket` dans son propre fichier, `Ticket.java` (ou lui retirer `public`)"
        correct: true
      - text: "Renommer le fichier en `CaisseTicket.java`"
        correct: false
      - text: "Ajouter `import Ticket;` en tête du fichier"
        correct: false
      - text: "Mettre `Ticket` avant `Caisse` dans le fichier"
        correct: false
    answer: |-
      ```java
      public class Caisse {
      }
      ```
      et `Ticket` dans son propre fichier `Ticket.java`. Un fichier ne contient qu'une classe publique ; on range chaque
      classe publique dans son fichier.
