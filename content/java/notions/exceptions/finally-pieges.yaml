notion: finally-pieges
cards:
  - key: finally-return
    format: course
    question: finally et return ?
    answer: finally s'exécute avant que le return soit effectif ; un return dans finally écrase celui du try.
  - key: finally-execute-toujours
    format: course
    question: finally s'exécute-t-il toujours ?
    answer: 'Non : pas en cas de System.exit, crash, kill -9, ou thread démon tué.'
  - key: code-static-int-f-int-x
    format: code-output
    question: |-
      ```java
      static int f() { int x = 1; try { return x; } finally { x = 2; } }
      static int g() { try { return 1; } finally { return 2; } }
      ```
    answer: '`f()` renvoie `1` (la valeur de retour est figée avant le finally) ; `g()` renvoie `2` (le return du finally écrase celui du try).'
    check:
      code: |-
        static int f() { int x = 1; try { return x; } finally { x = 2; } }
        static int g() { try { return 1; } finally { return 2; } }
        System.out.println(f() + " " + g());
      output: "1 2"
