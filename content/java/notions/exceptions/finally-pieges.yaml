notion: finally-pieges
lesson: |-
  `finally` s'exécute après le `try` et le `catch`, **même** s'ils contiennent un `return` ou lèvent une exception. Cette
  garantie a des effets surprenants :

  ```java
  static int f() {
      int x = 1;
      try {
          return x;          // la valeur 1 est figée ici...
      } finally {
          x = 2;             // ...modifier x ne change plus le résultat : f() renvoie 1
      }
  }

  static int g() {
      try {
          throw new IllegalStateException("perdue");
      } finally {
          return 42;         // ce return ÉCRASE l'exception : g() renvoie 42, sans erreur
      }
  }
  ```

  - Un **`return` dans `finally`** remplace le `return` du `try` et **avale** toute exception en cours.
  - Une **exception levée dans `finally`** remplace l'exception d'origine, qui disparaît (c'est ce que
    `try-with-resources` évite, avec les exceptions supprimées).
  - Si le `try` renvoie un objet **mutable**, le `finally` peut encore le modifier : la référence est figée, pas son
    contenu.
  - `finally` ne s'exécute pas si la JVM s'arrête : `System.exit`, plantage, processus tué, thread démon arrêté.

  Règle simple : un `finally` ne contient que du **nettoyage**, jamais de `return`, de `throw`, ni de logique métier.

  **Piège classique** : un `close()` qui lève une exception dans le `finally`. Il masque l'erreur qui a vraiment fait
  échouer le `try`.

  **En entretien** : « Pas de `return` ni de `throw` dans un `finally` : ils écrasent le résultat ou l'exception du
  `try` ; et `finally` ne survit pas à `System.exit`. »
cards:
  - key: finally-return
    format: course
    question: "Comment le `finally` interagit-il avec un `return` du `try` ?"
    choices:
      - {text: "Il s'exécute avant que le `return` prenne effet ; un `return` dans le `finally` l'écrase", correct: true}
      - {text: "Il ne s'exécute pas : le `return` du `try` quitte la méthode immédiatement", correct: false}
      - {text: "Il s'exécute après le `return`, une fois revenu dans la méthode appelante", correct: false}
      - {text: "Il s'exécute avant, mais le compilateur refuse tout `return` dans un `finally`", correct: false}
    answer: "Le `finally` s'exécute avant que le `return` soit effectif ; un `return` dans le `finally` écrase celui du `try`. Le compilateur l'accepte, d'où le piège."
  - key: finally-execute-toujours
    format: course
    question: "Le `finally` s'exécute-t-il toujours ?"
    choices:
      - {text: "Non : pas après `System.exit`, un crash de la JVM ou un `kill -9`", correct: true}
      - {text: "Oui, dans tous les cas, même après `System.exit`", correct: false}
      - {text: "Non : pas quand le `try` contient un `return`", correct: false}
      - {text: "Non : pas quand une exception n'est pas attrapée", correct: false}
    answer: "Non : pas en cas de `System.exit`, de crash de la JVM, de `kill -9`, ou pour un thread démon arrêté avec la JVM. Un `return` ou une exception, eux, n'empêchent pas le `finally`."
  - key: exception-masquee
    format: course
    question: Que devient l'exception du `try` si le `finally` lève à son tour une exception ?
    choices:
      - {text: "Elle est perdue : l'exception du `finally` remonte à sa place", correct: true}
      - {text: "Elle remonte, et celle du `finally` lui est attachée comme supprimée", correct: false}
      - {text: "Les deux remontent l'une après l'autre, dans l'ordre", correct: false}
      - {text: "Elle devient la cause de l'exception du `finally`", correct: false}
    answer: "Elle est perdue : c'est l'exception du `finally` qui remonte. `try-with-resources` évite ce problème en gardant la seconde comme exception supprimée."
  - key: objet-mutable
    format: course
    question: Un `finally` peut-il changer ce que renvoie `return liste;` dans le `try` ?
    choices:
      - {text: "Pas la référence renvoyée, mais il peut modifier le contenu de l'objet mutable", correct: true}
      - {text: "Non : la liste renvoyée est copiée avant que le `finally` s'exécute", correct: false}
      - {text: "Oui : une affectation `liste = autre` dans le `finally` change ce qui est renvoyé", correct: false}
      - {text: "Non : le `finally` n'a pas accès aux variables déclarées avant le `try`", correct: false}
    answer: Il ne peut pas changer la référence renvoyée, mais il peut modifier le contenu de l'objet référencé s'il est mutable.
  - key: vf-return-avale
    format: true-false
    question: Un `return` dans `finally` peut faire disparaître une exception levée dans le `try`.
    truth: true
    answer: Le `return` du `finally` termine la méthode normalement, et l'exception est abandonnée.
  - key: vf-valeur-figee
    format: true-false
    question: "Avec `try { return x; } finally { x = 2; }`, la méthode renvoie 2."
    truth: false
    answer: La valeur de retour est évaluée avant le `finally` ; modifier `x` n'y change rien.
  - key: vf-exit
    format: true-false
    question: "`finally` s'exécute même après un `System.exit(0)` dans le `try`."
    truth: false
    answer: '`System.exit` arrête la JVM sans exécuter les `finally`.'
  - key: vf-nettoyage
    format: true-false
    question: Un `finally` ne devrait contenir que du nettoyage.
    truth: true
    answer: Pas de `return`, de `throw` ni de logique métier.
  - key: qcm-resultat
    format: multiple-choice
    question: "Que renvoie `try { return 1; } finally { return 2; }` ?"
    choices:
      - text: "2"
        correct: true
      - text: "1"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
      - text: "Une exception"
        correct: false
    answer: Le `return` du `finally` l'emporte (le compilateur avertit seulement).
  - key: qcm-ne-s-execute-pas
    format: multiple-choice
    question: Dans quels cas un `finally` ne s'exécute-t-il pas ?
    choices:
      - text: "Après `System.exit()` dans le `try`"
        correct: true
      - text: "Si le processus est tué (`kill -9`)"
        correct: true
      - text: "Si le `try` contient un `return`"
        correct: false
      - text: "Si le `try` lève une exception non attrapée"
        correct: false
    answer: Le `finally` s'exécute dans tous les cas de sortie normale ou par exception.
  - key: qcm-a-eviter
    format: multiple-choice
    question: "Laquelle de ces instructions ne faut-il pas mettre dans un `finally` ?"
    choices:
      - {text: "Un `return`", correct: true}
      - {text: "La libération d'un verrou", correct: false}
      - {text: "La remise à zéro d'un indicateur", correct: false}
      - {text: "La suppression d'un fichier temporaire", correct: false}
    answer: "Un `return` (comme un `throw`) dans le `finally` écrase le résultat ou l'exception du `try`. Le `finally` sert précisément au nettoyage : verrou, indicateur, fichier temporaire."
  - key: qcm-masquage
    format: multiple-choice
    question: Comment éviter qu'une erreur de fermeture masque l'erreur principale ?
    choices:
      - text: "Utiliser `try-with-resources`"
        correct: true
      - text: "Mettre `close()` dans le `finally` sans précaution"
        correct: false
      - text: "Ajouter `return` dans le `finally`"
        correct: false
      - text: "Attraper `Throwable` dans le `finally`"
        correct: false
    answer: '`try-with-resources` garde l''erreur principale et attache celle de `close` comme exception supprimée.'
  - key: code-static-int-f-int-x
    format: code-output
    question: |-
      Avec ces deux méthodes, qu'affiche `System.out.println(f() + " " + g());` ?
      ```java
      static int f() { int x = 1; try { return x; } finally { x = 2; } }
      static int g() { try { return 1; } finally { return 2; } }
      ```
    choices:
      - {text: "`1 2`", correct: true}
      - {text: "`2 2`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`2 1`", correct: false}
    answer: '`f()` renvoie `1` (la valeur de retour est figée avant le finally) ; `g()` renvoie `2` (le return du finally écrase celui du try).'
    check:
      code: |-
        static int f() { int x = 1; try { return x; } finally { x = 2; } }
        static int g() { try { return 1; } finally { return 2; } }
        System.out.println(f() + " " + g());
      output: "1 2"
  - key: code-exception-masquee
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      try {
          try {
              throw new IllegalStateException("originale");
          } finally {
              throw new RuntimeException("finally");
          }
      } catch (RuntimeException e) {
          System.out.println(e.getMessage());
      }
      ```
    choices:
      - {text: "`finally`", correct: true}
      - {text: "`originale`", correct: false}
      - {text: "`originale finally`", correct: false}
      - {text: "Une `IllegalStateException` non attrapée", correct: false}
    answer: '`finally` : l''exception d''origine a disparu.'
    check:
      output: "finally"
  - key: code-return-avale
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static int f() {
          try {
              throw new IllegalStateException();
          } finally {
              return 42;
          }
      }
      System.out.println(f());
      ```
    choices:
      - {text: "`42`", correct: true}
      - {text: "Une `IllegalStateException`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas : le `return` est inaccessible", correct: false}
    answer: '`42` : le `return` du `finally` avale l''exception.'
    check:
      output: "42"
  - key: code-mutable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static StringBuilder f() {
          StringBuilder sb = new StringBuilder("a");
          try {
              return sb;
          } finally {
              sb.append("b");
          }
      }
      System.out.println(f());
      ```
    choices:
      - {text: "`ab`", correct: true}
      - {text: "`a`", correct: false}
      - {text: "`b`", correct: false}
      - {text: "`ba`", correct: false}
    answer: '`ab` : la référence est figée, mais le `finally` modifie encore l''objet.'
    check:
      output: "ab"
  - key: bug-return-finally
    format: bug-fix
    question: |-
      Les erreurs de sauvegarde ne remontent jamais. Quelle correction est la bonne ?
      ```java
      boolean sauvegarder(Document d) {
          try {
              depot.enregistrer(d);
          } finally {
              return true;
          }
      }
      ```
    choices:
      - {text: "Retirer le `return true` du `finally` et laisser l'exception remonter", correct: true}
      - {text: "Déplacer `return true` dans un `catch (Exception e)`", correct: false}
      - {text: "Remplacer `return true` par `return false` dans le `finally`", correct: false}
      - {text: "Ajouter un `catch` vide juste avant le `finally`", correct: false}
    answer: |-
      ```java
      void sauvegarder(Document d) {
          depot.enregistrer(d);
      }
      ```
      Le `return` du `finally` avalait toute exception et prétendait que tout s'était bien passé. Sans lui, l'erreur
      remonte ; si un nettoyage est nécessaire, le `finally` ne fait que ça.
  - key: bug-close-masque
    format: bug-fix
    question: |-
      Les journaux montrent « erreur de fermeture », jamais l'erreur d'écriture qui l'a précédée. Quelle correction est la bonne ?
      ```java
      Writer w = Files.newBufferedWriter(chemin);
      try {
          w.write(contenu);
      } finally {
          w.close();
      }
      ```
    choices:
      - {text: "Un `try-with-resources`, qui garde l'erreur d'écriture et attache celle de fermeture", correct: true}
      - {text: "Appeler `w.close()` à la fin du `try` et supprimer le `finally`", correct: false}
      - {text: "Appeler `w.flush()` dans le `finally`, à la place de `w.close()`", correct: false}
      - {text: "Déclarer `w` en `final`, pour que `close()` ne lève plus rien", correct: false}
    answer: |-
      ```java
      try (Writer w = Files.newBufferedWriter(chemin)) {
          w.write(contenu);
      }
      ```
      Une exception de `close()` dans le `finally` remplace celle de `write`. `try-with-resources` garde l'erreur
      d'écriture et attache celle de fermeture comme exception supprimée.
  - key: bug-logique-finally
    format: bug-fix
    question: |-
      La commande est marquée « envoyée » même quand l'envoi échoue. Quelle correction est la bonne ?
      ```java
      try {
          passerelle.envoyer(commande);
      } finally {
          commande.marquerEnvoyee();
      }
      ```
    choices:
      - {text: "Appeler `marquerEnvoyee()` après `envoyer`, hors de tout `finally`", correct: true}
      - {text: "Appeler `marquerEnvoyee()` avant `envoyer`, dans le `try`", correct: false}
      - {text: "Ajouter un `catch` vide juste avant le `finally`", correct: false}
      - {text: "Remplacer `finally` par `catch (Exception e)`", correct: false}
    answer: |-
      ```java
      passerelle.envoyer(commande);
      commande.marquerEnvoyee();
      ```
      Le `finally` s'exécute aussi en cas d'échec : il ne doit contenir que ce qui vaut dans tous les cas (le nettoyage),
      pas la suite du traitement normal.
  - key: bug-throw-finally
    format: bug-fix
    question: |-
      L'exception de validation n'arrive jamais à l'appelant, qui ne voit que « nettoyage incomplet ». Quelle correction est la bonne ?
      ```java
      try {
          valider(fichier);
      } finally {
          if (!temporaire.delete()) {
              throw new IllegalStateException("nettoyage incomplet");
          }
      }
      ```
    choices:
      - {text: "Journaliser l'échec du nettoyage dans le `finally`, au lieu de lever", correct: true}
      - {text: "Lever une `Error` dans le `finally`, plus grave et donc prioritaire", correct: false}
      - {text: "Appeler `valider(fichier)` dans le `finally`, après la suppression", correct: false}
      - {text: "Supprimer le fichier temporaire avant `valider`, dans le `try`", correct: false}
    answer: |-
      ```java
      try {
          valider(fichier);
      } finally {
          if (!temporaire.delete()) {
              log.warn("fichier temporaire non supprimé : {}", temporaire);
          }
      }
      ```
      Un `throw` dans le `finally` masque l'exception du `try`. Un échec de nettoyage secondaire se journalise, sans
      écraser l'erreur principale.
