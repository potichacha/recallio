notion: errors-courantes
cards:
  - key: stackoverflowerror
    format: course
    question: C'est quoi StackOverflowError ?
    answer: Un débordement de la pile, typiquement une récursion infinie.
  - key: causes-possibles-outofmemoryerror
    format: course
    question: Les causes possibles d'OutOfMemoryError ?
    answer: Heap plein, GC overhead, Metaspace, threads natifs, mémoire directe, taille de tableau.
  - key: classnotfoundexception-vs-noclassdeffounderror
    format: course
    question: ClassNotFoundException vs NoClassDefFoundError ?
    answer: Chargement dynamique d'une classe absente vs classe connue à la compilation mais introuvable (ou en échec d'initialisation) à l'exécution.
  - key: passe-si-bloc-static-leve-exception
    format: course
    question: Que se passe-t-il si un bloc static lève une exception ?
    answer: ExceptionInInitializerError la première fois, puis NoClassDefFoundError à chaque usage.
  - key: definition-oom-oomkilled
    format: definition
    question: OOM / OOMKilled
    answer: OutOfMemoryError de la JVM / processus tué par le noyau ou Kubernetes
