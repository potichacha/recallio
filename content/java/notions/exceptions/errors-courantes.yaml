notion: errors-courantes
lesson: |-
  Les `Error` signalent que la JVM elle-même est en difficulté. On ne les « traite » pas : on les comprend pour corriger
  la cause.

  | Erreur | Cause habituelle |
  |---|---|
  | `StackOverflowError` | une récursion infinie (ou trop profonde) épuise la pile du thread |
  | `OutOfMemoryError` | le tas est plein (fuite, cache sans limite, fichier chargé en entier), ou le *Metaspace*, la mémoire directe, les threads natifs ; ou un tableau trop grand |
  | `NoClassDefFoundError` | une classe présente à la compilation manque à l'exécution, ou son initialisation `static` a échoué |
  | `ExceptionInInitializerError` | une exception dans l'initialisation `static` d'une classe |
  | `AssertionError` | une assertion `assert` échouée (avec `-ea`) |

  ```java
  static int profondeur(Noeud n) {
      return 1 + profondeur(n.enfant);    // pas de cas d'arrêt : StackOverflowError
  }
  ```

  - **`ClassNotFoundException`** (une exception vérifiée) vient d'un chargement **dynamique** par nom
    (`Class.forName`) ; **`NoClassDefFoundError`** d'une classe connue à la compilation mais absente (ou cassée) à
    l'exécution : un JAR manquant, un conflit de versions.
  - Après un `OutOfMemoryError`, la JVM n'est plus fiable : on la laisse s'arrêter, avec un vidage du tas pour enquêter
    (`-XX:+HeapDumpOnOutOfMemoryError`), et on redémarre.
  - En conteneur, un dépassement de la limite mémoire du **conteneur** tue le processus (*OOMKilled*) sans
    `OutOfMemoryError` : on dimensionne le tas par rapport au conteneur (`-XX:MaxRAMPercentage`).

  **Piège classique** : attraper `StackOverflowError` pour « continuer ». La pile est dans un état incertain ; il faut
  corriger la récursion.

  **En entretien** : « `StackOverflowError` : récursion sans fin ; `OutOfMemoryError` : mémoire épuisée, souvent une
  fuite ; `NoClassDefFoundError` : une classe connue à la compilation manque ou a échoué à s'initialiser. »
cards:
  - key: stackoverflowerror
    format: course
    question: "Qu'est-ce qu'une `StackOverflowError` ?"
    choices:
      - {text: "Un débordement de la pile d'un thread, le plus souvent dû à une récursion infinie", correct: true}
      - {text: "Un débordement du tas, le plus souvent dû à un cache qui grossit sans limite", correct: false}
      - {text: "Un dépassement de capacité d'un `int`, quand un calcul dépasse `Integer.MAX_VALUE`", correct: false}
      - {text: "Une `Stack` trop pleine, qui refuse un `push` au-delà de sa capacité", correct: false}
    answer: "Un débordement de la pile d'appels d'un thread, typiquement une récursion infinie. Un tas plein donne une `OutOfMemoryError`, pas une `StackOverflowError`."
  - key: causes-possibles-outofmemoryerror
    format: course
    question: "Quelles sont les causes possibles d'une `OutOfMemoryError` ?"
    choices:
      - {text: "Tas plein, GC débordé, Metaspace, threads natifs, mémoire directe ou tableau trop grand", correct: true}
      - {text: "Une récursion infinie, qui épuise la mémoire de la pile du thread courant", correct: false}
      - {text: "Une division par zéro sur des `double`, qui produit un résultat infini", correct: false}
      - {text: "Seulement un tas plein : les autres zones de mémoire ne lèvent jamais d'erreur", correct: false}
    answer: Heap plein, GC overhead, Metaspace, threads natifs, mémoire directe, taille de tableau.
  - key: classnotfoundexception-vs-noclassdeffounderror
    format: course
    question: "Qu'est-ce qui distingue une `ClassNotFoundException` d'une `NoClassDefFoundError` ?"
    choices:
      - {text: "La première : chargement dynamique d'une classe absente ; la seconde : classe connue à la compilation, introuvable à l'exécution", correct: true}
      - {text: "La première : classe connue à la compilation, introuvable à l'exécution ; la seconde : chargement dynamique d'une classe absente", correct: false}
      - {text: "Aucune : la seconde est le nouveau nom de la première depuis Java 9, et les deux s'attrapent de la même façon", correct: false}
      - {text: "La première : erreur de compilation sur un `import` manquant ; la seconde : faute de frappe dans un nom de classe", correct: false}
    answer: Chargement dynamique d'une classe absente vs classe connue à la compilation mais introuvable (ou en échec d'initialisation) à l'exécution.
  - key: passe-si-bloc-static-leve-exception
    format: course
    question: Que se passe-t-il si un bloc static lève une exception ?
    choices:
      - {text: "`ExceptionInInitializerError` la première fois, puis `NoClassDefFoundError` à chaque usage", correct: true}
      - {text: "`ExceptionInInitializerError` à chaque usage de la classe, avec la même cause à chaque fois", correct: false}
      - {text: "L'exception d'origine à chaque usage, sans enveloppe, comme pour une méthode ordinaire", correct: false}
      - {text: "Rien : le bloc `static` est ignoré, et les champs gardent leurs valeurs par défaut", correct: false}
    answer: ExceptionInInitializerError la première fois, puis NoClassDefFoundError à chaque usage.
  - key: vf-recursion
    format: true-false
    question: Une récursion sans cas d'arrêt finit par une `StackOverflowError`.
    truth: true
    answer: Chaque appel ajoute un cadre à la pile, jusqu'à l'épuiser.
  - key: vf-oom-catch
    format: true-false
    question: Après avoir attrapé une `OutOfMemoryError`, on peut continuer normalement.
    truth: false
    answer: L'état de la JVM est incertain ; on journalise, on fait un vidage du tas et on redémarre.
  - key: vf-class-not-found
    format: true-false
    question: "`ClassNotFoundException` est une `Error`."
    truth: false
    answer: C'est une exception vérifiée, levée par un chargement par nom ; `NoClassDefFoundError` est l'erreur.
  - key: vf-oomkilled
    format: true-false
    question: Un conteneur tué pour dépassement de mémoire (OOMKilled) produit toujours une `OutOfMemoryError` dans les journaux.
    truth: false
    answer: Le noyau tue le processus sans que la JVM puisse rien écrire.
  - key: qcm-causes-oom
    format: multiple-choice
    question: Lesquelles peuvent provoquer une `OutOfMemoryError` ?
    choices:
      - text: "Un cache sans limite qui retient tous les objets"
        correct: true
      - text: "Un fichier de plusieurs gigaoctets chargé entièrement en mémoire"
        correct: true
      - text: "Une récursion infinie"
        correct: false
      - text: "Une division par zéro"
        correct: false
    answer: La récursion infinie donne une `StackOverflowError`.
  - key: qcm-ncdfe
    format: multiple-choice
    question: Quelle est une cause typique de `NoClassDefFoundError` ?
    choices:
      - text: "Un JAR présent à la compilation mais absent du classpath à l'exécution"
        correct: true
      - text: "Une faute de frappe dans `Class.forName(\"...\")`"
        correct: false
      - text: "Un tableau trop grand"
        correct: false
      - text: "Un argument `null`"
        correct: false
    answer: Une faute dans `Class.forName` donne une `ClassNotFoundException`.
  - key: qcm-diagnostic
    format: multiple-choice
    question: Quelle option aide à enquêter après une `OutOfMemoryError` ?
    choices:
      - text: "`-XX:+HeapDumpOnOutOfMemoryError`"
        correct: true
      - text: "`-XX:-OmitStackTraceInFastThrow`"
        correct: false
      - text: "`-ea`"
        correct: false
      - text: "`-Xss`"
        correct: false
    answer: Le vidage du tas montre ce qui occupait la mémoire.
  - key: qcm-conteneur
    format: multiple-choice
    question: Comment dimensionner le tas d'une JVM dans un conteneur limité à 1 Go ?
    choices:
      - text: "`-XX:MaxRAMPercentage=75` (le tas suit la limite du conteneur)"
        correct: true
      - text: "`-Xmx4g`"
        correct: false
      - text: "Ne rien faire, et laisser la JVM prendre toute la mémoire de l'hôte"
        correct: false
      - text: "`-Xss1g`"
        correct: false
    answer: Les JVM récentes connaissent la limite du conteneur ; on laisse de la marge pour la mémoire hors tas.
  - key: code-recursion
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static int f(int n) {
          return f(n + 1);
      }
      f(0);
      ```
    choices:
      - {text: "Une `StackOverflowError`", correct: true}
      - {text: "Une `OutOfMemoryError`", correct: false}
      - {text: "Rien : le programme tourne sans fin", correct: false}
      - {text: "Une `ArithmeticException` quand `n` déborde", correct: false}
    answer: "Une `StackOverflowError` : la récursion n'a pas de cas d'arrêt."
    check:
      throws: StackOverflowError
  - key: code-tableau-trop-grand
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int[] t = new int[Integer.MAX_VALUE];
      ```
    choices:
      - {text: "Une `OutOfMemoryError`", correct: true}
      - {text: "Une `NegativeArraySizeException`", correct: false}
      - {text: "Rien : le tableau est alloué", correct: false}
      - {text: "Une `IllegalArgumentException`", correct: false}
    answer: "Une `OutOfMemoryError` (« Requested array size exceeds VM limit ») : la taille dépasse ce que la JVM sait allouer."
    check:
      throws: OutOfMemoryError
  - key: code-initialisation
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Config {
          static final int PORT = Integer.parseInt("abc");
      }
      System.out.println(Config.PORT);
      ```
    choices:
      - {text: "Une `ExceptionInInitializerError`", correct: true}
      - {text: "Une `NumberFormatException`, sans enveloppe", correct: false}
      - {text: "`0`, la valeur par défaut d'un `int`", correct: false}
      - {text: "Une `NoClassDefFoundError`", correct: false}
    answer: Une `ExceptionInInitializerError`, dont la cause est la `NumberFormatException` de l'initialisation `static`.
    check:
      throws: ExceptionInInitializerError
  - key: code-class-for-name
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      try {
          Class.forName("com.exemple.Inexistante");
      } catch (ClassNotFoundException e) {
          System.out.println(e.getClass().getSimpleName());
      }
      ```
    choices:
      - {text: "`ClassNotFoundException`", correct: true}
      - {text: "`NoClassDefFoundError`", correct: false}
      - {text: "`com.exemple.Inexistante`", correct: false}
      - {text: "`java.lang.ClassNotFoundException`", correct: false}
    answer: '`ClassNotFoundException` : le chargement par nom échoue.'
    check:
      output: "ClassNotFoundException"
  - key: bug-cas-arret
    format: bug-fix
    question: |-
      Le calcul de la profondeur d'un arbre lève une `StackOverflowError`. Quelle correction est la bonne ?
      ```java
      static int profondeur(Noeud n) {
          return 1 + Math.max(profondeur(n.gauche), profondeur(n.droite));
      }
      ```
    choices:
      - {text: "Ajouter un cas d'arrêt : renvoyer 0 quand le nœud est `null`", correct: true}
      - {text: "Augmenter la taille de la pile avec l'option `-Xss` de la JVM", correct: false}
      - {text: "Attraper la `StackOverflowError` et renvoyer la profondeur atteinte", correct: false}
      - {text: "Remplacer `Math.max` par la somme des deux profondeurs", correct: false}
    answer: |-
      ```java
      static int profondeur(Noeud n) {
          if (n == null) {
              return 0;
          }
          return 1 + Math.max(profondeur(n.gauche), profondeur(n.droite));
      }
      ```
      Sans cas d'arrêt, la récursion ne finit jamais (ici, elle lèverait d'ailleurs d'abord une NPE sur une feuille).
  - key: bug-catch-stack-overflow
    format: bug-fix
    question: |-
      Ce code « protège » le parcours d'un graphe, qui contient des cycles :
      ```java
      try {
          parcourir(racine);
      } catch (StackOverflowError e) {
          log.warn("graphe trop profond, parcours partiel");
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un ensemble des nœuds visités et une pile explicite, qui corrigent la cause", correct: true}
      - {text: "Augmenter la pile avec `-Xss` pour finir le parcours malgré les cycles", correct: false}
      - {text: "Attraper `Throwable` au lieu de `StackOverflowError`, pour tout couvrir", correct: false}
      - {text: "Journaliser en `error` plutôt qu'en `warn`, pour qu'on le remarque", correct: false}
    answer: |-
      ```java
      void parcourir(Noeud depart) {
          Set<Noeud> vus = new HashSet<>();
          Deque<Noeud> aVisiter = new ArrayDeque<>(List.of(depart));
          while (!aVisiter.isEmpty()) {
              Noeud n = aVisiter.pop();
              if (vus.add(n)) {
                  traiter(n);
                  aVisiter.addAll(n.voisins());
              }
          }
      }
      ```
      Les cycles rendaient la récursion infinie. Un ensemble des nœuds visités et une pile explicite corrigent la cause, au
      lieu d'attraper l'erreur.
  - key: bug-fichier-entier
    format: bug-fix
    question: |-
      L'import d'un fichier de 8 Go échoue avec `OutOfMemoryError: Java heap space`. Quelle correction est la bonne ?
      ```java
      List<String> lignes = Files.readAllLines(chemin);
      lignes.forEach(this::importer);
      ```
    choices:
      - {text: "Lire au fil de l'eau avec `Files.lines`, dans un `try-with-resources`", correct: true}
      - {text: "Passer `-Xmx8g` à la JVM, pour que le fichier tienne dans le tas", correct: false}
      - {text: "Remplacer `readAllLines` par `readString`, plus compact en mémoire", correct: false}
      - {text: "Appeler `System.gc()` avant `readAllLines` pour libérer le tas", correct: false}
    answer: |-
      ```java
      try (Stream<String> lignes = Files.lines(chemin)) {
          lignes.forEach(this::importer);
      }
      ```
      `readAllLines` charge tout le fichier en mémoire. `Files.lines` lit au fil de l'eau : la mémoire reste constante.
  - key: bug-xmx-conteneur
    format: bug-fix
    question: |-
      Le pod est régulièrement tué (*OOMKilled*) sans aucune erreur dans les journaux. Quelle correction est la bonne ?
      ```dockerfile
      # limite du conteneur : 1 Go
      ENTRYPOINT ["java", "-Xmx1g", "-jar", "app.jar"]
      ```
    choices:
      - {text: "Dimensionner le tas en pourcentage de la limite : `-XX:MaxRAMPercentage=75`", correct: true}
      - {text: "Passer à `-Xmx2g`, pour donner plus de place au tas de la JVM", correct: false}
      - {text: "Ajouter `-XX:+HeapDumpOnOutOfMemoryError` pour voir l'erreur dans les journaux", correct: false}
      - {text: "Ajouter `-Xms1g`, pour réserver tout le tas dès le démarrage", correct: false}
    answer: |-
      ```dockerfile
      ENTRYPOINT ["java", "-XX:MaxRAMPercentage=75", "-jar", "app.jar"]
      ```
      Un tas de 1 Go, plus la mémoire hors tas (Metaspace, piles, tampons), dépasse la limite de 1 Go du conteneur : le
      noyau tue le processus. On dimensionne le tas en pourcentage de la limite, avec une marge.
  - key: definition-oom-oomkilled
    format: definition
    question: "Que désignent « OOM » et « OOMKilled » ?"
    choices:
      - {text: "Une `OutOfMemoryError` levée par la JVM ; un processus tué par le noyau ou Kubernetes", correct: true}
      - {text: "Un processus tué par le noyau ou Kubernetes ; une `OutOfMemoryError` levée par la JVM", correct: false}
      - {text: "Deux noms de la même `OutOfMemoryError`, l'un en local, l'autre en production", correct: false}
      - {text: "Une erreur de la pile d'un thread ; une erreur du tas, journalisée par la JVM", correct: false}
    answer: "OOM : une `OutOfMemoryError` levée par la JVM, visible dans ses journaux. OOMKilled : le processus tué par le noyau ou Kubernetes pour avoir dépassé la limite du conteneur, sans trace côté JVM."
  - key: definition-stack-overflow
    format: definition
    question: "Que désigne `StackOverflowError` ?"
    choices:
      - {text: "L'erreur levée quand la pile d'un thread est épuisée, souvent par une récursion infinie", correct: true}
      - {text: "L'erreur levée quand le tas est plein et que le GC ne libère plus rien", correct: false}
      - {text: "L'exception levée quand un `int` dépasse `Integer.MAX_VALUE`", correct: false}
      - {text: "L'exception levée par `Stack.pop()` sur une pile vide", correct: false}
    answer: L'erreur levée quand la pile d'un thread est épuisée, le plus souvent par une récursion infinie.
  - key: definition-ncdfe
    format: definition
    question: "Que désigne `NoClassDefFoundError` ?"
    choices:
      - {text: "L'erreur levée quand une classe connue à la compilation est introuvable ou inutilisable à l'exécution", correct: true}
      - {text: "L'exception levée par `Class.forName` quand aucune classe ne porte le nom demandé", correct: false}
      - {text: "L'erreur de compilation de `javac` quand un `import` désigne une classe absente", correct: false}
      - {text: "L'erreur levée quand une classe déclare deux fois la même méthode avec la même signature", correct: false}
    answer: L'erreur levée quand une classe connue à la compilation est introuvable ou inutilisable à l'exécution.
  - key: definition-eiie
    format: definition
    question: "Que désigne `ExceptionInInitializerError` ?"
    choices:
      - {text: "L'erreur qui enveloppe une exception levée pendant l'initialisation `static` d'une classe", correct: true}
      - {text: "L'exception levée quand un constructeur appelle une méthode sur un champ encore `null`", correct: false}
      - {text: "L'erreur levée quand une variable locale est lue avant d'avoir été initialisée", correct: false}
      - {text: "L'exception levée quand un `record` reçoit un composant invalide dans son constructeur", correct: false}
    answer: L'erreur qui enveloppe une exception levée pendant l'initialisation `static` d'une classe.
