notion: exceptions-lambdas
lesson: |-
  Les interfaces fonctionnelles de la JDK (`Function`, `Consumer`, `Supplier`, `Predicate`...) ne déclarent **aucune
  exception vérifiée**. Une lambda qui appelle une méthode levant une `IOException` ne compile donc pas :

  ```java
  chemins.stream()
         .map(Files::readString)          // ne compile pas : IOException non traitée
         .toList();
  ```

  Les solutions, de la plus simple à la plus générale :

  ```java
  // 1. une méthode qui enveloppe
  private static String lire(Path p) {
      try {
          return Files.readString(p);
      } catch (IOException e) {
          throw new UncheckedIOException(e);     // non vérifiée, avec la cause
      }
  }
  chemins.stream().map(Lecteur::lire).toList();

  // 2. une interface fonctionnelle qui déclare l'exception, et un adaptateur
  @FunctionalInterface
  interface FonctionRisquee<T, R> { R appliquer(T t) throws IOException; }

  static <T, R> Function<T, R> envelopper(FonctionRisquee<T, R> f) {
      return t -> {
          try { return f.appliquer(t); }
          catch (IOException e) { throw new UncheckedIOException(e); }
      };
  }
  ```

  - L'exception enveloppée sort du stream à l'opération terminale ; on peut l'attraper autour et récupérer la cause.
  - Une boucle `for` classique accepte les exceptions vérifiées : pour quelques éléments, c'est souvent le plus lisible.
  - Si un élément en échec ne doit pas tout arrêter, on renvoie un **résultat** (succès ou échec) plutôt que de lever.

  **Piège classique** : attraper l'exception dans la lambda et renvoyer `null`. Le stream continue avec des `null`, et
  l'erreur réapparaît plus loin sous forme de `NullPointerException`.

  **En entretien** : « `Function` et ses sœurs ne déclarent pas d'exception vérifiée : j'enveloppe dans une exception non
  vérifiée avec la cause, ou j'utilise une boucle `for`. »
cards:
  - key: lambda-lancer-ioexception-map
    format: course
    question: "Pourquoi une lambda passée à `map` ne peut-elle pas lever d'`IOException` ?"
    choices:
      - {text: "`Function.apply` ne déclare aucune exception vérifiée", correct: true}
      - {text: "Les streams interdisent toute exception dans leurs lambdas", correct: false}
      - {text: "Une lambda ne peut lever que des `Error`, jamais d'exception", correct: false}
      - {text: "`map` attrape et ignore les exceptions levées par la lambda", correct: false}
    answer: "`Function.apply` ne déclare aucune exception vérifiée : il faut envelopper l'`IOException` dans une exception non vérifiée, ou créer sa propre interface fonctionnelle. Les exceptions non vérifiées, elles, passent."
  - key: lever-exception-checked-depuis-lambda
    format: course
    question: "Comment lever une exception vérifiée depuis une lambda ?"
    choices:
      - {text: "L'envelopper dans une non vérifiée, ou définir une interface fonctionnelle qui la déclare", correct: true}
      - {text: "Ajouter `throws IOException` juste après la flèche `->` de la lambda", correct: false}
      - {text: "Déclarer la variable qui reçoit la lambda avec `var`, qui accepte les exceptions vérifiées", correct: false}
      - {text: "C'est impossible : aucune lambda ne peut lever d'exception vérifiée, quelle que soit l'interface", correct: false}
    answer: "L'envelopper dans une exception non vérifiée (`UncheckedIOException`), ou définir une interface fonctionnelle dont la méthode la déclare. Une lambda peut lever ce que déclare son interface."
  - key: sortie-stream
    format: course
    question: Où récupère-t-on une exception levée dans une lambda d'un stream ?
    choices:
      - {text: "Elle remonte de l'opération terminale, qu'on peut entourer d'un `try`/`catch`", correct: true}
      - {text: "Elle remonte de l'appel à `map`, au moment où l'on construit le stream", correct: false}
      - {text: "Elle est stockée dans le stream, et se lit avec `stream.getException()`", correct: false}
      - {text: "Nulle part : le stream l'attrape et passe à l'élément suivant", correct: false}
    answer: Elle remonte de l'opération terminale (`toList`, `forEach`, `collect`), qu'on peut entourer d'un `try/catch` ; la cause d'origine reste accessible par `getCause()`.
  - key: boucle
    format: course
    question: Pourquoi une boucle `for` est-elle parfois préférable à un stream avec des exceptions vérifiées ?
    choices:
      - {text: "Le corps d'une boucle peut propager une exception vérifiée directement, avec `throws`", correct: true}
      - {text: "Une boucle `for` attrape automatiquement les exceptions vérifiées de son corps", correct: false}
      - {text: "Une boucle `for` est toujours plus rapide qu'un stream, exceptions ou non", correct: false}
      - {text: "Les exceptions vérifiées sont interdites dans les streams depuis Java 17", correct: false}
    answer: Le corps d'une boucle peut lever et propager une exception vérifiée directement (avec `throws`), sans enveloppe ni adaptateur.
  - key: vf-function
    format: true-false
    question: "`Function.apply` déclare `throws Exception`."
    truth: false
    answer: Elle ne déclare aucune exception vérifiée.
  - key: vf-unchecked-ok
    format: true-false
    question: Une lambda passée à `map` peut lever une `IllegalArgumentException`.
    truth: true
    answer: Les exceptions non vérifiées passent sans problème.
  - key: vf-interface-propre
    format: true-false
    question: On peut définir une interface fonctionnelle dont la méthode déclare `throws IOException`.
    truth: true
    answer: Une lambda qui l'implémente peut alors lever une `IOException`.
  - key: vf-null
    format: true-false
    question: Renvoyer `null` dans la lambda en cas d'erreur est une bonne façon de gérer une exception vérifiée.
    truth: false
    answer: L'erreur disparaît et revient plus loin en `NullPointerException`.
  - key: qcm-compile
    format: multiple-choice
    question: Lesquelles compilent, avec `List<Path> chemins` ?
    choices:
      - text: "`chemins.stream().map(Lecteur::lire)`, où `lire` enveloppe l'`IOException`"
        correct: true
      - text: "`for (Path p : chemins) contenus.add(Files.readString(p));` dans une méthode `throws IOException`"
        correct: true
      - text: "`chemins.stream().map(Files::readString)`"
        correct: false
      - text: "`chemins.forEach(p -> Files.readString(p))`"
        correct: false
    answer: Les deux dernières laissent une `IOException` non traitée dans une lambda.
  - key: qcm-envelopper
    format: multiple-choice
    question: "Dans quelle exception envelopper de préférence une `IOException` levée dans une lambda ?"
    choices:
      - {text: "`UncheckedIOException`, avec l'exception d'origine comme cause", correct: true}
      - {text: "Une `Error`, que les streams laissent toujours passer", correct: false}
      - {text: "Aucune : il suffit de l'attraper et de l'ignorer", correct: false}
      - {text: "Une `RuntimeException` construite avec `e.getMessage()` seul", correct: false}
    answer: "`UncheckedIOException` est faite pour ça (une `RuntimeException` qui reçoit la cause convient aussi) : l'important est de garder la cause. Une `Error` signale un problème grave de la JVM, et un message seul perd la pile."
  - key: qcm-tolerance
    format: multiple-choice
    question: Un fichier illisible parmi mille ne doit pas arrêter le traitement des autres. Que faire ?
    choices:
      - {text: "Renvoyer pour chaque fichier un résultat (succès ou échec) et traiter les échecs à la fin", correct: true}
      - {text: "Attraper l'exception dans la lambda et renvoyer `null` pour le fichier illisible", correct: false}
      - {text: "Envelopper l'exception et la laisser arrêter le stream au premier fichier illisible", correct: false}
      - {text: "Attraper `Throwable` autour du stream entier, puis relancer tout le traitement", correct: false}
    answer: Un type résultat garde l'information de chaque échec sans interrompre les autres.
  - key: qcm-terminale
    format: multiple-choice
    question: Quand une exception levée dans `map` remonte-t-elle à l'appelant ?
    choices:
      - {text: "Pendant l'opération terminale, quand l'élément est traité", correct: true}
      - {text: "À l'appel de `map`, avant même que le stream soit parcouru", correct: false}
      - {text: "Jamais : le stream l'ignore et passe à l'élément suivant", correct: false}
      - {text: "À la fin du programme, quand la JVM ferme les streams", correct: false}
    answer: Les opérations intermédiaires sont paresseuses.
  - key: code-compile-pas
    format: code-output
    question: |-
      Ce code compile-t-il ?
      ```java
      List<String> contenus = Stream.of(Path.of("a.txt")).map(p -> Files.readString(p)).toList();
      ```
    choices:
      - {text: "Ça ne compile pas : l'`IOException` n'est pas traitée dans la lambda", correct: true}
      - {text: "Oui : la lambda hérite de la gestion d'erreur de `toList()`", correct: false}
      - {text: "Oui, mais une `IOException` peut être levée à l'exécution", correct: false}
      - {text: "Oui : `map` attrape les exceptions vérifiées de sa lambda", correct: false}
    answer: 'Non : `unreported exception IOException; must be caught or declared to be thrown`.'
    check:
      compiles: false
  - key: code-envelopper
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static String lire(String s) {
          try {
              if (s.isEmpty()) throw new IOException("vide");
              return s.toUpperCase();
          } catch (IOException e) {
              throw new UncheckedIOException(e);
          }
      }
      System.out.println(Stream.of("a", "b").map(s -> lire(s)).toList());
      ```
    choices:
      - {text: "`[A, B]`", correct: true}
      - {text: "`[a, b]`", correct: false}
      - {text: "`[A]`", correct: false}
      - {text: "Une `UncheckedIOException`", correct: false}
    answer: '`[A, B]` : la méthode intermédiaire rend la lambda compatible avec `Function`.'
    check:
      output: "[A, B]"
  - key: code-cause
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static String lire(String s) {
          try {
              if (s.isEmpty()) throw new IOException("vide");
              return s.toUpperCase();
          } catch (IOException e) {
              throw new UncheckedIOException(e);
          }
      }
      try {
          Stream.of("a", "").map(s -> lire(s)).toList();
      } catch (UncheckedIOException e) {
          System.out.println(e.getCause().getMessage());
      }
      ```
    choices:
      - {text: "`vide`", correct: true}
      - {text: "`java.io.IOException: vide`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "`[A, ]`", correct: false}
    answer: '`vide` : l''exception sort de l''opération terminale, avec sa cause.'
    check:
      output: "vide"
  - key: code-adaptateur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      @FunctionalInterface
      interface FonctionRisquee<T, R> { R appliquer(T t) throws IOException; }

      static <T, R> Function<T, R> envelopper(FonctionRisquee<T, R> f) {
          return t -> {
              try { return f.appliquer(t); }
              catch (IOException e) { throw new UncheckedIOException(e); }
          };
      }
      System.out.println(Stream.of("x", "yy").map(envelopper(s -> s.length())).toList());
      ```
    choices:
      - {text: "`[1, 2]`", correct: true}
      - {text: "`[x, yy]`", correct: false}
      - {text: "`[1, 1]`", correct: false}
      - {text: "Ça ne compile pas : `s.length()` ne lève jamais d'`IOException`", correct: false}
    answer: '`[1, 2]` : l''adaptateur transforme une fonction qui peut lever en `Function` ordinaire.'
    check:
      output: "[1, 2]"
  - key: bug-null
    format: bug-fix
    question: |-
      Une `NullPointerException` apparaît plus loin dans le traitement, sans rapport apparent. Quelle correction est la bonne ?
      ```java
      List<String> contenus = chemins.stream()
              .map(p -> {
                  try { return Files.readString(p); }
                  catch (IOException e) { return null; }
              })
              .toList();
      ```
    choices:
      - {text: "Envelopper dans une `UncheckedIOException` avec le chemin et la cause, au lieu de renvoyer `null`", correct: true}
      - {text: "Ajouter `.filter(Objects::nonNull)` après le `map`, pour retirer les fichiers illisibles", correct: false}
      - {text: "Renvoyer une chaîne vide au lieu de `null`, pour éviter la `NullPointerException`", correct: false}
      - {text: "Attraper `Exception` au lieu d'`IOException`, pour couvrir tous les cas d'erreur", correct: false}
    answer: |-
      ```java
      List<String> contenus = chemins.stream()
              .map(p -> {
                  try { return Files.readString(p); }
                  catch (IOException e) { throw new UncheckedIOException("lecture de " + p, e); }
              })
              .toList();
      ```
      Renvoyer `null` cache l'erreur dans les données. On l'enveloppe, avec le chemin et la cause, et elle remonte de
      l'opération terminale.
  - key: bug-for-each
    format: bug-fix
    question: |-
      Ce code ne compile pas (`unreported exception IOException`). Quelle correction est la bonne ?
      ```java
      void exporter(List<Rapport> rapports) throws IOException {
          rapports.forEach(r -> Files.writeString(r.chemin(), r.contenu()));
      }
      ```
    choices:
      - {text: "Remplacer `forEach` par une boucle `for`, qui propage l'`IOException` déclarée", correct: true}
      - {text: "Ajouter `throws IOException` à la lambda passée à `forEach`", correct: false}
      - {text: "Remplacer `forEach` par `stream().forEach`, qui accepte les exceptions", correct: false}
      - {text: "Retirer `throws IOException` de la méthode `exporter`", correct: false}
    answer: |-
      ```java
      void exporter(List<Rapport> rapports) throws IOException {
          for (Rapport r : rapports) {
              Files.writeString(r.chemin(), r.contenu());
          }
      }
      ```
      La lambda de `forEach` ne peut pas propager une exception vérifiée, même si la méthode la déclare. Une boucle `for`
      le peut.
  - key: bug-avaler
    format: bug-fix
    question: |-
      Des lignes disparaissent silencieusement de l'export. Quelle correction est la bonne ?
      ```java
      lignes.forEach(l -> {
          try { ecrivain.write(l); }
          catch (IOException e) { }
      });
      ```
    choices:
      - {text: "Une boucle `for` dans une méthode `throws IOException`, qui laisse remonter l'erreur", correct: true}
      - {text: "Ajouter `e.printStackTrace()` dans le `catch` vide de la lambda", correct: false}
      - {text: "Remplacer `forEach` par `parallelStream().forEach`, plus robuste", correct: false}
      - {text: "Attraper `Exception` au lieu d'`IOException` dans la lambda", correct: false}
    answer: |-
      ```java
      for (String l : lignes) {
          ecrivain.write(l);
      }
      ```
      Le `catch` vide dans la lambda avale les erreurs d'écriture. Une boucle `for`, dans une méthode qui déclare
      `throws IOException`, les laisse remonter.
  - key: bug-tolerance
    format: bug-fix
    question: |-
      Un seul fichier corrompu fait échouer l'analyse de tout le dossier :
      ```java
      List<Rapport> rapports = fichiers.stream().map(this::analyser).toList();   // analyser lève une UncheckedIOException
      ```
      On veut analyser les fichiers valides et lister les échecs. Quelle correction est la bonne ?
    choices:
      - {text: "Produire pour chaque fichier un résultat, réussite ou échec, au lieu d'interrompre le stream", correct: true}
      - {text: "Attraper l'`UncheckedIOException` autour de `toList()` et relancer l'analyse sans ce fichier", correct: false}
      - {text: "Faire renvoyer `null` à `analyser` pour un fichier corrompu, puis filtrer les `null`", correct: false}
      - {text: "Paralléliser le stream, pour que l'échec d'un fichier n'arrête pas les autres", correct: false}
    answer: |-
      ```java
      sealed interface Analyse permits Reussie, Echouee { }
      record Reussie(Rapport rapport) implements Analyse { }
      record Echouee(Path fichier, Exception erreur) implements Analyse { }

      List<Analyse> resultats = fichiers.stream()
              .map(f -> {
                  try { return new Reussie(analyser(f)); }
                  catch (UncheckedIOException e) { return new Echouee(f, e); }
              })
              .toList();
      ```
      Chaque fichier produit un résultat, succès ou échec, au lieu d'interrompre le stream. Les échecs gardent leur
      exception pour être journalisés.
