notion: exceptions-lambdas
cards:
  - key: lambda-lancer-ioexception-map
    format: course
    question: Pourquoi une lambda ne peut-elle pas lancer d'IOException dans un map ?
    answer: Function.apply ne déclare aucune exception checked ; il faut l'envelopper ou créer son interface.
  - key: lever-exception-checked-depuis-lambda
    format: course
    question: Comment lever une exception checked depuis une lambda ?
    answer: L'envelopper dans une unchecked (UncheckedIOException) ou définir une interface fonctionnelle qui la déclare.
