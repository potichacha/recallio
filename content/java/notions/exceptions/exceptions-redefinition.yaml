notion: exceptions-redefinition
lesson: |-
  Une méthode redéfinie (ou qui implémente une méthode d'interface) doit respecter le contrat du parent : un appelant
  qui utilise le type parent ne doit pas être surpris. Pour les exceptions **vérifiées**, la redéfinition peut :

  - déclarer **les mêmes** exceptions ;
  - déclarer des **sous-classes** (plus précises) ;
  - déclarer **moins** d'exceptions, ou **aucune** ;
  - mais **jamais** une exception vérifiée **nouvelle** ou **plus large**.

  Les exceptions **non vérifiées** restent libres.

  ```java
  class Source {
      String lire() throws IOException { ... }
  }
  class SourceFichier extends Source {
      @Override String lire() throws FileNotFoundException { ... }   // ✓ plus précise
  }
  class SourceMemoire extends Source {
      @Override String lire() { ... }                                 // ✓ aucune
  }
  class SourceDistante extends Source {
      @Override String lire() throws Exception { ... }                // ✗ plus large : ne compile pas
  }
  ```

  - L'appelant raisonne sur le **type déclaré** : avec une variable de type `Source`, il doit traiter `IOException`, même
    si l'objet réel n'en lève aucune.
  - Une implémentation qui a besoin d'une exception vérifiée que l'interface ne déclare pas l'**enveloppe** dans une
    non vérifiée, ou l'on fait évoluer l'interface.
  - Lever `UnsupportedOperationException` dans une redéfinition compile, mais casse souvent la substitution (principe
    de Liskov) : c'est un signal de conception.

  **Piège classique** : implémenter une interface sans exception avec une méthode qui déclare `throws IOException`. Le
  compilateur refuse ; il faut envelopper.

  **En entretien** : « Une redéfinition peut lever moins ou plus précis, jamais une exception vérifiée plus large ; les
  non vérifiées sont libres. »
cards:
  - key: methode-redefinie-lever-exception-checked-plus
    format: course
    question: "Une méthode redéfinie peut-elle lever une exception vérifiée plus large que celle du parent ?"
    choices:
      - {text: "Non : seulement la même, une sous-classe, aucune, ou des non vérifiées", correct: true}
      - {text: "Oui, à condition de la déclarer avec `throws` dans la sous-classe", correct: false}
      - {text: "Oui, si la classe parente est abstraite", correct: false}
      - {text: "Non, et elle ne peut pas non plus lever d'exception non vérifiée", correct: false}
    answer: "Non : seulement la même, une sous-classe, aucune, ou des exceptions non vérifiées. Celles-ci restent toujours libres."
  - key: pourquoi
    format: course
    question: Pourquoi cette règle sur les exceptions des redéfinitions ?
    choices:
      - {text: "Un appelant du type parent ne traite que les exceptions déclarées par le parent", correct: true}
      - {text: "La JVM ne sait pas construire la pile d'une exception levée par une redéfinition", correct: false}
      - {text: "Une redéfinition ne peut pas appeler de méthode qui lève des exceptions", correct: false}
      - {text: "Le compilateur copie la clause `throws` du parent dans toutes les sous-classes", correct: false}
    answer: Un appelant qui utilise le type parent ne traite que les exceptions déclarées par le parent ; une redéfinition qui en lèverait une nouvelle le prendrait en défaut.
  - key: type-declare
    format: course
    question: Avec `Source s = new SourceMemoire();` (qui ne déclare aucune exception), faut-il traiter `IOException` en appelant `s.lire()` ?
    choices:
      - {text: "Oui : le compilateur raisonne sur le type déclaré `Source`, dont `lire()` déclare `IOException`", correct: true}
      - {text: "Non : le compilateur voit que l'objet est une `SourceMemoire`, qui ne lève rien", correct: false}
      - {text: "Non : une exception déclarée par une interface n'est jamais vérifiée", correct: false}
      - {text: "Oui, mais seulement si la classe `SourceMemoire` est déclarée `final`", correct: false}
    answer: "Oui : le compilateur raisonne sur le type déclaré `Source`, dont `lire()` déclare `IOException`."
  - key: implementation
    format: course
    question: Que faire si une implémentation a besoin d'une exception vérifiée que l'interface ne déclare pas ?
    choices:
      - {text: "L'envelopper dans une exception non vérifiée, ou faire évoluer l'interface", correct: true}
      - {text: "Ajouter `throws` dans l'implémentation seulement, sans toucher l'interface", correct: false}
      - {text: "L'attraper et renvoyer `null`, pour respecter la signature de l'interface", correct: false}
      - {text: "Faire hériter l'exception vérifiée d'`Error`, que l'interface accepte", correct: false}
    answer: L'envelopper dans une exception non vérifiée (avec la cause), ou faire évoluer l'interface si tous les appelants doivent pouvoir la traiter.
  - key: vf-plus-large
    format: true-false
    question: Une redéfinition peut déclarer `throws Exception` quand le parent déclare `throws IOException`.
    truth: false
    answer: Une exception vérifiée plus large est interdite.
  - key: vf-aucune
    format: true-false
    question: Une redéfinition peut ne déclarer aucune exception, même si le parent en déclare.
    truth: true
    answer: Elle peut en lever moins.
  - key: vf-unchecked
    format: true-false
    question: Une redéfinition peut lever une `IllegalStateException` que le parent ne déclare pas.
    truth: true
    answer: Les exceptions non vérifiées ne sont pas contrôlées.
  - key: vf-sous-classe
    format: true-false
    question: Une redéfinition peut déclarer `FileNotFoundException` quand le parent déclare `IOException`.
    truth: true
    answer: C'est une sous-classe, donc plus précise.
  - key: qcm-valides
    format: multiple-choice
    question: "Le parent déclare `void m() throws IOException`. Quelles redéfinitions compilent ?"
    choices:
      - text: "`void m()`"
        correct: true
      - text: "`void m() throws FileNotFoundException`"
        correct: true
      - text: "`void m() throws IOException, IllegalStateException`"
        correct: true
      - text: "`void m() throws SQLException`"
        correct: false
    answer: '`SQLException` est une exception vérifiée nouvelle ; `IllegalStateException` est non vérifiée, donc libre.'
  - key: qcm-interface
    format: multiple-choice
    question: "L'interface déclare `String lire();` sans exception. Comment l'implémenter avec `Files.readString` ?"
    choices:
      - text: "Attraper l'`IOException` et lever une `UncheckedIOException` avec la cause"
        correct: true
      - text: "Déclarer `public String lire() throws IOException`"
        correct: false
      - text: "Attraper l'`IOException` et renvoyer `null`"
        correct: false
      - text: "Déclarer `throws Exception`"
        correct: false
    answer: Renvoyer `null` cacherait l'erreur.
  - key: qcm-appelant
    format: multiple-choice
    question: Que doit traiter l'appelant de `Source s = ...; s.lire();` si `Source.lire()` déclare `IOException` ?
    choices:
      - text: "`IOException`, quel que soit l'objet réel"
        correct: true
      - text: "Seulement les exceptions déclarées par la classe réelle"
        correct: false
      - text: "Rien"
        correct: false
      - text: "`Exception`"
        correct: false
    answer: La vérification se fait à la compilation, sur le type déclaré.
  - key: qcm-liskov
    format: multiple-choice
    question: Que révèle une sous-classe qui redéfinit une méthode en levant toujours `UnsupportedOperationException` ?
    choices:
      - {text: "Un problème de conception : elle n'est pas vraiment substituable à son parent", correct: true}
      - {text: "Une bonne pratique : elle signale clairement l'opération qu'elle ne gère pas", correct: false}
      - {text: "Une erreur de compilation : une redéfinition ne peut pas lever d'exception", correct: false}
      - {text: "Une optimisation : la JVM évite d'exécuter le code hérité du parent", correct: false}
    answer: Le code qui manipule le parent ne s'attend pas à ce refus (principe de Liskov).
  - key: code-plus-large
    format: code-output
    question: |-
      Ce code compile-t-il ?
      ```java
      class A { void m() throws IOException { } }
      class B extends A {
          @Override void m() throws Exception { }
      }
      ```
    choices:
      - {text: "Ça ne compile pas : la redéfinition élargit `IOException` en `Exception`", correct: true}
      - {text: "Oui : une redéfinition peut déclarer n'importe quelle exception", correct: false}
      - {text: "Oui, mais l'annotation `@Override` est ignorée", correct: false}
      - {text: "Oui : `Exception` est non vérifiée, donc libre", correct: false}
    answer: 'Non : `overridden method does not throw Exception`.'
    check:
      compiles: false
  - key: code-plus-precise
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class A { void m() throws IOException { } }
      class B extends A {
          @Override void m() throws FileNotFoundException { throw new FileNotFoundException("f"); }
      }
      try {
          new B().m();
      } catch (FileNotFoundException e) {
          System.out.println("introuvable " + e.getMessage());
      }
      ```
    choices:
      - {text: "`introuvable f`", correct: true}
      - {text: "`introuvable null`", correct: false}
      - {text: "`f`", correct: false}
      - {text: "Ça ne compile pas : il faut aussi attraper `IOException`", correct: false}
    answer: '`introuvable f` : via le type `B`, seule `FileNotFoundException` est à traiter.'
    check:
      output: "introuvable f"
  - key: code-unchecked
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class A { void m() { } }
      class B extends A {
          @Override void m() { throw new UnsupportedOperationException("non"); }
      }
      new B().m();
      ```
    choices:
      - {text: "Une `UnsupportedOperationException`", correct: true}
      - {text: "Ça ne compile pas : le parent ne déclare pas cette exception", correct: false}
      - {text: "Rien : la méthode du parent est appelée", correct: false}
      - {text: "Une `IllegalStateException`", correct: false}
    answer: "Une `UnsupportedOperationException` : une exception non vérifiée est permise, même si le parent ne la déclare pas."
    check:
      throws: UnsupportedOperationException
  - key: code-type-declare
    format: code-output
    question: |-
      Ce code compile-t-il ?
      ```java
      class A { void m() throws IOException { } }
      class B extends A { @Override void m() { } }
      static void appeler(A a) {
          a.m();
      }
      ```
    choices:
      - {text: "Ça ne compile pas : via le type `A`, `m()` peut lever une `IOException`", correct: true}
      - {text: "Oui : `B` ne lève rien, et c'est un `B` qu'on passera à `appeler`", correct: false}
      - {text: "Oui : `appeler` est `static`, et échappe au contrôle des exceptions", correct: false}
      - {text: "Oui, avec un simple avertissement sur l'appel à `m()`", correct: false}
    answer: 'Non : via le type `A`, `m()` peut lever une `IOException`, qu''`appeler` doit traiter.'
    check:
      compiles: false
  - key: bug-interface
    format: bug-fix
    question: |-
      Ce code ne compile pas (`overridden method does not throw IOException`). Quelle correction est la bonne ?
      ```java
      interface Gabarit { String charger(String nom); }

      class GabaritFichier implements Gabarit {
          public String charger(String nom) throws IOException {
              return Files.readString(Path.of(nom));
          }
      }
      ```
    choices:
      - {text: "Attraper l'`IOException` dans `charger` et l'envelopper dans une `UncheckedIOException`", correct: true}
      - {text: "Retirer `public` de `charger`, pour que la redéfinition puisse déclarer l'exception", correct: false}
      - {text: "Déclarer `throws Exception` au lieu de `throws IOException`, plus large", correct: false}
      - {text: "Attraper l'`IOException` et renvoyer une chaîne vide, sans lever d'exception", correct: false}
    answer: |-
      ```java
      class GabaritFichier implements Gabarit {
          public String charger(String nom) {
              try {
                  return Files.readString(Path.of(nom));
              } catch (IOException e) {
                  throw new UncheckedIOException("gabarit illisible : " + nom, e);
              }
          }
      }
      ```
      L'implémentation ne peut pas ajouter d'exception vérifiée : on l'enveloppe, avec la cause.
  - key: bug-plus-large
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      class Export { void ecrire(Path p) throws IOException { ... } }
      class ExportBase extends Export {
          @Override void ecrire(Path p) throws Exception { ... }
      }
      ```
      `ExportBase` appelle du JDBC qui lève `SQLException`. Quelle correction est la bonne ?
    choices:
      - {text: "Déclarer `throws IOException` et traduire la `SQLException` en `IOException` avec la cause", correct: true}
      - {text: "Déclarer `throws IOException, SQLException` dans la redéfinition de `ecrire`", correct: false}
      - {text: "Déclarer `throws Throwable`, qui couvre aussi la `SQLException`", correct: false}
      - {text: "Retirer `@Override`, pour que la règle sur les exceptions ne s'applique plus", correct: false}
    answer: |-
      ```java
      class ExportBase extends Export {
          @Override void ecrire(Path p) throws IOException {
              try { ... }
              catch (SQLException e) { throw new IOException("export depuis la base", e); }
          }
      }
      ```
      Une redéfinition ne peut pas élargir les exceptions vérifiées. On traduit la `SQLException` dans le type déclaré par
      le parent (ou dans une exception non vérifiée).
  - key: bug-liskov
    format: bug-fix
    question: |-
      Un `Canard` en plastique a été ajouté, et le code qui fait voler tous les oiseaux plante. Quelle correction est la bonne ?
      ```java
      class Oiseau { void voler() { ... } }
      class CanardEnPlastique extends Oiseau {
          @Override void voler() { throw new UnsupportedOperationException(); }
      }
      ```
    choices:
      - {text: "Séparer la capacité dans une interface `Volant`, que seuls les vrais volants implémentent", correct: true}
      - {text: "Attraper l'`UnsupportedOperationException` dans le code qui fait voler les oiseaux", correct: false}
      - {text: "Déclarer `throws UnsupportedOperationException` dans `Oiseau.voler()`", correct: false}
      - {text: "Lever une `IllegalStateException` à la place, plus explicite pour un canard", correct: false}
    answer: |-
      ```java
      interface Volant { void voler(); }
      class Oiseau { ... }
      class Moineau extends Oiseau implements Volant { public void voler() { ... } }
      class CanardEnPlastique { ... }   // ni Oiseau volant, ni Volant
      ```
      Une redéfinition qui refuse l'opération casse la substitution. On sépare la capacité dans une interface que seuls
      les vrais volants implémentent.
  - key: bug-null-au-lieu
    format: bug-fix
    question: |-
      Pour respecter l'interface sans exception, l'implémentation renvoie `null` en cas d'erreur. Quelle correction est la bonne ?
      ```java
      public Profil charger(String id) {
          try {
              return client.appeler(id);
          } catch (IOException e) {
              return null;
          }
      }
      ```
    choices:
      - {text: "Envelopper l'`IOException` dans une exception non vérifiée explicite, avec la cause", correct: true}
      - {text: "Renvoyer un `Profil` vide au lieu de `null`, pour éviter les NPE", correct: false}
      - {text: "Ajouter `throws IOException` à la méthode, sans toucher l'interface", correct: false}
      - {text: "Journaliser l'erreur, puis renvoyer `null` comme avant", correct: false}
    answer: |-
      ```java
      public Profil charger(String id) {
          try {
              return client.appeler(id);
          } catch (IOException e) {
              throw new ServiceProfilIndisponible(id, e);
          }
      }
      ```
      Contourner la règle en avalant l'erreur produit des `NullPointerException` plus loin. On l'enveloppe dans une
      exception non vérifiée explicite.
