notion: stack-trace
lesson: |-
  Une **pile d'appels** (*stack trace*) dit quelle exception a eu lieu, où, et par quel chemin le programme y est arrivé :

  ```
  com.boutique.CommandeInconnue: commande 42 introuvable           ← le type et le message
      at com.boutique.ServiceCommande.charger(ServiceCommande.java:31)   ← l'endroit où elle a été créée
      at com.boutique.ServiceCommande.expedier(ServiceCommande.java:18)
      at com.boutique.api.CommandeResource.expedier(CommandeResource.java:24)
      ...
  Caused by: java.sql.SQLTimeoutException: délai dépassé             ← la cause, l'exception d'origine
      at org.postgresql.jdbc.PgStatement.execute(PgStatement.java:240)
      ... 12 more
  ```

  Comment la lire :
  - la **première ligne** : le type et le message ;
  - la **première ligne `at`** : l'endroit où l'exception a été créée ; les suivantes, les appelants, du plus récent au
    plus ancien ;
  - les **`Caused by:`** : les exceptions enveloppées. La **dernière** est souvent la cause racine, à lire en premier ;
  - `... 12 more` : des lignes identiques à celles de l'exception englobante, omises.

  - Depuis Java 14, les **helpful NullPointerExceptions** disent quelle expression valait `null`
    (`Cannot invoke "Client.email()" because "commande.client" is null`).
  - Pour qu'une pile soit utile, il faut **la conserver** : envelopper avec la cause, et journaliser l'exception elle-même
    (`log.error("message", e)`), pas seulement `e.getMessage()`.
  - `e.printStackTrace()` écrit sur la sortie d'erreur, hors des journaux structurés : à éviter dans un serveur.

  **Piège classique** : `log.error("Erreur : " + e.getMessage())`. Le message est souvent `null` ou vague, et la pile,
  la seule information qui localise le problème, est perdue.

  **En entretien** : « Je lis le type et le message, la première ligne `at` de mon code, puis le dernier `Caused by` ; et
  je journalise toujours l'exception entière. »
tour:
  - title: Lire une stack trace
    text: |-
      Une exception non attrapée affiche sa **stack trace** : son type et son message, puis les appels en cours, du plus
      récent au plus ancien, chacun avec sa classe, sa méthode, son fichier et sa ligne. On la lit de haut en bas : la
      première ligne de *ton* code est souvent le bon endroit où chercher.

      Quand une exception en enveloppe une autre, la trace finit par `Caused by:` et la trace de la cause : passer la
      cause au constructeur (`new IllegalStateException("…", e)`) garde ce lien, à ne jamais perdre.
    example:
      files:
        Main.java: |-
          int convertit(String texte) {
              return Integer.parseInt(texte);
          }

          int charge(String texte) {
              try {
                  return convertit(texte);
              } catch (NumberFormatException e) {
                  throw new IllegalStateException("configuration invalide", e);
              }
          }

          void main() {
              try {
                  charge("vingt");
              } catch (IllegalStateException e) {
                  IO.println(e);
                  IO.println("  à " + e.getStackTrace()[0]);
                  IO.println("cause : " + e.getCause());
              }
          }
      output: |-
        java.lang.IllegalStateException: configuration invalide
          à Main.charge(Main.java:9)
        cause : java.lang.NumberFormatException: For input string: "vingt"
cards:
  - key: helpful-npe
    format: course
    question: Qu'est-ce qu'une helpful NPE ?
    answer: Un message de NPE qui précise quelle expression était null (Java 14+).
  - key: lire
    format: course
    question: Par quoi commencer pour lire une longue stack trace ?
    answer: Par la première ligne (type et message), puis par le dernier `Caused by` (souvent la cause racine), et par les premières lignes `at` qui appartiennent à notre propre code.
  - key: caused-by
    format: course
    question: Que signifie une section `Caused by:` ?
    answer: L'exception a été enveloppée dans une autre ; `Caused by` affiche l'exception d'origine, transmise comme cause au constructeur.
  - key: journaliser
    format: course
    question: Comment journaliser une exception sans perdre sa pile ?
    answer: En passant l'exception elle-même en dernier argument du journal (`log.error("échec de l'import {}", id, e)`), et non `e.getMessage()` seul.
  - key: vf-premiere-ligne
    format: true-false
    question: La première ligne `at` d'une stack trace indique l'endroit où l'exception a été créée.
    truth: true
    answer: Les lignes suivantes sont les appelants successifs.
  - key: vf-get-message
    format: true-false
    question: "`log.error(e.getMessage())` conserve la pile d'appels dans les journaux."
    truth: false
    answer: Seul le message est écrit ; il faut passer l'exception elle-même.
  - key: vf-more
    format: true-false
    question: "`... 12 more` signifie que douze lignes ont été perdues."
    truth: false
    answer: Ces lignes sont identiques à la fin de la pile de l'exception englobante, affichée plus haut ; elles sont seulement omises.
  - key: vf-print-stack-trace
    format: true-false
    question: "`e.printStackTrace()` est la bonne façon de journaliser une erreur dans un serveur."
    truth: false
    answer: Il écrit sur la sortie d'erreur, sans niveau, horodatage ni format structuré ; on utilise le système de journalisation.
  - key: qcm-cause-racine
    format: multiple-choice
    question: Dans une pile avec plusieurs `Caused by`, où trouve-t-on en général la cause racine ?
    choices:
      - text: "Dans le dernier `Caused by`"
        correct: true
      - text: "Dans la première ligne"
        correct: false
      - text: "Dans le premier `Caused by`"
        correct: false
      - text: "Dans la ligne `... N more`"
        correct: false
    answer: Chaque enveloppe ajoute une couche ; la dernière cause est l'erreur d'origine.
  - key: qcm-journal
    format: multiple-choice
    question: Quelle ligne journalise correctement une exception ?
    choices:
      - text: "`log.error(\"import {} échoué\", id, e);`"
        correct: true
      - text: "`log.error(\"import échoué : \" + e.getMessage());`"
        correct: false
      - text: "`log.error(e.toString());`"
        correct: false
      - text: "`System.out.println(e);`"
        correct: false
    answer: Avec SLF4J, une exception passée en dernier argument est écrite avec sa pile.
  - key: qcm-helpful
    format: multiple-choice
    question: Que dit une helpful NullPointerException ?
    choices:
      - text: "Quelle expression valait `null` et ce qu'on essayait d'en faire"
        correct: true
      - text: "Quel développeur a écrit le code"
        correct: false
      - text: "Comment corriger le code"
        correct: false
      - text: "Rien de plus qu'avant Java 14"
        correct: false
    answer: 'Par exemple : `Cannot invoke "String.length()" because "nom" is null`.'
  - key: qcm-conserver
    format: multiple-choice
    question: Comment conserver la pile d'origine en enveloppant une exception ?
    choices:
      - text: "La passer comme cause : `new ImportImpossible(fichier, e)`"
        correct: true
      - text: "Recopier son message : `new ImportImpossible(e.getMessage())`"
        correct: false
      - text: "Appeler `e.printStackTrace()` avant de lever la nouvelle"
        correct: false
      - text: "Ne rien faire, la pile est toujours conservée"
        correct: false
    answer: La cause apparaît dans la nouvelle pile sous `Caused by`.
  - key: scenario-lire-prod
    format: scenario
    question: Une erreur 500 apparaît en production avec une stack trace de 200 lignes. Comment l'analyses-tu ?
    answer: |-
      Je lis d'abord la première ligne (le type et le message), puis je descends jusqu'au dernier `Caused by`, souvent la
      vraie cause (un délai dépassé, une contrainte violée). Dans chaque section, je cherche les premières lignes `at` de
      notre package : les frames du framework ou de la bibliothèque disent le chemin, les nôtres disent où agir. Je
      recoupe avec l'identifiant de requête dans les journaux voisins, et j'essaie de reproduire le cas dans un test avant
      de corriger.
  - key: scenario-npe-sans-contexte
    format: scenario
    question: "Les journaux affichent « Erreur : null », et personne ne sait d'où vient le problème. Que fais-tu ?"
    answer: |-
      C'est le symptôme d'un `log.error("Erreur : " + e.getMessage())` : le message d'une `NullPointerException` (avant
      Java 14) ou de beaucoup d'exceptions vaut `null`, et la pile n'est pas écrite. Je cherche ces appels et je passe
      l'exception au journal (`log.error("...", e)`), avec le contexte métier (identifiant de commande). Je vérifie aussi
      que la JVM est en Java 14+ pour les messages de NPE détaillés, et je n'enlève pas les piles des journaux.
  - key: scenario-double-journalisation
    format: scenario
    question: La même exception apparaît cinq fois dans les journaux, une fois par couche. Comment corriges-tu ?
    answer: |-
      Chaque couche fait `catch`, journalise, puis relance : on obtient du bruit et une alerte multipliée. La règle :
      **journaliser ou propager, pas les deux**. Les couches intermédiaires laissent remonter (en enveloppant si besoin,
      avec la cause) ; un seul endroit journalise, le gestionnaire global (l'`ExceptionMapper` d'une API) ou le point
      d'entrée d'un traitement. Ce gestionnaire ajoute le contexte de la requête et décide du niveau du journal.
  - key: scenario-npe-sans-pile
    format: scenario
    question: Une `NullPointerException` apparaît en production avec seulement son nom, sans aucune ligne `at`. Pourquoi ?
    answer: |-
      La JVM HotSpot optimise les exceptions levées très souvent au même endroit : après de nombreuses occurrences, elle
      réutilise une instance pré-allouée sans pile (`OmitStackTraceInFastThrow`). Il faut donc chercher les premières
      occurrences dans les journaux, qui ont encore leur pile, ou relancer avec `-XX:-OmitStackTraceInFastThrow` pour
      enquêter. Le fait qu'elle se répète autant mérite aussi d'être corrigé en priorité.
  - key: bug-get-message
    format: bug-fix
    question: |-
      Les journaux disent « échec de l'import : null », sans aucune pile :
      ```java
      } catch (RuntimeException e) {
          log.error("échec de l'import : " + e.getMessage());
      }
      ```
    answer: |-
      ```java
      } catch (RuntimeException e) {
          log.error("échec de l'import du fichier {}", fichier, e);
      }
      ```
      Le message peut être `null`, et la pile n'était pas écrite. On passe l'exception au journal, avec le contexte.
  - key: bug-print-stack-trace
    format: bug-fix
    question: |-
      Les erreurs de ce service n'apparaissent pas dans l'outil de supervision :
      ```java
      } catch (IOException e) {
          e.printStackTrace();
      }
      ```
    answer: |-
      ```java
      } catch (IOException e) {
          throw new UncheckedIOException("lecture de " + chemin, e);
      }
      ```
      `printStackTrace` écrit sur la sortie d'erreur, hors des journaux structurés, et laisse le code continuer comme si
      de rien n'était. On propage (ou on journalise avec le logger si l'on traite vraiment l'erreur ici).
  - key: bug-cause-perdue
    format: bug-fix
    question: |-
      La pile ne montre que la couche service, jamais l'erreur SQL d'origine :
      ```java
      } catch (SQLException e) {
          throw new DepotIndisponible("base indisponible : " + e.getMessage());
      }
      ```
    answer: |-
      ```java
      } catch (SQLException e) {
          throw new DepotIndisponible("base indisponible", e);
      }
      ```
      Sans la cause, la section `Caused by` et la pile d'origine disparaissent. On passe l'exception au constructeur.
  - key: bug-double-journal
    format: bug-fix
    question: |-
      La même erreur apparaît trois fois dans les journaux :
      ```java
      } catch (DepotIndisponible e) {
          log.error("échec du chargement", e);
          throw e;
      }
      ```
      (Les deux couches supérieures font la même chose.)
    answer: |-
      ```java
      // aucune capture ici : l'exception remonte jusqu'au gestionnaire global, qui la journalise une fois
      Commande c = depot.charger(id);
      ```
      Journaliser puis relancer multiplie les traces. Une couche qui ne traite pas l'erreur la laisse remonter ; un seul
      endroit journalise.
