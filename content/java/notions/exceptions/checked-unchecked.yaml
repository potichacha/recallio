notion: checked-unchecked
lesson: |-
  Java distingue deux familles d'exceptions :

  | | Vérifiées (*checked*) | Non vérifiées (*unchecked*) |
  |---|---|---|
  | Classes | `Exception` sauf `RuntimeException` (`IOException`, `SQLException`) | `RuntimeException` et ses sous-classes, et les `Error` |
  | Compilateur | oblige à **attraper** ou à **déclarer** (`throws`) | n'oblige à rien |
  | Sens habituel | une condition **externe** prévisible : fichier absent, réseau coupé | une **erreur de programmation** ou une violation de contrat |

  ```java
  String lire(Path p) throws IOException {        // déclarée : l'appelant doit la gérer
      return Files.readString(p);
  }

  void verifier(int age) {
      if (age < 0) {
          throw new IllegalArgumentException("âge négatif : " + age);   // non vérifiée : rien à déclarer
      }
  }
  ```

  - Une exception vérifiée qu'on ne sait pas traiter est souvent **enveloppée** dans une non vérifiée, **avec sa
    cause** : `throw new UncheckedIOException(e);`.
  - Le compilateur refuse aussi un `catch` d'une exception vérifiée que le bloc `try` ne peut pas lever.
  - Les frameworks modernes (Spring, Quarkus) privilégient les exceptions non vérifiées et une gestion centralisée ;
    les lambdas et les streams s'accommodent mal des exceptions vérifiées.

  **Piège classique** : déclarer `throws Exception` sur toutes les méthodes pour faire taire le compilateur. On perd
  toute information sur ce qui peut vraiment échouer, et les appelants doivent attraper `Exception`.

  **En entretien** : « Vérifiée : le compilateur oblige à la traiter, pour les conditions externes ; non vérifiée : les
  erreurs de programmation. J'enveloppe une vérifiée que je ne sais pas traiter, sans perdre sa cause. »
cards:
  - key: checked-vs-unchecked
    format: course
    question: Checked vs unchecked ?
    answer: Checked = obligation de gérer, conditions externes. Unchecked = erreurs de programmation.
  - key: numberformatexception-checked
    format: course
    question: NumberFormatException est-elle checked ?
    answer: Non, c'est une sous-classe d'IllegalArgumentException, donc unchecked.
  - key: envelopper
    format: course
    question: Que faire d'une exception vérifiée qu'on ne sait pas traiter à ce niveau ?
    answer: La déclarer (`throws`) si l'appelant peut la traiter, ou l'envelopper dans une exception non vérifiée en gardant la cause (`new UncheckedIOException(e)`).
  - key: catch-impossible
    format: course
    question: Peut-on écrire `catch (IOException e)` autour d'un code qui ne lève jamais d'`IOException` ?
    answer: "Non : le compilateur refuse d'attraper une exception vérifiée que le bloc `try` ne peut pas lever."
  - key: vf-ioexception
    format: true-false
    question: Une méthode qui appelle `Files.readString` doit attraper ou déclarer `IOException`.
    truth: true
    answer: '`IOException` est vérifiée.'
  - key: vf-runtime-declarer
    format: true-false
    question: Une méthode qui lève une `IllegalArgumentException` doit la déclarer avec `throws`.
    truth: false
    answer: Une exception non vérifiée n'a pas à être déclarée (on peut la documenter avec `@throws`).
  - key: vf-throws-exception
    format: true-false
    question: Déclarer `throws Exception` partout est une bonne pratique.
    truth: false
    answer: On perd l'information sur ce qui peut échouer, et on oblige les appelants à tout attraper.
  - key: vf-error-unchecked
    format: true-false
    question: Les `Error` sont non vérifiées.
    truth: true
    answer: Le compilateur n'oblige ni à les attraper ni à les déclarer.
  - key: qcm-verifiees
    format: multiple-choice
    question: Lesquelles sont des exceptions vérifiées ?
    choices:
      - text: "`IOException`"
        correct: true
      - text: "`SQLException`"
        correct: true
      - text: "`IllegalStateException`"
        correct: false
      - text: "`ArithmeticException`"
        correct: false
    answer: Les deux dernières descendent de `RuntimeException`.
  - key: qcm-choix-type
    format: multiple-choice
    question: Une méthode reçoit un argument `null` interdit. Que lever ?
    choices:
      - text: "Une exception non vérifiée (`NullPointerException` via `Objects.requireNonNull`, ou `IllegalArgumentException`)"
        correct: true
      - text: "Une exception vérifiée déclarée dans la signature"
        correct: false
      - text: "Une `Error`"
        correct: false
      - text: "Rien, renvoyer `null`"
        correct: false
    answer: C'est une erreur de programmation de l'appelant.
  - key: qcm-envelopper
    format: multiple-choice
    question: Comment envelopper une `IOException` dans une exception non vérifiée ?
    choices:
      - text: "`throw new UncheckedIOException(\"lecture de \" + p, e);`"
        correct: true
      - text: "`throw new RuntimeException(e);`"
        correct: true
      - text: "`throw new RuntimeException(e.getMessage());`"
        correct: false
      - text: "`throw new RuntimeException();`"
        correct: false
    answer: Sans la cause, la pile d'origine est perdue.
  - key: qcm-lambdas
    format: multiple-choice
    question: Pourquoi les exceptions vérifiées sont-elles gênantes dans un stream ?
    choices:
      - text: "Les interfaces fonctionnelles comme `Function` ne déclarent aucune exception vérifiée"
        correct: true
      - text: "Les streams ignorent les exceptions"
        correct: false
      - text: "Les lambdas ne peuvent lever aucune exception"
        correct: false
      - text: "Elles ralentissent les streams"
        correct: false
    answer: Une lambda passée à `map` ne peut lever que des exceptions non vérifiées.
  - key: code-non-declaree
    format: code-output
    question: |-
      ```java
      static void lire() {
          throw new IOException("disque absent");
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `unreported exception IOException; must be caught or declared to be thrown`.'
    check:
      compiles: false
  - key: code-appelant
    format: code-output
    question: |-
      ```java
      static void lire() throws IOException { throw new IOException("x"); }
      static void appeler() { lire(); }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `appeler` doit attraper ou déclarer l''`IOException` de `lire`.'
    check:
      compiles: false
  - key: code-unchecked
    format: code-output
    question: |-
      ```java
      static void verifier(int age) {
          if (age < 0) throw new IllegalArgumentException("âge négatif");
      }
      verifier(-1);
      ```
    answer: Une `IllegalArgumentException`, sans aucune déclaration nécessaire.
    check:
      throws: IllegalArgumentException
  - key: code-catch-impossible
    format: code-output
    question: |-
      ```java
      try {
          int x = 1 + 1;
      } catch (IOException e) {
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `exception IOException is never thrown in body of corresponding try statement`.'
    check:
      compiles: false
  - key: bug-throws-exception
    format: bug-fix
    question: |-
      Toutes les couches déclarent `throws Exception`, et chaque appelant finit par attraper `Exception` :
      ```java
      public Commande charger(long id) throws Exception { ... }
      ```
    answer: |-
      ```java
      public Commande charger(long id) {   // CommandeInconnue et les erreurs techniques sont non vérifiées
          ...
      }
      ```
      `throws Exception` ne dit rien de ce qui peut échouer et contamine tous les appelants. On déclare des exceptions
      précises, ou l'on utilise des exceptions non vérifiées traitées par un gestionnaire central.
  - key: bug-cause-perdue
    format: bug-fix
    question: |-
      Les journaux disent « erreur de lecture » sans jamais montrer la cause réelle :
      ```java
      } catch (IOException e) {
          throw new RuntimeException("erreur de lecture");
      }
      ```
    answer: |-
      ```java
      } catch (IOException e) {
          throw new UncheckedIOException("erreur de lecture de " + chemin, e);
      }
      ```
      Sans la cause, la pile et le message d'origine (fichier absent ? droits ?) sont perdus. On l'enveloppe en la
      passant au constructeur.
  - key: bug-checked-programmation
    format: bug-fix
    question: |-
      Tous les appelants doivent attraper une exception qui ne peut arriver que par erreur de programmation :
      ```java
      class ArgumentNulException extends Exception { }

      void enregistrer(Client c) throws ArgumentNulException {
          if (c == null) throw new ArgumentNulException();
      }
      ```
    answer: |-
      ```java
      void enregistrer(Client c) {
          Objects.requireNonNull(c, "client");
      }
      ```
      Un argument `null` est une erreur de l'appelant, à corriger dans son code : une exception non vérifiée suffit, et
      n'alourdit pas toutes les signatures.
  - key: bug-avaler-checked
    format: bug-fix
    question: |-
      Pour satisfaire le compilateur, l'exception est avalée :
      ```java
      try {
          Files.writeString(chemin, contenu);
      } catch (IOException e) {
          e.printStackTrace();
      }
      ```
      L'appelant croit que la sauvegarde a réussi.
    answer: |-
      ```java
      try {
          Files.writeString(chemin, contenu);
      } catch (IOException e) {
          throw new UncheckedIOException("sauvegarde impossible : " + chemin, e);
      }
      ```
      Afficher la pile ne prévient pas l'appelant. Si on ne sait pas traiter l'erreur ici, on la propage (déclarée ou
      enveloppée).
  - key: checked-unchecked-es-bord
    format: scenario
    question: Checked ou unchecked, tu es de quel bord ?
    answer: |-
      Les deux ont une logique. Les checked forcent l'appelant à traiter le cas, ce qui est vertueux sur le papier.
      Mais en pratique elles alourdissent les signatures, se propagent en cascade jusqu'à polluer des couches qui n'ont rien à voir, et finissent souvent enveloppées, ou pire, avalées, ce qui va exactement à l'encontre de l'intention.
      La tendance moderne, celle de Spring et Quarkus, privilégie les unchecked avec une gestion centralisée. C'est l'approche que je suis : des exceptions métier unchecked, un handler global, et un compilateur qui ne pollue pas chaque signature.
      Ce qui compte au fond, ce n'est pas qu'une erreur soit **déclarée** partout, c'est qu'elle soit **visible et traitée** quelque part.
  - key: scenario-bibliotheque
    format: scenario
    question: Tu écris une bibliothèque publique de lecture de fichiers. Exceptions vérifiées ou non ?
    answer: |-
      Pour une bibliothèque, l'argument des exceptions vérifiées est plus fort : l'appelant peut raisonnablement réagir
      à un fichier absent (demander un autre chemin), et la signature le prévient. Je déclarerais `IOException` (ou une
      sous-classe précise) sur les méthodes d'entrée-sortie, comme le fait `java.nio.file.Files`, et des exceptions non
      vérifiées pour les erreurs d'usage (argument `null`). Je proposerais aussi, si c'est utile, des variantes qui
      enveloppent (`UncheckedIOException`) pour l'usage dans les streams.
  - key: scenario-stream-io
    format: scenario
    question: Tu dois lire une liste de fichiers dans un stream, et `Files.readString` lève une `IOException`. Comment fais-tu ?
    answer: |-
      La lambda de `map` ne peut pas lever d'exception vérifiée. J'extrais une méthode qui enveloppe :
      `String lire(Path p) { try { return Files.readString(p); } catch (IOException e) { throw new UncheckedIOException(e); } }`,
      puis `chemins.stream().map(this::lire)`. Si une erreur sur un fichier ne doit pas tout arrêter, je renvoie plutôt
      un résultat qui porte le succès ou l'échec (un record ou un `Optional`) et je regroupe les échecs pour les signaler.
      Pour quelques fichiers, une boucle `for` classique est souvent plus lisible.
  - key: scenario-api-rest
    format: scenario
    question: Comment les exceptions vérifiées et non vérifiées se traduisent-elles dans une API REST ?
    answer: |-
      Les erreurs techniques vérifiées (I/O, base) sont enveloppées au plus près, dans l'infrastructure, en exceptions
      non vérifiées qui ne fuient pas dans le domaine. Le domaine lève des exceptions métier non vérifiées
      (`CommandeInconnue`, `SoldeInsuffisant`). Un `ExceptionMapper` global traduit chaque type en réponse : 404, 409,
      422 pour le métier, 500 pour le technique (journalisée avec sa pile), au format Problem Details. Les signatures
      restent propres, et aucune erreur n'est avalée.
