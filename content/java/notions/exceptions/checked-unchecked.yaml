notion: checked-unchecked
lesson: |-
  Java distingue deux familles d'exceptions :

  | | Vérifiées (*checked*) | Non vérifiées (*unchecked*) |
  |---|---|---|
  | Classes | `Exception` sauf `RuntimeException` (`IOException`, `SQLException`) | `RuntimeException` et ses sous-classes, et les `Error` |
  | Compilateur | oblige à **attraper** ou à **déclarer** (`throws`) | n'oblige à rien |
  | Sens habituel | une condition **externe** prévisible : fichier absent, réseau coupé | une **erreur de programmation** ou une violation de contrat |

  ```java
  String lire(Path p) throws IOException {        // déclarée : l'appelant doit la gérer
      return Files.readString(p);
  }

  void verifier(int age) {
      if (age < 0) {
          throw new IllegalArgumentException("âge négatif : " + age);   // non vérifiée : rien à déclarer
      }
  }
  ```

  - Une exception vérifiée qu'on ne sait pas traiter est souvent **enveloppée** dans une non vérifiée, **avec sa
    cause** : `throw new UncheckedIOException(e);`.
  - Le compilateur refuse aussi un `catch` d'une exception vérifiée que le bloc `try` ne peut pas lever.
  - Les frameworks modernes (Spring, Quarkus) privilégient les exceptions non vérifiées et une gestion centralisée ;
    les lambdas et les streams s'accommodent mal des exceptions vérifiées.

  **Piège classique** : déclarer `throws Exception` sur toutes les méthodes pour faire taire le compilateur. On perd
  toute information sur ce qui peut vraiment échouer, et les appelants doivent attraper `Exception`.

  **En entretien** : « Vérifiée : le compilateur oblige à la traiter, pour les conditions externes ; non vérifiée : les
  erreurs de programmation. J'enveloppe une vérifiée que je ne sais pas traiter, sans perdre sa cause. »
tour:
  - title: Vérifiées ou non
    text: |-
      Java distingue deux sortes d'exceptions :

      - les exceptions **vérifiées** (*checked*), sous-classes d'`Exception` hors `RuntimeException`, comme
      `IOException` : le compilateur oblige à les traiter (`catch`) ou à les déclarer (`throws`) ; - les exceptions
      **non vérifiées**, `RuntimeException` et ses sous-classes : elles signalent souvent un bug, et le compilateur ne
      demande rien.

      On choisit une exception vérifiée quand l'appelant peut raisonnablement réagir, comme à un fichier manquant ; une
      non vérifiée pour une erreur de programmation.
    example:
      files:
        Main.java: |-
          String lit(String chemin) throws IOException {
              if (chemin.isEmpty()) {
                  throw new IOException("chemin vide");
              }
              return "contenu de " + chemin;
          }

          int racine(int n) {
              if (n < 0) {
                  throw new IllegalArgumentException("nombre négatif : " + n);
              }
              return (int) Math.sqrt(n);
          }

          void main() {
              try {
                  IO.println(lit("notes.txt"));
                  IO.println(lit(""));
              } catch (IOException e) {
                  IO.println("vérifiée : " + e.getMessage());
              }
              try {
                  racine(-4);
              } catch (IllegalArgumentException e) {
                  IO.println("non vérifiée : " + e.getMessage());
              }
          }
      output: |-
        contenu de notes.txt
        vérifiée : chemin vide
        non vérifiée : nombre négatif : -4
cards:
  - key: checked-vs-unchecked
    format: course
    question: "Quelle différence entre exceptions vérifiées (checked) et non vérifiées (unchecked) ?"
    choices:
      - {text: "Les vérifiées doivent être traitées ou déclarées (conditions externes) ; les autres signalent des bugs", correct: true}
      - {text: "Les non vérifiées doivent être traitées ou déclarées ; le compilateur ignore les vérifiées", correct: false}
      - {text: "Les vérifiées sont contrôlées à l'exécution par la JVM ; les autres ne sont jamais contrôlées", correct: false}
      - {text: "Les vérifiées héritent de `RuntimeException` ; les non vérifiées, directement d'`Exception`", correct: false}
    answer: "Une exception vérifiée doit être attrapée ou déclarée : elle décrit une condition externe (fichier absent, réseau). Une non vérifiée (`RuntimeException`) signale une erreur de programmation. C'est `RuntimeException` qui marque les non vérifiées."
  - key: numberformatexception-checked
    format: course
    question: "`NumberFormatException` est-elle une exception vérifiée ?"
    choices:
      - {text: "Non : elle hérite d'`IllegalArgumentException`, donc de `RuntimeException`", correct: true}
      - {text: "Oui : elle hérite d'`IOException`, comme toutes les erreurs de lecture", correct: false}
      - {text: "Oui : toute exception de la bibliothèque standard est vérifiée", correct: false}
      - {text: "Non : c'est une `Error`, comme `StackOverflowError`", correct: false}
    answer: Non, c'est une sous-classe d'IllegalArgumentException, donc unchecked.
  - key: envelopper
    format: course
    question: Que faire d'une exception vérifiée qu'on ne sait pas traiter à ce niveau ?
    choices:
      - {text: "La déclarer si l'appelant peut la traiter, sinon l'envelopper avec sa cause", correct: true}
      - {text: "L'attraper et l'afficher avec `e.printStackTrace()`, pour satisfaire le compilateur", correct: false}
      - {text: "L'attraper et renvoyer `null`, pour que l'appelant teste le résultat", correct: false}
      - {text: "L'envelopper avec `new RuntimeException(e.getMessage())`, sans la cause", correct: false}
    answer: La déclarer (`throws`) si l'appelant peut la traiter, ou l'envelopper dans une exception non vérifiée en gardant la cause (`new UncheckedIOException(e)`).
  - key: catch-impossible
    format: course
    question: Peut-on écrire `catch (IOException e)` autour d'un code qui ne lève jamais d'`IOException` ?
    choices:
      - {text: "Non : le compilateur refuse d'attraper une exception vérifiée que le `try` ne peut pas lever", correct: true}
      - {text: "Oui : le bloc `catch` est simplement ignoré à l'exécution", correct: false}
      - {text: "Oui, mais le compilateur affiche un avertissement sur le bloc inutile", correct: false}
      - {text: "Non : on ne peut jamais attraper `IOException` directement, seulement `Exception`", correct: false}
    answer: "Non : le compilateur refuse d'attraper une exception vérifiée que le bloc `try` ne peut pas lever."
  - key: vf-ioexception
    format: true-false
    question: Une méthode qui appelle `Files.readString` doit attraper ou déclarer `IOException`.
    truth: true
    answer: '`IOException` est vérifiée.'
  - key: vf-runtime-declarer
    format: true-false
    question: Une méthode qui lève une `IllegalArgumentException` doit la déclarer avec `throws`.
    truth: false
    answer: Une exception non vérifiée n'a pas à être déclarée (on peut la documenter avec `@throws`).
  - key: vf-throws-exception
    format: true-false
    question: Déclarer `throws Exception` partout est une bonne pratique.
    truth: false
    answer: On perd l'information sur ce qui peut échouer, et on oblige les appelants à tout attraper.
  - key: vf-error-unchecked
    format: true-false
    question: Les `Error` sont non vérifiées.
    truth: true
    answer: Le compilateur n'oblige ni à les attraper ni à les déclarer.
  - key: qcm-verifiees
    format: multiple-choice
    question: Lesquelles sont des exceptions vérifiées ?
    choices:
      - text: "`IOException`"
        correct: true
      - text: "`SQLException`"
        correct: true
      - text: "`IllegalStateException`"
        correct: false
      - text: "`ArithmeticException`"
        correct: false
    answer: Les deux dernières descendent de `RuntimeException`.
  - key: qcm-choix-type
    format: multiple-choice
    question: Une méthode reçoit un argument `null` interdit. Que lever ?
    choices:
      - {text: "Une exception non vérifiée (`NullPointerException` via `Objects.requireNonNull`, ou `IllegalArgumentException`)", correct: true}
      - {text: "Une exception vérifiée déclarée dans la signature, que chaque appelant devra attraper ou déclarer à son tour", correct: false}
      - {text: "Une `Error`, comme `AssertionError`, puisque l'appelant ne doit jamais pouvoir rattraper ce genre de faute", correct: false}
      - {text: "Rien : renvoyer `null` tout de suite, et laisser l'appelant vérifier le résultat avant de s'en servir", correct: false}
    answer: C'est une erreur de programmation de l'appelant.
  - key: qcm-envelopper
    format: multiple-choice
    question: "Laquelle de ces instructions enveloppe une `IOException` dans une exception non vérifiée en gardant sa cause ?"
    choices:
      - {text: "`throw new UncheckedIOException(\"lecture de \" + p, e);`", correct: true}
      - {text: "`throw new RuntimeException(e.getMessage());`", correct: false}
      - {text: "`throw new RuntimeException(e.toString());`", correct: false}
      - {text: "`throw new RuntimeException();`", correct: false}
    answer: "`UncheckedIOException` (comme `new RuntimeException(e)`) reçoit l'exception elle-même comme cause. Avec son message, son texte ou rien du tout, la pile d'origine est perdue."
  - key: qcm-lambdas
    format: multiple-choice
    question: Pourquoi les exceptions vérifiées sont-elles gênantes dans un stream ?
    choices:
      - {text: "Les interfaces fonctionnelles comme `Function` ne déclarent aucune exception vérifiée", correct: true}
      - {text: "Les streams attrapent et ignorent en silence toutes les exceptions des lambdas", correct: false}
      - {text: "Les lambdas ne peuvent lever aucune exception, vérifiée ou non, par construction", correct: false}
      - {text: "Elles ralentissent les streams, car chaque élément ouvre un bloc `try` caché", correct: false}
    answer: Une lambda passée à `map` ne peut lever que des exceptions non vérifiées.
  - key: code-non-declaree
    format: code-output
    question: |-
      Ce code compile-t-il ?
      ```java
      static void lire() {
          throw new IOException("disque absent");
      }
      ```
    choices:
      - {text: "Ça ne compile pas : l'`IOException` n'est ni attrapée ni déclarée", correct: true}
      - {text: "Oui : l'exception est levée à l'exécution, sans contrôle préalable", correct: false}
      - {text: "Oui, avec un simple avertissement sur l'exception non déclarée", correct: false}
      - {text: "Oui, car une méthode `static` peut lever ce qu'elle veut", correct: false}
    answer: 'Non : `unreported exception IOException; must be caught or declared to be thrown`.'
    check:
      compiles: false
  - key: code-appelant
    format: code-output
    question: |-
      Ce code compile-t-il ?
      ```java
      static void lire() throws IOException { throw new IOException("x"); }
      static void appeler() { lire(); }
      ```
    choices:
      - {text: "Ça ne compile pas : `appeler` doit attraper ou déclarer l'`IOException`", correct: true}
      - {text: "Oui : `lire` déclare déjà l'exception, ce qui suffit à ses appelants", correct: false}
      - {text: "Oui, mais `appeler` lève une `IOException` non déclarée à l'exécution", correct: false}
      - {text: "Oui, avec un simple avertissement sur l'appel à `lire()`", correct: false}
    answer: 'Non : `appeler` doit attraper ou déclarer l''`IOException` de `lire`.'
    check:
      compiles: false
  - key: code-unchecked
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void verifier(int age) {
          if (age < 0) throw new IllegalArgumentException("âge négatif");
      }
      verifier(-1);
      ```
    choices:
      - {text: "Une `IllegalArgumentException`", correct: true}
      - {text: "Rien : le code ne peut pas être lancé, il manque `throws IllegalArgumentException`", correct: false}
      - {text: "Rien : sans `throws`, l'exception est ignorée", correct: false}
      - {text: "Une `IllegalStateException`", correct: false}
    answer: Une `IllegalArgumentException`, sans aucune déclaration nécessaire.
    check:
      throws: IllegalArgumentException
  - key: code-catch-impossible
    format: code-output
    question: |-
      Ce code compile-t-il ?
      ```java
      try {
          int x = 1 + 1;
      } catch (IOException e) {
      }
      ```
    choices:
      - {text: "Ça ne compile pas : le `try` ne peut jamais lever d'`IOException`", correct: true}
      - {text: "Oui : le `catch` est simplement inutile", correct: false}
      - {text: "Oui, avec un avertissement sur le `catch` vide", correct: false}
      - {text: "Oui : une `IOException` peut toujours survenir", correct: false}
    answer: 'Non : `exception IOException is never thrown in body of corresponding try statement`.'
    check:
      compiles: false
  - key: bug-throws-exception
    format: bug-fix
    question: |-
      Toutes les couches déclarent `throws Exception`, et chaque appelant finit par attraper `Exception`. Quelle correction est la bonne ?
      ```java
      public Commande charger(long id) throws Exception { ... }
      ```
    choices:
      - {text: "Déclarer des exceptions précises, ou non vérifiées, traitées par un gestionnaire central", correct: true}
      - {text: "Déclarer `throws Throwable`, plus complet que `throws Exception`", correct: false}
      - {text: "Attraper `Exception` dans `charger` et renvoyer `null` à la place", correct: false}
      - {text: "Ajouter `throws Exception` à `main`, pour que tout remonte jusque-là", correct: false}
    answer: |-
      ```java
      public Commande charger(long id) {   // CommandeInconnue et les erreurs techniques sont non vérifiées
          ...
      }
      ```
      `throws Exception` ne dit rien de ce qui peut échouer et contamine tous les appelants. On déclare des exceptions
      précises, ou l'on utilise des exceptions non vérifiées traitées par un gestionnaire central.
  - key: bug-cause-perdue
    format: bug-fix
    question: |-
      Les journaux disent « erreur de lecture » sans jamais montrer la cause réelle. Quelle correction est la bonne ?
      ```java
      } catch (IOException e) {
          throw new RuntimeException("erreur de lecture");
      }
      ```
    choices:
      - {text: "Passer `e` comme cause : `new UncheckedIOException(\"erreur de lecture de \" + chemin, e)`", correct: true}
      - {text: "Ajouter `e.getMessage()` au message de la `RuntimeException`", correct: false}
      - {text: "Appeler `e.printStackTrace()` juste avant de lever la `RuntimeException`", correct: false}
      - {text: "Lever une `Error` à la place de la `RuntimeException`", correct: false}
    answer: |-
      ```java
      } catch (IOException e) {
          throw new UncheckedIOException("erreur de lecture de " + chemin, e);
      }
      ```
      Sans la cause, la pile et le message d'origine (fichier absent ? droits ?) sont perdus. On l'enveloppe en la
      passant au constructeur.
  - key: bug-checked-programmation
    format: bug-fix
    question: |-
      Tous les appelants doivent attraper une exception qui ne peut arriver que par erreur de programmation. Quelle correction est la bonne ?
      ```java
      class ArgumentNulException extends Exception { }

      void enregistrer(Client c) throws ArgumentNulException {
          if (c == null) throw new ArgumentNulException();
      }
      ```
    choices:
      - {text: "`Objects.requireNonNull(c, \"client\")` : une exception non vérifiée suffit", correct: true}
      - {text: "Faire hériter `ArgumentNulException` d'`Error` plutôt que d'`Exception`", correct: false}
      - {text: "Ignorer le `null` et ne rien enregistrer, sans aucune exception", correct: false}
      - {text: "Déclarer `throws Exception` à la place, plus général et plus simple", correct: false}
    answer: |-
      ```java
      void enregistrer(Client c) {
          Objects.requireNonNull(c, "client");
      }
      ```
      Un argument `null` est une erreur de l'appelant, à corriger dans son code : une exception non vérifiée suffit, et
      n'alourdit pas toutes les signatures.
  - key: bug-avaler-checked
    format: bug-fix
    question: |-
      Pour satisfaire le compilateur, l'exception est avalée :
      ```java
      try {
          Files.writeString(chemin, contenu);
      } catch (IOException e) {
          e.printStackTrace();
      }
      ```
      L'appelant croit que la sauvegarde a réussi. Quelle correction est la bonne ?
    choices:
      - {text: "Envelopper dans une `UncheckedIOException` avec la cause, ou déclarer `throws IOException`", correct: true}
      - {text: "Remplacer `e.printStackTrace()` par `System.err.println(e.getMessage())`", correct: false}
      - {text: "Ajouter un `return` dans le `catch`, pour sortir proprement de la méthode", correct: false}
      - {text: "Attraper `Exception` au lieu d'`IOException`, pour couvrir tous les cas", correct: false}
    answer: |-
      ```java
      try {
          Files.writeString(chemin, contenu);
      } catch (IOException e) {
          throw new UncheckedIOException("sauvegarde impossible : " + chemin, e);
      }
      ```
      Afficher la pile ne prévient pas l'appelant. Si on ne sait pas traiter l'erreur ici, on la propage (déclarée ou
      enveloppée).
  - key: checked-unchecked-es-bord
    format: scenario
    question: Checked ou unchecked, tu es de quel bord ?
    choices:
      - {text: "Plutôt des exceptions non vérifiées, avec un gestionnaire global : l'erreur doit être visible et traitée", correct: true}
      - {text: "Toujours des exceptions vérifiées, déclarées dans chaque signature, pour que rien n'échappe au compilateur", correct: false}
      - {text: "Aucune des deux : des codes d'erreur renvoyés par chaque méthode, et testés par chaque appelant", correct: false}
      - {text: "Des exceptions vérifiées partout, mais attrapées et ignorées dès qu'elles gênent la compilation", correct: false}
    answer: |-
      Les deux ont une logique. Les checked forcent l'appelant à traiter le cas, ce qui est vertueux sur le papier.
      Mais en pratique elles alourdissent les signatures, se propagent en cascade jusqu'à polluer des couches qui n'ont rien à voir, et finissent souvent enveloppées, ou pire, avalées, ce qui va exactement à l'encontre de l'intention.
      La tendance moderne, celle de Spring et Quarkus, privilégie les unchecked avec une gestion centralisée. C'est l'approche que je suis : des exceptions métier unchecked, un handler global, et un compilateur qui ne pollue pas chaque signature.
      Ce qui compte au fond, ce n'est pas qu'une erreur soit **déclarée** partout, c'est qu'elle soit **visible et traitée** quelque part.
  - key: scenario-bibliotheque
    format: scenario
    question: Tu écris une bibliothèque publique de lecture de fichiers. Exceptions vérifiées ou non ?
    choices:
      - {text: "`IOException` (ou une sous-classe) déclarée sur les entrées-sorties, non vérifiées pour les erreurs d'usage", correct: true}
      - {text: "Uniquement des exceptions non vérifiées, pour ne jamais forcer l'appelant à traiter un fichier absent", correct: false}
      - {text: "Une exception vérifiée pour tout, y compris pour un argument `null` passé par erreur à la bibliothèque", correct: false}
      - {text: "Aucune exception : chaque méthode renvoie `null` quand le fichier est absent ou illisible", correct: false}
    answer: |-
      Pour une bibliothèque, l'argument des exceptions vérifiées est plus fort : l'appelant peut raisonnablement réagir
      à un fichier absent (demander un autre chemin), et la signature le prévient. Je déclarerais `IOException` (ou une
      sous-classe précise) sur les méthodes d'entrée-sortie, comme le fait `java.nio.file.Files`, et des exceptions non
      vérifiées pour les erreurs d'usage (argument `null`). Je proposerais aussi, si c'est utile, des variantes qui
      enveloppent (`UncheckedIOException`) pour l'usage dans les streams.
  - key: scenario-stream-io
    format: scenario
    question: Tu dois lire une liste de fichiers dans un stream, et `Files.readString` lève une `IOException`. Comment fais-tu ?
    choices:
      - {text: "Extraire une méthode qui enveloppe l'`IOException` dans une `UncheckedIOException`", correct: true}
      - {text: "Déclarer `throws IOException` sur la lambda passée à `map`", correct: false}
      - {text: "Attraper l'`IOException` dans la lambda et renvoyer une chaîne vide", correct: false}
      - {text: "Ajouter `throws IOException` à la méthode qui appelle `stream()`, ce qui suffit", correct: false}
    answer: |-
      La lambda de `map` ne peut pas lever d'exception vérifiée. J'extrais une méthode qui enveloppe :
      `String lire(Path p) { try { return Files.readString(p); } catch (IOException e) { throw new UncheckedIOException(e); } }`,
      puis `chemins.stream().map(this::lire)`. Si une erreur sur un fichier ne doit pas tout arrêter, je renvoie plutôt
      un résultat qui porte le succès ou l'échec (un record ou un `Optional`) et je regroupe les échecs pour les signaler.
      Pour quelques fichiers, une boucle `for` classique est souvent plus lisible.
  - key: scenario-api-rest
    format: scenario
    question: Comment les exceptions vérifiées et non vérifiées se traduisent-elles dans une API REST ?
    choices:
      - {text: "Techniques enveloppées dans l'infrastructure, métier non vérifiées, un `ExceptionMapper` vers 404, 409 ou 500", correct: true}
      - {text: "Toutes déclarées vérifiées jusqu'au contrôleur, qui les attrape une à une et renvoie toujours 400", correct: false}
      - {text: "Toutes enveloppées dans `RuntimeException`, que le framework traduit toutes en 500 avec la pile", correct: false}
      - {text: "Les vérifiées en 4xx et les non vérifiées en 5xx, d'après leur seul type, sans regarder le métier", correct: false}
    answer: |-
      Les erreurs techniques vérifiées (I/O, base) sont enveloppées au plus près, dans l'infrastructure, en exceptions
      non vérifiées qui ne fuient pas dans le domaine. Le domaine lève des exceptions métier non vérifiées
      (`CommandeInconnue`, `SoldeInsuffisant`). Un `ExceptionMapper` global traduit chaque type en réponse : 404, 409,
      422 pour le métier, 500 pour le technique (journalisée avec sa pile), au format Problem Details. Les signatures
      restent propres, et aucune erreur n'est avalée.
