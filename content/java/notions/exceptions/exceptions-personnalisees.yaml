notion: exceptions-personnalisees
lesson: |-
  Une **exception personnalisée** nomme une erreur du domaine et porte les informations utiles pour la traiter :

  ```java
  public class SoldeInsuffisant extends RuntimeException {
      private final BigDecimal solde;
      private final BigDecimal montant;

      public SoldeInsuffisant(BigDecimal solde, BigDecimal montant) {
          super("solde " + solde + " insuffisant pour retirer " + montant);   // un message utile
          this.solde = solde;
          this.montant = montant;
      }

      public BigDecimal manque() { return montant.subtract(solde); }      // des données exploitables
  }
  ```

  - **Le nom dit l'erreur** : `CommandeInconnue`, `StockEpuise`, plutôt qu'une `RuntimeException("erreur")`. Le code
    appelant peut l'attraper précisément, et un gestionnaire global la traduire (404, 409, 422).
  - On étend en général **`RuntimeException`** pour une erreur métier ; `Exception` si l'on veut forcer l'appelant à la
    traiter.
  - On transmet le **message** (et la **cause** quand on enveloppe une autre exception) au constructeur parent avec
    `super(message, cause)`.
  - Des **champs** portent les données (l'identifiant, les montants), pour le code, sans avoir à analyser le message.
  - Une petite **hiérarchie** (`ErreurMetier` ← `CommandeInconnue`, `StockEpuise`) permet de traiter toute une famille
    d'un coup.
  - Les exceptions de la JDK suffisent souvent pour les erreurs de programmation : `IllegalArgumentException`,
    `IllegalStateException`, `UnsupportedOperationException`.

  **Piège classique** : une classe `MonException` sans message ni données, levée partout. Elle ne dit ni ce qui s'est
  passé, ni comment réagir.

  **En entretien** : « Je crée une exception métier quand l'erreur a un sens pour le domaine : un nom explicite, un
  message utile, des champs exploitables et la cause d'origine. »
cards:
  - key: quand-creer
    format: course
    question: Quand créer sa propre exception plutôt qu'utiliser celles de la JDK ?
    answer: Quand l'erreur a un sens métier que l'appelant peut traiter ou qu'un gestionnaire doit traduire (`CommandeInconnue` en 404) ; pour une erreur de programmation, `IllegalArgumentException` ou `IllegalStateException` suffisent.
  - key: parent
    format: course
    question: De quelle classe faire hériter une exception métier ?
    answer: En général de `RuntimeException`, pour ne pas alourdir les signatures ; d'`Exception` si l'on veut obliger l'appelant à la traiter.
  - key: champs
    format: course
    question: Pourquoi ajouter des champs à une exception ?
    answer: Pour que le code qui la traite dispose des données (un identifiant, un montant) sans analyser le message, et puisse construire une réponse précise.
  - key: constructeurs
    format: course
    question: Quels constructeurs prévoir pour une exception qui en enveloppe une autre ?
    answer: Un constructeur qui reçoit la cause et la transmet à `super(message, cause)`, pour conserver la pile d'origine.
  - key: vf-runtime
    format: true-false
    question: Une exception métier qui étend `RuntimeException` n'a pas à être déclarée dans les signatures.
    truth: true
    answer: Elle est non vérifiée.
  - key: vf-nom
    format: true-false
    question: Le nom d'une exception personnalisée devrait décrire l'erreur, comme `CommandeInconnue`.
    truth: true
    answer: Le nom suffit souvent à comprendre ce qui s'est passé.
  - key: vf-message-parser
    format: true-false
    question: Le code qui attrape une exception devrait extraire les informations utiles de son message.
    truth: false
    answer: Le message est pour les humains ; les données passent par des champs et des accesseurs.
  - key: vf-hierarchie
    format: true-false
    question: Une hiérarchie d'exceptions permet d'attraper toute une famille d'erreurs avec un seul `catch`.
    truth: true
    answer: '`catch (ErreurMetier e)` attrape toutes ses sous-classes.'
  - key: qcm-bonne
    format: multiple-choice
    question: Quelle exception est la mieux conçue ?
    choices:
      - text: "`class StockEpuise extends RuntimeException` avec le produit et la quantité demandée"
        correct: true
      - text: "`class MonException extends Exception` sans message"
        correct: false
      - text: "`class Erreur extends Throwable`"
        correct: false
      - text: "`throw new RuntimeException(\"stock\")` partout"
        correct: false
    answer: Un nom explicite, le bon parent, des données utiles.
  - key: qcm-jdk
    format: multiple-choice
    question: Pour quelles erreurs une exception de la JDK suffit-elle ?
    choices:
      - text: "Un argument `null` interdit (`NullPointerException`, `IllegalArgumentException`)"
        correct: true
      - text: "Une opération appelée dans un mauvais état (`IllegalStateException`)"
        correct: true
      - text: "Une commande introuvable, que l'API doit traduire en 404"
        correct: false
      - text: "Un solde insuffisant, à expliquer à l'utilisateur"
        correct: false
    answer: Les deux derniers sont des erreurs métier, qui gagnent à avoir leur propre type.
  - key: qcm-super
    format: multiple-choice
    question: Comment transmettre le message au constructeur parent ?
    choices:
      - text: "`super(\"commande \" + id + \" introuvable\");`"
        correct: true
      - text: "`this.message = \"commande introuvable\";`"
        correct: false
      - text: "`setMessage(\"commande introuvable\");`"
        correct: false
      - text: "`return \"commande introuvable\";`"
        correct: false
    answer: '`getMessage()` renvoie le message passé au constructeur de `Throwable`.'
  - key: qcm-traduire
    format: multiple-choice
    question: Comment une API REST traduit-elle une `CommandeInconnue` en réponse 404 ?
    choices:
      - text: "Avec un gestionnaire global (`ExceptionMapper`, `@ControllerAdvice`) qui associe le type au statut"
        correct: true
      - text: "Avec un `try/catch` dans chaque méthode de ressource"
        correct: false
      - text: "En analysant le message de l'exception"
        correct: false
      - text: "En laissant le serveur renvoyer une erreur 500"
        correct: false
    answer: La traduction est centralisée en un seul endroit.
  - key: trous-extends
    format: fill-in
    question: |-
      Complétez pour créer une exception métier non vérifiée :
      ```java
      public class CommandeInconnue extends ___ {
          public CommandeInconnue(long id) {
              super("commande " + id + " introuvable");
          }
      }
      ```
    blanks: [[RuntimeException]]
    answer: Une exception non vérifiée n'alourdit pas les signatures.
  - key: trous-super-message
    format: fill-in
    question: |-
      Complétez pour transmettre le message :
      ```java
      public StockEpuise(String produit) {
          ___("stock épuisé : " + produit);
      }
      ```
    blanks: [[super]]
    answer: Le message est rangé par le constructeur de `Throwable`.
  - key: trous-cause
    format: fill-in
    question: |-
      Complétez pour garder l'exception d'origine :
      ```java
      public ImportImpossible(Path fichier, Throwable cause) {
          super("import impossible : " + fichier, ___);
      }
      ```
    blanks: [[cause]]
    answer: La cause apparaîtra sous `Caused by:` dans la pile.
  - key: trous-champ
    format: fill-in
    question: |-
      Complétez l'accesseur qui expose l'identifiant :
      ```java
      private final long idCommande;
      public long ___() { return idCommande; }
      ```
    blanks: [[idCommande]]
    answer: Un accesseur expose la donnée au gestionnaire d'erreurs.
  - key: code-champs
    format: code-output
    question: |-
      ```java
      class SoldeInsuffisant extends RuntimeException {
          private final double manque;
          SoldeInsuffisant(double solde, double montant) {
              super("solde " + solde + " insuffisant pour " + montant);
              this.manque = montant - solde;
          }
          double manque() { return manque; }
      }
      try {
          throw new SoldeInsuffisant(20, 50);
      } catch (SoldeInsuffisant e) {
          System.out.println(e.getMessage() + " / manque " + e.manque());
      }
      ```
    answer: '`solde 20.0 insuffisant pour 50.0 / manque 30.0`.'
    check:
      output: "solde 20.0 insuffisant pour 50.0 / manque 30.0"
  - key: code-hierarchie
    format: code-output
    question: |-
      ```java
      class ErreurMetier extends RuntimeException { ErreurMetier(String m) { super(m); } }
      class CommandeInconnue extends ErreurMetier {
          CommandeInconnue(long id) { super("commande " + id + " introuvable"); }
      }
      try {
          throw new CommandeInconnue(42);
      } catch (ErreurMetier e) {
          System.out.println(e.getClass().getSimpleName() + ": " + e.getMessage());
      }
      ```
    answer: '`CommandeInconnue: commande 42 introuvable` : le `catch` de la classe parente attrape la sous-classe.'
    check:
      output: "CommandeInconnue: commande 42 introuvable"
  - key: code-checked
    format: code-output
    question: |-
      ```java
      class ImportImpossible extends Exception { }
      static void importer() {
          throw new ImportImpossible();
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : une sous-classe d''`Exception` (hors `RuntimeException`) est vérifiée et doit être déclarée.'
    check:
      compiles: false
  - key: code-cause
    format: code-output
    question: |-
      ```java
      class ExportImpossible extends RuntimeException {
          ExportImpossible(String m, Throwable cause) { super(m, cause); }
      }
      var e = new ExportImpossible("export", new IOException("disque plein"));
      System.out.println(e.getMessage() + " <- " + e.getCause().getMessage());
      ```
    answer: '`export <- disque plein` : la cause est conservée.'
    check:
      output: "export <- disque plein"
  - key: bug-generique
    format: bug-fix
    question: |-
      Le gestionnaire d'erreurs de l'API doit analyser le message pour savoir s'il faut renvoyer 404 :
      ```java
      throw new RuntimeException("commande introuvable : " + id);
      ```
    answer: |-
      ```java
      public class CommandeInconnue extends RuntimeException {
          private final long id;
          public CommandeInconnue(long id) {
              super("commande introuvable : " + id);
              this.id = id;
          }
          public long id() { return id; }
      }

      throw new CommandeInconnue(id);
      ```
      Un type dédié se traduit directement en 404, et l'identifiant passe par un champ, pas par le texte.
  - key: bug-sans-message
    format: bug-fix
    question: |-
      Les journaux affichent `StockEpuise` sans aucun détail :
      ```java
      public class StockEpuise extends RuntimeException {
          public StockEpuise() { }
      }
      ```
    answer: |-
      ```java
      public class StockEpuise extends RuntimeException {
          public StockEpuise(String produit, int demande, int disponible) {
              super("stock épuisé pour " + produit + " : " + demande + " demandés, " + disponible + " disponibles");
          }
      }
      ```
      Sans message ni données, l'exception ne dit pas quel produit est en cause.
  - key: bug-sans-cause
    format: bug-fix
    question: |-
      La pile ne montre jamais l'erreur réseau d'origine :
      ```java
      public class PaiementImpossible extends RuntimeException {
          public PaiementImpossible(String message) { super(message); }
      }
      // } catch (IOException e) { throw new PaiementImpossible("passerelle injoignable"); }
      ```
    answer: |-
      ```java
      public class PaiementImpossible extends RuntimeException {
          public PaiementImpossible(String message, Throwable cause) { super(message, cause); }
      }
      // } catch (IOException e) { throw new PaiementImpossible("passerelle injoignable", e); }
      ```
      Sans constructeur à cause, l'exception enveloppante perd la pile et le message de l'erreur réseau.
  - key: bug-extends-throwable
    format: bug-fix
    question: |-
      Le `catch (Exception e)` du gestionnaire global ne voit pas cette erreur métier :
      ```java
      public class ReservationRefusee extends Throwable { ... }
      ```
    answer: |-
      ```java
      public class ReservationRefusee extends RuntimeException { ... }
      ```
      Une sous-classe directe de `Throwable` n'est ni une `Exception` ni une `Error`. Une erreur métier étend
      `RuntimeException`.
  - key: geres-erreur-metier-attendue-exemple-solde
    format: scenario
    question: Comment tu gères une erreur métier attendue, par exemple un solde insuffisant ?
    answer: |-
      Je distinguerais les cas. Si l'échec doit interrompre le traitement et remonter jusqu'à l'API, une **exception métier** unchecked explicite (`SoldeInsuffisantException`) avec un handler global qui la traduit en 409 ou 422 avec un corps Problem Details.
      Si l'échec est un résultat normal que l'appelant **doit** traiter (une validation de formulaire avec plusieurs erreurs, par exemple), je préfère un type de retour explicite, une interface sealed `Resultat` avec `Succes` et `Echec`, parce que le compilateur force à traiter les deux cas.
      Dans tous les cas : un code d'erreur stable pour le client, pas de stack trace exposée, et un identifiant de corrélation pour retrouver la trace.
  - key: scenario-hierarchie
    format: scenario
    question: Comment organises-tu les exceptions d'une application ?
    answer: |-
      Une classe de base par grande famille, par exemple `ErreurMetier` (les règles du domaine : 4xx) et
      `ErreurTechnique` (base, réseau : 5xx), non vérifiées. Les exceptions concrètes en héritent et portent un code
      d'erreur stable (`COMMANDE_INCONNUE`) et leurs données. Le gestionnaire global traduit chaque famille, et chaque
      code, en réponse Problem Details. Je ne crée pas une exception par méthode : seulement quand l'appelant ou l'API doit
      distinguer le cas. Les erreurs de programmation restent des exceptions de la JDK.
  - key: scenario-code-erreur
    format: scenario
    question: Pourquoi associer un code d'erreur stable à une exception métier exposée par une API ?
    answer: |-
      Le client doit pouvoir réagir programmatiquement (afficher un message traduit, proposer une action) sans dépendre du
      texte du message, qui peut changer ou être traduit. Un code comme `SOLDE_INSUFFISANT` reste stable d'une version à
      l'autre, se documente dans l'OpenAPI et se teste. Je le place dans l'exception (ou je le déduis de son type) et le
      gestionnaire global le renvoie dans le champ `code` du Problem Details, à côté d'un message lisible.
  - key: scenario-resultat
    format: scenario
    question: Exception ou type de retour pour une validation qui peut produire plusieurs erreurs ?
    answer: |-
      Pour une validation de formulaire, je veux toutes les erreurs d'un coup, pas seulement la première : un type de
      retour qui accumule (`ResultatValidation` avec une liste d'erreurs par champ) est plus adapté qu'une exception, qui
      s'arrête au premier problème. Je réserve l'exception à la frontière : si le résultat contient des erreurs, la couche
      API lève (ou renvoie directement) un 400 qui les liste toutes. Bean Validation suit ce modèle avec ses violations.
