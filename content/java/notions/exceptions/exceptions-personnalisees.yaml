notion: exceptions-personnalisees
cards:
  - key: geres-erreur-metier-attendue-exemple-solde
    format: scenario
    question: Comment tu gères une erreur métier attendue, par exemple un solde insuffisant ?
    answer: |-
      Je distinguerais les cas. Si l'échec doit interrompre le traitement et remonter jusqu'à l'API, une **exception métier** unchecked explicite (`SoldeInsuffisantException`) avec un handler global qui la traduit en 409 ou 422 avec un corps Problem Details.
      Si l'échec est un résultat normal que l'appelant **doit** traiter (une validation de formulaire avec plusieurs erreurs, par exemple), je préfère un type de retour explicite, une interface sealed `Resultat` avec `Succes` et `Echec`, parce que le compilateur force à traiter les deux cas.
      Dans tous les cas : un code d'erreur stable pour le client, pas de stack trace exposée, et un identifiant de corrélation pour retrouver la trace.
