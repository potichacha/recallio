notion: try-catch-finally
lesson: |-
  ```java
  try {
      // le code qui peut échouer
  } catch (FileNotFoundException e) {       // du plus spécifique...
      // traiter l'absence du fichier
  } catch (IOException e) {                 // ...au plus général
      // traiter les autres erreurs d'entrée-sortie
  } finally {
      // exécuté dans tous les cas : succès, exception attrapée ou non
  }
  ```

  - Le premier `catch` **compatible** l'emporte : les suivants sont ignorés. Un `catch` placé après un `catch` de sa
    classe parente est **inatteignable** : erreur de compilation. On va donc du plus spécifique au plus général.
  - Si aucun `catch` ne correspond, l'exception continue de remonter, **après** l'exécution du `finally`.
  - `finally` sert au nettoyage (libérer un verrou, remettre un état) ; pour fermer une ressource, on préfère
    `try-with-resources`.
  - Un `try` doit avoir au moins un `catch` ou un `finally` (ou des ressources).
  - On n'attrape que ce qu'on sait **traiter** : attraper `Exception` « au cas où » cache des erreurs.

  Ordre d'exécution : le `try` jusqu'à l'exception, puis le `catch` correspondant, puis le `finally` ; sans exception,
  le `try` entier puis le `finally`.

  **Piège classique** : `catch (Exception e)` en premier, puis `catch (IOException e)`. Le second ne peut jamais être
  atteint, et le compilateur refuse le code.

  **En entretien** : « Les `catch` vont du plus spécifique au plus général, le premier compatible l'emporte, et `finally`
  s'exécute dans tous les cas. »
tour:
  - title: try, catch, finally
    text: |-
      `try` entoure le code qui peut échouer ; chaque `catch` traite une sorte d'exception, essayée **dans l'ordre** :
      on met donc les plus précises d'abord, et le compilateur refuse un `catch` qui ne serait jamais atteint. `finally`
      s'exécute dans tous les cas, exception ou non, même après un `return`.

      `finally` servait à libérer les ressources ; try-with-resources le fait mieux (plus loin).
    example:
      files:
        Main.java: |-
          String analyse(String saisie) {
              try {
                  int n = Integer.parseInt(saisie);
                  return "inverse : " + (100 / n);
              } catch (NumberFormatException e) {
                  return "pas un nombre";
              } catch (ArithmeticException e) {
                  return "division par zéro";
              } finally {
                  IO.println("analysé : " + saisie);
              }
          }

          void main() {
              for (String saisie : List.of("4", "zéro", "0")) {
                  IO.println(analyse(saisie));
              }
          }
      output: |-
        analysé : 4
        inverse : 25
        analysé : zéro
        pas un nombre
        analysé : 0
        division par zéro
cards:
  - key: ordre-catch
    format: course
    question: Ordre des catch ?
    answer: Du plus spécifique au plus général, sinon erreur de compilation.
  - key: ordre-execution
    format: course
    question: Dans quel ordre s'exécutent `try`, `catch` et `finally` quand une exception est levée et attrapée ?
    answer: Le `try` jusqu'à l'exception, puis le premier `catch` compatible, puis le `finally`.
  - key: aucun-catch
    format: course
    question: Que devient une exception qu'aucun `catch` ne correspond à son type ?
    answer: Le `finally` s'exécute, puis l'exception continue de remonter la pile d'appels.
  - key: obligatoire
    format: course
    question: Un `try` peut-il exister seul ?
    answer: "Non : il lui faut au moins un `catch`, un `finally`, ou des ressources (`try-with-resources`)."
  - key: vf-premier
    format: true-false
    question: Quand plusieurs `catch` sont compatibles, c'est le premier dans l'ordre du code qui s'exécute.
    truth: true
    answer: Les suivants sont ignorés.
  - key: vf-finally-sans-exception
    format: true-false
    question: "`finally` ne s'exécute que si une exception a été levée."
    truth: false
    answer: Il s'exécute dans tous les cas, avec ou sans exception.
  - key: vf-try-seul
    format: true-false
    question: "`try { ... } finally { ... }` sans `catch` est valide."
    truth: true
    answer: L'exception éventuelle remonte, après le `finally`.
  - key: vf-ordre-general
    format: true-false
    question: On peut placer `catch (Exception e)` avant `catch (IOException e)`.
    truth: false
    answer: "Le second deviendrait inatteignable : erreur de compilation."
  - key: qcm-ordre
    format: multiple-choice
    question: Quel ordre de `catch` compile ?
    choices:
      - text: "`FileNotFoundException`, puis `IOException`, puis `Exception`"
        correct: true
      - text: "`IOException`, puis `FileNotFoundException`"
        correct: false
      - text: "`Exception`, puis `IOException`"
        correct: false
      - text: "`Exception`, puis `RuntimeException`"
        correct: false
    answer: Du plus spécifique au plus général.
  - key: qcm-finally-usage
    format: multiple-choice
    question: À quoi sert `finally` ?
    choices:
      - text: "Libérer un verrou ou restaurer un état, quoi qu'il arrive"
        correct: true
      - text: "Traiter l'exception à la place de `catch`"
        correct: false
      - text: "Relancer le `try` en cas d'erreur"
        correct: false
      - text: "Déclarer les exceptions de la méthode"
        correct: false
    answer: Pour une ressource `AutoCloseable`, `try-with-resources` est plus sûr.
  - key: qcm-execution
    format: multiple-choice
    question: "Sans exception, qu'est-ce qui s'exécute ?"
    choices:
      - text: "Le `try` en entier, puis le `finally`"
        correct: true
      - text: "Le `try`, le `catch`, puis le `finally`"
        correct: false
      - text: "Seulement le `try`"
        correct: false
      - text: "Le `finally`, puis le `try`"
        correct: false
    answer: Le `catch` ne s'exécute qu'en cas d'exception compatible.
  - key: qcm-attraper
    format: multiple-choice
    question: Quelles exceptions faut-il attraper dans une méthode ?
    choices:
      - text: "Celles qu'on sait traiter à ce niveau"
        correct: true
      - text: "Toutes, avec `catch (Exception e)`, au cas où"
        correct: false
      - text: "Aucune, jamais"
        correct: false
      - text: "Seulement les `Error`"
        correct: false
    answer: Les autres remontent vers une couche capable d'y répondre.
  - key: trous-catch
    format: fill-in
    question: |-
      Complétez pour traiter une saisie qui n'est pas un nombre :
      ```java
      try {
          n = Integer.parseInt(saisie);
      } ___ (NumberFormatException e) {
          n = 0;
      }
      ```
    blanks: [[catch]]
    answer: '`catch` déclare le type traité et la variable qui reçoit l''exception.'
  - key: trous-finally
    format: fill-in
    question: |-
      Complétez pour libérer le verrou dans tous les cas :
      ```java
      verrou.lock();
      try {
          modifier();
      } ___ {
          verrou.unlock();
      }
      ```
    blanks: [[finally]]
    answer: Le `finally` s'exécute même si `modifier()` lève une exception.
  - key: trous-specifique
    format: fill-in
    question: |-
      Complétez avec l'exception la plus spécifique, placée en premier :
      ```java
      try {
          lire(chemin);
      } catch (___ e) {
          afficher("fichier introuvable");
      } catch (IOException e) {
          afficher("erreur de lecture");
      }
      ```
    blanks: [[FileNotFoundException, NoSuchFileException]]
    answer: Une sous-classe d'`IOException` doit venir avant elle.
  - key: trous-try
    format: fill-in
    question: |-
      Complétez le début du bloc :
      ```java
      ___ {
          traiter();
      } catch (IllegalStateException e) {
          annuler();
      }
      ```
    blanks: [[try]]
    answer: Le bloc `try` contient le code surveillé.
  - key: code-code-compile-try-catch-exception
    format: code-output
    question: |-
      Ce code compile-t-il ?
      ```java
      try { ... } catch (Exception e) { ... } catch (IOException e) { ... }
      ```
    answer: 'Non : le second catch est inatteignable, il faut placer le plus spécifique en premier.'
    check:
      code: |-
        try { new FileReader("x").close(); } catch (Exception e) { } catch (IOException e) { }
      compiles: false
  - key: code-avec-exception
    format: code-output
    question: |-
      ```java
      try {
          System.out.print("T ");
          throw new RuntimeException();
      } catch (RuntimeException e) {
          System.out.print("C ");
      } finally {
          System.out.print("F");
      }
      ```
    answer: '`T C F`.'
    check:
      output: "T C F"
  - key: code-sans-exception
    format: code-output
    question: |-
      ```java
      try {
          System.out.print("T ");
      } catch (RuntimeException e) {
          System.out.print("C ");
      } finally {
          System.out.print("F");
      }
      ```
    answer: '`T F` : sans exception, le `catch` ne s''exécute pas.'
    check:
      output: "T F"
  - key: code-non-attrapee
    format: code-output
    question: |-
      ```java
      try {
          System.out.print("T ");
          throw new IllegalStateException();
      } catch (IllegalArgumentException e) {
          System.out.print("C ");
      } finally {
          System.out.print("F");
      }
      ```
    answer: '`T F`, puis l''`IllegalStateException` remonte : aucun `catch` ne correspond, mais le `finally` s''exécute.'
    check:
      output: "T F"
      throws: IllegalStateException
  - key: bug-ordre
    format: bug-fix
    question: |-
      Ce code ne compile pas (`exception FileNotFoundException has already been caught`) :
      ```java
      try {
          lire(fichier);
      } catch (IOException e) {
          erreur("lecture");
      } catch (FileNotFoundException e) {
          erreur("introuvable");
      }
      ```
    answer: |-
      ```java
      try {
          lire(fichier);
      } catch (FileNotFoundException e) {
          erreur("introuvable");
      } catch (IOException e) {
          erreur("lecture");
      }
      ```
      Le `catch` de la classe parente attrape déjà la sous-classe : le plus spécifique doit venir en premier.
  - key: bug-verrou
    format: bug-fix
    question: |-
      Après une exception dans `modifier()`, plus aucun thread n'obtient le verrou :
      ```java
      verrou.lock();
      modifier();
      verrou.unlock();
      ```
    answer: |-
      ```java
      verrou.lock();
      try {
          modifier();
      } finally {
          verrou.unlock();
      }
      ```
      Si `modifier()` lève une exception, `unlock()` n'est jamais appelé. Le `finally` garantit la libération.
  - key: bug-catch-large
    format: bug-fix
    question: |-
      Une `NullPointerException` dans le calcul est affichée comme un problème de saisie :
      ```java
      try {
          int quantite = Integer.parseInt(saisie);
          total = calculer(quantite);
      } catch (Exception e) {
          afficher("quantité invalide");
      }
      ```
    answer: |-
      ```java
      int quantite;
      try {
          quantite = Integer.parseInt(saisie);
      } catch (NumberFormatException e) {
          afficher("quantité invalide");
          return;
      }
      total = calculer(quantite);
      ```
      `catch (Exception e)` attrape aussi les bugs du calcul et les maquille. On attrape l'exception attendue, autour du
      seul code qui la lève.
  - key: bug-fermeture
    format: bug-fix
    question: |-
      Le fichier reste ouvert quand la lecture échoue :
      ```java
      BufferedReader lecteur = Files.newBufferedReader(chemin);
      String ligne = lecteur.readLine();
      lecteur.close();
      ```
    answer: |-
      ```java
      try (BufferedReader lecteur = Files.newBufferedReader(chemin)) {
          String ligne = lecteur.readLine();
      }
      ```
      Si `readLine` échoue, `close` n'est jamais appelé. `try-with-resources` ferme la ressource dans tous les cas.
