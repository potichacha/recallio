notion: exceptions-performance
cards:
  - key: exceptions-sont-elles-couteuses
    format: course
    question: Pourquoi les exceptions sont-elles coûteuses ?
    answer: Principalement à cause du remplissage de la stack trace.
  - key: voit-parfois-npe-sans-stack-trace
    format: course
    question: Pourquoi voit-on parfois des NPE sans stack trace en production ?
    answer: Le JIT omet la pile des exceptions très fréquentes (OmitStackTraceInFastThrow).
  - key: erreur-intermittente-apparait-logs-comme
    format: scenario
    question: Une erreur intermittente apparaît dans les logs comme une NullPointerException sans aucune stack trace.
    answer: |-
      C'est l'optimisation du JIT qui, pour une exception levée très souvent au même endroit, finit par réutiliser une instance préallouée sans pile. Il faut chercher la **première occurrence** dans les logs, qui elle avait sa stack trace, ou redémarrer avec `-XX:-OmitStackTraceInFastThrow` pour la conserver.
      Et la fréquence elle-même est une information : une NPE levée assez souvent pour que le JIT l'optimise, c'est un vrai bug, pas un incident isolé.
