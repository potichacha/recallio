notion: hierarchie-throwable
cards:
  - key: error-vs-exception
    format: course
    question: Error vs Exception ?
    answer: Error = grave, non récupérable. Exception = potentiellement gérable.
  - key: catcher-error
    format: course
    question: Peut-on catcher une Error ?
    answer: Techniquement oui, mais on ne sait généralement pas s'en remettre ; à éviter sauf pour logger avant de laisser remonter.
