notion: hierarchie-throwable
lesson: |-
  Tout ce qu'on peut lever (`throw`) et attraper (`catch`) hérite de **`Throwable`** :

  ```
  Throwable
  ├── Error                       problèmes graves de la JVM : on ne les traite pas
  │   ├── OutOfMemoryError
  │   ├── StackOverflowError
  │   └── AssertionError
  └── Exception                   erreurs qu'une application peut traiter
      ├── IOException, SQLException...           vérifiées (checked)
      └── RuntimeException                       non vérifiées (unchecked)
          ├── NullPointerException
          ├── IllegalArgumentException
          │   └── NumberFormatException
          ├── IllegalStateException
          └── IndexOutOfBoundsException...
  ```

  - **`Error`** : la JVM est en difficulté (mémoire épuisée, pile débordée). L'application ne sait en général pas s'en
    remettre ; au mieux, on journalise et on laisse le processus s'arrêter.
  - **`Exception`** : les erreurs que le code peut prévoir et traiter.
  - **`RuntimeException`** et ses sous-classes : en général des erreurs de programmation ou des violations de contrat ;
    le compilateur n'oblige pas à les traiter.
  - Les autres `Exception` sont **vérifiées** : le compilateur oblige à les attraper ou à les déclarer.

  Un `catch` attrape le type indiqué **et toutes ses sous-classes** : `catch (Exception e)` attrape aussi les
  `RuntimeException`, mais pas les `Error`.

  **Piège classique** : `catch (Throwable t)` dans du code métier. On attrape aussi les `OutOfMemoryError` et les
  `StackOverflowError`, et l'on continue dans une JVM qui ne fonctionne plus correctement.

  **En entretien** : « `Throwable` se divise en `Error` (la JVM va mal) et `Exception` ; parmi les exceptions,
  `RuntimeException` est non vérifiée, les autres sont vérifiées. »
cards:
  - key: error-vs-exception
    format: course
    question: Error vs Exception ?
    answer: Error = grave, non récupérable. Exception = potentiellement gérable.
  - key: catcher-error
    format: course
    question: Peut-on catcher une Error ?
    answer: Techniquement oui, mais on ne sait généralement pas s'en remettre ; à éviter sauf pour logger avant de laisser remonter.
  - key: racine
    format: course
    question: Quelle est la racine de toutes les exceptions et erreurs ?
    answer: '`java.lang.Throwable` : seules ses sous-classes peuvent être levées avec `throw` et attrapées avec `catch`.'
  - key: sous-classes
    format: course
    question: Que attrape `catch (IOException e)` ?
    answer: Les `IOException` et toutes leurs sous-classes (`FileNotFoundException`, `NoSuchFileException`...).
  - key: vf-exception-error
    format: true-false
    question: "`catch (Exception e)` attrape une `StackOverflowError`."
    truth: false
    answer: '`StackOverflowError` est une `Error`, pas une `Exception`.'
  - key: vf-runtime-exception
    format: true-false
    question: "`IllegalArgumentException` est une sous-classe de `RuntimeException`."
    truth: true
    answer: Elle est donc non vérifiée.
  - key: vf-io-runtime
    format: true-false
    question: "`IOException` est une `RuntimeException`."
    truth: false
    answer: "Elle étend directement `Exception` : c'est une exception vérifiée."
  - key: vf-throwable-direct
    format: true-false
    question: Une exception métier devrait étendre directement `Throwable`.
    truth: false
    answer: Elle étend `RuntimeException` (ou `Exception`), pour être traitée comme les autres exceptions.
  - key: qcm-error
    format: multiple-choice
    question: Lesquelles sont des `Error` ?
    choices:
      - text: "`OutOfMemoryError`"
        correct: true
      - text: "`StackOverflowError`"
        correct: true
      - text: "`NullPointerException`"
        correct: false
      - text: "`FileNotFoundException`"
        correct: false
    answer: Les deux dernières sont des exceptions.
  - key: qcm-unchecked
    format: multiple-choice
    question: Lesquelles sont non vérifiées ?
    choices:
      - text: "`NullPointerException`"
        correct: true
      - text: "`NumberFormatException`"
        correct: true
      - text: "`IOException`"
        correct: false
      - text: "`SQLException`"
        correct: false
    answer: Les non vérifiées descendent de `RuntimeException`.
  - key: qcm-attrape
    format: multiple-choice
    question: "Lesquelles un `catch (RuntimeException e)` attrape-t-il ?"
    choices:
      - text: "`IllegalStateException`"
        correct: true
      - text: "`ArithmeticException`"
        correct: true
      - text: "`IOException`"
        correct: false
      - text: "`AssertionError`"
        correct: false
    answer: Il attrape les sous-classes de `RuntimeException` seulement.
  - key: qcm-parent
    format: multiple-choice
    question: De quelle classe `NumberFormatException` hérite-t-elle directement ?
    choices:
      - text: "`IllegalArgumentException`"
        correct: true
      - text: "`RuntimeException`"
        correct: false
      - text: "`Exception`"
        correct: false
      - text: "`ArithmeticException`"
        correct: false
    answer: Un texte non numérique est un argument invalide.
  - key: code-instanceof
    format: code-output
    question: |-
      ```java
      Throwable io = new IOException();
      Throwable argument = new IllegalArgumentException();
      Throwable pile = new StackOverflowError();
      System.out.println((io instanceof Exception) + " " + (argument instanceof RuntimeException) + " "
              + (pile instanceof Exception));
      ```
    answer: '`true true false` : une `Error` n''est pas une `Exception`. (Sans la variable de type `Throwable`, `new StackOverflowError() instanceof Exception` ne compilerait même pas : deux classes sans lien.)'
    check:
      output: "true true false"
  - key: code-error-non-attrapee
    format: code-output
    question: |-
      ```java
      try {
          throw new AssertionError("invariant cassé");
      } catch (Exception e) {
          System.out.println("attrapée");
      }
      ```
    answer: "L'`AssertionError` n'est pas attrapée : `catch (Exception e)` ne voit pas les `Error`."
    check:
      throws: AssertionError
  - key: code-throwable
    format: code-output
    question: |-
      ```java
      try {
          throw new StackOverflowError();
      } catch (Throwable t) {
          System.out.println(t.getClass().getSimpleName());
      }
      ```
    answer: '`StackOverflowError` : `Throwable` attrape absolument tout.'
    check:
      output: "StackOverflowError"
  - key: code-parents
    format: code-output
    question: |-
      ```java
      System.out.println(NumberFormatException.class.getSuperclass().getSimpleName() + " "
              + FileNotFoundException.class.getSuperclass().getSimpleName());
      ```
    answer: '`IllegalArgumentException IOException`.'
    check:
      output: "IllegalArgumentException IOException"
  - key: bug-catch-throwable
    format: bug-fix
    question: |-
      Après une `OutOfMemoryError`, le service continue à répondre des résultats incohérents :
      ```java
      try {
          traiter(lot);
      } catch (Throwable t) {
          log.warn("lot ignoré", t);
      }
      ```
    answer: |-
      ```java
      try {
          traiter(lot);
      } catch (RuntimeException e) {
          log.warn("lot ignoré", e);
      }
      ```
      `Throwable` attrape aussi les `Error`, après lesquelles la JVM n'est plus fiable. On attrape seulement les
      exceptions qu'on sait traiter ; une `Error` doit remonter (et le processus redémarrer).
  - key: bug-extends-error
    format: bug-fix
    question: |-
      Le gestionnaire d'erreurs global ne traite pas cette exception métier :
      ```java
      class SoldeInsuffisant extends Error { ... }
      ```
    answer: |-
      ```java
      class SoldeInsuffisant extends RuntimeException { ... }
      ```
      `Error` est réservée aux problèmes graves de la JVM ; les `catch (Exception e)` ne la voient pas. Une erreur métier
      est une exception.
  - key: bug-catch-oom
    format: bug-fix
    question: |-
      Ce code « récupère » d'un manque de mémoire en réessayant :
      ```java
      try {
          image = charger(fichier);
      } catch (OutOfMemoryError e) {
          image = charger(fichier);
      }
      ```
    answer: |-
      ```java
      image = chargerReduite(fichier, TAILLE_MAX);   // et une limite sur la taille acceptée
      ```
      Après une `OutOfMemoryError`, l'état de la JVM est incertain et réessayer échouera de la même façon. On prévient le
      problème (limiter la taille, traiter en flux) au lieu de l'attraper.
  - key: bug-throwable-direct
    format: bug-fix
    question: |-
      Cette exception échappe aux `catch (Exception e)` du code :
      ```java
      class ConfigurationInvalide extends Throwable { ... }
      ```
    answer: |-
      ```java
      class ConfigurationInvalide extends RuntimeException { ... }
      ```
      Une sous-classe directe de `Throwable` n'est ni une `Exception` ni une `Error` : elle déroute tous les gestionnaires.
      On étend `RuntimeException` (ou `Exception` pour une exception vérifiée).
