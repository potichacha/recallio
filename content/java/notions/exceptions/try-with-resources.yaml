notion: try-with-resources
lesson: |-
  `try-with-resources` (Java 7) ferme automatiquement les ressources déclarées entre parenthèses, à la sortie du bloc,
  **qu'il y ait une exception ou non** :

  ```java
  try (BufferedReader lecteur = Files.newBufferedReader(chemin);
       BufferedWriter ecrivain = Files.newBufferedWriter(copie)) {
      String ligne;
      while ((ligne = lecteur.readLine()) != null) {
          ecrivain.write(ligne);
          ecrivain.newLine();
      }
  }   // ecrivain.close() puis lecteur.close(), dans l'ordre inverse de l'ouverture
  ```

  - Une ressource est un objet **`AutoCloseable`** (une seule méthode, `close()`). `Closeable` (pour l'entrée-sortie)
    l'étend, avec une `close()` qui lève `IOException` et qui doit être **idempotente**.
  - Les ressources sont fermées **dans l'ordre inverse** de leur déclaration, **avant** l'exécution des `catch` et du
    `finally` éventuels.
  - Si le corps **et** `close()` lèvent une exception, celle du corps remonte, et celle de `close()` lui est attachée
    comme exception **supprimée** (rien n'est perdu, contrairement à un `finally`).
  - Depuis Java 9, on peut y placer une variable déjà déclarée, si elle est (effectivement) finale : `try (lecteur) { }`.
  - Pensez-y pour tout ce qui se ferme : fichiers, connexions, `PreparedStatement`, `ResultSet`, verrous enveloppés, et
    les **`Stream` de `Files.lines`**, qui gardent un fichier ouvert.

  **Piège classique** : renvoyer une ressource ouverte dans un `try-with-resources` (`return lecteur;`). L'appelant reçoit
  un lecteur **déjà fermé**.

  **En entretien** : « `try-with-resources` ferme les `AutoCloseable` dans l'ordre inverse, même en cas d'exception, et
  garde l'exception de `close` comme supprimée. »
tour:
  - title: try-with-resources
    text: |-
      Une ressource (un fichier, une connexion) doit être fermée, même en cas d'erreur. `try (var r = ouvre()) { … }` la
      ferme **automatiquement** à la fin du bloc, quoi qu'il arrive : il suffit qu'elle implémente `AutoCloseable`.

      Plusieurs ressources se ferment dans l'ordre inverse de leur ouverture. Si la fermeture échoue aussi, son
      exception est attachée à la première comme exception *supprimée* : rien n'est perdu. C'est la façon idiomatique de
      manipuler une ressource, plutôt qu'un `finally`.
    example:
      files:
        Main.java: |-
          class Connexion implements AutoCloseable {
              private final String nom;

              Connexion(String nom) {
                  this.nom = nom;
                  IO.println("ouverture de " + nom);
              }

              @Override
              public void close() {
                  IO.println("fermeture de " + nom);
              }
          }

          void travaille() {
              throw new IllegalStateException("panne");
          }

          void main() {
              try (Connexion base = new Connexion("base");
                      Connexion cache = new Connexion("cache")) {
                  IO.println("travail");
                  travaille();
              } catch (IllegalStateException e) {
                  IO.println("erreur : " + e.getMessage());
              }
          }
      output: |-
        ouverture de base
        ouverture de cache
        travail
        fermeture de cache
        fermeture de base
        erreur : panne
cards:
  - key: autocloseable-vs-closeable
    format: course
    question: AutoCloseable vs Closeable ?
    answer: Closeable étend AutoCloseable, lève IOException et doit avoir un close idempotent.
  - key: ordre-fermeture
    format: course
    question: Dans quel ordre sont fermées plusieurs ressources d'un `try-with-resources` ?
    answer: "Dans l'ordre inverse de leur déclaration : la dernière ouverte est fermée la première."
  - key: avant-catch
    format: course
    question: Les ressources sont-elles fermées avant ou après l'exécution du `catch` ?
    answer: "Avant : quand le `catch` s'exécute, les ressources sont déjà fermées."
  - key: java-9
    format: course
    question: Qu'a ajouté Java 9 à `try-with-resources` ?
    answer: La possibilité d'utiliser une variable déjà déclarée, si elle est finale ou effectivement finale (`try (connexion) { ... }`).
  - key: vf-exception
    format: true-false
    question: "`try-with-resources` ferme la ressource même si le corps lève une exception."
    truth: true
    answer: C'est sa raison d'être.
  - key: vf-autocloseable
    format: true-false
    question: N'importe quel objet peut être déclaré dans les parenthèses d'un `try-with-resources`.
    truth: false
    answer: Il doit implémenter `AutoCloseable`.
  - key: vf-ordre
    format: true-false
    question: Les ressources sont fermées dans l'ordre de leur déclaration.
    truth: false
    answer: Dans l'ordre inverse.
  - key: vf-stream-lines
    format: true-false
    question: Le `Stream<String>` renvoyé par `Files.lines` doit être fermé.
    truth: true
    answer: Il garde le fichier ouvert ; on l'utilise dans un `try-with-resources`.
  - key: qcm-ressources
    format: multiple-choice
    question: Lesquels peuvent être déclarés dans un `try-with-resources` ?
    choices:
      - text: "Un `BufferedReader`"
        correct: true
      - text: "Une `Connection` JDBC"
        correct: true
      - text: "Le `Stream` de `Files.lines(chemin)`"
        correct: true
      - text: "Une `String`"
        correct: false
    answer: Tous les `AutoCloseable` ; une `String` n'en est pas un.
  - key: qcm-plusieurs
    format: multiple-choice
    question: Comment séparer deux ressources dans les parenthèses ?
    choices:
      - text: "Par un point-virgule `;`"
        correct: true
      - text: "Par une virgule `,`"
        correct: false
      - text: "Par `&&`"
        correct: false
      - text: "On ne peut en déclarer qu'une"
        correct: false
    answer: "`try (A a = ...; B b = ...) { }`."
  - key: qcm-close-exception
    format: multiple-choice
    question: Si le corps et `close()` lèvent chacun une exception, laquelle remonte ?
    choices:
      - text: "Celle du corps, avec celle de `close()` attachée comme supprimée"
        correct: true
      - text: "Celle de `close()` seulement"
        correct: false
      - text: "Les deux, l'une après l'autre"
        correct: false
      - text: "Aucune"
        correct: false
    answer: '`getSuppressed()` donne celle de `close()`.'
  - key: qcm-implementer
    format: multiple-choice
    question: Comment rendre une classe utilisable dans un `try-with-resources` ?
    choices:
      - text: "Implémenter `AutoCloseable` et sa méthode `close()`"
        correct: true
      - text: "Redéfinir `finalize()`"
        correct: false
      - text: "L'annoter `@Resource`"
        correct: false
      - text: "Implémenter `Runnable`"
        correct: false
    answer: '`close()` libère ce que l''objet détient.'
  - key: completer-try-with-resources
    format: fill-in
    question: |-
      Complétez pour que le fichier soit fermé même en cas d'exception :
      ```java
      ___ (BufferedReader lecteur = Files.newBufferedReader(chemin)) {
          return lecteur.readLine();
      }
      ```
    blanks: [[try]]
    answer: "try-with-resources ferme la ressource (une `AutoCloseable`) à la sortie du bloc, exception ou non."
  - key: trous-interface
    format: fill-in
    question: |-
      Complétez pour qu'une transaction puisse être fermée automatiquement :
      ```java
      class Transaction implements ___ {
          @Override
          public void close() { annulerSiNonValidee(); }
      }
      ```
    blanks: [[AutoCloseable]]
    answer: '`AutoCloseable` déclare la seule méthode `close()`.'
  - key: trous-close
    format: fill-in
    question: |-
      Complétez la méthode appelée automatiquement en fin de bloc :
      ```java
      @Override
      public void ___() {
          connexion.liberer();
      }
      ```
    blanks: [[close]]
    answer: '`try-with-resources` appelle `close()` sur chaque ressource.'
  - key: trous-deux-ressources
    format: fill-in
    question: |-
      Complétez le séparateur entre les deux ressources :
      ```java
      try (var entree = Files.newInputStream(source)___ var sortie = Files.newOutputStream(cible)) {
          entree.transferTo(sortie);
      }
      ```
    blanks: [[";"]]
    answer: Les ressources se séparent par un point-virgule.
  - key: code-ordre-inverse
    format: code-output
    question: |-
      ```java
      record R(String nom) implements AutoCloseable {
          public void close() { System.out.print("close " + nom + " "); }
      }
      try (R a = new R("a"); R b = new R("b")) {
          System.out.print("corps ");
      }
      ```
    answer: '`corps close b close a` : fermeture dans l''ordre inverse de l''ouverture.'
    check:
      output: "corps close b close a"
  - key: code-avant-catch
    format: code-output
    question: |-
      ```java
      record R(String nom) implements AutoCloseable {
          public void close() { System.out.print("close " + nom + " "); }
      }
      try (R a = new R("a")) {
          throw new IllegalStateException();
      } catch (IllegalStateException e) {
          System.out.print("catch");
      }
      ```
    answer: '`close a catch` : la ressource est fermée avant le `catch`.'
    check:
      output: "close a catch"
  - key: code-pas-autocloseable
    format: code-output
    question: |-
      ```java
      try (String s = "texte") {
          System.out.println(s);
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `incompatible types: try-with-resources not applicable to variable type`.'
    check:
      compiles: false
  - key: code-java-9
    format: code-output
    question: |-
      ```java
      record R(String nom) implements AutoCloseable {
          public void close() { System.out.print("close " + nom); }
      }
      static void utiliser() {
          R r = new R("r");
          try (r) {
              System.out.print("corps ");
          }
      }
      utiliser();
      ```
    answer: '`corps close r` : depuis Java 9, une variable effectivement finale peut être une ressource.'
    check:
      output: "corps close r"
  - key: bug-files-lines
    format: bug-fix
    question: |-
      Après quelques milliers d'appels, le service échoue avec `Too many open files` :
      ```java
      long nombre = Files.lines(chemin).count();
      ```
    answer: |-
      ```java
      long nombre;
      try (Stream<String> lignes = Files.lines(chemin)) {
          nombre = lignes.count();
      }
      ```
      Le `Stream` de `Files.lines` garde le fichier ouvert jusqu'à sa fermeture. Contrairement aux streams de collections,
      il faut le fermer.
  - key: bug-finally-manuel
    format: bug-fix
    question: |-
      Modernisez :
      ```java
      Connection c = null;
      try {
          c = source.getConnection();
          executer(c);
      } finally {
          if (c != null) {
              c.close();
          }
      }
      ```
    answer: |-
      ```java
      try (Connection c = source.getConnection()) {
          executer(c);
      }
      ```
      Plus court, sans test de `null`, et une exception de `close()` ne masque plus celle d'`executer`.
  - key: bug-ressource-renvoyee
    format: bug-fix
    question: |-
      L'appelant obtient `IOException: Stream closed` à la première lecture :
      ```java
      BufferedReader ouvrir(Path p) throws IOException {
          try (BufferedReader lecteur = Files.newBufferedReader(p)) {
              return lecteur;
          }
      }
      ```
    answer: |-
      ```java
      BufferedReader ouvrir(Path p) throws IOException {
          return Files.newBufferedReader(p);   // l'appelant la fermera dans son propre try-with-resources
      }
      ```
      La ressource est fermée dès la sortie du bloc, donc avant d'être utilisée. Celui qui utilise la ressource est celui
      qui la ferme.
  - key: bug-close-oublie
    format: bug-fix
    question: |-
      Une connexion du pool fuit à chaque requête qui lève une exception :
      ```java
      PreparedStatement requete = connexion.prepareStatement(sql);
      ResultSet resultat = requete.executeQuery();
      lire(resultat);
      resultat.close();
      requete.close();
      ```
    answer: |-
      ```java
      try (PreparedStatement requete = connexion.prepareStatement(sql);
           ResultSet resultat = requete.executeQuery()) {
          lire(resultat);
      }
      ```
      Si `lire` lève une exception, les `close()` ne sont jamais appelés. `try-with-resources` les ferme dans l'ordre
      inverse, dans tous les cas.
