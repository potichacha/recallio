notion: try-with-resources
cards:
  - key: autocloseable-vs-closeable
    format: course
    question: AutoCloseable vs Closeable ?
    answer: Closeable étend AutoCloseable, lève IOException et doit avoir un close idempotent.
  - key: completer-try-with-resources
    format: fill-in
    question: |-
      Complétez pour que le fichier soit fermé même en cas d'exception :
      ```java
      ___ (BufferedReader lecteur = Files.newBufferedReader(chemin)) {
          return lecteur.readLine();
      }
      ```
    blanks: [[try]]
    answer: "try-with-resources ferme la ressource (une `AutoCloseable`) à la sortie du bloc, exception ou non."
