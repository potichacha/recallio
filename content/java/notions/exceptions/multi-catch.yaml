notion: multi-catch
lesson: |-
  Depuis Java 7, un même `catch` peut traiter **plusieurs types** d'exceptions, séparés par `|` :

  ```java
  try {
      Path chemin = Path.of(nom);
      String contenu = Files.readString(chemin);
      return analyser(contenu);
  } catch (IOException | ParseException e) {        // même traitement pour les deux
      throw new ImportImpossible(nom, e);
  }
  ```

  - On évite de dupliquer le même bloc dans plusieurs `catch`, sans pour autant attraper `Exception`.
  - Les types listés ne doivent pas être **liés par héritage** : `FileNotFoundException | IOException` ne compile pas
    (la première est déjà couverte par la seconde).
  - La variable `e` est implicitement **`final`** : on ne peut pas la réaffecter.
  - Son type statique est le **plus proche parent commun** des types listés : `IllegalArgumentException |
    IllegalStateException` donne une `RuntimeException`.
  - Relancer `e` (`throw e;`) relance le type précis : le compilateur sait qu'il ne peut s'agir que des types listés.

  **Piège classique** : remplacer trois `catch` précis par `catch (Exception e)` pour « simplifier ». On attrape aussi
  les erreurs de programmation, alors que le multi-catch garde la précision.

  **En entretien** : « Le multi-catch regroupe des exceptions sans lien qui ont le même traitement ; sa variable est
  `final`, et son type est leur parent commun. »
tour:
  - title: Le multi-catch
    text: |-
      Quand plusieurs exceptions se traitent de la même façon, un seul `catch` les réunit avec `|` :
      `catch (NumberFormatException | ArithmeticException e)`. Le traitement n'est pas dupliqué.

      Les types réunis ne doivent pas être parents l'un de l'autre, et la variable `e` est implicitement `final`.
    example:
      files:
        Main.java: |-
          int calcule(String saisie) {
              try {
                  return 100 / Integer.parseInt(saisie);
              } catch (NumberFormatException | ArithmeticException e) {
                  IO.println("saisie refusée (" + e.getClass().getSimpleName() + ")");
                  return -1;
              }
          }

          void main() {
              IO.println(calcule("5"));
              IO.println(calcule("x"));
              IO.println(calcule("0"));
          }
      output: |-
        20
        saisie refusée (NumberFormatException)
        -1
        saisie refusée (ArithmeticException)
        -1
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'un multi-catch ?
    answer: 'Un `catch` qui liste plusieurs types séparés par `|` (Java 7) : `catch (IOException | SQLException e)`, pour un traitement commun.'
  - key: types-lies
    format: course
    question: Pourquoi `catch (FileNotFoundException | IOException e)` ne compile-t-il pas ?
    answer: '`FileNotFoundException` est une sous-classe d''`IOException`, déjà couverte : les types d''un multi-catch ne doivent pas être liés par héritage.'
  - key: final
    format: course
    question: Peut-on réaffecter la variable d'un multi-catch ?
    answer: Non, elle est implicitement `final`.
  - key: type-statique
    format: course
    question: Quel est le type de `e` dans `catch (IllegalArgumentException | IllegalStateException e)` ?
    answer: "Leur parent commun le plus proche, `RuntimeException` : on ne peut appeler que ses méthodes."
  - key: vf-version
    format: true-false
    question: Le multi-catch existe depuis Java 7.
    truth: true
    answer: Avec `try-with-resources`, dans le projet Coin.
  - key: vf-lies
    format: true-false
    question: "`catch (IOException | Exception e)` est valide."
    truth: false
    answer: '`IOException` est une sous-classe d''`Exception` : erreur de compilation.'
  - key: vf-reaffecter
    format: true-false
    question: Dans un multi-catch, on peut écrire `e = new IOException();`.
    truth: false
    answer: La variable est implicitement `final`.
  - key: vf-equivalent-exception
    format: true-false
    question: "`catch (IOException | SQLException e)` équivaut à `catch (Exception e)`."
    truth: false
    answer: Il n'attrape que ces deux types (et leurs sous-classes), pas les `RuntimeException`.
  - key: qcm-valide
    format: multiple-choice
    question: Lesquels de ces multi-catch compilent ?
    choices:
      - text: "`catch (IOException | SQLException e)`"
        correct: true
      - text: "`catch (IllegalArgumentException | IllegalStateException e)`"
        correct: true
      - text: "`catch (NumberFormatException | IllegalArgumentException e)`"
        correct: false
      - text: "`catch (RuntimeException | NullPointerException e)`"
        correct: false
    answer: Les deux derniers listent un type et l'une de ses sous-classes.
  - key: qcm-usage
    format: multiple-choice
    question: Quand utiliser un multi-catch ?
    choices:
      - text: "Quand plusieurs exceptions sans lien reçoivent exactement le même traitement"
        correct: true
      - text: "Pour attraper toutes les exceptions possibles"
        correct: false
      - text: "Pour traiter chaque exception différemment"
        correct: false
      - text: "Pour remplacer `finally`"
        correct: false
    answer: Des traitements différents demandent des `catch` séparés.
  - key: qcm-methodes
    format: multiple-choice
    question: "Dans `catch (IOException | SQLException e)`, quelles méthodes peut-on appeler sur `e` ?"
    choices:
      - text: "Celles d'`Exception` (leur parent commun), comme `getMessage()`"
        correct: true
      - text: "`getSQLState()`, propre à `SQLException`"
        correct: false
      - text: "Aucune"
        correct: false
      - text: "Toutes celles des deux classes"
        correct: false
    answer: Le type statique est le parent commun ; il faudrait un `catch` séparé pour `getSQLState()`.
  - key: qcm-separateur
    format: multiple-choice
    question: Quel caractère sépare les types d'un multi-catch ?
    choices:
      - text: "`|`"
        correct: true
      - text: "`,`"
        correct: false
      - text: "`||`"
        correct: false
      - text: "`&`"
        correct: false
    answer: Une seule barre verticale.
  - key: code-deux-types
    format: code-output
    question: |-
      ```java
      static void risque(int i) throws IOException {
          if (i == 0) throw new IOException("io");
          if (i == 1) throw new IllegalStateException("etat");
      }
      for (int i = 0; i < 2; i++) {
          try {
              risque(i);
          } catch (IOException | IllegalStateException e) {
              System.out.print(e.getMessage() + ";");
          }
      }
      ```
    answer: '`io;etat;` : le même `catch` traite les deux types.'
    check:
      output: "io;etat;"
  - key: code-lies
    format: code-output
    question: |-
      ```java
      try {
          new FileReader("x").close();
      } catch (FileNotFoundException | IOException e) {
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `Alternatives in a multi-catch statement cannot be related by subclassing`.'
    check:
      compiles: false
  - key: code-final
    format: code-output
    question: |-
      ```java
      try {
          new FileReader("x").close();
      } catch (IOException | RuntimeException e) {
          e = new RuntimeException();
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : la variable d''un multi-catch est `final`.'
    check:
      compiles: false
  - key: code-parent-commun
    format: code-output
    question: |-
      ```java
      try {
          throw new IllegalArgumentException("x");
      } catch (IllegalArgumentException | IllegalStateException e) {
          RuntimeException r = e;
          System.out.println(r.getClass().getSimpleName());
      }
      ```
    answer: '`IllegalArgumentException` : `e` est typée `RuntimeException`, mais l''objet garde sa classe réelle.'
    check:
      output: "IllegalArgumentException"
  - key: bug-duplication
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      try {
          importer(fichier);
      } catch (IOException e) {
          throw new ImportImpossible(fichier, e);
      } catch (ParseException e) {
          throw new ImportImpossible(fichier, e);
      }
      ```
    answer: |-
      ```java
      try {
          importer(fichier);
      } catch (IOException | ParseException e) {
          throw new ImportImpossible(fichier, e);
      }
      ```
      Le multi-catch supprime la duplication sans élargir à `Exception`.
  - key: bug-types-lies
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      } catch (NoSuchFileException | IOException e) {
          signaler(e);
      }
      ```
    answer: |-
      ```java
      } catch (IOException e) {
          signaler(e);
      }
      ```
      `NoSuchFileException` est déjà une `IOException` : un seul type suffit. (Pour un traitement différent, on écrirait
      deux `catch`, le plus spécifique d'abord.)
  - key: bug-exception-large
    format: bug-fix
    question: |-
      Une `NullPointerException` du code d'import est traduite en erreur de fichier :
      ```java
      } catch (Exception e) {
          throw new ImportImpossible(fichier, e);
      }
      ```
      Les seules erreurs attendues sont `IOException` et `ParseException`.
    answer: |-
      ```java
      } catch (IOException | ParseException e) {
          throw new ImportImpossible(fichier, e);
      }
      ```
      `Exception` attrape aussi les bugs. Le multi-catch liste exactement les erreurs attendues ; les autres remontent
      telles quelles.
  - key: bug-methode-specifique
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: method getSQLState()`) :
      ```java
      } catch (IOException | SQLException e) {
          log.error("état SQL {}", e.getSQLState());
      }
      ```
    answer: |-
      ```java
      } catch (SQLException e) {
          log.error("état SQL {}", e.getSQLState(), e);
      } catch (IOException e) {
          log.error("erreur d'entrée-sortie", e);
      }
      ```
      Dans un multi-catch, `e` a le type du parent commun (`Exception`). Un traitement propre à un type demande son
      propre `catch`.
