notion: chainage-exceptions
lesson: |-
  **Chaîner** une exception, c'est en lever une nouvelle en lui donnant l'ancienne comme **cause**. On change de niveau
  d'abstraction sans perdre l'information d'origine :

  ```java
  public Commande charger(long id) {
      try {
          return jdbc.lire(id);
      } catch (SQLException e) {
          throw new DepotIndisponible("chargement de la commande " + id, e);   // e devient la cause
      }
  }
  ```

  ```
  DepotIndisponible: chargement de la commande 42
      at ...
  Caused by: java.sql.SQLTimeoutException: délai dépassé
      at ...
  ```

  - Les constructeurs de `Throwable` acceptent une cause : `(String message, Throwable cause)` ou `(Throwable cause)`.
    `getCause()` la renvoie ; `initCause` l'ajoute après coup, une seule fois.
  - Le constructeur `(Throwable cause)` prend comme message le `toString()` de la cause.
  - On enveloppe à la **frontière d'une couche** : le domaine ne doit pas voir de `SQLException`, l'API ne doit pas
    renvoyer de détails techniques. Le nouveau message ajoute le **contexte** de cette couche.
  - Pour trouver la cause racine, on remonte les `getCause()` jusqu'à `null`.
  - Envelopper sans cause (`new X(e.getMessage())`) perd la pile, les exceptions supprimées et le type d'origine.

  **Piège classique** : envelopper à chaque couche « par principe », jusqu'à cinq niveaux de `Caused by` qui répètent le
  même message. On n'enveloppe que pour changer d'abstraction ou ajouter un contexte.

  **En entretien** : « J'enveloppe à la frontière d'une couche, avec un message de contexte et toujours la cause ; la pile
  garde l'erreur d'origine sous `Caused by`. »
cards:
  - key: chainer-exceptions
    format: course
    question: Pourquoi chaîner les exceptions ?
    answer: Pour conserver la cause d'origine et son stacktrace.
  - key: quand-envelopper
    format: course
    question: Quand envelopper une exception dans une autre ?
    answer: À la frontière d'une couche, pour présenter l'erreur au bon niveau d'abstraction (une `SQLException` devient un `DepotIndisponible`) et ajouter le contexte de cette couche.
  - key: cause-racine
    format: course
    question: Comment trouver la cause racine d'une exception enveloppée plusieurs fois ?
    answer: En suivant `getCause()` jusqu'à ce qu'il renvoie `null` ; la dernière exception est la cause racine (c'est aussi le dernier `Caused by` de la pile).
  - key: init-cause
    format: course
    question: À quoi sert `initCause` ?
    answer: À attacher une cause à une exception qui n'a pas de constructeur à cause ; on ne peut l'appeler qu'une fois, et pas si la cause a déjà été donnée au constructeur.
  - key: vf-message-perdu
    format: true-false
    question: "`throw new ServiceIndisponible(e.getMessage());` conserve la pile d'origine."
    truth: false
    answer: Seul le texte est recopié ; la pile, le type et les exceptions supprimées de `e` sont perdus.
  - key: vf-get-cause
    format: true-false
    question: "`getCause()` renvoie l'exception passée comme cause au constructeur."
    truth: true
    answer: Ou `null` s'il n'y en a pas.
  - key: vf-message-cause
    format: true-false
    question: "`new RuntimeException(cause)` a pour message le `toString()` de la cause."
    truth: true
    answer: "Par exemple `java.io.IOException: disque`."
  - key: vf-chaque-couche
    format: true-false
    question: Il faut envelopper l'exception dans chaque méthode qu'elle traverse.
    truth: false
    answer: Seulement quand on change de niveau d'abstraction ou qu'on ajoute un contexte utile.
  - key: qcm-envelopper
    format: multiple-choice
    question: Quelles façons d'envelopper conservent la cause ?
    choices:
      - text: "`throw new DepotIndisponible(\"chargement \" + id, e);`"
        correct: true
      - text: "`throw new DepotIndisponible(e);`"
        correct: true
      - text: "`throw new DepotIndisponible(e.getMessage());`"
        correct: false
      - text: "`throw new DepotIndisponible(e.toString());`"
        correct: false
    answer: Il faut passer l'objet exception, pas son texte.
  - key: qcm-frontiere
    format: multiple-choice
    question: Pourquoi le domaine ne devrait-il pas voir de `SQLException` ?
    choices:
      - text: "Elle révèle un détail d'infrastructure dont le domaine ne doit pas dépendre"
        correct: true
      - text: "Elle ne peut pas être attrapée"
        correct: false
      - text: "Elle n'a pas de message"
        correct: false
      - text: "Elle est une `Error`"
        correct: false
    answer: L'infrastructure la traduit en exception de son port (`DepotIndisponible`), avec la cause.
  - key: qcm-lire
    format: multiple-choice
    question: Dans une pile, où apparaît la cause ?
    choices:
      - text: "Sous `Caused by:`"
        correct: true
      - text: "Sous `Suppressed:`"
        correct: false
      - text: "Dans la première ligne"
        correct: false
      - text: "Nulle part"
        correct: false
    answer: '`Suppressed:` est réservé aux exceptions supprimées.'
  - key: qcm-init-cause
    format: multiple-choice
    question: Que se passe-t-il si l'on appelle deux fois `initCause` sur la même exception ?
    choices:
      - text: "Une `IllegalStateException`"
        correct: true
      - text: "La seconde cause remplace la première"
        correct: false
      - text: "Les deux causes sont gardées"
        correct: false
      - text: "Rien"
        correct: false
    answer: Une cause ne peut être définie qu'une seule fois.
  - key: code-cause
    format: code-output
    question: |-
      ```java
      var racine = new IOException("disque");
      var e = new IllegalStateException("import", racine);
      System.out.println((e.getCause() == racine) + " " + e.getCause().getMessage());
      ```
    answer: '`true disque`.'
    check:
      output: "true disque"
  - key: code-racine
    format: code-output
    question: |-
      ```java
      Throwable e = new RuntimeException("a", new IllegalStateException("b", new IOException("c")));
      while (e.getCause() != null) {
          e = e.getCause();
      }
      System.out.println(e.getClass().getSimpleName() + " " + e.getMessage());
      ```
    answer: '`IOException c` : la cause racine, au bout de la chaîne.'
    check:
      output: "IOException c"
  - key: code-init-cause
    format: code-output
    question: |-
      ```java
      var e = new RuntimeException("x");
      e.initCause(new IOException("première"));
      e.initCause(new IOException("seconde"));
      ```
    answer: "Une `IllegalStateException` : la cause ne peut être définie qu'une fois."
    check:
      throws: IllegalStateException
  - key: code-message-cause
    format: code-output
    question: |-
      ```java
      System.out.println(new RuntimeException(new IOException("disque")).getMessage());
      ```
    answer: '`java.io.IOException: disque` : sans message explicite, c''est le `toString()` de la cause.'
    check:
      output: "java.io.IOException: disque"
  - key: bug-message-seul
    format: bug-fix
    question: |-
      La pile ne montre jamais quelle requête SQL a échoué :
      ```java
      } catch (SQLException e) {
          throw new DepotIndisponible("erreur base : " + e.getMessage());
      }
      ```
    answer: |-
      ```java
      } catch (SQLException e) {
          throw new DepotIndisponible("chargement de la commande " + id, e);
      }
      ```
      En passant `e` comme cause, sa pile apparaît sous `Caused by:`. Le message ajoute le contexte de la couche.
  - key: bug-fuite-technique
    format: bug-fix
    question: |-
      Le service métier déclare `throws SQLException`, et l'API renvoie des messages SQL aux clients :
      ```java
      public Commande commande(long id) throws SQLException {
          return depot.lire(id);
      }
      ```
    answer: |-
      ```java
      // dans l'adaptateur JDBC
      public Commande lire(long id) {
          try { ... }
          catch (SQLException e) { throw new DepotIndisponible("lecture de la commande " + id, e); }
      }

      // dans le service
      public Commande commande(long id) {
          return depot.lire(id);
      }
      ```
      L'infrastructure traduit l'erreur technique à sa frontière, avec la cause. Le domaine reste indépendant de JDBC, et
      l'API renvoie une erreur générique en journalisant le détail.
  - key: bug-enveloppes-inutiles
    format: bug-fix
    question: |-
      Chaque erreur produit cinq `Caused by` qui répètent « erreur » :
      ```java
      try { etape(); } catch (RuntimeException e) { throw new RuntimeException("erreur", e); }
      ```
      (Ce motif est répété dans chaque méthode de la chaîne d'appels.)
    answer: |-
      ```java
      etape();   // on laisse remonter
      ```
      Envelopper sans changer d'abstraction ni ajouter de contexte n'apporte que du bruit. On enveloppe à une vraie
      frontière, avec un message utile.
  - key: bug-cause-avalee
    format: bug-fix
    question: |-
      L'exception enveloppante n'a pas de constructeur à cause, et la cause est perdue :
      ```java
      } catch (IOException e) {
          throw new ConfigurationInvalide("fichier illisible : " + chemin);
      }
      ```
    answer: |-
      ```java
      } catch (IOException e) {
          throw (ConfigurationInvalide) new ConfigurationInvalide("fichier illisible : " + chemin).initCause(e);
      }
      // mieux : ajouter un constructeur ConfigurationInvalide(String message, Throwable cause)
      ```
      `initCause` permet d'attacher la cause quand on ne peut pas modifier l'exception ; si on le peut, un constructeur à
      cause est plus lisible.
