notion: exceptions-supprimees
lesson: |-
  Quand le corps d'un `try-with-resources` lève une exception et que la fermeture de la ressource en lève une
  **autre**, Java garde les deux : l'exception du corps remonte, et celle de `close()` lui est **attachée** comme
  exception **supprimée** (*suppressed*, Java 7).

  ```java
  try (Connexion c = ouvrir()) {
      c.envoyer(message);          // lève EnvoiImpossible
  }                                // close() lève aussi ConnexionPerdue
  // → EnvoiImpossible remonte ; e.getSuppressed()[0] est la ConnexionPerdue
  ```

  Dans la pile affichée, elle apparaît sous **`Suppressed:`** :

  ```
  EnvoiImpossible: message refusé
      at ...
      Suppressed: ConnexionPerdue: socket fermée
          at ...
  ```

  - `getSuppressed()` renvoie le tableau des exceptions supprimées ; `addSuppressed(t)` permet d'en attacher à la main
    (utile pour regrouper plusieurs échecs).
  - Avec plusieurs ressources, chaque échec de fermeture s'ajoute, dans l'ordre de fermeture (l'inverse de l'ouverture).
  - Si seul `close()` échoue, son exception remonte normalement, sans exception supprimée.
  - Avec un `try`/`finally` écrit à la main, l'exception de `close()` **remplace** celle du corps, qui est perdue : c'est
    le problème que ce mécanisme résout.
  - Journaliser l'exception elle-même (`log.error("...", e)`) affiche aussi ses exceptions supprimées.

  **Piège classique** : relancer `new RuntimeException(e.getMessage())`. On perd la pile, la cause et les exceptions
  supprimées ; on passe `e` comme cause.

  **En entretien** : « Quand le corps et `close()` échouent, l'exception du corps remonte et celle de `close()` lui est
  attachée comme supprimée : rien n'est perdu. »
cards:
  - key: exception-try-close
    format: course
    question: "Dans un `try-with-resources`, que devient l'exception de `close()` quand le corps a déjà levé ?"
    choices:
      - {text: "Elle est attachée comme exception supprimée, lisible par `getSuppressed()`", correct: true}
      - {text: "Elle remplace celle du corps, qui disparaît", correct: false}
      - {text: "Elle devient la cause de l'exception du corps, lisible par `getCause()`", correct: false}
      - {text: "Elle est ignorée, sans laisser de trace", correct: false}
    answer: "Celle du corps remonte, et celle de `close()` lui est attachée comme exception supprimée, accessible par `getSuppressed()`. Ce n'est pas une cause : `getCause()` ne la donne pas."
  - key: seul-close
    format: course
    question: Que se passe-t-il si seul `close()` lève une exception ?
    choices:
      - {text: "Son exception remonte normalement ; il n'y a pas d'exception supprimée", correct: true}
      - {text: "Elle est attachée comme supprimée à une exception vide créée par la JVM", correct: false}
      - {text: "Elle est ignorée, puisque le corps s'est terminé sans erreur", correct: false}
      - {text: "Elle est enveloppée par la JVM dans une `IllegalStateException`", correct: false}
    answer: Son exception remonte normalement, comme si elle avait été levée par le bloc ; il n'y a pas d'exception supprimée.
  - key: add-suppressed
    format: course
    question: À quoi sert `addSuppressed` ?
    choices:
      - {text: "À attacher une exception secondaire à une principale, sans en perdre aucune", correct: true}
      - {text: "À supprimer une exception pour qu'elle ne remonte pas à l'appelant", correct: false}
      - {text: "À remplacer la cause d'une exception par une autre exception", correct: false}
      - {text: "À masquer la pile d'une exception dans les journaux", correct: false}
    answer: À attacher à la main une exception secondaire à une exception principale, par exemple pour regrouper les échecs d'un traitement par lot sans en perdre aucun.
  - key: vs-finally
    format: course
    question: Pourquoi un `close()` dans un `finally` est-il moins bon ?
    choices:
      - {text: "Si le corps et `close()` échouent, l'exception de `close()` remplace celle du corps", correct: true}
      - {text: "Un `finally` ne s'exécute pas quand le corps lève une exception", correct: false}
      - {text: "`close()` est alors appelé deux fois : à la sortie, puis par le ramasse-miettes", correct: false}
      - {text: "Le `finally` attache l'exception de `close()` comme supprimée, ce qui alourdit la pile", correct: false}
    answer: Si le corps et `close()` échouent, l'exception de `close()` remplace celle du corps, qui disparaît ; `try-with-resources` garde les deux.
  - key: vf-perdue
    format: true-false
    question: Avec `try-with-resources`, une exception levée par `close()` pendant une autre exception est perdue.
    truth: false
    answer: Elle est attachée comme exception supprimée.
  - key: vf-get-suppressed
    format: true-false
    question: "`getSuppressed()` renvoie un tableau."
    truth: true
    answer: Il peut contenir plusieurs exceptions, une par ressource qui a échoué à se fermer.
  - key: vf-version
    format: true-false
    question: Les exceptions supprimées sont apparues avec Java 7.
    truth: true
    answer: En même temps que `try-with-resources`.
  - key: vf-journal
    format: true-false
    question: "`log.error(\"échec\", e)` affiche aussi les exceptions supprimées de `e`."
    truth: true
    answer: Elles font partie de la pile affichée, sous `Suppressed:`.
  - key: qcm-remonte
    format: multiple-choice
    question: Le corps lève `A`, puis `close()` lève `B`. Que reçoit le `catch` ?
    choices:
      - text: "`A`, avec `B` dans `getSuppressed()`"
        correct: true
      - text: "`B`, avec `A` comme cause"
        correct: false
      - text: "`A` seule, `B` est perdue"
        correct: false
      - text: "`B` seule"
        correct: false
    answer: L'exception principale est celle du corps.
  - key: qcm-affichage
    format: multiple-choice
    question: Sous quel libellé une pile affiche-t-elle les exceptions supprimées ?
    choices:
      - text: "`Suppressed:`"
        correct: true
      - text: "`Caused by:`"
        correct: false
      - text: "`Hidden:`"
        correct: false
      - text: "`... more`"
        correct: false
    answer: '`Caused by` est réservé à la cause.'
  - key: qcm-perdre
    format: multiple-choice
    question: Quelles façons de relancer perdent les exceptions supprimées ?
    choices:
      - text: "`throw new RuntimeException(e.getMessage());`"
        correct: true
      - text: "`throw new RuntimeException(\"échec\");`"
        correct: true
      - text: "`throw new RuntimeException(\"échec\", e);`"
        correct: false
      - text: "`throw e;`"
        correct: false
    answer: En passant `e` comme cause (ou en la relançant), ses exceptions supprimées restent accessibles.
  - key: qcm-lot
    format: multiple-choice
    question: Un traitement par lot veut signaler tous les éléments en échec par une seule exception. Comment ?
    choices:
      - {text: "Créer une exception principale et lui ajouter chaque échec avec `addSuppressed`", correct: true}
      - {text: "Ne garder que la dernière exception levée, qui résume en général les précédentes", correct: false}
      - {text: "Concaténer les messages de tous les échecs dans une `String`, puis la lever", correct: false}
      - {text: "Lever la première exception rencontrée et ignorer toutes celles qui suivent", correct: false}
    answer: Chaque échec garde sa pile.
  - key: code-supprimee
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record R() implements AutoCloseable {
          public void close() { throw new IllegalStateException("close"); }
      }
      try (R r = new R()) {
          throw new RuntimeException("corps");
      } catch (RuntimeException e) {
          System.out.println(e.getMessage() + " " + e.getSuppressed()[0].getMessage());
      }
      ```
    choices:
      - {text: "`corps close`", correct: true}
      - {text: "`close corps`", correct: false}
      - {text: "`corps null`", correct: false}
      - {text: "Une `ArrayIndexOutOfBoundsException`", correct: false}
    answer: '`corps close` : l''exception du corps remonte, celle de `close` est supprimée.'
    check:
      output: "corps close"
  - key: code-seul-close
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record R() implements AutoCloseable {
          public void close() { throw new IllegalStateException("close"); }
      }
      try (R r = new R()) {
          System.out.print("ok ");
      } catch (RuntimeException e) {
          System.out.println(e.getMessage() + " " + e.getSuppressed().length);
      }
      ```
    choices:
      - {text: "`ok close 0`", correct: true}
      - {text: "`ok close 1`", correct: false}
      - {text: "`ok`", correct: false}
      - {text: "`close 0`", correct: false}
    answer: '`ok close 0` : sans exception dans le corps, celle de `close` remonte seule.'
    check:
      output: "ok close 0"
  - key: code-add-suppressed
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      var principale = new RuntimeException("principale");
      principale.addSuppressed(new IllegalStateException("secondaire"));
      System.out.println(principale.getSuppressed().length + " " + principale.getSuppressed()[0].getMessage());
      ```
    choices:
      - {text: "`1 secondaire`", correct: true}
      - {text: "`0 secondaire`", correct: false}
      - {text: "`1 principale`", correct: false}
      - {text: "`1 null`", correct: false}
    answer: '`1 secondaire`.'
    check:
      output: "1 secondaire"
  - key: code-deux-ressources
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record R(String nom) implements AutoCloseable {
          public void close() { throw new IllegalStateException(nom); }
      }
      try (R a = new R("a"); R b = new R("b")) {
          throw new RuntimeException("corps");
      } catch (RuntimeException e) {
          System.out.println(e.getMessage() + " " + Arrays.stream(e.getSuppressed()).map(Throwable::getMessage).toList());
      }
      ```
    choices:
      - {text: "`corps [b, a]`", correct: true}
      - {text: "`corps [a, b]`", correct: false}
      - {text: "`b [a]`", correct: false}
      - {text: "`corps [a]`", correct: false}
    answer: '`corps [b, a]` : une exception supprimée par ressource, dans l''ordre de fermeture.'
    check:
      output: "corps [b, a]"
  - key: bug-finally-masque
    format: bug-fix
    question: |-
      Les journaux ne montrent que « connexion perdue », jamais la vraie raison de l'échec de l'envoi. Quelle correction est la bonne ?
      ```java
      Connexion c = ouvrir();
      try {
          c.envoyer(message);
      } finally {
          c.close();
      }
      ```
    choices:
      - {text: "Un `try-with-resources`, qui garde l'erreur d'envoi et lui attache celle de fermeture", correct: true}
      - {text: "Appeler `c.close()` avant `c.envoyer(message)`, dans le `try`", correct: false}
      - {text: "Journaliser l'erreur d'envoi dans le `finally`, avant `c.close()`", correct: false}
      - {text: "Déclarer `c` en `final`, pour que `close()` voie l'exception d'origine", correct: false}
    answer: |-
      ```java
      try (Connexion c = ouvrir()) {
          c.envoyer(message);
      }
      ```
      Dans un `finally`, l'exception de `close()` remplace celle d'`envoyer`. `try-with-resources` garde l'erreur
      d'envoi et lui attache celle de fermeture.
  - key: bug-message-seul
    format: bug-fix
    question: |-
      Après ce relancement, les exceptions supprimées et la pile d'origine ont disparu. Quelle correction est la bonne ?
      ```java
      } catch (IOException e) {
          throw new ExportImpossible(e.getMessage());
      }
      ```
    choices:
      - {text: "Passer `e` comme cause : `new ExportImpossible(\"export de \" + fichier, e)`", correct: true}
      - {text: "Ajouter `e.getSuppressed()` au message de `ExportImpossible`", correct: false}
      - {text: "Appeler `e.printStackTrace()` juste avant de relancer", correct: false}
      - {text: "Passer `e.toString()` au lieu de `e.getMessage()`", correct: false}
    answer: |-
      ```java
      } catch (IOException e) {
          throw new ExportImpossible("export de " + fichier, e);
      }
      ```
      En passant `e` comme cause, sa pile et ses exceptions supprimées restent dans la trace (`Caused by:` puis
      `Suppressed:`).
  - key: bug-lot-premiere
    format: bug-fix
    question: |-
      Sur un lot de 100 fichiers, seul le premier échec est signalé :
      ```java
      for (Path f : fichiers) {
          importer(f);   // lève à la première erreur
      }
      ```
      On veut importer tous les fichiers valides et signaler tous les échecs. Quelle correction est la bonne ?
    choices:
      - {text: "Attraper chaque échec et l'attacher à une exception principale par `addSuppressed`", correct: true}
      - {text: "Attraper chaque échec, l'ignorer, et passer au fichier suivant sans rien signaler", correct: false}
      - {text: "Concaténer les messages d'erreur dans une chaîne, levée à la fin du lot", correct: false}
      - {text: "Paralléliser l'import, pour que chaque échec soit signalé par son propre thread", correct: false}
    answer: |-
      ```java
      ImportPartiel erreurs = new ImportPartiel();
      for (Path f : fichiers) {
          try {
              importer(f);
          } catch (ImportImpossible e) {
              erreurs.addSuppressed(e);
          }
      }
      if (erreurs.getSuppressed().length > 0) {
          throw erreurs;
      }
      ```
      Chaque échec est attaché à l'exception principale avec sa propre pile, au lieu de s'arrêter au premier ou de
      concaténer des messages.
  - key: bug-catch-close
    format: bug-fix
    question: |-
      Ce code avale toute erreur de fermeture, y compris celle qui signale que les données n'ont pas été écrites. Quelle correction est la bonne ?
      ```java
      try {
          ecrivain.write(donnees);
      } finally {
          try { ecrivain.close(); } catch (IOException ignoree) { }
      }
      ```
    choices:
      - {text: "Un `try-with-resources`, qui propage l'erreur de `close()` ou l'attache comme supprimée", correct: true}
      - {text: "Journaliser l'`IOException` de `close()` au lieu de l'ignorer, puis continuer", correct: false}
      - {text: "Appeler `close()` deux fois, pour être sûr que les données sont écrites", correct: false}
      - {text: "Fermer l'écrivain avant `write`, pour éviter l'erreur de fermeture", correct: false}
    answer: |-
      ```java
      try (ecrivain) {
          ecrivain.write(donnees);
      }
      ```
      Pour un flux en écriture, `close()` vide le tampon : son échec signifie souvent des données perdues. `try-with-resources`
      propage cette erreur, ou l'attache comme supprimée si `write` a déjà échoué.
