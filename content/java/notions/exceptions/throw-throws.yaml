notion: throw-throws
lesson: |-
  Deux mots-clés proches, deux rôles :

  - **`throw`** (une instruction) **lève** une exception, ici et maintenant ;
  - **`throws`** (dans la signature) **déclare** les exceptions vérifiées qu'une méthode peut laisser remonter.

  ```java
  public void retirer(double montant) {
      if (montant <= 0) {
          throw new IllegalArgumentException("montant non positif : " + montant);   // lève
      }
      ...
  }

  public String lire(Path chemin) throws IOException {      // déclare
      return Files.readString(chemin);
  }
  ```

  - `throw` attend un objet `Throwable` : on écrit `throw new ...`. Le code qui suit un `throw` dans le même bloc est
    **inatteignable** (erreur de compilation).
  - `throw null;` lève une `NullPointerException`.
  - `throws` est obligatoire pour une exception **vérifiée** non attrapée ; pour une non vérifiée, il est permis mais on
    préfère documenter avec `@throws` dans la Javadoc.
  - Un bon **message** donne le contexte : la valeur reçue, l'identifiant concerné. « Erreur » ne dit rien.
  - Valider les arguments au début de la méthode et lever tout de suite : c'est le principe **fail fast**.

  **Piège classique** : `new IllegalArgumentException("...")` sans `throw`. L'exception est créée puis oubliée, et le
  code continue comme si de rien n'était.

  **En entretien** : « `throw` lève une exception, `throws` déclare celles qu'une méthode laisse remonter ; je valide tôt
  et je mets le contexte dans le message. »
tour:
  - title: throw et throws
    text: |-
      `throw` lève une exception : `throw new IllegalArgumentException("montant invalide");`. `throws`, dans la
      signature, **déclare** les exceptions vérifiées qu'une méthode peut laisser échapper :
      `void retire(double montant) throws SoldeInsuffisantException`.

      On lève l'exception la plus précise qui existe (`IllegalArgumentException`, `IllegalStateException`), avec un
      message qui dit ce qui ne va pas. Une exception métier se crée en héritant d'`Exception` (vérifiée) ou de
      `RuntimeException`.
    example:
      files:
        Main.java: |-
          class SoldeInsuffisantException extends Exception {
              SoldeInsuffisantException(double manque) {
                  super("il manque " + manque + " €");
              }
          }

          double solde = 50;

          void retire(double montant) throws SoldeInsuffisantException {
              if (montant <= 0) {
                  throw new IllegalArgumentException("montant invalide : " + montant);
              }
              if (montant > solde) {
                  throw new SoldeInsuffisantException(montant - solde);
              }
              solde -= montant;
          }

          void main() {
              try {
                  retire(20);
                  retire(40);
              } catch (SoldeInsuffisantException e) {
                  IO.println(e.getMessage());
              }
              IO.println("solde : " + solde);
          }
      output: |-
        il manque 10.0 €
        solde : 30.0
cards:
  - key: throw-vs-throws
    format: course
    question: throw vs throws ?
    answer: throw lève une exception ; throws déclare celles qu'une méthode peut propager.
  - key: throws-obligatoire
    format: course
    question: Quand `throws` est-il obligatoire ?
    answer: Quand une méthode laisse remonter une exception vérifiée sans l'attraper ; pour une exception non vérifiée, il est facultatif.
  - key: message
    format: course
    question: Qu'est-ce qu'un bon message d'exception ?
    answer: 'Un message qui donne le contexte utile pour comprendre et corriger : la valeur reçue, l''identifiant concerné, la règle violée (`"montant non positif : -5"`).'
  - key: fail-fast
    format: course
    question: Qu'est-ce que le principe *fail fast* ?
    answer: Vérifier les entrées au début et lever une exception dès qu'elles sont invalides, plutôt que de continuer et d'échouer plus loin, loin de la cause.
  - key: vf-throws-unchecked
    format: true-false
    question: Une méthode qui lève une `IllegalStateException` doit la déclarer avec `throws`.
    truth: false
    answer: Une exception non vérifiée n'a pas à être déclarée.
  - key: vf-inatteignable
    format: true-false
    question: Une instruction placée juste après un `throw`, dans le même bloc, est inatteignable.
    truth: true
    answer: Le compilateur la refuse.
  - key: vf-throw-null
    format: true-false
    question: "`throw null;` ne fait rien."
    truth: false
    answer: Il lève une `NullPointerException`.
  - key: vf-new-sans-throw
    format: true-false
    question: "`new IllegalArgumentException(\"x\");` seul suffit à interrompre la méthode."
    truth: false
    answer: L'objet est créé mais pas levé ; il faut `throw`.
  - key: qcm-lever
    format: multiple-choice
    question: Comment lever une exception pour un âge négatif ?
    choices:
      - text: "`throw new IllegalArgumentException(\"âge négatif : \" + age);`"
        correct: true
      - text: "`throws new IllegalArgumentException(\"âge négatif\");`"
        correct: false
      - text: "`throw IllegalArgumentException(\"âge négatif\");`"
        correct: false
      - text: "`return new IllegalArgumentException(\"âge négatif\");`"
        correct: false
    answer: '`throw`, suivi d''un objet exception créé avec `new`.'
  - key: qcm-declarer
    format: multiple-choice
    question: Quelle signature déclare qu'une méthode peut laisser remonter une `IOException` ?
    choices:
      - text: "`String lire(Path p) throws IOException`"
        correct: true
      - text: "`String lire(Path p) throw IOException`"
        correct: false
      - text: "`String lire(Path p) catch IOException`"
        correct: false
      - text: "`throws IOException String lire(Path p)`"
        correct: false
    answer: '`throws` se place après les paramètres.'
  - key: qcm-message
    format: multiple-choice
    question: Quel message est le plus utile ?
    choices:
      - text: "\"commande 42 introuvable\""
        correct: true
      - text: "\"erreur\""
        correct: false
      - text: "\"une exception est survenue\""
        correct: false
      - text: "Aucun message"
        correct: false
    answer: Le message donne l'identifiant concerné.
  - key: qcm-plusieurs
    format: multiple-choice
    question: Comment déclarer deux exceptions vérifiées ?
    choices:
      - text: "`void m() throws IOException, SQLException`"
        correct: true
      - text: "`void m() throws IOException | SQLException`"
        correct: false
      - text: "`void m() throws IOException throws SQLException`"
        correct: false
      - text: "`void m() throws (IOException, SQLException)`"
        correct: false
    answer: Les types se séparent par des virgules.
  - key: trous-throw
    format: fill-in
    question: |-
      Complétez pour refuser un montant négatif :
      ```java
      if (montant < 0) {
          ___ new IllegalArgumentException("montant négatif : " + montant);
      }
      ```
    blanks: [[throw]]
    answer: '`throw` lève l''exception.'
  - key: trous-throws
    format: fill-in
    question: |-
      Complétez la signature :
      ```java
      String lire(Path chemin) ___ IOException {
          return Files.readString(chemin);
      }
      ```
    blanks: [[throws]]
    answer: '`throws` déclare l''exception vérifiée que la méthode laisse remonter.'
  - key: trous-new
    format: fill-in
    question: |-
      Complétez :
      ```java
      throw ___ IllegalStateException("commande déjà expédiée");
      ```
    blanks: [[new]]
    answer: On lève un objet, qu'il faut créer.
  - key: trous-type
    format: fill-in
    question: |-
      Complétez avec l'exception adaptée à un objet dans le mauvais état pour l'opération :
      ```java
      if (commande.estAnnulee()) {
          throw new ___("commande annulée : " + commande.id());
      }
      ```
    blanks: [[IllegalStateException]]
    answer: '`IllegalArgumentException` vise un argument invalide, `IllegalStateException` un état qui interdit l''opération.'
  - key: code-message
    format: code-output
    question: |-
      ```java
      try {
          throw new IllegalArgumentException("montant négatif : -5");
      } catch (IllegalArgumentException e) {
          System.out.println(e.getMessage());
      }
      ```
    answer: '`montant négatif : -5`.'
    check:
      output: "montant négatif : -5"
  - key: code-throw-null
    format: code-output
    question: |-
      ```java
      RuntimeException r = null;
      throw r;
      ```
    answer: "Une `NullPointerException` : on ne peut pas lever `null`."
    check:
      throws: NullPointerException
  - key: code-inatteignable
    format: code-output
    question: |-
      ```java
      static int f() {
          throw new IllegalStateException();
          return 1;
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `unreachable statement`.'
    check:
      compiles: false
  - key: code-validation
    format: code-output
    question: |-
      ```java
      static void valider(int x) {
          if (x < 0) throw new IllegalArgumentException("x=" + x);
      }
      try {
          valider(5);
          valider(-2);
          valider(-3);
      } catch (IllegalArgumentException e) {
          System.out.println(e.getMessage());
      }
      ```
    answer: '`x=-2` : la première valeur invalide interrompt le bloc.'
    check:
      output: "x=-2"
  - key: bug-sans-throw
    format: bug-fix
    question: |-
      Les commandes à quantité nulle sont acceptées :
      ```java
      if (quantite <= 0) {
          new IllegalArgumentException("quantité invalide : " + quantite);
      }
      ```
    answer: |-
      ```java
      if (quantite <= 0) {
          throw new IllegalArgumentException("quantité invalide : " + quantite);
      }
      ```
      Sans `throw`, l'exception est créée puis abandonnée, et la méthode continue.
  - key: bug-sans-new
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: method IllegalStateException(String)`) :
      ```java
      throw IllegalStateException("déjà payée");
      ```
    answer: |-
      ```java
      throw new IllegalStateException("déjà payée");
      ```
      On lève un objet : il faut le créer avec `new`.
  - key: bug-message-vide
    format: bug-fix
    question: |-
      Les journaux affichent `java.lang.IllegalArgumentException` sans autre information :
      ```java
      if (taux < 0 || taux > 1) {
          throw new IllegalArgumentException();
      }
      ```
    answer: |-
      ```java
      if (taux < 0 || taux > 1) {
          throw new IllegalArgumentException("taux hors de [0, 1] : " + taux);
      }
      ```
      Le message donne la valeur reçue et la règle : on comprend l'erreur sans déboguer.
  - key: bug-validation-tardive
    format: bug-fix
    question: |-
      Une remise invalide n'est détectée qu'au calcul de la facture, longtemps après sa saisie :
      ```java
      Remise(double pourcentage) {
          this.pourcentage = pourcentage;
      }
      ```
    answer: |-
      ```java
      Remise(double pourcentage) {
          if (pourcentage < 0 || pourcentage > 100) {
              throw new IllegalArgumentException("pourcentage hors de [0, 100] : " + pourcentage);
          }
          this.pourcentage = pourcentage;
      }
      ```
      *Fail fast* : la remise invalide est refusée à sa création, là où l'on sait d'où elle vient.
