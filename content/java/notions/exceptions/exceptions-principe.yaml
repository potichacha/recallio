notion: exceptions-principe
lesson: |-
  Une **exception** signale qu'une opération ne peut pas se dérouler normalement : un fichier absent, un argument
  invalide, une division par zéro. Elle **interrompt** le flux du code et **remonte** la pile d'appels jusqu'au premier
  `catch` capable de la traiter.

  ```java
  static int diviser(int a, int b) {
      return a / b;                       // b == 0 : ArithmeticException, la suite ne s'exécute pas
  }

  try {
      int r = diviser(10, 0);
      afficher(r);                        // jamais atteint
  } catch (ArithmeticException e) {
      System.out.println("division impossible : " + e.getMessage());
  }
  ```

  Pourquoi des exceptions plutôt que des **codes d'erreur** (`return -1`) ?
  - on ne peut pas les **ignorer par oubli** : une exception non traitée arrête le thread et se voit ;
  - le code normal reste lisible, sans tester un code de retour après chaque appel ;
  - elles portent une **information** : un type, un message, la pile d'appels, une cause ;
  - elles traversent plusieurs couches jusqu'à celle qui sait réagir.

  Une exception non attrapée remonte jusqu'en haut du thread : le programme affiche sa pile d'appels et le thread
  s'arrête.

  Les exceptions sont faites pour les cas **exceptionnels** : on ne s'en sert pas pour piloter une boucle ordinaire.

  **Piège classique** : un `catch` vide (`catch (Exception e) { }`). L'erreur disparaît, et le programme continue dans un
  état faux, sans aucune trace.

  **En entretien** : « Une exception interrompt le flux et remonte la pile jusqu'à un `catch` ; contrairement à un code
  d'erreur, on ne peut pas l'ignorer par mégarde. »
tour:
  - title: Pourquoi des exceptions
    text: |-
      Quand une méthode ne peut pas faire son travail (un fichier absent, une division par zéro, un argument absurde),
      elle **lève une exception** : l'exécution normale s'arrête, et l'exception remonte la pile d'appels jusqu'à un
      bloc qui sait la traiter.

      Le code du cas normal reste lisible, et l'erreur ne peut pas être ignorée par oubli : non traitée, elle arrête le
      programme, avec un message et la pile d'appels.
    example:
      files:
        Main.java: |-
          int divise(int a, int b) {
              return a / b;
          }

          void main() {
              IO.println(divise(10, 2));
              try {
                  IO.println(divise(1, 0));
                  IO.println("jamais affiché");
              } catch (ArithmeticException e) {
                  IO.println("erreur : " + e.getMessage());
              }
              IO.println("le programme continue");
          }
      output: |-
        5
        erreur : / by zero
        le programme continue
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'une exception ?
    choices:
      - {text: "Un objet qui signale une opération anormale et remonte la pile jusqu'à un `catch`", correct: true}
      - {text: "Un code de retour négatif renvoyé par une méthode pour signaler un échec", correct: false}
      - {text: "Une erreur de compilation que le compilateur transforme en avertissement", correct: false}
      - {text: "Un message écrit dans les journaux, sans effet sur le déroulement du code", correct: false}
    answer: Un objet qui signale qu'une opération ne peut pas se dérouler normalement ; levée, elle interrompt le code et remonte la pile d'appels jusqu'à un `catch` qui la traite.
  - key: vs-codes-erreur
    format: course
    question: Pourquoi préférer une exception à un code d'erreur comme `return -1` ?
    choices:
      - {text: "Un code d'erreur s'ignore sans bruit ; une exception ne passe pas inaperçue et porte type, message et pile", correct: true}
      - {text: "Un code d'erreur est plus lent, car la JVM vérifie chaque valeur de retour d'une méthode", correct: false}
      - {text: "Un code d'erreur ne peut pas être un `int` négatif en Java, faute de type signé", correct: false}
      - {text: "Un code d'erreur oblige à déclarer `throws` dans chaque signature qui le renvoie", correct: false}
    answer: Un code d'erreur peut être ignoré sans que rien ne le signale, et il encombre chaque appel ; l'exception ne peut pas passer inaperçue, porte un type, un message et une pile, et laisse le code normal lisible.
  - key: propagation
    format: course
    question: Que se passe-t-il quand aucun `catch` ne traite une exception ?
    choices:
      - {text: "Elle remonte toute la pile du thread, qui s'arrête ; la JVM affiche type, message et pile", correct: true}
      - {text: "Elle est ignorée, et l'exécution reprend à l'instruction suivante", correct: false}
      - {text: "La méthode qui l'a levée renvoie `null` ou 0 à son appelant", correct: false}
      - {text: "La JVM relance l'instruction qui a échoué jusqu'à ce qu'elle réussisse", correct: false}
    answer: Elle remonte toute la pile du thread, qui s'arrête ; la JVM affiche le type, le message et la pile d'appels.
  - key: exceptionnel
    format: course
    question: Faut-il utiliser une exception pour terminer une boucle ordinaire ?
    choices:
      - {text: "Non : elles sont faites pour les situations anormales, et une condition de boucle suffit", correct: true}
      - {text: "Oui : c'est la façon la plus rapide de sortir d'une boucle, même imbriquée", correct: false}
      - {text: "Oui, à condition d'attraper l'exception juste après la boucle", correct: false}
      - {text: "Non : une boucle ne peut pas contenir de `throw` en Java", correct: false}
    answer: "Non : les exceptions sont faites pour les situations anormales ; elles coûtent cher et rendent le flux difficile à suivre. Une condition de boucle suffit."
  - key: vf-interrompt
    format: true-false
    question: Quand une exception est levée, les instructions suivantes du bloc `try` s'exécutent quand même.
    truth: false
    answer: Le flux saute directement au `catch` correspondant (ou remonte la pile).
  - key: vf-remonte
    format: true-false
    question: Une exception peut être attrapée par une méthode qui appelle, de loin, celle qui l'a levée.
    truth: true
    answer: Elle remonte la pile d'appels jusqu'au premier `catch` adapté.
  - key: vf-ignorer
    format: true-false
    question: Un code de retour d'erreur peut être ignoré sans que le compilateur le signale.
    truth: true
    answer: C'est précisément le défaut que les exceptions corrigent.
  - key: vf-catch-vide
    format: true-false
    question: Un `catch` vide est une bonne façon de rendre un programme robuste.
    truth: false
    answer: Il cache l'erreur et laisse le programme continuer dans un état faux.
  - key: qcm-informations
    format: multiple-choice
    question: Quelles informations porte une exception ?
    choices:
      - text: "Son type"
        correct: true
      - text: "Un message"
        correct: true
      - text: "La pile d'appels au moment où elle a été créée"
        correct: true
      - text: "La valeur de toutes les variables locales"
        correct: false
    answer: Elle peut aussi porter une cause, l'exception d'origine.
  - key: qcm-non-attrapee
    format: multiple-choice
    question: Que se passe-t-il pour une exception jamais attrapée dans le thread principal ?
    choices:
      - {text: "Le thread s'arrête et la pile d'appels est affichée", correct: true}
      - {text: "L'exception est ignorée et le programme continue", correct: false}
      - {text: "La méthode en cause renvoie 0 à son appelant", correct: false}
      - {text: "La JVM recommence l'instruction qui a échoué", correct: false}
    answer: Dans un serveur, c'est le framework qui attrape et traduit en réponse d'erreur.
  - key: qcm-cas
    format: multiple-choice
    question: Dans quels cas lever une exception est-il justifié ?
    choices:
      - text: "Un argument invalide passé à une méthode"
        correct: true
      - text: "Un fichier de configuration introuvable"
        correct: true
      - text: "La fin normale d'une liste qu'on parcourt"
        correct: false
      - text: "Un utilisateur qui clique sur « Annuler », comportement prévu"
        correct: false
    answer: Les deux derniers sont des cas normaux du flux.
  - key: qcm-ou-traiter
    format: multiple-choice
    question: Où traiter une exception ?
    choices:
      - {text: "Dans la couche qui sait quoi faire (réessayer, répondre une erreur, utiliser une valeur par défaut)", correct: true}
      - {text: "Le plus près possible de l'endroit où elle est levée, toujours, pour ne jamais la laisser remonter", correct: false}
      - {text: "Dans chaque méthode qu'elle traverse, qui la journalise puis la relance à son appelant", correct: false}
      - {text: "Nulle part : la JVM s'en charge et affiche un message clair à l'utilisateur final", correct: false}
    answer: Les couches intermédiaires la laissent remonter.
  - key: code-interruption
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static int diviser(int a, int b) { return a / b; }
      try {
          System.out.print("avant ");
          diviser(1, 0);
          System.out.print("jamais ");
      } catch (ArithmeticException e) {
          System.out.print("attrapée");
      }
      ```
    choices:
      - {text: "`avant attrapée`", correct: true}
      - {text: "`avant jamais attrapée`", correct: false}
      - {text: "`attrapée`", correct: false}
      - {text: "`avant jamais`", correct: false}
    answer: '`avant attrapée` : la division par zéro interrompt le bloc `try`.'
    check:
      output: "avant attrapée"
  - key: code-remontee
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static void c() { throw new IllegalStateException("c"); }
      static void b() { c(); }
      static void a() {
          try { b(); } catch (IllegalStateException e) { System.out.println("a attrape " + e.getMessage()); }
      }
      a();
      ```
    choices:
      - {text: "`a attrape c`", correct: true}
      - {text: "`a attrape b`", correct: false}
      - {text: "`a attrape null`", correct: false}
      - {text: "Une `IllegalStateException` non attrapée", correct: false}
    answer: '`a attrape c` : l''exception traverse `b` sans s''arrêter.'
    check:
      output: "a attrape c"
  - key: code-non-attrapee
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      int n = Integer.parseInt("douze");
      System.out.println(n);
      ```
    choices:
      - {text: "Une `NumberFormatException`", correct: true}
      - {text: "`0`, la valeur par défaut d'un `int`", correct: false}
      - {text: "`12`, le nombre écrit en lettres", correct: false}
      - {text: "`douze`, la chaîne lue telle quelle", correct: false}
    answer: "Une `NumberFormatException`, jamais attrapée : rien n'est affiché."
    check:
      throws: NumberFormatException
  - key: code-message
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      try {
          throw new IllegalArgumentException("âge négatif");
      } catch (IllegalArgumentException e) {
          System.out.println(e.getMessage());
      }
      ```
    choices:
      - {text: "`âge négatif`", correct: true}
      - {text: "`java.lang.IllegalArgumentException: âge négatif`", correct: false}
      - {text: "`IllegalArgumentException`", correct: false}
      - {text: "`null`", correct: false}
    answer: '`âge négatif`.'
    check:
      output: "âge négatif"
  - key: bug-code-retour
    format: bug-fix
    question: |-
      Un appelant a oublié de tester le code de retour et a débité un compte vide. Quelle correction est la bonne ?
      ```java
      int retirer(double montant) {
          if (montant > solde) return -1;
          solde -= montant;
          return 0;
      }
      ```
    choices:
      - {text: "Lever une exception `SoldeInsuffisant` au lieu de renvoyer -1", correct: true}
      - {text: "Renvoyer -2 pour un solde insuffisant, plus explicite que -1", correct: false}
      - {text: "Renvoyer un `boolean` au lieu d'un `int`, plus simple à tester", correct: false}
      - {text: "Documenter le code -1 dans la Javadoc de la méthode", correct: false}
    answer: |-
      ```java
      void retirer(double montant) {
          if (montant > solde) {
              throw new SoldeInsuffisant(solde, montant);
          }
          solde -= montant;
      }
      ```
      Un code de retour s'ignore sans bruit. Une exception ne peut pas passer inaperçue, et son type dit ce qui s'est
      passé.
  - key: bug-catch-vide
    format: bug-fix
    question: |-
      La configuration utilise silencieusement des valeurs par défaut quand le fichier est corrompu. Quelle correction est la bonne ?
      ```java
      try {
          config = lire(fichier);
      } catch (Exception e) {
      }
      ```
    choices:
      - {text: "Attraper l'exception précise et lever `ConfigurationInvalide` avec la cause", correct: true}
      - {text: "Ajouter `e.printStackTrace()` dans le `catch`, puis continuer", correct: false}
      - {text: "Attraper `Throwable` à la place d'`Exception`, plus complet", correct: false}
      - {text: "Ajouter un `finally` qui recharge les valeurs par défaut", correct: false}
    answer: |-
      ```java
      try {
          config = lire(fichier);
      } catch (IOException e) {
          throw new ConfigurationInvalide(fichier, e);
      }
      ```
      Un `catch` vide efface l'erreur. On attrape l'exception précise et on la signale (ici en arrêtant le démarrage),
      avec sa cause.
  - key: bug-controle-flux
    format: bug-fix
    question: |-
      Quelle écriture remplace ce parcours piloté par une exception ?
      ```java
      try {
          int i = 0;
          while (true) {
              traiter(tableau[i++]);
          }
      } catch (ArrayIndexOutOfBoundsException e) {
          // fin du tableau
      }
      ```
    choices:
      - {text: "Une boucle `for (Element e : tableau) traiter(e);`", correct: true}
      - {text: "Le même code, avec `catch (Exception e)`, plus sûr", correct: false}
      - {text: "Une boucle `while (i <= tableau.length)`, sans `try`", correct: false}
      - {text: "Un `try` à chaque tour de boucle, autour de `traiter`", correct: false}
    answer: |-
      ```java
      for (Element e : tableau) {
          traiter(e);
      }
      ```
      La fin d'un tableau n'a rien d'exceptionnel. Utiliser une exception comme condition de boucle est lent, et masque
      une vraie erreur d'indice levée par `traiter`.
  - key: bug-null-erreur
    format: bug-fix
    question: |-
      Les appelants reçoivent `null` quand la lecture échoue, et plantent plus loin sans savoir pourquoi. Quelle correction est la bonne ?
      ```java
      String lire(Path p) {
          try {
              return Files.readString(p);
          } catch (IOException e) {
              return null;
          }
      }
      ```
    choices:
      - {text: "Envelopper dans une `UncheckedIOException` avec le chemin et la cause", correct: true}
      - {text: "Renvoyer une chaîne vide au lieu de `null`", correct: false}
      - {text: "Journaliser l'erreur, puis renvoyer `null` comme avant", correct: false}
      - {text: "Attraper `Exception` au lieu d'`IOException`", correct: false}
    answer: |-
      ```java
      String lire(Path p) {
          try {
              return Files.readString(p);
          } catch (IOException e) {
              throw new UncheckedIOException("lecture impossible : " + p, e);
          }
      }
      ```
      Renvoyer `null` transforme une erreur explicite en `NullPointerException` mystérieuse. On laisse l'erreur visible,
      avec son contexte et sa cause.
