notion: interface-plutot-qu-implementation
lesson: |-
  **Programmer pour une interface** : on déclare les variables, paramètres, champs et types de retour avec le type le
  plus **général** qui suffit (l'interface), et l'on ne nomme l'implémentation qu'à la **création**.

  ```java
  List<Commande> commandes = new ArrayList<>();        // plutôt que ArrayList<Commande> commandes
  Map<String, Client> parEmail = new HashMap<>();
  Set<String> tags = new LinkedHashSet<>();

  public List<Commande> commandesDuJour() { ... }      // le type de retour ne fige pas l'implémentation
  public void importer(Collection<Ligne> lignes) { ... }   // accepte une List, un Set...
  public long compter(Iterable<Ligne> lignes) { ... }
  ```

  Les bénéfices :
  - on peut **changer d'implémentation** (`ArrayList` vers `LinkedList`, `HashMap` vers `TreeMap`) en ne modifiant qu'une
    ligne ;
  - une méthode qui accepte `Collection` ou `Iterable` sert à plus d'appelants qu'une méthode qui exige `ArrayList` ;
  - le code dit ce dont il **a besoin** (un `Set` : pas de doublons), pas comment c'est fait ;
  - dans le reste du code, c'est l'**inversion des dépendances** : un service dépend d'une interface (`ClientRepository`),
    l'infrastructure fournit l'implémentation (JPA), et les tests une doublure.

  Les nuances :
  - choisir le type qui exprime le **besoin réel** : `List` si l'ordre ou l'accès par index compte, `Collection` sinon,
    `SequencedCollection` (Java 21) pour un premier et un dernier élément ;
  - garder l'implémentation quand une de **ses** propriétés fait partie du contrat (`NavigableMap` pour `floorKey`,
    `LinkedHashMap` pour l'ordre d'insertion, ou une `List` dont on documente qu'elle est modifiable) ;
  - pour une variable locale, `var lignes = new ArrayList<Ligne>()` est acceptable : sa portée est courte ;
  - ne pas créer une interface pour **chaque** classe (`IService` / `ServiceImpl`) sans seconde implémentation ni besoin
    de test : c'est du bruit.

  **Piège classique** : une API publique qui renvoie `ArrayList<Commande>`. Le jour où l'on veut renvoyer une liste non
  modifiable (`List.of`, `toList()`), tous les appelants doivent changer.

  **En entretien** : « Je déclare avec l'interface (`List`, `Map`, `Collection`) et je ne nomme l'implémentation qu'à la
  création : je peux en changer, et mes méthodes acceptent plus de types ; sauf quand une propriété précise de
  l'implémentation fait partie du contrat. »
cards:
  - key: declarer-variable-avec-type-interface
    format: course
    question: Pourquoi déclarer une variable avec le type de l'interface ?
    answer: Pour pouvoir changer d'implémentation sans modifier le code appelant.
  - key: parametres
    format: course
    question: Quel type choisir pour le paramètre d'une méthode qui ne fait que parcourir des lignes ?
    answer: Le plus général qui suffit, `Iterable<Ligne>` ou `Collection<Ligne>`, pour accepter une `List`, un `Set` ou toute autre collection.
  - key: exceptions
    format: course
    question: Quand garder le type d'implémentation dans une signature ?
    answer: Quand une propriété propre à cette implémentation fait partie du contrat, par exemple `NavigableMap` pour les recherches par intervalle ou `LinkedHashMap` pour l'ordre d'insertion.
  - key: inversion
    format: course
    question: Quel lien avec l'inversion des dépendances ?
    answer: Un service dépend d'une interface (un port comme `ClientRepository`), et c'est l'infrastructure qui fournit l'implémentation (JPA) ; le service se teste avec une doublure.
  - key: vf-arraylist-retour
    format: true-false
    question: Une méthode publique devrait renvoyer `ArrayList<T>` plutôt que `List<T>`.
    truth: false
    answer: '`List<T>` laisse libre de renvoyer une autre implémentation, non modifiable par exemple.'
  - key: vf-interface-partout
    format: true-false
    question: Il faut créer une interface pour chaque classe de service, même avec une seule implémentation.
    truth: false
    answer: Sans seconde implémentation ni besoin de doublure, c'est du bruit.
  - key: vf-var
    format: true-false
    question: "`var lignes = new ArrayList<Ligne>();` est acceptable pour une variable locale de courte portée."
    truth: true
    answer: Le type n'est pas exposé hors de la méthode.
  - key: vf-set
    format: true-false
    question: Déclarer `Set<String>` plutôt que `List<String>` dit au lecteur que les doublons n'ont pas de sens.
    truth: true
    answer: Le type exprime le besoin.
  - key: qcm-declarations
    format: multiple-choice
    question: Quelles déclarations suivent le principe ?
    choices:
      - text: "`List<Commande> commandes = new ArrayList<>();`"
        correct: true
      - text: "`Map<String, Client> clients = new HashMap<>();`"
        correct: true
      - text: "`HashMap<String, Client> clients = new HashMap<>();` dans une API publique"
        correct: false
      - text: "`ArrayList<String> noms()` comme type de retour public"
        correct: false
    answer: L'implémentation n'apparaît qu'à la création.
  - key: qcm-parametre
    format: multiple-choice
    question: "Quelle signature accepte le plus d'appelants pour additionner des montants ?"
    choices:
      - text: "`BigDecimal total(Collection<BigDecimal> montants)`"
        correct: true
      - text: "`BigDecimal total(ArrayList<BigDecimal> montants)`"
        correct: false
      - text: "`BigDecimal total(LinkedList<BigDecimal> montants)`"
        correct: false
      - text: "`BigDecimal total(BigDecimal[] montants)` seulement"
        correct: false
    answer: Une `List`, un `Set` ou une `Collection` quelconque conviennent.
  - key: qcm-implementation
    format: multiple-choice
    question: Dans quels cas un type précis se justifie-t-il dans une signature ?
    choices:
      - text: "`NavigableMap<LocalDate, Tarif>` pour chercher le tarif applicable avec `floorEntry`"
        correct: true
      - text: "`SequencedCollection<Etape>` quand l'ordre et le premier élément comptent"
        correct: true
      - text: "`ArrayList` par habitude"
        correct: false
      - text: "`HashMap` pour un usage quelconque"
        correct: false
    answer: La propriété utilisée fait alors partie du contrat.
  - key: qcm-changement
    format: multiple-choice
    question: Une méthode renvoie `List<Commande>` construite par `new ArrayList<>()`. On veut renvoyer `stream.toList()`. Qu'est-ce qui change pour les appelants ?
    choices:
      - text: "Rien dans leur code, tant qu'ils ne modifient pas la liste"
        correct: true
      - text: "Tous doivent changer de type"
        correct: false
      - text: "Le code ne compile plus"
        correct: false
      - text: "La méthode doit changer de nom"
        correct: false
    answer: Avec un type de retour `ArrayList`, ce changement aurait cassé tous les appelants.
  - key: trous-list
    format: fill-in
    question: |-
      Complétez avec le type de l'interface :
      ```java
      ___<String> etapes = new ArrayList<>();
      ```
    blanks: [[List]]
    answer: L'implémentation n'apparaît qu'à droite.
  - key: trous-map
    format: fill-in
    question: |-
      Complétez :
      ```java
      ___<Long, Client> parId = new HashMap<>();
      ```
    blanks: [[Map]]
    answer: On pourra passer à une `TreeMap` en changeant une seule ligne.
  - key: trous-collection
    format: fill-in
    question: |-
      Complétez pour accepter n'importe quelle collection de lignes :
      ```java
      void importer(___<Ligne> lignes) { ... }
      ```
    blanks: [[Collection, Iterable]]
    answer: Une `List` comme un `Set` conviennent alors.
  - key: trous-set
    format: fill-in
    question: |-
      Complétez pour dire qu'il n'y a pas de doublons :
      ```java
      ___<String> tags = new LinkedHashSet<>();
      ```
    blanks: [[Set, SequencedSet]]
    answer: Le type dit le besoin ; l'implémentation garde l'ordre d'insertion.
  - key: code-changer
    format: code-output
    question: |-
      ```java
      List<Integer> l = new ArrayList<>(List.of(3, 1, 2));
      l = new LinkedList<>(l);
      l.add(0);
      System.out.println(l + " " + l.getClass().getSimpleName());
      ```
    answer: '`[3, 1, 2, 0] LinkedList` : le reste du code ne voit qu''une `List`.'
    check:
      output: "[3, 1, 2, 0] LinkedList"
  - key: code-collection
    format: code-output
    question: |-
      ```java
      static int total(Collection<Integer> montants) {
          return montants.stream().mapToInt(Integer::intValue).sum();
      }
      System.out.println(total(List.of(1, 2)) + " " + total(Set.of(10)) + " " + total(new ArrayDeque<>(List.of(5, 5))));
      ```
    answer: '`3 10 10` : un paramètre `Collection` accepte une liste, un ensemble ou une file.'
    check:
      output: "3 10 10"
  - key: code-retour
    format: code-output
    question: |-
      ```java
      static List<String> noms() { return Stream.of("ada", "bob").toList(); }
      List<String> n = noms();
      System.out.println(n.size());
      n.add("eve");
      ```
    answer: '`2`, puis une `UnsupportedOperationException` : le type `List` permettait de renvoyer une liste non modifiable.'
    check:
      output: "2"
      throws: UnsupportedOperationException
  - key: code-navigable
    format: code-output
    question: |-
      ```java
      NavigableMap<Integer, String> paliers = new TreeMap<>(Map.of(0, "aucune", 100, "5 %", 500, "10 %"));
      System.out.println(paliers.floorEntry(250).getValue());
      ```
    answer: '`5 %` : `NavigableMap` est le bon type, car `floorEntry` fait partie du besoin.'
    check:
      output: "5 %"
  - key: bug-retour-arraylist
    format: bug-fix
    question: |-
      Améliorez cette API publique :
      ```java
      public ArrayList<Commande> commandesDuJour() { ... }
      public void archiver(ArrayList<Commande> commandes) { ... }
      ```
    answer: |-
      ```java
      public List<Commande> commandesDuJour() { ... }
      public void archiver(Collection<Commande> commandes) { ... }
      ```
      Le retour `List` laisse libre de l'implémentation (une liste non modifiable, par exemple) ; le paramètre
      `Collection` accepte plus d'appelants.
  - key: bug-champ-implementation
    format: bug-fix
    question: |-
      Améliorez :
      ```java
      private final HashMap<String, Session> sessions = new HashMap<>();
      ```
    answer: |-
      ```java
      private final Map<String, Session> sessions = new ConcurrentHashMap<>();
      ```
      Avec un champ de type `Map`, passer à une implémentation concurrente (ici nécessaire si plusieurs threads y
      accèdent) ne touche qu'une ligne.
  - key: bug-interface-inutile
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      public interface IFormateurDate { String formater(LocalDate d); }
      public class FormateurDateImpl implements IFormateurDate { ... }   // unique implémentation, jamais doublée
      ```
    answer: |-
      ```java
      public final class FormateurDate {
          public String formater(LocalDate date) { ... }
      }
      ```
      Une interface sans seconde implémentation ni besoin de doublure n'apporte que du bruit (et les préfixes `I` et
      suffixes `Impl` n'aident pas). On l'introduira le jour où une deuxième implémentation apparaîtra.
  - key: bug-parametre-list
    format: bug-fix
    question: |-
      Cette méthode ne peut pas recevoir un `Set` de produits, alors qu'elle ne fait que les parcourir :
      ```java
      void reindexer(List<Produit> produits) {
          for (Produit p : produits) index.ajouter(p);
      }
      ```
    answer: |-
      ```java
      void reindexer(Iterable<Produit> produits) {
          for (Produit p : produits) index.ajouter(p);
      }
      ```
      Le paramètre exige seulement de pouvoir parcourir : `Iterable` (ou `Collection`) suffit.
