notion: gestion-null
lesson: |-
  `null` est la source d'erreur la plus fréquente en Java (`NullPointerException`). Plutôt que de multiplier les
  `if (x != null)`, on choisit une **stratégie explicite** pour chaque absence de valeur :

  | Situation | Stratégie |
  |---|---|
  | une méthode peut ne rien trouver | renvoyer un **`Optional<T>`** (`trouverParEmail`) |
  | une collection sans élément | renvoyer une **collection vide**, jamais `null` |
  | un paramètre obligatoire | **refuser `null` dès l'entrée** : `Objects.requireNonNull(nom, "nom")` |
  | une valeur par défaut a du sens | un **objet neutre** (*Null Object*) : `Remise.AUCUNE`, `Notificateur.SILENCIEUX` |
  | un champ facultatif d'un DTO | `null` documenté (ou `Optional` en lecture), validé à la frontière |

  ```java
  public Optional<Client> trouverParEmail(String email) { ... }            // l'absence fait partie du contrat
  public List<Commande> commandes(long clientId) { return List.of(); }      // vide plutôt que null

  public Commande(String reference, List<Ligne> lignes) {
      this.reference = Objects.requireNonNull(reference, "reference");      // échouer tôt, avec un message clair
      this.lignes = List.copyOf(lignes);                                    // refuse aussi les éléments null
  }

  String ville = client.adresse().map(Adresse::ville).orElse("inconnue");
  ```

  - Les **annotations de nullité** (JSpecify `@Nullable`, `@NullMarked`) documentent le contrat et permettent à un outil
    (NullAway, IntelliJ) de **vérifier à la compilation** qu'on ne déréférence pas une valeur peut-être nulle. Avec
    `@NullMarked` sur un package, tout est non nul par défaut ; seules les exceptions sont annotées.
  - `Optional` sert aux **types de retour** ; pas aux champs, aux paramètres ni aux collections.
  - Les messages de NPE détaillés (Java 14) disent quelle expression était `null`, mais échouer **tôt** (à l'entrée) donne
    une erreur plus proche de la cause.
  - `Objects.requireNonNullElse(valeur, defaut)` donne une valeur par défaut.

  **Piège classique** : renvoyer `null` pour « aucun résultat » dans une méthode qui renvoie une `List`. Chaque appelant
  doit y penser ; le jour où l'un oublie, `for (Commande c : commandes(id))` lève une `NullPointerException`.

  **En entretien** : « Je rends l'absence explicite : `Optional` en retour, collections vides, `requireNonNull` à l'entrée,
  objets neutres ; et `@NullMarked` avec NullAway pour que le compilateur vérifie le reste. »
cards:
  - key: strategies
    format: course
    question: Quelles stratégies remplacent les `null` dispersés dans le code ?
    answer: Un `Optional` pour un résultat facultatif, une collection vide plutôt que `null`, `Objects.requireNonNull` pour refuser `null` à l'entrée, et un objet neutre (Null Object) quand un comportement par défaut a du sens.
  - key: echouer-tot
    format: course
    question: Pourquoi refuser `null` dès le constructeur avec `Objects.requireNonNull` ?
    answer: Pour échouer au plus près de la cause, avec un message clair, plutôt que bien plus tard lors d'un usage du champ, où l'origine du `null` est difficile à retrouver.
  - key: null-object
    format: course
    question: Qu'est-ce qu'un objet neutre (Null Object) ?
    answer: Une implémentation qui ne fait rien ou renvoie une valeur neutre (`Remise.AUCUNE`, un notificateur silencieux), utilisée à la place de `null` pour éviter les tests de nullité chez les appelants.
  - key: annotations
    format: course
    question: À quoi servent les annotations de nullité comme celles de JSpecify ?
    answer: À documenter quelles valeurs peuvent être nulles (`@Nullable`), avec tout non nul par défaut sous `@NullMarked`, et à laisser un outil comme NullAway vérifier à la compilation qu'on ne déréférence pas une valeur peut-être nulle.
  - key: vf-liste-null
    format: true-false
    question: Une méthode qui renvoie une `List` peut renvoyer `null` quand il n'y a aucun résultat.
    truth: false
    answer: Elle renvoie une liste vide ; `null` oblige chaque appelant à le tester.
  - key: vf-optional-champ
    format: true-false
    question: "`Optional` est recommandé comme type de champ et de paramètre."
    truth: false
    answer: Il est conçu pour les types de retour.
  - key: vf-copy-of
    format: true-false
    question: "`List.copyOf(lignes)` refuse une liste qui contient `null`."
    truth: true
    answer: Ce qui fait aussi office de validation.
  - key: vf-nullmarked
    format: true-false
    question: Sous `@NullMarked`, les types sont considérés non nuls par défaut.
    truth: true
    answer: Seules les exceptions portent `@Nullable`.
  - key: qcm-retour
    format: multiple-choice
    question: Quels types de retour sont adaptés à « peut-être aucun résultat » ?
    choices:
      - text: "`Optional<Client>` pour un seul client"
        correct: true
      - text: "Une `List<Commande>` vide pour plusieurs commandes"
        correct: true
      - text: "`null` pour une `List`"
        correct: false
      - text: "`Optional<List<Commande>>`"
        correct: false
    answer: Une collection vide suffit ; l'`Optional` d'une collection ajoute une seconde façon d'être vide.
  - key: qcm-entree
    format: multiple-choice
    question: Comment refuser un nom `null` dans un constructeur ?
    choices:
      - text: "`this.nom = Objects.requireNonNull(nom, \"nom\");`"
        correct: true
      - text: "Un record avec un constructeur compact qui fait `Objects.requireNonNull(nom)`"
        correct: true
      - text: "`if (nom == null) nom = \"\";` en silence"
        correct: false
      - text: "Ne rien faire, la NPE viendra plus tard"
        correct: false
    answer: Remplacer silencieusement `null` masque l'erreur de l'appelant.
  - key: qcm-defaut
    format: multiple-choice
    question: Comment obtenir une valeur par défaut si une valeur est nulle ?
    choices:
      - text: "`Objects.requireNonNullElse(valeur, defaut)`"
        correct: true
      - text: "`Optional.ofNullable(valeur).orElse(defaut)`"
        correct: true
      - text: "`valeur.orElse(defaut)` sur une `String`"
        correct: false
      - text: "`Objects.requireNonNull(valeur)`"
        correct: false
    answer: '`requireNonNull` lève une exception au lieu de fournir un défaut.'
  - key: qcm-outils
    format: multiple-choice
    question: Quels outils vérifient la nullité à la compilation ?
    choices:
      - text: "NullAway (avec Error Prone)"
        correct: true
      - text: "L'analyse de l'IDE avec les annotations JSpecify"
        correct: true
      - text: "Le ramasse-miettes"
        correct: false
      - text: "JUnit"
        correct: false
    answer: C'est le choix fait dès la phase 0 de ce projet (ADR 0004).
  - key: bug-liste-null
    format: bug-fix
    question: |-
      Plusieurs appelants plantent avec une `NullPointerException` pour un client sans commande :
      ```java
      public List<Commande> commandes(long clientId) {
          List<Commande> resultat = repository.parClient(clientId);
          return resultat.isEmpty() ? null : resultat;
      }
      ```
    answer: |-
      ```java
      public List<Commande> commandes(long clientId) {
          return repository.parClient(clientId);      // une liste vide si aucune commande
      }
      ```
      `null` pour « aucun résultat » oblige chaque appelant à le tester. Une liste vide se parcourt sans précaution.
  - key: bug-npe-tardive
    format: bug-fix
    question: |-
      Une `NullPointerException` survient bien plus tard, dans le calcul des frais, sans qu'on sache d'où vient le `null` :
      ```java
      public Livraison(Adresse adresse, Transporteur transporteur) {
          this.adresse = adresse;
          this.transporteur = transporteur;
      }
      ```
    answer: |-
      ```java
      public Livraison(Adresse adresse, Transporteur transporteur) {
          this.adresse = Objects.requireNonNull(adresse, "adresse");
          this.transporteur = Objects.requireNonNull(transporteur, "transporteur");
      }
      ```
      L'objet acceptait un état invalide. En refusant `null` dès la construction, l'erreur apparaît chez l'appelant fautif,
      avec le nom du paramètre.
  - key: bug-chaine-null
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      String ville = "inconnue";
      if (client != null && client.getAdresse() != null && client.getAdresse().getVille() != null) {
          ville = client.getAdresse().getVille();
      }
      ```
    answer: |-
      ```java
      String ville = client.adresse()                 // Optional<Adresse>
              .map(Adresse::ville)
              .orElse("inconnue");
      ```
      Si l'adresse est facultative, elle se modélise par un `Optional` en retour ; un client `null` ne devrait pas exister
      à ce stade (il est refusé plus tôt).
  - key: bug-null-object
    format: bug-fix
    question: |-
      Chaque appel teste si le notificateur est configuré :
      ```java
      if (notificateur != null) {
          notificateur.envoyer(message);
      }
      ```
    answer: |-
      ```java
      interface Notificateur {
          Notificateur SILENCIEUX = message -> { };
          void envoyer(Message message);
      }
      // configuration : notificateur = configure ? new NotificateurEmail(...) : Notificateur.SILENCIEUX;
      notificateur.envoyer(message);
      ```
      Un objet neutre remplace `null` : le code appelant n'a plus de cas particulier.
  - key: scenario-strategie
    format: scenario
    question: Quelle stratégie de gestion de `null` adoptes-tu dans un nouveau projet ?
    answer: |-
      Non nul par défaut : `@NullMarked` (JSpecify) sur tous les packages, NullAway dans le build pour que le compilateur
      refuse un déréférencement non vérifié, et `@Nullable` seulement là où l'absence est voulue. Dans le code : `Optional`
      pour les recherches qui peuvent échouer, collections vides plutôt que `null`, `requireNonNull` dans les
      constructeurs des objets du domaine (ou des records avec constructeur compact), et validation des DTO à la frontière
      (Bean Validation). C'est la règle de ce projet depuis la phase 0.
  - key: scenario-legacy
    format: scenario
    question: Un code ancien est truffé de `if (x != null)` et lève encore régulièrement des NPE. Comment améliores-tu la situation progressivement ?
    answer: |-
      Je commence par les frontières : valider les entrées (requêtes, fichiers, base) pour qu'aucun `null` inattendu
      n'entre dans le domaine. Puis, à chaque modification, je change les retours `null` en `Optional` ou en collections
      vides, j'ajoute des `requireNonNull` dans les constructeurs, et j'active NullAway package par package
      (`@NullMarked` sur les packages nettoyés). Les messages de NPE détaillés et les traces aident à prioriser les
      endroits qui plantent réellement.
  - key: scenario-api
    format: scenario
    question: Dans une API REST, comment représentes-tu un champ facultatif d'un DTO de réponse ?
    answer: |-
      Je fixe une règle dans le contrat : soit le champ est absent du JSON quand il n'a pas de valeur (`@JsonInclude(NON_NULL)`),
      soit il vaut `null`, mais pas les deux selon les endpoints. Côté Java, le record du DTO le déclare `@Nullable` ; pour
      les listes, une liste vide plutôt que `null`. Je documente le caractère facultatif dans la spécification OpenAPI,
      pour que le client TypeScript généré le reflète (`champ?: string`).
  - key: scenario-optional-abus
    format: scenario
    question: En revue, tu vois `Optional` utilisé pour des champs, des paramètres et des `Optional<List<...>>`. Que dis-tu ?
    answer: |-
      Qu'`Optional` est fait pour signaler, en type de retour, qu'un résultat peut manquer. En champ, il complique la
      sérialisation et n'est pas sérialisable ; en paramètre, il oblige l'appelant à envelopper ses valeurs (une surcharge
      ou un `@Nullable` est plus simple) ; et une collection a déjà sa façon d'être vide. Je propose : champs `@Nullable`
      (ou une valeur par défaut), paramètres non nuls ou surchargés, collections vides, et `Optional` seulement en retour
      des méthodes de recherche.
