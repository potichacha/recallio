notion: journalisation
lesson: |-
  En Java, on écrit les journaux à travers une **façade**, **SLF4J** (ou JBoss Logging dans Quarkus), et une
  implémentation (Logback, Log4j 2, celle du serveur) produit la sortie. Le code ne dépend que de la façade.

  ```java
  private static final Logger log = LoggerFactory.getLogger(CommandeService.class);

  log.info("Commande {} validée pour le client {}", commande.id(), client.id());   // message paramétré
  log.debug("Détail du calcul : {}", detail);                                     // pas de coût si DEBUG est désactivé
  log.warn("Stock bas pour {} : {} unités", produit, stock);
  log.error("Échec du paiement de la commande {}", commande.id(), exception);    // l'exception en dernier argument
  ```

  Les **niveaux**, du plus bavard au plus grave :
  - `TRACE`, `DEBUG` : le détail pour le diagnostic, désactivés en production par défaut ;
  - `INFO` : les événements métier significatifs (une commande validée, un import terminé) ;
  - `WARN` : une situation anormale mais gérée (un réessai, une valeur par défaut appliquée) ;
  - `ERROR` : un échec qui demande une action (une requête en erreur, un traitement abandonné).

  Les règles :
  - des **messages paramétrés** (`{}`), pas de concaténation : la chaîne n'est construite que si le niveau est actif, et
    les outils regroupent les messages identiques ;
  - l'**exception** se passe en **dernier argument**, pour avoir sa trace de pile ; on ne journalise une exception qu'**une
    fois** (là où elle est traitée), pas à chaque couche ;
  - **aucune donnée sensible** : mots de passe, jetons, numéros de carte, et le moins possible de données personnelles
    (RGPD) ;
  - un **contexte** de corrélation : un identifiant de requête dans le **MDC**, et des journaux **structurés** (JSON sur la
    sortie standard en conteneur), exploitables par l'outil de centralisation ;
  - pas de `System.out.println` ni de `e.printStackTrace()` dans une application.

  **Piège classique** : `log.debug("Résultat : " + calculCouteux())`. Même si le niveau `DEBUG` est désactivé, la
  concaténation et le calcul sont exécutés à chaque appel ; avec `{}`, la chaîne ne l'est pas (et un `Supplier`
  différerait aussi le calcul).

  **En entretien** : « SLF4J et des messages paramétrés, le bon niveau, l'exception en dernier argument et journalisée une
  seule fois, jamais de données sensibles, et un identifiant de corrélation dans des journaux structurés. »
cards:
  - key: niveaux
    format: course
    question: À quoi sert chaque niveau de journalisation ?
    choices:
      - {text: "TRACE et DEBUG : le diagnostic ; INFO : le métier ; WARN : une anomalie gérée ; ERROR : un échec à traiter", correct: true}
      - {text: "TRACE et DEBUG : le métier ; INFO : le diagnostic ; WARN : un échec à traiter ; ERROR : une anomalie gérée", correct: false}
      - {text: "TRACE et DEBUG : le diagnostic ; INFO : chaque ligne traitée ; WARN et ERROR : tout refus métier", correct: false}
      - {text: "TRACE : les erreurs ; DEBUG : la CI ; INFO : l'utilisateur ; WARN et ERROR : l'équipe d'exploitation", correct: false}
    answer: TRACE et DEBUG pour le diagnostic détaillé ; INFO pour les événements métier significatifs ; WARN pour une anomalie gérée ; ERROR pour un échec qui demande une action.
  - key: parametres
    format: course
    question: Pourquoi des messages paramétrés (`{}`) plutôt qu'une concaténation ?
    choices:
      - {text: "La chaîne n'est construite que si le niveau est actif, et les messages restent regroupables", correct: true}
      - {text: "Les `{}` masquent automatiquement les valeurs sensibles avant l'écriture du journal", correct: false}
      - {text: "La concaténation est interdite dans un appel à SLF4J et ne compile pas", correct: false}
      - {text: "Les `{}` forcent l'écriture immédiate du message sur le disque, sans tampon", correct: false}
    answer: La chaîne n'est construite que si le niveau est actif, et des messages identiques restent regroupables par les outils d'analyse.
  - key: exception
    format: course
    question: "Comment journaliser une exception ?"
    choices:
      - {text: "En la passant en dernier argument, une seule fois, là où elle est traitée", correct: true}
      - {text: "En ajoutant `e.getMessage()` au message, dans chaque couche traversée", correct: false}
      - {text: "Avec `e.printStackTrace()`, qui affiche toute la trace de pile", correct: false}
      - {text: "En la journalisant dans chaque `catch`, pour ne jamais la perdre", correct: false}
    answer: "En la passant en dernier argument (`log.error(\"Échec de {}\", id, e)`) pour garder sa trace de pile, et une seule fois, là où elle est réellement traitée. `printStackTrace` contourne la configuration des journaux."
  - key: facade
    format: course
    question: "Pourquoi passer par une façade de journalisation comme SLF4J ?"
    choices:
      - {text: "Le code dépend d'une API stable ; l'implémentation se choisit au déploiement", correct: true}
      - {text: "SLF4J écrit les journaux plus vite que n'importe quelle implémentation", correct: false}
      - {text: "SLF4J chiffre les journaux avant de les envoyer au serveur central", correct: false}
      - {text: "SLF4J remplace la configuration de Logback par des annotations", correct: false}
    answer: Le code dépend d'une API stable, et l'implémentation (Logback, Log4j 2, celle du serveur) se choisit au déploiement sans modifier le code.
  - key: vf-concat
    format: true-false
    question: "`log.debug(\"x = \" + x)` ne coûte rien quand le niveau DEBUG est désactivé."
    truth: false
    answer: La concaténation est évaluée avant l'appel ; `log.debug("x = {}", x)` l'évite.
  - key: vf-sensible
    format: true-false
    question: On peut journaliser un mot de passe au niveau DEBUG puisque ce niveau est désactivé en production.
    truth: false
    answer: Aucun secret ne va dans les journaux, quel que soit le niveau.
  - key: vf-une-fois
    format: true-false
    question: Une exception doit être journalisée à chaque couche qu'elle traverse.
    truth: false
    answer: On la journalise une fois, là où elle est traitée ; sinon la même erreur apparaît plusieurs fois.
  - key: vf-mdc
    format: true-false
    question: Le MDC permet d'ajouter un identifiant de requête à tous les journaux d'un traitement.
    truth: true
    answer: Il repose sur un `ThreadLocal`, à nettoyer et à propager aux tâches asynchrones.
  - key: qcm-niveau
    format: multiple-choice
    question: "Quelle association entre événement et niveau de journalisation est correcte ?"
    choices:
      - {text: "Un import nocturne terminé avec succès : INFO", correct: true}
      - {text: "Le contenu de chaque ligne importée : INFO", correct: false}
      - {text: "Une requête rejetée pour une validation métier normale : ERROR", correct: false}
      - {text: "Une base injoignable après tous les réessais : DEBUG", correct: false}
    answer: "Un événement métier significatif va en INFO, et un appel réussi après un réessai en WARN. Le détail par ligne va en DEBUG, un refus de validation attendu n'est pas une erreur du système, et une panne qui demande une action va en ERROR."
  - key: qcm-ecriture
    format: multiple-choice
    question: Quelles écritures sont correctes ?
    choices:
      - text: "`log.error(\"Échec de l'export {}\", id, e);`"
        correct: true
      - text: "`log.info(\"Client {} inscrit\", client.id());`"
        correct: true
      - text: "`log.error(\"Échec : \" + e.getMessage());`"
        correct: false
      - text: "`e.printStackTrace();`"
        correct: false
    answer: Le message seul perd la trace de pile ; `printStackTrace` contourne la configuration des journaux.
  - key: qcm-interdit
    format: multiple-choice
    question: "Laquelle de ces données ne faut-il jamais journaliser ?"
    choices:
      - {text: "Un jeton d'accès ou un mot de passe", correct: true}
      - {text: "L'identifiant technique d'une commande", correct: false}
      - {text: "La durée d'un traitement", correct: false}
      - {text: "Le nom du service et sa version", correct: false}
    answer: "Un secret (jeton, mot de passe, numéro de carte) ne va jamais dans les journaux, et les données personnelles le moins possible. Un identifiant technique ou une durée sont au contraire utiles."
  - key: qcm-conteneur
    format: multiple-choice
    question: "Où une application qui tourne dans un conteneur doit-elle écrire ses journaux ?"
    choices:
      - {text: "En JSON sur la sortie standard, collectés par la plateforme", correct: true}
      - {text: "Dans un fichier à l'intérieur du conteneur, tourné chaque jour", correct: false}
      - {text: "Dans une table de la base de données de l'application", correct: false}
      - {text: "Avec `System.out.println`, sans format, pour aller plus vite", correct: false}
    answer: "Le système de fichiers d'un conteneur disparaît avec lui : on écrit sur la sortie standard, en JSON structuré, et la plateforme collecte. Un identifiant de corrélation permet ensuite de suivre une requête entre services."
  - key: bug-concat
    format: bug-fix
    question: |-
      Ce journal coûte cher même quand DEBUG est désactivé. Quelle correction est la bonne ?
      ```java
      log.debug("Panier calculé : " + panier.toJson());
      ```
    choices:
      - {text: "`log.debug(\"Panier calculé : {}\", panier);`", correct: true}
      - {text: "`log.debug(\"Panier calculé : \" + panier.toString());`", correct: false}
      - {text: "`log.info(\"Panier calculé : \" + panier.toJson());`", correct: false}
      - {text: "`log.debug(String.format(\"Panier : %s\", panier.toJson()));`", correct: false}
    answer: |-
      ```java
      log.debug("Panier calculé : {}", panier);
      // ou, si le calcul est coûteux : log.atDebug().setMessage(() -> "Panier : " + panier.toJson()).log();
      ```
      La concaténation et `toJson()` étaient exécutés à chaque appel. Avec `{}`, la chaîne n'est construite que si le niveau
      est actif ; l'API fluide de SLF4J 2 permet de différer un calcul.
  - key: bug-trace-perdue
    format: bug-fix
    question: |-
      Le journal n'indique pas où l'erreur s'est produite. Quelle correction est la bonne ?
      ```java
      } catch (PaiementException e) {
          log.error("Erreur paiement : " + e.getMessage());
      }
      ```
    choices:
      - {text: "`log.error(\"Échec du paiement de la commande {}\", commande.id(), e);`", correct: true}
      - {text: "`log.error(\"Erreur paiement : {}\", e.getMessage());`", correct: false}
      - {text: "`log.error(\"Erreur paiement : \" + e);`", correct: false}
      - {text: "`log.error(\"Erreur paiement\"); e.printStackTrace();`", correct: false}
    answer: |-
      ```java
      } catch (PaiementException e) {
          log.error("Échec du paiement de la commande {}", commande.id(), e);
      }
      ```
      L'exception passée en dernier argument donne sa trace de pile (et sa cause) ; le message dit sur quoi portait
      l'échec.
  - key: bug-donnees-sensibles
    format: bug-fix
    question: |-
      Ce journal pose un problème grave. Quelle correction est la bonne ?
      ```java
      log.info("Connexion de {} avec le mot de passe {}", email, motDePasse);
      ```
    choices:
      - {text: "`log.info(\"Connexion de l'utilisateur {}\", utilisateur.id());`", correct: true}
      - {text: "`log.debug(\"Connexion de {} avec le mot de passe {}\", email, motDePasse);`", correct: false}
      - {text: "`log.info(\"Connexion de {}, mot de passe {}\", email, hash(motDePasse));`", correct: false}
      - {text: "`log.info(\"Connexion de {} avec un mot de passe\", email);`", correct: false}
    answer: |-
      ```java
      log.info("Connexion de l'utilisateur {}", utilisateur.id());
      ```
      Un mot de passe ne va jamais dans les journaux, même haché ou en DEBUG. On préfère aussi un identifiant technique à
      l'e-mail (une donnée personnelle).
  - key: bug-journal-repete
    format: bug-fix
    question: |-
      La même erreur apparaît trois fois dans les journaux pour une seule requête. Quelle correction est la bonne ?
      ```java
      // repository
      catch (SQLException e) { log.error("Erreur SQL", e); throw new StockageException(e); }
      // service
      catch (StockageException e) { log.error("Erreur stockage", e); throw e; }
      // ressource REST : le mapper d'exceptions journalise aussi
      ```
    choices:
      - {text: "Enrichir l'exception en la relançant, et la journaliser une seule fois, dans le mapper global", correct: true}
      - {text: "Journaliser en DEBUG dans le repository et le service, et en ERROR dans le mapper", correct: false}
      - {text: "Retirer la journalisation du mapper global, et garder celle du repository", correct: false}
      - {text: "Ne plus relancer l'exception une fois journalisée dans le repository", correct: false}
    answer: |-
      ```java
      // repository
      catch (SQLException e) { throw new StockageException("lecture du stock " + ref, e); }
      // service : laisse remonter
      // mapper d'exceptions global : journalise une seule fois, avec la trace complète
      ```
      On enrichit l'exception de contexte en la relançant, et on la journalise une fois, là où elle est traitée (le mapper
      global qui produit la réponse Problem Details).
  - key: scenario-diagnostic
    format: scenario
    question: Une erreur en production est impossible à relier à la requête qui l'a provoquée. Que mets-tu en place ?
    choices:
      - {text: "Un identifiant de corrélation dans le MDC, propagé, dans des journaux JSON structurés", correct: true}
      - {text: "Plus de journaux en DEBUG dans tout le code, activés en permanence en production", correct: false}
      - {text: "Un horodatage à la nanoseconde, pour relier les lignes entre elles par l'heure", correct: false}
      - {text: "Un fichier de journal séparé pour chaque requête, nommé d'après son heure", correct: false}
    answer: |-
      Un identifiant de corrélation : reçu dans un en-tête (`traceparent` ou `X-Request-Id`) ou généré à l'entrée, placé
      dans le MDC par un filtre (et retiré à la fin), propagé aux appels sortants et aux tâches asynchrones. Des journaux
      structurés en JSON incluent automatiquement cet identifiant, ainsi que le service et la version. Avec OpenTelemetry,
      l'identifiant de trace relie aussi les journaux aux traces distribuées. On peut alors filtrer tous les journaux
      d'une requête dans l'outil centralisé.
  - key: scenario-niveaux-prod
    format: scenario
    question: Les journaux de production représentent 50 Go par jour et personne ne s'en sert. Comment les rendre utiles ?
    choices:
      - {text: "Revoir les niveaux, supprimer les doublons, passer en JSON, et compter avec des métriques", correct: true}
      - {text: "Tout passer en ERROR, pour ne garder que l'essentiel dans les journaux", correct: false}
      - {text: "Désactiver complètement les journaux en production, puisqu'ils ne servent pas", correct: false}
      - {text: "Conserver les 50 Go plus longtemps, au cas où ils serviraient un jour", correct: false}
    answer: |-
      Je revois les niveaux : le détail par élément traité passe en DEBUG, INFO ne garde que les événements métier
      significatifs, les réessais réussis en WARN, les vrais échecs en ERROR. Je supprime les journaux en double (une
      exception journalisée à chaque couche), je passe en JSON structuré pour pouvoir filtrer, et je déplace ce qui sert à
      compter (requêtes, durées) vers des métriques, bien moins coûteuses. Les niveaux se changent à chaud pour un
      diagnostic ponctuel.
  - key: scenario-rgpd
    format: scenario
    question: Comment t'assures-tu que les journaux respectent le RGPD ?
    choices:
      - {text: "Des identifiants techniques plutôt que des données personnelles, jamais de secret, du masquage", correct: true}
      - {text: "Chiffrer les fichiers de journaux et y garder toutes les données, e-mails compris", correct: false}
      - {text: "Journaliser les données personnelles seulement en DEBUG, désactivé par défaut", correct: false}
      - {text: "Demander à l'utilisateur son consentement avant de journaliser ses données", correct: false}
    answer: |-
      Je journalise des identifiants techniques plutôt que des données personnelles (pas d'e-mail, de nom ni d'adresse),
      jamais de secret (mots de passe, jetons, cartes). Je masque les champs sensibles dans les objets journalisés
      (`toString` qui les exclut, ou un masquage dans l'encodeur), je limite la durée de conservation et l'accès aux
      journaux, et j'ajoute une revue de ce point dans la relecture de code. Un test peut vérifier qu'un échantillon de
      journaux ne contient pas de motifs sensibles.
  - key: scenario-asynchrone
    format: scenario
    question: L'identifiant de corrélation disparaît des journaux dans les traitements asynchrones. Pourquoi, et que fais-tu ?
    choices:
      - {text: "Le MDC repose sur un `ThreadLocal` : je copie le contexte à la soumission et le restaure dans la tâche", correct: true}
      - {text: "Le MDC est vidé par le ramasse-miettes : je le rends `static` pour qu'il soit conservé", correct: false}
      - {text: "Les journaux asynchrones perdent leurs champs : je repasse en journalisation synchrone", correct: false}
      - {text: "Le MDC n'existe qu'en DEBUG : j'active ce niveau pour les traitements asynchrones", correct: false}
    answer: |-
      Le MDC repose sur un `ThreadLocal` : une tâche exécutée dans un autre thread ne voit pas le contexte du thread qui l'a
      soumise. Je copie le contexte à la soumission (`MDC.getCopyOfContextMap()`) et je le restaure dans la tâche, puis je
      le nettoie, idéalement dans un décorateur d'exécuteur réutilisable. Les frameworks et OpenTelemetry propagent ce
      contexte automatiquement pour leurs propres exécuteurs ; pour les threads virtuels, `ScopedValue` est une alternative.
  - key: definition-mdc
    format: definition
    question: "Que désigne le MDC, en journalisation ?"
    choices:
      - {text: "Mapped Diagnostic Context : un contexte attaché aux journaux d'un thread, comme un `traceId`", correct: true}
      - {text: "Message Delivery Channel : le canal qui transporte les journaux vers le serveur central", correct: false}
      - {text: "Mapped Data Collector : l'agent qui collecte les métriques de l'application", correct: false}
      - {text: "Multi-Destination Configuration : l'envoi d'un même journal à plusieurs cibles", correct: false}
    answer: "Mapped Diagnostic Context : des paires clé-valeur (un `traceId`, un identifiant d'utilisateur) attachées au thread courant et ajoutées à chacun de ses journaux."
  - key: definition-slf4j
    format: definition
    question: "Que désigne SLF4J ?"
    choices:
      - {text: "Simple Logging Facade for Java, la façade de journalisation dont dépend le code", correct: true}
      - {text: "Une implémentation de journalisation qui écrit dans des fichiers, comme Logback", correct: false}
      - {text: "Le format JSON standard des journaux produits par une application Java", correct: false}
      - {text: "Le module de journalisation intégré au JDK, `java.util.logging`", correct: false}
    answer: Simple Logging Facade for Java, la façade de journalisation dont dépend le code, indépendante de l'implémentation.
  - key: definition-message-parametre
    format: definition
    question: "Qu'est-ce qu'un message paramétré, en journalisation ?"
    choices:
      - {text: "Un message à emplacements `{}` remplis par les arguments, construit si le niveau est actif", correct: true}
      - {text: "Un message dont le niveau se règle par un paramètre de la ligne de commande", correct: false}
      - {text: "Un message construit par concaténation, avec `+`, avant l'appel au journal", correct: false}
      - {text: "Un message traduit dans la langue configurée par l'utilisateur", correct: false}
    answer: Un message de journal avec des emplacements `{}` remplis par les arguments, construit seulement si le niveau est actif.
  - key: definition-correlation
    format: definition
    question: "Qu'est-ce qu'un identifiant de corrélation ?"
    choices:
      - {text: "Un identifiant propre à une requête, ajouté à tous ses journaux et propagé entre services", correct: true}
      - {text: "L'identifiant technique de l'utilisateur connecté, ajouté à chacun de ses journaux", correct: false}
      - {text: "Le numéro de version du service, ajouté à chaque ligne de journal produite", correct: false}
      - {text: "Un identifiant qui relie deux bugs semblables dans l'outil de suivi des tickets", correct: false}
    answer: Un identifiant propre à une requête, ajouté à tous ses journaux (et propagé entre services) pour les relier entre eux.
