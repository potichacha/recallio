notion: minimiser-mutabilite
lesson: |-
  Moins un état peut changer, et moins il est visible, moins il y a de bugs possibles. Deux principes (Joshua Bloch,
  *Effective Java*) : **minimiser la mutabilité** et **minimiser la portée**.

  **Mutabilité** :
  - des **objets immuables** par défaut : records, champs `final`, collections non modifiables (`List.copyOf`,
    `List.of`), copies défensives ;
  - on « modifie » en créant une **nouvelle valeur** (`montant.ajouter(autre)` renvoie un nouveau `Montant`), comme
    `String`, `BigDecimal` et `java.time` ;
  - des champs **`final`** dans les classes de service (injection par constructeur) ;
  - ne jamais exposer une collection interne modifiable par un getter.

  **Portée** :
  - déclarer une variable **au plus près** de son premier usage, dans le plus petit bloc possible ;
  - la **visibilité** la plus restreinte : `private` par défaut, package-private pour ce qui est interne au module, `public`
    seulement pour l'API ;
  - des classes `final` (ou scellées) quand l'héritage n'est pas prévu ;
  - éviter les champs `static` modifiables (un état global partagé).

  ```java
  // Mutable et exposé
  public class Panier {
      public List<Ligne> lignes = new ArrayList<>();
      public BigDecimal total;
  }

  // Immuable et encapsulé
  public record Panier(List<Ligne> lignes) {
      public Panier { lignes = List.copyOf(lignes); }
      public Panier ajouter(Ligne l) {
          var copie = new ArrayList<>(lignes);
          copie.add(l);
          return new Panier(copie);
      }
      public BigDecimal total() { return lignes.stream().map(Ligne::montant).reduce(BigDecimal.ZERO, BigDecimal::add); }
  }
  ```

  Ce qu'on y gagne : des objets **thread-safe** par construction, partageables et utilisables comme clés de `HashMap`, un
  état **toujours valide** (vérifié une fois à la construction), un code plus facile à **raisonner** et à tester.

  Le prix : des allocations en plus. Il est faible en pratique (le GC gère bien les objets de courte durée) ; on garde un
  objet mutable quand une mesure le justifie (un `StringBuilder` dans une boucle, une entité JPA).

  **Piège classique** : un getter qui renvoie la liste interne (`return lignes;`). L'appelant la modifie, et l'invariant
  (« le total correspond aux lignes ») est contourné sans passer par la classe.

  **En entretien** : « Immuable par défaut (records, `final`, collections non modifiables, nouvelles valeurs au lieu de
  modifications), visibilité et portée minimales ; c'est plus sûr, thread-safe et plus simple à raisonner. »
cards:
  - key: pourquoi
    format: course
    question: Pourquoi préférer les objets immuables ?
    answer: Ils restent toujours dans l'état valide vérifié à leur construction, sont thread-safe par construction, se partagent sans copie et font de bonnes clés de `HashMap`.
  - key: modifier
    format: course
    question: Comment « modifier » un objet immuable ?
    answer: En créant une nouvelle valeur à partir de l'ancienne (une méthode `avecX` ou `ajouter` qui renvoie un nouvel objet), comme `String`, `BigDecimal` ou les types de `java.time`.
  - key: portee
    format: course
    question: Que signifie minimiser la portée ?
    answer: Déclarer chaque variable au plus près de son usage, dans le plus petit bloc, et donner à chaque classe, méthode et champ la visibilité la plus restreinte qui suffit.
  - key: cout
    format: course
    question: L'immuabilité coûte-t-elle cher en performances ?
    answer: Elle ajoute des allocations, mais les objets de courte durée sont très bon marché pour le GC ; on ne garde un objet mutable que si une mesure le justifie.
  - key: vf-final
    format: true-false
    question: Un champ `final` de type `List` garantit que la liste ne sera pas modifiée.
    truth: false
    answer: '`final` empêche de réaffecter la référence, pas de modifier la liste ; il faut une liste non modifiable.'
  - key: vf-getter
    format: true-false
    question: Un getter qui renvoie directement une liste interne modifiable rompt l'encapsulation.
    truth: true
    answer: L'appelant peut modifier l'état sans passer par la classe.
  - key: vf-thread-safe
    format: true-false
    question: Un objet immuable correctement construit peut être partagé entre threads sans synchronisation.
    truth: true
    answer: Ses champs `final` sont vus initialisés et ne changent plus.
  - key: vf-public
    format: true-false
    question: Rendre tous les champs `public` simplifie la maintenance.
    truth: false
    answer: N'importe quel code peut alors modifier l'état et contourner les invariants.
  - key: qcm-immuable
    format: multiple-choice
    question: Quels éléments rendent une classe immuable ?
    choices:
      - text: "Des champs `private final`"
        correct: true
      - text: "Des copies défensives des collections reçues et renvoyées"
        correct: true
      - text: "Des setters publics"
        correct: false
      - text: "Des champs `static` modifiables"
        correct: false
    answer: Un record le fait en grande partie, avec `List.copyOf` dans le constructeur compact.
  - key: qcm-portee
    format: multiple-choice
    question: Quelles pratiques réduisent la portée ?
    choices:
      - text: "Déclarer une variable au moment où elle reçoit sa valeur, dans le plus petit bloc"
        correct: true
      - text: "Laisser les classes internes au module en visibilité package"
        correct: true
      - text: "Déclarer toutes les variables en début de méthode"
        correct: false
      - text: "Rendre tout `public` au cas où"
        correct: false
    answer: Moins un élément est visible, moins il a d'utilisateurs à prendre en compte en cas de changement.
  - key: qcm-copie
    format: multiple-choice
    question: Comment exposer la liste interne d'une classe sans risque ?
    choices:
      - text: "Renvoyer une copie non modifiable (`List.copyOf(lignes)`) ou stocker déjà une liste non modifiable"
        correct: true
      - text: "Renvoyer `Collections.unmodifiableList(lignes)`, une vue en lecture seule"
        correct: true
      - text: "Renvoyer `lignes` directement"
        correct: false
      - text: "Rendre le champ `public`"
        correct: false
    answer: La vue reflète les changements internes, la copie non.
  - key: qcm-exceptions
    format: multiple-choice
    question: Quand un objet mutable reste-t-il justifié ?
    choices:
      - text: "Un `StringBuilder` local pour construire une chaîne dans une boucle"
        correct: true
      - text: "Une entité JPA, dont l'état évolue et que l'ORM doit modifier"
        correct: true
      - text: "Un DTO de réponse d'API"
        correct: false
      - text: "Une clé de `HashMap`"
        correct: false
    answer: Une clé de map doit justement être immuable.
  - key: bug-getter
    format: bug-fix
    question: |-
      Le total d'une commande ne correspond plus à ses lignes après cet usage :
      ```java
      public List<Ligne> getLignes() { return lignes; }
      // ailleurs : commande.getLignes().add(nouvelleLigne);
      ```
    answer: |-
      ```java
      public List<Ligne> lignes() { return List.copyOf(lignes); }
      public void ajouter(Ligne ligne) {          // le seul chemin pour modifier, qui maintient le total
          lignes.add(ligne);
          total = total.add(ligne.montant());
      }
      ```
      Le getter exposait la liste interne : l'appelant la modifiait sans mettre le total à jour. On renvoie une copie non
      modifiable et l'on passe par une méthode qui maintient l'invariant (ou l'on rend la classe entièrement immuable).
  - key: bug-champs-publics
    format: bug-fix
    question: |-
      Rendez cette classe sûre :
      ```java
      public class Periode {
          public LocalDate debut;
          public LocalDate fin;
      }
      ```
    answer: |-
      ```java
      public record Periode(LocalDate debut, LocalDate fin) {
          public Periode {
              Objects.requireNonNull(debut, "debut");
              Objects.requireNonNull(fin, "fin");
              if (fin.isBefore(debut)) throw new IllegalArgumentException("fin avant début");
          }
      }
      ```
      Des champs publics modifiables permettent à n'importe qui de créer une période invalide. Le record immuable vérifie
      l'invariant une fois pour toutes.
  - key: bug-portee
    format: bug-fix
    question: |-
      Améliorez :
      ```java
      void traiter(List<Commande> commandes) {
          BigDecimal total;
          int i;
          String message;
          for (i = 0; i < commandes.size(); i++) { ... }
          total = calculer(commandes);
          message = "Total : " + total;
          log.info(message);
      }
      ```
    answer: |-
      ```java
      void traiter(List<Commande> commandes) {
          for (Commande commande : commandes) { ... }
          BigDecimal total = calculer(commandes);
          log.info("Total : {}", total);
      }
      ```
      Chaque variable est déclarée là où elle reçoit sa valeur, au plus petit niveau ; le compteur disparaît avec la
      boucle for-each.
  - key: bug-static-mutable
    format: bug-fix
    question: |-
      Ce compteur partagé produit des valeurs incohérentes et rend les tests dépendants de leur ordre :
      ```java
      public class Numeroteur {
          public static int dernierNumero = 0;
          public static int suivant() { return ++dernierNumero; }
      }
      ```
    answer: |-
      ```java
      public final class Numeroteur {
          private final AtomicInteger dernierNumero = new AtomicInteger();
          public int suivant() { return dernierNumero.incrementAndGet(); }
      }
      // une instance injectée là où elle sert, ou une séquence en base
      ```
      Un champ `static` public et modifiable est un état global, non thread-safe, partagé par les tests. Un champ privé
      d'une instance injectée, atomique, limite à la fois la mutabilité et la portée.
  - key: scenario-revue
    format: scenario
    question: En revue, tu vois une classe métier avec des setters pour tous ses champs. Que proposes-tu ?
    answer: |-
      Je demande quels champs changent vraiment au cours de la vie de l'objet. Ceux qui ne changent pas deviennent
      `final`, fixés au constructeur (ou la classe devient un record). Ceux qui évoluent changent par des méthodes métier
      qui maintiennent les invariants (`payer()`, `annuler(motif)`) plutôt que par des setters génériques qui permettent
      n'importe quel état. Les collections sont copiées en entrée et exposées en lecture seule. On gagne un objet toujours
      valide et une intention lisible.
  - key: scenario-entite
    format: scenario
    question: Une entité JPA doit avoir un constructeur sans argument et des champs modifiables. Comment limiter la mutabilité malgré tout ?
    answer: |-
      Le constructeur sans argument peut être `protected` (pour l'ORM seulement) ; un constructeur public ou une fabrique
      crée des objets valides. Pas de setters publics génériques : des méthodes métier qui modifient l'état en respectant
      les règles. Les collections sont exposées en lecture seule. Et l'entité ne sort pas de la couche de persistance :
      l'API et le domaine manipulent des records immuables (DTO, objets du domaine), conformément à la règle du projet.
  - key: scenario-performance
    format: scenario
    question: Un collègue craint que créer un nouvel objet à chaque modification ralentisse l'application. Que lui réponds-tu ?
    answer: |-
      Que les objets de courte durée sont très bon marché sur la JVM : allocation par incrément de pointeur, collecte de la
      jeune génération qui ne coûte que pour les survivants, et parfois suppression pure par l'analyse d'échappement. Le
      gain en justesse (pas d'état incohérent, pas de partage dangereux entre threads) est presque toujours supérieur. Si
      un profil montre qu'un chemin critique alloue trop, on y utilise localement un objet mutable (un `StringBuilder`, un
      tableau), sans exposer cette mutabilité.
  - key: scenario-thread-safe
    format: scenario
    question: Comment l'immuabilité simplifie-t-elle un cache de configuration partagé par tous les threads ?
    answer: |-
      La configuration est un objet immuable (un record avec des collections non modifiables). Pour la recharger, on
      construit une nouvelle configuration complète, puis on remplace la référence (un champ `volatile` ou une
      `AtomicReference`). Les threads lisent sans verrou et voient toujours une configuration entière, l'ancienne ou la
      nouvelle, jamais un mélange. Aucune synchronisation fine n'est nécessaire, parce que rien ne change en place.
