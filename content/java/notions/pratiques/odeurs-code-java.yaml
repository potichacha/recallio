notion: odeurs-code-java
lesson: |-
  Une **odeur de code** (*code smell*, Martin Fowler) n'est pas forcément un bug : c'est un signe que le code sera difficile
  à comprendre ou à faire évoluer. Les plus fréquentes en Java, et leur correction :

  | Odeur | Correction |
  |---|---|
  | **méthode trop longue** | extraire des méthodes nommées |
  | **classe dieu** (*god class*) qui fait tout | séparer les responsabilités en classes cohérentes |
  | **nombres et chaînes magiques** | des constantes nommées, des enums |
  | **obsession des primitifs** (`String email`, `long montantCentimes` partout) | des types valeur : `record Email`, `record Montant` |
  | **longue liste de paramètres** | un objet paramètre (record), ou revoir le découpage |
  | **code dupliqué** | extraire une méthode ou une classe commune |
  | **`switch` ou `if` en cascade sur un type** | du polymorphisme, ou un `switch` exhaustif sur un type scellé |
  | **jalousie de fonctionnalité** (*feature envy*) : une méthode qui manipule surtout les données d'un autre objet | déplacer la méthode vers cet objet |
  | **paramètre booléen** qui change le comportement | deux méthodes nommées |
  | **`catch` vide** ou exception avalée | traiter, enrichir et relancer, ou journaliser une fois |
  | **commentaires qui expliquent un code obscur** | renommer, extraire |
  | **état mutable partagé** (`static` modifiable, getter qui expose une collection) | immuabilité, encapsulation |
  | **`instanceof` en chaîne et casts** | polymorphisme ou filtrage par motif sur un type scellé |

  ```java
  // Obsession des primitifs : rien n'empêche d'inverser les arguments
  void virer(long montant, String deCompte, String versCompte) { ... }

  // Des types valeur : le compilateur protège, la validation est faite une fois
  record Iban(String valeur) { Iban { if (!IbanValide.verifier(valeur)) throw new IbanInvalideException(valeur); } }
  record Montant(long centimes) { Montant { if (centimes <= 0) throw new IllegalArgumentException(); } }
  void virer(Montant montant, Iban source, Iban destination) { ... }
  ```

  On corrige une odeur par un **refactoring** : une transformation qui ne change pas le comportement, faite **par petits
  pas**, sous la protection des **tests**, et de préférence avec les refactorings automatiques de l'IDE. On améliore le code
  qu'on touche (la règle du boy-scout), sans tout réécrire.

  **Piège classique** : corriger une odeur sans tests, dans la même pull request qu'une nouvelle fonctionnalité. Si un
  comportement change, impossible de savoir si c'est voulu ; on sépare refactoring et changement de comportement.

  **En entretien** : « Méthode longue, classe dieu, nombres magiques, obsession des primitifs, duplication, cascades de
  `if` sur des types ; je les corrige par des refactorings sous tests, par petits pas, séparés des évolutions. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'une odeur de code ?
    answer: Un symptôme qui n'est pas forcément un bug, mais qui annonce un code difficile à comprendre ou à faire évoluer (méthode trop longue, duplication, classe qui fait tout...).
  - key: primitifs
    format: course
    question: Qu'est-ce que l'obsession des primitifs, et comment la corriger ?
    answer: Représenter des notions métier par des types de base (`String` pour un e-mail, `long` pour un montant) ; on les remplace par des types valeur (records) qui valident à la construction et empêchent les confusions d'arguments.
  - key: feature-envy
    format: course
    question: Qu'est-ce que la jalousie de fonctionnalité (feature envy) ?
    answer: Une méthode qui utilise surtout les données et méthodes d'un autre objet ; elle devrait sans doute être déplacée dans cet objet.
  - key: refactoring
    format: course
    question: Comment corriger une odeur de code sans risque ?
    answer: Par un refactoring qui ne change pas le comportement, fait par petits pas, sous la protection de tests, de préférence avec les outils automatiques de l'IDE, et séparé des changements fonctionnels.
  - key: vf-bug
    format: true-false
    question: Une odeur de code est toujours un bug.
    truth: false
    answer: C'est un signal de difficulté future, pas forcément une erreur actuelle.
  - key: vf-meme-pr
    format: true-false
    question: Il est préférable de mélanger refactoring et nouvelle fonctionnalité dans la même pull request.
    truth: false
    answer: On les sépare pour savoir quel changement modifie le comportement.
  - key: vf-type-valeur
    format: true-false
    question: Remplacer `String email` par un `record Email` permet de valider l'e-mail une seule fois, à la construction.
    truth: true
    answer: Et le compilateur empêche de passer un nom à la place d'un e-mail.
  - key: vf-boy-scout
    format: true-false
    question: La règle du boy-scout consiste à laisser le code un peu plus propre qu'on ne l'a trouvé.
    truth: true
    answer: Une amélioration à chaque passage, sans grande réécriture.
  - key: qcm-odeurs
    format: multiple-choice
    question: Lesquelles sont des odeurs de code ?
    choices:
      - text: "Une méthode de 250 lignes"
        correct: true
      - text: "Le même calcul copié dans trois services"
        correct: true
      - text: "Un record immuable de trois composants"
        correct: false
      - text: "Une méthode courte et bien nommée"
        correct: false
    answer: La longueur et la duplication rendent les évolutions risquées.
  - key: qcm-correction
    format: multiple-choice
    question: Associez correctement odeur et correction.
    choices:
      - text: "Cascade de `if (x instanceof ...)` : `switch` exhaustif sur un type scellé ou polymorphisme"
        correct: true
      - text: "Nombre magique `0.2` : constante nommée `TAUX_TVA`"
        correct: true
      - text: "Classe dieu : ajouter encore des méthodes"
        correct: false
      - text: "Duplication : copier dans un quatrième endroit"
        correct: false
    answer: Une classe dieu se découpe par responsabilités.
  - key: qcm-primitifs
    format: multiple-choice
    question: "Quel défaut a `void virer(long montant, String de, String vers)` ?"
    choices:
      - text: "Rien n'empêche d'inverser les comptes ou de passer un montant négatif"
        correct: true
      - text: "La validation doit être répétée chez chaque appelant"
        correct: true
      - text: "Elle est trop rapide"
        correct: false
      - text: "Elle ne compile pas"
        correct: false
    answer: Des types valeur (`Iban`, `Montant`) règlent les deux problèmes.
  - key: qcm-classe-dieu
    format: multiple-choice
    question: "Une classe `GestionnaireCommandes` de 3 000 lignes gère le panier, le paiement, l'expédition et les e-mails. Que faire ?"
    choices:
      - text: "La découper en classes par responsabilité, progressivement et sous tests"
        correct: true
      - text: "La réécrire entièrement d'un coup, sans tests"
        correct: false
      - text: "La renommer `GestionnaireGeneral`"
        correct: false
      - text: "Ne rien faire, tant qu'elle compile"
        correct: false
    answer: Un refactoring par petits pas réduit le risque.
  - key: bug-nombres-magiques
    format: bug-fix
    question: |-
      Améliorez :
      ```java
      if (client.getType() == 2 && total > 50000) {
          total = total - total * 15 / 100;
      }
      ```
    answer: |-
      ```java
      private static final long SEUIL_REMISE_PRO_CENTIMES = 50_000;
      private static final int TAUX_REMISE_PRO = 15;

      if (client.type() == TypeClient.PROFESSIONNEL && total > SEUIL_REMISE_PRO_CENTIMES) {
          total = total - total * TAUX_REMISE_PRO / 100;
      }
      ```
      Une enum remplace le code `2`, des constantes nommées remplacent les nombres : la règle se lit, et se modifie à un
      seul endroit.
  - key: bug-cascade-type
    format: bug-fix
    question: |-
      Ajouter un moyen de paiement oblige à modifier cette méthode et d'autres semblables :
      ```java
      double frais(Paiement p) {
          if (p.getType().equals("CARTE")) return p.getMontant() * 0.015;
          else if (p.getType().equals("VIREMENT")) return 0.5;
          else if (p.getType().equals("PAYPAL")) return p.getMontant() * 0.03;
          return 0;
      }
      ```
    answer: |-
      ```java
      sealed interface Paiement permits Carte, Virement, Paypal { BigDecimal montant(); }

      BigDecimal frais(Paiement p) {
          return switch (p) {
              case Carte c -> c.montant().multiply(new BigDecimal("0.015"));
              case Virement v -> new BigDecimal("0.50");
              case Paypal pp -> pp.montant().multiply(new BigDecimal("0.03"));
          };
      }
      ```
      Une chaîne et un `if` en cascade ne garantissent rien. Un type scellé et un `switch` exhaustif font signaler par le
      compilateur chaque `switch` à compléter (et les montants passent en `BigDecimal`).
  - key: bug-catch-vide
    format: bug-fix
    question: |-
      Corrigez :
      ```java
      try {
          envoyerFacture(commande);
      } catch (Exception e) {
      }
      ```
    answer: |-
      ```java
      try {
          envoyerFacture(commande);
      } catch (EnvoiImpossibleException e) {
          log.warn("Facture de la commande {} non envoyée, nouvel essai planifié", commande.id(), e);
          planificateur.reessayer(commande);
      }
      ```
      Un `catch` vide sur `Exception` avale toutes les erreurs, y compris les bugs. On attrape l'exception attendue et on
      la traite réellement (ou on la laisse remonter).
  - key: bug-feature-envy
    format: bug-fix
    question: |-
      Déplacez la responsabilité au bon endroit :
      ```java
      class ServiceLivraison {
          boolean estLivrableEnUnJour(Adresse a) {
              return a.getPays().equals("FR") && !a.getCodePostal().startsWith("97") && a.getVille() != null;
          }
      }
      ```
    answer: |-
      ```java
      record Adresse(String pays, String codePostal, String ville) {
          boolean estEnFranceMetropolitaine() {
              return pays.equals("FR") && !codePostal.startsWith("97");
          }
      }

      class ServiceLivraison {
          boolean estLivrableEnUnJour(Adresse a) { return a.estEnFranceMetropolitaine(); }
      }
      ```
      La méthode ne manipulait que les données de l'adresse : la règle appartient à `Adresse`, où elle se teste et se
      réutilise.
  - key: scenario-priorites
    format: scenario
    question: Tu reprends un module plein d'odeurs de code. Par où commences-tu ?
    answer: |-
      Par ce qui coûte le plus : le code qui change souvent et qui casse (l'historique Git et les tickets le montrent), pas
      le code ancien et stable. J'y ajoute d'abord des tests (de caractérisation si besoin), puis je corrige par petits pas
      : extraire des méthodes, introduire des types valeur, remplacer les cascades de `if` par un type scellé, supprimer
      les duplications. Chaque refactoring va dans sa propre pull request, séparée des évolutions. J'applique ensuite la
      règle du boy-scout à chaque passage plutôt qu'une grande réécriture.
  - key: scenario-types-valeur
    format: scenario
    question: Dans un service bancaire, les IBAN, montants et devises circulent en `String` et `long`. Faut-il introduire des types dédiés ?
    answer: |-
      Oui : des records `Iban`, `Montant` (valeur et devise) qui valident à la construction (format, signe, devise
      autorisée). Les erreurs d'inversion d'arguments deviennent impossibles, la validation n'est faite qu'une fois, et
      le code dit ce qu'il manipule. Je les introduis progressivement : d'abord aux frontières (les DTO convertis en types
      valeur à l'entrée), puis dans les signatures internes, avec les conversions pour la persistance et le JSON.
  - key: scenario-revue
    format: scenario
    question: En revue, comment signales-tu une odeur de code sans bloquer inutilement une pull request ?
    answer: |-
      Je distingue le bloquant (un bug, une faille, une violation d'architecture) de la suggestion (un nom, une méthode à
      extraire). Pour une odeur, je propose une correction concrète et j'explique le risque futur (« ce `if` en cascade
      oubliera le prochain moyen de paiement »). Si la correction est importante et sans rapport avec la pull request, je
      propose un ticket ou une pull request de suivi plutôt que de l'exiger tout de suite. Le but est d'améliorer le code
      sans décourager.
  - key: scenario-reecriture
    format: scenario
    question: Une équipe veut réécrire de zéro un module jugé trop « sale ». Qu'en penses-tu ?
    answer: |-
      Une réécriture complète est risquée : elle perd des comportements implicites (cas limites, corrections accumulées),
      prend plus de temps que prévu, et le module existant continue d'évoluer en parallèle. Je préfère un refactoring
      progressif sous tests, ou, si une nouvelle conception est vraiment nécessaire, une migration par étapes (le motif de
      l'étrangleur) : le nouveau code remplace l'ancien fonctionnalité par fonctionnalité, avec des tests de caractérisation
      ou un rejeu de trafic pour vérifier l'équivalence.
