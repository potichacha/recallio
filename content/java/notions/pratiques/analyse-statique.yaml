notion: analyse-statique
lesson: |-
  L'**analyse statique** examine le code **sans l'exécuter** pour y trouver des bugs probables, des failles et des écarts
  de style. Elle complète les tests : elle couvre tous les chemins, y compris ceux qu'aucun test n'emprunte.

  Les outils, du plus proche du compilateur au plus large :

  | Outil | Ce qu'il trouve | Quand |
  |---|---|---|
  | **avertissements de `javac`** (`-Xlint:all -Werror`) | conversions non vérifiées, dépréciations, `switch` incomplets | à la compilation |
  | **Error Prone** (Google) | des bugs courants : `equals` mal écrit, résultat ignoré, mauvais format | à la compilation |
  | **NullAway** (sur Error Prone) | des déréférencements de valeurs peut-être nulles (avec JSpecify) | à la compilation |
  | **SpotBugs** | des motifs de bugs dans le bytecode (concurrence, ressources, null) | après la compilation |
  | **PMD**, **Checkstyle** | des règles de style et de conception | au build |
  | **SonarQube / SonarCloud** | une synthèse : bugs, vulnérabilités, *code smells*, duplication, couverture | en CI, par pull request |
  | **Spotless** (formatage) | le format du code, appliqué automatiquement | au build |
  | analyse des **dépendances** (OWASP Dependency-Check, Dependabot, Renovate) | des bibliothèques vulnérables ou obsolètes | en continu |

  Bonnes pratiques :
  - **dans le build et la CI**, pas seulement dans l'IDE : une règle non appliquée automatiquement n'est pas une règle ;
  - **faire échouer le build** sur les problèmes graves, dès le début du projet (plus facile que de rattraper des milliers
    d'avertissements) ;
  - sur un projet existant, appliquer les règles au **nouveau code** (Sonar : « clean as you code ») plutôt que de tout
    corriger d'un coup ;
  - traiter chaque **faux positif** explicitement (une suppression locale justifiée), pas en désactivant la règle partout ;
  - le formatage automatique supprime les débats de style en revue.

  Dans ce projet : Spotless, Error Prone et NullAway avec JSpecify dès la phase 0 (ADR 0004), et ArchUnit pour les règles
  d'architecture.

  **Piège classique** : activer Sonar sur un vieux projet et afficher 4 000 problèmes. Personne ne les traite, et la
  nouvelle dette se mêle à l'ancienne ; on commence par bloquer les nouveaux problèmes.

  **En entretien** : « Avertissements du compilateur, Error Prone et NullAway à la compilation, SpotBugs et Sonar en CI,
  formatage automatique ; dans le build, bloquant pour le grave, appliqué au nouveau code d'abord. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce que l'analyse statique ?
    answer: L'examen du code sans l'exécuter, pour détecter des bugs probables, des failles, des écarts de style ou de conception ; elle couvre tous les chemins, y compris ceux qu'aucun test n'exerce.
  - key: error-prone
    format: course
    question: Que fait Error Prone ?
    answer: Il s'intègre au compilateur et transforme des bugs courants en erreurs de compilation (`equals` incorrect, résultat d'une méthode pure ignoré, format de chaîne invalide) ; NullAway s'y ajoute pour la nullité.
  - key: nouveau-code
    format: course
    question: Comment introduire l'analyse statique sur un projet existant ?
    answer: En appliquant les règles au nouveau code et au code modifié (« clean as you code »), avec les problèmes graves bloquants, plutôt qu'en exigeant de corriger d'un coup tout l'existant.
  - key: faux-positifs
    format: course
    question: Comment traiter un faux positif ?
    answer: Par une suppression locale et justifiée (une annotation sur l'élément concerné, avec un commentaire), sans désactiver la règle pour tout le projet.
  - key: vf-tests
    format: true-false
    question: L'analyse statique remplace les tests.
    truth: false
    answer: Elle détecte des motifs d'erreurs, pas le comportement métier attendu ; les deux se complètent.
  - key: vf-ide
    format: true-false
    question: Une analyse lancée seulement dans l'IDE suffit à garantir la qualité.
    truth: false
    answer: Une règle doit être appliquée par le build et la CI pour s'imposer à tous.
  - key: vf-nullaway
    format: true-false
    question: NullAway détecte à la compilation des déréférencements de valeurs qui peuvent être nulles.
    truth: true
    answer: En s'appuyant sur les annotations de nullité.
  - key: vf-spotbugs
    format: true-false
    question: SpotBugs analyse le bytecode compilé.
    truth: true
    answer: Contrairement à Error Prone, qui travaille pendant la compilation.
  - key: qcm-outils
    format: multiple-choice
    question: Associez correctement l'outil et son rôle.
    choices:
      - text: "Spotless : formater automatiquement le code"
        correct: true
      - text: "Dependabot ou Renovate : signaler les dépendances à mettre à jour"
        correct: true
      - text: "Checkstyle : exécuter les tests"
        correct: false
      - text: "Sonar : compiler le code"
        correct: false
    answer: Sonar agrège les analyses ; il ne compile pas.
  - key: qcm-bloquant
    format: multiple-choice
    question: Que faut-il rendre bloquant en CI ?
    choices:
      - text: "Les bugs et vulnérabilités graves"
        correct: true
      - text: "Un code non formaté (quand le formatage est automatique)"
        correct: true
      - text: "Chaque remarque de style mineure de l'ancien code"
        correct: false
      - text: "Rien, l'analyse doit rester informative"
        correct: false
    answer: Un seuil bloquant sur le grave et le nouveau code, informatif sur le reste.
  - key: qcm-compilation
    format: multiple-choice
    question: Quels outils agissent pendant la compilation ?
    choices:
      - text: "Error Prone"
        correct: true
      - text: "Les avertissements de `javac` avec `-Xlint` et `-Werror`"
        correct: true
      - text: "SonarQube"
        correct: false
      - text: "Dependabot"
        correct: false
    answer: Sonar et Dependabot analysent en dehors du compilateur.
  - key: qcm-dette
    format: multiple-choice
    question: Un vieux projet affiche 4 000 problèmes Sonar. Quelle démarche adopter ?
    choices:
      - text: "Bloquer les nouveaux problèmes et améliorer le code qu'on touche"
        correct: true
      - text: "Corriger d'abord les problèmes graves (bugs, failles) de l'existant"
        correct: true
      - text: "Désactiver Sonar"
        correct: false
      - text: "Geler les fonctionnalités jusqu'à zéro problème"
        correct: false
    answer: La dette se résorbe progressivement, sans en ajouter.
  - key: scenario-nouveau-projet
    format: scenario
    question: Quelle analyse statique mets-tu en place dès le premier jour d'un projet Java ?
    answer: |-
      Un formatage automatique (Spotless) vérifié en CI, les avertissements du compilateur traités comme des erreurs sur
      ce qui compte, Error Prone avec NullAway et `@NullMarked` sur tous les packages, ArchUnit pour les règles
      d'architecture, et une analyse des dépendances (Dependabot ou Renovate, et un scan de vulnérabilités). Sonar en CI
      par pull request si l'équipe en a l'usage. Le tout bloquant dès le départ : il est bien plus facile de garder un
      projet propre que de le nettoyer plus tard. C'est le choix fait ici en phase 0.
  - key: scenario-faux-positifs
    format: scenario
    question: L'équipe se plaint qu'Error Prone bloque le build sur des « faux positifs ». Que fais-tu ?
    answer: |-
      J'examine les cas un par un : souvent, ce sont de vrais problèmes mal compris (un résultat ignoré, un `equals`
      douteux), et la règle a raison. Pour les vrais faux positifs, une suppression locale (`@SuppressWarnings("NomDeRegle")`
      sur l'élément, avec un commentaire), pas une désactivation globale. Si une règle n'apporte rien au projet, on la
      désactive explicitement dans la configuration partagée, en le documentant. Je garde l'outil bloquant : un
      avertissement qui ne bloque pas finit ignoré.
  - key: scenario-sonar
    format: scenario
    question: Comment utilises-tu Sonar dans les pull requests sans freiner l'équipe ?
    answer: |-
      Avec une « quality gate » centrée sur le nouveau code : pas de nouveau bug ni de nouvelle vulnérabilité, une
      couverture minimale des nouvelles lignes, pas de duplication importante. Les remarques mineures sont des suggestions
      que l'auteur juge. L'analyse est rapide (incrémentale) et ses résultats s'affichent dans la pull request. Je revois
      régulièrement les règles avec l'équipe pour retirer celles qui n'apportent rien et garder la confiance dans l'outil.
  - key: scenario-dependances
    format: scenario
    question: Une vulnérabilité critique est annoncée dans une bibliothèque largement utilisée. Comment sais-tu si tes services sont touchés ?
    answer: |-
      Grâce à un inventaire des dépendances tenu à jour automatiquement : l'analyse des dépendances en CI (Dependabot,
      Renovate, OWASP Dependency-Check, ou le scan des images de conteneur) signale les versions vulnérables, y compris
      transitives (`mvn dependency:tree` pour confirmer). Je vérifie si le code utilise la fonction vulnérable, je monte de
      version (souvent via le BOM du framework), je teste et je déploie en priorité. Des mises à jour régulières et
      automatisées rendent ce correctif rapide, au lieu d'une montée de version risquée de plusieurs années.
