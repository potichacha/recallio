notion: nommage-lisibilite
lesson: |-
  Le code est lu bien plus souvent qu'il n'est écrit. Deux leviers principaux le rendent lisible : des **noms** qui disent
  l'intention, et des **méthodes courtes** qui font une seule chose.

  **Nommer** :
  - des noms qui disent **pourquoi** et **quoi**, pas comment : `joursDepuisDerniereRevision` plutôt que `d` ou `tmp` ;
  - les conventions Java : `PascalCase` pour les types, `camelCase` pour les méthodes et variables, `MAJUSCULES_AVEC_TIRETS`
    pour les constantes, packages en minuscules ;
  - des **verbes** pour les méthodes (`calculerTotal`, `envoyer`), des **noms** pour les classes (`Facture`), des
    questions pour les booléens (`estExpire`, `aDesLignes`) ;
  - pas d'abréviations obscures ni de préfixes techniques (`strNom`, `m_compte`, `IService`) ;
  - le **vocabulaire du métier** (*ubiquitous language*) : si le métier dit « streak », le code aussi ;
  - une **constante nommée** à la place d'un nombre magique : `SEUIL_REMISE` plutôt que `10000`.

  **Découper** :
  - une méthode fait **une chose**, à un seul niveau d'abstraction, et tient dans un écran (une vingtaine de lignes) ;
  - on **extrait** une méthode nommée plutôt qu'écrire un commentaire qui explique un bloc ;
  - des **retours anticipés** (*guard clauses*) plutôt qu'une pyramide de `if` imbriqués ;
  - peu de paramètres (au-delà de trois ou quatre, un objet paramètre ou un record) ; pas de paramètre booléen qui change le
    comportement (`envoyer(true)`) : deux méthodes nommées.

  ```java
  // Avant
  if (c != null) { if (c.getS() == 2) { if (c.getT() > 10000) { r = c.getT() * 0.1; } } }

  // Après
  if (!commande.estPayee()) return BigDecimal.ZERO;
  if (commande.total().compareTo(SEUIL_REMISE) <= 0) return BigDecimal.ZERO;
  return commande.total().multiply(TAUX_REMISE);
  ```

  Les commentaires expliquent le **pourquoi** (une contrainte, une décision), pas le **quoi** que le code dit déjà.

  **Piège classique** : un commentaire au-dessus d'un bloc (« // calcul des frais de port ») au lieu d'une méthode
  `fraisDePort()`. Le commentaire vieillit et ment ; le nom de méthode reste attaché au code.

  **En entretien** : « Des noms qui disent l'intention dans le vocabulaire du métier, des méthodes courtes à un seul niveau
  d'abstraction, des retours anticipés, des constantes nommées ; les commentaires pour le pourquoi. »
tour:
  - title: Nommer et découper
    text: |-
      Un code lisible commence par de bons noms : une méthode dit ce qu'elle **fait** (`totalHt`, `estGrosseCommande`),
      une variable ce qu'elle **contient** (`facture` plutôt que `f`), et un booléen se lit comme une question.

      Une méthode courte fait une seule chose : quand un bloc a besoin d'un commentaire pour être compris, il mérite
      souvent sa propre méthode, dont le nom remplace le commentaire. Ce programme découpe ainsi un calcul de facture.
    example:
      files:
        Main.java: |-
          record Ligne(String article, int quantite, double prixUnitaire) {
              double montant() {
                  return quantite * prixUnitaire;
              }
          }

          static final double TAUX_TVA = 0.20;

          double totalHt(List<Ligne> lignes) {
              double total = 0;
              for (Ligne ligne : lignes) {
                  total += ligne.montant();
              }
              return total;
          }

          double totalTtc(List<Ligne> lignes) {
              return Math.round(totalHt(lignes) * (1 + TAUX_TVA) * 100) / 100.0;
          }

          boolean estGrosseCommande(List<Ligne> lignes) {
              return totalHt(lignes) > 100;
          }

          void main() {
              List<Ligne> facture = List.of(new Ligne("clavier", 2, 45), new Ligne("souris", 1, 25));
              IO.println("HT : " + totalHt(facture) + ", TTC : " + totalTtc(facture));
              IO.println("grosse commande : " + estGrosseCommande(facture));
          }
      output: |-
        HT : 115.0, TTC : 138.0
        grosse commande : true
cards:
  - key: bon-nom
    format: course
    question: Qu'est-ce qu'un bon nom de variable ou de méthode ?
    answer: Un nom qui dit l'intention (ce que c'est, pourquoi), dans le vocabulaire du métier, sans abréviation obscure ; un verbe pour une méthode, une question pour un booléen.
  - key: methode-courte
    format: course
    question: Pourquoi garder des méthodes courtes ?
    answer: Une méthode qui fait une seule chose, à un niveau d'abstraction, se comprend, se nomme et se teste facilement ; son nom documente le bloc qu'elle remplace.
  - key: guard
    format: course
    question: Qu'est-ce qu'un retour anticipé (guard clause) ?
    answer: Traiter les cas particuliers en début de méthode par un `return` ou une exception, pour éviter les `if` imbriqués et garder le cas principal à plat.
  - key: commentaires
    format: course
    question: Que doit expliquer un commentaire ?
    answer: Le pourquoi (une contrainte, une décision, un piège) ; le quoi doit être dit par le code lui-même, avec des noms et des méthodes bien choisis.
  - key: vf-abreviation
    format: true-false
    question: "Des noms courts comme `c`, `tmp` ou `d2` rendent le code plus lisible."
    truth: false
    answer: Ils obligent le lecteur à deviner ; un nom explicite coûte peu.
  - key: vf-constante
    format: true-false
    question: Remplacer `10000` par une constante `SEUIL_REMISE_CENTIMES` améliore la lisibilité.
    truth: true
    answer: Et l'on ne modifie la valeur qu'à un endroit.
  - key: vf-booleen
    format: true-false
    question: Un paramètre booléen comme `exporter(true)` est une bonne façon de choisir un comportement.
    truth: false
    answer: '`exporter(true)` ne dit rien à l''appel ; deux méthodes nommées (`exporterAvecEntete`) sont plus claires.'
  - key: vf-metier
    format: true-false
    question: Le code devrait utiliser le même vocabulaire que les experts du métier.
    truth: true
    answer: C'est le langage omniprésent (ubiquitous language) de la conception pilotée par le domaine.
  - key: qcm-noms
    format: multiple-choice
    question: Quels noms sont bien choisis ?
    choices:
      - text: "`estExpire()` pour un booléen"
        correct: true
      - text: "`calculerFraisDePort()` pour une méthode"
        correct: true
      - text: "`doStuff()`"
        correct: false
      - text: "`strNomClient` pour une `String`"
        correct: false
    answer: Le type n'a pas à figurer dans le nom.
  - key: qcm-conventions
    format: multiple-choice
    question: Lesquelles respectent les conventions Java ?
    choices:
      - text: "`class FactureService`"
        correct: true
      - text: "`static final int TAILLE_MAXIMALE = 50;`"
        correct: true
      - text: "`void Calculer_Total()`"
        correct: false
      - text: "`package Com.Recallio;`"
        correct: false
    answer: Méthodes en camelCase, packages en minuscules.
  - key: qcm-commentaire
    format: multiple-choice
    question: Quels commentaires sont utiles ?
    choices:
      - text: "`// Le partenaire refuse les lots de plus de 500 lignes (contrat du 12/03)`"
        correct: true
      - text: "`// Arrondi bancaire imposé par la réglementation`"
        correct: true
      - text: "`// incrémente i` au-dessus de `i++`"
        correct: false
      - text: "`// boucle sur les commandes` au-dessus d'une boucle sur les commandes"
        correct: false
    answer: Un commentaire utile dit ce que le code ne peut pas dire.
  - key: qcm-parametres
    format: multiple-choice
    question: Une méthode prend sept paramètres. Que faire ?
    choices:
      - text: "Regrouper les paramètres liés dans un record (un objet paramètre)"
        correct: true
      - text: "Vérifier si la méthode n'en fait pas trop, et la découper"
        correct: true
      - text: "Passer une `Map<String, Object>`"
        correct: false
      - text: "Utiliser des champs statiques"
        correct: false
    answer: Une `Map` perd le typage et la lisibilité.
  - key: bug-noms
    format: bug-fix
    question: |-
      Rendez lisible :
      ```java
      int d(List<R> l) {
          int n = 0;
          for (R r : l) if (r.e().isBefore(LocalDate.now())) n++;
          return n;
      }
      ```
    answer: |-
      ```java
      long nombreDeRevisionsEnRetard(List<Revision> revisions, LocalDate aujourdhui) {
          return revisions.stream()
                  .filter(revision -> revision.echeance().isBefore(aujourdhui))
                  .count();
      }
      ```
      Des noms explicites, la date du jour reçue en paramètre (testable), et un stream qui dit l'intention.
  - key: bug-imbrication
    format: bug-fix
    question: |-
      Aplatissez :
      ```java
      BigDecimal remise(Commande c) {
          BigDecimal r = BigDecimal.ZERO;
          if (c != null) {
              if (c.estPayee()) {
                  if (c.total().compareTo(new BigDecimal("100")) > 0) {
                      r = c.total().multiply(new BigDecimal("0.1"));
                  }
              }
          }
          return r;
      }
      ```
    answer: |-
      ```java
      private static final BigDecimal SEUIL_REMISE = new BigDecimal("100");
      private static final BigDecimal TAUX_REMISE = new BigDecimal("0.1");

      BigDecimal remise(Commande commande) {
          Objects.requireNonNull(commande, "commande");
          if (!commande.estPayee() || commande.total().compareTo(SEUIL_REMISE) <= 0) {
              return BigDecimal.ZERO;
          }
          return commande.total().multiply(TAUX_REMISE);
      }
      ```
      Des retours anticipés et des constantes nommées remplacent la pyramide de `if` et les nombres magiques.
  - key: bug-commentaire-bloc
    format: bug-fix
    question: |-
      Améliorez :
      ```java
      void valider(Commande c) {
          // vérifier le stock
          for (Ligne l : c.lignes()) { if (stock.disponible(l.produit()) < l.quantite()) throw new StockInsuffisant(l); }
          // calculer le total
          BigDecimal total = c.lignes().stream().map(Ligne::montant).reduce(BigDecimal.ZERO, BigDecimal::add);
          // enregistrer
          repository.enregistrer(c.avecTotal(total));
      }
      ```
    answer: |-
      ```java
      void valider(Commande commande) {
          verifierStock(commande);
          repository.enregistrer(commande.avecTotal(total(commande)));
      }

      private void verifierStock(Commande commande) { ... }
      private BigDecimal total(Commande commande) { ... }
      ```
      Chaque commentaire de bloc devient une méthode nommée : la méthode principale se lit comme un résumé, au même niveau
      d'abstraction.
  - key: bug-parametre-booleen
    format: bug-fix
    question: |-
      Les appels `exporter(rapport, true, false)` sont illisibles :
      ```java
      void exporter(Rapport r, boolean avecEntete, boolean compresse) { ... }
      ```
    answer: |-
      ```java
      record OptionsExport(boolean avecEntete, boolean compresse) {
          static OptionsExport parDefaut() { return new OptionsExport(true, false); }
      }
      void exporter(Rapport rapport, OptionsExport options) { ... }
      // exporter(rapport, new OptionsExport(true, false)) ou une enum si les cas sont exclusifs
      ```
      Les booléens positionnels ne disent rien à l'appel. Un objet d'options nommé (ou deux méthodes distinctes) rend
      l'intention lisible.
  - key: scenario-revue
    format: scenario
    question: Que regardes-tu en priorité, côté lisibilité, lors d'une revue de code ?
    answer: |-
      Que les noms disent l'intention et parlent le langage du métier, que les méthodes font une seule chose et tiennent
      dans un écran, qu'il n'y a pas de nombres magiques ni de paramètres booléens obscurs, que les cas particuliers sont
      traités par des retours anticipés plutôt que des `if` imbriqués, et que les commentaires expliquent un pourquoi. Je
      me demande si un nouveau venu comprendrait le code sans explication. Je formule mes remarques comme des suggestions,
      sauf quand la lisibilité cache un bug.
  - key: scenario-renommer
    format: scenario
    question: Un concept métier a changé de nom (« abonnement » devient « adhésion »). Faut-il renommer le code ?
    answer: |-
      Oui, si le nouveau nom est celui du métier : un écart entre le vocabulaire des experts et celui du code crée des
      malentendus permanents. L'IDE renomme sûrement classes, méthodes et variables ; je fais attention à ce qu'il ne voit
      pas : noms de tables et de colonnes (une migration), champs de l'API publique (une évolution compatible, avec
      période de transition), messages et fichiers de configuration. Je découpe le renommage en étapes, dans des pull
      requests dédiées, sans mélanger avec des changements de comportement.
  - key: scenario-longue-methode
    format: scenario
    question: Tu dois modifier une méthode de 300 lignes sans tests. Comment procèdes-tu ?
    answer: |-
      D'abord des tests de caractérisation qui capturent son comportement actuel sur des cas représentatifs. Ensuite des
      extractions de méthodes, mécaniques et faites par l'IDE, qui donnent un nom à chaque bloc (souvent signalé par un
      commentaire ou une ligne vide), en relançant les tests à chaque étape. Une fois la méthode découpée et lisible,
      j'apporte la modification demandée, dans une pull request séparée du refactoring pour faciliter la relecture.
  - key: scenario-standards
    format: scenario
    question: Comment garder une lisibilité homogène dans une équipe ?
    answer: |-
      Par l'outillage d'abord : un formatage automatique (Spotless) appliqué en CI, pour ne plus en discuter, et une
      analyse statique (Error Prone, Sonar) pour les règles mécaniques. Puis par des conventions écrites courtes (nommage,
      taille des méthodes, langue du code), un glossaire du métier, et la revue de code systématique où ces points sont
      discutés. Les exemples du code existant comptent plus qu'un long document : on améliore le code qu'on touche.
