notion: path-files
lesson: |-
  Depuis Java 7, **NIO.2** remplace l'ancienne classe `File` par deux outils :
  - **`Path`** : un chemin (pas forcément existant) ;
  - **`Files`** : des méthodes statiques pour tout faire sur les fichiers.

  ```java
  Path dossier = Path.of("donnees", "2026");          // donnees/2026, avec le bon séparateur
  Path fichier = dossier.resolve("ventes.csv");       // donnees/2026/ventes.csv
  fichier.getFileName();                              // ventes.csv
  fichier.getParent();                                // donnees/2026

  Files.createDirectories(dossier);                   // crée aussi les parents
  Files.writeString(fichier, "id;montant\n");         // écrit (UTF-8)
  String texte = Files.readString(fichier);           // lit tout (petits fichiers)
  List<String> lignes = Files.readAllLines(fichier);  // tout en mémoire
  try (Stream<String> s = Files.lines(fichier)) { }   // à la demande, à fermer
  Files.copy(fichier, sauvegarde, StandardCopyOption.REPLACE_EXISTING);
  Files.move(temp, fichier, StandardCopyOption.ATOMIC_MOVE);
  Files.deleteIfExists(fichier);
  Files.exists(fichier); Files.isDirectory(dossier); Files.size(fichier);
  ```

  - Contrairement à `File` (qui renvoyait `false` sans explication), `Files` lève des **exceptions** précises :
    `NoSuchFileException`, `FileAlreadyExistsException`, `DirectoryNotEmptyException`, `AccessDeniedException`.
  - `readString` et `readAllLines` chargent **tout** : réservés aux petits fichiers. Pour les gros, `Files.lines` ou
    `newBufferedReader`.
  - `resolve` ajoute un chemin relatif, `relativize` calcule le chemin de l'un à l'autre, `normalize` retire les `.` et
    `..`, `toAbsolutePath` donne le chemin absolu.
  - Pour une **écriture sûre** : écrire dans un fichier temporaire du même dossier, puis `Files.move` avec
    `ATOMIC_MOVE` : un lecteur ne voit jamais un fichier à moitié écrit.
  - `Path.of` (Java 11) remplace `Paths.get`. Le passage `file.toPath()` / `path.toFile()` permet de mêler les deux API.

  **Piège classique** : construire un chemin à partir d'une entrée utilisateur (`dossier.resolve(nomFourni)`) sans
  vérifier le résultat. Un `../../etc/passwd` sort du dossier prévu (*path traversal*) : on normalise puis on vérifie
  `startsWith(dossier)`.

  **En entretien** : « `Path` pour le chemin, `Files` pour les opérations, avec des exceptions explicites ; `lines` pour
  les gros fichiers, et un fichier temporaire plus `ATOMIC_MOVE` pour écrire de façon sûre. »
cards:
  - key: file-vs-path-files
    format: course
    question: File vs Path/Files ?
    answer: File est l'ancienne API (erreurs silencieuses, peu de fonctions) ; Path/Files (NIO.2) est plus riche et lève des exceptions explicites.
  - key: readalllines-vs-lines
    format: course
    question: readAllLines vs lines ?
    answer: Tout en mémoire vs flux paresseux à fermer.
  - key: ecrire-fichier-facon-atomique
    format: course
    question: Comment écrire un fichier de façon atomique ?
    answer: Écrire dans un fichier temporaire puis Files.move avec ATOMIC_MOVE.
  - key: path-traversal
    format: course
    question: Comment empêcher un nom de fichier fourni par l'utilisateur de sortir du dossier prévu ?
    answer: Résoudre puis normaliser le chemin (`dossier.resolve(nom).normalize()`) et vérifier qu'il commence toujours par le dossier (`startsWith(dossier)`) ; sinon le refuser.
  - key: vf-path-existe
    format: true-false
    question: Créer un `Path` crée le fichier sur le disque.
    truth: false
    answer: Un `Path` n'est qu'un chemin ; `Files.createFile` crée le fichier.
  - key: vf-exceptions
    format: true-false
    question: "`Files.delete` lève une `NoSuchFileException` si le fichier n'existe pas."
    truth: true
    answer: '`deleteIfExists` ne lève rien et renvoie `false`.'
  - key: vf-lines-fermer
    format: true-false
    question: Le `Stream` renvoyé par `Files.lines` doit être fermé.
    truth: true
    answer: Il garde le fichier ouvert ; on l'utilise dans un try-with-resources.
  - key: vf-create-directories
    format: true-false
    question: "`Files.createDirectories` crée aussi les dossiers parents manquants."
    truth: true
    answer: Et ne lève rien si le dossier existe déjà.
  - key: qcm-gros
    format: multiple-choice
    question: Comment compter les lignes d'un fichier de 50 Go ?
    choices:
      - text: "`try (var s = Files.lines(p)) { n = s.count(); }`"
        correct: true
      - text: "Une boucle `readLine()` sur `Files.newBufferedReader(p)`"
        correct: true
      - text: "`Files.readAllLines(p).size()`"
        correct: false
      - text: "`Files.readString(p).lines().count()`"
        correct: false
    answer: Les deux dernières chargent tout en mémoire.
  - key: qcm-chemins
    format: multiple-choice
    question: "Que vaut `Path.of(\"/data\").resolve(\"a/../b.txt\").normalize()` ?"
    choices:
      - text: "`/data/b.txt`"
        correct: true
      - text: "`/data/a/../b.txt`"
        correct: false
      - text: "`/b.txt`"
        correct: false
      - text: "`/data/a/b.txt`"
        correct: false
    answer: '`normalize` résout le `..`.'
  - key: qcm-copie
    format: multiple-choice
    question: "Que fait `Files.copy(source, cible)` si `cible` existe déjà ?"
    choices:
      - text: "Il lève `FileAlreadyExistsException`"
        correct: true
      - text: "Il écrase la cible"
        correct: false
      - text: "Il ajoute à la fin de la cible"
        correct: false
      - text: "Il ne fait rien"
        correct: false
    answer: '`StandardCopyOption.REPLACE_EXISTING` autorise l''écrasement.'
  - key: qcm-atomique
    format: multiple-choice
    question: Comment publier un fichier de configuration pour qu'un lecteur ne voie jamais un fichier à moitié écrit ?
    choices:
      - text: "Écrire dans un temporaire du même dossier, puis `Files.move(temp, cible, ATOMIC_MOVE)`"
        correct: true
      - text: "Écrire directement dans la cible avec `writeString`"
        correct: false
      - text: "Écrire par petits morceaux avec `flush`"
        correct: false
      - text: "Copier la cible avant d'écrire"
        correct: false
    answer: Le déplacement atomique remplace le fichier d'un coup.
  - key: trous-of
    format: fill-in
    question: |-
      Complétez pour construire un chemin :
      ```java
      Path p = Path.___("exports", "factures.csv");
      ```
    blanks: [[of]]
    answer: '`Path.of` (Java 11) remplace `Paths.get`.'
  - key: trous-resolve
    format: fill-in
    question: |-
      Complétez pour ajouter un nom de fichier au dossier :
      ```java
      Path fichier = dossier.___("rapport.pdf");
      ```
    blanks: [[resolve]]
    answer: '`resolve` ajoute un chemin relatif.'
  - key: trous-write
    format: fill-in
    question: |-
      Complétez pour écrire une chaîne dans un fichier :
      ```java
      Files.___(chemin, contenu);
      ```
    blanks: [[writeString]]
    answer: En UTF-8 par défaut.
  - key: trous-move
    format: fill-in
    question: |-
      Complétez le remplacement atomique :
      ```java
      Files.move(temporaire, cible, StandardCopyOption.___);
      ```
    blanks: [[ATOMIC_MOVE]]
    answer: Le fichier est remplacé d'un coup.
  - key: code-chemins
    format: code-output
    question: |-
      ```java
      Path p = Path.of("data", "2026", "ventes.csv");
      System.out.println(p.getFileName() + " " + p.getParent().getFileName() + " " + p.getNameCount());
      ```
    answer: '`ventes.csv 2026 3`.'
    check:
      output: "ventes.csv 2026 3"
  - key: code-normalize
    format: code-output
    question: |-
      ```java
      Path base = Path.of("uploads");
      Path p = base.resolve("../secret.txt").normalize();
      System.out.println(p + " " + p.startsWith(base));
      ```
    answer: '`secret.txt false` : le chemin sort du dossier prévu.'
    check:
      output: "secret.txt false"
  - key: code-ecrire-lire
    format: code-output
    question: |-
      ```java
      Path f = Files.createTempFile("demo", ".txt");
      Files.writeString(f, "a\nb\nc");
      System.out.println(Files.readAllLines(f).size() + " " + Files.size(f));
      Files.delete(f);
      System.out.println(Files.exists(f));
      ```
    answer: '`3 5`, puis `false`.'
    check:
      output: "3 5\nfalse"
  - key: code-introuvable
    format: code-output
    question: |-
      ```java
      Path absent = Path.of("n-existe-pas-" + System.nanoTime() + ".txt");
      System.out.println(Files.deleteIfExists(absent));
      Files.readString(absent);
      ```
    answer: '`false`, puis une `NoSuchFileException`.'
    check:
      output: "false"
      throws: NoSuchFileException
  - key: bug-file-delete
    format: bug-fix
    question: |-
      La suppression échoue parfois, sans qu'on sache pourquoi :
      ```java
      if (!new File(chemin).delete()) {
          log.warn("suppression impossible");
      }
      ```
    answer: |-
      ```java
      try {
          Files.delete(Path.of(chemin));
      } catch (IOException e) {
          log.warn("suppression de {} impossible", chemin, e);
      }
      ```
      `File.delete` renvoie seulement `false`. `Files.delete` lève une exception qui dit la cause (fichier absent, dossier
      non vide, accès refusé).
  - key: bug-traversal
    format: bug-fix
    question: |-
      Ce téléchargement de pièce jointe permet de lire n'importe quel fichier du serveur :
      ```java
      Path fichier = DOSSIER_PIECES.resolve(nomDemande);
      return Files.readAllBytes(fichier);
      ```
    answer: |-
      ```java
      Path fichier = DOSSIER_PIECES.resolve(nomDemande).normalize();
      if (!fichier.startsWith(DOSSIER_PIECES)) {
          throw new AccesRefuseException(nomDemande);
      }
      return Files.readAllBytes(fichier);
      ```
      Un nom comme `../../etc/passwd` sortait du dossier. On normalise, puis on vérifie que le chemin reste dedans (avec
      un `DOSSIER_PIECES` absolu et normalisé).
  - key: bug-lines-ouvert
    format: bug-fix
    question: |-
      Après des milliers d'appels, « Too many open files » :
      ```java
      long n = Files.lines(fichier).filter(l -> l.startsWith("ERR")).count();
      ```
    answer: |-
      ```java
      long n;
      try (Stream<String> lignes = Files.lines(fichier)) {
          n = lignes.filter(l -> l.startsWith("ERR")).count();
      }
      ```
      Le stream de `Files.lines` garde le fichier ouvert tant qu'il n'est pas fermé.
  - key: bug-ecriture-directe
    format: bug-fix
    question: |-
      Un autre processus lit parfois un fichier de prix vide ou incomplet :
      ```java
      Files.writeString(PRIX, nouveauContenu);
      ```
    answer: |-
      ```java
      Path temporaire = Files.createTempFile(PRIX.getParent(), "prix", ".tmp");
      Files.writeString(temporaire, nouveauContenu);
      Files.move(temporaire, PRIX, StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING);
      ```
      L'écriture directe expose le fichier pendant qu'il est tronqué puis rempli. Un fichier temporaire du même dossier,
      déplacé atomiquement, remplace l'ancien d'un coup.
  - key: dois-traiter-fichier-millions-lignes-sans
    format: scenario
    question: Tu dois traiter un fichier de millions de lignes sans saturer la mémoire.
    answer: |-
      Le principe est de ne jamais tout charger. Je lirais en **streaming**, ligne par ligne, avec `Files.lines()` qui retourne un Stream paresseux, en traitant et en écrivant au fil de l'eau.
      Pour les agrégations, j'utiliserais des structures dont la taille ne croît pas avec le volume : des compteurs, ou une map de clés distinctes si leur nombre est borné.
      Et systématiquement du try-with-resources pour garantir la fermeture du flux, sur des millions de lignes, une fuite de descripteur se paie vite.
  - key: dois-importer-chaque-nuit-fichier-csv
    format: scenario
    question: Tu dois importer chaque nuit un fichier CSV de 10 Go en base.
    answer: |-
      Jamais de chargement complet : lecture en **flux** avec un `BufferedReader` ou un parseur CSV en streaming, traitement **par lots** (par exemple 1 000 lignes), et insertion en **batch JDBC** dans une transaction par lot. Ainsi la mémoire reste constante et une erreur ne fait pas tout rejouer.
      J'ajouterais une stratégie de reprise : enregistrer le dernier lot réussi pour redémarrer au bon endroit, et isoler les lignes invalides dans un fichier de rejet plutôt que d'interrompre tout l'import. Spring Batch fournit exactement ce modèle (reader, processor, writer par chunks, avec reprise).
      Côté base, désactiver temporairement certains index ou utiliser l'import natif (`COPY` en PostgreSQL) peut diviser le temps de plusieurs fois.
  - key: scenario-depot
    format: scenario
    question: Un partenaire dépose des fichiers dans un dossier partagé ; ton service doit les traiter une seule fois chacun. Comment éviter de lire un fichier en cours d'écriture ?
    answer: |-
      Je convenais d'un protocole avec le partenaire : il écrit sous un nom temporaire (`.part`) puis renomme le fichier
      une fois complet, ou il dépose un fichier témoin (`.ok`) après le fichier de données. Mon service ne traite que les
      fichiers finaux, les déplace d'abord (`Files.move` atomique) dans un dossier « en cours » pour qu'une autre instance
      ne les prenne pas, puis dans « traités » ou « rejetés ». La détection peut se faire par un parcours périodique ou un
      `WatchService`. Une somme de contrôle fournie par le partenaire permet de vérifier l'intégrité.
  - key: scenario-dossier-utilisateur
    format: scenario
    question: Ton API permet aux utilisateurs de télécharger leurs propres documents stockés sur le disque. Quelles précautions prends-tu ?
    answer: |-
      Je ne construis jamais le chemin directement à partir d'un nom fourni : j'utilise un identifiant interne, et le
      chemin réel (rangé par propriétaire) est connu en base. Si un nom doit servir, je le valide (liste blanche de
      caractères), je résous et normalise le chemin, et je vérifie `startsWith(dossierDeLUtilisateur)`. Je contrôle que
      le document appartient bien à l'utilisateur authentifié, je fixe le `Content-Type` et le
      `Content-Disposition: attachment`, et je lis en flux (`Files.newInputStream`) pour les gros fichiers.
