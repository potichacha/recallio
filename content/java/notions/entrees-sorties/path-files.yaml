notion: path-files
lesson: |-
  Depuis Java 7, **NIO.2** remplace l'ancienne classe `File` par deux outils :
  - **`Path`** : un chemin (pas forcément existant) ;
  - **`Files`** : des méthodes statiques pour tout faire sur les fichiers.

  ```java
  Path dossier = Path.of("donnees", "2026");          // donnees/2026, avec le bon séparateur
  Path fichier = dossier.resolve("ventes.csv");       // donnees/2026/ventes.csv
  fichier.getFileName();                              // ventes.csv
  fichier.getParent();                                // donnees/2026

  Files.createDirectories(dossier);                   // crée aussi les parents
  Files.writeString(fichier, "id;montant\n");         // écrit (UTF-8)
  String texte = Files.readString(fichier);           // lit tout (petits fichiers)
  List<String> lignes = Files.readAllLines(fichier);  // tout en mémoire
  try (Stream<String> s = Files.lines(fichier)) { }   // à la demande, à fermer
  Files.copy(fichier, sauvegarde, StandardCopyOption.REPLACE_EXISTING);
  Files.move(temp, fichier, StandardCopyOption.ATOMIC_MOVE);
  Files.deleteIfExists(fichier);
  Files.exists(fichier); Files.isDirectory(dossier); Files.size(fichier);
  ```

  - Contrairement à `File` (qui renvoyait `false` sans explication), `Files` lève des **exceptions** précises :
    `NoSuchFileException`, `FileAlreadyExistsException`, `DirectoryNotEmptyException`, `AccessDeniedException`.
  - `readString` et `readAllLines` chargent **tout** : réservés aux petits fichiers. Pour les gros, `Files.lines` ou
    `newBufferedReader`.
  - `resolve` ajoute un chemin relatif, `relativize` calcule le chemin de l'un à l'autre, `normalize` retire les `.` et
    `..`, `toAbsolutePath` donne le chemin absolu.
  - Pour une **écriture sûre** : écrire dans un fichier temporaire du même dossier, puis `Files.move` avec
    `ATOMIC_MOVE` : un lecteur ne voit jamais un fichier à moitié écrit.
  - `Path.of` (Java 11) remplace `Paths.get`. Le passage `file.toPath()` / `path.toFile()` permet de mêler les deux API.

  **Piège classique** : construire un chemin à partir d'une entrée utilisateur (`dossier.resolve(nomFourni)`) sans
  vérifier le résultat. Un `../../etc/passwd` sort du dossier prévu (*path traversal*) : on normalise puis on vérifie
  `startsWith(dossier)`.

  **En entretien** : « `Path` pour le chemin, `Files` pour les opérations, avec des exceptions explicites ; `lines` pour
  les gros fichiers, et un fichier temporaire plus `ATOMIC_MOVE` pour écrire de façon sûre. »
tour:
  - title: Path et Files
    text: |-
      `Path` désigne un chemin de fichier, et `Files` réunit les opérations : `writeString` et `readString` pour un
      petit fichier texte, `readAllLines` et `lines` pour les lignes, `copy`, `move`, `delete`, `exists`… Tout passe en
      UTF-8 par défaut.

      Pour un gros fichier, `Files.newBufferedReader` lit en flux, dans un try-with-resources. Ce programme travaille
      dans un fichier temporaire, qu'il supprime à la fin.
    example:
      files:
        Main.java: |-
          void main() throws IOException {
              Path fichier = Files.createTempFile("notes", ".txt");
              try {
                  Files.writeString(fichier, "12\n15\n18\n");
                  List<String> lignes = Files.readAllLines(fichier);
                  int somme = 0;
                  for (String ligne : lignes) {
                      somme += Integer.parseInt(ligne);
                  }
                  IO.println(lignes.size() + " lignes, somme " + somme);
                  IO.println(Files.exists(fichier) + " " + fichier.getFileName().toString().endsWith(".txt"));
              } finally {
                  Files.delete(fichier);
              }
              IO.println(Files.exists(fichier));
          }
      output: |-
        3 lignes, somme 45
        true true
        false
cards:
  - key: file-vs-path-files
    format: course
    question: "Quelle différence entre `java.io.File` et `Path`/`Files` ?"
    choices:
      - {text: "`File` est l'ancienne API, aux erreurs silencieuses ; `Path`/`Files` lève des exceptions explicites", correct: true}
      - {text: "`File` est la nouvelle API de Java 11, qui remplace `Path`/`Files`, désormais dépréciés", correct: false}
      - {text: "`File` sert aux fichiers et `Path`/`Files` aux seuls dossiers, d'où deux API distinctes", correct: false}
      - {text: "`File` lit le contenu des fichiers ; `Path`/`Files` ne manipule que les noms et les chemins", correct: false}
    answer: |-
      `File` est l'ancienne API (erreurs silencieuses, comme un `delete()` qui renvoie `false`, peu de fonctions) ;
      `Path`/`Files` (NIO.2, Java 7) est plus riche et lève des exceptions explicites.
  - key: readalllines-vs-lines
    format: course
    question: "Quelle différence entre `Files.readAllLines` et `Files.lines` ?"
    choices:
      - {text: "`readAllLines` charge tout en mémoire, `lines` est un flux paresseux à fermer", correct: true}
      - {text: "`lines` charge tout en mémoire, `readAllLines` est un flux paresseux à fermer", correct: false}
      - {text: "`readAllLines` garde les séparateurs de ligne, `lines` les retire", correct: false}
      - {text: "Aucune : `lines` est un simple alias de `readAllLines`", correct: false}
    answer: |-
      `readAllLines` renvoie une `List<String>` : tout le fichier en mémoire. `lines` renvoie un `Stream<String>` paresseux,
      qui garde le fichier ouvert jusqu'à sa fermeture.
  - key: ecrire-fichier-facon-atomique
    format: course
    question: Comment écrire un fichier de façon atomique ?
    choices:
      - {text: "Écrire dans un fichier temporaire, puis le déplacer avec `Files.move` et `ATOMIC_MOVE`", correct: true}
      - {text: "Écrire directement dans le fichier avec `Files.writeString`, une écriture étant atomique", correct: false}
      - {text: "Écrire avec l'option `StandardOpenOption.SYNC`, qui rend toute l'écriture atomique", correct: false}
      - {text: "Écrire dans un bloc `synchronized`, pour qu'aucun thread n'interrompe l'écriture", correct: false}
    answer: |-
      Écrire dans un fichier temporaire du même dossier, puis `Files.move` avec `ATOMIC_MOVE` : le fichier est remplacé
      d'un coup. `SYNC` force l'écriture sur le disque, mais un lecteur peut toujours voir un fichier à moitié écrit.
  - key: path-traversal
    format: course
    question: Comment empêcher un nom de fichier fourni par l'utilisateur de sortir du dossier prévu ?
    choices:
      - {text: "Normaliser `dossier.resolve(nom)`, puis vérifier qu'il commence par le dossier", correct: true}
      - {text: "Refuser les noms qui contiennent `../`, avec un simple `contains`", correct: false}
      - {text: "Encoder le nom avec `URLEncoder.encode` avant de le résoudre", correct: false}
      - {text: "Vérifier avec `Files.exists` que le fichier existe avant de le lire", correct: false}
    answer: |-
      Résoudre puis normaliser le chemin (`dossier.resolve(nom).normalize()`) et vérifier qu'il commence toujours par le
      dossier (`startsWith(dossier)`) ; sinon le refuser. Chercher `../` à la main laisse passer un chemin absolu, que
      `resolve` accepte tel quel.
  - key: vf-path-existe
    format: true-false
    question: Créer un `Path` crée le fichier sur le disque.
    truth: false
    answer: Un `Path` n'est qu'un chemin ; `Files.createFile` crée le fichier.
  - key: vf-exceptions
    format: true-false
    question: "`Files.delete` lève une `NoSuchFileException` si le fichier n'existe pas."
    truth: true
    answer: '`deleteIfExists` ne lève rien et renvoie `false`.'
  - key: vf-lines-fermer
    format: true-false
    question: Le `Stream` renvoyé par `Files.lines` doit être fermé.
    truth: true
    answer: Il garde le fichier ouvert ; on l'utilise dans un try-with-resources.
  - key: vf-create-directories
    format: true-false
    question: "`Files.createDirectories` crée aussi les dossiers parents manquants."
    truth: true
    answer: Et ne lève rien si le dossier existe déjà.
  - key: qcm-gros
    format: multiple-choice
    question: "Lequel compte les lignes d'un fichier de 50 Go sans le charger en mémoire ?"
    choices:
      - {text: "`try (var s = Files.lines(p)) { n = s.count(); }`", correct: true}
      - {text: "`Files.readAllLines(p).size()`", correct: false}
      - {text: "`Files.readString(p).lines().count()`", correct: false}
      - {text: "`new String(Files.readAllBytes(p)).lines().count()`", correct: false}
    answer: |-
      `Files.lines` lit à la demande (une boucle `readLine()` sur un `BufferedReader` aussi). Les trois autres chargent tout
      le fichier en mémoire avant de compter.
  - key: qcm-chemins
    format: multiple-choice
    question: "Que vaut `Path.of(\"/data\").resolve(\"a/../b.txt\").normalize()` ?"
    choices:
      - text: "`/data/b.txt`"
        correct: true
      - text: "`/data/a/../b.txt`"
        correct: false
      - text: "`/b.txt`"
        correct: false
      - text: "`/data/a/b.txt`"
        correct: false
    answer: '`normalize` résout le `..`.'
  - key: qcm-copie
    format: multiple-choice
    question: "Que fait `Files.copy(source, cible)` si `cible` existe déjà ?"
    choices:
      - text: "Il lève `FileAlreadyExistsException`"
        correct: true
      - text: "Il écrase la cible"
        correct: false
      - text: "Il ajoute à la fin de la cible"
        correct: false
      - text: "Il ne fait rien"
        correct: false
    answer: '`StandardCopyOption.REPLACE_EXISTING` autorise l''écrasement.'
  - key: qcm-atomique
    format: multiple-choice
    question: Comment publier un fichier de configuration pour qu'un lecteur ne voie jamais un fichier à moitié écrit ?
    choices:
      - {text: "Écrire dans un temporaire du même dossier, puis `Files.move(temp, cible, ATOMIC_MOVE)`", correct: true}
      - {text: "Écrire directement dans la cible avec `writeString`, une écriture étant atomique", correct: false}
      - {text: "Écrire dans la cible par petits morceaux, avec un `flush` après chacun d'eux", correct: false}
      - {text: "Copier la cible en sauvegarde, puis écrire directement dans la cible", correct: false}
    answer: |-
      Le déplacement atomique remplace le fichier d'un coup : un lecteur voit l'ancien ou le nouveau, jamais un fichier
      tronqué. Le temporaire doit être dans le même dossier (le même système de fichiers) pour que le déplacement soit
      atomique.
  - key: trous-of
    format: fill-in
    question: |-
      Complète pour construire un chemin :
      ```java
      Path p = Path.___("exports", "factures.csv");
      ```
    blanks: [[of]]
    answer: '`Path.of` (Java 11) remplace `Paths.get`.'
  - key: trous-resolve
    format: fill-in
    question: |-
      Complète pour ajouter un nom de fichier au dossier :
      ```java
      Path fichier = dossier.___("rapport.pdf");
      ```
    blanks: [[resolve]]
    answer: '`resolve` ajoute un chemin relatif.'
  - key: trous-write
    format: fill-in
    question: |-
      Complète pour écrire une chaîne dans un fichier :
      ```java
      Files.___(chemin, contenu);
      ```
    blanks: [[writeString]]
    answer: En UTF-8 par défaut.
  - key: trous-move
    format: fill-in
    question: |-
      Complète le remplacement atomique :
      ```java
      Files.move(temporaire, cible, StandardCopyOption.___);
      ```
    blanks: [[ATOMIC_MOVE]]
    answer: Le fichier est remplacé d'un coup.
  - key: code-chemins
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Path p = Path.of("data", "2026", "ventes.csv");
      System.out.println(p.getFileName() + " " + p.getParent().getFileName() + " " + p.getNameCount());
      ```
    choices:
      - {text: "`ventes.csv 2026 3`", correct: true}
      - {text: "`ventes.csv data 3`", correct: false}
      - {text: "`ventes.csv 2026 2`", correct: false}
      - {text: "`ventes 2026 3`", correct: false}
    answer: '`ventes.csv 2026 3`.'
    check:
      output: "ventes.csv 2026 3"
  - key: code-normalize
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Path base = Path.of("uploads");
      Path p = base.resolve("../secret.txt").normalize();
      System.out.println(p + " " + p.startsWith(base));
      ```
    choices:
      - {text: "`secret.txt false`", correct: true}
      - {text: "`uploads/secret.txt true`", correct: false}
      - {text: "`../secret.txt false`", correct: false}
      - {text: "`secret.txt true`", correct: false}
    answer: '`secret.txt false` : le chemin sort du dossier prévu.'
    check:
      output: "secret.txt false"
  - key: code-ecrire-lire
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Path f = Files.createTempFile("demo", ".txt");
      Files.writeString(f, "a\nb\nc");
      System.out.println(Files.readAllLines(f).size() + " " + Files.size(f));
      Files.delete(f);
      System.out.println(Files.exists(f));
      ```
    choices:
      - text: |-
          ```
          3 5
          false
          ```
        correct: true
      - text: |-
          ```
          3 3
          false
          ```
        correct: false
      - text: |-
          ```
          2 5
          false
          ```
        correct: false
      - text: |-
          ```
          3 5
          true
          ```
        correct: false
    answer: '`3 5`, puis `false`.'
    check:
      output: "3 5\nfalse"
  - key: code-introuvable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Path absent = Path.of("n-existe-pas-" + System.nanoTime() + ".txt");
      System.out.println(Files.deleteIfExists(absent));
      Files.readString(absent);
      ```
    choices:
      - {text: "`false`, puis une `NoSuchFileException`", correct: true}
      - {text: "`true`, puis une `NoSuchFileException`", correct: false}
      - {text: "Une `NoSuchFileException` dès `deleteIfExists`", correct: false}
      - {text: "`false`, puis rien : `readString` renvoie une chaîne vide", correct: false}
    answer: '`false`, puis une `NoSuchFileException`.'
    check:
      output: "false"
      throws: NoSuchFileException
  - key: bug-file-delete
    format: bug-fix
    question: |-
      La suppression échoue parfois, sans qu'on sache pourquoi. Quelle correction est la bonne ?
      ```java
      if (!new File(chemin).delete()) {
          log.warn("suppression impossible");
      }
      ```
    choices:
      - {text: "Utiliser `Files.delete`, dont l'exception dit la cause de l'échec", correct: true}
      - {text: "Réessayer `new File(chemin).delete()` trois fois avant d'abandonner", correct: false}
      - {text: "Appeler `deleteOnExit()` quand `delete()` renvoie `false`", correct: false}
      - {text: "Tester `new File(chemin).exists()` juste avant `delete()`", correct: false}
    answer: |-
      ```java
      try {
          Files.delete(Path.of(chemin));
      } catch (IOException e) {
          log.warn("suppression de {} impossible", chemin, e);
      }
      ```
      `File.delete` renvoie seulement `false`. `Files.delete` lève une exception qui dit la cause (fichier absent, dossier
      non vide, accès refusé).
  - key: bug-traversal
    format: bug-fix
    question: |-
      Ce téléchargement de pièce jointe permet de lire n'importe quel fichier du serveur. Quelle correction est la bonne ?
      ```java
      Path fichier = DOSSIER_PIECES.resolve(nomDemande);
      return Files.readAllBytes(fichier);
      ```
    choices:
      - {text: "Normaliser le chemin résolu, puis vérifier qu'il reste dans `DOSSIER_PIECES`", correct: true}
      - {text: "Retirer les `../` du nom avec `replace(\"../\", \"\")`, puis le résoudre", correct: false}
      - {text: "Vérifier avec `Files.exists` que le fichier demandé existe bien", correct: false}
      - {text: "Lire avec `Files.newInputStream` plutôt qu'avec `readAllBytes`", correct: false}
    answer: |-
      ```java
      Path fichier = DOSSIER_PIECES.resolve(nomDemande).normalize();
      if (!fichier.startsWith(DOSSIER_PIECES)) {
          throw new AccesRefuseException(nomDemande);
      }
      return Files.readAllBytes(fichier);
      ```
      Un nom comme `../../etc/passwd` sortait du dossier. On normalise, puis on vérifie que le chemin reste dedans (avec
      un `DOSSIER_PIECES` absolu et normalisé).
  - key: bug-lines-ouvert
    format: bug-fix
    question: |-
      Après des milliers d'appels, l'application échoue avec « Too many open files ». Quelle correction est la bonne ?
      ```java
      long n = Files.lines(fichier).filter(l -> l.startsWith("ERR")).count();
      ```
    choices:
      - {text: "Fermer le stream de `Files.lines` avec un try-with-resources", correct: true}
      - {text: "Remplacer `count()` par `collect(Collectors.counting())`", correct: false}
      - {text: "Ajouter `.parallel()`, pour libérer le fichier plus vite", correct: false}
      - {text: "Appeler `System.gc()` toutes les mille lectures du fichier", correct: false}
    answer: |-
      ```java
      long n;
      try (Stream<String> lignes = Files.lines(fichier)) {
          n = lignes.filter(l -> l.startsWith("ERR")).count();
      }
      ```
      Le stream de `Files.lines` garde le fichier ouvert tant qu'il n'est pas fermé.
  - key: bug-ecriture-directe
    format: bug-fix
    question: |-
      Un autre processus lit parfois un fichier de prix vide ou incomplet. Quelle correction est la bonne ?
      ```java
      Files.writeString(PRIX, nouveauContenu);
      ```
    choices:
      - {text: "Écrire dans un temporaire du même dossier, puis le déplacer avec `ATOMIC_MOVE`", correct: true}
      - {text: "Écrire dans un temporaire de `/tmp`, puis le recopier sur la cible avec `Files.copy`", correct: false}
      - {text: "Ajouter l'option `StandardOpenOption.SYNC` à l'appel de `Files.writeString`", correct: false}
      - {text: "Écrire le fichier dans un bloc `synchronized` de l'application", correct: false}
    answer: |-
      ```java
      Path temporaire = Files.createTempFile(PRIX.getParent(), "prix", ".tmp");
      Files.writeString(temporaire, nouveauContenu);
      Files.move(temporaire, PRIX, StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING);
      ```
      L'écriture directe expose le fichier pendant qu'il est tronqué puis rempli. Un fichier temporaire du même dossier,
      déplacé atomiquement, remplace l'ancien d'un coup.
  - key: dois-traiter-fichier-millions-lignes-sans
    format: scenario
    question: "Tu dois traiter un fichier de millions de lignes sans saturer la mémoire. Comment t'y prends-tu ?"
    choices:
      - {text: "Lire en flux avec `Files.lines`, traiter au fil de l'eau, dans un try-with-resources", correct: true}
      - {text: "Lire avec `Files.lines`, mais collecter toutes les lignes dans une liste avant de traiter", correct: false}
      - {text: "Charger le fichier avec `readAllLines`, puis libérer la liste dès le traitement fini", correct: false}
      - {text: "Lire le fichier avec `readString`, et régler `-Xmx` à la taille du fichier", correct: false}
    answer: |-
      Le principe est de ne jamais tout charger. Je lirais en **streaming**, ligne par ligne, avec `Files.lines()` qui retourne un Stream paresseux, en traitant et en écrivant au fil de l'eau.
      Pour les agrégations, j'utiliserais des structures dont la taille ne croît pas avec le volume : des compteurs, ou une map de clés distinctes si leur nombre est borné.
      Et systématiquement du try-with-resources pour garantir la fermeture du flux, sur des millions de lignes, une fuite de descripteur se paie vite.
  - key: dois-importer-chaque-nuit-fichier-csv
    format: scenario
    question: "Tu dois importer chaque nuit un fichier CSV de 10 Go en base. Comment t'y prends-tu ?"
    choices:
      - {text: "Lire en flux, insérer par lots en batch JDBC, une transaction par lot, avec une reprise", correct: true}
      - {text: "Charger tout le CSV en mémoire, puis l'insérer en une seule transaction, pour tout ou rien", correct: false}
      - {text: "Lire en flux, puis insérer ligne par ligne, avec une transaction et un commit par ligne", correct: false}
      - {text: "Lire en flux, tout insérer dans une transaction géante, rejouée en entier en cas d'erreur", correct: false}
    answer: |-
      Jamais de chargement complet : lecture en **flux** avec un `BufferedReader` ou un parseur CSV en streaming, traitement **par lots** (par exemple 1 000 lignes), et insertion en **batch JDBC** dans une transaction par lot. Ainsi la mémoire reste constante et une erreur ne fait pas tout rejouer.
      J'ajouterais une stratégie de reprise : enregistrer le dernier lot réussi pour redémarrer au bon endroit, et isoler les lignes invalides dans un fichier de rejet plutôt que d'interrompre tout l'import. Spring Batch fournit exactement ce modèle (reader, processor, writer par chunks, avec reprise).
      Côté base, désactiver temporairement certains index ou utiliser l'import natif (`COPY` en PostgreSQL) peut diviser le temps de plusieurs fois.
  - key: scenario-depot
    format: scenario
    question: Un partenaire dépose des fichiers dans un dossier partagé ; ton service doit les traiter une seule fois chacun. Comment éviter de lire un fichier en cours d'écriture ?
    choices:
      - {text: "Convenir d'un renommage en fin d'écriture, puis déplacer chaque fichier atomiquement avant de le traiter", correct: true}
      - {text: "Attendre dix secondes après la création de chaque fichier, puis le traiter là où il a été déposé", correct: false}
      - {text: "Traiter chaque fichier dès son événement `ENTRY_CREATE`, puis le supprimer du dossier partagé", correct: false}
      - {text: "Comparer la taille de chaque fichier à deux instants, et le traiter dès qu'elle ne change plus", correct: false}
    answer: |-
      Je conviens d'un protocole avec le partenaire : il écrit sous un nom temporaire (`.part`) puis renomme le fichier
      une fois complet, ou il dépose un fichier témoin (`.ok`) après le fichier de données. Mon service ne traite que les
      fichiers finaux, les déplace d'abord (`Files.move` atomique) dans un dossier « en cours » pour qu'une autre instance
      ne les prenne pas, puis dans « traités » ou « rejetés ». La détection peut se faire par un parcours périodique ou un
      `WatchService`. Une somme de contrôle fournie par le partenaire permet de vérifier l'intégrité.
  - key: scenario-dossier-utilisateur
    format: scenario
    question: Ton API permet aux utilisateurs de télécharger leurs propres documents stockés sur le disque. Quelles précautions prends-tu ?
    choices:
      - {text: "Un identifiant interne plutôt qu'un nom, l'appartenance vérifiée, et un chemin normalisé et borné", correct: true}
      - {text: "Le nom fourni par l'utilisateur, après en avoir retiré les `../` qu'il pourrait contenir", correct: false}
      - {text: "Le nom fourni par l'utilisateur, encodé avec `URLEncoder` pour neutraliser les caractères", correct: false}
      - {text: "Le chemin complet envoyé par le client, puisque l'utilisateur est déjà authentifié", correct: false}
    answer: |-
      Je ne construis jamais le chemin directement à partir d'un nom fourni : j'utilise un identifiant interne, et le
      chemin réel (rangé par propriétaire) est connu en base. Si un nom doit servir, je le valide (liste blanche de
      caractères), je résous et normalise le chemin, et je vérifie `startsWith(dossierDeLUtilisateur)`. Je contrôle que
      le document appartient bien à l'utilisateur authentifié, je fixe le `Content-Type` et le
      `Content-Disposition: attachment`, et je lis en flux (`Files.newInputStream`) pour les gros fichiers.
