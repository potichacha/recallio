notion: url-uri
lesson: |-
  - Un **URI** (*Uniform Resource Identifier*) identifie une ressource : `https://api.exemple.org/v1/commandes?page=2#haut`.
  - Une **URL** est un URI qui dit aussi comment **y accéder** (un protocole).

  En Java, on manipule **`java.net.URI`** : une valeur immuable, qui se contente d'analyser la syntaxe, sans accès
  réseau.

  ```java
  URI u = URI.create("https://api.exemple.org:8443/v1/commandes?page=2#haut");
  u.getScheme();     // https
  u.getHost();       // api.exemple.org
  u.getPort();       // 8443 (-1 si absent)
  u.getPath();       // /v1/commandes
  u.getQuery();      // page=2
  u.resolve("factures/7");   // https://api.exemple.org:8443/v1/factures/7

  String q = URLEncoder.encode("café & thé", StandardCharsets.UTF_8);   // caf%C3%A9+%26+th%C3%A9
  URLDecoder.decode(q, StandardCharsets.UTF_8);                         // café & thé
  ```

  - **Encoder les paramètres** : un `&`, un `=`, un espace ou un caractère non ASCII dans une valeur casse la requête (ou
    change son sens) s'il n'est pas encodé. `URLEncoder.encode(valeur, UTF_8)` encode **une valeur** de paramètre (au
    format des formulaires : l'espace devient `+`) ; jamais une URL entière.
  - **`java.net.URL`** est historique : son constructeur est déprécié (Java 20), et son `equals` résout les noms de domaine
    **par le réseau** (lent, et deux hôtes sur la même IP sont « égaux »). On utilise `URI`, puis `uri.toURL()` si une
    vieille API l'exige.
  - Pour construire des URL complexes, un builder (celui du framework, `UriBuilder` de Jakarta REST) gère l'encodage de
    chaque partie.
  - Une URL fournie par l'utilisateur et appelée par le serveur est un risque de **SSRF** : on valide le schéma et l'hôte
    (liste blanche), et l'on refuse les adresses internes.

  **Piège classique** : `"https://api/recherche?q=" + saisie`. Une saisie comme `a&admin=true` ajoute un paramètre, et un
  espace rend l'URI invalide.

  **En entretien** : « `URI` pour représenter et analyser, `URLEncoder.encode(valeur, UTF_8)` pour chaque valeur de
  paramètre, jamais de concaténation brute ; et `URL` est à éviter, son `equals` passe par le DNS. »
cards:
  - key: uri-url
    format: course
    question: Quelle différence entre un URI et une URL ?
    answer: Un URI identifie une ressource ; une URL est un URI qui précise aussi comment y accéder (un protocole, comme `https`).
  - key: encoder
    format: course
    question: Pourquoi encoder les valeurs de paramètres d'une URL ?
    answer: Parce que des caractères comme `&`, `=`, `?`, l'espace ou les accents ont un sens dans une URL ; non encodés, ils cassent la requête ou en changent le sens.
  - key: url-equals
    format: course
    question: Pourquoi éviter `java.net.URL` comme clé de map ?
    answer: Son `equals` et son `hashCode` résolvent les noms d'hôte par le DNS (lent, dépend du réseau) ; `URI` compare la syntaxe.
  - key: ssrf
    format: course
    question: Qu'est-ce qu'une faille SSRF ?
    answer: Faire appeler par le serveur une URL choisie par l'attaquant (souvent une adresse interne, comme un service de métadonnées) ; on la prévient en validant le schéma et l'hôte par liste blanche.
  - key: vf-uri-reseau
    format: true-false
    question: "`URI.create` vérifie que la ressource existe."
    truth: false
    answer: Il n'analyse que la syntaxe, sans accès réseau.
  - key: vf-encoder-url
    format: true-false
    question: "`URLEncoder.encode` s'applique à une URL complète."
    truth: false
    answer: Il encode une valeur de paramètre ; appliqué à toute l'URL, il encoderait aussi `:` et `/`.
  - key: vf-espace
    format: true-false
    question: "`URLEncoder.encode(\"a b\", UTF_8)` donne `a+b`."
    truth: true
    answer: C'est le format des formulaires (`%20` dans un chemin).
  - key: vf-port
    format: true-false
    question: "`URI.create(\"https://exemple.org/\").getPort()` vaut 443."
    truth: false
    answer: Il vaut -1, le port n'étant pas précisé.
  - key: qcm-parties
    format: multiple-choice
    question: "Pour `https://a.org:8080/v1/x?id=3#y`, quelles valeurs sont justes ?"
    choices:
      - text: "`getPath()` : `/v1/x`"
        correct: true
      - text: "`getQuery()` : `id=3`"
        correct: true
      - text: "`getHost()` : `a.org:8080`"
        correct: false
      - text: "`getFragment()` : `#y`"
        correct: false
    answer: L'hôte n'inclut pas le port, le fragment n'inclut pas le `#`.
  - key: qcm-construire
    format: multiple-choice
    question: Comment construire une URL de recherche à partir d'une saisie utilisateur ?
    choices:
      - text: "`base + \"?q=\" + URLEncoder.encode(saisie, StandardCharsets.UTF_8)`"
        correct: true
      - text: "Un builder d'URL qui encode chaque paramètre"
        correct: true
      - text: "`base + \"?q=\" + saisie`"
        correct: false
      - text: "`URLEncoder.encode(base + \"?q=\" + saisie, UTF_8)`"
        correct: false
    answer: On encode la valeur, pas toute l'URL.
  - key: qcm-url-deprecie
    format: multiple-choice
    question: Que préférer à `new URL(chaine)` ?
    choices:
      - text: "`URI.create(chaine)`, puis `toURL()` si nécessaire"
        correct: true
      - text: "`new URL(chaine)`, recommandé"
        correct: false
      - text: "`Path.of(chaine)`"
        correct: false
      - text: "`String` partout"
        correct: false
    answer: Les constructeurs de `URL` sont dépréciés depuis Java 20.
  - key: qcm-ssrf
    format: multiple-choice
    question: Un service télécharge une image depuis une URL fournie par l'utilisateur. Quelles protections ?
    choices:
      - text: "N'accepter que `https` et des hôtes d'une liste blanche"
        correct: true
      - text: "Refuser les adresses internes et de bouclage après résolution"
        correct: true
      - text: "Accepter tout pourvu que l'URL soit syntaxiquement valide"
        correct: false
      - text: "Suivre toutes les redirections"
        correct: false
    answer: Une redirection peut mener vers une adresse interne.
  - key: code-parties
    format: code-output
    question: |-
      ```java
      URI u = URI.create("https://api.exemple.org:8443/v1/commandes?page=2#haut");
      System.out.println(u.getScheme() + " " + u.getHost() + " " + u.getPort() + " " + u.getPath()
              + " " + u.getQuery() + " " + u.getFragment());
      ```
    answer: '`https api.exemple.org 8443 /v1/commandes page=2 haut`.'
    check:
      output: "https api.exemple.org 8443 /v1/commandes page=2 haut"
  - key: code-encoder
    format: code-output
    question: |-
      ```java
      import java.nio.charset.StandardCharsets;
      String e = URLEncoder.encode("café & thé=1", StandardCharsets.UTF_8);
      System.out.println(e + " " + URLDecoder.decode(e, StandardCharsets.UTF_8));
      ```
    answer: '`caf%C3%A9+%26+th%C3%A9%3D1 café & thé=1`.'
    check:
      output: "caf%C3%A9+%26+th%C3%A9%3D1 café & thé=1"
  - key: code-resolve
    format: code-output
    question: |-
      ```java
      URI base = URI.create("https://exemple.org/api/v1/");
      System.out.println(base.resolve("commandes/42") + " " + base.resolve("../v2/x") + " " + base.resolve("/racine"));
      ```
    answer: '`https://exemple.org/api/v1/commandes/42 https://exemple.org/api/v2/x https://exemple.org/racine`.'
    check:
      output: "https://exemple.org/api/v1/commandes/42 https://exemple.org/api/v2/x https://exemple.org/racine"
  - key: code-invalide
    format: code-output
    question: |-
      ```java
      URI.create("https://exemple.org/recherche?q=a b");
      ```
    answer: "Une `IllegalArgumentException` : l'espace n'est pas permis dans un URI."
    check:
      throws: IllegalArgumentException
