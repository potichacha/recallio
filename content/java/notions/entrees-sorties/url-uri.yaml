notion: url-uri
lesson: |-
  - Un **URI** (*Uniform Resource Identifier*) identifie une ressource : `https://api.exemple.org/v1/commandes?page=2#haut`.
  - Une **URL** est un URI qui dit aussi comment **y accéder** (un protocole).

  En Java, on manipule **`java.net.URI`** : une valeur immuable, qui se contente d'analyser la syntaxe, sans accès
  réseau.

  ```java
  URI u = URI.create("https://api.exemple.org:8443/v1/commandes?page=2#haut");
  u.getScheme();     // https
  u.getHost();       // api.exemple.org
  u.getPort();       // 8443 (-1 si absent)
  u.getPath();       // /v1/commandes
  u.getQuery();      // page=2
  u.resolve("factures/7");   // https://api.exemple.org:8443/v1/factures/7

  String q = URLEncoder.encode("café & thé", StandardCharsets.UTF_8);   // caf%C3%A9+%26+th%C3%A9
  URLDecoder.decode(q, StandardCharsets.UTF_8);                         // café & thé
  ```

  - **Encoder les paramètres** : un `&`, un `=`, un espace ou un caractère non ASCII dans une valeur casse la requête (ou
    change son sens) s'il n'est pas encodé. `URLEncoder.encode(valeur, UTF_8)` encode **une valeur** de paramètre (au
    format des formulaires : l'espace devient `+`) ; jamais une URL entière.
  - **`java.net.URL`** est historique : son constructeur est déprécié (Java 20), et son `equals` résout les noms de domaine
    **par le réseau** (lent, et deux hôtes sur la même IP sont « égaux »). On utilise `URI`, puis `uri.toURL()` si une
    vieille API l'exige.
  - Pour construire des URL complexes, un builder (celui du framework, `UriBuilder` de Jakarta REST) gère l'encodage de
    chaque partie.
  - Une URL fournie par l'utilisateur et appelée par le serveur est un risque de **SSRF** : on valide le schéma et l'hôte
    (liste blanche), et l'on refuse les adresses internes.

  **Piège classique** : `"https://api/recherche?q=" + saisie`. Une saisie comme `a&admin=true` ajoute un paramètre, et un
  espace rend l'URI invalide.

  **En entretien** : « `URI` pour représenter et analyser, `URLEncoder.encode(valeur, UTF_8)` pour chaque valeur de
  paramètre, jamais de concaténation brute ; et `URL` est à éviter, son `equals` passe par le DNS. »
cards:
  - key: uri-url
    format: course
    question: Quelle différence entre un URI et une URL ?
    choices:
      - {text: "Un URI identifie une ressource ; une URL précise en plus comment y accéder", correct: true}
      - {text: "Une URL identifie une ressource ; un URI précise en plus comment y accéder", correct: false}
      - {text: "Un URI est toujours relatif ; une URL est toujours absolue, avec son hôte", correct: false}
      - {text: "Aucune : ce sont deux noms de la même chose, selon les époques", correct: false}
    answer: |-
      Un URI identifie une ressource ; une URL est un URI qui précise aussi comment y accéder (un protocole, comme
      `https`). Toute URL est un URI, l'inverse est faux (`urn:isbn:...`).
  - key: encoder
    format: course
    question: Pourquoi encoder les valeurs de paramètres d'une URL ?
    choices:
      - {text: "Des caractères comme `&`, `=` ou l'espace ont un sens dans l'URL : non encodés, ils la cassent", correct: true}
      - {text: "Pour chiffrer les valeurs, afin qu'un intermédiaire ne puisse pas les lire en clair", correct: false}
      - {text: "Pour raccourcir l'URL, car les navigateurs refusent celles de plus de 255 caractères", correct: false}
      - {text: "Pour dire au serveur en quel charset décoder le corps de la requête qui suit", correct: false}
    answer: |-
      Parce que des caractères comme `&`, `=`, `?`, l'espace ou les accents ont un sens dans une URL ; non encodés, ils
      cassent la requête ou en changent le sens. L'encodage ne chiffre rien : il se décode trivialement.
  - key: url-equals
    format: course
    question: Pourquoi éviter `java.net.URL` comme clé de map ?
    choices:
      - {text: "Son `equals` et son `hashCode` résolvent l'hôte par le DNS : lents et dépendants du réseau", correct: true}
      - {text: "Il n'implémente pas `hashCode` : deux URL égales tombent dans des cases différentes", correct: false}
      - {text: "Il est mutable : changer son chemin après l'insertion le perd dans la map", correct: false}
      - {text: "Son `equals` compare les références : deux URL identiques restent différentes", correct: false}
    answer: |-
      Son `equals` et son `hashCode` résolvent les noms d'hôte par le DNS (lent, dépend du réseau) ; `URI` compare la
      syntaxe. `URL` est par ailleurs immuable.
  - key: ssrf
    format: course
    question: Qu'est-ce qu'une faille SSRF ?
    choices:
      - {text: "Faire appeler par le serveur une URL choisie par l'attaquant, souvent une adresse interne", correct: true}
      - {text: "Faire exécuter par le navigateur d'un autre utilisateur un script injecté dans la page", correct: false}
      - {text: "Faire envoyer par le navigateur de la victime une requête authentifiée, à son insu", correct: false}
      - {text: "Faire lire par le serveur un fichier hors du dossier prévu, avec un chemin en `../`", correct: false}
    answer: |-
      Faire appeler par le serveur une URL choisie par l'attaquant (souvent une adresse interne, comme un service de
      métadonnées) ; on la prévient en validant le schéma et l'hôte par liste blanche. Le script injecté, c'est le XSS ;
      la requête à l'insu de la victime, le CSRF.
  - key: vf-uri-reseau
    format: true-false
    question: "`URI.create` vérifie que la ressource existe."
    truth: false
    answer: Il n'analyse que la syntaxe, sans accès réseau.
  - key: vf-encoder-url
    format: true-false
    question: "`URLEncoder.encode` s'applique à une URL complète."
    truth: false
    answer: Il encode une valeur de paramètre ; appliqué à toute l'URL, il encoderait aussi `:` et `/`.
  - key: vf-espace
    format: true-false
    question: "`URLEncoder.encode(\"a b\", UTF_8)` donne `a+b`."
    truth: true
    answer: C'est le format des formulaires (`%20` dans un chemin).
  - key: vf-port
    format: true-false
    question: "`URI.create(\"https://exemple.org/\").getPort()` vaut 443."
    truth: false
    answer: Il vaut -1, le port n'étant pas précisé.
  - key: qcm-parties
    format: multiple-choice
    question: "Pour `https://a.org:8080/v1/x?id=3#y`, lesquelles de ces valeurs sont justes ?"
    choices:
      - text: "`getPath()` : `/v1/x`"
        correct: true
      - text: "`getQuery()` : `id=3`"
        correct: true
      - text: "`getHost()` : `a.org:8080`"
        correct: false
      - text: "`getFragment()` : `#y`"
        correct: false
    answer: L'hôte n'inclut pas le port, le fragment n'inclut pas le `#`.
  - key: qcm-construire
    format: multiple-choice
    question: Comment construire une URL de recherche à partir d'une saisie utilisateur ?
    choices:
      - {text: "`base + \"?q=\" + URLEncoder.encode(saisie, StandardCharsets.UTF_8)`", correct: true}
      - {text: "`base + \"?q=\" + saisie`", correct: false}
      - {text: "`URLEncoder.encode(base + \"?q=\" + saisie, UTF_8)`", correct: false}
      - {text: "`base + \"?q=\" + saisie.replace(\" \", \"%20\")`", correct: false}
    answer: |-
      On encode la valeur, pas toute l'URL (un builder d'URL qui encode chaque paramètre convient aussi). Encoder toute
      l'URL casse `://` et `?`, et remplacer les espaces laisse passer `&` et `=`.
  - key: qcm-url-deprecie
    format: multiple-choice
    question: Que préférer à `new URL(chaine)` ?
    choices:
      - {text: "`URI.create(chaine)`, puis `toURL()` si nécessaire", correct: true}
      - {text: "`new URL(chaine)`, toujours le constructeur recommandé", correct: false}
      - {text: "`Path.of(chaine)`, qui accepte aussi les adresses web", correct: false}
      - {text: "Une `String` partout, sans objet pour l'adresse", correct: false}
    answer: Les constructeurs de `URL` sont dépréciés depuis Java 20.
  - key: qcm-ssrf
    format: multiple-choice
    question: "Un service télécharge une image depuis une URL fournie par l'utilisateur. Lesquelles de ces protections faut-il ?"
    choices:
      - text: "N'accepter que `https` et des hôtes d'une liste blanche"
        correct: true
      - text: "Refuser les adresses internes et de bouclage après résolution"
        correct: true
      - text: "Accepter tout pourvu que l'URL soit syntaxiquement valide"
        correct: false
      - text: "Suivre toutes les redirections"
        correct: false
    answer: Une redirection peut mener vers une adresse interne.
  - key: code-parties
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      URI u = URI.create("https://api.exemple.org:8443/v1/commandes?page=2#haut");
      System.out.println(u.getScheme() + " " + u.getHost() + " " + u.getPort() + " " + u.getPath()
              + " " + u.getQuery() + " " + u.getFragment());
      ```
    choices:
      - {text: "`https api.exemple.org 8443 /v1/commandes page=2 haut`", correct: true}
      - {text: "`https api.exemple.org:8443 8443 /v1/commandes page=2 haut`", correct: false}
      - {text: "`https api.exemple.org 8443 /v1/commandes ?page=2 #haut`", correct: false}
      - {text: "`https api.exemple.org -1 /v1/commandes page=2 haut`", correct: false}
    answer: '`https api.exemple.org 8443 /v1/commandes page=2 haut`.'
    check:
      output: "https api.exemple.org 8443 /v1/commandes page=2 haut"
  - key: code-encoder
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      import java.nio.charset.StandardCharsets;
      String e = URLEncoder.encode("café & thé=1", StandardCharsets.UTF_8);
      System.out.println(e + " " + URLDecoder.decode(e, StandardCharsets.UTF_8));
      ```
    choices:
      - {text: "`caf%C3%A9+%26+th%C3%A9%3D1 café & thé=1`", correct: true}
      - {text: "`caf%C3%A9%20%26%20th%C3%A9%3D1 café & thé=1`", correct: false}
      - {text: "`café+%26+thé%3D1 café & thé=1`", correct: false}
      - {text: "`caf%E9+%26+th%E9%3D1 café & thé=1`", correct: false}
    answer: "`caf%C3%A9+%26+th%C3%A9%3D1 café & thé=1` : `URLEncoder` encode l'espace en `+` (format des formulaires), et chaque accent en ses octets UTF-8."
    check:
      output: "caf%C3%A9+%26+th%C3%A9%3D1 café & thé=1"
  - key: code-resolve
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      URI base = URI.create("https://exemple.org/api/v1/");
      System.out.println(base.resolve("commandes/42") + " " + base.resolve("../v2/x") + " " + base.resolve("/racine"));
      ```
    choices:
      - {text: "`https://exemple.org/api/v1/commandes/42 https://exemple.org/api/v2/x https://exemple.org/racine`", correct: true}
      - {text: "`https://exemple.org/api/v1/commandes/42 https://exemple.org/v2/x https://exemple.org/racine`", correct: false}
      - {text: "`https://exemple.org/api/v1/commandes/42 https://exemple.org/api/v2/x https://exemple.org/api/v1/racine`", correct: false}
      - {text: "`https://exemple.org/commandes/42 https://exemple.org/v2/x https://exemple.org/racine`", correct: false}
    answer: '`https://exemple.org/api/v1/commandes/42 https://exemple.org/api/v2/x https://exemple.org/racine`.'
    check:
      output: "https://exemple.org/api/v1/commandes/42 https://exemple.org/api/v2/x https://exemple.org/racine"
  - key: code-invalide
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      URI.create("https://exemple.org/recherche?q=a b");
      ```
    choices:
      - {text: "Une `IllegalArgumentException`", correct: true}
      - {text: "Une `URISyntaxException`", correct: false}
      - {text: "Une `MalformedURLException`", correct: false}
      - {text: "Rien", correct: false}
    answer: |-
      Une `IllegalArgumentException` : l'espace n'est pas permis dans un URI. `URI.create` enveloppe la
      `URISyntaxException` (vérifiée) du constructeur dans cette exception non vérifiée.
    check:
      throws: IllegalArgumentException
