notion: io-decorateurs
lesson: |-
  Les flux de `java.io` sont conçus selon le motif **Décorateur** : un flux **enveloppe** un autre flux du même type et
  lui **ajoute** une fonction, sans changer son interface. On les empile comme des couches.

  ```java
  try (var in = new DataInputStream(                 // lit des types primitifs
                   new BufferedInputStream(          // ajoute un tampon
                       new GZIPInputStream(          // décompresse
                           Files.newInputStream(fichierGz))))) {   // la source : le fichier
      int version = in.readInt();
      long horodatage = in.readLong();
  }
  ```

  Exemples de décorateurs :

  | Décorateur | Ajoute |
  |---|---|
  | `BufferedInputStream`, `BufferedReader` | un tampon |
  | `InputStreamReader` | le décodage octets → caractères |
  | `GZIPInputStream`, `GZIPOutputStream` | la compression |
  | `DataInputStream`, `DataOutputStream` | la lecture et l'écriture de primitifs (`readInt`, `writeLong`) |
  | `ObjectInputStream`, `ObjectOutputStream` | la sérialisation d'objets |
  | `CipherInputStream` | le chiffrement |
  | `PrintWriter`, `PrintStream` | `println`, `printf` |

  - **Fermer le flux extérieur** ferme toute la pile : un seul try-with-resources suffit (on peut aussi déclarer chaque
    couche comme ressource, pour fermer la source même si la construction d'une couche échoue).
  - L'**ordre** compte : la compression doit envelopper la source, le tampon se place près de la source, le décodage
    au-dessus des octets.
  - Pour ses propres besoins, on étend `FilterInputStream` ou `FilterOutputStream` (par exemple pour compter les octets).
  - Le même motif se retrouve dans `Collections.unmodifiableList`, les intercepteurs, et beaucoup de frameworks.

  **Piège classique** : oublier `finish()` ou `close()` sur un `GZIPOutputStream`. Le fichier compressé est incomplet
  (la fin du flux n'est pas écrite) et illisible.

  **En entretien** : « Les flux java.io sont des décorateurs : chacun enveloppe un autre flux et ajoute un comportement
  (tampon, compression, décodage) ; fermer le plus extérieur ferme toute la pile. »
cards:
  - key: pattern-illustre-empilement-flux-java-io
    format: course
    question: Quel pattern illustre l'empilement des flux java.io ?
    answer: Le Decorator.
  - key: fermeture-pile
    format: course
    question: Faut-il fermer chaque couche d'une pile de flux ?
    answer: Non, fermer le flux le plus extérieur ferme les flux qu'il enveloppe ; on peut toutefois déclarer chaque couche dans le try-with-resources pour fermer la source si la construction d'une couche échoue.
  - key: exemples
    format: course
    question: Citez trois décorateurs de flux et ce qu'ils ajoutent.
    answer: '`BufferedInputStream` (un tampon), `GZIPInputStream` (la décompression), `InputStreamReader` (le décodage en caractères) ; aussi `DataInputStream` (les primitifs) et `ObjectInputStream` (les objets).'
  - key: propre
    format: course
    question: Comment écrire son propre décorateur de flux ?
    answer: En étendant `FilterInputStream` ou `FilterOutputStream` et en redéfinissant `read` ou `write`, par exemple pour compter les octets ou calculer une somme de contrôle au passage.
  - key: vf-fermer-exterieur
    format: true-false
    question: Fermer un `BufferedReader` ferme aussi le `FileReader` qu'il enveloppe.
    truth: true
    answer: La fermeture se propage vers l'intérieur.
  - key: vf-interface
    format: true-false
    question: Un décorateur change l'interface du flux qu'il enveloppe.
    truth: false
    answer: Il garde la même interface (un `InputStream` reste un `InputStream`) et ajoute un comportement.
  - key: vf-gzip
    format: true-false
    question: Un fichier écrit avec `GZIPOutputStream` est complet même sans `close()` ni `finish()`.
    truth: false
    answer: La fin du flux compressé n'est écrite qu'à `finish()` ou `close()`.
  - key: vf-collections
    format: true-false
    question: "`Collections.unmodifiableList` applique aussi le motif Décorateur."
    truth: true
    answer: Elle enveloppe une liste et ajoute l'interdiction de modifier.
  - key: qcm-ordre
    format: multiple-choice
    question: Quelle pile lit correctement du texte UTF-8 dans un fichier compressé en gzip ?
    choices:
      - text: "`new BufferedReader(new InputStreamReader(new GZIPInputStream(Files.newInputStream(p)), UTF_8))`"
        correct: true
      - text: "`new GZIPInputStream(new BufferedReader(new FileReader(p)))`"
        correct: false
      - text: "`new InputStreamReader(new BufferedReader(new GZIPInputStream(...)))`"
        correct: false
      - text: "`Files.newBufferedReader(p)` seul"
        correct: false
    answer: Décompresser les octets, puis les décoder en caractères, puis bufferiser.
  - key: qcm-data
    format: multiple-choice
    question: Quel décorateur lit des `int` et des `long` écrits en binaire ?
    choices:
      - text: "`DataInputStream`"
        correct: true
      - text: "`BufferedReader`"
        correct: false
      - text: "`Scanner`"
        correct: false
      - text: "`StringReader`"
        correct: false
    answer: Avec `readInt`, `readLong`, symétriques de `DataOutputStream`.
  - key: qcm-motif
    format: multiple-choice
    question: Qu'apporte le motif Décorateur aux flux ?
    choices:
      - text: "Combiner librement des comportements sans une classe par combinaison"
        correct: true
      - text: "Garder la même interface à chaque couche"
        correct: true
      - text: "Rendre les flux thread-safe"
        correct: false
      - text: "Éviter de fermer les flux"
        correct: false
    answer: Tampon + compression + chiffrement se combinent par empilement.
  - key: qcm-compter
    format: multiple-choice
    question: Comment compter les octets lus à travers un flux, sans modifier le code qui lit ?
    choices:
      - text: "Envelopper le flux dans un `FilterInputStream` qui compte"
        correct: true
      - text: "Modifier chaque appel à `read`"
        correct: false
      - text: "Utiliser `available()`"
        correct: false
      - text: "Lire le fichier deux fois"
        correct: false
    answer: Un décorateur ajoute le comptage de façon transparente.
  - key: code-gzip
    format: code-output
    question: |-
      ```java
      import java.util.zip.*;
      ByteArrayOutputStream compresse = new ByteArrayOutputStream();
      try (var out = new GZIPOutputStream(compresse)) {
          out.write("bonjour ".repeat(100).getBytes());
      }
      try (var in = new GZIPInputStream(new ByteArrayInputStream(compresse.toByteArray()))) {
          System.out.println(new String(in.readAllBytes()).length() + " " + (compresse.size() < 800));
      }
      ```
    answer: '`800 true` : 800 caractères retrouvés, bien moins de 800 octets compressés.'
    check:
      output: "800 true"
  - key: code-data
    format: code-output
    question: |-
      ```java
      ByteArrayOutputStream octets = new ByteArrayOutputStream();
      try (var out = new DataOutputStream(octets)) {
          out.writeInt(42);
          out.writeUTF("ok");
      }
      try (var in = new DataInputStream(new ByteArrayInputStream(octets.toByteArray()))) {
          System.out.println(in.readInt() + " " + in.readUTF() + " " + octets.size());
      }
      ```
    answer: '`42 ok 8` : 4 octets pour l''`int`, 2 pour la longueur et 2 pour « ok ».'
    check:
      output: "42 ok 8"
  - key: code-filtre
    format: code-output
    question: |-
      ```java
      class Compteur extends FilterInputStream {
          long total;
          Compteur(InputStream in) { super(in); }
          @Override public int read(byte[] b, int off, int len) throws IOException {
              int n = super.read(b, off, len);
              if (n > 0) total += n;
              return n;
          }
      }
      Compteur c = new Compteur(new ByteArrayInputStream(new byte[1000]));
      c.readAllBytes();
      System.out.println(c.total);
      ```
    answer: '`1000` : le décorateur compte les octets au passage.'
    check:
      output: "1000"
  - key: code-pile
    format: code-output
    question: |-
      ```java
      byte[] texte = "ligne 1\nligne 2".getBytes(java.nio.charset.StandardCharsets.UTF_8);
      try (var r = new BufferedReader(new InputStreamReader(new ByteArrayInputStream(texte),
              java.nio.charset.StandardCharsets.UTF_8))) {
          System.out.println(r.readLine() + " | " + r.readLine());
      }
      ```
    answer: '`ligne 1 | ligne 2` : octets, décodage, puis tampon.'
    check:
      output: "ligne 1 | ligne 2"
