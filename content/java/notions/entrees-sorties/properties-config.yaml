notion: properties-config
lesson: |-
  Un fichier **`.properties`** stocke des paires `clé=valeur`, une par ligne :

  ```
  # configuration de l'application
  serveur.port=8080
  base.url=jdbc:postgresql://localhost/recallio
  message.accueil=Bienvenue \
    sur Recallio
  ```

  ```java
  Properties props = new Properties();
  try (Reader r = Files.newBufferedReader(Path.of("app.properties"), StandardCharsets.UTF_8)) {
      props.load(r);
  }
  int port = Integer.parseInt(props.getProperty("serveur.port", "8080"));     // valeur par défaut

  try (InputStream in = MaClasse.class.getResourceAsStream("/defaut.properties")) {   // depuis le classpath
      props.load(in);
  }
  ```

  - Les lignes commençant par `#` ou `!` sont des **commentaires** ; `=` ou `:` séparent la clé de la valeur ; une ligne
    terminée par `\` continue sur la suivante.
  - Toutes les valeurs sont des **chaînes** : on convertit et on **valide** soi-même.
  - **L'encodage** : `load(InputStream)` lit en **ISO-8859-1** (les accents passent par des échappements `\u00e9`) ;
    `load(Reader)` utilise l'encodage du `Reader`, donc on lit en UTF-8 avec un `Reader`.
  - Une ressource du **classpath** se lit avec `getResourceAsStream` (elle peut être dans un JAR, ce n'est pas un fichier).
  - `System.getProperty("cle")` lit les propriétés système (`-Dcle=valeur`), `System.getenv("CLE")` les variables
    d'environnement.

  En pratique, les frameworks gèrent la configuration : MicroProfile Config / `@ConfigProperty` (Quarkus),
  `application.properties` et `@ConfigurationProperties` (Spring), avec des **profils** et une **priorité** des sources
  (variables d'environnement au-dessus du fichier). Les **secrets** viennent de l'environnement, jamais du dépôt.

  **Piège classique** : un fichier `.properties` en UTF-8 lu avec `load(InputStream)`. Les accents deviennent `Ã©`, car
  ce flux est décodé en ISO-8859-1.

  **En entretien** : « Des paires clé-valeur en texte, toutes des chaînes ; `load(Reader)` en UTF-8 pour les accents,
  `getResourceAsStream` pour le classpath ; et en vrai la configuration du framework, avec les secrets dans
  l'environnement. »
tour:
  - title: Les fichiers properties
    text: |-
      Un fichier `.properties` contient des paires `cle=valeur`, une par ligne, avec des commentaires `#` : le format
      historique de configuration en Java. `Properties.load` le lit depuis un flux, et `getProperty(cle, defaut)` donne
      une valeur.

      On le charge souvent depuis le *classpath*, ou depuis un fichier. Les valeurs sont toujours des chaînes, à
      convertir soi-même. Ici, le contenu vient d'une chaîne.
    example:
      files:
        Main.java: |-
          void main() throws IOException {
              String contenu = """
                      # configuration de l'application
                      nom=Recallio
                      port=8080
                      debug=true
                      """;
              Properties config = new Properties();
              config.load(new StringReader(contenu));
              IO.println(config.getProperty("nom"));
              int port = Integer.parseInt(config.getProperty("port"));
              IO.println(port + 1);
              IO.println(Boolean.parseBoolean(config.getProperty("debug")));
              IO.println(config.getProperty("langue", "fr"));
          }
      output: |-
        Recallio
        8081
        true
        fr
cards:
  - key: format
    format: course
    question: Comment s'écrit un fichier `.properties` ?
    answer: Une paire `clé=valeur` (ou `clé:valeur`) par ligne ; `#` ou `!` pour les commentaires ; un `\` en fin de ligne pour continuer sur la suivante.
  - key: encodage
    format: course
    question: Quel encodage utilise `Properties.load(InputStream)` ?
    answer: ISO-8859-1 ; pour un fichier en UTF-8, on utilise `load(Reader)` avec un `Reader` en UTF-8.
  - key: classpath
    format: course
    question: Comment lire un fichier de propriétés embarqué dans le JAR ?
    answer: Avec `MaClasse.class.getResourceAsStream("/fichier.properties")` (ou le `ClassLoader`), car une ressource du classpath n'est pas forcément un fichier sur le disque.
  - key: secrets
    format: course
    question: Où placer les mots de passe et clés d'API de l'application ?
    answer: Dans des variables d'environnement ou un gestionnaire de secrets, jamais dans un fichier versionné du dépôt.
  - key: vf-types
    format: true-false
    question: "`Properties.getProperty` renvoie directement un `int` pour une valeur numérique."
    truth: false
    answer: Toutes les valeurs sont des chaînes, à convertir.
  - key: vf-defaut
    format: true-false
    question: "`getProperty(cle, defaut)` renvoie `defaut` si la clé est absente."
    truth: true
    answer: Sans défaut, la méthode renvoie `null`.
  - key: vf-commentaire
    format: true-false
    question: Une ligne commençant par `!` est un commentaire dans un fichier `.properties`.
    truth: true
    answer: Comme `#`.
  - key: vf-ressource-fichier
    format: true-false
    question: Une ressource du classpath peut toujours être lue avec `Path.of(...)`.
    truth: false
    answer: Dans un JAR, ce n'est pas un fichier ; on la lit en flux.
  - key: qcm-utf8
    format: multiple-choice
    question: Comment charger correctement un fichier de propriétés UTF-8 contenant des accents ?
    choices:
      - text: "`props.load(Files.newBufferedReader(p, StandardCharsets.UTF_8))`"
        correct: true
      - text: "`props.load(Files.newInputStream(p))`"
        correct: false
      - text: "`props.load(new FileInputStream(p.toFile()))`"
        correct: false
      - text: "`Files.readString(p)` puis `split(\"=\")` à la main"
        correct: false
    answer: Un `InputStream` est décodé en ISO-8859-1.
  - key: qcm-sources
    format: multiple-choice
    question: Comment lire une valeur passée au lancement par `java -Dmode=test -jar app.jar` ?
    choices:
      - text: "`System.getProperty(\"mode\")`"
        correct: true
      - text: "`System.getenv(\"mode\")`"
        correct: false
      - text: "`args[0]`"
        correct: false
      - text: "`Properties.load(\"mode\")`"
        correct: false
    answer: '`-D` définit une propriété système ; `getenv` lit les variables d''environnement.'
  - key: qcm-framework
    format: multiple-choice
    question: Que fournissent les mécanismes de configuration des frameworks (MicroProfile Config, Spring) en plus de `Properties` ?
    choices:
      - text: "La conversion et la validation des valeurs"
        correct: true
      - text: "Des profils et une priorité entre sources (environnement au-dessus du fichier)"
        correct: true
      - text: "Le chiffrement automatique de tout le fichier"
        correct: false
      - text: "L'interdiction des variables d'environnement"
        correct: false
    answer: Une variable d'environnement peut surcharger une valeur du fichier.
  - key: qcm-continuation
    format: multiple-choice
    question: "Quelle valeur donne `message=Bonjour \\` suivi, à la ligne suivante, de `   tout le monde` ?"
    choices:
      - text: "`Bonjour tout le monde`"
        correct: true
      - text: "`Bonjour \\`"
        correct: false
      - text: "`Bonjour    tout le monde`"
        correct: false
      - text: "`Bonjour`"
        correct: false
    answer: Les espaces en tête de la ligne de continuation sont ignorés.
  - key: code-load
    format: code-output
    question: |-
      ```java
      Properties p = new Properties();
      p.load(new StringReader("""
              # commentaire
              port=8080
              nom : recallio
              message=Bonjour \\
                tout le monde
              """));
      System.out.println(p.getProperty("port") + " " + p.getProperty("nom") + " " + p.getProperty("message"));
      ```
    answer: '`8080 recallio Bonjour tout le monde`.'
    check:
      output: "8080 recallio Bonjour tout le monde"
  - key: code-defaut
    format: code-output
    question: |-
      ```java
      Properties p = new Properties();
      p.setProperty("delai", "30");
      int delai = Integer.parseInt(p.getProperty("delai"));
      System.out.println(delai * 2 + " " + p.getProperty("absent") + " " + p.getProperty("absent", "défaut"));
      ```
    answer: '`60 null défaut`.'
    check:
      output: "60 null défaut"
  - key: code-encodage
    format: code-output
    question: |-
      ```java
      import java.nio.charset.StandardCharsets;
      byte[] utf8 = "ville=Orléans".getBytes(StandardCharsets.UTF_8);
      Properties p1 = new Properties();
      p1.load(new ByteArrayInputStream(utf8));
      Properties p2 = new Properties();
      p2.load(new InputStreamReader(new ByteArrayInputStream(utf8), StandardCharsets.UTF_8));
      System.out.println(p1.getProperty("ville") + " " + p2.getProperty("ville"));
      ```
    answer: '`OrlÃ©ans Orléans` : le flux d''octets est décodé en ISO-8859-1.'
    check:
      output: "OrlÃ©ans Orléans"
  - key: code-echappement
    format: code-output
    question: |-
      ```java
      Properties p = new Properties();
      p.load(new StringReader("titre=\\u00c9t\\u00e9\nchemin=C:\\\\temp"));
      System.out.println(p.getProperty("titre") + " " + p.getProperty("chemin"));
      ```
    answer: '`Été C:\temp` : les échappements `\u` et `\\` sont interprétés.'
    check:
      output: "Été C:\\temp"
