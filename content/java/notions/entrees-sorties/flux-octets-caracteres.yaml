notion: flux-octets-caracteres
lesson: |-
  `java.io` distingue deux familles de flux :

  | | Octets (binaire) | Caractères (texte) |
  |---|---|---|
  | lecture | `InputStream` | `Reader` |
  | écriture | `OutputStream` | `Writer` |
  | fichiers | `FileInputStream`, `FileOutputStream` | `FileReader`, `FileWriter` |
  | mémoire | `ByteArrayInputStream`, `ByteArrayOutputStream` | `StringReader`, `StringWriter` |
  | pont | | `InputStreamReader`, `OutputStreamWriter` (avec un charset) |

  - Un **flux d'octets** transporte des `byte` bruts : images, PDF, fichiers compressés, données réseau.
  - Un **flux de caractères** transporte du **texte** : il **décode** les octets en caractères selon un **encodage**
    (UTF-8...). On passe de l'un à l'autre avec `InputStreamReader(in, StandardCharsets.UTF_8)`.

  ```java
  try (InputStream in = Files.newInputStream(image)) {
      byte[] tampon = new byte[8192];
      int lus;
      while ((lus = in.read(tampon)) != -1) {        // -1 : fin du flux
          traiter(tampon, lus);                     // seuls les `lus` premiers octets sont valides
      }
  }

  try (Reader r = new StringReader("abc")) {
      int c = r.read();                              // un caractère, ou -1
  }
  in.transferTo(out);                                // copier un flux dans un autre (Java 9)
  byte[] tout = in.readAllBytes();                   // tout lire (Java 9), si la taille est raisonnable
  ```

  - `read()` renvoie un `int` : l'octet (0 à 255) ou le caractère, et **-1** à la fin. Ne jamais le convertir en `byte`
    avant d'avoir testé -1.
  - `read(tampon)` peut lire **moins** que la taille du tampon : on utilise le nombre renvoyé.
  - Un flux s'ouvre et **se ferme** : toujours dans un **try-with-resources** (descripteurs de fichiers, connexions).
  - `IOException` est vérifiée : chaque opération peut échouer (disque, réseau).

  **Piège classique** : lire un fichier texte avec un `InputStream` et faire `new String(octets)` sans encodage, ou un
  binaire avec un `Reader`. Le texte se décode avec le bon charset, le binaire ne se décode jamais.

  **En entretien** : « `InputStream`/`OutputStream` pour les octets, `Reader`/`Writer` pour le texte, reliés par
  `InputStreamReader` et un charset explicite ; `read` renvoie -1 à la fin, et tout se ferme par try-with-resources. »
cards:
  - key: inputstream-vs-reader
    format: course
    question: "Quelle différence entre un `InputStream` et un `Reader` ?"
    choices:
      - {text: "`InputStream` lit des octets, `Reader` des caractères décodés avec un charset", correct: true}
      - {text: "`InputStream` lit des caractères, `Reader` des octets bruts, sans décodage", correct: false}
      - {text: "`InputStream` lit un fichier, `Reader` lit la console ou le réseau", correct: false}
      - {text: "`InputStream` lit un octet à la fois, `Reader` lit toujours par blocs", correct: false}
    answer: |-
      Un `InputStream` est un flux d'octets ; un `Reader`, un flux de caractères, décodés avec un charset. Les deux lisent
      n'importe quelle source : fichier, réseau, mémoire.
  - key: fin-flux
    format: course
    question: Comment sait-on qu'on a atteint la fin d'un flux ?
    choices:
      - {text: "`read()` renvoie -1", correct: true}
      - {text: "`read()` renvoie 0", correct: false}
      - {text: "`read()` renvoie `null`", correct: false}
      - {text: "`read()` lève une `EOFException`", correct: false}
    answer: "`read()` (ou `read(tampon)`) renvoie -1. Pas 0 : `read()` donne un octet de 0 à 255, et 0 est un octet valide."
  - key: read-partiel
    format: course
    question: Que renvoie `in.read(tampon)`, et pourquoi faut-il l'utiliser ?
    choices:
      - {text: "Le nombre d'octets lus, parfois moins que la taille du tampon : seuls ceux-là sont valides", correct: true}
      - {text: "La taille du tampon, toujours rempli en entier, sauf à la toute dernière lecture du flux", correct: false}
      - {text: "Le nombre d'octets encore disponibles, pour savoir combien d'appels il reste à faire", correct: false}
      - {text: "Le premier octet lu ; les suivants sont rangés dans le tampon, dans l'ordre de lecture", correct: false}
    answer: |-
      Le nombre d'octets réellement lus, qui peut être inférieur à la taille du tampon (ou -1 à la fin) ; seuls ces octets
      sont valides. Un tampon n'est pas forcément rempli, même au milieu du flux.
  - key: pont
    format: course
    question: Comment lire du texte depuis un `InputStream` ?
    choices:
      - {text: "En l'enveloppant dans un `InputStreamReader`, avec un charset explicite", correct: true}
      - {text: "En l'enveloppant dans un `BufferedInputStream`, qui décode les octets en texte", correct: false}
      - {text: "En le convertissant en `Reader` par un simple cast : `(Reader) in`", correct: false}
      - {text: "En l'enveloppant dans un `DataInputStream`, puis en appelant `readUTF()` en boucle", correct: false}
    answer: |-
      En l'enveloppant dans un `InputStreamReader` avec un charset explicite, `new InputStreamReader(in,
      StandardCharsets.UTF_8)`, souvent dans un `BufferedReader`. Un `BufferedInputStream` ajoute un tampon, mais reste
      un flux d'octets.
  - key: vf-reader-binaire
    format: true-false
    question: Un `Reader` convient pour lire une image PNG.
    truth: false
    answer: Le décodage en caractères corromprait les octets ; on utilise un `InputStream`.
  - key: vf-read-int
    format: true-false
    question: "`InputStream.read()` renvoie un `int` pour pouvoir représenter -1 en plus des 256 valeurs d'un octet."
    truth: true
    answer: Les octets sont renvoyés de 0 à 255.
  - key: vf-plein
    format: true-false
    question: "`read(tampon)` remplit toujours entièrement le tampon s'il reste assez de données."
    truth: false
    answer: Il peut lire moins, en particulier sur le réseau ; `readNBytes` lit exactement le nombre demandé.
  - key: vf-transfer
    format: true-false
    question: "`in.transferTo(out)` copie tout le contenu d'un flux dans un autre."
    truth: true
    answer: Depuis Java 9.
  - key: qcm-famille
    format: multiple-choice
    question: Lesquels sont des flux de caractères ?
    choices:
      - text: "`BufferedReader`"
        correct: true
      - text: "`StringWriter`"
        correct: true
      - text: "`FileInputStream`"
        correct: false
      - text: "`ByteArrayOutputStream`"
        correct: false
    answer: Les `Reader` et `Writer` manipulent des caractères.
  - key: qcm-binaire
    format: multiple-choice
    question: Quel flux pour copier un fichier ZIP ?
    choices:
      - text: "Un `InputStream` et un `OutputStream`"
        correct: true
      - text: "Un `FileReader` et un `FileWriter`"
        correct: false
      - text: "Un `Scanner`"
        correct: false
      - text: "Un `StringReader`"
        correct: false
    answer: Un fichier binaire se copie octet pour octet ; `Files.copy` le fait aussi.
  - key: qcm-boucle
    format: multiple-choice
    question: Quelle boucle de lecture est correcte ?
    choices:
      - text: "`while ((n = in.read(buf)) != -1) out.write(buf, 0, n);`"
        correct: true
      - text: "`while (in.read(buf) != -1) out.write(buf);`"
        correct: false
      - text: "`while (in.available() > 0) out.write(in.read());`"
        correct: false
      - text: "`for (int i = 0; i < buf.length; i++) out.write(in.read());`"
        correct: false
    answer: La deuxième écrit tout le tampon même s'il n'est rempli qu'en partie ; `available` n'est pas une fin de flux.
  - key: qcm-fermeture
    format: multiple-choice
    question: Comment garantir qu'un flux est fermé, même en cas d'exception ?
    choices:
      - text: "Un try-with-resources"
        correct: true
      - text: "Un `close()` à la fin du bloc `try`"
        correct: false
      - text: "Compter sur le ramasse-miettes"
        correct: false
      - text: "Un `flush()`"
        correct: false
    answer: Le try-with-resources appelle `close()` dans tous les cas.
  - key: trous-pont
    format: fill-in
    question: |-
      Complète pour lire du texte UTF-8 depuis un flux d'octets :
      ```java
      Reader r = new ___(in, StandardCharsets.UTF_8);
      ```
    blanks: [[InputStreamReader]]
    answer: Le pont entre octets et caractères.
  - key: trous-fin
    format: fill-in
    question: |-
      Complète la condition de fin :
      ```java
      int c;
      while ((c = reader.read()) != ___) {
          traiter((char) c);
      }
      ```
    blanks: [["-1"]]
    answer: '`read` renvoie -1 à la fin du flux.'
  - key: trous-transfer
    format: fill-in
    question: |-
      Complète pour copier un flux dans un autre :
      ```java
      try (InputStream in = source(); OutputStream out = destination()) {
          in.___(out);
      }
      ```
    blanks: [[transferTo]]
    answer: Java 9.
  - key: trous-memoire
    format: fill-in
    question: |-
      Complète pour récupérer en mémoire les octets écrits :
      ```java
      ByteArrayOutputStream out = new ByteArrayOutputStream();
      ecrire(out);
      byte[] octets = out.___();
      ```
    blanks: [[toByteArray]]
    answer: Pratique dans les tests.
  - key: code-octets
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      InputStream in = new ByteArrayInputStream(new byte[]{65, (byte) 200});
      System.out.println(in.read() + " " + in.read() + " " + in.read());
      ```
    choices:
      - {text: "`65 200 -1`", correct: true}
      - {text: "`65 -56 -1`", correct: false}
      - {text: "`65 200 0`", correct: false}
      - {text: "`65 -56 0`", correct: false}
    answer: '`65 200 -1` : les octets sont renvoyés de 0 à 255, puis -1 à la fin.'
    check:
      output: "65 200 -1"
  - key: code-reader
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Reader r = new StringReader("hé");
      int c;
      StringBuilder sb = new StringBuilder();
      while ((c = r.read()) != -1) sb.append((char) c).append('|');
      System.out.println(sb);
      ```
    choices:
      - {text: "`h|é|`", correct: true}
      - {text: "`h|Ã|©|`", correct: false}
      - {text: "`hé|`", correct: false}
      - {text: "`h|?|`", correct: false}
    answer: '`h|é|` : un `Reader` lit des caractères, pas des octets.'
    check:
      output: "h|é|"
  - key: code-read-partiel
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      InputStream in = new ByteArrayInputStream("abcde".getBytes());
      byte[] tampon = new byte[3];
      int n1 = in.read(tampon);
      int n2 = in.read(tampon);
      System.out.println(n1 + " " + n2 + " " + new String(tampon, 0, n2));
      ```
    choices:
      - {text: "`3 2 de`", correct: true}
      - {text: "`3 2 dec`", correct: false}
      - {text: "`3 3 dec`", correct: false}
      - {text: "`3 -1 abc`", correct: false}
    answer: '`3 2 de` : la seconde lecture ne remplit que 2 octets.'
    check:
      output: "3 2 de"
  - key: code-transfer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      ByteArrayOutputStream out = new ByteArrayOutputStream();
      new ByteArrayInputStream("copie".getBytes()).transferTo(out);
      System.out.println(out.size() + " " + out);
      ```
    choices:
      - {text: "`5 copie`", correct: true}
      - {text: "`0 copie`", correct: false}
      - {text: "`6 copie`", correct: false}
      - {text: "`5 [99, 111, 112, 105, 101]`", correct: false}
    answer: "`5 copie` : `transferTo` copie les 5 octets, et `toString()` les décode en texte."
    check:
      output: "5 copie"
  - key: bug-tampon-entier
    format: bug-fix
    question: |-
      Le fichier copié est corrompu : il a des octets en trop à la fin. Quelle correction est la bonne ?
      ```java
      byte[] buf = new byte[8192];
      while (in.read(buf) != -1) {
          out.write(buf);
      }
      ```
    choices:
      - {text: "Garder le nombre `n` d'octets lus et écrire `out.write(buf, 0, n)`", correct: true}
      - {text: "Appeler `out.flush()` après chaque `out.write(buf)` de la boucle", correct: false}
      - {text: "Tester `in.read(buf) > 0` au lieu de `!= -1` dans la boucle", correct: false}
      - {text: "Réduire le tampon à 1 024 octets pour limiter les octets en trop", correct: false}
    answer: |-
      ```java
      byte[] buf = new byte[8192];
      int n;
      while ((n = in.read(buf)) != -1) {
          out.write(buf, 0, n);
      }
      // ou simplement : in.transferTo(out);
      ```
      La dernière lecture ne remplit qu'une partie du tampon : il faut n'écrire que les `n` octets lus.
  - key: bug-fermeture
    format: bug-fix
    question: |-
      Après quelques heures, l'application échoue avec « Too many open files ». Quelle correction est la bonne ?
      ```java
      InputStream in = Files.newInputStream(chemin);
      byte[] contenu = in.readAllBytes();
      ```
    choices:
      - {text: "Ouvrir le flux dans un try-with-resources, qui le ferme toujours", correct: true}
      - {text: "Remplacer `readAllBytes` par une boucle de `read` sur un tampon", correct: false}
      - {text: "Envelopper le flux dans un `BufferedInputStream`, pour moins d'appels", correct: false}
      - {text: "Appeler `System.gc()` après chaque lecture, pour libérer les flux", correct: false}
    answer: |-
      ```java
      byte[] contenu;
      try (InputStream in = Files.newInputStream(chemin)) {
          contenu = in.readAllBytes();
      }
      // ou : byte[] contenu = Files.readAllBytes(chemin);
      ```
      Le flux n'était jamais fermé : chaque appel laissait un descripteur ouvert. Le try-with-resources le ferme toujours.
  - key: bug-reader-binaire
    format: bug-fix
    question: |-
      L'image copiée ne s'ouvre plus. Pourquoi ?
      ```java
      try (Reader in = new FileReader(source); Writer out = new FileWriter(cible)) {
          in.transferTo(out);
      }
      ```
    choices:
      - {text: "Le `Reader` décode les octets en caractères : l'image ne survit pas à l'aller-retour", correct: true}
      - {text: "Le `Writer` n'est jamais vidé par `flush()` : la fin de l'image manque dans la copie", correct: false}
      - {text: "`transferTo` n'existe que sur `InputStream` : seul le premier bloc est copié", correct: false}
      - {text: "`FileWriter` ajoute un retour à la ligne à la fin du fichier qu'il écrit", correct: false}
    answer: |-
      ```java
      Files.copy(source.toPath(), cible.toPath(), StandardCopyOption.REPLACE_EXISTING);
      // ou des InputStream / OutputStream
      ```
      Un `Reader` décode les octets en caractères (et le `Writer` les réencode) : les octets d'une image ne survivent pas
      à cet aller-retour. Un fichier binaire se copie en octets.
  - key: bug-cast-byte
    format: bug-fix
    question: |-
      Cette boucle s'arrête trop tôt sur certains fichiers binaires. Pourquoi ?
      ```java
      byte b;
      while ((b = (byte) in.read()) != -1) {
          out.write(b);
      }
      ```
    choices:
      - {text: "L'octet 255 converti en `byte` vaut -1 : la boucle le prend pour la fin du flux", correct: true}
      - {text: "`read()` renvoie -1 pour chaque octet nul : la boucle s'arrête au premier 0 du fichier", correct: false}
      - {text: "La conversion en `byte` lève une exception silencieuse pour les valeurs au-delà de 127", correct: false}
      - {text: "`out.write(b)` n'écrit que les 7 bits de poids faible, et la copie s'interrompt", correct: false}
    answer: |-
      ```java
      int b;
      while ((b = in.read()) != -1) {
          out.write(b);
      }
      ```
      L'octet 255 converti en `byte` vaut -1 : la boucle le prend pour la fin du flux. On teste la valeur `int` avant
      toute conversion.
