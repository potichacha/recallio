notion: io-encodage
lesson: |-
  Un fichier texte est une suite d'**octets**. Pour en faire des caractères, il faut connaître son **encodage** :
  UTF-8, ISO-8859-1, Windows-1252... Lire avec le mauvais encodage donne du texte corrompu (`Ã©` au lieu de `é`), parfois
  sans aucune erreur.

  ```java
  // Toujours un encodage explicite
  Files.readString(p, StandardCharsets.UTF_8);
  Files.newBufferedReader(p, StandardCharsets.UTF_8);
  new InputStreamReader(in, StandardCharsets.UTF_8);
  new OutputStreamWriter(out, Charset.forName("windows-1252"));
  "été".getBytes(StandardCharsets.UTF_8);            // 5 octets
  new String(octets, StandardCharsets.UTF_8);
  ```

  - Depuis **Java 18** (JEP 400), l'encodage **par défaut** est **UTF-8** sur toutes les plateformes. Avant, il dépendait
    du système (Windows-1252 sur un Windows français). Les méthodes de `Files` utilisent UTF-8 par défaut depuis Java 7.
  - Les classes historiques `FileReader`/`FileWriter` utilisaient l'encodage par défaut ; depuis Java 11, elles acceptent
    un `Charset` en paramètre.
  - Un décodeur **remplace** par défaut les octets invalides par `�` (dans `new String`, `InputStreamReader`) ;
    `Files.readString` et `Files.readAllLines` lèvent une `MalformedInputException`.
  - L'**en-tête BOM** UTF-8 (`EF BB BF`) que produisent certains outils Windows n'est pas retiré automatiquement par Java :
    il apparaît comme un caractère `﻿` en tête de la première ligne.
  - On écrit l'encodage une fois pour toutes dans le contrat d'un format d'échange (fichier CSV d'un partenaire, API).

  **Piège classique** : `new String(octets)` ou `getBytes()` sans charset. Le résultat dépend de la machine (avant Java 18)
  ou suppose UTF-8 alors que le fichier vient d'un logiciel en Windows-1252.

  **En entretien** : « Un texte n'a de sens qu'avec son encodage : je le précise toujours, UTF-8 par défaut, et l'encodage
  attendu par le partenaire pour les échanges ; UTF-8 est le défaut de la JVM depuis Java 18. »
cards:
  - key: encodage
    format: course
    question: Pourquoi faut-il connaître l'encodage d'un fichier texte ?
    answer: Parce qu'un fichier est une suite d'octets ; seul l'encodage dit comment les transformer en caractères. Avec le mauvais, le texte est corrompu, souvent sans erreur.
  - key: java18
    format: course
    question: Qu'a changé Java 18 pour l'encodage par défaut ?
    answer: UTF-8 est devenu l'encodage par défaut sur toutes les plateformes (JEP 400), au lieu de celui du système.
  - key: octets-invalides
    format: course
    question: Que se passe-t-il quand on décode des octets invalides pour l'encodage choisi ?
    answer: '`new String` et `InputStreamReader` les remplacent par `�` ; `Files.readString` et `readAllLines` lèvent une `MalformedInputException`.'
  - key: bom
    format: course
    question: Qu'est-ce que le BOM UTF-8, et comment Java le traite-t-il ?
    answer: Trois octets `EF BB BF` en tête de fichier, ajoutés par certains outils ; Java ne les retire pas et les lit comme le caractère `﻿` au début de la première ligne.
  - key: vf-defaut-utf8
    format: true-false
    question: Depuis Java 18, `new String(octets)` décode en UTF-8 quelle que soit la plateforme.
    truth: true
    answer: JEP 400.
  - key: vf-files-defaut
    format: true-false
    question: "`Files.readString(p)` sans charset utilise UTF-8."
    truth: true
    answer: Les méthodes de `Files` utilisent UTF-8 par défaut.
  - key: vf-un-octet
    format: true-false
    question: En UTF-8, chaque caractère occupe un octet.
    truth: false
    answer: De 1 à 4 octets ; `é` en prend 2.
  - key: vf-erreur
    format: true-false
    question: Lire un fichier Windows-1252 en UTF-8 avec `new String` lève toujours une exception.
    truth: false
    answer: Les octets invalides sont remplacés silencieusement par `�`.
  - key: qcm-explicite
    format: multiple-choice
    question: Quelles écritures précisent l'encodage ?
    choices:
      - text: "`Files.newBufferedReader(p, StandardCharsets.UTF_8)`"
        correct: true
      - text: "`new InputStreamReader(in, StandardCharsets.ISO_8859_1)`"
        correct: true
      - text: "`new String(octets)`"
        correct: false
      - text: "`texte.getBytes()`"
        correct: false
    answer: Les deux dernières utilisent l'encodage par défaut.
  - key: qcm-symptome
    format: multiple-choice
    question: "Un CSV affiche `Ã©` à la place de `é`. Quelle est la cause probable ?"
    choices:
      - text: "Un fichier UTF-8 lu comme du Windows-1252 ou de l'ISO-8859-1"
        correct: true
      - text: "Un fichier Windows-1252 lu comme de l'UTF-8"
        correct: false
      - text: "Un fichier trop gros"
        correct: false
      - text: "Un `BufferedReader` sans tampon"
        correct: false
    answer: '`é` en UTF-8 fait deux octets, lus comme deux caractères `Ã` et `©`.'
  - key: qcm-octets
    format: multiple-choice
    question: "Combien d'octets fait `\"été\".getBytes(StandardCharsets.UTF_8)` ?"
    choices:
      - text: "5"
        correct: true
      - text: "3"
        correct: false
      - text: "6"
        correct: false
      - text: "4"
        correct: false
    answer: '2 pour chaque `é`, 1 pour le `t`.'
  - key: qcm-partenaire
    format: multiple-choice
    question: Un partenaire envoie des fichiers en Windows-1252. Comment les lire ?
    choices:
      - text: "`Files.newBufferedReader(p, Charset.forName(\"windows-1252\"))`"
        correct: true
      - text: "`Files.newBufferedReader(p)`, qui suppose UTF-8"
        correct: false
      - text: "`new FileReader(f)` sans encodage"
        correct: false
      - text: "Le convertir en binaire"
        correct: false
    answer: L'encodage fait partie du contrat d'échange.
  - key: code-octets
    format: code-output
    question: |-
      ```java
      import java.nio.charset.StandardCharsets;
      String s = "été";
      System.out.println(s.length() + " " + s.getBytes(StandardCharsets.UTF_8).length + " "
              + s.getBytes(StandardCharsets.ISO_8859_1).length);
      ```
    answer: '`3 5 3` : 3 caractères, 5 octets en UTF-8, 3 en ISO-8859-1.'
    check:
      output: "3 5 3"
  - key: code-mojibake
    format: code-output
    question: |-
      ```java
      import java.nio.charset.StandardCharsets;
      byte[] utf8 = "é".getBytes(StandardCharsets.UTF_8);
      System.out.println(new String(utf8, StandardCharsets.ISO_8859_1));
      ```
    answer: '`Ã©` : deux octets UTF-8 décodés comme deux caractères latins.'
    check:
      output: "Ã©"
  - key: code-remplacement
    format: code-output
    question: |-
      ```java
      import java.nio.charset.StandardCharsets;
      byte[] latin1 = "é".getBytes(StandardCharsets.ISO_8859_1);
      System.out.println(new String(latin1, StandardCharsets.UTF_8).equals("�"));
      ```
    answer: '`true` : l''octet invalide en UTF-8 devient le caractère de remplacement `�`.'
    check:
      output: "true"
  - key: code-bom
    format: code-output
    question: |-
      ```java
      import java.nio.charset.StandardCharsets;
      byte[] avecBom = {(byte) 0xEF, (byte) 0xBB, (byte) 0xBF, 'i', 'd'};
      String s = new String(avecBom, StandardCharsets.UTF_8);
      System.out.println(s.length() + " " + s.equals("id") + " " + (s.charAt(0) == '﻿'));
      ```
    answer: '`3 false true` : le BOM reste en tête de la chaîne.'
    check:
      output: "3 false true"
  - key: bug-getbytes
    format: bug-fix
    question: |-
      La signature calculée diffère entre le serveur Linux et le poste Windows (Java 17) :
      ```java
      byte[] donnees = message.getBytes();
      ```
    answer: |-
      ```java
      byte[] donnees = message.getBytes(StandardCharsets.UTF_8);
      ```
      Avant Java 18, `getBytes()` utilise l'encodage par défaut du système, différent selon la machine. Un encodage
      explicite rend le résultat identique partout.
  - key: bug-filereader
    format: bug-fix
    question: |-
      Les accents des fichiers d'un partenaire, encodés en Windows-1252, s'affichent `�` :
      ```java
      try (BufferedReader r = new BufferedReader(new FileReader(fichier))) { ... }
      ```
    answer: |-
      ```java
      try (BufferedReader r = Files.newBufferedReader(fichier.toPath(), Charset.forName("windows-1252"))) { ... }
      ```
      `FileReader` sans charset utilise l'encodage par défaut (UTF-8 depuis Java 18). L'encodage réel du fichier doit être
      donné explicitement.
  - key: bug-bom
    format: bug-fix
    question: |-
      La première colonne d'un CSV exporté depuis Excel n'est jamais reconnue :
      ```java
      String[] entetes = premiereLigne.split(";");
      if (entetes[0].equals("id")) { ... }       // toujours faux
      ```
    answer: |-
      ```java
      String ligne = premiereLigne.startsWith("﻿") ? premiereLigne.substring(1) : premiereLigne;
      String[] entetes = ligne.split(";");
      ```
      Excel ajoute un BOM UTF-8 que Java ne retire pas : la première colonne vaut `"﻿id"`. On le retire avant
      l'analyse (ou avec une bibliothèque CSV qui le gère).
  - key: bug-new-string
    format: bug-fix
    question: |-
      Ce code reçoit des octets UTF-8 d'une API et produit des accents corrompus sur un vieux serveur en Java 11 :
      ```java
      String corps = new String(reponse.octets());
      ```
    answer: |-
      ```java
      String corps = new String(reponse.octets(), StandardCharsets.UTF_8);
      ```
      Sans charset, la JVM utilisait l'encodage du système. L'encodage du corps (annoncé par l'en-tête `Content-Type`)
      doit être utilisé explicitement.
