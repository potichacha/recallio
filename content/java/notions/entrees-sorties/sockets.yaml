notion: sockets
lesson: |-
  Les **sockets** sont l'accès bas niveau au réseau, sous HTTP et les autres protocoles.

  **TCP** : une connexion **fiable** et **ordonnée** (les octets arrivent tous, dans l'ordre, ou la connexion échoue) :

  ```java
  // Serveur
  try (ServerSocket serveur = new ServerSocket(9000)) {
      while (true) {
          Socket client = serveur.accept();                 // attend une connexion
          Thread.ofVirtual().start(() -> servir(client));   // un thread (virtuel) par connexion
      }
  }

  // Client
  try (Socket s = new Socket()) {
      s.connect(new InetSocketAddress("localhost", 9000), 2000);   // délai de connexion
      s.setSoTimeout(5000);                                         // délai de lecture
      var out = new PrintWriter(s.getOutputStream(), true, StandardCharsets.UTF_8);
      var in = new BufferedReader(new InputStreamReader(s.getInputStream(), StandardCharsets.UTF_8));
      out.println("PING");
      String reponse = in.readLine();
  }
  ```

  **UDP** (`DatagramSocket`, `DatagramPacket`) : des **paquets** indépendants, **sans connexion**, sans garantie
  d'arrivée ni d'ordre ; plus léger, utilisé pour le DNS, la diffusion de métriques, le jeu en temps réel, la vidéo.

  À retenir :
  - TCP est un **flux d'octets** sans notion de message : il faut un **protocole de découpage** (une ligne par message, ou
    une longueur en tête) ;
  - toujours des **délais** : `connect(adresse, délai)` et `setSoTimeout` (sinon une lecture peut attendre pour
    toujours) ;
  - un thread par connexion est simple et, avec les **threads virtuels**, tient des milliers de connexions ; NIO et
    `Selector` (ou Netty) restent l'outil des serveurs très haute performance ;
  - en pratique, on écrit rarement des sockets à la main : HTTP, gRPC, un client de base de données ou de messagerie le
    font pour nous.

  **Piège classique** : supposer qu'un `read` reçoit exactement un message envoyé par un `write`. TCP peut couper ou
  regrouper les envois : sans protocole de découpage, les messages se mélangent.

  **En entretien** : « TCP : connexion fiable et ordonnée, en flux d'octets, à découper en messages ; UDP : des paquets
  sans garantie. Toujours des délais, et un thread virtuel par connexion pour un serveur simple. »
cards:
  - key: tcp-udp
    format: course
    question: Quelle différence entre TCP et UDP ?
    choices:
      - {text: "TCP offre un flux fiable et ordonné ; UDP envoie des paquets sans connexion ni garantie", correct: true}
      - {text: "UDP offre un flux fiable et ordonné ; TCP envoie des paquets sans connexion ni garantie", correct: false}
      - {text: "TCP sert au Web et UDP aux fichiers ; les deux garantissent l'arrivée et l'ordre", correct: false}
      - {text: "TCP chiffre les données échangées ; UDP les envoie en clair, d'où sa légèreté", correct: false}
    answer: |-
      TCP établit une connexion fiable et ordonnée (un flux d'octets) ; UDP envoie des paquets indépendants, sans connexion
      ni garantie d'arrivée ou d'ordre, mais plus légers. Aucun des deux ne chiffre : c'est le rôle de TLS.
  - key: decoupage
    format: course
    question: Pourquoi faut-il un protocole de découpage sur TCP ?
    choices:
      - {text: "TCP transporte un flux d'octets sans frontière : des envois peuvent être coupés ou regroupés", correct: true}
      - {text: "TCP limite chaque message à 1 500 octets : au-delà, il faut le découper soi-même", correct: false}
      - {text: "TCP perd parfois des paquets : le découpage permet de renvoyer ceux qui manquent", correct: false}
      - {text: "TCP mélange l'ordre des messages : le découpage permet de les remettre dans l'ordre", correct: false}
    answer: |-
      Parce que TCP transporte un flux d'octets sans frontière de message ; des envois peuvent être coupés ou regroupés,
      d'où un séparateur (une ligne par message) ou une longueur en tête. TCP garantit pourtant l'arrivée et l'ordre.
  - key: delais
    format: course
    question: Quels délais régler sur une socket cliente ?
    choices:
      - {text: "Le délai de connexion et le délai de lecture, `setSoTimeout`", correct: true}
      - {text: "Seulement le délai de connexion : une lecture finit toujours", correct: false}
      - {text: "Seulement `setSoTimeout`, qui couvre aussi la connexion", correct: false}
      - {text: "Aucun : le système coupe une socket inactive après 30 s", correct: false}
    answer: |-
      Le délai de connexion (`connect(adresse, délai)`) et le délai de lecture (`setSoTimeout`), pour qu'une connexion ou
      une lecture ne bloque pas indéfiniment. Par défaut, une lecture peut attendre pour toujours.
  - key: serveur
    format: course
    question: Comment servir plusieurs clients sur un `ServerSocket` ?
    choices:
      - {text: "Boucler sur `accept()` et traiter chaque connexion dans son propre thread, virtuel de préférence", correct: true}
      - {text: "Boucler sur `accept()` et traiter chaque client dans le thread de la boucle, l'un après l'autre", correct: false}
      - {text: "Appeler `accept()` une seule fois : la socket renvoyée est partagée par tous les clients", correct: false}
      - {text: "Créer un `ServerSocket` par client, tous ouverts sur le même port que le premier", correct: false}
    answer: |-
      Boucler sur `accept()` et traiter chaque connexion dans son propre thread (un thread virtuel convient), ou utiliser
      NIO et un `Selector` pour un très grand nombre de connexions. Traiter dans la boucle bloquerait les autres clients.
  - key: vf-udp-ordre
    format: true-false
    question: UDP garantit que les paquets arrivent dans l'ordre d'envoi.
    truth: false
    answer: Ni l'ordre ni l'arrivée ne sont garantis.
  - key: vf-un-read
    format: true-false
    question: Sur TCP, chaque `read` reçoit exactement les octets d'un `write` de l'autre côté.
    truth: false
    answer: Les envois peuvent être coupés ou regroupés.
  - key: vf-accept
    format: true-false
    question: "`ServerSocket.accept()` bloque jusqu'à l'arrivée d'une connexion."
    truth: true
    answer: Il renvoie une `Socket` pour dialoguer avec ce client.
  - key: vf-so-timeout
    format: true-false
    question: Sans `setSoTimeout`, une lecture sur une socket peut bloquer indéfiniment.
    truth: true
    answer: Avec un délai, elle lève une `SocketTimeoutException`.
  - key: qcm-usages-udp
    format: multiple-choice
    question: "Pour lequel de ces usages UDP est-il adapté ?"
    choices:
      - {text: "L'envoi de métriques, où perdre un paquet est acceptable", correct: true}
      - {text: "Un virement bancaire entre deux services", correct: false}
      - {text: "Le transfert d'un fichier qui doit arriver intact, sans protocole supplémentaire", correct: false}
      - {text: "Le chargement d'une page Web en HTTP/1.1", correct: false}
    answer: |-
      UDP convient quand la perte est tolérable et la légèreté prime (les requêtes DNS aussi). Un virement ou un fichier
      exigent la fiabilité de TCP, sur lequel repose HTTP/1.1.
  - key: qcm-decoupage
    format: multiple-choice
    question: "Laquelle de ces méthodes délimite correctement les messages sur une connexion TCP ?"
    choices:
      - {text: "La longueur du message en tête, puis le contenu", correct: true}
      - {text: "Un `write` par message, sans rien d'autre", correct: false}
      - {text: "Un `flush` après chaque message envoyé", correct: false}
      - {text: "Une pause entre deux messages", correct: false}
    answer: |-
      TCP ne conserve pas les frontières des écritures : il faut les écrire dans les données, par une longueur en tête ou
      un séparateur (un message par ligne). Ni un `write`, ni un `flush`, ni une pause n'en créent.
  - key: qcm-haute-perf
    format: multiple-choice
    question: "Pour un serveur de 100 000 connexions simultanées, lesquelles de ces approches tiennent ?"
    choices:
      - text: "Un thread virtuel par connexion"
        correct: true
      - text: "NIO avec un `Selector` (ou Netty)"
        correct: true
      - text: "Un thread de plateforme par connexion"
        correct: false
      - text: "Une seule connexion à la fois"
        correct: false
    answer: 100 000 threads de plateforme épuiseraient la mémoire.
  - key: qcm-pratique
    format: multiple-choice
    question: Dans une application métier, quand écrire des sockets à la main ?
    choices:
      - {text: "Rarement, pour un protocole spécifique sans bibliothèque existante", correct: true}
      - {text: "Pour chaque appel HTTP, afin de maîtriser chaque octet envoyé", correct: false}
      - {text: "Pour accéder à la base de données, sans passer par un pilote", correct: false}
      - {text: "Toujours, car les bibliothèques réseau sont trop lentes", correct: false}
    answer: HTTP, gRPC et les pilotes gèrent déjà ces détails.
