notion: serialisation-dangers
lesson: |-
  La désérialisation native (`ObjectInputStream.readObject`) **instancie n'importe quelle classe sérialisable du
  classpath** désignée par le flux, et appelle ses méthodes `readObject`, `readResolve`... Un attaquant qui contrôle les
  octets peut enchaîner des classes existantes (des *gadget chains*, dans Commons Collections, Spring, etc.) pour
  **exécuter du code** sur le serveur. Ces failles ont touché Jenkins, WebLogic, JBoss et bien d'autres.

  Autres risques :
  - un **déni de service** : un petit flux qui décrit un graphe énorme (des ensembles imbriqués) épuise la mémoire ou le
    CPU ;
  - des **invariants contournés** : le constructeur n'est pas appelé ;
  - un **couplage** fort : le format dépend des classes Java et de leurs versions, les deux côtés doivent évoluer
    ensemble, et seul Java peut le lire.

  Les parades :
  - **ne jamais désérialiser des données non fiables** (requêtes, fichiers téléversés, messages externes) ;
  - si c'est inévitable, un **`ObjectInputFilter`** (Java 9, filtre global depuis Java 17 avec
    `jdk.serialFilter`) avec une **liste blanche** des classes attendues et des limites (profondeur, taille) ;
  - et surtout, des **formats de données** sans exécution de code :
    - **JSON** (Jackson) : lisible, universel ; attention à ne pas activer le typage polymorphe par défaut, qui
      réintroduit le même risque ;
    - **Protobuf**, **Avro** : binaires, compacts, à **schéma** avec des règles d'évolution compatibles.

  Même Oracle décrit la sérialisation comme une erreur de conception, et le projet Amber réfléchit à une alternative.

  **Piège classique** : désérialiser un cookie, un paramètre ou un message Base64 « parce qu'il vient de notre propre
  application ». Un attaquant peut le forger.

  **En entretien** : « La désérialisation native peut exécuter du code via des gadget chains : jamais sur des données non
  fiables ; sinon un `ObjectInputFilter` en liste blanche. Pour échanger, JSON ou Protobuf, avec un contrat explicite. »
cards:
  - key: deserialisation-java-dangereuse
    format: course
    question: Pourquoi la désérialisation Java est-elle dangereuse ?
    choices:
      - {text: "Un flux malveillant peut enchaîner des classes du classpath et exécuter du code", correct: true}
      - {text: "Elle est lente et gourmande en mémoire, mais sans vrai risque de sécurité", correct: false}
      - {text: "Elle désactive les contrôles d'accès de la JVM pendant toute la lecture", correct: false}
      - {text: "Elle laisse le flux ouvert, ce qui finit par épuiser les descripteurs", correct: false}
    answer: |-
      Des données malveillantes peuvent déclencher des gadget chains et exécuter du code ; parade : ne pas désérialiser de
      données non fiables, et filtrer les classes avec un `ObjectInputFilter`.
  - key: protobuf-vs-json
    format: course
    question: "Quelle différence entre Protobuf et JSON ?"
    choices:
      - {text: "Protobuf est binaire, compact et à schéma ; JSON est textuel, lisible et sans schéma imposé", correct: true}
      - {text: "Protobuf est textuel et lisible ; JSON est binaire, compact et à schéma imposé", correct: false}
      - {text: "Protobuf est propre à Java ; JSON est le seul format compris par tous les langages", correct: false}
      - {text: "Protobuf n'a pas de schéma ; JSON exige un schéma déclaré avant chaque échange", correct: false}
    answer: |-
      Protobuf est binaire, compact, rapide, avec un schéma et un contrat fort ; JSON est textuel, lisible, universel, sans
      schéma imposé. Protobuf génère du code pour de nombreux langages, pas seulement Java.
  - key: gadget-chain
    format: course
    question: Qu'est-ce qu'une gadget chain ?
    choices:
      - {text: "Un enchaînement de classes du classpath dont les méthodes, appelées à la lecture, mènent à une action dangereuse", correct: true}
      - {text: "Une classe malveillante glissée dans le flux, que la JVM charge puis exécute pendant la lecture", correct: false}
      - {text: "Une suite d'objets qui se référencent en boucle, et font tomber la JVM en `StackOverflowError`", correct: false}
      - {text: "Une chaîne de proxys réseau qui relaie la requête d'un attaquant jusqu'au serveur visé", correct: false}
    answer: |-
      Un enchaînement de classes déjà présentes sur le classpath, dont les méthodes appelées pendant la désérialisation
      finissent par exécuter une action dangereuse (commande système, chargement de classe). Le flux ne contient pas de
      code : seulement des données qui orchestrent du code existant.
  - key: filtre
    format: course
    question: À quoi sert un `ObjectInputFilter` ?
    choices:
      - {text: "À n'accepter que des classes autorisées, et à limiter profondeur, nombre d'objets et tailles", correct: true}
      - {text: "À chiffrer le flux sérialisé, pour qu'un attaquant ne puisse ni le lire ni le modifier", correct: false}
      - {text: "À retirer les champs `transient` des objets, juste avant leur écriture dans le flux", correct: false}
      - {text: "À vérifier la signature du flux, pour refuser tout flux modifié depuis son écriture", correct: false}
    answer: |-
      À n'accepter, pendant la désérialisation, que des classes autorisées (liste blanche) et à limiter la profondeur, le
      nombre d'objets et la taille des tableaux. Il ne chiffre ni ne signe rien.
  - key: vf-propre-appli
    format: true-false
    question: Désérialiser un cookie sans danger est possible s'il a été produit par notre propre application.
    truth: false
    answer: Le client peut le modifier ou le forger.
  - key: vf-filtre-global
    format: true-false
    question: Un filtre de désérialisation global peut être configuré avec la propriété `jdk.serialFilter`.
    truth: true
    answer: Et par une fabrique de filtres depuis Java 17.
  - key: vf-json-polymorphe
    format: true-false
    question: Activer le typage polymorphe par défaut de Jackson sur des données non fiables est sans risque.
    truth: false
    answer: Il permet d'instancier des classes choisies par le flux, comme la désérialisation native.
  - key: vf-dos
    format: true-false
    question: Un petit flux sérialisé peut provoquer un déni de service à la désérialisation.
    truth: true
    answer: Par exemple des ensembles imbriqués dont le calcul des `hashCode` explose.
  - key: qcm-parades
    format: multiple-choice
    question: "Quelle mesure réduit le risque de la désérialisation Java ?"
    choices:
      - {text: "Un `ObjectInputFilter` en liste blanche", correct: true}
      - {text: "Chiffrer les classes du classpath", correct: false}
      - {text: "Désérialiser dans un thread séparé", correct: false}
      - {text: "Un `serialVersionUID` sur chaque classe", correct: false}
    answer: |-
      Une liste blanche refuse toute classe imprévue, donc les gadgets. Le mieux reste de ne pas désérialiser de données
      venues de l'extérieur, et de ne pas utiliser ce format pour des échanges.
  - key: qcm-formats
    format: multiple-choice
    question: "Lesquels de ces formats n'exécutent pas de code à la lecture ?"
    choices:
      - text: "JSON lu en types déclarés (DTO, records)"
        correct: true
      - text: "Protobuf"
        correct: true
      - text: "La sérialisation Java native"
        correct: false
      - text: "JSON avec typage polymorphe par défaut activé"
        correct: false
    answer: Ce sont les types déclarés par le code, pas par le flux, qui sont instanciés.
  - key: qcm-schema
    format: multiple-choice
    question: "Quel atout Protobuf et Avro ont-ils sur JSON ?"
    choices:
      - {text: "Un schéma explicite, avec des règles d'évolution compatibles", correct: true}
      - {text: "Un format lisible par un humain, sans aucun outil", correct: false}
      - {text: "L'absence de tout contrat entre les deux systèmes", correct: false}
      - {text: "Une lecture native par tous les navigateurs, sans bibliothèque", correct: false}
    answer: |-
      Un schéma explicite avec des règles d'évolution compatibles, et un format binaire compact et rapide. JSON reste plus
      lisible et universel.
  - key: qcm-surface
    format: multiple-choice
    question: Pourquoi le risque dépend-il des bibliothèques présentes sur le classpath ?
    choices:
      - text: "Les gadget chains utilisent des classes existantes"
        correct: true
      - text: "Parce que les bibliothèques désactivent la sérialisation"
        correct: false
      - text: "Parce qu'elles chiffrent les flux"
        correct: false
      - text: "Il n'en dépend pas"
        correct: false
    answer: Plus le classpath est riche, plus il y a de gadgets potentiels.
  - key: service-historique-echange-objets-java
    format: scenario
    question: Un service historique échange des objets Java sérialisés avec un autre système. Qu'en penses-tu ?
    choices:
      - {text: "Risque d'exécution de code et couplage aux classes : un filtre en liste blanche, puis un format à contrat", correct: true}
      - {text: "Aucun problème tant que les deux systèmes sont en Java, avec la même version des classes", correct: false}
      - {text: "Un problème de performance seulement : il suffit de compresser le flux sérialisé", correct: false}
      - {text: "Un risque, que le chiffrement TLS du lien entre les deux systèmes suffit à écarter", correct: false}
    answer: |-
      Deux problèmes. **Sécurité** : si les données peuvent venir d'une source non maîtrisée, la désérialisation native est une porte d'entrée pour l'exécution de code à distance. **Couplage** : le format est lié aux classes Java et à leurs versions, donc les deux systèmes doivent évoluer ensemble.
      À court terme, je mettrais un `ObjectInputFilter` avec une liste blanche des classes attendues. À moyen terme, je migrerais vers un format à **contrat explicite** : JSON avec un schéma documenté, ou Protobuf/Avro si la performance compte, ce qui découple les deux systèmes et permet des évolutions compatibles.
  - key: scenario-audit
    format: scenario
    question: Lors d'un audit, comment repères-tu les risques de désérialisation dans une base de code ?
    choices:
      - {text: "Je cherche `ObjectInputStream`, `readObject` et le typage polymorphe, et d'où viennent leurs données", correct: true}
      - {text: "Je cherche les classes qui implémentent `Serializable`, et je leur retire toutes cette interface", correct: false}
      - {text: "Je cherche les `serialVersionUID` manquants, seule cause des failles de désérialisation", correct: false}
      - {text: "Je lance les tests unitaires : une faille de désérialisation fait échouer au moins un test", correct: false}
    answer: |-
      Je cherche les `ObjectInputStream`, `readObject`, `XMLDecoder`, et les configurations de bibliothèques qui
      désérialisent des types choisis par les données (typage polymorphe par défaut de Jackson, XStream, sérialiseurs de
      cache ou de session, RMI, JMX). Pour chacun, je regarde d'où viennent les données (réseau, fichier téléversé,
      cookie, file de messages). J'ajoute un filtre global `jdk.serialFilter` restrictif, j'utilise un analyseur de
      dépendances pour les bibliothèques connues pour leurs gadgets, et je planifie le remplacement par JSON ou Protobuf.
  - key: scenario-cache
    format: scenario
    question: Un cache distribué (Redis) stocke des objets en sérialisation Java. Que proposes-tu ?
    choices:
      - {text: "Passer à un format de données (JSON avec des DTO, ou binaire à schéma), avec des clés versionnées", correct: true}
      - {text: "Garder la sérialisation Java, et ajouter un `serialVersionUID` à chaque classe mise en cache", correct: false}
      - {text: "Garder la sérialisation Java, et chiffrer chaque valeur avant de la stocker dans Redis", correct: false}
      - {text: "Garder la sérialisation Java, et protéger l'accès à Redis par un mot de passe plus long", correct: false}
    answer: |-
      De passer à un format de données, typiquement JSON avec des DTO ou des records dédiés au cache, ou un format
      binaire à schéma. On y gagne : plus de risque d'exécution de code si Redis est compromis ou mal protégé, la
      compatibilité entre versions (un champ ajouté ne casse rien), la lisibilité pour déboguer, et la possibilité de lire
      le cache depuis un autre langage. Je versionne les clés (`profil:v2:42`) pour migrer sans casser les instances qui
      tournent encore avec l'ancien format.
  - key: scenario-session
    format: scenario
    question: Un framework stocke la session de l'utilisateur, sérialisée en Java et encodée en Base64, dans un cookie. Quel est le risque, et comment le traiter ?
    choices:
      - {text: "Le client peut forger le flux et exécuter du code : session côté serveur, ou JSON signé", correct: true}
      - {text: "Le client peut lire le cookie : il suffit de l'encoder une seconde fois en Base64", correct: false}
      - {text: "Le cookie peut dépasser 4 Ko : il suffit de compresser la session avant de l'encoder", correct: false}
      - {text: "Le cookie peut expirer : il suffit d'allonger sa durée de vie pour garder la session", correct: false}
    answer: |-
      Le cookie est sous le contrôle du client : un attaquant peut le remplacer par un flux forgé et obtenir une exécution
      de code à la désérialisation. Je supprimerais ce mécanisme : la session reste côté serveur, et le cookie ne contient
      qu'un identifiant aléatoire ; ou bien le cookie contient des données en JSON signées (un JWT, ou une signature HMAC
      vérifiée avant toute lecture). Si la migration prend du temps, j'ajoute immédiatement une signature et un
      `ObjectInputFilter` strict en liste blanche.
