notion: serialisation-dangers
cards:
  - key: deserialisation-java-dangereuse
    format: course
    question: Pourquoi la désérialisation Java est-elle dangereuse ?
    answer: 'Des données malveillantes peuvent déclencher des gadget chains et exécuter du code ; parade : ne pas désérialiser de données non fiables, ObjectInputFilter.'
  - key: protobuf-vs-json
    format: course
    question: Protobuf vs JSON ?
    answer: Binaire compact, rapide, à schéma et contrat fort vs texte lisible, universel, sans schéma imposé.
  - key: service-historique-echange-objets-java
    format: scenario
    question: Un service historique échange des objets Java sérialisés avec un autre système. Qu'en penses-tu ?
    answer: |-
      Deux problèmes. **Sécurité** : si les données peuvent venir d'une source non maîtrisée, la désérialisation native est une porte d'entrée pour l'exécution de code à distance. **Couplage** : le format est lié aux classes Java et à leurs versions, donc les deux systèmes doivent évoluer ensemble.
      À court terme, je mettrais un `ObjectInputFilter` avec une liste blanche des classes attendues. À moyen terme, je migrerais vers un format à **contrat explicite** : JSON avec un schéma documenté, ou Protobuf/Avro si la performance compte, ce qui découple les deux systèmes et permet des évolutions compatibles.
