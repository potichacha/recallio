notion: serialisation-java
lesson: |-
  La **sérialisation Java** transforme un objet (et tout ce qu'il référence) en octets, et inversement :

  ```java
  record Point(int x, int y) implements Serializable {}

  class Session implements Serializable {
      private static final long serialVersionUID = 1L;   // version de la forme sérialisée
      private String utilisateur;
      private transient Connexion connexion;             // exclu : ne se sérialise pas
  }

  try (var out = new ObjectOutputStream(Files.newOutputStream(fichier))) {
      out.writeObject(session);
  }
  try (var in = new ObjectInputStream(Files.newInputStream(fichier))) {
      Session s = (Session) in.readObject();
  }
  ```

  Règles :
  - la classe implémente l'interface marqueur **`Serializable`** ; tous les champs non `transient` doivent être
    sérialisables, sinon `NotSerializableException` ;
  - **`transient`** exclut un champ (il revient à sa valeur par défaut : `null`, 0, `false`) ; les champs **`static`** ne
    sont jamais sérialisés ;
  - **`serialVersionUID`** identifie la version de la classe : s'il diffère entre l'écriture et la lecture,
    `InvalidClassException`. Sans déclaration, il est **calculé** à partir de la structure de la classe et change au
    moindre ajout de méthode : on le déclare explicitement ;
  - à la désérialisation, le **constructeur** de la classe n'est **pas** appelé (seul celui du premier parent non
    sérialisable l'est), donc ses validations sont contournées ; les **records** font exception : ils passent toujours
    par leur constructeur canonique ;
  - `writeObject`/`readObject` privés personnalisent le format, `readResolve` remplace l'objet lu (singletons) ;
    `Externalizable` donne un contrôle total.

  La sérialisation native est **dangereuse** sur des données non fiables et **couplée** aux classes Java : on lui préfère
  JSON ou Protobuf pour les échanges et le stockage.

  **Piège classique** : sérialiser des objets dans un cache distribué sans `serialVersionUID`. Après un déploiement qui
  ajoute un champ, tous les objets en cache deviennent illisibles (`InvalidClassException`).

  **En entretien** : « `Serializable`, `transient` pour exclure, `serialVersionUID` à déclarer ; le constructeur n'est pas
  appelé, sauf pour les records. Et pour échanger des données, je préfère JSON ou Protobuf. »
cards:
  - key: role-serialversionuid
    format: course
    question: "À quoi sert le `serialVersionUID` d'une classe sérialisable ?"
    choices:
      - {text: "À identifier la version de la classe : s'il diffère, la désérialisation échoue", correct: true}
      - {text: "À numéroter chaque objet sérialisé, pour repérer les doublons dans un flux", correct: false}
      - {text: "À chiffrer le flux sérialisé, la valeur du champ servant de clé", correct: false}
      - {text: "À fixer l'ordre des champs dans le flux, du plus petit numéro au plus grand", correct: false}
    answer: |-
      Il identifie la version de la classe sérialisée ; s'il diffère entre l'écriture et la lecture, la désérialisation
      échoue (`InvalidClassException`). Sans déclaration, il est calculé à partir de la classe.
  - key: transient
    format: course
    question: "Que fait le mot-clé `transient` sur un champ ?"
    choices:
      - {text: "Il exclut le champ de la sérialisation", correct: true}
      - {text: "Il rend le champ visible des autres threads", correct: false}
      - {text: "Il interdit de modifier le champ après construction", correct: false}
      - {text: "Il chiffre le champ dans le flux sérialisé", correct: false}
    answer: |-
      Il exclut le champ de la sérialisation : à la lecture, il prend sa valeur par défaut (`null`, 0). La visibilité
      entre threads, c'est `volatile` ; l'interdiction de modifier, `final`.
  - key: champs-static-sont-ils-serialises
    format: course
    question: "Les champs `static` sont-ils sérialisés ?"
    choices:
      - {text: "Non : ils appartiennent à la classe, pas à l'objet", correct: true}
      - {text: "Oui : ils sont écrits une seule fois, en tête du flux", correct: false}
      - {text: "Oui, mais seulement s'ils sont aussi `final`", correct: false}
      - {text: "Non, sauf s'ils sont annotés `@Serial`", correct: false}
    answer: |-
      Non : un champ `static` appartient à la classe, pas à l'objet sérialisé. Après lecture, il garde la valeur courante
      de la classe dans la JVM qui lit.
  - key: constructeur-appele-deserialisation
    format: course
    question: Le constructeur est-il appelé à la désérialisation ?
    choices:
      - {text: "Non pour la classe sérialisable ; seul celui du premier parent non sérialisable l'est", correct: true}
      - {text: "Oui : le constructeur sans argument de la classe, qui doit donc exister", correct: false}
      - {text: "Oui : le constructeur de la classe, appelé avec les valeurs lues dans le flux", correct: false}
      - {text: "Non : aucun constructeur n'est appelé, ni de la classe ni de ses parents", correct: false}
    answer: |-
      Non pour la classe sérialisable ; seul le constructeur sans argument du premier parent non sérialisable l'est (celui
      d'`Object`, au pire). Un record fait exception : il passe par son constructeur canonique.
  - key: preserver-singleton-serialisable
    format: course
    question: "Comment préserver un singleton sérialisable ?"
    choices:
      - {text: "Avec `readResolve`, qui renvoie l'instance unique, ou avec une enum", correct: true}
      - {text: "Avec un constructeur `private`, que la lecture ne peut pas appeler", correct: false}
      - {text: "Avec un champ `INSTANCE` `transient`, pour qu'il ne soit pas copié", correct: false}
      - {text: "Avec un `serialVersionUID` fixe, qui désigne l'instance existante", correct: false}
    answer: |-
      Avec une méthode `readResolve` qui renvoie l'instance unique, ou en utilisant une enum. Le constructeur `private` ne
      protège de rien : la désérialisation ne l'appelle pas.
  - key: serializable-vs-externalizable
    format: course
    question: "Quelle différence entre `Serializable` et `Externalizable` ?"
    choices:
      - {text: "`Serializable` est automatique ; `Externalizable` donne le contrôle total, avec un constructeur public sans argument", correct: true}
      - {text: "`Externalizable` est automatique ; `Serializable` exige d'écrire `writeExternal` et `readExternal` soi-même", correct: false}
      - {text: "`Serializable` écrit du binaire ; `Externalizable` écrit du JSON, lisible par les autres langages", correct: false}
      - {text: "`Serializable` sert aux classes ; `Externalizable` est réservé aux records et aux enums", correct: false}
    answer: |-
      `Serializable` sérialise automatiquement ; `Externalizable` donne le contrôle total via `writeExternal` et
      `readExternal`, et exige un constructeur public sans argument, appelé à la lecture.
  - key: vf-champ-non-serialisable
    format: true-false
    question: Un champ d'un type non sérialisable (et non `transient`) fait échouer la sérialisation.
    truth: true
    answer: '`NotSerializableException`.'
  - key: vf-transient-valeur
    format: true-false
    question: Après désérialisation, un champ `transient` garde la valeur qu'il avait avant la sérialisation.
    truth: false
    answer: Il revient à sa valeur par défaut (`null`, 0, `false`).
  - key: vf-uid-calcule
    format: true-false
    question: Sans `serialVersionUID` déclaré, ajouter une méthode à la classe peut rendre illisibles les anciens objets sérialisés.
    truth: true
    answer: L'identifiant calculé change avec la structure de la classe.
  - key: vf-record
    format: true-false
    question: La désérialisation d'un record passe par son constructeur canonique.
    truth: true
    answer: Ses validations s'appliquent donc aussi aux données lues.
  - key: qcm-exclus
    format: multiple-choice
    question: "Lesquels de ces champs ne sont pas sérialisés ?"
    choices:
      - text: "Les champs `transient`"
        correct: true
      - text: "Les champs `static`"
        correct: true
      - text: "Les champs `private`"
        correct: false
      - text: "Les champs `final`"
        correct: false
    answer: La visibilité et `final` ne changent rien.
  - key: qcm-uid
    format: multiple-choice
    question: Quelle exception signale un `serialVersionUID` différent à la lecture ?
    choices:
      - text: "`InvalidClassException`"
        correct: true
      - text: "`ClassNotFoundException`"
        correct: false
      - text: "`NotSerializableException`"
        correct: false
      - text: "`ClassCastException`"
        correct: false
    answer: '`ClassNotFoundException` signale une classe absente.'
  - key: qcm-alternatives
    format: multiple-choice
    question: "Quel choix préférer à la sérialisation Java pour échanger des données entre services ?"
    choices:
      - {text: "Un format à contrat explicite, comme JSON documenté ou Protobuf", correct: true}
      - {text: "`ObjectOutputStream` sur le réseau, avec un `serialVersionUID` fixe", correct: false}
      - {text: "Un tableau d'octets recopié tel quel depuis la mémoire", correct: false}
      - {text: "`XMLEncoder`, qui sérialise les beans Java en XML", correct: false}
    answer: |-
      Des formats à contrat explicite, indépendants des classes Java : JSON avec un contrat documenté, ou Protobuf et Avro
      avec un schéma. `XMLEncoder` reste lié aux classes, et sa lecture (`XMLDecoder`) peut exécuter du code.
  - key: qcm-constructeur
    format: multiple-choice
    question: Une classe valide ses champs dans son constructeur. Que se passe-t-il à la désérialisation ?
    choices:
      - text: "La validation est contournée, sauf si `readObject` la refait"
        correct: true
      - text: "La validation s'exécute normalement"
        correct: false
      - text: "La désérialisation échoue toujours"
        correct: false
      - text: "Le constructeur sans argument est appelé"
        correct: false
    answer: Le constructeur de la classe sérialisable n'est pas appelé (les records font exception).
  - key: code-transient
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Session implements Serializable {
          String utilisateur = "ada";
          transient String jeton = "secret";
          transient int essais = 3;
      }
      ByteArrayOutputStream octets = new ByteArrayOutputStream();
      try (var out = new ObjectOutputStream(octets)) { out.writeObject(new Session()); }
      try (var in = new ObjectInputStream(new ByteArrayInputStream(octets.toByteArray()))) {
          Session s = (Session) in.readObject();
          System.out.println(s.utilisateur + " " + s.jeton + " " + s.essais);
      }
      ```
    choices:
      - {text: "`ada null 0`", correct: true}
      - {text: "`ada secret 3`", correct: false}
      - {text: "`ada null 3`", correct: false}
      - {text: "`null null 0`", correct: false}
    answer: '`ada null 0` : les champs `transient` reviennent à leur valeur par défaut, et l''initialiseur n''est pas exécuté.'
    check:
      output: "ada null 0"
  - key: code-non-serialisable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Connexion {}
      class Panier implements Serializable { Connexion c = new Connexion(); }
      try (var out = new ObjectOutputStream(new ByteArrayOutputStream())) {
          out.writeObject(new Panier());
      }
      ```
    choices:
      - {text: "Une `NotSerializableException`", correct: true}
      - {text: "Une `InvalidClassException`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "Une `NotSerializableException` : le champ `Connexion` n'est pas sérialisable."
    check:
      throws: NotSerializableException
  - key: code-record
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Point(int x, int y) implements Serializable {}
      ByteArrayOutputStream octets = new ByteArrayOutputStream();
      try (var out = new ObjectOutputStream(octets)) { out.writeObject(new Point(1, 2)); }
      try (var in = new ObjectInputStream(new ByteArrayInputStream(octets.toByteArray()))) {
          Object o = in.readObject();
          System.out.println(o + " " + o.equals(new Point(1, 2)));
      }
      ```
    choices:
      - {text: "`Point[x=1, y=2] true`", correct: true}
      - {text: "`Point[x=1, y=2] false`", correct: false}
      - {text: "`Point(x=1, y=2) true`", correct: false}
      - {text: "`[1, 2] true`", correct: false}
    answer: "`Point[x=1, y=2] true` : le record est relu par son constructeur canonique, et `equals` compare les composants."
    check:
      output: "Point[x=1, y=2] true"
  - key: code-static
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Config implements Serializable {
          static int compteur = 0;
          int valeur = 5;
      }
      Config.compteur = 10;
      ByteArrayOutputStream octets = new ByteArrayOutputStream();
      try (var out = new ObjectOutputStream(octets)) { out.writeObject(new Config()); }
      Config.compteur = 99;
      try (var in = new ObjectInputStream(new ByteArrayInputStream(octets.toByteArray()))) {
          Config c = (Config) in.readObject();
          System.out.println(c.valeur + " " + Config.compteur);
      }
      ```
    choices:
      - {text: "`5 99`", correct: true}
      - {text: "`5 10`", correct: false}
      - {text: "`5 0`", correct: false}
      - {text: "`0 99`", correct: false}
    answer: '`5 99` : le champ `static` n''est pas sérialisé, il garde la valeur courante de la classe.'
    check:
      output: "5 99"
  - key: bug-uid
    format: bug-fix
    question: |-
      Après chaque déploiement, les sessions stockées dans le cache distribué deviennent illisibles. Quelle correction est la bonne ?
      ```java
      public class SessionUtilisateur implements Serializable {
          private String id;
          private List<String> roles;
      }
      ```
    choices:
      - {text: "Déclarer un `serialVersionUID` fixe dans la classe", correct: true}
      - {text: "Marquer le champ `roles` comme `transient`", correct: false}
      - {text: "Rendre les champs `id` et `roles` publics", correct: false}
      - {text: "Remplacer `List<String>` par `ArrayList<String>`", correct: false}
    answer: |-
      ```java
      public class SessionUtilisateur implements Serializable {
          @Serial private static final long serialVersionUID = 1L;
          private String id;
          private List<String> roles;
      }
      ```
      Sans `serialVersionUID`, il est calculé à partir de la classe et change à chaque modification. Le déclarer garde
      la compatibilité tant que les changements sont compatibles (mieux : stocker du JSON).
  - key: bug-connexion
    format: bug-fix
    question: |-
      La sérialisation de ce service échoue avec `NotSerializableException`. Quelle correction est la bonne ?
      ```java
      class Rapport implements Serializable {
          private List<Ligne> lignes;
          private DataSource source;      // ressource technique
      }
      ```
    choices:
      - {text: "Marquer `source` comme `transient`, et la réinjecter après lecture", correct: true}
      - {text: "Ajouter un `serialVersionUID`, qui rend tous les champs sérialisables", correct: false}
      - {text: "Marquer `source` comme `final`, pour qu'elle soit écrite une seule fois", correct: false}
      - {text: "Marquer `lignes` comme `transient`, car la liste n'est pas sérialisable", correct: false}
    answer: |-
      ```java
      class Rapport implements Serializable {
          @Serial private static final long serialVersionUID = 1L;
          private List<Ligne> lignes;
          private transient DataSource source;
      }
      ```
      Une ressource technique n'a pas à être sérialisée : `transient` l'exclut (il faudra la réinjecter après lecture).
      Mieux encore : ne sérialiser qu'un objet de données, sans dépendances.
  - key: bug-validation
    format: bug-fix
    question: |-
      Des objets `Montant` négatifs apparaissent après lecture d'un fichier, alors que le constructeur l'interdit. Quelle correction est la bonne ?
      ```java
      class Montant implements Serializable {
          private final long centimes;
          Montant(long c) { if (c < 0) throw new IllegalArgumentException(); centimes = c; }
      }
      ```
    choices:
      - {text: "En faire un record, qui valide dans son constructeur compact", correct: true}
      - {text: "Rendre le constructeur `public`, pour que la lecture l'appelle", correct: false}
      - {text: "Ajouter un `serialVersionUID`, pour verrouiller la classe", correct: false}
      - {text: "Marquer `centimes` comme `transient`, pour qu'il soit recalculé", correct: false}
    answer: |-
      ```java
      record Montant(long centimes) implements Serializable {
          Montant {
              if (centimes < 0) throw new IllegalArgumentException("montant négatif");
          }
      }
      ```
      La désérialisation d'une classe ordinaire contourne son constructeur. Un record passe toujours par son constructeur
      canonique (sinon, une méthode `readObject` doit refaire la validation).
  - key: bug-singleton
    format: bug-fix
    question: |-
      Après désérialisation, deux instances de ce « singleton » coexistent. Quelle correction est la bonne ?
      ```java
      class Registre implements Serializable {
          static final Registre INSTANCE = new Registre();
          private Registre() {}
      }
      ```
    choices:
      - {text: "En faire une enum, ou ajouter un `readResolve` qui renvoie `INSTANCE`", correct: true}
      - {text: "Marquer `INSTANCE` comme `transient`, pour qu'il ne soit jamais écrit", correct: false}
      - {text: "Ajouter un `serialVersionUID` fixe, qui garantit une seule instance", correct: false}
      - {text: "Déclarer `getInstance()` `synchronized`, en plus du constructeur privé", correct: false}
    answer: |-
      ```java
      enum Registre {
          INSTANCE;
      }
      // ou : @Serial private Object readResolve() { return INSTANCE; }
      ```
      La désérialisation crée un nouvel objet. Une enum garantit l'unicité (la JVM résout la constante), ou `readResolve`
      remplace l'objet lu par l'instance unique.
