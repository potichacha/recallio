notion: json-jackson
cards:
  - key: objectmapper-thread-safe
    format: course
    question: ObjectMapper est-il thread-safe ?
    answer: Oui une fois configuré ; il faut le réutiliser.
  - key: deserialiser-list-user-avec-jackson
    format: course
    question: Comment désérialiser une `List<User>` avec Jackson ?
    answer: Avec un TypeReference.
  - key: ignorer-champs-inconnus
    format: course
    question: Comment ignorer les champs inconnus ?
    answer: '`@JsonIgnoreProperties(ignoreUnknown = true)` ou désactiver FAIL_ON_UNKNOWN_PROPERTIES.'
  - key: change-avec-jackson-3
    format: course
    question: Qu'est-ce qui change avec Jackson 3 ?
    answer: Package tools.jackson, JsonMapper immuable par builder, exceptions unchecked, nouvelles valeurs par défaut ; défaut de Spring Boot 4.
