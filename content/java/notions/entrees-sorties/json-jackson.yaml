notion: json-jackson
lesson: |-
  **Jackson** est la bibliothèque JSON de référence en Java (utilisée par Spring Boot et Quarkus). Son point d'entrée est
  l'**`ObjectMapper`** (Jackson 2) ou le **`JsonMapper`** (Jackson 3, construit par un builder, immuable).

  ```java
  record Commande(String id, BigDecimal total, LocalDate date, List<String> articles) {}

  ObjectMapper mapper = JsonMapper.builder()
          .addModule(new JavaTimeModule())                      // dates java.time (intégré en Jackson 3)
          .disable(SerializationFeature.WRITE_DATES_AS_TIMESTAMPS)
          .disable(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES)
          .build();

  String json = mapper.writeValueAsString(commande);            // objet → JSON
  Commande c = mapper.readValue(json, Commande.class);          // JSON → objet
  List<Commande> liste = mapper.readValue(json, new TypeReference<List<Commande>>() {});
  JsonNode arbre = mapper.readTree(json);                       // JSON sans classe
  ```

  - Les **records** sont pris en charge directement : les composants deviennent les propriétés, et le constructeur
    canonique (avec ses validations) sert à la lecture.
  - Pour une classe ordinaire, Jackson utilise les **getters** et un constructeur sans argument avec des **setters** (ou
    un constructeur annoté `@JsonCreator`).
  - Les annotations ajustent le format : `@JsonProperty("nom_complet")`, `@JsonIgnore`,
    `@JsonInclude(NON_NULL)`, `@JsonFormat(pattern = "dd/MM/yyyy")`, `@JsonIgnoreProperties(ignoreUnknown = true)`.
  - À cause de l'effacement des types, une `List<Commande>` se lit avec un **`TypeReference`**.
  - L'`ObjectMapper` est **thread-safe** une fois configuré et **coûteux à créer** : un seul par application (un bean).
  - Les montants en `BigDecimal`, les dates en ISO-8601 (`2026-03-15`), les instants en UTC : c'est le contrat de l'API.
  - Jackson 3 (package `tools.jackson`) rend les exceptions non vérifiées et le mapper immuable ; c'est le défaut de
    Spring Boot 4.

  **Piège classique** : `new ObjectMapper()` à chaque requête. C'est lent (introspection des classes refaite à chaque
  fois) et la configuration de l'application (modules, formats) est perdue.

  **En entretien** : « Un `ObjectMapper` unique et configuré, des records ou des DTO dédiés, `TypeReference` pour les
  génériques, et un contrat explicite : dates ISO, montants décimaux, champs inconnus tolérés. »
cards:
  - key: objectmapper-thread-safe
    format: course
    question: "Un `ObjectMapper` de Jackson est-il thread-safe ?"
    choices:
      - {text: "Oui, une fois configuré : on le crée une fois et on le partage", correct: true}
      - {text: "Non : il faut en créer un nouveau pour chaque conversion", correct: false}
      - {text: "Non : il faut synchroniser chaque appel à `readValue`", correct: false}
      - {text: "Oui, mais seulement s'il est rangé dans un champ `static`", correct: false}
    answer: |-
      Oui, une fois configuré ; il faut le réutiliser, car il est coûteux à créer (il garde en cache ses sérialiseurs).
      Le reconfigurer pendant qu'il sert, en revanche, n'est pas sûr.
  - key: deserialiser-list-user-avec-jackson
    format: course
    question: Comment désérialiser une `List<User>` avec Jackson ?
    choices:
      - {text: "Avec un `TypeReference<List<User>>`, qui garde le type des éléments", correct: true}
      - {text: "Avec `List.class` : Jackson devine le type des éléments du tableau", correct: false}
      - {text: "Avec `List<User>.class`, la classe du type générique complet", correct: false}
      - {text: "Avec `ArrayList.class`, qui précise l'implémentation à créer", correct: false}
    answer: |-
      Avec un `TypeReference` : `mapper.readValue(json, new TypeReference<List<User>>() {})`. Avec `List.class`,
      l'effacement des types fait perdre `User`, et Jackson crée des `LinkedHashMap` ; `List<User>.class` ne compile pas.
  - key: ignorer-champs-inconnus
    format: course
    question: "Avec Jackson, comment ignorer les champs inconnus du JSON reçu ?"
    choices:
      - {text: "`@JsonIgnoreProperties(ignoreUnknown = true)`, ou désactiver `FAIL_ON_UNKNOWN_PROPERTIES`", correct: true}
      - {text: "`@JsonIgnore` sur la classe, qui écarte tout champ du JSON absent de la classe", correct: false}
      - {text: "`@JsonInclude(NON_NULL)` sur la classe, qui écarte les champs inconnus à la lecture", correct: false}
      - {text: "Rien : Jackson 2 ignore par défaut les champs inconnus, sans lever d'erreur", correct: false}
    answer: |-
      `@JsonIgnoreProperties(ignoreUnknown = true)` sur la classe, ou désactiver `FAIL_ON_UNKNOWN_PROPERTIES` sur le
      mapper. Par défaut, Jackson 2 lève une `UnrecognizedPropertyException` ; `@JsonIgnore` exclut une propriété connue.
  - key: change-avec-jackson-3
    format: course
    question: Qu'est-ce qui change avec Jackson 3 ?
    choices:
      - {text: "Le package `tools.jackson`, un `JsonMapper` immuable construit par builder, des exceptions non vérifiées", correct: true}
      - {text: "Le package `tools.jackson`, un `ObjectMapper` modifiable par setters, des exceptions toutes vérifiées", correct: false}
      - {text: "Le package `jakarta.json`, car Jackson 3 devient l'implémentation officielle de JSON-B", correct: false}
      - {text: "Le même package `com.fasterxml.jackson`, et la réflexion remplacée par un processeur d'annotations", correct: false}
    answer: |-
      Le package `tools.jackson`, un `JsonMapper` immuable construit par builder, des exceptions non vérifiées et de
      nouvelles valeurs par défaut. C'est la version par défaut de Spring Boot 4.
  - key: vf-records
    format: true-false
    question: Jackson sait sérialiser et désérialiser les records sans annotation.
    truth: true
    answer: Les composants sont les propriétés, le constructeur canonique sert à la lecture.
  - key: vf-nouveau-mapper
    format: true-false
    question: Créer un `ObjectMapper` à chaque appel est une bonne pratique pour éviter les problèmes de concurrence.
    truth: false
    answer: Il est thread-safe une fois configuré, et coûteux à créer.
  - key: vf-dates
    format: true-false
    question: Avec Jackson 2, un `LocalDate` se sérialise sans module supplémentaire.
    truth: false
    answer: Il faut le module `jackson-datatype-jsr310` (`JavaTimeModule`), intégré en Jackson 3.
  - key: vf-type-reference
    format: true-false
    question: "`mapper.readValue(json, List.class)` renvoie une liste d'objets `Commande`."
    truth: false
    answer: Une liste de `LinkedHashMap` ; il faut un `TypeReference<List<Commande>>`.
  - key: qcm-annotations
    format: multiple-choice
    question: "Laquelle de ces associations entre annotation Jackson et effet est juste ?"
    choices:
      - {text: "`@JsonProperty(\"nom_complet\")` : renomme la propriété dans le JSON", correct: true}
      - {text: "`@JsonInclude(NON_NULL)` : rend la propriété obligatoire", correct: false}
      - {text: "`@JsonFormat` : chiffre la valeur dans le JSON", correct: false}
      - {text: "`@JsonIgnore` : accepte les champs inconnus du JSON", correct: false}
    answer: |-
      `@JsonProperty` donne le nom de la propriété dans le JSON. `@JsonIgnore` exclut une propriété, `NON_NULL` omet les
      propriétés nulles, et `@JsonFormat` fixe un format (de date, par exemple).
  - key: qcm-dto
    format: multiple-choice
    question: "Quelle est la principale raison d'exposer des DTO (ou records) dédiés plutôt que les entités JPA en JSON ?"
    choices:
      - {text: "Le contrat de l'API reste stable quand le modèle de persistance évolue", correct: true}
      - {text: "Jackson ne sait pas sérialiser une classe annotée `@Entity`", correct: false}
      - {text: "Un DTO se sérialise sans réflexion, donc bien plus vite", correct: false}
      - {text: "Jackson n'accepte que des records depuis sa version 2.12", correct: false}
    answer: |-
      Le contrat de l'API ne dépend plus du schéma, et on n'expose ni champ interne ni relation chargée paresseusement.
      C'est aussi une règle du projet. Jackson sait très bien lire les entités : c'est justement le problème.
  - key: qcm-montant
    format: multiple-choice
    question: Comment représenter un montant dans un JSON d'API ?
    choices:
      - {text: "Un `BigDecimal` côté Java, et un nombre décimal ou une chaîne dans le JSON, selon le contrat", correct: true}
      - {text: "Un `double` côté Java, et un nombre décimal dans le JSON, arrondi à deux chiffres après la virgule", correct: false}
      - {text: "Un `float` côté Java, plus compact, et un nombre décimal dans le JSON, selon le contrat", correct: false}
      - {text: "Une chaîne libre des deux côtés, avec le symbole monétaire, comme `\"12,50 €\"`", correct: false}
    answer: |-
      Les flottants introduisent des erreurs d'arrondi (`0.1 + 0.2` ne vaut pas `0.3`) ; un `BigDecimal` garde la valeur
      exacte. Une chaîne libre avec le symbole oblige chaque client à l'analyser.
  - key: qcm-arbre
    format: multiple-choice
    question: Comment lire un champ d'un JSON dont on n'a pas la classe ?
    choices:
      - text: "`mapper.readTree(json).path(\"client\").path(\"email\").asText()`"
        correct: true
      - text: "`mapper.readValue(json, Object.class).email`"
        correct: false
      - text: "`json.split(\"email\")`"
        correct: false
      - text: "Ce n'est pas possible"
        correct: false
    answer: '`JsonNode` permet de naviguer dans l''arbre ; `path` ne renvoie jamais `null`.'
  - key: bug-mapper-par-appel
    format: bug-fix
    question: |-
      Le profilage montre beaucoup de temps passé dans la création de mappers, et les dates sortent mal formatées. Quelle correction est la bonne ?
      ```java
      String json = new ObjectMapper().writeValueAsString(reponse);
      ```
    choices:
      - {text: "Injecter et réutiliser le mapper déjà configuré de l'application", correct: true}
      - {text: "Garder un `new ObjectMapper()` par thread, dans un `ThreadLocal`", correct: false}
      - {text: "Remplacer `writeValueAsString` par `writeValueAsBytes`, plus rapide", correct: false}
      - {text: "Garder `new ObjectMapper()` et annoter chaque date de `@JsonFormat`", correct: false}
    answer: |-
      ```java
      private final ObjectMapper mapper;     // injecté : le mapper configuré de l'application

      String json = mapper.writeValueAsString(reponse);
      ```
      Un `ObjectMapper` est coûteux à créer et thread-safe une fois configuré. Le mapper de l'application porte aussi
      les modules et formats (dates ISO) que le mapper neuf n'avait pas.
  - key: bug-liste-brute
    format: bug-fix
    question: |-
      Ce code lève `ClassCastException: LinkedHashMap cannot be cast to Commande`. Quelle correction est la bonne ?
      ```java
      List<Commande> commandes = mapper.readValue(json, List.class);
      Commande premiere = commandes.get(0);
      ```
    choices:
      - {text: "Lire avec `new TypeReference<List<Commande>>() {}`", correct: true}
      - {text: "Lire avec `ArrayList.class` au lieu de `List.class`", correct: false}
      - {text: "Caster le résultat en `(List<Commande>)` avant usage", correct: false}
      - {text: "Ajouter `@JsonCreator` au constructeur de `Commande`", correct: false}
    answer: |-
      ```java
      List<Commande> commandes = mapper.readValue(json, new TypeReference<List<Commande>>() {});
      ```
      Avec `List.class`, Jackson ne connaît pas le type des éléments (effacement) et crée des maps. Le `TypeReference`
      conserve le type générique complet.
  - key: bug-champ-inconnu
    format: bug-fix
    question: |-
      Depuis que le partenaire a ajouté un champ à son API, toutes les lectures échouent avec `UnrecognizedPropertyException`. Quelle correction est la bonne ?
      ```java
      record Livraison(String id, String statut) {}
      ```
    choices:
      - {text: "Annoter le record de `@JsonIgnoreProperties(ignoreUnknown = true)`", correct: true}
      - {text: "Annoter le record de `@JsonInclude(JsonInclude.Include.NON_NULL)`", correct: false}
      - {text: "Annoter chaque composant du record de `@JsonProperty`", correct: false}
      - {text: "Remplacer le record par une classe mutable avec des setters", correct: false}
    answer: |-
      ```java
      @JsonIgnoreProperties(ignoreUnknown = true)
      record Livraison(String id, String statut) {}
      // ou, globalement : mapper.disable(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES)
      ```
      Un client doit tolérer les champs ajoutés par un fournisseur : c'est une évolution compatible de l'API.
  - key: bug-entite
    format: bug-fix
    question: |-
      Cet endpoint renvoie un JSON énorme (relations chargées en cascade), et parfois une boucle infinie. Quelle correction est la bonne ?
      ```java
      @GET public Client client(@PathParam("id") long id) { return em.find(Client.class, id); }   // entité JPA
      ```
    choices:
      - {text: "Renvoyer un record DTO dédié, construit à partir de l'entité", correct: true}
      - {text: "Passer toutes les relations de l'entité en `FetchType.EAGER`", correct: false}
      - {text: "Annoter l'endpoint de `@Transactional`, pour charger les relations", correct: false}
      - {text: "Augmenter la pile avec `-Xss`, pour que la récursion aboutisse", correct: false}
    answer: |-
      ```java
      record ClientDto(long id, String nom, String email) {
          static ClientDto de(Client c) { return new ClientDto(c.getId(), c.getNom(), c.getEmail()); }
      }

      @GET public ClientDto client(@PathParam("id") long id) { return ClientDto.de(repository.trouver(id)); }
      ```
      Une entité exposée sérialise ses relations (chargements paresseux, références circulaires). Un DTO dédié fixe le
      contrat de l'API.
  - key: scenario-contrat
    format: scenario
    question: "Tu conçois le format JSON d'une nouvelle API publique. Quel ensemble de règles fixes-tu ?"
    choices:
      - {text: "Des noms stables, des dates ISO-8601, des montants décimaux, et aucun champ retiré sans nouvelle version", correct: true}
      - {text: "Des dates en heure locale, des montants en `double`, et des champs renommés au fil des besoins", correct: false}
      - {text: "Des énumérations en entiers, `null` pour toute absence, et des clients stricts sur les champs inconnus", correct: false}
      - {text: "Le JSON des entités JPA tel quel, documenté après coup, pour ne pas dupliquer le modèle", correct: false}
    answer: |-
      Des noms de propriétés stables et cohérents (camelCase), des dates en ISO-8601 (`2026-03-15`, et les instants en
      UTC avec `Z`), des montants en décimal (ou en centimes entiers) avec la devise, des énumérations en chaînes, pas de
      `null` superflus (`NON_NULL`), des listes vides plutôt que `null`. Les clients doivent ignorer les champs inconnus,
      et moi ne jamais retirer ni renommer un champ sans nouvelle version (`/api/v2`). Les erreurs suivent RFC 9457
      (Problem Details). Le tout est documenté dans la spécification OpenAPI et testé (tests de contrat).
  - key: scenario-gros-json
    format: scenario
    question: Tu dois lire un fichier JSON de 5 Go contenant un tableau de millions d'objets. Comment, sans saturer la mémoire ?
    choices:
      - {text: "Lire en flux avec un `JsonParser` et `readValues`, un objet à la fois, traité par lots", correct: true}
      - {text: "Lire avec `readTree`, qui construit un arbre léger, puis parcourir ses nœuds un à un", correct: false}
      - {text: "Lire tout le tableau avec `readValue` dans une `List`, avec un `-Xmx` de 16 Go", correct: false}
      - {text: "Lire le fichier avec `Files.readString`, puis le découper en objets avec `split`", correct: false}
    answer: |-
      Pas de `readValue` sur tout le fichier. J'utilise l'API de flux de Jackson : un `JsonParser` positionné sur le début
      du tableau, puis `mapper.readValues(parser, Element.class)` (un `MappingIterator`), qui lit et construit les objets
      un par un. Je traite chaque élément au fil de l'eau (par lots pour une insertion en base), et je ferme le parseur
      dans un try-with-resources. La mémoire reste bornée par la taille d'un élément et d'un lot.
  - key: scenario-polymorphisme
    format: scenario
    question: Un message JSON peut décrire plusieurs types d'événements. Comment le désérialiser proprement et sans risque ?
    choices:
      - {text: "Un discriminant `type` et une liste fermée de sous-types, avec `@JsonTypeInfo` et `@JsonSubTypes`", correct: true}
      - {text: "Le typage polymorphe par défaut, qui écrit le nom de la classe Java dans chaque message", correct: false}
      - {text: "Un `Map<String, Object>` pour tout le message, puis des `instanceof` sur ses valeurs", correct: false}
      - {text: "Essayer chaque type avec `readValue`, l'un après l'autre, jusqu'au premier qui réussit", correct: false}
    answer: |-
      Avec un discriminant explicite et une liste fermée de types : une interface scellée `Evenement` dont chaque record
      est déclaré avec `@JsonTypeInfo(use = Id.NAME, property = "type")` et `@JsonSubTypes` (`commande_creee`,
      `paiement_recu`). Jackson n'instancie que les types listés, contrairement au typage polymorphe par défaut (qui
      laisse le flux choisir une classe, une faille connue). Côté code, un `switch` exhaustif sur l'interface scellée
      traite chaque type.
  - key: scenario-evolution
    format: scenario
    question: Un champ `adresse` (une chaîne) doit devenir un objet structuré dans l'API. Comment faire évoluer le contrat sans casser les clients ?
    choices:
      - {text: "Ajouter un champ objet à côté de l'ancien, déprécié, puis retirer l'ancien en `/api/v2`", correct: true}
      - {text: "Changer le type du champ `adresse` en objet, et prévenir les clients par courriel", correct: false}
      - {text: "Garder la chaîne `adresse`, et y ranger l'adresse structurée en JSON échappé", correct: false}
      - {text: "Retirer `adresse` et ajouter l'objet dans la même version, avec un journal des changements", correct: false}
    answer: |-
      J'ajoute un nouveau champ (`adresseDetaillee`, un objet) à côté de l'ancien, que je continue à remplir pendant une
      période de transition annoncée, et je le marque comme déprécié dans la documentation OpenAPI. Les clients migrent à
      leur rythme ; je mesure l'usage de l'ancien champ si possible. Une fois la période passée, je le retire dans une
      nouvelle version majeure de l'API (`/api/v2`), jamais silencieusement dans la version en cours.
