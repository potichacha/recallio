notion: watchservice
lesson: |-
  Le **`WatchService`** (Java 7) signale les changements dans un **dossier** : création, modification, suppression
  d'entrées.

  ```java
  try (WatchService watcher = FileSystems.getDefault().newWatchService()) {
      dossier.register(watcher, ENTRY_CREATE, ENTRY_MODIFY, ENTRY_DELETE);
      while (!Thread.currentThread().isInterrupted()) {
          WatchKey cle = watcher.take();                       // attend un événement
          for (WatchEvent<?> evt : cle.pollEvents()) {
              if (evt.kind() == OVERFLOW) continue;            // des événements ont été perdus
              Path nom = (Path) evt.context();                 // relatif au dossier surveillé
              traiter(evt.kind(), dossier.resolve(nom));
          }
          if (!cle.reset()) break;                             // le dossier n'est plus accessible
      }
  }
  ```

  Ses limites :
  - il surveille **un dossier**, pas ses sous-dossiers : il faut enregistrer chaque sous-dossier soi-même ;
  - le contexte d'un événement est un chemin **relatif** au dossier ;
  - il faut appeler **`reset()`** après chaque lot d'événements, sinon la clé ne reçoit plus rien ;
  - des événements peuvent être **regroupés ou perdus** (`OVERFLOW`) : on ne s'y fie pas comme à un journal exact ;
  - un fichier signalé « créé » peut être **encore en cours d'écriture** ;
  - selon le système, l'implémentation repose sur les notifications du noyau ou sur un **sondage** périodique (lent) ;
    sur les partages réseau (NFS, SMB), les notifications sont souvent absentes.

  Pour un traitement fiable (dépôt de fichiers), on combine le `WatchService` avec un **parcours périodique** de
  rattrapage, et un protocole de dépôt (fichier temporaire renommé une fois complet).

  **Piège classique** : oublier `cle.reset()`. Le premier événement est reçu, puis plus rien, sans erreur.

  **En entretien** : « `WatchService` signale les changements d'un dossier, pas de ses sous-dossiers ; il faut `reset()` la
  clé, gérer `OVERFLOW`, et ne pas s'y fier seul : un parcours de rattrapage reste nécessaire. »
cards:
  - key: definition
    format: course
    question: À quoi sert un `WatchService` ?
    choices:
      - {text: "À être notifié des créations, modifications et suppressions dans un dossier", correct: true}
      - {text: "À mesurer le temps d'exécution des méthodes d'un service, comme un chronomètre", correct: false}
      - {text: "À surveiller les threads d'un pool, et à relancer ceux qui restent bloqués", correct: false}
      - {text: "À recharger les classes modifiées pendant que l'application tourne", correct: false}
    answer: |-
      À être notifié des créations, modifications et suppressions d'entrées dans un dossier surveillé, sans le parcourir
      soi-même en boucle.
  - key: reset
    format: course
    question: Pourquoi appeler `WatchKey.reset()` ?
    choices:
      - {text: "Pour réarmer la clé après traitement : sans lui, elle ne reçoit plus d'événements", correct: true}
      - {text: "Pour vider la file des événements, sans quoi ils sont rejoués à l'infini", correct: false}
      - {text: "Pour arrêter la surveillance du dossier, une fois le travail terminé", correct: false}
      - {text: "Pour relire tout le dossier, et rattraper les événements perdus", correct: false}
    answer: |-
      Après traitement de ses événements, la clé doit être réarmée pour en recevoir d'autres ; `reset` renvoie `false` si
      le dossier n'est plus accessible. Arrêter la surveillance, c'est `cancel()`.
  - key: limites
    format: course
    question: Quelles sont les limites du `WatchService` ?
    choices:
      - {text: "Un seul dossier sans ses sous-dossiers, des événements perdus, peu fiable sur les partages réseau", correct: true}
      - {text: "Il surveille tout le disque à la fois, ce qui le rend lent dès qu'il y a beaucoup de fichiers", correct: false}
      - {text: "Il ne fonctionne que sous Linux, car il repose directement sur `inotify` et rien d'autre", correct: false}
      - {text: "Il ne signale que les créations : les modifications et les suppressions lui échappent", correct: false}
    answer: |-
      Un dossier seulement (pas ses sous-dossiers), des événements regroupés ou perdus (`OVERFLOW`), des fichiers signalés
      pendant leur écriture, et des notifications souvent absentes sur les partages réseau.
  - key: fiable
    format: course
    question: Comment traiter de façon fiable les fichiers déposés dans un dossier ?
    choices:
      - {text: "Combiner le `WatchService`, un parcours périodique de rattrapage et un protocole de dépôt", correct: true}
      - {text: "Se fier au seul `WatchService`, qui ne perd jamais d'événement sur un disque local", correct: false}
      - {text: "Traiter chaque fichier dès son `ENTRY_CREATE`, en le lisant aussitôt en entier", correct: false}
      - {text: "Parcourir le dossier chaque seconde, et traiter chaque fichier dès qu'il apparaît", correct: false}
    answer: |-
      En combinant le `WatchService` avec un parcours périodique de rattrapage, et un protocole de dépôt (nom temporaire
      renommé une fois le fichier complet). `ENTRY_CREATE` arrive souvent avant la fin de l'écriture.
  - key: vf-recursif
    format: true-false
    question: Enregistrer un dossier dans un `WatchService` surveille aussi ses sous-dossiers.
    truth: false
    answer: Il faut enregistrer chaque sous-dossier.
  - key: vf-contexte
    format: true-false
    question: Le contexte d'un `WatchEvent` est le chemin relatif au dossier surveillé.
    truth: true
    answer: On le résout avec `dossier.resolve(nom)`.
  - key: vf-complet
    format: true-false
    question: Un événement `ENTRY_CREATE` garantit que le fichier est entièrement écrit.
    truth: false
    answer: Il peut être encore en cours d'écriture.
  - key: vf-overflow
    format: true-false
    question: "L'événement `OVERFLOW` signale que des événements ont pu être perdus."
    truth: true
    answer: Il faut alors rescanner le dossier.
  - key: qcm-oubli
    format: multiple-choice
    question: Un `WatchService` ne reçoit qu'un seul lot d'événements, puis plus rien. Pourquoi ?
    choices:
      - text: "`reset()` n'est pas appelé sur la clé"
        correct: true
      - text: "`take()` ne doit être appelé qu'une fois"
        correct: false
      - text: "Le dossier est trop gros"
        correct: false
      - text: "Les événements sont désactivés par défaut"
        correct: false
    answer: La clé reste dans l'état « signalée » tant qu'elle n'est pas réarmée.
  - key: qcm-evenements
    format: multiple-choice
    question: "Lesquels de ces types d'événements peut-on surveiller avec un `WatchService` ?"
    choices:
      - text: "`ENTRY_CREATE`"
        correct: true
      - text: "`ENTRY_DELETE`"
        correct: true
      - text: "`ENTRY_READ`"
        correct: false
      - text: "`ENTRY_RENAME`"
        correct: false
    answer: '`ENTRY_MODIFY` aussi ; un renommage apparaît comme une suppression et une création.'
  - key: qcm-reseau
    format: multiple-choice
    question: Pourquoi le `WatchService` peut-il ne rien signaler sur un dossier NFS ?
    choices:
      - {text: "Les modifications faites par d'autres machines ne déclenchent pas de notification locale", correct: true}
      - {text: "NFS est monté en lecture seule, donc aucune modification n'y est jamais possible", correct: false}
      - {text: "Le serveur NFS est trop loin : les notifications arrivent, mais des heures après", correct: false}
      - {text: "Java ne sait pas ouvrir un dossier NFS : `register` y échoue toujours en silence", correct: false}
    answer: D'où l'intérêt d'un parcours périodique.
  - key: qcm-take-poll
    format: multiple-choice
    question: Quelle différence entre `watcher.take()` et `watcher.poll()` ?
    choices:
      - {text: "`take` attend un événement ; `poll` renvoie `null` immédiatement s'il n'y en a pas", correct: true}
      - {text: "`poll` attend un événement ; `take` renvoie `null` immédiatement s'il n'y en a pas", correct: false}
      - {text: "`take` attend un événement et supprime le fichier ; `poll` le laisse en place", correct: false}
      - {text: "`take` surveille le dossier seul ; `poll` surveille aussi ses sous-dossiers", correct: false}
    answer: '`poll(délai)` attend au plus le délai donné.'
