notion: reflexion-couts
lesson: |-
  La réflexion est puissante, mais elle a un prix :

  - **le typage** : les erreurs (nom de méthode faux, mauvais type d'argument) n'apparaissent qu'à **l'exécution**, et
    les outils (IDE, refactoring, recherche d'usages) ne voient plus ces appels ;
  - **la fragilité** : renommer une méthode casse silencieusement le code qui l'appelait par son nom ;
  - **la performance** : la recherche des méthodes et les contrôles d'accès coûtent ; `Method.invoke` reste plus lent
    qu'un appel direct (moins depuis Java 18, où il repose sur des `MethodHandle`), et le JIT optimise moins bien ;
  - **l'encapsulation** : `setAccessible(true)` contourne `private` et peut casser les invariants d'une classe ;
  - **les modules** : depuis Java 16-17, l'**encapsulation forte** interdit la réflexion profonde sur les internes du JDK
    et sur les packages non ouverts (`InaccessibleObjectException`), sauf `opens` ou `--add-opens` ;
  - **les images natives** : GraalVM (monde fermé) exige de **déclarer** à l'avance les classes utilisées par réflexion ;
  - **la sécurité** : appeler des méthodes dont le nom vient de données externes ouvre la porte à des abus.

  Les alternatives :
  - les **interfaces** et le **polymorphisme** quand le code connaît les types ;
  - les **références de méthode** et lambdas pour passer du comportement ;
  - la **génération de code à la compilation** (processeurs d'annotations : MapStruct, Dagger, Quarkus) ;
  - **`MethodHandle`** pour un appel dynamique rapide et répété ;
  - **mettre en cache** les objets `Method`, `Field`, `Constructor` si la réflexion est inévitable.

  La réflexion reste légitime dans les **frameworks** et les outils génériques (sérialisation, injection, tests), qui
  traitent des classes qu'ils ne connaissent pas. Dans le code métier, elle est rarement justifiée.

  **Piège classique** : appeler `getDeclaredMethod(...)` à chaque requête dans une boucle chaude. La recherche se répète
  inutilement ; on récupère l'objet `Method` une fois et on le met en cache (ou on utilise un `MethodHandle`).

  **En entretien** : « La réflexion perd le typage, casse aux refactorings, coûte en performance, se heurte aux modules et
  aux images natives ; je la réserve aux frameworks, et je préfère interfaces, lambdas ou génération de code. »
cards:
  - key: inconvenients-reflexion
    format: course
    question: Inconvénients de la réflexion ?
    answer: Performance, perte de typage, fragilité, encapsulation forte du JDK, configuration nécessaire en natif.
  - key: alternatives
    format: course
    question: Que préférer à la réflexion dans le code métier ?
    answer: Des interfaces et le polymorphisme, des références de méthode ou des lambdas, de la génération de code à la compilation, ou des `MethodHandle` pour des appels dynamiques répétés.
  - key: cache
    format: course
    question: Comment limiter le coût d'une réflexion inévitable ?
    answer: En récupérant une fois les objets `Method`, `Field` ou `Constructor` (ou un `MethodHandle`) et en les réutilisant, au lieu de les rechercher à chaque appel.
  - key: modules
    format: course
    question: Pourquoi la réflexion sur les classes du JDK échoue-t-elle souvent depuis Java 17 ?
    answer: L'encapsulation forte des modules interdit l'accès réflexif profond aux packages non ouverts ; `setAccessible(true)` lève `InaccessibleObjectException`, sauf `--add-opens`.
  - key: vf-compile
    format: true-false
    question: Une faute de frappe dans un nom de méthode appelé par réflexion est détectée à la compilation.
    truth: false
    answer: Elle provoque une `NoSuchMethodException` à l'exécution.
  - key: vf-refactoring
    format: true-false
    question: Renommer une méthode dans l'IDE met à jour les appels par réflexion qui utilisent son nom en chaîne.
    truth: false
    answer: Les chaînes ne sont pas reliées au code.
  - key: vf-natif
    format: true-false
    question: Dans une image native GraalVM, les classes utilisées par réflexion doivent être déclarées.
    truth: true
    answer: Le monde fermé ne voit pas les accès dynamiques.
  - key: vf-frameworks
    format: true-false
    question: La réflexion est légitime dans un framework de sérialisation qui traite des classes inconnues.
    truth: true
    answer: C'est son usage naturel ; le code métier, lui, connaît ses types.
  - key: qcm-couts
    format: multiple-choice
    question: Quels sont des coûts de la réflexion ?
    choices:
      - text: "Des erreurs découvertes à l'exécution plutôt qu'à la compilation"
        correct: true
      - text: "Des appels moins bien optimisés par le JIT"
        correct: true
      - text: "Une compilation plus lente"
        correct: false
      - text: "Un fichier JAR plus gros"
        correct: false
    answer: Et la fragilité aux refactorings, et les contraintes des modules et du natif.
  - key: qcm-alternative
    format: multiple-choice
    question: Un code appelle `getMethod("traiter" + type)` pour choisir un traitement selon un type de message. Quelle alternative ?
    choices:
      - text: "Une `Map<TypeMessage, Traitement>` d'implémentations ou un `switch` sur un type scellé"
        correct: true
      - text: "Garder la réflexion, plus souple"
        correct: false
      - text: "Utiliser `setAccessible(true)`"
        correct: false
      - text: "Un `ServiceLoader` par message"
        correct: false
    answer: Le choix devient typé et vérifié à la compilation.
  - key: qcm-inaccessible
    format: multiple-choice
    question: "`setAccessible(true)` sur un champ privé de `java.lang.String` lève une exception sur Java 21. Laquelle ?"
    choices:
      - text: "`InaccessibleObjectException`"
        correct: true
      - text: "`IllegalAccessException`"
        correct: false
      - text: "`SecurityException`"
        correct: false
      - text: "`NoSuchFieldException`"
        correct: false
    answer: Le package `java.lang` n'est pas ouvert à la réflexion profonde.
  - key: qcm-securite
    format: multiple-choice
    question: Pourquoi est-il dangereux d'appeler une méthode dont le nom vient d'un paramètre HTTP ?
    choices:
      - text: "Un attaquant peut choisir d'appeler une méthode qui n'était pas prévue pour lui"
        correct: true
      - text: "Parce que les noms de méthodes sont limités en longueur"
        correct: false
      - text: "Parce que HTTP n'accepte pas les noms de méthodes"
        correct: false
      - text: "Ce n'est pas dangereux"
        correct: false
    answer: On associe des valeurs autorisées à des actions explicites (liste blanche).
