notion: processeurs-annotations
lesson: |-
  Un **processeur d'annotations** est un plugin du **compilateur** (`javax.annotation.processing`, JSR 269) : pendant
  `javac`, il reçoit les éléments annotés et peut **vérifier** le code (émettre des erreurs) ou **générer de nouveaux
  fichiers source**, compilés dans la foulée.

  ```java
  @SupportedAnnotationTypes("com.recallio.Builder")
  @SupportedSourceVersion(SourceVersion.RELEASE_25)
  public class BuilderProcessor extends AbstractProcessor {
      @Override
      public boolean process(Set<? extends TypeElement> annotations, RoundEnvironment env) {
          for (Element e : env.getElementsAnnotatedWith(Builder.class)) {
              // lire la structure de la classe, puis écrire CommandeBuilder.java
              JavaFileObject fichier = processingEnv.getFiler().createSourceFile(nom + "Builder");
              ...
          }
          return true;
      }
  }
  ```

  Exemples connus :
  - **MapStruct** génère les mappers entre entités et DTO ;
  - **Dagger**, **Micronaut** et en partie **Quarkus** génèrent l'injection de dépendances à la compilation ;
  - **Immutables**, **AutoValue** génèrent des classes valeur ;
  - **Hibernate** génère le métamodèle JPA (`Commande_`) ;
  - **Lombok** utilise ce mécanisme mais **modifie** les classes existantes en touchant aux internes du compilateur,
    ce que l'API ne permet pas officiellement (d'où sa fragilité à chaque version du JDK).

  Pourquoi c'est intéressant :
  - **zéro coût à l'exécution** : le code généré est du Java ordinaire, sans réflexion ;
  - les erreurs apparaissent **à la compilation** ;
  - compatible avec les **images natives** (GraalVM), qui supportent mal la réflexion.

  Côté build : le processeur est déclaré dans `META-INF/services/javax.annotation.processing.Processor` et ajouté au
  compilateur (`annotationProcessorPaths` de `maven-compiler-plugin`, configuration `annotationProcessor` de Gradle). Les
  sources générées vont dans `target/generated-sources/annotations`.

  **Piège classique** : un processeur qui modifie une classe existante. L'API officielle ne permet que de **créer** de
  nouveaux fichiers ; les outils qui modifient (Lombok) dépendent d'internes du compilateur et cassent aux montées de version.

  **En entretien** : « Un processeur d'annotations s'exécute dans `javac` et génère du code source, sans coût à l'exécution
  et compatible avec le natif, comme MapStruct ; la réflexion fait le travail à l'exécution. »
cards:
  - key: annotation-processor-vs-reflexion
    format: course
    question: Annotation processor vs réflexion ?
    answer: Le processor travaille à la compilation et génère du code (zéro coût runtime) ; la réflexion lit les annotations à l'exécution.
  - key: exemples
    format: course
    question: Citez des outils qui reposent sur des processeurs d'annotations.
    answer: MapStruct (mappers), Dagger et Micronaut (injection), Immutables et AutoValue (classes valeur), le métamodèle JPA d'Hibernate.
  - key: lombok
    format: course
    question: Pourquoi Lombok est-il plus fragile qu'un processeur d'annotations classique ?
    answer: L'API officielle ne permet que de générer de nouveaux fichiers ; Lombok modifie les classes existantes en utilisant des internes du compilateur, qui changent d'une version du JDK à l'autre.
  - key: natif
    format: course
    question: Pourquoi la génération de code à la compilation convient-elle aux images natives ?
    answer: Le code généré est du Java ordinaire, analysable à la construction, alors que la réflexion doit être déclarée explicitement dans le monde fermé de GraalVM.
  - key: vf-execution
    format: true-false
    question: Un processeur d'annotations s'exécute au démarrage de l'application.
    truth: false
    answer: Il s'exécute pendant la compilation, dans `javac`.
  - key: vf-modifier
    format: true-false
    question: L'API officielle des processeurs d'annotations permet de modifier une classe existante.
    truth: false
    answer: Elle permet de créer de nouveaux fichiers (source, ressources).
  - key: vf-erreurs
    format: true-false
    question: Un processeur peut faire échouer la compilation en signalant une erreur.
    truth: true
    answer: Avec le `Messager`, pour valider l'usage d'une annotation.
  - key: vf-mapstruct
    format: true-false
    question: MapStruct génère le code de mapping à la compilation.
    truth: true
    answer: Sans réflexion à l'exécution.
  - key: qcm-avantages
    format: multiple-choice
    question: Quels avantages a la génération de code à la compilation sur la réflexion ?
    choices:
      - text: "Aucun coût de réflexion à l'exécution"
        correct: true
      - text: "Des erreurs détectées à la compilation"
        correct: true
      - text: "Un code qui peut changer à l'exécution"
        correct: false
      - text: "Aucun besoin de compiler"
        correct: false
    answer: Et une bonne compatibilité avec les images natives.
  - key: qcm-declarer
    format: multiple-choice
    question: Comment déclarer un processeur pour qu'il soit découvert par `javac` ?
    choices:
      - text: "Un fichier `META-INF/services/javax.annotation.processing.Processor`"
        correct: true
      - text: "L'ajouter aux `annotationProcessorPaths` du compilateur Maven"
        correct: true
      - text: "Un champ `static` dans la classe principale"
        correct: false
      - text: "Une option `-javaagent`"
        correct: false
    answer: '`-javaagent` agit à l''exécution, sur le bytecode.'
  - key: qcm-genere
    format: multiple-choice
    question: Où Maven place-t-il par défaut les sources générées par les processeurs ?
    choices:
      - text: "`target/generated-sources/annotations`"
        correct: true
      - text: "`src/main/java`"
        correct: false
      - text: "`src/test/resources`"
        correct: false
      - text: "`~/.m2`"
        correct: false
    answer: Elles ne se versionnent pas.
  - key: qcm-choix
    format: multiple-choice
    question: Une équipe veut générer les mappers entité-DTO sans réflexion. Que choisir ?
    choices:
      - text: "MapStruct"
        correct: true
      - text: "Un mapper par réflexion écrit à la main"
        correct: false
      - text: "Un proxy dynamique"
        correct: false
      - text: "`ServiceLoader`"
        correct: false
    answer: Le code généré se lit et se débogue comme du code écrit à la main.
