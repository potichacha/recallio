notion: serviceloader
lesson: |-
  Le mécanisme **SPI** (*Service Provider Interface*) permet à une application de découvrir à l'exécution les
  **implémentations** d'une interface fournies par d'autres JAR, sans les connaître à la compilation. L'outil :
  **`java.util.ServiceLoader`**.

  ```java
  // 1. L'interface du service (dans un module « api »)
  public interface Exporteur {
      String format();
      byte[] exporter(Rapport r);
  }

  // 2. Une implémentation (dans un autre JAR), avec un constructeur public sans argument
  public class ExporteurCsv implements Exporteur { ... }

  // 3. Sa déclaration
  //    sur le classpath : fichier META-INF/services/com.recallio.spi.Exporteur contenant
  //        com.recallio.csv.ExporteurCsv
  //    ou dans module-info.java : provides com.recallio.spi.Exporteur with com.recallio.csv.ExporteurCsv;
  //    (et côté consommateur : uses com.recallio.spi.Exporteur;)

  // 4. La découverte
  ServiceLoader<Exporteur> chargeur = ServiceLoader.load(Exporteur.class);
  Map<String, Exporteur> parFormat = chargeur.stream()
          .map(ServiceLoader.Provider::get)
          .collect(toMap(Exporteur::format, e -> e));
  Optional<Exporteur> premier = chargeur.findFirst();
  ```

  - Ajouter un format revient à **ajouter un JAR** au classpath : le cœur de l'application ne change pas (principe
    ouvert-fermé, plugins).
  - Le JDK l'utilise partout : pilotes **JDBC** (`DriverManager`), fournisseurs de **journalisation** (SLF4J 2), de
    cryptographie, `java.nio.file.spi.FileSystemProvider`, les processeurs d'annotations, le `HttpClient`.
  - Les implémentations sont instanciées **à la demande**, pendant l'itération ; `stream()` permet de les examiner
    (`Provider.type()`) sans les instancier.
  - Un `ServiceLoader` n'est **pas thread-safe** ; `reload()` vide son cache.
  - Dans une application à injection de dépendances, le conteneur (CDI, Spring) joue souvent ce rôle ; le SPI reste
    utile pour les **bibliothèques** sans conteneur.

  **Piège classique** : une faute dans le nom du fichier `META-INF/services/...` (il doit être le nom complet de
  l'interface). Aucune implémentation n'est trouvée, sans aucune erreur.

  **En entretien** : « `ServiceLoader` découvre les implémentations d'une interface déclarées dans
  `META-INF/services` ou par `provides` dans un module ; c'est le mécanisme des plugins et des pilotes JDBC. »
cards:
  - key: principe
    format: course
    question: À quoi sert `ServiceLoader` ?
    choices:
      - {text: "À découvrir à l'exécution les implémentations d'une interface présentes sur le classpath", correct: true}
      - {text: "À charger une classe par son nom complet, exactement comme `Class.forName`", correct: false}
      - {text: "À démarrer des services du système, comme une base de données locale", correct: false}
      - {text: "À injecter des dépendances dans les champs annotés `@Inject`", correct: false}
    answer: |-
      À découvrir à l'exécution les implémentations d'une interface (des fournisseurs de service) présentes sur le
      classpath ou le module path, sans les connaître à la compilation.
  - key: declarer
    format: course
    question: Comment déclarer une implémentation pour `ServiceLoader` ?
    choices:
      - {text: "Dans `META-INF/services/<interface>` sur le classpath, ou par `provides ... with` dans un module", correct: true}
      - {text: "Avec une annotation `@Service` sur l'implémentation, que le JDK lit par réflexion", correct: false}
      - {text: "Dans le fichier `MANIFEST.MF` du JAR, à la ligne `Main-Class`", correct: false}
      - {text: "Par `exports` dans le `module-info.java` du module fournisseur", correct: false}
    answer: |-
      Sur le classpath, dans un fichier `META-INF/services/<nom complet de l'interface>` qui liste les classes ; dans un
      module, avec `provides Interface with Implementation;`.
  - key: jdk
    format: course
    question: Où le JDK utilise-t-il ce mécanisme ?
    choices:
      - {text: "Pour les pilotes JDBC, la cryptographie, les systèmes de fichiers, les processeurs d'annotations", correct: true}
      - {text: "Pour le ramasse-miettes, qui choisit son algorithme parmi les services trouvés", correct: false}
      - {text: "Pour le compilateur JIT, qui charge ses optimisations comme des services", correct: false}
      - {text: "Pour la boucle for-each, qui trouve ainsi l'itérateur de chaque collection", correct: false}
    answer: |-
      Pour les pilotes JDBC, les fournisseurs de cryptographie, les systèmes de fichiers (`FileSystemProvider`), les
      processeurs d'annotations, et des bibliothèques comme SLF4J 2.
  - key: plugins
    format: course
    question: Pourquoi le SPI est-il adapté à un système de plugins ?
    choices:
      - {text: "Ajouter une fonction revient à déposer un JAR : le cœur de l'application ne change pas", correct: true}
      - {text: "Les plugins sont compilés avec le cœur, ce qui garantit leur compatibilité", correct: false}
      - {text: "Le SPI isole chaque plugin dans sa propre JVM, pour la sécurité", correct: false}
      - {text: "Le SPI vérifie la signature de chaque plugin avant de le charger", correct: false}
    answer: |-
      Ajouter une fonction revient à déposer un JAR qui fournit une implémentation ; le cœur de l'application ne change
      pas et ne connaît pas les plugins à la compilation. Le SPI n'isole ni ne vérifie rien.
  - key: vf-constructeur
    format: true-false
    question: Une implémentation découverte par `ServiceLoader` doit avoir un constructeur public sans argument (ou une méthode `provider()` dans un module).
    truth: true
    answer: Le chargeur l'instancie lui-même.
  - key: vf-erreur
    format: true-false
    question: Un fichier `META-INF/services` mal nommé provoque une erreur au démarrage.
    truth: false
    answer: Aucune implémentation n'est trouvée, silencieusement.
  - key: vf-thread-safe
    format: true-false
    question: Un `ServiceLoader` peut être partagé sans précaution entre plusieurs threads.
    truth: false
    answer: Il n'est pas thread-safe.
  - key: vf-paresseux
    format: true-false
    question: "`ServiceLoader` instancie les fournisseurs au fur et à mesure de l'itération."
    truth: true
    answer: Et `stream()` permet d'examiner leur type avant de les instancier.
  - key: qcm-fichier
    format: multiple-choice
    question: "Quel est le nom du fichier qui déclare les implémentations de `com.recallio.spi.Exporteur` ?"
    choices:
      - text: "`META-INF/services/com.recallio.spi.Exporteur`"
        correct: true
      - text: "`META-INF/services/Exporteur`"
        correct: false
      - text: "`META-INF/spi.properties`"
        correct: false
      - text: "`src/main/resources/exporteur.xml`"
        correct: false
    answer: Le nom complet de l'interface.
  - key: qcm-module
    format: multiple-choice
    question: "Lesquelles de ces déclarations servent à fournir et à consommer un service avec des modules ?"
    choices:
      - text: "`provides Exporteur with ExporteurCsv;` dans le module fournisseur"
        correct: true
      - text: "`uses Exporteur;` dans le module consommateur"
        correct: true
      - text: "`exports ExporteurCsv;`"
        correct: false
      - text: "`requires ServiceLoader;`"
        correct: false
    answer: Le fournisseur n'a pas besoin d'exporter son implémentation.
  - key: qcm-usages
    format: multiple-choice
    question: "Lequel de ces mécanismes repose sur le SPI ?"
    choices:
      - {text: "Le chargement automatique des pilotes JDBC", correct: true}
      - {text: "Le ramasse-miettes, pour choisir son algorithme", correct: false}
      - {text: "Le compilateur JIT, pour charger ses optimisations", correct: false}
      - {text: "La boucle for-each, pour trouver l'itérateur", correct: false}
    answer: |-
      Les pilotes JDBC 4 se déclarent dans `META-INF/services/java.sql.Driver` ; `javac` découvre de même les processeurs
      d'annotations.
  - key: qcm-conteneur
    format: multiple-choice
    question: Dans une application Quarkus ou Spring, que préférer au SPI pour choisir une implémentation ?
    choices:
      - text: "L'injection de dépendances du conteneur"
        correct: true
      - text: "Des fichiers `META-INF/services` partout"
        correct: false
      - text: "La réflexion sur toutes les classes"
        correct: false
      - text: "Un singleton statique"
        correct: false
    answer: Le SPI reste utile pour les bibliothèques sans conteneur.
  - key: definition-spi
    format: definition
    question: "Que désigne le SPI, en Java ?"
    choices:
      - {text: "Service Provider Interface : des services découverts par `ServiceLoader`", correct: true}
      - {text: "Serial Peripheral Interface : un bus matériel piloté par la JVM", correct: false}
      - {text: "Service Proxy Interface : les proxies générés autour des services", correct: false}
      - {text: "Standard Plugin Installer : l'installateur de plugins du JDK", correct: false}
    answer: |-
      Service Provider Interface : une interface de service, dont les implémentations sont découvertes par
      `ServiceLoader`.
  - key: definition-fournisseur
    format: definition
    question: "Qu'est-ce qu'un fournisseur de service (provider) ?"
    choices:
      - {text: "Une implémentation d'une interface de service, déclarée pour être découverte par `ServiceLoader`", correct: true}
      - {text: "L'interface de service elle-même, que les implémentations doivent respecter", correct: false}
      - {text: "Le module qui consomme le service, déclaré dans son `module-info` avec `uses`", correct: false}
      - {text: "L'éditeur de la bibliothèque, inscrit dans le `MANIFEST.MF` du JAR", correct: false}
    answer: Une implémentation d'une interface de service, déclarée pour être découverte par `ServiceLoader`.
  - key: definition-meta-inf-services
    format: definition
    question: "Qu'est-ce que le dossier `META-INF/services` ?"
    choices:
      - {text: "Le dossier d'un JAR où un fichier nommé d'après une interface liste ses implémentations", correct: true}
      - {text: "Le dossier d'un JAR qui contient les classes compilées des services de l'application", correct: false}
      - {text: "Le dossier de configuration de Spring, qui déclare tous les beans de l'application", correct: false}
      - {text: "Le dossier d'un JAR qui contient la signature numérique de chacune de ses classes", correct: false}
    answer: Le dossier d'un JAR où un fichier nommé d'après une interface liste les classes qui l'implémentent.
  - key: definition-provides
    format: definition
    question: "Que déclare la clause `provides ... with` ?"
    choices:
      - {text: "Dans `module-info.java`, qu'un module fournit une implémentation d'un service", correct: true}
      - {text: "Dans `module-info.java`, qu'un module consomme un service, trouvé par `ServiceLoader`", correct: false}
      - {text: "Dans `module-info.java`, qu'un module rend un paquet accessible aux autres modules", correct: false}
      - {text: "Dans `module-info.java`, qu'un module ouvre un paquet à la réflexion profonde", correct: false}
    answer: |-
      La clause de `module-info.java` qui déclare qu'un module fournit une implémentation d'un service. Consommer, c'est
      `uses` ; rendre accessible, `exports` ; ouvrir à la réflexion, `opens`.
