notion: reflexion-annotations
lesson: |-
  Une annotation de rétention **`RUNTIME`** se lit par réflexion sur les classes, méthodes, champs, paramètres et
  composants de records. C'est ainsi que les frameworks découvrent ce qu'ils doivent faire.

  ```java
  @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.METHOD)
  @interface Planifie { String cron(); }

  class Taches {
      @Planifie(cron = "0 2 * * *") void purger() { ... }
      @Planifie(cron = "*/5 * * * *") void synchroniser() { ... }
      void utilitaire() { ... }
  }

  for (Method m : Taches.class.getDeclaredMethods()) {
      Planifie p = m.getAnnotation(Planifie.class);           // null si absente
      if (p != null) {
          ordonnanceur.programmer(p.cron(), () -> invoquer(m));
      }
  }

  boolean present = m.isAnnotationPresent(Planifie.class);
  Annotation[][] parParametre = m.getParameterAnnotations();
  Planifie[] toutes = m.getAnnotationsByType(Planifie.class);  // pour une annotation @Repeatable
  ```

  - `getAnnotation(Type.class)` renvoie l'annotation ou **`null`** ; `isAnnotationPresent` teste sa présence.
  - Une annotation **`@Inherited`** posée sur une classe est trouvée par `getAnnotation` sur ses sous-classes ;
    `getDeclaredAnnotation` ne cherche que sur l'élément lui-même.
  - Une annotation sans `@Retention(RUNTIME)` est **invisible** ici : `getAnnotation` renvoie `null`.
  - Les frameworks combinent souvent cette lecture à un **index construit à la compilation** (Jandex pour Quarkus, des
    processeurs d'annotations) pour éviter de parcourir toutes les classes au démarrage.
  - Les annotations **méta-annotées** (une annotation portée par une autre, comme `@Transactional` sur un stéréotype) ne
    sont pas résolues automatiquement par le JDK : les frameworks le font eux-mêmes.

  **Piège classique** : une annotation maison lue par le framework, mais déclarée sans `@Retention(RUNTIME)`. Elle est
  silencieusement ignorée : aucune erreur, aucun effet.

  **En entretien** : « `getAnnotation` et `isAnnotationPresent` lisent les annotations `RUNTIME` sur classes, méthodes et
  champs ; c'est ainsi que les frameworks découvrent les points d'entrée, souvent avec un index construit à la
  compilation. »
cards:
  - key: lire
    format: course
    question: Comment lire une annotation sur une méthode à l'exécution ?
    answer: Avec `methode.getAnnotation(MonAnnotation.class)`, qui renvoie l'annotation (et ses valeurs) ou `null` ; l'annotation doit avoir `@Retention(RUNTIME)`.
  - key: inherited
    format: course
    question: Quelle différence entre `getAnnotation` et `getDeclaredAnnotation` sur une classe ?
    answer: '`getAnnotation` trouve aussi une annotation `@Inherited` posée sur une super-classe ; `getDeclaredAnnotation` ne regarde que la classe elle-même.'
  - key: index
    format: course
    question: Pourquoi des frameworks comme Quarkus construisent-ils un index des annotations à la compilation ?
    answer: Pour ne pas parcourir et charger toutes les classes au démarrage afin de chercher les annotations ; l'index (Jandex) donne directement les éléments annotés.
  - key: parametres
    format: course
    question: Comment lire les annotations des paramètres d'une méthode ?
    answer: Avec `getParameterAnnotations()`, un tableau par paramètre, ou via `getParameters()` puis `getAnnotation` sur chaque `Parameter`.
  - key: vf-null
    format: true-false
    question: "`getAnnotation` renvoie `null` si l'annotation est absente."
    truth: true
    answer: '`isAnnotationPresent` donne un booléen.'
  - key: vf-class
    format: true-false
    question: Une annotation de rétention `CLASS` est visible par `getAnnotation`.
    truth: false
    answer: Seules les annotations `RUNTIME` le sont.
  - key: vf-meta
    format: true-false
    question: Le JDK résout automatiquement les méta-annotations (une annotation portée par l'annotation d'une méthode).
    truth: false
    answer: Les frameworks le font eux-mêmes.
  - key: vf-repeatable
    format: true-false
    question: "`getAnnotationsByType` renvoie toutes les occurrences d'une annotation `@Repeatable`."
    truth: true
    answer: Y compris celles regroupées dans le conteneur.
  - key: qcm-methodes
    format: multiple-choice
    question: Quelles méthodes lisent des annotations par réflexion ?
    choices:
      - text: "`getAnnotation(Type.class)`"
        correct: true
      - text: "`isAnnotationPresent(Type.class)`"
        correct: true
      - text: "`getAnnotationValue()`"
        correct: false
      - text: "`readAnnotation()`"
        correct: false
    answer: Elles existent sur `Class`, `Method`, `Field`, `Constructor`, `Parameter`, `RecordComponent`.
  - key: qcm-silence
    format: multiple-choice
    question: Un framework maison ignore une annotation `@Planifie` posée sur des méthodes. Quelle cause probable ?
    choices:
      - text: "L'annotation n'a pas `@Retention(RetentionPolicy.RUNTIME)`"
        correct: true
      - text: "L'annotation a un `@Target(METHOD)`"
        correct: false
      - text: "Les méthodes sont publiques"
        correct: false
      - text: "L'annotation a un élément `value`"
        correct: false
    answer: La rétention par défaut, `CLASS`, la rend invisible.
  - key: qcm-usages
    format: multiple-choice
    question: Quels frameworks découvrent leurs points d'entrée par les annotations ?
    choices:
      - text: "JUnit, qui trouve les méthodes `@Test`"
        correct: true
      - text: "Jakarta REST, qui trouve les ressources `@Path`"
        correct: true
      - text: "`javac`, pour compiler"
        correct: false
      - text: "Le ramasse-miettes"
        correct: false
    answer: Par réflexion à l'exécution, ou par un index construit à la compilation.
  - key: qcm-valeurs
    format: multiple-choice
    question: "Comment lire la valeur `cron` de `@Planifie(cron = \"0 2 * * *\")` obtenue dans `p` ?"
    choices:
      - text: "`p.cron()`"
        correct: true
      - text: "`p.get(\"cron\")`"
        correct: false
      - text: "`p.cron`"
        correct: false
      - text: "`p.getValue()`"
        correct: false
    answer: Les éléments d'une annotation se lisent comme des méthodes.
  - key: code-scan
    format: code-output
    question: |-
      ```java
      import java.lang.annotation.*;
      import java.lang.reflect.*;
      @Retention(RetentionPolicy.RUNTIME) @interface Planifie { String cron(); }
      class Taches {
          @Planifie(cron = "0 2 * * *") void purger() {}
          void utilitaire() {}
      }
      List<String> planifiees = new ArrayList<>();
      for (Method m : Taches.class.getDeclaredMethods()) {
          Planifie p = m.getAnnotation(Planifie.class);
          if (p != null) planifiees.add(m.getName() + "=" + p.cron());
      }
      System.out.println(planifiees);
      ```
    answer: '`[purger=0 2 * * *]`.'
    check:
      output: "[purger=0 2 * * *]"
  - key: code-inherited
    format: code-output
    question: |-
      ```java
      import java.lang.annotation.*;
      @Retention(RetentionPolicy.RUNTIME) @Inherited @interface Composant {}
      @Composant class Base {}
      class Derivee extends Base {}
      System.out.println((Derivee.class.getAnnotation(Composant.class) != null) + " "
              + (Derivee.class.getDeclaredAnnotation(Composant.class) != null));
      ```
    answer: '`true false` : héritée, mais pas déclarée sur `Derivee`.'
    check:
      output: "true false"
  - key: code-champ
    format: code-output
    question: |-
      ```java
      import java.lang.annotation.*;
      @Retention(RetentionPolicy.RUNTIME) @interface Masque {}
      class Utilisateur { String nom; @Masque String motDePasse; }
      long n = Arrays.stream(Utilisateur.class.getDeclaredFields())
              .filter(f -> f.isAnnotationPresent(Masque.class))
              .count();
      System.out.println(n);
      ```
    answer: '`1` : seul `motDePasse` porte `@Masque`.'
    check:
      output: "1"
  - key: code-sans-runtime
    format: code-output
    question: |-
      ```java
      @interface Audit {}
      class Service { @Audit void supprimer() {} }
      System.out.println(Service.class.getDeclaredMethod("supprimer").isAnnotationPresent(Audit.class));
      ```
    answer: '`false` : sans rétention `RUNTIME`, l''annotation est invisible par réflexion.'
    check:
      output: "false"
