notion: annotations-standard
lesson: |-
  Une **annotation** ajoute une **métadonnée** au code (`@Nom`), lue par le compilateur, des outils ou des frameworks.
  Elle ne change pas le comportement du code à elle seule. Le JDK en fournit quelques-unes :

  ```java
  class Remise implements Comparable<Remise> {

      @Override                                    // le compilateur vérifie qu'on redéfinit bien une méthode
      public int compareTo(Remise autre) { ... }

      @Deprecated(since = "2.3", forRemoval = true) // à ne plus utiliser ; les appelants reçoivent un avertissement
      public double ancienCalcul() { ... }

      @SuppressWarnings("unchecked")               // masque un avertissement précis, au plus près
      List<String> copier(Object o) { return (List<String>) o; }
  }

  @FunctionalInterface                             // le compilateur vérifie qu'il y a une seule méthode abstraite
  interface Regle { boolean respectee(Commande c); }

  @SafeVarargs                                     // promet qu'une méthode varargs générique est sûre
  static <T> List<T> liste(T... elements) { ... }
  ```

  - **`@Override`** : le compilateur refuse la méthode si elle ne redéfinit rien (faute de frappe, mauvais paramètre).
    À mettre **toujours** : sans elle, `equals(Commande c)` au lieu de `equals(Object o)` passe inaperçu et crée une
    **surcharge**.
  - **`@Deprecated`** : signale une API à éviter ; `forRemoval = true` annonce sa suppression (avertissement plus fort).
    On l'accompagne d'un commentaire Javadoc `@deprecated` qui indique le remplaçant.
  - **`@SuppressWarnings`** : à placer sur la plus petite portée possible (une variable, une méthode), avec la raison.
  - **`@FunctionalInterface`** et **`@SafeVarargs`** : des vérifications ou promesses au compilateur.
  - Les frameworks reposent largement sur les annotations : `@Inject`, `@Path`, `@Entity`, `@Test`, `@Transactional`.

  **Piège classique** : redéfinir `equals` sans `@Override`, avec le mauvais type de paramètre. Le code compile, mais
  `HashSet` et `List.contains` appellent toujours `Object.equals` : les objets égaux ne sont jamais reconnus.

  **En entretien** : « Les annotations sont des métadonnées ; `@Override` fait vérifier une redéfinition, `@Deprecated`
  signale une API à abandonner, `@SuppressWarnings` masque un avertissement au plus près, `@FunctionalInterface` vérifie
  une interface fonctionnelle. »
tour:
  - title: Les annotations standard
    text: |-
      Une **annotation** ajoute une information au code, que le compilateur ou des outils exploitent. Le JDK en fournit
      quelques-unes :

      - `@Override` vérifie qu'une méthode redéfinit bien une méthode parente ;
      - `@Deprecated` signale un élément à ne plus utiliser, et le compilateur avertit ceux qui s'en servent ;
      - `@SuppressWarnings` fait taire un avertissement précis ;
      - `@FunctionalInterface` vérifie qu'une interface n'a qu'une méthode abstraite.

      Les frameworks (JUnit, Spring, Quarkus) reposent sur leurs propres annotations, lues à l'exécution par réflexion,
      comme ce programme lit `@Deprecated`.
    example:
      files:
        Main.java: |-
          @FunctionalInterface
          interface Operation {
              int applique(int a, int b);
          }

          class Calcul {
              @Deprecated(since = "2.0")
              int ancienneSomme(int a, int b) {
                  return a + b;
              }

              @Override
              public String toString() {
                  return "Calcul";
              }
          }

          void main() throws NoSuchMethodException {
              Operation produit = (a, b) -> a * b;
              IO.println(produit.applique(6, 7));
              Calcul c = new Calcul();
              IO.println(c + " " + c.ancienneSomme(1, 2));
              Deprecated d = Calcul.class
                      .getDeclaredMethod("ancienneSomme", int.class, int.class)
                      .getAnnotation(Deprecated.class);
              IO.println("dépréciée depuis " + d.since());
          }
      output: |-
        42
        Calcul 3
        dépréciée depuis 2.0
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'une annotation ?
    choices:
      - {text: "Une métadonnée attachée au code, lue par le compilateur, des outils ou des frameworks", correct: true}
      - {text: "Un commentaire spécial que le compilateur recopie dans la Javadoc, sans autre effet", correct: false}
      - {text: "Une instruction exécutée juste avant la méthode annotée, comme un appel de fonction", correct: false}
      - {text: "Un mot-clé du langage qui change la visibilité de l'élément annoté", correct: false}
    answer: |-
      Une métadonnée attachée à un élément du code (classe, méthode, champ, paramètre), lue par le compilateur, des outils
      ou des frameworks ; elle ne change pas le comportement à elle seule.
  - key: override
    format: course
    question: Pourquoi mettre systématiquement `@Override` ?
    choices:
      - {text: "Le compilateur vérifie la redéfinition : une faute de nom ou de paramètre devient une erreur", correct: true}
      - {text: "Elle accélère l'appel, en évitant la recherche de la méthode à l'exécution", correct: false}
      - {text: "Elle est obligatoire pour qu'une méthode redéfinisse celle de son parent", correct: false}
      - {text: "Elle empêche les sous-classes de redéfinir à leur tour la méthode annotée", correct: false}
    answer: |-
      Le compilateur vérifie que la méthode redéfinit bien une méthode du parent ou d'une interface ; une faute de nom ou
      de paramètre devient une erreur au lieu d'une surcharge silencieuse. Elle reste facultative.
  - key: deprecated
    format: course
    question: Comment bien déprécier une méthode ?
    choices:
      - {text: "`@Deprecated(since, forRemoval)` et un `@deprecated` Javadoc qui nomme le remplaçant", correct: true}
      - {text: "`@Deprecated` seul : les outils trouvent d'eux-mêmes la méthode de remplacement", correct: false}
      - {text: "La supprimer tout de suite : les appelants verront l'erreur de compilation", correct: false}
      - {text: "La renommer en `ancienneMethodeOld`, pour que les appelants le remarquent", correct: false}
    answer: Avec `@Deprecated(since = "...", forRemoval = ...)` et un commentaire Javadoc `@deprecated` qui indique le remplaçant, puis la supprimer après une période annoncée.
  - key: suppress
    format: course
    question: Comment utiliser `@SuppressWarnings` correctement ?
    choices:
      - {text: "Sur la plus petite portée, pour un avertissement précis, avec un commentaire", correct: true}
      - {text: "Sur toute la classe, avec `\"all\"`, pour garder une compilation propre", correct: false}
      - {text: "Sur le package, une seule fois, pour les avertissements de tout le projet", correct: false}
      - {text: "Jamais : elle désactive aussi les erreurs de compilation du code annoté", correct: false}
    answer: Sur la plus petite portée possible (une variable ou une méthode, pas toute la classe), pour un avertissement précis, avec un commentaire qui explique pourquoi il est sans danger.
  - key: vf-comportement
    format: true-false
    question: "`@Override` change le comportement de la méthode à l'exécution."
    truth: false
    answer: Il ne sert qu'à la vérification par le compilateur.
  - key: vf-erreur
    format: true-false
    question: "`@Override` sur une méthode qui ne redéfinit rien provoque une erreur de compilation."
    truth: true
    answer: C'est tout son intérêt.
  - key: vf-for-removal
    format: true-false
    question: "`@Deprecated(forRemoval = true)` annonce que l'élément sera supprimé dans une version future."
    truth: true
    answer: Le compilateur émet un avertissement plus fort.
  - key: vf-interface
    format: true-false
    question: "`@Override` est permis sur une méthode qui implémente une méthode d'interface."
    truth: true
    answer: Depuis Java 6.
  - key: qcm-standard
    format: multiple-choice
    question: Lesquelles sont des annotations du JDK ?
    choices:
      - text: "`@Override`"
        correct: true
      - text: "`@FunctionalInterface`"
        correct: true
      - text: "`@Inject`"
        correct: false
      - text: "`@Entity`"
        correct: false
    answer: '`@Inject` vient de Jakarta (CDI), `@Entity` de JPA.'
  - key: qcm-equals
    format: multiple-choice
    question: "Que se passe-t-il avec `@Override public boolean equals(Commande c)` ?"
    choices:
      - {text: "Une erreur de compilation, car la méthode ne redéfinit pas `equals(Object)`", correct: true}
      - {text: "Rien de spécial : elle redéfinit `equals`, avec un paramètre plus précis", correct: false}
      - {text: "Un simple avertissement du compilateur, et la méthode reste une surcharge", correct: false}
      - {text: "Une erreur à l'exécution, au premier appel de `equals` par une collection", correct: false}
    answer: Sans `@Override`, ce serait une surcharge silencieuse.
  - key: qcm-suppress
    format: multiple-choice
    question: Où placer `@SuppressWarnings("unchecked")` ?
    choices:
      - {text: "Sur la variable ou la méthode qui contient le cast, avec un commentaire", correct: true}
      - {text: "Sur toute la classe, par confort, pour couvrir tous ses casts d'un coup", correct: false}
      - {text: "Sur le package, dans `package-info.java`, une fois pour tout le code", correct: false}
      - {text: "Sur la méthode `main`, qui couvre tout ce qu'elle appelle ensuite", correct: false}
    answer: Une portée large cache d'autres avertissements utiles.
  - key: qcm-frameworks
    format: multiple-choice
    question: "À quoi servent surtout les annotations dans les frameworks ?"
    choices:
      - {text: "Déclarer le rôle d'une classe ou d'une méthode, comme `@Path` ou `@Transactional`", correct: true}
      - {text: "Remplacer la compilation du code annoté par une interprétation à la volée", correct: false}
      - {text: "Accélérer le JIT, qui compile en priorité les méthodes annotées", correct: false}
      - {text: "Chiffrer le bytecode des classes annotées, pour protéger le code", correct: false}
    answer: |-
      Elles déclarent un rôle (`@Path`, `@Transactional`) ou configurent le mapping et l'injection (`@Entity`, `@Inject`)
      ; le framework les lit (à la compilation ou par réflexion) et ajoute le comportement.
  - key: trous-override
    format: fill-in
    question: |-
      Complète pour faire vérifier la redéfinition :
      ```java
      @___
      public String toString() { return "Commande " + id; }
      ```
    blanks: [[Override]]
    answer: Le compilateur contrôle la signature.
  - key: trous-deprecated
    format: fill-in
    question: |-
      Complète pour annoncer la suppression de la méthode :
      ```java
      @Deprecated(since = "3.0", ___ = true)
      public void ancienneMethode() { ... }
      ```
    blanks: [[forRemoval]]
    answer: Un avertissement plus fort chez les appelants.
  - key: trous-suppress
    format: fill-in
    question: |-
      Complète pour masquer l'avertissement du cast non vérifié :
      ```java
      @___("unchecked")
      List<String> l = (List<String>) objet;
      ```
    blanks: [[SuppressWarnings]]
    answer: Au plus près du cast, avec une justification.
  - key: trous-functional
    format: fill-in
    question: |-
      Complète pour faire vérifier l'interface fonctionnelle :
      ```java
      @___
      interface Convertisseur { String convertir(int x); }
      ```
    blanks: [[FunctionalInterface]]
    answer: Une seule méthode abstraite est permise.
  - key: code-override-erreur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Point {
          int x;
          @Override
          public boolean equals(Point autre) { return x == autre.x; }
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Rien", correct: false}
      - {text: "Une `ClassCastException`", correct: false}
    answer: "Ne compile pas : `equals(Point)` ne redéfinit pas `equals(Object)`."
    check:
      compiles: false
  - key: code-surcharge
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Point {
          int x;
          Point(int x) { this.x = x; }
          public boolean equals(Point autre) { return x == autre.x; }
          public int hashCode() { return x; }
      }
      System.out.println(new Point(1).equals(new Point(1)) + " " + new HashSet<>(List.of(new Point(1))).contains(new Point(1)));
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: '`true false` : sans `@Override`, `equals(Point)` est une surcharge ; `HashSet` appelle `equals(Object)`, celui d''`Object`.'
    check:
      output: "true false"
  - key: code-deprecated
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Api {
          @Deprecated(since = "2.0", forRemoval = true)
          void ancien() {}
      }
      var d = Api.class.getDeclaredMethod("ancien").getAnnotation(Deprecated.class);
      System.out.println(d.since() + " " + d.forRemoval());
      ```
    choices:
      - {text: "`2.0 true`", correct: true}
      - {text: "`2.0 false`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: '`2.0 true` : `@Deprecated` est conservée à l''exécution.'
    check:
      output: "2.0 true"
  - key: code-override-runtime
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class A { @Override public String toString() { return "A"; } }
      System.out.println(A.class.getDeclaredMethod("toString").getAnnotations().length);
      ```
    choices:
      - {text: "`0`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "Une `NoSuchMethodException`", correct: false}
    answer: '`0` : `@Override` a une rétention `SOURCE`, elle disparaît après la compilation.'
    check:
      output: "0"
  - key: bug-equals-surcharge
    format: bug-fix
    question: |-
      Deux produits égaux ne sont jamais retrouvés dans un `HashSet`. Quelle correction est la bonne ?
      ```java
      public boolean equals(Produit autre) { return code.equals(autre.code); }
      ```
    choices:
      - {text: "Redéfinir `equals(Object)` avec `@Override`, et `hashCode` avec lui", correct: true}
      - {text: "Redéfinir seulement `hashCode`, en gardant `equals(Produit)`", correct: false}
      - {text: "Remplacer le `HashSet` par un `TreeSet`, qui appelle `equals(Produit)`", correct: false}
      - {text: "Déclarer `equals(Produit)` `final`, pour qu'il ait priorité", correct: false}
    answer: |-
      ```java
      @Override
      public boolean equals(Object o) {
          return o instanceof Produit autre && code.equals(autre.code);
      }
      @Override
      public int hashCode() { return code.hashCode(); }
      ```
      `equals(Produit)` était une surcharge : les collections appellent `equals(Object)`. Avec `@Override`, l'erreur aurait
      été signalée à la compilation.
  - key: bug-suppress-classe
    format: bug-fix
    question: |-
      Un vrai problème de types est passé inaperçu. Quelle correction est la bonne ?
      ```java
      @SuppressWarnings("all")
      public class ImportService { ... 400 lignes ... }
      ```
    choices:
      - {text: "Cibler `@SuppressWarnings(\"unchecked\")` sur le seul cast, avec sa justification", correct: true}
      - {text: "Remplacer `\"all\"` par `\"unchecked\"`, en gardant l'annotation sur la classe", correct: false}
      - {text: "Recopier `@SuppressWarnings(\"all\")` sur chaque méthode de la classe", correct: false}
      - {text: "Retirer l'annotation, et compiler avec l'option `-nowarn`", correct: false}
    answer: |-
      ```java
      public class ImportService {
          ...
          @SuppressWarnings("unchecked") // la désérialisation renvoie toujours une List<Ligne>, vérifié par le schéma
          List<Ligne> lignes = (List<Ligne>) donnees;
      }
      ```
      Masquer tous les avertissements d'une classe cache les problèmes réels. On cible un avertissement précis, au plus
      près, avec sa justification.
  - key: bug-deprecated-muet
    format: bug-fix
    question: |-
      Les utilisateurs de la bibliothèque ne savent pas par quoi remplacer cette méthode. Quelle correction est la bonne ?
      ```java
      @Deprecated
      public Montant calculer(double taux) { ... }
      ```
    choices:
      - {text: "Ajouter `since`, `forRemoval` et un `@deprecated` Javadoc qui nomme le remplaçant", correct: true}
      - {text: "Ajouter seulement `forRemoval = true`, pour un avertissement plus fort", correct: false}
      - {text: "Retirer `@Deprecated`, et prévenir les utilisateurs par courriel", correct: false}
      - {text: "Lever une `UnsupportedOperationException` dans la méthode", correct: false}
    answer: |-
      ```java
      /**
       * @deprecated remplacée par {@link #calculer(BigDecimal)}, qui évite les erreurs d'arrondi ;
       *             sera supprimée en 4.0.
       */
      @Deprecated(since = "3.2", forRemoval = true)
      public Montant calculer(double taux) { ... }
      ```
      Une dépréciation utile dit depuis quand, si la suppression est prévue, et quel est le remplaçant.
  - key: bug-faute-nom
    format: bug-fix
    question: |-
      L'affichage de l'objet reste `Commande@1b6d3586` malgré cette méthode. Pourquoi ?
      ```java
      public String tostring() { return "Commande " + id; }
      ```
    choices:
      - {text: "`tostring` n'est pas `toString` : c'est une nouvelle méthode, pas une redéfinition", correct: true}
      - {text: "`toString` doit être déclarée `final` pour remplacer celle d'`Object`", correct: false}
      - {text: "`println` n'appelle `toString` que si la classe implémente `Serializable`", correct: false}
      - {text: "`id` vaut `null` au moment de l'affichage, et `Object` prend le relais", correct: false}
    answer: |-
      ```java
      @Override
      public String toString() { return "Commande " + id; }
      ```
      La faute de casse créait une nouvelle méthode au lieu de redéfinir `toString`. `@Override` aurait transformé
      l'oubli en erreur de compilation.
