notion: annotations-standard
lesson: |-
  Une **annotation** ajoute une **métadonnée** au code (`@Nom`), lue par le compilateur, des outils ou des frameworks.
  Elle ne change pas le comportement du code à elle seule. Le JDK en fournit quelques-unes :

  ```java
  class Remise implements Comparable<Remise> {

      @Override                                    // le compilateur vérifie qu'on redéfinit bien une méthode
      public int compareTo(Remise autre) { ... }

      @Deprecated(since = "2.3", forRemoval = true) // à ne plus utiliser ; les appelants reçoivent un avertissement
      public double ancienCalcul() { ... }

      @SuppressWarnings("unchecked")               // masque un avertissement précis, au plus près
      List<String> copier(Object o) { return (List<String>) o; }
  }

  @FunctionalInterface                             // le compilateur vérifie qu'il y a une seule méthode abstraite
  interface Regle { boolean respectee(Commande c); }

  @SafeVarargs                                     // promet qu'une méthode varargs générique est sûre
  static <T> List<T> liste(T... elements) { ... }
  ```

  - **`@Override`** : le compilateur refuse la méthode si elle ne redéfinit rien (faute de frappe, mauvais paramètre).
    À mettre **toujours** : sans elle, `equals(Commande c)` au lieu de `equals(Object o)` passe inaperçu et crée une
    **surcharge**.
  - **`@Deprecated`** : signale une API à éviter ; `forRemoval = true` annonce sa suppression (avertissement plus fort).
    On l'accompagne d'un commentaire Javadoc `@deprecated` qui indique le remplaçant.
  - **`@SuppressWarnings`** : à placer sur la plus petite portée possible (une variable, une méthode), avec la raison.
  - **`@FunctionalInterface`** et **`@SafeVarargs`** : des vérifications ou promesses au compilateur.
  - Les frameworks reposent largement sur les annotations : `@Inject`, `@Path`, `@Entity`, `@Test`, `@Transactional`.

  **Piège classique** : redéfinir `equals` sans `@Override`, avec le mauvais type de paramètre. Le code compile, mais
  `HashSet` et `List.contains` appellent toujours `Object.equals` : les objets égaux ne sont jamais reconnus.

  **En entretien** : « Les annotations sont des métadonnées ; `@Override` fait vérifier une redéfinition, `@Deprecated`
  signale une API à abandonner, `@SuppressWarnings` masque un avertissement au plus près, `@FunctionalInterface` vérifie
  une interface fonctionnelle. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'une annotation ?
    answer: Une métadonnée attachée à un élément du code (classe, méthode, champ, paramètre), lue par le compilateur, des outils ou des frameworks ; elle ne change pas le comportement à elle seule.
  - key: override
    format: course
    question: Pourquoi mettre systématiquement `@Override` ?
    answer: Le compilateur vérifie que la méthode redéfinit bien une méthode du parent ou d'une interface ; une faute de nom ou de paramètre devient une erreur au lieu d'une surcharge silencieuse.
  - key: deprecated
    format: course
    question: Comment bien déprécier une méthode ?
    answer: Avec `@Deprecated(since = "...", forRemoval = ...)` et un commentaire Javadoc `@deprecated` qui indique le remplaçant, puis la supprimer après une période annoncée.
  - key: suppress
    format: course
    question: Comment utiliser `@SuppressWarnings` correctement ?
    answer: Sur la plus petite portée possible (une variable ou une méthode, pas toute la classe), pour un avertissement précis, avec un commentaire qui explique pourquoi il est sans danger.
  - key: vf-comportement
    format: true-false
    question: "`@Override` change le comportement de la méthode à l'exécution."
    truth: false
    answer: Il ne sert qu'à la vérification par le compilateur.
  - key: vf-erreur
    format: true-false
    question: "`@Override` sur une méthode qui ne redéfinit rien provoque une erreur de compilation."
    truth: true
    answer: C'est tout son intérêt.
  - key: vf-for-removal
    format: true-false
    question: "`@Deprecated(forRemoval = true)` annonce que l'élément sera supprimé dans une version future."
    truth: true
    answer: Le compilateur émet un avertissement plus fort.
  - key: vf-interface
    format: true-false
    question: "`@Override` est permis sur une méthode qui implémente une méthode d'interface."
    truth: true
    answer: Depuis Java 6.
  - key: qcm-standard
    format: multiple-choice
    question: Lesquelles sont des annotations du JDK ?
    choices:
      - text: "`@Override`"
        correct: true
      - text: "`@FunctionalInterface`"
        correct: true
      - text: "`@Inject`"
        correct: false
      - text: "`@Entity`"
        correct: false
    answer: '`@Inject` vient de Jakarta (CDI), `@Entity` de JPA.'
  - key: qcm-equals
    format: multiple-choice
    question: "Que se passe-t-il avec `@Override public boolean equals(Commande c)` ?"
    choices:
      - text: "Une erreur de compilation, car la méthode ne redéfinit pas `equals(Object)`"
        correct: true
      - text: "Elle redéfinit correctement `equals`"
        correct: false
      - text: "Un avertissement seulement"
        correct: false
      - text: "Une erreur à l'exécution"
        correct: false
    answer: Sans `@Override`, ce serait une surcharge silencieuse.
  - key: qcm-suppress
    format: multiple-choice
    question: Où placer `@SuppressWarnings("unchecked")` ?
    choices:
      - text: "Sur la variable ou la méthode qui contient le cast, avec un commentaire"
        correct: true
      - text: "Sur toute la classe, par confort"
        correct: false
      - text: "Sur le package"
        correct: false
      - text: "Partout, pour ne plus voir d'avertissements"
        correct: false
    answer: Une portée large cache d'autres avertissements utiles.
  - key: qcm-frameworks
    format: multiple-choice
    question: À quoi servent les annotations dans les frameworks ?
    choices:
      - text: "Déclarer le rôle d'une classe ou d'une méthode (`@Path`, `@Transactional`)"
        correct: true
      - text: "Configurer le mapping ou l'injection (`@Entity`, `@Inject`)"
        correct: true
      - text: "Remplacer la compilation"
        correct: false
      - text: "Accélérer le JIT"
        correct: false
    answer: Le framework les lit (à la compilation ou par réflexion) et ajoute le comportement.
  - key: trous-override
    format: fill-in
    question: |-
      Complétez pour faire vérifier la redéfinition :
      ```java
      @___
      public String toString() { return "Commande " + id; }
      ```
    blanks: [[Override]]
    answer: Le compilateur contrôle la signature.
  - key: trous-deprecated
    format: fill-in
    question: |-
      Complétez pour annoncer la suppression de la méthode :
      ```java
      @Deprecated(since = "3.0", ___ = true)
      public void ancienneMethode() { ... }
      ```
    blanks: [[forRemoval]]
    answer: Un avertissement plus fort chez les appelants.
  - key: trous-suppress
    format: fill-in
    question: |-
      Complétez pour masquer l'avertissement du cast non vérifié :
      ```java
      @___("unchecked")
      List<String> l = (List<String>) objet;
      ```
    blanks: [[SuppressWarnings]]
    answer: Au plus près du cast, avec une justification.
  - key: trous-functional
    format: fill-in
    question: |-
      Complétez pour faire vérifier l'interface fonctionnelle :
      ```java
      @___
      interface Convertisseur { String convertir(int x); }
      ```
    blanks: [[FunctionalInterface]]
    answer: Une seule méthode abstraite est permise.
  - key: code-override-erreur
    format: code-output
    question: |-
      ```java
      class Point {
          int x;
          @Override
          public boolean equals(Point autre) { return x == autre.x; }
      }
      ```
    answer: "Ne compile pas : `equals(Point)` ne redéfinit pas `equals(Object)`."
    check:
      compiles: false
  - key: code-surcharge
    format: code-output
    question: |-
      ```java
      class Point {
          int x;
          Point(int x) { this.x = x; }
          public boolean equals(Point autre) { return x == autre.x; }
          public int hashCode() { return x; }
      }
      System.out.println(new Point(1).equals(new Point(1)) + " " + new HashSet<>(List.of(new Point(1))).contains(new Point(1)));
      ```
    answer: '`true false` : sans `@Override`, `equals(Point)` est une surcharge ; `HashSet` appelle `equals(Object)`, celui d''`Object`.'
    check:
      output: "true false"
  - key: code-deprecated
    format: code-output
    question: |-
      ```java
      class Api {
          @Deprecated(since = "2.0", forRemoval = true)
          void ancien() {}
      }
      var d = Api.class.getDeclaredMethod("ancien").getAnnotation(Deprecated.class);
      System.out.println(d.since() + " " + d.forRemoval());
      ```
    answer: '`2.0 true` : `@Deprecated` est conservée à l''exécution.'
    check:
      output: "2.0 true"
  - key: code-override-runtime
    format: code-output
    question: |-
      ```java
      class A { @Override public String toString() { return "A"; } }
      System.out.println(A.class.getDeclaredMethod("toString").getAnnotations().length);
      ```
    answer: '`0` : `@Override` a une rétention `SOURCE`, elle disparaît après la compilation.'
    check:
      output: "0"
  - key: bug-equals-surcharge
    format: bug-fix
    question: |-
      Deux produits égaux ne sont jamais retrouvés dans un `HashSet` :
      ```java
      public boolean equals(Produit autre) { return code.equals(autre.code); }
      ```
    answer: |-
      ```java
      @Override
      public boolean equals(Object o) {
          return o instanceof Produit autre && code.equals(autre.code);
      }
      @Override
      public int hashCode() { return code.hashCode(); }
      ```
      `equals(Produit)` était une surcharge : les collections appellent `equals(Object)`. Avec `@Override`, l'erreur aurait
      été signalée à la compilation.
  - key: bug-suppress-classe
    format: bug-fix
    question: |-
      Un vrai problème de types est passé inaperçu :
      ```java
      @SuppressWarnings("all")
      public class ImportService { ... 400 lignes ... }
      ```
    answer: |-
      ```java
      public class ImportService {
          ...
          @SuppressWarnings("unchecked") // la désérialisation renvoie toujours une List<Ligne>, vérifié par le schéma
          List<Ligne> lignes = (List<Ligne>) donnees;
      }
      ```
      Masquer tous les avertissements d'une classe cache les problèmes réels. On cible un avertissement précis, au plus
      près, avec sa justification.
  - key: bug-deprecated-muet
    format: bug-fix
    question: |-
      Les utilisateurs de la bibliothèque ne savent pas par quoi remplacer cette méthode :
      ```java
      @Deprecated
      public Montant calculer(double taux) { ... }
      ```
    answer: |-
      ```java
      /**
       * @deprecated remplacée par {@link #calculer(BigDecimal)}, qui évite les erreurs d'arrondi ;
       *             sera supprimée en 4.0.
       */
      @Deprecated(since = "3.2", forRemoval = true)
      public Montant calculer(double taux) { ... }
      ```
      Une dépréciation utile dit depuis quand, si la suppression est prévue, et quel est le remplaçant.
  - key: bug-faute-nom
    format: bug-fix
    question: |-
      L'affichage de l'objet reste `Commande@1b6d3586` malgré cette méthode :
      ```java
      public String tostring() { return "Commande " + id; }
      ```
    answer: |-
      ```java
      @Override
      public String toString() { return "Commande " + id; }
      ```
      La faute de casse créait une nouvelle méthode au lieu de redéfinir `toString`. `@Override` aurait transformé
      l'oubli en erreur de compilation.
