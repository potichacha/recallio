notion: reflexion-bases
lesson: |-
  La **réflexion** (`java.lang.reflect`) permet à un programme d'**examiner et manipuler ses propres classes à
  l'exécution** : lister les champs et méthodes, créer des instances, appeler des méthodes connues seulement par leur nom.

  ```java
  Class<?> c = Class.forName("com.recallio.Commande");     // ou Commande.class, ou objet.getClass()

  c.getSimpleName();                       // Commande
  c.getDeclaredFields();                   // tous les champs déclarés (privés compris), sans ceux des parents
  c.getFields();                           // les champs publics, hérités compris
  c.getDeclaredMethods();
  c.getSuperclass(); c.getInterfaces(); c.isRecord(); c.getRecordComponents();

  Object commande = c.getDeclaredConstructor(String.class).newInstance("A1");   // créer
  Method m = c.getMethod("total");
  Object total = m.invoke(commande);                                             // appeler

  Field f = c.getDeclaredField("statut");
  f.setAccessible(true);                   // lever le contrôle d'accès (privé)
  f.set(commande, Statut.PAYEE);
  ```

  - Les méthodes **`getDeclaredXxx`** donnent tout ce que la classe déclare (y compris privé), mais **pas** les membres
    hérités ; **`getXxx`** donne les membres **publics**, hérités compris.
  - Les erreurs sont vérifiées : `ClassNotFoundException`, `NoSuchMethodException`, `IllegalAccessException` ; une
    exception levée par la méthode appelée arrive enveloppée dans une **`InvocationTargetException`** (sa cause est
    l'exception réelle).
  - `setAccessible(true)` contourne `private`, mais pas l'**encapsulation forte des modules** : pour les classes du JDK ou
    d'un module non ouvert, `InaccessibleObjectException`.
  - L'ordre renvoyé par `getDeclaredFields()` ou `getDeclaredMethods()` n'est **pas garanti**.

  Les frameworks reposent sur elle : l'injection de dépendances, Jackson, JPA/Hibernate, JUnit (qui trouve les méthodes
  `@Test`), la sérialisation.

  **Piège classique** : attraper `InvocationTargetException` sans regarder sa cause. Le message ne dit rien ; l'exception
  utile est `e.getCause()`.

  **En entretien** : « `Class`, `Field`, `Method`, `Constructor` pour examiner et appeler à l'exécution ; `getDeclared`
  contre `get`, `setAccessible` limité par les modules, et `InvocationTargetException` qui enveloppe l'exception réelle. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce que la réflexion en Java ?
    answer: La capacité d'un programme à examiner et manipuler ses classes à l'exécution (champs, méthodes, constructeurs, annotations) et à les utiliser sans les connaître à la compilation.
  - key: declared
    format: course
    question: Quelle différence entre `getDeclaredMethods()` et `getMethods()` ?
    answer: '`getDeclaredMethods()` renvoie toutes les méthodes déclarées par la classe, privées comprises, sans les héritées ; `getMethods()` renvoie les méthodes publiques, héritées comprises.'
  - key: invocation-target
    format: course
    question: Qu'est-ce qu'une `InvocationTargetException` ?
    answer: L'enveloppe d'une exception levée par la méthode appelée avec `Method.invoke` ; l'exception réelle est sa cause (`getCause()`).
  - key: usages
    format: course
    question: Quels outils reposent sur la réflexion ?
    answer: Les conteneurs d'injection de dépendances, Jackson, Hibernate et JPA, JUnit (qui découvre les méthodes `@Test`), et les mécanismes de sérialisation.
  - key: vf-declared-herite
    format: true-false
    question: "`getDeclaredFields()` renvoie aussi les champs hérités de la super-classe."
    truth: false
    answer: Seulement ceux déclarés par la classe elle-même.
  - key: vf-private
    format: true-false
    question: La réflexion permet de lire un champ `private` d'une classe de l'application après `setAccessible(true)`.
    truth: true
    answer: Si le module le permet (classe sur le classpath, ou package ouvert).
  - key: vf-ordre
    format: true-false
    question: "L'ordre des champs renvoyés par `getDeclaredFields()` est garanti."
    truth: false
    answer: La spécification ne le garantit pas ; on ne doit pas en dépendre.
  - key: vf-jdk
    format: true-false
    question: "`setAccessible(true)` permet toujours d'accéder aux champs privés des classes du JDK."
    truth: false
    answer: L'encapsulation forte des modules l'interdit (`InaccessibleObjectException`).
  - key: qcm-obtenir
    format: multiple-choice
    question: Comment obtenir l'objet `Class` de `Commande` ?
    choices:
      - text: "`Commande.class`"
        correct: true
      - text: "`commande.getClass()` ou `Class.forName(\"com.recallio.Commande\")`"
        correct: true
      - text: "`new Class(\"Commande\")`"
        correct: false
      - text: "`Commande.getClass()`"
        correct: false
    answer: '`getClass()` est une méthode d''instance.'
  - key: qcm-instancier
    format: multiple-choice
    question: Comment créer une instance par réflexion ?
    choices:
      - text: "`c.getDeclaredConstructor().newInstance()`"
        correct: true
      - text: "`c.getDeclaredConstructor(String.class).newInstance(\"A1\")`"
        correct: true
      - text: "`c.newInstance()`, recommandé"
        correct: false
      - text: "`new c()`"
        correct: false
    answer: '`Class.newInstance()` est déprécié : il propage les exceptions vérifiées sans les déclarer.'
  - key: qcm-cause
    format: multiple-choice
    question: "`method.invoke(obj)` lève `InvocationTargetException`. Où est l'exception utile ?"
    choices:
      - text: "Dans `e.getCause()`"
        correct: true
      - text: "Dans le message de l'exception"
        correct: false
      - text: "Nulle part"
        correct: false
      - text: "Dans `method.getExceptionTypes()`"
        correct: false
    answer: Il faut la journaliser ou la relancer.
  - key: qcm-record
    format: multiple-choice
    question: Comment lister les composants d'un record par réflexion ?
    choices:
      - text: "`c.getRecordComponents()`"
        correct: true
      - text: "`c.getComponents()`"
        correct: false
      - text: "`c.getFields()`"
        correct: false
      - text: "`c.getRecords()`"
        correct: false
    answer: Chaque composant donne son nom, son type et son accesseur.
  - key: code-declared
    format: code-output
    question: |-
      ```java
      class Base { public int id; }
      class Client extends Base { private String nom; public String email; }
      System.out.println(Client.class.getDeclaredFields().length + " " + Client.class.getFields().length);
      ```
    answer: '`2 2` : `nom` et `email` déclarés ; `email` et `id` publics, hérité compris.'
    check:
      output: "2 2"
  - key: code-invoke
    format: code-output
    question: |-
      ```java
      import java.lang.reflect.*;
      class Calcul { int doubler(int x) { return 2 * x; } }
      Method m = Calcul.class.getDeclaredMethod("doubler", int.class);
      System.out.println(m.invoke(new Calcul(), 21));
      ```
    answer: '`42`.'
    check:
      output: "42"
  - key: code-champ-prive
    format: code-output
    question: |-
      ```java
      import java.lang.reflect.*;
      class Compte { private int solde = 100; }
      Compte c = new Compte();
      Field f = Compte.class.getDeclaredField("solde");
      f.setAccessible(true);
      f.set(c, 500);
      System.out.println(f.get(c));
      ```
    answer: '`500` : la réflexion contourne `private` sur une classe de l''application.'
    check:
      output: "500"
  - key: code-invocation-target
    format: code-output
    question: |-
      ```java
      import java.lang.reflect.*;
      class Service { void echouer() { throw new IllegalStateException("panne"); } }
      try {
          Service.class.getDeclaredMethod("echouer").invoke(new Service());
      } catch (InvocationTargetException e) {
          System.out.println(e.getCause().getClass().getSimpleName() + " " + e.getCause().getMessage());
      }
      ```
    answer: '`IllegalStateException panne` : l''exception réelle est la cause.'
    check:
      output: "IllegalStateException panne"
