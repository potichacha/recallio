notion: annotations-personnalisees
lesson: |-
  On déclare une annotation avec **`@interface`**. Deux méta-annotations disent où elle s'applique et jusqu'où elle
  survit :

  ```java
  import java.lang.annotation.*;

  @Retention(RetentionPolicy.RUNTIME)            // visible par réflexion à l'exécution
  @Target({ElementType.METHOD, ElementType.TYPE}) // sur des méthodes et des types
  @Documented                                    // apparaît dans la Javadoc
  public @interface Audite {
      String action();                           // un élément obligatoire
      Niveau niveau() default Niveau.NORMAL;     // un élément avec valeur par défaut
      String[] tags() default {};
  }

  @Audite(action = "suppression", niveau = Niveau.CRITIQUE)
  void supprimerCompte(long id) { ... }

  @interface Version { int value(); }
  @Version(3) class ApiV3 { }                    // un seul élément nommé value : on omet son nom
  ```

  **`@Retention`** :
  - `SOURCE` : jetée par le compilateur (`@Override`, `@SuppressWarnings`) ; sert aux outils et processeurs
    d'annotations ;
  - `CLASS` (par défaut) : écrite dans le `.class`, mais **invisible** par réflexion ; sert aux outils de bytecode ;
  - `RUNTIME` : lisible par réflexion à l'exécution, ce qu'utilisent la plupart des frameworks.

  **`@Target`** limite les emplacements : `TYPE`, `METHOD`, `FIELD`, `PARAMETER`, `CONSTRUCTOR`, `RECORD_COMPONENT`,
  `TYPE_USE` (sur un usage de type : `List<@NonNull String>`)...

  Les éléments d'une annotation sont limités aux **primitifs**, `String`, `Class`, enums, autres annotations et
  **tableaux** de ces types ; leurs valeurs doivent être des **constantes** de compilation (pas de `null`). Autres
  méta-annotations : `@Inherited` (héritée par les sous-classes, pour les classes seulement) et `@Repeatable` (plusieurs
  fois sur le même élément).

  **Piège classique** : oublier `@Retention(RUNTIME)`. La rétention par défaut est `CLASS` : le framework qui cherche
  l'annotation par réflexion ne la trouve jamais, sans aucune erreur.

  **En entretien** : « `@interface` avec des éléments et des valeurs par défaut ; `@Retention(RUNTIME)` pour la lire par
  réflexion, `@Target` pour limiter son emplacement ; `value` permet la forme courte. »
cards:
  - key: trois-retentionpolicy
    format: course
    question: Les trois RetentionPolicy ?
    answer: SOURCE, CLASS (défaut), RUNTIME.
  - key: declarer
    format: course
    question: Comment déclarer une annotation personnalisée ?
    answer: Avec `@interface`, des éléments déclarés comme des méthodes sans paramètre (avec éventuellement `default`), et les méta-annotations `@Retention` et `@Target`.
  - key: value
    format: course
    question: Pourquoi nommer `value` l'élément d'une annotation ?
    answer: "Si c'est le seul élément fourni, on peut omettre son nom : `@Version(3)` au lieu de `@Version(value = 3)`."
  - key: types-elements
    format: course
    question: Quels types peuvent avoir les éléments d'une annotation ?
    answer: Les primitifs, `String`, `Class`, les enums, les annotations et les tableaux de ces types, avec des valeurs constantes (jamais `null`).
  - key: vf-defaut-runtime
    format: true-false
    question: Par défaut, une annotation est visible par réflexion à l'exécution.
    truth: false
    answer: La rétention par défaut est `CLASS`, invisible par réflexion.
  - key: vf-null
    format: true-false
    question: Un élément d'annotation peut avoir `null` comme valeur par défaut.
    truth: false
    answer: On utilise une valeur sentinelle (une chaîne vide, un tableau vide).
  - key: vf-target
    format: true-false
    question: "`@Target(ElementType.METHOD)` interdit de placer l'annotation sur une classe."
    truth: true
    answer: Le compilateur refuse.
  - key: vf-inherited
    format: true-false
    question: "`@Inherited` fait hériter une annotation de classe par les sous-classes."
    truth: true
    answer: Seulement pour les annotations de classe, pas de méthodes ni d'interfaces.
  - key: qcm-retention
    format: multiple-choice
    question: Associez correctement la rétention et son usage.
    choices:
      - text: "`SOURCE` : vérifications du compilateur et processeurs d'annotations"
        correct: true
      - text: "`RUNTIME` : frameworks qui lisent l'annotation par réflexion"
        correct: true
      - text: "`CLASS` : lecture par réflexion"
        correct: false
      - text: "`RUNTIME` : annotation supprimée à la compilation"
        correct: false
    answer: '`CLASS` est écrite dans le bytecode mais invisible par réflexion.'
  - key: qcm-elements
    format: multiple-choice
    question: Lesquels sont des types d'éléments valides ?
    choices:
      - text: "`String[]`"
        correct: true
      - text: "`Class<?>`"
        correct: true
      - text: "`List<String>`"
        correct: false
      - text: "`LocalDate`"
        correct: false
    answer: Les valeurs doivent être des constantes de compilation.
  - key: qcm-type-use
    format: multiple-choice
    question: "Quel `@Target` permet d'écrire `List<@NonNull String>` ?"
    choices:
      - text: "`ElementType.TYPE_USE`"
        correct: true
      - text: "`ElementType.TYPE`"
        correct: false
      - text: "`ElementType.FIELD`"
        correct: false
      - text: "`ElementType.PARAMETER`"
        correct: false
    answer: '`TYPE_USE` vise un usage de type, comme les annotations de nullabilité (JSpecify).'
  - key: qcm-repeatable
    format: multiple-choice
    question: Comment placer plusieurs fois la même annotation sur une méthode ?
    choices:
      - text: "La déclarer `@Repeatable(Conteneur.class)` avec une annotation conteneur"
        correct: true
      - text: "C'est toujours permis"
        correct: false
      - text: "C'est impossible"
        correct: false
      - text: "La déclarer `@Inherited`"
        correct: false
    answer: Le conteneur regroupe les occurrences.
  - key: trous-interface
    format: fill-in
    question: |-
      Complétez la déclaration :
      ```java
      public ___ Mesure { String nom(); }
      ```
    blanks: [["@interface"]]
    answer: Le mot-clé des annotations.
  - key: trous-retention
    format: fill-in
    question: |-
      Complétez pour lire l'annotation par réflexion :
      ```java
      @Retention(RetentionPolicy.___)
      public @interface Audite { String action(); }
      ```
    blanks: [[RUNTIME]]
    answer: Sinon la réflexion ne la voit pas.
  - key: trous-target
    format: fill-in
    question: |-
      Complétez pour n'autoriser l'annotation que sur des champs :
      ```java
      @Target(ElementType.___)
      public @interface Masque { }
      ```
    blanks: [[FIELD]]
    answer: Ailleurs, le compilateur refuse.
  - key: trous-default
    format: fill-in
    question: |-
      Complétez la valeur par défaut :
      ```java
      int delaiSecondes() ___ 30;
      ```
    blanks: [[default]]
    answer: L'élément devient facultatif.
  - key: code-defaut
    format: code-output
    question: |-
      ```java
      import java.lang.annotation.*;
      @Retention(RetentionPolicy.RUNTIME)
      @interface Audite { String action(); int niveau() default 1; }
      @Audite(action = "export") class Rapport {}
      Audite a = Rapport.class.getAnnotation(Audite.class);
      System.out.println(a.action() + " " + a.niveau());
      ```
    answer: '`export 1` : la valeur par défaut s''applique.'
    check:
      output: "export 1"
  - key: code-sans-retention
    format: code-output
    question: |-
      ```java
      @interface Marqueur {}
      @Marqueur class Service {}
      System.out.println(Service.class.getAnnotation(Marqueur.class));
      ```
    answer: '`null` : sans `@Retention(RUNTIME)`, l''annotation n''est pas visible par réflexion.'
    check:
      output: "null"
  - key: code-value
    format: code-output
    question: |-
      ```java
      import java.lang.annotation.*;
      @Retention(RetentionPolicy.RUNTIME)
      @interface Version { int value(); }
      @Version(3) class ApiV3 {}
      System.out.println(ApiV3.class.getAnnotation(Version.class).value());
      ```
    answer: '`3` : l''élément `value` permet la forme courte.'
    check:
      output: "3"
  - key: code-target
    format: code-output
    question: |-
      ```java
      import java.lang.annotation.*;
      @Target(ElementType.METHOD)
      @interface SurMethode {}
      @SurMethode class Mauvais {}
      ```
    answer: "Ne compile pas : l'annotation est limitée aux méthodes."
    check:
      compiles: false
