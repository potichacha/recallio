notion: securite-java
lesson: |-
  Le JDK fournit la cryptographie par la **JCA** (*Java Cryptography Architecture*) : des API standard (`MessageDigest`,
  `Cipher`, `Mac`, `Signature`, `KeyStore`, `SecureRandom`) implémentées par des **fournisseurs** interchangeables.

  ```java
  // Hachage d'intégrité (pas pour les mots de passe)
  byte[] empreinte = MessageDigest.getInstance("SHA-256").digest(contenu);

  // Aléa cryptographique (jetons, sels, clés)
  byte[] jeton = new byte[32];
  SecureRandom.getInstanceStrong().nextBytes(jeton);

  // Chiffrement authentifié : AES-GCM, avec un IV unique par message
  Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
  c.init(Cipher.ENCRYPT_MODE, cle, new GCMParameterSpec(128, iv));
  byte[] chiffre = c.doFinal(clair);

  // Signature d'un message (HMAC) et comparaison en temps constant
  Mac mac = Mac.getInstance("HmacSHA256");
  mac.init(new SecretKeySpec(secret, "HmacSHA256"));
  boolean valide = MessageDigest.isEqual(mac.doFinal(message), signatureRecue);
  ```

  Les règles à connaître :
  - **mots de passe** : jamais un simple SHA-256, mais une fonction **lente et salée** (Argon2, bcrypt, scrypt,
    PBKDF2 via `SecretKeyFactory`), avec une bibliothèque éprouvée ;
  - **aléa** : `SecureRandom`, jamais `Random` ni `Math.random()`, pour tout ce qui doit être imprévisible ;
  - **chiffrement** : AES-**GCM** (authentifié) avec un **IV unique** ; jamais `AES/ECB` (le défaut de
    `Cipher.getInstance("AES")`), qui laisse voir les motifs ;
  - **comparaisons** de secrets en **temps constant** (`MessageDigest.isEqual`), pas `Arrays.equals` ;
  - **clés** dans un **`KeyStore`** (PKCS12) ou un gestionnaire de secrets, jamais dans le code ;
  - **TLS** : laisser le JDK négocier (TLS 1.3), ne jamais désactiver la vérification des certificats ;
  - **XML** : désactiver les DTD et les entités externes (faille **XXE**) ; **désérialisation** native : jamais de
    données non fiables ;
  - « ne pas inventer sa propre crypto » : utiliser les primitives standard et des bibliothèques reconnues.

  Le Security Manager, ancien mécanisme de bac à sable, est déprécié puis désactivé définitivement (Java 24) : on isole
  désormais par le système (conteneurs, processus).

  **Piège classique** : `Cipher.getInstance("AES")`. Le mode par défaut est ECB, sans IV ni authentification : deux blocs
  identiques donnent le même chiffré, et un attaquant peut modifier le message sans être détecté.

  **En entretien** : « JCA pour les primitives ; `SecureRandom` pour l'aléa, Argon2 ou bcrypt pour les mots de passe,
  AES-GCM avec un IV unique pour chiffrer, comparaisons en temps constant, clés hors du code ; et jamais de crypto maison. »
cards:
  - key: faille-xxe
    format: course
    question: "Qu'est-ce qu'une faille XXE ?"
    choices:
      - {text: "Un XML qui référence des entités externes (fichiers, URL), que le parseur va lire", correct: true}
      - {text: "Un script injecté dans une page, exécuté par le navigateur d'un autre utilisateur", correct: false}
      - {text: "Une requête SQL modifiée par une saisie utilisateur qui n'a pas été échappée", correct: false}
      - {text: "Un XML si volumineux qu'il sature la mémoire du serveur par sa seule taille", correct: false}
    answer: |-
      Un XML qui référence des entités externes (fichiers, URL) : le parseur les lit et peut exposer un fichier du
      serveur. Parade : désactiver les DTD et les entités externes. Le script injecté, c'est le XSS.
  - key: mots-de-passe
    format: course
    question: Comment stocker un mot de passe ?
    choices:
      - {text: "Avec un hachage lent et salé conçu pour cela : Argon2, bcrypt, scrypt ou PBKDF2", correct: true}
      - {text: "Avec un SHA-256 sans sel, rapide et disponible dans le JDK", correct: false}
      - {text: "Chiffré en AES, avec une clé gardée dans la configuration", correct: false}
      - {text: "Encodé en Base64, pour qu'il n'apparaisse jamais en clair", correct: false}
    answer: |-
      Avec une fonction de hachage lente et salée conçue pour cela (Argon2, bcrypt, scrypt, PBKDF2), jamais en clair ni
      avec un simple SHA-256 : sa rapidité facilite les attaques par force brute.
  - key: secure-random
    format: course
    question: Pourquoi utiliser `SecureRandom` plutôt que `Random` pour un jeton de session ?
    choices:
      - {text: "`Random` est prévisible : on peut retrouver son état ; `SecureRandom` ne l'est pas", correct: true}
      - {text: "`Random` est trop lent pour générer un jeton à chaque connexion", correct: false}
      - {text: "`Random` ne produit que des nombres, jamais des octets à encoder", correct: false}
      - {text: "`SecureRandom` est thread-safe, contrairement à `Random`", correct: false}
    answer: |-
      `Random` est prévisible (un générateur linéaire dont on peut retrouver l'état) ; `SecureRandom` fournit un aléa
      cryptographique impossible à deviner. Les deux sont thread-safe.
  - key: ecb
    format: course
    question: Pourquoi éviter `Cipher.getInstance("AES")` ?
    choices:
      - {text: "Il utilise par défaut le mode ECB : des blocs identiques donnent des chiffrés identiques", correct: true}
      - {text: "Il utilise par défaut une clé de 56 bits, bien trop courte pour résister", correct: false}
      - {text: "Il utilise par défaut le mode GCM, trop lent pour les gros volumes", correct: false}
      - {text: "Il lève une exception : il faut toujours préciser le fournisseur", correct: false}
    answer: |-
      Il utilise par défaut le mode ECB, sans IV ni authentification, où des blocs identiques donnent des chiffrés
      identiques ; on choisit `AES/GCM/NoPadding` avec un IV unique.
  - key: vf-sha-mdp
    format: true-false
    question: SHA-256 seul est adapté au stockage des mots de passe.
    truth: false
    answer: "Il est trop rapide : un attaquant teste des milliards de mots de passe par seconde ; il faut une fonction lente et salée."
  - key: vf-temps-constant
    format: true-false
    question: Comparer deux signatures avec `Arrays.equals` peut révéler des informations par le temps de réponse.
    truth: true
    answer: La comparaison s'arrête au premier octet différent ; `MessageDigest.isEqual` est en temps constant.
  - key: vf-iv
    format: true-false
    question: Avec AES-GCM, on peut réutiliser le même IV pour plusieurs messages avec la même clé.
    truth: false
    answer: Réutiliser un IV en GCM compromet gravement la confidentialité et l'authenticité.
  - key: vf-security-manager
    format: true-false
    question: Le Security Manager est toujours le moyen recommandé d'isoler du code non fiable.
    truth: false
    answer: Il est déprécié et désactivé depuis Java 24 ; on isole par conteneurs ou processus.
  - key: qcm-choix
    format: multiple-choice
    question: "Laquelle de ces associations entre besoin et outil est juste ?"
    choices:
      - {text: "Générer un jeton de réinitialisation de mot de passe : `SecureRandom`", correct: true}
      - {text: "Stocker un mot de passe en base : un haché MD5 de ce mot de passe", correct: false}
      - {text: "Chiffrer des données sensibles en base : AES en mode ECB", correct: false}
      - {text: "Stocker un mot de passe en base : un SHA-256 rapide, sans sel", correct: false}
    answer: |-
      `SecureRandom` donne un jeton imprévisible (SHA-256 convient, lui, pour vérifier l'intégrité d'un fichier). MD5 est
      cassé et trop rapide, un SHA-256 sans sel aussi pour des mots de passe, et ECB laisse voir les motifs.
  - key: qcm-chiffrement
    format: multiple-choice
    question: Quelle configuration de chiffrement symétrique choisir ?
    choices:
      - {text: "`AES/GCM/NoPadding` avec un IV aléatoire unique par message", correct: true}
      - {text: "`AES` seul, en laissant le fournisseur choisir le mode", correct: false}
      - {text: "`DES/ECB/PKCS5Padding`, standard et disponible partout", correct: false}
      - {text: "Un algorithme maison, que l'attaquant ne connaît pas", correct: false}
    answer: |-
      GCM chiffre et authentifie ; l'IV ne doit jamais être réutilisé avec la même clé. `AES` seul tombe en ECB, DES est
      cassé, et un algorithme maison n'a jamais été éprouvé.
  - key: qcm-xxe
    format: multiple-choice
    question: Comment se protéger d'une attaque XXE lors de la lecture de XML ?
    choices:
      - {text: "Désactiver les DTD et les entités externes dans le parseur", correct: true}
      - {text: "Valider le XML avec un schéma XSD, une fois lu", correct: false}
      - {text: "Augmenter la taille de la pile du thread de lecture", correct: false}
      - {text: "Chiffrer le XML avant de le transmettre au parseur", correct: false}
    answer: |-
      Les parseurs de Java acceptent par défaut des fonctions dangereuses : on désactive DTD et entités externes (avec
      `FEATURE_SECURE_PROCESSING` et l'interdiction des DTD externes). Une validation après la lecture arrive trop tard.
  - key: qcm-cles
    format: multiple-choice
    question: Où conserver une clé de chiffrement d'application ?
    choices:
      - {text: "Dans un gestionnaire de secrets ou un `KeyStore` protégé, fourni à l'exécution", correct: true}
      - {text: "En constante dans le code source, à l'abri dans le bytecode compilé", correct: false}
      - {text: "Dans le dépôt Git, chiffrée avec elle-même pour rester illisible", correct: false}
      - {text: "Dans les journaux de l'application, pour pouvoir la retrouver", correct: false}
    answer: Une clé dans le code est compromise dès que le code l'est.
  - key: scenario-mots-de-passe
    format: scenario
    question: Une ancienne application stocke les mots de passe en SHA-1 sans sel. Comment migres-tu sans forcer tous les utilisateurs à les changer ?
    choices:
      - {text: "Passer à Argon2id ou bcrypt : rehacher à la connexion, ou envelopper tout de suite les SHA-1", correct: true}
      - {text: "Garder SHA-1, et n'ajouter un sel qu'aux mots de passe des nouveaux comptes", correct: false}
      - {text: "Déchiffrer les hachés SHA-1 existants, puis les rehacher avec bcrypt", correct: false}
      - {text: "Passer à SHA-256 sans sel, plus récent et plus long que SHA-1", correct: false}
    answer: |-
      Je passe à une fonction adaptée (Argon2id ou bcrypt) avec une bibliothèque éprouvée. Deux options : à la prochaine
      connexion de chaque utilisateur, je vérifie l'ancien haché, puis je stocke le nouveau calculé sur le mot de passe
      saisi ; ou, tout de suite, je réhache les anciens hachés eux-mêmes (`argon2(sha1(mdp))`) pour protéger aussi les
      comptes inactifs, avec une colonne qui indique le schéma utilisé. Je force la réinitialisation des comptes jamais
      revenus après un délai, et je vérifie que la base n'a pas déjà fuité.
  - key: scenario-webhook
    format: scenario
    question: Ton service reçoit des webhooks d'un prestataire de paiement. Comment vérifier qu'ils viennent bien de lui ?
    choices:
      - {text: "Recalculer le HMAC du corps brut, le comparer en temps constant, refuser les messages anciens", correct: true}
      - {text: "Vérifier que l'adresse IP de l'appelant ressemble à celle du prestataire, sans autre contrôle", correct: false}
      - {text: "Désérialiser le corps en objet, puis comparer la signature reçue avec `equals`", correct: false}
      - {text: "Faire confiance à l'en-tête `User-Agent`, que le prestataire renseigne toujours", correct: false}
    answer: |-
      Le prestataire signe chaque requête avec un secret partagé (HMAC-SHA256 du corps, souvent avec un horodatage) : je
      recalcule la signature avec `Mac` sur le corps brut reçu (avant toute désérialisation), puis je la compare en temps
      constant (`MessageDigest.isEqual`). Je refuse les messages trop anciens (horodatage) pour éviter les rejeux, et je
      traite chaque événement de façon idempotente (identifiant unique). Le secret vient d'un gestionnaire de secrets,
      jamais du code.
  - key: scenario-jeton
    format: scenario
    question: Comment génères-tu un jeton d'invitation à un groupe, envoyé par lien ?
    choices:
      - {text: "32 octets de `SecureRandom` en Base64 URL, et seulement leur haché en base, avec une expiration", correct: true}
      - {text: "Un `UUID` construit avec `Random`, stocké en clair en base, sans date d'expiration", correct: false}
      - {text: "L'identifiant du groupe encodé en Base64, pour pouvoir le relire facilement", correct: false}
      - {text: "L'horodatage de l'envoi en millisecondes, unique pour chaque invitation", correct: false}
    answer: |-
      Avec `SecureRandom` : 32 octets aléatoires encodés en Base64 URL (sans remplissage), assez longs pour ne pas être
      devinés. Je ne stocke en base que le haché du jeton (SHA-256 suffit pour une valeur aléatoire longue), avec sa date
      d'expiration et son groupe ; à l'usage, je hache le jeton reçu et je le cherche. Ainsi une fuite de la base ne donne
      pas de jetons utilisables. Le lien expire, et le jeton est invalidé après usage s'il est à usage unique.
  - key: scenario-tls
    format: scenario
    question: Un appel HTTPS vers un partenaire échoue avec « PKIX path building failed ». Un collègue propose de désactiver la vérification des certificats. Que fais-tu ?
    choices:
      - {text: "Refuser : ajouter l'autorité du partenaire à un truststore dédié, ou lui faire corriger sa chaîne", correct: true}
      - {text: "Accepter : désactiver la vérification des certificats pour ce seul partenaire", correct: false}
      - {text: "Accepter : passer l'appel en HTTP simple, puisque le réseau est interne", correct: false}
      - {text: "Refuser, et réessayer l'appel en boucle jusqu'à ce que l'erreur disparaisse", correct: false}
    answer: |-
      Je refuse : désactiver la vérification ouvre la porte à une attaque de l'homme du milieu. L'erreur signifie que la
      JVM ne fait pas confiance à la chaîne de certificats du partenaire : soit sa chaîne est incomplète (à corriger de son
      côté), soit il utilise une autorité interne. Dans ce cas, j'ajoute le certificat de cette autorité dans un truststore
      dédié (PKCS12), chargé par l'application ou par `javax.net.ssl.trustStore`, et je documente son renouvellement.
