notion: generics-principe
lesson: |-
  Les **generics** (Java 5) paramètrent un type par un autre type : une `List<String>` est une liste **de chaînes**, et
  le compilateur le sait.

  ```java
  // avant Java 5 : une liste d'Object, des casts partout, des erreurs à l'exécution
  List noms = new ArrayList();
  noms.add("Ada");
  noms.add(42);                         // accepté sans rien dire
  String n = (String) noms.get(1);      // ClassCastException à l'exécution

  // avec les generics : l'erreur est détectée à la compilation
  List<String> noms = new ArrayList<>();
  noms.add("Ada");
  noms.add(42);                         // ne compile pas
  String n = noms.get(0);               // pas de cast
  ```

  Ce qu'ils apportent :
  - la **sûreté de type** : une erreur de type devient une erreur de **compilation** au lieu d'une
    `ClassCastException` en production ;
  - la **fin des casts** à la lecture ;
  - un code **réutilisable** : une même classe `List<E>` sert pour tous les types d'éléments ;
  - une **documentation** dans le type : `Map<Utilisateur, List<Commande>>` dit ce qu'elle contient.

  Les paramètres de type ne prennent que des **types objets** (`List<Integer>`, pas `List<int>`) ; l'autoboxing fait le
  lien avec les primitifs.

  **Piège classique** : utiliser une liste brute (`List` sans paramètre) dans du code récent. On perd toutes les
  vérifications, et l'erreur ressurgit loin de sa cause.

  **En entretien** : « Les generics déplacent les erreurs de type de l'exécution vers la compilation, et suppriment les
  casts. »
tour:
  - title: Pourquoi les generics
    text: |-
      Avant les generics (Java 5), une `List` contenait des `Object` : on y mettait n'importe quoi, et chaque lecture
      demandait un transtypage, qui pouvait échouer à l'exécution. Avec `List<String>`, le compilateur sait ce que
      contient la liste : il refuse d'y ajouter un nombre, et la lecture donne directement une `String`.

      Les erreurs de type passent ainsi de l'exécution à la compilation. Essaie : ajoute `noms.add(42);`.
    example:
      files:
        Main.java: |-
          void main() {
              List<String> noms = new ArrayList<>();
              noms.add("Ada");
              noms.add("Grace");
              String premier = noms.get(0);
              IO.println(premier.toUpperCase() + " " + noms.size());

              List brut = new ArrayList();
              brut.add("texte");
              brut.add(42);
              IO.println(brut);
          }
      output: |-
        ADA 2
        [texte, 42]
cards:
  - key: servent-generics
    format: course
    question: À quoi servent les generics ?
    answer: Sécurité de type à la compilation et suppression des casts manuels.
  - key: avant-java-5
    format: course
    question: Comment manipulait-on une collection avant les generics ?
    answer: Les collections contenaient des `Object` ; on castait chaque élément lu, et une erreur de type n'apparaissait qu'à l'exécution, en `ClassCastException`.
  - key: primitifs
    format: course
    question: Peut-on paramétrer un type générique par un primitif ?
    answer: "Non : seulement par des types objets (`List<Integer>`) ; l'autoboxing convertit les `int` ajoutés et lus."
  - key: documentation
    format: course
    question: En quoi les generics documentent-ils le code ?
    answer: Le type dit ce qu'une collection contient (`Map<Client, List<Commande>>`), sans commentaire ni lecture de l'implémentation.
  - key: vf-compilation
    format: true-false
    question: Avec les generics, ajouter un `Integer` dans une `List<String>` est refusé à la compilation.
    truth: true
    answer: C'est leur premier bénéfice.
  - key: vf-cast
    format: true-false
    question: Avec une `List<String>`, il faut caster le résultat de `get` en `String`.
    truth: false
    answer: Le compilateur connaît le type des éléments.
  - key: vf-version
    format: true-false
    question: Les generics sont apparus en Java 5.
    truth: true
    answer: En 2004, avec l'autoboxing, les enums et la boucle `for-each`.
  - key: vf-brute
    format: true-false
    question: Une liste brute (`List` sans paramètre) offre les mêmes vérifications qu'une `List<String>`.
    truth: false
    answer: Le compilateur ne vérifie plus rien, et ne fait qu'avertir.
  - key: qcm-benefices
    format: multiple-choice
    question: Quels sont les bénéfices des generics ?
    choices:
      - text: "Détecter les erreurs de type à la compilation"
        correct: true
      - text: "Supprimer les casts à la lecture"
        correct: true
      - text: "Accélérer l'exécution des collections"
        correct: false
      - text: "Permettre `List<int>`"
        correct: false
    answer: "Les performances ne changent pas : le type est effacé à l'exécution."
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle déclaration dit qu'une `Map` associe un nom à une liste d'âges ?
    choices:
      - text: "`Map<String, List<Integer>>`"
        correct: true
      - text: "`Map<String, List<int>>`"
        correct: false
      - text: "`Map`"
        correct: false
      - text: "`Map<Object, Object>`"
        correct: false
    answer: '`int` n''est pas permis en paramètre de type.'
  - key: qcm-erreur
    format: multiple-choice
    question: Avec une liste brute, quand apparaît l'erreur d'un élément du mauvais type ?
    choices:
      - text: "À l'exécution, au cast de la lecture (`ClassCastException`)"
        correct: true
      - text: "À la compilation"
        correct: false
      - text: "À l'ajout"
        correct: false
      - text: "Jamais"
        correct: false
    answer: Souvent loin de l'endroit où l'élément a été ajouté.
  - key: qcm-reutilisation
    format: multiple-choice
    question: Pourquoi `ArrayList<E>` est-elle réutilisable ?
    choices:
      - text: "Son code est écrit une fois pour un type `E` quelconque"
        correct: true
      - text: "Elle contient une copie pour chaque type"
        correct: false
      - text: "Elle n'accepte que des `String`"
        correct: false
      - text: "Elle utilise la réflexion"
        correct: false
    answer: Le paramètre de type est fixé par chaque utilisation.
  - key: code-classcast
    format: code-output
    question: |-
      ```java
      List liste = new ArrayList();
      liste.add("texte");
      Integer n = (Integer) liste.get(0);
      ```
    answer: "Une `ClassCastException` : la liste brute a accepté une `String`, l'erreur n'apparaît qu'au cast."
    check:
      throws: ClassCastException
  - key: code-compile-pas
    format: code-output
    question: |-
      ```java
      List<String> noms = new ArrayList<>();
      noms.add(42);
      ```
      Ce code compile-t-il ?
    answer: 'Non : `incompatible types: int cannot be converted to String`.'
    check:
      compiles: false
  - key: code-sans-cast
    format: code-output
    question: |-
      ```java
      List<String> noms = new ArrayList<>(List.of("ada"));
      String nom = noms.get(0);
      System.out.println(nom.toUpperCase());
      ```
    answer: '`ADA` : pas de cast, le type est connu.'
    check:
      output: "ADA"
  - key: code-map
    format: code-output
    question: |-
      ```java
      Map<String, Integer> ages = new HashMap<>();
      ages.put("ada", 36);
      int suivant = ages.get("ada") + 1;
      System.out.println(suivant);
      ```
    answer: '`37` : la valeur est un `Integer`, déballé automatiquement.'
    check:
      output: "37"
  - key: bug-liste-brute
    format: bug-fix
    question: |-
      Une `ClassCastException` surgit dans le calcul du total, loin de l'endroit où le mauvais élément a été ajouté :
      ```java
      List prix = new ArrayList();
      prix.add(12.5);
      prix.add("15");   // venu d'un formulaire
      double total = 0;
      for (Object p : prix) total += (Double) p;
      ```
    answer: |-
      ```java
      List<Double> prix = new ArrayList<>();
      prix.add(12.5);
      prix.add(Double.parseDouble("15"));
      double total = 0;
      for (double p : prix) total += p;
      ```
      Avec `List<Double>`, l'ajout d'une `String` est refusé à la compilation, là où l'erreur est commise.
  - key: bug-casts
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      List<Object> clients = depot.tous();
      for (Object o : clients) {
          Client c = (Client) o;
          envoyer(c.email());
      }
      ```
    answer: |-
      ```java
      List<Client> clients = depot.tous();
      for (Client c : clients) {
          envoyer(c.email());
      }
      ```
      Une `List<Object>` oblige à caster et ne garantit rien ; une `List<Client>` dit ce qu'elle contient.
  - key: bug-retour-object
    format: bug-fix
    question: |-
      Chaque appelant doit caster le résultat, et un appel s'est trompé de type :
      ```java
      Object premier(List<?> liste) { return liste.get(0); }
      // String s = (String) premier(noms);
      ```
    answer: |-
      ```java
      <T> T premier(List<T> liste) { return liste.get(0); }
      // String s = premier(noms);
      ```
      Une méthode générique renvoie le type des éléments : plus de cast, et une incohérence devient une erreur de
      compilation.
  - key: bug-map-brute
    format: bug-fix
    question: |-
      Le compilateur avertit (*unchecked*) sur cette table, et une clé `Integer` y a été ajoutée par erreur :
      ```java
      Map index = new HashMap();
      ```
    answer: |-
      ```java
      Map<String, Produit> index = new HashMap<>();
      ```
      Une `Map` paramétrée refuse une clé ou une valeur du mauvais type, et supprime les casts à la lecture.
