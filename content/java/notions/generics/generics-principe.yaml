notion: generics-principe
lesson: |-
  Les **generics** (Java 5) paramètrent un type par un autre type : une `List<String>` est une liste **de chaînes**, et
  le compilateur le sait.

  ```java
  // avant Java 5 : une liste d'Object, des casts partout, des erreurs à l'exécution
  List noms = new ArrayList();
  noms.add("Ada");
  noms.add(42);                         // accepté sans rien dire
  String n = (String) noms.get(1);      // ClassCastException à l'exécution

  // avec les generics : l'erreur est détectée à la compilation
  List<String> noms = new ArrayList<>();
  noms.add("Ada");
  noms.add(42);                         // ne compile pas
  String n = noms.get(0);               // pas de cast
  ```

  Ce qu'ils apportent :
  - la **sûreté de type** : une erreur de type devient une erreur de **compilation** au lieu d'une
    `ClassCastException` en production ;
  - la **fin des casts** à la lecture ;
  - un code **réutilisable** : une même classe `List<E>` sert pour tous les types d'éléments ;
  - une **documentation** dans le type : `Map<Utilisateur, List<Commande>>` dit ce qu'elle contient.

  Les paramètres de type ne prennent que des **types objets** (`List<Integer>`, pas `List<int>`) ; l'autoboxing fait le
  lien avec les primitifs.

  **Piège classique** : utiliser une liste brute (`List` sans paramètre) dans du code récent. On perd toutes les
  vérifications, et l'erreur ressurgit loin de sa cause.

  **En entretien** : « Les generics déplacent les erreurs de type de l'exécution vers la compilation, et suppriment les
  casts. »
tour:
  - title: Pourquoi les generics
    text: |-
      Avant les generics (Java 5), une `List` contenait des `Object` : on y mettait n'importe quoi, et chaque lecture
      demandait un transtypage, qui pouvait échouer à l'exécution. Avec `List<String>`, le compilateur sait ce que
      contient la liste : il refuse d'y ajouter un nombre, et la lecture donne directement une `String`.

      Les erreurs de type passent ainsi de l'exécution à la compilation. Essaie : ajoute `noms.add(42);`.
    example:
      files:
        Main.java: |-
          void main() {
              List<String> noms = new ArrayList<>();
              noms.add("Ada");
              noms.add("Grace");
              String premier = noms.get(0);
              IO.println(premier.toUpperCase() + " " + noms.size());

              List brut = new ArrayList();
              brut.add("texte");
              brut.add(42);
              IO.println(brut);
          }
      output: |-
        ADA 2
        [texte, 42]
cards:
  - key: servent-generics
    format: course
    question: À quoi servent les generics ?
    choices:
      - {text: "À vérifier les types à la compilation, et à supprimer les casts manuels", correct: true}
      - {text: "À accélérer les collections, en évitant les vérifications à l'exécution", correct: false}
      - {text: "À ranger des primitifs dans les collections, sans aucun boxing", correct: false}
      - {text: "À garder le type des éléments à l'exécution, pour la réflexion", correct: false}
    answer: |-
      Sécurité de type à la compilation et suppression des casts manuels. Les performances ne changent pas : les types
      sont effacés à l'exécution.
  - key: avant-java-5
    format: course
    question: Comment manipulait-on une collection avant les generics ?
    choices:
      - {text: "Elles contenaient des `Object`, castés à la lecture, et l'erreur n'apparaissait qu'à l'exécution", correct: true}
      - {text: "On écrivait une classe de collection par type : `StringList`, `IntegerList`, `ClientList`...", correct: false}
      - {text: "On n'avait que des tableaux : les collections sont arrivées avec Java 5, en même temps", correct: false}
      - {text: "On annotait chaque collection du type de ses éléments, et le compilateur le vérifiait", correct: false}
    answer: |-
      Les collections contenaient des `Object` ; on castait chaque élément lu, et une erreur de type n'apparaissait qu'à
      l'exécution, en `ClassCastException`. Les collections existaient depuis Java 1.2 ; Java 5 leur a donné des types.
  - key: primitifs
    format: course
    question: Peut-on paramétrer un type générique par un primitif ?
    choices:
      - {text: "Non, seulement par des types objets ; l'autoboxing convertit les `int`", correct: true}
      - {text: "Oui, depuis Java 8 : `List<int>` vaut alors `List<Integer>`", correct: false}
      - {text: "Oui, mais seulement dans une méthode générique, pas une classe", correct: false}
      - {text: "Non, et l'autoboxing ne fonctionne pas avec les collections", correct: false}
    answer: "Non : seulement par des types objets (`List<Integer>`) ; l'autoboxing convertit les `int` ajoutés et lus."
  - key: documentation
    format: course
    question: En quoi les generics documentent-ils le code ?
    choices:
      - {text: "Le type dit ce que contient une collection, comme `Map<Client, List<Commande>>`", correct: true}
      - {text: "Ils génèrent la Javadoc des collections à partir de leurs paramètres de type", correct: false}
      - {text: "Ils ajoutent le type des éléments au `toString()` de chaque collection", correct: false}
      - {text: "Ils obligent à décrire chaque paramètre de type avec une balise `@param <T>`", correct: false}
    answer: Le type dit ce qu'une collection contient (`Map<Client, List<Commande>>`), sans commentaire ni lecture de l'implémentation.
  - key: vf-compilation
    format: true-false
    question: Avec les generics, ajouter un `Integer` dans une `List<String>` est refusé à la compilation.
    truth: true
    answer: C'est leur premier bénéfice.
  - key: vf-cast
    format: true-false
    question: Avec une `List<String>`, il faut caster le résultat de `get` en `String`.
    truth: false
    answer: Le compilateur connaît le type des éléments.
  - key: vf-version
    format: true-false
    question: Les generics sont apparus en Java 5.
    truth: true
    answer: En 2004, avec l'autoboxing, les enums et la boucle `for-each`.
  - key: vf-brute
    format: true-false
    question: Une liste brute (`List` sans paramètre) offre les mêmes vérifications qu'une `List<String>`.
    truth: false
    answer: Le compilateur ne vérifie plus rien, et ne fait qu'avertir.
  - key: qcm-benefices
    format: multiple-choice
    question: "Quel est le principal bénéfice des generics ?"
    choices:
      - {text: "Détecter les erreurs de type à la compilation", correct: true}
      - {text: "Accélérer l'exécution des collections", correct: false}
      - {text: "Permettre `List<int>` et les autres primitifs", correct: false}
      - {text: "Réduire la mémoire occupée par les collections", correct: false}
    answer: |-
      L'erreur de type se voit à la compilation, et les casts disparaissent à la lecture. Les performances et la mémoire
      ne changent pas : le type est effacé à l'exécution.
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle déclaration dit qu'une `Map` associe un nom à une liste d'âges ?
    choices:
      - text: "`Map<String, List<Integer>>`"
        correct: true
      - text: "`Map<String, List<int>>`"
        correct: false
      - text: "`Map`"
        correct: false
      - text: "`Map<Object, Object>`"
        correct: false
    answer: '`int` n''est pas permis en paramètre de type.'
  - key: qcm-erreur
    format: multiple-choice
    question: Avec une liste brute, quand apparaît l'erreur d'un élément du mauvais type ?
    choices:
      - {text: "À l'exécution, au cast de la lecture (`ClassCastException`)", correct: true}
      - {text: "À la compilation, sur la ligne qui ajoute le mauvais élément", correct: false}
      - {text: "À l'ajout, par une exception levée dans la méthode `add`", correct: false}
      - {text: "Jamais : la liste brute convertit l'élément au bon type", correct: false}
    answer: Souvent loin de l'endroit où l'élément a été ajouté.
  - key: qcm-reutilisation
    format: multiple-choice
    question: Pourquoi `ArrayList<E>` est-elle réutilisable ?
    choices:
      - text: "Son code est écrit une fois pour un type `E` quelconque"
        correct: true
      - text: "Elle contient une copie pour chaque type"
        correct: false
      - text: "Elle n'accepte que des `String`"
        correct: false
      - text: "Elle utilise la réflexion"
        correct: false
    answer: Le paramètre de type est fixé par chaque utilisation.
  - key: code-classcast
    format: code-output
    question: |-
      Que se passe-t-il à l'exécution de ce code ?
      ```java
      List liste = new ArrayList();
      liste.add("texte");
      Integer n = (Integer) liste.get(0);
      ```
    choices:
      - {text: "Une `ClassCastException`, au cast", correct: true}
      - {text: "Une `NumberFormatException`, au cast", correct: false}
      - {text: "Rien : `n` reçoit `null`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      Une `ClassCastException` : la liste brute a accepté une `String`, et l'erreur n'apparaît qu'au cast. Un cast ne
      convertit pas : il ne fait que vérifier le type.
    check:
      throws: ClassCastException
  - key: code-compile-pas
    format: code-output
    question: |-
      ```java
      List<String> noms = new ArrayList<>();
      noms.add(42);
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui : 42 est converti en `\"42\"`", correct: false}
      - {text: "Oui, mais il lève une `ClassCastException`", correct: false}
      - {text: "Oui, avec un avertissement unchecked", correct: false}
    answer: "Ça ne compile pas : `incompatible types: int cannot be converted to String`. L'erreur se voit là où elle est commise."
    check:
      compiles: false
  - key: code-sans-cast
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> noms = new ArrayList<>(List.of("ada"));
      String nom = noms.get(0);
      System.out.println(nom.toUpperCase());
      ```
    choices:
      - {text: "`ADA`", correct: true}
      - {text: "`ada`", correct: false}
      - {text: "`Ada`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`ADA` : pas de cast, le type `String` est connu du compilateur."
    check:
      output: "ADA"
  - key: code-map
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> ages = new HashMap<>();
      ages.put("ada", 36);
      int suivant = ages.get("ada") + 1;
      System.out.println(suivant);
      ```
    choices:
      - {text: "`37`", correct: true}
      - {text: "`361`", correct: false}
      - {text: "`36`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`37` : la valeur est un `Integer`, déballé automatiquement avant l'addition."
    check:
      output: "37"
  - key: bug-liste-brute
    format: bug-fix
    question: |-
      Une `ClassCastException` surgit dans le calcul du total, loin de l'endroit où le mauvais élément a été ajouté.
      Quelle correction est la bonne ?
      ```java
      List prix = new ArrayList();
      prix.add(12.5);
      prix.add("15");   // venu d'un formulaire
      double total = 0;
      for (Object p : prix) total += (Double) p;
      ```
    choices:
      - {text: "Déclarer une `List<Double>`, et convertir la saisie avec `Double.parseDouble`", correct: true}
      - {text: "Garder la liste brute, et n'additionner que les `p instanceof Double`", correct: false}
      - {text: "Caster en `(Number) p` dans la boucle, plutôt qu'en `(Double) p`", correct: false}
      - {text: "Entourer la boucle d'un `try`/`catch (ClassCastException e)`", correct: false}
    answer: |-
      ```java
      List<Double> prix = new ArrayList<>();
      prix.add(12.5);
      prix.add(Double.parseDouble("15"));
      double total = 0;
      for (double p : prix) total += p;
      ```
      Avec `List<Double>`, l'ajout d'une `String` est refusé à la compilation, là où l'erreur est commise.
  - key: bug-casts
    format: bug-fix
    question: |-
      Comment simplifier ce code, en supprimant le cast ?
      ```java
      List<Object> clients = depot.tous();
      for (Object o : clients) {
          Client c = (Client) o;
          envoyer(c.email());
      }
      ```
    choices:
      - {text: "Récupérer une `List<Client>`, et itérer avec `for (Client c : clients)`", correct: true}
      - {text: "Garder la `List<Object>`, et itérer avec `for (Client c : clients)`", correct: false}
      - {text: "Caster la liste entière en `(List<Client>) clients`, puis itérer", correct: false}
      - {text: "Itérer par indice, et appeler `clients.get(i).email()` directement", correct: false}
    answer: |-
      ```java
      List<Client> clients = depot.tous();
      for (Client c : clients) {
          envoyer(c.email());
      }
      ```
      Une `List<Object>` oblige à caster et ne garantit rien ; une `List<Client>` dit ce qu'elle contient.
  - key: bug-retour-object
    format: bug-fix
    question: |-
      Chaque appelant doit caster le résultat, et un appel s'est trompé de type. Quelle correction est la bonne ?
      ```java
      Object premier(List<?> liste) { return liste.get(0); }
      // String s = (String) premier(noms);
      ```
    choices:
      - {text: "Rendre la méthode générique : `<T> T premier(List<T> liste)`", correct: true}
      - {text: "Renvoyer un joker : `? premier(List<?> liste)`, comme le paramètre", correct: false}
      - {text: "Renvoyer `String`, le type le plus courant chez les appelants", correct: false}
      - {text: "Renvoyer un `Optional<Object>`, que l'appelant déballe puis caste", correct: false}
    answer: |-
      ```java
      <T> T premier(List<T> liste) { return liste.get(0); }
      // String s = premier(noms);
      ```
      Une méthode générique renvoie le type des éléments : plus de cast, et une incohérence devient une erreur de
      compilation.
  - key: bug-map-brute
    format: bug-fix
    question: |-
      Le compilateur avertit (*unchecked*) sur cette table, et une clé `Integer` y a été ajoutée par erreur. Quelle
      correction est la bonne ?
      ```java
      Map index = new HashMap();
      ```
    choices:
      - {text: "`Map<String, Produit> index = new HashMap<>();`", correct: true}
      - {text: "`Map<Object, Object> index = new HashMap<>();`", correct: false}
      - {text: "`Map index = new HashMap<String, Produit>();`", correct: false}
      - {text: "`@SuppressWarnings(\"unchecked\") Map index = new HashMap();`", correct: false}
    answer: |-
      ```java
      Map<String, Produit> index = new HashMap<>();
      ```
      Une `Map` paramétrée refuse une clé ou une valeur du mauvais type, et supprime les casts à la lecture.
