notion: effacement-types
lesson: |-
  Les generics n'existent qu'à la **compilation**. Le compilateur vérifie les types, insère les casts, puis **efface**
  les paramètres : dans le bytecode, `List<String>` et `List<Integer>` sont toutes deux une simple `List`, et un `T`
  devient sa borne (`Object` par défaut).

  ```java
  new ArrayList<String>().getClass() == new ArrayList<Integer>().getClass();   // true : la même classe

  class Boite<T> { T contenu; }                     // compilé comme : Object contenu
  class Mesure<T extends Number> { T valeur; }      // compilé comme : Number valeur
  ```

  Conséquences :
  - pas de `instanceof List<String>` (on peut écrire `instanceof List<?>`) ;
  - pas de `new T()`, de `T.class` ni de `new T[n]` : le type n'est pas connu à l'exécution ;
  - deux surcharges qui ne diffèrent que par leur paramètre de type (`f(List<String>)` et `f(List<Integer>)`) ont la
    **même signature effacée** : conflit de noms ;
  - le compilateur génère des **méthodes ponts** (*bridge methods*) : `compareTo(Object)` qui appelle
    `compareTo(Montant)`, pour que le polymorphisme fonctionne après effacement.

  Pourquoi ce choix ? La **compatibilité** : le code générique de Java 5 devait fonctionner avec les bibliothèques et le
  bytecode écrits avant. Les types génériques restent toutefois inscrits dans les **signatures** (champs, méthodes,
  super-classes), lisibles par réflexion : c'est ce qu'utilisent Jackson ou CDI.

  **Piège classique** : vouloir créer un `T` dans une classe générique (`new T()`). Il faut recevoir un `Class<T>` ou un
  `Supplier<T>`.

  **En entretien** : « Les generics sont effacés à la compilation, pour la compatibilité ; d'où l'absence de
  `instanceof List<String>`, de `new T()`, et les méthodes ponts. »
cards:
  - key: type-erasure
    format: course
    question: C'est quoi le type erasure ?
    answer: Les paramètres de type sont effacés à la compilation ; à l'exécution `List<String>` et `List<Integer>` sont la même classe.
  - key: methode-pont
    format: course
    question: C'est quoi une méthode pont ?
    answer: Une méthode synthétique générée pour préserver le polymorphisme après erasure.
  - key: pourquoi
    format: course
    question: Pourquoi Java efface-t-il les types génériques ?
    answer: "Pour la compatibilité avec le code et les bibliothèques écrits avant Java 5 : le bytecode des classes génériques reste celui de classes ordinaires."
  - key: devient
    format: course
    question: En quoi devient un `T` après l'effacement ?
    answer: "En sa borne : `Object` sans borne, `Number` pour `<T extends Number>` (la première borne s'il y en a plusieurs)."
  - key: vf-meme-classe
    format: true-false
    question: "`new ArrayList<String>().getClass() == new ArrayList<Integer>().getClass()` vaut `true`."
    truth: true
    answer: Après effacement, c'est la même classe `ArrayList`.
  - key: vf-instanceof
    format: true-false
    question: "On peut tester `objet instanceof List<String>` sur un `Object`."
    truth: false
    answer: Le paramètre n'existe plus à l'exécution ; on peut tester `instanceof List<?>`.
  - key: vf-surcharge
    format: true-false
    question: Une classe peut déclarer `f(List<String>)` et `f(List<Integer>)`.
    truth: false
    answer: Les deux méthodes ont la même signature effacée, `f(List)`.
  - key: vf-signatures
    format: true-false
    question: Les types génériques d'un champ ou d'une méthode sont lisibles par réflexion.
    truth: true
    answer: Ils restent dans les signatures du bytecode (`getGenericType()`, `getGenericReturnType()`).
  - key: qcm-impossible
    format: multiple-choice
    question: Lesquels sont impossibles à cause de l'effacement ?
    choices:
      - text: "`new T()`"
        correct: true
      - text: "`T.class`"
        correct: true
      - text: "`objet instanceof List<String>`"
        correct: true
      - text: "`List<T> liste = new ArrayList<>()`"
        correct: false
    answer: "Créer une collection de `T` est permis : elle ne contient que des références."
  - key: qcm-borne
    format: multiple-choice
    question: "Dans `class Mesure<T extends Number>`, quel est le type effacé du champ `T valeur` ?"
    choices:
      - text: "`Number`"
        correct: true
      - text: "`Object`"
        correct: false
      - text: "`T`"
        correct: false
      - text: "`Integer`"
        correct: false
    answer: Le paramètre est remplacé par sa borne.
  - key: qcm-pont
    format: multiple-choice
    question: "Pour `class Montant implements Comparable<Montant>`, quelle méthode le compilateur ajoute-t-il ?"
    choices:
      - text: "Un pont `compareTo(Object)` qui caste et appelle `compareTo(Montant)`"
        correct: true
      - text: "Une méthode `equals`"
        correct: false
      - text: "Un constructeur sans argument"
        correct: false
      - text: "Rien"
        correct: false
    answer: Le code qui appelle `Comparable.compareTo(Object)` doit atteindre la version de `Montant`.
  - key: qcm-creer-t
    format: multiple-choice
    question: Comment une classe générique peut-elle créer des instances de `T` ?
    choices:
      - text: "En recevant un `Supplier<T>`"
        correct: true
      - text: "En recevant un `Class<T>` et en appelant son constructeur"
        correct: true
      - text: "Avec `new T()`"
        correct: false
      - text: "Avec `T.class.newInstance()`"
        correct: false
    answer: L'information de type doit être fournie à l'exécution.
  - key: code-meme-classe
    format: code-output
    question: |-
      ```java
      System.out.println(new ArrayList<String>().getClass() == new ArrayList<Integer>().getClass());
      ```
    answer: '`true` : après effacement, les deux sont des `ArrayList`.'
    check:
      output: "true"
  - key: code-instanceof
    format: code-output
    question: |-
      ```java
      Object o = List.of("a");
      boolean b = o instanceof List<String>;
      ```
      Ce code compile-t-il ?
    answer: 'Non : un `Object` ne peut pas être testé en `List<String>` ; seul `instanceof List<?>` est permis.'
    check:
      compiles: false
  - key: code-surcharge
    format: code-output
    question: |-
      ```java
      class C {
          void f(List<String> l) { }
          void f(List<Integer> l) { }
      }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `name clash` ; les deux méthodes ont la même signature effacée.'
    check:
      compiles: false
  - key: code-pont
    format: code-output
    question: |-
      ```java
      class Nom implements Comparable<Nom> {
          public int compareTo(Nom o) { return 0; }
      }
      System.out.println(Arrays.stream(Nom.class.getDeclaredMethods())
              .filter(m -> m.getName().equals("compareTo")).count());
      ```
    answer: '`2` : la méthode écrite, et le pont `compareTo(Object)` généré par le compilateur.'
    check:
      output: "2"
  - key: bug-instanceof
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      if (valeur instanceof List<String> noms) {
          noms.forEach(this::afficher);
      }
      ```
      `valeur` est un `Object` lu d'une configuration.
    answer: |-
      ```java
      if (valeur instanceof List<?> elements) {
          for (Object e : elements) {
              if (e instanceof String nom) afficher(nom);
          }
      }
      ```
      Le type des éléments n'existe pas à l'exécution : on teste la liste avec un joker, puis chaque élément.
  - key: bug-new-t
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      class Fabrique<T> {
          T creer() { return new T(); }
      }
      ```
    answer: |-
      ```java
      class Fabrique<T> {
          private final Supplier<T> constructeur;
          Fabrique(Supplier<T> constructeur) { this.constructeur = constructeur; }
          T creer() { return constructeur.get(); }
      }
      // new Fabrique<>(Commande::new)
      ```
      `T` est effacé : le compilateur ne sait pas quel constructeur appeler. Un `Supplier<T>` fournit la création.
  - key: bug-surcharge
    format: bug-fix
    question: |-
      Ce code ne compile pas (`name clash: importer(List<Client>) and importer(List<Produit>) have the same erasure`) :
      ```java
      void importer(List<Client> clients) { ... }
      void importer(List<Produit> produits) { ... }
      ```
    answer: |-
      ```java
      void importerClients(List<Client> clients) { ... }
      void importerProduits(List<Produit> produits) { ... }
      ```
      Après effacement, les deux signatures sont `importer(List)`. Des noms distincts lèvent l'ambiguïté (et disent mieux
      ce que fait chaque méthode).
  - key: bug-cast-t
    format: bug-fix
    question: |-
      Ce cast ne vérifie rien, et la `ClassCastException` survient bien plus loin :
      ```java
      @SuppressWarnings("unchecked")
      <T> T lire(String cle) { return (T) proprietes.get(cle); }
      // Integer port = lire("port");   // la valeur est une String
      ```
    answer: |-
      ```java
      <T> T lire(String cle, Class<T> type) { return type.cast(proprietes.get(cle)); }
      // Integer port = lire("port", Integer.class);   // échoue ici, avec un message clair
      ```
      Un cast vers `T` est effacé en cast vers `Object` : il ne contrôle rien. `Class.cast` vérifie vraiment le type, à
      l'endroit de l'appel.
