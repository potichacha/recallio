notion: effacement-types
cards:
  - key: type-erasure
    format: course
    question: C'est quoi le type erasure ?
    answer: L'effacement des types génériques à la compilation, pour compatibilité ascendante.
  - key: methode-pont
    format: course
    question: C'est quoi une méthode pont ?
    answer: Une méthode synthétique générée pour préserver le polymorphisme après effacement des types.
