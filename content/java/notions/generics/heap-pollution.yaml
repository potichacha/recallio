notion: heap-pollution
cards:
  - key: pollution-heap
    format: course
    question: C'est quoi la pollution du heap ?
    answer: Une variable paramétrée qui pointe vers un objet du mauvais type, révélée plus tard par une ClassCastException.
  - key: sert-safevarargs
    format: course
    question: À quoi sert @SafeVarargs ?
    answer: À certifier qu'une méthode à varargs génériques ne fait rien de dangereux avec le tableau, pour supprimer l'avertissement.
