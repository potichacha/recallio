notion: heap-pollution
lesson: |-
  La **pollution du tas** (*heap pollution*) survient quand une variable d'un type paramétré référence un objet qui n'est
  pas de ce type : une `List<String>` qui contient un `Integer`. Elle vient des types bruts, des casts non vérifiés... et
  des **varargs génériques**.

  Une méthode `m(T... args)` reçoit en réalité un **tableau**. Comme on ne peut pas créer de tableau de `T`, le
  compilateur crée un tableau du type effacé (`Object[]`), et avertit : *possible heap pollution*.

  ```java
  static <T> T[] enTableau(T... args) {
      return args;                         // DANGER : expose le tableau de varargs
  }
  static <T> T[] deux(T a, T b) {
      return enTableau(a, b);              // ici, T est effacé : le tableau créé est un Object[]
  }
  String[] s = deux("a", "b");             // ClassCastException : Object[] n'est pas un String[]
  ```

  Une méthode à varargs génériques est **sûre** si elle :
  - ne **stocke** rien dans le tableau de varargs ;
  - ne laisse **pas s'échapper** ce tableau (ni le renvoyer, ni le transmettre à du code non fiable).

  On le déclare alors avec **`@SafeVarargs`**, qui supprime l'avertissement chez les appelants. L'annotation n'est
  permise que sur des méthodes qui ne peuvent pas être redéfinies : `static`, `final`, `private` (Java 9) et les
  constructeurs. Exemples de la JDK : `List.of(E...)`, `Arrays.asList(T...)`, `Stream.of(T...)`.

  **Piège classique** : ajouter `@SafeVarargs` pour faire taire l'avertissement d'une méthode qui renvoie son tableau de
  varargs. L'annotation est une **promesse**, pas un correctif.

  **En entretien** : « Les varargs génériques créent un `Object[]` qui peut polluer le tas ; `@SafeVarargs` ne se met que
  si la méthode ne stocke rien dans ce tableau et ne le laisse pas s'échapper. »
cards:
  - key: pollution-heap
    format: course
    question: "Qu'est-ce que la pollution du tas (heap pollution) ?"
    choices:
      - {text: "Une variable d'un type paramétré qui référence un objet d'un autre type", correct: true}
      - {text: "Un tas saturé d'objets génériques que le ramasse-miettes ne libère plus", correct: false}
      - {text: "Une fuite mémoire causée par des listes génériques jamais vidées", correct: false}
      - {text: "Un objet créé sur le tas alors qu'il aurait pu rester sur la pile", correct: false}
    answer: |-
      Une variable d'un type paramétré (`List<String>`) qui référence un objet d'un autre type (une liste d'`Integer`),
      souvent via des varargs génériques ou un cast unchecked. Rien à voir avec une fuite mémoire : l'erreur surgit plus
      tard, en `ClassCastException`.
  - key: sert-safevarargs
    format: course
    question: "À quoi sert `@SafeVarargs` ?"
    choices:
      - {text: "À taire l'avertissement de heap pollution d'une méthode varargs générique sûre", correct: true}
      - {text: "À vérifier à l'exécution le type de chaque élément du tableau de varargs", correct: false}
      - {text: "À autoriser des varargs de types primitifs dans une méthode générique", correct: false}
      - {text: "À rendre la méthode thread-safe quand plusieurs threads lui passent des varargs", correct: false}
    answer: |-
      Elle supprime l'avertissement de heap pollution sur une méthode varargs générique sûre (`static`, `final` ou
      `private`, ou un constructeur). Elle ne vérifie rien : c'est une promesse du développeur.
  - key: conditions-surete
    format: course
    question: Quand une méthode à varargs génériques est-elle sûre ?
    choices:
      - {text: "Quand elle n'écrit rien dans le tableau de varargs, et ne le laisse pas s'échapper", correct: true}
      - {text: "Quand elle est annotée `@SafeVarargs`, qui rend sûr le tableau de varargs", correct: false}
      - {text: "Quand elle garde le tableau de varargs dans un champ, avant de le lire", correct: false}
      - {text: "Quand elle renvoie le tableau de varargs tel quel, sans le modifier", correct: false}
    answer: Quand elle ne stocke rien dans le tableau de varargs et ne le laisse pas s'échapper (ni renvoyé, ni transmis à du code qui pourrait le modifier ou l'exposer).
  - key: pourquoi-object
    format: course
    question: Pourquoi `deux("a", "b")` renvoie-t-il un `Object[]` dans l'exemple `enTableau(T... args)` ?
    choices:
      - {text: "Dans `deux`, `T` est effacé : le tableau de varargs créé est un `Object[]`", correct: true}
      - {text: "Parce que `\"a\"` et `\"b\"` sont des littéraux, typés `Object` par défaut", correct: false}
      - {text: "Parce qu'un varargs générique est toujours un `Object[]`, même appelé directement", correct: false}
      - {text: "Parce que l'autoboxing convertit les `String` en `Object` au moment de l'appel", correct: false}
    answer: "Dans `deux`, `T` est effacé : l'appel à `enTableau(a, b)` crée un tableau de varargs du type effacé, `Object[]`, qui est renvoyé tel quel et ne peut pas être casté en `String[]`."
  - key: vf-safevarargs-instance
    format: true-false
    question: "`@SafeVarargs` peut s'appliquer à une méthode d'instance non finale."
    truth: false
    answer: Une sous-classe pourrait la redéfinir de façon dangereuse ; seules les méthodes `static`, `final`, `private` et les constructeurs sont permis.
  - key: vf-promesse
    format: true-false
    question: "`@SafeVarargs` rend une méthode sûre."
    truth: false
    answer: C'est une promesse du programmeur au compilateur ; si elle est fausse, la pollution reste possible.
  - key: vf-list-of
    format: true-false
    question: "`List.of(E... elements)` est annotée `@SafeVarargs`."
    truth: true
    answer: Elle copie les éléments sans exposer le tableau.
  - key: vf-tableau
    format: true-false
    question: Un paramètre varargs est en réalité un tableau.
    truth: true
    answer: '`T... args` se manipule comme un `T[]`.'
  - key: qcm-surete
    format: multiple-choice
    question: Laquelle de ces méthodes peut être annotée `@SafeVarargs` en toute honnêteté ?
    choices:
      - text: "`static <T> List<T> liste(T... e) { return new ArrayList<>(Arrays.asList(e)); }`"
        correct: true
      - text: "`static <T> T[] enTableau(T... e) { return e; }`"
        correct: false
      - text: "`static void polluer(List<String>... l) { Object[] t = l; t[0] = List.of(1); }`"
        correct: false
      - text: "`static <T> void garder(T... e) { CACHE = e; }`"
        correct: false
    answer: La première copie les éléments ; les autres exposent ou modifient le tableau.
  - key: qcm-ou
    format: multiple-choice
    question: Sur quelles méthodes `@SafeVarargs` est-elle permise ?
    choices:
      - text: "Les méthodes `static`"
        correct: true
      - text: "Les méthodes `private` (Java 9)"
        correct: true
      - text: "Les méthodes `final`"
        correct: true
      - text: "Les méthodes d'instance redéfinissables"
        correct: false
    answer: Et les constructeurs.
  - key: qcm-sources
    format: multiple-choice
    question: Lesquels peuvent provoquer une pollution du tas ?
    choices:
      - text: "Un type brut"
        correct: true
      - text: "Un cast non vérifié `(List<String>) objet`"
        correct: true
      - text: "Un tableau de varargs générique exposé"
        correct: true
      - text: "Une `List<String>` utilisée normalement"
        correct: false
    answer: Ce sont les trois situations où le compilateur avertit (*unchecked*).
  - key: qcm-alternative
    format: multiple-choice
    question: Quelle alternative évite les varargs génériques ?
    choices:
      - text: "Prendre une `List<T>` en paramètre"
        correct: true
      - text: "Prendre un `Object[]`"
        correct: false
      - text: "Utiliser un type brut"
        correct: false
      - text: "Ajouter `@SuppressWarnings(\"all\")`"
        correct: false
    answer: Une liste est vérifiée par le compilateur.
  - key: code-object-tableau
    format: code-output
    question: |-
      Que se passe-t-il à l'exécution de ce code ?
      ```java
      static <T> T[] enTableau(T... args) { return args; }
      static <T> T[] deux(T a, T b) { return enTableau(a, b); }
      String[] s = deux("a", "b");
      ```
    choices:
      - {text: "Une `ClassCastException`", correct: true}
      - {text: "Une `ArrayStoreException`", correct: false}
      - {text: "Rien : `s` contient `a` et `b`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      Une `ClassCastException` : dans `deux`, `T` est effacé, le tableau de varargs créé est un `Object[]`, et il ne peut
      pas être casté en `String[]`.
    check:
      throws: ClassCastException
  - key: code-polluer
    format: code-output
    question: |-
      Que se passe-t-il à l'exécution de ce code ?
      ```java
      static void polluer(List<String>... listes) {
          Object[] t = listes;
          t[0] = List.of(42);
          String s = listes[0].get(0);
      }
      polluer(List.of("a"));
      ```
    choices:
      - {text: "Une `ClassCastException`", correct: true}
      - {text: "Une `ArrayStoreException`", correct: false}
      - {text: "Une `UnsupportedOperationException`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      Une `ClassCastException` : la `List<String>` du tableau contient maintenant un `Integer`. Le tableau est un
      `List[]` effacé : il accepte n'importe quelle liste, sans `ArrayStoreException`.
    check:
      throws: ClassCastException
  - key: code-safevarargs-instance
    format: code-output
    question: |-
      ```java
      class C {
          @SafeVarargs
          <T> void f(T... t) { }
      }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui, sans avertissement", correct: false}
      - {text: "Oui, avec un avertissement unchecked", correct: false}
      - {text: "Oui, mais l'annotation est ignorée", correct: false}
    answer: "Ça ne compile pas : `@SafeVarargs` exige une méthode `static`, `final` ou `private` (ou un constructeur)."
    check:
      compiles: false
  - key: code-sure
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      @SafeVarargs
      static <T> List<T> liste(T... elements) { return List.of(elements); }
      System.out.println(liste("a", "b"));
      ```
    choices:
      - {text: "`[a, b]`", correct: true}
      - {text: "`[a]`", correct: false}
      - {text: "Une `ClassCastException`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`[a, b]` : les éléments sont copiés dans une liste, et le tableau de varargs ne s'échappe pas."
    check:
      output: "[a, b]"
  - key: bug-retour-varargs
    format: bug-fix
    question: |-
      Les appelants reçoivent parfois une `ClassCastException`. Pourquoi ?
      ```java
      @SafeVarargs
      static <T> T[] tableau(T... elements) { return elements; }
      ```
    choices:
      - {text: "Le tableau de varargs s'échappe : appelée depuis du code générique, elle renvoie un `Object[]`", correct: true}
      - {text: "`@SafeVarargs` désactive la vérification des types à l'exécution, et laisse passer l'erreur", correct: false}
      - {text: "Une méthode `static` ne peut pas renvoyer de tableau générique sans un cast explicite", correct: false}
      - {text: "Les varargs copient chaque élément, et la copie perd le type d'origine de l'élément", correct: false}
    answer: |-
      ```java
      @SafeVarargs
      static <T> List<T> liste(T... elements) { return List.of(elements); }
      ```
      Renvoyer le tableau de varargs le laisse s'échapper : appelée depuis du code générique, la méthode renvoie un
      `Object[]`. L'annotation était une fausse promesse ; on renvoie une copie dans une liste.
  - key: bug-stockage
    format: bug-fix
    question: |-
      Une `ClassCastException` surgit loin de cette méthode. Pourquoi ?
      ```java
      static void ajouterDefaut(List<String>... listes) {
          Object[] tableau = listes;
          tableau[0] = new ArrayList<Integer>(List.of(0));
      }
      ```
    choices:
      - {text: "Elle écrit dans le tableau de varargs, vu comme `Object[]`, une liste du mauvais type", correct: true}
      - {text: "Elle reçoit des `List<String>` immuables, que l'affectation ne peut pas modifier", correct: false}
      - {text: "Le tableau de varargs est copié à l'appel, et la copie perd le type de ses éléments", correct: false}
      - {text: "L'`ArrayList<Integer>` est convertie en `List<String>` par l'autoboxing", correct: false}
    answer: |-
      ```java
      static void ajouterDefaut(List<List<String>> listes) {
          listes.set(0, new ArrayList<>(List.of("0")));
      }
      ```
      Écrire dans le tableau de varargs (vu comme `Object[]`) y glisse un objet du mauvais type. Une `List` en paramètre
      est vérifiée par le compilateur.
  - key: bug-annotation-silence
    format: bug-fix
    question: |-
      L'annotation a été ajoutée « pour faire taire l'avertissement ». Pourquoi est-ce une erreur ?
      ```java
      @SafeVarargs
      static <T> void enregistrer(T... valeurs) {
          historique.add(valeurs);   // List<Object[]> statique
      }
      ```
    choices:
      - {text: "La méthode garde le tableau de varargs : il s'échappe, et la promesse est fausse", correct: true}
      - {text: "`@SafeVarargs` n'est permise que sur une méthode d'instance, pas `static`", correct: false}
      - {text: "`@SafeVarargs` ne fait taire aucun avertissement : il faut `@SuppressWarnings`", correct: false}
      - {text: "Un tableau ne peut pas entrer dans une `List<Object[]>` sans un cast explicite", correct: false}
    answer: |-
      ```java
      static <T> void enregistrer(List<T> valeurs) {
          historique.add(List.copyOf(valeurs));
      }
      ```
      La méthode conserve le tableau de varargs : il s'échappe, et la promesse de `@SafeVarargs` est fausse. On reçoit une
      liste et l'on garde une copie immuable.
  - key: bug-safevarargs-instance
    format: bug-fix
    question: |-
      Ce code ne compile pas (`Invalid SafeVarargs annotation`). Quelle correction est la bonne ?
      ```java
      class Journal {
          @SafeVarargs
          <T> void tracer(T... valeurs) {
              for (T v : valeurs) log.info("{}", v);
          }
      }
      ```
    choices:
      - {text: "Rendre la méthode `final`, pour qu'aucune redéfinition ne rompe la promesse", correct: true}
      - {text: "Ajouter `@Override`, pour signaler au compilateur la redéfinition", correct: false}
      - {text: "Rendre la méthode `public`, pour que l'annotation soit visible", correct: false}
      - {text: "Rendre la méthode `abstract`, pour laisser la promesse aux sous-classes", correct: false}
    answer: |-
      ```java
      class Journal {
          @SafeVarargs
          final <T> void tracer(T... valeurs) {
              for (T v : valeurs) log.info("{}", v);
          }
      }
      ```
      Une méthode d'instance doit être `final` (ou `private`) pour qu'aucune redéfinition ne rompe la promesse.
