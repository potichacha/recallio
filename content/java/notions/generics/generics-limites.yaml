notion: generics-limites
cards:
  - key: limitations-type-erasure
    format: course
    question: Limitations du type erasure ?
    answer: Pas de `new T()`, `new T[]`, `instanceof List<String>`, ni surcharge par type générique.
  - key: ecrire-list-int
    format: course
    question: Peut-on écrire `List<int>` ?
    answer: Non, les paramètres de type doivent être des types référence.
