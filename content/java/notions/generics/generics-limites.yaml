notion: generics-limites
lesson: |-
  L'effacement de types et le choix des types objets imposent quelques limites :

  | Impossible | Pourquoi | Alternative |
  |---|---|---|
  | `List<int>` | les paramètres sont des types objets | `List<Integer>`, ou `int[]`, `IntStream` |
  | `new T()` | `T` est effacé | un `Supplier<T>` ou un `Class<T>` |
  | `new T[10]`, `new List<String>[10]` | un tableau doit connaître son type à l'exécution | une `List<T>`, ou `Array.newInstance(type, n)` |
  | `static T champ` | `T` dépend de l'instance | une méthode `static <T>` |
  | `instanceof List<String>` | le paramètre est effacé | `instanceof List<?>` puis tester les éléments |
  | `class Erreur<T> extends Exception` | un `catch` ne pourrait pas distinguer les `Erreur<A>` des `Erreur<B>` | une exception non générique, avec un champ |
  | `f(List<String>)` et `f(List<Integer>)` | même signature effacée | deux noms différents |

  ```java
  static <T> T[] tableau(Class<T> type, int taille) {
      @SuppressWarnings("unchecked")           // sûr : le tableau est créé du type demandé
      T[] t = (T[]) Array.newInstance(type, taille);
      return t;
  }
  ```

  En pratique, on préfère les **listes** aux tableaux dans du code générique : elles s'accordent avec les generics, là
  où les tableaux (covariants, typés à l'exécution) s'y opposent (*Effective Java*, item 28).

  **Piège classique** : `T[] t = (T[]) new Object[n];` dans une classe générique, puis renvoyer ce tableau. L'appelant qui
  attend un `String[]` reçoit une `ClassCastException`.

  **En entretien** : « Pas de primitifs, pas de `new T()`, pas de tableau générique, pas d'exception générique : ce sont
  les conséquences de l'effacement, et la réponse est souvent une `List` ou un `Class<T>`. »
cards:
  - key: limitations-type-erasure
    format: course
    question: Limitations du type erasure ?
    answer: Pas de `new T()`, pas de `instanceof List<String>`, pas de tableau générique, pas de surcharge sur le seul paramètre de type.
  - key: ecrire-list-int
    format: course
    question: Peut-on écrire `List<int>` ?
    answer: Non, les generics n'acceptent que des types objets (`List<Integer>`).
  - key: tableau-generique
    format: course
    question: Pourquoi ne peut-on pas écrire `new T[10]` ?
    answer: Un tableau doit connaître le type de ses éléments à l'exécution (pour lever `ArrayStoreException`), alors que `T` est effacé. On utilise une `List<T>` ou `Array.newInstance(type, n)`.
  - key: exception-generique
    format: course
    question: Pourquoi une exception ne peut-elle pas être générique ?
    answer: Un `catch (Erreur<String> e)` serait impossible à distinguer d'un `catch (Erreur<Integer> e)` après effacement ; le compilateur interdit qu'une classe générique étende `Throwable`.
  - key: vf-list-int
    format: true-false
    question: "`List<int>` est accepté depuis Java 10."
    truth: false
    answer: Les paramètres de type sont toujours des types objets.
  - key: vf-new-t
    format: true-false
    question: "On peut écrire `new T()` dans une classe générique."
    truth: false
    answer: Le type de `T` est inconnu à l'exécution.
  - key: vf-liste-t
    format: true-false
    question: "On peut créer une `new ArrayList<T>()` dans une classe générique."
    truth: true
    answer: Une liste ne stocke que des références ; elle n'a pas besoin de connaître `T`.
  - key: vf-exception
    format: true-false
    question: "`class Erreur<T> extends RuntimeException` compile."
    truth: false
    answer: Une classe générique ne peut pas étendre `Throwable`.
  - key: qcm-impossible
    format: multiple-choice
    question: Lesquelles ne compilent pas ?
    choices:
      - text: "`List<String>[] t = new List<String>[3];`"
        correct: true
      - text: "`List<double> l;`"
        correct: true
      - text: "`List<?>[] t = new List<?>[3];`"
        correct: false
      - text: "`List<List<String>> l = new ArrayList<>();`"
        correct: false
    answer: Un tableau de jokers non bornés est permis ; une liste de listes aussi.
  - key: qcm-creer-t
    format: multiple-choice
    question: Comment une méthode générique peut-elle créer un tableau de `T` du bon type ?
    choices:
      - text: "En recevant un `Class<T>` et en appelant `Array.newInstance(type, n)`"
        correct: true
      - text: "En écrivant `new T[n]`"
        correct: false
      - text: "En castant `new Object[n]`, et en le renvoyant"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: Le cast d'un `Object[]` échoue chez l'appelant qui attend un `String[]`.
  - key: qcm-primitifs
    format: multiple-choice
    question: Que faire pour manipuler beaucoup d'`int` sans boxing ?
    choices:
      - text: "Utiliser un `int[]` ou un `IntStream`"
        correct: true
      - text: "Écrire `List<int>`"
        correct: false
      - text: "Utiliser `List<Object>`"
        correct: false
      - text: "Utiliser `List<Long>`"
        correct: false
    answer: Les generics imposent des objets, donc du boxing.
  - key: qcm-liste-tableau
    format: multiple-choice
    question: Dans du code générique, que préférer en général ?
    choices:
      - text: "Une `List<T>`"
        correct: true
      - text: "Un `T[]`"
        correct: false
      - text: "Un `Object[]` casté"
        correct: false
      - text: "Un type brut"
        correct: false
    answer: Les listes sont invariantes et effacées, comme les generics ; les tableaux, covariants et typés, s'y opposent.
  - key: code-list-int
    format: code-output
    question: |-
      ```java
      List<int> nombres = new ArrayList<>();
      ```
      Ce code compile-t-il ?
    answer: 'Non : un paramètre de type ne peut pas être un primitif.'
    check:
      compiles: false
  - key: code-tableau-generique
    format: code-output
    question: |-
      ```java
      List<String>[] t = new List<String>[3];
      ```
      Ce code compile-t-il ?
    answer: 'Non : `generic array creation`.'
    check:
      compiles: false
  - key: code-array-new-instance
    format: code-output
    question: |-
      ```java
      static <T> T[] tableau(Class<T> type, int n) {
          @SuppressWarnings("unchecked")
          T[] t = (T[]) java.lang.reflect.Array.newInstance(type, n);
          return t;
      }
      String[] s = tableau(String.class, 2);
      System.out.println(s.length + " " + s.getClass().getSimpleName());
      ```
    answer: '`2 String[]` : le tableau est créé du type demandé, grâce au `Class<T>`.'
    check:
      output: "2 String[]"
  - key: code-exception-generique
    format: code-output
    question: |-
      ```java
      class Erreur<T> extends Exception { }
      ```
      Ce code compile-t-il ?
    answer: 'Non : `a generic class may not extend java.lang.Throwable`.'
    check:
      compiles: false
  - key: bug-new-tableau
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      class Tampon<T> {
          private final T[] elements = new T[16];
      }
      ```
    answer: |-
      ```java
      class Tampon<T> {
          private final List<T> elements = new ArrayList<>(16);
      }
      ```
      Un tableau de `T` ne peut pas être créé. Une `List<T>` remplit le même rôle, sans cast ni avertissement.
  - key: bug-cast-object
    format: bug-fix
    question: |-
      L'appelant reçoit une `ClassCastException: Object[] cannot be cast to String[]` :
      ```java
      @SuppressWarnings("unchecked")
      <T> T[] enTableau(List<T> liste) {
          T[] t = (T[]) new Object[liste.size()];
          for (int i = 0; i < t.length; i++) t[i] = liste.get(i);
          return t;
      }
      ```
    answer: |-
      ```java
      <T> T[] enTableau(List<T> liste, IntFunction<T[]> fabrique) {
          return liste.toArray(fabrique.apply(0));
      }
      // String[] s = enTableau(noms, String[]::new);   // ou simplement noms.toArray(String[]::new)
      ```
      Le tableau créé est un `Object[]`, quel que soit le cast. Le type réel doit venir de l'appelant (une fabrique ou un
      `Class<T>`).
  - key: bug-exception-generique
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      class ValidationEchouee<T> extends RuntimeException {
          final T valeur;
      }
      ```
    answer: |-
      ```java
      class ValidationEchouee extends RuntimeException {
          final Object valeur;
          ValidationEchouee(String message, Object valeur) { super(message); this.valeur = valeur; }
      }
      ```
      Une exception ne peut pas être générique. Elle garde la valeur dans un champ `Object` (ou une représentation
      textuelle).
  - key: bug-boxing-liste
    format: bug-fix
    question: |-
      Le calcul d'une moyenne sur dix millions de mesures alloue des millions d'objets :
      ```java
      List<Double> mesures = lire();
      double moyenne = mesures.stream().mapToDouble(Double::doubleValue).average().orElse(0);
      ```
      Les mesures viennent d'un fichier binaire.
    answer: |-
      ```java
      double[] mesures = lireTableau();
      double moyenne = Arrays.stream(mesures).average().orElse(0);
      ```
      Les generics imposent des `Double` (des objets) ; pour de gros volumes numériques, un `double[]` et un
      `DoubleStream` évitent le boxing.
