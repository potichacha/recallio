notion: methodes-generiques
lesson: |-
  Une **méthode générique** déclare ses propres paramètres de type, **avant** son type de retour. Elle peut se trouver
  dans n'importe quelle classe, générique ou non :

  ```java
  static <T> T premier(List<T> liste) {
      return liste.get(0);
  }

  static <K, V> Map<V, K> inverser(Map<K, V> source) {
      Map<V, K> resultat = new HashMap<>();
      source.forEach((k, v) -> resultat.put(v, k));
      return resultat;
  }

  String nom = premier(List.of("Ada", "Alan"));     // T inféré à String
  Integer n = premier(List.of(1, 2));               // T inféré à Integer
  ```

  - Le compilateur **infère** les paramètres à partir des arguments et, depuis Java 8, du **type attendu** du résultat
    (`List<String> vide = Collections.emptyList();`).
  - Si l'inférence ne suffit pas, on donne le type explicitement : `Collections.<String>emptyList()` (*type witness*).
  - Quand les arguments ont des types différents, `T` devient leur **parent commun** : `List.of(1, 2.5)` est une
    `List<Number & Comparable<...>>`.
  - Les méthodes `static` génériques sont le seul moyen d'avoir des paramètres de type dans un contexte `static`
    (fabriques comme `List.of`, `Optional.of`, `Map.entry`).

  **Piège classique** : oublier de déclarer `<T>`. `static T premier(List<T> l)` ne compile pas : `T` n'est déclaré nulle
  part.

  **En entretien** : « Une méthode générique déclare ses paramètres avant le type de retour ; le compilateur les infère
  des arguments et du contexte. »
cards:
  - key: declarer
    format: course
    question: Où déclare-t-on les paramètres de type d'une méthode générique ?
    choices:
      - {text: "Entre les modificateurs et le type de retour : `public static <T> T premier(List<T> l)`", correct: true}
      - {text: "Après le nom de la méthode : `public static T premier<T>(List<T> l)`", correct: false}
      - {text: "Avant les modificateurs : `<T> public static T premier(List<T> l)`", correct: false}
      - {text: "Nulle part : une méthode utilise toujours les paramètres de type de sa classe", correct: false}
    answer: |-
      Entre les modificateurs et le type de retour : `public static <T> T premier(List<T> l)`. Après le nom, c'est la
      syntaxe de C#.
  - key: inference
    format: course
    question: Comment le compilateur choisit-il `T` dans `premier(List.of("a"))` ?
    choices:
      - {text: "Par inférence, d'après le type des arguments et, depuis Java 8, le type attendu", correct: true}
      - {text: "À l'exécution, d'après la classe réelle du premier élément de la liste", correct: false}
      - {text: "Il prend toujours `Object`, sauf si l'appel précise le type entre chevrons", correct: false}
      - {text: "D'après le nom de la variable qui reçoit le résultat de l'appel", correct: false}
    answer: Par inférence, à partir des types des arguments (ici `List<String>`) et, depuis Java 8, du type attendu par le contexte.
  - key: witness
    format: course
    question: Qu'est-ce qu'un *type witness* ?
    choices:
      - {text: "Le paramètre de type précisé à l'appel, comme `Collections.<String>emptyList()`", correct: true}
      - {text: "Un objet `Class<T>` passé en argument, pour garder le type à l'exécution", correct: false}
      - {text: "Une annotation qui documente le paramètre de type attendu par la méthode", correct: false}
      - {text: "Un cast du résultat, comme `(List<String>) Collections.emptyList()`", correct: false}
    answer: |-
      La précision explicite du paramètre de type à l'appel, quand l'inférence ne suffit pas :
      `Collections.<String>emptyList()`. Un `Class<T>` passé en argument, c'est un *type token*.
  - key: parent-commun
    format: course
    question: Que devient `T` quand on appelle `deux(1, 2.5)` avec `static <T> List<T> deux(T a, T b)` ?
    choices:
      - {text: "Leur parent commun le plus précis, ici `Number & Comparable<...>`", correct: true}
      - {text: "Le type du premier argument, `Integer` : `2.5` est alors tronqué", correct: false}
      - {text: "`Double`, car l'entier `1` est élargi en `1.0` à l'appel", correct: false}
      - {text: "Rien : l'appel ne compile pas, les deux types diffèrent", correct: false}
    answer: "Le parent commun le plus précis des deux types, ici `Number & Comparable<...>` : la liste contient un `Integer` et un `Double`."
  - key: vf-classe-generique
    format: true-false
    question: Une méthode générique doit appartenir à une classe générique.
    truth: false
    answer: N'importe quelle classe peut déclarer des méthodes génériques.
  - key: vf-avant-retour
    format: true-false
    question: Les paramètres de type d'une méthode se déclarent après son nom, comme pour une classe.
    truth: false
    answer: Ils se déclarent avant le type de retour.
  - key: vf-contexte
    format: true-false
    question: "Depuis Java 8, `List<String> vide = Collections.emptyList();` infère `T` à partir du type attendu."
    truth: true
    answer: L'inférence tient compte de la cible de l'affectation.
  - key: vf-oubli
    format: true-false
    question: "`static T premier(List<T> l)` compile sans déclarer `<T>`."
    truth: false
    answer: '`T` doit être déclaré : `static <T> T premier(List<T> l)`.'
  - key: qcm-signature
    format: multiple-choice
    question: Quelle signature de méthode générique est correcte ?
    choices:
      - text: "`static <T> T dernier(List<T> l)`"
        correct: true
      - text: "`static T <T> dernier(List<T> l)`"
        correct: false
      - text: "`static T dernier<T>(List<T> l)`"
        correct: false
      - text: "`static <T> dernier(List<T> l)`"
        correct: false
    answer: '`<T>` avant le type de retour, qui reste obligatoire.'
  - key: qcm-fabriques
    format: multiple-choice
    question: "Laquelle de ces méthodes est une méthode `static` générique de la JDK ?"
    choices:
      - {text: "`List.of(...)`", correct: true}
      - {text: "`Math.max(a, b)`", correct: false}
      - {text: "`Integer.parseInt(s)`", correct: false}
      - {text: "`String.length()`", correct: false}
    answer: |-
      `List.of` déclare `<E>` et infère son paramètre de ses arguments, comme `Optional.of` ou `Map.entry`. `Math.max`
      est surchargée pour chaque primitif, sans paramètre de type, et `length()` n'est pas `static`.
  - key: qcm-witness
    format: multiple-choice
    question: Comment préciser explicitement le type d'un appel générique ?
    choices:
      - text: "`Collections.<String>emptyList()`"
        correct: true
      - text: "`Collections.emptyList<String>()`"
        correct: false
      - text: "`<String>Collections.emptyList()`"
        correct: false
      - text: "`Collections.emptyList(String.class)`"
        correct: false
    answer: Les chevrons se placent après le point, avant le nom de la méthode.
  - key: qcm-deux-parametres
    format: multiple-choice
    question: Quelle signature inverse une `Map<K, V>` en `Map<V, K>` ?
    choices:
      - text: "`static <K, V> Map<V, K> inverser(Map<K, V> m)`"
        correct: true
      - text: "`static Map<V, K> inverser(Map<K, V> m)`"
        correct: false
      - text: "`static <K> Map<V, K> inverser(Map<K, V> m)`"
        correct: false
      - text: "`static <K, V> Map inverser(Map m)`"
        correct: false
    answer: Les deux paramètres doivent être déclarés.
  - key: trous-declarer
    format: fill-in
    question: |-
      Complète pour déclarer le paramètre de type de la méthode :
      ```java
      static ___ T premier(List<T> liste) {
          return liste.get(0);
      }
      ```
    blanks: [["<T>"]]
    answer: Le paramètre se déclare avant le type de retour.
  - key: trous-witness
    format: fill-in
    question: |-
      Complète pour préciser le type de la liste vide :
      ```java
      var vide = Collections.<___>emptyList();
      ```
    blanks: [[String]]
    answer: "Avec `var`, il n'y a pas de type cible : le *type witness* fixe `T`."
  - key: trous-echanger
    format: fill-in
    question: |-
      Complète pour échanger deux éléments d'un tableau de n'importe quel type :
      ```java
      static <T> void echanger(___[] t, int i, int j) {
          T tmp = t[i]; t[i] = t[j]; t[j] = tmp;
      }
      ```
    blanks: [[T]]
    answer: Le tableau est un `T[]`.
  - key: trous-retour
    format: fill-in
    question: |-
      Complète le type de retour :
      ```java
      static <T> ___<T> deux(T a, T b) {
          return List.of(a, b);
      }
      ```
    blanks: [[List]]
    answer: La méthode renvoie une `List<T>`.
  - key: code-inference
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static <T> T premier(List<T> l) { return l.get(0); }
      String s = premier(List.of("a", "b"));
      Integer n = premier(List.of(1, 2));
      System.out.println(s + n);
      ```
    choices:
      - {text: "`a1`", correct: true}
      - {text: "`ab`", correct: false}
      - {text: "`a2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`a1` : `T` est inféré à `String`, puis à `Integer`, et chaque appel renvoie le premier élément."
    check:
      output: "a1"
  - key: code-parent-commun
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static <T> List<T> deux(T a, T b) { return List.of(a, b); }
      List<? extends Number> l = deux(1, 2.5);
      System.out.println(l.get(0).getClass().getSimpleName() + " " + l.get(1).getClass().getSimpleName());
      ```
    choices:
      - {text: "`Integer Double`", correct: true}
      - {text: "`Number Number`", correct: false}
      - {text: "`Double Double`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`Integer Double` : `T` est leur parent commun (un `Number`, et `Comparable`), mais chaque élément garde sa classe."
    check:
      output: "Integer Double"
  - key: code-witness
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> vide = Collections.<String>emptyList();
      System.out.println(vide.size() + " " + vide.isEmpty());
      ```
    choices:
      - {text: "`0 true`", correct: true}
      - {text: "`0 false`", correct: false}
      - {text: "`1 false`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`0 true` : le *type witness* fixe `T` à `String`, et la liste est vide."
    check:
      output: "0 true"
  - key: code-mauvais-type
    format: code-output
    question: |-
      ```java
      static <T> T premier(List<T> l) { return l.get(0); }
      String s = premier(List.of(1, 2));
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui, et `s` vaut `\"1\"`", correct: false}
      - {text: "Oui, mais il lève une `ClassCastException`", correct: false}
      - {text: "Oui, avec un avertissement unchecked", correct: false}
    answer: "Ça ne compile pas : `T` est inféré à `Integer`, qui n'est pas une `String`."
    check:
      compiles: false
  - key: bug-object-cast
    format: bug-fix
    question: |-
      Chaque appel doit caster, et l'un d'eux s'est trompé. Quelle correction est la bonne ?
      ```java
      static Object dernier(List<?> liste) {
          return liste.get(liste.size() - 1);
      }
      ```
    choices:
      - {text: "La rendre générique : `static <T> T dernier(List<T> liste)`", correct: true}
      - {text: "Renvoyer un joker : `static ? dernier(List<?> liste)`", correct: false}
      - {text: "Renvoyer `String`, le type le plus fréquent des appelants", correct: false}
      - {text: "Garder `Object`, et tester `instanceof` après chaque appel", correct: false}
    answer: |-
      ```java
      static <T> T dernier(List<T> liste) {
          return liste.get(liste.size() - 1);
      }
      ```
      La méthode générique renvoie le type des éléments ; une erreur de type devient une erreur de compilation.
  - key: bug-t-non-declare
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: class T`). Quelle correction est la bonne ?
      ```java
      static T plusFrequent(List<T> elements) { ... }
      ```
    choices:
      - {text: "`static <T> T plusFrequent(List<T> elements)`", correct: true}
      - {text: "`static T plusFrequent<T>(List<T> elements)`", correct: false}
      - {text: "`<T> static T plusFrequent(List<T> elements)`", correct: false}
      - {text: "`static T<T> plusFrequent(List<T> elements)`", correct: false}
    answer: |-
      ```java
      static <T> T plusFrequent(List<T> elements) { ... }
      ```
      `T` doit être déclaré avant le type de retour.
  - key: bug-trop-specifique
    format: bug-fix
    question: |-
      Ces trois méthodes ne diffèrent que par le type. Quelle correction est la bonne ?
      ```java
      static String premierTexte(List<String> l) { return l.isEmpty() ? null : l.get(0); }
      static Integer premierEntier(List<Integer> l) { return l.isEmpty() ? null : l.get(0); }
      static Client premierClient(List<Client> l) { return l.isEmpty() ? null : l.get(0); }
      ```
    choices:
      - {text: "Une méthode générique : `static <T> Optional<T> premier(List<T> l)`", correct: true}
      - {text: "Une méthode `static Object premier(List<?> l)`, castée par l'appelant", correct: false}
      - {text: "Une méthode qui reçoit une `List` brute, et renvoie son premier élément", correct: false}
      - {text: "Garder les trois méthodes, rangées dans une même classe utilitaire", correct: false}
    answer: |-
      ```java
      static <T> Optional<T> premier(List<T> l) {
          return l.isEmpty() ? Optional.empty() : Optional.of(l.get(0));
      }
      ```
      Une méthode générique remplace les trois (et `Optional` dit mieux que `null` que la liste peut être vide).
  - key: bug-var-sans-cible
    format: bug-fix
    question: |-
      Ce code ne compile pas : la liste est une `List<Object>`. Quelle correction est la bonne ?
      ```java
      var noms = Collections.emptyList();
      String premier = noms.isEmpty() ? "" : noms.get(0);
      ```
    choices:
      - {text: "Déclarer le type : `List<String> noms = Collections.emptyList();`", correct: true}
      - {text: "Écrire `var noms = Collections.emptyList<String>();`", correct: false}
      - {text: "Écrire `var<String> noms = Collections.emptyList();`", correct: false}
      - {text: "Écrire `final var noms`, pour figer le type de la liste", correct: false}
    answer: |-
      ```java
      List<String> noms = Collections.emptyList();
      String premier = noms.isEmpty() ? "" : noms.get(0);
      ```
      Avec `var`, il n'y a pas de type cible : `T` est inféré à `Object`. On déclare le type (ou l'on écrit
      `Collections.<String>emptyList()`).
