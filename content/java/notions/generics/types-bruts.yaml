notion: types-bruts
lesson: |-
  Un **type brut** (*raw type*) est un type générique utilisé **sans** ses paramètres : `List` au lieu de `List<String>`.
  Il n'existe que pour la **compatibilité** avec le code d'avant Java 5.

  ```java
  List<String> noms = new ArrayList<>();
  List brute = noms;            // avertissement : unchecked
  brute.add(42);                // accepté : aucune vérification
  String s = noms.get(0);       // ClassCastException, loin de l'erreur
  ```

  - Avec un type brut, le compilateur ne vérifie plus rien et se contente d'avertissements **unchecked**. Le résultat
    est la **pollution du tas** : une `List<String>` qui contient un `Integer`.
  - Un type brut efface **tous** les generics de la classe, même ceux de méthodes sans rapport avec son paramètre.
  - À ne pas confondre avec **`List<?>`** : une liste d'un type inconnu, mais vérifiée (on ne peut rien y ajouter).
  - Seuls usages légitimes : les **littéraux de classe** (`List.class`, car `List<String>.class` n'existe pas) et
    `instanceof` (où l'on préfère toutefois `instanceof List<?>`).
  - Si un cast non vérifié est inévitable, on met `@SuppressWarnings("unchecked")` sur la **plus petite portée**
    possible (une variable locale), avec un commentaire qui justifie sa sûreté.

  **Piège classique** : ignorer les avertissements *unchecked*. Chacun signale un endroit où une `ClassCastException`
  peut surgir à l'exécution.

  **En entretien** : « Un type brut désactive les vérifications des generics ; il n'existe que pour la compatibilité, et
  chaque avertissement *unchecked* est un risque de `ClassCastException`. »
cards:
  - key: raw-type
    format: course
    question: "Qu'est-ce qu'un type brut (raw type) ?"
    choices:
      - {text: "Un type générique employé sans paramètre, comme `List` : il désactive la vérification", correct: true}
      - {text: "Un type primitif, comme `int`, employé là où un objet est attendu", correct: false}
      - {text: "Un type générique employé avec un joker, comme `List<?>`, en lecture seule", correct: false}
      - {text: "Un type générique paramétré par `Object`, comme `List<Object>`", correct: false}
    answer: |-
      Un type générique sans paramètre (`List`), gardé pour la compatibilité avec le code d'avant Java 5 ; il désactive la
      vérification des types. `List<?>` n'en est pas un : il reste vérifié.
  - key: brut-vs-joker
    format: course
    question: Quelle différence entre `List` et `List<?>` ?
    choices:
      - {text: "`List` désactive toute vérification ; `List<?>` reste vérifiée, et refuse tout ajout", correct: true}
      - {text: "Aucune : `List<?>` est la nouvelle écriture de `List`, depuis Java 5", correct: false}
      - {text: "`List<?>` accepte tout ajout ; `List` refuse tout ajout, sauf `null`", correct: false}
      - {text: "`List` est une liste d'`Object` ; `List<?>` est une liste de `String`", correct: false}
    answer: '`List` (brut) désactive toute vérification et accepte n''importe quel ajout ; `List<?>` reste vérifiée : on ne peut rien y ajouter (sauf `null`), et l''on lit des `Object`.'
  - key: usages-legitimes
    format: course
    question: Où un type brut est-il encore légitime ?
    choices:
      - {text: "Dans les littéraux de classe (`List.class`), et pour parler à du vieux code", correct: true}
      - {text: "Dans les signatures publiques, pour accepter n'importe quelle liste", correct: false}
      - {text: "Dans les variables locales, où l'inférence suffit à vérifier les types", correct: false}
      - {text: "Nulle part : depuis Java 5, le compilateur les refuse tous", correct: false}
    answer: Dans les littéraux de classe (`List.class`), et pour la compatibilité avec du vieux code ; ailleurs, on utilise un type paramétré ou un joker.
  - key: suppress
    format: course
    question: Comment utiliser `@SuppressWarnings("unchecked")` correctement ?
    choices:
      - {text: "Sur la plus petite portée, comme une déclaration de variable, avec la raison en commentaire", correct: true}
      - {text: "Sur la classe entière, pour regrouper tous les casts non vérifiés au même endroit", correct: false}
      - {text: "Sur chaque méthode publique, pour que les appelants ne voient plus l'avertissement", correct: false}
      - {text: "Jamais : mieux vaut garder l'avertissement, quitte à en avoir des dizaines", correct: false}
    answer: Sur la plus petite portée possible (une déclaration de variable plutôt qu'une méthode ou une classe), avec un commentaire qui explique pourquoi le cast est sûr.
  - key: vf-verifie
    format: true-false
    question: Un type brut garde les vérifications de type des generics.
    truth: false
    answer: Il les désactive ; le compilateur ne fait qu'avertir.
  - key: vf-class
    format: true-false
    question: "`List<String>.class` est une expression valide."
    truth: false
    answer: "Les littéraux de classe n'ont pas de paramètre : `List.class`."
  - key: vf-pollution
    format: true-false
    question: Un type brut peut faire entrer un `Integer` dans une `List<String>`.
    truth: true
    answer: C'est la pollution du tas, découverte à la lecture par une `ClassCastException`.
  - key: vf-avertissement
    format: true-false
    question: Un avertissement *unchecked* peut être ignoré sans risque.
    truth: false
    answer: Il signale un endroit où le type n'est plus garanti.
  - key: qcm-brut
    format: multiple-choice
    question: Lesquelles utilisent un type brut ?
    choices:
      - text: "`List noms = new ArrayList();`"
        correct: true
      - text: "`Map index = new HashMap<>();`"
        correct: true
      - text: "`List<?> noms = List.of();`"
        correct: false
      - text: "`List<String> noms = new ArrayList<>();`"
        correct: false
    answer: '`List<?>` est un type paramétré par un joker, pas un type brut.'
  - key: qcm-consequence
    format: multiple-choice
    question: Quelle est la conséquence typique d'un type brut ?
    choices:
      - {text: "Une `ClassCastException` à l'exécution, loin de l'erreur", correct: true}
      - {text: "Une erreur de compilation, sur la ligne du type brut", correct: false}
      - {text: "Une `NullPointerException`, dès la lecture de la liste", correct: false}
      - {text: "Un programme plus rapide, sans vérification des types", correct: false}
    answer: Le compilateur a laissé passer un élément du mauvais type.
  - key: qcm-class
    format: multiple-choice
    question: "Comment obtenir l'objet `Class` de `List` ?"
    choices:
      - text: "`List.class`"
        correct: true
      - text: "`List<String>.class`"
        correct: false
      - text: "`List<?>.class`"
        correct: false
      - text: "`new List().getClass()`"
        correct: false
    answer: Il n'existe qu'une classe `List`, quel que soit son paramètre.
  - key: qcm-suppress
    format: multiple-choice
    question: "Un cast non vérifié est sûr, et tu le documentes. Où mets-tu `@SuppressWarnings(\"unchecked\")` ?"
    choices:
      - {text: "Sur la déclaration de variable concernée, avec un commentaire", correct: true}
      - {text: "Sur toute la classe, pour couvrir tous les casts d'un coup", correct: false}
      - {text: "Sur le package, dans `package-info.java`, une fois pour toutes", correct: false}
      - {text: "Nulle part : il ne faut jamais l'utiliser, même pour un cast sûr", correct: false}
    answer: Une portée large masquerait d'autres avertissements, peut-être dangereux.
  - key: code-pollution
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> noms = new ArrayList<>();
      List brute = noms;
      brute.add(42);
      System.out.println(noms.size() + " " + brute.get(0));
      ```
    choices:
      - {text: "`1 42`", correct: true}
      - {text: "`0 42`", correct: false}
      - {text: "Une `ClassCastException`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `1 42` : l'`Integer` est entré dans la `List<String>` ; lu par la liste brute (un `Object`), aucun cast ne le
      trahit encore.
    check:
      output: "1 42"
  - key: code-class-cast
    format: code-output
    question: |-
      Que se passe-t-il à l'exécution de ce code ?
      ```java
      List<String> noms = new ArrayList<>();
      List brute = noms;
      brute.add(42);
      String premier = noms.get(0);
      ```
    choices:
      - {text: "Une `ClassCastException`", correct: true}
      - {text: "Une `ArrayStoreException`", correct: false}
      - {text: "Rien : `premier` vaut `\"42\"`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "Une `ClassCastException` : le cast vers `String`, inséré par le compilateur, échoue à la lecture."
    check:
      throws: ClassCastException
  - key: code-litteral
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(List.class.getSimpleName() + " " + (new ArrayList<String>() instanceof List<?>));
      ```
    choices:
      - {text: "`List true`", correct: true}
      - {text: "`List<?> true`", correct: false}
      - {text: "`ArrayList true`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`List true` : un littéral de classe brut, et un `instanceof` avec joker, tous deux permis."
    check:
      output: "List true"
  - key: code-class-parametre
    format: code-output
    question: |-
      ```java
      Class<?> c = List<String>.class;
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui, et `c` vaut `List.class`", correct: false}
      - {text: "Oui, avec un avertissement unchecked", correct: false}
      - {text: "Oui, et `c` garde le paramètre `String`", correct: false}
    answer: "Ça ne compile pas : un littéral de classe ne prend pas de paramètre de type ; seul `List.class` existe."
    check:
      compiles: false
  - key: bug-signature-brute
    format: bug-fix
    question: |-
      Cette méthode publique accepte n'importe quoi, et une `ClassCastException` surgit chez l'appelant. Quelle
      correction est la bonne ?
      ```java
      public List filtrerActifs(List clients) { ... }
      ```
    choices:
      - {text: "`public List<Client> filtrerActifs(List<Client> clients)`", correct: true}
      - {text: "`public List<Object> filtrerActifs(List<Object> clients)`", correct: false}
      - {text: "`public List<?> filtrerActifs(List<?> clients)`", correct: false}
      - {text: "`@SuppressWarnings(\"rawtypes\") public List filtrerActifs(List clients)`", correct: false}
    answer: |-
      ```java
      public List<Client> filtrerActifs(List<Client> clients) { ... }
      ```
      Des types paramétrés dans la signature rendent l'API vérifiée par le compilateur.
  - key: bug-suppress-classe
    format: bug-fix
    question: |-
      Un avertissement important a été masqué par cette annotation. Quelle correction est la bonne ?
      ```java
      @SuppressWarnings("unchecked")
      public class Depot { ... }
      ```
    choices:
      - {text: "La retirer de la classe, et la poser sur la seule déclaration concernée, avec la raison", correct: true}
      - {text: "La remplacer par `@SuppressWarnings(\"all\")`, plus explicite sur toute la classe", correct: false}
      - {text: "La déplacer sur le package, dans `package-info.java`, pour la centraliser", correct: false}
      - {text: "La garder, et compiler avec `-Xlint:none` pour cacher aussi les autres", correct: false}
    answer: |-
      ```java
      public class Depot {
          ...
          @SuppressWarnings("unchecked") // sûr : la map n'est remplie que par ajouter(Class<T>, T)
          T valeur = (T) valeurs.get(type);
          ...
      }
      ```
      Sur toute la classe, l'annotation cache tous les avertissements, présents et futurs. On la limite à la déclaration
      concernée, avec la raison.
  - key: bug-comparable-brut
    format: bug-fix
    question: |-
      Le compilateur avertit (*unchecked call to compareTo*). Quelle correction est la bonne ?
      ```java
      static Comparable max(Comparable a, Comparable b) {
          return a.compareTo(b) >= 0 ? a : b;
      }
      ```
    choices:
      - {text: "`static <T extends Comparable<? super T>> T max(T a, T b)`", correct: true}
      - {text: "`static Comparable<?> max(Comparable<?> a, Comparable<?> b)`", correct: false}
      - {text: "`static Object max(Object a, Object b)`, avec un cast", correct: false}
      - {text: "`@SuppressWarnings(\"unchecked\") static Comparable max(...)`", correct: false}
    answer: |-
      ```java
      static <T extends Comparable<? super T>> T max(T a, T b) {
          return a.compareTo(b) >= 0 ? a : b;
      }
      ```
      Avec `Comparable` brut, on peut comparer une `String` à un `Integer`. La méthode générique bornée vérifie que les
      deux arguments sont comparables entre eux.
  - key: bug-ancien-code
    format: bug-fix
    question: |-
      Une vieille bibliothèque renvoie une `List` brute de noms. Comment la convertir sans propager le type brut ?
      ```java
      List noms = vieilleApi.noms();
      ```
    choices:
      - {text: "Copier dans une `List<String>`, en castant chaque élément à la frontière", correct: true}
      - {text: "Caster la liste entière : `(List<String>) vieilleApi.noms()`", correct: false}
      - {text: "Garder la `List` brute partout, et caster chaque élément à l'usage", correct: false}
      - {text: "Déclarer `List<?> noms`, et lire chaque élément comme une `String`", correct: false}
    answer: |-
      ```java
      List<String> noms = new ArrayList<>();
      for (Object o : vieilleApi.noms()) {
          noms.add((String) o);   // vérifié élément par élément, à la frontière
      }
      ```
      On convertit à la frontière en vérifiant chaque élément : une erreur apparaît tout de suite, et le reste du code ne
      voit que des `List<String>`.
