notion: types-bruts
lesson: |-
  Un **type brut** (*raw type*) est un type générique utilisé **sans** ses paramètres : `List` au lieu de `List<String>`.
  Il n'existe que pour la **compatibilité** avec le code d'avant Java 5.

  ```java
  List<String> noms = new ArrayList<>();
  List brute = noms;            // avertissement : unchecked
  brute.add(42);                // accepté : aucune vérification
  String s = noms.get(0);       // ClassCastException, loin de l'erreur
  ```

  - Avec un type brut, le compilateur ne vérifie plus rien et se contente d'avertissements **unchecked**. Le résultat
    est la **pollution du tas** : une `List<String>` qui contient un `Integer`.
  - Un type brut efface **tous** les generics de la classe, même ceux de méthodes sans rapport avec son paramètre.
  - À ne pas confondre avec **`List<?>`** : une liste d'un type inconnu, mais vérifiée (on ne peut rien y ajouter).
  - Seuls usages légitimes : les **littéraux de classe** (`List.class`, car `List<String>.class` n'existe pas) et
    `instanceof` (où l'on préfère toutefois `instanceof List<?>`).
  - Si un cast non vérifié est inévitable, on met `@SuppressWarnings("unchecked")` sur la **plus petite portée**
    possible (une variable locale), avec un commentaire qui justifie sa sûreté.

  **Piège classique** : ignorer les avertissements *unchecked*. Chacun signale un endroit où une `ClassCastException`
  peut surgir à l'exécution.

  **En entretien** : « Un type brut désactive les vérifications des generics ; il n'existe que pour la compatibilité, et
  chaque avertissement *unchecked* est un risque de `ClassCastException`. »
cards:
  - key: raw-type
    format: course
    question: C'est quoi un raw type ?
    answer: Un type générique sans paramètre, pour la compatibilité pré-Java 5 ; il désactive la vérification.
  - key: brut-vs-joker
    format: course
    question: Quelle différence entre `List` et `List<?>` ?
    answer: '`List` (brut) désactive toute vérification et accepte n''importe quel ajout ; `List<?>` reste vérifiée : on ne peut rien y ajouter (sauf `null`), et l''on lit des `Object`.'
  - key: usages-legitimes
    format: course
    question: Où un type brut est-il encore légitime ?
    answer: Dans les littéraux de classe (`List.class`), et pour la compatibilité avec du vieux code ; ailleurs, on utilise un type paramétré ou un joker.
  - key: suppress
    format: course
    question: Comment utiliser `@SuppressWarnings("unchecked")` correctement ?
    answer: Sur la plus petite portée possible (une déclaration de variable plutôt qu'une méthode ou une classe), avec un commentaire qui explique pourquoi le cast est sûr.
  - key: vf-verifie
    format: true-false
    question: Un type brut garde les vérifications de type des generics.
    truth: false
    answer: Il les désactive ; le compilateur ne fait qu'avertir.
  - key: vf-class
    format: true-false
    question: "`List<String>.class` est une expression valide."
    truth: false
    answer: "Les littéraux de classe n'ont pas de paramètre : `List.class`."
  - key: vf-pollution
    format: true-false
    question: Un type brut peut faire entrer un `Integer` dans une `List<String>`.
    truth: true
    answer: C'est la pollution du tas, découverte à la lecture par une `ClassCastException`.
  - key: vf-avertissement
    format: true-false
    question: Un avertissement *unchecked* peut être ignoré sans risque.
    truth: false
    answer: Il signale un endroit où le type n'est plus garanti.
  - key: qcm-brut
    format: multiple-choice
    question: Lesquelles utilisent un type brut ?
    choices:
      - text: "`List noms = new ArrayList();`"
        correct: true
      - text: "`Map index = new HashMap<>();`"
        correct: true
      - text: "`List<?> noms = List.of();`"
        correct: false
      - text: "`List<String> noms = new ArrayList<>();`"
        correct: false
    answer: '`List<?>` est un type paramétré par un joker, pas un type brut.'
  - key: qcm-consequence
    format: multiple-choice
    question: Quelle est la conséquence typique d'un type brut ?
    choices:
      - text: "Une `ClassCastException` à l'exécution, loin de l'erreur"
        correct: true
      - text: "Une erreur de compilation"
        correct: false
      - text: "Une `NullPointerException` immédiate"
        correct: false
      - text: "Un programme plus rapide"
        correct: false
    answer: Le compilateur a laissé passer un élément du mauvais type.
  - key: qcm-class
    format: multiple-choice
    question: "Comment obtenir l'objet `Class` de `List` ?"
    choices:
      - text: "`List.class`"
        correct: true
      - text: "`List<String>.class`"
        correct: false
      - text: "`List<?>.class`"
        correct: false
      - text: "`new List().getClass()`"
        correct: false
    answer: Il n'existe qu'une classe `List`, quel que soit son paramètre.
  - key: qcm-suppress
    format: multiple-choice
    question: Où placer `@SuppressWarnings("unchecked")` ?
    choices:
      - text: "Sur la déclaration de variable concernée, avec un commentaire"
        correct: true
      - text: "Sur toute la classe, pour être tranquille"
        correct: false
      - text: "Sur le package"
        correct: false
      - text: "Nulle part, il ne faut jamais l'utiliser"
        correct: false
    answer: Une portée large masquerait d'autres avertissements, peut-être dangereux.
  - key: code-pollution
    format: code-output
    question: |-
      ```java
      List<String> noms = new ArrayList<>();
      List brute = noms;
      brute.add(42);
      System.out.println(noms.size() + " " + brute.get(0));
      ```
    answer: '`1 42` : l''`Integer` est entré dans la `List<String>` ; lu par la liste brute (un `Object`), aucun cast ne le trahit encore.'
    check:
      output: "1 42"
  - key: code-class-cast
    format: code-output
    question: |-
      ```java
      List<String> noms = new ArrayList<>();
      List brute = noms;
      brute.add(42);
      String premier = noms.get(0);
      ```
    answer: "Une `ClassCastException` : le cast vers `String`, inséré par le compilateur, échoue à la lecture."
    check:
      throws: ClassCastException
  - key: code-litteral
    format: code-output
    question: |-
      ```java
      System.out.println(List.class.getSimpleName() + " " + (new ArrayList<String>() instanceof List<?>));
      ```
    answer: '`List true` : un littéral de classe et un `instanceof` avec joker.'
    check:
      output: "List true"
  - key: code-class-parametre
    format: code-output
    question: |-
      ```java
      Class<?> c = List<String>.class;
      ```
      Ce code compile-t-il ?
    answer: 'Non : un littéral de classe ne prend pas de paramètre de type.'
    check:
      compiles: false
  - key: bug-signature-brute
    format: bug-fix
    question: |-
      Cette méthode publique accepte n'importe quoi, et une `ClassCastException` surgit chez l'appelant :
      ```java
      public List filtrerActifs(List clients) { ... }
      ```
    answer: |-
      ```java
      public List<Client> filtrerActifs(List<Client> clients) { ... }
      ```
      Des types paramétrés dans la signature rendent l'API vérifiée par le compilateur.
  - key: bug-suppress-classe
    format: bug-fix
    question: |-
      Un avertissement important a été masqué par cette annotation :
      ```java
      @SuppressWarnings("unchecked")
      public class Depot { ... }
      ```
    answer: |-
      ```java
      public class Depot {
          ...
          @SuppressWarnings("unchecked") // sûr : la map n'est remplie que par ajouter(Class<T>, T)
          T valeur = (T) valeurs.get(type);
          ...
      }
      ```
      Sur toute la classe, l'annotation cache tous les avertissements, présents et futurs. On la limite à la déclaration
      concernée, avec la raison.
  - key: bug-comparable-brut
    format: bug-fix
    question: |-
      Le compilateur avertit (*unchecked call to compareTo*) :
      ```java
      static Comparable max(Comparable a, Comparable b) {
          return a.compareTo(b) >= 0 ? a : b;
      }
      ```
    answer: |-
      ```java
      static <T extends Comparable<? super T>> T max(T a, T b) {
          return a.compareTo(b) >= 0 ? a : b;
      }
      ```
      Avec `Comparable` brut, on peut comparer une `String` à un `Integer`. La méthode générique bornée vérifie que les
      deux arguments sont comparables entre eux.
  - key: bug-ancien-code
    format: bug-fix
    question: |-
      Une vieille bibliothèque renvoie une `List` brute de noms. Comment la convertir sans propager le type brut ?
      ```java
      List noms = vieilleApi.noms();
      ```
    answer: |-
      ```java
      List<String> noms = new ArrayList<>();
      for (Object o : vieilleApi.noms()) {
          noms.add((String) o);   // vérifié élément par élément, à la frontière
      }
      ```
      On convertit à la frontière en vérifiant chaque élément : une erreur apparaît tout de suite, et le reste du code ne
      voit que des `List<String>`.
