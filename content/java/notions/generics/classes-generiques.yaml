notion: classes-generiques
lesson: |-
  Une classe (ou une interface, ou un record) **générique** déclare des **paramètres de type** entre chevrons, utilisés
  dans ses champs et ses méthodes :

  ```java
  public class Boite<T> {                    // T : un type choisi par chaque utilisation
      private final T contenu;

      public Boite(T contenu) { this.contenu = contenu; }

      public T contenu() { return contenu; }

      public <R> Boite<R> transformer(Function<T, R> f) {   // une méthode générique en plus
          return new Boite<>(f.apply(contenu));
      }
  }

  Boite<String> nom = new Boite<>("Ada");
  Boite<Integer> longueur = nom.transformer(String::length);

  record Paire<A, B>(A premier, B second) { }               // plusieurs paramètres
  interface Depot<T, ID> { Optional<T> trouver(ID id); void enregistrer(T t); }
  ```

  - **Conventions de nom** : une lettre majuscule, `T` (type), `E` (élément), `K` et `V` (clé, valeur), `R` (résultat),
    `ID`.
  - Une classe qui **implémente** une interface générique fixe ses paramètres (`class Longueur implements
    Convertisseur<String, Integer>`) ou les garde (`class ListeChainee<E> implements List<E>`).
  - Les paramètres de type appartiennent aux **instances** : un champ ou une méthode `static` ne peut pas utiliser `T`
    (une méthode `static` déclare ses propres paramètres : `static <T> Boite<T> de(T t)`).

  **Piège classique** : écrire `BoiteDeTexte`, `BoiteDEntier`, `BoiteDeDate`... avec le même code. Une seule classe
  générique suffit.

  **En entretien** : « Une classe générique déclare des paramètres de type, fixés par chaque utilisation ; un membre
  `static` ne peut pas utiliser ceux de la classe. »
tour:
  - title: Les classes génériques
    text: |-
      Une classe générique déclare un **paramètre de type** entre chevrons : `class Boite<T>`. `T` s'emploie dans la
      classe comme un type, et on le fixe à l'usage : `Boite<String>`. Une seule classe sert ainsi pour tous les types,
      sans perdre la vérification du compilateur.

      Les méthodes peuvent être génériques aussi : `<T> T dernier(List<T> liste)`. Par convention, les paramètres de
      type sont des majuscules seules : `T`, `E` pour un élément, `K` et `V` pour une clé et une valeur.
    example:
      files:
        Main.java: |-
          record Paire<A, B>(A premier, B second) {}

          class Boite<T> {
              private T contenu;

              void range(T objet) {
                  contenu = objet;
              }

              T ouvre() {
                  return contenu;
              }
          }

          <T> T dernier(List<T> liste) {
              return liste.get(liste.size() - 1);
          }

          void main() {
              Boite<String> boite = new Boite<>();
              boite.range("livres");
              IO.println(boite.ouvre().length());

              Paire<String, Integer> age = new Paire<>("Ada", 36);
              IO.println(age.premier() + " : " + age.second());
              IO.println(dernier(List.of(1, 2, 3)));
          }
      output: |-
        6
        Ada : 36
        3
cards:
  - key: declarer
    format: course
    question: Comment déclare-t-on une classe générique ?
    choices:
      - {text: "Avec des paramètres de type entre chevrons, après son nom : `class Boite<T>`", correct: true}
      - {text: "Avec des paramètres de type entre chevrons, avant son nom : `class <T> Boite`", correct: false}
      - {text: "En héritant d'une classe `Generic<T>`, qui fournit le paramètre `T`", correct: false}
      - {text: "Avec une annotation `@Generic(T.class)` posée sur la déclaration", correct: false}
    answer: |-
      Avec des paramètres de type entre chevrons après son nom (`class Boite<T>`), utilisables ensuite comme des types
      dans ses champs et ses méthodes. Les chevrons avant le nom de retour, c'est la syntaxe d'une méthode générique.
  - key: conventions
    format: course
    question: "Quelle est la convention de nom des paramètres de type en Java ?"
    choices:
      - {text: "Une majuscule : `T` pour un type, `E` un élément, `K` et `V` clé et valeur", correct: true}
      - {text: "Un nom en PascalCase : `Type`, `Element`, `Key` et `Value`", correct: false}
      - {text: "Une minuscule : `t` pour un type, `e` un élément, `k` et `v` clé et valeur", correct: false}
      - {text: "Un préfixe `T` suivi du rôle : `TType`, `TElement`, `TKey` et `TValue`", correct: false}
    answer: |-
      Une lettre majuscule : `T` pour un type, `E` pour un élément, `K` et `V` pour clé et valeur, `R` pour un résultat.
      Le préfixe `TKey` est la convention de C#, pas celle de Java.
  - key: static
    format: course
    question: Pourquoi une méthode `static` ne peut-elle pas utiliser le `T` de sa classe ?
    choices:
      - {text: "`T` est fixé par chaque instance, alors qu'un membre `static` appartient à la classe", correct: true}
      - {text: "L'effacement supprime `T` avant le chargement des méthodes `static` par la JVM", correct: false}
      - {text: "Une méthode `static` ne peut déclarer aucun paramètre de type, même le sien", correct: false}
      - {text: "`T` est implicitement `private` dans la classe, donc invisible d'un contexte `static`", correct: false}
    answer: |-
      `T` est fixé par chaque instance (`Boite<String>`, `Boite<Integer>`), alors qu'un membre `static` appartient à la
      classe. Une méthode `static` peut en revanche déclarer ses propres paramètres : `static <T> Boite<T> de(T t)`.
  - key: implementer
    format: course
    question: Comment une classe implémente-t-elle une interface générique ?
    choices:
      - {text: "En fixant ses paramètres (`implements Comparable<Montant>`) ou en les transmettant (`MaListe<E> implements List<E>`)", correct: true}
      - {text: "En redéclarant ses paramètres (`implements <T> Comparable`), puis en les fixant à chaque instanciation", correct: false}
      - {text: "Elle ne peut pas : seule une interface peut reprendre une interface générique, avec `extends`", correct: false}
      - {text: "En implémentant la version brute (`implements Comparable`), puisque les paramètres sont effacés", correct: false}
    answer: En fixant ses paramètres (`implements Comparable<Montant>`) ou en les transmettant (`class MaListe<E> implements List<E>`).
  - key: vf-plusieurs
    format: true-false
    question: Une classe peut avoir plusieurs paramètres de type.
    truth: true
    answer: Par exemple `Map<K, V>` ou `record Paire<A, B>`.
  - key: vf-record
    format: true-false
    question: Un record peut être générique.
    truth: true
    answer: "`record Paire<A, B>(A premier, B second)` est valide."
  - key: vf-champ-static
    format: true-false
    question: "Une classe `Boite<T>` peut déclarer `static T defaut;`."
    truth: false
    answer: Un membre `static` ne peut pas utiliser le paramètre de type de la classe.
  - key: vf-une-lettre
    format: true-false
    question: Un paramètre de type doit obligatoirement s'écrire en une lettre.
    truth: false
    answer: C'est une convention, pas une règle (`ID` est courant).
  - key: qcm-declaration
    format: multiple-choice
    question: "Laquelle de ces déclarations est valide ?"
    choices:
      - {text: "`class Boite<T> { private T contenu; }`", correct: true}
      - {text: "`class Boite<int> { }`", correct: false}
      - {text: "`class <T> Boite { }`", correct: false}
      - {text: "`class Boite<T> { private static T contenu; }`", correct: false}
    answer: |-
      Les paramètres de type suivent le nom de la classe, ne sont jamais des primitifs, et ne servent pas dans un membre
      `static`, qui ne dépend d'aucune instance.
  - key: qcm-utilisation
    format: multiple-choice
    question: "Avec `class Boite<T> { T contenu() { ... } }`, que renvoie `new Boite<>(\"Ada\").contenu()` ?"
    choices:
      - text: "Une `String`"
        correct: true
      - text: "Un `Object`, à caster"
        correct: false
      - text: "Un `T`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: '`T` est inféré à `String`.'
  - key: qcm-implementer
    format: multiple-choice
    question: "Comment `Montant` déclare-t-il son ordre naturel ?"
    choices:
      - text: "`class Montant implements Comparable<Montant>`"
        correct: true
      - text: "`class Montant implements Comparable`"
        correct: false
      - text: "`class Montant<Comparable>`"
        correct: false
      - text: "`class Montant extends Comparable<T>`"
        correct: false
    answer: Le type brut `Comparable` obligerait à caster dans `compareTo(Object)`.
  - key: qcm-fabrique
    format: multiple-choice
    question: Comment écrire une fabrique `static` pour `Boite<T>` ?
    choices:
      - text: "`static <T> Boite<T> de(T t) { return new Boite<>(t); }`"
        correct: true
      - text: "`static Boite<T> de(T t) { return new Boite<>(t); }`"
        correct: false
      - text: "`static T de(Boite b) { return b; }`"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: La méthode `static` déclare son propre paramètre `<T>`.
  - key: trous-declarer
    format: fill-in
    question: |-
      Complète pour rendre la boîte générique :
      ```java
      public class Boite<___> {
          private final T contenu;
      }
      ```
    blanks: [[T]]
    answer: Le paramètre de type est déclaré après le nom de la classe.
  - key: trous-utiliser
    format: fill-in
    question: |-
      Complète pour créer une boîte d'entiers :
      ```java
      Boite<___> b = new Boite<>(42);
      ```
    blanks: [[Integer]]
    answer: Un paramètre de type est un type objet.
  - key: trous-deux
    format: fill-in
    question: |-
      Complète la déclaration d'une paire de deux types :
      ```java
      record Paire<A, ___>(A premier, B second) { }
      ```
    blanks: [[B]]
    answer: Les paramètres de type se séparent par des virgules.
  - key: trous-comparable
    format: fill-in
    question: |-
      Complète pour que les versions soient comparables entre elles :
      ```java
      record Version(int majeure, int mineure) implements Comparable<___> { ... }
      ```
    blanks: [[Version]]
    answer: '`Comparable<Version>` donne `compareTo(Version autre)`, sans cast.'
  - key: code-boite
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Boite<T> {
          private final T contenu;
          Boite(T contenu) { this.contenu = contenu; }
          T contenu() { return contenu; }
      }
      Boite<String> b = new Boite<>("ada");
      System.out.println(b.contenu().length());
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`ada`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3` : `contenu()` renvoie une `String`, sans cast, et `length()` compte ses trois caractères."
    check:
      output: "3"
  - key: code-paire
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Paire<A, B>(A premier, B second) { }
      var p = new Paire<>("x", 42);
      System.out.println(p.second() + 1);
      ```
    choices:
      - {text: "`43`", correct: true}
      - {text: "`421`", correct: false}
      - {text: "`x1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`43` : `second()` est un `Integer`, et `+ 1` fait une addition, pas une concaténation."
    check:
      output: "43"
  - key: code-mauvais-type
    format: code-output
    question: |-
      ```java
      class Boite<T> {
          private final T contenu;
          Boite(T contenu) { this.contenu = contenu; }
      }
      Boite<String> b = new Boite<>(42);
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui : `T` est inféré à `Integer`", correct: false}
      - {text: "Oui, mais il lève une `ClassCastException`", correct: false}
      - {text: "Oui, avec un avertissement unchecked", correct: false}
    answer: "Ça ne compile pas : `T` vaut `String`, fixé par le type de la variable, et 42 n'en est pas une."
    check:
      compiles: false
  - key: code-interface
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      interface Convertisseur<A, B> { B convertir(A a); }
      class Longueur implements Convertisseur<String, Integer> {
          public Integer convertir(String s) { return s.length(); }
      }
      System.out.println(new Longueur().convertir("java"));
      ```
    choices:
      - {text: "`4`", correct: true}
      - {text: "`java`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`4` : la classe fixe les deux paramètres de l'interface, `A` à `String` et `B` à `Integer`."
    check:
      output: "4"
  - key: bug-object
    format: bug-fix
    question: |-
      Ce conteneur oblige chaque appelant à caster, et un appel a reçu une `ClassCastException`. Quelle correction est
      la bonne ?
      ```java
      class Cache {
          private final Map<String, Object> valeurs = new HashMap<>();
          Object lire(String cle) { return valeurs.get(cle); }
          void ecrire(String cle, Object valeur) { valeurs.put(cle, valeur); }
      }
      ```
    choices:
      - {text: "Le rendre générique : `class Cache<V>`, avec `Map<String, V>`, `V lire` et `ecrire(cle, V valeur)`", correct: true}
      - {text: "Remplacer `Object` par un joker : `Map<String, ?>`, `? lire` et `ecrire(cle, ? valeur)`", correct: false}
      - {text: "Garder `Object`, et entourer chaque cast d'un `try`/`catch (ClassCastException e)`", correct: false}
      - {text: "Tester `instanceof` dans `lire`, et renvoyer `null` quand le type ne correspond pas", correct: false}
    answer: |-
      ```java
      class Cache<V> {
          private final Map<String, V> valeurs = new HashMap<>();
          V lire(String cle) { return valeurs.get(cle); }
          void ecrire(String cle, V valeur) { valeurs.put(cle, valeur); }
      }
      // Cache<Profil> profils = new Cache<>();
      ```
      Une classe générique garantit le type des valeurs et supprime les casts.
  - key: bug-duplication
    format: bug-fix
    question: |-
      Trois classes sont identiques au type près. Quelle correction est la bonne ?
      ```java
      class ResultatTexte { final String valeur; ... }
      class ResultatEntier { final Integer valeur; ... }
      class ResultatDate { final LocalDate valeur; ... }
      ```
    choices:
      - {text: "Une seule classe générique : `record Resultat<T>(T valeur) { }`", correct: true}
      - {text: "Une seule classe avec un champ `Object valeur`, casté par l'appelant", correct: false}
      - {text: "Une classe abstraite `Resultat`, et trois sous-classes, une par type", correct: false}
      - {text: "Une seule classe à trois champs, dont deux restent toujours `null`", correct: false}
    answer: |-
      ```java
      record Resultat<T>(T valeur) { }
      ```
      Le code est écrit une fois, et chaque usage fixe son type (`Resultat<LocalDate>`).
  - key: bug-champ-static
    format: bug-fix
    question: |-
      Ce code ne compile pas (`non-static type variable T cannot be referenced from a static context`). Quelle
      correction est la bonne ?
      ```java
      class Boite<T> {
          private static T vide;
          static Boite<T> vide() { return new Boite<>(null); }
      }
      ```
    choices:
      - {text: "Retirer le champ, et déclarer la méthode `static <T> Boite<T> vide()`", correct: true}
      - {text: "Rendre le champ `static final T vide`, initialisé à `null`", correct: false}
      - {text: "Retirer `static` de la méthode `vide()`, et garder le champ `static T`", correct: false}
      - {text: "Écrire `static Boite<Object> vide()`, et caster à chaque appel", correct: false}
    answer: |-
      ```java
      class Boite<T> {
          static <T> Boite<T> vide() { return new Boite<>(null); }
      }
      ```
      Le `T` de la classe dépend de l'instance. Un membre `static` ne peut pas l'utiliser ; une méthode `static` déclare
      son propre paramètre.
  - key: bug-comparable-brut
    format: bug-fix
    question: |-
      Ce `compareTo` caste son argument, et lève une `ClassCastException` quand on le compare à autre chose. Quelle
      correction est la bonne ?
      ```java
      class Montant implements Comparable {
          public int compareTo(Object autre) {
              return Long.compare(centimes, ((Montant) autre).centimes);
          }
      }
      ```
    choices:
      - {text: "Implémenter `Comparable<Montant>`, avec `compareTo(Montant autre)`", correct: true}
      - {text: "Implémenter `Comparable<Object>`, avec `compareTo(Object autre)`", correct: false}
      - {text: "Tester `autre instanceof Montant`, et renvoyer `0` sinon", correct: false}
      - {text: "Attraper la `ClassCastException` dans `compareTo`, et renvoyer `-1`", correct: false}
    answer: |-
      ```java
      class Montant implements Comparable<Montant> {
          public int compareTo(Montant autre) {
              return Long.compare(centimes, autre.centimes);
          }
      }
      ```
      L'interface brute reçoit un `Object`. Paramétrée, elle reçoit un `Montant`, et une comparaison avec un autre type
      ne compile pas.
  - key: concois-couche-acces-donnees-reutilisable
    format: scenario
    question: "Tu dois concevoir une couche d'accès aux données réutilisable pour plusieurs entités. Que proposes-tu ?"
    choices:
      - {text: "Une interface générique `Repository<T, ID>` aux opérations communes, étendue pour chaque entité", correct: true}
      - {text: "Un seul dépôt qui manipule des `Object`, et caste selon l'entité qu'on lui demande", correct: false}
      - {text: "Une classe de dépôt par entité, qui recopie à chaque fois les opérations communes", correct: false}
      - {text: "Une classe utilitaire statique, avec `findById(Class<?> type, Object id)` par réflexion", correct: false}
    answer: |-
      Une interface `Repository<T, ID>` (`findById`, `findAll`, `save`, `delete`), que chaque entité étend avec ses
      méthodes propres : c'est le modèle de Spring Data (`JpaRepository<User, Long>`). Le contrat est écrit une fois,
      typé sans cast, et on peut lui substituer une implémentation en mémoire pour les tests.
  - key: scenario-page
    format: scenario
    question: Ton API renvoie des listes paginées de produits, de clients et de commandes. Comment modélises-tu la réponse ?
    choices:
      - {text: "Un seul `record Page<T>(List<T> elements, int numero, int taille, long total)`", correct: true}
      - {text: "Trois records, `PageProduits`, `PageClients` et `PageCommandes`, chacun ses champs", correct: false}
      - {text: "Un `record Page(List<Object> elements, int numero, int taille, long total)`", correct: false}
      - {text: "Une `Map<String, Object>` remplie à la main par chaque ressource, avec `total`", correct: false}
    answer: |-
      Un seul type générique, `Page<T>`, éventuellement avec `<R> Page<R> map(Function<T, R> f)` pour passer des entités
      aux DTO sans perdre la pagination. Le code est écrit une fois, et chaque ressource reste typée (`Page<ProduitDto>`),
      jusque dans le schéma OpenAPI ; une `List<Object>` perdrait ce typage.
  - key: scenario-resultat
    format: scenario
    question: Comment représenter le résultat d'une opération qui peut réussir avec une valeur ou échouer avec une erreur ?
    choices:
      - {text: "Une interface scellée `Resultat<T>`, avec des records `Succes<T>` et `Echec<T>`, et un `switch` exhaustif", correct: true}
      - {text: "Une classe `Resultat` avec un champ `Object valeur` et un booléen `succes`, à tester avant de caster", correct: false}
      - {text: "Une valeur `null` en cas d'échec, et le message d'erreur écrit dans les logs de l'application", correct: false}
      - {text: "Toujours une exception vérifiée, même quand l'échec est un cas normal, comme une validation", correct: false}
    answer: |-
      `sealed interface Resultat<T> permits Succes, Echec`, avec `record Succes<T>(T valeur)` et `record Echec<T>(String
      code, String message)` : l'appelant traite les deux cas dans un `switch` exhaustif, vérifié par le compilateur, et
      `T` garde le type de la valeur. Les exceptions restent pour l'inattendu.
  - key: scenario-cache
    format: scenario
    question: Tu écris un petit cache en mémoire réutilisable pour plusieurs types de données. Quelle signature lui donnes-tu ?
    choices:
      - {text: "`class Cache<K, V>`, avec `Optional<V> lire(K cle)` et `void ecrire(K cle, V valeur)`", correct: true}
      - {text: "`class Cache`, avec `Object lire(String cle)` et `void ecrire(String cle, Object valeur)`", correct: false}
      - {text: "`class Cache<K, V> extends HashMap<K, V>`, sans méthode propre, toute la `Map` exposée", correct: false}
      - {text: "`class Cache<V>`, avec `V lire(Object cle)` qui renvoie `null` quand la clé est absente", correct: false}
    answer: |-
      Deux paramètres de type gardent clés et valeurs typées, et `Optional` dit que l'absence est possible. On peut
      ajouter `V lireOuCalculer(K cle, Function<? super K, ? extends V> calcul)` (PECS). Les clés doivent avoir un
      `equals` et un `hashCode` cohérents ; pour l'expiration et la taille maximale, Caffeine fait le travail.
