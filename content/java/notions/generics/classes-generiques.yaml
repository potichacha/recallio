notion: classes-generiques
lesson: |-
  Une classe (ou une interface, ou un record) **générique** déclare des **paramètres de type** entre chevrons, utilisés
  dans ses champs et ses méthodes :

  ```java
  public class Boite<T> {                    // T : un type choisi par chaque utilisation
      private final T contenu;

      public Boite(T contenu) { this.contenu = contenu; }

      public T contenu() { return contenu; }

      public <R> Boite<R> transformer(Function<T, R> f) {   // une méthode générique en plus
          return new Boite<>(f.apply(contenu));
      }
  }

  Boite<String> nom = new Boite<>("Ada");
  Boite<Integer> longueur = nom.transformer(String::length);

  record Paire<A, B>(A premier, B second) { }               // plusieurs paramètres
  interface Depot<T, ID> { Optional<T> trouver(ID id); void enregistrer(T t); }
  ```

  - **Conventions de nom** : une lettre majuscule, `T` (type), `E` (élément), `K` et `V` (clé, valeur), `R` (résultat),
    `ID`.
  - Une classe qui **implémente** une interface générique fixe ses paramètres (`class Longueur implements
    Convertisseur<String, Integer>`) ou les garde (`class ListeChainee<E> implements List<E>`).
  - Les paramètres de type appartiennent aux **instances** : un champ ou une méthode `static` ne peut pas utiliser `T`
    (une méthode `static` déclare ses propres paramètres : `static <T> Boite<T> de(T t)`).

  **Piège classique** : écrire `BoiteDeTexte`, `BoiteDEntier`, `BoiteDeDate`... avec le même code. Une seule classe
  générique suffit.

  **En entretien** : « Une classe générique déclare des paramètres de type, fixés par chaque utilisation ; un membre
  `static` ne peut pas utiliser ceux de la classe. »
cards:
  - key: declarer
    format: course
    question: Comment déclare-t-on une classe générique ?
    answer: Avec des paramètres de type entre chevrons après son nom (`class Boite<T>`), utilisables ensuite comme des types dans ses champs et ses méthodes.
  - key: conventions
    format: course
    question: Quelles sont les conventions de nom des paramètres de type ?
    answer: "Une lettre majuscule : `T` pour un type, `E` pour un élément, `K` et `V` pour clé et valeur, `R` pour un résultat."
  - key: static
    format: course
    question: Pourquoi une méthode `static` ne peut-elle pas utiliser le `T` de sa classe ?
    answer: '`T` est fixé par chaque instance (`Boite<String>`, `Boite<Integer>`), alors qu''un membre `static` appartient à la classe ; une méthode `static` déclare ses propres paramètres (`static <T> Boite<T> de(T t)`).'
  - key: implementer
    format: course
    question: Comment une classe implémente-t-elle une interface générique ?
    answer: En fixant ses paramètres (`implements Comparable<Montant>`) ou en les transmettant (`class MaListe<E> implements List<E>`).
  - key: vf-plusieurs
    format: true-false
    question: Une classe peut avoir plusieurs paramètres de type.
    truth: true
    answer: Par exemple `Map<K, V>` ou `record Paire<A, B>`.
  - key: vf-record
    format: true-false
    question: Un record peut être générique.
    truth: true
    answer: "`record Paire<A, B>(A premier, B second)` est valide."
  - key: vf-champ-static
    format: true-false
    question: "Une classe `Boite<T>` peut déclarer `static T defaut;`."
    truth: false
    answer: Un membre `static` ne peut pas utiliser le paramètre de type de la classe.
  - key: vf-une-lettre
    format: true-false
    question: Un paramètre de type doit obligatoirement s'écrire en une lettre.
    truth: false
    answer: C'est une convention, pas une règle (`ID` est courant).
  - key: qcm-declaration
    format: multiple-choice
    question: Quelles déclarations sont valides ?
    choices:
      - text: "`class Boite<T> { private T contenu; }`"
        correct: true
      - text: "`interface Depot<T, ID> { }`"
        correct: true
      - text: "`class Boite<int> { }`"
        correct: false
      - text: "`class <T> Boite { }`"
        correct: false
    answer: Les paramètres de type suivent le nom de la classe, et ne sont pas des primitifs.
  - key: qcm-utilisation
    format: multiple-choice
    question: "Avec `class Boite<T> { T contenu() { ... } }`, que renvoie `new Boite<>(\"Ada\").contenu()` ?"
    choices:
      - text: "Une `String`"
        correct: true
      - text: "Un `Object`, à caster"
        correct: false
      - text: "Un `T`"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: '`T` est inféré à `String`.'
  - key: qcm-implementer
    format: multiple-choice
    question: "Comment `Montant` déclare-t-il son ordre naturel ?"
    choices:
      - text: "`class Montant implements Comparable<Montant>`"
        correct: true
      - text: "`class Montant implements Comparable`"
        correct: false
      - text: "`class Montant<Comparable>`"
        correct: false
      - text: "`class Montant extends Comparable<T>`"
        correct: false
    answer: Le type brut `Comparable` obligerait à caster dans `compareTo(Object)`.
  - key: qcm-fabrique
    format: multiple-choice
    question: Comment écrire une fabrique `static` pour `Boite<T>` ?
    choices:
      - text: "`static <T> Boite<T> de(T t) { return new Boite<>(t); }`"
        correct: true
      - text: "`static Boite<T> de(T t) { return new Boite<>(t); }`"
        correct: false
      - text: "`static T de(Boite b) { return b; }`"
        correct: false
      - text: "C'est impossible"
        correct: false
    answer: La méthode `static` déclare son propre paramètre `<T>`.
  - key: trous-declarer
    format: fill-in
    question: |-
      Complétez pour rendre la boîte générique :
      ```java
      public class Boite<___> {
          private final T contenu;
      }
      ```
    blanks: [[T]]
    answer: Le paramètre de type est déclaré après le nom de la classe.
  - key: trous-utiliser
    format: fill-in
    question: |-
      Complétez pour créer une boîte d'entiers :
      ```java
      Boite<___> b = new Boite<>(42);
      ```
    blanks: [[Integer]]
    answer: Un paramètre de type est un type objet.
  - key: trous-deux
    format: fill-in
    question: |-
      Complétez la déclaration d'une paire de deux types :
      ```java
      record Paire<A, ___>(A premier, B second) { }
      ```
    blanks: [[B]]
    answer: Les paramètres de type se séparent par des virgules.
  - key: trous-comparable
    format: fill-in
    question: |-
      Complétez pour que les versions soient comparables entre elles :
      ```java
      record Version(int majeure, int mineure) implements Comparable<___> { ... }
      ```
    blanks: [[Version]]
    answer: '`Comparable<Version>` donne `compareTo(Version autre)`, sans cast.'
  - key: code-boite
    format: code-output
    question: |-
      ```java
      class Boite<T> {
          private final T contenu;
          Boite(T contenu) { this.contenu = contenu; }
          T contenu() { return contenu; }
      }
      Boite<String> b = new Boite<>("ada");
      System.out.println(b.contenu().length());
      ```
    answer: '`3` : `contenu()` renvoie une `String`, sans cast.'
    check:
      output: "3"
  - key: code-paire
    format: code-output
    question: |-
      ```java
      record Paire<A, B>(A premier, B second) { }
      var p = new Paire<>("x", 42);
      System.out.println(p.second() + 1);
      ```
    answer: '`43` : `second()` est un `Integer`.'
    check:
      output: "43"
  - key: code-mauvais-type
    format: code-output
    question: |-
      ```java
      class Boite<T> {
          private final T contenu;
          Boite(T contenu) { this.contenu = contenu; }
      }
      Boite<String> b = new Boite<>(42);
      ```
      Ce code compile-t-il ?
    answer: 'Non : `T` vaut `String`, et 42 n''en est pas une.'
    check:
      compiles: false
  - key: code-interface
    format: code-output
    question: |-
      ```java
      interface Convertisseur<A, B> { B convertir(A a); }
      class Longueur implements Convertisseur<String, Integer> {
          public Integer convertir(String s) { return s.length(); }
      }
      System.out.println(new Longueur().convertir("java"));
      ```
    answer: '`4` : la classe fixe les deux paramètres de l''interface.'
    check:
      output: "4"
  - key: bug-object
    format: bug-fix
    question: |-
      Ce conteneur oblige chaque appelant à caster, et un appel a reçu une `ClassCastException` :
      ```java
      class Cache {
          private final Map<String, Object> valeurs = new HashMap<>();
          Object lire(String cle) { return valeurs.get(cle); }
          void ecrire(String cle, Object valeur) { valeurs.put(cle, valeur); }
      }
      ```
    answer: |-
      ```java
      class Cache<V> {
          private final Map<String, V> valeurs = new HashMap<>();
          V lire(String cle) { return valeurs.get(cle); }
          void ecrire(String cle, V valeur) { valeurs.put(cle, valeur); }
      }
      // Cache<Profil> profils = new Cache<>();
      ```
      Une classe générique garantit le type des valeurs et supprime les casts.
  - key: bug-duplication
    format: bug-fix
    question: |-
      Trois classes identiques au type près :
      ```java
      class ResultatTexte { final String valeur; ... }
      class ResultatEntier { final Integer valeur; ... }
      class ResultatDate { final LocalDate valeur; ... }
      ```
    answer: |-
      ```java
      record Resultat<T>(T valeur) { }
      ```
      Le code est écrit une fois, et chaque usage fixe son type (`Resultat<LocalDate>`).
  - key: bug-champ-static
    format: bug-fix
    question: |-
      Ce code ne compile pas (`non-static type variable T cannot be referenced from a static context`) :
      ```java
      class Boite<T> {
          private static T vide;
          static Boite<T> vide() { return new Boite<>(null); }
      }
      ```
    answer: |-
      ```java
      class Boite<T> {
          static <T> Boite<T> vide() { return new Boite<>(null); }
      }
      ```
      Le `T` de la classe dépend de l'instance. Un membre `static` ne peut pas l'utiliser ; une méthode `static` déclare
      son propre paramètre.
  - key: bug-comparable-brut
    format: bug-fix
    question: |-
      Ce `compareTo` caste son argument et lève une `ClassCastException` quand on le compare à autre chose :
      ```java
      class Montant implements Comparable {
          public int compareTo(Object autre) {
              return Long.compare(centimes, ((Montant) autre).centimes);
          }
      }
      ```
    answer: |-
      ```java
      class Montant implements Comparable<Montant> {
          public int compareTo(Montant autre) {
              return Long.compare(centimes, autre.centimes);
          }
      }
      ```
      L'interface brute reçoit un `Object`. Paramétrée, elle reçoit un `Montant`, et une comparaison avec un autre type
      ne compile pas.
  - key: concois-couche-acces-donnees-reutilisable
    format: scenario
    question: Conçois une couche d'accès aux données réutilisable pour plusieurs entités.
    answer: |-
      Une interface générique paramétrée par le type d'entité et celui de l'identifiant : `Repository<T, ID>`, avec les opérations communes, findById, findAll, save, delete. Chaque entité définit ensuite sa propre interface qui étend la générique et ajoute ses méthodes spécifiques.
      C'est exactement le modèle de Spring Data JPA avec `JpaRepository<User, Long>`.
      Trois bénéfices : le contrat commun est écrit une seule fois ; la sécurité de type est préservée, pas de cast, pas de `Object` ; et comme on dépend d'une interface, on respecte le Dependency Inversion, donc on peut substituer une implémentation en mémoire pour les tests.
  - key: scenario-page
    format: scenario
    question: Ton API renvoie des listes paginées de produits, de clients et de commandes. Comment modélises-tu la réponse ?
    answer: |-
      Un seul type générique, `record Page<T>(List<T> elements, int numero, int taille, long total)`, avec éventuellement
      une méthode `<R> Page<R> map(Function<T, R> f)` pour convertir les entités en DTO sans perdre la pagination. Chaque
      ressource renvoie `Page<ProduitDto>`, `Page<ClientDto>`... Le code de pagination est écrit une fois, et le schéma
      OpenAPI généré reste typé pour chaque usage.
  - key: scenario-resultat
    format: scenario
    question: Comment représenter le résultat d'une opération qui peut réussir avec une valeur ou échouer avec une erreur ?
    answer: |-
      Une interface scellée générique : `sealed interface Resultat<T> permits Succes, Echec`, avec
      `record Succes<T>(T valeur) implements Resultat<T>` et `record Echec<T>(String code, String message) implements
      Resultat<T>`. L'appelant traite les deux cas avec un `switch` exhaustif, vérifié par le compilateur. Le paramètre
      `T` garde le type de la valeur, sans cast. Je l'utilise quand l'échec est un cas normal à traiter (une validation),
      et des exceptions pour l'inattendu.
  - key: scenario-cache
    format: scenario
    question: Tu écris un petit cache en mémoire réutilisable pour plusieurs types de données. Quelle signature lui donnes-tu ?
    answer: |-
      `class Cache<K, V>` avec `Optional<V> lire(K cle)`, `void ecrire(K cle, V valeur)` et
      `V lireOuCalculer(K cle, Function<? super K, ? extends V> calcul)`. Les deux paramètres de type gardent clés et
      valeurs typées, le joker de la fonction accepte des calculs plus généraux (PECS), et `Optional` dit que l'absence est
      possible. Les clés doivent avoir un `equals` et un `hashCode` cohérents ; je documenterais aussi la politique
      d'expiration et de taille maximale, ou j'utiliserais Caffeine.
