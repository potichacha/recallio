notion: classes-generiques
cards:
  - key: concois-couche-acces-donnees-reutilisable
    format: scenario
    question: Conçois une couche d'accès aux données réutilisable pour plusieurs entités.
    answer: |-
      Une interface générique paramétrée par le type d'entité et celui de l'identifiant : `Repository<T, ID>`, avec les opérations communes, findById, findAll, save, delete. Chaque entité définit ensuite sa propre interface qui étend la générique et ajoute ses méthodes spécifiques.
      C'est exactement le modèle de Spring Data JPA avec `JpaRepository<User, Long>`.
      Trois bénéfices : le contrat commun est écrit une seule fois ; la sécurité de type est préservée, pas de cast, pas de `Object` ; et comme on dépend d'une interface, on respecte le Dependency Inversion, donc on peut substituer une implémentation en mémoire pour les tests.
