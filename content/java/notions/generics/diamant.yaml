notion: diamant
lesson: |-
  L'**opérateur diamant** `<>` (Java 7) évite de répéter les paramètres de type à la création d'un objet : le compilateur
  les **infère** du type déclaré.

  ```java
  Map<String, List<Commande>> parClient = new HashMap<String, List<Commande>>();   // avant Java 7
  Map<String, List<Commande>> parClient = new HashMap<>();                         // avec le diamant

  List<String> noms = new ArrayList<>();          // ArrayList<String>
  Comparator<String> parLongueur = new Comparator<>() {     // classe anonyme : Java 9
      public int compare(String a, String b) { return a.length() - b.length(); }
  };
  ```

  - Le diamant n'est **pas** un type brut : `new ArrayList<>()` crée une `ArrayList<String>` si la variable est une
    `List<String>` ; `new ArrayList()` (sans chevrons) crée une liste brute, avec un avertissement.
  - Avec **`var`**, il n'y a pas de type déclaré à partir duquel inférer : `var liste = new ArrayList<>();` donne une
    `ArrayList<Object>`. On écrit alors les arguments : `var liste = new ArrayList<String>();`.
  - Depuis Java 9, le diamant fonctionne aussi avec les classes anonymes.

  **Piège classique** : combiner `var` et diamant. La liste devient une liste d'`Object`, et l'on perd la sûreté de type
  sans le moindre avertissement.

  **En entretien** : « Le diamant infère les paramètres de type depuis le type déclaré ; avec `var`, il n'y a rien à
  inférer, donc il faut les écrire. »
cards:
  - key: operateur-diamant
    format: course
    question: Que fait l'opérateur diamant ?
    answer: Il infère les paramètres de type à droite depuis la déclaration (Java 7).
  - key: diamant-vs-brut
    format: course
    question: Quelle différence entre `new ArrayList<>()` et `new ArrayList()` ?
    answer: Le diamant crée une liste paramétrée par le type inféré (sûre) ; sans chevrons, on crée une liste brute, sans vérification de type et avec un avertissement *unchecked*.
  - key: var
    format: course
    question: Que donne `var liste = new ArrayList<>();` ?
    answer: "Une `ArrayList<Object>` : sans type déclaré, le compilateur n'a rien d'autre à inférer. Il faut écrire `new ArrayList<String>()`."
  - key: anonyme
    format: course
    question: Depuis quelle version peut-on utiliser le diamant avec une classe anonyme ?
    answer: Depuis Java 9 (`new Comparator<>() { ... }`).
  - key: vf-version
    format: true-false
    question: L'opérateur diamant est apparu en Java 7.
    truth: true
    answer: Avec le multi-catch et `try-with-resources`.
  - key: vf-brut
    format: true-false
    question: "`new ArrayList<>()` crée une liste brute."
    truth: false
    answer: Elle est paramétrée par le type inféré ; c'est `new ArrayList()` qui est brute.
  - key: vf-var-object
    format: true-false
    question: "`var noms = new ArrayList<>();` crée une `ArrayList<Object>`."
    truth: true
    answer: Sans type cible, l'inférence choisit `Object`.
  - key: vf-anonyme
    format: true-false
    question: En Java 8, on peut écrire `new Comparator<>() { ... }`.
    truth: false
    answer: Le diamant avec une classe anonyme date de Java 9.
  - key: qcm-ecriture
    format: multiple-choice
    question: Quelles écritures créent une `Map<String, Integer>` typée ?
    choices:
      - text: "`Map<String, Integer> m = new HashMap<>();`"
        correct: true
      - text: "`var m = new HashMap<String, Integer>();`"
        correct: true
      - text: "`var m = new HashMap<>();`"
        correct: false
      - text: "`Map<String, Integer> m = new HashMap();`"
        correct: false
    answer: '`var` avec le diamant donne une `HashMap<Object, Object>` ; sans chevrons, la map est brute.'
  - key: qcm-inference
    format: multiple-choice
    question: D'où le diamant tire-t-il les paramètres de type ?
    choices:
      - text: "Du type attendu (la déclaration, le paramètre, le retour)"
        correct: true
      - text: "Des éléments ajoutés plus tard"
        correct: false
      - text: "Du nom de la variable"
        correct: false
      - text: "De la réflexion à l'exécution"
        correct: false
    answer: L'inférence se fait à la compilation.
  - key: qcm-retour
    format: multiple-choice
    question: "Dans `List<Client> clients() { return new ArrayList<>(); }`, quel est le type de la liste créée ?"
    choices:
      - text: "`ArrayList<Client>`"
        correct: true
      - text: "`ArrayList<Object>`"
        correct: false
      - text: "Une liste brute"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Le type de retour sert de cible à l'inférence.
  - key: qcm-avantage
    format: multiple-choice
    question: Quel est l'avantage du diamant ?
    choices:
      - text: "Ne pas répéter des paramètres de type parfois longs, sans perdre la sûreté de type"
        correct: true
      - text: "Accélérer la création des collections"
        correct: false
      - text: "Autoriser les primitifs"
        correct: false
      - text: "Supprimer l'effacement de types"
        correct: false
    answer: '`Map<String, List<Commande>>` n''est écrit qu''une fois.'
  - key: code-var-object
    format: code-output
    question: |-
      ```java
      var liste = new ArrayList<>();
      liste.add("a");
      liste.add(1);
      System.out.println(liste);
      ```
    answer: '`[a, 1]` : avec `var` et le diamant, c''est une `ArrayList<Object>`, qui accepte tout.'
    check:
      output: "[a, 1]"
  - key: code-type
    format: code-output
    question: |-
      ```java
      List<String> l = new ArrayList<>();
      l.add("xyz");
      System.out.println(l.get(0).length());
      ```
    answer: '`3` : la liste est une `ArrayList<String>`.'
    check:
      output: "3"
  - key: code-anonyme
    format: code-output
    question: |-
      ```java
      Comparator<String> c = new Comparator<>() {
          public int compare(String a, String b) { return a.length() - b.length(); }
      };
      System.out.println(c.compare("aa", "b"));
      ```
    answer: '`1` : depuis Java 9, le diamant fonctionne avec les classes anonymes.'
    check:
      output: "1"
  - key: code-var-perte
    format: code-output
    question: |-
      ```java
      var noms = new ArrayList<>();
      noms.add("Ada");
      String premier = noms.get(0);
      ```
      Ce code compile-t-il ?
    answer: 'Non : `noms` est une `ArrayList<Object>`, et `get` renvoie un `Object`.'
    check:
      compiles: false
  - key: bug-brut
    format: bug-fix
    question: |-
      Le compilateur avertit (*unchecked*) sur cette ligne :
      ```java
      List<Commande> commandes = new ArrayList();
      ```
    answer: |-
      ```java
      List<Commande> commandes = new ArrayList<>();
      ```
      Sans chevrons, on crée une liste brute ; le diamant infère `Commande`.
  - key: bug-var-diamant
    format: bug-fix
    question: |-
      Une valeur `Integer` a pu être ajoutée dans cet index de noms, sans avertissement :
      ```java
      var index = new HashMap<>();
      index.put("ada", "Ada Lovelace");
      ```
    answer: |-
      ```java
      Map<String, String> index = new HashMap<>();
      // ou : var index = new HashMap<String, String>();
      ```
      Avec `var`, le diamant n'a pas de cible et infère `HashMap<Object, Object>`. On donne le type d'un côté ou de
      l'autre.
  - key: bug-repetition
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      Map<String, List<Map<Integer, Commande>>> index = new HashMap<String, List<Map<Integer, Commande>>>();
      ```
    answer: |-
      ```java
      Map<String, List<Map<Integer, Commande>>> index = new HashMap<>();
      ```
      Le diamant reprend les paramètres de la déclaration. (Un type aussi imbriqué mérite d'ailleurs un record ou une
      classe dédiée.)
  - key: bug-invariance
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: ArrayList<Integer> cannot be converted to List<Number>`) :
      ```java
      List<Number> mesures = new ArrayList<Integer>();
      ```
    answer: |-
      ```java
      List<Number> mesures = new ArrayList<>();
      ```
      Une `ArrayList<Integer>` n'est pas une `List<Number>`. Le diamant crée directement une `ArrayList<Number>`, qui
      accepte des entiers comme des décimaux.
