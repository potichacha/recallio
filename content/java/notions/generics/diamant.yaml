notion: diamant
lesson: |-
  L'**opérateur diamant** `<>` (Java 7) évite de répéter les paramètres de type à la création d'un objet : le compilateur
  les **infère** du type déclaré.

  ```java
  Map<String, List<Commande>> parClient = new HashMap<String, List<Commande>>();   // avant Java 7
  Map<String, List<Commande>> parClient = new HashMap<>();                         // avec le diamant

  List<String> noms = new ArrayList<>();          // ArrayList<String>
  Comparator<String> parLongueur = new Comparator<>() {     // classe anonyme : Java 9
      public int compare(String a, String b) { return a.length() - b.length(); }
  };
  ```

  - Le diamant n'est **pas** un type brut : `new ArrayList<>()` crée une `ArrayList<String>` si la variable est une
    `List<String>` ; `new ArrayList()` (sans chevrons) crée une liste brute, avec un avertissement.
  - Avec **`var`**, il n'y a pas de type déclaré à partir duquel inférer : `var liste = new ArrayList<>();` donne une
    `ArrayList<Object>`. On écrit alors les arguments : `var liste = new ArrayList<String>();`.
  - Depuis Java 9, le diamant fonctionne aussi avec les classes anonymes.

  **Piège classique** : combiner `var` et diamant. La liste devient une liste d'`Object`, et l'on perd la sûreté de type
  sans le moindre avertissement.

  **En entretien** : « Le diamant infère les paramètres de type depuis le type déclaré ; avec `var`, il n'y a rien à
  inférer, donc il faut les écrire. »
tour:
  - title: L'opérateur diamant
    text: |-
      L'opérateur **diamant**, `<>`, évite de répéter les paramètres de type :
      `Map<String, List<Integer>> notes = new HashMap<>();`. Le compilateur les déduit de la déclaration.

      Avec `var`, il faut au contraire les écrire à droite, sinon le compilateur n'a rien d'où les déduire :
      `var noms = new ArrayList<String>();`. `var objets = new ArrayList<>();` donne une liste d'`Object`.
    example:
      files:
        Main.java: |-
          void main() {
              Map<String, List<Integer>> notes = new HashMap<>();
              notes.computeIfAbsent("Ada", nom -> new ArrayList<>()).add(18);
              notes.computeIfAbsent("Ada", nom -> new ArrayList<>()).add(15);
              IO.println(notes);

              var noms = new ArrayList<String>();
              noms.add("Grace");
              IO.println(noms.get(0).length());

              var objets = new ArrayList<>();
              objets.add(1);
              objets.add("deux");
              IO.println(objets);
          }
      output: |-
        {Ada=[18, 15]}
        5
        [1, deux]
cards:
  - key: operateur-diamant
    format: course
    question: "Que fait l'opérateur diamant `<>` ?"
    choices:
      - {text: "Il infère les paramètres de type de l'objet créé depuis le type attendu", correct: true}
      - {text: "Il infère le type de la variable depuis la valeur, comme le fait `var`", correct: false}
      - {text: "Il crée un objet brut, dont le compilateur ne vérifie plus les types", correct: false}
      - {text: "Il fixe les paramètres de type à `Object`, pour accepter tout élément", correct: false}
    answer: |-
      Il infère les paramètres de type à droite depuis le type attendu, la déclaration par exemple (Java 7) :
      `List<String> l = new ArrayList<>();`. C'est l'inverse de `var`, qui infère le type de la variable depuis la valeur.
  - key: diamant-vs-brut
    format: course
    question: Quelle différence entre `new ArrayList<>()` et `new ArrayList()` ?
    choices:
      - {text: "Le diamant crée une liste paramétrée par le type inféré ; sans chevrons, une liste brute", correct: true}
      - {text: "Aucune : depuis Java 7, le compilateur ajoute lui-même les chevrons quand ils manquent", correct: false}
      - {text: "Sans chevrons, c'est une `ArrayList<Object>`, aussi sûre que celle créée par le diamant", correct: false}
      - {text: "Le diamant crée une liste immuable ; sans chevrons, on obtient une liste modifiable", correct: false}
    answer: Le diamant crée une liste paramétrée par le type inféré (sûre) ; sans chevrons, on crée une liste brute, sans vérification de type et avec un avertissement *unchecked*.
  - key: var
    format: course
    question: Que donne `var liste = new ArrayList<>();` ?
    choices:
      - {text: "Une `ArrayList<Object>` : sans type déclaré, rien d'autre à inférer", correct: true}
      - {text: "Une erreur de compilation : `var` refuse le diamant", correct: false}
      - {text: "Une `ArrayList` brute, avec un avertissement unchecked", correct: false}
      - {text: "Une liste du type du premier élément ajouté par `add`", correct: false}
    answer: "Une `ArrayList<Object>` : sans type déclaré, le compilateur n'a rien d'autre à inférer. Il faut écrire `new ArrayList<String>()`."
  - key: anonyme
    format: course
    question: Depuis quelle version peut-on utiliser le diamant avec une classe anonyme ?
    choices:
      - {text: "Depuis Java 9", correct: true}
      - {text: "Depuis Java 7", correct: false}
      - {text: "Depuis Java 8", correct: false}
      - {text: "Depuis Java 11", correct: false}
    answer: |-
      Depuis Java 9 (`new Comparator<>() { ... }`). Java 7 a introduit le diamant, mais sans l'autoriser pour les classes
      anonymes.
  - key: vf-version
    format: true-false
    question: L'opérateur diamant est apparu en Java 7.
    truth: true
    answer: Avec le multi-catch et `try-with-resources`.
  - key: vf-brut
    format: true-false
    question: "`new ArrayList<>()` crée une liste brute."
    truth: false
    answer: Elle est paramétrée par le type inféré ; c'est `new ArrayList()` qui est brute.
  - key: vf-var-object
    format: true-false
    question: "`var noms = new ArrayList<>();` crée une `ArrayList<Object>`."
    truth: true
    answer: Sans type cible, l'inférence choisit `Object`.
  - key: vf-anonyme
    format: true-false
    question: En Java 8, on peut écrire `new Comparator<>() { ... }`.
    truth: false
    answer: Le diamant avec une classe anonyme date de Java 9.
  - key: qcm-ecriture
    format: multiple-choice
    question: "Laquelle de ces écritures crée une `Map<String, Integer>` typée ?"
    choices:
      - {text: "`Map<String, Integer> m = new HashMap<>();`", correct: true}
      - {text: "`var m = new HashMap<>();`", correct: false}
      - {text: "`Map<String, Integer> m = new HashMap();`", correct: false}
      - {text: "`var m = new HashMap();`", correct: false}
    answer: |-
      Le diamant tire ses paramètres de la déclaration. `var` avec le diamant donne une `HashMap<Object, Object>`, et sans
      chevrons la map est brute.
  - key: qcm-inference
    format: multiple-choice
    question: D'où le diamant tire-t-il les paramètres de type ?
    choices:
      - {text: "Du type attendu (la déclaration, le paramètre, le retour)", correct: true}
      - {text: "Des éléments ajoutés plus tard, au premier appel à `add`", correct: false}
      - {text: "De rien : il vaut toujours `Object`, le type le plus général", correct: false}
      - {text: "De la réflexion à l'exécution, sur les objets ajoutés", correct: false}
    answer: "L'inférence se fait à la compilation, depuis le type attendu ; à l'exécution, les paramètres sont effacés."
  - key: qcm-retour
    format: multiple-choice
    question: "Dans `List<Client> clients() { return new ArrayList<>(); }`, quel est le type de la liste créée ?"
    choices:
      - text: "`ArrayList<Client>`"
        correct: true
      - text: "`ArrayList<Object>`"
        correct: false
      - text: "Une liste brute"
        correct: false
      - text: "Le code ne compile pas"
        correct: false
    answer: Le type de retour sert de cible à l'inférence.
  - key: qcm-avantage
    format: multiple-choice
    question: Quel est l'avantage du diamant ?
    choices:
      - {text: "Ne pas répéter des paramètres de type parfois longs, sans perdre la sûreté de type", correct: true}
      - {text: "Accélérer la création des collections, en sautant les vérifications de type", correct: false}
      - {text: "Autoriser les types primitifs, comme `int`, en paramètre de type des collections", correct: false}
      - {text: "Supprimer l'effacement de types, pour garder les paramètres connus à l'exécution", correct: false}
    answer: '`Map<String, List<Commande>>` n''est écrit qu''une fois.'
  - key: code-var-object
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      var liste = new ArrayList<>();
      liste.add("a");
      liste.add(1);
      System.out.println(liste);
      ```
    choices:
      - {text: "`[a, 1]`", correct: true}
      - {text: "`[a]`", correct: false}
      - {text: "`[\"a\", 1]`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`[a, 1]` : avec `var` et le diamant, c'est une `ArrayList<Object>`, qui accepte tout."
    check:
      output: "[a, 1]"
  - key: code-type
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> l = new ArrayList<>();
      l.add("xyz");
      System.out.println(l.get(0).length());
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`xyz`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3` : la liste est une `ArrayList<String>`, et `get(0)` renvoie une `String` sans cast."
    check:
      output: "3"
  - key: code-anonyme
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Comparator<String> c = new Comparator<>() {
          public int compare(String a, String b) { return a.length() - b.length(); }
      };
      System.out.println(c.compare("aa", "b"));
      ```
    choices:
      - {text: "`1`", correct: true}
      - {text: "`-1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`1` : 2 - 1. Depuis Java 9, le diamant fonctionne avec les classes anonymes."
    check:
      output: "1"
  - key: code-var-perte
    format: code-output
    question: |-
      ```java
      var noms = new ArrayList<>();
      noms.add("Ada");
      String premier = noms.get(0);
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui : `noms` est une `ArrayList<String>`", correct: false}
      - {text: "Oui, avec un avertissement unchecked", correct: false}
      - {text: "Oui, mais il lève une `ClassCastException`", correct: false}
    answer: "Ça ne compile pas : `noms` est une `ArrayList<Object>`, et `get` renvoie un `Object`, pas une `String`."
    check:
      compiles: false
  - key: bug-brut
    format: bug-fix
    question: |-
      Le compilateur avertit (*unchecked*) sur cette ligne. Quelle correction est la bonne ?
      ```java
      List<Commande> commandes = new ArrayList();
      ```
    choices:
      - {text: "Ajouter le diamant : `new ArrayList<>()`", correct: true}
      - {text: "Ajouter `@SuppressWarnings(\"unchecked\")`", correct: false}
      - {text: "Déclarer une `List` brute, sans `<Commande>`", correct: false}
      - {text: "Écrire `new ArrayList<Object>()`", correct: false}
    answer: |-
      ```java
      List<Commande> commandes = new ArrayList<>();
      ```
      Sans chevrons, on crée une liste brute ; le diamant infère `Commande`.
  - key: bug-var-diamant
    format: bug-fix
    question: |-
      Une valeur `Integer` a pu être ajoutée dans cet index de noms, sans avertissement. Quelle correction est la bonne ?
      ```java
      var index = new HashMap<>();
      index.put("ada", "Ada Lovelace");
      ```
    choices:
      - {text: "Donner le type : `Map<String, String> index = new HashMap<>();`", correct: true}
      - {text: "Figer le type avec `final var index = new HashMap<>();`", correct: false}
      - {text: "Écrire `var index = new HashMap<?, ?>();`, pour restreindre", correct: false}
      - {text: "Ajouter `@SuppressWarnings(\"unchecked\")` au-dessus de `index`", correct: false}
    answer: |-
      ```java
      Map<String, String> index = new HashMap<>();
      // ou : var index = new HashMap<String, String>();
      ```
      Avec `var`, le diamant n'a pas de cible et infère `HashMap<Object, Object>`. On donne le type d'un côté ou de
      l'autre.
  - key: bug-repetition
    format: bug-fix
    question: |-
      Comment simplifier cette déclaration, sans perdre le typage ?
      ```java
      Map<String, List<Map<Integer, Commande>>> index = new HashMap<String, List<Map<Integer, Commande>>>();
      ```
    choices:
      - {text: "`Map<String, List<Map<Integer, Commande>>> index = new HashMap<>();`", correct: true}
      - {text: "`Map<> index = new HashMap<String, List<Map<Integer, Commande>>>();`", correct: false}
      - {text: "`Map index = new HashMap<String, List<Map<Integer, Commande>>>();`", correct: false}
      - {text: "`var index = new HashMap<>();`", correct: false}
    answer: |-
      ```java
      Map<String, List<Map<Integer, Commande>>> index = new HashMap<>();
      ```
      Le diamant reprend les paramètres de la déclaration. (Un type aussi imbriqué mérite d'ailleurs un record ou une
      classe dédiée.)
  - key: bug-invariance
    format: bug-fix
    question: |-
      Ce code ne compile pas (`incompatible types: ArrayList<Integer> cannot be converted to List<Number>`). Quelle
      correction est la bonne ?
      ```java
      List<Number> mesures = new ArrayList<Integer>();
      ```
    choices:
      - {text: "`List<Number> mesures = new ArrayList<>();`", correct: true}
      - {text: "`List<Number> mesures = (List<Number>) new ArrayList<Integer>();`", correct: false}
      - {text: "`List<Integer> mesures = new ArrayList<Number>();`", correct: false}
      - {text: "`List<Number> mesures = new ArrayList<? extends Number>();`", correct: false}
    answer: |-
      ```java
      List<Number> mesures = new ArrayList<>();
      ```
      Une `ArrayList<Integer>` n'est pas une `List<Number>`. Le diamant crée directement une `ArrayList<Number>`, qui
      accepte des entiers comme des décimaux.
