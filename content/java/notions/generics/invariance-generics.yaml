notion: invariance-generics
cards:
  - key: list-string-sous-type-list-object
    format: course
    question: '`List<String>` est-il un sous-type de `List<Object>` ?'
    answer: Non, les generics sont invariants.
  - key: tableaux-sont-ils-covariants-generics
    format: course
    question: Pourquoi les tableaux sont-ils covariants et pas les generics ?
    answer: 'Historique : les tableaux vérifient le type à l''exécution (ArrayStoreException) ; les generics, effacés, ne le peuvent pas, donc l''invariance protège à la compilation.'
