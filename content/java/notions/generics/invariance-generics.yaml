notion: invariance-generics
lesson: |-
  Les generics sont **invariants** : même si `Integer` est un sous-type de `Number`, une `List<Integer>` **n'est pas**
  une `List<Number>`.

  ```java
  List<Integer> entiers = new ArrayList<>();
  List<Number> nombres = entiers;      // ne compile pas
  nombres.add(3.14);                   // ...sinon ceci glisserait un Double dans une liste d'entiers
  ```

  Les **tableaux**, eux, sont **covariants** : un `Integer[]` est un `Number[]`. Le problème est seulement repoussé à
  l'exécution :

  ```java
  Number[] tableau = new Integer[2];   // compile
  tableau[0] = 3.14;                   // ArrayStoreException à l'exécution
  ```

  - L'invariance permet de détecter l'erreur **à la compilation**. Les tableaux peuvent vérifier à l'exécution parce
    qu'ils connaissent leur type réel ; les generics, effacés, ne le pourraient pas.
  - Pour accepter des listes de sous-types, on utilise un joker : `List<? extends Number>` (en lecture) ou
    `List<? super Integer>` (en écriture).
  - L'invariance porte sur le **paramètre** ; le type « extérieur » reste polymorphe : une `ArrayList<Integer>` est une
    `List<Integer>`.

  **Piège classique** : une méthode `void nourrir(List<Animal> animaux)` qu'on ne peut pas appeler avec une
  `List<Chat>`. Il faut `List<? extends Animal>`.

  **En entretien** : « Les generics sont invariants pour qu'on ne puisse pas glisser un `Double` dans une `List<Integer>` ;
  les tableaux sont covariants et vérifient à l'exécution (`ArrayStoreException`). »
cards:
  - key: list-string-sous-type-list-object
    format: course
    question: '`List<String>` est-il un sous-type de `List<Object>` ?'
    answer: Non, les generics sont invariants.
  - key: tableaux-sont-ils-covariants-generics
    format: course
    question: Pourquoi les tableaux sont-ils covariants et pas les generics ?
    answer: Les tableaux connaissent leur type à l'exécution (ArrayStoreException) ; l'erasure empêche ce contrôle pour les generics.
  - key: pourquoi
    format: course
    question: Que permettrait une `List<Integer>` affectée à une `List<Number>` ?
    answer: D'y ajouter un `Double` par la variable `List<Number>`, alors que la liste ne doit contenir que des entiers ; l'invariance l'interdit dès la compilation.
  - key: exterieur
    format: course
    question: Une `ArrayList<String>` est-elle une `List<String>` ?
    answer: "Oui : l'invariance porte sur le paramètre de type ; à paramètre égal, l'héritage des classes s'applique normalement."
  - key: vf-invariant
    format: true-false
    question: "Une `List<Integer>` peut être affectée à une variable `List<Number>`."
    truth: false
    answer: Les generics sont invariants.
  - key: vf-tableaux
    format: true-false
    question: "Un `Integer[]` peut être affecté à une variable `Number[]`."
    truth: true
    answer: Les tableaux sont covariants.
  - key: vf-array-store
    format: true-false
    question: Ranger un `Double` dans un `Integer[]` vu comme `Number[]` lève une exception à l'exécution.
    truth: true
    answer: Une `ArrayStoreException`.
  - key: vf-joker
    format: true-false
    question: "Une `List<Integer>` peut être affectée à une variable `List<? extends Number>`."
    truth: true
    answer: Le joker accepte les listes de sous-types (en lecture).
  - key: qcm-affectations
    format: multiple-choice
    question: "Avec `List<Integer> e`, quelles affectations compilent ?"
    choices:
      - text: "`List<? extends Number> n = e;`"
        correct: true
      - text: "`Collection<Integer> c = e;`"
        correct: true
      - text: "`List<Number> n = e;`"
        correct: false
      - text: "`List<Object> o = e;`"
        correct: false
    answer: L'héritage des classes s'applique à paramètre égal ; sinon, il faut un joker.
  - key: qcm-tableau
    format: multiple-choice
    question: "Que fait `Object[] t = new String[1]; t[0] = 42;` ?"
    choices:
      - text: "Une `ArrayStoreException` à l'exécution"
        correct: true
      - text: "Une erreur de compilation"
        correct: false
      - text: "Il range 42 dans le tableau"
        correct: false
      - text: "Une `ClassCastException`"
        correct: false
    answer: Le tableau connaît son type réel et refuse l'`Integer`.
  - key: qcm-signature
    format: multiple-choice
    question: "Quelle signature accepte une `List<Chat>` et une `List<Chien>` pour les lire comme des `Animal` ?"
    choices:
      - text: "`void nourrir(List<? extends Animal> animaux)`"
        correct: true
      - text: "`void nourrir(List<Animal> animaux)`"
        correct: false
      - text: "`void nourrir(List<? super Animal> animaux)`"
        correct: false
      - text: "`void nourrir(Animal[] animaux)`, plus sûr"
        correct: false
    answer: '`? extends` accepte les listes de sous-types.'
  - key: qcm-raison
    format: multiple-choice
    question: Pourquoi l'invariance est-elle préférable à la covariance des tableaux ?
    choices:
      - text: "L'erreur est détectée à la compilation, pas en production"
        correct: true
      - text: "Elle est plus rapide"
        correct: false
      - text: "Elle autorise plus de types"
        correct: false
      - text: "Elle évite l'autoboxing"
        correct: false
    answer: Les tableaux ne détectent l'erreur qu'à l'exécution.
  - key: code-invariance
    format: code-output
    question: |-
      ```java
      List<Integer> entiers = new ArrayList<>();
      List<Number> nombres = entiers;
      ```
      Ce code compile-t-il ?
    answer: 'Non : `List<Integer>` ne peut pas être convertie en `List<Number>`.'
    check:
      compiles: false
  - key: code-array-store
    format: code-output
    question: |-
      ```java
      Object[] t = new String[1];
      t[0] = 42;
      ```
    answer: "Une `ArrayStoreException` : le tableau est en réalité un `String[]`."
    check:
      throws: ArrayStoreException
  - key: code-extends
    format: code-output
    question: |-
      ```java
      List<? extends Number> n = new ArrayList<Integer>(List.of(1, 2));
      System.out.println(n.get(0) + " " + n.size());
      ```
    answer: '`1 2` : avec un joker, la liste d''entiers se lit comme une liste de nombres.'
    check:
      output: "1 2"
  - key: code-tableau-covariant
    format: code-output
    question: |-
      ```java
      Integer[] e = {1, 2};
      Number[] n = e;
      System.out.println(n.length + " " + n[1]);
      ```
    answer: '`2 2` : un `Integer[]` est un `Number[]` (covariance des tableaux).'
    check:
      output: "2 2"
  - key: bug-animaux
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      void nourrir(List<Animal> animaux) { animaux.forEach(Animal::manger); }
      List<Chat> chats = ...;
      nourrir(chats);
      ```
    answer: |-
      ```java
      void nourrir(List<? extends Animal> animaux) { animaux.forEach(Animal::manger); }
      ```
      Une `List<Chat>` n'est pas une `List<Animal>`. La méthode ne fait que lire : `? extends Animal` accepte les listes de
      tous les sous-types.
  - key: bug-tableau
    format: bug-fix
    question: |-
      En production, une `ArrayStoreException` surgit dans ce registre :
      ```java
      Animal[] enclos = new Chat[10];
      enclos[0] = new Chien();
      ```
    answer: |-
      ```java
      List<Chat> chats = new ArrayList<>();
      chats.add(new Chien());   // ne compile pas : l'erreur est détectée tout de suite
      ```
      La covariance des tableaux reporte l'erreur à l'exécution. Une liste générique, invariante, la refuse à la
      compilation.
  - key: bug-cast-brut
    format: bug-fix
    question: |-
      Pour « contourner » l'invariance, ce code passe par un type brut :
      ```java
      List<Integer> entiers = new ArrayList<>(List.of(1));
      List<Number> nombres = (List) entiers;
      nombres.add(2.5);
      int premier = entiers.get(1);   // ClassCastException
      ```
    answer: |-
      ```java
      List<Number> nombres = new ArrayList<>(entiers);
      nombres.add(2.5);
      ```
      Le cast brut casse la garantie de type : la liste d'entiers contient un `Double`. On crée une vraie `List<Number>`
      (une copie), ou l'on utilise un joker pour la lecture.
  - key: bug-retour-liste
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      List<Number> mesures() {
          List<Integer> brutes = capteur.lire();
          return brutes;
      }
      ```
    answer: |-
      ```java
      List<Number> mesures() {
          return new ArrayList<>(capteur.lire());
      }
      // ou : List<? extends Number> mesures(), si l'appelant ne fait que lire
      ```
      Une `List<Integer>` n'est pas une `List<Number>` : on la copie dans une liste du bon type.
