notion: invariance-generics
lesson: |-
  Les generics sont **invariants** : même si `Integer` est un sous-type de `Number`, une `List<Integer>` **n'est pas**
  une `List<Number>`.

  ```java
  List<Integer> entiers = new ArrayList<>();
  List<Number> nombres = entiers;      // ne compile pas
  nombres.add(3.14);                   // ...sinon ceci glisserait un Double dans une liste d'entiers
  ```

  Les **tableaux**, eux, sont **covariants** : un `Integer[]` est un `Number[]`. Le problème est seulement repoussé à
  l'exécution :

  ```java
  Number[] tableau = new Integer[2];   // compile
  tableau[0] = 3.14;                   // ArrayStoreException à l'exécution
  ```

  - L'invariance permet de détecter l'erreur **à la compilation**. Les tableaux peuvent vérifier à l'exécution parce
    qu'ils connaissent leur type réel ; les generics, effacés, ne le pourraient pas.
  - Pour accepter des listes de sous-types, on utilise un joker : `List<? extends Number>` (en lecture) ou
    `List<? super Integer>` (en écriture).
  - L'invariance porte sur le **paramètre** ; le type « extérieur » reste polymorphe : une `ArrayList<Integer>` est une
    `List<Integer>`.

  **Piège classique** : une méthode `void nourrir(List<Animal> animaux)` qu'on ne peut pas appeler avec une
  `List<Chat>`. Il faut `List<? extends Animal>`.

  **En entretien** : « Les generics sont invariants pour qu'on ne puisse pas glisser un `Double` dans une `List<Integer>` ;
  les tableaux sont covariants et vérifient à l'exécution (`ArrayStoreException`). »
cards:
  - key: list-string-sous-type-list-object
    format: course
    question: '`List<String>` est-il un sous-type de `List<Object>` ?'
    choices:
      - {text: "Non : les generics sont invariants, même si `String` est un sous-type d'`Object`", correct: true}
      - {text: "Oui : `String` étant un sous-type d'`Object`, la liste l'est aussi", correct: false}
      - {text: "Oui, mais seulement en lecture : on ne peut pas y ajouter d'`Object`", correct: false}
      - {text: "Non, sauf si la liste est immuable, comme celle de `List.of`", correct: false}
    answer: |-
      Non, les generics sont invariants : sinon, on pourrait ajouter un `Integer` dans une liste de `String` à travers la
      `List<Object>`. Pour lire seulement, `List<? extends Object>` (ou `List<?>`) accepte une `List<String>`.
  - key: tableaux-sont-ils-covariants-generics
    format: course
    question: Pourquoi les tableaux sont-ils covariants et pas les generics ?
    choices:
      - {text: "Un tableau connaît son type à l'exécution (`ArrayStoreException`) ; l'effacement l'empêche pour les generics", correct: true}
      - {text: "Les tableaux sont plus anciens, et la covariance a été retirée des generics pour la performance", correct: false}
      - {text: "Les generics sont covariants aussi, mais seulement pour les listes immuables créées par `List.of`", correct: false}
      - {text: "Les tableaux contiennent des primitifs, sans héritage, alors que les generics contiennent des objets", correct: false}
    answer: Les tableaux connaissent leur type à l'exécution (ArrayStoreException) ; l'erasure empêche ce contrôle pour les generics.
  - key: pourquoi
    format: course
    question: Que permettrait une `List<Integer>` affectée à une `List<Number>` ?
    choices:
      - {text: "D'y ajouter un `Double` par la variable `List<Number>`, dans une liste d'entiers", correct: true}
      - {text: "De lire ses éléments comme des `Number`, ce qui est interdit sans cast", correct: false}
      - {text: "De convertir automatiquement chaque `Integer` en `Double` à la lecture", correct: false}
      - {text: "Rien de plus : les deux types désignent exactement la même liste", correct: false}
    answer: D'y ajouter un `Double` par la variable `List<Number>`, alors que la liste ne doit contenir que des entiers ; l'invariance l'interdit dès la compilation.
  - key: exterieur
    format: course
    question: Une `ArrayList<String>` est-elle une `List<String>` ?
    choices:
      - {text: "Oui : à paramètre égal, l'héritage des classes s'applique normalement", correct: true}
      - {text: "Non : l'invariance interdit toute conversion entre types génériques", correct: false}
      - {text: "Seulement à travers un joker, comme `List<? extends String>`", correct: false}
      - {text: "Seulement après un cast explicite, comme `(List<String>) liste`", correct: false}
    answer: "Oui : l'invariance porte sur le paramètre de type ; à paramètre égal, l'héritage des classes s'applique normalement."
  - key: vf-invariant
    format: true-false
    question: "Une `List<Integer>` peut être affectée à une variable `List<Number>`."
    truth: false
    answer: Les generics sont invariants.
  - key: vf-tableaux
    format: true-false
    question: "Un `Integer[]` peut être affecté à une variable `Number[]`."
    truth: true
    answer: Les tableaux sont covariants.
  - key: vf-array-store
    format: true-false
    question: Ranger un `Double` dans un `Integer[]` vu comme `Number[]` lève une exception à l'exécution.
    truth: true
    answer: Une `ArrayStoreException`.
  - key: vf-joker
    format: true-false
    question: "Une `List<Integer>` peut être affectée à une variable `List<? extends Number>`."
    truth: true
    answer: Le joker accepte les listes de sous-types (en lecture).
  - key: qcm-affectations
    format: multiple-choice
    question: "Avec `List<Integer> e`, quelles affectations compilent ?"
    choices:
      - text: "`List<? extends Number> n = e;`"
        correct: true
      - text: "`Collection<Integer> c = e;`"
        correct: true
      - text: "`List<Number> n = e;`"
        correct: false
      - text: "`List<Object> o = e;`"
        correct: false
    answer: L'héritage des classes s'applique à paramètre égal ; sinon, il faut un joker.
  - key: qcm-tableau
    format: multiple-choice
    question: "Que fait `Object[] t = new String[1]; t[0] = 42;` ?"
    choices:
      - text: "Une `ArrayStoreException` à l'exécution"
        correct: true
      - text: "Une erreur de compilation"
        correct: false
      - text: "Il range 42 dans le tableau"
        correct: false
      - text: "Une `ClassCastException`"
        correct: false
    answer: Le tableau connaît son type réel et refuse l'`Integer`.
  - key: qcm-signature
    format: multiple-choice
    question: "Quelle signature accepte une `List<Chat>` et une `List<Chien>` pour les lire comme des `Animal` ?"
    choices:
      - text: "`void nourrir(List<? extends Animal> animaux)`"
        correct: true
      - text: "`void nourrir(List<Animal> animaux)`"
        correct: false
      - text: "`void nourrir(List<? super Animal> animaux)`"
        correct: false
      - text: "`void nourrir(Animal[] animaux)`, plus sûr"
        correct: false
    answer: '`? extends` accepte les listes de sous-types.'
  - key: qcm-raison
    format: multiple-choice
    question: Pourquoi l'invariance est-elle préférable à la covariance des tableaux ?
    choices:
      - {text: "L'erreur est détectée à la compilation, pas en production", correct: true}
      - {text: "Elle est plus rapide, sans vérification à l'exécution", correct: false}
      - {text: "Elle accepte plus de types, dont les sous-types des éléments", correct: false}
      - {text: "Elle évite l'autoboxing des éléments primitifs ajoutés", correct: false}
    answer: Les tableaux ne détectent l'erreur qu'à l'exécution.
  - key: code-invariance
    format: code-output
    question: |-
      ```java
      List<Integer> entiers = new ArrayList<>();
      List<Number> nombres = entiers;
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui : un `Integer` est un `Number`", correct: false}
      - {text: "Oui, avec un avertissement unchecked", correct: false}
      - {text: "Oui, mais `nombres.add(2.5)` lèverait une exception", correct: false}
    answer: "Ça ne compile pas : une `List<Integer>` ne peut pas être convertie en `List<Number>`, les generics sont invariants."
    check:
      compiles: false
  - key: code-array-store
    format: code-output
    question: |-
      Que se passe-t-il à l'exécution de ce code ?
      ```java
      Object[] t = new String[1];
      t[0] = 42;
      ```
    choices:
      - {text: "Une `ArrayStoreException`", correct: true}
      - {text: "Une `ClassCastException`", correct: false}
      - {text: "Rien : `t[0]` vaut `42`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      Une `ArrayStoreException` : le tableau est en réalité un `String[]`, qui vérifie chaque écriture à l'exécution. Le
      compilateur, lui, ne voit qu'un `Object[]` et laisse passer.
    check:
      throws: ArrayStoreException
  - key: code-extends
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<? extends Number> n = new ArrayList<Integer>(List.of(1, 2));
      System.out.println(n.get(0) + " " + n.size());
      ```
    choices:
      - {text: "`1 2`", correct: true}
      - {text: "`1.0 2`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`1 2` : avec un joker, la liste d'entiers se lit comme une liste de nombres, et chaque élément reste un `Integer`."
    check:
      output: "1 2"
  - key: code-tableau-covariant
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Integer[] e = {1, 2};
      Number[] n = e;
      System.out.println(n.length + " " + n[1]);
      ```
    choices:
      - {text: "`2 2`", correct: true}
      - {text: "`2 2.0`", correct: false}
      - {text: "`2 1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2 2` : un `Integer[]` est un `Number[]` (covariance des tableaux), et `n[1]` reste l'`Integer` 2."
    check:
      output: "2 2"
  - key: bug-animaux
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      void nourrir(List<Animal> animaux) { animaux.forEach(Animal::manger); }
      List<Chat> chats = ...;
      nourrir(chats);
      ```
    choices:
      - {text: "Déclarer `nourrir(List<? extends Animal> animaux)`", correct: true}
      - {text: "Déclarer `nourrir(List<? super Animal> animaux)`", correct: false}
      - {text: "Caster à l'appel : `nourrir((List<Animal>) chats)`", correct: false}
      - {text: "Déclarer `nourrir(List<Object> animaux)`", correct: false}
    answer: |-
      ```java
      void nourrir(List<? extends Animal> animaux) { animaux.forEach(Animal::manger); }
      ```
      Une `List<Chat>` n'est pas une `List<Animal>`. La méthode ne fait que lire : `? extends Animal` accepte les listes de
      tous les sous-types.
  - key: bug-tableau
    format: bug-fix
    question: |-
      En production, une `ArrayStoreException` surgit dans ce registre. Quelle correction est la bonne ?
      ```java
      Animal[] enclos = new Chat[10];
      enclos[0] = new Chien();
      ```
    choices:
      - {text: "Une `List<Chat>`, qui refuse un `Chien` dès la compilation", correct: true}
      - {text: "Un `Object[]`, qui accepte tous les animaux sans exception", correct: false}
      - {text: "Un `try`/`catch (ArrayStoreException e)` autour de l'affectation", correct: false}
      - {text: "Un cast à l'affectation : `enclos[0] = (Chat) new Chien();`", correct: false}
    answer: |-
      ```java
      List<Chat> chats = new ArrayList<>();
      chats.add(new Chien());   // ne compile pas : l'erreur est détectée tout de suite
      ```
      La covariance des tableaux reporte l'erreur à l'exécution. Une liste générique, invariante, la refuse à la
      compilation.
  - key: bug-cast-brut
    format: bug-fix
    question: |-
      Pour « contourner » l'invariance, ce code passe par un type brut, et une `ClassCastException` survient. Quelle
      correction est la bonne ?
      ```java
      List<Integer> entiers = new ArrayList<>(List.of(1));
      List<Number> nombres = (List) entiers;
      nombres.add(2.5);
      int premier = entiers.get(1);   // ClassCastException
      ```
    choices:
      - {text: "Copier : `List<Number> nombres = new ArrayList<>(entiers);`", correct: true}
      - {text: "Ajouter `@SuppressWarnings(\"unchecked\")` sur le cast brut", correct: false}
      - {text: "Caster en deux temps : `(List<Number>) (List<?>) entiers`", correct: false}
      - {text: "Lire avec `entiers.get(1).intValue()` plutôt qu'un `int`", correct: false}
    answer: |-
      ```java
      List<Number> nombres = new ArrayList<>(entiers);
      nombres.add(2.5);
      ```
      Le cast brut casse la garantie de type : la liste d'entiers contient un `Double`. On crée une vraie `List<Number>`
      (une copie), ou l'on utilise un joker pour la lecture.
  - key: bug-retour-liste
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      List<Number> mesures() {
          List<Integer> brutes = capteur.lire();
          return brutes;
      }
      ```
    choices:
      - {text: "Copier : `return new ArrayList<>(capteur.lire());`", correct: true}
      - {text: "Caster : `return (List<Number>) brutes;`", correct: false}
      - {text: "Écrire `List<Number> brutes = capteur.lire();`", correct: false}
      - {text: "Renvoyer `List<Object>`, le type le plus général", correct: false}
    answer: |-
      ```java
      List<Number> mesures() {
          return new ArrayList<>(capteur.lire());
      }
      // ou : List<? extends Number> mesures(), si l'appelant ne fait que lire
      ```
      Une `List<Integer>` n'est pas une `List<Number>` : on la copie dans une liste du bon type.
