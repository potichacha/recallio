notion: generiques-recursifs
lesson: |-
  Une **borne récursive** fait apparaître le paramètre de type dans sa propre borne : `<T extends Comparable<T>>` se lit
  « un `T` comparable à d'autres `T` ».

  ```java
  // « T comparable à lui-même, ou à l'un de ses parents »
  static <T extends Comparable<? super T>> T max(Collection<? extends T> elements) { ... }
  ```

  Pourquoi `Comparable<? super T>` plutôt que `Comparable<T>` ? Si `Pomme extends Fruit` et que `Fruit implements
  Comparable<Fruit>`, alors `Pomme` est un `Comparable<Fruit>`, **pas** un `Comparable<Pomme>`. La borne avec `? super`
  accepte quand même une liste de pommes. C'est la signature de `Collections.max`.

  Deux autres usages classiques :
  - **`Enum<E extends Enum<E>>`** : chaque enum se compare seulement aux constantes de son propre type ;
  - le **type « soi-même »** des builders hérités, pour que les méthodes du parent renvoient le type de l'enfant :

  ```java
  abstract class Builder<B extends Builder<B>> {
      String nom;
      B nom(String n) { this.nom = n; return self(); }   // renvoie le builder concret
      abstract B self();
  }
  class PizzaBuilder extends Builder<PizzaBuilder> {
      boolean fromage;
      PizzaBuilder fromage() { fromage = true; return this; }
      @Override PizzaBuilder self() { return this; }
  }
  new PizzaBuilder().nom("reine").fromage();   // nom() renvoie un PizzaBuilder : le chaînage continue
  ```

  **Piège classique** : borner par `<T extends Comparable<T>>` et ne plus pouvoir trier une liste de sous-classes dont le
  parent définit la comparaison.

  **En entretien** : « `<T extends Comparable<? super T>>` accepte un type dont un parent définit la comparaison ; les
  bornes récursives servent aussi aux enums et aux builders hérités. »
cards:
  - key: signifie-extends-comparable-super
    format: course
    question: Que signifie `<T extends Comparable<? super T>>` ?
    choices:
      - {text: "Un type `T` comparable à lui-même, ou à travers l'un de ses super-types", correct: true}
      - {text: "Un type `T` comparable seulement à des sous-types de `T`, jamais à `T`", correct: false}
      - {text: "Un type `T` dont la classe parente doit obligatoirement être `Comparable`", correct: false}
      - {text: "Un type `T` comparable à n'importe quel objet, quel que soit son type", correct: false}
    answer: |-
      Un type comparable à lui-même ou à l'un de ses super-types : c'est souvent un parent qui définit `compareTo`, comme
      `Fruit` pour `Pomme`.
  - key: pourquoi-super
    format: course
    question: Pourquoi `Comparable<? super T>` plutôt que `Comparable<T>` ?
    choices:
      - {text: "Pour accepter un `T` dont c'est un parent qui implémente `Comparable`, comme `Pomme` sous `Fruit`", correct: true}
      - {text: "Pour accepter un `T` qui se compare à ses sous-classes, comme `Fruit` comparé à `Pomme`", correct: false}
      - {text: "Pour autoriser la comparaison de `T` avec `null`, sans `NullPointerException`", correct: false}
      - {text: "Pour que `compareTo` puisse modifier les objets comparés, sans avertissement", correct: false}
    answer: Si la comparaison est définie par un parent (`Fruit implements Comparable<Fruit>`), une sous-classe `Pomme` n'est pas un `Comparable<Pomme>` ; la version avec `? super` l'accepte quand même.
  - key: enum
    format: course
    question: Que garantit la déclaration `Enum<E extends Enum<E>>` ?
    choices:
      - {text: "Qu'une enum ne se compare qu'à ses propres constantes, et que `valueOf` renvoie son type", correct: true}
      - {text: "Qu'une enum peut hériter d'une autre enum, et redéfinir les constantes de son parent", correct: false}
      - {text: "Que toutes les enums se comparent entre elles, d'après la position de leurs constantes", correct: false}
      - {text: "Qu'une enum peut être paramétrée par un type, comme `Feu<String>` ou `Feu<Integer>`", correct: false}
    answer: Que chaque enum ne se compare (`compareTo`) qu'à des constantes de son propre type, et que des méthodes comme `valueOf` renvoient ce type précis.
  - key: self-type
    format: course
    question: À quoi sert le paramètre « soi-même » `B extends Builder<B>` d'un builder ?
    choices:
      - {text: "À faire renvoyer aux méthodes du parent le type du builder enfant, pour chaîner", correct: true}
      - {text: "À empêcher l'héritage du builder, comme le ferait le mot-clé `final`", correct: false}
      - {text: "À créer le builder enfant par réflexion, sans constructeur public", correct: false}
      - {text: "À rendre le builder immuable, chaque méthode renvoyant une copie", correct: false}
    answer: À faire renvoyer aux méthodes du builder parent le type du builder enfant, pour qu'on puisse continuer à chaîner les méthodes propres à l'enfant.
  - key: vf-pomme
    format: true-false
    question: "Si `Fruit implements Comparable<Fruit>`, alors `Pomme extends Fruit` est un `Comparable<Pomme>`."
    truth: false
    answer: Elle est un `Comparable<Fruit>` ; d'où le `? super T`.
  - key: vf-collections-max
    format: true-false
    question: "`Collections.max` utilise une borne de la forme `T extends Comparable<? super T>`."
    truth: true
    answer: '(Avec en plus `Object &` en tête, pour des raisons de compatibilité binaire.)'
  - key: vf-enum
    format: true-false
    question: On peut comparer une constante de `Feu` à une constante de `Jour` avec `compareTo`.
    truth: false
    answer: '`Enum<E extends Enum<E>>` limite `compareTo` aux constantes du même type.'
  - key: vf-builder
    format: true-false
    question: Sans type « soi-même », une méthode du builder parent renvoie le type du parent et casse le chaînage des méthodes de l'enfant.
    truth: true
    answer: Le compilateur ne connaît alors que les méthodes du parent.
  - key: qcm-signature-max
    format: multiple-choice
    question: Quelle signature accepte une `List<Pomme>`, où `Pomme extends Fruit implements Comparable<Fruit>` ?
    choices:
      - text: "`static <T extends Comparable<? super T>> T max(List<? extends T> l)`"
        correct: true
      - text: "`static <T extends Comparable<T>> T max(List<T> l)`"
        correct: false
      - text: "`static <T> T max(List<T> l)`, qui appelle `compareTo`"
        correct: false
      - text: "`static Comparable max(List l)`"
        correct: false
    answer: '`Pomme` n''est pas un `Comparable<Pomme>`.'
  - key: qcm-lecture
    format: multiple-choice
    question: "Comment lire `<T extends Comparable<T>>` ?"
    choices:
      - text: "Un type `T` comparable à d'autres `T`"
        correct: true
      - text: "Un type qui étend la classe `Comparable`"
        correct: false
      - text: "Un type comparable à n'importe quoi"
        correct: false
      - text: "Une erreur de syntaxe"
        correct: false
    answer: '`Comparable` est une interface ; la borne exige `compareTo(T)`.'
  - key: qcm-exemples
    format: multiple-choice
    question: "Laquelle de ces déclarations utilise une borne récursive ?"
    choices:
      - {text: "`Enum<E extends Enum<E>>`", correct: true}
      - {text: "`List<E>`", correct: false}
      - {text: "`Map<K, V>`", correct: false}
      - {text: "`Optional<T>`", correct: false}
    answer: |-
      `E` y est borné par un type qui le mentionne lui-même. On en trouve aussi dans les builders hérités
      (`Builder<B extends Builder<B>>`) et dans `Collections.max` ; `List<E>`, `Map<K, V>` et `Optional<T>` n'ont pas de
      borne.
  - key: qcm-self
    format: multiple-choice
    question: "Dans `class PizzaBuilder extends Builder<PizzaBuilder>`, que renvoie la méthode héritée `nom(String)` ?"
    choices:
      - text: "Un `PizzaBuilder`"
        correct: true
      - text: "Un `Builder` brut"
        correct: false
      - text: "Un `Object`"
        correct: false
      - text: "`void`"
        correct: false
    answer: '`B` vaut `PizzaBuilder` ; on peut donc enchaîner `.fromage()`.'
  - key: code-max-pommes
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Fruit implements Comparable<Fruit> {
          final int poids;
          Fruit(int poids) { this.poids = poids; }
          public int compareTo(Fruit o) { return Integer.compare(poids, o.poids); }
      }
      class Pomme extends Fruit { Pomme(int poids) { super(poids); } }
      static <T extends Comparable<? super T>> T max(List<T> l) {
          T m = l.get(0);
          for (T x : l) if (x.compareTo(m) > 0) m = x;
          return m;
      }
      Pomme p = max(List.of(new Pomme(120), new Pomme(150)));
      System.out.println(p.poids);
      ```
    choices:
      - {text: "`150`", correct: true}
      - {text: "`120`", correct: false}
      - {text: "`270`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`150` : la borne `? super T` accepte des pommes comparées comme des fruits, et `max` garde la plus lourde."
    check:
      output: "150"
  - key: code-borne-stricte
    format: code-output
    question: |-
      ```java
      class Fruit implements Comparable<Fruit> {
          public int compareTo(Fruit o) { return 0; }
      }
      class Pomme extends Fruit { }
      static <T extends Comparable<T>> T max(List<T> l) { return l.get(0); }
      Pomme p = max(List.of(new Pomme()));
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui : `Pomme` hérite de `compareTo`", correct: false}
      - {text: "Oui, avec un avertissement unchecked", correct: false}
      - {text: "Oui, mais il lève une `ClassCastException`", correct: false}
    answer: "Ça ne compile pas : `Pomme` est un `Comparable<Fruit>`, pas un `Comparable<Pomme>`. Il faudrait `Comparable<? super T>`."
    check:
      compiles: false
  - key: code-enum
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      enum Feu { VERT, ROUGE }
      System.out.println((Feu.VERT.compareTo(Feu.ROUGE) < 0) + " " + Feu.VERT.getDeclaringClass().getSuperclass().getSimpleName());
      ```
    choices:
      - {text: "`true Enum`", correct: true}
      - {text: "`false Enum`", correct: false}
      - {text: "`true Object`", correct: false}
      - {text: "`true Feu`", correct: false}
    answer: "`true Enum` : `VERT` est déclaré avant `ROUGE`, et chaque enum étend `Enum<E>`."
    check:
      output: "true Enum"
  - key: code-builder
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      abstract class Builder<B extends Builder<B>> {
          String nom;
          B nom(String n) { nom = n; return self(); }
          abstract B self();
      }
      class PizzaBuilder extends Builder<PizzaBuilder> {
          boolean fromage;
          PizzaBuilder fromage() { fromage = true; return this; }
          PizzaBuilder self() { return this; }
      }
      PizzaBuilder b = new PizzaBuilder().nom("reine").fromage();
      System.out.println(b.nom + " " + b.fromage);
      ```
    choices:
      - {text: "`reine true`", correct: true}
      - {text: "`reine false`", correct: false}
      - {text: "`null true`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`reine true` : `nom()` renvoie un `PizzaBuilder`, et le chaînage continue avec `fromage()`."
    check:
      output: "reine true"
  - key: bug-borne-stricte
    format: bug-fix
    question: |-
      Ce tri générique refuse une liste de `Facture`, alors que `Document`, leur parent, est comparable. Quelle
      correction est la bonne ?
      ```java
      static <T extends Comparable<T>> void trier(List<T> l) { Collections.sort(l); }
      ```
    choices:
      - {text: "Élargir la borne : `<T extends Comparable<? super T>>`", correct: true}
      - {text: "Changer la borne : `<T extends Comparable<? extends T>>`", correct: false}
      - {text: "Faire implémenter aussi `Comparable<Facture>` à `Facture`", correct: false}
      - {text: "Retirer la borne, `<T>`, et laisser `Collections.sort` vérifier", correct: false}
    answer: |-
      ```java
      static <T extends Comparable<? super T>> void trier(List<T> l) { Collections.sort(l); }
      ```
      `Facture` est un `Comparable<Document>`, pas un `Comparable<Facture>`. La borne avec `? super T` accepte un type dont
      le parent définit l'ordre.
  - key: bug-chainage-casse
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: method fromage()`). Quelle correction est la bonne ?
      ```java
      abstract class Builder {
          Builder nom(String n) { nom = n; return this; }
      }
      class PizzaBuilder extends Builder {
          PizzaBuilder fromage() { ... }
      }
      new PizzaBuilder().nom("reine").fromage();
      ```
    choices:
      - {text: "Un type « soi-même » : `Builder<B extends Builder<B>>`, avec `B nom(...)` et `self()`", correct: true}
      - {text: "Déclarer `fromage()` dans `Builder`, qui renvoie `null` pour les autres builders", correct: false}
      - {text: "Rendre `nom()` `static`, pour qu'il renvoie le type de la classe qui l'appelle", correct: false}
      - {text: "Redéfinir `Builder nom(String n)` dans `PizzaBuilder`, avec le même type de retour", correct: false}
    answer: |-
      ```java
      abstract class Builder<B extends Builder<B>> {
          B nom(String n) { nom = n; return self(); }
          abstract B self();
      }
      class PizzaBuilder extends Builder<PizzaBuilder> {
          PizzaBuilder fromage() { ... }
          @Override PizzaBuilder self() { return this; }
      }
      ```
      `nom()` renvoyait un `Builder`, qui n'a pas de `fromage()`. Le type « soi-même » fait renvoyer le builder concret.
  - key: bug-comparable-brut
    format: bug-fix
    question: |-
      Le compilateur avertit (*unchecked*), et rien n'empêche de comparer des types incompatibles. Quelle correction
      est la bonne ?
      ```java
      static Comparable max(List<Comparable> l) { ... }
      ```
    choices:
      - {text: "`static <T extends Comparable<? super T>> T max(List<? extends T> l)`", correct: true}
      - {text: "`static Comparable<?> max(List<Comparable<?>> l)`", correct: false}
      - {text: "`static <T> T max(List<Comparable<T>> l)`", correct: false}
      - {text: "`static Comparable<Object> max(List<Comparable<Object>> l)`", correct: false}
    answer: |-
      ```java
      static <T extends Comparable<? super T>> T max(List<? extends T> l) { ... }
      ```
      La borne récursive garantit que les éléments sont comparables entre eux, et la méthode renvoie le type précis.
  - key: bug-max-object
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: method compareTo(T)`). Quelle correction est la bonne ?
      ```java
      static <T> T max(List<T> l) {
          T m = l.get(0);
          for (T x : l) if (x.compareTo(m) > 0) m = x;
          return m;
      }
      ```
    choices:
      - {text: "Borner `T` : `<T extends Comparable<? super T>>`", correct: true}
      - {text: "Déclarer `<T implements Comparable<T>>`", correct: false}
      - {text: "Recevoir une `List<Comparable>` brute à la place", correct: false}
      - {text: "Remplacer `compareTo` par `equals`, que tout `T` a", correct: false}
    answer: |-
      ```java
      static <T extends Comparable<? super T>> T max(List<? extends T> l) {
          T m = l.get(0);
          for (T x : l) if (x.compareTo(m) > 0) m = x;
          return m;
      }
      ```
      Sans borne, `T` n'a pas de `compareTo`. La borne récursive le garantit, y compris pour une comparaison héritée.
  - key: ecris-methode-renvoie-maximum-collection-importe
    format: scenario
    question: |-
      Tu dois écrire une méthode qui renvoie le maximum d'une collection de n'importe quel type comparable. Quelle
      signature choisis-tu ?
    choices:
      - {text: "`static <T extends Comparable<? super T>> T max(Collection<? extends T> c)`", correct: true}
      - {text: "`static <T extends Comparable<T>> T max(Collection<T> c)`", correct: false}
      - {text: "`static Comparable max(Collection<Comparable> c)`", correct: false}
      - {text: "`static <T> T max(Collection<? super T> c)`", correct: false}
    answer: |-
      C'est presque la signature de `Collections.max` : `Comparable<? super T>` accepte un type dont le parent définit la
      comparaison, et `? extends T` applique PECS (la collection produit des `T`). En pratique,
      `stream().max(Comparator.naturalOrder())` renvoie un `Optional` et règle le cas de la collection vide.
  - key: scenario-builder-herite
    format: scenario
    question: |-
      Tu as un builder de base pour plusieurs types de notifications (email, SMS) qui partagent des champs. Comment
      l'écris-tu ?
    choices:
      - {text: "Un builder abstrait `NotificationBuilder<B extends NotificationBuilder<B>>`, dont les méthodes renvoient `self()`", correct: true}
      - {text: "Un builder abstrait dont les méthodes renvoient `NotificationBuilder`, casté par chaque appelant", correct: false}
      - {text: "Un seul builder pour tous les types, dont les champs restent `null` selon la notification", correct: false}
      - {text: "Des setters publics sur chaque notification, sans builder ni héritage, appelés un par un", correct: false}
    answer: |-
      Le builder abstrait porte les champs communs et des méthodes qui renvoient `B` via `self()` ; `EmailBuilder extends
      NotificationBuilder<EmailBuilder>` ajoute `sujet()`, et `new EmailBuilder().destinataire(...).sujet(...)` se chaîne
      sans cast. Pour une petite hiérarchie, un builder par type, sans héritage, peut suffire.
  - key: scenario-expliquer
    format: scenario
    question: Un collègue trouve `<T extends Comparable<? super T>>` illisible. Comment le lui expliques-tu ?
    choices:
      - {text: "« Un `T` qu'on sait comparer à des `T` », avec une `Pomme` comparée en tant que `Fruit`", correct: true}
      - {text: "« Un `T` qui hérite forcément d'une classe `Comparable` », avec l'exemple de `String`", correct: false}
      - {text: "« Une syntaxe héritée de Java 5, inutile aujourd'hui », et je propose de l'enlever", correct: false}
      - {text: "« Un `T` comparable à tout », avec un `Integer` comparé à une `String` en exemple", correct: false}
    answer: |-
      Lu à voix haute : « un type `T` qu'on sait comparer à des `T` ». `extends Comparable<...>` donne `compareTo` ;
      `? super T` élargit aux cas où un parent définit la comparaison, comme une `Pomme` comparée en tant que `Fruit`. Je
      montre l'exemple qui échoue avec `Comparable<T>`, et je rappelle que `Comparator` et les streams le cachent souvent.
  - key: scenario-api-tri
    format: scenario
    question: Tu exposes une méthode utilitaire publique qui trie une collection. Quelle signature choisis-tu ?
    choices:
      - {text: "`<T extends Comparable<? super T>> List<T> trier(Collection<? extends T> c)`, et une variante avec `Comparator<? super T>`", correct: true}
      - {text: "`<T extends Comparable<T>> void trier(List<T> c)`, qui trie en place, sans aucune variante avec comparateur", correct: false}
      - {text: "`List trier(Collection c)`, brute, pour accepter n'importe quelle collection sans aucune contrainte de type", correct: false}
      - {text: "`<T> List<T> trier(Collection<T> c, Comparator<T> ordre)`, sans aucun joker, jugé plus lisible pour tous", correct: false}
    answer: |-
      Deux variantes, comme la JDK : l'ordre naturel, qui accepte les sous-classes d'un type comparable et une collection
      de sous-types (PECS), et un ordre fourni, où le comparateur consomme des `T`. Je renvoie une nouvelle liste plutôt
      que de trier en place, et je documente le cas d'une collection vide ou contenant `null`.
