notion: generiques-recursifs
lesson: |-
  Une **borne récursive** fait apparaître le paramètre de type dans sa propre borne : `<T extends Comparable<T>>` se lit
  « un `T` comparable à d'autres `T` ».

  ```java
  // « T comparable à lui-même, ou à l'un de ses parents »
  static <T extends Comparable<? super T>> T max(Collection<? extends T> elements) { ... }
  ```

  Pourquoi `Comparable<? super T>` plutôt que `Comparable<T>` ? Si `Pomme extends Fruit` et que `Fruit implements
  Comparable<Fruit>`, alors `Pomme` est un `Comparable<Fruit>`, **pas** un `Comparable<Pomme>`. La borne avec `? super`
  accepte quand même une liste de pommes. C'est la signature de `Collections.max`.

  Deux autres usages classiques :
  - **`Enum<E extends Enum<E>>`** : chaque enum se compare seulement aux constantes de son propre type ;
  - le **type « soi-même »** des builders hérités, pour que les méthodes du parent renvoient le type de l'enfant :

  ```java
  abstract class Builder<B extends Builder<B>> {
      String nom;
      B nom(String n) { this.nom = n; return self(); }   // renvoie le builder concret
      abstract B self();
  }
  class PizzaBuilder extends Builder<PizzaBuilder> {
      boolean fromage;
      PizzaBuilder fromage() { fromage = true; return this; }
      @Override PizzaBuilder self() { return this; }
  }
  new PizzaBuilder().nom("reine").fromage();   // nom() renvoie un PizzaBuilder : le chaînage continue
  ```

  **Piège classique** : borner par `<T extends Comparable<T>>` et ne plus pouvoir trier une liste de sous-classes dont le
  parent définit la comparaison.

  **En entretien** : « `<T extends Comparable<? super T>>` accepte un type dont un parent définit la comparaison ; les
  bornes récursives servent aussi aux enums et aux builders hérités. »
cards:
  - key: signifie-extends-comparable-super
    format: course
    question: Que signifie `<T extends Comparable<? super T>>` ?
    answer: Un type comparable à lui-même ou à l'un de ses super-types.
  - key: pourquoi-super
    format: course
    question: Pourquoi `Comparable<? super T>` plutôt que `Comparable<T>` ?
    answer: Si la comparaison est définie par un parent (`Fruit implements Comparable<Fruit>`), une sous-classe `Pomme` n'est pas un `Comparable<Pomme>` ; la version avec `? super` l'accepte quand même.
  - key: enum
    format: course
    question: Que garantit la déclaration `Enum<E extends Enum<E>>` ?
    answer: Que chaque enum ne se compare (`compareTo`) qu'à des constantes de son propre type, et que des méthodes comme `valueOf` renvoient ce type précis.
  - key: self-type
    format: course
    question: À quoi sert le paramètre « soi-même » `B extends Builder<B>` d'un builder ?
    answer: À faire renvoyer aux méthodes du builder parent le type du builder enfant, pour qu'on puisse continuer à chaîner les méthodes propres à l'enfant.
  - key: vf-pomme
    format: true-false
    question: "Si `Fruit implements Comparable<Fruit>`, alors `Pomme extends Fruit` est un `Comparable<Pomme>`."
    truth: false
    answer: Elle est un `Comparable<Fruit>` ; d'où le `? super T`.
  - key: vf-collections-max
    format: true-false
    question: "`Collections.max` utilise une borne de la forme `T extends Comparable<? super T>`."
    truth: true
    answer: '(Avec en plus `Object &` en tête, pour des raisons de compatibilité binaire.)'
  - key: vf-enum
    format: true-false
    question: On peut comparer une constante de `Feu` à une constante de `Jour` avec `compareTo`.
    truth: false
    answer: '`Enum<E extends Enum<E>>` limite `compareTo` aux constantes du même type.'
  - key: vf-builder
    format: true-false
    question: Sans type « soi-même », une méthode du builder parent renvoie le type du parent et casse le chaînage des méthodes de l'enfant.
    truth: true
    answer: Le compilateur ne connaît alors que les méthodes du parent.
  - key: qcm-signature-max
    format: multiple-choice
    question: Quelle signature accepte une `List<Pomme>`, où `Pomme extends Fruit implements Comparable<Fruit>` ?
    choices:
      - text: "`static <T extends Comparable<? super T>> T max(List<? extends T> l)`"
        correct: true
      - text: "`static <T extends Comparable<T>> T max(List<T> l)`"
        correct: false
      - text: "`static <T> T max(List<T> l)`, qui appelle `compareTo`"
        correct: false
      - text: "`static Comparable max(List l)`"
        correct: false
    answer: '`Pomme` n''est pas un `Comparable<Pomme>`.'
  - key: qcm-lecture
    format: multiple-choice
    question: "Comment lire `<T extends Comparable<T>>` ?"
    choices:
      - text: "Un type `T` comparable à d'autres `T`"
        correct: true
      - text: "Un type qui étend la classe `Comparable`"
        correct: false
      - text: "Un type comparable à n'importe quoi"
        correct: false
      - text: "Une erreur de syntaxe"
        correct: false
    answer: '`Comparable` est une interface ; la borne exige `compareTo(T)`.'
  - key: qcm-exemples
    format: multiple-choice
    question: Où trouve-t-on des bornes récursives ?
    choices:
      - text: "Dans `Enum<E extends Enum<E>>`"
        correct: true
      - text: "Dans les builders hérités (`Builder<B extends Builder<B>>`)"
        correct: true
      - text: "Dans `Collections.max`"
        correct: true
      - text: "Dans `List<E>`"
        correct: false
    answer: '`List<E>` n''a pas de borne.'
  - key: qcm-self
    format: multiple-choice
    question: "Dans `class PizzaBuilder extends Builder<PizzaBuilder>`, que renvoie la méthode héritée `nom(String)` ?"
    choices:
      - text: "Un `PizzaBuilder`"
        correct: true
      - text: "Un `Builder` brut"
        correct: false
      - text: "Un `Object`"
        correct: false
      - text: "`void`"
        correct: false
    answer: '`B` vaut `PizzaBuilder` ; on peut donc enchaîner `.fromage()`.'
  - key: code-max-pommes
    format: code-output
    question: |-
      ```java
      class Fruit implements Comparable<Fruit> {
          final int poids;
          Fruit(int poids) { this.poids = poids; }
          public int compareTo(Fruit o) { return Integer.compare(poids, o.poids); }
      }
      class Pomme extends Fruit { Pomme(int poids) { super(poids); } }
      static <T extends Comparable<? super T>> T max(List<T> l) {
          T m = l.get(0);
          for (T x : l) if (x.compareTo(m) > 0) m = x;
          return m;
      }
      Pomme p = max(List.of(new Pomme(120), new Pomme(150)));
      System.out.println(p.poids);
      ```
    answer: '`150` : la borne `? super T` accepte des pommes comparées comme des fruits.'
    check:
      output: "150"
  - key: code-borne-stricte
    format: code-output
    question: |-
      ```java
      class Fruit implements Comparable<Fruit> {
          public int compareTo(Fruit o) { return 0; }
      }
      class Pomme extends Fruit { }
      static <T extends Comparable<T>> T max(List<T> l) { return l.get(0); }
      Pomme p = max(List.of(new Pomme()));
      ```
      Ce code compile-t-il ?
    answer: 'Non : `Pomme` n''est pas un `Comparable<Pomme>`.'
    check:
      compiles: false
  - key: code-enum
    format: code-output
    question: |-
      ```java
      enum Feu { VERT, ROUGE }
      System.out.println((Feu.VERT.compareTo(Feu.ROUGE) < 0) + " " + Feu.VERT.getDeclaringClass().getSuperclass().getSimpleName());
      ```
    answer: '`true Enum` : chaque enum étend `Enum<E>` et se compare à ses propres constantes.'
    check:
      output: "true Enum"
  - key: code-builder
    format: code-output
    question: |-
      ```java
      abstract class Builder<B extends Builder<B>> {
          String nom;
          B nom(String n) { nom = n; return self(); }
          abstract B self();
      }
      class PizzaBuilder extends Builder<PizzaBuilder> {
          boolean fromage;
          PizzaBuilder fromage() { fromage = true; return this; }
          PizzaBuilder self() { return this; }
      }
      PizzaBuilder b = new PizzaBuilder().nom("reine").fromage();
      System.out.println(b.nom + " " + b.fromage);
      ```
    answer: '`reine true` : `nom()` renvoie un `PizzaBuilder`, et le chaînage continue.'
    check:
      output: "reine true"
  - key: bug-borne-stricte
    format: bug-fix
    question: |-
      Ce tri générique refuse une liste de `Facture`, alors que `Document` (leur parent) est comparable :
      ```java
      static <T extends Comparable<T>> void trier(List<T> l) { Collections.sort(l); }
      ```
    answer: |-
      ```java
      static <T extends Comparable<? super T>> void trier(List<T> l) { Collections.sort(l); }
      ```
      `Facture` est un `Comparable<Document>`, pas un `Comparable<Facture>`. La borne avec `? super T` accepte un type dont
      le parent définit l'ordre.
  - key: bug-chainage-casse
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: method fromage()`) :
      ```java
      abstract class Builder {
          Builder nom(String n) { nom = n; return this; }
      }
      class PizzaBuilder extends Builder {
          PizzaBuilder fromage() { ... }
      }
      new PizzaBuilder().nom("reine").fromage();
      ```
    answer: |-
      ```java
      abstract class Builder<B extends Builder<B>> {
          B nom(String n) { nom = n; return self(); }
          abstract B self();
      }
      class PizzaBuilder extends Builder<PizzaBuilder> {
          PizzaBuilder fromage() { ... }
          @Override PizzaBuilder self() { return this; }
      }
      ```
      `nom()` renvoyait un `Builder`, qui n'a pas de `fromage()`. Le type « soi-même » fait renvoyer le builder concret.
  - key: bug-comparable-brut
    format: bug-fix
    question: |-
      Le compilateur avertit (*unchecked*) et rien n'empêche de comparer des types incompatibles :
      ```java
      static Comparable max(List<Comparable> l) { ... }
      ```
    answer: |-
      ```java
      static <T extends Comparable<? super T>> T max(List<? extends T> l) { ... }
      ```
      La borne récursive garantit que les éléments sont comparables entre eux, et la méthode renvoie le type précis.
  - key: bug-max-object
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: method compareTo(T)`) :
      ```java
      static <T> T max(List<T> l) {
          T m = l.get(0);
          for (T x : l) if (x.compareTo(m) > 0) m = x;
          return m;
      }
      ```
    answer: |-
      ```java
      static <T extends Comparable<? super T>> T max(List<? extends T> l) {
          T m = l.get(0);
          for (T x : l) if (x.compareTo(m) > 0) m = x;
          return m;
      }
      ```
      Sans borne, `T` n'a pas de `compareTo`. La borne récursive le garantit, y compris pour une comparaison héritée.
  - key: ecris-methode-renvoie-maximum-collection-importe
    format: scenario
    question: Écris une méthode qui renvoie le maximum d'une collection de n'importe quel type comparable.
    answer: |-
      ```java
      static <T extends Comparable<? super T>> T max(Collection<? extends T> elements) {
          Iterator<? extends T> it = elements.iterator();
          T max = it.next();                 // NoSuchElementException si vide : à documenter
          while (it.hasNext()) {
              T e = it.next();
              if (e.compareTo(max) > 0) max = e;
          }
          return max;
      }
      ```
      "La borne `Comparable<? super T>` accepte un type dont le parent définit la comparaison (par exemple une sous-classe de `LocalDate`), et `? extends T` en entrée applique PECS : la collection produit des T. C'est presque exactement la signature de `Collections.max`. En pratique j'utiliserais `stream().max(Comparator.naturalOrder())` qui renvoie un Optional et règle le cas de la collection vide."
  - key: scenario-builder-herite
    format: scenario
    question: Tu as un builder de base pour plusieurs types de notifications (email, SMS) qui partagent des champs. Comment l'écris-tu ?
    answer: |-
      Une classe abstraite `NotificationBuilder<B extends NotificationBuilder<B>>` porte les champs communs
      (destinataire, priorité) et des méthodes qui renvoient `B` via une méthode abstraite `self()`. `EmailBuilder extends
      NotificationBuilder<EmailBuilder>` ajoute `sujet()` et implémente `self()` en renvoyant `this`. Ainsi
      `new EmailBuilder().destinataire(...).sujet(...)` se chaîne sans cast. Si la hiérarchie reste petite, je compare avec
      une alternative plus simple : un builder par type, sans héritage, ou des records avec des fabriques.
  - key: scenario-expliquer
    format: scenario
    question: Un collègue trouve `<T extends Comparable<? super T>>` illisible. Comment le lui expliques-tu ?
    answer: |-
      Je le lis à voix haute : « un type `T` qu'on sait comparer à des `T` ». Le `extends Comparable<...>` donne accès à
      `compareTo` ; le `? super T` élargit aux cas où c'est un parent de `T` qui définit la comparaison, comme une
      `Pomme` comparée en tant que `Fruit`. Je montre l'exemple qui échoue avec `Comparable<T>` et compile avec
      `? super T`. Et je rappelle que dans le code d'application, on a rarement besoin de l'écrire : `Comparator` et les
      streams le cachent déjà.
  - key: scenario-api-tri
    format: scenario
    question: Tu exposes une méthode utilitaire publique qui trie une collection. Quelle signature choisis-tu ?
    answer: |-
      Deux variantes, comme la JDK. L'ordre naturel :
      `static <T extends Comparable<? super T>> List<T> trier(Collection<? extends T> c)`, qui accepte les sous-classes
      d'un type comparable et une collection de sous-types (PECS). Un ordre fourni :
      `static <T> List<T> trier(Collection<? extends T> c, Comparator<? super T> ordre)`, où le comparateur consomme
      des `T`. Je renvoie une nouvelle liste plutôt que de trier en place, et je documente le comportement pour une
      collection vide ou contenant `null`.
