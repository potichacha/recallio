notion: pecs
lesson: |-
  **PECS** (*Producer Extends, Consumer Super*, *Effective Java*, item 31) dit quel joker choisir pour un paramètre :

  - si le paramètre **produit** des `T` (on y **lit**) : `? extends T` ;
  - s'il **consomme** des `T` (on y **écrit**, ou il les reçoit) : `? super T` ;
  - s'il fait les deux : le type exact `T`.

  ```java
  static <T> void copier(List<? extends T> source,        // produit des T : on les lit
                         List<? super T> destination) {    // consomme des T : on les y ajoute
      for (T element : source) {
          destination.add(element);
      }
  }

  List<Integer> entiers = List.of(1, 2);
  List<Number> nombres = new ArrayList<>();
  copier(entiers, nombres);     // T = Integer : source List<Integer>, destination List<Number>
  ```

  Exemples dans la JDK :
  - `Collections.copy(List<? super T> dest, List<? extends T> src)` ;
  - `List.sort(Comparator<? super E> c)` : un comparateur de `Number` peut trier une liste d'`Integer` ;
  - `Collection.addAll(Collection<? extends E> c)` ;
  - `Predicate<? super T>`, `Function<? super T, ? extends R>` dans l'API des streams : une fonction **consomme** son
    argument et **produit** son résultat.

  Bien appliqué, PECS rend une API utilisable avec tous les types compatibles, sans que l'appelant pense aux jokers.

  **Piège classique** : `copier(List<T> source, List<T> destination)`. Impossible alors de copier une `List<Integer>`
  dans une `List<Number>` : `T` devrait être à la fois `Integer` et `Number`.

  **En entretien** : « PECS : `extends` pour ce qu'on lit, `super` pour ce qu'on écrit ; c'est pourquoi `sort` prend un
  `Comparator<? super E>`. »
cards:
  - key: pecs
    format: course
    question: C'est quoi PECS ?
    answer: Producer Extends, Consumer Super, extends pour lire, super pour écrire.
  - key: exemple-pecs-jdk
    format: course
    question: Exemple de PECS dans le JDK ?
    answer: '`Collections.copy(List<? super T> dest, List<? extends T> src)`.'
  - key: comparator-super
    format: course
    question: Pourquoi `List.sort` prend-il un `Comparator<? super E>` ?
    answer: Le comparateur consomme des éléments ; un comparateur d'un type parent (par exemple de `Number`) sait comparer des `Integer`, il doit donc être accepté.
  - key: function
    format: course
    question: Pourquoi `map` déclare-t-il `Function<? super T, ? extends R>` ?
    answer: "La fonction consomme des `T` (argument : `? super T`) et produit des `R` (résultat : `? extends R`) : on peut lui passer une fonction plus générale en entrée et plus précise en sortie."
  - key: vf-producteur
    format: true-false
    question: Un paramètre qu'on ne fait que lire est un producteur, à déclarer avec `? extends T`.
    truth: true
    answer: Il produit des `T` pour la méthode.
  - key: vf-consommateur
    format: true-false
    question: Un paramètre dans lequel on ajoute des éléments se déclare avec `? extends T`.
    truth: false
    answer: "C'est un consommateur : `? super T`."
  - key: vf-les-deux
    format: true-false
    question: Un paramètre qu'on lit et qu'on écrit à la fois se déclare avec le type exact `T`.
    truth: true
    answer: Aucun joker ne permet les deux opérations.
  - key: vf-predicate
    format: true-false
    question: "Un `Predicate<Object>` peut être passé à `filter` sur un `Stream<String>`."
    truth: true
    answer: '`filter` prend un `Predicate<? super T>`.'
  - key: qcm-copier
    format: multiple-choice
    question: Quelle signature permet de copier une `List<Integer>` dans une `List<Number>` ?
    choices:
      - text: "`<T> void copier(List<? extends T> src, List<? super T> dst)`"
        correct: true
      - text: "`<T> void copier(List<T> src, List<T> dst)`"
        correct: false
      - text: "`<T> void copier(List<? super T> src, List<? extends T> dst)`"
        correct: false
      - text: "`void copier(List<Number> src, List<Number> dst)`"
        correct: false
    answer: La source produit (`extends`), la destination consomme (`super`).
  - key: qcm-sort
    format: multiple-choice
    question: "Quel comparateur peut trier une `List<Integer>` avec `liste.sort(...)` ?"
    choices:
      - text: "Un `Comparator<Integer>`"
        correct: true
      - text: "Un `Comparator<Number>`"
        correct: true
      - text: "Un `Comparator<Object>` cohérent"
        correct: true
      - text: "Un `Comparator<Double>`"
        correct: false
    answer: '`sort` accepte un `Comparator<? super Integer>`.'
  - key: qcm-role
    format: multiple-choice
    question: "Dans `addAll(Collection<? extends E> c)`, quel est le rôle de `c` ?"
    choices:
      - text: "Un producteur : on lit ses éléments pour les ajouter"
        correct: true
      - text: "Un consommateur"
        correct: false
      - text: "Les deux"
        correct: false
      - text: "Aucun"
        correct: false
    answer: Une liste de `Number` peut donc recevoir tous les éléments d'une liste d'`Integer`.
  - key: qcm-function
    format: multiple-choice
    question: "Quelle signature de méthode qui applique une transformation est la plus souple ?"
    choices:
      - text: "`<T, R> List<R> transformer(List<? extends T> l, Function<? super T, ? extends R> f)`"
        correct: true
      - text: "`<T, R> List<R> transformer(List<T> l, Function<T, R> f)`"
        correct: false
      - text: "`List<Object> transformer(List<Object> l, Function<Object, Object> f)`"
        correct: false
      - text: "`<T, R> List<? extends R> transformer(List<T> l, Function<T, R> f)`"
        correct: false
    answer: Les entrées en jokers, le retour sans joker.
  - key: code-copier
    format: code-output
    question: |-
      ```java
      static <T> void copier(List<? extends T> src, List<? super T> dst) { dst.addAll(src); }
      List<Object> dst = new ArrayList<>(List.of("début"));
      copier(List.of(1, 2), dst);
      System.out.println(dst);
      ```
    answer: '`[début, 1, 2]` : des `Integer` copiés dans une liste d''`Object`.'
    check:
      output: "[début, 1, 2]"
  - key: code-comparator-super
    format: code-output
    question: |-
      ```java
      List<Integer> l = new ArrayList<>(List.of(3, 1, 2));
      Comparator<Number> parValeur = Comparator.comparingDouble(Number::doubleValue);
      l.sort(parValeur);
      System.out.println(l);
      ```
    answer: '`[1, 2, 3]` : un comparateur de `Number` trie une liste d''`Integer`.'
    check:
      output: "[1, 2, 3]"
  - key: code-sans-jokers
    format: code-output
    question: |-
      ```java
      static <T> void copier(List<T> src, List<T> dst) { dst.addAll(src); }
      List<Object> dst = new ArrayList<>();
      List<Integer> src = List.of(1);
      copier(src, dst);
      ```
      Ce code compile-t-il ?
    answer: 'Non : `T` devrait être à la fois `Integer` et `Object`.'
    check:
      compiles: false
  - key: code-predicate
    format: code-output
    question: |-
      ```java
      static <T> List<T> filtrer(List<? extends T> l, Predicate<? super T> p) {
          List<T> r = new ArrayList<>();
          for (T e : l) if (p.test(e)) r.add(e);
          return r;
      }
      Predicate<Object> nonNul = Objects::nonNull;
      System.out.println(filtrer(Arrays.asList("a", null, "b"), nonNul));
      ```
    answer: '`[a, b]` : un prédicat sur `Object` filtre une liste de `String`.'
    check:
      output: "[a, b]"
  - key: bug-copie
    format: bug-fix
    question: |-
      On ne peut pas fusionner une liste de clients premium dans une liste de clients :
      ```java
      static <T> void fusionner(List<T> source, List<T> cible) { cible.addAll(source); }
      fusionner(premiums, clients);   // List<ClientPremium>, List<Client>
      ```
    answer: |-
      ```java
      static <T> void fusionner(List<? extends T> source, List<? super T> cible) { cible.addAll(source); }
      ```
      La source produit des éléments (`extends`), la cible les consomme (`super`) : `T` peut alors valoir
      `ClientPremium`.
  - key: bug-comparateur
    format: bug-fix
    question: |-
      Ce comparateur générique par date ne peut pas trier une liste de `Facture`, sous-classe de `Document` :
      ```java
      static <T extends Document> void trier(List<T> l, Comparator<T> c) { l.sort(c); }
      trier(factures, Comparator.comparing(Document::date));
      ```
    answer: |-
      ```java
      static <T extends Document> void trier(List<T> l, Comparator<? super T> c) { l.sort(c); }
      ```
      Le comparateur consomme des `T` : un `Comparator<Document>` doit pouvoir trier des `Facture`.
  - key: bug-consommateur-extends
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      static void ajouterDefauts(List<? extends Parametre> cible) {
          cible.add(Parametre.DEFAUT);
      }
      ```
    answer: |-
      ```java
      static void ajouterDefauts(List<? super Parametre> cible) {
          cible.add(Parametre.DEFAUT);
      }
      ```
      Un paramètre dans lequel on écrit est un consommateur : `? super`.
  - key: bug-callback
    format: bug-fix
    question: |-
      On ne peut pas passer un écouteur générique d'`Evenement` à cette méthode qui diffuse des `Clic` :
      ```java
      void abonner(Consumer<Clic> ecouteur) { ... }
      Consumer<Evenement> journal = e -> log.info("{}", e);
      abonner(journal);   // ne compile pas
      ```
    answer: |-
      ```java
      void abonner(Consumer<? super Clic> ecouteur) { ... }
      ```
      Un `Consumer` consomme : un consommateur d'`Evenement` (le parent) sait traiter des `Clic`.
  - key: definition-pecs
    format: definition
    question: PECS
    answer: Producer Extends, Consumer Super (wildcards)
  - key: definition-producteur
    format: definition
    question: Producteur (au sens de PECS)
    answer: Un paramètre dont la méthode lit des éléments ; il se déclare avec `? extends T`.
  - key: definition-consommateur
    format: definition
    question: Consommateur (au sens de PECS)
    answer: Un paramètre dans lequel la méthode écrit ou qui reçoit des éléments ; il se déclare avec `? super T`.
  - key: definition-joker
    format: definition
    question: Joker (wildcard)
    answer: Le symbole `?` dans un type générique, qui représente un type inconnu, éventuellement borné (`? extends T`, `? super T`).
