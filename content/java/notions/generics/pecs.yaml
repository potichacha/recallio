notion: pecs
lesson: |-
  **PECS** (*Producer Extends, Consumer Super*, *Effective Java*, item 31) dit quel joker choisir pour un paramètre :

  - si le paramètre **produit** des `T` (on y **lit**) : `? extends T` ;
  - s'il **consomme** des `T` (on y **écrit**, ou il les reçoit) : `? super T` ;
  - s'il fait les deux : le type exact `T`.

  ```java
  static <T> void copier(List<? extends T> source,        // produit des T : on les lit
                         List<? super T> destination) {    // consomme des T : on les y ajoute
      for (T element : source) {
          destination.add(element);
      }
  }

  List<Integer> entiers = List.of(1, 2);
  List<Number> nombres = new ArrayList<>();
  copier(entiers, nombres);     // T = Integer : source List<Integer>, destination List<Number>
  ```

  Exemples dans la JDK :
  - `Collections.copy(List<? super T> dest, List<? extends T> src)` ;
  - `List.sort(Comparator<? super E> c)` : un comparateur de `Number` peut trier une liste d'`Integer` ;
  - `Collection.addAll(Collection<? extends E> c)` ;
  - `Predicate<? super T>`, `Function<? super T, ? extends R>` dans l'API des streams : une fonction **consomme** son
    argument et **produit** son résultat.

  Bien appliqué, PECS rend une API utilisable avec tous les types compatibles, sans que l'appelant pense aux jokers.

  **Piège classique** : `copier(List<T> source, List<T> destination)`. Impossible alors de copier une `List<Integer>`
  dans une `List<Number>` : `T` devrait être à la fois `Integer` et `Number`.

  **En entretien** : « PECS : `extends` pour ce qu'on lit, `super` pour ce qu'on écrit ; c'est pourquoi `sort` prend un
  `Comparator<? super E>`. »
cards:
  - key: pecs
    format: course
    question: "Que dit la règle PECS sur les jokers ?"
    choices:
      - {text: "`extends` pour un paramètre qu'on lit, `super` pour un paramètre où l'on écrit", correct: true}
      - {text: "`super` pour un paramètre qu'on lit, `extends` pour un paramètre où l'on écrit", correct: false}
      - {text: "`extends` pour borner par une classe, `super` pour borner par une interface", correct: false}
      - {text: "`?` seul partout, et jamais `extends` ni `super` dans une API publique", correct: false}
    answer: |-
      Producer Extends, Consumer Super : `extends` pour un paramètre qui produit les éléments qu'on lit, `super` pour un
      paramètre qui consomme les éléments qu'on y écrit.
  - key: exemple-pecs-jdk
    format: course
    question: "Quelle méthode du JDK applique PECS ?"
    choices:
      - {text: "`Collections.copy(List<? super T> dest, List<? extends T> src)`", correct: true}
      - {text: "`Collections.copy(List<? extends T> dest, List<? super T> src)`", correct: false}
      - {text: "`Collections.copy(List<T> dest, List<T> src)`", correct: false}
      - {text: "`Collections.copy(List<?> dest, List<?> src)`", correct: false}
    answer: |-
      `Collections.copy(List<? super T> dest, List<? extends T> src)` : la destination consomme (`super`), la source
      produit (`extends`).
  - key: comparator-super
    format: course
    question: Pourquoi `List.sort` prend-il un `Comparator<? super E>` ?
    choices:
      - {text: "Le comparateur consomme des éléments : un comparateur de `Number` sait comparer des `Integer`", correct: true}
      - {text: "Le comparateur produit des éléments : il doit renvoyer un sous-type de `E`, comme `Integer`", correct: false}
      - {text: "Pour accepter un comparateur de `null`, dont le type n'est pas connu à l'exécution", correct: false}
      - {text: "Parce que `super` rend le tri stable, quand deux éléments comparés sont égaux", correct: false}
    answer: Le comparateur consomme des éléments ; un comparateur d'un type parent (par exemple de `Number`) sait comparer des `Integer`, il doit donc être accepté.
  - key: function
    format: course
    question: Pourquoi `map` déclare-t-il `Function<? super T, ? extends R>` ?
    choices:
      - {text: "La fonction consomme des `T` (`? super T`) et produit des `R` (`? extends R`)", correct: true}
      - {text: "La fonction produit des `T` (`? super T`) et consomme des `R` (`? extends R`)", correct: false}
      - {text: "Pour que `map` puisse modifier les éléments du flux en place, sans copie", correct: false}
      - {text: "Parce qu'une lambda exige des jokers dans tous les types qu'elle manipule", correct: false}
    answer: "La fonction consomme des `T` (argument : `? super T`) et produit des `R` (résultat : `? extends R`) : on peut lui passer une fonction plus générale en entrée et plus précise en sortie."
  - key: vf-producteur
    format: true-false
    question: Un paramètre qu'on ne fait que lire est un producteur, à déclarer avec `? extends T`.
    truth: true
    answer: Il produit des `T` pour la méthode.
  - key: vf-consommateur
    format: true-false
    question: Un paramètre dans lequel on ajoute des éléments se déclare avec `? extends T`.
    truth: false
    answer: "C'est un consommateur : `? super T`."
  - key: vf-les-deux
    format: true-false
    question: Un paramètre qu'on lit et qu'on écrit à la fois se déclare avec le type exact `T`.
    truth: true
    answer: Aucun joker ne permet les deux opérations.
  - key: vf-predicate
    format: true-false
    question: "Un `Predicate<Object>` peut être passé à `filter` sur un `Stream<String>`."
    truth: true
    answer: '`filter` prend un `Predicate<? super T>`.'
  - key: qcm-copier
    format: multiple-choice
    question: Quelle signature permet de copier une `List<Integer>` dans une `List<Number>` ?
    choices:
      - text: "`<T> void copier(List<? extends T> src, List<? super T> dst)`"
        correct: true
      - text: "`<T> void copier(List<T> src, List<T> dst)`"
        correct: false
      - text: "`<T> void copier(List<? super T> src, List<? extends T> dst)`"
        correct: false
      - text: "`void copier(List<Number> src, List<Number> dst)`"
        correct: false
    answer: La source produit (`extends`), la destination consomme (`super`).
  - key: qcm-sort
    format: multiple-choice
    question: "Lequel de ces comparateurs ne peut pas trier une `List<Integer>` avec `liste.sort(...)` ?"
    choices:
      - {text: "Un `Comparator<Double>`", correct: true}
      - {text: "Un `Comparator<Integer>`", correct: false}
      - {text: "Un `Comparator<Number>`", correct: false}
      - {text: "Un `Comparator<Object>`", correct: false}
    answer: |-
      `sort` accepte un `Comparator<? super Integer>` : `Integer`, `Number` ou `Object` conviennent. `Double` n'est pas
      un parent d'`Integer`.
  - key: qcm-role
    format: multiple-choice
    question: "Dans `addAll(Collection<? extends E> c)`, quel est le rôle de `c` ?"
    choices:
      - {text: "Un producteur : on lit ses éléments pour les ajouter", correct: true}
      - {text: "Un consommateur : on écrit dans `c` les éléments ajoutés", correct: false}
      - {text: "Les deux : on lit ses éléments, puis on les y réécrit", correct: false}
      - {text: "Aucun : `c` sert seulement à connaître la taille finale", correct: false}
    answer: Une liste de `Number` peut donc recevoir tous les éléments d'une liste d'`Integer`.
  - key: qcm-function
    format: multiple-choice
    question: "Quelle signature de méthode qui applique une transformation est la plus souple ?"
    choices:
      - text: "`<T, R> List<R> transformer(List<? extends T> l, Function<? super T, ? extends R> f)`"
        correct: true
      - text: "`<T, R> List<R> transformer(List<T> l, Function<T, R> f)`"
        correct: false
      - text: "`List<Object> transformer(List<Object> l, Function<Object, Object> f)`"
        correct: false
      - text: "`<T, R> List<? extends R> transformer(List<T> l, Function<T, R> f)`"
        correct: false
    answer: Les entrées en jokers, le retour sans joker.
  - key: code-copier
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static <T> void copier(List<? extends T> src, List<? super T> dst) { dst.addAll(src); }
      List<Object> dst = new ArrayList<>(List.of("début"));
      copier(List.of(1, 2), dst);
      System.out.println(dst);
      ```
    choices:
      - {text: "`[début, 1, 2]`", correct: true}
      - {text: "`[1, 2]`", correct: false}
      - {text: "`[1, 2, début]`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`[début, 1, 2]` : des `Integer` ajoutés à la fin d'une liste d'`Object`."
    check:
      output: "[début, 1, 2]"
  - key: code-comparator-super
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = new ArrayList<>(List.of(3, 1, 2));
      Comparator<Number> parValeur = Comparator.comparingDouble(Number::doubleValue);
      l.sort(parValeur);
      System.out.println(l);
      ```
    choices:
      - {text: "`[1, 2, 3]`", correct: true}
      - {text: "`[3, 2, 1]`", correct: false}
      - {text: "`[3, 1, 2]`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`[1, 2, 3]` : un comparateur de `Number` trie une liste d'`Integer`, puisque `sort` accepte un `Comparator<? super E>`."
    check:
      output: "[1, 2, 3]"
  - key: code-sans-jokers
    format: code-output
    question: |-
      ```java
      static <T> void copier(List<T> src, List<T> dst) { dst.addAll(src); }
      List<Object> dst = new ArrayList<>();
      List<Integer> src = List.of(1);
      copier(src, dst);
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui : `T` est inféré à `Object`", correct: false}
      - {text: "Oui, avec un avertissement unchecked", correct: false}
      - {text: "Oui, mais il lève une `ClassCastException`", correct: false}
    answer: "Ça ne compile pas : `T` devrait être à la fois `Integer` et `Object`, et les generics sont invariants."
    check:
      compiles: false
  - key: code-predicate
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static <T> List<T> filtrer(List<? extends T> l, Predicate<? super T> p) {
          List<T> r = new ArrayList<>();
          for (T e : l) if (p.test(e)) r.add(e);
          return r;
      }
      Predicate<Object> nonNul = Objects::nonNull;
      System.out.println(filtrer(Arrays.asList("a", null, "b"), nonNul));
      ```
    choices:
      - {text: "`[a, b]`", correct: true}
      - {text: "`[a, null, b]`", correct: false}
      - {text: "`[null]`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`[a, b]` : un prédicat sur `Object` filtre une liste de `String`, et ne garde que les non-nuls."
    check:
      output: "[a, b]"
  - key: bug-copie
    format: bug-fix
    question: |-
      On ne peut pas fusionner une liste de clients premium dans une liste de clients. Quelle correction est la bonne ?
      ```java
      static <T> void fusionner(List<T> source, List<T> cible) { cible.addAll(source); }
      fusionner(premiums, clients);   // List<ClientPremium>, List<Client>
      ```
    choices:
      - {text: "`fusionner(List<? extends T> source, List<? super T> cible)`", correct: true}
      - {text: "`fusionner(List<? super T> source, List<? extends T> cible)`", correct: false}
      - {text: "`fusionner(List<?> source, List<?> cible)`", correct: false}
      - {text: "`fusionner(List<T> source, List<Object> cible)`", correct: false}
    answer: |-
      ```java
      static <T> void fusionner(List<? extends T> source, List<? super T> cible) { cible.addAll(source); }
      ```
      La source produit des éléments (`extends`), la cible les consomme (`super`) : `T` peut alors valoir
      `ClientPremium`.
  - key: bug-comparateur
    format: bug-fix
    question: |-
      Ce comparateur générique par date ne peut pas trier une liste de `Facture`, sous-classe de `Document`. Quelle
      correction est la bonne ?
      ```java
      static <T extends Document> void trier(List<T> l, Comparator<T> c) { l.sort(c); }
      trier(factures, Comparator.comparing(Document::date));
      ```
    choices:
      - {text: "Accepter un `Comparator<? super T> c`", correct: true}
      - {text: "Accepter un `Comparator<? extends T> c`", correct: false}
      - {text: "Accepter un `Comparator<Object> c`", correct: false}
      - {text: "Accepter un `Comparator<Facture> c`", correct: false}
    answer: |-
      ```java
      static <T extends Document> void trier(List<T> l, Comparator<? super T> c) { l.sort(c); }
      ```
      Le comparateur consomme des `T` : un `Comparator<Document>` doit pouvoir trier des `Facture`. `? extends T`
      ferait l'inverse.
  - key: bug-consommateur-extends
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      static void ajouterDefauts(List<? extends Parametre> cible) {
          cible.add(Parametre.DEFAUT);
      }
      ```
    choices:
      - {text: "Déclarer `List<? super Parametre> cible`", correct: true}
      - {text: "Déclarer `List<? extends Object> cible`", correct: false}
      - {text: "Déclarer `List<?> cible`, sans borne", correct: false}
      - {text: "Caster à l'ajout : `cible.add((Parametre) DEFAUT)`", correct: false}
    answer: |-
      ```java
      static void ajouterDefauts(List<? super Parametre> cible) {
          cible.add(Parametre.DEFAUT);
      }
      ```
      Un paramètre dans lequel on écrit est un consommateur : `? super`.
  - key: bug-callback
    format: bug-fix
    question: |-
      On ne peut pas passer un écouteur générique d'`Evenement` à cette méthode qui diffuse des `Clic`. Quelle
      correction est la bonne ?
      ```java
      void abonner(Consumer<Clic> ecouteur) { ... }
      Consumer<Evenement> journal = e -> log.info("{}", e);
      abonner(journal);   // ne compile pas
      ```
    choices:
      - {text: "`void abonner(Consumer<? super Clic> ecouteur)`", correct: true}
      - {text: "`void abonner(Consumer<? extends Clic> ecouteur)`", correct: false}
      - {text: "`void abonner(Consumer<Object> ecouteur)`", correct: false}
      - {text: "`<T extends Clic> void abonner(Consumer<T> ecouteur)`", correct: false}
    answer: |-
      ```java
      void abonner(Consumer<? super Clic> ecouteur) { ... }
      ```
      Un `Consumer` consomme : un consommateur d'`Evenement` (le parent) sait traiter des `Clic`.
  - key: definition-pecs
    format: definition
    question: "Que désigne l'acronyme PECS ?"
    choices:
      - {text: "Producer Extends, Consumer Super : la règle de choix des jokers", correct: true}
      - {text: "Producer Super, Consumer Extends : la règle de choix des jokers", correct: false}
      - {text: "La règle d'invariance : une `List<Integer>` n'est pas une `List<Number>`", correct: false}
      - {text: "La règle de l'effacement : les paramètres de type disparaissent", correct: false}
    answer: "Producer Extends, Consumer Super, la règle qui choisit le joker d'un paramètre selon qu'on le lit ou qu'on y écrit."
  - key: definition-producteur
    format: definition
    question: "Qu'est-ce qu'un producteur, au sens de PECS ?"
    choices:
      - {text: "Un paramètre dont la méthode lit des éléments, déclaré avec `? extends T`", correct: true}
      - {text: "Un paramètre où la méthode écrit des éléments, déclaré avec `? super T`", correct: false}
      - {text: "Le type de retour d'une méthode générique, toujours déclaré avec `T`", correct: false}
      - {text: "Un paramètre sans joker, `List<T>`, qu'on lit et qu'on modifie à la fois", correct: false}
    answer: Un paramètre dont la méthode lit des éléments ; il se déclare avec `? extends T`.
  - key: definition-consommateur
    format: definition
    question: "Qu'est-ce qu'un consommateur, au sens de PECS ?"
    choices:
      - {text: "Un paramètre où la méthode écrit des éléments, déclaré avec `? super T`", correct: true}
      - {text: "Un paramètre dont la méthode lit des éléments, déclaré avec `? extends T`", correct: false}
      - {text: "Un paramètre sans joker, `List<T>`, qu'on lit et qu'on modifie à la fois", correct: false}
      - {text: "Une méthode qui vide la collection reçue, déclarée avec `List<?>`", correct: false}
    answer: Un paramètre dans lequel la méthode écrit ou qui reçoit des éléments ; il se déclare avec `? super T`.
  - key: definition-joker
    format: definition
    question: "Qu'est-ce qu'un joker (wildcard) dans un type générique ?"
    choices:
      - {text: "Le symbole `?`, un type inconnu, parfois borné (`? extends T`, `? super T`)", correct: true}
      - {text: "Un paramètre de type nommé, comme `T`, déclaré entre chevrons sur la classe", correct: false}
      - {text: "Le diamant `<>`, qui laisse le compilateur inférer les paramètres de type", correct: false}
      - {text: "Un type brut, comme `List`, employé sans aucun paramètre de type", correct: false}
    answer: Le symbole `?` dans un type générique, qui représente un type inconnu, éventuellement borné (`? extends T`, `? super T`).
