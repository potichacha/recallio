notion: type-tokens
lesson: |-
  À cause de l'effacement, un code générique ne connaît pas `T` à l'exécution. On le lui **transmet** avec un **jeton de
  type** :

  - un **`Class<T>`** (*type token*) suffit pour un type simple :

  ```java
  <T> T lire(String json, Class<T> type) { ... }
  Client c = lire(json, Client.class);          // T = Client, connu à l'exécution
  type.cast(objet);                              // un cast vraiment vérifié
  ```

  - mais `List<Client>.class` n'existe pas : un `Class` ne porte pas de paramètres. Pour un type paramétré, on utilise un
    **super type token** : une **sous-classe anonyme** d'une classe générique, dont la super-classe paramétrée est
    inscrite dans le bytecode et lisible par réflexion (`getGenericSuperclass()`).

  ```java
  // Jackson
  List<Client> clients = mapper.readValue(json, new TypeReference<List<Client>>() { });

  // le principe, en quelques lignes
  abstract class Jeton<T> {
      final Type type = ((ParameterizedType) getClass().getGenericSuperclass()).getActualTypeArguments()[0];
  }
  new Jeton<List<Client>>() { }.type;            // java.util.List<Client>
  ```

  Les mêmes idées existent ailleurs : `TypeToken` (Gson, Guava), `TypeLiteral` (CDI, Guice), `ParameterizedTypeReference`
  (Spring). Les **signatures** génériques (d'un champ, d'une méthode, d'une super-classe) survivent à l'effacement, pas le
  type d'un **objet**.

  **Piège classique** : `mapper.readValue(json, List.class)` pour lire une liste de clients. On obtient une liste de
  `LinkedHashMap`, et un `ClassCastException` à la première lecture d'un élément.

  **En entretien** : « Un `Class<T>` transmet un type simple ; pour `List<Client>`, un super type token, une sous-classe
  anonyme dont la super-classe paramétrée se lit par réflexion. »
cards:
  - key: jackson-connait-type-list-user-malgre
    format: course
    question: Comment Jackson connaît-il le type `List<User>` malgré l'effacement ?
    choices:
      - {text: "Par un type token : une sous-classe anonyme de `TypeReference` garde le type dans sa signature", correct: true}
      - {text: "En lisant le type des éléments dans le JSON, qui le précise pour chaque objet reçu", correct: false}
      - {text: "Par la réflexion sur la variable qui reçoit le résultat, au moment de l'exécution", correct: false}
      - {text: "Il ne le connaît pas : il crée toujours des `User`, déduits du nom de la classe", correct: false}
    answer: |-
      Par un type token : `new TypeReference<List<User>>() { }` crée une sous-classe anonyme qui inscrit `List<User>`
      dans sa super-classe, lisible par réflexion. Le JSON, lui, ne dit rien du type Java.
  - key: class-token
    format: course
    question: Qu'est-ce qu'un jeton de type `Class<T>` ?
    choices:
      - {text: "Un argument `Class<T>` qui fait connaître `T` à l'exécution, pour créer ou caster", correct: true}
      - {text: "Une instance de `T` passée en exemple, dont on lit la classe par `getClass()`", correct: false}
      - {text: "Un identifiant que la JVM attribue à chaque paramétrage d'une même classe", correct: false}
      - {text: "Une annotation qui conserve le paramètre de type dans le bytecode", correct: false}
    answer: Un argument `Class<T>` passé à une méthode générique pour lui faire connaître `T` à l'exécution (créer, caster avec `type.cast`, désérialiser).
  - key: limite-class
    format: course
    question: Pourquoi un `Class<T>` ne suffit-il pas pour `List<Client>` ?
    choices:
      - {text: "Un objet `Class` ne porte pas de paramètres de type : il n'existe que `List.class`", correct: true}
      - {text: "Parce que `List` est une interface, et qu'une interface n'a pas d'objet `Class`", correct: false}
      - {text: "Parce que `List<Client>.class` existe, mais qu'il faut l'obtenir par réflexion", correct: false}
      - {text: "Parce que `Client` doit d'abord être chargé par le même chargeur de classes", correct: false}
    answer: "Un objet `Class` ne porte pas de paramètres de type : il n'existe que `List.class`, et l'information « de `Client` » est perdue."
  - key: signatures
    format: course
    question: Quelle information générique survit à l'effacement ?
    choices:
      - {text: "Celle des déclarations (champs, paramètres, retours, super-classe), lisible par réflexion", correct: true}
      - {text: "Celle de chaque objet : une `new ArrayList<String>()` sait qu'elle contient des `String`", correct: false}
      - {text: "Aucune : le bytecode ne garde rien des paramètres de type, nulle part", correct: false}
      - {text: "Celle des variables locales, que la réflexion lit pendant l'exécution", correct: false}
    answer: Celle des déclarations (types des champs, des paramètres, des retours, de la super-classe), lisible par réflexion ; pas le type d'un objet créé (`new ArrayList<String>()` ne sait pas qu'il contient des `String`).
  - key: vf-class-parametre
    format: true-false
    question: "`List<Client>.class` donne le type complet de la liste."
    truth: false
    answer: Cette expression ne compile pas.
  - key: vf-anonyme
    format: true-false
    question: "`new TypeReference<List<Client>>() { }` crée une sous-classe anonyme."
    truth: true
    answer: "Ce sont les accolades : la super-classe paramétrée est inscrite dans la classe anonyme."
  - key: vf-cast
    format: true-false
    question: "`type.cast(objet)` vérifie réellement le type à l'exécution."
    truth: true
    answer: Il lève une `ClassCastException` si l'objet n'est pas une instance de `type`.
  - key: vf-objet
    format: true-false
    question: "Un objet `new ArrayList<String>()` sait, à l'exécution, qu'il contient des `String`."
    truth: false
    answer: Son paramètre est effacé ; seules les déclarations gardent l'information.
  - key: qcm-jackson
    format: multiple-choice
    question: Comment lire une `List<Client>` avec Jackson ?
    choices:
      - text: "`mapper.readValue(json, new TypeReference<List<Client>>() { })`"
        correct: true
      - text: "`mapper.readValue(json, List.class)`"
        correct: false
      - text: "`mapper.readValue(json, List<Client>.class)`"
        correct: false
      - text: "`(List<Client>) mapper.readValue(json, Object.class)`"
        correct: false
    answer: '`List.class` donnerait une liste de `LinkedHashMap`.'
  - key: qcm-equivalents
    format: multiple-choice
    question: Lesquels sont des super type tokens ?
    choices:
      - text: "`TypeToken` de Gson et Guava"
        correct: true
      - text: "`TypeLiteral` de CDI"
        correct: true
      - text: "`ParameterizedTypeReference` de Spring"
        correct: true
      - text: "`Class<T>`"
        correct: false
    answer: '`Class<T>` est un jeton simple, sans paramètres.'
  - key: qcm-reflexion
    format: multiple-choice
    question: Quelle méthode de réflexion lit la super-classe paramétrée d'une classe ?
    choices:
      - text: "`getGenericSuperclass()`"
        correct: true
      - text: "`getSuperclass()`"
        correct: false
      - text: "`getTypeParameters()`"
        correct: false
      - text: "`getClass()`"
        correct: false
    answer: '`getSuperclass()` renvoie la classe effacée ; `getGenericSuperclass()` un `ParameterizedType`.'
  - key: qcm-creer
    format: multiple-choice
    question: "Avec un jeton `Class<T> type`, comment une méthode générique crée-t-elle une instance de `T` ?"
    choices:
      - {text: "`type.getDeclaredConstructor().newInstance()`", correct: true}
      - {text: "`T.class.getDeclaredConstructor().newInstance()`", correct: false}
      - {text: "`new T()`", correct: false}
      - {text: "`(T) new Object()`", correct: false}
    answer: |-
      Le jeton donne la classe à l'exécution ; `T` étant effacé, `new T()` et `T.class` ne compilent pas. Un
      `Supplier<T>` fait la même chose plus simplement, sans réflexion.
  - key: code-class-token
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static <T> T convertir(Object o, Class<T> type) { return type.cast(o); }
      String s = convertir("ada", String.class);
      System.out.println(s.length());
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`ada`", correct: false}
      - {text: "Une `ClassCastException`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3` : le jeton permet un cast vérifié vers `String`, et `\"ada\"` en est une."
    check:
      output: "3"
  - key: code-cast-echoue
    format: code-output
    question: |-
      Que se passe-t-il à l'exécution de ce code ?
      ```java
      static <T> T convertir(Object o, Class<T> type) { return type.cast(o); }
      String s = convertir(42, String.class);
      ```
    choices:
      - {text: "Une `ClassCastException`, dans `convertir`", correct: true}
      - {text: "Une `ClassCastException`, plus tard, à l'usage de `s`", correct: false}
      - {text: "Rien : `s` vaut `\"42\"`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      Une `ClassCastException`, dans `convertir` : `type.cast` vérifie vraiment le type. Un cast `(T)` effacé, lui,
      aurait laissé l'erreur surgir plus loin.
    check:
      throws: ClassCastException
  - key: code-super-type-token
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      abstract class Jeton<T> {
          final java.lang.reflect.Type type = ((java.lang.reflect.ParameterizedType) getClass()
                  .getGenericSuperclass()).getActualTypeArguments()[0];
      }
      System.out.println(new Jeton<List<String>>() { }.type.getTypeName());
      ```
    choices:
      - {text: "`java.util.List<java.lang.String>`", correct: true}
      - {text: "`java.util.List`", correct: false}
      - {text: "`java.lang.Object`", correct: false}
      - {text: "`T`", correct: false}
    answer: "`java.util.List<java.lang.String>` : la sous-classe anonyme garde le type complet dans sa super-classe."
    check:
      output: "java.util.List<java.lang.String>"
  - key: code-objet-efface
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(new ArrayList<String>().getClass().getTypeParameters()[0].getName());
      ```
    choices:
      - {text: "`E`", correct: true}
      - {text: "`String`", correct: false}
      - {text: "`java.lang.String`", correct: false}
      - {text: "`T`", correct: false}
    answer: "`E` : la classe ne connaît que son paramètre déclaré, pas le `String` de cette instance."
    check:
      output: "E"
  - key: bug-list-class
    format: bug-fix
    question: |-
      Une `ClassCastException: LinkedHashMap cannot be cast to Client` surgit dans la boucle. Quelle correction est la
      bonne ?
      ```java
      List<Client> clients = mapper.readValue(json, List.class);
      for (Client c : clients) { ... }
      ```
    choices:
      - {text: "Passer `new TypeReference<List<Client>>() { }` à la place de `List.class`", correct: true}
      - {text: "Passer `List<Client>.class` à la place de `List.class`", correct: false}
      - {text: "Caster le résultat de `readValue` en `(List<Client>)`", correct: false}
      - {text: "Passer `Client.class` à la place de `List.class`", correct: false}
    answer: |-
      ```java
      List<Client> clients = mapper.readValue(json, new TypeReference<List<Client>>() { });
      ```
      Avec `List.class`, Jackson ne sait pas quel type d'éléments créer et produit des `LinkedHashMap`. Le
      `TypeReference` lui transmet le type complet.
  - key: bug-cast-non-verifie
    format: bug-fix
    question: |-
      Une valeur de configuration du mauvais type n'est détectée que bien plus loin. Quelle correction est la bonne ?
      ```java
      @SuppressWarnings("unchecked")
      <T> T valeur(String cle) { return (T) config.get(cle); }
      ```
    choices:
      - {text: "Recevoir un `Class<T> type`, et renvoyer `type.cast(config.get(cle))`", correct: true}
      - {text: "Retirer `@SuppressWarnings` : le cast `(T)` sera alors vérifié", correct: false}
      - {text: "Caster d'abord vers `(Object)`, puis vers `(T)`, plus prudent", correct: false}
      - {text: "Lire la valeur avec `config.getOrDefault(cle, null)`", correct: false}
    answer: |-
      ```java
      <T> T valeur(String cle, Class<T> type) {
          return type.cast(config.get(cle));
      }
      ```
      Le cast vers `T` est effacé et ne vérifie rien. Avec un jeton `Class<T>`, `type.cast` vérifie au moment de la lecture.
  - key: bug-t-class
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      class Depot<T> {
          T charger(long id) { return mapper.readValue(lire(id), T.class); }
      }
      ```
    choices:
      - {text: "Recevoir un `Class<T>` dans le constructeur : `new Depot<>(Client.class)`", correct: true}
      - {text: "Remplacer `T.class` par `getClass()`, qui donne la classe de `T`", correct: false}
      - {text: "Remplacer `T.class` par `Object.class`, et caster le résultat en `(T)`", correct: false}
      - {text: "Borner `T` par `class Depot<T extends Object>`, pour permettre `T.class`", correct: false}
    answer: |-
      ```java
      class Depot<T> {
          private final Class<T> type;
          Depot(Class<T> type) { this.type = type; }
          T charger(long id) { return mapper.readValue(lire(id), type); }
      }
      // new Depot<>(Client.class)
      ```
      `T.class` n'existe pas : le type est effacé. On le reçoit en jeton dans le constructeur.
  - key: bug-accolades-oubliees
    format: bug-fix
    question: |-
      Ce code ne compile pas (`TypeReference is abstract; cannot be instantiated`). Quelle correction est la bonne ?
      ```java
      List<Client> clients = mapper.readValue(json, new TypeReference<List<Client>>());
      ```
    choices:
      - {text: "Ajouter les accolades : `new TypeReference<List<Client>>() { }`", correct: true}
      - {text: "Utiliser le diamant : `new TypeReference<>()`", correct: false}
      - {text: "Retirer le paramètre : `new TypeReference()`, brut", correct: false}
      - {text: "Passer `TypeReference.class` à la place d'une instance", correct: false}
    answer: |-
      ```java
      List<Client> clients = mapper.readValue(json, new TypeReference<List<Client>>() { });
      ```
      Les accolades créent la sous-classe anonyme qui inscrit `List<Client>` dans sa super-classe : sans elles, il n'y a
      pas de jeton (et la classe est abstraite exprès).
