notion: wildcards
cards:
  - key: ajouter-element-list
    format: course
    question: Peut-on ajouter un élément dans une `List<?>` ?
    answer: Seulement null.
  - key: list-vs-list-object
    format: course
    question: '`List<?>` vs `List<Object>` ?'
    answer: List<?> accepte une liste de n'importe quel type mais en lecture seule ; List<Object> n'accepte que des listes d'Object mais autorise l'écriture.
