notion: wildcards
lesson: |-
  Un **joker** (*wildcard*) `?` représente un type inconnu. Il rend une méthode plus souple sur les types qu'elle
  accepte :

  | Écriture | Accepte | Lire | Ajouter |
  |---|---|---|---|
  | `List<?>` | une liste de n'importe quoi | des `Object` | rien (sauf `null`) |
  | `List<? extends Number>` | `List<Number>`, `List<Integer>`, `List<Double>`... | des `Number` | rien (sauf `null`) |
  | `List<? super Integer>` | `List<Integer>`, `List<Number>`, `List<Object>` | des `Object` | des `Integer` |

  ```java
  static double somme(List<? extends Number> nombres) {     // accepte List<Integer>, List<Double>...
      double total = 0;
      for (Number n : nombres) total += n.doubleValue();
      return total;
  }

  static void remplir(List<? super Integer> cible) {        // accepte List<Integer>, List<Number>, List<Object>
      for (int i = 0; i < 3; i++) cible.add(i);
  }
  ```

  - Avec `? extends T`, le compilateur sait que chaque élément **est un** `T`, mais pas quel sous-type précis : il refuse
    donc tout ajout (on pourrait ajouter un `Double` dans une `List<Integer>`).
  - Avec `? super T`, il sait qu'on peut y **ranger** un `T`, mais on ne lit que des `Object`.
  - Les jokers vont dans les **paramètres** des méthodes ; dans un type de retour, ils obligeraient chaque appelant à
    les manipuler.

  **Piège classique** : déclarer un paramètre `List<Number>` et découvrir qu'on ne peut pas lui passer une
  `List<Integer>`. Les generics sont invariants ; `List<? extends Number>` accepte les deux.

  **En entretien** : « `? extends` pour lire, `? super` pour écrire, `?` quand le type n'importe pas ; et des jokers dans
  les paramètres, pas dans les types de retour. »
cards:
  - key: ajouter-element-list
    format: course
    question: Peut-on ajouter un élément dans une `List<?>` ?
    choices:
      - {text: "Non, seulement `null` : le type réel des éléments est inconnu", correct: true}
      - {text: "Oui, n'importe quel objet : `?` veut dire « tout type »", correct: false}
      - {text: "Oui, mais seulement du type du premier élément de la liste", correct: false}
      - {text: "Non, pas même `null` : la liste est en lecture seule", correct: false}
    answer: Non, seulement null ; le type réel des éléments est inconnu.
  - key: list-vs-list-object
    format: course
    question: "Quelle différence entre `List<?>` et `List<Object>` ?"
    choices:
      - {text: "`List<?>` accepte une liste de tout type, sans ajout ; `List<Object>` n'accepte qu'une `List<Object>`, modifiable", correct: true}
      - {text: "Aucune : dans un type générique, `?` n'est qu'un raccourci pour écrire `Object`", correct: false}
      - {text: "`List<Object>` accepte une liste de tout type ; `List<?>` n'accepte qu'une `List<Object>`", correct: false}
      - {text: "`List<?>` est un type brut, non vérifié ; `List<Object>` est un type paramétré vérifié", correct: false}
    answer: |-
      `List<?>` accepte une liste de n'importe quel type, en lecture ; `List<Object>` n'accepte qu'une `List<Object>`,
      mais permet l'écriture.
  - key: extends-lecture
    format: course
    question: Pourquoi ne peut-on rien ajouter dans une `List<? extends Number>` ?
    choices:
      - {text: "Elle peut être une `List<Integer>` comme une `List<Double>` : aucun ajout n'est sûr", correct: true}
      - {text: "Parce que `Number` est abstraite, et qu'on ne peut pas en créer d'instance", correct: false}
      - {text: "Parce que `extends` rend la liste immuable, comme le fait `List.copyOf`", correct: false}
      - {text: "Parce que l'autoboxing ne fonctionne pas à travers un joker", correct: false}
    answer: Elle peut être une `List<Integer>` comme une `List<Double>` ; le compilateur ne sait pas quel type serait accepté, et refuse donc tout ajout (sauf `null`).
  - key: retour
    format: course
    question: Pourquoi éviter les jokers dans un type de retour ?
    choices:
      - {text: "Chaque appelant recevrait un type flou, à manipuler lui-même avec des jokers", correct: true}
      - {text: "Parce qu'un joker en type de retour ne compile pas", correct: false}
      - {text: "Parce que l'effacement remplace le joker par `null` à l'exécution", correct: false}
      - {text: "Parce qu'un joker en retour rend chaque appel de la méthode plus lent", correct: false}
    answer: Chaque appelant recevrait un type flou, qu'il devrait manipuler avec des jokers à son tour ; les jokers servent à assouplir les paramètres.
  - key: vf-extends-lire
    format: true-false
    question: "On peut lire des `Number` dans une `List<? extends Number>`."
    truth: true
    answer: Chaque élément est au moins un `Number`.
  - key: vf-super-ajouter
    format: true-false
    question: "On peut ajouter un `Integer` dans une `List<? super Integer>`."
    truth: true
    answer: La liste accepte des `Integer` (c'est une `List<Integer>`, `List<Number>` ou `List<Object>`).
  - key: vf-super-lire
    format: true-false
    question: "On lit des `Integer` dans une `List<? super Integer>`."
    truth: false
    answer: "On ne lit que des `Object` : la liste peut contenir d'autres nombres, ou des objets quelconques."
  - key: vf-extends-ajouter
    format: true-false
    question: "On peut ajouter un `Integer` dans une `List<? extends Number>`."
    truth: false
    answer: La liste pourrait être une `List<Double>`.
  - key: qcm-accepte
    format: multiple-choice
    question: "Quelles listes peut-on passer à `void f(List<? extends Number> l)` ?"
    choices:
      - text: "`List<Integer>`"
        correct: true
      - text: "`List<Number>`"
        correct: true
      - text: "`List<Object>`"
        correct: false
      - text: "`List<String>`"
        correct: false
    answer: '`? extends Number` accepte `Number` et ses sous-types.'
  - key: qcm-super
    format: multiple-choice
    question: "Quelles listes peut-on passer à `void g(List<? super Integer> l)` ?"
    choices:
      - text: "`List<Integer>`"
        correct: true
      - text: "`List<Number>`"
        correct: true
      - text: "`List<Object>`"
        correct: true
      - text: "`List<Double>`"
        correct: false
    answer: '`? super Integer` accepte `Integer` et ses parents.'
  - key: qcm-inconnu
    format: multiple-choice
    question: "Quelle signature affiche la taille de n'importe quelle liste ?"
    choices:
      - text: "`static int taille(List<?> l)`"
        correct: true
      - text: "`static int taille(List<Object> l)`"
        correct: false
      - text: "`static int taille(List<Number> l)`"
        correct: false
      - text: "`static int taille(List<String> l)`"
        correct: false
    answer: '`List<Object>` n''accepte qu''une `List<Object>`.'
  - key: qcm-operations
    format: multiple-choice
    question: "Laquelle de ces opérations est permise sur une `List<?>` ?"
    choices:
      - {text: "Lire ses éléments en tant qu'`Object`", correct: true}
      - {text: "Lire ses éléments en tant que `String`", correct: false}
      - {text: "Y ajouter une `String`", correct: false}
      - {text: "Y ajouter un `Object`", correct: false}
    answer: |-
      On lit des `Object`, et l'on peut appeler `size()`, `clear()` ou `remove(i)`. L'ajout (sauf `null`) et la lecture
      typée sont impossibles : le type réel des éléments est inconnu.
  - key: code-taille
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static int taille(List<?> l) { return l.size(); }
      System.out.println(taille(List.of("a")) + taille(List.of(1, 2)));
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`12`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3` : `List<?>` accepte une liste de n'importe quel type, et les deux tailles s'additionnent (1 + 2)."
    check:
      output: "3"
  - key: code-ajout-inconnu
    format: code-output
    question: |-
      ```java
      List<?> l = new ArrayList<String>();
      l.add("x");
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui : la liste est une `ArrayList<String>`", correct: false}
      - {text: "Oui, avec un avertissement unchecked", correct: false}
      - {text: "Oui, mais il lève une `UnsupportedOperationException`", correct: false}
    answer: "Ça ne compile pas : on ne peut rien ajouter (sauf `null`) dans une `List<?>`, quel que soit l'objet réel."
    check:
      compiles: false
  - key: code-extends
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static double somme(List<? extends Number> l) {
          double s = 0;
          for (Number n : l) s += n.doubleValue();
          return s;
      }
      System.out.println(somme(List.of(1, 2)) + somme(List.of(0.5)));
      ```
    choices:
      - {text: "`3.5`", correct: true}
      - {text: "`3.00.5`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3.5` : la même méthode accepte une `List<Integer>` et une `List<Double>`, et deux `double` s'additionnent."
    check:
      output: "3.5"
  - key: code-super
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<? super Integer> l = new ArrayList<Number>();
      l.add(5);
      Object o = l.get(0);
      System.out.println(o);
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`5.0`", correct: false}
      - {text: "`null`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`5` : on ajoute un `Integer`, on relit un `Object`, qui reste l'`Integer` 5."
    check:
      output: "5"
  - key: bug-invariance
    format: bug-fix
    question: |-
      Ce code ne compile pas (`List<Integer> cannot be converted to List<Number>`). Quelle correction est la bonne ?
      ```java
      static double moyenne(List<Number> nombres) { ... }
      moyenne(List.of(12, 15, 9));
      ```
    choices:
      - {text: "`static double moyenne(List<? extends Number> nombres)`", correct: true}
      - {text: "`static double moyenne(List<? super Number> nombres)`", correct: false}
      - {text: "`static double moyenne(List<Object> nombres)`", correct: false}
      - {text: "Appeler `moyenne((List<Number>) List.of(12, 15, 9))`", correct: false}
    answer: |-
      ```java
      static double moyenne(List<? extends Number> nombres) { ... }
      ```
      Une `List<Integer>` n'est pas une `List<Number>`. Le joker `? extends Number` accepte les listes de tous les
      sous-types de `Number`.
  - key: bug-ajout-extends
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      static void ajouterZero(List<? extends Number> nombres) {
          nombres.add(0);
      }
      ```
    choices:
      - {text: "`static void ajouterZero(List<? super Integer> nombres)`", correct: true}
      - {text: "`static void ajouterZero(List<? extends Integer> nombres)`", correct: false}
      - {text: "`static void ajouterZero(List<?> nombres)`", correct: false}
      - {text: "Garder `? extends Number`, et ajouter `(Number) 0`", correct: false}
    answer: |-
      ```java
      static void ajouterZero(List<? super Integer> nombres) {
          nombres.add(0);
      }
      ```
      Pour écrire, il faut `? super` : la liste peut alors recevoir un `Integer`. `? extends` sert à lire.
  - key: bug-object
    format: bug-fix
    question: |-
      On ne peut pas passer une `List<String>` à cette méthode d'affichage. Quelle correction est la bonne ?
      ```java
      static void afficher(List<Object> elements) {
          elements.forEach(System.out::println);
      }
      ```
    choices:
      - {text: "`static void afficher(List<?> elements)`", correct: true}
      - {text: "`static void afficher(List<? super Object> elements)`", correct: false}
      - {text: "`static <T> void afficher(List<Object> elements)`", correct: false}
      - {text: "Caster à l'appel : `afficher((List<Object>) noms)`", correct: false}
    answer: |-
      ```java
      static void afficher(List<?> elements) {
          elements.forEach(System.out::println);
      }
      ```
      `List<Object>` n'accepte qu'une `List<Object>`. La méthode ne fait que lire des `Object` : `List<?>` accepte toutes
      les listes.
  - key: bug-retour-joker
    format: bug-fix
    question: |-
      Chaque appelant doit gérer un joker, et ne peut rien ajouter au résultat. Quelle correction est la bonne ?
      ```java
      List<? extends Produit> produitsEnStock() { ... }
      ```
    choices:
      - {text: "Renvoyer un type précis : `List<Produit> produitsEnStock()`", correct: true}
      - {text: "Renvoyer `List<? super Produit>`, pour autoriser les ajouts", correct: false}
      - {text: "Renvoyer `List<?>`, le joker le plus général", correct: false}
      - {text: "Renvoyer une `List` brute, que chaque appelant caste", correct: false}
    answer: |-
      ```java
      List<Produit> produitsEnStock() { ... }
      ```
      Un joker en type de retour rend le résultat difficile à utiliser. Les jokers assouplissent les paramètres ; le
      retour garde un type précis.
