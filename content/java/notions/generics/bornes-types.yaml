notion: bornes-types
lesson: |-
  Un paramètre de type peut être **borné** : `<T extends Number>` n'accepte que `Number` et ses sous-types. En
  contrepartie, le code générique peut appeler les méthodes de la borne.

  ```java
  static <T extends Number> double somme(List<T> nombres) {
      double total = 0;
      for (T n : nombres) {
          total += n.doubleValue();       // permis : T est au moins un Number
      }
      return total;
  }

  static <T extends Comparable<T>> T max(T a, T b) {
      return a.compareTo(b) >= 0 ? a : b;
  }

  somme(List.of(1, 2.5, 3L));         // 6.5
  somme(List.of("a"));                // ne compile pas : String n'est pas un Number
  ```

  - `extends` s'utilise pour les classes **et** les interfaces (`T extends Comparable<T>`).
  - **Bornes multiples** : `<T extends Number & Comparable<T>>`. Une seule classe au plus, placée **en premier**, puis
    des interfaces.
  - On borne aussi une classe : `class Statistiques<T extends Number>`.
  - Sans borne, un `T` n'offre que les méthodes d'`Object`.
  - `super` n'existe pas pour déclarer un paramètre de type (`<T super Number>` ne compile pas) ; il n'existe que pour
    les jokers (`? super T`).

  **Piège classique** : appeler `x.compareTo(y)` sur un `T` non borné. Le compilateur ne sait pas que `T` est comparable :
  il faut `<T extends Comparable<T>>`.

  **En entretien** : « Une borne restreint les types acceptés et donne accès aux méthodes de la borne ; avec plusieurs
  bornes, la classe d'abord, puis les interfaces. »
cards:
  - key: bounded-type
    format: course
    question: C'est quoi un bounded type ?
    answer: Un paramètre contraint (`<T extends Number>`) qui garantit l'accès aux méthodes du type borne.
  - key: bornes-multiples
    format: course
    question: Comment écrire plusieurs bornes ?
    answer: 'Avec `&` : `<T extends Number & Comparable<T>>` ; au plus une classe, placée en premier, puis des interfaces.'
  - key: sans-borne
    format: course
    question: Quelles méthodes peut-on appeler sur un `T` sans borne ?
    answer: Seulement celles d'`Object` (`equals`, `hashCode`, `toString`...).
  - key: interface
    format: course
    question: Pourquoi écrit-on `extends` même pour une interface, comme dans `<T extends Comparable<T>>` ?
    answer: Dans une borne, `extends` signifie « est un sous-type de », qu'il s'agisse d'une classe ou d'une interface ; `implements` n'y est pas permis.
  - key: vf-methodes-borne
    format: true-false
    question: "Dans `<T extends Number>`, on peut appeler `t.doubleValue()`."
    truth: true
    answer: La borne garantit que `T` est un `Number`.
  - key: vf-super
    format: true-false
    question: "`<T super Number>` est une déclaration valide."
    truth: false
    answer: '`super` n''existe que pour les jokers (`? super Number`).'
  - key: vf-ordre
    format: true-false
    question: "`<T extends Comparable<T> & Number>` compile."
    truth: false
    answer: La classe (`Number`) doit venir en premier.
  - key: vf-classe
    format: true-false
    question: Une classe générique peut borner son paramètre de type.
    truth: true
    answer: "`class Statistiques<T extends Number>` est valide."
  - key: qcm-accepte
    format: multiple-choice
    question: "Quels appels de `static <T extends Number> double somme(List<T> l)` compilent ?"
    choices:
      - text: "`somme(List.of(1, 2, 3))`"
        correct: true
      - text: "`somme(List.of(1.5, 2.5))`"
        correct: true
      - text: "`somme(List.of(\"1\", \"2\"))`"
        correct: false
      - text: "`somme(List.of(true))`"
        correct: false
    answer: Seuls les sous-types de `Number` sont acceptés.
  - key: qcm-max
    format: multiple-choice
    question: Quelle signature permet d'écrire `a.compareTo(b)` dans la méthode ?
    choices:
      - text: "`static <T extends Comparable<T>> T max(T a, T b)`"
        correct: true
      - text: "`static <T> T max(T a, T b)`"
        correct: false
      - text: "`static <T implements Comparable<T>> T max(T a, T b)`"
        correct: false
      - text: "`static <Comparable T> T max(T a, T b)`"
        correct: false
    answer: La borne garantit l'existence de `compareTo`.
  - key: qcm-multiples
    format: multiple-choice
    question: Quelles déclarations de bornes multiples sont valides ?
    choices:
      - text: "`<T extends Number & Comparable<T>>`"
        correct: true
      - text: "`<T extends Serializable & Comparable<T>>`"
        correct: true
      - text: "`<T extends Integer & Long>`"
        correct: false
      - text: "`<T extends Comparable<T> & Number>`"
        correct: false
    answer: Une seule classe au plus, en premier ; plusieurs interfaces sont possibles.
  - key: qcm-but
    format: multiple-choice
    question: À quoi sert une borne ?
    choices:
      - text: "À restreindre les types acceptés et à pouvoir appeler les méthodes de la borne"
        correct: true
      - text: "À accélérer l'exécution"
        correct: false
      - text: "À autoriser les primitifs"
        correct: false
      - text: "À éviter l'effacement de types"
        correct: false
    answer: À l'exécution, `T` est d'ailleurs effacé vers sa borne.
  - key: trous-extends
    format: fill-in
    question: |-
      Complétez pour n'accepter que des nombres :
      ```java
      static <T ___ Number> double moyenne(List<T> nombres) { ... }
      ```
    blanks: [[extends]]
    answer: '`extends` déclare la borne.'
  - key: trous-et
    format: fill-in
    question: |-
      Complétez pour exiger un nombre comparable :
      ```java
      static <T extends Number ___ Comparable<T>> T borne(T a, T b) { ... }
      ```
    blanks: [["&"]]
    answer: Les bornes multiples se séparent par `&`.
  - key: trous-double-value
    format: fill-in
    question: |-
      Complétez avec la méthode de `Number` qui donne la valeur décimale :
      ```java
      for (T n : nombres) total += n.___();
      ```
    blanks: [[doubleValue]]
    answer: La borne `Number` donne accès à `doubleValue()`.
  - key: trous-comparable
    format: fill-in
    question: |-
      Complétez pour que `a.compareTo(b)` compile :
      ```java
      static <T extends ___<T>> T max(T a, T b) { return a.compareTo(b) >= 0 ? a : b; }
      ```
    blanks: [[Comparable]]
    answer: La borne garantit la méthode `compareTo`.
  - key: code-somme
    format: code-output
    question: |-
      ```java
      static <T extends Number> double somme(List<T> l) {
          double s = 0;
          for (T x : l) s += x.doubleValue();
          return s;
      }
      System.out.println(somme(List.of(1, 2.5, 3L)));
      ```
    answer: '`6.5` : des `Integer`, `Double` et `Long`, tous des `Number`.'
    check:
      output: "6.5"
  - key: code-hors-borne
    format: code-output
    question: |-
      ```java
      static <T extends Number> double somme(List<T> l) { return 0; }
      somme(List.of("a"));
      ```
      Ce code compile-t-il ?
    answer: 'Non : `String` ne respecte pas la borne `Number`.'
    check:
      compiles: false
  - key: code-max
    format: code-output
    question: |-
      ```java
      static <T extends Comparable<T>> T max(T a, T b) {
          return a.compareTo(b) >= 0 ? a : b;
      }
      System.out.println(max("pomme", "poire") + " " + max(3, 7));
      ```
    answer: '`pomme 7` : « pomme » vient après « poire » dans l''ordre alphabétique.'
    check:
      output: "pomme 7"
  - key: code-ordre-bornes
    format: code-output
    question: |-
      ```java
      static <T extends Comparable<T> & Number> void f(T t) { }
      ```
      Ce code compile-t-il ?
    answer: 'Non : la classe `Number` doit être la première borne.'
    check:
      compiles: false
  - key: bug-sans-borne
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: method compareTo(T)`) :
      ```java
      static <T> T plusPetit(T a, T b) {
          return a.compareTo(b) <= 0 ? a : b;
      }
      ```
    answer: |-
      ```java
      static <T extends Comparable<T>> T plusPetit(T a, T b) {
          return a.compareTo(b) <= 0 ? a : b;
      }
      ```
      Sans borne, `T` n'a que les méthodes d'`Object`. La borne `Comparable<T>` garantit `compareTo`.
  - key: bug-super
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      static <T super Integer> void ajouter(List<T> liste) {
          liste.add(1);
      }
      ```
    answer: |-
      ```java
      static void ajouter(List<? super Integer> liste) {
          liste.add(1);
      }
      ```
      `super` n'est pas permis dans la déclaration d'un paramètre de type ; un joker `? super Integer` exprime « une liste
      dans laquelle on peut ajouter des `Integer` ».
  - key: bug-ordre
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```java
      class Mesure<T extends Comparable<T> & Number> { ... }
      ```
    answer: |-
      ```java
      class Mesure<T extends Number & Comparable<T>> { ... }
      ```
      Parmi plusieurs bornes, la classe vient en premier, puis les interfaces.
  - key: bug-borne-final
    format: bug-fix
    question: |-
      Le compilateur avertit que ce paramètre de type ne sert à rien :
      ```java
      static <T extends Integer> T doubler(T x) { ... }
      ```
    answer: |-
      ```java
      static int doubler(int x) { return x * 2; }
      ```
      `Integer` est `final` : `T` ne peut valoir qu'`Integer`. Le paramètre de type n'apporte rien ; le type concret
      (ici le primitif) est plus simple.
