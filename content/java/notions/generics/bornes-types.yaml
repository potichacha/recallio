notion: bornes-types
lesson: |-
  Un paramètre de type peut être **borné** : `<T extends Number>` n'accepte que `Number` et ses sous-types. En
  contrepartie, le code générique peut appeler les méthodes de la borne.

  ```java
  static <T extends Number> double somme(List<T> nombres) {
      double total = 0;
      for (T n : nombres) {
          total += n.doubleValue();       // permis : T est au moins un Number
      }
      return total;
  }

  static <T extends Comparable<T>> T max(T a, T b) {
      return a.compareTo(b) >= 0 ? a : b;
  }

  somme(List.of(1, 2.5, 3L));         // 6.5
  somme(List.of("a"));                // ne compile pas : String n'est pas un Number
  ```

  - `extends` s'utilise pour les classes **et** les interfaces (`T extends Comparable<T>`).
  - **Bornes multiples** : `<T extends Number & Comparable<T>>`. Une seule classe au plus, placée **en premier**, puis
    des interfaces.
  - On borne aussi une classe : `class Statistiques<T extends Number>`.
  - Sans borne, un `T` n'offre que les méthodes d'`Object`.
  - `super` n'existe pas pour déclarer un paramètre de type (`<T super Number>` ne compile pas) ; il n'existe que pour
    les jokers (`? super T`).

  **Piège classique** : appeler `x.compareTo(y)` sur un `T` non borné. Le compilateur ne sait pas que `T` est comparable :
  il faut `<T extends Comparable<T>>`.

  **En entretien** : « Une borne restreint les types acceptés et donne accès aux méthodes de la borne ; avec plusieurs
  bornes, la classe d'abord, puis les interfaces. »
cards:
  - key: bounded-type
    format: course
    question: "Qu'est-ce qu'un type borné (bounded type) dans les génériques ?"
    choices:
      - {text: "Un paramètre de type contraint (`<T extends Number>`), qui donne accès aux méthodes de la borne", correct: true}
      - {text: "Un joker sans contrainte (`<?>`), qui accepte n'importe quel type mais interdit d'écrire", correct: false}
      - {text: "Un paramètre de type limité aux classes `final`, que personne ne peut étendre ni redéfinir", correct: false}
      - {text: "Un type générique dont le compilateur borne la taille, comme une collection de taille fixe", correct: false}
    answer: |-
      Un paramètre contraint, comme `<T extends Number>` : le compilateur n'accepte que des sous-types de `Number`, et
      sur un `T` on peut appeler leurs méthodes (`doubleValue()`). Le joker `<?>`, lui, n'impose rien.
  - key: bornes-multiples
    format: course
    question: "Comment écrit-on plusieurs bornes sur un même paramètre de type ?"
    choices:
      - {text: "Avec `&` : `<T extends Number & Comparable<T>>`, la classe en premier", correct: true}
      - {text: "Avec une virgule : `<T extends Number, Comparable<T>>`, dans n'importe quel ordre", correct: false}
      - {text: "Avec `|` : `<T extends Number | Comparable<T>>`, comme dans un multi-catch", correct: false}
      - {text: "Avec `implements` : `<T extends Number implements Comparable<T>>`", correct: false}
    answer: |-
      Avec `&` : `<T extends Number & Comparable<T>>`. Au plus une classe, placée en premier, puis des interfaces. Une
      virgule déclarerait un second paramètre de type.
  - key: sans-borne
    format: course
    question: "Quelles méthodes peut-on appeler sur une valeur de type `T` sans borne ?"
    choices:
      - {text: "Seulement celles d'`Object` : `equals`, `hashCode`, `toString`...", correct: true}
      - {text: "Toutes celles du type réel, résolues à l'exécution par la JVM", correct: false}
      - {text: "Aucune : il faut d'abord caster la valeur vers un type connu", correct: false}
      - {text: "Celles de `Comparable`, que tout type générique implémente", correct: false}
    answer: |-
      Seulement celles d'`Object` (`equals`, `hashCode`, `toString`...) : le compilateur ne sait rien d'autre de `T`.
      Pour appeler `compareTo`, il faut une borne `<T extends Comparable<T>>`.
  - key: interface
    format: course
    question: "Pourquoi écrit-on `extends` même pour une interface, comme dans `<T extends Comparable<T>>` ?"
    choices:
      - {text: "Dans une borne, `extends` veut dire « sous-type de », classe ou interface", correct: true}
      - {text: "Par habitude : `implements` y est aussi accepté depuis Java 8", correct: false}
      - {text: "Parce que `Comparable` est en fait une classe abstraite, pas une interface", correct: false}
      - {text: "Parce qu'une borne doit être une classe : l'interface y est convertie", correct: false}
    answer: |-
      Dans une borne, `extends` signifie « est un sous-type de », qu'il s'agisse d'une classe ou d'une interface ;
      `implements` n'y est jamais permis.
  - key: vf-methodes-borne
    format: true-false
    question: "Dans `<T extends Number>`, on peut appeler `t.doubleValue()`."
    truth: true
    answer: La borne garantit que `T` est un `Number`.
  - key: vf-super
    format: true-false
    question: "`<T super Number>` est une déclaration valide."
    truth: false
    answer: '`super` n''existe que pour les jokers (`? super Number`).'
  - key: vf-ordre
    format: true-false
    question: "`<T extends Comparable<T> & Number>` compile."
    truth: false
    answer: La classe (`Number`) doit venir en premier.
  - key: vf-classe
    format: true-false
    question: Une classe générique peut borner son paramètre de type.
    truth: true
    answer: "`class Statistiques<T extends Number>` est valide."
  - key: qcm-accepte
    format: multiple-choice
    question: "Lequel de ces appels de `static <T extends Number> double somme(List<T> l)` compile ?"
    choices:
      - {text: "`somme(List.of(1, 2, 3))`", correct: true}
      - {text: "`somme(List.of(\"1\", \"2\"))`", correct: false}
      - {text: "`somme(List.of(true))`", correct: false}
      - {text: "`somme(List.of('a', 'b'))`", correct: false}
    answer: |-
      Seuls les sous-types de `Number` sont acceptés : `Integer` en est un. `String`, `Boolean` et `Character` n'en sont
      pas, même si un caractère a un code numérique.
  - key: qcm-max
    format: multiple-choice
    question: Quelle signature permet d'écrire `a.compareTo(b)` dans la méthode ?
    choices:
      - text: "`static <T extends Comparable<T>> T max(T a, T b)`"
        correct: true
      - text: "`static <T> T max(T a, T b)`"
        correct: false
      - text: "`static <T implements Comparable<T>> T max(T a, T b)`"
        correct: false
      - text: "`static <Comparable T> T max(T a, T b)`"
        correct: false
    answer: La borne garantit l'existence de `compareTo`.
  - key: qcm-multiples
    format: multiple-choice
    question: "Laquelle de ces déclarations de bornes multiples est valide ?"
    choices:
      - {text: "`<T extends Number & Comparable<T>>`", correct: true}
      - {text: "`<T extends Integer & Long>`", correct: false}
      - {text: "`<T extends Comparable<T> & Number>`", correct: false}
      - {text: "`<T extends Number | Comparable<T>>`", correct: false}
    answer: |-
      Une seule classe au plus, placée en premier, puis des interfaces, séparées par `&`. `Integer & Long` cite deux
      classes, et `|` n'existe que dans un multi-catch.
  - key: qcm-but
    format: multiple-choice
    question: À quoi sert une borne ?
    choices:
      - {text: "À restreindre les types acceptés et à pouvoir appeler les méthodes de la borne", correct: true}
      - {text: "À accélérer l'exécution, en évitant les casts insérés par le compilateur", correct: false}
      - {text: "À autoriser les types primitifs, comme `int` ou `double`, en argument de type", correct: false}
      - {text: "À empêcher l'effacement de types, pour garder `T` connu à l'exécution", correct: false}
    answer: |-
      Une borne restreint les types acceptés et donne accès aux méthodes de la borne. Elle n'empêche pas l'effacement :
      à l'exécution, `T` est justement effacé vers sa borne.
  - key: trous-extends
    format: fill-in
    question: |-
      Complète pour n'accepter que des nombres :
      ```java
      static <T ___ Number> double moyenne(List<T> nombres) { ... }
      ```
    blanks: [[extends]]
    answer: '`extends` déclare la borne.'
  - key: trous-et
    format: fill-in
    question: |-
      Complète pour exiger un nombre comparable :
      ```java
      static <T extends Number ___ Comparable<T>> T borne(T a, T b) { ... }
      ```
    blanks: [["&"]]
    answer: Les bornes multiples se séparent par `&`.
  - key: trous-double-value
    format: fill-in
    question: |-
      Complète avec la méthode de `Number` qui donne la valeur décimale :
      ```java
      for (T n : nombres) total += n.___();
      ```
    blanks: [[doubleValue]]
    answer: La borne `Number` donne accès à `doubleValue()`.
  - key: trous-comparable
    format: fill-in
    question: |-
      Complète pour que `a.compareTo(b)` compile :
      ```java
      static <T extends ___<T>> T max(T a, T b) { return a.compareTo(b) >= 0 ? a : b; }
      ```
    blanks: [[Comparable]]
    answer: La borne garantit la méthode `compareTo`.
  - key: code-somme
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static <T extends Number> double somme(List<T> l) {
          double s = 0;
          for (T x : l) s += x.doubleValue();
          return s;
      }
      System.out.println(somme(List.of(1, 2.5, 3L)));
      ```
    choices:
      - {text: "`6.5`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`6.0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`6.5` : des `Integer`, `Double` et `Long`, tous des `Number`, additionnés en `double`."
    check:
      output: "6.5"
  - key: code-hors-borne
    format: code-output
    question: |-
      ```java
      static <T extends Number> double somme(List<T> l) { return 0; }
      somme(List.of("a"));
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui, et `somme` renvoie `0`", correct: false}
      - {text: "Oui, mais l'appel lève une `ClassCastException`", correct: false}
      - {text: "Oui, avec un avertissement unchecked", correct: false}
    answer: "Ça ne compile pas : `String` ne respecte pas la borne `Number`, et le compilateur refuse l'appel."
    check:
      compiles: false
  - key: code-max
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      static <T extends Comparable<T>> T max(T a, T b) {
          return a.compareTo(b) >= 0 ? a : b;
      }
      System.out.println(max("pomme", "poire") + " " + max(3, 7));
      ```
    choices:
      - {text: "`pomme 7`", correct: true}
      - {text: "`poire 7`", correct: false}
      - {text: "`pomme 3`", correct: false}
      - {text: "`poire 3`", correct: false}
    answer: "`pomme 7` : « pomme » vient après « poire » dans l'ordre alphabétique (`m` après `i`), et 7 est plus grand que 3."
    check:
      output: "pomme 7"
  - key: code-ordre-bornes
    format: code-output
    question: |-
      ```java
      static <T extends Comparable<T> & Number> void f(T t) { }
      ```
      Ce code compile-t-il ?
    choices:
      - {text: "Non, ça ne compile pas", correct: true}
      - {text: "Oui : l'ordre des bornes est libre", correct: false}
      - {text: "Oui, avec un avertissement sur l'ordre des bornes", correct: false}
      - {text: "Oui, mais `f` n'accepte alors aucun type", correct: false}
    answer: "Ça ne compile pas : la classe `Number` doit être la première borne, avant les interfaces."
    check:
      compiles: false
  - key: bug-sans-borne
    format: bug-fix
    question: |-
      Ce code ne compile pas (`cannot find symbol: method compareTo(T)`). Quelle correction est la bonne ?
      ```java
      static <T> T plusPetit(T a, T b) {
          return a.compareTo(b) <= 0 ? a : b;
      }
      ```
    choices:
      - {text: "Borner `T` : `static <T extends Comparable<T>> T plusPetit(T a, T b)`", correct: true}
      - {text: "Écrire `static <T implements Comparable<T>> T plusPetit(T a, T b)`", correct: false}
      - {text: "Écrire `static <T super Comparable<T>> T plusPetit(T a, T b)`", correct: false}
      - {text: "Écrire `static <T> T plusPetit(Comparable<T> a, Comparable<T> b)`", correct: false}
    answer: |-
      ```java
      static <T extends Comparable<T>> T plusPetit(T a, T b) {
          return a.compareTo(b) <= 0 ? a : b;
      }
      ```
      Sans borne, `T` n'a que les méthodes d'`Object`. La borne `Comparable<T>` garantit `compareTo`.
  - key: bug-super
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      static <T super Integer> void ajouter(List<T> liste) {
          liste.add(1);
      }
      ```
    choices:
      - {text: "Un joker : `static void ajouter(List<? super Integer> liste)`", correct: true}
      - {text: "Une borne haute : `static <T extends Integer> void ajouter(List<T> liste)`", correct: false}
      - {text: "Un joker haut : `static void ajouter(List<? extends Integer> liste)`", correct: false}
      - {text: "Un type brut : `static void ajouter(List liste)`, sans paramètre de type", correct: false}
    answer: |-
      ```java
      static void ajouter(List<? super Integer> liste) {
          liste.add(1);
      }
      ```
      `super` n'est pas permis dans la déclaration d'un paramètre de type ; un joker `? super Integer` exprime « une liste
      dans laquelle on peut ajouter des `Integer` ».
  - key: bug-ordre
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```java
      class Mesure<T extends Comparable<T> & Number> { ... }
      ```
    choices:
      - {text: "Mettre la classe en premier : `<T extends Number & Comparable<T>>`", correct: true}
      - {text: "Séparer par une virgule : `<T extends Comparable<T>, Number>`", correct: false}
      - {text: "Écrire `implements` : `<T extends Number implements Comparable<T>>`", correct: false}
      - {text: "Garder une seule borne : `<T extends Comparable<Number>>`", correct: false}
    answer: |-
      ```java
      class Mesure<T extends Number & Comparable<T>> { ... }
      ```
      Parmi plusieurs bornes, la classe vient en premier, puis les interfaces.
  - key: bug-borne-final
    format: bug-fix
    question: |-
      Ton IDE avertit que ce paramètre de type ne sert à rien. Pourquoi ?
      ```java
      static <T extends Integer> T doubler(T x) { ... }
      ```
    choices:
      - {text: "`Integer` est `final` : `T` ne peut valoir qu'`Integer`", correct: true}
      - {text: "Une borne ne peut pas être une classe, seulement une interface", correct: false}
      - {text: "`Integer` est effacé en `int`, et un primitif ne peut pas être borné", correct: false}
      - {text: "Une méthode `static` ne peut pas déclarer son propre paramètre de type", correct: false}
    answer: |-
      ```java
      static int doubler(int x) { return x * 2; }
      ```
      `Integer` est `final` : aucun sous-type n'existe, donc `T` ne peut valoir qu'`Integer`. Le paramètre de type
      n'apporte rien ; le type concret (ici le primitif) est plus simple.
