notion: collections-panorama
lesson: |-
  Le framework des collections (`java.util`) repose sur quelques **interfaces**, chacune avec plusieurs
  **implémentations** :

  | Interface | Ce qu'elle garantit | Implémentations courantes |
  |---|---|---|
  | `List` | ordre, accès par indice, doublons permis | `ArrayList`, `LinkedList` |
  | `Set` | pas de doublons | `HashSet`, `LinkedHashSet`, `TreeSet` |
  | `Queue`, `Deque` | une file (FIFO) ; une file à deux bouts, ou une pile | `ArrayDeque`, `PriorityQueue` |
  | `Map` | des associations clé → valeur, clés uniques | `HashMap`, `LinkedHashMap`, `TreeMap` |

  ```
  Iterable
  └── Collection
      ├── List
      ├── Set ── SortedSet ── NavigableSet
      └── Queue ── Deque
  Map ── SortedMap ── NavigableMap          (Map n'est PAS une Collection)
  ```

  - On **déclare l'interface** et l'on choisit l'implémentation à la création : `List<Client> clients = new
    ArrayList<>();`. Le reste du code ne dépend que du contrat.
  - `Collection` offre les opérations communes : `add`, `remove`, `contains`, `size`, `isEmpty`, `stream`, `removeIf`.
  - Une `Map` expose trois **vues** : `keySet()`, `values()` et `entrySet()`.
  - Les collections ne contiennent que des **objets** (les primitifs sont emballés).

  **Piège classique** : choisir une `List` alors qu'il faut l'unicité, et tester `contains` avant chaque ajout. Un `Set`
  garantit l'unicité, en temps constant pour un `HashSet`.

  **En entretien** : « `List` pour l'ordre et l'indice, `Set` pour l'unicité, `Queue` ou `Deque` pour les files et les
  piles, `Map` pour les associations ; et on déclare toujours l'interface. »
tour:
  - title: Les collections
    text: |-
      Les collections de `java.util` s'organisent autour de quelques interfaces :

      - `List` : une suite ordonnée, avec doublons et accès par indice (`ArrayList`) ;
      - `Set` : sans doublons (`HashSet`, ou `TreeSet`, qui trie) ;
      - `Queue` et `Deque` : une file, une pile (`ArrayDeque`) ;
      - `Map` : des associations clé-valeur (`HashMap`, `TreeMap`), qui n'est pas une `Collection`.

      On déclare la variable avec l'interface, et on choisit l'implémentation à la création. `List.of`, `Set.of` et
      `Map.of` créent des collections **immuables**.
    example:
      files:
        Main.java: |-
          void main() {
              List<String> liste = List.of("b", "a", "b");
              Set<String> ensemble = new TreeSet<>(liste);
              Deque<String> pile = new ArrayDeque<>();
              pile.push("premier");
              pile.push("second");
              Map<String, Integer> ages = new TreeMap<>(Map.of("Grace", 85, "Ada", 36));
              IO.println(liste + " " + ensemble);
              IO.println(pile.pop() + " " + pile.peek());
              IO.println(ages);
              try {
                  liste.add("c");
              } catch (UnsupportedOperationException e) {
                  IO.println("List.of est immuable");
              }
          }
      output: |-
        [b, a, b] [a, b]
        second premier
        {Ada=36, Grace=85}
        List.of est immuable
cards:
  - key: interfaces
    format: course
    question: Quelles sont les grandes interfaces des collections ?
    answer: '`List` (ordre, indice, doublons), `Set` (unicité), `Queue` et `Deque` (files et piles), et `Map` (clé → valeur), qui n''hérite pas de `Collection`.'
  - key: map-collection
    format: course
    question: "`Map` est-elle une `Collection` ?"
    answer: "Non : elle associe des clés à des valeurs et n'hérite pas de `Collection`, mais elle expose des vues qui en sont (`keySet()`, `values()`, `entrySet()`)."
  - key: declarer-interface
    format: course
    question: Pourquoi déclarer `List<Client>` plutôt que `ArrayList<Client>` ?
    answer: Le code ne dépend que du contrat ; on peut changer d'implémentation (`LinkedList`, `List.of`) en ne modifiant qu'une ligne.
  - key: vues-map
    format: course
    question: Quelles vues expose une `Map` ?
    answer: '`keySet()` (les clés, un `Set`), `values()` (les valeurs, une `Collection`) et `entrySet()` (les couples, un `Set<Map.Entry<K, V>>`).'
  - key: vf-map-collection
    format: true-false
    question: "`Map` hérite de `Collection`."
    truth: false
    answer: C'est une hiérarchie à part.
  - key: vf-set-doublons
    format: true-false
    question: Un `Set` peut contenir deux éléments égaux.
    truth: false
    answer: L'unicité est garantie au sens d'`equals` (ou du comparateur pour un `TreeSet`).
  - key: vf-list-doublons
    format: true-false
    question: Une `List` accepte les doublons.
    truth: true
    answer: Elle garde aussi l'ordre d'insertion.
  - key: vf-iterable
    format: true-false
    question: Toute `Collection` est `Iterable`.
    truth: true
    answer: C'est ce qui permet la boucle `for-each`.
  - key: qcm-unicite
    format: multiple-choice
    question: Quelle interface choisir pour garder des adresses email sans doublon ?
    choices:
      - text: "`Set<String>`"
        correct: true
      - text: "`List<String>`"
        correct: false
      - text: "`Queue<String>`"
        correct: false
      - text: "`Map<String, String>`, clé = valeur"
        correct: false
    answer: Un `Set` garantit l'unicité sans test manuel.
  - key: qcm-file
    format: multiple-choice
    question: Quelle interface représente une file d'attente « premier arrivé, premier servi » ?
    choices:
      - text: "`Queue`"
        correct: true
      - text: "`Set`"
        correct: false
      - text: "`Map`"
        correct: false
      - text: "`SortedSet`"
        correct: false
    answer: '`ArrayDeque` en est l''implémentation habituelle.'
  - key: qcm-implementations
    format: multiple-choice
    question: Lesquelles implémentent `Set` ?
    choices:
      - text: "`HashSet`"
        correct: true
      - text: "`TreeSet`"
        correct: true
      - text: "`LinkedHashSet`"
        correct: true
      - text: "`ArrayList`"
        correct: false
    answer: '`ArrayList` implémente `List`.'
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle déclaration est la plus souple ?
    choices:
      - text: "`Map<String, Client> parEmail = new HashMap<>();`"
        correct: true
      - text: "`HashMap<String, Client> parEmail = new HashMap<>();`"
        correct: false
      - text: "`Object parEmail = new HashMap<String, Client>();`"
        correct: false
      - text: "`Map parEmail = new HashMap();`"
        correct: false
    answer: L'interface, paramétrée.
  - key: code-set-dedoublonne
    format: code-output
    question: |-
      ```java
      Collection<String> c = new ArrayList<>(List.of("b", "a", "b"));
      Set<String> s = new HashSet<>(c);
      System.out.println(c.size() + " " + s.size());
      ```
    answer: '`3 2` : le `Set` élimine le doublon.'
    check:
      output: "3 2"
  - key: code-map-pas-collection
    format: code-output
    question: |-
      ```java
      Object m = new HashMap<String, Integer>();
      Object l = new ArrayList<String>();
      System.out.println((m instanceof Collection) + " " + (l instanceof Collection));
      ```
    answer: '`false true` : une `Map` n''est pas une `Collection`.'
    check:
      output: "false true"
  - key: code-file
    format: code-output
    question: |-
      ```java
      Queue<String> q = new ArrayDeque<>();
      q.offer("a");
      q.offer("b");
      System.out.println(q.poll() + q.peek() + q.size());
      ```
    answer: '`ab1` : `poll` retire le premier arrivé, `peek` regarde le suivant sans le retirer.'
    check:
      output: "ab1"
  - key: code-vues
    format: code-output
    question: |-
      ```java
      Map<String, Integer> m = new TreeMap<>(Map.of("b", 2, "a", 1));
      System.out.println(m.keySet() + " " + m.values());
      ```
    answer: '`[a, b] [1, 2]` : les vues d''une `TreeMap` suivent l''ordre des clés.'
    check:
      output: "[a, b] [1, 2]"
  - key: bug-type-concret
    format: bug-fix
    question: |-
      Pour remplacer la liste par une liste immuable, il faut modifier vingt signatures :
      ```java
      public ArrayList<Commande> commandes(ArrayList<Client> clients) { ... }
      ```
    answer: |-
      ```java
      public List<Commande> commandes(Collection<Client> clients) { ... }
      ```
      En déclarant les interfaces (et la plus générale suffisante pour les paramètres), le choix de l'implémentation
      redevient un détail.
  - key: bug-liste-unicite
    format: bug-fix
    question: |-
      Ce dédoublonnage est lent sur cent mille éléments :
      ```java
      List<String> vus = new ArrayList<>();
      for (String email : emails) {
          if (!vus.contains(email)) vus.add(email);
      }
      ```
    answer: |-
      ```java
      Set<String> vus = new LinkedHashSet<>(emails);   // unicité, et ordre d'arrivée conservé
      ```
      `List.contains` parcourt la liste (temps linéaire, donc quadratique en tout). Un `Set` garantit l'unicité en temps
      constant ; `LinkedHashSet` garde en plus l'ordre.
  - key: bug-file-arraylist
    format: bug-fix
    question: |-
      Cette file d'attente ralentit à mesure qu'elle grossit :
      ```java
      List<Tache> file = new ArrayList<>();
      // ...
      Tache suivante = file.remove(0);
      ```
    answer: |-
      ```java
      Deque<Tache> file = new ArrayDeque<>();
      // ...
      Tache suivante = file.poll();
      ```
      `ArrayList.remove(0)` décale tous les éléments. Une `ArrayDeque` retire en tête en temps constant.
  - key: bug-tableaux-objets
    format: bug-fix
    question: |-
      Ce code manipule des lignes sous forme de tableaux d'`Object`, avec des casts et des indices magiques :
      ```java
      List<Object[]> lignes = new ArrayList<>();
      lignes.add(new Object[]{"Ada", 36});
      int age = (int) lignes.get(0)[1];
      ```
    answer: |-
      ```java
      record Personne(String nom, int age) { }
      List<Personne> personnes = new ArrayList<>();
      personnes.add(new Personne("Ada", 36));
      int age = personnes.get(0).age();
      ```
      Un record donne un nom et un type à chaque valeur : plus de cast ni d'indice.
