notion: classe-collections
lesson: |-
  `java.util.Collections` regroupe des méthodes `static` qui opèrent sur des collections :

  | Méthode | Rôle |
  |---|---|
  | `sort(liste)`, `sort(liste, comparateur)` | trier (aujourd'hui, `liste.sort(...)` fait la même chose) |
  | `reverse`, `shuffle`, `swap`, `rotate` | réordonner |
  | `max`, `min`, `frequency(c, x)` | chercher, compter |
  | `binarySearch(liste, cle)` | recherche dichotomique, sur une liste **triée** |
  | `nCopies(n, x)`, `emptyList()`, `singletonList(x)` | créer des listes (immuables) |
  | `unmodifiableList`, `unmodifiableMap`... | vues en lecture seule |
  | `synchronizedList`, `synchronizedMap`... | enveloppes synchronisées |
  | `addAll(c, a, b, c)` | ajouter plusieurs éléments |

  ```java
  List<Integer> notes = new ArrayList<>(List.of(12, 8, 17));
  Collections.sort(notes);                       // [8, 12, 17]
  Collections.max(notes);                        // 17
  Collections.frequency(List.of("a", "b", "a"), "a");   // 2
  Collections.binarySearch(notes, 12);           // 1 ; une valeur absente donne -(point d'insertion) - 1
  ```

  - `binarySearch` sur une liste **non triée** donne un résultat sans signification.
  - Les méthodes qui modifient (`sort`, `shuffle`, `reverse`) lèvent une `UnsupportedOperationException` sur une
    liste immuable.
  - Les enveloppes `synchronizedX` synchronisent chaque méthode, mais pas un **parcours** : il faut un bloc
    `synchronized (liste)` autour de l'itération. On leur préfère les collections de `java.util.concurrent`.
  - `shuffle(liste, random)` accepte un générateur, pour des tirages reproductibles en test.

  **Piège classique** : `Collections.sort(List.of(3, 1, 2))`. La liste est immuable : `UnsupportedOperationException`.

  **En entretien** : « `Collections` fournit tri, recherche, vues non modifiables et enveloppes synchronisées ;
  `binarySearch` exige une liste triée. »
tour:
  - title: La classe Collections
    text: |-
      `java.util.Collections` regroupe des méthodes utilitaires : `sort`, `reverse`, `shuffle`, `max`, `min`,
      `frequency`, `nCopies`…

      Elle fabrique aussi des **vues** : `unmodifiableList(liste)` refuse toute modification, mais reflète celles de la
      liste d'origine. Pour une copie vraiment immuable, `List.copyOf` vaut mieux.
    example:
      files:
        Main.java: |-
          void main() {
              List<Integer> notes = new ArrayList<>(List.of(12, 18, 9, 18));
              Collections.sort(notes);
              IO.println(notes + " max " + Collections.max(notes) + " " + Collections.frequency(notes, 18));
              Collections.reverse(notes);
              IO.println(notes);

              List<Integer> lecture = Collections.unmodifiableList(notes);
              notes.add(5);
              IO.println(lecture);
              IO.println(Collections.nCopies(3, "ab"));
          }
      output: |-
        [9, 12, 18, 18] max 18 2
        [18, 18, 12, 9]
        [18, 18, 12, 9, 5]
        [ab, ab, ab]
cards:
  - key: role
    format: course
    question: À quoi sert la classe `Collections` ?
    answer: "À regrouper des algorithmes et des fabriques sur les collections : tri, mélange, recherche, comptage, vues non modifiables, enveloppes synchronisées."
  - key: binary-search
    format: course
    question: Que renvoie `Collections.binarySearch` pour une valeur absente ?
    answer: '`-(point d''insertion) - 1`, un nombre négatif qui indique où la valeur devrait être insérée ; et la liste doit être triée.'
  - key: synchronized
    format: course
    question: Une `Collections.synchronizedList` est-elle sûre à parcourir depuis plusieurs threads ?
    answer: "Non : chaque méthode est synchronisée, mais le parcours en demande plusieurs ; il faut un bloc `synchronized (liste)` autour de l'itération, ou une collection concurrente."
  - key: fabriques
    format: course
    question: Que renvoient `nCopies`, `emptyList` et `singletonList` ?
    answer: "Des listes immuables : `n` fois le même élément, une liste vide, une liste d'un seul élément."
  - key: vf-binary-non-triee
    format: true-false
    question: "`Collections.binarySearch` fonctionne sur une liste non triée."
    truth: false
    answer: Le résultat n'a alors aucun sens.
  - key: vf-sort-immuable
    format: true-false
    question: "`Collections.sort(List.of(3, 1, 2))` trie la liste."
    truth: false
    answer: "Elle lève une `UnsupportedOperationException` : la liste est immuable."
  - key: vf-frequency
    format: true-false
    question: "`Collections.frequency(c, x)` compte les éléments égaux à `x`."
    truth: true
    answer: Au sens d'`equals`.
  - key: vf-shuffle-seed
    format: true-false
    question: "`Collections.shuffle(liste, new Random(42))` donne toujours le même mélange pour une même liste."
    truth: true
    answer: Le générateur à graine fixe rend le mélange reproductible.
  - key: qcm-trier
    format: multiple-choice
    question: Comment trier une `ArrayList<String>` dans l'ordre naturel ?
    choices:
      - text: "`Collections.sort(liste)`"
        correct: true
      - text: "`liste.sort(null)`"
        correct: true
      - text: "`liste.sorted()`"
        correct: false
      - text: "`Arrays.sort(liste)`"
        correct: false
    answer: '`Arrays.sort` trie des tableaux.'
  - key: qcm-max
    format: multiple-choice
    question: Comment trouver le plus long mot d'une liste ?
    choices:
      - text: "`Collections.max(mots, Comparator.comparingInt(String::length))`"
        correct: true
      - text: "`Collections.max(mots)`"
        correct: false
      - text: "`Collections.frequency(mots, String::length)`"
        correct: false
      - text: "`Collections.sort(mots).get(0)`"
        correct: false
    answer: '`max(mots)` donnerait le dernier dans l''ordre alphabétique.'
  - key: qcm-binary
    format: multiple-choice
    question: "Que vaut `Collections.binarySearch(List.of(1, 3, 5, 7), 4)` ?"
    choices:
      - text: "-3"
        correct: true
      - text: "-1"
        correct: false
      - text: "2"
        correct: false
      - text: "Une exception"
        correct: false
    answer: "4 devrait être inséré à l'indice 2 : `-(2) - 1 = -3`."
  - key: qcm-concurrence
    format: multiple-choice
    question: Que préférer à `Collections.synchronizedMap` dans du code concurrent ?
    choices:
      - text: "`ConcurrentHashMap`"
        correct: true
      - text: "`Hashtable`"
        correct: false
      - text: "`HashMap`"
        correct: false
      - text: "`Collections.unmodifiableMap`"
        correct: false
    answer: Elle évite un verrou global et offre des opérations atomiques (`merge`, `computeIfAbsent`).
  - key: code-sort-reverse
    format: code-output
    question: |-
      ```java
      List<Integer> l = new ArrayList<>(List.of(3, 1, 2));
      Collections.sort(l);
      Collections.reverse(l);
      System.out.println(l + " " + Collections.max(l));
      ```
    answer: '`[3, 2, 1] 3`.'
    check:
      output: "[3, 2, 1] 3"
  - key: code-frequency
    format: code-output
    question: |-
      ```java
      System.out.println(Collections.frequency(List.of("a", "b", "a"), "a") + " " + Collections.nCopies(3, "x"));
      ```
    answer: '`2 [x, x, x]`.'
    check:
      output: "2 [x, x, x]"
  - key: code-binary-search
    format: code-output
    question: |-
      ```java
      List<Integer> l = List.of(1, 3, 5, 7);
      System.out.println(Collections.binarySearch(l, 5) + " " + Collections.binarySearch(l, 4));
      ```
    answer: '`2 -3` : 5 est à l''indice 2 ; 4 devrait être inséré à l''indice 2.'
    check:
      output: "2 -3"
  - key: code-empty-list
    format: code-output
    question: |-
      ```java
      List<String> vide = Collections.emptyList();
      vide.add("x");
      ```
    answer: "Une `UnsupportedOperationException` : la liste vide de `Collections` est immuable."
    check:
      throws: UnsupportedOperationException
  - key: bug-sort-immuable
    format: bug-fix
    question: |-
      Ce code lève une `UnsupportedOperationException` :
      ```java
      List<String> noms = depot.noms();   // renvoie un List.of(...)
      Collections.sort(noms);
      ```
    answer: |-
      ```java
      List<String> noms = new ArrayList<>(depot.noms());
      Collections.sort(noms);
      // ou, sans modifier : List<String> tries = depot.noms().stream().sorted().toList();
      ```
      On ne trie pas une liste immuable : on trie une copie modifiable, ou l'on produit une nouvelle liste triée.
  - key: bug-binary-non-triee
    format: bug-fix
    question: |-
      Cette recherche ne trouve pas des éléments pourtant présents :
      ```java
      List<String> codes = chargerCodes();   // dans l'ordre du fichier
      boolean connu = Collections.binarySearch(codes, code) >= 0;
      ```
    answer: |-
      ```java
      Set<String> codes = new HashSet<>(chargerCodes());
      boolean connu = codes.contains(code);
      ```
      `binarySearch` suppose une liste triée. Pour des tests d'appartenance répétés, un `HashSet` est plus simple et plus
      rapide (ou l'on trie d'abord la liste).
  - key: bug-iteration-synchronisee
    format: bug-fix
    question: |-
      Une `ConcurrentModificationException` survient parfois pendant ce parcours :
      ```java
      List<Evenement> evenements = Collections.synchronizedList(new ArrayList<>());
      // un autre thread ajoute des événements
      for (Evenement e : evenements) { publier(e); }
      ```
    answer: |-
      ```java
      List<Evenement> evenements = new CopyOnWriteArrayList<>();
      for (Evenement e : evenements) { publier(e); }
      ```
      L'enveloppe synchronisée ne protège pas un parcours. Une `CopyOnWriteArrayList` itère sur un instantané (adaptée si
      les lectures dominent) ; sinon, il faut `synchronized (evenements) { ... }` autour de la boucle.
  - key: bug-comptage-manuel
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      int n = 0;
      for (String vote : votes) {
          if (vote.equals("OUI")) n++;
      }
      ```
    answer: |-
      ```java
      int n = Collections.frequency(votes, "OUI");
      ```
      `frequency` compte les éléments égaux à la valeur donnée.
