notion: arraylist
lesson: |-
  `ArrayList` stocke ses éléments dans un **tableau interne**, agrandi automatiquement. C'est la `List` par défaut.

  ```java
  List<String> l = new ArrayList<>();
  l.add("a");                 // à la fin : O(1) amorti
  l.add(0, "z");              // au début : décale tous les éléments, O(n)
  l.get(1);                   // accès par indice : O(1)
  l.set(1, "b");              // remplace, et renvoie l'ancienne valeur
  l.remove(0);                // décale les suivants, O(n)
  l.indexOf("b");             // recherche linéaire, O(n) ; -1 si absent
  l.subList(0, 1);            // une VUE sur une portion de la liste
  ```

  - **Taille** (`size()`, le nombre d'éléments) et **capacité** (la longueur du tableau interne) sont différentes. Quand
    le tableau est plein, `ArrayList` en alloue un plus grand (environ 1,5 fois) et recopie tout.
  - Si l'on connaît la taille finale, on la donne au constructeur (`new ArrayList<>(100_000)`) pour éviter ces
    recopies. Ce n'est **pas** une liste de 100 000 éléments : sa taille vaut 0.
  - Un indice invalide lève une `IndexOutOfBoundsException`.
  - Grâce à la **localité mémoire** (éléments contigus), le parcours est très rapide : `ArrayList` bat `LinkedList`
    presque partout.
  - `subList` est une vue : la modifier modifie la liste d'origine (`l.subList(1, 3).clear()` supprime une plage).

  **Piège classique** : `new ArrayList<>(10)` puis `liste.set(5, x)`. La capacité n'est pas la taille : la liste est vide,
  et `set` lève une `IndexOutOfBoundsException`.

  **En entretien** : « `ArrayList` : un tableau redimensionnable, `get` en O(1), ajout en fin O(1) amorti, insertion ou
  suppression au milieu en O(n) ; c'est la liste par défaut. »
tour:
  - title: ArrayList
    text: |-
      `ArrayList` est la liste de tous les jours : un tableau qui s'agrandit tout seul. Lire ou modifier par indice
      (`get`, `set`) est immédiat, et ajouter à la fin aussi, en moyenne ; insérer ou retirer au **début** décale tous
      les éléments, et coûte cher sur une grande liste.

      Quand le tableau interne est plein, `ArrayList` en crée un plus grand et recopie. Attention aux deux `remove` :
      `remove(int)` retire par indice, `remove(Object)` par valeur, ce qui compte avec une liste d'`Integer`.
    example:
      files:
        Main.java: |-
          void main() {
              List<String> taches = new ArrayList<>();
              taches.add("lire");
              taches.add("coder");
              taches.add(0, "réveil");
              taches.set(2, "tester");
              IO.println(taches + " " + taches.size() + " " + taches.indexOf("lire"));

              List<Integer> nombres = new ArrayList<>(List.of(10, 20, 30));
              nombres.remove(1);
              IO.println(nombres);
              nombres.remove(Integer.valueOf(10));
              IO.println(nombres);
          }
      output: |-
        [réveil, lire, tester] 3 1
        [10, 30]
        [30]
    task:
      instructions: |-
        Insère `pause` entre `lire` et `tester`, avec `add(indice, valeur)` : le programme doit afficher
        `[réveil, lire, pause, tester]`.
      starter:
        Main.java: |-
          void main() {
              List<String> taches = new ArrayList<>(List.of("réveil", "lire", "tester"));
              IO.println(taches);
          }
      solution:
        Main.java: |-
          void main() {
              List<String> taches = new ArrayList<>(List.of("réveil", "lire", "tester"));
              taches.add(2, "pause");
              IO.println(taches);
          }
      output: |-
        [réveil, lire, pause, tester]
cards:
  - key: fonctionnement
    format: course
    question: Comment fonctionne une `ArrayList` ?
    choices:
      - {text: "Elle range ses éléments dans un tableau interne, réalloué plus grand (environ 1,5 fois) quand il est plein", correct: true}
      - {text: "Elle chaîne ses éléments par des nœuds, chacun pointant vers le suivant et vers le précédent", correct: false}
      - {text: "Elle range ses éléments dans un tableau de taille fixe, et lève une exception quand il est plein", correct: false}
      - {text: "Elle range ses éléments dans une table de hachage, indexée par leur position dans la liste", correct: false}
    answer: "Elle stocke ses éléments dans un tableau interne ; quand il est plein, elle en alloue un plus grand (environ 1,5 fois) et y recopie les éléments. Les nœuds chaînés, c'est `LinkedList`."
  - key: complexites
    format: course
    question: "Quelles complexités ont `get(i)`, `add(x)` en fin et l'insertion au milieu d'une `ArrayList` ?"
    choices:
      - {text: "`get` en O(1), `add` en fin en O(1) amorti, insertion au milieu en O(n)", correct: true}
      - {text: "`get` en O(n), `add` en fin en O(1), insertion au milieu en O(1)", correct: false}
      - {text: "`get` en O(log n), `add` en fin en O(log n), insertion au milieu en O(log n)", correct: false}
      - {text: "`get` en O(1), `add` en fin en O(n) à chaque appel, insertion au milieu en O(1)", correct: false}
    answer: "`get` et `set` en O(1), `add` en fin en O(1) amorti (une recopie de temps en temps), `add` ou `remove` au milieu en O(n) car il faut décaler les suivants ; `contains` et `indexOf` en O(n). Le O(1) au milieu est celui qu'on prête à tort à `LinkedList`."
  - key: taille-capacite
    format: course
    question: Quelle différence entre la taille et la capacité d'une `ArrayList` ?
    choices:
      - {text: "La taille compte les éléments (`size()`) ; la capacité est la longueur du tableau interne", correct: true}
      - {text: "La taille est la longueur du tableau interne ; la capacité compte les éléments présents", correct: false}
      - {text: "Aucune : `size()` renvoie la capacité, qui grandit d'une case à chaque ajout", correct: false}
      - {text: "La capacité est une taille maximale : au-delà, `add` lève une exception", correct: false}
    answer: "La taille est le nombre d'éléments (`size()`) ; la capacité est la longueur du tableau interne, au moins égale à la taille. Ce n'est pas un maximum : le tableau grandit quand il est plein."
  - key: sublist
    format: course
    question: Que renvoie `liste.subList(1, 3)` ?
    choices:
      - {text: "Une vue sur les éléments d'indices 1 et 2, liée à la liste d'origine", correct: true}
      - {text: "Une copie indépendante des éléments d'indices 1 et 2", correct: false}
      - {text: "Une vue sur les éléments d'indices 1, 2 et 3, liée à la liste d'origine", correct: false}
      - {text: "Une copie indépendante des éléments d'indices 1, 2 et 3", correct: false}
    answer: "Une vue sur les éléments d'indices 1 et 2 (la borne de fin est exclue) : la modifier modifie la liste d'origine ; une modification structurelle de l'origine invalide la vue."
  - key: vf-capacite
    format: true-false
    question: "`new ArrayList<>(100)` crée une liste de 100 éléments."
    truth: false
    answer: Elle est vide ; 100 est la capacité initiale.
  - key: vf-get
    format: true-false
    question: "`get(i)` sur une `ArrayList` est en temps constant."
    truth: true
    answer: C'est un accès direct au tableau.
  - key: vf-insertion-debut
    format: true-false
    question: Insérer en tête d'une `ArrayList` est en temps constant.
    truth: false
    answer: "Tous les éléments sont décalés : O(n)."
  - key: vf-set-retour
    format: true-false
    question: "`liste.set(i, x)` renvoie l'élément remplacé."
    truth: true
    answer: Pratique pour un échange ou une journalisation.
  - key: qcm-rapide
    format: multiple-choice
    question: "Laquelle de ces opérations est en O(1) amorti sur une `ArrayList` ?"
    choices:
      - {text: "`add(x)` en fin", correct: true}
      - {text: "`add(0, x)`", correct: false}
      - {text: "`contains(x)`", correct: false}
      - {text: "`remove(0)`", correct: false}
    answer: "`add` en fin écrit dans la case libre et ne recopie le tableau que de temps en temps. L'insertion et le retrait en tête décalent tout, et `contains` parcourt la liste."
  - key: qcm-presize
    format: multiple-choice
    question: On va ajouter un million d'éléments. Comment éviter les recopies successives ?
    choices:
      - text: "`new ArrayList<>(1_000_000)`"
        correct: true
      - text: "`new ArrayList<>()`, puis `trimToSize()`"
        correct: false
      - text: "`new LinkedList<>()`"
        correct: false
      - text: "`Collections.nCopies(1_000_000, null)`"
        correct: false
    answer: La capacité initiale réserve le tableau d'un coup.
  - key: qcm-indice
    format: multiple-choice
    question: "Que vaut `l.indexOf(\"x\")` si `\"x\"` n'est pas dans la liste ?"
    choices:
      - text: "-1"
        correct: true
      - text: "0"
        correct: false
      - text: "`null`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: Comme `String.indexOf`.
  - key: qcm-plage
    format: multiple-choice
    question: Comment supprimer les éléments d'indices 10 à 19 d'une liste ?
    choices:
      - text: "`liste.subList(10, 20).clear()`"
        correct: true
      - text: "`for (int i = 10; i < 20; i++) liste.remove(i)`"
        correct: false
      - text: "`liste.removeRange(10, 20)`, public"
        correct: false
      - text: "`liste.remove(10, 20)`"
        correct: false
    answer: La boucle sauterait un élément sur deux ; `removeRange` est `protected`.
  - key: trous-inserer
    format: fill-in
    question: |-
      Complète pour insérer « b » à l'indice 1 :
      ```java
      liste.___(1, "b");
      ```
    blanks: [[add]]
    answer: '`add(indice, element)` insère et décale les suivants.'
  - key: trous-set
    format: fill-in
    question: |-
      Complète pour remplacer l'élément d'indice 0 :
      ```java
      String ancien = liste.___(0, "z");
      ```
    blanks: [[set]]
    answer: '`set` remplace et renvoie l''ancienne valeur.'
  - key: trous-capacite
    format: fill-in
    question: |-
      Complète pour réserver de la place pour les lignes du fichier (dont on connaît le nombre) :
      ```java
      List<Ligne> lignes = new ArrayList<>(___);
      ```
    blanks: [[nombreDeLignes, n, taille]]
    answer: La capacité initiale évite les recopies.
  - key: trous-taille
    format: fill-in
    question: |-
      Complète pour obtenir le nombre d'éléments :
      ```java
      int n = liste.___();
      ```
    blanks: [[size]]
    answer: Pour une liste, c'est une méthode `size()`, pas `length`.
  - key: code-insertion
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> l = new ArrayList<>();
      l.add("a");
      l.add("c");
      l.add(1, "b");
      System.out.println(l + " " + l.indexOf("c"));
      ```
    choices:
      - {text: "`[a, b, c] 2`", correct: true}
      - {text: "`[a, c, b] 1`", correct: false}
      - {text: "`[a, b, c] 1`", correct: false}
      - {text: "`[a, b] 1`", correct: false}
    answer: '`[a, b, c] 2` : l''insertion décale `c` d''une case.'
    check:
      output: "[a, b, c] 2"
  - key: code-set
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> l = new ArrayList<>(List.of("a", "b"));
      String ancien = l.set(0, "z");
      System.out.println(ancien + " " + l);
      ```
    choices:
      - {text: "`a [z, b]`", correct: true}
      - {text: "`z [z, b]`", correct: false}
      - {text: "`a [z, a, b]`", correct: false}
      - {text: "`null [z, a, b]`", correct: false}
    answer: "`a [z, b]` : `set` remplace l'élément et renvoie l'ancienne valeur ; c'est `add(0, x)` qui insérerait en décalant."
    check:
      output: "a [z, b]"
  - key: code-capacite
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = new ArrayList<>(100);
      System.out.println(l.size());
      l.get(0);
      ```
    choices:
      - {text: "`0`, puis une `IndexOutOfBoundsException`", correct: true}
      - {text: "`100`, puis rien d'autre : `get(0)` renvoie `null`", correct: false}
      - {text: "`0`, puis rien d'autre : `get(0)` renvoie `null`", correct: false}
      - {text: "`100`, puis une `IndexOutOfBoundsException`", correct: false}
    answer: '`0`, puis une `IndexOutOfBoundsException` : la capacité n''est pas la taille.'
    check:
      output: "0"
      throws: IndexOutOfBoundsException
  - key: code-sublist
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = new ArrayList<>(List.of(1, 2, 3, 4, 5));
      l.subList(1, 3).clear();
      System.out.println(l);
      ```
    choices:
      - {text: "`[1, 4, 5]`", correct: true}
      - {text: "`[1, 2, 3, 4, 5]`", correct: false}
      - {text: "`[1, 5]`", correct: false}
      - {text: "`[4, 5]`", correct: false}
    answer: '`[1, 4, 5]` : vider la vue supprime les éléments dans la liste.'
    check:
      output: "[1, 4, 5]"
  - key: bug-capacite-set
    format: bug-fix
    question: |-
      Ce code lève une `IndexOutOfBoundsException`. Quelle correction est la bonne ?
      ```java
      List<Double> mesures = new ArrayList<>(24);
      for (int heure = 0; heure < 24; heure++) {
          mesures.set(heure, lire(heure));
      }
      ```
    choices:
      - {text: "Remplir la liste avec `add`, car la capacité réservée ne crée aucun élément", correct: true}
      - {text: "Passer une capacité de 25, car la dernière case est réservée à la liste", correct: false}
      - {text: "Appeler `mesures.ensureCapacity(24)` avant la boucle pour créer les cases", correct: false}
      - {text: "Commencer la boucle à l'indice 1, car `set(0, ...)` est interdit sur une liste", correct: false}
    answer: |-
      ```java
      List<Double> mesures = new ArrayList<>(24);
      for (int heure = 0; heure < 24; heure++) {
          mesures.add(lire(heure));
      }
      ```
      La capacité réserve de la place, mais la liste est vide : on remplit avec `add`. (Ou un `double[24]`.)
  - key: bug-sublist-cme
    format: bug-fix
    question: |-
      Ce code lève une `ConcurrentModificationException`. Quelle correction est la bonne ?
      ```java
      List<String> premiers = noms.subList(0, 3);
      noms.add("Zoé");
      System.out.println(premiers);
      ```
    choices:
      - {text: "Copier la portion avec `List.copyOf(noms.subList(0, 3))` avant de modifier `noms`", correct: true}
      - {text: "Remplacer `noms.add(\"Zoé\")` par `premiers.add(\"Zoé\")` pour garder les deux à jour", correct: false}
      - {text: "Déclarer `premiers` en `final`, pour que la vue ne puisse plus être invalidée", correct: false}
      - {text: "Entourer l'ajout d'un bloc `synchronized (noms)` pour protéger la vue", correct: false}
    answer: |-
      ```java
      List<String> premiers = List.copyOf(noms.subList(0, 3));
      noms.add("Zoé");
      System.out.println(premiers);
      ```
      `subList` est une vue : une modification structurelle de la liste d'origine l'invalide. Pour garder une portion, on
      la copie.
  - key: bug-insertion-tete
    format: bug-fix
    question: |-
      Ce journal, qui affiche les messages les plus récents en premier, ralentit énormément. Quelle correction est la bonne ?
      ```java
      List<String> journal = new ArrayList<>();
      void ajouter(String m) { journal.add(0, m); }
      ```
    choices:
      - {text: "Une `ArrayDeque` avec `addFirst`, qui insère en tête en temps constant", correct: true}
      - {text: "Une `ArrayList` créée avec une grande capacité initiale, pour éviter les recopies", correct: false}
      - {text: "Une `Collections.synchronizedList`, pour que les insertions ne se bloquent plus", correct: false}
      - {text: "Un `TreeSet` des messages, qui les range lui-même du plus récent au plus ancien", correct: false}
    answer: |-
      ```java
      Deque<String> journal = new ArrayDeque<>();
      void ajouter(String m) { journal.addFirst(m); }
      ```
      `add(0, m)` décale tous les éléments à chaque appel. Une `ArrayDeque` insère en tête en temps constant (ou l'on
      ajoute en fin et l'on lit avec `reversed()`).
  - key: bug-recopies
    format: bug-fix
    question: |-
      Le profilage montre de nombreuses recopies de tableaux pendant ce chargement. Quelle correction est la bonne ?
      ```java
      List<Ligne> lignes = new ArrayList<>();
      for (int i = 0; i < resultat.nombreDeLignes(); i++) {
          lignes.add(resultat.ligne(i));
      }
      ```
    choices:
      - {text: "Créer la liste avec la capacité initiale `resultat.nombreDeLignes()`", correct: true}
      - {text: "Remplacer l'`ArrayList` par une `LinkedList`, qui ne recopie jamais rien", correct: false}
      - {text: "Insérer chaque ligne en tête avec `add(0, ...)` au lieu de l'ajouter en fin", correct: false}
      - {text: "Appeler `lignes.trimToSize()` après chaque ajout pour garder un tableau exact", correct: false}
    answer: |-
      ```java
      List<Ligne> lignes = new ArrayList<>(resultat.nombreDeLignes());
      for (int i = 0; i < resultat.nombreDeLignes(); i++) {
          lignes.add(resultat.ligne(i));
      }
      ```
      Sans capacité initiale, le tableau est réalloué et recopié à chaque fois qu'il est plein. Quand la taille est connue,
      on la donne.
