notion: listes-tri
cards:
  - key: trier-liste-plusieurs-criteres
    format: course
    question: Comment trier une liste par plusieurs critères ?
    answer: '`list.sort(Comparator.comparing(User::getNom).thenComparing(User::getAge, Comparator.reverseOrder()))`.'
  - key: gerer-null-comparator
    format: course
    question: Comment gérer les null dans un Comparator ?
    answer: '`Comparator.nullsFirst(...)` ou `nullsLast(...)`.'
