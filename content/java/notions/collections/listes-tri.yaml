notion: listes-tri
lesson: |-
  `liste.sort(comparateur)` trie une liste **en place** ; `liste.sort(null)` utilise l'ordre naturel. Les comparateurs se
  construisent avec les fabriques de `Comparator` :

  ```java
  record Employe(String nom, String service, int salaire) { }

  employes.sort(Comparator.comparing(Employe::service)                        // d'abord le service
          .thenComparing(Employe::salaire, Comparator.reverseOrder())         // puis le salaire décroissant
          .thenComparing(Employe::nom));                                      // puis le nom

  noms.sort(String.CASE_INSENSITIVE_ORDER);
  noms.sort(Comparator.nullsLast(Comparator.naturalOrder()));               // les null à la fin
  List<Employe> tries = employes.stream().sorted(parSalaire).toList();       // sans modifier la liste
  ```

  - Le tri est **stable** (TimSort) : deux éléments égaux pour le comparateur gardent leur ordre de départ.
  - `reversed()` inverse **tout** le comparateur construit jusque-là ; pour inverser un seul critère, on passe
    `Comparator.reverseOrder()` à `thenComparing` (ou l'on applique `reversed()` juste après ce critère).
  - Les variantes `comparingInt`, `comparingLong`, `comparingDouble` évitent le boxing.
  - Un élément `null` dans l'ordre naturel lève une `NullPointerException` : `nullsFirst` / `nullsLast` le gèrent.
  - `sort` modifie la liste : sur une liste immuable, `UnsupportedOperationException` ; pour garder l'original,
    `stream().sorted()`.

  **Piège classique** : trier deux fois de suite (par nom, puis par service) en espérant un tri par nom « puis » par
  service. Grâce à la stabilité, le dernier tri devient le critère principal ; on écrit un seul comparateur avec
  `thenComparing`.

  **En entretien** : « `Comparator.comparing(...).thenComparing(...)`, `reverseOrder` pour un critère décroissant,
  `nullsLast` pour les `null` ; et le tri de Java est stable. »
tour:
  - title: Trier une liste
    text: |-
      `liste.sort(comparateur)` trie une liste en place. `Comparator.comparing` construit un comparateur à partir d'une
      clé, et se combine : `thenComparing` départage les égalités, `reversed()` inverse.

      Le tri de Java est **stable** : deux éléments égaux gardent leur ordre d'origine. On peut donc trier d'abord selon
      le critère secondaire, ou enchaîner les critères dans un seul comparateur.
    example:
      files:
        Main.java: |-
          record Joueur(String nom, int score) {}

          void main() {
              List<Joueur> joueurs = new ArrayList<>(List.of(
                      new Joueur("Ada", 30), new Joueur("Linus", 45), new Joueur("Grace", 30)));
              joueurs.sort(Comparator.comparingInt(Joueur::score).reversed().thenComparing(Joueur::nom));
              for (Joueur j : joueurs) {
                  IO.println(j.nom() + " " + j.score());
              }

              List<String> mots = new ArrayList<>(List.of("kiwi", "pomme", "fraise", "noix"));
              mots.sort(Comparator.comparing(String::length).thenComparing(Comparator.naturalOrder()));
              IO.println(mots);
          }
      output: |-
        Linus 45
        Ada 30
        Grace 30
        [kiwi, noix, pomme, fraise]
    task:
      instructions: |-
        Trie les joueurs par nom, dans l'ordre alphabétique : le programme doit afficher `Ada Grace Linus`.
      starter:
        Main.java: |-
          record Joueur(String nom, int score) {}

          void main() {
              List<Joueur> joueurs = new ArrayList<>(List.of(
                      new Joueur("Ada", 30), new Joueur("Linus", 45), new Joueur("Grace", 30)));
              StringJoiner noms = new StringJoiner(" ");
              for (Joueur j : joueurs) {
                  noms.add(j.nom());
              }
              IO.println(noms);
          }
      solution:
        Main.java: |-
          record Joueur(String nom, int score) {}

          void main() {
              List<Joueur> joueurs = new ArrayList<>(List.of(
                      new Joueur("Ada", 30), new Joueur("Linus", 45), new Joueur("Grace", 30)));
              joueurs.sort(Comparator.comparing(Joueur::nom));
              StringJoiner noms = new StringJoiner(" ");
              for (Joueur j : joueurs) {
                  noms.add(j.nom());
              }
              IO.println(noms);
          }
      output: |-
        Ada Grace Linus
cards:
  - key: trier-liste-plusieurs-criteres
    format: course
    question: Comment trier une liste par plusieurs critères ?
    answer: '`list.sort(Comparator.comparing(User::getNom).thenComparing(User::getAge, Comparator.reverseOrder()))`.'
  - key: gerer-null-comparator
    format: course
    question: Comment gérer les null dans un Comparator ?
    answer: '`Comparator.nullsFirst(...)` ou `nullsLast(...)`.'
  - key: stable
    format: course
    question: Que signifie « le tri est stable » ?
    answer: Deux éléments égaux pour le comparateur gardent leur ordre relatif d'origine ; c'est le cas de `List.sort` (TimSort).
  - key: sans-modifier
    format: course
    question: Comment obtenir une liste triée sans modifier la liste d'origine ?
    answer: Avec `liste.stream().sorted(comparateur).toList()` (ou en triant une copie).
  - key: vf-stable
    format: true-false
    question: "`List.sort` est un tri stable."
    truth: true
    answer: Les égalités gardent leur ordre d'origine.
  - key: vf-reversed-tout
    format: true-false
    question: "`comparing(a).thenComparing(b).reversed()` n'inverse que le critère `b`."
    truth: false
    answer: '`reversed()` inverse tout le comparateur.'
  - key: vf-null-naturel
    format: true-false
    question: Trier dans l'ordre naturel une liste qui contient `null` fonctionne, les `null` allant en tête.
    truth: false
    answer: Une `NullPointerException` ; il faut `nullsFirst` ou `nullsLast`.
  - key: vf-sort-null
    format: true-false
    question: "`liste.sort(null)` trie selon l'ordre naturel."
    truth: true
    answer: Les éléments doivent alors être `Comparable`.
  - key: qcm-decroissant-second
    format: multiple-choice
    question: Comment trier par service, puis par salaire décroissant ?
    choices:
      - text: "`comparing(Employe::service).thenComparing(Employe::salaire, Comparator.reverseOrder())`"
        correct: true
      - text: "`comparing(Employe::service).thenComparing(Employe::salaire).reversed()`"
        correct: false
      - text: "`comparing(Employe::salaire).reversed().thenComparing(Employe::service)`"
        correct: false
      - text: "Deux tris successifs, par service puis par salaire"
        correct: false
    answer: '`reversed()` en fin inverserait aussi le service ; deux tris donneraient le salaire comme critère principal.'
  - key: qcm-nulls
    format: multiple-choice
    question: Comment trier des chaînes en mettant les `null` à la fin ?
    choices:
      - text: "`Comparator.nullsLast(Comparator.naturalOrder())`"
        correct: true
      - text: "`Comparator.naturalOrder().nullsLast()`"
        correct: false
      - text: "`Comparator.reverseOrder()`"
        correct: false
      - text: "`String.CASE_INSENSITIVE_ORDER`"
        correct: false
    answer: '`nullsLast` enveloppe un comparateur.'
  - key: qcm-boxing
    format: multiple-choice
    question: Quel comparateur évite le boxing pour un âge de type `int` ?
    choices:
      - text: "`Comparator.comparingInt(Personne::age)`"
        correct: true
      - text: "`Comparator.comparing(Personne::age)`"
        correct: false
      - text: "`(a, b) -> a.age() - b.age()`"
        correct: false
      - text: "`Comparator.naturalOrder()`"
        correct: false
    answer: La soustraction peut en plus déborder.
  - key: qcm-immuable
    format: multiple-choice
    question: "Que fait `List.of(3, 1, 2).sort(null)` ?"
    choices:
      - text: "Une `UnsupportedOperationException`"
        correct: true
      - text: "Il renvoie une nouvelle liste triée"
        correct: false
      - text: "Il trie la liste"
        correct: false
      - text: "Rien"
        correct: false
    answer: '`sort` trie en place ; une liste immuable le refuse.'
  - key: trous-comparing
    format: fill-in
    question: |-
      Complétez pour trier par nom :
      ```java
      clients.sort(Comparator.___(Client::nom));
      ```
    blanks: [[comparing]]
    answer: '`comparing` construit un comparateur à partir d''une clé.'
  - key: trous-then
    format: fill-in
    question: |-
      Complétez pour départager par prénom à nom égal :
      ```java
      clients.sort(Comparator.comparing(Client::nom).___(Client::prenom));
      ```
    blanks: [[thenComparing]]
    answer: '`thenComparing` ajoute un critère secondaire.'
  - key: trous-reverse
    format: fill-in
    question: |-
      Complétez pour trier par score décroissant :
      ```java
      joueurs.sort(Comparator.comparingInt(Joueur::score).___());
      ```
    blanks: [[reversed]]
    answer: '`reversed()` inverse le comparateur.'
  - key: trous-nulls
    format: fill-in
    question: |-
      Complétez pour mettre les dates absentes en dernier :
      ```java
      taches.sort(Comparator.comparing(Tache::echeance, Comparator.___(Comparator.naturalOrder())));
      ```
    blanks: [[nullsLast]]
    answer: '`nullsLast` gère les clés `null`.'
  - key: code-multi-criteres
    format: code-output
    question: |-
      ```java
      record Employe(String nom, String service, int salaire) { }
      List<Employe> l = new ArrayList<>(List.of(
              new Employe("Bob", "IT", 3000), new Employe("Ada", "RH", 3500), new Employe("Cy", "IT", 4000)));
      l.sort(Comparator.comparing(Employe::service).thenComparing(Employe::salaire, Comparator.reverseOrder()));
      System.out.println(l.stream().map(Employe::nom).toList());
      ```
    answer: '`[Cy, Bob, Ada]` : IT avant RH, puis salaire décroissant.'
    check:
      output: "[Cy, Bob, Ada]"
  - key: code-nulls-last
    format: code-output
    question: |-
      ```java
      List<String> l = new ArrayList<>(Arrays.asList("b", null, "a"));
      l.sort(Comparator.nullsLast(Comparator.naturalOrder()));
      System.out.println(l);
      ```
    answer: '`[a, b, null]`.'
    check:
      output: "[a, b, null]"
  - key: code-null-naturel
    format: code-output
    question: |-
      ```java
      List<String> l = new ArrayList<>(Arrays.asList("b", null, "a"));
      l.sort(null);
      ```
    answer: "Une `NullPointerException` : l'ordre naturel ne sait pas comparer `null`."
    check:
      throws: NullPointerException
  - key: code-stable
    format: code-output
    question: |-
      ```java
      record P(String nom, int age) { }
      List<P> l = new ArrayList<>(List.of(new P("b", 30), new P("a", 20), new P("c", 30)));
      l.sort(Comparator.comparingInt(P::age));
      System.out.println(l.stream().map(P::nom).toList());
      ```
    answer: '`[a, b, c]` : `b` et `c`, à égalité, gardent leur ordre d''origine.'
    check:
      output: "[a, b, c]"
  - key: bug-deux-tris
    format: bug-fix
    question: |-
      On veut trier par service puis par nom, mais la liste sort triée par nom :
      ```java
      employes.sort(Comparator.comparing(Employe::service));
      employes.sort(Comparator.comparing(Employe::nom));
      ```
    answer: |-
      ```java
      employes.sort(Comparator.comparing(Employe::service).thenComparing(Employe::nom));
      ```
      Le tri étant stable, le dernier tri devient le critère principal. Un seul comparateur avec `thenComparing` exprime
      l'intention.
  - key: bug-reversed
    format: bug-fix
    question: |-
      Le classement doit afficher les meilleurs scores d'abord, et à égalité les noms dans l'ordre alphabétique, mais les
      noms sortent à l'envers :
      ```java
      joueurs.sort(Comparator.comparingInt(Joueur::score).thenComparing(Joueur::nom).reversed());
      ```
    answer: |-
      ```java
      joueurs.sort(Comparator.comparingInt(Joueur::score).reversed().thenComparing(Joueur::nom));
      ```
      `reversed()` inverse tout ce qui précède, critère secondaire compris. On l'applique juste après le critère à
      inverser.
  - key: bug-nulls
    format: bug-fix
    question: |-
      Ce tri lève une `NullPointerException` quand une tâche n'a pas d'échéance :
      ```java
      taches.sort(Comparator.comparing(Tache::echeance));
      ```
    answer: |-
      ```java
      taches.sort(Comparator.comparing(Tache::echeance, Comparator.nullsLast(Comparator.naturalOrder())));
      ```
      Le second argument de `comparing` compare les clés ; `nullsLast` y place les échéances absentes à la fin.
  - key: bug-original-modifie
    format: bug-fix
    question: |-
      Après l'affichage du classement, la liste des inscrits n'est plus dans l'ordre d'inscription :
      ```java
      List<Inscrit> classement = inscrits;
      classement.sort(Comparator.comparingInt(Inscrit::score).reversed());
      ```
    answer: |-
      ```java
      List<Inscrit> classement = inscrits.stream()
              .sorted(Comparator.comparingInt(Inscrit::score).reversed())
              .toList();
      ```
      `classement` n'était qu'une autre référence vers la même liste, triée en place. Le stream produit une nouvelle liste
      triée sans toucher l'originale.
