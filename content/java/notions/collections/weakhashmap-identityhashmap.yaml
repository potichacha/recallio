notion: weakhashmap-identityhashmap
lesson: |-
  Deux `Map` spécialisées, pour des cas précis :

  **`WeakHashMap`** référence ses **clés faiblement** : quand une clé n'est plus utilisée ailleurs, le ramasse-miettes
  peut la récupérer, et l'entrée **disparaît** de la map.

  ```java
  Map<Fenetre, Etat> etats = new WeakHashMap<>();
  etats.put(fenetre, etat);   // quand la fenêtre n'est plus référencée ailleurs, l'entrée finira par disparaître
  ```

  - Utile pour **attacher** des données à des objets dont on ne contrôle pas la durée de vie, sans les retenir.
  - Les **valeurs** sont référencées fortement : une valeur qui référence sa clé empêche la clé d'être récupérée.
  - Les littéraux `String` (internés) et les petits `Integer` (en cache) ne sont jamais récupérés : de mauvaises clés.
  - Ce n'est **pas** un cache : l'éviction dépend du GC, pas de la taille ni de l'âge.

  **`IdentityHashMap`** compare les clés avec **`==`** (et `System.identityHashCode`), au lieu d'`equals` et `hashCode` :

  ```java
  Map<String, Integer> m = new IdentityHashMap<>();
  m.put(new String("a"), 1);
  m.put(new String("a"), 2);   // deux clés distinctes : m.size() vaut 2
  ```

  - Utile quand l'**identité** compte : suivre les objets déjà visités dans un parcours de graphe (copie profonde,
    sérialisation, détection de cycles), même si leur `equals` les dit égaux ou si leur `hashCode` change.
  - Elle viole volontairement le contrat général de `Map` (fondé sur `equals`) : à réserver à ces cas.

  **Piège classique** : un `WeakHashMap` dont les clés sont des littéraux `String`. Elles ne sont jamais récupérées : la
  map se comporte comme une `HashMap` qui grossit.

  **En entretien** : « `WeakHashMap` laisse le GC récupérer ses clés ; `IdentityHashMap` compare avec `==`. Deux outils
  spécialisés, pas des remplaçants de `HashMap`. »
cards:
  - key: sert-weakhashmap
    format: course
    question: "À quoi sert une `WeakHashMap` ?"
    choices:
      - {text: "À associer des données à des clés sans empêcher le GC de ramasser ces clés", correct: true}
      - {text: "À faire un cache borné, qui évince les entrées les moins utilisées", correct: false}
      - {text: "À garder des valeurs faibles, libérées dès que la mémoire manque", correct: false}
      - {text: "À économiser la mémoire en compressant les clés et les valeurs", correct: false}
    answer: "À associer des données à des clés sans empêcher leur ramassage : quand une clé n'est plus référencée ailleurs, son entrée disparaît. Ce n'est pas un cache : ni taille ni durée."
  - key: identityhashmap
    format: course
    question: "Qu'est-ce qu'une `IdentityHashMap` ?"
    choices:
      - {text: "Une map qui compare les clés avec `==` au lieu d'`equals`", correct: true}
      - {text: "Une map qui compare les clés avec `equals`, puis `hashCode`", correct: false}
      - {text: "Une map dont les clés sont des identifiants `UUID` générés", correct: false}
      - {text: "Une map dont les clés sont gardées en références faibles", correct: false}
    answer: "Une map qui compare les clés avec `==` (et `System.identityHashCode`) au lieu d'`equals` et `hashCode`. Les références faibles, c'est `WeakHashMap`."
  - key: valeur-retient
    format: course
    question: Pourquoi une valeur qui référence sa clé empêche-t-elle le nettoyage d'une `WeakHashMap` ?
    choices:
      - {text: "La map référence fortement la valeur, qui garde sa clé accessible", correct: true}
      - {text: "La map copie la clé dans la valeur, et la copie n'est jamais libérée", correct: false}
      - {text: "Le GC ne ramasse jamais une clé associée à une valeur non `null`", correct: false}
      - {text: "La valeur devient elle aussi une référence faible, qui protège la clé", correct: false}
    answer: Les valeurs sont référencées fortement par la map ; si une valeur référence la clé, la clé reste accessible et n'est jamais récupérée.
  - key: usage-identite
    format: course
    question: Dans quel cas `IdentityHashMap` est-elle le bon choix ?
    choices:
      - {text: "Pour suivre des objets par identité, comme ceux déjà visités dans une copie profonde", correct: true}
      - {text: "Pour indexer des entités par leur identifiant métier, comparé avec `equals`", correct: false}
      - {text: "Pour un cache dont les entrées disparaissent quand leurs clés ne servent plus", correct: false}
      - {text: "Pour compter des chaînes égales, même créées par des `new String` différents", correct: false}
    answer: Pour suivre des objets par identité, par exemple les objets déjà visités dans une copie profonde ou une sérialisation, où deux objets égaux mais distincts doivent être traités séparément.
  - key: vf-cache
    format: true-false
    question: "`WeakHashMap` est un bon cache à taille bornée."
    truth: false
    answer: L'éviction dépend du GC, pas d'une taille ni d'une durée ; on utilise Caffeine.
  - key: vf-identity-equals
    format: true-false
    question: "`IdentityHashMap` compare ses clés avec `equals`."
    truth: false
    answer: Avec `==`.
  - key: vf-litteraux
    format: true-false
    question: Des clés littérales `"session"` d'une `WeakHashMap` finissent par être récupérées.
    truth: false
    answer: Les littéraux sont internés et restent accessibles pour toujours.
  - key: vf-cles-faibles
    format: true-false
    question: Dans une `WeakHashMap`, ce sont les clés, et non les valeurs, qui sont référencées faiblement.
    truth: true
    answer: Les valeurs restent fortement référencées.
  - key: qcm-identity
    format: multiple-choice
    question: "Que vaut `m.size()` pour une `IdentityHashMap` après `m.put(new String(\"a\"), 1); m.put(new String(\"a\"), 2);` ?"
    choices:
      - {text: "`2`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Une `IllegalArgumentException`", correct: false}
    answer: "`2` : `IdentityHashMap` compare les identités, et les deux `new String(\"a\")` sont deux objets distincts. Une `HashMap`, qui utilise `equals`, n'en aurait qu'une."
  - key: qcm-weak-usage
    format: multiple-choice
    question: Pour quel besoin une `WeakHashMap` convient-elle ?
    choices:
      - {text: "Associer des métadonnées à des objets d'une bibliothèque sans prolonger leur vie", correct: true}
      - {text: "Un cache de requêtes HTTP de taille fixe, vidé des requêtes les plus anciennes", correct: false}
      - {text: "Un index de produits par code, gardé en mémoire pendant toute l'exécution", correct: false}
      - {text: "Un compteur de visites par page, partagé entre tous les threads du serveur", correct: false}
    answer: La donnée disparaît avec l'objet auquel elle est attachée.
  - key: qcm-mauvaises-cles
    format: multiple-choice
    question: Lesquelles sont de mauvaises clés pour une `WeakHashMap` ?
    choices:
      - text: "Des littéraux `String`"
        correct: true
      - text: "Des petits `Integer` (de -128 à 127)"
        correct: true
      - text: "Des objets métier créés et abandonnés au fil du programme"
        correct: false
      - text: "Des fenêtres d'interface ouvertes puis fermées"
        correct: false
    answer: Internés ou en cache, ces objets ne deviennent jamais inaccessibles.
  - key: qcm-graphe
    format: multiple-choice
    question: Une copie profonde doit éviter de copier deux fois le même objet d'un graphe. Que choisir pour mémoriser les objets déjà copiés ?
    choices:
      - text: "`IdentityHashMap<Object, Object>`"
        correct: true
      - text: "`HashMap<Object, Object>`"
        correct: false
      - text: "`WeakHashMap<Object, Object>`"
        correct: false
      - text: "`TreeMap<Object, Object>`"
        correct: false
    answer: "Deux objets égaux mais distincts doivent être copiés séparément : c'est l'identité qui compte."
  - key: code-identity
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> identite = new IdentityHashMap<>();
      Map<String, Integer> egalite = new HashMap<>();
      for (int i = 0; i < 2; i++) {
          identite.put(new String("a"), i);
          egalite.put(new String("a"), i);
      }
      System.out.println(identite.size() + " " + egalite.size());
      ```
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`1 2`", correct: false}
    answer: '`2 1` : `IdentityHashMap` compare les identités, `HashMap` les contenus.'
    check:
      output: "2 1"
  - key: code-cache-integer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<Integer, String> m = new IdentityHashMap<>();
      m.put(127, "a");
      m.put(127, "b");
      m.put(1000, "c");
      m.put(1000, "d");
      System.out.println(m.size());
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`1`", correct: false}
    answer: '`3` : les deux 127 sont le même objet (cache), les deux 1000 deux objets distincts.'
    check:
      output: "3"
  - key: code-weak-forte
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<Object, String> m = new WeakHashMap<>();
      Object cle = new Object();
      m.put(cle, "valeur");
      System.out.println(m.get(cle) + " " + m.size());
      ```
    choices:
      - {text: "`valeur 1`", correct: true}
      - {text: "`null 0`", correct: false}
      - {text: "`null 1`", correct: false}
      - {text: "`valeur 0`", correct: false}
    answer: '`valeur 1` : tant que la clé est référencée ailleurs, la `WeakHashMap` se comporte comme une map ordinaire.'
    check:
      output: "valeur 1"
  - key: code-identity-get
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> m = new IdentityHashMap<>();
      m.put(new String("x"), 1);
      System.out.println(m.get("x") + " " + m.containsKey(new String("x")));
      ```
    choices:
      - {text: "`null false`", correct: true}
      - {text: "`1 true`", correct: false}
      - {text: "`1 false`", correct: false}
      - {text: "`null true`", correct: false}
    answer: '`null false` : aucune des clés cherchées n''est le même objet que la clé rangée.'
    check:
      output: "null false"
  - key: bug-litteraux
    format: bug-fix
    question: |-
      Ce registre « auto-nettoyant » perd des sessions encore actives, au gré des passages du ramasse-miettes. Quelle correction est la bonne ?
      ```java
      Map<String, Session> sessions = new WeakHashMap<>();
      sessions.put("session-" + id, session);   // la clé n'est référencée nulle part ailleurs
      ```
    choices:
      - {text: "Un cache à expiration explicite, comme Caffeine avec `expireAfterAccess`", correct: true}
      - {text: "Une `WeakHashMap` créée avec une capacité initiale plus grande", correct: false}
      - {text: "Appeler `System.gc()` régulièrement pour vider la `WeakHashMap`", correct: false}
      - {text: "Interner chaque clé avec `intern()`, pour que le GC la reconnaisse", correct: false}
    answer: |-
      ```java
      Cache<String, Session> sessions = Caffeine.newBuilder()
              .expireAfterAccess(Duration.ofMinutes(30))
              .build();
      ```
      La clé, créée à l'exécution et référencée nulle part ailleurs, est récupérée au premier passage du GC : l'entrée disparaît alors que la session vit encore. Une `WeakHashMap` n'est pas un cache, son éviction dépend du GC et non d'une durée. Interner les clés ferait l'inverse : elles ne seraient plus jamais récupérées, et le registre grossirait sans fin.
  - key: bug-valeur-cle
    format: bug-fix
    question: |-
      Les entrées de cette `WeakHashMap` ne disparaissent jamais. Quelle correction est la bonne ?
      ```java
      Map<Document, Apercu> apercus = new WeakHashMap<>();
      apercus.put(doc, new Apercu(doc));   // Apercu garde une référence vers son document
      ```
    choices:
      - {text: "Construire l'aperçu sans référence vers son document (titre, résumé)", correct: true}
      - {text: "Appeler `System.gc()` après chaque ajout pour forcer le nettoyage", correct: false}
      - {text: "Remplacer la `WeakHashMap` par une `IdentityHashMap`", correct: false}
      - {text: "Créer la map avec une petite capacité, pour forcer l'éviction", correct: false}
    answer: |-
      ```java
      apercus.put(doc, new Apercu(doc.titre(), doc.resume()));   // l'aperçu ne référence plus le document
      ```
      La valeur, fortement référencée par la map, référençait la clé : le document restait accessible et n'était jamais
      récupéré. La valeur ne doit pas retenir sa clé.
  - key: bug-identity-metier
    format: bug-fix
    question: |-
      Ce comptage par email compte deux fois le même client. Quelle correction est la bonne ?
      ```java
      Map<String, Integer> commandesParEmail = new IdentityHashMap<>();
      commandesParEmail.merge(commande.email(), 1, Integer::sum);
      ```
    choices:
      - {text: "Une `HashMap`, qui compare les emails avec `equals`", correct: true}
      - {text: "Une `IdentityHashMap` créée avec une plus grande capacité", correct: false}
      - {text: "Mettre les emails en minuscules avant de les compter", correct: false}
      - {text: "Remplacer `merge` par `put(email, get(email) + 1)`", correct: false}
    answer: |-
      ```java
      Map<String, Integer> commandesParEmail = new HashMap<>();
      ```
      Les emails lus en base sont des objets `String` distincts : comparés par identité, deux emails égaux sont deux
      clés. Une clé métier se compare avec `equals`.
  - key: bug-weak-cache
    format: bug-fix
    question: |-
      Ce cache de calculs coûteux se vide parfois d'un coup, puis l'application ralentit. Quelle correction est la bonne ?
      ```java
      private final Map<Requete, Resultat> cache = new WeakHashMap<>();
      ```
    choices:
      - {text: "Un cache borné par taille, comme Caffeine avec `maximumSize`", correct: true}
      - {text: "Une `WeakHashMap` créée avec une grande capacité initiale", correct: false}
      - {text: "Une `IdentityHashMap`, qui garde les entrées tant que la clé existe", correct: false}
      - {text: "Appeler `System.gc()` moins souvent, pour garder les entrées", correct: false}
    answer: |-
      ```java
      private final Cache<Requete, Resultat> cache = Caffeine.newBuilder()
              .maximumSize(10_000)
              .build();
      ```
      Dans une `WeakHashMap`, une entrée disparaît dès que sa clé n'est plus référencée ailleurs et qu'un GC passe. Un
      cache borné par taille garde les entrées utiles de façon prévisible.
