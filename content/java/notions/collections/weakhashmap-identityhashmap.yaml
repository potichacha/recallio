notion: weakhashmap-identityhashmap
cards:
  - key: sert-weakhashmap
    format: course
    question: À quoi sert WeakHashMap ?
    answer: Associer des données à des clés sans empêcher leur garbage collection.
  - key: identityhashmap
    format: course
    question: IdentityHashMap ?
    answer: Une map qui compare les clés avec == au lieu d'equals.
