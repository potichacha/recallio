notion: treemap-navigable
lesson: |-
  `TreeMap` garde ses entrées **triées par clé** (ordre naturel ou comparateur), dans un arbre rouge-noir : `get`, `put`
  et `remove` sont en **O(log n)**. C'est une **`NavigableMap`**, avec des requêtes de voisinage et d'intervalle :

  ```java
  TreeMap<Integer, String> t = new TreeMap<>(Map.of(10, "a", 20, "b", 30, "c"));
  t.firstKey();          // 10
  t.floorKey(25);        // 20 : la plus grande clé ≤ 25
  t.ceilingEntry(25);    // 30=c : la plus petite clé ≥ 25
  t.headMap(20);         // {10=a} : clés strictement inférieures
  t.tailMap(20);         // {20=b, 30=c} : clés supérieures ou égales
  t.subMap(10, 30);      // {10=a, 20=b}
  t.descendingMap();     // {30=c, 20=b, 10=a}
  t.pollFirstEntry();    // retire et renvoie 10=a
  ```

  Usages typiques :
  - des **tranches** : le taux applicable à un revenu est `floorEntry(revenu)` ;
  - une **chronologie** : les événements entre deux dates, `subMap(debut, fin)` ;
  - un **classement** : les plus grandes valeurs avec `descendingMap()` ;
  - un **affichage trié** sans trier à chaque lecture.

  - `floorKey` et `ceilingKey` renvoient **`null`** s'il n'existe pas de clé de ce côté.
  - `headMap`, `tailMap`, `subMap` sont des **vues**.
  - Les clés doivent être `Comparable` (ou un comparateur fourni) ; `null` est refusé avec l'ordre naturel.
  - Comme pour `TreeSet`, deux clés jugées égales par le comparateur sont la **même** clé.

  **Piège classique** : `int taux = tranches.floorEntry(revenu).getValue();` pour un revenu inférieur à la première
  tranche. `floorEntry` renvoie `null`, d'où une `NullPointerException` ; on prévoit une tranche à 0.

  **En entretien** : « `TreeMap` trie par clé en O(log n) et répond aux questions de voisinage (`floorKey`,
  `ceilingKey`) et d'intervalle (`subMap`), idéales pour des tranches ou une chronologie. »
cards:
  - key: definition
    format: course
    question: Qu'est-ce qu'une `TreeMap` ?
    answer: Une `Map` triée par clé, construite sur un arbre rouge-noir, avec des opérations en O(log n) et des requêtes de navigation (`NavigableMap`).
  - key: floor-ceiling
    format: course
    question: Que renvoient `floorKey(x)` et `ceilingKey(x)` ?
    answer: La plus grande clé inférieure ou égale à `x`, et la plus petite clé supérieure ou égale à `x` ; `null` s'il n'y en a pas.
  - key: tranches
    format: course
    question: Comment trouver le taux d'imposition applicable à un revenu avec une `TreeMap` ?
    answer: En indexant les taux par seuil de début de tranche et en lisant `taux.floorEntry(revenu).getValue()` (avec une tranche à 0 pour éviter `null`).
  - key: vues
    format: course
    question: "`headMap`, `tailMap` et `subMap` renvoient-ils des copies ?"
    answer: "Non, des vues : elles reflètent la map d'origine et la modifient si on les modifie."
  - key: vf-triee
    format: true-false
    question: Une `TreeMap` itère dans l'ordre de ses clés.
    truth: true
    answer: Ordre naturel ou ordre du comparateur.
  - key: vf-complexite
    format: true-false
    question: "`get` sur une `TreeMap` est en O(1)."
    truth: false
    answer: En O(log n) ; une `HashMap` est en O(1) en moyenne.
  - key: vf-floor-null
    format: true-false
    question: "`floorKey(x)` renvoie `null` si toutes les clés sont supérieures à `x`."
    truth: true
    answer: Il n'existe alors aucune clé inférieure ou égale.
  - key: vf-head-map
    format: true-false
    question: "`headMap(20)` inclut la clé 20."
    truth: false
    answer: La borne est exclue ; `headMap(20, true)` l'inclut.
  - key: qcm-tranche
    format: multiple-choice
    question: "Avec des taux indexés par seuil `{0=0.0, 11000=0.11, 28000=0.30}`, quel taux pour un revenu de 15 000 ?"
    choices:
      - text: "0.11, avec `floorEntry(15000)`"
        correct: true
      - text: "0.30, avec `ceilingEntry(15000)`"
        correct: false
      - text: "0.0, avec `firstEntry()`"
        correct: false
      - text: "`null`, avec `get(15000)`"
        correct: false
    answer: La tranche applicable commence au plus grand seuil inférieur ou égal.
  - key: qcm-intervalle
    format: multiple-choice
    question: Comment obtenir les événements entre deux dates dans une `TreeMap<LocalDate, Evenement>` ?
    choices:
      - text: "`evenements.subMap(debut, true, fin, true)`"
        correct: true
      - text: "Parcourir toutes les entrées et filtrer"
        correct: false
      - text: "`evenements.get(debut, fin)`"
        correct: false
      - text: "`evenements.range(debut, fin)`"
        correct: false
    answer: '`subMap` est une vue, obtenue en O(log n).'
  - key: qcm-plus-grands
    format: multiple-choice
    question: Comment parcourir une `TreeMap` des plus grandes clés aux plus petites ?
    choices:
      - text: "`map.descendingMap()`"
        correct: true
      - text: "`map.reversed()` (Java 21)"
        correct: true
      - text: "`Collections.reverse(map)`"
        correct: false
      - text: "`map.sort(reverseOrder())`"
        correct: false
    answer: Les deux renvoient une vue dans l'ordre inverse.
  - key: qcm-choix
    format: multiple-choice
    question: Quand préférer une `TreeMap` à une `HashMap` ?
    choices:
      - text: "Quand on a besoin d'un ordre sur les clés ou de requêtes par intervalle"
        correct: true
      - text: "Pour les accès par clé les plus rapides possibles"
        correct: false
      - text: "Pour garder l'ordre d'insertion"
        correct: false
      - text: "Pour des clés `null`"
        correct: false
    answer: '`LinkedHashMap` garde l''ordre d''insertion ; `TreeMap` refuse `null` avec l''ordre naturel.'
  - key: code-navigation
    format: code-output
    question: |-
      ```java
      TreeMap<Integer, String> t = new TreeMap<>(Map.of(10, "a", 20, "b", 30, "c"));
      System.out.println(t.floorKey(25) + " " + t.ceilingEntry(25) + " " + t.headMap(20));
      ```
    answer: '`20 30=c {10=a}`.'
    check:
      output: "20 30=c {10=a}"
  - key: code-tranches
    format: code-output
    question: |-
      ```java
      TreeMap<Integer, Double> taux = new TreeMap<>(Map.of(0, 0.0, 11_000, 0.11, 28_000, 0.30));
      System.out.println(taux.floorEntry(15_000).getValue() + " " + taux.floorEntry(40_000).getValue());
      ```
    answer: '`0.11 0.3`.'
    check:
      output: "0.11 0.3"
  - key: code-descendant
    format: code-output
    question: |-
      ```java
      System.out.println(new TreeMap<>(Map.of("a", 1, "b", 2, "c", 3)).descendingMap());
      ```
    answer: '`{c=3, b=2, a=1}`.'
    check:
      output: "{c=3, b=2, a=1}"
  - key: code-poll
    format: code-output
    question: |-
      ```java
      TreeMap<Integer, String> t = new TreeMap<>(Map.of(3, "c", 1, "a"));
      System.out.println(t.pollFirstEntry() + " " + t);
      ```
    answer: '`1=a {3=c}` : `pollFirstEntry` retire et renvoie la plus petite entrée.'
    check:
      output: "1=a {3=c}"
  - key: bug-recherche-lineaire
    format: bug-fix
    question: |-
      Le calcul du taux de remise parcourt toute la table à chaque commande :
      ```java
      double remise = 0;
      for (var e : paliers.entrySet()) {        // HashMap<Integer, Double>
          if (montant >= e.getKey() && e.getValue() > remise) remise = e.getValue();
      }
      ```
    answer: |-
      ```java
      NavigableMap<Integer, Double> paliers = new TreeMap<>(Map.of(0, 0.0, 100, 0.05, 500, 0.10));
      double remise = paliers.floorEntry(montant).getValue();
      ```
      Une `TreeMap` donne directement le palier applicable en O(log n), sans parcours.
  - key: bug-floor-null
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` pour un montant inférieur au premier palier :
      ```java
      TreeMap<Integer, Double> paliers = new TreeMap<>(Map.of(100, 0.05, 500, 0.10));
      double remise = paliers.floorEntry(montant).getValue();
      ```
    answer: |-
      ```java
      TreeMap<Integer, Double> paliers = new TreeMap<>(Map.of(0, 0.0, 100, 0.05, 500, 0.10));
      double remise = paliers.floorEntry(montant).getValue();
      ```
      `floorEntry` renvoie `null` quand aucune clé n'est inférieure ou égale. Un palier à 0 couvre tous les montants
      positifs.
  - key: bug-tri-repete
    format: bug-fix
    question: |-
      L'affichage de l'historique trie les clés à chaque appel :
      ```java
      Map<LocalDate, Releve> historique = new HashMap<>();
      List<LocalDate> dates = new ArrayList<>(historique.keySet());
      Collections.sort(dates);
      ```
    answer: |-
      ```java
      NavigableMap<LocalDate, Releve> historique = new TreeMap<>();
      // l'itération suit déjà l'ordre des dates
      ```
      Une `TreeMap` garde les clés triées au fil des ajouts : plus de tri à chaque lecture.
  - key: bug-comparateur
    format: bug-fix
    question: |-
      Une `TreeMap` indexée par code produit perd des produits dont les codes ne diffèrent que par la casse :
      ```java
      Map<String, Produit> parCode = new TreeMap<>(String.CASE_INSENSITIVE_ORDER);
      ```
      Les codes `ab-12` et `AB-12` désignent deux produits différents.
    answer: |-
      ```java
      Map<String, Produit> parCode = new TreeMap<>();
      ```
      Pour la `TreeMap`, deux clés égales pour le comparateur sont la même clé : la seconde remplace la première. Le
      comparateur doit refléter l'identité réelle des clés.
