notion: linkedhashmap-lru
lesson: |-
  `LinkedHashMap` est une `HashMap` dont les entrées sont aussi reliées par une **liste doublement chaînée**. Elle itère
  donc dans un ordre prévisible, avec les mêmes performances (O(1)).

  - Par défaut, l'ordre est celui de **l'insertion** ; remplacer la valeur d'une clé existante ne change pas sa place.
  - Avec le troisième argument du constructeur à `true`, l'ordre devient celui de **l'accès** : chaque `get` ou `put`
    déplace l'entrée à la fin.
  - La méthode **`removeEldestEntry`**, appelée après chaque ajout, permet de supprimer automatiquement l'entrée la plus
    ancienne.

  Les deux ensemble donnent un **cache LRU** (*Least Recently Used*) en quelques lignes :

  ```java
  class CacheLru<K, V> extends LinkedHashMap<K, V> {
      private final int capacite;

      CacheLru(int capacite) {
          super(16, 0.75f, true);          // true : ordre d'accès
          this.capacite = capacite;
      }

      @Override
      protected boolean removeEldestEntry(Map.Entry<K, V> plusAncienne) {
          return size() > capacite;        // évince le moins récemment utilisé
      }
  }
  ```

  - Ce cache n'est **pas thread-safe** : en concurrence, on utilise une bibliothèque comme **Caffeine** (taille,
    expiration, statistiques, politique plus fine que le LRU).
  - `LinkedHashMap` est aussi le bon choix pour une sortie **déterministe** (JSON, CSV) qui suit l'ordre d'ajout.

  **Piège classique** : oublier `true` dans le constructeur. Le cache évince alors la plus ancienne **insertion**, même
  si elle vient d'être lue : c'est un FIFO, pas un LRU.

  **En entretien** : « `LinkedHashMap` garde l'ordre d'insertion, ou d'accès avec `true` ; avec `removeEldestEntry`, elle
  donne un cache LRU en O(1). »
cards:
  - key: cache-lru-simple
    format: course
    question: Comment faire un cache LRU simple ?
    answer: LinkedHashMap en mode accès-ordonné avec removeEldestEntry.
  - key: ordres
    format: course
    question: Quels ordres d'itération une `LinkedHashMap` peut-elle garder ?
    answer: L'ordre d'insertion (par défaut) ou l'ordre d'accès (troisième argument du constructeur à `true`), où chaque accès place l'entrée en fin.
  - key: remove-eldest
    format: course
    question: Quand `removeEldestEntry` est-elle appelée ?
    answer: Après chaque ajout (`put`, `putAll`) ; si elle renvoie `true`, l'entrée la plus ancienne (la première de l'ordre d'itération) est supprimée.
  - key: concurrence
    format: course
    question: Pourquoi ce cache LRU ne convient-il pas tel quel à un service concurrent ?
    answer: '`LinkedHashMap` n''est pas thread-safe, et en mode accès même un `get` modifie la structure ; on utilise Caffeine, ou une synchronisation explicite.'
  - key: vf-insertion
    format: true-false
    question: Par défaut, une `LinkedHashMap` itère dans l'ordre d'insertion.
    truth: true
    answer: Le mode accès s'active par le constructeur.
  - key: vf-get-deplace
    format: true-false
    question: En mode accès, un `get` déplace l'entrée à la fin de l'ordre d'itération.
    truth: true
    answer: C'est ce qui rend l'éviction LRU possible.
  - key: vf-remplacement
    format: true-false
    question: En mode insertion, remplacer la valeur d'une clé existante la place à la fin.
    truth: false
    answer: Sa position ne change pas.
  - key: vf-complexite
    format: true-false
    question: "`get` et `put` sur une `LinkedHashMap` sont en O(1) en moyenne."
    truth: true
    answer: Comme une `HashMap` ; la liste chaînée ajoute un coût constant.
  - key: qcm-constructeur
    format: multiple-choice
    question: Quel constructeur crée une `LinkedHashMap` en ordre d'accès ?
    choices:
      - text: "`new LinkedHashMap<>(16, 0.75f, true)`"
        correct: true
      - text: "`new LinkedHashMap<>(true)`"
        correct: false
      - text: "`new LinkedHashMap<>()`"
        correct: false
      - text: "`LinkedHashMap.accessOrder()`"
        correct: false
    answer: Le troisième argument active l'ordre d'accès.
  - key: qcm-lru
    format: multiple-choice
    question: "Un cache LRU de capacité 2 reçoit `put(a)`, `put(b)`, `get(a)`, `put(c)`. Que contient-il ?"
    choices:
      - text: "`a` et `c`"
        correct: true
      - text: "`b` et `c`"
        correct: false
      - text: "`a` et `b`"
        correct: false
      - text: "`a`, `b` et `c`"
        correct: false
    answer: '`b` est le moins récemment utilisé, il est évincé.'
  - key: qcm-production
    format: multiple-choice
    question: Pour un cache en production, partagé entre threads et avec expiration, que choisir ?
    choices:
      - text: "Caffeine"
        correct: true
      - text: "Une `LinkedHashMap` en ordre d'accès"
        correct: false
      - text: "Une `HashMap`"
        correct: false
      - text: "Une `WeakHashMap`"
        correct: false
    answer: Caffeine gère la concurrence, la taille, l'expiration et les statistiques.
  - key: qcm-deterministe
    format: multiple-choice
    question: Quelle map garantit qu'un objet JSON généré garde l'ordre d'ajout de ses champs ?
    choices:
      - text: "`LinkedHashMap`"
        correct: true
      - text: "`HashMap`"
        correct: false
      - text: "`Map.of`"
        correct: false
      - text: "`IdentityHashMap`"
        correct: false
    answer: Les autres n'ont pas d'ordre garanti.
  - key: code-insertion
    format: code-output
    question: |-
      ```java
      Map<String, Integer> m = new LinkedHashMap<>();
      m.put("c", 3);
      m.put("a", 1);
      m.put("c", 30);
      System.out.println(m);
      ```
    answer: '`{c=30, a=1}` : le remplacement ne déplace pas `c`.'
    check:
      output: "{c=30, a=1}"
  - key: code-acces
    format: code-output
    question: |-
      ```java
      Map<String, Integer> m = new LinkedHashMap<>(16, 0.75f, true);
      m.put("a", 1);
      m.put("b", 2);
      m.get("a");
      System.out.println(m.keySet());
      ```
    answer: '`[b, a]` : en mode accès, `get` place `a` en fin.'
    check:
      output: "[b, a]"
  - key: code-lru
    format: code-output
    question: |-
      ```java
      Map<String, Integer> cache = new LinkedHashMap<>(16, 0.75f, true) {
          @Override
          protected boolean removeEldestEntry(Map.Entry<String, Integer> plusAncienne) {
              return size() > 2;
          }
      };
      cache.put("a", 1);
      cache.put("b", 2);
      cache.get("a");
      cache.put("c", 3);
      System.out.println(cache.keySet());
      ```
    answer: '`[a, c]` : `b`, le moins récemment utilisé, a été évincé.'
    check:
      output: "[a, c]"
  - key: code-premier
    format: code-output
    question: |-
      ```java
      Map<String, Integer> m = new LinkedHashMap<>();
      m.put("z", 1);
      m.put("a", 2);
      System.out.println(m.keySet().iterator().next());
      ```
    answer: '`z` : le premier inséré.'
    check:
      output: "z"
  - key: bug-fifo
    format: bug-fix
    question: |-
      Ce « cache LRU » évince même les entrées très souvent lues :
      ```java
      Map<K, V> cache = new LinkedHashMap<>() {
          protected boolean removeEldestEntry(Map.Entry<K, V> e) { return size() > 1000; }
      };
      ```
    answer: |-
      ```java
      Map<K, V> cache = new LinkedHashMap<>(16, 0.75f, true) {
          protected boolean removeEldestEntry(Map.Entry<K, V> e) { return size() > 1000; }
      };
      ```
      Sans ordre d'accès, la plus ancienne entrée est la première insérée, même si elle vient d'être lue : c'est un FIFO.
      Le troisième argument `true` en fait un LRU.
  - key: bug-ordre-hashmap
    format: bug-fix
    question: |-
      Le fichier CSV généré a ses colonnes dans un ordre aléatoire :
      ```java
      Map<String, String> colonnes = new HashMap<>();
      colonnes.put("nom", ...); colonnes.put("email", ...); colonnes.put("ville", ...);
      ```
    answer: |-
      ```java
      Map<String, String> colonnes = new LinkedHashMap<>();
      ```
      Une `HashMap` n'a pas d'ordre. `LinkedHashMap` garde l'ordre d'insertion : les colonnes sortent dans l'ordre voulu.
  - key: bug-seuil
    format: bug-fix
    question: |-
      Ce cache de capacité 100 ne garde jamais que 99 entrées :
      ```java
      protected boolean removeEldestEntry(Map.Entry<K, V> e) { return size() >= capacite; }
      ```
    answer: |-
      ```java
      protected boolean removeEldestEntry(Map.Entry<K, V> e) { return size() > capacite; }
      ```
      La méthode est appelée après l'ajout : avec `>=`, on évince dès que la taille atteint la capacité.
  - key: bug-concurrence
    format: bug-fix
    question: |-
      Ce cache LRU partagé par les threads d'un serveur lève parfois des exceptions et perd des entrées :
      ```java
      private final Map<String, Profil> cache = new CacheLru<>(10_000);
      ```
    answer: |-
      ```java
      private final Cache<String, Profil> cache = Caffeine.newBuilder()
              .maximumSize(10_000)
              .expireAfterWrite(Duration.ofMinutes(10))
              .build();
      ```
      `LinkedHashMap` n'est pas thread-safe, et en mode accès même les lectures la modifient. Caffeine est conçu pour la
      concurrence et ajoute l'expiration.
  - key: implemente-cache-lru-capacite-fixe
    format: scenario
    question: Implémente un cache LRU de capacité fixe.
    answer: |-
      La solution idiomatique s'appuie sur `LinkedHashMap` en mode **accès-ordonné** :
      ```java
      class LruCache<K, V> extends LinkedHashMap<K, V> {
          private final int capacite;
          LruCache(int capacite) {
              super(16, 0.75f, true);      // true = ordre d'accès
              this.capacite = capacite;
          }
          @Override
          protected boolean removeEldestEntry(Map.Entry<K, V> eldest) {
              return size() > capacite;    // évince le moins récemment utilisé
          }
      }
      ```
      Chaque `get` déplace l'entrée en fin de liste, et l'entrée la plus ancienne est retirée automatiquement. Toutes les opérations sont en O(1).
      Elle n'est pas thread-safe : en concurrence, je l'envelopperais ou, mieux, j'utiliserais **Caffeine**, qui offre éviction par taille, TTL et une politique plus efficace que le LRU pur. Si on me demande de l'écrire sans LinkedHashMap : une HashMap vers des nœuds d'une liste doublement chaînée, avec déplacement en tête à chaque accès.
  - key: scenario-sans-linkedhashmap
    format: scenario
    question: Implémente un cache LRU sans `LinkedHashMap`. Quelle structure choisis-tu ?
    answer: |-
      Une `HashMap<K, Noeud>` pour trouver une entrée en O(1), et une liste doublement chaînée de nœuds pour l'ordre
      d'usage, avec deux sentinelles (tête et queue). À chaque `get`, je détache le nœud et je le remets en tête ; à chaque
      `put`, j'insère en tête et, au-delà de la capacité, je retire le nœud avant la queue et sa clé de la map. Toutes les
      opérations sont en O(1). C'est précisément ce que fait `LinkedHashMap` en interne ; en entretien, je commence par
      dire que je l'utiliserais en vrai.
  - key: scenario-taille-cache
    format: scenario
    question: Comment choisis-tu la capacité d'un cache LRU ?
    answer: |-
      En mesurant : la taille de l'ensemble « chaud » des données (combien de clés reviennent souvent), la mémoire par
      entrée et la mémoire disponible. Je commence avec une estimation, puis j'expose les statistiques du cache (taux de
      succès, nombre d'évictions) dans les métriques, et j'ajuste. Un taux de succès faible avec beaucoup d'évictions dit
      que le cache est trop petit ; un taux élevé sur une petite partie des entrées, qu'il peut être réduit. J'ajoute une
      expiration si les données peuvent changer.
  - key: scenario-lru-vs-ttl
    format: scenario
    question: Ton cache LRU sert parfois des prix périmés. Que changes-tu ?
    answer: |-
      Le LRU borne la taille, pas la fraîcheur : une entrée très lue n'est jamais évincée, même si la donnée a changé en
      base. J'ajoute une expiration (`expireAfterWrite` dans Caffeine) adaptée à la tolérance métier, et, si la
      fraîcheur est critique, une invalidation explicite quand le prix est modifié (événement ou appel direct au cache).
      Je mesure ensuite le taux de succès, qui baisse un peu avec l'expiration, pour vérifier que le cache reste utile.
