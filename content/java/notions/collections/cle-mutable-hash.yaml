notion: cle-mutable-hash
lesson: |-
  Un `HashSet` (ou une `HashMap`) range chaque élément dans une case choisie par son `hashCode` **au moment de
  l'ajout**. Si l'on modifie ensuite un champ utilisé par `hashCode`, l'objet reste dans l'**ancienne** case, alors que
  son hash désigne maintenant une autre case :

  ```java
  Etiquette e = new Etiquette("java");   // equals et hashCode sur nom
  Set<Etiquette> s = new HashSet<>();
  s.add(e);
  e.setNom("go");                        // le hash change

  s.contains(e);    // false : on cherche dans la case de "go", l'objet est dans celle de "java"
  s.remove(e);      // false : impossible de le retirer
  s.add(e);         // true : il est maintenant présent DEUX fois
  ```

  L'ensemble est **corrompu** : un élément introuvable, des doublons possibles. Le problème touche aussi :
  - les **clés** de `HashMap` ;
  - un record qui contient une collection **mutable** (son hash dépend du contenu de la liste) ;
  - une entité dont l'identifiant est affecté **après** l'ajout (au `persist`), si `hashCode` l'utilise.

  Les remèdes :
  - des éléments et des clés **immuables** (records aux composants immuables, `String`, enveloppes) ;
  - un `hashCode` calculé sur des champs qui ne changent jamais (un identifiant fixé à la création) ;
  - à défaut, **retirer** l'objet, le modifier, puis le **rajouter**.

  **Piège classique** : une clé de cache construite à partir d'un objet métier modifiable. Après une mise à jour de
  l'objet, le cache ne retrouve plus rien et grossit sans fin.

  **En entretien** : « Modifier un champ utilisé par `hashCode` d'un objet présent dans un `HashSet` le rend introuvable ;
  éléments et clés doivent être immuables sur ces champs. »
cards:
  - key: cle-hashmap-doit-etre-immutable
    format: course
    question: "Une clé de `HashMap` doit-elle être immuable ?"
    choices:
      - {text: "Ses champs utilisés par `hashCode` et `equals` doivent l'être, sinon l'entrée devient introuvable", correct: true}
      - {text: "Non : la `HashMap` recalcule le hash de ses clés à chaque modification de l'objet", correct: false}
      - {text: "Oui, entièrement : une clé dont un seul champ est modifiable est refusée à la compilation", correct: false}
      - {text: "Non : seule une `TreeMap` exige des clés immuables, pour garder son ordre de tri", correct: false}
    answer: "Ses champs utilisés dans `hashCode` et `equals` doivent l'être : la map ne recalcule jamais le hash, et une clé modifiée reste rangée dans la case de son ancien hash, introuvable."
  - key: mecanisme
    format: course
    question: Pourquoi un objet modifié devient-il introuvable dans un `HashSet` ?
    choices:
      - {text: "Il reste rangé dans la case de son ancien hash, et `contains` cherche dans celle du nouveau", correct: true}
      - {text: "Le `HashSet` le supprime automatiquement dès que son hash change", correct: false}
      - {text: "Le `HashSet` garde une copie de l'objet, que la modification ne touche pas", correct: false}
      - {text: "`contains` compare les références avec `==`, et la modification crée un nouvel objet", correct: false}
    answer: Il est rangé dans la case de son ancien hash ; `contains` calcule le nouveau hash et cherche dans une autre case.
  - key: record-mutable
    format: course
    question: "Un record peut-il être une clé de `HashMap` dangereuse ?"
    choices:
      - {text: "Oui, s'il contient un composant mutable, comme une `ArrayList` dont le contenu change", correct: true}
      - {text: "Non : un record est immuable, donc son hash ne peut jamais changer", correct: false}
      - {text: "Non : le hash d'un record ne dépend que de son type, pas de ses composants", correct: false}
      - {text: "Oui, toujours : un record n'a pas de `hashCode` et hérite de celui d'`Object`", correct: false}
    answer: "Oui, s'il contient un composant mutable (une `ArrayList`) : son hash change quand le contenu change. On copie dans le constructeur compact (`List.copyOf`)."
  - key: remede
    format: course
    question: Comment modifier un objet déjà présent dans un `HashSet` ?
    choices:
      - {text: "Le retirer, le modifier, puis le rajouter ; mieux, rendre immuables les champs du hash", correct: true}
      - {text: "Le modifier, puis appeler `rehash()` sur l'ensemble pour qu'il le reclasse", correct: false}
      - {text: "Le modifier directement : le `HashSet` détecte le changement et le déplace", correct: false}
      - {text: "Le modifier, puis le rajouter avec `add` : l'ancienne entrée est remplacée", correct: false}
    answer: Le retirer, le modifier, puis le rajouter ; mieux, rendre ses champs utilisés par `hashCode` immuables.
  - key: vf-contains
    format: true-false
    question: Après modification d'un champ utilisé par `hashCode`, `contains` retrouve toujours l'objet.
    truth: false
    answer: Il cherche dans la case du nouveau hash.
  - key: vf-doublon
    format: true-false
    question: On peut alors ajouter une seconde fois le même objet dans le `HashSet`.
    truth: true
    answer: L'ensemble ne le voit pas dans la case du nouveau hash, et l'ajoute.
  - key: vf-champ-non-utilise
    format: true-false
    question: Modifier un champ qui n'intervient ni dans `equals` ni dans `hashCode` pose le même problème.
    truth: false
    answer: "Le hash ne change pas : l'objet reste trouvable."
  - key: vf-string
    format: true-false
    question: Les `String` sont des clés sûres.
    truth: true
    answer: Elles sont immuables.
  - key: qcm-sur
    format: multiple-choice
    question: Lesquelles font des clés sûres de `HashMap` ?
    choices:
      - text: "Un `record Id(UUID valeur)`"
        correct: true
      - text: "Une `String`"
        correct: true
      - text: "Une `ArrayList<String>` modifiée après l'ajout"
        correct: false
      - text: "Un objet mutable dont `hashCode` utilise un champ modifiable"
        correct: false
    answer: Une clé ne doit pas changer de hash.
  - key: qcm-symptomes
    format: multiple-choice
    question: Quels symptômes provoque une clé modifiée après son ajout ?
    choices:
      - text: "`get` ou `contains` renvoient `null` ou `false` pour un objet présent"
        correct: true
      - text: "`remove` ne retire rien"
        correct: true
      - text: "Une erreur de compilation"
        correct: false
      - text: "Une `ConcurrentModificationException`"
        correct: false
    answer: "Aucune exception : la structure devient silencieusement incohérente."
  - key: qcm-entite
    format: multiple-choice
    question: "Pourquoi une entité JPA dont `hashCode` utilise l'id généré au `persist` pose-t-elle problème dans un `HashSet` ?"
    choices:
      - {text: "Son hash change au `persist`, après qu'elle a été ajoutée", correct: true}
      - {text: "JPA interdit de ranger des entités dans un `HashSet`", correct: false}
      - {text: "Son id reste `null` après le `persist`, même enregistrée", correct: false}
      - {text: "Aucun : le `HashSet` recalcule le hash au `persist`", correct: false}
    answer: On préfère une clé métier stable ou un identifiant fixé à la création.
  - key: qcm-corriger
    format: multiple-choice
    question: Comment modifier sans risque le nom d'une étiquette présente dans un `HashSet` ?
    choices:
      - text: "La retirer, la modifier, puis la rajouter"
        correct: true
      - text: "La modifier, puis appeler `set.rehash()`"
        correct: false
      - text: "La modifier directement : le set se met à jour"
        correct: false
      - text: "Vider tout l'ensemble"
        correct: false
    answer: Il n'y a pas de `rehash` public ; on remplace l'élément (ou l'on utilise des objets immuables).
  - key: code-introuvable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Etiquette {
          String nom;
          Etiquette(String nom) { this.nom = nom; }
          public boolean equals(Object o) { return o instanceof Etiquette e && e.nom.equals(nom); }
          public int hashCode() { return nom.hashCode(); }
      }
      Set<Etiquette> s = new HashSet<>();
      Etiquette e = new Etiquette("java");
      s.add(e);
      e.nom = "go";
      System.out.println(s.contains(e) + " " + s.size());
      ```
    choices:
      - {text: "`false 1`", correct: true}
      - {text: "`true 1`", correct: false}
      - {text: "`false 0`", correct: false}
      - {text: "`true 2`", correct: false}
    answer: '`false 1` : l''objet est toujours là, mais dans la case de son ancien hash.'
    check:
      output: "false 1"
  - key: code-remove
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Etiquette {
          String nom;
          Etiquette(String nom) { this.nom = nom; }
          public boolean equals(Object o) { return o instanceof Etiquette e && e.nom.equals(nom); }
          public int hashCode() { return nom.hashCode(); }
      }
      Set<Etiquette> s = new HashSet<>();
      Etiquette e = new Etiquette("java");
      s.add(e);
      e.nom = "go";
      System.out.println(s.remove(e) + " " + s.size());
      ```
    choices:
      - {text: "`false 1`", correct: true}
      - {text: "`true 0`", correct: false}
      - {text: "`false 0`", correct: false}
      - {text: "`true 1`", correct: false}
    answer: '`false 1` : impossible de retirer l''objet modifié.'
    check:
      output: "false 1"
  - key: code-doublon
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      class Etiquette {
          String nom;
          Etiquette(String nom) { this.nom = nom; }
          public boolean equals(Object o) { return o instanceof Etiquette e && e.nom.equals(nom); }
          public int hashCode() { return nom.hashCode(); }
      }
      Set<Etiquette> s = new HashSet<>();
      Etiquette e = new Etiquette("java");
      s.add(e);
      e.nom = "go";
      System.out.println(s.add(e) + " " + s.size());
      ```
    choices:
      - {text: "`true 2`", correct: true}
      - {text: "`false 1`", correct: false}
      - {text: "`true 1`", correct: false}
      - {text: "`false 2`", correct: false}
    answer: '`true 2` : le même objet est maintenant présent deux fois.'
    check:
      output: "true 2"
  - key: code-record-liste
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Groupe(List<String> membres) { }
      Set<Groupe> s = new HashSet<>();
      List<String> m = new ArrayList<>(List.of("a"));
      Groupe g = new Groupe(m);
      s.add(g);
      m.add("b");
      System.out.println(s.contains(g));
      ```
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "Une `UnsupportedOperationException`", correct: false}
      - {text: "Une `ConcurrentModificationException`", correct: false}
    answer: "`false` : le hash du record dépend du contenu de la liste, qui a changé. Le record ne copie pas la liste : `m.add` réussit sans erreur."
    check:
      output: "false"
  - key: bug-modification
    format: bug-fix
    question: |-
      Après le renommage d'un produit, il devient introuvable dans l'index. Quelle correction est la bonne ?
      ```java
      Set<Produit> catalogue = new HashSet<>();   // equals et hashCode sur le nom
      produit.renommer("Nouveau nom");
      ```
    choices:
      - {text: "Retirer le produit de l'ensemble, le renommer, puis le rajouter", correct: true}
      - {text: "Renommer le produit, puis appeler `catalogue.add(produit)` pour le mettre à jour", correct: false}
      - {text: "Remplacer le `HashSet` par un `LinkedHashSet`, qui suit les changements de hash", correct: false}
      - {text: "Renommer le produit dans un bloc `synchronized (catalogue)`", correct: false}
    answer: |-
      ```java
      catalogue.remove(produit);
      produit.renommer("Nouveau nom");
      catalogue.add(produit);
      // mieux : equals/hashCode sur un identifiant immuable (la référence produit)
      ```
      Le nom intervient dans `hashCode` : le modifier déplace le hash. On retire et on rajoute, ou l'on fonde l'égalité sur
      un champ qui ne change jamais.
  - key: bug-record-liste
    format: bug-fix
    question: |-
      Une clé de cache composée de critères devient introuvable quand l'appelant réutilise sa liste. Quelle correction est la bonne ?
      ```java
      record CleRecherche(List<String> filtres) { }
      ```
    choices:
      - {text: "Copier la liste avec `List.copyOf` dans le constructeur compact du record", correct: true}
      - {text: "Déclarer le composant `final List<String> filtres` pour figer son contenu", correct: false}
      - {text: "Remplacer le record par une classe, car un record ne peut pas servir de clé", correct: false}
      - {text: "Utiliser une `TreeMap` comme cache, qui ne dépend pas de `hashCode`", correct: false}
    answer: |-
      ```java
      record CleRecherche(List<String> filtres) {
          CleRecherche {
              filtres = List.copyOf(filtres);
          }
      }
      ```
      Le record gardait la liste de l'appelant ; en la modifiant, celui-ci changeait le hash de la clé. Une copie immuable
      fige la clé.
  - key: bug-id-genere
    format: bug-fix
    question: |-
      Une ligne de commande ajoutée à un `HashSet` avant d'être enregistrée n'y est plus retrouvée ensuite. Quelle correction est la bonne ?
      ```java
      @Override public int hashCode() { return Objects.hashCode(id); }   // id généré par la base au persist
      ```
    choices:
      - {text: "Fonder `hashCode` sur un identifiant fixé à la création, comme un `UUID` aléatoire", correct: true}
      - {text: "Renvoyer `System.identityHashCode(this)` tant que l'id est `null`, puis l'id ensuite", correct: false}
      - {text: "Remplacer `Objects.hashCode(id)` par `id.hashCode()`, qui suit mieux les changements", correct: false}
      - {text: "Déclarer le champ `id` en `volatile` pour que le `HashSet` voie sa nouvelle valeur", correct: false}
    answer: |-
      ```java
      private final UUID id = UUID.randomUUID();   // fixé à la création
      @Override public int hashCode() { return id.hashCode(); }
      ```
      Le hash changeait au `persist`, quand l'id passait de `null` à une valeur. Un identifiant attribué à la création ne
      change jamais.
  - key: bug-cle-cache
    format: bug-fix
    question: |-
      Le cache de tarifs grossit sans fin et ne retrouve jamais rien après une mise à jour du client. Quelle correction est la bonne ?
      ```java
      Map<Client, Tarif> cache = new HashMap<>();   // Client mutable, equals/hashCode sur tous ses champs
      ```
    choices:
      - {text: "Prendre pour clé un identifiant immuable du client, comme un `record IdClient`", correct: true}
      - {text: "Remplacer la `HashMap` par une `WeakHashMap`, qui oublie les anciens clients", correct: false}
      - {text: "Calculer `hashCode` sur tous les champs, mais `equals` sur l'identifiant seul", correct: false}
      - {text: "Remplacer la `HashMap` par une `ConcurrentHashMap`, qui suit les clés modifiées", correct: false}
    answer: |-
      ```java
      Map<IdClient, Tarif> cache = new HashMap<>();   // record IdClient(UUID valeur)
      ```
      Chaque modification du client change son hash : l'ancienne entrée est perdue et une nouvelle s'ajoute. Une clé
      immuable (son identifiant) reste stable.
