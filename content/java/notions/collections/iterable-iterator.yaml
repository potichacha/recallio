notion: iterable-iterator
lesson: |-
  La boucle **for-each** fonctionne sur les tableaux et sur tout objet **`Iterable`** : une interface qui fournit un
  **`Iterator`**.

  ```java
  for (String nom : noms) { ... }

  // ce que le compilateur écrit pour une collection :
  Iterator<String> it = noms.iterator();
  while (it.hasNext()) {
      String nom = it.next();
      ...
  }
  ```

  | Méthode | Rôle |
  |---|---|
  | `hasNext()` | reste-t-il un élément ? |
  | `next()` | renvoie l'élément suivant ; `NoSuchElementException` s'il n'y en a plus |
  | `remove()` | supprime le dernier élément renvoyé par `next()` (une seule fois par `next`) |

  - `remove()` est le seul moyen sûr de supprimer **pendant** un parcours (ou `removeIf`, qui l'utilise).
  - Appeler `remove()` sans `next()`, ou deux fois de suite, lève une `IllegalStateException` ; sur une collection
    immuable, une `UnsupportedOperationException`.
  - Implémenter `Iterable<T>` (une méthode `iterator()`) rend une classe utilisable dans un for-each.
  - `Iterable` offre aussi `forEach(action)` (Java 8).

  **Piège classique** : appeler `next()` deux fois dans le même tour de boucle. On saute un élément sur deux, et l'on
  finit par une `NoSuchElementException`.

  **En entretien** : « Le for-each s'appuie sur `Iterable.iterator()` ; `Iterator.remove()` est la seule façon sûre de
  supprimer en parcourant. »
tour:
  - title: Iterable et Iterator
    text: |-
      La boucle for-each marche sur tout `Iterable` : un objet qui fournit un `Iterator`, avec `hasNext()` et `next()`.
      Toutes les collections en sont.

      On se sert de l'`Iterator` directement pour **retirer** des éléments pendant le parcours, avec `it.remove()` : le
      faire avec `liste.remove` dans une for-each lève une `ConcurrentModificationException`. `removeIf` fait la même
      chose en une ligne.
    example:
      files:
        Main.java: |-
          void main() {
              List<Integer> nombres = new ArrayList<>(List.of(1, 2, 3, 4, 5, 6));
              Iterator<Integer> it = nombres.iterator();
              while (it.hasNext()) {
                  if (it.next() % 2 == 0) {
                      it.remove();
                  }
              }
              IO.println(nombres);

              List<Integer> autres = new ArrayList<>(List.of(10, 15, 20));
              autres.removeIf(n -> n > 12);
              IO.println(autres);

              try {
                  for (Integer n : nombres) {
                      nombres.remove(n);
                  }
              } catch (ConcurrentModificationException e) {
                  IO.println("ConcurrentModificationException");
              }
          }
      output: |-
        [1, 3, 5]
        [10]
        ConcurrentModificationException
cards:
  - key: for-each
    format: course
    question: Sur quoi repose la boucle for-each pour une collection ?
    choices:
      - {text: "Sur `Iterable` : le compilateur appelle `iterator()`, puis `hasNext()` et `next()`", correct: true}
      - {text: "Sur `List` : le compilateur appelle `size()`, puis `get(i)` pour chaque indice", correct: false}
      - {text: "Sur `Collection` : le compilateur appelle `toArray()`, puis parcourt le tableau", correct: false}
      - {text: "Sur `Stream` : le compilateur appelle `stream()`, puis `forEach` sur le flux", correct: false}
    answer: "Sur l'interface `Iterable` : le compilateur appelle `iterator()`, puis `hasNext()` et `next()` à chaque tour."
  - key: methodes
    format: course
    question: Quelles sont les méthodes d'un `Iterator` ?
    choices:
      - {text: "`hasNext()`, `next()`, `remove()` (facultative) et `forEachRemaining`", correct: true}
      - {text: "`hasNext()`, `next()`, `previous()` et `add()`", correct: false}
      - {text: "`first()`, `next()`, `last()` et `remove()`", correct: false}
      - {text: "`hasNext()`, `next()`, `reset()` et `size()`", correct: false}
    answer: "`hasNext()`, `next()` et `remove()` (facultative), plus `forEachRemaining` depuis Java 8. `previous()` et `add()` appartiennent à `ListIterator`."
  - key: rendre-iterable
    format: course
    question: Comment rendre une classe utilisable dans un for-each ?
    choices:
      - {text: "En implémentant `Iterable<T>`, donc une méthode `iterator()`", correct: true}
      - {text: "En implémentant `Iterator<T>`, donc `hasNext()` et `next()`", correct: false}
      - {text: "En étendant `ArrayList<T>`, seule classe que le for-each accepte", correct: false}
      - {text: "En implémentant `Collection<T>` et toutes ses méthodes", correct: false}
    answer: "En implémentant `Iterable<T>`, c'est-à-dire une méthode `iterator()` qui renvoie un `Iterator<T>`. Une classe qui est elle-même un `Iterator` ne passe pas dans un for-each."
  - key: remove-regles
    format: course
    question: Quand `Iterator.remove()` lève-t-il une exception ?
    choices:
      - {text: "Avant tout `next()` ou deux fois de suite, et sur une collection qui refuse la suppression", correct: true}
      - {text: "Seulement quand la collection est vide, avec une `NoSuchElementException`", correct: false}
      - {text: "Jamais : `remove()` supprime toujours le dernier élément de la collection", correct: false}
      - {text: "À chaque appel sur une `ArrayList`, qui ne supporte que `removeIf`", correct: false}
    answer: Avant tout appel à `next()` ou deux fois de suite (`IllegalStateException`), et sur une collection qui ne supporte pas la suppression (`UnsupportedOperationException`).
  - key: vf-tableau
    format: true-false
    question: La boucle for-each fonctionne sur un tableau.
    truth: true
    answer: Le compilateur la traduit alors en boucle sur les indices.
  - key: vf-next-fin
    format: true-false
    question: "Appeler `next()` quand `hasNext()` vaut `false` renvoie `null`."
    truth: false
    answer: Il lève une `NoSuchElementException`.
  - key: vf-remove-sur
    format: true-false
    question: "`Iterator.remove()` permet de supprimer pendant le parcours sans `ConcurrentModificationException`."
    truth: true
    answer: C'est l'itérateur lui-même qui fait la modification.
  - key: vf-deux-remove
    format: true-false
    question: Après un `next()`, on peut appeler deux fois `remove()`.
    truth: false
    answer: Un seul `remove()` par `next()` ; le second lève une `IllegalStateException`.
  - key: qcm-supprimer
    format: multiple-choice
    question: "Laquelle de ces écritures supprime correctement les éléments pairs d'une liste ?"
    choices:
      - {text: "`liste.removeIf(n -> n % 2 == 0)`", correct: true}
      - {text: "Un for-each et `liste.remove(n)`", correct: false}
      - {text: "`liste.forEach(n -> { if (n % 2 == 0) liste.remove(n); })`", correct: false}
      - {text: "`liste.stream().filter(n -> n % 2 == 0).toList()`", correct: false}
    answer: "`removeIf` (ou un `Iterator` explicite et `it.remove()`) supprime sans casser le parcours. Le for-each et `forEach` modifient la liste sans passer par l'itérateur, et le flux ne modifie pas la liste."
  - key: qcm-iterable
    format: multiple-choice
    question: "Que doit implémenter une classe `Intervalle` pour écrire `for (int i : intervalle)` ?"
    choices:
      - text: "`Iterable<Integer>`"
        correct: true
      - text: "`Iterator<Integer>`"
        correct: false
      - text: "`Collection<Integer>`, obligatoirement"
        correct: false
      - text: "`Comparable<Intervalle>`"
        correct: false
    answer: '`Iterable` suffit : une seule méthode, `iterator()`.'
  - key: qcm-next-deux-fois
    format: multiple-choice
    question: Que provoque un double appel à `next()` dans chaque tour de boucle ?
    choices:
      - {text: "Un élément sur deux est sauté, puis une `NoSuchElementException` peut survenir", correct: true}
      - {text: "Rien de spécial : le second `next()` renvoie le même élément que le premier", correct: false}
      - {text: "Une erreur de compilation : `next()` ne s'appelle qu'une fois par tour", correct: false}
      - {text: "Une boucle infinie, car `hasNext()` ne voit plus avancer l'itérateur", correct: false}
    answer: Chaque `next()` avance l'itérateur.
  - key: qcm-immuable
    format: multiple-choice
    question: "Que fait `it.remove()` sur l'itérateur de `List.of(\"a\")` après `it.next()` ?"
    choices:
      - text: "Une `UnsupportedOperationException`"
        correct: true
      - text: "Il supprime l'élément"
        correct: false
      - text: "Une `ConcurrentModificationException`"
        correct: false
      - text: "Rien"
        correct: false
    answer: La liste est immuable.
  - key: trous-has-next
    format: fill-in
    question: |-
      Complète la boucle explicite :
      ```java
      Iterator<String> it = noms.iterator();
      while (it.___()) {
          traiter(it.next());
      }
      ```
    blanks: [[hasNext]]
    answer: '`hasNext()` dit s''il reste un élément.'
  - key: trous-next
    format: fill-in
    question: |-
      Complète pour lire l'élément suivant :
      ```java
      while (it.hasNext()) {
          String nom = it.___();
      }
      ```
    blanks: [[next]]
    answer: '`next()` renvoie l''élément et avance l''itérateur.'
  - key: trous-remove
    format: fill-in
    question: |-
      Complète pour supprimer les noms vides pendant le parcours :
      ```java
      while (it.hasNext()) {
          if (it.next().isBlank()) {
              it.___();
          }
      }
      ```
    blanks: [[remove]]
    answer: '`remove()` supprime le dernier élément renvoyé par `next()`.'
  - key: trous-iterable
    format: fill-in
    question: |-
      Complète pour que l'on puisse parcourir un `Panier` avec un for-each :
      ```java
      class Panier implements ___<Article> {
          public Iterator<Article> iterator() { return articles.iterator(); }
      }
      ```
    blanks: [[Iterable]]
    answer: Une seule méthode à fournir, `iterator()`.
  - key: code-remove
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = new ArrayList<>(List.of(1, 2, 3, 4));
      Iterator<Integer> it = l.iterator();
      while (it.hasNext()) {
          if (it.next() % 2 == 0) it.remove();
      }
      System.out.println(l);
      ```
    choices:
      - {text: "`[1, 3]`", correct: true}
      - {text: "`[2, 4]`", correct: false}
      - {text: "Une `ConcurrentModificationException`", correct: false}
      - {text: "`[1, 2, 3, 4]`", correct: false}
    answer: '`[1, 3]` : la suppression passe par l''itérateur.'
    check:
      output: "[1, 3]"
  - key: code-no-such-element
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Iterator<String> it = List.of("a").iterator();
      it.next();
      it.next();
      ```
    choices:
      - {text: "Une `NoSuchElementException`", correct: true}
      - {text: "Rien : le second `next()` renvoie `null`", correct: false}
      - {text: "Rien : le second `next()` renvoie encore `a`", correct: false}
      - {text: "Une `IndexOutOfBoundsException`", correct: false}
    answer: "Une `NoSuchElementException` : il n'y a qu'un élément."
    check:
      throws: NoSuchElementException
  - key: code-iterable-maison
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record Intervalle(int debut, int fin) implements Iterable<Integer> {
          public Iterator<Integer> iterator() {
              return new Iterator<>() {
                  int i = debut;
                  public boolean hasNext() { return i < fin; }
                  public Integer next() { return i++; }
              };
          }
      }
      for (int i : new Intervalle(2, 5)) {
          System.out.print(i);
      }
      ```
    choices:
      - {text: "`234`", correct: true}
      - {text: "`2345`", correct: false}
      - {text: "`345`", correct: false}
      - {text: "Ça ne compile pas : un record ne peut pas implémenter `Iterable`", correct: false}
    answer: '`234` : le record implémente `Iterable`, et le for-each l''accepte.'
    check:
      output: "234"
  - key: code-double-remove
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Iterator<String> it = new ArrayList<>(List.of("a", "b")).iterator();
      it.next();
      it.remove();
      it.remove();
      ```
    choices:
      - {text: "Une `IllegalStateException`", correct: true}
      - {text: "Rien : les deux éléments sont supprimés", correct: false}
      - {text: "Une `NoSuchElementException`", correct: false}
      - {text: "Une `ConcurrentModificationException`", correct: false}
    answer: "Une `IllegalStateException` : un seul `remove()` par `next()`."
    check:
      throws: IllegalStateException
  - key: bug-next-double
    format: bug-fix
    question: |-
      Ce code n'affiche qu'un nom sur deux et finit par une `NoSuchElementException`. Quelle correction est la bonne ?
      ```java
      while (it.hasNext()) {
          if (!it.next().isBlank()) {
              System.out.println(it.next());
          }
      }
      ```
    choices:
      - {text: "Lire `it.next()` une seule fois par tour, dans une variable", correct: true}
      - {text: "Ajouter un second test `it.hasNext()` juste avant le `println`", correct: false}
      - {text: "Remplacer le second `it.next()` par `it.previous()`", correct: false}
      - {text: "Remplacer `while (it.hasNext())` par `for (;;)` avec un `break`", correct: false}
    answer: |-
      ```java
      while (it.hasNext()) {
          String nom = it.next();
          if (!nom.isBlank()) {
              System.out.println(nom);
          }
      }
      ```
      Chaque `next()` avance l'itérateur : on lit l'élément une fois et on le range dans une variable.
  - key: bug-remove-avant-next
    format: bug-fix
    question: |-
      Ce code lève une `IllegalStateException`. Quelle correction est la bonne ?
      ```java
      Iterator<Tache> it = taches.iterator();
      while (it.hasNext()) {
          it.remove();
          archiver(it.next());
      }
      ```
    choices:
      - {text: "Appeler `it.next()` avant `it.remove()` : lire d'abord, supprimer ensuite", correct: true}
      - {text: "Remplacer `it.remove()` par `taches.remove(0)`, qui ne dépend pas de l'itérateur", correct: false}
      - {text: "Ajouter un test `if (it.hasNext())` juste avant l'appel à `it.remove()`", correct: false}
      - {text: "Créer l'itérateur avec `taches.listIterator()`, qui permet `remove()` d'emblée", correct: false}
    answer: |-
      ```java
      Iterator<Tache> it = taches.iterator();
      while (it.hasNext()) {
          archiver(it.next());
          it.remove();
      }
      ```
      `remove()` supprime le dernier élément renvoyé par `next()` : il faut d'abord l'avoir lu.
  - key: bug-immuable
    format: bug-fix
    question: |-
      Ce nettoyage lève une `UnsupportedOperationException`. Quelle correction est la bonne ?
      ```java
      List<String> lignes = List.of("a", "", "b");
      lignes.removeIf(String::isBlank);
      ```
    choices:
      - {text: "Travailler sur une copie modifiable, `new ArrayList<>(List.of(...))`, ou filtrer par un flux", correct: true}
      - {text: "Remplacer `removeIf` par une boucle sur un `Iterator` explicite et `it.remove()`", correct: false}
      - {text: "Remplacer `String::isBlank` par la lambda `s -> s.isBlank()`, que `List.of` accepte", correct: false}
      - {text: "Déclarer `lignes` avec `var`, pour que le compilateur choisisse une liste modifiable", correct: false}
    answer: |-
      ```java
      List<String> lignes = new ArrayList<>(List.of("a", "", "b"));
      lignes.removeIf(String::isBlank);
      // ou, sans modifier : List<String> utiles = lignes.stream().filter(l -> !l.isBlank()).toList();
      ```
      `List.of` est immuable : son itérateur refuse `remove`. On travaille sur une copie modifiable, ou l'on produit une
      nouvelle liste filtrée.
  - key: bug-iterable-copie
    format: bug-fix
    question: |-
      Pour permettre le for-each, cette classe expose sa liste interne, qu'un appelant a vidée. Quelle correction est la bonne ?
      ```java
      class Panier {
          private final List<Article> articles = new ArrayList<>();
          public List<Article> articles() { return articles; }
      }
      // for (Article a : panier.articles()) ...
      ```
    choices:
      - {text: "Implémenter `Iterable<Article>`, avec l'itérateur d'une vue non modifiable", correct: true}
      - {text: "Faire hériter `Panier` d'`ArrayList<Article>` pour itérer directement dessus", correct: false}
      - {text: "Rendre la méthode `articles()` `synchronized`, pour protéger la liste renvoyée", correct: false}
      - {text: "Faire renvoyer `articles.iterator()` par `articles()`, à la place de la liste", correct: false}
    answer: |-
      ```java
      class Panier implements Iterable<Article> {
          private final List<Article> articles = new ArrayList<>();
          @Override
          public Iterator<Article> iterator() {
              return Collections.unmodifiableList(articles).iterator();
          }
      }
      // for (Article a : panier) ...
      ```
      Implémenter `Iterable` permet le for-each sans exposer la liste, et l'itérateur d'une vue non modifiable refuse
      `remove`.
