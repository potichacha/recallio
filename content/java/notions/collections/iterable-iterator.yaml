notion: iterable-iterator
lesson: |-
  La boucle **for-each** fonctionne sur les tableaux et sur tout objet **`Iterable`** : une interface qui fournit un
  **`Iterator`**.

  ```java
  for (String nom : noms) { ... }

  // ce que le compilateur écrit pour une collection :
  Iterator<String> it = noms.iterator();
  while (it.hasNext()) {
      String nom = it.next();
      ...
  }
  ```

  | Méthode | Rôle |
  |---|---|
  | `hasNext()` | reste-t-il un élément ? |
  | `next()` | renvoie l'élément suivant ; `NoSuchElementException` s'il n'y en a plus |
  | `remove()` | supprime le dernier élément renvoyé par `next()` (une seule fois par `next`) |

  - `remove()` est le seul moyen sûr de supprimer **pendant** un parcours (ou `removeIf`, qui l'utilise).
  - Appeler `remove()` sans `next()`, ou deux fois de suite, lève une `IllegalStateException` ; sur une collection
    immuable, une `UnsupportedOperationException`.
  - Implémenter `Iterable<T>` (une méthode `iterator()`) rend une classe utilisable dans un for-each.
  - `Iterable` offre aussi `forEach(action)` (Java 8).

  **Piège classique** : appeler `next()` deux fois dans le même tour de boucle. On saute un élément sur deux, et l'on
  finit par une `NoSuchElementException`.

  **En entretien** : « Le for-each s'appuie sur `Iterable.iterator()` ; `Iterator.remove()` est la seule façon sûre de
  supprimer en parcourant. »
tour:
  - title: Iterable et Iterator
    text: |-
      La boucle for-each marche sur tout `Iterable` : un objet qui fournit un `Iterator`, avec `hasNext()` et `next()`.
      Toutes les collections en sont.

      On se sert de l'`Iterator` directement pour **retirer** des éléments pendant le parcours, avec `it.remove()` : le
      faire avec `liste.remove` dans une for-each lève une `ConcurrentModificationException`. `removeIf` fait la même
      chose en une ligne.
    example:
      files:
        Main.java: |-
          void main() {
              List<Integer> nombres = new ArrayList<>(List.of(1, 2, 3, 4, 5, 6));
              Iterator<Integer> it = nombres.iterator();
              while (it.hasNext()) {
                  if (it.next() % 2 == 0) {
                      it.remove();
                  }
              }
              IO.println(nombres);

              List<Integer> autres = new ArrayList<>(List.of(10, 15, 20));
              autres.removeIf(n -> n > 12);
              IO.println(autres);

              try {
                  for (Integer n : nombres) {
                      nombres.remove(n);
                  }
              } catch (ConcurrentModificationException e) {
                  IO.println("ConcurrentModificationException");
              }
          }
      output: |-
        [1, 3, 5]
        [10]
        ConcurrentModificationException
cards:
  - key: for-each
    format: course
    question: Sur quoi repose la boucle for-each pour une collection ?
    answer: "Sur l'interface `Iterable` : le compilateur appelle `iterator()`, puis `hasNext()` et `next()` à chaque tour."
  - key: methodes
    format: course
    question: Quelles sont les méthodes d'un `Iterator` ?
    answer: '`hasNext()`, `next()` et `remove()` (facultative), plus `forEachRemaining` depuis Java 8.'
  - key: rendre-iterable
    format: course
    question: Comment rendre une classe utilisable dans un for-each ?
    answer: En implémentant `Iterable<T>`, c'est-à-dire une méthode `iterator()` qui renvoie un `Iterator<T>`.
  - key: remove-regles
    format: course
    question: Quand `Iterator.remove()` lève-t-il une exception ?
    answer: Avant tout appel à `next()` ou deux fois de suite (`IllegalStateException`), et sur une collection qui ne supporte pas la suppression (`UnsupportedOperationException`).
  - key: vf-tableau
    format: true-false
    question: La boucle for-each fonctionne sur un tableau.
    truth: true
    answer: Le compilateur la traduit alors en boucle sur les indices.
  - key: vf-next-fin
    format: true-false
    question: "Appeler `next()` quand `hasNext()` vaut `false` renvoie `null`."
    truth: false
    answer: Il lève une `NoSuchElementException`.
  - key: vf-remove-sur
    format: true-false
    question: "`Iterator.remove()` permet de supprimer pendant le parcours sans `ConcurrentModificationException`."
    truth: true
    answer: C'est l'itérateur lui-même qui fait la modification.
  - key: vf-deux-remove
    format: true-false
    question: Après un `next()`, on peut appeler deux fois `remove()`.
    truth: false
    answer: Un seul `remove()` par `next()` ; le second lève une `IllegalStateException`.
  - key: qcm-supprimer
    format: multiple-choice
    question: Comment supprimer les éléments pairs d'une liste en la parcourant ?
    choices:
      - text: "Avec un `Iterator` et `it.remove()`"
        correct: true
      - text: "Avec `liste.removeIf(n -> n % 2 == 0)`"
        correct: true
      - text: "Avec un for-each et `liste.remove(n)`"
        correct: false
      - text: "Avec `liste.forEach(n -> liste.remove(n))`"
        correct: false
    answer: Les deux dernières modifient la liste sans passer par l'itérateur.
  - key: qcm-iterable
    format: multiple-choice
    question: "Que doit implémenter une classe `Intervalle` pour écrire `for (int i : intervalle)` ?"
    choices:
      - text: "`Iterable<Integer>`"
        correct: true
      - text: "`Iterator<Integer>`"
        correct: false
      - text: "`Collection<Integer>`, obligatoirement"
        correct: false
      - text: "`Comparable<Intervalle>`"
        correct: false
    answer: '`Iterable` suffit : une seule méthode, `iterator()`.'
  - key: qcm-next-deux-fois
    format: multiple-choice
    question: Que provoque un double appel à `next()` dans chaque tour de boucle ?
    choices:
      - text: "Un élément sur deux est sauté, puis une `NoSuchElementException` peut survenir"
        correct: true
      - text: "Rien, `next` renvoie le même élément"
        correct: false
      - text: "Une erreur de compilation"
        correct: false
      - text: "Une boucle infinie"
        correct: false
    answer: Chaque `next()` avance l'itérateur.
  - key: qcm-immuable
    format: multiple-choice
    question: "Que fait `it.remove()` sur l'itérateur de `List.of(\"a\")` après `it.next()` ?"
    choices:
      - text: "Une `UnsupportedOperationException`"
        correct: true
      - text: "Il supprime l'élément"
        correct: false
      - text: "Une `ConcurrentModificationException`"
        correct: false
      - text: "Rien"
        correct: false
    answer: La liste est immuable.
  - key: trous-has-next
    format: fill-in
    question: |-
      Complétez la boucle explicite :
      ```java
      Iterator<String> it = noms.iterator();
      while (it.___()) {
          traiter(it.next());
      }
      ```
    blanks: [[hasNext]]
    answer: '`hasNext()` dit s''il reste un élément.'
  - key: trous-next
    format: fill-in
    question: |-
      Complétez pour lire l'élément suivant :
      ```java
      while (it.hasNext()) {
          String nom = it.___();
      }
      ```
    blanks: [[next]]
    answer: '`next()` renvoie l''élément et avance l''itérateur.'
  - key: trous-remove
    format: fill-in
    question: |-
      Complétez pour supprimer les noms vides pendant le parcours :
      ```java
      while (it.hasNext()) {
          if (it.next().isBlank()) {
              it.___();
          }
      }
      ```
    blanks: [[remove]]
    answer: '`remove()` supprime le dernier élément renvoyé par `next()`.'
  - key: trous-iterable
    format: fill-in
    question: |-
      Complétez pour que l'on puisse parcourir un `Panier` avec un for-each :
      ```java
      class Panier implements ___<Article> {
          public Iterator<Article> iterator() { return articles.iterator(); }
      }
      ```
    blanks: [[Iterable]]
    answer: Une seule méthode à fournir, `iterator()`.
  - key: code-remove
    format: code-output
    question: |-
      ```java
      List<Integer> l = new ArrayList<>(List.of(1, 2, 3, 4));
      Iterator<Integer> it = l.iterator();
      while (it.hasNext()) {
          if (it.next() % 2 == 0) it.remove();
      }
      System.out.println(l);
      ```
    answer: '`[1, 3]` : la suppression passe par l''itérateur.'
    check:
      output: "[1, 3]"
  - key: code-no-such-element
    format: code-output
    question: |-
      ```java
      Iterator<String> it = List.of("a").iterator();
      it.next();
      it.next();
      ```
    answer: "Une `NoSuchElementException` : il n'y a qu'un élément."
    check:
      throws: NoSuchElementException
  - key: code-iterable-maison
    format: code-output
    question: |-
      ```java
      record Intervalle(int debut, int fin) implements Iterable<Integer> {
          public Iterator<Integer> iterator() {
              return new Iterator<>() {
                  int i = debut;
                  public boolean hasNext() { return i < fin; }
                  public Integer next() { return i++; }
              };
          }
      }
      for (int i : new Intervalle(2, 5)) {
          System.out.print(i);
      }
      ```
    answer: '`234` : le record implémente `Iterable`, et le for-each l''accepte.'
    check:
      output: "234"
  - key: code-double-remove
    format: code-output
    question: |-
      ```java
      Iterator<String> it = new ArrayList<>(List.of("a", "b")).iterator();
      it.next();
      it.remove();
      it.remove();
      ```
    answer: "Une `IllegalStateException` : un seul `remove()` par `next()`."
    check:
      throws: IllegalStateException
  - key: bug-next-double
    format: bug-fix
    question: |-
      Ce code n'affiche qu'un nom sur deux et finit par une `NoSuchElementException` :
      ```java
      while (it.hasNext()) {
          if (!it.next().isBlank()) {
              System.out.println(it.next());
          }
      }
      ```
    answer: |-
      ```java
      while (it.hasNext()) {
          String nom = it.next();
          if (!nom.isBlank()) {
              System.out.println(nom);
          }
      }
      ```
      Chaque `next()` avance l'itérateur : on lit l'élément une fois et on le range dans une variable.
  - key: bug-remove-avant-next
    format: bug-fix
    question: |-
      Ce code lève une `IllegalStateException` :
      ```java
      Iterator<Tache> it = taches.iterator();
      while (it.hasNext()) {
          it.remove();
          archiver(it.next());
      }
      ```
    answer: |-
      ```java
      Iterator<Tache> it = taches.iterator();
      while (it.hasNext()) {
          archiver(it.next());
          it.remove();
      }
      ```
      `remove()` supprime le dernier élément renvoyé par `next()` : il faut d'abord l'avoir lu.
  - key: bug-immuable
    format: bug-fix
    question: |-
      Ce nettoyage lève une `UnsupportedOperationException` :
      ```java
      List<String> lignes = List.of("a", "", "b");
      lignes.removeIf(String::isBlank);
      ```
    answer: |-
      ```java
      List<String> lignes = new ArrayList<>(List.of("a", "", "b"));
      lignes.removeIf(String::isBlank);
      // ou, sans modifier : List<String> utiles = lignes.stream().filter(l -> !l.isBlank()).toList();
      ```
      `List.of` est immuable : son itérateur refuse `remove`. On travaille sur une copie modifiable, ou l'on produit une
      nouvelle liste filtrée.
  - key: bug-iterable-copie
    format: bug-fix
    question: |-
      Pour permettre le for-each, cette classe expose sa liste interne, qu'un appelant a vidée :
      ```java
      class Panier {
          private final List<Article> articles = new ArrayList<>();
          public List<Article> articles() { return articles; }
      }
      // for (Article a : panier.articles()) ...
      ```
    answer: |-
      ```java
      class Panier implements Iterable<Article> {
          private final List<Article> articles = new ArrayList<>();
          @Override
          public Iterator<Article> iterator() {
              return Collections.unmodifiableList(articles).iterator();
          }
      }
      // for (Article a : panier) ...
      ```
      Implémenter `Iterable` permet le for-each sans exposer la liste, et l'itérateur d'une vue non modifiable refuse
      `remove`.
