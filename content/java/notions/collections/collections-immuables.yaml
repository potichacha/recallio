notion: collections-immuables
cards:
  - key: list-of-accepte-null
    format: course
    question: '`List.of` accepte-t-il null ?'
    answer: Non, NullPointerException.
  - key: unmodifiablelist-vs-list-copyof
    format: course
    question: unmodifiableList vs List.copyOf ?
    answer: Vue en lecture seule qui reflète l'original vs copie immuable indépendante.
  - key: code-map-of-1-2
    format: code-output
    question: '`Map.of("a", 1, "a", 2);`'
    answer: IllegalArgumentException (clé dupliquée). Et `List.of(1, null)` lève une NullPointerException.
