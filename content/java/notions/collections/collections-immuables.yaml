notion: collections-immuables
lesson: |-
  Trois façons d'obtenir une collection qu'on ne peut pas modifier :

  | Écriture | Ce qu'on obtient |
  |---|---|
  | `List.of(...)`, `Set.of(...)`, `Map.of(...)` (Java 9) | une collection **immuable**, créée à partir de valeurs |
  | `List.copyOf(c)`, `Set.copyOf(c)`, `Map.copyOf(m)` (Java 10) | une **copie** immuable, indépendante de `c` |
  | `Collections.unmodifiableList(c)` | une **vue** en lecture seule qui **reflète** les changements de `c` |

  ```java
  List<String> couleurs = List.of("rouge", "vert");
  couleurs.add("bleu");               // UnsupportedOperationException

  Map<String, Integer> stock = Map.of("pomme", 3, "poire", 5);   // jusqu'à 10 couples
  Map<String, Integer> grand = Map.ofEntries(Map.entry("pomme", 3), Map.entry("poire", 5));
  ```

  Particularités des fabriques `of` et `copyOf` :
  - elles **refusent `null`** (éléments, clés, valeurs) : `NullPointerException`, même pour `contains(null)` sur une
    `List.of` ;
  - `Set.of` et `Map.of` refusent les **doublons** : `IllegalArgumentException` ;
  - l'ordre d'itération de `Set.of` et `Map.of` n'est **pas spécifié**, et peut changer d'une exécution à l'autre ;
  - `copyOf` d'une collection déjà immuable peut renvoyer la même instance.

  Les streams en produisent aussi : `stream.toList()` (Java 16) et `Collectors.toUnmodifiableList()`.

  Une collection immuable se **partage** sans copie défensive et sans synchronisation. Mais ses **éléments** peuvent
  être mutables : `List.of(new StringBuilder())` reste modifiable par ses éléments.

  **Piège classique** : croire que `Collections.unmodifiableList(liste)` est une copie. Si quelqu'un modifie `liste`, la
  « liste immuable » change aussi.

  **En entretien** : « `List.of` et `copyOf` donnent des collections immuables qui refusent `null` ; `unmodifiableList`
  n'est qu'une vue. »
cards:
  - key: list-of-accepte-null
    format: course
    question: '`List.of` accepte-t-il null ?'
    answer: Non, NullPointerException.
  - key: unmodifiablelist-vs-list-copyof
    format: course
    question: unmodifiableList vs List.copyOf ?
    answer: Vue en lecture seule qui reflète l'original vs copie immuable indépendante.
  - key: ordre-set-of
    format: course
    question: Dans quel ordre itère-t-on sur un `Set.of(...)` ?
    answer: Dans un ordre non spécifié, qui peut changer d'une exécution de la JVM à l'autre ; pour un ordre stable, `LinkedHashSet` ou un `TreeSet`.
  - key: elements-mutables
    format: course
    question: Une `List.of(...)` est-elle complètement immuable ?
    answer: La liste l'est (pas d'ajout, de suppression ni de remplacement), mais ses éléments peuvent être mutables ; elle n'est profondément immuable que si ses éléments le sont.
  - key: vf-add
    format: true-false
    question: "`List.of(\"a\").add(\"b\")` lève une `UnsupportedOperationException`."
    truth: true
    answer: La liste est immuable.
  - key: vf-vue
    format: true-false
    question: "`Collections.unmodifiableList(liste)` reste identique si `liste` est modifiée ensuite."
    truth: false
    answer: "C'est une vue : elle reflète les changements de l'original."
  - key: vf-doublons
    format: true-false
    question: "`Set.of(\"a\", \"a\")` crée un ensemble d'un élément."
    truth: false
    answer: Il lève une `IllegalArgumentException` (doublon).
  - key: vf-to-list
    format: true-false
    question: "Le résultat de `stream.toList()` (Java 16) est modifiable."
    truth: false
    answer: Il est non modifiable, contrairement à `Collectors.toList()` qui ne garantit rien.
  - key: qcm-copie
    format: multiple-choice
    question: Comment obtenir une copie immuable et indépendante d'une liste ?
    choices:
      - text: "`List.copyOf(liste)`"
        correct: true
      - text: "`liste.stream().toList()`"
        correct: true
      - text: "`Collections.unmodifiableList(liste)`"
        correct: false
      - text: "`new ArrayList<>(liste)`"
        correct: false
    answer: La vue suit l'original ; la copie `ArrayList` est modifiable.
  - key: qcm-null
    format: multiple-choice
    question: Lesquelles lèvent une `NullPointerException` ?
    choices:
      - text: "`List.of(1, null)`"
        correct: true
      - text: "`List.of(1, 2).contains(null)`"
        correct: true
      - text: "`Map.of(\"a\", null)`"
        correct: true
      - text: "`Arrays.asList(1, null)`"
        correct: false
    answer: '`Arrays.asList` accepte `null`.'
  - key: qcm-grande-map
    format: multiple-choice
    question: Comment créer une `Map` immuable de quinze couples ?
    choices:
      - text: "`Map.ofEntries(Map.entry(k1, v1), ...)`"
        correct: true
      - text: "`Map.copyOf(mapModifiable)`"
        correct: true
      - text: "`Map.of(k1, v1, ..., k15, v15)`"
        correct: false
      - text: "`new HashMap<>(...)`"
        correct: false
    answer: '`Map.of` s''arrête à dix couples.'
  - key: qcm-partage
    format: multiple-choice
    question: Quel est l'avantage d'une collection immuable ?
    choices:
      - text: "Elle se partage sans copie défensive ni synchronisation"
        correct: true
      - text: "Elle est toujours plus rapide qu'une `ArrayList`"
        correct: false
      - text: "Elle accepte `null`"
        correct: false
      - text: "Elle trie ses éléments"
        correct: false
    answer: Personne ne peut la modifier.
  - key: code-map-of-1-2
    format: code-output
    question: '`Map.of("a", 1, "a", 2);`'
    answer: IllegalArgumentException (clé dupliquée). Et `List.of(1, null)` lève une NullPointerException.
    check:
      code: |-
        Map.of("a", 1, "a", 2);
      throws: IllegalArgumentException
  - key: code-null
    format: code-output
    question: |-
      ```java
      List<Integer> l = List.of(1, null);
      ```
    answer: "Une `NullPointerException` : les fabriques `of` refusent `null`."
    check:
      throws: NullPointerException
  - key: code-add
    format: code-output
    question: |-
      ```java
      List<String> l = List.of("a");
      l.add("b");
      ```
    answer: "Une `UnsupportedOperationException` : la liste est immuable."
    check:
      throws: UnsupportedOperationException
  - key: code-vue-copie
    format: code-output
    question: |-
      ```java
      Set<String> base = new HashSet<>(Set.of("a"));
      Set<String> vue = Collections.unmodifiableSet(base);
      Set<String> copie = Set.copyOf(base);
      base.add("b");
      System.out.println(vue.size() + " " + copie.size());
      ```
    answer: '`2 1` : la vue suit l''ensemble d''origine, la copie non.'
    check:
      output: "2 1"
  - key: bug-contains-null
    format: bug-fix
    question: |-
      Ce test lève une `NullPointerException` quand le pays n'est pas renseigné :
      ```java
      private static final List<String> PAYS_UE = List.of("FR", "DE", "IT");
      boolean dansUe(String pays) { return PAYS_UE.contains(pays); }
      ```
    answer: |-
      ```java
      boolean dansUe(String pays) { return pays != null && PAYS_UE.contains(pays); }
      // mieux : un Set.of, et une enum Pays plutôt que des chaînes
      ```
      `List.of(...).contains(null)` lève une `NullPointerException`. On traite l'absence avant l'appel.
  - key: bug-ordre-set-of
    format: bug-fix
    question: |-
      Le test qui compare la sortie JSON échoue une fois sur deux :
      ```java
      Set<String> roles = Set.of("ADMIN", "EDITEUR", "LECTEUR");
      return String.join(",", roles);
      ```
    answer: |-
      ```java
      List<String> roles = List.of("ADMIN", "EDITEUR", "LECTEUR");   // ou new TreeSet<>(Set.of(...))
      return String.join(",", roles);
      ```
      L'ordre d'itération de `Set.of` n'est pas spécifié et change d'une exécution à l'autre. Pour une sortie stable, une
      liste ou un ensemble trié.
  - key: bug-vue-exposee
    format: bug-fix
    question: |-
      La liste « immuable » des règles change après la construction de la politique :
      ```java
      Politique(List<Regle> regles) {
          this.regles = Collections.unmodifiableList(regles);
      }
      ```
    answer: |-
      ```java
      Politique(List<Regle> regles) {
          this.regles = List.copyOf(regles);
      }
      ```
      La vue non modifiable reflète la liste de l'appelant, qui peut encore la modifier. `List.copyOf` crée une copie
      indépendante.
  - key: bug-of-null
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` pour un client sans téléphone :
      ```java
      List<String> contacts = List.of(client.email(), client.telephone());
      ```
    answer: |-
      ```java
      List<String> contacts = Stream.of(client.email(), client.telephone())
              .filter(Objects::nonNull)
              .toList();
      ```
      `List.of` refuse `null`. On filtre les valeurs absentes avant de construire la liste.
