notion: hashmap-interne
lesson: |-
  Une `HashMap` est un **tableau de cases** (*buckets*). Pour ranger une clé :

  1. elle calcule `hashCode()`, puis le « mélange » (`h ^ (h >>> 16)`) pour mieux répartir les bits ;
  2. elle choisit la case avec `hash & (n - 1)`, où `n`, la capacité, est une **puissance de 2** (un ET binaire au lieu
     d'un modulo) ;
  3. dans la case, elle compare les clés : d'abord le hash stocké, puis `equals`.

  ```
  capacité 16 : [0] [1] → "Aa" → "BB"   (même hash : collision, chaînage)   [2] ... [15]
  ```

  - Plusieurs clés dans une même case forment une **liste chaînée** (une collision). Depuis Java 8, une case qui
    dépasse **8** éléments devient un **arbre rouge-noir** (si la table compte au moins 64 cases ; sinon la table est
    agrandie) : le pire cas passe de O(n) à O(log n). En dessous de 6, elle redevient une liste.
  - Capacité initiale **16**, **facteur de charge 0,75** : au-delà de 12 éléments, la table **double** et toutes les
    entrées sont redistribuées (*rehash*).
  - Les performances dépendent donc de la **qualité de `hashCode`** : un hash constant met tout dans une case.
  - `new HashMap<>(1000)` fixe une **capacité** (la table se redimensionnera quand même vers 750 éléments) ; depuis
    Java 19, `HashMap.newHashMap(1000)` dimensionne pour **1 000 éléments**.
  - `HashMap` n'est pas thread-safe : en concurrence, `ConcurrentHashMap`.

  **Piège classique** : un `hashCode` qui ne dépend que d'un champ peu varié (un booléen, une catégorie). La table
  dégénère en quelques cases surchargées.

  **En entretien** : « Un tableau de buckets indexé par `hash & (n - 1)`, des collisions chaînées puis en arbre au-delà
  de 8, un redimensionnement à 75 % ; et tout repose sur un bon `hashCode`. »
cards:
  - key: fonctionne-hashmap
    format: course
    question: "Comment fonctionne une `HashMap` ?"
    choices:
      - {text: "Un tableau de cases indexé par le hash ; les collisions sont chaînées, et la table grandit au-delà de 75 %", correct: true}
      - {text: "Un arbre rouge-noir trié par clé, rééquilibré à chaque insertion pour garder des accès en O(log n)", correct: false}
      - {text: "Une liste de couples parcourue avec `equals`, triée par hash pour accélérer les recherches", correct: false}
      - {text: "Un tableau de cases indexé par le hash ; une collision écrase l'entrée déjà rangée dans la case", correct: false}
    answer: "Un tableau de cases (buckets), indexé par `hash & (n - 1)` ; les collisions sont chaînées et départagées par `equals` ; au-delà du facteur de charge (0,75), la table est agrandie (rehashing), et une case de plus de 8 éléments devient un arbre. Une collision n'écrase rien : seules deux clés égales se remplacent."
  - key: capacite-puissance-2
    format: course
    question: "Pourquoi la capacité d'une `HashMap` est-elle une puissance de 2 ?"
    choices:
      - {text: "Pour calculer la case par un masque de bits (`hash & (n - 1)`) au lieu d'un modulo", correct: true}
      - {text: "Pour que la table tienne exactement dans une page mémoire du système", correct: false}
      - {text: "Pour que deux clés différentes n'aient jamais le même indice de case", correct: false}
      - {text: "Pour pouvoir chercher les clés par dichotomie, comme dans une `TreeMap`", correct: false}
    answer: "Pour remplacer le modulo par une opération bit à bit : avec `n` puissance de 2, `hash & (n - 1)` vaut `hash % n`, en plus rapide. Cela n'empêche pas les collisions."
  - key: role-arbre-rouge-noir-depuis-java
    format: course
    question: "Quel est le rôle de l'arbre rouge-noir dans une `HashMap`, depuis Java 8 ?"
    choices:
      - {text: "Ramener le pire cas d'une case saturée de O(n) à O(log n)", correct: true}
      - {text: "Garder les clés de la map triées pour les parcourir dans l'ordre", correct: false}
      - {text: "Remplacer le tableau de cases dès que la map dépasse 64 entrées", correct: false}
      - {text: "Éviter tout rehashing quand la table dépasse son facteur de charge", correct: false}
    answer: Ramener le pire cas d'un bucket saturé de O(n) à O(log n).
  - key: capacite-initiale-load-factor-hashmap
    format: course
    question: "Quels sont la capacité initiale et le facteur de charge par défaut d'une `HashMap` ?"
    choices:
      - {text: "16 et 0,75 : la table s'agrandit au 13e élément", correct: true}
      - {text: "10 et 0,75 : la table s'agrandit au 8e élément", correct: false}
      - {text: "16 et 1,0 : la table s'agrandit au 17e élément", correct: false}
      - {text: "32 et 0,5 : la table s'agrandit au 17e élément", correct: false}
    answer: "16 et 0,75 : le seuil vaut 16 × 0,75 = 12, donc la table est redimensionnée à l'ajout du 13e élément. La capacité 10, c'est celle d'une `ArrayList`."
  - key: quand-bucket-devient-arbre
    format: course
    question: "Quand une case d'une `HashMap` devient-elle un arbre ?"
    choices:
      - {text: "Au-delà de 8 éléments, si la table a au moins 64 cases ; sinon la table est agrandie", correct: true}
      - {text: "Au-delà de 8 éléments, quelle que soit la taille de la table", correct: false}
      - {text: "Dès la première collision, si la table a au moins 64 cases", correct: false}
      - {text: "Au-delà de 64 éléments, si la table a au moins 8 cases ; sinon rien ne change", correct: false}
    answer: Au-delà de 8 éléments, si la table fait au moins 64 cases ; sinon la table est agrandie.
  - key: vf-collision
    format: true-false
    question: Deux clés différentes de même `hashCode` ne peuvent pas cohabiter dans une `HashMap`.
    truth: false
    answer: Elles partagent la même case et sont distinguées par `equals`.
  - key: vf-capacite
    format: true-false
    question: "`new HashMap<>(1000)` garantit qu'aucun redimensionnement n'aura lieu pour 1 000 éléments."
    truth: false
    answer: 1000 est une capacité ; avec le facteur 0,75, la table s'agrandit vers 750 éléments. `HashMap.newHashMap(1000)` (Java 19) dimensionne pour 1 000 éléments.
  - key: vf-redimension
    format: true-false
    question: Quand une `HashMap` s'agrandit, sa capacité double.
    truth: true
    answer: Et les entrées sont redistribuées dans la nouvelle table.
  - key: vf-thread-safe
    format: true-false
    question: Une `HashMap` peut être modifiée sans risque par plusieurs threads à la fois.
    truth: false
    answer: "Elle n'est pas thread-safe : on perd des entrées, voire on corrompt la structure."
  - key: qcm-index
    format: multiple-choice
    question: Comment une `HashMap` de capacité `n` choisit-elle la case d'une clé ?
    choices:
      - text: "`hash & (n - 1)`, sur le hash mélangé"
        correct: true
      - text: "`hashCode() % 10`"
        correct: false
      - text: "Par l'ordre d'insertion"
        correct: false
      - text: "Par l'ordre alphabétique de la clé"
        correct: false
    answer: Avec `n` puissance de 2, le ET binaire équivaut à un modulo, plus rapide.
  - key: qcm-mauvais-hash
    format: multiple-choice
    question: Quel est l'effet d'un `hashCode` qui renvoie toujours la même valeur ?
    choices:
      - {text: "Toutes les clés tombent dans la même case : la map reste correcte mais devient lente", correct: true}
      - {text: "Les clés écrasent leurs valeurs : la map ne garde qu'une seule entrée à la fois", correct: false}
      - {text: "Une exception est levée à la deuxième insertion, dès la première collision", correct: false}
      - {text: "Aucun : la `HashMap` recalcule un hash à partir de l'adresse de chaque objet", correct: false}
    answer: "Toutes les clés tombent dans la même case, où `equals` les départage : la map reste correcte, mais les recherches deviennent linéaires (ou logarithmiques une fois la case en arbre)."
  - key: qcm-arbre
    format: multiple-choice
    question: Que se passe-t-il quand une case dépasse 8 éléments dans une table de 16 cases ?
    choices:
      - {text: "La table est agrandie plutôt que la case transformée en arbre", correct: true}
      - {text: "La case devient immédiatement un arbre rouge-noir", correct: false}
      - {text: "Les éléments en trop sont ignorés jusqu'au prochain rehashing", correct: false}
      - {text: "Une exception est levée : une case ne dépasse jamais 8 éléments", correct: false}
    answer: La transformation en arbre exige au moins 64 cases.
  - key: qcm-dimensionner
    format: multiple-choice
    question: "Laquelle de ces écritures prépare une `HashMap` pour 10 000 éléments sans redimensionnement ?"
    choices:
      - {text: "`HashMap.newHashMap(10_000)`", correct: true}
      - {text: "`new HashMap<>(7_500)`", correct: false}
      - {text: "`new HashMap<>(16)`", correct: false}
      - {text: "`new HashMap<>()`", correct: false}
    answer: "`newHashMap` (Java 19) calcule la capacité pour le nombre d'éléments attendu, en tenant compte du facteur de charge de 0,75. `new HashMap<>(7_500)` multiplie par 0,75 au lieu de diviser : la table s'agrandit encore."
  - key: code-ordre-entiers
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<Integer, String> m = new HashMap<>();
      for (int i : new int[]{5, 1, 3}) m.put(i, "v");
      System.out.println(m.keySet());
      ```
    choices:
      - {text: "`[1, 3, 5]`", correct: true}
      - {text: "`[5, 1, 3]`", correct: false}
      - {text: "`[5, 3, 1]`", correct: false}
      - {text: "`[3, 1, 5]`", correct: false}
    answer: '`[1, 3, 5]` : le hash d''un petit `Integer` est sa valeur, qui donne directement la case. Un détail d''implémentation, pas une garantie.'
    check:
      output: "[1, 3, 5]"
  - key: code-collision
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<Integer, String> m = new HashMap<>();
      m.put(17, "a");
      m.put(1, "b");
      System.out.println(m.keySet());
      ```
    choices:
      - {text: "`[17, 1]`", correct: true}
      - {text: "`[1, 17]`", correct: false}
      - {text: "`[1]`", correct: false}
      - {text: "`[17]`", correct: false}
    answer: '`[17, 1]` : dans 16 cases, 17 et 1 tombent dans la case 1 et y sont chaînés dans l''ordre d''insertion.'
    check:
      output: "[17, 1]"
  - key: code-hash-constant
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      record K(int v) {
          @Override public int hashCode() { return 42; }
      }
      Map<K, Integer> m = new HashMap<>();
      for (int i = 0; i < 100; i++) m.put(new K(i), i);
      System.out.println(m.size() + " " + m.get(new K(57)));
      ```
    choices:
      - {text: "`100 57`", correct: true}
      - {text: "`1 99`", correct: false}
      - {text: "`100 null`", correct: false}
      - {text: "`1 null`", correct: false}
    answer: '`100 57` : un hash constant reste correct grâce à `equals`, seulement lent.'
    check:
      output: "100 57"
  - key: code-meme-hash
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> m = new HashMap<>();
      m.put("Aa", 1);
      m.put("BB", 2);
      System.out.println(m.size() + " " + ("Aa".hashCode() == "BB".hashCode()));
      ```
    choices:
      - {text: "`2 true`", correct: true}
      - {text: "`1 true`", correct: false}
      - {text: "`2 false`", correct: false}
      - {text: "`1 false`", correct: false}
    answer: '`2 true` : même hash, mais deux clés distinctes par `equals`.'
    check:
      output: "2 true"
  - key: bug-hash-constant
    format: bug-fix
    question: |-
      Une `HashMap` de 100 000 produits répond très lentement. Quelle correction est la bonne ?
      ```java
      @Override public int hashCode() { return 1; }
      ```
    choices:
      - {text: "Calculer le hash sur les champs d'`equals` : `Objects.hash(reference, fournisseur)`", correct: true}
      - {text: "Renvoyer `(int) (Math.random() * 1000)` pour répartir les produits entre les cases", correct: false}
      - {text: "Créer la `HashMap` avec une capacité initiale de 100 000 pour éviter les collisions", correct: false}
      - {text: "Supprimer `equals`, pour que la map ne compare plus que les hashs, plus rapides", correct: false}
    answer: |-
      ```java
      @Override public int hashCode() { return Objects.hash(reference, fournisseur); }
      ```
      Toutes les clés tombaient dans la même case. Un hash calculé sur les champs d'`equals` répartit les clés.
  - key: bug-hash-pauvre
    format: bug-fix
    question: |-
      Le profilage montre quelques cases très chargées dans cette map d'utilisateurs. Quelle correction est la bonne ?
      ```java
      @Override public int hashCode() { return actif ? 1 : 0; }   // equals compare l'email
      ```
    choices:
      - {text: "Fonder le hash sur le champ d'`equals` : `email.hashCode()`", correct: true}
      - {text: "Renvoyer `actif ? 31 : 17`, des nombres premiers mieux répartis", correct: false}
      - {text: "Agrandir la map pour répartir les deux valeurs dans plus de cases", correct: false}
      - {text: "Fonder aussi `equals` sur `actif`, pour qu'il suive `hashCode`", correct: false}
    answer: |-
      ```java
      @Override public int hashCode() { return email.hashCode(); }
      ```
      Un hash fondé sur un booléen n'a que deux valeurs : deux cases surchargées. Il doit utiliser les champs d'`equals`
      (ici l'email), qui varient.
  - key: bug-dimensionnement
    format: bug-fix
    question: |-
      Le chargement d'un index d'un million d'entrées provoque encore un redimensionnement coûteux. Quelle correction est la bonne ?
      ```java
      Map<String, Produit> index = new HashMap<>(1_000_000);
      ```
    choices:
      - {text: "`HashMap.newHashMap(1_000_000)`, qui tient compte du facteur de charge", correct: true}
      - {text: "`new HashMap<>(750_000)`, la capacité multipliée par le facteur de charge", correct: false}
      - {text: "`new HashMap<>(1_000_000, 0.5f)`, qui agrandit la table plus tôt", correct: false}
      - {text: "`new LinkedHashMap<>(1_000_000)`, qui ne redimensionne jamais sa table", correct: false}
    answer: |-
      ```java
      Map<String, Produit> index = HashMap.newHashMap(1_000_000);
      ```
      Le constructeur prend une capacité, pas un nombre d'éléments : la table s'agrandit encore à 75 %. `newHashMap`
      (Java 19) calcule la capacité pour le nombre d'éléments attendu.
  - key: bug-concurrence
    format: bug-fix
    question: |-
      Ce compteur partagé par plusieurs threads perd des incréments. Quelle correction est la bonne ?
      ```java
      private final Map<String, Integer> compteurs = new HashMap<>();
      void compter(String cle) { compteurs.merge(cle, 1, Integer::sum); }
      ```
    choices:
      - {text: "Une `ConcurrentHashMap`, dont `merge` est atomique", correct: true}
      - {text: "Déclarer le champ `compteurs` en `volatile`", correct: false}
      - {text: "Remplacer `merge` par un `get` suivi d'un `put`", correct: false}
      - {text: "Une `LinkedHashMap`, qui garde l'ordre des écritures", correct: false}
    answer: |-
      ```java
      private final Map<String, Integer> compteurs = new ConcurrentHashMap<>();
      void compter(String cle) { compteurs.merge(cle, 1, Integer::sum); }
      ```
      `HashMap` n'est pas thread-safe : des écritures simultanées se perdent ou corrompent la table. `ConcurrentHashMap`
      fait `merge` de façon atomique.
