notion: hashmap-interne
lesson: |-
  Une `HashMap` est un **tableau de cases** (*buckets*). Pour ranger une clé :

  1. elle calcule `hashCode()`, puis le « mélange » (`h ^ (h >>> 16)`) pour mieux répartir les bits ;
  2. elle choisit la case avec `hash & (n - 1)`, où `n`, la capacité, est une **puissance de 2** (un ET binaire au lieu
     d'un modulo) ;
  3. dans la case, elle compare les clés : d'abord le hash stocké, puis `equals`.

  ```
  capacité 16 : [0] [1] → "Aa" → "BB"   (même hash : collision, chaînage)   [2] ... [15]
  ```

  - Plusieurs clés dans une même case forment une **liste chaînée** (une collision). Depuis Java 8, une case qui
    dépasse **8** éléments devient un **arbre rouge-noir** (si la table compte au moins 64 cases ; sinon la table est
    agrandie) : le pire cas passe de O(n) à O(log n). En dessous de 6, elle redevient une liste.
  - Capacité initiale **16**, **facteur de charge 0,75** : au-delà de 12 éléments, la table **double** et toutes les
    entrées sont redistribuées (*rehash*).
  - Les performances dépendent donc de la **qualité de `hashCode`** : un hash constant met tout dans une case.
  - `new HashMap<>(1000)` fixe une **capacité** (la table se redimensionnera quand même vers 750 éléments) ; depuis
    Java 19, `HashMap.newHashMap(1000)` dimensionne pour **1 000 éléments**.
  - `HashMap` n'est pas thread-safe : en concurrence, `ConcurrentHashMap`.

  **Piège classique** : un `hashCode` qui ne dépend que d'un champ peu varié (un booléen, une catégorie). La table
  dégénère en quelques cases surchargées.

  **En entretien** : « Un tableau de buckets indexé par `hash & (n - 1)`, des collisions chaînées puis en arbre au-delà
  de 8, un redimensionnement à 75 % ; et tout repose sur un bon `hashCode`. »
cards:
  - key: fonctionne-hashmap
    format: course
    question: Comment fonctionne une HashMap ?
    answer: Tableau de buckets, index via `hash & (n-1)`, collision → chaînage + equals, load factor 0.75 → rehashing, >8 éléments → arbre.
  - key: capacite-puissance-2
    format: course
    question: Pourquoi une capacité en puissance de 2 ?
    answer: Pour remplacer le modulo par une opération bit-à-bit.
  - key: role-arbre-rouge-noir-depuis-java
    format: course
    question: Rôle de l'arbre rouge-noir depuis Java 8 ?
    answer: Ramener le pire cas d'un bucket saturé de O(n) à O(log n).
  - key: capacite-initiale-load-factor-hashmap
    format: course
    question: Capacité initiale et load factor d'une HashMap ?
    answer: 16 et 0.75, donc redimensionnement à 13 éléments.
  - key: quand-bucket-devient-arbre
    format: course
    question: Quand un bucket devient-il un arbre ?
    answer: Au-delà de 8 éléments, si la table fait au moins 64 cases ; sinon la table est agrandie.
  - key: vf-collision
    format: true-false
    question: Deux clés différentes de même `hashCode` ne peuvent pas cohabiter dans une `HashMap`.
    truth: false
    answer: Elles partagent la même case et sont distinguées par `equals`.
  - key: vf-capacite
    format: true-false
    question: "`new HashMap<>(1000)` garantit qu'aucun redimensionnement n'aura lieu pour 1 000 éléments."
    truth: false
    answer: 1000 est une capacité ; avec le facteur 0,75, la table s'agrandit vers 750 éléments. `HashMap.newHashMap(1000)` (Java 19) dimensionne pour 1 000 éléments.
  - key: vf-redimension
    format: true-false
    question: Quand une `HashMap` s'agrandit, sa capacité double.
    truth: true
    answer: Et les entrées sont redistribuées dans la nouvelle table.
  - key: vf-thread-safe
    format: true-false
    question: Une `HashMap` peut être modifiée sans risque par plusieurs threads à la fois.
    truth: false
    answer: "Elle n'est pas thread-safe : on perd des entrées, voire on corrompt la structure."
  - key: qcm-index
    format: multiple-choice
    question: Comment une `HashMap` de capacité `n` choisit-elle la case d'une clé ?
    choices:
      - text: "`hash & (n - 1)`, sur le hash mélangé"
        correct: true
      - text: "`hashCode() % 10`"
        correct: false
      - text: "Par l'ordre d'insertion"
        correct: false
      - text: "Par l'ordre alphabétique de la clé"
        correct: false
    answer: Avec `n` puissance de 2, le ET binaire équivaut à un modulo, plus rapide.
  - key: qcm-mauvais-hash
    format: multiple-choice
    question: Quel est l'effet d'un `hashCode` qui renvoie toujours la même valeur ?
    choices:
      - text: "Toutes les clés tombent dans la même case : la map reste correcte mais devient lente"
        correct: true
      - text: "La map perd des entrées"
        correct: false
      - text: "Une exception à l'insertion"
        correct: false
      - text: "Aucun effet"
        correct: false
    answer: Les recherches deviennent linéaires (ou logarithmiques une fois la case en arbre).
  - key: qcm-arbre
    format: multiple-choice
    question: Que se passe-t-il quand une case dépasse 8 éléments dans une table de 16 cases ?
    choices:
      - text: "La table est agrandie plutôt que la case transformée en arbre"
        correct: true
      - text: "La case devient immédiatement un arbre"
        correct: false
      - text: "Les éléments en trop sont ignorés"
        correct: false
      - text: "Une exception est levée"
        correct: false
    answer: La transformation en arbre exige au moins 64 cases.
  - key: qcm-dimensionner
    format: multiple-choice
    question: Comment préparer une `HashMap` pour 10 000 éléments sans redimensionnement ?
    choices:
      - text: "`HashMap.newHashMap(10_000)` (Java 19)"
        correct: true
      - text: "`new HashMap<>(10_000 * 4 / 3 + 1)`"
        correct: true
      - text: "`new HashMap<>(10_000)`, qui suffit"
        correct: false
      - text: "`new HashMap<>(16)`"
        correct: false
    answer: Il faut tenir compte du facteur de charge de 0,75.
  - key: code-ordre-entiers
    format: code-output
    question: |-
      ```java
      Map<Integer, String> m = new HashMap<>();
      for (int i : new int[]{5, 1, 3}) m.put(i, "v");
      System.out.println(m.keySet());
      ```
    answer: '`[1, 3, 5]` : le hash d''un petit `Integer` est sa valeur, qui donne directement la case. Un détail d''implémentation, pas une garantie.'
    check:
      output: "[1, 3, 5]"
  - key: code-collision
    format: code-output
    question: |-
      ```java
      Map<Integer, String> m = new HashMap<>();
      m.put(17, "a");
      m.put(1, "b");
      System.out.println(m.keySet());
      ```
    answer: '`[17, 1]` : dans 16 cases, 17 et 1 tombent dans la case 1 et y sont chaînés dans l''ordre d''insertion.'
    check:
      output: "[17, 1]"
  - key: code-hash-constant
    format: code-output
    question: |-
      ```java
      record K(int v) {
          @Override public int hashCode() { return 42; }
      }
      Map<K, Integer> m = new HashMap<>();
      for (int i = 0; i < 100; i++) m.put(new K(i), i);
      System.out.println(m.size() + " " + m.get(new K(57)));
      ```
    answer: '`100 57` : un hash constant reste correct grâce à `equals`, seulement lent.'
    check:
      output: "100 57"
  - key: code-meme-hash
    format: code-output
    question: |-
      ```java
      Map<String, Integer> m = new HashMap<>();
      m.put("Aa", 1);
      m.put("BB", 2);
      System.out.println(m.size() + " " + ("Aa".hashCode() == "BB".hashCode()));
      ```
    answer: '`2 true` : même hash, mais deux clés distinctes par `equals`.'
    check:
      output: "2 true"
  - key: bug-hash-constant
    format: bug-fix
    question: |-
      Une `HashMap` de 100 000 produits répond très lentement :
      ```java
      @Override public int hashCode() { return 1; }
      ```
    answer: |-
      ```java
      @Override public int hashCode() { return Objects.hash(reference, fournisseur); }
      ```
      Toutes les clés tombaient dans la même case. Un hash calculé sur les champs d'`equals` répartit les clés.
  - key: bug-hash-pauvre
    format: bug-fix
    question: |-
      Le profilage montre quelques cases très chargées dans cette map d'utilisateurs :
      ```java
      @Override public int hashCode() { return actif ? 1 : 0; }   // equals compare l'email
      ```
    answer: |-
      ```java
      @Override public int hashCode() { return email.hashCode(); }
      ```
      Un hash fondé sur un booléen n'a que deux valeurs : deux cases surchargées. Il doit utiliser les champs d'`equals`
      (ici l'email), qui varient.
  - key: bug-dimensionnement
    format: bug-fix
    question: |-
      Le chargement d'un index d'un million d'entrées provoque de nombreux redimensionnements :
      ```java
      Map<String, Produit> index = new HashMap<>(1_000_000);
      ```
    answer: |-
      ```java
      Map<String, Produit> index = HashMap.newHashMap(1_000_000);
      ```
      Le constructeur prend une capacité, pas un nombre d'éléments : la table s'agrandit encore à 75 %. `newHashMap`
      (Java 19) calcule la capacité pour le nombre d'éléments attendu.
  - key: bug-concurrence
    format: bug-fix
    question: |-
      Ce compteur partagé par plusieurs threads perd des incréments :
      ```java
      private final Map<String, Integer> compteurs = new HashMap<>();
      void compter(String cle) { compteurs.merge(cle, 1, Integer::sum); }
      ```
    answer: |-
      ```java
      private final Map<String, Integer> compteurs = new ConcurrentHashMap<>();
      void compter(String cle) { compteurs.merge(cle, 1, Integer::sum); }
      ```
      `HashMap` n'est pas thread-safe : des écritures simultanées se perdent ou corrompent la table. `ConcurrentHashMap`
      fait `merge` de façon atomique.
