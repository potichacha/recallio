notion: hashmap-interne
cards:
  - key: fonctionne-hashmap
    format: course
    question: Comment fonctionne une HashMap ?
    answer: Tableau de buckets, index via `hash & (n-1)`, collision → chaînage + equals, load factor 0.75 → rehashing, >8 éléments → arbre.
  - key: capacite-puissance-2
    format: course
    question: Pourquoi une capacité en puissance de 2 ?
    answer: Pour remplacer le modulo par une opération bit-à-bit.
  - key: role-arbre-rouge-noir-depuis-java
    format: course
    question: Rôle de l'arbre rouge-noir depuis Java 8 ?
    answer: Ramener le pire cas d'un bucket saturé de O(n) à O(log n).
  - key: capacite-initiale-load-factor-hashmap
    format: course
    question: Capacité initiale et load factor d'une HashMap ?
    answer: 16 et 0.75, donc redimensionnement à 13 éléments.
  - key: quand-bucket-devient-arbre
    format: course
    question: Quand un bucket devient-il un arbre ?
    answer: Au-delà de 8 éléments, si la table fait au moins 64 cases ; sinon la table est agrandie.
