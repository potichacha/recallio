notion: linkedlist
lesson: |-
  `LinkedList` est une liste **doublement chaînée** : chaque élément est un nœud qui référence le précédent et le
  suivant. Elle implémente `List` **et** `Deque`.

  ```java
  LinkedList<Integer> l = new LinkedList<>(List.of(1, 2, 3));
  l.addFirst(0);          // O(1)
  l.removeLast();         // O(1)
  l.get(500_000);         // O(n) : il faut parcourir les nœuds jusqu'à l'indice
  ```

  Sur le papier, elle insère et supprime en O(1)... **à condition d'être déjà au bon endroit** (avec un `ListIterator`).
  Trouver l'endroit coûte O(n). En pratique, elle est presque toujours **plus lente** qu'`ArrayList` :
  - chaque nœud est un objet à part (environ 24 octets de plus par élément) ;
  - les nœuds sont dispersés en mémoire : le processeur ne peut pas en profiter (mauvaise **localité de cache**) ;
  - `get(i)` parcourt la liste : une boucle `for (int i ...)` devient quadratique.

  Pour une **file** ou une **pile**, `ArrayDeque` est plus rapide et plus compacte (mais refuse `null`, qu'accepte
  `LinkedList`). Le créateur du framework des collections lui-même dit ne jamais l'utiliser.

  **Piège classique** : choisir `LinkedList` « parce qu'on insère beaucoup ». Si les insertions se font par indice, il
  faut d'abord atteindre l'indice : O(n), comme pour `ArrayList`, mais en plus lent.

  **En entretien** : « `LinkedList` est une liste chaînée, en O(1) aux extrémités mais O(n) par indice et lente en
  pratique ; `ArrayList` pour une liste, `ArrayDeque` pour une file. »
cards:
  - key: arraylist-vs-linkedlist
    format: course
    question: ArrayList vs LinkedList ?
    answer: Accès O(1)/insertion milieu O(n) vs accès O(n)/insertion O(1). ArrayList par défaut.
  - key: structure
    format: course
    question: Comment est construite une `LinkedList` ?
    answer: "Comme une liste doublement chaînée : chaque élément est un nœud qui référence le précédent et le suivant ; elle implémente `List` et `Deque`."
  - key: pourquoi-lente
    format: course
    question: Pourquoi `LinkedList` est-elle souvent plus lente qu'`ArrayList`, même pour des insertions ?
    answer: Atteindre une position coûte O(n), chaque nœud est un objet supplémentaire, et les nœuds dispersés en mémoire empêchent le processeur de profiter de son cache.
  - key: alternative
    format: course
    question: Que préférer à `LinkedList` pour une file ou une pile ?
    answer: '`ArrayDeque`, plus rapide et plus compacte (elle refuse seulement `null`).'
  - key: vf-get
    format: true-false
    question: "`get(i)` sur une `LinkedList` est en temps constant."
    truth: false
    answer: "Il faut parcourir les nœuds : O(n)."
  - key: vf-deque
    format: true-false
    question: "`LinkedList` implémente `Deque`."
    truth: true
    answer: Elle offre `addFirst`, `pollLast`, `push`, `pop`...
  - key: vf-memoire
    format: true-false
    question: Une `LinkedList` consomme moins de mémoire qu'une `ArrayList` de même taille.
    truth: false
    answer: Chaque élément est enveloppé dans un nœud avec deux références.
  - key: vf-random-access
    format: true-false
    question: "`LinkedList` implémente `RandomAccess`."
    truth: false
    answer: L'accès par indice n'y est pas rapide.
  - key: qcm-rapide
    format: multiple-choice
    question: Quelles opérations sont en O(1) sur une `LinkedList` ?
    choices:
      - text: "`addFirst(x)`"
        correct: true
      - text: "`removeLast()`"
        correct: true
      - text: "`get(n / 2)`"
        correct: false
      - text: "`contains(x)`"
        correct: false
    answer: Les extrémités sont directes ; le reste demande un parcours.
  - key: qcm-file
    format: multiple-choice
    question: Quelle implémentation choisir pour une file de messages ?
    choices:
      - text: "`ArrayDeque`"
        correct: true
      - text: "`LinkedList`"
        correct: false
      - text: "`ArrayList` avec `remove(0)`"
        correct: false
      - text: "`Stack`"
        correct: false
    answer: '`ArrayDeque` est la file la plus efficace (non partagée entre threads).'
  - key: qcm-boucle
    format: multiple-choice
    question: "Quelle est la complexité de `for (int i = 0; i < l.size(); i++) l.get(i)` sur une `LinkedList` de n éléments ?"
    choices:
      - text: "O(n²)"
        correct: true
      - text: "O(n)"
        correct: false
      - text: "O(log n)"
        correct: false
      - text: "O(1)"
        correct: false
    answer: Chaque `get(i)` parcourt jusqu'à i éléments ; un for-each serait en O(n).
  - key: qcm-null
    format: multiple-choice
    question: Quelle différence de comportement entre `LinkedList` et `ArrayDeque` ?
    choices:
      - text: "`LinkedList` accepte `null`, `ArrayDeque` le refuse"
        correct: true
      - text: "`ArrayDeque` accepte l'accès par indice"
        correct: false
      - text: "`LinkedList` est thread-safe"
        correct: false
      - text: "Aucune"
        correct: false
    answer: '`ArrayDeque` n''a pas d''accès par indice et lève une `NullPointerException` pour `null`.'
  - key: code-extremites
    format: code-output
    question: |-
      ```java
      LinkedList<Integer> l = new LinkedList<>(List.of(1, 2, 3));
      l.addFirst(0);
      l.removeLast();
      System.out.println(l);
      ```
    answer: '`[0, 1, 2]`.'
    check:
      output: "[0, 1, 2]"
  - key: code-interfaces
    format: code-output
    question: |-
      ```java
      Object o = new LinkedList<String>();
      System.out.println((o instanceof Deque) + " " + (o instanceof RandomAccess));
      ```
    answer: '`true false` : une file à deux bouts, sans accès par indice rapide.'
    check:
      output: "true false"
  - key: code-list-iterator
    format: code-output
    question: |-
      ```java
      LinkedList<String> l = new LinkedList<>(List.of("a", "c"));
      ListIterator<String> it = l.listIterator();
      it.next();
      it.add("b");
      System.out.println(l);
      ```
    answer: '`[a, b, c]` : le `ListIterator` insère à sa position, en O(1).'
    check:
      output: "[a, b, c]"
  - key: code-null
    format: code-output
    question: |-
      ```java
      LinkedList<String> l = new LinkedList<>();
      l.add(null);
      System.out.println(l.size() + " " + l.getFirst());
      ```
    answer: '`1 null` : `LinkedList` accepte `null`, contrairement à `ArrayDeque`.'
    check:
      output: "1 null"
  - key: bug-get-boucle
    format: bug-fix
    question: |-
      Ce parcours d'une `LinkedList` de cent mille éléments prend plusieurs secondes :
      ```java
      for (int i = 0; i < lignes.size(); i++) {
          traiter(lignes.get(i));
      }
      ```
    answer: |-
      ```java
      for (Ligne ligne : lignes) {
          traiter(ligne);
      }
      ```
      Chaque `get(i)` parcourt la liste depuis une extrémité : la boucle est quadratique. Le for-each utilise l'itérateur,
      en O(n). (Et une `ArrayList` aurait été un meilleur choix.)
  - key: bug-file
    format: bug-fix
    question: |-
      Modernisez cette file de travail :
      ```java
      Queue<Tache> file = new LinkedList<>();
      ```
    answer: |-
      ```java
      Queue<Tache> file = new ArrayDeque<>();
      ```
      `ArrayDeque` est plus rapide et plus compacte pour une file. (Seule différence : elle refuse `null`.)
  - key: bug-insertion-indice
    format: bug-fix
    question: |-
      Un développeur a choisi `LinkedList` « pour des insertions rapides », mais le code est plus lent qu'avant :
      ```java
      List<Evenement> agenda = new LinkedList<>();
      agenda.add(position(evenement), evenement);   // insertion par indice
      ```
    answer: |-
      ```java
      List<Evenement> agenda = new ArrayList<>();
      agenda.add(position(evenement), evenement);
      // ou, pour garder les événements triés : un TreeSet / une TreeMap par date
      ```
      Avec un indice, la `LinkedList` doit d'abord parcourir jusqu'à la position : O(n), comme `ArrayList`, mais avec de
      nombreux défauts de cache en plus.
  - key: bug-memoire
    format: bug-fix
    question: |-
      Une liste d'un million de mesures occupe bien plus de mémoire que prévu :
      ```java
      List<Integer> mesures = new LinkedList<>();
      ```
    answer: |-
      ```java
      int[] mesures = new int[nombre];   // ou une ArrayList<Integer> si la taille varie
      ```
      Chaque élément d'une `LinkedList` coûte un nœud (deux références) plus un `Integer`. Un `int[]` stocke les valeurs
      directement ; une `ArrayList` au moins sans les nœuds.
