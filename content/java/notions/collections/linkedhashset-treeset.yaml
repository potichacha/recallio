notion: linkedhashset-treeset
lesson: |-
  Deux ensembles qui ajoutent un **ordre** à l'unicité :

  | | `LinkedHashSet` | `TreeSet` |
  |---|---|---|
  | Ordre | d'**insertion** | **trié** (ordre naturel ou comparateur) |
  | Structure | `HashSet` + liste chaînée | arbre rouge-noir |
  | `add`, `contains` | O(1) | O(log n) |
  | Doublons détectés par | `equals` et `hashCode` | `compareTo` (ou le comparateur) |
  | `null` | accepté | refusé avec l'ordre naturel |

  ```java
  Set<String> visites = new LinkedHashSet<>(List.of("c", "a", "b", "a"));   // [c, a, b]

  TreeSet<Integer> t = new TreeSet<>(List.of(10, 20, 30, 40));
  t.first();          // 10
  t.floor(25);        // 20 : le plus grand ≤ 25
  t.ceiling(25);      // 30 : le plus petit ≥ 25
  t.headSet(30);      // [10, 20] : strictement inférieurs
  t.descendingSet();  // [40, 30, 20, 10]
  ```

  - `TreeSet` est un **`NavigableSet`** : les requêtes « le plus proche », « tout ce qui est entre » sont son point fort.
  - Pour un `TreeSet`, deux éléments sont des doublons si le comparateur renvoie 0, même s'ils ne sont pas `equals` :
    un comparateur incomplet **perd** des éléments.
  - Réinsérer un élément déjà présent dans un `LinkedHashSet` ne change pas sa position.

  **Piège classique** : un `TreeSet` de clients trié seulement par nom. Deux clients homonymes sont jugés identiques, et le
  second n'est jamais ajouté.

  **En entretien** : « `LinkedHashSet` garde l'ordre d'insertion en O(1) ; `TreeSet` trie en O(log n), offre floor,
  ceiling et les sous-ensembles, et juge les doublons par son comparateur. »
cards:
  - key: treeset-determine-doublons
    format: course
    question: Comment TreeSet détermine-t-il les doublons ?
    answer: Par compareTo ou le Comparator (résultat 0), pas par equals.
  - key: linkedhashset-ordre
    format: course
    question: Quel ordre garde un `LinkedHashSet` ?
    answer: L'ordre d'insertion ; réinsérer un élément déjà présent ne le déplace pas.
  - key: navigable
    format: course
    question: Que permettent `floor`, `ceiling`, `headSet` et `tailSet` d'un `TreeSet` ?
    answer: De trouver l'élément le plus proche inférieur ou supérieur à une valeur, et d'obtenir les éléments avant ou après une borne.
  - key: complexite
    format: course
    question: Quel est le coût d'un ajout dans un `TreeSet` ?
    answer: O(log n), car l'arbre rouge-noir reste équilibré ; contre O(1) en moyenne pour un `HashSet` ou un `LinkedHashSet`.
  - key: vf-treeset-trie
    format: true-false
    question: Un `TreeSet` itère dans l'ordre trié de ses éléments.
    truth: true
    answer: Ordre naturel ou ordre du comparateur.
  - key: vf-null-treeset
    format: true-false
    question: Un `TreeSet<String>` dans l'ordre naturel accepte `null`.
    truth: false
    answer: Il lève une `NullPointerException` en le comparant.
  - key: vf-reinsertion
    format: true-false
    question: Réinsérer un élément existant dans un `LinkedHashSet` le place à la fin.
    truth: false
    answer: Sa position ne change pas ; il faut le retirer puis le rajouter.
  - key: vf-comparateur-doublon
    format: true-false
    question: "Un `TreeSet<String>(String.CASE_INSENSITIVE_ORDER)` peut contenir `\"Ada\"` et `\"ADA\"`."
    truth: false
    answer: "Le comparateur les juge égaux : le second n'est pas ajouté."
  - key: qcm-choix
    format: multiple-choice
    question: Quel ensemble pour mémoriser les pages visitées, dans l'ordre de visite, sans doublon ?
    choices:
      - text: "`LinkedHashSet`"
        correct: true
      - text: "`TreeSet`"
        correct: false
      - text: "`HashSet`"
        correct: false
      - text: "`ArrayList`"
        correct: false
    answer: L'unicité avec l'ordre d'insertion.
  - key: qcm-floor
    format: multiple-choice
    question: "Avec `TreeSet<Integer> t = new TreeSet<>(List.of(10, 20, 30))`, que vaut `t.floor(25)` ?"
    choices:
      - text: "20"
        correct: true
      - text: "30"
        correct: false
      - text: "25"
        correct: false
      - text: "`null`"
        correct: false
    answer: Le plus grand élément inférieur ou égal à 25.
  - key: qcm-perte
    format: multiple-choice
    question: "Pourquoi un `TreeSet<Client>` trié par nom perd-il des clients ?"
    choices:
      - text: "Deux homonymes ont un `compareTo` nul et sont jugés doublons"
        correct: true
      - text: "Le `TreeSet` est limité en taille"
        correct: false
      - text: "`equals` n'est pas redéfini"
        correct: false
      - text: "Les noms en majuscules sont ignorés"
        correct: false
    answer: On départage par un critère unique (`thenComparing(Client::id)`).
  - key: qcm-intervalle
    format: multiple-choice
    question: "Comment obtenir les éléments d'un `TreeSet<Integer>` compris entre 10 inclus et 20 exclu ?"
    choices:
      - text: "`t.subSet(10, 20)`"
        correct: true
      - text: "`t.headSet(20).tailSet(10)`"
        correct: true
      - text: "`t.range(10, 20)`"
        correct: false
      - text: "`t.subList(10, 20)`"
        correct: false
    answer: Ce sont des vues sur l'ensemble.
  - key: code-ordres
    format: code-output
    question: |-
      ```java
      Set<String> l = new LinkedHashSet<>(List.of("c", "a", "b", "a"));
      Set<String> t = new TreeSet<>(l);
      System.out.println(l + " " + t);
      ```
    answer: '`[c, a, b] [a, b, c]` : ordre d''insertion, puis ordre trié.'
    check:
      output: "[c, a, b] [a, b, c]"
  - key: code-navigable
    format: code-output
    question: |-
      ```java
      TreeSet<Integer> t = new TreeSet<>(List.of(10, 20, 30, 40));
      System.out.println(t.floor(25) + " " + t.ceiling(25) + " " + t.headSet(30));
      ```
    answer: '`20 30 [10, 20]`.'
    check:
      output: "20 30 [10, 20]"
  - key: code-comparateur
    format: code-output
    question: |-
      ```java
      Set<String> t = new TreeSet<>(String.CASE_INSENSITIVE_ORDER);
      t.add("Ada");
      t.add("ADA");
      System.out.println(t);
      ```
    answer: '`[Ada]` : pour le comparateur, les deux sont égaux.'
    check:
      output: "[Ada]"
  - key: code-null
    format: code-output
    question: |-
      ```java
      Set<String> t = new TreeSet<>();
      t.add(null);
      ```
    answer: "Une `NullPointerException` : l'ordre naturel ne sait pas comparer `null`."
    check:
      throws: NullPointerException
  - key: bug-homonymes
    format: bug-fix
    question: |-
      Un client sur cent disparaît de cet annuaire trié :
      ```java
      Set<Client> annuaire = new TreeSet<>(Comparator.comparing(Client::nom));
      ```
    answer: |-
      ```java
      Set<Client> annuaire = new TreeSet<>(Comparator.comparing(Client::nom).thenComparing(Client::id));
      ```
      Le comparateur juge doublons deux homonymes. On départage par un critère unique.
  - key: bug-deplacer-fin
    format: bug-fix
    question: |-
      Ce « dernières recherches » ne remonte pas une recherche répétée en tête de liste (fin de l'ensemble) :
      ```java
      void rechercher(String terme) {
          recentes.add(terme);   // LinkedHashSet
      }
      ```
    answer: |-
      ```java
      void rechercher(String terme) {
          recentes.remove(terme);
          recentes.add(terme);
      }
      ```
      Réinsérer un élément présent ne change pas sa position : on le retire avant de le rajouter (en Java 21,
      `recentes.addLast(terme)` le déplace aussi).
  - key: bug-non-comparable
    format: bug-fix
    question: |-
      Ce code lève une `ClassCastException: Commande cannot be cast to Comparable` :
      ```java
      Set<Commande> commandes = new TreeSet<>();
      commandes.add(new Commande(...));
      ```
    answer: |-
      ```java
      Set<Commande> commandes = new TreeSet<>(Comparator.comparing(Commande::date).thenComparing(Commande::id));
      ```
      Sans comparateur, un `TreeSet` exige des éléments `Comparable`. On fournit l'ordre voulu (complet, pour ne perdre
      aucune commande).
  - key: bug-tri-repete
    format: bug-fix
    question: |-
      L'affichage du top des prix trie l'ensemble à chaque appel :
      ```java
      Set<Integer> prix = new HashSet<>();
      List<Integer> affichage() { List<Integer> l = new ArrayList<>(prix); Collections.sort(l); return l; }
      ```
    answer: |-
      ```java
      NavigableSet<Integer> prix = new TreeSet<>();
      List<Integer> affichage() { return List.copyOf(prix); }
      ```
      Un `TreeSet` garde ses éléments triés au fil des ajouts : plus de tri à chaque lecture (et `first()`, `last()` sont
      immédiats).
