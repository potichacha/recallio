notion: stack-vector-legacy
lesson: |-
  `Vector`, `Stack`, `Hashtable` et `Enumeration` datent de Java 1.0, avant le framework des collections (Java 1.2). On
  les croise dans du vieux code et en entretien ; on ne les choisit plus.

  | Classe historique | Problème | À utiliser |
  |---|---|---|
  | `Vector` | chaque méthode `synchronized` | `ArrayList` |
  | `Stack` | hérite de `Vector` : synchronisée, et expose `get(i)`, `add(i, x)`... | `ArrayDeque` |
  | `Hashtable` | synchronisée, refuse `null` | `HashMap`, ou `ConcurrentHashMap` en concurrence |
  | `Enumeration` | ancêtre d'`Iterator`, sans `remove` | `Iterator` |

  - La synchronisation **méthode par méthode** coûte à chaque appel, même avec un seul thread, et **ne suffit pas** à
    rendre sûres les opérations composées (`if (!v.contains(x)) v.add(x)` n'est pas atomique).
  - En concurrence, on choisit une collection conçue pour : `ConcurrentHashMap`, `CopyOnWriteArrayList`, une
    `BlockingQueue`.
  - `Stack` hérite de `Vector` : c'est l'exemple classique d'un **héritage mal choisi** (une pile *n'est pas* une liste).
  - Son itération va du **bas** vers le haut, alors que celle d'une `ArrayDeque` utilisée en pile va du sommet vers le
    bas.

  **Piège classique** : croire qu'un `Vector` rend le code thread-safe. Chaque appel est atomique, pas leur
  enchaînement.

  **En entretien** : « Des classes de Java 1.0, synchronisées méthode par méthode : lentes et pas vraiment sûres. On
  utilise `ArrayList`, `ArrayDeque` et `HashMap`, ou les collections concurrentes. »
cards:
  - key: hashmap-vs-hashtable
    format: course
    question: "Quelle différence entre `HashMap` et `Hashtable` ?"
    choices:
      - {text: "`Hashtable` est synchronisée, refuse `null` et date de Java 1.0 ; `HashMap` accepte une clé `null`", correct: true}
      - {text: "`HashMap` est synchronisée et refuse `null` ; `Hashtable` en est la version moderne, plus rapide", correct: false}
      - {text: "Aucune : `Hashtable` n'est qu'un ancien nom de `HashMap`, gardé pour la compatibilité", correct: false}
      - {text: "`Hashtable` garde ses clés triées ; `HashMap` les garde dans l'ordre d'insertion", correct: false}
    answer: "`Hashtable` est synchronisée, refuse `null` et appartient aux classes historiques ; `HashMap` n'est pas synchronisée et accepte une clé `null`. Entre threads, on prend `ConcurrentHashMap`."
  - key: utiliser-stack
    format: course
    question: "Pourquoi ne plus utiliser `Stack` ?"
    choices:
      - {text: "Classe historique, synchronisée et héritée de `Vector` ; `ArrayDeque` est plus rapide", correct: true}
      - {text: "Elle a été supprimée en Java 17 et ne compile plus avec un JDK récent", correct: false}
      - {text: "Elle sort ses éléments en FIFO, alors qu'une pile doit être LIFO", correct: false}
      - {text: "Elle ne peut pas contenir plus de 1 024 éléments, faute de redimensionnement", correct: false}
    answer: "Classe historique, synchronisée, héritée de `Vector` (et qui expose des méthodes de liste) ; `ArrayDeque` offre `push`, `pop` et `peek`, plus rapides. `Stack` existe toujours, elle est seulement déconseillée."
  - key: vector-arraylist
    format: course
    question: Quelle différence entre `Vector` et `ArrayList` ?
    choices:
      - {text: "`Vector` synchronise chaque méthode ; `ArrayList` non, et elle est donc plus rapide", correct: true}
      - {text: "`ArrayList` synchronise chaque méthode ; `Vector` non, et il est donc plus rapide", correct: false}
      - {text: "`Vector` est une liste chaînée ; `ArrayList` repose sur un tableau", correct: false}
      - {text: "`Vector` a une taille fixe ; `ArrayList` grandit à la demande", correct: false}
    answer: '`Vector` synchronise chaque méthode (et double sa capacité au lieu de l''augmenter de moitié) ; `ArrayList` n''est pas synchronisée, donc plus rapide. On utilise `ArrayList`.'
  - key: composee
    format: course
    question: Pourquoi un `Vector` ne rend-il pas thread-safe `if (!v.contains(x)) v.add(x)` ?
    choices:
      - {text: "Chaque méthode est atomique, pas leur enchaînement : un thread peut ajouter `x` entre les deux", correct: true}
      - {text: "`contains` n'est pas synchronisée sur un `Vector`, contrairement à `add`", correct: false}
      - {text: "Un `Vector` est en lecture seule pour les threads autres que son créateur", correct: false}
      - {text: "`add` d'un `Vector` ignore déjà les doublons, donc la condition ne sert à rien", correct: false}
    answer: Chaque méthode est atomique, pas leur enchaînement ; un autre thread peut ajouter `x` entre `contains` et `add`.
  - key: vf-hashtable-null
    format: true-false
    question: "`Hashtable` accepte une clé `null`."
    truth: false
    answer: Elle refuse les clés et les valeurs `null`.
  - key: vf-stack-vector
    format: true-false
    question: "`Stack` hérite de `Vector`."
    truth: true
    answer: Elle expose donc aussi les méthodes d'une liste, ce qui casse l'abstraction de pile.
  - key: vf-thread-safe
    format: true-false
    question: Remplacer `ArrayList` par `Vector` suffit à rendre un code concurrent correct.
    truth: false
    answer: Les opérations composées restent non atomiques.
  - key: vf-recommande
    format: true-false
    question: La Javadoc de `Stack` recommande d'utiliser une `Deque` à la place.
    truth: true
    answer: Par exemple `Deque<Integer> pile = new ArrayDeque<>();`.
  - key: qcm-remplacants
    format: multiple-choice
    question: Quels remplacements sont corrects ?
    choices:
      - text: "`Stack` → `ArrayDeque`"
        correct: true
      - text: "`Vector` → `ArrayList`"
        correct: true
      - text: "`Hashtable` → `TreeSet`"
        correct: false
      - text: "`Enumeration` → `Optional`"
        correct: false
    answer: '`Hashtable` se remplace par `HashMap` ou `ConcurrentHashMap` ; `Enumeration` par `Iterator`.'
  - key: qcm-concurrence
    format: multiple-choice
    question: Pour une map partagée entre threads, que choisir aujourd'hui ?
    choices:
      - text: "`ConcurrentHashMap`"
        correct: true
      - text: "`Hashtable`"
        correct: false
      - text: "`HashMap`"
        correct: false
      - text: "`WeakHashMap`"
        correct: false
    answer: '`Hashtable` verrouille toute la table à chaque appel ; `ConcurrentHashMap` est conçue pour la concurrence et offre des opérations atomiques comme `merge`.'
  - key: qcm-heritage
    format: multiple-choice
    question: Pourquoi `Stack extends Vector` est-il un mauvais design ?
    choices:
      - text: "Une pile n'est pas une liste ; on peut y insérer ou lire n'importe où"
        correct: true
      - text: "Parce que `Vector` est abstraite"
        correct: false
      - text: "Parce que `Stack` ne peut pas contenir d'objets"
        correct: false
      - text: "Parce que l'héritage est interdit dans les collections"
        correct: false
    answer: La composition (une pile qui utilise une liste) aurait protégé l'invariant LIFO.
  - key: qcm-epoque
    format: multiple-choice
    question: Que reprocher principalement à `Vector` dans un code mono-thread ?
    choices:
      - text: "Le coût inutile de la synchronisation à chaque appel"
        correct: true
      - text: "Un accès par index en O(n)"
        correct: false
      - text: "L'impossibilité de stocker des doublons"
        correct: false
      - text: "Une taille fixe"
        correct: false
    answer: L'accès par index est en O(1), comme `ArrayList`.
  - key: bug-vector
    format: bug-fix
    question: |-
      Par quoi remplacer ces déclarations, dans un code qui ne partage pas ces collections entre threads ?
      ```java
      Vector<String> noms = new Vector<>();
      Hashtable<String, Integer> ages = new Hashtable<>();
      ```
    choices:
      - {text: "`List<String> noms = new ArrayList<>();` et `Map<String, Integer> ages = new HashMap<>();`", correct: true}
      - {text: "`List<String> noms = new LinkedList<>();` et `Map<String, Integer> ages = new TreeMap<>();`", correct: false}
      - {text: "`Stack<String> noms = new Stack<>();` et `Map<String, Integer> ages = new ConcurrentHashMap<>();`", correct: false}
      - {text: "`List<String> noms = Collections.synchronizedList(new ArrayList<>());` et une `synchronizedMap`", correct: false}
    answer: |-
      ```java
      List<String> noms = new ArrayList<>();
      Map<String, Integer> ages = new HashMap<>();
      ```
      Sans partage entre threads, la synchronisation ne sert à rien ; on déclare aussi par l'interface.
  - key: bug-stack
    format: bug-fix
    question: |-
      Quelle déclaration moderne remplace cette `Stack`, sans changer les appels ?
      ```java
      Stack<Character> ouvrantes = new Stack<>();
      ouvrantes.push('(');
      char c = ouvrantes.pop();
      ```
    choices:
      - {text: "`Deque<Character> ouvrantes = new ArrayDeque<>();`", correct: true}
      - {text: "`List<Character> ouvrantes = new ArrayList<>();`", correct: false}
      - {text: "`Queue<Character> ouvrantes = new PriorityQueue<>();`", correct: false}
      - {text: "`Vector<Character> ouvrantes = new Vector<>();`", correct: false}
    answer: |-
      ```java
      Deque<Character> ouvrantes = new ArrayDeque<>();
      ouvrantes.push('(');
      char c = ouvrantes.pop();
      ```
      Mêmes méthodes, sans synchronisation ni méthodes de liste parasites.
  - key: bug-composee
    format: bug-fix
    question: |-
      Ce registre partagé contient parfois des doublons, alors qu'il utilise un `Vector`. Quelle correction est la bonne ?
      ```java
      if (!abonnes.contains(email)) {
          abonnes.add(email);
      }
      ```
    choices:
      - {text: "Un ensemble concurrent, `ConcurrentHashMap.newKeySet()`, et un simple `add`", correct: true}
      - {text: "Déclarer le `Vector` en `volatile`, pour que les threads voient les ajouts", correct: false}
      - {text: "Remplacer le `Vector` par une `ArrayList`, plus rapide entre les deux appels", correct: false}
      - {text: "Inverser les appels : `add` d'abord, puis `contains` pour vérifier", correct: false}
    answer: |-
      ```java
      private final Set<String> abonnes = ConcurrentHashMap.newKeySet();
      abonnes.add(email);       // atomique, et sans doublon par construction
      ```
      `contains` puis `add` ne forment pas une opération atomique. Un ensemble concurrent règle à la fois les doublons et
      la concurrence.
  - key: bug-hashtable-concurrence
    format: bug-fix
    question: |-
      Ce compteur partagé par un serveur très sollicité est un goulot d'étranglement. Quelle correction est la bonne ?
      ```java
      private final Hashtable<String, Integer> hits = new Hashtable<>();
      synchronized void hit(String page) { hits.put(page, hits.getOrDefault(page, 0) + 1); }
      ```
    choices:
      - {text: "Une `ConcurrentHashMap<String, LongAdder>`, sans méthode `synchronized`", correct: true}
      - {text: "Garder la `Hashtable`, mais retirer `synchronized` de la méthode `hit`", correct: false}
      - {text: "Remplacer la `Hashtable` par une `HashMap`, en gardant `synchronized`", correct: false}
      - {text: "Une `Collections.synchronizedMap(new HashMap<>())`, plus rapide", correct: false}
    answer: |-
      ```java
      private final ConcurrentHashMap<String, LongAdder> hits = new ConcurrentHashMap<>();
      void hit(String page) { hits.computeIfAbsent(page, k -> new LongAdder()).increment(); }
      ```
      `Hashtable` et la méthode `synchronized` sérialisent tous les appels. `ConcurrentHashMap` permet des accès
      parallèles, et `LongAdder` supporte les incréments concurrents.
