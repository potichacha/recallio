notion: stack-vector-legacy
lesson: |-
  `Vector`, `Stack`, `Hashtable` et `Enumeration` datent de Java 1.0, avant le framework des collections (Java 1.2). On
  les croise dans du vieux code et en entretien ; on ne les choisit plus.

  | Classe historique | Problème | À utiliser |
  |---|---|---|
  | `Vector` | chaque méthode `synchronized` | `ArrayList` |
  | `Stack` | hérite de `Vector` : synchronisée, et expose `get(i)`, `add(i, x)`... | `ArrayDeque` |
  | `Hashtable` | synchronisée, refuse `null` | `HashMap`, ou `ConcurrentHashMap` en concurrence |
  | `Enumeration` | ancêtre d'`Iterator`, sans `remove` | `Iterator` |

  - La synchronisation **méthode par méthode** coûte à chaque appel, même avec un seul thread, et **ne suffit pas** à
    rendre sûres les opérations composées (`if (!v.contains(x)) v.add(x)` n'est pas atomique).
  - En concurrence, on choisit une collection conçue pour : `ConcurrentHashMap`, `CopyOnWriteArrayList`, une
    `BlockingQueue`.
  - `Stack` hérite de `Vector` : c'est l'exemple classique d'un **héritage mal choisi** (une pile *n'est pas* une liste).
  - Son itération va du **bas** vers le haut, alors que celle d'une `ArrayDeque` utilisée en pile va du sommet vers le
    bas.

  **Piège classique** : croire qu'un `Vector` rend le code thread-safe. Chaque appel est atomique, pas leur
  enchaînement.

  **En entretien** : « Des classes de Java 1.0, synchronisées méthode par méthode : lentes et pas vraiment sûres. On
  utilise `ArrayList`, `ArrayDeque` et `HashMap`, ou les collections concurrentes. »
cards:
  - key: hashmap-vs-hashtable
    format: course
    question: HashMap vs Hashtable ?
    answer: Hashtable est synchronisée, refuse null et est legacy ; HashMap n'est pas synchronisée et accepte une clé null.
  - key: utiliser-stack
    format: course
    question: Pourquoi ne pas utiliser Stack ?
    answer: Legacy, synchronisée, hérite de Vector ; ArrayDeque est plus rapide.
  - key: vector-arraylist
    format: course
    question: Quelle différence entre `Vector` et `ArrayList` ?
    answer: '`Vector` synchronise chaque méthode (et double sa capacité au lieu de l''augmenter de moitié) ; `ArrayList` n''est pas synchronisée, donc plus rapide. On utilise `ArrayList`.'
  - key: composee
    format: course
    question: Pourquoi un `Vector` ne rend-il pas thread-safe `if (!v.contains(x)) v.add(x)` ?
    answer: Chaque méthode est atomique, pas leur enchaînement ; un autre thread peut ajouter `x` entre `contains` et `add`.
  - key: vf-hashtable-null
    format: true-false
    question: "`Hashtable` accepte une clé `null`."
    truth: false
    answer: Elle refuse les clés et les valeurs `null`.
  - key: vf-stack-vector
    format: true-false
    question: "`Stack` hérite de `Vector`."
    truth: true
    answer: Elle expose donc aussi les méthodes d'une liste, ce qui casse l'abstraction de pile.
  - key: vf-thread-safe
    format: true-false
    question: Remplacer `ArrayList` par `Vector` suffit à rendre un code concurrent correct.
    truth: false
    answer: Les opérations composées restent non atomiques.
  - key: vf-recommande
    format: true-false
    question: La Javadoc de `Stack` recommande d'utiliser une `Deque` à la place.
    truth: true
    answer: Par exemple `Deque<Integer> pile = new ArrayDeque<>();`.
  - key: qcm-remplacants
    format: multiple-choice
    question: Quels remplacements sont corrects ?
    choices:
      - text: "`Stack` → `ArrayDeque`"
        correct: true
      - text: "`Vector` → `ArrayList`"
        correct: true
      - text: "`Hashtable` → `TreeSet`"
        correct: false
      - text: "`Enumeration` → `Optional`"
        correct: false
    answer: '`Hashtable` se remplace par `HashMap` ou `ConcurrentHashMap` ; `Enumeration` par `Iterator`.'
  - key: qcm-concurrence
    format: multiple-choice
    question: Pour une map partagée entre threads, que choisir aujourd'hui ?
    choices:
      - text: "`ConcurrentHashMap`"
        correct: true
      - text: "`Hashtable`"
        correct: false
      - text: "`HashMap`"
        correct: false
      - text: "`WeakHashMap`"
        correct: false
    answer: '`Hashtable` verrouille toute la table à chaque appel ; `ConcurrentHashMap` est conçue pour la concurrence et offre des opérations atomiques comme `merge`.'
  - key: qcm-heritage
    format: multiple-choice
    question: Pourquoi `Stack extends Vector` est-il un mauvais design ?
    choices:
      - text: "Une pile n'est pas une liste ; on peut y insérer ou lire n'importe où"
        correct: true
      - text: "Parce que `Vector` est abstraite"
        correct: false
      - text: "Parce que `Stack` ne peut pas contenir d'objets"
        correct: false
      - text: "Parce que l'héritage est interdit dans les collections"
        correct: false
    answer: La composition (une pile qui utilise une liste) aurait protégé l'invariant LIFO.
  - key: qcm-epoque
    format: multiple-choice
    question: Que reprocher principalement à `Vector` dans un code mono-thread ?
    choices:
      - text: "Le coût inutile de la synchronisation à chaque appel"
        correct: true
      - text: "Un accès par index en O(n)"
        correct: false
      - text: "L'impossibilité de stocker des doublons"
        correct: false
      - text: "Une taille fixe"
        correct: false
    answer: L'accès par index est en O(1), comme `ArrayList`.
  - key: bug-vector
    format: bug-fix
    question: |-
      Modernisez :
      ```java
      Vector<String> noms = new Vector<>();
      Hashtable<String, Integer> ages = new Hashtable<>();
      ```
    answer: |-
      ```java
      List<String> noms = new ArrayList<>();
      Map<String, Integer> ages = new HashMap<>();
      ```
      Sans partage entre threads, la synchronisation ne sert à rien ; on déclare aussi par l'interface.
  - key: bug-stack
    format: bug-fix
    question: |-
      Modernisez :
      ```java
      Stack<Character> ouvrantes = new Stack<>();
      ouvrantes.push('(');
      char c = ouvrantes.pop();
      ```
    answer: |-
      ```java
      Deque<Character> ouvrantes = new ArrayDeque<>();
      ouvrantes.push('(');
      char c = ouvrantes.pop();
      ```
      Mêmes méthodes, sans synchronisation ni méthodes de liste parasites.
  - key: bug-composee
    format: bug-fix
    question: |-
      Ce registre partagé contient parfois des doublons, alors qu'il utilise un `Vector` :
      ```java
      if (!abonnes.contains(email)) {
          abonnes.add(email);
      }
      ```
    answer: |-
      ```java
      private final Set<String> abonnes = ConcurrentHashMap.newKeySet();
      abonnes.add(email);       // atomique, et sans doublon par construction
      ```
      `contains` puis `add` ne forment pas une opération atomique. Un ensemble concurrent règle à la fois les doublons et
      la concurrence.
  - key: bug-hashtable-concurrence
    format: bug-fix
    question: |-
      Ce compteur partagé par un serveur très sollicité est un goulot d'étranglement :
      ```java
      private final Hashtable<String, Integer> hits = new Hashtable<>();
      synchronized void hit(String page) { hits.put(page, hits.getOrDefault(page, 0) + 1); }
      ```
    answer: |-
      ```java
      private final ConcurrentHashMap<String, LongAdder> hits = new ConcurrentHashMap<>();
      void hit(String page) { hits.computeIfAbsent(page, k -> new LongAdder()).increment(); }
      ```
      `Hashtable` et la méthode `synchronized` sérialisent tous les appels. `ConcurrentHashMap` permet des accès
      parallèles, et `LongAdder` supporte les incréments concurrents.
