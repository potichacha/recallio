notion: choisir-collection
lesson: |-
  Choisir une collection, c'est partir de l'**usage** : quelles opérations dominent, et quelles garanties sont
  nécessaires.

  | Besoin | Choix par défaut |
  |---|---|
  | une suite ordonnée, accès par indice | `ArrayList` |
  | des éléments uniques, sans ordre | `HashSet` |
  | uniques, dans l'ordre d'insertion | `LinkedHashSet` |
  | uniques et triés, requêtes par intervalle | `TreeSet` |
  | une association clé → valeur | `HashMap` (`LinkedHashMap` pour l'ordre, `TreeMap` pour le tri) |
  | une file ou une pile | `ArrayDeque` |
  | toujours traiter le plus prioritaire | `PriorityQueue` |
  | des clés d'une enum | `EnumMap`, `EnumSet` |
  | un partage entre threads | `ConcurrentHashMap`, `CopyOnWriteArrayList`, `ConcurrentLinkedQueue` |
  | une valeur constante à partager | `List.of`, `Set.of`, `Map.of` |

  Les questions à se poser :
  - **doublons** permis ? sinon un `Set` ;
  - **ordre** : aucun, d'insertion, ou trié ?
  - **opérations fréquentes** : accès par indice, recherche, insertion en tête, plus petit élément ?
  - **concurrence** : la collection est-elle partagée entre threads ?
  - **mutabilité** : faut-il pouvoir la modifier ?

  `ArrayList` et `HashMap` couvrent l'immense majorité des cas ; `LinkedList` n'est presque jamais le bon choix.

  **Piège classique** : une `List` utilisée pour tester l'appartenance d'un élément dans une boucle. Chaque `contains` est
  linéaire ; un `HashSet` le fait en temps constant.

  **En entretien** : « Je pars des opérations dominantes et des garanties (doublons, ordre, concurrence) ; par défaut
  `ArrayList`, `HashSet`, `HashMap`, `ArrayDeque`. »
cards:
  - key: questions
    format: course
    question: Quelles questions se poser pour choisir une collection ?
    answer: 'Doublons permis ou non, ordre (aucun, d''insertion, trié), opérations dominantes (indice, recherche, tête, minimum), partage entre threads, mutabilité.'
  - key: defauts
    format: course
    question: Quelles implémentations choisir par défaut ?
    answer: '`ArrayList` pour une liste, `HashSet` pour un ensemble, `HashMap` pour une association, `ArrayDeque` pour une file ou une pile.'
  - key: ordre-ensembles
    format: course
    question: Comment choisir entre `HashSet`, `LinkedHashSet` et `TreeSet` ?
    answer: '`HashSet` sans ordre, `LinkedHashSet` pour l''ordre d''insertion, `TreeSet` pour un ordre trié et des requêtes par intervalle (en O(log n)).'
  - key: concurrence
    format: course
    question: Quelle collection pour une `Map` partagée entre threads ?
    answer: '`ConcurrentHashMap`, qui permet des lectures et écritures concurrentes et des opérations atomiques (`merge`, `computeIfAbsent`).'
  - key: vf-linkedlist
    format: true-false
    question: "`LinkedList` est en général un meilleur choix qu'`ArrayList`."
    truth: false
    answer: '`ArrayList` est plus rapide dans presque tous les cas (localité mémoire, accès par indice).'
  - key: vf-treeset-ordre
    format: true-false
    question: "Un `TreeSet` garde ses éléments triés."
    truth: true
    answer: Selon leur ordre naturel ou un comparateur.
  - key: vf-enummap
    format: true-false
    question: Pour des clés d'une enum, `EnumMap` est plus efficace qu'une `HashMap`.
    truth: true
    answer: Elle est stockée comme un tableau indexé par l'ordinal.
  - key: vf-file
    format: true-false
    question: "`ArrayDeque` peut servir à la fois de pile et de file."
    truth: true
    answer: Elle offre `push`/`pop` et `offer`/`poll`.
  - key: qcm-appartenance
    format: multiple-choice
    question: Quelle collection pour tester très souvent si un identifiant est connu ?
    choices:
      - text: "`HashSet`"
        correct: true
      - text: "`ArrayList`"
        correct: false
      - text: "`LinkedList`"
        correct: false
      - text: "`PriorityQueue`"
        correct: false
    answer: '`contains` est en temps constant sur un `HashSet`, linéaire sur une liste.'
  - key: qcm-priorite
    format: multiple-choice
    question: Quelle collection pour toujours traiter d'abord la tâche la plus urgente ?
    choices:
      - text: "`PriorityQueue`"
        correct: true
      - text: "`ArrayDeque`"
        correct: false
      - text: "`HashSet`"
        correct: false
      - text: "`LinkedHashMap`"
        correct: false
    answer: Elle donne le plus petit élément selon un comparateur en O(log n).
  - key: qcm-ordre-insertion
    format: multiple-choice
    question: Quelle `Map` garde l'ordre dans lequel les clés ont été ajoutées ?
    choices:
      - text: "`LinkedHashMap`"
        correct: true
      - text: "`HashMap`"
        correct: false
      - text: "`TreeMap`"
        correct: false
      - text: "`Hashtable`"
        correct: false
    answer: '`TreeMap` trie les clés, ce n''est pas l''ordre d''insertion.'
  - key: qcm-intervalle
    format: multiple-choice
    question: Quelle collection pour trouver tous les événements entre deux dates ?
    choices:
      - text: "Une `TreeMap` indexée par date (`subMap`)"
        correct: true
      - text: "Une `HashMap` indexée par date"
        correct: false
      - text: "Un `HashSet`"
        correct: false
      - text: "Une `ArrayDeque`"
        correct: false
    answer: Les structures triées offrent les requêtes par intervalle.
  - key: choisis-implementations-map
    format: scenario
    question: Comment tu choisis entre les implémentations de Map ?
    answer: |-
      Je pars du **pattern d'accès dominant**.
      Accès rapide par clé, sans besoin d'ordre → HashMap, c'est le défaut.
      Besoin de préserver l'ordre d'insertion, par exemple pour une sortie déterministe ou un cache LRU → LinkedHashMap, qui propose même un mode accès-ordonné conçu pour ça.
      Besoin de clés triées ou de requêtes par intervalle → TreeMap, en acceptant O(log n).
      Map partagée entre threads → ConcurrentHashMap, parce qu'elle verrouille par bucket au lieu de bloquer toute la structure comme le ferait une map synchronisée.
      Et si je connais approximativement la taille finale, je dimensionne la capacité initiale pour éviter des rehashings répétés.
  - key: scenario-classement
    format: scenario
    question: Tu dois tenir un classement de joueurs par score, avec les dix meilleurs à afficher en permanence. Quelle structure ?
    answer: |-
      Si le classement se lit souvent et change peu, une liste triée suffit. S'il change en continu, une `TreeMap<Score,
      Joueur>` (ou un `TreeSet` avec un comparateur score puis identifiant, pour départager) garde l'ordre en O(log n) par
      mise à jour, et `descendingMap().entrySet().stream().limit(10)` donne le podium. Pour seulement les dix meilleurs
      d'un flux, une `PriorityQueue` de taille 10 (un tas minimum) suffit. Et si plusieurs threads écrivent,
      `ConcurrentSkipListMap`. À très grande échelle, un sorted set Valkey/Redis fait le même travail hors de la JVM.
  - key: scenario-historique
    format: scenario
    question: Tu dois garder les 100 dernières actions d'un utilisateur pour un « annuler ». Quelle collection ?
    answer: |-
      Une `ArrayDeque` utilisée comme pile : `push` à chaque action, `pop` pour annuler, et quand la taille dépasse 100, on
      retire la plus ancienne avec `removeLast()`. Toutes ces opérations sont en temps constant. Une `LinkedList` ferait la
      même chose plus lentement ; `Stack` est une classe historique synchronisée, à éviter. Si un « rétablir » est
      nécessaire, une seconde pile reçoit les actions annulées.
  - key: scenario-index
    format: scenario
    question: Un traitement cherche des produits par code, puis par catégorie. Comment organises-tu les données en mémoire ?
    answer: |-
      Deux index construits une fois : une `Map<String, Produit>` par code (`HashMap`, recherche en temps constant) et une
      `Map<Categorie, List<Produit>>` par catégorie (`groupingBy`, `EnumMap` si la catégorie est une enum). Je les
      construis à partir de la liste source et je les garde immuables (`Map.copyOf`) s'ils sont partagés. Les clés doivent
      avoir un `equals` et un `hashCode` corrects. Je ne fais pas de recherche linéaire dans la liste à chaque requête.
