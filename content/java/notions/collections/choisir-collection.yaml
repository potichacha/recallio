notion: choisir-collection
lesson: |-
  Choisir une collection, c'est partir de l'**usage** : quelles opérations dominent, et quelles garanties sont
  nécessaires.

  | Besoin | Choix par défaut |
  |---|---|
  | une suite ordonnée, accès par indice | `ArrayList` |
  | des éléments uniques, sans ordre | `HashSet` |
  | uniques, dans l'ordre d'insertion | `LinkedHashSet` |
  | uniques et triés, requêtes par intervalle | `TreeSet` |
  | une association clé → valeur | `HashMap` (`LinkedHashMap` pour l'ordre, `TreeMap` pour le tri) |
  | une file ou une pile | `ArrayDeque` |
  | toujours traiter le plus prioritaire | `PriorityQueue` |
  | des clés d'une enum | `EnumMap`, `EnumSet` |
  | un partage entre threads | `ConcurrentHashMap`, `CopyOnWriteArrayList`, `ConcurrentLinkedQueue` |
  | une valeur constante à partager | `List.of`, `Set.of`, `Map.of` |

  Les questions à se poser :
  - **doublons** permis ? sinon un `Set` ;
  - **ordre** : aucun, d'insertion, ou trié ?
  - **opérations fréquentes** : accès par indice, recherche, insertion en tête, plus petit élément ?
  - **concurrence** : la collection est-elle partagée entre threads ?
  - **mutabilité** : faut-il pouvoir la modifier ?

  `ArrayList` et `HashMap` couvrent l'immense majorité des cas ; `LinkedList` n'est presque jamais le bon choix.

  **Piège classique** : une `List` utilisée pour tester l'appartenance d'un élément dans une boucle. Chaque `contains` est
  linéaire ; un `HashSet` le fait en temps constant.

  **En entretien** : « Je pars des opérations dominantes et des garanties (doublons, ordre, concurrence) ; par défaut
  `ArrayList`, `HashSet`, `HashMap`, `ArrayDeque`. »
cards:
  - key: questions
    format: course
    question: "Quelles questions faut-il se poser pour choisir une collection ?"
    choices:
      - {text: "Doublons permis ou non, ordre voulu, opérations dominantes, partage entre threads, mutabilité", correct: true}
      - {text: "Taille finale exacte, type des éléments, version de Java, nombre de méthodes de l'interface", correct: false}
      - {text: "Seulement la vitesse de `get(i)` : la collection la plus rapide par indice convient partout", correct: false}
      - {text: "Seulement l'ordre : avec ou sans ordre, le reste se règle par une capacité initiale", correct: false}
    answer: "Doublons permis ou non, ordre (aucun, d'insertion, trié), opérations dominantes (indice, recherche, tête, minimum), partage entre threads, mutabilité. C'est le motif d'accès qui décide, pas une seule opération."
  - key: defauts
    format: course
    question: "Quelles implémentations choisir par défaut pour une liste, un ensemble, une association et une file ?"
    choices:
      - {text: "`ArrayList`, `HashSet`, `HashMap` et `ArrayDeque`", correct: true}
      - {text: "`LinkedList`, `TreeSet`, `TreeMap` et `LinkedList`", correct: false}
      - {text: "`Vector`, `HashSet`, `Hashtable` et `Stack`", correct: false}
      - {text: "`ArrayList`, `TreeSet`, `LinkedHashMap` et `PriorityQueue`", correct: false}
    answer: "`ArrayList` pour une liste, `HashSet` pour un ensemble, `HashMap` pour une association, `ArrayDeque` pour une file ou une pile. `Vector`, `Hashtable` et `Stack` sont des classes historiques synchronisées, à éviter."
  - key: ordre-ensembles
    format: course
    question: Comment choisir entre `HashSet`, `LinkedHashSet` et `TreeSet` ?
    choices:
      - {text: "`HashSet` sans ordre, `LinkedHashSet` dans l'ordre d'insertion, `TreeSet` trié", correct: true}
      - {text: "`HashSet` trié, `LinkedHashSet` dans l'ordre d'insertion, `TreeSet` sans ordre", correct: false}
      - {text: "`HashSet` dans l'ordre d'insertion, `LinkedHashSet` trié, `TreeSet` sans ordre", correct: false}
      - {text: "`HashSet` sans ordre, `LinkedHashSet` trié, `TreeSet` dans l'ordre d'insertion", correct: false}
    answer: "`HashSet` sans ordre, `LinkedHashSet` pour l'ordre d'insertion, `TreeSet` pour un ordre trié et des requêtes par intervalle (en O(log n))."
  - key: concurrence
    format: course
    question: Quelle collection pour une `Map` partagée entre threads ?
    choices:
      - {text: "`ConcurrentHashMap`, aux lectures et écritures concurrentes et aux opérations atomiques", correct: true}
      - {text: "`Hashtable`, dont chaque méthode est synchronisée sur la table entière", correct: false}
      - {text: "`HashMap` partagée telle quelle, car ses lectures et écritures sont atomiques", correct: false}
      - {text: "`Collections.synchronizedMap`, qui rend aussi les parcours sûrs sans verrou", correct: false}
    answer: "`ConcurrentHashMap`, qui permet des lectures et écritures concurrentes et des opérations atomiques (`merge`, `computeIfAbsent`). Une `HashMap` partagée se corrompt ; `Hashtable` et `synchronizedMap` verrouillent tout et ne protègent pas un parcours."
  - key: vf-linkedlist
    format: true-false
    question: "`LinkedList` est en général un meilleur choix qu'`ArrayList`."
    truth: false
    answer: '`ArrayList` est plus rapide dans presque tous les cas (localité mémoire, accès par indice).'
  - key: vf-treeset-ordre
    format: true-false
    question: "Un `TreeSet` garde ses éléments triés."
    truth: true
    answer: Selon leur ordre naturel ou un comparateur.
  - key: vf-enummap
    format: true-false
    question: Pour des clés d'une enum, `EnumMap` est plus efficace qu'une `HashMap`.
    truth: true
    answer: Elle est stockée comme un tableau indexé par l'ordinal.
  - key: vf-file
    format: true-false
    question: "`ArrayDeque` peut servir à la fois de pile et de file."
    truth: true
    answer: Elle offre `push`/`pop` et `offer`/`poll`.
  - key: qcm-appartenance
    format: multiple-choice
    question: Quelle collection pour tester très souvent si un identifiant est connu ?
    choices:
      - text: "`HashSet`"
        correct: true
      - text: "`ArrayList`"
        correct: false
      - text: "`LinkedList`"
        correct: false
      - text: "`PriorityQueue`"
        correct: false
    answer: '`contains` est en temps constant sur un `HashSet`, linéaire sur une liste.'
  - key: qcm-priorite
    format: multiple-choice
    question: Quelle collection pour toujours traiter d'abord la tâche la plus urgente ?
    choices:
      - text: "`PriorityQueue`"
        correct: true
      - text: "`ArrayDeque`"
        correct: false
      - text: "`HashSet`"
        correct: false
      - text: "`LinkedHashMap`"
        correct: false
    answer: Elle donne le plus petit élément selon un comparateur en O(log n).
  - key: qcm-ordre-insertion
    format: multiple-choice
    question: Quelle `Map` garde l'ordre dans lequel les clés ont été ajoutées ?
    choices:
      - text: "`LinkedHashMap`"
        correct: true
      - text: "`HashMap`"
        correct: false
      - text: "`TreeMap`"
        correct: false
      - text: "`Hashtable`"
        correct: false
    answer: '`TreeMap` trie les clés, ce n''est pas l''ordre d''insertion.'
  - key: qcm-intervalle
    format: multiple-choice
    question: Quelle collection pour trouver tous les événements entre deux dates ?
    choices:
      - text: "Une `TreeMap` indexée par date (`subMap`)"
        correct: true
      - text: "Une `HashMap` indexée par date"
        correct: false
      - text: "Un `HashSet`"
        correct: false
      - text: "Une `ArrayDeque`"
        correct: false
    answer: Les structures triées offrent les requêtes par intervalle.
  - key: choisis-implementations-map
    format: scenario
    question: "Comment choisis-tu entre les implémentations de `Map` ?"
    choices:
      - {text: "Selon l'accès dominant : `HashMap` par défaut, `LinkedHashMap` pour l'ordre, `TreeMap` pour le tri, `ConcurrentHashMap` entre threads", correct: true}
      - {text: "Toujours `TreeMap`, dont le O(log n) est assez rapide et qui garde en plus les clés triées pour tous les usages", correct: false}
      - {text: "Toujours `Hashtable`, synchronisée, pour qu'un futur partage entre threads ne demande aucun changement de code", correct: false}
      - {text: "Selon la taille : `HashMap` pour une petite table, `TreeMap` au-delà de mille clés, `LinkedHashMap` au-delà d'un million", correct: false}
    answer: |-
      Je pars du **pattern d'accès dominant**.
      Accès rapide par clé, sans besoin d'ordre → HashMap, c'est le défaut.
      Besoin de préserver l'ordre d'insertion, par exemple pour une sortie déterministe ou un cache LRU → LinkedHashMap, qui propose même un mode accès-ordonné conçu pour ça.
      Besoin de clés triées ou de requêtes par intervalle → TreeMap, en acceptant O(log n).
      Map partagée entre threads → ConcurrentHashMap, parce qu'elle verrouille par bucket au lieu de bloquer toute la structure comme le ferait une map synchronisée.
      Et si je connais approximativement la taille finale, je dimensionne la capacité initiale pour éviter des rehashings répétés.
  - key: scenario-classement
    format: scenario
    question: "Tu dois tenir un classement de joueurs par score, avec les dix meilleurs à afficher en permanence, et il change en continu. Quelle structure choisis-tu ?"
    choices:
      - {text: "Une `TreeMap` ou un `TreeSet` trié par score puis identifiant, mis à jour en O(log n)", correct: true}
      - {text: "Une `ArrayList` qu'on retrie entièrement avec `sort` après chaque changement de score", correct: false}
      - {text: "Une `HashMap` joueur → score, qu'on parcourt en entier pour trouver les dix meilleurs", correct: false}
      - {text: "Une `LinkedHashMap`, dont l'ordre d'insertion suit automatiquement les scores", correct: false}
    answer: |-
      Si le classement se lit souvent et change peu, une liste triée suffit. S'il change en continu, une `TreeMap<Score,
      Joueur>` (ou un `TreeSet` avec un comparateur score puis identifiant, pour départager) garde l'ordre en O(log n) par
      mise à jour, et `descendingMap().entrySet().stream().limit(10)` donne le podium. Pour seulement les dix meilleurs
      d'un flux, une `PriorityQueue` de taille 10 (un tas minimum) suffit. Et si plusieurs threads écrivent,
      `ConcurrentSkipListMap`. À très grande échelle, un sorted set Valkey/Redis fait le même travail hors de la JVM.
  - key: scenario-historique
    format: scenario
    question: "Tu dois garder les 100 dernières actions d'un utilisateur pour un « annuler ». Quelle collection choisis-tu ?"
    choices:
      - {text: "Une `ArrayDeque` en pile : `push`, `pop`, et `removeLast()` au-delà de 100", correct: true}
      - {text: "Une `Stack`, la pile prévue pour ça, avec `remove(0)` au-delà de 100", correct: false}
      - {text: "Une `ArrayList` où l'on insère chaque action en tête avec `add(0, action)`", correct: false}
      - {text: "Une `PriorityQueue` des actions, triée par date de la plus récente à la plus ancienne", correct: false}
    answer: |-
      Une `ArrayDeque` utilisée comme pile : `push` à chaque action, `pop` pour annuler, et quand la taille dépasse 100, on
      retire la plus ancienne avec `removeLast()`. Toutes ces opérations sont en temps constant. Une `LinkedList` ferait la
      même chose plus lentement ; `Stack` est une classe historique synchronisée, à éviter. Si un « rétablir » est
      nécessaire, une seconde pile reçoit les actions annulées.
  - key: scenario-index
    format: scenario
    question: "Un traitement cherche des produits par code, puis par catégorie. Comment organises-tu les données en mémoire ?"
    choices:
      - {text: "Deux index construits une fois : une `Map` par code, et une `Map` de listes par catégorie", correct: true}
      - {text: "Une seule `List<Produit>`, parcourue avec un filtre à chaque recherche par code ou par catégorie", correct: false}
      - {text: "Une `TreeSet<Produit>` triée par code, où l'on cherche aussi les catégories par intervalle", correct: false}
      - {text: "Une `Map` par catégorie seulement, dans laquelle on cherche le code produit par produit", correct: false}
    answer: |-
      Deux index construits une fois : une `Map<String, Produit>` par code (`HashMap`, recherche en temps constant) et une
      `Map<Categorie, List<Produit>>` par catégorie (`groupingBy`, `EnumMap` si la catégorie est une enum). Je les
      construis à partir de la liste source et je les garde immuables (`Map.copyOf`) s'ils sont partagés. Les clés doivent
      avoir un `equals` et un `hashCode` corrects. Je ne fais pas de recherche linéaire dans la liste à chaque requête.
