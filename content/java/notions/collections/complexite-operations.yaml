notion: complexite-operations
lesson: |-
  Choisir une collection, c'est d'abord choisir les opérations qu'on veut rapides.

  | Collection | accès par index | recherche (`contains`) | ajout | retrait |
  |---|---|---|---|---|
  | `ArrayList` | O(1) | O(n) | O(1) amorti en fin, O(n) au milieu | O(n) (O(1) en fin) |
  | `LinkedList` | O(n) | O(n) | O(1) aux bouts | O(1) aux bouts, O(n) pour trouver l'élément |
  | `ArrayDeque` | — | O(n) | O(1) aux bouts | O(1) aux bouts |
  | `HashSet` / `HashMap` | — | O(1) en moyenne | O(1) en moyenne | O(1) en moyenne |
  | `TreeSet` / `TreeMap` | — | O(log n) | O(log n) | O(log n) |
  | `PriorityQueue` | — | O(n) | O(log n) | O(log n) pour le minimum |

  - **O(1) amorti** : l'`ArrayList` double parfois son tableau (un ajout en O(n)), mais en moyenne sur beaucoup
    d'ajouts, chacun coûte O(1).
  - Le O(1) des tables de hachage suppose un **bon `hashCode`** ; le pire cas est O(log n) depuis Java 8.
  - La notation ignore les constantes : une `ArrayList` parcourt la mémoire de façon contiguë, ce qui la rend souvent plus
    rapide qu'une `LinkedList`, même là où leurs complexités sont égales.
  - Le vrai danger est la **multiplication** : un `contains` en O(n) dans une boucle sur n éléments donne O(n²).

  **Piège classique** : `list.contains(x)` dans une boucle. Sur 100 000 éléments, on passe de quelques millisecondes à
  plusieurs minutes ; un `HashSet` construit une fois avant la boucle règle le problème.

  **En entretien** : « Index : `ArrayList` en O(1). Appartenance : `HashSet` en O(1), `TreeSet` en O(log n) s'il faut
  l'ordre. Et je cherche toujours les O(n) cachés dans une boucle. »
cards:
  - key: arraylist-index
    format: course
    question: Quelle est la complexité de `get(i)` sur une `ArrayList` et sur une `LinkedList` ?
    answer: O(1) pour l'`ArrayList` (accès direct au tableau), O(n) pour la `LinkedList` (parcours depuis un bout).
  - key: contains
    format: course
    question: Quelle est la complexité de `contains` sur une `ArrayList`, un `HashSet` et un `TreeSet` ?
    answer: O(n), O(1) en moyenne et O(log n).
  - key: amorti
    format: course
    question: Que signifie « ajout en O(1) amorti » pour une `ArrayList` ?
    answer: Quelques ajouts coûtent O(n) (quand le tableau est agrandi), mais la moyenne sur une longue suite d'ajouts reste O(1) par ajout.
  - key: boucle
    format: course
    question: Pourquoi un `list.contains(x)` dans une boucle est-il dangereux ?
    answer: Un O(n) appelé n fois donne O(n²) ; on construit un `HashSet` une fois avant la boucle pour revenir à O(n).
  - key: vf-linkedlist-milieu
    format: true-false
    question: Insérer au milieu d'une `LinkedList` par index est en O(1).
    truth: false
    answer: Il faut d'abord atteindre la position, en O(n) ; seule l'insertion par un itérateur déjà placé est en O(1).
  - key: vf-treemap
    format: true-false
    question: "`get` sur une `TreeMap` est en O(log n)."
    truth: true
    answer: C'est un arbre rouge-noir équilibré.
  - key: vf-hash-pire-cas
    format: true-false
    question: Le pire cas d'une recherche dans une `HashMap` est O(n) depuis Java 8.
    truth: false
    answer: "Les cases surchargées deviennent des arbres : le pire cas est O(log n) (si les clés sont comparables)."
  - key: vf-arraylist-fin
    format: true-false
    question: Retirer le dernier élément d'une `ArrayList` est en O(1).
    truth: true
    answer: Aucun élément n'est décalé ; retirer le premier est en revanche en O(n).
  - key: qcm-appartenance
    format: multiple-choice
    question: Pour des millions de tests d'appartenance, sans besoin d'ordre, que choisir ?
    choices:
      - text: "`HashSet`"
        correct: true
      - text: "`TreeSet`"
        correct: false
      - text: "`ArrayList`"
        correct: false
      - text: "`LinkedList`"
        correct: false
    answer: O(1) en moyenne ; `TreeSet` en O(log n) si l'ordre est nécessaire.
  - key: qcm-index
    format: multiple-choice
    question: Quelles collections offrent un accès par index en O(1) ?
    choices:
      - text: "`ArrayList`"
        correct: true
      - text: "Un tableau `int[]`"
        correct: true
      - text: "`LinkedList`"
        correct: false
      - text: "`TreeSet`"
        correct: false
    answer: '`LinkedList` doit parcourir ses nœuds ; `TreeSet` n''a pas d''index.'
  - key: qcm-on2
    format: multiple-choice
    question: "Quelle est la complexité de `for (String x : a) if (b.contains(x)) ...` avec `a` et `b` deux `ArrayList` de n éléments ?"
    choices:
      - text: "O(n²)"
        correct: true
      - text: "O(n)"
        correct: false
      - text: "O(n log n)"
        correct: false
      - text: "O(1)"
        correct: false
    answer: Avec `b` converti en `HashSet`, on passe à O(n).
  - key: qcm-premier
    format: multiple-choice
    question: Quelles opérations sont en O(n) sur une `ArrayList` de n éléments ?
    choices:
      - text: "`remove(0)`"
        correct: true
      - text: "`add(0, x)`"
        correct: true
      - text: "`get(n / 2)`"
        correct: false
      - text: "`add(x)` en moyenne"
        correct: false
    answer: Retirer ou insérer au début décale tous les éléments.
  - key: verification-appartenance-liste-100-000-elements
    format: scenario
    question: Une vérification d'appartenance dans une liste de 100 000 éléments est appelée en boucle. C'est très lent.
    answer: |-
      Le problème est algorithmique : `list.contains()` est en O(n), et appelé dans une boucle sur n éléments, on obtient du O(n²).
      La correction tient en une ligne : convertir la liste en `HashSet` **une seule fois avant** la boucle. La recherche passe en O(1) et le total en O(n). Sur 100 000 éléments, c'est un facteur de plusieurs milliers.
      Le principe général : dès qu'on fait beaucoup de recherches d'appartenance, il faut une structure basée sur le hash. Et si l'ordre compte, LinkedHashSet préserve l'ordre d'insertion sans perdre le O(1).
  - key: scenario-file-retrait-debut
    format: scenario
    question: Un traitement retire les tâches une par une avec `taches.remove(0)` sur une `ArrayList` de 500 000 éléments. Il est très lent. Pourquoi, et que fais-tu ?
    answer: |-
      `remove(0)` décale tous les éléments restants : chaque retrait est en O(n), et vider la liste coûte O(n²). C'est une
      file : j'utilise une `ArrayDeque` (`poll()` en O(1)). Si je dois garder une `ArrayList`, je la parcours avec un
      index qui avance, ou je retire depuis la fin. Je vérifie avec une mesure (JMH ou simple chronométrage) avant et
      après.
  - key: scenario-classement
    format: scenario
    question: Tu dois maintenir un classement de joueurs, mis à jour en permanence, et afficher souvent le top 10. Quelles structures ?
    answer: |-
      Une `HashMap<JoueurId, Score>` pour retrouver le score d'un joueur en O(1), et une `TreeSet` (ou `TreeMap`) triée par
      score puis par identifiant (pour départager, sinon deux scores égaux se confondraient) pour lire le top 10 en
      O(log n + 10). Une mise à jour retire l'ancienne entrée de l'arbre, puis insère la nouvelle : O(log n). Si les mises à
      jour sont rares et les lectures peu fréquentes, trier une liste à la demande suffit. À grande échelle et partagé entre
      serveurs, un sorted set Redis fait exactement cela.
  - key: scenario-choix-structure
    format: scenario
    question: On te demande « quelle collection choisirais-tu ? » sans plus de contexte. Comment réponds-tu ?
    answer: |-
      Je pose les questions qui déterminent le choix : faut-il un accès par index ? des recherches par valeur ou par clé ?
      un ordre (d'insertion, trié) ? des doublons ? des ajouts et retraits aux extrémités ? un accès concurrent ? Puis
      j'associe : `ArrayList` par défaut pour une séquence, `HashSet` ou `HashMap` pour l'appartenance et les clés,
      `LinkedHashMap` pour l'ordre d'insertion, `TreeMap` pour le tri et les intervalles, `ArrayDeque` pour une pile ou une
      file, une collection concurrente en multi-thread. Et je rappelle que la constante compte : je mesure si les
      performances sont critiques.
