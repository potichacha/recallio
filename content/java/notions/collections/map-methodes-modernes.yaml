notion: map-methodes-modernes
lesson: |-
  Depuis Java 8, `Map` offre des méthodes qui remplacent les motifs « tester puis écrire » :

  | Méthode | Rôle |
  |---|---|
  | `getOrDefault(k, d)` | la valeur, ou `d` si la clé manque |
  | `putIfAbsent(k, v)` | ajoute si absente ; renvoie la valeur existante (ou `null`) |
  | `computeIfAbsent(k, f)` | si absente, calcule et range `f(k)` ; renvoie la valeur (existante ou nouvelle) |
  | `computeIfPresent(k, f)` | si présente, remplace par `f(k, v)` |
  | `compute(k, f)` | remplace par `f(k, v)`, que la clé existe ou non |
  | `merge(k, v, f)` | absente : range `v` ; présente : range `f(ancienne, v)` |
  | `replaceAll(f)` | remplace chaque valeur par `f(k, v)` |
  | `remove(k, v)`, `replace(k, ancienne, nouvelle)` | conditionnels |

  ```java
  Map<String, Integer> compteurs = new HashMap<>();
  for (String mot : mots) {
      compteurs.merge(mot, 1, Integer::sum);                   // compter
  }

  Map<String, List<Commande>> parClient = new HashMap<>();
  for (Commande c : commandes) {
      parClient.computeIfAbsent(c.client(), k -> new ArrayList<>()).add(c);   // regrouper
  }
  ```

  - Si la fonction de `compute`, `computeIfPresent` ou `merge` renvoie **`null`**, l'entrée est **supprimée**.
  - `computeIfAbsent` ne crée la valeur que si nécessaire, contrairement à `putIfAbsent(k, new ArrayList<>())`, qui crée
    une liste à chaque appel.
  - Sur une `ConcurrentHashMap`, ces méthodes sont **atomiques**.

  **Piège classique** : `map.put(cle, map.get(cle) + 1)` pour compter. À la première occurrence, `get` renvoie `null` et le
  déballage lève une `NullPointerException`.

  **En entretien** : « `merge(k, 1, Integer::sum)` pour compter, `computeIfAbsent(k, x -> new ArrayList<>()).add(v)` pour
  regrouper ; et une fonction qui renvoie `null` supprime l'entrée. »
cards:
  - key: compter-occurrences-avec-map
    format: course
    question: "Comment compter les occurrences de chaque clé avec une `Map` ?"
    choices:
      - {text: "`map.merge(cle, 1, Integer::sum)`", correct: true}
      - {text: "`map.put(cle, map.get(cle) + 1)`", correct: false}
      - {text: "`map.putIfAbsent(cle, 1)`", correct: false}
      - {text: "`map.compute(cle, (k, v) -> v + 1)`", correct: false}
    answer: "`map.merge(cle, 1, Integer::sum)` range 1 à la première occurrence, puis additionne. `get(cle) + 1` et `compute` avec `v + 1` lèvent une `NullPointerException` sur une clé absente."
  - key: regrouper
    format: course
    question: Comment regrouper des éléments par clé dans une `Map<K, List<V>>` ?
    choices:
      - {text: "`map.computeIfAbsent(cle, k -> new ArrayList<>()).add(element)`", correct: true}
      - {text: "`map.put(cle, List.of(element))`", correct: false}
      - {text: "`map.get(cle).add(element)`", correct: false}
      - {text: "`map.putIfAbsent(cle, new ArrayList<>()).add(element)`", correct: false}
    answer: "`computeIfAbsent` crée la liste à la première occurrence, puis la renvoie et la réutilise. `putIfAbsent` renvoie `null` quand la clé était absente, et `put` écrase la liste."
  - key: null-supprime
    format: course
    question: Que se passe-t-il si la fonction passée à `merge` ou `compute` renvoie `null` ?
    choices:
      - {text: "L'entrée est supprimée de la map", correct: true}
      - {text: "La clé est gardée, associée à `null`", correct: false}
      - {text: "Une `NullPointerException` est levée", correct: false}
      - {text: "La map garde l'ancienne valeur", correct: false}
    answer: L'entrée est supprimée de la map.
  - key: put-if-absent-vs-compute
    format: course
    question: Pourquoi préférer `computeIfAbsent` à `putIfAbsent(k, new ArrayList<>())` ?
    choices:
      - {text: "`putIfAbsent` crée la liste à chaque appel ; `computeIfAbsent` seulement si la clé manque", correct: true}
      - {text: "`putIfAbsent` écrase la valeur présente ; `computeIfAbsent` garde celle qui est là", correct: false}
      - {text: "`putIfAbsent` n'existe que sur `ConcurrentHashMap` ; `computeIfAbsent` sur toutes", correct: false}
      - {text: "`putIfAbsent` renvoie toujours la nouvelle liste ; `computeIfAbsent` renvoie `null`", correct: false}
    answer: '`putIfAbsent` évalue son argument à chaque appel, donc crée une liste inutile quand la clé existe ; `computeIfAbsent` ne crée la valeur que si nécessaire, et renvoie la valeur présente.'
  - key: vf-merge-absent
    format: true-false
    question: "`merge(cle, 1, Integer::sum)` sur une clé absente range 1."
    truth: true
    answer: La fonction n'est appelée que si une valeur existe déjà.
  - key: vf-put-if-absent-retour
    format: true-false
    question: "`putIfAbsent` renvoie toujours la nouvelle valeur."
    truth: false
    answer: Il renvoie la valeur existante, ou `null` s'il a ajouté.
  - key: vf-compute-null
    format: true-false
    question: Une fonction de `computeIfPresent` qui renvoie `null` supprime l'entrée.
    truth: true
    answer: C'est un moyen de retirer une entrée selon sa valeur.
  - key: vf-atomique
    format: true-false
    question: "Sur une `ConcurrentHashMap`, `merge` est atomique."
    truth: true
    answer: Contrairement à un `get` suivi d'un `put`.
  - key: qcm-compter
    format: multiple-choice
    question: Quelles écritures comptent correctement les occurrences d'un mot ?
    choices:
      - text: "`compteurs.merge(mot, 1, Integer::sum)`"
        correct: true
      - text: "`compteurs.put(mot, compteurs.getOrDefault(mot, 0) + 1)`"
        correct: true
      - text: "`compteurs.put(mot, compteurs.get(mot) + 1)`"
        correct: false
      - text: "`compteurs.putIfAbsent(mot, 1)`"
        correct: false
    answer: '`get` lève une NPE au premier mot ; `putIfAbsent` ne compte que la première occurrence.'
  - key: qcm-regrouper
    format: multiple-choice
    question: Comment ranger chaque commande dans la liste de son client ?
    choices:
      - {text: "`parClient.computeIfAbsent(c.client(), k -> new ArrayList<>()).add(c)`", correct: true}
      - {text: "`parClient.put(c.client(), new ArrayList<>(List.of(c)))`", correct: false}
      - {text: "`parClient.merge(c.client(), new ArrayList<>(), List::add)`", correct: false}
      - {text: "`parClient.putIfAbsent(c.client(), new ArrayList<>()).add(c)`", correct: false}
    answer: "`computeIfAbsent` crée la liste à la première commande du client, puis la renvoie. `put` écraserait la liste à chaque commande, et `putIfAbsent` renvoie `null` la première fois."
  - key: qcm-remplacer
    format: multiple-choice
    question: Comment augmenter tous les prix d'une `Map<String, Double>` de 10 % ?
    choices:
      - text: "`prix.replaceAll((produit, p) -> p * 1.1)`"
        correct: true
      - text: "`prix.forEach((produit, p) -> p = p * 1.1)`"
        correct: false
      - text: "`prix.values().forEach(p -> p *= 1.1)`"
        correct: false
      - text: "`prix.merge(\"*\", 1.1, Double::sum)`"
        correct: false
    answer: Réaffecter le paramètre d'une lambda ne modifie pas la map.
  - key: qcm-put-if-absent
    format: multiple-choice
    question: "Avec `m = {a=1}`, que renvoie `m.putIfAbsent(\"a\", 9)` ?"
    choices:
      - text: "1, et la map ne change pas"
        correct: true
      - text: "9"
        correct: false
      - text: "`null`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: La valeur existante est conservée et renvoyée.
  - key: trous-merge
    format: fill-in
    question: |-
      Complète pour compter les visites par page :
      ```java
      visites.___(page, 1, Integer::sum);
      ```
    blanks: [[merge]]
    answer: '`merge` range 1 la première fois, puis additionne.'
  - key: trous-compute-if-absent
    format: fill-in
    question: |-
      Complète pour regrouper les mots par longueur :
      ```java
      parLongueur.___(mot.length(), k -> new ArrayList<>()).add(mot);
      ```
    blanks: [[computeIfAbsent]]
    answer: La liste est créée seulement pour une nouvelle longueur.
  - key: trous-put-if-absent
    format: fill-in
    question: |-
      Complète pour ne définir la langue que si elle n'est pas déjà choisie :
      ```java
      preferences.___("langue", "fr");
      ```
    blanks: [[putIfAbsent]]
    answer: "Une valeur constante ne coûte rien : `putIfAbsent` convient."
  - key: trous-replace-all
    format: fill-in
    question: |-
      Complète pour mettre tous les noms en majuscules :
      ```java
      noms.___((id, nom) -> nom.toUpperCase());
      ```
    blanks: [[replaceAll]]
    answer: '`replaceAll` remplace chaque valeur par le résultat de la fonction.'
  - key: code-merge
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> c = new TreeMap<>();
      for (String mot : "a b a c a".split(" ")) {
          c.merge(mot, 1, Integer::sum);
      }
      System.out.println(c);
      ```
    choices:
      - {text: "`{a=3, b=1, c=1}`", correct: true}
      - {text: "`{a=1, b=1, c=1}`", correct: false}
      - {text: "`{a=2, b=1, c=1}`", correct: false}
      - {text: "`{c=1, b=1, a=3}`", correct: false}
    answer: '`{a=3, b=1, c=1}`.'
    check:
      output: "{a=3, b=1, c=1}"
  - key: code-compute-if-absent
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<Character, List<String>> parInitiale = new TreeMap<>();
      for (String n : List.of("ada", "alan", "bob")) {
          parInitiale.computeIfAbsent(n.charAt(0), k -> new ArrayList<>()).add(n);
      }
      System.out.println(parInitiale);
      ```
    choices:
      - {text: "`{a=[ada, alan], b=[bob]}`", correct: true}
      - {text: "`{a=[alan], b=[bob]}`", correct: false}
      - {text: "`{a=[ada], b=[bob]}`", correct: false}
      - {text: "`{a=[ada, alan, bob]}`", correct: false}
    answer: '`{a=[ada, alan], b=[bob]}`.'
    check:
      output: "{a=[ada, alan], b=[bob]}"
  - key: code-put-if-absent
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> m = new HashMap<>(Map.of("a", 1));
      System.out.println(m.putIfAbsent("a", 9) + " " + m.putIfAbsent("b", 2) + " " + m.get("a"));
      ```
    choices:
      - {text: "`1 null 1`", correct: true}
      - {text: "`9 2 9`", correct: false}
      - {text: "`null null 9`", correct: false}
      - {text: "`1 2 1`", correct: false}
    answer: '`1 null 1` : la valeur existante est gardée et renvoyée ; pour une clé nouvelle, `null`.'
    check:
      output: "1 null 1"
  - key: code-compute-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> stock = new HashMap<>(Map.of("pomme", 1));
      stock.computeIfPresent("pomme", (k, v) -> v - 1 == 0 ? null : v - 1);
      System.out.println(stock.containsKey("pomme"));
      ```
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
      - {text: "Une `UnsupportedOperationException`", correct: false}
    answer: '`false` : la fonction a renvoyé `null`, et l''entrée a été supprimée.'
    check:
      output: "false"
  - key: bug-compteur-npe
    format: bug-fix
    question: |-
      Ce comptage lève une `NullPointerException` au premier mot. Quelle correction est la bonne ?
      ```java
      for (String mot : mots) {
          compteurs.put(mot, compteurs.get(mot) + 1);
      }
      ```
    choices:
      - {text: "`compteurs.merge(mot, 1, Integer::sum)`, qui gère la première occurrence", correct: true}
      - {text: "`compteurs.putIfAbsent(mot, compteurs.get(mot) + 1)`, qui gère l'absence", correct: false}
      - {text: "`compteurs.compute(mot, (k, v) -> v + 1)`, qui crée la clé au besoin", correct: false}
      - {text: "`compteurs.replace(mot, compteurs.get(mot) + 1)`, qui ne touche que l'existant", correct: false}
    answer: |-
      ```java
      for (String mot : mots) {
          compteurs.merge(mot, 1, Integer::sum);
      }
      ```
      Pour une clé absente, `get` renvoie `null`, et `null + 1` lève l'exception. `merge` gère la première occurrence.
  - key: bug-contains-put
    format: bug-fix
    question: |-
      Quelle écriture remplace ces trois recherches dans la map par une seule ?
      ```java
      if (!parService.containsKey(e.service())) {
          parService.put(e.service(), new ArrayList<>());
      }
      parService.get(e.service()).add(e);
      ```
    choices:
      - {text: "`parService.computeIfAbsent(e.service(), k -> new ArrayList<>()).add(e);`", correct: true}
      - {text: "`parService.putIfAbsent(e.service(), new ArrayList<>()).add(e);`", correct: false}
      - {text: "`parService.put(e.service(), new ArrayList<>(List.of(e)));`", correct: false}
      - {text: "`parService.merge(e.service(), List.of(e), (a, b) -> a);`", correct: false}
    answer: |-
      ```java
      parService.computeIfAbsent(e.service(), k -> new ArrayList<>()).add(e);
      ```
      Une seule ligne, et trois recherches dans la map deviennent une.
  - key: bug-put-if-absent-couteux
    format: bug-fix
    question: |-
      Le profilage montre des millions de listes créées pour rien. Quelle correction est la bonne ?
      ```java
      index.putIfAbsent(cle, new ArrayList<>());
      index.get(cle).add(valeur);
      ```
    choices:
      - {text: "`computeIfAbsent`, qui ne crée la liste que si la clé manque", correct: true}
      - {text: "Tester `index.get(cle) == null` juste après le `putIfAbsent`", correct: false}
      - {text: "Remplacer `new ArrayList<>()` par `new ArrayList<>(0)`", correct: false}
      - {text: "Remplacer `new ArrayList<>()` par `List.of()`, qui ne coûte rien", correct: false}
    answer: |-
      ```java
      index.computeIfAbsent(cle, k -> new ArrayList<>()).add(valeur);
      ```
      L'argument de `putIfAbsent` est évalué à chaque appel, même quand la clé existe. `computeIfAbsent` ne crée la liste
      que si nécessaire (et renvoie celle qui est présente).
  - key: bug-boucle-valeurs
    format: bug-fix
    question: |-
      Ce code ne modifie pas les valeurs de la map. Quelle correction est la bonne ?
      ```java
      for (Double p : prix.values()) {
          p = p * 1.2;
      }
      ```
    choices:
      - {text: "`prix.replaceAll((produit, p) -> p * 1.2)`", correct: true}
      - {text: "Déclarer la variable de boucle `final Double p`", correct: false}
      - {text: "Remplacer `Double` par `double` dans la boucle", correct: false}
      - {text: "Parcourir `prix.keySet()` et réaffecter `p = prix.get(cle) * 1.2`", correct: false}
    answer: |-
      ```java
      prix.replaceAll((produit, p) -> p * 1.2);
      ```
      Réaffecter la variable de boucle ne touche pas la map. `replaceAll` remplace chaque valeur.
  - key: dois-regrouper-commandes-client-calculer-total
    format: scenario
    question: "Tu dois regrouper des commandes par client et calculer le total par client. Comment fais-tu ?"
    choices:
      - {text: "`totaux.merge(c.clientId(), c.montant(), BigDecimal::add)`, ou un `GROUP BY` en base si le volume est énorme", correct: true}
      - {text: "Une `HashMap<Client, Double>` et un `+=` sur les montants en `double`, plus rapide que `BigDecimal`", correct: false}
      - {text: "`totaux.put(c.clientId(), c.montant())` dans la boucle, la map gardant la somme des valeurs reçues", correct: false}
      - {text: "Tout charger en mémoire depuis la base, même un million de lignes, pour additionner en Java", correct: false}
    answer: |-
      Avec une boucle et une map : `totaux.merge(c.clientId(), c.montant(), BigDecimal::add)`. Ou en stream : `groupingBy(Commande::clientId, reducing(BigDecimal.ZERO, Commande::montant, BigDecimal::add))`.
      Si la volumétrie est très importante, ce calcul a sa place en base avec un `GROUP BY` : on ne rapatrie pas un million de lignes pour les additionner en Java.
  - key: scenario-compteurs-concurrents
    format: scenario
    question: Plusieurs threads incrémentent des compteurs par endpoint. Comment l'écris-tu ?
    choices:
      - {text: "Une `ConcurrentHashMap<String, LongAdder>`, avec `computeIfAbsent(...).increment()`", correct: true}
      - {text: "Une `HashMap<String, Integer>`, avec `put(endpoint, get(endpoint) + 1)`", correct: false}
      - {text: "Une `HashMap<String, LongAdder>` déclarée `volatile`, avec `get(...).increment()`", correct: false}
      - {text: "Une `ConcurrentHashMap<String, Integer>`, avec `put(endpoint, get(endpoint) + 1)`", correct: false}
    answer: |-
      Une `ConcurrentHashMap<String, LongAdder>` : `compteurs.computeIfAbsent(endpoint, k -> new LongAdder()).increment()`.
      `computeIfAbsent` est atomique sur une `ConcurrentHashMap`, et `LongAdder` supporte de nombreux incréments
      concurrents mieux qu'un `AtomicLong`. Un `merge(endpoint, 1L, Long::sum)` fonctionnerait aussi. Une `HashMap`
      avec `get`/`put` perdrait des incréments. Et en production, j'utiliserais plutôt les compteurs de Micrometer.
  - key: scenario-cache-calcul
    format: scenario
    question: "Tu veux mémoriser le résultat d'un calcul coûteux par clé. Comment fais-tu ?"
    choices:
      - {text: "`cache.computeIfAbsent(cle, this::calculer)`, avec une taille bornée, ou Caffeine", correct: true}
      - {text: "`cache.putIfAbsent(cle, calculer(cle))`, qui ne garde le calcul que la première fois", correct: false}
      - {text: "`cache.getOrDefault(cle, calculer(cle))`, qui calcule seulement si la clé manque", correct: false}
      - {text: "Une `HashMap` sans limite, remplie au démarrage avec le résultat de chaque clé possible", correct: false}
    answer: |-
      `cache.computeIfAbsent(cle, this::calculer)` : le calcul n'a lieu qu'à la première demande de chaque clé. Sur une
      `ConcurrentHashMap`, il est atomique (deux threads ne le lancent pas en même temps pour la même clé), mais la fonction
      doit rester courte et ne jamais modifier la map elle-même. Je borne aussi la taille (sinon c'est une fuite mémoire)
      et je pense à l'expiration : au-delà d'un cas simple, Caffeine (`LoadingCache`) fait tout cela.
  - key: scenario-index-inverse
    format: scenario
    question: "Comment construis-tu un index inversé (mot → documents qui le contiennent) pour une petite recherche plein texte ?"
    choices:
      - {text: "Mots normalisés, puis `index.computeIfAbsent(mot, k -> new HashSet<>()).add(document.id())`", correct: true}
      - {text: "`index.put(mot, document.id())` pour chaque mot, l'entrée étant mise à jour à chaque document", correct: false}
      - {text: "Une `List<Document>` parcourue à chaque recherche, avec `contains` sur le texte de chacun", correct: false}
      - {text: "Mots tels quels, puis `index.computeIfAbsent(mot, k -> new ArrayList<>()).add(document.id())`", correct: false}
    answer: |-
      Pour chaque document, je découpe le texte en mots normalisés (minuscules, `Locale.ROOT`, sans ponctuation), puis
      `index.computeIfAbsent(mot, k -> new HashSet<>()).add(document.id())`. Un `Set` évite les doublons quand un mot
      apparaît plusieurs fois. La recherche d'un mot est alors un `getOrDefault(mot, Set.of())`, et une recherche à
      plusieurs mots l'intersection des ensembles (`retainAll` sur une copie). Au-delà d'un petit volume, un vrai moteur
      (PostgreSQL full-text, Elasticsearch) s'impose.
