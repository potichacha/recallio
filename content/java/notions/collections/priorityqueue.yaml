notion: priorityqueue
lesson: |-
  Une `PriorityQueue` est une file où l'on retire toujours **le plus petit élément** (selon l'ordre naturel ou un
  comparateur), et non le premier arrivé. Elle repose sur un **tas binaire** stocké dans un tableau.

  ```java
  PriorityQueue<Integer> tas = new PriorityQueue<>(List.of(5, 1, 3));
  tas.poll();                                           // 1
  tas.peek();                                           // 3

  PriorityQueue<Tache> taches = new PriorityQueue<>(Comparator.comparing(Tache::priorite).reversed());
  ```

  | Opération | Complexité |
  |---|---|
  | `offer`, `poll` | O(log n) |
  | `peek` | O(1) |
  | `contains`, `remove(objet)` | O(n) |

  - L'**itération** et `toString` ne sont **pas** triés : seul `poll` respecte l'ordre. Pour tout lire dans l'ordre, on
    appelle `poll` jusqu'à vider la file.
  - Pour un **tas max**, on passe `Comparator.reverseOrder()`.
  - Modifier un élément déjà dans la file ne le reclasse pas : on le retire, on le modifie, on le remet.
  - `null` est refusé ; la classe n'est pas thread-safe (`PriorityBlockingQueue` en concurrence).
  - Usage classique : les **k plus grands** éléments d'un flux avec un tas min de taille k (O(n log k)), l'algorithme de
    Dijkstra, un ordonnanceur de tâches.

  **Piège classique** : `System.out.println(tas)` pour vérifier l'ordre. On voit l'ordre interne du tableau, qui n'est
  pas trié.

  **En entretien** : « Un tas binaire : `offer` et `poll` en O(log n), `peek` en O(1) ; l'itération n'est pas triée. Pour
  les k plus grands, un tas min de taille k. »
cards:
  - key: iterateur-priorityqueue-trie
    format: course
    question: L'itérateur d'une PriorityQueue est-il trié ?
    answer: Non, seul poll() respecte l'ordre.
  - key: structure
    format: course
    question: Sur quelle structure repose `PriorityQueue`, et quelles sont ses complexités ?
    answer: Un tas binaire dans un tableau ; `offer` et `poll` en O(log n), `peek` en O(1), `contains` en O(n).
  - key: tas-max
    format: course
    question: Comment obtenir un tas max avec `PriorityQueue` ?
    answer: En passant un comparateur inversé, par exemple `new PriorityQueue<>(Comparator.reverseOrder())`.
  - key: top-k
    format: course
    question: Comment garder les k plus grands éléments d'un très grand flux ?
    answer: "Un tas min de taille k : on ajoute chaque élément, et on retire le plus petit dès que la taille dépasse k ; O(n log k) en temps et O(k) en mémoire."
  - key: vf-premier-arrive
    format: true-false
    question: "`poll` sur une `PriorityQueue` renvoie le premier élément ajouté."
    truth: false
    answer: Il renvoie le plus petit selon l'ordre.
  - key: vf-to-string
    format: true-false
    question: "`toString` d'une `PriorityQueue` affiche ses éléments triés."
    truth: false
    answer: Il suit l'ordre interne du tas.
  - key: vf-peek
    format: true-false
    question: "`peek` sur une `PriorityQueue` est en O(1)."
    truth: true
    answer: Le plus petit élément est à la racine du tas.
  - key: vf-modification
    format: true-false
    question: Modifier la priorité d'un objet déjà dans la file le reclasse automatiquement.
    truth: false
    answer: Il faut le retirer et le réinsérer.
  - key: qcm-poll
    format: multiple-choice
    question: "Que renvoie `new PriorityQueue<>(List.of(4, 1, 3)).poll()` ?"
    choices:
      - text: "1"
        correct: true
      - text: "4"
        correct: false
      - text: "3"
        correct: false
      - text: "`null`"
        correct: false
    answer: L'ordre naturel place 1 en tête.
  - key: qcm-ordre
    format: multiple-choice
    question: Comment lire tous les éléments d'une `PriorityQueue` dans l'ordre ?
    choices:
      - text: "Appeler `poll` jusqu'à ce qu'elle soit vide"
        correct: true
      - text: "La parcourir avec une boucle for-each"
        correct: false
      - text: "Afficher son `toString`"
        correct: false
      - text: "Appeler `stream().toList()`"
        correct: false
    answer: Seul `poll` respecte la priorité ; l'itération suit l'ordre interne.
  - key: qcm-complexite
    format: multiple-choice
    question: Quelles opérations sont en O(log n) sur une `PriorityQueue` ?
    choices:
      - text: "`offer`"
        correct: true
      - text: "`poll`"
        correct: true
      - text: "`peek`"
        correct: false
      - text: "`contains`"
        correct: false
    answer: '`peek` est en O(1), `contains` en O(n).'
  - key: qcm-urgent
    format: multiple-choice
    question: Comment traiter d'abord les tickets de plus haute priorité (un entier, plus grand = plus urgent) ?
    choices:
      - text: "`new PriorityQueue<>(Comparator.comparingInt(Ticket::priorite).reversed())`"
        correct: true
      - text: "`new PriorityQueue<>(Comparator.comparingInt(Ticket::priorite))`"
        correct: false
      - text: "`new ArrayDeque<>()`"
        correct: false
      - text: "`new TreeSet<>()`"
        correct: false
    answer: "Par défaut, le plus petit sort en premier : on inverse l'ordre."
  - key: code-poll
    format: code-output
    question: |-
      ```java
      PriorityQueue<Integer> tas = new PriorityQueue<>(List.of(5, 1, 4, 2));
      StringBuilder sb = new StringBuilder();
      while (!tas.isEmpty()) sb.append(tas.poll()).append(' ');
      System.out.println(sb.toString().trim());
      ```
    answer: '`1 2 4 5`.'
    check:
      output: "1 2 4 5"
  - key: code-tas-max
    format: code-output
    question: |-
      ```java
      PriorityQueue<String> tas = new PriorityQueue<>(Comparator.reverseOrder());
      tas.addAll(List.of("b", "c", "a"));
      System.out.println(tas.poll() + tas.poll());
      ```
    answer: '`cb` : ordre inverse.'
    check:
      output: "cb"
  - key: code-peek
    format: code-output
    question: |-
      ```java
      PriorityQueue<Integer> tas = new PriorityQueue<>();
      tas.offer(7);
      tas.offer(3);
      System.out.println(tas.peek() + " " + tas.size());
      ```
    answer: '`3 2` : `peek` ne retire rien.'
    check:
      output: "3 2"
  - key: code-top-k
    format: code-output
    question: |-
      ```java
      PriorityQueue<Integer> top = new PriorityQueue<>();
      for (int x : new int[]{4, 9, 1, 7, 3}) {
          top.offer(x);
          if (top.size() > 2) top.poll();
      }
      System.out.println(top.poll() + " " + top.poll());
      ```
    answer: '`7 9` : le tas min de taille 2 garde les deux plus grands.'
    check:
      output: "7 9"
  - key: bug-iteration
    format: bug-fix
    question: |-
      Ce code n'affiche pas les tâches par priorité :
      ```java
      for (Tache t : taches) {        // PriorityQueue<Tache>
          System.out.println(t);
      }
      ```
    answer: |-
      ```java
      while (!taches.isEmpty()) {
          System.out.println(taches.poll());
      }
      // ou, sans vider : taches.stream().sorted(comparateur).forEach(...)
      ```
      L'itération suit l'ordre interne du tas ; seul `poll` respecte la priorité.
  - key: bug-tri-complet
    format: bug-fix
    question: |-
      Ce code trie un million de scores pour n'en garder que dix :
      ```java
      List<Integer> top10 = scores.stream().sorted(Comparator.reverseOrder()).limit(10).toList();
      ```
      Les scores arrivent en flux et ne tiennent pas tous en mémoire.
    answer: |-
      ```java
      PriorityQueue<Integer> top = new PriorityQueue<>();
      for (int score : flux) {
          top.offer(score);
          if (top.size() > 10) top.poll();
      }
      ```
      Un tas min de taille 10 garde les dix plus grands en O(n log 10) et en mémoire constante.
  - key: bug-ordre-inverse
    format: bug-fix
    question: |-
      Les tickets les moins urgents (priorité 1) sortent avant les plus urgents (priorité 5) :
      ```java
      Queue<Ticket> file = new PriorityQueue<>(Comparator.comparingInt(Ticket::priorite));
      ```
    answer: |-
      ```java
      Queue<Ticket> file = new PriorityQueue<>(Comparator.comparingInt(Ticket::priorite).reversed());
      ```
      Une `PriorityQueue` sort d'abord le plus petit : pour sortir le plus grand, on inverse le comparateur.
  - key: bug-modification
    format: bug-fix
    question: |-
      Après ce changement de priorité, la tâche ne sort pas au bon moment :
      ```java
      tache.setPriorite(10);     // la tâche est déjà dans la PriorityQueue
      ```
    answer: |-
      ```java
      file.remove(tache);
      tache.setPriorite(10);
      file.offer(tache);
      ```
      Le tas ne sait pas qu'un élément a changé : il faut le retirer et le réinsérer (ou utiliser des éléments
      immuables, remplacés par une nouvelle version).
