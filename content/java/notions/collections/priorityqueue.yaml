notion: priorityqueue
lesson: |-
  Une `PriorityQueue` est une file où l'on retire toujours **le plus petit élément** (selon l'ordre naturel ou un
  comparateur), et non le premier arrivé. Elle repose sur un **tas binaire** stocké dans un tableau.

  ```java
  PriorityQueue<Integer> tas = new PriorityQueue<>(List.of(5, 1, 3));
  tas.poll();                                           // 1
  tas.peek();                                           // 3

  PriorityQueue<Tache> taches = new PriorityQueue<>(Comparator.comparing(Tache::priorite).reversed());
  ```

  | Opération | Complexité |
  |---|---|
  | `offer`, `poll` | O(log n) |
  | `peek` | O(1) |
  | `contains`, `remove(objet)` | O(n) |

  - L'**itération** et `toString` ne sont **pas** triés : seul `poll` respecte l'ordre. Pour tout lire dans l'ordre, on
    appelle `poll` jusqu'à vider la file.
  - Pour un **tas max**, on passe `Comparator.reverseOrder()`.
  - Modifier un élément déjà dans la file ne le reclasse pas : on le retire, on le modifie, on le remet.
  - `null` est refusé ; la classe n'est pas thread-safe (`PriorityBlockingQueue` en concurrence).
  - Usage classique : les **k plus grands** éléments d'un flux avec un tas min de taille k (O(n log k)), l'algorithme de
    Dijkstra, un ordonnanceur de tâches.

  **Piège classique** : `System.out.println(tas)` pour vérifier l'ordre. On voit l'ordre interne du tableau, qui n'est
  pas trié.

  **En entretien** : « Un tas binaire : `offer` et `poll` en O(log n), `peek` en O(1) ; l'itération n'est pas triée. Pour
  les k plus grands, un tas min de taille k. »
cards:
  - key: iterateur-priorityqueue-trie
    format: course
    question: "L'itérateur d'une `PriorityQueue` parcourt-il les éléments dans l'ordre de priorité ?"
    choices:
      - {text: "Non : il suit l'ordre interne du tas ; seul `poll()` respecte la priorité", correct: true}
      - {text: "Oui : il parcourt les éléments du plus petit au plus grand", correct: false}
      - {text: "Oui, mais seulement avec un comparateur passé au constructeur", correct: false}
      - {text: "Non : il suit l'ordre d'insertion, comme une `ArrayDeque`", correct: false}
    answer: "Non : l'itérateur suit l'ordre du tableau interne du tas, qui n'est que partiellement ordonné. Seul `poll()` sort les éléments par priorité."
  - key: structure
    format: course
    question: Sur quelle structure repose `PriorityQueue`, et quelles sont ses complexités ?
    choices:
      - {text: "Un tas binaire dans un tableau : `offer` et `poll` en O(log n), `peek` en O(1)", correct: true}
      - {text: "Un arbre rouge-noir : `offer`, `poll` et `peek` en O(log n), `contains` aussi", correct: false}
      - {text: "Une liste triée : `offer` en O(n), `poll` et `peek` en O(1)", correct: false}
      - {text: "Une table de hachage : `offer`, `poll` et `peek` en O(1) en moyenne", correct: false}
    answer: Un tas binaire dans un tableau ; `offer` et `poll` en O(log n), `peek` en O(1), `contains` en O(n).
  - key: tas-max
    format: course
    question: Comment obtenir un tas max avec `PriorityQueue` ?
    choices:
      - {text: "Avec un comparateur inversé : `new PriorityQueue<>(Comparator.reverseOrder())`", correct: true}
      - {text: "En passant `true` au constructeur : `new PriorityQueue<>(true)`, l'option du tas max", correct: false}
      - {text: "En retirant par la fin avec `pollLast()`, qui donne le plus grand élément", correct: false}
      - {text: "En appelant `Collections.reverse(file)` après chaque ajout dans la file", correct: false}
    answer: En passant un comparateur inversé, par exemple `new PriorityQueue<>(Comparator.reverseOrder())`.
  - key: top-k
    format: course
    question: Comment garder les k plus grands éléments d'un très grand flux ?
    choices:
      - {text: "Un tas min de taille k, dont on retire le plus petit dès que la taille dépasse k", correct: true}
      - {text: "Un tas max de taille k, dont on retire le plus grand dès que la taille dépasse k", correct: false}
      - {text: "Une liste de tout le flux, triée à la fin, dont on garde les k derniers éléments", correct: false}
      - {text: "Un `TreeSet` de tout le flux, dont on lit les k derniers éléments à la fin", correct: false}
    answer: "Un tas min de taille k : on ajoute chaque élément, et on retire le plus petit dès que la taille dépasse k ; O(n log k) en temps et O(k) en mémoire. Trier tout le flux demande de le garder entier en mémoire."
  - key: vf-premier-arrive
    format: true-false
    question: "`poll` sur une `PriorityQueue` renvoie le premier élément ajouté."
    truth: false
    answer: Il renvoie le plus petit selon l'ordre.
  - key: vf-to-string
    format: true-false
    question: "`toString` d'une `PriorityQueue` affiche ses éléments triés."
    truth: false
    answer: Il suit l'ordre interne du tas.
  - key: vf-peek
    format: true-false
    question: "`peek` sur une `PriorityQueue` est en O(1)."
    truth: true
    answer: Le plus petit élément est à la racine du tas.
  - key: vf-modification
    format: true-false
    question: Modifier la priorité d'un objet déjà dans la file le reclasse automatiquement.
    truth: false
    answer: Il faut le retirer et le réinsérer.
  - key: qcm-poll
    format: multiple-choice
    question: "Que renvoie `new PriorityQueue<>(List.of(4, 1, 3)).poll()` ?"
    choices:
      - text: "1"
        correct: true
      - text: "4"
        correct: false
      - text: "3"
        correct: false
      - text: "`null`"
        correct: false
    answer: L'ordre naturel place 1 en tête.
  - key: qcm-ordre
    format: multiple-choice
    question: Comment lire tous les éléments d'une `PriorityQueue` dans l'ordre ?
    choices:
      - text: "Appeler `poll` jusqu'à ce qu'elle soit vide"
        correct: true
      - text: "La parcourir avec une boucle for-each"
        correct: false
      - text: "Afficher son `toString`"
        correct: false
      - text: "Appeler `stream().toList()`"
        correct: false
    answer: Seul `poll` respecte la priorité ; l'itération suit l'ordre interne.
  - key: qcm-complexite
    format: multiple-choice
    question: Quelles opérations sont en O(log n) sur une `PriorityQueue` ?
    choices:
      - text: "`offer`"
        correct: true
      - text: "`poll`"
        correct: true
      - text: "`peek`"
        correct: false
      - text: "`contains`"
        correct: false
    answer: '`peek` est en O(1), `contains` en O(n).'
  - key: qcm-urgent
    format: multiple-choice
    question: Comment traiter d'abord les tickets de plus haute priorité (un entier, plus grand = plus urgent) ?
    choices:
      - text: "`new PriorityQueue<>(Comparator.comparingInt(Ticket::priorite).reversed())`"
        correct: true
      - text: "`new PriorityQueue<>(Comparator.comparingInt(Ticket::priorite))`"
        correct: false
      - text: "`new ArrayDeque<>()`"
        correct: false
      - text: "`new TreeSet<>()`"
        correct: false
    answer: "Par défaut, le plus petit sort en premier : on inverse l'ordre."
  - key: code-poll
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      PriorityQueue<Integer> tas = new PriorityQueue<>(List.of(5, 1, 4, 2));
      StringBuilder sb = new StringBuilder();
      while (!tas.isEmpty()) sb.append(tas.poll()).append(' ');
      System.out.println(sb.toString().trim());
      ```
    choices:
      - {text: "`1 2 4 5`", correct: true}
      - {text: "`5 1 4 2`", correct: false}
      - {text: "`5 4 2 1`", correct: false}
      - {text: "`1 5 4 2`", correct: false}
    answer: '`1 2 4 5`.'
    check:
      output: "1 2 4 5"
  - key: code-tas-max
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      PriorityQueue<String> tas = new PriorityQueue<>(Comparator.reverseOrder());
      tas.addAll(List.of("b", "c", "a"));
      System.out.println(tas.poll() + tas.poll());
      ```
    choices:
      - {text: "`cb`", correct: true}
      - {text: "`ab`", correct: false}
      - {text: "`bc`", correct: false}
      - {text: "`ca`", correct: false}
    answer: '`cb` : ordre inverse.'
    check:
      output: "cb"
  - key: code-peek
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      PriorityQueue<Integer> tas = new PriorityQueue<>();
      tas.offer(7);
      tas.offer(3);
      System.out.println(tas.peek() + " " + tas.size());
      ```
    choices:
      - {text: "`3 2`", correct: true}
      - {text: "`3 1`", correct: false}
      - {text: "`7 2`", correct: false}
      - {text: "`7 1`", correct: false}
    answer: '`3 2` : `peek` ne retire rien.'
    check:
      output: "3 2"
  - key: code-top-k
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      PriorityQueue<Integer> top = new PriorityQueue<>();
      for (int x : new int[]{4, 9, 1, 7, 3}) {
          top.offer(x);
          if (top.size() > 2) top.poll();
      }
      System.out.println(top.poll() + " " + top.poll());
      ```
    choices:
      - {text: "`7 9`", correct: true}
      - {text: "`9 7`", correct: false}
      - {text: "`1 3`", correct: false}
      - {text: "`4 9`", correct: false}
    answer: '`7 9` : le tas min de taille 2 garde les deux plus grands.'
    check:
      output: "7 9"
  - key: bug-iteration
    format: bug-fix
    question: |-
      Ce code n'affiche pas les tâches par priorité. Quelle correction est la bonne ?
      ```java
      for (Tache t : taches) {        // PriorityQueue<Tache>
          System.out.println(t);
      }
      ```
    choices:
      - {text: "Retirer avec `poll()` tant que la file n'est pas vide, ou trier un flux", correct: true}
      - {text: "Parcourir avec un `Iterator` explicite plutôt qu'avec un for-each", correct: false}
      - {text: "Créer la `PriorityQueue` avec une capacité initiale suffisante", correct: false}
      - {text: "Parcourir avec `taches.forEach(System.out::println)`", correct: false}
    answer: |-
      ```java
      while (!taches.isEmpty()) {
          System.out.println(taches.poll());
      }
      // ou, sans vider : taches.stream().sorted(comparateur).forEach(...)
      ```
      L'itération suit l'ordre interne du tas ; seul `poll` respecte la priorité.
  - key: bug-tri-complet
    format: bug-fix
    question: |-
      Ce code trie un million de scores pour n'en garder que dix :
      ```java
      List<Integer> top10 = scores.stream().sorted(Comparator.reverseOrder()).limit(10).toList();
      ```
      Les scores arrivent en flux et ne tiennent pas tous en mémoire. Quelle correction est la bonne ?
    choices:
      - {text: "Un tas min de taille 10, dont on retire le plus petit au-delà de 10", correct: true}
      - {text: "Un tas max de tous les scores, dont on retire les dix premiers", correct: false}
      - {text: "Un `parallel()` sur le flux, pour trier le million de scores plus vite", correct: false}
      - {text: "Une `ArrayList` de tous les scores, triée par `Collections.sort`", correct: false}
    answer: |-
      ```java
      PriorityQueue<Integer> top = new PriorityQueue<>();
      for (int score : flux) {
          top.offer(score);
          if (top.size() > 10) top.poll();
      }
      ```
      Un tas min de taille 10 garde les dix plus grands en O(n log 10) et en mémoire constante.
  - key: bug-ordre-inverse
    format: bug-fix
    question: |-
      Les tickets les moins urgents (priorité 1) sortent avant les plus urgents (priorité 5). Quelle correction est la bonne ?
      ```java
      Queue<Ticket> file = new PriorityQueue<>(Comparator.comparingInt(Ticket::priorite));
      ```
    choices:
      - {text: "Inverser le comparateur : `comparingInt(Ticket::priorite).reversed()`", correct: true}
      - {text: "Retirer les tickets avec `peek()` au lieu de `poll()`", correct: false}
      - {text: "Parcourir la file à l'envers avec un `descendingIterator()`", correct: false}
      - {text: "Remplacer la `PriorityQueue` par une `ArrayDeque` triée", correct: false}
    answer: |-
      ```java
      Queue<Ticket> file = new PriorityQueue<>(Comparator.comparingInt(Ticket::priorite).reversed());
      ```
      Une `PriorityQueue` sort d'abord le plus petit : pour sortir le plus grand, on inverse le comparateur.
  - key: bug-modification
    format: bug-fix
    question: |-
      Après ce changement de priorité, la tâche ne sort pas au bon moment. Quelle correction est la bonne ?
      ```java
      tache.setPriorite(10);     // la tâche est déjà dans la PriorityQueue
      ```
    choices:
      - {text: "Retirer la tâche, changer sa priorité, puis la réinsérer", correct: true}
      - {text: "Changer la priorité, puis appeler `file.offer(tache)` de nouveau", correct: false}
      - {text: "Changer la priorité, puis appeler `file.peek()` pour réordonner", correct: false}
      - {text: "Changer la priorité dans un bloc `synchronized (file)`", correct: false}
    answer: |-
      ```java
      file.remove(tache);
      tache.setPriorite(10);
      file.offer(tache);
      ```
      Le tas ne sait pas qu'un élément a changé : il faut le retirer et le réinsérer (ou utiliser des éléments
      immuables, remplacés par une nouvelle version).
