notion: queue-deque
lesson: |-
  Une **`Queue`** est une file : on ajoute d'un côté, on retire de l'autre (FIFO, premier entré, premier sorti). Une
  **`Deque`** (*double-ended queue*) permet d'ajouter et de retirer **aux deux bouts** : elle sert de file **et** de pile
  (LIFO).

  `ArrayDeque`, un tableau circulaire, est l'implémentation à choisir dans les deux cas : opérations aux extrémités en
  O(1), plus rapide que `LinkedList` et que l'ancienne `Stack`.

  ```java
  Deque<String> pile = new ArrayDeque<>();
  pile.push("a");            // ajoute en tête
  pile.push("b");
  pile.pop();                // "b" : le dernier ajouté
  pile.peek();               // "a", sans le retirer

  Queue<String> file = new ArrayDeque<>();
  file.offer("a");           // ajoute en queue
  file.offer("b");
  file.poll();               // "a" : le premier ajouté
  ```

  Chaque opération existe en deux versions :

  | | lève une exception | renvoie une valeur spéciale |
  |---|---|---|
  | ajouter | `add` | `offer` (`false` si pleine) |
  | retirer | `remove` | `poll` (`null` si vide) |
  | consulter | `element` | `peek` (`null` si vide) |

  - `pop` et `push` travaillent en **tête** ; `pop` sur une pile vide lève `NoSuchElementException`.
  - `ArrayDeque` **refuse `null`** (puisque `null` signifie « vide » pour `poll` et `peek`).
  - Usages : une pile pour les parenthèses équilibrées, l'annulation (*undo*) ou un parcours en profondeur ; une file
    pour un parcours en largeur ou des tâches à traiter dans l'ordre.
  - Pour une file partagée entre threads : une `BlockingQueue` (`LinkedBlockingQueue`, `ArrayBlockingQueue`).

  **Piège classique** : mélanger les deux bouts. `push` ajoute en tête, `offer` en queue : une pile alimentée par
  `offer` et vidée par `pop` se comporte comme une file.

  **En entretien** : « `ArrayDeque` pour une pile (`push`, `pop`) comme pour une file (`offer`, `poll`) ; `poll` et `peek`
  renvoient `null` sur une structure vide, `remove` et `pop` lèvent une exception. »
cards:
  - key: pile-file
    format: course
    question: Quelle différence entre une pile et une file ?
    choices:
      - {text: "Une pile est LIFO (dernier entré, premier sorti) ; une file est FIFO (premier entré, premier sorti)", correct: true}
      - {text: "Une pile est FIFO (premier entré, premier sorti) ; une file est LIFO (dernier entré, premier sorti)", correct: false}
      - {text: "Une pile est triée par priorité ; une file garde l'ordre d'insertion mais interdit le retrait en tête", correct: false}
      - {text: "Aucune : ce sont deux noms de la même structure, selon qu'on la lit ou qu'on y écrit", correct: false}
    answer: Une pile est LIFO (le dernier ajouté sort le premier), une file est FIFO (le premier ajouté sort le premier).
  - key: arraydeque
    format: course
    question: Quelle implémentation choisir pour une pile ou une file en Java ?
    choices:
      - {text: "`ArrayDeque`, en O(1) aux deux bouts, plus rapide que `LinkedList` et `Stack`", correct: true}
      - {text: "`Stack` pour une pile et `LinkedList` pour une file, les classes prévues pour ça", correct: false}
      - {text: "`ArrayList`, avec `add(0, x)` et `remove(0)` pour travailler en tête", correct: false}
      - {text: "`PriorityQueue`, qui sert de pile ou de file selon le comparateur donné", correct: false}
    answer: '`ArrayDeque` : opérations aux deux bouts en O(1), plus rapide que `LinkedList` et que `Stack`, qui est synchronisée et héritée de `Vector`.'
  - key: poll-remove
    format: course
    question: Quelle différence entre `poll()` et `remove()` sur une file vide ?
    choices:
      - {text: "`poll()` renvoie `null` ; `remove()` lève une `NoSuchElementException`", correct: true}
      - {text: "`poll()` lève une `NoSuchElementException` ; `remove()` renvoie `null`", correct: false}
      - {text: "Aucune : les deux renvoient `null` sur une file vide", correct: false}
      - {text: "`poll()` attend qu'un élément arrive ; `remove()` renvoie `null`", correct: false}
    answer: '`poll()` renvoie `null`, `remove()` lève une `NoSuchElementException`.'
  - key: null-refuse
    format: course
    question: Pourquoi `ArrayDeque` refuse-t-elle `null` ?
    choices:
      - {text: "`poll` et `peek` renvoient `null` pour dire « vide » : un élément `null` s'y confondrait", correct: true}
      - {text: "Son tableau circulaire ne peut stocker aucune référence `null` dans ses cases", correct: false}
      - {text: "Pour être thread-safe : un `null` casserait sa synchronisation interne", correct: false}
      - {text: "Parce qu'elle trie ses éléments, et que `null` ne se compare à rien", correct: false}
    answer: "Parce que `poll` et `peek` utilisent `null` pour dire « vide » : un élément `null` serait indiscernable."
  - key: vf-push-tete
    format: true-false
    question: "`push` ajoute l'élément en tête d'une `Deque`."
    truth: true
    answer: "Et `pop` le retire de la tête : c'est une pile."
  - key: vf-peek-retire
    format: true-false
    question: "`peek` retire l'élément consulté."
    truth: false
    answer: Il le consulte seulement ; `poll` ou `pop` le retirent.
  - key: vf-null
    format: true-false
    question: On peut ajouter `null` dans une `ArrayDeque`.
    truth: false
    answer: Elle lève une `NullPointerException`.
  - key: vf-pop-vide
    format: true-false
    question: "`pop` sur une `ArrayDeque` vide renvoie `null`."
    truth: false
    answer: Il lève une `NoSuchElementException` ; `poll` renverrait `null`.
  - key: qcm-pile
    format: multiple-choice
    question: Comment déclarer une pile en Java moderne ?
    choices:
      - text: "`Deque<Integer> pile = new ArrayDeque<>();`"
        correct: true
      - text: "`Stack<Integer> pile = new Stack<>();`"
        correct: false
      - text: "`Queue<Integer> pile = new PriorityQueue<>();`"
        correct: false
      - text: "`List<Integer> pile = new Vector<>();`"
        correct: false
    answer: '`Stack` fonctionne mais est déconseillée ; la Javadoc recommande `Deque`.'
  - key: qcm-file-vide
    format: multiple-choice
    question: Quelles méthodes renvoient `null` sur une file vide, sans exception ?
    choices:
      - text: "`poll()`"
        correct: true
      - text: "`peek()`"
        correct: true
      - text: "`remove()`"
        correct: false
      - text: "`element()`"
        correct: false
    answer: '`remove` et `element` lèvent une `NoSuchElementException`.'
  - key: qcm-usage
    format: multiple-choice
    question: "Pour lequel de ces besoins une pile est-elle adaptée ?"
    choices:
      - {text: "Vérifier que des parenthèses sont équilibrées", correct: true}
      - {text: "Traiter des commandes dans leur ordre d'arrivée", correct: false}
      - {text: "Parcourir un graphe en largeur, niveau par niveau", correct: false}
      - {text: "Servir les clients d'un guichet, chacun à son tour", correct: false}
    answer: "Une pile (dernier entré, premier sorti) vérifie des parenthèses ou porte un « annuler ». L'ordre d'arrivée et le parcours en largeur demandent une file."
  - key: qcm-concurrent
    format: multiple-choice
    question: Plusieurs threads producteurs déposent des tâches qu'un consommateur attend. Que choisir ?
    choices:
      - {text: "Une `BlockingQueue` (`LinkedBlockingQueue`)", correct: true}
      - {text: "Une `ArrayDeque` partagée entre les threads", correct: false}
      - {text: "Une `ArrayList` dans un `synchronizedList`", correct: false}
      - {text: "Une `PriorityQueue` triée par date d'arrivée", correct: false}
    answer: "`take()` attend qu'une tâche arrive, et la file est thread-safe. `ArrayDeque` et `PriorityQueue` ne le sont pas, et une liste synchronisée ne sait pas faire attendre le consommateur."
  - key: trous-push-pop
    format: fill-in
    question: |-
      Complète pour empiler puis dépiler :
      ```java
      Deque<String> historique = new ArrayDeque<>();
      historique.___("page1");
      String derniere = historique.___();
      ```
    blanks: [[push], [pop]]
    answer: '`push` et `pop` travaillent en tête.'
  - key: trous-offer-poll
    format: fill-in
    question: |-
      Complète pour ajouter une tâche en fin de file, puis retirer la première :
      ```java
      Queue<Tache> taches = new ArrayDeque<>();
      taches.___(tache);
      Tache suivante = taches.___();
      ```
    blanks: [[offer, add], [poll, remove]]
    answer: '`offer` ajoute en queue, `poll` retire en tête (ou renvoie `null`).'
  - key: trous-peek
    format: fill-in
    question: |-
      Complète pour consulter le sommet de la pile sans le retirer :
      ```java
      String sommet = pile.___();
      ```
    blanks: [[peek, peekFirst]]
    answer: '`peek` renvoie `null` si la pile est vide.'
  - key: trous-declaration
    format: fill-in
    question: |-
      Complète avec l'implémentation recommandée :
      ```java
      Deque<Integer> pile = new ___<>();
      ```
    blanks: [[ArrayDeque]]
    answer: Un tableau circulaire, en O(1) aux deux bouts.
  - key: code-pile
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Deque<Integer> pile = new ArrayDeque<>();
      pile.push(1);
      pile.push(2);
      pile.push(3);
      System.out.println(pile.pop() + " " + pile.peek() + " " + pile);
      ```
    choices:
      - {text: "`3 2 [2, 1]`", correct: true}
      - {text: "`1 2 [2, 3]`", correct: false}
      - {text: "`3 2 [1, 2]`", correct: false}
      - {text: "`3 3 [2, 1]`", correct: false}
    answer: '`3 2 [2, 1]` : le dernier empilé sort le premier.'
    check:
      output: "3 2 [2, 1]"
  - key: code-file
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Queue<String> file = new ArrayDeque<>();
      file.offer("a");
      file.offer("b");
      file.offer("c");
      System.out.println(file.poll() + " " + file);
      ```
    choices:
      - {text: "`a [b, c]`", correct: true}
      - {text: "`c [a, b]`", correct: false}
      - {text: "`a [a, b, c]`", correct: false}
      - {text: "`c [b, a]`", correct: false}
    answer: '`a [b, c]` : le premier arrivé sort le premier.'
    check:
      output: "a [b, c]"
  - key: code-vide
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Deque<String> d = new ArrayDeque<>();
      System.out.println(d.poll() + " " + d.peek());
      d.pop();
      ```
    choices:
      - {text: "`null null`, puis une `NoSuchElementException`", correct: true}
      - {text: "Rien : une `NoSuchElementException` dès `poll()`", correct: false}
      - {text: "`null null`, puis rien : `pop()` renvoie `null`", correct: false}
      - {text: "`null null`, puis une `NullPointerException`", correct: false}
    answer: '`null null`, puis une `NoSuchElementException` sur `pop`.'
    check:
      output: "null null"
      throws: NoSuchElementException
  - key: code-melange
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Deque<Integer> d = new ArrayDeque<>();
      d.offer(1);
      d.offer(2);
      d.push(0);
      System.out.println(d + " " + d.pollLast());
      ```
    choices:
      - {text: "`[0, 1, 2] 2`", correct: true}
      - {text: "`[1, 2, 0] 0`", correct: false}
      - {text: "`[0, 1, 2] 0`", correct: false}
      - {text: "`[2, 1, 0] 0`", correct: false}
    answer: '`[0, 1, 2] 2` : `offer` ajoute en queue, `push` en tête.'
    check:
      output: "[0, 1, 2] 2"
  - key: bug-stack
    format: bug-fix
    question: |-
      Quelle déclaration moderne remplace cette `Stack` ?
      ```java
      Stack<Operation> annulations = new Stack<>();
      ```
    choices:
      - {text: "`Deque<Operation> annulations = new ArrayDeque<>();`", correct: true}
      - {text: "`List<Operation> annulations = new ArrayList<>();`", correct: false}
      - {text: "`Queue<Operation> annulations = new LinkedList<>();`", correct: false}
      - {text: "`Vector<Operation> annulations = new Vector<>();`", correct: false}
    answer: |-
      ```java
      Deque<Operation> annulations = new ArrayDeque<>();
      ```
      `Stack` hérite de `Vector` (synchronisée, et elle expose des méthodes de liste qui cassent la pile). `ArrayDeque`
      offre les mêmes `push`, `pop` et `peek`, plus rapides.
  - key: bug-offer-pop
    format: bug-fix
    question: |-
      Cette « pile » d'annulation défait la plus ancienne action au lieu de la plus récente. Quelle correction est la bonne ?
      ```java
      actions.offer(action);       // à chaque action
      Action derniere = actions.pop();
      ```
    choices:
      - {text: "Ajouter avec `push`, pour ajouter et retirer du même bout", correct: true}
      - {text: "Retirer avec `poll`, pour retirer du bout où `offer` ajoute", correct: false}
      - {text: "Retirer avec `peek`, qui lit l'action la plus récente", correct: false}
      - {text: "Ajouter avec `add`, qui ajoute en tête de la `Deque`", correct: false}
    answer: |-
      ```java
      actions.push(action);
      Action derniere = actions.pop();
      ```
      `offer` ajoute en queue et `pop` retire en tête : c'est une file. Pour une pile, on ajoute et on retire du même
      bout.
  - key: bug-pop-vide
    format: bug-fix
    question: |-
      Ce code lève une `NoSuchElementException` quand il n'y a plus rien à annuler. Quelle correction est la bonne ?
      ```java
      void annuler() {
          historique.pop().defaire();
      }
      ```
    choices:
      - {text: "Retirer avec `poll()`, et ne défaire que si le résultat n'est pas `null`", correct: true}
      - {text: "Lire avec `peek()`, qui renvoie `null` sur une pile vide, puis défaire", correct: false}
      - {text: "Remplacer `pop()` par `remove()`, qui renvoie `null` sur une pile vide", correct: false}
      - {text: "Créer la pile avec une capacité initiale, pour qu'elle ne soit jamais vide", correct: false}
    answer: |-
      ```java
      void annuler() {
          Action derniere = historique.poll();
          if (derniere != null) {
              derniere.defaire();
          }
      }
      ```
      `pop` lève une exception sur une pile vide ; `poll` renvoie `null`, qu'on teste. (Ou tester `isEmpty()` avant.)
  - key: bug-linkedlist-file
    format: bug-fix
    question: |-
      Ce parcours en largeur sur un grand graphe est plus lent que nécessaire. Quelle correction est la bonne ?
      ```java
      Queue<Noeud> aVisiter = new LinkedList<>();
      ```
    choices:
      - {text: "Une `ArrayDeque`, tableau circulaire plus compact et plus rapide", correct: true}
      - {text: "Une `PriorityQueue`, qui accélère les parcours de graphe", correct: false}
      - {text: "Une `Stack`, plus légère qu'une liste chaînée", correct: false}
      - {text: "Une `LinkedList` créée avec une capacité initiale", correct: false}
    answer: |-
      ```java
      Queue<Noeud> aVisiter = new ArrayDeque<>();
      ```
      `LinkedList` alloue un nœud par élément et disperse la mémoire ; `ArrayDeque`, un tableau circulaire, est plus
      compacte et plus rapide pour une file.
