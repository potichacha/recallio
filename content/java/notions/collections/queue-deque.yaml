notion: queue-deque
lesson: |-
  Une **`Queue`** est une file : on ajoute d'un côté, on retire de l'autre (FIFO, premier entré, premier sorti). Une
  **`Deque`** (*double-ended queue*) permet d'ajouter et de retirer **aux deux bouts** : elle sert de file **et** de pile
  (LIFO).

  `ArrayDeque`, un tableau circulaire, est l'implémentation à choisir dans les deux cas : opérations aux extrémités en
  O(1), plus rapide que `LinkedList` et que l'ancienne `Stack`.

  ```java
  Deque<String> pile = new ArrayDeque<>();
  pile.push("a");            // ajoute en tête
  pile.push("b");
  pile.pop();                // "b" : le dernier ajouté
  pile.peek();               // "a", sans le retirer

  Queue<String> file = new ArrayDeque<>();
  file.offer("a");           // ajoute en queue
  file.offer("b");
  file.poll();               // "a" : le premier ajouté
  ```

  Chaque opération existe en deux versions :

  | | lève une exception | renvoie une valeur spéciale |
  |---|---|---|
  | ajouter | `add` | `offer` (`false` si pleine) |
  | retirer | `remove` | `poll` (`null` si vide) |
  | consulter | `element` | `peek` (`null` si vide) |

  - `pop` et `push` travaillent en **tête** ; `pop` sur une pile vide lève `NoSuchElementException`.
  - `ArrayDeque` **refuse `null`** (puisque `null` signifie « vide » pour `poll` et `peek`).
  - Usages : une pile pour les parenthèses équilibrées, l'annulation (*undo*) ou un parcours en profondeur ; une file
    pour un parcours en largeur ou des tâches à traiter dans l'ordre.
  - Pour une file partagée entre threads : une `BlockingQueue` (`LinkedBlockingQueue`, `ArrayBlockingQueue`).

  **Piège classique** : mélanger les deux bouts. `push` ajoute en tête, `offer` en queue : une pile alimentée par
  `offer` et vidée par `pop` se comporte comme une file.

  **En entretien** : « `ArrayDeque` pour une pile (`push`, `pop`) comme pour une file (`offer`, `poll`) ; `poll` et `peek`
  renvoient `null` sur une structure vide, `remove` et `pop` lèvent une exception. »
cards:
  - key: pile-file
    format: course
    question: Quelle différence entre une pile et une file ?
    answer: Une pile est LIFO (le dernier ajouté sort le premier), une file est FIFO (le premier ajouté sort le premier).
  - key: arraydeque
    format: course
    question: Quelle implémentation choisir pour une pile ou une file en Java ?
    answer: '`ArrayDeque` : opérations aux deux bouts en O(1), plus rapide que `LinkedList` et que `Stack`, qui est synchronisée et héritée de `Vector`.'
  - key: poll-remove
    format: course
    question: Quelle différence entre `poll()` et `remove()` sur une file vide ?
    answer: '`poll()` renvoie `null`, `remove()` lève une `NoSuchElementException`.'
  - key: null-refuse
    format: course
    question: Pourquoi `ArrayDeque` refuse-t-elle `null` ?
    answer: "Parce que `poll` et `peek` utilisent `null` pour dire « vide » : un élément `null` serait indiscernable."
  - key: vf-push-tete
    format: true-false
    question: "`push` ajoute l'élément en tête d'une `Deque`."
    truth: true
    answer: "Et `pop` le retire de la tête : c'est une pile."
  - key: vf-peek-retire
    format: true-false
    question: "`peek` retire l'élément consulté."
    truth: false
    answer: Il le consulte seulement ; `poll` ou `pop` le retirent.
  - key: vf-null
    format: true-false
    question: On peut ajouter `null` dans une `ArrayDeque`.
    truth: false
    answer: Elle lève une `NullPointerException`.
  - key: vf-pop-vide
    format: true-false
    question: "`pop` sur une `ArrayDeque` vide renvoie `null`."
    truth: false
    answer: Il lève une `NoSuchElementException` ; `poll` renverrait `null`.
  - key: qcm-pile
    format: multiple-choice
    question: Comment déclarer une pile en Java moderne ?
    choices:
      - text: "`Deque<Integer> pile = new ArrayDeque<>();`"
        correct: true
      - text: "`Stack<Integer> pile = new Stack<>();`"
        correct: false
      - text: "`Queue<Integer> pile = new PriorityQueue<>();`"
        correct: false
      - text: "`List<Integer> pile = new Vector<>();`"
        correct: false
    answer: '`Stack` fonctionne mais est déconseillée ; la Javadoc recommande `Deque`.'
  - key: qcm-file-vide
    format: multiple-choice
    question: Quelles méthodes renvoient `null` sur une file vide, sans exception ?
    choices:
      - text: "`poll()`"
        correct: true
      - text: "`peek()`"
        correct: true
      - text: "`remove()`"
        correct: false
      - text: "`element()`"
        correct: false
    answer: '`remove` et `element` lèvent une `NoSuchElementException`.'
  - key: qcm-usage
    format: multiple-choice
    question: Pour quel besoin une pile est-elle adaptée ?
    choices:
      - text: "Vérifier que des parenthèses sont équilibrées"
        correct: true
      - text: "Une fonction annuler (undo)"
        correct: true
      - text: "Traiter des commandes dans leur ordre d'arrivée"
        correct: false
      - text: "Un parcours en largeur d'un graphe"
        correct: false
    answer: L'ordre d'arrivée et le parcours en largeur demandent une file.
  - key: qcm-concurrent
    format: multiple-choice
    question: Plusieurs threads producteurs déposent des tâches qu'un consommateur attend. Que choisir ?
    choices:
      - text: "Une `BlockingQueue` (`LinkedBlockingQueue`)"
        correct: true
      - text: "Une `ArrayDeque`"
        correct: false
      - text: "Une `ArrayList`"
        correct: false
      - text: "Une `PriorityQueue`"
        correct: false
    answer: '`take()` attend qu''une tâche arrive, et la file est thread-safe.'
  - key: trous-push-pop
    format: fill-in
    question: |-
      Complétez pour empiler puis dépiler :
      ```java
      Deque<String> historique = new ArrayDeque<>();
      historique.___("page1");
      String derniere = historique.___();
      ```
    blanks: [[push], [pop]]
    answer: '`push` et `pop` travaillent en tête.'
  - key: trous-offer-poll
    format: fill-in
    question: |-
      Complétez pour ajouter une tâche en fin de file, puis retirer la première :
      ```java
      Queue<Tache> taches = new ArrayDeque<>();
      taches.___(tache);
      Tache suivante = taches.___();
      ```
    blanks: [[offer, add], [poll, remove]]
    answer: '`offer` ajoute en queue, `poll` retire en tête (ou renvoie `null`).'
  - key: trous-peek
    format: fill-in
    question: |-
      Complétez pour consulter le sommet de la pile sans le retirer :
      ```java
      String sommet = pile.___();
      ```
    blanks: [[peek, peekFirst]]
    answer: '`peek` renvoie `null` si la pile est vide.'
  - key: trous-declaration
    format: fill-in
    question: |-
      Complétez avec l'implémentation recommandée :
      ```java
      Deque<Integer> pile = new ___<>();
      ```
    blanks: [[ArrayDeque]]
    answer: Un tableau circulaire, en O(1) aux deux bouts.
  - key: code-pile
    format: code-output
    question: |-
      ```java
      Deque<Integer> pile = new ArrayDeque<>();
      pile.push(1);
      pile.push(2);
      pile.push(3);
      System.out.println(pile.pop() + " " + pile.peek() + " " + pile);
      ```
    answer: '`3 2 [2, 1]` : le dernier empilé sort le premier.'
    check:
      output: "3 2 [2, 1]"
  - key: code-file
    format: code-output
    question: |-
      ```java
      Queue<String> file = new ArrayDeque<>();
      file.offer("a");
      file.offer("b");
      file.offer("c");
      System.out.println(file.poll() + " " + file);
      ```
    answer: '`a [b, c]` : le premier arrivé sort le premier.'
    check:
      output: "a [b, c]"
  - key: code-vide
    format: code-output
    question: |-
      ```java
      Deque<String> d = new ArrayDeque<>();
      System.out.println(d.poll() + " " + d.peek());
      d.pop();
      ```
    answer: '`null null`, puis une `NoSuchElementException` sur `pop`.'
    check:
      output: "null null"
      throws: NoSuchElementException
  - key: code-melange
    format: code-output
    question: |-
      ```java
      Deque<Integer> d = new ArrayDeque<>();
      d.offer(1);
      d.offer(2);
      d.push(0);
      System.out.println(d + " " + d.pollLast());
      ```
    answer: '`[0, 1, 2] 2` : `offer` ajoute en queue, `push` en tête.'
    check:
      output: "[0, 1, 2] 2"
  - key: bug-stack
    format: bug-fix
    question: |-
      Modernisez cette pile :
      ```java
      Stack<Operation> annulations = new Stack<>();
      ```
    answer: |-
      ```java
      Deque<Operation> annulations = new ArrayDeque<>();
      ```
      `Stack` hérite de `Vector` (synchronisée, et elle expose des méthodes de liste qui cassent la pile). `ArrayDeque`
      offre les mêmes `push`, `pop` et `peek`, plus rapides.
  - key: bug-offer-pop
    format: bug-fix
    question: |-
      Cette « pile » d'annulation défait la plus ancienne action au lieu de la plus récente :
      ```java
      actions.offer(action);       // à chaque action
      Action derniere = actions.pop();
      ```
    answer: |-
      ```java
      actions.push(action);
      Action derniere = actions.pop();
      ```
      `offer` ajoute en queue et `pop` retire en tête : c'est une file. Pour une pile, on ajoute et on retire du même
      bout.
  - key: bug-pop-vide
    format: bug-fix
    question: |-
      Ce code lève une `NoSuchElementException` quand il n'y a plus rien à annuler :
      ```java
      void annuler() {
          historique.pop().defaire();
      }
      ```
    answer: |-
      ```java
      void annuler() {
          Action derniere = historique.poll();
          if (derniere != null) {
              derniere.defaire();
          }
      }
      ```
      `pop` lève une exception sur une pile vide ; `poll` renvoie `null`, qu'on teste. (Ou tester `isEmpty()` avant.)
  - key: bug-linkedlist-file
    format: bug-fix
    question: |-
      Ce parcours en largeur sur un grand graphe est plus lent que nécessaire :
      ```java
      Queue<Noeud> aVisiter = new LinkedList<>();
      ```
    answer: |-
      ```java
      Queue<Noeud> aVisiter = new ArrayDeque<>();
      ```
      `LinkedList` alloue un nœud par élément et disperse la mémoire ; `ArrayDeque`, un tableau circulaire, est plus
      compacte et plus rapide pour une file.
