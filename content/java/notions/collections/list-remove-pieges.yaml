notion: list-remove-pieges
lesson: |-
  Trois pièges classiques des listes :

  **1. `remove(int)` contre `remove(Object)`.** Sur une `List<Integer>`, `remove(1)` choisit la surcharge la plus
  précise, `remove(int index)` : on retire l'élément **d'indice** 1, pas la **valeur** 1.

  ```java
  List<Integer> l = new ArrayList<>(List.of(10, 1, 20));
  l.remove(1);                     // retire l'indice 1 : [10, 20]
  l.remove(Integer.valueOf(10));   // retire la valeur 10 : [20]
  ```

  **2. `Arrays.asList` est une vue de taille fixe sur le tableau.**

  ```java
  String[] t = {"a", "b"};
  List<String> l = Arrays.asList(t);
  l.set(0, "z");                   // permis, et modifie aussi t[0]
  l.add("c");                      // UnsupportedOperationException : taille fixe
  ```

  **3. `Arrays.asList` sur un tableau de primitifs.** `Arrays.asList(new int[]{1, 2, 3})` donne une `List<int[]>` d'**un
  seul** élément : le tableau lui-même. Pour des primitifs : `IntStream.of(...).boxed().toList()` ou des `Integer[]`.

  À comparer avec `List.of(...)` : immuable (même `set` est interdit), refuse `null`, et ne garde aucun lien avec un
  tableau.

  **Piège classique** : `codes.remove(404)` sur une `List<Integer>` pour retirer le code 404. On retire l'élément d'indice
  404, ou l'on obtient une `IndexOutOfBoundsException`.

  **En entretien** : « Sur une `List<Integer>`, `remove(1)` retire par indice ; `Arrays.asList` est une vue de taille
  fixe, liée au tableau, et un `int[]` y devient un seul élément. »
cards:
  - key: passe-avec-arrays-aslist-1-2
    format: course
    question: "Que se passe-t-il avec `Arrays.asList(1, 2, 3).add(4)` ?"
    choices:
      - {text: "Une `UnsupportedOperationException` : la liste a une taille fixe", correct: true}
      - {text: "La liste devient `[1, 2, 3, 4]`, comme une `ArrayList`", correct: false}
      - {text: "Une `IndexOutOfBoundsException` : il n'y a pas de quatrième case", correct: false}
      - {text: "Rien : l'ajout est ignoré, et la liste reste `[1, 2, 3]`", correct: false}
    answer: "Une `UnsupportedOperationException` : la liste d'`Arrays.asList` est une vue de taille fixe sur un tableau. Ce n'est pas une `java.util.ArrayList`."
  - key: remove-surcharge
    format: course
    question: Pourquoi `liste.remove(1)` sur une `List<Integer>` retire-t-il par indice ?
    choices:
      - {text: "`remove(int index)` correspond à l'argument `int` sans boxing, et cette surcharge l'emporte", correct: true}
      - {text: "Une `List<Integer>` n'a que `remove(int)` : la valeur se retire avec `removeValue`", correct: false}
      - {text: "Le compilateur choisit toujours la première méthode déclarée dans l'interface `List`", correct: false}
      - {text: "Les deux surcharges conviennent, et Java choisit l'indice quand la liste est petite", correct: false}
    answer: La surcharge `remove(int index)` est plus précise pour l'argument `int` que `remove(Object)`, qui demanderait un boxing ; pour retirer la valeur, on écrit `remove(Integer.valueOf(1))`.
  - key: vue-tableau
    format: course
    question: Que se passe-t-il si l'on modifie le tableau passé à `Arrays.asList` ?
    choices:
      - {text: "La liste change aussi : c'est une vue sur le tableau, dans les deux sens", correct: true}
      - {text: "Rien : `Arrays.asList` a copié le tableau à sa création", correct: false}
      - {text: "La liste lève une `ConcurrentModificationException` au prochain accès", correct: false}
      - {text: "La liste change, mais un `set` sur la liste ne touche pas le tableau", correct: false}
    answer: "La liste change aussi : c'est une vue sur le tableau, dans les deux sens (`set` sur la liste modifie le tableau)."
  - key: as-list-vs-of
    format: course
    question: Quelles différences entre `Arrays.asList(...)` et `List.of(...)` ?
    choices:
      - {text: "`asList` : taille fixe, `set` permis, `null` accepté, vue ; `List.of` : immuable, sans `null`, indépendante", correct: true}
      - {text: "`asList` : immuable, sans `null`, indépendante ; `List.of` : taille fixe, `set` permis, `null` accepté, vue", correct: false}
      - {text: "Aucune : `List.of` n'est qu'un nom plus court pour `Arrays.asList`, ajouté en Java 9", correct: false}
      - {text: "`asList` : modifiable comme une `ArrayList` ; `List.of` : taille fixe, `set` permis, `null` accepté", correct: false}
    answer: '`Arrays.asList` : taille fixe mais `set` permis, accepte `null`, vue sur le tableau. `List.of` : complètement immuable, refuse `null`, indépendante.'
  - key: vf-remove-valeur
    format: true-false
    question: "Avec `List<Integer> l = new ArrayList<>(List.of(5, 6, 7));`, `l.remove(5)` retire la valeur 5."
    truth: false
    answer: Il tente de retirer l'indice 5, et lève une `IndexOutOfBoundsException`.
  - key: vf-set-as-list
    format: true-false
    question: "`Arrays.asList(\"a\", \"b\").set(0, \"z\")` est permis."
    truth: true
    answer: La taille est fixe, mais les éléments peuvent être remplacés.
  - key: vf-int-array
    format: true-false
    question: "`Arrays.asList(new int[]{1, 2, 3})` est une liste de trois `Integer`."
    truth: false
    answer: C'est une `List<int[]>` d'un seul élément.
  - key: vf-null-as-list
    format: true-false
    question: "`Arrays.asList(\"a\", null)` lève une `NullPointerException`."
    truth: false
    answer: Contrairement à `List.of`, `Arrays.asList` accepte `null`.
  - key: qcm-remove-valeur
    format: multiple-choice
    question: "Laquelle de ces instructions retire la valeur 404 d'une `List<Integer> codes` ?"
    choices:
      - {text: "`codes.remove(Integer.valueOf(404))`", correct: true}
      - {text: "`codes.remove(404)`", correct: false}
      - {text: "`codes.delete(404)`", correct: false}
      - {text: "`codes.remove((int) 404)`", correct: false}
    answer: "`remove(Integer.valueOf(404))` (ou `removeIf(c -> c == 404)`) retire la valeur. `remove(404)` et `remove((int) 404)` choisissent `remove(int index)`, et `delete` n'existe pas."
  - key: qcm-as-list
    format: multiple-choice
    question: "Quelles opérations sont permises sur `Arrays.asList(\"a\", \"b\")` ?"
    choices:
      - text: "`set(0, \"z\")`"
        correct: true
      - text: "`sort(null)`"
        correct: true
      - text: "`add(\"c\")`"
        correct: false
      - text: "`remove(0)`"
        correct: false
    answer: Remplacer et réordonner, oui ; changer la taille, non.
  - key: qcm-primitifs
    format: multiple-choice
    question: "Laquelle de ces écritures donne une `List<Integer>` à partir d'un `int[] t` ?"
    choices:
      - {text: "`Arrays.stream(t).boxed().toList()`", correct: true}
      - {text: "`Arrays.asList(t)`", correct: false}
      - {text: "`List.of(t)`", correct: false}
      - {text: "`Arrays.stream(t).toList()`", correct: false}
    answer: "`Arrays.stream(t).boxed().toList()` (ou `IntStream.of(t).boxed().toList()`) emballe chaque `int`. `asList(t)` et `List.of(t)` donnent une liste d'un seul `int[]`, et un `IntStream` n'a pas de `toList()`."
  - key: qcm-vue
    format: multiple-choice
    question: "Après `String[] t = {\"a\"}; List<String> l = Arrays.asList(t); t[0] = \"b\";`, que vaut `l.get(0)` ?"
    choices:
      - text: "\"b\""
        correct: true
      - text: "\"a\""
        correct: false
      - text: "`null`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: La liste est une vue sur le tableau.
  - key: code-list-integer-new-arraylist-list
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = new ArrayList<>(List.of(1, 2, 3));
      l.remove(1);
      System.out.println(l);
      l.remove(Integer.valueOf(1));
      System.out.println(l);
      ```
    choices:
      - text: |-
          ```
          [1, 3]
          [3]
          ```
        correct: true
      - text: |-
          ```
          [2, 3]
          [2, 3]
          ```
        correct: false
      - text: |-
          ```
          [1, 3]
          [1, 3]
          ```
        correct: false
      - text: |-
          ```
          [2, 3]
          [3]
          ```
        correct: false
    answer: '`[1, 3]` puis `[3]`. `remove(1)` supprime à l''**index** 1 ; `remove(Integer.valueOf(1))` supprime la **valeur** 1.'
    check:
      output: |-
        [1, 3]
        [3]
  - key: code-arrays-aslist-new-int-1
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      System.out.println(Arrays.asList(new int[]{1, 2, 3}).size() + " " + Arrays.asList(new Integer[]{1, 2, 3}).size());
      ```
    choices:
      - {text: "`1 3`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`3 1`", correct: false}
    answer: '`1` et `3` : un `int[]` est un seul objet, la liste obtenue est une `List<int[]>`.'
    check:
      code: |-
        System.out.println(Arrays.asList(new int[]{1, 2, 3}).size() + " " + Arrays.asList(new Integer[]{1, 2, 3}).size());
      output: "1 3"
  - key: code-arrays-aslist-1-2-3
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Arrays.asList(1, 2, 3).add(4);
      ```
    choices:
      - {text: "Une `UnsupportedOperationException`", correct: true}
      - {text: "Rien : la liste vaut alors `[1, 2, 3, 4]`", correct: false}
      - {text: "Une `IndexOutOfBoundsException`", correct: false}
      - {text: "Une `IllegalStateException`", correct: false}
    answer: "Une `UnsupportedOperationException` : la liste d'`Arrays.asList` a une taille fixe."
    check:
      code: |-
        Arrays.asList(1, 2, 3).add(4);
      throws: UnsupportedOperationException
  - key: code-vue-tableau
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      String[] t = {"a", "b"};
      List<String> l = Arrays.asList(t);
      l.set(0, "z");
      t[1] = "y";
      System.out.println(t[0] + " " + l.get(1));
      ```
    choices:
      - {text: "`z y`", correct: true}
      - {text: "`a b`", correct: false}
      - {text: "`z b`", correct: false}
      - {text: "`a y`", correct: false}
    answer: '`z y` : la liste et le tableau partagent les mêmes cases.'
    check:
      output: "z y"
  - key: bug-remove-code
    format: bug-fix
    question: |-
      On veut retirer le code d'erreur 404, mais on obtient une `IndexOutOfBoundsException`. Quelle correction est la bonne ?
      ```java
      List<Integer> codes = new ArrayList<>(List.of(200, 404, 500));
      codes.remove(404);
      ```
    choices:
      - {text: "`codes.remove(Integer.valueOf(404))`, pour retirer la valeur", correct: true}
      - {text: "`codes.remove(404 - 1)`, car les indices commencent à 0", correct: false}
      - {text: "`codes.remove((int) 404)`, pour lever l'ambiguïté", correct: false}
      - {text: "`codes.remove(codes.get(404))`, pour retrouver l'élément", correct: false}
    answer: |-
      ```java
      codes.remove(Integer.valueOf(404));
      ```
      `remove(404)` choisit `remove(int index)`. Pour retirer une valeur, on passe un `Integer`.
  - key: bug-as-list-add
    format: bug-fix
    question: |-
      Ce code lève une `UnsupportedOperationException`. Quelle correction est la bonne ?
      ```java
      List<String> roles = Arrays.asList("LECTEUR", "EDITEUR");
      if (estAdmin) roles.add("ADMIN");
      ```
    choices:
      - {text: "Créer une liste modifiable : `new ArrayList<>(List.of(...))`", correct: true}
      - {text: "Remplacer `Arrays.asList` par `List.of`, qui accepte `add`", correct: false}
      - {text: "Remplacer `add` par `set(2, \"ADMIN\")`, permis par `asList`", correct: false}
      - {text: "Déclarer `roles` avec `var` pour obtenir une `ArrayList`", correct: false}
    answer: |-
      ```java
      List<String> roles = new ArrayList<>(List.of("LECTEUR", "EDITEUR"));
      if (estAdmin) roles.add("ADMIN");
      ```
      `Arrays.asList` a une taille fixe. Pour une liste qu'on complète, on crée une `ArrayList`.
  - key: bug-int-array
    format: bug-fix
    question: |-
      Ce test de présence ne trouve jamais rien. Quelle correction est la bonne ?
      ```java
      int[] premiers = {2, 3, 5, 7};
      boolean estPremier = Arrays.asList(premiers).contains(5);
      ```
    choices:
      - {text: "Tester avec `IntStream.of(premiers).anyMatch(p -> p == 5)`", correct: true}
      - {text: "Tester avec `Arrays.asList(premiers).contains(Integer.valueOf(5))`", correct: false}
      - {text: "Tester avec `List.of(premiers).contains(5)`", correct: false}
      - {text: "Tester avec `Arrays.asList(premiers).indexOf(5) >= 0`", correct: false}
    answer: |-
      ```java
      int[] premiers = {2, 3, 5, 7};
      boolean estPremier = IntStream.of(premiers).anyMatch(p -> p == 5);
      ```
      `Arrays.asList(premiers)` est une liste d'un seul élément, le tableau ; elle ne contient jamais l'`Integer` 5.
  - key: bug-copie-liee
    format: bug-fix
    question: |-
      La « copie » de sauvegarde change quand on modifie le tableau d'origine. Quelle correction est la bonne ?
      ```java
      List<String> sauvegarde = Arrays.asList(grille);
      grille[0] = "X";
      ```
    choices:
      - {text: "Copier avec `List.of(grille)` ou `List.copyOf(...)`, au lieu d'une vue", correct: true}
      - {text: "Déclarer `sauvegarde` en `final` pour figer son contenu", correct: false}
      - {text: "Envelopper la vue dans `Collections.unmodifiableList`", correct: false}
      - {text: "Déclarer le tableau `grille` en `final` avant de l'envelopper", correct: false}
    answer: |-
      ```java
      List<String> sauvegarde = List.of(grille);   // ou List.copyOf(Arrays.asList(grille))
      grille[0] = "X";
      ```
      `Arrays.asList` est une vue sur le tableau, pas une copie. `List.of(tableau)` crée une liste indépendante (qui refuse
      les `null`).
