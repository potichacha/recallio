notion: collections-memoire
lesson: |-
  Les collections ne stockent que des **objets** : chaque `int` devient un `Integer`, avec son en-tête d'objet. Sur une
  JVM 64 bits avec les pointeurs compressés (le cas courant), on compte environ :

  | Élément | Taille approximative |
  |---|---|
  | `int` dans un `int[]` | 4 octets |
  | `Integer` | 16 octets, plus 4 octets de référence dans la collection |
  | entrée de `ArrayList<Integer>` | ~20 octets |
  | entrée de `LinkedList<Integer>` | ~40 octets (nœud de 24 octets + `Integer`) |
  | entrée de `HashMap<Integer, Integer>` | ~70 octets (nœud de 32 octets, deux `Integer`, la case du tableau) |

  - Un million d'entiers : **4 Mo** dans un `int[]`, environ **20 Mo** dans une `ArrayList<Integer>`, environ **40 Mo**
    dans une `LinkedList<Integer>`.
  - Un `HashSet` est une `HashMap` dont les valeurs sont un objet factice : il coûte autant.
  - Les objets dispersés en mémoire coûtent aussi en **cache processeur** : un parcours de `LinkedList` est lent même à
    complexité égale.
  - Les entiers de -128 à 127 sont partagés (cache de `Integer.valueOf`), les autres non.
  - Pistes : des tableaux primitifs, `IntStream`, des bibliothèques de collections primitives (Eclipse Collections,
    fastutil), dimensionner les collections à l'avance, `trimToSize()` pour une liste qui ne grandira plus.
  - Pour mesurer plutôt que deviner : JOL (*Java Object Layout*) ou un profileur mémoire.

  **Piège classique** : une `Map<Long, Long>` de dizaines de millions d'entrées en cache. Elle occupe des gigaoctets pour
  quelques centaines de mégaoctets de données utiles.

  **En entretien** : « Une collection d'objets enveloppe chaque primitif : une `ArrayList<Integer>` coûte environ cinq fois
  un `int[]`, une `HashMap` bien plus. Pour de gros volumes, des tableaux ou des collections primitives. »
cards:
  - key: enveloppe
    format: course
    question: Pourquoi une `ArrayList<Integer>` coûte-t-elle beaucoup plus de mémoire qu'un `int[]` ?
    choices:
      - {text: "Chaque entier devient un objet `Integer` avec son en-tête, plus une référence dans la liste", correct: true}
      - {text: "La liste réserve dix fois plus de cases que d'éléments, pour ses ajouts futurs", correct: false}
      - {text: "Chaque `int` est stocké deux fois : une fois dans la liste, une fois dans un cache", correct: false}
      - {text: "Une `ArrayList` range ses nombres sous forme de chaînes, plus lourdes qu'un `int`", correct: false}
    answer: Chaque entier devient un objet `Integer` (environ 16 octets avec son en-tête), plus une référence dans la liste, contre 4 octets par `int`.
  - key: linkedlist-noeud
    format: course
    question: Pourquoi une `LinkedList` consomme-t-elle plus qu'une `ArrayList` ?
    choices:
      - {text: "Chaque élément a son propre nœud, avec un en-tête et des références vers l'élément, le suivant et le précédent", correct: true}
      - {text: "Chaque élément est aussi copié dans un tableau de secours, en plus de la chaîne de nœuds de la liste", correct: false}
      - {text: "Elle réserve toujours deux fois plus de nœuds que d'éléments, pour accélérer les ajouts en fin", correct: false}
      - {text: "Elle garde un index de hachage de tous ses éléments, pour accélérer `contains` et `indexOf`", correct: false}
    answer: Chaque élément a son propre nœud (en-tête, références vers l'élément, le suivant et le précédent), en plus de l'objet lui-même.
  - key: hashset-cout
    format: course
    question: Combien coûte un `HashSet` par rapport à une `HashMap` ?
    choices:
      - {text: "Autant : un `HashSet` est une `HashMap` dont les valeurs sont un objet factice partagé", correct: true}
      - {text: "Deux fois moins : un `HashSet` ne stocke que des clés, sans aucune entrée ni valeur", correct: false}
      - {text: "Deux fois plus : un `HashSet` garde une liste de ses éléments à côté de sa table", correct: false}
      - {text: "Beaucoup moins : un `HashSet` est un simple tableau trié, sans table de hachage", correct: false}
    answer: "Autant : un `HashSet` est une `HashMap` dont les valeurs sont un objet factice partagé."
  - key: mesurer
    format: course
    question: Comment mesurer la taille réelle d'objets Java en mémoire ?
    choices:
      - {text: "Avec JOL (Java Object Layout), ou une analyse de heap dump pour une application", correct: true}
      - {text: "Avec un opérateur `sizeof(objet)`, comme en C, qui donne la taille en octets", correct: false}
      - {text: "En lisant `Runtime.totalMemory()` avant et après chaque création d'objet", correct: false}
      - {text: "En comptant 8 octets par champ, puisque la JVM aligne chaque champ sur 8 octets", correct: false}
    answer: "Avec JOL (Java Object Layout) pour un objet ou un graphe, ou un profileur / une analyse de heap dump pour une application. Java n'a pas de `sizeof`, et la mémoire totale de la JVM bouge trop (allocations, GC) pour mesurer un objet."
  - key: vf-int-integer
    format: true-false
    question: Un `Integer` occupe autant de mémoire qu'un `int`.
    truth: false
    answer: Environ 16 octets contre 4, sans compter la référence.
  - key: vf-cache-integer
    format: true-false
    question: "`Integer.valueOf(100)` renvoie toujours le même objet."
    truth: true
    answer: Les valeurs de -128 à 127 sont en cache ; l'autoboxing utilise `valueOf`.
  - key: vf-trim
    format: true-false
    question: "`ArrayList.trimToSize()` réduit le tableau interne à la taille de la liste."
    truth: true
    answer: Utile pour une grande liste qui ne grandira plus.
  - key: vf-localite
    format: true-false
    question: À complexité égale, parcourir une `LinkedList` est aussi rapide que parcourir une `ArrayList`.
    truth: false
    answer: Les nœuds dispersés en mémoire provoquent des défauts de cache ; l'`ArrayList`, contiguë, est nettement plus rapide.
  - key: qcm-classement
    format: multiple-choice
    question: Pour un million d'entiers, quelle structure occupe le moins de mémoire ?
    choices:
      - text: "`int[]`"
        correct: true
      - text: "`ArrayList<Integer>`"
        correct: false
      - text: "`LinkedList<Integer>`"
        correct: false
      - text: "`HashSet<Integer>`"
        correct: false
    answer: Environ 4 Mo, contre 20, 40 et plus de 50 Mo.
  - key: qcm-pistes
    format: multiple-choice
    question: "Laquelle de ces pistes réduit nettement la mémoire d'une très grande `Map<Integer, Integer>` ?"
    choices:
      - {text: "Une collection primitive (fastutil, Eclipse Collections)", correct: true}
      - {text: "La remplacer par une `TreeMap`, sans tableau de cases vides", correct: false}
      - {text: "La remplacer par une `LinkedHashMap`, plus compacte par entrée", correct: false}
      - {text: "La remplacer par une `ConcurrentHashMap`, aux cases partagées", correct: false}
    answer: "Une collection primitive (ou des tableaux primitifs si les clés sont denses) évite un objet `Integer` par clé et par valeur. `TreeMap` et `LinkedHashMap` ajoutent au contraire des références par entrée."
  - key: qcm-ordre-cout
    format: multiple-choice
    question: "Comment se classent ces collections par mémoire par élément, de la plus économe à la plus coûteuse ?"
    choices:
      - {text: "`int[]` < `ArrayList<Integer>` < `LinkedList<Integer>` < `HashMap<Integer, Integer>`", correct: true}
      - {text: "`ArrayList<Integer>` < `int[]` < `HashMap<Integer, Integer>` < `LinkedList<Integer>`", correct: false}
      - {text: "`LinkedList<Integer>` < `ArrayList<Integer>` < `int[]` < `HashMap<Integer, Integer>`", correct: false}
      - {text: "`int[]` < `LinkedList<Integer>` < `ArrayList<Integer>` < `HashMap<Integer, Integer>`", correct: false}
    answer: "Environ 4, 20, 40 et 70 octets par élément : l'`int` brut, puis un `Integer` et sa référence, puis un nœud en plus, puis une entrée de table avec deux `Integer`."
  - key: qcm-primitifs-stream
    format: multiple-choice
    question: Quelle écriture évite l'autoboxing pour sommer un million d'entiers ?
    choices:
      - text: "`IntStream.rangeClosed(1, 1_000_000).sum()`"
        correct: true
      - text: "`Stream.iterate(1, i -> i + 1).limit(1_000_000).reduce(0, Integer::sum)`"
        correct: false
      - text: "`liste.stream().reduce(0, Integer::sum)` sur une `List<Integer>`"
        correct: false
      - text: "`new ArrayList<Integer>()` remplie puis sommée"
        correct: false
    answer: '`IntStream` manipule des `int` directement.'
