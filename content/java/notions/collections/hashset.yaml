notion: hashset
lesson: |-
  Un **`HashSet`** stocke des éléments **uniques**, sans ordre garanti. Il est construit sur une `HashMap` : ses
  éléments sont les clés, associées à une valeur factice.

  ```java
  Set<String> vus = new HashSet<>();
  vus.add("ada");           // true : ajouté
  vus.add("ada");           // false : déjà présent, rien ne change
  vus.contains("ada");      // true, en temps constant (O(1) en moyenne)
  vus.remove("ada");
  ```

  - L'unicité repose sur **`equals` et `hashCode`** : des objets d'une classe qui ne les redéfinit pas sont toujours
    différents. Les records et les `String` les fournissent.
  - `add` renvoie `false` si l'élément était déjà là : inutile de tester `contains` avant.
  - Les opérations d'ensemble modifient l'ensemble sur lequel on les appelle :
    `a.addAll(b)` (union), `a.retainAll(b)` (intersection), `a.removeAll(b)` (différence).
  - L'ordre d'itération n'est **pas** spécifié et peut changer quand l'ensemble grossit.
  - `null` est accepté (une fois).

  **Piège classique** : mettre dans un `HashSet` des objets dont la classe redéfinit `equals` mais pas `hashCode`. Deux
  objets égaux tombent dans des cases différentes, et l'ensemble garde le doublon.

  **En entretien** : « `HashSet` : unicité par `equals` et `hashCode`, `add` et `contains` en O(1), aucun ordre ; c'est
  une `HashMap` dont on n'utilise que les clés. »
tour:
  - title: HashSet
    text: |-
      `HashSet` range des éléments **sans doublons**, avec un ajout et une recherche en temps constant. Il s'appuie sur
      `hashCode` pour trouver une case, puis sur `equals` pour comparer : une classe dont les objets vont dans un
      `HashSet` doit redéfinir **les deux**, de façon cohérente. Les records le font pour toi, d'où la différence entre
      `Point` et `PointBrut`.

      `HashSet` ne garde aucun ordre : `LinkedHashSet` garde l'ordre d'insertion, et `TreeSet` trie.
    example:
      files:
        Main.java: |-
          record Point(int x, int y) {}

          class PointBrut {
              final int x;
              final int y;

              PointBrut(int x, int y) {
                  this.x = x;
                  this.y = y;
              }
          }

          void main() {
              Set<String> vus = new LinkedHashSet<>();
              for (String mot : List.of("go", "java", "go", "rust", "java")) {
                  vus.add(mot);
              }
              IO.println(vus + " " + vus.contains("rust"));

              Set<Point> points = new HashSet<>(List.of(new Point(1, 2), new Point(1, 2)));
              Set<PointBrut> bruts = new HashSet<>(List.of(new PointBrut(1, 2), new PointBrut(1, 2)));
              IO.println(points.size() + " " + bruts.size());
          }
      output: |-
        [go, java, rust] true
        1 2
cards:
  - key: implemente-hashset
    format: course
    question: Comment est implémenté HashSet ?
    answer: Par une HashMap dont les clés sont les éléments et les valeurs un objet factice.
  - key: unicite
    format: course
    question: Sur quoi repose l'unicité d'un `HashSet` ?
    answer: Sur `hashCode` (pour trouver la case) puis `equals` (pour comparer) ; une classe qui ne les redéfinit pas compare les identités.
  - key: add-retour
    format: course
    question: Que renvoie `set.add(x)` ?
    answer: '`true` si l''élément a été ajouté, `false` s''il était déjà présent (l''ensemble ne change alors pas).'
  - key: operations
    format: course
    question: Comment calculer l'union, l'intersection et la différence de deux ensembles ?
    answer: Avec `addAll`, `retainAll` et `removeAll`, qui modifient l'ensemble appelant ; on travaille donc sur une copie (`new HashSet<>(a)`) pour garder l'original.
  - key: vf-ordre
    format: true-false
    question: Un `HashSet` garde l'ordre d'insertion.
    truth: false
    answer: Aucun ordre n'est garanti ; `LinkedHashSet` garde l'ordre d'insertion.
  - key: vf-contains
    format: true-false
    question: "`contains` sur un `HashSet` est en temps constant en moyenne."
    truth: true
    answer: Le hash désigne directement la case.
  - key: vf-null
    format: true-false
    question: Un `HashSet` accepte l'élément `null`.
    truth: true
    answer: Une seule fois, comme tout élément.
  - key: vf-sans-equals
    format: true-false
    question: Deux objets d'une classe sans `equals` ni `hashCode`, de même contenu, sont dédoublonnés par un `HashSet`.
    truth: false
    answer: Sans redéfinition, ils sont différents (identités distinctes).
  - key: qcm-intersection
    format: multiple-choice
    question: "Comment obtenir les éléments communs à `a` et `b` sans modifier `a` ?"
    choices:
      - text: "`Set<T> c = new HashSet<>(a); c.retainAll(b);`"
        correct: true
      - text: "`a.retainAll(b)`"
        correct: false
      - text: "`a.addAll(b)`"
        correct: false
      - text: "`a.removeAll(b)`"
        correct: false
    answer: '`retainAll` modifie l''ensemble appelant : on travaille sur une copie.'
  - key: qcm-add
    format: multiple-choice
    question: Comment détecter un doublon en un seul appel ?
    choices:
      - text: "`if (!vus.add(x)) { doublon(x); }`"
        correct: true
      - text: "`if (vus.contains(x)) doublon(x); vus.add(x);`"
        correct: false
      - text: "`if (vus.add(x) == null) doublon(x);`"
        correct: false
      - text: "`vus.put(x, true)`"
        correct: false
    answer: '`add` renvoie `false` pour un élément déjà présent.'
  - key: qcm-elements
    format: multiple-choice
    question: Quels éléments sont dédoublonnés correctement par un `HashSet` ?
    choices:
      - text: "Des `String`"
        correct: true
      - text: "Des records"
        correct: true
      - text: "Des objets d'une classe sans `equals` ni `hashCode`"
        correct: false
      - text: "Des `int[]`"
        correct: false
    answer: Un tableau compare les identités.
  - key: qcm-difference
    format: multiple-choice
    question: "Que contient `a` après `a.removeAll(b)` ?"
    choices:
      - text: "Les éléments de `a` absents de `b`"
        correct: true
      - text: "Les éléments communs"
        correct: false
      - text: "L'union des deux"
        correct: false
      - text: "Les éléments de `b` absents de `a`"
        correct: false
    answer: C'est la différence `a \ b`.
  - key: trous-add
    format: fill-in
    question: |-
      Complétez pour signaler un identifiant déjà vu :
      ```java
      if (!vus.___(id)) {
          signalerDoublon(id);
      }
      ```
    blanks: [[add]]
    answer: '`add` renvoie `false` si l''élément était déjà là.'
  - key: trous-retain
    format: fill-in
    question: |-
      Complétez pour ne garder que les compétences communes :
      ```java
      Set<String> communes = new HashSet<>(competencesA);
      communes.___(competencesB);
      ```
    blanks: [[retainAll]]
    answer: '`retainAll` réalise l''intersection.'
  - key: trous-remove-all
    format: fill-in
    question: |-
      Complétez pour obtenir les invités qui n'ont pas répondu :
      ```java
      Set<String> sansReponse = new HashSet<>(invites);
      sansReponse.___(reponses);
      ```
    blanks: [[removeAll]]
    answer: '`removeAll` réalise la différence.'
  - key: trous-contains
    format: fill-in
    question: |-
      Complétez pour tester si un mot est interdit :
      ```java
      boolean interdit = motsInterdits.___(mot);
      ```
    blanks: [[contains]]
    answer: En temps constant sur un `HashSet`.
  - key: code-add
    format: code-output
    question: |-
      ```java
      Set<String> s = new HashSet<>();
      System.out.println(s.add("a") + " " + s.add("a") + " " + s.size());
      ```
    answer: '`true false 1`.'
    check:
      output: "true false 1"
  - key: code-intersection
    format: code-output
    question: |-
      ```java
      Set<Integer> a = new HashSet<>(Set.of(1, 2, 3));
      a.retainAll(Set.of(2, 3, 4));
      System.out.println(new TreeSet<>(a));
      ```
    answer: '`[2, 3]` (le `TreeSet` ne sert qu''à fixer l''ordre d''affichage).'
    check:
      output: "[2, 3]"
  - key: code-records
    format: code-output
    question: |-
      ```java
      record Point(int x, int y) { }
      Set<Point> s = new HashSet<>(List.of(new Point(1, 2), new Point(1, 2), new Point(2, 1)));
      System.out.println(s.size());
      ```
    answer: '`2` : les records ont un `equals` et un `hashCode` sur leurs composants.'
    check:
      output: "2"
  - key: code-null
    format: code-output
    question: |-
      ```java
      Set<String> s = new HashSet<>();
      s.add(null);
      s.add(null);
      System.out.println(s.contains(null) + " " + s.size());
      ```
    answer: '`true 1` : `null` est accepté, une fois.'
    check:
      output: "true 1"
  - key: bug-sans-hashcode
    format: bug-fix
    question: |-
      Ce `HashSet<Etiquette>` garde des étiquettes en double :
      ```java
      class Etiquette {
          final String nom;
          Etiquette(String nom) { this.nom = nom; }
      }
      ```
    answer: |-
      ```java
      record Etiquette(String nom) { }
      ```
      Sans `equals` ni `hashCode`, deux étiquettes de même nom sont différentes. Un record (ou les deux méthodes
      redéfinies sur `nom`) rend l'unicité correcte.
  - key: bug-ordre
    format: bug-fix
    question: |-
      Le test qui compare l'affichage des tags échoue de temps en temps :
      ```java
      Set<String> tags = new HashSet<>(List.of("java", "spring", "docker"));
      return String.join(",", tags);
      ```
    answer: |-
      ```java
      Set<String> tags = new LinkedHashSet<>(List.of("java", "spring", "docker"));   // ordre d'insertion
      // ou new TreeSet<>(...) pour l'ordre alphabétique
      return String.join(",", tags);
      ```
      L'ordre d'un `HashSet` n'est pas spécifié. Pour un ordre stable, `LinkedHashSet` ou `TreeSet`.
  - key: bug-double-appel
    format: bug-fix
    question: |-
      Simplifiez :
      ```java
      if (!dejaTraites.contains(id)) {
          dejaTraites.add(id);
          traiter(id);
      }
      ```
    answer: |-
      ```java
      if (dejaTraites.add(id)) {
          traiter(id);
      }
      ```
      `add` renvoie `true` seulement si l'élément est nouveau : un seul accès à l'ensemble.
  - key: bug-boucles
    format: bug-fix
    question: |-
      Ce calcul des clients sans commande est quadratique :
      ```java
      List<String> sansCommande = new ArrayList<>();
      for (String c : clients) {
          if (!avecCommande.contains(c)) sansCommande.add(c);   // avecCommande : une List
      }
      ```
    answer: |-
      ```java
      Set<String> sansCommande = new HashSet<>(clients);
      sansCommande.removeAll(new HashSet<>(avecCommande));
      ```
      `List.contains` est linéaire. Avec des ensembles, la différence se calcule en temps linéaire.
