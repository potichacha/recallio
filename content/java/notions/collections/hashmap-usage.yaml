notion: hashmap-usage
lesson: |-
  Une `HashMap` associe des **clés uniques** à des valeurs, avec un accès en temps constant en moyenne.

  ```java
  Map<String, Integer> stock = new HashMap<>();
  stock.put("pomme", 3);              // renvoie l'ancienne valeur (ici null)
  stock.put("pomme", 5);              // remplace : renvoie 3
  stock.get("pomme");                 // 5
  stock.get("kiwi");                  // null : clé absente
  stock.getOrDefault("kiwi", 0);      // 0
  stock.containsKey("pomme");         // true
  stock.remove("pomme");

  for (Map.Entry<String, Integer> e : stock.entrySet()) {     // clé et valeur ensemble
      System.out.println(e.getKey() + " : " + e.getValue());
  }
  stock.forEach((produit, quantite) -> ...);
  ```

  - On parcourt **`entrySet()`** (ou `forEach`) quand on a besoin des clés et des valeurs : itérer `keySet()` puis
    appeler `get` refait une recherche par clé.
  - `get` renvoie `null` pour une clé absente **et** pour une clé associée à `null` : pour distinguer, `containsKey`.
  - `HashMap` accepte une clé `null` et des valeurs `null` (pas `ConcurrentHashMap` ni `Map.of`).
  - L'ordre d'itération n'est **pas** garanti : `LinkedHashMap` pour l'ordre d'insertion, `TreeMap` pour l'ordre des
    clés.
  - Les clés doivent avoir un `equals` et un `hashCode` corrects, et ne pas changer.

  **Piège classique** : `int n = map.get(cle);` pour une clé absente. `get` renvoie `null`, et son déballage en `int` lève
  une `NullPointerException` ; on utilise `getOrDefault`.

  **En entretien** : « `put` remplace et renvoie l'ancienne valeur, `get` renvoie `null` si la clé manque, et l'on itère
  sur `entrySet` ; aucun ordre n'est garanti. »
cards:
  - key: hashmap-accepte-null
    format: course
    question: HashMap accepte null ?
    answer: Oui (une clé null). ConcurrentHashMap et Hashtable non.
  - key: iterer-entryset-plutot-keyset
    format: course
    question: Pourquoi itérer sur entrySet plutôt que keySet ?
    answer: On évite une recherche get() supplémentaire par élément.
  - key: put-retour
    format: course
    question: Que renvoie `map.put(cle, valeur)` ?
    answer: L'ancienne valeur associée à la clé, ou `null` s'il n'y en avait pas ; la nouvelle valeur la remplace.
  - key: get-null
    format: course
    question: Pourquoi `map.get(cle) == null` ne suffit-il pas toujours à savoir si la clé est présente ?
    answer: Une `HashMap` peut associer une clé à la valeur `null` ; `containsKey` distingue « absente » de « présente avec `null` ».
  - key: vf-ordre
    format: true-false
    question: Une `HashMap` itère dans l'ordre d'insertion.
    truth: false
    answer: Aucun ordre n'est garanti ; `LinkedHashMap` garde l'ordre d'insertion.
  - key: vf-put-remplace
    format: true-false
    question: "`put` sur une clé existante ajoute une seconde entrée."
    truth: false
    answer: "Les clés sont uniques : la valeur est remplacée."
  - key: vf-get-absent
    format: true-false
    question: "`map.get(cleAbsente)` lève une exception."
    truth: false
    answer: Il renvoie `null`.
  - key: vf-get-or-default
    format: true-false
    question: "`getOrDefault(cle, 0)` ajoute la clé à la map si elle est absente."
    truth: false
    answer: Il renvoie seulement la valeur par défaut, sans modifier la map.
  - key: qcm-parcourir
    format: multiple-choice
    question: Quelle est la bonne façon de parcourir les clés et les valeurs d'une map ?
    choices:
      - text: "`for (var e : map.entrySet()) { e.getKey(); e.getValue(); }`"
        correct: true
      - text: "`map.forEach((k, v) -> ...)`"
        correct: true
      - text: "`for (var k : map.keySet()) { map.get(k); }`"
        correct: false
      - text: "`for (int i = 0; i < map.size(); i++) map.get(i);`"
        correct: false
    answer: La troisième refait une recherche par clé ; la dernière n'a pas de sens pour une map.
  - key: qcm-absent
    format: multiple-choice
    question: "Quelle expression donne 0 pour un produit absent de `Map<String, Integer> stock` ?"
    choices:
      - text: "`stock.getOrDefault(produit, 0)`"
        correct: true
      - text: "`stock.get(produit)`"
        correct: false
      - text: "`stock.get(produit, 0)`"
        correct: false
      - text: "`stock.containsValue(0)`"
        correct: false
    answer: '`get` renverrait `null`.'
  - key: qcm-null
    format: multiple-choice
    question: Lesquelles acceptent une clé `null` ?
    choices:
      - text: "`HashMap`"
        correct: true
      - text: "`LinkedHashMap`"
        correct: true
      - text: "`ConcurrentHashMap`"
        correct: false
      - text: "`Map.of(...)`"
        correct: false
    answer: '`TreeMap` la refuse aussi avec l''ordre naturel.'
  - key: qcm-put
    format: multiple-choice
    question: "Que vaut `ancien` après `m.put(\"a\", 1); Integer ancien = m.put(\"a\", 2);` ?"
    choices:
      - text: "1"
        correct: true
      - text: "2"
        correct: false
      - text: "`null`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: '`put` renvoie la valeur remplacée.'
  - key: trous-put
    format: fill-in
    question: |-
      Complétez pour associer la quantité au produit :
      ```java
      stock.___("pomme", 12);
      ```
    blanks: [[put]]
    answer: '`put` ajoute ou remplace.'
  - key: trous-default
    format: fill-in
    question: |-
      Complétez pour obtenir 0 si le produit est absent :
      ```java
      int quantite = stock.___("kiwi", 0);
      ```
    blanks: [[getOrDefault]]
    answer: '`getOrDefault` évite aussi le déballage de `null`.'
  - key: trous-entry-set
    format: fill-in
    question: |-
      Complétez pour parcourir clés et valeurs :
      ```java
      for (Map.Entry<String, Integer> e : stock.___()) {
          afficher(e.getKey(), e.getValue());
      }
      ```
    blanks: [[entrySet]]
    answer: '`entrySet()` donne les couples clé-valeur.'
  - key: trous-contains
    format: fill-in
    question: |-
      Complétez pour savoir si une clé est présente, même associée à `null` :
      ```java
      boolean present = preferences.___("theme");
      ```
    blanks: [[containsKey]]
    answer: '`containsKey` distingue l''absence d''une valeur `null`.'
  - key: code-put-get
    format: code-output
    question: |-
      ```java
      Map<String, Integer> m = new HashMap<>();
      m.put("a", 1);
      Integer ancien = m.put("a", 2);
      System.out.println(ancien + " " + m.get("a") + " " + m.get("z"));
      ```
    answer: '`1 2 null`.'
    check:
      output: "1 2 null"
  - key: code-default
    format: code-output
    question: |-
      ```java
      Map<String, Integer> m = Map.of("a", 1);
      System.out.println(m.getOrDefault("z", 0) + " " + m.containsKey("a") + " " + m.size());
      ```
    answer: '`0 true 1` : `getOrDefault` ne modifie pas la map.'
    check:
      output: "0 true 1"
  - key: code-entry-set
    format: code-output
    question: |-
      ```java
      Map<String, Integer> m = new TreeMap<>(Map.of("b", 2, "a", 1));
      for (var e : m.entrySet()) {
          System.out.print(e.getKey() + "=" + e.getValue() + ";");
      }
      ```
    answer: '`a=1;b=2;` (la `TreeMap` fixe l''ordre).'
    check:
      output: "a=1;b=2;"
  - key: code-null
    format: code-output
    question: |-
      ```java
      Map<String, Integer> m = new HashMap<>();
      m.put(null, 1);
      m.put("vide", null);
      System.out.println(m.get(null) + " " + m.get("vide") + " " + m.containsKey("vide"));
      ```
    answer: '`1 null true` : une clé `null` et une valeur `null` sont permises.'
    check:
      output: "1 null true"
  - key: bug-keyset-get
    format: bug-fix
    question: |-
      Simplifiez ce parcours :
      ```java
      for (String produit : stock.keySet()) {
          System.out.println(produit + " : " + stock.get(produit));
      }
      ```
    answer: |-
      ```java
      stock.forEach((produit, quantite) -> System.out.println(produit + " : " + quantite));
      // ou : for (var e : stock.entrySet()) ...
      ```
      Chaque `get` refait une recherche ; `entrySet` ou `forEach` donnent directement les valeurs.
  - key: bug-unboxing
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` pour un article inconnu :
      ```java
      int quantite = panier.get(article);
      ```
    answer: |-
      ```java
      int quantite = panier.getOrDefault(article, 0);
      ```
      `get` renvoie `null` pour une clé absente, et son déballage en `int` échoue.
  - key: bug-valeur-null
    format: bug-fix
    question: |-
      Une préférence volontairement vidée (valeur `null`) est remplacée par la valeur par défaut :
      ```java
      String theme = preferences.get("theme") != null ? preferences.get("theme") : "clair";
      ```
    answer: |-
      ```java
      String theme = preferences.containsKey("theme") ? preferences.get("theme") : "clair";
      ```
      `get` renvoie `null` dans les deux cas. `containsKey` distingue une clé absente d'une clé associée à `null`. (Mieux :
      éviter les valeurs `null` dans une map.)
  - key: bug-map-of-put
    format: bug-fix
    question: |-
      Ce code lève une `UnsupportedOperationException` :
      ```java
      Map<String, Integer> limites = Map.of("api", 100);
      limites.put("admin", 1000);
      ```
    answer: |-
      ```java
      Map<String, Integer> limites = new HashMap<>(Map.of("api", 100));
      limites.put("admin", 1000);
      ```
      `Map.of` est immuable. Pour une map qu'on complète, on crée une `HashMap`.
