notion: hashmap-usage
cards:
  - key: hashmap-accepte-null
    format: course
    question: HashMap accepte null ?
    answer: Oui (une clé null). ConcurrentHashMap et Hashtable non.
  - key: iterer-entryset-plutot-keyset
    format: course
    question: Pourquoi itérer sur entrySet plutôt que keySet ?
    answer: On évite une recherche get() supplémentaire par élément.
