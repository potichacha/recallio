notion: hashmap-usage
lesson: |-
  Une `HashMap` associe des **clés uniques** à des valeurs, avec un accès en temps constant en moyenne.

  ```java
  Map<String, Integer> stock = new HashMap<>();
  stock.put("pomme", 3);              // renvoie l'ancienne valeur (ici null)
  stock.put("pomme", 5);              // remplace : renvoie 3
  stock.get("pomme");                 // 5
  stock.get("kiwi");                  // null : clé absente
  stock.getOrDefault("kiwi", 0);      // 0
  stock.containsKey("pomme");         // true
  stock.remove("pomme");

  for (Map.Entry<String, Integer> e : stock.entrySet()) {     // clé et valeur ensemble
      System.out.println(e.getKey() + " : " + e.getValue());
  }
  stock.forEach((produit, quantite) -> ...);
  ```

  - On parcourt **`entrySet()`** (ou `forEach`) quand on a besoin des clés et des valeurs : itérer `keySet()` puis
    appeler `get` refait une recherche par clé.
  - `get` renvoie `null` pour une clé absente **et** pour une clé associée à `null` : pour distinguer, `containsKey`.
  - `HashMap` accepte une clé `null` et des valeurs `null` (pas `ConcurrentHashMap` ni `Map.of`).
  - L'ordre d'itération n'est **pas** garanti : `LinkedHashMap` pour l'ordre d'insertion, `TreeMap` pour l'ordre des
    clés.
  - Les clés doivent avoir un `equals` et un `hashCode` corrects, et ne pas changer.

  **Piège classique** : `int n = map.get(cle);` pour une clé absente. `get` renvoie `null`, et son déballage en `int` lève
  une `NullPointerException` ; on utilise `getOrDefault`.

  **En entretien** : « `put` remplace et renvoie l'ancienne valeur, `get` renvoie `null` si la clé manque, et l'on itère
  sur `entrySet` ; aucun ordre n'est garanti. »
tour:
  - title: HashMap
    text: |-
      `HashMap` associe des clés à des valeurs : `put` ajoute ou remplace, `get` lit (`null` si la clé est absente),
      `getOrDefault` donne une valeur par défaut, `containsKey` teste, `remove` retire. `merge` et `computeIfAbsent`
      évitent de lire puis d'écrire en deux temps.

      On parcourt les paires avec `entrySet()`. Une `HashMap` ne garde aucun ordre : pour l'afficher, on la recopie ici
      dans une `TreeMap`, qui trie par clé ; `LinkedHashMap` garderait l'ordre d'insertion.
    example:
      files:
        Main.java: |-
          void main() {
              Map<String, Integer> compte = new HashMap<>();
              for (String mot : "le chat et le chien et le rat".split(" ")) {
                  compte.merge(mot, 1, Integer::sum);
              }
              Map<String, Integer> trie = new TreeMap<>(compte);
              IO.println(trie);
              IO.println(compte.get("le") + " " + compte.getOrDefault("souris", 0) + " " + compte.containsKey("rat"));
              for (Map.Entry<String, Integer> entree : trie.entrySet()) {
                  if (entree.getValue() > 1) {
                      IO.println(entree.getKey() + " revient " + entree.getValue() + " fois");
                  }
              }
          }
      output: |-
        {chat=1, chien=1, et=2, le=3, rat=1}
        3 0 true
        et revient 2 fois
        le revient 3 fois
cards:
  - key: hashmap-accepte-null
    format: course
    question: "Une `HashMap` accepte-t-elle une clé `null` ?"
    choices:
      - {text: "Oui, une seule ; `ConcurrentHashMap` et `Hashtable` la refusent", correct: true}
      - {text: "Non ; seules `ConcurrentHashMap` et `Hashtable` l'acceptent", correct: false}
      - {text: "Oui, autant qu'on veut, chacune avec sa propre valeur", correct: false}
      - {text: "Non : toute map lève une `NullPointerException` sur une clé `null`", correct: false}
    answer: "Oui, une clé `null` (et des valeurs `null`). `ConcurrentHashMap` et `Hashtable` refusent les deux."
  - key: iterer-entryset-plutot-keyset
    format: course
    question: "Pourquoi parcourir `entrySet()` plutôt que `keySet()` quand on veut aussi les valeurs ?"
    choices:
      - {text: "On évite un `get()` supplémentaire, donc une recherche, par élément", correct: true}
      - {text: "`keySet()` lève une exception si une valeur est `null`", correct: false}
      - {text: "`entrySet()` parcourt les entrées triées par clé", correct: false}
      - {text: "`keySet()` renvoie une copie de toutes les clés, coûteuse à créer", correct: false}
    answer: "On évite une recherche `get()` supplémentaire par élément : `entrySet()` donne directement les couples. `keySet()` n'est pas une copie, mais une vue."
  - key: put-retour
    format: course
    question: Que renvoie `map.put(cle, valeur)` ?
    choices:
      - {text: "L'ancienne valeur de la clé, ou `null` s'il n'y en avait pas", correct: true}
      - {text: "La nouvelle valeur, celle qu'on vient d'associer à la clé", correct: false}
      - {text: "`true` si la clé était absente, `false` si elle était présente", correct: false}
      - {text: "La map elle-même, pour enchaîner plusieurs appels à `put`", correct: false}
    answer: L'ancienne valeur associée à la clé, ou `null` s'il n'y en avait pas ; la nouvelle valeur la remplace.
  - key: get-null
    format: course
    question: Pourquoi `map.get(cle) == null` ne suffit-il pas toujours à savoir si la clé est présente ?
    choices:
      - {text: "La clé peut être présente et associée à `null` : `containsKey` les distingue", correct: true}
      - {text: "`get` lève une exception sur une clé absente : il faut l'attraper à part", correct: false}
      - {text: "`get` renvoie `0` pour une clé absente, jamais `null`", correct: false}
      - {text: "`==` compare les références : il faut `Objects.equals(map.get(cle), null)`", correct: false}
    answer: Une `HashMap` peut associer une clé à la valeur `null` ; `containsKey` distingue « absente » de « présente avec `null` ».
  - key: vf-ordre
    format: true-false
    question: Une `HashMap` itère dans l'ordre d'insertion.
    truth: false
    answer: Aucun ordre n'est garanti ; `LinkedHashMap` garde l'ordre d'insertion.
  - key: vf-put-remplace
    format: true-false
    question: "`put` sur une clé existante ajoute une seconde entrée."
    truth: false
    answer: "Les clés sont uniques : la valeur est remplacée."
  - key: vf-get-absent
    format: true-false
    question: "`map.get(cleAbsente)` lève une exception."
    truth: false
    answer: Il renvoie `null`.
  - key: vf-get-or-default
    format: true-false
    question: "`getOrDefault(cle, 0)` ajoute la clé à la map si elle est absente."
    truth: false
    answer: Il renvoie seulement la valeur par défaut, sans modifier la map.
  - key: qcm-parcourir
    format: multiple-choice
    question: "Laquelle de ces boucles parcourt les clés et les valeurs d'une map sans refaire de recherche ?"
    choices:
      - {text: "`for (var e : map.entrySet()) { e.getKey(); e.getValue(); }`", correct: true}
      - {text: "`for (var k : map.keySet()) { map.get(k); }`", correct: false}
      - {text: "`for (int i = 0; i < map.size(); i++) map.get(i);`", correct: false}
      - {text: "`for (var v : map.values()) { map.get(v); }`", correct: false}
    answer: "`entrySet()` (ou `map.forEach((k, v) -> ...)`) donne directement les couples. Le parcours de `keySet()` refait une recherche par clé, et les indices n'ont pas de sens pour une map."
  - key: qcm-absent
    format: multiple-choice
    question: "Quelle expression donne 0 pour un produit absent de `Map<String, Integer> stock` ?"
    choices:
      - text: "`stock.getOrDefault(produit, 0)`"
        correct: true
      - text: "`stock.get(produit)`"
        correct: false
      - text: "`stock.get(produit, 0)`"
        correct: false
      - text: "`stock.containsValue(0)`"
        correct: false
    answer: '`get` renverrait `null`.'
  - key: qcm-null
    format: multiple-choice
    question: Lesquelles acceptent une clé `null` ?
    choices:
      - text: "`HashMap`"
        correct: true
      - text: "`LinkedHashMap`"
        correct: true
      - text: "`ConcurrentHashMap`"
        correct: false
      - text: "`Map.of(...)`"
        correct: false
    answer: '`TreeMap` la refuse aussi avec l''ordre naturel.'
  - key: qcm-put
    format: multiple-choice
    question: "Que vaut `ancien` après `m.put(\"a\", 1); Integer ancien = m.put(\"a\", 2);` ?"
    choices:
      - text: "1"
        correct: true
      - text: "2"
        correct: false
      - text: "`null`"
        correct: false
      - text: "Une exception"
        correct: false
    answer: '`put` renvoie la valeur remplacée.'
  - key: trous-put
    format: fill-in
    question: |-
      Complète pour associer la quantité au produit :
      ```java
      stock.___("pomme", 12);
      ```
    blanks: [[put]]
    answer: '`put` ajoute ou remplace.'
  - key: trous-default
    format: fill-in
    question: |-
      Complète pour obtenir 0 si le produit est absent :
      ```java
      int quantite = stock.___("kiwi", 0);
      ```
    blanks: [[getOrDefault]]
    answer: '`getOrDefault` évite aussi le déballage de `null`.'
  - key: trous-entry-set
    format: fill-in
    question: |-
      Complète pour parcourir clés et valeurs :
      ```java
      for (Map.Entry<String, Integer> e : stock.___()) {
          afficher(e.getKey(), e.getValue());
      }
      ```
    blanks: [[entrySet]]
    answer: '`entrySet()` donne les couples clé-valeur.'
  - key: trous-contains
    format: fill-in
    question: |-
      Complète pour savoir si une clé est présente, même associée à `null` :
      ```java
      boolean present = preferences.___("theme");
      ```
    blanks: [[containsKey]]
    answer: '`containsKey` distingue l''absence d''une valeur `null`.'
  - key: code-put-get
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> m = new HashMap<>();
      m.put("a", 1);
      Integer ancien = m.put("a", 2);
      System.out.println(ancien + " " + m.get("a") + " " + m.get("z"));
      ```
    choices:
      - {text: "`1 2 null`", correct: true}
      - {text: "`null 2 null`", correct: false}
      - {text: "`2 2 null`", correct: false}
      - {text: "`1 2 0`", correct: false}
    answer: '`1 2 null`.'
    check:
      output: "1 2 null"
  - key: code-default
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> m = Map.of("a", 1);
      System.out.println(m.getOrDefault("z", 0) + " " + m.containsKey("a") + " " + m.size());
      ```
    choices:
      - {text: "`0 true 1`", correct: true}
      - {text: "`0 true 2`", correct: false}
      - {text: "`null true 1`", correct: false}
      - {text: "`0 false 1`", correct: false}
    answer: '`0 true 1` : `getOrDefault` ne modifie pas la map.'
    check:
      output: "0 true 1"
  - key: code-entry-set
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> m = new TreeMap<>(Map.of("b", 2, "a", 1));
      for (var e : m.entrySet()) {
          System.out.print(e.getKey() + "=" + e.getValue() + ";");
      }
      ```
    choices:
      - {text: "`a=1;b=2;`", correct: true}
      - {text: "`b=2;a=1;`", correct: false}
      - {text: "`{a=1, b=2}`", correct: false}
      - {text: "`a1;b2;`", correct: false}
    answer: '`a=1;b=2;` (la `TreeMap` fixe l''ordre).'
    check:
      output: "a=1;b=2;"
  - key: code-null
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      Map<String, Integer> m = new HashMap<>();
      m.put(null, 1);
      m.put("vide", null);
      System.out.println(m.get(null) + " " + m.get("vide") + " " + m.containsKey("vide"));
      ```
    choices:
      - {text: "`1 null true`", correct: true}
      - {text: "`1 null false`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
      - {text: "`null null false`", correct: false}
    answer: '`1 null true` : une clé `null` et une valeur `null` sont permises.'
    check:
      output: "1 null true"
  - key: bug-keyset-get
    format: bug-fix
    question: |-
      Ce parcours refait une recherche pour chaque produit. Quelle écriture l'évite ?
      ```java
      for (String produit : stock.keySet()) {
          System.out.println(produit + " : " + stock.get(produit));
      }
      ```
    choices:
      - {text: "`stock.forEach((produit, quantite) -> System.out.println(produit + \" : \" + quantite));`", correct: true}
      - {text: "`stock.keySet().forEach(p -> System.out.println(p + \" : \" + stock.get(p)));`", correct: false}
      - {text: "`for (int i = 0; i < stock.size(); i++) System.out.println(stock.get(i));`", correct: false}
      - {text: "`System.out.println(stock.keySet() + \" : \" + stock.values());`", correct: false}
    answer: |-
      ```java
      stock.forEach((produit, quantite) -> System.out.println(produit + " : " + quantite));
      // ou : for (var e : stock.entrySet()) ...
      ```
      Chaque `get` refait une recherche ; `entrySet` ou `forEach` donnent directement les valeurs.
  - key: bug-unboxing
    format: bug-fix
    question: |-
      Ce code lève une `NullPointerException` pour un article inconnu. Quelle correction est la bonne ?
      ```java
      int quantite = panier.get(article);
      ```
    choices:
      - {text: "`int quantite = panier.getOrDefault(article, 0);`", correct: true}
      - {text: "`int quantite = (int) panier.get(article);`", correct: false}
      - {text: "`int quantite = panier.get(article).intValue();`", correct: false}
      - {text: "`int quantite = panier.containsValue(article) ? panier.get(article) : 0;`", correct: false}
    answer: |-
      ```java
      int quantite = panier.getOrDefault(article, 0);
      ```
      `get` renvoie `null` pour une clé absente, et son déballage en `int` échoue.
  - key: bug-valeur-null
    format: bug-fix
    question: |-
      Une préférence volontairement vidée (valeur `null`) est remplacée par la valeur par défaut. Quelle correction est la bonne ?
      ```java
      String theme = preferences.get("theme") != null ? preferences.get("theme") : "clair";
      ```
    choices:
      - {text: "Tester `preferences.containsKey(\"theme\")` au lieu de comparer `get` à `null`", correct: true}
      - {text: "Comparer avec `Objects.equals(preferences.get(\"theme\"), null)` au lieu de `!=`", correct: false}
      - {text: "Lire `preferences.get(\"theme\")` une seule fois, dans une variable locale", correct: false}
      - {text: "Remplacer la valeur par défaut `\"clair\"` par `null`, pour garder la valeur vidée", correct: false}
    answer: |-
      ```java
      String theme = preferences.containsKey("theme") ? preferences.get("theme") : "clair";
      ```
      `get` renvoie `null` dans les deux cas. `containsKey` distingue une clé absente d'une clé associée à `null`. (Mieux :
      éviter les valeurs `null` dans une map.)
  - key: bug-map-of-put
    format: bug-fix
    question: |-
      Ce code lève une `UnsupportedOperationException`. Quelle correction est la bonne ?
      ```java
      Map<String, Integer> limites = Map.of("api", 100);
      limites.put("admin", 1000);
      ```
    choices:
      - {text: "Créer une map modifiable : `new HashMap<>(Map.of(\"api\", 100))`", correct: true}
      - {text: "Remplacer `put` par `putIfAbsent`, que `Map.of` accepte", correct: false}
      - {text: "Déclarer `limites` avec `var`, pour obtenir une `HashMap`", correct: false}
      - {text: "Copier la map avec `Map.copyOf(limites)`, modifiable", correct: false}
    answer: |-
      ```java
      Map<String, Integer> limites = new HashMap<>(Map.of("api", 100));
      limites.put("admin", 1000);
      ```
      `Map.of` est immuable. Pour une map qu'on complète, on crée une `HashMap`.
