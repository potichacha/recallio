notion: sequenced-collections
lesson: |-
  Java 21 (JEP 431) ajoute des interfaces pour les collections qui ont un **ordre de rencontre** défini (un premier et un
  dernier élément) :

  - **`SequencedCollection`** : `List`, `Deque`, `LinkedHashSet`, `SortedSet` ;
  - **`SequencedSet`** : `LinkedHashSet`, `SortedSet` ;
  - **`SequencedMap`** : `LinkedHashMap`, `SortedMap`.

  ```java
  List<Integer> l = new ArrayList<>(List.of(1, 2, 3));
  l.getFirst();      // 1 (au lieu de l.get(0))
  l.getLast();       // 3 (au lieu de l.get(l.size() - 1))
  l.addFirst(0);
  l.removeLast();
  l.reversed();      // une VUE dans l'ordre inverse

  LinkedHashMap<String, Integer> m = new LinkedHashMap<>();
  m.putFirst("a", 1);
  m.firstEntry();    // a=1
  m.pollLastEntry(); // retire et renvoie la dernière entrée
  ```

  - Avant Java 21, chaque type avait sa façon d'obtenir le premier élément (`get(0)`, `getFirst()` de `Deque`,
    `iterator().next()`, `first()` de `SortedSet`) ; l'API est maintenant unifiée.
  - `reversed()` renvoie une **vue** : elle reflète les modifications de la collection d'origine, et la modifier modifie
    l'origine.
  - Sur une collection vide, `getFirst()` et `getLast()` lèvent une **`NoSuchElementException`**.
  - Sur une collection immuable (`List.of`), les méthodes de modification lèvent une `UnsupportedOperationException` ;
    sur un `SortedSet`, `addFirst` n'a pas de sens et lève aussi cette exception.

  **Piège classique** : appeler `getFirst()` sur une liste qui peut être vide. Comme `get(0)`, cela lève une exception ;
  on teste `isEmpty()` d'abord, ou l'on passe par un stream avec `findFirst()`.

  **En entretien** : « Java 21 unifie `getFirst`, `getLast`, `addFirst`, `addLast` et `reversed` sur toutes les
  collections ordonnées, `List` et `LinkedHashMap` comprises. »
cards:
  - key: methodes-sequencedcollection
    format: course
    question: "Quelles méthodes déclare l'interface `SequencedCollection` (Java 21) ?"
    choices:
      - {text: "`getFirst`, `getLast`, `addFirst`, `addLast`, `removeFirst`, `removeLast` et `reversed`", correct: true}
      - {text: "`first`, `last`, `push`, `pop`, `peek`, `poll` et `descending`", correct: false}
      - {text: "`head`, `tail`, `prepend`, `append`, `dropFirst`, `dropLast` et `reverse`", correct: false}
      - {text: "`firstKey`, `lastKey`, `headSet`, `tailSet`, `subSet` et `descendingSet`", correct: false}
    answer: "`getFirst`, `getLast`, `addFirst`, `addLast`, `removeFirst`, `removeLast` et `reversed`, depuis Java 21. `first`, `last` ou `headSet` sont les méthodes propres à `SortedSet`."
  - key: qui
    format: course
    question: Quelles collections sont des `SequencedCollection` ?
    choices:
      - {text: "Celles qui ont un ordre défini : `List`, `Deque`, `LinkedHashSet`, `SortedSet`", correct: true}
      - {text: "Toutes les collections, y compris `HashSet` et `PriorityQueue`", correct: false}
      - {text: "Seulement `List` : les ensembles et les files n'ont pas d'ordre", correct: false}
      - {text: "Celles qui sont triées : `SortedSet` et `PriorityQueue` seulement", correct: false}
    answer: "Celles qui ont un ordre défini : `List`, `Deque`, `LinkedHashSet`, `SortedSet` ; côté maps, `LinkedHashMap` et `SortedMap` sont des `SequencedMap`."
  - key: reversed-vue
    format: course
    question: Que renvoie `liste.reversed()` ?
    choices:
      - {text: "Une vue inversée, sans copie, liée à la liste d'origine dans les deux sens", correct: true}
      - {text: "Une copie inversée, indépendante de la liste d'origine", correct: false}
      - {text: "Rien : elle inverse la liste en place, comme `Collections.reverse`", correct: false}
      - {text: "Une vue inversée en lecture seule, qui ne suit pas les ajouts", correct: false}
    answer: "Une vue de la liste dans l'ordre inverse, sans copie : elle reflète les modifications de l'original, et inversement."
  - key: avant-java-21
    format: course
    question: "Que résout l'API des collections ordonnées (`SequencedCollection`) par rapport à Java 17 ?"
    choices:
      - {text: "Chaque type avait sa façon de lire le premier ou le dernier élément ; l'API est désormais commune", correct: true}
      - {text: "Les listes ne pouvaient pas être parcourues à l'envers avant Java 21, faute de méthode adaptée", correct: false}
      - {text: "Les collections n'avaient aucun ordre garanti avant Java 21, même les `List` et les `Deque`", correct: false}
      - {text: "Elle rend toutes les collections ordonnées thread-safe, sans enveloppe synchronisée", correct: false}
    answer: Chaque type avait sa propre façon d'obtenir le premier ou le dernier élément (`get(0)`, `getFirst()` de `Deque`, `first()` de `SortedSet`, un itérateur pour `LinkedHashSet`) ; l'API est désormais commune.
  - key: vf-version
    format: true-false
    question: Les collections séquencées sont apparues en Java 21.
    truth: true
    answer: JEP 431.
  - key: vf-hashset
    format: true-false
    question: "`HashSet` est une `SequencedCollection`."
    truth: false
    answer: Il n'a pas d'ordre défini ; `LinkedHashSet` en est une.
  - key: vf-vide
    format: true-false
    question: "`getFirst()` sur une liste vide renvoie `null`."
    truth: false
    answer: Il lève une `NoSuchElementException`.
  - key: vf-vue
    format: true-false
    question: Ajouter un élément à une liste modifie aussi la vue renvoyée auparavant par `reversed()`.
    truth: true
    answer: La vue reflète la liste d'origine.
  - key: qcm-dernier
    format: multiple-choice
    question: "Quelle méthode, ajoutée en Java 21, donne le dernier élément d'une `List` non vide ?"
    choices:
      - {text: "`liste.getLast()`", correct: true}
      - {text: "`liste.last()`", correct: false}
      - {text: "`liste.get(-1)`", correct: false}
      - {text: "`liste.peekLast()`", correct: false}
    answer: "`getLast()`, plus lisible que `liste.get(liste.size() - 1)`. `last()` appartient à `SortedSet`, `peekLast()` à `Deque`, et les indices négatifs n'existent pas."
  - key: qcm-map
    format: multiple-choice
    question: Lesquelles sont des `SequencedMap` ?
    choices:
      - text: "`LinkedHashMap`"
        correct: true
      - text: "`TreeMap`"
        correct: true
      - text: "`HashMap`"
        correct: false
      - text: "`EnumMap`, depuis Java 17"
        correct: false
    answer: '`TreeMap` est une `SortedMap`, donc une `SequencedMap`.'
  - key: qcm-inverse
    format: multiple-choice
    question: Comment parcourir une liste à l'envers sans la copier ?
    choices:
      - text: "`for (var e : liste.reversed())`"
        correct: true
      - text: "`Collections.reverse(liste)` puis un for-each"
        correct: false
      - text: "`liste.stream().sorted()`"
        correct: false
      - text: "`new ArrayList<>(liste).reversed()`, obligatoirement"
        correct: false
    answer: '`Collections.reverse` modifie la liste d''origine.'
  - key: qcm-sorted-set
    format: multiple-choice
    question: "Que fait `treeSet.addFirst(x)` ?"
    choices:
      - {text: "Il lève une `UnsupportedOperationException` : c'est l'ordre de tri qui décide de la position", correct: true}
      - {text: "Il insère `x` en tête de l'ensemble, avant tous les autres éléments, quel que soit son rang", correct: false}
      - {text: "Il remplace le premier élément de l'ensemble par `x`, et renvoie l'élément remplacé", correct: false}
      - {text: "Il ne compile pas : `TreeSet` ne déclare aucune méthode `addFirst`, propre aux listes", correct: false}
    answer: Un ensemble trié ne peut pas placer un élément où l'on veut.
  - key: code-premier-dernier
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = new ArrayList<>(List.of(1, 2, 3));
      System.out.println(l.getFirst() + " " + l.getLast() + " " + l.reversed());
      ```
    choices:
      - {text: "`1 3 [3, 2, 1]`", correct: true}
      - {text: "`1 3 [1, 2, 3]`", correct: false}
      - {text: "`3 1 [3, 2, 1]`", correct: false}
      - {text: "`3 1 [1, 2, 3]`", correct: false}
    answer: '`1 3 [3, 2, 1]`.'
    check:
      output: "1 3 [3, 2, 1]"
  - key: code-vue
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<Integer> l = new ArrayList<>(List.of(1, 2));
      List<Integer> inverse = l.reversed();
      l.add(3);
      System.out.println(inverse);
      ```
    choices:
      - {text: "`[3, 2, 1]`", correct: true}
      - {text: "`[2, 1]`", correct: false}
      - {text: "`[1, 2, 3]`", correct: false}
      - {text: "`[2, 1, 3]`", correct: false}
    answer: '`[3, 2, 1]` : la vue inversée reflète l''ajout.'
    check:
      output: "[3, 2, 1]"
  - key: code-vide
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      List<String> vide = new ArrayList<>();
      System.out.println(vide.getFirst());
      ```
    choices:
      - {text: "Une `NoSuchElementException`", correct: true}
      - {text: "`null`", correct: false}
      - {text: "Une `IndexOutOfBoundsException`", correct: false}
      - {text: "Une ligne vide", correct: false}
    answer: "Une `NoSuchElementException` : la liste est vide."
    check:
      throws: NoSuchElementException
  - key: code-sequenced-map
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```java
      LinkedHashMap<String, Integer> m = new LinkedHashMap<>();
      m.put("b", 2);
      m.put("c", 3);
      m.putFirst("a", 1);
      System.out.println(m.firstEntry() + " " + m.lastEntry().getKey() + " " + m.keySet());
      ```
    choices:
      - {text: "`a=1 c [a, b, c]`", correct: true}
      - {text: "`b=2 a [b, c, a]`", correct: false}
      - {text: "`a=1 a [a, b, c]`", correct: false}
      - {text: "`b=2 c [b, c, a]`", correct: false}
    answer: '`a=1 c [a, b, c]` : `putFirst` place l''entrée en tête.'
    check:
      output: "a=1 c [a, b, c]"
  - key: bug-dernier-indice
    format: bug-fix
    question: |-
      Quelle écriture Java 21 remplace ce calcul d'indice ?
      ```java
      Commande derniere = commandes.get(commandes.size() - 1);
      ```
    choices:
      - {text: "`Commande derniere = commandes.getLast();`", correct: true}
      - {text: "`Commande derniere = commandes.last();`", correct: false}
      - {text: "`Commande derniere = commandes.get(-1);`", correct: false}
      - {text: "`Commande derniere = commandes.reversed().getLast();`", correct: false}
    answer: |-
      ```java
      Commande derniere = commandes.getLast();
      ```
      Plus lisible, sans calcul d'indice. (Les deux lèvent une exception si la liste est vide.)
  - key: bug-inverse-copie
    format: bug-fix
    question: |-
      Quelle écriture simplifie ce parcours à l'envers, sans copier la liste ?
      ```java
      List<Etape> copie = new ArrayList<>(etapes);
      Collections.reverse(copie);
      for (Etape e : copie) annuler(e);
      ```
    choices:
      - {text: "`for (Etape e : etapes.reversed()) annuler(e);`", correct: true}
      - {text: "`for (Etape e : Collections.reverse(etapes)) annuler(e);`", correct: false}
      - {text: "`for (Etape e : etapes.descendingList()) annuler(e);`", correct: false}
      - {text: "`etapes.sort(Comparator.reverseOrder()); for (Etape e : etapes) annuler(e);`", correct: false}
    answer: |-
      ```java
      for (Etape e : etapes.reversed()) annuler(e);
      ```
      `reversed()` donne une vue inversée sans copier la liste.
  - key: bug-vide
    format: bug-fix
    question: |-
      Ce code lève une `NoSuchElementException` pour un client sans commande. Quelle correction est la bonne ?
      ```java
      LocalDate derniere = client.commandes().getLast().date();
      ```
    choices:
      - {text: "Tester `isEmpty()` et renvoyer un `Optional` vide pour un client sans commande", correct: true}
      - {text: "Remplacer `getLast()` par `get(size() - 1)`, qui gère la liste vide", correct: false}
      - {text: "Entourer l'appel d'un `try` qui renvoie la date du jour en cas d'erreur", correct: false}
      - {text: "Remplacer `getLast()` par `reversed().getFirst()`, sans exception sur une liste vide", correct: false}
    answer: |-
      ```java
      Optional<LocalDate> derniere = client.commandes().isEmpty()
              ? Optional.empty()
              : Optional.of(client.commandes().getLast().date());
      ```
      `getLast()` lève une exception sur une liste vide : l'absence de commande est un cas normal à exprimer.
  - key: bug-premier-set
    format: bug-fix
    question: |-
      Quelle écriture Java 21 lit directement le premier élément de ce `LinkedHashSet` ?
      ```java
      String premier = visites.iterator().next();
      ```
    choices:
      - {text: "`String premier = visites.getFirst();`", correct: true}
      - {text: "`String premier = visites.get(0);`", correct: false}
      - {text: "`String premier = visites.first();`", correct: false}
      - {text: "`String premier = visites.peek();`", correct: false}
    answer: |-
      ```java
      String premier = visites.getFirst();
      ```
      `LinkedHashSet` est une `SequencedCollection` : `getFirst()` dit directement l'intention.
