notion: sequenced-collections
lesson: |-
  Java 21 (JEP 431) ajoute des interfaces pour les collections qui ont un **ordre de rencontre** défini (un premier et un
  dernier élément) :

  - **`SequencedCollection`** : `List`, `Deque`, `LinkedHashSet`, `SortedSet` ;
  - **`SequencedSet`** : `LinkedHashSet`, `SortedSet` ;
  - **`SequencedMap`** : `LinkedHashMap`, `SortedMap`.

  ```java
  List<Integer> l = new ArrayList<>(List.of(1, 2, 3));
  l.getFirst();      // 1 (au lieu de l.get(0))
  l.getLast();       // 3 (au lieu de l.get(l.size() - 1))
  l.addFirst(0);
  l.removeLast();
  l.reversed();      // une VUE dans l'ordre inverse

  LinkedHashMap<String, Integer> m = new LinkedHashMap<>();
  m.putFirst("a", 1);
  m.firstEntry();    // a=1
  m.pollLastEntry(); // retire et renvoie la dernière entrée
  ```

  - Avant Java 21, chaque type avait sa façon d'obtenir le premier élément (`get(0)`, `getFirst()` de `Deque`,
    `iterator().next()`, `first()` de `SortedSet`) ; l'API est maintenant unifiée.
  - `reversed()` renvoie une **vue** : elle reflète les modifications de la collection d'origine, et la modifier modifie
    l'origine.
  - Sur une collection vide, `getFirst()` et `getLast()` lèvent une **`NoSuchElementException`**.
  - Sur une collection immuable (`List.of`), les méthodes de modification lèvent une `UnsupportedOperationException` ;
    sur un `SortedSet`, `addFirst` n'a pas de sens et lève aussi cette exception.

  **Piège classique** : appeler `getFirst()` sur une liste qui peut être vide. Comme `get(0)`, cela lève une exception ;
  on teste `isEmpty()` d'abord, ou l'on passe par un stream avec `findFirst()`.

  **En entretien** : « Java 21 unifie `getFirst`, `getLast`, `addFirst`, `addLast` et `reversed` sur toutes les
  collections ordonnées, `List` et `LinkedHashMap` comprises. »
cards:
  - key: methodes-sequencedcollection
    format: course
    question: Méthodes de SequencedCollection ?
    answer: getFirst, getLast, addFirst, addLast, removeFirst, removeLast, reversed (Java 21).
  - key: qui
    format: course
    question: Quelles collections sont des `SequencedCollection` ?
    answer: "Celles qui ont un ordre défini : `List`, `Deque`, `LinkedHashSet`, `SortedSet` ; côté maps, `LinkedHashMap` et `SortedMap` sont des `SequencedMap`."
  - key: reversed-vue
    format: course
    question: Que renvoie `liste.reversed()` ?
    answer: "Une vue de la liste dans l'ordre inverse, sans copie : elle reflète les modifications de l'original, et inversement."
  - key: avant-java-21
    format: course
    question: Que résout cette API par rapport à Java 17 ?
    answer: Chaque type avait sa propre façon d'obtenir le premier ou le dernier élément (`get(0)`, `getFirst()` de `Deque`, `first()` de `SortedSet`, un itérateur pour `LinkedHashSet`) ; l'API est désormais commune.
  - key: vf-version
    format: true-false
    question: Les collections séquencées sont apparues en Java 21.
    truth: true
    answer: JEP 431.
  - key: vf-hashset
    format: true-false
    question: "`HashSet` est une `SequencedCollection`."
    truth: false
    answer: Il n'a pas d'ordre défini ; `LinkedHashSet` en est une.
  - key: vf-vide
    format: true-false
    question: "`getFirst()` sur une liste vide renvoie `null`."
    truth: false
    answer: Il lève une `NoSuchElementException`.
  - key: vf-vue
    format: true-false
    question: Ajouter un élément à une liste modifie aussi la vue renvoyée auparavant par `reversed()`.
    truth: true
    answer: La vue reflète la liste d'origine.
  - key: qcm-dernier
    format: multiple-choice
    question: Comment obtenir le dernier élément d'une `List` non vide en Java 21 ?
    choices:
      - text: "`liste.getLast()`"
        correct: true
      - text: "`liste.get(liste.size() - 1)`"
        correct: true
      - text: "`liste.last()`"
        correct: false
      - text: "`liste.get(-1)`"
        correct: false
    answer: '`getLast` est plus lisible ; les indices négatifs n''existent pas.'
  - key: qcm-map
    format: multiple-choice
    question: Lesquelles sont des `SequencedMap` ?
    choices:
      - text: "`LinkedHashMap`"
        correct: true
      - text: "`TreeMap`"
        correct: true
      - text: "`HashMap`"
        correct: false
      - text: "`EnumMap`, depuis Java 17"
        correct: false
    answer: '`TreeMap` est une `SortedMap`, donc une `SequencedMap`.'
  - key: qcm-inverse
    format: multiple-choice
    question: Comment parcourir une liste à l'envers sans la copier ?
    choices:
      - text: "`for (var e : liste.reversed())`"
        correct: true
      - text: "`Collections.reverse(liste)` puis un for-each"
        correct: false
      - text: "`liste.stream().sorted()`"
        correct: false
      - text: "`new ArrayList<>(liste).reversed()`, obligatoirement"
        correct: false
    answer: '`Collections.reverse` modifie la liste d''origine.'
  - key: qcm-sorted-set
    format: multiple-choice
    question: "Que fait `treeSet.addFirst(x)` ?"
    choices:
      - text: "Il lève une `UnsupportedOperationException` : c'est l'ordre de tri qui décide de la position"
        correct: true
      - text: "Il insère `x` en tête"
        correct: false
      - text: "Il remplace le premier élément"
        correct: false
      - text: "Il ne compile pas"
        correct: false
    answer: Un ensemble trié ne peut pas placer un élément où l'on veut.
  - key: code-premier-dernier
    format: code-output
    question: |-
      ```java
      List<Integer> l = new ArrayList<>(List.of(1, 2, 3));
      System.out.println(l.getFirst() + " " + l.getLast() + " " + l.reversed());
      ```
    answer: '`1 3 [3, 2, 1]`.'
    check:
      output: "1 3 [3, 2, 1]"
  - key: code-vue
    format: code-output
    question: |-
      ```java
      List<Integer> l = new ArrayList<>(List.of(1, 2));
      List<Integer> inverse = l.reversed();
      l.add(3);
      System.out.println(inverse);
      ```
    answer: '`[3, 2, 1]` : la vue inversée reflète l''ajout.'
    check:
      output: "[3, 2, 1]"
  - key: code-vide
    format: code-output
    question: |-
      ```java
      List<String> vide = new ArrayList<>();
      System.out.println(vide.getFirst());
      ```
    answer: "Une `NoSuchElementException` : la liste est vide."
    check:
      throws: NoSuchElementException
  - key: code-sequenced-map
    format: code-output
    question: |-
      ```java
      LinkedHashMap<String, Integer> m = new LinkedHashMap<>();
      m.put("b", 2);
      m.put("c", 3);
      m.putFirst("a", 1);
      System.out.println(m.firstEntry() + " " + m.lastEntry().getKey() + " " + m.keySet());
      ```
    answer: '`a=1 c [a, b, c]` : `putFirst` place l''entrée en tête.'
    check:
      output: "a=1 c [a, b, c]"
  - key: bug-dernier-indice
    format: bug-fix
    question: |-
      Modernisez (Java 21) :
      ```java
      Commande derniere = commandes.get(commandes.size() - 1);
      ```
    answer: |-
      ```java
      Commande derniere = commandes.getLast();
      ```
      Plus lisible, sans calcul d'indice. (Les deux lèvent une exception si la liste est vide.)
  - key: bug-inverse-copie
    format: bug-fix
    question: |-
      Simplifiez ce parcours à l'envers :
      ```java
      List<Etape> copie = new ArrayList<>(etapes);
      Collections.reverse(copie);
      for (Etape e : copie) annuler(e);
      ```
    answer: |-
      ```java
      for (Etape e : etapes.reversed()) annuler(e);
      ```
      `reversed()` donne une vue inversée sans copier la liste.
  - key: bug-vide
    format: bug-fix
    question: |-
      Ce code lève une `NoSuchElementException` pour un client sans commande :
      ```java
      LocalDate derniere = client.commandes().getLast().date();
      ```
    answer: |-
      ```java
      Optional<LocalDate> derniere = client.commandes().isEmpty()
              ? Optional.empty()
              : Optional.of(client.commandes().getLast().date());
      ```
      `getLast()` lève une exception sur une liste vide : l'absence de commande est un cas normal à exprimer.
  - key: bug-premier-set
    format: bug-fix
    question: |-
      Modernisez la lecture du premier élément d'un `LinkedHashSet` (Java 21) :
      ```java
      String premier = visites.iterator().next();
      ```
    answer: |-
      ```java
      String premier = visites.getFirst();
      ```
      `LinkedHashSet` est une `SequencedCollection` : `getFirst()` dit directement l'intention.
