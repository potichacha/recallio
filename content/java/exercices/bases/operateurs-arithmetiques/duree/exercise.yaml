statement: |-
  Écris `Duree.enTexte`, qui affiche une durée donnée en secondes sous la forme `"1 h 2 min 5 s"` :

  - `enTexte(3725)` renvoie `"1 h 2 min 5 s"` ;
  - `enTexte(59)` renvoie `"0 h 0 min 59 s"`.

  Les opérateurs `/` (division entière) et `%` (reste) suffisent : pas besoin de boucle.
explanation: |-
  Une heure fait 3600 secondes : `secondes / 3600` donne les heures entières. Ce qui reste après les heures,
  `secondes % 3600`, se découpe à son tour en minutes (`/ 60`) et en secondes (`% 60`). C'est le schéma classique pour
  découper une quantité : le quotient donne l'unité supérieure, le reste ce qui n'y entre pas.
