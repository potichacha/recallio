statement: |-
  Le grand classique des entretiens : écris `FizzBuzz.jusqua(n)`, qui renvoie les nombres de 1 à `n` séparés par des
  espaces, en remplaçant :

  - les multiples de 3 par `Fizz` ;
  - les multiples de 5 par `Buzz` ;
  - les multiples de 3 **et** de 5 par `FizzBuzz`.

  `jusqua(5)` renvoie `"1 2 Fizz 4 Buzz"`, et `jusqua(0)` une chaîne vide.
explanation: |-
  Une boucle `for` de 1 à `n` inclus, et pour chaque nombre un `if / else if` sur le reste de la division (`%`). L'ordre
  des tests compte : on teste d'abord « multiple de 15 » (de 3 et de 5), sinon le test « multiple de 3 » l'attraperait
  avant. Le `StringBuilder` assemble la chaîne, avec une espace entre les éléments mais pas avant le premier.
