statement: |-
  Écris `Nombres.estPremier`, qui dit si un entier est **premier** : supérieur ou égal à 2, et divisible seulement par 1
  et par lui-même.

  - `estPremier(7)` et `estPremier(2)` renvoient `true` ;
  - `estPremier(9)`, `estPremier(1)`, `estPremier(0)` et `estPremier(-5)` renvoient `false`.
explanation: |-
  On écarte d'abord les nombres inférieurs à 2 (clause de garde), puis on cherche un diviseur de 2 à la racine carrée
  de `n` : si `n` avait un diviseur plus grand, il en aurait forcément un plus petit que sa racine. La condition
  `i * i <= n` évite de calculer la racine. Dès qu'un diviseur est trouvé, `return false` sort de la méthode ; si la
  boucle se termine, le nombre est premier.
