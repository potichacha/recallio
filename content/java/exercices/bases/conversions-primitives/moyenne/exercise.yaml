statement: |-
  `Moyenne.de` calcule la moyenne de notes entières, mais elle se trompe : la moyenne de 10 et 15 donne `12.0` au lieu
  de `12.5`, et un tableau vide fait planter le programme.

  Corrige-la pour qu'elle renvoie la vraie moyenne, avec ses décimales, et `0.0` quand il n'y a aucune note.
explanation: |-
  `somme / notes.length` est une division **entière** entre deux `int` : la partie décimale est perdue avant même la
  conversion en `double`. Convertir un opérande, `(double) somme / notes.length`, rend la division décimale. Sans note,
  on renvoie `0.0` avant de diviser : une division entière par zéro lève une `ArithmeticException`.
