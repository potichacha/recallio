statement: |-
  Écris `Salutation.saluer`, qui prépare la phrase d'accueil d'un programme :

  - `saluer("Ada")` renvoie `"Bonjour, Ada !"` ;
  - les espaces autour du prénom sont ignorés : `saluer("  Ada ")` renvoie aussi `"Bonjour, Ada !"` ;
  - sans prénom (`null`, ou une chaîne vide ou faite d'espaces), elle renvoie `"Bonjour !"`.

  La méthode `main` est déjà écrite : elle affiche la salutation du premier argument de la ligne de commande.
explanation: |-
  `strip()` retire les espaces au début et à la fin d'une chaîne, et `isBlank()` dit si elle est vide ou ne contient que
  des espaces. Le test `prenom == null` doit venir **avant** : appeler une méthode sur `null` lèverait une
  `NullPointerException`. La concaténation avec `+` construit ensuite la phrase.
