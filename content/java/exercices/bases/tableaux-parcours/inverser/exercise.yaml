statement: |-
  Écris `Tableaux.inverser`, qui inverse l'ordre des éléments d'un tableau **en place** : `{1, 2, 3}` devient
  `{3, 2, 1}`. La méthode ne renvoie rien et ne crée pas de nouveau tableau.

  Elle doit marcher pour une longueur paire ou impaire, et pour un tableau vide.
explanation: |-
  On échange les éléments deux à deux en partant des extrémités : le premier avec le dernier, le deuxième avec
  l'avant-dernier, et ainsi de suite jusqu'au milieu. On s'arrête à `t.length / 2` : aller plus loin réinverserait ce
  qu'on vient d'inverser. Une variable temporaire garde la valeur écrasée par l'échange. Pour une longueur impaire,
  l'élément du milieu reste à sa place.
