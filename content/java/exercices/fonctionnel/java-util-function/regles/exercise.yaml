statement: |-
  Écris trois méthodes de `Regles`, qui fabriquent des fonctions à partir d'autres fonctions :

  - `toutes(regles)` : un prédicat vrai quand **toutes** les règles le sont (vrai pour une liste vide) ;
  - `auMoinsUne(regles)` : un prédicat vrai quand **au moins une** règle l'est (faux pour une liste vide) ;
  - `enchainer(etapes)` : une fonction qui applique les étapes **dans l'ordre** de la liste (l'identité pour une liste
    vide).

  N'utilise ni boucle `for` ni `if` : seulement les méthodes de `Predicate`, `Function` et des streams.
explanation: |-
  Un `reduce` combine les fonctions deux à deux, à partir d'un élément neutre : `x -> true` pour `and` (vrai et p vaut
  p), `x -> false` pour `or`, et `UnaryOperator.identity()` pour l'enchaînement. `Function.andThen` applique d'abord la
  fonction de gauche, ce qui respecte l'ordre de la liste ; `compose` l'aurait inversé. `andThen` renvoie une
  `Function<String, String>`, qu'on adapte en `UnaryOperator` avec une référence `::apply`.
