statement: |-
  Une `Commande` a un client, un montant en centimes et un indicateur « payée ». Écris `Caisse.totalPaye`, qui renvoie
  la somme des montants des seules commandes payées, avec un stream plutôt qu'une boucle.

  `Commande.java` est donné : tu n'as pas à le modifier.
explanation: |-
  `filter` garde les commandes payées, `mapToInt` extrait les montants dans un `IntStream`, et `sum` les additionne (0
  pour un stream vide). Passer par `mapToInt` évite le boxing en `Integer` qu'imposerait `map(...).reduce(0,
  Integer::sum)`.
