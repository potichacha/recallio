statement: |-
  Une `Vente` a un vendeur, une région et un montant en euros (`Vente.java` est donné). Écris trois méthodes de
  `Rapports`, chacune en un seul pipeline de stream :

  - `totalParRegion(ventes)` : le montant total par région, **trié par région** ;
  - `vendeursParRegion(ventes)` : par région (triée), l'ensemble trié des vendeurs qui y ont vendu ;
  - `grossesVentes(ventes, seuil)` : les ventes séparées en deux groupes, `true` pour celles dont le montant atteint le
    seuil, `false` pour les autres ; les deux clés doivent toujours être présentes.
explanation: |-
  `groupingBy` accepte une fabrique de map (`TreeMap::new`) pour trier les régions, et un collecteur en aval qui agrège
  chaque groupe sans construire de liste intermédiaire : `summingInt` pour les totaux, `mapping(Vente::vendeur,
  toCollection(TreeSet::new))` pour les vendeurs triés et sans doublon. `partitioningBy` garantit les clés `true` et
  `false`, même quand un groupe est vide, ce que `groupingBy` sur un booléen ne ferait pas.
