statement: |-
  `Inscription.verifier(String email, int age)` doit refuser les inscriptions invalides en levant une
  `IllegalArgumentException` dont le **message dit ce qui ne va pas** :

  - un email `null` ou sans `@` : message `"email invalide : <email>"` ;
  - un âge inférieur à 13 : message `"âge minimum 13 ans : <age>"` ;
  - un âge supérieur à 120 : message `"âge invraisemblable : <age>"`.

  Une inscription valide ne lève rien. L'email est vérifié avant l'âge.
explanation: |-
  On valide au début de la méthode et l'on lève dès la première erreur (*fail fast*), avec `throw new
  IllegalArgumentException(...)`. Le message contient la valeur reçue : on comprend l'erreur sans déboguer. Pas de
  `throws` dans la signature : `IllegalArgumentException` est non vérifiée, car un argument invalide est une erreur de
  l'appelant. Les bornes 13 et 120 deviennent des constantes nommées, et le test `email == null` vient avant
  `email.contains("@")`, qui lèverait sinon une `NullPointerException`.
