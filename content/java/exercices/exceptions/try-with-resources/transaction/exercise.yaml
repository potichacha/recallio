statement: |-
  Une `Transaction` s'ouvre à sa création et doit pouvoir s'utiliser dans un `try-with-resources` :

  ```java
  try (Transaction t = new Transaction(journal)) {
      virer(...);
      t.valider();
  }
  ```

  Le `Journal` (fourni) enregistre les événements. Écris `Transaction` :

  - à la création, elle ajoute `"ouverte"` au journal ;
  - `valider()` ajoute `"validée"` ;
  - `close()` ajoute `"annulée"` si la transaction n'a pas été validée, et ne fait rien sinon ;
  - fermer deux fois ne doit pas annuler deux fois (`close()` est idempotente).
explanation: |-
  `Transaction` implémente `AutoCloseable` : `try-with-resources` appelle `close()` à la sortie du bloc, même quand une
  exception interrompt le virement. Un booléen `validee` dit si `close()` doit annuler ; un second, `fermee`, rend
  `close()` idempotente (c'est même exigé par le contrat de `Closeable`). Grâce à ce patron, l'oubli d'un `valider()`
  ou une exception en cours de route ne laissent jamais une transaction ouverte : la ressource se nettoie seule.
