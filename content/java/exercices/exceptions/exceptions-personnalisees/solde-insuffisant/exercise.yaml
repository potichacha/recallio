statement: |-
  Un `Compte` refuse un retrait supérieur à son solde. Aujourd'hui, il lève une `RuntimeException("solde")` qui ne dit
  rien, et l'API ne sait pas quoi répondre.

  Écris l'exception métier **`SoldeInsuffisant`** :

  - elle est **non vérifiée** ;
  - elle porte le `solde` et le `montant` demandé, avec des accesseurs `solde()` et `montant()`, et `manque()` qui
    renvoie la différence ;
  - son message vaut `"solde 20.0 insuffisant pour un retrait de 50.0"` (avec les valeurs réelles).

  Puis fais lever cette exception par `Compte.retirer` quand le montant dépasse le solde (le solde ne change pas).
explanation: |-
  `SoldeInsuffisant` étend `RuntimeException` : une erreur métier n'alourdit pas les signatures, et un gestionnaire global
  peut la traduire en réponse 409 ou 422. Le message, passé à `super(...)`, sert aux journaux ; les champs servent au
  code, qui n'a pas à analyser le texte. `retirer` vérifie la règle avant de modifier l'état (*fail fast*) : si
  l'exception est levée, le solde reste intact.
