statement: |-
  Les signatures de `OutilsCollections` appliquent déjà PECS. Écris leurs corps :

  - `somme(Collection<? extends Number> nombres)` additionne des nombres de n'importe quel type (`Integer`,
    `Double`...) ;
  - `copierSi(Collection<? extends T> source, Predicate<? super T> condition, Collection<? super T> cible)` ajoute à
    `cible` les éléments de `source` qui vérifient `condition` ;
  - `remplir(Collection<? super T> cible, T valeur, int fois)` ajoute `fois` fois `valeur` à `cible`.

  Les tests copient par exemple des `Integer` dans une `List<Number>` avec un `Predicate<Object>`.
explanation: |-
  La source **produit** des `T` (on la lit) : `? extends T`. La cible **consomme** des `T` (on y ajoute) : `? super T`.
  Le prédicat consomme lui aussi ses arguments : `Predicate<? super T>` accepte un prédicat sur un type parent. Grâce à
  ces jokers, `copierSi(List<Integer>, Predicate<Object>, List<Number>)` compile, alors qu'avec `List<T>` partout, `T`
  devrait être à la fois `Integer`, `Object` et `Number`. Dans `somme`, chaque élément est lu comme un `Number`, et
  `doubleValue()` convertit.
