statement: |-
  Écris la classe générique `Pile<T>`, une pile (dernier entré, premier sorti) d'éléments de n'importe quel type :

  - `empiler(T element)` ajoute un élément au sommet ;
  - `depiler()` retire et renvoie le sommet, et lève une `IllegalStateException` si la pile est vide ;
  - `sommet()` renvoie le sommet sans le retirer, dans un `Optional<T>` (vide si la pile est vide) ;
  - `taille()` et `estVide()`.
explanation: |-
  Le paramètre `T` apparaît dans les signatures : `empiler(T)`, `T depiler()`, `Optional<T> sommet()`. Une
  `Pile<String>` refuse donc un `Integer` à la compilation, et `depiler()` renvoie directement une `String`, sans cast.
  En interne, une `ArrayDeque<T>` (ou une `ArrayList<T>`) stocke les éléments ; on ne fait pas hériter `Pile` de
  `ArrayList`, ce qui exposerait des opérations qui cassent l'ordre LIFO. `depiler` sur une pile vide est une erreur
  d'utilisation (`IllegalStateException`), alors que `sommet` traite l'absence comme un cas normal (`Optional`).
