statement: |-
  Écris deux méthodes de `Saisies`, qui lisent des nombres tapés par un utilisateur :

  - `entierOuDefaut(String texte, int defaut)` renvoie l'entier écrit dans `texte` (les blancs autour sont permis), ou
    `defaut` si le texte est `null`, vide ou n'est pas un entier valide ;
  - `somme(String liste)` additionne les entiers d'une liste séparée par des virgules, comme `"12, 7 ,x, 3"`, en
    **ignorant** les éléments invalides (ici `x`) : le résultat vaut 22. La somme d'une liste vide vaut 0.
explanation: |-
  `Integer.parseInt` refuse les blancs : on fait `strip()` avant. Un texte invalide lève une `NumberFormatException`, qu'on
  attrape pour renvoyer la valeur par défaut ; `null` se teste avant, car `strip()` lèverait une
  `NullPointerException`. `somme` réutilise `entierOuDefaut` avec un défaut de 0 pour chaque élément de
  `split(",")` : un élément invalide ne compte pas. Attraper l'exception est ici un choix assumé (« ignorer les erreurs
  de saisie ») ; dans une API, on préférerait signaler l'élément invalide.
