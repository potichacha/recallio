statement: |-
  `Calendrier` reçoit une `Clock` dans son constructeur, mais ses méthodes lisent l'horloge du système : les tests ne
  peuvent pas choisir la date du jour.

  Écris ses trois méthodes **en lisant la date à partir de l'horloge reçue** :

  - `age(LocalDate naissance)` : l'âge en années révolues ;
  - `joursAvant(LocalDate date)` : le nombre de jours d'aujourd'hui à `date` (négatif si la date est passée) ;
  - `estWeekEnd()` : vrai si aujourd'hui est un samedi ou un dimanche.
explanation: |-
  Chaque méthode appelle `LocalDate.now(clock)` au lieu de `LocalDate.now()` : en production on passe
  `Clock.systemUTC()`, en test une horloge `Clock.fixed`. `Period.between(naissance, aujourdhui).getYears()` donne l'âge
  exact, années bissextiles comprises (diviser des jours par 365 se tromperait la veille d'un anniversaire).
  `ChronoUnit.DAYS.between` compte les jours, avec un signe. `getDayOfWeek()` renvoie une enum `DayOfWeek`, qu'on compare
  aux constantes `SATURDAY` et `SUNDAY`. L'horloge porte un fuseau : c'est lui qui décide du « jour » courant.
