statement: |-
  Écris trois méthodes de la classe `Textes` :

  - `initiales("ada lovelace")` renvoie `"AL"` : la première lettre de chaque mot, en majuscule (les mots sont séparés
    par un ou plusieurs espaces) ;
  - `estPalindrome("Esope reste ici et se repose")` renvoie `true` : le texte se lit de la même façon dans les deux
    sens, sans tenir compte des espaces ni de la casse ;
  - `masquer("4970123456789012")` renvoie `"************9012"` : tout est remplacé par `*` sauf les quatre derniers
    caractères (un texte de quatre caractères ou moins est renvoyé tel quel).
explanation: |-
  `initiales` découpe le texte avec `strip().split("\\s+")`, qui accepte plusieurs espaces, puis garde `charAt(0)` de
  chaque mot dans un `StringBuilder`. `estPalindrome` normalise d'abord (`replace(" ", "")`, `toLowerCase(Locale.ROOT)`),
  puis compare le texte à son inverse obtenu par `new StringBuilder(t).reverse()` ; une boucle avec deux indices qui se
  rapprochent ferait la même chose sans copie. `masquer` assemble `"*".repeat(n - 4)` et `substring(n - 4)`. Aucune
  méthode ne modifie sa chaîne : elles renvoient toutes une nouvelle `String`.
