statement: |-
  L'`Annuaire` associe des noms à des adresses email. Aujourd'hui, `email` renvoie `null` pour un nom inconnu, et les
  appelants plantent.

  Corrige-le avec `Optional` :

  - `email(String nom)` renvoie un `Optional<String>` : vide si le nom est inconnu ;
  - `domaine(String nom)` renvoie le domaine de l'email (ce qui suit `@`), ou `"inconnu"` ;
  - `emailsConnus(List<String> noms)` renvoie les emails des noms connus, dans l'ordre, en ignorant les inconnus.

  N'utilise ni `get()` ni `isPresent()`.
explanation: |-
  `Optional.ofNullable(adresses.get(nom))` transforme le `null` de la `Map` en un `Optional` vide. `domaine` chaîne
  `map(e -> e.substring(e.indexOf('@') + 1))` et `orElse("inconnu")` : la fonction n'est appelée que si l'email existe.
  `emailsConnus` passe chaque nom par `email`, puis `flatMap(Optional::stream)` ne garde que les valeurs présentes. Le
  type de retour `Optional` dit aux appelants que l'absence est un cas normal, que le compilateur les oblige à traiter.
