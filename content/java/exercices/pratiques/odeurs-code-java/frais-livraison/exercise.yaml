statement: |-
  Voici le code d'origine qui calcule les frais de livraison d'une commande :

  ```java
  static double calc(int t, long m, boolean e) {
      double r = 0;
      if (t == 1) { if (m < 5000) { r = 490; } else { r = 0; } }
      else if (t == 2) { r = 0; }
      else { r = 990; }
      if (e) { r = r + 1000; }
      return r;
  }
  ```

  Il marche, mais il accumule les odeurs : des noms d'une lettre, des codes magiques (`1`, `2`), des montants magiques, un
  paramètre booléen, un `double` pour de l'argent, des `if` imbriqués.

  Réécris-le dans `Livraison.frais(commande)`, qui reçoit une `Commande` (`Commande.java` et `TypeClient.java` sont
  donnés) et renvoie les frais **en centimes** (`long`), avec les mêmes règles :

  - un **particulier** paie 4,90 € si sa commande fait moins de 50 €, rien au-delà ;
  - un **professionnel** ne paie jamais de frais standard ;
  - un client **international** paie toujours 9,90 € ;
  - la livraison **express** ajoute 10 € dans tous les cas.

  Utilise des constantes nommées et un `switch` exhaustif sur le type de client.
explanation: |-
  Les codes `1` et `2` deviennent une enum `TypeClient`, que le `switch` traite de façon exhaustive : ajouter un type
  de client fera échouer la compilation tant qu'il n'est pas traité, là où l'ancien `else` le rangeait silencieusement
  parmi les internationaux. Les montants deviennent des constantes nommées en centimes (`long`), sans erreur d'arrondi.
  Le booléen `e` devient un composant `express` nommé de la commande. Le calcul se lit en deux étapes : les frais
  standard selon le type, puis le supplément express.
