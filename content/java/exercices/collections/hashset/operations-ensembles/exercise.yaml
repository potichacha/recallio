statement: |-
  Écris trois méthodes génériques de `Ensembles`, qui ne modifient jamais leurs arguments :

  - `communs(a, b)` : les éléments présents dans les deux ensembles ;
  - `differenceSymetrique(a, b)` : les éléments présents dans **un seul** des deux ensembles ;
  - `doublons(liste)` : les éléments qui apparaissent **plusieurs fois** dans la liste, dans l'ordre de leur première
    répétition.
explanation: |-
  Les opérations d'ensemble de `Set` (`retainAll`, `removeAll`, `addAll`) modifient l'ensemble appelant : on travaille
  donc sur une copie (`new HashSet<>(a)`). La différence symétrique est l'union moins l'intersection. Pour les doublons,
  `vus.add(x)` renvoie `false` quand `x` a déjà été vu : c'est un doublon, qu'on range dans un `LinkedHashSet` pour garder
  l'ordre de première répétition sans le répéter. Tout est en temps linéaire, grâce au `contains` en O(1) des
  `HashSet`.
