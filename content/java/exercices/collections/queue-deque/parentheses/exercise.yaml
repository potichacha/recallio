statement: |-
  Écris `Parentheses.equilibree(texte)`, qui dit si les délimiteurs `()`, `[]` et `{}` d'un texte sont **équilibrés** :
  chaque ouvrant est fermé par le fermant correspondant, dans le bon ordre. Les autres caractères sont ignorés.

  - `"(a[b]{c})"` est équilibré ;
  - `"(]"`, `"(()"` et `")("` ne le sont pas ;
  - un texte vide est équilibré.
explanation: |-
  Une pile (`Deque<Character>` sur une `ArrayDeque`) garde les ouvrants en attente. À chaque ouvrant, on empile le
  fermant attendu ; à chaque fermant, la pile doit être non vide et son sommet doit être ce fermant, qu'on dépile. À la
  fin, la pile doit être vide : sinon un ouvrant n'a jamais été fermé. Le tout est en O(n). `ArrayDeque` remplace la
  classe historique `Stack`.
