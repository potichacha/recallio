statement: |-
  Écris trois méthodes de `Mots`, qui travaillent sur une liste de mots déjà découpés :

  - `frequences(mots)` : le nombre d'occurrences de chaque mot, sans tenir compte de la casse (`"Java"` et `"java"`
    sont le même mot, compté en minuscules) ;
  - `parInitiale(mots)` : les mots regroupés par leur première lettre (en minuscule), dans l'ordre des initiales, chaque
    liste gardant l'ordre d'apparition ;
  - `plusFrequent(mots)` : le mot le plus fréquent (en minuscules), ou une chaîne vide pour une liste vide ; en cas
    d'égalité, celui qui vient en premier dans l'ordre alphabétique.
explanation: |-
  `merge(mot, 1, Integer::sum)` compte en une ligne : il range 1 à la première occurrence, puis additionne. Pour
  regrouper, `computeIfAbsent(initiale, k -> new ArrayList<>()).add(mot)` crée la liste seulement pour une nouvelle
  initiale ; une `TreeMap` donne l'ordre des initiales sans tri séparé. Le mot le plus fréquent se lit sur les entrées
  des fréquences, avec un comparateur sur la valeur puis la clé pour départager. La minuscule se calcule avec
  `Locale.ROOT`, pour ne pas dépendre de la langue de la machine.
