statement: |-
  Écris `Doublons.sansDoublons` : elle renvoie les mots de la liste sans doublon, **dans l'ordre de leur première
  apparition**. `["b", "a", "b", "c", "a"]` donne `["b", "a", "c"]`.

  La liste reçue ne doit pas être modifiée. Choisis la collection qui fait le travail pour toi.
explanation: |-
  Un `Set` élimine les doublons, mais un `HashSet` perd l'ordre et un `TreeSet` trie. Le `LinkedHashSet` garde l'ordre
  d'insertion : c'est exactement « l'ordre de la première apparition », en temps linéaire. Le copier dans une nouvelle
  liste laisse la liste d'origine intacte. La solution naïve, une boucle avec `contains` sur une `List`, est
  quadratique.
