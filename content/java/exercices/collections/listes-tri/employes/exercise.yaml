statement: |-
  Le record `Employe(String nom, String service, int salaire)` est fourni. Écris les méthodes de `Tris`, qui renvoient
  chacune une **nouvelle** liste sans modifier celle reçue :

  - `parServicePuisSalaireDecroissant` : par service (ordre alphabétique), puis, dans un même service, du salaire le plus
    haut au plus bas ;
  - `parNomSansCasse` : par nom, sans tenir compte des majuscules (`"ada"` et `"Ada"` côte à côte) ;
  - `mieuxPayes(employes, n)` : les `n` employés les mieux payés, du plus payé au moins payé.
explanation: |-
  Chaque méthode passe par `employes.stream().sorted(comparateur).toList()`, qui laisse la liste d'origine intacte. Le
  premier comparateur combine `Comparator.comparing(Employe::service)` et `thenComparing(Employe::salaire,
  Comparator.reverseOrder())` : seul le second critère est inversé. `String.CASE_INSENSITIVE_ORDER` compare les noms sans
  la casse. `mieuxPayes` trie par `comparingInt(Employe::salaire).reversed()` puis garde les premiers avec `limit(n)`.
  Écrire un seul comparateur par besoin évite les tris successifs, dont l'ordre est trompeur.
