statement: |-
  Une page « profil » agrège trois services, chacun lent (`Services.java` et `Profil.java` sont donnés) :

  - le **nom** du client, indispensable ;
  - ses **commandes**, facultatives : en cas d'échec, une liste vide ;
  - ses **points** de fidélité, facultatifs : en cas d'échec, 0.

  Écris `Agregateur.profil(id)`, qui renvoie un `CompletableFuture<Profil>` :

  - les **trois appels** sont lancés **en parallèle**, sur l'executor reçu par le constructeur ;
  - un échec du service de nom fait **échouer** le futur ;
  - un échec des deux autres est remplacé par sa valeur de repli.

  Les tests vérifient que les trois appels sont bien simultanés.
explanation: |-
  `supplyAsync(..., executor)` lance chaque appel tout de suite sur l'executor dédié, sans bloquer ; les trois tournent
  donc en même temps. `exceptionally` donne une valeur de repli aux deux services facultatifs, mais pas au nom :
  son erreur se propage et fait échouer le futur combiné. `thenCombine` (deux fois) ou `allOf` puis `join` sur chaque
  futur assemblent le `Profil` quand les trois résultats sont là. Appeler `join()` sur chaque appel avant de lancer le
  suivant les aurait rendus séquentiels.
