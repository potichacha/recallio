statement: |-
  Écris une classe `Stock` **thread-safe**, partagée par de nombreux threads :

  - `ajouter(produit, quantite)` : ajoute une quantité positive au stock du produit ;
  - `retirer(produit, quantite)` : retire la quantité si le stock le permet et renvoie `true`, sinon ne change rien et
    renvoie `false` ; le stock ne doit **jamais** devenir négatif, même si plusieurs threads retirent en même temps ;
  - `quantite(produit)` : le stock du produit (0 s'il est inconnu) ;
  - `total()` : la somme de tous les stocks, toujours cohérente avec les quantités par produit.

  Les tests lancent des milliers d'opérations concurrentes.
explanation: |-
  Le retrait est un « vérifier-puis-agir » : le test du stock et la soustraction doivent former une seule opération
  atomique. Et `total` est lié aux quantités par un invariant (total = somme des stocks) : deux structures thread-safe
  séparées (une `ConcurrentHashMap` et un `AtomicLong`) ne le garantiraient pas, car un lecteur pourrait voir l'une
  mise à jour et pas l'autre. Le plus simple est donc un seul verrou (ici des méthodes `synchronized`) qui protège
  toute la map et le total. Une `ConcurrentHashMap` avec `compute` suffirait pour les quantités seules, mais pas pour
  l'invariant du total.
