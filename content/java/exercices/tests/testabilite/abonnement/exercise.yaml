statement: |-
  La classe `Abonnement` doit dire si un abonnement est expiré et combien de jours il lui reste. Elle reçoit sa date de
  fin et une **horloge** (`java.time.Clock`) par son constructeur.

  Le code de départ lit la date du jour avec `LocalDate.now()` : il ignore l'horloge, et les tests, qui fixent la date,
  échouent. Corrige `Abonnement` pour qu'elle n'utilise **que** l'horloge reçue :

  - `estExpire()` : vrai si la date du jour (selon l'horloge) est **après** la date de fin ; le dernier jour,
    l'abonnement est encore valide ;
  - `joursRestants()` : le nombre de jours entre aujourd'hui et la date de fin, 0 si l'abonnement est expiré.
explanation: |-
  Lire l'heure avec `LocalDate.now()` rend le résultat dépendant du jour d'exécution : impossible à tester de façon
  déterministe. Avec `LocalDate.now(horloge)`, la date vient de l'horloge injectée : `Clock.systemDefaultZone()` en
  production, `Clock.fixed(...)` dans les tests, qui peuvent alors vérifier les bornes (le dernier jour, le lendemain).
  `ChronoUnit.DAYS.between(aujourdhui, fin)` donne l'écart en jours, borné à zéro avec `Math.max`. C'est la même idée que
  l'injection de toute autre dépendance : ce que le test doit contrôler entre par le constructeur.
