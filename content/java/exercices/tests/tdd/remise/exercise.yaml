statement: |-
  Les tests de `RemiseTest` sont écrits **avant** le code, comme en TDD : ils forment la spécification. Fais-les passer
  **un par un**, dans l'ordre, en écrivant à chaque fois le code le plus simple, puis en nettoyant.

  Les règles de `Remise.calculer(montant, clientFidele)` (montants en centimes) :

  1. aucune remise en dessous de 100 € (10 000 centimes) ;
  2. 5 % à partir de 100 € ;
  3. 10 % à partir de 500 € ;
  4. un client fidèle a 5 points de plus (donc 5 % même en dessous de 100 €) ;
  5. la remise ne dépasse jamais 100 € ;
  6. un montant négatif est refusé (`IllegalArgumentException`).

  La remise est arrondie au centime inférieur.
explanation: |-
  En TDD, chaque test ajoute une règle : d'abord renvoyer 0, puis un seuil, puis un second seuil, puis le bonus de
  fidélité, le plafond et la validation. Le refactoring final rend les seuils lisibles (des constantes nommées) et sépare
  le calcul du taux de son application. Travailler en centimes entiers évite les erreurs d'arrondi des flottants ; la
  division entière arrondit au centime inférieur. Les tests des bornes (99,99 €, 100 €, 499,50 €, 500 €) sont ceux qui
  attrapent les erreurs de `>` contre `>=`.
