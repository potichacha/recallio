statement: |-
  `Expr.java` modélise des expressions arithmétiques avec une interface scellée et des records : un `Nombre`, une
  `Somme`, un `Produit` et une `Negation`. Il est donné : tu n'as pas à le modifier.

  Écris deux méthodes de `Calcul`, chacune avec un `switch` exhaustif **sans `default`** :

  - `evaluer(expr)` : la valeur entière de l'expression ;
  - `afficher(expr)` : l'expression sous forme de texte, chaque somme et chaque produit entre parenthèses, une négation
    préfixée par `-` (par exemple `(1 + (2 * -3))`).
explanation: |-
  Une interface scellée de records est un type somme : le compilateur connaît tous les cas, et un `switch` qui les
  traite tous n'a pas besoin de `default`. Les motifs de record (`case Somme(Expr g, Expr d)`) déconstruisent chaque cas
  et donnent directement ses composants ; la récursion fait le reste. Si l'on ajoute un cas à `Expr`, les deux `switch`
  cessent de compiler tant qu'il n'est pas traité : c'est la garantie qu'apporte l'absence de `default`.
