statement: |-
  Écris `Formateur.formater(valeur)`, qui transforme n'importe quelle valeur en texte pour un export, avec **un seul
  `switch` à motifs** :

  - `null` → `"-"` ;
  - un `Integer` négatif → le nombre entre parenthèses (`-12` → `"(12)"`), un autre `Integer` → le nombre ;
  - une `String` vide ou blanche → `"-"`, une autre `String` → la chaîne sans espaces autour ;
  - un `Boolean` → `"oui"` ou `"non"` ;
  - une `List` → ses éléments formatés (récursivement), séparés par `", "` et entre crochets ;
  - toute autre valeur → son `toString()`.
explanation: |-
  Les cas d'un `switch` à motifs sont évalués dans l'ordre : les cas gardés (`case Integer i when i < 0`) précèdent le cas
  général du même type, sinon ils seraient dominés et le code ne compilerait pas. `case null` traite l'absence de valeur,
  qu'un `default` ne couvrirait pas (le `switch` lèverait une `NullPointerException`). Pour la liste, on rappelle
  `formater` sur chaque élément, avec `Collectors.joining(", ", "[", "]")`. Un `default` reste nécessaire, car `Object`
  n'est pas un type scellé.
