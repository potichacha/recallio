statement: |-
  L'interface `Forme` déclare `double aire()`. Écris l'aire de chaque forme :

  - `Cercle(rayon)` : π × rayon² (utilise `Math.PI`) ;
  - `Rectangle(largeur, hauteur)` : largeur × hauteur ;
  - `Triangle(base, hauteur)` : base × hauteur / 2.

  Puis écris `Formes.aireTotale(List<Forme> formes)`, qui additionne leurs aires **sans tester leur type** : ni
  `instanceof`, ni `getClass()`.
explanation: |-
  Chaque forme connaît sa propre formule : c'est elle qui implémente `aire()`. `aireTotale` ne dépend que du type
  `Forme` et appelle `f.aire()` ; la liaison dynamique choisit la bonne version pour chaque objet. Ajouter un
  `Hexagone` ne demandera qu'une nouvelle classe, sans toucher à `aireTotale` : c'est le principe ouvert/fermé. Un
  stream (`formes.stream().mapToDouble(Forme::aire).sum()`) fait la même chose en une ligne.
