statement: |-
  Deux types sont fournis :

  - `Document`, une **classe abstraite** qui porte l'état commun des documents : un titre, validé par son
    constructeur, et le nombre de pages ;
  - `Exportable`, une **interface** qui décrit une capacité : `exporter()`, et `nomFichier()` avec une valeur par
    défaut.

  Écris :

  - `Facture(String numero, double montant)`, un document intitulé `"Facture <numero>"` d'**une** page, exportable :
    `exporter()` renvoie `"<numero>;<montant>"` et `nomFichier()` renvoie `"facture-<numero>.csv"` ;
  - `Photo(String nom)`, qui **n'est pas un document** mais est exportable : `exporter()` renvoie `"photo:<nom>"`, et
    elle garde le `nomFichier()` par défaut.
explanation: |-
  `Facture` étend `Document` parce qu'elle partage son **état** (le titre, initialisé par `super(...)`) et implémente
  `Exportable` parce qu'elle a la **capacité** d'être exportée. `Photo` n'a rien d'un document : avec une classe
  abstraite `Exportable`, elle aurait dû hériter d'un titre et de pages qui n'ont pas de sens pour elle. L'interface
  permet à des classes sans lien de partager un contrat, et la méthode `default` leur donne un comportement commun
  qu'elles peuvent redéfinir, comme `Facture` le fait pour `nomFichier()`.
