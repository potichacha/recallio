statement: |-
  `EnsembleCompte` est un ensemble de chaînes qui compte les **tentatives d'ajout** (doublons compris). Il étend
  `HashSet` et compte dans `add` et dans `addAll`, mais `ajouterTous(List.of("a", "b", "c"))` donne 6 ajouts au lieu de
  3.

  Réécris-le **par composition** : un `Set<String>` privé, auquel la classe délègue. Garde la même API :

  - `ajouter(String e)` renvoie `true` si l'élément était absent ;
  - `ajouterTous(Collection<String> elements)` ;
  - `contient(String e)`, `taille()` et `nombreAjouts()`.
explanation: |-
  `HashSet.addAll` appelle `add` pour chaque élément : la sous-classe, qui compte dans les deux, comptait deux fois.
  C'est le problème de la **classe de base fragile** : elle dépendait d'un détail interne de `HashSet`. Par composition,
  `EnsembleCompte` ne dépend que de l'API publique de son `Set` : `ajouterTous` compte la taille de la collection reçue
  puis délègue, et rien ne peut compter en double. En prime, la classe n'expose plus les vingt méthodes de `HashSet`,
  seulement celles qu'elle choisit.
