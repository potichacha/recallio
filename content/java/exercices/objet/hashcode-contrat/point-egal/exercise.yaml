statement: |-
  La classe `Point` ne redéfinit ni `equals` ni `hashCode` : deux points de mêmes coordonnées sont donc différents, et
  un `HashSet<Point>` garde des doublons.

  Redéfinis `equals` et `hashCode` pour que deux points de mêmes coordonnées soient égaux et puissent servir de clé dans
  une `HashMap` ou un `HashSet`. Garde une classe : ne la transforme pas en record.
explanation: |-
  `equals` vérifie d'abord l'identité, puis le type avec `instanceof` (qui écarte aussi `null`), puis compare les champs.
  `hashCode` combine les **mêmes** champs : deux objets égaux doivent avoir le même code, sinon un `HashSet` les range
  dans deux cases différentes et ne voit jamais le doublon. `Objects.hash` le fait en une ligne. Un record donnerait les
  deux méthodes automatiquement, mais savoir les écrire reste indispensable.
