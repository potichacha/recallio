statement: |-
  `Equipe` doit être **immuable** : une fois créée, ni son nom ni ses membres ne changent. Aujourd'hui, le record garde
  la liste de l'appelant, et `avec` modifie l'équipe existante.

  Corrige-la :

  - modifier la liste passée au constructeur, **après** la création, ne doit pas changer l'équipe ;
  - `membres()` ne doit pas permettre de modifier l'équipe (un `add` lève `UnsupportedOperationException`) ;
  - `avec(String membre)` renvoie une **nouvelle** équipe avec le membre en plus, et laisse l'originale intacte ;
  - un nom vide ou `null` est refusé (`IllegalArgumentException`).
explanation: |-
  Le constructeur compact remplace la liste reçue par `List.copyOf(membres)` : une copie immuable, indépendante de la
  liste de l'appelant. Comme elle est immuable, l'accesseur généré peut la renvoyer telle quelle sans risque. `avec`
  ne touche pas à l'état : il construit une nouvelle liste, y ajoute le membre, et crée une nouvelle équipe (dont le
  constructeur recopie à nouveau, ce qui garde la règle à un seul endroit). L'objet est ainsi partageable entre
  threads et utilisable comme clé, sans aucune synchronisation.
