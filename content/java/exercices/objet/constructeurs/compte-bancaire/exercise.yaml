statement: |-
  Écris les constructeurs de `CompteBancaire` :

  - `CompteBancaire(String titulaire, double soldeInitial)` refuse un titulaire `null` ou vide et un solde initial
    négatif, avec une `IllegalArgumentException` ;
  - `CompteBancaire(String titulaire)` ouvre un compte à 0, **sans dupliquer** la validation.

  Écris aussi `deposer(double montant)`, qui refuse un montant négatif ou nul (`IllegalArgumentException`) et
  augmente le solde. Les accesseurs `titulaire()` et `solde()` sont déjà là.
explanation: |-
  Le constructeur principal valide tout avant d'affecter les champs : un compte invalide n'existe jamais, même un
  instant. Le constructeur secondaire délègue avec `this(titulaire, 0)`, si bien que la règle n'est écrite qu'une fois.
  `titulaire.isBlank()` refuse aussi une chaîne d'espaces. Le champ `titulaire` est `final` : il est affecté une seule
  fois, dans le constructeur, et ne change plus.
