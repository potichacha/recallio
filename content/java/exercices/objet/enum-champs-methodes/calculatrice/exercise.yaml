statement: |-
  L'enum `Operation` déclare les quatre opérations, chacune avec son symbole (`+`, `-`, `*`, `/`). Complète-la :

  - `appliquer(int a, int b)` calcule le résultat de l'opération ;
  - `deSymbole(String symbole)` retrouve l'opération à partir de son symbole, et lève une
    `IllegalArgumentException` pour un symbole inconnu.

  Une division par zéro peut lever l'`ArithmeticException` habituelle.
explanation: |-
  Chaque constante fournit sa propre version de `appliquer` : soit par une méthode abstraite implémentée dans le
  corps de chaque constante, soit par un `switch` exhaustif sur `this`, qui ne compilerait plus si l'on ajoutait une
  constante sans la traiter. `deSymbole` parcourt `values()` et compare le symbole de chaque constante ; pour une
  grande enum, on préférerait une `Map` remplie dans un bloc `static`. Le symbole inconnu est une erreur de l'appelant :
  `IllegalArgumentException`, comme `valueOf`.
