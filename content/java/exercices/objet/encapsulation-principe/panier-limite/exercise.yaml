statement: |-
  Le `Panier` doit garantir deux règles : il contient **au plus 10 articles**, et un article vide ou `null` est refusé.
  Aujourd'hui, `articles()` rend la liste interne, et n'importe quel appelant peut la remplir sans passer par
  `ajouter`.

  Encapsule le panier :

  - `ajouter(String article)` refuse un article `null` ou vide (`IllegalArgumentException`) et un onzième article
    (`IllegalStateException`) ;
  - `retirer(String article)` retire une occurrence et renvoie `true` si l'article était présent ;
  - `articles()` renvoie les articles **sans permettre de les modifier** ;
  - `taille()` renvoie le nombre d'articles.
explanation: |-
  La liste interne est `private final` : personne d'autre ne la référence. `ajouter` est le seul chemin d'entrée, il
  vérifie les deux règles avant de modifier l'état. `articles()` renvoie `Collections.unmodifiableList(articles)`, une
  vue en lecture seule : un `add` sur cette vue lève `UnsupportedOperationException`. (`List.copyOf` conviendrait
  aussi, avec une copie à chaque appel.) La limite est une constante nommée, pas un 10 perdu dans le code.
