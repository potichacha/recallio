statement: |-
  Un journal applicatif contient une ligne par événement, au format `NIVEAU message` (par exemple
  `ERROR connexion refusée`). Les lignes vides sont ignorées. Écris deux méthodes de `Journal` :

  - `compterParNiveau(source)` : le nombre de lignes par niveau (`INFO`, `WARN`, `ERROR`...), trié par niveau ;
  - `copierErreurs(source, cible)` : écrit dans `cible` les seules lignes `ERROR`, une par ligne, et renvoie leur nombre.

  Les deux méthodes reçoivent un `Reader` (et un `Writer`) déjà ouverts : elles ne doivent pas charger tout le journal
  en mémoire, et ne ferment pas les flux reçus.
explanation: |-
  Un `BufferedReader` autour du `Reader` permet de lire ligne par ligne avec `readLine()` (ou `lines()`), sans charger
  tout le journal. Le niveau est le texte avant le premier espace. Pour l'écriture, un `BufferedWriter` regroupe les
  écritures ; il faut le vider avec `flush()` avant de rendre la main, sinon les dernières lignes restent dans le
  tampon. On ne ferme pas les flux reçus : c'est à celui qui les a ouverts de le faire (fermer le `BufferedWriter`
  fermerait aussi la cible).
