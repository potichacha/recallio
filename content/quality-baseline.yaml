# Plafonds de la qualité de rédaction des cartes (content/README.md, section « Règles vérifiées par la CI »).
#
# Pour chaque sujet et chaque règle, le nombre d'infractions tolérées : celles du contenu écrit avant les règles.
# C'est un cliquet. La CI échoue si un sujet dépasse un plafond, et aussi s'il passe en dessous : il faut alors
# abaisser le plafond ici, pour que le progrès soit acquis. Un plafond ne se relève jamais.
#
# Un sujet ou une règle qui n'est pas dans ce fichier ne tolère aucune infraction : un nouveau sujet naît propre.
java:
  longest-correct-choice: 210
  formal-address: 571
  duplicate-question: 24
  multiple-answers: 174
go:
  longest-correct-choice: 65
  formal-address: 497
  duplicate-question: 21
  multiple-answers: 434
