notion: csv
lesson: |-
  Le module `csv` lit et écrit des fichiers CSV, en gérant ce que `split(",")` ignore : les champs entre guillemets
  qui contiennent une virgule ou un retour à la ligne, les guillemets doublés, les fins de ligne.

  ```python
  import csv

  with open("notes.csv", newline="", encoding="utf-8") as f:
      for ligne in csv.reader(f):              # chaque ligne : une liste de chaînes
          print(ligne)

  with open("notes.csv", newline="", encoding="utf-8") as f:
      for ligne in csv.DictReader(f):          # chaque ligne : un dict, clés tirées de l'en-tête
          print(ligne["nom"], int(ligne["note"]))

  with open("export.csv", "w", newline="", encoding="utf-8") as f:
      w = csv.DictWriter(f, fieldnames=["nom", "note"])
      w.writeheader()                          # à appeler soi-même
      w.writerow({"nom": "Ada", "note": 18})
      w.writerows([{"nom": "Alan", "note": 17}])
  ```

  **À retenir**

  - On ouvre avec **`newline=""`** : le module gère lui-même les fins de ligne. Sans cela, un champ qui contient un
    retour à la ligne est mal lu, et, sous Windows, chaque ligne écrite est suivie d'une ligne vide.
  - Les valeurs lues sont des **chaînes** : `int(ligne["note"])` pour calculer.
  - Le séparateur se règle : `csv.reader(f, delimiter=";")` pour un CSV produit par un Excel français.
  - `csv.writer` met entre guillemets un champ qui contient le séparateur, un guillemet ou un retour à la ligne :
    `["a,b", "c"]` s'écrit `"a,b",c`.
  - `quoting=csv.QUOTE_ALL` met tout entre guillemets ; `csv.Sniffer` devine le format d'un fichier inconnu.
  - Le module lit ligne par ligne : un gros fichier ne charge pas la mémoire.
  - `io.StringIO` sert de faux fichier en mémoire, pratique dans les tests.

  Pour des analyses plus lourdes (grouper, joindre, calculer), on passe à pandas ou Polars ; pour lire et écrire, la
  bibliothèque standard suffit.

  **En entretien** : « Je n'utilise jamais `split(",")` : un champ entre guillemets peut contenir une virgule.
  `csv.reader` ou `DictReader` pour lire, `DictWriter` avec `writeheader` pour écrire, toujours avec `newline=""` et
  un encodage. Les valeurs lues sont des chaînes, à convertir. »
cards:
  - key: newline-vide
    format: course
    question: "Pourquoi ouvrir un fichier CSV avec `newline=\"\"` ?"
    choices:
      - {text: "Pour laisser le module `csv` gérer lui-même les fins de ligne", correct: true}
      - {text: "Pour supprimer les lignes vides présentes dans le fichier", correct: false}
      - {text: "Pour lire tout le fichier comme une seule et longue ligne", correct: false}
      - {text: "Pour que les valeurs lues soient converties en nombres", correct: false}
    answer: "Sinon, un champ qui contient un retour à la ligne est mal découpé, et sous Windows chaque ligne écrite est suivie d'une ligne vide. La documentation du module le demande."
  - key: pourquoi-pas-split
    format: course
    question: "Pourquoi ne pas découper une ligne CSV avec `ligne.split(\",\")` ?"
    choices:
      - {text: "Un champ entre guillemets peut contenir une virgule", correct: true}
      - {text: "`split` est beaucoup trop lent sur un gros fichier", correct: false}
      - {text: "`split` ne sait pas découper sur une virgule", correct: false}
      - {text: "`split` supprime les champs vides de la ligne", correct: false}
    answer: "`'\"Dupont, Jean\",Lyon'.split(\",\")` donne trois morceaux au lieu de deux. Le module `csv` gère aussi les guillemets doublés et les retours à la ligne dans un champ."
  - key: ligne-dictreader
    format: course
    question: "Que renvoie chaque ligne d'un `csv.DictReader` ?"
    choices:
      - {text: "Un dictionnaire, dont les clés viennent de la ligne d'en-tête", correct: true}
      - {text: "Un tuple nommé, dont les attributs sont les colonnes", correct: false}
      - {text: "Une liste de chaînes, la ligne d'en-tête exclue", correct: false}
      - {text: "Un dictionnaire dont les clés sont les numéros de colonne", correct: false}
    answer: "La première ligne donne les noms de colonnes (ou le paramètre `fieldnames`). On lit ensuite `ligne[\"nom\"]`, quel que soit l'ordre des colonnes."
  - key: type-des-valeurs
    format: course
    question: "Par défaut, quel type ont les valeurs lues par `csv.reader` ?"
    choices:
      - {text: "Des chaînes, à convertir soi-même", correct: true}
      - {text: "Des nombres quand c'est possible", correct: false}
      - {text: "Des octets, à décoder en UTF-8", correct: false}
      - {text: "Le type annoncé par l'en-tête", correct: false}
    answer: "CSV ne connaît pas les types : `\"36\"` reste une chaîne. On convertit avec `int`, `float` ou `date.fromisoformat`."
  - key: vf-delimiter
    format: true-false
    question: "`csv.reader(f, delimiter=\";\")` lit un fichier dont les champs sont séparés par des points-virgules."
    truth: true
    answer: "Le séparateur, le caractère de citation et d'autres réglages forment un « dialecte ». Celui par défaut, `excel`, utilise la virgule."
  - key: vf-writeheader-auto
    format: true-false
    question: "`DictWriter` écrit la ligne d'en-tête dès sa création."
    truth: false
    answer: "Il faut appeler `writeheader()`. On peut ainsi ajouter des lignes à un fichier existant sans répéter l'en-tête."
  - key: vf-guillemets-auto
    format: true-false
    question: "`csv.writer` met entre guillemets un champ qui contient le séparateur."
    truth: true
    answer: "`[\"a,b\", \"c\"]` s'écrit `\"a,b\",c` : le fichier reste lisible par n'importe quel lecteur CSV."
  - key: vf-pandas-obligatoire
    format: true-false
    question: Lire un fichier CSV en Python demande d'installer pandas.
    truth: false
    answer: "Le module `csv` est dans la bibliothèque standard. pandas sert quand on veut ensuite filtrer, grouper ou calculer sur les données."
  - key: qcm-writerow
    format: multiple-choice
    question: "Quelle méthode d'un `csv.writer` écrit une ligne ?"
    choices:
      - {text: "`writerow`", correct: true}
      - {text: "`write`", correct: false}
      - {text: "`writeline`", correct: false}
      - {text: "`append`", correct: false}
    answer: "`writerow(liste)` écrit une ligne, `writerows(liste_de_listes)` plusieurs. Avec `DictWriter`, on leur passe des dictionnaires."
  - key: qcm-point-virgule
    format: multiple-choice
    question: "Un Excel français produit des CSV séparés par des points-virgules. Comment les lis-tu ?"
    choices:
      - {text: "`csv.reader(f, delimiter=\";\")`", correct: true}
      - {text: "`csv.reader(f, sep=\";\")`", correct: false}
      - {text: "`csv.reader(f, dialect=\"fr\")`", correct: false}
      - {text: "`csv.reader(f.replace(\";\", \",\"))`", correct: false}
    answer: "Le paramètre s'appelle `delimiter`. `sep` est celui de pandas ; il n'existe pas de dialecte `\"fr\"`."
  - key: qcm-fieldnames
    format: multiple-choice
    question: "Quel argument `DictWriter` exige-t-il, en plus du fichier ?"
    choices:
      - {text: "`fieldnames`, la liste des colonnes", correct: true}
      - {text: "`header`, la ligne d'en-tête", correct: false}
      - {text: "`keys`, les clés autorisées", correct: false}
      - {text: "`columns`, les colonnes et leurs types", correct: false}
    answer: "`fieldnames` fixe l'ordre des colonnes. Une clé absente de la liste lève une `ValueError`, sauf avec `extrasaction=\"ignore\"`."
  - key: qcm-gros-fichier
    format: multiple-choice
    question: "Comment `csv.reader` parcourt-il un fichier ?"
    choices:
      - {text: "Ligne par ligne, sans tout charger en mémoire", correct: true}
      - {text: "Il lit d'abord tout le fichier en mémoire", correct: false}
      - {text: "Il le charge colonne par colonne", correct: false}
      - {text: "Il le copie dans un fichier temporaire", correct: false}
    answer: "Le lecteur est un itérateur : on peut traiter un fichier de plusieurs gigaoctets avec une mémoire constante."
  - key: trous-newline
    format: fill-in
    question: |-
      Complète pour ouvrir correctement le fichier CSV :
      ```python
      with open("ventes.csv", newline=___, encoding="utf-8") as f:
          lignes = list(csv.reader(f))
      ```
    blanks: [['""', "''"]]
    answer: "`newline=\"\"` : le module `csv` gère lui-même les fins de ligne."
  - key: trous-dictreader
    format: fill-in
    question: |-
      Complète pour lire chaque ligne sous forme de dictionnaire :
      ```python
      for ligne in csv.___(f):
          print(ligne["nom"])
      ```
    blanks: [[DictReader]]
    answer: "`DictReader` prend les noms de colonnes dans la première ligne."
  - key: trous-writeheader
    format: fill-in
    question: |-
      Complète pour écrire la ligne d'en-tête :
      ```python
      w = csv.DictWriter(f, fieldnames=["nom", "note"])
      w.___()
      ```
    blanks: [[writeheader]]
    answer: "`writeheader()` écrit les noms des colonnes, dans l'ordre de `fieldnames`."
  - key: trous-delimiter
    format: fill-in
    question: |-
      Complète pour lire un CSV séparé par des points-virgules :
      ```python
      lecteur = csv.reader(f, ___=";")
      ```
    blanks: [[delimiter]]
    answer: "`delimiter` : le caractère qui sépare les champs."
  - key: code-split-ou-reader
    format: code-output
    question: |-
      ```python
      import csv

      ligne = '"Dupont, Jean",Lyon'
      print(len(ligne.split(",")), len(next(csv.reader([ligne]))))
      ```
    answer: "`3 2` : `split` coupe aussi la virgule entre guillemets ; `csv.reader` voit deux champs, `Dupont, Jean` et `Lyon`."
    check:
      output: "3 2"
    choices:
      - {text: "`3 2`", correct: true}
      - {text: "`2 2`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "`2 3`", correct: false}
  - key: code-valeurs-chaines
    format: code-output
    question: |-
      ```python
      import csv
      import io

      texte = "nom;age\nAda;36\n"
      for ligne in csv.DictReader(io.StringIO(texte), delimiter=";"):
          print(ligne["age"] + "1")
      ```
    answer: "`361` : la valeur lue est la chaîne `\"36\"`, et `+` concatène."
    check:
      output: "361"
    choices:
      - {text: "`361`", correct: true}
      - {text: "`37`", correct: false}
      - {text: "Une `TypeError` : on n'ajoute pas un entier et une chaîne", correct: false}
      - {text: "`36`", correct: false}
  - key: code-writer-guillemets
    format: code-output
    question: |-
      ```python
      import csv
      import io

      sortie = io.StringIO()
      csv.writer(sortie).writerow(["a,b", "c", 3])
      print(sortie.getvalue().strip())
      ```
    answer: "`\"a,b\",c,3` : le champ qui contient une virgule est mis entre guillemets, le nombre est écrit avec `str`."
    check:
      output: '"a,b",c,3'
    choices:
      - {text: '`"a,b",c,3`', correct: true}
      - {text: "`a,b,c,3`", correct: false}
      - {text: '`"a,b","c","3"`', correct: false}
      - {text: "`a\\,b,c,3`", correct: false}
  - key: code-dictwriter-entete
    format: code-output
    question: |-
      ```python
      import csv
      import io

      sortie = io.StringIO()
      w = csv.DictWriter(sortie, fieldnames=["nom", "note"])
      w.writeheader()
      w.writerow({"nom": "Ada", "note": 18})
      print(sortie.getvalue().splitlines())
      ```
    answer: "`['nom,note', 'Ada,18']` : l'en-tête, puis la ligne, dans l'ordre de `fieldnames`."
    check:
      output: "['nom,note', 'Ada,18']"
    choices:
      - {text: "`['nom,note', 'Ada,18']`", correct: true}
      - {text: "`['Ada,18']`", correct: false}
      - {text: "`['nom,note', 'Ada,18', '']`", correct: false}
      - {text: "`['nom;note', 'Ada;18']`", correct: false}
