  - key: bug-lignes-collees
    format: bug-fix
    question: |-
      Ce script affiche `AdaAlanGrace`, au lieu d'un nom par ligne :
      ```python
      import os
      import tempfile

      chemin = os.path.join(tempfile.mkdtemp(), "noms.txt")
      with open(chemin, "w", encoding="utf-8") as f:
          for nom in ["Ada", "Alan", "Grace"]:
              f.write(nom)
      with open(chemin, encoding="utf-8") as f:
          print(f.read())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`f.write(nom + \"\\n\")`", correct: true}
      - {text: "`f.write(nom, end=\"\\n\")`", correct: false}
      - {text: "`f.writelines(nom)`", correct: false}
      - {text: "`open(chemin, \"a\", encoding=\"utf-8\")`", correct: false}
    answer: |-
      ```python
      for nom in ["Ada", "Alan", "Grace"]:
          f.write(nom + "\n")
      ```
      `write` n'ajoute rien. `end=` appartient à `print` (`print(nom, file=f)` marcherait), et `writelines`
      n'ajoute pas de retour à la ligne non plus.
  - key: bug-journal-ecrase
    format: bug-fix
    question: |-
      Ce journal ne garde que le dernier événement, `['arrêt']` :
      ```python
      import os
      import tempfile

      chemin = os.path.join(tempfile.mkdtemp(), "journal.txt")
      for evenement in ["démarrage", "arrêt"]:
          with open(chemin, "w", encoding="utf-8") as f:
              f.write(evenement + "\n")
      with open(chemin, encoding="utf-8") as f:
          print(f.read().split())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ouvrir en mode `\"a\"` dans la boucle", correct: true}
      - {text: "Ouvrir en mode `\"r+\"` dans la boucle", correct: false}
      - {text: "Appeler `f.flush()` après chaque écriture", correct: false}
      - {text: "Ouvrir en mode `\"x\"` dans la boucle", correct: false}
    answer: |-
      ```python
      with open(chemin, "a", encoding="utf-8") as f:
          f.write(evenement + "\n")
      ```
      `"w"` vide le fichier à chaque ouverture. `"r+"` échouerait sur un fichier absent et écrirait au début ; `"x"`
      échouerait à la seconde ouverture.
  - key: bug-comparaison-ligne
    format: bug-fix
    question: |-
      Ce script affiche `False`, alors que `Alan` est bien dans le fichier :
      ```python
      import os
      import tempfile

      chemin = os.path.join(tempfile.mkdtemp(), "noms.txt")
      with open(chemin, "w", encoding="utf-8") as f:
          f.write("Ada\nAlan\n")
      with open(chemin, encoding="utf-8") as f:
          trouve = any(ligne == "Alan" for ligne in f)
      print(trouve)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`any(ligne.rstrip(\"\\n\") == \"Alan\" for ligne in f)`", correct: true}
      - {text: "`any(ligne is \"Alan\" for ligne in f)`", correct: false}
      - {text: "`any(ligne == \"Alan\" for ligne in f.read())`", correct: false}
      - {text: "`any(ligne == \"Alan\" for ligne in f.readlines())`", correct: false}
    answer: |-
      ```python
      trouve = any(ligne.rstrip("\n") == "Alan" for ligne in f)
      ```
      Chaque ligne vaut `"Alan\n"`, avec son retour à la ligne. `f.read()` itérerait sur les caractères, et
      `readlines()` garde aussi les `"\n"`.
  - key: bug-lire-apres-ecrire
    format: bug-fix
    question: |-
      Ce script affiche `''` au lieu de `'bonjour'` :
      ```python
      import os
      import tempfile

      chemin = os.path.join(tempfile.mkdtemp(), "x.txt")
      with open(chemin, "w+", encoding="utf-8") as f:
          f.write("bonjour")
          print(repr(f.read()))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `f.seek(0)` avant `f.read()`", correct: true}
      - {text: "Appeler `f.flush()` avant `f.read()`", correct: false}
      - {text: "Lire avec `f.read(7)` au lieu de `f.read()`", correct: false}
      - {text: "Lire avec `f.readline()` au lieu de `f.read()`", correct: false}
    answer: |-
      ```python
      with open(chemin, "w+", encoding="utf-8") as f:
          f.write("bonjour")
          f.seek(0)
          print(repr(f.read()))
      ```
      Après l'écriture, le curseur est à la fin du fichier : la lecture part de là. `seek(0)` le ramène au début ;
      `flush` écrit les données, sans déplacer le curseur.
  - key: sc-encodage-windows
    format: scenario
    question: "Un script qui lit un CSV en UTF-8 marche sous Linux, mais affiche `Ã©` à la place de `é` chez un collègue sous Windows. Que corriges-tu ?"
    choices:
      - {text: "Passer `encoding=\"utf-8\"` à `open`, sans compter sur l'encodage par défaut", correct: true}
      - {text: "Remplacer les lettres accentuées du fichier par des lettres simples", correct: false}
      - {text: "Ouvrir le fichier en mode binaire et afficher les octets bruts", correct: false}
      - {text: "Demander au collègue de passer son système en anglais", correct: false}
    answer: "Sous Windows, l'encodage par défaut est souvent cp1252 : les deux octets UTF-8 de `é` y deviennent deux caractères, `Ã©`. Préciser l'encodage rend le script identique partout."
  - key: sc-gros-journal
    format: scenario
    question: Tu dois compter les lignes d'erreur d'un journal de 20 Go. Comment le lis-tu ?
    choices:
      - {text: "Ligne par ligne, en itérant sur le fichier ouvert", correct: true}
      - {text: "Avec `f.read()`, puis un `split` sur les retours à la ligne", correct: false}
      - {text: "Avec `f.readlines()`, pour obtenir la liste des lignes", correct: false}
      - {text: "En le copiant d'abord en mémoire avec `shutil.copy`", correct: false}
    answer: "`for ligne in f` ne garde qu'une ligne à la fois en mémoire. `read()` et `readlines()` chargeraient les 20 Go d'un coup."
  - key: sc-fichiers-jamais-fermes
    format: scenario
    question: "Un collègue ouvre des fichiers avec `f = open(...)`, sans jamais les fermer. Que lui conseilles-tu ?"
    choices:
      - {text: "Un bloc `with`, qui ferme le fichier même en cas d'exception", correct: true}
      - {text: "Écrire `del f` à la fin de chaque fonction qui ouvre un fichier", correct: false}
      - {text: "Rien : Python ferme tout lui-même à la fin du programme", correct: false}
      - {text: "Appeler `f.flush()` après chaque écriture, pour être sûr", correct: false}
    answer: "Un fichier ouvert garde un descripteur du système, et ses écritures peuvent rester en mémoire. Dans un serveur qui tourne longtemps, les descripteurs finissent par manquer. `with` règle tout."
  - key: sc-ecriture-atomique
    format: scenario
    question: "Ton programme réécrit un fichier de configuration ; s'il plante au milieu, le fichier reste à moitié écrit. Que proposes-tu ?"
    choices:
      - {text: "Écrire dans un fichier temporaire, puis le renommer avec `os.replace`", correct: true}
      - {text: "Écrire plus vite, en un seul appel à `write`", correct: false}
      - {text: "Ouvrir le fichier en mode `\"a\"` au lieu de `\"w\"`", correct: false}
      - {text: "Appeler `flush()` après chaque ligne écrite", correct: false}
    answer: "Le renommage est atomique : on voit l'ancien fichier, ou le nouveau, jamais un mélange. Le fichier temporaire se crée dans le même dossier, pour rester sur le même disque."
