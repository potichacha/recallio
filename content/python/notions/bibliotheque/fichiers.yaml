notion: fichiers
lesson: |-
  `open` ouvre un fichier et renvoie un objet fichier. On l'utilise **toujours avec `with`**, qui le ferme à la sortie
  du bloc, même en cas d'exception.

  ```python
  with open("notes.txt", "w", encoding="utf-8") as f:
      f.write("première ligne\n")          # write n'ajoute pas de retour à la ligne
      print("deuxième ligne", file=f)      # print, si

  with open("notes.txt", encoding="utf-8") as f:   # mode "r" par défaut
      for ligne in f:                      # ligne par ligne, avec le "\n" final
          print(ligne.rstrip("\n"))
  ```

  | Mode | Effet | Si le fichier existe | S'il n'existe pas |
  |---|---|---|---|
  | `"r"` | lecture (par défaut) | lu depuis le début | `FileNotFoundError` |
  | `"w"` | écriture | **vidé** | créé |
  | `"a"` | ajout en fin | conservé, on écrit à la fin | créé |
  | `"x"` | création exclusive | `FileExistsError` | créé |
  | `"r+"` | lecture et écriture | conservé | `FileNotFoundError` |
  | `"b"` ajouté (`"rb"`, `"wb"`) | mode binaire : des `bytes`, pas de `str` | | |

  **Lire**

  - `f.read()` : tout le contenu, en une chaîne ;
  - `f.readline()` : la ligne suivante ; `f.readlines()` : la liste des lignes ;
  - `for ligne in f` : ligne par ligne, **sans tout charger en mémoire**, la bonne façon pour un gros fichier.

  Chaque ligne garde son `"\n"` final : `ligne.rstrip("\n")` ou `ligne.strip()` l'enlève.

  **Écrire** : `f.write(texte)` renvoie le nombre de **caractères** écrits, et n'ajoute rien. Les données ne sont
  garanties sur le disque qu'à la fermeture (ou après `f.flush()`).

  **L'encodage** : en mode texte, sans `encoding=`, Python 3.14 prend celui du système, par exemple cp1252 sous
  Windows. Un fichier UTF-8 y devient `Ã©` au lieu de `é`. On passe donc **toujours** `encoding="utf-8"`.

  **Le curseur** : lecture et écriture avancent une position. Après une écriture en mode `"w+"`, `f.read()` renvoie
  `""` : il faut revenir au début avec `f.seek(0)`.

  Pour réécrire un fichier sans risque de le laisser à moitié écrit, on écrit dans un fichier temporaire, puis on le
  renomme avec `os.replace`, qui est atomique.

  **En entretien** : « J'ouvre avec `with open(chemin, mode, encoding="utf-8")`, qui ferme le fichier même en cas
  d'erreur. `"w"` écrase, `"a"` ajoute, `"x"` refuse d'écraser. Je lis ligne par ligne en itérant sur le fichier, et
  je précise toujours l'encodage, car celui par défaut dépend du système. »
tour:
  - title: Lire et écrire un fichier
    text: |-
      `open(chemin, mode, encoding="utf-8")` ouvre un fichier ; le bloc `with` le referme tout seul à la fin. Le
      mode `"w"` crée le fichier (ou le vide), `"a"` ajoute à la fin, et la lecture est le mode par défaut.

      `write` n'ajoute pas de retour à la ligne : on écrit `"\n"` soi-même. `print(..., file=f)` écrit dans le
      fichier comme à l'écran. En lecture, `for ligne in f` donne les lignes une à une, chacune avec son `"\n"`.

      Le programme travaille dans un dossier temporaire, créé par `tempfile.mkdtemp()`.

      Essaie : remplace le mode `"a"` par `"w"` : la liste ne contient plus que les œufs.
    example:
      files:
        main.py: |-
          import os
          import tempfile

          dossier = tempfile.mkdtemp()
          chemin = os.path.join(dossier, "courses.txt")

          with open(chemin, "w", encoding="utf-8") as f:
              f.write("pain\n")
              f.write("lait\n")

          with open(chemin, "a", encoding="utf-8") as f:
              print("œufs", file=f)

          with open(chemin, encoding="utf-8") as f:
              for numero, ligne in enumerate(f, start=1):
                  print(numero, ligne.rstrip("\n"))

          with open(chemin, encoding="utf-8") as f:
              print(repr(f.read()))
      output: |-
        1 pain
        2 lait
        3 œufs
        'pain\nlait\nœufs\n'
cards:
  - key: mode-a
    format: course
    question: "Que fait le mode `\"a\"` de `open` ?"
    choices:
      - {text: "Il écrit à la fin du fichier, et le crée s'il n'existe pas", correct: true}
      - {text: "Il lit et écrit le fichier, le curseur placé au début", correct: false}
      - {text: "Il vide le fichier, puis écrit à partir du début", correct: false}
      - {text: "Il ouvre le fichier en lecture seule, en ASCII", correct: false}
    answer: "`\"a\"` (*append*) garde le contenu existant : idéal pour un journal. Vider puis écrire, c'est `\"w\"`."
  - key: mode-x
    format: course
    question: "Que fait le mode `\"x\"` de `open` ?"
    choices:
      - {text: "Il crée le fichier, et échoue s'il existe déjà", correct: true}
      - {text: "Il réserve le fichier à ce seul processus", correct: false}
      - {text: "Il ouvre le fichier en lecture binaire", correct: false}
      - {text: "Il exécute le fichier une fois écrit", correct: false}
    answer: "Si le fichier existe, `open` lève une `FileExistsError` : on ne risque pas d'écraser un fichier par erreur."
  - key: pourquoi-with
    format: course
    question: "Pourquoi ouvrir un fichier avec `with open(...) as f:` ?"
    choices:
      - {text: "Le fichier est fermé à la sortie du bloc, même en cas d'exception", correct: true}
      - {text: "La lecture est plus rapide qu'avec un simple appel à `open`", correct: false}
      - {text: "Le fichier est verrouillé contre les autres programmes", correct: false}
      - {text: "Les erreurs d'encodage sont ignorées à l'intérieur du bloc", correct: false}
    answer: "`with` appelle la fermeture dans tous les cas : les données sont écrites sur le disque, et le système récupère le descripteur. Sans `with`, une exception peut laisser le fichier ouvert."
  - key: pourquoi-encoding
    format: course
    question: "Pourquoi passer `encoding=\"utf-8\"` à `open` en mode texte ?"
    choices:
      - {text: "Sans lui, l'encodage dépend du système : cp1252 sous Windows", correct: true}
      - {text: "Sans lui, le fichier s'ouvre en mode binaire, en `bytes`", correct: false}
      - {text: "Sans lui, Python refuse les caractères qui ne sont pas ASCII", correct: false}
      - {text: "Sans lui, les retours à la ligne sont retirés à la lecture", correct: false}
    answer: "En Python 3.14, l'encodage par défaut est celui de la machine : le même script lit ou écrit différemment selon le système. Préciser `utf-8` rend le code portable."
  - key: vf-write-retour-ligne
    format: true-false
    question: "`f.write(\"texte\")` ajoute un retour à la ligne à la fin, comme `print`."
    truth: false
    answer: "`write` écrit exactement ce qu'on lui donne. Pour une ligne, on ajoute `\"\\n\"`, ou on utilise `print(texte, file=f)`."
  - key: vf-iterer-lignes
    format: true-false
    question: |-
      Une boucle `for ligne in f`, sur un fichier ouvert en mode texte, donne ses lignes une à une, chacune avec son
      `"\n"` final.
    truth: true
    answer: |-
      Seule la dernière ligne peut ne pas en avoir, si le fichier ne finit pas par un retour à la ligne. On l'enlève
      avec `ligne.rstrip("\n")`.
  - key: vf-mode-w
    format: true-false
    question: "Le mode `\"w\"` crée le fichier s'il n'existe pas, et le vide s'il existe."
    truth: true
    answer: "Le contenu précédent est perdu dès l'ouverture, avant même la première écriture. Pour ajouter, c'est `\"a\"`."
  - key: vf-rb-str
    format: true-false
    question: "En mode `\"rb\"`, `f.read()` renvoie une chaîne `str`."
    truth: false
    answer: "Le mode binaire renvoie des `bytes`, sans décodage. On le choisit pour une image ou une archive ; pour du texte, le mode texte avec `encoding`."
  - key: qcm-tout-lire
    format: multiple-choice
    question: Quelle méthode lit tout le contenu d'un fichier texte, en une seule chaîne ?
    choices:
      - {text: "`f.read()`", correct: true}
      - {text: "`f.readline()`", correct: false}
      - {text: "`f.readlines()`", correct: false}
      - {text: "`f.content()`", correct: false}
    answer: "`read()` renvoie tout ; `readline()` la ligne suivante ; `readlines()` une liste de lignes."
  - key: qcm-print-file
    format: multiple-choice
    question: "Comment écrire une ligne dans un fichier ouvert `f`, avec `print` ?"
    choices:
      - {text: "`print(\"texte\", file=f)`", correct: true}
      - {text: "`print(f, \"texte\")`", correct: false}
      - {text: "`f.print(\"texte\")`", correct: false}
      - {text: "`print(\"texte\") >> f`", correct: false}
    answer: "Le paramètre `file` redirige `print`, qui ajoute le retour à la ligne. `print(f, \"texte\")` afficherait l'objet fichier à l'écran."
  - key: qcm-r-plus
    format: multiple-choice
    question: Quel mode ouvre un fichier existant en lecture et en écriture, sans le vider ?
    choices:
      - {text: "`\"r+\"`", correct: true}
      - {text: "`\"w+\"`", correct: false}
      - {text: "`\"rw\"`", correct: false}
      - {text: "`\"a\"`", correct: false}
    answer: "`\"r+\"` garde le contenu, curseur au début. `\"w+\"` vide le fichier ; `\"rw\"` n'existe pas (`ValueError`) ; `\"a\"` n'autorise pas la lecture."
  - key: qcm-fichier-absent
    format: multiple-choice
    question: "Quelle exception lève `open(\"absent.txt\")` quand le fichier n'existe pas ?"
    choices:
      - {text: "`FileNotFoundError`", correct: true}
      - {text: "`NotFoundError`", correct: false}
      - {text: "`EOFError`", correct: false}
      - {text: "`PermissionError`", correct: false}
    answer: "`FileNotFoundError` est une sous-classe d'`OSError`, comme `PermissionError` (droits insuffisants) et `FileExistsError`."
