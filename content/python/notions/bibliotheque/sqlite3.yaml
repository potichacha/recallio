notion: sqlite3
lesson: |-
  SQLite est une base de données SQL **dans un simple fichier**, sans serveur. Le module `sqlite3` de la bibliothèque
  standard permet de l'utiliser directement.

  ```python
  import sqlite3

  con = sqlite3.connect("app.db")            # ou ":memory:", une base en mémoire
  con.execute("CREATE TABLE IF NOT EXISTS clients (id INTEGER PRIMARY KEY, nom TEXT, age INTEGER)")

  with con:                                  # une transaction : validée à la sortie, annulée sur exception
      con.execute("INSERT INTO clients (nom, age) VALUES (?, ?)", ("Ada", 36))
      con.executemany("INSERT INTO clients (nom, age) VALUES (?, ?)", [("Alan", 41), ("Grace", 45)])

  ligne = con.execute("SELECT nom, age FROM clients WHERE nom = ?", ("Ada",)).fetchone()   # ('Ada', 36)
  toutes = con.execute("SELECT nom FROM clients ORDER BY nom").fetchall()                  # une liste de tuples
  con.close()
  ```

  **Les paramètres, jamais de f-string** : les valeurs passent par des `?` et un tuple (ou `:nom` et un
  dictionnaire). Le pilote les transmet à part, ce qui empêche l'**injection SQL** : un nom comme `x' OR '1'='1`
  reste une valeur, pas du SQL. Attention au tuple d'un seul élément : `("Ada",)`, avec la virgule.

  **Les transactions**

  - Par défaut, un `INSERT`, `UPDATE` ou `DELETE` ouvre une transaction, qu'il faut **valider** : `con.commit()`.
  - `con.close()` ne valide **pas** : ce qui n'est pas validé est perdu.
  - `with con:` valide à la sortie du bloc, ou annule (`rollback`) si une exception survient. Il **ne ferme pas** la
    connexion.

  **Lire les résultats**

  - `fetchone()` : la ligne suivante, ou `None` s'il n'y en a plus ; `fetchall()` : toutes les lignes ; on peut aussi
    itérer sur le curseur.
  - Chaque ligne est un tuple. Avec `con.row_factory = sqlite3.Row`, on lit aussi par nom : `ligne["nom"]`.
  - `cur.lastrowid` donne l'identifiant de la ligne insérée, `cur.rowcount` le nombre de lignes modifiées.

  SQLite convient à une application locale, aux tests, à un petit service : beaucoup de lectures, des écritures peu
  concurrentes. Pour de nombreuses écritures simultanées depuis plusieurs serveurs, on choisit PostgreSQL.

  **En entretien** : « `sqlite3` donne une vraie base SQL sans serveur. Je passe toujours les valeurs en paramètres
  `?`, contre l'injection SQL, et j'utilise `with con:` pour qu'une transaction soit validée ou annulée en bloc ;
  `close` ne valide rien. `row_factory = sqlite3.Row` permet de lire les colonnes par leur nom. »
cards:
  - key: valeur-en-parametre
    format: course
    question: "Comment passer une valeur à une requête `sqlite3` en toute sécurité ?"
    choices:
      - {text: "Avec un paramètre `?` et un tuple : `execute(sql, (nom,))`", correct: true}
      - {text: "Avec une f-string, en doublant les apostrophes de la valeur", correct: false}
      - {text: "Avec `%s` et l'opérateur `%` appliqué à la chaîne SQL", correct: false}
      - {text: "Avec `str.format`, qui échappe tout seul les valeurs", correct: false}
    answer: "Le pilote transmet la valeur à part : elle ne peut pas devenir du SQL. Échapper à la main finit toujours par oublier un cas."
  - key: with-connexion
    format: course
    question: "Que fait `with con:` sur une connexion `sqlite3` ?"
    choices:
      - {text: "Il valide la transaction à la sortie, ou l'annule sur exception", correct: true}
      - {text: "Il ferme la connexion à la sortie du bloc", correct: false}
      - {text: "Il ouvre un curseur, refermé à la sortie du bloc", correct: false}
      - {text: "Il verrouille la base pour les autres processus", correct: false}
    answer: "C'est un gestionnaire de transaction, pas de connexion : après le bloc, `con` reste ouverte. Pour la fermer aussi, `contextlib.closing(sqlite3.connect(...))`."
  - key: base-en-memoire
    format: course
    question: "Que crée `sqlite3.connect(\":memory:\")` ?"
    choices:
      - {text: "Une base en mémoire, perdue à la fermeture de la connexion", correct: true}
      - {text: "Un fichier nommé `:memory:` dans le dossier courant", correct: false}
      - {text: "Un cache en mémoire devant le fichier de la base", correct: false}
      - {text: "Une connexion à un serveur SQLite qui tourne en local", correct: false}
    answer: "Idéal pour les tests : rapide, et repart de zéro à chaque fois. Chaque connexion `:memory:` a sa propre base."
  - key: row-factory
    format: course
    question: "À quoi sert `con.row_factory = sqlite3.Row` ?"
    choices:
      - {text: "À lire les colonnes par leur nom : `ligne[\"nom\"]`", correct: true}
      - {text: "À renvoyer chaque ligne sous forme de liste modifiable", correct: false}
      - {text: "À compter les lignes renvoyées par chaque requête", correct: false}
      - {text: "À créer une table à partir d'une classe Python", correct: false}
    answer: "Une `sqlite3.Row` se lit par nom ou par position, et `dict(ligne)` la convertit. Par défaut, les lignes sont des tuples."
  - key: vf-serveur
    format: true-false
    question: SQLite demande d'installer et de lancer un serveur de base de données.
    truth: false
    answer: "La base est un fichier, lu et écrit par une bibliothèque intégrée au programme. Le module `sqlite3` est dans la bibliothèque standard."
  - key: vf-close-valide
    format: true-false
    question: "`con.close()` valide automatiquement la transaction en cours."
    truth: false
    answer: "Les modifications non validées sont perdues. Il faut `con.commit()` avant, ou un bloc `with con:`."
  - key: vf-executemany
    format: true-false
    question: "`executemany` exécute la même requête pour chaque tuple d'une liste de paramètres."
    truth: true
    answer: "`con.executemany(\"INSERT INTO t VALUES (?, ?)\", lignes)` insère toutes les lignes, plus vite qu'une boucle d'`execute`."
  - key: vf-fetchone-none
    format: true-false
    question: "`fetchone()` renvoie `None` quand il ne reste plus de ligne à lire."
    truth: true
    answer: "Une requête qui ne trouve rien donne donc `None` dès le premier appel : à tester avant d'indexer le résultat."
  - key: qcm-parametres-nommes
    format: multiple-choice
    question: "Quelle forme de paramètre nommé `sqlite3` accepte-t-il ?"
    choices:
      - {text: "`:nom`, avec un dictionnaire `{\"nom\": ...}`", correct: true}
      - {text: "`{nom}`, avec un dictionnaire", correct: false}
      - {text: "`%(nom)s`, avec un dictionnaire", correct: false}
      - {text: "`#nom`, avec des arguments nommés", correct: false}
    answer: "`con.execute(\"SELECT * FROM clients WHERE nom = :nom\", {\"nom\": \"Ada\"})`. `%(nom)s` est le style de psycopg, le pilote de PostgreSQL."
  - key: qcm-lastrowid
    format: multiple-choice
    question: Comment récupérer l'identifiant de la ligne qu'on vient d'insérer ?
    choices:
      - {text: "`cur.lastrowid`", correct: true}
      - {text: "`cur.rowcount`", correct: false}
      - {text: "`con.last_id()`", correct: false}
      - {text: "`cur.fetchone()`", correct: false}
    answer: "`execute` renvoie un curseur, dont `lastrowid` donne l'identifiant inséré. `rowcount` compte les lignes touchées par la requête."
  - key: qcm-mille-lignes
    format: multiple-choice
    question: Quelle méthode insère efficacement mille lignes avec une seule requête paramétrée ?
    choices:
      - {text: "`executemany`", correct: true}
      - {text: "`executescript`", correct: false}
      - {text: "`execute`, dans une f-string géante", correct: false}
      - {text: "`insertmany`", correct: false}
    answer: "`executemany` réutilise la requête pour chaque tuple. `executescript` exécute un script SQL brut, sans paramètres."
  - key: qcm-quand-sqlite
    format: multiple-choice
    question: Pour quel usage SQLite convient-il bien ?
    choices:
      - {text: "Une application locale ou un petit service, avec peu d'écritures simultanées", correct: true}
      - {text: "Un site très fréquenté, écrit en même temps par des dizaines de serveurs", correct: false}
      - {text: "Un cluster de bases répliquées sur plusieurs régions du monde", correct: false}
      - {text: "Un entrepôt de données de plusieurs téraoctets partagé par une équipe", correct: false}
    answer: "Une seule écriture à la fois, sur une seule machine : parfait pour une application de bureau, un outil, des tests ou un site modeste. Au-delà, un serveur comme PostgreSQL."
