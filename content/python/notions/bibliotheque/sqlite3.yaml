  - key: code-agregats
    format: code-output
    question: |-
      ```python
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.execute("CREATE TABLE t (n INTEGER)")
      con.executemany("INSERT INTO t VALUES (?)", [(1,), (2,), (3,)])
      print(con.execute("SELECT SUM(n), COUNT(*) FROM t").fetchone())
      ```
    answer: "`(6, 3)` : `fetchone` renvoie une ligne, sous forme de tuple."
    check:
      output: "(6, 3)"
    choices:
      - {text: "`(6, 3)`", correct: true}
      - {text: "`[6, 3]`", correct: false}
      - {text: "`[(6, 3)]`", correct: false}
      - {text: "`6 3`", correct: false}
  - key: code-fetchall-tuples
    format: code-output
    question: |-
      ```python
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.execute("CREATE TABLE u (nom TEXT)")
      con.execute("INSERT INTO u VALUES (?)", ("Ada",))
      print(con.execute("SELECT nom FROM u").fetchall())
      ```
    answer: "`[('Ada',)]` : une liste de lignes, chacune un tuple, même avec une seule colonne."
    check:
      output: "[('Ada',)]"
    choices:
      - {text: "`[('Ada',)]`", correct: true}
      - {text: "`['Ada']`", correct: false}
      - {text: "`('Ada',)`", correct: false}
      - {text: "`[['Ada']]`", correct: false}
  - key: code-sqlite-row
    format: code-output
    question: |-
      ```python
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.row_factory = sqlite3.Row
      ligne = con.execute("SELECT 'Ada' AS nom, 36 AS age").fetchone()
      print(ligne["nom"], ligne[1])
      ```
    answer: "`Ada 36` : une `sqlite3.Row` se lit par nom de colonne ou par position."
    check:
      output: Ada 36
    choices:
      - {text: "`Ada 36`", correct: true}
      - {text: "`Ada Ada`", correct: false}
      - {text: "Une `TypeError` : un tuple s'indexe par entier", correct: false}
      - {text: "`nom 36`", correct: false}
  - key: code-rollback
    format: code-output
    question: |-
      ```python
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.execute("CREATE TABLE compte (solde INTEGER)")
      con.execute("INSERT INTO compte VALUES (100)")
      con.commit()
      try:
          with con:
              con.execute("UPDATE compte SET solde = solde - 30")
              raise ValueError("plafond dépassé")
      except ValueError:
          pass
      print(con.execute("SELECT solde FROM compte").fetchone()[0])
      ```
    answer: "`100` : l'exception a fait annuler la transaction par `with con:`, la mise à jour n'a pas eu lieu."
    check:
      output: "100"
    choices:
      - {text: "`100`", correct: true}
      - {text: "`70`", correct: false}
      - {text: "`None`", correct: false}
      - {text: "Une `ValueError` : plafond dépassé", correct: false}
  - key: bug-injection-sql
    format: bug-fix
    question: |-
      Une recherche sur un nom qui n'existe pas affiche `2` : elle renvoie tous les clients.
      ```python
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.execute("CREATE TABLE clients (nom TEXT)")
      con.executemany("INSERT INTO clients VALUES (?)", [("Ada",), ("Alan",)])

      nom = "x' OR '1'='1"
      lignes = con.execute(f"SELECT nom FROM clients WHERE nom = '{nom}'").fetchall()
      print(len(lignes))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`con.execute(\"SELECT nom FROM clients WHERE nom = ?\", (nom,))`", correct: true}
      - {text: "`con.execute(\"SELECT nom FROM clients WHERE nom = ?\", nom)`", correct: false}
      - {text: "`con.execute(\"SELECT nom FROM clients WHERE nom = '%s'\" % nom)`", correct: false}
      - {text: "`con.execute(\"SELECT nom FROM clients WHERE nom = '{}'\".format(nom))`", correct: false}
    answer: |-
      ```python
      lignes = con.execute("SELECT nom FROM clients WHERE nom = ?", (nom,)).fetchall()
      ```
      Insérée dans le texte, la valeur devient du SQL : `WHERE nom = 'x' OR '1'='1'` est toujours vrai. Avec `?`,
      elle reste une valeur. Sans tuple, la chaîne serait prise pour une suite de 12 paramètres.
  - key: bug-tuple-sans-virgule
    format: bug-fix
    question: |-
      Ce script s'arrête sur « sqlite3.ProgrammingError: Incorrect number of bindings supplied. The current statement
      uses 1, and there are 3 supplied. » :
      ```python
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.execute("CREATE TABLE clients (nom TEXT)")
      print(con.execute("SELECT * FROM clients WHERE nom = ?", ("Ada")).fetchall())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`(\"Ada\",)`, avec une virgule", correct: true}
      - {text: "`[\"Ada\"][0]`, le premier élément", correct: false}
      - {text: "`(\"A\", \"d\", \"a\")`, lettre par lettre", correct: false}
      - {text: "`{\"Ada\"}`, entre accolades", correct: false}
    answer: |-
      ```python
      con.execute("SELECT * FROM clients WHERE nom = ?", ("Ada",))
      ```
      Ce sont les virgules qui font un tuple : `("Ada")` est la chaîne `"Ada"`, lue comme trois paramètres.
  - key: bug-commit-oublie
    format: bug-fix
    question: |-
      Ce script affiche `0` : la note insérée a disparu.
      ```python
      import os
      import sqlite3
      import tempfile

      chemin = os.path.join(tempfile.mkdtemp(), "app.db")
      con = sqlite3.connect(chemin)
      con.execute("CREATE TABLE notes (texte TEXT)")
      con.execute("INSERT INTO notes VALUES ('acheter du pain')")
      con.close()

      con = sqlite3.connect(chemin)
      print(con.execute("SELECT COUNT(*) FROM notes").fetchone()[0])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `con.commit()` avant `con.close()`", correct: true}
      - {text: "Appeler `con.close()` deux fois de suite", correct: false}
      - {text: "Remplacer `close()` par `del con`", correct: false}
      - {text: "Ajouter `IF NOT EXISTS` au `CREATE TABLE`", correct: false}
    answer: |-
      ```python
      con.execute("INSERT INTO notes VALUES ('acheter du pain')")
      con.commit()
      con.close()
      ```
      L'`INSERT` a ouvert une transaction ; `close` ne la valide pas, et l'insertion est annulée. Un bloc `with con:`
      autour de l'insertion validerait aussi.
  - key: bug-fetchone-vide
    format: bug-fix
    question: |-
      Ce script s'arrête sur « TypeError: 'NoneType' object is not subscriptable » :
      ```python
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.execute("CREATE TABLE clients (nom TEXT, age INTEGER)")
      con.execute("INSERT INTO clients VALUES ('Ada', 36)")
      age = con.execute("SELECT age FROM clients WHERE nom = ?", ("Bob",)).fetchone()[0]
      print(age)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Garder la ligne, et tester `if ligne is None` avant `[0]`", correct: true}
      - {text: "Remplacer `fetchone()[0]` par `fetchall()[0]`", correct: false}
      - {text: "Remplacer `fetchone()[0]` par `fetchone()[1]`", correct: false}
      - {text: "Ajouter `con.commit()` avant le `SELECT`", correct: false}
    answer: |-
      ```python
      ligne = con.execute("SELECT age FROM clients WHERE nom = ?", ("Bob",)).fetchone()
      age = None if ligne is None else ligne[0]
      ```
      Aucun client ne s'appelle Bob : `fetchone()` renvoie `None`. `fetchall()[0]` lèverait une `IndexError` sur la
      liste vide.
