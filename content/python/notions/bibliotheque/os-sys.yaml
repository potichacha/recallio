notion: os-sys
lesson: |-
  Trois modules pour parler au système.

  **`os`** : l'environnement et le système de fichiers.

  ```python
  import os

  os.environ["HOME"]                 # les variables d'environnement, toujours des chaînes
  os.getenv("PORT", "8000")          # avec une valeur par défaut, sans KeyError
  os.getcwd(), os.listdir(".")       # le dossier courant, son contenu
  os.makedirs("a/b", exist_ok=True)  # créer des dossiers (pathlib le fait aussi)
  os.remove("x.tmp"), os.replace("tmp", "final")
  for dossier, sous_dossiers, fichiers in os.walk("."):   # tout l'arbre
      ...
  ```

  **`sys`** : l'interpréteur lui-même.

  | Nom | Rôle |
  |---|---|
  | `sys.argv` | les arguments : `sys.argv[0]` est le script, les suivants ce qui a été tapé après |
  | `sys.exit(code)` | termine le programme (lève `SystemExit`) ; 0 = succès |
  | `sys.stdin`, `sys.stdout`, `sys.stderr` | les flux standard ; `print(..., file=sys.stderr)` pour une erreur |
  | `sys.version_info` | la version, comparable à un tuple : `sys.version_info >= (3, 12)` |
  | `sys.platform`, `sys.executable`, `sys.path` | le système, l'interpréteur, la recherche des modules |

  **`subprocess`** : lancer une autre commande.

  ```python
  import subprocess

  resultat = subprocess.run(
      ["git", "status", "--short"],      # une liste : aucun shell n'interprète les arguments
      capture_output=True,               # garder stdout et stderr, sinon ils vont au terminal
      text=True,                         # des str, pas des bytes
      check=True,                        # CalledProcessError si le code de sortie n'est pas 0
      timeout=10,                        # TimeoutExpired si la commande traîne
  )
  print(resultat.stdout, resultat.returncode)
  ```

  **Sécurité** : jamais `shell=True` avec une valeur venue de l'extérieur. `subprocess.run(f"convert {nom} out.png",
  shell=True)` exécute aussi ce que `nom` contient après un `;`. Avec une liste, chaque argument est passé tel quel.
  `os.system` est l'ancienne façon de faire : un shell, et pas de sortie récupérable.

  La configuration d'une application (ports, URL, secrets) passe par des **variables d'environnement**, pas par le
  code : la même image tourne en local et en production.

  **En entretien** : « `os` pour l'environnement et les fichiers, `sys` pour l'interpréteur (`argv`, `exit`,
  `stderr`), `subprocess.run` pour lancer une commande, avec une liste d'arguments, `capture_output`, `text`, `check`
  et un `timeout`. Jamais `shell=True` avec une entrée utilisateur : c'est une injection de commande. »
cards:
  - key: getenv-defaut
    format: course
    question: "Comment lis-tu la variable d'environnement `PORT`, avec `\"8000\"` par défaut ?"
    choices:
      - {text: "`os.getenv(\"PORT\", \"8000\")`", correct: true}
      - {text: "`sys.env[\"PORT\"] or \"8000\"`", correct: false}
      - {text: "`os.environ(\"PORT\", \"8000\")`", correct: false}
      - {text: "`os.getenv(\"PORT\") | \"8000\"`", correct: false}
    answer: "`os.getenv` (ou `os.environ.get`) renvoie la valeur par défaut si la variable manque ; `os.environ[\"PORT\"]` lèverait une `KeyError`. La valeur est une chaîne : `int(...)` pour un port."
  - key: argv-zero
    format: course
    question: "Que contient `sys.argv[0]` ?"
    choices:
      - {text: "Le nom du script lancé", correct: true}
      - {text: "Le premier argument passé au script", correct: false}
      - {text: "Le chemin de l'interpréteur Python", correct: false}
      - {text: "Le nombre d'arguments reçus", correct: false}
    answer: "`python outil.py a b` donne `['outil.py', 'a', 'b']` : les arguments commencent à l'indice 1. L'interpréteur est dans `sys.executable`."
  - key: liste-plutot-que-shell
    format: course
    question: "Pourquoi passer à `subprocess.run` une liste, `[\"ls\", \"-l\", dossier]`, plutôt qu'une chaîne avec `shell=True` ?"
    choices:
      - {text: "Aucun shell n'interprète les arguments : pas d'injection de commande", correct: true}
      - {text: "Une liste s'exécute plus vite qu'une chaîne passée au shell", correct: false}
      - {text: "`shell=True` ne fonctionne que sous Windows, pas sous Linux", correct: false}
      - {text: "Une chaîne passée au shell ne peut pas contenir d'espace", correct: false}
    answer: "Avec une liste, `dossier` reste un seul argument, même s'il contient `; rm -rf ~`. Le shell, lui, l'interpréterait comme une seconde commande."
  - key: option-check
    format: course
    question: "Que fait `check=True` dans `subprocess.run` ?"
    choices:
      - {text: "Il lève `CalledProcessError` si la commande échoue", correct: true}
      - {text: "Il vérifie que la commande existe avant de la lancer", correct: false}
      - {text: "Il capture la sortie standard de la commande", correct: false}
      - {text: "Il demande une confirmation avant de lancer la commande", correct: false}
    answer: "Sans lui, un code de sortie non nul passe inaperçu : il faut lire `resultat.returncode`. L'exception porte le code et, si capturées, les sorties."
  - key: vf-environ-chaines
    format: true-false
    question: "Les valeurs de `os.environ` sont toujours des chaînes."
    truth: true
    answer: "Le système ne connaît que du texte : `os.environ[\"DEBUG\"] = 1` lève une `TypeError`, et `\"0\"` est une chaîne vraie. On convertit soi-même."
  - key: vf-sys-exit
    format: true-false
    question: "`sys.exit(1)` lève l'exception `SystemExit`."
    truth: true
    answer: "C'est pour cela qu'un `finally` s'exécute encore, et qu'un `except Exception` ne l'attrape pas (`SystemExit` hérite de `BaseException`)."
  - key: vf-sans-capture
    format: true-false
    question: "Sans `capture_output=True`, `subprocess.run` renvoie la sortie de la commande dans `resultat.stdout`."
    truth: false
    answer: "La sortie va directement au terminal, et `resultat.stdout` vaut `None`. Il faut `capture_output=True` (ou `stdout=subprocess.PIPE`)."
  - key: vf-os-system
    format: true-false
    question: "`os.system` est l'outil recommandé pour lancer une commande et lire sa sortie."
    truth: false
    answer: "`os.system` passe par un shell et ne renvoie que le code de sortie. `subprocess.run` le remplace."
  - key: qcm-version
    format: multiple-choice
    question: Comment tester qu'on tourne sous Python 3.12 ou plus ?
    choices:
      - {text: "`sys.version_info >= (3, 12)`", correct: true}
      - {text: "`sys.version >= \"3.12\"`", correct: false}
      - {text: "`os.version() >= 3.12`", correct: false}
      - {text: "`sys.python >= 3.12`", correct: false}
    answer: "`version_info` se compare comme un tuple. Comparer des chaînes est un piège : `\"3.9\" >= \"3.12\"` est vrai, dans l'ordre alphabétique."
  - key: qcm-lire-sortie
    format: multiple-choice
    question: "Comment récupérer la sortie texte de `git status` ?"
    choices:
      - {text: "`subprocess.run([\"git\", \"status\"], capture_output=True, text=True).stdout`", correct: true}
      - {text: "`os.system(\"git status\")`, qui renvoie la sortie sous forme de texte", correct: false}
      - {text: "`subprocess.call([\"git\", \"status\"]).stdout`", correct: false}
      - {text: "`subprocess.Popen(\"git status\").read()`", correct: false}
    answer: "`capture_output` garde les sorties, `text` les décode en `str`. `os.system` renvoie le code de sortie ; `call` aussi."
  - key: qcm-walk
    format: multiple-choice
    question: Quelle fonction parcourt un dossier et tous ses sous-dossiers ?
    choices:
      - {text: "`os.walk`", correct: true}
      - {text: "`os.listdir`", correct: false}
      - {text: "`os.scandir`", correct: false}
      - {text: "`sys.walk`", correct: false}
    answer: "`os.walk` donne, pour chaque dossier, `(chemin, sous_dossiers, fichiers)`. `listdir` et `scandir` ne regardent qu'un niveau ; `Path.rglob` est l'alternative de pathlib."
  - key: qcm-stderr
    format: multiple-choice
    question: Comment écrire un message sur la sortie d'erreur ?
    choices:
      - {text: "`print(\"erreur\", file=sys.stderr)`", correct: true}
      - {text: "`print(\"erreur\", err=True)`", correct: false}
      - {text: "`sys.error(\"erreur\")`", correct: false}
      - {text: "`print.stderr(\"erreur\")`", correct: false}
    answer: "Les erreurs vont sur `stderr`, les résultats sur `stdout` : `outil > resultat.txt` garde ainsi les erreurs à l'écran."
  - key: sc-injection-commande
    format: scenario
    question: "Un service lance `subprocess.run(f\"convert {nom_fichier} out.png\", shell=True)` avec un nom envoyé par l'utilisateur. Que lui reproches-tu ?"
    choices:
      - {text: "Un nom comme `x; rm -rf ~` lance une autre commande : passe une liste, sans shell", correct: true}
      - {text: "Rien : `subprocess.run` échappe tout seul les valeurs insérées dans une f-string", correct: false}
      - {text: "Le nom de fichier doit être converti en minuscules avant l'appel", correct: false}
      - {text: "Il manque `check=True`, sans lequel la commande n'est pas lancée", correct: false}
    answer: "Le shell interprète `;`, `|` ou `$(...)` : c'est une injection de commande. `subprocess.run([\"convert\", nom_fichier, \"out.png\"])` passe le nom comme un seul argument."
  - key: sc-cle-api
    format: scenario
    question: Ton application a besoin d'une clé d'API différente en local et en production. Où la mets-tu ?
    choices:
      - {text: "Dans une variable d'environnement, lue avec `os.environ`", correct: true}
      - {text: "Dans le code, avec un `if` sur le nom de la machine", correct: false}
      - {text: "Dans un fichier versionné dans Git, un par environnement", correct: false}
      - {text: "Dans `sys.argv`, tapée à chaque lancement du programme", correct: false}
    answer: "Le secret reste hors du dépôt, et le même code tourne partout : c'est le principe des « 12 facteurs ». En local, un fichier `.env` ignoré par Git peut les définir."
  - key: sc-outil-bloque
    format: scenario
    question: Un script appelle un outil externe qui se bloque parfois indéfiniment. Que fais-tu ?
    choices:
      - {text: "Passer `timeout=` à `subprocess.run`, et traiter `TimeoutExpired`", correct: true}
      - {text: "Lancer l'outil avec `os.system` dans une boucle `while True`", correct: false}
      - {text: "Ajouter `check=True`, qui arrête une commande trop longue", correct: false}
      - {text: "Appeler `time.sleep` juste avant de lancer l'outil", correct: false}
    answer: "Après le délai, `run` tue le processus et lève `subprocess.TimeoutExpired` : le script peut réessayer ou signaler l'erreur au lieu d'attendre pour toujours."
  - key: sc-code-sortie-ci
    format: scenario
    question: Ton script de vérification, lancé par la CI, doit signaler un échec au pipeline. Que fais-tu ?
    choices:
      - {text: "Terminer avec un code de sortie non nul : `sys.exit(1)`", correct: true}
      - {text: "Afficher « ERREUR » en majuscules sur la sortie standard", correct: false}
      - {text: "Lever un avertissement avec `warnings.warn`", correct: false}
      - {text: "Écrire l'erreur dans un fichier `erreur.txt`", correct: false}
    answer: "La CI ne lit pas les messages, elle lit le code de sortie : 0 pour un succès, autre chose pour un échec. Une exception non rattrapée donne aussi le code 1."
