notion: secrets-hashlib
lesson: |-
  **`secrets`** produit du hasard **imprévisible**, tiré du générateur cryptographique du système : pour les jetons,
  les mots de passe, les liens de réinitialisation.

  ```python
  import secrets

  secrets.token_hex(16)          # 32 caractères hexadécimaux (16 octets)
  secrets.token_urlsafe(32)      # utilisable dans une URL
  secrets.token_bytes(16)        # 16 octets bruts
  secrets.choice("abcdef0123")   # un caractère, pour composer un mot de passe
  secrets.compare_digest(a, b)   # compare deux jetons en temps constant
  ```

  `random`, lui, est prévisible : jamais pour la sécurité. `compare_digest` met le même temps quelle que soit la
  position de la première différence : un attaquant ne peut pas deviner un jeton caractère par caractère en
  mesurant le temps de réponse, comme avec `==`.

  **`hashlib`** calcule des **empreintes** (*hash*) : une suite d'octets de taille fixe, qui change complètement au
  moindre changement de l'entrée, et dont on ne peut pas remonter à l'entrée autrement qu'en essayant des candidats.

  ```python
  import hashlib

  hashlib.sha256(b"abc").hexdigest()            # 64 caractères hexadécimaux
  hashlib.sha256("été".encode("utf-8")).hexdigest()   # une str s'encode d'abord

  h = hashlib.sha256()                          # un gros fichier, par blocs
  with open("archive.zip", "rb") as f:
      for bloc in iter(lambda: f.read(65536), b""):
          h.update(bloc)
  h.hexdigest()                                 # ou hashlib.file_digest(f, "sha256") (3.11)
  ```

  | Usage | Outil |
  |---|---|
  | vérifier l'intégrité d'un fichier | `sha256`, comparé à l'empreinte publiée |
  | stocker un mot de passe | une fonction **lente et salée** : `hashlib.scrypt`, `pbkdf2_hmac`, ou argon2, bcrypt |
  | signer un message avec une clé partagée | `hmac` (`hmac.new(cle, message, "sha256")`) |
  | sécurité | jamais MD5 ni SHA-1, cassés |

  **Les mots de passe** : un SHA-256 simple est **trop rapide** (des milliards d'essais par seconde) et, sans **sel**
  (une valeur aléatoire propre à chaque utilisateur), deux mots de passe identiques ont la même empreinte. On utilise
  une fonction de dérivation lente, avec un sel ; et on ne chiffre pas les mots de passe, on les hache.

  **En entretien** : « `secrets` pour tout ce qui doit être imprévisible (jetons, liens de réinitialisation), et
  `compare_digest` pour comparer. `hashlib.sha256` pour les empreintes d'intégrité ; pour les mots de passe, une
  fonction lente et salée comme scrypt ou argon2, jamais un SHA-256 nu ni MD5. `hmac` pour signer avec une clé. »
cards:
  - key: secrets-ou-random
    format: course
    question: "Pourquoi utiliser `secrets` plutôt que `random` pour un jeton de session ?"
    choices:
      - {text: "`secrets` puise dans le générateur cryptographique du système", correct: true}
      - {text: "`secrets` produit des jetons plus courts, plus faciles à stocker", correct: false}
      - {text: "`random` ne sait produire que des nombres, pas de texte", correct: false}
      - {text: "`secrets` chiffre le jeton avant de le renvoyer", correct: false}
    answer: "Les sorties de `random` se prédisent à partir de quelques valeurs observées. Celles de `secrets` (via `os.urandom`) sont imprévisibles."
  - key: hexdigest
    format: course
    question: "Que renvoie `hashlib.sha256(b\"abc\").hexdigest()` ?"
    choices:
      - {text: "L'empreinte, en 64 caractères hexadécimaux", correct: true}
      - {text: "Le texte chiffré, qu'une clé permet de déchiffrer", correct: false}
      - {text: "Les 32 octets bruts de l'empreinte, en `bytes`", correct: false}
      - {text: "Une empreinte qui change à chaque appel", correct: false}
    answer: "SHA-256 donne 32 octets : `digest()` les renvoie bruts, `hexdigest()` en hexadécimal (64 caractères). La même entrée donne toujours la même empreinte."
  - key: sha256-mot-de-passe
    format: course
    question: "Pourquoi ne pas stocker un mot de passe sous la forme `sha256(mot_de_passe)` ?"
    choices:
      - {text: "SHA-256 est trop rapide : sans sel, on le casse par force brute ou par tables", correct: true}
      - {text: "SHA-256 n'accepte pas les caractères accentués des mots de passe", correct: false}
      - {text: "Une empreinte SHA-256 se déchiffre facilement avec la bonne clé", correct: false}
      - {text: "SHA-256 produit des empreintes trop longues pour une base de données", correct: false}
    answer: "Un attaquant essaie des milliards de mots de passe par seconde, et des tables précalculées couvrent les plus courants. Une fonction lente et salée (scrypt, argon2) rend chaque essai coûteux."
  - key: compare-digest
    format: course
    question: "Pourquoi comparer deux jetons avec `secrets.compare_digest` plutôt qu'avec `==` ?"
    choices:
      - {text: "Sa durée ne dépend pas de l'endroit où les jetons diffèrent", correct: true}
      - {text: "`==` ne sait pas comparer deux chaînes hexadécimales", correct: false}
      - {text: "`compare_digest` ignore la casse des lettres du jeton", correct: false}
      - {text: "`compare_digest` est nettement plus rapide que `==`", correct: false}
    answer: "`==` s'arrête au premier caractère différent : en mesurant les temps de réponse, on peut deviner le jeton petit à petit. C'est une attaque temporelle."
  - key: vf-sens-unique
    format: true-false
    question: On ne peut retrouver le texte d'origine d'une empreinte SHA-256 qu'en essayant des candidats.
    truth: true
    answer: "Une fonction de hachage est à sens unique. C'est pourquoi un mot de passe court ou courant reste vulnérable : on essaie les candidats probables."
  - key: vf-md5
    format: true-false
    question: MD5 reste un bon choix pour signer des données sensibles.
    truth: false
    answer: "MD5 et SHA-1 sont cassés : on sait fabriquer deux entrées de même empreinte. Pour la sécurité, SHA-256 ou plus, et `hmac` pour signer."
  - key: vf-token-hex
    format: true-false
    question: "`secrets.token_hex(16)` renvoie une chaîne de 32 caractères."
    truth: true
    answer: "16 octets aléatoires, deux caractères hexadécimaux par octet. Sans argument, la taille par défaut est jugée sûre par le module."
  - key: vf-sha256-str
    format: true-false
    question: "`hashlib.sha256(\"texte\")` accepte directement une `str`."
    truth: false
    answer: "« TypeError: Strings must be encoded before hashing » : on hache des octets, `\"texte\".encode(\"utf-8\")`."
  - key: qcm-token-url
    format: multiple-choice
    question: Quelle fonction produit un jeton aléatoire utilisable tel quel dans une URL ?
    choices:
      - {text: "`secrets.token_urlsafe()`", correct: true}
      - {text: "`secrets.token_url()`", correct: false}
      - {text: "`random.urlsafe()`", correct: false}
      - {text: "`hashlib.token()`", correct: false}
    answer: "`token_urlsafe` encode les octets en base64 adaptée aux URL (lettres, chiffres, `-` et `_`)."
  - key: qcm-derivation
    format: multiple-choice
    question: "Quelle fonction de `hashlib` convient pour dériver une clé d'un mot de passe ?"
    choices:
      - {text: "`hashlib.scrypt`, lente et avec un sel", correct: true}
      - {text: "`hashlib.sha256`, sur un mot de passe long", correct: false}
      - {text: "`hashlib.md5`, appliqué deux fois de suite", correct: false}
      - {text: "`hashlib.blake2b`, rapide et sans sel", correct: false}
    answer: "`scrypt` (ou `pbkdf2_hmac`) est conçue pour être coûteuse en temps et en mémoire. Des bibliothèques comme argon2-cffi ou bcrypt sont aussi recommandées."
  - key: qcm-gros-fichier
    format: multiple-choice
    question: Comment calculer l'empreinte SHA-256 d'un gros fichier sans tout charger en mémoire ?
    choices:
      - {text: "Lire par blocs, et appeler `update` sur l'objet de hachage", correct: true}
      - {text: "Appeler `sha256(f.read())` sur le fichier entier", correct: false}
      - {text: "Hacher chaque ligne, puis additionner les empreintes", correct: false}
      - {text: "Appeler `secrets.token_hex` sur le contenu du fichier", correct: false}
    answer: "`h.update(bloc)` accumule ; le résultat est le même qu'en une fois. Depuis 3.11, `hashlib.file_digest(f, \"sha256\")` le fait pour toi."
  - key: qcm-hmac
    format: multiple-choice
    question: Quel module vérifie qu'un message vient de quelqu'un qui connaît une clé secrète partagée ?
    choices:
      - {text: "`hmac`", correct: true}
      - {text: "`hashlib.md5`", correct: false}
      - {text: "`secrets`", correct: false}
      - {text: "`base64`", correct: false}
    answer: "Un HMAC est une empreinte calculée avec la clé : sans elle, impossible de la produire. On la vérifie avec `hmac.compare_digest`."
  - key: trous-token-hex
    format: fill-in
    question: |-
      Complète pour obtenir un jeton de 32 caractères hexadécimaux :
      ```python
      jeton = secrets.___(16)
      ```
    blanks: [[token_hex]]
    answer: "`token_hex(16)` : 16 octets, 32 caractères."
  - key: trous-encode
    format: fill-in
    question: |-
      Complète pour hacher une chaîne :
      ```python
      empreinte = hashlib.sha256(texte.___("utf-8")).hexdigest()
      ```
    blanks: [[encode]]
    answer: "`encode` transforme la chaîne en octets, ce qu'attend `sha256`."
  - key: trous-hexdigest
    format: fill-in
    question: |-
      Complète pour obtenir l'empreinte en hexadécimal :
      ```python
      empreinte = hashlib.sha256(donnees).___()
      ```
    blanks: [[hexdigest]]
    answer: "`hexdigest()` en texte, `digest()` en octets bruts."
  - key: trous-compare-digest
    format: fill-in
    question: |-
      Complète pour comparer deux jetons en temps constant :
      ```python
      if secrets.___(jeton_recu, jeton_attendu):
          autoriser()
      ```
    blanks: [[compare_digest]]
    answer: "`secrets.compare_digest` (le même que `hmac.compare_digest`)."
  - key: sc-reinitialisation
    format: scenario
    question: Tu génères le lien de réinitialisation du mot de passe d'un utilisateur. Comment crées-tu son jeton ?
    choices:
      - {text: "`secrets.token_urlsafe(32)`, gardé en base avec une date d'expiration", correct: true}
      - {text: "`random.randint` sur un très grand intervalle, converti en texte", correct: false}
      - {text: "L'empreinte SHA-256 de l'adresse e-mail de l'utilisateur", correct: false}
      - {text: "L'heure actuelle en millisecondes, suivie de l'identifiant", correct: false}
    answer: "Le jeton doit être imprévisible, à usage unique et expirer vite. Une empreinte de l'e-mail ou l'heure se devinent ; `random` se prédit."
  - key: sc-stocker-mots-de-passe
    format: scenario
    question: Tu dois stocker les mots de passe de tes utilisateurs. Que fais-tu ?
    choices:
      - {text: "Une empreinte lente et salée, avec scrypt ou argon2", correct: true}
      - {text: "Les chiffrer avec une clé gardée dans le code", correct: false}
      - {text: "Leur empreinte MD5, rapide à vérifier à la connexion", correct: false}
      - {text: "Les garder en clair, dans une table bien protégée", correct: false}
    answer: "On ne doit jamais pouvoir retrouver un mot de passe : on le hache, avec un sel par utilisateur, par une fonction volontairement lente. Une fuite de la base reste alors peu exploitable."
  - key: sc-integrite-telechargement
    format: scenario
    question: Tu télécharges une archive, publiée avec son empreinte SHA-256. Comment vérifies-tu son intégrité ?
    choices:
      - {text: "Calculer l'empreinte SHA-256 du fichier reçu et la comparer à celle publiée", correct: true}
      - {text: "Vérifier que la taille du fichier reçu est bien la bonne", correct: false}
      - {text: "Ouvrir l'archive : si elle s'ouvre sans erreur, elle est intacte", correct: false}
      - {text: "Recalculer plutôt l'empreinte MD5, plus rapide à obtenir", correct: false}
    answer: "Le moindre octet modifié change toute l'empreinte. La taille peut être identique avec un contenu altéré ; MD5 ne correspondrait pas à l'empreinte publiée."
  - key: sc-webhook
    format: scenario
    question: Un service tiers t'envoie des webhooks signés avec une clé partagée. Comment vérifies-tu la signature ?
    choices:
      - {text: "Recalculer le HMAC du corps avec la clé, puis `hmac.compare_digest`", correct: true}
      - {text: "Comparer l'adresse IP de l'expéditeur à une liste connue", correct: false}
      - {text: "Vérifier que le corps de la requête contient du JSON valide", correct: false}
      - {text: "Recalculer le SHA-256 du corps, sans la clé, et comparer avec `==`", correct: false}
    answer: "Seul qui connaît la clé peut produire ce HMAC. Un SHA-256 sans clé, n'importe qui peut le calculer ; et `==` ouvre la porte à une attaque temporelle."
