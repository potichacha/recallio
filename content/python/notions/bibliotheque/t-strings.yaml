notion: t-strings
lesson: |-
  Python 3.14 ajoute les **template strings** (PEP 750) : la syntaxe d'une f-string, avec le préfixe `t`, mais le
  résultat n'est **pas une chaîne**. C'est un objet `Template`, qui garde **séparés** le texte et les valeurs.

  ```python
  from string.templatelib import Interpolation, Template

  nom = "Ada"
  modele = t"Bonjour {nom} !"

  type(modele)              # <class 'string.templatelib.Template'>
  modele.strings            # ('Bonjour ', ' !') : les morceaux de texte
  modele.values             # ('Ada',) : les valeurs évaluées
  modele.interpolations     # (Interpolation('Ada', 'nom', None, ''),)
  list(modele)              # ['Bonjour ', Interpolation(...), ' !'] : dans l'ordre, sans chaîne vide
  ```

  **Une `Interpolation`** porte quatre champs : `value` (la valeur), `expression` (le texte de l'expression, `"nom"`),
  `conversion` (`"r"`, `"s"`, `"a"` ou `None`) et `format_spec` (`".2f"`...). La conversion et le format sont
  **gardés, pas appliqués** : c'est au code qui traite le modèle de décider.

  `strings` a toujours un élément de plus que `interpolations`, quitte à contenir des chaînes vides :
  `t"{nom}".strings` vaut `('', '')`.

  **Pourquoi faire ?** Une f-string produit directement le texte final : une valeur dangereuse y entre telle quelle.
  Avec un `Template`, une bibliothèque voit chaque valeur à part, et peut l'**échapper** pour du HTML, la passer en
  **paramètre** d'une requête SQL, ou la garder pour des **logs structurés**.

  ```python
  from html import escape


  def html(modele: Template) -> str:
      morceaux = []
      for partie in modele:
          match partie:
              case str() as texte:
                  morceaux.append(texte)
              case Interpolation(valeur, _, _, _):
                  morceaux.append(escape(str(valeur)))
      return "".join(morceaux)


  saisie = "<script>"
  html(t"<p>{saisie}</p>")      # '<p>&lt;script&gt;</p>'
  ```

  **À savoir**

  - Un `Template` n'a pas de rendu par défaut : `str(modele)` donne sa représentation, `Template(strings=...)`.
  - On concatène deux `Template` avec `+`, mais pas un `Template` et une `str` (`TypeError`).
  - Le préfixe se combine avec `r` (`rt"..."`), pas avec `f` ni `b`.
  - `string.templatelib.convert(valeur, conversion)` applique une conversion `!r`, `!s` ou `!a`.

  **En entretien** : « Une t-string, `t"..."`, a la syntaxe d'une f-string, mais donne un objet `Template` qui garde
  le texte et les valeurs séparés, avec l'expression, la conversion et le format de chacune. Une bibliothèque peut
  alors échapper les valeurs pour du HTML ou les passer en paramètres SQL, au lieu de recevoir une chaîne déjà
  construite. C'est nouveau en Python 3.14. »
cards:
  - key: produit
    format: course
    question: "Que produit `t\"Bonjour {nom}\"` en Python 3.14 ?"
    choices:
      - {text: "Un objet `Template`, qui garde le texte et les valeurs séparés", correct: true}
      - {text: "Une `str`, comme une f-string, mais évaluée plus tard", correct: false}
      - {text: "Une `str` dont les valeurs sont déjà échappées pour le HTML", correct: false}
      - {text: "Une fonction qui reformate la chaîne à chaque appel", correct: false}
    answer: "Le `Template` contient les morceaux de texte (`strings`) et les valeurs évaluées tout de suite, comme dans une f-string (`interpolations`). Personne n'a encore assemblé le texte final."
  - key: probleme-resolu
    format: course
    question: Quel problème les t-strings résolvent-elles ?
    choices:
      - {text: "Laisser une bibliothèque traiter les valeurs, par exemple les échapper, avant de produire le texte", correct: true}
      - {text: "Formater les nombres plus rapidement qu'avec une f-string ordinaire", correct: false}
      - {text: "Traduire les chaînes de l'interface dans d'autres langues", correct: false}
      - {text: "Remplacer la méthode `str.format`, devenue obsolète en 3.14", correct: false}
    answer: "Avec une f-string, une saisie comme `<script>` ou `x' OR '1'='1` est déjà dans le texte. Avec un `Template`, la bibliothèque HTML ou SQL reçoit chaque valeur à part, et la traite correctement."
  - key: strings-un-de-plus
    format: course
    question: "Dans un `Template`, combien d'éléments compte `strings`, par rapport à `interpolations` ?"
    choices:
      - {text: "Un de plus, quitte à contenir des chaînes vides", correct: true}
      - {text: "Autant : une chaîne par interpolation", correct: false}
      - {text: "Un de moins : le texte entre deux valeurs", correct: false}
      - {text: "Aucune règle : cela dépend du texte", correct: false}
    answer: "Texte et valeurs alternent, en commençant et finissant par du texte : `t\"{a}{b}\".strings` vaut `('', '', '')`."
  - key: module-templatelib
    format: course
    question: "Dans quel module se trouvent les classes `Template` et `Interpolation` ?"
    choices:
      - {text: "`string.templatelib`", correct: true}
      - {text: "`string`", correct: false}
      - {text: "`typing`", correct: false}
      - {text: "`templates`", correct: false}
    answer: "`string.templatelib`, nouveau en 3.14. À ne pas confondre avec `string.Template`, une ancienne classe de substitution par `$nom`."
  - key: vf-sous-classe-str
    format: true-false
    question: "Une t-string est une sous-classe de `str`."
    truth: false
    answer: "`isinstance(t\"x\", str)` vaut `False` : un `Template` n'est pas une chaîne, et une fonction qui attend du texte ne l'accepte pas sans traitement."
  - key: vf-concatener-str
    format: true-false
    question: "On peut concaténer une t-string et une `str` avec `+`."
    truth: false
    answer: "`t\"a\" + \"b\"` lève une `TypeError`. Deux `Template` se concatènent, eux : `t\"a{x}\" + t\"b{y}\"`."
  - key: vf-format-garde
    format: true-false
    question: "Dans `t\"{x:.2f}\"`, la valeur gardée par l'interpolation est déjà arrondie à deux décimales."
    truth: false
    answer: "La valeur est gardée telle quelle, et `\".2f\"` est rangé dans `format_spec`. Le code qui traite le modèle choisit de l'appliquer, par exemple avec `format(valeur, format_spec)`."
  - key: vf-pep-750
    format: true-false
    question: Les t-strings sont définies par la PEP 750.
    truth: true
    answer: "Elles sont arrivées avec Python 3.14, avec le module `string.templatelib`."
  - key: qcm-champs-interpolation
    format: multiple-choice
    question: "Quels champs porte un objet `Interpolation` ?"
    choices:
      - {text: "`value`, `expression`, `conversion`, `format_spec`", correct: true}
      - {text: "`name`, `value`, `type`, `default`", correct: false}
      - {text: "`text`, `value`, `escaped`, `width`", correct: false}
      - {text: "`key`, `value`, `index`, `position`", correct: false}
    answer: "La valeur évaluée, le texte de l'expression, la conversion (`r`, `s`, `a` ou `None`) et le format. Ce sont aussi les champs d'un motif `case Interpolation(valeur, expr, conv, spec)`."
  - key: qcm-iterer
    format: multiple-choice
    question: "Que donne une boucle `for partie in modele`, sur un `Template` ?"
    choices:
      - {text: "Les morceaux de texte et les interpolations, dans l'ordre", correct: true}
      - {text: "Les caractères de la chaîne finale, un par un", correct: false}
      - {text: "Les valeurs seules, sans les morceaux de texte", correct: false}
      - {text: "Les noms des variables qui ont été interpolées", correct: false}
    answer: "Des `str` et des `Interpolation`, alternés ; les chaînes vides sont omises. C'est la façon habituelle d'écrire une fonction de rendu."
  - key: qcm-str-du-template
    format: multiple-choice
    question: "Que donne `str(t\"Bonjour {nom}\")` ?"
    choices:
      - {text: "Sa représentation, `Template(strings=...)`", correct: true}
      - {text: "`'Bonjour Ada'`, comme une f-string", correct: false}
      - {text: "Une `TypeError` : pas de conversion", correct: false}
      - {text: "`'Bonjour {nom}'`, sans substitution", correct: false}
    answer: "Un `Template` n'a pas de rendu par défaut : `str` donne sa représentation. C'est voulu, pour qu'on ne l'utilise pas comme une chaîne par mégarde."
  - key: qcm-sql
    format: multiple-choice
    question: "Pourquoi une bibliothèque SQL accepterait-elle un `Template` plutôt qu'une `str` ?"
    choices:
      - {text: "Elle voit chaque valeur à part, et peut la passer en paramètre de la requête", correct: true}
      - {text: "Un `Template` s'exécute plus vite qu'une chaîne ordinaire", correct: false}
      - {text: "Un `Template` vérifie la syntaxe SQL dès la compilation", correct: false}
      - {text: "Un `Template` chiffre les valeurs avant de les envoyer", correct: false}
    answer: "`db.execute(t\"SELECT * FROM clients WHERE nom = {nom}\")` peut devenir une requête avec `?` et le paramètre `nom` : la commodité d'une f-string, sans injection SQL."
  - key: code-strings-values
    format: code-output
    question: |-
      ```python
      nom = "Ada"
      modele = t"Bonjour {nom} !"
      print(modele.strings, modele.values)
      ```
    answer: "`('Bonjour ', ' !') ('Ada',)` : deux tuples, les morceaux de texte et les valeurs."
    check:
      output: "('Bonjour ', ' !') ('Ada',)"
    choices:
      - {text: "`('Bonjour ', ' !') ('Ada',)`", correct: true}
      - {text: "`('Bonjour Ada !',) ()`", correct: false}
      - {text: "`('Bonjour ', ' !') ('nom',)`", correct: false}
      - {text: "`['Bonjour ', ' !'] ['Ada']`", correct: false}
  - key: code-format-garde
    format: code-output
    question: |-
      ```python
      x = 3.14159
      modele = t"{x:.2f}"
      print(modele.values[0], modele.interpolations[0].format_spec)
      ```
    answer: "`3.14159 .2f` : la valeur n'est pas formatée, le format est gardé à côté."
    check:
      output: 3.14159 .2f
    choices:
      - {text: "`3.14159 .2f`", correct: true}
      - {text: "`3.14 .2f`", correct: false}
      - {text: "`3.14 None`", correct: false}
      - {text: "`3.14159 None`", correct: false}
  - key: code-expression
    format: code-output
    question: |-
      ```python
      a, b = 2, 3
      modele = t"{a + b}"
      print(modele.interpolations[0].expression, modele.values[0])
      ```
    answer: "`a + b 5` : l'interpolation garde le texte de l'expression et sa valeur, calculée tout de suite."
    check:
      output: a + b 5
    choices:
      - {text: "`a + b 5`", correct: true}
      - {text: "`5 5`", correct: false}
      - {text: "`a + b a + b`", correct: false}
      - {text: "`{a + b} 5`", correct: false}
  - key: code-echappement-html
    format: code-output
    question: |-
      ```python
      from html import escape
      from string.templatelib import Template


      def html(modele: Template) -> str:
          return "".join(
              partie if isinstance(partie, str) else escape(str(partie.value))
              for partie in modele
          )


      saisie = "<script>"
      print(html(t"<p>{saisie}</p>"))
      ```
    answer: "`<p>&lt;script&gt;</p>` : le texte du modèle reste tel quel, seule la valeur est échappée."
    check:
      output: "<p>&lt;script&gt;</p>"
    choices:
      - {text: "`<p>&lt;script&gt;</p>`", correct: true}
      - {text: "`<p><script></p>`", correct: false}
      - {text: "`&lt;p&gt;&lt;script&gt;&lt;/p&gt;`", correct: false}
      - {text: "`<p>{saisie}</p>`", correct: false}
