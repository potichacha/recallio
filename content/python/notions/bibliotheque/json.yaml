notion: json
lesson: |-
  Le module `json` convertit des objets Python en texte JSON, et inversement.

  ```python
  import json

  commande = {"id": 7, "client": "Zoé", "payee": False, "remise": None, "articles": [1, 2]}

  texte = json.dumps(commande)          # objet -> chaîne JSON
  relue = json.loads(texte)             # chaîne JSON -> objet

  with open("commande.json", "w", encoding="utf-8") as f:
      json.dump(commande, f, indent=2)  # objet -> fichier
  with open("commande.json", encoding="utf-8") as f:
      relue = json.load(f)              # fichier -> objet
  ```

  Le `s` final (`dumps`, `loads`) veut dire *string* : sans lui, la fonction travaille sur un fichier ouvert.

  | Python | JSON | Retour en Python |
  |---|---|---|
  | `dict` | objet `{}` | `dict` |
  | `list`, `tuple` | tableau `[]` | `list` (le tuple est perdu) |
  | `str` | chaîne | `str` |
  | `int`, `float` | nombre | `int`, `float` |
  | `True`, `False` | `true`, `false` | `True`, `False` |
  | `None` | `null` | `None` |

  **Les pièges**

  - Les **clés** d'un objet JSON sont toujours des chaînes : `{1: "un"}` revient sous la forme `{"1": "un"}`.
  - `set`, `date`, `datetime`, `Decimal` ou un objet quelconque : « TypeError: Object of type date is not JSON
    serializable ». On convertit avant (`d.isoformat()`, `sorted(tags)`), ou on passe une fonction de conversion :
    `json.dumps(donnees, default=str)`.
  - JSON exige des guillemets doubles : `json.loads("{'a': 1}")` lève une `json.JSONDecodeError`, sous-classe de
    `ValueError`. `str(dico)` produit du Python, pas du JSON.
  - `json.dumps(float("nan"))` écrit `NaN`, que d'autres langages refusent : `allow_nan=False` l'interdit.

  **Les options utiles de `dumps`**

  | Option | Effet |
  |---|---|
  | `indent=2` | sur plusieurs lignes, indenté |
  | `sort_keys=True` | clés triées : une sortie stable, comparable |
  | `ensure_ascii=False` | `"été"` tel quel, au lieu de `"\u00e9t\u00e9"` |
  | `default=fonction` | appelée pour chaque objet que JSON ne connaît pas |

  `python -m json fichier.json` (ou `python -m json.tool`) affiche un fichier JSON indenté.

  **En entretien** : « `dumps` et `loads` travaillent sur des chaînes, `dump` et `load` sur des fichiers. JSON ne
  connaît que les dictionnaires, listes, chaînes, nombres, booléens et `null` : les clés deviennent des chaînes, les
  tuples des listes, et une date demande une conversion, avec `default` ou à la main. Une erreur de lecture est une
  `JSONDecodeError`, une `ValueError`. »
tour:
  - title: "Le module json : dumps et loads"
    text: |-
      `json.dumps` transforme un objet Python en texte JSON, `json.loads` fait l'inverse. `True` devient `true`,
      `None` devient `null`, un tuple devient un tableau.

      Quelques options de `dumps` : `ensure_ascii=False` garde les accents tels quels, `indent=2` répartit le JSON sur
      plusieurs lignes, et `sort_keys=True` trie les clés.

      Essaie : ajoute la clé `"date": date(2026, 11, 17)` à la commande, avec `from datetime import date`. JSON ne
      sait pas écrire une date : `dumps` lève une `TypeError`.
    example:
      files:
        main.py: |-
          import json

          commande = {
              "id": 42,
              "client": "Ada",
              "articles": [{"nom": "stylo", "prix": 1.5}, {"nom": "cahier", "prix": 3.0}],
              "payee": False,
              "remise": None,
          }

          texte = json.dumps(commande)
          print(texte)

          relue = json.loads(texte)
          print(relue["articles"][1]["nom"], relue["payee"], relue["remise"])

          print(json.dumps({"ville": "Évry", "codes": (91, 92)}, ensure_ascii=False))
          print(json.dumps({"b": 1, "a": 2}, indent=2, sort_keys=True))
      output: |-
        {"id": 42, "client": "Ada", "articles": [{"nom": "stylo", "prix": 1.5}, {"nom": "cahier", "prix": 3.0}], "payee": false, "remise": null}
        cahier False None
        {"ville": "Évry", "codes": [91, 92]}
        {
          "a": 2,
          "b": 1
        }
    task:
      instructions: |-
        Le programme lit une commande au format JSON. Calcule son total, la somme du prix multiplié par la quantité de
        chaque article, pour afficher `total : 7.5`.
      starter:
        main.py: |-
          import json

          texte = """
          {"articles": [
              {"nom": "stylo", "prix": 1.5, "quantite": 3},
              {"nom": "cahier", "prix": 3.0, "quantite": 1}
          ]}
          """

          commande = json.loads(texte)
          total = 0
          print("total :", total)
      solution:
        main.py: |-
          import json

          texte = """
          {"articles": [
              {"nom": "stylo", "prix": 1.5, "quantite": 3},
              {"nom": "cahier", "prix": 3.0, "quantite": 1}
          ]}
          """

          commande = json.loads(texte)
          total = 0
          for article in commande["articles"]:
              total += article["prix"] * article["quantite"]
          print("total :", total)
      output: |-
        total : 7.5
cards:
  - key: dumps-ou-dump
    format: course
    question: "Quelle différence entre `json.dumps` et `json.dump` ?"
    choices:
      - {text: "`dumps` renvoie une chaîne, `dump` écrit dans un fichier ouvert", correct: true}
      - {text: "`dumps` écrit plusieurs objets, `dump` un seul à la fois", correct: false}
      - {text: "`dumps` trie les clés, `dump` garde leur ordre d'insertion", correct: false}
      - {text: "`dump` est l'ancien nom de `dumps`, gardé par compatibilité", correct: false}
    answer: "Le `s` veut dire *string*. Même logique pour la lecture : `loads` lit une chaîne, `load` un fichier ouvert."
  - key: none-en-json
    format: course
    question: "Que devient `None` dans le texte produit par `json.dumps` ?"
    choices:
      - {text: "`null`", correct: true}
      - {text: "`None`", correct: false}
      - {text: "`\"None\"`", correct: false}
      - {text: "`undefined`", correct: false}
    answer: "JSON écrit `null`, `true` et `false` en minuscules ; `json.loads` les relit en `None`, `True` et `False`."
  - key: cles-entieres
    format: course
    question: "Que deviennent les clés entières de `{1: \"a\"}` après un aller-retour par `dumps` puis `loads` ?"
    choices:
      - {text: "Des chaînes : `{\"1\": \"a\"}`", correct: true}
      - {text: "Des entiers, inchangés", correct: false}
      - {text: "Une `TypeError` à l'écriture", correct: false}
      - {text: "Des flottants : `{1.0: \"a\"}`", correct: false}
    answer: "Une clé d'objet JSON est toujours une chaîne : `dumps` convertit les clés `int`, `float`, `bool` et `None`, et `loads` ne les reconvertit pas."
  - key: parametre-default
    format: course
    question: "À quoi sert le paramètre `default` de `json.dumps` ?"
    choices:
      - {text: "À convertir un objet que JSON ne connaît pas, comme une date", correct: true}
      - {text: "À donner une valeur aux clés absentes du dictionnaire", correct: false}
      - {text: "À choisir l'indentation à utiliser par défaut", correct: false}
      - {text: "À remplacer chaque `None` par une valeur choisie", correct: false}
    answer: "`dumps` appelle `default(objet)` pour chaque objet qu'il ne sait pas écrire, et écrit ce qu'elle renvoie. `default=str` transforme une date en `\"2026-11-17\"`."
  - key: vf-tuple-tableau
    format: true-false
    question: "`json.dumps((1, 2))` produit un tableau JSON, `[1, 2]`."
    truth: true
    answer: "JSON n'a qu'un type de séquence : le tableau. Relu par `loads`, il devient une liste, `[1, 2]`, et le tuple est perdu."
  - key: vf-decode-error
    format: true-false
    question: "`json.JSONDecodeError` est une sous-classe de `ValueError`."
    truth: true
    answer: "Un `except ValueError` attrape donc aussi un JSON mal formé. L'exception donne la ligne et la colonne de l'erreur."
  - key: vf-guillemets-simples
    format: true-false
    question: "`json.loads(\"{'a': 1}\")` renvoie le dictionnaire `{'a': 1}`."
    truth: false
    answer: "JSON n'accepte que les guillemets doubles : « Expecting property name enclosed in double quotes ». Ce texte est du Python, pas du JSON."
  - key: vf-set
    format: true-false
    question: "`json.dumps` sait écrire un `set` Python, sous la forme d'un tableau."
    truth: false
    answer: "« Object of type set is not JSON serializable ». On le convertit d'abord, en liste triée pour une sortie stable : `sorted(tags)`."
  - key: qcm-indent
    format: multiple-choice
    question: "Quel argument rend la sortie de `json.dumps` lisible, sur plusieurs lignes ?"
    choices:
      - {text: "`indent=2`", correct: true}
      - {text: "`pretty=True`", correct: false}
      - {text: "`format=\"lines\"`", correct: false}
      - {text: "`newline=True`", correct: false}
    answer: "`indent` donne le nombre d'espaces par niveau. Sans lui, tout tient sur une ligne."
  - key: qcm-accents
    format: multiple-choice
    question: "Comment garder `é` tel quel dans la sortie de `json.dumps`, plutôt que sa séquence d'échappement `\\u00e9` ?"
    choices:
      - {text: "`ensure_ascii=False`", correct: true}
      - {text: "`encoding=\"utf-8\"`", correct: false}
      - {text: "`unicode=True`", correct: false}
      - {text: "`ascii=None`", correct: false}
    answer: "Par défaut, `dumps` n'écrit que de l'ASCII. Avec `ensure_ascii=False`, le fichier doit être ouvert en UTF-8."
  - key: qcm-lire-fichier
    format: multiple-choice
    question: "Comment lis-tu un fichier JSON ouvert dans `f` ?"
    choices:
      - {text: "`json.load(f)`", correct: true}
      - {text: "`json.loads(f)`", correct: false}
      - {text: "`json.read(f)`", correct: false}
      - {text: "`json.parse(f)`", correct: false}
    answer: "`load` lit un fichier, `loads` une chaîne. `JSON.parse` est la fonction de JavaScript."
  - key: qcm-texte-invalide
    format: multiple-choice
    question: "Quelle exception lève `json.loads(\"{nom: 1}\")` ?"
    choices:
      - {text: "`json.JSONDecodeError`", correct: true}
      - {text: "`SyntaxError`", correct: false}
      - {text: "`KeyError`", correct: false}
      - {text: "`TypeError`", correct: false}
    answer: "Les clés JSON sont des chaînes entre guillemets doubles. `SyntaxError` est réservée au code Python lui-même."
  - key: trous-dumps-loads
    format: fill-in
    question: |-
      Complète l'aller-retour entre objet et texte :
      ```python
      texte = json.___(donnees)
      relu = json.___(texte)
      ```
    blanks: [[dumps], [loads]]
    answer: "`dumps` vers une chaîne, `loads` depuis une chaîne."
  - key: trous-dump-fichier
    format: fill-in
    question: |-
      Complète pour écrire la configuration dans le fichier :
      ```python
      with open("config.json", "w", encoding="utf-8") as f:
          json.___(config, f, indent=2)
      ```
    blanks: [[dump]]
    answer: "`dump(objet, fichier)` écrit directement dans le fichier ouvert."
  - key: trous-sort-keys
    format: fill-in
    question: |-
      Complète pour trier les clés, et obtenir une sortie stable :
      ```python
      texte = json.dumps(d, ___=True)
      ```
    blanks: [[sort_keys]]
    answer: "`sort_keys=True` : utile pour comparer deux sorties ou versionner un fichier JSON."
  - key: trous-default-str
    format: fill-in
    question: |-
      Complète pour écrire les dates sous forme de texte :
      ```python
      texte = json.dumps(commande, ___=str)
      ```
    blanks: [[default]]
    answer: "`default=str` convertit chaque objet inconnu par `str` : une date devient `\"2026-11-17\"`."
  - key: code-types-json
    format: code-output
    question: |-
      ```python
      import json

      print(json.dumps({"ok": True, "vide": None, "pi": 3.5}))
      ```
    answer: "`{\"ok\": true, \"vide\": null, \"pi\": 3.5}` : guillemets doubles, `true` et `null` en minuscules."
    check:
      output: '{"ok": true, "vide": null, "pi": 3.5}'
    choices:
      - {text: '`{"ok": true, "vide": null, "pi": 3.5}`', correct: true}
      - {text: "`{'ok': True, 'vide': None, 'pi': 3.5}`", correct: false}
      - {text: '`{"ok": True, "vide": None, "pi": 3.5}`', correct: false}
      - {text: '`{"ok": "true", "vide": "null", "pi": "3.5"}`', correct: false}
  - key: code-cle-devenue-chaine
    format: code-output
    question: |-
      ```python
      import json

      donnees = json.loads(json.dumps({1: "un"}))
      print(donnees, 1 in donnees)
      ```
    answer: "`{'1': 'un'} False` : la clé est revenue sous forme de chaîne, donc l'entier `1` n'est plus une clé."
    check:
      output: "{'1': 'un'} False"
    choices:
      - {text: "`{'1': 'un'} False`", correct: true}
      - {text: "`{1: 'un'} True`", correct: false}
      - {text: "`{'1': 'un'} True`", correct: false}
      - {text: "`{1: 'un'} False`", correct: false}
  - key: code-tuple-perdu
    format: code-output
    question: |-
      ```python
      import json

      print(json.loads(json.dumps({"t": (1, 2)})))
      ```
    answer: "`{'t': [1, 2]}` : le tuple devient un tableau JSON, relu comme une liste."
    check:
      output: "{'t': [1, 2]}"
    choices:
      - {text: "`{'t': [1, 2]}`", correct: true}
      - {text: "`{'t': (1, 2)}`", correct: false}
      - {text: "`{\"t\": [1, 2]}`", correct: false}
      - {text: "Une `TypeError` : un tuple n'est pas sérialisable", correct: false}
  - key: code-ensure-ascii
    format: code-output
    question: |-
      ```python
      import json

      print(json.dumps("été"), json.dumps("été", ensure_ascii=False))
      ```
    answer: "`\"\\u00e9t\\u00e9\" \"été\"` : par défaut, les caractères non ASCII sont échappés ; `ensure_ascii=False` les garde."
    check:
      output: '"\u00e9t\u00e9" "été"'
    choices:
      - {text: '`"\u00e9t\u00e9" "été"`', correct: true}
      - {text: '`"été" "été"`', correct: false}
      - {text: '`"été" "\u00e9t\u00e9"`', correct: false}
      - {text: '`"\u00e9t\u00e9" "\u00e9t\u00e9"`', correct: false}
  - key: bug-date-non-serialisable
    format: bug-fix
    question: |-
      Ce script s'arrête sur « TypeError: Object of type date is not JSON serializable », suivi de la note « when
      serializing dict item 'date' » :
      ```python
      import json
      from datetime import date

      commande = {"id": 7, "date": date(2026, 11, 17)}
      print(json.dumps(commande))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(json.dumps(commande, default=str))`", correct: true}
      - {text: "`print(json.dumps(commande, ensure_ascii=False))`", correct: false}
      - {text: "`print(json.dumps(str(commande)))`", correct: false}
      - {text: "`print(json.dump(commande))`", correct: false}
    answer: |-
      ```python
      print(json.dumps(commande, default=str))
      # {"id": 7, "date": "2026-11-17"}
      ```
      JSON ne connaît pas les dates : `default` dit comment convertir. `json.dumps(str(commande))` écrirait une seule
      chaîne JSON, qui contient du texte Python.
  - key: bug-loads-sur-fichier
    format: bug-fix
    question: |-
      Ce script s'arrête sur « TypeError: the JSON object must be str, bytes or bytearray, not TextIOWrapper » :
      ```python
      import json
      import os
      import tempfile

      chemin = os.path.join(tempfile.mkdtemp(), "config.json")
      with open(chemin, "w", encoding="utf-8") as f:
          f.write('{"port": 8080}')
      with open(chemin, encoding="utf-8") as f:
          config = json.loads(f)
      print(config["port"])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`config = json.load(f)`", correct: true}
      - {text: "`config = json.loads(str(f))`", correct: false}
      - {text: "`config = json.loads(f.readline)`", correct: false}
      - {text: "`config = json.dumps(f)`", correct: false}
    answer: |-
      ```python
      with open(chemin, encoding="utf-8") as f:
          config = json.load(f)
      ```
      `loads` attend une chaîne ; `load` lit un fichier ouvert. `json.loads(f.read())` marcherait aussi ; `str(f)`
      donnerait la description de l'objet fichier.
  - key: bug-cle-entiere-relue
    format: bug-fix
    question: |-
      Ce script s'arrête sur « KeyError: 101 » :
      ```python
      import json

      stock = {101: 5, 102: 0}
      relu = json.loads(json.dumps(stock))
      print(relu[101])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`relu = {int(k): v for k, v in json.loads(texte).items()}`", correct: true}
      - {text: "`relu = json.loads(json.dumps(stock, sort_keys=True))`", correct: false}
      - {text: "`relu = json.loads(json.dumps(stock), parse_int=int)`", correct: false}
      - {text: "`relu = json.loads(json.dumps(stock, default=int))`", correct: false}
    answer: |-
      ```python
      texte = json.dumps(stock)
      relu = {int(k): v for k, v in json.loads(texte).items()}
      print(relu[101])
      ```
      Les clés JSON sont des chaînes : `relu` vaut `{'101': 5, '102': 0}`. On reconvertit les clés en relisant ;
      `parse_int` ne touche qu'aux valeurs, et `default` n'est pas appelé pour les clés.
  - key: bug-str-au-lieu-de-dumps
    format: bug-fix
    question: |-
      Ce script s'arrête sur « json.decoder.JSONDecodeError: Expecting property name enclosed in double quotes: line
      1 column 2 (char 1) » :
      ```python
      import json

      profil = {"nom": "Ada", "actif": True}
      texte = str(profil)
      print(json.loads(texte))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`texte = json.dumps(profil)`", correct: true}
      - {text: "`texte = repr(profil)`", correct: false}
      - {text: "`texte = str(profil).lower()`", correct: false}
      - {text: "`texte = f\"{profil}\"`", correct: false}
    answer: |-
      ```python
      texte = json.dumps(profil)
      print(json.loads(texte))
      ```
      `str(profil)` donne `{'nom': 'Ada', 'actif': True}` : des apostrophes et un `True` majuscule, du Python. Seul
      `json.dumps` produit du JSON. `repr` et la f-string donnent le même texte que `str`.
