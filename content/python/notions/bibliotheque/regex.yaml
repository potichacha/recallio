notion: regex
lesson: |-
  Le module `re` cherche des motifs dans du texte. On écrit les motifs en **chaînes brutes**, `r"..."`, pour que les
  antislashs arrivent tels quels au module.

  ```python
  import re

  texte = "Commande 42 livrée le 17/11/2026, commande 7 le 18/11/2026"

  re.search(r"\d+", texte).group()       # '42' : la première occurrence, n'importe où
  re.match(r"\d+", texte)                # None : match ne regarde qu'au début
  re.fullmatch(r"\d{5}", "75011")        # tout le texte doit correspondre
  re.findall(r"\d{2}/\d{2}/\d{4}", texte)   # ['17/11/2026', '18/11/2026']
  re.sub(r"\s+", " ", "a   b \n c")      # 'a b c'
  re.split(r"[,;]\s*", "a, b;c")         # ['a', 'b', 'c']
  ```

  | Élément | Sens |
  |---|---|
  | `\d`, `\w`, `\s` | un chiffre, un caractère de mot, un blanc (`\D`, `\W`, `\S` : le contraire) |
  | `.` | n'importe quel caractère, sauf le retour à la ligne |
  | `[a-z]`, `[^"]` | un caractère de la classe, ou hors de la classe |
  | `*`, `+`, `?`, `{2,4}` | répétitions : 0 ou plus, 1 ou plus, 0 ou 1, de 2 à 4 |
  | `*?`, `+?` | les mêmes, **paresseuses** : le moins possible |
  | `^`, `$`, `\b` | début, fin, frontière de mot |
  | `( )`, `(?P<nom> )`, `(?: )` | un groupe capturant, nommé, non capturant |
  | `\.` | un point littéral (tout caractère spécial s'échappe) |

  **Les groupes**

  ```python
  m = re.search(r"(?P<jour>\d{2})/(?P<mois>\d{2})/(?P<annee>\d{4})", texte)
  m.group(0)          # '17/11/2026', toute la correspondance
  m.group(1), m["mois"]    # '17', '11'
  m.groupdict()       # {'jour': '17', 'mois': '11', 'annee': '2026'}
  re.findall(r"(\w+)=(\d+)", "a=1, b=22")      # [('a', '1'), ('b', '22')] : des tuples de groupes
  re.sub(r"(\d{2})/(\d{2})/(\d{4})", r"\3-\2-\1", texte)   # les groupes réutilisés dans le remplacement
  ```

  `search` et `match` renvoient un objet `Match`, ou **`None`** : on teste avant d'appeler `.group()`.
  `re.finditer` donne les correspondances une à une, avec leur position (`m.start()`, `m.span()`).

  **Les pièges** : sans `r`, `"\b"` est un retour arrière, pas une frontière de mot ; `.*` est **glouton** et avale
  tout ce qu'il peut (`.*?` ou `[^"]*` pour s'arrêter au premier guillemet) ; un `.` non échappé accepte n'importe quel
  caractère ; `match` ne cherche qu'au début.

  **Drapeaux et compilation** : `re.IGNORECASE`, `re.MULTILINE` (`^` et `$` à chaque ligne), `re.DOTALL` (`.` accepte
  le retour à la ligne), `re.VERBOSE` (espaces et commentaires dans le motif). `re.compile(motif, drapeaux)` nomme un
  motif réutilisé ; `re.escape(texte)` échappe un texte à chercher tel quel.

  **En entretien** : « Je cherche avec `re.search`, `findall` ou `finditer`, je remplace avec `re.sub`, et j'écris
  les motifs en chaînes brutes. Pour valider un format, `fullmatch`. Je me méfie des quantificateurs gloutons, et je
  teste le `None` avant `.group()`. Pour un simple découpage, une méthode de chaîne suffit souvent. »
cards:
  - key: chaine-brute
    format: course
    question: 'Pourquoi écrire les motifs avec une chaîne brute, `r"\d+"` ?'
    choices:
      - {text: "Pour que les antislashs arrivent tels quels au module `re`", correct: true}
      - {text: "Pour que le motif ne soit compilé qu'une seule fois", correct: false}
      - {text: "Pour que la recherche ignore la casse des lettres", correct: false}
      - {text: "Pour que le motif accepte les caractères accentués", correct: false}
    answer: 'Dans une chaîne normale, Python interprète d''abord les échappements : `"\b"` devient un retour arrière. Avec `r"\b"`, le module `re` reçoit bien `\b`, la frontière de mot.'
  - key: match-ou-search
    format: course
    question: "Quelle différence entre `re.match` et `re.search` ?"
    choices:
      - {text: "`match` ne cherche qu'au début de la chaîne, `search` partout", correct: true}
      - {text: "`match` renvoie un booléen, `search` un objet résultat", correct: false}
      - {text: "`match` trouve toutes les occurrences, `search` la première", correct: false}
      - {text: "`match` respecte la casse, `search` l'ignore", correct: false}
    answer: "Les deux renvoient un `Match` ou `None`. Pour exiger que tout le texte corresponde, c'est `fullmatch` ; pour toutes les occurrences, `findall` ou `finditer`."
  - key: paresseux
    format: course
    question: "Que change le `?` dans `.*?` ?"
    choices:
      - {text: "La répétition prend le moins de caractères possible", correct: true}
      - {text: "Le point devient facultatif dans le motif", correct: false}
      - {text: "La répétition est limitée à un seul caractère", correct: false}
      - {text: "Le motif accepte aussi les retours à la ligne", correct: false}
    answer: "`.*` est glouton : il va le plus loin possible. `.*?` est paresseux : il s'arrête dès que la suite du motif correspond. Sur `<b>x</b>`, `<.+>` prend tout, `<.+?>` prend `<b>`."
  - key: findall-groupes
    format: course
    question: "Que renvoie `re.findall` quand le motif contient deux groupes ?"
    choices:
      - {text: "Une liste de tuples, un par correspondance", correct: true}
      - {text: "La liste des correspondances, sans les groupes", correct: false}
      - {text: "Un seul tuple, avec tous les groupes", correct: false}
      - {text: "Un dictionnaire, groupe par groupe", correct: false}
    answer: "Sans groupe : la liste des correspondances ; un groupe : la liste de ce groupe ; plusieurs : des tuples. Pour l'objet `Match` complet, `finditer`."
  - key: vf-fullmatch
    format: true-false
    question: "`re.fullmatch` exige que le motif couvre toute la chaîne."
    truth: true
    answer: "C'est la fonction pour valider un format, sans ajouter `^` et `$` au motif."
  - key: vf-search-none
    format: true-false
    question: "`re.search` renvoie `None` quand le motif n'est trouvé nulle part."
    truth: true
    answer: "Appeler `.group()` sur ce `None` lève une `AttributeError` : on teste d'abord, `if m := re.search(...)`."
  - key: vf-sub-premiere
    format: true-false
    question: "Par défaut, `re.sub` ne remplace que la première occurrence."
    truth: false
    answer: "Il remplace toutes les occurrences. Le paramètre `count=1` le limite à la première."
  - key: vf-point-retour-ligne
    format: true-false
    question: "Par défaut, le point `.` d'un motif reconnaît aussi le retour à la ligne."
    truth: false
    answer: "Le point accepte tout sauf `\\n`. Le drapeau `re.DOTALL` lui fait accepter aussi le retour à la ligne."
  - key: qcm-groupe-nomme
    format: multiple-choice
    question: "Comment nommer un groupe `annee` dans un motif ?"
    choices:
      - {text: '`(?P<annee>\d{4})`', correct: true}
      - {text: '`(<annee>\d{4})`', correct: false}
      - {text: '`(?annee:\d{4})`', correct: false}
      - {text: '`{annee}\d{4}`', correct: false}
    answer: "`(?P<nom>...)`, puis `m[\"annee\"]` ou `m.group(\"annee\")`. La syntaxe `(?<nom>...)` d'autres langages lève une erreur en Python."
  - key: qcm-ignorecase
    format: multiple-choice
    question: Quel drapeau fait ignorer la casse à une recherche ?
    choices:
      - {text: "`re.IGNORECASE`", correct: true}
      - {text: "`re.NOCASE`", correct: false}
      - {text: "`re.LOWER`", correct: false}
      - {text: "`re.CASE`", correct: false}
    answer: "`re.IGNORECASE`, ou `re.I`, passé en paramètre : `re.search(motif, texte, re.I)`. Les drapeaux se combinent avec `|`."
  - key: qcm-compile
    format: multiple-choice
    question: "Pourquoi utiliser `re.compile` ?"
    choices:
      - {text: "Pour nommer un motif réutilisé, avec ses drapeaux", correct: true}
      - {text: "Parce que `re.search` refuse un motif en chaîne", correct: false}
      - {text: "Pour que le motif accepte plusieurs lignes", correct: false}
      - {text: "Pour que les groupes soient nommés automatiquement", correct: false}
    answer: "`DATE = re.compile(r\"...\")` en tête de module, puis `DATE.search(texte)`. Le gain de vitesse est faible : `re` garde déjà en cache les motifs récents."
  - key: qcm-finditer
    format: multiple-choice
    question: Quelle fonction parcourt les correspondances une à une, avec leur position ?
    choices:
      - {text: "`re.finditer`", correct: true}
      - {text: "`re.findall`", correct: false}
      - {text: "`re.scan`", correct: false}
      - {text: "`re.iterall`", correct: false}
    answer: "`finditer` renvoie un itérateur d'objets `Match` : `m.group()`, `m.start()`, `m.span()`. `findall` ne donne que les textes."
  - key: trous-search-group
    format: fill-in
    question: |-
      Complète pour afficher le premier nombre trouvé :
      ```python
      m = re.___(r"\d+", texte)
      if m:
          print(m.___())
      ```
    blanks: [[search], [group]]
    answer: "`search` cherche partout, `group()` renvoie le texte trouvé."
  - key: trous-sub
    format: fill-in
    question: |-
      Complète pour remplacer chaque suite de blancs par une seule espace :
      ```python
      propre = re.___(r"\s+", " ", texte)
      ```
    blanks: [[sub]]
    answer: "`re.sub(motif, remplacement, texte)` remplace toutes les occurrences."
  - key: trous-prefixe-r
    format: fill-in
    question: |-
      Complète pour écrire le motif en chaîne brute :
      ```python
      nombres = re.findall(___"\d+", texte)
      ```
    blanks: [[r, R]]
    answer: "Le préfixe `r` garde les antislashs tels quels."
  - key: trous-groupe-par-nom
    format: fill-in
    question: |-
      Complète pour lire le groupe nommé :
      ```python
      m = re.search(r"(?P<code>\d{5})", adresse)
      print(m["___"])
      ```
    blanks: [[code]]
    answer: "Un groupe nommé se lit par son nom : `m[\"code\"]` ou `m.group(\"code\")`."
  - key: code-match-search
    format: code-output
    question: |-
      ```python
      import re

      print(re.match(r"\d+", "abc 123"), re.search(r"\d+", "abc 123").group())
      ```
    answer: "`None 123` : `match` ne regarde qu'au début, où il y a `abc` ; `search` trouve `123` plus loin."
    check:
      output: None 123
    choices:
      - {text: "`None 123`", correct: true}
      - {text: "`123 123`", correct: false}
      - {text: "`None None`", correct: false}
      - {text: "`abc 123`", correct: false}
  - key: code-findall-tuples
    format: code-output
    question: |-
      ```python
      import re

      print(re.findall(r"(\w+)=(\d+)", "a=1, b=22"))
      ```
    answer: "`[('a', '1'), ('b', '22')]` : avec deux groupes, un tuple par correspondance ; les valeurs restent des chaînes."
    check:
      output: "[('a', '1'), ('b', '22')]"
    choices:
      - {text: "`[('a', '1'), ('b', '22')]`", correct: true}
      - {text: "`['a=1', 'b=22']`", correct: false}
      - {text: "`[('a', 1), ('b', 22)]`", correct: false}
      - {text: "`{'a': '1', 'b': '22'}`", correct: false}
  - key: code-glouton
    format: code-output
    question: |-
      ```python
      import re

      html = "<b>gras</b>"
      print(re.findall(r"<.+>", html), re.findall(r"<.+?>", html))
      ```
    answer: "`['<b>gras</b>'] ['<b>', '</b>']` : `.+` va le plus loin possible, `.+?` s'arrête au premier `>`."
    check:
      output: "['<b>gras</b>'] ['<b>', '</b>']"
    choices:
      - {text: "`['<b>gras</b>'] ['<b>', '</b>']`", correct: true}
      - {text: "`['<b>', '</b>'] ['<b>gras</b>']`", correct: false}
      - {text: "`['<b>', '</b>'] ['<b>', '</b>']`", correct: false}
      - {text: "`['<b>gras</b>'] ['<b>gras</b>']`", correct: false}
  - key: code-sub-groupes
    format: code-output
    question: |-
      ```python
      import re

      print(re.sub(r"(\d{2})/(\d{2})/(\d{4})", r"\3-\2-\1", "le 17/11/2026"))
      ```
    answer: "`le 2026-11-17` : `\\1`, `\\2` et `\\3` reprennent les groupes dans le remplacement."
    check:
      output: le 2026-11-17
    choices:
      - {text: "`le 2026-11-17`", correct: true}
      - {text: "`le 17-11-2026`", correct: false}
      - {text: "`le \\3-\\2-\\1`", correct: false}
      - {text: "`2026-11-17`", correct: false}
  - key: bug-sans-chaine-brute
    format: bug-fix
    question: |-
      Ce script affiche `None`, alors que « chat » est bien dans la phrase :
      ```python
      import re

      print(re.search("\bchat\b", "le chat dort"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: '`re.search(r"\bchat\b", "le chat dort")`', correct: true}
      - {text: '`re.match("\bchat\b", "le chat dort")`', correct: false}
      - {text: '`re.search("\bchat\b", r"le chat dort")`', correct: false}
      - {text: '`re.search("chat\b", "le chat dort")`', correct: false}
    answer: |-
      ```python
      print(re.search(r"\bchat\b", "le chat dort"))
      ```
      Sans `r`, Python transforme `\b` en retour arrière (`\x08`) avant même l'appel : le motif cherche ce caractère.
      C'est le motif qu'il faut écrire en chaîne brute, pas le texte.
  - key: bug-match-au-debut
    format: bug-fix
    question: |-
      Ce script affiche `None` au lieu de trouver le code postal :
      ```python
      import re

      print(re.match(r"\d{5}", "Code postal : 75011"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: '`re.search(r"\d{5}", "Code postal : 75011")`', correct: true}
      - {text: '`re.match(r"\d{5}$", "Code postal : 75011")`', correct: false}
      - {text: '`re.fullmatch(r"\d{5}", "Code postal : 75011")`', correct: false}
      - {text: '`re.match(r"\d{1,5}", "Code postal : 75011")`', correct: false}
    answer: |-
      ```python
      print(re.search(r"\d{5}", "Code postal : 75011").group())   # 75011
      ```
      `match` ne regarde qu'au début de la chaîne, où se trouve `Code`. `search` cherche partout ; `fullmatch` exige
      que toute la chaîne soit un code.
  - key: bug-glouton-guillemets
    format: bug-fix
    question: |-
      Ce script affiche `['Ada" ville="Paris']` au lieu de `['Ada', 'Paris']` :
      ```python
      import re

      print(re.findall(r'"(.*)"', 'nom="Ada" ville="Paris"'))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: '`re.findall(r''"(.*?)"'', texte)`', correct: true}
      - {text: '`re.findall(r''"(.+)"'', texte)`', correct: false}
      - {text: '`re.findall(r''"(.*)"$'', texte)`', correct: false}
      - {text: '`re.findall(r''^"(.*)"'', texte)`', correct: false}
    answer: |-
      ```python
      print(re.findall(r'"(.*?)"', 'nom="Ada" ville="Paris"'))
      ```
      `.*` est glouton : il va jusqu'au dernier guillemet. `.*?` s'arrête au premier ; `[^"]*` (tout sauf un guillemet)
      marche aussi.
  - key: bug-point-non-echappe
    format: bug-fix
    question: |-
      Cette validation d'un nombre décimal accepte `12a5`, et affiche `True` :
      ```python
      import re

      print(bool(re.fullmatch(r"\d+.\d+", "12a5")))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: '`r"\d+\.\d+"`', correct: true}
      - {text: '`r"\d+[.]?\d*."`', correct: false}
      - {text: '`r"\d+..\d+"`', correct: false}
      - {text: '`"\d+.\d+"`', correct: false}
    answer: |-
      ```python
      print(bool(re.fullmatch(r"\d+\.\d+", "12a5")))   # False
      ```
      Le point non échappé accepte n'importe quel caractère, dont `a`. `\.` (ou `[.]`) désigne un point littéral.
