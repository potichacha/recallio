notion: pathlib
lesson: |-
  `pathlib` représente un chemin par un **objet** `Path`, avec ses attributs et ses méthodes, plutôt que par une
  chaîne passée aux fonctions de `os.path`.

  ```python
  from pathlib import Path

  rapport = Path("rapports") / "2026" / "bilan.final.pdf"   # l'opérateur / assemble
  rapport.name       # 'bilan.final.pdf'
  rapport.stem       # 'bilan.final'
  rapport.suffix     # '.pdf'
  rapport.suffixes   # ['.final', '.pdf']
  rapport.parent     # Path('rapports/2026')
  rapport.with_suffix(".txt")      # rapports/2026/bilan.final.txt
  rapport.with_name("resume.pdf")  # rapports/2026/resume.pdf
  ```

  **Interroger et créer**

  | Méthode | Rôle |
  |---|---|
  | `p.exists()`, `p.is_file()`, `p.is_dir()` | tester |
  | `p.mkdir(parents=True, exist_ok=True)` | créer un dossier et ses parents, sans erreur s'il existe |
  | `p.iterdir()` | les enfants directs d'un dossier |
  | `p.glob("*.csv")`, `p.rglob("*.py")` | chercher, dans le dossier ou récursivement |
  | `p.read_text(encoding="utf-8")`, `p.write_text(texte, encoding="utf-8")` | lire ou écrire tout le fichier |
  | `p.open(...)` | ouvrir, comme `open(p, ...)` |
  | `p.unlink()`, `p.rename(cible)` | supprimer, renommer |
  | `p.resolve()` | le chemin absolu, liens résolus |
  | `Path.home()`, `Path.cwd()` | le dossier personnel, le dossier courant |

  `open`, `os` et `shutil` acceptent directement un `Path`. `Path("x.txt")` ne crée rien : c'est un simple chemin,
  qui peut ne pas exister.

  **Les pièges**

  - Un morceau absolu remplace tout ce qui précède : `Path("/srv/app") / "/etc/passwd"` vaut `/etc/passwd`.
    Attention avec un nom de fichier venu d'un utilisateur.
  - `Path("~/notes")` ne remplace pas `~` : il faut `.expanduser()`.
  - `suffix` ne donne que la dernière extension : `.gz` pour `archive.tar.gz`.

  Un `Path` s'adapte au système (`/` ou `\`). `PurePosixPath` et `PureWindowsPath` calculent sur des chemins d'un
  autre système, sans toucher au disque.

  **En entretien** : « Je manipule les chemins avec `pathlib` : l'opérateur `/` pour assembler, `name`, `stem`,
  `suffix` et `parent` pour décomposer, `read_text` et `write_text` pour les petits fichiers, `glob` pour chercher.
  C'est plus lisible que `os.path`, et `open` accepte un `Path`. »
tour:
  - title: "pathlib : des chemins en objets"
    text: |-
      Un `Path` est un chemin, pas une chaîne. L'opérateur `/` assemble les morceaux, avec le bon séparateur.
      `name`, `stem`, `suffix` et `parent` le décomposent, et `with_suffix` en fabrique un autre.

      Un `Path` peut aussi agir sur le disque : `mkdir` crée un dossier, `write_text` et `read_text` écrivent et
      lisent tout un fichier, `iterdir` liste un dossier, `exists` et `is_file` testent.

      Essaie : remplace `"bilan.pdf"` par `"archive.tar.gz"`, et regarde ce que valent `stem` et `suffix`.
    example:
      files:
        main.py: |-
          import tempfile
          from pathlib import Path

          p = Path("rapports") / "2026" / "bilan.pdf"
          print(p)
          print(p.name, p.stem, p.suffix)
          print(p.parent)
          print(p.with_suffix(".txt"))

          dossier = Path(tempfile.mkdtemp())
          (dossier / "notes").mkdir()
          fichier = dossier / "notes" / "idee.txt"
          fichier.write_text("apprendre pathlib\n", encoding="utf-8")
          print(fichier.exists(), fichier.is_file())
          print(fichier.read_text(encoding="utf-8").strip())
          print([enfant.name for enfant in (dossier / "notes").iterdir()])
      output: |-
        rapports/2026/bilan.pdf
        bilan.pdf bilan .pdf
        rapports/2026
        rapports/2026/bilan.txt
        True True
        apprendre pathlib
        ['idee.txt']
cards:
  - key: assembler
    format: course
    question: "Comment construis-tu le chemin `donnees/2026/ventes.csv` avec pathlib ?"
    choices:
      - {text: "`Path(\"donnees\") / \"2026\" / \"ventes.csv\"`", correct: true}
      - {text: "`Path(\"donnees\") + \"2026\" + \"ventes.csv\"`", correct: false}
      - {text: "`Path.join(\"donnees\", \"2026\", \"ventes.csv\")`", correct: false}
      - {text: "`Path(\"donnees\").add(\"2026\", \"ventes.csv\")`", correct: false}
    answer: "L'opérateur `/` assemble les morceaux avec le séparateur du système. `Path(\"donnees\", \"2026\", \"ventes.csv\")` marche aussi."
  - key: avantage
    format: course
    question: "Quel avantage `pathlib` a-t-il sur les fonctions de `os.path` ?"
    choices:
      - {text: "Un objet chemin, avec ses méthodes et l'opérateur `/`", correct: true}
      - {text: "Il est le seul module à fonctionner sous Windows", correct: false}
      - {text: "Il lit le contenu des fichiers bien plus vite", correct: false}
      - {text: "Il vérifie les droits d'accès à chaque opération", correct: false}
    answer: "`p.parent / \"x\"` se lit mieux que `os.path.join(os.path.dirname(p), \"x\")`, et l'objet regroupe test, lecture et parcours. Les deux modules marchent partout."
  - key: mkdir-parents
    format: course
    question: Comment crées-tu un dossier et ses parents, sans erreur s'il existe déjà ?
    choices:
      - {text: "`p.mkdir(parents=True, exist_ok=True)`", correct: true}
      - {text: "`p.mkdir(recursive=True)`", correct: false}
      - {text: "`p.makedirs()`", correct: false}
      - {text: "`p.create(force=True)`", correct: false}
    answer: "`parents=True` crée les dossiers intermédiaires, `exist_ok=True` ignore un dossier déjà là. C'est l'équivalent de `os.makedirs(p, exist_ok=True)`."
  - key: rglob
    format: course
    question: Comment lister tous les fichiers `.py` d'un dossier et de ses sous-dossiers ?
    choices:
      - {text: "`p.rglob(\"*.py\")`", correct: true}
      - {text: "`p.glob(\"*.py\")`", correct: false}
      - {text: "`p.iterdir(\"*.py\")`", correct: false}
      - {text: "`p.find(\"*.py\")`", correct: false}
    answer: "`rglob` cherche récursivement ; `glob(\"*.py\")` reste dans le dossier, sauf avec le motif `\"**/*.py\"`. Les deux renvoient un générateur de `Path`."
  - key: vf-read-text
    format: true-false
    question: "`Path.read_text()` ouvre le fichier, lit tout son contenu, puis le referme."
    truth: true
    answer: "Pratique pour un petit fichier ; on lui passe `encoding=\"utf-8\"`. Pour un gros fichier, on l'ouvre et on le lit ligne par ligne."
  - key: vf-suffix-double
    format: true-false
    question: "Pour `Path(\"archive.tar.gz\")`, `suffix` vaut `\".tar.gz\"`."
    truth: false
    answer: "`suffix` vaut `\".gz\"`, la dernière extension ; `suffixes` vaut `['.tar', '.gz']`, et `stem` vaut `\"archive.tar\"`."
  - key: vf-open-path
    format: true-false
    question: "La fonction `open` accepte directement un objet `Path`."
    truth: true
    answer: "Comme `os`, `shutil` et la plupart des bibliothèques : pas besoin de `str(p)`. On peut aussi écrire `p.open(...)`."
  - key: vf-cree-fichier
    format: true-false
    question: "`Path(\"x.txt\")` crée le fichier `x.txt` s'il n'existe pas."
    truth: false
    answer: "Un `Path` n'est qu'un chemin, rien n'est créé. Pour créer un fichier vide : `p.touch()`."
  - key: qcm-stem
    format: multiple-choice
    question: "Quel attribut vaut `rapport` pour `Path(\"docs/rapport.pdf\")` ?"
    choices:
      - {text: "`stem`", correct: true}
      - {text: "`name`", correct: false}
      - {text: "`suffix`", correct: false}
      - {text: "`parent`", correct: false}
    answer: "`stem` : le nom sans extension. `name` vaut `rapport.pdf`, `suffix` `.pdf`, `parent` `docs`."
  - key: qcm-is-dir
    format: multiple-choice
    question: Comment tester qu'un chemin désigne un dossier existant ?
    choices:
      - {text: "`p.is_dir()`", correct: true}
      - {text: "`p.exists()`", correct: false}
      - {text: "`p.isdir`", correct: false}
      - {text: "`p.type == \"dir\"`", correct: false}
    answer: "`exists()` est vrai aussi pour un fichier. `is_dir()` renvoie `False` si le chemin n'existe pas, ou si c'est un fichier."
  - key: qcm-home
    format: multiple-choice
    question: Quelle méthode donne le dossier personnel de l'utilisateur ?
    choices:
      - {text: "`Path.home()`", correct: true}
      - {text: "`Path.cwd()`", correct: false}
      - {text: "`Path.user()`", correct: false}
      - {text: "`Path(\"~\")`", correct: false}
    answer: "`Path.cwd()` donne le dossier courant. `Path(\"~\")` garde le tilde tel quel : il faudrait `.expanduser()`."
  - key: qcm-write-text
    format: multiple-choice
    question: "Quelle ligne écrit le texte `\"ok\"` dans le fichier `p`, en UTF-8 ?"
    choices:
      - {text: "`p.write_text(\"ok\", encoding=\"utf-8\")`", correct: true}
      - {text: "`p.write(\"ok\", encoding=\"utf-8\")`", correct: false}
      - {text: "`p.text = \"ok\"`", correct: false}
      - {text: "`p.save(\"ok\", \"utf-8\")`", correct: false}
    answer: "`write_text` ouvre, écrit, ferme, et renvoie le nombre de caractères écrits. Le fichier est créé, ou remplacé."
  - key: trous-import-path
    format: fill-in
    question: |-
      Complète l'import :
      ```python
      from ___ import Path
      ```
    blanks: [[pathlib]]
    answer: "`Path` vient du module `pathlib` de la bibliothèque standard."
  - key: trous-operateur
    format: fill-in
    question: |-
      Complète pour assembler le chemin :
      ```python
      chemin = Path("donnees") ___ "ventes.csv"
      ```
    blanks: [["/"]]
    answer: "L'opérateur `/` assemble un `Path` et une chaîne."
  - key: trous-iterdir
    format: fill-in
    question: |-
      Complète pour afficher le nom de chaque élément du dossier :
      ```python
      for enfant in dossier.___():
          print(enfant.name)
      ```
    blanks: [[iterdir]]
    answer: "`iterdir()` donne les enfants directs du dossier, dans un ordre quelconque."
  - key: trous-suffix
    format: fill-in
    question: |-
      Complète pour ne traiter que les fichiers CSV :
      ```python
      if p.___ == ".csv":
          traiter(p)
      ```
    blanks: [[suffix]]
    answer: "`suffix` : la dernière extension, avec son point."
  - key: code-decomposer
    format: code-output
    question: |-
      ```python
      from pathlib import Path

      p = Path("rapports/2026/bilan.final.pdf")
      print(p.name, p.stem, p.suffix)
      ```
    answer: "`bilan.final.pdf bilan.final .pdf` : `stem` retire seulement la dernière extension."
    check:
      output: bilan.final.pdf bilan.final .pdf
    choices:
      - {text: "`bilan.final.pdf bilan.final .pdf`", correct: true}
      - {text: "`bilan.final.pdf bilan .final.pdf`", correct: false}
      - {text: "`bilan.final.pdf bilan .pdf`", correct: false}
      - {text: "`rapports/2026/bilan.final.pdf bilan.final pdf`", correct: false}
  - key: code-parent
    format: code-output
    question: |-
      ```python
      from pathlib import Path

      p = Path("/srv/app/config.toml")
      print(p.parent, p.parent.parent.name)
      ```
    answer: "`/srv/app srv` : `parent` remonte d'un niveau ; le parent de `/srv/app` est `/srv`, dont le nom est `srv`."
    check:
      output: /srv/app srv
    choices:
      - {text: "`/srv/app srv`", correct: true}
      - {text: "`/srv/app app`", correct: false}
      - {text: "`app srv`", correct: false}
      - {text: "`/srv /`", correct: false}
  - key: code-with-suffix
    format: code-output
    question: |-
      ```python
      from pathlib import Path

      p = Path("photos/vacances.jpeg")
      print(p.with_suffix(".png"), p.with_name("plage.jpeg").name)
      ```
    answer: "`photos/vacances.png plage.jpeg` : `with_suffix` change l'extension, `with_name` tout le dernier élément ; `p` reste inchangé."
    check:
      output: photos/vacances.png plage.jpeg
    choices:
      - {text: "`photos/vacances.png plage.jpeg`", correct: true}
      - {text: "`photos/vacances.jpeg.png plage.jpeg`", correct: false}
      - {text: "`vacances.png photos/plage.jpeg`", correct: false}
      - {text: "`photos/vacances.png plage`", correct: false}
  - key: code-morceau-absolu
    format: code-output
    question: |-
      ```python
      from pathlib import Path

      print(Path("/srv/app") / "/etc/passwd")
      ```
    answer: "`/etc/passwd` : un morceau absolu remplace tout ce qui précède. Un nom de fichier venu d'un utilisateur doit être vérifié avant d'être assemblé."
    check:
      output: /etc/passwd
    choices:
      - {text: "`/etc/passwd`", correct: true}
      - {text: "`/srv/app/etc/passwd`", correct: false}
      - {text: "`/srv/app//etc/passwd`", correct: false}
      - {text: "Une `ValueError` : chemin absolu refusé", correct: false}
