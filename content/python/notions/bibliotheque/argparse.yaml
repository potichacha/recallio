notion: argparse
lesson: |-
  `argparse` transforme `sys.argv` en arguments nommés, typés et vérifiés, et produit l'aide (`-h`) tout seul.

  ```python
  import argparse

  parser = argparse.ArgumentParser(description="Convertit des fichiers")
  parser.add_argument("fichiers", nargs="+", help="les fichiers à convertir")      # positionnel, obligatoire
  parser.add_argument("--format", choices=["json", "csv"], default="json")
  parser.add_argument("--port", type=int, default=8000)
  parser.add_argument("-v", "--verbose", action="store_true")
  parser.add_argument("--dry-run", action="store_true")

  args = parser.parse_args()          # lit sys.argv[1:]
  print(args.fichiers, args.format, args.port, args.verbose, args.dry_run)
  ```

  ```bash
  python outil.py a.txt b.txt --format csv -v
  ```

  | Paramètre | Effet |
  |---|---|
  | `"nom"` | un argument **positionnel**, obligatoire |
  | `"--nom"`, `"-n", "--nom"` | une **option**, facultative ; la forme courte en premier |
  | `type=int` | convertit la valeur, et refuse ce qui ne se convertit pas |
  | `default=...` | la valeur si l'option est absente (`None` sinon) |
  | `choices=[...]` | les valeurs permises |
  | `action="store_true"` | un drapeau : `True` s'il est présent, `False` sinon |
  | `nargs="+"`, `nargs="*"` | une ou plusieurs valeurs, zéro ou plusieurs |
  | `required=True` | une option obligatoire |

  - `parse_args` renvoie un `Namespace` : les tirets deviennent des soulignés (`--dry-run` donne `args.dry_run`).
  - Sans `type`, toute valeur est une **chaîne**.
  - Une erreur (argument manquant, valeur refusée) affiche l'usage et le message, puis **termine le programme avec le
    code 2** : `outil: error: the following arguments are required: fichiers`.
  - Pour tester, on passe la liste : `parser.parse_args(["a.txt", "--port", "9000"])`.
  - Des sous-commandes, comme `git commit`, se déclarent avec `add_subparsers`.

  Click (des décorateurs) et Typer (les annotations des fonctions) sont des bibliothèques tierces plus concises ;
  `argparse` a l'avantage d'être toujours là.

  **En entretien** : « `argparse` déclare les arguments positionnels et les options, avec `type`, `default`,
  `choices` et `action="store_true"`, et génère l'aide. `parse_args` renvoie un `Namespace`, ou termine le programme
  avec le code 2 sur une entrée invalide. Pour tester, je lui passe une liste d'arguments. »
cards:
  - key: store-true
    format: course
    question: "Que fait `action=\"store_true\"` pour l'option `--verbose` ?"
    choices:
      - {text: "`args.verbose` vaut `True` si l'option est donnée, `False` sinon", correct: true}
      - {text: "L'option attend une valeur, `true` ou `false`, après elle", correct: false}
      - {text: "L'option devient obligatoire sur la ligne de commande", correct: false}
      - {text: "La valeur passée après l'option est rangée telle quelle", correct: false}
    answer: "C'est un drapeau : il ne prend pas de valeur. `store_false` fait l'inverse, et `action=\"count\"` compte les répétitions (`-vvv`)."
  - key: type-int
    format: course
    question: "Que fait `type=int` dans `add_argument(\"--port\", type=int)` ?"
    choices:
      - {text: "Il convertit la valeur, et refuse ce qui n'est pas un entier", correct: true}
      - {text: "Il documente le type dans l'aide, sans rien convertir", correct: false}
      - {text: "Il exige seulement que la valeur par défaut soit un entier", correct: false}
      - {text: "Il convertit la valeur, mais laisse passer le texte invalide", correct: false}
    answer: "`--port abc` produit « argument --port: invalid int value: 'abc' » et termine le programme. Sans `type`, `args.port` serait la chaîne `\"8080\"`."
  - key: erreur-code-2
    format: course
    question: Que fait `parse_args` quand un argument obligatoire manque ?
    choices:
      - {text: "Il affiche l'usage et l'erreur, puis termine le programme avec le code 2", correct: true}
      - {text: "Il lève une `ValueError`, que le programme doit rattraper lui-même", correct: false}
      - {text: "Il met `None` dans l'attribut correspondant, et continue", correct: false}
      - {text: "Il demande la valeur manquante à l'utilisateur, au clavier", correct: false}
    answer: "« error: the following arguments are required: fichier », sur la sortie d'erreur, puis `SystemExit(2)`. Le code 2 signale, par convention, une mauvaise utilisation."
  - key: tester-parser
    format: course
    question: Comment tester un analyseur `argparse` sans passer par la ligne de commande ?
    choices:
      - {text: "`parser.parse_args([\"--port\", \"8080\"])`", correct: true}
      - {text: "En remplissant `os.environ[\"ARGV\"]`", correct: false}
      - {text: "`parser.test(\"--port 8080\")`", correct: false}
      - {text: "C'est impossible sans lancer le script", correct: false}
    answer: "`parse_args` accepte une liste d'arguments ; sans elle, il lit `sys.argv[1:]`. Une erreur lève `SystemExit`, qu'on vérifie avec `pytest.raises(SystemExit)`."
  - key: vf-aide-auto
    format: true-false
    question: "argparse ajoute automatiquement l'option `-h`/`--help`."
    truth: true
    answer: "L'aide est construite à partir des `add_argument` et de leurs `help=`. `add_help=False` la désactive."
  - key: vf-positionnel-obligatoire
    format: true-false
    question: "Un argument positionnel, déclaré par `add_argument(\"fichier\")`, est obligatoire par défaut."
    truth: true
    answer: "Les options (`--x`) sont facultatives, les positionnels obligatoires. `nargs=\"?\"` rend un positionnel facultatif."
  - key: vf-tirets
    format: true-false
    question: "L'option `--dry-run` se lit dans `args.dry-run`."
    truth: false
    answer: "Un tiret n'est pas permis dans un nom d'attribut : argparse le remplace par un souligné, `args.dry_run`. `dest=` choisit un autre nom."
  - key: vf-conversion-auto
    format: true-false
    question: "Sans `type=`, une valeur d'option qui ressemble à un nombre arrive convertie en nombre."
    truth: false
    answer: "Elle arrive en chaîne : `\"8080\"`. Il faut `type=int` (ou `float`, ou toute fonction de conversion)."
  - key: qcm-choices
    format: multiple-choice
    question: "Comment limiter `--format` aux valeurs `json` et `csv` ?"
    choices:
      - {text: "`choices=[\"json\", \"csv\"]`", correct: true}
      - {text: "`values=[\"json\", \"csv\"]`", correct: false}
      - {text: "`type=[\"json\", \"csv\"]`", correct: false}
      - {text: "`allowed=(\"json\", \"csv\")`", correct: false}
    answer: "Une autre valeur est refusée avec un message qui liste les choix permis, et les choix apparaissent dans l'aide."
  - key: qcm-nargs
    format: multiple-choice
    question: Comment accepter un ou plusieurs fichiers en argument positionnel ?
    choices:
      - {text: "`nargs=\"+\"`", correct: true}
      - {text: "`nargs=\"*\"`", correct: false}
      - {text: "`multiple=True`", correct: false}
      - {text: "`action=\"append\"`", correct: false}
    answer: "`+` : au moins un, rangés dans une liste. `*` en accepte zéro ; `action=\"append\"` sert à une option répétée (`--tag a --tag b`)."
  - key: qcm-forme-courte
    format: multiple-choice
    question: "Comment déclarer `-v` comme forme courte de `--verbose` ?"
    choices:
      - {text: "`add_argument(\"-v\", \"--verbose\", action=\"store_true\")`", correct: true}
      - {text: "`add_argument(\"--verbose\", short=\"v\")`", correct: false}
      - {text: "`add_argument(\"--verbose|-v\")`", correct: false}
      - {text: "`add_argument(\"--verbose\", alias=\"-v\")`", correct: false}
    answer: "On donne les deux noms ; l'attribut prend le nom long, `args.verbose`."
  - key: qcm-typer
    format: multiple-choice
    question: Quelle bibliothèque tierce construit une interface en ligne de commande à partir des annotations des fonctions ?
    choices:
      - {text: "Typer", correct: true}
      - {text: "Click", correct: false}
      - {text: "Requests", correct: false}
      - {text: "Rich", correct: false}
    answer: "Typer lit les paramètres et leurs annotations (`def main(port: int = 8000)`). Click, sur lequel il repose, utilise des décorateurs ; Rich met en forme la sortie du terminal."
  - key: trous-parser
    format: fill-in
    question: |-
      Complète la création de l'analyseur :
      ```python
      parser = argparse.___(description="Convertit des fichiers")
      ```
    blanks: [[ArgumentParser]]
    answer: "`argparse.ArgumentParser` ; `description` apparaît dans l'aide."
  - key: trous-add-argument
    format: fill-in
    question: |-
      Complète pour déclarer l'argument positionnel `fichier` :
      ```python
      parser.___("fichier")
      ```
    blanks: [[add_argument]]
    answer: "`add_argument` déclare chaque argument ou option."
  - key: trous-parse-args
    format: fill-in
    question: |-
      Complète pour lire les arguments de la ligne de commande :
      ```python
      args = parser.___()
      ```
    blanks: [[parse_args]]
    answer: "`parse_args()` lit `sys.argv[1:]` et renvoie un `Namespace`."
  - key: trous-default
    format: fill-in
    question: |-
      Complète pour que le port vaille 8000 si l'option est absente :
      ```python
      parser.add_argument("--port", type=int, ___=8000)
      ```
    blanks: [[default]]
    answer: "`default=8000` ; sans lui, une option absente vaut `None`."
