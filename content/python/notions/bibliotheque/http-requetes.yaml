notion: http-requetes
lesson: |-
  **Avec la bibliothèque standard** : `urllib.request`. Suffisant pour un petit script sans dépendance.

  ```python
  import json
  from urllib.error import HTTPError
  from urllib.parse import urlencode
  from urllib.request import Request, urlopen

  url = "https://api.exemple.fr/livres?" + urlencode({"q": "café", "page": 2})   # q=caf%C3%A9&page=2
  requete = Request(url, headers={"Accept": "application/json"})
  try:
      with urlopen(requete, timeout=10) as reponse:
          donnees = json.load(reponse)
  except HTTPError as erreur:          # 404, 500... lèvent une exception
      print(erreur.code)
  ```

  **Avec `requests`** (bibliothèque tierce, `pip install requests`) : l'API la plus répandue.

  ```python
  import requests

  reponse = requests.get(
      "https://api.exemple.fr/livres",
      params={"q": "café", "page": 2},   # la chaîne de requête, encodée pour toi
      headers={"Authorization": f"Bearer {jeton}"},
      timeout=10,                        # pas de délai par défaut : toujours en donner un
  )
  reponse.raise_for_status()             # HTTPError si le statut est 4xx ou 5xx
  livres = reponse.json()

  requests.post(url, json={"titre": "Dune"}, timeout=10)   # corps JSON et Content-Type ajoutés
  ```

  | | `urllib.request` | `requests` |
  |---|---|---|
  | installation | aucune | `pip install requests` |
  | statut d'erreur (404, 500) | lève `HTTPError` | ne lève rien : `raise_for_status()` |
  | JSON | `json.load(reponse)` | `reponse.json()`, `json=` |
  | paramètres | `urlencode` à la main | `params=` |

  **Les bonnes pratiques**

  - **Toujours un `timeout`** : sans lui, `requests` peut attendre indéfiniment un serveur muet, et bloquer le
    programme.
  - **Vérifier le statut** (`raise_for_status`) avant de lire le corps : un 500 peut renvoyer un JSON d'erreur.
  - **Une `Session`** pour de nombreux appels au même serveur : elle réutilise les connexions et garde en-têtes et
    cookies.
  - Des **réessais limités**, avec un délai croissant, pour les erreurs passagères.
  - En test, on remplace le réseau par un faux (`unittest.mock`, ou la bibliothèque responses).

  **httpx** offre une API proche de `requests`, en synchrone et en asynchrone (`async with httpx.AsyncClient()`), avec
  HTTP/2 ; aiohttp est l'autre choix courant en asynchrone.

  **En entretien** : « Pour un script sans dépendance, `urllib.request` ; sinon `requests`, ou httpx pour de
  l'asynchrone. Je mets toujours un `timeout`, j'appelle `raise_for_status()` avant de lire le corps, et j'utilise une
  `Session` pour des appels répétés. En test, le réseau est remplacé par un faux. »
cards:
  - key: sans-timeout
    format: course
    question: "Que risque `requests.get(url)`, appelé sans `timeout` ?"
    choices:
      - {text: "D'attendre indéfiniment : il n'y a pas de délai par défaut", correct: true}
      - {text: "D'abandonner après 30 secondes, le délai par défaut", correct: false}
      - {text: "Une erreur immédiate : `timeout` est obligatoire", correct: false}
      - {text: "Trois réessais automatiques avant d'abandonner", correct: false}
    answer: "Un serveur qui accepte la connexion sans répondre bloque le programme pour toujours. `timeout=10` (ou un tuple connexion, lecture) borne l'attente."
  - key: raise-for-status
    format: course
    question: "Que fait `reponse.raise_for_status()` ?"
    choices:
      - {text: "Il lève une `HTTPError` si le statut est une erreur, 4xx ou 5xx", correct: true}
      - {text: "Il affiche le statut HTTP de la réponse sur la console", correct: false}
      - {text: "Il renvoie `True` si le statut de la réponse vaut 200", correct: false}
      - {text: "Il relance la requête quand le serveur répond une erreur", correct: false}
    answer: "`requests` ne lève rien pour un 404 ou un 500 : c'est à toi de le demander. Sans erreur, la méthode ne fait rien."
  - key: urllib-standard
    format: course
    question: Quel module de la bibliothèque standard envoie une requête HTTP ?
    choices:
      - {text: "`urllib.request`", correct: true}
      - {text: "`requests`", correct: false}
      - {text: "`http.server`", correct: false}
      - {text: "`socketserver`", correct: false}
    answer: "`urllib.request.urlopen` envoie la requête. `requests` est une bibliothèque tierce ; `http.server` fait l'inverse : un petit serveur."
  - key: session
    format: course
    question: "Pourquoi utiliser une `requests.Session` pour de nombreux appels au même serveur ?"
    choices:
      - {text: "Elle réutilise les connexions, et garde en-têtes et cookies d'un appel à l'autre", correct: true}
      - {text: "Elle chiffre les requêtes, qui sinon partiraient en clair sur le réseau", correct: false}
      - {text: "Elle envoie automatiquement les requêtes en parallèle, sur plusieurs fils", correct: false}
      - {text: "Elle met chaque réponse en cache sur le disque, pour la relire plus tard", correct: false}
    answer: "Ouvrir une connexion TCP et TLS coûte cher : la session la garde ouverte. Elle sert aussi à fixer l'authentification une fois pour toutes."
  - key: vf-requests-standard
    format: true-false
    question: "La bibliothèque `requests` fait partie de la bibliothèque standard de Python."
    truth: false
    answer: "Elle s'installe avec pip. La bibliothèque standard propose `urllib.request`, plus verbeux."
  - key: vf-parametre-json
    format: true-false
    question: "`requests.post(url, json=donnees)` encode `donnees` en JSON et ajoute l'en-tête `Content-Type: application/json`."
    truth: true
    answer: "C'est la différence avec `data=`, qui envoie un formulaire encodé (ou des octets bruts)."
  - key: vf-404-requests
    format: true-false
    question: "Par défaut, `requests.get` lève une exception quand le serveur répond 404."
    truth: false
    answer: "La réponse arrive normalement, avec `status_code == 404`. Il faut `raise_for_status()`, ou tester `reponse.ok`."
  - key: vf-404-urllib
    format: true-false
    question: "`urllib.request.urlopen` lève une `HTTPError` quand le serveur répond 404."
    truth: true
    answer: "Contrairement à `requests`, `urlopen` lève `urllib.error.HTTPError` pour un statut d'erreur ; son attribut `code` donne le statut."
  - key: qcm-params
    format: multiple-choice
    question: "Comment envoyer la chaîne de requête `?q=python&page=2` avec requests ?"
    choices:
      - {text: "`requests.get(url, params={\"q\": \"python\", \"page\": 2})`", correct: true}
      - {text: "`requests.get(url, data={\"q\": \"python\", \"page\": 2})`", correct: false}
      - {text: "`requests.get(url, query={\"q\": \"python\", \"page\": 2})`", correct: false}
      - {text: "`requests.get(url + {\"q\": \"python\", \"page\": 2})`", correct: false}
    answer: "`params` construit et encode la chaîne de requête. `data` mettrait les valeurs dans le corps de la requête."
  - key: qcm-lire-json
    format: multiple-choice
    question: Comment lire le corps JSON d'une réponse de requests ?
    choices:
      - {text: "`reponse.json()`", correct: true}
      - {text: "`json.loads(reponse)`", correct: false}
      - {text: "`reponse.body`", correct: false}
      - {text: "`reponse.data()`", correct: false}
    answer: "`json()` décode le corps ; `reponse.text` donne le texte brut, `reponse.content` les octets."
  - key: qcm-asynchrone
    format: multiple-choice
    question: Quelle bibliothèque tierce propose une API proche de requests, en synchrone comme en asynchrone ?
    choices:
      - {text: "httpx", correct: true}
      - {text: "urllib3", correct: false}
      - {text: "Flask", correct: false}
      - {text: "pip", correct: false}
    answer: "httpx a `httpx.get` et `httpx.AsyncClient`. urllib3 est la couche bas niveau sur laquelle repose requests ; Flask est un framework web."
  - key: qcm-urlencode
    format: multiple-choice
    question: "Quelle fonction de `urllib.parse` construit `q=caf%C3%A9&page=2` à partir d'un dictionnaire ?"
    choices:
      - {text: "`urlencode`", correct: true}
      - {text: "`quote`", correct: false}
      - {text: "`urljoin`", correct: false}
      - {text: "`urlsplit`", correct: false}
    answer: "`urlencode` encode chaque paire. `quote` encode une seule chaîne (`café` en `caf%C3%A9`), `urljoin` assemble des URL."
  - key: sc-api-lente
    format: scenario
    question: Ton service appelle une API externe qui ralentit parfois, et tous tes workers finissent bloqués. Que fais-tu ?
    choices:
      - {text: "Fixer un `timeout` à chaque appel, et prévoir des réessais limités", correct: true}
      - {text: "Augmenter le nombre de workers jusqu'à ce que tout passe", correct: false}
      - {text: "Remplacer `requests` par `urllib`, plus rapide à répondre", correct: false}
      - {text: "Rappeler l'API en boucle, sans fin, jusqu'au succès", correct: false}
    answer: "Sans délai, chaque appel lent bloque un worker. Avec un `timeout` et quelques réessais espacés, le service reste réactif et peut répondre une erreur propre."
  - key: sc-script-sans-dependance
    format: scenario
    question: Ton petit script d'administration, qui appelle une API JSON, doit tourner sur des serveurs sans accès à PyPI. Que choisis-tu ?
    choices:
      - {text: "`urllib.request` et `json`, de la bibliothèque standard", correct: true}
      - {text: "`requests`, recopié à la main sur chaque serveur", correct: false}
      - {text: "`curl` via `os.system`, puis la sortie découpée avec `split`", correct: false}
      - {text: "`http.server`, qui sait aussi envoyer des requêtes", correct: false}
    answer: "La bibliothèque standard suffit pour quelques appels : `urlopen` avec un `timeout`, et `json.load` sur la réponse. Pas de dépendance à installer ni à maintenir."
  - key: sc-erreur-enregistree
    format: scenario
    question: "Un script enregistre `reponse.json()` sans vérifier le statut ; un jour, il enregistre le message d'erreur de l'API comme si c'étaient des données. Que corriges-tu ?"
    choices:
      - {text: "Appeler `raise_for_status()` avant de lire le corps", correct: true}
      - {text: "Entourer `reponse.json()` d'un `try` qui ignore tout", correct: false}
      - {text: "Relancer la requête jusqu'à obtenir un corps non vide", correct: false}
      - {text: "Vérifier que le corps contient plus de dix caractères", correct: false}
    answer: "Une API renvoie souvent un JSON d'erreur avec un statut 4xx ou 5xx. On vérifie le statut d'abord ; l'exception arrête le traitement au lieu d'enregistrer des données fausses."
  - key: sc-tester-sans-reseau
    format: scenario
    question: Comment tester une fonction qui appelle une API HTTP, sans dépendre du réseau ?
    choices:
      - {text: "Remplacer l'appel réseau par un faux, avec `unittest.mock`", correct: true}
      - {text: "Appeler la vraie API, en espérant qu'elle réponde", correct: false}
      - {text: "Désactiver tous les tests qui touchent au réseau", correct: false}
      - {text: "Lancer les tests la nuit, quand l'API est peu chargée", correct: false}
    answer: "Un faux client (mock, ou une bibliothèque comme responses ou respx) rend le test rapide, reproductible, et permet de simuler les erreurs : 404, 500, délai dépassé."
