notion: dates
lesson: |-
  Le module `datetime` fournit quatre types principaux, tous **immuables** :

  | Type | Exemple | Contient |
  |---|---|---|
  | `date` | `date(2026, 11, 17)` | une date |
  | `time` | `time(8, 30)` | une heure |
  | `datetime` | `datetime(2026, 11, 17, 8, 30)` | une date et une heure |
  | `timedelta` | `timedelta(days=2, hours=3)` | une durée |

  ```python
  from datetime import date, datetime, timedelta, timezone
  from zoneinfo import ZoneInfo

  noel = date(2026, 12, 25)
  (noel - date(2026, 11, 17)).days           # 38 : date - date donne un timedelta
  datetime(2026, 2, 27, 22, 0) + timedelta(hours=30)   # 2026-03-01 04:00:00

  d = datetime(2026, 11, 17, 8, 30)
  d.strftime("%d/%m/%Y %H:%M")               # '17/11/2026 08:30' : vers du texte
  datetime.strptime("17/11/2026", "%d/%m/%Y")   # depuis du texte, au format donné
  d.isoformat()                              # '2026-11-17T08:30:00'
  datetime.fromisoformat("2026-11-17T08:30:00+02:00")
  d.replace(hour=9)                          # un nouvel objet
  d.weekday()                                # 1 : lundi vaut 0 (isoweekday : lundi vaut 1)
  ```

  Dans les formats, `%m` est le **mois** et `%M` les **minutes** ; `%Y` l'année sur quatre chiffres, `%y` sur deux.

  **Naïf ou avec fuseau.** Un `datetime` sans `tzinfo` est **naïf** : il ne désigne pas un instant précis. Avec un
  fuseau, il est **conscient** (*aware*). Comparer ou soustraire un naïf et un conscient lève « TypeError: can't
  compare offset-naive and offset-aware datetimes ».

  ```python
  maintenant = datetime.now(timezone.utc)    # l'instant présent, en UTC
  paris = ZoneInfo("Europe/Paris")           # la base des fuseaux (IANA), depuis Python 3.9
  maintenant.astimezone(paris)               # le même instant, à l'heure de Paris
  ```

  `datetime.utcnow()` est déprécié (3.12) : il renvoie un `datetime` naïf. Un `ZoneInfo` connaît les changements
  d'heure : `datetime(2026, 3, 28, 12, tzinfo=paris) + timedelta(days=1)` donne midi le lendemain, en `+02:00`. Un
  décalage fixe, `timezone(timedelta(hours=1))`, ne les connaît pas. Sous Windows, `ZoneInfo` demande le paquet
  `tzdata`.

  **`timedelta`** ne connaît que les jours, secondes et microsecondes : pas de mois (leur durée varie) ; on calcule
  avec `replace`, ou avec `relativedelta` de la bibliothèque tierce dateutil. `duree.seconds` n'est que la part des
  secondes **hors jours** : la durée totale, c'est `duree.total_seconds()`.

  **Bonne pratique** : on stocke et on calcule en UTC, avec des `datetime` conscients ; on convertit dans le fuseau de
  l'utilisateur à l'affichage.

  **En entretien** : « Je travaille avec des `datetime` conscients, en UTC (`datetime.now(timezone.utc)`), et je
  convertis avec `zoneinfo` pour l'affichage ; un naïf et un conscient ne se comparent pas. `timedelta` n'a pas de
  mois, et `total_seconds()` donne la durée totale. `strftime` formate, `strptime` lit, et `%m` n'est pas `%M`. »
cards:
  - key: datetime-naif
    format: course
    question: "Qu'est-ce qu'un `datetime` « naïf » ?"
    choices:
      - {text: "Un `datetime` sans fuseau horaire : son `tzinfo` vaut `None`", correct: true}
      - {text: "Un `datetime` sans heure, qui ne contient qu'une date", correct: false}
      - {text: "Un `datetime` créé par `now()` plutôt qu'écrit à la main", correct: false}
      - {text: "Un `datetime` dont les secondes et microsecondes valent zéro", correct: false}
    answer: "Un naïf ne dit pas de quel fuseau il parle : « 8 h 30 », mais où ? Un `datetime` conscient porte son fuseau et désigne un instant précis."
  - key: maintenant-utc
    format: course
    question: Comment obtenir l'instant présent, avec son fuseau, en UTC ?
    choices:
      - {text: "`datetime.now(timezone.utc)`", correct: true}
      - {text: "`datetime.utcnow()`", correct: false}
      - {text: "`datetime.now().utc()`", correct: false}
      - {text: "`time.now(\"UTC\")`", correct: false}
    answer: "`now(timezone.utc)` renvoie un `datetime` conscient. `utcnow()` renvoie l'heure UTC sans fuseau, un naïf trompeur : il est déprécié depuis 3.12."
  - key: module-zoneinfo
    format: course
    question: "Quel module de la bibliothèque standard fournit les fuseaux nommés, comme `Europe/Paris` ?"
    choices:
      - {text: "`zoneinfo`", correct: true}
      - {text: "`pytz`", correct: false}
      - {text: "`timezone`", correct: false}
      - {text: "`locale`", correct: false}
    answer: "`zoneinfo.ZoneInfo` (Python 3.9) lit la base IANA du système, ou le paquet `tzdata`. `pytz` est une ancienne bibliothèque tierce ; `datetime.timezone` ne gère que des décalages fixes."
  - key: stocker-instants
    format: course
    question: Comment stocker des instants dans une base de données ?
    choices:
      - {text: "En UTC, et convertir dans le fuseau de l'utilisateur à l'affichage", correct: true}
      - {text: "Dans l'heure locale du serveur, plus simple à relire", correct: false}
      - {text: "Sous forme de chaînes au format `JJ/MM/AAAA HH:MM`", correct: false}
      - {text: "Dans le fuseau de l'utilisateur qui les a créés", correct: false}
    answer: "UTC n'a pas de changement d'heure, et tous les instants se comparent directement. L'heure locale du serveur change avec son déploiement et son heure d'été."
  - key: vf-timedelta-mois
    format: true-false
    question: "`timedelta` accepte un nombre de mois, comme `timedelta(months=1)`."
    truth: false
    answer: "« TypeError: __new__() got an unexpected keyword argument 'months' » : un mois n'a pas de durée fixe. On passe par `replace`, ou `relativedelta` de dateutil."
  - key: vf-naif-conscient
    format: true-false
    question: "`naif < conscient` lève une `TypeError` quand un seul des deux `datetime` a un fuseau."
    truth: true
    answer: "« can't compare offset-naive and offset-aware datetimes ». L'égalité `==`, elle, renvoie simplement `False`."
  - key: vf-immuable
    format: true-false
    question: "Un objet `datetime` est immuable : `replace` renvoie un nouvel objet."
    truth: true
    answer: "`d.replace(hour=9)` ne modifie pas `d`. Les `datetime` peuvent donc servir de clés de dictionnaire."
  - key: vf-weekday-lundi
    format: true-false
    question: "`date.weekday()` renvoie 1 pour un lundi."
    truth: false
    answer: "`weekday()` compte à partir de 0 pour lundi ; `isoweekday()` compte à partir de 1, selon la norme ISO."
  - key: qcm-lire-iso
    format: multiple-choice
    question: "Quelle méthode lit le texte `\"2026-11-17T08:30:00\"` ?"
    choices:
      - {text: "`datetime.fromisoformat`", correct: true}
      - {text: "`datetime.parse`", correct: false}
      - {text: "`datetime.fromstring`", correct: false}
      - {text: "`datetime.strftime`", correct: false}
    answer: "`fromisoformat` lit le format ISO 8601, décalage compris. `strftime` va dans l'autre sens : d'un `datetime` vers du texte."
  - key: qcm-format-francais
    format: multiple-choice
    question: "Quel format donne `17/11/2026` avec `strftime` ?"
    choices:
      - {text: "`\"%d/%m/%Y\"`", correct: true}
      - {text: "`\"%d/%M/%Y\"`", correct: false}
      - {text: "`\"%D/%m/%y\"`", correct: false}
      - {text: "`\"dd/mm/yyyy\"`", correct: false}
    answer: "`%d` le jour, `%m` le mois, `%Y` l'année sur quatre chiffres. `%M` donnerait les minutes ; `dd/mm/yyyy` est la syntaxe de Java."
  - key: qcm-soustraction
    format: multiple-choice
    question: "Quel type obtient-on en soustrayant deux `datetime` ?"
    choices:
      - {text: "`timedelta`", correct: true}
      - {text: "`datetime`", correct: false}
      - {text: "`int`, en secondes", correct: false}
      - {text: "`float`, en jours", correct: false}
    answer: "Une durée, avec `days`, `seconds` et `total_seconds()`. Ajouter un `timedelta` à un `datetime` redonne un `datetime`."
  - key: qcm-heure-ete
    format: multiple-choice
    question: "Pourquoi utiliser `ZoneInfo(\"Europe/Paris\")` plutôt qu'un décalage fixe de `+01:00` ?"
    choices:
      - {text: "Le décalage change à l'heure d'été ; `ZoneInfo` le sait", correct: true}
      - {text: "Un décalage fixe n'est pas accepté par `datetime`", correct: false}
      - {text: "`ZoneInfo` est bien plus rapide à calculer", correct: false}
      - {text: "Un décalage fixe ne s'affiche pas dans `isoformat`", correct: false}
    answer: "Paris est à `+01:00` l'hiver, `+02:00` l'été. Un `timezone(timedelta(hours=1))` se tromperait d'une heure six mois par an."
  - key: trous-timedelta
    format: fill-in
    question: |-
      Complète pour calculer la date de demain :
      ```python
      demain = date.today() + ___(days=1)
      ```
    blanks: [[timedelta]]
    answer: "On ajoute une durée, un `timedelta`."
  - key: trous-strptime
    format: fill-in
    question: |-
      Complète pour lire une date écrite à la française :
      ```python
      d = datetime.___("17/11/2026", "%d/%m/%Y")
      ```
    blanks: [[strptime]]
    answer: "`strptime` : *parse* (lire) ; `strftime` : *format* (écrire)."
  - key: trous-zoneinfo
    format: fill-in
    question: |-
      Complète pour obtenir le fuseau de Paris :
      ```python
      from zoneinfo import ZoneInfo

      paris = ___("Europe/Paris")
      ```
    blanks: [[ZoneInfo]]
    answer: "`ZoneInfo(nom)` prend un nom de la base IANA."
  - key: trous-total-seconds
    format: fill-in
    question: |-
      Complète pour obtenir la durée totale, en secondes :
      ```python
      print(duree.___())
      ```
    blanks: [[total_seconds]]
    answer: "`total_seconds()` compte aussi les jours ; l'attribut `seconds`, non."
  - key: code-jours-avant-noel
    format: code-output
    question: |-
      ```python
      from datetime import date

      print((date(2026, 12, 25) - date(2026, 11, 17)).days)
      ```
    answer: "`38` : 13 jours pour finir novembre, puis 25 en décembre."
    check:
      output: "38"
    choices:
      - {text: "`38`", correct: true}
      - {text: "`39`", correct: false}
      - {text: "`37`", correct: false}
      - {text: "`38 days, 0:00:00`", correct: false}
  - key: code-trente-heures
    format: code-output
    question: |-
      ```python
      from datetime import datetime, timedelta

      print(datetime(2026, 2, 27, 22, 0) + timedelta(hours=30))
      ```
    answer: "`2026-03-01 04:00:00` : 2026 n'est pas bissextile, on passe du 28 février au 1er mars."
    check:
      output: "2026-03-01 04:00:00"
    choices:
      - {text: "`2026-03-01 04:00:00`", correct: true}
      - {text: "`2026-02-29 04:00:00`", correct: false}
      - {text: "`2026-02-28 04:00:00`", correct: false}
      - {text: "`2026-03-02 04:00:00`", correct: false}
  - key: code-astimezone
    format: code-output
    question: |-
      ```python
      from datetime import datetime, timedelta, timezone

      utc = datetime(2026, 11, 17, 12, 0, tzinfo=timezone.utc)
      print(utc.astimezone(timezone(timedelta(hours=1))).isoformat())
      ```
    answer: "`2026-11-17T13:00:00+01:00` : le même instant, exprimé avec un décalage d'une heure."
    check:
      output: "2026-11-17T13:00:00+01:00"
    choices:
      - {text: "`2026-11-17T13:00:00+01:00`", correct: true}
      - {text: "`2026-11-17T12:00:00+01:00`", correct: false}
      - {text: "`2026-11-17T11:00:00+01:00`", correct: false}
      - {text: "`2026-11-17T13:00:00+00:00`", correct: false}
  - key: code-affichage-timedelta
    format: code-output
    question: |-
      ```python
      from datetime import timedelta

      print(timedelta(days=1, hours=36))
      ```
    answer: "`2 days, 12:00:00` : 36 heures font un jour et demi, ajoutés au jour donné ; l'affichage sépare les jours du reste."
    check:
      output: "2 days, 12:00:00"
    choices:
      - {text: "`2 days, 12:00:00`", correct: true}
      - {text: "`1 day, 36:00:00`", correct: false}
      - {text: "`60:00:00`", correct: false}
      - {text: "`2.5 days`", correct: false}
  - key: bug-naif-et-conscient
    format: bug-fix
    question: |-
      Ce script s'arrête sur « TypeError: can't compare offset-naive and offset-aware datetimes » :
      ```python
      from datetime import datetime, timezone

      echeance = datetime(2026, 12, 1, 9, 0)
      maintenant = datetime(2026, 11, 17, 8, 0, tzinfo=timezone.utc)
      print(maintenant < echeance)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`echeance = datetime(2026, 12, 1, 9, 0, tzinfo=timezone.utc)`", correct: true}
      - {text: "`echeance = datetime(2026, 12, 1, 9, 0, tzinfo=None)`", correct: false}
      - {text: "`print(maintenant.timestamp < echeance.timestamp)`", correct: false}
      - {text: "`print(maintenant < echeance.date())`", correct: false}
    answer: |-
      ```python
      echeance = datetime(2026, 12, 1, 9, 0, tzinfo=timezone.utc)
      print(maintenant < echeance)      # True
      ```
      Un naïf n'a pas de fuseau : Python refuse de deviner. `tzinfo=None` le laisse naïf ; `timestamp` sans
      parenthèses désigne la méthode ; un `datetime` ne se compare pas à une `date`.
  - key: bug-format-strptime
    format: bug-fix
    question: |-
      Ce script s'arrête sur « ValueError: time data '17/11/2026' does not match format '%Y-%m-%d' » :
      ```python
      from datetime import datetime

      print(datetime.strptime("17/11/2026", "%Y-%m-%d"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`datetime.strptime(\"17/11/2026\", \"%d/%m/%Y\")`", correct: true}
      - {text: "`datetime.strptime(\"17/11/2026\", \"%d/%M/%Y\")`", correct: false}
      - {text: "`datetime.strftime(\"17/11/2026\", \"%Y-%m-%d\")`", correct: false}
      - {text: "`datetime.fromisoformat(\"17/11/2026\")`", correct: false}
    answer: |-
      ```python
      print(datetime.strptime("17/11/2026", "%d/%m/%Y"))   # 2026-11-17 00:00:00
      ```
      Le format décrit le texte lu, séparateurs compris. `%M` lirait des minutes ; `fromisoformat` attend
      `2026-11-17`.
  - key: bug-minutes-pour-mois
    format: bug-fix
    question: |-
      Ce script affiche `2026-05-17` au lieu de `2026-11-17` :
      ```python
      from datetime import datetime

      print(datetime(2026, 11, 17, 8, 5).strftime("%Y-%M-%d"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`strftime(\"%Y-%m-%d\")`", correct: true}
      - {text: "`strftime(\"%y-%M-%d\")`", correct: false}
      - {text: "`strftime(\"%Y-%MM-%d\")`", correct: false}
      - {text: "`strftime(\"%Y-%B-%d\")`", correct: false}
    answer: |-
      ```python
      print(datetime(2026, 11, 17, 8, 5).strftime("%Y-%m-%d"))
      ```
      `%M` affiche les minutes (ici 05), `%m` le mois. `%B` donnerait le nom du mois (`November`).
  - key: bug-seconds-sans-jours
    format: bug-fix
    question: |-
      Ce script affiche `300`, au lieu des 173 100 secondes attendues :
      ```python
      from datetime import timedelta

      duree = timedelta(days=2, minutes=5)
      print(duree.seconds)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(duree.total_seconds())`", correct: true}
      - {text: "`print(duree.days * duree.seconds)`", correct: false}
      - {text: "`print(int(duree))`", correct: false}
      - {text: "`print(duree.seconds + duree.days)`", correct: false}
    answer: |-
      ```python
      print(duree.total_seconds())      # 173100.0
      ```
      `seconds` n'est que la part de la durée hors jours (0 à 86 399). `total_seconds()` compte tout, en flottant.
