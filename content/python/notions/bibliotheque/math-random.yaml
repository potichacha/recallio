notion: math-random
lesson: |-
  Trois modules de la bibliothèque standard pour calculer.

  **`math`** : les fonctions mathématiques sur les nombres réels.

  ```python
  import math

  math.sqrt(2), math.pi, math.e, math.inf
  math.floor(-2.5), math.ceil(-2.5), math.trunc(-2.5)   # -3, -2, -2 : vers le bas, vers le haut, vers zéro
  math.isclose(0.1 + 0.2, 0.3)                          # True : comparer des flottants
  math.gcd(12, 18), math.lcm(4, 6)                      # 6, 12
  math.factorial(5), math.comb(5, 2), math.perm(5, 2)   # 120, 10, 20
  math.log(100, 10), math.log2(8), math.hypot(3, 4)     # 2.0, 3.0, 5.0
  math.prod([2, 3, 4]), math.fsum([0.1] * 10)           # 24, 1.0
  ```

  **`random`** : du hasard **pseudo-aléatoire**, pour des simulations ou des jeux.

  | Fonction | Rôle |
  |---|---|
  | `random.random()` | un flottant dans `[0, 1)` |
  | `random.randint(1, 6)` | un entier de 1 à 6, **bornes comprises** |
  | `random.randrange(0, 10, 2)` | comme `range` : 0, 2, 4, 6 ou 8 |
  | `random.choice(xs)` | un élément |
  | `random.choices(xs, k=3, weights=...)` | trois tirages **avec** remise, pondérés au besoin |
  | `random.sample(xs, 3)` | trois éléments distincts, **sans** remise |
  | `random.shuffle(xs)` | mélange la liste **sur place**, renvoie `None` |
  | `random.uniform(a, b)`, `random.gauss(m, s)` | un flottant uniforme, une loi normale |
  | `random.seed(42)` | fixe la graine : la même suite à chaque exécution |

  `random` est **prévisible** : pour un mot de passe ou un jeton, on utilise `secrets`.

  **`statistics`** : `mean` (moyenne), `median`, `mode` (valeur la plus fréquente), `stdev` (écart type d'un
  échantillon), `pstdev` (d'une population entière), `quantiles`.

  ```python
  import statistics

  notes = [12, 15, 9, 18, 15]
  statistics.mean(notes), statistics.median(notes), statistics.mode(notes)   # 13.8, 15, 15
  ```

  **En entretien** : « `math` pour les fonctions usuelles (`sqrt`, `floor`, `isclose`, `comb`), `statistics` pour
  moyenne, médiane et écart type, `random` pour le hasard simulé : `randint` inclut ses deux bornes, `sample` tire sans
  remise, `shuffle` mélange sur place. Pour de la sécurité, `secrets`, jamais `random`. »
tour:
  - title: math, random et statistics
    text: |-
      `math` regroupe les fonctions usuelles : `sqrt`, `floor` (vers le bas), `ceil` (vers le haut), `trunc` (vers
      zéro), `gcd`, `comb`... `math.isclose` compare deux flottants malgré les erreurs d'arrondi.

      `statistics` calcule moyenne, médiane et valeur la plus fréquente. `random` tire au hasard : `randint(1, 6)`
      inclut ses deux bornes, `shuffle` mélange une liste sur place. Avec la même graine (`random.seed`), la suite de
      tirages est la même à chaque exécution.

      Essaie : affiche `premiers`, et relance le programme : avec la graine, la suite ne change pas.
    example:
      files:
        main.py: |-
          import math
          import random
          import statistics

          print(math.sqrt(2) ** 2 == 2, math.isclose(math.sqrt(2) ** 2, 2))
          print(math.floor(-2.5), math.ceil(-2.5), math.trunc(-2.5))
          print(math.gcd(12, 18), math.comb(5, 2), math.factorial(5))

          notes = [12, 15, 9, 18, 15]
          print(statistics.mean(notes), statistics.median(notes), statistics.mode(notes))

          random.seed(42)
          premiers = [random.randint(1, 6) for _ in range(5)]
          random.seed(42)
          seconds = [random.randint(1, 6) for _ in range(5)]
          print(premiers == seconds, all(1 <= de <= 6 for de in premiers))

          cartes = list(range(10))
          random.shuffle(cartes)
          print(sorted(cartes) == list(range(10)))
      output: |-
        False True
        -3 -2 -2
        6 10 120
        13.8 15 15
        True True
        True
cards:
  - key: bornes-randint
    format: course
    question: "Quelles valeurs peut renvoyer `random.randint(1, 6)` ?"
    choices:
      - {text: "De 1 à 6, bornes comprises", correct: true}
      - {text: "De 1 à 5 : la borne haute est exclue", correct: false}
      - {text: "De 0 à 6, bornes comprises", correct: false}
      - {text: "Des décimaux entre 1 et 6", correct: false}
    answer: "`randint(a, b)` inclut `b`, contrairement à `range` et `randrange`. `randrange(1, 7)` donne le même résultat."
  - key: pas-random-pour-secret
    format: course
    question: "Pourquoi ne pas générer un mot de passe avec `random` ?"
    choices:
      - {text: "Ses tirages sont prévisibles : il faut le module `secrets`", correct: true}
      - {text: "`random` ne sait pas tirer de lettres, seulement des nombres", correct: false}
      - {text: "`random` donne la même suite à chaque lancement du programme", correct: false}
      - {text: "`random` est trop lent pour un mot de passe de 16 caractères", correct: false}
    answer: "`random` est un générateur pseudo-aléatoire (Mersenne Twister) : quelques sorties observées suffisent à prédire la suite. `secrets` puise dans le générateur cryptographique du système."
  - key: sample-ou-choices
    format: course
    question: "Quelle différence entre `random.sample(xs, 3)` et `random.choices(xs, k=3)` ?"
    choices:
      - {text: "`sample` tire sans remise, `choices` avec remise", correct: true}
      - {text: "`sample` trie le résultat, `choices` le laisse en vrac", correct: false}
      - {text: "`sample` renvoie un tuple, `choices` une liste", correct: false}
      - {text: "Aucune : `choices` est le nouveau nom de `sample`", correct: false}
    answer: "`sample` donne trois éléments distincts (un tirage du loto) ; `choices` peut tirer deux fois le même (des lancers de dé), et accepte des poids."
  - key: mediane
    format: course
    question: "Que vaut `statistics.median([1, 3, 100])` ?"
    choices:
      - {text: "`3`", correct: true}
      - {text: "`34.666666666666664`", correct: false}
      - {text: "`100`", correct: false}
      - {text: "`2`", correct: false}
    answer: "La médiane est la valeur du milieu une fois triées : 3. La moyenne, 34,67, est tirée vers le haut par la valeur extrême."
  - key: vf-shuffle-renvoie
    format: true-false
    question: "`random.shuffle(xs)` renvoie une nouvelle liste mélangée."
    truth: false
    answer: "Il mélange `xs` sur place et renvoie `None`. Pour une copie mélangée : `random.sample(xs, len(xs))`."
  - key: vf-graine
    format: true-false
    question: "Après `random.seed(42)`, le programme tire la même suite de nombres à chaque exécution."
    truth: true
    answer: "Pratique pour reproduire une simulation ou un test. C'est aussi pourquoi `random` ne convient pas à la sécurité."
  - key: vf-floor-negatif
    format: true-false
    question: "`math.floor(-2.5)` vaut `-2`."
    truth: false
    answer: "`floor` arrondit vers le bas, donc vers -3. C'est `math.trunc(-2.5)` qui vaut -2, en coupant vers zéro."
  - key: vf-isclose
    format: true-false
    question: "`math.isclose(0.1 + 0.2, 0.3)` renvoie `True`, alors que `0.1 + 0.2 == 0.3` vaut `False`."
    truth: true
    answer: "`0.1 + 0.2 == 0.3` est faux à cause des arrondis binaires ; `isclose` tolère une petite erreur relative (`rel_tol=1e-09` par défaut)."
  - key: qcm-racine
    format: multiple-choice
    question: Quelle fonction calcule la racine carrée de 2 ?
    choices:
      - {text: "`math.sqrt(2)`", correct: true}
      - {text: "`math.root(2)`", correct: false}
      - {text: "`math.pow(2)`", correct: false}
      - {text: "`sqrt(2)`, sans import", correct: false}
    answer: "`math.sqrt` ; `2 ** 0.5` donne le même résultat. `math.pow` attend deux arguments, et `sqrt` n'est pas une fonction intégrée."
  - key: qcm-choice
    format: multiple-choice
    question: Comment tirer un élément au hasard dans une liste ?
    choices:
      - {text: "`random.choice(xs)`", correct: true}
      - {text: "`random.pick(xs)`", correct: false}
      - {text: "`random.randint(xs)`", correct: false}
      - {text: "`xs.random()`", correct: false}
    answer: "`choice` prend une séquence non vide ; sur une liste vide, il lève une `IndexError`."
  - key: qcm-combinaisons
    format: multiple-choice
    question: Quelle fonction compte les façons de choisir 2 cartes parmi 5, sans tenir compte de l'ordre ?
    choices:
      - {text: "`math.comb(5, 2)`", correct: true}
      - {text: "`math.perm(5, 2)`", correct: false}
      - {text: "`math.factorial(5) // 2`", correct: false}
      - {text: "`math.choose(5, 2)`", correct: false}
    answer: "`comb(5, 2)` vaut 10. `perm(5, 2)` vaut 20, car il compte les arrangements, où l'ordre importe."
  - key: qcm-ecart-type
    format: multiple-choice
    question: Quelle fonction calcule l'écart type d'un échantillon ?
    choices:
      - {text: "`statistics.stdev`", correct: true}
      - {text: "`math.stdev`", correct: false}
      - {text: "`statistics.variance`", correct: false}
      - {text: "`random.stdev`", correct: false}
    answer: "`stdev` pour un échantillon, `pstdev` pour une population entière. `variance` donne le carré de l'écart type."
  - key: trous-randint
    format: fill-in
    question: |-
      Complète pour simuler un lancer de dé à six faces :
      ```python
      de = random.___(1, 6)
      ```
    blanks: [[randint]]
    answer: "`randint(1, 6)` inclut les deux bornes."
  - key: trous-pi
    format: fill-in
    question: |-
      Complète le calcul de l'aire d'un disque :
      ```python
      aire = math.___ * rayon ** 2
      ```
    blanks: [[pi]]
    answer: "`math.pi` est une constante, sans parenthèses."
  - key: trous-mean
    format: fill-in
    question: |-
      Complète pour calculer la moyenne des notes :
      ```python
      moyenne = statistics.___(notes)
      ```
    blanks: [[mean, fmean]]
    answer: "`mean` (ou `fmean`, plus rapide, qui renvoie toujours un flottant)."
  - key: trous-shuffle
    format: fill-in
    question: |-
      Complète pour mélanger la liste sur place :
      ```python
      random.___(cartes)
      ```
    blanks: [[shuffle]]
    answer: "`shuffle` modifie la liste et renvoie `None`."
