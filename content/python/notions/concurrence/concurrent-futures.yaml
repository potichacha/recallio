  - key: code-map-ordre
    format: code-output
    question: |-
      ```python
      import time
      from concurrent.futures import ThreadPoolExecutor

      def carre(x):
          time.sleep(0.01 * x)
          return x * x

      with ThreadPoolExecutor(max_workers=3) as ex:
          print(list(ex.map(carre, [3, 1, 2])))
      ```
    answer: "La tâche de 1 finit la première, mais `map` rend les résultats dans l'ordre des entrées."
    check:
      output: "[9, 1, 4]"
    choices:
      - {text: "`[9, 1, 4]`", correct: true}
      - {text: "`[1, 4, 9]`", correct: false}
      - {text: "`[3, 1, 2]`", correct: false}
      - {text: "`[1, 9, 4]`", correct: false}
  - key: code-exception-gardee
    format: code-output
    question: |-
      ```python
      from concurrent.futures import ThreadPoolExecutor

      def diviser(a, b):
          return a / b

      with ThreadPoolExecutor() as ex:
          futur = ex.submit(diviser, 1, 0)
      print(futur.done(), type(futur.exception()).__name__)
      ```
    answer: "La tâche est terminée, en échec : son exception est rangée dans le futur, et `exception()` la renvoie sans la lever."
    check:
      output: "True ZeroDivisionError"
    choices:
      - {text: "`True ZeroDivisionError`", correct: true}
      - {text: "`False ZeroDivisionError`", correct: false}
      - {text: "`True NoneType`", correct: false}
      - {text: "Une `ZeroDivisionError`, à la sortie du `with`", correct: false}
  - key: code-result-releve
    format: code-output
    question: |-
      ```python
      from concurrent.futures import ThreadPoolExecutor

      def lire(cle):
          return {"a": 1}[cle]

      with ThreadPoolExecutor() as ex:
          futurs = [ex.submit(lire, cle) for cle in ["a", "b"]]
      print("soumis")
      print(sum(f.result() for f in futurs))
      ```
    answer: "Le `with` se termine sans erreur : l'exception de `lire(\"b\")` dort dans son futur. C'est `result()` qui la relève, après `soumis`."
    check:
      output: "soumis"
      throws: KeyError
    choices:
      - {text: "`soumis`, puis une `KeyError`", correct: true}
      - {text: "Une `KeyError`, avant d'afficher `soumis`", correct: false}
      - {text: "`soumis`, puis `1`", correct: false}
      - {text: "`soumis`, puis `None`", correct: false}
  - key: code-process-pool
    format: code-output
    question: |-
      ```python
      from concurrent.futures import ProcessPoolExecutor

      def cube(x):
          return x ** 3

      if __name__ == "__main__":
          with ProcessPoolExecutor(max_workers=2) as ex:
              print(sum(ex.map(cube, range(4))))
      ```
    answer: "Les processus calculent 0, 1, 8 et 27 ; la fonction, définie au niveau du module, se sérialise sans problème."
    check:
      output: "36"
    choices:
      - {text: "`36`", correct: true}
      - {text: "`14`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "Rien : la garde empêche le calcul", correct: false}
  - key: bug-result-dans-la-boucle
    format: bug-fix
    question: |-
      Ce programme affiche `[0, 1, 2, 3, 4] 1.0` : cinq attentes de 0,2 s durent 1 s au lieu de 0,2 s.
      ```python
      import time
      from concurrent.futures import ThreadPoolExecutor

      def attendre(n):
          time.sleep(0.2)
          return n

      debut = time.perf_counter()
      with ThreadPoolExecutor(max_workers=5) as ex:
          resultats = [ex.submit(attendre, n).result() for n in range(5)]
      print(resultats, round(time.perf_counter() - debut, 1))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`resultats = list(ex.map(attendre, range(5)))`", correct: true}
      - {text: "`resultats = [ex.submit(attendre(n)) for n in range(5)]`", correct: false}
      - {text: "`ThreadPoolExecutor(max_workers=10)`, avec la même boucle", correct: false}
      - {text: "`resultats = [ex.submit(attendre, n).done() for n in range(5)]`", correct: false}
    answer: |-
      ```python
      with ThreadPoolExecutor(max_workers=5) as ex:
          resultats = list(ex.map(attendre, range(5)))
      ```
      `result()` attend chaque tâche avant que la suivante soit soumise : tout est séquentiel. On soumet tout d'abord
      (avec `map`, ou une liste de futures), puis on récupère les résultats.
  - key: bug-exception-perdue
    format: bug-fix
    question: |-
      Ce programme affiche `terminé sans erreur`, alors que la ligne vide lève une `ValueError` :
      ```python
      from concurrent.futures import ThreadPoolExecutor

      def enregistrer(ligne):
          if not ligne:
              raise ValueError("ligne vide")

      with ThreadPoolExecutor() as ex:
          for ligne in ["a", "", "b"]:
              ex.submit(enregistrer, ligne)
      print("terminé sans erreur")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Garder les futures, et appeler `result()` sur chacune", correct: true}
      - {text: "Entourer `ex.submit(...)` d'un `try` / `except ValueError`", correct: false}
      - {text: "Créer l'exécuteur avec `max_workers=1`, pour voir l'erreur", correct: false}
      - {text: "Appeler `ex.shutdown(wait=True)` après la boucle", correct: false}
    answer: |-
      ```python
      with ThreadPoolExecutor() as ex:
          futurs = [ex.submit(enregistrer, ligne) for ligne in ["a", "", "b"]]
      for futur in futurs:
          futur.result()
      print("terminé sans erreur")
      ```
      L'exception est rangée dans le futur. `submit` lui-même ne lève rien : un `try` autour de lui ne voit jamais
      l'erreur. `result()` la relève (`list(ex.map(...))` aussi).
  - key: bug-lambda-process-pool
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `_pickle.PicklingError: Can't pickle <function <lambda> at 0x...>` :
      ```python
      from concurrent.futures import ProcessPoolExecutor

      if __name__ == "__main__":
          with ProcessPoolExecutor(max_workers=2) as ex:
              print(list(ex.map(lambda x: x * x, [1, 2, 3])))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Définir `def carre(x)` au niveau du module, et passer `carre`", correct: true}
      - {text: "Retirer la garde `if __name__ == \"__main__\":` du script", correct: false}
      - {text: "Passer `chunksize=3` à `ex.map`, pour tout envoyer d'un coup", correct: false}
      - {text: "Définir `carre` dans le bloc `with`, juste avant l'appel", correct: false}
    answer: |-
      ```python
      from concurrent.futures import ProcessPoolExecutor

      def carre(x):
          return x * x

      if __name__ == "__main__":
          with ProcessPoolExecutor(max_workers=2) as ex:
              print(list(ex.map(carre, [1, 2, 3])))
      ```
      `pickle` envoie une fonction par son nom, que l'enfant retrouve dans le module. Une `lambda`, ou une fonction
      locale, n'a pas de nom accessible au niveau du module.
  - key: bug-as-completed-ordre
    format: bug-fix
    question: |-
      Ce programme affiche `[2, 1, 0]`, alors que les résultats devaient suivre l'ordre des entrées :
      ```python
      import time
      from concurrent.futures import ThreadPoolExecutor, as_completed

      def attendre(n):
          time.sleep(0.1 * (3 - n))
          return n

      with ThreadPoolExecutor() as ex:
          futurs = [ex.submit(attendre, n) for n in range(3)]
          print([f.result() for f in as_completed(futurs)])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print([f.result() for f in futurs])`", correct: true}
      - {text: "`print(sorted(as_completed(futurs)))`", correct: false}
      - {text: "`print([f.result() for f in reversed(futurs)])`", correct: false}
      - {text: "`print([f.done() for f in as_completed(futurs)])`", correct: false}
    answer: |-
      ```python
      with ThreadPoolExecutor() as ex:
          futurs = [ex.submit(attendre, n) for n in range(3)]
          print([f.result() for f in futurs])
      ```
      `as_completed` rend les futures dans l'ordre où elles finissent. Parcourir la liste des futures, ou utiliser
      `ex.map`, garde l'ordre des entrées. Inverser la liste ne marcherait que par hasard.
