  - key: code-wait-for-annule
    format: code-output
    question: |-
      ```python
      import asyncio

      async def lent():
          try:
              await asyncio.sleep(10)
          except asyncio.CancelledError:
              print("annulée", end=" ")
              raise

      async def main():
          try:
              await asyncio.wait_for(lent(), timeout=0.05)
          except TimeoutError:
              print("délai")

      asyncio.run(main())
      ```
    answer: "Au bout de 0,05 s, `wait_for` annule la coroutine : elle reçoit `CancelledError`, fait son ménage et la laisse remonter ; `wait_for` lève alors `TimeoutError`."
