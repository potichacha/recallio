    choices:
      - {text: "`['int', 'ValueError', 'int']`", correct: true}
      - {text: "`['int', 'int']`", correct: false}
      - {text: "`['int', 'NoneType', 'int']`", correct: false}
      - {text: "Une `ValueError`, levée par `gather`", correct: false}
  - key: bug-await-en-boucle
    format: bug-fix
    question: |-
      Ce programme affiche `[0, 1, 2, 3, 4] 1.0` : cinq attentes de 0,2 s prennent 1 s au lieu de 0,2 s.
      ```python
      import asyncio
      import time

      async def charger(n):
          await asyncio.sleep(0.2)
          return n

      async def main():
          debut = time.perf_counter()
          resultats = [await charger(n) for n in range(5)]
          print(resultats, round(time.perf_counter() - debut, 1))

      asyncio.run(main())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`resultats = await asyncio.gather(*(charger(n) for n in range(5)))`", correct: true}
      - {text: "`resultats = [asyncio.create_task(charger(n)) for n in range(5)]`", correct: false}
      - {text: "`resultats = [charger(n) for n in range(5)]`", correct: false}
      - {text: "`resultats = [asyncio.run(charger(n)) for n in range(5)]`", correct: false}
    answer: |-
      ```python
      async def main():
          debut = time.perf_counter()
          resultats = await asyncio.gather(*(charger(n) for n in range(5)))
          print(resultats, round(time.perf_counter() - debut, 1))
      ```
      Chaque `await` attend la fin du chargement avant de lancer le suivant. `gather` les fait avancer ensemble.
      Créer des tâches sans les attendre donnerait une liste de tâches, pas de résultats.
  - key: bug-tache-jamais-attendue
    format: bug-fix
    question: |-
      Ce programme affiche `réponse envoyée`, mais jamais la ligne du journal :
      ```python
      import asyncio

      async def journaliser(message):
          await asyncio.sleep(0.1)
          print("journal :", message)

      async def main():
          asyncio.create_task(journaliser("commande reçue"))
          print("réponse envoyée")

      asyncio.run(main())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Garder la tâche dans une variable, et l'attendre avec `await` avant la fin", correct: true}
      - {text: "Remplacer `asyncio.sleep(0.1)` par `time.sleep(0.1)` dans `journaliser`", correct: false}
      - {text: "Appeler `asyncio.run(journaliser(...))` à la place de `create_task`", correct: false}
      - {text: "Ajouter `print` avant `asyncio.create_task`, pour forcer son démarrage", correct: false}
    answer: |-
      ```python
      async def main():
          tache = asyncio.create_task(journaliser("commande reçue"))
          print("réponse envoyée")
          await tache
      ```
      `main` se termine avant la fin du journal, et `asyncio.run` annule les tâches encore en cours. Il faut les
      attendre (ou les lancer dans un `TaskGroup`).
  - key: bug-annulation-avalee
    format: bug-fix
    question: |-
      Ce programme affiche `annulation ignorée`, puis `fini` : le délai de 0,05 s n'a rien arrêté.
      ```python
      import asyncio

      async def lent():
          try:
              await asyncio.sleep(1)
          except asyncio.CancelledError:
              print("annulation ignorée")
          return "fini"

      async def main():
          try:
              async with asyncio.timeout(0.05):
                  print(await lent())
          except TimeoutError:
              print("délai dépassé")

      asyncio.run(main())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Relancer l'exception par `raise` dans le bloc `except` de `lent`", correct: true}
      - {text: "Remplacer `asyncio.timeout(0.05)` par `asyncio.timeout(1)`", correct: false}
      - {text: "Rattraper `TimeoutError` à la place de `CancelledError` dans `lent`", correct: false}
      - {text: "Rattraper `Exception` à la place de `CancelledError` dans `lent`", correct: false}
    answer: |-
      ```python
      async def lent():
          try:
              await asyncio.sleep(1)
          except asyncio.CancelledError:
              print("annulation en cours")
              raise
          return "fini"
      ```
      `timeout` annule la tâche par une `CancelledError` ; la coroutine qui l'avale continue comme si de rien n'était.
      Elle peut faire son ménage, mais doit la relancer. (`CancelledError` n'hérite pas de `Exception` : l'attraper ainsi
      ne la verrait pas.)
  - key: bug-gather-perd-tout
    format: bug-fix
    question: |-
      Une seule page illisible fait tout perdre : ce programme s'arrête sur `ValueError: page 2 illisible`, sans afficher
      les trois autres pages.
      ```python
      import asyncio

      async def lire(n):
          await asyncio.sleep(0)
          if n == 2:
              raise ValueError(f"page {n} illisible")
          return f"page {n}"

      async def main():
          pages = await asyncio.gather(*(lire(n) for n in range(4)))
          print(pages)

      asyncio.run(main())
      ```
      Quelle correction garde les pages lisibles ?
    choices:
      - {text: "`gather(..., return_exceptions=True)`, puis écarter les exceptions", correct: true}
      - {text: "Un `TaskGroup` à la place de `gather`, sans autre changement", correct: false}
      - {text: "Un `try` / `except ValueError` autour de `asyncio.run(main())`", correct: false}
      - {text: "`asyncio.timeout(1)` autour de l'appel à `gather`", correct: false}
    answer: |-
      ```python
      async def main():
          resultats = await asyncio.gather(*(lire(n) for n in range(4)), return_exceptions=True)
          pages = [r for r in resultats if not isinstance(r, Exception)]
          print(pages)
      ```
      Sans `return_exceptions`, `gather` relève la première exception et les résultats sont perdus. Un `TaskGroup`
      annulerait les autres lectures ; un `try` autour de `asyncio.run` ne rendrait aucune page.
