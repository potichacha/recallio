notion: subinterpreters
lesson: |-
  Un **sous-interpréteur** est un interpréteur Python complet qui vit **dans le même processus** que les autres, mais
  **isolé** : ses propres modules importés, ses propres variables globales, son propre `sys.modules`. Depuis Python 3.12
  (PEP 684), chacun peut avoir **son propre GIL** : des sous-interpréteurs lancés dans des threads calculent donc en
  parallèle. Python 3.14 les rend accessibles depuis le code Python (PEP 734), avec le module
  `concurrent.interpreters`.

  ```python
  from concurrent import interpreters

  interp = interpreters.create()
  interp.exec("x = 6 * 7\nprint('dans le sous-interpréteur :', x)")
  print(interp.call(sum, [1, 2, 3]))          # 6 : appelle une fonction et renvoie son résultat

  file = interpreters.create_queue()
  interp.prepare_main(file=file)               # rend la file visible dans son module __main__
  interp.exec("file.put(42)")
  print(file.get())                            # 42
  interp.close()
  ```

  | Outil | Rôle |
  |---|---|
  | `interpreters.create()` | crée un sous-interpréteur |
  | `interp.exec(code)` | exécute du code source dans son `__main__` ; une exception y devient `ExecutionFailed` |
  | `interp.call(f, *args)` | appelle une fonction et renvoie le résultat |
  | `interp.prepare_main(nom=valeur)` | lui passe des objets |
  | `interpreters.create_queue()` | une file partagée entre interpréteurs |
  | `concurrent.futures.InterpreterPoolExecutor` | un pool, avec l'interface habituelle (`submit`, `map`) |

  **Entre threads et processus.** Comme des processus, les sous-interpréteurs sont isolés et calculent en parallèle ;
  comme des threads, ils vivent dans un seul processus, démarrent plus vite et coûtent moins de mémoire. Les objets ne
  se **partagent** pas : seuls quelques types passent directement (`None`, `bool`, nombres, `str`, `bytes`, tuples de
  ceux-ci, `memoryview`), les autres sont copiés (par `pickle`) ou refusés (`NotShareableError`).

  **Les limites.** Une extension C doit être adaptée (initialisation multi-phase) pour se charger dans un
  sous-interpréteur ; beaucoup ne le sont pas encore. Et l'API est jeune : c'est un outil d'expert, pour isoler des
  calculs parallèles sans payer le prix des processus.

  **En entretien** : « Un sous-interpréteur est un interpréteur isolé dans le même processus, avec son propre GIL
  depuis 3.12 : il calcule en parallèle des autres. Python 3.14 les expose avec `concurrent.interpreters` et
  `InterpreterPoolExecutor`. Ils ne partagent pas d'objets, on communique par des files, et toutes les extensions C ne
  s'y chargent pas encore. »
cards:
  - key: definition-sous-interpreteur
    format: course
    question: "Qu'est-ce qu'un sous-interpréteur Python ?"
    choices:
      - {text: "Un interpréteur isolé, qui vit dans le même processus que les autres", correct: true}
      - {text: "Un processus enfant, lancé par `multiprocessing` avec son interpréteur", correct: false}
      - {text: "Un thread qui partage les modules et les variables du programme", correct: false}
      - {text: "Un interpréteur de commandes ouvert par `python -i` après un script", correct: false}
    answer: "Il a ses propres modules et variables globales, et depuis 3.12 son propre GIL, mais il partage le processus : plus léger qu'un processus, plus isolé qu'un thread."
  - key: nouveaute-314
    format: course
    question: "Qu'apporte Python 3.14 aux sous-interpréteurs ?"
    choices:
      - {text: "Le module `concurrent.interpreters`, pour les créer en Python", correct: true}
      - {text: "Leur création même : ils n'existaient pas avant 3.14", correct: false}
      - {text: "Un GIL partagé entre tous, pour qu'ils échangent leurs objets", correct: false}
      - {text: "Le partage de toutes les variables globales entre eux", correct: false}
    answer: "Les sous-interpréteurs existent dans l'API C depuis longtemps, avec un GIL par interpréteur depuis 3.12. La PEP 734 les ouvre au code Python en 3.14, avec `InterpreterPoolExecutor`."
  - key: avantage-sur-processus
    format: course
    question: "Quel avantage un sous-interpréteur a-t-il sur un processus ?"
    choices:
      - {text: "Il démarre plus vite et coûte moins de mémoire, dans le même processus", correct: true}
      - {text: "Il partage tous ses objets avec l'interpréteur principal, sans copie", correct: false}
      - {text: "Il charge toutes les extensions C, contrairement à un processus", correct: false}
      - {text: "Il n'a pas de GIL, contrairement à un processus enfant", correct: false}
    answer: "Pas de nouveau processus à lancer : la création est plus légère. Mais l'isolement reste celui d'un processus : pas d'objet partagé, et certaines extensions C refusent de s'y charger."
  - key: limite-des-sous-interpreteurs
    format: course
    question: "Quelle est la principale limite des sous-interpréteurs aujourd'hui ?"
    choices:
      - {text: "Des extensions C ne s'y chargent pas, faute d'avoir été adaptées", correct: true}
      - {text: "Ils ne peuvent pas s'exécuter en même temps que l'interpréteur principal", correct: false}
      - {text: "Ils ne sont disponibles que sur le build sans GIL de Python", correct: false}
      - {text: "Ils partagent un seul GIL, et ne calculent donc jamais en parallèle", correct: false}
    answer: "Une extension doit gérer un état par interpréteur (initialisation multi-phase) pour s'y charger. Côté parallélisme, chaque sous-interpréteur a son GIL : ils calculent ensemble, sur le build par défaut."
  - key: vf-gil-par-interpreteur
    format: true-false
    question: "Depuis Python 3.12, chaque sous-interpréteur peut avoir son propre GIL."
    truth: true
    answer: "C'est la PEP 684 : le GIL est devenu propre à chaque interpréteur, ce qui permet à des sous-interpréteurs de calculer en parallèle."
  - key: vf-globales-partagees
    format: true-false
    question: "Deux sous-interpréteurs d'un même processus partagent leurs variables globales."
    truth: false
    answer: "Chacun a son propre module `__main__` et ses propres modules importés. On leur passe des données avec `prepare_main`, `call` ou une file."
  - key: vf-interpreter-pool
    format: true-false
    question: "`concurrent.futures.InterpreterPoolExecutor` existe depuis Python 3.14."
    truth: true
    answer: "Il exécute chaque tâche dans un sous-interpréteur, avec la même interface que les pools de threads et de processus."
  - key: vf-sys-modules-separes
    format: true-false
    question: "Un module importé dans un sous-interpréteur devient importé dans l'interpréteur principal aussi."
    truth: false
    answer: "Chaque interpréteur a son propre `sys.modules` : le module est chargé, et initialisé, séparément dans chacun."
  - key: qcm-module-314
    format: multiple-choice
    question: "Quel module de Python 3.14 crée des sous-interpréteurs depuis le code Python ?"
    choices:
      - {text: "`concurrent.interpreters`", correct: true}
      - {text: "`threading.interpreters`", correct: false}
      - {text: "`sys.subinterpreters`", correct: false}
      - {text: "`multiprocessing.interpreters`", correct: false}
    answer: "`from concurrent import interpreters`, puis `interpreters.create()`. Le pool correspondant est `concurrent.futures.InterpreterPoolExecutor`."
  - key: qcm-echanger-des-donnees
    format: multiple-choice
    question: "Comment deux sous-interpréteurs échangent-ils des données ?"
    choices:
      - {text: "Par une file créée avec `interpreters.create_queue()`", correct: true}
      - {text: "Par une variable globale du module principal", correct: false}
      - {text: "Par un dictionnaire partagé, protégé par un `Lock`", correct: false}
      - {text: "Par un attribut de `threading.local`", correct: false}
    answer: "Les objets ne se partagent pas entre interpréteurs ; une file d'interpréteurs fait passer des valeurs. `prepare_main` et `call` en transmettent aussi."
  - key: qcm-difference-processus
    format: multiple-choice
    question: "Qu'est-ce qui distingue un sous-interpréteur d'un processus enfant ?"
    choices:
      - {text: "Il vit dans le même processus, avec son propre état et son GIL", correct: true}
      - {text: "Il partage les objets du parent sans les copier", correct: false}
      - {text: "Il s'exécute toujours dans le thread principal", correct: false}
      - {text: "Il ne peut pas importer de modules de la bibliothèque standard", correct: false}
    answer: "Isolé comme un processus, mais logé dans le même processus : sa création est plus légère. Il importe ses modules, standard compris, pour lui-même."
  - key: qcm-pool-interpreteurs
    format: multiple-choice
    question: "Quel exécuteur fait tourner chaque tâche dans un sous-interpréteur ?"
    choices:
      - {text: "`InterpreterPoolExecutor`", correct: true}
      - {text: "`ProcessPoolExecutor`", correct: false}
      - {text: "`ThreadPoolExecutor`", correct: false}
      - {text: "`SubinterpreterExecutor`", correct: false}
    answer: "Ajouté en 3.14 à `concurrent.futures`, il s'emploie comme les deux autres : `submit`, `map`, `shutdown`."
