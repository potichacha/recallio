notion: async-iterateurs
lesson: |-
  asyncio a ses versions asynchrones du parcours et des gestionnaires de contexte : elles peuvent **attendre** (`await`)
  pendant qu'elles produisent un élément, ou pendant qu'elles ouvrent et ferment une ressource.

  **`async for`** parcourt un **itérable asynchrone** : un objet qui a `__aiter__`, dont l'itérateur a une méthode
  `async def __anext__`, qui lève `StopAsyncIteration` à la fin. Le cas courant : lire des messages au fil de l'eau.

  **Les générateurs asynchrones** : une `async def` qui contient `yield` est un générateur asynchrone, le moyen le plus
  simple d'écrire un itérable asynchrone.

  ```python
  import asyncio

  async def tic(n):
      for i in range(n):
          await asyncio.sleep(0.1)   # attendre entre deux éléments
          yield i

  async def main():
      async for i in tic(3):
          print(i)
      carres = [i * i async for i in tic(3)]    # compréhension asynchrone
      premier = await anext(tic(3))             # anext et aiter, intégrées depuis 3.10

  asyncio.run(main())
  ```

  **`async with`** appelle `await __aenter__()` en entrant et `await __aexit__(...)` en sortant : ouvrir une connexion,
  prendre un `asyncio.Lock` ou un `Semaphore`, ouvrir une session HTTP. `contextlib.asynccontextmanager` en écrit un
  avec un générateur asynchrone :

  ```python
  from contextlib import asynccontextmanager

  @asynccontextmanager
  async def connexion(url):
      c = await ouvrir(url)
      try:
          yield c
      finally:
          await c.fermer()
  ```

  | Synchrone | Asynchrone |
  |---|---|
  | `for`, `__iter__`, `__next__`, `StopIteration` | `async for`, `__aiter__`, `__anext__`, `StopAsyncIteration` |
  | `with`, `__enter__`, `__exit__` | `async with`, `__aenter__`, `__aexit__` |
  | `iter()`, `next()` | `aiter()`, `await anext()` |
  | `@contextmanager` | `@asynccontextmanager` |

  **Les limites** : on ne parcourt pas un itérable asynchrone avec un `for` ordinaire (`TypeError`) ; un générateur
  asynchrone n'accepte ni `yield from` ni `return valeur` ; et `async for`, `async with` ne s'écrivent que dans une
  `async def`.

  **En entretien** : « `async for` parcourt un objet qui a `__aiter__` et `__anext__`, et `async with` appelle
  `__aenter__` et `__aexit__` : les deux peuvent attendre. Le plus simple est un générateur asynchrone, une `async def`
  avec `yield`, et `asynccontextmanager` pour un gestionnaire de contexte. »
cards:
  - key: protocole-async-for
    format: course
    question: "Quelles méthodes `async for` utilise-t-il ?"
    choices:
      - {text: "`__aiter__`, puis `__anext__` à attendre, jusqu'à `StopAsyncIteration`", correct: true}
      - {text: "`__iter__`, puis `__next__` à attendre, jusqu'à `StopIteration`", correct: false}
      - {text: "`__aenter__`, puis `__aexit__`, appelées une fois par élément", correct: false}
      - {text: "`__await__`, appelée une fois pour obtenir toute la liste", correct: false}
    answer: "C'est le pendant asynchrone du protocole d'itération : `__anext__` est une coroutine, qui peut attendre avant de rendre l'élément suivant."
  - key: generateur-asynchrone
    format: course
    question: "Qu'est-ce qu'un générateur asynchrone ?"
    choices:
      - {text: "Une `async def` qui contient `yield`, qu'on parcourt avec `async for`", correct: true}
      - {text: "Un générateur ordinaire exécuté dans un thread par asyncio", correct: false}
      - {text: "Une `async def` qui renvoie une liste de coroutines à attendre", correct: false}
      - {text: "Un générateur ordinaire dont chaque `yield` est précédé d'`await`", correct: false}
    answer: "Il peut attendre (`await`) entre deux éléments : lire une page d'API, puis la suivante. On le parcourt avec `async for`, ou une compréhension asynchrone."
  - key: protocole-async-with
    format: course
    question: "Que fait `async with ressource as r:` ?"
    choices:
      - {text: "Il attend `__aenter__()` en entrant, et `__aexit__(...)` en sortant", correct: true}
      - {text: "Il appelle `__enter__()` et `__exit__()` dans un thread séparé", correct: false}
      - {text: "Il lance le bloc dans une nouvelle tâche, attendue à la sortie", correct: false}
      - {text: "Il parcourt `ressource` élément par élément, comme `async for`", correct: false}
    answer: "Ouvrir et fermer peuvent ainsi attendre le réseau. `__aexit__` est appelée même si le bloc lève une exception, comme pour `with`."
  - key: asynccontextmanager
    format: course
    question: "À quoi sert `contextlib.asynccontextmanager` ?"
    choices:
      - {text: "À écrire un gestionnaire pour `async with` avec un générateur asynchrone", correct: true}
      - {text: "À transformer un `with` ordinaire en tâche lancée en arrière-plan", correct: false}
      - {text: "À rendre une fonction synchrone utilisable avec `await`", correct: false}
      - {text: "À fermer d'office toutes les ressources ouvertes par une coroutine", correct: false}
    answer: "Le code avant `yield` sert d'entrée, celui après (dans un `finally`) de sortie ; la valeur produite est celle du `as`."
  - key: vf-await-et-yield
    format: true-false
    question: "Une même `async def` peut contenir `await` et `yield`."
    truth: true
    answer: "C'est un générateur asynchrone : il attend ce qu'il faut entre deux éléments, et se parcourt avec `async for`."
  - key: vf-for-ordinaire
    format: true-false
    question: "On peut parcourir un générateur asynchrone avec une boucle `for` ordinaire."
    truth: false
    answer: "Il n'a pas de `__iter__` : `for` lève une `TypeError`. Il faut `async for`, dans une `async def`."
  - key: vf-stop-async-iteration
    format: true-false
    question: "`__anext__` signale la fin du parcours en levant `StopAsyncIteration`."
    truth: true
    answer: "C'est le pendant de `StopIteration`. Un générateur asynchrone la lève de lui-même quand son corps se termine."
  - key: vf-yield-from
    format: true-false
    question: "`yield from` est permis dans un générateur asynchrone."
    truth: false
    answer: "C'est une `SyntaxError`. On délègue avec une boucle : `async for x in autre(): yield x`."
  - key: qcm-methodes-async-with
    format: multiple-choice
    question: "Quelles méthodes un objet doit-il avoir pour servir dans `async with` ?"
    choices:
      - {text: "`__aenter__` et `__aexit__`", correct: true}
      - {text: "`__enter__` et `__exit__`", correct: false}
      - {text: "`__aiter__` et `__anext__`", correct: false}
      - {text: "`__await__` et `__exit__`", correct: false}
    answer: "Deux coroutines, attendues à l'entrée et à la sortie. `__enter__` et `__exit__` servent au `with` ordinaire, `__aiter__` et `__anext__` à `async for`."
  - key: qcm-comprehension-asynchrone
    format: multiple-choice
    question: "Comment écrire une compréhension sur le générateur asynchrone `lignes()` ?"
    choices:
      - {text: "`[l async for l in lignes()]`", correct: true}
      - {text: "`[await l for l in lignes()]`", correct: false}
      - {text: "`async [l for l in lignes()]`", correct: false}
      - {text: "`[l for l in await lignes()]`", correct: false}
    answer: "Le mot `async` se place devant le `for` de la compréhension, qui s'écrit dans une `async def`."
  - key: qcm-decorateur
    format: multiple-choice
    question: "Quel décorateur fait d'un générateur asynchrone un gestionnaire de contexte pour `async with` ?"
    choices:
      - {text: "`contextlib.asynccontextmanager`", correct: true}
      - {text: "`contextlib.contextmanager`", correct: false}
      - {text: "`functools.wraps`", correct: false}
      - {text: "`asyncio.timeout`", correct: false}
    answer: "`contextmanager` sert au `with` ordinaire, avec un générateur ordinaire ; `asynccontextmanager` à `async with`, avec un générateur asynchrone."
  - key: qcm-anext
    format: multiple-choice
    question: "Comment obtenir le premier élément du générateur asynchrone `flux()` ?"
    choices:
      - {text: "`await anext(flux())`", correct: true}
      - {text: "`next(flux())`", correct: false}
      - {text: "`await next(flux())`", correct: false}
      - {text: "`aiter(flux())`", correct: false}
    answer: "`anext`, intégrée depuis 3.10, renvoie un awaitable à attendre. `next` ne connaît que les itérateurs ordinaires, et `aiter` renvoie l'itérateur, pas un élément."
  - key: code-comprehension-asynchrone
    format: code-output
    question: |-
      ```python
      import asyncio

      async def compter(n):
          for i in range(n):
              await asyncio.sleep(0)
              yield i * 10

      async def main():
          print([x async for x in compter(4)])

      asyncio.run(main())
      ```
    answer: "Le générateur asynchrone produit 0, 10, 20 et 30 ; la compréhension asynchrone les rassemble dans une liste."
    check:
      output: "[0, 10, 20, 30]"
    choices:
      - {text: "`[0, 10, 20, 30]`", correct: true}
      - {text: "`[0, 1, 2, 3]`", correct: false}
      - {text: "`[10, 20, 30, 40]`", correct: false}
      - {text: "Une `TypeError`, car la liste n'est pas asynchrone", correct: false}
  - key: code-async-context-manager
    format: code-output
    question: |-
      ```python
      import asyncio
      from contextlib import asynccontextmanager

      @asynccontextmanager
      async def connexion():
          print("ouvre", end=" ")
          try:
              yield "c"
          finally:
              print("ferme", end=" ")

      async def main():
          async with connexion() as c:
              print(c, end=" ")
          print("fin")

      asyncio.run(main())
      ```
    answer: "Le code avant `yield` s'exécute à l'entrée, la valeur produite devient `c`, et le `finally` s'exécute à la sortie du bloc."
    check:
      output: "ouvre c ferme fin"
    choices:
      - {text: "`ouvre c ferme fin`", correct: true}
      - {text: "`ouvre ferme c fin`", correct: false}
      - {text: "`c ouvre ferme fin`", correct: false}
      - {text: "`ouvre c fin ferme`", correct: false}
  - key: code-anext-defaut
    format: code-output
    question: |-
      ```python
      import asyncio

      async def lettres():
          for lettre in "ab":
              yield lettre

      async def main():
          flux = lettres()
          print(await anext(flux), await anext(flux), await anext(flux, "fin"))

      asyncio.run(main())
      ```
    answer: "Deux éléments, puis le générateur est épuisé : avec une valeur par défaut, `anext` la renvoie au lieu de lever `StopAsyncIteration`."
    check:
      output: "a b fin"
    choices:
      - {text: "`a b fin`", correct: true}
      - {text: "`a a a`", correct: false}
      - {text: "`a b None`", correct: false}
      - {text: "`a b`, puis une `StopAsyncIteration`", correct: false}
  - key: code-classe-iterable-asynchrone
    format: code-output
    question: |-
      ```python
      import asyncio

      class CompteARebours:
          def __init__(self, n):
              self.n = n

          def __aiter__(self):
              return self

          async def __anext__(self):
              if self.n == 0:
                  raise StopAsyncIteration
              self.n -= 1
              return self.n

      async def main():
          async for x in CompteARebours(3):
              print(x, end=" ")
          print("go")

      asyncio.run(main())
      ```
    answer: "`__anext__` décrémente avant de renvoyer : 2, 1, 0, puis `StopAsyncIteration` termine la boucle."
    check:
      output: "2 1 0 go"
    choices:
      - {text: "`2 1 0 go`", correct: true}
      - {text: "`3 2 1 go`", correct: false}
      - {text: "`3 2 1 0 go`", correct: false}
      - {text: "`go`", correct: false}
