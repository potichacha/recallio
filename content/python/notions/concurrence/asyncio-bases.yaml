notion: asyncio-bases
lesson: |-
  `asyncio` fait de la **concurrence dans un seul thread** : des **coroutines** qui se suspendent pendant qu'elles
  attendent (le réseau, un délai), pour laisser travailler les autres. C'est le modèle des serveurs qui tiennent des
  milliers de connexions.

  ```python
  import asyncio

  async def saluer(nom):                 # une fonction coroutine
      await asyncio.sleep(0.1)           # se suspend : la boucle peut reprendre une autre coroutine
      return f"Bonjour {nom}"

  async def main():
      message = await saluer("Ana")      # attend le résultat
      print(message)

  asyncio.run(main())                    # crée la boucle, exécute main(), puis ferme la boucle
  ```

  **Les mots à connaître.**

  - `async def` définit une **fonction coroutine**. L'appeler **n'exécute rien** : `saluer("Ana")` renvoie un objet
    coroutine, qu'il faut attendre (`await`) ou confier à la boucle. Une coroutine jamais attendue déclenche
    `RuntimeWarning: coroutine '...' was never awaited`.
  - `await x` suspend la coroutine courante jusqu'à ce que `x` soit prêt, et renvoie son résultat. On attend un
    **awaitable** : une coroutine, une tâche (`Task`) ou un futur. `await` n'est permis que dans une `async def`.
  - La **boucle d'événements** reprend, une par une, les coroutines dont l'attente est finie. Elle tourne dans **un
    seul thread** : une coroutine ne cède la main **qu'à un `await`** (ou `async for`, `async with`). C'est du
    **multitâche coopératif**.
  - `asyncio.run(main())` est le **point d'entrée** : on l'appelle une fois, sur la coroutine principale. Dans une
    coroutine, `asyncio.get_running_loop()` donne la boucle courante.

  **Deux `await` à la suite s'exécutent l'un après l'autre.** La concurrence vient des **tâches** (`create_task`,
  `gather`, `TaskGroup`), qui font avancer plusieurs coroutines en même temps.

  | | Threads | asyncio |
  |---|---|---|
  | Bascule | n'importe quand, décidée par l'interpréteur | seulement à un `await` |
  | Coût d'une attente | un thread système | un petit objet Python |
  | Bibliothèques | toutes | asynchrones (sinon elles bloquent la boucle) |

  Entre deux `await`, aucune autre coroutine ne s'exécute : pas de situation de compétition au milieu d'une
  instruction ; il en reste entre deux `await`.

  **En entretien** : « Une fonction `async def` renvoie une coroutine, qui ne s'exécute que quand on l'attend avec
  `await` ou qu'on en fait une tâche. La boucle d'événements, lancée par `asyncio.run`, exécute les coroutines dans un
  seul thread et ne bascule qu'aux `await` : c'est du multitâche coopératif, idéal pour beaucoup d'attentes réseau. »
cards:
  - key: appeler-une-coroutine
    format: course
    question: "Que renvoie l'appel `saluer(\"Ana\")`, quand `saluer` est définie avec `async def` ?"
    choices:
      - {text: "Un objet coroutine, dont le corps ne s'exécutera qu'une fois attendu", correct: true}
      - {text: "La valeur renvoyée par `saluer`, une fois son corps exécuté", correct: false}
      - {text: "Une tâche déjà lancée en arrière-plan par la boucle d'événements", correct: false}
      - {text: "Un thread qui exécute `saluer` en parallèle du programme", correct: false}
    answer: "Le corps ne démarre pas à l'appel. Il faut `await saluer(\"Ana\")`, ou `asyncio.create_task(saluer(\"Ana\"))` pour qu'il s'exécute en même temps que le reste."
  - key: role-de-await
    format: course
    question: "Que fait `await x` dans une coroutine ?"
    choices:
      - {text: "Il suspend la coroutine jusqu'à ce que `x` soit prêt, puis renvoie son résultat", correct: true}
      - {text: "Il lance `x` dans un nouveau thread, et continue sans attendre", correct: false}
      - {text: "Il bloque tout le programme, boucle d'événements comprise, jusqu'à la fin de `x`", correct: false}
      - {text: "Il marque `x` pour qu'il s'exécute à la fin de la coroutine courante", correct: false}
    answer: "Pendant la suspension, la boucle reprend d'autres coroutines ; quand `x` est prêt, la coroutine repart après le `await`, avec sa valeur."
  - key: boucle-un-thread
    format: course
    question: "Quand la boucle d'événements passe-t-elle d'une coroutine à une autre ?"
    choices:
      - {text: "Seulement quand la coroutine courante se suspend, à un `await`", correct: true}
      - {text: "Toutes les 5 ms, comme pour les threads et le GIL", correct: false}
      - {text: "À chaque instruction, pour répartir le temps équitablement", correct: false}
      - {text: "Seulement quand la coroutine courante se termine", correct: false}
    answer: "Le multitâche est coopératif : une coroutine garde la main jusqu'à ce qu'elle attende quelque chose. Une boucle de calcul sans `await` bloque donc toutes les autres."
  - key: role-de-asyncio-run
    format: course
    question: "Que fait `asyncio.run(main())` ?"
    choices:
      - {text: "Il crée une boucle d'événements, exécute `main()` jusqu'au bout, puis la ferme", correct: true}
      - {text: "Il lance `main()` en arrière-plan, et rend la main aussitôt au script", correct: false}
      - {text: "Il exécute `main()` dans un thread séparé, sans boucle d'événements", correct: false}
      - {text: "Il compile `main()` en une fonction ordinaire, sans `await`", correct: false}
    answer: "C'est le point d'entrée d'un programme asynchrone : il renvoie la valeur de `main()`. On ne l'appelle pas depuis une coroutine, où une boucle tourne déjà."
  - key: vf-appel-execute
    format: true-false
    question: "Appeler une fonction `async def` exécute son corps jusqu'au premier `await`."
    truth: false
    answer: "L'appel ne fait que créer l'objet coroutine ; rien du corps ne s'exécute avant qu'on l'attende ou qu'on en fasse une tâche."
  - key: vf-un-seul-thread
    format: true-false
    question: "La boucle d'événements d'asyncio exécute ses coroutines dans un seul thread."
    truth: true
    answer: "Une seule coroutine s'exécute à la fois ; les autres attendent qu'elle se suspende à un `await`."
  - key: vf-deux-await
    format: true-false
    question: "Deux `await` écrits à la suite dans une coroutine s'exécutent en même temps."
    truth: false
    answer: "Le second ne commence qu'une fois le premier terminé. Pour les faire avancer ensemble : `asyncio.gather`, `create_task` ou un `TaskGroup`."
  - key: vf-await-hors-async
    format: true-false
    question: "Dans un script, `await` n'est permis qu'à l'intérieur d'une fonction `async def`."
    truth: true
    answer: "Ailleurs, c'est une `SyntaxError`. Seul le terminal interactif `python -m asyncio` accepte un `await` au premier niveau."
  - key: qcm-awaitables
    format: multiple-choice
    question: "Quels objets peut-on attendre avec `await` ?"
    choices:
      - {text: "Les coroutines, les tâches et les futures", correct: true}
      - {text: "Toutes les fonctions, synchrones comprises", correct: false}
      - {text: "Les threads et les processus démarrés", correct: false}
      - {text: "Seulement les appels à `asyncio.sleep`", correct: false}
    answer: "Ce sont les *awaitables* : des objets qui ont une méthode `__await__`. Une fonction ordinaire, un `Thread` ou un nombre ne s'attendent pas."
  - key: qcm-ceder-la-main
    format: multiple-choice
    question: "Où une coroutine peut-elle laisser la main à une autre ?"
    choices:
      - {text: "À un `await`, un `async for` ou un `async with`", correct: true}
      - {text: "À n'importe quelle instruction, comme un thread", correct: false}
      - {text: "Seulement au `return` de la coroutine", correct: false}
      - {text: "À chaque appel d'une fonction ordinaire", correct: false}
    answer: "Ce sont les seuls points de suspension. Entre deux, la coroutine s'exécute sans interruption : aucune autre ne peut modifier l'état qu'elle lit."
  - key: qcm-combien-de-run
    format: multiple-choice
    question: "Combien de fois appelle-t-on `asyncio.run` dans un programme asynchrone typique ?"
    choices:
      - {text: "Une fois, au point d'entrée, sur la coroutine principale", correct: true}
      - {text: "Une fois par coroutine qu'on veut exécuter", correct: false}
      - {text: "Une fois par `await` du programme", correct: false}
      - {text: "Jamais : la boucle démarre seule à l'import", correct: false}
    answer: "`asyncio.run(main())` crée la boucle et la ferme à la fin. À l'intérieur, on attend les coroutines avec `await` ; appeler `asyncio.run` depuis une coroutine lève une `RuntimeError`."
  - key: qcm-dix-mille-connexions
    format: multiple-choice
    question: "Pourquoi asyncio convient-il à 10 000 connexions réseau ouvertes en même temps ?"
    choices:
      - {text: "Une coroutine en attente coûte un petit objet Python, pas un thread système", correct: true}
      - {text: "asyncio répartit les connexions sur tous les cœurs de la machine", correct: false}
      - {text: "asyncio désactive le GIL pendant les entrées-sorties réseau", correct: false}
      - {text: "asyncio ouvre un processus par connexion, pour les isoler", correct: false}
    answer: "Dix mille threads coûteraient en mémoire et en bascules ; dix mille coroutines suspendues ne sont que des objets, que la boucle réveille quand leurs données arrivent."
  - key: trous-async-await
    format: fill-in
    question: |-
      Complète pour définir une coroutine qui attend une seconde :
      ```python
      ___ def patienter():
          ___ asyncio.sleep(1)
      ```
    blanks:
      - [async]
      - [await]
    answer: "`async def` définit la coroutine, `await` la suspend pendant l'attente."
  - key: trous-asyncio-run
    format: fill-in
    question: |-
      Complète le point d'entrée du programme :
      ```python
      async def main():
          ...

      asyncio.___(main())
      ```
    blanks:
      - [run]
    answer: "`asyncio.run` crée la boucle, exécute `main()` et la ferme."
  - key: trous-get-running-loop
    format: fill-in
    question: |-
      Dans une coroutine, complète pour obtenir la boucle d'événements en cours :
      ```python
      boucle = asyncio.___()
      ```
    blanks:
      - [get_running_loop]
    answer: "`asyncio.get_running_loop()` renvoie la boucle qui exécute la coroutine (une `RuntimeError` hors d'une boucle)."
  - key: trous-sleep-zero
    format: fill-in
    question: |-
      Complète pour rendre la main à la boucle, sans attendre de durée :
      ```python
      await asyncio.sleep(___)
      ```
    blanks:
      - ["0"]
    answer: "`asyncio.sleep(0)` suspend la coroutine juste le temps de laisser passer les autres."
  - key: code-type-coroutine
    format: code-output
    question: |-
      ```python
      async def saluer():
          print("bonjour")

      coro = saluer()
      print(type(coro).__name__)
      coro.close()
      ```
    answer: "L'appel crée un objet coroutine sans exécuter son corps : `bonjour` ne s'affiche jamais. `close()` évite l'avertissement d'une coroutine jamais attendue."
    check:
      output: "coroutine"
    choices:
      - {text: "`coroutine`", correct: true}
      - {text: "`function`", correct: false}
      - {text: "`NoneType`", correct: false}
      - {text: "`generator`", correct: false}
  - key: code-ordre-des-await
    format: code-output
    question: |-
      ```python
      import asyncio

      async def etape(nom):
          print(nom, end=" ")
          await asyncio.sleep(0)
          return nom.upper()

      async def main():
          a = await etape("a")
          b = await etape("b")
          print(a + b)

      asyncio.run(main())
      ```
    answer: "Chaque `await` attend la fin de l'étape avant de passer à la suivante : `a`, puis `b`, puis la concaténation des résultats."
    check:
      output: "a b AB"
    choices:
      - {text: "`a b AB`", correct: true}
      - {text: "`a b ab`", correct: false}
      - {text: "`AB a b`", correct: false}
      - {text: "`a AB b`", correct: false}
  - key: code-coroutine-attendue-plus-tard
    format: code-output
    question: |-
      ```python
      import asyncio

      async def interieur():
          print(2, end=" ")
          return 3

      async def main():
          print(1, end=" ")
          x = interieur()
          print(4, end=" ")
          print(await x)

      asyncio.run(main())
      ```
    answer: "`interieur()` crée la coroutine sans l'exécuter : son `print(2)` n'a lieu qu'au `await`, après le 4."
    check:
      output: "1 4 2 3"
    choices:
      - {text: "`1 4 2 3`", correct: true}
      - {text: "`1 2 4 3`", correct: false}
      - {text: "`1 2 3 4`", correct: false}
      - {text: "`1 4 3 2`", correct: false}
  - key: code-run-renvoie
    format: code-output
    question: |-
      ```python
      import asyncio

      async def doubler(x):
          await asyncio.sleep(0)
          return 2 * x

      async def main():
          return await doubler(10) + await doubler(11)

      print(asyncio.run(main()))
      ```
    answer: "`asyncio.run` renvoie la valeur de la coroutine principale : 20 + 22."
    check:
      output: "42"
    choices:
      - {text: "`42`", correct: true}
      - {text: "`None`", correct: false}
      - {text: "`21`", correct: false}
      - {text: "`2010`", correct: false}
  - key: bug-await-oublie
    format: bug-fix
    question: |-
      Ce programme affiche `début` puis `fin` sans aucune pause, et Python avertit :
      `RuntimeWarning: coroutine 'sleep' was never awaited`.
      ```python
      import asyncio

      async def main():
          print("début")
          asyncio.sleep(0.5)
          print("fin")

      asyncio.run(main())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`await asyncio.sleep(0.5)`", correct: true}
      - {text: "`asyncio.run(asyncio.sleep(0.5))`", correct: false}
      - {text: "`time.sleep(asyncio.sleep(0.5))`", correct: false}
      - {text: "`asyncio.sleep(0.5).close()`", correct: false}
    answer: |-
      ```python
      async def main():
          print("début")
          await asyncio.sleep(0.5)
          print("fin")
      ```
      Sans `await`, l'appel crée une coroutine que personne n'exécute. `asyncio.run` ne peut pas être appelé depuis une
      coroutine, où une boucle tourne déjà.
  - key: bug-main-sans-run
    format: bug-fix
    question: |-
      Ce programme n'affiche rien, et Python avertit : `RuntimeWarning: coroutine 'main' was never awaited`.
      ```python
      async def main():
          print("bonjour")

      main()
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`asyncio.run(main())`, après `import asyncio`", correct: true}
      - {text: "`await main()`, au niveau du module", correct: false}
      - {text: "`main().send(None)`, sans `import asyncio`", correct: false}
      - {text: "Retirer `async`, et garder l'appel `main()`", correct: false}
    answer: |-
      ```python
      import asyncio

      async def main():
          print("bonjour")

      asyncio.run(main())
      ```
      L'appel crée seulement la coroutine. `asyncio.run` crée la boucle et l'exécute. Un `await` au niveau du module
      est une `SyntaxError` dans un script.
  - key: bug-await-hors-fonction
    format: bug-fix
    question: |-
      Ce script ne démarre pas : `SyntaxError: 'await' outside function`.
      ```python
      import asyncio

      async def lire():
          await asyncio.sleep(0)
          return "données"

      contenu = await lire()
      print(contenu)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(asyncio.run(lire()))`, au niveau du module", correct: true}
      - {text: "`contenu = lire()`, puis `print(contenu)`", correct: false}
      - {text: "`contenu = async lire()`, puis `print(contenu)`", correct: false}
      - {text: "`contenu = await asyncio.run(lire())`", correct: false}
    answer: |-
      ```python
      import asyncio

      async def lire():
          await asyncio.sleep(0)
          return "données"

      print(asyncio.run(lire()))
      ```
      `await` n'existe que dans une `async def`. Au niveau du module, `asyncio.run` lance la coroutine et renvoie son
      résultat. `lire()` seul afficherait un objet coroutine.
  - key: bug-coroutine-dans-un-calcul
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: unsupported operand type(s) for +: 'coroutine' and 'int'` :
      ```python
      import asyncio

      async def compter():
          await asyncio.sleep(0)
          return 3

      async def main():
          total = compter() + 1
          print(total)

      asyncio.run(main())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`total = await compter() + 1`", correct: true}
      - {text: "`total = compter().result() + 1`", correct: false}
      - {text: "`total = asyncio.run(compter()) + 1`", correct: false}
      - {text: "`total = int(compter()) + 1`", correct: false}
    answer: |-
      ```python
      async def main():
          total = await compter() + 1
          print(total)
      ```
      `compter()` est une coroutine, pas un nombre : il faut l'attendre. `await` lie plus fort que `+`, d'où
      `await compter() + 1` qui vaut 4.
  - key: def-coroutine
    format: definition
    question: "Qu'est-ce qu'une coroutine, en Python ?"
    choices:
      - {text: "Une fonction qui peut se suspendre à un `await`, puis reprendre", correct: true}
      - {text: "Une fonction qui s'exécute dans son propre thread système", correct: false}
      - {text: "Une fonction qui renvoie plusieurs valeurs d'un coup", correct: false}
      - {text: "Une fonction appelée par le système à intervalles réguliers", correct: false}
    answer: "Définie par `async def`, elle garde son état pendant la suspension. La boucle d'événements la reprend quand ce qu'elle attend est prêt."
  - key: def-boucle-evenements
    format: definition
    question: "Qu'est-ce que la boucle d'événements (event loop) d'asyncio ?"
    choices:
      - {text: "Le planificateur qui reprend chaque coroutine dont l'attente est finie", correct: true}
      - {text: "Une boucle `while True` qu'on écrit pour relire les sockets", correct: false}
      - {text: "Un thread par coroutine, géré par le système d'exploitation", correct: false}
      - {text: "La file des exceptions levées par les coroutines du programme", correct: false}
    answer: "Elle surveille les entrées-sorties et les délais, et fait avancer les coroutines prêtes, une à la fois, dans un seul thread. `asyncio.run` la crée."
  - key: def-multitache-cooperatif
    format: definition
    question: "Que veut dire « multitâche coopératif » ?"
    choices:
      - {text: "Chaque tâche rend la main d'elle-même, à ses points d'attente", correct: true}
      - {text: "Le système interrompt les tâches à intervalles réguliers", correct: false}
      - {text: "Les tâches se répartissent les cœurs du processeur", correct: false}
      - {text: "Les tâches partagent leurs variables sans aucun verrou", correct: false}
    answer: "Contrairement aux threads, interrompus par l'interpréteur ou le système, une coroutine décide quand céder : à un `await`. Une coroutine qui ne cède jamais bloque les autres."
  - key: def-awaitable
    format: definition
    question: "Qu'est-ce qu'un « awaitable » ?"
    choices:
      - {text: "Un objet qu'on peut attendre avec `await` : coroutine, tâche ou futur", correct: true}
      - {text: "Une fonction ordinaire qu'asyncio exécute dans un thread", correct: false}
      - {text: "Une variable qu'une coroutine attend de voir changer", correct: false}
      - {text: "Un délai, en secondes, passé à `asyncio.sleep`", correct: false}
    answer: "Un awaitable définit `__await__`. Les coroutines, les `asyncio.Task` et les `asyncio.Future` en sont les trois sortes courantes."
