notion: queue-producteur-consommateur
lesson: |-
  `queue.Queue` est une **file sûre entre threads** : des producteurs y déposent du travail, des consommateurs l'en
  retirent, et la file fait elle-même la synchronisation. C'est la façon la plus simple de faire coopérer des threads
  sans partager de données modifiables.

  ```python
  import queue
  import threading

  file = queue.Queue(maxsize=100)
  FIN = None                               # la sentinelle

  def consommer():
      while True:
          element = file.get()             # bloque tant que la file est vide
          if element is FIN:
              break
          print("traité", element)

  consommateur = threading.Thread(target=consommer)
  consommateur.start()
  for i in range(3):
      file.put(i)                          # bloque si la file est pleine
  file.put(FIN)
  consommateur.join()
  ```

  | Méthode | Rôle |
  |---|---|
  | `put(x)` / `get()` | déposer / retirer ; bloquent si la file est pleine / vide |
  | `put_nowait(x)` / `get_nowait()` | sans attendre : lèvent `queue.Full` / `queue.Empty` |
  | `get(timeout=1)` | attend au plus une seconde, puis lève `queue.Empty` |
  | `task_done()` puis `join()` | le consommateur signale chaque élément traité ; `join` attend qu'ils le soient tous |
  | `shutdown()` (3.13) | ferme la file : `get` lève `queue.ShutDown` une fois la file vide |

  - **`maxsize`** borne la file : un producteur trop rapide attend que les consommateurs suivent (*backpressure*), au
    lieu de remplir la mémoire.
  - **Arrêter les consommateurs** : une **sentinelle** (`None`, ou un objet dédié) **par consommateur**, ou
    `shutdown()` depuis Python 3.13.
  - **Les variantes** : `LifoQueue` (le dernier entré sort le premier), `PriorityQueue` (le plus petit d'abord ; on y
    met des tuples `(priorité, élément)`), `SimpleQueue` (sans `maxsize` ni `task_done`).
  - **Ailleurs** : `asyncio.Queue` pour les coroutines (elle n'est pas sûre entre threads), `multiprocessing.Queue`
    entre processus.

  **En entretien** : « `queue.Queue` relie producteurs et consommateurs sans verrou à écrire : `put` et `get`
  bloquent quand il faut. `maxsize` freine un producteur trop rapide, et une sentinelle par consommateur, ou
  `shutdown`, les arrête proprement ; `task_done` et `join` attendent que tout soit traité. »
cards:
  - key: pourquoi-une-queue
    format: course
    question: "Pourquoi une `queue.Queue` plutôt qu'une liste partagée entre threads ?"
    choices:
      - {text: "Elle se synchronise seule, et `get` attend qu'un élément arrive", correct: true}
      - {text: "Elle copie chaque élément, pour que les threads ne le partagent pas", correct: false}
      - {text: "Elle est plus rapide qu'une liste pour toutes les opérations", correct: false}
      - {text: "Elle exécute elle-même le traitement de chaque élément déposé", correct: false}
    answer: "Une liste demanderait un verrou et une attente active (« la liste est-elle vide ? »). La file gère les deux : `get` dort jusqu'à ce qu'un élément arrive."
  - key: get-file-vide
    format: course
    question: "Que fait `file.get()` quand la file est vide ?"
    choices:
      - {text: "Il bloque jusqu'à ce qu'un producteur dépose un élément", correct: true}
      - {text: "Il renvoie `None` aussitôt, sans attendre", correct: false}
      - {text: "Il lève `queue.Empty` aussitôt, sans attendre", correct: false}
      - {text: "Il renvoie le dernier élément retiré de la file", correct: false}
    answer: "Par défaut, `get` attend. `get_nowait()`, ou `get(timeout=...)` une fois le délai passé, lèvent `queue.Empty`."
  - key: role-de-maxsize
    format: course
    question: "À quoi sert `queue.Queue(maxsize=100)` ?"
    choices:
      - {text: "À faire attendre un producteur trop rapide, au lieu de remplir la mémoire", correct: true}
      - {text: "À limiter le nombre de consommateurs qui lisent la file à 100", correct: false}
      - {text: "À jeter les éléments les plus anciens quand la file dépasse 100", correct: false}
      - {text: "À traiter les éléments par lots de 100, pour aller plus vite", correct: false}
    answer: "Quand la file est pleine, `put` bloque : le producteur avance au rythme des consommateurs. Sans borne, la file peut grossir sans fin."
  - key: arreter-les-consommateurs
    format: course
    question: "Comment arrêter proprement trois threads consommateurs ?"
    choices:
      - {text: "Déposer une sentinelle par consommateur, ou fermer la file avec `shutdown()`", correct: true}
      - {text: "Déposer une seule sentinelle, que les trois consommateurs verront", correct: false}
      - {text: "Appeler `file.join()`, qui arrête les threads qui lisent la file", correct: false}
      - {text: "Vider la file avec `get_nowait()`, ce qui réveille les consommateurs", correct: false}
    answer: "Chaque consommateur retire une seule sentinelle, puis s'arrête : il en faut autant que de consommateurs. Depuis Python 3.13, `shutdown()` fait lever `queue.ShutDown` à `get` une fois la file vide."
  - key: vf-sure-entre-threads
    format: true-false
    question: "`queue.Queue` est sûre entre threads, sans verrou supplémentaire."
    truth: true
    answer: "Elle a ses propres verrous et conditions : plusieurs producteurs et consommateurs peuvent appeler `put` et `get` en même temps."
  - key: vf-get-renvoie-none
    format: true-false
    question: "`file.get()` sur une file vide renvoie `None`."
    truth: false
    answer: "Il bloque jusqu'à l'arrivée d'un élément. C'est pourquoi on dépose une sentinelle pour réveiller un consommateur et l'arrêter."
  - key: vf-trois-sentinelles
    format: true-false
    question: "Avec trois consommateurs qui s'arrêtent chacun sur `None`, le producteur doit déposer trois `None`."
    truth: true
    answer: "Le premier consommateur qui retire le `None` s'arrête ; les deux autres attendraient pour toujours sans leur propre sentinelle."
  - key: vf-asyncio-queue-threads
    format: true-false
    question: "`asyncio.Queue` peut être partagée sans risque entre plusieurs threads."
    truth: false
    answer: "Elle est faite pour les coroutines d'une même boucle, et n'est pas sûre entre threads. Entre threads, `queue.Queue` ; entre processus, `multiprocessing.Queue`."
  - key: qcm-plus-petit-d-abord
    format: multiple-choice
    question: "Quelle file rend l'élément le plus petit en premier ?"
    choices:
      - {text: "`queue.PriorityQueue`", correct: true}
      - {text: "`queue.LifoQueue`", correct: false}
      - {text: "`queue.Queue`", correct: false}
      - {text: "`queue.SimpleQueue`", correct: false}
    answer: "`PriorityQueue` garde un tas : on y dépose des tuples `(priorité, élément)`. `LifoQueue` rend le dernier entré, les deux autres le premier entré."
  - key: qcm-put-file-pleine
    format: multiple-choice
    question: "Que fait `file.put(x)` sur une `Queue(maxsize=5)` pleine ?"
    choices:
      - {text: "Il bloque jusqu'à ce qu'une place se libère", correct: true}
      - {text: "Il lève `queue.Full` aussitôt, sans attendre", correct: false}
      - {text: "Il remplace l'élément le plus ancien de la file", correct: false}
      - {text: "Il agrandit la file d'une place supplémentaire", correct: false}
    answer: "C'est `put_nowait` qui lève `queue.Full`. Par défaut, `put` attend : le producteur ralentit au rythme des consommateurs."
  - key: qcm-role-de-join
    format: multiple-choice
    question: "À quoi sert `file.join()` ?"
    choices:
      - {text: "À attendre que chaque élément déposé ait été marqué par `task_done()`", correct: true}
      - {text: "À attendre la fin de tous les threads qui ont lu dans la file", correct: false}
      - {text: "À fusionner deux files en une seule, dans l'ordre de dépôt", correct: false}
      - {text: "À fermer la file, pour que `get` lève une exception", correct: false}
    answer: "Chaque `put` augmente un compteur de tâches, chaque `task_done` le diminue ; `join` attend qu'il revienne à zéro. Sans `task_done`, `join` attend pour toujours."
  - key: qcm-entre-processus
    format: multiple-choice
    question: "Quelle file relie deux processus ?"
    choices:
      - {text: "`multiprocessing.Queue`", correct: true}
      - {text: "`queue.Queue`", correct: false}
      - {text: "`asyncio.Queue`", correct: false}
      - {text: "`collections.deque`", correct: false}
    answer: "Les processus ne partagent pas leur mémoire : `multiprocessing.Queue` sérialise les éléments et les fait passer par un tube. `queue.Queue` ne relie que des threads d'un même processus."
