      ```python
      import queue

      file = queue.Queue(maxsize=2)
      file.put("a")
      file.put("b")
      print(file.full(), file.qsize())
      file.get()
      file.get()
      file.get_nowait()
      ```
    answer: "La file est pleine avec deux éléments. Une fois vidée, `get_nowait` ne peut pas attendre : il lève `queue.Empty`, que Python nomme `_queue.Empty` dans la trace."
    check:
      output: "True 2"
      throws: _queue.Empty
    choices:
      - {text: "`True 2`, puis une exception `_queue.Empty`", correct: true}
      - {text: "`True 2`, puis le programme attend pour toujours", correct: false}
      - {text: "`False 2`, puis une exception `_queue.Empty`", correct: false}
      - {text: "`True 2`, sans erreur : `get_nowait` renvoie `None`", correct: false}
  - key: bug-consommateur-sans-fin
    format: bug-fix
    question: |-
      Ce programme affiche `0`, `1` et `2`, puis ne se termine jamais :
      ```python
      import queue
      import threading

      file = queue.Queue()

      def consommer():
          while True:
              print(file.get())

      t = threading.Thread(target=consommer)
      t.start()
      for i in range(3):
          file.put(i)
      t.join()
      print("fin")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Déposer `None` à la fin, et sortir de la boucle en le recevant", correct: true}
      - {text: "Appeler `file.join()` au lieu de `t.join()` à la fin", correct: false}
      - {text: "Remplacer `file.get()` par `file.get_nowait()` dans la boucle", correct: false}
      - {text: "Créer la file avec `queue.Queue(maxsize=3)`", correct: false}
    answer: |-
      ```python
      def consommer():
          while (element := file.get()) is not None:
              print(element)

      t = threading.Thread(target=consommer)
      t.start()
      for i in range(3):
          file.put(i)
      file.put(None)
      t.join()
      print("fin")
      ```
      Le consommateur attend un quatrième élément qui ne vient jamais, et `t.join()` l'attend. La sentinelle le
      réveille et l'arrête. `file.join()` attendrait des `task_done` qui ne viennent pas, et `get_nowait` arrêterait
      le consommateur dès que la file est vide.
  - key: bug-task-done-oublie
    format: bug-fix
    question: |-
      Ce programme affiche `traité 0` et `traité 1`, puis reste bloqué sur `file.join()` :
      ```python
      import queue
      import threading

      file = queue.Queue()

      def consommer():
          while True:
              element = file.get()
              print("traité", element)

      threading.Thread(target=consommer, daemon=True).start()
      for i in range(2):
          file.put(i)
      file.join()
      print("tout est traité")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `file.task_done()` après chaque élément traité", correct: true}
      - {text: "Créer le consommateur sans `daemon=True`", correct: false}
      - {text: "Appeler `file.join()` avant les `put`", correct: false}
      - {text: "Remplacer `file.join()` par `file.get()`", correct: false}
    answer: |-
      ```python
      def consommer():
          while True:
              element = file.get()
              print("traité", element)
              file.task_done()
      ```
      `join` attend que le compteur de tâches revienne à zéro : chaque `put` l'augmente, seul `task_done` le
      diminue.
  - key: bug-get-nowait-trop-tot
    format: bug-fix
    question: |-
      Le consommateur s'arrête aussitôt sur une exception `_queue.Empty`, et rien n'est traité :
      ```python
      import queue
      import threading
      import time

      file = queue.Queue()

      def consommer():
          while (element := file.get_nowait()) is not None:
              print("traité", element)

      t = threading.Thread(target=consommer)
      t.start()
      time.sleep(0.1)  # le producteur prépare ses données
      for i in range(2):
          file.put(i)
      file.put(None)
      t.join()
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Remplacer `file.get_nowait()` par `file.get()`, qui attend", correct: true}
      - {text: "Remplacer `file.get_nowait()` par `file.get(timeout=0)`", correct: false}
      - {text: "Retirer la sentinelle `None` déposée à la fin", correct: false}
      - {text: "Lancer le consommateur avec `daemon=True`", correct: false}
    answer: |-
      ```python
      def consommer():
          while (element := file.get()) is not None:
              print("traité", element)
      ```
      La file est encore vide quand le consommateur démarre : `get_nowait` ne patiente pas et lève `queue.Empty`.
      `get()` dort jusqu'à l'arrivée d'un élément. `timeout=0` ne patienterait pas davantage.
  - key: bug-file-bornee-pleine
    format: bug-fix
    question: |-
      Ce programme ne se termine jamais, et n'affiche rien :
      ```python
      import queue

      file = queue.Queue(maxsize=2)
      for i in range(3):
          file.put(i)
      print("rempli")
      while not file.empty():
          print(file.get())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Consommer dans un autre thread pendant que celui-ci dépose", correct: true}
      - {text: "Appeler `file.task_done()` après chaque `put`", correct: false}
      - {text: "Appeler `file.join()` avant la boucle de lecture", correct: false}
      - {text: "Remplacer `file.put(i)` par `file.put(i, block=True)`", correct: false}
    answer: |-
      ```python
      import queue
      import threading

      file = queue.Queue(maxsize=2)

      def consommer():
          while (element := file.get()) is not None:
              print(element)

      t = threading.Thread(target=consommer)
      t.start()
      for i in range(3):
          file.put(i)
      file.put(None)
      t.join()
      ```
      Le troisième `put` attend une place que seul un consommateur peut libérer, et le seul thread est celui qui
      attend. Une file bornée suppose que quelqu'un d'autre la vide en même temps.
