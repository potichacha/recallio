  - key: code-somme-avec-sentinelle
    format: code-output
    question: |-
      ```python
      import queue
      import threading

      file = queue.Queue()
      total = 0

      def consommer():
          global total
          while (n := file.get()) is not None:
              total += n

      t = threading.Thread(target=consommer)
      t.start()
      for n in [1, 2, 3, 4, 5]:
          file.put(n)
      file.put(None)
      t.join()
      print("total", total)
      ```
    answer: "Le consommateur additionne les cinq nombres, puis s'arrête sur la sentinelle `None` ; `join` attend qu'il ait fini."
    check:
      output: "total 15"
    choices:
      - {text: "`total 15`", correct: true}
      - {text: "`total 0`", correct: false}
      - {text: "`total 10`", correct: false}
      - {text: "Rien : le consommateur attend pour toujours", correct: false}
  - key: code-priority-queue
