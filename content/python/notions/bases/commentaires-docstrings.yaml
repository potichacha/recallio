notion: commentaires-docstrings
lesson: |-
  **Un commentaire** commence par `#` et va jusqu'à la fin de la ligne. Python n'a pas de commentaire sur plusieurs
  lignes, comme `/* ... */` en Java : on met un `#` en tête de chaque ligne (les éditeurs le font d'un raccourci).

  ```python
  # Le taux est fixé par la loi de finances.
  TAUX_TVA = 0.2  # un commentaire en fin de ligne : deux espaces avant le #
  ```

  Un bon commentaire dit **pourquoi**, pas ce que le code dit déjà : « # ajoute 1 à i » n'apprend rien.

  **Une docstring** est une chaîne littérale placée en **première instruction** d'un module, d'une fonction, d'une
  classe ou d'une méthode. Python la garde dans l'attribut `__doc__`, et `help()` l'affiche :

  ```python
  def prix_ttc(prix_ht, taux=0.2):
      """Renvoie le prix toutes taxes comprises.

      Le taux s'exprime en fraction : 0.2 pour 20 %.
      """
      return prix_ht * (1 + taux)

  print(prix_ttc.__doc__)
  help(prix_ttc)
  ```

  Les conventions (PEP 257) :

  - des **triples guillemets doubles** `"""`, même sur une ligne ;
  - une première ligne qui résume, en phrase terminée par un point ;
  - si besoin, une ligne vide, puis le détail (paramètres, valeur renvoyée, exceptions). Les styles Google, NumPy ou
    reStructuredText organisent ce détail.

  Une chaîne entre triples guillemets **ailleurs** que la première instruction n'est pas une docstring : c'est une
  expression qu'on calcule puis qu'on oublie. On s'en sert parfois pour « commenter » un bloc, mais ce n'est pas un
  commentaire.

  Depuis Python 3, un fichier source est lu en **UTF-8** par défaut : la vieille ligne `# -*- coding: utf-8 -*-` est
  inutile.

  **En entretien** : « Un commentaire commence par `#` et explique pourquoi ; il n'y a pas de commentaire multiligne.
  Une docstring est la chaîne en tête d'un module, d'une fonction ou d'une classe : elle est gardée dans `__doc__` et
  affichée par `help()`. PEP 257 en fixe les conventions : triples guillemets doubles, une ligne de résumé. »
tour:
  - title: Commentaires et docstrings
    text: |-
      Un commentaire commence par `#` et court jusqu'au bout de la ligne ; Python l'ignore.

      Une **docstring**, elle, est gardée : c'est la chaîne placée en première ligne d'une fonction (ou d'un module,
      d'une classe). Python la range dans l'attribut `__doc__`, et la fonction `help()` l'affiche. Les outils de
      documentation et les éditeurs s'en servent aussi.

      Essaie : ajoute `help(aire_rectangle)` à la fin du programme.
    example:
      files:
        main.py: |-
          # Un commentaire va jusqu'à la fin de la ligne.


          def aire_rectangle(largeur, hauteur):
              """Renvoie l'aire d'un rectangle."""
              return largeur * hauteur  # largeur fois hauteur


          print(aire_rectangle(3, 4))
          print(aire_rectangle.__doc__)
      output: |-
        12
        Renvoie l'aire d'un rectangle.
cards:
  - key: syntaxe-commentaire
    format: course
    question: Comment écrit-on un commentaire en Python ?
    choices:
      - {text: "Avec `#`, jusqu'à la fin de la ligne", correct: true}
      - {text: "Avec `//`, jusqu'à la fin de la ligne", correct: false}
      - {text: "Entre `/*` et `*/`, sur plusieurs lignes", correct: false}
      - {text: "Avec `--`, jusqu'à la fin de la ligne", correct: false}
    answer: "`#` commente le reste de la ligne. Il n'existe pas de commentaire sur plusieurs lignes : on répète `#`."
  - key: ce-qui-fait-une-docstring
    format: course
    question: Qu'est-ce qui fait d'une chaîne une docstring ?
    choices:
      - {text: "Elle est la première instruction du module, de la fonction ou de la classe", correct: true}
      - {text: "Elle est écrite entre triples guillemets, à n'importe quel endroit du code", correct: false}
      - {text: "Elle commence par `@doc`, comme une annotation de documentation", correct: false}
      - {text: "Elle suit le mot-clé `doc`, juste avant la définition de la fonction", correct: false}
    answer: "Seule la position compte : la première instruction du corps. Les triples guillemets ne sont qu'une convention (PEP 257)."
  - key: ou-va-la-docstring
    format: course
    question: Où Python range-t-il la docstring d'une fonction ?
    choices:
      - {text: "Dans l'attribut `__doc__` de la fonction", correct: true}
      - {text: "Nulle part : il l'ignore, comme un commentaire", correct: false}
      - {text: "Dans un fichier `.pyc` à part, à côté du module", correct: false}
      - {text: "Dans l'attribut `__annotations__` de la fonction", correct: false}
    answer: "`fonction.__doc__` la contient ; `help(fonction)` l'affiche, avec la signature."
  - key: bon-commentaire
    format: course
    question: Que doit expliquer un bon commentaire ?
    choices:
      - {text: "Pourquoi le code fait ce qu'il fait, ce que le code seul ne dit pas", correct: true}
      - {text: "Ce que fait chaque ligne, en paraphrasant le code en français", correct: false}
      - {text: "L'historique des modifications du fichier, avec leurs dates", correct: false}
      - {text: "Le nom de l'auteur de chaque fonction, et sa date d'écriture", correct: false}
    answer: "Le code dit déjà comment. Le commentaire garde la raison : une règle métier, un contournement, un piège évité. L'historique, c'est le rôle de Git."
  - key: vf-commentaire-multiligne
    format: true-false
    question: Python a une syntaxe de commentaire sur plusieurs lignes, comme `/* ... */` en Java.
    truth: false
    answer: "On met un `#` en tête de chaque ligne. Une chaîne entre triples guillemets isolée n'est pas un commentaire, mais une expression ignorée."
  - key: vf-help-docstring
    format: true-false
    question: "`help(ma_fonction)` affiche la docstring de `ma_fonction`."
    truth: true
    answer: "`help` affiche la signature de la fonction, puis sa docstring. C'est aussi ce que montrent les éditeurs au survol."
  - key: vf-docstring-milieu
    format: true-false
    question: Une chaîne entre triples guillemets placée au milieu d'une fonction devient sa docstring.
    truth: false
    answer: "Seule la première instruction du corps est la docstring. Plus loin, la chaîne est une expression calculée puis oubliée."
  - key: vf-utf8-defaut
    format: true-false
    question: En Python 3, un fichier source est lu en UTF-8 par défaut, sans déclaration d'encodage.
    truth: true
    answer: "Depuis Python 3 (PEP 3120). La ligne `# -*- coding: utf-8 -*-` ne sert plus que pour un autre encodage."
  - key: qcm-attribut-doc
    format: multiple-choice
    question: Quel attribut contient la docstring d'une fonction `f` ?
    choices:
      - {text: "`f.__doc__`", correct: true}
      - {text: "`f.doc`", correct: false}
      - {text: "`f.__help__`", correct: false}
      - {text: "`f.__comment__`", correct: false}
    answer: "Les attributs spéciaux s'écrivent entre doubles soulignés : `__doc__`, `__name__`, `__module__`."
  - key: qcm-pep-257
    format: multiple-choice
    question: Quelle PEP fixe les conventions des docstrings ?
    choices:
      - {text: "PEP 257", correct: true}
      - {text: "PEP 8", correct: false}
      - {text: "PEP 20", correct: false}
      - {text: "PEP 484", correct: false}
    answer: "PEP 257 pour les docstrings. PEP 8 est le guide de style, PEP 20 le Zen of Python, PEP 484 les annotations de type."
  - key: qcm-docstring-conforme
    format: multiple-choice
    question: Quelle docstring d'une ligne suit les conventions de PEP 257 ?
    choices:
      - {text: "`\"\"\"Renvoie le prix TTC.\"\"\"`", correct: true}
      - {text: "`'''renvoie le prix ttc'''`", correct: false}
      - {text: "`# Renvoie le prix TTC.`", correct: false}
      - {text: "`\"renvoie le prix TTC\"`", correct: false}
    answer: "Des triples guillemets doubles, même sur une ligne, et une phrase qui commence par une majuscule et finit par un point. Un commentaire `#` n'est pas une docstring."
  - key: qcm-desactiver-lignes
    format: multiple-choice
    question: Comment désactive-t-on temporairement plusieurs lignes de code ?
    choices:
      - {text: "En mettant un `#` au début de chaque ligne", correct: true}
      - {text: "En les entourant de `/*` et `*/`", correct: false}
      - {text: "En les entourant de `<!--` et `-->`", correct: false}
      - {text: "En les faisant précéder de `#if 0`", correct: false}
    answer: "Les éditeurs le font d'un raccourci (souvent Ctrl+/). Les autres syntaxes viennent de C, de HTML ou du préprocesseur C."
  - key: trous-docstring
    format: fill-in
    question: |-
      Complète pour que la fonction ait une docstring :
      ```python
      def tva(prix):
          ___Renvoie la TVA à 20 %.___
          return prix * 0.2
      ```
    blanks:
      - ['"""', "'''"]
      - ['"""', "'''"]
    answer: "Des triples guillemets ; PEP 257 recommande les doubles, `\"\"\"`."
  - key: trous-diese
    format: fill-in
    question: |-
      Complète le commentaire de fin de ligne :
      ```python
      prix = 10  ___ en euros
      ```
    blanks: [["#"]]
    answer: "`#` commente la fin de la ligne. PEP 8 demande deux espaces avant lui."
  - key: trous-attribut-doc
    format: fill-in
    question: |-
      Complète pour afficher la docstring de `tva` :
      ```python
      print(tva.___)
      ```
    blanks: [[__doc__]]
    answer: "`__doc__` contient la docstring, ou `None` si la fonction n'en a pas."
  - key: trous-help
    format: fill-in
    question: |-
      Complète pour afficher l'aide de la fonction `tva` :
      ```python
      ___(tva)
      ```
    blanks: [[help]]
    answer: "`help` affiche la signature et la docstring ; dans l'interpréteur interactif, page par page."
