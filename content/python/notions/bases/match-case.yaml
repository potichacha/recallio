notion: match-case
lesson: |-
  Depuis Python 3.10 (PEP 634), **`match`** compare une valeur, le **sujet**, à une suite de **motifs** (`case`). Le
  premier motif qui correspond s'exécute, et c'est tout : **pas de passage au suivant** (fallthrough), pas de `break`.
  Si aucun ne correspond, rien ne se passe, sans erreur.

  ```python
  match commande.split():
      case ["quitter"]:
          arreter()
      case ["aller", direction]:              # capture le second mot
          aller(direction)
      case ["prendre", *objets]:              # capture le reste dans une liste
          prendre(objets)
      case _:                                 # le joker : tout le reste
          print("commande inconnue")
  ```

  | Motif | Correspond à |
  |---|---|
  | `200`, `"GET"`, `None` | une valeur littérale (comparée avec `==`, ou `is` pour `None`, `True`, `False`) |
  | `401 \| 403` | l'une ou l'autre |
  | `x` (un nom seul) | **n'importe quoi**, capturé dans `x` |
  | `_` | n'importe quoi, sans capture |
  | `Couleur.ROUGE` (un nom pointé) | la valeur de cette constante |
  | `[x, y]`, `[premier, *reste]` | une séquence (liste, tuple ; **pas une chaîne**) de cette forme |
  | `{"type": "clic", "x": x}` | un dictionnaire qui a **au moins** ces clés |
  | `Point(x=0, y=y)`, `int()`, `str(s)` | une instance de la classe, avec ces attributs |
  | `case n if n < 0:` | le motif, plus une **garde** |
  | `case [x, y] as paire:` | le motif, et la valeur entière dans `paire` |

  **Le piège principal** : un nom seul **capture**, il ne compare pas. `case ROUGE:` affecte le sujet à `ROUGE` et
  correspond toujours. Pour comparer à une constante, on utilise un nom pointé (`Couleur.ROUGE`, `HTTPStatus.OK`), un
  littéral ou une garde. Python refuse d'ailleurs un motif qui attrape tout s'il n'est pas le dernier : « name capture
  'ROUGE' makes remaining patterns unreachable », ou « wildcard makes remaining patterns unreachable » pour `_`.

  - `case 401, 403:` n'est pas une alternative : c'est un motif de **séquence** de deux éléments. On écrit `401 | 403`.
  - Les motifs se testent dans l'ordre : le plus précis d'abord.
  - `match` et `case` sont des mots-clés « doux » : on peut encore les utiliser comme noms de variables.

  **En entretien** : « `match` filtre par motifs : littéraux, séquences, dictionnaires, classes, avec captures et gardes.
  Le premier `case` qui correspond s'exécute, sans fallthrough. Piège : un nom seul capture au lieu de comparer ; pour
  une constante, un nom pointé. »
cards:
  - key: aucun-case
    format: course
    question: Que se passe-t-il si aucun `case` d'un `match` ne correspond ?
    choices:
      - {text: "Rien : le programme continue après le `match`", correct: true}
      - {text: "Python lève une `MatchError`", correct: false}
      - {text: "Le dernier `case` s'exécute par défaut", correct: false}
      - {text: "Python lève une `ValueError`", correct: false}
    answer: "Contrairement à d'autres langages, un `match` non exhaustif n'est pas une erreur. Pour traiter le reste, on termine par `case _:`."
  - key: nom-seul-capture
    format: course
    question: Que fait le motif `case x:` (un nom seul) dans un `match` ?
    choices:
      - {text: "Il capture n'importe quelle valeur dans la variable `x`", correct: true}
      - {text: "Il compare le sujet à la valeur de la variable `x`", correct: false}
      - {text: "Il correspond seulement si le sujet s'appelle `x`", correct: false}
      - {text: "Il vérifie que `x` existe avant de comparer", correct: false}
    answer: "Un nom seul est un motif de capture : il correspond toujours et lie le sujet au nom. C'est le piège le plus fréquent de `match`."
  - key: comparer-constante
    format: course
    question: Dans un `case`, comment comparer le sujet à une constante plutôt que de le capturer ?
    choices:
      - {text: "Utiliser un nom pointé, comme `Couleur.ROUGE`, ou une garde", correct: true}
      - {text: "Écrire le nom de la constante en majuscules : `ROUGE`", correct: false}
      - {text: "Mettre le nom entre parenthèses : `case (ROUGE):`", correct: false}
      - {text: "Préfixer le nom par `==` : `case == ROUGE:`", correct: false}
    answer: "Un nom qui contient un point est un motif de valeur, comparé avec `==`. Les majuscules ne changent rien : `case ROUGE:` capture."
  - key: fallthrough
    format: course
    question: Y a-t-il un passage au `case` suivant (fallthrough), comme dans un `switch` en C ?
    choices:
      - {text: "Non : seul le premier `case` qui correspond s'exécute", correct: true}
      - {text: "Oui, sauf si le `case` se termine par `break`", correct: false}
      - {text: "Oui : tous les `case` qui correspondent s'exécutent", correct: false}
      - {text: "Non, mais chaque `case` doit finir par `break`", correct: false}
    answer: "Pas de fallthrough et pas de `break` à écrire. Pour partager un traitement, on regroupe les motifs avec `|`."
  - key: vf-version
    format: true-false
    question: "`match` est disponible depuis Python 3.10."
    truth: true
    answer: "Le filtrage par motifs vient des PEP 634 à 636, livrées avec Python 3.10."
  - key: vf-joker-dernier
    format: true-false
    question: Placé avant d'autres `case`, le motif `_` rend ceux-ci inatteignables, et Python refuse le code.
    truth: true
    answer: "Python lève une `SyntaxError` : « wildcard makes remaining patterns unreachable ». Il en va de même pour un nom seul."
  - key: vf-chaine-sequence
    format: true-false
    question: |-
      Le motif `[x, y]` correspond à la chaîne `"ab"`.
    truth: false
    answer: "Les motifs de séquence excluent volontairement `str`, `bytes` et `bytearray`. Ils correspondent aux listes, tuples et autres séquences."
  - key: vf-cles-en-plus
    format: true-false
    question: |-
      Le motif `{"type": "clic"}` ne correspond qu'à un dictionnaire dont la seule clé est `"type"`.
    truth: false
    answer: "Un motif de dictionnaire exige au moins les clés citées ; les autres sont ignorées. `**reste` permet de les capturer."
  - key: qcm-alternative
    format: multiple-choice
    question: Comment regrouper plusieurs valeurs dans un même `case` ?
    choices:
      - {text: "`case 401 | 403:`", correct: true}
      - {text: "`case 401, 403:`", correct: false}
      - {text: "`case 401 or 403:`", correct: false}
      - {text: "`case [401, 403]:`", correct: false}
    answer: "`|` sépare les alternatives. `case 401, 403:` et `case [401, 403]:` attendent une séquence de deux éléments ; `or` est une `SyntaxError`."
  - key: qcm-premier-et-reste
    format: multiple-choice
    question: Quel motif correspond à une liste d'au moins un élément, en capturant le premier à part ?
    choices:
      - {text: "`case [premier, *reste]:`", correct: true}
      - {text: "`case [premier, reste]:`", correct: false}
      - {text: "`case premier + reste:`", correct: false}
      - {text: "`case [*premier, reste]:`", correct: false}
    answer: "`*reste` capture les éléments restants dans une liste, éventuellement vide. `[premier, reste]` exige exactement deux éléments."
  - key: qcm-garde
    format: multiple-choice
    question: Comment ajouter une condition à un `case` ?
    choices:
      - {text: "`case n if n < 0:`", correct: true}
      - {text: "`case n where n < 0:`", correct: false}
      - {text: "`case n and n < 0:`", correct: false}
      - {text: "`case n < 0:`", correct: false}
    answer: "Une garde `if` suit le motif : le `case` ne s'exécute que si le motif correspond et que la garde est vraie."
  - key: qcm-type-entier
    format: multiple-choice
    question: Quel motif teste que le sujet est un entier, sans le comparer à une valeur ?
    choices:
      - {text: "`case int():`", correct: true}
      - {text: "`case int:`", correct: false}
      - {text: "`case type(int):`", correct: false}
      - {text: "`case isinstance(int):`", correct: false}
    answer: "`int()` est un motif de classe : il teste `isinstance(sujet, int)`. `case int:` est un nom seul : il capture tout, et masque le type `int`."
  - key: trous-match-case
    format: fill-in
    question: |-
      Complète le filtrage d'un code HTTP :
      ```python
      ___ code:
          ___ 200:
              print("OK")
          case 404:
              print("introuvable")
      ```
    blanks: [[match], [case]]
    answer: "`match` introduit le sujet, chaque `case` un motif."
  - key: trous-joker
    format: fill-in
    question: |-
      Complète le cas par défaut :
      ```python
      match commande:
          case "start":
              demarrer()
          case ___:
              print("commande inconnue")
      ```
    blanks: [[_]]
    answer: "`_` correspond à tout, sans rien capturer. Il se place en dernier."
  - key: trous-garde
    format: fill-in
    question: |-
      Complète la garde qui ne retient que les entiers négatifs :
      ```python
      match valeur:
          case int(n) ___ n < 0:
              print("négatif")
      ```
    blanks: [[if]]
    answer: "Une garde `if` ajoute une condition au motif ; elle peut utiliser les noms capturés."
  - key: trous-reste
    format: fill-in
    question: |-
      Complète pour capturer tous les mots après « go » :
      ```python
      match commande.split():
          case ["go", ___directions]:
              print(directions)
      ```
    blanks: [["*"]]
    answer: "`*directions` capture les éléments restants dans une liste."
  - key: code-point-axe
    format: code-output
    question: |-
      ```python
      point = (0, 5)
      match point:
          case (0, 0):
              print("origine")
          case (0, y):
              print("sur l'axe y en", y)
          case (x, 0):
              print("sur l'axe x en", x)
          case _:
              print("ailleurs")
      ```
    check:
      output: "sur l'axe y en 5"
    choices:
      - {text: "`sur l'axe y en 5`", correct: true}
      - {text: "`origine`", correct: false}
      - {text: "`ailleurs`", correct: false}
      - {text: "`sur l'axe x en 0`", correct: false}
    answer: "Le premier élément vaut 0 et le second ne vaut pas 0 : le deuxième motif correspond, et capture 5 dans `y`."
  - key: code-commande-options
    format: code-output
    question: |-
      ```python
      commande = "aller nord vite"
      match commande.split():
          case ["aller", direction]:
              print("direction", direction)
          case ["aller", *options]:
              print("options", options)
          case _:
              print("inconnue")
      ```
    check:
      output: "options ['nord', 'vite']"
    choices:
      - {text: "`options ['nord', 'vite']`", correct: true}
      - {text: "`direction nord`", correct: false}
      - {text: "`inconnue`", correct: false}
      - {text: "`options nord vite`", correct: false}
    answer: "Trois mots : `[\"aller\", direction]` en attend deux exactement. Le motif suivant capture le reste dans une liste."
  - key: code-capture-constante
    format: code-output
    question: |-
      ```python
      ROUGE = "rouge"
      couleur = "vert"
      match couleur:
          case "bleu":
              print("froid")
          case ROUGE:
              print("chaud", ROUGE)
      ```
    check:
      output: "chaud vert"
    choices:
      - {text: "`chaud vert`", correct: true}
      - {text: "`chaud rouge`", correct: false}
      - {text: "`froid`", correct: false}
      - {text: "Rien", correct: false}
    answer: "`case ROUGE:` est un nom seul : il capture le sujet et correspond toujours. `ROUGE` vaut désormais `\"vert\"`."
  - key: code-dict-garde
    format: code-output
    question: |-
      ```python
      evenement = {"type": "achat", "montant": 120, "devise": "EUR"}
      match evenement:
          case {"type": "achat", "montant": m} if m > 100:
              print("gros achat", m)
          case {"type": "achat"}:
              print("achat")
          case _:
              print("autre")
      ```
    check:
      output: "gros achat 120"
    choices:
      - {text: "`gros achat 120`", correct: true}
      - {text: "`achat`", correct: false}
      - {text: "`autre`", correct: false}
      - {text: "Rien", correct: false}
    answer: "La clé `devise` en plus ne gêne pas : le motif exige seulement ses clés. La garde `m > 100` est vraie."
  - key: bug-constantes-capturees
    format: bug-fix
    question: |-
      Python refuse ce code : « name capture 'OK' makes remaining patterns unreachable ». Quelle correction est la bonne ?
      ```python
      OK = 200
      INTROUVABLE = 404

      code = 404
      match code:
          case OK:
              print("succès")
          case INTROUVABLE:
              print("introuvable")
      ```
    choices:
      - {text: "Des noms pointés : `case HTTPStatus.OK:`, ou les littéraux", correct: true}
      - {text: "Écrire `case == OK:` pour forcer une comparaison", correct: false}
      - {text: "Mettre les noms entre guillemets : `case \"OK\":`", correct: false}
      - {text: "Déclarer `global OK` juste avant le `match`", correct: false}
    answer: |-
      ```python
      from http import HTTPStatus

      match code:
          case HTTPStatus.OK:
              print("succès")
          case HTTPStatus.NOT_FOUND:
              print("introuvable")
      ```
      Un nom seul capture le sujet : `case OK:` attrape tout, d'où l'erreur. Un nom pointé est comparé avec `==`, et `HTTPStatus.NOT_FOUND == 404`.
  - key: bug-joker-en-premier
    format: bug-fix
    question: |-
      Python refuse ce code : « wildcard makes remaining patterns unreachable ». Quelle correction est la bonne ?
      ```python
      commande = "quitter"
      match commande:
          case _:
              print("commande inconnue")
          case "quitter":
              print("au revoir")
      ```
    choices:
      - {text: "Placer `case _:` en dernier", correct: true}
      - {text: "Remplacer `case _:` par `case *:`", correct: false}
      - {text: "Ajouter `break` à la fin de `case _:`", correct: false}
      - {text: "Remplacer `case _:` par `else:`", correct: false}
    answer: |-
      ```python
      match commande:
          case "quitter":
              print("au revoir")
          case _:
              print("commande inconnue")
      ```
      `_` correspond à tout : placé en premier, il rendrait les motifs suivants inutiles, et Python le refuse.
  - key: bug-virgule-alternative
    format: bug-fix
    question: |-
      Le code 403 affiche « autre » au lieu de « refusé ». Quelle correction est la bonne ?
      ```python
      code = 403
      match code:
          case 401, 403:
              print("refusé")
          case _:
              print("autre")
      ```
    choices:
      - {text: "`case 401 | 403:`", correct: true}
      - {text: "`case 401 or 403:`", correct: false}
      - {text: "`case (401, 403):`", correct: false}
      - {text: "`case [401, 403]:`", correct: false}
    answer: |-
      ```python
      match code:
          case 401 | 403:
              print("refusé")
      ```
      `401, 403` est un motif de séquence : il attend un tuple ou une liste de deux éléments, pas l'entier 403. `or` est une `SyntaxError` dans un motif.
  - key: bug-ordre-motifs
    format: bug-fix
    question: |-
      « vers le nord » ne s'affiche jamais, même pour la commande `["aller", "nord"]`. Quelle correction est la bonne ?
      ```python
      commande = ["aller", "nord"]
      match commande:
          case ["aller", *reste]:
              print("déplacement")
          case ["aller", "nord"]:
              print("vers le nord")
      ```
    choices:
      - {text: "Placer le motif `[\"aller\", \"nord\"]` avant le motif général", correct: true}
      - {text: "Ajouter `case _:` entre les deux motifs existants", correct: false}
      - {text: "Remplacer `*reste` par `**reste` dans le premier motif", correct: false}
      - {text: "Ajouter un `continue` à la fin du premier `case`", correct: false}
    answer: |-
      ```python
      match commande:
          case ["aller", "nord"]:
              print("vers le nord")
          case ["aller", *reste]:
              print("déplacement")
      ```
      Le premier motif qui correspond gagne, et `["aller", *reste]` correspond aussi à `["aller", "nord"]`. Le plus précis passe en premier.
