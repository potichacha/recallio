notion: boucle-while
lesson: |-
  `while` répète son bloc **tant que** sa condition est vraie. La condition est testée avant chaque tour, y compris le
  premier : si elle est fausse d'emblée, le bloc ne s'exécute jamais.

  ```python
  n = 27
  etapes = 0
  while n != 1:
      n = n // 2 if n % 2 == 0 else 3 * n + 1
      etapes += 1
  ```

  - **`break`** sort immédiatement de la boucle (la plus intérieure seulement).
  - **`continue`** abandonne le tour en cours et revient tester la condition.
  - Python n'a **pas d'opérateur `++`** : on écrit `i += 1`. `i++` est une `SyntaxError`, et `++i` est valide mais ne
    fait rien (deux « plus » unaires).
  - Il n'y a pas de `do ... while` : on écrit `while True:` et un `break` quand la condition de fin est atteinte.

  ```python
  while True:
      commande = lire_commande()
      if commande == "fin":
          break
      executer(commande)
  ```

  **Les pièges**

  | Piège | Conséquence |
  |---|---|
  | oublier de faire évoluer la variable de la condition | boucle infinie |
  | un `continue` placé **avant** l'incrémentation | boucle infinie |
  | croire que `break` sort de toutes les boucles imbriquées | la boucle extérieure continue |

  Pour sortir de deux boucles d'un coup : un indicateur testé après la boucle intérieure, ou mieux, placer les boucles
  dans une fonction et faire `return`. Python n'a ni `break 2` ni étiquette.

  **`while` ou `for` ?** `for` parcourt un itérable ou compte avec `range` ; `while` sert quand on ne connaît pas
  d'avance le nombre de tours (attendre un événement, converger vers une valeur).

  **En entretien** : « `while` répète tant que la condition est vraie, testée avant chaque tour. `break` sort de la
  boucle la plus intérieure, `continue` passe au tour suivant. Pas de `do while` ni de `++` : `while True` avec
  `break`, et `i += 1`. »
tour:
  - title: "La boucle while, break et continue"
    text: |-
      `while` répète son bloc tant que la condition est vraie. Python n'a pas de `++` : on écrit `etapes += 1`.

      `break` sort de la boucle, `continue` passe au tour suivant. Il n'y a pas de `do ... while` : la forme
      `while True:` avec un `break` en tient lieu.

      Essaie : remplace `n = 27` par `n = 7`, puis remplace `compte > 7` par `compte > 3`.
    example:
      files:
        main.py: |-
          n = 27
          etapes = 0
          while n != 1:
              if n % 2 == 0:
                  n //= 2
              else:
                  n = 3 * n + 1
              etapes += 1
          print("étapes :", etapes)

          compte = 0
          while True:
              compte += 1
              if compte % 2 == 0:
                  continue
              if compte > 7:
                  break
              print("impair :", compte)
      output: |-
        étapes : 111
        impair : 1
        impair : 3
        impair : 5
        impair : 7
cards:
  - key: do-while
    format: course
    question: Comment Python écrit-il une boucle « faire ... tant que » (do-while) ?
    choices:
      - {text: "Avec `while True:` et un `break` quand la fin est atteinte", correct: true}
      - {text: "Avec le mot-clé `do`, suivi du bloc puis de `while`", correct: false}
      - {text: "Avec `repeat ... until`, comme en Pascal", correct: false}
      - {text: "Avec un `while` dont la condition suit le bloc", correct: false}
    answer: "Python n'a qu'une forme de `while`, qui teste avant chaque tour. Pour exécuter le bloc au moins une fois, on boucle sans fin et on sort par `break`."
  - key: continue-while
    format: course
    question: Que fait `continue` dans une boucle `while` ?
    choices:
      - {text: "Il saute la fin du corps et revient tester la condition", correct: true}
      - {text: "Il sort de la boucle et continue après elle", correct: false}
      - {text: "Il recommence le corps sans retester la condition", correct: false}
      - {text: "Il ignore le prochain tour de la boucle", correct: false}
    answer: "`continue` abandonne le tour en cours. Attention : si l'incrémentation est après le `continue`, elle est sautée aussi."
  - key: break-imbrique
    format: course
    question: Deux boucles `while` sont imbriquées. Que fait un `break` placé dans la boucle intérieure ?
    choices:
      - {text: "Il sort de la boucle intérieure seulement", correct: true}
      - {text: "Il sort des deux boucles d'un coup", correct: false}
      - {text: "Il sort de la fonction qui contient les boucles", correct: false}
      - {text: "Il sort de la boucle extérieure seulement", correct: false}
    answer: "`break` ne concerne que la boucle la plus intérieure. Pour sortir des deux : un indicateur, ou un `return` depuis une fonction."
  - key: while-ou-for
    format: course
    question: Quand préférer `while` à `for` ?
    choices:
      - {text: "Quand on ne connaît pas d'avance le nombre de tours", correct: true}
      - {text: "Quand on parcourt les éléments d'une liste", correct: false}
      - {text: "Quand on veut compter de 0 à n - 1", correct: false}
      - {text: "Quand la boucle doit s'exécuter plus vite", correct: false}
    answer: "`for` parcourt un itérable ou compte avec `range`. `while` convient pour attendre un événement ou converger vers une valeur."
  - key: vf-plus-plus
    format: true-false
    question: En Python, `i++` incrémente `i` de 1.
    truth: false
    answer: "`i++` est une `SyntaxError`. On écrit `i += 1`. Piège : `++i` est accepté, mais ne fait rien (deux « plus » unaires)."
  - key: vf-while-true
    format: true-false
    question: Une boucle `while True:` dont le corps ne contient ni `break` ni `return` ne s'arrête que si une exception est levée.
    truth: true
    answer: "La condition reste toujours vraie : seule une exception (ou la fin du programme) peut l'interrompre."
  - key: vf-break-dans-if
    format: true-false
    question: Un `break` placé dans un `if`, à l'intérieur d'une boucle, ne sort que du `if`.
    truth: false
    answer: "Un `if` n'est pas une boucle : `break` sort de la boucle qui l'entoure."
  - key: vf-condition-avant
    format: true-false
    question: La condition d'un `while` est testée avant chaque tour, y compris le premier.
    truth: true
    answer: "Si elle est fausse dès le départ, le corps ne s'exécute jamais."
  - key: qcm-boucle-infinie
    format: multiple-choice
    question: "Cette boucle ne s'arrête jamais : `i = 0`, puis `while i < 5:` et `print(i)` dans le corps. Que manque-t-il ?"
    choices:
      - {text: "`i += 1` dans le corps de la boucle", correct: true}
      - {text: "Un `break` juste après le `print`", correct: false}
      - {text: "Des parenthèses autour de `i < 5`", correct: false}
      - {text: "Un `else` après la boucle", correct: false}
    answer: "La condition ne change jamais si `i` n'évolue pas. Un `break` arrêterait la boucle, mais après un seul tour."
  - key: qcm-trois-deux-un
    format: multiple-choice
    question: Avec `n = 3`, quelle boucle affiche 3, 2, 1 ?
    choices:
      - {text: "`while n > 0: print(n); n -= 1`", correct: true}
      - {text: "`while n > 0: n -= 1; print(n)`", correct: false}
      - {text: "`while n >= 0: print(n); n -= 1`", correct: false}
      - {text: "`while n > 1: print(n); n -= 1`", correct: false}
    answer: "Afficher avant de décrémenter, et s'arrêter quand `n` atteint 0. Décrémenter d'abord afficherait 2, 1, 0."
  - key: qcm-sortir-deux-boucles
    format: multiple-choice
    question: Comment sortir proprement de deux boucles imbriquées d'un coup ?
    choices:
      - {text: "Placer les boucles dans une fonction, et faire `return`", correct: true}
      - {text: "Écrire `break 2`, comme en PHP", correct: false}
      - {text: "Nommer la boucle et écrire `break exterieure`", correct: false}
      - {text: "Écrire deux `break` l'un après l'autre", correct: false}
    answer: "Python n'a ni `break 2` ni étiquette. Le second `break` ne serait jamais atteint. Une fonction et son `return`, ou un indicateur, font l'affaire."
  - key: qcm-valeur-finale
    format: multiple-choice
    question: "Que vaut `n` après `n = 10`, puis `while n > 3: n -= 4` ?"
    choices:
      - {text: "`2`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "`-2`", correct: false}
    answer: "10 devient 6, puis 2. À 2, la condition `n > 3` est fausse : la boucle s'arrête."
  - key: trous-diviser
    format: fill-in
    question: |-
      Complète la boucle qui divise `n` par 2 jusqu'à atteindre 1 :
      ```python
      ___ n > 1:
          n //= 2
      ```
    blanks: [[while]]
    answer: "`while` répète tant que la condition est vraie."
  - key: trous-file-vide
    format: fill-in
    question: |-
      Complète la boucle sans fin, dont on sort quand la file est vide :
      ```python
      while ___:
          if not file:
              ___
          traiter(file.pop())
      ```
    blanks: [[True], [break]]
    answer: "`while True:` boucle sans fin ; `break` en sort. C'est la forme qui remplace le `do ... while`."
  - key: trous-ligne-vide
    format: fill-in
    question: |-
      Complète pour ignorer les lignes vides et passer à la suivante :
      ```python
      while lignes:
          ligne = lignes.pop(0)
          if not ligne:
              ___
          print(ligne)
      ```
    blanks: [[continue]]
    answer: "`continue` abandonne le tour en cours et revient tester la condition. Ici, `pop` a déjà fait avancer la boucle."
  - key: trous-incrementer
    format: fill-in
    question: |-
      Complète l'incrémentation :
      ```python
      i = 0
      while i < 3:
          print(i)
          i ___ 1
      ```
    blanks: [["+="]]
    answer: "`i += 1`. Python n'a pas d'opérateur `++`."
  - key: code-continue-somme
    format: code-output
    question: |-
      ```python
      i = 0
      total = 0
      while i < 5:
          i += 1
          if i == 3:
              continue
          total += i
      print(total)
      ```
    check:
      output: "12"
    choices:
      - {text: "`12`", correct: true}
      - {text: "`15`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "`7`", correct: false}
    answer: "`i` prend 1 à 5, et 3 est sauté : 1 + 2 + 4 + 5 = 12. L'incrémentation est avant le `continue`, donc pas de boucle infinie."
  - key: code-tripler
    format: code-output
    question: |-
      ```python
      n = 1
      while n < 100:
          n *= 3
      print(n)
      ```
    check:
      output: "243"
    choices:
      - {text: "`243`", correct: true}
      - {text: "`81`", correct: false}
      - {text: "`100`", correct: false}
      - {text: "`729`", correct: false}
    answer: "1, 3, 9, 27, 81, puis 243 : à 81, la condition est encore vraie, donc un dernier tour la dépasse."
  - key: code-break-seuil
    format: code-output
    question: |-
      ```python
      x = 10
      while x > 0:
          x -= 3
          if x < 5:
              break
      print(x)
      ```
    check:
      output: "4"
    choices:
      - {text: "`4`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`-2`", correct: false}
      - {text: "`7`", correct: false}
    answer: "10 devient 7 (pas de sortie), puis 4 : inférieur à 5, `break` sort aussitôt."
  - key: code-boucles-imbriquees
    format: code-output
    question: |-
      ```python
      i = 0
      while i < 3:
          j = 0
          while True:
              j += 1
              if j == 2:
                  break
          i += 1
      print(i, j)
      ```
    check:
      output: "3 2"
    choices:
      - {text: "`3 2`", correct: true}
      - {text: "`0 2`", correct: false}
      - {text: "`1 2`", correct: false}
      - {text: "`3 6`", correct: false}
    answer: "`break` ne sort que de la boucle intérieure : la boucle extérieure fait ses trois tours, et `j` repart de 0 à chacun."
  - key: bug-continue-avant-increment
    format: bug-fix
    question: |-
      Ce programme devait afficher les nombres impairs de 1 à 9 ; il ne s'arrête jamais et n'affiche rien. Quelle correction est la bonne ?
      ```python
      i = 0
      while i < 10:
          if i % 2 == 0:
              continue
          print(i)
          i += 1
      ```
    choices:
      - {text: "Incrémenter `i` en tête du corps, avant le `continue`", correct: true}
      - {text: "Remplacer `continue` par `pass`, qui ne saute rien", correct: false}
      - {text: "Remplacer `continue` par `break` pour sortir du tour", correct: false}
      - {text: "Écrire `while i <= 10:` pour élargir la condition", correct: false}
    answer: |-
      ```python
      i = 0
      while i < 10:
          i += 1
          if i % 2 == 0:
              continue
          print(i)
      ```
      Quand `i` vaut 0, `continue` saute l'incrémentation : `i` reste à 0 pour toujours. Avec `pass`, tous les nombres de 0 à 9 s'afficheraient.
  - key: bug-plus-plus
    format: bug-fix
    question: |-
      Python répond « SyntaxError: invalid syntax » sur la dernière ligne. Quelle correction est la bonne ?
      ```python
      compteur = 0
      while compteur < 3:
          print(compteur)
          compteur++
      ```
    choices:
      - {text: "`compteur += 1`", correct: true}
      - {text: "`++compteur`", correct: false}
      - {text: "`compteur =+ 1`", correct: false}
      - {text: "`compteur += compteur`", correct: false}
    answer: |-
      ```python
      compteur += 1
      ```
      Python n'a pas d'opérateur `++`. `++compteur` est accepté mais ne fait rien, `compteur =+ 1` affecte `+1` à chaque tour, et `compteur += compteur` laisse 0 à 0 : trois boucles infinies.
  - key: bug-factorielle-nulle
    format: bug-fix
    question: |-
      La factorielle de 5 devrait valoir 120, mais ce code affiche 0. Quelle correction est la bonne ?
      ```python
      n = 5
      factorielle = 1
      while n > 0:
          n -= 1
          factorielle *= n
      print(factorielle)
      ```
    choices:
      - {text: "Multiplier avant de décrémenter : `factorielle *= n`, puis `n -= 1`", correct: true}
      - {text: "Initialiser `factorielle` à 0 plutôt qu'à 1", correct: false}
      - {text: "Écrire `while n >= 0:` pour faire un tour de plus", correct: false}
      - {text: "Écrire `while n > 1:` pour éviter le dernier tour", correct: false}
    answer: |-
      ```python
      while n > 0:
          factorielle *= n
          n -= 1
      ```
      Décrémenter d'abord multiplie par 4, 3, 2, 1, puis 0 au dernier tour. Avec `while n > 1:`, le résultat serait 24 : le 5 manque toujours.
  - key: bug-break-une-boucle
    format: bug-fix
    question: |-
      La recherche devrait s'arrêter à la ligne 1, où se trouve la cible ; le programme affiche `True 3`. Quelle correction est la bonne ?
      ```python
      grille = [[1, 2], [3, 4], [5, 6]]
      cible = 3
      trouve = False
      i = 0
      while i < len(grille):
          j = 0
          while j < len(grille[i]):
              if grille[i][j] == cible:
                  trouve = True
                  break
              j += 1
          i += 1
      print(trouve, i)
      ```
    choices:
      - {text: "Après la boucle intérieure, ajouter `if trouve: break` avant `i += 1`", correct: true}
      - {text: "Écrire `break break` pour sortir des deux boucles à la fois", correct: false}
      - {text: "Remplacer le `break` par un `continue` dans la boucle intérieure", correct: false}
      - {text: "Placer `trouve = True` après le `break`, pour qu'il soit lu", correct: false}
    answer: |-
      ```python
          while j < len(grille[i]):
              ...
          if trouve:
              break
          i += 1
      ```
      `break` ne sort que de la boucle intérieure : l'extérieure continue jusqu'au bout. Un indicateur testé après permet de sortir aussi de celle-ci.
