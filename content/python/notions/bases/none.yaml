notion: none
lesson: |-
  **`None`** représente l'**absence de valeur**, comme `null` en Java. C'est l'unique objet du type `NoneType` : un
  *singleton*, partagé par tout le programme.

  **D'où vient `None`**

  - Une fonction qui se termine sans `return` (ou par un `return` seul) renvoie `None`.
  - Les méthodes qui modifient un objet **sur place** renvoient `None` : `liste.sort()`, `liste.append(x)`,
    `dico.update(...)`. D'où le piège `liste = liste.sort()`, qui remplace la liste par `None`.
  - `dico.get(cle)` renvoie `None` si la clé manque.
  - On l'utilise comme valeur par défaut d'un paramètre facultatif : `def f(x=None):`.

  **Tester `None`** : avec **`is`**, jamais `==`.

  ```python
  if resultat is None:
      ...
  if resultat is not None:
      ...
  ```

  `None` étant unique, `is` (l'identité) est exact et rapide ; `==` passe par la méthode `__eq__` de l'objet, qu'une
  classe peut redéfinir. PEP 8 l'impose.

  **`None` est faux**, mais `if not x:` confond `None` avec `0`, `""` ou `[]`. Quand ces valeurs sont valables (une
  remise de 0, une chaîne vide), on teste `x is None`.

  **Les erreurs typiques** quand une valeur vaut `None` sans qu'on s'y attende :

  | Erreur | Exemple |
  |---|---|
  | `AttributeError: 'NoneType' object has no attribute 'upper'` | `None.upper()` |
  | `TypeError: unsupported operand type(s) for +: 'NoneType' and 'int'` | `None + 1` |
  | `TypeError: 'NoneType' object is not subscriptable` | `None[0]` |

  Dans l'interpréteur interactif, une expression qui vaut `None` n'affiche rien ; `print(None)` affiche `None`. Dans
  les annotations, une valeur facultative s'écrit `str | None`.

  **En entretien** : « `None` est l'unique instance de `NoneType`, l'absence de valeur ; c'est ce que renvoie une
  fonction sans `return`, et les méthodes qui modifient sur place. On le teste avec `is None`, car c'est un singleton,
  et pas avec `if not x`, qui confondrait `None` avec zéro ou une chaîne vide. »
tour:
  - title: None, l'absence de valeur
    text: |-
      `None` est l'équivalent du `null` de Java : l'absence de valeur. C'est un objet unique, de type `NoneType`.

      Une fonction qui ne rencontre pas de `return` renvoie `None`. Ici, `chercher("Linus")` ne passe par aucun
      `return`.

      On teste `None` avec `is` : `valeur is None`, ou `valeur is not None`.

      Essaie : appelle `chercher("Ada")` à la place de `chercher("Linus")`.
    example:
      files:
        main.py: |-
          def chercher(nom):
              if nom == "Ada":
                  return "trouvée"


          resultat = chercher("Linus")
          print(resultat)
          print(resultat is None)
          print(type(None))

          valeur = None
          if valeur is None:
              print("pas encore de valeur")
      output: |-
        None
        True
        <class 'NoneType'>
        pas encore de valeur
cards:
  - key: fonction-sans-return
    format: course
    question: Que renvoie une fonction qui se termine sans `return` ?
    choices:
      - {text: "`None`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Rien : l'appel n'a pas de valeur", correct: false}
      - {text: "Une `TypeError`, levée à l'appel", correct: false}
    answer: "Tout appel de fonction a une valeur ; sans `return`, c'est `None`. `x = print(\"a\")` donne aussi `None`."
  - key: is-plutot-que-egal
    format: course
    question: Pourquoi teste-t-on `x is None` plutôt que `x == None` ?
    choices:
      - {text: "`None` est unique : `is` compare l'identité, sans dépendre de `__eq__`", correct: true}
      - {text: "`x == None` lève une `TypeError` quand `x` est un nombre", correct: false}
      - {text: "`is` convertit d'abord `x` en booléen, ce qui est plus sûr", correct: false}
      - {text: "`==` ne fonctionne plus avec `None` depuis Python 3", correct: false}
    answer: "Une classe peut redéfinir `__eq__` et répondre `True` à `== None`. `is` ne se redéfinit pas : avec un singleton, c'est le test exact. PEP 8 le recommande."
  - key: not-et-zero
    format: course
    question: Pourquoi `if not x:` est-il risqué pour tester l'absence de valeur, quand `x` peut valoir `0` ?
    choices:
      - {text: "`not x` est vrai pour `0` comme pour `None` : on les confond", correct: true}
      - {text: "`not` ne s'applique qu'aux booléens, et lève une erreur", correct: false}
      - {text: "`if not x:` lève une `TypeError` quand `x` vaut `None`", correct: false}
      - {text: "`0` est vrai en Python : la condition ne passe jamais", correct: false}
    answer: "`0`, `\"\"`, `[]` et `None` sont tous faux. Pour distinguer « absent » de « zéro », on écrit `if x is None:`."
  - key: sort-renvoie-none
    format: course
    question: "Que vaut l'expression `[3, 1, 2].sort()` ?"
    choices:
      - {text: "`None`, car la liste est triée sur place", correct: true}
      - {text: "`[1, 2, 3]`, la liste triée", correct: false}
      - {text: "`True`, car le tri a réussi", correct: false}
      - {text: "Une nouvelle liste, l'ancienne restant intacte", correct: false}
    answer: "Les méthodes qui modifient l'objet renvoient `None`, pour qu'on ne les confonde pas avec celles qui créent un nouvel objet. `sorted([3, 1, 2])` renvoie une nouvelle liste."
  - key: vf-instance-unique
    format: true-false
    question: "`None` est l'unique instance du type `NoneType`."
    truth: true
    answer: "C'est un singleton : tous les `None` du programme sont le même objet, d'où le test `is None`."
  - key: vf-none-egal-zero
    format: true-false
    question: "`None == 0` vaut `True`."
    truth: false
    answer: "`None` n'est égal qu'à lui-même. Il est faux dans un `if`, comme `0`, mais ce n'est pas la même chose."
  - key: vf-bool-none
    format: true-false
    question: "`bool(None)` vaut `False`."
    truth: true
    answer: "`None` est faux. Un test `if x:` ne distingue donc pas `None` de `0` ou de `\"\"`."
  - key: vf-repl-affiche-none
    format: true-false
    question: Dans l'interpréteur interactif, une expression qui vaut `None` affiche `None`.
    truth: false
    answer: "L'interpréteur interactif n'affiche rien pour `None`, ce qui cache souvent qu'une fonction n'a rien renvoyé. `print(None)` affiche bien `None`."
  - key: qcm-type-none
    format: multiple-choice
    question: Quel est le type de `None` ?
    choices:
      - {text: "`NoneType`", correct: true}
      - {text: "`null`", correct: false}
      - {text: "`void`", correct: false}
      - {text: "`object`", correct: false}
    answer: "`type(None)` affiche `<class 'NoneType'>`. `null` et `void` viennent d'autres langages."
  - key: qcm-get-cle-absente
    format: multiple-choice
    question: "Que renvoie `{\"a\": 1}.get(\"b\")` ?"
    choices:
      - {text: "`None`", correct: true}
      - {text: "Une `KeyError`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`\"\"`", correct: false}
    answer: "`get` renvoie `None` (ou la valeur par défaut donnée en second argument) quand la clé manque. `d[\"b\"]` lèverait une `KeyError`."
  - key: qcm-test-absence
    format: multiple-choice
    question: "Quelle condition teste qu'aucune valeur n'a été fournie, quand `0` est une valeur valable ?"
    choices:
      - {text: "`if valeur is None:`", correct: true}
      - {text: "`if not valeur:`", correct: false}
      - {text: "`if valeur == False:`", correct: false}
      - {text: "`if valeur is 0:`", correct: false}
    answer: "Seul `is None` isole l'absence de valeur. `not valeur` et `valeur == False` sont vrais aussi pour `0`."
  - key: qcm-none-upper
    format: multiple-choice
    question: Quelle erreur obtient-on avec `None.upper()` ?
    choices:
      - {text: "`AttributeError`", correct: true}
      - {text: "`TypeError`", correct: false}
      - {text: "`NameError`", correct: false}
      - {text: "`ValueError`", correct: false}
    answer: "« AttributeError: 'NoneType' object has no attribute 'upper' » : le signe qu'une valeur attendue manque."
  - key: code-fonction-sans-return
    format: code-output
    question: |-
      ```python
      def doubler(x):
          x * 2

      print(doubler(4))
      ```
    answer: "`None` : la fonction calcule `x * 2`, mais ne le renvoie pas."
    check:
      output: "None"
    choices:
      - {text: "`None`", correct: true}
      - {text: "`8`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "Rien", correct: false}
  - key: code-comparaisons-none
    format: code-output
    question: |-
      ```python
      print(None is None, None == False, bool(None))
      ```
    answer: "`True False False` : `None` n'est égal qu'à lui-même, mais il est faux."
    check:
      output: "True False False"
    choices:
      - {text: "`True False False`", correct: true}
      - {text: "`True True False`", correct: false}
      - {text: "`True False True`", correct: false}
      - {text: "`False False False`", correct: false}
  - key: code-sort-affecte
    format: code-output
    question: |-
      ```python
      notes = [3, 1, 2]
      notes = notes.sort()
      print(notes)
      ```
    answer: "`None` : `sort` trie sur place et renvoie `None`, qui remplace la liste."
    check:
      output: "None"
    choices:
      - {text: "`None`", correct: true}
      - {text: "`[1, 2, 3]`", correct: false}
      - {text: "`[3, 1, 2]`", correct: false}
      - {text: "`[]`", correct: false}
  - key: code-nonetype-or
    format: code-output
    question: |-
      ```python
      print(type(None).__name__, None or 0)
      ```
    answer: "`NoneType 0` : `None` est faux, donc `or` renvoie `0`."
    check:
      output: "NoneType 0"
    choices:
      - {text: "`NoneType 0`", correct: true}
      - {text: "`NoneType None`", correct: false}
      - {text: "`None 0`", correct: false}
      - {text: "`NoneType False`", correct: false}
  - key: bug-sort-affecte
    format: bug-fix
    question: |-
      Ce script s'arrête avec « TypeError: 'NoneType' object is not subscriptable » :
      ```python
      notes = [3, 1, 2]
      notes = notes.sort()
      print(notes[0])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `notes.sort()`, sans affecter son résultat", correct: true}
      - {text: "Écrire `notes = notes.sort(inplace=False)`", correct: false}
      - {text: "Écrire `notes = list(notes.sort())`", correct: false}
      - {text: "Écrire `notes = notes.sort() or []`", correct: false}
    answer: |-
      ```python
      notes = [3, 1, 2]
      notes.sort()
      print(notes[0])
      ```
      `sort` trie la liste sur place et renvoie `None`. Pour une nouvelle liste triée : `notes = sorted(notes)`.
  - key: bug-return-oublie
    format: bug-fix
    question: |-
      Ce script s'arrête avec « TypeError: unsupported operand type(s) for +: 'NoneType' and 'int' » :
      ```python
      def prix_ttc(prix_ht):
          prix_ht * 1.2

      total = prix_ttc(100) + 5
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `return prix_ht * 1.2` dans la fonction", correct: true}
      - {text: "Écrire `total = int(prix_ttc(100)) + 5`", correct: false}
      - {text: "Écrire `prix_ht = prix_ht * 1.2` dans la fonction", correct: false}
      - {text: "Écrire `total = (prix_ttc(100) or 0) + 5`", correct: false}
    answer: |-
      ```python
      def prix_ttc(prix_ht):
          return prix_ht * 1.2

      total = prix_ttc(100) + 5
      ```
      Sans `return`, la fonction calcule, puis renvoie `None`. Réaffecter le paramètre ne change rien pour l'appelant.
  - key: bug-attribut-sur-none
    format: bug-fix
    question: |-
      Ce script s'arrête avec « AttributeError: 'NoneType' object has no attribute 'upper' » :
      ```python
      def trouver_email(nom):
          if nom == "ada":
              return "ada@exemple.fr"

      print(trouver_email("linus").upper())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Tester `email is not None` avant d'appeler `upper()`", correct: true}
      - {text: "Écrire `str(trouver_email(\"linus\")).upper()`", correct: false}
      - {text: "Écrire `trouver_email(\"linus\").UPPER()`", correct: false}
      - {text: "Ajouter `import NoneType` en tête du fichier", correct: false}
    answer: |-
      ```python
      email = trouver_email("linus")
      if email is not None:
          print(email.upper())
      else:
          print("email inconnu")
      ```
      Pour un nom inconnu, la fonction renvoie `None`. `str(...)` éviterait l'erreur, mais afficherait `NONE` : on
      traite l'absence de valeur explicitement.
  - key: bug-remise-zero
    format: bug-fix
    question: |-
      Avec une remise de 0, ce code affiche `90` au lieu de `100` :
      ```python
      def prix_final(prix, remise=None):
          if not remise:
              remise = 10
          return prix - remise

      print(prix_final(100, 0))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if remise is None:`", correct: true}
      - {text: "`if remise == None or 0:`", correct: false}
      - {text: "`if not remise is 0:`", correct: false}
      - {text: "`if remise is False:`", correct: false}
    answer: |-
      ```python
      def prix_final(prix, remise=None):
          if remise is None:
              remise = 10
          return prix - remise

      print(prix_final(100, 0))
      ```
      `not remise` est vrai pour `0` comme pour `None` : la remise de zéro est remplacée par 10. `is None` ne
      réagit qu'à l'absence de valeur.
