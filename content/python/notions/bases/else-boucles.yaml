notion: else-boucles
lesson: |-
  Une boucle `for` ou `while` peut avoir une clause **`else`**, placée au niveau de la boucle. Elle s'exécute quand la
  boucle se termine **normalement**, c'est-à-dire **sans `break`** :

  - pour un `for`, quand l'itérable est épuisé (y compris s'il était vide) ;
  - pour un `while`, quand la condition devient fausse (y compris si elle l'était d'emblée).

  Un `break`, un `return` ou une exception qui quitte la boucle **sautent** le `else`. Un `continue` n'y change rien.

  **L'usage typique : la recherche**, dont le `else` traite le cas « pas trouvé ».

  ```python
  for d in range(2, n):
      if n % d == 0:
          print(n, "est divisible par", d)
          break
  else:
      print(n, "est premier")
  ```

  Pour s'en souvenir, lis `else` comme **« nobreak »** : « si aucun `break` n'a eu lieu ». Ce n'est ni un `finally`
  (qui s'exécuterait toujours), ni un « si la boucle n'a rien parcouru ».

  **Le piège d'indentation** : un `else` aligné sur le `if` du corps appartient au `if`, et s'exécute à chaque tour où
  la condition est fausse. Le `else` de la boucle s'aligne sur le `for` ou le `while`.

  La clause est peu connue et surprend à la lecture. Souvent, une fonction qui fait `return` dès qu'elle trouve, ou
  `any()` et `next(..., defaut)`, se lisent mieux.

  **En entretien** : « Le `else` d'une boucle s'exécute si elle se termine sans `break` : itérable épuisé ou condition
  devenue fausse. Il sert au cas « pas trouvé » d'une recherche. Un `return` ou une exception le sautent aussi. »
cards:
  - key: quand-else-for
    format: course
    question: Quand s'exécute le bloc `else` d'une boucle `for` ?
    choices:
      - {text: "Quand la boucle se termine sans avoir rencontré de `break`", correct: true}
      - {text: "Quand la boucle n'a fait aucun tour, et seulement alors", correct: false}
      - {text: "Quand la boucle s'est arrêtée sur un `break`", correct: false}
      - {text: "Après chaque tour où le `if` du corps est faux", correct: false}
    answer: "Le `else` est la sortie « normale » : l'itérable a été parcouru jusqu'au bout. Il s'exécute aussi sur un itérable vide, mais pas seulement."
  - key: usage-recherche
    format: course
    question: À quoi sert typiquement `for ... else` ?
    choices:
      - {text: "À traiter le cas « pas trouvé » d'une recherche qui sort par `break`", correct: true}
      - {text: "À exécuter du code à chaque tour où le corps a été sauté", correct: false}
      - {text: "À attraper les exceptions levées dans le corps de la boucle", correct: false}
      - {text: "À parcourir les éléments restants après un `break`", correct: false}
    answer: "La boucle cherche, `break` quand elle trouve ; le `else` ne s'exécute que si rien n'a été trouvé. On évite ainsi un indicateur `trouve`."
  - key: else-while
    format: course
    question: Le `else` d'un `while` s'exécute-t-il quand la condition devient fausse ?
    choices:
      - {text: "Oui : c'est la fin normale de la boucle", correct: true}
      - {text: "Non, seulement si la condition était fausse d'emblée", correct: false}
      - {text: "Non : le `else` de boucle n'existe que pour `for`", correct: false}
      - {text: "Oui, mais seulement si la boucle a fait au moins un tour", correct: false}
    answer: "Pour un `while`, la fin normale est la condition devenue fausse, même au premier test. Seul un `break` (ou un `return`, une exception) saute le `else`."
  - key: alternative-lisible
    format: course
    question: Quelle alternative, souvent plus lisible, remplace un `for ... else` de recherche ?
    choices:
      - {text: "Une fonction qui fait `return` dès qu'elle trouve", correct: true}
      - {text: "Un `try` et un `except StopIteration` autour de la boucle", correct: false}
      - {text: "Un `while True` avec un compteur de tours", correct: false}
      - {text: "Un `if` placé après la boucle, sans indicateur", correct: false}
    answer: "La fonction renvoie le résultat dès qu'elle le trouve, et le cas « pas trouvé » est simplement la ligne après la boucle. `any()` et `next(..., defaut)` conviennent aussi."
  - key: vf-liste-vide
    format: true-false
    question: Le `else` d'une boucle `for` s'exécute quand elle parcourt une liste vide.
    truth: true
    answer: "Aucun tour, donc aucun `break` : la boucle se termine normalement, et le `else` s'exécute."
  - key: vf-continue
    format: true-false
    question: Un `continue` exécuté dans la boucle empêche son `else` de s'exécuter.
    truth: false
    answer: "`continue` passe au tour suivant sans quitter la boucle. Seuls `break`, `return` et une exception sautent le `else`."
  - key: vf-return
    format: true-false
    question: Une boucle quittée par `return` n'exécute pas son `else`.
    truth: true
    answer: "`return` quitte la fonction tout entière : le `else` de la boucle est sauté, comme avec un `break`."
  - key: vf-seulement-break
    format: true-false
    question: Le `else` d'une boucle s'exécute seulement quand elle a été interrompue par un `break`.
    truth: false
    answer: "C'est l'inverse : il s'exécute quand il n'y a **pas** eu de `break`."
  - key: qcm-mot-resume
    format: multiple-choice
    question: Quel mot résume le mieux le sens du `else` d'une boucle ?
    choices:
      - {text: "« nobreak » : aucun `break` n'a eu lieu", correct: true}
      - {text: "« finally » : il s'exécute dans tous les cas", correct: false}
      - {text: "« empty » : la boucle n'a fait aucun tour", correct: false}
      - {text: "« except » : une erreur a interrompu la boucle", correct: false}
    answer: "Raymond Hettinger, développeur de Python, suggère de le lire « nobreak ». Ce n'est ni un `finally`, ni un test de vide."
  - key: qcm-ce-qui-empeche
    format: multiple-choice
    question: "Dans `for x in xs: ... else: ...`, qu'est-ce qui empêche le `else` de s'exécuter ?"
    choices:
      - {text: "Un `break`, un `return` ou une exception", correct: true}
      - {text: "Un `continue`, un `break` ou un `return`", correct: false}
      - {text: "Seulement une exception non rattrapée", correct: false}
      - {text: "Une liste `xs` vide ou un `break`", correct: false}
    answer: "Tout ce qui quitte la boucle avant sa fin normale. `continue` reste dans la boucle ; une liste vide est une fin normale."
  - key: qcm-instructions
    format: multiple-choice
    question: Quelles boucles acceptent une clause `else` en Python ?
    choices:
      - {text: "`for` et `while`", correct: true}
      - {text: "`for` seulement", correct: false}
      - {text: "`while` seulement", correct: false}
      - {text: "`for`, `while` et `with`", correct: false}
    answer: "Les deux boucles l'acceptent, avec le même sens. `try` a aussi un `else`, avec un autre sens : aucun `except` n'a été déclenché."
  - key: qcm-indentation
    format: multiple-choice
    question: Où se place le `else` d'une boucle ?
    choices:
      - {text: "Au niveau d'indentation du `for`, juste après le corps", correct: true}
      - {text: "Dans le corps, au niveau du `if` qui contient le `break`", correct: false}
      - {text: "Avant le `for`, pour préparer la recherche", correct: false}
      - {text: "Sur la ligne du `for`, après les deux-points", correct: false}
    answer: "Aligné sur le `if` du corps, le `else` appartiendrait au `if` et s'exécuterait à chaque tour où la condition est fausse."
  - key: code-aucun-pair
    format: code-output
    question: |-
      ```python
      for n in [3, 7, 9]:
          if n % 2 == 0:
              print("pair :", n)
              break
      else:
          print("aucun pair")
      ```
    check:
      output: "aucun pair"
    choices:
      - {text: "`aucun pair`", correct: true}
      - {text: "`pair : 9`", correct: false}
      - {text: "`pair : 3`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Aucun nombre n'est pair : pas de `break`, donc le `else` s'exécute."
  - key: code-premier-pair
    format: code-output
    question: |-
      ```python
      for n in [3, 8, 9]:
          if n % 2 == 0:
              print("pair :", n)
              break
      else:
          print("aucun pair")
      ```
    check:
      output: "pair : 8"
    choices:
      - {text: "`pair : 8`", correct: true}
      - {text: "`aucun pair`", correct: false}
      - {text: "`pair : 8` puis `aucun pair`", correct: false}
      - {text: "`pair : 9`", correct: false}
    answer: "8 est pair : la boucle affiche et sort par `break`, ce qui saute le `else`."
  - key: code-range-vide
    format: code-output
    question: |-
      ```python
      for i in range(0):
          print("tour")
      else:
          print("fini")
      ```
    check:
      output: "fini"
    choices:
      - {text: "`fini`", correct: true}
      - {text: "`tour`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Une `ValueError`", correct: false}
    answer: "`range(0)` est vide : aucun tour, aucun `break`, donc le `else` s'exécute."
  - key: code-while-break
    format: code-output
    question: |-
      ```python
      n = 10
      while n > 0:
          n -= 3
          if n == 4:
              break
      else:
          print("terminé", n)
      print("après", n)
      ```
    check:
      output: "après 4"
    choices:
      - {text: "`après 4`", correct: true}
      - {text: "`terminé 4`", correct: false}
      - {text: "`après -2`", correct: false}
      - {text: "`après 1`", correct: false}
    answer: "10 devient 7, puis 4 : `break` sort de la boucle et saute le `else`. Seule la dernière ligne s'affiche."
  - key: bug-else-du-if
    format: bug-fix
    question: |-
      La cible est absente, mais « absent » s'affiche trois fois au lieu d'une. Quelle correction est la bonne ?
      ```python
      cible = 5
      for x in [1, 2, 3]:
          if x == cible:
              print("trouvé")
              break
          else:
              print("absent")
      ```
    choices:
      - {text: "Désindenter le `else` au niveau du `for`", correct: true}
      - {text: "Remplacer `else` par `elif x != cible:`", correct: false}
      - {text: "Supprimer le `break`, qui bloque le `else`", correct: false}
      - {text: "Ajouter `continue` à la fin du bloc `else`", correct: false}
    answer: |-
      ```python
      for x in [1, 2, 3]:
          if x == cible:
              print("trouvé")
              break
      else:
          print("absent")
      ```
      Aligné sur le `if`, le `else` s'exécute à chaque tour où `x` diffère de la cible. Aligné sur le `for`, il ne s'exécute qu'une fois, si aucun `break` n'a eu lieu.
  - key: bug-message-toujours
    format: bug-fix
    question: |-
      « lecture terminée » doit s'afficher dans tous les cas ; il manque quand la ligne « FIN » est rencontrée. Quelle correction est la bonne ?
      ```python
      for ligne in ["a", "b", "FIN", "c"]:
          if ligne == "FIN":
              break
          print(ligne)
      else:
          print("lecture terminée")
      ```
    choices:
      - {text: "Retirer le `else` : un `print` après la boucle s'exécute toujours", correct: true}
      - {text: "Remplacer `break` par `continue` pour atteindre le `else`", correct: false}
      - {text: "Ajouter `print(\"lecture terminée\")` dans le bloc `if`", correct: false}
      - {text: "Remplacer `else` par `finally` au même endroit", correct: false}
    answer: |-
      ```python
      for ligne in ["a", "b", "FIN", "c"]:
          if ligne == "FIN":
              break
          print(ligne)
      print("lecture terminée")
      ```
      Le `else` est justement sauté par `break`. Un code qui doit toujours s'exécuter se place simplement après la boucle. `finally` n'existe que pour `try`, et `continue` lirait « c » après « FIN ».
  - key: bug-else-pas-vide
    format: bug-fix
    question: |-
      « aucun panier » s'affiche alors qu'il y a deux paniers. Quelle correction est la bonne ?
      ```python
      paniers = [["pomme"], ["kiwi"]]
      for panier in paniers:
          print(len(panier))
      else:
          print("aucun panier")
      ```
    choices:
      - {text: "Tester la liste vide avec `if not paniers:`, sans `else`", correct: true}
      - {text: "Ajouter un `break` à la fin du corps de la boucle", correct: false}
      - {text: "Remplacer la boucle `for` par une boucle `while`", correct: false}
      - {text: "Indenter le `else` au niveau du `print` du corps", correct: false}
    answer: |-
      ```python
      if not paniers:
          print("aucun panier")
      for panier in paniers:
          print(len(panier))
      ```
      Le `else` d'une boucle ne veut pas dire « si vide » : il s'exécute à chaque fin sans `break`, donc ici toujours.
  - key: bug-premier-deux-messages
    format: bug-fix
    question: |-
      Pour 9, le programme affiche « 9 n'est pas premier », puis « 9 est premier ». Quelle correction est la bonne ?
      ```python
      n = 9
      for d in range(2, n):
          if n % d == 0:
              print(n, "n'est pas premier")
              break
      print(n, "est premier")
      ```
    choices:
      - {text: "Placer le dernier `print` dans un `else:` aligné sur le `for`", correct: true}
      - {text: "Placer le dernier `print` dans un `else:` aligné sur le `if`", correct: false}
      - {text: "Remplacer `break` par `return` dans le bloc du `if`", correct: false}
      - {text: "Remplacer `range(2, n)` par `range(2, n + 1)`", correct: false}
    answer: |-
      ```python
      for d in range(2, n):
          if n % d == 0:
              print(n, "n'est pas premier")
              break
      else:
          print(n, "est premier")
      ```
      Le `else` de la boucle ne s'exécute que si aucun diviseur n'a provoqué de `break`. Aligné sur le `if`, il afficherait « est premier » à chaque non-diviseur ; `return` est interdit hors d'une fonction.
