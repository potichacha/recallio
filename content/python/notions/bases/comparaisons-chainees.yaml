notion: comparaisons-chainees
lesson: |-
  **Les comparaisons s'enchaînent** comme en mathématiques :

  ```python
  if 0 < x < 10:          # équivaut à : 0 < x and x < 10
      ...
  ```

  `a < b < c` se lit `a < b and b < c`, avec deux différences : `b` n'est **évalué qu'une fois**, et l'évaluation
  s'arrête dès qu'une comparaison est fausse. Tous les opérateurs de comparaison s'enchaînent : `<`, `<=`, `>`, `>=`,
  `==`, `!=`, `is`, `is not`, `in`, `not in`.

  - `a == b == c` vaut `a == b and b == c`.
  - `1 < 3 > 2` est valide et vaut `True` (mais se lit mal : on l'évite).
  - Le piège du C : `(0 < x) < 10` compare un **booléen** à 10. En Python, `0 < x < 10` fait ce qu'on attend.

  **L'opérateur `in`** teste l'appartenance ; `not in`, son contraire.

  | Conteneur | `x in conteneur` teste | Coût |
  |---|---|---|
  | `str` | une **sous-chaîne** : `"thon" in "python"` | linéaire |
  | `list`, `tuple` | un élément égal à `x` | linéaire, O(n) |
  | `set`, `frozenset` | un élément égal à `x` | constant en moyenne, O(1) |
  | `dict` | une **clé** (pas une valeur) | constant en moyenne |
  | `range` | un entier de la suite, calculé sans la parcourir | constant |

  - Pour une valeur d'un dictionnaire : `x in d.values()`.
  - PEP 8 préfère `x not in xs` à `not x in xs` (même résultat, plus lisible).
  - Pour tester beaucoup d'appartenances, un `set` est bien plus rapide qu'une liste.
  - `if code in (200, 201, 204):` remplace avantageusement `code == 200 or code == 201 or ...`.

  **En entretien** : « `0 < x < 10` équivaut à `0 < x and x < 10`, avec `x` évalué une fois. `in` teste une
  sous-chaîne dans une chaîne, une clé dans un dictionnaire, un élément ailleurs ; dans un `set`, c'est O(1) en
  moyenne, dans une liste O(n). »
tour:
  - title: "Comparaisons enchaînées et in"
    text: |-
      Les comparaisons s'enchaînent comme en mathématiques : `18 <= age < 65` se lit `18 <= age and age < 65`.

      `in` teste l'appartenance : un caractère ou une sous-chaîne dans une chaîne, un élément dans une liste, une **clé**
      dans un dictionnaire. `not in` en est le contraire.

      Essaie : remplace `age = 25` par `age = 70`, puis teste `"pomme" in stock`.
    example:
      files:
        main.py: |-
          age = 25
          print(18 <= age < 65)

          voyelles = "aeiouy"
          print("e" in voyelles, "z" in voyelles)

          jours_ouvres = ["lundi", "mardi", "mercredi", "jeudi", "vendredi"]
          print("samedi" not in jours_ouvres)

          stock = {"pomme": 12, "kiwi": 0}
          print("kiwi" in stock, 12 in stock)
      output: |-
        True
        True False
        True
        True False
cards:
  - key: equivalent-chaine
    format: course
    question: À quoi équivaut `0 < x < 10` en Python ?
    choices:
      - {text: "`0 < x and x < 10`, avec `x` évalué une seule fois", correct: true}
      - {text: "`(0 < x) < 10` : le booléen obtenu est comparé à 10", correct: false}
      - {text: "`0 < x or x < 10`, l'une des deux suffit", correct: false}
      - {text: "Une `SyntaxError` : il faut écrire deux conditions", correct: false}
    answer: "Python enchaîne les comparaisons comme en mathématiques. Le comportement du C, où `0 < x` donne un booléen ensuite comparé à 10, n'existe pas ici."
  - key: in-dictionnaire
    format: course
    question: Sur un dictionnaire `d`, que teste l'expression `cle in d` ?
    choices:
      - {text: "La présence de `cle` parmi les clés", correct: true}
      - {text: "La présence de `cle` parmi les valeurs", correct: false}
      - {text: "La présence d'une paire (clé, valeur)", correct: false}
      - {text: "La présence parmi les clés et les valeurs", correct: false}
    answer: "`in` sur un dictionnaire teste les clés, en temps constant en moyenne. Pour les valeurs : `x in d.values()`, qui parcourt tout."
  - key: in-chaines
    format: course
    question: Avec deux chaînes, que teste `"thon" in "python"` ?
    choices:
      - {text: "Si la première est une sous-chaîne de la seconde", correct: true}
      - {text: "Si chaque lettre de la première est dans la seconde", correct: false}
      - {text: "Si les deux chaînes sont égales, à la casse près", correct: false}
      - {text: "Si la seconde commence par la première chaîne", correct: false}
    answer: "Sur des chaînes, `in` cherche une sous-chaîne contiguë : `\"thon\" in \"python\"` est vrai, `\"tp\" in \"python\"` est faux."
  - key: set-ou-liste
    format: course
    question: Pourquoi tester l'appartenance dans un `set` plutôt que dans une liste, sur de gros volumes ?
    choices:
      - {text: "Le `set` répond en temps constant en moyenne ; la liste parcourt tout", correct: true}
      - {text: "La liste ne supporte pas l'opérateur `in`, seulement `index`", correct: false}
      - {text: "Le `set` garde ses éléments triés, ce qui accélère la recherche", correct: false}
      - {text: "La liste compare les identités, le `set` compare les valeurs", correct: false}
    answer: "Un `set` est une table de hachage : `x in s` est O(1) en moyenne. Sur une liste, `in` compare les éléments un à un : O(n)."
  - key: vf-un-trois-deux
    format: true-false
    question: "`1 < 3 > 2` est une expression valide qui vaut `True`."
    truth: true
    answer: "Elle se lit `1 < 3 and 3 > 2`. Valide, mais peu lisible : on l'évite."
  - key: vf-intervalle-vide
    format: true-false
    question: "`10 < x < 5` lève une erreur, car l'intervalle est vide."
    truth: false
    answer: "Python ne vérifie pas la cohérence des bornes : l'expression vaut simplement `False`, quel que soit `x`."
  - key: vf-not-in
    format: true-false
    question: "`x not in liste` et `not x in liste` donnent le même résultat."
    truth: true
    answer: "`not` a une priorité plus basse que `in` : `not x in liste` se lit `not (x in liste)`. PEP 8 préfère `x not in liste`, plus lisible."
  - key: vf-evalue-deux-fois
    format: true-false
    question: Dans `a < f() < b`, la fonction `f` est appelée deux fois.
    truth: false
    answer: "Une comparaison enchaînée n'évalue chaque terme qu'une fois : `f()` est appelée une seule fois, et son résultat sert aux deux comparaisons."
  - key: qcm-heure-ouvree
    format: multiple-choice
    question: Quelle condition teste que l'entier `heure` est entre 9 et 17, bornes incluses ?
    choices:
      - {text: "`9 <= heure <= 17`", correct: true}
      - {text: "`heure in range(9, 17)`", correct: false}
      - {text: "`9 <= heure >= 17`", correct: false}
      - {text: "`9 =< heure =< 17`", correct: false}
    answer: "`range(9, 17)` exclut 17. `9 <= heure >= 17` exige `heure >= 17`. `=<` n'existe pas."
  - key: qcm-pep8-not-in
    format: multiple-choice
    question: Comment PEP 8 recommande-t-il d'écrire « `x` n'est pas dans `valeurs` » ?
    choices:
      - {text: "`x not in valeurs`", correct: true}
      - {text: "`not x in valeurs`", correct: false}
      - {text: "`x !in valeurs`", correct: false}
      - {text: "`!(x in valeurs)`", correct: false}
    answer: "`not in` est un opérateur à part entière. `not x in valeurs` marche aussi, mais se lit mal ; `!in` et `!` n'existent pas en Python."
  - key: qcm-trois-egaux
    format: multiple-choice
    question: À quoi équivaut `a == b == c` ?
    choices:
      - {text: "`a == b and b == c`", correct: true}
      - {text: "`(a == b) == c` : un booléen comparé à `c`", correct: false}
      - {text: "`a == b or b == c`", correct: false}
      - {text: "`a == c`, la comparaison du milieu est ignorée", correct: false}
    answer: "Comme toute comparaison enchaînée : chaque paire voisine est comparée, et toutes doivent être vraies."
  - key: qcm-appartenance-fausse
    format: multiple-choice
    question: Lequel de ces tests d'appartenance vaut `False` ?
    choices:
      - {text: "`\"py\" in [\"python\", \"java\"]`", correct: true}
      - {text: "`\"py\" in \"python\"`", correct: false}
      - {text: "`2 in range(5)`", correct: false}
      - {text: "`\"a\" in {\"a\": 1}`", correct: false}
    answer: "Dans une liste, `in` cherche un élément égal : aucun ne vaut `\"py\"`. Dans une chaîne, il cherche une sous-chaîne ; dans un dictionnaire, une clé."
  - key: code-intervalles
    format: code-output
    question: |-
      ```python
      x = 15
      print(1 < x < 10, 10 < x < 20)
      ```
    check:
      output: "False True"
    choices:
      - {text: "`False True`", correct: true}
      - {text: "`True True`", correct: false}
      - {text: "`False False`", correct: false}
      - {text: "`True False`", correct: false}
    answer: "15 n'est pas entre 1 et 10, mais il est entre 10 et 20."
  - key: code-in-melange
    format: code-output
    question: |-
      ```python
      notes = {"alice": 14, "bob": 9}
      print("alice" in notes, 14 in notes, "bo" in "bob")
      ```
    check:
      output: "True False True"
    choices:
      - {text: "`True False True`", correct: true}
      - {text: "`True True True`", correct: false}
      - {text: "`True False False`", correct: false}
      - {text: "`False False True`", correct: false}
    answer: "`in` sur un dictionnaire teste les clés : `14` est une valeur, pas une clé. `\"bo\"` est une sous-chaîne de `\"bob\"`."
  - key: code-un-seul-appel
    format: code-output
    question: |-
      ```python
      def f():
          print("appel", end=" ")
          return 5

      print(0 < f() < 10)
      ```
    check:
      output: "appel True"
    choices:
      - {text: "`appel True`", correct: true}
      - {text: "`appel appel True`", correct: false}
      - {text: "`True`", correct: false}
      - {text: "`appel False`", correct: false}
    answer: "Dans une comparaison enchaînée, `f()` n'est évaluée qu'une fois. 5 est bien entre 0 et 10."
  - key: code-range-et-chaine
    format: code-output
    question: |-
      ```python
      print(7 in range(0, 10, 2), "ab" not in "cabane")
      ```
    check:
      output: "False False"
    choices:
      - {text: "`False False`", correct: true}
      - {text: "`True False`", correct: false}
      - {text: "`False True`", correct: false}
      - {text: "`True True`", correct: false}
    answer: "`range(0, 10, 2)` contient 0, 2, 4, 6, 8 : pas 7. `\"ab\"` est une sous-chaîne de `\"cabane\"`, donc `not in` vaut `False`."
  - key: bug-valeur-dictionnaire
    format: bug-fix
    question: |-
      Une quantité vaut bien 12, mais ce code affiche « aucune ». Quelle correction est la bonne ?
      ```python
      stock = {"pomme": 12, "kiwi": 5}
      if 12 in stock:
          print("une quantité de 12 existe")
      else:
          print("aucune")
      ```
    choices:
      - {text: "`if 12 in stock.values():`", correct: true}
      - {text: "`if 12 in stock.keys():`", correct: false}
      - {text: "`if stock in 12:`", correct: false}
      - {text: "`if 12 == stock:`", correct: false}
    answer: |-
      ```python
      if 12 in stock.values():
          print("une quantité de 12 existe")
      ```
      `in` sur un dictionnaire teste les clés ; `stock.keys()` revient au même. Les quantités sont les valeurs.
  - key: bug-range-flottant
    format: bug-fix
    question: |-
      Ce code affiche « anormale » pour 37,5 degrés. Quelle correction est la bonne ?
      ```python
      temperature = 37.5
      if temperature in range(36, 38):
          print("normale")
      else:
          print("anormale")
      ```
    choices:
      - {text: "`if 36 <= temperature < 38:`", correct: true}
      - {text: "`if temperature in range(36, 39):`", correct: false}
      - {text: "`if temperature in range(36.0, 38.0):`", correct: false}
      - {text: "`if int(temperature) in range(36):`", correct: false}
    answer: |-
      ```python
      if 36 <= temperature < 38:
          print("normale")
      ```
      `range` ne contient que des entiers : 37,5 n'en fait pas partie. `range(36.0, 38.0)` lève une `TypeError`. Une comparaison enchaînée teste un intervalle continu.
  - key: bug-bornes-inversees
    format: bug-fix
    question: |-
      La condition n'est jamais vraie, même pour `x = 5`. Quelle correction est la bonne ?
      ```python
      x = 5
      if 0 > x > 10:
          print("dans l'intervalle")
      ```
    choices:
      - {text: "`if 0 < x < 10:`", correct: true}
      - {text: "`if 0 > x < 10:`", correct: false}
      - {text: "`if (0 > x) > 10:`", correct: false}
      - {text: "`if x > 0 > 10:`", correct: false}
    answer: |-
      ```python
      if 0 < x < 10:
          print("dans l'intervalle")
      ```
      `0 > x > 10` exige `x < 0` et `x > 10` à la fois : c'est impossible. On écrit l'intervalle dans l'ordre croissant.
  - key: bug-sous-chaine
    format: bug-fix
    question: |-
      L'utilisateur n'appartient qu'aux groupes « lecteurs » et « redacteurs », mais ce code affiche « membre de lecteur ». Quelle correction est la bonne ?
      ```python
      groupes = "lecteurs,redacteurs"
      if "lecteur" in groupes:
          print("membre de lecteur")
      else:
          print("pas membre")
      ```
    choices:
      - {text: "`if \"lecteur\" in groupes.split(\",\"):`", correct: true}
      - {text: "`if \"lecteur\" == groupes:`", correct: false}
      - {text: "`if \"lecteur,\" in groupes:`", correct: false}
      - {text: "`if groupes in \"lecteur\":`", correct: false}
    answer: |-
      ```python
      if "lecteur" in groupes.split(","):
          print("membre de lecteur")
      ```
      Sur une chaîne, `in` cherche une sous-chaîne : « lecteur » est dans « lecteurs ». Découper la chaîne en liste fait comparer des éléments entiers.
