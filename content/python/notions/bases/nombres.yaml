notion: nombres
lesson: |-
  Python a trois types de nombres intégrés :

  | Type | Exemple | À retenir |
  |---|---|---|
  | `int` | `42`, `-7`, `10 ** 100` | **précision illimitée** : jamais de débordement |
  | `float` | `3.14`, `1e-3`, `2.0` | un flottant IEEE 754 sur 64 bits (le `double` de Java) |
  | `complex` | `3 + 4j` | rare hors du calcul scientifique |

  **Les littéraux** : `1_000_000` (le souligné sépare les milliers), `0x1F` (hexadécimal), `0o17` (octal),
  `0b1010` (binaire), `1e3` (un `float` : `1000.0`).

  **Les opérateurs**

  | Opérateur | Rôle | Exemple |
  |---|---|---|
  | `/` | division, **toujours** un `float` | `7 / 2` vaut `3.5`, `10 / 2` vaut `5.0` |
  | `//` | division entière, arrondie **vers moins l'infini** | `7 // 2` vaut `3`, `-7 // 2` vaut `-4` |
  | `%` | reste, du **signe du diviseur** | `7 % 3` vaut `1`, `-7 % 3` vaut `2` |
  | `**` | puissance, associative à droite | `2 ** 10` vaut `1024`, `2 ** 3 ** 2` vaut `512` |
  | `divmod(a, b)` | le quotient et le reste | `divmod(17, 5)` vaut `(3, 2)` |

  `//` et `%` sont liés : `a == (a // b) * b + a % b`, toujours. Attention aux habitudes : en Java ou en C, `-7 / 2`
  vaut `-3` (arrondi vers zéro) ; en Python, `-7 // 2` vaut `-4`. Et `^` n'est pas la puissance, mais le « ou
  exclusif » bit à bit : `3 ^ 2` vaut `1`.

  **Les mélanges** : un `int` et un `float` donnent un `float` (`1 + 2.0` vaut `3.0`). `-2 ** 2` vaut `-4` : la
  puissance passe avant le signe.

  **Pas de `++`** : on écrit `n += 1`. (`++n` est accepté, mais ce n'est que deux fois le plus unaire : `n` ne change
  pas.)

  **Les fonctions utiles** : `abs`, `round`, `min`, `max`, `sum`, `pow(a, b, mod)` ; le module `math` (`sqrt`,
  `floor`, `ceil`, `pi`).

  **Les limites** : une division par zéro, entière ou non, lève `ZeroDivisionError: division by zero`. Et si un `int`
  n'a pas de taille maximale, sa conversion en chaîne est plafonnée à 4300 chiffres par défaut (une protection contre
  les dénis de service) : au-delà, `str(n)` lève une `ValueError`.

  **En entretien** : « Les entiers Python ont une précision illimitée, les flottants sont des doubles IEEE 754. `/`
  donne toujours un flottant, `//` est la division entière arrondie vers moins l'infini, `%` prend le signe du
  diviseur, et `**` est la puissance. »
tour:
  - title: Entiers et flottants
    text: |-
      Les entiers Python n'ont pas de taille maximale : `2 ** 64` ne déborde pas. Les flottants sont des doubles,
      comme en Java.

      Les opérateurs à connaître : `/` donne toujours un flottant, `//` la division entière, `%` le reste, `**` la
      puissance. Pour les nombres négatifs, `//` arrondit vers moins l'infini : `-7 // 2` vaut `-4`, pas `-3` comme en
      Java. `divmod` donne le quotient et le reste d'un coup.

      Essaie : remplace `2 ** 64` par `2 ** 64 - 1`, le plus grand entier non signé sur 64 bits.
    example:
      files:
        main.py: |-
          print(2 ** 64)
          print(7 / 2, 7 // 2, 7 % 2)
          print(-7 // 2, -7 % 2)
          print(1_000_000 + 0.5)
          print(divmod(125, 60))
      output: |-
        18446744073709551616
        3.5 3 1
        -4 1
        1000000.5
        (2, 5)
    task:
      instructions: |-
        Convertis `secondes` en heures, minutes et secondes, avec `//` et `%`. Le programme doit afficher
        `1 h 2 min 5 s`.
      starter:
        main.py: |-
          secondes = 3725
          heures = 0
          minutes = 0
          reste = secondes
          print(heures, "h", minutes, "min", reste, "s")
      solution:
        main.py: |-
          secondes = 3725
          heures = secondes // 3600
          minutes = secondes % 3600 // 60
          reste = secondes % 60
          print(heures, "h", minutes, "min", reste, "s")
      output: |-
        1 h 2 min 5 s
cards:
  - key: division-simple
    format: course
    question: Que vaut `7 / 2` en Python 3 ?
    choices:
      - {text: "`3.5`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`3.0`", correct: false}
      - {text: "`4`", correct: false}
    answer: "`/` est la vraie division, et donne toujours un `float`. La division entière s'écrit `//` : `7 // 2` vaut `3`."
  - key: int-illimite
    format: course
    question: Que se passe-t-il quand un `int` Python dépasse `2 ** 63` ?
    choices:
      - {text: "Rien de spécial : sa précision est illimitée", correct: true}
      - {text: "Il déborde, et devient un grand nombre négatif", correct: false}
      - {text: "Python lève une `OverflowError` dans le calcul", correct: false}
      - {text: "Il est converti en `float`, et perd en précision", correct: false}
    answer: "Un `int` grandit autant que la mémoire le permet : `2 ** 1000` est exact. Seuls les `float` ont une taille fixe (64 bits)."
  - key: sens-arrondi-division-entiere
    format: course
    question: Dans quel sens `//` arrondit-il son résultat ?
    choices:
      - {text: "Vers moins l'infini : `-7 // 2` vaut `-4`", correct: true}
      - {text: "Vers zéro, comme Java : `-7 // 2` vaut `-3`", correct: false}
      - {text: "Vers l'entier le plus proche : `7 // 2` vaut `4`", correct: false}
      - {text: "Vers plus l'infini : `7 // 2` vaut `4`", correct: false}
    answer: "C'est la division « plancher » (`math.floor` du quotient). Elle va de pair avec `%`, qui prend le signe du diviseur : `-7 % 2` vaut `1`."
  - key: puissance-associativite
    format: course
    question: Que vaut `2 ** 3 ** 2` ?
    choices:
      - {text: "`512`", correct: true}
      - {text: "`64`", correct: false}
      - {text: "`36`", correct: false}
      - {text: "`12`", correct: false}
    answer: "`**` est associatif à droite : `2 ** (3 ** 2)`, soit `2 ** 9`. De gauche à droite, on aurait `(2 ** 3) ** 2 = 64`."
  - key: vf-division-entiere-implicite
    format: true-false
    question: "`10 / 2` renvoie l'entier `5`."
    truth: false
    answer: "`/` renvoie toujours un `float` : `5.0`. Pour un entier, `10 // 2`."
  - key: vf-signe-modulo
    format: true-false
    question: "Le résultat de `%` prend le signe du diviseur : `-7 % 3` vaut `2`."
    truth: true
    answer: "`-7 // 3` vaut `-3`, et `-3 * 3 + 2 == -7`. En Java ou en C, `-7 % 3` vaut `-1`."
  - key: vf-float-64-bits
    format: true-false
    question: Un `float` Python est un nombre à virgule flottante sur 64 bits (IEEE 754).
    truth: true
    answer: "C'est le `double` de C et de Java : environ 15 à 17 chiffres significatifs. Pour plus, `decimal` ou `fractions`."
  - key: vf-plus-plus
    format: true-false
    question: Python a un opérateur `++` qui incrémente un entier.
    truth: false
    answer: "On écrit `n += 1`. `n++` est une `SyntaxError` ; `++n` est accepté, mais c'est deux plus unaires : `n` ne change pas."
  - key: qcm-operateur-puissance
    format: multiple-choice
    question: Quel opérateur calcule une puissance ?
    choices:
      - {text: "`**`", correct: true}
      - {text: "`^`", correct: false}
      - {text: "`^^`", correct: false}
      - {text: "`pow`", correct: false}
    answer: "`2 ** 10` vaut `1024`. `^` est le « ou exclusif » bit à bit, et `pow` une fonction, qui s'appelle : `pow(2, 10)`."
  - key: qcm-divmod
    format: multiple-choice
    question: Que renvoie `divmod(17, 5)` ?
    choices:
      - {text: "`(3, 2)`", correct: true}
      - {text: "`(2, 3)`", correct: false}
      - {text: "`3.4`", correct: false}
      - {text: "`[3, 2]`", correct: false}
    answer: "Le tuple `(17 // 5, 17 % 5)` : le quotient, puis le reste."
  - key: qcm-litteral-million
    format: multiple-choice
    question: Lequel de ces littéraux vaut un million ?
    choices:
      - {text: "`1_000_000`", correct: true}
      - {text: "`1,000,000`", correct: false}
      - {text: "`1'000'000`", correct: false}
      - {text: "`1 000 000`", correct: false}
    answer: "Le souligné sépare les chiffres sans changer la valeur. `1,000,000` est le tuple `(1, 0, 0)`, et les deux autres sont des erreurs de syntaxe."
  - key: qcm-type-division
    format: multiple-choice
    question: Que renvoie `type(4 / 2)` ?
    choices:
      - {text: "`<class 'float'>`", correct: true}
      - {text: "`<class 'int'>`", correct: false}
      - {text: "`<class 'number'>`", correct: false}
      - {text: "`<class 'decimal.Decimal'>`", correct: false}
    answer: "`4 / 2` vaut `2.0` : `/` donne un `float`, même quand la division tombe juste."
  - key: trous-quotient
    format: fill-in
    question: |-
      Complète pour obtenir le quotient entier de 17 par 5 (`3`) :
      ```python
      q = 17 ___ 5
      ```
    blanks: [["//"]]
    answer: "`//` est la division entière."
  - key: trous-reste
    format: fill-in
    question: |-
      Complète pour obtenir le reste de la division de 17 par 5 (`2`) :
      ```python
      r = 17 ___ 5
      ```
    blanks: [["%"]]
    answer: "`%` est le reste (modulo). `divmod(17, 5)` donne les deux d'un coup."
  - key: trous-puissance
    format: fill-in
    question: |-
      Complète pour calculer 2 puissance 10 :
      ```python
      x = 2 ___ 10
      ```
    blanks: [["**"]]
    answer: "`**` est la puissance ; `^` est le « ou exclusif »."
  - key: trous-separateur
    format: fill-in
    question: |-
      Complète pour écrire un million de façon lisible :
      ```python
      n = 1___000___000
      ```
    blanks: [[_], [_]]
    answer: "`1_000_000` : le souligné ne change pas la valeur."
  - key: code-negatifs
    format: code-output
    question: |-
      ```python
      print(-7 // 2, -7 % 2)
      ```
    answer: "`-4 1` : `//` arrondit vers moins l'infini, et `-4 * 2 + 1 == -7`."
    check:
      output: "-4 1"
    choices:
      - {text: "`-4 1`", correct: true}
      - {text: "`-3 -1`", correct: false}
      - {text: "`-3 1`", correct: false}
      - {text: "`-4 -1`", correct: false}
  - key: code-grand-entier
    format: code-output
    question: |-
      ```python
      print(2 ** 100 > 10 ** 30, type(2 ** 100).__name__)
      ```
    answer: "`True int` : `2 ** 100` vaut environ 1,27 × 10³⁰, et reste un `int` exact."
    check:
      output: "True int"
    choices:
      - {text: "`True int`", correct: true}
      - {text: "`True float`", correct: false}
      - {text: "`False int`", correct: false}
      - {text: "Une `OverflowError`", correct: false}
  - key: code-trois-divisions
    format: code-output
    question: |-
      ```python
      print(10 / 5, 10 // 4, 10 % 4)
      ```
    answer: "`2.0 2 2` : `/` donne un `float`, `//` le quotient entier, `%` le reste."
    check:
      output: "2.0 2 2"
    choices:
      - {text: "`2.0 2 2`", correct: true}
      - {text: "`2 2 2`", correct: false}
      - {text: "`2 2.5 2`", correct: false}
      - {text: "`2.0 2.5 2`", correct: false}
  - key: code-round-int
    format: code-output
    question: |-
      ```python
      print(round(7 / 2), int(7 / 2), -7 // 2)
      ```
    answer: "`4 3 -4` : `round(3.5)` arrondit au pair (`4`), `int` tronque vers zéro (`3`), `//` arrondit vers moins l'infini (`-4`)."
    check:
      output: "4 3 -4"
    choices:
      - {text: "`4 3 -4`", correct: true}
      - {text: "`3 3 -3`", correct: false}
      - {text: "`4 4 -3`", correct: false}
      - {text: "`4 3 -3`", correct: false}
  - key: bug-moyenne-tronquee
    format: bug-fix
    question: |-
      La moyenne affichée est `13`, alors que les notes donnent 13,67 :
      ```python
      notes = [12, 15, 14]
      moyenne = sum(notes) // len(notes)
      print(moyenne)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`moyenne = sum(notes) / len(notes)`", correct: true}
      - {text: "`moyenne = float(sum(notes) // len(notes))`", correct: false}
      - {text: "`moyenne = sum(notes) % len(notes)`", correct: false}
      - {text: "`moyenne = round(sum(notes) // len(notes), 2)`", correct: false}
    answer: |-
      ```python
      notes = [12, 15, 14]
      moyenne = sum(notes) / len(notes)
      print(moyenne)
      ```
      `//` est la division entière : la partie décimale est perdue avant toute conversion. `/` garde la fraction.
  - key: bug-indice-flottant
    format: bug-fix
    question: |-
      Ce script s'arrête avec « TypeError: list indices must be integers or slices, not float » :
      ```python
      notes = [12, 15, 9]
      print(notes[len(notes) / 2])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`notes[len(notes) // 2]`", correct: true}
      - {text: "`notes[len(notes) % 2]`", correct: false}
      - {text: "`notes[float(len(notes) / 2)]`", correct: false}
      - {text: "`notes[len(notes) / 2.0]`", correct: false}
    answer: |-
      ```python
      notes = [12, 15, 9]
      print(notes[len(notes) // 2])
      ```
      `/` renvoie un `float` (`1.5`), qui ne peut pas servir d'indice. `//` donne l'entier `1`.
  - key: bug-chapeau-puissance
    format: bug-fix
    question: |-
      L'aire d'un carré de côté 3 s'affiche `1` :
      ```python
      cote = 3
      aire = cote ^ 2
      print(aire)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`aire = cote ** 2`", correct: true}
      - {text: "`aire = cote ^^ 2`", correct: false}
      - {text: "`aire = pow(cote ^ 2)`", correct: false}
      - {text: "`aire = cote * 2`", correct: false}
    answer: |-
      ```python
      cote = 3
      aire = cote ** 2
      print(aire)
      ```
      `^` est le « ou exclusif » bit à bit : `0b11 ^ 0b10` vaut `0b01`, soit `1`. La puissance s'écrit `**`.
  - key: bug-division-par-zero
    format: bug-fix
    question: |-
      Sans aucune vente, ce script s'arrête avec « ZeroDivisionError: division by zero » :
      ```python
      total, nombre = 0, 0
      print(total / nombre)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(total / nombre if nombre else 0)`", correct: true}
      - {text: "`print(total // nombre)`", correct: false}
      - {text: "`print(float(total) / nombre)`", correct: false}
      - {text: "`print(total / (nombre or None))`", correct: false}
    answer: |-
      ```python
      total, nombre = 0, 0
      print(total / nombre if nombre else 0)
      ```
      Toute division par zéro lève une `ZeroDivisionError`, avec `/`, `//` ou `%`, entre entiers comme entre
      flottants : il faut traiter le cas avant de diviser.
