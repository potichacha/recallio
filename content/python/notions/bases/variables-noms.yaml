notion: variables-noms
lesson: |-
  En Python, une variable n'est pas une boîte qui contient une valeur : c'est un **nom lié à un objet**, comme une
  étiquette. L'affectation `x = 5` crée (ou retrouve) l'objet `5`, puis attache le nom `x` à cet objet.

  - **Pas de déclaration** : le nom existe dès sa première affectation. Le lire avant donne une `NameError`.
  - **Pas de type pour le nom** : `x` peut désigner un entier, puis une chaîne. Le type est porté par l'objet.
  - **Réaffecter** attache le nom à un autre objet ; l'ancien objet n'est pas modifié.

  ```python
  x = 5
  x = "cinq"            # x désigne maintenant une chaîne

  a = b = 0             # deux noms, un même objet
  x, y = 1, 2           # affectation multiple (déballage d'un tuple)
  x, y = y, x           # échange, sans variable temporaire
  compteur += 1         # affectation augmentée : il n'y a pas de ++
  del x                 # supprime le nom (pas forcément l'objet)
  ```

  **Deux noms, un objet.** Après `b = a`, les deux noms désignent **le même** objet. Pour un entier ou une chaîne
  (immuables), cela ne se voit pas : réaffecter `a` ne change pas `b`. Pour une liste (mutable), modifier l'objet par
  un nom se voit par l'autre :

  ```python
  a = [1, 2]
  b = a                 # pas de copie
  b.append(3)
  print(a)              # [1, 2, 3]
  b = a.copy()          # une vraie copie (ou list(a))
  ```

  **Les règles des noms** : des lettres, des chiffres et `_`, sans commencer par un chiffre ; la casse compte (`total`
  et `Total` sont deux noms) ; les mots-clés (`class`, `def`, `if`, `None`...) sont interdits. Les lettres accentuées
  sont permises (`année = 2026`), mais l'usage est l'ASCII. On évite de masquer une fonction native : appeler une
  variable `list` ou `str` rend cette fonction inutilisable ensuite. Par convention, `_` nomme une valeur ignorée
  (`for _ in range(3)`).

  | Erreur | Cause |
  |---|---|
  | `NameError: name 'total' is not defined` | nom lu avant sa première affectation |
  | `ValueError: too many values to unpack (expected 2, got 3)` | plus de valeurs que de noms à gauche |
  | `SyntaxError: cannot assign to expression here` | un nom invalide, comme `ma-variable` (un tiret) |

  **En entretien** : « Une variable est un nom lié à un objet, sans déclaration ni type : c'est l'objet qui a un type.
  L'affectation ne copie jamais : deux noms peuvent désigner le même objet, ce qui compte quand il est mutable. Python
  permet l'affectation multiple, d'où l'échange `a, b = b, a`. »
tour:
  - title: Des noms liés à des objets
    text: |-
      Une variable se crée en lui affectant une valeur : pas de déclaration, pas de type. Le même nom peut ensuite
      désigner un objet d'un autre type.

      Python affecte plusieurs noms d'un coup : `x, y = 1, 2`. L'échange de deux variables tient donc en une ligne,
      `x, y = y, x`, sans variable temporaire. Il n'y a pas d'opérateur `++` : on écrit `a += 5`.

      Essaie : ajoute à la fin `print(z)`, sans avoir défini `z`. Python s'arrête sur une `NameError`.
    example:
      files:
        main.py: |-
          langage = "Python"
          version = 3.14
          print(langage, version)

          version = "trois point quatorze"
          print(langage, version)

          x, y = 1, 2
          x, y = y, x
          print(x, y)

          a = b = 0
          a += 5
          print(a, b)
      output: |-
        Python 3.14
        Python trois point quatorze
        2 1
        5 0
cards:
  - key: affectation
    format: course
    question: Que fait l'affectation `x = 5` en Python ?
    choices:
      - {text: "Elle lie le nom `x` à l'objet entier `5`", correct: true}
      - {text: "Elle déclare une variable `int` et y copie `5`", correct: false}
      - {text: "Elle crée une constante `x`, qu'on ne peut plus changer", correct: false}
      - {text: "Elle compare `x` à `5` et renvoie un booléen", correct: false}
    answer: "Le nom n'a pas de type : il désigne un objet, qui en a un. Une autre affectation attachera `x` à un autre objet."
  - key: echange
    format: course
    question: Comment échanger les valeurs de `a` et de `b` en une ligne ?
    choices:
      - {text: "`a, b = b, a`", correct: true}
      - {text: "`a = b = a`", correct: false}
      - {text: "`swap(a, b)`", correct: false}
      - {text: "`a, b = a, b`", correct: false}
    answer: "Le côté droit est évalué d'abord, en un tuple `(b, a)`, puis déballé dans `a` et `b`. Python n'a pas de fonction `swap`."
  - key: nom-jamais-affecte
    format: course
    question: Que se passe-t-il quand un script lit un nom qui n'a jamais été affecté ?
    choices:
      - {text: "Python lève une `NameError`", correct: true}
      - {text: "Le nom vaut `None`", correct: false}
      - {text: "Le nom vaut `0`", correct: false}
      - {text: "Python lève une `KeyError`", correct: false}
    answer: "Un nom n'existe qu'après sa première affectation : « NameError: name 'x' is not defined ». Il n'y a pas de valeur par défaut."
  - key: deux-noms-une-liste
    format: course
    question: "Après `a = [1, 2]` puis `b = a`, combien de listes existent ?"
    choices:
      - {text: "Une seule, désignée par deux noms", correct: true}
      - {text: "Deux listes égales, mais distinctes", correct: false}
      - {text: "Deux listes, que Python synchronise", correct: false}
      - {text: "Une seule, que `a` a cédée à `b`", correct: false}
    answer: "L'affectation ne copie jamais. `b.append(3)` modifie la liste que `a` désigne aussi. Pour une copie : `b = a.copy()` ou `list(a)`."
  - key: vf-declaration
    format: true-false
    question: Une variable Python doit être déclarée avec son type avant d'être utilisée.
    truth: false
    answer: "La première affectation crée le nom. Les annotations (`x: int = 5`) sont facultatives, et l'interpréteur ne les vérifie pas."
  - key: vf-chiffre-initial
    format: true-false
    question: Un nom de variable peut commencer par un chiffre, comme `2eme`.
    truth: false
    answer: "Un nom commence par une lettre ou un souligné ; les chiffres viennent après : `deuxieme`, `etape_2`."
  - key: vf-a-egal-b-egal-liste
    format: true-false
    question: "Après `a = b = []`, `a` et `b` désignent la même liste."
    truth: true
    answer: "Une seule liste est créée, puis liée aux deux noms. `a.append(1)` se voit aussi par `b`."
  - key: vf-casse
    format: true-false
    question: "Les noms sont sensibles à la casse : `total` et `Total` sont deux variables différentes."
    truth: true
    answer: "Python distingue majuscules et minuscules partout : noms de variables, de fonctions, mots-clés (`True`, pas `true`)."
  - key: qcm-nom-valide
    format: multiple-choice
    question: Lequel de ces noms de variable est valide ?
    choices:
      - {text: "`_total2`", correct: true}
      - {text: "`2total`", correct: false}
      - {text: "`total-ht`", correct: false}
      - {text: "`class`", correct: false}
    answer: "Lettres, chiffres et soulignés, sans chiffre au début. `total-ht` se lit comme une soustraction, et `class` est un mot-clé."
  - key: qcm-plus-egal
    format: multiple-choice
    question: "Que vaut `n` après `n = 10`, puis `n += 5` ?"
    choices:
      - {text: "`15`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`105`", correct: false}
      - {text: "Une `SyntaxError`", correct: false}
    answer: "`n += 5` équivaut ici à `n = n + 5`. Python n'a pas de `++`, mais a toutes les affectations augmentées : `-=`, `*=`, `//=`..."
  - key: qcm-masquer-list
    format: multiple-choice
    question: Pourquoi éviter d'appeler une variable `list` ?
    choices:
      - {text: "Elle masque la fonction native `list` dans la suite du module", correct: true}
      - {text: "`list` est un mot-clé : Python lève une `SyntaxError`", correct: false}
      - {text: "Python la renomme en `list_` sans prévenir, à la compilation", correct: false}
      - {text: "Les noms de types sont réservés aux classes en Python", correct: false}
    answer: "`list` n'est pas un mot-clé, mais un nom de la bibliothèque native. Le réaffecter est permis, et `list(...)` ne marche plus ensuite."
  - key: qcm-affectation-multiple
    format: multiple-choice
    question: "Que fait `x, y = 3, 4` ?"
    choices:
      - {text: "Elle lie `x` à `3` et `y` à `4`", correct: true}
      - {text: "Elle lie `x` et `y` au tuple `(3, 4)`", correct: false}
      - {text: "Elle compare `(x, y)` au tuple `(3, 4)`", correct: false}
      - {text: "Elle lie `x` à `3` et ignore le reste", correct: false}
    answer: "Le côté droit forme le tuple `(3, 4)`, que Python déballe : un nom par valeur. Le nombre de noms doit correspondre au nombre de valeurs."
  - key: trous-echange
    format: fill-in
    question: |-
      Complète pour échanger `a` et `b` en une ligne :
      ```python
      a, b = ___, ___
      ```
    blanks: [[b], [a]]
    answer: "`a, b = b, a` : le côté droit est évalué avant l'affectation."
  - key: trous-double-affectation
    format: fill-in
    question: |-
      Complète pour mettre les deux compteurs à zéro en une instruction :
      ```python
      succes ___ echecs = 0
      ```
    blanks: [["="]]
    answer: "`succes = echecs = 0` lie les deux noms au même objet `0`, ce qui ne pose pas de problème pour un entier."
  - key: trous-increment
    format: fill-in
    question: |-
      Complète pour ajouter 1 à `compteur` (Python n'a pas de `++`) :
      ```python
      compteur ___ 1
      ```
    blanks: [["+="]]
    answer: "`compteur += 1`, l'affectation augmentée."
  - key: trous-del
    format: fill-in
    question: |-
      Complète pour supprimer le nom `temp` :
      ```python
      ___ temp
      ```
    blanks: [[del]]
    answer: "`del temp` supprime le nom ; le lire ensuite donne une `NameError`. L'objet disparaît quand plus rien ne le désigne."
  - key: code-reaffectation
    format: code-output
    question: |-
      ```python
      a = 1
      b = a
      a = 2
      print(a, b)
      ```
    answer: "`2 1` : `a = 2` attache `a` à un autre objet ; `b` désigne toujours `1`."
    check:
      output: "2 1"
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`2 2`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`1 2`", correct: false}
  - key: code-liste-partagee
    format: code-output
    question: |-
      ```python
      a = [1, 2]
      b = a
      b.append(3)
      print(a)
      ```
    answer: "`[1, 2, 3]` : `a` et `b` désignent la même liste, modifiée par `append`."
    check:
      output: "[1, 2, 3]"
    choices:
      - {text: "`[1, 2, 3]`", correct: true}
      - {text: "`[1, 2]`", correct: false}
      - {text: "`[3]`", correct: false}
      - {text: "`None`", correct: false}
  - key: code-affectation-simultanee
    format: code-output
    question: |-
      ```python
      x, y = 1, 2
      x, y = y, x + y
      print(x, y)
      ```
    answer: "`2 3` : le côté droit est entièrement évalué avant l'affectation, avec les anciennes valeurs (`2` et `1 + 2`)."
    check:
      output: "2 3"
    choices:
      - {text: "`2 3`", correct: true}
      - {text: "`2 4`", correct: false}
      - {text: "`1 2`", correct: false}
      - {text: "`2 2`", correct: false}
  - key: code-changement-type
    format: code-output
    question: |-
      ```python
      valeur = 10
      valeur = "dix"
      print(valeur)
      ```
    answer: "`dix` : le nom désigne maintenant une chaîne. Un nom n'a pas de type, il peut changer d'objet."
    check:
      output: "dix"
    choices:
      - {text: "`dix`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`10 dix`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: bug-total-non-initialise
    format: bug-fix
    question: |-
      Ce script s'arrête avec « NameError: name 'total' is not defined » :
      ```python
      for prix in [10, 20]:
          total = total + prix
      print(total)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `total = 0` avant la boucle", correct: true}
      - {text: "Écrire `total = 0` au début du corps de la boucle", correct: false}
      - {text: "Déclarer `int total` avant la boucle", correct: false}
      - {text: "Écrire `global total` avant la boucle", correct: false}
    answer: |-
      ```python
      total = 0
      for prix in [10, 20]:
          total = total + prix
      print(total)
      ```
      Le nom doit exister avant d'être lu. Dans la boucle, `total = 0` le remettrait à zéro à chaque tour.
  - key: bug-echange-rate
    format: bug-fix
    question: |-
      Ce code devait échanger `a` et `b`, mais il affiche `2 2` :
      ```python
      a, b = 1, 2
      a = b
      b = a
      print(a, b)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Remplacer les deux lignes par `a, b = b, a`", correct: true}
      - {text: "Inverser l'ordre : `b = a`, puis `a = b`", correct: false}
      - {text: "Remplacer les deux lignes par `a = b = a`", correct: false}
      - {text: "Écrire `b = a.copy()` à la place de `b = a`", correct: false}
    answer: |-
      ```python
      a, b = 1, 2
      a, b = b, a
      print(a, b)
      ```
      Après `a = b`, l'ancienne valeur de `a` est perdue. L'affectation multiple évalue d'abord `(b, a)`, puis affecte.
  - key: bug-trop-de-valeurs
    format: bug-fix
    question: |-
      Ce script s'arrête avec « ValueError: too many values to unpack (expected 2, got 3) » :
      ```python
      nom, age = "Ada", 36, "Londres"
      print(nom, age)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`nom, age, ville = \"Ada\", 36, \"Londres\"`", correct: true}
      - {text: "`nom, age = (\"Ada\", 36, \"Londres\")`", correct: false}
      - {text: "`nom = age = \"Ada\", 36, \"Londres\"`", correct: false}
      - {text: "`[nom, age] = \"Ada\", 36, \"Londres\"`", correct: false}
    answer: |-
      ```python
      nom, age, ville = "Ada", 36, "Londres"
      print(nom, age)
      ```
      Le déballage demande autant de noms que de valeurs. Les parenthèses ou les crochets ne changent rien au compte.
  - key: bug-tiret-dans-nom
    format: bug-fix
    question: |-
      Ce script refuse de se lancer : « SyntaxError: cannot assign to expression here. Maybe you meant '==' instead of
      '='? »
      ```python
      ma-variable = 3
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`ma_variable = 3`", correct: true}
      - {text: "`ma-variable == 3`", correct: false}
      - {text: "`var ma-variable = 3`", correct: false}
      - {text: "`\"ma-variable\" = 3`", correct: false}
    answer: |-
      ```python
      ma_variable = 3
      ```
      Un tiret est l'opérateur de soustraction : `ma-variable` est l'expression `ma - variable`, à laquelle on ne peut
      rien affecter. Les mots d'un nom se séparent par un souligné.
