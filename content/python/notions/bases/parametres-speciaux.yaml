notion: parametres-speciaux
lesson: |-
  Deux marqueurs, dans la signature, fixent **comment** chaque paramètre peut être passé :

  ```python
  def f(pos1, pos2, /, standard, *, nomme1, nomme2):
      ...
  ```

  | Zone | Passage permis | Depuis |
  |---|---|---|
  | avant `/` | **par position seulement** | Python 3.8 (PEP 570) |
  | entre `/` et `*` | par position ou par nom | toujours |
  | après `*` (ou après `*args`) | **par nom seulement** | Python 3.0 (PEP 3102) |

  `/` doit précéder `*` (« / must be ahead of * »).

  **Pourquoi des paramètres positionnels seuls ?**

  - Le nom n'a pas de sens pour l'appelant : `len(obj)`, `abs(x)`. L'aide de `abs` affiche `abs(x, /)`, et
    `abs(x=-3)` échoue.
  - L'auteur peut **renommer** le paramètre sans casser le code des appelants.
  - Le nom reste libre pour `**kwargs` : `def f(nom, /, **options)` accepte `f("a", nom="b")`.

  **Pourquoi des paramètres nommés seuls ?**

  - La **lisibilité** des options : `sorted(xs, reverse=True)` ; un `True` passé par position ne dit pas ce qu'il règle.
    `key` et `reverse` de `sorted` sont nommés seulement.
  - On peut ajouter ou réordonner des options sans casser les appels existants.

  **Les erreurs**

  ```
  f(a=1)  avec def f(a, /)      ->  f() got some positional-only arguments passed as keyword arguments: 'a'
  f(1, 2) avec def f(a, *, b)   ->  f() takes 1 positional argument but 2 were given
  f(1)    avec def f(a, *, b)   ->  f() missing 1 required keyword-only argument: 'b'
  ```

  **En entretien** : « Tout ce qui précède `/` se passe par position seulement, tout ce qui suit `*` par nom seulement.
  Le premier libère le nom du paramètre, comme pour `len` ; le second rend les options lisibles, comme `reverse=True`
  dans `sorted`. »
cards:
  - key: sens-barre
    format: course
    question: Que signifie le `/` dans `def f(a, b, /, c):` ?
    choices:
      - {text: "`a` et `b` ne se passent que par position", correct: true}
      - {text: "`a` et `b` ne se passent que par leur nom", correct: false}
      - {text: "`c` ne se passe que par position", correct: false}
      - {text: "`a` et `b` deviennent facultatifs", correct: false}
    answer: "Les paramètres avant `/` sont positionnels seulement (PEP 570, Python 3.8). `c` se passe des deux façons."
  - key: sens-etoile-seule
    format: course
    question: Que signifie le `*` seul dans `def f(a, *, b):` ?
    choices:
      - {text: "`b` ne se passe que par son nom", correct: true}
      - {text: "`b` reçoit les arguments positionnels en trop", correct: false}
      - {text: "`a` ne se passe que par position", correct: false}
      - {text: "`b` est facultatif et vaut `None` par défaut", correct: false}
    answer: "Un `*` sans nom n'absorbe rien : il marque seulement que les paramètres suivants sont nommés seulement."
  - key: pourquoi-reverse-nomme
    format: course
    question: Pourquoi `sorted` impose-t-il de passer `reverse=True` par son nom ?
    choices:
      - {text: "Un booléen passé par position ne dit pas ce qu'il règle", correct: true}
      - {text: "Un booléen ne peut pas être passé par position en Python", correct: false}
      - {text: "Les arguments nommés sont plus rapides à transmettre", correct: false}
      - {text: "`sorted` est écrite en C, qui ignore les positions", correct: false}
    answer: "`sorted(xs, None, True)` serait illisible. Nommés seulement, `key` et `reverse` rendent chaque appel explicite."
  - key: pourquoi-positionnel-seul
    format: course
    question: Pourquoi rendre un paramètre positionnel seulement, avec `/` ?
    choices:
      - {text: "Pour pouvoir le renommer sans casser les appelants", correct: true}
      - {text: "Pour que l'argument soit copié plutôt que partagé", correct: false}
      - {text: "Pour lui interdire toute valeur par défaut", correct: false}
      - {text: "Pour le rendre obligatoire à chaque appel", correct: false}
    answer: "Aucun appelant ne peut l'avoir nommé : son nom devient un détail d'implémentation. C'est aussi ce que font `len` ou `abs`, dont le nom du paramètre n'a pas de sens."
  - key: vf-version-barre
    format: true-false
    question: Le séparateur `/` dans une signature existe depuis Python 3.8.
    truth: true
    answer: "PEP 570. Avant, seules les fonctions écrites en C pouvaient avoir des paramètres positionnels seulement."
  - key: vf-apres-barre-nomme
    format: true-false
    question: "Avec `def f(a, /, b):`, l'appel `f(1, b=2)` est valide."
    truth: true
    answer: "`a` est passé par position, comme exigé ; `b`, placé après `/`, accepte les deux façons."
  - key: vf-etoile-positionnel
    format: true-false
    question: "Avec `def f(*, a, b):`, l'appel `f(1, 2)` est valide."
    truth: false
    answer: "`a` et `b` sont nommés seulement : « f() takes 0 positional arguments but 2 were given ». Il faut `f(a=1, b=2)`."
  - key: vf-barre-apres-etoile
    format: true-false
    question: Dans une signature, `/` peut être placé après `*`.
    truth: false
    answer: "C'est une `SyntaxError` : « / must be ahead of * »."
  - key: qcm-appel-valide
    format: multiple-choice
    question: "Avec `def f(a, /, b, *, c)`, quel appel est valide ?"
    choices:
      - {text: "`f(1, 2, c=3)`", correct: true}
      - {text: "`f(a=1, b=2, c=3)`", correct: false}
      - {text: "`f(1, 2, 3)`", correct: false}
      - {text: "`f(1, b=2)`", correct: false}
    answer: "`a` par position, `b` comme on veut, `c` par son nom. `f(1, b=2)` oublie `c`, qui est obligatoire."
  - key: qcm-message-positionnel
    format: multiple-choice
    question: "Avec `def f(a, /)`, quel message accompagne la `TypeError` de l'appel `f(a=1)` ?"
    choices:
      - {text: "`got some positional-only arguments passed as keyword arguments: 'a'`", correct: true}
      - {text: "`missing 1 required positional argument: 'a'`", correct: false}
      - {text: "`got an unexpected keyword argument 'a'`", correct: false}
      - {text: "`takes 0 positional arguments but 1 was given`", correct: false}
    answer: "Python explique la cause exacte : le paramètre `a` existe, mais il ne se passe pas par son nom."
  - key: qcm-forcer-nom
    format: multiple-choice
    question: Quelle signature force `verbeux` à être nommé, sans accepter d'arguments positionnels en trop ?
    choices:
      - {text: "`def f(chemin, *, verbeux=False):`", correct: true}
      - {text: "`def f(chemin, *args, verbeux=False):`", correct: false}
      - {text: "`def f(chemin, /, verbeux=False):`", correct: false}
      - {text: "`def f(chemin, verbeux=False, /):`", correct: false}
    answer: "Le `*` seul force les noms sans rien absorber. `*args` forcerait aussi le nom, mais accepterait des positionnels en trop en silence."
  - key: qcm-aide-abs
    format: multiple-choice
    question: "Dans l'aide de `abs`, que signifie la signature `abs(x, /)` ?"
    choices:
      - {text: "`x` ne se passe que par position : `abs(x=-3)` échoue", correct: true}
      - {text: "`x` ne se passe que par son nom : `abs(-3)` échoue", correct: false}
      - {text: "`x` est facultatif, et vaut 0 par défaut", correct: false}
      - {text: "`abs` n'accepte que des nombres entiers", correct: false}
    answer: "De nombreuses fonctions intégrées ont des paramètres positionnels seulement : leur nom n'a pas de sens pour l'appelant."
  - key: trous-positionnels
    format: fill-in
    question: |-
      Complète pour que `a` et `b` ne se passent que par position :
      ```python
      def distance(a, b, ___):
          return abs(a - b)
      ```
    blanks: [["/"]]
    answer: "Tout ce qui précède `/` est positionnel seulement."
  - key: trous-force-nomme
    format: fill-in
    question: |-
      Complète pour que `force` ne se passe que par son nom :
      ```python
      def supprimer(chemin, ___, force=False):
          ...
      ```
    blanks: [["*"]]
    answer: "Tout ce qui suit `*` est nommé seulement : l'appel s'écrit `supprimer(chemin, force=True)`."
  - key: trous-appel-port
    format: fill-in
    question: |-
      Complète l'appel :
      ```python
      def connecter(hote, *, port):
          ...

      connecter("localhost", ___=5432)
      ```
    blanks: [[port]]
    answer: "`port` est nommé seulement, et obligatoire faute de valeur par défaut."
  - key: trous-trois-zones
    format: fill-in
    question: |-
      Complète la signature : `x` par position seulement, `y` des deux façons, `z` par son nom seulement.
      ```python
      def f(x, ___, y, ___, z):
          ...
      ```
    blanks: [["/"], ["*"]]
    answer: "`/` ferme la zone positionnelle, `*` ouvre la zone nommée ; entre les deux, le passage est libre."
  - key: code-trois-zones
    format: code-output
    question: |-
      ```python
      def f(a, /, b, *, c):
          return a + b + c

      print(f(1, 2, c=3), f(1, b=2, c=3))
      ```
    check:
      output: "6 6"
    choices:
      - {text: "`6 6`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "Une `TypeError`", correct: false}
      - {text: "`123 123`", correct: false}
    answer: "Les deux appels respectent les zones : `a` par position, `b` des deux façons, `c` par son nom."
  - key: code-nom-libre
    format: code-output
    question: |-
      ```python
      def f(nom, /, **options):
          return nom, options

      print(f("a", nom="b"))
      ```
    check:
      output: "('a', {'nom': 'b'})"
    choices:
      - {text: "`('a', {'nom': 'b'})`", correct: true}
      - {text: "`('b', {})`", correct: false}
      - {text: "`('a', {})`", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "Le paramètre `nom` est positionnel seulement : l'argument nommé `nom=` ne le vise pas, et rejoint `options`."
  - key: code-erreur-attrapee
    format: code-output
    question: |-
      ```python
      def f(a, *, b=2):
          return a * b

      try:
          print(f(3, 4))
      except TypeError:
          print("erreur")
      ```
    check:
      output: "erreur"
    choices:
      - {text: "`erreur`", correct: true}
      - {text: "`12`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "`8`", correct: false}
    answer: "`b` est nommé seulement : le 4 passé par position est un argument de trop, d'où la `TypeError`."
  - key: code-nommes-seulement
    format: code-output
    question: |-
      ```python
      def f(*, a, b):
          return a - b

      print(f(b=1, a=5))
      ```
    check:
      output: "4"
    choices:
      - {text: "`4`", correct: true}
      - {text: "`-4`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "Les arguments nommés vont à leur paramètre : `a` vaut 5, `b` vaut 1."
  - key: bug-positionnels-nommes
    format: bug-fix
    question: |-
      Python répond « TypeError: distance() got some positional-only arguments passed as keyword arguments: 'a, b' ». Quelle correction est la bonne ?
      ```python
      def distance(a, b, /):
          return abs(a - b)

      print(distance(a=3, b=10))
      ```
    choices:
      - {text: "`distance(3, 10)`", correct: true}
      - {text: "`distance(a=3, b=10, /)`", correct: false}
      - {text: "`distance(/a=3, /b=10)`", correct: false}
      - {text: "`distance(*, a=3, b=10)`", correct: false}
    answer: |-
      ```python
      print(distance(3, 10))
      ```
      Avant `/`, les paramètres se passent par position seulement. Les marqueurs `/` et `*` n'ont de sens que dans la signature, pas dans l'appel.
  - key: bug-nomme-passe-en-position
    format: bug-fix
    question: |-
      Python répond « TypeError: exporter() takes 1 positional argument but 2 were given ». Quelle correction est la bonne ?
      ```python
      def exporter(donnees, *, format="csv"):
          return f"{len(donnees)} lignes en {format}"

      print(exporter([1, 2], "json"))
      ```
    choices:
      - {text: "`exporter([1, 2], format=\"json\")`", correct: true}
      - {text: "`exporter([1, 2], *\"json\")`", correct: false}
      - {text: "`exporter([1, 2], \"format=json\")`", correct: false}
      - {text: "`exporter(*[1, 2], \"json\")`", correct: false}
    answer: |-
      ```python
      print(exporter([1, 2], format="json"))
      ```
      `format` suit le `*` : il ne se passe que par son nom. Déballer avec `*` multiplierait les positionnels au lieu de les réduire.
  - key: bug-barre-apres-etoile
    format: bug-fix
    question: |-
      Python répond « SyntaxError: / must be ahead of * ». Quelle correction est la bonne ?
      ```python
      def f(a, *, b, /):
          return a + b
      ```
    choices:
      - {text: "`def f(a, /, *, b):`", correct: true}
      - {text: "`def f(a, *, /, b):`", correct: false}
      - {text: "`def f(/, a, *, b):`", correct: false}
      - {text: "`def f(a, *, b, *):`", correct: false}
    answer: |-
      ```python
      def f(a, /, *, b):
          return a + b
      ```
      `/` ferme la zone positionnelle, `*` ouvre la zone nommée : dans cet ordre. Ici, `a` se passe par position et `b` par son nom.
  - key: bug-option-avalee
    format: bug-fix
    question: |-
      Ce code affiche « INFO disque plein ERREUR » au lieu d'un message de niveau ERREUR. Quelle correction est la bonne ?
      ```python
      def journaliser(*messages, niveau="INFO"):
          print(niveau, *messages)

      journaliser("disque plein", "ERREUR")
      ```
    choices:
      - {text: "`journaliser(\"disque plein\", niveau=\"ERREUR\")`", correct: true}
      - {text: "`journaliser(\"ERREUR\", \"disque plein\")`", correct: false}
      - {text: "`journaliser(\"disque plein\", *\"ERREUR\")`", correct: false}
      - {text: "`journaliser(niveau, \"disque plein\", \"ERREUR\")`", correct: false}
    answer: |-
      ```python
      journaliser("disque plein", niveau="ERREUR")
      ```
      `*messages` absorbe tous les positionnels, « ERREUR » compris. `niveau`, placé après, ne se passe que par son nom.
