notion: chaines-octets
lesson: |-
  Python 3 sépare nettement deux types :

  | | `str` | `bytes` |
  |---|---|---|
  | contient | du **texte** : des caractères Unicode | des **octets** bruts (0 à 255) |
  | littéral | `"été"` | `b"GIF89a"` (des caractères ASCII seulement) |
  | un élément | `"abc"[0]` vaut `'a'` | `b"abc"[0]` vaut `97`, un entier |
  | sert à | manipuler du texte | fichiers binaires, réseau, hachage, chiffrement |

  On passe de l'un à l'autre par un **encodage**, presque toujours **UTF-8** :

  ```python
  donnees = "été".encode("utf-8")      # b'\xc3\xa9t\xc3\xa9' : str -> bytes
  texte = donnees.decode("utf-8")      # 'été'                : bytes -> str
  ```

  `encode` et `decode` utilisent UTF-8 par défaut. En UTF-8, un caractère ASCII prend **un** octet, `é` en prend
  deux, `€` trois, un émoji quatre. D'où :

  ```python
  len("été")                     # 3 caractères
  len("été".encode("utf-8"))     # 5 octets
  ```

  **Les erreurs**

  | Erreur | Cause |
  |---|---|
  | `UnicodeEncodeError: 'ascii' codec can't encode character '\xe9'...` | un caractère que l'encodage choisi ne connaît pas |
  | `UnicodeDecodeError: 'utf-8' codec can't decode byte 0xe9...` | des octets qui ne sont pas de l'UTF-8 valide |
  | `TypeError: can't concat str to bytes` | mélange de `str` et de `bytes` |

  `decode("utf-8", errors="replace")` remplace les octets invalides par `�` au lieu de lever une erreur
  (`"ignore"` les supprime). Décoder avec le mauvais encodage ne lève pas toujours d'erreur, mais produit du texte
  illisible (du *mojibake*) : `"Café".encode("utf-8").decode("latin-1")` donne `'CafÃ©'`.

  **Les pièges**

  - `str(b"abc")` ne décode pas : il donne la représentation `"b'abc'"`. On écrit `b"abc".decode()`.
  - Une longueur en octets (un en-tête `Content-Length`, une taille de tampon) se calcule sur les `bytes`, pas sur
    la `str`.
  - Les fichiers : `open(chemin, encoding="utf-8")` lit du texte, `open(chemin, "rb")` des octets. Sans `encoding`,
    Python 3.14 prend l'encodage du système (souvent cp1252 sous Windows) : on le précise toujours.

  `bytearray` est la version modifiable de `bytes` ; `bytes.hex()` et `bytes.fromhex()` passent par l'hexadécimal.

  **En entretien** : « `str` contient du texte Unicode, `bytes` des octets ; on passe de l'un à l'autre avec `encode`
  et `decode`, en UTF-8. Python 3 refuse de les mélanger. On précise toujours l'encodage à l'ouverture d'un fichier
  texte, et une taille en octets se mesure sur les `bytes`. »
cards:
  - key: str-ou-bytes
    format: course
    question: Quelle différence entre `str` et `bytes` ?
    choices:
      - {text: "`str` contient du texte Unicode, `bytes` des octets bruts", correct: true}
      - {text: "`bytes` est une `str` limitée aux caractères ASCII", correct: false}
      - {text: "`str` est modifiable, alors que `bytes` est immuable", correct: false}
      - {text: "`bytes` est l'ancien nom de `str`, gardé de Python 2", correct: false}
    answer: "Le texte devient des octets par un encodage (`encode`), et l'inverse par `decode`. Les deux types sont immuables ; `bytearray` est la version modifiable de `bytes`."
  - key: str-vers-bytes
    format: course
    question: "Comment passe-t-on d'une `str` à des `bytes` en UTF-8 ?"
    choices:
      - {text: "`texte.encode(\"utf-8\")`", correct: true}
      - {text: "`texte.decode(\"utf-8\")`", correct: false}
      - {text: "`bytes(texte)`", correct: false}
      - {text: "`texte.to_bytes()`", correct: false}
    answer: "On **encode** du texte en octets, on **décode** des octets en texte. `bytes(texte)` sans encodage lève `TypeError: string argument without an encoding`."
  - key: octets-e-accent
    format: course
    question: "Combien d'octets occupe le caractère `é` en UTF-8 ?"
    choices:
      - {text: "Deux octets", correct: true}
      - {text: "Un octet", correct: false}
      - {text: "Trois octets", correct: false}
      - {text: "Quatre octets", correct: false}
    answer: "UTF-8 code l'ASCII sur un octet, les lettres accentuées sur deux, `€` sur trois, les émojis sur quatre. `\"é\".encode()` vaut `b'\\xc3\\xa9'`."
  - key: element-de-bytes
    format: course
    question: "Que renvoie `b\"ABC\"[0]` ?"
    choices:
      - {text: "L'entier `65`", correct: true}
      - {text: "Les octets `b\"A\"`", correct: false}
      - {text: "La chaîne `\"A\"`", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "Un élément de `bytes` est un entier de 0 à 255. Un découpage, lui, reste des `bytes` : `b\"ABC\"[0:1]` vaut `b'A'`."
  - key: vf-longueurs-egales
    format: true-false
    question: "`len(\"été\")` et `len(\"été\".encode(\"utf-8\"))` valent tous les deux 3."
    truth: false
    answer: "3 caractères, mais 5 octets : chaque `é` en prend deux en UTF-8."
  - key: vf-ascii-un-octet
    format: true-false
    question: Un caractère ASCII occupe un seul octet en UTF-8.
    truth: true
    answer: "UTF-8 est compatible avec l'ASCII : un texte ASCII est déjà de l'UTF-8 valide, octet pour octet."
  - key: vf-str-de-bytes
    format: true-false
    question: "`str(b\"abc\")` décode les octets et renvoie `\"abc\"`."
    truth: false
    answer: "`str` donne la représentation, `\"b'abc'\"`, préfixe et apostrophes compris. Pour décoder : `b\"abc\".decode()`."
  - key: vf-utf8-par-defaut
    format: true-false
    question: "`encode` et `decode` utilisent UTF-8 quand on ne précise pas d'encodage."
    truth: true
    answer: "Depuis Python 3, `\"été\".encode()` produit de l'UTF-8. Ce n'est pas le cas d'`open`, dont l'encodage par défaut dépend encore du système."
  - key: qcm-erreur-ascii
    format: multiple-choice
    question: "Quelle erreur lève `\"é\".encode(\"ascii\")` ?"
    choices:
      - {text: "`UnicodeEncodeError`", correct: true}
      - {text: "`UnicodeDecodeError`", correct: false}
      - {text: "`ValueError`", correct: false}
      - {text: "`TypeError`", correct: false}
    answer: "L'ASCII ne connaît pas `é` : l'**encodage** échoue. `UnicodeDecodeError` vient de l'opération inverse, sur des octets invalides."
  - key: qcm-ouvrir-texte
    format: multiple-choice
    question: Comment lit-on un fichier texte en UTF-8 de façon portable ?
    choices:
      - {text: "`open(chemin, encoding=\"utf-8\")`", correct: true}
      - {text: "`open(chemin)`", correct: false}
      - {text: "`open(chemin, \"rb\")`", correct: false}
      - {text: "`open(chemin, mode=\"utf-8\")`", correct: false}
    answer: "Sans `encoding`, Python 3.14 prend l'encodage du système, qui varie (cp1252 sous Windows). `\"rb\"` lit des octets, et `mode` attend `\"r\"`, `\"w\"`..."
  - key: qcm-mojibake
    format: multiple-choice
    question: "Que donne `\"été\".encode(\"utf-8\").decode(\"latin-1\")` ?"
    choices:
      - {text: "`'Ã©tÃ©'`", correct: true}
      - {text: "`'été'`", correct: false}
      - {text: "Une `UnicodeDecodeError`", correct: false}
      - {text: "`'?t?'`", correct: false}
    answer: "Latin-1 accepte tout octet : chaque octet de `é` (`c3`, `a9`) devient un caractère, `Ã` et `©`. C'est le mojibake, sans aucune erreur levée."
  - key: qcm-errors-replace
    format: multiple-choice
    question: Comment décoder des octets en remplaçant ceux qui sont invalides, au lieu de lever une erreur ?
    choices:
      - {text: "`donnees.decode(\"utf-8\", errors=\"replace\")`", correct: true}
      - {text: "`donnees.decode(\"utf-8\", strict=False)`", correct: false}
      - {text: "`donnees.decode(\"utf-8?\")`", correct: false}
      - {text: "`str(donnees, safe=True)`", correct: false}
    answer: "`errors=\"replace\"` met `�` à la place des octets invalides, `\"ignore\"` les supprime. Le défaut, `\"strict\"`, lève une `UnicodeDecodeError`."
  - key: trous-encode
    format: fill-in
    question: |-
      Complète pour obtenir les octets UTF-8 de `texte` :
      ```python
      donnees = texte.___("utf-8")
      ```
    blanks: [[encode]]
    answer: "`encode` : du texte vers les octets."
  - key: trous-decode
    format: fill-in
    question: |-
      Complète pour retrouver le texte à partir des octets :
      ```python
      texte = donnees.___("utf-8")
      ```
    blanks: [[decode]]
    answer: "`decode` : des octets vers le texte."
  - key: trous-litteral-bytes
    format: fill-in
    question: |-
      Complète le littéral d'octets :
      ```python
      entete = ___"GIF89a"
      ```
    blanks: [[b, B]]
    answer: "Le préfixe `b` crée des `bytes` ; le littéral n'accepte que des caractères ASCII."
  - key: trous-lecture-binaire
    format: fill-in
    question: |-
      Complète pour ouvrir un fichier en lecture binaire :
      ```python
      with open("image.png", "___") as f:
          entete = f.read(8)
      ```
    blanks: [[rb]]
    answer: "`\"rb\"` : lecture (`r`) en binaire (`b`). `read` renvoie alors des `bytes`."
  - key: code-longueurs
    format: code-output
    question: |-
      ```python
      print(len("été"), len("été".encode("utf-8")))
      ```
    answer: "`3 5` : trois caractères, mais cinq octets en UTF-8."
    check:
      output: "3 5"
    choices:
      - {text: "`3 5`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`5 5`", correct: false}
      - {text: "`3 6`", correct: false}
  - key: code-elements-bytes
    format: code-output
    question: |-
      ```python
      print(b"ABC"[0], list(b"hi"))
      ```
    answer: "`65 [104, 105]` : les éléments de `bytes` sont des entiers, les codes des caractères."
    check:
      output: "65 [104, 105]"
    choices:
      - {text: "`65 [104, 105]`", correct: true}
      - {text: "`A ['h', 'i']`", correct: false}
      - {text: "`b'A' [b'h', b'i']`", correct: false}
      - {text: "`65 ['h', 'i']`", correct: false}
  - key: code-hex
    format: code-output
    question: |-
      ```python
      print("é".encode("utf-8").hex())
      ```
    answer: "`c3a9` : les deux octets de `é` en UTF-8, en hexadécimal."
    check:
      output: "c3a9"
    choices:
      - {text: "`c3a9`", correct: true}
      - {text: "`e9`", correct: false}
      - {text: "`00e9`", correct: false}
      - {text: "`a9c3`", correct: false}
  - key: code-str-ou-decode
    format: code-output
    question: |-
      ```python
      print(str(b"ok"), b"ok".decode())
      ```
    answer: "`b'ok' ok` : `str` donne la représentation des octets, `decode` le texte."
    check:
      output: "b'ok' ok"
    choices:
      - {text: "`b'ok' ok`", correct: true}
      - {text: "`ok ok`", correct: false}
      - {text: "`b'ok' b'ok'`", correct: false}
      - {text: "`ok b'ok'`", correct: false}
  - key: bug-encode-ascii
    format: bug-fix
    question: |-
      Ce script s'arrête avec « UnicodeEncodeError: 'ascii' codec can't encode character '\xe9' in position 2: ordinal
      not in range(128) » :
      ```python
      nom = "Zoé"
      print(nom.encode("ascii"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`nom.encode(\"utf-8\")`", correct: true}
      - {text: "`nom.decode(\"ascii\")`", correct: false}
      - {text: "`str(nom).encode(\"ascii\")`", correct: false}
      - {text: "`bytes(nom)`", correct: false}
    answer: |-
      ```python
      nom = "Zoé"
      print(nom.encode("utf-8"))
      ```
      L'ASCII ne connaît que 128 caractères, sans accents. UTF-8 code tout Unicode.
  - key: bug-concat-bytes
    format: bug-fix
    question: |-
      Ce script s'arrête avec « TypeError: can't concat str to bytes » :
      ```python
      entete = b"ID:"
      identifiant = "42"
      print(entete + identifiant)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`entete + identifiant.encode()`", correct: true}
      - {text: "`entete + bytes(identifiant)`", correct: false}
      - {text: "`entete + str(identifiant)`", correct: false}
      - {text: "`entete.encode() + identifiant`", correct: false}
    answer: |-
      ```python
      entete = b"ID:"
      identifiant = "42"
      print(entete + identifiant.encode())
      ```
      Python 3 ne mélange pas texte et octets : on encode la chaîne. `bytes(identifiant)` sans encodage lève une
      `TypeError`, et les `bytes` n'ont pas de méthode `encode`.
  - key: bug-mojibake
    format: bug-fix
    question: |-
      Ce code affiche `CafÃ©` au lieu de `Café` :
      ```python
      donnees = "Café".encode("utf-8")
      print(donnees.decode("latin-1"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`donnees.decode(\"utf-8\")`", correct: true}
      - {text: "`donnees.decode(\"latin-1\").encode()`", correct: false}
      - {text: "`str(donnees, \"ascii\")`", correct: false}
      - {text: "`donnees.decode(\"latin-1\", errors=\"replace\")`", correct: false}
    answer: |-
      ```python
      donnees = "Café".encode("utf-8")
      print(donnees.decode("utf-8"))
      ```
      On décode avec l'encodage qui a servi à encoder. Latin-1 accepte n'importe quel octet : l'erreur ne se voit qu'à
      l'affichage.
  - key: bug-content-length
    format: bug-fix
    question: |-
      Le client HTTP coupe la fin de la réponse : ce code annonce `Content-Length: 13`, alors que le corps fait 16
      octets.
      ```python
      corps = "Réponse : été"
      print("Content-Length:", len(corps))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`len(corps.encode(\"utf-8\"))`", correct: true}
      - {text: "`len(corps) * 2`", correct: false}
      - {text: "`len(str(corps))`", correct: false}
      - {text: "`len(corps.strip())`", correct: false}
    answer: |-
      ```python
      corps = "Réponse : été"
      print("Content-Length:", len(corps.encode("utf-8")))
      ```
      `len` d'une `str` compte des caractères ; un en-tête HTTP compte des octets. Les trois `é` prennent deux octets
      chacun en UTF-8.
