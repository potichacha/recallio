notion: recursion
lesson: |-
  Une fonction **récursive** s'appelle elle-même. Elle a toujours :

  - un **cas de base**, qui renvoie un résultat sans s'appeler ;
  - un **cas récursif**, qui s'appelle sur un problème **plus petit**, qui se rapproche du cas de base.

  ```python
  def factorielle(n):
      if n <= 1:                         # cas de base
          return 1
      return n * factorielle(n - 1)      # cas récursif
  ```

  **La limite de profondeur.** Chaque appel occupe un cadre (frame) sur la pile. CPython limite la profondeur à
  **1000** par défaut : au-delà, `RecursionError: maximum recursion depth exceeded`. `RecursionError` hérite de
  `RuntimeError`.

  - `sys.getrecursionlimit()` lit la limite ; `sys.setrecursionlimit(n)` la change, mais l'augmenter beaucoup expose
    à un plantage de l'interpréteur, faute de pile.
  - CPython **n'optimise pas la récursion terminale** : même un `return f(n - 1)` garde son cadre. C'est un choix
    assumé, pour garder des piles d'appels lisibles.
  - Une récursion sans cas de base, ou dont le cas de base n'est jamais atteint, finit en `RecursionError`.

  **Quand l'utiliser** : pour des données récursives par nature (arbres, structures imbriquées, systèmes de fichiers)
  et les algorithmes « diviser pour régner » (tri fusion, recherche dichotomique), dont la profondeur reste faible.
  Pour une profondeur qui dépend de la taille des données (parcourir une liste de 100 000 éléments), on préfère une
  **boucle**, éventuellement avec une **pile explicite** (une liste).

  **Le piège des appels répétés** : `fib(n) = fib(n - 1) + fib(n - 2)` recalcule les mêmes valeurs un nombre
  exponentiel de fois. `@functools.cache` mémorise les résultats et rend le calcul linéaire.

  **En entretien** : « Un cas de base, et un cas récursif qui s'en rapproche. CPython limite la profondeur à 1000 et
  n'optimise pas la récursion terminale : pour une grande profondeur, une boucle avec une pile explicite. Contre les
  calculs répétés, `functools.cache`. »
cards:
  - key: limite-defaut
    format: course
    question: Quelle est la limite de récursion par défaut de CPython ?
    choices:
      - {text: "1000 appels imbriqués, réglable avec `sys.setrecursionlimit`", correct: true}
      - {text: "Aucune : la pile grandit tant qu'il reste de la mémoire", correct: false}
      - {text: "100 appels, fixés à la compilation de l'interpréteur", correct: false}
      - {text: "10 000 appels, ou la taille de la pile du système", correct: false}
    answer: "`sys.getrecursionlimit()` renvoie 1000 par défaut. Au-delà : `RecursionError: maximum recursion depth exceeded`."
  - key: recursion-terminale
    format: course
    question: CPython optimise-t-il la récursion terminale ?
    choices:
      - {text: "Non : chaque appel garde son cadre, même en position terminale", correct: true}
      - {text: "Oui, depuis Python 3.11 et son interpréteur spécialisé", correct: false}
      - {text: "Oui, quand le `return` appelle directement la fonction", correct: false}
      - {text: "Seulement pour les fonctions décorées par `@tailrec`", correct: false}
    answer: "Guido van Rossum l'a refusé, pour garder des piles d'appels complètes dans les messages d'erreur. Une récursion terminale profonde se réécrit en boucle."
  - key: cas-de-base
    format: course
    question: Que doit toujours avoir une fonction récursive ?
    choices:
      - {text: "Un cas de base, atteint à coup sûr, qui ne s'appelle pas", correct: true}
      - {text: "Un paramètre `profondeur`, qui compte les appels", correct: false}
      - {text: "Un `global` qui garde le résultat partiel", correct: false}
      - {text: "Une boucle `while` autour de l'appel récursif", correct: false}
    answer: "Sans cas de base, ou si les appels ne s'en rapprochent pas, la récursion ne s'arrête qu'à la limite de profondeur."
  - key: fib-lente
    format: course
    question: Pourquoi `fib(n)` récursive naïve est-elle lente, et comment l'accélérer ?
    choices:
      - {text: "Elle recalcule les mêmes valeurs : `@functools.cache` les mémorise", correct: true}
      - {text: "Elle dépasse la pile : `sys.setrecursionlimit` l'accélère", correct: false}
      - {text: "Elle crée des listes : renvoyer des tuples la rend rapide", correct: false}
      - {text: "Elle est interprétée : la compiler avec `py_compile` suffit", correct: false}
    answer: "`fib(n - 1)` et `fib(n - 2)` recalculent chacun les mêmes sous-problèmes : le nombre d'appels croît de façon exponentielle. Mémorisés, ils ne sont calculés qu'une fois."
  - key: vf-recursion-error
    format: true-false
    question: Dépasser la limite de récursion lève une `RecursionError`.
    truth: true
    answer: "« maximum recursion depth exceeded ». Elle hérite de `RuntimeError`, et peut être rattrapée comme toute exception."
  - key: vf-sans-cas-de-base
    format: true-false
    question: Une fonction récursive sans cas de base finit par renvoyer `None`.
    truth: false
    answer: "Elle s'appelle sans fin, jusqu'à la `RecursionError`. Elle ne renvoie jamais rien."
  - key: vf-setrecursionlimit
    format: true-false
    question: Augmenter fortement la limite avec `sys.setrecursionlimit` est sans risque.
    truth: false
    answer: "La limite protège la pile de l'interpréteur : trop haute, une récursion profonde peut faire planter le processus, sans exception à rattraper."
  - key: vf-boucle-et-pile
    format: true-false
    question: Toute fonction récursive peut se réécrire avec une boucle et une pile explicite.
    truth: true
    answer: "La pile explicite (une liste) remplace la pile d'appels : sa taille n'est limitée que par la mémoire."
  - key: qcm-factorielle
    format: multiple-choice
    question: Quelle fonction calcule correctement la factorielle ?
    choices:
      - {text: "`def fact(n): return 1 if n <= 1 else n * fact(n - 1)`", correct: true}
      - {text: "`def fact(n): return n * fact(n - 1)`", correct: false}
      - {text: "`def fact(n): return 1 if n <= 1 else n * fact(n)`", correct: false}
      - {text: "`def fact(n): return 1 if n <= 1 else fact(n - 1)`", correct: false}
    answer: "Il faut un cas de base, un appel sur un problème plus petit (`n - 1`), et la combinaison du résultat (`n * ...`). La dernière renvoie toujours 1."
  - key: qcm-lire-limite
    format: multiple-choice
    question: Comment connaître la limite de récursion courante ?
    choices:
      - {text: "`sys.getrecursionlimit()`", correct: true}
      - {text: "`sys.maxsize`", correct: false}
      - {text: "`sys.recursionlimit`", correct: false}
      - {text: "`os.getrecursionlimit()`", correct: false}
    answer: "`sys.getrecursionlimit()` la lit, `sys.setrecursionlimit()` la change. `sys.maxsize` est le plus grand indice possible d'une liste."
  - key: qcm-arbre-profond
    format: multiple-choice
    question: Pour parcourir une structure imbriquée sur 100 000 niveaux, que choisis-tu ?
    choices:
      - {text: "Une boucle avec une pile explicite (une liste)", correct: true}
      - {text: "Une récursion, avec `sys.setrecursionlimit(10**9)`", correct: false}
      - {text: "Une récursion terminale, que CPython optimise", correct: false}
      - {text: "Une récursion dans un thread, qui n'a pas de limite", correct: false}
    answer: "100 000 niveaux dépassent de loin la limite de 1000 ; la relever si haut risque de faire planter l'interpréteur. La pile explicite n'a pas ce problème."
  - key: qcm-memoriser
    format: multiple-choice
    question: Quel décorateur évite de recalculer `fib(n)` pour une même valeur de `n` ?
    choices:
      - {text: "`@functools.cache`", correct: true}
      - {text: "`@functools.wraps`", correct: false}
      - {text: "`@staticmethod`", correct: false}
      - {text: "`@functools.total_ordering`", correct: false}
    answer: "`cache` (Python 3.9) mémorise le résultat de chaque appel, comme `lru_cache(maxsize=None)`. `wraps` sert à écrire des décorateurs."
  - key: code-somme-recursive
    format: code-output
    question: |-
      ```python
      def somme(n):
          if n == 0:
              return 0
          return n + somme(n - 1)

      print(somme(4))
      ```
    check:
      output: "10"
    choices:
      - {text: "`10`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "`24`", correct: false}
    answer: "4 + 3 + 2 + 1 + 0 = 10 : chaque appel ajoute son `n` au résultat du suivant."
  - key: code-ordre-concatenation
    format: code-output
    question: |-
      ```python
      def compte(n):
          if n == 0:
              return ""
          return compte(n - 1) + str(n)

      print(compte(4))
      ```
    check:
      output: "1234"
    choices:
      - {text: "`1234`", correct: true}
      - {text: "`4321`", correct: false}
      - {text: "`0123`", correct: false}
      - {text: "`01234`", correct: false}
    answer: "Le résultat de l'appel plus petit est placé avant `str(n)` : les chiffres s'assemblent de 1 à 4. Le cas de base renvoie la chaîne vide, pas « 0 »."
  - key: code-limite-atteinte
    format: code-output
    question: |-
      ```python
      import sys

      def descendre(n):
          return descendre(n + 1)

      try:
          descendre(0)
      except RecursionError:
          print("trop profond", sys.getrecursionlimit())
      ```
    check:
      output: "trop profond 1000"
    choices:
      - {text: "`trop profond 1000`", correct: true}
      - {text: "`trop profond 999`", correct: false}
      - {text: "`trop profond 10000`", correct: false}
      - {text: "Rien : la récursion tourne sans fin", correct: false}
    answer: "Sans cas de base, la récursion atteint la limite, et la `RecursionError` se rattrape comme toute exception. La limite par défaut est 1000."
  - key: code-puissance-rapide
    format: code-output
    question: |-
      ```python
      def puissance(x, n):
          if n == 0:
              return 1
          moitie = puissance(x, n // 2)
          return moitie * moitie * (x if n % 2 else 1)

      print(puissance(2, 10), puissance(3, 3))
      ```
    check:
      output: "1024 27"
    choices:
      - {text: "`1024 27`", correct: true}
      - {text: "`1024 9`", correct: false}
      - {text: "`512 27`", correct: false}
      - {text: "`20 9`", correct: false}
    answer: "L'exponentiation rapide : 2¹⁰ = 1024 et 3³ = 27, avec un nombre d'appels proportionnel au logarithme de `n`."
  - key: bug-sans-cas-de-base
    format: bug-fix
    question: |-
      Ce compte à rebours affiche 3, 2, 1, 0, -1... puis « RecursionError: maximum recursion depth exceeded ». Quelle correction est la bonne ?
      ```python
      def compte_a_rebours(n):
          print(n)
          compte_a_rebours(n - 1)

      compte_a_rebours(3)
      ```
    choices:
      - {text: "Ajouter en tête : `if n < 0: return`", correct: true}
      - {text: "Remplacer `n - 1` par `n + 1`", correct: false}
      - {text: "Appeler `sys.setrecursionlimit(10**6)`", correct: false}
      - {text: "Ajouter `return` devant l'appel récursif", correct: false}
    answer: |-
      ```python
      def compte_a_rebours(n):
          if n < 0:
              return
          print(n)
          compte_a_rebours(n - 1)
      ```
      Sans cas de base, la récursion ne s'arrête jamais d'elle-même. Relever la limite ne fait que repousser l'erreur, ou planter l'interpréteur.
  - key: bug-cas-de-base-saute
    format: bug-fix
    question: |-
      `est_pair(7)` lève « RecursionError: maximum recursion depth exceeded ». Quelle correction est la bonne ?
      ```python
      def est_pair(n):
          if n == 0:
              return True
          return est_pair(n - 2)

      print(est_pair(7))
      ```
    choices:
      - {text: "Remplacer le test par `if n < 2: return n == 0`", correct: true}
      - {text: "Remplacer `n - 2` par `n - 1` dans l'appel récursif", correct: false}
      - {text: "Remplacer le test par `if n == 1: return False`", correct: false}
      - {text: "Ajouter `else: return False` après le premier `return`", correct: false}
    answer: |-
      ```python
      def est_pair(n):
          if n < 2:
              return n == 0
          return est_pair(n - 2)
      ```
      Pour un nombre impair, `n` passe de 1 à -1 sans jamais valoir 0. Le cas de base doit couvrir 0 et 1. Avec `n - 1`, tout nombre serait déclaré pair ; avec le seul test `n == 1`, ce sont les nombres pairs qui ne s'arrêteraient plus.
  - key: bug-return-oublie
    format: bug-fix
    question: |-
      Ce code affiche `None` au lieu de l'indice 2. Quelle correction est la bonne ?
      ```python
      def chercher(xs, cible, i=0):
          if i == len(xs):
              return -1
          if xs[i] == cible:
              return i
          chercher(xs, cible, i + 1)

      print(chercher([4, 7, 9], 9))
      ```
    choices:
      - {text: "Écrire `return chercher(xs, cible, i + 1)`", correct: true}
      - {text: "Écrire `print(chercher(xs, cible, i + 1))`", correct: false}
      - {text: "Remplacer `return -1` par `return None`", correct: false}
      - {text: "Remplacer `return i` par `yield i`", correct: false}
    answer: |-
      ```python
      def chercher(xs, cible, i=0):
          if i == len(xs):
              return -1
          if xs[i] == cible:
              return i
          return chercher(xs, cible, i + 1)
      ```
      L'appel récursif trouve bien 2, mais son résultat est perdu : la fonction appelante ne le renvoie pas, et renvoie donc `None`.
  - key: bug-fib-exponentielle
    format: bug-fix
    question: |-
      Le temps de `fib(n)` explose : chaque `n` de plus le multiplie par 1,6 environ, et `fib(50)` ne se termine pas en un temps raisonnable. Quelle correction est la bonne ?
      ```python
      def fib(n):
          if n < 2:
              return n
          return fib(n - 1) + fib(n - 2)

      print(fib(30))
      ```
    choices:
      - {text: "Décorer la fonction avec `@functools.cache`", correct: true}
      - {text: "Relever la limite avec `sys.setrecursionlimit`", correct: false}
      - {text: "Remplacer `n < 2` par `n <= 2` dans le cas de base", correct: false}
      - {text: "Échanger `fib(n - 1)` et `fib(n - 2)` dans la somme", correct: false}
    answer: |-
      ```python
      import functools

      @functools.cache
      def fib(n):
          if n < 2:
              return n
          return fib(n - 1) + fib(n - 2)
      ```
      La profondeur ne dépasse jamais `n` : le problème est le nombre d'appels, exponentiel, car les mêmes valeurs sont recalculées. Mémorisées, chacune n'est calculée qu'une fois.
