notion: methodes-chaines
lesson: |-
  Les chaînes ont de nombreuses méthodes. Comme une chaîne est **immuable**, aucune ne la modifie : chacune **renvoie
  une nouvelle chaîne** (ou une liste, un nombre, un booléen), qu'il faut récupérer.

  ```python
  nom = "ada"
  nom.upper()            # 'ADA', mais nom vaut toujours 'ada'
  nom = nom.upper()      # il faut réaffecter
  ```

  **Découper et assembler**

  | Méthode | Exemple | Résultat |
  |---|---|---|
  | `split()` | `"  a b   c ".split()` | `['a', 'b', 'c']` : toute suite d'espaces, sans morceaux vides |
  | `split(sep)` | `"a,b,,c".split(",")` | `['a', 'b', '', 'c']` : garde les morceaux vides |
  | `split(sep, n)` | `"k=v=w".split("=", 1)` | `['k', 'v=w']` : au plus `n` coupures |
  | `sep.join(...)` | `", ".join(["a", "b"])` | `'a, b'` : s'appelle **sur le séparateur** |

  `join` n'accepte que des chaînes : `", ".join([1, 2])` lève `TypeError: sequence item 0: expected str instance,
  int found`. On convertit d'abord : `", ".join(str(n) for n in nombres)`.

  **Nettoyer et remplacer**

  | Méthode | Exemple | Résultat |
  |---|---|---|
  | `strip()`, `lstrip()`, `rstrip()` | `"  texte\n".strip()` | `'texte'` : retire les blancs aux bouts |
  | `strip(caractères)` | `"--x--".strip("-")` | `'x'` : retire un **ensemble de caractères** |
  | `removeprefix(p)`, `removesuffix(s)` | `"Mr Smith".removeprefix("Mr ")` | `'Smith'` (Python 3.9) |
  | `replace(ancien, nouveau)` | `"a-b-c".replace("-", "")` | `'abc'` : **toutes** les occurrences |
  | `upper()`, `lower()`, `capitalize()`, `title()` | `"ada lovelace".title()` | `'Ada Lovelace'` |

  Piège : `strip("https://")` ne retire pas le préfixe `https://`, mais tous les caractères `h`, `t`, `p`, `s`, `:` et
  `/` aux deux bouts. Pour un préfixe, c'est `removeprefix`.

  **Chercher et tester**

  | Méthode | Exemple | Résultat |
  |---|---|---|
  | `find(sous)` | `"banane".find("na")`, `"banane".find("z")` | `2`, `-1` si absent |
  | `index(sous)` | `"banane".index("z")` | lève `ValueError` si absent |
  | `rfind(sous)` | `"banane".rfind("an")` | `3` : la dernière occurrence |
  | `count(sous)` | `"banane".count("an")` | `2` |
  | `startswith(p)`, `endswith(s)` | `nom.endswith((".png", ".jpg"))` | accepte un tuple |
  | `isdigit()`, `isalpha()`, `isspace()` | `"42".isdigit()` | `True` |

  Pour savoir si une sous-chaîne est présente, on écrit `"na" in texte`, pas `texte.find("na")` : `find` renvoie `0`
  quand la chaîne commence par elle, et `0` est faux.

  Les méthodes s'enchaînent : `ligne.strip().lower().split(";")`.

  **En entretien** : « Les méthodes des chaînes renvoient toujours une nouvelle chaîne, car `str` est immuable.
  `split` sans argument découpe sur les blancs, `join` s'appelle sur le séparateur et n'accepte que des chaînes, et
  `strip` retire un ensemble de caractères, pas un préfixe : pour ça, `removeprefix`. »
tour:
  - title: Les méthodes des chaînes
    text: |-
      Les chaînes viennent avec leurs outils : `strip` retire les blancs aux deux bouts, `split` découpe, et `join`,
      appelé sur le séparateur, recolle une liste. `upper`, `replace` et les autres renvoient une **nouvelle** chaîne :
      l'ancienne ne change pas.

      `find` renvoie la position d'une sous-chaîne, ou `-1` si elle est absente ; `startswith` et `endswith` testent
      le début et la fin, et acceptent un tuple de possibilités.

      Essaie : remplace `" / "` par `"\n"` dans le `join`.
    example:
      files:
        main.py: |-
          ligne = "  Ada;Lovelace;1815  "
          champs = ligne.strip().split(";")
          print(champs)
          print(" / ".join(champs))

          nom = "lovelace"
          print(nom.upper(), nom.capitalize(), nom.replace("love", "LOVE"))
          print(nom.find("lace"), nom.find("java"))
          print(nom.startswith("love"), "rapport.pdf".endswith((".pdf", ".doc")))
      output: |-
        ['Ada', 'Lovelace', '1815']
        Ada / Lovelace / 1815
        LOVELACE Lovelace LOVElace
        4 -1
        True True
    task:
      instructions: |-
        Avec `split` et `join`, transforme `"pomme;poire;kiwi"` pour que le programme affiche
        `pomme, poire, kiwi`.
      starter:
        main.py: |-
          fruits = "pomme;poire;kiwi"
          print(fruits)
      solution:
        main.py: |-
          fruits = "pomme;poire;kiwi"
          print(", ".join(fruits.split(";")))
      output: |-
        pomme, poire, kiwi
cards:
  - key: join-sur-separateur
    format: course
    question: Sur quel objet appelle-t-on `join` ?
    choices:
      - {text: "Sur le séparateur : `\", \".join(mots)`", correct: true}
      - {text: "Sur la liste : `mots.join(\", \")`", correct: false}
      - {text: "Sur le premier mot : `mots[0].join(mots)`", correct: false}
      - {text: "Sur le module : `string.join(mots, \", \")`", correct: false}
    answer: "`join` est une méthode de `str`, qui accepte n'importe quel itérable de chaînes. Les listes n'ont pas de méthode `join`, contrairement à JavaScript."
  - key: find-ou-index
    format: course
    question: Quelle différence entre `find` et `index` quand la sous-chaîne est absente ?
    choices:
      - {text: "`find` renvoie `-1`, `index` lève une `ValueError`", correct: true}
      - {text: "`find` renvoie `None`, `index` renvoie `-1`", correct: false}
      - {text: "Les deux renvoient `-1`, mais `index` est plus rapide", correct: false}
      - {text: "`find` lève une `KeyError`, `index` une `IndexError`", correct: false}
    answer: "Quand elle est présente, les deux renvoient sa position. Pour un simple test de présence, `in` est plus clair que l'un et l'autre."
  - key: strip-nettoie
    format: course
    question: |-
      Que renvoie `"  texte \n".strip()` ?
    choices:
      - {text: "`'texte'`", correct: true}
      - {text: "`'texte \\n'`", correct: false}
      - {text: "`'  texte'`", correct: false}
      - {text: "`'texte\\n'`", correct: false}
    answer: "Sans argument, `strip` retire tous les blancs (espaces, tabulations, retours à la ligne) aux deux bouts. `lstrip` et `rstrip` n'en traitent qu'un."
  - key: upper-sans-effet
    format: course
    question: Pourquoi `nom.upper()` seul, sur une ligne, ne change-t-il pas `nom` ?
    choices:
      - {text: "La méthode renvoie une nouvelle chaîne, qu'il faut affecter", correct: true}
      - {text: "Il faut l'appeler avec `inplace=True` pour modifier `nom`", correct: false}
      - {text: "`upper` ne modifie que la première lettre de la chaîne", correct: false}
      - {text: "`upper` ne s'applique qu'aux chaînes déjà en minuscules", correct: false}
    answer: "Les chaînes sont immuables : on écrit `nom = nom.upper()`. Même chose pour `replace`, `strip`, `lower`..."
  - key: vf-strip-prefixe
    format: true-false
    question: "`\"https://site.fr\".strip(\"https://\")` retire exactement le préfixe `https://`."
    truth: false
    answer: "`strip` retire un **ensemble de caractères** aux deux bouts : ici `h`, `t`, `p`, `s`, `:` et `/`. Le `s` de `site` part aussi : le résultat est `ite.fr`. Pour un préfixe : `removeprefix`."
  - key: vf-split-sans-argument
    format: true-false
    question: "`split()`, sans argument, découpe sur toute suite de blancs et ignore les blancs au début et à la fin."
    truth: true
    answer: "`\"  a  b \".split()` donne `['a', 'b']`. Avec un séparateur explicite, `\" a  b\".split(\" \")` donnerait des chaînes vides."
  - key: vf-startswith-tuple
    format: true-false
    question: "`startswith` accepte un tuple de préfixes possibles."
    truth: true
    answer: "`url.startswith((\"http://\", \"https://\"))` est vrai si l'un des préfixes convient. `endswith` aussi."
  - key: vf-replace-premiere
    format: true-false
    question: "`replace` ne remplace que la première occurrence, sauf si on lui donne un nombre."
    truth: false
    answer: "C'est l'inverse : `replace` remplace **toutes** les occurrences ; un troisième argument limite leur nombre : `\"aaa\".replace(\"a\", \"b\", 1)` donne `'baa'`."
  - key: qcm-retirer-prefixe
    format: multiple-choice
    question: "Comment retire-t-on le préfixe `\"Mr \"` d'une chaîne, s'il est présent ?"
    choices:
      - {text: "`nom.removeprefix(\"Mr \")`", correct: true}
      - {text: "`nom.lstrip(\"Mr \")`", correct: false}
      - {text: "`nom.strip(\"Mr\")`", correct: false}
      - {text: "`nom.replace(\"Mr \")`", correct: false}
    answer: "`removeprefix` (Python 3.9) retire le préfixe exact, une fois. `lstrip(\"Mr \")` retirerait aussi le `M` de `Martin` ; `replace` demande deux arguments."
  - key: qcm-split-blancs
    format: multiple-choice
    question: "Comment découper `\"a b  c\"` en `['a', 'b', 'c']` ?"
    choices:
      - {text: "`.split()`", correct: true}
      - {text: "`.split(\" \")`", correct: false}
      - {text: "`.partition(\" \")`", correct: false}
      - {text: "`.splitlines()`", correct: false}
    answer: "`split()` traite les blancs consécutifs comme un seul séparateur. `split(\" \")` donnerait `['a', 'b', '', 'c']`."
  - key: qcm-compter
    format: multiple-choice
    question: Quelle méthode compte les occurrences d'une sous-chaîne ?
    choices:
      - {text: "`count`", correct: true}
      - {text: "`find`", correct: false}
      - {text: "`index`", correct: false}
      - {text: "`len`", correct: false}
    answer: "`\"banane\".count(\"an\")` vaut `2`. Les occurrences comptées ne se chevauchent pas."
  - key: qcm-que-des-chiffres
    format: multiple-choice
    question: Comment teste-t-on qu'une chaîne ne contient que des chiffres ?
    choices:
      - {text: "`s.isdigit()`", correct: true}
      - {text: "`s.isnumber()`", correct: false}
      - {text: "`s.isalpha()`", correct: false}
      - {text: "`int(s) == s`", correct: false}
    answer: "`isdigit` est vrai pour une chaîne non vide de chiffres. `isnumber` n'existe pas, `isalpha` teste les lettres, et `int(s) == s` compare un entier à une chaîne : toujours faux."
  - key: trous-join
    format: fill-in
    question: |-
      Complète pour obtenir `"a-b-c"` à partir de la liste `["a", "b", "c"]` :
      ```python
      resultat = "-".___(lettres)
      ```
    blanks: [[join]]
    answer: "`join` s'appelle sur le séparateur."
  - key: trous-split
    format: fill-in
    question: |-
      Complète pour découper une ligne CSV sur les virgules :
      ```python
      champs = ligne.___(",")
      ```
    blanks: [[split]]
    answer: "`split(\",\")` renvoie la liste des champs, vides compris."
  - key: trous-strip
    format: fill-in
    question: |-
      Complète pour retirer les blancs au début et à la fin de `saisie` :
      ```python
      propre = saisie.___()
      ```
    blanks: [[strip]]
    answer: "`strip()` retire espaces, tabulations et retours à la ligne aux deux bouts."
  - key: trous-endswith
    format: fill-in
    question: |-
      Complète pour tester si le fichier est une image PNG :
      ```python
      if nom_fichier.___(".png"):
          afficher(nom_fichier)
      ```
    blanks: [[endswith]]
    answer: "`endswith` teste la fin ; pour ignorer la casse, `nom_fichier.lower().endswith(\".png\")`."
  - key: code-split-vides
    format: code-output
    question: |-
      ```python
      print("a,b,,c".split(","))
      ```
    answer: "`['a', 'b', '', 'c']` : avec un séparateur explicite, deux virgules de suite donnent une chaîne vide."
    check:
      output: "['a', 'b', '', 'c']"
    choices:
      - {text: "`['a', 'b', '', 'c']`", correct: true}
      - {text: "`['a', 'b', 'c']`", correct: false}
      - {text: "`['a,b,,c']`", correct: false}
      - {text: "`['a', 'b', None, 'c']`", correct: false}
  - key: code-replace-count
    format: code-output
    question: |-
      ```python
      print("banane".replace("an", "AN", 1), "banane".count("an"))
      ```
    answer: "`bANane 2` : le troisième argument limite le remplacement à une occurrence, et `count` en trouve deux."
    check:
      output: "bANane 2"
    choices:
      - {text: "`bANane 2`", correct: true}
      - {text: "`bANANe 2`", correct: false}
      - {text: "`bANane 1`", correct: false}
      - {text: "`banANe 2`", correct: false}
  - key: code-join-chaine
    format: code-output
    question: |-
      ```python
      print("-".join("abc"))
      ```
    answer: "`a-b-c` : une chaîne est un itérable de caractères, que `join` recolle avec le séparateur."
    check:
      output: "a-b-c"
    choices:
      - {text: "`a-b-c`", correct: true}
      - {text: "`-abc-`", correct: false}
      - {text: "`abc`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: code-find-rfind
    format: code-output
    question: |-
      ```python
      s = "Recallio"
      print(s.find("l"), s.rfind("l"), s.find("z"))
      ```
    answer: "`4 5 -1` : le premier `l` est à l'indice 4, le dernier à l'indice 5, et `z` est absent."
    check:
      output: "4 5 -1"
    choices:
      - {text: "`4 5 -1`", correct: true}
      - {text: "`5 6 -1`", correct: false}
      - {text: "`4 4 -1`", correct: false}
      - {text: "`4 5 None`", correct: false}
  - key: bug-replace-non-affecte
    format: bug-fix
    question: |-
      Ce code affiche toujours le numéro avec ses espaces :
      ```python
      telephone = "06 12 34 56 78"
      telephone.replace(" ", "")
      print(telephone)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`telephone = telephone.replace(\" \", \"\")`", correct: true}
      - {text: "`telephone.replace(\" \", \"\", inplace=True)`", correct: false}
      - {text: "`telephone.replace(\" \", None)`", correct: false}
      - {text: "`telephone.strip(\" \")`", correct: false}
    answer: |-
      ```python
      telephone = "06 12 34 56 78"
      telephone = telephone.replace(" ", "")
      print(telephone)
      ```
      `replace` renvoie une nouvelle chaîne : la chaîne d'origine, immuable, ne change pas. `strip` ne retirerait que
      les espaces des bouts.
  - key: bug-join-entiers
    format: bug-fix
    question: |-
      Ce script s'arrête avec « TypeError: sequence item 0: expected str instance, int found » :
      ```python
      notes = [12, 15, 9]
      print(", ".join(notes))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`\", \".join(str(n) for n in notes)`", correct: true}
      - {text: "`str(\", \".join(notes))`", correct: false}
      - {text: "`\", \".join(notes, str)`", correct: false}
      - {text: "`notes.join(\", \")`", correct: false}
    answer: |-
      ```python
      notes = [12, 15, 9]
      print(", ".join(str(n) for n in notes))
      ```
      `join` n'accepte que des chaînes. On convertit chaque élément (ou `", ".join(map(str, notes))`).
  - key: bug-find-zero
    format: bug-fix
    question: |-
      Ce code affiche `tout va bien`, alors que le texte contient bien « erreur » :
      ```python
      texte = "erreur : disque plein"
      if texte.find("erreur"):
          print("alerte")
      else:
          print("tout va bien")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if \"erreur\" in texte:`", correct: true}
      - {text: "`if texte.find(\"erreur\") > 0:`", correct: false}
      - {text: "`if texte.index(\"erreur\"):`", correct: false}
      - {text: "`if not texte.find(\"erreur\"):`", correct: false}
    answer: |-
      ```python
      texte = "erreur : disque plein"
      if "erreur" in texte:
          print("alerte")
      else:
          print("tout va bien")
      ```
      `find` renvoie la position, ici `0`, qui est faux ; et `-1`, quand le mot manque, est vrai. Pour un test de
      présence, `in`.
  - key: bug-strip-url
    format: bug-fix
    question: |-
      Ce code devait afficher `shop.fr`, mais affiche `op.fr` :
      ```python
      url = "https://shop.fr"
      print(url.strip("https://"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`url.removeprefix(\"https://\")`", correct: true}
      - {text: "`url.lstrip(\"https://\")`", correct: false}
      - {text: "`url.strip(\"https\")`", correct: false}
      - {text: "`url.split(\"https://\")`", correct: false}
    answer: |-
      ```python
      url = "https://shop.fr"
      print(url.removeprefix("https://"))
      ```
      `strip` retire tous les caractères de l'ensemble `{h, t, p, s, :, /}` tant qu'il en trouve : le `s` et le `h`
      de `shop` y passent. `removeprefix` retire le préfixe exact, une seule fois.
