notion: python-presentation
lesson: |-
  **Python** est un langage généraliste, créé par Guido van Rossum ; sa première version publique date de 1991. Il sert
  aux scripts et à l'automatisation, au web (Django, FastAPI), aux données et à l'IA (NumPy, pandas, PyTorch), aux
  tests et à l'outillage.

  **Les versions.** Python 3 (2008) a rompu avec Python 2, qui n'est plus maintenu depuis le 1er janvier 2020. Une
  version mineure sort chaque année, en octobre (PEP 602) : ce sujet vise **Python 3.14**, sortie en octobre 2025.

  **Interprété ? Pas tout à fait.** L'implémentation de référence, **CPython** (écrite en C, celle de python.org),
  **compile** d'abord le code source en **bytecode**, mis en cache dans `__pycache__/` (des fichiers `.pyc`), puis
  l'exécute dans sa **machine virtuelle**. Il n'y a pas d'étape de compilation à lancer soi-même : `python script.py`
  fait tout.

  | | Java | Python |
  |---|---|---|
  | Compilation | `javac` en bytecode, puis la JVM | implicite, en bytecode, puis la VM de CPython |
  | Types | statiques, déclarés | **dynamiques** (portés par les objets) et **forts** (pas de conversion implicite) |
  | Blocs | accolades | **indentation** |
  | Mémoire | ramasse-miettes | comptage de références, et un ramasse-miettes pour les cycles |

  **Les autres implémentations** : **PyPy** (un compilateur à la volée, JIT, souvent bien plus rapide sur du code pur
  Python), **MicroPython** (pour les microcontrôleurs), Jython (sur la JVM, resté en Python 2) et IronPython (sur .NET).

  **Le GIL.** CPython protège son interpréteur par un verrou global, le *Global Interpreter Lock* : un seul thread
  exécute du bytecode Python à la fois. Les threads servent aux attentes (réseau, disque), pas au calcul en parallèle,
  pour lequel on prend des processus (`multiprocessing`). Depuis Python 3.13, une version **sans GIL**
  (*free-threaded*) existe ; elle est officiellement prise en charge en 3.14, mais ce n'est pas celle installée par
  défaut.

  **La philosophie.** Le **Zen of Python** (PEP 20), que `import this` affiche, résume l'esprit du langage :
  « Readability counts », « Explicit is better than implicit », « There should be one-- and preferably only one
  --obvious way to do it ». La bibliothèque standard est riche (*batteries included*) : JSON, CSV, dates, expressions
  régulières, HTTP, tests... Les évolutions passent par des **PEP** (*Python Enhancement Proposals*), et le style
  par PEP 8.

  **En entretien** : « Python est un langage à typage dynamique et fort, dont l'implémentation de référence, CPython,
  compile le source en bytecode exécuté par une machine virtuelle. Son GIL empêche deux threads d'exécuter du bytecode
  en même temps, d'où les processus pour le calcul. Sa philosophie, c'est la lisibilité, et une bibliothèque standard
  très complète. »
tour:
  - title: Bienvenue
    text: |-
      Bienvenue dans le Tour de Python ! Il s'adresse à toi qui programmes déjà dans un autre langage. Chaque page
      montre un programme : modifie-le, puis exécute-le avec le bouton « Exécuter ».

      Remarque déjà ce qui manque, par rapport à Java ou à C :

      - pas de fonction `main` : le fichier s'exécute de haut en bas ;
      - pas de point-virgule, pas d'accolades : c'est **l'indentation** qui délimite le corps de la boucle ;
      - pas de type déclaré : `langages` est une liste, Python le sait tout seul ;
      - pas de limite aux entiers : `2 ** 100` (deux puissance cent) tient sans débordement.

      Essaie : remplace `2 ** 100` par `2 ** 1000`, puis exécute.
    example:
      files:
        main.py: |-
          print("Bienvenue dans le Tour de Python !")

          langages = ["Java", "Go", "C++"]
          for langage in langages:
              print("Tu viens peut-être de", langage)

          print(2 ** 100)
      output: |-
        Bienvenue dans le Tour de Python !
        Tu viens peut-être de Java
        Tu viens peut-être de Go
        Tu viens peut-être de C++
        1267650600228229401496703205376
  - title: "La philosophie : import this"
    text: |-
      Python a une philosophie écrite : le **Zen of Python** (PEP 20), dix-neuf aphorismes que le module `this` affiche
      quand on l'importe. Retiens-en trois : la lisibilité compte, l'explicite vaut mieux que l'implicite, et il devrait
      y avoir une façon évidente de faire les choses.

      Derrière ce programme d'une ligne, CPython, l'interpréteur de référence, compile le fichier en **bytecode**, puis
      l'exécute dans sa machine virtuelle : pas de compilation à lancer soi-même.

      Essaie : ajoute une seconde ligne `import this`. Le texte ne s'affiche qu'une fois, car un module n'est exécuté
      qu'à son premier import.
    example:
      files:
        main.py: |-
          import this
      output: |-
        The Zen of Python, by Tim Peters

        Beautiful is better than ugly.
        Explicit is better than implicit.
        Simple is better than complex.
        Complex is better than complicated.
        Flat is better than nested.
        Sparse is better than dense.
        Readability counts.
        Special cases aren't special enough to break the rules.
        Although practicality beats purity.
        Errors should never pass silently.
        Unless explicitly silenced.
        In the face of ambiguity, refuse the temptation to guess.
        There should be one-- and preferably only one --obvious way to do it.
        Although that way may not be obvious at first unless you're Dutch.
        Now is better than never.
        Although never is often better than *right* now.
        If the implementation is hard to explain, it's a bad idea.
        If the implementation is easy to explain, it may be a good idea.
        Namespaces are one honking great idea -- let's do more of those!
cards:
  - key: implementation-reference
    format: course
    question: Quelle implémentation de Python est la référence, celle qu'on télécharge sur python.org ?
    choices:
      - {text: "CPython, écrite en C", correct: true}
      - {text: "PyPy, écrite en Python", correct: false}
      - {text: "Jython, écrite en Java", correct: false}
      - {text: "MicroPython, écrite en C++", correct: false}
    answer: "CPython est l'implémentation de référence : c'est elle qui définit le comportement du langage. PyPy, Jython ou MicroPython sont des alternatives."
  - key: execution-cpython
    format: course
    question: Que fait CPython quand il exécute un fichier `.py` ?
    choices:
      - {text: "Il compile le source en bytecode, puis l'exécute dans sa machine virtuelle", correct: true}
      - {text: "Il traduit chaque ligne en code machine juste avant de l'exécuter", correct: false}
      - {text: "Il compile tout le programme en un exécutable natif, puis le lance", correct: false}
      - {text: "Il transmet le source à la JVM, qui le compile en bytecode Java", correct: false}
    answer: "Le bytecode est mis en cache dans `__pycache__/` (fichiers `.pyc`) pour les modules importés. Il n'y a pas d'étape de compilation à lancer soi-même."
  - key: gil
    format: course
    question: Qu'est-ce que le GIL de CPython ?
    choices:
      - {text: "Un verrou global qui ne laisse qu'un thread exécuter du bytecode à la fois", correct: true}
      - {text: "Un ramasse-miettes global qui arrête tous les threads à chaque passage", correct: false}
      - {text: "Une file globale qui répartit les threads sur tous les cœurs du processeur", correct: false}
      - {text: "Un index global des modules importés, partagé par tous les threads", correct: false}
    answer: "Le *Global Interpreter Lock* simplifie l'interpréteur, mais empêche le calcul en parallèle avec des threads. Depuis 3.13, une version sans GIL existe (officiellement prise en charge en 3.14), mais elle n'est pas installée par défaut."
  - key: fin-python-2
    format: course
    question: Depuis quand Python 2 n'est-il plus maintenu ?
    choices:
      - {text: "Depuis le 1er janvier 2020", correct: true}
      - {text: "Depuis la sortie de Python 3, en 2008", correct: false}
      - {text: "Depuis la sortie de Python 3.6, en 2016", correct: false}
      - {text: "Il est toujours maintenu, en parallèle de Python 3", correct: false}
    answer: "Python 2.7 a reçu des correctifs jusqu'au 1er janvier 2020, soit douze ans après Python 3. Plus aucun correctif de sécurité n'est publié depuis."
  - key: vf-types-avant-execution
    format: true-false
    question: Python vérifie les types des variables avant de lancer le programme.
    truth: false
    answer: "Les types sont vérifiés à l'exécution, quand une opération est faite. Les annotations de type ne sont pas vérifiées par l'interpréteur : c'est le rôle d'outils comme mypy."
  - key: vf-bytecode
    format: true-false
    question: CPython compile le code source en bytecode avant de l'exécuter.
    truth: true
    answer: "Le source est compilé en bytecode, puis exécuté par la machine virtuelle de CPython. Le module `dis` permet de voir ce bytecode."
  - key: vf-python-2-compatible
    format: true-false
    question: Un programme écrit pour Python 2 s'exécute sans modification sous Python 3.
    truth: false
    answer: "Python 3 a rompu la compatibilité : `print` est devenu une fonction, `/` donne toujours un flottant, et le texte est séparé des octets (`str` et `bytes`)."
  - key: vf-batteries-included
    format: true-false
    question: "La bibliothèque standard de Python lit le JSON et le CSV, et gère les dates, sans paquet à installer."
    truth: true
    answer: "C'est la promesse *batteries included* : les modules `json`, `csv` et `datetime` font partie de toute installation de Python."
  - key: qcm-import-this
    format: multiple-choice
    question: Quelle instruction affiche le Zen of Python ?
    choices:
      - {text: "`import this`", correct: true}
      - {text: "`import zen`", correct: false}
      - {text: "`help(\"zen\")`", correct: false}
      - {text: "`print(__zen__)`", correct: false}
    answer: "Le module `this` affiche les dix-neuf aphorismes de la PEP 20 quand on l'importe."
  - key: qcm-principe-zen
    format: multiple-choice
    question: Lequel de ces principes vient du Zen of Python ?
    choices:
      - {text: "« Explicit is better than implicit. »", correct: true}
      - {text: "« Write once, run anywhere. »", correct: false}
      - {text: "« There's more than one way to do it. »", correct: false}
      - {text: "« Don't communicate by sharing memory. »", correct: false}
    answer: "Le deuxième aphorisme de la PEP 20. « Write once, run anywhere » est la devise de Java ; « There's more than one way to do it » celle de Perl, à l'opposé du Zen, qui veut une façon évidente de faire."
  - key: qcm-pypy
    format: multiple-choice
    question: Quelle implémentation de Python compile le code à la volée (JIT) pour l'accélérer ?
    choices:
      - {text: "PyPy", correct: true}
      - {text: "MicroPython", correct: false}
      - {text: "Jython", correct: false}
      - {text: "IronPython", correct: false}
    answer: "PyPy est souvent plusieurs fois plus rapide que CPython sur du code pur Python. MicroPython vise les microcontrôleurs ; Jython et IronPython tournent sur la JVM et sur .NET."
  - key: qcm-cycle-versions
    format: multiple-choice
    question: À quel rythme sortent les versions de Python ?
    choices:
      - {text: "Une version mineure par an, en octobre", correct: true}
      - {text: "Une version tous les six mois, en mars et septembre", correct: false}
      - {text: "Une version majeure tous les deux ans, en juin", correct: false}
      - {text: "Une version à long terme (LTS) tous les trois ans", correct: false}
    answer: "Depuis la PEP 602, une version mineure sort chaque année en octobre : 3.13 en 2024, 3.14 en 2025. Chacune est maintenue cinq ans. Le rythme de six mois est celui de Java."
  - key: situation-interprete
    format: scenario
    question: |-
      Un collègue qui vient de Java affirme : « Python est interprété, il n'y a donc aucune compilation. » Que lui
      réponds-tu ?
    choices:
      - {text: "CPython compile le source en bytecode, mis en cache, puis l'exécute dans sa VM", correct: true}
      - {text: "Il a raison : chaque ligne est relue et exécutée telle quelle, à chaque passage", correct: false}
      - {text: "Python compile le source en code machine natif, comme un compilateur C", correct: false}
      - {text: "Python compile le source en bytecode Java, que la JVM exécute ensuite", correct: false}
    answer: |-
      La compilation existe, mais elle est implicite : CPython produit du bytecode (les `.pyc` de `__pycache__/` pour
      les modules importés), puis sa machine virtuelle l'interprète. Ce bytecode n'est pas celui de la JVM.
  - key: situation-script-standard
    format: scenario
    question: |-
      Ton équipe doit écrire un petit script qui lit un CSV, en tire un JSON, et l'archive en zip. Un collègue veut
      installer trois paquets avant d'écrire la première ligne. Que proposes-tu ?
    choices:
      - {text: "Commencer avec la bibliothèque standard : `csv`, `json` et `zipfile`", correct: true}
      - {text: "Installer les paquets : Python ne sait lire ni le CSV ni le JSON", correct: false}
      - {text: "Écrire soi-même un lecteur de CSV, plus fiable que le module standard", correct: false}
      - {text: "Écrire le script en Java, dont la bibliothèque standard est plus riche", correct: false}
    answer: |-
      *Batteries included* : la bibliothèque standard couvre ces trois besoins. Un paquet externe ajoute une dépendance
      à installer, à mettre à jour et à surveiller ; il se justifie quand le module standard ne suffit plus.
  - key: situation-threads-calcul
    format: scenario
    question: |-
      Un programme qui calcule (sans entrée ni sortie) ne va pas plus vite avec huit threads qu'avec un seul. On te
      demande pourquoi, en entretien. Que réponds-tu ?
    choices:
      - {text: "Le GIL de CPython : un seul thread exécute du bytecode à la fois ; il faut des processus", correct: true}
      - {text: "Python ne sait créer qu'un seul thread par programme : les sept autres attendent", correct: false}
      - {text: "Le système d'exploitation place tous les threads d'un programme Python sur un seul cœur", correct: false}
      - {text: "Il faut démarrer les threads avec `parallel=True` pour qu'ils tournent en même temps", correct: false}
    answer: |-
      Le GIL laisse un seul thread exécuter du bytecode à la fois : les threads aident quand on attend (réseau, disque),
      pas pour calculer. Pour le calcul, on prend `multiprocessing` ou `concurrent.futures.ProcessPoolExecutor`, ou la
      version sans GIL de Python 3.14.
  - key: situation-python-2
    format: scenario
    question: |-
      Un client veut démarrer un nouveau projet en Python 2.7, « parce que l'ancien code l'utilise ». Que lui
      conseilles-tu ?
    choices:
      - {text: "Python 3 : Python 2 ne reçoit plus aucun correctif de sécurité depuis 2020", correct: true}
      - {text: "Python 2.7 : c'est la version à long terme, maintenue pour les entreprises", correct: false}
      - {text: "Peu importe : Python 3 exécute le code Python 2 sans modification", correct: false}
      - {text: "Attendre Python 4, qui doit réunir les deux branches du langage", correct: false}
    answer: |-
      Python 2 est arrêté depuis le 1er janvier 2020 : plus de correctifs, et la plupart des bibliothèques l'ont
      abandonné. L'ancien code se migre ; un nouveau projet part sur une version récente.
  - key: definition-pep
    format: definition
    question: Qu'est-ce qu'une PEP ?
    choices:
      - {text: "Un document qui propose une évolution du langage, ou une convention", correct: true}
      - {text: "Un paquet de la bibliothèque standard, installé avec Python", correct: false}
      - {text: "Un format d'archive qui sert à distribuer une application", correct: false}
      - {text: "Un outil qui vérifie le style du code, livré avec Python", correct: false}
    answer: "*Python Enhancement Proposal* : chaque nouveauté du langage passe par une PEP discutée puis acceptée. Certaines fixent des conventions, comme PEP 8 (le style) ou PEP 20 (le Zen)."
  - key: definition-bytecode
    format: definition
    question: Qu'est-ce que le bytecode, en CPython ?
    choices:
      - {text: "Des instructions de bas niveau pour la machine virtuelle de CPython", correct: true}
      - {text: "Le code machine du processeur, produit à partir du source", correct: false}
      - {text: "Le code source compressé, pour être chargé plus vite", correct: false}
      - {text: "Le code Java que l'interpréteur génère avant de l'exécuter", correct: false}
    answer: "CPython compile le source en bytecode, puis sa boucle d'évaluation l'exécute instruction par instruction. `dis.dis(fonction)` l'affiche."
  - key: definition-batteries-included
    format: definition
    question: Que veut dire « batteries included », à propos de Python ?
    choices:
      - {text: "Une bibliothèque standard riche, qui couvre les besoins courants", correct: true}
      - {text: "Un gestionnaire de paquets intégré à l'interpréteur", correct: false}
      - {text: "Un compilateur à la volée (JIT) activé par défaut", correct: false}
      - {text: "Un mode d'économie d'énergie pour les appareils mobiles", correct: false}
    answer: "JSON, CSV, dates, expressions régulières, HTTP, tests, compression : tout cela est livré avec Python, sans rien installer."
  - key: definition-zen
    format: definition
    question: Qu'est-ce que le Zen of Python ?
    choices:
      - {text: "Dix-neuf aphorismes qui résument la philosophie du langage (PEP 20)", correct: true}
      - {text: "Le guide de style officiel du code Python, avec ses règles de nommage", correct: false}
      - {text: "Le mode interactif de l'interpréteur, avec son invite `>>>`", correct: false}
      - {text: "Le nom de code de la machine virtuelle de CPython", correct: false}
    answer: "`import this` les affiche : « Beautiful is better than ugly », « Readability counts »... Le guide de style, lui, est PEP 8."
