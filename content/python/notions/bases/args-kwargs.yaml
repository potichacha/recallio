notion: args-kwargs
lesson: |-
  **Recevoir un nombre quelconque d'arguments.** Dans un `def` :

  - `*args` rassemble les arguments **positionnels** en trop dans un **tuple** ;
  - `**kwargs` rassemble les arguments **nommés** en trop dans un **dictionnaire** (qui garde l'ordre de passage).

  ```python
  def journaliser(niveau, *messages, **contexte):
      print(niveau, messages, contexte)

  journaliser("INFO", "démarrage", "port 8080", hote="srv1")
  # INFO ('démarrage', 'port 8080') {'hote': 'srv1'}
  ```

  Les noms `args` et `kwargs` sont une **convention** : ce sont `*` et `**` qui comptent. Sans argument en trop, on
  obtient un tuple vide et un dictionnaire vide.

  **L'ordre dans la signature** : paramètres positionnels, `*args`, paramètres **nommés seulement**, `**kwargs`.

  ```python
  def f(a, b=2, *args, option, verbeux=False, **kwargs): ...
  ```

  Tout paramètre placé après `*args` ne peut être passé que par son nom. Rien ne peut suivre `**kwargs` (« arguments
  cannot follow var-keyword argument »).

  **Transmettre, à l'appel** : les mêmes symboles **déballent**.

  ```python
  coords = [3, 4]
  distance(*coords)                  # distance(3, 4)
  options = {"sep": "-", "end": "!"}
  print("a", "b", **options)         # print("a", "b", sep="-", end="!")
  ```

  C'est le motif de toute fonction qui en enveloppe une autre, comme un décorateur :

  ```python
  def wrapper(*args, **kwargs):
      return fonction(*args, **kwargs)
  ```

  **Les pièges** : oublier l'étoile en transmettant (`journaliser("x", messages)` passe **un** tuple) ; déballer un
  dictionnaire dont une clé vise un paramètre déjà rempli (« got multiple values for argument 'nom' ») ; passer par
  position un paramètre placé après `*args` (« missing 1 required keyword-only argument »).

  **En entretien** : « `*args` reçoit les positionnels en trop dans un tuple, `**kwargs` les nommés en trop dans un
  dictionnaire. À l'appel, `*` et `**` déballent une séquence et un dictionnaire. C'est ainsi qu'un décorateur
  transmet tous les arguments à la fonction qu'il enveloppe. »
cards:
  - key: type-args
    format: course
    question: Quel est le type de `args` dans `def f(*args):` ?
    choices:
      - {text: "Un `tuple`", correct: true}
      - {text: "Une `list`", correct: false}
      - {text: "Un `dict`", correct: false}
      - {text: "Un `set`", correct: false}
    answer: "Les positionnels en trop arrivent dans un tuple, vide s'il n'y en a pas. `**kwargs`, lui, est un dictionnaire."
  - key: apres-args
    format: course
    question: Que deviennent les paramètres placés après `*args` dans un `def` ?
    choices:
      - {text: "Des paramètres nommés seulement : on les passe par leur nom", correct: true}
      - {text: "Des paramètres ignorés, absorbés par `*args`", correct: false}
      - {text: "Des paramètres positionnels, remplis après `args`", correct: false}
      - {text: "Une `SyntaxError` : `*args` doit être le dernier", correct: false}
    answer: "`*args` absorbe tous les positionnels : un paramètre qui le suit ne peut plus être atteint que par son nom."
  - key: deballer-liste
    format: course
    question: Avec `valeurs = [1, 2, 3]`, que fait l'appel `f(*valeurs)` ?
    choices:
      - {text: "Il passe 1, 2 et 3 comme trois arguments positionnels", correct: true}
      - {text: "Il passe la liste entière comme un seul argument", correct: false}
      - {text: "Il passe un pointeur vers la liste, comme en C", correct: false}
      - {text: "Il passe 1, 2 et 3 comme trois arguments nommés", correct: false}
    answer: "À l'appel, `*` déballe n'importe quel itérable en arguments positionnels ; `**` déballe un dictionnaire en arguments nommés."
  - key: pourquoi-wrapper
    format: course
    question: Pourquoi un décorateur écrit-il souvent `def wrapper(*args, **kwargs)` ?
    choices:
      - {text: "Pour accepter n'importe quels arguments et les transmettre tels quels", correct: true}
      - {text: "Pour copier les arguments et éviter de modifier les originaux", correct: false}
      - {text: "Pour rendre facultatifs tous les arguments de la fonction", correct: false}
      - {text: "Pour vérifier le type des arguments avant chaque appel", correct: false}
    answer: "Le décorateur ne connaît pas la signature de la fonction qu'il enveloppe : il reçoit tout, puis transmet tout avec `fonction(*args, **kwargs)`."
  - key: vf-noms-imposes
    format: true-false
    question: Les noms `args` et `kwargs` sont imposés par le langage.
    truth: false
    answer: "Seuls `*` et `**` comptent : `def f(*valeurs, **options)` fonctionne de la même façon. `args` et `kwargs` sont une convention."
  - key: vf-ordre-kwargs
    format: true-false
    question: Dans `def f(**kwargs)`, `kwargs` garde l'ordre dans lequel les arguments nommés ont été passés.
    truth: true
    answer: "C'est garanti depuis Python 3.6 (PEP 468), comme l'ordre d'insertion des dictionnaires."
  - key: vf-args-avant-kwargs
    format: true-false
    question: Dans la liste des paramètres, `*args` doit être placé avant `**kwargs`.
    truth: true
    answer: "`**kwargs` vient toujours en dernier : rien ne peut le suivre."
  - key: vf-args-vide
    format: true-false
    question: "Avec `def f(*args)`, l'appel `f()` sans argument lève une `TypeError`."
    truth: false
    answer: "`args` vaut alors le tuple vide `()`. `*args` accepte zéro argument ou plus."
  - key: qcm-signature-valide
    format: multiple-choice
    question: Quelle signature est valide ?
    choices:
      - {text: "`def f(a, *args, b=1, **kwargs):`", correct: true}
      - {text: "`def f(**kwargs, *args):`", correct: false}
      - {text: "`def f(*args, **kwargs, a):`", correct: false}
      - {text: "`def f(a, **kwargs, b=1):`", correct: false}
    answer: "L'ordre est : positionnels, `*args`, nommés seulement, `**kwargs`. Rien ne suit `**kwargs`."
  - key: qcm-ce-que-recoit
    format: multiple-choice
    question: "Avec `def f(*args, **kwargs)`, que reçoit l'appel `f(1, 2, x=3)` ?"
    choices:
      - {text: "`args == (1, 2)` et `kwargs == {'x': 3}`", correct: true}
      - {text: "`args == [1, 2]` et `kwargs == {'x': 3}`", correct: false}
      - {text: "`args == (1, 2, 3)` et `kwargs == {}`", correct: false}
      - {text: "`args == (1, 2)` et `kwargs == ('x', 3)`", correct: false}
    answer: "Les positionnels vont dans un tuple, les nommés dans un dictionnaire, dont les clés sont les noms."
  - key: qcm-transmettre
    format: multiple-choice
    question: "Comment transmettre à `g` tous les arguments reçus par `def f(*args, **kwargs)` ?"
    choices:
      - {text: "`g(*args, **kwargs)`", correct: true}
      - {text: "`g(args, kwargs)`", correct: false}
      - {text: "`g(*args, *kwargs)`", correct: false}
      - {text: "`g(**args, **kwargs)`", correct: false}
    answer: "Il faut redéballer : `*` pour le tuple, `**` pour le dictionnaire. Sans étoiles, `g` recevrait deux arguments : un tuple et un dictionnaire."
  - key: qcm-cle-inconnue
    format: multiple-choice
    question: |-
      Avec `def f(a, b)` et `d = {"a": 1, "c": 2}`, que fait l'appel `f(**d)` ?
    choices:
      - {text: "Une `TypeError` : `c` n'est pas un paramètre de `f`", correct: true}
      - {text: "Il appelle `f(1, 2)`, dans l'ordre des valeurs", correct: false}
      - {text: "Il appelle `f(a=1)`, et ignore la clé `c`", correct: false}
      - {text: "Il appelle `f('a', 'c')`, avec les clés", correct: false}
    answer: "Chaque clé devient un argument nommé : `f(a=1, c=2)`. `c` n'existe pas : « got an unexpected keyword argument 'c' »."
  - key: trous-etoile-simple
    format: fill-in
    question: |-
      Complète pour accepter un nombre quelconque de nombres :
      ```python
      def somme(___nombres):
          return sum(nombres)
      ```
    blanks: [["*"]]
    answer: "`*nombres` reçoit tous les positionnels dans un tuple."
  - key: trous-options-nommees
    format: fill-in
    question: |-
      Complète pour recevoir des options nommées quelconques :
      ```python
      def configurer(___options):
          for cle, valeur in options.items():
              print(cle, valeur)
      ```
    blanks: [["**"]]
    answer: "`**options` reçoit les arguments nommés dans un dictionnaire."
  - key: trous-deballer-coords
    format: fill-in
    question: |-
      Complète pour déballer la liste en arguments positionnels :
      ```python
      coords = [3, 4]
      print(distance(___coords))
      ```
    blanks: [["*"]]
    answer: "`distance(*coords)` revient à `distance(3, 4)`."
  - key: trous-relais
    format: fill-in
    question: |-
      Complète le relais d'un décorateur :
      ```python
      def wrapper(*args, **kwargs):
          return fonction(___args, ___kwargs)
      ```
    blanks: [["*"], ["**"]]
    answer: "On redéballe le tuple et le dictionnaire, pour que `fonction` reçoive exactement les arguments d'origine."
  - key: code-args-kwargs
    format: code-output
    question: |-
      ```python
      def f(*args, **kwargs):
          print(args, kwargs)

      f(1, 2, x=3)
      ```
    check:
      output: "(1, 2) {'x': 3}"
    choices:
      - {text: "`(1, 2) {'x': 3}`", correct: true}
      - {text: "`[1, 2] {'x': 3}`", correct: false}
      - {text: "`(1, 2, 3) {}`", correct: false}
      - {text: "`(1, 2) {x: 3}`", correct: false}
    answer: "Un tuple pour les positionnels, un dictionnaire pour les nommés, dont les clés sont des chaînes."
  - key: code-reste-vide
    format: code-output
    question: |-
      ```python
      def f(a, *reste):
          print(a, reste)

      f(1)
      ```
    check:
      output: "1 ()"
    choices:
      - {text: "`1 ()`", correct: true}
      - {text: "`1 None`", correct: false}
      - {text: "`1 []`", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "Sans argument en trop, `reste` est le tuple vide."
  - key: code-deballer-et-nommer
    format: code-output
    question: |-
      ```python
      def g(a, b, c):
          return a + b * c

      valeurs = [1, 2]
      print(g(*valeurs, c=10))
      ```
    check:
      output: "21"
    choices:
      - {text: "`21`", correct: true}
      - {text: "`30`", correct: false}
      - {text: "`12`", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "`*valeurs` remplit `a` et `b` (1 et 2), `c` vaut 10 : 1 + 2 × 10 = 21."
  - key: code-separateur-nomme
    format: code-output
    question: |-
      ```python
      def f(*args, sep="-"):
          return sep.join(args)

      print(f("a", "b", "c"), f("x", "y", sep="+"))
      ```
    check:
      output: "a-b-c x+y"
    choices:
      - {text: "`a-b-c x+y`", correct: true}
      - {text: "`abc xy`", correct: false}
      - {text: "`a-b-c x-y-+`", correct: false}
      - {text: "`a b c x y`", correct: false}
    answer: "`sep`, placé après `*args`, ne se passe que par son nom : `\"+\"` ne se mêle pas aux arguments positionnels."
  - key: bug-oubli-etoile
    format: bug-fix
    question: |-
      Python répond « TypeError: sequence item 1: expected str instance, tuple found ». Quelle correction est la bonne ?
      ```python
      def journaliser(*messages):
          print(" | ".join(messages))

      def avertir(*messages):
          journaliser("ATTENTION", messages)

      avertir("disque plein", "mémoire basse")
      ```
    choices:
      - {text: "`journaliser(\"ATTENTION\", *messages)`", correct: true}
      - {text: "`journaliser(\"ATTENTION\", **messages)`", correct: false}
      - {text: "`journaliser(\"ATTENTION\", list(messages))`", correct: false}
      - {text: "`journaliser(\"ATTENTION\" + messages)`", correct: false}
    answer: |-
      ```python
      def avertir(*messages):
          journaliser("ATTENTION", *messages)
      ```
      Sans étoile, le tuple `messages` est passé comme un seul argument : `journaliser` reçoit `("ATTENTION", ("disque plein", "mémoire basse"))`.
  - key: bug-nomme-seulement
    format: bug-fix
    question: |-
      Python répond « TypeError: moyenne() missing 1 required keyword-only argument: 'arrondi' ». Quelle correction est la bonne ?
      ```python
      def moyenne(*notes, arrondi):
          return round(sum(notes) / len(notes), arrondi)

      print(moyenne(12, 15, 9, 1))
      ```
    choices:
      - {text: "`moyenne(12, 15, 9, arrondi=1)`", correct: true}
      - {text: "`moyenne(12, 15, 9, (1))`", correct: false}
      - {text: "`moyenne(arrondi, 12, 15, 9)`", correct: false}
      - {text: "`moyenne([12, 15, 9], 1)`", correct: false}
    answer: |-
      ```python
      print(moyenne(12, 15, 9, arrondi=1))
      ```
      `*notes` absorbe tous les positionnels, 1 compris. `arrondi`, placé après, ne se passe que par son nom.
  - key: bug-cle-en-double
    format: bug-fix
    question: |-
      Python répond « TypeError: creer() got multiple values for argument 'nom' ». Quelle correction est la bonne ?
      ```python
      def creer(nom, **options):
          return {"nom": nom, **options}

      reglages = {"nom": "test", "taille": 3}
      print(creer("serveur", **reglages))
      ```
    choices:
      - {text: "Retirer la clé `nom` de `reglages` : elle vise un paramètre déjà rempli", correct: true}
      - {text: "Remplacer `**reglages` par `*reglages` dans l'appel de la fonction", correct: false}
      - {text: "Renommer le paramètre `**options` en `**kwargs`, le nom attendu", correct: false}
      - {text: "Passer `reglages` en premier : `creer(**reglages, \"serveur\")`", correct: false}
    answer: |-
      ```python
      reglages = {"taille": 3}
      print(creer("serveur", **reglages))
      ```
      Le déballage produit `nom="test"`, alors que `"serveur"` a déjà rempli `nom` par position.
  - key: bug-ordre-signature
    format: bug-fix
    question: |-
      Python répond « SyntaxError: arguments cannot follow var-keyword argument ». Quelle correction est la bonne ?
      ```python
      def afficher(**options, *valeurs):
          print(valeurs, options)
      ```
    choices:
      - {text: "`def afficher(*valeurs, **options):`", correct: true}
      - {text: "`def afficher(**options, **valeurs):`", correct: false}
      - {text: "`def afficher(*options, *valeurs):`", correct: false}
      - {text: "`def afficher(options**, valeurs*):`", correct: false}
    answer: |-
      ```python
      def afficher(*valeurs, **options):
          print(valeurs, options)
      ```
      `**options` doit être le dernier paramètre. Une signature n'a qu'un `*` et qu'un `**`.
