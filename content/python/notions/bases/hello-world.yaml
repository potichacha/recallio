notion: hello-world
lesson: |-
  Le premier programme Python tient en une ligne :

  ```python
  print("Bonjour, monde !")
  ```

  - **Pas de `main`, pas de classe** : un fichier `.py` s'exécute de haut en bas, instruction par instruction.
  - **Pas de point-virgule** : la fin de la ligne termine l'instruction.
  - `print` est une **fonction** (depuis Python 3) : les parenthèses sont obligatoires. Elle accepte plusieurs
    arguments, qu'elle sépare par une espace, et ajoute un retour à la ligne. `print()` seul affiche une ligne vide.
  - Une chaîne s'écrit entre guillemets doubles ou simples, au choix.

  **Lancer un script** depuis un terminal :

  ```bash
  python bonjour.py      # python3 sur Linux et macOS, py sur Windows
  python -c 'print(6 * 7)'
  ```

  Sous Linux et macOS, une première ligne `#!/usr/bin/env python3` (le *shebang*), et le droit d'exécution
  (`chmod +x`), permettent de lancer le script par `./bonjour.py`.

  **L'interpréteur interactif** (le REPL) se lance avec `python` sans argument. Il affiche l'invite `>>>`, exécute
  chaque ligne et **affiche la valeur** de chaque expression : `>>> 6 * 7` répond `42`. Dans un script, une expression
  seule est calculée, puis oubliée : il faut `print`. On quitte le REPL avec `exit()`, Ctrl-D (Ctrl-Z puis Entrée sous
  Windows), ou `exit` tout court depuis Python 3.13.

  | Erreur fréquente | Message |
  |---|---|
  | `print "Bonjour"` (habitude de Python 2) | `SyntaxError: Missing parentheses in call to 'print'` |
  | `Print("Bonjour")` | `NameError: name 'Print' is not defined. Did you mean: 'print'?` |
  | `print("Bonjour)` | `SyntaxError: unterminated string literal` |

  Un module importé par un autre exécute lui aussi tout son code : on range donc le programme dans une fonction, appelée
  sous `if __name__ == "__main__":` (une notion dédiée y revient).

  **En entretien** : « Un script Python s'exécute de haut en bas, sans `main` obligatoire. `print` est une fonction
  depuis Python 3, qui sépare ses arguments par une espace. L'interpréteur interactif affiche la valeur des expressions,
  un script non. »
tour:
  - title: Le premier programme
    text: |-
      Un programme Python n'a besoin ni de classe ni de `main` : les instructions s'exécutent dans l'ordre du fichier.

      `print` est une fonction. Elle affiche ses arguments séparés par une espace, puis passe à la ligne ; sans
      argument, elle affiche une ligne vide. Une expression comme `6 * 7` se calcule n'importe où, y compris dans
      l'appel à `print`.

      Essaie : remplace `print("Bonjour, monde !")` par `print "Bonjour, monde !"`, la syntaxe de Python 2. Python 3
      refuse de lancer le programme et te dit pourquoi.
    example:
      files:
        main.py: |-
          print("Bonjour, monde !")
          print("Python", "sépare", "ses", "arguments", "par", "des", "espaces")
          print()
          print("6 x 7 =", 6 * 7)
      output: |-
        Bonjour, monde !
        Python sépare ses arguments par des espaces

        6 x 7 = 42
    task:
      instructions: |-
        Fais afficher deux lignes : `Bonjour, Ada !`, puis `2 + 3 = 5`, en calculant `2 + 3` dans le programme.
      starter:
        main.py: |-
          print("Bonjour, monde !")
      solution:
        main.py: |-
          print("Bonjour, Ada !")
          print("2 + 3 =", 2 + 3)
      output: |-
        Bonjour, Ada !
        2 + 3 = 5
cards:
  - key: minimum-programme
    format: course
    question: Que faut-il au minimum dans un fichier Python pour afficher « Bonjour » ?
    choices:
      - {text: "Une seule ligne : `print(\"Bonjour\")`", correct: true}
      - {text: "Une classe avec une méthode `main`, comme en Java", correct: false}
      - {text: "Une fonction `main()`, que Python appelle au lancement", correct: false}
      - {text: "Un `import sys`, puis `sys.print(\"Bonjour\")`", correct: false}
    answer: "Un fichier `.py` s'exécute de haut en bas : il n'y a pas de point d'entrée imposé. Python n'appelle jamais une fonction `main` de lui-même."
  - key: repl-ou-script
    format: course
    question: "Une ligne ne contient que l'expression `2 + 3`. Où sa valeur s'affiche-t-elle ?"
    choices:
      - {text: "Dans l'interpréteur interactif, mais pas dans un script", correct: true}
      - {text: "Dans un script, mais pas dans l'interpréteur interactif", correct: false}
      - {text: "Dans les deux : Python affiche toujours une expression seule", correct: false}
      - {text: "Nulle part : sans `print`, Python lève une `SyntaxError`", correct: false}
    answer: "Le REPL affiche la valeur de chaque expression qu'on y tape (sauf `None`). Dans un script, la valeur est calculée puis oubliée : il faut `print`."
  - key: lancer-script
    format: course
    question: Comment lance-t-on le script `bonjour.py` depuis un terminal ?
    choices:
      - {text: "`python bonjour.py`", correct: true}
      - {text: "`pythonc bonjour.py`, puis `python bonjour`", correct: false}
      - {text: "`python run bonjour`", correct: false}
      - {text: "`py-compile bonjour.py && ./bonjour`", correct: false}
    answer: "Une seule commande : `python` (souvent `python3` sur Linux et macOS, `py` sous Windows) compile le fichier en bytecode et l'exécute aussitôt."
  - key: print-sans-argument
    format: course
    question: Que fait `print()` appelé sans argument ?
    choices:
      - {text: "Il affiche une ligne vide", correct: true}
      - {text: "Il lève une `TypeError` : un argument manque", correct: false}
      - {text: "Il n'affiche rien du tout", correct: false}
      - {text: "Il affiche le mot `None`", correct: false}
    answer: "`print` affiche ses arguments puis un retour à la ligne ; sans argument, il reste le retour à la ligne."
  - key: vf-main-obligatoire
    format: true-false
    question: Un script Python doit définir une fonction `main` pour pouvoir s'exécuter.
    truth: false
    answer: "Le fichier s'exécute de haut en bas. Une fonction `main` est une convention utile, mais il faut l'appeler soi-même."
  - key: vf-expression-script
    format: true-false
    question: Dans un script, une ligne qui ne contient que l'expression `6 * 7` n'affiche rien.
    truth: true
    answer: "L'expression est calculée, puis son résultat est oublié. Seul l'interpréteur interactif affiche la valeur des expressions."
  - key: vf-print-sans-parentheses
    format: true-false
    question: "En Python 3, `print 'Bonjour'`, sans parenthèses, affiche Bonjour."
    truth: false
    answer: "`print` est une fonction depuis Python 3 : sans parenthèses, c'est une `SyntaxError` (« Missing parentheses in call to 'print' »)."
  - key: vf-point-virgule
    format: true-false
    question: Chaque instruction Python doit se terminer par un point-virgule.
    truth: false
    answer: "La fin de la ligne termine l'instruction. Un point-virgule est permis pour en mettre deux sur une ligne, mais PEP 8 le déconseille."
  - key: qcm-quitter-repl
    format: multiple-choice
    question: Comment quitte-t-on l'interpréteur interactif de Python ?
    choices:
      - {text: "`exit()`", correct: true}
      - {text: "`:q`", correct: false}
      - {text: "`stop()`", correct: false}
      - {text: "`break`", correct: false}
    answer: "`exit()`, ou Ctrl-D (Ctrl-Z puis Entrée sous Windows). Depuis Python 3.13, le nouvel interpréteur accepte aussi `exit` sans parenthèses."
  - key: qcm-afficher-ligne
    format: multiple-choice
    question: Quelle ligne affiche `Bonjour` suivi d'un retour à la ligne ?
    choices:
      - {text: "`print(\"Bonjour\")`", correct: true}
      - {text: "`println(\"Bonjour\")`", correct: false}
      - {text: "`echo(\"Bonjour\")`", correct: false}
      - {text: "`console.log(\"Bonjour\")`", correct: false}
    answer: "`print` ajoute le retour à la ligne de lui-même. `println`, `echo` et `console.log` viennent d'autres langages."
  - key: qcm-shebang
    format: multiple-choice
    question: Quelle première ligne permet de lancer un script par `./script.py` sous Linux ?
    choices:
      - {text: "`#!/usr/bin/env python3`", correct: true}
      - {text: "`#include <python3>`", correct: false}
      - {text: "`import python3`", correct: false}
      - {text: "`// run: python3`", correct: false}
    answer: "Le *shebang* indique au système quel interpréteur lancer ; `env` cherche `python3` dans le `PATH`. Il faut aussi rendre le fichier exécutable (`chmod +x script.py`)."
  - key: qcm-python-sans-argument
    format: multiple-choice
    question: Que lance la commande `python`, sans argument ?
    choices:
      - {text: "L'interpréteur interactif, avec son invite `>>>`", correct: true}
      - {text: "L'aide en ligne de Python, page par page", correct: false}
      - {text: "Le dernier script exécuté dans ce dossier", correct: false}
      - {text: "Une erreur : un nom de fichier est obligatoire", correct: false}
    answer: "Le REPL (*Read-Eval-Print Loop*) lit une ligne, l'exécute, affiche le résultat et recommence. Pratique pour essayer une fonction."
  - key: trous-print
    format: fill-in
    question: |-
      Complète pour afficher Bonjour :
      ```python
      ___("Bonjour")
      ```
    blanks: [[print]]
    answer: "`print` est une fonction : on l'appelle avec des parenthèses."
  - key: trous-lancer
    format: fill-in
    question: |-
      Complète la commande qui lance le script `app.py` :
      ```bash
      ___ app.py
      ```
    blanks: [[python, python3, py]]
    answer: "`python app.py` ; `python3` sur Linux et macOS, `py` sous Windows."
  - key: trous-ligne-vide
    format: fill-in
    question: |-
      Complète pour afficher une ligne vide :
      ```python
      print___
      ```
    blanks: [["()"]]
    answer: "`print()` sans argument n'affiche que le retour à la ligne."
  - key: trous-shebang
    format: fill-in
    question: |-
      Complète le shebang d'un script exécutable :
      ```python
      #!/usr/bin/___ python3
      ```
    blanks: [[env]]
    answer: "`/usr/bin/env python3` cherche `python3` dans le `PATH`, où qu'il soit installé."
  - key: code-deux-arguments
    format: code-output
    question: |-
      ```python
      print("Bonjour", "Ada")
      ```
    answer: "`Bonjour Ada` : `print` sépare ses arguments par une espace."
    check:
      output: "Bonjour Ada"
    choices:
      - {text: "`Bonjour Ada`", correct: true}
      - {text: "`BonjourAda`", correct: false}
      - {text: "`Bonjour,Ada`", correct: false}
      - {text: "`('Bonjour', 'Ada')`", correct: false}
  - key: code-expression-oubliee
    format: code-output
    question: |-
      ```python
      6 * 7
      print("fin")
      ```
    answer: "`fin` : dans un script, l'expression `6 * 7` est calculée puis oubliée."
    check:
      output: "fin"
    choices:
      - {text: "`fin`", correct: true}
      - text: |-
          ```
          42
          fin
          ```
        correct: false
      - {text: "`42 fin`", correct: false}
      - {text: "`42`", correct: false}
  - key: code-calcul-dans-print
    format: code-output
    question: |-
      ```python
      print(1, "+", 1, "=", 1 + 1)
      ```
    answer: "`1 + 1 = 2` : chaque argument est séparé par une espace, et `1 + 1` est calculé avant l'appel."
    check:
      output: "1 + 1 = 2"
    choices:
      - {text: "`1 + 1 = 2`", correct: true}
      - {text: "`1+1=2`", correct: false}
      - {text: "`1 + 1 = 1 + 1`", correct: false}
      - {text: "`1 + 1 = 11`", correct: false}
  - key: code-concatenation-print
    format: code-output
    question: |-
      ```python
      print("Py" + "thon", 3)
      ```
    answer: "`Python 3` : `+` colle les deux chaînes, puis `print` ajoute une espace avant le second argument."
    check:
      output: "Python 3"
    choices:
      - {text: "`Python 3`", correct: true}
      - {text: "`Py thon 3`", correct: false}
      - {text: "`Python3`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: bug-print-python-2
    format: bug-fix
    question: |-
      Ce script, copié d'un vieux tutoriel, s'arrête avec « SyntaxError: Missing parentheses in call to 'print'. Did
      you mean print(...)? » :
      ```python
      print "Bonjour"
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(\"Bonjour\")`", correct: true}
      - {text: "`print \"Bonjour\";`", correct: false}
      - {text: "`print: \"Bonjour\"`", correct: false}
      - {text: "`echo \"Bonjour\"`", correct: false}
    answer: |-
      ```python
      print("Bonjour")
      ```
      En Python 2, `print` était une instruction ; en Python 3, c'est une fonction, qui s'appelle avec des parenthèses.
  - key: bug-print-majuscule
    format: bug-fix
    question: |-
      Ce script s'arrête avec « NameError: name 'Print' is not defined. Did you mean: 'print'? » :
      ```python
      Print("Bonjour")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `print` en minuscules", correct: true}
      - {text: "Ajouter `import Print` en tête du fichier", correct: false}
      - {text: "Écrire `PRINT` en majuscules", correct: false}
      - {text: "Ajouter un point-virgule en fin de ligne", correct: false}
    answer: |-
      ```python
      print("Bonjour")
      ```
      Python distingue majuscules et minuscules : `Print` est un autre nom, que rien ne définit.
  - key: bug-guillemet
    format: bug-fix
    question: |-
      Ce script refuse de se lancer : « SyntaxError: unterminated string literal (detected at line 1) ».
      ```python
      print("Bonjour)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Fermer la chaîne : `print(\"Bonjour\")`", correct: true}
      - {text: "Retirer la parenthèse : `print(\"Bonjour`", correct: false}
      - {text: "Doubler le guillemet : `print(\"\"Bonjour)`", correct: false}
      - {text: "Ajouter un point-virgule : `print(\"Bonjour);`", correct: false}
    answer: |-
      ```python
      print("Bonjour")
      ```
      La chaîne ouverte par `"` n'est jamais fermée : Python atteint la fin de la ligne sans trouver le guillemet.
  - key: bug-main-jamais-appelee
    format: bug-fix
    question: |-
      Un développeur Java écrit ce script, qui se termine sans rien afficher :
      ```python
      def main():
          print("Bonjour")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `main()` à la fin du fichier", correct: true}
      - {text: "Renommer la fonction en `__main__`", correct: false}
      - {text: "Ajouter `return` à la fin de `main`", correct: false}
      - {text: "Déclarer la fonction `public static`", correct: false}
    answer: |-
      ```python
      def main():
          print("Bonjour")


      if __name__ == "__main__":
          main()
      ```
      `def` ne fait que définir la fonction : Python n'appelle jamais `main` de lui-même. La garde
      `if __name__ == "__main__":` l'appelle quand le fichier est lancé comme script.
