notion: f-strings
lesson: |-
  Une **f-string** (préfixe `f`) insère des expressions dans une chaîne : chaque `{...}` est évalué au moment où la
  ligne s'exécute, puis converti en texte.

  ```python
  nom, prix = "Ada", 1234.5
  f"Bonjour {nom} !"             # 'Bonjour Ada !'
  f"{prix * 2}"                  # n'importe quelle expression : '2469.0'
  f"{nom.upper()}"               # 'ADA'
  ```

  **Le format**, après un deux-points : `{valeur:spécification}`.

  | Spécification | Exemple | Résultat |
  |---|---|---|
  | décimales | `f"{3.14159:.2f}"` | `'3.14'` |
  | séparateur de milliers | `f"{1234567:,}"`, `f"{1234567:_}"` | `'1,234,567'`, `'1_234_567'` |
  | pourcentage | `f"{0.256:.1%}"` | `'25.6%'` |
  | largeur et alignement | `f"{nom:>6}"`, `f"{nom:<6}"`, `f"{nom:^7}"` | `'   Ada'`, `'Ada   '`, `'  Ada  '` |
  | zéros devant | `f"{7:03d}"` | `'007'` |
  | hexadécimal, binaire | `f"{255:x}"`, `f"{5:b}"` | `'ff'`, `'101'` |
  | date | `f"{date:%d/%m/%Y}"` | `'14/07/2026'` |

  Sans alignement précisé, les nombres sont alignés à droite et les chaînes à gauche. `.2` sans `f` compte les
  chiffres **significatifs** : `f"{3.14159:.2}"` donne `'3.1'`. La spécification peut elle-même contenir une
  expression : `f"{x:{largeur}}"`.

  **Les conversions** : `!r` utilise `repr` (une chaîne s'affiche avec ses apostrophes), `!s` utilise `str`.

  **Le `=` de débogage** (Python 3.8) affiche l'expression, puis sa valeur : `f"{total=}"` donne `'total=42'`, et
  `f"{x + 1 = }"` donne `'x + 1 = 6'`.

  **Les accolades littérales** se doublent : `f"{{clé}}"` donne `'{clé}'`. Depuis Python 3.12, une expression peut
  réutiliser les guillemets de la f-string (`f"{d["nom"]}"`) et s'étendre sur plusieurs lignes.

  **Quand ne pas les utiliser**

  - Pour une **requête SQL** : une valeur insérée telle quelle ouvre la porte à l'injection SQL. On passe les valeurs
    en paramètres au pilote.
  - Pour un **message de log** : `log.info("client %s", client)` ne formate le message que s'il est émis.
  - Python 3.14 ajoute les **t-strings** (`t"..."`, PEP 750) : la même syntaxe, mais un objet `Template` qui garde
    les valeurs à part, pour qu'une bibliothèque les échappe avant de produire du SQL ou du HTML.

  **En entretien** : « Une f-string évalue les expressions entre accolades à l'exécution, et accepte après le
  deux-points le mini-langage de format : décimales, alignement, séparateurs. `!r` passe par `repr`, et `{x=}` affiche
  le nom et la valeur pour déboguer. On ne s'en sert pas pour construire du SQL. »
tour:
  - title: Les f-strings
    text: |-
      Le préfixe `f` permet d'écrire des expressions entre accolades dans une chaîne. Après un deux-points vient le
      format : `.2f` pour deux décimales, `,` pour séparer les milliers, `%` pour un pourcentage, `>6` pour aligner à
      droite sur six caractères.

      `!r` affiche la représentation d'une valeur (une chaîne, avec ses apostrophes), et `=` affiche l'expression puis
      sa valeur : pratique pour déboguer. Pour une accolade littérale, on la double.

      Essaie : remplace `.2f` par `.0f`, puis `>6` par `*^9`.
    example:
      files:
        main.py: |-
          nom = "Ada"
          prix = 1234.5
          taux = 0.075

          print(f"Bonjour {nom} !")
          print(f"{prix:.2f} €", f"{prix:,.2f}", f"{taux:.1%}")
          print(f"[{nom:>6}]", f"[{nom:<6}]", f"[{nom:^7}]")
          print(f"{nom!r}", f"{prix * 2 = }")
          print(f"{{accolades}}")
      output: |-
        Bonjour Ada !
        1234.50 € 1,234.50 7.5%
        [   Ada] [Ada   ] [  Ada  ]
        'Ada' prix * 2 = 2469.0
        {accolades}
cards:
  - key: contenu-accolades
    format: course
    question: Que peut-on mettre entre les accolades d'une f-string ?
    choices:
      - {text: "N'importe quelle expression, évaluée à l'exécution", correct: true}
      - {text: "Seulement un nom de variable, sans opérateur", correct: false}
      - {text: "Un numéro d'argument, comme `{0}` ou `{1}`", correct: false}
      - {text: "Une constante connue à la compilation du fichier", correct: false}
    answer: "`f\"{prix * 1.2:.2f}\"`, `f\"{nom.upper()}\"`, `f\"{len(liste)}\"` : toute expression. Les numéros d'argument appartiennent à `str.format`."
  - key: egal-debogage
    format: course
    question: "Que fait le `=` dans `f\"{total=}\"` ?"
    choices:
      - {text: "Il affiche le texte de l'expression, puis sa valeur : `total=42`", correct: true}
      - {text: "Il affecte la valeur de la chaîne à la variable `total`", correct: false}
      - {text: "Il compare `total` à la chaîne vide, et affiche le résultat", correct: false}
      - {text: "Il aligne la valeur de `total` à gauche du champ", correct: false}
    answer: "Le spécificateur `=` (Python 3.8) sert au débogage. Les espaces sont gardées : `f\"{x + 1 = }\"` donne `x + 1 = 6`."
  - key: accolade-litterale
    format: course
    question: Comment affiche-t-on une accolade littérale dans une f-string ?
    choices:
      - {text: "En la doublant : `{{` ou `}}`", correct: true}
      - {text: "En la précédant d'un antislash", correct: false}
      - {text: "En l'entourant d'apostrophes", correct: false}
      - {text: "Impossible : il faut une concaténation", correct: false}
    answer: "`f\"{{id}} vaut {n}\"` donne `{id} vaut 3`. Même règle pour `str.format`."
  - key: pas-pour-sql
    format: course
    question: Pourquoi ne construit-on pas une requête SQL avec une f-string ?
    choices:
      - {text: "Une valeur insérée telle quelle permet une injection SQL", correct: true}
      - {text: "Les f-strings ne savent pas insérer de guillemets simples", correct: false}
      - {text: "Les pilotes SQL refusent les chaînes créées par une f-string", correct: false}
      - {text: "Les f-strings sont trop lentes pour des requêtes fréquentes", correct: false}
    answer: "Un nom comme `x' OR '1'='1` changerait la requête. On passe les valeurs en paramètres : `cur.execute(\"SELECT ... WHERE nom = ?\", (nom,))`."
  - key: vf-guillemets-reutilises
    format: true-false
    question: |-
      Depuis Python 3.12, une f-string peut réutiliser ses propres guillemets dans une expression : `f"{d["nom"]}"`.
    truth: true
    answer: |-
      La PEP 701 a fait des f-strings une vraie partie de la grammaire. Avant 3.12, il fallait alterner les guillemets :
      `f"{d['nom']}"`.
  - key: vf-deux-decimales
    format: true-false
    question: "`f\"{3.14159:.2f}\"` vaut `\"3.14\"`."
    truth: true
    answer: "`.2f` : deux chiffres après la virgule, en notation à virgule fixe. Sans le `f`, `.2` compterait deux chiffres significatifs (`3.1`)."
  - key: vf-evaluee-une-fois
    format: true-false
    question: Une f-string écrite dans une fonction est évaluée une seule fois, au chargement du module.
    truth: false
    answer: "Elle est évaluée à chaque exécution de la ligne, avec les valeurs du moment : c'est une expression, pas une constante."
  - key: vf-conversion-r
    format: true-false
    question: "`f\"{nom!r}\"` affiche la représentation `repr` de `nom` : une chaîne apparaît avec ses apostrophes."
    truth: true
    answer: "Pratique pour voir une chaîne vide ou des espaces : `f\"{''!r}\"` affiche `''`."
  - key: qcm-milliers
    format: multiple-choice
    question: Quel format affiche `1234567` sous la forme `1,234,567` ?
    choices:
      - {text: "`f\"{n:,}\"`", correct: true}
      - {text: "`f\"{n:_}\"`", correct: false}
      - {text: "`f\"{n:.3}\"`", correct: false}
      - {text: "`f\"{n:%}\"`", correct: false}
    answer: "`,` sépare les milliers par des virgules ; `_` par des soulignés (`1_234_567`). Pour des espaces : `f\"{n:,}\".replace(\",\", \" \")`."
  - key: qcm-aligner-droite
    format: multiple-choice
    question: Quel format aligne un nom à droite, sur 10 caractères ?
    choices:
      - {text: "`f\"{nom:>10}\"`", correct: true}
      - {text: "`f\"{nom:<10}\"`", correct: false}
      - {text: "`f\"{nom:10}\"`", correct: false}
      - {text: "`f\"{nom:^10}\"`", correct: false}
    answer: "`>` à droite, `<` à gauche, `^` au centre. Sans indication, une chaîne est alignée à gauche, un nombre à droite."
  - key: qcm-pourcentage
    format: multiple-choice
    question: "Que donne `f\"{0.256:.1%}\"` ?"
    choices:
      - {text: "`'25.6%'`", correct: true}
      - {text: "`'0.3%'`", correct: false}
      - {text: "`'0.256%'`", correct: false}
      - {text: "`'26%'`", correct: false}
    answer: "`%` multiplie par 100 et ajoute le signe ; `.1` garde une décimale."
  - key: qcm-t-strings
    format: multiple-choice
    question: Quel préfixe, ajouté en Python 3.14, crée une chaîne modèle (t-string) qui n'est pas une `str` ?
    choices:
      - {text: "`t`", correct: true}
      - {text: "`f`", correct: false}
      - {text: "`r`", correct: false}
      - {text: "`b`", correct: false}
    answer: "`t\"Bonjour {nom}\"` (PEP 750) produit un objet `Template`, qui garde le texte et les valeurs séparés : une bibliothèque peut alors échapper les valeurs avant de produire du HTML ou du SQL."
  - key: trous-prefixe-f
    format: fill-in
    question: |-
      Complète pour insérer `nom` dans la chaîne :
      ```python
      message = ___"Bonjour {nom}"
      ```
    blanks: [[f, F]]
    answer: "Le préfixe `f` (ou `F`) fait d'un littéral une f-string."
  - key: trous-deux-decimales
    format: fill-in
    question: |-
      Complète pour afficher `prix` avec deux décimales :
      ```python
      print(f"{prix:___}")
      ```
    blanks: [[".2f"]]
    answer: "`.2f` : deux chiffres après la virgule."
  - key: trous-egal
    format: fill-in
    question: |-
      Complète pour afficher `x=5`, le nom suivi de la valeur :
      ```python
      x = 5
      print(f"{x___}")
      ```
    blanks: [["="]]
    answer: "Le spécificateur `=` affiche l'expression, puis sa valeur."
  - key: trous-repr
    format: fill-in
    question: |-
      Complète pour afficher la représentation `repr` de `nom` :
      ```python
      print(f"{nom!___}")
      ```
    blanks: [[r]]
    answer: "`!r` appelle `repr`, `!s` appelle `str`, `!a` appelle `ascii`."
  - key: code-largeurs
    format: code-output
    question: |-
      ```python
      n = 7
      print(f"{n:03d}|{n:>3}|{n:<3}|")
      ```
    answer: "`007|  7|7  |` : zéros devant sur trois chiffres, puis aligné à droite, puis à gauche, sur trois caractères."
    check:
      output: "007|  7|7  |"
    choices:
      - {text: "`007|  7|7  |`", correct: true}
      - {text: "`7|7|7|`", correct: false}
      - {text: "`007|7  |  7|`", correct: false}
      - {text: "`  7|007|7  |`", correct: false}
  - key: code-debogage-expression
    format: code-output
    question: |-
      ```python
      x = 10
      print(f"{x * 2 = }")
      ```
    answer: "`x * 2 = 20` : le texte de l'expression, espaces comprises, puis sa valeur."
    check:
      output: "x * 2 = 20"
    choices:
      - {text: "`x * 2 = 20`", correct: true}
      - {text: "`20`", correct: false}
      - {text: "`x * 2 = x * 2`", correct: false}
      - {text: "`x=10 * 2 = 20`", correct: false}
  - key: code-repr-str
    format: code-output
    question: |-
      ```python
      mot = "abc"
      print(f"{mot!r} {mot}")
      ```
    answer: "`'abc' abc` : `!r` affiche la représentation, avec les apostrophes ; sans conversion, c'est `str`."
    check:
      output: "'abc' abc"
    choices:
      - {text: "`'abc' abc`", correct: true}
      - {text: "`abc abc`", correct: false}
      - {text: "`'abc' 'abc'`", correct: false}
      - {text: "`abc 'abc'`", correct: false}
  - key: code-accolades-doublees
    format: code-output
    question: |-
      ```python
      print(f"{{x}} {2 + 3}")
      ```
    answer: "`{x} 5` : les accolades doublées sont littérales, les simples entourent une expression."
    check:
      output: "{x} 5"
    choices:
      - {text: "`{x} 5`", correct: true}
      - {text: "`{{x}} 5`", correct: false}
      - {text: "`x 5`", correct: false}
      - {text: "`{x} {2 + 3}`", correct: false}
  - key: bug-prefixe-oublie
    format: bug-fix
    question: |-
      Ce code affiche `Bonjour {nom} !`, accolades comprises :
      ```python
      nom = "Ada"
      print("Bonjour {nom} !")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(f\"Bonjour {nom} !\")`", correct: true}
      - {text: "`print(\"Bonjour {{nom}} !\")`", correct: false}
      - {text: "`print(\"Bonjour ${nom} !\")`", correct: false}
      - {text: "`print(r\"Bonjour {nom} !\")`", correct: false}
    answer: |-
      ```python
      nom = "Ada"
      print(f"Bonjour {nom} !")
      ```
      Sans le préfixe `f`, les accolades ne sont que du texte. `${nom}` est la syntaxe de JavaScript ou du shell.
  - key: bug-chiffres-significatifs
    format: bug-fix
    question: |-
      Ce code affiche `Prix : 3.1` au lieu de `Prix : 3.14` :
      ```python
      prix = 3.14159
      print(f"Prix : {prix:.2}")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`f\"Prix : {prix:.2f}\"`", correct: true}
      - {text: "`f\"Prix : {prix:2}\"`", correct: false}
      - {text: "`f\"Prix : {prix:.3}\"`", correct: false}
      - {text: "`f\"Prix : {prix:2f}\"`", correct: false}
    answer: |-
      ```python
      prix = 3.14159
      print(f"Prix : {prix:.2f}")
      ```
      `.2` seul compte deux chiffres **significatifs** ; `.2f` en garde deux **après la virgule**. `.3` tomberait juste
      ici, mais plus pour `12.5`.
  - key: bug-format-sur-chaine
    format: bug-fix
    question: |-
      Ce script s'arrête avec « ValueError: Unknown format code 'f' for object of type 'str' » :
      ```python
      prix = "3.5"
      print(f"{prix:.2f} €")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(f\"{float(prix):.2f} €\")`", correct: true}
      - {text: "`print(f\"{prix!r:.2f} €\")`", correct: false}
      - {text: "`print(f\"{prix:.2s} €\")`", correct: false}
      - {text: "`print(f\"{str(prix):.2f} €\")`", correct: false}
    answer: |-
      ```python
      prix = "3.5"
      print(f"{float(prix):.2f} €")
      ```
      Le format `f` s'applique aux nombres. Une valeur lue d'un fichier ou d'une saisie est une chaîne : il faut la
      convertir d'abord.
  - key: bug-json-accolades
    format: bug-fix
    question: |-
      Pour produire `{"id": 3}`, ce script s'arrête avec « ValueError: Space not allowed in string format
      specifier » :
      ```python
      n = 3
      print(f'{"id": {n}}')
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(f'{{\"id\": {n}}}')`", correct: true}
      - {text: "`print(f'{\"id\": {{n}}}')`", correct: false}
      - {text: "`print(f'{\"id\"}: {n}')`", correct: false}
      - {text: "`print(f'\\{\"id\": {n}\\}')`", correct: false}
    answer: |-
      ```python
      n = 3
      print(f'{{"id": {n}}}')
      ```
      Python lit `{"id": {n}}` comme l'expression `"id"` suivie d'un format, ` {n}`, qui vaut ` 3` : une espace est
      refusée dans le format d'une chaîne. Les accolades littérales se doublent. Pour du vrai JSON, `json.dumps`.
