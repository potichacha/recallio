notion: lambda
lesson: |-
  Une **`lambda`** est une petite fonction anonyme, écrite en une expression :

  ```python
  lambda parametres: expression
  ```

  Son corps est **une seule expression**, dont la valeur est renvoyée, sans `return`. Pas d'instruction : ni `return`,
  ni affectation `=`, ni boucle, ni `if` en bloc. L'expression conditionnelle (`a if c else b`) est permise, comme les
  valeurs par défaut et `*args`.

  **Son usage naturel : un argument court**, là où une fonction attend une fonction.

  ```python
  mots = ["kiwi", "pomme", "fig", "banane"]
  sorted(mots, key=lambda mot: len(mot))          # ['fig', 'kiwi', 'pomme', 'banane']
  max(produits, key=lambda p: p.prix)
  list(filter(lambda n: n % 2 == 0, nombres))
  ```

  **Les règles de style**

  - PEP 8 déconseille `carre = lambda x: x * x` (règle E731) : un `def` fait la même chose, avec un vrai nom dans les
    messages d'erreur, au lieu de `<lambda>`.
  - Souvent, une fonction existante suffit : `key=len`, `key=str.lower`, `operator.itemgetter(1)`,
    `operator.attrgetter("prix")`.
  - Si la `lambda` ne tient plus sur une ligne lisible, c'est un `def`.

  **Le piège de la liaison tardive** : une `lambda` lit ses variables libres **au moment où elle est appelée**, pas
  quand elle est créée.

  ```python
  fonctions = [lambda: i for i in range(3)]
  [f() for f in fonctions]           # [2, 2, 2]
  fonctions = [lambda i=i: i for i in range(3)]
  [f() for f in fonctions]           # [0, 1, 2] : la valeur par défaut fige i
  ```

  **En entretien** : « Une `lambda` est une fonction anonyme d'une seule expression, sans `return`. On s'en sert pour
  un argument court, comme le `key` de `sorted` ; pour une fonction nommée, on écrit un `def`. Attention à la liaison
  tardive dans une boucle. »
tour:
  - title: "Les fonctions lambda"
    text: |-
      `lambda x: expression` crée une petite fonction anonyme. Son corps est une seule expression, renvoyée sans
      `return`.

      On s'en sert surtout comme argument : la fonction `key` de `sorted`, `max` ou `min` dit sur quoi comparer.

      Essaie : trie les mots par leur dernière lettre, avec `key=lambda mot: mot[-1]`.
    example:
      files:
        main.py: |-
          mots = ["kiwi", "pomme", "fig", "banane"]

          print(sorted(mots, key=lambda mot: len(mot)))
          print(max(mots, key=lambda mot: mot[-1]))

          print((lambda x, y: x + y)(2, 3))

          print(list(map(lambda x: x * 10, [1, 2, 3])))
      output: |-
        ['fig', 'kiwi', 'pomme', 'banane']
        kiwi
        5
        [10, 20, 30]
cards:
  - key: corps-lambda
    format: course
    question: Que peut contenir le corps d'une `lambda` ?
    choices:
      - {text: "Une seule expression, dont la valeur est renvoyée", correct: true}
      - {text: "Plusieurs instructions séparées par des points-virgules", correct: false}
      - {text: "Une instruction `return` suivie d'une expression", correct: false}
      - {text: "Un bloc indenté, comme le corps d'un `def`", correct: false}
    answer: "Une `lambda` est une expression qui contient une expression : pas de place pour une instruction. Pour plus, on écrit un `def`."
  - key: pep8-lambda-nommee
    format: course
    question: "Pourquoi PEP 8 déconseille-t-il `carre = lambda x: x * x` ?"
    choices:
      - {text: "Un `def` fait pareil, avec un vrai nom dans les erreurs", correct: true}
      - {text: "Une `lambda` affectée à un nom s'appelle plus lentement", correct: false}
      - {text: "Une `lambda` ne peut pas être rangée dans une variable", correct: false}
      - {text: "Une `lambda` nommée est réévaluée à chaque appel", correct: false}
    answer: "Le seul avantage d'une `lambda` est d'être anonyme et en ligne. Nommée, elle perd cet avantage, et s'appelle `<lambda>` dans la pile d'appels."
  - key: usage-lambda
    format: course
    question: Où une `lambda` est-elle la plus utile ?
    choices:
      - {text: "Comme argument court, par exemple le `key` de `sorted`", correct: true}
      - {text: "Pour écrire une fonction récursive plus rapide", correct: false}
      - {text: "Pour remplacer une méthode de classe complexe", correct: false}
      - {text: "Pour définir une fonction réutilisée dans tout le code", correct: false}
    answer: "Une fonction jetable, passée là où on l'utilise : `key`, `filter`, un rappel (callback) simple."
  - key: nom-lambda
    format: course
    question: Quel nom porte une `lambda` dans une pile d'appels ou un message d'erreur ?
    choices:
      - {text: "`<lambda>`", correct: true}
      - {text: "Le nom de la variable qui la contient", correct: false}
      - {text: "`anonymous`", correct: false}
      - {text: "`<function>`", correct: false}
    answer: "Toutes les `lambda` s'appellent `<lambda>` (`f.__name__`), même rangées dans une variable : c'est une raison de préférer `def` pour une fonction nommée."
  - key: vf-ternaire-dans-lambda
    format: true-false
    question: Une `lambda` peut contenir une expression conditionnelle `a if c else b`.
    truth: true
    answer: "C'est une expression : `lambda n: \"pair\" if n % 2 == 0 else \"impair\"` est valide."
  - key: vf-affectation-lambda
    format: true-false
    question: Une `lambda` peut contenir une affectation `x = 1`.
    truth: false
    answer: "L'affectation est une instruction, interdite dans une `lambda`. (Le morse `:=` y est permis entre parenthèses, mais rarement une bonne idée.)"
  - key: vf-defaut-lambda
    format: true-false
    question: Une `lambda` peut avoir des paramètres avec une valeur par défaut.
    truth: true
    answer: "`lambda x, n=2: x ** n` est valide, comme `lambda *args: len(args)`."
  - key: vf-execution-definition
    format: true-false
    question: Une `lambda` exécute son expression au moment où elle est définie.
    truth: false
    answer: "Comme un `def`, elle crée une fonction ; l'expression n'est évaluée qu'à chaque appel. D'où la liaison tardive des variables qu'elle lit."
  - key: qcm-trier-age
    format: multiple-choice
    question: "Comment trier `personnes`, des tuples `(nom, age)`, par âge ?"
    choices:
      - {text: "`sorted(personnes, key=lambda p: p[1])`", correct: true}
      - {text: "`sorted(personnes, key=lambda p: p[0])`", correct: false}
      - {text: "`sorted(personnes, lambda p: p[1])`", correct: false}
      - {text: "`sorted(personnes, key=p[1])`", correct: false}
    answer: "`key` reçoit une fonction, appelée sur chaque élément. Elle doit être nommée : `sorted` n'accepte qu'un argument positionnel. `p[0]` trierait par nom."
  - key: qcm-lambda-valide
    format: multiple-choice
    question: Quelle `lambda` est valide en Python 3 ?
    choices:
      - {text: "`lambda x, y: x + y`", correct: true}
      - {text: "`lambda x, y: return x + y`", correct: false}
      - {text: "`lambda (x, y): x + y`", correct: false}
      - {text: "`lambda x, y => x + y`", correct: false}
    answer: "Pas de `return`, pas de parenthèses autour des paramètres (c'était permis en Python 2), pas de flèche : les deux-points séparent paramètres et expression."
  - key: qcm-liaison-tardive
    format: multiple-choice
    question: "Que vaut `[f() for f in [lambda: i for i in range(3)]]` ?"
    choices:
      - {text: "`[2, 2, 2]`", correct: true}
      - {text: "`[0, 1, 2]`", correct: false}
      - {text: "`[3, 3, 3]`", correct: false}
      - {text: "`[0, 0, 0]`", correct: false}
    answer: "Les trois `lambda` lisent la même variable `i` au moment de l'appel, quand elle vaut 2. `lambda i=i: i` figerait chaque valeur."
  - key: qcm-sans-lambda
    format: multiple-choice
    question: "Quelle écriture remplace `key=lambda m: m.lower()` sans `lambda` ?"
    choices:
      - {text: "`key=str.lower`", correct: true}
      - {text: "`key=lower`", correct: false}
      - {text: "`key=str.lower()`", correct: false}
      - {text: "`key=\"lower\"`", correct: false}
    answer: "`str.lower` est une fonction qui prend une chaîne : on la passe sans l'appeler. `str.lower()` l'appellerait sans argument, et lèverait une `TypeError`."
  - key: trous-trier-longueur
    format: fill-in
    question: |-
      Complète pour trier les mots par longueur :
      ```python
      sorted(mots, key=___ m: len(m))
      ```
    blanks: [[lambda]]
    answer: "`lambda m: len(m)`, ou plus simplement `key=len`."
  - key: trous-plus-cher-d-abord
    format: fill-in
    question: |-
      Complète pour trier les produits du plus cher au moins cher :
      ```python
      sorted(produits, key=lambda p: p.prix, ___=True)
      ```
    blanks: [[reverse]]
    answer: "`reverse=True` inverse l'ordre ; `key` dit sur quoi comparer."
  - key: trous-parite
    format: fill-in
    question: |-
      Complète la `lambda` qui renvoie « pair » ou « impair » :
      ```python
      parites = map(lambda n: "pair" ___ n % 2 == 0 ___ "impair", nombres)
      ```
    blanks: [[if], [else]]
    answer: "L'expression conditionnelle est permise dans une `lambda`, puisque c'est une expression."
  - key: trous-figer-i
    format: fill-in
    question: |-
      Complète pour figer la valeur de `i` dans chaque `lambda` :
      ```python
      fonctions = [lambda ___=i: i * 10 for i in range(3)]
      ```
    blanks: [[i]]
    answer: "La valeur par défaut est évaluée à la création de chaque `lambda` : chacune garde son propre `i`."
  - key: code-appel-immediat
    format: code-output
    question: |-
      ```python
      print((lambda x, y=2: x ** y)(3))
      ```
    check:
      output: "9"
    choices:
      - {text: "`9`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`8`", correct: false}
      - {text: "`5`", correct: false}
    answer: "La `lambda` est appelée aussitôt avec `x = 3` ; `y` garde sa valeur par défaut : 3² = 9."
  - key: code-trier-derniere-lettre
    format: code-output
    question: |-
      ```python
      mots = ["kiwi", "pomme", "fig"]
      print(sorted(mots, key=lambda m: m[-1]))
      ```
    check:
      output: "['pomme', 'fig', 'kiwi']"
    choices:
      - {text: "`['pomme', 'fig', 'kiwi']`", correct: true}
      - {text: "`['fig', 'kiwi', 'pomme']`", correct: false}
      - {text: "`['kiwi', 'fig', 'pomme']`", correct: false}
      - {text: "`['pomme', 'kiwi', 'fig']`", correct: false}
    answer: "Les dernières lettres sont i, e, g : triées, e, g, i, donc pomme, fig, kiwi."
  - key: code-defaut-figee
    format: code-output
    question: |-
      ```python
      fonctions = [lambda i=i: i * 10 for i in range(3)]
      print([f() for f in fonctions])
      ```
    check:
      output: "[0, 10, 20]"
    choices:
      - {text: "`[0, 10, 20]`", correct: true}
      - {text: "`[20, 20, 20]`", correct: false}
      - {text: "`[0, 1, 2]`", correct: false}
      - {text: "`[30, 30, 30]`", correct: false}
    answer: "Chaque `lambda` a reçu la valeur de `i` de son tour comme valeur par défaut : pas de liaison tardive."
  - key: code-nom-et-none
    format: code-output
    question: |-
      ```python
      f = lambda: None
      print(f.__name__, f())
      ```
    check:
      output: "<lambda> None"
    choices:
      - {text: "`<lambda> None`", correct: true}
      - {text: "`f None`", correct: false}
      - {text: "`<lambda>`", correct: false}
      - {text: "`anonymous None`", correct: false}
    answer: "Une `lambda` s'appelle toujours `<lambda>`, même rangée dans `f`. Elle renvoie la valeur de son expression : ici `None`."
  - key: bug-return-dans-lambda
    format: bug-fix
    question: |-
      Python répond « SyntaxError: invalid syntax » sur le `return`. Quelle correction est la bonne ?
      ```python
      personnes = [("Ada", 36), ("Linus", 54)]
      plus_jeune = min(personnes, key=lambda p: return p[1])
      ```
    choices:
      - {text: "`key=lambda p: p[1]`", correct: true}
      - {text: "`key=lambda p: (return p[1])`", correct: false}
      - {text: "`key=lambda p: {return p[1]}`", correct: false}
      - {text: "`key=lambda: return p[1]`", correct: false}
    answer: |-
      ```python
      plus_jeune = min(personnes, key=lambda p: p[1])
      ```
      Une `lambda` renvoie la valeur de son expression : `return` est une instruction, interdite dans son corps.
  - key: bug-liaison-tardive
    format: bug-fix
    question: |-
      Ce code affiche « clic sur fermer » alors qu'on appelle le premier bouton. Quelle correction est la bonne ?
      ```python
      boutons = []
      for nom in ["ouvrir", "fermer"]:
          boutons.append(lambda: print("clic sur", nom))

      boutons[0]()
      ```
    choices:
      - {text: "`lambda nom=nom: print(\"clic sur\", nom)`", correct: true}
      - {text: "`lambda: print(\"clic sur\", nom[:])`", correct: false}
      - {text: "`lambda: print(\"clic sur\", str(nom))`", correct: false}
      - {text: "`lambda nom: print(\"clic sur\", nom)`", correct: false}
    answer: |-
      ```python
      for nom in ["ouvrir", "fermer"]:
          boutons.append(lambda nom=nom: print("clic sur", nom))
      ```
      La `lambda` lit `nom` à l'appel, quand la boucle est finie. La valeur par défaut fige la valeur de chaque tour. Sans valeur par défaut, `boutons[0]()` manquerait d'argument.
  - key: bug-methode-non-appelee
    format: bug-fix
    question: |-
      Python répond « TypeError: '<' not supported between instances of 'builtin_function_or_method' and 'builtin_function_or_method' ». Quelle correction est la bonne ?
      ```python
      mots = ["Kiwi", "pomme"]
      print(sorted(mots, key=lambda m: m.lower))
      ```
    choices:
      - {text: "`key=lambda m: m.lower()`", correct: true}
      - {text: "`key=lambda m: lower(m)`", correct: false}
      - {text: "`key=lambda: m.lower()`", correct: false}
      - {text: "`key=lambda m: str(m.lower)`", correct: false}
    answer: |-
      ```python
      print(sorted(mots, key=lambda m: m.lower()))
      # ou : sorted(mots, key=str.lower)
      ```
      Sans parenthèses, la `lambda` renvoie la méthode elle-même, et `sorted` tente de comparer des méthodes.
  - key: bug-deux-instructions
    format: bug-fix
    question: |-
      Python répond « SyntaxError: 'return' outside function ». Quelle correction est la bonne ?
      ```python
      journaliser = lambda message: print(message); return len(message)
      ```
    choices:
      - {text: "Écrire un `def` avec deux lignes : `print`, puis `return`", correct: true}
      - {text: "Entourer le corps de parenthèses après les deux-points", correct: false}
      - {text: "Remplacer le point-virgule par une virgule dans le corps", correct: false}
      - {text: "Remplacer `return` par `yield` dans le corps de la `lambda`", correct: false}
    answer: |-
      ```python
      def journaliser(message):
          print(message)
          return len(message)
      ```
      La `lambda` s'arrête au point-virgule : le `return` qui suit est une instruction à part, hors de toute fonction. Deux instructions demandent un `def`.
