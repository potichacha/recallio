notion: typage-dynamique
lesson: |-
  Le typage de Python est **dynamique** et **fort**.

  **Dynamique** : le type est porté par l'**objet**, pas par le nom. Il est vérifié à l'**exécution**, au moment d'une
  opération ; un même nom peut désigner un entier, puis une chaîne.

  **Fort** : Python ne convertit pas en silence entre des types sans rapport. `"3" + 3` lève une `TypeError`, là où
  JavaScript donnerait `"33"`. Seules quelques conversions numériques naturelles se font seules : `1 + 2.5` donne le
  flottant `3.5`, et `True` vaut `1` (`bool` est une sous-classe d'`int`).

  | | Statique | Dynamique |
  |---|---|---|
  | **Fort** | Java, Rust | **Python**, Ruby |
  | **Faible** | C | JavaScript, PHP |

  **Connaître le type d'un objet**

  ```python
  type(42)                       # <class 'int'>
  type("a").__name__             # 'str'
  isinstance(42, int)            # True
  isinstance(True, int)          # True : bool hérite d'int
  isinstance(x, (int, float))    # un tuple de types : l'un ou l'autre
  ```

  On préfère `isinstance` à `type(x) == int`, qui refuse les sous-classes. Mieux encore, souvent : ne pas tester le
  type du tout. C'est le **duck typing** : un objet convient s'il sait faire ce qu'on lui demande (« s'il marche comme
  un canard et cancane comme un canard... »).

  **Les annotations de type** (`age: int = 30`, `def f(x: str) -> int:`) documentent le type attendu. L'interpréteur
  ne les vérifie **pas** : `age: int = "trente"` s'exécute sans broncher. Ce sont des outils comme **mypy** ou
  **pyright** qui les contrôlent, avant l'exécution.

  | Erreur | Exemple |
  |---|---|
  | `TypeError: can only concatenate str (not "int") to str` | `"Âge : " + 30` |
  | `TypeError: unsupported operand type(s) for +: 'int' and 'str'` | `sum(["1", "2"])` |
  | `TypeError: can't multiply sequence by non-int of type 'str'` | `"3" * "2"` |

  **En entretien** : « Python est dynamiquement typé : les types sont portés par les objets et vérifiés à l'exécution.
  Il est fortement typé : pas de conversion implicite entre une chaîne et un nombre. On teste un type avec
  `isinstance`, et les annotations, ignorées par l'interpréteur, sont vérifiées par mypy. »
tour:
  - title: Des types dynamiques, mais forts
    text: |-
      Python ne demande aucun type : `x` désigne un entier, puis une chaîne. `type()` donne la classe d'un objet, et
      `isinstance()` teste son appartenance à un type (sous-classes comprises : `True` est un `int`).

      Mais Python ne mélange pas les types en silence : un entier et un flottant s'additionnent, une chaîne et un
      entier non. Il faut convertir soi-même, avec `int()` ou `str()`.

      Essaie : ajoute à la fin `print("3" + 3)`, et lis le message de la `TypeError`.
    example:
      files:
        main.py: |-
          x = 42
          print(type(x))
          x = "quarante-deux"
          print(type(x))

          print(isinstance(x, str), isinstance(True, int))
          print(3 + 0.5)
          print("3" * 3)
          print(int("3") + 3)
      output: |-
        <class 'int'>
        <class 'str'>
        True True
        3.5
        333
        6
cards:
  - key: typage-fort
    format: course
    question: Que signifie que le typage de Python est **fort** ?
    choices:
      - {text: "Python ne convertit pas en silence entre types sans rapport : `\"3\" + 3` échoue", correct: true}
      - {text: "Chaque variable a un type déclaré, qui ne peut plus changer ensuite", correct: false}
      - {text: "Les types sont tous vérifiés avant l'exécution, par le compilateur", correct: false}
      - {text: "Python convertit chaque valeur dans le type qu'attend l'opération", correct: false}
    answer: "Fort s'oppose à faible : pas de coercition implicite entre une chaîne et un nombre. Dynamique s'oppose à statique : les types sont vérifiés à l'exécution."
  - key: type-de-flottant
    format: course
    question: Que renvoie `type(3.0)` ?
    choices:
      - {text: "La classe `float`", correct: true}
      - {text: "La chaîne `'float'`", correct: false}
      - {text: "La classe `int`, car 3.0 est entier", correct: false}
      - {text: "La classe `decimal.Decimal`", correct: false}
    answer: "`type` renvoie la classe de l'objet, affichée `<class 'float'>`. Son nom, en chaîne, est `type(3.0).__name__`."
  - key: isinstance-ou-type
    format: course
    question: Pourquoi préférer `isinstance(x, int)` à `type(x) == int` ?
    choices:
      - {text: "`isinstance` accepte aussi les sous-classes, et un tuple de types", correct: true}
      - {text: "`type` est déprécié depuis Python 3, et sera bientôt retiré", correct: false}
      - {text: "`isinstance` est vérifié à la compilation, `type` à l'exécution", correct: false}
      - {text: "`type(x) == int` lève une exception quand `x` est une chaîne", correct: false}
    answer: "Une sous-classe doit pouvoir remplacer sa classe mère : `isinstance` le respecte. `type(x) == int` refuse aussi `True`, d'une sous-classe d'`int`."
  - key: annotation-non-verifiee
    format: course
    question: "Que fait l'interpréteur de l'annotation dans `age: int = \"trente\"` ?"
    choices:
      - {text: "Rien : il ne vérifie pas les annotations à l'exécution", correct: true}
      - {text: "Il lève une `TypeError` au moment de l'affectation", correct: false}
      - {text: "Il convertit `\"trente\"` en entier, ce qui échoue", correct: false}
      - {text: "Il refuse de compiler le fichier qui contient la ligne", correct: false}
    answer: "Les annotations sont de la documentation lisible par les outils. mypy ou pyright signaleraient l'erreur, avant l'exécution."
  - key: vf-nom-change-type
    format: true-false
    question: En Python, un même nom peut désigner un entier, puis une chaîne.
    truth: true
    answer: "Le nom n'a pas de type ; il désigne un objet, qui en a un. Les outils de typage le signalent si on l'a annoté."
  - key: vf-concatenation-js
    format: true-false
    question: "`\"3\" + 3` vaut `\"33\"` en Python, comme en JavaScript."
    truth: false
    answer: "C'est une `TypeError` : « can only concatenate str (not \"int\") to str ». Il faut convertir : `\"3\" + str(3)` ou `int(\"3\") + 3`."
  - key: vf-bool-int
    format: true-false
    question: "`isinstance(True, int)` vaut `True`."
    truth: true
    answer: "`bool` est une sous-classe d'`int` : `True` vaut 1 et `False` vaut 0, d'où `True + True == 2`."
  - key: vf-annotations-verifiees
    format: true-false
    question: L'interpréteur vérifie les annotations de type à chaque appel de fonction.
    truth: false
    answer: "Il les garde (dans `__annotations__`), mais ne les vérifie pas. C'est le rôle des vérificateurs statiques, comme mypy."
  - key: qcm-typeerror
    format: multiple-choice
    question: Quelle expression lève une `TypeError` ?
    choices:
      - {text: "`\"3\" + 3`", correct: true}
      - {text: "`\"3\" * 3`", correct: false}
      - {text: "`3 + 0.5`", correct: false}
      - {text: "`True + 1`", correct: false}
    answer: "`\"3\" * 3` répète la chaîne (`\"333\"`), `3 + 0.5` donne `3.5`, `True + 1` donne `2`. Seule l'addition d'une chaîne et d'un entier n'a pas de sens."
  - key: qcm-int-ou-float
    format: multiple-choice
    question: Comment tester qu'une valeur est un entier ou un flottant ?
    choices:
      - {text: "`isinstance(x, (int, float))`", correct: true}
      - {text: "`isinstance(x, int or float)`", correct: false}
      - {text: "`type(x) in \"int float\"`", correct: false}
      - {text: "`x.type == number`", correct: false}
    answer: "`isinstance` accepte un tuple de types. `int or float` vaut simplement `int` : le flottant serait refusé."
  - key: qcm-int-plus-float
    format: multiple-choice
    question: Que vaut `1 + 2.0` ?
    choices:
      - {text: "`3.0`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`\"12.0\"`", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "Entre nombres, Python élargit : un `int` et un `float` donnent un `float`. Ce n'est pas une conversion entre types sans rapport."
  - key: qcm-mypy
    format: multiple-choice
    question: Que vérifie mypy, que l'interpréteur ne vérifie pas ?
    choices:
      - {text: "Les annotations de type, sans exécuter le programme", correct: true}
      - {text: "Le style du code, d'après les règles de PEP 8", correct: false}
      - {text: "Les failles de sécurité des dépendances installées", correct: false}
      - {text: "La couverture du code par les tests unitaires", correct: false}
    answer: "mypy (comme pyright) analyse le code et ses annotations, et signale les incohérences de types avant l'exécution."
  - key: code-noms-de-types
    format: code-output
    question: |-
      ```python
      print(type(7).__name__, type("7").__name__)
      ```
    answer: "`int str` : `__name__` donne le nom de la classe, sans le `<class ...>`."
    check:
      output: "int str"
    choices:
      - {text: "`int str`", correct: true}
      - {text: "`int int`", correct: false}
      - {text: "`<class 'int'> <class 'str'>`", correct: false}
      - {text: "`number string`", correct: false}
  - key: code-isinstance-bool
    format: code-output
    question: |-
      ```python
      print(isinstance(True, int), type(True) == int)
      ```
    answer: "`True False` : `True` est une instance d'`int` par héritage, mais son type exact est `bool`."
    check:
      output: "True False"
    choices:
      - {text: "`True False`", correct: true}
      - {text: "`True True`", correct: false}
      - {text: "`False False`", correct: false}
      - {text: "`False True`", correct: false}
  - key: code-repetition-chaine
    format: code-output
    question: |-
      ```python
      print(3 * "ab")
      ```
    answer: "`ababab` : un entier fois une chaîne la répète. C'est défini, donc pas une conversion implicite."
    check:
      output: "ababab"
    choices:
      - {text: "`ababab`", correct: true}
      - {text: "`3ab`", correct: false}
      - {text: "`ab ab ab`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: code-bool-dans-somme
    format: code-output
    question: |-
      ```python
      print(1 + True + 0.5)
      ```
    answer: "`2.5` : `True` vaut 1, et l'ajout d'un flottant donne un flottant."
    check:
      output: "2.5"
    choices:
      - {text: "`2.5`", correct: true}
      - {text: "`1.5`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: bug-concatener-age
    format: bug-fix
    question: |-
      Ce script s'arrête avec « TypeError: can only concatenate str (not "int") to str » :
      ```python
      age = 30
      print("Âge : " + age)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(\"Âge : \" + str(age))`", correct: true}
      - {text: "`print(\"Âge : \" + int(age))`", correct: false}
      - {text: "`print(\"Âge : \" + age.str())`", correct: false}
      - {text: "`print(str(\"Âge : \") + age)`", correct: false}
    answer: |-
      ```python
      age = 30
      print("Âge : " + str(age))
      # ou : print(f"Âge : {age}")
      ```
      Python ne convertit pas l'entier en chaîne de lui-même : `str(age)` le fait, ou une f-string.
  - key: bug-type-chaine
    format: bug-fix
    question: |-
      Ce code affiche `autre chose`, alors que `valeur` est un entier :
      ```python
      valeur = 42
      if type(valeur) == "int":
          print("entier")
      else:
          print("autre chose")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if isinstance(valeur, int):`", correct: true}
      - {text: "`if type(valeur) == \"<class 'int'>\":`", correct: false}
      - {text: "`if type(valeur) is \"int\":`", correct: false}
      - {text: "`if valeur.type == int:`", correct: false}
    answer: |-
      ```python
      valeur = 42
      if isinstance(valeur, int):
          print("entier")
      else:
          print("autre chose")
      ```
      `type(valeur)` renvoie la classe `int`, pas la chaîne `"int"` : la comparaison est toujours fausse.
  - key: bug-somme-chaines
    format: bug-fix
    question: |-
      Ce script s'arrête avec « TypeError: unsupported operand type(s) for +: 'int' and 'str' » :
      ```python
      notes = ["12", "15", "9"]
      print(sum(notes))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(sum(int(n) for n in notes))`", correct: true}
      - {text: "`print(int(sum(notes)))`", correct: false}
      - {text: "`print(sum(notes, int))`", correct: false}
      - {text: "`print(str(sum(notes)))`", correct: false}
    answer: |-
      ```python
      notes = ["12", "15", "9"]
      print(sum(int(n) for n in notes))
      ```
      `sum` part de `0` et lui ajoute chaque élément : `0 + "12"` n'a pas de sens. Il faut convertir chaque note
      avant d'additionner.
  - key: bug-int-or-float
    format: bug-fix
    question: |-
      Ce code affiche `pas un nombre` pour `2.5` :
      ```python
      x = 2.5
      if isinstance(x, int or float):
          print("nombre")
      else:
          print("pas un nombre")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`isinstance(x, (int, float))`", correct: true}
      - {text: "`isinstance(x, int and float)`", correct: false}
      - {text: "`isinstance(x, [int or float])`", correct: false}
      - {text: "`isinstance(x, int | float or None)`", correct: false}
    answer: |-
      ```python
      x = 2.5
      if isinstance(x, (int, float)):
          print("nombre")
      else:
          print("pas un nombre")
      ```
      `int or float` s'évalue d'abord, et vaut `int` (un objet vrai) : le test devient `isinstance(x, int)`. Un tuple
      de types teste l'un ou l'autre (`int | float` aussi, depuis Python 3.10).
  - key: definition-typage-dynamique
    format: definition
    question: Qu'est-ce que le typage dynamique ?
    choices:
      - {text: "Les types sont portés par les objets, et vérifiés à l'exécution", correct: true}
      - {text: "Les types sont déclarés, et vérifiés avant l'exécution", correct: false}
      - {text: "Les valeurs changent de type selon l'opération qu'on leur applique", correct: false}
      - {text: "Le type d'un nom est fixé par sa première valeur, puis ne change plus", correct: false}
    answer: "Python, Ruby ou JavaScript sont dynamiques ; Java, Go ou Rust sont statiques. La force du typage (conversions implicites ou non) est une autre question."
  - key: definition-duck-typing
    format: definition
    question: Qu'est-ce que le duck typing ?
    choices:
      - {text: "Juger un objet à ce qu'il sait faire, pas à son type", correct: true}
      - {text: "Vérifier strictement le type de chaque argument reçu", correct: false}
      - {text: "Convertir un objet dans le type que l'opération attend", correct: false}
      - {text: "Imposer à toutes les classes d'hériter d'une même base", correct: false}
    answer: "« S'il marche comme un canard et cancane comme un canard, c'est un canard. » Une fonction qui parcourt son argument accepte une liste, un tuple, un fichier : tout ce qui est itérable."
  - key: definition-coercition
    format: definition
    question: Que désigne une conversion implicite (ou coercition) de types ?
    choices:
      - {text: "Le langage change seul le type d'une valeur pour faire une opération", correct: true}
      - {text: "Le développeur appelle `int()` ou `str()` pour convertir une valeur", correct: false}
      - {text: "Un outil comme mypy déduit le type d'une variable non annotée", correct: false}
      - {text: "Une classe hérite des méthodes d'une autre classe sans les réécrire", correct: false}
    answer: "JavaScript le fait beaucoup (`\"3\" + 3` donne `\"33\"`). Python presque jamais : seulement entre nombres (`int` vers `float`), d'où son typage fort."
  - key: definition-annotation-age
    format: definition
    question: "Dans `age: int = 30`, que désigne la partie `: int` ?"
    choices:
      - {text: "Une annotation : le type attendu, pour les outils et le lecteur", correct: true}
      - {text: "Une déclaration obligatoire, sans laquelle `age` n'existerait pas", correct: false}
      - {text: "Une conversion : la valeur affectée est passée par `int()`", correct: false}
      - {text: "Une contrainte que Python vérifie à chaque nouvelle affectation", correct: false}
    answer: "Une annotation de type (PEP 526). L'interpréteur la garde sans la vérifier ; mypy et l'éditeur s'en servent."
