notion: booleens
lesson: |-
  Le type `bool` a deux valeurs, **`True`** et **`False`**, avec une majuscule. C'est une sous-classe d'`int` :
  `True` vaut `1`, `False` vaut `0` (`True + True == 2`). Les comparaisons (`==`, `!=`, `<`, `>=`, `in`, `is`...)
  renvoient un `bool`.

  **Les opérateurs logiques sont des mots** : `and`, `or`, `not` (pas de `&&`, `||` ni `!`). Par ordre de priorité :
  `not`, puis `and`, puis `or` ; et `not` passe après les comparaisons (`not a == b` signifie `not (a == b)`).

  **La valeur de vérité.** Tout objet peut servir de condition. Sont **faux** (*falsy*) :

  - `False` et `None` ;
  - les zéros : `0`, `0.0`, `0j`, `Decimal(0)` ;
  - les conteneurs vides : `""`, `[]`, `()`, `{}`, `set()`, `range(0)`.

  Tout le reste est **vrai**, y compris `"0"`, `"False"`, `" "` et `[0]`. `bool(x)` donne la valeur de vérité de `x`.

  ```python
  if panier:              # au lieu de : if len(panier) > 0
      payer(panier)
  ```

  **`and` et `or` renvoient un de leurs opérandes**, pas forcément un `bool`, et s'arrêtent dès que le résultat est
  connu (évaluation en court-circuit) :

  | Expression | Renvoie |
  |---|---|
  | `a or b` | `a` s'il est vrai, sinon `b` |
  | `a and b` | `a` s'il est faux, sinon `b` |
  | `not a` | toujours un `bool` |

  ```python
  nom_affiche = nom or "anonyme"       # une valeur par défaut si nom est vide
  0 or "" or "x"                       # 'x'
  [] and 1                             # []
  ```

  **Les pièges**

  - `x == 1 or 2` se lit `(x == 1) or 2` : toujours vrai. On écrit `x in (1, 2)`.
  - `quantite or 10` remplace aussi une quantité de `0` : quand `0` est valable, on teste `quantite is None`.
  - `if actif == True:` est inutile : `if actif:`.
  - `&` et `|` existent, mais sont les opérateurs **bit à bit**, sans court-circuit.

  `all(iterable)` et `any(iterable)` disent si tous, ou au moins un, des éléments sont vrais.

  **En entretien** : « `True` et `False` sont des entiers (1 et 0). Les zéros, `None` et les conteneurs vides sont
  faux, tout le reste est vrai. `and` et `or` court-circuitent et renvoient l'un de leurs opérandes, d'où l'idiome
  `valeur or défaut`, à éviter quand 0 ou la chaîne vide sont valables. »
tour:
  - title: Vrai, faux, et tout le reste
    text: |-
      Les booléens s'écrivent `True` et `False`, et les opérateurs logiques sont des mots : `and`, `or`, `not`.

      Tout objet a une valeur de vérité : les zéros, `None` et les conteneurs vides sont faux, le reste est vrai. On
      écrit donc `if liste:` plutôt que `if len(liste) > 0:`.

      `or` renvoie son premier opérande vrai, pas forcément `True` : `nom or "anonyme"` donne une valeur par défaut.

      Essaie : ajoute `"0"` et `"False"` à la liste des valeurs. Ce sont des chaînes non vides : elles sont vraies.
    example:
      files:
        main.py: |-
          print(3 > 2, 3 == 2)
          print(True and False, True or False, not True)

          for valeur in [0, 42, "", "texte", [], [0], None]:
              print(repr(valeur), "->", bool(valeur))

          nom = ""
          print(nom or "anonyme")
      output: |-
        True False
        False True False
        0 -> False
        42 -> True
        '' -> False
        'texte' -> True
        [] -> False
        [0] -> True
        None -> False
        anonyme
cards:
  - key: valeurs-fausses
    format: course
    question: Quelles valeurs sont fausses dans un `if` ?
    choices:
      - {text: "`False`, `None`, les zéros et les conteneurs vides", correct: true}
      - {text: "Seulement `False` et `None` : `0` et `\"\"` sont vrais", correct: false}
      - {text: "`False`, `0` et la chaîne `\"False\"`, mais pas `[]`", correct: false}
      - {text: "Toute valeur qui n'est pas exactement `True`", correct: false}
    answer: "`0`, `0.0`, `\"\"`, `[]`, `()`, `{}`, `set()`, `None` et `False` sont faux ; tout le reste est vrai, y compris `\"0\"` et `[0]`."
  - key: valeur-de-or
    format: course
    question: Que renvoie `x or y` ?
    choices:
      - {text: "`x` s'il est vrai, sinon `y`", correct: true}
      - {text: "`True` si l'un est vrai, sinon `False`", correct: false}
      - {text: "`y` s'il est vrai, sinon `x`", correct: false}
      - {text: "Une `TypeError` si ce ne sont pas des `bool`", correct: false}
    answer: "`or` renvoie l'un de ses opérandes, sans le convertir : `\"\" or \"défaut\"` vaut `\"défaut\"`, `3 or 0` vaut `3`. Il n'évalue `y` que si `x` est faux."
  - key: mots-cles-logiques
    format: course
    question: Comment s'écrivent les opérateurs logiques en Python ?
    choices:
      - {text: "`and`, `or` et `not`", correct: true}
      - {text: "`&&`, `||` et `!`", correct: false}
      - {text: "`&`, `|` et `~`", correct: false}
      - {text: "`AND`, `OR` et `NOT`", correct: false}
    answer: "Des mots en minuscules. `&`, `|` et `~` existent, mais travaillent bit à bit et ne court-circuitent pas."
  - key: true-plus-true
    format: course
    question: Pourquoi `True + True` vaut-il `2` ?
    choices:
      - {text: "`bool` est une sous-classe d'`int` : `True` vaut `1`", correct: true}
      - {text: "`+` sur deux booléens est un « ou » logique, qui compte", correct: false}
      - {text: "Python convertit les booléens en chaînes, puis les compte", correct: false}
      - {text: "C'est une erreur tolérée pour garder la compatibilité", correct: false}
    answer: "`True == 1` et `False == 0`. C'est pratique pour compter : `sum(note >= 10 for note in notes)` donne le nombre de notes au-dessus de 10."
  - key: vf-chaine-false
    format: true-false
    question: "La chaîne `\"False\"` est fausse dans un `if`."
    truth: false
    answer: "Toute chaîne non vide est vraie, quel que soit son contenu. Seule `\"\"` est fausse."
  - key: vf-court-circuit
    format: true-false
    question: "`and` n'évalue pas son second opérande quand le premier est faux."
    truth: true
    answer: "Le résultat est déjà connu : c'est l'évaluation en court-circuit. `x is not None and x.valide()` ne plante donc pas quand `x` vaut `None`."
  - key: vf-liste-zero
    format: true-false
    question: "La liste `[0]`, qui contient un seul zéro, est vraie dans un `if`."
    truth: true
    answer: "Une liste est fausse seulement si elle est vide ; ce qu'elle contient n'y change rien."
  - key: vf-priorite-not
    format: true-false
    question: "`not` a une priorité plus faible que `and`."
    truth: false
    answer: "L'ordre est `not`, puis `and`, puis `or` : `not a and b` signifie `(not a) and b`. En revanche, `not` passe après les comparaisons."
  - key: qcm-zero-or
    format: multiple-choice
    question: "Que vaut `0 or \"défaut\"` ?"
    choices:
      - {text: "`\"défaut\"`", correct: true}
      - {text: "`True`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`False`", correct: false}
    answer: "`0` est faux, donc `or` renvoie son second opérande, tel quel."
  - key: qcm-valeur-vraie
    format: multiple-choice
    question: Laquelle de ces valeurs est vraie dans un `if` ?
    choices:
      - {text: "`\" \"` (une espace)", correct: true}
      - {text: "`0.0`", correct: false}
      - {text: "`[]`", correct: false}
      - {text: "`None`", correct: false}
    answer: "Une chaîne qui contient une espace n'est pas vide : elle est vraie. `0.0`, `[]` et `None` sont faux."
  - key: qcm-un-ou-deux
    format: multiple-choice
    question: Comment teste-t-on que `x` vaut 1 ou 2 ?
    choices:
      - {text: "`x in (1, 2)`", correct: true}
      - {text: "`x == 1 or 2`", correct: false}
      - {text: "`x == (1 or 2)`", correct: false}
      - {text: "`x == 1 | 2`", correct: false}
    answer: "`x == 1 or 2` vaut `2` (vrai) quand `x` n'est pas 1 ; `(1 or 2)` vaut `1` ; `1 | 2` vaut `3`. `x == 1 or x == 2` marche aussi."
  - key: qcm-liste-vide-and
    format: multiple-choice
    question: "Que vaut `[] and 1` ?"
    choices:
      - {text: "`[]`", correct: true}
      - {text: "`False`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "`None`", correct: false}
    answer: "`and` renvoie son premier opérande s'il est faux, sans évaluer le second. Ici, la liste vide elle-même."
  - key: trous-valeur-defaut
    format: fill-in
    question: |-
      Complète pour que `nom_affiche` vaille `"anonyme"` quand `nom` est vide :
      ```python
      nom_affiche = nom ___ "anonyme"
      ```
    blanks: [[or]]
    answer: "`or` renvoie `nom` s'il est vrai (non vide), sinon `\"anonyme\"`."
  - key: trous-not
    format: fill-in
    question: |-
      Complète pour payer seulement si le panier n'est pas vide :
      ```python
      if ___ panier_vide:
          payer()
      ```
    blanks: [[not]]
    answer: "`not` inverse la valeur de vérité, et renvoie toujours un `bool`."
  - key: trous-and
    format: fill-in
    question: |-
      Complète pour exiger les deux conditions :
      ```python
      if age >= 18 ___ inscrit:
          voter()
      ```
    blanks: [[and]]
    answer: "`and` : les deux doivent être vraies. Si la première est fausse, la seconde n'est pas évaluée."
  - key: trous-bool
    format: fill-in
    question: |-
      Complète pour obtenir la valeur de vérité de `x`, sous forme de booléen :
      ```python
      est_vrai = ___(x)
      ```
    blanks: [[bool]]
    answer: "`bool(x)` renvoie `True` ou `False`, selon les règles de la valeur de vérité."
  - key: code-verite-chaines
    format: code-output
    question: |-
      ```python
      print(bool("0"), bool(0), bool([0]))
      ```
    answer: "`True False True` : la chaîne `\"0\"` et la liste `[0]` ne sont pas vides ; seul l'entier `0` est faux."
    check:
      output: "True False True"
    choices:
      - {text: "`True False True`", correct: true}
      - {text: "`False False False`", correct: false}
      - {text: "`False False True`", correct: false}
      - {text: "`True False False`", correct: false}
  - key: code-or-and-operandes
    format: code-output
    question: |-
      ```python
      print(0 or "" or "x", 1 and 2)
      ```
    answer: "`x 2` : `or` renvoie le premier opérande vrai, `and` le dernier quand tous sont vrais."
    check:
      output: "x 2"
    choices:
      - {text: "`x 2`", correct: true}
      - {text: "`True True`", correct: false}
      - {text: "`x True`", correct: false}
      - {text: "`True 2`", correct: false}
  - key: code-bool-entier
    format: code-output
    question: |-
      ```python
      print(True + True, True == 1)
      ```
    answer: "`2 True` : `True` vaut l'entier `1`."
    check:
      output: "2 True"
    choices:
      - {text: "`2 True`", correct: true}
      - {text: "`True True`", correct: false}
      - {text: "`1 True`", correct: false}
      - {text: "`2 False`", correct: false}
  - key: code-not-comparaison
    format: code-output
    question: |-
      ```python
      print(not 1 == 2)
      ```
    answer: "`True` : `not` passe après `==`, donc c'est `not (1 == 2)`, soit `not False`."
    check:
      output: "True"
    choices:
      - {text: "`True`", correct: true}
      - {text: "`False`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: bug-or-toujours-vrai
    format: bug-fix
    question: |-
      Ce code affiche `choix valide` alors que `choix` vaut 5 :
      ```python
      choix = 5
      if choix == 1 or 2:
          print("choix valide")
      else:
          print("choix invalide")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if choix in (1, 2):`", correct: true}
      - {text: "`if choix == (1 or 2):`", correct: false}
      - {text: "`if choix == 1 and 2:`", correct: false}
      - {text: "`if choix == 1 | 2:`", correct: false}
    answer: |-
      ```python
      choix = 5
      if choix in (1, 2):
          print("choix valide")
      else:
          print("choix invalide")
      ```
      `choix == 1 or 2` se lit `(choix == 1) or 2` : le `2` seul est vrai, la condition l'est toujours.
  - key: bug-double-esperluette
    format: bug-fix
    question: |-
      Ce script refuse de se lancer : « SyntaxError: invalid syntax », avec un caret sous `&&`.
      ```python
      a, b = 1, 2
      if a > 0 && b > 0:
          print("deux positifs")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if a > 0 and b > 0:`", correct: true}
      - {text: "`if a > 0 & b > 0:`", correct: false}
      - {text: "`if (a > 0) && (b > 0):`", correct: false}
      - {text: "`if a > 0 AND b > 0:`", correct: false}
    answer: |-
      ```python
      a, b = 1, 2
      if a > 0 and b > 0:
          print("deux positifs")
      ```
      Python écrit les opérateurs logiques en toutes lettres. `&` est le « et » bit à bit, et sa priorité, plus forte
      que celle des comparaisons, transforme `a > 0 & b > 0` en `a > (0 & b) > 0`.
  - key: bug-or-zero
    format: bug-fix
    question: |-
      Un client commande 0 article, mais ce code en enregistre 10 :
      ```python
      quantite = 0
      quantite_commandee = quantite or 10
      print(quantite_commandee)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`quantite_commandee = 10 if quantite is None else quantite`", correct: true}
      - {text: "`quantite_commandee = quantite and 10`", correct: false}
      - {text: "`quantite_commandee = quantite or 0 or 10`", correct: false}
      - {text: "`quantite_commandee = bool(quantite) or 10`", correct: false}
    answer: |-
      ```python
      quantite = 0
      quantite_commandee = 10 if quantite is None else quantite
      print(quantite_commandee)
      ```
      `or` remplace toute valeur fausse, et `0` en est une. Quand zéro est une valeur valable, on teste l'absence de
      valeur, `None`, explicitement.
  - key: bug-and-pas-booleen
    format: bug-fix
    question: |-
      Ce code devait afficher `a un nom : False`, mais n'affiche rien après les deux-points :
      ```python
      nom = ""
      a_un_nom = nom and len(nom) > 0
      print("a un nom :", a_un_nom)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`a_un_nom = bool(nom)`", correct: true}
      - {text: "`a_un_nom = nom or len(nom) > 0`", correct: false}
      - {text: "`a_un_nom = nom and True`", correct: false}
      - {text: "`a_un_nom = nom is True`", correct: false}
    answer: |-
      ```python
      nom = ""
      a_un_nom = bool(nom)
      print("a un nom :", a_un_nom)
      ```
      `and` renvoie son premier opérande faux tel quel : ici la chaîne vide, qui s'affiche comme rien. `bool(nom)`
      donne un vrai booléen, et dit à lui seul si la chaîne est vide.
