notion: if-elif-else
lesson: |-
  Une condition s'écrit avec `if`, puis autant de `elif` (« sinon si ») qu'il faut, puis un `else` facultatif, en
  dernier. Pas de parenthèses autour de la condition, pas d'accolades : **les deux-points** ouvrent le bloc, et
  **l'indentation** le délimite.

  ```python
  temperature = 23

  if temperature < 0:
      print("Il gèle")
  elif temperature < 20:
      print("Il fait frais")
  else:
      print("Il fait bon")
  ```

  - Python teste les conditions **dans l'ordre** et n'exécute que **la première branche vraie** : les suivantes ne sont
    même pas évaluées. On place donc le cas le plus précis en premier.
  - `else if` n'existe pas : c'est `elif`. Écrit sur une ligne, `else if x:` est une `SyntaxError`.
  - Les opérateurs logiques sont des mots : `and`, `or`, `not` (pas `&&`, `||`, `!`).
  - La condition peut être **n'importe quel objet** : `0`, `0.0`, `""`, `[]`, `{}`, `set()` et `None` sont faux, presque
    tout le reste est vrai. `if not panier:` teste qu'une liste est vide.

  **L'expression conditionnelle** (le « ternaire ») choisit une valeur, en une ligne :

  ```python
  statut = "majeur" if age >= 18 else "mineur"
  ```

  C'est une **expression** : elle vaut quelque chose, et sa partie `else` est obligatoire. Elle remplace le
  `condition ? a : b` du C ou de Java. On la réserve aux choix simples ; deux ternaires imbriqués se lisent mal.

  | Piège | Ce qui se passe | La bonne écriture |
  |---|---|---|
  | `if x = 0:` | `SyntaxError` : `=` affecte, il ne compare pas | `if x == 0:` |
  | `if jour == "sam" or "dim":` | toujours vrai : `"dim"` est une chaîne non vide | `if jour in ("sam", "dim"):` |
  | `else if x:` | `SyntaxError: expected ':'` | `elif x:` |
  | `a if c` sans `else` | `SyntaxError: expected 'else' after 'if' expression` | `a if c else b` |

  Il n'y a pas de `switch` : une chaîne `if` / `elif`, un dictionnaire de valeurs, ou `match` (Python 3.10).

  **En entretien** : « `if`, `elif`, `else`, avec les deux-points et l'indentation ; seule la première branche vraie
  s'exécute. Toute valeur a une valeur de vérité : vide, zéro et `None` sont faux. Le ternaire s'écrit
  `a if condition else b`. »
tour:
  - title: "if, elif et else"
    text: |-
      Une condition s'écrit `if`, puis `elif` (« sinon si »), puis `else`. Pas de parenthèses ni d'accolades : les
      **deux-points** ouvrent le bloc, et l'**indentation** (quatre espaces) le délimite.

      Python n'exécute que la **première** branche vraie. Toute valeur peut servir de condition : une liste vide, `0`,
      `""` et `None` sont faux.

      Pour choisir une valeur en une ligne, l'expression conditionnelle : `a if condition else b`.

      Essaie : remplace `temperature = 23` par `temperature = -4`, puis vide la liste `panier`.
    example:
      files:
        main.py: |-
          temperature = 23

          if temperature < 0:
              print("Il gèle")
          elif temperature < 20:
              print("Il fait frais")
          else:
              print("Il fait bon")

          panier = []
          if not panier:
              print("Panier vide")

          age = 17
          statut = "majeur" if age >= 18 else "mineur"
          print(statut)
      output: |-
        Il fait bon
        Panier vide
        mineur
    task:
      instructions: |-
        Avec `temperature = 34`, le programme affiche `Il fait bon`. Ajoute une branche pour qu'à partir de 30 degrés,
        il affiche `Il fait chaud`.
      starter:
        main.py: |-
          temperature = 34

          if temperature < 0:
              print("Il gèle")
          elif temperature < 20:
              print("Il fait frais")
          else:
              print("Il fait bon")
      solution:
        main.py: |-
          temperature = 34

          if temperature < 0:
              print("Il gèle")
          elif temperature < 20:
              print("Il fait frais")
          elif temperature < 30:
              print("Il fait bon")
          else:
              print("Il fait chaud")
      output: Il fait chaud
cards:
  - key: sinon-si
    format: course
    question: Comment écrit-on « sinon si » dans une chaîne de conditions Python ?
    choices:
      - {text: "`elif`", correct: true}
      - {text: "`else if`", correct: false}
      - {text: "`elseif`", correct: false}
      - {text: "`elsif`", correct: false}
    answer: "`elif`. Écrit sur une ligne, `else if x:` est une `SyntaxError` : il faudrait un `if` imbriqué dans le bloc du `else`."
  - key: parentheses-condition
    format: course
    question: Faut-il entourer de parenthèses la condition d'un `if` ?
    choices:
      - {text: "Non : `if x > 0:` suffit, les deux-points ouvrent le bloc", correct: true}
      - {text: "Oui, comme en Java et en C, sinon le code ne compile pas", correct: false}
      - {text: "Oui, dès que la condition contient un `and` ou un `or`", correct: false}
      - {text: "Non, mais il faut alors entourer le bloc d'accolades", correct: false}
    answer: "Les parenthèses sont permises mais inutiles, et PEP 8 les évite. Ce sont les deux-points et l'indentation qui structurent le code."
  - key: ternaire
    format: course
    question: Comment s'écrit l'expression conditionnelle (le « ternaire ») en Python ?
    choices:
      - {text: "`a if condition else b`", correct: true}
      - {text: "`condition ? a : b`", correct: false}
      - {text: "`if condition then a else b`", correct: false}
      - {text: "`if(condition, a, b)`", correct: false}
    answer: "La valeur si vrai, puis `if` et la condition, puis `else` et la valeur si faux. C'est une expression : elle vaut quelque chose, et son `else` est obligatoire."
  - key: premiere-branche-vraie
    format: course
    question: Plusieurs conditions d'une chaîne `if` / `elif` sont vraies. Qu'exécute Python ?
    choices:
      - {text: "Seulement la première branche vraie", correct: true}
      - {text: "Toutes les branches vraies, dans l'ordre", correct: false}
      - {text: "Seulement la dernière branche vraie", correct: false}
      - {text: "Rien : Python lève une erreur d'ambiguïté", correct: false}
    answer: "Dès qu'une condition est vraie, son bloc s'exécute et la chaîne s'arrête : les conditions suivantes ne sont même pas évaluées. D'où l'importance de l'ordre des branches."
  - key: vf-else-if
    format: true-false
    question: En Python, `else if` est une autre façon d'écrire `elif`.
    truth: false
    answer: "Sur une ligne, `else if x:` est une `SyntaxError` (« expected ':' »). On écrit `elif`, ou un `if` imbriqué dans le bloc du `else`."
  - key: vf-ternaire-else
    format: true-false
    question: Dans l'expression `a if condition else b`, la partie `else` est obligatoire.
    truth: true
    answer: "Une expression doit toujours valoir quelque chose. Sans `else`, Python répond « expected 'else' after 'if' expression »."
  - key: vf-liste-vide
    format: true-false
    question: Une liste vide placée comme condition d'un `if` se comporte comme `False`.
    truth: true
    answer: "Les conteneurs vides, `0`, `\"\"` et `None` sont faux. `if not panier:` est la façon idiomatique de tester qu'une liste est vide."
  - key: vf-toutes-evaluees
    format: true-false
    question: Une chaîne `if` / `elif` évalue toutes ses conditions, même après avoir trouvé une branche vraie.
    truth: false
    answer: "Python s'arrête à la première condition vraie : les suivantes ne sont jamais évaluées. Une condition qui appelle une fonction ne l'appelle donc pas forcément."
  - key: qcm-un-ou-deux
    format: multiple-choice
    question: Quelle condition teste correctement que `x` vaut 1 ou 2 ?
    choices:
      - {text: "`if x == 1 or x == 2:`", correct: true}
      - {text: "`if x == 1 or 2:`", correct: false}
      - {text: "`if x == (1 or 2):`", correct: false}
      - {text: "`if x = 1 or x = 2:`", correct: false}
    answer: "`x == 1 or 2` vaut `2` quand `x` ne vaut pas 1 : toujours vrai. `(1 or 2)` vaut `1`. On peut aussi écrire `if x in (1, 2):`."
  - key: qcm-statut-une-ligne
    format: multiple-choice
    question: Quelle ligne donne à `statut` la valeur « majeur » ou « mineur » selon l'âge ?
    choices:
      - {text: "`statut = \"majeur\" if age >= 18 else \"mineur\"`", correct: true}
      - {text: "`statut = age >= 18 ? \"majeur\" : \"mineur\"`", correct: false}
      - {text: "`statut = if age >= 18 \"majeur\" else \"mineur\"`", correct: false}
      - {text: "`statut = \"majeur\" if age >= 18, \"mineur\"`", correct: false}
    answer: "L'expression conditionnelle de Python place la valeur d'abord : `a if condition else b`. Le `? :` du C n'existe pas."
  - key: qcm-et-logique
    format: multiple-choice
    question: "Un développeur Java écrit `if age > 18 && inscrit:`. Que doit-il écrire en Python ?"
    choices:
      - {text: "`if age > 18 and inscrit:`", correct: true}
      - {text: "`if age > 18 & inscrit:`", correct: false}
      - {text: "`if age > 18 AND inscrit:`", correct: false}
      - {text: "`if (age > 18) && inscrit:`", correct: false}
    answer: "Les opérateurs logiques sont des mots en minuscules : `and`, `or`, `not`. `&` est le « et » bit à bit, avec une autre priorité : `18 & inscrit` serait calculé en premier."
  - key: qcm-ordre-branches
    format: multiple-choice
    question: "Une chaîne teste `if note >= 10:` (« admis »), puis `elif note >= 16:` (« mention »). Pourquoi la mention n'est-elle jamais donnée ?"
    choices:
      - {text: "Toute note d'au moins 16 vaut aussi au moins 10 : la première branche gagne", correct: true}
      - {text: "Un `elif` n'est évalué que si la condition du `if` lève une erreur", correct: false}
      - {text: "Un `elif` ne s'exécute que si la chaîne se termine par un `else`", correct: false}
      - {text: "Il faut entourer chaque condition de parenthèses pour les comparer", correct: false}
    answer: "Seule la première condition vraie compte. On teste le cas le plus précis d'abord : `if note >= 16:`, puis `elif note >= 10:`."
  - key: trous-elif-else
    format: fill-in
    question: |-
      Complète la chaîne de conditions :
      ```python
      if n < 0:
          print("négatif")
      ___ n == 0:
          print("zéro")
      ___:
          print("positif")
      ```
    blanks: [[elif], [else]]
    answer: "`elif` ajoute une condition, `else` attrape tous les autres cas, sans condition."
  - key: trous-ternaire
    format: fill-in
    question: |-
      Complète l'expression conditionnelle :
      ```python
      parite = "pair" ___ n % 2 == 0 ___ "impair"
      ```
    blanks: [[if], [else]]
    answer: "`a if condition else b` : la valeur si vrai, la condition, puis la valeur si faux."
  - key: trous-liste-vide
    format: fill-in
    question: |-
      Complète pour afficher le message quand la liste `commandes` est vide, sans appeler `len` :
      ```python
      if ___ commandes:
          print("rien à expédier")
      ```
    blanks: [[not]]
    answer: "Une liste vide est fausse : `not commandes` est vrai quand elle est vide."
  - key: trous-deux-points
    format: fill-in
    question: |-
      Complète la fin de l'en-tête du `if` :
      ```python
      if solde < 0___
          alerter()
      ```
    blanks: [[":"]]
    answer: "Les deux-points terminent l'en-tête de tout bloc : `if`, `elif`, `else`, `for`, `while`, `def`, `class`."
  - key: code-stock-zero
    format: code-output
    question: |-
      ```python
      stock = 0
      if stock:
          print("en stock")
      elif stock == 0:
          print("épuisé")
      else:
          print("erreur")
      ```
    check:
      output: "épuisé"
    choices:
      - {text: "`épuisé`", correct: true}
      - {text: "`en stock`", correct: false}
      - {text: "`erreur`", correct: false}
      - {text: "Rien", correct: false}
    answer: "`0` est faux : la première branche est sautée. `stock == 0` est vrai : « épuisé »."
  - key: code-or-piege
    format: code-output
    question: |-
      ```python
      couleur = "vert"
      if couleur == "rouge" or "orange":
          print("stop")
      else:
          print("passe")
      ```
    check:
      output: "stop"
    choices:
      - {text: "`stop`", correct: true}
      - {text: "`passe`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "La condition se lit `(couleur == \"rouge\") or \"orange\"` : la chaîne non vide `\"orange\"` est vraie, donc la condition aussi."
  - key: code-deux-ternaires
    format: code-output
    question: |-
      ```python
      n = 7
      print("pair" if n % 2 == 0 else "impair", "grand" if n > 5 else "petit")
      ```
    check:
      output: "impair grand"
    choices:
      - {text: "`impair grand`", correct: true}
      - {text: "`pair grand`", correct: false}
      - {text: "`impair petit`", correct: false}
      - {text: "`impair`", correct: false}
    answer: "7 est impair et plus grand que 5. Chaque ternaire donne une valeur, et `print` les sépare par une espace."
  - key: code-mention
    format: code-output
    question: |-
      ```python
      note = 18
      if note >= 10:
          mention = "admis"
      elif note >= 16:
          mention = "très bien"
      else:
          mention = "ajourné"
      print(mention)
      ```
    check:
      output: "admis"
    choices:
      - {text: "`admis`", correct: true}
      - {text: "`très bien`", correct: false}
      - {text: "`ajourné`", correct: false}
      - {text: "`admis très bien`", correct: false}
    answer: "18 est au moins 10 : la première branche gagne, et le `elif` n'est jamais testé. Il fallait tester `note >= 16` en premier."
  - key: bug-affectation-condition
    format: bug-fix
    question: |-
      Python refuse ce code : « invalid syntax. Maybe you meant '==' or ':=' instead of '='? ». Quelle correction est la bonne ?
      ```python
      total = 0
      if total = 0:
          print("panier vide")
      ```
    choices:
      - {text: "Comparer avec `==` : `if total == 0:`", correct: true}
      - {text: "Entourer de parenthèses : `if (total = 0):`", correct: false}
      - {text: "Utiliser le morse : `if total := 0:`", correct: false}
      - {text: "Comparer avec `===` : `if total === 0:`", correct: false}
    answer: |-
      ```python
      if total == 0:
          print("panier vide")
      ```
      `=` affecte, `==` compare. `if total := 0:` serait accepté, mais affecterait 0 à `total` : la condition serait toujours fausse.
  - key: bug-week-end
    format: bug-fix
    question: |-
      Ce code affiche « week-end » un mardi. Quelle correction est la bonne ?
      ```python
      jour = "mardi"
      if jour == "samedi" or "dimanche":
          print("week-end")
      else:
          print("semaine")
      ```
    choices:
      - {text: "`if jour in (\"samedi\", \"dimanche\"):`", correct: true}
      - {text: "`if jour == (\"samedi\" or \"dimanche\"):`", correct: false}
      - {text: "`if jour == \"samedi\" and \"dimanche\":`", correct: false}
      - {text: "`if jour == \"samedi\" | \"dimanche\":`", correct: false}
    answer: |-
      ```python
      if jour in ("samedi", "dimanche"):
          print("week-end")
      ```
      `or "dimanche"` teste la chaîne seule, toujours vraie. `("samedi" or "dimanche")` vaut `"samedi"` : le dimanche ne serait plus reconnu.
  - key: bug-else-if
    format: bug-fix
    question: |-
      Python répond « SyntaxError: expected ':' » sur la ligne du `else`. Quelle correction est la bonne ?
      ```python
      age = 15
      if age < 13:
          print("enfant")
      else if age < 18:
          print("ado")
      ```
    choices:
      - {text: "Écrire `elif age < 18:`", correct: true}
      - {text: "Écrire `else if (age < 18):`", correct: false}
      - {text: "Écrire `elseif age < 18:`", correct: false}
      - {text: "Écrire `else: if age < 18:`", correct: false}
    answer: |-
      ```python
      elif age < 18:
          print("ado")
      ```
      « sinon si » s'écrit `elif`. Après `else:`, Python n'accepte pas un `if` sur la même ligne : il faudrait le mettre dans un bloc indenté.
  - key: bug-ternaire-sans-else
    format: bug-fix
    question: |-
      Python répond « expected 'else' after 'if' expression ». Quelle correction est la bonne ?
      ```python
      client_fidele = True
      remise = 10 if client_fidele
      print(remise)
      ```
    choices:
      - {text: "`remise = 10 if client_fidele else 0`", correct: true}
      - {text: "`remise = 10 if client_fidele else pass`", correct: false}
      - {text: "`remise = (10 if client_fidele)`", correct: false}
      - {text: "`remise = client_fidele ? 10 : 0`", correct: false}
    answer: |-
      ```python
      remise = 10 if client_fidele else 0
      ```
      Une expression conditionnelle doit toujours produire une valeur : son `else` est obligatoire. `pass` est une instruction, pas une valeur.
