notion: defaut-mutable
lesson: |-
  **Une valeur par défaut est évaluée une seule fois**, quand le `def` s'exécute, puis rangée dans l'objet fonction
  (`f.__defaults__`). Tous les appels qui ne fournissent pas l'argument partagent **le même objet**.

  Pour un nombre ou une chaîne, immuables, c'est sans conséquence. Pour une **liste**, un **dictionnaire** ou un
  **ensemble**, c'est le piège le plus célèbre de Python :

  ```python
  def ajouter(article, panier=[]):
      panier.append(article)
      return panier

  ajouter("pomme")      # ['pomme']
  ajouter("kiwi")       # ['pomme', 'kiwi']  : la même liste qu'au premier appel
  ```

  **La correction** : `None` comme sentinelle, et l'objet mutable créé dans le corps, donc à chaque appel.

  ```python
  def ajouter(article, panier=None):
      if panier is None:
          panier = []
      panier.append(article)
      return panier
  ```

  Si `None` est une valeur légitime de l'argument, on utilise une sentinelle privée : `_MANQUANT = object()`, puis
  `if panier is _MANQUANT:`.

  **Le même piège, sous d'autres formes**

  - `def journaliser(msg, quand=datetime.now())` : l'heure est figée au chargement du module.
  - Une instance par défaut (`def f(config=Config())`) : partagée elle aussi.
  - Les **dataclasses** refusent une liste par défaut : « mutable default <class 'list'> for field articles is not
    allowed: use default_factory ». On écrit `articles: list = field(default_factory=list)`.

  Les linters le signalent : la règle B006 de flake8-bugbear, reprise par Ruff. Le comportement est parfois utilisé
  exprès, comme cache entre les appels ; `functools.cache` le dit plus clairement.

  **En entretien** : « Les valeurs par défaut sont évaluées une fois, au `def`, et partagées entre les appels. Une liste
  par défaut accumule donc les ajouts d'un appel à l'autre. On met `None` par défaut, et on crée la liste dans le
  corps. »
cards:
  - key: quand-evaluee
    format: course
    question: Quand la valeur par défaut d'un paramètre est-elle évaluée ?
    choices:
      - {text: "Une seule fois, quand le `def` s'exécute", correct: true}
      - {text: "À chaque appel qui ne fournit pas l'argument", correct: false}
      - {text: "Au premier appel, puis gardée en cache", correct: false}
      - {text: "À chaque appel, avant le corps de la fonction", correct: false}
    answer: "Le `def` évalue les valeurs par défaut et les range dans `f.__defaults__`. Les appels suivants réutilisent ces objets-là."
  - key: correction-habituelle
    format: course
    question: Quelle est la correction habituelle de `def ajouter(x, liste=[])` ?
    choices:
      - {text: "`liste=None`, puis `if liste is None: liste = []` dans le corps", correct: true}
      - {text: "`liste=list()`, qui crée une nouvelle liste à chaque appel", correct: false}
      - {text: "`liste=[].copy()`, qui copie la liste vide à chaque appel", correct: false}
      - {text: "`global liste` dans le corps, pour isoler la liste par défaut", correct: false}
    answer: "`list()` et `[].copy()` sont évalués eux aussi une seule fois, au `def` : ils ne changent rien. La liste doit être créée dans le corps."
  - key: ou-rangees
    format: course
    question: Où Python range-t-il les valeurs par défaut d'une fonction ?
    choices:
      - {text: "Dans l'attribut `__defaults__` de l'objet fonction", correct: true}
      - {text: "Sur la pile, recréées à chaque appel", correct: false}
      - {text: "Dans les variables globales du module", correct: false}
      - {text: "Dans le cadre (frame) du premier appel", correct: false}
    answer: "`ajouter.__defaults__` est un tuple ; on y voit la liste grandir d'un appel à l'autre. Les valeurs par défaut des paramètres nommés seulement sont dans `__kwdefaults__`."
  - key: heure-figee
    format: course
    question: Pourquoi `def journaliser(msg, quand=datetime.now())` est-il un bug ?
    choices:
      - {text: "L'heure est calculée au `def` : tous les appels la partagent", correct: true}
      - {text: "`datetime.now()` ne peut pas servir de valeur par défaut", correct: false}
      - {text: "L'heure est recalculée à chaque appel, ce qui est lent", correct: false}
      - {text: "L'appel à `now()` lève une erreur au chargement du module", correct: false}
    answer: "Le même mécanisme que la liste par défaut : `now()` est appelé une seule fois. On écrit `quand=None`, puis `quand = quand or datetime.now()`."
  - key: vf-nouvelle-liste
    format: true-false
    question: Avec `def f(x=[])`, chaque appel sans argument reçoit une nouvelle liste vide.
    truth: false
    answer: "Tous les appels reçoivent la même liste, créée au `def`. Si un appel la modifie, les suivants le voient."
  - key: vf-immuable
    format: true-false
    question: Une valeur par défaut immuable, comme `0` ou `""`, ne pose pas ce problème.
    truth: true
    answer: "Elle est partagée aussi, mais personne ne peut la modifier : `x += 1` crée un nouvel objet au lieu de changer le partagé."
  - key: vf-dataclass
    format: true-false
    question: Une dataclass refuse une liste comme valeur par défaut d'un champ, et demande `field(default_factory=list)`.
    truth: true
    answer: "Elle lève une `ValueError` à la définition de la classe, justement pour éviter ce piège."
  - key: vf-dictionnaire
    format: true-false
    question: Le piège ne concerne que les listes ; un dictionnaire par défaut est recréé à chaque appel.
    truth: false
    answer: "Tout objet mutable est concerné : liste, dictionnaire, ensemble, instance d'une classe."
  - key: qcm-objets-concernes
    format: multiple-choice
    question: Quelles valeurs par défaut posent le problème du partage entre appels ?
    choices:
      - {text: "Les objets mutables : `[]`, `{}`, `set()`", correct: true}
      - {text: "Tous les objets, y compris les entiers", correct: false}
      - {text: "Les listes seulement, pas les dictionnaires", correct: false}
      - {text: "Seulement les objets créés par un appel", correct: false}
    answer: "Un objet immuable partagé est sans danger. Un objet mutable partagé garde les modifications d'un appel à l'autre."
  - key: qcm-pourquoi-none
    format: multiple-choice
    question: Pourquoi utiliser `None` comme sentinelle plutôt que `[]` ?
    choices:
      - {text: "`None` est immuable : le partager entre appels est sans danger", correct: true}
      - {text: "`None` prend moins de mémoire qu'une liste vide", correct: false}
      - {text: "`None` est recréé à chaque appel de la fonction", correct: false}
      - {text: "`None` se convertit tout seul en liste vide", correct: false}
    answer: "`None` est partagé lui aussi (c'est un objet unique), mais rien ne peut le modifier. La liste, elle, est créée dans le corps."
  - key: qcm-none-legitime
    format: multiple-choice
    question: "`None` est une valeur légitime de l'argument. Quelle valeur par défaut choisir ?"
    choices:
      - {text: "Une sentinelle privée, comme `_MANQUANT = object()`", correct: true}
      - {text: "`None` quand même, testé avec `if not x:`", correct: false}
      - {text: "`[]`, puisque `None` est déjà pris", correct: false}
      - {text: "`...`, sans tester la valeur reçue", correct: false}
    answer: "Un `object()` créé pour l'occasion ne peut pas être passé par erreur : `if x is _MANQUANT:` distingue l'absence de `None`. `if not x:` confondrait aussi `0` et `\"\"`."
  - key: qcm-outil
    format: multiple-choice
    question: Quel outil signale ce piège automatiquement ?
    choices:
      - {text: "Un linter comme Ruff, avec la règle B006 de flake8-bugbear", correct: true}
      - {text: "L'interpréteur, avec un `SyntaxWarning` au `def`", correct: false}
      - {text: "Le module `typing`, au moment de l'appel", correct: false}
      - {text: "`pickle`, quand il sérialise la fonction", correct: false}
    answer: "B006, « mutable-argument-default ». Python, lui, ne dit rien : le code est valide."
  - key: code-accumule
    format: code-output
    question: |-
      ```python
      def ajouter(x, liste=[]):
          liste.append(x)
          return liste

      ajouter(1)
      ajouter(2)
      print(ajouter(3))
      ```
    check:
      output: "[1, 2, 3]"
    choices:
      - {text: "`[1, 2, 3]`", correct: true}
      - {text: "`[3]`", correct: false}
      - {text: "`[1]`", correct: false}
      - {text: "`[1, 2]`", correct: false}
    answer: "Les trois appels partagent la même liste par défaut, qui accumule 1, 2 puis 3."
  - key: code-sentinelle
    format: code-output
    question: |-
      ```python
      def ajouter(x, liste=None):
          if liste is None:
              liste = []
          liste.append(x)
          return liste

      ajouter(1)
      print(ajouter(2))
      ```
    check:
      output: "[2]"
    choices:
      - {text: "`[2]`", correct: true}
      - {text: "`[1, 2]`", correct: false}
      - {text: "`None`", correct: false}
      - {text: "`[1]`", correct: false}
    answer: "Chaque appel sans liste en crée une nouvelle, dans le corps : rien n'est partagé."
  - key: code-dict-defaults
    format: code-output
    question: |-
      ```python
      def compter(mot, vus={}):
          vus[mot] = vus.get(mot, 0) + 1
          return vus[mot]

      compter("a")
      compter("b")
      print(compter("a"), len(compter.__defaults__[0]))
      ```
    check:
      output: "2 2"
    choices:
      - {text: "`2 2`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`2 3`", correct: false}
      - {text: "`1 2`", correct: false}
    answer: "Le dictionnaire par défaut, rangé dans `__defaults__`, garde ses comptes : « a » est vu deux fois, et il contient deux clés."
  - key: code-meme-objet
    format: code-output
    question: |-
      ```python
      def f(x, acc=[]):
          acc.append(x)
          return acc

      a = f(1)
      b = f(2)
      print(a is b, a)
      ```
    check:
      output: "True [1, 2]"
    choices:
      - {text: "`True [1, 2]`", correct: true}
      - {text: "`False [1]`", correct: false}
      - {text: "`True [1]`", correct: false}
      - {text: "`False [1, 2]`", correct: false}
    answer: "`a` et `b` désignent le même objet : la liste par défaut. Le second appel l'a modifiée, et `a` le voit."
  - key: bug-panier-partage
    format: bug-fix
    question: |-
      Le second panier contient aussi la pomme du premier. Quelle correction est la bonne ?
      ```python
      def nouveau_panier(article, panier=[]):
          panier.append(article)
          return panier

      print(nouveau_panier("pomme"))
      print(nouveau_panier("kiwi"))
      ```
    choices:
      - {text: "`panier=None`, puis `if panier is None: panier = []`", correct: true}
      - {text: "`panier=list()`, pour une liste neuve à chaque appel", correct: false}
      - {text: "`panier.clear()` à la fin de la fonction, avant le `return`", correct: false}
      - {text: "`panier=[]` remplacé par `panier=[None]`", correct: false}
    answer: |-
      ```python
      def nouveau_panier(article, panier=None):
          if panier is None:
              panier = []
          panier.append(article)
          return panier
      ```
      `list()` est évalué une seule fois, comme `[]`. Vider la liste avant le `return` viderait aussi le panier renvoyé, puisque c'est le même objet.
  - key: bug-roles-partages
    format: bug-fix
    question: |-
      Ce code affiche `True` : Linus reçoit le rôle « admin », accordé à Ada seulement. Quelle correction est la bonne ?
      ```python
      def creer_utilisateur(nom, roles=set()):
          roles.add("lecteur")
          return {"nom": nom, "roles": roles}

      ada = creer_utilisateur("Ada")
      ada["roles"].add("admin")
      print("admin" in creer_utilisateur("Linus")["roles"])
      ```
    choices:
      - {text: "`roles=None`, puis `roles = set() if roles is None else roles`", correct: true}
      - {text: "`roles=frozenset()`, un ensemble que personne ne peut modifier", correct: false}
      - {text: "`roles=set()` remplacé par `roles={}`, un ensemble vide plus court", correct: false}
      - {text: "Déclarer `global roles` en tête de la fonction, pour le partager", correct: false}
    answer: |-
      ```python
      def creer_utilisateur(nom, roles=None):
          roles = set() if roles is None else roles
          roles.add("lecteur")
          return {"nom": nom, "roles": roles}
      ```
      L'ensemble par défaut est partagé par tous les utilisateurs. `frozenset` n'a pas de méthode `add`, `{}` est un dictionnaire vide, et un paramètre ne peut pas être déclaré `global` (`SyntaxError`).
  - key: bug-heure-figee
    format: bug-fix
    question: |-
      Ce code affiche `True` : les deux horodatages sont identiques, malgré la pause. Quelle correction est la bonne ?
      ```python
      import time

      def horodater(message, quand=time.time()):
          return quand

      premier = horodater("début")
      time.sleep(0.01)
      second = horodater("fin")
      print(premier == second)
      ```
    choices:
      - {text: "`quand=None`, puis `if quand is None: quand = time.time()`", correct: true}
      - {text: "`quand=time.time`, sans parenthèses, pour l'appeler plus tard", correct: false}
      - {text: "Augmenter la pause entre les deux appels de la fonction", correct: false}
      - {text: "Remplacer `time.time()` par `time.monotonic()` dans la signature", correct: false}
    answer: |-
      ```python
      def horodater(message, quand=None):
          if quand is None:
              quand = time.time()
          return quand
      ```
      `time.time()` est appelé une fois, au `def`. Sans parenthèses, la fonction renverrait l'objet `time.time` lui-même, pas une heure.
  - key: bug-dataclass-liste
    format: bug-fix
    question: |-
      Python répond « ValueError: mutable default <class 'list'> for field articles is not allowed: use default_factory ». Quelle correction est la bonne ?
      ```python
      from dataclasses import dataclass

      @dataclass
      class Panier:
          articles: list = []
      ```
    choices:
      - {text: "`articles: list = field(default_factory=list)`", correct: true}
      - {text: "`articles: list = list()`", correct: false}
      - {text: "`articles: list = None`, sans autre changement", correct: false}
      - {text: "`articles: list = default_factory(list)`", correct: false}
    answer: |-
      ```python
      from dataclasses import dataclass, field

      @dataclass
      class Panier:
          articles: list = field(default_factory=list)
      ```
      `default_factory` est appelée à chaque création d'instance : chaque panier a sa propre liste. `list()` est refusé comme `[]`.
  - key: scenario-cache-volontaire
    format: scenario
    question: "En revue de code, tu vois `def charger(chemin, cache={}):`. Ton collègue dit que c'est voulu, pour garder un cache entre les appels. Que lui réponds-tu ?"
    choices:
      - {text: "Ça marche, mais c'est implicite : `functools.cache` le dirait mieux", correct: true}
      - {text: "C'est impossible : Python recrée le dictionnaire à chaque appel", correct: false}
      - {text: "C'est interdit : Python refuse un `{}` comme valeur par défaut", correct: false}
      - {text: "C'est la seule façon de garder un état entre deux appels", correct: false}
    answer: "Le mécanisme fonctionne, mais un lecteur y verra un bug. `@functools.cache`, un attribut de classe ou une variable de module rendent l'intention explicite."
  - key: scenario-erreurs-melangees
    format: scenario
    question: "Un service valide des requêtes avec `def valider(donnees, erreurs=[])`. En production, les erreurs d'un utilisateur apparaissent chez les suivants. Quelle cause cherches-tu en premier ?"
    choices:
      - {text: "La liste par défaut, créée une fois et partagée par tous les appels", correct: true}
      - {text: "Une variable globale modifiée en même temps par un autre thread", correct: false}
      - {text: "Un cache HTTP qui renvoie la même réponse à plusieurs clients", correct: false}
      - {text: "Le ramasse-miettes, qui ne libère pas la liste entre deux requêtes", correct: false}
    answer: "La signature trahit le bug : chaque appel sans liste ajoute à la même liste. On passe à `erreurs=None`, et on crée la liste dans le corps."
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande pourquoi `def f(x=[])` est un piège. Quelle réponse est la plus juste ?
    choices:
      - {text: "La valeur par défaut est évaluée au `def`, puis partagée par les appels", correct: true}
      - {text: "La liste vide est convertie en `None` au moment de chaque appel", correct: false}
      - {text: "La liste est copiée à chaque appel, ce qui coûte cher en mémoire", correct: false}
      - {text: "Une liste ne peut pas servir de valeur par défaut à un paramètre", correct: false}
    answer: "C'est le cœur du piège. On complète par la correction : `x=None`, puis `if x is None: x = []`."
  - key: scenario-options-publiques
    format: scenario
    question: "Tu ajoutes un paramètre `options` facultatif, un dictionnaire, à une fonction publique. Quelle signature choisis-tu ?"
    choices:
      - {text: "`options: dict | None = None`, remplacé par `{}` dans le corps", correct: true}
      - {text: "`options: dict = {}`, plus court et plus lisible", correct: false}
      - {text: "`options: dict = dict()`, recréé à chaque appel", correct: false}
      - {text: "`options: dict = {}.copy()`, une copie neuve à chaque fois", correct: false}
    answer: "Les trois autres évaluent le dictionnaire une seule fois, au `def` : il serait partagé. L'annotation `dict | None` dit honnêtement que `None` est accepté."
