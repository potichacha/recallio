notion: conversions
lesson: |-
  Python ne convertit pas en silence une chaîne en nombre (ni l'inverse) : on appelle le **type** comme une fonction.

  | Appel | Exemples | Remarques |
  |---|---|---|
  | `int(x)` | `int("42")` → `42`, `int(3.9)` → `3`, `int(-3.9)` → `-3` | tronque **vers zéro** ; ignore les blancs autour ; accepte `"1_000"` |
  | `int(texte, base)` | `int("ff", 16)` → `255`, `int("1010", 2)` → `10`, `int("0x1A", 0)` → `26` | la base 0 lit le préfixe (`0x`, `0o`, `0b`) |
  | `float(x)` | `float("3.5")`, `float("1e3")` → `1000.0`, `float("inf")` | le séparateur décimal est le **point** |
  | `str(x)` | `str(42)` → `"42"`, `str(None)` → `"None"` | marche pour tout objet |
  | `bool(x)` | `bool("")` → `False`, `bool("False")` → `True` | la valeur de vérité, pas une lecture du texte |

  **Quand la conversion échoue**, Python lève une `ValueError` (la valeur n'a pas le bon format) ou une `TypeError`
  (le type ne se convertit pas du tout) :

  ```python
  int("3.5")      # ValueError: invalid literal for int() with base 10: '3.5'
  int("douze")    # ValueError: invalid literal for int() with base 10: 'douze'
  float("3,5")    # ValueError: could not convert string to float: '3,5'
  int(None)       # TypeError: int() argument must be a string, a bytes-like object or a real number, not 'NoneType'
  ```

  **Convertir une saisie** sans planter :

  ```python
  try:
      age = int(saisie)
  except ValueError:
      print("Ce n'est pas un nombre entier.")
  ```

  **Les pièges**

  - `int("3.5")` échoue : on passe par `float` d'abord, `int(float("3.5"))`, ou on garde le `float`.
  - `int(2.7)` vaut `2` (troncature) ; pour arrondir, `round(2.7)`.
  - Les nombres « à la française » (`"3,5"`, `"1 000"`) se nettoient avant : `float(texte.replace(",", "."))`.
  - `bool("False")` vaut `True`, comme toute chaîne non vide. Pour lire un booléen dans un fichier de configuration,
    on compare le texte : `valeur.strip().lower() in ("true", "1", "oui")`.
  - `input()` renvoie toujours une `str` : il faut la convertir.

  **En entretien** : « On convertit explicitement, en appelant `int`, `float`, `str` ou `bool`. Une chaîne mal formée
  lève une `ValueError`, qu'on attrape avec `try` / `except`. `int` tronque vers zéro et refuse `"3.5"`, et
  `bool("False")` vaut `True`. »
tour:
  - title: Convertir entre les types
    text: |-
      Python ne convertit pas une chaîne en nombre de lui-même : on appelle `int()`, `float()`, `str()` ou `bool()`.

      `int` tronque un flottant vers zéro, accepte une base (`int("ff", 16)`), et lève une `ValueError` quand le texte
      n'est pas un entier. Le bloc `try` / `except` attrape cette erreur au lieu d'arrêter le programme.

      Essaie : ajoute `"3.5"` à la liste des textes. `int` refuse un nombre à virgule.
    example:
      files:
        main.py: |-
          print(int("42") + 1, float("3.5") * 2, str(7) + "7")
          print(int(3.99), int(-3.99), round(3.99))
          print(int("ff", 16), int("1_000"))
          print(bool(""), bool("False"))

          for texte in ["12", "douze"]:
              try:
                  print(int(texte) * 2)
              except ValueError as erreur:
                  print("Erreur :", erreur)
      output: |-
        43 7.0 77
        3 -3 4
        255 1000
        False True
        24
        Erreur : invalid literal for int() with base 10: 'douze'
    task:
      instructions: |-
        Le programme colle les deux chaînes et affiche `1230`. Convertis-les pour qu'il affiche leur somme, `42`.
      starter:
        main.py: |-
          a = "12"
          b = "30"
          print(a + b)
      solution:
        main.py: |-
          a = "12"
          b = "30"
          print(int(a) + int(b))
      output: |-
        42
cards:
  - key: int-de-chaine-decimale
    format: course
    question: "Que donne `int(\"3.5\")` ?"
    choices:
      - {text: "Une `ValueError`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`3.5`", correct: false}
    answer: "`int` n'accepte qu'un texte d'entier : « invalid literal for int() with base 10: '3.5' ». `int(float(\"3.5\"))` donne `3`."
  - key: int-tronque
    format: course
    question: Que vaut `int(-3.7)` ?
    choices:
      - {text: "`-3` : `int` tronque vers zéro", correct: true}
      - {text: "`-4` : `int` arrondit vers le bas", correct: false}
      - {text: "`-4` : `int` arrondit au plus proche", correct: false}
      - {text: "Une `ValueError` : le nombre est négatif", correct: false}
    answer: "`int` supprime la partie décimale. `math.floor(-3.7)` donne `-4`, et `round(-3.7)` aussi."
  - key: saisie-sure
    format: course
    question: Comment convertit-on, sans planter, une saisie qui n'est peut-être pas un nombre ?
    choices:
      - {text: "`int(saisie)` dans un `try`, avec un `except ValueError`", correct: true}
      - {text: "`int(saisie, default=0)`, qui renvoie 0 en cas d'échec", correct: false}
      - {text: "`if int(saisie):`, qui teste la conversion avant de la faire", correct: false}
      - {text: "`saisie.to_int()`, qui renvoie `None` en cas d'échec", correct: false}
    answer: "Python préfère essayer, puis traiter l'échec (« il est plus facile de demander pardon que la permission »). `int` n'a pas de valeur par défaut, et les chaînes n'ont pas de `to_int`."
  - key: bool-chaine-false
    format: course
    question: "Que renvoie `bool(\"False\")` ?"
    choices:
      - {text: "`True`, comme pour toute chaîne non vide", correct: true}
      - {text: "`False`, car le texte dit « False »", correct: false}
      - {text: "Une `ValueError` : ce n'est pas un booléen", correct: false}
      - {text: "`None`, car la conversion est ambiguë", correct: false}
    answer: "`bool` donne la valeur de vérité, sans lire le texte. Pour interpréter `\"false\"`, on compare : `valeur.lower() == \"true\"`."
  - key: vf-int-espaces
    format: true-false
    question: "`int(\" 42 \")` vaut `42` : les espaces autour sont ignorés."
    truth: true
    answer: "`int` et `float` ignorent les blancs au début et à la fin (espaces, tabulations, retours à la ligne), mais pas au milieu : `int(\"4 2\")` échoue."
  - key: vf-float-virgule
    format: true-false
    question: "`float(\"3,5\")` vaut `3.5`."
    truth: false
    answer: "Le séparateur décimal est le point : « could not convert string to float: '3,5' ». On remplace la virgule d'abord."
  - key: vf-base-16
    format: true-false
    question: "`int(\"ff\", 16)` vaut `255`."
    truth: true
    answer: "Le second argument est la base, de 2 à 36. `int(\"ff\")` seul lèverait une `ValueError`."
  - key: vf-str-none
    format: true-false
    question: "`str(None)` lève une `TypeError`."
    truth: false
    answer: "`str` accepte tout objet : `str(None)` vaut `\"None\"`. C'est `int(None)` qui lève une `TypeError`."
  - key: qcm-hexadecimal
    format: multiple-choice
    question: "Comment convertit-on la chaîne `\"0x1A\"` en entier ?"
    choices:
      - {text: "`int(\"0x1A\", 16)`", correct: true}
      - {text: "`int(\"0x1A\")`", correct: false}
      - {text: "`hex(\"0x1A\")`", correct: false}
      - {text: "`float(\"0x1A\")`", correct: false}
    answer: "En base 16, le préfixe `0x` est accepté (`int(\"0x1A\", 0)` le lit aussi). Sans base, `int` attend du décimal ; `hex` fait l'inverse : d'un entier vers une chaîne."
  - key: qcm-int-texte
    format: multiple-choice
    question: "Quelle exception lève `int(\"douze\")` ?"
    choices:
      - {text: "`ValueError`", correct: true}
      - {text: "`TypeError`", correct: false}
      - {text: "`NameError`", correct: false}
      - {text: "`SyntaxError`", correct: false}
    answer: "Le type est le bon (une chaîne), mais pas sa valeur : `ValueError`. Une `TypeError` vient d'un type qui ne se convertit pas du tout, comme `None`."
  - key: qcm-int-none
    format: multiple-choice
    question: Quelle exception lève `int(None)` ?
    choices:
      - {text: "`TypeError`", correct: true}
      - {text: "`ValueError`", correct: false}
      - {text: "`AttributeError`", correct: false}
      - {text: "`ZeroDivisionError`", correct: false}
    answer: "« int() argument must be a string, a bytes-like object or a real number, not 'NoneType' » : ce type ne se convertit pas en entier."
  - key: qcm-arrondir
    format: multiple-choice
    question: Comment arrondit-on `2.7` à l'entier le plus proche ?
    choices:
      - {text: "`round(2.7)`", correct: true}
      - {text: "`int(2.7)`", correct: false}
      - {text: "`math.floor(2.7)`", correct: false}
      - {text: "`float(2.7)`", correct: false}
    answer: "`round(2.7)` vaut `3`. `int` et `math.floor` donnent `2`, et `float` ne change rien."
  - key: trous-int
    format: fill-in
    question: |-
      Complète pour convertir la saisie en entier :
      ```python
      age = ___(saisie)
      ```
    blanks: [[int]]
    answer: "`int(saisie)` lève une `ValueError` si la saisie n'est pas un entier."
  - key: trous-value-error
    format: fill-in
    question: |-
      Complète pour attraper une saisie invalide :
      ```python
      try:
          n = int(saisie)
      except ___:
          n = 0
      ```
    blanks: [[ValueError]]
    answer: "`int` lève une `ValueError` sur un texte mal formé."
  - key: trous-base-binaire
    format: fill-in
    question: |-
      Complète pour lire un nombre écrit en binaire :
      ```python
      n = int("1010", ___)
      ```
    blanks: [["2"]]
    answer: "Base 2 : `int(\"1010\", 2)` vaut `10`."
  - key: trous-virgule-decimale
    format: fill-in
    question: |-
      Complète pour convertir un prix écrit avec une virgule décimale :
      ```python
      prix = float(saisie.replace(",", ___))
      ```
    blanks: [['"."', "'.'"]]
    answer: "On remplace la virgule par un point, le seul séparateur décimal que `float` comprend."
  - key: code-int-espaces-tronque
    format: code-output
    question: |-
      ```python
      print(int("  7 ") + int(7.9))
      ```
    answer: "`14` : les espaces sont ignorés, et `int(7.9)` tronque à `7`."
    check:
      output: "14"
    choices:
      - {text: "`14`", correct: true}
      - {text: "`15`", correct: false}
      - {text: "`14.9`", correct: false}
      - {text: "Une `ValueError`", correct: false}
  - key: code-float-puis-int
    format: code-output
    question: |-
      ```python
      print(float("1e3"), int(float("2.5")))
      ```
    answer: "`1000.0 2` : `float` lit la notation scientifique, et `int` tronque `2.5`."
    check:
      output: "1000.0 2"
    choices:
      - {text: "`1000.0 2`", correct: true}
      - {text: "`1000 2`", correct: false}
      - {text: "`1000.0 3`", correct: false}
      - {text: "`1e3 2`", correct: false}
  - key: code-str-concat
    format: code-output
    question: |-
      ```python
      print(str(1 / 4) + "0", int("1_000") + 1)
      ```
    answer: "`0.250 1001` : `str(0.25)` vaut `\"0.25\"`, auquel on colle `\"0\"` ; `int` accepte les soulignés."
    check:
      output: "0.250 1001"
    choices:
      - {text: "`0.250 1001`", correct: true}
      - {text: "`0.25 1001`", correct: false}
      - {text: "`0.25 1_0001`", correct: false}
      - {text: "`0.250 1_001`", correct: false}
  - key: code-int-bool
    format: code-output
    question: |-
      ```python
      print(int(True) + int("-5"), bool(-1))
      ```
    answer: "`-4 True` : `int(True)` vaut `1`, et tout nombre non nul est vrai, même négatif."
    check:
      output: "-4 True"
    choices:
      - {text: "`-4 True`", correct: true}
      - {text: "`-4 False`", correct: false}
      - {text: "`-6 True`", correct: false}
      - {text: "`-5 False`", correct: false}
  - key: bug-int-decimal
    format: bug-fix
    question: |-
      Ce script s'arrête avec « ValueError: invalid literal for int() with base 10: '3.5' » :
      ```python
      saisie = "3.5"
      quantite = int(saisie)
      print(quantite)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`quantite = float(saisie)`", correct: true}
      - {text: "`quantite = int(saisie, 10)`", correct: false}
      - {text: "`quantite = int(saisie.strip())`", correct: false}
      - {text: "`quantite = int(str(saisie))`", correct: false}
    answer: |-
      ```python
      saisie = "3.5"
      quantite = float(saisie)
      print(quantite)
      ```
      `int` refuse un texte qui contient une partie décimale. `float` le lit ; si l'on veut un entier ensuite,
      `int(float(saisie))` ou `round(float(saisie))`.
  - key: bug-float-virgule
    format: bug-fix
    question: |-
      Ce script s'arrête avec « ValueError: could not convert string to float: '3,5' » :
      ```python
      saisie = "3,5"
      prix = float(saisie)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`prix = float(saisie.replace(\",\", \".\"))`", correct: true}
      - {text: "`prix = float(saisie, locale=\"fr\")`", correct: false}
      - {text: "`prix = float(saisie.strip(\",\"))`", correct: false}
      - {text: "`prix = float(int(saisie))`", correct: false}
    answer: |-
      ```python
      saisie = "3,5"
      prix = float(saisie.replace(",", "."))
      ```
      `float` ne connaît que le point décimal. `strip(",")` ne retire que les virgules des bouts. Pour gérer
      sérieusement les formats régionaux, le module `locale` (`locale.atof`).
  - key: bug-bool-configuration
    format: bug-fix
    question: |-
      Le mode débogage est activé alors que la configuration dit « False » :
      ```python
      valeur = "False"
      debug = bool(valeur)
      print("débogage :", debug)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`debug = valeur.strip().lower() == \"true\"`", correct: true}
      - {text: "`debug = bool(valeur.lower())`", correct: false}
      - {text: "`debug = bool(str(valeur))`", correct: false}
      - {text: "`debug = not bool(valeur)`", correct: false}
    answer: |-
      ```python
      valeur = "False"
      debug = valeur.strip().lower() == "true"
      print("débogage :", debug)
      ```
      `bool` d'une chaîne non vide vaut toujours `True`. Il faut lire le texte. `not bool(valeur)` tomberait juste
      ici, mais désactiverait aussi `"True"`.
  - key: bug-hexadecimal
    format: bug-fix
    question: |-
      Ce script s'arrête avec « ValueError: invalid literal for int() with base 10: '0x1A' » :
      ```python
      couleur = "0x1A"
      print(int(couleur))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`int(couleur, 16)`", correct: true}
      - {text: "`int(couleur, 10)`", correct: false}
      - {text: "`hex(couleur)`", correct: false}
      - {text: "`int(float(couleur))`", correct: false}
    answer: |-
      ```python
      couleur = "0x1A"
      print(int(couleur, 16))
      ```
      Sans base, `int` attend du décimal. En base 16, le préfixe `0x` est accepté ; `int(couleur, 0)` lirait aussi le
      préfixe pour choisir la base.
