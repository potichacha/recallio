notion: walrus
lesson: |-
  L'**opérateur morse** `:=` (PEP 572, Python 3.8) est une **expression d'affectation** : `(nom := expression)` affecte
  la valeur à `nom` **et vaut** cette valeur. Il évite de calculer deux fois, ou d'écrire une ligne de plus, quand une
  valeur sert à la fois de condition et de donnée.

  ```python
  # lire un fichier par blocs, jusqu'au bloc vide
  while (bloc := fichier.read(1024)):
      traiter(bloc)

  # tester et garder une correspondance
  if (m := re.match(r"(\d+)-(\d+)", texte)) is not None:
      debut, fin = m.groups()

  # filtrer sur un calcul coûteux, sans le refaire
  resultats = [y for x in donnees if (y := transformer(x)) is not None]
  ```

  **Les règles**

  - **Les parenthèses** : `:=` a la priorité la plus basse. `if n := len(a) > 10:` affecte à `n` le **booléen**
    `len(a) > 10`. On écrit `if (n := len(a)) > 10:`.
  - Seul **un nom simple** peut être à gauche : pas d'attribut (`self.x := 1`), pas d'indice, pas de tuple.
  - Il est **interdit sans parenthèses** comme instruction seule : `x := 5` est une `SyntaxError` (on écrit `x = 5`).
    Il l'est aussi dans le filtre `if` d'une compréhension : `[y for x in xs if (y := f(x))]`.
  - Dans une **compréhension**, le nom affecté appartient à la portée **englobante** : il reste accessible après, avec
    la dernière valeur affectée.

  À utiliser avec mesure : il raccourcit le code, mais une affectation cachée dans une condition se remarque moins.

  **En entretien** : « `:=` affecte et renvoie la valeur, dans une expression : pratique dans un `while` de lecture, un
  `if` sur une correspondance ou le filtre d'une compréhension. Il faut presque toujours des parenthèses, car sa
  priorité est la plus basse. »
cards:
  - key: que-fait-morse
    format: course
    question: Que fait l'expression `(n := len(donnees))` ?
    choices:
      - {text: "Elle affecte `len(donnees)` à `n`, et vaut cette valeur", correct: true}
      - {text: "Elle compare `n` à `len(donnees)`, et vaut un booléen", correct: false}
      - {text: "Elle affecte `len(donnees)` à `n`, et vaut `None`", correct: false}
      - {text: "Elle déclare `n` comme une constante égale à la longueur", correct: false}
    answer: "C'est une affectation qui est aussi une expression : sa valeur peut servir directement, dans une condition par exemple."
  - key: version-morse
    format: course
    question: Depuis quelle version Python a-t-il l'opérateur `:=` ?
    choices:
      - {text: "Python 3.8", correct: true}
      - {text: "Python 3.6", correct: false}
      - {text: "Python 3.10", correct: false}
      - {text: "Python 3.12", correct: false}
    answer: "La PEP 572, livrée avec Python 3.8 en 2019. Les débats sur son adoption, en 2018, ont poussé Guido van Rossum à quitter son rôle de « dictateur bienveillant à vie »."
  - key: pourquoi-parentheses
    format: course
    question: Pourquoi écrit-on `if (n := len(a)) > 10:` avec des parenthèses ?
    choices:
      - {text: "Sans elles, `n` recevrait le booléen `len(a) > 10`", correct: true}
      - {text: "Sans elles, `n` ne serait visible que dans le `if`", correct: false}
      - {text: "Les parenthèses rendent l'affectation paresseuse", correct: false}
      - {text: "Sans elles, `len(a)` serait appelée deux fois", correct: false}
    answer: "`:=` a la priorité la plus basse de toutes : sans parenthèses, la comparaison est calculée d'abord, et c'est son résultat qui est affecté."
  - key: cas-typique
    format: course
    question: Dans quel cas typique le morse évite-t-il un appel en double ou une ligne de plus ?
    choices:
      - {text: "Lire des blocs jusqu'au bloc vide, dans la condition du `while`", correct: true}
      - {text: "Déclarer une variable sans lui donner de valeur initiale", correct: false}
      - {text: "Affecter un attribut d'objet dans la condition d'un `if`", correct: false}
      - {text: "Échanger deux variables sans variable temporaire", correct: false}
    answer: "`while (bloc := f.read(1024)):` lit, affecte et teste en une ligne. Sans morse, il faut lire avant la boucle et à la fin de chaque tour."
  - key: vf-instruction-seule
    format: true-false
    question: "`x := 5`, seul sur une ligne, est une instruction valide."
    truth: false
    answer: "C'est une `SyntaxError` : comme instruction, on écrit `x = 5`. Entre parenthèses, `(x := 5)` serait accepté, mais n'a aucun intérêt."
  - key: vf-comprehension-fuite
    format: true-false
    question: Dans une compréhension, la variable affectée par `:=` reste accessible après la compréhension.
    truth: true
    answer: "Elle appartient à la portée englobante, et garde la dernière valeur affectée. La variable de boucle de la compréhension, elle, ne fuit pas."
  - key: vf-attribut
    format: true-false
    question: On peut écrire `(self.total := 0)` avec l'opérateur morse.
    truth: false
    answer: "Seul un nom simple peut être affecté par `:=` : « cannot use assignment expressions with attribute »."
  - key: vf-pep572
    format: true-false
    question: L'opérateur `:=` a été introduit par la PEP 572.
    truth: true
    answer: "« Assignment Expressions », pour Python 3.8."
  - key: qcm-valeur-sans-parentheses
    format: multiple-choice
    question: "Que vaut `n` après `if n := 3 > 2: pass` ?"
    choices:
      - {text: "`True`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "`False`", correct: false}
    answer: "Sans parenthèses, Python calcule `3 > 2`, puis affecte ce booléen à `n`."
  - key: qcm-filtre-sans-double-appel
    format: multiple-choice
    question: Quelle écriture garde les résultats positifs de `f(x)` sans appeler `f` deux fois pour un même `x` ?
    choices:
      - {text: "`[y for x in xs if (y := f(x)) > 0]`", correct: true}
      - {text: "`[f(x) for x in xs if f(x) > 0]`", correct: false}
      - {text: "`[y := f(x) for x in xs if y > 0]`", correct: false}
      - {text: "`[y for x in xs if (y = f(x)) > 0]`", correct: false}
    answer: "Le filtre s'évalue avant l'expression : il affecte `y`, que l'expression réutilise. La deuxième écriture appelle `f` deux fois ; la troisième lit `y` avant de l'affecter ; la quatrième est une `SyntaxError`."
  - key: qcm-interdit
    format: multiple-choice
    question: Où l'opérateur morse est-il interdit sans parenthèses ?
    choices:
      - {text: "Comme instruction seule, en début de ligne", correct: true}
      - {text: "Dans la condition d'un `while`", correct: false}
      - {text: "Dans la condition d'un `if`", correct: false}
      - {text: "Dans la condition d'un `elif`", correct: false}
    answer: "`while x := f():` et `if x := f():` sont valides (même si la priorité joue souvent des tours). Comme instruction, `x := 5` est refusé."
  - key: qcm-cible
    format: multiple-choice
    question: Que peut-on placer à gauche de `:=` ?
    choices:
      - {text: "Un nom simple seulement, comme `n`", correct: true}
      - {text: "Un nom, un attribut ou un indice", correct: false}
      - {text: "Un tuple de noms, comme `a, b`", correct: false}
      - {text: "Toute expression qui produit une valeur", correct: false}
    answer: "La PEP 572 limite volontairement la cible à un identifiant. Pour un attribut ou un indice, on garde l'affectation ordinaire."
  - key: trous-lire-blocs
    format: fill-in
    question: |-
      Complète pour lire des blocs jusqu'au bloc vide :
      ```python
      while (bloc ___ fichier.read(1024)):
          traiter(bloc)
      ```
    blanks: [[":="]]
    answer: "Le bloc lu est affecté à `bloc`, puis testé : un bloc vide est faux, et la boucle s'arrête."
  - key: trous-nom-reutilise
    format: fill-in
    question: |-
      Complète pour garder les carrés supérieurs à 10 :
      ```python
      grands = [c for x in xs if (___ := x * x) > 10]
      ```
    blanks: [[c]]
    answer: "Le filtre affecte `c`, que l'expression de la compréhension réutilise : le carré n'est calculé qu'une fois."
  - key: trous-correspondance
    format: fill-in
    question: |-
      Complète pour tester et garder la correspondance d'une expression régulière :
      ```python
      if (m := re.match(r"(\d+)", texte)) ___ None:
          print(m.group(1))
      ```
    blanks: [["is not", "!="]]
    answer: "`re.match` renvoie `None` s'il ne trouve rien. `is not None` est l'écriture recommandée."
  - key: trous-jusqu-a-fin
    format: fill-in
    question: |-
      Complète pour traiter les commandes jusqu'à « fin » :
      ```python
      while (commande := lire()) ___ "fin":
          executer(commande)
      ```
    blanks: [["!="]]
    answer: "Les parenthèses isolent l'affectation ; la comparaison porte ensuite sur la valeur lue."
  - key: code-trop-long
    format: code-output
    question: |-
      ```python
      donnees = [1, 2, 3, 4]
      if (n := len(donnees)) > 3:
          print("trop long :", n)
      ```
    check:
      output: "trop long : 4"
    choices:
      - {text: "`trop long : 4`", correct: true}
      - {text: "`trop long : True`", correct: false}
      - {text: "`trop long : 3`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Les parenthèses font affecter la longueur, 4, puis la comparer à 3."
  - key: code-priorite
    format: code-output
    question: |-
      ```python
      if n := 10 > 5:
          print(n)
      ```
    check:
      output: "True"
    choices:
      - {text: "`True`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "Ça ne compile pas : une `SyntaxError`", correct: false}
    answer: "Sans parenthèses, `n` reçoit le résultat de `10 > 5`. Le code est valide : dans un `if`, le morse est permis sans parenthèses."
  - key: code-comprehension
    format: code-output
    question: |-
      ```python
      valeurs = [3, 8, 1, 9]
      grands = [y for x in valeurs if (y := x * 2) > 6]
      print(grands, y)
      ```
    check:
      output: "[16, 18] 18"
    choices:
      - {text: "`[16, 18] 18`", correct: true}
      - {text: "`[16, 18] 2`", correct: false}
      - {text: "`[8, 9] 18`", correct: false}
      - {text: "Une `NameError` sur `y`", correct: false}
    answer: "Les doubles valent 6, 16, 2 et 18 ; seuls 16 et 18 dépassent 6. `y` fuit dans la portée englobante, avec la dernière valeur affectée : 18."
  - key: code-while-morceaux
    format: code-output
    question: |-
      ```python
      morceaux = ["ab", "cd", ""]
      i = 0
      total = ""
      while (m := morceaux[i]):
          total += m
          i += 1
      print(total, i)
      ```
    check:
      output: "abcd 2"
    choices:
      - {text: "`abcd 2`", correct: true}
      - {text: "`abcd 3`", correct: false}
      - {text: "`ab 1`", correct: false}
      - {text: "`abcd 1`", correct: false}
    answer: "La chaîne vide est fausse : la boucle s'arrête quand `m` vaut `\"\"`, avec `i` à 2."
  - key: bug-priorite-booleen
    format: bug-fix
    question: |-
      Ce code affiche « True mots, c'est trop » au lieu de « 4 mots, c'est trop ». Quelle correction est la bonne ?
      ```python
      mots = ["un", "deux", "trois", "quatre"]
      if n := len(mots) > 3:
          print(f"{n} mots, c'est trop")
      ```
    choices:
      - {text: "Entourer l'affectation : `if (n := len(mots)) > 3:`", correct: true}
      - {text: "Entourer la comparaison : `if n := (len(mots) > 3):`", correct: false}
      - {text: "Remplacer `:=` par `=` : `if n = len(mots) > 3:`", correct: false}
      - {text: "Convertir : `if n := int(len(mots) > 3):`", correct: false}
    answer: |-
      ```python
      if (n := len(mots)) > 3:
          print(f"{n} mots, c'est trop")
      ```
      `:=` a la priorité la plus basse : sans parenthèses, `n` reçoit le résultat de la comparaison. `int(True)` donnerait 1.
  - key: bug-instruction-morse
    format: bug-fix
    question: |-
      Python répond « SyntaxError: invalid syntax » sur la première ligne. Quelle correction est la bonne ?
      ```python
      total := 0
      for x in [1, 2, 3]:
          total += x
      print(total)
      ```
    choices:
      - {text: "`total = 0`", correct: true}
      - {text: "`total: = 0`", correct: false}
      - {text: "`let total := 0`", correct: false}
      - {text: "`total == 0`", correct: false}
    answer: |-
      ```python
      total = 0
      ```
      Comme instruction, on affecte avec `=`. Le morse sert à affecter à l'intérieur d'une expression. `total == 0` comparerait un nom qui n'existe pas encore.
  - key: bug-morse-attribut
    format: bug-fix
    question: |-
      Python refuse ce code : « cannot use assignment expressions with attribute ». Quelle correction est la bonne ?
      ```python
      class Compteur:
          pass

      c = Compteur()
      if (c.valeur := 5) > 3:
          print(c.valeur)
      ```
    choices:
      - {text: "Affecter d'abord : `c.valeur = 5`, puis `if c.valeur > 3:`", correct: true}
      - {text: "Écrire `if (c.valeur = 5) > 3:` avec un seul égal", correct: false}
      - {text: "Écrire `if (self.valeur := 5) > 3:` à la place", correct: false}
      - {text: "Écrire `if c.(valeur := 5) > 3:` pour viser l'attribut", correct: false}
    answer: |-
      ```python
      c.valeur = 5
      if c.valeur > 3:
          print(c.valeur)
      ```
      La cible du morse ne peut être qu'un nom simple. Pour un attribut, on garde l'affectation ordinaire.
  - key: bug-double-calcul
    format: bug-fix
    question: |-
      Ce code affiche « calcul 1 » et « calcul 2 » deux fois chacun : chaque calcul coûteux est fait en double. Quelle correction est la bonne ?
      ```python
      def cher(x):
          print("calcul", x)
          return x * 10

      resultats = [cher(x) for x in [1, 2] if cher(x) > 5]
      print(resultats)
      ```
    choices:
      - {text: "`[y for x in [1, 2] if (y := cher(x)) > 5]`", correct: true}
      - {text: "`[y := cher(x) for x in [1, 2] if y > 5]`", correct: false}
      - {text: "`[cher(x) for x in [1, 2] if x > 5]`", correct: false}
      - {text: "`[y for x in [1, 2] if y := cher(x) > 5]`", correct: false}
    answer: |-
      ```python
      resultats = [y for x in [1, 2] if (y := cher(x)) > 5]
      ```
      Le filtre calcule et garde la valeur ; l'expression la réutilise. Sans parenthèses dans un filtre, le morse est une `SyntaxError` ; et filtrer sur `x` ne teste plus le résultat.
