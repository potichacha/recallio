notion: indentation-blocs
lesson: |-
  En Python, **l'indentation fait les blocs** : pas d'accolades, pas de `begin` ni de `end`. Une ligne qui ouvre un
  bloc (`if`, `elif`, `else`, `for`, `while`, `def`, `class`, `with`, `try`...) se termine par **deux-points** `:`, et
  les lignes du bloc sont indentées d'un cran de plus.

  ```python
  for prix in [12, 30, 8]:
      if prix > 10:
          print(prix, "est cher")
      else:
          print(prix, "est bon marché")
  print("fin")          # revenu au niveau du for : hors de la boucle
  ```

  - **Quatre espaces** par niveau (PEP 8), jamais de tabulations mélangées aux espaces.
  - Toutes les lignes d'un bloc ont **la même** indentation ; le bloc se termine à la première ligne qui revient au
    niveau d'avant. Une ligne vide ne termine rien.
  - Un bloc ne peut pas être vide : on y met `pass` (ou `...`) en attendant d'écrire le code.
  - À l'intérieur de parenthèses, de crochets ou d'accolades ouverts, les lignes de continuation sont libres :
    l'indentation n'y définit pas de bloc.

  **Les erreurs**, détectées avant toute exécution :

  | Code | Erreur |
  |---|---|
  | `if x > 0:` suivi d'une ligne non indentée | `IndentationError: expected an indented block after 'if' statement on line 1` |
  | une ligne indentée sans `:` au-dessus | `IndentationError: unexpected indent` |
  | une ligne qui revient à un niveau qui n'existe pas | `IndentationError: unindent does not match any outer indentation level` |
  | tabulations et espaces mélangés | `TabError: inconsistent use of tabs and spaces in indentation` |
  | `if x > 0` sans deux-points | `SyntaxError: expected ':'` |

  **Le piège logique** : une ligne au mauvais niveau ne provoque pas d'erreur, elle change le sens du programme. Un
  `print` indenté sous le `for` s'exécute à chaque tour ; au niveau du `for`, une seule fois après la boucle.

  Et pour qui regrette les accolades : `from __future__ import braces` répond `SyntaxError: not a chance`.

  **En entretien** : « Les blocs sont délimités par l'indentation, après une ligne qui finit par deux-points ; PEP 8
  impose quatre espaces. Un bloc vide demande `pass`. Une erreur d'indentation est une `SyntaxError` détectée avant
  l'exécution, mais une ligne au mauvais niveau peut aussi, sans erreur, changer la logique. »
tour:
  - title: Les blocs par l'indentation
    text: |-
      Pas d'accolades en Python : un bloc commence après une ligne qui finit par `:`, et comprend toutes les lignes
      indentées sous elle. Il s'arrête à la première ligne qui revient au niveau d'avant. La convention est de quatre
      espaces par niveau.

      Ici, la boucle `for` contient un `if` et un `else`, eux-mêmes chacun un bloc. Le dernier `print` est revenu au
      niveau du `for` : il ne s'exécute qu'une fois.

      Essaie : indente le dernier `print` de quatre espaces, puis exécute. Il s'affiche à chaque tour de boucle.
    example:
      files:
        main.py: |-
          for prix in [12, 30, 8]:
              if prix > 10:
                  print(prix, "est cher")
              else:
                  print(prix, "est bon marché")
          print("fin")
      output: |-
        12 est cher
        30 est cher
        8 est bon marché
        fin
    task:
      instructions: |-
        Le programme affiche le total à chaque tour de boucle. Change l'indentation d'une seule ligne pour qu'il
        n'affiche que `total : 60`, une fois.
      starter:
        main.py: |-
          total = 0
          for prix in [10, 20, 30]:
              total += prix
              print("total :", total)
      solution:
        main.py: |-
          total = 0
          for prix in [10, 20, 30]:
              total += prix
          print("total :", total)
      output: |-
        total : 60
cards:
  - key: delimiter-bloc
    format: course
    question: Qu'est-ce qui délimite un bloc de code en Python ?
    choices:
      - {text: "L'indentation, après une ligne qui finit par `:`", correct: true}
      - {text: "Les accolades `{` et `}`, comme en Java", correct: false}
      - {text: "Les mots-clés `begin` et `end`", correct: false}
      - {text: "Une ligne vide avant et après le bloc", correct: false}
    answer: "Les lignes indentées sous `if x > 0:` forment le bloc du `if`. Les accolades servent aux dictionnaires et aux ensembles."
  - key: quatre-espaces
    format: course
    question: Combien d'espaces PEP 8 recommande-t-il par niveau d'indentation ?
    choices:
      - {text: "Quatre espaces", correct: true}
      - {text: "Deux espaces", correct: false}
      - {text: "Huit espaces", correct: false}
      - {text: "Une tabulation", correct: false}
    answer: "Quatre espaces, et pas de tabulations. Les éditeurs et les formateurs (Black, Ruff) l'appliquent d'eux-mêmes."
  - key: unexpected-indent
    format: course
    question: "Quand Python lève-t-il `IndentationError: unexpected indent` ?"
    choices:
      - {text: "Quand une ligne est indentée sans qu'un `:` ouvre un bloc au-dessus", correct: true}
      - {text: "Quand un bloc ouvert par `:` ne contient aucune ligne indentée", correct: false}
      - {text: "Quand une ligne dépasse 79 caractères, la limite de PEP 8", correct: false}
      - {text: "Quand un bloc contient plus de quatre niveaux imbriqués", correct: false}
    answer: "Une indentation inattendue : rien n'ouvre de bloc à cet endroit. Le cas inverse, un bloc vide après `:`, donne « expected an indented block »."
  - key: fin-de-bloc
    format: course
    question: Comment Python sait-il qu'un bloc `if` est terminé ?
    choices:
      - {text: "La ligne suivante revient au niveau d'indentation du `if`", correct: true}
      - {text: "Un mot-clé `endif`, au niveau du `if`, ferme le bloc", correct: false}
      - {text: "Une ligne vide, après la dernière ligne du bloc", correct: false}
      - {text: "Un point-virgule à la fin de la dernière ligne du bloc", correct: false}
    answer: "Le bloc s'arrête à la première ligne moins indentée. Les lignes vides, elles, ne comptent pas."
  - key: vf-ligne-vide
    format: true-false
    question: En Python, une ligne vide suffit à terminer un bloc `if`.
    truth: false
    answer: "Seul le retour à une indentation plus faible termine le bloc. Les lignes vides sont ignorées."
  - key: vf-taberror
    format: true-false
    question: Mélanger tabulations et espaces dans l'indentation d'un même bloc peut provoquer une `TabError`.
    truth: true
    answer: "« TabError: inconsistent use of tabs and spaces in indentation ». D'où la règle de PEP 8 : des espaces seulement."
  - key: vf-bloc-vide
    format: true-false
    question: "Un bloc `if` peut rester vide : on écrit `if x > 0:`, puis directement la suite du programme."
    truth: false
    answer: "C'est une `IndentationError` (« expected an indented block »). Un bloc qui ne fait rien encore contient `pass`."
  - key: vf-parentheses
    format: true-false
    question: Dans une liste écrite sur plusieurs lignes, entre crochets, l'indentation des lignes ne définit pas de bloc.
    truth: true
    answer: "Tant qu'une parenthèse, un crochet ou une accolade est ouvert, les lignes se joignent : leur indentation est libre, on l'aligne pour la lisibilité."
  - key: qcm-caractere-ouvrant
    format: multiple-choice
    question: Quel caractère termine la ligne qui ouvre un bloc (`if`, `for`, `def`) ?
    choices:
      - {text: "`:`", correct: true}
      - {text: "`;`", correct: false}
      - {text: "`{`", correct: false}
      - {text: "`=>`", correct: false}
    answer: "Les deux-points annoncent un bloc : `if x > 0:`, `for x in xs:`, `def f():`."
  - key: qcm-future-braces
    format: multiple-choice
    question: "Que donne `from __future__ import braces` ?"
    choices:
      - {text: "Une `SyntaxError` : « not a chance »", correct: true}
      - {text: "Les accolades deviennent permises pour les blocs", correct: false}
      - {text: "Un avertissement : la fonction est dépréciée", correct: false}
      - {text: "Une `ImportError` : le module n'existe pas", correct: false}
    answer: "Une plaisanterie des développeurs de Python : les accolades pour les blocs n'arriveront jamais."
  - key: qcm-oubli-deux-points
    format: multiple-choice
    question: Quelle erreur obtient-on en écrivant `if x > 0` sans les deux-points ?
    choices:
      - {text: "`SyntaxError: expected ':'`", correct: true}
      - {text: "`IndentationError: unexpected indent`", correct: false}
      - {text: "`NameError: name 'if' is not defined`", correct: false}
      - {text: "`TypeError: 'bool' object is not callable`", correct: false}
    answer: "Python signale qu'il attendait les deux-points, avant même d'exécuter la première ligne du fichier."
  - key: qcm-niveaux-differents
    format: multiple-choice
    question: Que se passe-t-il si les lignes d'un même bloc n'ont pas la même indentation ?
    choices:
      - {text: "Python lève une `IndentationError` avant d'exécuter le fichier", correct: true}
      - {text: "Python réaligne les lignes de lui-même, puis exécute le fichier", correct: false}
      - {text: "Python exécute le fichier, mais saute les lignes mal alignées", correct: false}
      - {text: "Python affiche un avertissement, puis exécute le fichier", correct: false}
    answer: "L'indentation est vérifiée à la compilation du fichier : une incohérence l'empêche de s'exécuter, même si la ligne fautive n'est jamais atteinte."
  - key: code-bloc-saute
    format: code-output
    question: |-
      ```python
      x = 5
      if x > 10:
          print("grand")
          print("très grand")
      print("fin")
      ```
    answer: "`fin` : les deux premiers `print` sont dans le bloc du `if`, qui n'est pas exécuté ; le dernier est hors du bloc."
    check:
      output: "fin"
    choices:
      - {text: "`fin`", correct: true}
      - text: |-
          ```
          très grand
          fin
          ```
        correct: false
      - text: |-
          ```
          grand
          très grand
          fin
          ```
        correct: false
      - {text: "Rien", correct: false}
  - key: code-somme-boucle
    format: code-output
    question: |-
      ```python
      total = 0
      for n in [1, 2, 3]:
          total += n
      print(total)
      ```
    answer: "`6` : le `print` est revenu au niveau du `for`, il s'exécute une fois, après la boucle."
    check:
      output: "6"
    choices:
      - {text: "`6`", correct: true}
      - text: |-
          ```
          1
          3
          6
          ```
        correct: false
      - {text: "`3`", correct: false}
      - {text: "`0`", correct: false}
  - key: code-bloc-non-indente
    format: code-output
    question: |-
      ```python
      x = 5
      if x > 0:
      print("positif")
      ```
    answer: "Ça ne compile pas : `IndentationError: expected an indented block after 'if' statement on line 2`, une sorte de `SyntaxError`, levée avant toute exécution."
    check:
      compiles: false
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`positif`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Une `NameError`", correct: false}
  - key: code-blocs-imbriques
    format: code-output
    question: |-
      ```python
      message = "début"
      if True:
          message = "dans le bloc"
          if False:
              message = "imbriqué"
      print(message)
      ```
    answer: "`dans le bloc` : le premier `if` s'exécute, le second, imbriqué, non."
    check:
      output: "dans le bloc"
    choices:
      - {text: "`dans le bloc`", correct: true}
      - {text: "`imbriqué`", correct: false}
      - {text: "`début`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
  - key: bug-bloc-vide
    format: bug-fix
    question: |-
      Ce script refuse de se lancer : « IndentationError: expected an indented block after 'if' statement on line 2 ».
      ```python
      x = 3
      if x > 0:
      print("positif")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Indenter `print(\"positif\")` de quatre espaces", correct: true}
      - {text: "Retirer les deux-points après `if x > 0`", correct: false}
      - {text: "Mettre le `if` et le `print` entre accolades", correct: false}
      - {text: "Ajouter une ligne vide entre le `if` et le `print`", correct: false}
    answer: |-
      ```python
      x = 3
      if x > 0:
          print("positif")
      ```
      Les deux-points ouvrent un bloc, qui doit contenir au moins une ligne indentée.
  - key: bug-indentation-inattendue
    format: bug-fix
    question: |-
      Ce script refuse de se lancer : « IndentationError: unexpected indent ».
      ```python
      x = 3
          print(x)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Retirer l'indentation de `print(x)`", correct: true}
      - {text: "Indenter aussi la ligne `x = 3`", correct: false}
      - {text: "Ajouter un point-virgule après `x = 3`", correct: false}
      - {text: "Remplacer les espaces par une tabulation", correct: false}
    answer: |-
      ```python
      x = 3
      print(x)
      ```
      Aucune ligne terminée par `:` n'ouvre de bloc : `print(x)` doit rester au niveau de `x = 3`.
  - key: bug-deux-points
    format: bug-fix
    question: |-
      Ce script refuse de se lancer : « SyntaxError: expected ':' ».
      ```python
      x = 3
      if x > 0
          print("positif")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `if x > 0:`", correct: true}
      - {text: "Écrire `if (x > 0)`", correct: false}
      - {text: "Écrire `if x > 0 then`", correct: false}
      - {text: "Écrire `if x > 0 {`", correct: false}
    answer: |-
      ```python
      x = 3
      if x > 0:
          print("positif")
      ```
      Les deux-points sont obligatoires à la fin de la ligne qui ouvre le bloc ; les parenthèses autour de la condition
      sont inutiles.
  - key: bug-print-dans-boucle
    format: bug-fix
    question: |-
      Ce script devait afficher le total une seule fois, mais il affiche trois lignes :
      ```python
      total = 0
      for prix in [10, 20, 30]:
          total += prix
          print("Total :", total)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ramener le `print` au niveau du `for`", correct: true}
      - {text: "Ajouter `break` après le `print`", correct: false}
      - {text: "Indenter le `print` de quatre espaces de plus", correct: false}
      - {text: "Ajouter une ligne vide avant le `print`", correct: false}
    answer: |-
      ```python
      total = 0
      for prix in [10, 20, 30]:
          total += prix
      print("Total :", total)
      ```
      Indenté sous le `for`, le `print` fait partie de la boucle. Au niveau du `for`, il s'exécute une fois, après.
