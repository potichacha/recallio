notion: pass-ellipsis
lesson: |-
  En Python, **un bloc ne peut pas être vide** : après un `if`, un `for`, un `def` ou un `class`, il faut au moins une
  instruction indentée. Sinon : `IndentationError: expected an indented block after 'if' statement on line 1`. Un
  commentaire ne compte pas : ce n'est pas une instruction.

  **`pass`** est l'instruction qui ne fait rien. Elle occupe la place d'un bloc obligatoire :

  ```python
  class Configuration:
      pass                      # une classe vide, à remplir plus tard

  for n in nombres:
      if n < 0:
          pass                  # rien à faire pour l'instant
      else:
          traiter(n)
  ```

  **`...`** (trois points) est le littéral de l'objet unique **`Ellipsis`**. Comme toute expression, il peut servir
  d'instruction, et il ne fait rien. On le trouve surtout :

  - dans les corps de « talon » (stub) : fichiers `.pyi`, méthodes d'un `Protocol`, méthodes abstraites ;
  - dans les annotations : `tuple[int, ...]` (un tuple d'entiers de longueur quelconque), `Callable[..., int]` ;
  - en NumPy, pour découper un tableau à plusieurs dimensions (`a[..., 0]`).

  | Écriture | Effet | Usage |
  |---|---|---|
  | `pass` | rien | un bloc à remplir, une classe vide |
  | `...` | rien (évalue `Ellipsis`) | un talon, une signature sans corps |
  | `raise NotImplementedError` | lève une exception | une fonction pas encore écrite, qui doit échouer bruyamment |
  | `continue` | passe au tour suivant | dans une boucle seulement ; ce n'est pas « rien » |

  Une docstring seule suffit aussi à former un corps : c'est une expression.

  Attention à `except ValueError: pass`, qui fait disparaître une erreur sans laisser de trace : on le réserve aux cas
  où l'on sait pourquoi l'erreur est sans importance, et on le commente.

  **En entretien** : « Un bloc ne peut pas être vide : `pass` est l'instruction qui ne fait rien. `...` est l'objet
  `Ellipsis`, qu'on voit dans les talons et les annotations. Pour une fonction pas encore écrite, mieux vaut
  `raise NotImplementedError`, qui échoue au lieu de renvoyer `None` en silence. »
tour:
  - title: "pass et ... : ne rien faire"
    text: |-
      Un bloc ne peut pas être vide en Python. `pass` est l'instruction qui ne fait rien : elle tient la place d'un
      corps à écrire plus tard.

      `...` (l'objet `Ellipsis`) peut jouer le même rôle ; on le voit surtout dans les signatures sans corps.

      Essaie : retire le `pass` de la fonction, puis exécute. Python refuse le programme : il attend un bloc indenté.
    example:
      files:
        main.py: |-
          def a_ecrire_plus_tard():
              pass


          class Configuration:
              ...


          for n in range(5):
              if n % 2 == 0:
                  pass  # rien à faire pour les pairs, pour l'instant
              else:
                  print("impair :", n)

          print(a_ecrire_plus_tard())
          print(Ellipsis is ...)
      output: |-
        impair : 1
        impair : 3
        None
        True
cards:
  - key: que-fait-pass
    format: course
    question: Que fait l'instruction `pass` ?
    choices:
      - {text: "Rien : elle tient la place d'un bloc obligatoire", correct: true}
      - {text: "Elle passe au tour suivant de la boucle", correct: false}
      - {text: "Elle sort de la fonction en renvoyant `None`", correct: false}
      - {text: "Elle ignore l'exception levée dans le bloc", correct: false}
    answer: "`pass` n'a aucun effet. Passer au tour suivant, c'est `continue` ; sortir, `return`."
  - key: pourquoi-pass
    format: course
    question: Pourquoi Python a-t-il besoin de l'instruction `pass` ?
    choices:
      - {text: "Un bloc ne peut pas être vide : il faut au moins une instruction", correct: true}
      - {text: "Pour marquer la fin d'un bloc, à la place de l'accolade", correct: false}
      - {text: "Pour déclarer une méthode abstraite, que les sous-classes redéfinissent", correct: false}
      - {text: "Pour accélérer une boucle en sautant un tour", correct: false}
    answer: "L'indentation délimite les blocs : un bloc vide serait invisible. Python exige donc au moins une instruction, et `pass` est celle qui ne fait rien."
  - key: qu-est-ellipsis
    format: course
    question: Qu'est-ce que `...` en Python ?
    choices:
      - {text: "Le littéral de l'objet unique `Ellipsis`, qui ne fait rien seul", correct: true}
      - {text: "Un commentaire qui s'étend sur plusieurs lignes", correct: false}
      - {text: "Un opérateur qui déballe une liste dans un appel", correct: false}
      - {text: "Une syntaxe réservée aux fichiers d'annotations `.pyi`", correct: false}
    answer: "`...` est une expression qui vaut `Ellipsis`. Utilisée comme instruction, elle ne fait rien ; on la trouve dans les talons, les annotations et NumPy."
  - key: echouer-bruyamment
    format: course
    question: Une fonction pas encore écrite doit échouer si on l'appelle. Que mettre dans son corps ?
    choices:
      - {text: "`raise NotImplementedError`", correct: true}
      - {text: "`pass`", correct: false}
      - {text: "`...`", correct: false}
      - {text: "`return`", correct: false}
    answer: "`pass`, `...` et `return` font renvoyer `None` en silence : l'appelant ne voit pas que la fonction n'existe pas encore. L'exception le lui dit."
  - key: vf-corps-ellipsis
    format: true-false
    question: Un corps de fonction réduit à `...` est valide.
    truth: true
    answer: "`...` est une expression, donc une instruction valide. La fonction renvoie `None`."
  - key: vf-pass-continue
    format: true-false
    question: "`pass` et `continue` ont le même effet dans une boucle."
    truth: false
    answer: "`pass` ne fait rien : la suite du corps s'exécute. `continue` saute la suite du corps et passe au tour suivant."
  - key: vf-if-vide
    format: true-false
    question: Un bloc `if` sans aucune instruction indentée lève une `IndentationError`.
    truth: true
    answer: "« expected an indented block after 'if' statement ». L'erreur se produit avant l'exécution, à la lecture du fichier."
  - key: vf-commentaire-corps
    format: true-false
    question: Un commentaire seul suffit à former le corps d'une fonction.
    truth: false
    answer: "Un commentaire n'est pas une instruction : Python l'ignore, et le bloc reste vide. Une docstring, elle, suffit : c'est une expression."
  - key: qcm-commentaire-todo
    format: multiple-choice
    question: "Un bloc `if` ne contient qu'un commentaire `# TODO`. Que se passe-t-il ?"
    choices:
      - {text: "Une `IndentationError` : un commentaire n'est pas une instruction", correct: true}
      - {text: "Rien : le commentaire compte comme une instruction vide", correct: false}
      - {text: "Un avertissement, puis le programme continue normalement", correct: false}
      - {text: "Le `if` est ignoré, ainsi que son éventuel `else`", correct: false}
    answer: "Les commentaires disparaissent à la lecture du code : le bloc est vide, et Python le refuse. On ajoute `pass` sous le commentaire."
  - key: qcm-ou-ellipsis
    format: multiple-choice
    question: Où rencontre-t-on souvent `...` plutôt que `pass` ?
    choices:
      - {text: "Dans les corps des talons et des méthodes d'un `Protocol`", correct: true}
      - {text: "Dans les boucles, pour passer au tour suivant", correct: false}
      - {text: "Dans les `except`, pour relancer l'exception", correct: false}
      - {text: "Dans les f-strings, pour tronquer une valeur", correct: false}
    answer: "Par convention, `...` marque une signature sans implémentation : fichiers `.pyi`, `Protocol`, surcharges `@overload`."
  - key: qcm-type-ellipsis
    format: multiple-choice
    question: Que vaut `type(...)` ?
    choices:
      - {text: "`<class 'ellipsis'>`", correct: true}
      - {text: "`<class 'NoneType'>`", correct: false}
      - {text: "`<class 'NotImplementedType'>`", correct: false}
      - {text: "`<class 'pass'>`", correct: false}
    answer: "`...` est l'unique instance du type `ellipsis`, comme `None` est l'unique instance de `NoneType`."
  - key: qcm-except-pass
    format: multiple-choice
    question: "Pourquoi `except ValueError: pass` est-il à manier avec prudence ?"
    choices:
      - {text: "L'erreur disparaît sans trace : un bug peut passer inaperçu", correct: true}
      - {text: "Il relance l'exception juste après le bloc `except`", correct: false}
      - {text: "Il ralentit fortement le programme à chaque appel", correct: false}
      - {text: "Il est refusé par Python depuis la version 3.12", correct: false}
    answer: "Ignorer une erreur est parfois légitime, mais doit rester un choix explicite et commenté. Pour ce cas, `contextlib.suppress(ValueError)` le dit mieux."
  - key: trous-classe-vide
    format: fill-in
    question: |-
      Complète la classe vide, à remplir plus tard :
      ```python
      class Panier:
          ___
      ```
    blanks: [[pass, "..."]]
    answer: "`pass` (ou `...`) fournit l'instruction que le bloc exige."
  - key: trous-rien-pour-zero
    format: fill-in
    question: |-
      Complète avec l'instruction qui ne fait rien :
      ```python
      for x in valeurs:
          if x == 0:
              ___
          else:
              print(1 / x)
      ```
    blanks: [[pass, "..."]]
    answer: "`pass` occupe le bloc du `if`. Ici, `continue` aurait le même effet, mais ce n'est pas « rien » : il saute la suite du corps."
  - key: trous-pas-implemente
    format: fill-in
    question: |-
      Complète la méthode, qui doit échouer tant qu'elle n'est pas écrite :
      ```python
      def exporter(self):
          raise ___
      ```
    blanks: [[NotImplementedError, "NotImplementedError()"]]
    answer: "`NotImplementedError` signale une fonctionnalité manquante. À ne pas confondre avec `NotImplemented`, la valeur que renvoient les opérateurs."
  - key: trous-tuple-quelconque
    format: fill-in
    question: |-
      Complète l'annotation d'un tuple d'entiers de longueur quelconque :
      ```python
      scores: tuple[int, ___] = (12, 15, 9)
      ```
    blanks: [["..."]]
    answer: "`tuple[int, ...]` : des entiers, autant qu'on veut. `tuple[int]` désignerait un tuple d'un seul entier."
