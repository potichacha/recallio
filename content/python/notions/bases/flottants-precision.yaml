notion: flottants-precision
lesson: |-
  Un `float` est un nombre **binaire** sur 64 bits (IEEE 754). Comme 1/3 n'a pas d'écriture décimale finie, 0,1 n'a
  pas d'écriture **binaire** finie : il est stocké arrondi. Les petites erreurs s'accumulent :

  ```python
  0.1 + 0.2              # 0.30000000000000004
  0.1 + 0.2 == 0.3       # False
  ```

  Ce n'est pas un défaut de Python : Java, JavaScript ou C donnent le même résultat. Python affiche la plus courte
  écriture qui redonne le même flottant, d'où `0.1` à l'écran, alors que la valeur stockée est
  0.1000000000000000055511151231257827021181583404541015625.

  **Comparer des flottants** : jamais avec `==`, mais avec une tolérance.

  ```python
  import math
  math.isclose(0.1 + 0.2, 0.3)              # True : tolérance relative de 1e-09
  math.isclose(1e-12, 0.0)                  # False : près de zéro, il faut...
  math.isclose(1e-12, 0.0, abs_tol=1e-9)    # True : ...une tolérance absolue
  ```

  Dans les tests, `pytest.approx` joue le même rôle.

  **Arrondir** : `round(x, n)` arrondit au **pair** le plus proche dans les cas à mi-chemin (l'arrondi bancaire) :
  `round(0.5)` vaut `0`, `round(2.5)` vaut `2`. Et `round(2.675, 2)` vaut `2.67`, car 2.675 est stocké un peu en
  dessous. Formater (`f"{x:.2f}"`) arrondit l'affichage, pas la valeur.

  **Les montants : `Decimal`.** Le module `decimal` calcule en base 10, exactement :

  ```python
  from decimal import Decimal, ROUND_HALF_UP
  Decimal("0.1") + Decimal("0.2")                       # Decimal('0.3')
  Decimal("2.675").quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)   # Decimal('2.68')
  Decimal(0.1)            # le flottant déjà arrondi : 0.1000000000000000055511151231...
  ```

  On crée un `Decimal` **depuis une chaîne**, jamais depuis un flottant. Autre solution courante : compter en
  **centimes**, avec des `int`.

  | Besoin | Outil |
  |---|---|
  | mesures physiques, calcul scientifique | `float` (rapide, approché) |
  | argent, quantités décimales exactes | `Decimal`, ou des centimes en `int` |
  | fractions exactes (1/3) | `fractions.Fraction` |
  | une longue somme de flottants | `math.fsum` (ou `sum`, qui compense aussi depuis Python 3.12), pas une boucle de `+=` |

  Enfin, `float("inf")` et `float("nan")` existent ; `nan` n'est égal à rien, pas même à lui-même : on le teste avec
  `math.isnan`.

  **En entretien** : « Les flottants sont binaires : 0,1 n'est pas représentable exactement, d'où
  `0.1 + 0.2 != 0.3`. On compare avec `math.isclose`, jamais `==`. Pour de l'argent, `Decimal` créé depuis une
  chaîne, ou des centimes entiers. »
cards:
  - key: pourquoi-pas-egal
    format: course
    question: Pourquoi `0.1 + 0.2 == 0.3` vaut-il `False` ?
    choices:
      - {text: "0,1 et 0,2 n'ont pas d'écriture binaire exacte : la somme vaut 0.30000000000000004", correct: true}
      - {text: "Python arrondit chaque flottant à quinze chiffres avant de faire la comparaison", correct: false}
      - {text: "`==` compare l'identité des deux objets flottants, et non leur valeur", correct: false}
      - {text: "Un défaut connu de CPython, que les autres langages n'ont pas", correct: false}
    answer: "Les flottants sont stockés en binaire, arrondis. Java, JavaScript ou C font la même erreur. On compare avec `math.isclose`."
  - key: comparer-flottants
    format: course
    question: Comment comparer deux flottants qui devraient être égaux ?
    choices:
      - {text: "`math.isclose(a, b)`", correct: true}
      - {text: "`a is b`", correct: false}
      - {text: "`round(a) == round(b)`", correct: false}
      - {text: "`str(a) == str(b)`", correct: false}
    answer: "`isclose` admet une tolérance relative (`rel_tol=1e-09` par défaut), et une tolérance absolue (`abs_tol`) pour les valeurs proches de zéro."
  - key: type-pour-argent
    format: course
    question: Quel type choisir pour des montants en euros ?
    choices:
      - {text: "`decimal.Decimal`, créé depuis des chaînes", correct: true}
      - {text: "`float`, avec un `round` après chaque calcul", correct: false}
      - {text: "`float`, formaté avec `:.2f` à l'affichage", correct: false}
      - {text: "`complex`, pour séparer euros et centimes", correct: false}
    answer: "`Decimal` calcule en base 10, exactement, et choisit son mode d'arrondi. Des centimes en `int` sont l'autre solution courante."
  - key: arrondi-bancaire
    format: course
    question: Pourquoi `round(2.5)` vaut-il `2` ?
    choices:
      - {text: "À mi-chemin, `round` arrondit vers le nombre pair le plus proche", correct: true}
      - {text: "`round` tronque toujours la partie décimale, comme `int`", correct: false}
      - {text: "2.5 est stocké en binaire comme 2.4999999999999999", correct: false}
      - {text: "`round` arrondit toujours vers le bas, comme `math.floor`", correct: false}
    answer: "C'est l'arrondi bancaire : `round(1.5)` et `round(2.5)` valent tous deux `2`, ce qui évite un biais vers le haut. 2.5 est exactement représentable en binaire."
  - key: vf-decimal-depuis-float
    format: true-false
    question: "`Decimal(0.1)` vaut exactement un dixième."
    truth: false
    answer: "Le flottant `0.1` est déjà arrondi : `Decimal(0.1)` en donne la valeur exacte, 0.1000000000000000055511151231257827021181583404541015625. Il faut écrire `Decimal(\"0.1\")`."
  - key: vf-nan
    format: true-false
    question: "`float(\"nan\") == float(\"nan\")` vaut `False`."
    truth: true
    answer: "Selon IEEE 754, `nan` n'est égal à rien, pas même à lui-même. On le teste avec `math.isnan(x)`."
  - key: vf-isclose
    format: true-false
    question: "`math.isclose(0.1 + 0.2, 0.3)` vaut `True`."
    truth: true
    answer: "L'écart, 5,5 × 10⁻¹⁷, est bien sous la tolérance relative par défaut de 10⁻⁹."
  - key: vf-formatage-valeur
    format: true-false
    question: "Formater un flottant avec `f\"{x:.2f}\"` arrondit la valeur stockée dans `x`."
    truth: false
    answer: "Le formatage produit une chaîne arrondie ; `x` ne change pas. Arrondir la valeur, c'est `round(x, 2)`, ou `quantize` sur un `Decimal`."
  - key: qcm-decimal-exact
    format: multiple-choice
    question: Comment crée-t-on le décimal exact 0,1 ?
    choices:
      - {text: "`Decimal(\"0.1\")`", correct: true}
      - {text: "`Decimal(0.1)`", correct: false}
      - {text: "`round(0.1, 1)`", correct: false}
      - {text: "`float(\"0.1\")`", correct: false}
    answer: "Depuis une chaîne, le `Decimal` garde exactement les chiffres écrits. Depuis un flottant, il hérite de son erreur d'arrondi."
  - key: qcm-round-2675
    format: multiple-choice
    question: Que donne `round(2.675, 2)` ?
    choices:
      - {text: "`2.67`", correct: true}
      - {text: "`2.68`", correct: false}
      - {text: "`2.7`", correct: false}
      - {text: "`2.675`", correct: false}
    answer: "2.675 est stocké comme 2.67499999999999982236431605997495353221893310546875 : il est plus près de 2.67. Pour un arrondi commercial, `Decimal(\"2.675\")` et `ROUND_HALF_UP`."
  - key: qcm-isclose-zero
    format: multiple-choice
    question: Pourquoi `math.isclose(1e-12, 0.0)` vaut-il `False` ?
    choices:
      - {text: "La tolérance par défaut est relative : près de zéro, il faut `abs_tol`", correct: true}
      - {text: "`1e-12` est trop petit pour être stocké dans un `float`", correct: false}
      - {text: "`isclose` n'accepte que des valeurs comprises entre 0 et 1", correct: false}
      - {text: "`0.0` doit s'écrire `0` pour que la comparaison fonctionne", correct: false}
    answer: "Une tolérance relative à zéro vaut zéro. `math.isclose(1e-12, 0.0, abs_tol=1e-9)` vaut `True`."
  - key: qcm-fraction
    format: multiple-choice
    question: Quel module représente exactement 1/3 ?
    choices:
      - {text: "`fractions`", correct: true}
      - {text: "`decimal`", correct: false}
      - {text: "`math`", correct: false}
      - {text: "`statistics`", correct: false}
    answer: "`Fraction(1, 3)` garde le numérateur et le dénominateur. `Decimal` est exact en base 10, mais 1/3 n'y a pas d'écriture finie."
  - key: code-somme-classique
    format: code-output
    question: |-
      ```python
      print(0.1 + 0.2)
      ```
    answer: "`0.30000000000000004` : 0,1 et 0,2 sont stockés arrondis en binaire, et l'erreur se voit dans la somme."
    check:
      output: "0.30000000000000004"
    choices:
      - {text: "`0.30000000000000004`", correct: true}
      - {text: "`0.3`", correct: false}
      - {text: "`0.30000000000000001`", correct: false}
      - {text: "`0.29999999999999999`", correct: false}
  - key: code-round-pair
    format: code-output
    question: |-
      ```python
      print(round(0.5), round(1.5), round(2.5))
      ```
    answer: "`0 2 2` : à mi-chemin, `round` choisit le nombre pair."
    check:
      output: "0 2 2"
    choices:
      - {text: "`0 2 2`", correct: true}
      - {text: "`1 2 3`", correct: false}
      - {text: "`0 1 2`", correct: false}
      - {text: "`1 2 2`", correct: false}
  - key: code-decimal-somme
    format: code-output
    question: |-
      ```python
      from decimal import Decimal
      print(Decimal("0.1") + Decimal("0.2"))
      ```
    answer: "`0.3` : `Decimal` calcule exactement en base 10, et `print` affiche sa forme lisible (`str`), sans `Decimal(...)`."
    check:
      output: "0.3"
    choices:
      - {text: "`0.3`", correct: true}
      - {text: "`0.30000000000000004`", correct: false}
      - {text: "`Decimal('0.3')`", correct: false}
      - {text: "`0.30`", correct: false}
  - key: code-tolerance
    format: code-output
    question: |-
      ```python
      print(0.1 * 3 == 0.3, abs(0.1 * 3 - 0.3) < 1e-9)
      ```
    answer: "`False True` : `0.1 * 3` vaut 0.30000000000000004, différent de `0.3`, mais l'écart est minuscule."
    check:
      output: "False True"
    choices:
      - {text: "`False True`", correct: true}
      - {text: "`True True`", correct: false}
      - {text: "`False False`", correct: false}
      - {text: "`True False`", correct: false}
  - key: bug-egalite-flottants
    format: bug-fix
    question: |-
      Ce code affiche `écart : 0.30000000000000004` au lieu de `compte juste` :
      ```python
      total = 0.1 + 0.2
      if total == 0.3:
          print("compte juste")
      else:
          print("écart :", total)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`import math`, puis `if math.isclose(total, 0.3):`", correct: true}
      - {text: "`if total is 0.3:`", correct: false}
      - {text: "`if int(total) == int(0.3):`", correct: false}
      - {text: "`if float(total) == float(0.3):`", correct: false}
    answer: |-
      ```python
      import math

      total = 0.1 + 0.2
      if math.isclose(total, 0.3):
          print("compte juste")
      else:
          print("écart :", total)
      ```
      Deux flottants calculés différemment diffèrent souvent d'un rien : on les compare avec une tolérance.
  - key: bug-decimal-float
    format: bug-fix
    question: |-
      Ce code affiche `0.3000000000000000166533453694` au lieu de `0.3` :
      ```python
      from decimal import Decimal
      prix = Decimal(0.1)
      print(prix * 3)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`prix = Decimal(\"0.1\")`", correct: true}
      - {text: "`prix = Decimal(round(0.1, 1))`", correct: false}
      - {text: "`prix = Decimal(0.1).normalize()`", correct: false}
      - {text: "`prix = Decimal(float(\"0.1\"))`", correct: false}
    answer: |-
      ```python
      from decimal import Decimal
      prix = Decimal("0.1")
      print(prix * 3)
      ```
      Créé depuis le flottant `0.1`, le `Decimal` reprend son erreur d'arrondi. Depuis la chaîne `"0.1"`, il vaut
      exactement un dixième, et le produit `0.3`.
  - key: bug-arrondi-commercial
    format: bug-fix
    question: |-
      La facture doit arrondir 2,675 € à 2,68 €, mais ce code affiche `2.67` :
      ```python
      prix = 2.675
      print(round(prix, 2))
      ```
      Quelle correction est la bonne ?
    choices:
      - text: |-
          `Decimal("2.675").quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)`
        correct: true
      - text: |-
          `round(prix + 0.001, 2)`, pour forcer l'arrondi vers le haut dans tous les cas
        correct: false
      - text: |-
          `float(f"{prix:.2f}")`, qui arrondit à l'affichage puis reconvertit en flottant
        correct: false
      - text: |-
          `round(prix, 3)`, puis `round` du résultat à deux décimales en second
        correct: false
    answer: |-
      ```python
      from decimal import Decimal, ROUND_HALF_UP

      prix = Decimal("2.675")
      print(prix.quantize(Decimal("0.01"), rounding=ROUND_HALF_UP))
      ```
      Le flottant 2.675 est stocké un peu en dessous (2.67499999...), et `round` arrondit en plus au pair. `Decimal`,
      créé depuis une chaîne, garde la valeur exacte et applique l'arrondi commercial demandé.
  - key: bug-accumulation
    format: bug-fix
    question: |-
      Après dix versements de 0,10 €, ce code affiche `False 0.9999999999999999` :
      ```python
      solde = 0.0
      for _ in range(10):
          solde += 0.1
      print(solde == 1.0, solde)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Compter en centimes entiers : `solde += 10`, comparé à `100`", correct: true}
      - {text: "Écrire `solde += 0.10`, avec deux décimales explicites", correct: false}
      - {text: "Partir de `solde = 0` au lieu de `0.0`, un entier", correct: false}
      - {text: "Comparer avec `solde is 1.0`, qui teste la valeur", correct: false}
    answer: |-
      ```python
      solde = 0
      for _ in range(10):
          solde += 10          # en centimes
      print(solde == 100, solde)
      ```
      Chaque `+= 0.1` ajoute une petite erreur d'arrondi. En centimes entiers, le calcul est exact ; `Decimal("0.1")`
      conviendrait aussi.
  - key: situation-facture
    format: scenario
    question: |-
      Ton équipe calcule des factures avec des `float`, et un client signale un total de `19.990000000000002 €`. Que
      proposes-tu ?
    choices:
      - {text: "Passer à `Decimal` créé depuis des chaînes, ou à des centimes entiers", correct: true}
      - {text: "Garder les `float`, et arrondir avec `round(total, 2)` à chaque ligne", correct: false}
      - {text: "Garder les calculs, et afficher le total avec `:.2f` sur la facture", correct: false}
      - {text: "Passer à `numpy.float128`, plus précis que le `float` standard", correct: false}
    answer: |-
      L'erreur vient du type lui-même : 0,1 n'est pas représentable en binaire. Arrondir ou formater cache le symptôme,
      mais les erreurs s'accumulent dans les sommes. `Decimal` calcule en base 10 avec un arrondi choisi ; des
      centimes en `int` sont exacts.
  - key: situation-test-moyenne
    format: scenario
    question: |-
      Un test échoue : `assert moyenne([0.1, 0.2]) == 0.15`, alors que la fonction est juste (elle renvoie
      0.15000000000000002). Que fais-tu ?
    choices:
      - {text: "Comparer avec une tolérance : `pytest.approx(0.15)` ou `math.isclose`", correct: true}
      - {text: "Corriger la fonction pour qu'elle arrondisse son résultat à deux chiffres", correct: false}
      - {text: "Comparer les chaînes : `str(moyenne([0.1, 0.2])) == \"0.15\"`", correct: false}
      - {text: "Supprimer le test : les flottants ne se testent pas de façon fiable", correct: false}
    answer: |-
      `assert moyenne([0.1, 0.2]) == pytest.approx(0.15)` : la comparaison exacte de flottants calculés est fragile.
      Arrondir dans la fonction changerait son comportement pour faire plaisir au test.
  - key: situation-gps
    format: scenario
    question: |-
      Un collègue stocke des coordonnées GPS en `Decimal` « pour être précis », et le calcul des distances devient
      lent. Que lui dis-tu ?
    choices:
      - {text: "Garder des `float` : une mesure est déjà approchée, et `Decimal` est plus lent", correct: true}
      - {text: "Garder `Decimal` : un `float` perd plusieurs mètres à chaque calcul", correct: false}
      - {text: "Passer à `Fraction`, exacte comme `Decimal` et bien plus rapide", correct: false}
      - {text: "Stocker les coordonnées en chaînes, et les convertir à chaque calcul", correct: false}
    answer: |-
      Un `float` a environ 16 chiffres significatifs : bien plus que la précision d'un GPS. `Decimal` sert aux
      quantités décimales exactes, comme l'argent ; pour des mesures physiques, il coûte cher pour rien.
  - key: situation-longue-somme
    format: scenario
    question: |-
      Un rapport cumule un million de petites valeurs `float` dans une boucle, avec `total += valeur`, et l'écart
      avec la valeur attendue grandit. Que proposes-tu pour réduire l'erreur d'arrondi ?
    choices:
      - {text: "`math.fsum(valeurs)`, qui compense les erreurs d'arrondi de la somme", correct: true}
      - {text: "`total = total + valeur`, qui arrondit moins que l'opérateur `+=`", correct: false}
      - {text: "`round(total, 2)` à la fin, pour retirer les décimales en trop", correct: false}
      - {text: "`total += float(valeur)`, pour forcer la précision des valeurs", correct: false}
    answer: |-
      Chaque `+=` arrondit, et les erreurs s'accumulent. `math.fsum` les suit au fil de la somme et rend le flottant le
      plus proche du résultat exact. Depuis Python 3.12, `sum` compense aussi ces erreurs sur des flottants. Arrondir
      à la fin ne fait que cacher l'écart.
