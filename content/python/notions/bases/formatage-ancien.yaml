notion: formatage-ancien
lesson: |-
  Avant les f-strings (Python 3.6), deux syntaxes formataient les chaînes. On les écrit rarement dans du code neuf,
  mais on les **lit** partout : dans le code existant, et dans les journaux (`logging`).

  **L'opérateur `%`**, hérité du `printf` de C :

  ```python
  "%s a %d ans" % ("Ada", 36)          # 'Ada a 36 ans'
  "%.2f €" % 3.14159                   # '3.14 €'   (une seule valeur : pas besoin de tuple)
  "%5d|%-5s|" % (42, "ab")             # '   42|ab   |'
  "%x %o %r %%" % (255, 8, "a")        # "ff 10 'a' %"
  "%(nom)s" % {"nom": "Ada"}           # par nom, avec un dictionnaire
  ```

  | Code | Rôle |
  |---|---|
  | `%s` | `str` de la valeur |
  | `%r` | `repr` de la valeur |
  | `%d` | entier (un flottant est tronqué : `"%d" % 3.9` donne `'3'`) |
  | `%f`, `%.2f` | flottant, avec des décimales |
  | `%x`, `%o` | hexadécimal, octal |
  | `%%` | un `%` littéral |

  Le nombre de valeurs doit correspondre : `"%s %s" % ("a",)` lève `TypeError: not enough arguments for format
  string`, et `"%s" % (1, 2)` lève `TypeError: not all arguments converted during string formatting`. Piège : une
  seule valeur qui est elle-même un tuple doit être emballée : `"%s" % ((1, 2),)`.

  **`str.format`** (Python 2.6 et 3.0), avec le même mini-langage de format que les f-strings :

  ```python
  "{} a {} ans".format("Ada", 36)              # par position
  "{1}-{0}-{1}".format("a", "b")               # 'b-a-b' : par indice, réutilisable
  "{nom:>5}|{n:03}".format(nom="Ada", n=7)     # '  Ada|007' : par nom, avec un format
  "{0[0]} {p.real}".format(["x"], p=3)         # accès aux éléments et aux attributs
  ```

  **Où on les croise encore**

  - **`logging`** : `log.info("client %s connecté", client)`. Les valeurs passent en arguments, et le message n'est
    formaté que s'il est vraiment écrit. Une f-string serait formatée même quand le niveau de log l'ignore.
  - **Un modèle connu seulement à l'exécution** (stocké en base, traduit) : `modele.format(**valeurs)`. Une f-string
    est écrite dans le code, elle ne peut pas venir d'une donnée.
  - Jamais avec un modèle fourni par un utilisateur : `str.format` peut lire les attributs des objets passés
    (`"{u.__class__.__init__.__globals__}"`), et divulguer des données. Pour ce cas, `string.Template`
    (`"Bonjour $nom"`) est plus sûr.

  **En entretien** : « `%` et `str.format` sont les ancêtres des f-strings. On les lit dans le code existant ; on garde
  le style `%` pour `logging`, qui ne formate que les messages émis, et `str.format` quand le modèle est une donnée,
  jamais fournie par un utilisateur. »
cards:
  - key: logging-pourcentage
    format: course
    question: "Pourquoi écrit-on encore `log.info(\"client %s\", client)` plutôt qu'une f-string ?"
    choices:
      - {text: "Le message n'est formaté que si le niveau de log l'émet vraiment", correct: true}
      - {text: "Le module `logging` refuse les messages construits par une f-string", correct: false}
      - {text: "Le style `%` est plus rapide qu'une f-string, dans tous les cas", correct: false}
      - {text: "C'est obligatoire pour que le code reste compatible avec Python 2", correct: false}
    answer: "Avec une f-string, le message est construit avant l'appel, même si `info` est filtré. Les outils de collecte peuvent aussi regrouper les messages par modèle."
  - key: pourcentage-litteral
    format: course
    question: "Que produit `%%` dans une chaîne formatée avec `%` ?"
    choices:
      - {text: "Un `%` littéral", correct: true}
      - {text: "La valeur suivante, en pourcentage", correct: false}
      - {text: "Une `ValueError` : code inconnu", correct: false}
      - {text: "Deux `%` littéraux", correct: false}
    answer: "`\"%d %%\" % 50` donne `'50 %'`. Dans une f-string ou `str.format`, ce sont les accolades qu'on double."
  - key: format-modele-donnee
    format: course
    question: Quand `str.format` reste-t-il utile face aux f-strings ?
    choices:
      - {text: "Quand le modèle est une donnée, connue seulement à l'exécution", correct: true}
      - {text: "Quand la chaîne doit contenir plus de trois valeurs différentes", correct: false}
      - {text: "Quand on veut afficher un flottant avec deux décimales", correct: false}
      - {text: "Quand la chaîne contient des guillemets doubles et simples", correct: false}
    answer: "Une f-string est écrite dans le code source. Un message traduit ou stocké en base se formate avec `modele.format(...)`."
  - key: format-indice-repete
    format: course
    question: "Comment réutilise-t-on deux fois le même argument avec `str.format` ?"
    choices:
      - {text: "Par son indice ou son nom : `\"{0} {0}\".format(x)`", correct: true}
      - {text: "En le passant deux fois : `\"{} {}\".format(x)`", correct: false}
      - {text: "Avec une étoile : `\"{*} {*}\".format(x)`", correct: false}
      - {text: "C'est impossible : chaque argument sert une fois", correct: false}
    answer: "`\"{0}-{0}\".format(\"a\")` donne `'a-a'`, et `\"{n} {n}\".format(n=1)` donne `'1 1'`. `\"{} {}\".format(x)` lèverait une `IndexError`."
  - key: vf-d-tronque
    format: true-false
    question: "`\"%d\" % 3.9` donne `'3'`."
    truth: true
    answer: "`%d` convertit en entier en tronquant. Pour arrondir, `\"%.0f\" % 3.9` donne `'4'`."
  - key: vf-meme-mini-langage
    format: true-false
    question: "`\"{:.2f}\".format(3.14159)` et `f\"{3.14159:.2f}\"` donnent le même résultat."
    truth: true
    answer: "Les deux utilisent le même mini-langage de format, après le deux-points : `'3.14'`."
  - key: vf-pourcentage-retire
    format: true-false
    question: Le formatage avec `%` a été retiré en Python 3.
    truth: false
    answer: "Il existe toujours et n'est pas déprécié. On le croise surtout dans `logging` et dans le code ancien."
  - key: vf-manque-argument
    format: true-false
    question: "`\"%s et %s\" % \"a\"` donne `'a et a'`."
    truth: false
    answer: "Deux `%s` demandent deux valeurs : « TypeError: not enough arguments for format string ». `\"{0} et {0}\".format(\"a\")` réutilise une valeur."
  - key: qcm-largeur-precision
    format: multiple-choice
    question: "Que donne `\"%5.1f|\" % 3.14159` ?"
    choices:
      - {text: "`'  3.1|'`", correct: true}
      - {text: "`'3.1|'`", correct: false}
      - {text: "`'3.14159|'`", correct: false}
      - {text: "`'    3|'`", correct: false}
    answer: "`5` est la largeur totale, `.1` le nombre de décimales : `3.1` est complété par deux espaces à gauche."
  - key: qcm-equivalent-format
    format: multiple-choice
    question: "Quelle écriture équivaut à `f\"{nom} a {age} ans\"` ?"
    choices:
      - {text: "`\"{} a {} ans\".format(nom, age)`", correct: true}
      - {text: "`\"{nom} a {age} ans\" % (nom, age)`", correct: false}
      - {text: "`\"%s a %s ans\".format(nom, age)`", correct: false}
      - {text: "`format(\"{} a {} ans\", nom, age)`", correct: false}
    answer: "`str.format` remplit les `{}` dans l'ordre. `%` ne connaît pas les accolades, `format` n'interprète pas les `%s`, et la fonction `format` ne formate qu'une valeur."
  - key: qcm-pas-assez-arguments
    format: multiple-choice
    question: "Quelle exception lève `\"%s %s\" % (\"a\",)` ?"
    choices:
      - {text: "`TypeError`", correct: true}
      - {text: "`ValueError`", correct: false}
      - {text: "`IndexError`", correct: false}
      - {text: "`KeyError`", correct: false}
    answer: "« TypeError: not enough arguments for format string ». Avec trop de valeurs : « not all arguments converted during string formatting »."
  - key: qcm-modele-utilisateur
    format: multiple-choice
    question: Pourquoi ne faut-il pas formater avec `str.format` un modèle écrit par un utilisateur ?
    choices:
      - {text: "Il peut lire les attributs des objets passés, et divulguer des données", correct: true}
      - {text: "Il peut lancer une commande système avec la conversion `{!system}`", correct: false}
      - {text: "Il est bien plus lent qu'une f-string sur un modèle très long", correct: false}
      - {text: "Il ne sait pas afficher les caractères accentués ni les émojis", correct: false}
    answer: "`\"{u.__class__.__init__.__globals__}\"` remonte jusqu'aux variables globales du module. Pour un modèle venu de l'extérieur, `string.Template` ne fait que des substitutions simples."
  - key: code-pourcentage-simple
    format: code-output
    question: |-
      ```python
      print("%s a %d ans" % ("Ada", 36))
      ```
    answer: "`Ada a 36 ans` : chaque code `%` reçoit une valeur du tuple, dans l'ordre."
    check:
      output: "Ada a 36 ans"
    choices:
      - {text: "`Ada a 36 ans`", correct: true}
      - {text: "`%s a %d ans Ada 36`", correct: false}
      - {text: "`('Ada', 36) a ans`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: code-format-indices
    format: code-output
    question: |-
      ```python
      print("{1}-{0}-{1}".format("a", "b"))
      ```
    answer: "`b-a-b` : l'indice 1 désigne le second argument, et peut servir plusieurs fois."
    check:
      output: "b-a-b"
    choices:
      - {text: "`b-a-b`", correct: true}
      - {text: "`a-b-a`", correct: false}
      - {text: "`a-b`", correct: false}
      - {text: "Une `IndexError`", correct: false}
  - key: code-codes-pourcentage
    format: code-output
    question: |-
      ```python
      print("%05.1f|%-4s|%x" % (3.14159, "ab", 255))
      ```
    answer: "`003.1|ab  |ff` : cinq caractères complétés par des zéros, une chaîne alignée à gauche sur quatre, puis l'hexadécimal."
    check:
      output: "003.1|ab  |ff"
    choices:
      - {text: "`003.1|ab  |ff`", correct: true}
      - {text: "`3.1|ab|255`", correct: false}
      - {text: "`03.14|  ab|ff`", correct: false}
      - {text: "`003.1|  ab|0xff`", correct: false}
  - key: code-format-noms
    format: code-output
    question: |-
      ```python
      print("{nom:<5}|{n:03}".format(nom="Ada", n=7))
      ```
    answer: "`Ada  |007` : `Ada` aligné à gauche sur cinq caractères, `7` complété de zéros sur trois."
    check:
      output: "Ada  |007"
    choices:
      - {text: "`Ada  |007`", correct: true}
      - {text: "`  Ada|007`", correct: false}
      - {text: "`Ada|7`", correct: false}
      - {text: "`Ada  |700`", correct: false}
