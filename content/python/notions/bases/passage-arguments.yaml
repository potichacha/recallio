notion: passage-arguments
lesson: |-
  En Python, **une variable est un nom lié à un objet**. Appeler une fonction lie chaque paramètre **au même objet**
  que l'argument : rien n'est copié. On parle de passage **par partage d'objet** (*call by sharing*), ou « par
  affectation » : c'est exactement `parametre = argument`.

  Ni « par valeur » (aucune copie), ni « par référence » au sens du `&` de C++ (la fonction ne peut pas réaffecter la
  variable de l'appelant). Deux cas en découlent :

  | Dans la fonction | Effet chez l'appelant |
  |---|---|
  | **modifier l'objet** : `liste.append(4)`, `d["cle"] = 1`, `liste[0] = 9` | **visible** : c'est le même objet |
  | **réaffecter le paramètre** : `liste = [0]`, `n += 1` sur un entier | **invisible** : seul le nom local change |

  ```python
  def ajouter(liste):
      liste.append(4)          # modifie l'objet partagé

  def remplacer(liste):
      liste = [0]              # relie le nom local à un autre objet

  nombres = [1, 2, 3]
  ajouter(nombres)             # nombres vaut [1, 2, 3, 4]
  remplacer(nombres)           # nombres vaut toujours [1, 2, 3, 4]
  ```

  - Un objet **immuable** (`int`, `str`, `tuple`) ne peut pas être modifié : `n += 1` crée un nouvel entier.
  - Sur une liste, **`+=` modifie en place** (comme `extend`), alors que `liste = liste + [4]` crée une nouvelle liste.
  - Une fonction ne peut pas échanger deux variables de l'appelant : elle **renvoie** les valeurs, et l'appelant écrit
    `a, b = echanger(a, b)`, ou directement `a, b = b, a`.
  - **Copie défensive** : `list(x)`, `x.copy()` ou `x[:]` pour une copie superficielle ; `copy.deepcopy(x)` quand
    l'objet contient lui-même des objets mutables (une liste de listes).
  - **Convention** : une fonction qui modifie son argument en place renvoie `None` (`list.sort`, `random.shuffle`) ;
    une fonction qui renvoie un résultat ne touche pas à ses arguments (`sorted`). Mélanger les deux sème le doute.

  **En entretien** : « Python passe des références d'objets : le paramètre est un nouveau nom pour le même objet.
  Modifier un objet mutable se voit chez l'appelant ; réaffecter le paramètre, non. Ce n'est donc ni du passage par
  valeur, ni du passage par référence à la C++. »
cards:
  - key: comment-passe
    format: course
    question: Comment Python passe-t-il les arguments à une fonction ?
    choices:
      - {text: "Le paramètre devient un nouveau nom pour le même objet", correct: true}
      - {text: "Par valeur : la fonction reçoit une copie de chaque objet", correct: false}
      - {text: "Par référence, comme le `&` du C++ : la variable de l'appelant change", correct: false}
      - {text: "Par valeur pour les listes, et par référence pour les entiers", correct: false}
    answer: "Le passage est une affectation : `parametre = argument`. Rien n'est copié, et la fonction ne peut pas réaffecter la variable de l'appelant."
  - key: sort-renvoie-none
    format: course
    question: Pourquoi `liste.sort()` renvoie-t-il `None` ?
    choices:
      - {text: "Il trie la liste en place ; la convention est alors de ne rien renvoyer", correct: true}
      - {text: "Il trie une copie de la liste, puis la supprime aussitôt", correct: false}
      - {text: "Il renvoie `None` seulement quand la liste est déjà triée", correct: false}
      - {text: "Il trie de façon paresseuse, au premier accès à la liste", correct: false}
    answer: "Renvoyer `None` rappelle que l'objet a été modifié. `sorted(liste)`, à l'inverse, renvoie une nouvelle liste et laisse l'originale intacte."
  - key: proteger-appelant
    format: course
    question: Comment une fonction évite-t-elle de modifier la liste que lui passe l'appelant ?
    choices:
      - {text: "Elle travaille sur une copie : `liste = list(liste)`", correct: true}
      - {text: "Elle déclare son paramètre `const`, comme en C++", correct: false}
      - {text: "Elle annote le paramètre avec `tuple` au lieu de `list`", correct: false}
      - {text: "Elle déclare `nonlocal` sur son paramètre", correct: false}
    answer: "La copie relie le nom local à un nouvel objet, que la fonction peut modifier sans risque. Une annotation ne change rien à l'exécution."
  - key: echanger-impossible
    format: course
    question: Peut-on écrire une fonction `echanger(a, b)` qui échange deux variables de l'appelant ?
    choices:
      - {text: "Non : elle renvoie les valeurs, et l'appelant réaffecte ses variables", correct: true}
      - {text: "Oui, en déclarant `a` et `b` comme `global` dans la fonction", correct: false}
      - {text: "Oui, à condition que `a` et `b` soient des entiers", correct: false}
      - {text: "Oui, avec `nonlocal a, b` en tête de la fonction", correct: false}
    answer: "La fonction ne reçoit que des objets, pas les variables de l'appelant. On écrit `a, b = b, a`, sans fonction."
  - key: vf-append-visible
    format: true-false
    question: Une fonction qui fait `parametre.append(1)` modifie la liste passée par l'appelant.
    truth: true
    answer: "Le paramètre et la variable de l'appelant désignent le même objet : la modification se voit des deux côtés."
  - key: vf-reaffectation-invisible
    format: true-false
    question: Une fonction qui fait `parametre = [1]` modifie la liste passée par l'appelant.
    truth: false
    answer: "La réaffectation relie seulement le nom local à une nouvelle liste. L'objet de l'appelant n'est pas touché."
  - key: vf-entier-incremente
    format: true-false
    question: Dans une fonction, `n += 1` sur un paramètre entier modifie la variable de l'appelant.
    truth: false
    answer: "Un entier est immuable : `n += 1` crée un nouvel entier et relie le nom local à lui."
  - key: vf-plus-egal-liste
    format: true-false
    question: Dans une fonction, `liste += [4]` sur un paramètre liste modifie la liste de l'appelant.
    truth: true
    answer: "Sur une liste, `+=` appelle `__iadd__`, qui étend la liste en place. `liste = liste + [4]`, lui, créerait une nouvelle liste."
  - key: qcm-tuple-inchange
    format: multiple-choice
    question: "Après `def f(t): t = t + (4,)`, puis `x = (1, 2, 3)` et `f(x)`, que vaut `x` ?"
    choices:
      - {text: "`(1, 2, 3)`", correct: true}
      - {text: "`(1, 2, 3, 4)`", correct: false}
      - {text: "`(4,)`", correct: false}
      - {text: "`None`", correct: false}
    answer: "`t + (4,)` crée un nouveau tuple, lié au nom local `t`. Le tuple de l'appelant, immuable de toute façon, ne change pas."
  - key: qcm-terme
    format: multiple-choice
    question: Quel terme décrit le mieux le passage des arguments en Python ?
    choices:
      - {text: "Le passage par partage d'objet (call by sharing)", correct: true}
      - {text: "Le passage par valeur, avec une copie profonde", correct: false}
      - {text: "Le passage par référence, comme en C++", correct: false}
      - {text: "Le passage par nom, réévalué à chaque usage", correct: false}
    answer: "La fonction partage les objets de l'appelant, sans pouvoir réaffecter ses variables. Java fait de même avec les objets."
  - key: qcm-visible-dict
    format: multiple-choice
    question: Une fonction reçoit un dictionnaire `d`. Quelle opération se voit chez l'appelant ?
    choices:
      - {text: "`d[\"cle\"] = 1`", correct: true}
      - {text: "`d = {\"cle\": 1}`", correct: false}
      - {text: "`d = dict(d, cle=1)`", correct: false}
      - {text: "`d = {**d, \"cle\": 1}`", correct: false}
    answer: "Seule la première modifie l'objet partagé. Les trois autres créent un nouveau dictionnaire, lié au nom local."
  - key: qcm-copie-superficielle
    format: multiple-choice
    question: Pourquoi `list(grille)` ne protège-t-il pas une liste de listes contre les modifications ?
    choices:
      - {text: "Les sous-listes restent partagées : seule la liste extérieure est copiée", correct: true}
      - {text: "`list()` ne copie rien : il renvoie le même objet qu'il reçoit", correct: false}
      - {text: "Les sous-listes sont converties en tuples, qu'on ne peut plus modifier", correct: false}
      - {text: "`list()` copie bien en profondeur, mais seulement sur deux niveaux", correct: false}
    answer: "Une copie superficielle crée une nouvelle liste qui contient les mêmes sous-listes. `copy.deepcopy` copie aussi les sous-listes."
  - key: code-append
    format: code-output
    question: |-
      ```python
      def ajouter(liste):
          liste.append(4)

      nombres = [1, 2, 3]
      ajouter(nombres)
      print(nombres)
      ```
    check:
      output: "[1, 2, 3, 4]"
    choices:
      - {text: "`[1, 2, 3, 4]`", correct: true}
      - {text: "`[1, 2, 3]`", correct: false}
      - {text: "`None`", correct: false}
      - {text: "`[4]`", correct: false}
    answer: "`liste` et `nombres` désignent la même liste : `append` la modifie pour les deux."
  - key: code-remplacer
    format: code-output
    question: |-
      ```python
      def remplacer(liste):
          liste = [0]

      nombres = [1, 2]
      remplacer(nombres)
      print(nombres)
      ```
    check:
      output: "[1, 2]"
    choices:
      - {text: "`[1, 2]`", correct: true}
      - {text: "`[0]`", correct: false}
      - {text: "`[1, 2, 0]`", correct: false}
      - {text: "`[0, 1, 2]`", correct: false}
    answer: "La réaffectation relie le nom local à une nouvelle liste ; `nombres` désigne toujours l'ancienne."
  - key: code-entier
    format: code-output
    question: |-
      ```python
      def incrementer(n):
          n += 1
          return n

      x = 5
      y = incrementer(x)
      print(x, y)
      ```
    check:
      output: "5 6"
    choices:
      - {text: "`5 6`", correct: true}
      - {text: "`6 6`", correct: false}
      - {text: "`5 5`", correct: false}
      - {text: "`6 5`", correct: false}
    answer: "Un entier est immuable : `n += 1` crée l'entier 6, lié à `n` seulement. La fonction le renvoie, et `x` reste à 5."
  - key: code-plus-egal-ou-plus
    format: code-output
    question: |-
      ```python
      def f(a, b):
          a += [3]
          b = b + [3]

      x, y = [1], [1]
      f(x, y)
      print(x, y)
      ```
    check:
      output: "[1, 3] [1]"
    choices:
      - {text: "`[1, 3] [1]`", correct: true}
      - {text: "`[1, 3] [1, 3]`", correct: false}
      - {text: "`[1] [1]`", correct: false}
      - {text: "`[1] [1, 3]`", correct: false}
    answer: "`a += [3]` étend la liste en place ; `b = b + [3]` crée une nouvelle liste, liée au nom local."
  - key: bug-tri-en-douce
    format: bug-fix
    question: |-
      Ce code affiche `12 [8, 12, 15]` : la liste de l'appelant a été triée en douce. Quelle correction est la bonne ?
      ```python
      def mediane(notes):
          notes.sort()
          return notes[len(notes) // 2]

      notes = [15, 8, 12]
      milieu = mediane(notes)
      print(milieu, notes)
      ```
    choices:
      - {text: "Trier une copie : `triees = sorted(notes)`, puis lire `triees`", correct: true}
      - {text: "Renommer le paramètre, pour qu'il ne masque pas `notes`", correct: false}
      - {text: "Écrire `notes = notes.sort()` pour garder le résultat trié", correct: false}
      - {text: "Appeler `notes.sort(reverse=True)` à la fin, pour annuler le tri", correct: false}
    answer: |-
      ```python
      def mediane(notes):
          triees = sorted(notes)
          return triees[len(triees) // 2]
      ```
      `sort` modifie l'objet partagé avec l'appelant ; `sorted` renvoie une nouvelle liste. Le nom du paramètre n'y change rien, et `notes.sort()` renvoie `None`.
  - key: bug-echange
    format: bug-fix
    question: |-
      Ce code affiche `1 2` : rien n'a été échangé. Quelle correction est la bonne ?
      ```python
      def echanger(a, b):
          a, b = b, a

      x, y = 1, 2
      echanger(x, y)
      print(x, y)
      ```
    choices:
      - {text: "Renvoyer `b, a`, et écrire `x, y = echanger(x, y)`", correct: true}
      - {text: "Déclarer `nonlocal a, b` en tête de la fonction", correct: false}
      - {text: "Appeler `echanger(*[x, y])` pour passer les références", correct: false}
      - {text: "Écrire `a, b = b.copy(), a.copy()` dans la fonction", correct: false}
    answer: |-
      ```python
      def echanger(a, b):
          return b, a

      x, y = echanger(x, y)   # ou simplement : x, y = y, x
      ```
      La fonction ne peut réaffecter que ses noms locaux. Elle renvoie les valeurs, et c'est l'appelant qui réaffecte ses variables.
  - key: bug-classement-none
    format: bug-fix
    question: |-
      Ce code affiche `None` au lieu du classement. Quelle correction est la bonne ?
      ```python
      def classement(scores):
          return scores.sort(reverse=True)

      print(classement([3, 9, 5]))
      ```
    choices:
      - {text: "`return sorted(scores, reverse=True)`", correct: true}
      - {text: "`return scores.sort(reverse=False)`", correct: false}
      - {text: "`return list(scores.sort(reverse=True))`", correct: false}
      - {text: "`return scores.sorted(reverse=True)`", correct: false}
    answer: |-
      ```python
      def classement(scores):
          return sorted(scores, reverse=True)
      ```
      `list.sort` trie en place et renvoie `None`. `sorted` renvoie une nouvelle liste, sans toucher à l'argument. Les listes n'ont pas de méthode `sorted`.
  - key: bug-copie-superficielle
    format: bug-fix
    question: |-
      Ce code affiche `[[0, 2], [3, 4]]` : la grille d'origine a été modifiée malgré la copie. Quelle correction est la bonne ?
      ```python
      def reinitialiser(grille):
          copie = list(grille)
          copie[0][0] = 0
          return copie

      g = [[1, 2], [3, 4]]
      reinitialiser(g)
      print(g)
      ```
    choices:
      - {text: "`copie = [ligne.copy() for ligne in grille]`", correct: true}
      - {text: "`copie = grille[:]`", correct: false}
      - {text: "`copie = grille.copy()`", correct: false}
      - {text: "`copie = [ligne for ligne in grille]`", correct: false}
    answer: |-
      ```python
      def reinitialiser(grille):
          copie = [ligne.copy() for ligne in grille]   # ou copy.deepcopy(grille)
          copie[0][0] = 0
          return copie
      ```
      Les trois autres sont des copies superficielles : une nouvelle liste extérieure, mais les mêmes sous-listes.
  - key: scenario-commande-modifiee
    format: scenario
    question: "Une fonction `normaliser(commande)` reçoit un dictionnaire et en modifie des clés. Ton collègue s'étonne que la commande d'origine soit changée après l'appel. Que lui expliques-tu ?"
    choices:
      - {text: "La fonction reçoit le même dictionnaire : elle doit le copier ou en renvoyer un nouveau", correct: true}
      - {text: "Python passe les dictionnaires par valeur : c'est un bug de l'interpréteur", correct: false}
      - {text: "Le dictionnaire est global : il faut le déclarer local dans la fonction", correct: false}
      - {text: "Le ramasse-miettes a fusionné les deux dictionnaires pendant l'appel", correct: false}
    answer: "Aucune copie n'est faite à l'appel : modifier le dictionnaire reçu modifie celui de l'appelant. On copie (`dict(commande)`) ou on construit un nouveau dictionnaire."
  - key: scenario-valeur-ou-reference
    format: scenario
    question: "En entretien : « Python passe-t-il les arguments par valeur ou par référence ? » Quelle réponse est la plus juste ?"
    choices:
      - {text: "Il passe la référence de l'objet ; le paramètre est un nouveau nom pour lui", correct: true}
      - {text: "Par référence : toute modification du paramètre se voit chez l'appelant", correct: false}
      - {text: "Par valeur : la fonction reçoit toujours une copie de l'objet passé", correct: false}
      - {text: "Par valeur pour les objets immuables, par référence pour les mutables", correct: false}
    answer: "Ni l'un ni l'autre : modifier l'objet se voit, réaffecter le paramètre non. La dernière réponse est une demi-vérité répandue : le mécanisme est le même pour tous les objets."
  - key: scenario-effets-de-bord
    format: scenario
    question: "Tu écris une fonction qui applique une remise à une liste de prix, et l'API doit être claire sur ses effets de bord. Que choisis-tu ?"
    choices:
      - {text: "Renvoyer une nouvelle liste, ou modifier en place et renvoyer `None`", correct: true}
      - {text: "Modifier la liste en place et la renvoyer aussi, par commodité", correct: false}
      - {text: "Modifier une variable globale qui contient la liste des prix", correct: false}
      - {text: "Copier la liste en profondeur à chaque appel, puis la modifier", correct: false}
    answer: "C'est la convention de la bibliothèque standard : `sorted` renvoie, `list.sort` modifie et renvoie `None`. Faire les deux laisse croire que l'argument est intact."
  - key: scenario-tests-instables
    format: scenario
    question: "Des tests échouent selon leur ordre d'exécution : ils partagent une liste de données qu'une fonction testée modifie. Quelle piste suis-tu ?"
    choices:
      - {text: "La fonction modifie son argument : donner à chaque test sa propre copie", correct: true}
      - {text: "Le hasard vient de Python : relancer les tests jusqu'au succès", correct: false}
      - {text: "Les listes ne sont pas fiables : les remplacer par des dictionnaires", correct: false}
      - {text: "Ajouter `global` dans la fonction testée pour isoler la liste", correct: false}
    answer: "Une liste partagée entre tests garde les modifications de l'un pour le suivant. Une fixture pytest qui crée une liste neuve pour chaque test règle le problème ; corriger la fonction pour qu'elle ne modifie pas son argument, encore mieux."
