notion: chaines-bases
lesson: |-
  Une chaîne (`str`) est une suite **immuable** de caractères Unicode.

  **Les littéraux**

  ```python
  'texte'  ==  "texte"           # aucune différence : on choisit selon le contenu
  "l'arbre"                      # des apostrophes dans des guillemets doubles
  'Il a dit "oui"'               # et l'inverse
  """Plusieurs
  lignes"""                      # triples guillemets : les retours à la ligne sont gardés
  "a\tb\n"                       # séquences d'échappement : tabulation, retour à la ligne
  r"C:\nouveau\dossier"          # chaîne brute : les \ restent des \ (chemins, regex)
  "ab" "cd"                      # deux littéraux côte à côte sont collés : "abcd"
  ```

  **Il n'y a pas de type caractère** : `"abc"[0]` est la chaîne `"a"`, de longueur 1.

  **Indices** : de `0` à `len(s) - 1`, et en négatif depuis la fin : `s[-1]` est le dernier caractère. Un indice hors
  des bornes lève `IndexError: string index out of range`. Le découpage `s[1:4]` extrait une sous-chaîne (une notion
  dédiée le détaille).

  **Opérations**

  | Opération | Exemple | Résultat |
  |---|---|---|
  | longueur | `len("été")` | `3` (des caractères, pas des octets) |
  | concaténation | `"py" + "thon"` | `"python"` |
  | répétition | `"ab" * 3` | `"ababab"` |
  | appartenance | `"th" in "python"` | `True` |
  | comparaison | `"abc" < "abd"` | `True` (ordre des points de code : `"Z" < "a"`) |
  | parcours | `for c in "abc":` | `"a"`, `"b"`, `"c"` |

  **Immuable** : `s[0] = "B"` lève `TypeError: 'str' object does not support item assignment`. Toute « modification »
  crée une nouvelle chaîne : `s = "B" + s[1:]`, ou `s = s.upper()`. Pour assembler beaucoup de morceaux, on les
  accumule dans une liste, puis `"".join(morceaux)`.

  Une chaîne ne se mélange pas à un nombre : `"Âge : " + 30` lève une `TypeError` ; on écrit `str(30)` ou une
  f-string. `ord("A")` donne le point de code `65`, et `chr(65)` le caractère `"A"`.

  **En entretien** : « Une `str` est une séquence immuable de caractères Unicode, sans type caractère séparé.
  Guillemets simples et doubles sont équivalents, les indices négatifs partent de la fin, et `len` compte les
  caractères. Toute modification crée une nouvelle chaîne. »
tour:
  - title: Les chaînes
    text: |-
      Une chaîne s'écrit entre guillemets simples ou doubles, sans différence. On en lit un caractère par son indice,
      en partant de 0, ou de la fin avec un indice négatif. Le résultat est encore une chaîne : Python n'a pas de type
      caractère.

      `+` colle deux chaînes, `*` en répète une, `in` cherche une sous-chaîne. Le préfixe `r` crée une chaîne brute,
      où `\n` reste un antislash suivi d'un `n`.

      Essaie : ajoute `langage[0] = "J"`. Les chaînes sont immuables : Python lève une `TypeError`.
    example:
      files:
        main.py: |-
          langage = "Python"
          print(langage[0], langage[-1], len(langage))
          print(langage + " 3", "ah" * 3)
          print("y" in langage, "java" in langage)

          citation = 'Il a dit "bonjour"'
          print(citation)
          print("Ligne 1\nLigne 2")
          print(r"C:\nouveau")
      output: |-
        P n 6
        Python 3 ahahah
        True False
        Il a dit "bonjour"
        Ligne 1
        Ligne 2
        C:\nouveau
cards:
  - key: affecter-un-caractere
    format: course
    question: "Que donne `s[0] = \"B\"` sur une chaîne `s` ?"
    choices:
      - {text: "Une `TypeError` : les chaînes sont immuables", correct: true}
      - {text: "Le premier caractère de `s` devient `\"B\"`", correct: false}
      - {text: "Une `IndexError` : l'indice 0 est réservé", correct: false}
      - {text: "Une nouvelle chaîne, affectée à `s` en silence", correct: false}
    answer: "« TypeError: 'str' object does not support item assignment ». On construit une nouvelle chaîne : `s = \"B\" + s[1:]`."
  - key: apostrophes-ou-guillemets
    format: course
    question: "Quelle différence entre `'texte'` et `\"texte\"` ?"
    choices:
      - {text: "Aucune : on choisit selon les guillemets que la chaîne contient", correct: true}
      - {text: "Les apostrophes créent un caractère, les guillemets une chaîne", correct: false}
      - {text: "Les apostrophes désactivent les séquences d'échappement", correct: false}
      - {text: "Les guillemets permettent d'insérer des variables", correct: false}
    answer: "Les deux écritures donnent la même `str`. `\"l'arbre\"` évite d'échapper l'apostrophe. Les chaînes brutes s'écrivent avec `r`, les interpolations avec `f`."
  - key: dernier-caractere
    format: course
    question: "Que vaut `\"Python\"[-1]` ?"
    choices:
      - {text: "`\"n\"`", correct: true}
      - {text: "`\"P\"`", correct: false}
      - {text: "`\"o\"`", correct: false}
      - {text: "Une `IndexError`", correct: false}
    answer: "Un indice négatif part de la fin : `-1` est le dernier caractère, `-2` l'avant-dernier."
  - key: len-caracteres
    format: course
    question: "Que vaut `len(\"été\")` ?"
    choices:
      - {text: "`3` : le nombre de caractères", correct: true}
      - {text: "`5` : le nombre d'octets en UTF-8", correct: false}
      - {text: "`6` : deux octets par caractère", correct: false}
      - {text: "`4` : les caractères, plus la fin de chaîne", correct: false}
    answer: "Une `str` compte des caractères (des points de code Unicode). En UTF-8, `\"été\".encode()` fait 5 octets, mais c'est un objet `bytes`."
  - key: vf-type-char
    format: true-false
    question: Python a un type distinct pour un caractère seul, comme le `char` de Java.
    truth: false
    answer: "`\"abc\"[0]` est une `str` de longueur 1. Il n'y a pas de type caractère."
  - key: vf-immuables
    format: true-false
    question: Les chaînes Python sont immuables.
    truth: true
    answer: "Une fois créée, une chaîne ne change plus. Les méthodes comme `upper` ou `replace` renvoient une nouvelle chaîne."
  - key: vf-ordre-lexicographique
    format: true-false
    question: "`\"abc\" < \"abd\"` vaut `True`."
    truth: true
    answer: "Les chaînes se comparent caractère par caractère, selon leur point de code : `\"c\" < \"d\"`. Attention : les majuscules passent avant les minuscules (`\"Z\" < \"a\"`)."
  - key: vf-chaine-brute
    format: true-false
    question: |-
      La chaîne brute `r"\n"` contient un retour à la ligne.
    truth: false
    answer: |-
      Dans une chaîne brute, l'antislash n'échappe rien : `r"\n"` contient deux caractères, `\` et `n`. On s'en sert
      pour les chemins Windows et les expressions régulières.
  - key: qcm-plusieurs-lignes
    format: multiple-choice
    question: Comment écrit-on une chaîne sur plusieurs lignes, retours à la ligne compris ?
    choices:
      - {text: "Entre triples guillemets : `\"\"\"...\"\"\"`", correct: true}
      - {text: "Entre accents graves, comme en JavaScript", correct: false}
      - {text: "Avec un `+` à la fin de chaque ligne", correct: false}
      - {text: "Entre doubles crochets : `[[...]]`", correct: false}
    answer: "Les triples guillemets (doubles ou simples) gardent les retours à la ligne. Les accents graves n'ont pas de sens en Python."
  - key: qcm-contient
    format: multiple-choice
    question: "Quelle expression teste si `\"py\"` apparaît dans la chaîne `nom` ?"
    choices:
      - {text: "`\"py\" in nom`", correct: true}
      - {text: "`nom.contains(\"py\")`", correct: false}
      - {text: "`nom.has(\"py\")`", correct: false}
      - {text: "`\"py\" == nom`", correct: false}
    answer: "`in` teste l'appartenance d'une sous-chaîne. Les chaînes Python n'ont pas de méthode `contains`."
  - key: qcm-indice-dernier
    format: multiple-choice
    question: Quel indice désigne le dernier caractère d'une chaîne `s` non vide ?
    choices:
      - {text: "`-1`", correct: true}
      - {text: "`len(s)`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`s.length - 1`", correct: false}
    answer: "`s[-1]`, ou `s[len(s) - 1]`. `s[len(s)]` est hors des bornes, et `s.length` n'existe pas."
  - key: qcm-prefixe-r
    format: multiple-choice
    question: |-
      À quoi sert le préfixe `r` dans `r"\d+"` ?
    choices:
      - {text: "Il crée une chaîne brute, où les antislashs restent tels quels", correct: true}
      - {text: "Il crée une expression régulière déjà compilée", correct: false}
      - {text: "Il rend la chaîne en lecture seule", correct: false}
      - {text: "Il inverse l'ordre des caractères de la chaîne", correct: false}
    answer: |-
      Sans `r`, Python interprète les séquences comme `\n` ou `\t`. Une chaîne brute les laisse au module `re`, qui
      a sa propre syntaxe d'antislash.
  - key: trous-len
    format: fill-in
    question: |-
      Complète pour obtenir le nombre de caractères de `nom` :
      ```python
      taille = ___(nom)
      ```
    blanks: [[len]]
    answer: "`len` est une fonction, pas une méthode : `len(nom)`."
  - key: trous-premier-caractere
    format: fill-in
    question: |-
      Complète pour obtenir le premier caractère de `mot` :
      ```python
      premier = mot[___]
      ```
    blanks: [["0"]]
    answer: "Les indices commencent à 0."
  - key: trous-dernier-caractere
    format: fill-in
    question: |-
      Complète pour obtenir le dernier caractère de `mot`, sans utiliser `len` :
      ```python
      dernier = mot[___]
      ```
    blanks: [["-1"]]
    answer: "Les indices négatifs partent de la fin : `-1` est le dernier."
  - key: trous-in
    format: fill-in
    question: |-
      Complète pour tester si la lettre `"z"` apparaît dans `mot` :
      ```python
      if "z" ___ mot:
          print("trouvée")
      ```
    blanks: [[in]]
    answer: "`in` cherche une sous-chaîne, d'un ou de plusieurs caractères."
  - key: code-indices
    format: code-output
    question: |-
      ```python
      s = "Python"
      print(s[1], s[-2], len(s))
      ```
    answer: "`y o 6` : l'indice 1 est la deuxième lettre, `-2` l'avant-dernière."
    check:
      output: "y o 6"
    choices:
      - {text: "`y o 6`", correct: true}
      - {text: "`P n 6`", correct: false}
      - {text: "`y h 6`", correct: false}
      - {text: "`P o 5`", correct: false}
  - key: code-priorite-repetition
    format: code-output
    question: |-
      ```python
      print("ab" + "cd" * 2)
      ```
    answer: "`abcdcd` : `*` passe avant `+`, comme pour les nombres."
    check:
      output: "abcdcd"
    choices:
      - {text: "`abcdcd`", correct: true}
      - {text: "`abcdabcd`", correct: false}
      - {text: "`abcd2`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: code-comparaison-chaines
    format: code-output
    question: |-
      ```python
      print("Z" < "a", "10" < "9")
      ```
    answer: "`True True` : les majuscules précèdent les minuscules, et `\"10\"` se compare caractère par caractère (`\"1\" < \"9\"`), pas comme un nombre."
    check:
      output: "True True"
    choices:
      - {text: "`True True`", correct: true}
      - {text: "`False False`", correct: false}
      - {text: "`False True`", correct: false}
      - {text: "`True False`", correct: false}
  - key: code-immuable-alias
    format: code-output
    question: |-
      ```python
      s = "chat"
      t = s
      s = s + "s"
      print(t)
      ```
    answer: "`chat` : `s + \"s\"` crée une nouvelle chaîne, liée à `s` ; `t` désigne toujours l'ancienne."
    check:
      output: "chat"
    choices:
      - {text: "`chat`", correct: true}
      - {text: "`chats`", correct: false}
      - {text: "`s`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: bug-affecter-caractere
    format: bug-fix
    question: |-
      Ce script s'arrête avec « TypeError: 'str' object does not support item assignment » :
      ```python
      nom = "bob"
      nom[0] = "B"
      print(nom)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`nom = \"B\" + nom[1:]`", correct: true}
      - {text: "`nom[0] == \"B\"`", correct: false}
      - {text: "`nom.set(0, \"B\")`", correct: false}
      - {text: "`nom[0:1] = \"B\"`", correct: false}
    answer: |-
      ```python
      nom = "bob"
      nom = "B" + nom[1:]
      print(nom)
      ```
      Une chaîne ne se modifie pas : on en construit une nouvelle. `nom.capitalize()` ferait aussi l'affaire.
  - key: bug-indice-hors-bornes
    format: bug-fix
    question: |-
      Ce script s'arrête avec « IndexError: string index out of range » :
      ```python
      mot = "abc"
      print(mot[len(mot)])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(mot[-1])`", correct: true}
      - {text: "`print(mot[len(mot) + 1])`", correct: false}
      - {text: "`print(mot[len(mot)] or \"\")`", correct: false}
      - {text: "`print(mot.get(len(mot)))`", correct: false}
    answer: |-
      ```python
      mot = "abc"
      print(mot[-1])
      ```
      Les indices vont de `0` à `len(mot) - 1`. Le dernier caractère est `mot[-1]`.
  - key: bug-apostrophe
    format: bug-fix
    question: |-
      Ce script refuse de se lancer : « SyntaxError: unterminated string literal (detected at line 1) ».
      ```python
      print('l'arbre')
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(\"l'arbre\")`", correct: true}
      - {text: "`print('l''arbre')`", correct: false}
      - {text: "`print(l'arbre)`", correct: false}
      - {text: "`print('l'+'arbre')`", correct: false}
    answer: |-
      ```python
      print("l'arbre")
      ```
      L'apostrophe ferme la chaîne ouverte par `'`. Des guillemets doubles autour, ou `'l\'arbre'`, règlent le
      problème. Doubler l'apostrophe, comme en SQL, ne marche pas : Python colle `'l'` et `'arbre'` en `larbre`.
  - key: bug-chemin-windows
    format: bug-fix
    question: |-
      Ce chemin Windows s'affiche sur deux lignes, avec une tabulation au milieu :
      ```python
      chemin = "C:\temp\nouveau"
      print(chemin)
      ```
      Quelle correction est la bonne ?
    choices:
      - text: |-
          `chemin = r"C:\temp\nouveau"`
        correct: true
      - text: |-
          `chemin = "C:/temp/nouveau".replace("/", "\")`
        correct: false
      - text: |-
          `chemin = str("C:\temp\nouveau")`
        correct: false
      - text: |-
          `chemin = """C:\temp\nouveau"""`
        correct: false
    answer: |-
      ```python
      chemin = r"C:\temp\nouveau"
      print(chemin)
      ```
      Dans une chaîne normale, `\t` est une tabulation et `\n` un retour à la ligne. Une chaîne brute garde les
      antislashs ; on peut aussi écrire `"C:\\temp\\nouveau"`, ou des `/`, que Windows accepte.
