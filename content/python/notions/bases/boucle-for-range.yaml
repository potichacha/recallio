notion: boucle-for-range
lesson: |-
  La boucle `for` de Python parcourt **un itérable**, élément par élément : c'est un « pour chaque ». Il n'y a pas de
  `for (i = 0; i < n; i++)`.

  ```python
  for fruit in ["pomme", "kiwi"]:     # une liste
      print(fruit)
  for lettre in "abc":                # une chaîne : ses caractères
      print(lettre)
  for cle in {"a": 1, "b": 2}:        # un dictionnaire : ses clés
      print(cle)
  ```

  **`range`** produit une suite d'entiers, dont **la fin est exclue** :

  | Appel | Valeurs |
  |---|---|
  | `range(5)` | 0, 1, 2, 3, 4 |
  | `range(2, 6)` | 2, 3, 4, 5 |
  | `range(0, 10, 3)` | 0, 3, 6, 9 |
  | `range(5, 0, -1)` | 5, 4, 3, 2, 1 |

  - `range` est un objet **paresseux** : il calcule ses valeurs à la demande, sans construire de liste. `list(range(3))`
    donne `[0, 1, 2]`. Il connaît sa longueur (`len`) et teste `in` sans tout parcourir.
  - Un pas nul lève une `ValueError`. Un `range` dont le début dépasse la fin (avec un pas positif) est vide.
  - Pour l'indice et l'élément : **`enumerate(xs)`** (`for i, x in enumerate(xs, start=1):`) plutôt que
    `range(len(xs))`. Pour deux listes en parallèle : `zip(xs, ys)`.
  - `for _ in range(3):` répète trois fois quand le compteur ne sert pas.

  **Ce qu'il faut savoir sur la variable de boucle**

  - Elle **survit** à la boucle : après `for i in range(3): ...`, `i` vaut 2.
  - La réaffecter dans le corps (`i = 10`) ne change **pas** les tours suivants : la boucle lui donne la valeur suivante.
  - Elle est liée à l'élément, pas à la case de la liste : `for p in prix: p *= 2` ne modifie pas `prix`. Pour modifier
    sur place, on passe par l'indice (`prix[i] *= 2`), ou on construit une nouvelle liste.

  **En entretien** : « `for` parcourt un itérable : liste, chaîne, dictionnaire (ses clés), fichier... `range(debut,
  fin, pas)` exclut la fin et ne construit pas de liste. On préfère `enumerate` à `range(len(xs))`. »
tour:
  - title: "La boucle for et range"
    text: |-
      La boucle `for` parcourt les éléments d'un itérable : une liste, une chaîne, un dictionnaire... Pour compter,
      `range(debut, fin, pas)` produit des entiers, **fin exclue**.

      `enumerate` donne l'indice et l'élément à la fois, sans `range(len(...))`.

      Essaie : remplace `range(3)` par `range(1, 7, 2)`, puis `range(3, 0, -1)`.
    example:
      files:
        main.py: |-
          for fruit in ["pomme", "kiwi", "poire"]:
              print(fruit)

          for i in range(3):
              print("tour", i)

          print(list(range(2, 10, 3)))

          for lettre in "abc":
              print(lettre.upper(), end="")
          print()

          for rang, nom in enumerate(["Ada", "Linus"], start=1):
              print(rang, nom)
      output: |-
        pomme
        kiwi
        poire
        tour 0
        tour 1
        tour 2
        [2, 5, 8]
        ABC
        1 Ada
        2 Linus
    task:
      instructions: |-
        Avec une boucle `for` et `range`, calcule la somme des entiers de 1 à 100 : le programme doit afficher
        `somme : 5050`.
      starter:
        main.py: |-
          somme = 0
          print("somme :", somme)
      solution:
        main.py: |-
          somme = 0
          for i in range(1, 101):
              somme += i
          print("somme :", somme)
      output: "somme : 5050"
cards:
  - key: range-pas-deux
    format: course
    question: Quelles valeurs parcourt `range(2, 8, 2)` ?
    choices:
      - {text: "2, 4 et 6 : la borne de fin est exclue", correct: true}
      - {text: "2, 4, 6 et 8 : les deux bornes sont incluses", correct: false}
      - {text: "4, 6 et 8 : la borne de début est exclue", correct: false}
      - {text: "0, 2, 4 et 6 : le début vaut toujours 0", correct: false}
    answer: "`range(debut, fin, pas)` commence à `debut`, avance de `pas`, et s'arrête avant `fin`."
  - key: indice-et-element
    format: course
    question: Comment obtenir l'indice et l'élément en parcourant une liste `xs` ?
    choices:
      - {text: "`for i, x in enumerate(xs):`", correct: true}
      - {text: "`for i, x in xs:`", correct: false}
      - {text: "`for i, x in range(xs):`", correct: false}
      - {text: "`for i, x in xs.items():`", correct: false}
    answer: "`enumerate` produit des paires (indice, élément), qu'on déballe. `items()` n'existe que sur les dictionnaires."
  - key: range-paresseux
    format: course
    question: Que renvoie `range(5)` en Python 3 ?
    choices:
      - {text: "Un objet `range`, qui calcule ses valeurs à la demande", correct: true}
      - {text: "Une liste `[0, 1, 2, 3, 4]` construite en mémoire", correct: false}
      - {text: "Un tuple `(0, 1, 2, 3, 4)` immuable", correct: false}
      - {text: "Un générateur, qu'on ne parcourt qu'une fois", correct: false}
    answer: "`range(10**9)` ne coûte presque rien en mémoire. Contrairement à un générateur, un `range` se parcourt autant de fois qu'on veut, et connaît sa longueur."
  - key: repeter-sans-compteur
    format: course
    question: Comment répéter un bloc trois fois quand le compteur ne sert pas ?
    choices:
      - {text: "`for _ in range(3):`", correct: true}
      - {text: "`repeat 3:`", correct: false}
      - {text: "`for 3:`", correct: false}
      - {text: "`for i in 3:`", correct: false}
    answer: "Le nom `_` signale par convention une variable inutilisée. `for i in 3:` lève une `TypeError` : un entier n'est pas itérable."
  - key: vf-for-style-c
    format: true-false
    question: "Python a une boucle `for` à la C : `for (i = 0; i < n; i++)`."
    truth: false
    answer: "Le `for` de Python parcourt un itérable. Pour compter : `for i in range(n):`."
  - key: vf-range-decroissant
    format: true-false
    question: "`range(10, 0, -1)` parcourt 10, 9, 8, et ainsi de suite jusqu'à 1."
    truth: true
    answer: "Avec un pas négatif, `range` descend, et la fin (0) reste exclue."
  - key: vf-variable-apres
    format: true-false
    question: "Après `for i in range(3): pass`, la variable `i` vaut 2."
    truth: true
    answer: "La variable de boucle survit à la boucle et garde la dernière valeur reçue. Une boucle sur un itérable vide ne la crée pas."
  - key: vf-reaffecter-variable
    format: true-false
    question: "Réaffecter la variable de boucle dans le corps (`i = 10`) change les valeurs des tours suivants."
    truth: false
    answer: "À chaque tour, la boucle donne à `i` la valeur suivante de l'itérable : la réaffectation ne dure que jusqu'à la fin du tour."
  - key: qcm-un-a-dix
    format: multiple-choice
    question: Quelle boucle parcourt les entiers de 1 à 10 inclus ?
    choices:
      - {text: "`for i in range(1, 11):`", correct: true}
      - {text: "`for i in range(1, 10):`", correct: false}
      - {text: "`for i in range(10):`", correct: false}
      - {text: "`for i in range(0, 10, 1):`", correct: false}
    answer: "La fin est exclue : pour inclure 10, on s'arrête à 11. `range(10)` va de 0 à 9."
  - key: qcm-parcourir-dict
    format: multiple-choice
    question: |-
      Que parcourt `for c in {"a": 1, "b": 2}:` ?
    choices:
      - {text: "Les clés, dans l'ordre d'insertion", correct: true}
      - {text: "Les valeurs, dans l'ordre d'insertion", correct: false}
      - {text: "Les paires (clé, valeur)", correct: false}
      - {text: "Les clés, dans un ordre imprévisible", correct: false}
    answer: "Parcourir un dictionnaire parcourt ses clés, dans l'ordre d'insertion (garanti depuis Python 3.7). Pour les paires : `d.items()`."
  - key: qcm-pas-nul
    format: multiple-choice
    question: Que fait `range(0, 10, 0)` ?
    choices:
      - {text: "Il lève une `ValueError` : le pas ne peut pas être nul", correct: true}
      - {text: "Il produit une suite infinie de zéros", correct: false}
      - {text: "Il produit une suite vide, sans erreur", correct: false}
      - {text: "Il prend le pas par défaut, qui vaut 1", correct: false}
    answer: "`range` refuse un pas nul dès sa création : « range() arg 3 must not be zero »."
  - key: qcm-deux-listes
    format: multiple-choice
    question: Comment parcourir deux listes `xs` et `ys` en parallèle ?
    choices:
      - {text: "`for a, b in zip(xs, ys):`", correct: true}
      - {text: "`for a, b in xs, ys:`", correct: false}
      - {text: "`for a in xs and b in ys:`", correct: false}
      - {text: "`for a, b in range(xs, ys):`", correct: false}
    answer: "`zip` assemble les éléments de même rang et s'arrête à la plus courte. `for a, b in xs, ys:` parcourt le tuple `(xs, ys)` : deux tours, un par liste."
  - key: trous-in-range
    format: fill-in
    question: |-
      Complète pour afficher 0, 1, 2, 3, 4 :
      ```python
      for i ___ ___(5):
          print(i)
      ```
    blanks: [[in], [range]]
    answer: "`for variable in iterable:`, et `range(5)` produit 0 à 4."
  - key: trous-compte-a-rebours
    format: fill-in
    question: |-
      Complète le compte à rebours 5, 4, 3, 2, 1 :
      ```python
      for i in range(5, 0, ___):
          print(i)
      ```
    blanks: [["-1"]]
    answer: "Un pas de -1 fait descendre `range`, et 0 reste exclu."
  - key: trous-numeroter
    format: fill-in
    question: |-
      Complète pour numéroter les lignes à partir de 1 :
      ```python
      for numero, ligne in ___(lignes, start=1):
          print(numero, ligne)
      ```
    blanks: [[enumerate]]
    answer: "`enumerate` donne des paires (indice, élément) ; `start` fixe le premier indice."
  - key: trous-pairs
    format: fill-in
    question: |-
      Complète pour parcourir les nombres pairs de 0 à 8 inclus :
      ```python
      for n in range(0, ___, 2):
          print(n)
      ```
    blanks: [["9", "10"]]
    answer: "La fin est exclue : 9 ou 10 conviennent, puisque le pas de 2 saute de 8 à 10."
  - key: code-range-pas-trois
    format: code-output
    question: |-
      ```python
      print(list(range(1, 10, 3)))
      ```
    check:
      output: "[1, 4, 7]"
    choices:
      - {text: "`[1, 4, 7]`", correct: true}
      - {text: "`[1, 4, 7, 10]`", correct: false}
      - {text: "`[3, 6, 9]`", correct: false}
      - {text: "`[1, 3, 6, 9]`", correct: false}
    answer: "On part de 1, on avance de 3 : 1, 4, 7. 10 n'est pas atteint, puisque la fin est exclue."
  - key: code-somme-et-variable
    format: code-output
    question: |-
      ```python
      total = 0
      for i in range(4):
          total += i
      print(total, i)
      ```
    check:
      output: "6 3"
    choices:
      - {text: "`6 3`", correct: true}
      - {text: "`10 4`", correct: false}
      - {text: "`6 4`", correct: false}
      - {text: "`10 3`", correct: false}
    answer: "`range(4)` donne 0, 1, 2, 3 : la somme vaut 6, et `i` garde la dernière valeur, 3."
  - key: code-reaffecter
    format: code-output
    question: |-
      ```python
      vus = []
      for i in range(3):
          vus.append(i)
          i = 10
      print(vus)
      ```
    check:
      output: "[0, 1, 2]"
    choices:
      - {text: "`[0, 1, 2]`", correct: true}
      - {text: "`[0]`", correct: false}
      - {text: "`[0, 10, 10]`", correct: false}
      - {text: "`[10, 10, 10]`", correct: false}
    answer: "Chaque tour redonne à `i` la valeur suivante de `range` : la réaffectation à 10 n'a aucun effet sur la suite."
  - key: code-len-range
    format: code-output
    question: |-
      ```python
      print(len(range(2, 20, 5)), list(range(5, 0, -2)))
      ```
    check:
      output: "4 [5, 3, 1]"
    choices:
      - {text: "`4 [5, 3, 1]`", correct: true}
      - {text: "`3 [5, 3, 1]`", correct: false}
      - {text: "`4 [5, 3]`", correct: false}
      - {text: "`4 [5, 3, 1, -1]`", correct: false}
    answer: "2, 7, 12, 17 : quatre valeurs. En descendant de 2 depuis 5 : 5, 3, 1, et -1 dépasserait la fin."
  - key: bug-mois-douze
    format: bug-fix
    question: |-
      Ce code doit afficher les mois de 1 à 12, mais le mois 12 n'apparaît jamais. Quelle correction est la bonne ?
      ```python
      for mois in range(1, 12):
          print(mois)
      ```
    choices:
      - {text: "`range(1, 13)`", correct: true}
      - {text: "`range(12)`", correct: false}
      - {text: "`range(1, 12, 1)`", correct: false}
      - {text: "`range(0, 12)`", correct: false}
    answer: |-
      ```python
      for mois in range(1, 13):
          print(mois)
      ```
      La borne de fin est exclue : pour inclure 12, on s'arrête à 13. `range(12)` irait de 0 à 11.
  - key: bug-doubler-prix
    format: bug-fix
    question: |-
      Les prix devraient doubler, mais ce code affiche `[10, 20, 30]`. Quelle correction est la bonne ?
      ```python
      prix = [10, 20, 30]
      for p in prix:
          p = p * 2
      print(prix)
      ```
    choices:
      - {text: "`for i in range(len(prix)): prix[i] *= 2`", correct: true}
      - {text: "`for p in prix: p *= 2`", correct: false}
      - {text: "`for p in prix[:]: p = p * 2`", correct: false}
      - {text: "`for p in prix: global p; p = p * 2`", correct: false}
    answer: |-
      ```python
      for i in range(len(prix)):
          prix[i] *= 2
      # ou, en construisant une nouvelle liste : prix = [p * 2 for p in prix]
      ```
      `p` est un nom lié à l'élément : le réaffecter ne touche pas la liste. Il faut écrire dans la case, par son indice.
  - key: bug-len-iterable
    format: bug-fix
    question: |-
      Python répond « TypeError: 'int' object is not iterable ». Quelle correction est la bonne ?
      ```python
      noms = ["Ada", "Linus", "Guido"]
      for i in len(noms):
          print(i, noms[i])
      ```
    choices:
      - {text: "`for i in range(len(noms)):`", correct: true}
      - {text: "`for i in len(noms) - 1:`", correct: false}
      - {text: "`for i in list(len(noms)):`", correct: false}
      - {text: "`for i in noms.index():`", correct: false}
    answer: |-
      ```python
      for i in range(len(noms)):
          print(i, noms[i])
      # plus idiomatique : for i, nom in enumerate(noms): print(i, nom)
      ```
      `len` renvoie un entier, qu'on ne peut pas parcourir. `range` en fait une suite d'indices ; `enumerate` évite même les indices.
  - key: bug-compte-a-rebours
    format: bug-fix
    question: |-
      Ce compte à rebours n'affiche que « Décollage ! ». Quelle correction est la bonne ?
      ```python
      for i in range(10, 0):
          print(i)
      print("Décollage !")
      ```
    choices:
      - {text: "`range(10, 0, -1)`", correct: true}
      - {text: "`range(10, 0, 1)`", correct: false}
      - {text: "`range(10, -1)`", correct: false}
      - {text: "`range(-10, 0)`", correct: false}
    answer: |-
      ```python
      for i in range(10, 0, -1):
          print(i)
      ```
      Avec le pas par défaut (+1), un `range` dont le début dépasse la fin est vide. Il faut un pas négatif pour descendre.
