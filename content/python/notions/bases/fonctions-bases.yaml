notion: fonctions-bases
lesson: |-
  Une fonction se définit avec **`def`**, son nom, ses paramètres entre parenthèses et deux-points ; son corps est
  indenté. **`return`** renvoie une valeur à l'appelant et quitte la fonction aussitôt.

  ```python
  def aire_rectangle(largeur, hauteur):
      """Renvoie l'aire d'un rectangle."""
      return largeur * hauteur

  surface = aire_rectangle(3, 4)    # 12
  ```

  - **Sans `return`**, ou avec un `return` seul, une fonction renvoie **`None`**. C'est le cas de `print`, et de toute
    fonction qui « fait » quelque chose sans rien calculer.
  - Une fonction peut avoir **plusieurs `return`** : le premier exécuté termine l'appel.
  - **`print` n'est pas `return`** : `print` affiche pour l'humain ; `return` transmet la valeur au code qui appelle.
    Une fonction qui affiche son résultat au lieu de le renvoyer est un bug classique (`None + None`).
  - **`def` est une instruction exécutée** : elle crée un objet fonction et le lie au nom. Appeler la fonction avant
    que son `def` ait été exécuté lève une `NameError`.
  - Le nom seul (`aire_rectangle`, sans parenthèses) désigne **l'objet fonction** ; les parenthèses l'appellent.
  - La **docstring**, une chaîne en première ligne du corps, documente la fonction (`help(aire_rectangle)`).
  - Les **annotations** (`def aire(l: float, h: float) -> float:`) documentent les types ; Python ne les vérifie pas à
    l'exécution, ce sont les outils (mypy, l'éditeur) qui s'en servent.
  - PEP 8 : des noms en `snake_case`, deux lignes vides autour d'une fonction de premier niveau.

  **En entretien** : « `def` crée la fonction à l'exécution ; `return` renvoie une valeur, et sans `return` la fonction
  renvoie `None`. Ne pas confondre afficher et renvoyer. Les annotations documentent les types sans les imposer. »
tour:
  - title: "Définir une fonction"
    text: |-
      `def` définit une fonction ; son corps est indenté. `return` renvoie une valeur à l'appelant.

      Une fonction sans `return` renvoie `None` : c'est le cas de `saluer`, qui **affiche** mais ne **renvoie** rien.
      La chaîne sous le `def` est la docstring, qui documente la fonction.

      Essaie : ajoute `print(help(aire_rectangle))`, ou appelle `aire_rectangle` avec un seul argument.
    example:
      files:
        main.py: |-
          def aire_rectangle(largeur, hauteur):
              """Renvoie l'aire d'un rectangle."""
              return largeur * hauteur


          def saluer(nom):
              print("Bonjour", nom)


          print(aire_rectangle(3, 4))
          resultat = saluer("Ada")
          print(resultat)
      output: |-
        12
        Bonjour Ada
        None
    task:
      instructions: |-
        La fonction `maximum` affiche le plus grand nombre au lieu de le renvoyer : le programme affiche `8`, puis
        `max : None`. Corrige-la pour que le programme n'affiche plus que `max : 8`.
      starter:
        main.py: |-
          def maximum(a, b):
              """Renvoie le plus grand de a et b."""
              print(a if a > b else b)


          plus_grand = maximum(3, 8)
          print("max :", plus_grand)
      solution:
        main.py: |-
          def maximum(a, b):
              """Renvoie le plus grand de a et b."""
              return a if a > b else b


          plus_grand = maximum(3, 8)
          print("max :", plus_grand)
      output: "max : 8"
cards:
  - key: sans-return
    format: course
    question: Une fonction exécute un `return` seul, sans valeur. Que reçoit l'appelant ?
    choices:
      - {text: "`None`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`False`", correct: false}
      - {text: "Une `SyntaxError` : `return` exige une valeur", correct: false}
    answer: "Toute fonction renvoie quelque chose : avec un `return` seul, ou sans `return` du tout, c'est `None`. Le `return` seul sert à sortir tôt d'une fonction qui ne calcule rien."
  - key: nom-sans-parentheses
    format: course
    question: "Après `def saluer(): ...`, que désigne `saluer` écrit sans parenthèses ?"
    choices:
      - {text: "L'objet fonction lui-même, sans l'appeler", correct: true}
      - {text: "Le résultat du dernier appel à `saluer`", correct: false}
      - {text: "Un appel à `saluer` sans aucun argument", correct: false}
      - {text: "Une erreur de syntaxe : il faut des parenthèses", correct: false}
    answer: "Les fonctions sont des objets : on peut les ranger dans une variable ou les passer en argument. Seules les parenthèses les appellent."
  - key: print-ou-return
    format: course
    question: Quelle différence entre `print` et `return` dans une fonction ?
    choices:
      - {text: "`print` affiche une valeur ; `return` la renvoie à l'appelant", correct: true}
      - {text: "Aucune : `return` affiche aussi la valeur qu'il renvoie", correct: false}
      - {text: "`print` renvoie la valeur ; `return` l'affiche à l'écran", correct: false}
      - {text: "`return` n'affiche la valeur que dans un script", correct: false}
    answer: "Le code appelant ne peut utiliser que ce qui est renvoyé. Une fonction qui affiche sans renvoyer donne `None` à son appelant."
  - key: annotations-verifiees
    format: course
    question: "Les annotations de `def aire(l: float) -> float:` sont-elles vérifiées à l'exécution ?"
    choices:
      - {text: "Non : Python les garde pour les outils, sans les vérifier", correct: true}
      - {text: "Oui : un argument d'un autre type lève une `TypeError`", correct: false}
      - {text: "Oui, mais seulement pour le type de la valeur renvoyée", correct: false}
      - {text: "Non : elles sont supprimées dès la compilation", correct: false}
    answer: "`aire(\"x\")` s'exécute, et échoue plus loin s'il le faut. Ce sont mypy, Pyright ou l'éditeur qui exploitent les annotations, accessibles dans `aire.__annotations__`."
  - key: vf-plusieurs-return
    format: true-false
    question: Une fonction peut contenir plusieurs instructions `return`.
    truth: true
    answer: "Le premier `return` exécuté termine l'appel. C'est courant pour traiter un cas particulier tôt (retour anticipé)."
  - key: vf-appel-avant-def
    format: true-false
    question: Appeler une fonction avant que son `def` ait été exécuté lève une `NameError`.
    truth: true
    answer: "`def` est une instruction : tant qu'elle n'a pas été exécutée, le nom n'existe pas. Dans un module, on définit donc avant d'appeler."
  - key: vf-return-zero
    format: true-false
    question: Un `return` sans valeur renvoie `0`.
    truth: false
    answer: "Il renvoie `None`, comme une fonction sans `return`."
  - key: vf-apres-return
    format: true-false
    question: Les instructions qui suivent un `return` exécuté, dans le même bloc, s'exécutent quand même.
    truth: false
    answer: "`return` quitte la fonction aussitôt : le code qui le suit dans le bloc est mort. (Seul un `finally` s'exécuterait encore.)"
  - key: qcm-definir
    format: multiple-choice
    question: Comment définit-on une fonction en Python ?
    choices:
      - {text: "`def carre(x):`", correct: true}
      - {text: "`function carre(x):`", correct: false}
      - {text: "`def carre(x) {`", correct: false}
      - {text: "`fun carre(x):`", correct: false}
    answer: "Le mot-clé `def`, le nom, les paramètres, puis les deux-points ; le corps est indenté."
  - key: qcm-resultat-print
    format: multiple-choice
    question: |-
      Que vaut `r` après `r = print("salut")` ?
    choices:
      - {text: "`None`", correct: true}
      - {text: "`\"salut\"`", correct: false}
      - {text: "`True`", correct: false}
      - {text: "`5`, le nombre de caractères", correct: false}
    answer: "`print` affiche, puis renvoie `None`, comme toute fonction sans `return`."
  - key: qcm-docstring
    format: multiple-choice
    question: Où place-t-on la docstring d'une fonction ?
    choices:
      - {text: "Juste après la ligne `def`, en première instruction du corps", correct: true}
      - {text: "Juste avant la ligne `def`, sous forme de commentaire", correct: false}
      - {text: "À la fin du corps, après le dernier `return`", correct: false}
      - {text: "Sur la ligne `def`, juste après les deux-points", correct: false}
    answer: "La première instruction du corps, si c'est une chaîne, devient `fonction.__doc__`, que `help()` affiche."
  - key: qcm-nom-pep8
    format: multiple-choice
    question: Quel nom de fonction respecte PEP 8 ?
    choices:
      - {text: "`calculer_total`", correct: true}
      - {text: "`CalculerTotal`", correct: false}
      - {text: "`calculerTotal`", correct: false}
      - {text: "`calculer-total`", correct: false}
    answer: "Fonctions et variables en `snake_case`, classes en `CamelCase`. `calculer-total` n'est même pas un nom valide : c'est une soustraction."
  - key: trous-def-return
    format: fill-in
    question: |-
      Complète la définition :
      ```python
      ___ double(x):
          ___ x * 2
      ```
    blanks: [[def], [return]]
    answer: "`def` définit la fonction, `return` renvoie le résultat."
  - key: trous-docstring
    format: fill-in
    question: |-
      Complète la docstring :
      ```python
      def aire(r):
          ___Renvoie l'aire d'un disque de rayon r.___
          return 3.14159 * r ** 2
      ```
    blanks: [['"""', "'''"], ['"""', "'''"]]
    answer: "Par convention (PEP 257), une docstring s'écrit entre triples guillemets, même sur une ligne."
  - key: trous-annotation-retour
    format: fill-in
    question: |-
      Complète l'annotation du type renvoyé :
      ```python
      def moyenne(notes: list[float]) ___ float:
          return sum(notes) / len(notes)
      ```
    blanks: [["->"]]
    answer: "La flèche `->` annonce le type renvoyé, avant les deux-points."
  - key: trous-renvoie-none
    format: fill-in
    question: |-
      Complète le test du résultat d'une fonction qui ne renvoie rien :
      ```python
      def journaliser(message):
          print(message)

      assert journaliser("ok") is ___
      ```
    blanks: [[None]]
    answer: "Sans `return`, la fonction renvoie `None`, qu'on teste avec `is`."
  - key: code-return-conditionnel
    format: code-output
    question: |-
      ```python
      def f(x):
          if x > 0:
              return "positif"

      print(f(5), f(-1))
      ```
    check:
      output: "positif None"
    choices:
      - {text: "`positif None`", correct: true}
      - {text: "`positif`", correct: false}
      - {text: "`positif False`", correct: false}
      - {text: "`positif 0`", correct: false}
    answer: "Pour -1, aucun `return` n'est exécuté : la fonction renvoie `None`, que `print` affiche."
  - key: code-affiche-sans-renvoyer
    format: code-output
    question: |-
      ```python
      def double(x):
          print(x * 2, end=" ")

      y = double(3)
      print(y)
      ```
    check:
      output: "6 None"
    choices:
      - {text: "`6 None`", correct: true}
      - {text: "`6 6`", correct: false}
      - {text: "`None`", correct: false}
      - {text: "`6`", correct: false}
    answer: "`double` affiche 6, mais ne renvoie rien : `y` vaut `None`."
  - key: code-retour-anticipe
    format: code-output
    question: |-
      ```python
      def premier_pair(nombres):
          for n in nombres:
              if n % 2 == 0:
                  return n
          return -1

      print(premier_pair([3, 4, 6]), premier_pair([1, 3]))
      ```
    check:
      output: "4 -1"
    choices:
      - {text: "`4 -1`", correct: true}
      - {text: "`6 -1`", correct: false}
      - {text: "`4 None`", correct: false}
      - {text: "`[4, 6] -1`", correct: false}
    answer: "Le `return` dans la boucle quitte la fonction au premier pair, 4. Sans pair, la boucle se termine et le dernier `return` donne -1."
  - key: code-fonction-objet
    format: code-output
    question: |-
      ```python
      def saluer():
          return "bonjour"

      f = saluer
      print(f(), f.__name__)
      ```
    check:
      output: "bonjour saluer"
    choices:
      - {text: "`bonjour saluer`", correct: true}
      - {text: "`bonjour f`", correct: false}
      - {text: "`saluer bonjour`", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "`f = saluer` lie un second nom au même objet fonction, qui garde son nom d'origine, `saluer`."
  - key: bug-print-au-lieu-de-return
    format: bug-fix
    question: |-
      Python affiche 120.0 et 60.0, puis « TypeError: unsupported operand type(s) for +: 'NoneType' and 'NoneType' ». Quelle correction est la bonne ?
      ```python
      def prix_ttc(ht):
          print(ht * 1.2)

      total = prix_ttc(100) + prix_ttc(50)
      ```
    choices:
      - {text: "Remplacer le `print` par `return ht * 1.2`", correct: true}
      - {text: "Écrire `total = print(prix_ttc(100) + prix_ttc(50))`", correct: false}
      - {text: "Convertir : `float(prix_ttc(100)) + float(prix_ttc(50))`", correct: false}
      - {text: "Déclarer `global total` dans la fonction", correct: false}
    answer: |-
      ```python
      def prix_ttc(ht):
          return ht * 1.2
      ```
      La fonction affiche son résultat mais renvoie `None` : l'addition porte sur deux `None`. `float(None)` lèverait une autre `TypeError`.
  - key: bug-appel-avant-def
    format: bug-fix
    question: |-
      Python répond « NameError: name 'carre' is not defined ». Quelle correction est la bonne ?
      ```python
      print(carre(4))

      def carre(x):
          return x * x
      ```
    choices:
      - {text: "Placer le `def` avant l'appel", correct: true}
      - {text: "Déclarer `global carre` en tête du fichier", correct: false}
      - {text: "Appeler `carre` sans parenthèses", correct: false}
      - {text: "Importer `carre` depuis `builtins`", correct: false}
    answer: |-
      ```python
      def carre(x):
          return x * x

      print(carre(4))
      ```
      `def` s'exécute comme une instruction : avant lui, le nom `carre` n'existe pas encore.
  - key: bug-oubli-parentheses
    format: bug-fix
    question: |-
      Python répond « TypeError: can only concatenate str (not "function") to str ». Quelle correction est la bonne ?
      ```python
      def nouveau_jeton():
          return "a1b2"

      jeton = nouveau_jeton
      print("Jeton : " + jeton)
      ```
    choices:
      - {text: "`jeton = nouveau_jeton()`", correct: true}
      - {text: "`jeton = str(nouveau_jeton)`", correct: false}
      - {text: "`jeton = nouveau_jeton.return`", correct: false}
      - {text: "`jeton = return nouveau_jeton`", correct: false}
    answer: |-
      ```python
      jeton = nouveau_jeton()
      ```
      Sans parenthèses, `jeton` désigne la fonction elle-même, pas son résultat. `str(nouveau_jeton)` donnerait `<function nouveau_jeton at 0x...>`.
  - key: bug-return-dans-boucle
    format: bug-fix
    question: |-
      Ce code affiche 1 au lieu de 6. Quelle correction est la bonne ?
      ```python
      def somme(nombres):
          total = 0
          for n in nombres:
              total += n
              return total

      print(somme([1, 2, 3]))
      ```
    choices:
      - {text: "Désindenter le `return` : il doit suivre la boucle", correct: true}
      - {text: "Remplacer `return total` par `print(total)`", correct: false}
      - {text: "Initialiser `total` à `None` plutôt qu'à 0", correct: false}
      - {text: "Remplacer `return total` par `yield total`", correct: false}
    answer: |-
      ```python
      def somme(nombres):
          total = 0
          for n in nombres:
              total += n
          return total
      ```
      Indenté dans la boucle, le `return` quitte la fonction dès le premier tour.
