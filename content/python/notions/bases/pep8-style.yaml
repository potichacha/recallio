notion: pep8-style
lesson: |-
  **PEP 8** est le guide de style du code Python. L'interpréteur ne l'impose pas, mais tout l'écosystème le suit : un
  code qui le respecte se lit comme celui des autres.

  **Les noms**

  | Quoi | Style | Exemple |
  |---|---|---|
  | variables, fonctions, méthodes, modules | `snake_case` | `prix_total`, `calculer_tva()`, `outils.py` |
  | classes, exceptions | `CapWords` | `CompteBancaire`, `SoldeInsuffisant` |
  | constantes (au niveau du module) | `MAJUSCULES` | `TAUX_TVA = 0.2` |
  | usage interne | `_nom` | `_cache` |
  | noms spéciaux du langage | `__nom__` | `__init__`, `__name__` |

  On évite `l`, `O` et `I` seuls (confondus avec 1 et 0), et les noms qui masquent une fonction native (`list`, `id`).

  **La mise en page**

  - Quatre espaces par niveau d'indentation, pas de tabulations.
  - Des lignes de **79 caractères** au plus (72 pour les commentaires et les docstrings). Beaucoup d'équipes passent à
    88 (le défaut de Black et de Ruff) : l'important est que le projet soit cohérent.
  - Deux lignes vides autour des fonctions et des classes de premier niveau, une entre les méthodes.
  - Une espace autour des opérateurs d'affectation et de comparaison, après les virgules ; pas d'espace juste à
    l'intérieur des parenthèses, ni avant celle d'un appel.
  - **Pas d'espace autour du `=`** d'un argument nommé ou d'une valeur par défaut : `f(x=1)`, `def f(x=1):` (mais
    `def f(x: int = 1):` avec une annotation).

  **Les imports** : en tête du fichier, un module par ligne, en trois groupes séparés par une ligne vide (la
  bibliothèque standard, les paquets tiers, les modules du projet). Pas de `from module import *`.

  **Les comparaisons** : `if x is None:` et non `== None` ; `if not items:` pour tester une séquence vide ; jamais
  `== True`.

  ```python
  import os
  import sys

  TAUX_TVA = 0.2


  def prix_ttc(prix_ht, taux=TAUX_TVA):
      return prix_ht * (1 + taux)
  ```

  **Les outils** : un formateur (**Black**, `ruff format`) réécrit le code tout seul ; un linter (**Ruff**, flake8,
  pycodestyle) signale le reste. On les branche dans l'éditeur et dans la CI, et le débat sur le style est clos.

  PEP 8 le dit elle-même : la cohérence au sein d'un projet passe avant le guide.

  **En entretien** : « PEP 8 est le guide de style : `snake_case` pour les fonctions et variables, `CapWords` pour les
  classes, `MAJUSCULES` pour les constantes, quatre espaces, des lignes courtes. On ne le vérifie pas à la main : un
  formateur comme Black ou Ruff, et un linter dans la CI. »
cards:
  - key: nom-fonction
    format: course
    question: Quel style de nom PEP 8 recommande-t-il pour une fonction ?
    choices:
      - {text: "`calculer_total`, en snake_case", correct: true}
      - {text: "`calculerTotal`, en camelCase", correct: false}
      - {text: "`CalculerTotal`, en CapWords", correct: false}
      - {text: "`CALCULER_TOTAL`, en majuscules", correct: false}
    answer: "Les fonctions, les méthodes et les variables sont en minuscules, avec des soulignés. Le camelCase de Java détonne dans du code Python."
  - key: nom-classe
    format: course
    question: Quel style de nom PEP 8 recommande-t-il pour une classe ?
    choices:
      - {text: "`CompteBancaire`, en CapWords", correct: true}
      - {text: "`compte_bancaire`, en snake_case", correct: false}
      - {text: "`compteBancaire`, en camelCase", correct: false}
      - {text: "`COMPTE_BANCAIRE`, en majuscules", correct: false}
    answer: "Les classes et les exceptions sont en CapWords. Quelques types natifs (`list`, `dict`, `str`) font exception, pour des raisons historiques."
  - key: longueur-ligne
    format: course
    question: Quelle longueur de ligne maximale PEP 8 recommande-t-il pour le code ?
    choices:
      - {text: "79 caractères", correct: true}
      - {text: "72 caractères", correct: false}
      - {text: "100 caractères", correct: false}
      - {text: "120 caractères", correct: false}
    answer: "79 pour le code, 72 pour les commentaires et les docstrings. Beaucoup d'équipes choisissent 88, la valeur de Black et de Ruff ; PEP 8 l'admet tant que le projet est cohérent."
  - key: tester-liste-vide
    format: course
    question: Comment PEP 8 recommande-t-il de tester qu'une liste `items` est vide ?
    choices:
      - {text: "`if not items:`", correct: true}
      - {text: "`if len(items) == 0:`", correct: false}
      - {text: "`if items == []:`", correct: false}
      - {text: "`if items is None:`", correct: false}
    answer: "Une séquence vide est fausse : `if not items:` suffit. `len(items) == 0` marche, mais n'est pas idiomatique ; `is None` teste tout autre chose."
  - key: vf-constantes-majuscules
    format: true-false
    question: "PEP 8 recommande de nommer les constantes en majuscules : `TAUX_TVA = 0.2`."
    truth: true
    answer: "C'est une convention : Python n'empêche pas de modifier `TAUX_TVA`, mais le nom signale qu'on ne doit pas le faire."
  - key: vf-espaces-argument-nomme
    format: true-false
    question: "PEP 8 recommande des espaces autour du `=` d'un argument nommé : `f(x = 1)`."
    truth: false
    answer: "Pas d'espace : `f(x=1)` et `def f(x=1):`. L'exception : avec une annotation, `def f(x: int = 1):`."
  - key: vf-interpreteur-pep8
    format: true-false
    question: L'interpréteur refuse d'exécuter un code qui ne respecte pas PEP 8.
    truth: false
    answer: "PEP 8 est une convention. Ce sont les outils (Ruff, flake8, Black) qui la vérifient ou l'appliquent, souvent dans la CI."
  - key: vf-deux-lignes-vides
    format: true-false
    question: PEP 8 recommande de séparer les fonctions de premier niveau par deux lignes vides.
    truth: true
    answer: "Deux lignes vides autour des fonctions et des classes de premier niveau, une seule entre les méthodes d'une classe."
  - key: qcm-ligne-conforme
    format: multiple-choice
    question: Quelle ligne respecte PEP 8 ?
    choices:
      - {text: "`total = prix * quantite + frais`", correct: true}
      - {text: "`total=prix*quantite+frais`", correct: false}
      - {text: "`total = ( prix * quantite + frais )`", correct: false}
      - {text: "`total = prix * quantite + frais ;`", correct: false}
    answer: "Une espace autour de l'affectation et des opérateurs, pas d'espace juste à l'intérieur des parenthèses, pas de point-virgule."
  - key: qcm-ordre-imports
    format: multiple-choice
    question: Dans quel ordre PEP 8 range-t-il les imports ?
    choices:
      - {text: "La bibliothèque standard, puis les paquets tiers, puis le projet", correct: true}
      - {text: "Le projet, puis les paquets tiers, puis la bibliothèque standard", correct: false}
      - {text: "Tous les modules par ordre alphabétique, sans groupes", correct: false}
      - {text: "Du module le plus utilisé au module le moins utilisé", correct: false}
    answer: "Trois groupes séparés par une ligne vide, chacun souvent trié par ordre alphabétique (Ruff et isort le font)."
  - key: qcm-formateur
    format: multiple-choice
    question: Quel outil reformate automatiquement le code dans un style proche de PEP 8 ?
    choices:
      - {text: "Black", correct: true}
      - {text: "pytest", correct: false}
      - {text: "mypy", correct: false}
      - {text: "pip", correct: false}
    answer: "Black (ou `ruff format`, compatible) réécrit le code. pytest lance les tests, mypy vérifie les types, pip installe les paquets."
  - key: qcm-prefixe-souligne
    format: multiple-choice
    question: Que signale le préfixe `_` d'un nom, comme `_cache` ?
    choices:
      - {text: "Un usage interne au module ou à la classe", correct: true}
      - {text: "Une constante qu'on ne doit pas modifier", correct: false}
      - {text: "Une variable globale partagée par les modules", correct: false}
      - {text: "Un nom réservé par l'interpréteur", correct: false}
    answer: "Une convention : rien n'empêche d'y accéder, mais ce n'est pas l'interface publique. `from module import *` ignore ces noms."
  - key: bug-noms-camelcase
    format: bug-fix
    question: |-
      En revue de code, on te signale que les noms de cette fonction ne suivent pas PEP 8 :
      ```python
      def CalculerTotal(listePrix):
          return sum(listePrix)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`def calculer_total(liste_prix):`", correct: true}
      - {text: "`def calculerTotal(listePrix):`", correct: false}
      - {text: "`def Calculer_Total(Liste_Prix):`", correct: false}
      - {text: "`def CALCULER_TOTAL(LISTE_PRIX):`", correct: false}
    answer: |-
      ```python
      def calculer_total(liste_prix):
          return sum(liste_prix)
      ```
      Fonctions et paramètres en snake_case : des minuscules et des soulignés.
  - key: bug-egal-none
    format: bug-fix
    question: |-
      Le linter du projet signale la comparaison à `None` de la deuxième ligne :
      ```python
      resultat = None
      if resultat == None:
          print("aucun résultat")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if resultat is None:`", correct: true}
      - {text: "`if resultat === None:`", correct: false}
      - {text: "`if resultat.equals(None):`", correct: false}
      - {text: "`if resultat == \"None\":`", correct: false}
    answer: |-
      ```python
      resultat = None
      if resultat is None:
          print("aucun résultat")
      ```
      `None` est un objet unique : on teste son identité avec `is`. `==` peut être redéfini par une classe et donner
      une réponse inattendue.
  - key: bug-classe-snake-case
    format: bug-fix
    question: |-
      En revue de code, on te signale que le nom de cette classe ne suit pas PEP 8 :
      ```python
      class compte_bancaire:
          pass
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`class CompteBancaire:`", correct: true}
      - {text: "`class compteBancaire:`", correct: false}
      - {text: "`class Compte_bancaire:`", correct: false}
      - {text: "`class COMPTE_BANCAIRE:`", correct: false}
    answer: |-
      ```python
      class CompteBancaire:
          pass
      ```
      Les classes s'écrivent en CapWords : chaque mot commence par une majuscule, sans souligné.
  - key: bug-imports-une-ligne
    format: bug-fix
    question: |-
      Le linter signale plusieurs imports sur une même ligne :
      ```python
      import os, sys

      print(os.sep, sys.platform)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un import par ligne : `import os`, puis `import sys`", correct: true}
      - {text: "`from os, sys import *`, sur une seule ligne", correct: false}
      - {text: "`import (os, sys)`, entre parenthèses", correct: false}
      - {text: "`import os; import sys`, séparés d'un point-virgule", correct: false}
    answer: |-
      ```python
      import os
      import sys

      print(os.sep, sys.platform)
      ```
      PEP 8 veut un module par ligne d'`import`. `from module import a, b` reste permis, pour plusieurs noms d'un même
      module.
