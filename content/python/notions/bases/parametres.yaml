notion: parametres
lesson: |-
  Les **paramètres** sont les noms du `def` ; les **arguments**, les valeurs passées à l'appel. Un argument se passe :

  - **par position** : `aire(3, 4)`, dans l'ordre des paramètres ;
  - **par nom** (argument nommé, ou *keyword argument*) : `aire(hauteur=4, largeur=3)`, dans n'importe quel ordre.

  À l'appel, **les positionnels viennent d'abord**, puis les nommés : `aire(3, hauteur=4)` est valide,
  `aire(largeur=3, 4)` est une `SyntaxError` (« positional argument follows keyword argument »).

  **Les valeurs par défaut** rendent un paramètre facultatif :

  ```python
  def saluer(nom, salutation="Bonjour", ponctuation="!"):
      print(f"{salutation} {nom}{ponctuation}")

  saluer("Ada")                       # Bonjour Ada!
  saluer("Linus", "Salut")            # Salut Linus!
  saluer("Guido", ponctuation=".")    # Bonjour Guido.
  ```

  - Dans le `def`, un paramètre **sans** valeur par défaut ne peut pas suivre un paramètre qui en a une : « parameter
    without a default follows parameter with a default ».
  - La valeur par défaut est évaluée **une seule fois**, quand le `def` s'exécute (d'où le piège d'une liste par défaut,
    vu dans une autre notion).
  - Python n'a **pas de surcharge** : un second `def` du même nom remplace le premier. Les valeurs par défaut en
    tiennent lieu.

  **Les erreurs d'appel** sont des `TypeError` au message précis :

  | Appel fautif | Message |
  |---|---|
  | un argument manque | `aire() missing 1 required positional argument: 'hauteur'` |
  | un argument de trop | `aire() takes 2 positional arguments but 3 were given` |
  | un nom inconnu | `envoyer() got an unexpected keyword argument 'urgente'` (Python suggère le bon nom) |
  | une valeur deux fois | `f() got multiple values for argument 'a'` |

  Nommer un argument rend l'appel lisible, surtout pour un booléen : `envoyer(message, urgent=True)` se comprend sans
  ouvrir la définition, `envoyer(message, True)` non.

  **En entretien** : « Les arguments se passent par position ou par nom, les positionnels d'abord. Une valeur par
  défaut rend le paramètre facultatif ; elle est évaluée une fois, au `def`. Pas de surcharge : les valeurs par défaut
  la remplacent. »
tour:
  - title: "Paramètres nommés et valeurs par défaut"
    text: |-
      Un argument se passe par **position** ou par **nom**. Un paramètre qui a une **valeur par défaut** devient
      facultatif.

      À l'appel, les arguments positionnels viennent d'abord, puis les nommés, dans l'ordre qu'on veut.

      Essaie : appelle `saluer()` sans argument. Python lève une `TypeError` qui nomme le paramètre manquant.
    example:
      files:
        main.py: |-
          def saluer(nom, salutation="Bonjour", ponctuation="!"):
              print(f"{salutation} {nom}{ponctuation}")


          saluer("Ada")
          saluer("Linus", "Salut")
          saluer("Guido", ponctuation=".")
          saluer(salutation="Coucou", nom="Grace")
      output: |-
        Bonjour Ada!
        Salut Linus!
        Bonjour Guido.
        Coucou Grace!
cards:
  - key: parametre-ou-argument
    format: course
    question: Quelle différence entre un paramètre et un argument ?
    choices:
      - {text: "Le paramètre est le nom dans le `def` ; l'argument, la valeur passée", correct: true}
      - {text: "Le paramètre est obligatoire ; l'argument a une valeur par défaut", correct: false}
      - {text: "Le paramètre est positionnel ; l'argument est toujours nommé", correct: false}
      - {text: "Aucune : les deux mots désignent la valeur passée à l'appel", correct: false}
    answer: "Dans `def aire(largeur, hauteur)`, `largeur` est un paramètre ; dans `aire(3, 4)`, 3 est un argument."
  - key: ordre-a-l-appel
    format: course
    question: Dans un appel, peut-on placer un argument positionnel après un argument nommé ?
    choices:
      - {text: "Non : les positionnels d'abord, puis les nommés", correct: true}
      - {text: "Oui : l'ordre des arguments est libre", correct: false}
      - {text: "Oui, si le nommé vise le dernier paramètre", correct: false}
      - {text: "Non, sauf si tous ont une valeur par défaut", correct: false}
    answer: "`aire(largeur=3, 4)` est une `SyntaxError` : « positional argument follows keyword argument ». Entre eux, les arguments nommés se placent dans l'ordre qu'on veut."
  - key: surcharge
    format: course
    question: Python permet-il deux fonctions du même nom avec des paramètres différents (la surcharge) ?
    choices:
      - {text: "Non : la seconde définition remplace la première", correct: true}
      - {text: "Oui : Python choisit selon le nombre d'arguments", correct: false}
      - {text: "Oui : Python choisit selon le type des arguments", correct: false}
      - {text: "Non : la seconde définition lève une `SyntaxError`", correct: false}
    answer: "Un `def` lie un nom à une fonction ; le second `def` relie le même nom à une autre. Les valeurs par défaut, ou `functools.singledispatch`, remplacent la surcharge."
  - key: booleen-nomme
    format: course
    question: Pourquoi appeler `envoyer(msg, urgent=True)` plutôt que `envoyer(msg, True)` ?
    choices:
      - {text: "L'appel se comprend sans ouvrir la définition de la fonction", correct: true}
      - {text: "L'argument nommé est transmis plus vite à la fonction", correct: false}
      - {text: "Un booléen ne peut pas être passé par position en Python", correct: false}
      - {text: "L'argument nommé n'est évalué que s'il sert dans la fonction", correct: false}
    answer: "Un `True` isolé ne dit pas ce qu'il règle. Nommé, il se lit tout seul, et il résiste à un changement d'ordre des paramètres."
  - key: vf-sans-defaut-apres
    format: true-false
    question: Dans un `def`, un paramètre sans valeur par défaut peut suivre un paramètre qui en a une.
    truth: false
    answer: "C'est une `SyntaxError` : « parameter without a default follows parameter with a default ». Les paramètres facultatifs viennent en dernier (sauf ceux qui sont nommés seulement, après `*`)."
  - key: vf-ordre-nommes
    format: true-false
    question: On peut passer des arguments nommés dans un autre ordre que celui des paramètres.
    truth: true
    answer: "C'est l'intérêt des arguments nommés : `aire(hauteur=4, largeur=3)` vaut `aire(3, 4)`."
  - key: vf-argument-en-trop
    format: true-false
    question: Appeler une fonction avec un argument de trop lève une `TypeError`.
    truth: true
    answer: "Par exemple : « aire() takes 2 positional arguments but 3 were given »."
  - key: vf-defaut-recalcule
    format: true-false
    question: La valeur par défaut d'un paramètre est recalculée à chaque appel.
    truth: false
    answer: "Elle est évaluée une seule fois, quand le `def` s'exécute, puis réutilisée. C'est sans danger pour un nombre ou une chaîne, piégeux pour une liste."
  - key: qcm-appel-invalide
    format: multiple-choice
    question: "Avec `def f(a, b=2, c=3)`, quel appel est invalide ?"
    choices:
      - {text: "`f(a=1, 5)`", correct: true}
      - {text: "`f(1)`", correct: false}
      - {text: "`f(1, c=5)`", correct: false}
      - {text: "`f(c=5, a=1)`", correct: false}
    answer: "Un argument positionnel ne peut pas suivre un argument nommé : c'est une `SyntaxError`, levée avant même l'exécution."
  - key: qcm-deux-valeurs
    format: multiple-choice
    question: "Avec `def f(a, b)`, que donne l'appel `f(1, a=2)` ?"
    choices:
      - {text: "Une `TypeError` : `a` reçoit deux valeurs", correct: true}
      - {text: "`a` vaut 2 et `b` vaut 1", correct: false}
      - {text: "`a` vaut 1 et `b` vaut 2", correct: false}
      - {text: "Une `SyntaxError` dès la lecture du code", correct: false}
    answer: "1 remplit `a` par position, puis `a=2` le vise encore : « f() got multiple values for argument 'a' ». L'appel est syntaxiquement valide."
  - key: qcm-message-manquant
    format: multiple-choice
    question: "Avec `def aire(largeur, hauteur)`, quel message accompagne la `TypeError` de l'appel `aire(3)` ?"
    choices:
      - {text: "`missing 1 required positional argument: 'hauteur'`", correct: true}
      - {text: "`takes 2 positional arguments but 1 was given`", correct: false}
      - {text: "`got an unexpected keyword argument 'hauteur'`", correct: false}
      - {text: "`name 'hauteur' is not defined`", correct: false}
    answer: "Python nomme le paramètre qui manque : « aire() missing 1 required positional argument: 'hauteur' »."
  - key: qcm-port-facultatif
    format: multiple-choice
    question: |-
      Quelle signature permet d'appeler `connecter("hote")` comme `connecter("hote", 8080)` ?
    choices:
      - {text: "`def connecter(hote, port=80):`", correct: true}
      - {text: "`def connecter(port=80, hote):`", correct: false}
      - {text: "`def connecter(hote, port):`", correct: false}
      - {text: "`def connecter(hote; port=80):`", correct: false}
    answer: "Le paramètre facultatif vient après l'obligatoire. L'inverse est une `SyntaxError`, et sans valeur par défaut, `port` est obligatoire."
  - key: trous-taux-defaut
    format: fill-in
    question: |-
      Complète pour que `taux` vaille 0.2 quand on ne le passe pas :
      ```python
      def prix_ttc(ht, taux___0.2):
          return ht * (1 + taux)
      ```
    blanks: [["="]]
    answer: "`taux=0.2` : PEP 8 n'entoure pas ce `=` d'espaces."
  - key: trous-argument-nomme
    format: fill-in
    question: |-
      Complète l'appel en nommant l'argument :
      ```python
      def envoyer(message, urgent=False):
          ...

      envoyer("Serveur arrêté", ___=True)
      ```
    blanks: [[urgent]]
    answer: "L'argument nommé reprend le nom du paramètre : `urgent=True`."
  - key: trous-puissance-defaut
    format: fill-in
    question: |-
      Complète pour que l'appel `puissance(3)` renvoie 9 :
      ```python
      def puissance(x, n=___):
          return x ** n
      ```
    blanks: [["2"]]
    answer: "Avec `n=2` par défaut, `puissance(3)` calcule 3 au carré."
  - key: trous-seul-separateur
    format: fill-in
    question: |-
      Complète l'appel pour ne changer que le séparateur, en gardant la valeur par défaut de `fin` :
      ```python
      def joindre(mots, separateur=" ", fin=""):
          return separateur.join(mots) + fin

      joindre(["a", "b"], ___="-")
      ```
    blanks: [[separateur]]
    answer: "Nommer l'argument permet de viser un paramètre précis, sans fournir ceux qui le précèdent ou le suivent."
  - key: code-defaut-et-nomme
    format: code-output
    question: |-
      ```python
      def f(a, b=2, c=3):
          print(a, b, c)

      f(1, c=10)
      ```
    check:
      output: "1 2 10"
    choices:
      - {text: "`1 2 10`", correct: true}
      - {text: "`1 10 3`", correct: false}
      - {text: "`1 2 3`", correct: false}
      - {text: "`10 2 3`", correct: false}
    answer: "`a` reçoit 1 par position, `c` reçoit 10 par son nom, et `b` garde sa valeur par défaut."
  - key: code-puissance
    format: code-output
    question: |-
      ```python
      def puissance(base, exposant=2):
          return base ** exposant

      print(puissance(3), puissance(2, 5), puissance(exposant=3, base=2))
      ```
    check:
      output: "9 32 8"
    choices:
      - {text: "`9 32 8`", correct: true}
      - {text: "`9 32 9`", correct: false}
      - {text: "`6 10 8`", correct: false}
      - {text: "`9 25 8`", correct: false}
    answer: "3² = 9, 2⁵ = 32, et 2³ = 8 : les arguments nommés se placent dans n'importe quel ordre."
  - key: code-nommes-inverses
    format: code-output
    question: |-
      ```python
      def f(a, b):
          return a - b

      print(f(b=10, a=3))
      ```
    check:
      output: "-7"
    choices:
      - {text: "`-7`", correct: true}
      - {text: "`7`", correct: false}
      - {text: "`13`", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "Les arguments nommés vont à leur paramètre, quel que soit leur ordre : `a` vaut 3, `b` vaut 10."
  - key: code-none-par-defaut
    format: code-output
    question: |-
      ```python
      def decrire(nom, age=None):
          if age is None:
              return nom
          return f"{nom} ({age} ans)"

      print(decrire("Ada"), "/", decrire("Linus", 54))
      ```
    check:
      output: "Ada / Linus (54 ans)"
    choices:
      - {text: "`Ada / Linus (54 ans)`", correct: true}
      - {text: "`Ada None / Linus (54 ans)`", correct: false}
      - {text: "`Ada (None ans) / Linus (54 ans)`", correct: false}
      - {text: "`Ada / Linus`", correct: false}
    answer: "`None` comme valeur par défaut signale un argument absent ; la fonction le teste avec `is None`."
  - key: bug-defaut-avant-obligatoire
    format: bug-fix
    question: |-
      Python répond « SyntaxError: parameter without a default follows parameter with a default ». Quelle correction est la bonne ?
      ```python
      def creer_compte(pays="FR", nom):
          return f"{nom} ({pays})"
      ```
    choices:
      - {text: "`def creer_compte(nom, pays=\"FR\"):`", correct: true}
      - {text: "`def creer_compte(pays=\"FR\", nom=):`", correct: false}
      - {text: "`def creer_compte(pays: \"FR\", nom):`", correct: false}
      - {text: "`def creer_compte(nom, pays==\"FR\"):`", correct: false}
    answer: |-
      ```python
      def creer_compte(nom, pays="FR"):
          return f"{nom} ({pays})"
      ```
      Les paramètres facultatifs viennent après les obligatoires. `pays: "FR"` serait une annotation, pas une valeur par défaut.
  - key: bug-positionnel-apres-nomme
    format: bug-fix
    question: |-
      Python répond « SyntaxError: positional argument follows keyword argument ». Quelle correction est la bonne ?
      ```python
      def aire(largeur, hauteur):
          return largeur * hauteur

      print(aire(largeur=3, 4))
      ```
    choices:
      - {text: "`aire(3, hauteur=4)`", correct: true}
      - {text: "`aire(largeur=3, 4=hauteur)`", correct: false}
      - {text: "`aire(4, largeur=3)`", correct: false}
      - {text: "`aire(largeur=3; 4)`", correct: false}
    answer: |-
      ```python
      print(aire(3, hauteur=4))
      ```
      Les positionnels d'abord, les nommés ensuite. `aire(4, largeur=3)` donnerait deux valeurs à `largeur` : une `TypeError`.
  - key: bug-pas-de-surcharge
    format: bug-fix
    question: |-
      Python répond « TypeError: aire() missing 1 required positional argument: 'hauteur' ». Quelle correction est la bonne ?
      ```python
      def aire(cote):
          return cote * cote

      def aire(largeur, hauteur):
          return largeur * hauteur

      print(aire(3))
      ```
    choices:
      - {text: "Une seule fonction : `def aire(largeur, hauteur=None)`, carré si `hauteur` manque", correct: true}
      - {text: "Échanger les deux `def`, pour que Python garde les deux versions", correct: false}
      - {text: "Annoter les paramètres, pour que Python choisisse la bonne version", correct: false}
      - {text: "Appeler `aire(3, None)` pour sélectionner la version à un paramètre", correct: false}
    answer: |-
      ```python
      def aire(largeur, hauteur=None):
          if hauteur is None:
              hauteur = largeur
          return largeur * hauteur
      ```
      Python n'a pas de surcharge : le second `def` remplace le premier. Une valeur par défaut permet les deux usages.
  - key: bug-nom-mal-ecrit
    format: bug-fix
    question: |-
      Python répond « TypeError: envoyer() got an unexpected keyword argument 'urgente'. Did you mean 'urgent'? ». Quelle correction est la bonne ?
      ```python
      def envoyer(message, urgent=False):
          print("URGENT" if urgent else "normal", message)

      envoyer("Serveur arrêté", urgente=True)
      ```
    choices:
      - {text: "`envoyer(\"Serveur arrêté\", urgent=True)`", correct: true}
      - {text: "`envoyer(\"Serveur arrêté\", urgente==True)`", correct: false}
      - {text: "`envoyer(urgente=True, \"Serveur arrêté\")`", correct: false}
      - {text: "`envoyer(\"Serveur arrêté\", \"urgente\"=True)`", correct: false}
    answer: |-
      ```python
      envoyer("Serveur arrêté", urgent=True)
      ```
      Un argument nommé doit porter exactement le nom d'un paramètre. Depuis Python 3.13, le message suggère le nom le plus proche.
