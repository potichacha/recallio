notion: entree-sortie-console
lesson: |-
  **`print`** a une signature plus riche qu'il n'y paraît :

  ```python
  print(*objets, sep=" ", end="\n", file=None, flush=False)
  ```

  - Chaque objet est converti par `str`, puis les objets sont séparés par **`sep`** (une espace par défaut).
  - **`end`** est écrit à la fin (un retour à la ligne par défaut) : `end=""` reste sur la même ligne.
  - **`file`** choisit la destination (par défaut, `sys.stdout`) : `file=sys.stderr` pour un message d'erreur, ou
    un fichier ouvert en écriture.
  - **`flush=True`** force l'écriture immédiate (une barre de progression, un message avant une longue attente).
  - `print` renvoie `None`.

  ```python
  print("a", "b", "c", sep="-")          # a-b-c
  print("Chargement", end="... ")
  print("terminé")                       # Chargement... terminé
  print(*[1, 2, 3], sep=", ")            # 1, 2, 3 : l'étoile déballe la liste
  print("échec", file=sys.stderr)        # sur la sortie d'erreur
  ```

  **`input(invite)`** affiche l'invite (sans retour à la ligne), attend que l'utilisateur tape une ligne, et la
  renvoie **sans** le retour à la ligne final, **toujours sous forme de `str`** :

  ```python
  nom = input("Ton nom ? ")
  age = int(input("Ton âge ? "))         # à convertir soi-même
  ```

  Si l'entrée standard est fermée (Ctrl-D, un fichier redirigé arrivé à sa fin, un programme lancé sans entrée),
  `input` lève une **`EOFError`**. Pour lire beaucoup de lignes, on parcourt `sys.stdin` : `for ligne in sys.stdin:`.
  Pour un mot de passe, `getpass.getpass()` n'affiche pas la saisie.

  Dans un terminal, `python script.py > sortie.txt` redirige ce que `print` écrit ; la sortie d'erreur reste à
  l'écran, d'où l'intérêt de `file=sys.stderr` pour les messages d'erreur.

  **En entretien** : « `print` convertit ses arguments avec `str`, les sépare par `sep` et termine par `end` ; `file`
  et `flush` règlent la destination et l'écriture immédiate. `input` renvoie toujours une chaîne, sans le retour à la
  ligne, et lève `EOFError` quand l'entrée est fermée. »
tour:
  - title: print en détail, et input
    text: |-
      `print` sépare ses arguments par `sep` (une espace par défaut) et termine par `end` (un retour à la ligne).
      `end=""` ou `end=", "` permet de continuer sur la même ligne. Une étoile devant une liste passe ses éléments
      comme autant d'arguments.

      `input("question ")` lit une ligne tapée au clavier et la renvoie sous forme de chaîne. Ici, le programme n'a pas
      d'entrée : un appel à `input()` lèverait une `EOFError`. On ne l'utilise pas dans le Tour.

      Essaie : remplace `sep=", "` par `sep=" < "`.
    example:
      files:
        main.py: |-
          print("a", "b", "c")
          print("a", "b", "c", sep="-")
          print("sans retour", end=" | ")
          print("suite")
          print(*[1, 2, 3], sep=", ")

          for v in [10, 20, 30]:
              print(v, end=", ")
          print("fin")
      output: |-
        a b c
        a-b-c
        sans retour | suite
        1, 2, 3
        10, 20, 30, fin
cards:
  - key: input-renvoie-chaine
    format: course
    question: Que renvoie `input()` quand l'utilisateur tape `42`, puis Entrée ?
    choices:
      - {text: "La chaîne `\"42\"`", correct: true}
      - {text: "L'entier `42`", correct: false}
      - {text: "La chaîne `\"42\\n\"`", correct: false}
      - {text: "Le flottant `42.0`", correct: false}
    answer: "`input` renvoie toujours une `str`, sans le retour à la ligne final. Pour un nombre : `int(input())`."
  - key: role-de-end
    format: course
    question: À quoi sert le paramètre `end` de `print` ?
    choices:
      - {text: "Il remplace le retour à la ligne écrit après le dernier argument", correct: true}
      - {text: "Il remplace l'espace écrite entre deux arguments successifs", correct: false}
      - {text: "Il arrête le programme une fois l'affichage terminé", correct: false}
      - {text: "Il limite le nombre de caractères affichés sur la ligne", correct: false}
    answer: "`end=\"\"` garde le curseur sur la même ligne. L'espace entre les arguments, c'est `sep`."
  - key: ecrire-sur-stderr
    format: course
    question: Comment écrit-on un message sur la sortie d'erreur ?
    choices:
      - {text: "`print(message, file=sys.stderr)`", correct: true}
      - {text: "`print(message, err=True)`", correct: false}
      - {text: "`print.error(message)`", correct: false}
      - {text: "`sys.stderr(message)`", correct: false}
    answer: "Le paramètre `file` choisit le flux. Une redirection `> sortie.txt` ne capture alors que les résultats, et les erreurs restent visibles."
  - key: input-entree-fermee
    format: course
    question: Que se passe-t-il quand `input()` est appelé alors que l'entrée standard est fermée ?
    choices:
      - {text: "Il lève une `EOFError`", correct: true}
      - {text: "Il renvoie la chaîne vide `\"\"`", correct: false}
      - {text: "Il renvoie `None`", correct: false}
      - {text: "Il attend indéfiniment une saisie", correct: false}
    answer: "Ctrl-D (Ctrl-Z puis Entrée sous Windows), ou un fichier redirigé arrivé à sa fin : `input` signale la fin de l'entrée par une `EOFError`."
  - key: vf-sep-vide
    format: true-false
    question: "`print(1, 2, sep=\"\")` affiche `12`."
    truth: true
    answer: "Avec un séparateur vide, les arguments se suivent sans espace."
  - key: vf-input-convertit
    format: true-false
    question: "`input()` convertit la saisie en nombre quand c'est possible."
    truth: false
    answer: "C'était le comportement d'`input` en Python 2. En Python 3, la saisie reste une chaîne : on la convertit soi-même."
  - key: vf-print-renvoie
    format: true-false
    question: "`print` renvoie la chaîne qu'il vient d'afficher."
    truth: false
    answer: "`print` renvoie `None`. Pour obtenir la chaîne, on la construit d'abord (une f-string, `str.join`)."
  - key: vf-invite-input
    format: true-false
    question: "Le texte passé à `input(\"Nom ? \")` s'affiche avant la saisie, sans retour à la ligne."
    truth: true
    answer: "L'invite est écrite telle quelle : on y met souvent une espace finale, pour que la saisie ne colle pas au texte."
  - key: qcm-deballer-liste
    format: multiple-choice
    question: Comment affiche-t-on les éléments de la liste `nombres` sur une ligne, séparés par des virgules ?
    choices:
      - {text: "`print(*nombres, sep=\",\")`", correct: true}
      - {text: "`print(nombres, sep=\",\")`", correct: false}
      - {text: "`print(nombres.join(\",\"))`", correct: false}
      - {text: "`print(sep=\",\", nombres)`", correct: false}
    answer: "L'étoile passe chaque élément comme un argument. Sans elle, `print` reçoit un seul argument, la liste, et affiche `[1, 2, 3]`."
  - key: qcm-lire-entier
    format: multiple-choice
    question: Comment lit-on un entier tapé par l'utilisateur ?
    choices:
      - {text: "`int(input())`", correct: true}
      - {text: "`input(int)`", correct: false}
      - {text: "`input().int()`", correct: false}
      - {text: "`int.input()`", correct: false}
    answer: "`input` renvoie une chaîne, que `int` convertit. Une saisie invalide lève une `ValueError`."
  - key: qcm-flush
    format: multiple-choice
    question: Pourquoi passe-t-on `flush=True` à `print` ?
    choices:
      - {text: "Pour forcer l'écriture immédiate du texte", correct: true}
      - {text: "Pour effacer l'écran avant d'écrire", correct: false}
      - {text: "Pour supprimer le retour à la ligne final", correct: false}
      - {text: "Pour vider la variable une fois affichée", correct: false}
    answer: "La sortie est souvent mise en tampon. Sans `flush`, un `print(\".\", end=\"\")` dans une longue boucle peut n'apparaître qu'à la fin."
  - key: qcm-sep-defaut
    format: multiple-choice
    question: Quelle est la valeur par défaut de `sep` dans `print` ?
    choices:
      - {text: "Une espace", correct: true}
      - {text: "La chaîne vide", correct: false}
      - {text: "Un retour à la ligne", correct: false}
      - {text: "Une virgule suivie d'une espace", correct: false}
    answer: "`print(\"a\", \"b\")` affiche `a b`. Le retour à la ligne est la valeur par défaut d'`end`."
  - key: trous-sep
    format: fill-in
    question: |-
      Complète pour afficher `a;b;c` :
      ```python
      print("a", "b", "c", ___=";")
      ```
    blanks: [[sep]]
    answer: "`sep` est écrit entre les arguments."
  - key: trous-end
    format: fill-in
    question: |-
      Complète pour rester sur la même ligne après l'affichage :
      ```python
      print("Chargement...", ___="")
      ```
    blanks: [[end]]
    answer: "`end` remplace le retour à la ligne final."
  - key: trous-input
    format: fill-in
    question: |-
      Complète pour demander son nom à l'utilisateur :
      ```python
      nom = ___("Ton nom ? ")
      ```
    blanks: [[input]]
    answer: "`input` affiche l'invite, puis renvoie la ligne tapée."
  - key: trous-stderr
    format: fill-in
    question: |-
      Complète pour écrire sur la sortie d'erreur :
      ```python
      import sys
      print("échec", file=sys.___)
      ```
    blanks: [[stderr]]
    answer: "`sys.stderr` est la sortie d'erreur, `sys.stdout` la sortie standard."
  - key: code-sep-end
    format: code-output
    question: |-
      ```python
      print("x", "y", sep="", end="!")
      print()
      ```
    answer: "`xy!` : pas de séparateur, `!` à la place du retour à la ligne, puis `print()` termine la ligne."
    check:
      output: "xy!"
    choices:
      - {text: "`xy!`", correct: true}
      - {text: "`x y!`", correct: false}
      - {text: "`xy`", correct: false}
      - {text: "`x!y!`", correct: false}
  - key: code-sep-personnalise
    format: code-output
    question: |-
      ```python
      print(1, 2, 3, sep=" + ", end=" = 6\n")
      ```
    answer: "`1 + 2 + 3 = 6` : `sep` s'écrit entre les arguments, `end` après le dernier."
    check:
      output: "1 + 2 + 3 = 6"
    choices:
      - {text: "`1 + 2 + 3 = 6`", correct: true}
      - {text: "`1 2 3 = 6`", correct: false}
      - {text: "`1 + 2 + 3 +  = 6`", correct: false}
      - {text: "`6 = 6`", correct: false}
  - key: code-etoile-chaine
    format: code-output
    question: |-
      ```python
      print(*"abc")
      ```
    answer: "`a b c` : l'étoile passe chaque caractère comme un argument, séparé par une espace."
    check:
      output: "a b c"
    choices:
      - {text: "`a b c`", correct: true}
      - {text: "`abc`", correct: false}
      - {text: "`*abc`", correct: false}
      - {text: "`['a', 'b', 'c']`", correct: false}
  - key: code-print-renvoie-none
    format: code-output
    question: |-
      ```python
      r = print("x", end="")
      print(r)
      ```
    answer: "`xNone` : le premier `print` écrit `x` sans retour à la ligne, et renvoie `None`, que le second affiche."
    check:
      output: "xNone"
    choices:
      - {text: "`xNone`", correct: true}
      - text: |-
          ```
          x
          None
          ```
        correct: false
      - {text: "`xx`", correct: false}
      - {text: "`x`", correct: false}
