notion: retours-multiples
lesson: |-
  Une fonction Python ne renvoie qu'**un seul objet**. Pour renvoyer plusieurs valeurs, elle renvoie un **tuple**, que
  l'appelant **déballe** :

  ```python
  def min_max(nombres):
      return min(nombres), max(nombres)      # le tuple (min, max)

  bas, haut = min_max([4, 9, 1, 7])          # bas = 1, haut = 9
  ```

  - C'est la **virgule** qui fait le tuple, pas les parenthèses : `return a, b` et `return (a, b)` sont identiques.
    Attention, `return x,` (virgule finale) renvoie le tuple `(x,)`.
  - Le déballage exige le bon nombre de noms : sinon, `ValueError: too many values to unpack (expected 2, got 3)` ou
    `not enough values to unpack (expected 3, got 2)`.
  - `_` ignore une valeur par convention : `_, reste = divmod(17, 5)`.
  - `*` ramasse le reste : `premier, *autres = f()` (`autres` est une **liste**).
  - Sans déballage, on garde le tuple : `resultat = min_max(xs)`, puis `resultat[0]`.

  La bibliothèque standard fait de même : `divmod(17, 5)` renvoie `(3, 2)`, `dict.items()` produit des paires.

  **Au-delà de deux ou trois valeurs**, ou quand leur ordre n'est pas évident, un tuple anonyme se lit mal : on renvoie
  une `namedtuple`, une dataclass ou un dictionnaire, dont les champs ont un nom.

  ```python
  def statistiques(notes: list[float]) -> tuple[float, float, float]:
      """Renvoie (minimum, maximum, moyenne)."""
      return min(notes), max(notes), sum(notes) / len(notes)
  ```

  **En entretien** : « `return a, b` renvoie un seul objet, le tuple `(a, b)`, que l'appelant déballe avec
  `x, y = f()`. Un mauvais nombre de noms lève une `ValueError`. Au-delà de quelques valeurs, une `namedtuple` ou une
  dataclass nomme les champs. »
tour:
  - title: "Renvoyer plusieurs valeurs"
    text: |-
      `return a, b` renvoie un **tuple** : c'est la virgule qui le fait. L'appelant le **déballe** en autant de noms :
      `bas, haut = min_max(...)`.

      `divmod`, intégrée à Python, renvoie ainsi le quotient et le reste.

      Essaie : écris `bas, haut, milieu = min_max([4, 9, 1, 7])`, et lis le message de la `ValueError`.
    example:
      files:
        main.py: |-
          def min_max(nombres):
              return min(nombres), max(nombres)


          bas, haut = min_max([4, 9, 1, 7])
          print(bas, haut)

          resultat = min_max([3, 5])
          print(resultat, type(resultat).__name__)

          quotient, reste = divmod(17, 5)
          print(quotient, reste)
      output: |-
        1 9
        (3, 5) tuple
        3 2
cards:
  - key: ce-qui-est-renvoye
    format: course
    question: Que renvoie réellement `return a, b` ?
    choices:
      - {text: "Un seul objet : le tuple `(a, b)`", correct: true}
      - {text: "Deux objets distincts, placés sur la pile", correct: false}
      - {text: "Une liste `[a, b]`", correct: false}
      - {text: "Seulement `a` : `b` est ignoré", correct: false}
    answer: "La virgule construit un tuple ; la fonction renvoie cet unique objet, que l'appelant déballe s'il le souhaite."
  - key: trop-de-valeurs
    format: course
    question: Que donne `x, y = f()` si `f` renvoie trois valeurs ?
    choices:
      - {text: "Une `ValueError` : trop de valeurs à déballer", correct: true}
      - {text: "`x` et `y` reçoivent les deux premières", correct: false}
      - {text: "`y` reçoit les deux dernières, dans un tuple", correct: false}
      - {text: "`x` reçoit le tuple entier, et `y` vaut `None`", correct: false}
    answer: "« too many values to unpack (expected 2, got 3) ». Pour ramasser le reste : `x, *y = f()`."
  - key: quand-nommer
    format: course
    question: Quand préférer une `namedtuple` ou une dataclass au tuple renvoyé ?
    choices:
      - {text: "Quand les valeurs sont nombreuses, ou leur ordre peu évident", correct: true}
      - {text: "Dès que la fonction renvoie deux valeurs", correct: false}
      - {text: "Quand les valeurs sont toutes du même type", correct: false}
      - {text: "Quand la fonction est appelée dans une boucle", correct: false}
    answer: "`stats.moyenne` se lit mieux que `stats[2]`. Pour deux valeurs évidentes, comme `divmod`, un tuple suffit."
  - key: ignorer-valeur
    format: course
    question: Comment ignorer l'une des valeurs renvoyées ?
    choices:
      - {text: "La déballer dans `_` : `_, reste = divmod(17, 5)`", correct: true}
      - {text: "La déballer dans `None` : `None, reste = divmod(17, 5)`", correct: false}
      - {text: "Laisser sa place vide : `, reste = divmod(17, 5)`", correct: false}
      - {text: "La nommer `skip`, un mot-clé prévu pour cela", correct: false}
    answer: "`_` est un nom ordinaire, qui signale par convention une valeur inutilisée. `None` ne peut pas être affecté : c'est une `SyntaxError`."
  - key: vf-parentheses
    format: true-false
    question: "`return a, b` et `return (a, b)` renvoient la même chose."
    truth: true
    answer: "C'est la virgule qui fait le tuple ; les parenthèses ne servent qu'à la lisibilité ou à lever une ambiguïté."
  - key: vf-divmod
    format: true-false
    question: "`divmod(17, 5)` renvoie le tuple `(3, 2)`."
    truth: true
    answer: "Le quotient entier, 3, et le reste, 2 : comme `(17 // 5, 17 % 5)`."
  - key: vf-plusieurs-objets
    format: true-false
    question: Une fonction Python peut renvoyer plusieurs objets distincts sans les regrouper.
    truth: false
    answer: "Elle renvoie toujours un seul objet. `return a, b` les regroupe dans un tuple."
  - key: vf-virgule-finale
    format: true-false
    question: "`return x,` (avec une virgule finale) renvoie `x` seul."
    truth: false
    answer: "La virgule crée un tuple d'un élément : `(x,)`. Une virgule oubliée en fin de ligne est une source de bugs."
  - key: qcm-deballage-valide
    format: multiple-choice
    question: "Avec `def f(): return 1, 2, 3`, quel déballage est valide ?"
    choices:
      - {text: "`premier, *reste = f()`", correct: true}
      - {text: "`premier, reste = f()`", correct: false}
      - {text: "`*debut, *fin = f()`", correct: false}
      - {text: "`(premier, reste) = f()`", correct: false}
    answer: "`*reste` ramasse les valeurs restantes dans une liste. Deux noms pour trois valeurs lèvent une `ValueError`, et deux étoiles sont une `SyntaxError`."
  - key: qcm-type-retour
    format: multiple-choice
    question: "Avec `def f(): return 1, 2`, que vaut `type(f())` ?"
    choices:
      - {text: "`<class 'tuple'>`", correct: true}
      - {text: "`<class 'list'>`", correct: false}
      - {text: "`<class 'int'>`", correct: false}
      - {text: "`<class 'dict'>`", correct: false}
    answer: "Les valeurs séparées par des virgules forment un tuple."
  - key: qcm-pas-assez
    format: multiple-choice
    question: "Quelle erreur donne `x, y, z = (1, 2)` ?"
    choices:
      - {text: "`ValueError: not enough values to unpack (expected 3, got 2)`", correct: true}
      - {text: "`ValueError: too many values to unpack (expected 3, got 2)`", correct: false}
      - {text: "`TypeError: cannot unpack non-iterable tuple object`", correct: false}
      - {text: "`IndexError: tuple index out of range`", correct: false}
    answer: "Trois noms, deux valeurs : pas assez de valeurs. Un tuple est bien itérable, et le déballage ne passe pas par les indices."
  - key: qcm-annoter-retour
    format: multiple-choice
    question: Comment annoter le retour d'une fonction qui renvoie le minimum, le maximum et la moyenne ?
    choices:
      - {text: "`-> tuple[float, float, float]`", correct: true}
      - {text: "`-> float, float, float`", correct: false}
      - {text: "`-> list[float]`", correct: false}
      - {text: "`-> (float, float, float)`", correct: false}
    answer: "`tuple[...]` donne le type de chaque position. Sans `tuple`, c'est une `SyntaxError` ou une annotation que les outils refusent ; `list[float]` ne dit pas combien de valeurs."
  - key: trous-virgule-retour
    format: fill-in
    question: |-
      Complète pour renvoyer le quotient et le reste :
      ```python
      def division(a, b):
          return a // b___ a % b
      ```
    blanks: [[","]]
    answer: "La virgule construit le tuple `(quotient, reste)`."
  - key: trous-ignorer-quotient
    format: fill-in
    question: |-
      Complète pour ignorer le quotient et ne garder que le reste :
      ```python
      ___, reste = divmod(17, 5)
      ```
    blanks: [[_]]
    answer: "`_` signale une valeur qu'on n'utilise pas."
  - key: trous-etoile-reste
    format: fill-in
    question: |-
      Complète pour garder le premier élément à part, et le reste dans une liste :
      ```python
      premier, ___reste = (1, 2, 3, 4)
      ```
    blanks: [["*"]]
    answer: "`*reste` reçoit `[2, 3, 4]`, une liste même si la source est un tuple."
  - key: trous-annotation-tuple
    format: fill-in
    question: |-
      Complète l'annotation du type renvoyé :
      ```python
      def min_max(xs: list[int]) -> ___[int, int]:
          return min(xs), max(xs)
      ```
    blanks: [[tuple]]
    answer: "`tuple[int, int]` : un tuple de deux entiers. Depuis Python 3.9, plus besoin d'importer `Tuple` de `typing`."
  - key: code-deballer-inverse
    format: code-output
    question: |-
      ```python
      def f():
          return 1, 2

      a, b = f()
      print(b, a)
      ```
    check:
      output: "2 1"
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`(1, 2)`", correct: false}
      - {text: "`2`", correct: false}
    answer: "Le tuple `(1, 2)` est déballé dans `a` et `b`, affichés ensuite dans l'ordre inverse."
  - key: code-tuple-affiche
    format: code-output
    question: |-
      ```python
      def f():
          return 1, 2

      print(f())
      ```
    check:
      output: "(1, 2)"
    choices:
      - {text: "`(1, 2)`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`[1, 2]`", correct: false}
      - {text: "`1`", correct: false}
    answer: "Sans déballage, on obtient le tuple lui-même, que `print` affiche entre parenthèses."
  - key: code-virgule-finale
    format: code-output
    question: |-
      ```python
      def f():
          return 10,

      print(f(), len(f()))
      ```
    check:
      output: "(10,) 1"
    choices:
      - {text: "`(10,) 1`", correct: true}
      - {text: "`10 1`", correct: false}
      - {text: "`(10) 1`", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "La virgule finale crée un tuple d'un élément, que Python affiche `(10,)` pour le distinguer de `(10)`, qui vaut 10."
  - key: code-statistiques-reste
    format: code-output
    question: |-
      ```python
      def stats(xs):
          return min(xs), max(xs), sum(xs) / len(xs)

      bas, *reste = stats([2, 4, 6])
      print(bas, reste)
      ```
    check:
      output: "2 [6, 4.0]"
    choices:
      - {text: "`2 [6, 4.0]`", correct: true}
      - {text: "`2 (6, 4.0)`", correct: false}
      - {text: "`2 [6, 4]`", correct: false}
      - {text: "`2 6`", correct: false}
    answer: "`*reste` ramasse toujours une liste. La division `/` donne un flottant : 12 / 3 = 4.0."
