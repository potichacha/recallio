notion: portee-legb
lesson: |-
  Pour trouver la valeur d'un nom, Python cherche dans quatre portées, dans l'ordre **LEGB** :

  | Portée | Contenu |
  |---|---|
  | **L**ocal | les noms affectés dans la fonction en cours, et ses paramètres |
  | **E**nclosing | les noms des fonctions qui l'englobent (fonctions imbriquées) |
  | **G**lobal | les noms du module |
  | **B**uilt-in | les noms intégrés : `len`, `print`, `list`, `ValueError`... |

  **La règle décisive** : un nom **affecté n'importe où** dans une fonction est **local à toute la fonction**. Python le
  décide à la compilation, avant d'exécuter quoi que ce soit.

  ```python
  compteur = 0

  def incrementer():
      compteur += 1     # UnboundLocalError: cannot access local variable 'compteur'
                        # where it is not associated with a value
  ```

  `compteur += 1` affecte `compteur` : il est donc local, et sa lecture échoue, car il n'a pas encore de valeur.

  - **`global nom`** : les affectations visent le nom du module.
  - **`nonlocal nom`** : elles visent le nom de la fonction englobante, qui doit exister (sinon : « no binding for
    nonlocal 'nom' found »).
  - **Lire** un nom global ne demande rien. **Modifier l'objet** (`liste.append(x)`) non plus : seule la
    **réaffectation** du nom en demande.

  **Ce qui crée une portée** : les fonctions (et les `lambda`), les classes, les modules, les compréhensions. **Pas**
  les blocs `if`, `for`, `while`, `with`, `try` : une variable de boucle **survit** à la boucle. La variable d'une
  compréhension, elle, ne fuit pas.

  **Les pièges**

  - Masquer un nom intégré : `list = [1, 2]`, puis `list("abc")` lève « 'list' object is not callable ». Un `del list`
    rend l'accès au nom intégré.
  - Le corps d'une classe n'est **pas** une portée englobante pour ses méthodes : on écrit `self.taux`, pas `taux`.
  - Abuser de `global` : mieux vaut passer la valeur en argument et renvoyer le résultat.

  **En entretien** : « Python cherche un nom en Local, Enclosing, Global, Built-in. Un nom affecté dans une fonction est
  local à toute la fonction, d'où l'`UnboundLocalError` si on le lit avant. `global` et `nonlocal` permettent de
  réaffecter un nom d'une portée extérieure ; les blocs `if` et `for` ne créent pas de portée. »
cards:
  - key: ordre-legb
    format: course
    question: Dans quel ordre Python cherche-t-il un nom (la règle LEGB) ?
    choices:
      - {text: "Local, englobant, global, puis intégré (built-in)", correct: true}
      - {text: "Global, local, englobant, puis intégré (built-in)", correct: false}
      - {text: "Intégré (built-in), global, englobant, puis local", correct: false}
      - {text: "Local, global, englobant, puis intégré (built-in)", correct: false}
    answer: "Du plus proche au plus lointain : la fonction en cours, les fonctions qui l'englobent, le module, puis les noms intégrés."
  - key: pourquoi-unbound
    format: course
    question: Pourquoi `x += 1` dans une fonction lève-t-il une `UnboundLocalError` quand `x` est global ?
    choices:
      - {text: "L'affectation rend `x` local à toute la fonction, avant même sa lecture", correct: true}
      - {text: "Les variables globales sont en lecture seule en Python", correct: false}
      - {text: "L'opérateur `+=` n'est pas défini sur les entiers globaux", correct: false}
      - {text: "La fonction lit `x` avant que le module ne l'ait créé", correct: false}
    answer: "Python décide à la compilation qu'un nom affecté dans la fonction est local. Au moment de lire `x` pour calculer `x + 1`, le local n'a pas de valeur."
  - key: global-ou-nonlocal
    format: course
    question: Quelle différence entre `global` et `nonlocal` ?
    choices:
      - {text: "`global` vise le module ; `nonlocal`, la fonction englobante", correct: true}
      - {text: "`global` vise la fonction englobante ; `nonlocal`, le module", correct: false}
      - {text: "`global` crée une constante ; `nonlocal`, une variable", correct: false}
      - {text: "Aucune : `nonlocal` est l'ancien nom de `global`", correct: false}
    answer: "Les deux permettent de réaffecter un nom extérieur. `nonlocal` (Python 3) sert surtout dans les fermetures : un compteur, un accumulateur."
  - key: blocs-portee
    format: course
    question: Un `if` ou un `for` crée-t-il une nouvelle portée en Python ?
    choices:
      - {text: "Non : seuls les fonctions, classes, modules et compréhensions en créent", correct: true}
      - {text: "Oui : chaque bloc indenté a sa propre portée", correct: false}
      - {text: "Oui, mais seulement la boucle `for`, pour sa variable", correct: false}
      - {text: "Non, sauf si le bloc déclare sa variable avec `let`", correct: false}
    answer: "Une variable affectée dans un `if` ou un `for` reste visible après le bloc. C'est une différence importante avec Java, C ou JavaScript (`let`)."
  - key: vf-append-global
    format: true-false
    question: Une fonction peut ajouter un élément à une liste globale avec `liste.append(x)` sans déclarer `global`.
    truth: true
    answer: "`append` modifie l'objet sans réaffecter le nom : la lecture de `liste` trouve le nom global. Seule une affectation (`liste = ...`) demanderait `global`."
  - key: vf-variable-boucle
    format: true-false
    question: La variable d'une boucle `for` n'existe plus après la boucle.
    truth: false
    answer: "Une boucle ne crée pas de portée : la variable garde sa dernière valeur. Seules les compréhensions isolent la leur."
  - key: vf-nonlocal-existe
    format: true-false
    question: "`nonlocal x` exige que `x` existe déjà dans une fonction englobante."
    truth: true
    answer: "Sinon, c'est une `SyntaxError` : « no binding for nonlocal 'x' found ». `nonlocal` ne crée pas de nom, et ne vise jamais le module."
  - key: vf-classe-englobante
    format: true-false
    question: Les noms définis dans le corps d'une classe sont visibles directement, sans `self.`, dans ses méthodes.
    truth: false
    answer: "Le corps d'une classe n'est pas une portée englobante pour ses méthodes : il faut `self.taux` ou `NomDeClasse.taux`."
  - key: qcm-list-masque
    format: multiple-choice
    question: |-
      Que se passe-t-il après `list = [1, 2]`, puis `list("abc")`, dans le même module ?
    choices:
      - {text: "Une `TypeError` : le nom `list` désigne maintenant la liste", correct: true}
      - {text: "`['a', 'b', 'c']` : Python retrouve toujours le nom intégré", correct: false}
      - {text: "Une `SyntaxError` : `list` est un mot réservé", correct: false}
      - {text: "Une `NameError` : le nom `list` a été effacé", correct: false}
    answer: "Le nom global `list` masque le nom intégré, trouvé plus tard dans l'ordre LEGB. Le message : « 'list' object is not callable »."
  - key: qcm-mot-cle-englobante
    format: multiple-choice
    question: Quel mot-clé permet à une fonction imbriquée de réaffecter une variable de la fonction qui la contient ?
    choices:
      - {text: "`nonlocal`", correct: true}
      - {text: "`global`", correct: false}
      - {text: "`outer`", correct: false}
      - {text: "`extern`", correct: false}
    answer: "`global` viserait le module, pas la fonction englobante. `outer` et `extern` n'existent pas en Python."
  - key: qcm-ou-len
    format: multiple-choice
    question: Dans quelle portée Python trouve-t-il `len`, quand aucune variable ne porte ce nom ?
    choices:
      - {text: "Dans la portée intégrée (built-in), en dernier", correct: true}
      - {text: "Dans la portée locale, où `len` est prédéfini", correct: false}
      - {text: "Dans le module `sys`, importé automatiquement", correct: false}
      - {text: "Dans la portée globale, où Python l'a copié", correct: false}
    answer: "Les noms intégrés vivent dans le module `builtins`, consulté en dernier : c'est pourquoi un nom local ou global peut les masquer."
  - key: qcm-sans-global
    format: multiple-choice
    question: Quelle est la meilleure façon de faire évoluer un compteur sans `global` ?
    choices:
      - {text: "Le passer en argument, et renvoyer la nouvelle valeur", correct: true}
      - {text: "Le déclarer `nonlocal` au niveau du module", correct: false}
      - {text: "L'écrire en majuscules, comme une constante", correct: false}
      - {text: "Le copier dans une variable locale de même nom", correct: false}
    answer: "Une fonction qui reçoit et renvoie ses données se teste et se lit mieux. `nonlocal` est interdit au niveau du module."
  - key: trous-global
    format: fill-in
    question: |-
      Complète pour modifier le compteur du module :
      ```python
      compteur = 0

      def incrementer():
          ___ compteur
          compteur += 1
      ```
    blanks: [[global]]
    answer: "`global compteur` fait viser le nom du module à l'affectation."
  - key: trous-nonlocal
    format: fill-in
    question: |-
      Complète pour modifier la variable de la fonction englobante :
      ```python
      def creer_compteur():
          total = 0
          def ajouter(n):
              ___ total
              total += n
              return total
          return ajouter
      ```
    blanks: [[nonlocal]]
    answer: "`nonlocal total` fait viser à l'affectation la variable de `creer_compteur`, que la fermeture garde en vie."
  - key: trous-sigle
    format: fill-in
    question: "Complète l'ordre de recherche des noms (LEGB) : Local, Enclosing, ___, Built-in."
    blanks: [[Global, global]]
    answer: "La portée globale est celle du module."
  - key: trous-rendre-print
    format: fill-in
    question: |-
      Complète pour retrouver la fonction intégrée `print`, masquée par une variable :
      ```python
      print = "texte"
      ___ print
      print("ok")
      ```
    blanks: [[del]]
    answer: "`del print` supprime le nom global : la recherche LEGB retrouve alors le nom intégré."
  - key: code-local-global
    format: code-output
    question: |-
      ```python
      x = "global"

      def f():
          x = "local"
          return x

      print(f(), x)
      ```
    check:
      output: "local global"
    choices:
      - {text: "`local global`", correct: true}
      - {text: "`local local`", correct: false}
      - {text: "`global global`", correct: false}
      - {text: "`global local`", correct: false}
    answer: "L'affectation dans `f` crée un `x` local, qui masque le global sans le modifier."
  - key: code-unbound
    format: code-output
    question: |-
      ```python
      x = 10

      def f():
          x += 1
          return x

      try:
          print(f())
      except Exception as e:
          print(type(e).__name__)
      ```
    check:
      output: "UnboundLocalError"
    choices:
      - {text: "`UnboundLocalError`", correct: true}
      - {text: "`11`", correct: false}
      - {text: "`NameError`", correct: false}
      - {text: "`10`", correct: false}
    answer: "`x += 1` rend `x` local à `f` ; sa lecture échoue, faute de valeur locale. `UnboundLocalError` hérite de `NameError`, mais c'est son nom qui s'affiche."
  - key: code-nonlocal
    format: code-output
    question: |-
      ```python
      def exterieure():
          n = 0
          def interieure():
              nonlocal n
              n += 1
          interieure()
          interieure()
          return n

      print(exterieure())
      ```
    check:
      output: "2"
    choices:
      - {text: "`2`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Une `UnboundLocalError`", correct: false}
    answer: "`nonlocal` fait modifier le `n` de `exterieure` à chaque appel de `interieure`."
  - key: code-fuite-boucle
    format: code-output
    question: |-
      ```python
      j = "avant"
      carres = [j * j for j in range(4)]
      for i in range(3):
          pass
      print(i, j)
      ```
    check:
      output: "2 avant"
    choices:
      - {text: "`2 avant`", correct: true}
      - {text: "`2 3`", correct: false}
      - {text: "`3 avant`", correct: false}
      - {text: "`3 3`", correct: false}
    answer: "La variable d'une boucle `for` survit, avec sa dernière valeur. Celle d'une compréhension a sa propre portée : `j` global n'est pas touché."
  - key: bug-compteur-global
    format: bug-fix
    question: |-
      Python répond « UnboundLocalError: cannot access local variable 'compteur' where it is not associated with a value ». Quelle correction est la bonne ?
      ```python
      compteur = 0

      def incrementer():
          compteur += 1

      incrementer()
      print(compteur)
      ```
    choices:
      - {text: "Déclarer `global compteur` en tête de la fonction", correct: true}
      - {text: "Déclarer `nonlocal compteur` en tête de la fonction", correct: false}
      - {text: "Écrire `compteur = compteur + 1` à la place de `+=`", correct: false}
      - {text: "Initialiser `compteur = 0` au début de la fonction", correct: false}
    answer: |-
      ```python
      def incrementer():
          global compteur
          compteur += 1
      ```
      Mieux encore : `def incrementer(compteur): return compteur + 1`. `nonlocal` ne vise jamais le module ; réinitialiser dans la fonction remettrait le compteur à 1 à chaque appel.
  - key: bug-list-masquee
    format: bug-fix
    question: |-
      Python répond « TypeError: 'list' object is not callable ». Quelle correction est la bonne ?
      ```python
      list = ["pomme", "kiwi"]
      print(list(range(3)))
      ```
    choices:
      - {text: "Renommer la variable, par exemple en `fruits`", correct: true}
      - {text: "Écrire `list[range(3)]` avec des crochets", correct: false}
      - {text: "Déclarer `global list` avant l'appel", correct: false}
      - {text: "Écrire `list.list(range(3))`", correct: false}
    answer: |-
      ```python
      fruits = ["pomme", "kiwi"]
      print(list(range(3)))
      ```
      La variable masque le nom intégré `list`, trouvé en dernier par la règle LEGB. On évite de nommer ses variables `list`, `dict`, `str`, `id` ou `input`.
  - key: bug-fermeture-nonlocal
    format: bug-fix
    question: |-
      Python répond « UnboundLocalError: cannot access local variable 'total' where it is not associated with a value ». Quelle correction est la bonne ?
      ```python
      def creer_compteur():
          total = 0
          def ajouter():
              total += 1
              return total
          return ajouter

      c = creer_compteur()
      print(c())
      ```
    choices:
      - {text: "Ajouter `nonlocal total` en tête de `ajouter`", correct: true}
      - {text: "Ajouter `global total` en tête de `ajouter`", correct: false}
      - {text: "Ajouter `total = 0` en tête de `ajouter`", correct: false}
      - {text: "Passer `total` en paramètre de `creer_compteur`", correct: false}
    answer: |-
      ```python
      def ajouter():
          nonlocal total
          total += 1
          return total
      ```
      `total` est dans la fonction englobante, pas dans le module : `global total` lèverait une `NameError`. Réinitialiser à 0 renverrait toujours 1.
  - key: bug-attribut-classe
    format: bug-fix
    question: |-
      Python répond « NameError: name 'taux' is not defined. Did you mean: 'self.taux'? ». Quelle correction est la bonne ?
      ```python
      class Compte:
          taux = 0.02

          def interets(self, solde):
              return solde * taux

      print(Compte().interets(100))
      ```
    choices:
      - {text: "Écrire `self.taux` dans la méthode", correct: true}
      - {text: "Déclarer `nonlocal taux` dans la méthode", correct: false}
      - {text: "Déclarer `global taux` dans la classe", correct: false}
      - {text: "Écrire `taux = taux` en tête de la méthode", correct: false}
    answer: |-
      ```python
      def interets(self, solde):
          return solde * self.taux
      ```
      Le corps d'une classe n'est pas une portée englobante pour ses méthodes. On passe par l'instance (`self.taux`) ou par la classe (`Compte.taux`).
