notion: decorateurs
lesson: |-
  Un **décorateur** est une fonction qui reçoit une fonction et en renvoie une autre, en général une **enveloppe** qui
  ajoute un comportement autour de l'appel. La syntaxe `@` l'applique au moment de la définition :

  ```python
  import functools
  import time


  def chronometrer(f):
      @functools.wraps(f)                  # garde le nom, la docstring... de f
      def enveloppe(*args, **kwargs):      # accepte tous les arguments
          debut = time.perf_counter()
          resultat = f(*args, **kwargs)    # appelle la fonction d'origine
          print(f"{f.__name__} : {time.perf_counter() - debut:.3f} s")
          return resultat                  # sans ce return, la fonction décorée renverrait None
      return enveloppe


  @chronometrer                            # équivaut à : calculer = chronometrer(calculer)
  def calculer(n):
      return sum(range(n))
  ```

  Les quatre règles d'une enveloppe :

  1. `*args, **kwargs`, pour transmettre n'importe quels arguments ;
  2. `return f(...)`, pour rendre le résultat ;
  3. `@functools.wraps(f)`, pour que `calculer.__name__`, `__doc__` et `help()` restent ceux de `calculer`
     (`__wrapped__` donne alors l'original) ;
  4. le décorateur **renvoie** l'enveloppe, sans l'appeler.

  **Quand ça s'exécute** : le corps du décorateur s'exécute **une fois**, à la définition de la fonction, donc souvent
  à l'import du module ; l'enveloppe s'exécute à chaque appel.

  **Empiler des décorateurs** :

  ```python
  @a
  @b
  def f(): ...          # f = a(b(f))
  ```

  `b`, le plus proche du `def`, s'applique d'abord ; à l'appel, l'enveloppe de `a`, la plus extérieure, s'exécute en
  premier.

  Des décorateurs que tu croiseras : `@property`, `@staticmethod`, `@classmethod`, `@functools.cache`, `@dataclass`,
  `@pytest.fixture`, les routes des frameworks web (`@app.get("/")`). Usages typiques : journaliser, mesurer, mettre
  en cache, réessayer, vérifier une autorisation, enregistrer une fonction dans un registre.

  **En entretien** : « Un décorateur prend une fonction et renvoie une fonction : `@deco` au-dessus d'un `def`
  équivaut à `f = deco(f)`, exécuté à la définition. L'enveloppe prend `*args, **kwargs`, renvoie le résultat, et porte
  `functools.wraps` pour garder le nom et la docstring. Empilés, les décorateurs s'appliquent de bas en haut. »
cards:
  - key: equivalent-arobase
    format: course
    question: "À quoi équivaut `@deco` placé au-dessus de `def f(): ...` ?"
    choices:
      - {text: "`f = deco(f)`, juste après la définition de `f`", correct: true}
      - {text: "`deco(f())`, à chaque appel de la fonction `f`", correct: false}
      - {text: "`f = deco`, qui remplace la fonction par le décorateur", correct: false}
      - {text: "`deco.f = f`, qui range la fonction dans le décorateur", correct: false}
    answer: |-
      Le nom `f` désigne ensuite ce que le décorateur a renvoyé, en général une enveloppe. La syntaxe `@` n'est qu'un
      raccourci pour cette réaffectation.
  - key: pourquoi-wraps
    format: course
    question: "Pourquoi utiliser `functools.wraps` dans un décorateur ?"
    choices:
      - {text: "Pour que l'enveloppe garde le nom et la docstring de la fonction", correct: true}
      - {text: "Pour que la fonction décorée s'exécute plus vite", correct: false}
      - {text: "Pour que le décorateur puisse accepter des paramètres", correct: false}
      - {text: "Pour que l'enveloppe ne soit appelée qu'une seule fois", correct: false}
    answer: |-
      Sans `wraps`, `f.__name__` vaut `'enveloppe'` et `help(f)` montre l'enveloppe : les journaux, la documentation
      et les outils de test s'y perdent. `wraps` copie `__name__`, `__doc__`, `__module__`... et ajoute `__wrapped__`.
  - key: ordre-d-application
    format: course
    question: "Dans quel ordre s'appliquent deux décorateurs empilés, `@a` au-dessus de `@b` ?"
    choices:
      - {text: "`b` d'abord, puis `a` : `f = a(b(f))`", correct: true}
      - {text: "`a` d'abord, puis `b` : `f = b(a(f))`", correct: false}
      - {text: "Les deux en même temps, sur la même fonction", correct: false}
      - {text: "Seul `a` s'applique : le second est ignoré", correct: false}
    answer: |-
      Le décorateur le plus proche du `def` s'applique en premier ; `a` reçoit donc l'enveloppe de `b`. À l'appel,
      c'est l'enveloppe de `a`, la plus extérieure, qui s'exécute d'abord.
  - key: quand-s-execute-le-decorateur
    format: course
    question: "Quand le code d'un décorateur, hors de son enveloppe, s'exécute-t-il ?"
    choices:
      - {text: "Une fois, quand la fonction décorée est définie", correct: true}
      - {text: "À chaque appel de la fonction décorée", correct: false}
      - {text: "Au premier appel de la fonction décorée seulement", correct: false}
      - {text: "Jamais, tant que l'enveloppe n'est pas appelée", correct: false}
    answer: |-
      `@deco` exécute `deco(f)` à la lecture du `def`, souvent à l'import du module. Seule l'enveloppe s'exécute à
      chaque appel. C'est ce qui permet aux décorateurs d'enregistrer une fonction dès l'import.
  - key: vf-execute-a-la-definition
    format: true-false
    question: "Un décorateur s'exécute au moment où la fonction décorée est définie, souvent à l'import du module."
    truth: true
    answer: "Un `print` dans le corps du décorateur s'affiche donc à l'import, même si la fonction n'est jamais appelée."
  - key: vf-nom-sans-wraps
    format: true-false
    question: "Sans `functools.wraps`, le `__name__` de la fonction décorée est celui de l'enveloppe."
    truth: true
    answer: "La fonction décorée est l'enveloppe : son nom, sa docstring et sa signature sont ceux de l'enveloppe."
  - key: vf-decorateur-classe-obligatoire
    format: true-false
    question: "Un décorateur doit obligatoirement être défini avec une classe."
    truth: false
    answer: "N'importe quel appelable qui reçoit une fonction convient ; le plus souvent, c'est une simple fonction."
  - key: vf-deco-a-chaque-appel
    format: true-false
    question: "Avec `@deco`, la fonction `deco` est appelée à chaque appel de la fonction décorée."
    truth: false
    answer: "`deco` est appelée une seule fois, à la définition. C'est l'enveloppe qu'elle renvoie qui s'exécute à chaque appel."
  - key: qcm-signature-enveloppe
    format: multiple-choice
    question: "Quelle signature d'enveloppe transmet tous les arguments à la fonction décorée ?"
    choices:
      - {text: "`def enveloppe(*args, **kwargs):`", correct: true}
      - {text: "`def enveloppe(args, kwargs):`", correct: false}
      - {text: "`def enveloppe(*args):`", correct: false}
      - {text: "`def enveloppe(**args, *kwargs):`", correct: false}
    answer: |-
      `*args` reçoit les arguments positionnels, `**kwargs` les arguments nommés ; `f(*args, **kwargs)` les retransmet.
      Avec `*args` seul, un appel avec un argument nommé échouerait.
  - key: qcm-wrapped
    format: multiple-choice
    question: "Après `@functools.wraps(f)` sur l'enveloppe, que contient `enveloppe.__wrapped__` ?"
    choices:
      - {text: "La fonction d'origine, non décorée", correct: true}
      - {text: "Le décorateur qui a créé l'enveloppe", correct: false}
      - {text: "Le nombre d'appels de la fonction", correct: false}
      - {text: "La liste des décorateurs appliqués", correct: false}
    answer: |-
      `__wrapped__` permet de retrouver, et de tester, la fonction sans son décorateur. `inspect.signature` le suit pour
      afficher la vraie signature.
  - key: qcm-usage-typique
    format: multiple-choice
    question: "Quel usage est typique d'un décorateur ?"
    choices:
      - {text: "Mesurer la durée de plusieurs fonctions sans toucher à leur code", correct: true}
      - {text: "Déclarer le type de retour d'une fonction pour le vérificateur", correct: false}
      - {text: "Remplacer la boucle principale du programme par un événement", correct: false}
      - {text: "Importer un module seulement quand on en a vraiment besoin", correct: false}
    answer: |-
      Un décorateur ajoute un comportement transversal (mesure, journal, cache, réessai, autorisation) sans modifier
      la fonction. Le type de retour se déclare par une annotation, `-> int`.
  - key: qcm-premiere-enveloppe-executee
    format: multiple-choice
    question: "Avec `@a` au-dessus de `@b`, quelle enveloppe s'exécute en premier quand on appelle la fonction ?"
    choices:
      - {text: "Celle de `a`, la plus extérieure", correct: true}
      - {text: "Celle de `b`, la plus proche du `def`", correct: false}
      - {text: "Les deux à la fois, dans deux threads", correct: false}
      - {text: "Ça dépend de l'ordre d'import de `a` et `b`", correct: false}
    answer: |-
      `f = a(b(f))` : l'appel entre dans l'enveloppe de `a`, qui appelle celle de `b`, qui appelle la fonction. Les
      décorateurs s'appliquent de bas en haut, mais s'exécutent de haut en bas.
  - key: trous-wraps-et-retour
    format: fill-in
    question: |-
      Complète le décorateur :
      ```python
      import functools

      def journaliser(f):
          @functools.___(f)
          def enveloppe(*args, **kwargs):
              print("appel de", f.__name__)
              return f(*args, **kwargs)
          return ___
      ```
    blanks:
      - - wraps
      - - enveloppe
    answer: "`wraps` copie le nom et la docstring de `f` ; le décorateur renvoie l'enveloppe, sans l'appeler."
  - key: trous-args-kwargs
    format: fill-in
    question: |-
      Complète l'enveloppe pour qu'elle accepte tous les arguments :
      ```python
      def enveloppe(___, ___):
          return f(*args, **kwargs)
      ```
    blanks:
      - - "*args"
      - - "**kwargs"
    answer: "`*args` reçoit les arguments positionnels dans un tuple, `**kwargs` les arguments nommés dans un dictionnaire."
  - key: trous-sans-arobase
    format: fill-in
    question: |-
      Complète l'écriture sans `@`, équivalente à `@chronometrer` au-dessus du `def` :
      ```python
      def calculer(n):
          return n * 2

      calculer = ___(calculer)
      ```
    blanks:
      - - chronometrer
    answer: "`@chronometrer` n'est qu'un raccourci : le nom `calculer` désigne ensuite ce que le décorateur renvoie."
  - key: trous-renvoyer-le-resultat
    format: fill-in
    question: |-
      Complète l'enveloppe pour que la fonction décorée renvoie bien son résultat :
      ```python
      def enveloppe(*args, **kwargs):
          resultat = f(*args, **kwargs)
          print("fini")
          ___ resultat
      ```
    blanks:
      - - return
    answer: "Sans `return`, l'enveloppe renvoie `None`, et la fonction décorée aussi."
  - key: code-crier
    format: code-output
    question: |-
      ```python
      def crier(f):
          def enveloppe(*args):
              return f(*args).upper()
          return enveloppe


      @crier
      def saluer(nom):
          return "bonjour " + nom


      print(saluer("ada"))
      ```
    answer: "`BONJOUR ADA` : `saluer` désigne l'enveloppe, qui met en majuscules le résultat de la fonction d'origine."
    check:
      output: "BONJOUR ADA"
    choices:
      - {text: "`BONJOUR ADA`", correct: true}
      - {text: "`bonjour ada`", correct: false}
      - {text: "`BONJOUR ada`", correct: false}
      - {text: "`None`", correct: false}
  - key: code-empilement
    format: code-output
    question: |-
      ```python
      def a(f):
          def enveloppe():
              return "a(" + f() + ")"
          return enveloppe


      def b(f):
          def enveloppe():
              return "b(" + f() + ")"
          return enveloppe


      @a
      @b
      def x():
          return "x"


      print(x())
      ```
    answer: "`a(b(x))` : `x = a(b(x))`, l'enveloppe de `a` entoure celle de `b`, qui entoure la fonction."
    check:
      output: "a(b(x))"
    choices:
      - {text: "`a(b(x))`", correct: true}
      - {text: "`b(a(x))`", correct: false}
      - {text: "`a(x)`", correct: false}
      - {text: "`b(x)`", correct: false}
  - key: code-nom-sans-wraps
    format: code-output
    question: |-
      ```python
      def deco(f):
          def enveloppe(*args, **kwargs):
              return f(*args, **kwargs)
          return enveloppe


      @deco
      def calculer():
          pass


      print(calculer.__name__)
      ```
    answer: "`enveloppe` : sans `functools.wraps`, la fonction décorée porte le nom de l'enveloppe."
    check:
      output: "enveloppe"
    choices:
      - {text: "`enveloppe`", correct: true}
      - {text: "`calculer`", correct: false}
      - {text: "`deco`", correct: false}
      - {text: "`f`", correct: false}
  - key: code-execute-a-l-import
    format: code-output
    question: |-
      ```python
      def enregistrer(f):
          print("enregistre", f.__name__)
          return f


      @enregistrer
      def tache():
          print("tâche")


      print("début")
      tache()
      ```
    answer: "Le décorateur s'exécute à la définition de `tache`, avant « début » ; l'appel affiche ensuite « tâche »."
    check:
      output: |-
        enregistre tache
        début
        tâche
    choices:
      - text: |-
          ```
          enregistre tache
          début
          tâche
          ```
        correct: true
      - text: |-
          ```
          début
          enregistre tache
          tâche
          ```
        correct: false
      - text: |-
          ```
          début
          tâche
          ```
        correct: false
      - text: |-
          ```
          début
          enregistre tache
          tâche
          enregistre tache
          ```
        correct: false
  - key: bug-enveloppe-sans-return
    format: bug-fix
    question: |-
      L'addition renvoie `None` :
      ```python
      def journaliser(f):
          def enveloppe(*args, **kwargs):
              print("appel de", f.__name__)
              f(*args, **kwargs)
          return enveloppe


      @journaliser
      def addition(a, b):
          return a + b


      print(addition(2, 3))
      ```
      Le programme affiche `appel de addition`, puis `None`. Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `return f(*args, **kwargs)` dans l'enveloppe", correct: true}
      - {text: "Écrire `return enveloppe()` à la fin du décorateur", correct: false}
      - {text: "Ajouter `return a + b` à la fin de l'enveloppe", correct: false}
      - {text: "Ajouter `@functools.wraps(f)` sur l'enveloppe", correct: false}
    answer: |-
      ```python
      def enveloppe(*args, **kwargs):
          print("appel de", f.__name__)
          return f(*args, **kwargs)
      ```
      L'enveloppe appelle la fonction mais jette son résultat ; une fonction sans `return` renvoie `None`. `wraps`
      corrige le nom, pas la valeur renvoyée.
  - key: bug-decorateur-qui-appelle
    format: bug-fix
    question: |-
      Ce programme affiche `appel de saluer`, puis s'arrête sur « TypeError: 'str' object is not callable » :
      ```python
      def journaliser(f):
          print("appel de", f.__name__)
          return f()


      @journaliser
      def saluer():
          return "bonjour"


      print(saluer())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Définir une enveloppe qui journalise et appelle `f`, et la renvoyer", correct: true}
      - {text: "Remplacer `return f()` par `return f()()` dans le décorateur", correct: false}
      - {text: "Appeler `saluer` sans parenthèses : `print(saluer)`", correct: false}
      - {text: "Ajouter `@functools.wraps(f)` au-dessus du décorateur", correct: false}
    answer: |-
      ```python
      def journaliser(f):
          def enveloppe(*args, **kwargs):
              print("appel de", f.__name__)
              return f(*args, **kwargs)
          return enveloppe
      ```
      Le décorateur appelle `f` dès la définition, et renvoie son résultat, la chaîne `'bonjour'` : le nom `saluer`
      désigne alors une chaîne, qu'on ne peut pas appeler. Il doit renvoyer une fonction.
  - key: bug-enveloppe-sans-arguments
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: chronometrer.<locals>.enveloppe() takes 0 positional arguments but 1
      was given » :
      ```python
      def chronometrer(f):
          def enveloppe():
              return f()
          return enveloppe


      @chronometrer
      def carre(x):
          return x * x


      print(carre(4))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`def enveloppe(*args, **kwargs): return f(*args, **kwargs)`", correct: true}
      - {text: "`def enveloppe(x): return f()`, qui reçoit l'argument", correct: false}
      - {text: "`def chronometrer(f, x):`, pour recevoir `x` à la décoration", correct: false}
      - {text: "Appeler `carre()` sans argument, comme l'enveloppe l'attend", correct: false}
    answer: |-
      ```python
      def chronometrer(f):
          def enveloppe(*args, **kwargs):
              return f(*args, **kwargs)
          return enveloppe
      ```
      `carre(4)` appelle l'enveloppe, qui doit donc accepter les arguments, puis les transmettre. `*args, **kwargs`
      convient à toutes les fonctions décorées.
  - key: bug-sans-wraps
    format: bug-fix
    question: |-
      La documentation générée ne montre plus le bon nom ni la docstring :
      ```python
      def chronometrer(f):
          def enveloppe(*args, **kwargs):
              return f(*args, **kwargs)
          return enveloppe


      @chronometrer
      def carre(x):
          """Renvoie le carré de x."""
          return x * x


      print(carre.__name__, carre.__doc__)
      ```
      Le programme affiche `enveloppe None`. Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter `@functools.wraps(f)` au-dessus de `def enveloppe`", correct: true}
      - {text: "Écrire la docstring dans `chronometrer` plutôt que dans `carre`", correct: false}
      - {text: "Renommer `enveloppe` en `carre` dans le décorateur", correct: false}
      - {text: "Ajouter `@functools.wraps(f)` au-dessus de `def carre`", correct: false}
    answer: |-
      ```python
      import functools

      def chronometrer(f):
          @functools.wraps(f)
          def enveloppe(*args, **kwargs):
              return f(*args, **kwargs)
          return enveloppe
      ```
      `wraps` copie sur l'enveloppe le nom, la docstring et le module de `f`. Renommer l'enveloppe en `carre` ne
      marcherait que pour cette fonction-là.
