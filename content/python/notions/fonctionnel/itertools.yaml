notion: itertools
lesson: |-
  Le module **`itertools`** fournit des briques pour combiner des itérateurs. Toutes ses fonctions sont
  **paresseuses** : elles renvoient des itérateurs, qui ne calculent rien avant d'être parcourus.

  | Fonction | Produit | Exemple |
  |---|---|---|
  | `chain(a, b, ...)` | les éléments de `a`, puis ceux de `b`... | `chain([1, 2], "ab")` : 1, 2, 'a', 'b' |
  | `chain.from_iterable(xs)` | aplatit un niveau | `chain.from_iterable([[1], [2, 3]])` : 1, 2, 3 |
  | `islice(it, stop)`, `islice(it, start, stop, step)` | une tranche, sans indice négatif | `islice(count(), 3)` : 0, 1, 2 |
  | `groupby(it, key)` | des couples (clé, groupe) d'éléments **consécutifs** de même clé | `groupby("aabc")` : 'a', puis 'b', puis 'c' |
  | `product(a, b)` | le produit cartésien, comme des boucles imbriquées | `product("ab", [1, 2])` : ('a', 1), ('a', 2), ('b', 1), ('b', 2) |
  | `accumulate(it, f)` | les résultats cumulés (la somme par défaut) | `accumulate([1, 2, 3])` : 1, 3, 6 |
  | `count(debut, pas)`, `cycle(it)`, `repeat(x, n)` | des suites infinies, ou répétées | `count(10, 5)` : 10, 15, 20... |
  | `pairwise(it)` | les couples voisins (3.10) | `pairwise([1, 2, 3])` : (1, 2), (2, 3) |
  | `batched(it, n)` | des tuples de `n` éléments (3.12) | `batched("abcde", 2)` : ('a', 'b'), ('c', 'd'), ('e',) |
  | `permutations`, `combinations` | les arrangements, les combinaisons | `combinations("abc", 2)` : ab, ac, bc |
  | `takewhile`, `dropwhile` | prendre, ou sauter, tant qu'un test est vrai | `takewhile(lambda x: x < 3, [1, 2, 5, 1])` : 1, 2 |

  Deux pièges :

  - **`groupby` ne regroupe que des éléments consécutifs** : on trie d'abord par la **même** clé, sinon une clé
    revient en plusieurs groupes.
  - Chaque groupe de `groupby` est un itérateur qui **partage** la source : dès que `groupby` passe au groupe suivant,
    le précédent est perdu. On le consomme tout de suite, par exemple avec `list(groupe)`.

  ```python
  from itertools import groupby

  ventes = sorted(ventes, key=lambda v: v.rayon)
  for rayon, lignes in groupby(ventes, key=lambda v: v.rayon):
      print(rayon, sum(v.montant for v in lignes))
  ```

  `islice` remplace le découpage `[a:b]`, qu'un itérateur ne connaît pas. Il refuse les indices négatifs : un
  itérateur ne connaît pas sa fin.

  **En entretien** : « `itertools` assemble des itérateurs paresseux : `chain` pour enchaîner, `islice` pour découper
  un itérateur, `groupby` pour regrouper des éléments consécutifs (donc triés d'abord), `product` à la place de
  boucles imbriquées, `accumulate` pour des cumuls. Tout reste paresseux, donc utilisable sur des flux énormes ou
  infinis. »
cards:
  - key: chain-ce-qu-il-fait
    format: course
    question: "Que fait `itertools.chain(a, b)` ?"
    choices:
      - {text: "Il parcourt `a`, puis `b`, comme un seul itérable, sans les copier", correct: true}
      - {text: "Il fusionne `a` et `b` en une seule liste triée", correct: false}
      - {text: "Il alterne un élément de `a` et un élément de `b`", correct: false}
      - {text: "Il produit les couples formés d'un élément de chacun", correct: false}
    answer: |-
      `chain` enchaîne les itérables sans construire de liste : `a + b` exigerait deux listes et en créerait une
      troisième. Alterner les éléments, c'est le travail de `zip`.
  - key: groupby-donnees-triees
    format: course
    question: "Pourquoi trie-t-on en général les données avant `itertools.groupby` ?"
    choices:
      - {text: "Il ne regroupe que les éléments consécutifs de même clé", correct: true}
      - {text: "Il trie lui-même, mais plus vite des données déjà triées", correct: false}
      - {text: "Il lève une erreur si les clés ne sont pas dans l'ordre", correct: false}
      - {text: "Il ne fonctionne qu'avec des clés numériques croissantes", correct: false}
    answer: |-
      `groupby` ouvre un nouveau groupe chaque fois que la clé change. Sur `a, b, a`, la clé `a` donne deux groupes. On
      trie donc d'abord avec la même fonction `key`.
  - key: islice-ou-crochets
    format: course
    question: "Pourquoi utiliser `islice` plutôt que `[a:b]` sur un générateur ?"
    choices:
      - {text: "Un générateur ne se découpe pas avec `[a:b]`, et `islice` le fait", correct: true}
      - {text: "`islice` est plus lisible, mais le résultat est celui de `[a:b]`", correct: false}
      - {text: "`[a:b]` copie le générateur, alors que `islice` le modifie", correct: false}
      - {text: "`islice` accepte des indices négatifs, contrairement à `[a:b]`", correct: false}
    answer: |-
      `gen[0:5]` lève une `TypeError` : un générateur ne s'indexe pas. `islice(gen, 5)` lit seulement les cinq premiers
      éléments. Il refuse en revanche les indices négatifs.
  - key: accumulate-produit
    format: course
    question: "Que produit `itertools.accumulate([1, 2, 3, 4])` ?"
    choices:
      - {text: "Les sommes cumulées : 1, 3, 6, 10", correct: true}
      - {text: "La somme totale, une seule valeur : 10", correct: false}
      - {text: "Les produits cumulés : 1, 2, 6, 24", correct: false}
      - {text: "Les écarts successifs : 1, 1, 1", correct: false}
    answer: |-
      Par défaut, `accumulate` additionne ; une fonction en second argument change l'opération :
      `accumulate(xs, operator.mul)` donne les produits cumulés, `accumulate(xs, max)` les maximums courants.
  - key: vf-product-repeat
    format: true-false
    question: "`itertools.product(\"ab\", repeat=2)` produit 4 tuples."
    truth: true
    answer: "('a', 'a'), ('a', 'b'), ('b', 'a'), ('b', 'b') : deux choix pour chacune des deux positions."
  - key: vf-count-infini
    format: true-false
    question: "`itertools.count()` s'arrête de lui-même une fois `sys.maxsize` atteint."
    truth: false
    answer: |-
      `count` est infini : les entiers de Python n'ont pas de limite. On le borne avec `islice`, `zip` ou un `break`.
  - key: vf-renvoient-des-listes
    format: true-false
    question: "Les fonctions d'`itertools` renvoient des listes."
    truth: false
    answer: "Elles renvoient des itérateurs paresseux, à usage unique : `list(...)` les matérialise si besoin."
  - key: vf-pairwise
    format: true-false
    question: "`itertools.pairwise([1, 2, 3])` produit `(1, 2)`, puis `(2, 3)`."
    truth: true
    answer: "`pairwise` (Python 3.10) donne chaque couple d'éléments voisins, pratique pour calculer des écarts."
  - key: qcm-dix-premiers
    format: multiple-choice
    question: "Quelle fonction donne les 10 premiers éléments d'un itérateur infini `it` ?"
    choices:
      - {text: "`islice(it, 10)`", correct: true}
      - {text: "`chain(it, 10)`", correct: false}
      - {text: "`takewhile(10, it)`", correct: false}
      - {text: "`accumulate(it, 10)`", correct: false}
    answer: |-
      `islice(it, stop)` s'arrête après `stop` éléments. `takewhile` attend une fonction de test, pas un nombre.
  - key: qcm-aplatir
    format: multiple-choice
    question: "Comment aplatir la liste de listes `lignes` en un seul itérable ?"
    choices:
      - {text: "`chain.from_iterable(lignes)`", correct: true}
      - {text: "`chain(lignes)`", correct: false}
      - {text: "`product(lignes)`", correct: false}
      - {text: "`groupby(lignes)`", correct: false}
    answer: |-
      `chain.from_iterable` enchaîne les éléments de chaque sous-liste. `chain(lignes)` reçoit un seul itérable, et
      produit donc les sous-listes elles-mêmes ; `chain(*lignes)` marcherait aussi.
  - key: qcm-tailles-couleurs
    format: multiple-choice
    question: "Quelle fonction énumère toutes les combinaisons d'une taille de `tailles` et d'une couleur de `couleurs` ?"
    choices:
      - {text: "`product(tailles, couleurs)`", correct: true}
      - {text: "`zip(tailles, couleurs)`", correct: false}
      - {text: "`chain(tailles, couleurs)`", correct: false}
      - {text: "`pairwise(tailles + couleurs)`", correct: false}
    answer: |-
      `product` remplace deux boucles imbriquées. `zip` associe les éléments de même rang seulement, et `chain` les
      met bout à bout.
  - key: qcm-element-de-groupby
    format: multiple-choice
    question: "Que produit `groupby(donnees, key=f)` à chaque tour ?"
    choices:
      - {text: "Un couple : la clé, puis un itérateur sur les éléments du groupe", correct: true}
      - {text: "La liste des éléments du groupe, sans la clé", correct: false}
      - {text: "Un dictionnaire qui associe chaque clé à ses éléments", correct: false}
      - {text: "Un couple : la clé, puis le nombre d'éléments du groupe", correct: false}
    answer: |-
      D'où la boucle `for cle, groupe in groupby(...)`. Le groupe est un itérateur, à consommer avant de passer au
      suivant.
  - key: trous-chain-fichiers
    format: fill-in
    question: |-
      Complète pour parcourir les lignes de deux fichiers à la suite :
      ```python
      from itertools import chain

      for ligne in ___(fichier_a, fichier_b):
          traiter(ligne)
      ```
    blanks:
      - - chain
    answer: "`chain` lit `fichier_a` jusqu'au bout, puis `fichier_b`, sans charger les lignes en mémoire."
  - key: trous-islice-cinq
    format: fill-in
    question: |-
      Complète pour lire les cinq premières valeurs du générateur infini `mesures()` :
      ```python
      from itertools import islice

      premieres = list(islice(mesures(), ___))
      ```
    blanks:
      - - "5"
    answer: "Avec un seul nombre, `islice` le prend comme borne de fin : les éléments d'indice 0 à 4."
  - key: trous-groupby-initiale
    format: fill-in
    question: |-
      Complète pour grouper des mots par leur initiale :
      ```python
      from itertools import groupby

      mots = sorted(mots, key=lambda m: m[0])
      for initiale, groupe in ___(mots, key=lambda m: m[0]):
          print(initiale, list(groupe))
      ```
    blanks:
      - - groupby
    answer: "Les mots sont d'abord triés par la même clé : `groupby` ne regroupe que des éléments consécutifs."
  - key: trous-soldes-cumules
    format: fill-in
    question: |-
      Complète pour obtenir le solde du compte après chaque opération :
      ```python
      from itertools import accumulate

      soldes = list(___(operations))
      ```
    blanks:
      - - accumulate
    answer: "`accumulate` produit les sommes successives : le solde après la première opération, puis la deuxième..."
  - key: code-chain
    format: code-output
    question: |-
      ```python
      from itertools import chain

      print(list(chain([1, 2], (3,), "ab")))
      ```
    answer: "`[1, 2, 3, 'a', 'b']` : `chain` parcourt chaque itérable à son tour ; une chaîne donne ses caractères."
    check:
      output: "[1, 2, 3, 'a', 'b']"
    choices:
      - {text: "`[1, 2, 3, 'a', 'b']`", correct: true}
      - {text: "`[1, 2, (3,), 'ab']`", correct: false}
      - {text: "`[[1, 2], (3,), 'ab']`", correct: false}
      - {text: "`[1, 2, 3, 'ab']`", correct: false}
  - key: code-groupby-consecutifs
    format: code-output
    question: |-
      ```python
      from itertools import groupby

      print([(k, len(list(g))) for k, g in groupby("aabccca")])
      ```
    answer: |-
      `groupby` ouvre un groupe à chaque changement de lettre : le dernier `a`, séparé des premiers, forme son propre
      groupe.
    check:
      output: "[('a', 2), ('b', 1), ('c', 3), ('a', 1)]"
    choices:
      - {text: "`[('a', 2), ('b', 1), ('c', 3), ('a', 1)]`", correct: true}
      - {text: "`[('a', 3), ('b', 1), ('c', 3)]`", correct: false}
      - {text: "`[('a', 2), ('b', 1), ('c', 3)]`", correct: false}
      - {text: "`[('a', 1), ('b', 1), ('c', 1), ('a', 1)]`", correct: false}
  - key: code-product-boucles
    format: code-output
    question: |-
      ```python
      from itertools import product

      for taille, couleur in product("SM", ["rouge", "bleu"]):
          print(taille, couleur)
      ```
    answer: |-
      `product` fait varier le dernier itérable le plus vite, comme deux boucles imbriquées : pour chaque taille, chaque
      couleur.
    check:
      output: |-
        S rouge
        S bleu
        M rouge
        M bleu
    choices:
      - text: |-
          ```
          S rouge
          S bleu
          M rouge
          M bleu
          ```
        correct: true
      - text: |-
          ```
          S rouge
          M rouge
          S bleu
          M bleu
          ```
        correct: false
      - text: |-
          ```
          S rouge
          M bleu
          ```
        correct: false
      - text: |-
          ```
          SM rouge
          SM bleu
          ```
        correct: false
  - key: code-islice-count
    format: code-output
    question: |-
      ```python
      from itertools import count, islice

      print(list(islice(count(10, 5), 2, 5)))
      ```
    answer: "`[20, 25, 30]` : `count(10, 5)` produit 10, 15, 20, 25, 30... et `islice` garde les indices 2 à 4."
    check:
      output: "[20, 25, 30]"
    choices:
      - {text: "`[20, 25, 30]`", correct: true}
      - {text: "`[15, 20, 25]`", correct: false}
      - {text: "`[20, 25, 30, 35]`", correct: false}
      - {text: "`[10, 15, 20, 25, 30]`", correct: false}
  - key: bug-groupby-non-trie
    format: bug-fix
    question: |-
      Le rayon « fruits » apparaît deux fois :
      ```python
      from itertools import groupby

      ventes = [("fruits", 3), ("legumes", 2), ("fruits", 5)]
      for rayon, lignes in groupby(ventes, key=lambda v: v[0]):
          print(rayon, sum(q for _, q in lignes))
      ```
      Le programme affiche `fruits 3`, `legumes 2`, puis `fruits 5`. Quelle correction est la bonne ?
    choices:
      - {text: "Trier d'abord : `ventes.sort(key=lambda v: v[0])`", correct: true}
      - {text: "Passer `key=lambda v: v[1]` à `groupby`", correct: false}
      - {text: "Remplacer `groupby` par `itertools.chain`", correct: false}
      - {text: "Mettre `list(lignes)` à la place de `lignes` dans `sum`", correct: false}
    answer: |-
      ```python
      ventes.sort(key=lambda v: v[0])
      for rayon, lignes in groupby(ventes, key=lambda v: v[0]):
          print(rayon, sum(q for _, q in lignes))
      ```
      `groupby` ne regroupe que des éléments consécutifs. Trier par la même clé rend chaque rayon contigu. Sans tri, un
      `defaultdict(int)` ferait aussi l'affaire.
  - key: bug-islice-negatif
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une `ValueError` : « Indices for islice() must be None or an integer: 0 <= x <=
      sys.maxsize. »
      ```python
      from itertools import islice

      lignes = (l for l in ["a", "b", "c", "d"])
      print(list(islice(lignes, -2, None)))
      ```
      Il doit afficher les deux dernières lignes. Quelle correction est la bonne ?
    choices:
      - {text: "`list(collections.deque(lignes, maxlen=2))`", correct: true}
      - {text: "`list(islice(lignes, None, -2))`", correct: false}
      - {text: "`list(islice(reversed(lignes), 2))`", correct: false}
      - {text: "`list(islice(lignes, 2, None))[-2:]`", correct: false}
    answer: |-
      ```python
      from collections import deque

      print(list(deque(lignes, maxlen=2)))
      ```
      Un itérateur ne connaît pas sa fin : `islice` refuse les indices négatifs. Une `deque` bornée parcourt tout, et ne
      garde que les deux derniers éléments. Un générateur n'est pas réversible non plus.
  - key: bug-count-decoupe
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: 'itertools.count' object is not subscriptable » :
      ```python
      from itertools import count

      premiers = count(1)[:3]
      print(list(premiers))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`premiers = islice(count(1), 3)`", correct: true}
      - {text: "`premiers = list(count(1))[:3]`", correct: false}
      - {text: "`premiers = count(1, 3)`", correct: false}
      - {text: "`premiers = count(1)[0:3:1]`", correct: false}
    answer: |-
      ```python
      from itertools import count, islice

      premiers = islice(count(1), 3)
      print(list(premiers))      # [1, 2, 3]
      ```
      Un itérateur ne se découpe pas avec des crochets. `list(count(1))` ne finirait jamais, et `count(1, 3)` change le
      pas : 1, 4, 7...
  - key: bug-groupes-perdus
    format: bug-fix
    question: |-
      Les groupes sont vides :
      ```python
      from itertools import groupby

      groupes = dict(groupby("aaabb"))
      print({k: list(v) for k, v in groupes.items()})
      ```
      Le programme affiche `{'a': [], 'b': []}`. Pourquoi ?
    choices:
      - {text: "Chaque groupe se vide dès que `groupby` passe au suivant", correct: true}
      - {text: "`dict` ne garde que les clés, et jette toujours les valeurs", correct: false}
      - {text: "`groupby` ne regroupe que des données qu'on a triées", correct: false}
      - {text: "Une chaîne ne peut pas être regroupée par `groupby`", correct: false}
    answer: |-
      ```python
      groupes = {k: list(v) for k, v in groupby("aaabb")}
      ```
      Les groupes partagent l'itérateur source : en construisant le dictionnaire, `groupby` a avancé jusqu'au bout, et
      chaque groupe a été vidé au passage. On consomme chaque groupe pendant le parcours.
