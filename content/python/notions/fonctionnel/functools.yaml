notion: functools
lesson: |-
  Le module **`functools`** rassemble des outils pour les fonctions d'ordre supérieur.

  **`partial`** fige une partie des arguments d'une fonction, et renvoie un nouvel appelable :

  ```python
  from functools import partial

  binaire = partial(int, base=2)
  binaire("1010")                  # 10
  afficher_erreur = partial(print, "ERREUR :")
  afficher_erreur("disque plein")  # ERREUR : disque plein
  ```

  Les arguments positionnels figés se placent **en tête** : `partial(diviser, 2)` fixe le premier, `a`. Pour fixer
  `b`, on le nomme : `partial(diviser, b=2)`. Python 3.14 ajoute `functools.Placeholder`, pour réserver une place.

  **`cache` et `lru_cache`** mémorisent les résultats d'une fonction, par jeu d'arguments :

  ```python
  from functools import cache, lru_cache

  @cache                           # sans limite (Python 3.9)
  def fib(n):
      return n if n < 2 else fib(n - 1) + fib(n - 2)

  @lru_cache(maxsize=256)          # garde les 256 derniers ; oublie les moins récemment utilisés
  def distance(a, b): ...

  fib.cache_info()                 # CacheInfo(hits=..., misses=..., maxsize=None, currsize=...)
  fib.cache_clear()
  ```

  - Les arguments servent de clé de dictionnaire : ils doivent être **hachables** (pas de liste, pas de dict).
  - Seulement pour des fonctions **pures** : même entrée, même sortie, sans effet de bord. Une fonction qui lit
    l'heure, une base de données ou un compteur rendrait un résultat périmé.
  - Sur une méthode, le cache garde aussi `self` en vie ; `functools.cached_property` calcule plutôt un attribut une
    fois par instance.

  **`reduce`** replie un itérable en une valeur : `reduce(f, [a, b, c])` calcule `f(f(a, b), c)`. Sans valeur
  initiale, un itérable vide lève une `TypeError` : on écrit `reduce(f, xs, initial)`. Ce n'est plus une fonction
  intégrée depuis Python 3 ; `sum`, `max`, `math.prod` ou une boucle sont souvent plus lisibles.

  **`singledispatch`** choisit une implémentation selon le **type du premier argument** :

  ```python
  from functools import singledispatch

  @singledispatch
  def decrire(x):
      return "objet"

  @decrire.register
  def _(x: int):
      return "entier"

  @decrire.register
  def _(x: list):
      return f"liste de {len(x)}"
  ```

  Et encore : `wraps`, pour écrire des décorateurs ; `total_ordering`, pour compléter les comparaisons d'une classe.

  **En entretien** : « `partial` fige des arguments, `cache` et `lru_cache` mémorisent les résultats d'une fonction
  pure aux arguments hachables, `reduce` replie un itérable, `singledispatch` choisit une implémentation selon le
  type du premier argument. `lru_cache` borne la mémoire en oubliant les résultats les moins récemment utilisés. »
cards:
  - key: partial-int-base
    format: course
    question: "Que renvoie `functools.partial(int, base=2)` ?"
    choices:
      - {text: "Une fonction qui appelle `int` avec `base=2` déjà fixé", correct: true}
      - {text: "Le résultat de `int(2)`, gardé en cache pour la suite", correct: false}
      - {text: "Une sous-classe de `int` qui stocke ses valeurs en base 2", correct: false}
      - {text: "La moitié de l'entier qu'on lui passe ensuite", correct: false}
    answer: "`binaire = partial(int, base=2)`, puis `binaire(\"101\")` vaut 5 : l'appel ajoute ses arguments à ceux figés."
  - key: cache-ou-lru-cache
    format: course
    question: "Quelle différence entre `functools.cache` et `functools.lru_cache(maxsize=128)` ?"
    choices:
      - {text: "`cache` garde tout ; `lru_cache` oublie les moins récents au-delà de 128", correct: true}
      - {text: "`cache` garde 128 résultats au plus ; `lru_cache` garde absolument tout", correct: false}
      - {text: "`cache` garde ses résultats sur le disque ; `lru_cache` en mémoire", correct: false}
      - {text: "`cache` est réservé aux méthodes ; `lru_cache` aux fonctions", correct: false}
    answer: |-
      `cache` (Python 3.9) équivaut à `lru_cache(maxsize=None)` : il ne libère jamais rien. `lru_cache` borne la
      mémoire en oubliant les résultats les moins récemment utilisés (« Least Recently Used »).
  - key: cache-arguments-hachables
    format: course
    question: "Pourquoi une fonction décorée par `@cache` refuse-t-elle une liste en argument ?"
    choices:
      - {text: "Les arguments servent de clé de dictionnaire : ils doivent être hachables", correct: true}
      - {text: "Une liste prend trop de mémoire pour être gardée dans un cache", correct: false}
      - {text: "`@cache` n'accepte que des nombres et des chaînes de caractères", correct: false}
      - {text: "Une liste pourrait contenir des fonctions, interdites dans un cache", correct: false}
    answer: |-
      L'appel lève « TypeError: unhashable type: 'list' ». Une liste est mutable, donc non hachable : elle ne peut pas
      servir de clé. On passe un tuple, ou un `frozenset`.
  - key: ce-que-calcule-reduce
    format: course
    question: "Que calcule `functools.reduce(f, [a, b, c])` ?"
    choices:
      - {text: "`f(f(a, b), c)`", correct: true}
      - {text: "`[f(a), f(b), f(c)]`", correct: false}
      - {text: "`f(a) + f(b) + f(c)`", correct: false}
      - {text: "`f(a, f(b, c))`", correct: false}
    answer: |-
      `reduce` combine les éléments de gauche à droite, en accumulant : d'abord `a` et `b`, puis le résultat et `c`.
      Avec une valeur initiale, `reduce(f, xs, i)` commence par `f(i, a)`.
  - key: vf-reduce-integree
    format: true-false
    question: "En Python 3, `reduce` est une fonction intégrée, utilisable sans import."
    truth: false
    answer: |-
      Elle a été déplacée dans `functools` en Python 3 : `from functools import reduce`. Guido van Rossum jugeait une
      boucle souvent plus lisible.
  - key: vf-singledispatch-premier-argument
    format: true-false
    question: "`functools.singledispatch` choisit l'implémentation selon le type du premier argument."
    truth: true
    answer: "Les implémentations s'enregistrent avec `@f.register`, d'après l'annotation de type ou `register(int)`."
  - key: vf-cache-fibonacci
    format: true-false
    question: "Avec `@functools.cache`, le calcul récursif naïf de Fibonacci devient linéaire."
    truth: true
    answer: |-
      Chaque `fib(k)` n'est calculé qu'une fois : les appels récursifs suivants trouvent le résultat en cache. Sans
      cache, le nombre d'appels croît de façon exponentielle.
  - key: vf-partial-premier-seulement
    format: true-false
    question: "`functools.partial` ne permet de fixer que le premier argument d'une fonction."
    truth: false
    answer: "On fixe autant d'arguments positionnels qu'on veut, en tête, et n'importe quel argument nommé."
  - key: qcm-vider-le-cache
    format: multiple-choice
    question: "Comment vider le cache de la fonction `f`, décorée par `@lru_cache` ?"
    choices:
      - {text: "`f.cache_clear()`", correct: true}
      - {text: "`del f.cache`", correct: false}
      - {text: "`f.cache_info().clear()`", correct: false}
      - {text: "`lru_cache.clear(f)`", correct: false}
    answer: "Le décorateur ajoute `cache_clear()` et `cache_info()` à la fonction ; `cache_info()` renvoie un tuple nommé."
  - key: qcm-reduce-vide-avec-initial
    format: multiple-choice
    question: "Que renvoie `reduce(lambda a, b: a + b, [], 0)` ?"
    choices:
      - {text: "`0`", correct: true}
      - {text: "`None`", correct: false}
      - {text: "Une `TypeError`", correct: false}
      - {text: "`[]`", correct: false}
    answer: "Sur un itérable vide, `reduce` renvoie la valeur initiale ; sans elle, il lèverait une `TypeError`."
  - key: qcm-selon-le-type
    format: multiple-choice
    question: "Quel outil choisir pour que la fonction `afficher` se comporte différemment pour un `int` et pour une `str` ?"
    choices:
      - {text: "`functools.singledispatch`", correct: true}
      - {text: "`functools.partial`", correct: false}
      - {text: "`functools.reduce`", correct: false}
      - {text: "`functools.wraps`", correct: false}
    answer: "`singledispatch` remplace une chaîne de `isinstance` par une implémentation enregistrée par type."
  - key: qcm-ne-pas-mettre-en-cache
    format: multiple-choice
    question: "Laquelle de ces fonctions ne doit pas être décorée par `@cache` ?"
    choices:
      - {text: "Une fonction qui renvoie l'heure courante", correct: true}
      - {text: "Une fonction qui calcule un nombre de Fibonacci", correct: false}
      - {text: "Une fonction qui calcule une factorielle", correct: false}
      - {text: "Une fonction qui convertit des degrés en radians", correct: false}
    answer: |-
      Le cache suppose une fonction pure : mêmes arguments, même résultat. L'heure change à chaque appel ; avec un
      cache, elle resterait figée à la première valeur.
  - key: trous-partial-binaire
    format: fill-in
    question: |-
      Complète pour créer une fonction qui convertit une chaîne binaire en entier :
      ```python
      from functools import partial

      binaire = ___(int, base=2)
      ```
    blanks:
      - - partial
    answer: "`binaire(\"1010\")` appelle `int(\"1010\", base=2)` et vaut 10."
  - key: trous-maxsize
    format: fill-in
    question: |-
      Complète pour garder en mémoire les 256 derniers résultats seulement :
      ```python
      from functools import lru_cache

      @lru_cache(maxsize=___)
      def distance(a, b):
          ...
      ```
    blanks:
      - - "256"
    answer: "Au-delà de 256 résultats, `lru_cache` oublie ceux qui ont servi le moins récemment."
  - key: trous-reduce-produit
    format: fill-in
    question: |-
      Complète pour calculer le produit des nombres :
      ```python
      from functools import reduce

      produit = ___(lambda a, b: a * b, nombres, 1)
      ```
    blanks:
      - - reduce
    answer: "La valeur initiale 1 rend le calcul juste pour une liste vide ; `math.prod(nombres)` fait la même chose."
  - key: trous-register
    format: fill-in
    question: |-
      Complète pour ajouter une implémentation de `afficher` pour les listes :
      ```python
      from functools import singledispatch

      @singledispatch
      def afficher(x):
          print("valeur", x)

      @afficher.___
      def _(x: list):
          print("liste de", len(x))
      ```
    blanks:
      - - register
    answer: "`register` lit l'annotation du premier paramètre pour savoir à quel type l'implémentation s'applique."
  - key: code-partial-exposant
    format: code-output
    question: |-
      ```python
      from functools import partial


      def puissance(base, exposant):
          return base ** exposant


      carre = partial(puissance, exposant=2)
      print(carre(5), carre(3))
      ```
    answer: "`25 9` : `carre(5)` appelle `puissance(5, exposant=2)`."
    check:
      output: "25 9"
    choices:
      - {text: "`25 9`", correct: true}
      - {text: "`32 8`", correct: false}
      - {text: "`10 6`", correct: false}
      - {text: "`7 5`", correct: false}
  - key: code-reduce-chiffres
    format: code-output
    question: |-
      ```python
      from functools import reduce

      print(reduce(lambda a, b: a * 10 + b, [1, 2, 3]))
      ```
    answer: "`123` : d'abord 1 * 10 + 2 = 12, puis 12 * 10 + 3 = 123."
    check:
      output: "123"
    choices:
      - {text: "`123`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`321`", correct: false}
      - {text: "`[10, 20, 30]`", correct: false}
  - key: code-cache-info
    format: code-output
    question: |-
      ```python
      from functools import cache

      appels = 0


      @cache
      def carre(x):
          global appels
          appels += 1
          return x * x


      carre(3)
      carre(3)
      carre(4)
      print(appels, carre.cache_info().hits)
      ```
    answer: "`2 1` : la fonction n'est exécutée que pour 3 et pour 4 ; le second `carre(3)` est un succès du cache."
    check:
      output: "2 1"
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`3 0`", correct: false}
      - {text: "`3 1`", correct: false}
      - {text: "`1 2`", correct: false}
  - key: code-singledispatch-bool
    format: code-output
    question: |-
      ```python
      from functools import singledispatch


      @singledispatch
      def decrire(x):
          return "objet"


      @decrire.register
      def _(x: int):
          return "entier"


      @decrire.register
      def _(x: str):
          return "chaîne"


      print(decrire(3), decrire("a"), decrire(2.5), decrire(True))
      ```
    answer: |-
      `entier chaîne objet entier` : un `float` n'a pas d'implémentation et tombe sur la fonction par défaut. `bool`
      hérite de `int` : `True` prend l'implémentation des entiers.
    check:
      output: "entier chaîne objet entier"
    choices:
      - {text: "`entier chaîne objet entier`", correct: true}
      - {text: "`entier chaîne objet objet`", correct: false}
      - {text: "`entier chaîne entier entier`", correct: false}
      - {text: "`objet objet objet objet`", correct: false}
  - key: bug-cache-liste
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: unhashable type: 'list' » :
      ```python
      from functools import cache


      @cache
      def total(prix):
          return sum(prix)


      print(total([10, 20]))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Passer un tuple, hachable : `total((10, 20))`", correct: true}
      - {text: "Remplacer `@cache` par `@lru_cache(maxsize=128)`", correct: false}
      - {text: "Passer une copie de la liste : `total([10, 20][:])`", correct: false}
      - {text: "Écrire `return sum(list(prix))` dans la fonction", correct: false}
    answer: |-
      ```python
      print(total((10, 20)))
      ```
      Le cache range les arguments comme clé de dictionnaire : une liste, mutable, n'est pas hachable. `lru_cache` a la
      même exigence, et une copie reste une liste.
  - key: bug-reduce-vide
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: reduce() of empty iterable with no initial value » :
      ```python
      from functools import reduce

      paniers = []
      total = reduce(lambda a, b: a + b, paniers)
      print(total)
      ```
      Il doit afficher `0` quand il n'y a aucun panier. Quelle correction est la bonne ?
    choices:
      - {text: "Donner une valeur initiale : `reduce(lambda a, b: a + b, paniers, 0)`", correct: true}
      - {text: "Ajouter `default=0` : `reduce(lambda a, b: a + b, paniers, default=0)`", correct: false}
      - {text: "Écrire `reduce(lambda a, b: a + b or 0, paniers)`", correct: false}
      - {text: "Écrire `reduce(lambda a=0, b=0: a + b, paniers)`", correct: false}
    answer: |-
      ```python
      total = reduce(lambda a, b: a + b, paniers, 0)     # ou simplement : sum(paniers)
      ```
      Sans élément ni valeur initiale, `reduce` n'a rien à renvoyer. Il n'a pas de paramètre `default`, et les valeurs
      par défaut de la lambda ne servent à rien : elle n'est jamais appelée.
  - key: bug-cache-effet-de-bord
    format: bug-fix
    question: |-
      Deux clients reçoivent le même numéro de ticket :
      ```python
      import itertools
      from functools import cache

      compteur = itertools.count(1)


      @cache
      def nouveau_ticket():
          return next(compteur)


      print(nouveau_ticket(), nouveau_ticket())
      ```
      Le programme affiche `1 1`. Quelle correction est la bonne ?
    choices:
      - {text: "Retirer `@cache` : la fonction n'est pas pure", correct: true}
      - {text: "Remplacer `@cache` par `@lru_cache(maxsize=1)`", correct: false}
      - {text: "Appeler `nouveau_ticket.cache_info()` entre deux appels", correct: false}
      - {text: "Créer `compteur` à l'intérieur de la fonction", correct: false}
    answer: |-
      ```python
      def nouveau_ticket():
          return next(compteur)
      ```
      Le cache renvoie le premier résultat pour les mêmes arguments, ici aucun : la fonction n'est exécutée qu'une
      fois. Un cache ne convient qu'à une fonction pure. Un compteur créé dans la fonction repartirait de 1 à chaque
      appel.
  - key: bug-partial-mauvais-argument
    format: bug-fix
    question: |-
      La moitié de 10 vaut 0.2 :
      ```python
      from functools import partial


      def diviser(a, b):
          return a / b


      moitie = partial(diviser, 2)
      print(moitie(10))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Fixer le diviseur par son nom : `partial(diviser, b=2)`", correct: true}
      - {text: "Fixer la valeur à la fin : `partial(diviser, 10, 2)`", correct: false}
      - {text: "Écrire `partial(2, diviser)`, dans l'autre ordre", correct: false}
      - {text: "Appeler `moitie(b=10)` au lieu de `moitie(10)`", correct: false}
    answer: |-
      ```python
      moitie = partial(diviser, b=2)
      print(moitie(10))      # 5.0
      ```
      Les arguments positionnels de `partial` se placent en tête : `partial(diviser, 2)` fixe `a = 2`, et `moitie(10)`
      calcule 2 / 10. Nommer `b` fixe le bon paramètre.
