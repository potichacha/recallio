notion: fonctions-objets
lesson: |-
  En Python, une fonction est un **objet** comme un autre, de type `function`. On peut l'affecter, la passer, la
  renvoyer et la ranger :

  ```python
  def crier(texte):
      return texte.upper() + " !"


  parler = crier                  # un autre nom pour la même fonction, sans parenthèses : pas d'appel
  parler("salut")                 # 'SALUT !'

  sorted(mots, key=str.lower)     # passée en argument
  actions = {"crier": crier, "chuchoter": str.lower}   # rangée dans un dictionnaire
  actions["crier"]("ok")          # 'OK !'


  def fabrique_multiplicateur(n):
      def multiplier(x):
          return x * n
      return multiplier           # renvoyée par une autre fonction


  triple = fabrique_multiplicateur(3)
  triple(5)                       # 15
  ```

  - `f` désigne la fonction, `f()` l'appelle. Oublier les parenthèses passe la fonction au lieu de son résultat ; en
    mettre de trop (`key=len()`) l'appelle trop tôt.
  - Une fonction qui reçoit ou renvoie une fonction est une **fonction d'ordre supérieur** : `sorted`, `map`,
    `filter`, `max`, les décorateurs.
  - Une **table de dispatch**, un dictionnaire de fonctions, remplace une longue chaîne de `if` et `elif` qui choisit
    une action selon une clé.
  - Une fonction a des attributs : `__name__`, `__doc__`, `__defaults__`, `__module__`... et on peut lui en ajouter
    (`f.appels = 0`).
  - `callable(x)` dit si un objet s'appelle : fonctions, `lambda`, classes, méthodes, objets qui définissent
    `__call__`.
  - `obj.methode`, sans parenthèses, est une **méthode liée** : un objet qui retient `obj`, et qu'on passe comme une
    fonction (`rappels.append(compteur.incrementer)`).

  **En entretien** : « Les fonctions sont des objets de première classe : on les affecte, on les passe en argument, on
  les renvoie, on les range dans un dictionnaire. C'est ce qui permet `key=` dans `sorted`, les tables de dispatch, les
  fermetures et les décorateurs. `f` est la fonction, `f()` son résultat. »
cards:
  - key: key-len
    format: course
    question: "Que reçoit `sorted` dans `sorted(noms, key=len)` ?"
    choices:
      - {text: "La fonction `len` elle-même, qu'il appelle sur chaque nom", correct: true}
      - {text: "Le résultat de `len`, calculé une seule fois avant le tri", correct: false}
      - {text: "Le nom de la fonction, sous forme de chaîne de caractères", correct: false}
      - {text: "Une copie de `len`, modifiée pour comparer des chaînes", correct: false}
    answer: |-
      `len` sans parenthèses est l'objet fonction : `sorted` l'appelle sur chaque élément pour obtenir la clé de tri.
      `key=len()` l'appellerait tout de suite, sans argument : une `TypeError`.
  - key: f-ou-f-appel
    format: course
    question: "Quelle différence entre `f` et `f()` ?"
    choices:
      - {text: "`f` désigne la fonction ; `f()` l'appelle et donne son résultat", correct: true}
      - {text: "Aucune : sans argument, les parenthèses sont facultatives", correct: false}
      - {text: "`f` appelle la fonction ; `f()` en crée une nouvelle copie", correct: false}
      - {text: "`f` est la fonction sans ses valeurs de paramètres par défaut", correct: false}
    answer: |-
      Sans parenthèses, on manipule la fonction : on peut la passer, la ranger, la comparer. Avec, on l'exécute. Une
      fonction de rappel s'enregistre donc sans parenthèses : `bouton.on_click(valider)`.
  - key: remplacer-if-elif
    format: course
    question: "Comment remplacer une longue chaîne de `if` et `elif` qui choisit une opération selon une commande ?"
    choices:
      - {text: "Par un dictionnaire qui associe chaque commande à sa fonction", correct: true}
      - {text: "Par une liste de chaînes, évaluées une à une avec `eval`", correct: false}
      - {text: "Par une boucle `while` qui essaie toutes les commandes", correct: false}
      - {text: "Par un `try` et un `except` autour de chaque commande", correct: false}
    answer: |-
      `operations = {"ajouter": ajouter, "retirer": retirer}`, puis `operations[commande](arguments)`. Ajouter une
      commande ne touche plus à la logique de choix ; `operations.get(commande)` gère la commande inconnue.
  - key: attribut-name
    format: course
    question: "Que contient l'attribut `__name__` d'une fonction ?"
    choices:
      - {text: "Le nom donné à la fonction dans son `def`", correct: true}
      - {text: "Le nom de la dernière variable qui la désigne", correct: false}
      - {text: "Le nom du module d'où on l'appelle", correct: false}
      - {text: "Le nom de son premier paramètre", correct: false}
    answer: |-
      Après `parler = crier`, `parler.__name__` vaut toujours `'crier'` : les deux noms désignent le même objet. Une
      `lambda` s'appelle `'<lambda>'`.
  - key: vf-fonction-dans-dict
    format: true-false
    question: "Une fonction peut être rangée comme valeur dans un dictionnaire."
    truth: true
    answer: "C'est le principe d'une table de dispatch : `actions[cle](...)` appelle la fonction trouvée."
  - key: vf-renvoyer-une-fonction
    format: true-false
    question: "Une fonction peut renvoyer une autre fonction."
    truth: true
    answer: "C'est ce que font les fabriques de fonctions et les décorateurs."
  - key: vf-print-mot-cle
    format: true-false
    question: "En Python 3, `print` est un mot-clé du langage, et non un objet."
    truth: false
    answer: "C'était une instruction en Python 2. En Python 3, c'est une fonction intégrée : `p = print` fonctionne."
  - key: vf-deux-noms-deux-copies
    format: true-false
    question: "Après `g = f`, `f` et `g` sont deux copies indépendantes de la fonction."
    truth: false
    answer: "Les deux noms désignent le même objet : `g is f` vaut `True`. Ajouter un attribut à `g` l'ajoute à `f`."
  - key: qcm-tri-derniere-lettre
    format: multiple-choice
    question: "Quel appel trie les mots de `mots` selon leur dernière lettre ?"
    choices:
      - {text: "`sorted(mots, key=lambda m: m[-1])`", correct: true}
      - {text: "`sorted(mots, key=m[-1])`", correct: false}
      - {text: "`sorted(mots, lambda m: m[-1])`", correct: false}
      - {text: "`sorted(mots[-1])`", correct: false}
    answer: |-
      `key` attend une fonction. `key=m[-1]` évalue `m[-1]` tout de suite (et `m` n'existe pas) ; `key` se passe par son
      nom ; `sorted(mots[-1])` trie les lettres du dernier mot.
  - key: qcm-tester-appelable
    format: multiple-choice
    question: "Quelle expression teste si l'objet `x` peut être appelé ?"
    choices:
      - {text: "`callable(x)`", correct: true}
      - {text: "`isinstance(x, function)`", correct: false}
      - {text: "`type(x) == \"function\"`", correct: false}
      - {text: "`x.__name__ is not None`", correct: false}
    answer: |-
      `callable` répond pour tout objet : fonction, méthode, classe, objet qui définit `__call__`. Le nom `function`
      n'existe pas parmi les noms intégrés, et un type ne s'égale pas à une chaîne.
  - key: qcm-dispatch-operator
    format: multiple-choice
    question: "Avec `operations = {\"+\": operator.add}`, que donne `operations[\"+\"](2, 3)` ?"
    choices:
      - {text: "`5`", correct: true}
      - {text: "La fonction `operator.add` elle-même", correct: false}
      - {text: "Une `TypeError` : un dict ne s'appelle pas", correct: false}
      - {text: "La chaîne `\"2 + 3\"`", correct: false}
    answer: "`operations[\"+\"]` donne la fonction, et `(2, 3)` l'appelle : `operator.add(2, 3)` vaut 5."
  - key: qcm-ordre-superieur
    format: multiple-choice
    question: "Quel groupe ne contient que des fonctions intégrées qui acceptent une fonction en argument ?"
    choices:
      - {text: "`sorted`, `map` et `filter`", correct: true}
      - {text: "`len`, `sum` et `print`", correct: false}
      - {text: "`range`, `zip` et `enumerate`", correct: false}
      - {text: "`abs`, `round` et `divmod`", correct: false}
    answer: |-
      `sorted` (et `min`, `max`) acceptent `key=`, `map` et `filter` reçoivent la fonction à appliquer. Ce sont des
      fonctions d'ordre supérieur.
  - key: trous-appliquer
    format: fill-in
    question: |-
      Complète pour appliquer à `x` la fonction reçue en paramètre :
      ```python
      def appliquer(f, x):
          return ___(x)
      ```
    blanks:
      - - f
    answer: "Le paramètre `f` est une fonction : `f(x)` l'appelle."
  - key: trous-key-fonction
    format: fill-in
    question: |-
      Complète pour trier les produits par prix, avec la fonction `prix` :
      ```python
      def prix(produit):
          return produit["prix"]


      produits.sort(key=___)
      ```
    blanks:
      - - prix
    answer: "On passe la fonction, sans parenthèses : `sort` l'appelle sur chaque produit."
  - key: trous-renvoyer-fonction
    format: fill-in
    question: |-
      Complète pour que `fabrique_multiplicateur(3)(5)` vaille 15 :
      ```python
      def fabrique_multiplicateur(n):
          def multiplier(x):
              return x * n
          return ___
      ```
    blanks:
      - - multiplier
    answer: "On renvoie la fonction interne, sans l'appeler ; l'appelant l'appelle ensuite avec `(5)`."
  - key: trous-nom-fonction
    format: fill-in
    question: |-
      Complète pour afficher le nom de la fonction reçue :
      ```python
      def journaliser(f):
          print("appel de", f.___)
      ```
    blanks:
      - - __name__
    answer: "`__name__` contient le nom de la fonction, tel qu'il est écrit dans son `def`."
  - key: code-deux-noms
    format: code-output
    question: |-
      ```python
      def crier(s):
          return s.upper() + "!"


      parler = crier
      print(parler("salut"), parler is crier)
      ```
    answer: "`SALUT! True` : `parler` est un second nom pour le même objet fonction."
    check:
      output: "SALUT! True"
    choices:
      - {text: "`SALUT! True`", correct: true}
      - {text: "`SALUT! False`", correct: false}
      - {text: "`salut! True`", correct: false}
      - {text: "`crier True`", correct: false}
  - key: code-liste-de-fonctions
    format: code-output
    question: |-
      ```python
      print([f("12") for f in (int, float, len)])
      ```
    answer: "`[12, 12.0, 2]` : chaque fonction du tuple est appelée sur la chaîne `\"12\"`."
    check:
      output: "[12, 12.0, 2]"
    choices:
      - {text: "`[12, 12.0, 2]`", correct: true}
      - {text: "`[12, 12, 12]`", correct: false}
      - {text: "`['12', '12.0', '2']`", correct: false}
      - {text: "`[12, 12.0, 12]`", correct: false}
  - key: code-nom-et-doc
    format: code-output
    question: |-
      ```python
      def f():
          """Dit bonjour."""


      g = f
      print(g.__name__, g.__doc__)
      ```
    answer: "`f Dit bonjour.` : le nom et la docstring appartiennent à l'objet fonction, quel que soit le nom qui le désigne."
    check:
      output: "f Dit bonjour."
    choices:
      - {text: "`f Dit bonjour.`", correct: true}
      - {text: "`g Dit bonjour.`", correct: false}
      - {text: "`f None`", correct: false}
      - {text: "`g None`", correct: false}
  - key: code-appeler-le-resultat
    format: code-output
    question: |-
      ```python
      def saluer():
          print("bonjour")


      action = saluer()
      action()
      ```
    answer: |-
      `saluer()` est appelée tout de suite, affiche « bonjour » et renvoie `None`. `action()` appelle ensuite `None` :
      une `TypeError`, « 'NoneType' object is not callable ». Il fallait écrire `action = saluer`.
    check:
      output: "bonjour"
      throws: TypeError
    choices:
      - {text: "`bonjour`, puis une `TypeError`", correct: true}
      - text: |-
          ```
          bonjour
          bonjour
          ```
        correct: false
      - {text: "Une `TypeError`, sans rien afficher", correct: false}
      - {text: "`bonjour`, une seule fois", correct: false}
  - key: def-premiere-classe
    format: definition
    question: "Que veut dire « les fonctions sont des objets de première classe » ?"
    choices:
      - {text: "Qu'on les affecte, passe, renvoie et range comme toute autre valeur", correct: true}
      - {text: "Qu'elles s'exécutent avant tout le reste du code de leur module", correct: false}
      - {text: "Qu'elles sont compilées en code machine, plus rapide que le reste", correct: false}
      - {text: "Qu'elles ne peuvent appartenir qu'à une classe, comme des méthodes", correct: false}
    answer: |-
      Une fonction est une valeur comme un entier ou une liste : elle a un type, une identité, des attributs. C'est ce
      qui rend possibles les fermetures, les décorateurs et les tables de dispatch.
  - key: def-ordre-superieur
    format: definition
    question: "Qu'est-ce qu'une fonction d'ordre supérieur ?"
    choices:
      - {text: "Une fonction qui reçoit une fonction en argument, ou en renvoie une", correct: true}
      - {text: "Une fonction définie au niveau le plus haut d'un module", correct: false}
      - {text: "Une fonction dont la complexité dépasse O(n²)", correct: false}
      - {text: "Une fonction qui a priorité sur les fonctions intégrées", correct: false}
    answer: "`sorted` (avec `key`), `map`, `filter`, `functools.reduce` et tout décorateur en sont."
  - key: def-table-de-dispatch
    format: definition
    question: "Qu'est-ce qu'une table de dispatch ?"
    choices:
      - {text: "Un dictionnaire qui associe des clés à des fonctions à appeler", correct: true}
      - {text: "La liste des fonctions déjà appelées, dans l'ordre des appels", correct: false}
      - {text: "Le tableau qui répartit les threads entre les cœurs du processeur", correct: false}
      - {text: "Une table de la base de données qui garde l'historique des appels", correct: false}
    answer: "`handlers[evenement](donnees)` : on choisit la fonction par une recherche, plutôt que par des `if` en cascade."
  - key: def-appelable
    format: definition
    question: "Qu'est-ce qu'un « appelable » (callable), en Python ?"
    choices:
      - {text: "Tout objet qu'on appelle avec des parenthèses : fonction, classe, méthode", correct: true}
      - {text: "Uniquement une fonction définie avec `def` ou avec `lambda`", correct: false}
      - {text: "Une fonction qui n'a aucun paramètre obligatoire", correct: false}
      - {text: "Un objet qui a un attribut `__name__`", correct: false}
    answer: |-
      Une classe est appelable (l'appel crée une instance), et tout objet dont la classe définit `__call__` aussi.
      `callable(x)` le teste.
