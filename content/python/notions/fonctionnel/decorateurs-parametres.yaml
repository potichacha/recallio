notion: decorateurs-parametres
lesson: |-
  Un **décorateur à paramètres** s'écrit `@repeter(3)`. Python appelle d'abord `repeter(3)`, qui doit **renvoyer un
  décorateur** ; ce décorateur reçoit ensuite la fonction. D'où trois niveaux :

  ```python
  import functools


  def repeter(fois):                      # 1. la fabrique : reçoit les paramètres
      def decorateur(f):                  # 2. le décorateur : reçoit la fonction
          @functools.wraps(f)
          def enveloppe(*args, **kwargs): # 3. l'enveloppe : reçoit les arguments de l'appel
              for _ in range(fois):
                  resultat = f(*args, **kwargs)
              return resultat
          return enveloppe
      return decorateur


  @repeter(3)                             # équivaut à : bip = repeter(3)(bip)
  def bip():
      print("bip")
  ```

  - Les paramètres sont évalués **une fois**, à la décoration.
  - Oublier les parenthèses (`@repeter` au lieu de `@repeter(3)`) passe la fonction comme `fois` : l'erreur
    n'apparaît qu'à l'appel.
  - Un décorateur utilisable avec ou sans parenthèses prend la fonction en paramètre facultatif :

  ```python
  def trace(f=None, *, prefixe=">>"):
      if f is None:                        # appelé comme @trace(prefixe="--")
          return functools.partial(trace, prefixe=prefixe)

      @functools.wraps(f)
      def enveloppe(*args, **kwargs):
          print(prefixe, f.__name__)
          return f(*args, **kwargs)
      return enveloppe
  ```

  **Les décorateurs de classe** reçoivent une classe et renvoient une classe, souvent la même, modifiée : `@dataclass`
  lui ajoute `__init__`, `__repr__` et `__eq__`, `@functools.total_ordering` complète ses comparaisons. On en écrit
  pour tenir un registre :

  ```python
  PLUGINS = {}


  def enregistrer(cls):
      PLUGINS[cls.__name__.lower()] = cls
      return cls                           # sans ce return, le nom de la classe vaudrait None
  ```

  Enfin, un décorateur peut être **une classe** : `@Compter` crée une instance de `Compter`, qui reçoit la fonction
  dans son `__init__` et s'appelle par `__call__`. C'est pratique pour garder un état (`double.appels`), mais sur une
  méthode, l'instance ne reçoit pas `self` sans un `__get__` : on préfère d'ordinaire une fonction.

  **En entretien** : « `@deco(args)` appelle d'abord `deco(args)`, qui renvoie le vrai décorateur : trois niveaux, la
  fabrique, le décorateur, l'enveloppe. Les paramètres sont évalués une fois, à la décoration. Un décorateur de
  classe reçoit la classe et doit la renvoyer : c'est le principe de `@dataclass` ou d'un registre de plugins. »
cards:
  - key: trois-niveaux
    format: course
    question: "Combien de niveaux de fonctions imbriquées a un décorateur à paramètres comme `@repeter(3)` ?"
    choices:
      - {text: "Trois : la fabrique, le décorateur, l'enveloppe", correct: true}
      - {text: "Deux : le décorateur et l'enveloppe, comme sans paramètre", correct: false}
      - {text: "Un seul, qui reçoit `3` et la fonction en même temps", correct: false}
      - {text: "Quatre : une fonction par paramètre, plus l'enveloppe", correct: false}
    answer: |-
      La fabrique reçoit les paramètres et renvoie le décorateur ; le décorateur reçoit la fonction et renvoie
      l'enveloppe ; l'enveloppe reçoit les arguments de chaque appel.
  - key: equivalent-avec-parametres
    format: course
    question: "À quoi équivaut `@repeter(3)` placé au-dessus de `def f(): ...` ?"
    choices:
      - {text: "`f = repeter(3)(f)`", correct: true}
      - {text: "`f = repeter(f, 3)`", correct: false}
      - {text: "`f = repeter(3, f)()`", correct: false}
      - {text: "`f = repeter(f)(3)`", correct: false}
    answer: |-
      L'expression après `@` est évaluée d'abord : `repeter(3)` renvoie un décorateur, qui est ensuite appliqué à `f`.
      N'importe quelle expression est permise après `@` depuis Python 3.9.
  - key: decorateur-de-classe
    format: course
    question: "Que reçoit et que renvoie un décorateur de classe, comme `@dataclass` ?"
    choices:
      - {text: "Il reçoit la classe, et renvoie une classe, souvent la même modifiée", correct: true}
      - {text: "Il reçoit chaque instance, et en renvoie une copie modifiée", correct: false}
      - {text: "Il reçoit chaque méthode, et renvoie une fonction décorée", correct: false}
      - {text: "Il reçoit le module, et renvoie la classe qu'il contient", correct: false}
    answer: |-
      `@dataclass` lit les annotations de la classe et lui ajoute `__init__`, `__repr__` et `__eq__`, puis la renvoie.
      Le décorateur s'exécute une fois, à la définition de la classe.
  - key: avec-ou-sans-parentheses
    format: course
    question: "Comment écrire un décorateur utilisable aussi bien en `@trace` qu'en `@trace(prefixe=\"--\")` ?"
    choices:
      - {text: "Avec `def trace(f=None, *, prefixe=\">>\")`, qui teste si `f` est donné", correct: true}
      - {text: "Avec deux fonctions du même nom, dont Python choisit la bonne", correct: false}
      - {text: "Avec un `@functools.wraps` placé sur la fabrique, au plus haut", correct: false}
      - {text: "C'est impossible : il faut choisir l'une des deux écritures", correct: false}
    answer: |-
      Sans parenthèses, `trace` reçoit la fonction et décore directement. Avec des paramètres nommés seulement, `f`
      vaut `None` : `trace` renvoie alors un décorateur, par exemple `functools.partial(trace, prefixe=prefixe)`.
  - key: vf-fabrique-appelee-d-abord
    format: true-false
    question: "`@repeter(3)` appelle d'abord `repeter(3)`, puis applique le décorateur obtenu à la fonction."
    truth: true
    answer: "L'expression qui suit `@` est évaluée, puis son résultat est appelé avec la fonction."
  - key: vf-classe-modifiee-renvoyee
    format: true-false
    question: "Un décorateur de classe peut renvoyer la classe qu'il a reçue, après lui avoir ajouté une méthode."
    truth: true
    answer: "C'est le cas le plus courant : `cls.methode = ...`, puis `return cls`."
  - key: vf-sans-parentheses-defaut
    format: true-false
    question: "Écrire `@repeter` sans parenthèses, alors que `repeter` attend un nombre, utilise une valeur par défaut."
    truth: false
    answer: |-
      La fonction est passée comme paramètre `fois`, et le nom désigne alors le décorateur intermédiaire. L'erreur
      n'apparaît qu'à l'appel, avec un message déroutant.
  - key: vf-parametres-a-chaque-appel
    format: true-false
    question: "Les paramètres d'un décorateur comme `@repeter(3)` sont évalués à chaque appel de la fonction décorée."
    truth: false
    answer: "Ils sont évalués une seule fois, à la décoration ; l'enveloppe les lit ensuite par fermeture."
  - key: qcm-structure-fabrique
    format: multiple-choice
    question: "Que renvoie la fabrique `reessayer(fois)` d'un décorateur à paramètres ?"
    choices:
      - {text: "Un décorateur, qui renverra à son tour une enveloppe", correct: true}
      - {text: "Directement l'enveloppe qui réessaie l'appel", correct: false}
      - {text: "Le résultat de la fonction, après `fois` essais", correct: false}
      - {text: "Une classe qui hérite de la fonction décorée", correct: false}
    answer: |-
      `reessayer(3)` ne connaît pas encore la fonction : il renvoie un décorateur, qui la recevra. C'est ce décorateur
      qui crée l'enveloppe.
  - key: qcm-ou-placer-wraps
    format: multiple-choice
    question: "Où place-t-on `@functools.wraps(f)` dans un décorateur à paramètres ?"
    choices:
      - {text: "Sur l'enveloppe, au niveau le plus profond", correct: true}
      - {text: "Sur la fabrique, au niveau le plus haut", correct: false}
      - {text: "Sur le décorateur, au niveau du milieu", correct: false}
      - {text: "Au-dessus de `@repeter(3)`, sur la fonction", correct: false}
    answer: "`wraps` copie les attributs de `f` sur la fonction qui la remplace : l'enveloppe, seule à connaître `f`."
  - key: qcm-decorateur-de-classe-standard
    format: multiple-choice
    question: "Quel décorateur de classe de la bibliothèque standard ajoute `__init__`, `__repr__` et `__eq__` ?"
    choices:
      - {text: "`@dataclasses.dataclass`", correct: true}
      - {text: "`@functools.total_ordering`", correct: false}
      - {text: "`@functools.wraps`", correct: false}
      - {text: "`@abc.abstractmethod`", correct: false}
    answer: |-
      `total_ordering` est aussi un décorateur de classe, mais il complète les comparaisons (`<`, `>`...) à partir de
      `__eq__` et d'une seule d'entre elles.
  - key: qcm-registre-de-plugins
    format: multiple-choice
    question: "Quel est l'intérêt d'un décorateur de classe `@enregistrer` qui range chaque classe décorée dans un dictionnaire ?"
    choices:
      - {text: "Tenir un registre des plugins sans liste à mettre à jour à la main", correct: true}
      - {text: "Accélérer la création des instances de chaque classe décorée", correct: false}
      - {text: "Empêcher qu'une autre classe hérite de la classe décorée", correct: false}
      - {text: "Rendre privés tous les attributs de la classe décorée", correct: false}
    answer: |-
      Chaque classe s'inscrit elle-même en étant définie : ajouter un format revient à écrire sa classe. On retrouve
      ce principe dans les routes des frameworks web.
  - key: code-repeter
    format: code-output
    question: |-
      ```python
      def repeter(n):
          def decorateur(f):
              def enveloppe(*args):
                  return [f(*args) for _ in range(n)]
              return enveloppe
          return decorateur


      @repeter(3)
      def dire(mot):
          return mot


      print(dire("hop"))
      ```
    answer: "`['hop', 'hop', 'hop']` : l'enveloppe appelle la fonction `n` fois, `n` étant capturé par fermeture."
    check:
      output: "['hop', 'hop', 'hop']"
    choices:
      - {text: "`['hop', 'hop', 'hop']`", correct: true}
      - {text: "`hop`", correct: false}
      - {text: "`hophophop`", correct: false}
      - {text: "`['hop']`", correct: false}
  - key: code-registre
    format: code-output
    question: |-
      ```python
      PLUGINS = {}


      def enregistrer(cls):
          PLUGINS[cls.__name__.lower()] = cls
          return cls


      @enregistrer
      class Csv:
          pass


      @enregistrer
      class Json:
          pass


      print(sorted(PLUGINS))
      ```
    answer: "`['csv', 'json']` : chaque classe s'inscrit dans le registre au moment où elle est définie."
    check:
      output: "['csv', 'json']"
    choices:
      - {text: "`['csv', 'json']`", correct: true}
      - {text: "`['Csv', 'Json']`", correct: false}
      - {text: "`[]`", correct: false}
      - {text: "`['json', 'csv']`", correct: false}
  - key: code-fabrique-une-fois
    format: code-output
    question: |-
      ```python
      def prefixe(texte):
          print("fabrique")

          def decorateur(f):
              def enveloppe():
                  return texte + f()
              return enveloppe
          return decorateur


      @prefixe(">> ")
      def message():
          return "ok"


      print(message())
      print(message())
      ```
    answer: "La fabrique s'exécute une fois, à la décoration ; chaque appel ne passe que par l'enveloppe."
    check:
      output: |-
        fabrique
        >> ok
        >> ok
    choices:
      - text: |-
          ```
          fabrique
          >> ok
          >> ok
          ```
        correct: true
      - text: |-
          ```
          fabrique
          >> ok
          fabrique
          >> ok
          ```
        correct: false
      - text: |-
          ```
          >> ok
          >> ok
          ```
        correct: false
      - text: |-
          ```
          >> ok
          >> ok
          fabrique
          ```
        correct: false
  - key: code-classe-decoratrice
    format: code-output
    question: |-
      ```python
      class Compter:
          def __init__(self, f):
              self.f = f
              self.appels = 0

          def __call__(self, *args):
              self.appels += 1
              return self.f(*args)


      @Compter
      def double(x):
          return x * 2


      double(1)
      print(double(5), double.appels, type(double).__name__)
      ```
    answer: |-
      `10 2 Compter` : `double` est une instance de `Compter`, qui compte ses appels et appelle la fonction gardée.
      Les arguments de `print` sont évalués dans l'ordre : `double(5)` passe le compteur à 2 avant qu'on le lise.
    check:
      output: "10 2 Compter"
    choices:
      - {text: "`10 2 Compter`", correct: true}
      - {text: "`10 1 Compter`", correct: false}
      - {text: "`10 2 function`", correct: false}
      - {text: "`10 1 function`", correct: false}
  - key: bug-parentheses-oubliees
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: repeter.<locals>.decorateur() missing 1 required positional argument:
      'f' » :
      ```python
      def repeter(n):
          def decorateur(f):
              def enveloppe(*args):
                  for _ in range(n):
                      f(*args)
              return enveloppe
          return decorateur


      @repeter
      def bip():
          print("bip")


      bip()
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Donner le paramètre : `@repeter(3)`", correct: true}
      - {text: "Appeler `bip(3)` au lieu de `bip()`", correct: false}
      - {text: "Écrire `@repeter()`, sans argument", correct: false}
      - {text: "Écrire `@repeter.decorateur`", correct: false}
    answer: |-
      ```python
      @repeter(3)
      def bip():
          print("bip")
      ```
      Sans parenthèses, `repeter` reçoit la fonction comme `n`, et `bip` désigne le décorateur intermédiaire. Appeler
      `bip()` appelle donc `decorateur()`, sans la fonction qu'il attend.
  - key: bug-deux-niveaux-seulement
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: prefixe() missing 1 required positional argument: 'f' » :
      ```python
      def prefixe(texte, f):
          def enveloppe():
              return texte + f()
          return enveloppe


      @prefixe(">> ")
      def message():
          return "ok"
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Une fabrique `prefixe(texte)` qui renvoie un décorateur `decorateur(f)`", correct: true}
      - {text: "Écrire `@prefixe(\">> \", message)` au-dessus du `def`", correct: false}
      - {text: "Inverser les paramètres : `def prefixe(f, texte)`", correct: false}
      - {text: "Donner une valeur par défaut : `def prefixe(texte, f=None)`", correct: false}
    answer: |-
      ```python
      def prefixe(texte):
          def decorateur(f):
              def enveloppe():
                  return texte + f()
              return enveloppe
          return decorateur
      ```
      `@prefixe(">> ")` appelle `prefixe` avec le seul texte : c'est son résultat qui recevra la fonction. Il faut donc
      un niveau de plus.
  - key: bug-classe-non-renvoyee
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: 'NoneType' object is not callable » :
      ```python
      def ajouter_salut(cls):
          cls.saluer = lambda self: "salut"


      @ajouter_salut
      class Robot:
          pass


      print(Robot().saluer())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter `return cls` à la fin de `ajouter_salut`", correct: true}
      - {text: "Écrire `def saluer(self)` dans la classe `Robot`", correct: false}
      - {text: "Appeler `Robot.saluer()` sans créer d'instance", correct: false}
      - {text: "Remplacer la lambda par `staticmethod(lambda: \"salut\")`", correct: false}
    answer: |-
      ```python
      def ajouter_salut(cls):
          cls.saluer = lambda self: "salut"
          return cls
      ```
      Le nom `Robot` désigne ce que le décorateur renvoie. Sans `return`, c'est `None`, et `Robot()` appelle `None`.
  - key: bug-parametres-sans-wraps
    format: bug-fix
    question: |-
      Le nom et la docstring de la fonction ont disparu :
      ```python
      def repeter(n):
          def decorateur(f):
              def enveloppe(*args, **kwargs):
                  for _ in range(n):
                      resultat = f(*args, **kwargs)
                  return resultat
              return enveloppe
          return decorateur


      @repeter(2)
      def sauvegarder():
          """Sauvegarde les données."""


      print(sauvegarder.__name__, sauvegarder.__doc__)
      ```
      Le programme affiche `enveloppe None`. Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter `@functools.wraps(f)` au-dessus de `def enveloppe`", correct: true}
      - {text: "Ajouter `@functools.wraps(n)` au-dessus de `def decorateur`", correct: false}
      - {text: "Ajouter `@functools.wraps(f)` au-dessus de `def repeter`", correct: false}
      - {text: "Ajouter `@functools.wraps` au-dessus de `@repeter(2)`", correct: false}
    answer: |-
      ```python
      def decorateur(f):
          @functools.wraps(f)
          def enveloppe(*args, **kwargs):
              ...
      ```
      Seul le décorateur du milieu connaît `f`, et seule l'enveloppe la remplace : c'est elle qui doit recevoir le nom
      et la docstring de `f`.
