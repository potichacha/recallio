notion: expressions-generatrices
lesson: |-
  Une **expression génératrice** s'écrit comme une compréhension de liste, mais entre parenthèses. Elle ne construit
  pas de liste : elle renvoie un **générateur**, qui calcule chaque valeur à la demande.

  ```python
  carres_liste = [x * x for x in range(1_000_000)]   # un million d'entiers en mémoire
  carres_gen = (x * x for x in range(1_000_000))     # quelques centaines d'octets

  sum(x * x for x in range(1_000_000))         # seul argument : les parenthèses de l'appel suffisent
  max((len(l) for l in lignes), default=0)     # deux arguments : parenthèses obligatoires
  ```

  - Elle accepte les mêmes formes qu'une compréhension : `(f(x) for x in xs if test(x))`, plusieurs `for`.
  - Elle est **paresseuse** : l'expression n'est appliquée à un élément qu'au moment où on le demande. Seul l'itérable
    du premier `for` est évalué tout de suite, à la création.
  - C'est un générateur : il se parcourt **une fois**, sans `len` ni indice. Et un générateur est toujours vrai dans
    un `if`, même s'il ne produira rien.
  - Il n'y a pas de « compréhension de tuple » : `(x for x in xs)` est un générateur, `tuple(x for x in xs)` un tuple.

  **Liste ou expression génératrice ?**

  | Choisis | Quand |
  |---|---|
  | une expression génératrice | le résultat est consommé une fois, par `sum`, `any`, `max`, `"".join` ou `for` ; les données sont grosses ou infinies ; on peut s'arrêter avant la fin (`any`, `next`) |
  | une compréhension de liste | on parcourt le résultat plusieurs fois, on l'indexe, on a besoin de `len` ; ou on veut voir les valeurs pour déboguer |

  ```python
  premiere_erreur = next((l for l in lignes if "ERREUR" in l), None)   # s'arrête à la première
  ```

  Sur de petites listes, la différence de vitesse est faible, et la compréhension de liste est même souvent un peu
  plus rapide. Le gain d'une expression génératrice, c'est la mémoire et l'arrêt anticipé.

  **En entretien** : « Une expression génératrice, entre parenthèses, renvoie un générateur paresseux au lieu d'une
  liste : une mémoire constante, et un arrêt possible avant la fin. Je la passe directement à `sum`, `any` ou `max`.
  Je garde une liste quand je dois parcourir le résultat plusieurs fois ou l'indexer. »
cards:
  - key: ce-que-produit-une-genexp
    format: course
    question: "Que produit `(x * 2 for x in xs)` ?"
    choices:
      - {text: "Un générateur, qui calcule les valeurs à la demande", correct: true}
      - {text: "Un tuple des valeurs doublées, calculé tout de suite", correct: false}
      - {text: "Une liste des valeurs doublées, calculée tout de suite", correct: false}
      - {text: "Un ensemble des valeurs doublées, sans doublon", correct: false}
    answer: |-
      Les parenthèses ne font pas un tuple : elles font une expression génératrice. Pour un tuple, on écrit
      `tuple(x * 2 for x in xs)`.
  - key: quand-preferer-la-liste
    format: course
    question: "Quand préférer une compréhension de liste à une expression génératrice ?"
    choices:
      - {text: "Quand on parcourt le résultat plusieurs fois, ou qu'on l'indexe", correct: true}
      - {text: "Quand les données sont trop grosses pour tenir en mémoire", correct: false}
      - {text: "Quand on veut seulement leur somme ou leur maximum", correct: false}
      - {text: "Quand on veut s'arrêter au premier élément qui convient", correct: false}
    answer: |-
      Un générateur ne se parcourt qu'une fois, sans indice ni `len`. Les trois autres cas sont justement ceux où
      l'expression génératrice est meilleure : mémoire constante, consommation unique, arrêt anticipé.
  - key: somme-sans-saturer
    format: course
    question: "Pourquoi `sum(x * x for x in range(10**8))` ne sature-t-il pas la mémoire ?"
    choices:
      - {text: "Chaque carré est produit, ajouté à la somme, puis oublié", correct: true}
      - {text: "Python range les carrés dans un tableau compact", correct: false}
      - {text: "`sum` découpe le calcul en morceaux traités à part", correct: false}
      - {text: "Les entiers de Python ne prennent pas de place en mémoire", correct: false}
    answer: |-
      Ni `range` ni l'expression génératrice ne construisent de liste : un seul carré existe à la fois. Avec
      `sum([x * x for x in range(10**8)])`, la liste de cent millions d'entiers serait construite d'abord.
  - key: parentheses-omises
    format: course
    question: "Quand peut-on omettre les parenthèses d'une expression génératrice ?"
    choices:
      - {text: "Quand elle est le seul argument d'un appel", correct: true}
      - {text: "Toujours, comme les parenthèses d'un tuple", correct: false}
      - {text: "Jamais : elles sont obligatoires partout", correct: false}
      - {text: "Quand elle contient une condition `if`", correct: false}
    answer: |-
      `sum(x for x in xs)` suffit. Dès qu'il y a un autre argument, il faut ses propres parenthèses :
      `sorted((x for x in xs), reverse=True)`.
  - key: vf-genexp-tuple
    format: true-false
    question: "`(x for x in range(3))` est un tuple."
    truth: false
    answer: "C'est un générateur. Il n'existe pas de compréhension de tuple : on écrit `tuple(x for x in range(3))`."
  - key: vf-genexp-paresseuse
    format: true-false
    question: "Une expression génératrice n'applique son expression à un élément qu'au moment où on demande cet élément."
    truth: true
    answer: |-
      C'est l'évaluation paresseuse. Seul l'itérable du premier `for` est évalué à la création ; le reste attend le
      parcours.
  - key: vf-any-arret-anticipe
    format: true-false
    question: "Dans `any(x > 100 for x in mesures)`, le parcours s'arrête au premier élément supérieur à 100."
    truth: true
    answer: |-
      `any` s'arrête au premier `True`, et le générateur ne calcule pas les tests suivants. Avec une liste, tous les
      tests seraient calculés avant que `any` ne commence.
  - key: vf-sorted-genexp-reverse
    format: true-false
    question: "`sorted(x for x in xs, reverse=True)` est une écriture valide."
    truth: false
    answer: |-
      C'est une `SyntaxError` : une expression génératrice qui n'est pas le seul argument doit avoir ses parenthèses,
      `sorted((x for x in xs), reverse=True)`.
  - key: qcm-somme-carres
    format: multiple-choice
    question: "Quelle écriture calcule la somme des carrés de `xs` sans construire de collection intermédiaire ?"
    choices:
      - {text: "`sum(x * x for x in xs)`", correct: true}
      - {text: "`sum([x * x for x in xs])`", correct: false}
      - {text: "`sum({x * x for x in xs})`", correct: false}
      - {text: "`sum(list(x * x for x in xs))`", correct: false}
    answer: |-
      Les crochets construisent une liste, `list(...)` aussi. Les accolades construisent un ensemble, qui en plus
      supprime les carrés en double : la somme serait fausse.
  - key: qcm-tuple-des-longueurs
    format: multiple-choice
    question: "Comment obtenir un tuple des longueurs des mots de `mots` ?"
    choices:
      - {text: "`tuple(len(m) for m in mots)`", correct: true}
      - {text: "`(len(m) for m in mots)`", correct: false}
      - {text: "`tuple[len(m) for m in mots]`", correct: false}
      - {text: "`(len(m) for m in mots,)`", correct: false}
    answer: |-
      On passe une expression génératrice à `tuple`. `(len(m) for m in mots)` seul est un générateur, et
      `tuple[...]` est une annotation de type, pas un appel.
  - key: qcm-premier-qui-convient
    format: multiple-choice
    question: "Quelle écriture donne le premier nom de `noms` qui commence par « A », ou `None` s'il n'y en a aucun ?"
    choices:
      - {text: '`next((n for n in noms if n.startswith("A")), None)`', correct: true}
      - {text: '`next(n for n in noms if n.startswith("A"), None)`', correct: false}
      - {text: '`[n for n in noms if n.startswith("A")][0]`', correct: false}
      - {text: '`(n for n in noms if n.startswith("A"))[0]`', correct: false}
    answer: |-
      `next` lit le premier élément du générateur, ou renvoie `None` s'il est vide. Sans les parenthèses du générateur,
      c'est une `SyntaxError` ; la liste lève une `IndexError` quand aucun nom ne convient, et un générateur ne
      s'indexe pas.
  - key: qcm-taille-memoire
    format: multiple-choice
    question: "Comment la taille d'une expression génératrice sur un million d'éléments se compare-t-elle à celle de la liste équivalente ?"
    choices:
      - {text: "Elle reste de quelques centaines d'octets, quelle que soit la taille des données", correct: true}
      - {text: "Elle fait environ la moitié de celle de la liste, grâce au partage", correct: false}
      - {text: "Elle est exactement la même que celle de la liste", correct: false}
      - {text: "Elle fait le double, à cause de l'état du générateur", correct: false}
    answer: |-
      `sys.getsizeof` d'un générateur donne quelques centaines d'octets : il ne garde que son état, jamais les valeurs.
      La liste d'un million d'entiers pèse, elle, plusieurs mégaoctets.
  - key: trous-compter-mots-longs
    format: fill-in
    question: |-
      Complète pour compter les mots de plus de cinq lettres, sans construire de liste :
      ```python
      longs = sum(1 ___ m in mots if len(m) > 5)
      ```
    blanks:
      - - for
    answer: "L'expression génératrice produit un `1` par mot qui passe le test, et `sum` les additionne."
  - key: trous-premiere-erreur
    format: fill-in
    question: |-
      Complète pour obtenir la première ligne qui contient « ERREUR », ou `None` :
      ```python
      premiere = ___((l for l in lignes if "ERREUR" in l), None)
      ```
    blanks:
      - - next
    answer: "`next` lit le premier élément du générateur, et renvoie son second argument s'il n'y en a aucun."
  - key: trous-filtre-positifs
    format: fill-in
    question: |-
      Complète l'expression génératrice qui ne garde que les nombres positifs :
      ```python
      positifs = (n for n in nombres ___ n > 0)
      ```
    blanks:
      - - if
    answer: "La condition se place après le `for`, comme dans une compréhension de liste."
  - key: trous-plus-longue-ligne
    format: fill-in
    question: |-
      Complète pour obtenir la longueur de la plus longue ligne :
      ```python
      plus_longue = ___(len(l) for l in lignes)
      ```
    blanks:
      - - max
    answer: "`max` consomme l'expression génératrice sans liste intermédiaire. Pour des lignes vides, ajoute `default=0`."
  - key: code-next-puis-sum
    format: code-output
    question: |-
      ```python
      g = (x * 10 for x in range(4))
      print(next(g), next(g), sum(g))
      ```
    answer: "`0 10 50` : les deux `next` lisent 0 et 10, puis `sum` additionne ce qui reste, 20 et 30."
    check:
      output: "0 10 50"
    choices:
      - {text: "`0 10 50`", correct: true}
      - {text: "`0 10 60`", correct: false}
      - {text: "`10 20 30`", correct: false}
      - {text: "`0 10 0`", correct: false}
  - key: code-type-et-deux-parcours
    format: code-output
    question: |-
      ```python
      g = (x for x in [1, 2, 3])
      print(type(g).__name__, list(g), list(g))
      ```
    answer: "`generator [1, 2, 3] []` : c'est un générateur, et le second `list` le trouve épuisé."
    check:
      output: "generator [1, 2, 3] []"
    choices:
      - {text: "`generator [1, 2, 3] []`", correct: true}
      - {text: "`tuple [1, 2, 3] [1, 2, 3]`", correct: false}
      - {text: "`generator [1, 2, 3] [1, 2, 3]`", correct: false}
      - {text: "`list [1, 2, 3] []`", correct: false}
  - key: code-premier-iterable-evalue
    format: code-output
    question: |-
      ```python
      xs = [1, 2, 3]
      g = (x * 2 for x in xs)
      xs = [10, 20]
      print(list(g))
      ```
    answer: |-
      `[2, 4, 6]` : l'itérable du premier `for` est évalué à la création du générateur. Réaffecter ensuite le nom `xs`
      ne change pas la liste qu'il parcourt.
    check:
      output: "[2, 4, 6]"
    choices:
      - {text: "`[2, 4, 6]`", correct: true}
      - {text: "`[20, 40]`", correct: false}
      - {text: "`[]`", correct: false}
      - {text: "`[2, 4, 6, 20, 40]`", correct: false}
  - key: code-calcul-a-la-demande
    format: code-output
    question: |-
      ```python
      def double(x):
          print("calcul", x)
          return x * 2


      g = (double(x) for x in [1, 2, 3])
      print("prêt")
      print(next(g))
      ```
    answer: |-
      Créer le générateur n'appelle pas `double`. Le premier `next` calcule le premier élément, et seulement lui : les
      deux autres ne sont jamais calculés.
    check:
      output: |-
        prêt
        calcul 1
        2
    choices:
      - text: |-
          ```
          prêt
          calcul 1
          2
          ```
        correct: true
      - text: |-
          ```
          calcul 1
          calcul 2
          calcul 3
          prêt
          2
          ```
        correct: false
      - text: |-
          ```
          calcul 1
          prêt
          2
          ```
        correct: false
      - text: |-
          ```
          prêt
          calcul 1
          calcul 2
          calcul 3
          2
          ```
        correct: false
  - key: bug-genexp-sans-parentheses
    format: bug-fix
    question: |-
      Ce programme ne se lance pas : « SyntaxError: Generator expression must be parenthesized ».
      ```python
      mots = ["kiwi", "pomme", "fraise"]
      tri = sorted(len(m) for m in mots, reverse=True)
      print(tri)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`sorted((len(m) for m in mots), reverse=True)`", correct: true}
      - {text: "`sorted(len(m) for m in mots; reverse=True)`", correct: false}
      - {text: "`sorted(reverse=True, len(m) for m in mots)`", correct: false}
      - {text: "`sorted(len(m) for m in mots)(reverse=True)`", correct: false}
    answer: |-
      ```python
      tri = sorted((len(m) for m in mots), reverse=True)
      ```
      Les parenthèses d'un appel ne suffisent à l'expression génératrice que si elle est le seul argument. Avec un
      second argument, elle doit avoir les siennes.
  - key: bug-genexp-indexee
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: 'generator' object is not subscriptable » :
      ```python
      carres = (n * n for n in range(10))
      print(carres[3])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Une liste : `carres = [n * n for n in range(10)]`", correct: true}
      - {text: "Un tuple : `carres = (n * n for n in range(10),)`", correct: false}
      - {text: "Lire l'élément avec `carres.get(3)`", correct: false}
      - {text: "Lire l'élément avec `next(carres, 3)`", correct: false}
    answer: |-
      ```python
      carres = [n * n for n in range(10)]
      print(carres[3])
      ```
      Un générateur ne s'indexe pas : il ne garde pas ses valeurs. Pour lire par indice, il faut une liste. `next(carres,
      3)` renverrait le premier carré, `0`.
  - key: bug-attendre-un-tuple
    format: bug-fix
    question: |-
      La comparaison affiche `False` :
      ```python
      coords = (x * 2 for x in (1, 2, 3))
      print(coords == (2, 4, 6))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `coords = tuple(x * 2 for x in (1, 2, 3))`", correct: true}
      - {text: "Écrire `coords = (x * 2 for x in [1, 2, 3])`", correct: false}
      - {text: "Comparer avec `coords is (2, 4, 6)`", correct: false}
      - {text: "Comparer avec `coords == [2, 4, 6]`", correct: false}
    answer: |-
      ```python
      coords = tuple(x * 2 for x in (1, 2, 3))
      print(coords == (2, 4, 6))     # True
      ```
      Les parenthèses font un générateur, pas un tuple : un générateur n'est égal qu'à lui-même. `tuple(...)` construit
      le tuple attendu.
  - key: bug-generateur-toujours-vrai
    format: bug-fix
    question: |-
      Le message s'affiche alors qu'aucune ligne ne contient d'erreur :
      ```python
      def erreurs(lignes):
          return (l for l in lignes if "ERREUR" in l)


      if erreurs(["ok", "ok"]):
          print("Des erreurs ont été trouvées")
      ```
      Pourquoi ?
    choices:
      - {text: "Un générateur est toujours vrai, même s'il ne produira rien", correct: true}
      - {text: "La condition `\"ERREUR\" in l` cherche dans la liste entière", correct: false}
      - {text: "`return` renvoie la première ligne, qui est une chaîne non vide", correct: false}
      - {text: "Le `if` parcourt le générateur et trouve une ligne vide", correct: false}
    answer: |-
      ```python
      def contient_erreur(lignes):
          return any("ERREUR" in l for l in lignes)


      if contient_erreur(["ok", "ok"]):
          print("Des erreurs ont été trouvées")
      ```
      Un objet générateur n'a pas de longueur : sa valeur de vérité est toujours vraie. `any` parcourt et répond, ou
      bien on construit une liste, dont la valeur de vérité dit si elle est vide.
