notion: generateurs-send
lesson: |-
  Un `yield` est aussi une **expression** : `x = yield valeur` produit `valeur`, se suspend, puis reçoit ce que
  l'appelant envoie avec `send`.

  | Méthode | Effet |
  |---|---|
  | `next(gen)` | reprend le générateur ; le `yield` en cours vaut `None` |
  | `gen.send(v)` | reprend le générateur ; le `yield` en cours vaut `v`. Renvoie la valeur du `yield` suivant |
  | `gen.throw(exc)` | lève `exc` à l'endroit du `yield` en cours |
  | `gen.close()` | lève `GeneratorExit` à l'endroit du `yield` en cours : les `finally` s'exécutent |

  ```python
  def moyenne():
      total, n, moy = 0, 0, None
      while True:
          x = yield moy          # produit la moyenne, reçoit la mesure suivante
          total += x
          n += 1
          moy = total / n


  m = moyenne()
  next(m)            # amorce : avance jusqu'au premier yield
  m.send(10)         # 10.0
  m.send(20)         # 15.0
  ```

  - Il faut **amorcer** le générateur : il doit être arrêté sur un `yield` pour recevoir une valeur. `next(gen)` ou
    `gen.send(None)` le fait ; envoyer autre chose à un générateur qui n'a pas démarré lève une `TypeError`.
  - `close()` lève `GeneratorExit` dans le générateur. S'il la rattrape et produit encore une valeur, `close()` lève
    une `RuntimeError`. Un générateur la laisse donc passer, et fait son ménage dans un `finally`.
  - `throw` signale une erreur au générateur, qui peut la traiter à l'endroit du `yield`.

  Ces générateurs qui reçoivent des valeurs sont des **coroutines**. Avant Python 3.5, `asyncio` les écrivait ainsi,
  avec `yield from` ; aujourd'hui, `async def` et `await` les remplacent pour l'asynchrone. `send` reste rare : des
  calculs au fil de l'eau, des automates.

  **En entretien** : « `x = yield v` produit `v` et reçoit ce que l'appelant envoie par `send`. Il faut amorcer le
  générateur avec `next` avant le premier `send`. `close` lève `GeneratorExit` au point de suspension, `throw` y lève
  une exception ; c'est l'ancêtre des coroutines `async` et `await`. »
cards:
  - key: ce-que-renvoie-send
    format: course
    question: "Que renvoie `gen.send(v)` ?"
    choices:
      - {text: "La valeur produite par le `yield` suivant", correct: true}
      - {text: "La valeur `v` qu'on vient d'envoyer", correct: false}
      - {text: "Toujours `None`, quelle que soit `v`", correct: false}
      - {text: "La valeur de retour du générateur", correct: false}
    answer: |-
      `send(v)` fait valoir `v` au `yield` en cours, reprend le générateur jusqu'au `yield` suivant, et renvoie la
      valeur que celui-ci produit. Si le générateur se termine, `send` lève `StopIteration`.
  - key: pourquoi-amorcer
    format: course
    question: "Pourquoi faut-il appeler `next(gen)` avant d'envoyer une première valeur avec `send` ?"
    choices:
      - {text: "Le générateur doit être arrêté sur un `yield` pour la recevoir", correct: true}
      - {text: "`next` initialise les variables locales du générateur", correct: false}
      - {text: "`send` n'est permis qu'après une première `StopIteration`", correct: false}
      - {text: "`next` vérifie que le générateur n'est pas vide", correct: false}
    answer: |-
      Un générateur neuf n'a pas encore exécuté son corps : il n'y a aucun `yield` pour recevoir la valeur. `next(gen)`
      (ou `gen.send(None)`) l'avance jusqu'au premier `yield`.
  - key: ce-que-fait-close
    format: course
    question: "Que fait `gen.close()` ?"
    choices:
      - {text: "Il lève `GeneratorExit` au `yield` où le générateur est suspendu", correct: true}
      - {text: "Il libère la mémoire du générateur, sans rien exécuter", correct: false}
      - {text: "Il produit la dernière valeur, puis arrête le générateur", correct: false}
      - {text: "Il remet le générateur au début, pour un nouveau parcours", correct: false}
    answer: |-
      L'exception remonte dans le générateur : ses blocs `finally` et ses `with` s'exécutent, puis il se termine. Le
      ramasse-miettes appelle aussi `close()` sur un générateur abandonné.
  - key: remplace-par-async
    format: course
    question: "Qu'est-ce que `async` et `await` ont remplacé, depuis Python 3.5 ?"
    choices:
      - {text: "Les coroutines écrites avec des générateurs, `yield from` et `send`", correct: true}
      - {text: "Les threads du module `threading`, devenus obsolètes", correct: false}
      - {text: "Les fonctions de rappel du module `sched`", correct: false}
      - {text: "Les processus du module `multiprocessing`", correct: false}
    answer: |-
      `asyncio` reposait d'abord sur des générateurs décorés par `@asyncio.coroutine`, qui suspendaient leur exécution
      avec `yield from`. `async def` et `await` en ont fait une syntaxe dédiée. Les threads et les processus restent
      utilisés.
  - key: vf-send-none
    format: true-false
    question: "`gen.send(None)` équivaut à `next(gen)`."
    truth: true
    answer: "Les deux reprennent le générateur ; le `yield` en cours vaut alors `None`."
  - key: vf-send-avant-demarrage
    format: true-false
    question: "Envoyer une valeur autre que `None` à un générateur qui n'a pas encore démarré lève une `TypeError`."
    truth: true
    answer: "Le message le dit : « can't send non-None value to a just-started generator »."
  - key: vf-finally-au-close
    format: true-false
    question: "Un bloc `finally` d'un générateur s'exécute si on appelle `close()` pendant qu'il est suspendu dans le `try`."
    truth: true
    answer: "`close()` lève `GeneratorExit` au `yield` : l'exception traverse le `try`, et le `finally` s'exécute."
  - key: vf-throw-chez-l-appelant
    format: true-false
    question: "`gen.throw(ValueError)` lève l'exception dans le code appelant, sans toucher au générateur."
    truth: false
    answer: |-
      L'exception est levée **dans** le générateur, à l'endroit du `yield` où il est suspendu. S'il la rattrape, il
      continue, et `throw` renvoie la valeur du `yield` suivant ; sinon, elle remonte chez l'appelant.
  - key: qcm-valeur-apres-next
    format: multiple-choice
    question: "Dans `x = yield 10`, que vaut `x` quand le générateur est repris par `next(gen)` ?"
    choices:
      - {text: "`None`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "La valeur du `yield` suivant", correct: false}
      - {text: "`0`", correct: false}
    answer: "`next` n'envoie rien : le `yield` vaut `None`. `10` est la valeur produite, pas celle reçue."
  - key: qcm-exception-du-close
    format: multiple-choice
    question: "Quelle exception un générateur reçoit-il à son `yield` quand on appelle `close()` ?"
    choices:
      - {text: "`GeneratorExit`", correct: true}
      - {text: "`StopIteration`", correct: false}
      - {text: "`KeyboardInterrupt`", correct: false}
      - {text: "`SystemExit`", correct: false}
    answer: |-
      `GeneratorExit` hérite de `BaseException`, pas d'`Exception` : un `except Exception` ne l'avale pas par erreur.
  - key: qcm-generatorexit-ignoree
    format: multiple-choice
    question: "Que se passe-t-il si un générateur rattrape `GeneratorExit` et produit encore une valeur ?"
    choices:
      - {text: "`close()` lève une `RuntimeError`", correct: true}
      - {text: "La valeur est renvoyée par `close()`", correct: false}
      - {text: "Le générateur repart du début", correct: false}
      - {text: "Rien : `close()` ignore la valeur", correct: false}
    answer: |-
      Le message est « generator ignored GeneratorExit ». Un générateur peut faire son ménage en rattrapant
      l'exception, mais il doit ensuite se terminer, ou la relancer.
  - key: qcm-moyenne-au-fil-de-l-eau
    format: multiple-choice
    question: "À quoi sert `send` dans un générateur qui calcule une moyenne au fil de l'eau ?"
    choices:
      - {text: "À lui fournir chaque mesure, et recevoir la moyenne à jour", correct: true}
      - {text: "À lire la moyenne sans lui fournir de nouvelle mesure", correct: false}
      - {text: "À remettre la moyenne à zéro entre deux séries de mesures", correct: false}
      - {text: "À arrêter le calcul quand la moyenne se stabilise", correct: false}
    answer: |-
      `moy = gen.send(mesure)` : la mesure arrive au `yield`, le générateur met à jour son total, et produit la
      nouvelle moyenne. Son état (total, nombre) reste dans le générateur.
  - key: code-moyenne-send
    format: code-output
    question: |-
      ```python
      def moyenne():
          total, n, moy = 0, 0, None
          while True:
              x = yield moy
              total += x
              n += 1
              moy = total / n


      m = moyenne()
      next(m)
      m.send(10)
      print(m.send(20), m.send(60))
      ```
    answer: "`15.0 30.0` : après 10 et 20, la moyenne vaut 15.0 ; après 60, (10 + 20 + 60) / 3 = 30.0."
    check:
      output: "15.0 30.0"
    choices:
      - {text: "`15.0 30.0`", correct: true}
      - {text: "`20 60`", correct: false}
      - {text: "`10.0 15.0`", correct: false}
      - {text: "`15.0 40.0`", correct: false}
  - key: code-echo
    format: code-output
    question: |-
      ```python
      def echo():
          while True:
              recu = yield
              print("reçu", recu)


      e = echo()
      next(e)
      e.send("a")
      e.send("b")
      ```
    answer: "Le `next` amorce sans rien afficher ; chaque `send` fait valoir sa valeur au `yield`, qui est affichée."
    check:
      output: |-
        reçu a
        reçu b
    choices:
      - text: |-
          ```
          reçu a
          reçu b
          ```
        correct: true
      - text: |-
          ```
          reçu None
          reçu a
          reçu b
          ```
        correct: false
      - text: |-
          ```
          reçu None
          reçu a
          ```
        correct: false
      - {text: "Rien", correct: false}
  - key: code-close-et-finally
    format: code-output
    question: |-
      ```python
      def g():
          try:
              yield 1
              yield 2
          finally:
              print("nettoyage")


      gen = g()
      print(next(gen))
      gen.close()
      print("fermé")
      ```
    answer: "`close()` lève `GeneratorExit` au premier `yield` : le `finally` s'exécute, et le 2 n'est jamais produit."
    check:
      output: |-
        1
        nettoyage
        fermé
    choices:
      - text: |-
          ```
          1
          nettoyage
          fermé
          ```
        correct: true
      - text: |-
          ```
          1
          fermé
          ```
        correct: false
      - text: |-
          ```
          1
          2
          nettoyage
          fermé
          ```
        correct: false
      - text: |-
          ```
          1
          fermé
          nettoyage
          ```
        correct: false
  - key: code-send-sans-amorcer
    format: code-output
    question: |-
      ```python
      def g():
          x = yield
          yield x


      gen = g()
      print(gen.send(5))
      ```
    answer: |-
      Le générateur n'a pas démarré : aucun `yield` ne peut recevoir 5. Python lève une `TypeError`, « can't send
      non-None value to a just-started generator ».
    check:
      output: ""
      throws: TypeError
    choices:
      - {text: "Une `TypeError`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`None`", correct: false}
      - {text: "Une `StopIteration`", correct: false}
