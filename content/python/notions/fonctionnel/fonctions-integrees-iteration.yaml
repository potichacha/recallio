notion: fonctions-integrees-iteration
lesson: |-
  Python fournit des **fonctions intégrées** qui parcourent n'importe quel itérable : liste, tuple, chaîne,
  dictionnaire, générateur... Elles remplacent bien des boucles écrites à la main.

  | Fonction | Renvoie | Sur un itérable vide |
  |---|---|---|
  | `any(it)` | `True` si au moins un élément est vrai | `False` |
  | `all(it)` | `True` si tous les éléments sont vrais | `True` |
  | `sum(it, start=0)` | la somme, à partir de `start` | `start`, donc `0` |
  | `min(it)`, `max(it)` | le plus petit, le plus grand | une `ValueError`, sauf avec `default=` |
  | `map(f, it)` | un itérateur des `f(x)` | un itérateur vide |
  | `filter(f, it)` | un itérateur des `x` pour lesquels `f(x)` est vrai | un itérateur vide |
  | `reversed(seq)` | un itérateur, de la fin vers le début | un itérateur vide |

  ```python
  notes = [12, 8, 17, 15]
  sum(notes)                                # 52
  min(notes), max(notes)                    # (8, 17)
  any(n < 10 for n in notes)                # True : il y a un 8
  all(n >= 8 for n in notes)                # True
  max(["kiwi", "banane"], key=len)          # 'banane' : key donne le critère
  min([], default=None)                     # None au lieu d'une ValueError
  list(map(str.upper, ["a", "b"]))          # ['A', 'B']
  list(filter(lambda n: n >= 12, notes))    # [12, 17, 15]
  list(reversed(notes))                     # [15, 17, 8, 12]
  ```

  À retenir :

  - `any` et `all` **s'arrêtent dès que la réponse est connue** : `any` au premier élément vrai, `all` au premier
    faux. Avec une expression génératrice, `any(est_valide(x) for x in xs)` ne calcule que le nécessaire.
  - `min` et `max` acceptent aussi plusieurs arguments : `max(a, b, c)`. Leurs options `key=` et `default=` se
    passent par leur nom.
  - `map` et `filter` renvoient des **itérateurs paresseux** : rien n'est calculé avant le parcours, et on ne les
    parcourt qu'une fois. `list(...)` en fait une liste. `filter(None, xs)` garde les éléments vrais.
  - `sum` refuse les chaînes : on assemble des chaînes avec `"".join(mots)`.
  - `reversed` demande une **séquence** (liste, tuple, chaîne, `range`) : un générateur n'est pas réversible.
  - Une compréhension est souvent plus lisible qu'un `map` ou un `filter` avec une `lambda` :
    `[n * 2 for n in notes]` plutôt que `list(map(lambda n: n * 2, notes))`. `map` reste concis avec une fonction
    qui existe déjà : `map(int, morceaux)`.

  **En entretien** : « `any`, `all`, `sum`, `min` et `max` résument un itérable ; `any` et `all` s'arrêtent dès que la
  réponse est connue, et `min` ou `max` lèvent une `ValueError` sur un itérable vide, sauf avec `default`. `map` et
  `filter` renvoient des itérateurs paresseux, qu'on ne parcourt qu'une fois. Pour transformer ou filtrer, une
  compréhension est souvent plus lisible. »
tour:
  - title: Résumer une liste en une ligne
    text: |-
      Python a des fonctions intégrées qui parcourent tout un itérable à ta place :

      - `sum`, `min` et `max` résument des nombres ;
      - `any` et `all` répondent à « au moins un ? » et à « tous ? » ;
      - `map` applique une fonction à chaque élément, `filter` garde ceux qui passent un test ;
      - `reversed` parcourt une séquence à l'envers.

      `max(mots, key=len)` compare les mots par leur longueur. `map` et `filter` sont paresseux : `list(...)` les
      transforme en liste pour les afficher.

      Essaie : ajoute la note `5` à la liste, puis exécute. Quelles lignes changent ?
    example:
      files:
        main.py: |-
          notes = [12, 8, 17, 15]
          mots = ["kiwi", "banane", "figue"]

          print("somme :", sum(notes))
          print("min et max :", min(notes), max(notes))
          print("une note sous 10 ?", any(n < 10 for n in notes))
          print("toutes au moins 8 ?", all(n >= 8 for n in notes))
          print("le plus long :", max(mots, key=len))
          print("en majuscules :", list(map(str.upper, mots)))
          print("12 et plus :", list(filter(lambda n: n >= 12, notes)))
          print("à l'envers :", list(reversed(notes)))
      output: |-
        somme : 52
        min et max : 8 17
        une note sous 10 ? True
        toutes au moins 8 ? True
        le plus long : banane
        en majuscules : ['KIWI', 'BANANE', 'FIGUE']
        12 et plus : [12, 17, 15]
        à l'envers : [15, 17, 8, 12]
    task:
      instructions: |-
        Calcule la moyenne des notes avec `sum` et `len` : le programme doit afficher `moyenne : 13.0`.
      starter:
        main.py: |-
          notes = [12, 8, 17, 15]

          moyenne = 0
          print("moyenne :", moyenne)
      solution:
        main.py: |-
          notes = [12, 8, 17, 15]

          moyenne = sum(notes) / len(notes)
          print("moyenne :", moyenne)
      output: |-
        moyenne : 13.0
cards:
  - key: any-all-vide
    format: course
    question: "Que renvoient `any([])` et `all([])` ?"
    choices:
      - {text: "`False` pour `any`, `True` pour `all`", correct: true}
      - {text: "`True` pour `any`, `False` pour `all`", correct: false}
      - {text: "`False` pour les deux", correct: false}
      - {text: "`True` pour les deux", correct: false}
    answer: |-
      `any` cherche un élément vrai et n'en trouve aucun : `False`. `all` cherche un élément faux et n'en trouve aucun :
      `True`. C'est la convention des mathématiques : une propriété vaut pour tous les éléments d'un ensemble vide.
  - key: map-renvoie
    format: course
    question: "Que renvoie `map(str.upper, mots)` en Python 3 ?"
    choices:
      - {text: "Un itérateur, qui calcule chaque valeur quand on la demande", correct: true}
      - {text: "Une liste des mots en majuscules, calculée tout de suite", correct: false}
      - {text: "Un tuple des mots en majuscules, qu'on ne peut plus modifier", correct: false}
      - {text: "La liste `mots` elle-même, dont chaque chaîne est modifiée", correct: false}
    answer: |-
      `map` est paresseux : rien n'est calculé avant le parcours, et l'objet `map` ne se parcourt qu'une fois.
      `list(map(...))` donne une liste. En Python 2, `map` renvoyait directement une liste.
  - key: sum-refuse-chaines
    format: course
    question: 'Pourquoi `sum(["a", "b"], "")` lève-t-il une `TypeError` ?'
    choices:
      - {text: "`sum` refuse exprès les chaînes, et conseille `str.join`", correct: true}
      - {text: "Les chaînes ne savent pas s'additionner avec l'opérateur `+`", correct: false}
      - {text: "Le second argument de `sum` doit toujours être un entier", correct: false}
      - {text: "`sum` ne parcourt que des listes, pas des chaînes", correct: false}
    answer: |-
      Additionner des chaînes une à une recopie le résultat à chaque étape : un coût quadratique. Python refuse donc les
      chaînes dans `sum`, et son message conseille `''.join(seq)`, qui assemble tout en une seule passe.
  - key: max-le-plus-long
    format: course
    question: "Comment obtenir le mot le plus long de la liste `mots` ?"
    choices:
      - {text: "`max(mots, key=len)`", correct: true}
      - {text: "`max(len(mots))`", correct: false}
      - {text: "`len(max(mots))`", correct: false}
      - {text: "`max(mots, len)`", correct: false}
    answer: |-
      `key` donne le critère de comparaison : `max` compare les `len(m)`, mais renvoie le mot. `max(mots)` seul
      comparerait les mots dans l'ordre alphabétique, et `max(mots, len)` comparerait la liste à la fonction `len`.
  - key: vf-any-court-circuit
    format: true-false
    question: "`any` s'arrête dès qu'il rencontre un élément vrai."
    truth: true
    answer: |-
      Le reste de l'itérable n'est pas parcouru ; avec une expression génératrice, les éléments suivants ne sont même pas
      calculés. `all` s'arrête de même au premier élément faux.
  - key: vf-filter-none
    format: true-false
    question: "`filter(None, valeurs)` garde les éléments dont la valeur de vérité est vraie."
    truth: true
    answer: "Sans fonction, `filter` teste les éléments eux-mêmes : `0`, `''`, `None` et les collections vides disparaissent."
  - key: vf-reversed-generateur
    format: true-false
    question: "`reversed` accepte n'importe quel itérable, un générateur compris."
    truth: false
    answer: |-
      `reversed` demande une séquence (avec `__len__` et `__getitem__`) ou un objet qui définit `__reversed__`. Sur un
      générateur, c'est une `TypeError` : on passe d'abord par `list(...)`.
  - key: vf-max-vide
    format: true-false
    question: "`max([])` renvoie `None`."
    truth: false
    answer: "Il lève une `ValueError`. `max([], default=None)` renvoie `None` à la place."
  - key: qcm-toutes-au-dessus
    format: multiple-choice
    question: "Quelle expression vérifie que toutes les notes de `notes` dépassent 10 ?"
    choices:
      - {text: "`all(n > 10 for n in notes)`", correct: true}
      - {text: "`any(n > 10 for n in notes)`", correct: false}
      - {text: "`all(notes) > 10`", correct: false}
      - {text: "`max(notes) > 10`", correct: false}
    answer: |-
      `all` vaut `True` si chaque test est vrai ; `any` se contente d'un seul. `all(notes)` donne un booléen, comparé
      ensuite à 10, et `max(notes) > 10` dit seulement qu'une note au moins dépasse 10.
  - key: qcm-max-default
    format: multiple-choice
    question: "Que renvoie `max([], default=0)` ?"
    choices:
      - {text: "`0`", correct: true}
      - {text: "`None`", correct: false}
      - {text: "Une `ValueError`", correct: false}
      - {text: "`[]`", correct: false}
    answer: "`default` est la valeur renvoyée quand l'itérable est vide ; sans lui, `max` lève une `ValueError`."
  - key: qcm-filter-pairs
    format: multiple-choice
    question: "Quelle écriture garde seulement les nombres pairs de `xs` ?"
    choices:
      - {text: "`list(filter(lambda x: x % 2 == 0, xs))`", correct: true}
      - {text: "`list(map(lambda x: x % 2 == 0, xs))`", correct: false}
      - {text: "`list(filter(xs, lambda x: x % 2 == 0))`", correct: false}
      - {text: "`filter(lambda x: x % 2 == 0, xs)[:]`", correct: false}
    answer: |-
      `filter(fonction, itérable)` garde les éléments pour lesquels la fonction est vraie. `map` donnerait des booléens,
      les arguments inversés lèvent une `TypeError`, et un objet `filter` ne se découpe pas. La compréhension
      `[x for x in xs if x % 2 == 0]` dit la même chose, plus lisiblement.
  - key: qcm-reversed-sans-copie
    format: multiple-choice
    question: "Quelle écriture parcourt la liste `xs` de la fin vers le début, sans la copier ni la modifier ?"
    choices:
      - {text: "`reversed(xs)`", correct: true}
      - {text: "`xs.reverse()`", correct: false}
      - {text: "`xs[::-1]`", correct: false}
      - {text: "`sorted(xs, reverse=True)`", correct: false}
    answer: |-
      `reversed` renvoie un itérateur qui lit la liste à l'envers. `xs.reverse()` retourne la liste sur place (et renvoie
      `None`), `xs[::-1]` en fait une copie, et `sorted(xs, reverse=True)` la trie.
  - key: trous-any-prefixe
    format: fill-in
    question: |-
      Complète pour savoir si au moins un mot de `mots` commence par « py » :
      ```python
      trouve = ___(m.startswith("py") for m in mots)
      ```
    blanks:
      - - any
    answer: "`any` vaut `True` dès qu'un test est vrai, et s'arrête là."
  - key: trous-sum-commande
    format: fill-in
    question: |-
      Complète pour calculer le total d'une commande, dont chaque ligne est un couple (prix, quantité) :
      ```python
      total = ___(prix * quantite for prix, quantite in lignes)
      ```
    blanks:
      - - sum
    answer: "`sum` additionne les valeurs produites par l'expression génératrice, sans construire de liste."
  - key: trous-min-key-default
    format: fill-in
    question: |-
      Complète pour obtenir le mot le plus court, ou `None` si la liste est vide :
      ```python
      court = min(mots, ___=len, ___=None)
      ```
    blanks:
      - - key
      - - default
    answer: "`key` donne le critère de comparaison, `default` la valeur à renvoyer quand il n'y a aucun élément."
  - key: trous-map-int
    format: fill-in
    question: |-
      Complète pour convertir chaque morceau en entier :
      ```python
      morceaux = "3 14 15".split()
      nombres = list(___(int, morceaux))
      ```
    blanks:
      - - map
    answer: "`map(int, morceaux)` appelle `int` sur chaque morceau ; `list` en fait une liste : `[3, 14, 15]`."
  - key: code-any-all
    format: code-output
    question: |-
      ```python
      print(any([0, "", None]), all([1, "a", [0]]))
      ```
    answer: |-
      `0`, `""` et `None` sont faux : `any` vaut `False`. `[0]` est une liste non vide, donc vraie, même si elle contient
      un zéro : `all` vaut `True`.
    check:
      output: "False True"
    choices:
      - {text: "`False True`", correct: true}
      - {text: "`False False`", correct: false}
      - {text: "`True True`", correct: false}
      - {text: "`None True`", correct: false}
  - key: code-sum-depart
    format: code-output
    question: |-
      ```python
      print(sum([1, 2, 3], 10))
      ```
    answer: "`16` : le second argument est la valeur de départ, 10 + 1 + 2 + 3."
    check:
      output: "16"
    choices:
      - {text: "`16`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`60`", correct: false}
      - {text: "`[1, 2, 3, 10]`", correct: false}
  - key: code-filter-none
    format: code-output
    question: |-
      ```python
      print(list(filter(None, [0, 1, "", "a", [], [2]])))
      ```
    answer: "`[1, 'a', [2]]` : sans fonction, `filter` garde les éléments vrais ; `0`, `''` et `[]` sont faux."
    check:
      output: "[1, 'a', [2]]"
    choices:
      - {text: "`[1, 'a', [2]]`", correct: true}
      - {text: "`[0, '', []]`", correct: false}
      - {text: "`[1, 'a', [], [2]]`", correct: false}
      - {text: "`[0, 1, '', 'a', [], [2]]`", correct: false}
  - key: code-max-key-min-chaine
    format: code-output
    question: |-
      ```python
      print(max(["poire", "kiwi", "banane"], key=len), min("python"))
      ```
    answer: |-
      `banane h` : `key=len` compare les longueurs, et « banane » a six lettres. Une chaîne est un itérable de
      caractères : `min` renvoie le plus petit dans l'ordre des codes, « h ».
    check:
      output: "banane h"
    choices:
      - {text: "`banane h`", correct: true}
      - {text: "`poire h`", correct: false}
      - {text: "`banane p`", correct: false}
      - {text: "`kiwi y`", correct: false}
  - key: bug-sum-chaines
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: sum() can't sum strings [use ''.join(seq) instead] » :
      ```python
      mots = ["un", "deux", "trois"]
      phrase = sum(mots, "")
      print(phrase)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: 'Écrire `phrase = "".join(mots)`', correct: true}
      - {text: "Écrire `phrase = sum(mots)`, sans second argument", correct: false}
      - {text: 'Écrire `phrase = str(sum(mots, ""))`', correct: false}
      - {text: 'Écrire `phrase = sum(list(mots), "")`', correct: false}
    answer: |-
      ```python
      phrase = "".join(mots)
      ```
      `sum` refuse les chaînes, car les additionner une à une recopie le résultat à chaque étape ; `str.join` assemble
      tout en une passe. Sans second argument, `sum` partirait de `0`, et `0 + "un"` lève aussi une `TypeError`.
  - key: bug-map-indice
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: 'map' object is not subscriptable » :
      ```python
      carres = map(lambda x: x * x, [1, 2, 3])
      print(carres[0])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Construire une liste, `list(map(...))`, puis l'indexer", correct: true}
      - {text: "Lire le premier carré avec `carres.get(0)`, comme un dict", correct: false}
      - {text: "Remplacer `map` par `filter`, dont le résultat s'indexe", correct: false}
      - {text: "Écrire `carres(0)` : un objet `map` s'appelle", correct: false}
    answer: |-
      ```python
      carres = [x * x for x in [1, 2, 3]]
      print(carres[0])
      ```
      `map` renvoie un itérateur paresseux : il se parcourt, mais ne s'indexe pas. Une liste, ici construite par une
      compréhension, se lit par indice.
  - key: bug-max-vide
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « ValueError: max() iterable argument is empty » :
      ```python
      def meilleure_note(notes):
          return max(notes)


      print(meilleure_note([]))
      ```
      La fonction doit renvoyer `None` quand il n'y a aucune note. Quelle correction est la bonne ?
    choices:
      - {text: "`return max(notes, default=None)`", correct: true}
      - {text: "`return max(notes) or None`", correct: false}
      - {text: "`return max(notes, None)`", correct: false}
      - {text: "`return max([notes])`", correct: false}
    answer: |-
      ```python
      def meilleure_note(notes):
          return max(notes, default=None)
      ```
      `default` donne la valeur à renvoyer pour un itérable vide. `max(notes) or None` lève la même erreur avant
      d'arriver au `or`, et `max(notes, None)` compare la liste à `None`.
  - key: bug-reversed-generateur
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: 'generator' object is not reversible » :
      ```python
      pairs = (n for n in range(10) if n % 2 == 0)
      for n in reversed(pairs):
          print(n)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Passer une liste à `reversed` : `reversed(list(pairs))`", correct: true}
      - {text: "Appeler `pairs.reverse()` juste avant la boucle", correct: false}
      - {text: "Écrire `reversed(iter(pairs))` pour obtenir un itérateur", correct: false}
      - {text: "Remplacer `reversed(pairs)` par `sorted(pairs)`", correct: false}
    answer: |-
      ```python
      for n in reversed(list(pairs)):
          print(n)
      ```
      `reversed` lit une séquence par la fin : il lui faut sa longueur et l'accès par indice, qu'un générateur n'a pas.
      Ici, `range(8, -1, -2)` donnerait aussi les nombres pairs à l'envers, sans liste.
