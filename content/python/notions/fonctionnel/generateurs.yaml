notion: generateurs
lesson: |-
  Une **fonction génératrice** contient au moins un `yield`. L'appeler n'exécute rien : elle renvoie un
  **générateur**, un itérateur dont chaque `next()` exécute le corps jusqu'au `yield` suivant.

  ```python
  def compte_a_rebours(n):
      print("départ")
      while n > 0:
          yield n          # produit n, et se suspend ici
          n -= 1
      print("fin")


  g = compte_a_rebours(3)   # rien ne s'affiche encore
  next(g)                   # affiche « départ », renvoie 3
  next(g)                   # 2 : reprend juste après le yield
  list(g)                   # [1], et affiche « fin »
  ```

  - Entre deux `next()`, le générateur **garde son état** : ses variables locales, et l'endroit où il s'est arrêté.
  - Quand la fonction se termine (fin du corps ou `return`), le générateur lève `StopIteration`. La valeur d'un
    `return valeur` devient l'attribut `value` de cette exception (c'est ce que récupère `yield from`).
  - Un générateur est un itérateur : il se parcourt avec `for`, `list`, `sum`... **une seule fois**, et n'a ni `len`
    ni indice.

  **L'évaluation paresseuse** : un générateur calcule chaque valeur au moment où on la demande. D'où trois usages :

  | Usage | Exemple |
  |---|---|
  | Des données plus grosses que la mémoire | lire un fichier ligne par ligne, en filtrant au passage |
  | Une suite infinie | `while True: yield ...`, qu'on arrête avec `islice` ou `break` |
  | Un pipeline | `lignes(f)`, puis `utiles(...)`, puis `en_nombres(...)` : un seul élément à la fois en mémoire |

  ```python
  def lignes_utiles(lignes):
      for ligne in lignes:
          ligne = ligne.strip()
          if ligne and not ligne.startswith("#"):
              yield ligne
  ```

  Une fonction génératrice est aussi la façon la plus simple de rendre une classe itérable : un `__iter__` qui
  contient un `yield` crée un nouveau générateur à chaque parcours.

  **En entretien** : « Une fonction qui contient `yield` renvoie un générateur : son corps s'exécute par morceaux, à
  chaque `next()`, en gardant son état entre deux appels. Il produit les valeurs à la demande, d'où une mémoire
  constante, des suites infinies et des pipelines. C'est un itérateur : il ne se parcourt qu'une fois. »
cards:
  - key: appeler-une-generatrice
    format: course
    question: "Que se passe-t-il quand on appelle une fonction qui contient `yield` ?"
    choices:
      - {text: "Elle renvoie un générateur, sans exécuter son corps", correct: true}
      - {text: "Elle exécute son corps jusqu'au premier `yield`, et renvoie sa valeur", correct: false}
      - {text: "Elle exécute tout son corps, et renvoie la liste des valeurs", correct: false}
      - {text: "Elle lève une erreur si on ne l'appelle pas dans un `for`", correct: false}
    answer: |-
      Le corps ne démarre qu'au premier `next()` : il s'exécute alors jusqu'au premier `yield`, et se suspend. Un
      `print` au début de la fonction ne s'affiche donc pas à l'appel.
  - key: pourquoi-moins-de-memoire
    format: course
    question: "Pourquoi un générateur économise-t-il la mémoire ?"
    choices:
      - {text: "Il produit une valeur à la fois, au moment où on la demande", correct: true}
      - {text: "Il compresse les valeurs qu'il garde en mémoire", correct: false}
      - {text: "Il range ses valeurs sur le disque plutôt qu'en mémoire", correct: false}
      - {text: "Il partage ses valeurs avec les autres générateurs", correct: false}
    answer: |-
      Une liste de dix millions d'éléments les garde tous ; un générateur n'en calcule qu'un, le donne, puis calcule le
      suivant. Sa taille ne dépend pas du nombre de valeurs produites.
  - key: etat-entre-deux-next
    format: course
    question: "Que devient l'état local d'un générateur entre deux `next()` ?"
    choices:
      - {text: "Il est conservé : le générateur reprend juste après le `yield`", correct: true}
      - {text: "Il est perdu : les variables repartent de leurs valeurs initiales", correct: false}
      - {text: "Il est conservé, mais le générateur reprend au début du corps", correct: false}
      - {text: "Il est copié dans des variables globales jusqu'au prochain appel", correct: false}
    answer: |-
      Le générateur garde son cadre d'exécution : variables locales, position dans le code, boucles en cours. C'est ce
      qui lui permet de produire une suite sans tout recalculer.
  - key: return-dans-generateur
    format: course
    question: "Que fait `return` dans une fonction génératrice ?"
    choices:
      - {text: "Il termine le générateur : le `next` en cours lève `StopIteration`", correct: true}
      - {text: "Il produit une dernière valeur, comme le ferait un `yield`", correct: false}
      - {text: "Il est interdit : une génératrice ne peut pas contenir `return`", correct: false}
      - {text: "Il remet le générateur au début, prêt pour un nouveau parcours", correct: false}
    answer: |-
      `return` arrête le générateur. Une valeur éventuelle (`return 42`) n'est pas produite : elle devient l'attribut
      `value` de la `StopIteration`, que `yield from` sait récupérer.
  - key: vf-generateur-iterateur
    format: true-false
    question: "Un générateur est un itérateur."
    truth: true
    answer: "Il a `__iter__` (qui renvoie `self`) et `__next__` : il se parcourt avec `for` ou `next`, une seule fois."
  - key: vf-corps-execute-a-l-appel
    format: true-false
    question: "Le corps d'une fonction génératrice s'exécute dès qu'on l'appelle."
    truth: false
    answer: "L'appel crée seulement le générateur ; le corps démarre au premier `next()`."
  - key: vf-suite-infinie
    format: true-false
    question: "Un générateur peut produire une suite infinie de valeurs."
    truth: true
    answer: |-
      Une boucle `while True` avec un `yield` ne produit que ce qu'on lui demande. On s'arrête avec `break`, `islice` ou
      `next` : surtout pas avec `list()`, qui ne finirait jamais.
  - key: vf-len-generateur
    format: true-false
    question: "`len()` fonctionne sur un générateur."
    truth: false
    answer: |-
      Un générateur ne sait pas combien de valeurs il produira : `len` lève une `TypeError`. Pour compter, on le parcourt,
      par exemple avec `sum(1 for _ in gen)`.
  - key: qcm-laquelle-generatrice
    format: multiple-choice
    question: "Laquelle de ces fonctions est une fonction génératrice ?"
    choices:
      - {text: "`def f(): yield 1`", correct: true}
      - {text: "`def f(): return [1]`", correct: false}
      - {text: "`def f(): return (1,)`", correct: false}
      - {text: "`f = lambda: [1]`", correct: false}
    answer: "La seule présence de `yield` dans le corps fait d'une fonction une fonction génératrice."
  - key: qcm-tout-dans-une-liste
    format: multiple-choice
    question: "Comment récupérer toutes les valeurs d'un générateur fini `gen` dans une liste ?"
    choices:
      - {text: "`list(gen)`", correct: true}
      - {text: "`gen.to_list()`", correct: false}
      - {text: "`gen[:]`", correct: false}
      - {text: "`[gen]`", correct: false}
    answer: |-
      `list` parcourt le générateur jusqu'au bout. `gen[:]` lève une `TypeError` (un générateur ne se découpe pas), et
      `[gen]` est une liste qui contient le générateur lui-même.
  - key: qcm-fichier-enorme
    format: multiple-choice
    question: "Quel est l'avantage d'un générateur pour traiter un fichier de 10 Go ligne par ligne ?"
    choices:
      - {text: "Une seule ligne en mémoire à la fois", correct: true}
      - {text: "Le fichier est lu en parallèle, plus vite", correct: false}
      - {text: "Les lignes sont triées à la lecture", correct: false}
      - {text: "Le fichier est compressé en mémoire", correct: false}
    answer: |-
      Le générateur lit, transforme et donne une ligne, puis passe à la suivante : la mémoire utilisée ne dépend pas de
      la taille du fichier.
  - key: qcm-code-apres-dernier-yield
    format: multiple-choice
    question: "Quand s'exécute le code qui suit le dernier `yield` d'un générateur ?"
    choices:
      - {text: "Au `next()` suivant, juste avant que `StopIteration` soit levée", correct: true}
      - {text: "Jamais : le code après le dernier `yield` est ignoré", correct: false}
      - {text: "Dès l'appel de la fonction génératrice, avant tout `next()`", correct: false}
      - {text: "Quand le ramasse-miettes détruit le générateur", correct: false}
    answer: |-
      Après le dernier `yield`, le générateur est suspendu. Le `next()` suivant exécute la fin du corps, puis lève
      `StopIteration`. Une boucle `for` fait ce dernier `next()` : le code de fin s'exécute donc bien.
  - key: trous-yield-carres
    format: fill-in
    question: |-
      Complète la fonction génératrice qui produit les carrés de 0 à n - 1 :
      ```python
      def carres(n):
          for i in range(n):
              ___ i * i
      ```
    blanks:
      - - yield
    answer: "`yield` produit une valeur et suspend la fonction jusqu'au `next()` suivant."
  - key: trous-premiere-valeur
    format: fill-in
    question: |-
      Complète pour obtenir la première valeur du générateur :
      ```python
      gen = carres(5)
      premier = ___(gen)
      ```
    blanks:
      - - next
    answer: "`next` exécute le corps jusqu'au premier `yield`, et renvoie la valeur produite."
  - key: trous-pairs-infinis
    format: fill-in
    question: |-
      Complète le générateur infini des entiers pairs :
      ```python
      def pairs():
          n = 0
          while ___:
              yield n
              n += 2
      ```
    blanks:
      - - "True"
    answer: "Une boucle infinie ne pose pas de problème dans un générateur : il ne calcule que ce qu'on lui demande."
  - key: trous-arret-ligne-vide
    format: fill-in
    question: |-
      Complète pour que le générateur s'arrête à la première ligne vide :
      ```python
      def avant_ligne_vide(lignes):
          for ligne in lignes:
              if not ligne:
                  ___
              yield ligne
      ```
    blanks:
      - - return
        - break
    answer: "`return` termine le générateur ; ici, `break` sort de la boucle et mène aussi à la fin de la fonction."
  - key: code-entrelacement
    format: code-output
    question: |-
      ```python
      def gen():
          print("a", end=" ")
          yield 1
          print("b", end=" ")
          yield 2
          print("c", end=" ")


      for x in gen():
          print(x, end=" ")
      print()
      ```
    answer: |-
      `a 1 b 2 c` : chaque tour de boucle reprend le corps jusqu'au `yield` suivant. Le dernier `next` exécute
      `print("c")`, puis lève `StopIteration`.
    check:
      output: "a 1 b 2 c"
    choices:
      - {text: "`a 1 b 2 c`", correct: true}
      - {text: "`a b c 1 2`", correct: false}
      - {text: "`1 2 a b c`", correct: false}
      - {text: "`a 1 b 2`", correct: false}
  - key: code-valeur-du-return
    format: code-output
    question: |-
      ```python
      def compte():
          yield 1
          return 99


      g = compte()
      next(g)
      try:
          next(g)
      except StopIteration as e:
          print(e.value)
      ```
    answer: "`99` : la valeur du `return` d'un générateur devient l'attribut `value` de la `StopIteration`."
    check:
      output: "99"
    choices:
      - {text: "`99`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`None`", correct: false}
      - {text: "Rien", correct: false}
  - key: code-cree-puis-demarre
    format: code-output
    question: |-
      ```python
      def f():
          print("début", end=" ")
          yield 1


      g = f()
      print("créé", end=" ")
      print(next(g))
      ```
    answer: "`créé début 1` : l'appel `f()` n'exécute rien ; le corps démarre au premier `next`."
    check:
      output: "créé début 1"
    choices:
      - {text: "`créé début 1`", correct: true}
      - {text: "`début créé 1`", correct: false}
      - {text: "`créé 1`", correct: false}
      - {text: "`début 1 créé`", correct: false}
  - key: code-fibonacci
    format: code-output
    question: |-
      ```python
      def fib():
          a, b = 0, 1
          while True:
              yield a
              a, b = b, a + b


      g = fib()
      print([next(g) for _ in range(7)])
      ```
    answer: "`[0, 1, 1, 2, 3, 5, 8]` : le générateur garde `a` et `b` entre deux `next`, et ne calcule que sept valeurs."
    check:
      output: "[0, 1, 1, 2, 3, 5, 8]"
    choices:
      - {text: "`[0, 1, 1, 2, 3, 5, 8]`", correct: true}
      - {text: "`[1, 1, 2, 3, 5, 8, 13]`", correct: false}
      - {text: "`[0, 1, 2, 3, 5, 8, 13]`", correct: false}
      - {text: "`[0, 0, 0, 0, 0, 0, 0]`", correct: false}
  - key: bug-return-au-lieu-de-yield
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: 'int' object is not iterable » :
      ```python
      def pairs(nombres):
          for n in nombres:
              if n % 2 == 0:
                  return n


      print(list(pairs([1, 2, 3, 4])))
      ```
      Il doit afficher `[2, 4]`. Quelle correction est la bonne ?
    choices:
      - {text: "Remplacer `return n` par `yield n`", correct: true}
      - {text: "Remplacer `list(...)` par `[...]` autour de l'appel", correct: false}
      - {text: "Écrire `return [n]` pour renvoyer une liste", correct: false}
      - {text: "Ajouter `return None` à la fin de la fonction", correct: false}
    answer: |-
      ```python
      def pairs(nombres):
          for n in nombres:
              if n % 2 == 0:
                  yield n
      ```
      `return` sort de la fonction au premier nombre pair : `pairs` renvoie l'entier `2`, que `list` ne sait pas
      parcourir. `yield` produit chaque nombre pair et continue la boucle.
  - key: bug-len-generateur
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: object of type 'generator' has no len() » :
      ```python
      def lignes_non_vides(lignes):
          for ligne in lignes:
              if ligne.strip():
                  yield ligne


      resultat = lignes_non_vides(["a", "", "b"])
      print(len(resultat))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Compter en parcourant : `sum(1 for _ in resultat)`", correct: true}
      - {text: "Appeler la méthode `resultat.__len__()` à la place", correct: false}
      - {text: "Écrire `len(resultat())`, avec des parenthèses", correct: false}
      - {text: "Remplacer `yield ligne` par `yield len(ligne)`", correct: false}
    answer: |-
      ```python
      print(sum(1 for _ in resultat))    # ou len(list(resultat)) si la liste sert ensuite
      ```
      Un générateur ne connaît pas d'avance le nombre de valeurs qu'il produira : il n'a pas de `len`. Il faut le
      parcourir pour compter.
  - key: bug-generateur-jamais-parcouru
    format: bug-fix
    question: |-
      Le journal reste vide :
      ```python
      def enregistrer(evenements, journal):
          for e in evenements:
              journal.append(e)
              yield e


      journal = []
      enregistrer(["a", "b"], journal)
      print(journal)
      ```
      Le programme affiche `[]`. Pourquoi ?
    choices:
      - {text: "L'appel crée un générateur, mais personne ne le parcourt", correct: true}
      - {text: "`journal` est copié à l'appel : la fonction modifie la copie", correct: false}
      - {text: "`yield` annule le `append` qui le précède dans la boucle", correct: false}
      - {text: "La liste `journal` est vidée à la fin du générateur", correct: false}
    answer: |-
      ```python
      def enregistrer(evenements, journal):
          for e in evenements:
              journal.append(e)


      enregistrer(["a", "b"], journal)
      ```
      Le `yield` fait de la fonction une génératrice : son corps ne s'exécute que si on la parcourt. Une fonction qui
      agit seulement par effet de bord ne doit pas contenir de `yield`.
  - key: bug-generatrice-non-appelee
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: 'function' object is not iterable » :
      ```python
      def carres(n):
          for i in range(n):
              yield i * i


      for c in carres:
          print(c)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler la fonction : `for c in carres(3):`", correct: true}
      - {text: "Écrire `for c in iter(carres):`", correct: false}
      - {text: "Écrire `for c in next(carres):`", correct: false}
      - {text: "Remplacer `yield` par `return` dans `carres`", correct: false}
    answer: |-
      ```python
      for c in carres(3):
          print(c)
      ```
      `carres` est la fonction génératrice ; c'est son appel, `carres(3)`, qui renvoie le générateur à parcourir.
