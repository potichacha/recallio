notion: closures
lesson: |-
  Une **fermeture** (closure) est une fonction interne qui utilise des variables de la fonction qui l'entoure, et qui
  les **garde** après le retour de celle-ci.

  ```python
  def compteur():
      n = 0
      def suivant():
          nonlocal n          # pour réaffecter n, pas seulement le lire
          n += 1
          return n
      return suivant


  c = compteur()
  c(), c(), c()               # (1, 2, 3) : n survit entre les appels
  compteur()()                # 1 : chaque appel de compteur crée un nouveau n
  ```

  - La fermeture capture la **variable**, pas sa valeur : elle lit la valeur au moment où elle s'exécute. Les
    variables capturées sont dans `f.__closure__`.
  - Lire une variable englobante ne demande rien ; la **réaffecter** demande `nonlocal`. Sans lui, `n += 1` fait de
    `n` une variable locale, et lève une `UnboundLocalError`. Modifier un objet mutable capturé (`liste.append(x)`)
    ne demande pas `nonlocal`.

  **La liaison tardive dans une boucle**, un piège classique d'entretien :

  ```python
  fonctions = [lambda: i for i in range(3)]
  [f() for f in fonctions]          # [2, 2, 2] : toutes lisent le même i, qui vaut 2 à la fin
  ```

  Les trois lambdas partagent la variable `i`, et la lisent quand on les appelle. Trois corrections :

  ```python
  [lambda i=i: i for i in range(3)]               # un paramètre par défaut, évalué à la création
  [functools.partial(afficher, i) for i in range(3)]   # partial fige l'argument


  def fabrique(i):                                # une fabrique : un nouveau i à chaque appel
      return lambda: i
  ```

  Fermeture ou classe ? Une fermeture convient à un état simple et à une seule opération : un compteur, un
  multiplicateur, une fonction de rappel. Dès qu'il y a plusieurs opérations sur le même état, une classe est plus
  lisible.

  **En entretien** : « Une fermeture est une fonction interne qui garde les variables de sa fonction englobante ;
  `nonlocal` permet de les réaffecter. Elle capture la variable, pas sa valeur : des lambdas créées dans une boucle
  voient toutes la dernière valeur. On fige la valeur avec un paramètre par défaut, `functools.partial` ou une
  fabrique. »
cards:
  - key: ce-que-garde-une-fermeture
    format: course
    question: "Que garde une fermeture de la fonction qui l'a créée ?"
    choices:
      - {text: "Les variables qu'elle utilise, même après le retour de cette fonction", correct: true}
      - {text: "Une copie de toutes les variables locales, figées à sa création", correct: false}
      - {text: "Uniquement les paramètres de la fonction englobante", correct: false}
      - {text: "Rien : elle relit les variables globales du module", correct: false}
    answer: |-
      Python garde en vie les variables utilisées par la fonction interne, dans des cellules visibles par
      `__closure__`. Ce ne sont pas des copies : si la variable change, la fermeture voit la nouvelle valeur.
  - key: pourquoi-trois-fois-deux
    format: course
    question: "Pourquoi `[lambda: i for i in range(3)]` donne-t-il trois fonctions qui renvoient toutes 2 ?"
    choices:
      - {text: "Elles lisent `i` quand on les appelle, et `i` vaut alors 2", correct: true}
      - {text: "Elles sont créées après la boucle, quand `i` vaut déjà 2", correct: false}
      - {text: "`range(3)` s'arrête à 2, valeur copiée dans chacune", correct: false}
      - {text: "Une lambda ne peut capturer que la dernière valeur d'une boucle", correct: false}
    answer: |-
      C'est la liaison tardive : chaque lambda capture la variable `i`, pas sa valeur du moment. Elles sont bien créées
      à chaque tour, mais toutes lisent le même `i`, qui vaut 2 à la fin de la boucle.
  - key: role-de-nonlocal
    format: course
    question: "À quoi sert `nonlocal` dans une fonction imbriquée ?"
    choices:
      - {text: "À réaffecter une variable de la fonction englobante", correct: true}
      - {text: "À lire une variable de la fonction englobante", correct: false}
      - {text: "À créer une variable globale depuis une fonction", correct: false}
      - {text: "À cacher les variables externes à la fonction interne", correct: false}
    answer: |-
      Lire une variable englobante ne demande rien. Mais une affectation (`n = ...`, `n += 1`) rend la variable
      locale, sauf si `nonlocal n` dit qu'elle appartient à la fonction englobante.
  - key: corriger-la-liaison-tardive
    format: course
    question: "Comment corriger la liaison tardive dans `[lambda: i for i in range(3)]` ?"
    choices:
      - {text: "Figer la valeur par un paramètre par défaut : `lambda i=i: i`", correct: true}
      - {text: "Copier la valeur dans la lambda : `lambda: copy.copy(i)`", correct: false}
      - {text: "Déclarer `nonlocal i` au début de chaque lambda", correct: false}
      - {text: "Parcourir `list(range(3))` au lieu de `range(3)`", correct: false}
    answer: |-
      Une valeur par défaut est évaluée une fois, à la création de la lambda : chaque fonction garde la valeur du tour.
      `copy.copy(i)` serait évalué à l'appel, trop tard ; `functools.partial` ou une fabrique marchent aussi.
  - key: vf-capture-la-variable
    format: true-false
    question: "Une fermeture capture la variable elle-même, pas sa valeur au moment de sa création."
    truth: true
    answer: "D'où la liaison tardive : la fermeture lit la valeur courante de la variable, à chaque appel."
  - key: vf-lire-sans-nonlocal
    format: true-false
    question: "Sans `nonlocal`, une fonction interne peut lire une variable de la fonction englobante."
    truth: true
    answer: "La règle LEGB trouve le nom dans la portée englobante. `nonlocal` n'est nécessaire que pour le réaffecter."
  - key: vf-incrementer-sans-nonlocal
    format: true-false
    question: "Sans `nonlocal`, `compte += 1` dans une fonction interne modifie le `compte` de la fonction englobante."
    truth: false
    answer: |-
      L'affectation fait de `compte` une variable locale à la fonction interne ; la lire avant de l'affecter lève une
      `UnboundLocalError`.
  - key: vf-capture-immuables
    format: true-false
    question: "Une fermeture ne peut capturer que des valeurs immuables."
    truth: false
    answer: |-
      Elle capture n'importe quelle variable. Une liste capturée peut même être modifiée (`historique.append(x)`) sans
      `nonlocal`, puisque le nom n'est pas réaffecté.
  - key: qcm-figer-sans-fermeture
    format: multiple-choice
    question: "Quel outil de la bibliothèque standard fige des arguments d'une fonction, sans écrire de fermeture ?"
    choices:
      - {text: "`functools.partial`", correct: true}
      - {text: "`functools.wraps`", correct: false}
      - {text: "`itertools.chain`", correct: false}
      - {text: "`operator.add`", correct: false}
    answer: |-
      `partial(f, 3)` renvoie un objet appelable qui appelle `f(3, ...)`. La valeur est figée à la création : pas de
      liaison tardive.
  - key: qcm-erreur-sans-nonlocal
    format: multiple-choice
    question: "Quelle exception lève une fonction interne qui fait `total += x` sans `nonlocal total` ?"
    choices:
      - {text: "`UnboundLocalError`", correct: true}
      - {text: "`SyntaxError`", correct: false}
      - {text: "`AttributeError`", correct: false}
      - {text: "`TypeError`", correct: false}
    answer: |-
      `total` est locale, puisqu'elle est affectée ; `total += x` la lit avant qu'elle ait une valeur. L'erreur n'arrive
      qu'à l'appel, pas à la définition.
  - key: qcm-condition-fermeture
    format: multiple-choice
    question: "Que faut-il pour qu'une fonction soit une fermeture ?"
    choices:
      - {text: "Être définie dans une autre fonction, et utiliser une de ses variables", correct: true}
      - {text: "Être définie avec `lambda`, dans n'importe quelle portée", correct: false}
      - {text: "Avoir au moins un paramètre avec une valeur par défaut", correct: false}
      - {text: "Être renvoyée par `return`, sans utiliser de variable", correct: false}
    answer: |-
      Une fonction interne qui n'utilise aucune variable englobante n'a rien à capturer : son `__closure__` vaut
      `None`. Le `return` n'est pas nécessaire : une fonction interne passée en rappel est aussi une fermeture.
  - key: qcm-liste-capturee
    format: multiple-choice
    question: "Une fonction interne fait `historique.append(x)` sur une liste de la fonction englobante. Faut-il `nonlocal historique` ?"
    choices:
      - {text: "Non : elle modifie la liste, sans réaffecter le nom", correct: true}
      - {text: "Oui : toute modification d'une variable englobante l'exige", correct: false}
      - {text: "Oui, sinon `append` lève une `UnboundLocalError`", correct: false}
      - {text: "Non, mais il faut `global historique` à la place", correct: false}
    answer: |-
      `nonlocal` ne concerne que l'affectation du nom. `historique.append(x)` lit le nom, puis modifie l'objet : aucune
      déclaration n'est nécessaire.
  - key: code-compteur-nonlocal
    format: code-output
    question: |-
      ```python
      def compteur():
          n = 0

          def suivant():
              nonlocal n
              n += 1
              return n

          return suivant


      c = compteur()
      c()
      c()
      print(c(), compteur()())
      ```
    answer: "`3 1` : `c` garde son propre `n` entre les appels ; `compteur()` crée un nouveau `n`, qui part de 0."
    check:
      output: "3 1"
    choices:
      - {text: "`3 1`", correct: true}
      - {text: "`3 4`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`3 3`", correct: false}
  - key: code-liaison-tardive
    format: code-output
    question: |-
      ```python
      fonctions = [lambda: i for i in range(3)]
      print([f() for f in fonctions])
      ```
    answer: "`[2, 2, 2]` : les trois lambdas lisent la même variable `i`, qui vaut 2 quand on les appelle."
    check:
      output: "[2, 2, 2]"
    choices:
      - {text: "`[2, 2, 2]`", correct: true}
      - {text: "`[0, 1, 2]`", correct: false}
      - {text: "`[3, 3, 3]`", correct: false}
      - {text: "`[0, 0, 0]`", correct: false}
  - key: code-parametre-par-defaut
    format: code-output
    question: |-
      ```python
      fonctions = [lambda i=i: i for i in range(3)]
      print([f() for f in fonctions])
      ```
    answer: "`[0, 1, 2]` : la valeur par défaut est évaluée à la création de chaque lambda, et fige la valeur du tour."
    check:
      output: "[0, 1, 2]"
    choices:
      - {text: "`[0, 1, 2]`", correct: true}
      - {text: "`[2, 2, 2]`", correct: false}
      - {text: "`[1, 2, 3]`", correct: false}
      - {text: "`[0, 0, 0]`", correct: false}
  - key: code-valeur-a-l-appel
    format: code-output
    question: |-
      ```python
      def exterieure():
          x = "avant"

          def interieure():
              return x

          x = "après"
          return interieure


      print(exterieure()())
      ```
    answer: "`après` : la fermeture lit `x` au moment de l'appel, après la réaffectation."
    check:
      output: "après"
    choices:
      - {text: "`après`", correct: true}
      - {text: "`avant`", correct: false}
      - {text: "`None`", correct: false}
      - {text: "`avant après`", correct: false}
  - key: bug-total-sans-nonlocal
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « UnboundLocalError: cannot access local variable 'total' where it is not associated
      with a value » :
      ```python
      def cumul():
          total = 0

          def ajouter(x):
              total += x
              return total

          return ajouter


      ajouter = cumul()
      print(ajouter(5))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter `nonlocal total` au début de `ajouter`", correct: true}
      - {text: "Ajouter `global total` au début de `ajouter`", correct: false}
      - {text: "Passer `total` en paramètre : `def ajouter(x, total)`", correct: false}
      - {text: "Écrire `total = total + x` au lieu de `total += x`", correct: false}
    answer: |-
      ```python
      def ajouter(x):
          nonlocal total
          total += x
          return total
      ```
      L'affectation rend `total` locale à `ajouter`. `nonlocal` la rattache à la variable de `cumul`. `global`
      chercherait une variable du module, qui n'existe pas.
  - key: bug-boutons-liaison-tardive
    format: bug-fix
    question: |-
      Le bouton « ok » affiche le mauvais nom :
      ```python
      boutons = {}
      for nom in ["ok", "annuler"]:
          boutons[nom] = lambda: print("clic sur", nom)

      boutons["ok"]()
      ```
      Le programme affiche `clic sur annuler`. Quelle correction est la bonne ?
    choices:
      - {text: "`lambda nom=nom: print(\"clic sur\", nom)`", correct: true}
      - {text: "`lambda: print(\"clic sur\", str(nom))`", correct: false}
      - {text: "`lambda: print(\"clic sur\", nom[:])`", correct: false}
      - {text: "`lambda: (nonlocal nom, print(\"clic sur\", nom))`", correct: false}
    answer: |-
      ```python
      for nom in ["ok", "annuler"]:
          boutons[nom] = lambda nom=nom: print("clic sur", nom)
      ```
      Les deux lambdas lisent la même variable `nom`, qui vaut « annuler » après la boucle. Le paramètre par défaut
      fige la valeur de chaque tour ; `str(nom)` ou `nom[:]` seraient évalués à l'appel, trop tard.
  - key: bug-multiplicateurs
    format: bug-fix
    question: |-
      Tous les multiplicateurs multiplient par 3 :
      ```python
      multiplicateurs = []
      for n in range(1, 4):
          def multiplier(x):
              return x * n
          multiplicateurs.append(multiplier)

      print([m(10) for m in multiplicateurs])
      ```
      Le programme affiche `[30, 30, 30]` au lieu de `[10, 20, 30]`. Quelle correction est la bonne ?
    choices:
      - {text: "Une fabrique `def fabrique(n): return lambda x: x * n`, appelée à chaque tour", correct: true}
      - {text: "Déplacer `def multiplier` avant la boucle, au niveau du module", correct: false}
      - {text: "Ajouter `nonlocal n` au début de la fonction `multiplier`", correct: false}
      - {text: "Remplacer `def multiplier` par `multiplier = lambda x: x * n`", correct: false}
    answer: |-
      ```python
      def fabrique(n):
          return lambda x: x * n


      multiplicateurs = [fabrique(n) for n in range(1, 4)]
      ```
      Chaque appel de `fabrique` crée une nouvelle variable `n`, que sa fonction capture. Une lambda dans la boucle
      aurait le même défaut que le `def`, et `nonlocal` n'a pas de sens au niveau du module.
  - key: bug-global-au-lieu-de-nonlocal
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « NameError: name 'n' is not defined » :
      ```python
      def creer_compteur():
          n = 0

          def incrementer():
              global n
              n += 1
              return n

          return incrementer


      compteur = creer_compteur()
      print(compteur())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Remplacer `global n` par `nonlocal n`", correct: true}
      - {text: "Supprimer la ligne `global n`, simplement", correct: false}
      - {text: "Déplacer `n = 0` dans la fonction `incrementer`", correct: false}
      - {text: "Écrire `global n` aussi dans `creer_compteur`", correct: false}
    answer: |-
      ```python
      def incrementer():
          nonlocal n
          n += 1
          return n
      ```
      `global n` cherche `n` dans le module, où il n'existe pas : la variable à modifier est celle de `creer_compteur`.
      Sans déclaration, ce serait une `UnboundLocalError` ; avec `n = 0` dans `incrementer`, le compteur repartirait de
      zéro à chaque appel.
  - key: situation-clics-dans-une-boucle
    format: scenario
    question: |-
      Ton collègue crée, dans une boucle, une fonction de rappel par bouton avec des lambdas qui utilisent la variable
      de boucle. Quel que soit le bouton cliqué, c'est le dernier qui répond. Que lui proposes-tu ?
    choices:
      - {text: "Figer la valeur à chaque tour : `lambda b=bouton: ...`, ou `functools.partial`", correct: true}
      - {text: "Déclarer `nonlocal bouton` dans chaque lambda créée par la boucle", correct: false}
      - {text: "Remplacer la boucle `for` par une boucle `while` avec un compteur", correct: false}
      - {text: "Appeler `copy.copy(bouton)` à l'intérieur de chaque lambda", correct: false}
    answer: |-
      Les lambdas lisent la variable de boucle à l'appel, quand elle vaut le dernier bouton. Un paramètre par défaut ou
      `partial` évaluent la valeur à la création. Une copie dans la lambda serait faite à l'appel, trop tard.
  - key: situation-compter-les-rappels
    format: scenario
    question: |-
      Tu dois compter combien de fois une fonction de rappel est appelée, sans variable globale. Que fais-tu ?
    choices:
      - {text: "Une fermeture qui garde le compteur, et le modifie avec `nonlocal`", correct: true}
      - {text: "Une variable du module, modifiée avec `global` dans le rappel", correct: false}
      - {text: "Un paramètre par défaut `compte=0`, incrémenté à chaque appel", correct: false}
      - {text: "Une variable locale au rappel, remise à jour à chaque appel", correct: false}
    answer: |-
      La fermeture garde son état sans rien exposer au module. Un paramètre par défaut entier ne marcherait pas :
      `compte += 1` réaffecte une variable locale, et la valeur par défaut reste 0.
  - key: situation-trop-de-nonlocal
    format: scenario
    question: |-
      En revue, tu lis une fermeture qui gère un compte bancaire : cinq fonctions internes renvoyées dans un
      dictionnaire, et trois variables partagées par `nonlocal`. Que proposes-tu ?
    choices:
      - {text: "Une classe : l'état et ses opérations y seront plus lisibles", correct: true}
      - {text: "Des variables globales, plus simples à lire qu'une fermeture", correct: false}
      - {text: "Un seul `nonlocal` qui regroupe les trois variables partagées", correct: false}
      - {text: "Une lambda par opération, pour raccourcir le code", correct: false}
    answer: |-
      Une fermeture convient à un état simple et une seule opération. Plusieurs opérations sur le même état, c'est
      exactement ce qu'est une classe : des attributs et des méthodes, que l'on peut tester et documenter.
  - key: situation-fabrique-de-validateurs
    format: scenario
    question: |-
      Tu dois créer des validateurs « longueur au moins n » pour plusieurs valeurs de n, et les passer à une
      bibliothèque qui attend une fonction à un argument. Comment l'écris-tu ?
    choices:
      - {text: "Une fonction qui reçoit `n`, et renvoie une fonction interne qui l'utilise", correct: true}
      - {text: "Une fonction écrite à la main pour chaque valeur de `n` nécessaire", correct: false}
      - {text: "Une seule fonction qui lit `n` dans une variable globale changée avant", correct: false}
      - {text: "Une fonction à deux paramètres, `(texte, n)`, passée telle quelle", correct: false}
    answer: |-
      `def longueur_min(n): return lambda texte: len(texte) >= n` : chaque appel crée un validateur qui garde son `n`.
      La bibliothèque appelle la fonction avec un seul argument : une fonction à deux paramètres échouerait.
