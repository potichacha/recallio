notion: iterables-iterateurs
lesson: |-
  Une boucle `for` ne parcourt pas « une liste » : elle suit le **protocole d'itération**, que tout objet peut
  implémenter.

  - Un **itérable** est un objet qu'on peut parcourir : `iter(x)` en tire un itérateur. Listes, tuples, chaînes,
    dictionnaires, ensembles, `range`, fichiers... sont itérables.
  - Un **itérateur** donne l'élément suivant à chaque `next(it)`, et lève `StopIteration` quand il n'en a plus. Il
    retient sa position : on ne le parcourt **qu'une fois**.

  ```python
  xs = [10, 20]
  it = iter(xs)        # appelle xs.__iter__()
  next(it)             # 10 : appelle it.__next__()
  next(it)             # 20
  next(it, "fin")      # 'fin' : la valeur par défaut évite l'exception
  next(it)             # StopIteration
  ```

  Ce que fait `for x in xs` :

  ```python
  it = iter(xs)
  while True:
      try:
          x = next(it)
      except StopIteration:
          break
      ...              # le corps de la boucle
  ```

  | | Itérable | Itérateur |
  |---|---|---|
  | Méthodes | `__iter__`, qui renvoie un itérateur | `__iter__`, qui renvoie `self`, et `__next__` |
  | Parcours | autant de fois qu'on veut | une seule fois |
  | Exemples | `list`, `str`, `dict`, `range` | `iter(liste)`, un fichier ouvert, `map`, `zip`, un générateur |

  Un itérateur est lui-même itérable : `iter(it) is it`. C'est ce qui permet de passer un générateur à `for`, à
  `list` ou à `sum`.

  Un itérateur écrit à la main :

  ```python
  class Rebours:
      def __init__(self, debut):
          self.n = debut

      def __iter__(self):
          return self

      def __next__(self):
          if self.n <= 0:
              raise StopIteration
          self.n -= 1
          return self.n + 1
  ```

  En pratique, on écrit plutôt `__iter__` comme une fonction génératrice (avec `yield`) : l'objet devient un itérable
  qu'on parcourt autant de fois qu'on veut. Deux formes à connaître aussi : un objet qui n'a que `__getitem__` (indices
  à partir de 0, `IndexError` à la fin) se parcourt encore avec `for` ; et `iter(fonction, sentinelle)` appelle la
  fonction jusqu'à ce qu'elle renvoie la sentinelle.

  **En entretien** : « Un itérable sait fournir un itérateur (`__iter__`) ; un itérateur donne l'élément suivant
  (`__next__`) et lève `StopIteration` à la fin. `for` appelle `iter`, puis `next` jusqu'à `StopIteration`. Une liste
  se parcourt autant de fois qu'on veut, un itérateur une seule fois. »
cards:
  - key: iterateur-ou-iterable
    format: course
    question: "Qu'est-ce qui distingue un itérateur d'un simple itérable ?"
    choices:
      - {text: "L'itérateur a une méthode `__next__`, et retient sa position", correct: true}
      - {text: "L'itérateur connaît sa longueur, et se lit par indice", correct: false}
      - {text: "L'itérateur contient une copie de tous les éléments", correct: false}
      - {text: "L'itérateur se parcourt autant de fois qu'on veut", correct: false}
    answer: |-
      Un itérable sait seulement fournir un itérateur (`__iter__`). L'itérateur donne les éléments un à un (`__next__`)
      et avance à chaque appel : une fois au bout, il est épuisé.
  - key: for-en-coulisses
    format: course
    question: "Que fait une boucle `for x in xs` en coulisses ?"
    choices:
      - {text: "Elle appelle `iter(xs)`, puis `next` jusqu'à `StopIteration`", correct: true}
      - {text: "Elle appelle `len(xs)`, puis lit `xs[0]` jusqu'à `xs[len - 1]`", correct: false}
      - {text: "Elle copie `xs` dans une liste, puis la lit par indice", correct: false}
      - {text: "Elle appelle `xs.__next__()` directement, sans `iter`", correct: false}
    answer: |-
      `for` demande un itérateur à l'objet, puis lui réclame l'élément suivant jusqu'à l'exception `StopIteration`, qu'il
      rattrape pour sortir de la boucle. C'est pourquoi `for` parcourt aussi un ensemble ou un générateur, qui n'ont pas
      d'indice.
  - key: signaler-la-fin
    format: course
    question: "Comment un itérateur signale-t-il qu'il n'a plus d'élément ?"
    choices:
      - {text: "Il lève l'exception `StopIteration`", correct: true}
      - {text: "Il renvoie `None` à chaque appel suivant", correct: false}
      - {text: "Il lève l'exception `IndexError`", correct: false}
      - {text: "Il renvoie `False` au lieu d'un élément", correct: false}
    answer: |-
      `__next__` lève `StopIteration`. Renvoyer `None` ne marcherait pas : `None` peut être un élément comme un autre.
      `IndexError` sert à l'ancien protocole des séquences, fondé sur `__getitem__`.
  - key: iter-d-un-iterateur
    format: course
    question: "Que doit renvoyer la méthode `__iter__` d'un itérateur ?"
    choices:
      - {text: "L'itérateur lui-même : `return self`", correct: true}
      - {text: "Une copie de l'itérateur, remise au début", correct: false}
      - {text: "La liste de tous les éléments qui restent", correct: false}
      - {text: "Le premier élément de la séquence", correct: false}
    answer: |-
      Un itérateur est aussi un itérable : `iter(it)` renvoie `it`, ce qui permet d'écrire `for x in it`. C'est aussi
      pourquoi il ne repart pas du début.
  - key: vf-liste-iterateur
    format: true-false
    question: "Une liste est un itérateur."
    truth: false
    answer: |-
      Une liste est un itérable : `next([1, 2])` lève une `TypeError`. `iter(liste)` en tire un itérateur, et chaque
      appel à `iter` en donne un nouveau, qui repart du début.
  - key: vf-next-defaut
    format: true-false
    question: "`next(it, None)` renvoie `None` au lieu de lever `StopIteration` quand `it` est épuisé."
    truth: true
    answer: "Le second argument de `next` est la valeur à renvoyer à la fin, à la place de l'exception."
  - key: vf-iter-meme-objet
    format: true-false
    question: "Appeler `iter()` sur un itérateur renvoie ce même itérateur."
    truth: true
    answer: "Son `__iter__` renvoie `self` : on peut donc le passer partout où un itérable est attendu."
  - key: vf-getitem-suffit
    format: true-false
    question: "Un objet qui n'a que `__getitem__`, pour des indices à partir de 0, peut être parcouru par `for`."
    truth: true
    answer: |-
      Faute de `__iter__`, `iter()` se rabat sur l'ancien protocole des séquences : il lit les indices 0, 1, 2... jusqu'à
      une `IndexError`.
  - key: qcm-lequel-iterateur
    format: multiple-choice
    question: "Lequel de ces objets est un itérateur ?"
    choices:
      - {text: "`iter([1, 2])`", correct: true}
      - {text: "`[1, 2]`", correct: false}
      - {text: "`range(3)`", correct: false}
      - {text: "`\"abc\"`", correct: false}
    answer: |-
      `iter([1, 2])` est un `list_iterator`, qui accepte `next`. Une liste, un `range` et une chaîne sont des itérables :
      on les parcourt autant qu'on veut, mais `next` les refuse.
  - key: qcm-next-liste-vide
    format: multiple-choice
    question: "Que lève `next(iter([]))` ?"
    choices:
      - {text: "`StopIteration`", correct: true}
      - {text: "`IndexError`", correct: false}
      - {text: "`ValueError`", correct: false}
      - {text: "Rien : il renvoie `None`", correct: false}
    answer: "L'itérateur d'une liste vide est épuisé d'emblée : le premier `next` lève `StopIteration`."
  - key: qcm-methodes-iterateur
    format: multiple-choice
    question: "Quelles méthodes une classe doit-elle définir pour que ses objets soient des itérateurs ?"
    choices:
      - {text: "`__iter__` et `__next__`", correct: true}
      - {text: "`__iter__` seulement", correct: false}
      - {text: "`__next__` et `__len__`", correct: false}
      - {text: "`__getitem__` et `__len__`", correct: false}
    answer: |-
      `__next__` donne l'élément suivant, et `__iter__` renvoie `self` pour que l'objet soit aussi itérable. `__len__` et
      `__getitem__` font une séquence, pas un itérateur.
  - key: qcm-ligne-entete
    format: multiple-choice
    question: "Comment lire la ligne d'en-tête du fichier ouvert `f`, avant de parcourir les autres lignes avec `for` ?"
    choices:
      - {text: "`entete = next(f)`", correct: true}
      - {text: "`entete = f[0]`", correct: false}
      - {text: "`entete = list(f)[0]`", correct: false}
      - {text: "`entete = f.first()`", correct: false}
    answer: |-
      Un fichier ouvert est un itérateur de lignes : `next(f)` lit la première, et la boucle `for` reprend à la
      deuxième. `list(f)[0]` lirait tout le fichier, et la boucle ne trouverait plus rien.
  - key: trous-iter-next
    format: fill-in
    question: |-
      Complète pour lire le premier élément de `xs` à la main :
      ```python
      it = ___(xs)
      premier = ___(it)
      ```
    blanks:
