    choices:
      - {text: "`a b fin`", correct: true}
      - {text: "`a b None`", correct: false}
      - {text: "`a b b`", correct: false}
      - {text: "`ab fin`", correct: false}
  - key: bug-iter-manquant
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: 'Compteur' object is not iterable » :
      ```python
      class Compteur:
          def __init__(self, fin):
              self.i = 0
              self.fin = fin

          def __next__(self):
              if self.i >= self.fin:
                  raise StopIteration
              self.i += 1
              return self.i


      for n in Compteur(3):
          print(n)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter `def __iter__(self): return self`", correct: true}
      - {text: "Renommer `__next__` en `next`, sans soulignés", correct: false}
      - {text: "Ajouter `def __len__(self): return self.fin`", correct: false}
      - {text: "Écrire `for n in next(Compteur(3)):`", correct: false}
    answer: |-
      ```python
      class Compteur:
          ...
          def __iter__(self):
              return self
      ```
      `for` appelle d'abord `iter()` sur l'objet : sans `__iter__` (ni `__getitem__`), l'objet n'est pas itérable, même
      s'il a un `__next__`.
  - key: bug-next-sur-liste
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: 'list' object is not an iterator » :
      ```python
      lignes = ["en-tête", "a", "b"]
      entete = next(lignes)
      for ligne in lignes:
          print(ligne)
      ```
      Il doit lire l'en-tête, puis parcourir les autres lignes. Quelle correction est la bonne ?
    choices:
      - {text: "Créer l'itérateur `it = iter(lignes)`, puis `next(it)` et `for` sur `it`", correct: true}
      - {text: "Remplacer `next(lignes)` par `lignes.next()`, sa méthode", correct: false}
      - {text: "Remplacer `next(lignes)` par `next(list(lignes))`", correct: false}
      - {text: "Écrire `next(lignes, None)` pour éviter l'exception", correct: false}
    answer: |-
      ```python
      it = iter(lignes)
      entete = next(it)
      for ligne in it:
          print(ligne)
      ```
      Une liste est un itérable, pas un itérateur : `next` exige un itérateur. En parcourant le même itérateur `it`, la
      boucle reprend après l'en-tête.
  - key: bug-iterable-a-usage-unique
    format: bug-fix
    question: |-
      Le second parcours du panier ne donne rien :
      ```python
      class Panier:
          def __init__(self, articles):
              self.articles = articles
              self.i = 0

          def __iter__(self):
              return self

          def __next__(self):
              if self.i >= len(self.articles):
                  raise StopIteration
              self.i += 1
              return self.articles[self.i - 1]


      panier = Panier(["pain", "lait"])
      print(list(panier), list(panier))
      ```
      Le programme affiche `['pain', 'lait'] []`. Quelle correction est la bonne ?
    choices:
      - {text: "Faire renvoyer à `__iter__` un nouvel itérateur, `iter(self.articles)`", correct: true}
      - {text: "Remettre `self.i` à zéro au début de `__next__`, à chaque appel", correct: false}
      - {text: "Appeler `list(panier)` une seule fois, puis copier la liste obtenue", correct: false}
      - {text: "Lever `IndexError` au lieu de `StopIteration` à la fin du panier", correct: false}
    answer: |-
      ```python
      class Panier:
          def __init__(self, articles):
              self.articles = articles

          def __iter__(self):
              return iter(self.articles)
      ```
      Un panier est une collection : il doit être un itérable, qui fournit un nouvel itérateur à chaque parcours. En
      renvoyant `self`, il devient son propre itérateur, à usage unique.
  - key: bug-next-sans-fin
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une `StopIteration`, sans afficher le total :
      ```python
      it = iter([1, 2, 3])
      total = 0
      while True:
          total += next(it)
      print(total)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Parcourir avec `for x in it`, qui gère la fin tout seul", correct: true}
      - {text: "Remplacer `while True` par `while it`, vrai tant qu'il reste un élément", correct: false}
      - {text: "Ajouter `if it is None: break` au début du corps de la boucle", correct: false}
      - {text: "Remplacer `next(it)` par `it.next()`", correct: false}
    answer: |-
      ```python
      total = 0
      for x in [1, 2, 3]:
          total += x
      print(total)     # ou simplement : sum([1, 2, 3])
      ```
      `next` lève `StopIteration` à la fin, et personne ne la rattrape. `for` le fait à ta place. Un itérateur est
      toujours vrai : `while it` ne s'arrêterait pas.
  - key: def-iterable
    format: definition
    question: "Qu'est-ce qu'un itérable, en Python ?"
    choices:
      - {text: "Un objet dont `iter()` sait tirer un itérateur, pour le parcourir", correct: true}
      - {text: "Un objet qui a une longueur, et dont on lit les éléments par indice", correct: false}
      - {text: "Un objet qui calcule ses éléments un à un, et s'épuise après un parcours", correct: false}
      - {text: "Une liste, un tuple ou une chaîne, et aucun autre type d'objet", correct: false}
    answer: |-
      Tout objet qui définit `__iter__` (ou, à l'ancienne, `__getitem__`) est itérable : listes, dictionnaires,
      ensembles, fichiers, générateurs, et tes propres classes.
  - key: def-iterateur
    format: definition
    question: "Qu'est-ce qu'un itérateur ?"
    choices:
      - {text: "Un objet qui donne l'élément suivant à chaque `next()`, et retient sa position", correct: true}
      - {text: "Un objet qui contient tous ses éléments, et qu'on lit par leur indice", correct: false}
      - {text: "Une fonction qui renvoie la liste des éléments d'une collection", correct: false}
      - {text: "Un compteur entier que la boucle `for` incrémente à chaque tour", correct: false}
    answer: |-
      Il implémente `__next__` (et `__iter__`, qui renvoie `self`) ; il lève `StopIteration` quand il est épuisé.
      Générateurs, fichiers ouverts, `map`, `zip` et `enumerate` sont des itérateurs.
  - key: def-protocole-iteration
    format: definition
    question: "Qu'est-ce que le protocole d'itération de Python ?"
    choices:
      - {text: "Les méthodes `__iter__` et `__next__`, et `StopIteration` pour la fin", correct: true}
      - {text: "La règle qui impose à toute collection une longueur connue d'avance", correct: false}
      - {text: "Le module de la bibliothèque standard qui fournit `chain` et `islice`", correct: false}
      - {text: "La convention qui fait commencer tout parcours à l'indice 0", correct: false}
    answer: |-
      C'est le contrat sur lequel reposent `for`, `list()`, `sum()`, le déballage et les compréhensions : n'importe
      quel objet qui le respecte s'utilise comme une collection.
  - key: def-stopiteration
    format: definition
    question: "Qu'est-ce que `StopIteration` ?"
    choices:
      - {text: "L'exception qu'un itérateur lève quand il n'a plus d'élément", correct: true}
      - {text: "L'instruction qui sort d'une boucle `for` avant la fin", correct: false}
      - {text: "La valeur que renvoie `next()` sur un itérateur épuisé", correct: false}
      - {text: "L'erreur levée quand on lit une liste hors de ses bornes", correct: false}
    answer: |-
      C'est le signal de fin du protocole d'itération, que `for` rattrape. Ce n'est pas une instruction (`break`), ni
      l'erreur d'indice (`IndexError`).
