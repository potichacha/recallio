    answer: "Le second argument de `next` est renvoyé à la place de `StopIteration`."
  - key: trous-boucle-for-a-la-main
    format: fill-in
    question: |-
      Complète la boucle que `for` exécute en coulisses :
      ```python
      it = iter(xs)
      while True:
          try:
              x = next(it)
          except ___:
              break
          traiter(x)
      ```
    blanks:
      - - StopIteration
    answer: "`for` rattrape `StopIteration` pour sortir de la boucle : c'est le signal de fin du protocole."
  - key: code-next-puis-list
    format: code-output
    question: |-
      ```python
      it = iter([10, 20, 30])
      print(next(it), next(it), list(it))
      ```
    answer: "`10 20 [30]` : `list(it)` reprend là où les deux `next` se sont arrêtés."
    check:
      output: "10 20 [30]"
    choices:
      - {text: "`10 20 [30]`", correct: true}
      - {text: "`10 20 [10, 20, 30]`", correct: false}
      - {text: "`10 10 [10, 20, 30]`", correct: false}
      - {text: "`10 20 []`", correct: false}
  - key: code-iter-is
    format: code-output
    question: |-
      ```python
      nombres = [1, 2, 3]
      it = iter(nombres)
      print(iter(it) is it, iter(nombres) is nombres)
      ```
    answer: |-
      `True False` : l'`__iter__` d'un itérateur renvoie `self`. Celui d'une liste crée un nouvel itérateur, distinct de
      la liste.
    check:
      output: "True False"
    choices:
      - {text: "`True False`", correct: true}
      - {text: "`True True`", correct: false}
      - {text: "`False False`", correct: false}
      - {text: "`False True`", correct: false}
  - key: code-classe-rebours
