      ```python
      class Rebours:
          def __init__(self, debut):
              self.n = debut

          def __iter__(self):
              return self

          def __next__(self):
              if self.n <= 0:
                  raise StopIteration
              self.n -= 1
              return self.n + 1


      print(list(Rebours(3)))
      ```
    answer: "`[3, 2, 1]` : chaque `__next__` décrémente `n` et renvoie l'ancienne valeur, jusqu'à 0."
    check:
