notion: fusion-dicts
lesson: |-
  Python offre plusieurs façons de fusionner des dictionnaires. Dans toutes, **la valeur de droite l'emporte** quand une
  clé est présente des deux côtés.

  | Écriture | Depuis | Effet |
  |---|---|---|
  | `a \| b` | Python 3.9 | un **nouveau** dictionnaire |
  | `a \|= b` | Python 3.9 | modifie `a` sur place |
  | `a.update(b)` | toujours | modifie `a` sur place, renvoie `None` |
  | `{**a, **b}` | Python 3.5 | un nouveau dictionnaire, par déballage |

  ```python
  defaut = {"theme": "clair", "langue": "fr"}
  choix = {"theme": "sombre"}
  defaut | choix          # {'theme': 'sombre', 'langue': 'fr'}
  {**defaut, "langue": "en"}   # on peut mêler déballages et paires littérales
  ```

  **L'ordre du résultat** : d'abord les clés de gauche, à leur place, puis les nouvelles clés de droite. Une clé
  redéfinie à droite garde sa place, mais prend la nouvelle valeur.

  **L'ordre des opérandes compte** : `defaut | choix` donne la priorité aux choix, `choix | defaut` aux valeurs par
  défaut. Avec le déballage, c'est la dernière occurrence qui gagne : `{"port": 8080, **base}` garde le port de `base`.

  `update` et `|=` acceptent aussi un itérable de paires : `d.update([("x", 1)])`, `d.update(x=1)`. L'opérateur `|`,
  lui, exige deux dictionnaires. Et `+` n'existe pas : `{"a": 1} + {"b": 2}` lève une `TypeError`.

  **La fusion est superficielle** : une valeur qui est elle-même un dictionnaire est **remplacée**, pas fusionnée.

  ```python
  a = {"db": {"hote": "local", "port": 5432}}
  b = {"db": {"port": 6543}}
  a | b                   # {'db': {'port': 6543}} : 'hote' a disparu
  ```

  Pour une fusion récursive, il faut l'écrire soi-même. Pour chercher une clé dans plusieurs dictionnaires sans les
  copier, `collections.ChainMap` les consulte dans l'ordre.

  **En entretien** : « `a | b` crée un nouveau dictionnaire et `a |= b` ou `update` modifient `a` ; `{**a, **b}` marche
  avant Python 3.9. Dans tous les cas, la valeur de droite l'emporte. La fusion est superficielle : un dictionnaire
  imbriqué est remplacé, pas fusionné. »
tour:
  - title: Fusionner des dictionnaires
    text: |-
      `a | b` crée un nouveau dictionnaire qui réunit les deux ; pour une clé présente des deux côtés, la valeur de
      `b` l'emporte. `a |= b` fait la même fusion, mais dans `a`.

      Le déballage `{**a, **b}` fait la même chose, et permet d'ajouter des paires au passage.

      Essaie : remplace `defaut | choix` par `choix | defaut`. Qui gagne, cette fois ?
    example:
      files:
        main.py: |-
          defaut = {"theme": "clair", "langue": "fr", "taille": 12}
          choix = {"theme": "sombre", "police": "Nunito"}

          config = defaut | choix
          print(config)
          print(defaut)

          autre = {**defaut, "taille": 14}
          print(autre)

          defaut |= {"langue": "en"}
          print(defaut)
      output: |-
        {'theme': 'sombre', 'langue': 'fr', 'taille': 12, 'police': 'Nunito'}
        {'theme': 'clair', 'langue': 'fr', 'taille': 12}
        {'theme': 'clair', 'langue': 'fr', 'taille': 14}
        {'theme': 'clair', 'langue': 'en', 'taille': 12}
cards:
  - key: qui-l-emporte
    format: course
    question: "Avec `a | b`, quelle valeur garde une clé présente dans les deux dictionnaires ?"
    choices:
      - {text: "Celle de `b`, l'opérande de droite", correct: true}
      - {text: "Celle de `a`, l'opérande de gauche", correct: false}
      - {text: "Les deux, rangées dans une liste", correct: false}
      - {text: "Aucune : Python lève une `KeyError`", correct: false}
    answer: "La droite l'emporte, comme avec `update` et `{**a, **b}`. Pour donner la priorité à `a`, on écrit `b | a`."
  - key: pipe-ou-pipe-egal
    format: course
    question: "Quelle différence entre `a | b` et `a |= b` ?"
    choices:
      - {text: "`a | b` crée un nouveau dictionnaire ; `a |= b` modifie `a`", correct: true}
      - {text: "`a |= b` crée un nouveau dictionnaire ; `a | b` modifie `a`", correct: false}
      - {text: "`a | b` garde les valeurs de `a` ; `a |= b` celles de `b`", correct: false}
      - {text: "Aucune : `|=` est seulement plus court à écrire", correct: false}
    answer: "`|=` met à jour `a` sur place, comme `a.update(b)` : les autres noms qui désignent `a` voient le changement. `a | b` laisse les deux opérandes intacts."
  - key: fusion-superficielle
    format: course
    question: "Que devient une valeur qui est elle-même un dictionnaire, lors de `a | b` ?"
    choices:
      - {text: "Celle de `b` remplace celle de `a`, sans fusion des deux", correct: true}
      - {text: "Les deux dictionnaires imbriqués sont fusionnés à leur tour", correct: false}
      - {text: "Python lève une `TypeError` sur les valeurs imbriquées", correct: false}
      - {text: "Celle de `a` est gardée, car elle est arrivée la première", correct: false}
    answer: "La fusion ne regarde que les clés du premier niveau. Une fusion récursive (pour une configuration, par exemple) s'écrit à la main."
  - key: update-renvoie
    format: course
    question: "Que renvoie `a.update(b)` ?"
    choices:
      - {text: "`None` : `update` modifie `a` en place", correct: true}
      - {text: "Un nouveau dictionnaire, la fusion des deux", correct: false}
      - {text: "Le dictionnaire `a`, pour enchaîner les appels", correct: false}
      - {text: "Le nombre de clés ajoutées à `a`", correct: false}
    answer: "Comme les méthodes de liste qui modifient, `update` renvoie `None`. `fusion = a.update(b)` donne donc `None`."
  - key: vf-addition
    format: true-false
    question: "`{\"a\": 1} + {\"b\": 2}` fusionne les deux dictionnaires."
    truth: false
    answer: "Les dictionnaires n'ont pas d'opérateur `+` : `TypeError: unsupported operand type(s) for +: 'dict' and 'dict'`. On écrit `|`."
  - key: vf-deballage-nouveau
    format: true-false
    question: "`{**a, **b}` crée un nouveau dictionnaire, sans modifier `a` ni `b`."
    truth: true
    answer: "Le déballage copie les paires dans un nouveau littéral. C'était la façon de fusionner avant Python 3.9."
  - key: vf-ordre-cle-redefinie
    format: true-false
    question: "Dans `a | b`, une clé de `a` redéfinie par `b` passe à la fin du résultat."
    truth: false
    answer: "Elle garde sa place, celle de `a`, et prend la valeur de `b`. Seules les clés nouvelles de `b` s'ajoutent à la fin."
  - key: vf-update-paires
    format: true-false
    question: "`d.update([(\"x\", 1)])` accepte une liste de paires."
    truth: true
    answer: "`update` accepte un dictionnaire, un itérable de paires, ou des arguments nommés : `d.update(x=1)`."
  - key: qcm-nouveau-dict
    format: multiple-choice
    question: "Comment fusionner `defaut` et `choix` dans un nouveau dictionnaire, où `choix` l'emporte ?"
    choices:
      - {text: "`defaut | choix`", correct: true}
      - {text: "`choix | defaut`", correct: false}
      - {text: "`defaut.update(choix)`", correct: false}
      - {text: "`defaut + choix`", correct: false}
    answer: "La droite l'emporte, et `|` crée un nouveau dictionnaire. `update` modifie `defaut` et renvoie `None`."
  - key: qcm-copie-avec-changement
    format: multiple-choice
    question: "Comment obtenir une copie de `base` où seule la clé `\"port\"` change ?"
    choices:
      - {text: "`{**base, \"port\": 8080}`", correct: true}
      - {text: "`{\"port\": 8080, **base}`", correct: false}
      - {text: "`base.update(port=8080)`", correct: false}
      - {text: "`base + {\"port\": 8080}`", correct: false}
    answer: "Le dernier qui définit une clé gagne : la paire littérale doit venir après le déballage. `update` modifierait `base`."
  - key: qcm-version
    format: multiple-choice
    question: "Depuis quelle version Python a-t-il l'opérateur `|` pour les dictionnaires ?"
    choices:
      - {text: "Python 3.9", correct: true}
      - {text: "Python 3.5", correct: false}
      - {text: "Python 3.7", correct: false}
      - {text: "Python 2.7", correct: false}
    answer: "La PEP 584, en Python 3.9. Python 3.5 avait apporté `{**a, **b}` (PEP 448), et Python 3.7 l'ordre d'insertion garanti."
  - key: qcm-sur-place
    format: multiple-choice
    question: "Laquelle de ces écritures modifie `a` sur place ?"
    choices:
      - {text: "`a |= b`", correct: true}
      - {text: "`a | b`", correct: false}
      - {text: "`{**a, **b}`", correct: false}
      - {text: "`dict(a, **b)`", correct: false}
    answer: "`|=` et `update` modifient `a`. Les trois autres construisent un nouveau dictionnaire."
  - key: trous-pipe
    format: fill-in
    question: |-
      Complète pour créer un nouveau dictionnaire qui fusionne `a` et `b` :
      ```python
      fusion = a ___ b
      ```
    blanks:
      - ["|"]
    answer: "`|` (Python 3.9) crée un nouveau dictionnaire ; `b` l'emporte en cas de clé commune."
  - key: trous-update
    format: fill-in
    question: |-
      Complète pour ajouter les paires de `b` à `a`, sur place, avec une méthode :
      ```python
      a.___(b)
      ```
    blanks:
      - [update]
    answer: "`update` modifie `a` et renvoie `None`."
  - key: trous-double-etoile
    format: fill-in
    question: |-
      Complète pour fusionner par déballage :
      ```python
      fusion = {___a, ___b}
      ```
    blanks:
      - ["**"]
      - ["**"]
    answer: "`**` déballe les paires d'un dictionnaire dans le littéral ; celles de `b`, après, l'emportent."
  - key: trous-pipe-egal
    format: fill-in
    question: |-
      Complète pour fusionner `b` dans `a` sur place, avec un opérateur :
      ```python
      a ___ b
      ```
    blanks:
      - ["|="]
    answer: "`|=` met `a` à jour, comme `a.update(b)`."
  - key: code-conflit
    format: code-output
    question: |-
      ```python
      a = {"x": 1, "y": 2}
      b = {"y": 20, "z": 30}
      print(a | b)
      ```
    answer: "`'y'` garde sa place et prend la valeur de `b` ; `'z'`, nouvelle, s'ajoute à la fin."
    check:
      output: "{'x': 1, 'y': 20, 'z': 30}"
    choices:
      - {text: "`{'x': 1, 'y': 20, 'z': 30}`", correct: true}
      - {text: "`{'x': 1, 'y': 2, 'z': 30}`", correct: false}
      - {text: "`{'x': 1, 'z': 30, 'y': 20}`", correct: false}
      - {text: "`{'y': 20, 'z': 30, 'x': 1}`", correct: false}
  - key: code-update-none
    format: code-output
    question: |-
      ```python
      a = {"x": 1}
      r = a.update({"y": 2})
      print(r, a)
      ```
    answer: "`update` modifie `a` et renvoie `None`."
    check:
      output: "None {'x': 1, 'y': 2}"
    choices:
      - {text: "`None {'x': 1, 'y': 2}`", correct: true}
      - {text: "`{'x': 1, 'y': 2} {'x': 1, 'y': 2}`", correct: false}
      - {text: "`{'x': 1, 'y': 2} {'x': 1}`", correct: false}
      - {text: "`None {'x': 1}`", correct: false}
  - key: code-deballage-ordre
    format: code-output
    question: |-
      ```python
      base = {"hote": "local", "port": 80}
      print({"port": 8080, **base}, {**base, "port": 8080})
      ```
    answer: "La dernière définition d'une clé gagne. Dans le premier, `base` vient après et rétablit 80 ; la clé garde la place de sa première apparition."
    check:
      output: "{'port': 80, 'hote': 'local'} {'hote': 'local', 'port': 8080}"
    choices:
      - {text: "`{'port': 80, 'hote': 'local'} {'hote': 'local', 'port': 8080}`", correct: true}
      - {text: "`{'port': 8080, 'hote': 'local'} {'hote': 'local', 'port': 8080}`", correct: false}
      - {text: "`{'hote': 'local', 'port': 8080} {'hote': 'local', 'port': 8080}`", correct: false}
      - {text: "`{'port': 80, 'hote': 'local'} {'hote': 'local', 'port': 80}`", correct: false}
  - key: code-imbrique-remplace
    format: code-output
    question: |-
      ```python
      a = {"db": {"hote": "local", "port": 5432}}
      b = {"db": {"port": 6543}}
      print(a | b)
      ```
    answer: "La fusion est superficielle : la valeur de `'db'` dans `b` remplace entièrement celle de `a`."
    check:
      output: "{'db': {'port': 6543}}"
    choices:
      - {text: "`{'db': {'port': 6543}}`", correct: true}
      - {text: "`{'db': {'hote': 'local', 'port': 6543}}`", correct: false}
      - {text: "`{'db': {'hote': 'local', 'port': 5432}}`", correct: false}
      - {text: "`{'db': {'port': 6543, 'hote': 'local'}}`", correct: false}
