notion: deballage
lesson: |-
  Le **déballage** (*unpacking*) affecte les éléments d'un itérable à plusieurs variables en une instruction.

  ```python
  x, y = (3, 4)              # x = 3, y = 4
  nom, age = ["Ada", 36]     # n'importe quel itérable
  a, b = b, a                # échange deux variables, sans variable temporaire
  (a, b), c = (1, 2), 3      # déballage imbriqué
  ```

  **Le nombre doit correspondre** : `a, b = [1, 2, 3]` lève
  `ValueError: too many values to unpack (expected 2, got 3)`, et `a, b, c = [1, 2]`
  `ValueError: not enough values to unpack (expected 3, got 2)`.

  **L'étoile** ramasse « le reste », toujours dans une **liste** (vide s'il n'y a rien) :

  ```python
  premier, *reste = [1, 2, 3, 4]        # 1, [2, 3, 4]
  *debut, dernier = "abc"                # ['a', 'b'], 'c'
  tete, *milieu, queue = [1, 2]         # 1, [], 2
  ```

  Une seule expression étoilée par déballage. Par convention, `_` nomme une valeur qu'on n'utilise pas :
  `nom, _, ville = ligne.split(",")`.

  **Dans une boucle**, le déballage se fait à chaque tour :

  | Écriture | Ce que donne chaque tour |
  |---|---|
  | `for i, x in enumerate(xs):` | l'indice (à partir de 0) et l'élément |
  | `for i, x in enumerate(xs, start=1):` | l'indice à partir de 1 |
  | `for a, b in zip(xs, ys):` | les éléments de même rang des deux itérables |
  | `for cle, valeur in d.items():` | chaque paire d'un dictionnaire |

  `zip` s'arrête à la fin du **plus court** itérable, sans rien dire. Avec `zip(xs, ys, strict=True)` (Python 3.10),
  des longueurs différentes lèvent une `ValueError`. `itertools.zip_longest` complète au contraire avec une valeur.

  `enumerate` et `zip` remplacent les boucles sur `range(len(xs))`, moins lisibles.

  **En entretien** : « Le déballage affecte les éléments d'un itérable à plusieurs noms : `a, b = b, a` échange deux
  variables. `*reste` ramasse les éléments en trop dans une liste. `enumerate` donne l'indice et l'élément, `zip`
  parcourt plusieurs itérables en parallèle et s'arrête au plus court, sauf avec `strict=True`. »
tour:
  - title: Le déballage, enumerate et zip
    text: |-
      Le déballage range les éléments d'une séquence dans plusieurs variables : `x, y = point`. Il échange deux
      variables sans variable temporaire : `a, b = b, a`.

      L'étoile ramasse le reste dans une liste : `premier, *reste = xs`.

      Dans une boucle, `enumerate` donne l'indice avec l'élément, et `zip` parcourt deux listes en parallèle.

      Essaie : ajoute un quatrième fruit à `fruits` sans ajouter de prix. `zip` s'arrête à la plus courte des deux.
    example:
      files:
        main.py: |-
          a, b = 1, 2
          a, b = b, a
          print(a, b)

          premier, *reste = [10, 20, 30, 40]
          print(premier, reste)

          fruits = ["pomme", "kiwi", "poire"]
          for i, fruit in enumerate(fruits):
              print(i, fruit)

          prix = [1.2, 0.5, 2.0]
          for fruit, p in zip(fruits, prix):
              print(fruit, "coûte", p)
      output: |-
        2 1
        10 [20, 30, 40]
        0 pomme
        1 kiwi
        2 poire
        pomme coûte 1.2
        kiwi coûte 0.5
        poire coûte 2.0
    task:
      instructions: |-
        Numérote les fruits à partir de 1 : le programme doit afficher `1. pomme`, `2. kiwi` et `3. poire`, une ligne
        chacun.
      starter:
        main.py: |-
          fruits = ["pomme", "kiwi", "poire"]
          for fruit in fruits:
              print(fruit)
      solution:
        main.py: |-
          fruits = ["pomme", "kiwi", "poire"]
          for rang, fruit in enumerate(fruits, start=1):
              print(f"{rang}. {fruit}")
      output: |-
        1. pomme
        2. kiwi
        3. poire
cards:
  - key: echanger
    format: course
    question: "Comment échanger les valeurs de `a` et `b` en Python ?"
    choices:
      - {text: "`a, b = b, a`", correct: true}
      - {text: "`a = b` puis `b = a`", correct: false}
      - {text: "`swap(a, b)`", correct: false}
      - {text: "`a, b = a, b`", correct: false}
    answer: "La partie droite est évaluée d'abord, en un tuple `(b, a)`, puis déballée. `a = b` puis `b = a` perd l'ancienne valeur de `a`, et `swap` n'existe pas."
  - key: etoile-reste
    format: course
    question: "Dans `premier, *reste = xs`, que contient `reste` ?"
    choices:
      - {text: "Une liste des éléments après le premier, vide s'il n'y en a pas", correct: true}
      - {text: "Un tuple des éléments après le premier, vide s'il n'y en a pas", correct: false}
      - {text: "Le dernier élément seul, ou `None` si la liste est vide", correct: false}
      - {text: "Un itérateur paresseux sur les éléments qui suivent le premier", correct: false}
    answer: "L'expression étoilée reçoit toujours une liste, même quand `xs` est un tuple ou une chaîne. Si `xs` est vide, en revanche, `premier` n'a pas de valeur : `ValueError`."
  - key: enumerate-produit
    format: course
    question: "Que produit `enumerate(xs)` à chaque tour de boucle ?"
    choices:
      - {text: "Un tuple `(indice, élément)`, l'indice partant de 0", correct: true}
      - {text: "Un tuple `(élément, indice)`, l'indice partant de 0", correct: false}
      - {text: "Un tuple `(indice, élément)`, l'indice partant de 1", correct: false}
      - {text: "L'indice seul, à lire ensuite dans `xs`", correct: false}
    answer: "L'indice d'abord, puis l'élément ; il part de 0, sauf avec `start=` : `enumerate(xs, start=1)`."
  - key: zip-longueurs
    format: course
    question: "Que fait `zip(a, b)` quand `a` est plus longue que `b` ?"
    choices:
      - {text: "Il s'arrête à la fin de la plus courte", correct: true}
      - {text: "Il complète `b` avec des `None`", correct: false}
      - {text: "Il lève une `ValueError`", correct: false}
      - {text: "Il reprend `b` depuis le début", correct: false}
    answer: "Les éléments en trop de `a` sont ignorés, sans avertissement. `zip(a, b, strict=True)` lève une `ValueError`, et `itertools.zip_longest` complète avec une valeur."
  - key: vf-trop-de-valeurs
    format: true-false
    question: "`a, b = [1, 2, 3]` lève une `ValueError`."
    truth: true
    answer: "`ValueError: too many values to unpack (expected 2, got 3)`. Pour ignorer le reste : `a, b, *_ = [1, 2, 3]`."
  - key: vf-variable-temporaire
    format: true-false
    question: "Pour échanger deux variables en Python, il faut passer par une variable temporaire."
    truth: false
    answer: "`a, b = b, a` suffit : le tuple de droite est construit avant l'affectation."
  - key: vf-deux-etoiles
    format: true-false
    question: "Un déballage peut contenir deux expressions étoilées, comme `*a, *b = xs`."
    truth: false
    answer: "`SyntaxError: multiple starred expressions in assignment` : Python ne saurait pas où couper."
  - key: vf-zip-strict
    format: true-false
    question: "`zip(a, b, strict=True)` lève une `ValueError` si les deux itérables n'ont pas la même longueur."
    truth: true
    answer: "Depuis Python 3.10. Sans `strict`, `zip` s'arrête silencieusement à la fin du plus court."
  - key: qcm-valeur-ignoree
    format: multiple-choice
    question: "Par convention, quel nom donne-t-on à une valeur déballée qu'on n'utilise pas ?"
    choices:
      - {text: "`_`", correct: true}
      - {text: "`None`", correct: false}
      - {text: "`pass`", correct: false}
      - {text: "`*`", correct: false}
    answer: "`_` est un nom comme un autre, que tout le monde lit comme « ignoré » : `nom, _, ville = ligne`. `None` et `pass` sont des mots réservés, auxquels on ne peut rien affecter."
  - key: qcm-dernier-et-debut
    format: multiple-choice
    question: "Comment récupérer, par déballage, le dernier élément d'un côté et tous les autres de l'autre ?"
    choices:
      - {text: "`*debut, dernier = xs`", correct: true}
      - {text: "`debut, *dernier = xs`", correct: false}
      - {text: "`*debut, *dernier = xs`", correct: false}
      - {text: "`debut, dernier = *xs`", correct: false}
    answer: "L'étoile ramasse ce qui n'est pas pris par les autres noms : ici, tout sauf le dernier. `debut, *dernier` ferait l'inverse."
  - key: qcm-parcours-parallele
    format: multiple-choice
    question: "Comment parcourir les listes `noms` et `ages` en parallèle ?"
    choices:
      - {text: "`for nom, age in zip(noms, ages):`", correct: true}
      - {text: "`for nom, age in noms, ages:`", correct: false}
      - {text: "`for nom, age in enumerate(noms, ages):`", correct: false}
      - {text: "`for nom in noms and age in ages:`", correct: false}
    answer: "`zip` associe les éléments de même rang. `noms, ages` est un tuple de deux listes : la boucle parcourrait les listes elles-mêmes."
  - key: qcm-imbrique
    format: multiple-choice
    question: "Quelle ligne déballe `((1, 2), 3)` pour obtenir `x = 1`, `y = 2` et `z = 3` ?"
    choices:
      - {text: "`(x, y), z = ((1, 2), 3)`", correct: true}
      - {text: "`x, y, z = ((1, 2), 3)`", correct: false}
      - {text: "`x, (y, z) = ((1, 2), 3)`", correct: false}
      - {text: "`*x, y, z = ((1, 2), 3)`", correct: false}
    answer: "Le motif de gauche reprend la forme de la valeur : un tuple de deux éléments, dont le premier est lui-même une paire."
  - key: trous-echanger
    format: fill-in
    question: |-
      Complète pour échanger `x` et `y` :
      ```python
      x, y = ___, ___
      ```
    blanks:
      - [y]
      - [x]
    answer: "`x, y = y, x` : la partie droite est évaluée entièrement avant l'affectation."
  - key: trous-enumerate
    format: fill-in
    question: |-
      Complète pour afficher chaque invité précédé de son rang, en partant de 1 :
      ```python
      for rang, invite in ___(invites, start=1):
          print(rang, invite)
      ```
    blanks:
      - [enumerate]
    answer: "`enumerate` donne la paire `(indice, élément)` ; `start=1` fait partir l'indice de 1."
  - key: trous-zip
    format: fill-in
    question: |-
      Complète pour parcourir `noms` et `notes` deux à deux :
      ```python
      for nom, note in ___(noms, notes):
          print(nom, note)
      ```
    blanks:
      - [zip]
    answer: "`zip` associe les éléments de même rang, et s'arrête au plus court."
  - key: trous-etoile
    format: fill-in
    question: |-
      Complète pour mettre le premier élément dans `tete` et tous les autres dans `queue` :
      ```python
      tete, ___queue = [1, 2, 3]
      ```
    blanks:
      - ["*"]
    answer: "`*queue` ramasse le reste dans une liste : `[2, 3]`."
  - key: code-etoile-milieu
    format: code-output
    question: |-
      ```python
      premier, *milieu, dernier = [1, 2, 3, 4, 5]
      print(premier, milieu, dernier)
      ```
    answer: "Le premier et le dernier sont pris, l'étoile ramasse le reste dans une liste."
    check:
      output: "1 [2, 3, 4] 5"
    choices:
      - {text: "`1 [2, 3, 4] 5`", correct: true}
      - {text: "`1 (2, 3, 4) 5`", correct: false}
      - {text: "`1 [2] 5`", correct: false}
      - {text: "`[1] [2, 3, 4] [5]`", correct: false}
  - key: code-zip-court
    format: code-output
    question: |-
      ```python
      print(list(zip("abc", [1, 2])))
      ```
    answer: "`zip` s'arrête à la fin de la liste `[1, 2]` : le `'c'` est ignoré."
    check:
      output: "[('a', 1), ('b', 2)]"
    choices:
      - {text: "`[('a', 1), ('b', 2)]`", correct: true}
      - {text: "`[('a', 1), ('b', 2), ('c', None)]`", correct: false}
      - {text: "`[('abc', 1), ('abc', 2)]`", correct: false}
      - {text: "`[('a', 'b', 'c'), (1, 2)]`", correct: false}
  - key: code-enumerate-start
    format: code-output
    question: |-
      ```python
      print(list(enumerate("xyz", start=10)))
      ```
    answer: "`start=10` fixe le premier indice ; l'élément vient en second dans chaque paire."
    check:
      output: "[(10, 'x'), (11, 'y'), (12, 'z')]"
    choices:
      - {text: "`[(10, 'x'), (11, 'y'), (12, 'z')]`", correct: true}
      - {text: "`[(0, 'x'), (1, 'y'), (2, 'z')]`", correct: false}
      - {text: "`[('x', 10), ('y', 11), ('z', 12)]`", correct: false}
      - {text: "`[(10, 'x'), (10, 'y'), (10, 'z')]`", correct: false}
  - key: code-rotation
    format: code-output
    question: |-
      ```python
      a, b, c = 1, 2, 3
      a, b, c = c, a, b
      print(a, b, c)
      ```
    answer: "La partie droite vaut `(3, 1, 2)`, calculée avant toute affectation."
    check:
      output: "3 1 2"
    choices:
      - {text: "`3 1 2`", correct: true}
      - {text: "`3 2 1`", correct: false}
      - {text: "`1 2 3`", correct: false}
      - {text: "`3 3 3`", correct: false}
  - key: bug-trop-de-champs
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `ValueError: too many values to unpack (expected 2, got 3)` :
      ```python
      ligne = "Ada,Lovelace,1815"
      prenom, nom = ligne.split(",")
      print(prenom, nom)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`prenom, nom, _ = ligne.split(\",\")`", correct: true}
      - {text: "`prenom, nom = ligne.split()`", correct: false}
      - {text: "`prenom, nom = ligne.split(\",\", 2)`", correct: false}
      - {text: "`prenom, nom = tuple(ligne.split(\",\"))`", correct: false}
    answer: |-
      ```python
      ligne = "Ada,Lovelace,1815"
      prenom, nom, _ = ligne.split(",")
      print(prenom, nom)
      ```
      La ligne a trois champs : il faut trois noms, dont `_` pour celui qu'on ignore. `split(",", 2)` coupe au plus
      deux fois, ce qui donne encore trois morceaux.
  - key: bug-enumerate-inverse
    format: bug-fix
    question: |-
      Ce programme affiche `pomme 0` puis `kiwi 1` : l'indice et le fruit sont inversés.
      ```python
      fruits = ["pomme", "kiwi"]
      for fruit, i in enumerate(fruits):
          print(i, fruit)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`for i, fruit in enumerate(fruits):`", correct: true}
      - {text: "`for fruit, i in enumerate(fruits, start=0):`", correct: false}
      - {text: "`for i, fruit in fruits:`", correct: false}
      - {text: "`for fruit, i in zip(fruits):`", correct: false}
    answer: |-
      ```python
      fruits = ["pomme", "kiwi"]
      for i, fruit in enumerate(fruits):
          print(i, fruit)
      ```
      `enumerate` donne d'abord l'indice, puis l'élément : le motif de gauche doit suivre cet ordre.
  - key: bug-zip-silencieux
    format: bug-fix
    question: |-
      Ce programme affiche `ana 12` et `bob 15` : `eve` disparaît sans que rien ne le signale.
      ```python
      noms = ["ana", "bob", "eve"]
      notes = [12, 15]
      for nom, note in zip(noms, notes):
          print(nom, note)
      ```
      Quelle correction fait échouer le programme dès qu'une note manque ?
    choices:
      - {text: "`zip(noms, notes, strict=True)`", correct: true}
      - {text: "`zip(noms, notes, fill=None)`", correct: false}
      - {text: "`zip(notes, noms)`", correct: false}
      - {text: "`enumerate(zip(noms, notes))`", correct: false}
    answer: |-
      ```python
      noms = ["ana", "bob", "eve"]
      notes = [12, 15]
      for nom, note in zip(noms, notes, strict=True):
          print(nom, note)
      ```
      `strict=True` (Python 3.10) lève une `ValueError` quand les longueurs diffèrent. Inverser les arguments ne change
      rien : `zip` s'arrête toujours au plus court.
  - key: bug-echange-perdu
    format: bug-fix
    question: |-
      Ce programme affiche `2 2` au lieu de `2 1` :
      ```python
      a, b = 1, 2
      a = b
      b = a
      print(a, b)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Remplacer les deux lignes par `a, b = b, a`", correct: true}
      - {text: "Inverser les deux lignes : `b = a` puis `a = b`", correct: false}
      - {text: "Remplacer les deux lignes par `a, b = a, b`", correct: false}
      - {text: "Remplacer les deux lignes par `a = b, a`", correct: false}
    answer: |-
      ```python
      a, b = 1, 2
      a, b = b, a
      print(a, b)
      ```
      Après `a = b`, l'ancienne valeur de `a` est perdue. Le déballage construit d'abord le tuple `(b, a)`, puis
      affecte. `a = b, a` mettrait un tuple dans `a`.
