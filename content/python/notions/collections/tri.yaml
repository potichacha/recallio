notion: tri
lesson: |-
  Python trie de deux façons :

  | Écriture | Effet | Renvoie |
  |---|---|---|
  | `sorted(iterable)` | crée une **nouvelle** liste triée, à partir de n'importe quel itérable | la liste triée |
  | `xs.sort()` | trie la liste `xs` **sur place** | `None` |

  ```python
  notes = [14, 9, 17]
  sorted(notes)        # [9, 14, 17] ; notes est inchangée
  notes.sort()         # notes vaut [9, 14, 17]
  sorted("cab")        # ['a', 'b', 'c'] : toujours une liste
  sorted({"b": 1, "a": 2})   # ['a', 'b'] : un dictionnaire se parcourt par ses clés
  ```

  Les deux acceptent les mêmes paramètres nommés :

  - `reverse=True` trie du plus grand au plus petit ;
  - `key=fonction` donne la fonction appelée **une fois par élément**, dont le résultat sert à comparer :

  ```python
  mots = ["kiwi", "Banane", "abricot"]
  sorted(mots)                    # ['Banane', 'abricot', 'kiwi'] : les majuscules passent avant
  sorted(mots, key=str.lower)     # ['abricot', 'Banane', 'kiwi']
  sorted(mots, key=len)           # ['kiwi', 'Banane', 'abricot']
  eleves = [("ana", 15), ("bob", 12)]
  sorted(eleves, key=lambda e: e[1])   # par note
  ```

  On passe la fonction, sans l'appeler : `key=str.lower`, pas `key=str.lower()`. `operator.itemgetter(1)` et
  `operator.attrgetter("note")` remplacent les lambdas les plus courantes.

  **Le tri est stable** : deux éléments égaux pour la clé gardent leur ordre de départ, même avec `reverse=True`.
  On en profite pour trier sur plusieurs critères, par une clé tuple ou par passes successives :

  ```python
  # par note décroissante, puis par nom croissant
  sorted(eleves, key=lambda e: (-e[1], e[0]))
  # ou en deux passes, le critère secondaire d'abord
  par_nom = sorted(eleves, key=lambda e: e[0])
  sorted(par_nom, key=lambda e: e[1], reverse=True)
  ```

  **Les éléments doivent être comparables** : `sorted([3, "a"])` lève
  `TypeError: '<' not supported between instances of 'str' and 'int'`. Le tri (Timsort) coûte O(n log n).
  `min` et `max` acceptent aussi `key`.

  **En entretien** : « `sorted` renvoie une nouvelle liste depuis n'importe quel itérable, `list.sort` trie sur place
  et renvoie `None`. `key` donne la valeur à comparer pour chaque élément, `reverse` inverse l'ordre. Le tri est stable,
  ce qui permet de trier sur plusieurs critères. »
tour:
  - title: Trier
    text: |-
      `sorted(xs)` renvoie une nouvelle liste triée ; `xs.sort()` trie la liste elle-même, et renvoie `None`.

      Deux paramètres règlent le tri :

      - `reverse=True` met les plus grands d'abord ;
      - `key=` donne une fonction qui calcule, pour chaque élément, la valeur à comparer : `len`, `str.lower`, ou une
        `lambda`.

      Le tri est stable : `ana` et `eve`, qui ont la même note, gardent leur ordre de départ.

      Essaie : trie `mots` avec `key=lambda m: m[-1]`, par leur dernière lettre.
    example:
      files:
        main.py: |-
          notes = [14, 9, 17, 12]
          print(sorted(notes))
          print(notes)
          notes.sort(reverse=True)
          print(notes)

          mots = ["kiwi", "Banane", "abricot", "fig"]
          print(sorted(mots))
          print(sorted(mots, key=str.lower))
          print(sorted(mots, key=len))

          eleves = [("ana", 15), ("bob", 12), ("eve", 15)]
          print(sorted(eleves, key=lambda e: e[1], reverse=True))
      output: |-
        [9, 12, 14, 17]
        [14, 9, 17, 12]
        [17, 14, 12, 9]
        ['Banane', 'abricot', 'fig', 'kiwi']
        ['abricot', 'Banane', 'fig', 'kiwi']
        ['fig', 'kiwi', 'Banane', 'abricot']
        [('ana', 15), ('eve', 15), ('bob', 12)]
cards:
  - key: sorted-ou-sort
    format: course
    question: "Quelle différence entre `sorted(xs)` et `xs.sort()` ?"
    choices:
      - {text: "`sorted` renvoie une nouvelle liste ; `sort` trie `xs` en place et renvoie `None`", correct: true}
      - {text: "`sort` renvoie une nouvelle liste ; `sorted` trie `xs` en place et renvoie `None`", correct: false}
      - {text: "`sorted` est stable ; `sort` ne garantit pas l'ordre des éléments égaux", correct: false}
      - {text: "Aucune : `sorted` est un alias de `sort`, gardé pour la compatibilité", correct: false}
    answer: "`sorted` accepte n'importe quel itérable et laisse l'original intact. `list.sort` n'existe que sur les listes, les modifie et renvoie `None`. Les deux sont stables."
  - key: role-de-key
    format: course
    question: "À quoi sert le paramètre `key` de `sorted` ?"
    choices:
      - {text: "À donner la fonction qui calcule, pour chaque élément, la valeur à comparer", correct: true}
      - {text: "À donner la fonction qui compare deux éléments, et renvoie -1, 0 ou 1", correct: false}
      - {text: "À choisir la clé du dictionnaire à trier, quand on trie un dictionnaire", correct: false}
      - {text: "À indiquer l'indice de l'élément à partir duquel commencer le tri", correct: false}
    answer: "`key` est appelée une fois par élément, et le tri compare les résultats. Les fonctions de comparaison à deux arguments de Python 2 passent par `functools.cmp_to_key`."
  - key: tri-stable
    format: course
    question: "Que garantit un tri stable ?"
    choices:
      - {text: "Les éléments égaux pour la clé gardent leur ordre de départ", correct: true}
      - {text: "Le tri prend le même temps, quelle que soit l'entrée", correct: false}
      - {text: "Le tri ne modifie jamais la liste d'origine", correct: false}
      - {text: "Le tri n'utilise pas de mémoire en plus de la liste", correct: false}
    answer: "Le tri de Python (Timsort) est stable : trier des élèves par note garde, à note égale, l'ordre dans lequel ils étaient. On peut ainsi trier en plusieurs passes."
  - key: tri-deux-criteres
    format: course
    question: "Comment trier des élèves par note décroissante, puis par nom croissant ?"
    choices:
      - {text: "`sorted(eleves, key=lambda e: (-e.note, e.nom))`", correct: true}
      - {text: "`sorted(eleves, key=lambda e: (e.note, e.nom), reverse=True)`", correct: false}
      - {text: "`sorted(sorted(eleves, key=lambda e: e.note), key=lambda e: e.nom)`", correct: false}
      - {text: "`sorted(eleves, key=lambda e: e.note + e.nom)`", correct: false}
    answer: "Une clé tuple compare la note, puis le nom ; la note négative inverse son ordre seulement. `reverse=True` inverserait aussi les noms, et deux passes doivent trier le critère **secondaire** d'abord."
  - key: vf-sort-renvoie-liste
    format: true-false
    question: "`xs.sort()` renvoie la liste triée."
    truth: false
    answer: "`list.sort` trie sur place et renvoie `None`. Pour une nouvelle liste triée, c'est `sorted(xs)`."
  - key: vf-stable
    format: true-false
    question: "Le tri de Python est stable."
    truth: true
    answer: "C'est garanti par la documentation, pour `sorted` comme pour `list.sort`."
  - key: vf-types-incomparables
    format: true-false
    question: "`sorted([3, \"a\", 1])` lève une `TypeError`."
    truth: true
    answer: "Python 3 refuse de comparer un `str` et un `int` : `'<' not supported between instances of 'str' and 'int'`."
  - key: vf-reverse-et-inversion
    format: true-false
    question: "`sorted(xs, key=len, reverse=True)` donne toujours la même liste que `sorted(xs, key=len)[::-1]`."
    truth: false
    answer: "Avec `reverse=True`, les éléments de même longueur gardent leur ordre de départ ; inverser la liste triée les inverse aussi. `[\"ab\", \"cd\"]` donne `['ab', 'cd']` dans le premier cas, `['cd', 'ab']` dans le second."
  - key: qcm-sans-casse
    format: multiple-choice
    question: "Comment trier des mots sans tenir compte des majuscules ?"
    choices:
      - {text: "`sorted(mots, key=str.lower)`", correct: true}
      - {text: "`sorted(mots, key=str.lower())`", correct: false}
      - {text: "`sorted(mots.lower())`", correct: false}
      - {text: "`sorted(mots, ignore_case=True)`", correct: false}
    answer: "On passe la fonction `str.lower` sans l'appeler. `str.lower()` lève une `TypeError`, une liste n'a pas de méthode `lower`, et `ignore_case` n'existe pas."
  - key: qcm-decroissant
    format: multiple-choice
    question: "Comment obtenir les valeurs de `xs` triées de la plus grande à la plus petite ?"
    choices:
      - {text: "`sorted(xs, reverse=True)`", correct: true}
      - {text: "`sorted(xs, order=\"desc\")`", correct: false}
      - {text: "`sorted(xs).reverse()`", correct: false}
      - {text: "`list(reversed(xs))`", correct: false}
    answer: "`sorted(xs).reverse()` renvoie `None`, et `reversed` inverse l'ordre existant sans trier."
  - key: qcm-par-longueur
    format: multiple-choice
    question: "Comment trier des chaînes de la plus courte à la plus longue ?"
    choices:
      - {text: "`sorted(mots, key=len)`", correct: true}
      - {text: "`sorted(len(mots))`", correct: false}
      - {text: "`sorted(mots, key=len())`", correct: false}
      - {text: "`sorted(mots, cmp=len)`", correct: false}
    answer: "`key=len` calcule la longueur de chaque mot. `len(mots)` est un seul entier, et `cmp` n'existe plus depuis Python 3."
  - key: qcm-dict-par-valeur
    format: multiple-choice
    question: "Comment obtenir les paires `(clé, valeur)` du dictionnaire `stock`, triées par valeur ?"
    choices:
      - {text: "`sorted(stock.items(), key=lambda kv: kv[1])`", correct: true}
      - {text: "`sorted(stock, key=lambda kv: kv[1])`", correct: false}
      - {text: "`sorted(stock.values())`", correct: false}
      - {text: "`stock.sort(key=lambda kv: kv[1])`", correct: false}
    answer: "`items()` donne les paires, et la clé de tri prend le second élément. Trier `stock` seul parcourt ses clés ; un dictionnaire n'a pas de méthode `sort`."
  - key: trous-cle-longueur
    format: fill-in
    question: |-
      Complète pour trier les mots par longueur :
      ```python
      mots_tries = sorted(mots, ___=len)
      ```
    blanks:
      - [key]
    answer: "`key=len` : la longueur de chaque mot sert à comparer."
  - key: trous-decroissant
    format: fill-in
    question: |-
      Complète pour trier la liste sur place, de la plus grande valeur à la plus petite :
      ```python
      scores.sort(___=True)
      ```
    blanks:
      - [reverse]
    answer: "`reverse=True` inverse l'ordre du tri, en le gardant stable."
  - key: trous-copie-triee
    format: fill-in
    question: |-
      Complète pour obtenir une copie triée, sans modifier `notes` :
      ```python
      triees = ___(notes)
      ```
    blanks:
      - [sorted]
    answer: "`sorted` renvoie une nouvelle liste ; `notes.sort()` modifierait `notes`."
  - key: trous-lambda-prix
    format: fill-in
    question: |-
      Complète pour trier les produits par prix, le prix étant le second élément de chaque tuple :
      ```python
      produits.sort(key=lambda p: p[___])
      ```
    blanks:
      - ["1"]
    answer: "Les indices partent de 0 : le second élément est `p[1]`."
  - key: code-sort-none
    format: code-output
    question: |-
      ```python
      xs = [3, 1, 2]
      ys = xs.sort()
      print(xs, ys)
      ```
    answer: "`sort` trie `xs` sur place et renvoie `None`."
    check:
      output: "[1, 2, 3] None"
    choices:
      - {text: "`[1, 2, 3] None`", correct: true}
      - {text: "`[3, 1, 2] [1, 2, 3]`", correct: false}
      - {text: "`[1, 2, 3] [1, 2, 3]`", correct: false}
      - {text: "`None [1, 2, 3]`", correct: false}
  - key: code-stable-par-longueur
    format: code-output
    question: |-
      ```python
      mots = ["bb", "a", "cc", "d"]
      print(sorted(mots, key=len))
      ```
    answer: "Tri par longueur, et stable : `'a'` reste avant `'d'`, et `'bb'` avant `'cc'`, comme au départ."
    check:
      output: "['a', 'd', 'bb', 'cc']"
    choices:
      - {text: "`['a', 'd', 'bb', 'cc']`", correct: true}
      - {text: "`['d', 'a', 'cc', 'bb']`", correct: false}
      - {text: "`['a', 'bb', 'cc', 'd']`", correct: false}
      - {text: "`['a', 'd', 'cc', 'bb']`", correct: false}
  - key: code-majuscules
    format: code-output
    question: |-
      ```python
      print(sorted(["b", "C", "a"]), sorted("cab"))
      ```
    answer: "Les chaînes se comparent par code de caractère : les majuscules passent avant les minuscules. `sorted` renvoie toujours une liste, même à partir d'une chaîne."
    check:
      output: "['C', 'a', 'b'] ['a', 'b', 'c']"
    choices:
      - {text: "`['C', 'a', 'b'] ['a', 'b', 'c']`", correct: true}
      - {text: "`['a', 'b', 'C'] ['a', 'b', 'c']`", correct: false}
      - {text: "`['C', 'a', 'b'] abc`", correct: false}
      - {text: "`['a', 'b', 'C'] abc`", correct: false}
  - key: code-trier-tuples
    format: code-output
    question: |-
      ```python
      paires = [(2, "b"), (1, "z"), (2, "a")]
      print(sorted(paires))
      ```
    answer: "Les tuples se comparent élément par élément : d'abord le nombre, puis, à égalité, la lettre."
    check:
      output: "[(1, 'z'), (2, 'a'), (2, 'b')]"
    choices:
      - {text: "`[(1, 'z'), (2, 'a'), (2, 'b')]`", correct: true}
      - {text: "`[(1, 'z'), (2, 'b'), (2, 'a')]`", correct: false}
      - {text: "`[(2, 'a'), (2, 'b'), (1, 'z')]`", correct: false}
      - {text: "`[(2, 'b'), (2, 'a'), (1, 'z')]`", correct: false}
  - key: bug-sort-reaffecte
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: 'NoneType' object is not subscriptable` :
      ```python
      notes = [12, 8, 15]
      notes = notes.sort()
      print(notes[0])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `notes = sorted(notes)`, qui renvoie la liste triée", correct: true}
      - {text: "Écrire `notes = notes.sort(reverse=False)`, plus explicite", correct: false}
      - {text: "Écrire `notes = list(notes.sort())` pour obtenir une liste", correct: false}
      - {text: "Écrire `notes = notes.sorted()`, la méthode qui renvoie", correct: false}
    answer: |-
      ```python
      notes = [12, 8, 15]
      notes = sorted(notes)
      print(notes[0])
      ```
      `sort` renvoie `None` : réaffecter son résultat perd la liste. Soit `notes.sort()` seul, soit
      `notes = sorted(notes)`.
  - key: bug-key-appelee
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: unbound method str.lower() needs an argument` :
      ```python
      mots = ["Zoé", "ana", "Bob"]
      print(sorted(mots, key=str.lower()))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`key=str.lower`, sans les parenthèses", correct: true}
      - {text: "`key=str.lower(mots)`, avec la liste", correct: false}
      - {text: "`key=lambda: str.lower()`", correct: false}
      - {text: "`key=\"lower\"`, le nom de la méthode", correct: false}
    answer: |-
      ```python
      mots = ["Zoé", "ana", "Bob"]
      print(sorted(mots, key=str.lower))
      ```
      `key` attend une fonction, que `sorted` appellera sur chaque élément. Avec les parenthèses, on l'appelle tout de
      suite, sans argument.
  - key: bug-types-melanges
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: '<' not supported between instances of 'str' and 'int'` :
      ```python
      ages = [34, "100", 9]
      print(sorted(ages))
      ```
      Quelle correction trie ces âges dans l'ordre numérique ?
    choices:
      - {text: "`sorted(ages, key=int)`", correct: true}
      - {text: "`sorted(ages, key=str)`", correct: false}
      - {text: "`sorted(ages, reverse=True)`", correct: false}
      - {text: "`ages.sort()` à la place de `sorted`", correct: false}
    answer: |-
      ```python
      ages = [34, "100", 9]
      print(sorted(ages, key=int))
      ```
      `key=int` compare des entiers, sans changer les éléments. `key=str` compare des chaînes : `'100'` passerait avant
      `'34'` et `'9'`. Mieux vaut encore convertir les données dès leur lecture.
  - key: bug-reversed-sans-tri
    format: bug-fix
    question: |-
      Pour classer les scores du meilleur au moins bon, ce programme affiche `[60, 75, 40]` :
      ```python
      scores = [40, 75, 60]
      meilleurs = list(reversed(scores))
      print(meilleurs)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`sorted(scores, reverse=True)`", correct: true}
      - {text: "`sorted(reversed(scores))`", correct: false}
      - {text: "`scores[::-1]`", correct: false}
      - {text: "`list(reversed(sorted(scores, reverse=True)))`", correct: false}
    answer: |-
      ```python
      scores = [40, 75, 60]
      meilleurs = sorted(scores, reverse=True)
      print(meilleurs)
      ```
      `reversed` et `[::-1]` inversent l'ordre existant, sans trier. Trier puis inverser deux fois revient au tri
      croissant.
