notion: copies
lesson: |-
  En Python, une variable est un **nom** qui désigne un objet. **L'affectation ne copie jamais** : après `b = a`, les
  deux noms désignent la même liste, et une modification par l'un se voit par l'autre.

  ```python
  a = [1, 2]
  b = a
  b.append(3)
  a            # [1, 2, 3]
  b is a       # True : le même objet
  ```

  **La copie superficielle** crée un nouveau conteneur, mais garde les **mêmes éléments** :

  | Écriture | Pour |
  |---|---|
  | `list(xs)`, `xs[:]`, `xs.copy()` | une liste |
  | `dict(d)`, `d.copy()`, `{**d}` | un dictionnaire |
  | `set(s)`, `s.copy()` | un ensemble |
  | `copy.copy(x)` | n'importe quel objet |

  Ajouter ou retirer dans la copie ne touche pas l'original. Mais si les éléments sont mutables (des listes dans une
  liste), ils sont **partagés** :

  ```python
  a = [[1], [2]]
  b = a.copy()
  b.append([3])      # a ne change pas
  b[0].append(9)     # a vaut [[1, 9], [2]] : la sous-liste est la même
  ```

  **La copie profonde** copie récursivement tout ce qui est mutable : `copy.deepcopy(a)`. Elle coûte plus cher, et
  n'est utile que pour des éléments mutables qu'on va modifier. Pour une liste de nombres ou de chaînes (immuables),
  une copie superficielle suffit.

  **Le piège de `[[0] * 3] * 3`** : `*` répète la **référence** à la même sous-liste.

  ```python
  grille = [[0] * 3] * 3
  grille[0][0] = 1
  grille             # [[1, 0, 0], [1, 0, 0], [1, 0, 0]]
  grille = [[0] * 3 for _ in range(3)]   # trois sous-listes distinctes
  ```

  `[0] * 3` ne pose pas ce problème : les entiers sont immuables. `is` teste l'identité (le même objet), `==`
  l'égalité des valeurs.

  **En entretien** : « L'affectation ne copie pas : elle donne un second nom au même objet. Une copie superficielle
  (`list(xs)`, `xs.copy()`) crée un nouveau conteneur qui partage ses éléments ; `copy.deepcopy` copie aussi les objets
  imbriqués. `[[0] * 3] * 3` répète trois fois la même sous-liste : on écrit une compréhension. »
cards:
  - key: affectation-sans-copie
    format: course
    question: "Après `b = a`, où `a` est une liste, que désigne `b` ?"
    choices:
      - {text: "La même liste que `a` : aucune copie n'est faite", correct: true}
      - {text: "Une copie superficielle de la liste `a`", correct: false}
      - {text: "Une copie profonde de la liste `a`", correct: false}
      - {text: "Une vue en lecture seule sur la liste `a`", correct: false}
    answer: "L'affectation lie un nom à un objet existant. `b.append(x)` modifie donc la liste que `a` désigne aussi : `b is a` vaut `True`."
  - key: copie-superficielle
    format: course
    question: "Qu'est-ce qu'une copie superficielle d'une liste de listes ?"
    choices:
      - {text: "Une nouvelle liste extérieure, qui partage les mêmes sous-listes", correct: true}
      - {text: "Une nouvelle liste extérieure, avec de nouvelles sous-listes", correct: false}
      - {text: "Une liste qui ne garde que le premier niveau, aplati", correct: false}
      - {text: "Un second nom pour la même liste extérieure", correct: false}
    answer: "Seul le conteneur est neuf ; ses éléments sont les mêmes objets. Ajouter une ligne à la copie ne touche pas l'original, mais modifier une sous-liste, si."
  - key: quand-deepcopy
    format: course
    question: "Quand faut-il `copy.deepcopy(xs)` plutôt que `list(xs)` ?"
    choices:
      - {text: "Quand `xs` contient des objets mutables qu'on modifiera sans toucher l'original", correct: true}
      - {text: "Quand `xs` contient plus de mille éléments, pour aller plus vite", correct: false}
      - {text: "Quand `xs` ne contient que des nombres ou des chaînes de caractères", correct: false}
      - {text: "Quand on veut que la copie suive les modifications de l'original", correct: false}
    answer: "Pour des éléments immuables (nombres, chaînes, tuples de ceux-ci), la copie superficielle suffit. `deepcopy` parcourt tout l'objet : elle est plus lente."
  - key: piege-multiplication
    format: course
    question: "Pourquoi `[[0] * 3] * 3` est-il un piège ?"
    choices:
      - {text: "La liste contient trois fois la même sous-liste : en modifier une les modifie toutes", correct: true}
      - {text: "La liste contient neuf zéros à plat, et non trois lignes de trois zéros", correct: false}
      - {text: "Python refuse de multiplier une liste qui contient déjà une autre liste", correct: false}
      - {text: "La multiplication crée trois copies profondes, lentes à calculer", correct: false}
    answer: "`*` répète les références. `grille[0][0] = 1` change donc les trois lignes. On écrit `[[0] * 3 for _ in range(3)]`, qui crée une sous-liste à chaque tour."
  - key: vf-copy-et-tranche
    format: true-false
    question: "`xs.copy()` et `xs[:]` font la même copie superficielle."
    truth: true
    answer: "Les deux créent une nouvelle liste avec les mêmes éléments, comme `list(xs)`."
  - key: vf-deepcopy-independante
    format: true-false
    question: "Après `b = copy.deepcopy(a)`, modifier une sous-liste de `b` modifie aussi `a`."
    truth: false
    answer: "La copie profonde copie aussi les sous-listes : `a` et `b` ne partagent plus aucun objet mutable."
  - key: vf-is-et-egal
    format: true-false
    question: "Après `b = list(a)`, `b is a` vaut `False` mais `b == a` vaut `True`."
    truth: true
    answer: "`list(a)` crée un nouvel objet (identité différente) au même contenu (égalité)."
  - key: vf-list-copie-sous-listes
    format: true-false
    question: "`list(a)` copie aussi les sous-listes de `a`."
    truth: false
    answer: "`list(a)` est une copie superficielle : les sous-listes sont partagées. Il faut `copy.deepcopy(a)`."
  - key: qcm-grille-independante
    format: multiple-choice
    question: "Comment copier `grille`, une liste de listes, pour en modifier les cases sans toucher l'original ?"
    choices:
      - {text: "`copy.deepcopy(grille)`", correct: true}
      - {text: "`grille.copy()`", correct: false}
      - {text: "`grille[:]`", correct: false}
      - {text: "`list(grille)`", correct: false}
    answer: "Les trois autres sont des copies superficielles : les lignes resteraient partagées. `[ligne[:] for ligne in grille]` marche aussi pour deux niveaux."
  - key: qcm-creer-grille
    format: multiple-choice
    question: "Comment créer une grille de 3 lignes de 3 zéros, aux lignes indépendantes ?"
    choices:
      - {text: "`[[0] * 3 for _ in range(3)]`", correct: true}
      - {text: "`[[0] * 3] * 3`", correct: false}
      - {text: "`[[0, 0, 0]] * 3`", correct: false}
      - {text: "`[0] * 3 * 3`", correct: false}
    answer: "La compréhension évalue `[0] * 3` à chaque tour : trois listes distinctes. `* 3` sur une liste de listes répète la même ligne, et `[0] * 3 * 3` donne neuf zéros à plat."
  - key: qcm-meme-objet
    format: multiple-choice
    question: "Quel opérateur dit si deux noms désignent le même objet ?"
    choices:
      - {text: "`is`", correct: true}
      - {text: "`==`", correct: false}
      - {text: "`in`", correct: false}
      - {text: "`=`", correct: false}
    answer: "`is` compare l'identité, `==` les valeurs. Deux listes égales peuvent être deux objets distincts."
  - key: qcm-copier-dict
    format: multiple-choice
    question: "Comment copier superficiellement le dictionnaire `d` ?"
    choices:
      - {text: "`d.copy()`", correct: true}
      - {text: "`d[:]`", correct: false}
      - {text: "`d.clone()`", correct: false}
      - {text: "`d * 1`", correct: false}
    answer: "`d.copy()`, `dict(d)` ou `{**d}`. Un dictionnaire ne se découpe pas, n'a pas de `clone`, et ne se multiplie pas."
  - key: code-alias-plus-egal
    format: code-output
    question: |-
      ```python
      a = [1, 2]
      b = a
      b += [3]
      print(a)
      ```
    answer: "`b` désigne la même liste que `a`, et `+=` sur une liste la modifie sur place, comme `extend`."
    check:
      output: "[1, 2, 3]"
    choices:
      - {text: "`[1, 2, 3]`", correct: true}
      - {text: "`[1, 2]`", correct: false}
      - {text: "`[1, 2, [3]]`", correct: false}
      - {text: "`[3]`", correct: false}
  - key: code-grille-partagee
    format: code-output
    question: |-
      ```python
      grille = [[0] * 2] * 2
      grille[0][0] = 1
      print(grille)
      ```
    answer: "Les deux lignes sont la même liste : la modifier par `grille[0]` se voit aussi par `grille[1]`."
    check:
      output: "[[1, 0], [1, 0]]"
    choices:
      - {text: "`[[1, 0], [1, 0]]`", correct: true}
      - {text: "`[[1, 0], [0, 0]]`", correct: false}
      - {text: "`[[1, 1], [0, 0]]`", correct: false}
      - {text: "`[[1, 0, 0, 0]]`", correct: false}
  - key: code-superficielle
    format: code-output
    question: |-
      ```python
      a = [[1], [2]]
      b = a.copy()
      b[0].append(9)
      b.append([3])
      print(a)
      ```
    answer: "La sous-liste `[1]` est partagée : `a` voit le 9. Mais `b.append([3])` ne modifie que la nouvelle liste extérieure."
    check:
      output: "[[1, 9], [2]]"
    choices:
      - {text: "`[[1, 9], [2]]`", correct: true}
      - {text: "`[[1], [2]]`", correct: false}
      - {text: "`[[1, 9], [2], [3]]`", correct: false}
      - {text: "`[[1], [2], [3]]`", correct: false}
  - key: code-deepcopy
    format: code-output
    question: |-
      ```python
      import copy

      a = {"tags": ["x"]}
      b = copy.deepcopy(a)
      b["tags"].append("y")
      print(a, b is a)
      ```
    answer: "La copie profonde a sa propre liste `tags` : `a` ne change pas, et ce sont deux objets distincts."
    check:
      output: "{'tags': ['x']} False"
    choices:
      - {text: "`{'tags': ['x']} False`", correct: true}
      - {text: "`{'tags': ['x', 'y']} False`", correct: false}
      - {text: "`{'tags': ['x']} True`", correct: false}
      - {text: "`{'tags': ['x', 'y']} True`", correct: false}
  - key: bug-plateau-partage
    format: bug-fix
    question: |-
      Ce programme affiche `.X.` sur les trois lignes, au lieu de la seule ligne du milieu :
      ```python
      plateau = [["."] * 3] * 3
      plateau[1][1] = "X"
      for ligne in plateau:
          print("".join(ligne))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`plateau = [[\".\"] * 3 for _ in range(3)]`", correct: true}
      - {text: "`plateau = [[\".\", \".\", \".\"]] * 3`", correct: false}
      - {text: "`plateau = list([[\".\"] * 3] * 3)`", correct: false}
      - {text: "`plateau = [\".\" * 3] * 3`", correct: false}
    answer: |-
      ```python
      plateau = [["."] * 3 for _ in range(3)]
      plateau[1][1] = "X"
      for ligne in plateau:
          print("".join(ligne))
      ```
      `* 3` répète la même ligne trois fois. La compréhension en crée une nouvelle à chaque tour. `list(...)` copie
      la liste extérieure, mais pas les lignes, et des chaînes ne se modifient pas.
  - key: bug-copie-dict-imbrique
    format: bug-fix
    question: |-
      Ce programme affiche `['a', 'b']` : le modèle a changé, lui aussi.
      ```python
      modele = {"nom": "base", "options": ["a"]}
      config = modele.copy()
      config["options"].append("b")
      print(modele["options"])
      ```
      Quelle correction laisse `modele` intact ?
    choices:
      - {text: "`config = copy.deepcopy(modele)`, après `import copy`", correct: true}
      - {text: "`config = dict(modele)`, un nouveau dictionnaire", correct: false}
      - {text: "`config = {**modele}`, par déballage du modèle", correct: false}
      - {text: "`config = modele`, sans appeler `copy()`", correct: false}
    answer: |-
      ```python
      import copy

      modele = {"nom": "base", "options": ["a"]}
      config = copy.deepcopy(modele)
      config["options"].append("b")
      print(modele["options"])
      ```
      `copy()`, `dict()` et `{**d}` sont des copies superficielles : la liste `options` reste partagée.
  - key: bug-ligne-reutilisee
    format: bug-fix
    question: |-
      Ce programme affiche `[[1, 0], [1, 0]]` au lieu de `[[0, 0], [1, 0]]` :
      ```python
      ligne = [0, 0]
      tableau = []
      for i in range(2):
          ligne[0] = i
          tableau.append(ligne)
      print(tableau)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter une copie : `tableau.append(ligne.copy())`", correct: true}
      - {text: "Ajouter le premier élément : `tableau.append(ligne[0])`", correct: false}
      - {text: "Ajouter une liste qui l'entoure : `tableau.append([ligne])`", correct: false}
      - {text: "Étendre le tableau : `tableau += ligne` à chaque tour", correct: false}
    answer: |-
      ```python
      ligne = [0, 0]
      tableau = []
      for i in range(2):
          ligne[0] = i
          tableau.append(ligne.copy())
      print(tableau)
      ```
      Sans copie, le tableau contient deux fois la même liste, qui garde la dernière valeur. Créer `ligne` dans la
      boucle marche aussi.
  - key: bug-tri-de-l-original
    format: bug-fix
    question: |-
      Ce programme affiche `[1, 2, 3] [1, 2, 3]` : l'ordre d'origine est perdu.
      ```python
      originaux = [3, 1, 2]
      tries = originaux
      tries.sort()
      print(originaux, tries)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`tries = sorted(originaux)`, sans appeler `sort`", correct: true}
      - {text: "`tries = originaux.sort()`, en une seule ligne", correct: false}
      - {text: "`tries = [originaux]`, puis `tries.sort()`", correct: false}
      - {text: "`tries = reversed(originaux)`, sans appeler `sort`", correct: false}
    answer: |-
      ```python
      originaux = [3, 1, 2]
      tries = sorted(originaux)
      print(originaux, tries)
      ```
      `tries = originaux` ne copie pas : `sort` trie la liste que les deux noms désignent. `sorted` renvoie une
      nouvelle liste.
  - key: situation-coup-a-tester
    format: scenario
    question: |-
      Ton jeu garde l'état du plateau dans une liste de listes, et tu veux simuler un coup sans toucher au plateau
      réel. Que fais-tu ?
    choices:
      - {text: "Tu joues le coup sur `copy.deepcopy(plateau)`", correct: true}
      - {text: "Tu joues le coup sur `plateau.copy()`, plus rapide", correct: false}
      - {text: "Tu joues le coup sur `plateau[:]`, une copie complète", correct: false}
      - {text: "Tu joues le coup sur `tuple(plateau)`, qui est immuable", correct: false}
    answer: |-
      Jouer un coup modifie une case, donc une ligne : il faut des lignes neuves. `copy()` et `[:]` partagent les
      lignes, et `tuple(plateau)` garde des lignes mutables. Pour deux niveaux, `[ligne[:] for ligne in plateau]`
      suffit aussi.
  - key: situation-fonction-qui-trie
    format: scenario
    question: |-
      Une fonction `normaliser(valeurs)` trie la liste qu'elle reçoit avec `valeurs.sort()` ; ses appelants s'étonnent
      de voir leur liste changer. Que proposes-tu ?
    choices:
      - {text: "Qu'elle travaille sur `sorted(valeurs)` et renvoie son résultat", correct: true}
      - {text: "Qu'elle exige un tuple, pour qu'on ne lui passe plus de liste", correct: false}
      - {text: "Qu'elle appelle `valeurs.sort()` deux fois, pour retrouver l'ordre", correct: false}
      - {text: "Qu'elle garde `sort`, et que sa documentation prévienne les appelants", correct: false}
    answer: |-
      Une fonction qui modifie ses arguments surprend. `sorted` crée une nouvelle liste et laisse celle de l'appelant
      intacte ; la fonction renvoie le résultat.
  - key: situation-cache-partage
    format: scenario
    question: |-
      Un cache renvoie la même liste à tous ses appelants ; l'un d'eux y ajoute un élément, et les autres le voient.
      Que fais-tu ?
    choices:
      - {text: "Le cache renvoie un tuple, ou une copie de sa liste", correct: true}
      - {text: "Chaque appelant retire, à la fin, ce qu'il a ajouté", correct: false}
      - {text: "Le cache vide sa liste après chaque lecture", correct: false}
      - {text: "Le cache renvoie la liste dans une variable globale", correct: false}
    answer: |-
      Un objet mutable partagé se modifie pour tout le monde. Un tuple ne peut pas être modifié ; une copie isole
      chaque appelant, au prix d'une allocation.
  - key: situation-deepcopy-partout
    format: scenario
    question: |-
      Un collègue met `copy.deepcopy` partout « par sécurité », sur des listes de milliers de nombres. Que lui dis-tu ?
    choices:
      - {text: "Que pour des éléments immuables, `list(xs)` suffit et coûte bien moins", correct: true}
      - {text: "Qu'il a raison : `deepcopy` est la seule copie fiable en Python", correct: false}
      - {text: "Qu'il vaut mieux `xs[:]`, qui copie aussi en profondeur", correct: false}
      - {text: "Qu'une simple affectation `ys = xs` copie déjà la liste", correct: false}
    answer: |-
      Les nombres sont immuables : les partager ne pose aucun problème. `deepcopy` parcourt chaque objet et tient un
      registre des objets déjà copiés ; c'est bien plus lent qu'une copie superficielle.
