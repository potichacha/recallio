notion: counter
lesson: |-
  `collections.Counter` compte des éléments. C'est une **sous-classe de `dict`** dont les valeurs sont des comptes.

  ```python
  from collections import Counter

  mots = "le chat et le chien".split()
  compte = Counter(mots)        # Counter({'le': 2, 'chat': 1, 'et': 1, 'chien': 1})
  Counter("abracadabra")        # une chaîne : compte ses caractères
  Counter(a=3, b=1)             # ou des comptes donnés directement
  ```

  **Une clé absente vaut 0**, sans `KeyError`, et sans être ajoutée par la lecture :

  ```python
  compte["loup"]                # 0
  compte["loup"] += 1           # marche sans initialisation
  ```

  **Les méthodes utiles**

  | Écriture | Effet |
  |---|---|
  | `c.most_common(n)` | les `n` plus fréquents, en paires `(élément, compte)`, du plus au moins fréquent ; à égalité, dans l'ordre de première apparition |
  | `c.update(iterable)` | **ajoute** les comptes (là où `dict.update` remplacerait) |
  | `c.subtract(iterable)` | retire des comptes, qui peuvent devenir négatifs |
  | `c.total()` | la somme des comptes (Python 3.10) |
  | `c.elements()` | chaque élément répété autant de fois que son compte |

  **L'arithmétique** : `c1 + c2` additionne les comptes, `c1 - c2` les soustrait **en ne gardant que les comptes
  positifs**, `c1 & c2` garde le minimum, `c1 | c2` le maximum.

  ```python
  stock = Counter(pomme=3, kiwi=1)
  vendu = Counter(pomme=1, kiwi=2)
  stock - vendu                 # Counter({'pomme': 2}) : kiwi, à -1, disparaît
  ```

  Deux `Counter` égaux ont les mêmes comptes : `Counter("chien") == Counter("niche")` teste si deux mots sont des
  anagrammes.

  **En entretien** : « `Counter` est un dictionnaire qui compte : on lui passe un itérable, une clé absente vaut 0, et
  `most_common(n)` donne les `n` éléments les plus fréquents. `update` ajoute des comptes au lieu de les remplacer, et
  `+` ou `-` combinent deux compteurs. »
tour:
  - title: Compter avec Counter
    text: |-
      `Counter`, du module `collections`, compte les éléments d'un itérable : des mots, des lettres, des
      identifiants.

      - Une clé absente vaut 0, sans erreur.
      - `most_common(n)` donne les `n` éléments les plus fréquents, avec leur compte.
      - `update` ajoute de nouveaux éléments aux comptes existants.

      Essaie : compte les lettres de ton prénom, et affiche la plus fréquente.
    example:
      files:
        main.py: |-
          from collections import Counter

          mots = "le chat et le chien et le rat".split()
          compte = Counter(mots)
          print(compte["le"], compte["et"], compte["loup"])
          print(compte.most_common(2))

          lettres = Counter("abracadabra")
          print(lettres.most_common(1))
          lettres.update("aaa")
          print(lettres["a"], lettres.total())
      output: |-
        3 2 0
        [('le', 3), ('et', 2)]
        [('a', 5)]
        8 14
cards:
  - key: cle-absente
    format: course
    question: "Que renvoie `c[\"x\"]` sur un `Counter` qui n'a jamais vu `\"x\"` ?"
    choices:
      - {text: "`0`, sans lever d'erreur", correct: true}
      - {text: "Une `KeyError`, comme un dictionnaire", correct: false}
      - {text: "`None`, comme `dict.get`", correct: false}
      - {text: "`1`, et la clé est ajoutée", correct: false}
    answer: "Un `Counter` renvoie 0 pour une clé absente, sans l'ajouter. C'est ce qui permet `c[x] += 1` sans initialisation."
  - key: most-common
    format: course
    question: "Que renvoie `c.most_common(2)` ?"
    choices:
      - {text: "Les deux éléments les plus fréquents, en paires `(élément, compte)`", correct: true}
      - {text: "Les deux éléments les plus fréquents, sans leur compte", correct: false}
      - {text: "Les comptes des deux premiers éléments insérés", correct: false}
      - {text: "Un `Counter` réduit aux deux éléments les plus fréquents", correct: false}
    answer: "Une liste de tuples, du plus fréquent au moins fréquent : `[('a', 5), ('b', 2)]`. Sans argument, `most_common()` les donne tous."
  - key: counter-est-un-dict
    format: course
    question: "Qu'est-ce qu'un `Counter`, du point de vue des types ?"
    choices:
      - {text: "Une sous-classe de `dict`, dont les valeurs sont des comptes", correct: true}
      - {text: "Une sous-classe de `list`, triée par fréquence", correct: false}
      - {text: "Un type à part, sans rapport avec `dict`", correct: false}
      - {text: "Un `set` qui accepte les doublons", correct: false}
    answer: "Tout ce qui marche sur un dictionnaire marche sur un `Counter` : `items()`, `keys()`, `in`, `del`. Il ajoute le comptage."
  - key: update-additionne
    format: course
    question: "Que fait `c.update([\"a\", \"a\"])` sur un `Counter` ?"
    choices:
      - {text: "Il ajoute 2 au compte de `\"a\"`", correct: true}
      - {text: "Il remplace le compte de `\"a\"` par 2", correct: false}
      - {text: "Il ajoute la liste comme une seule clé", correct: false}
      - {text: "Il remplace tout le `Counter` par `{'a': 2}`", correct: false}
    answer: "Contrairement à `dict.update`, qui remplace les valeurs, `Counter.update` compte les éléments reçus et les ajoute aux comptes existants."
  - key: vf-keyerror
    format: true-false
    question: "Lire une clé absente d'un `Counter` lève une `KeyError`."
    truth: false
    answer: "Elle vaut 0. C'est la grande différence avec un dictionnaire ordinaire."
  - key: vf-total
    format: true-false
    question: "`Counter(\"aab\").total()` vaut 3."
    truth: true
    answer: "`total()` (Python 3.10) additionne les comptes : 2 + 1."
  - key: vf-soustraction-negative
    format: true-false
    question: "La soustraction `c1 - c2` de deux `Counter` garde les comptes négatifs."
    truth: false
    answer: "L'opérateur `-` ne garde que les comptes strictement positifs. La méthode `subtract`, elle, garde les négatifs."
  - key: vf-increment
    format: true-false
    question: "`c[x] += 1` marche sur un `Counter`, même si `x` n'y est pas encore."
    truth: true
    answer: "La lecture renvoie 0 pour une clé absente, puis l'affectation crée la clé avec 1."
  - key: qcm-import
    format: multiple-choice
    question: "Comment importer `Counter` ?"
    choices:
      - {text: "`from collections import Counter`", correct: true}
      - {text: "`import Counter`", correct: false}
      - {text: "`from itertools import Counter`", correct: false}
      - {text: "`from counter import Counter`", correct: false}
    answer: "`Counter` vit dans le module `collections`, avec `defaultdict`, `deque` et `namedtuple`."
  - key: qcm-le-plus-frequent
    format: multiple-choice
    question: "Comment obtenir l'élément le plus fréquent de `c`, avec son compte ?"
    choices:
      - {text: "`c.most_common(1)[0]`", correct: true}
      - {text: "`c.most_common(1)`", correct: false}
      - {text: "`max(c)`", correct: false}
      - {text: "`c[0]`", correct: false}
    answer: "`most_common(1)` renvoie une liste d'une paire : `[0]` en extrait la paire. `max(c)` donne la plus grande **clé**, et `c[0]` le compte de la clé 0."
  - key: qcm-compter-mots
    format: multiple-choice
    question: "Comment compter les mots d'un texte ?"
    choices:
      - {text: "`Counter(texte.split())`", correct: true}
      - {text: "`Counter(texte)`", correct: false}
      - {text: "`texte.count()`", correct: false}
      - {text: "`Counter().most_common(texte)`", correct: false}
    answer: "`split()` découpe le texte en mots. `Counter(texte)` compterait les caractères, car une chaîne s'itère caractère par caractère."
  - key: qcm-additionner
    format: multiple-choice
    question: "Que donne `Counter(a=1) + Counter(a=2, b=1)` ?"
    choices:
      - {text: "`Counter({'a': 3, 'b': 1})`", correct: true}
      - {text: "`Counter({'a': 2, 'b': 1})`", correct: false}
      - {text: "`Counter({'a': 1})`", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "`+` additionne les comptes clé par clé. Le deuxième choix serait le résultat de `|`, qui garde le maximum."
  - key: trous-most-common
    format: fill-in
    question: |-
      Complète pour obtenir les trois mots les plus fréquents :
      ```python
      compte = Counter(mots)
      print(compte.___(3))
      ```
    blanks:
      - [most_common]
    answer: "`most_common(3)` donne les trois paires `(mot, compte)` les plus fréquentes."
  - key: trous-import
    format: fill-in
    question: |-
      Complète l'import :
      ```python
      from ___ import Counter
      ```
    blanks:
      - [collections]
    answer: "`Counter` vient du module `collections`."
  - key: trous-construire
    format: fill-in
    question: |-
      Complète pour compter les lettres de `mot` :
      ```python
      lettres = ___(mot)
      ```
    blanks:
      - [Counter]
    answer: "Une chaîne est un itérable de caractères : `Counter(mot)` compte chaque lettre."
  - key: trous-total
    format: fill-in
    question: |-
      Complète pour obtenir la somme de tous les comptes (Python 3.10) :
      ```python
      print(compte.___())
      ```
    blanks:
      - [total]
    answer: "`total()` vaut `sum(compte.values())`."
  - key: code-absent-non-ajoute
    format: code-output
    question: |-
      ```python
      from collections import Counter

      c = Counter("hello")
      print(c["l"], c["z"], len(c))
      ```
    answer: "`l` apparaît deux fois ; `z` vaut 0, et le lire ne l'ajoute pas : quatre lettres distinctes."
    check:
      output: "2 0 4"
    choices:
      - {text: "`2 0 4`", correct: true}
      - {text: "`2 0 5`", correct: false}
      - {text: "`2 None 4`", correct: false}
      - {text: "`1 0 4`", correct: false}
  - key: code-most-common
    format: code-output
    question: |-
      ```python
      from collections import Counter

      print(Counter("aabbbc").most_common(2))
      ```
    answer: "Une liste de paires, la plus fréquente d'abord : `b` (3), puis `a` (2)."
    check:
      output: "[('b', 3), ('a', 2)]"
    choices:
      - {text: "`[('b', 3), ('a', 2)]`", correct: true}
      - {text: "`[('a', 2), ('b', 3)]`", correct: false}
      - {text: "`['b', 'a']`", correct: false}
      - {text: "`{'b': 3, 'a': 2}`", correct: false}
  - key: code-soustraction
    format: code-output
    question: |-
      ```python
      from collections import Counter

      stock = Counter(pomme=3, kiwi=1)
      vendu = Counter(pomme=1, kiwi=2)
      print(stock - vendu)
      ```
    answer: "`-` ne garde que les comptes positifs : kiwi, à -1, disparaît."
    check:
      output: "Counter({'pomme': 2})"
    choices:
      - {text: "`Counter({'pomme': 2})`", correct: true}
      - {text: "`Counter({'pomme': 2, 'kiwi': -1})`", correct: false}
      - {text: "`Counter({'pomme': 2, 'kiwi': 0})`", correct: false}
      - {text: "`Counter({'pomme': 4, 'kiwi': 3})`", correct: false}
  - key: code-elements
    format: code-output
    question: |-
      ```python
      from collections import Counter

      c = Counter(x=2, y=1)
      print(sorted(c.elements()), c.total())
      ```
    answer: "`elements()` répète chaque élément autant de fois que son compte ; `total()` vaut 3."
    check:
      output: "['x', 'x', 'y'] 3"
    choices:
      - {text: "`['x', 'x', 'y'] 3`", correct: true}
      - {text: "`['x', 'y'] 3`", correct: false}
      - {text: "`['x', 'x', 'y'] 2`", correct: false}
      - {text: "`[('x', 2), ('y', 1)] 3`", correct: false}
