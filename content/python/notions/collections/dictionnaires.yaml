notion: dictionnaires
lesson: |-
  Un **dictionnaire** (`dict`) associe des **clés** à des **valeurs**. C'est une table de hachage : lire, écrire ou
  tester une clé coûte O(1) en moyenne.

  ```python
  ages = {"ana": 31, "bob": 27}
  ages["eve"] = 22         # ajoute une clé
  ages["bob"] = 28         # remplace la valeur d'une clé existante
  ages["ana"]              # 31
  "eve" in ages            # True : `in` teste les clés
  len(ages)                # 3
  del ages["ana"]          # retire une clé
  ```

  **Une clé absente** : `ages["zoé"]` lève une `KeyError: 'zoé'`. Pour une valeur par défaut :

  | Écriture | Clé présente | Clé absente |
  |---|---|---|
  | `d[k]` | la valeur | `KeyError` |
  | `d.get(k)` | la valeur | `None` |
  | `d.get(k, defaut)` | la valeur | `defaut` |
  | `d.setdefault(k, defaut)` | la valeur | **ajoute** `k: defaut`, puis le renvoie |
  | `d.pop(k)` | retire et renvoie la valeur | `KeyError` |
  | `d.pop(k, defaut)` | retire et renvoie la valeur | `defaut` |

  ```python
  compte = {}
  for mot in ["a", "b", "a"]:
      compte[mot] = compte.get(mot, 0) + 1        # {'a': 2, 'b': 1}

  groupes = {}
  for mot in ["ane", "bol", "abri"]:
      groupes.setdefault(mot[0], []).append(mot)  # {'a': ['ane', 'abri'], 'b': ['bol']}
  ```

  **Parcourir** : `for k in d` parcourt les clés ; `d.items()` donne les paires, `d.values()` les valeurs.

  ```python
  for nom, age in ages.items():
      print(nom, age)
  ```

  **L'ordre d'insertion est garanti** depuis Python 3.7 : un dictionnaire se parcourt dans l'ordre où ses clés ont été
  ajoutées. Remplacer la valeur d'une clé ne change pas sa place.

  **Les clés doivent être hachables** : nombres, chaînes, tuples de valeurs hachables. Une liste ne peut pas être une
  clé. Les valeurs, elles, peuvent être n'importe quoi. Deux clés égales n'en font qu'une : `1`, `1.0` et `True` sont
  la même clé.

  Pour construire un dictionnaire : `dict(a=1, b=2)`, `dict(zip(cles, valeurs))`, ou une compréhension.

  **En entretien** : « Un dictionnaire est une table de hachage : accès, ajout et test d'appartenance en O(1) en
  moyenne, avec des clés hachables. `d[k]` lève une `KeyError` si la clé manque ; `get` renvoie une valeur par défaut et
  `setdefault` l'insère. Depuis Python 3.7, il garde l'ordre d'insertion. »
tour:
  - title: Les dictionnaires
    text: |-
      Un dictionnaire associe des clés à des valeurs : `{"ana": 31}`. On lit et on écrit par la clé, entre crochets.

      - Lire une clé absente lève une `KeyError` ; `d.get(k, defaut)` renvoie une valeur par défaut.
      - `k in d` teste si la clé existe.
      - `d.items()` donne les paires `(clé, valeur)`, à déballer dans la boucle.
      - Les clés restent dans l'ordre où on les a ajoutées.

      Essaie : affiche `ages["zoé"]`, puis remplace-le par `ages.get("zoé", "inconnue")`.
    example:
      files:
        main.py: |-
          ages = {"ana": 31, "bob": 27}
          ages["eve"] = 22
          ages["bob"] += 1
          print(ages)
          print(ages["ana"], ages.get("zoé"), ages.get("zoé", 0))
          print("eve" in ages, len(ages))

          for nom, age in ages.items():
              print(nom, "a", age, "ans")

          del ages["ana"]
          print(list(ages))
      output: |-
        {'ana': 31, 'bob': 28, 'eve': 22}
        31 None 0
        True 3
        ana a 31 ans
        bob a 28 ans
        eve a 22 ans
        ['bob', 'eve']
    task:
      instructions: |-
        Compte les occurrences de chaque lettre de `"banane"` dans le dictionnaire `compte` : le programme doit afficher
        `{'b': 1, 'a': 2, 'n': 2, 'e': 1}`.
      starter:
        main.py: |-
          compte = {}
          for lettre in "banane":
              pass
          print(compte)
      solution:
        main.py: |-
          compte = {}
          for lettre in "banane":
              compte[lettre] = compte.get(lettre, 0) + 1
          print(compte)
      output: |-
        {'b': 1, 'a': 2, 'n': 2, 'e': 1}
cards:
  - key: crochets-ou-get
    format: course
    question: "Quelle différence entre `d[\"k\"]` et `d.get(\"k\")` quand la clé est absente ?"
    choices:
      - {text: "`d[\"k\"]` lève une `KeyError` ; `d.get(\"k\")` renvoie `None`", correct: true}
      - {text: "`d[\"k\"]` renvoie `None` ; `d.get(\"k\")` lève une `KeyError`", correct: false}
      - {text: "Les deux lèvent une `KeyError`, seul le message change", correct: false}
      - {text: "Les deux renvoient `None` ; `get` est juste plus lisible", correct: false}
    answer: "`get` accepte aussi une valeur par défaut : `d.get(\"k\", 0)`. Les crochets conviennent quand l'absence de la clé est une erreur."
  - key: ordre-des-cles
    format: course
    question: "Dans quel ordre un dictionnaire rend-il ses clés, depuis Python 3.7 ?"
    choices:
      - {text: "Dans l'ordre où elles ont été insérées", correct: true}
      - {text: "Dans l'ordre croissant des clés", correct: false}
      - {text: "Dans un ordre qui dépend du hachage", correct: false}
      - {text: "Dans l'ordre inverse de leur insertion", correct: false}
    answer: "L'ordre d'insertion est garanti par le langage depuis Python 3.7. Remplacer la valeur d'une clé ne la déplace pas ; la retirer puis la remettre la place à la fin."
  - key: role-de-setdefault
    format: course
    question: "Que fait `d.setdefault(k, [])` ?"
    choices:
      - {text: "Renvoie `d[k]`, après l'avoir créée avec `[]` si elle manquait", correct: true}
      - {text: "Remplace toujours `d[k]` par `[]`, puis renvoie la nouvelle valeur", correct: false}
      - {text: "Renvoie `[]` si `k` manque, sans rien ajouter au dictionnaire", correct: false}
      - {text: "Fixe la valeur par défaut de toutes les clés absentes", correct: false}
    answer: "`setdefault` insère la valeur par défaut seulement si la clé manque, puis renvoie la valeur de la clé. D'où `d.setdefault(k, []).append(v)` pour grouper."
  - key: in-sur-un-dict
    format: course
    question: "Que teste `x in d` pour un dictionnaire `d` ?"
    choices:
      - {text: "Si `x` est une des clés", correct: true}
      - {text: "Si `x` est une des valeurs", correct: false}
      - {text: "Si `x` est une clé ou une valeur", correct: false}
      - {text: "Si `x` est une paire `(clé, valeur)`", correct: false}
    answer: "`in` teste les clés, en O(1). Pour les valeurs : `x in d.values()`, qui parcourt tout, en O(n)."
  - key: vf-cle-absente
    format: true-false
    question: "Lire `d[\"inconnue\"]` sur un dictionnaire qui n'a pas cette clé renvoie `None`."
    truth: false
    answer: "Les crochets lèvent une `KeyError`. C'est `d.get(\"inconnue\")` qui renvoie `None`."
  - key: vf-ordre-insertion
    format: true-false
    question: "Un dictionnaire garde l'ordre d'insertion de ses clés."
    truth: true
    answer: "Garanti depuis Python 3.7 (et vrai dans CPython 3.6)."
  - key: vf-remplacer-valeur
    format: true-false
    question: "Affecter `d[k] = v` à une clé qui existe déjà remplace son ancienne valeur."
    truth: true
    answer: "Une clé est unique : l'affectation remplace la valeur, sans créer de doublon ni changer la place de la clé."
  - key: vf-pop-avec-defaut
    format: true-false
    question: "`d.pop(\"k\", None)` lève une `KeyError` si la clé est absente."
    truth: false
    answer: "Avec une valeur par défaut, `pop` la renvoie si la clé manque. Seul `d.pop(\"k\")`, sans défaut, lève une `KeyError`."
  - key: qcm-parcourir-paires
    format: multiple-choice
    question: "Comment parcourir les clés et les valeurs du dictionnaire `d` ensemble ?"
    choices:
      - {text: "`for k, v in d.items():`", correct: true}
      - {text: "`for k, v in d:`", correct: false}
      - {text: "`for k, v in d.keys():`", correct: false}
      - {text: "`for k, v in enumerate(d):`", correct: false}
    answer: "`items()` donne les paires `(clé, valeur)`. Parcourir `d` ou `d.keys()` ne donne que les clés, et `enumerate(d)` des paires `(indice, clé)`."
  - key: qcm-valeur-par-defaut
    format: multiple-choice
    question: "Comment lire `stock[\"kiwi\"]`, ou 0 si la clé manque ?"
    choices:
      - {text: "`stock.get(\"kiwi\", 0)`", correct: true}
      - {text: "`stock[\"kiwi\", 0]`", correct: false}
      - {text: "`stock.get(\"kiwi\") or None`", correct: false}
      - {text: "`stock.setdefault(0, \"kiwi\")`", correct: false}
    answer: "Le second argument de `get` est la valeur par défaut. `stock[\"kiwi\", 0]` cherche la clé tuple `(\"kiwi\", 0)`."
  - key: qcm-retirer-cle
    format: multiple-choice
    question: "Comment retirer la clé `\"bob\"` de `ages` et récupérer sa valeur ?"
    choices:
      - {text: "`age = ages.pop(\"bob\")`", correct: true}
      - {text: "`age = del ages[\"bob\"]`", correct: false}
      - {text: "`age = ages.remove(\"bob\")`", correct: false}
      - {text: "`age = ages.discard(\"bob\")`", correct: false}
    answer: "`pop` retire et renvoie la valeur. `del` est une instruction, qui ne renvoie rien ; `remove` et `discard` sont des méthodes de liste et d'ensemble."
  - key: qcm-depuis-deux-listes
    format: multiple-choice
    question: "Comment construire un dictionnaire à partir des listes `noms` et `ages`, de même longueur ?"
    choices:
      - {text: "`dict(zip(noms, ages))`", correct: true}
      - {text: "`dict(noms, ages)`", correct: false}
      - {text: "`{noms: ages}`", correct: false}
      - {text: "`dict(enumerate(noms, ages))`", correct: false}
    answer: "`zip` donne les paires `(nom, âge)`, et `dict` accepte un itérable de paires. `{noms: ages}` essaierait d'utiliser une liste comme clé."
  - key: trous-compter-mots
    format: fill-in
    question: |-
      Complète pour compter les mots :
      ```python
      compte = {}
      for mot in mots:
          compte[mot] = compte.___(mot, 0) + 1
      ```
    blanks:
      - [get]
    answer: "`get(mot, 0)` renvoie 0 la première fois qu'on voit le mot."
  - key: trous-items
    format: fill-in
    question: |-
      Complète pour afficher chaque produit avec son prix :
      ```python
      for produit, prix in catalogue.___():
          print(produit, prix)
      ```
    blanks:
      - [items]
    answer: "`items()` donne les paires `(clé, valeur)`."
  - key: trous-grouper
    format: fill-in
    question: |-
      Complète pour grouper les mots par initiale :
      ```python
      groupes = {}
      for mot in mots:
          groupes.___(mot[0], []).append(mot)
      ```
    blanks:
      - [setdefault]
    answer: "`setdefault` crée la liste vide si l'initiale est nouvelle, puis la renvoie pour l'`append`."
  - key: trous-tester-cle
    format: fill-in
    question: |-
      Complète pour tester si la clé `"eve"` est présente :
      ```python
      if "eve" ___ ages:
          print(ages["eve"])
      ```
    blanks:
      - [in]
    answer: "`in` teste les clés d'un dictionnaire, en temps constant."
  - key: code-ordre-insertion
    format: code-output
    question: |-
      ```python
      d = {"b": 1, "a": 2}
      d["c"] = 3
      d["b"] = 4
      print(list(d))
      ```
    answer: "Les clés gardent leur ordre d'insertion ; remplacer la valeur de `'b'` ne la déplace pas."
    check:
      output: "['b', 'a', 'c']"
    choices:
      - {text: "`['b', 'a', 'c']`", correct: true}
      - {text: "`['a', 'b', 'c']`", correct: false}
      - {text: "`['a', 'c', 'b']`", correct: false}
      - {text: "`['b', 'a', 'c', 'b']`", correct: false}
  - key: code-get-defaut
    format: code-output
    question: |-
      ```python
      d = {"a": 0}
      print(d.get("a", 5), d.get("z", 5), d.get("z"))
      ```
    answer: "La clé `'a'` existe : sa valeur 0 est renvoyée, même fausse. Pour `'z'`, la valeur par défaut, ou `None`."
    check:
      output: "0 5 None"
    choices:
      - {text: "`0 5 None`", correct: true}
      - {text: "`5 5 None`", correct: false}
      - {text: "`0 5 5`", correct: false}
      - {text: "`0 None None`", correct: false}
  - key: code-setdefault
    format: code-output
    question: |-
      ```python
      d = {}
      d.setdefault("x", []).append(1)
      d.setdefault("x", []).append(2)
      print(d)
      ```
    answer: "Le premier appel crée la liste ; le second trouve la clé et renvoie la même liste."
    check:
      output: "{'x': [1, 2]}"
    choices:
      - {text: "`{'x': [1, 2]}`", correct: true}
      - {text: "`{'x': [2]}`", correct: false}
      - {text: "`{'x': [[1], [2]]}`", correct: false}
      - {text: "`{}`", correct: false}
  - key: code-cles-egales
    format: code-output
    question: |-
      ```python
      d = {1: "un", 1.0: "flottant", True: "vrai"}
      print(d)
      ```
    answer: "`1`, `1.0` et `True` sont égaux et ont le même hachage : c'est une seule clé. Elle garde sa première forme, `1`, et prend la dernière valeur."
    check:
      output: "{1: 'vrai'}"
    choices:
      - {text: "`{1: 'vrai'}`", correct: true}
      - {text: "`{1: 'un', 1.0: 'flottant', True: 'vrai'}`", correct: false}
      - {text: "`{True: 'vrai'}`", correct: false}
      - {text: "`{1: 'un'}`", correct: false}
  - key: bug-compteur-keyerror
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `KeyError: 'a'` :
      ```python
      compte = {}
      for lettre in "aba":
          compte[lettre] += 1
      print(compte)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`compte[lettre] = compte.get(lettre, 0) + 1`", correct: true}
      - {text: "`compte[lettre] = compte[lettre] + 1`", correct: false}
      - {text: "`compte[lettre] += compte.get(lettre)`", correct: false}
      - {text: "`compte.get(lettre) += 1`", correct: false}
    answer: |-
      ```python
      compte = {}
      for lettre in "aba":
          compte[lettre] = compte.get(lettre, 0) + 1
      print(compte)
      ```
      `+=` lit d'abord `compte[lettre]`, absent la première fois. `get` fournit 0. On ne peut pas affecter à un appel
      de méthode : `compte.get(lettre) += 1` est une `SyntaxError`.
  - key: bug-in-sur-les-valeurs
    format: bug-fix
    question: |-
      Ce programme affiche `absente`, alors que Paris est une des capitales :
      ```python
      capitales = {"France": "Paris", "Italie": "Rome"}
      if "Paris" in capitales:
          print("trouvée")
      else:
          print("absente")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if \"Paris\" in capitales.values():`", correct: true}
      - {text: "`if \"Paris\" in capitales.keys():`", correct: false}
      - {text: "`if \"Paris\" in capitales.items():`", correct: false}
      - {text: "`if capitales.get(\"Paris\"):`", correct: false}
    answer: |-
      ```python
      capitales = {"France": "Paris", "Italie": "Rome"}
      if "Paris" in capitales.values():
          print("trouvée")
      else:
          print("absente")
      ```
      `in` sur un dictionnaire teste les clés, comme `keys()` et `get`. `items()` contient des paires, pas des
      chaînes.
  - key: bug-get-valeur-nulle
    format: bug-fix
    question: |-
      Ce programme affiche `pomme inconnue`, alors que la clé existe, avec un stock à 0 :
      ```python
      stock = {"pomme": 0, "kiwi": 4}
      if stock.get("pomme"):
          print("pomme connue")
      else:
          print("pomme inconnue")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if \"pomme\" in stock:`", correct: true}
      - {text: "`if stock.get(\"pomme\", 0):`", correct: false}
      - {text: "`if stock[\"pomme\"]:`", correct: false}
      - {text: "`if bool(stock.get(\"pomme\")):`", correct: false}
    answer: |-
      ```python
      stock = {"pomme": 0, "kiwi": 4}
      if "pomme" in stock:
          print("pomme connue")
      else:
          print("pomme inconnue")
      ```
      La valeur 0 est fausse dans un `if` : tester la valeur ne dit pas si la clé existe. `in` teste la clé.
  - key: bug-premiere-cle
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: 'dict_keys' object is not subscriptable` :
      ```python
      ages = {"ana": 31, "bob": 27}
      premier = ages.keys()[0]
      print(premier)
      ```
      Quelle correction affiche la première clé insérée ?
    choices:
      - {text: "`premier = list(ages)[0]`", correct: true}
      - {text: "`premier = ages[0]`", correct: false}
      - {text: "`premier = ages.keys(0)`", correct: false}
      - {text: "`premier = ages.items()[0]`", correct: false}
    answer: |-
      ```python
      ages = {"ana": 31, "bob": 27}
      premier = list(ages)[0]
      print(premier)
      ```
      `keys()` renvoie une vue, qui ne s'indexe pas. `ages[0]` cherche la clé 0 (`KeyError`). `next(iter(ages))`
      évite de copier toutes les clés.
