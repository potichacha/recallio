notion: dict-vues
lesson: |-
  `d.keys()`, `d.values()` et `d.items()` ne renvoient pas des listes, mais des **vues** : des objets légers
  (`dict_keys`, `dict_values`, `dict_items`) qui regardent le dictionnaire sans le copier.

  **Une vue est dynamique** : elle reflète les changements du dictionnaire, faits après sa création.

  ```python
  d = {"a": 1}
  cles = d.keys()
  d["b"] = 2
  cles             # dict_keys(['a', 'b'])
  len(cles)        # 2
  ```

  Pour une photo figée, on copie : `list(d)`, `list(d.items())`, `set(d)`.

  **Ce qu'une vue permet**

  | Opération | `keys()` | `items()` | `values()` |
  |---|---|---|---|
  | parcourir, `len`, `in` | oui | oui (`(k, v) in d.items()`) | oui, mais `in` est en O(n) |
  | opérations d'ensemble `&`, `\|`, `-`, `^` | oui | oui, si les valeurs sont hachables | non |
  | indexer, `v[0]` | non | non | non |

  ```python
  a = {"x": 1, "y": 2}
  b = {"y": 3, "z": 4}
  a.keys() & b.keys()     # {'y'} : les clés communes
  a.keys() - b.keys()     # {'x'}
  a.keys() == {"x", "y"}  # True : une vue de clés se compare à un ensemble
  ```

  `values()` n'est pas une vue d'ensemble : les valeurs peuvent être en double ou non hachables. Deux vues `values()`
  ne sont même pas égales entre elles : `d.values() == d.values()` vaut `False`, car elles se comparent par identité.

  **Les pièges** : `d.keys()[0]` lève `TypeError: 'dict_keys' object is not subscriptable` ; on écrit `list(d)[0]` ou
  `next(iter(d))`. Et modifier la taille du dictionnaire pendant qu'on parcourt une de ses vues lève une
  `RuntimeError`, comme pour le dictionnaire lui-même.

  En Python 2, ces méthodes renvoyaient des listes : c'est une question d'entretien classique.

  **En entretien** : « `keys()`, `values()` et `items()` renvoient des vues dynamiques, qui suivent le dictionnaire sans
  le copier. Les vues de clés et de paires se comportent comme des ensembles (`&`, `|`, `-`) ; aucune ne s'indexe. Pour
  figer le contenu, on le copie avec `list()`. »
cards:
  - key: vue-dynamique
    format: course
    question: "Qu'est-ce que la vue renvoyée par `d.keys()` ?"
    choices:
      - {text: "Un objet qui reflète le dictionnaire, ses changements compris", correct: true}
      - {text: "Une liste des clés, copiée au moment de l'appel", correct: false}
      - {text: "Un tuple des clés, figé au moment de l'appel", correct: false}
      - {text: "Un itérateur, épuisé après un seul parcours", correct: false}
    answer: "La vue ne copie rien : elle lit le dictionnaire à chaque usage. On peut la parcourir autant de fois qu'on veut, contrairement à un itérateur."
  - key: vues-ensemblistes
    format: course
    question: "Quelles vues d'un dictionnaire se comportent comme des ensembles ?"
    choices:
      - {text: "`keys()` et `items()`", correct: true}
      - {text: "`values()` seulement", correct: false}
      - {text: "Les trois vues", correct: false}
      - {text: "Aucune : il faut les convertir en `set`", correct: false}
    answer: "Les clés sont uniques et hachables, donc les paires aussi (si les valeurs sont hachables). Les valeurs peuvent être en double : `values()` n'offre pas `&` ni `|`."
  - key: indexer-une-vue
    format: course
    question: "Pourquoi `d.keys()[0]` échoue-t-il ?"
    choices:
      - {text: "Une vue ne s'indexe pas : il faut `list(d)[0]` ou `next(iter(d))`", correct: true}
      - {text: "Les clés d'un dictionnaire n'ont pas d'ordre, donc pas de première", correct: false}
      - {text: "Il faut passer l'indice en argument, avec `d.keys(0)`", correct: false}
      - {text: "Il faut d'abord trier les clés, avec `sorted(d.keys())`", correct: false}
    answer: "`TypeError: 'dict_keys' object is not subscriptable`. Les clés ont pourtant un ordre, celui d'insertion : il suffit de copier la vue dans une liste, ou d'en lire le premier élément avec `next`."
  - key: values-pas-ensemble
    format: course
    question: "Pourquoi `d.values()` n'offre-t-il pas les opérations d'ensemble ?"
    choices:
      - {text: "Les valeurs peuvent être en double, ou ne pas être hachables", correct: true}
      - {text: "Les valeurs sont toujours triées, contrairement aux clés", correct: false}
      - {text: "Les valeurs sont copiées à chaque appel de `values()`", correct: false}
      - {text: "Les valeurs ne peuvent pas être parcourues par un `for`", correct: false}
    answer: "Un ensemble n'a ni doublon ni élément non hachable ; rien de tel n'est garanti pour les valeurs. On écrit `set(a.values()) & set(b.values())` quand c'est possible."
  - key: vf-vue-voit-ajout
    format: true-false
    question: "Une vue `d.items()` créée avant un ajout dans `d` voit le nouvel élément."
    truth: true
    answer: "Les vues sont dynamiques : elles lisent le dictionnaire au moment où on les utilise."
  - key: vf-keys-liste
    format: true-false
    question: "`d.keys()` renvoie une liste en Python 3."
    truth: false
    answer: "Elle renvoie une vue `dict_keys`. C'était une liste en Python 2."
  - key: vf-cles-communes
    format: true-false
    question: "`d1.keys() & d2.keys()` donne les clés communes aux deux dictionnaires."
    truth: true
    answer: "Les vues de clés acceptent les opérations d'ensemble, et renvoient un `set`."
  - key: vf-values-egales
    format: true-false
    question: "`{\"a\": 1}.values() == {\"a\": 1}.values()` vaut `True`."
    truth: false
    answer: "Les vues `values()` se comparent par identité, faute de pouvoir se comparer comme des ensembles : deux vues distinctes ne sont jamais égales. On compare `list(...)` ou `sorted(...)`."
  - key: qcm-cles-en-trop
    format: multiple-choice
    question: "Comment obtenir les clés présentes dans `a` mais pas dans `b` ?"
    choices:
      - {text: "`a.keys() - b.keys()`", correct: true}
      - {text: "`a.values() - b.values()`", correct: false}
      - {text: "`a - b`", correct: false}
      - {text: "`a.keys().remove(b)`", correct: false}
    answer: "La différence des vues de clés donne un `set`. Les dictionnaires eux-mêmes n'acceptent pas `-`, et `values()` n'a pas d'opérations d'ensemble."
  - key: qcm-type-de-vue
    format: multiple-choice
    question: "Que renvoie `type({\"x\": 1}.items()).__name__` ?"
    choices:
      - {text: "`'dict_items'`", correct: true}
      - {text: "`'list'`", correct: false}
      - {text: "`'tuple'`", correct: false}
      - {text: "`'set'`", correct: false}
    answer: "Chaque vue a son type : `dict_keys`, `dict_values` et `dict_items`."
  - key: qcm-photo-des-cles
    format: multiple-choice
    question: "Comment obtenir les clés dans une liste figée, qui ne suivra pas les changements de `d` ?"
    choices:
      - {text: "`list(d)`", correct: true}
      - {text: "`d.keys()`", correct: false}
      - {text: "`iter(d)`", correct: false}
      - {text: "`d.items()`", correct: false}
    answer: "`list(d)` copie les clés dans une nouvelle liste. `d.keys()` et `d.items()` sont des vues dynamiques ; `iter(d)` lit le dictionnaire au fil du parcours."
  - key: qcm-somme-des-valeurs
    format: multiple-choice
    question: "Comment calculer la somme des valeurs du dictionnaire `prix` ?"
    choices:
      - {text: "`sum(prix.values())`", correct: true}
      - {text: "`sum(prix)`", correct: false}
      - {text: "`sum(prix.items())`", correct: false}
      - {text: "`prix.values().sum()`", correct: false}
    answer: "`sum` parcourt la vue des valeurs. `sum(prix)` additionnerait les clés, et les vues n'ont pas de méthode `sum`."
  - key: code-vue-suit
    format: code-output
    question: |-
      ```python
      d = {"a": 1}
      cles = d.keys()
      d["b"] = 2
      print(len(cles), list(cles))
      ```
    answer: "La vue créée avant l'ajout voit la nouvelle clé : elle n'a rien copié."
    check:
      output: "2 ['a', 'b']"
    choices:
      - {text: "`2 ['a', 'b']`", correct: true}
      - {text: "`1 ['a']`", correct: false}
      - {text: "`1 ['a', 'b']`", correct: false}
      - {text: "`2 ['a']`", correct: false}
  - key: code-union-intersection
    format: code-output
    question: |-
      ```python
      a = {"x": 1, "y": 2}
      b = {"y": 3, "z": 4}
      print(sorted(a.keys() | b.keys()), sorted(a.keys() & b.keys()))
      ```
    answer: "L'union réunit les clés sans doublon, l'intersection garde `'y'`, présente dans les deux."
    check:
      output: "['x', 'y', 'z'] ['y']"
    choices:
      - {text: "`['x', 'y', 'z'] ['y']`", correct: true}
      - {text: "`['x', 'y', 'y', 'z'] ['y']`", correct: false}
      - {text: "`['x', 'z'] ['y']`", correct: false}
      - {text: "`['x', 'y', 'z'] []`", correct: false}
  - key: code-comparer-vues
    format: code-output
    question: |-
      ```python
      d = {"a": 1}
      print(d.keys() == {"a"}, d.values() == d.values())
      ```
    answer: "Une vue de clés se compare comme un ensemble. Deux vues `values()` se comparent par identité : deux appels donnent deux objets différents."
    check:
      output: "True False"
    choices:
      - {text: "`True False`", correct: true}
      - {text: "`True True`", correct: false}
      - {text: "`False False`", correct: false}
      - {text: "`False True`", correct: false}
  - key: code-in-items
    format: code-output
    question: |-
      ```python
      d = {"a": 1, "b": 2}
      print(("a", 1) in d.items(), ("a", 2) in d.items(), "a" in d.items())
      ```
    answer: "`items()` contient des paires `(clé, valeur)` : la paire doit correspondre exactement, et une clé seule n'en est pas une."
    check:
      output: "True False False"
    choices:
      - {text: "`True False False`", correct: true}
      - {text: "`True False True`", correct: false}
      - {text: "`True True True`", correct: false}
      - {text: "`False False True`", correct: false}
  - key: bug-indexer-values
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: 'dict_values' object is not subscriptable` :
      ```python
      scores = {"ana": 12, "bob": 15}
      print(scores.values()[0])
      ```
      Quelle correction affiche le premier score ?
    choices:
      - {text: "`list(scores.values())[0]`", correct: true}
      - {text: "`scores.values(0)`", correct: false}
      - {text: "`scores.values[0]`", correct: false}
      - {text: "`scores[0]`", correct: false}
    answer: |-
      ```python
      scores = {"ana": 12, "bob": 15}
      print(list(scores.values())[0])
      ```
      Une vue ne s'indexe pas : on la copie dans une liste. `scores[0]` chercherait la clé 0.
  - key: bug-vue-et-ajout
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `RuntimeError: dictionary changed size during iteration` :
      ```python
      config = {"debug": True, "trace": True}
      for cle in config.keys():
          config[cle.upper()] = config[cle]
      print(config)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Parcourir `list(config.keys())`, une copie figée", correct: true}
      - {text: "Parcourir `config.items()` au lieu de `config.keys()`", correct: false}
      - {text: "Parcourir `config.values()` au lieu de `config.keys()`", correct: false}
      - {text: "Parcourir `iter(config.keys())`, un itérateur à part", correct: false}
    answer: |-
      ```python
      config = {"debug": True, "trace": True}
      for cle in list(config.keys()):
          config[cle.upper()] = config[cle]
      print(config)
      ```
      Toutes les vues suivent le dictionnaire : l'agrandir pendant qu'on en parcourt une lève l'erreur. `list(...)`
      fige les clés avant la boucle.
  - key: bug-intersection-values
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: unsupported operand type(s) for &: 'dict_values' and 'dict_values'` :
      ```python
      a = {"x": 1}
      b = {"y": 1}
      communes = a.values() & b.values()
      print(communes)
      ```
      Quelle correction donne les valeurs communes ?
    choices:
      - {text: "`set(a.values()) & set(b.values())`", correct: true}
      - {text: "`a.values() and b.values()`", correct: false}
      - {text: "`a.items() & b.items()`", correct: false}
      - {text: "`a.values() | b.values()`", correct: false}
    answer: |-
      ```python
      a = {"x": 1}
      b = {"y": 1}
      communes = set(a.values()) & set(b.values())
      print(communes)
      ```
      `values()` n'a pas d'opérations d'ensemble : on la convertit en `set`. `items()` comparerait des paires, qui
      diffèrent ici par leur clé.
  - key: bug-photo-attendue
    format: bug-fix
    question: |-
      Pour trouver les produits ajoutés, ce programme affiche `set()` au lieu de `{'kiwi'}` :
      ```python
      stock = {"pomme": 3}
      avant = stock.keys()
      stock["kiwi"] = 5
      print(stock.keys() - avant)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`avant = set(stock)`, une copie prise avant l'ajout", correct: true}
      - {text: "`avant = stock.items()`, qui ne change pas", correct: false}
      - {text: "`avant = iter(stock.keys())`, qui fige les clés", correct: false}
      - {text: "`avant = stock.keys()`, placé après l'ajout", correct: false}
    answer: |-
      ```python
      stock = {"pomme": 3}
      avant = set(stock)
      stock["kiwi"] = 5
      print(stock.keys() - avant)
      ```
      La vue `avant` suit le dictionnaire : après l'ajout, elle contient aussi `'kiwi'`. Il faut une copie, prise
      avant.
