notion: listes
lesson: |-
  Une **liste** est une suite ordonnée et **modifiable** d'éléments, de n'importe quels types. C'est un tableau
  dynamique : elle grandit et rétrécit à la demande.

  ```python
  fruits = ["pomme", "kiwi", "poire"]
  fruits[0]          # 'pomme' : les indices commencent à 0
  fruits[-1]         # 'poire' : les indices négatifs partent de la fin
  fruits[1] = "figue"
  len(fruits)        # 3
  "kiwi" in fruits   # False, depuis qu'on l'a remplacé
  ```

  Lire un indice qui n'existe pas lève une `IndexError: list index out of range`.

  **Ajouter et retirer.**

  | Méthode | Effet | Coût |
  |---|---|---|
  | `xs.append(x)` | ajoute `x` à la fin, comme **un seul** élément | O(1) amorti |
  | `xs.extend(it)` | ajoute **chacun** des éléments de l'itérable `it` | O(k) |
  | `xs.insert(i, x)` | insère `x` avant l'indice `i` (à la fin si `i` dépasse) | O(n) |
  | `xs.pop()` | retire et **renvoie** le dernier élément | O(1) |
  | `xs.pop(i)` | retire et renvoie l'élément d'indice `i` | O(n) |
  | `xs.remove(v)` | retire la **première** occurrence de la valeur `v` (`ValueError` si absente) | O(n) |
  | `del xs[i]` | retire l'élément d'indice `i`, sans le renvoyer | O(n) |

  D'autres méthodes servent souvent : `xs.index(v)` (l'indice de la première occurrence), `xs.count(v)` (le nombre
  d'occurrences), `xs.reverse()`, `xs.sort()`, `xs.clear()`.

  **Les méthodes qui modifient la liste renvoient `None`.** `xs = xs.append(4)` remplace donc la liste par `None` :
  c'est l'erreur la plus fréquente des débutants.

  `append` ou `extend` :

  ```python
  xs = [1, 2]
  xs.append([3, 4])   # [1, 2, [3, 4]] : la liste ajoutée est un seul élément
  ys = [1, 2]
  ys.extend([3, 4])   # [1, 2, 3, 4]
  ys.extend("ab")     # [1, 2, 3, 4, 'a', 'b'] : une chaîne est un itérable de caractères
  ```

  Les opérateurs `+` et `*` créent une **nouvelle** liste : `[1, 2] + [3]` vaut `[1, 2, 3]`, `[0] * 3` vaut
  `[0, 0, 0]`. `xs += [3]`, lui, modifie `xs` sur place, comme `extend`.

  **En entretien** : « Une liste est un tableau dynamique, mutable et ordonné, indexé à partir de 0, et depuis la fin
  avec -1. `append` ajoute un élément, `extend` ceux d'un itérable ; `insert(0, x)` et `pop(0)` coûtent O(n), car ils
  décalent tous les éléments. Les méthodes qui modifient la liste renvoient `None`. »
tour:
  - title: Les listes
    text: |-
      Une liste s'écrit entre crochets, et se modifie à volonté. Ses indices partent de 0 ; `-1` désigne le dernier
      élément.

      - `append(x)` ajoute à la fin, `insert(i, x)` avant l'indice `i` ;
      - `extend(autres)` ajoute un à un les éléments d'une autre liste ;
      - `pop()` retire et renvoie le dernier, `remove(v)` retire la première valeur `v` ;
      - `len(xs)` donne la taille, `x in xs` teste la présence.

      Ces méthodes modifient la liste et renvoient `None` : on n'écrit jamais `courses = courses.append(...)`.

      Essaie : remplace `courses.extend(["riz", "thé"])` par `courses.append(["riz", "thé"])`, et regarde la liste.
    example:
      files:
        main.py: |-
          courses = ["pain", "lait"]
          courses.append("œufs")
          courses.insert(0, "café")
          courses.extend(["riz", "thé"])
          print(courses)
          print(len(courses), courses[0], courses[-1])

          dernier = courses.pop()
          courses.remove("lait")
          print(dernier, courses)
          print("riz" in courses)
      output: |-
        ['café', 'pain', 'lait', 'œufs', 'riz', 'thé']
        6 café thé
        thé ['café', 'pain', 'œufs', 'riz']
        True
    task:
      instructions: |-
        Ajoute `"beurre"` à la fin de la liste, puis retire `"pain"` : le programme doit afficher
        `['lait', 'beurre']`.
      starter:
        main.py: |-
          courses = ["pain", "lait"]
          print(courses)
      solution:
        main.py: |-
          courses = ["pain", "lait"]
          courses.append("beurre")
          courses.remove("pain")
          print(courses)
      output: |-
        ['lait', 'beurre']
cards:
  - key: append-ou-extend
    format: course
    question: "Quelle différence entre `xs.append([4, 5])` et `xs.extend([4, 5])` ?"
    choices:
      - {text: "`append` ajoute la liste comme un seul élément ; `extend` ajoute 4 puis 5", correct: true}
      - {text: "`append` ajoute 4 puis 5 ; `extend` ajoute la liste comme un seul élément", correct: false}
      - {text: "Aucune : les deux ajoutent 4 puis 5 à la fin de la liste", correct: false}
      - {text: "`append` ajoute à la fin de la liste ; `extend` ajoute au début", correct: false}
    answer: "`append` ajoute un seul élément, quel qu'il soit : `[1, 2, 3, [4, 5]]`. `extend` parcourt l'itérable et ajoute chacun de ses éléments : `[1, 2, 3, 4, 5]`."
  - key: retour-des-methodes
    format: course
    question: "Que renvoient `append`, `insert` et `sort` sur une liste ?"
    choices:
      - {text: "`None` : elles modifient la liste en place", correct: true}
      - {text: "La liste modifiée, pour enchaîner les appels", correct: false}
      - {text: "Une nouvelle liste ; l'ancienne reste intacte", correct: false}
      - {text: "Le nombre d'éléments après la modification", correct: false}
    answer: "Les méthodes qui modifient une liste renvoient `None`, pour qu'on ne les confonde pas avec celles qui créent un nouvel objet. `xs = xs.append(1)` perd donc la liste."
  - key: indice-negatif
    format: course
    question: "Que désigne `xs[-1]` pour une liste non vide ?"
    choices:
      - {text: "Le dernier élément de la liste", correct: true}
      - {text: "Rien : un indice négatif lève une `IndexError`", correct: false}
      - {text: "Le premier élément, lu à l'envers", correct: false}
      - {text: "L'avant-dernier élément de la liste", correct: false}
    answer: "Les indices négatifs partent de la fin : `-1` est le dernier élément, `-2` l'avant-dernier. `xs[-1]` vaut `xs[len(xs) - 1]`."
  - key: pop-ou-remove
    format: course
    question: "Quelle différence entre `pop` et `remove` sur une liste ?"
    choices:
      - {text: "`pop` retire par indice et renvoie l'élément ; `remove` retire une valeur", correct: true}
      - {text: "`pop` retire une valeur ; `remove` retire par indice et renvoie l'élément", correct: false}
      - {text: "`pop` retire toutes les occurrences ; `remove` seulement la première", correct: false}
      - {text: "Aucune : `remove` est l'ancien nom de `pop`, gardé pour compatibilité", correct: false}
    answer: "`xs.pop()` retire et renvoie le dernier élément, `xs.pop(i)` celui d'indice `i`. `xs.remove(v)` retire la première occurrence de la valeur `v`, ne renvoie rien, et lève une `ValueError` si elle est absente."
  - key: vf-types-melanges
    format: true-false
    question: "Une liste Python peut contenir des éléments de types différents, comme `[1, \"a\", None]`."
    truth: true
    answer: "Une liste range des références vers des objets, quels qu'ils soient. En pratique, on garde souvent un seul type par liste, pour la lisibilité."
  - key: vf-insert-en-tete
    format: true-false
    question: "`xs.insert(0, x)` s'exécute en temps constant, quelle que soit la taille de la liste."
    truth: false
    answer: "Insérer en tête décale tous les éléments d'un cran : O(n). Pour ajouter et retirer aux deux bouts, `collections.deque` le fait en O(1)."
  - key: vf-remove-toutes
    format: true-false
    question: "`xs.remove(3)` retire toutes les occurrences de 3 dans la liste."
    truth: false
    answer: "`remove` ne retire que la première occurrence. Pour toutes les retirer, on construit une nouvelle liste : `[x for x in xs if x != 3]`."
  - key: vf-indice-hors-bornes
    format: true-false
    question: "Lire `xs[10]` sur une liste de trois éléments lève une `IndexError`."
    truth: true
    answer: "`IndexError: list index out of range`. Le découpage, lui, ne lève jamais d'erreur : `xs[10:]` vaut `[]`."
  - key: qcm-ajouter-fin
    format: multiple-choice
    question: "Comment ajouter l'élément `x` à la fin de la liste `xs` ?"
    choices:
      - {text: "`xs.append(x)`", correct: true}
      - {text: "`xs.add(x)`", correct: false}
      - {text: "`xs.push(x)`", correct: false}
      - {text: "`xs.insert(-1, x)`", correct: false}
    answer: "`add` est la méthode des ensembles, `push` n'existe pas en Python, et `insert(-1, x)` insère **avant** le dernier élément."
  - key: qcm-retirer-dernier
    format: multiple-choice
    question: "Comment retirer le dernier élément de `xs` et le récupérer dans une variable ?"
    choices:
      - {text: "`x = xs.pop()`", correct: true}
      - {text: "`x = xs.remove(-1)`", correct: false}
      - {text: "`x = del xs[-1]`", correct: false}
      - {text: "`x = xs.pop(0)`", correct: false}
    answer: "`pop()` retire et renvoie le dernier élément. `remove(-1)` cherche la **valeur** -1, `del` est une instruction qui ne renvoie rien, et `pop(0)` prend le premier."
  - key: qcm-concatenation
    format: multiple-choice
    question: "Que vaut `[1, 2] + [3]` ?"
    choices:
      - {text: "`[1, 2, 3]`", correct: true}
      - {text: "`[1, 2, [3]]`", correct: false}
      - {text: "`[4, 5]`", correct: false}
      - {text: "Une `TypeError`", correct: false}
    answer: "`+` concatène deux listes dans une nouvelle liste. Pour additionner les éléments deux à deux, il faudrait `zip`."
  - key: qcm-taille
    format: multiple-choice
    question: "Comment obtenir le nombre d'éléments de la liste `xs` ?"
    choices:
      - {text: "`len(xs)`", correct: true}
      - {text: "`xs.length`", correct: false}
      - {text: "`xs.size()`", correct: false}
      - {text: "`xs.count()`", correct: false}
    answer: "`len` est une fonction intégrée, commune à toutes les collections. `xs.count(v)` compte les occurrences d'une valeur, et demande donc un argument."
  - key: trous-ajouter
    format: fill-in
    question: |-
      Complète pour ajouter `"kiwi"` à la fin de la liste :
      ```python
      fruits = ["pomme"]
      fruits.___("kiwi")
      ```
    blanks:
      - [append]
    answer: "`append` ajoute un élément à la fin."
  - key: trous-etendre
    format: fill-in
    question: |-
      Complète pour ajouter un à un les éléments de la liste `autres` à la fin de `fruits` :
      ```python
      fruits.___(autres)
      ```
    blanks:
      - [extend]
    answer: "`extend` parcourt l'itérable et ajoute chacun de ses éléments ; `append` ajouterait la liste entière comme un seul élément."
  - key: trous-inserer
    format: fill-in
    question: |-
      Complète pour insérer `0` au tout début de la liste :
      ```python
      xs.insert(___, 0)
      ```
    blanks:
      - ["0"]
    answer: "`insert(i, x)` place `x` avant l'indice `i` : avec 0, en tête. Le premier argument est l'indice, le second la valeur."
  - key: trous-dernier
    format: fill-in
    question: |-
      Complète pour afficher le dernier élément, quelle que soit la taille de la liste :
      ```python
      print(xs[___])
      ```
    blanks:
      - ["-1", "len(xs)-1"]
    answer: "`xs[-1]` est la forme idiomatique ; `xs[len(xs) - 1]` marche aussi."
  - key: code-append-extend
    format: code-output
    question: |-
      ```python
      xs = [1, 2]
      xs.append([3, 4])
      xs.extend([5, 6])
      print(len(xs), xs)
      ```
    answer: "`append` ajoute la liste `[3, 4]` comme un seul élément, `extend` ajoute 5 puis 6 : cinq éléments."
    check:
      output: "5 [1, 2, [3, 4], 5, 6]"
    choices:
      - {text: "`5 [1, 2, [3, 4], 5, 6]`", correct: true}
      - {text: "`6 [1, 2, 3, 4, 5, 6]`", correct: false}
      - {text: "`4 [1, 2, [3, 4], [5, 6]]`", correct: false}
      - {text: "`5 [1, 2, 3, 4, [5, 6]]`", correct: false}
  - key: code-pop-insert
    format: code-output
    question: |-
      ```python
      xs = ["a", "b", "c"]
      x = xs.pop(0)
      xs.insert(1, x)
      print(xs)
      ```
    answer: "`pop(0)` retire `'a'` et laisse `['b', 'c']` ; `insert(1, 'a')` le place avant `'c'`."
    check:
      output: "['b', 'a', 'c']"
    choices:
      - {text: "`['b', 'a', 'c']`", correct: true}
      - {text: "`['a', 'b', 'c']`", correct: false}
      - {text: "`['b', 'c', 'a']`", correct: false}
      - {text: "`['a', 'a', 'c']`", correct: false}
  - key: code-remove-premiere
    format: code-output
    question: |-
      ```python
      xs = [3, 1, 3, 2, 3]
      xs.remove(3)
      print(xs, xs.count(3))
      ```
    answer: "`remove` ne retire que la première occurrence de 3 : il en reste deux."
    check:
      output: "[1, 3, 2, 3] 2"
    choices:
      - {text: "`[1, 3, 2, 3] 2`", correct: true}
      - {text: "`[1, 2] 0`", correct: false}
      - {text: "`[3, 1, 3, 2] 2`", correct: false}
      - {text: "`[1, 3, 2, 3] 3`", correct: false}
  - key: code-append-renvoie-none
    format: code-output
    question: |-
      ```python
      xs = [3, 1, 2]
      ys = xs.append(4)
      print(ys, len(xs))
      ```
    answer: "`append` modifie `xs` et renvoie `None` : `ys` vaut `None`, et `xs` a maintenant quatre éléments."
    check:
      output: "None 4"
    choices:
      - {text: "`None 4`", correct: true}
      - {text: "`[3, 1, 2, 4] 4`", correct: false}
      - {text: "`None 3`", correct: false}
      - {text: "`[3, 1, 2, 4] 3`", correct: false}
  - key: bug-append-reaffecte
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: object of type 'NoneType' has no len()` :
      ```python
      courses = ["pain"]
      courses = courses.append("lait")
      print(len(courses))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `courses.append(\"lait\")` seul, sans réaffecter `courses`", correct: true}
      - {text: "Écrire `courses = courses.append([\"lait\"])`, avec une liste", correct: false}
      - {text: "Écrire `courses = list(courses.append(\"lait\"))`", correct: false}
      - {text: "Remplacer `len(courses)` par la méthode `courses.len()`", correct: false}
    answer: |-
      ```python
      courses = ["pain"]
      courses.append("lait")
      print(len(courses))
      ```
      `append` modifie la liste et renvoie `None` : réaffecter son résultat remplace la liste par `None`.
  - key: bug-extend-chaine
    format: bug-fix
    question: |-
      Ce programme affiche `['bonjour', 'm', 'o', 'n', 'd', 'e']` au lieu de `['bonjour', 'monde']` :
      ```python
      mots = ["bonjour"]
      mots.extend("monde")
      print(mots)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`mots.append(\"monde\")`", correct: true}
      - {text: "`mots.extend((\"monde\"))`", correct: false}
      - {text: "`mots += \"monde\"`", correct: false}
      - {text: "`mots.insert(\"monde\")`", correct: false}
    answer: |-
      ```python
      mots = ["bonjour"]
      mots.append("monde")
      print(mots)
      ```
      `extend` parcourt son argument : une chaîne est un itérable de caractères. `("monde")` n'est pas un tuple (il
      faudrait une virgule), et `+=` sur une liste se comporte comme `extend`.
  - key: bug-remove-absent
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `ValueError: list.remove(x): x not in list` :
      ```python
      inscrits = ["ana", "bob"]
      inscrits.remove("eve")
      print(inscrits)
      ```
      Quelle correction évite l'erreur quand la personne n'est pas inscrite ?
    choices:
      - {text: "Tester `\"eve\" in inscrits` avant d'appeler `remove`", correct: true}
      - {text: "Remplacer par `inscrits.pop(\"eve\")`, qui ignore l'absence", correct: false}
      - {text: "Remplacer par `del inscrits[\"eve\"]`, qui ne lève rien", correct: false}
      - {text: "Remplacer par `inscrits.discard(\"eve\")`, comme un ensemble", correct: false}
    answer: |-
      ```python
      inscrits = ["ana", "bob"]
      if "eve" in inscrits:
          inscrits.remove("eve")
      print(inscrits)
      ```
      `remove` lève une `ValueError` si la valeur manque. `pop` et `del` attendent un indice entier, et `discard`
      n'existe que sur les ensembles.
  - key: bug-indice-len
    format: bug-fix
    question: |-
      Pour afficher la dernière note, ce code s'arrête sur `IndexError: list index out of range` :
      ```python
      notes = [12, 15, 9]
      print(notes[len(notes)])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`notes[-1]`", correct: true}
      - {text: "`notes[-0]`", correct: false}
      - {text: "`notes[len(notes) + 1]`", correct: false}
      - {text: "`notes.last()`", correct: false}
    answer: |-
      ```python
      notes = [12, 15, 9]
      print(notes[-1])
      ```
      Les indices vont de 0 à `len(notes) - 1`. `-0` vaut 0, donc le premier élément, et les listes n'ont pas de
      méthode `last`.
