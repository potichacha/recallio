notion: namedtuple
lesson: |-
  `collections.namedtuple` crée un **type de tuple aux champs nommés** : on lit `p.x` au lieu de `p[0]`, et
  l'affichage dit ce que contient l'objet.

  ```python
  from collections import namedtuple

  Point = namedtuple("Point", "x y")       # ou ["x", "y"]
  p = Point(3, y=4)
  p.x, p[1]                                # (3, 4) : par nom ou par position
  p                                        # Point(x=3, y=4)
  x, y = p                                 # se déballe comme un tuple
  ```

  **C'est un vrai tuple** : immuable, indexable, déballable, comparable, hachable (si ses champs le sont), et
  `Point(3, 4) == (3, 4)` vaut `True`. Il ne prend pas plus de mémoire qu'un tuple : pas de `__dict__` par objet.

  **Ses méthodes** (préfixées par `_` pour ne pas gêner les noms de champs) :

  | Méthode | Effet |
  |---|---|
  | `p._replace(x=5)` | un **nouveau** tuple, avec `x` changé |
  | `p._asdict()` | un dictionnaire `{'x': 3, 'y': 4}` |
  | `Point._fields` | les noms des champs : `('x', 'y')` |
  | `Point._make(iterable)` | un `Point` à partir d'un itérable |

  `p.x = 5` lève une `AttributeError` : on passe par `_replace`. Des valeurs par défaut se donnent avec `defaults=`,
  appliquées aux champs **les plus à droite** : `namedtuple("Couleur", "r g b", defaults=[0, 0])` rend `g` et `b`
  facultatifs.

  **La forme moderne, avec des annotations** :

  ```python
  from typing import NamedTuple

  class Produit(NamedTuple):
      nom: str
      prix: float = 1.0
  ```

  **Face à une dataclass** : `namedtuple` convient à un petit enregistrement immuable qui peut aussi passer pour un
  tuple (retour de fonction, ligne de CSV). Une `dataclass` convient à un objet qu'on modifie, avec des méthodes, ou
  qui ne doit pas être confondu avec un tuple.

  **En entretien** : « `namedtuple` crée une sous-classe de tuple aux champs nommés : immuable, léger, lisible, et
  compatible avec tout code qui attend un tuple. On le modifie avec `_replace`, qui renvoie une copie. `typing.NamedTuple`
  en est la version annotée ; pour un objet mutable, on préfère une dataclass. »
cards:
  - key: definition-du-type
    format: course
    question: "Qu'est-ce qu'un `namedtuple` ?"
    choices:
      - {text: "Un tuple dont les éléments ont aussi un nom", correct: true}
      - {text: "Un dictionnaire aux clés fixées à la création", correct: false}
      - {text: "Une classe mutable aux attributs déclarés", correct: false}
      - {text: "Un tuple trié par le nom de ses champs", correct: false}
    answer: "`namedtuple` fabrique une sous-classe de `tuple` : chaque élément se lit par son nom ou par sa position."
  - key: changer-un-champ
    format: course
    question: "Comment obtenir un `Point` dont seul `x` change ?"
    choices:
      - {text: "`p._replace(x=5)`, qui renvoie un nouveau tuple", correct: true}
      - {text: "`p.x = 5`, qui modifie le tuple en place", correct: false}
      - {text: "`p.update(x=5)`, comme pour un dictionnaire", correct: false}
      - {text: "`p[\"x\"] = 5`, en indexant par le nom", correct: false}
    answer: "Un `namedtuple` est immuable : `p.x = 5` lève une `AttributeError`. `_replace` construit une copie avec les champs donnés."
  - key: face-a-dataclass
    format: course
    question: "Quand préférer une `dataclass` à un `namedtuple` ?"
    choices:
      - {text: "Quand l'objet doit changer, ou ne doit pas passer pour un tuple", correct: true}
      - {text: "Quand on veut accéder aux champs par leur position", correct: false}
      - {text: "Quand l'objet doit servir de clé de dictionnaire", correct: false}
      - {text: "Quand on veut le déballer avec `x, y = p`", correct: false}
    answer: "Un `namedtuple` est un tuple : immuable, indexable, égal à un tuple de mêmes valeurs. Si ce comportement gêne, ou si l'objet doit être modifié, une `dataclass` convient mieux."
  - key: version-annotee
    format: course
    question: "Comment déclarer un `namedtuple` avec des annotations de type ?"
    choices:
      - {text: "Une classe qui hérite de `typing.NamedTuple`", correct: true}
      - {text: "Une classe décorée par `@namedtuple`", correct: false}
      - {text: "`namedtuple(\"P\", x=int, y=int)`", correct: false}
      - {text: "Une classe qui hérite de `tuple`, avec `__slots__`", correct: false}
    answer: "`class Point(NamedTuple):` puis `x: int` et `y: int`, avec des valeurs par défaut possibles. Le résultat est le même type de tuple nommé."
  - key: vf-affecter-champ
    format: true-false
    question: "On peut modifier un champ d'un `namedtuple` avec `p.x = 3`."
    truth: false
    answer: "C'est un tuple : immuable. `p.x = 3` lève une `AttributeError` ; `p._replace(x=3)` renvoie une copie."
  - key: vf-egal-a-un-tuple
    format: true-false
    question: "`Point(1, 2) == (1, 2)` vaut `True`."
    truth: true
    answer: "Un `namedtuple` se compare comme un tuple, élément par élément. C'est parfois une surprise : `Point(1, 2) == Couleur(1, 2)` aussi."
  - key: vf-indice
    format: true-false
    question: "Les champs d'un `namedtuple` restent accessibles par leur indice, comme `p[0]`."
    truth: true
    answer: "Les champs nommés s'ajoutent aux indices ; tout code qui attend un tuple continue de marcher."
  - key: vf-cle-de-dict
    format: true-false
    question: "Un `namedtuple` ne peut pas servir de clé de dictionnaire."
    truth: false
    answer: "Il est hachable, comme un tuple, si ses champs le sont : `{Point(0, 0): \"origine\"}` est permis."
  - key: qcm-declarer
    format: multiple-choice
    question: "Comment déclarer un type `Point` aux champs `x` et `y` ?"
    choices:
      - {text: "`Point = namedtuple(\"Point\", \"x y\")`", correct: true}
      - {text: "`Point = namedtuple(x, y)`", correct: false}
      - {text: "`Point = namedtuple(\"Point\", x, y)`", correct: false}
      - {text: "`Point = namedtuple(\"x y\")`", correct: false}
    answer: "Le nom du type, puis les noms des champs, dans une chaîne séparée par des espaces ou des virgules, ou dans une liste."
  - key: qcm-noms-des-champs
    format: multiple-choice
    question: "Comment lister les noms des champs d'un type `namedtuple` ?"
    choices:
      - {text: "`Point._fields`", correct: true}
      - {text: "`Point.fields()`", correct: false}
      - {text: "`Point.__dict__`", correct: false}
      - {text: "`Point.keys()`", correct: false}
    answer: "`_fields` est un tuple de chaînes : `('x', 'y')`. Le `_` évite tout conflit avec un champ qui s'appellerait `fields`."
  - key: qcm-valeur-par-defaut
    format: multiple-choice
    question: "Comment rendre le champ `y` de `namedtuple(\"Point\", \"x y\")` facultatif, à 0 par défaut ?"
    choices:
      - {text: "`namedtuple(\"Point\", \"x y\", defaults=[0])`", correct: true}
      - {text: "`namedtuple(\"Point\", \"x y=0\")`", correct: false}
      - {text: "`namedtuple(\"Point\", \"x y\", y=0)`", correct: false}
      - {text: "`namedtuple(\"Point\", \"x y\", default=0)`", correct: false}
    answer: "`defaults` s'applique aux derniers champs : une valeur pour `y`. Le paramètre s'appelle bien `defaults`, au pluriel."
  - key: qcm-deballer
    format: multiple-choice
    question: "Que donne `x, y = Point(3, 4)` ?"
    choices:
      - {text: "`x` vaut 3 et `y` vaut 4", correct: true}
      - {text: "Une `TypeError` : un `namedtuple` ne se déballe pas", correct: false}
      - {text: "`x` vaut `'x'` et `y` vaut `'y'`", correct: false}
      - {text: "`x` vaut `Point(3, 4)` et `y` vaut `None`", correct: false}
    answer: "Un `namedtuple` est un tuple : il se déballe par position."
  - key: trous-import
    format: fill-in
    question: |-
      Complète pour importer la fabrique de tuples nommés :
      ```python
      from collections import ___
      ```
    blanks:
      - [namedtuple]
    answer: "`namedtuple` vit dans `collections`."
  - key: trous-replace
    format: fill-in
    question: |-
      Complète pour obtenir une copie de `p` où `x` vaut 0 :
      ```python
      origine_x = p.___(x=0)
      ```
    blanks:
      - [_replace]
    answer: "`_replace` renvoie un nouveau tuple ; `p` ne change pas."
  - key: trous-asdict
    format: fill-in
    question: |-
      Complète pour convertir `p` en dictionnaire :
      ```python
      d = p.___()
      ```
    blanks:
      - [_asdict]
    answer: "`_asdict()` renvoie `{'x': ..., 'y': ...}`, dans l'ordre des champs."
  - key: trous-typing
    format: fill-in
    question: |-
      Complète la déclaration :
      ```python
      from typing import NamedTuple


      class Point(___):
          x: int
          y: int
      ```
    blanks:
      - [NamedTuple]
    answer: "Hériter de `typing.NamedTuple` crée un tuple nommé à partir des annotations."
  - key: code-affichage
    format: code-output
    question: |-
      ```python
      from collections import namedtuple

      Point = namedtuple("Point", "x y")
      p = Point(1, y=2)
      print(p, p.x + p[1])
      ```
    answer: "L'affichage nomme les champs ; `p.x` et `p[1]` lisent le même tuple, par nom ou par position."
    check:
      output: "Point(x=1, y=2) 3"
    choices:
      - {text: "`Point(x=1, y=2) 3`", correct: true}
      - {text: "`(1, 2) 3`", correct: false}
      - {text: "`Point(1, 2) 3`", correct: false}
      - {text: "`Point(x=1, y=2) 12`", correct: false}
  - key: code-replace
    format: code-output
    question: |-
      ```python
      from collections import namedtuple

      Point = namedtuple("Point", "x y")
      p = Point(1, 2)
      q = p._replace(y=9)
      print(p.y, q.y, p == (1, 2))
      ```
    answer: "`_replace` laisse `p` intact et renvoie une copie ; un `namedtuple` est égal au tuple de mêmes valeurs."
    check:
      output: "2 9 True"
    choices:
      - {text: "`2 9 True`", correct: true}
      - {text: "`9 9 True`", correct: false}
      - {text: "`2 9 False`", correct: false}
      - {text: "`9 9 False`", correct: false}
  - key: code-defaults-a-droite
    format: code-output
    question: |-
      ```python
      from collections import namedtuple

      Couleur = namedtuple("Couleur", "r g b", defaults=[0, 0])
      print(Couleur(255))
      ```
    answer: "Les valeurs par défaut s'appliquent aux derniers champs, `g` et `b` ; `r` reste obligatoire."
    check:
      output: "Couleur(r=255, g=0, b=0)"
    choices:
      - {text: "`Couleur(r=255, g=0, b=0)`", correct: true}
      - {text: "`Couleur(r=0, g=0, b=255)`", correct: false}
      - {text: "`Couleur(r=255, g=0, b=None)`", correct: false}
      - {text: "`Couleur(r=255)`", correct: false}
  - key: code-typing-namedtuple
    format: code-output
    question: |-
      ```python
      from typing import NamedTuple


      class Produit(NamedTuple):
          nom: str
          prix: float = 1.0


      p = Produit("kiwi")
      print(p._asdict(), isinstance(p, tuple))
      ```
    answer: "Le prix prend sa valeur par défaut ; un `NamedTuple` reste un tuple."
    check:
      output: "{'nom': 'kiwi', 'prix': 1.0} True"
    choices:
      - {text: "`{'nom': 'kiwi', 'prix': 1.0} True`", correct: true}
      - {text: "`{'nom': 'kiwi', 'prix': 1.0} False`", correct: false}
      - {text: "`{'nom': 'kiwi'} True`", correct: false}
      - {text: "`Produit(nom='kiwi', prix=1.0) True`", correct: false}
