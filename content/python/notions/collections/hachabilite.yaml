notion: hachabilite
lesson: |-
  Les clés d'un dictionnaire et les éléments d'un ensemble doivent être **hachables**. Un objet est hachable s'il a
  un **hachage** (`hash(x)`, un entier) qui **ne change pas** pendant sa vie, et s'il se compare avec `__eq__`.

  **Pourquoi** : le dictionnaire range chaque clé dans une case calculée d'après son hachage. Si la clé changeait de
  valeur après son insertion, son hachage changerait, et le dictionnaire la chercherait dans la mauvaise case : elle
  serait perdue. Python refuse donc les clés mutables.

  | Hachable | Non hachable |
  |---|---|
  | `int`, `float`, `str`, `bytes`, `bool`, `None` | `list` |
  | `tuple`, **si tous ses éléments sont hachables** | `dict` |
  | `frozenset` | `set` |
  | les objets d'une classe ordinaire (par identité) | une classe qui définit `__eq__` sans `__hash__` |

  ```python
  {[1, 2]: "a"}       # TypeError: cannot use 'list' as a dict key (unhashable type: 'list')
  {(1, 2): "a"}       # permis : un tuple d'entiers
  {(1, [2]): "a"}     # TypeError : le tuple contient une liste
  hash([1])           # TypeError: unhashable type: 'list'
  ```

  **La règle d'or** : deux objets **égaux** doivent avoir le **même hachage**. L'inverse n'est pas vrai : deux objets
  différents peuvent partager un hachage (une *collision*), le dictionnaire les départage avec `__eq__`. Ainsi
  `hash(1) == hash(1.0) == hash(True)`, car `1 == 1.0 == True` : c'est une seule clé.

  **Dans tes classes** :

  - par défaut, un objet est hachable **par identité** : deux objets distincts sont deux clés distinctes ;
  - définir `__eq__` sans `__hash__` rend la classe **non hachable** (Python met `__hash__` à `None`) ;
  - pour une égalité par valeur, on définit `__hash__` à partir des **mêmes attributs** que `__eq__`, et ces attributs
    ne doivent plus changer : `@dataclass(frozen=True)` fait tout cela.

  Pour ranger une liste dans un ensemble, on la convertit : `tuple(xs)`, ou `frozenset(xs)` si l'ordre ne compte pas.

  **En entretien** : « Une clé de dictionnaire doit être hachable : son hachage ne change pas, et deux objets égaux ont
  le même hachage. Les types mutables comme `list`, `dict` et `set` ne le sont pas, car une clé modifiée serait perdue
  dans la table. Une classe qui redéfinit `__eq__` doit redéfinir `__hash__` sur les mêmes attributs, immuables. »
cards:
  - key: liste-comme-cle
    format: course
    question: "Pourquoi une liste ne peut-elle pas être une clé de dictionnaire ?"
    choices:
      - {text: "Elle est mutable : son hachage changerait avec son contenu, et la clé serait perdue", correct: true}
      - {text: "Elle est ordonnée, alors que les clés d'un dictionnaire ne le sont pas", correct: false}
      - {text: "Elle peut contenir des doublons, interdits parmi les clés", correct: false}
      - {text: "Elle est trop grande en mémoire pour servir de clé efficace", correct: false}
    answer: "Le dictionnaire range une clé selon son hachage au moment de l'insertion. Une liste modifiée ensuite aurait un autre hachage : on ne la retrouverait plus. Python refuse donc de hacher une liste."
  - key: tuple-qui-contient-liste
    format: course
    question: "Le tuple `(1, [2])` peut-il être une clé de dictionnaire ?"
    choices:
      - {text: "Non : un tuple n'est hachable que si tous ses éléments le sont", correct: true}
      - {text: "Oui : un tuple est toujours hachable, puisqu'il est immuable", correct: false}
      - {text: "Oui, mais seulement tant que la liste reste vide", correct: false}
      - {text: "Non : un tuple ne peut jamais servir de clé", correct: false}
    answer: "Le hachage d'un tuple combine ceux de ses éléments ; la liste n'en a pas. `hash((1, [2]))` lève une `TypeError`."
  - key: regle-eq-hash
    format: course
    question: "Quelle règle relie `__eq__` et `__hash__` ?"
    choices:
      - {text: "Deux objets égaux doivent avoir le même hachage", correct: true}
      - {text: "Deux objets de même hachage doivent être égaux", correct: false}
      - {text: "Deux objets différents doivent avoir des hachages différents", correct: false}
      - {text: "Un objet hachable ne doit pas définir `__eq__`", correct: false}
    answer: "Le dictionnaire cherche d'abord par hachage, puis vérifie avec `__eq__`. Deux objets égaux de hachages différents seraient cherchés dans deux cases différentes. Les collisions, elles, sont permises."
  - key: eq-sans-hash
    format: course
    question: "Que devient une classe qui définit `__eq__` sans `__hash__` ?"
    choices:
      - {text: "Elle n'est plus hachable : Python met `__hash__` à `None`", correct: true}
      - {text: "Elle reste hachable, d'après l'identité de ses objets", correct: false}
      - {text: "Elle devient hachable d'après ses attributs, automatiquement", correct: false}
      - {text: "Python refuse de la définir et lève une `TypeError`", correct: false}
    answer: "Garder le hachage par identité violerait la règle « égaux, donc même hachage ». Python préfère rendre les objets non hachables ; à toi de définir un `__hash__` cohérent."
  - key: vf-frozenset-cle
    format: true-false
    question: "Un `frozenset` peut servir de clé de dictionnaire."
    truth: true
    answer: "Un `frozenset` est immuable, donc hachable, contrairement à un `set`."
  - key: vf-chaine-non-hachable
    format: true-false
    question: "Une chaîne de caractères n'est pas hachable, car on peut la modifier."
    truth: false
    answer: "Les chaînes sont immuables : toute « modification » crée une nouvelle chaîne. Elles sont hachables, et sont les clés les plus courantes."
  - key: vf-objet-par-defaut
    format: true-false
    question: "Par défaut, l'objet d'une classe qui ne redéfinit ni `__eq__` ni `__hash__` est hachable."
    truth: true
    answer: "Il est hachable par identité : deux objets distincts sont deux clés distinctes, même avec les mêmes attributs."
  - key: vf-meme-hachage-egaux
    format: true-false
    question: "Deux objets qui ont le même hachage sont forcément égaux."
    truth: false
    answer: "C'est une collision : deux valeurs différentes peuvent tomber sur le même hachage. Le dictionnaire les départage avec `__eq__`."
  - key: qcm-cle-valide
    format: multiple-choice
    question: "Laquelle de ces valeurs peut servir de clé de dictionnaire ?"
    choices:
      - {text: "`(\"Paris\", 75)`", correct: true}
      - {text: "`[\"Paris\", 75]`", correct: false}
      - {text: "`{\"Paris\": 75}`", correct: false}
      - {text: "`{\"Paris\", 75}`", correct: false}
    answer: "Un tuple de valeurs hachables est hachable. La liste, le dictionnaire et l'ensemble sont mutables, donc non hachables."
  - key: qcm-cle-de-case
    format: multiple-choice
    question: "Tu veux indexer les cases d'une grille par leurs coordonnées. Quelle clé choisis-tu ?"
    choices:
      - {text: "Un tuple `(ligne, colonne)`", correct: true}
      - {text: "Une liste `[ligne, colonne]`", correct: false}
      - {text: "Un ensemble `{ligne, colonne}`", correct: false}
      - {text: "Un dictionnaire `{ligne: colonne}`", correct: false}
    answer: "Le tuple est hachable et garde l'ordre. L'ensemble n'est pas hachable, et confondrait `(1, 2)` et `(2, 1)` ; la liste et le dictionnaire ne sont pas hachables."
  - key: qcm-ensemble-de-listes
    format: multiple-choice
    question: "Comment ranger des listes dans un ensemble, pour retirer les doublons ?"
    choices:
      - {text: "Convertir chaque liste en tuple avant de l'ajouter", correct: true}
      - {text: "Ajouter les listes directement, avec `add`", correct: false}
      - {text: "Remplacer l'ensemble extérieur par un `frozenset`", correct: false}
      - {text: "Trier chaque liste, puis l'ajouter avec `add`", correct: false}
    answer: "`{tuple(xs) for xs in listes}`. Une liste, triée ou non, reste non hachable, et un `frozenset` n'accepte pas plus les listes comme éléments."
  - key: qcm-dataclass-hachable
    format: multiple-choice
    question: "Comment rendre hachable une dataclass qui compare ses objets par leurs champs ?"
    choices:
      - {text: "`@dataclass(frozen=True)`", correct: true}
      - {text: "`@dataclass(order=True)`", correct: false}
      - {text: "`@dataclass(hash=True)`", correct: false}
      - {text: "`@dataclass(slots=True)`", correct: false}
    answer: "Avec `frozen=True`, les champs ne changent plus, et la dataclass génère un `__hash__` cohérent avec `__eq__`. Le paramètre `hash` n'existe pas ; c'est `unsafe_hash`, à réserver aux cas maîtrisés."
  - key: code-quels-hachables
    format: code-output
    question: |-
      ```python
      types = []
      for valeur in ((1, 2), [1, 2], "ab", {1}):
          try:
              hash(valeur)
              types.append(type(valeur).__name__)
          except TypeError:
              pass
      print(types)
      ```
    answer: "Le tuple d'entiers et la chaîne sont hachables ; la liste et l'ensemble, mutables, lèvent une `TypeError`."
    check:
      output: "['tuple', 'str']"
    choices:
      - {text: "`['tuple', 'str']`", correct: true}
      - {text: "`['tuple', 'list', 'str', 'set']`", correct: false}
      - {text: "`['str']`", correct: false}
      - {text: "`['tuple', 'str', 'set']`", correct: false}
  - key: code-cle-frozenset
    format: code-output
    question: |-
      ```python
      d = {frozenset({1, 2}): "paire"}
      print(d[frozenset({2, 1})])
      ```
    answer: "Deux `frozenset` aux mêmes éléments sont égaux et ont le même hachage : c'est la même clé, quel que soit l'ordre d'écriture."
    check:
      output: "paire"
    choices:
      - {text: "`paire`", correct: true}
      - {text: "Une `KeyError`", correct: false}
      - {text: "`None`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: code-eq-sans-hash
    format: code-output
    question: |-
      ```python
      class Point:
          def __init__(self, x):
              self.x = x

          def __eq__(self, autre):
              return self.x == autre.x


      print(Point.__hash__ is None)
      ```
    answer: "Définir `__eq__` sans `__hash__` met `__hash__` à `None` : les objets `Point` ne sont plus hachables."
    check:
      output: "True"
    choices:
      - {text: "`True`", correct: true}
      - {text: "`False`", correct: false}
      - {text: "`None`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: code-tuple-avec-liste
    format: code-output
    question: |-
      ```python
      t = (1, [2])
      print(len(t))
      cache = {t: "valeur"}
      print(cache[t])
      ```
    answer: "`len(t)` s'affiche, puis la création du dictionnaire hache la clé : le hachage d'un tuple combine ceux de ses éléments, et la liste n'en a pas."
    check:
      output: "2"
      throws: TypeError
    choices:
      - {text: "`2`, puis une `TypeError`", correct: true}
      - {text: "`2`, puis `valeur`", correct: false}
      - {text: "`2`, puis une `KeyError`", correct: false}
      - {text: "Une `TypeError`, sans rien afficher avant", correct: false}
  - key: bug-coordonnees-liste
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: cannot use 'list' as a dict key (unhashable type: 'list')` :
      ```python
      distances = {}
      distances[[0, 0]] = "origine"
      print(distances)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`distances[(0, 0)] = \"origine\"`", correct: true}
      - {text: "`distances[list((0, 0))] = \"origine\"`", correct: false}
      - {text: "`distances[[0, 0][:]] = \"origine\"`", correct: false}
      - {text: "`distances[{0, 0}] = \"origine\"`", correct: false}
    answer: |-
      ```python
      distances = {}
      distances[(0, 0)] = "origine"
      print(distances)
      ```
      Un tuple d'entiers est hachable. `list(...)` et `[:]` redonnent une liste, et un ensemble n'est pas hachable non
      plus (et `{0, 0}` ne vaudrait que `{0}`).
  - key: bug-chemins-en-liste
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: cannot use 'list' as a set element (unhashable type: 'list')` :
      ```python
      chemins = set()
      chemins.add(["a", "b"])
      print(len(chemins))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`chemins.add((\"a\", \"b\"))`", correct: true}
      - {text: "`chemins.add(list([\"a\", \"b\"]))`", correct: false}
      - {text: "`chemins.update([[\"a\", \"b\"]])`", correct: false}
      - {text: "`chemins.add({\"a\", \"b\"})`", correct: false}
    answer: |-
      ```python
      chemins = set()
      chemins.add(("a", "b"))
      print(len(chemins))
      ```
      Un tuple de chaînes est hachable et garde l'ordre du chemin. `update` ajoute chaque élément de son argument : ici
      encore une liste.
  - key: bug-eq-sans-hash
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: cannot use 'Carte' as a set element (unhashable type: 'Carte')` :
      ```python
      class Carte:
          def __init__(self, nom):
              self.nom = nom

          def __eq__(self, autre):
              return self.nom == autre.nom


      main = {Carte("as")}
      print(len(main))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter `def __hash__(self): return hash(self.nom)`", correct: true}
      - {text: "Ajouter `def __hash__(self): return id(self)`", correct: false}
      - {text: "Ajouter `__hash__ = None` dans le corps de la classe", correct: false}
      - {text: "Remplacer le `==` de `__eq__` par l'opérateur `is`", correct: false}
    answer: |-
      ```python
      class Carte:
          def __init__(self, nom):
              self.nom = nom

          def __eq__(self, autre):
              return self.nom == autre.nom

          def __hash__(self):
              return hash(self.nom)


      main = {Carte("as")}
      print(len(main))
      ```
      Le hachage doit reposer sur les mêmes attributs que l'égalité. Avec `id(self)`, deux cartes égales auraient des
      hachages différents ; `__hash__ = None` est justement ce que Python a fait.
  - key: bug-cle-modifiee
    format: bug-fix
    question: |-
      Ce programme affiche `False` : le compte ne se retrouve plus dans le dictionnaire.
      ```python
      class Compte:
          def __init__(self, numero):
              self.numero = numero

          def __eq__(self, autre):
              return self.numero == autre.numero

          def __hash__(self):
              return hash(self.numero)


      c = Compte(1)
      soldes = {c: 100}
      c.numero = 2
      print(c in soldes)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Rendre le numéro immuable, par exemple avec `@dataclass(frozen=True)`", correct: true}
      - {text: "Calculer `__hash__` à partir de `id(self)` au lieu du numéro", correct: false}
      - {text: "Supprimer `__eq__`, pour que Python compare les comptes par identité", correct: false}
      - {text: "Appeler `hash(c)` une nouvelle fois, juste après le changement", correct: false}
    answer: |-
      ```python
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Compte:
          numero: int


      c = Compte(1)
      soldes = {c: 100}
      print(c in soldes)
      ```
      La clé est rangée selon le hachage de son numéro d'origine ; changer le numéro change son hachage, et le
      dictionnaire cherche ailleurs. Une clé ne doit pas changer : on fige ses attributs.
  - key: definition-hachable
    format: definition
    question: "Que veut dire « hachable » en Python ?"
    choices:
      - {text: "Que l'objet a un hachage qui ne change pas, et se compare avec `__eq__`", correct: true}
      - {text: "Que l'objet peut être découpé en morceaux par un découpage `[a:b]`", correct: false}
      - {text: "Que l'objet est chiffré avant d'être rangé en mémoire", correct: false}
      - {text: "Que l'objet peut être copié en profondeur par `copy.deepcopy`", correct: false}
    answer: "Un objet hachable peut être clé de dictionnaire ou élément d'ensemble. Les types immuables de base le sont ; `list`, `dict` et `set` ne le sont pas."
  - key: definition-fonction-hash
    format: definition
    question: "Que renvoie la fonction `hash(x)` ?"
    choices:
      - {text: "Un entier calculé d'après la valeur de `x`, qui sert à le ranger", correct: true}
      - {text: "L'adresse de `x` en mémoire, unique pour chaque objet", correct: false}
      - {text: "Une chaîne hexadécimale, comme une empreinte SHA-256", correct: false}
      - {text: "Le nombre d'éléments de `x`, si c'est une collection", correct: false}
    answer: "Deux valeurs égales ont le même hachage. Celui des chaînes change d'une exécution à l'autre (pour la sécurité) : il ne faut jamais le stocker."
  - key: definition-collision
    format: definition
    question: "Qu'est-ce qu'une collision dans une table de hachage ?"
    choices:
      - {text: "Deux clés différentes qui tombent sur la même case", correct: true}
      - {text: "Deux clés égales insérées dans le même dictionnaire", correct: false}
      - {text: "Une clé dont le hachage change après son insertion", correct: false}
      - {text: "Une clé absente, qui lève une `KeyError`", correct: false}
    answer: "Les collisions sont normales : la table compare alors les clés avec `__eq__`. Trop nombreuses, elles dégradent les accès vers O(n)."
  - key: definition-immuable
    format: definition
    question: "Qu'est-ce qu'un objet immuable ?"
    choices:
      - {text: "Un objet dont la valeur ne peut pas changer après sa création", correct: true}
      - {text: "Un objet qu'on ne peut pas réaffecter à une autre variable", correct: false}
      - {text: "Un objet que le ramasse-miettes ne peut pas supprimer", correct: false}
      - {text: "Un objet dont la classe ne peut pas être héritée", correct: false}
    answer: "`int`, `str`, `tuple`, `frozenset` sont immuables : une « modification » crée un nouvel objet. Le nom, lui, peut toujours être réaffecté."
