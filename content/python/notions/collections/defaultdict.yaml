notion: defaultdict
lesson: |-
  `collections.defaultdict` est un dictionnaire qui **fabrique une valeur** pour chaque clé absente qu'on lit. On lui
  donne une **fabrique** : une fonction sans argument, appelée à chaque clé manquante.

  ```python
  from collections import defaultdict

  groupes = defaultdict(list)       # la fabrique est list : list() renvoie []
  for mot in ["ane", "bol", "abri"]:
      groupes[mot[0]].append(mot)   # pas besoin de tester si la clé existe
  dict(groupes)                     # {'a': ['ane', 'abri'], 'b': ['bol']}

  compte = defaultdict(int)         # int() renvoie 0
  for lettre in "banane":
      compte[lettre] += 1
  ```

  | Fabrique | Valeur créée | Usage |
  |---|---|---|
  | `list` | `[]` | grouper des valeurs par clé |
  | `int` | `0` | compter (ou `Counter`) |
  | `set` | `set()` | grouper sans doublon |
  | `lambda: "?"` | `"?"` | une valeur fixe quelconque |
  | `lambda: defaultdict(int)` | un `defaultdict(int)` | deux niveaux : `d[ville][produit] += 1` |

  **On passe la fabrique, pas la valeur** : `defaultdict(0)` et `defaultdict([])` lèvent
  `TypeError: first argument must be callable or None`.

  **Lire une clé absente l'ajoute** : `d[k]` appelle la fabrique et **insère** la nouvelle valeur. Un simple test
  `if d[k]:` crée donc la clé. Pour tester sans créer, on écrit `k in d` ou `d.get(k)` : ni `in` ni `get` n'appellent
  la fabrique.

  `defaultdict` est une sous-classe de `dict`. Son affichage montre la fabrique :
  `defaultdict(<class 'int'>, {'a': 2})`. Pour renvoyer un dictionnaire ordinaire (et retrouver la `KeyError`), on
  le convertit : `dict(d)`.

  Face à `d.setdefault(k, []).append(v)`, `defaultdict` est plus lisible quand toutes les clés ont la même valeur par
  défaut, et ne crée la liste vide que si la clé manque.

  **En entretien** : « `defaultdict(fabrique)` appelle la fabrique pour toute clé absente qu'on lit, et l'insère :
  `defaultdict(list)` pour grouper, `defaultdict(int)` pour compter. La fabrique est une fonction, pas une valeur. Le
  piège : lire une clé pour la tester la crée ; on teste avec `in` ou `get`. »
cards:
  - key: la-fabrique
    format: course
    question: "Que reçoit `defaultdict` en premier argument ?"
    choices:
      - {text: "Une fonction sans argument, qui fabrique la valeur par défaut", correct: true}
      - {text: "La valeur par défaut elle-même, copiée pour chaque clé", correct: false}
      - {text: "Le type des clés que le dictionnaire acceptera", correct: false}
      - {text: "Le nombre de clés à créer à l'avance", correct: false}
    answer: "`list`, `int`, `set` ou une `lambda` : `defaultdict` l'appelle à chaque clé absente. Une valeur ne suffirait pas : une liste partagée serait la même pour toutes les clés."
  - key: lecture-insere
    format: course
    question: "Que se passe-t-il quand on lit `d[\"x\"]` sur un `defaultdict(list)` qui n'a pas cette clé ?"
    choices:
      - {text: "La clé est créée avec `[]`, puis cette liste est renvoyée", correct: true}
      - {text: "`[]` est renvoyée, mais la clé n'est pas créée", correct: false}
      - {text: "Une `KeyError`, comme avec un dictionnaire ordinaire", correct: false}
      - {text: "`None` est renvoyé, et la clé n'est pas créée", correct: false}
    answer: "La valeur fabriquée est insérée : c'est ce qui permet `d[k].append(v)`. C'est aussi un piège, car une simple lecture agrandit le dictionnaire."
  - key: get-sans-fabrique
    format: course
    question: "Que renvoie `d.get(\"x\")` sur un `defaultdict(int)` qui n'a pas cette clé ?"
    choices:
      - {text: "`None` : `get` n'appelle pas la fabrique", correct: true}
      - {text: "`0` : `get` appelle la fabrique `int`", correct: false}
      - {text: "Une `KeyError` : la clé n'existe pas", correct: false}
      - {text: "`0`, et la clé est ajoutée au dictionnaire", correct: false}
    answer: "Seule la lecture par crochets (`__getitem__`) appelle la fabrique. `get` et `in` se comportent comme sur un dictionnaire ordinaire."
  - key: face-a-setdefault
    format: course
    question: "Pourquoi préférer `defaultdict(list)` à `d.setdefault(k, []).append(v)` dans une boucle ?"
    choices:
      - {text: "Le code est plus lisible, et la liste vide n'est créée que si la clé manque", correct: true}
      - {text: "`setdefault` remplace la liste existante à chaque appel de la boucle", correct: false}
      - {text: "`defaultdict` trie ses clés, ce que `setdefault` ne fait pas", correct: false}
      - {text: "`setdefault` lève une `KeyError` quand la clé manque encore", correct: false}
    answer: "`setdefault` évalue `[]` à chaque appel, même si la clé existe ; il ne remplace rien pour autant. `defaultdict` dit une fois pour toutes la valeur par défaut."
  - key: vf-int-vaut-zero
    format: true-false
    question: "Dans un `defaultdict(int)`, une clé absente vaut 0 à la première lecture."
    truth: true
    answer: "`int()` renvoie 0 : la clé est créée avec 0. D'où `d[k] += 1` sans initialisation."
  - key: vf-in-cree
    format: true-false
    question: "`\"x\" in d` ajoute la clé `\"x\"` à un `defaultdict`."
    truth: false
    answer: "`in` n'appelle pas la fabrique : c'est la façon de tester une clé sans la créer."
  - key: vf-sous-classe
    format: true-false
    question: "`defaultdict` est une sous-classe de `dict`."
    truth: true
    answer: "On peut le passer partout où un `dict` est attendu ; `isinstance(d, dict)` vaut `True`."
  - key: vf-valeur-directe
    format: true-false
    question: "`defaultdict(0)` crée un dictionnaire dont les clés absentes valent 0."
    truth: false
    answer: "`TypeError: first argument must be callable or None`. La fabrique de 0 est `int`."
  - key: qcm-grouper
    format: multiple-choice
    question: "Quelle fabrique choisir pour grouper des valeurs par clé dans des listes ?"
    choices:
      - {text: "`defaultdict(list)`", correct: true}
      - {text: "`defaultdict([])`", correct: false}
      - {text: "`defaultdict(list())`", correct: false}
      - {text: "`defaultdict(tuple)`", correct: false}
    answer: "On passe la classe `list`, que `defaultdict` appellera. `[]` et `list()` sont des valeurs ; un tuple n'a pas d'`append`."
  - key: qcm-compter
    format: multiple-choice
    question: "Quelle fabrique choisir pour compter des occurrences ?"
    choices:
      - {text: "`defaultdict(int)`", correct: true}
      - {text: "`defaultdict(0)`", correct: false}
      - {text: "`defaultdict(str)`", correct: false}
      - {text: "`defaultdict(None)`", correct: false}
    answer: "`int()` vaut 0. `str()` vaut `''`, auquel on ne peut pas ajouter 1, et `None` revient à un dictionnaire ordinaire, qui lève une `KeyError`."
  - key: qcm-valeur-texte
    format: multiple-choice
    question: "Comment donner `\"inconnu\"` comme valeur par défaut ?"
    choices:
      - {text: "`defaultdict(lambda: \"inconnu\")`", correct: true}
      - {text: "`defaultdict(\"inconnu\")`", correct: false}
      - {text: "`defaultdict(str, \"inconnu\")`", correct: false}
      - {text: "`defaultdict(default=\"inconnu\")`", correct: false}
    answer: "Une `lambda` sans argument fabrique la valeur. Une chaîne n'est pas appelable, et le second argument de `defaultdict` sert à le remplir, comme pour `dict`."
  - key: qcm-deux-niveaux
    format: multiple-choice
    question: "Comment déclarer `d` pour écrire `d[ville][produit] += 1` sans initialisation ?"
    choices:
      - {text: "`defaultdict(lambda: defaultdict(int))`", correct: true}
      - {text: "`defaultdict(defaultdict(int))`", correct: false}
      - {text: "`defaultdict(dict(int))`", correct: false}
      - {text: "`defaultdict(int, int)`", correct: false}
    answer: "La fabrique extérieure doit créer un nouveau `defaultdict(int)` à chaque ville : une `lambda`. `defaultdict(defaultdict(int))` passe un objet, qui n'est pas appelable."
  - key: trous-list
    format: fill-in
    question: |-
      Complète pour grouper les mots par longueur :
      ```python
      groupes = defaultdict(___)
      for mot in mots:
          groupes[len(mot)].append(mot)
      ```
    blanks:
      - [list]
    answer: "`list` fabrique une liste vide pour chaque nouvelle longueur."
  - key: trous-int
    format: fill-in
    question: |-
      Complète pour compter les lettres :
      ```python
      compte = defaultdict(___)
      for lettre in texte:
          compte[lettre] += 1
      ```
    blanks:
      - [int]
    answer: "`int()` vaut 0 : le premier `+= 1` donne 1."
  - key: trous-lambda
    format: fill-in
    question: |-
      Complète pour que chaque clé absente vaille `"?"` :
      ```python
      noms = defaultdict(___: "?")
      ```
    blanks:
      - [lambda]
    answer: "`lambda: \"?\"` est une fonction sans argument qui renvoie `\"?\"`."
  - key: trous-set
    format: fill-in
    question: |-
      Complète pour garder, par auteur, ses livres sans doublon :
      ```python
      livres = defaultdict(set)
      for auteur, titre in paires:
          livres[auteur].___(titre)
      ```
    blanks:
      - [add]
    answer: "La fabrique `set` crée un ensemble vide ; on y ajoute avec `add`."
  - key: code-test-cree
    format: code-output
    question: |-
      ```python
      from collections import defaultdict

      d = defaultdict(list)
      if d["x"]:
          print("non vide")
      print(len(d), dict(d))
      ```
    answer: "Le test lit `d[\"x\"]`, ce qui crée la clé avec une liste vide ; la liste est fausse, rien n'est affiché par le `if`."
    check:
      output: "1 {'x': []}"
    choices:
      - {text: "`1 {'x': []}`", correct: true}
      - {text: "`0 {}`", correct: false}
      - {text: "`1 {'x': None}`", correct: false}
      - {text: "`0 {'x': []}`", correct: false}
  - key: code-get-in-crochets
    format: code-output
    question: |-
      ```python
      from collections import defaultdict

      d = defaultdict(int)
      print(d.get("a"), "b" in d, d["c"], len(d))
      ```
    answer: "`get` et `in` n'appellent pas la fabrique ; seul `d[\"c\"]` crée une clé, avec 0."
    check:
      output: "None False 0 1"
    choices:
      - {text: "`None False 0 1`", correct: true}
      - {text: "`0 False 0 3`", correct: false}
      - {text: "`None False 0 3`", correct: false}
      - {text: "`0 True 0 1`", correct: false}
  - key: code-grouper-initiales
    format: code-output
    question: |-
      ```python
      from collections import defaultdict

      groupes = defaultdict(list)
      for mot in ["ane", "bol", "abri", "bus"]:
          groupes[mot[0]].append(mot)
      print(dict(groupes))
      ```
    answer: "Chaque initiale reçoit sa liste, remplie dans l'ordre de parcours."
    check:
      output: "{'a': ['ane', 'abri'], 'b': ['bol', 'bus']}"
    choices:
      - {text: "`{'a': ['ane', 'abri'], 'b': ['bol', 'bus']}`", correct: true}
      - {text: "`{'a': ['abri', 'ane'], 'b': ['bol', 'bus']}`", correct: false}
      - {text: "`{'a': 'abri', 'b': 'bus'}`", correct: false}
      - {text: "`{'a': ['ane'], 'b': ['bol']}`", correct: false}
  - key: code-affichage
    format: code-output
    question: |-
      ```python
      from collections import defaultdict

      d = defaultdict(int)
      d["a"] += 2
      print(d)
      ```
    answer: "L'affichage d'un `defaultdict` montre sa fabrique, puis son contenu."
    check:
      output: "defaultdict(<class 'int'>, {'a': 2})"
    choices:
      - {text: "`defaultdict(<class 'int'>, {'a': 2})`", correct: true}
      - {text: "`{'a': 2}`", correct: false}
      - {text: "`defaultdict(int, {'a': 2})`", correct: false}
      - {text: "`defaultdict(<class 'int'>, {'a': 1})`", correct: false}
  - key: bug-valeur-au-lieu-de-fabrique
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: first argument must be callable or None` :
      ```python
      from collections import defaultdict

      compte = defaultdict(0)
      compte["a"] += 1
      print(compte)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`compte = defaultdict(int)`", correct: true}
      - {text: "`compte = defaultdict(int())`", correct: false}
      - {text: "`compte = defaultdict(\"0\")`", correct: false}
      - {text: "`compte = defaultdict(None)`", correct: false}
    answer: |-
      ```python
      from collections import defaultdict

      compte = defaultdict(int)
      compte["a"] += 1
      print(compte)
      ```
      `defaultdict` attend une fonction qu'il appellera : `int`, et non `int()`, qui vaut 0. Avec `None`, il n'y a
      plus de valeur par défaut.
  - key: bug-test-qui-cree
    format: bug-fix
    question: |-
      Ce programme affiche `['go', 'python']` à la fin : le test a créé un cours `go`.
      ```python
      from collections import defaultdict

      inscrits = defaultdict(list)
      inscrits["python"].append("ana")
      for cours in ["python", "go"]:
          if not inscrits[cours]:
              print(cours, "sans inscrit")
      print(sorted(inscrits))
      ```
      Quelle correction teste sans rien créer ?
    choices:
      - {text: "Tester `if not inscrits.get(cours):`", correct: true}
      - {text: "Tester `if inscrits[cours] == []:`", correct: false}
      - {text: "Tester `if len(inscrits[cours]) == 0:`", correct: false}
      - {text: "Tester `if inscrits[cours] is None:`", correct: false}
    answer: |-
      ```python
      from collections import defaultdict

      inscrits = defaultdict(list)
      inscrits["python"].append("ana")
      for cours in ["python", "go"]:
          if not inscrits.get(cours):
              print(cours, "sans inscrit")
      print(sorted(inscrits))
      ```
      Toute lecture par crochets appelle la fabrique et insère la clé. `get` (comme `in`) ne crée rien.
  - key: bug-liste-partagee
    format: bug-fix
    question: |-
      Ce programme affiche `[1, 2]` au lieu de `[1]` :
      ```python
      from collections import defaultdict

      vide = []
      groupes = defaultdict(lambda: vide)
      groupes["a"].append(1)
      groupes["b"].append(2)
      print(groupes["a"])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`groupes = defaultdict(list)`", correct: true}
      - {text: "`groupes = defaultdict(vide)`", correct: false}
      - {text: "`groupes = defaultdict(lambda: [vide])`", correct: false}
      - {text: "`groupes = defaultdict(lambda: vide, list)`", correct: false}
    answer: |-
      ```python
      from collections import defaultdict

      groupes = defaultdict(list)
      groupes["a"].append(1)
      groupes["b"].append(2)
      print(groupes["a"])
      ```
      La `lambda` renvoie toujours la même liste `vide` : toutes les clés la partagent. `list` crée une nouvelle liste
      à chaque appel.
  - key: bug-dict-ordinaire
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `KeyError: 'Lyon'` :
      ```python
      par_ville = {}
      for nom, ville in [("ana", "Lyon"), ("bob", "Lyon")]:
          par_ville[ville].append(nom)
      print(par_ville)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`par_ville = defaultdict(list)`, importé de `collections`", correct: true}
      - {text: "`par_ville = defaultdict()`, importé de `collections`", correct: false}
      - {text: "`par_ville = dict(list)`, sans rien importer", correct: false}
      - {text: "`par_ville = {[]}`, un dictionnaire de listes", correct: false}
    answer: |-
      ```python
      from collections import defaultdict

      par_ville = defaultdict(list)
      for nom, ville in [("ana", "Lyon"), ("bob", "Lyon")]:
          par_ville[ville].append(nom)
      print(dict(par_ville))
      ```
      Sans fabrique, `defaultdict()` se comporte comme un dictionnaire ordinaire. `dict(list)` et `{[]}` lèvent une
      `TypeError`.
