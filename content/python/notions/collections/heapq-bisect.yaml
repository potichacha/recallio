notion: heapq-bisect
lesson: |-
  Deux modules travaillent sur de simples **listes**, avec des algorithmes classiques.

  **`heapq` : un tas min.** Une liste organisée en tas garantit que `tas[0]` est **le plus petit** élément ; le reste
  n'est **pas trié**.

  | Fonction | Effet | Coût |
  |---|---|---|
  | `heapq.heappush(tas, x)` | ajoute `x` | O(log n) |
  | `heapq.heappop(tas)` | retire et renvoie le plus petit | O(log n) |
  | `heapq.heapify(xs)` | transforme une liste en tas, sur place | O(n) |
  | `heapq.nsmallest(k, xs)`, `nlargest(k, xs)` | les `k` plus petits ou plus grands | O(n log k) |

  ```python
  import heapq

  taches = []
  heapq.heappush(taches, (2, "écrire"))
  heapq.heappush(taches, (1, "lire"))
  heapq.heappop(taches)          # (1, 'lire') : la plus petite priorité d'abord
  ```

  - **Une file de priorité** : on pousse des tuples `(priorité, compteur, tâche)`. Le compteur départage deux priorités
    égales (dans l'ordre d'arrivée) et évite de comparer les tâches elles-mêmes, qui ne sont peut-être pas
    comparables.
  - **Un tas max** : on pousse `-x` et on rend le signe en sortant. Python 3.14 ajoute `heappush_max`,
    `heappop_max` et `heapify_max`.
  - **Les k meilleurs d'un flux** : un tas de taille k, où l'on remplace le plus petit quand un meilleur arrive.

  **`bisect` : la recherche dichotomique** dans une liste **triée**, en O(log n).

  ```python
  import bisect

  xs = [10, 20, 20, 30]
  bisect.bisect_left(xs, 20)     # 1 : avant les 20
  bisect.bisect_right(xs, 20)    # 3 : après les 20 (bisect.bisect est un alias)
  bisect.insort(xs, 25)          # insère en gardant l'ordre : [10, 20, 20, 25, 30]
  ```

  `insort` trouve la place en O(log n), mais l'insertion décale les éléments suivants : O(n) au total. Sur une liste
  non triée, `bisect` renvoie un résultat sans erreur, mais faux. Depuis Python 3.10, `key=` permet de chercher dans
  une liste d'objets triée par un attribut.

  Usage classique de `bisect` : classer une valeur dans des tranches (`bisect.bisect([10, 12, 14], note)` donne la
  mention).

  **En entretien** : « `heapq` maintient un tas min dans une liste : `heappush` et `heappop` en O(log n), le plus petit
  toujours en `tas[0]` ; c'est la file de priorité de Python. `bisect` cherche par dichotomie dans une liste triée en
  O(log n), mais `insort` reste en O(n) à cause de l'insertion. »
cards:
  - key: garantie-du-tas
    format: course
    question: "Que garantit une liste maintenue par `heapq` ?"
    choices:
      - {text: "Que `tas[0]` est le plus petit élément", correct: true}
      - {text: "Que la liste entière est triée", correct: false}
      - {text: "Que `tas[-1]` est le plus grand élément", correct: false}
      - {text: "Que les éléments sont tous uniques", correct: false}
    answer: "Un tas garantit seulement que chaque parent est plus petit que ses enfants : la racine, `tas[0]`, est le minimum. Le reste n'est pas trié."
  - key: complexite-du-tas
    format: course
    question: "Quel est le coût de `heappush` et de `heappop` ?"
    choices:
      - {text: "O(log n)", correct: true}
      - {text: "O(1)", correct: false}
      - {text: "O(n)", correct: false}
      - {text: "O(n log n)", correct: false}
    answer: "Un élément monte ou descend le long d'une branche de l'arbre, de hauteur log n. Lire le minimum, `tas[0]`, coûte O(1)."
  - key: bisect-left-ou-right
    format: course
    question: "Quelle différence entre `bisect_left` et `bisect_right` pour une valeur déjà présente ?"
    choices:
      - {text: "`bisect_left` donne l'indice avant les égaux ; `bisect_right` celui d'après", correct: true}
      - {text: "`bisect_left` cherche depuis le début ; `bisect_right` depuis la fin", correct: false}
      - {text: "`bisect_left` renvoie la valeur ; `bisect_right` renvoie son indice", correct: false}
      - {text: "Aucune, tant que la valeur est présente dans la liste", correct: false}
    answer: "Dans `[10, 20, 20, 30]`, `bisect_left(xs, 20)` vaut 1 et `bisect_right(xs, 20)` vaut 3. Pour une valeur absente, les deux coïncident."
  - key: tas-max
    format: course
    question: "Comment obtenir un tas max avec `heapq`, d'une façon qui marche aussi avant Python 3.14 ?"
    choices:
      - {text: "Pousser les valeurs négatives, et rendre le signe en sortant", correct: true}
      - {text: "Appeler `heapq.heapify(tas, reverse=True)`", correct: false}
      - {text: "Trier la liste à l'envers, puis appeler `heapify`", correct: false}
      - {text: "Lire `tas[-1]` au lieu de `tas[0]`", correct: false}
    answer: "Le plus petit des opposés est l'opposé du plus grand. `heapify` n'a pas de paramètre `reverse`, et `tas[-1]` n'est pas le maximum. Python 3.14 ajoute `heappush_max` et `heappop_max`."
  - key: vf-tas-trie
    format: true-false
    question: "Après `heapq.heapify(xs)`, la liste `xs` est triée."
    truth: false
    answer: "Elle respecte seulement la propriété de tas : `xs[0]` est le minimum. Pour tout trier, c'est `xs.sort()`."
  - key: vf-heapify-lineaire
    format: true-false
    question: "`heapq.heapify` transforme une liste en tas en temps linéaire."
    truth: true
    answer: "O(n), plus rapide que n `heappush` successifs, en O(n log n)."
  - key: vf-bisect-liste-triee
    format: true-false
    question: "`bisect` ne donne un résultat juste que sur une liste triée."
    truth: true
    answer: "La dichotomie suppose l'ordre. Sur une liste non triée, elle ne lève aucune erreur : elle renvoie un indice sans signification."
  - key: vf-insort-logarithmique
    format: true-false
    question: "`bisect.insort` insère un élément en O(log n) au total."
    truth: false
    answer: "Trouver la place coûte O(log n), mais insérer dans une liste décale les éléments suivants : O(n)."
  - key: qcm-trois-plus-grands
    format: multiple-choice
    question: "Comment obtenir les 3 plus grandes valeurs d'une longue liste, avec `heapq` ?"
    choices:
      - {text: "`heapq.nlargest(3, xs)`", correct: true}
      - {text: "`heapq.heappop(xs, 3)`", correct: false}
      - {text: "`heapq.heappush(xs, 3)`", correct: false}
      - {text: "`bisect.nlargest(3, xs)`", correct: false}
    answer: "`nlargest` garde un tas de taille 3 en parcourant la liste : O(n log 3). `heappop` ne prend qu'un tas, et `bisect` n'a pas de `nlargest`."
  - key: qcm-inserer-trie
    format: multiple-choice
    question: "Comment insérer `x` dans la liste triée `xs` en la gardant triée ?"
    choices:
      - {text: "`bisect.insort(xs, x)`", correct: true}
      - {text: "`heapq.heappush(xs, x)`", correct: false}
      - {text: "`xs.insert(x)`", correct: false}
      - {text: "`xs.append(x)`", correct: false}
    answer: "`insort` cherche la place par dichotomie, puis insère. `heappush` maintient un tas, pas une liste triée."
  - key: qcm-compteur-dans-le-tuple
    format: multiple-choice
    question: "Pourquoi pousser `(priorite, compteur, tache)` plutôt que `(priorite, tache)` dans un tas ?"
    choices:
      - {text: "Pour ne jamais comparer deux tâches quand leurs priorités sont égales", correct: true}
      - {text: "Pour que le tas trie aussi les tâches par ordre alphabétique", correct: false}
      - {text: "Pour que `heappop` renvoie la tâche la plus récente d'abord", correct: false}
      - {text: "Pour que le tas puisse contenir plus d'un million d'éléments", correct: false}
    answer: "À priorité égale, les tuples se départagent par l'élément suivant : un compteur croissant, unique, qui garde l'ordre d'arrivée. Sans lui, Python comparerait les tâches, peut-être incomparables."
  - key: qcm-cout-bisect
    format: multiple-choice
    question: "Quel est le coût de `bisect.bisect_left` sur une liste triée de n éléments ?"
    choices:
      - {text: "O(log n)", correct: true}
      - {text: "O(n)", correct: false}
      - {text: "O(1)", correct: false}
      - {text: "O(n log n)", correct: false}
    answer: "La dichotomie coupe l'intervalle en deux à chaque étape. Un million d'éléments demandent une vingtaine de comparaisons."
  - key: trous-heappush
    format: fill-in
    question: |-
      Complète pour ajouter une tâche au tas :
      ```python
      heapq.___(tas, (priorite, tache))
      ```
    blanks:
      - [heappush]
    answer: "`heappush` ajoute en gardant la propriété de tas."
  - key: trous-heappop
    format: fill-in
    question: |-
      Complète pour retirer la tâche de plus petite priorité :
      ```python
      priorite, tache = heapq.___(tas)
      ```
    blanks:
      - [heappop]
    answer: "`heappop` retire et renvoie le plus petit élément."
  - key: trous-heapify
    format: fill-in
    question: |-
      Complète pour transformer la liste en tas, sur place :
      ```python
      heapq.___(valeurs)
      ```
    blanks:
      - [heapify]
    answer: "`heapify` réorganise la liste en O(n) et renvoie `None`."
  - key: trous-bisect-left
    format: fill-in
    question: |-
      Complète pour trouver où insérer `x` sans casser l'ordre, avant les valeurs égales :
      ```python
      i = bisect.___(xs, x)
      ```
    blanks:
      - [bisect_left]
    answer: "`bisect_left` place `x` avant les éléments égaux ; `bisect_right` après."
  - key: code-heappop
    format: code-output
    question: |-
      ```python
      import heapq

      tas = []
      for x in [5, 1, 4, 2]:
          heapq.heappush(tas, x)
      print(heapq.heappop(tas), heapq.heappop(tas), tas[0])
      ```
    answer: "Le tas sort le plus petit à chaque `heappop` : 1, puis 2 ; il reste 4 et 5, dont `tas[0]` est le minimum."
    check:
      output: "1 2 4"
    choices:
      - {text: "`1 2 4`", correct: true}
      - {text: "`5 1 4`", correct: false}
      - {text: "`1 2 5`", correct: false}
      - {text: "`5 4 2`", correct: false}
  - key: code-bisect
    format: code-output
    question: |-
      ```python
      import bisect

      xs = [10, 20, 20, 30]
      print(bisect.bisect_left(xs, 20), bisect.bisect_right(xs, 20), bisect.bisect(xs, 25))
      ```
    answer: "Avant les 20 : 1 ; après les 20 : 3. 25 se place entre 20 et 30, à l'indice 3."
    check:
      output: "1 3 3"
    choices:
      - {text: "`1 3 3`", correct: true}
      - {text: "`1 2 3`", correct: false}
      - {text: "`2 3 3`", correct: false}
      - {text: "`1 3 2`", correct: false}
  - key: code-nsmallest
    format: code-output
    question: |-
      ```python
      import heapq

      print(heapq.nsmallest(2, [7, 3, 9, 1]), heapq.nlargest(1, "python"))
      ```
    answer: "Les deux plus petits, dans l'ordre croissant ; la plus grande lettre de `python` est `y`."
    check:
      output: "[1, 3] ['y']"
    choices:
      - {text: "`[1, 3] ['y']`", correct: true}
      - {text: "`[7, 3] ['n']`", correct: false}
      - {text: "`[1, 3] ['p']`", correct: false}
      - {text: "`[3, 1] ['y']`", correct: false}
  - key: code-tas-max
    format: code-output
    question: |-
      ```python
      import heapq

      tas = []
      for x in [3, 8, 5]:
          heapq.heappush(tas, -x)
      print(-heapq.heappop(tas), len(tas))
      ```
    answer: "Le plus petit des opposés est -8 : on rend le signe et on obtient le maximum, 8. Il reste deux éléments."
    check:
      output: "8 2"
    choices:
      - {text: "`8 2`", correct: true}
      - {text: "`3 2`", correct: false}
      - {text: "`-8 2`", correct: false}
      - {text: "`8 3`", correct: false}
