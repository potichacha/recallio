notion: deque
lesson: |-
  `collections.deque` (prononcé « dèque ») est une **file à deux bouts** : on ajoute et on retire en tête comme en
  queue, **en temps constant**.

  ```python
  from collections import deque

  file = deque(["a", "b"])
  file.append("c")          # à droite : deque(['a', 'b', 'c'])
  file.appendleft("z")      # à gauche : deque(['z', 'a', 'b', 'c'])
  file.pop()                # 'c', retiré à droite
  file.popleft()            # 'z', retiré à gauche
  ```

  **Pourquoi pas une liste ?** Une liste est rapide à la fin, mais pas au début :

  | Opération | `list` | `deque` |
  |---|---|---|
  | ajouter ou retirer à la fin | O(1) | O(1) |
  | ajouter ou retirer au début | O(n) : `insert(0, x)`, `pop(0)` décalent tout | O(1) : `appendleft`, `popleft` |
  | lire `xs[i]` au milieu | O(1) | O(n) |
  | découper `xs[a:b]` | oui | non |

  Une `deque` est donc la structure d'une **file** (premier entré, premier sorti : `append` puis `popleft`), par
  exemple pour un parcours en largeur. Avec `append` et `pop`, c'est une pile.

  **Une taille maximale** : `deque(maxlen=n)` garde les `n` derniers éléments. Une fois pleine, chaque ajout d'un côté
  fait tomber un élément de l'autre côté : parfait pour un historique ou les dernières lignes d'un fichier.

  ```python
  dernieres = deque(maxlen=3)
  for i in range(5):
      dernieres.append(i)
  dernieres                 # deque([2, 3, 4], maxlen=3)
  ```

  Autres méthodes : `rotate(k)` fait tourner les éléments de `k` crans vers la droite (`rotate(-1)` vers la gauche),
  `extend` et `extendleft` ajoutent plusieurs éléments (`extendleft` les place **un à un** à gauche, donc à l'envers).
  `popleft()` sur une `deque` vide lève une `IndexError`.

  `append` et `popleft` sont sûrs entre threads, mais une `deque` ne sait pas **attendre** un élément : pour un
  producteur et un consommateur, `queue.Queue` bloque sur `get()`.

  **En entretien** : « Une `deque` ajoute et retire aux deux bouts en O(1), là où `list.pop(0)` coûte O(n) : c'est la
  structure d'une file, par exemple pour un parcours en largeur. `maxlen` en fait un tampon circulaire. En revanche,
  l'accès au milieu est en O(n). »
cards:
  - key: pourquoi-deque
    format: course
    question: "Pourquoi utiliser une `deque` plutôt qu'une liste pour une file d'attente ?"
    choices:
      - {text: "Retirer en tête est en O(1), contre O(n) pour `list.pop(0)`", correct: true}
      - {text: "Une `deque` trie ses éléments à chaque ajout", correct: false}
      - {text: "Une `deque` prend moins de mémoire qu'une liste vide", correct: false}
      - {text: "Une liste ne peut pas retirer son premier élément", correct: false}
    answer: "`list.pop(0)` décale tous les éléments suivants. Une `deque` est faite de blocs reliés : elle retire en tête sans rien déplacer."
  - key: maxlen-plein
    format: course
    question: "Que fait une `deque(maxlen=3)` pleine quand on y ajoute un élément à droite ?"
    choices:
      - {text: "Elle retire l'élément le plus à gauche", correct: true}
      - {text: "Elle lève une `IndexError`", correct: false}
      - {text: "Elle ignore le nouvel élément", correct: false}
      - {text: "Elle double sa taille maximale", correct: false}
    answer: "Une `deque` bornée garde les derniers éléments ajoutés : ajouter à droite fait tomber le plus ancien à gauche, et inversement."
  - key: acces-au-milieu
    format: course
    question: "Quel est le coût de `dq[i]` au milieu d'une grande `deque` ?"
    choices:
      - {text: "O(n) : une `deque` est rapide aux bouts, pas au milieu", correct: true}
      - {text: "O(1), comme pour une liste", correct: false}
      - {text: "O(log n), comme dans un arbre", correct: false}
      - {text: "Aucun : une `deque` ne s'indexe pas", correct: false}
    answer: "Une `deque` s'indexe, mais doit parcourir ses blocs jusqu'au bon : O(n) au milieu, O(1) près des bouts. Pour des accès au hasard, une liste."
  - key: rotate
    format: course
    question: "Que fait `dq.rotate(1)` ?"
    choices:
      - {text: "Il déplace le dernier élément au début", correct: true}
      - {text: "Il déplace le premier élément à la fin", correct: false}
      - {text: "Il inverse l'ordre de tous les éléments", correct: false}
      - {text: "Il retire le premier élément de la file", correct: false}
    answer: "`rotate(k)` fait tourner de `k` crans vers la droite : `[1, 2, 3, 4]` devient `[4, 1, 2, 3]`. `rotate(-1)` tourne vers la gauche."
  - key: vf-popleft-constant
    format: true-false
    question: "`deque.popleft()` s'exécute en temps constant."
    truth: true
    answer: "C'est la raison d'être de la `deque` : les deux bouts sont en O(1)."
  - key: vf-pop0-aussi-rapide
    format: true-false
    question: "`list.pop(0)` est aussi rapide que `deque.popleft()` sur une grande collection."
    truth: false
    answer: "`list.pop(0)` décale tous les éléments restants : O(n). Sur une file de millions d'éléments, la différence est énorme."
  - key: vf-extendleft-ordre
    format: true-false
    question: "`dq.extendleft([1, 2, 3])` place les éléments au début, dans l'ordre 1, 2, 3."
    truth: false
    answer: "`extendleft` ajoute les éléments un à un à gauche : 1, puis 2 devant, puis 3 devant. Le début devient 3, 2, 1."
  - key: vf-popleft-vide
    format: true-false
    question: "`popleft()` sur une `deque` vide lève une `IndexError`."
    truth: true
    answer: "`IndexError: pop from an empty deque`. On teste d'abord `if file:`, une `deque` vide étant fausse."
  - key: qcm-ajout-en-tete
    format: multiple-choice
    question: "Comment ajouter `x` au début d'une `deque` ?"
    choices:
      - {text: "`dq.appendleft(x)`", correct: true}
      - {text: "`dq.insert(x)`", correct: false}
      - {text: "`dq.prepend(x)`", correct: false}
      - {text: "`dq.append(x, 0)`", correct: false}
    answer: "`appendleft` et `popleft` sont les versions « à gauche » d'`append` et `pop`. `prepend` n'existe pas."
  - key: qcm-dernieres-lignes
    format: multiple-choice
    question: "Comment ne garder que les 10 dernières lignes d'un fichier ?"
    choices:
      - {text: "`deque(lignes, maxlen=10)`", correct: true}
      - {text: "`deque(lignes)[:10]`", correct: false}
      - {text: "`deque(lignes, size=10)`", correct: false}
      - {text: "`deque(lignes).popleft(10)`", correct: false}
    answer: "Une `deque` bornée lit tout le fichier et ne garde que la fin. Une `deque` ne se découpe pas, et `[:10]` donnerait le début."
  - key: qcm-parcours-en-largeur
    format: multiple-choice
    question: "Quelle structure sert de file dans un parcours en largeur ?"
    choices:
      - {text: "Une `deque`, avec `append` et `popleft`", correct: true}
      - {text: "Une liste, avec `append` et `pop()`", correct: false}
      - {text: "Un `set`, avec `add` et `pop`", correct: false}
      - {text: "Un `dict`, avec `popitem`", correct: false}
    answer: "Le parcours en largeur traite les nœuds dans leur ordre de découverte : premier entré, premier sorti. `append` et `pop()` sur une liste font une pile, donc un parcours en profondeur."
  - key: qcm-pile
    format: multiple-choice
    question: "Quelles opérations font d'une `deque` une pile ?"
    choices:
      - {text: "`append` et `pop`", correct: true}
      - {text: "`append` et `popleft`", correct: false}
      - {text: "`appendleft` et `pop`", correct: false}
      - {text: "`rotate` et `pop`", correct: false}
    answer: "Une pile ajoute et retire du même côté : dernier entré, premier sorti. Ajouter d'un côté et retirer de l'autre fait une file."
  - key: trous-popleft
    format: fill-in
    question: |-
      Complète pour retirer le premier élément de la file :
      ```python
      suivant = file.___()
      ```
    blanks:
      - [popleft]
    answer: "`popleft` retire et renvoie l'élément de gauche, en O(1)."
  - key: trous-maxlen
    format: fill-in
    question: |-
      Complète pour ne garder que les 5 dernières valeurs :
      ```python
      historique = deque(___=5)
      ```
    blanks:
      - [maxlen]
    answer: "`maxlen` borne la `deque` : les plus anciennes valeurs tombent."
  - key: trous-appendleft
    format: fill-in
    question: |-
      Complète pour ajouter `x` à gauche :
      ```python
      file.___(x)
      ```
    blanks:
      - [appendleft]
    answer: "`appendleft` ajoute en tête, en O(1)."
  - key: trous-import
    format: fill-in
    question: |-
      Complète l'import de la file à deux bouts :
      ```python
      from collections import ___
      ```
    blanks:
      - [deque]
    answer: "`deque` vit dans `collections`."
  - key: code-maxlen
    format: code-output
    question: |-
      ```python
      from collections import deque

      dq = deque(maxlen=3)
      for i in range(5):
          dq.append(i)
      print(list(dq))
      ```
    answer: "Une fois pleine, chaque ajout à droite fait tomber l'élément de gauche : il reste les trois derniers."
    check:
      output: "[2, 3, 4]"
    choices:
      - {text: "`[2, 3, 4]`", correct: true}
      - {text: "`[0, 1, 2]`", correct: false}
      - {text: "`[0, 1, 2, 3, 4]`", correct: false}
      - {text: "`[4, 3, 2]`", correct: false}
  - key: code-rotate
    format: code-output
    question: |-
      ```python
      from collections import deque

      dq = deque([1, 2, 3, 4])
      dq.rotate(1)
      print(list(dq))
      ```
    answer: "`rotate(1)` fait tourner d'un cran vers la droite : le dernier passe au début."
    check:
      output: "[4, 1, 2, 3]"
    choices:
      - {text: "`[4, 1, 2, 3]`", correct: true}
      - {text: "`[2, 3, 4, 1]`", correct: false}
      - {text: "`[4, 3, 2, 1]`", correct: false}
      - {text: "`[1, 2, 3, 4]`", correct: false}
  - key: code-extendleft
    format: code-output
    question: |-
      ```python
      from collections import deque

      dq = deque([0])
      dq.extendleft([1, 2])
      dq.append(9)
      print(list(dq))
      ```
    answer: "`extendleft` place 1 à gauche, puis 2 devant 1 ; `append` met 9 à droite."
    check:
      output: "[2, 1, 0, 9]"
    choices:
      - {text: "`[2, 1, 0, 9]`", correct: true}
      - {text: "`[1, 2, 0, 9]`", correct: false}
      - {text: "`[9, 1, 2, 0]`", correct: false}
      - {text: "`[0, 1, 2, 9]`", correct: false}
  - key: code-file-fifo
    format: code-output
    question: |-
      ```python
      from collections import deque

      file = deque(["a", "b"])
      file.append("c")
      premier = file.popleft()
      print(premier, list(file))
      ```
    answer: "Une file : on ajoute à droite, on retire à gauche, dans l'ordre d'arrivée."
    check:
      output: "a ['b', 'c']"
    choices:
      - {text: "`a ['b', 'c']`", correct: true}
      - {text: "`c ['a', 'b']`", correct: false}
      - {text: "`a ['a', 'b', 'c']`", correct: false}
      - {text: "`b ['a', 'c']`", correct: false}
  - key: situation-file-de-taches
    format: scenario
    question: |-
      Ton service traite des tâches dans leur ordre d'arrivée, avec `taches.pop(0)` sur une liste, et ralentit quand
      la file grossit. Que proposes-tu ?
    choices:
      - {text: "Une `collections.deque`, avec `popleft()`", correct: true}
      - {text: "Trier la liste avant chaque `pop(0)`", correct: false}
      - {text: "Remplacer `pop(0)` par `pop()`, sans rien changer d'autre", correct: false}
      - {text: "Un `set`, plus rapide à vider qu'une liste", correct: false}
    answer: |-
      `pop(0)` coûte O(n) : le ralentissement grandit avec la file. `popleft()` est en O(1). `pop()` serait rapide,
      mais traiterait la dernière tâche arrivée d'abord, et un `set` n'a pas d'ordre.
  - key: situation-historique-annulation
    format: scenario
    question: |-
      Tu dois garder les 100 dernières actions d'un utilisateur, pour pouvoir les annuler. Que choisis-tu ?
    choices:
      - {text: "Une `deque(maxlen=100)`, qui oublie seule les plus anciennes", correct: true}
      - {text: "Une liste, vidée entièrement tous les 100 ajouts", correct: false}
      - {text: "Un dictionnaire indexé par le numéro de l'action", correct: false}
      - {text: "Une liste où l'on fait `insert(0, action)` à chaque ajout", correct: false}
    answer: |-
      La `deque` bornée garde exactement les 100 dernières actions, sans code de nettoyage ; `append` puis `pop`
      annulent la plus récente. Vider la liste perdrait tout l'historique d'un coup.
  - key: situation-acces-au-milieu
    format: scenario
    question: |-
      Un collègue remplace toutes les listes par des `deque`, « plus rapides ». Le code lit souvent `xs[i]` au milieu
      de grandes collections. Que lui dis-tu ?
    choices:
      - {text: "Qu'une `deque` est lente au milieu : la liste reste meilleure ici", correct: true}
      - {text: "Qu'il a raison : une `deque` est plus rapide pour toutes les opérations", correct: false}
      - {text: "Qu'une `deque` ne permet pas du tout de lire `xs[i]`", correct: false}
      - {text: "Qu'il faut une `deque` triée pour lire rapidement au milieu", correct: false}
    answer: |-
      Une `deque` n'est rapide qu'aux deux bouts ; l'accès par indice au milieu coûte O(n), contre O(1) pour une
      liste. Le bon choix dépend de l'opération la plus fréquente.
  - key: situation-producteur-consommateur
    format: scenario
    question: |-
      Deux threads se passent des messages : l'un les produit, l'autre doit attendre qu'un message arrive. Que
      choisis-tu ?
    choices:
      - {text: "Un `queue.Queue`, dont `get()` attend qu'un message arrive", correct: true}
      - {text: "Une `deque`, que le consommateur interroge en boucle", correct: false}
      - {text: "Une liste partagée, sans aucune protection", correct: false}
      - {text: "Un `set`, qui évite les messages en double", correct: false}
    answer: |-
      `append` et `popleft` d'une `deque` sont sûrs entre threads, mais elle ne sait pas attendre : le consommateur
      tournerait à vide. `queue.Queue` bloque proprement sur `get()`, et s'appuie d'ailleurs sur une `deque`.
