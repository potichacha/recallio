notion: comprehensions-liste
lesson: |-
  Une **compréhension de liste** construit une liste en une expression, à partir d'un itérable :

  ```python
  carres = [n * n for n in range(5)]            # [0, 1, 4, 9, 16]
  pairs = [n for n in range(10) if n % 2 == 0]  # [0, 2, 4, 6, 8] : le if filtre
  noms = [m.strip().title() for m in lignes]     # une transformation par élément
  ```

  Elle se lit comme la boucle qu'elle remplace :

  ```python
  resultat = []
  for n in range(10):
      if n % 2 == 0:
          resultat.append(n * n)
  # devient
  resultat = [n * n for n in range(10) if n % 2 == 0]
  ```

  **Deux `if` à ne pas confondre**

  | Écriture | Rôle |
  |---|---|
  | `[x for x in xs if x > 0]` | le `if` **après** le `for` **filtre** : moins d'éléments |
  | `[x if x > 0 else 0 for x in xs]` | le `if ... else` **avant** le `for` **choisit la valeur** : autant d'éléments |

  `[x for x in xs if x > 0 else 0]` est une `SyntaxError` : un filtre n'a pas de `else`.

  **La variable est locale** à la compréhension (depuis Python 3) : elle n'écrase pas une variable du même nom, et
  n'existe plus après.

  **Crochets ou parenthèses** : `(n * n for n in xs)` n'est pas une liste mais une **expression génératrice**, qui
  calcule les valeurs à la demande, sans tout garder en mémoire. Dans un appel à une seule fonction, les parenthèses
  suffisent : `sum(n * n for n in xs)`, `any(x < 0 for x in xs)`.

  **Quand ne pas l'utiliser** : une compréhension sert à **construire** une liste. Pour un effet (afficher, écrire dans
  un fichier), on écrit une boucle `for` : `[print(x) for x in xs]` construit une liste de `None` pour rien. Et
  quand la logique demande plusieurs lignes, une boucle ou une fonction se lit mieux.

  Une compréhension est souvent plus lisible que `map` et `filter` avec une `lambda` :
  `[x * 2 for x in xs if x]` contre `list(map(lambda x: x * 2, filter(None, xs)))`.

  **En entretien** : « `[expr for x in iterable if condition]` construit une liste : le `if` final filtre, un
  `a if c else b` en tête choisit la valeur. La variable de boucle reste locale. Avec des parenthèses, c'est une
  expression génératrice, paresseuse ; pour des effets, on garde une boucle `for`. »
tour:
  - title: Les compréhensions de liste
    text: |-
      Une compréhension construit une liste en une ligne : `[n * n for n in nombres]` calcule le carré de chaque
      nombre.

      Un `if` à la fin **filtre** les éléments. Un `a if condition else b` au début **choisit** la valeur de chacun.

      Avec des parenthèses à la place des crochets, dans un appel comme `sum(...)`, les valeurs sont calculées une à
      une, sans construire de liste.

      Essaie : garde seulement les carrés supérieurs à 10, avec `if n * n > 10` à la fin de la première compréhension.
    example:
      files:
        main.py: |-
          nombres = [1, 2, 3, 4, 5, 6]

          carres = [n * n for n in nombres]
          print(carres)

          pairs = [n for n in nombres if n % 2 == 0]
          print(pairs)

          etiquettes = ["pair" if n % 2 == 0 else "impair" for n in nombres[:3]]
          print(etiquettes)

          mots = ["  Pomme", "kiwi ", " POIRE"]
          propres = [m.strip().lower() for m in mots]
          print(propres)
          print(sum(n * n for n in nombres))
      output: |-
        [1, 4, 9, 16, 25, 36]
        [2, 4, 6]
        ['impair', 'pair', 'impair']
        ['pomme', 'kiwi', 'poire']
        91
    task:
      instructions: |-
        Avec une seule compréhension, garde les mots de plus de 4 lettres, en majuscules : le programme doit afficher
        `['POMME', 'POIRE']`.
      starter:
        main.py: |-
          mots = ["pomme", "kiwi", "fig", "poire", "noix"]
          longs = [m for m in mots]
          print(longs)
      solution:
        main.py: |-
          mots = ["pomme", "kiwi", "fig", "poire", "noix"]
          longs = [m.upper() for m in mots if len(m) > 4]
          print(longs)
      output: |-
        ['POMME', 'POIRE']
cards:
  - key: place-du-filtre
    format: course
    question: "Où se place la condition qui filtre les éléments, dans une compréhension de liste ?"
    choices:
      - {text: "À la fin : `[x for x in xs if x > 0]`", correct: true}
      - {text: "Au début : `[if x > 0 x for x in xs]`", correct: false}
      - {text: "Avant le `for` : `[x if x > 0 for x in xs]`", correct: false}
      - {text: "Dans un `where` : `[x for x in xs where x > 0]`", correct: false}
    answer: "Le filtre suit le `for`, comme le `if` suit le `for` dans la boucle équivalente. `[x if x > 0 for x in xs]` est une `SyntaxError` : en tête, il faudrait un `else`."
  - key: remplacer-ou-filtrer
    format: course
    question: "Comment remplacer les valeurs négatives par 0, en gardant toutes les autres ?"
    choices:
      - {text: "`[x if x > 0 else 0 for x in xs]`", correct: true}
      - {text: "`[x for x in xs if x > 0 else 0]`", correct: false}
      - {text: "`[x for x in xs if x > 0]`", correct: false}
      - {text: "`[0 for x in xs if x < 0]`", correct: false}
    answer: "L'expression conditionnelle en tête choisit une valeur pour chaque élément : la liste garde sa longueur. Le `if` final, lui, retire des éléments, et n'accepte pas de `else`."
  - key: variable-locale
    format: course
    question: "La variable d'une compréhension de liste existe-t-elle encore après elle ?"
    choices:
      - {text: "Non : elle est locale à la compréhension, depuis Python 3", correct: true}
      - {text: "Oui : elle garde la dernière valeur parcourue", correct: false}
      - {text: "Oui, mais elle vaut `None` après la compréhension", correct: false}
      - {text: "Non : la réutiliser ensuite lève une `SyntaxError`", correct: false}
    answer: "Elle n'écrase pas une variable du même nom définie avant. En Python 2, elle « fuyait », ce qui causait des bugs ; une boucle `for`, elle, laisse toujours sa variable."
  - key: pas-pour-les-effets
    format: course
    question: "Pourquoi éviter d'écrire `[print(x) for x in xs]` ?"
    choices:
      - {text: "Une compréhension sert à construire une liste ; pour un effet, une boucle `for`", correct: true}
      - {text: "Une compréhension n'a pas le droit d'appeler une fonction intégrée", correct: false}
      - {text: "La compréhension afficherait les valeurs dans un ordre au hasard", correct: false}
      - {text: "La compréhension n'affiche rien tant qu'on ne lit pas la liste", correct: false}
    answer: "Le code marche, mais construit une liste de `None` jetée aussitôt, et trompe le lecteur, qui attend une liste utile. `for x in xs: print(x)` dit l'intention."
  - key: vf-equivalent-map
    format: true-false
    question: "`[x * 2 for x in xs]` produit la même liste que `list(map(lambda x: x * 2, xs))`."
    truth: true
    answer: "Les deux appliquent la même transformation. La compréhension est en général jugée plus lisible, surtout avec un filtre."
  - key: vf-variable-apres
    format: true-false
    question: "Après `[i for i in range(3)]`, la variable `i` vaut 2."
    truth: false
    answer: "La variable est locale à la compréhension. Si `i` n'existait pas avant, la lire ensuite lève une `NameError`."
  - key: vf-generateur-liste
    format: true-false
    question: "`sum(x * x for x in xs)` construit d'abord une liste complète en mémoire."
    truth: false
    answer: "Sans crochets, c'est une expression génératrice : `sum` reçoit les carrés un à un, sans liste intermédiaire."
  - key: vf-plusieurs-for
    format: true-false
    question: "Une compréhension peut contenir plusieurs `for`."
    truth: true
    answer: "`[(a, b) for a in xs for b in ys]` : les `for` s'imbriquent dans l'ordre où ils sont écrits."
  - key: qcm-longueurs
    format: multiple-choice
    question: "Comment obtenir la liste des longueurs des mots de `mots` ?"
    choices:
      - {text: "`[len(m) for m in mots]`", correct: true}
      - {text: "`[m for len(m) in mots]`", correct: false}
      - {text: "`len([m for m in mots])`", correct: false}
      - {text: "`[for m in mots: len(m)]`", correct: false}
    answer: "L'expression vient d'abord, puis le `for`. `len([m for m in mots])` donne le nombre de mots, un seul entier."
  - key: qcm-garder-pairs
    format: multiple-choice
    question: "Comment garder les nombres pairs de `xs` ?"
    choices:
      - {text: "`[x for x in xs if x % 2 == 0]`", correct: true}
      - {text: "`[x % 2 == 0 for x in xs]`", correct: false}
      - {text: "`[x for x in xs if x % 2]`", correct: false}
      - {text: "`[x for x % 2 == 0 in xs]`", correct: false}
    answer: "Le filtre suit le `for`. `[x % 2 == 0 for x in xs]` donne une liste de booléens, et `if x % 2` garde les impairs (un reste de 1 est vrai)."
  - key: qcm-parentheses
    format: multiple-choice
    question: "Que crée `(x * x for x in xs)` ?"
    choices:
      - {text: "Un générateur, qui calcule les carrés à la demande", correct: true}
      - {text: "Un tuple des carrés, calculé tout de suite", correct: false}
      - {text: "Une liste des carrés, comme avec des crochets", correct: false}
      - {text: "Une erreur de syntaxe : il manque une virgule", correct: false}
    answer: "Une expression génératrice. Il n'y a pas de compréhension de tuple : on écrit `tuple(x * x for x in xs)`."
  - key: qcm-revenir-a-la-boucle
    format: multiple-choice
    question: "Quand préférer une boucle `for` à une compréhension ?"
    choices:
      - {text: "Quand le traitement a des effets ou plusieurs étapes, peu lisibles en une ligne", correct: true}
      - {text: "Quand la liste à construire contient plus de cent éléments", correct: false}
      - {text: "Quand on veut filtrer les éléments avec une condition `if`", correct: false}
      - {text: "Quand les éléments de départ viennent d'un `range`", correct: false}
    answer: "La compréhension convient à une transformation et un filtre simples. Des effets, des `try`, plusieurs variables intermédiaires : une boucle se lit mieux."
  - key: trous-carres
    format: fill-in
    question: |-
      Complète pour construire la liste des carrés :
      ```python
      carres = [n * n ___ n in nombres]
      ```
    blanks:
      - [for]
    answer: "L'expression, puis `for variable in itérable`."
  - key: trous-filtre
    format: fill-in
    question: |-
      Complète pour garder les mots non vides :
      ```python
      non_vides = [m for m in mots ___ m]
      ```
    blanks:
      - [if]
    answer: "Une chaîne vide est fausse : `if m` écarte les chaînes vides."
  - key: trous-expression-conditionnelle
    format: fill-in
    question: |-
      Complète pour remplacer chaque note sous 10 par `"ajourné"`, et les autres par `"reçu"` :
      ```python
      resultats = ["reçu" if n >= 10 ___ "ajourné" for n in notes]
      ```
    blanks:
      - [else]
    answer: "En tête, `a if condition else b` choisit la valeur : le `else` est obligatoire."
  - key: trous-generateur
    format: fill-in
    question: |-
      Complète pour calculer la somme des carrés, sans construire de liste :
      ```python
      total = sum(___ for n in nombres)
      ```
    blanks:
      - ["n*n", "n**2", "pow(n,2)"]
    answer: "Une expression génératrice passée à `sum` : `sum(n * n for n in nombres)`."
  - key: code-filtre-et-transforme
    format: code-output
    question: |-
      ```python
      xs = [1, 2, 3, 4, 5]
      print([x * 10 for x in xs if x % 2])
      ```
    answer: "`x % 2` vaut 1 (vrai) pour les impairs : seuls 1, 3 et 5 passent le filtre, puis sont multipliés par 10."
    check:
      output: "[10, 30, 50]"
    choices:
      - {text: "`[10, 30, 50]`", correct: true}
      - {text: "`[20, 40]`", correct: false}
      - {text: "`[10, 20, 30, 40, 50]`", correct: false}
      - {text: "`[1, 3, 5]`", correct: false}
  - key: code-if-else-en-tete
    format: code-output
    question: |-
      ```python
      print(["ok" if n > 2 else "ko" for n in range(5)])
      ```
    answer: "Une valeur pour chacun des cinq nombres : `ko` pour 0, 1 et 2, `ok` pour 3 et 4."
    check:
      output: "['ko', 'ko', 'ko', 'ok', 'ok']"
    choices:
      - {text: "`['ko', 'ko', 'ko', 'ok', 'ok']`", correct: true}
      - {text: "`['ok', 'ok']`", correct: false}
      - {text: "`['ko', 'ko', 'ok', 'ok', 'ok']`", correct: false}
      - {text: "`['ko', 'ko', 'ko']`", correct: false}
  - key: code-portee
    format: code-output
    question: |-
      ```python
      x = "avant"
      carres = [x * x for x in range(4)]
      print(x, carres[-1])
      ```
    answer: "Le `x` de la compréhension lui est propre : celui de dehors vaut toujours `'avant'`. Le dernier carré est 3 × 3."
    check:
      output: "avant 9"
    choices:
      - {text: "`avant 9`", correct: true}
      - {text: "`3 9`", correct: false}
      - {text: "`avant 16`", correct: false}
      - {text: "`9 9`", correct: false}
  - key: code-sur-une-chaine
    format: code-output
    question: |-
      ```python
      print([c.upper() for c in "abc" if c != "b"])
      ```
    answer: "La compréhension parcourt les caractères, écarte `'b'`, et renvoie une liste, pas une chaîne."
    check:
      output: "['A', 'C']"
    choices:
      - {text: "`['A', 'C']`", correct: true}
      - {text: "`['A', 'B', 'C']`", correct: false}
      - {text: "`AC`", correct: false}
      - {text: "`['a', 'c']`", correct: false}
  - key: bug-else-dans-le-filtre
    format: bug-fix
    question: |-
      Ce programme ne s'exécute pas : Python signale une `SyntaxError`.
      ```python
      notes = [12, 7, 15]
      statuts = [n for n in notes if n >= 10 else 0]
      print(statuts)
      ```
      Quelle correction remplace les notes sous 10 par 0 ?
    choices:
      - {text: "`[n if n >= 10 else 0 for n in notes]`", correct: true}
      - {text: "`[n for n in notes if n >= 10 or 0]`", correct: false}
      - {text: "`[n for n in notes if (n >= 10 else 0)]`", correct: false}
      - {text: "`[n else 0 for n in notes if n >= 10]`", correct: false}
    answer: |-
      ```python
      notes = [12, 7, 15]
      statuts = [n if n >= 10 else 0 for n in notes]
      print(statuts)
      ```
      Un filtre n'a pas de `else`. Pour choisir une valeur, l'expression conditionnelle se place en tête. `or 0` ne
      change pas la condition : elle filtrerait le 7.
  - key: bug-filtre-avant-transformation
    format: bug-fix
    question: |-
      Ce programme affiche `[]` au lieu de `['A.TXT', 'B.TXT']` :
      ```python
      fichiers = ["a.txt", "b.txt"]
      noms = [f.upper() for f in fichiers if f.endswith(".TXT")]
      print(noms)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if f.upper().endswith(\".TXT\")`", correct: true}
      - {text: "`if f.endswith(\".TXT\").upper()`", correct: false}
      - {text: "`if f.endswith(\".txt\".upper())`", correct: false}
      - {text: "`if f.upper() == \".TXT\"`", correct: false}
    answer: |-
      ```python
      fichiers = ["a.txt", "b.txt"]
      noms = [f.upper() for f in fichiers if f.upper().endswith(".TXT")]
      print(noms)
      ```
      Le filtre s'applique à `f`, avant la transformation de tête : il voit les noms en minuscules. Tester
      `.endswith(".txt")` marcherait aussi.
  - key: bug-mauvaise-variable
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une `NameError` :
      ```python
      lignes = ["a,1", "b,2"]
      valeurs = [int(l.split(",")[1]) for ligne in lignes]
      print(valeurs)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`[int(ligne.split(\",\")[1]) for ligne in lignes]`", correct: true}
      - {text: "`[int(l.split(\",\")[1]) for ligne in l]`", correct: false}
      - {text: "`[int(l.split(\",\")[1]) for l in ligne]`", correct: false}
      - {text: "`[int(l.split(\",\")[1]) for ligne in lignes if l]`", correct: false}
    answer: |-
      ```python
      lignes = ["a,1", "b,2"]
      valeurs = [int(ligne.split(",")[1]) for ligne in lignes]
      print(valeurs)
      ```
      L'expression de tête doit utiliser la variable du `for`. Les autres choix lisent toujours un nom qui n'existe
      pas.
  - key: bug-crochets-en-trop
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: unsupported operand type(s) for +: 'int' and 'list'` :
      ```python
      mots = ["un", "deux", "trois"]
      longueurs = [[len(m)] for m in mots]
      print(sum(longueurs))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`longueurs = [len(m) for m in mots]`", correct: true}
      - {text: "`longueurs = [len([m]) for m in mots]`", correct: false}
      - {text: "`longueurs = list([len(m)] for m in mots)`", correct: false}
      - {text: "`print(sum(*longueurs))`", correct: false}
    answer: |-
      ```python
      mots = ["un", "deux", "trois"]
      longueurs = [len(m) for m in mots]
      print(sum(longueurs))
      ```
      `[len(m)]` met chaque longueur dans sa propre liste : `sum` additionne alors des listes à 0. `len([m])` vaut
      toujours 1.
