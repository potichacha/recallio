notion: comprehensions-dict-set
lesson: |-
  La syntaxe des compréhensions s'étend aux dictionnaires et aux ensembles, entre **accolades**.

  | Écriture | Résultat |
  |---|---|
  | `[expr for x in it]` | une liste |
  | `{cle: valeur for x in it}` | un dictionnaire : les **deux-points** le signalent |
  | `{expr for x in it}` | un ensemble |
  | `(expr for x in it)` | une expression génératrice, **pas** un tuple |

  ```python
  prix = {"pomme": 2.5, "kiwi": 0.8}
  soldes = {fruit: p * 0.8 for fruit, p in prix.items()}      # transformer les valeurs
  chers = {fruit: p for fruit, p in prix.items() if p > 1}   # filtrer des paires
  carres = {n: n * n for n in range(4)}                       # {0: 0, 1: 1, 2: 4, 3: 9}
  index = {nom: i for i, nom in enumerate(noms)}              # la position de chaque nom
  initiales = {m[0] for m in mots}                            # un ensemble, sans doublon
  ```

  Pour parcourir un dictionnaire par paires, il faut `.items()` : `for k, v in d` essaie de déballer chaque **clé**.

  **Inverser un dictionnaire** : `{v: k for k, v in d.items()}`. Si deux clés ont la même valeur, la **dernière**
  l'emporte et les autres disparaissent, sans erreur. Pour les garder toutes, on groupe dans des listes, avec une
  boucle et `setdefault` (ou un `defaultdict`).

  **Une compréhension d'ensemble dédoublonne** : `{m.lower() for m in mots}` peut avoir moins d'éléments que `mots`.
  Ses éléments doivent être hachables.

  **Il n'y a pas de compréhension de tuple** : `(x for x in xs)` est un générateur. On écrit
  `tuple(x for x in xs)`.

  `{}` seul est un dictionnaire vide : avec une compréhension, c'est la présence de `:` qui distingue le dictionnaire
  de l'ensemble.

  **En entretien** : « `{k: v for ...}` construit un dictionnaire, `{x for ...}` un ensemble, avec le même `if` pour
  filtrer. On parcourt un dictionnaire par `.items()`. En inversant un dictionnaire, les valeurs en double perdent des
  clés : la dernière gagne. Il n'existe pas de compréhension de tuple, les parenthèses donnent un générateur. »
tour:
  - title: Compréhensions de dictionnaire et d'ensemble
    text: |-
      Les accolades donnent deux autres compréhensions :

      - `{cle: valeur for ...}` construit un dictionnaire ;
      - `{valeur for ...}` construit un ensemble, sans doublon.

      Pour parcourir un dictionnaire par paires, on passe par `.items()`. Un `if` à la fin filtre, comme pour les
      listes.

      Essaie : ajoute `"kiwi": 2.5` à `prix`, puis regarde ce que devient `par_prix`, qui inverse le dictionnaire.
    example:
      files:
        main.py: |-
          prix = {"pomme": 2.5, "kiwi": 0.8, "mangue": 3.2}

          soldes = {fruit: round(p * 0.8, 2) for fruit, p in prix.items()}
          print(soldes)

          chers = {fruit: p for fruit, p in prix.items() if p > 1}
          print(chers)

          par_prix = {p: fruit for fruit, p in prix.items()}
          print(par_prix[0.8])

          longueurs = {len(fruit) for fruit in prix}
          print(sorted(longueurs))
      output: |-
        {'pomme': 2.0, 'kiwi': 0.64, 'mangue': 2.56}
        {'pomme': 2.5, 'mangue': 3.2}
        kiwi
        [4, 5, 6]
cards:
  - key: syntaxe-dict
    format: course
    question: "Comment s'écrit une compréhension de dictionnaire ?"
    choices:
      - {text: "`{cle: valeur for x in iterable}`", correct: true}
      - {text: "`{(cle, valeur) for x in iterable}`", correct: false}
      - {text: "`dict[cle: valeur for x in iterable]`", correct: false}
      - {text: "`[cle: valeur for x in iterable]`", correct: false}
    answer: "Les deux-points entre accolades font un dictionnaire. Sans eux, `{(cle, valeur) for ...}` construit un ensemble de tuples."
  - key: inverser-avec-doublons
    format: course
    question: "Que donne `{v: k for k, v in d.items()}` quand `d` vaut `{\"a\": 1, \"b\": 1}` ?"
    choices:
      - {text: "`{1: 'b'}` : la dernière clé l'emporte", correct: true}
      - {text: "`{1: ['a', 'b']}` : les clés sont regroupées", correct: false}
      - {text: "Une `KeyError` sur la valeur en double", correct: false}
      - {text: "`{1: 'a'}` : la première clé l'emporte", correct: false}
    answer: "Chaque paire affecte `resultat[v] = k` ; la seconde écrase la première, sans erreur. Pour regrouper, il faut des listes."
  - key: pas-de-tuple
    format: course
    question: "Comment construire un tuple à partir d'une compréhension ?"
    choices:
      - {text: "`tuple(x * 2 for x in xs)`", correct: true}
      - {text: "`(x * 2 for x in xs)`", correct: false}
      - {text: "`(x * 2 for x in xs,)`", correct: false}
      - {text: "`<x * 2 for x in xs>`", correct: false}
    answer: "Il n'y a pas de compréhension de tuple : les parenthèses donnent un générateur, que `tuple(...)` consomme. Une virgule après le `for` est une `SyntaxError`."
  - key: ensemble-plus-petit
    format: course
    question: "Pourquoi `{m.lower() for m in mots}` peut-il avoir moins d'éléments que `mots` ?"
    choices:
      - {text: "C'est un ensemble : les mots égaux en minuscules n'y sont qu'une fois", correct: true}
      - {text: "C'est un dictionnaire : les clés en double sont écrasées une à une", correct: false}
      - {text: "C'est un générateur : il s'arrête au premier mot en double", correct: false}
      - {text: "La compréhension retire les mots vides et ceux en majuscules", correct: false}
    answer: "Sans deux-points, les accolades font un ensemble, qui ne garde qu'un exemplaire de chaque valeur : `Ana` et `ana` deviennent un seul `ana`."
  - key: vf-accolades-avec-deux-points
    format: true-false
    question: "`{x: x * x for x in range(3)}` crée un dictionnaire."
    truth: true
    answer: "Les deux-points font la paire clé-valeur : `{0: 0, 1: 1, 2: 4}`."
  - key: vf-accolades-sans-deux-points
    format: true-false
    question: "`{x * x for x in range(3)}` crée un dictionnaire."
    truth: false
    answer: "Sans deux-points, c'est un ensemble : `{0, 1, 4}`."
  - key: vf-filtre-dict
    format: true-false
    question: "Une compréhension de dictionnaire accepte une condition `if` à la fin."
    truth: true
    answer: "Comme pour les listes : `{k: v for k, v in d.items() if v > 0}`."
  - key: vf-ordre-croissant
    format: true-false
    question: "Une compréhension de dictionnaire range les clés dans l'ordre croissant."
    truth: false
    answer: "Les clés sont insérées dans l'ordre du parcours, et le dictionnaire garde cet ordre d'insertion."
  - key: qcm-deux-listes
    format: multiple-choice
    question: "Comment associer chaque nom de `noms` à la note de même rang dans `notes`, par compréhension ?"
    choices:
      - {text: "`{n: x for n, x in zip(noms, notes)}`", correct: true}
      - {text: "`{n: x for n in noms for x in notes}`", correct: false}
      - {text: "`{n: x for n, x in noms, notes}`", correct: false}
      - {text: "`{n: x for n, x in enumerate(noms, notes)}`", correct: false}
    answer: "`zip` donne les paires de même rang. Deux `for` imbriqués associeraient chaque nom à chaque note : chacun garderait la dernière."
  - key: qcm-filtrer-stock
    format: multiple-choice
    question: "Comment garder les produits de `stock` dont la quantité est positive ?"
    choices:
      - {text: "`{p: q for p, q in stock.items() if q > 0}`", correct: true}
      - {text: "`{p: q for p, q in stock if q > 0}`", correct: false}
      - {text: "`{p for p, q in stock.items() if q > 0}`", correct: false}
      - {text: "`[p: q for p, q in stock.items() if q > 0]`", correct: false}
    answer: "Il faut `.items()` pour les paires, et les deux-points pour un dictionnaire. Le troisième donne un ensemble de noms, sans les quantités."
  - key: qcm-initiales
    format: multiple-choice
    question: "Comment obtenir l'ensemble des initiales des mots, sans doublon ?"
    choices:
      - {text: "`{m[0] for m in mots}`", correct: true}
      - {text: "`[m[0] for m in mots]`", correct: false}
      - {text: "`{m[0]: m for m in mots}`", correct: false}
      - {text: "`(m[0] for m in mots)`", correct: false}
    answer: "Les accolades sans deux-points font un ensemble. La liste garderait les doublons, et le dictionnaire associerait chaque initiale à son dernier mot."
  - key: qcm-cles-majuscules
    format: multiple-choice
    question: "Comment passer toutes les clés de `d` en majuscules, en gardant les valeurs ?"
    choices:
      - {text: "`{k.upper(): v for k, v in d.items()}`", correct: true}
      - {text: "`{k.upper() for k in d}`", correct: false}
      - {text: "`{k: v.upper() for k, v in d.items()}`", correct: false}
      - {text: "`{k.upper(): v for k, v in d}`", correct: false}
    answer: "La transformation porte sur la clé de tête. Sans `.items()`, le déballage `k, v` s'appliquerait à chaque clé."
  - key: trous-doubler-valeurs
    format: fill-in
    question: |-
      Complète pour doubler chaque valeur :
      ```python
      doubles = {k: v * 2 for k, v in d.___()}
      ```
    blanks:
      - [items]
    answer: "`items()` donne les paires `(clé, valeur)`."
  - key: trous-inverser
    format: fill-in
    question: |-
      Complète pour inverser le dictionnaire :
      ```python
      inverse = {___: ___ for k, v in d.items()}
      ```
    blanks:
      - [v]
      - [k]
    answer: "La valeur devient la clé : `{v: k for k, v in d.items()}`. Attention aux valeurs en double."
  - key: trous-accolades
    format: fill-in
    question: |-
      Complète pour construire l'ensemble des longueurs des mots :
      ```python
      longueurs = ___len(m) for m in mots___
      ```
    blanks:
      - ["{"]
      - ["}"]
    answer: "Des accolades sans deux-points : un ensemble."
  - key: trous-positions
    format: fill-in
    question: |-
      Complète pour associer chaque lettre à sa position :
      ```python
      positions = {lettre: i for i, lettre in ___("abc")}
      ```
    blanks:
      - [enumerate]
    answer: "`enumerate` donne `(indice, élément)` : `{'a': 0, 'b': 1, 'c': 2}`."
  - key: code-inverser
    format: code-output
    question: |-
      ```python
      d = {"a": 1, "b": 2, "c": 1}
      print({v: k for k, v in d.items()})
      ```
    answer: "La clé 1 est créée par `'a'`, puis réécrite par `'c'` : elle garde sa place et prend la dernière valeur."
    check:
      output: "{1: 'c', 2: 'b'}"
    choices:
      - {text: "`{1: 'c', 2: 'b'}`", correct: true}
      - {text: "`{1: 'a', 2: 'b'}`", correct: false}
      - {text: "`{1: ['a', 'c'], 2: ['b']}`", correct: false}
      - {text: "`{2: 'b', 1: 'c'}`", correct: false}
  - key: code-ensemble-minuscules
    format: code-output
    question: |-
      ```python
      mots = ["Ana", "ana", "ANA", "bob"]
      print(len({m.lower() for m in mots}), len(mots))
      ```
    answer: "Les trois formes de `ana` deviennent la même chaîne : l'ensemble n'en garde qu'une."
    check:
      output: "2 4"
    choices:
      - {text: "`2 4`", correct: true}
      - {text: "`4 4`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`3 4`", correct: false}
  - key: code-dict-carres
    format: code-output
    question: |-
      ```python
      carres = {n: n * n for n in range(1, 4)}
      print(carres, sum(carres.values()))
      ```
    answer: "`range(1, 4)` donne 1, 2 et 3 ; la somme des carrés vaut 14."
    check:
      output: "{1: 1, 2: 4, 3: 9} 14"
    choices:
      - {text: "`{1: 1, 2: 4, 3: 9} 14`", correct: true}
      - {text: "`{0: 0, 1: 1, 2: 4} 5`", correct: false}
      - {text: "`{1: 1, 2: 4, 3: 9} 6`", correct: false}
      - {text: "`{1: 1, 2: 4, 3: 9, 4: 16} 30`", correct: false}
  - key: code-filtrer-paires
    format: code-output
    question: |-
      ```python
      stock = {"pomme": 3, "kiwi": 0, "noix": 7}
      print({p: q for p, q in stock.items() if q})
      ```
    answer: "`if q` écarte la quantité 0, qui est fausse ; l'ordre d'origine est gardé."
    check:
      output: "{'pomme': 3, 'noix': 7}"
    choices:
      - {text: "`{'pomme': 3, 'noix': 7}`", correct: true}
      - {text: "`{'kiwi': 0}`", correct: false}
      - {text: "`{'pomme': 3, 'kiwi': 0, 'noix': 7}`", correct: false}
      - {text: "`['pomme', 'noix']`", correct: false}
  - key: bug-items-oublie
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `ValueError: too many values to unpack (expected 2)` :
      ```python
      prix = {"pomme": 2, "kiwi": 1}
      taxes = {p: v * 1.2 for p, v in prix}
      print(taxes)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`for p, v in prix.items()`", correct: true}
      - {text: "`for p, v in prix.keys()`", correct: false}
      - {text: "`for p, v in enumerate(prix)`", correct: false}
      - {text: "`for (p, v) in prix`", correct: false}
    answer: |-
      ```python
      prix = {"pomme": 2, "kiwi": 1}
      taxes = {p: v * 1.2 for p, v in prix.items()}
      print(taxes)
      ```
      Parcourir `prix` donne ses clés : Python essaie de déballer les 5 lettres de `"pomme"` dans `p, v`. `items()`
      donne les paires.
  - key: bug-virgule-au-lieu-de-deux-points
    format: bug-fix
    question: |-
      Ce programme ne s'exécute pas : Python signale une `SyntaxError`.
      ```python
      noms = ["ana", "bob"]
      index = {nom, len(nom) for nom in noms}
      print(index)
      ```
      Quelle correction associe chaque nom à sa longueur ?
    choices:
      - {text: "`{nom: len(nom) for nom in noms}`", correct: true}
      - {text: "`{(nom, len(nom)) for nom in noms}`", correct: false}
      - {text: "`{[nom, len(nom)] for nom in noms}`", correct: false}
      - {text: "`{nom = len(nom) for nom in noms}`", correct: false}
    answer: |-
      ```python
      noms = ["ana", "bob"]
      index = {nom: len(nom) for nom in noms}
      print(index)
      ```
      Les deux-points font un dictionnaire. Avec des parenthèses, on obtiendrait un ensemble de tuples ; avec des
      crochets, une `TypeError`, car une liste n'est pas hachable.
  - key: bug-inversion-perd-des-eleves
    format: bug-fix
    question: |-
      Ce programme affiche `eve` : ana, qui a aussi 15, a disparu.
      ```python
      notes = {"ana": 15, "bob": 12, "eve": 15}
      par_note = {note: nom for nom, note in notes.items()}
      print(par_note[15])
      ```
      Quelle correction donne, pour chaque note, la liste de tous les élèves qui l'ont ?
    choices:
      - {text: "Une boucle avec `par_note.setdefault(note, []).append(nom)`", correct: true}
      - {text: "La compréhension `{note: [nom] for nom, note in notes.items()}`", correct: false}
      - {text: "La compréhension `{note: nom for note, nom in notes.items()}`", correct: false}
      - {text: "La compréhension `{nom: note for nom, note in notes.items()}`", correct: false}
    answer: |-
      ```python
      notes = {"ana": 15, "bob": 12, "eve": 15}
      par_note = {}
      for nom, note in notes.items():
          par_note.setdefault(note, []).append(nom)
      print(par_note[15])
      ```
      Dans une compréhension, chaque paire écrase la précédente de même clé, même avec `[nom]`. Regrouper demande
      d'ajouter à une liste existante : une boucle.
  - key: bug-generateur-sans-len
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: object of type 'generator' has no len()` :
      ```python
      carres = (n * n for n in range(4))
      print(len(carres))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`carres = tuple(n * n for n in range(4))`", correct: true}
      - {text: "`carres = (n * n for n in range(4),)`", correct: false}
      - {text: "`carres = ((n * n) for n in range(4))`", correct: false}
      - {text: "`print(len(*carres))`", correct: false}
    answer: |-
      ```python
      carres = tuple(n * n for n in range(4))
      print(len(carres))
      ```
      Les parenthèses font un générateur, qui n'a pas de longueur. `tuple(...)` le consomme dans un tuple ; ajouter
      une virgule ou des parenthèses ne change rien.
