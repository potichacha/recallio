notion: slicing
lesson: |-
  Le **découpage** (*slicing*) extrait une partie d'une séquence : liste, tuple ou chaîne. Il s'écrit
  `xs[début:fin:pas]` et renvoie un **nouvel objet** du même type.

  - `début` est **inclus**, `fin` est **exclue** : `xs[2:5]` prend les indices 2, 3 et 4, soit `5 - 2` éléments.
  - Chaque partie est facultative : `début` vaut 0 par défaut, `fin` la longueur, `pas` 1.
  - Les indices négatifs partent de la fin : `xs[-2:]` donne les deux derniers éléments.
  - Un pas négatif parcourt à l'envers : `xs[::-1]` est la séquence inversée.

  | Écriture | Résultat pour `xs = [0, 1, 2, 3, 4, 5]` |
  |---|---|
  | `xs[1:4]` | `[1, 2, 3]` |
  | `xs[:3]` | `[0, 1, 2]`, les trois premiers |
  | `xs[3:]` | `[3, 4, 5]`, à partir de l'indice 3 |
  | `xs[-2:]` | `[4, 5]`, les deux derniers |
  | `xs[1:-1]` | `[1, 2, 3, 4]`, sans le premier ni le dernier |
  | `xs[::2]` | `[0, 2, 4]`, un sur deux |
  | `xs[::-1]` | `[5, 4, 3, 2, 1, 0]` |
  | `xs[:]` | une copie de toute la liste |

  **Le découpage ne lève jamais d'`IndexError`** : les bornes trop grandes sont ramenées à la taille de la séquence.
  `xs[10:20]` vaut `[]`. Seul un pas nul est refusé (`ValueError: slice step cannot be zero`).

  **Une copie superficielle** : `ys = xs[:]` crée une nouvelle liste. Modifier `ys` (ajouter, retirer) ne touche pas
  `xs` ; mais si les éléments sont eux-mêmes mutables, ils sont partagés.

  **Affecter une tranche** remplace une partie de la liste, et peut en changer la taille :

  ```python
  xs = [1, 2, 3, 4, 5]
  xs[1:3] = ["a", "b", "c"]   # [1, 'a', 'b', 'c', 4, 5]
  xs[:2] = []                 # ['b', 'c', 4, 5]
  del xs[::2]                 # ['c', 5]
  ```

  La valeur affectée doit être un itérable : `xs[:2] = 0` lève une `TypeError`.

  **En entretien** : « `xs[début:fin:pas]` renvoie une nouvelle séquence, début inclus et fin exclue ; les indices
  négatifs partent de la fin et `xs[::-1]` inverse. Un découpage ne lève jamais d'`IndexError`. `xs[:]` fait une copie
  superficielle. »
tour:
  - title: Le découpage
    text: |-
      `xs[début:fin]` extrait une tranche : le début est inclus, la fin exclue. Chaque borne est facultative, et un
      indice négatif compte depuis la fin.

      Un troisième nombre donne le pas : `xs[::2]` prend un élément sur deux, `xs[::-1]` parcourt à l'envers.

      Le découpage marche aussi sur les chaînes, et renvoie toujours un nouvel objet.

      Essaie : affiche `lettres[10:]`. Un découpage hors des bornes ne lève pas d'erreur, il renvoie une liste vide.
    example:
      files:
        main.py: |-
          lettres = ["a", "b", "c", "d", "e", "f"]
          print(lettres[1:4])
          print(lettres[:2], lettres[4:])
          print(lettres[-2:])
          print(lettres[::2])
          print(lettres[::-1])

          mot = "Python"
          print(mot[:3], mot[-3:])
      output: |-
        ['b', 'c', 'd']
        ['a', 'b'] ['e', 'f']
        ['e', 'f']
        ['a', 'c', 'e']
        ['f', 'e', 'd', 'c', 'b', 'a']
        Pyt hon
cards:
  - key: borne-fin
    format: course
    question: "Dans `xs[2:5]`, quels indices sont pris ?"
    choices:
      - {text: "2, 3 et 4 : la fin est exclue", correct: true}
      - {text: "2, 3, 4 et 5 : les deux bornes sont incluses", correct: false}
      - {text: "3, 4 et 5 : le début est exclu", correct: false}
      - {text: "Les éléments 2 à 5, comptés à partir de 1", correct: false}
    answer: "Le début est inclus, la fin exclue : la tranche a `5 - 2 = 3` éléments. Cette convention permet de couper une liste en deux sans chevauchement : `xs[:k]` et `xs[k:]`."
  - key: inverser
    format: course
    question: "Que renvoie `xs[::-1]` ?"
    choices:
      - {text: "Une nouvelle liste, dans l'ordre inverse", correct: true}
      - {text: "La même liste, inversée sur place", correct: false}
      - {text: "Le dernier élément de la liste", correct: false}
      - {text: "La liste sans son dernier élément", correct: false}
    answer: "Un pas de -1 parcourt la séquence à l'envers, dans un nouvel objet. Pour inverser sur place, c'est `xs.reverse()`."
  - key: hors-bornes
    format: course
    question: "Que renvoie `xs[5:10]` sur une liste de trois éléments ?"
    choices:
      - {text: "Une liste vide, sans erreur", correct: true}
      - {text: "Une `IndexError`, comme `xs[5]`", correct: false}
      - {text: "La liste entière, bornes ramenées à 0 et 3", correct: false}
      - {text: "`None`, faute d'éléments à prendre", correct: false}
    answer: "Les bornes d'un découpage sont ramenées à la taille de la séquence : il n'y a jamais d'`IndexError`. Ici, de 3 à 3, rien."
  - key: copie-tranche
    format: course
    question: "Que fait `ys = xs[:]` ?"
    choices:
      - {text: "Une copie superficielle de `xs`, dans une nouvelle liste", correct: true}
      - {text: "Un second nom pour la même liste que `xs`", correct: false}
      - {text: "Une copie profonde de `xs`, sous-listes comprises", correct: false}
      - {text: "Une vue de `xs`, qui suit ses modifications", correct: false}
    answer: "`xs[:]` prend toute la liste dans un nouvel objet : ajouter à `ys` ne change pas `xs`. Mais les éléments sont partagés : une sous-liste modifiée l'est dans les deux."
  - key: vf-fin-exclue
    format: true-false
    question: "Dans un découpage `xs[a:b]`, l'élément d'indice `b` fait partie du résultat."
    truth: false
    answer: "La fin est exclue : `xs[a:b]` va de `a` à `b - 1`."
  - key: vf-nouvelle-liste
    format: true-false
    question: "`xs[1:3]` renvoie une nouvelle liste : lui ajouter un élément ne change pas `xs`."
    truth: true
    answer: "Le découpage crée un nouvel objet. Seule une **affectation** de tranche, `xs[1:3] = ...`, modifie `xs`."
  - key: vf-chaines-tuples
    format: true-false
    question: "Le découpage marche aussi sur les chaînes et les tuples."
    truth: true
    answer: "Toute séquence se découpe : `\"Python\"[:2]` vaut `'Py'`, `(1, 2, 3)[1:]` vaut `(2, 3)`."
  - key: vf-pas-zero
    format: true-false
    question: "`xs[::0]` renvoie une copie de la liste."
    truth: false
    answer: "Un pas nul est refusé : `ValueError: slice step cannot be zero`. La copie s'écrit `xs[:]`."
  - key: qcm-trois-premiers
    format: multiple-choice
    question: "Comment obtenir les trois premiers éléments de `xs` ?"
    choices:
      - {text: "`xs[:3]`", correct: true}
      - {text: "`xs[1:3]`", correct: false}
      - {text: "`xs[0:2]`", correct: false}
      - {text: "`xs[3:]`", correct: false}
    answer: "De l'indice 0 inclus à l'indice 3 exclu : 0, 1 et 2. `xs[1:3]` commence au deuxième, `xs[0:2]` n'en prend que deux."
  - key: qcm-deux-derniers
    format: multiple-choice
    question: "Comment obtenir les deux derniers éléments de `xs` ?"
    choices:
      - {text: "`xs[-2:]`", correct: true}
      - {text: "`xs[:-2]`", correct: false}
      - {text: "`xs[-2]`", correct: false}
      - {text: "`xs[-1:-2]`", correct: false}
    answer: "`xs[-2:]` part de l'avant-dernier jusqu'à la fin. `xs[:-2]` donne tout **sauf** les deux derniers, `xs[-2]` un seul élément, et `xs[-1:-2]` une liste vide."
  - key: qcm-sans-extremes
    format: multiple-choice
    question: "Comment obtenir `xs` sans son premier ni son dernier élément ?"
    choices:
      - {text: "`xs[1:-1]`", correct: true}
      - {text: "`xs[1:len(xs)]`", correct: false}
      - {text: "`xs[-1:1]`", correct: false}
      - {text: "`xs[0:-0]`", correct: false}
    answer: "`1` saute le premier, `-1` (exclu) arrête avant le dernier. `xs[1:len(xs)]` garde le dernier, et `-0` vaut 0."
  - key: qcm-un-sur-deux
    format: multiple-choice
    question: "Comment prendre un élément sur deux, en partant du deuxième ?"
    choices:
      - {text: "`xs[1::2]`", correct: true}
      - {text: "`xs[::2]`", correct: false}
      - {text: "`xs[2::2]`", correct: false}
      - {text: "`xs[1:2]`", correct: false}
    answer: "Le deuxième élément a l'indice 1, puis le pas 2 saute un élément sur deux. `xs[::2]` part du premier."
  - key: trous-inverser-chaine
    format: fill-in
    question: |-
      Complète pour inverser la chaîne :
      ```python
      mot = "radar"
      envers = mot[___]
      ```
    blanks:
      - ["::-1"]
    answer: "Un pas de -1, sans bornes, parcourt toute la chaîne à l'envers."
  - key: trous-copie
    format: fill-in
    question: |-
      Complète pour copier la liste dans une nouvelle liste, par un découpage :
      ```python
      copie = xs[___]
      ```
    blanks:
      - [":", "::", "0:"]
    answer: "`xs[:]` prend tout, du début à la fin, dans un nouvel objet. `xs.copy()` et `list(xs)` font la même copie."
  - key: trous-sauf-dernier
    format: fill-in
    question: |-
      Complète pour garder tout sauf le dernier élément :
      ```python
      debut = xs[:___]
      ```
    blanks:
      - ["-1", "len(xs)-1"]
    answer: "La fin `-1` est exclue : on s'arrête juste avant le dernier élément."
  - key: trous-remplacer-tranche
    format: fill-in
    question: |-
      Complète pour remplacer les éléments d'indices 1 et 2 par `"x"` et `"y"` :
      ```python
      xs[1:___] = ["x", "y"]
      ```
    blanks:
      - ["3"]
    answer: "La tranche `1:3` couvre les indices 1 et 2 ; l'affectation les remplace."
  - key: code-tranches-negatives
    format: code-output
    question: |-
      ```python
      xs = [10, 20, 30, 40, 50]
      print(xs[1:-1], xs[-2:])
      ```
    answer: "`xs[1:-1]` retire le premier et le dernier ; `xs[-2:]` garde les deux derniers."
    check:
      output: "[20, 30, 40] [40, 50]"
    choices:
      - {text: "`[20, 30, 40] [40, 50]`", correct: true}
      - {text: "`[20, 30, 40, 50] [40, 50]`", correct: false}
      - {text: "`[20, 30, 40] [40]`", correct: false}
      - {text: "`[10, 20, 30, 40] [50]`", correct: false}
  - key: code-pas
    format: code-output
    question: |-
      ```python
      print("abcdefgh"[1:7:2])
      ```
    answer: "De l'indice 1 (`b`) à l'indice 7 exclu, de deux en deux : indices 1, 3 et 5."
    check:
      output: "bdf"
    choices:
      - {text: "`bdf`", correct: true}
      - {text: "`bdfh`", correct: false}
      - {text: "`ace`", correct: false}
      - {text: "`bcdefg`", correct: false}
  - key: code-copie-ou-alias
    format: code-output
    question: |-
      ```python
      xs = [1, 2, 3]
      ys = xs[:]
      ys.append(4)
      zs = xs
      zs.append(5)
      print(xs)
      ```
    answer: "`ys` est une copie : l'ajout de 4 ne touche pas `xs`. `zs` est un second nom pour `xs` : l'ajout de 5, si."
    check:
      output: "[1, 2, 3, 5]"
    choices:
      - {text: "`[1, 2, 3, 5]`", correct: true}
      - {text: "`[1, 2, 3, 4, 5]`", correct: false}
      - {text: "`[1, 2, 3]`", correct: false}
      - {text: "`[1, 2, 3, 4]`", correct: false}
  - key: code-affecter-tranche
    format: code-output
    question: |-
      ```python
      xs = [1, 2, 3, 4, 5]
      xs[1:4] = [0]
      print(xs, len(xs))
      ```
    answer: "Les trois éléments d'indices 1 à 3 sont remplacés par un seul : la liste rétrécit."
    check:
      output: "[1, 0, 5] 3"
    choices:
      - {text: "`[1, 0, 5] 3`", correct: true}
      - {text: "`[1, 0, 0, 0, 5] 5`", correct: false}
      - {text: "`[1, [0], 5] 3`", correct: false}
      - {text: "`[1, 0, 3, 4, 5] 5`", correct: false}
  - key: bug-trois-derniers
    format: bug-fix
    question: |-
      Pour garder les trois derniers relevés, ce programme affiche `[9, 4]` :
      ```python
      releves = [3, 8, 5, 9, 4, 7]
      derniers = releves[-3:-1]
      print(derniers)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`releves[-3:]`", correct: true}
      - {text: "`releves[-3:0]`", correct: false}
      - {text: "`releves[-4:-1]`", correct: false}
      - {text: "`releves[-1:-3]`", correct: false}
    answer: |-
      ```python
      releves = [3, 8, 5, 9, 4, 7]
      derniers = releves[-3:]
      print(derniers)
      ```
      La fin `-1` est exclue : elle écarte le dernier relevé. Sans fin, la tranche va jusqu'au bout. `-3:0` et
      `-1:-3` donnent une liste vide.
  - key: bug-alias-inverse
    format: bug-fix
    question: |-
      Ce programme affiche `[3, 2, 1]` : la liste d'origine a été inversée aussi.
      ```python
      originale = [1, 2, 3]
      travail = originale
      travail.reverse()
      print(originale)
      ```
      Quelle correction garde `originale` intacte ?
    choices:
      - {text: "`travail = originale[:]`", correct: true}
      - {text: "`travail = originale[1:]`", correct: false}
      - {text: "`travail = originale[:-1]`", correct: false}
      - {text: "`travail = originale[0]`", correct: false}
    answer: |-
      ```python
      originale = [1, 2, 3]
      travail = originale[:]
      travail.reverse()
      print(originale)
      ```
      Une affectation ne copie rien : les deux noms désignent la même liste. `[:]` en fait une copie complète ; `[1:]`
      et `[:-1]` copient aussi, mais perdent un élément.
  - key: bug-inverser-chaine
    format: bug-fix
    question: |-
      Ce programme affiche `nohty` : il manque le `p`.
      ```python
      mot = "python"
      envers = mot[len(mot):0:-1]
      print(envers)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`mot[::-1]`", correct: true}
      - {text: "`mot[-1:0:-1]`", correct: false}
      - {text: "`mot[len(mot):1:-1]`", correct: false}
      - {text: "`mot[len(mot):-1:-1]`", correct: false}
    answer: |-
      ```python
      mot = "python"
      envers = mot[::-1]
      print(envers)
      ```
      La fin est exclue, même à l'envers : s'arrêter à 0 écarte la première lettre. Et `-1` en fin désigne la dernière
      lettre, pas « avant le début ». Sans bornes, le pas -1 parcourt tout.
  - key: bug-affecter-scalaire
    format: bug-fix
    question: |-
      Pour remettre à zéro les deux premières notes, ce programme s'arrête sur
      `TypeError: must assign iterable to extended slice` :
      ```python
      notes = [8, 12, 15, 11]
      notes[:2] = 0
      print(notes)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`notes[:2] = [0, 0]`", correct: true}
      - {text: "`notes[:2] = [0]`", correct: false}
      - {text: "`notes[0:1] = 0`", correct: false}
      - {text: "`notes[2] = 0`", correct: false}
    answer: |-
      ```python
      notes = [8, 12, 15, 11]
      notes[:2] = [0, 0]
      print(notes)
      ```
      Une tranche se remplace par un itérable, élément par élément. `[0]` remplacerait les deux notes par une seule
      (la liste rétrécit), et `notes[2]` est la troisième note.
