notion: complexite-collections
lesson: |-
  Choisir une collection, c'est choisir le coût des opérations qu'on fera le plus souvent. La notation O(...) dit
  comment ce coût grandit avec le nombre n d'éléments.

  **Les coûts à connaître** (CPython, en moyenne)

  | Opération | `list` | `dict` | `set` | `deque` |
  |---|---|---|---|---|
  | `len(x)` | O(1) | O(1) | O(1) | O(1) |
  | lire ou écrire `x[i]` / `x[k]` | O(1) | O(1) | — | O(1) aux bouts, O(n) au milieu |
  | ajouter à la fin | O(1) amorti (`append`) | O(1) | O(1) (`add`) | O(1) |
  | ajouter ou retirer au début | O(n) | — | — | O(1) |
  | `pop()` à la fin | O(1) | — | — | O(1) |
  | `x in c` | **O(n)** | **O(1)** | **O(1)** | O(n) |
  | retirer une valeur, `remove(v)` | O(n) | O(1) (`del d[k]`) | O(1) | O(n) |
  | parcourir | O(n) | O(n) | O(n) | O(n) |
  | trier | O(n log n) | — | — | — |

  Autres repères : `a | b` sur deux ensembles coûte O(len(a) + len(b)) ; `xs.index(v)` et `xs.count(v)` parcourent
  la liste ; `min`, `max` et `sum` sont en O(n).

  **« Amorti »** : une liste réserve de la place d'avance. Quand elle est pleine, `append` recopie tout dans un bloc
  plus grand (O(n)), mais si rarement que le coût moyen par ajout reste constant.

  **« En moyenne »** : un `dict` ou un `set` trouve une clé en O(1) grâce au hachage. Si beaucoup de clés tombent dans
  la même case (des *collisions*), le pire cas devient O(n).

  **Les erreurs classiques**

  - Tester `x in liste` dans une boucle : O(n) à chaque tour, O(n²) au total. Un `set` le ramène à O(1).
  - Chercher un objet par identifiant en parcourant une liste : un `dict` construit une fois.
  - `liste.pop(0)` ou `insert(0, x)` pour une file : une `deque`.
  - Concaténer des chaînes avec `+=` dans une boucle : chaque chaîne est immuable, le texte peut être recopié à chaque
    tour. On accumule dans une liste, puis `"".join(morceaux)`.
  - Garder les k meilleurs parmi n : un tas `heapq` de taille k, en O(n log k), plutôt qu'un tri complet.

  **En entretien** : « Une liste est en O(1) pour l'accès par indice et l'ajout en fin, mais en O(n) pour `in`,
  l'insertion en tête et `remove`. Un `dict` ou un `set` testent l'appartenance en O(1) en moyenne. Je choisis la
  structure selon l'opération dominante : un `set` pour tester la présence, un `dict` pour retrouver par clé, une
  `deque` pour une file. »
cards:
  - key: in-liste-ou-set
    format: course
    question: "Quel est le coût de `x in xs` pour une liste, et pour un ensemble ?"
    choices:
      - {text: "O(n) pour la liste, O(1) en moyenne pour l'ensemble", correct: true}
      - {text: "O(1) pour la liste, O(n) pour l'ensemble", correct: false}
      - {text: "O(log n) pour les deux, grâce à un tri interne", correct: false}
      - {text: "O(1) pour les deux, car Python les indexe", correct: false}
    answer: "La liste compare les éléments un par un ; l'ensemble calcule le hachage de `x` et regarde directement la bonne case."
  - key: append-amorti
    format: course
    question: "Pourquoi dit-on que `list.append` est en O(1) « amorti » ?"
    choices:
      - {text: "La liste se recopie parfois pour grandir, mais ce coût réparti reste constant", correct: true}
      - {text: "La liste ajoute toujours en temps constant, sans jamais rien recopier", correct: false}
      - {text: "La liste trie ses éléments à chaque ajout, en temps constant", correct: false}
      - {text: "Le coût dépend de la taille de l'élément ajouté, pas de la liste", correct: false}
    answer: "La liste réserve de la place d'avance, en grandissant d'une proportion de sa taille. Les recopies sont si rares que, sur n ajouts, le total reste O(n)."
  - key: cout-pop-zero
    format: course
    question: "Quel est le coût de `xs.pop(0)` sur une liste de n éléments ?"
    choices:
      - {text: "O(n) : tous les éléments suivants sont décalés", correct: true}
      - {text: "O(1) : comme `xs.pop()`", correct: false}
      - {text: "O(log n) : la liste est un arbre", correct: false}
      - {text: "O(n²) : la liste est recopiée deux fois", correct: false}
    answer: "Une liste est un tableau contigu : retirer en tête oblige à décaler les n - 1 éléments restants. `deque.popleft()` le fait en O(1)."
  - key: pire-cas-dict
    format: course
    question: "Dans quel cas une recherche dans un `dict` peut-elle coûter O(n) ?"
    choices:
      - {text: "Quand beaucoup de clés ont des hachages en collision", correct: true}
      - {text: "Quand le dictionnaire contient plus de mille clés", correct: false}
      - {text: "Quand les clés sont des chaînes plutôt que des nombres", correct: false}
      - {text: "Quand la clé cherchée a été insérée en dernier", correct: false}
    answer: "Si toutes les clés tombent dans la même case, le dictionnaire doit les comparer une à une. C'est rare ; c'est pour l'éviter que le hachage des chaînes change à chaque exécution."
  - key: vf-dict-lecture
    format: true-false
    question: "Lire `d[k]` dans un dictionnaire coûte O(1) en moyenne."
    truth: true
    answer: "Le hachage de `k` désigne la case ; seul un grand nombre de collisions dégraderait ce coût."
  - key: vf-tri-lineaire
    format: true-false
    question: "`list.sort()` est en O(n) dans le pire cas."
    truth: false
    answer: "Le tri (Timsort) est en O(n log n) dans le pire cas. Il descend à O(n) seulement sur une liste déjà triée, ou presque."
  - key: vf-milieu-deque
    format: true-false
    question: "Lire l'élément du milieu d'une `deque` coûte O(1)."
    truth: false
    answer: "Une `deque` est rapide aux bouts ; au milieu, elle parcourt ses blocs : O(n)."
  - key: vf-len-constant
    format: true-false
    question: "`len(xs)` coûte O(1) pour une liste, un dictionnaire et un ensemble."
    truth: true
    answer: "Chaque collection garde sa taille : `len` la lit sans compter."
  - key: qcm-operation-lineaire
    format: multiple-choice
    question: "Quelle opération coûte O(n) sur une liste de n éléments ?"
    choices:
      - {text: "`xs.insert(0, x)`", correct: true}
      - {text: "`xs.append(x)`", correct: false}
      - {text: "`xs[-1]`", correct: false}
      - {text: "`len(xs)`", correct: false}
    answer: "Insérer en tête décale tout. Ajouter à la fin, lire un indice et `len` sont en O(1)."
  - key: qcm-union
    format: multiple-choice
    question: "Quel est le coût de `a | b` pour deux ensembles ?"
    choices:
      - {text: "O(len(a) + len(b))", correct: true}
      - {text: "O(1)", correct: false}
      - {text: "O(len(a) × len(b))", correct: false}
      - {text: "O(log(len(a)))", correct: false}
    answer: "L'union copie `a`, puis ajoute chaque élément de `b` en O(1) : linéaire dans la taille des deux. Il n'y a pas de comparaison deux à deux."
  - key: qcm-parcours-dict
    format: multiple-choice
    question: "Quel est le coût du parcours de toutes les clés d'un dictionnaire de n clés ?"
    choices:
      - {text: "O(n)", correct: true}
      - {text: "O(1)", correct: false}
      - {text: "O(n log n)", correct: false}
      - {text: "O(n²)", correct: false}
    answer: "Chaque clé est visitée une fois. Le parcours ne trie rien : il suit l'ordre d'insertion."
  - key: qcm-concatenation-chaines
    format: multiple-choice
    question: "Pourquoi préférer `\"\".join(morceaux)` à `s += morceau` dans une boucle ?"
    choices:
      - {text: "Une chaîne est immuable : chaque `+=` peut recopier tout le texte", correct: true}
      - {text: "`+=` n'est pas permis sur une chaîne dans une boucle", correct: false}
      - {text: "`join` trie les morceaux avant de les assembler", correct: false}
      - {text: "`+=` ajoute un espace entre chaque morceau", correct: false}
    answer: "Recopier le texte à chaque tour fait un total en O(n²). `join` calcule la taille finale et copie chaque morceau une seule fois : O(n)."
  - key: situation-dedoublonner-lent
    format: scenario
    question: |-
      Ton code retire les doublons d'une liste avec `if x not in vus: vus.append(x)`, et devient très lent sur
      100 000 éléments. Que proposes-tu ?
    choices:
      - {text: "Faire de `vus` un `set` : le test d'appartenance passe en O(1)", correct: true}
      - {text: "Trier `vus` après chaque ajout pour accélérer la recherche", correct: false}
      - {text: "Remplacer `append` par `insert(0, x)`, plus rapide", correct: false}
      - {text: "Remplacer la liste `vus` par un tuple, plus léger", correct: false}
    answer: |-
      `x not in vus` parcourt la liste à chaque tour : O(n²) au total. Avec un ensemble, chaque test est en O(1). Si
      l'ordre compte, on garde une liste pour le résultat et un ensemble pour les tests.
  - key: situation-recherche-par-id
    format: scenario
    question: |-
      Tu cherches souvent un utilisateur par son identifiant dans une liste de 50 000 utilisateurs. Que fais-tu ?
    choices:
      - {text: "Construire une fois un `dict` identifiant → utilisateur", correct: true}
      - {text: "Trier la liste à chaque recherche, puis la parcourir", correct: false}
      - {text: "Parcourir la liste à l'envers, les plus récents d'abord", correct: false}
      - {text: "Paralléliser la recherche dans la liste sur plusieurs threads", correct: false}
    answer: |-
      Construire le dictionnaire coûte O(n) une fois ; chaque recherche coûte ensuite O(1), au lieu de O(n). Trier à
      chaque recherche coûterait encore plus cher que parcourir.
  - key: situation-meilleurs-scores
    format: scenario
    question: |-
      Tu dois garder les 10 meilleurs scores parmi des millions, qui arrivent un par un. Que choisis-tu ?
    choices:
      - {text: "Un tas de 10 éléments avec `heapq`, en O(n log 10)", correct: true}
      - {text: "Une liste de tous les scores, triée à chaque arrivée", correct: false}
      - {text: "Un `set` de tous les scores, trié une fois à la fin", correct: false}
      - {text: "Un `dict` qui associe chaque score à son rang", correct: false}
    answer: |-
      Le tas garde les 10 meilleurs, avec le moins bon en `tas[0]` : un nouveau score le remplace s'il est meilleur
      (`heapq.heappushpop`). La mémoire reste fixe, et un `set` perdrait les scores égaux.
  - key: situation-index-dans-boucle
    format: scenario
    question: |-
      En entretien, on te demande pourquoi ta solution, qui appelle `liste.index(x)` dans une boucle, est lente. Que
      réponds-tu ?
    choices:
      - {text: "`index` parcourt la liste : la boucle est en O(n²) ; un `dict` des positions la ramène à O(n)", correct: true}
      - {text: "`index` trie la liste à chaque appel : il faudrait la trier une seule fois avant la boucle", correct: false}
      - {text: "`index` copie la liste à chaque appel : passer `liste[:]` éviterait cette copie", correct: false}
      - {text: "Python est lent par nature : il faudrait réécrire cette boucle dans un module en C", correct: false}
    answer: |-
      Chaque `index` est une recherche linéaire. Construire d'abord `{valeur: i for i, valeur in enumerate(liste)}`
      rend chaque recherche en O(1) : on passe d'un algorithme quadratique à un algorithme linéaire.
  - key: definition-notation-o
    format: definition
    question: "Que mesure la notation O(n) ?"
    choices:
      - {text: "Comment le coût d'une opération grandit avec la taille n des données", correct: true}
      - {text: "Le temps exact d'une opération, en millisecondes", correct: false}
      - {text: "Le nombre de lignes de code d'un algorithme", correct: false}
      - {text: "La mémoire occupée par n éléments, en octets", correct: false}
    answer: "O(n) veut dire « proportionnel à n » : deux fois plus de données, environ deux fois plus de travail. Les constantes sont ignorées."
  - key: definition-amorti
    format: definition
    question: "Qu'est-ce qu'un coût amorti ?"
    choices:
      - {text: "Le coût moyen d'une opération, sur une longue suite d'opérations", correct: true}
      - {text: "Le coût de la pire opération possible de la suite", correct: false}
      - {text: "Le coût d'une opération après sa mise en cache", correct: false}
      - {text: "Le coût d'une opération mesuré sur une petite entrée", correct: false}
    answer: "Quelques opérations chères, réparties sur beaucoup d'opérations bon marché : `list.append` est en O(1) amorti, même si un ajout recopie parfois toute la liste."
  - key: definition-temps-constant
    format: definition
    question: "Que veut dire « en temps constant » ?"
    choices:
      - {text: "Que le coût ne dépend pas du nombre d'éléments", correct: true}
      - {text: "Que l'opération prend toujours exactement une milliseconde", correct: false}
      - {text: "Que le coût double quand le nombre d'éléments double", correct: false}
      - {text: "Que l'opération n'utilise aucune mémoire supplémentaire", correct: false}
    answer: "O(1) : lire `xs[i]` coûte la même chose pour dix éléments ou dix millions. Le coût double avec n, c'est O(n)."
  - key: definition-pire-cas
    format: definition
    question: "Qu'est-ce que la complexité dans le pire cas ?"
    choices:
      - {text: "Le coût maximal de l'opération, sur l'entrée la plus défavorable", correct: true}
      - {text: "Le coût moyen de l'opération, sur des entrées au hasard", correct: false}
      - {text: "Le coût de l'opération quand la mémoire est presque pleine", correct: false}
      - {text: "Le coût de l'opération la première fois qu'on l'appelle", correct: false}
    answer: "Un `dict` est en O(1) en moyenne, mais en O(n) dans le pire cas, quand toutes les clés entrent en collision. Le tri de Python est en O(n log n) dans le pire cas."
