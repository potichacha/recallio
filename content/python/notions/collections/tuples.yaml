notion: tuples
lesson: |-
  Un **tuple** est une séquence **immuable** : une fois créé, on ne peut ni remplacer, ni ajouter, ni retirer ses
  éléments. Il s'indexe et se découpe comme une liste.

  ```python
  point = (3, 4)
  point[0]            # 3
  len(point)          # 2
  couleurs = "rouge", "vert"   # les parenthèses sont facultatives : c'est la virgule qui fait le tuple
  vide = ()
  seul = (42,)        # un tuple d'un élément : la virgule est obligatoire
  pas_un_tuple = (42) # simplement l'entier 42 entre parenthèses
  ```

  **Ce qu'on ne peut pas faire** : `point[0] = 5` lève `TypeError: 'tuple' object does not support item assignment`,
  et `point.append(5)` lève une `AttributeError`. Un tuple n'a que deux méthodes : `count` et `index`.

  Pour « modifier » un tuple, on en crée un autre : `point = (5, point[1])`, ou `t + (x,)` pour ajouter à la fin.

  **Immuable ne veut pas dire figé en profondeur** : un tuple qui contient une liste garde toujours la même liste,
  mais cette liste peut changer.

  ```python
  t = (1, [2, 3])
  t[1].append(4)      # permis : t vaut (1, [2, 3, 4])
  ```

  **Quand choisir un tuple plutôt qu'une liste ?**

  | Tuple | Liste |
  |---|---|
  | un groupe **fixe** de valeurs, chacune à sa place : `(x, y)`, `(nom, âge)` | une collection de taille variable |
  | les valeurs de retour multiples : `return mini, maxi` renvoie un tuple | des éléments du même genre, qu'on ajoute et retire |
  | une clé de dictionnaire ou un élément d'ensemble (s'il ne contient que des valeurs hachables) | jamais utilisable comme clé |

  Les tuples se comparent élément par élément, de gauche à droite : `(1, 2, 3) < (1, 3)` vaut `True`, car 2 < 3.
  `tuple(xs)` convertit un itérable en tuple.

  **En entretien** : « Un tuple est une séquence immuable : on ne change pas ses éléments, mais un élément mutable
  qu'il contient peut changer. C'est la virgule qui fait le tuple, d'où `(1,)` pour un seul élément. Il sert aux groupes
  fixes de valeurs, aux retours multiples, et comme clé de dictionnaire quand ses éléments sont hachables. »
tour:
  - title: Les tuples
    text: |-
      Un tuple ressemble à une liste, entre parenthèses, mais il est **immuable** : on ne change pas ses éléments.

      C'est la virgule qui fait le tuple : `(42,)` en est un, `(42)` est juste l'entier 42.

      Une fonction qui « renvoie plusieurs valeurs » renvoie en fait un tuple. Comme il est immuable, un tuple peut
      aussi servir de clé de dictionnaire.

      Essaie : ajoute la ligne `point[0] = 10` et exécute. Python refuse de modifier un tuple.
    example:
      files:
        main.py: |-
          point = (3, 4)
          print(point, point[0], len(point))

          seul = (42,)
          pas_un_tuple = (42)
          print(type(seul).__name__, type(pas_un_tuple).__name__)


          def min_max(valeurs):
              return min(valeurs), max(valeurs)


          resultat = min_max([5, 2, 9])
          print(resultat, type(resultat).__name__)
          print(point + (5,))
      output: |-
        (3, 4) 3 2
        tuple int
        (2, 9) tuple
        (3, 4, 5)
cards:
  - key: tuple-un-element
    format: course
    question: "Comment écrire un tuple d'un seul élément ?"
    choices:
      - {text: "`(1,)` : c'est la virgule qui fait le tuple", correct: true}
      - {text: "`(1)` : les parenthèses suffisent", correct: false}
      - {text: "`tuple(1)` : le constructeur le crée", correct: false}
      - {text: "`<1>` : un tuple d'un élément a sa syntaxe", correct: false}
    answer: "`(1)` n'est que l'entier 1 entre parenthèses, et `tuple(1)` lève une `TypeError`, car 1 n'est pas itérable. La virgule suffit même sans parenthèses : `t = 1,`."
  - key: quand-preferer-tuple
    format: course
    question: "Quand préférer un tuple à une liste ?"
    choices:
      - {text: "Pour un groupe fixe de valeurs, comme les coordonnées d'un point", correct: true}
      - {text: "Pour une collection qu'on remplit au fil du programme", correct: false}
      - {text: "Pour trier des valeurs plus vite qu'avec une liste", correct: false}
      - {text: "Pour garder des valeurs uniques, sans aucun doublon", correct: false}
    answer: "Un tuple dit « ces valeurs vont ensemble, et ne changeront pas » : `(x, y)`, `(nom, âge)`. Une liste convient à une collection qui grandit. Les valeurs uniques, c'est un ensemble."
  - key: tuple-comme-cle
    format: course
    question: "Pourquoi un tuple peut-il servir de clé de dictionnaire, et pas une liste ?"
    choices:
      - {text: "Il est immuable, donc hachable si ses éléments le sont", correct: true}
      - {text: "Il prend moins de place en mémoire qu'une liste", correct: false}
      - {text: "Il est trié automatiquement à sa création", correct: false}
      - {text: "Les clés d'un dictionnaire s'écrivent entre parenthèses", correct: false}
    answer: "Une clé doit garder le même hachage toute sa vie. Une liste peut changer, donc Python refuse de la hacher ; un tuple de valeurs hachables ne change pas."
  - key: retour-multiple
    format: course
    question: "Que renvoie vraiment une fonction qui se termine par `return a, b` ?"
    choices:
      - {text: "Un seul objet : le tuple `(a, b)`", correct: true}
      - {text: "Deux valeurs séparées, comme en Go", correct: false}
      - {text: "Une liste `[a, b]`", correct: false}
      - {text: "Seulement `a` : `b` est ignoré", correct: false}
    answer: "`a, b` construit un tuple, et la fonction le renvoie. L'appelant le déballe souvent aussitôt : `mini, maxi = min_max(xs)`."
  - key: vf-affecter-element
    format: true-false
    question: "On peut remplacer le premier élément d'un tuple avec `t[0] = x`."
    truth: false
    answer: "`TypeError: 'tuple' object does not support item assignment`. On crée un nouveau tuple : `t = (x,) + t[1:]`."
  - key: vf-sans-parentheses
    format: true-false
    question: "`t = 1, 2, 3` crée un tuple, même sans parenthèses."
    truth: true
    answer: "C'est la virgule qui crée le tuple ; les parenthèses ne servent qu'à lever une ambiguïté, comme dans un appel de fonction."
  - key: vf-contenu-mutable
    format: true-false
    question: "Une liste rangée dans un tuple peut encore changer de contenu."
    truth: true
    answer: "Le tuple garde toujours la même liste, mais la liste elle-même reste mutable : `t[1].append(4)` est permis."
  - key: vf-entier-entre-parentheses
    format: true-false
    question: "`(5)` est un tuple d'un élément."
    truth: false
    answer: "`(5)` est l'entier 5 : des parenthèses de regroupement. Le tuple d'un élément s'écrit `(5,)`."
  - key: qcm-litteral-tuple
    format: multiple-choice
    question: "Lequel de ces littéraux est un tuple ?"
    choices:
      - {text: "`(\"a\",)`", correct: true}
      - {text: "`(\"a\")`", correct: false}
      - {text: "`[\"a\"]`", correct: false}
      - {text: "`{\"a\"}`", correct: false}
    answer: "Avec la virgule, c'est un tuple d'un élément. Sans elle, c'est la chaîne `'a'` ; les crochets font une liste, les accolades un ensemble."
  - key: qcm-methodes
    format: multiple-choice
    question: "Quelles méthodes possède un tuple ?"
    choices:
      - {text: "`count` et `index`", correct: true}
      - {text: "`append` et `remove`", correct: false}
      - {text: "`sort` et `reverse`", correct: false}
      - {text: "`add` et `pop`", correct: false}
    answer: "Un tuple ne change pas : il n'a que les deux méthodes qui le lisent. Pour trier, `sorted(t)` renvoie une liste."
  - key: qcm-convertir
    format: multiple-choice
    question: "Comment obtenir un tuple des éléments de la liste `xs` ?"
    choices:
      - {text: "`tuple(xs)`", correct: true}
      - {text: "`(xs)`", correct: false}
      - {text: "`(xs,)`", correct: false}
      - {text: "`xs.to_tuple()`", correct: false}
    answer: "`tuple(xs)` parcourt la liste. `(xs)` est la liste elle-même, et `(xs,)` un tuple d'un seul élément : la liste."
  - key: qcm-comparer
    format: multiple-choice
    question: "Que vaut `(1, 2, 3) < (1, 3)` ?"
    choices:
      - {text: "`True`", correct: true}
      - {text: "`False`", correct: false}
      - {text: "Une `TypeError` : les tailles diffèrent", correct: false}
      - {text: "`None`", correct: false}
    answer: "Les tuples se comparent élément par élément : 1 égale 1, puis 2 < 3 décide. La longueur ne compte qu'à égalité de tous les éléments communs."
  - key: trous-un-element
    format: fill-in
    question: |-
      Complète pour créer un tuple qui contient seulement `"rouge"` :
      ```python
      couleurs = ("rouge"___)
      ```
    blanks:
      - [","]
    answer: "Sans la virgule, `(\"rouge\")` est une simple chaîne."
  - key: trous-depuis-liste
    format: fill-in
    question: |-
      Complète pour figer la liste en tuple :
      ```python
      fige = ___(valeurs)
      ```
    blanks:
      - [tuple]
    answer: "`tuple` construit un tuple à partir de n'importe quel itérable."
  - key: trous-compter
    format: fill-in
    question: |-
      Complète pour compter les `0` du tuple :
      ```python
      t = (0, 1, 0, 2)
      print(t.___(0))
      ```
    blanks:
      - [count]
    answer: "`count` renvoie le nombre d'occurrences d'une valeur : ici 2."
  - key: trous-position
    format: fill-in
    question: |-
      Complète pour trouver l'indice de la première occurrence de `"b"` :
      ```python
      t = ("a", "b", "c")
      print(t.___("b"))
      ```
    blanks:
      - [index]
    answer: "`index` renvoie l'indice de la première occurrence (ici 1), et lève une `ValueError` si la valeur manque."
  - key: code-virgule-tuple
    format: code-output
    question: |-
      ```python
      a = (7)
      b = (7,)
      print(type(a).__name__, type(b).__name__, len(b))
      ```
    answer: "`(7)` est l'entier 7 ; `(7,)` est un tuple d'un élément."
    check:
      output: "int tuple 1"
    choices:
      - {text: "`int tuple 1`", correct: true}
      - {text: "`tuple tuple 1`", correct: false}
      - {text: "`int tuple 2`", correct: false}
      - {text: "`tuple int 1`", correct: false}
  - key: code-concatener
    format: code-output
    question: |-
      ```python
      t = (1, 2)
      t = t + (3,)
      print(t, len(t))
      ```
    answer: "`+` crée un nouveau tuple, que l'on affecte au même nom. L'ancien tuple n'a pas changé."
    check:
      output: "(1, 2, 3) 3"
    choices:
      - {text: "`(1, 2, 3) 3`", correct: true}
      - {text: "`(1, 2, (3,)) 3`", correct: false}
      - {text: "`(1, 2) 2`", correct: false}
      - {text: "`(1, 2, 3) 2`", correct: false}
  - key: code-liste-dans-tuple
    format: code-output
    question: |-
      ```python
      t = (1, [2, 3])
      t[1].append(4)
      print(t)
      ```
    answer: "Le tuple garde la même liste, mais la liste est mutable : `append` la modifie sans toucher au tuple."
    check:
      output: "(1, [2, 3, 4])"
    choices:
      - {text: "`(1, [2, 3, 4])`", correct: true}
      - {text: "`(1, [2, 3])`", correct: false}
      - {text: "`(1, [2, 3], 4)`", correct: false}
      - {text: "Une `TypeError`", correct: false}
  - key: code-repeter
    format: code-output
    question: |-
      ```python
      t = ("a", "b") * 2
      print(t, t.count("a"))
      ```
    answer: "`*` répète le tuple dans un nouveau tuple de quatre éléments, dont deux `'a'`."
    check:
      output: "('a', 'b', 'a', 'b') 2"
    choices:
      - {text: "`('a', 'b', 'a', 'b') 2`", correct: true}
      - {text: "`('aa', 'bb') 1`", correct: false}
      - {text: "`(('a', 'b'), ('a', 'b')) 2`", correct: false}
      - {text: "`('a', 'b', 'a', 'b') 1`", correct: false}
  - key: bug-modifier-tuple
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: 'tuple' object does not support item assignment` :
      ```python
      position = (0, 0)
      position[0] = 5
      print(position)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Créer un nouveau tuple : `position = (5, position[1])`", correct: true}
      - {text: "Appeler `position.set(0, 5)`, la méthode des tuples", correct: false}
      - {text: "Écrire `position[0] += 5`, qui ajoute au lieu d'affecter", correct: false}
      - {text: "Écrire `position = position + 5`, qui décale le tuple", correct: false}
    answer: |-
      ```python
      position = (0, 0)
      position = (5, position[1])
      print(position)
      ```
      Un tuple ne se modifie pas : on en construit un autre, que l'on affecte au même nom. `+=` sur un élément est
      aussi une affectation, refusée de la même façon.
  - key: bug-virgule-oubliee
    format: bug-fix
    question: |-
      Ce programme affiche `.`, `p` et `y` sur trois lignes, au lieu de `.py` :
      ```python
      extensions = (".py")
      for ext in extensions:
          print(ext)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`extensions = (\".py\",)`", correct: true}
      - {text: "`extensions = tuple(\".py\")`", correct: false}
      - {text: "`extensions = ((\".py\"))`", correct: false}
      - {text: "`extensions = (str(\".py\"))`", correct: false}
    answer: |-
      ```python
      extensions = (".py",)
      for ext in extensions:
          print(ext)
      ```
      Sans virgule, `(".py")` est une chaîne, et la boucle parcourt ses caractères. `tuple(".py")` découpe aussi la
      chaîne en caractères.
  - key: bug-append-tuple
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `AttributeError: 'tuple' object has no attribute 'append'` :
      ```python
      jours = ("lundi", "mardi")
      jours.append("mercredi")
      print(jours)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`jours = jours + (\"mercredi\",)`", correct: true}
      - {text: "`jours = jours + \"mercredi\"`", correct: false}
      - {text: "`jours.insert(2, \"mercredi\")`", correct: false}
      - {text: "`jours.add(\"mercredi\")`", correct: false}
    answer: |-
      ```python
      jours = ("lundi", "mardi")
      jours = jours + ("mercredi",)
      print(jours)
      ```
      On ne peut concaténer qu'un tuple à un tuple : `jours + "mercredi"` lève une `TypeError`. Si la collection doit
      grandir souvent, une liste convient mieux.
  - key: bug-virgule-en-trop
    format: bug-fix
    question: |-
      Ce programme affiche `(15, 15)` au lieu de `30` :
      ```python
      total = 10 + 5,
      print(total * 2)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Retirer la virgule finale : `total = 10 + 5`", correct: true}
      - {text: "Mettre des parenthèses : `total = (10 + 5,)`", correct: false}
      - {text: "Mettre des crochets : `total = [10 + 5]`", correct: false}
      - {text: "Convertir : `print(int(total) * 2)`", correct: false}
    answer: |-
      ```python
      total = 10 + 5
      print(total * 2)
      ```
      La virgule finale fait de `total` le tuple `(15,)`, et `* 2` répète le tuple. `int` ne convertit pas un tuple.
