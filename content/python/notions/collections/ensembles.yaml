notion: ensembles
lesson: |-
  Un **ensemble** (`set`) est une collection **sans doublon** et **sans ordre**. Comme un dictionnaire sans valeurs,
  c'est une table de hachage : ajouter, retirer et tester un élément coûte O(1) en moyenne.

  ```python
  langages = {"python", "go"}
  langages.add("java")
  langages.add("go")          # déjà présent : rien ne change
  "go" in langages            # True, en temps constant
  len(langages)               # 3
  vide = set()                # {} est un dictionnaire vide, pas un ensemble
  set([3, 1, 3])              # {1, 3} : retire les doublons
  ```

  **Retirer** : `s.remove(x)` lève une `KeyError` si `x` manque, `s.discard(x)` ne fait rien ; `s.pop()` retire un
  élément quelconque.

  **Les opérations d'ensemble** créent un nouvel ensemble :

  | Opérateur | Méthode | Résultat |
  |---|---|---|
  | `a \| b` | `a.union(b)` | les éléments de l'un **ou** de l'autre |
  | `a & b` | `a.intersection(b)` | les éléments communs |
  | `a - b` | `a.difference(b)` | ceux de `a` qui ne sont pas dans `b` |
  | `a ^ b` | `a.symmetric_difference(b)` | ceux qui sont dans un seul des deux |
  | `a <= b` | `a.issubset(b)` | `a` est-il inclus dans `b` ? |

  Les opérateurs exigent deux ensembles ; les méthodes acceptent n'importe quel itérable :
  `{1} | [2]` lève une `TypeError`, `{1}.union([2])` vaut `{1, 2}`. `|=`, `&=` et `update` modifient sur place.

  **Les éléments doivent être hachables** : nombres, chaînes, tuples. Une liste ou un autre `set` ne peuvent pas
  être des éléments. Le **`frozenset`** est un ensemble **immuable**, donc hachable : il peut être élément d'un
  ensemble ou clé de dictionnaire.

  **Pas d'ordre** : l'ordre d'affichage d'un ensemble de chaînes peut même changer d'une exécution à l'autre. Pour
  retirer les doublons en gardant l'ordre de première apparition : `list(dict.fromkeys(xs))`.

  **En entretien** : « Un `set` est une table de hachage sans valeurs : éléments uniques et hachables, sans ordre, test
  d'appartenance en O(1). Il offre union, intersection et différence. `{}` est un dictionnaire : l'ensemble vide
  s'écrit `set()`, et le `frozenset` est sa version immuable. »
tour:
  - title: Les ensembles
    text: |-
      Un ensemble garde des valeurs **uniques**, sans ordre : `{"python", "go"}`. Ajouter une valeur déjà présente ne
      fait rien, et tester `x in s` est très rapide.

      Les opérateurs `|`, `&`, `-` et `^` donnent l'union, l'intersection, la différence et les éléments propres à
      chacun.

      Attention : `{}` est un dictionnaire vide. L'ensemble vide s'écrit `set()`.

      Un ensemble n'a pas d'ordre : pour l'afficher de façon prévisible, on le trie avec `sorted`.

      Essaie : calcule `b - a`, et compare avec `a - b`.
    example:
      files:
        main.py: |-
          langages = {"python", "go", "java"}
          langages.add("go")
          print(len(langages), "python" in langages)

          a = {1, 2, 3, 4}
          b = {3, 4, 5}
          print(sorted(a | b))
          print(sorted(a & b))
          print(sorted(a - b))
          print(sorted(a ^ b))

          doublons = [3, 1, 3, 2, 1]
          print(sorted(set(doublons)))
          print(type(set()).__name__, type({}).__name__)
      output: |-
        3 True
        [1, 2, 3, 4, 5]
        [3, 4]
        [1, 2]
        [1, 2, 5]
        [1, 2, 3]
        set dict
cards:
  - key: ensemble-vide
    format: course
    question: "Comment créer un ensemble vide ?"
    choices:
      - {text: "`set()`", correct: true}
      - {text: "`{}`", correct: false}
      - {text: "`{,}`", correct: false}
      - {text: "`()`", correct: false}
    answer: "`{}` crée un dictionnaire vide, pour des raisons historiques : les dictionnaires existaient avant les ensembles. `()` est le tuple vide."
  - key: appartenance-rapide
    format: course
    question: "Pourquoi tester `x in s` est-il rapide sur un ensemble ?"
    choices:
      - {text: "L'ensemble est une table de hachage : le test est en O(1) en moyenne", correct: true}
      - {text: "L'ensemble est trié : le test est une recherche dichotomique", correct: false}
      - {text: "L'ensemble est petit, car il ne garde que des valeurs uniques", correct: false}
      - {text: "L'ensemble garde un index de chaque valeur dans une liste", correct: false}
    answer: "Le hachage de `x` désigne directement la case où le chercher. Dans une liste, il faudrait comparer les éléments un par un : O(n)."
  - key: remove-ou-discard
    format: course
    question: "Quelle différence entre `s.remove(x)` et `s.discard(x)` ?"
    choices:
      - {text: "`remove` lève une `KeyError` si `x` manque ; `discard` ne fait rien", correct: true}
      - {text: "`discard` lève une `KeyError` si `x` manque ; `remove` ne fait rien", correct: false}
      - {text: "`remove` retire une occurrence ; `discard` les retire toutes", correct: false}
      - {text: "`discard` vide l'ensemble ; `remove` retire un seul élément", correct: false}
    answer: "Un ensemble n'a pas de doublon : il n'y a qu'une occurrence à retirer. Le choix porte seulement sur l'absence : erreur ou silence."
  - key: role-frozenset
    format: course
    question: "À quoi sert un `frozenset` ?"
    choices:
      - {text: "C'est un ensemble immuable : il peut être clé de dict ou élément d'un ensemble", correct: true}
      - {text: "C'est un ensemble trié, plus rapide à parcourir qu'un `set` ordinaire", correct: false}
      - {text: "C'est un ensemble limité aux nombres, qui prend moins de mémoire", correct: false}
      - {text: "C'est un ensemble partagé entre threads, protégé par un verrou", correct: false}
    answer: "Un `set` est mutable, donc non hachable. Le `frozenset` ne change pas : il a un hachage stable, et sert de clé ou d'élément."
  - key: vf-accolades-vides
    format: true-false
    question: "`{}` crée un ensemble vide."
    truth: false
    answer: "`{}` est un dictionnaire vide. L'ensemble vide s'écrit `set()`."
  - key: vf-ordre-insertion
    format: true-false
    question: "Un `set` garde ses éléments dans l'ordre où on les a ajoutés."
    truth: false
    answer: "Un ensemble n'a pas d'ordre garanti ; pour des chaînes, il peut changer d'une exécution à l'autre. Les dictionnaires, eux, gardent l'ordre d'insertion."
  - key: vf-dedoublonner
    format: true-false
    question: "`set(xs)` retire les doublons de `xs`."
    truth: true
    answer: "Il garde un exemplaire de chaque valeur, mais perd l'ordre. `list(dict.fromkeys(xs))` garde l'ordre de première apparition."
  - key: vf-sous-ensemble
    format: true-false
    question: "`{1, 2} <= {1, 2, 3}` vaut `True`."
    truth: true
    answer: "`<=` teste l'inclusion : chaque élément du premier est dans le second. `<` teste l'inclusion stricte."
  - key: qcm-elements-communs
    format: multiple-choice
    question: "Quel opérateur donne les éléments communs à deux ensembles ?"
    choices:
      - {text: "`&`", correct: true}
      - {text: "`|`", correct: false}
      - {text: "`^`", correct: false}
      - {text: "`+`", correct: false}
    answer: "`&` est l'intersection, `|` l'union, `^` la différence symétrique. Les ensembles n'ont pas d'opérateur `+`."
  - key: qcm-difference-symetrique
    format: multiple-choice
    question: "Que donne `a ^ b` pour deux ensembles ?"
    choices:
      - {text: "Les éléments qui sont dans un seul des deux ensembles", correct: true}
      - {text: "Les éléments qui sont dans les deux ensembles à la fois", correct: false}
      - {text: "Les éléments de `a` qui ne sont pas dans `b`", correct: false}
      - {text: "Les éléments de `a` élevés à la puissance de ceux de `b`", correct: false}
    answer: "C'est la différence symétrique : `(a - b) | (b - a)`. Sur des entiers, `^` est le ou exclusif bit à bit, d'où le symbole."
  - key: qcm-ajouter
    format: multiple-choice
    question: "Comment ajouter `x` à l'ensemble `s` ?"
    choices:
      - {text: "`s.add(x)`", correct: true}
      - {text: "`s.append(x)`", correct: false}
      - {text: "`s.insert(x)`", correct: false}
      - {text: "`s.push(x)`", correct: false}
    answer: "Un ensemble n'a pas de position : on y « ajoute », sans fin ni indice. `append` et `insert` sont des méthodes de liste."
  - key: qcm-dedoublonner-ordre
    format: multiple-choice
    question: "Comment retirer les doublons d'une liste en gardant l'ordre de première apparition ?"
    choices:
      - {text: "`list(dict.fromkeys(xs))`", correct: true}
      - {text: "`list(set(xs))`", correct: false}
      - {text: "`sorted(set(xs))`", correct: false}
      - {text: "`list(frozenset(xs))`", correct: false}
    answer: "Un dictionnaire garde l'ordre d'insertion, et ses clés sont uniques. Un ensemble perd l'ordre, et `sorted` impose l'ordre croissant."
  - key: trous-union
    format: fill-in
    question: |-
      Complète pour réunir les deux ensembles :
      ```python
      tous = a ___ b
      ```
    blanks:
      - ["|"]
    answer: "`|` est l'union : les éléments de l'un ou de l'autre, sans doublon."
  - key: trous-ensemble-vide
    format: fill-in
    question: |-
      Complète pour créer un ensemble vide :
      ```python
      vus = ___
      ```
    blanks:
      - ["set()"]
    answer: "`{}` donnerait un dictionnaire."
  - key: trous-discard
    format: fill-in
    question: |-
      Complète pour retirer `x` de l'ensemble, sans erreur s'il est absent :
      ```python
      vus.___(x)
      ```
    blanks:
      - [discard]
    answer: "`discard` ne lève rien si l'élément manque ; `remove` lèverait une `KeyError`."
  - key: trous-frozenset
    format: fill-in
    question: |-
      Complète pour créer un ensemble immuable, utilisable comme clé :
      ```python
      cle = ___({"a", "b"})
      ```
    blanks:
      - [frozenset]
    answer: "Un `frozenset` est hachable, contrairement à un `set`."
  - key: code-doublons
    format: code-output
    question: |-
      ```python
      s = {3, 1, 3, 2, 1}
      print(len(s), sorted(s))
      ```
    answer: "Le littéral garde un exemplaire de chaque valeur : trois éléments."
    check:
      output: "3 [1, 2, 3]"
    choices:
      - {text: "`3 [1, 2, 3]`", correct: true}
      - {text: "`5 [1, 1, 2, 3, 3]`", correct: false}
      - {text: "`3 [3, 1, 2]`", correct: false}
      - {text: "`5 [1, 2, 3]`", correct: false}
  - key: code-differences
    format: code-output
    question: |-
      ```python
      a = {1, 2, 3}
      b = {2, 3, 4}
      print(sorted(a - b), sorted(b - a), sorted(a ^ b))
      ```
    answer: "`a - b` garde 1, `b - a` garde 4, et `a ^ b` réunit les deux : ce qui n'est que d'un côté."
    check:
      output: "[1] [4] [1, 4]"
    choices:
      - {text: "`[1] [4] [1, 4]`", correct: true}
      - {text: "`[1] [4] [2, 3]`", correct: false}
      - {text: "`[1, 4] [1, 4] [1, 4]`", correct: false}
      - {text: "`[4] [1] [1, 4]`", correct: false}
  - key: code-lettres-uniques
    format: code-output
    question: |-
      ```python
      print(len(set("mississippi")), sorted(set("mississippi")))
      ```
    answer: "Une chaîne est un itérable de caractères : l'ensemble garde les quatre lettres distinctes."
    check:
      output: "4 ['i', 'm', 'p', 's']"
    choices:
      - {text: "`4 ['i', 'm', 'p', 's']`", correct: true}
      - {text: "`11 ['i', 'm', 'p', 's']`", correct: false}
      - {text: "`1 ['mississippi']`", correct: false}
      - {text: "`4 ['m', 'i', 's', 'p']`", correct: false}
  - key: code-accolades
    format: code-output
    question: |-
      ```python
      a = {}
      b = set()
      print(type(a).__name__, type(b).__name__, a == b)
      ```
    answer: "`{}` est un dictionnaire vide ; un dictionnaire et un ensemble ne sont jamais égaux."
    check:
      output: "dict set False"
    choices:
      - {text: "`dict set False`", correct: true}
      - {text: "`set set True`", correct: false}
      - {text: "`dict set True`", correct: false}
      - {text: "`set dict False`", correct: false}
  - key: bug-accolades-vides
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `AttributeError: 'dict' object has no attribute 'add'` :
      ```python
      vus = {}
      vus.add("ana")
      print(vus)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`vus = set()`", correct: true}
      - {text: "`vus = {None}`", correct: false}
      - {text: "`vus = []`", correct: false}
      - {text: "`vus = dict()`", correct: false}
    answer: |-
      ```python
      vus = set()
      vus.add("ana")
      print(vus)
      ```
      `{}` est un dictionnaire vide. `{None}` est bien un ensemble, mais il contient `None`, et une liste n'a pas de
      méthode `add`.
  - key: bug-retirer-absent
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `KeyError: 'eve'` :
      ```python
      connectes = {"ana", "bob"}
      connectes.remove("eve")
      print(len(connectes))
      ```
      Quelle correction évite l'erreur quand la personne n'est pas connectée ?
    choices:
      - {text: "`connectes.discard(\"eve\")`", correct: true}
      - {text: "`connectes.pop(\"eve\")`", correct: false}
      - {text: "`del connectes[\"eve\"]`", correct: false}
      - {text: "`connectes -= \"eve\"`", correct: false}
    answer: |-
      ```python
      connectes = {"ana", "bob"}
      connectes.discard("eve")
      print(len(connectes))
      ```
      `discard` ignore un élément absent. `pop` d'un ensemble ne prend pas d'argument, un ensemble ne s'indexe pas, et
      `-=` attend un autre ensemble.
  - key: bug-ordre-perdu
    format: bug-fix
    question: |-
      L'ordre des étapes affichées change d'une exécution à l'autre :
      ```python
      etapes = ["lire", "valider", "lire", "écrire"]
      uniques = list(set(etapes))
      print(uniques)
      ```
      Quelle correction retire les doublons en gardant l'ordre ?
    choices:
      - {text: "`uniques = list(dict.fromkeys(etapes))`", correct: true}
      - {text: "`uniques = sorted(set(etapes))`", correct: false}
      - {text: "`uniques = list(frozenset(etapes))`", correct: false}
      - {text: "`uniques = list(set(etapes))[::-1]`", correct: false}
    answer: |-
      ```python
      etapes = ["lire", "valider", "lire", "écrire"]
      uniques = list(dict.fromkeys(etapes))
      print(uniques)
      ```
      Un ensemble n'a pas d'ordre, et celui des chaînes varie d'une exécution à l'autre. Un dictionnaire garde l'ordre
      d'insertion ; `sorted` imposerait l'ordre alphabétique.
  - key: bug-union-liste
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: unsupported operand type(s) for |: 'set' and 'list'` :
      ```python
      autorises = {"lire", "écrire"}
      autorises = autorises | ["supprimer"]
      print(len(autorises))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`autorises = autorises | {\"supprimer\"}`", correct: true}
      - {text: "`autorises = autorises + [\"supprimer\"]`", correct: false}
      - {text: "`autorises = autorises | \"supprimer\"`", correct: false}
      - {text: "`autorises.add([\"supprimer\"])`", correct: false}
    answer: |-
      ```python
      autorises = {"lire", "écrire"}
      autorises = autorises | {"supprimer"}
      print(len(autorises))
      ```
      L'opérateur `|` exige deux ensembles ; la méthode `autorises.update(["supprimer"])` accepterait une liste. Une
      liste ne peut pas être un élément : `add([...])` lève une `TypeError`.
