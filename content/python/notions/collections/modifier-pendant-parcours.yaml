notion: modifier-pendant-parcours
lesson: |-
  Modifier une collection pendant qu'une boucle `for` la parcourt est une source classique de bugs. Le symptôme dépend
  du type.

  **Une liste : des éléments sautés, sans erreur.** La boucle avance d'un indice à chaque tour ; un `remove` fait
  reculer tous les éléments suivants d'une case, et la boucle saute celui qui prend la place.

  ```python
  xs = [2, 4, 6, 7]
  for x in xs:
      if x % 2 == 0:
          xs.remove(x)
  xs                 # [4, 7] : le 4 a été sauté
  ```

  Ajouter à la fin pendant le parcours fait voir les nouveaux éléments à la boucle, qui peut ne jamais finir.

  **Un dictionnaire ou un ensemble : une erreur.** Ajouter ou retirer une clé pendant le parcours lève
  `RuntimeError: dictionary changed size during iteration` (pour un ensemble : `Set changed size during iteration`).
  Changer la **valeur** d'une clé existante, en revanche, est permis : la taille ne change pas.

  **Les solutions**

  | Solution | Exemple |
  |---|---|
  | construire une nouvelle collection (le plus clair) | `xs = [x for x in xs if x >= 0]` |
  | parcourir une copie, modifier l'original | `for x in xs[:]:`, `for k in list(d):` |
  | parcourir les indices à l'envers | `for i in reversed(range(len(xs))): del xs[i]` |
  | remplacer le contenu sur place | `xs[:] = [x for x in xs if x >= 0]` |

  ```python
  stock = {"pomme": 0, "kiwi": 3}
  for nom in list(stock):          # une copie des clés
      if stock[nom] == 0:
          del stock[nom]
  stock = {n: q for n, q in stock.items() if q > 0}   # ou un nouveau dictionnaire
  ```

  `xs[:] = ...` garde le même objet liste : utile si d'autres noms le désignent.

  **En entretien** : « Retirer d'une liste pendant qu'on la parcourt saute des éléments sans erreur ; ajouter ou retirer
  une clé d'un dictionnaire pendant son parcours lève une `RuntimeError`. On construit une nouvelle collection par
  compréhension, ou on parcourt une copie, `list(d)` ou `xs[:]`. »
cards:
  - key: retirer-pendant-for
    format: course
    question: "Que se passe-t-il quand on retire des éléments d'une liste pendant un `for` sur cette liste ?"
    choices:
      - {text: "Des éléments sont sautés, sans aucune erreur", correct: true}
      - {text: "Python lève une `RuntimeError` au premier retrait", correct: false}
      - {text: "La boucle s'arrête au premier élément retiré", correct: false}
      - {text: "La boucle travaille sur une copie : tout se passe bien", correct: false}
    answer: "La boucle avance par indice, et un retrait fait reculer les éléments suivants : celui qui prend la place est sauté. Le bug est silencieux, d'où le danger."
  - key: dict-change-de-taille
    format: course
    question: "Que se passe-t-il si on ajoute une clé à un dictionnaire pendant qu'on le parcourt ?"
    choices:
      - {text: "Une `RuntimeError` : la taille a changé pendant l'itération", correct: true}
      - {text: "La nouvelle clé est parcourue à la fin de la boucle", correct: false}
      - {text: "La nouvelle clé est ignorée par la boucle, sans erreur", correct: false}
      - {text: "Une `KeyError` sur la nouvelle clé", correct: false}
    answer: "`RuntimeError: dictionary changed size during iteration`. Le dictionnaire détecte le changement de taille, et arrête la boucle plutôt que de la laisser lire n'importe quoi."
  - key: changer-une-valeur
    format: course
    question: "Peut-on changer la valeur d'une clé existante pendant qu'on parcourt le dictionnaire ?"
    choices:
      - {text: "Oui : la taille ne change pas, la boucle continue", correct: true}
      - {text: "Non : toute écriture lève une `RuntimeError`", correct: false}
      - {text: "Oui, mais seulement si la valeur est un nombre", correct: false}
      - {text: "Non : la boucle repart du début à chaque écriture", correct: false}
    answer: "`for k in d: d[k] *= 2` est permis. Seuls l'ajout et le retrait de clés sont interdits pendant le parcours."
  - key: solution-nouvelle-liste
    format: course
    question: "Quelle est la façon la plus claire de retirer les nombres négatifs de `xs` ?"
    choices:
      - {text: "Construire une nouvelle liste : `[x for x in xs if x >= 0]`", correct: true}
      - {text: "Appeler `xs.remove(x)` dans un `for x in xs`", correct: false}
      - {text: "Appeler `del xs[i]` dans un `for i in range(len(xs))`", correct: false}
      - {text: "Trier `xs`, puis retirer son premier élément", correct: false}
    answer: "La compréhension ne modifie rien pendant le parcours : aucun élément sauté. Les deux boucles sautent des éléments, et la seconde finit en `IndexError`."
  - key: vf-liste-leve-erreur
    format: true-false
    question: "Retirer des éléments d'une liste pendant un `for` sur elle lève une erreur."
    truth: false
    answer: "Aucune erreur : des éléments sont simplement sautés. Seuls les dictionnaires et les ensembles détectent le changement de taille."
  - key: vf-list-des-cles
    format: true-false
    question: "`for k in list(d): del d[k]` vide le dictionnaire sans erreur."
    truth: true
    answer: "`list(d)` copie les clés avant la boucle : on parcourt la copie, et on modifie l'original."
  - key: vf-ensemble-erreur
    format: true-false
    question: "Ajouter des éléments à un ensemble pendant qu'on le parcourt lève une `RuntimeError`."
    truth: true
    answer: "`RuntimeError: Set changed size during iteration`, comme pour un dictionnaire."
  - key: vf-ajout-fin-liste
    format: true-false
    question: "Ajouter des éléments à la fin d'une liste pendant un `for` sur elle est sans effet sur la boucle."
    truth: false
    answer: "La boucle lit la liste au fil des indices : elle voit les éléments ajoutés, et peut ne jamais s'arrêter."
  - key: qcm-supprimer-cles
    format: multiple-choice
    question: "Comment supprimer, sans erreur, les clés de `d` dont la valeur vaut 0 ?"
    choices:
      - {text: "Parcourir `list(d.items())` et supprimer avec `del d[k]`", correct: true}
      - {text: "Parcourir `d.items()` et supprimer avec `del d[k]`", correct: false}
      - {text: "Parcourir `d` et supprimer avec `d.pop(k)`", correct: false}
      - {text: "Parcourir `d.keys()` et supprimer avec `del d[k]`", correct: false}
    answer: "`list(...)` fige les paires avant la boucle. Les vues `items()` et `keys()` suivent le dictionnaire : les modifier pendant leur parcours lève une `RuntimeError`."
  - key: qcm-parcours-sur
    format: multiple-choice
    question: "Lequel de ces parcours permet de retirer des éléments de `xs` dans la boucle sans en sauter ?"
    choices:
      - {text: "`for x in xs[:]:`", correct: true}
      - {text: "`for x in xs:`", correct: false}
      - {text: "`for x in iter(xs):`", correct: false}
      - {text: "`for i in range(len(xs)):`", correct: false}
    answer: "`xs[:]` est une copie : la boucle la parcourt en entier, quoi qu'il arrive à `xs`. `iter(xs)` parcourt la même liste, et les indices calculés d'avance dépassent après un retrait."
  - key: qcm-ce-qui-reste
    format: multiple-choice
    question: "Tu retires les nombres pairs de `[2, 4, 6, 7]` avec `remove`, dans un `for` sur la liste. Que reste-t-il ?"
    choices:
      - {text: "`[4, 7]`", correct: true}
      - {text: "`[7]`", correct: false}
      - {text: "Une `RuntimeError`", correct: false}
      - {text: "`[2, 4, 6, 7]`", correct: false}
    answer: "Au tour 0, 2 est retiré et 4 passe à l'indice 0 ; au tour 1, la boucle lit 6, le retire ; au tour 2, il n'y a plus rien. Le 4 a été sauté."
  - key: qcm-pourquoi-saut
    format: multiple-choice
    question: "Pourquoi un `for` saute-t-il un élément après un `remove` sur la liste parcourue ?"
    choices:
      - {text: "Les éléments suivants reculent d'un indice, mais la boucle avance au suivant", correct: true}
      - {text: "Le `remove` retire aussi l'élément qui suit celui qu'on lui donne", correct: false}
      - {text: "La boucle travaille sur une copie de la liste, faite au départ", correct: false}
      - {text: "Le `remove` retire toujours le dernier élément de la liste", correct: false}
    answer: "Le `for` sur une liste suit un indice interne, qui avance d'un cran par tour, que la liste ait changé ou non."
  - key: code-doublon-saute
    format: code-output
    question: |-
      ```python
      xs = [1, 1, 2, 3]
      for x in xs:
          if x == 1:
              xs.remove(x)
      print(xs)
      ```
    answer: "Le premier 1 est retiré ; le second recule à l'indice 0, et la boucle passe à l'indice 1, qui est 2. Le second 1 reste."
    check:
      output: "[1, 2, 3]"
    choices:
      - {text: "`[1, 2, 3]`", correct: true}
      - {text: "`[2, 3]`", correct: false}
      - {text: "`[1, 1, 2, 3]`", correct: false}
      - {text: "`[3]`", correct: false}
  - key: code-dict-erreur
    format: code-output
    question: |-
      ```python
      stock = {"a": 0, "b": 2}
      try:
          for nom in stock:
              if stock[nom] == 0:
                  del stock[nom]
      except RuntimeError as e:
          print(type(e).__name__, stock)
      ```
    answer: "Le `del` réussit, puis la boucle constate au tour suivant que la taille a changé : `RuntimeError`. La clé `'a'` est bien partie."
    check:
      output: "RuntimeError {'b': 2}"
    choices:
      - {text: "`RuntimeError {'b': 2}`", correct: true}
      - {text: "`KeyError {'b': 2}`", correct: false}
      - {text: "`RuntimeError {'a': 0, 'b': 2}`", correct: false}
      - {text: "`{'b': 2}`", correct: false}
  - key: code-doubler-valeurs
    format: code-output
    question: |-
      ```python
      prix = {"a": 10, "b": 20}
      for nom in prix:
          prix[nom] *= 2
      print(prix)
      ```
    answer: "Changer la valeur d'une clé existante ne change pas la taille : aucune erreur."
    check:
      output: "{'a': 20, 'b': 40}"
    choices:
      - {text: "`{'a': 20, 'b': 40}`", correct: true}
      - {text: "`{'a': 10, 'b': 20}`", correct: false}
      - {text: "`{'a': 20, 'b': 20}`", correct: false}
      - {text: "Une `RuntimeError`", correct: false}
  - key: code-ajout-pendant-boucle
    format: code-output
    question: |-
      ```python
      xs = [1, 2]
      for x in xs:
          if x < 4:
              xs.append(x + 2)
      print(xs)
      ```
    answer: "La boucle voit les éléments ajoutés : 1 ajoute 3, 2 ajoute 4, 3 ajoute 5 ; 4 et 5 n'ajoutent rien."
    check:
      output: "[1, 2, 3, 4, 5]"
    choices:
      - {text: "`[1, 2, 3, 4, 5]`", correct: true}
      - {text: "`[1, 2, 3, 4]`", correct: false}
      - {text: "`[1, 2]`", correct: false}
      - {text: "Une `RuntimeError`", correct: false}
  - key: bug-chaines-vides
    format: bug-fix
    question: |-
      Ce programme doit retirer les chaînes vides, mais affiche `['a', '', 'b']` :
      ```python
      mots = ["a", "", "", "b"]
      for mot in mots:
          if mot == "":
              mots.remove(mot)
      print(mots)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`mots = [mot for mot in mots if mot != \"\"]`", correct: true}
      - {text: "Remplacer le `remove` par `del mots[mots.index(mot)]`", correct: false}
      - {text: "Ajouter un `break` juste après le `remove`", correct: false}
      - {text: "Remplacer `for mot in mots` par `for mot in iter(mots)`", correct: false}
    answer: |-
      ```python
      mots = ["a", "", "", "b"]
      mots = [mot for mot in mots if mot != ""]
      print(mots)
      ```
      Le premier retrait fait reculer la seconde chaîne vide, que la boucle saute. `del` par indice a le même
      défaut, et `break` n'en retirerait qu'une.
  - key: bug-sessions-expirees
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `RuntimeError: dictionary changed size during iteration` :
      ```python
      sessions = {"a1": "expirée", "b2": "active", "c3": "expirée"}
      for jeton, etat in sessions.items():
          if etat == "expirée":
              del sessions[jeton]
      print(sessions)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Parcourir une copie : `for jeton, etat in list(sessions.items()):`", correct: true}
      - {text: "Remplacer `del sessions[jeton]` par `sessions.pop(jeton)`", correct: false}
      - {text: "Parcourir `sessions.keys()` au lieu de `sessions.items()`", correct: false}
      - {text: "Remplacer `del sessions[jeton]` par `sessions[jeton] = None`", correct: false}
    answer: |-
      ```python
      sessions = {"a1": "expirée", "b2": "active", "c3": "expirée"}
      for jeton, etat in list(sessions.items()):
          if etat == "expirée":
              del sessions[jeton]
      print(sessions)
      ```
      `list(...)` fige les paires avant la boucle. `pop` retire aussi une clé, et `None` laisse les sessions en place.
      Plus simple encore : `{j: e for j, e in sessions.items() if e != "expirée"}`.
  - key: bug-indices-a-l-endroit
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `IndexError: list index out of range` :
      ```python
      xs = [5, -1, -2, 8]
      for i in range(len(xs)):
          if xs[i] < 0:
              del xs[i]
      print(xs)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Parcourir les indices à l'envers : `for i in reversed(range(len(xs))):`", correct: true}
      - {text: "Parcourir un indice de moins : `for i in range(len(xs) - 1):`", correct: false}
      - {text: "Remplacer `del xs[i]` par `xs.remove(i)`, qui retire par valeur", correct: false}
      - {text: "Rattraper l'`IndexError` autour de la boucle, puis continuer", correct: false}
    answer: |-
      ```python
      xs = [5, -1, -2, 8]
      for i in reversed(range(len(xs))):
          if xs[i] < 0:
              del xs[i]
      print(xs)
      ```
      `range(len(xs))` est calculé une fois, avec la taille de départ ; chaque `del` raccourcit la liste. À l'envers,
      un retrait ne déplace que des éléments déjà vus.
  - key: bug-ensemble-agrandi
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `RuntimeError: Set changed size during iteration` :
      ```python
      vus = {1, 2}
      for n in vus:
          vus.add(n * 10)
      print(sorted(vus))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Parcourir une copie : `for n in list(vus):`", correct: true}
      - {text: "Remplacer `vus.add(n * 10)` par `vus |= {n * 10}`", correct: false}
      - {text: "Parcourir un itérateur : `for n in iter(vus):`", correct: false}
      - {text: "Remplacer `vus = {1, 2}` par `vus = frozenset({1, 2})`", correct: false}
    answer: |-
      ```python
      vus = {1, 2}
      for n in list(vus):
          vus.add(n * 10)
      print(sorted(vus))
      ```
      `|=` agrandit le même ensemble, et `iter(vus)` le parcourt toujours. Un `frozenset` n'a pas de méthode `add`.
