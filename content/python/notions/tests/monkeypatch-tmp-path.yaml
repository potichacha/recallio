notion: monkeypatch-tmp-path
lesson: |-
  pytest fournit des **fixtures toutes prêtes** pour ce qu'un test touche hors de lui : l'environnement, le disque, la
  sortie standard. Toutes défont leur travail à la fin du test.

  **`monkeypatch` : modifier, puis tout restaurer**

  ```python
  def test_url_de_production(monkeypatch, tmp_path):
      monkeypatch.setenv("ENV", "prod")
      monkeypatch.delenv("PROXY", raising=False)
      monkeypatch.setattr(meteo, "telecharger", lambda ville: '{"temp": 21}')
      monkeypatch.setitem(config.REGLAGES, "delai", 1)
      monkeypatch.chdir(tmp_path)
      assert url_api() == "https://api.exemple.fr"
  ```

  | Méthode | Effet, annulé après le test |
  |---|---|
  | `setattr(objet, "nom", valeur)` | remplace un attribut (ou `setattr("module.nom", valeur)`) |
  | `delattr(objet, "nom")` | supprime un attribut |
  | `setenv(nom, valeur)` / `delenv(nom)` | modifie les variables d'environnement |
  | `setitem(dico, cle, valeur)` / `delitem(dico, cle)` | modifie un dictionnaire |
  | `chdir(chemin)` | change le dossier courant |
  | `syspath_prepend(chemin)` | ajoute un dossier en tête de `sys.path` |

  `delenv` et `delattr` lèvent une erreur si la cible n'existe pas, sauf avec `raising=False`. Comme pour `patch`, on
  remplace le nom **là où le code le cherche**.

  **`tmp_path` : un dossier à soi**

  ```python
  def test_sauvegarde(tmp_path):
      fichier = tmp_path / "sauvegarde.json"
      sauvegarder({"score": 3}, fichier)
      assert json.loads(fichier.read_text()) == {"score": 3}
  ```

  `tmp_path` est un **`pathlib.Path`** vers un dossier **vide et propre à chaque test** ; pytest garde les plus récents
  pour l'inspection. `tmp_path_factory` (portée `session`) crée des dossiers partagés : `tmp_path_factory.mktemp("data")`.
  `tmpdir` est l'ancienne version, à base de `py.path`.

  **`capsys` : lire ce que le code affiche**

  ```python
  def test_affiche_total(capsys):
      afficher_total([2, 3])
      sortie = capsys.readouterr()
      assert sortie.out == "Total : 5\n"
      assert sortie.err == ""
  ```

  `readouterr()` renvoie la sortie et l'erreur capturées **depuis le dernier appel**, puis vide la capture. `capfd`
  capture au niveau des descripteurs (la sortie d'un sous-processus) ; **`caplog`** capture les messages du module
  `logging` (`caplog.text`, `caplog.records`).

  **En entretien** : « `monkeypatch` modifie un attribut, une variable d'environnement ou un dictionnaire le temps d'un
  test et restaure tout ensuite ; `tmp_path` donne un dossier vide par test ; `capsys.readouterr()` lit ce que le code
  a affiché. »
cards:
  - key: setenv-apres-test
    format: course
    question: "Que devient la variable après `monkeypatch.setenv(\"API_URL\", \"http://test\")`, une fois le test fini ?"
    choices:
      - {text: "Elle retrouve la valeur qu'elle avait avant le test, ou disparaît", correct: true}
      - {text: "Elle garde `http://test` pour tous les tests suivants de la session", correct: false}
      - {text: "Elle est supprimée, avec toutes les autres variables d'environnement", correct: false}
      - {text: "Elle est écrite dans le fichier `.env` du projet, pour la suite", correct: false}
    answer: "`monkeypatch` note chaque modification et l'annule à la fin du test : les tests restent indépendants."
  - key: nature-tmp-path
    format: course
    question: "Qu'est-ce que la fixture `tmp_path` ?"
    choices:
      - {text: "Un `pathlib.Path` vers un dossier vide, propre à chaque test", correct: true}
      - {text: "Le chemin du dossier courant, sous forme de chaîne de caractères", correct: false}
      - {text: "Un fichier temporaire déjà ouvert en écriture, fermé après le test", correct: false}
      - {text: "Un dossier unique, partagé par tous les tests de la session", correct: false}
    answer: "Chaque test reçoit son dossier ; on y construit des chemins avec `/`. Le dossier partagé, c'est `tmp_path_factory`."
  - key: lire-sortie-capsys
    format: course
    question: "Comment un test lit-il ce que le code a affiché avec `print`, grâce à `capsys` ?"
    choices:
      - {text: "`capsys.readouterr()` renvoie la sortie et l'erreur standard capturées", correct: true}
      - {text: "`capsys.stdout` contient la liste des arguments passés à `print`", correct: false}
      - {text: "Il redirige `sys.stdout` vers un fichier, puis relit ce fichier", correct: false}
      - {text: "`capsys.read()` renvoie la dernière ligne affichée par le code", correct: false}
    answer: "`readouterr()` renvoie un couple `(out, err)` de chaînes, depuis le dernier appel, et vide la capture."
  - key: dossier-partage
    format: course
    question: Quelle fixture crée des dossiers temporaires partagés par toute la session ?
    choices:
      - {text: "`tmp_path_factory`", correct: true}
      - {text: "`tmp_path`", correct: false}
      - {text: "`tmpdir`", correct: false}
      - {text: "`session_tmp`", correct: false}
    answer: "`tmp_path_factory.mktemp(\"data\")` sert aux fixtures de portée `session`, qui ne peuvent pas demander `tmp_path` (portée `function`)."
  - key: vf-dossier-par-test
    format: true-false
    question: "Deux tests qui demandent `tmp_path` reçoivent deux dossiers différents."
    truth: true
    answer: "Chaque test a son dossier, vide au départ : ce qu'un test y écrit ne gêne pas les autres."
  - key: vf-monkeypatch-persiste
    format: true-false
    question: Ce que `monkeypatch` modifie reste modifié pour les tests suivants du module.
    truth: false
    answer: "Tout est restauré à la fin du test qui a demandé `monkeypatch`, attributs, variables d'environnement et dossier courant compris."
  - key: vf-tmp-path-chaine
    format: true-false
    question: "`tmp_path` est une chaîne de caractères, qu'on assemble avec `os.path.join`."
    truth: false
    answer: "C'est un `pathlib.Path` : `tmp_path / \"notes.txt\"`, puis `.write_text()`, `.read_text()`, `.exists()`."
  - key: vf-readouterr-vide
    format: true-false
    question: "Après un appel à `capsys.readouterr()`, un second appel ne renvoie que ce qui a été affiché entre les deux."
    truth: true
    answer: "`readouterr()` vide la capture : on peut vérifier la sortie étape par étape."
  - key: qcm-absence-variable
    format: multiple-choice
    question: "Comment simuler l'absence de la variable `TOKEN`, qu'elle existe ou non sur la machine ?"
    choices:
      - {text: "`monkeypatch.delenv(\"TOKEN\", raising=False)`", correct: true}
      - {text: "`os.environ.pop(\"TOKEN\")`", correct: false}
      - {text: "`monkeypatch.setenv(\"TOKEN\", None)`", correct: false}
      - {text: "`monkeypatch.delattr(os, \"TOKEN\")`", correct: false}
    answer: "`raising=False` évite la `KeyError` si la variable manque déjà. `os.environ.pop` ne serait pas annulé et lèverait une `KeyError` sur une variable absente."
  - key: qcm-ecrire-fichier
    format: multiple-choice
    question: Comment écrire un fichier dans le dossier temporaire du test ?
    choices:
      - {text: "`(tmp_path / \"notes.txt\").write_text(\"ok\")`", correct: true}
      - {text: "`tmp_path.write(\"notes.txt\", \"ok\")`", correct: false}
      - {text: "`open(tmp_path + \"/notes.txt\", \"w\")`", correct: false}
      - {text: "`tmp_path.open(\"notes.txt\").write(\"ok\")`", correct: false}
    answer: "`/` construit un chemin à partir d'un `Path` ; `write_text` crée le fichier. `Path + str` lève une `TypeError`."
  - key: qcm-verifier-affichage
    format: multiple-choice
    question: "Comment vérifier que `saluer()` affiche « Bonjour » ?"
    choices:
      - {text: "`saluer()`, puis `assert capsys.readouterr().out == \"Bonjour\\n\"`", correct: true}
      - {text: "`assert saluer() == \"Bonjour\"`", correct: false}
      - {text: "`saluer()`, puis `assert capsys.out == \"Bonjour\"`", correct: false}
      - {text: "`saluer()`, puis `assert print.called_with(\"Bonjour\")`", correct: false}
    answer: "`print` ajoute un saut de ligne, que la sortie capturée contient. Une fonction qui affiche renvoie `None` : la comparer à « Bonjour » échouerait."
  - key: qcm-caplog
    format: multiple-choice
    question: "Quelle fixture capture les messages émis avec le module `logging` ?"
    choices:
      - {text: "`caplog`", correct: true}
      - {text: "`capsys`", correct: false}
      - {text: "`logcap`", correct: false}
      - {text: "`capturelog`", correct: false}
    answer: "`caplog.text` contient les messages formatés, `caplog.records` les enregistrements ; `caplog.set_level(logging.INFO)` règle le niveau capturé."
  - key: trous-setenv
    format: fill-in
    question: |-
      Complète pour définir la variable d'environnement le temps du test :
      ```python
      def test_url_de_prod(monkeypatch):
          monkeypatch.___("ENV", "prod")
          assert url_api() == "https://api.exemple.fr"
      ```
    blanks: [[setenv]]
    answer: "`setenv` définit la variable ; elle est restaurée après le test."
  - key: trous-chemin
    format: fill-in
    question: |-
      Complète pour construire le chemin du fichier dans le dossier temporaire :
      ```python
      def test_sauvegarde(tmp_path):
          fichier = tmp_path ___ "sauvegarde.json"
      ```
    blanks: [["/"]]
    answer: "Avec `pathlib`, l'opérateur `/` assemble les chemins."
  - key: trous-readouterr
    format: fill-in
    question: |-
      Complète pour lire la sortie standard capturée :
      ```python
      def test_affiche_total(capsys):
          afficher_total([2, 3])
          sortie = capsys.___().out
      ```
    blanks: [[readouterr]]
    answer: "`readouterr()` renvoie `out` et `err`, puis vide la capture."
  - key: trous-setattr
    format: fill-in
    question: |-
      Complète pour remplacer le téléchargement le temps du test :
      ```python
      def test_sans_reseau(monkeypatch):
          monkeypatch.___(meteo, "telecharger", lambda ville: "{}")
      ```
    blanks: [[setattr]]
    answer: "`setattr(objet, nom, valeur)` remplace l'attribut du module `meteo`, là où le code le cherche."
