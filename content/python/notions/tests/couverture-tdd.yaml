notion: couverture-tdd
lesson: |-
  **La couverture de code** mesure ce que les tests **exécutent**. L'outil de référence est **coverage.py** ; avec
  pytest, on passe par le plugin **pytest-cov**.

  ```bash
  pytest --cov=boutique --cov-report=term-missing      # % par fichier, et les lignes non couvertes
  pytest --cov=boutique --cov-branch                   # mesure aussi les branches
  pytest --cov=boutique --cov-fail-under=80            # échoue sous 80 %
  coverage run -m pytest && coverage html              # sans plugin : un rapport HTML dans htmlcov/
  ```

  - **Couverture de lignes** : la part des lignes exécutées au moins une fois.
  - **Couverture de branches** : chaque `if` doit avoir été vu **vrai et faux**. Elle est plus exigeante : un `if`
    toujours vrai couvre toutes ses lignes, mais une seule de ses deux branches.
  - `# pragma: no cover` exclut un bloc de la mesure (un `if __name__ == "__main__":`, une branche impossible).
  - La configuration va dans `pyproject.toml`, sous `[tool.coverage.run]` et `[tool.coverage.report]`.

  **Ce que la couverture ne dit pas** : qu'une ligne est **vérifiée**. Un test qui appelle une fonction sans rien
  `assert` la couvre entièrement. 100 % n'est donc pas un gage de qualité, et viser 100 % pousse à écrire des tests
  sans valeur. Elle sert à **trouver le code jamais testé**. Pour juger les assertions elles-mêmes, les **tests de
  mutation** (mutmut, cosmic-ray) modifient le code (`<` devient `<=`) et vérifient qu'un test échoue.

  **Le TDD** (Test-Driven Development) écrit le test **avant** le code, en cycles courts :

  1. **Rouge** : écrire un test qui échoue, pour un petit comportement.
  2. **Vert** : écrire le code **minimal** qui le fait passer.
  3. **Refactoriser** : nettoyer le code et les tests, qui restent verts.

  Il guide la conception (une API pensée depuis son usage), donne un filet contre les régressions, et produit une
  couverture élevée sans la viser. Il convient surtout à la logique métier ; il est moins naturel pour une interface
  ou un prototype jetable. Pour corriger un bug, on commence par **un test qui le reproduit**.

  **La pyramide des tests** : beaucoup de tests **unitaires** (rapides, ciblés), moins de tests **d'intégration** (base,
  réseau), et quelques tests **de bout en bout**, lents et fragiles.

  **En entretien** : « La couverture montre le code que les tests n'exécutent pas, mais pas la qualité des
  assertions : c'est un indicateur, pas un objectif. Le TDD écrit d'abord un test qui échoue, puis le code minimal,
  puis refactorise ; il guide la conception et protège des régressions. »
cards:
  - key: couverture-lignes
    format: course
    question: Que mesure la couverture de lignes ?
    choices:
      - {text: "La part des lignes exécutées au moins une fois pendant les tests", correct: true}
      - {text: "La part des lignes vérifiées par au moins un `assert` des tests", correct: false}
      - {text: "La part des fonctions qui ont un test portant leur propre nom", correct: false}
      - {text: "La part des tests qui passent, sur le nombre total de tests", correct: false}
    answer: "Une ligne exécutée compte comme couverte, même si aucun test ne vérifie ce qu'elle produit."
  - key: couverture-branches
    format: course
    question: Qu'ajoute la couverture de branches (`--cov-branch`) à celle des lignes ?
    choices:
      - {text: "Elle vérifie que chaque condition a été vue vraie et fausse", correct: true}
      - {text: "Elle compte les branches Git que la CI a testées", correct: false}
      - {text: "Elle mesure le temps passé dans chaque fonction", correct: false}
      - {text: "Elle exclut les lignes de `if` du calcul", correct: false}
    answer: "`if x: y = 1`, avec `x` toujours vrai, couvre 100 % des lignes mais une seule des deux branches : le cas « faux » n'a jamais été essayé."
  - key: cycle-tdd
    format: course
    question: Quelles sont les trois étapes du cycle TDD ?
    choices:
      - {text: "Rouge, vert, refactoriser : un test qui échoue, le code minimal, le nettoyage", correct: true}
      - {text: "Écrire le code, écrire les tests qui le couvrent, puis rédiger la documentation", correct: false}
      - {text: "Concevoir les classes, écrire tout le code, puis le tester d'un seul bloc", correct: false}
      - {text: "Mesurer la couverture, ajouter des tests jusqu'à 100 %, puis livrer le code", correct: false}
    answer: "On écrit un test qui échoue (rouge), le code le plus simple qui le fait passer (vert), puis on améliore le code sous la protection des tests."
  - key: pragma-no-cover
    format: course
    question: "Comment exclure de la mesure un bloc qu'on ne teste pas, comme `if __name__ == \"__main__\":` ?"
    choices:
      - {text: "Le commentaire `# pragma: no cover` sur la ligne du `if`", correct: true}
      - {text: "Le commentaire `# noqa` sur la ligne du `if`", correct: false}
      - {text: "Le commentaire `# type: ignore` sur la ligne du `if`", correct: false}
      - {text: "Le décorateur `@pytest.mark.skip` au-dessus du bloc", correct: false}
    answer: "coverage.py exclut la ligne marquée, et tout le bloc qu'elle ouvre. `# noqa` concerne les linters, `# type: ignore` les vérificateurs de types."
  - key: vf-cent-pour-cent
    format: true-false
    question: Un code couvert à 100 % par ses tests est un code sans bug.
    truth: false
    answer: "La couverture dit qu'une ligne a été exécutée, pas que son résultat a été vérifié, ni que tous les cas ont été essayés."
  - key: vf-test-avant
    format: true-false
    question: En TDD, on écrit le test avant le code qui le fait passer.
    truth: true
    answer: "Le test écrit d'abord échoue (rouge) : c'est la preuve qu'il teste vraiment quelque chose."
  - key: vf-branches-plus-basse
    format: true-false
    question: Pour le même code, la couverture de branches peut être plus basse que la couverture de lignes.
    truth: true
    answer: "Une condition toujours vraie exécute toutes ses lignes mais ne parcourt qu'une branche : 100 % de lignes, 50 % de branches."
  - key: vf-mesure-tests-seuls
    format: true-false
    question: "`pytest --cov=boutique` ne mesure que les fichiers de tests, pas le code du paquet `boutique`."
    truth: false
    answer: "`--cov=boutique` mesure justement le code du paquet `boutique`, exécuté par les tests."
  - key: qcm-lignes-manquantes
    format: multiple-choice
    question: "Quelle commande affiche les numéros des lignes non couvertes du paquet `boutique` ?"
    choices:
      - {text: "`pytest --cov=boutique --cov-report=term-missing`", correct: true}
      - {text: "`pytest --coverage boutique --missing`", correct: false}
      - {text: "`coverage boutique --lines`", correct: false}
      - {text: "`pytest -k boutique --cov`", correct: false}
    answer: "`term-missing` ajoute au tableau une colonne « Missing » avec les lignes jamais exécutées."
  - key: qcm-seuil-ci
    format: multiple-choice
    question: Comment faire échouer la CI quand la couverture passe sous 80 % ?
    choices:
      - {text: "`--cov-fail-under=80`", correct: true}
      - {text: "`--cov-min=80`", correct: false}
      - {text: "`--fail-coverage 80`", correct: false}
      - {text: "`--cov-threshold=0.8`", correct: false}
    answer: "pytest-cov sort alors en erreur ; avec coverage.py seul, c'est `coverage report --fail-under=80`."
  - key: qcm-mutation
    format: multiple-choice
    question: Que révèle un test de mutation, que la couverture ne voit pas ?
    choices:
      - {text: "Des tests qui exécutent le code sans vérifier son résultat", correct: true}
      - {text: "Des lignes de code que les tests n'exécutent jamais", correct: false}
      - {text: "Des tests trop lents, à déplacer en intégration", correct: false}
      - {text: "Des dépendances installées dans la mauvaise version", correct: false}
    answer: "L'outil modifie le code (`+` en `-`, `<` en `<=`) : si aucun test n'échoue, le « mutant » survit, et les assertions sont trop faibles."
  - key: qcm-pyramide
    format: multiple-choice
    question: Dans la pyramide des tests, quels tests doivent être les plus nombreux ?
    choices:
      - {text: "Les tests unitaires", correct: true}
      - {text: "Les tests de bout en bout", correct: false}
      - {text: "Les tests d'intégration", correct: false}
      - {text: "Les tests manuels", correct: false}
    answer: "Rapides et précis, ils forment la base ; les tests de bout en bout, lents et fragiles, sont réservés aux parcours critiques."
  - key: situation-cent-pour-cent
    format: scenario
    question: Ton manager exige 100 % de couverture sur tout le projet. Que lui réponds-tu ?
    choices:
      - {text: "Qu'elle trouve le code non testé sans juger les tests : un seuil raisonnable suffit", correct: true}
      - {text: "Que c'est facile : il suffit d'appeler chaque fonction une fois dans un test", correct: false}
      - {text: "Que la couverture est inutile, et qu'il vaut mieux ne pas la mesurer du tout", correct: false}
      - {text: "Qu'on peut l'atteindre en excluant les fichiers difficiles avec `pragma`", correct: false}
    answer: "Viser 100 % pousse à écrire des tests sans assertion utile. Mieux vaut un seuil (80 % par exemple) qui empêche la baisse, et des revues qui regardent ce que vérifient les tests."
  - key: situation-bug-production
    format: scenario
    question: Un bug est signalé en production. Comment le corriges-tu en suivant le TDD ?
    choices:
      - {text: "J'écris d'abord un test qui reproduit le bug et échoue, puis je corrige", correct: true}
      - {text: "Je corrige vite le code, puis j'ajoute un test si la correction tient", correct: false}
      - {text: "Je relance toute la suite existante pour savoir quel test aurait dû le voir", correct: false}
      - {text: "Je désactive les tests liés au bug, le temps de livrer la correction", correct: false}
    answer: "Le test rouge prouve qu'on a compris le bug ; vert, il prouve la correction, et il reste dans la suite pour empêcher le bug de revenir."
  - key: situation-regressions
    format: scenario
    question: La couverture du projet est à 95 %, et pourtant des régressions passent encore. Où regardes-tu ?
    choices:
      - {text: "Les assertions : des tests exécutent le code sans vérifier ce qu'il renvoie", correct: true}
      - {text: "Les 5 % restants : toutes les régressions viennent du code non couvert", correct: false}
      - {text: "La configuration de coverage.py, qui doit mal compter les lignes", correct: false}
      - {text: "La vitesse de la CI : des tests plus rapides trouveraient plus de bugs", correct: false}
    answer: "Une ligne couverte peut n'être vérifiée par rien. Les tests de mutation, ou une revue des assertions, montrent ce que les tests laissent passer."
  - key: situation-tdd-lent
    format: scenario
    question: "Un collègue affirme que le TDD ralentit l'équipe. Que lui réponds-tu ?"
    choices:
      - {text: "Qu'il coûte au début, mais guide la conception et évite les régressions coûteuses", correct: true}
      - {text: "Qu'il a raison : le TDD double le code, donc le temps de développement", correct: false}
      - {text: "Que le TDD rend tout autre test inutile, ce qui fait gagner du temps", correct: false}
      - {text: "Que le TDD sert surtout à atteindre 100 % de couverture, exigé partout", correct: false}
    answer: "Le temps passé à écrire les tests se regagne en débogage et en refactorisations sereines. Le TDD paie surtout sur la logique métier ; on peut l'alléger pour un prototype jetable."
