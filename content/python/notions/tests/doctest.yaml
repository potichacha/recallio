notion: doctest
lesson: |-
  Le module standard **`doctest`** exécute les exemples écrits **dans les docstrings**, comme s'ils étaient tapés dans
  l'interpréteur interactif, et compare la sortie à celle écrite dessous.

  ```python
  def carre(x):
      """Renvoie le carré de x.

      >>> carre(3)
      9
      >>> [carre(n) for n in range(4)]
      [0, 1, 4, 9]
      >>> carre("a")
      Traceback (most recent call last):
          ...
      TypeError: can't multiply sequence by non-int of type 'str'
      """
      return x * x
  ```

  - Une ligne **`>>>`** est exécutée ; une ligne **`...`** la continue (un bloc sur plusieurs lignes). La sortie
    attendue suit, jusqu'à la prochaine ligne vide ou `>>>`.
  - La comparaison est **textuelle, au caractère près** : c'est le `repr` qui s'affiche (`'abc'` avec ses guillemets),
    et une espace en trop fait échouer.
  - **Une exception** s'écrit avec la ligne `Traceback (most recent call last):`, puis `...` à la place de la pile, puis
    la dernière ligne (le type et le message).
  - **Une ligne vide** dans la sortie s'écrit `<BLANKLINE>`, puisqu'une vraie ligne vide termine la sortie attendue.
  - **Les directives** assouplissent la comparaison : `# doctest: +ELLIPSIS` (`...` remplace une partie variable),
    `+NORMALIZE_WHITESPACE` (les espaces comptent pour une seule).
  - Une docstring qui contient des barres obliques inverses (`\n`) s'écrit en chaîne brute, `r"""..."""`.

  **Les lancer**

  ```bash
  python -m doctest -v outils.py      # les exemples du module, en détail
  pytest --doctest-modules            # pytest les collecte avec les autres tests
  ```

  On peut aussi appeler `doctest.testmod()` en bas du module, dans le bloc `if __name__ == "__main__":`.

  **À quoi ils servent** : à garder **justes** les exemples de la documentation. Ils sont fragiles sur tout ce qui
  varie (l'ordre d'un `set` de chaînes, une adresse mémoire, l'heure) et peu pratiques pour les cas limites : ils
  complètent les tests pytest, ils ne les remplacent pas.

  **En entretien** : « doctest exécute les exemples `>>>` des docstrings et compare leur sortie au texte écrit dessous,
  au caractère près. Il garantit que la documentation reste vraie ; les vrais cas de test restent dans pytest, qui
  sait aussi lancer les doctests avec `--doctest-modules`. »
cards:
  - key: ce-que-verifie-doctest
    format: course
    question: "Que vérifie un doctest ?"
    choices:
      - {text: "Que chaque exemple `>>>` affiche exactement la sortie écrite dessous", correct: true}
      - {text: "Que chaque fonction du module possède une docstring non vide", correct: false}
      - {text: "Que les types annotés correspondent aux valeurs des exemples", correct: false}
      - {text: "Que la docstring respecte le format de la PEP 257, ligne à ligne", correct: false}
    answer: "doctest rejoue les lignes `>>>` comme dans l'interpréteur et compare, au caractère près, ce qui s'affiche avec la sortie attendue."
  - key: doctests-avec-pytest
    format: course
    question: Comment faire exécuter par pytest les doctests de tous les modules ?
    choices:
      - {text: "`pytest --doctest-modules`", correct: true}
      - {text: "`pytest --doctests`", correct: false}
      - {text: "`pytest -k doctest`", correct: false}
      - {text: "`pytest --docstrings`", correct: false}
    answer: "`--doctest-modules` collecte les docstrings des modules `.py` ; `--doctest-glob` vise des fichiers texte. On peut l'ajouter à `addopts` dans la configuration."
  - key: ligne-vide
    format: course
    question: Comment écrire, dans un doctest, une sortie attendue qui contient une ligne vide ?
    choices:
      - {text: "Avec le marqueur `<BLANKLINE>` à la place de la ligne vide", correct: true}
      - {text: "Avec une vraie ligne vide, comme dans la sortie du programme", correct: false}
      - {text: "Avec la directive `# doctest: +EMPTYLINE` sur la ligne `>>>`", correct: false}
      - {text: "Avec la séquence `\\n` écrite à la fin de la ligne précédente", correct: false}
    answer: "Une vraie ligne vide termine la sortie attendue ; `<BLANKLINE>` la représente sans couper l'exemple."
  - key: exception-attendue
    format: course
    question: "Comment montrer, dans un doctest, qu'un appel lève une `ValueError` ?"
    choices:
      - {text: "La ligne `Traceback (most recent call last):`, puis `...`, puis la ligne de l'erreur", correct: true}
      - {text: "La seule ligne `ValueError`, sans message, juste sous l'appel `>>>`", correct: false}
      - {text: "La directive `# doctest: +RAISES ValueError` sur la ligne de l'appel", correct: false}
      - {text: "Un bloc `try` / `except ValueError` écrit autour de l'appel `>>>`", correct: false}
    answer: "doctest reconnaît l'en-tête `Traceback`, ignore la pile (remplacée par `...`) et compare la dernière ligne : le type et le message."
  - key: vf-espace
    format: true-false
    question: "Un doctest compare la sortie au caractère près : une espace de trop le fait échouer."
    truth: true
    answer: "La comparaison est textuelle. `+NORMALIZE_WHITESPACE` assouplit les espaces, au besoin."
  - key: vf-remplace-pytest
    format: true-false
    question: Les doctests peuvent remplacer une suite de tests pytest.
    truth: false
    answer: "Ils gardent la documentation juste, mais servent mal les cas limites, les fixtures ou les sorties variables. Ils complètent les tests."
  - key: vf-ellipsis
    format: true-false
    question: "Avec la directive `# doctest: +ELLIPSIS`, `...` dans la sortie attendue remplace une partie variable."
    truth: true
    answer: "Pratique pour une adresse mémoire ou une longue liste : `<Panier object at 0x...>`."
  - key: vf-lignes-continuation
    format: true-false
    question: "Un doctest exécute les lignes qui commencent par `>>>` et ignore celles qui commencent par `...`."
    truth: false
    answer: "Les lignes `...` continuent l'instruction commencée par `>>>` (un `for`, une fonction) : elles sont exécutées avec elle."
  - key: qcm-commande-verbose
    format: multiple-choice
    question: "Quelle commande lance les doctests de `outils.py` en affichant chaque exemple essayé ?"
    choices:
      - {text: "`python -m doctest -v outils.py`", correct: true}
      - {text: "`python -m doctest --all outils.py`", correct: false}
      - {text: "`python outils.py --doctest`", correct: false}
      - {text: "`pytest --doctest outils.py`", correct: false}
    answer: "Sans `-v`, doctest ne dit rien quand tout passe ; avec, il liste chaque exemple et son résultat."
  - key: qcm-set-fragile
    format: multiple-choice
    question: Pourquoi un doctest qui affiche un `set` de chaînes est-il fragile ?
    choices:
      - {text: "Son ordre change d'une exécution à l'autre, à cause du hachage aléatoire", correct: true}
      - {text: "doctest ne sait pas afficher un `set`, et lève une `TypeError`", correct: false}
      - {text: "Un `set` s'affiche entre crochets, pas entre accolades", correct: false}
      - {text: "Il faut toujours ajouter la directive `+SET` pour les comparer", correct: false}
    answer: "Le hachage des chaînes est salé à chaque lancement : l'ordre d'affichage varie. On affiche `sorted(resultat)` à la place."
  - key: qcm-sortie-attendue
    format: multiple-choice
    question: "Comment écrire la sortie attendue de l'exemple `>>> carre(3)` ?"
    choices:
      - {text: "La ligne `9`, juste en dessous", correct: true}
      - {text: "La ligne `# 9`, juste en dessous", correct: false}
      - {text: "`-> 9`, sur la même ligne", correct: false}
      - {text: "`== 9`, sur la même ligne", correct: false}
    answer: "Comme dans l'interpréteur interactif : l'expression après `>>>`, puis son `repr` sur la ligne suivante."
  - key: qcm-bon-usage
    format: multiple-choice
    question: Quel usage convient le mieux aux doctests ?
    choices:
      - {text: "Des exemples courts, qui documentent une fonction", correct: true}
      - {text: "Les cas limites et les erreurs détaillées", correct: false}
      - {text: "Les tests d'intégration avec une base", correct: false}
      - {text: "Les mesures de performance du code", correct: false}
    answer: "Un doctest est d'abord de la documentation qui se vérifie. Le reste demande des fixtures, des mocks, `parametrize` : pytest."
  - key: trous-chevrons
    format: fill-in
    question: |-
      Complète l'exemple de la docstring :
      ```python
      def carre(x):
          """
          ___ carre(4)
          16
          """
          return x * x
      ```
    blanks: [[">>>"]]
    answer: "L'invite `>>>`, suivie d'une espace, marque la ligne à exécuter."
  - key: trous-testmod
    format: fill-in
    question: |-
      Complète pour lancer les doctests du module quand on l'exécute :
      ```python
      if __name__ == "__main__":
          import doctest
          doctest.___()
      ```
    blanks: [[testmod]]
    answer: "`testmod()` exécute les exemples des docstrings du module courant."
  - key: trous-ellipsis
    format: fill-in
    question: |-
      Complète la directive qui autorise `...` dans la sortie attendue :
      ```python
      >>> list(range(20))  # doctest: +___
      [0, 1, ..., 19]
      ```
    blanks: [[ELLIPSIS]]
    answer: "`+ELLIPSIS` laisse `...` remplacer n'importe quelle suite de caractères."
  - key: trous-doctest-modules
    format: fill-in
    question: |-
      Complète l'option qui fait collecter les doctests par pytest :
      ```bash
      pytest --doctest-___
      ```
    blanks: [[modules]]
    answer: "`--doctest-modules` ajoute les docstrings des modules aux tests collectés."
