notion: pytest-bases
lesson: |-
  **pytest** est l'outil de test de référence en Python (un paquet tiers : `pip install pytest`). Un test est une simple
  **fonction** dont le nom commence par `test`, qui vérifie le résultat avec le mot-clé **`assert`** :

  ```python
  # test_panier.py
  from panier import total


  def test_total_d_un_panier_vide():
      assert total([]) == 0


  def test_total_additionne_les_prix():
      assert total([10, 5]) == 15
  ```

  **Ce que pytest collecte**, par défaut, en partant du dossier courant :

  | Quoi | Règle |
  |---|---|
  | les fichiers | `test_*.py` ou `*_test.py` |
  | les fonctions | celles dont le nom commence par `test` |
  | les classes | celles dont le nom commence par `Test`, **sans `__init__`** et sans héritage obligatoire, avec des méthodes `test...` |

  Une fonction `verifie_total()` n'est pas collectée, ni un fichier `tests_panier.py` : c'est la première cause d'un
  test « qui ne s'exécute jamais ».

  **`assert` suffit** : pytest **réécrit** les `assert` des modules de test et, en cas d'échec, affiche les valeurs
  comparées (`assert 3 == 4`, `where 3 = total([1, 2])`). Pas besoin de `assertEqual`. On peut ajouter un message :
  `assert total(p) == 15, f"panier : {p}"`. Attention : `assert (x == 1, "message")` teste un **tuple non vide**,
  toujours vrai ; pytest le signale par un avertissement « assertion is always true ».

  **Les résultats** : un test **passe** (`.`) s'il se termine sans exception ; il **échoue** (`F`) si un `assert` est
  faux **ou** si une exception quelconque s'en échappe ; il est en **erreur** (`E`) si c'est sa préparation qui a
  échoué (une fixture). Un test `skip` est sauté (`s`), un `xfail` est un échec attendu (`x`).

  **Les commandes utiles**

  ```bash
  pytest                                    # tout le projet
  pytest -q                                 # sortie résumée
  pytest -x                                 # s'arrête au premier échec
  pytest -k panier                          # les tests dont le nom (ou le module) contient « panier »
  pytest tests/test_panier.py::test_total   # un seul test
  pytest --lf                               # relance seulement les tests en échec la dernière fois
  ```

  pytest sort avec le code **0** si tout passe, **1** si un test échoue, **5** s'il n'a trouvé aucun test : la CI le
  voit.

  **Un bon test** suit le schéma **Arrange, Act, Assert** (préparer, agir, vérifier), teste **un comportement**, porte
  un nom qui le dit (`test_un_panier_vide_coute_zero`), et ne dépend **d'aucun autre test** : chacun crée ses propres
  données, pour pouvoir s'exécuter seul ou dans n'importe quel ordre. pytest sait aussi lancer les tests écrits avec
  `unittest`.

  **En entretien** : « pytest collecte les fonctions `test_` des fichiers `test_*.py` et les vérifie avec un simple
  `assert`, qu'il réécrit pour afficher les valeurs en cas d'échec. Un test échoue sur un `assert` faux ou une
  exception. Chaque test est indépendant et suit préparer, agir, vérifier. »
tour:
  - title: "Des fonctions test_ et des assert"
    text: |-
      Avec pytest, un test est une fonction dont le nom commence par `test_`, qui vérifie un résultat avec `assert`.
      Un `assert` faux lève une `AssertionError` : le test échoue. Après la virgule, un message aide à comprendre.

      En vrai, tu lances la commande `pytest`, qui trouve ces fonctions et les appelle. Ce programme est un simple
      script : les dernières lignes imitent ce travail, en appelant chaque fonction `test_` et en notant le résultat.

      Essaie : corrige l'attendu du troisième test (`50`), puis ajoute un test `test_remise_totale` qui vérifie que
      `remise(80, 100)` vaut 0.
    example:
      files:
        main.py: |-
          def remise(prix, pourcentage):
              """Applique une remise en pourcentage."""
              return prix - prix * pourcentage / 100


          def test_remise_de_dix_pour_cent():
              assert remise(200, 10) == 180


          def test_remise_nulle():
              assert remise(50, 0) == 50


          def test_moitie_prix():
              resultat = remise(100, 50)
              assert resultat == 40, f"remise(100, 50) a donné {resultat}"


          # Ce que fait pytest : trouver les fonctions test_, les appeler, noter les échecs.
          for nom, test in list(globals().items()):
              if nom.startswith("test_"):
                  try:
                      test()
                      print("PASSED", nom)
                  except AssertionError as erreur:
                      print("FAILED", nom, "-", erreur)
      output: |-
        PASSED test_remise_de_dix_pour_cent
        PASSED test_remise_nulle
        FAILED test_moitie_prix - remise(100, 50) a donné 50.0
    task:
      instructions: |-
        Un test échoue : la fonction `prix_ttc` a un bug. Corrige la fonction, pas le test, pour que le programme
        affiche `PASSED` pour les deux tests.
      starter:
        main.py: |-
          def prix_ttc(prix_ht, taux):
              """Renvoie le prix TTC ; le taux est en pour cent."""
              return prix_ht + taux / 100


          def test_tva_a_vingt_pour_cent():
              assert prix_ttc(100, 20) == 120


          def test_taux_nul():
              assert prix_ttc(80, 0) == 80


          for nom, test in list(globals().items()):
              if nom.startswith("test_"):
                  try:
                      test()
                      print("PASSED", nom)
                  except AssertionError:
                      print("FAILED", nom)
      solution:
        main.py: |-
          def prix_ttc(prix_ht, taux):
              """Renvoie le prix TTC ; le taux est en pour cent."""
              return prix_ht + prix_ht * taux / 100


          def test_tva_a_vingt_pour_cent():
              assert prix_ttc(100, 20) == 120


          def test_taux_nul():
              assert prix_ttc(80, 0) == 80


          for nom, test in list(globals().items()):
              if nom.startswith("test_"):
                  try:
                      test()
                      print("PASSED", nom)
                  except AssertionError:
                      print("FAILED", nom)
      output: |-
        PASSED test_tva_a_vingt_pour_cent
        PASSED test_taux_nul
cards:
  - key: fonctions-collectees
    format: course
    question: Quelles fonctions pytest exécute-t-il comme des tests, par défaut ?
    choices:
      - {text: "Celles dont le nom commence par `test`, dans les fichiers `test_*.py` ou `*_test.py`", correct: true}
      - {text: "Celles que décore `@pytest.test`, quel que soit le fichier `.py` où elles sont", correct: false}
      - {text: "Toutes les fonctions des fichiers rangés dans un dossier `tests/`", correct: false}
      - {text: "Les seules méthodes des classes qui héritent de `unittest.TestCase`", correct: false}
    answer: "pytest se fie aux noms : fichiers `test_*.py` ou `*_test.py`, fonctions `test...`, classes `Test...`. Une fonction mal nommée n'est jamais exécutée, sans message d'erreur."
  - key: assert-suffit
    format: course
    question: Pourquoi pytest se contente-t-il du mot-clé `assert`, sans méthode `assertEqual` ?
    choices:
      - {text: "Il réécrit les `assert` des tests pour afficher les valeurs comparées en cas d'échec", correct: true}
      - {text: "Il intercepte chaque `AssertionError`, puis rejoue le test avec `assertEqual`", correct: false}
      - {text: "Un `assert` s'exécute plus vite que les méthodes `assertEqual` de `unittest`", correct: false}
      - {text: "Python affiche déjà, de lui-même, les deux valeurs d'un `assert` qui échoue", correct: false}
    answer: "À l'import des modules de test, pytest réécrit leurs `assert` : un échec montre `assert 3 == 4` et d'où vient 3. Hors de pytest, un `assert` faux ne lève qu'une `AssertionError` nue."
  - key: autre-exception
    format: course
    question: Une `KeyError` s'échappe du corps d'un test pytest. Comment pytest compte-t-il ce test ?
    choices:
      - {text: "En échec, comme si un `assert` avait été faux", correct: true}
      - {text: "Comme réussi : aucun `assert` n'a échoué", correct: false}
      - {text: "Comme sauté (skipped), avec la raison de l'erreur", correct: false}
      - {text: "Il arrête toute la session et ne lance plus rien", correct: false}
    answer: "Un test réussit s'il se termine sans exception. Toute exception qui s'en échappe, `AssertionError` ou autre, le fait échouer, et pytest affiche sa pile. Les autres tests continuent."
  - key: option-k
    format: course
    question: Que fait la commande `pytest -k panier` ?
    choices:
      - {text: "Elle ne lance que les tests dont le nom, ou le module, contient « panier »", correct: true}
      - {text: "Elle ne lance que les tests du fichier `panier.py`, et aucun autre", correct: false}
      - {text: "Elle arrête la session au premier test sur le panier qui échoue", correct: false}
      - {text: "Elle affiche les `print` des tests dont le nom contient « panier »", correct: false}
    answer: "`-k` filtre par mot-clé, sans tenir compte de la casse, et accepte des expressions (`-k \"panier and not lent\"`). Pour un fichier, on donne son chemin ; pour s'arrêter au premier échec, `-x`."
  - key: vf-nom-sans-test
    format: true-false
    question: pytest exécute une fonction `verifier_total()` placée dans le fichier `test_panier.py`.
    truth: false
    answer: "Seules les fonctions dont le nom commence par `test` sont collectées. `verifier_total` est ignorée, sans erreur : le test ne tourne jamais."
  - key: vf-classe-sans-heritage
    format: true-false
    question: "Avec pytest, une classe de tests n'a pas besoin d'hériter d'une classe de base : `class TestPanier:` suffit."
    truth: true
    answer: "pytest collecte les classes `Test...` sans `__init__`, et leurs méthodes `test...`. L'héritage de `unittest.TestCase` n'est nécessaire que pour le style `unittest`."
  - key: vf-option-x
    format: true-false
    question: "`pytest -x` arrête la session au premier test en échec."
    truth: true
    answer: "`-x` (ou `--exitfirst`) s'arrête au premier échec ou à la première erreur ; `--maxfail=3` au troisième."
  - key: vf-code-sortie
    format: true-false
    question: Quand pytest ne trouve aucun test à exécuter, il sort avec le code 0, comme si tout avait réussi.
    truth: false
    answer: "Il sort avec le code 5 (« no tests ran ») : une CI qui ne trouve plus ses tests échoue au lieu de passer en silence. Le code 1 signale un test en échec."
  - key: qcm-nom-fichier
    format: multiple-choice
    question: Quel fichier pytest collecte-t-il par défaut ?
    choices:
      - {text: "`panier_test.py`", correct: true}
      - {text: "`panier_tests.py`", correct: false}
      - {text: "`tests_panier.py`", correct: false}
      - {text: "`paniertest.py`", correct: false}
    answer: "Les motifs par défaut sont `test_*.py` et `*_test.py`. `tests_panier.py` et `panier_tests.py` n'y correspondent pas, à une lettre près."
  - key: qcm-message
    format: multiple-choice
    question: Comment ajouter un message à une assertion pour qu'il s'affiche si elle échoue ?
    choices:
      - {text: "`assert total == 30, \"total faux\"`", correct: true}
      - {text: "`assert(total == 30, \"total faux\")`", correct: false}
      - {text: "`assert total == 30 : \"total faux\"`", correct: false}
      - {text: "`assert total == 30 else \"total faux\"`", correct: false}
    answer: "`assert` est une instruction : la condition, une virgule, puis le message. Avec des parenthèses, on teste un tuple non vide, toujours vrai."
  - key: qcm-un-seul-test
    format: multiple-choice
    question: Comment lancer le seul test `test_total` du fichier `tests/test_panier.py` ?
    choices:
      - {text: "`pytest tests/test_panier.py::test_total`", correct: true}
      - {text: "`pytest tests/test_panier.py.test_total`", correct: false}
      - {text: "`pytest tests/test_panier.py:test_total`", correct: false}
      - {text: "`pytest tests/test_panier.py --test test_total`", correct: false}
    answer: "Le « node id » d'un test joint le chemin du fichier et le nom par `::` ; pour une méthode : `fichier.py::TestPanier::test_total`."
  - key: qcm-arrange-act-assert
    format: multiple-choice
    question: Dans quel ordre s'écrit un test qui suit le schéma Arrange, Act, Assert ?
    choices:
      - {text: "Préparer les données, appeler le code testé, vérifier le résultat", correct: true}
      - {text: "Vérifier les données, appeler le code testé, préparer le résultat", correct: false}
      - {text: "Appeler le code testé, préparer les données, vérifier le résultat", correct: false}
      - {text: "Préparer les données, vérifier les données, appeler le code testé", correct: false}
    answer: "Arrange (le panier et ses articles), Act (un seul appel au code testé), Assert (le résultat). Un test court qui suit ce plan se lit d'un coup d'œil."
  - key: trous-nom-et-assert
    format: fill-in
    question: |-
      Complète pour que pytest collecte et vérifie ce test :
      ```python
      def ___remise_de_dix_pour_cent():
          ___ remise(100) == 90
      ```
    blanks: [["test_"], [assert]]
    answer: "Le nom commence par `test` pour être collecté ; `assert` vérifie le résultat."
  - key: trous-commande
    format: fill-in
    question: |-
      Complète la commande qui lance pytest avec une sortie résumée, et l'arrête au premier échec :
      ```bash
      pytest ___ -x
      ```
    blanks: [["-q", "--quiet"]]
    answer: "`-q` résume la sortie, `-x` arrête au premier échec. On les combine souvent en `pytest -qx`."
  - key: trous-message-assert
    format: fill-in
    question: |-
      Complète pour afficher le panier quand l'assertion échoue :
      ```python
      assert len(panier) == 2___ f"panier : {panier}"
      ```
    blanks: [[","]]
    answer: "Une virgule sépare la condition du message, évalué seulement si la condition est fausse."
  - key: trous-classe-de-tests
    format: fill-in
    question: |-
      Complète pour que pytest collecte cette classe de tests :
      ```python
      class ___Panier:
          def test_vide(self):
              assert Panier().total() == 0
      ```
    blanks: [[Test]]
    answer: "Une classe `Test...`, sans `__init__` : pytest crée une instance par méthode de test."
  - key: bug-tuple-assert
    format: bug-fix
    question: |-
      Ce test passe alors que le total vaut 25, et pytest affiche l'avertissement « assertion is always true, perhaps
      remove parentheses? ». Quelle correction est la bonne ?
      ```python
      def test_total():
          total = 25
          assert (total == 30, "le total doit valoir 30")
      ```
    choices:
      - {text: "Retirer les parenthèses : `assert total == 30, \"le total doit valoir 30\"`", correct: true}
      - {text: "Remplacer la virgule par `and` : `assert (total == 30 and \"le total...\")`", correct: false}
      - {text: "Écrire `assert bool(total == 30, \"le total doit valoir 30\")`", correct: false}
      - {text: "Ajouter `return` devant l'`assert`, pour que pytest lise son résultat", correct: false}
    answer: |-
      ```python
      def test_total():
          total = 25
          assert total == 30, "le total doit valoir 30"
      ```
      Avec les parenthèses, `assert` teste un tuple de deux éléments, qui est toujours vrai. `bool` ne prend qu'un argument, et un `return` ne vérifie rien.
  - key: bug-fonction-mal-nommee
    format: bug-fix
    question: |-
      pytest répond « no tests ran » pour ce fichier `test_remise.py`. Quelle correction est la bonne ?
      ```python
      def remise(prix):
          return prix * 0.9


      def verifie_remise():
          assert remise(100) == 90
      ```
    choices:
      - {text: "Renommer la fonction `test_remise`", correct: true}
      - {text: "Appeler `verifie_remise()` en bas du fichier", correct: false}
      - {text: "Renommer le fichier `remise_tests.py`", correct: false}
      - {text: "Lancer `pytest -k verifie_remise`", correct: false}
    answer: |-
      ```python
      def test_remise():
          assert remise(100) == 90
      ```
      pytest ne collecte que les fonctions dont le nom commence par `test`. `-k` filtre parmi les tests collectés, et `remise_tests.py` ne serait pas collecté non plus.
  - key: bug-fichier-mal-nomme
    format: bug-fix
    question: |-
      pytest, lancé à la racine du projet, ignore ce fichier `remise_tests.py` et répond « no tests ran ». Quelle correction est la bonne ?
      ```python
      from remise import remise


      def test_remise():
          assert remise(100) == 90
      ```
    choices:
      - {text: "Renommer le fichier `test_remise.py` (ou `remise_test.py`)", correct: true}
      - {text: "Renommer la fonction `test_remise_tests`", correct: false}
      - {text: "Ajouter un fichier `__init__.py` vide à côté du fichier", correct: false}
      - {text: "Mettre la fonction dans une classe `TestRemise`", correct: false}
    answer: |-
      ```
      remise_tests.py  ->  test_remise.py
      ```
      Les motifs par défaut sont `test_*.py` et `*_test.py` ; `remise_tests.py` n'y correspond pas, quel que soit son contenu.
  - key: bug-etat-partage
    format: bug-fix
    question: |-
      Lancé seul, `test_panier_vide_au_depart` passe ; avec tout le fichier, il échoue sur « assert ['pomme'] == [] ».
      Quelle correction est la bonne ?
      ```python
      panier = []


      def test_ajout():
          panier.append("pomme")
          assert len(panier) == 1


      def test_panier_vide_au_depart():
          assert panier == []
      ```
    choices:
      - {text: "Créer le panier dans chaque test, au lieu d'une liste du module", correct: true}
      - {text: "Renommer les tests pour que le test du panier vide passe en premier", correct: false}
      - {text: "Lancer les tests avec `pytest -x`, pour qu'ils restent indépendants", correct: false}
      - {text: "Remplacer `panier = []` par `panier = list()` en haut du fichier", correct: false}
    answer: |-
      ```python
      def test_ajout():
          panier = []
          panier.append("pomme")
          assert len(panier) == 1


      def test_panier_vide_au_depart():
          panier = []
          assert panier == []
      ```
      Les deux tests partagent la liste du module : le premier la modifie, le second en hérite. Un test crée ses propres données (ou les reçoit d'une fixture) ; compter sur l'ordre des tests est fragile.
