notion: parametrize
lesson: |-
  **`@pytest.mark.parametrize`** exécute le même test sur plusieurs jeux de données : un cas par jeu, rapporté à part.

  ```python
  import pytest


  @pytest.mark.parametrize("texte, attendu", [
      ("abc", 3),
      ("", 0),
      ("chat", 4),
  ])
  def test_longueur(texte, attendu):
      assert len(texte) == attendu
  ```

  pytest collecte trois tests : `test_longueur[abc-3]`, `test_longueur[-0]`, `test_longueur[chat-4]`.

  - **Les noms** : une chaîne `"texte, attendu"` (ou une liste `["texte", "attendu"]`). Ils doivent correspondre aux
    paramètres de la fonction, sinon pytest refuse : « function uses no argument 'entree' ».
  - **Les valeurs** : une liste de **tuples**, un par cas. Avec **un seul nom**, une liste de **valeurs simples** :
    `@pytest.mark.parametrize("n", [1, 2, 3])` (des tuples `(1,)` seraient passés tels quels).
  - **Les identifiants** : pytest les fabrique à partir des valeurs simples (`3-9`) ou du nom et de l'indice (`n0`).
    `ids=["vide", "simple"]` ou `pytest.param(..., id="vide")` les rendent lisibles.
  - **Un cas particulier** : `pytest.param(-1, marks=pytest.mark.xfail(reason="pas encore géré"))` marque un seul cas.
  - **Empiler** deux décorateurs donne le **produit cartésien** : 3 valeurs de `x` et 2 de `y` font 6 tests.
  - On peut aussi décorer une **classe** de tests : chaque méthode reçoit les paramètres.

  **Pourquoi pas une boucle `for` dans un test ?** La boucle s'arrête au premier cas faux, et le rapport ne dit qu'un
  échec. Avec `parametrize`, chaque cas passe ou échoue seul, on voit tous ceux qui cassent, et on en relance un :

  ```bash
  pytest "tests/test_texte.py::test_longueur[abc-3]"
  ```

  Une faute de frappe est rattrapée : `@pytest.mark.parameterize` fait échouer la collecte avec « Unknown
  'parameterize' mark, did you mean 'parametrize'? ».

  Les **fixtures** se paramètrent aussi (`@pytest.fixture(params=[...])`, puis `request.param`) : tous les tests qui
  les demandent tournent alors pour chaque valeur.

  **En entretien** : « `parametrize` transforme un test en autant de cas que de jeux de données, chacun rapporté et
  relancé à part. On donne les noms des paramètres et une liste de tuples ; `pytest.param` nomme ou marque un cas, et
  deux décorateurs empilés font le produit cartésien. »
cards:
  - key: ce-que-produit-parametrize
    format: course
    question: "Que produit `@pytest.mark.parametrize(\"n, pair\", [(2, True), (3, False)])` sur une fonction de test ?"
    choices:
      - {text: "Deux tests, un par tuple, qui reçoivent `n` et `pair`", correct: true}
      - {text: "Un seul test, qui reçoit la liste entière des tuples", correct: false}
      - {text: "Un test qui parcourt les tuples et s'arrête au premier faux", correct: false}
      - {text: "Quatre tests : chaque `n` combiné avec chaque `pair`", correct: false}
    answer: "Chaque tuple devient un cas, avec son identifiant (`[2-True]`, `[3-False]`). Le produit cartésien n'apparaît qu'avec deux décorateurs empilés."
  - key: pourquoi-pas-une-boucle
    format: course
    question: Pourquoi préférer `parametrize` à une boucle `for` sur les cas, dans un seul test ?
    choices:
      - {text: "Chaque cas devient un test rapporté à part, et un échec n'arrête pas les autres", correct: true}
      - {text: "Une boucle `for` est interdite dans le corps d'une fonction de test pytest", correct: false}
      - {text: "`parametrize` exécute les cas en parallèle, sur tous les cœurs, donc plus vite", correct: false}
      - {text: "Dans une boucle, `assert` ne peut s'utiliser qu'une seule fois par test", correct: false}
    answer: "La boucle s'arrête au premier `assert` faux et ne rapporte qu'un échec. Avec `parametrize`, on voit tous les cas qui cassent, et on relance celui qu'on veut."
  - key: un-seul-nom
    format: course
    question: "Avec `@pytest.mark.parametrize(\"mot\", [\"a\", \"bb\"])`, que reçoit le test ?"
    choices:
      - {text: "`mot` vaut `\"a\"`, puis `\"bb\"`, dans deux tests distincts", correct: true}
      - {text: "`mot` reçoit la liste `[\"a\", \"bb\"]` en une seule fois", correct: false}
      - {text: "`mot` vaut `\"a\"`, puis `\"b\"`, puis `\"b\"`, lettre par lettre", correct: false}
      - {text: "Une erreur : chaque valeur doit s'écrire en tuple `(\"a\",)`", correct: false}
    answer: "Avec un seul nom, chaque élément de la liste est une valeur. Des tuples `(\"a\",)` seraient passés tels quels, comme des tuples."
  - key: role-ids
    format: course
    question: "À quoi sert le paramètre `ids=` de `parametrize` ?"
    choices:
      - {text: "À donner à chaque cas un nom lisible dans le rapport", correct: true}
      - {text: "À fixer l'ordre dans lequel les cas s'exécutent", correct: false}
      - {text: "À ne lancer que les cas dont l'identifiant est listé", correct: false}
      - {text: "À relier chaque cas à la fixture de même nom", correct: false}
    answer: "`ids=[\"vide\", \"accents\"]` remplace `[-0]` par `[vide]` : le rapport dit quel cas a cassé, et `-k vide` le sélectionne."
  - key: vf-cas-independants
    format: true-false
    question: Avec `parametrize`, un cas en échec n'empêche pas les autres cas du même test de s'exécuter.
    truth: true
    answer: "Chaque cas est un test à part entière : il passe ou échoue seul, et le rapport les liste un par un."
  - key: vf-noms-parametres
    format: true-false
    question: Les noms donnés à `parametrize` doivent correspondre aux paramètres de la fonction de test.
    truth: true
    answer: "Sinon, la collecte échoue : « In test_majuscule: function uses no argument 'entree' »."
  - key: vf-tuples-un-nom
    format: true-false
    question: "Pour un seul paramètre, chaque valeur doit s'écrire en tuple : `[(1,), (2,)]`."
    truth: false
    answer: "Avec un seul nom, on donne une liste de valeurs simples : `[1, 2]`. Les tuples seraient reçus tels quels, `(1,)`."
  - key: vf-classe
    format: true-false
    question: "`parametrize` ne s'applique qu'aux fonctions de test, pas aux classes de tests."
    truth: false
    answer: "Sur une classe, il paramètre chacune de ses méthodes de test, qui doivent toutes accepter les paramètres."
  - key: qcm-declaration-valide
    format: multiple-choice
    question: Quelle déclaration est valide ?
    choices:
      - {text: "`@pytest.mark.parametrize(\"a, b\", [(1, 2), (3, 4)])`", correct: true}
      - {text: "`@pytest.parametrize(\"a, b\", [(1, 2), (3, 4)])`", correct: false}
      - {text: "`@pytest.mark.parametrize(a=[1, 3], b=[2, 4])`", correct: false}
      - {text: "`@pytest.mark.parametrize([\"a\", \"b\"], (1, 2), (3, 4))`", correct: false}
    answer: "Le décorateur vit dans `pytest.mark`, et prend deux arguments : les noms, puis la liste des cas."
  - key: qcm-nommer-un-cas
    format: multiple-choice
    question: Comment nommer un seul cas, « vide », sans écrire `ids=` pour tous ?
    choices:
      - {text: "`pytest.param([], 0, id=\"vide\")`", correct: true}
      - {text: "`pytest.case([], 0, name=\"vide\")`", correct: false}
      - {text: "`(\"vide\", [], 0)`", correct: false}
      - {text: "`{\"vide\": ([], 0)}`", correct: false}
    answer: "`pytest.param` enveloppe les valeurs d'un cas, avec un `id` et, au besoin, des `marks`."
  - key: qcm-relancer-un-cas
    format: multiple-choice
    question: "Comment ne relancer que le cas `test_carre[3-9]` du fichier `test_math.py` ?"
    choices:
      - {text: "`pytest \"test_math.py::test_carre[3-9]\"`", correct: true}
      - {text: "`pytest test_math.py::test_carre::3-9`", correct: false}
      - {text: "`pytest test_math.py::test_carre --case 3-9`", correct: false}
      - {text: "`pytest \"test_math.py::test_carre(3, 9)\"`", correct: false}
    answer: "L'identifiant du cas, entre crochets, fait partie du « node id ». Les guillemets protègent les crochets du shell."
  - key: qcm-produit-cartesien
    format: multiple-choice
    question: |-
      Combien de tests ce module fait-il collecter ?
      ```python
      @pytest.mark.parametrize("x", [1, 2])
      @pytest.mark.parametrize("y", ["a", "b", "c"])
      def test_f(x, y):
          assert x
      ```
    choices:
      - {text: "6", correct: true}
      - {text: "5", correct: false}
      - {text: "3", correct: false}
      - {text: "2", correct: false}
    answer: "Deux décorateurs empilés font le produit cartésien : 2 valeurs de `x` fois 3 de `y`."
  - key: trous-parametrize
    format: fill-in
    question: |-
      Complète le test paramétré :
      ```python
      @pytest.mark.___("texte, attendu", [("abc", 3), ("", 0)])
      def test_longueur(texte, attendu):
          assert len(texte) == ___
      ```
    blanks: [[parametrize], [attendu]]
    answer: "`parametrize` donne les noms et les cas ; le test compare au paramètre `attendu`."
  - key: trous-param
    format: fill-in
    question: |-
      Complète pour nommer le second cas :
      ```python
      @pytest.mark.parametrize("n", [
          1,
          pytest.___(0, id="zéro"),
      ])
      def test_inverse(n): ...
      ```
    blanks: [[param]]
    answer: "`pytest.param(valeurs..., id=..., marks=...)` décrit un cas particulier."
  - key: trous-ids
    format: fill-in
    question: |-
      Complète pour nommer les cas dans le rapport :
      ```python
      @pytest.mark.parametrize("a, b", [(1, 2), (100, 200)], ___=["petits", "grands"])
      def test_somme(a, b): ...
      ```
    blanks: [[ids]]
    answer: "`ids=` donne un nom par cas, dans l'ordre : `test_somme[petits]`, `test_somme[grands]`."
  - key: trous-xfail
    format: fill-in
    question: |-
      Complète pour marquer ce seul cas comme un échec attendu :
      ```python
      @pytest.mark.parametrize("age", [
          18,
          pytest.param(-1, marks=pytest.mark.___),
      ])
      def test_age_valide(age): ...
      ```
    blanks: [[xfail]]
    answer: "`xfail` attend un échec : le cas est rapporté `x` s'il échoue, sans faire échouer la session."
  - key: bug-noms-differents
    format: bug-fix
    question: |-
      La collecte échoue avec « In test_maj.py::test_majuscule: function uses no argument 'entree' ». Quelle correction est la bonne ?
      ```python
      @pytest.mark.parametrize("entree, attendu", [("a", "A"), ("b", "B")])
      def test_majuscule(texte, attendu):
          assert texte.upper() == attendu
      ```
    choices:
      - {text: "Accorder les noms : `def test_majuscule(entree, attendu):`, et utiliser `entree`", correct: true}
      - {text: "Ajouter `entree=None` comme paramètre en plus dans la fonction de test", correct: false}
      - {text: "Écrire les noms dans une liste : `[\"entree\", \"attendu\"]`, sans rien d'autre", correct: false}
      - {text: "Déclarer une fixture `texte` qui renvoie les valeurs de `entree`", correct: false}
    answer: |-
      ```python
      @pytest.mark.parametrize("entree, attendu", [("a", "A"), ("b", "B")])
      def test_majuscule(entree, attendu):
          assert entree.upper() == attendu
      ```
      Chaque nom de `parametrize` doit être un paramètre de la fonction, et inversement : `texte` n'est fourni par personne.
  - key: bug-un-nom-deux-valeurs
    format: bug-fix
    question: |-
      Chaque cas est en erreur : « fixture 'attendu' not found ». Quelle correction est la bonne ?
      ```python
      @pytest.mark.parametrize("n", [(2, 4), (3, 9)])
      def test_carre(n, attendu):
          assert n * n == attendu
      ```
    choices:
      - {text: "Déclarer les deux noms : `parametrize(\"n, attendu\", ...)`", correct: true}
      - {text: "Retirer `attendu` de la signature du test", correct: false}
      - {text: "Écrire les cas en liste : `[[2, 4], [3, 9]]`", correct: false}
      - {text: "Donner `ids=[\"n\", \"attendu\"]` au décorateur", correct: false}
    answer: |-
      ```python
      @pytest.mark.parametrize("n, attendu", [(2, 4), (3, 9)])
      def test_carre(n, attendu):
          assert n * n == attendu
      ```
      Avec le seul nom `n`, chaque tuple entier devient `n`, et pytest cherche `attendu` parmi les fixtures, en vain.
  - key: bug-valeurs-sans-tuples
    format: bug-fix
    question: |-
      La collecte échoue : « in "parametrize" expected a sequence of values, for a single value use a one-element tuple like ('value',), got int ». Quelle correction est la bonne ?
      ```python
      @pytest.mark.parametrize("a, b", [1, 2])
      def test_somme(a, b):
          assert a + b > 0
      ```
    choices:
      - {text: "Grouper les valeurs d'un cas en tuple : `[(1, 2)]`", correct: true}
      - {text: "Écrire les noms en liste : `[\"a\", \"b\"]`", correct: false}
      - {text: "Passer les valeurs en tuple : `(1, 2)`", correct: false}
      - {text: "Retirer l'espace : `\"a,b\"`", correct: false}
    answer: |-
      ```python
      @pytest.mark.parametrize("a, b", [(1, 2)])
      def test_somme(a, b):
          assert a + b > 0
      ```
      Avec deux noms, chaque cas est un tuple de deux valeurs. `[1, 2]` décrit deux cas d'une seule valeur, incompatibles avec deux noms.
  - key: bug-faute-de-frappe
    format: bug-fix
    question: |-
      La collecte échoue : « Unknown 'parameterize' mark, did you mean 'parametrize'? ». Quelle correction est la bonne ?
      ```python
      @pytest.mark.parameterize("n", [2, 4])
      def test_pair(n):
          assert n % 2 == 0
      ```
    choices:
      - {text: "Écrire `parametrize`, sans le « e » du milieu", correct: true}
      - {text: "Déclarer la marque dans `pytest.ini`", correct: false}
      - {text: "Importer `parameterize` depuis `pytest`", correct: false}
      - {text: "Écrire `@pytest.parameterize`, sans `mark`", correct: false}
    answer: |-
      ```python
      @pytest.mark.parametrize("n", [2, 4])
      def test_pair(n):
          assert n % 2 == 0
      ```
      Le nom s'écrit à l'anglaise, `parametrize`. pytest repère cette faute courante et refuse la collecte, plutôt que d'ignorer la marque.
