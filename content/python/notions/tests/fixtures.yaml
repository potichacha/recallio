notion: fixtures
lesson: |-
  Une **fixture** prépare ce dont un test a besoin (un objet, une base, un fichier) et, au besoin, le nettoie ensuite.
  Un test la **demande par son nom**, en paramètre : pytest l'appelle et injecte sa valeur.

  ```python
  import sqlite3

  import pytest


  @pytest.fixture
  def panier():
      return Panier(articles=["pomme"])


  @pytest.fixture
  def connexion():
      conn = sqlite3.connect(":memory:")
      yield conn            # le test s'exécute ici
      conn.close()          # le nettoyage, même si le test a échoué


  def test_total(panier):
      assert panier.total() == 1
  ```

  - **`return`** fournit une valeur ; **`yield`** la fournit puis reprend après le test pour nettoyer. Le nettoyage
    s'exécute même si le test échoue (mais pas si la préparation, avant le `yield`, a levé une exception).
  - Une fixture peut **demander d'autres fixtures** : `def client(connexion):`. pytest résout le graphe.
  - On n'appelle **jamais** une fixture soi-même : `panier()` dans un test fait échouer avec « Fixture "panier" called
    directly ».
  - Une fixture qui oublie son `return` donne `None` au test.

  **La portée** (`scope`) dit combien de fois la fixture est créée :

  | Portée | Créée |
  |---|---|
  | `function` (défaut) | pour chaque test |
  | `class` | une fois par classe de tests |
  | `module` | une fois par fichier |
  | `package` | une fois par paquet |
  | `session` | une fois pour toute la session |

  Une portée large économise une préparation coûteuse (démarrer une base), mais l'objet est **partagé** : un test qui
  le modifie pollue les suivants. Et une fixture ne peut demander qu'une fixture de portée **égale ou plus large**,
  sinon : `ScopeMismatch`.

  **Partager et automatiser**

  - **`conftest.py`** : les fixtures d'un `conftest.py` sont visibles, **sans import**, par tous les tests de son
    dossier et de ses sous-dossiers.
  - **`autouse=True`** applique une fixture à tous les tests de sa portée, sans qu'ils la demandent.
  - **`params=[...]`** paramètre la fixture : chaque test qui la demande tourne pour chaque valeur, lue dans
    `request.param`.
  - **Les fixtures fournies** par pytest : `tmp_path` (un dossier temporaire), `monkeypatch`, `capsys`, `caplog`,
    `request`...

  Comparées au `setUp` de `unittest`, les fixtures sont **explicites** (on voit ce qu'un test utilise), **composables**
  et **à la carte** : chaque test ne prépare que ce qu'il demande.

  **En entretien** : « Une fixture fournit au test ce qu'il demande par son nom ; avec `yield`, elle nettoie après. Sa
  portée, de `function` à `session`, règle combien de fois elle est créée, au risque de partager un état. On les met
  dans `conftest.py` pour les partager sans import. »
cards:
  - key: recevoir-une-fixture
    format: course
    question: Comment un test reçoit-il la fixture `panier` ?
    choices:
      - {text: "Il déclare un paramètre nommé `panier`, et pytest lui passe sa valeur", correct: true}
      - {text: "Il appelle `panier()` lui-même, en première ligne de son corps", correct: false}
      - {text: "Il importe `panier` depuis le module `conftest`, en tête de fichier", correct: false}
      - {text: "Il hérite d'une classe de tests qui définit une méthode `panier`", correct: false}
    answer: "pytest lit les noms des paramètres du test, trouve les fixtures de même nom, les exécute et injecte leurs valeurs. Appeler la fixture soi-même est refusé."
  - key: apres-yield
    format: course
    question: Quand s'exécute le code placé après le `yield` d'une fixture ?
    choices:
      - {text: "Après le test qui l'utilise, même si ce test a échoué", correct: true}
      - {text: "Avant le test, juste après le code qui précède `yield`", correct: false}
      - {text: "Après le test, mais seulement si le test a réussi", correct: false}
      - {text: "À la fin de la session, une seule fois pour tous les tests", correct: false}
    answer: "Le `yield` sépare la préparation du nettoyage. Le nettoyage tourne après chaque test (pour la portée `function`), qu'il réussisse ou non."
  - key: portee-module
    format: course
    question: "Que change `@pytest.fixture(scope=\"module\")` ?"
    choices:
      - {text: "La fixture est créée une fois, puis partagée par tous les tests du fichier", correct: true}
      - {text: "La fixture n'est visible que des tests du fichier où elle est écrite", correct: false}
      - {text: "La fixture est recréée avant chaque test du fichier, puis détruite", correct: false}
      - {text: "La fixture s'applique d'office à tous les tests du fichier", correct: false}
    answer: "La portée règle la durée de vie, pas la visibilité. `module` : une création par fichier. Appliquer d'office, c'est `autouse=True`."
  - key: role-conftest
    format: course
    question: "À quoi sert le fichier `conftest.py` ?"
    choices:
      - {text: "À partager des fixtures avec les tests de son dossier, sans import", correct: true}
      - {text: "À déclarer la liste des fichiers de tests que pytest doit collecter", correct: false}
      - {text: "À ranger les tests qui ne passent pas encore, à part des autres", correct: false}
      - {text: "À configurer la mesure de couverture de code de pytest-cov", correct: false}
    answer: "pytest charge les `conftest.py` de chaque dossier : leurs fixtures (et leurs hooks) servent aux tests du dossier et des sous-dossiers."
  - key: vf-recreee-par-test
    format: true-false
    question: Par défaut, une fixture est recréée pour chaque test qui la demande.
    truth: true
    answer: "La portée par défaut est `function` : chaque test reçoit une valeur neuve, ce qui garde les tests indépendants."
  - key: vf-fixture-demande-fixture
    format: true-false
    question: Une fixture peut demander une autre fixture en paramètre.
    truth: true
    answer: "`def client(connexion):` reçoit la fixture `connexion`. pytest crée les fixtures dans l'ordre de leurs dépendances."
  - key: vf-import-conftest
    format: true-false
    question: "Pour utiliser une fixture définie dans `conftest.py`, il faut l'importer dans le fichier de tests."
    truth: false
    answer: "pytest découvre lui-même les `conftest.py` : le nom de la fixture en paramètre suffit."
  - key: vf-session-demande-function
    format: true-false
    question: "Une fixture de portée `session` peut demander une fixture de portée `function`."
    truth: false
    answer: "pytest refuse avec `ScopeMismatch` : une fixture qui vit toute la session ne peut pas dépendre d'une valeur recréée à chaque test."
  - key: qcm-autouse
    format: multiple-choice
    question: Quelle option applique une fixture à tous les tests, sans qu'ils la demandent ?
    choices:
      - {text: "`autouse=True`", correct: true}
      - {text: "`scope=\"session\"`", correct: false}
      - {text: "`params=[\"all\"]`", correct: false}
      - {text: "`name=\"*\"`", correct: false}
    answer: "Une fixture `autouse` s'exécute pour chaque test de sa portée (son module, ou tout le dossier depuis un `conftest.py`) : utile pour remettre un état à zéro."
  - key: qcm-fermer-apres
    format: multiple-choice
    question: Quelle fixture ferme sa connexion après le test ?
    choices:
      - text: |-
          ```python
          conn = ouvrir()
          yield conn
          conn.close()
          ```
        correct: true
      - text: |-
          ```python
          conn = ouvrir()
          return conn
          conn.close()
          ```
        correct: false
      - text: |-
          ```python
          conn = ouvrir()
          conn.close()
          return conn
          ```
        correct: false
      - text: |-
          ```python
          with ouvrir() as conn:
              return conn
          ```
        correct: false
    answer: "Le `yield` rend la main au test, puis reprend pour fermer. Après un `return`, la ligne suivante ne s'exécute jamais ; fermer avant, ou sortir du `with`, donne au test une connexion déjà fermée."
  - key: qcm-portee-base-couteuse
    format: multiple-choice
    question: Une base de test met dix secondes à démarrer, et tous les tests peuvent la partager. Quelle portée lui donner ?
    choices:
      - {text: "`session`", correct: true}
      - {text: "`function`", correct: false}
      - {text: "`class`", correct: false}
      - {text: "`module`", correct: false}
    answer: "`session` la démarre une seule fois. Pour garder les tests indépendants, chacun travaille dans une transaction annulée à la fin (une seconde fixture, de portée `function`)."
  - key: qcm-fixture-parametree
    format: multiple-choice
    question: Comment faire tourner chaque test qui demande `base` sur SQLite, puis sur PostgreSQL ?
    choices:
      - {text: "`@pytest.fixture(params=[\"sqlite\", \"postgres\"])`, puis `request.param`", correct: true}
      - {text: "`@pytest.mark.parametrize(\"base\", ...)` sur la fixture elle-même", correct: false}
      - {text: "Deux fixtures de même nom, `base`, dans deux `conftest.py` voisins", correct: false}
      - {text: "`@pytest.fixture(scope=[\"sqlite\", \"postgres\"])`, puis `request.scope`", correct: false}
    answer: "Une fixture paramétrée crée un cas par valeur pour chaque test qui la demande ; elle lit la valeur courante dans `request.param`."
  - key: trous-decorateur
    format: fill-in
    question: |-
      Complète la déclaration de la fixture :
      ```python
      @pytest.___
      def client():
          return Client("Ada")
      ```
    blanks: [[fixture]]
    answer: "`@pytest.fixture` déclare la fixture ; les tests la demandent par son nom, `client`."
  - key: trous-yield
    format: fill-in
    question: |-
      Complète pour que le fichier soit fermé après le test :
      ```python
      @pytest.fixture
      def journal(tmp_path):
          f = open(tmp_path / "log.txt", "w")
          ___ f
          f.close()
      ```
    blanks: [[yield]]
    answer: "Ce qui suit `yield` s'exécute après le test : c'est le nettoyage."
  - key: trous-scope
    format: fill-in
    question: |-
      Complète pour ne créer la base qu'une fois pour toute la session :
      ```python
      @pytest.fixture(___="session")
      def base():
          return demarrer_base()
      ```
    blanks: [[scope]]
    answer: "`scope` accepte `function` (le défaut), `class`, `module`, `package` et `session`."
  - key: trous-request-param
    format: fill-in
    question: |-
      Complète pour lire la valeur courante d'une fixture paramétrée :
      ```python
      @pytest.fixture(params=["fr", "en"])
      def langue(request):
          return request.___
      ```
    blanks: [[param]]
    answer: "`request.param` vaut `\"fr\"`, puis `\"en\"` : chaque test qui demande `langue` tourne deux fois."
  - key: bug-appel-direct
    format: bug-fix
    question: |-
      Le test échoue avec « Fixture "panier" called directly. Fixtures are not meant to be called directly ». Quelle correction est la bonne ?
      ```python
      @pytest.fixture
      def panier():
          return Panier()


      def test_total_vide():
          assert panier().total() == 0
      ```
    choices:
      - {text: "Demander la fixture en paramètre : `def test_total_vide(panier):`", correct: true}
      - {text: "Retirer `@pytest.fixture` et garder l'appel `panier()` tel quel", correct: false}
      - {text: "Appeler `pytest.fixture(panier)()` dans le corps du test", correct: false}
      - {text: "Écrire `panier.total()`, sans parenthèses après `panier`", correct: false}
    answer: |-
      ```python
      def test_total_vide(panier):
          assert panier.total() == 0
      ```
      Une fixture se demande, elle ne s'appelle pas : pytest gère sa création, sa portée et son nettoyage. Retirer le décorateur marcherait ici, mais perdrait tout cela.
  - key: bug-return-avant-close
    format: bug-fix
    question: |-
      Les connexions ouvertes par cette fixture ne sont jamais fermées. Quelle correction est la bonne ?
      ```python
      @pytest.fixture
      def connexion():
          conn = sqlite3.connect(":memory:")
          return conn
          conn.close()
      ```
    choices:
      - {text: "Remplacer `return conn` par `yield conn`", correct: true}
      - {text: "Placer `conn.close()` avant le `return`", correct: false}
      - {text: "Passer la fixture en portée `session`", correct: false}
      - {text: "Ajouter `autouse=True` au décorateur", correct: false}
    answer: |-
      ```python
      @pytest.fixture
      def connexion():
          conn = sqlite3.connect(":memory:")
          yield conn
          conn.close()
      ```
      Rien ne s'exécute après un `return`. Avec `yield`, pytest reprend la fixture après le test pour fermer. Fermer avant de renvoyer donnerait au test une connexion inutilisable.
  - key: bug-portee-module-partagee
    format: bug-fix
    question: |-
      `test_vide_au_depart` échoue sur « assert ['pomme'] == [] » quand il s'exécute après `test_ajout`. Quelle correction est la bonne ?
      ```python
      @pytest.fixture(scope="module")
      def panier():
          return []


      def test_ajout(panier):
          panier.append("pomme")
          assert panier == ["pomme"]


      def test_vide_au_depart(panier):
          assert panier == []
      ```
    choices:
      - {text: "Revenir à la portée par défaut, pour un panier neuf par test", correct: true}
      - {text: "Passer la fixture en portée `session`, plus large que `module`", correct: false}
      - {text: "Renommer les tests pour que le panier vide soit testé en premier", correct: false}
      - {text: "Ajouter `autouse=True` pour que la fixture soit recréée", correct: false}
    answer: |-
      ```python
      @pytest.fixture
      def panier():
          return []
      ```
      En portée `module`, les deux tests reçoivent la même liste, que le premier modifie. Un objet modifiable a une portée `function` ; une portée large convient aux ressources qu'aucun test ne modifie.
  - key: bug-scope-mismatch
    format: bug-fix
    question: |-
      pytest répond « ScopeMismatch: You tried to access the function scoped fixture config with a session scoped request object ». Quelle correction est la bonne ?
      ```python
      @pytest.fixture
      def config():
          return {"url": "sqlite://"}


      @pytest.fixture(scope="session")
      def base(config):
          return ouvrir(config["url"])
      ```
    choices:
      - {text: "Donner à `config` la portée `session`, comme `base`", correct: true}
      - {text: "Retirer `config` des paramètres et l'appeler : `config()`", correct: false}
      - {text: "Donner à `config` la portée `class`, plus étroite que `module`", correct: false}
      - {text: "Ajouter `autouse=True` à la fixture `config`", correct: false}
    answer: |-
      ```python
      @pytest.fixture(scope="session")
      def config():
          return {"url": "sqlite://"}
      ```
      Une fixture ne peut dépendre que de fixtures qui vivent au moins aussi longtemps qu'elle : `base` vit toute la session, `config` doit donc aussi.
  - key: situation-tests-lents
    format: scenario
    question: |-
      Tes tests d'intégration démarrent chacun leur propre base PostgreSQL dans un conteneur : la suite prend dix
      minutes. Que fais-tu ?
    choices:
      - {text: "Une fixture `session` démarre la base une fois, et chaque test annule sa transaction", correct: true}
      - {text: "Je fusionne tous les tests en un seul long test, qui ouvre la base une fois", correct: false}
      - {text: "Je remplace la base par des mocks dans tous les tests, même ceux d'intégration", correct: false}
      - {text: "Je fixe l'ordre des tests, pour que chacun réutilise la base du test précédent", correct: false}
    answer: "La portée `session` paie le démarrage une fois ; une fixture `function` ouvre une transaction et l'annule après chaque test, ce qui garde les tests indépendants. Un test géant rapporterait mal ses échecs."
  - key: situation-fixture-recopiee
    format: scenario
    question: Trois fichiers de tests recopient la même fixture `client_api`. Où la ranges-tu ?
    choices:
      - {text: "Dans le `conftest.py` du dossier qui contient les trois fichiers", correct: true}
      - {text: "Dans une classe de base dont tous les tests devront hériter", correct: false}
      - {text: "Dans `pyproject.toml`, sous la section `[tool.pytest.ini_options]`", correct: false}
      - {text: "Je la laisse recopiée : un test doit tout montrer dans son fichier", correct: false}
    answer: "Les fixtures d'un `conftest.py` servent à tous les tests de son dossier, sans import. La configuration de pytest ne contient pas de code, et l'héritage n'est pas le mécanisme de pytest."
  - key: situation-ordre-des-tests
    format: scenario
    question: |-
      Un test échoue seulement quand il passe après un autre : la fixture `utilisateurs`, de portée `module`, renvoie
      une liste que le premier test modifie. Que corriges-tu ?
    choices:
      - {text: "Je repasse la fixture en portée `function`, ou je renvoie une copie à chaque test", correct: true}
      - {text: "Je fixe l'ordre des tests, pour que le test fragile passe toujours en premier", correct: false}
      - {text: "J'ajoute `autouse=True`, qui recrée la fixture avant chaque test du module", correct: false}
      - {text: "Je relance les tests en échec avec `pytest --lf` jusqu'à ce qu'ils passent", correct: false}
    answer: "Le problème est l'état partagé : chaque test doit recevoir sa propre liste. `autouse` ne change pas la portée, et compter sur l'ordre masque le défaut."
  - key: situation-entretien-setup
    format: scenario
    question: "En entretien : « À quoi servent les fixtures de pytest, comparées au `setUp` de unittest ? » Que réponds-tu ?"
    choices:
      - {text: "Chaque test demande par son nom ce qu'il utilise ; elles se composent et nettoient après `yield`", correct: true}
      - {text: "Elles s'exécutent avant chaque test, exactement comme `setUp`, mais s'écrivent plus court", correct: false}
      - {text: "Elles remplacent les `assert` par des vérifications automatiques, faites après chaque test", correct: false}
      - {text: "Elles génèrent des données aléatoires pour chaque test, à partir des annotations de type", correct: false}
    answer: "`setUp` prépare tout pour toute la classe ; une fixture est demandée explicitement par les tests qui en ont besoin, peut dépendre d'autres fixtures, a une portée réglable et nettoie après `yield`."
