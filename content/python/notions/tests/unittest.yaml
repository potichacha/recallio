notion: unittest
lesson: |-
  **`unittest`** est le module de test de la **bibliothèque standard**, inspiré de JUnit : rien à installer. Les tests
  sont des **méthodes** d'une classe qui hérite de **`unittest.TestCase`**.

  ```python
  import unittest


  class TestPanier(unittest.TestCase):
      def setUp(self):                       # avant chaque test
          self.panier = Panier()

      def test_vide(self):
          self.assertEqual(self.panier.total(), 0)

      def test_retrait_impossible(self):
          with self.assertRaises(ValueError):
              self.panier.retirer("pomme")


  if __name__ == "__main__":
      unittest.main()
  ```

  **Le cycle de vie**

  | Méthode | Quand |
  |---|---|
  | `setUp` / `tearDown` | avant / après **chaque** méthode de test (`tearDown` même si le test échoue) |
  | `setUpClass` / `tearDownClass` | une fois pour la classe ; ce sont des `@classmethod` |
  | `self.addCleanup(f)` | enregistre un nettoyage, exécuté même si `setUp` échoue plus loin |

  **Les assertions** sont des méthodes, qui affichent les valeurs en cas d'échec : `assertEqual`, `assertNotEqual`,
  `assertTrue`, `assertFalse`, `assertIs`, `assertIsNone`, `assertIn`, `assertIsInstance`, `assertRaises` (en `with`),
  `assertRaisesRegex`, `assertAlmostEqual` (à 7 décimales par défaut). Mieux vaut `assertEqual(a, b)` que
  `assertTrue(a == b)`, qui ne dit que « False is not true ».

  **Les sous-tests** : dans une boucle, `with self.subTest(n=n):` rapporte chaque cas en échec à part, sans arrêter la
  boucle.

  **Sauter un test** : `@unittest.skip("raison")`, `@unittest.skipIf(sys.platform == "win32", "pas sous Windows")`,
  `@unittest.expectedFailure`. Pour du code asynchrone : `unittest.IsolatedAsyncioTestCase`.

  **Lancer les tests**

  ```bash
  python -m unittest                         # découvre les fichiers test*.py
  python -m unittest discover -s tests -v    # depuis le dossier tests, en détail
  python -m unittest test_panier.TestPanier.test_vide
  pytest                                     # pytest lance aussi les tests unittest
  ```

  **unittest ou pytest ?** unittest ne demande rien d'installer et reste courant dans les vieux projets et dans
  CPython lui-même ; pytest est plus concis (`assert` simple, fixtures, `parametrize`) et domine les projets récents.
  Comme pytest exécute les classes `TestCase`, on peut migrer petit à petit.

  **En entretien** : « unittest, dans la bibliothèque standard, range les tests en méthodes d'une classe `TestCase`,
  avec `setUp`/`tearDown` et des assertions `assertEqual`, `assertRaises`. pytest est plus concis et sait exécuter ces
  tests : on choisit pytest pour un nouveau projet. »
cards:
  - key: classe-de-tests
    format: course
    question: "Que faut-il pour qu'une classe soit une suite de tests `unittest` ?"
    choices:
      - {text: "Qu'elle hérite de `unittest.TestCase`, avec des méthodes `test...`", correct: true}
      - {text: "Qu'elle porte le décorateur `@unittest.suite` sur sa déclaration", correct: false}
      - {text: "Que son nom commence par `Test`, sans aucun héritage nécessaire", correct: false}
      - {text: "Qu'elle définisse une méthode `run()`, appelée par `unittest.main()`", correct: false}
    answer: "unittest exécute les méthodes `test...` des sous-classes de `TestCase`. Le nom `Test...` sans héritage, c'est la convention de pytest."
  - key: quand-setup
    format: course
    question: "Quand la méthode `setUp` s'exécute-t-elle ?"
    choices:
      - {text: "Avant chaque méthode de test de la classe", correct: true}
      - {text: "Une seule fois, avant la première méthode de test", correct: false}
      - {text: "Après chaque méthode de test, pour nettoyer", correct: false}
      - {text: "À l'import du module qui contient la classe", correct: false}
    answer: "Chaque test reçoit un objet `TestCase` neuf, préparé par `setUp`. La préparation unique, c'est `setUpClass`."
  - key: assertequal-ou-asserttrue
    format: course
    question: "Pourquoi écrire `self.assertEqual(a, b)` plutôt que `self.assertTrue(a == b)` ?"
    choices:
      - {text: "En cas d'échec, `assertEqual` affiche les deux valeurs comparées", correct: true}
      - {text: "`assertTrue` n'accepte que les booléens `True` et `False` stricts", correct: false}
      - {text: "`assertEqual` compare l'identité des objets, plus fiable que `==`", correct: false}
      - {text: "`assertTrue` est déprécié depuis Python 3.12, et sera retiré", correct: false}
    answer: "`assertTrue(a == b)` ne voit qu'un booléen et dit « False is not true ». `assertEqual` montre `3 != 4`, et le détail des listes ou des chaînes différentes."
  - key: role-subtest
    format: course
    question: "Que permet `with self.subTest(n=n):` dans une boucle de test ?"
    choices:
      - {text: "Chaque cas en échec est rapporté à part, et la boucle continue", correct: true}
      - {text: "Chaque cas s'exécute dans un processus séparé, en parallèle", correct: false}
      - {text: "La boucle s'arrête dès le premier cas qui réussit", correct: false}
      - {text: "Chaque cas reçoit son propre appel à `setUp`", correct: false}
    answer: "Sans `subTest`, le premier `assert...` faux arrête la boucle. Avec, chaque cas faux est rapporté avec ses paramètres (`n=3`). `setUp` n'est pas rappelé entre les cas."
  - key: vf-pytest-lance-unittest
    format: true-false
    question: "pytest sait exécuter les tests écrits avec `unittest.TestCase`."
    truth: true
    answer: "pytest collecte les sous-classes de `TestCase` : on peut adopter pytest sans réécrire les anciens tests."
  - key: vf-setupclass-classmethod
    format: true-false
    question: "`setUpClass` se déclare comme une `@classmethod`."
    truth: true
    answer: "`setUpClass(cls)` s'exécute une fois pour la classe, sans instance ; ce qu'il prépare se range sur `cls`."
  - key: vf-assertalmostequal
    format: true-false
    question: "`self.assertAlmostEqual(0.1 + 0.2, 0.3)` échoue, comme `assertEqual`."
    truth: false
    answer: "`assertAlmostEqual` arrondit la différence à 7 décimales par défaut : 0.30000000000000004 et 0.3 sont égaux à cette précision."
  - key: vf-fonction-module
    format: true-false
    question: "Avec `unittest`, une fonction `test_...` écrite au niveau du module, hors de toute classe, est exécutée."
    truth: false
    answer: "unittest ne connaît que les méthodes des classes `TestCase`. Les fonctions de module, c'est le style de pytest."
  - key: qcm-assertraises
    format: multiple-choice
    question: "Comment vérifier avec `unittest` qu'un appel lève une `KeyError` ?"
    choices:
      - {text: "`with self.assertRaises(KeyError):`", correct: true}
      - {text: "`with self.raises(KeyError):`", correct: false}
      - {text: "`self.assertThrows(KeyError)`", correct: false}
      - {text: "`with self.expectException(KeyError):`", correct: false}
    answer: "`assertRaises` s'utilise en `with` (ou en passant la fonction et ses arguments) ; `assertRaisesRegex` vérifie en plus le message."
  - key: qcm-discover
    format: multiple-choice
    question: "Quelle commande découvre et lance tous les tests `unittest` du projet ?"
    choices:
      - {text: "`python -m unittest discover`", correct: true}
      - {text: "`python -m unittest --all`", correct: false}
      - {text: "`python unittest.py run`", correct: false}
      - {text: "`unittest run tests/`", correct: false}
    answer: "`discover` cherche les fichiers `test*.py` (option `-p` pour un autre motif) ; `python -m unittest` seul fait la même découverte."
  - key: qcm-nettoyer
    format: multiple-choice
    question: Quelle méthode nettoie après chaque test, même quand le test échoue ?
    choices:
      - {text: "`tearDown`", correct: true}
      - {text: "`setUpClass`", correct: false}
      - {text: "`cleanUp`", correct: false}
      - {text: "`__del__`", correct: false}
    answer: "`tearDown` s'exécute après chaque test, réussi ou non, dès lors que `setUp` a réussi. `addCleanup` couvre même un `setUp` interrompu."
  - key: qcm-sauter-windows
    format: multiple-choice
    question: Comment sauter un test sous Windows seulement ?
    choices:
      - {text: "`@unittest.skipIf(sys.platform == \"win32\", \"pas sous Windows\")`", correct: true}
      - {text: "`@unittest.skip(sys.platform == \"win32\")`", correct: false}
      - {text: "`@unittest.ignore(sys.platform == \"win32\")`", correct: false}
      - {text: "`@unittest.expectedFailure(sys.platform == \"win32\")`", correct: false}
    answer: "`skipIf(condition, raison)` saute si la condition est vraie. `skip` attend une raison et saute toujours ; `expectedFailure` marque un échec attendu."
  - key: trous-testcase
    format: fill-in
    question: |-
      Complète la suite de tests :
      ```python
      import unittest

      class TestPanier(unittest.___):
          def test_vide(self):
              self.___(Panier().total(), 0)
      ```
    blanks: [[TestCase], [assertEqual]]
    answer: "La classe hérite de `TestCase`, et `assertEqual` compare les valeurs."
  - key: trous-setup
    format: fill-in
    question: |-
      Complète pour préparer une base neuve avant chaque test :
      ```python
      class TestBase(unittest.TestCase):
          def ___(self):
              self.base = Base(":memory:")
      ```
    blanks: [[setUp]]
    answer: "`setUp`, avec un U majuscule, s'exécute avant chaque méthode de test."
  - key: trous-main
    format: fill-in
    question: |-
      Complète pour lancer les tests quand on exécute le fichier :
      ```python
      if __name__ == "__main__":
          unittest.___()
      ```
    blanks: [[main]]
    answer: "`unittest.main()` découvre les classes `TestCase` du module et les exécute."
  - key: trous-subtest
    format: fill-in
    question: |-
      Complète pour rapporter chaque nombre en échec à part :
      ```python
      for n in [2, 4, 7]:
          with self.___(n=n):
              self.assertEqual(n % 2, 0)
      ```
    blanks: [[subTest]]
    answer: "`subTest` rapporte le cas `n=7` sans arrêter la boucle."
