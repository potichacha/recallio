notion: venv
lesson: |-
  Un **environnement virtuel** est un dossier qui contient un interpréteur Python et **ses propres paquets**,
  isolés de ceux du système et des autres projets. Un projet, un environnement.

  ```bash
  python -m venv .venv                 # créer l'environnement dans le dossier .venv
  source .venv/bin/activate            # l'activer (Linux, macOS)
  pip install requests                 # installé dans .venv, pas dans le système
  deactivate                           # revenir au Python du système
  ```

  | Système | Activer |
  |---|---|
  | Linux, macOS (bash, zsh) | `source .venv/bin/activate` |
  | Windows, PowerShell | `.venv\Scripts\Activate.ps1` |
  | Windows, invite de commandes | `.venv\Scripts\activate.bat` |

  **Ce que fait l'activation** : elle place le dossier `bin` (ou `Scripts`) de l'environnement **en tête du `PATH`**
  de ce terminal, et ajoute son nom à l'invite. Rien de plus : on peut aussi se passer d'activation et appeler
  directement `.venv/bin/python script.py` ou `.venv/bin/pip install ...` (utile dans un script ou une CI).

  **Ce qu'il faut savoir**

  - L'environnement utilise la version de Python qui l'a créé : `python3.14 -m venv .venv` donne un environnement en
    3.14. `venv` ne télécharge aucune version de Python.
  - Le dossier n'est **pas déplaçable** : ses scripts contiennent des chemins absolus. On le recrée plutôt.
  - On ne le **versionne pas** : `.venv/` va dans `.gitignore`, et on versionne la liste des dépendances
    (`requirements.txt`, `pyproject.toml`), à partir de laquelle chacun recrée le sien.
  - Dans un environnement, `sys.prefix` (l'environnement) diffère de `sys.base_prefix` (le Python d'origine).
  - Sur Debian ou Ubuntu, `pip install` dans le Python du système est refusé (« externally-managed-environment »,
    PEP 668) : c'est une invitation à créer un environnement.
  - L'éditeur doit utiliser l'interpréteur de `.venv`, sinon il souligne des imports pourtant installés.

  **En entretien** : « Un environnement virtuel isole les dépendances d'un projet : `python -m venv .venv`, puis on
  l'active, ce qui met son `bin` en tête du `PATH`. On ne le versionne pas : on versionne la liste des dépendances,
  et chacun recrée le sien. Un projet, un environnement, pour éviter les conflits de versions. »
cards:
  - key: creer
    format: course
    question: Quelle commande crée un environnement virtuel dans le dossier `.venv` ?
    choices:
      - {text: "`python -m venv .venv`", correct: true}
      - {text: "`pip install venv .venv`", correct: false}
      - {text: "`python --venv .venv`", correct: false}
      - {text: "`venv activate .venv`", correct: false}
    answer: "Le module `venv` de la bibliothèque standard crée le dossier, avec un interpréteur et pip. `.venv` est le nom le plus courant, reconnu par les éditeurs."
  - key: effet-activation
    format: course
    question: Que fait concrètement l'activation d'un environnement virtuel ?
    choices:
      - {text: "Elle place son dossier `bin` en tête du `PATH` de ce terminal", correct: true}
      - {text: "Elle copie les paquets du système dans l'environnement", correct: false}
      - {text: "Elle installe les dépendances listées dans `requirements.txt`", correct: false}
      - {text: "Elle change le Python par défaut de tout le système", correct: false}
    answer: "Les commandes `python` et `pip` trouvent alors celles de l'environnement en premier. L'effet ne dure que dans ce terminal ; `deactivate` l'annule."
  - key: pourquoi-un-par-projet
    format: course
    question: Pourquoi créer un environnement virtuel par projet ?
    choices:
      - {text: "Chaque projet garde ses versions de paquets, sans conflit", correct: true}
      - {text: "Python s'exécute plus vite dans un environnement isolé", correct: false}
      - {text: "Il donne à chaque projet sa propre version de Python, téléchargée", correct: false}
      - {text: "Un environnement protège le code contre les modifications", correct: false}
    answer: "Deux projets peuvent exiger deux versions d'une même bibliothèque : isolés, ils cohabitent. `venv` réutilise le Python qui l'a créé ; installer d'autres versions de Python est le rôle d'autres outils (pyenv, uv)."
  - key: versionner
    format: course
    question: "Faut-il versionner le dossier `.venv` dans Git ?"
    choices:
      - {text: "Non : on versionne la liste des dépendances, chacun recrée le sien", correct: true}
      - {text: "Oui, pour que les collègues n'aient rien à installer", correct: false}
      - {text: "Oui, mais seulement son dossier `bin` ou `Scripts`", correct: false}
      - {text: "Non, car Git refuse les fichiers binaires", correct: false}
    answer: "L'environnement dépend de la machine (chemins absolus, système, version de Python) et pèse lourd. On ajoute `.venv/` au `.gitignore`. Git stocke très bien des binaires, mais ce n'est pas la question."
  - key: vf-deactivate
    format: true-false
    question: La commande `deactivate` quitte l'environnement virtuel actif.
    truth: true
    answer: "Elle rétablit le `PATH` et l'invite d'avant l'activation. Fermer le terminal a le même effet."
  - key: vf-sans-activer
    format: true-false
    question: "On peut utiliser un environnement sans l'activer, en appelant directement `.venv/bin/python`."
    truth: true
    answer: "L'interpréteur de l'environnement sait où sont ses paquets. C'est la façon habituelle dans un script de déploiement ou une tâche planifiée."
  - key: vf-deplacer
    format: true-false
    question: "On peut déplacer un dossier `.venv` vers un autre chemin sans rien casser."
    truth: false
    answer: "Ses scripts (`activate`, `pip`...) contiennent des chemins absolus. On recrée l'environnement à son nouvel emplacement, à partir de la liste des dépendances."
  - key: vf-telecharge-python
    format: true-false
    question: "`python -m venv .venv` télécharge une nouvelle version de Python pour l'environnement."
    truth: false
    answer: "Il réutilise l'interpréteur qui l'a lancé, par un lien ou une copie. Pour une autre version, on lance `venv` avec cette version, installée par ailleurs."
  - key: qcm-activer-bash
    format: multiple-choice
    question: "Comment actives-tu `.venv` dans un terminal bash, sous Linux ou macOS ?"
    choices:
      - {text: "`source .venv/bin/activate`", correct: true}
      - {text: "`.venv/activate`", correct: false}
      - {text: "`python .venv/bin/activate`", correct: false}
      - {text: "`activate .venv`", correct: false}
    answer: "`source` exécute le script dans le shell courant, pour qu'il puisse modifier son `PATH`. Lancé comme un programme, il n'aurait aucun effet sur le terminal."
  - key: qcm-activer-powershell
    format: multiple-choice
    question: "Comment actives-tu `.venv` dans PowerShell, sous Windows ?"
    choices:
      - {text: '`.venv\Scripts\Activate.ps1`', correct: true}
      - {text: '`.venv\bin\activate`', correct: false}
      - {text: '`source .venv\Scripts\activate`', correct: false}
      - {text: '`python -m venv activate`', correct: false}
    answer: "Sous Windows, le dossier s'appelle `Scripts`, et PowerShell a son propre script, `Activate.ps1`. `source` n'existe pas dans PowerShell."
  - key: qcm-detecter
    format: multiple-choice
    question: Comment vérifier, depuis Python, qu'on s'exécute dans un environnement virtuel ?
    choices:
      - {text: "`sys.prefix != sys.base_prefix`", correct: true}
      - {text: "`os.environ[\"PATH\"] == \".venv\"`", correct: false}
      - {text: "`sys.version.endswith(\"venv\")`", correct: false}
      - {text: "`platform.is_venv()`", correct: false}
    answer: "Dans un environnement, `sys.prefix` désigne le dossier de l'environnement, et `sys.base_prefix` le Python d'origine. Hors environnement, les deux sont égaux."
  - key: qcm-externally-managed
    format: multiple-choice
    question: "Sur Ubuntu, `pip install requests` est refusé avec « externally-managed-environment ». Que fais-tu ?"
    choices:
      - {text: "Créer un environnement virtuel, puis y installer le paquet", correct: true}
      - {text: "Relancer la même commande avec `sudo`", correct: false}
      - {text: "Supprimer le fichier qui protège le Python du système", correct: false}
      - {text: "Copier le paquet à la main dans `/usr/lib/python3`", correct: false}
    answer: "Le Python du système appartient au gestionnaire de paquets de la distribution (PEP 668) : y installer avec pip risque de casser des outils du système. Un environnement virtuel est fait pour ça."
  - key: trous-creer
    format: fill-in
    question: |-
      Complète pour créer l'environnement :
      ```bash
      python ___ venv .venv
      ```
    blanks: [["-m"]]
    answer: "`-m venv` lance le module `venv` de la bibliothèque standard."
  - key: trous-source
    format: fill-in
    question: |-
      Complète pour activer l'environnement dans bash :
      ```bash
      ___ .venv/bin/activate
      ```
    blanks: [[source, "."]]
    answer: "`source` (ou `.`, son équivalent POSIX) exécute le script dans le shell courant."
  - key: trous-deactivate
    format: fill-in
    question: |-
      Complète pour quitter l'environnement actif :
      ```bash
      ___
      ```
    blanks: [[deactivate]]
    answer: "`deactivate` est une fonction définie par le script d'activation."
  - key: trous-dossier-bin
    format: fill-in
    question: |-
      Complète le chemin du script d'activation, sous Linux :
      ```bash
      source .venv/___/activate
      ```
    blanks: [[bin]]
    answer: "`bin` sous Linux et macOS, `Scripts` sous Windows."
  - key: sc-deux-versions-django
    format: scenario
    question: Deux projets sur ta machine demandent l'un Django 4, l'autre Django 5. Que proposes-tu ?
    choices:
      - {text: "Un environnement virtuel par projet, chacun avec sa version", correct: true}
      - {text: "Installer les deux versions dans le Python du système", correct: false}
      - {text: "Garder Django 5, qui fait aussi tourner le code écrit pour Django 4", correct: false}
      - {text: "Désinstaller et réinstaller Django à chaque changement de projet", correct: false}
    answer: "Un même Python ne peut avoir qu'une version d'un paquet. Isolés, les deux projets ont chacun la leur, et la liste de leurs dépendances reste exacte."
  - key: sc-mauvais-python
    format: scenario
    question: "Un collègue installe un paquet, mais son script lève une `ModuleNotFoundError`. `which python` montre `/usr/bin/python`. Que lui dis-tu ?"
    choices:
      - {text: "L'environnement n'est pas activé : active-le, ou lance `.venv/bin/python`", correct: true}
      - {text: "Le paquet est cassé : il faut le réinstaller avec `--force-reinstall`", correct: false}
      - {text: "Il faut redémarrer la machine après chaque installation de paquet", correct: false}
      - {text: "Le script doit importer le paquet avec son numéro de version", correct: false}
    answer: "Le paquet est dans `.venv`, mais le script tourne avec le Python du système. `python -m pip install` installe toujours dans le Python appelé, ce qui évite ce décalage."
  - key: sc-nouveau-venu
    format: scenario
    question: Un nouveau venu clone le dépôt d'un projet qui a un `requirements.txt`. Quelles étapes lui donnes-tu pour le lancer ?
    choices:
      - {text: "Créer `.venv`, l'activer, puis `pip install -r requirements.txt`", correct: true}
      - {text: "Copier le `.venv` d'un collègue, avec tous ses paquets", correct: false}
      - {text: "Installer chaque paquet manquant au fil des erreurs d'import", correct: false}
      - {text: "Installer toutes les dépendances avec `sudo pip`", correct: false}
    answer: "Trois commandes, à documenter dans le README. Copier un environnement casse ses chemins ; installer au fil de l'eau donne des versions au hasard."
  - key: sc-editeur
    format: scenario
    question: "Dans VS Code, l'éditeur souligne `import requests`, pourtant bien installé dans `.venv`. Que fais-tu ?"
    choices:
      - {text: "Choisir l'interpréteur de `.venv` dans l'éditeur", correct: true}
      - {text: "Réinstaller `requests` dans le Python du système", correct: false}
      - {text: "Ajouter `.venv` au `PYTHONPATH` de tous les terminaux", correct: false}
      - {text: "Renommer `.venv` en `venv`, le seul nom reconnu", correct: false}
    answer: "L'éditeur analyse le code avec l'interpréteur qu'on lui a désigné. Celui de `.venv` connaît ses paquets ; la commande « Python: Select Interpreter » le choisit."
