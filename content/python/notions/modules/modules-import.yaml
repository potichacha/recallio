notion: modules-import
lesson: |-
  Un **module** est un fichier `.py`. Tout ce qu'il définit au premier niveau (fonctions, classes, variables) peut
  être importé ailleurs.

  ```python
  import math                          # le module entier : math.sqrt, math.pi
  import datetime as dt                # sous un autre nom : dt.date(2026, 1, 1)
  from math import sqrt, pi            # des noms précis, utilisables sans préfixe
  from collections import Counter as Compteur
  ```

  | Forme | Ce qui est lié dans ton fichier | On écrit ensuite |
  |---|---|---|
  | `import math` | le nom `math` | `math.sqrt(2)` |
  | `import numpy as np` | le nom `np` | `np.array(...)` |
  | `from math import sqrt` | le nom `sqrt` (pas `math`) | `sqrt(2)` |
  | `from math import *` | tous les noms publics | à éviter |

  **Un module ne s'exécute qu'une fois.** Le premier `import` exécute le fichier de haut en bas et range le module
  dans `sys.modules` ; les imports suivants, depuis n'importe quel fichier, reprennent ce même objet. Un module modifié
  sur le disque n'est donc pas relu : il faut `importlib.reload` ou relancer le programme.

  **`from ... import` copie un nom.** Après `from config import seuil`, ton fichier a sa propre variable `seuil` :
  la réaffecter ne change pas `config.seuil`.

  **Un import lie un nom dans la portée où il est écrit.** Écrit dans une fonction, il n'existe que dans cette
  fonction. PEP 8 les place en tête de fichier, en trois groupes séparés par une ligne vide : bibliothèque standard,
  paquets tiers, modules du projet.

  **Les pièges**

  - `import math.sqrt` échoue : `sqrt` est une fonction, pas un module.
  - `from module import *` brouille l'origine des noms et peut en masquer d'autres (un `open` importé cacherait la
    fonction intégrée).
  - Un fichier du projet qui porte le nom d'un module standard (`random.py`, `json.py`) le masque : Python le trouve
    en premier.

  `dir(module)` liste les noms qu'un module définit ; `module.__name__` donne son nom.

  **En entretien** : « Un module est un fichier `.py` ; `import` l'exécute une seule fois et le met en cache dans
  `sys.modules`. `import x` lie le module, `from x import y` lie seulement `y`, une copie du nom. On évite
  `import *`, et on range les imports en tête, bibliothèque standard d'abord. »
tour:
  - title: "Les modules : import, from et as"
    text: |-
      Un module, c'est un simple fichier `.py`. Ici, `geometrie.py` définit une constante et deux fonctions ;
      `main.py` les utilise de trois façons :

      - `import geometrie` donne accès au module entier : on écrit `geometrie.perimetre_cercle(1)` ;
      - `from geometrie import aire_cercle as aire` importe un seul nom, et le renomme ;
      - `import math as m` renomme le module lui-même.

      Le premier import exécute `geometrie.py` de haut en bas, une seule fois : les imports suivants reprennent le
      même module.

      Essaie : remplace `m.sqrt(16)` par `sqrt(16)`, puis ajoute `from math import sqrt` en tête de `main.py`.
    example:
      files:
        main.py: |-
          import math as m

          import geometrie
          from geometrie import aire_cercle as aire

          print(geometrie.PI_ARRONDI)
          print(round(geometrie.perimetre_cercle(1), 3))
          print(round(aire(2), 3))
          print(m.sqrt(16))
        geometrie.py: |-
          import math

          PI_ARRONDI = round(math.pi, 2)


          def aire_cercle(rayon):
              return math.pi * rayon ** 2


          def perimetre_cercle(rayon):
              return 2 * math.pi * rayon
      output: |-
        3.14
        6.283
        12.566
        4.0
    task:
      instructions: |-
        Ajoute à `geometrie.py` une fonction `aire_rectangle(largeur, hauteur)`, puis appelle-la depuis `main.py` pour
        afficher aussi l'aire d'un rectangle de 3 sur 4 :

        ```
        aire du cercle : 3.14
        aire du rectangle : 12
        ```
      starter:
        main.py: |-
          import geometrie

          print("aire du cercle :", round(geometrie.aire_cercle(1), 2))
        geometrie.py: |-
          import math


          def aire_cercle(rayon):
              return math.pi * rayon ** 2
      solution:
        main.py: |-
          import geometrie

          print("aire du cercle :", round(geometrie.aire_cercle(1), 2))
          print("aire du rectangle :", geometrie.aire_rectangle(3, 4))
        geometrie.py: |-
          import math


          def aire_cercle(rayon):
              return math.pi * rayon ** 2


          def aire_rectangle(largeur, hauteur):
              return largeur * hauteur
      output: |-
        aire du cercle : 3.14
        aire du rectangle : 12
cards:
  - key: definition-module
    format: course
    question: Qu'est-ce qu'un module, en Python ?
    choices:
      - {text: "Un fichier `.py`, dont on importe les noms ailleurs", correct: true}
      - {text: "Un dossier qui contient un fichier `__init__.py`", correct: false}
      - {text: "Une classe déclarée avec le mot-clé `module`", correct: false}
      - {text: "Une bibliothèque compilée, installée avec pip", correct: false}
    answer: "Tout fichier `.py` est un module : son nom de fichier, sans l'extension, est le nom qu'on importe. Un dossier de modules avec `__init__.py` est un paquet."
  - key: execute-une-fois
    format: course
    question: Que se passe-t-il quand deux fichiers d'un même programme importent le même module ?
    choices:
      - {text: "Il n'est exécuté qu'une fois ; le second import le reprend du cache", correct: true}
      - {text: "Il est exécuté deux fois, une fois pour chaque import", correct: false}
      - {text: "Le second import lève une `ImportError`, le nom étant déjà pris", correct: false}
      - {text: "Chaque fichier en reçoit une copie indépendante, modifiable à part", correct: false}
    answer: "Le premier import exécute le module et le range dans `sys.modules` ; les suivants renvoient le même objet. Une variable de module est donc partagée par tous ceux qui l'importent."
  - key: eviter-import-etoile
    format: course
    question: "Pourquoi éviter `from module import *` ?"
    choices:
      - {text: "On ne sait plus d'où vient chaque nom, et un nom peut en masquer un autre", correct: true}
      - {text: "C'est nettement plus lent que d'importer les noms un par un", correct: false}
      - {text: "Cette syntaxe est interdite dans les scripts depuis Python 3", correct: false}
      - {text: "Elle importe aussi tous les modules dont dépend le module", correct: false}
    answer: "Le lecteur ne voit plus d'où sort `charger`, et un nom importé peut écraser une fonction intégrée ou un nom défini plus haut. On l'accepte au mieux dans une console interactive."
  - key: ordre-pep8
    format: course
    question: Dans quel ordre PEP 8 range-t-elle les imports, en tête de fichier ?
    choices:
      - {text: "Bibliothèque standard, puis paquets tiers, puis modules du projet", correct: true}
      - {text: "Modules du projet, puis paquets tiers, puis bibliothèque standard", correct: false}
      - {text: "Par ordre alphabétique, sans aucun regroupement", correct: false}
      - {text: "Du module le plus utilisé au module le moins utilisé", correct: false}
    answer: "Trois groupes séparés par une ligne vide, chacun trié. Des outils comme isort ou Ruff le font automatiquement."
  - key: vf-alias-np
    format: true-false
    question: "`import numpy as np` donne au module le nom local `np`."
    truth: true
    answer: "`as` choisit le nom lié dans ton fichier ; le nom `numpy`, lui, n'y est pas défini."
  - key: vf-from-copie
    format: true-false
    question: "Après `from config import seuil`, réaffecter `seuil = 5` change aussi `config.seuil`."
    truth: false
    answer: "`from ... import` crée un nom local qui désigne le même objet au départ. La réaffectation ne touche que ce nom local ; pour modifier le module, il faut écrire `config.seuil = 5`."
  - key: vf-code-premier-niveau
    format: true-false
    question: Le code écrit au premier niveau d'un module, hors des fonctions, s'exécute quand le module est importé pour la première fois.
    truth: true
    answer: "Importer, c'est exécuter le fichier. Un `print` au premier niveau s'affiche donc à l'import : d'où la garde `if __name__ == \"__main__\":`."
  - key: vf-import-dans-fonction
    format: true-false
    question: Un `import` écrit dans une fonction rend le module disponible dans tout le fichier.
    truth: false
    answer: "L'import lie le nom dans la portée où il est écrit : ici, la fonction. Ailleurs, le nom est inconnu."
  - key: qcm-sans-prefixe
    format: multiple-choice
    question: "Quelle ligne permet d'écrire ensuite `sqrt(2)`, sans préfixe ?"
    choices:
      - {text: "`from math import sqrt`", correct: true}
      - {text: "`import math.sqrt`", correct: false}
      - {text: "`import sqrt from math`", correct: false}
      - {text: "`using math.sqrt`", correct: false}
    answer: "`from module import nom` lie `sqrt` directement. `import sqrt from math` est la syntaxe de JavaScript ; `import math.sqrt` échoue, car `sqrt` n'est pas un module."
  - key: qcm-deux-noms
    format: multiple-choice
    question: "Comment importer `date` et `timedelta` du module `datetime`, en une ligne ?"
    choices:
      - {text: "`from datetime import date, timedelta`", correct: true}
      - {text: "`import date, timedelta from datetime`", correct: false}
      - {text: "`from datetime import date and timedelta`", correct: false}
      - {text: "`import datetime.date, datetime.timedelta`", correct: false}
    answer: "Les noms se séparent par des virgules, entre parenthèses s'il y en a beaucoup : `from datetime import (date, timedelta)`."
  - key: qcm-fichier-json
    format: multiple-choice
    question: "Ton script s'appelle `json.py` et commence par `import json`. Que se passe-t-il ?"
    choices:
      - {text: "Il s'importe lui-même au lieu du module standard", correct: true}
      - {text: "Python choisit toujours le module standard en premier", correct: false}
      - {text: "Python refuse de lancer un fichier au nom réservé", correct: false}
      - {text: "Les deux modules sont fusionnés en un seul", correct: false}
    answer: "Le dossier du script passe avant la bibliothèque standard : `import json` trouve ton fichier. `json.dumps` lève alors une `AttributeError`, et Python 3.13+ suggère de renommer le fichier."
  - key: qcm-lister-noms
    format: multiple-choice
    question: Quelle fonction liste les noms définis dans un module importé ?
    choices:
      - {text: "`dir(module)`", correct: true}
      - {text: "`list(module)`", correct: false}
      - {text: "`module.names()`", correct: false}
      - {text: "`help.names(module)`", correct: false}
    answer: "`dir` renvoie la liste triée des attributs, y compris `__name__` ou `__file__`. `help(module)` affiche sa documentation."
  - key: trous-from-import
    format: fill-in
    question: |-
      Complète pour importer seulement la classe `Counter` :
      ```python
      ___ collections ___ Counter
      ```
    blanks: [[from], [import]]
    answer: "`from collections import Counter`."
  - key: trous-as
    format: fill-in
    question: |-
      Complète pour importer pandas sous le nom habituel `pd` :
      ```python
      import pandas ___ pd
      ```
    blanks: [[as]]
    answer: "`as` donne un autre nom au module importé."
  - key: trous-prefixe
    format: fill-in
    question: |-
      Complète pour afficher la constante pi :
      ```python
      import math

      print(___.pi)
      ```
    blanks: [[math]]
    answer: "`import math` lie le nom `math` : on accède à ses attributs par `math.pi`."
  - key: trous-nom-importe
    format: fill-in
    question: |-
      Complète pour que la dernière ligne fonctionne :
      ```python
      from os.path import ___

      print(join("dossier", "fichier.txt"))
      ```
    blanks: [[join]]
    answer: "`from os.path import join` lie le nom `join`, utilisable sans préfixe."
  - key: code-import-as
    format: code-output
    question: |-
      ```python
      import math as m

      print(m.floor(2.7), m.ceil(2.1))
      ```
    answer: "`2 3` : `floor` arrondit vers le bas, `ceil` vers le haut ; `m` est le module `math` sous un autre nom."
    check:
      output: "2 3"
    choices:
      - {text: "`2 3`", correct: true}
      - {text: "`3 2`", correct: false}
      - {text: "`2.0 3.0`", correct: false}
      - {text: "Une `NameError` : `math` n'est pas défini", correct: false}
  - key: code-from-copie
    format: code-output
    question: |-
      ```python
      import math
      from math import pi

      pi = 3
      print(pi, round(math.pi, 2))
      ```
    answer: "`3 3.14` : `pi` est un nom local, copié depuis le module ; le réaffecter ne change pas `math.pi`."
    check:
      output: "3 3.14"
    choices:
      - {text: "`3 3.14`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`3.14 3.14`", correct: false}
      - {text: "Une `AttributeError` : `pi` est en lecture seule", correct: false}
  - key: code-sys-modules
    format: code-output
    question: |-
      ```python
      import sys
      import json
      import json as j

      print(j is json, "json" in sys.modules)
      ```
    answer: "`True True` : le module est chargé une fois, gardé dans `sys.modules`, et chaque import renvoie le même objet."
    check:
      output: "True True"
    choices:
      - {text: "`True True`", correct: true}
      - {text: "`False True`", correct: false}
      - {text: "`True False`", correct: false}
      - {text: "`False False`", correct: false}
  - key: code-type-module
    format: code-output
    question: |-
      ```python
      import math

      print(type(math).__name__, math.__name__)
      ```
    answer: "`module math` : un module importé est un objet de type `module`, et `__name__` donne son nom."
    check:
      output: module math
    choices:
      - {text: "`module math`", correct: true}
      - {text: "`math math`", correct: false}
      - {text: "`file math.py`", correct: false}
      - {text: "`module __main__`", correct: false}
  - key: bug-from-puis-prefixe
    format: bug-fix
    question: |-
      Ce script s'arrête sur « NameError: name 'math' is not defined. Did you forget to import 'math'? » :
      ```python
      from math import sqrt

      print(math.sqrt(16))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(sqrt(16))`", correct: true}
      - {text: "`print(math(sqrt(16)))`", correct: false}
      - {text: "`print(from_math.sqrt(16))`", correct: false}
      - {text: "`print(sqrt.math(16))`", correct: false}
    answer: |-
      ```python
      from math import sqrt

      print(sqrt(16))
      ```
      `from math import sqrt` lie seulement le nom `sqrt`, pas `math`. L'autre correction possible : `import math`, puis
      `math.sqrt(16)`.
  - key: bug-import-fonction
    format: bug-fix
    question: |-
      Ce script s'arrête sur « ModuleNotFoundError: No module named 'math.sqrt'; 'math' is not a package » :
      ```python
      import math.sqrt

      print(math.sqrt(16))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`import math`", correct: true}
      - {text: "`import math.sqrt as sqrt`", correct: false}
      - {text: "`import sqrt from math`", correct: false}
      - {text: "`import math.*`", correct: false}
    answer: |-
      ```python
      import math

      print(math.sqrt(16))
      ```
      `import a.b` attend un sous-module `b` d'un paquet `a`. `sqrt` est une fonction : on importe le module, ou
      `from math import sqrt`.
  - key: bug-alias-oublie
    format: bug-fix
    question: |-
      Ce script s'arrête sur une `NameError` :
      ```python
      import datetime as dt

      print(datetime.date(2026, 1, 1))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(dt.date(2026, 1, 1))`", correct: true}
      - {text: "`print(dt.datetime.date(2026, 1, 1))`", correct: false}
      - {text: "`print(datetime.dt.date(2026, 1, 1))`", correct: false}
      - {text: "`print(date(2026, 1, 1))`", correct: false}
    answer: |-
      ```python
      import datetime as dt

      print(dt.date(2026, 1, 1))
      ```
      Avec `as dt`, seul le nom `dt` est lié : `datetime` n'existe pas dans le fichier. `date` seul demanderait
      `from datetime import date`.
  - key: bug-import-local
    format: bug-fix
    question: |-
      Ce script s'arrête sur « NameError: name 'json' is not defined. Did you forget to import 'json'? » :
      ```python
      def charger():
          import json
          return json.loads("[1, 2]")

      print(charger(), json.dumps([3]))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `import json` en tête du fichier", correct: true}
      - {text: "Appeler `charger()` deux fois avant `json.dumps`", correct: false}
      - {text: "Écrire `global json` avant l'import dans `charger`", correct: false}
      - {text: "Remplacer `json.dumps` par `charger.json.dumps`", correct: false}
    answer: |-
      ```python
      import json


      def charger():
          return json.loads("[1, 2]")


      print(charger(), json.dumps([3]))
      ```
      Un import lie le nom dans sa portée : ici, la fonction. `global json` marcherait, mais c'est un détour : la place
      d'un import est en tête du fichier.
