notion: pip-dependances
lesson: |-
  **pip** installe des paquets depuis PyPI, l'index public des paquets Python, dans l'environnement actif.

  ```bash
  python -m pip install requests              # la dernière version
  python -m pip install "requests==2.32.3"    # une version exacte
  python -m pip install --upgrade requests    # mettre à jour
  python -m pip uninstall requests
  python -m pip list                          # les paquets installés
  python -m pip show requests                 # version, dépendances, emplacement
  ```

  `python -m pip` garantit que le paquet va dans le Python que tu appelles ; `pip` seul peut appartenir à un autre.

  **`requirements.txt`** liste les dépendances, une par ligne :

  ```
  requests==2.32.3
  flask>=3.0,<4
  rich~=13.7
  ```

  | Contrainte | Sens |
  |---|---|
  | `==2.32.3` | exactement cette version (épinglée) |
  | `>=3.0,<4` | au moins 3.0, mais avant 4 |
  | `~=13.7` | version compatible : `>=13.7` et `==13.*` |

  ```bash
  python -m pip install -r requirements.txt   # tout installer
  python -m pip freeze > requirements.txt     # figer ce qui est installé
  ```

  **Épingler, et pourquoi** : sans versions exactes, deux installations à un mois d'écart peuvent donner des versions
  différentes, et un projet qui marchait casse. Une **application** épingle donc **toutes** ses dépendances, y compris
  les indirectes (celles de ses dépendances). `pip freeze` liste tout ce qui est installé : à lancer dans un
  environnement propre au projet.

  **Séparer le choix et le verrouillage** : un fichier `requirements.in` liste ce que tu choisis (`requests`), et
  pip-tools (`pip-compile`) produit le `requirements.txt` complet et épinglé, éventuellement avec des empreintes
  (`--generate-hashes`). Les outils modernes (uv, Poetry) font de même avec leur fichier verrouillé.

  **Une bibliothèque**, elle, déclare des bornes **larges** (`requests>=2.28`) : épinglée trop strictement, elle
  entrerait en conflit avec les autres paquets de ceux qui l'installent.

  `pip uninstall` ne retire pas les dépendances indirectes ; `pip-audit` signale les versions qui ont une faille
  connue.

  **En entretien** : « pip installe depuis PyPI dans l'environnement actif ; j'appelle `python -m pip` pour être sûr
  du Python visé. Une application épingle toutes ses dépendances, indirectes comprises, dans un fichier verrouillé
  (pip-tools, uv) ; une bibliothèque garde des bornes larges. `pip freeze` se lance dans un environnement propre. »
cards:
  - key: version-exacte
    format: course
    question: Quelle commande installe exactement la version 2.32.3 de `requests` ?
    choices:
      - {text: "`pip install requests==2.32.3`", correct: true}
      - {text: "`pip install requests@2.32.3`", correct: false}
      - {text: "`pip install requests:2.32.3`", correct: false}
      - {text: "`pip install requests -v 2.32.3`", correct: false}
    answer: "`==` épingle la version. `@` est la syntaxe de npm ; avec pip, `-v` augmente la verbosité."
  - key: produit-freeze
    format: course
    question: "Que produit `pip freeze` ?"
    choices:
      - {text: "La liste des paquets installés, avec leur version exacte", correct: true}
      - {text: "Le fichier `requirements.txt` du projet, mis à jour sur place", correct: false}
      - {text: "Une archive des paquets installés, pour les copier ailleurs", correct: false}
      - {text: "Les dépendances déclarées dans le `pyproject.toml` du projet", correct: false}
    answer: "Il écrit sur la sortie standard des lignes `nom==version`, qu'on redirige vers un fichier : `pip freeze > requirements.txt`. Il liste tout l'environnement, dépendances indirectes comprises."
  - key: pourquoi-epingler
    format: course
    question: "Pourquoi une application épingle-t-elle ses dépendances avec `==` ?"
    choices:
      - {text: "Pour installer partout les mêmes versions, sans surprise", correct: true}
      - {text: "Pour que pip télécharge les paquets plus vite", correct: false}
      - {text: "Pour empêcher les autres de modifier le fichier", correct: false}
      - {text: "Parce que pip refuse une ligne sans `==`", correct: false}
    answer: "Sans épinglage, une nouvelle version sortie entre deux installations peut tout casser, en CI ou en production. Avec, l'installation est reproductible."
  - key: python-m-pip
    format: course
    question: "Pourquoi préférer `python -m pip install` à `pip install` ?"
    choices:
      - {text: "Le paquet va à coup sûr dans le Python que tu appelles", correct: true}
      - {text: "Cette forme télécharge depuis un miroir plus rapide", correct: false}
      - {text: "`pip` seul ne sait pas lire un fichier `requirements.txt`", correct: false}
      - {text: "Cette forme installe aussi les stubs de types du paquet", correct: false}
    answer: "Avec plusieurs Python sur la machine, la commande `pip` peut appartenir à un autre que `python`. `python -m pip` lève l'ambiguïté."
  - key: vf-option-r
    format: true-false
    question: "`pip install -r requirements.txt` installe chaque paquet listé dans le fichier."
    truth: true
    answer: "`-r` lit un fichier d'exigences, avec ses contraintes de version. Il peut même en inclure un autre, avec une ligne `-r base.txt`."
  - key: vf-compatible
    format: true-false
    question: "La contrainte `requests~=2.32` accepte la version `2.33`, mais pas `3.0`."
    truth: true
    answer: "`~=2.32` signifie `>=2.32` et `==2.*` : les versions mineures suivantes, pas la majeure. `~=2.32.0` se limiterait à `2.32.*`."
  - key: vf-freeze-directes
    format: true-false
    question: "`pip freeze` ne liste que les paquets que tu as installés toi-même, pas leurs dépendances."
    truth: false
    answer: "Il liste tout l'environnement, dépendances indirectes comprises, sans distinguer ce que tu as choisi. D'où pip-tools, qui sépare `requirements.in` et `requirements.txt`."
  - key: vf-uninstall-deps
    format: true-false
    question: "`pip uninstall requests` désinstalle aussi les dépendances que `requests` avait installées."
    truth: false
    answer: "pip ne retire que le paquet nommé : `urllib3` ou `idna` restent. Recréer l'environnement à partir de la liste est le moyen le plus propre de nettoyer."
  - key: qcm-show
    format: multiple-choice
    question: Quelle commande affiche la version installée d'un paquet et ses dépendances ?
    choices:
      - {text: "`pip show requests`", correct: true}
      - {text: "`pip info requests`", correct: false}
      - {text: "`pip version requests`", correct: false}
      - {text: "`pip freeze requests`", correct: false}
    answer: "`pip show` donne la version, l'emplacement, les dépendances (`Requires`) et les paquets qui en dépendent (`Required-by`)."
  - key: qcm-bornes
    format: multiple-choice
    question: "Quelle contrainte accepte une version de `flask` au moins égale à 3.0, mais inférieure à 4 ?"
    choices:
      - {text: "`flask>=3.0,<4`", correct: true}
      - {text: "`flask>3.0<4`", correct: false}
      - {text: "`flask=3.0..4`", correct: false}
      - {text: "`flask^3.0`", correct: false}
    answer: "Les contraintes se séparent par des virgules. `^3.0` est la syntaxe de Poetry ou de npm, pas celle de pip."
  - key: qcm-upgrade
    format: multiple-choice
    question: "Quelle commande met `requests` à jour vers sa dernière version ?"
    choices:
      - {text: "`pip install --upgrade requests`", correct: true}
      - {text: "`pip update requests`", correct: false}
      - {text: "`pip install requests --latest`", correct: false}
      - {text: "`pip refresh requests`", correct: false}
    answer: "`--upgrade` (ou `-U`) installe la version la plus récente compatible. Il n'y a pas de commande `pip update`."
  - key: qcm-pip-tools
    format: multiple-choice
    question: Comment séparer les dépendances que tu choisis de la liste complète et épinglée ?
    choices:
      - {text: "Un `requirements.in`, compilé en `requirements.txt` par pip-tools", correct: true}
      - {text: "Deux sections `[direct]` et `[locked]` dans `requirements.txt`", correct: false}
      - {text: "Un fichier `requirements.txt` différent pour chaque dépendance", correct: false}
      - {text: "La commande `pip freeze --direct`, qui trie les deux listes", correct: false}
    answer: "`pip-compile` résout `requirements.in` et écrit chaque version, indirectes comprises, en notant d'où elles viennent. Mettre à jour devient une décision explicite."
  - key: trous-option-r
    format: fill-in
    question: |-
      Complète pour installer les dépendances listées dans le fichier :
      ```bash
      pip install ___ requirements.txt
      ```
    blanks: [["-r"]]
    answer: "`-r` (ou `--requirement`) lit un fichier d'exigences."
  - key: trous-freeze
    format: fill-in
    question: |-
      Complète pour figer les versions installées dans un fichier :
      ```bash
      pip ___ > requirements.txt
      ```
    blanks: [[freeze]]
    answer: "`pip freeze` écrit `nom==version` pour chaque paquet installé."
  - key: trous-egal-egal
    format: fill-in
    question: |-
      Complète la ligne de `requirements.txt` qui épingle `requests` en version 2.32.3 :
      ```
      requests___2.32.3
      ```
    blanks: [["=="]]
    answer: "`==` : exactement cette version."
  - key: trous-uninstall
    format: fill-in
    question: |-
      Complète pour retirer le paquet :
      ```bash
      pip ___ requests
      ```
    blanks: [[uninstall]]
    answer: "`pip uninstall` ne retire que ce paquet, pas ses dépendances."
  - key: sc-nouvelle-version-casse
    format: scenario
    question: "Le projet marche chez toi, mais plante chez un collègue après son `pip install -r requirements.txt` : une bibliothèque vient de sortir une version incompatible. Que fais-tu ?"
    choices:
      - {text: "Épingler des versions exactes, idéalement dans un fichier verrouillé", correct: true}
      - {text: "Demander au collègue d'installer les paquets un par un", correct: false}
      - {text: "Supprimer `requirements.txt` et laisser pip choisir les versions", correct: false}
      - {text: "Réinstaller Python chez le collègue, dans la même version", correct: false}
    answer: "Ton environnement avait l'ancienne version, le sien la nouvelle. Un fichier verrouillé (pip-tools, uv) donne à tous les mêmes versions ; on met à jour ensuite, volontairement, tests à l'appui."
  - key: sc-bibliotheque-publiee
    format: scenario
    question: "Tu publies une bibliothèque sur PyPI. Épingles-tu ses dépendances avec `==` ?"
    choices:
      - {text: "Non : des bornes larges, sinon elle entre en conflit avec d'autres paquets", correct: true}
      - {text: "Oui, comme pour une application, pour garantir sa stabilité", correct: false}
      - {text: "Oui : pip choisira de toute façon la version la plus récente", correct: false}
      - {text: "Non : une bibliothèque publiée ne doit avoir aucune dépendance", correct: false}
    answer: "Si ta bibliothèque exige `requests==2.31.0` et une autre `requests>=2.32`, personne ne peut installer les deux. Ce sont les applications qui épinglent l'ensemble."
  - key: sc-faille-indirecte
    format: scenario
    question: "Un audit signale une faille dans la version d'`urllib3` que ton projet utilise indirectement, à travers `requests`. Que fais-tu ?"
    choices:
      - {text: "Monter `urllib3` à une version corrigée dans le fichier verrouillé, puis tester", correct: true}
      - {text: "Rien : seules les dépendances directes peuvent poser un problème", correct: false}
      - {text: "Retirer `urllib3` du fichier : pip le réinstallera tout seul", correct: false}
      - {text: "Ajouter `urllib3` au `.gitignore` du projet", correct: false}
    answer: "Une dépendance indirecte s'exécute dans ton application comme les autres. Avec pip-tools : `pip-compile --upgrade-package urllib3`. `pip-audit` repère ces failles en CI."
  - key: sc-freeze-systeme
    format: scenario
    question: "Un collègue génère `requirements.txt` avec `pip freeze` dans le Python du système, qui contient cent paquets sans rapport avec le projet. Que lui conseilles-tu ?"
    choices:
      - {text: "Figer depuis un environnement virtuel propre au projet", correct: true}
      - {text: "Garder la liste : des paquets en trop ne coûtent rien", correct: false}
      - {text: "Remplacer tous les `==` par `>=`, pour alléger la liste", correct: false}
      - {text: "Trier la liste par ordre alphabétique avant de la versionner", correct: false}
    answer: "`pip freeze` copie l'environnement tel qu'il est. Dans un environnement dédié, il ne contient que le projet ; mieux encore, un `requirements.in` dit ce qui est vraiment choisi."
