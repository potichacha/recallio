notion: main-guard
lesson: |-
  Chaque module a une variable `__name__`. Elle vaut :

  - `"__main__"` dans le fichier **lancé** (`python rapport.py`, ou `python -m paquet.rapport`) ;
  - le **nom du module** (`"rapport"`) quand il est **importé**.

  D'où l'idiome qui permet à un fichier d'être à la fois un module réutilisable et un script :

  ```python
  # rapport.py
  import sys


  def generer(chemin: str) -> str:
      ...


  def main() -> int:
      print(generer(sys.argv[1]))
      return 0


  if __name__ == "__main__":
      sys.exit(main())
  ```

  - `python rapport.py notes.csv` exécute `main()`.
  - `import rapport`, depuis un autre module ou un test, donne accès à `generer` **sans rien lancer**.

  **Pourquoi c'est utile**

  - Les tests importent les fonctions d'un script sans déclencher le programme.
  - Un module peut garder une petite démonstration ou un mode « ligne de commande ».
  - Rien n'est appelé automatiquement : Python ne cherche aucune fonction `main`, c'est une simple convention.

  `sys.exit(main())` transmet au système le code de sortie renvoyé par `main` (0 pour un succès).

  **Pour un paquet**, un fichier `__main__.py` est exécuté par `python -m paquet` : c'est ainsi que fonctionnent
  `python -m venv`, `python -m pip` ou `python -m json`.

  **Les pièges** : écrire `"main"` au lieu de `"__main__"` (le bloc ne s'exécute jamais), oublier les parenthèses de
  `main()`, ou placer la garde avant la définition de `main`.

  **En entretien** : « `__name__` vaut `"__main__"` dans le fichier lancé, et le nom du module quand il est importé.
  La garde `if __name__ == "__main__":` n'exécute le programme que si le fichier est lancé : on peut l'importer, dans un
  test par exemple, sans effet de bord. Par convention, elle appelle une fonction `main`. »
tour:
  - title: "if __name__ == \"__main__\""
    text: |-
      Chaque module a une variable `__name__`. Dans le fichier lancé, ici `main.py`, elle vaut `"__main__"` ; dans un
      module importé, elle vaut son nom, ici `"outils"`.

      La garde `if __name__ == "__main__":` n'exécute son bloc que si le fichier est lancé directement. `outils.py`
      peut ainsi servir de script, tout en restant importable : à l'import, seul son `print` de premier niveau
      s'exécute.

      Essaie : retire la garde de `outils.py`, en désindentant les deux lignes de son bloc. Elles s'exécutent alors
      dès l'import.
    example:
      files:
        main.py: |-
          import outils


          def main():
              print("main.py : __name__ =", __name__)
              print(outils.crier("bonjour"))


          if __name__ == "__main__":
              main()
        outils.py: |-
          def crier(texte):
              return texte.upper() + " !"


          print("outils.py : __name__ =", __name__)

          if __name__ == "__main__":
              print("outils.py est lancé comme script")
              print(crier("essai"))
      output: |-
        outils.py : __name__ = outils
        main.py : __name__ = __main__
        BONJOUR !
cards:
  - key: name-script-lance
    format: course
    question: "Que vaut `__name__` dans le fichier lancé par `python app.py` ?"
    choices:
      - {text: "`\"__main__\"`", correct: true}
      - {text: "`\"app\"`", correct: false}
      - {text: "`\"app.py\"`", correct: false}
      - {text: "`None`", correct: false}
    answer: "Le fichier lancé est le module principal : son `__name__` vaut `\"__main__\"`, quel que soit le nom du fichier."
  - key: name-module-importe
    format: course
    question: "Que vaut `__name__` dans `outils.py`, quand un autre fichier fait `import outils` ?"
    choices:
      - {text: "`\"outils\"`", correct: true}
      - {text: "`\"__main__\"`", correct: false}
      - {text: "`\"outils.py\"`", correct: false}
      - {text: "`\"__outils__\"`", correct: false}
    answer: "Un module importé a pour `__name__` son nom d'import, sans extension ; dans un paquet, le nom complet, comme `\"app.outils\"`."
  - key: role-garde
    format: course
    question: "À quoi sert `if __name__ == \"__main__\":` ?"
    choices:
      - {text: "À n'exécuter du code que si le fichier est lancé, pas importé", correct: true}
      - {text: "À déclarer la fonction principale, comme `main` en Java", correct: false}
      - {text: "À empêcher les autres fichiers d'importer ce module", correct: false}
      - {text: "À lancer le fichier plus vite, sans le compiler", correct: false}
    answer: "Le bloc s'exécute quand le fichier est le programme principal, et pas quand il est importé. Rien n'oblige à l'écrire, et Python n'appelle aucune fonction `main` de lui-même."
  - key: python-m
    format: course
    question: "Que fait `python -m paquet.outil` ?"
    choices:
      - {text: "Il lance ce module comme un script, trouvé par les imports", correct: true}
      - {text: "Il installe le module `outil` depuis PyPI", correct: false}
      - {text: "Il importe le module sans exécuter son code", correct: false}
      - {text: "Il compile le module en bytecode, sans le lancer", correct: false}
    answer: "Python cherche le module comme pour un import, puis l'exécute avec `__name__` à `\"__main__\"`. Les imports relatifs du module fonctionnent alors, ce qui n'est pas le cas avec `python paquet/outil.py`."
  - key: vf-main-automatique
    format: true-false
    question: Python appelle automatiquement une fonction nommée `main` au lancement d'un script.
    truth: false
    answer: "Python exécute le fichier de haut en bas, rien de plus. `main` est une convention, qu'on appelle soi-même sous la garde."
  - key: vf-import-hors-garde
    format: true-false
    question: "Importer un module exécute tout son code de premier niveau, sauf ce qui est sous `if __name__ == \"__main__\":`."
    truth: true
    answer: "À l'import, la condition est fausse, puisque `__name__` vaut le nom du module. Le reste du fichier s'exécute normalement."
  - key: vf-dunder-main-paquet
    format: true-false
    question: "Un fichier `__main__.py` placé dans un paquet est exécuté par `python -m paquet`."
    truth: true
    answer: "C'est ce qui permet `python -m venv`, `python -m pip` ou `python -m http.server`."
  - key: vf-name-chemin
    format: true-false
    question: "Dans un module importé, `__name__` contient le chemin complet du fichier, comme `/home/ada/outils.py`."
    truth: false
    answer: "`__name__` vaut le nom d'import (`\"outils\"`) ; le chemin est dans `__file__`."
  - key: qcm-idiome
    format: multiple-choice
    question: Quelle forme est l'idiome habituel ?
    choices:
      - {text: "`if __name__ == \"__main__\":`", correct: true}
      - {text: "`if __main__:`", correct: false}
      - {text: "`if __name__ is \"main\":`", correct: false}
      - {text: "`if name == \"main\":`", correct: false}
    answer: "Deux soulignés de chaque côté, dans le nom de la variable comme dans la chaîne, et `==` pour comparer des chaînes."
  - key: qcm-code-sortie
    format: multiple-choice
    question: "Comment transmettre au système le code de sortie renvoyé par `main()` ?"
    choices:
      - {text: "`sys.exit(main())`", correct: true}
      - {text: "`return main()`", correct: false}
      - {text: "`exit = main()`", correct: false}
      - {text: "`print(main())`", correct: false}
    answer: "`sys.exit(code)` termine le programme avec ce code : 0 pour un succès. Un `return` hors d'une fonction est une erreur de syntaxe."
  - key: qcm-import-script
    format: multiple-choice
    question: "`convertir.py` contient des fonctions, et un bloc sous la garde qui lit les arguments. Qu'obtient-on avec `import convertir` ?"
    choices:
      - {text: "Les fonctions, sans que le bloc sous la garde s'exécute", correct: true}
      - {text: "Les fonctions, puis l'exécution du bloc sous la garde", correct: false}
      - {text: "Une erreur : un fichier qui a une garde ne s'importe pas", correct: false}
      - {text: "Rien : seul le bloc sous la garde est chargé à l'import", correct: false}
    answer: "À l'import, `__name__` vaut `\"convertir\"` : la condition est fausse, le bloc est sauté, et les fonctions sont disponibles."
  - key: qcm-tests
    format: multiple-choice
    question: Pourquoi la garde aide-t-elle à tester un script ?
    choices:
      - {text: "Les tests importent ses fonctions sans lancer le programme", correct: true}
      - {text: "Elle désactive les appels à `print` pendant les tests", correct: false}
      - {text: "pytest exige une fonction `main` dans chaque fichier", correct: false}
      - {text: "Elle exécute automatiquement les tests du fichier", correct: false}
    answer: "Sans garde, `import script` lancerait tout le programme : lecture des arguments, accès aux fichiers... Avec elle, le test appelle seulement les fonctions qu'il vérifie."
  - key: trous-variable-name
    format: fill-in
    question: |-
      Complète la garde :
      ```python
      if ___ == "__main__":
          main()
      ```
    blanks: [[__name__]]
    answer: "`__name__`, avec deux soulignés de chaque côté."
  - key: trous-chaine-main
    format: fill-in
    question: |-
      Complète la chaîne de la garde :
      ```python
      if __name__ == "___":
          main()
      ```
    blanks: [[__main__]]
    answer: "`\"__main__\"` : le nom du module principal."
  - key: trous-sys-exit
    format: fill-in
    question: |-
      Complète pour transmettre le code de sortie de `main` :
      ```python
      if __name__ == "__main__":
          sys.___(main())
      ```
    blanks: [[exit]]
    answer: "`sys.exit(main())` : 0 pour un succès, un autre entier pour un échec."
  - key: trous-appel-main
    format: fill-in
    question: |-
      Complète pour lancer le programme :
      ```python
      def main():
          print("Démarrage")


      if __name__ == "__main__":
          ___
      ```
    blanks: [["main()"]]
    answer: "`main()`, avec ses parenthèses : `main` seul ne ferait que nommer la fonction."
  - key: code-ordre-execution
    format: code-output
    question: |-
      ```python
      print("A", end=" ")


      def main():
          print("B", end=" ")


      if __name__ == "__main__":
          main()
      print("C")
      ```
    answer: "`A B C` : le fichier est lancé, donc la garde est vraie ; le code de premier niveau s'exécute dans l'ordre."
    check:
      output: A B C
    choices:
      - {text: "`A B C`", correct: true}
      - {text: "`A C`", correct: false}
      - {text: "`B A C`", correct: false}
      - {text: "`A C B`", correct: false}
  - key: code-deux-noms
    format: code-output
    question: |-
      ```python
      import json

      print(__name__, json.__name__)
      ```
    answer: "`__main__ json` : le fichier lancé s'appelle `__main__`, un module importé garde son nom."
    check:
      output: __main__ json
    choices:
      - {text: "`__main__ json`", correct: true}
      - {text: "`main json`", correct: false}
      - {text: "`__main__ __main__`", correct: false}
      - {text: "`main.py json.py`", correct: false}
  - key: code-garde-mal-ecrite
    format: code-output
    question: |-
      ```python
      def main():
          print("traitement")


      print("début")
      if __name__ == "main":
          main()
      ```
    answer: "`début` seulement : `__name__` vaut `\"__main__\"`, jamais `\"main\"`, donc `main()` n'est pas appelée."
    check:
      output: début
    choices:
      - {text: "`début`", correct: true}
      - text: |-
          ```
          début
          traitement
          ```
        correct: false
      - {text: "`traitement`", correct: false}
      - {text: "Rien", correct: false}
  - key: code-sys-exit-arrete
    format: code-output
    question: |-
      ```python
      import sys


      def main() -> int:
          print("traitement")
          return 0


      if __name__ == "__main__":
          sys.exit(main())
          print("après")
      ```
    answer: "`traitement` : `sys.exit` termine le programme, la ligne suivante ne s'exécute jamais. Le code de sortie vaut 0, celui renvoyé par `main`."
    check:
      output: traitement
    choices:
      - {text: "`traitement`", correct: true}
      - text: |-
          ```
          traitement
          après
          ```
        correct: false
      - text: |-
          ```
          traitement
          0
          ```
        correct: false
      - {text: "Rien", correct: false}
  - key: bug-chaine-sans-soulignes
    format: bug-fix
    question: |-
      Lancé avec `python rapport.py`, ce script n'affiche rien :
      ```python
      def main():
          print("Rapport généré")


      if __name__ == "main":
          main()
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if __name__ == \"__main__\":`", correct: true}
      - {text: "`if __name__ == \"rapport\":`", correct: false}
      - {text: "`if __name__ is \"main\":`", correct: false}
      - {text: "`if \"main\" in __name__:`", correct: false}
    answer: |-
      ```python
      if __name__ == "__main__":
          main()
      ```
      Le fichier lancé a pour nom `"__main__"`. `"rapport"` est le nom qu'il aurait s'il était importé, et
      `"main" in "__main__"` serait vrai aussi à l'import d'un module nommé `main`.
  - key: bug-name-sans-soulignes
    format: bug-fix
    question: |-
      Ce script s'arrête sur une `NameError` :
      ```python
      def main():
          print("Démarrage")


      if name == "__main__":
          main()
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if __name__ == \"__main__\":`", correct: true}
      - {text: "`if self.name == \"__main__\":`", correct: false}
      - {text: "`if sys.name == \"__main__\":`", correct: false}
      - {text: "`if main.name == \"__main__\":`", correct: false}
    answer: |-
      ```python
      if __name__ == "__main__":
          main()
      ```
      La variable s'appelle `__name__`, avec deux soulignés de chaque côté ; `name` n'existe pas.
  - key: bug-appel-sans-parentheses
    format: bug-fix
    question: |-
      Lancé directement, ce script n'affiche rien :
      ```python
      def main():
          print("Démarrage")


      if __name__ == "__main__":
          main
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler la fonction : `main()`", correct: true}
      - {text: "Écrire `return main` sous la garde", correct: false}
      - {text: "Écrire `import main` sous la garde", correct: false}
      - {text: "Renommer la fonction en `__main__`", correct: false}
    answer: |-
      ```python
      if __name__ == "__main__":
          main()
      ```
      `main` seul est une expression qui désigne la fonction, sans l'appeler : elle ne fait rien.
  - key: bug-garde-avant-def
    format: bug-fix
    question: |-
      Ce script s'arrête sur « NameError: name 'main' is not defined. Did you mean: 'min'? » :
      ```python
      if __name__ == "__main__":
          main()


      def main():
          print("Démarrage")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Placer la garde à la fin du fichier, après `def main`", correct: true}
      - {text: "Écrire `global main` juste avant la garde", correct: false}
      - {text: "Remplacer `main()` par `__main__()` sous la garde", correct: false}
      - {text: "Ajouter `import main` en tête du fichier", correct: false}
    answer: |-
      ```python
      def main():
          print("Démarrage")


      if __name__ == "__main__":
          main()
      ```
      Le fichier s'exécute de haut en bas : `def main` n'a pas encore créé la fonction quand la garde l'appelle.
