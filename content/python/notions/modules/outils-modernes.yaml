notion: outils-modernes
lesson: |-
  pip et `venv` suffisent, mais laissent beaucoup à faire à la main : créer l'environnement, figer les versions,
  les tenir à jour. Les **gestionnaires de projet** s'en chargent, autour de `pyproject.toml` et d'un **fichier
  verrouillé**.

  **uv** (Astral, écrit en Rust) : très rapide, il remplace pip, venv, pip-tools et pipx, et sait même installer
  Python.

  ```bash
  uv init facture              # crée le projet et son pyproject.toml
  uv add requests              # ajoute la dépendance, met à jour uv.lock et l'environnement
  uv add --dev pytest          # une dépendance de développement
  uv sync                      # aligne .venv sur uv.lock
  uv run pytest                # lance une commande dans l'environnement du projet
  uv python install 3.14       # installe une version de Python
  uvx ruff check               # lance un outil dans un environnement jetable
  uv pip install -r requirements.txt   # l'interface de pip, en plus rapide
  ```

  **Poetry** : plus ancien, très répandu.

  ```bash
  poetry new facture
  poetry add requests          # met à jour pyproject.toml et poetry.lock
  poetry install               # installe selon poetry.lock
  poetry run pytest
  ```

  | Besoin | pip seul | uv | Poetry |
  |---|---|---|---|
  | dépendances choisies | `requirements.in` | `pyproject.toml` | `pyproject.toml` |
  | versions figées | pip-tools | `uv.lock` | `poetry.lock` |
  | environnement | `python -m venv` | automatique | automatique |
  | outils en ligne de commande | pipx | `uv tool`, `uvx` | (pipx) |

  **Le fichier verrouillé** fige **toutes** les versions, indirectes comprises, avec leurs empreintes. Pour une
  application, on le **versionne** : CI et production installent exactement la même chose. On ne l'édite jamais à la
  main : on le régénère avec l'outil (après un conflit de fusion aussi).

  **pipx** et `uv tool` installent un outil (ruff, black, httpie) dans son propre environnement, disponible partout,
  sans l'ajouter aux dépendances d'un projet. D'autres outils existent (PDM, Hatch) ; tous lisent `pyproject.toml`.

  **En entretien** : « Sur un projet neuf, je prends uv (ou Poetry) : les dépendances dans `pyproject.toml`, un
  fichier verrouillé versionné, l'environnement géré pour moi, et `uv run` pour lancer les commandes. uv est très
  rapide, ce qui compte en CI. Le fichier verrouillé ne s'édite pas à la main. »
cards:
  - key: c-est-quoi-uv
    format: course
    question: Qu'est-ce que uv ?
    choices:
      - {text: "Un gestionnaire de projets et de paquets Python, écrit en Rust", correct: true}
      - {text: "Un nouvel interpréteur Python, plus rapide que CPython", correct: false}
      - {text: "Un serveur web asynchrone pour les applications Python", correct: false}
      - {text: "Un format d'archive qui remplace les wheels sur PyPI", correct: false}
    answer: "uv, d'Astral, remplace pip, venv, pip-tools et pipx en un seul outil, bien plus rapide. Le serveur web, c'est uvicorn."
  - key: contenu-lock
    format: course
    question: "Que contient un fichier `uv.lock` ou `poetry.lock` ?"
    choices:
      - {text: "Les versions exactes de toutes les dépendances, indirectes comprises", correct: true}
      - {text: "Les dépendances choisies par l'équipe, avec des bornes larges", correct: false}
      - {text: "Un verrou qui empêche deux installations en même temps", correct: false}
      - {text: "Les identifiants des dépôts de paquets privés de l'équipe", correct: false}
    answer: "Le fichier verrouillé fige le résultat de la résolution, avec les empreintes des fichiers : chaque installation est identique. Les bornes larges sont dans `pyproject.toml`."
  - key: uv-run
    format: course
    question: "Que fait `uv run pytest` ?"
    choices:
      - {text: "Il lance pytest dans l'environnement du projet, synchronisé au besoin", correct: true}
      - {text: "Il installe pytest dans le Python du système, puis le lance", correct: false}
      - {text: "Il lance pytest dans un conteneur Docker créé pour l'occasion", correct: false}
      - {text: "Il convertit les tests du projet au format attendu par uv", correct: false}
    answer: "uv vérifie que `.venv` correspond à `uv.lock`, le met à jour si besoin, puis lance la commande dedans. Plus besoin d'activer l'environnement."
  - key: pipx-uvx
    format: course
    question: "À quoi servent `pipx` et `uvx` ?"
    choices:
      - {text: "À lancer des outils en ligne de commande, chacun dans son environnement", correct: true}
      - {text: "À installer des paquets dans le Python du système, sans environnement", correct: false}
      - {text: "À compiler des modules Python en exécutables autonomes", correct: false}
      - {text: "À publier un paquet sur PyPI, avec ses métadonnées", correct: false}
    answer: "Un outil comme ruff ou httpie n'a rien à faire dans les dépendances d'un projet : pipx ou `uv tool` l'isolent, et le rendent disponible partout."
  - key: vf-uv-installe-python
    format: true-false
    question: "uv peut installer lui-même une version de Python, avec `uv python install 3.14`."
    truth: true
    answer: "uv télécharge des builds autonomes de CPython, et choisit la bonne version pour chaque projet d'après `requires-python` ou un fichier `.python-version`."
  - key: vf-pyproject-commun
    format: true-false
    question: "Poetry et uv décrivent le projet dans `pyproject.toml`."
    truth: true
    answer: "Les deux y rangent métadonnées et dépendances ; chacun a son propre fichier verrouillé (`poetry.lock`, `uv.lock`)."
  - key: vf-lock-hors-git
    format: true-false
    question: "Le fichier verrouillé d'une application (`uv.lock`) doit rester hors du dépôt Git."
    truth: false
    answer: "On le versionne : c'est lui qui garantit que la CI, les collègues et la production installent les mêmes versions."
  - key: vf-uv-requirements
    format: true-false
    question: "uv ne sait pas lire un fichier `requirements.txt`."
    truth: false
    answer: "`uv pip install -r requirements.txt` reprend l'interface de pip, en plus rapide. C'est un moyen simple d'adopter uv sur un projet existant."
  - key: qcm-uv-add
    format: multiple-choice
    question: "Quelle commande ajoute `httpx` aux dépendances d'un projet géré par uv ?"
    choices:
      - {text: "`uv add httpx`", correct: true}
      - {text: "`uv install httpx`", correct: false}
      - {text: "`uv require httpx`", correct: false}
      - {text: "`uv get httpx`", correct: false}
    answer: "`uv add` modifie `pyproject.toml`, met à jour `uv.lock`, puis l'environnement. `uv remove` fait l'inverse."
  - key: qcm-poetry-add
    format: multiple-choice
    question: "Quelle commande ajoute `httpx` aux dépendances d'un projet géré par Poetry ?"
    choices:
      - {text: "`poetry add httpx`", correct: true}
      - {text: "`poetry install httpx`", correct: false}
      - {text: "`poetry require httpx`", correct: false}
      - {text: "`poetry lock httpx`", correct: false}
    answer: "`poetry add` met à jour `pyproject.toml` et `poetry.lock`. `poetry install`, sans argument, installe ce que dit le fichier verrouillé."
  - key: qcm-uv-sync
    format: multiple-choice
    question: "Que fait `uv sync` ?"
    choices:
      - {text: "Il aligne l'environnement du projet sur le fichier verrouillé", correct: true}
      - {text: "Il publie la dernière version du projet sur PyPI", correct: false}
      - {text: "Il met toutes les dépendances à leur dernière version", correct: false}
      - {text: "Il synchronise le dépôt Git local avec le serveur", correct: false}
    answer: "Il installe ce qui manque et retire ce qui est en trop : `.venv` correspond exactement à `uv.lock`. Monter les versions, c'est `uv lock --upgrade`."
  - key: qcm-avantage
    format: multiple-choice
    question: "Quel avantage décisif ces outils apportent-ils face à pip et un `requirements.txt` écrit à la main ?"
    choices:
      - {text: "Un fichier verrouillé, généré et tenu à jour par l'outil", correct: true}
      - {text: "Ils sont les seuls à savoir télécharger depuis PyPI", correct: false}
      - {text: "Ils compilent le code Python pour l'accélérer", correct: false}
      - {text: "Ils rendent les dépendances indirectes inutiles", correct: false}
    answer: "Le choix des dépendances et leur verrouillage sont séparés et automatiques ; l'environnement suit. Avec pip seul, il faut pip-tools pour en arriver là."
  - key: sc-nouveau-projet
    format: scenario
    question: "Tu démarres un nouveau projet d'équipe. Comment gères-tu ses dépendances et son environnement ?"
    choices:
      - {text: "Avec uv ou Poetry : `pyproject.toml` et un fichier verrouillé versionné", correct: true}
      - {text: "Avec pip et un `requirements.txt` écrit à la main, sans versions", correct: false}
      - {text: "Chacun installe ce qu'il lui faut dans le Python de son système", correct: false}
      - {text: "Avec un `setup.py` qui installe les dépendances au premier import", correct: false}
    answer: "Un outil de projet donne à tous le même environnement en une commande (`uv sync`), et rend les mises à jour explicites. Sans versions, chaque installation est une loterie."
  - key: sc-ci-lente
    format: scenario
    question: Ta CI passe trois minutes à installer les dépendances avec pip. Que proposes-tu ?
    choices:
      - {text: "Passer à uv, avec un cache des paquets : l'installation devient bien plus rapide", correct: true}
      - {text: "Supprimer les tests qui ont besoin de dépendances tierces", correct: false}
      - {text: "Installer les paquets un par un, dans des étapes séparées", correct: false}
      - {text: "Retirer les versions épinglées pour laisser pip choisir plus vite", correct: false}
    answer: "uv résout et installe en parallèle, et réutilise son cache entre deux exécutions. Retirer l'épinglage rendrait la CI moins fiable, pas plus rapide."
  - key: sc-outil-global
    format: scenario
    question: "Tu veux utiliser ruff dans tous tes projets, sans l'ajouter à leurs dépendances. Que fais-tu ?"
    choices:
      - {text: "L'installer avec `uv tool install` ou pipx, dans son propre environnement", correct: true}
      - {text: "L'installer avec `sudo pip install ruff` dans le Python du système", correct: false}
      - {text: "L'ajouter au `requirements.txt` de chacun de tes projets", correct: false}
      - {text: "Copier son exécutable dans le dossier de chaque projet", correct: false}
    answer: "L'outil est isolé, disponible partout, et se met à jour indépendamment. Pour l'équipe, l'ajouter comme dépendance de développement d'un projet garde la même version pour tous."
  - key: sc-conflit-lock
    format: scenario
    question: "Deux pull requests modifient `uv.lock`, et Git signale un conflit à la fusion. Que fais-tu ?"
    choices:
      - {text: "Résoudre `pyproject.toml`, puis régénérer le verrou avec `uv lock`", correct: true}
      - {text: "Garder l'une des deux versions du fichier, au hasard", correct: false}
      - {text: "Supprimer `uv.lock` du dépôt pour éviter les conflits", correct: false}
      - {text: "Corriger à la main les lignes en conflit du fichier", correct: false}
    answer: "Le fichier verrouillé est un résultat calculé : on fusionne la source (`pyproject.toml`), et l'outil recalcule une résolution cohérente."
