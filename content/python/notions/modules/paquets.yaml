notion: paquets
lesson: |-
  Un **paquet** (*package*) est un dossier de modules. Il en regroupe plusieurs sous un même nom, et peut contenir
  des sous-paquets.

  ```
  boutique/
  ├── __init__.py
  ├── panier.py
  ├── commandes.py
  └── paiement/
      ├── __init__.py
      └── carte.py
  ```

  **Importer depuis un paquet**

  ```python
  import boutique.panier                  # on écrit boutique.panier.Panier
  from boutique import panier             # on écrit panier.Panier
  from boutique.panier import Panier      # on écrit Panier
  from boutique.paiement.carte import payer
  ```

  `import boutique` seul n'importe **pas** les sous-modules : `boutique.panier` n'existe qu'une fois importé.

  **`__init__.py`** s'exécute au premier import du paquet (ou de l'un de ses modules). Vide, il marque simplement le
  dossier comme paquet ; il peut aussi **réexporter** des noms pour simplifier les imports :

  ```python
  # boutique/__init__.py
  from .panier import Panier
  __all__ = ["Panier"]                    # ce qu'importe « from boutique import * »
  ```

  Sans `__init__.py`, le dossier reste importable comme **paquet d'espace de noms** (PEP 420), une forme pensée pour
  répartir un paquet sur plusieurs dossiers. Pour un paquet ordinaire, on garde `__init__.py`.

  **Imports relatifs**, à l'intérieur d'un paquet seulement :

  ```python
  # boutique/commandes.py
  from .panier import Panier              # module voisin
  from . import panier                    # le module lui-même

  # boutique/paiement/carte.py
  from ..panier import Panier             # remonte d'un niveau de paquet
  ```

  Un import relatif suppose que Python connaît le paquet du module. Un fichier lancé directement
  (`python boutique/commandes.py`) n'en a pas : « ImportError: attempted relative import with no known parent
  package ». On lance un module d'un paquet avec `python -m boutique.commandes`, depuis le dossier parent.

  PEP 8 préfère les imports **absolus**, plus lisibles ; les relatifs restent acceptables dans un paquet. Beaucoup de
  projets rangent leur paquet sous `src/` (`src/boutique/`) : les tests importent ainsi le paquet installé, et non le
  dossier courant par accident.

  Attention au double sens : sur PyPI, un « paquet » est aussi une **distribution** qu'on installe avec pip.

  **En entretien** : « Un paquet est un dossier de modules avec un `__init__.py`, exécuté au premier import et qui
  peut réexporter des noms. Dans un paquet, `from .module import x` est un import relatif ; il échoue si on lance le
  fichier directement, d'où `python -m paquet.module`. On préfère les imports absolus. »
cards:
  - key: definition-paquet
    format: course
    question: Qu'est-ce qu'un paquet (*package*) Python, au sens des imports ?
    choices:
      - {text: "Un dossier de modules, en général avec un fichier `__init__.py`", correct: true}
      - {text: "Un fichier `.py` qui regroupe plusieurs classes", correct: false}
      - {text: "Un module compilé en C, importé comme les autres", correct: false}
      - {text: "Un module dont le nom commence par une majuscule", correct: false}
    answer: "Un paquet regroupe des modules (et des sous-paquets) sous un nom : `boutique.panier`. Sur PyPI, « paquet » désigne aussi une distribution installable, qui contient en général un ou plusieurs paquets."
  - key: quand-init-s-execute
    format: course
    question: "Quand le code de `__init__.py` s'exécute-t-il ?"
    choices:
      - {text: "Au premier import du paquet ou de l'un de ses modules", correct: true}
      - {text: "À chaque appel d'une fonction définie dans le paquet", correct: false}
      - {text: "À l'installation du paquet avec pip, une seule fois", correct: false}
      - {text: "Jamais : ce fichier ne sert que de marqueur, vide", correct: false}
    answer: "`import boutique.panier` exécute d'abord `boutique/__init__.py`, puis `panier.py`. Comme tout module, il ne s'exécute qu'une fois par programme."
  - key: point-relatif
    format: course
    question: "Dans `boutique/commandes.py`, que désigne `from . import panier` ?"
    choices:
      - {text: "Le module `panier` du même paquet, `boutique`", correct: true}
      - {text: "Un module `panier` du dossier courant du terminal", correct: false}
      - {text: "Le module `panier` de la bibliothèque standard", correct: false}
      - {text: "Le paquet parent de `boutique`, nommé `panier`", correct: false}
    answer: "Le point désigne le paquet du module courant ; deux points, son parent. C'est indépendant du dossier où l'on lance Python."
  - key: sans-init
    format: course
    question: "Que se passe-t-il si un dossier de modules n'a pas de `__init__.py` ?"
    choices:
      - {text: "Il reste importable, comme paquet d'espace de noms (PEP 420)", correct: true}
      - {text: "Python refuse de l'importer et lève une `ImportError`", correct: false}
      - {text: "Il est importé, mais tous ses modules sont ignorés", correct: false}
      - {text: "Python crée le fichier `__init__.py` au premier import", correct: false}
    answer: "Depuis Python 3.3, un dossier sans `__init__.py` est un paquet d'espace de noms, prévu pour répartir un paquet sur plusieurs dossiers. Certains outils le gèrent mal : pour un paquet ordinaire, on garde `__init__.py`."
  - key: vf-relatif-script
    format: true-false
    question: "Un import relatif (`from . import outils`) fonctionne dans un fichier lancé avec `python fichier.py`."
    truth: false
    answer: "Lancé directement, le fichier n'appartient à aucun paquet : « attempted relative import with no known parent package ». On le lance avec `python -m paquet.fichier`."
  - key: vf-deux-points
    format: true-false
    question: "`from ..modele import Client` remonte d'un niveau de paquet avant de chercher `modele`."
    truth: true
    answer: "Un point : le paquet courant ; deux points : son parent. Remonter au-delà du paquet de premier niveau lève « attempted relative import beyond top-level package »."
  - key: vf-sous-modules-auto
    format: true-false
    question: "`import app` importe automatiquement tous les modules du paquet `app`."
    truth: false
    answer: "Seul `app/__init__.py` s'exécute. `app.outils` n'existe qu'après `import app.outils`, ou si `__init__.py` l'importe lui-même."
  - key: vf-reexport
    format: true-false
    question: "Si `app/__init__.py` contient `from .client import Client`, on peut écrire `from app import Client` ailleurs."
    truth: true
    answer: "Le nom `Client` devient un attribut du paquet. C'est la façon habituelle d'offrir une API simple sans exposer la structure des fichiers."
  - key: qcm-lancer-module
    format: multiple-choice
    question: "Comment lancer le module `app/main.py`, qui fait des imports relatifs ?"
    choices:
      - {text: "`python -m app.main`, depuis le dossier parent de `app`", correct: true}
      - {text: "`python app/main.py`, depuis le dossier parent de `app`", correct: false}
      - {text: "`python -m app/main.py`, depuis le dossier parent", correct: false}
      - {text: "`cd app`, puis `python main.py`", correct: false}
    answer: "`-m` prend un nom de module, avec des points, et l'exécute dans son paquet. Avec un chemin de fichier, Python ne connaît pas le paquet, et les imports relatifs échouent."
  - key: qcm-forme-recommandee
    format: multiple-choice
    question: Quelle forme d'import PEP 8 recommande-t-elle d'abord ?
    choices:
      - {text: "L'import absolu : `from boutique.panier import Panier`", correct: true}
      - {text: "L'import relatif : `from .panier import Panier`", correct: false}
      - {text: "L'étoile : `from boutique.panier import *`", correct: false}
      - {text: "Le chemin complet : `import boutique.panier.Panier`", correct: false}
    answer: "Les imports absolus disent clairement d'où vient chaque nom. Les relatifs sont tolérés dans un paquet ; `import boutique.panier.Panier` échoue, car `Panier` n'est pas un module."
  - key: qcm-dunder-all
    format: multiple-choice
    question: "Que contrôle la liste `__all__` d'un module ou d'un paquet ?"
    choices:
      - {text: "Les noms importés par `from module import *`", correct: true}
      - {text: "Les modules que pip installe avec le paquet", correct: false}
      - {text: "Les noms privés, cachés aux autres modules", correct: false}
      - {text: "L'ordre d'exécution des modules du paquet", correct: false}
    answer: "`__all__` liste l'API publique pour `import *`, et documente ce qui est public. Elle n'empêche pas d'importer un nom explicitement."
  - key: qcm-dossier-src
    format: multiple-choice
    question: "Pourquoi beaucoup de projets rangent-ils leur paquet sous `src/` ?"
    choices:
      - {text: "Pour que les tests importent le paquet installé, pas le dossier courant", correct: true}
      - {text: "Parce que Python ne trouve les paquets que dans un dossier `src/`", correct: false}
      - {text: "Pour que pip compile le paquet plus vite à l'installation", correct: false}
      - {text: "Pour cacher le code source aux utilisateurs du paquet", correct: false}
    answer: "Avec le dossier `src/`, la racine du projet ne contient plus le paquet : `import boutique` dans un test trouve la version installée (souvent avec `pip install -e .`), ce qui révèle un oubli dans l'empaquetage."
  - key: trous-fichier-init
    format: fill-in
    question: |-
      Complète le nom du fichier qui fait de `boutique` un paquet ordinaire :
      ```
      boutique/
          ___.py
          panier.py
      ```
    blanks: [[__init__]]
    answer: "`__init__.py`, exécuté au premier import du paquet."
  - key: trous-point-voisin
    format: fill-in
    question: |-
      Dans `boutique/commandes.py`, complète l'import relatif du module voisin `panier` :
      ```python
      from ___ import panier
      ```
    blanks: [["."]]
    answer: "Un point : le paquet du module courant."
  - key: trous-option-m
    format: fill-in
    question: |-
      Complète pour lancer le module `main` du paquet `app` :
      ```bash
      python ___ app.main
      ```
    blanks: [["-m"]]
    answer: "`python -m app.main` exécute le module dans son paquet."
  - key: trous-deux-points
    format: fill-in
    question: |-
      Dans `boutique/paiement/carte.py`, complète pour importer `charger` du module `boutique/config.py` :
      ```python
      from ___config import charger
      ```
    blanks: [[".."]]
    answer: "Deux points remontent au paquet parent, `boutique`."
  - key: bug-relatif-lance-directement
    format: bug-fix
    question: |-
      `python app/main.py`, lancé depuis le dossier qui contient `app/`, s'arrête sur « ImportError: attempted relative
      import with no known parent package » :
      ```
      app/
      ├── __init__.py
      ├── outils.py
      └── main.py
      ```
      ```python
      # app/main.py
      from .outils import nettoyer

      print(nettoyer("  ok  "))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Lancer `python -m app.main`, depuis le même dossier", correct: true}
      - {text: "Écrire `from ..outils import nettoyer`, avec deux points", correct: false}
      - {text: "Supprimer le fichier `app/__init__.py`", correct: false}
      - {text: "Lancer `python -m app/main.py`, avec le chemin", correct: false}
    answer: |-
      ```bash
      python -m app.main
      ```
      Lancé par son chemin, `main.py` n'appartient à aucun paquet : le point ne désigne rien. Avec `-m`, Python
      l'exécute comme le module `app.main`, et `.outils` désigne `app.outils`.
  - key: bug-sous-module-non-importe
    format: bug-fix
    question: |-
      `python main.py` s'arrête sur « AttributeError: module 'app' has no attribute 'outils' » ; `app/__init__.py`
      est vide :
      ```
      app/
      ├── __init__.py
      └── outils.py
      main.py
      ```
      ```python
      # main.py
      import app

      print(app.outils.nettoyer("  ok  "))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`import app.outils`", correct: true}
      - {text: "`from app import *`", correct: false}
      - {text: "`import app, outils`", correct: false}
      - {text: "`import app.outils.nettoyer`", correct: false}
    answer: |-
      ```python
      import app.outils

      print(app.outils.nettoyer("  ok  "))
      ```
      `import app` n'exécute que `__init__.py` : le sous-module n'est pas chargé. `import app.outils` le charge, et
      lie toujours le nom `app`.
  - key: bug-nom-non-reexporte
    format: bug-fix
    question: |-
      `python main.py` s'arrête sur « ImportError: cannot import name 'nettoyer' from 'app' » ; `nettoyer` est
      définie dans `app/outils.py`, et `app/__init__.py` est vide :
      ```python
      # main.py
      from app import nettoyer

      print(nettoyer("  ok  "))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`from app.outils import nettoyer`", correct: true}
      - {text: "`from app import outils.nettoyer`", correct: false}
      - {text: "`import app.nettoyer`", correct: false}
      - {text: "`from app import *`", correct: false}
    answer: |-
      ```python
      from app.outils import nettoyer
      ```
      `nettoyer` est un nom du module `app.outils`, pas du paquet. Pour permettre `from app import nettoyer`, il
      faudrait le réexporter dans `app/__init__.py` : `from .outils import nettoyer`.
  - key: bug-au-dela-du-paquet
    format: bug-fix
    question: |-
      `python main.py` s'arrête sur « ImportError: attempted relative import beyond top-level package » :
      ```
      config.py
      main.py
      app/
      ├── __init__.py
      └── prix.py
      ```
      ```python
      # app/prix.py
      from .. import config


      def ttc(ht):
          return ht * (1 + config.TAUX)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`import config`, un import absolu", correct: true}
      - {text: "`from ... import config`, avec trois points", correct: false}
      - {text: "`from .config import TAUX`, un seul point", correct: false}
      - {text: "`from ..config import *`, avec l'étoile", correct: false}
    answer: |-
      ```python
      import config
      ```
      `config.py` n'est dans aucun paquet : `app` est le paquet de premier niveau, et `..` sortirait de lui. Le dossier
      de `main.py` est dans `sys.path`, donc l'import absolu trouve `config`.
