notion: pyproject
lesson: |-
  `pyproject.toml` est **le** fichier de description d'un projet Python moderne : ses métadonnées, ses dépendances,
  la façon de le construire, et la configuration des outils. Il remplace `setup.py`, `setup.cfg` et bien des fichiers
  de configuration.

  ```
  [build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"

  [project]
  name = "facture"
  version = "1.2.0"
  description = "Génère des factures en PDF"
  requires-python = ">=3.12"
  dependencies = [
      "requests>=2.32",
      "jinja2>=3.1",
  ]

  [project.optional-dependencies]
  pdf = ["weasyprint>=62"]

  [project.scripts]
  facture = "facture.cli:main"

  [tool.pytest.ini_options]
  testpaths = ["tests"]

  [tool.ruff]
  line-length = 100
  ```

  | Table | Rôle |
  |---|---|
  | `[build-system]` | l'outil qui construit le paquet (setuptools, hatchling, flit-core, uv_build...) |
  | `[project]` | les métadonnées standard (PEP 621) : nom, version, dépendances, version de Python |
  | `[project.optional-dependencies]` | des extras, installés avec `pip install "facture[pdf]"` |
  | `[project.scripts]` | des commandes créées à l'installation : `facture` appelle `facture.cli:main` |
  | `[dependency-groups]` | des groupes pour le développement (tests, lint), standardisés par la PEP 735 |
  | `[tool.<nom>]` | la configuration d'un outil : pytest, mypy, ruff, coverage... |

  **Les commandes**

  ```bash
  pip install .            # installer le projet
  pip install -e .         # en mode éditable : les modifications sont prises en compte sans réinstaller
  python -m build          # construire une archive source (sdist) et une wheel dans dist/
  ```

  **Bornes, pas verrou** : `dependencies` déclare des contraintes, pas des versions figées. Pour une application, le
  verrouillage vient d'un fichier dédié (`uv.lock`, `poetry.lock`, ou un `requirements.txt` compilé).

  `requires-python` empêche d'installer le projet avec une version de Python trop ancienne.

  **En entretien** : « `pyproject.toml` décrit le projet : `[build-system]` pour l'outil de construction, `[project]`
  pour les métadonnées standard et les dépendances, `[tool.*]` pour la configuration des outils. On l'installe avec
  `pip install -e .` pendant le développement, on le construit avec `python -m build`. Les versions exactes vont
  dans un fichier verrouillé à part. »
cards:
  - key: role
    format: course
    question: "À quoi sert le fichier `pyproject.toml` ?"
    choices:
      - {text: "À décrire le projet : métadonnées, dépendances, construction, outils", correct: true}
      - {text: "À lister les versions exactes de toutes les dépendances installées", correct: false}
      - {text: "À configurer l'interpréteur Python pour le dossier du projet", correct: false}
      - {text: "À remplacer les fichiers `__init__.py` des paquets", correct: false}
    answer: "C'est le point d'entrée standard (PEP 518, 621) : pip, les outils de construction et les outils de développement le lisent. Les versions exactes vont dans un fichier verrouillé."
  - key: build-system
    format: course
    question: "Que déclare la table `[build-system]` ?"
    choices:
      - {text: "L'outil qui construit le paquet, comme setuptools ou hatchling", correct: true}
      - {text: "La version minimale de Python demandée par le projet", correct: false}
      - {text: "Les commandes que la CI lance à chaque pull request", correct: false}
      - {text: "Les dépendances de l'application en production", correct: false}
    answer: "`requires` liste ce qu'il faut pour construire, `build-backend` désigne l'outil. pip l'installe dans un environnement temporaire pour construire la wheel."
  - key: project-scripts
    format: course
    question: "Que crée `[project.scripts]` avec la ligne `rapport = \"outils.cli:main\"` ?"
    choices:
      - {text: "Une commande `rapport`, qui appelle `main()` du module `outils.cli`", correct: true}
      - {text: "Un test nommé `rapport`, lancé par pytest avec les autres", correct: false}
      - {text: "Une tâche planifiée, qui appelle `main` une fois par jour", correct: false}
      - {text: "Un module `rapport.py`, généré à côté de `outils/cli.py`", correct: false}
    answer: "À l'installation, pip crée un petit exécutable `rapport` dans le `bin` de l'environnement. La valeur de retour de `main` devient le code de sortie."
  - key: table-tool
    format: course
    question: "Où un outil comme pytest ou ruff lit-il sa configuration dans `pyproject.toml` ?"
    choices:
      - {text: "Dans sa table `[tool.<nom>]`, comme `[tool.ruff]`", correct: true}
      - {text: "Dans la table `[project.tools]`, sous son nom", correct: false}
      - {text: "Dans la liste `dependencies` du projet", correct: false}
      - {text: "Dans `[build-system]`, après le backend", correct: false}
    answer: "La PEP 518 réserve l'espace `[tool]` aux outils. pytest utilise `[tool.pytest.ini_options]`, mypy `[tool.mypy]`, coverage `[tool.coverage.run]`."
  - key: vf-requires-python
    format: true-false
    question: "`requires-python = \">=3.12\"` empêche pip d'installer le projet avec Python 3.11."
    truth: true
    answer: "pip vérifie cette contrainte et refuse l'installation, ou choisit une version plus ancienne du paquet qui accepte 3.11."
  - key: vf-dependencies-verrou
    format: true-false
    question: "La liste `dependencies` de `[project]` donne les mêmes garanties qu'un fichier verrouillé aux versions exactes."
    truth: false
    answer: "Elle déclare des contraintes, souvent larges, et ne dit rien des dépendances indirectes. Un fichier verrouillé fige toutes les versions."
  - key: vf-pep621
    format: true-false
    question: "La table `[project]` est standardisée par la PEP 621, et lue par tous les outils de construction modernes."
    truth: true
    answer: "setuptools, hatchling, flit, PDM, uv et Poetry 2 la comprennent : changer d'outil de construction ne demande pas de réécrire les métadonnées."
  - key: vf-setup-py
    format: true-false
    question: "Un projet doit encore avoir un fichier `setup.py` pour être installé avec pip."
    truth: false
    answer: "Un `pyproject.toml` suffit. `setup.py` reste possible avec setuptools, pour une construction qui demande du code."
  - key: qcm-editable
    format: multiple-choice
    question: Quelle commande installe ton projet de sorte que tes modifications soient prises en compte sans réinstaller ?
    choices:
      - {text: "`pip install -e .`", correct: true}
      - {text: "`pip install --dev .`", correct: false}
      - {text: "`python -m build -e`", correct: false}
      - {text: "`pip install pyproject.toml`", correct: false}
    answer: "Le mode éditable fait pointer l'environnement vers ton dossier de sources. On l'utilise pendant le développement, notamment pour que les tests importent le paquet."
  - key: qcm-extras
    format: multiple-choice
    question: "Comment déclarer des dépendances facultatives, installées avec `pip install \"facture[pdf]\"` ?"
    choices:
      - {text: "Dans `[project.optional-dependencies]`, sous la clé `pdf`", correct: true}
      - {text: "Dans une table `[project.dependencies.pdf]`", correct: false}
      - {text: "Dans un fichier `requirements-pdf.txt` lu par pip", correct: false}
      - {text: "Dans `[build-system]`, sous une clé `extras`", correct: false}
    answer: "Chaque clé de `optional-dependencies` est un extra : `pdf = [\"weasyprint>=62\"]`. On installe alors le projet et ses dépendances PDF en une commande."
  - key: qcm-build
    format: multiple-choice
    question: "Que produit `python -m build` ?"
    choices:
      - {text: "Une archive source (sdist) et une wheel, dans `dist/`", correct: true}
      - {text: "Un exécutable autonome, dans un dossier `bin/`", correct: false}
      - {text: "Le bytecode du projet, dans `__pycache__/`", correct: false}
      - {text: "Un fichier verrouillé de toutes les dépendances", correct: false}
    answer: "La wheel (`.whl`) s'installe sans rien compiler ; la sdist (`.tar.gz`) contient les sources. On les publie sur PyPI avec twine ou `uv publish`."
  - key: qcm-format-fichier
    format: multiple-choice
    question: "Dans quel format s'écrit `pyproject.toml` ?"
    choices:
      - {text: "TOML", correct: true}
      - {text: "YAML", correct: false}
      - {text: "INI", correct: false}
      - {text: "JSON", correct: false}
    answer: "TOML : des tables entre crochets, des paires `clé = valeur`, des chaînes entre guillemets. Python le lit avec `tomllib` (3.11), en lecture seule."
  - key: trous-table-project
    format: fill-in
    question: |-
      Complète le nom de la table des métadonnées :
      ```
      [___]
      name = "facture"
      version = "1.0.0"
      ```
    blanks: [[project]]
    answer: "`[project]`, la table standard de la PEP 621."
  - key: trous-dependencies
    format: fill-in
    question: |-
      Complète la clé qui liste les dépendances du projet :
      ```
      [project]
      name = "facture"
      ___ = ["requests>=2.32"]
      ```
    blanks: [[dependencies]]
    answer: "`dependencies` : une liste de contraintes au format de pip."
  - key: trous-build-backend
    format: fill-in
    question: |-
      Complète la clé qui désigne l'outil de construction :
      ```
      [build-system]
      requires = ["hatchling"]
      ___ = "hatchling.build"
      ```
    blanks: [[build-backend]]
    answer: "`build-backend` : le module que pip appelle pour construire la wheel."
  - key: trous-requires-python
    format: fill-in
    question: |-
      Complète la clé qui exige Python 3.12 ou plus :
      ```
      [project]
      name = "facture"
      ___ = ">=3.12"
      ```
    blanks: [[requires-python]]
    answer: "`requires-python`, vérifié par pip à l'installation."
