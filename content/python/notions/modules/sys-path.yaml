notion: sys-path
lesson: |-
  Pour `import outils`, Python procède dans cet ordre :

  1. **Le cache** : si `"outils"` est dans `sys.modules`, il renvoie ce module, sans rien relire.
  2. **La recherche** : sinon, il parcourt les dossiers de la liste `sys.path`, dans l'ordre, et prend le premier
     `outils.py` (ou paquet `outils/`) trouvé. Il l'exécute, puis le range dans `sys.modules`.
  3. Rien trouvé : `ModuleNotFoundError: No module named 'outils'`.

  **Le contenu de `sys.path`**, dans l'ordre :

  | Entrée | Exemple |
  |---|---|
  | le dossier du script lancé (ou le dossier courant avec `-m` et `-c`) | `/home/ada/projet/outils` pour `python outils/rapport.py` |
  | les dossiers de la variable `PYTHONPATH` | `/opt/libs` |
  | la bibliothèque standard | `/usr/lib/python3.14` |
  | `site-packages`, où pip installe | `.venv/lib/python3.14/site-packages` |

  ```bash
  python -c "import sys; print(sys.path)"
  ```

  **Conséquences**

  - Le dossier du script passe **avant** la bibliothèque standard : un fichier `statistics.py` dans ton projet masque
    le module standard. Python 3.13+ le signale (« consider renaming ... since it has the same name as the standard
    library module »). L'option `python -P` n'ajoute pas ce dossier.
  - `python outils/rapport.py` met `outils/` en tête, pas la racine du projet : `import outils.format` échoue.
    `python -m outils.rapport`, lancé depuis la racine, met la racine.
  - Un second `import` ne relit pas un fichier modifié. Dans un notebook ou une console, on recharge avec
    `importlib.reload(module)`.
  - `module.__file__` dit d'où un module a été chargé : précieux quand le mauvais est importé.

  **Modifier `sys.path` à la main** (`sys.path.append(...)`) dépanne, mais rend le code fragile. La bonne solution est
  d'**installer** le projet dans son environnement, au besoin en mode éditable (`pip install -e .`), ou de lancer avec
  `-m` depuis la racine.

  **En entretien** : « Python regarde d'abord le cache `sys.modules`, puis parcourt `sys.path` : le dossier du script,
  `PYTHONPATH`, la bibliothèque standard, puis `site-packages`. Un fichier local peut donc masquer un module standard.
  Plutôt que de bricoler `sys.path`, on installe le projet, en mode éditable pendant le développement. »
cards:
  - key: premier-endroit
    format: course
    question: Où Python regarde-t-il en tout premier quand il exécute `import outils` ?
    choices:
      - {text: "Dans `sys.modules`, le cache des modules déjà chargés", correct: true}
      - {text: "Dans le dossier `site-packages` de l'environnement", correct: false}
      - {text: "Dans les dossiers de la variable `PYTHONPATH`", correct: false}
      - {text: "Dans le dossier courant du terminal", correct: false}
    answer: "Un module déjà importé est repris tel quel du cache. Sinon seulement, Python parcourt `sys.path`, dont le dossier du script est la première entrée."
  - key: premiere-entree
    format: course
    question: "Que contient la première entrée de `sys.path` quand on lance `python outils/rapport.py` ?"
    choices:
      - {text: "Le dossier du script : `outils`", correct: true}
      - {text: "Le dossier courant du terminal", correct: false}
      - {text: "Le dossier de la bibliothèque standard", correct: false}
      - {text: "Le dossier `site-packages`", correct: false}
    answer: "Python ajoute le dossier du script lancé, en chemin absolu. Avec `python -m` ou `python -c`, c'est le dossier courant qui est ajouté."
  - key: attribut-file
    format: course
    question: De quel fichier un module importé a-t-il été chargé ? Où le lire ?
    choices:
      - {text: "Dans son attribut `__file__`", correct: true}
      - {text: "Dans `sys.path[module]`", correct: false}
      - {text: "Dans son attribut `__path__`", correct: false}
      - {text: "Dans `os.getcwd()`", correct: false}
    answer: "`print(outils.__file__)` montre le chemin réel. `__path__` n'existe que pour un paquet : c'est la liste des dossiers où chercher ses sous-modules."
  - key: recharger
    format: course
    question: Comment recharger un module modifié sur le disque, sans relancer l'interpréteur ?
    choices:
      - {text: "`importlib.reload(module)`", correct: true}
      - {text: "Un second `import module`", correct: false}
      - {text: "`del module`, puis `import module`", correct: false}
      - {text: "`sys.path.reload()`", correct: false}
    answer: "`reload` réexécute le fichier dans le même objet module. Un second import, même après `del`, reprend le module du cache `sys.modules`. Les noms copiés par `from module import x` gardent l'ancienne valeur."
  - key: vf-pythonpath
    format: true-false
    question: "La variable d'environnement `PYTHONPATH` ajoute des dossiers à `sys.path`."
    truth: true
    answer: "Ses dossiers viennent juste après celui du script, avant la bibliothèque standard. Pratique en dépannage ; un projet installé n'en a pas besoin."
  - key: vf-second-import
    format: true-false
    question: "Un second `import config` relit `config.py` si le fichier a changé sur le disque."
    truth: false
    answer: "Le module est déjà dans `sys.modules` : l'import le renvoie sans rien relire. Il faut `importlib.reload(config)`."
  - key: vf-liste-modifiable
    format: true-false
    question: "`sys.path` est une liste ordinaire, qu'un programme peut modifier."
    truth: true
    answer: "`sys.path.insert(0, dossier)` fonctionne, avant l'import concerné. C'est un dépannage : installer le projet est plus robuste."
  - key: vf-site-packages-premier
    format: true-false
    question: Les paquets installés par pip, dans `site-packages`, passent avant le dossier du script dans la recherche.
    truth: false
    answer: "Le dossier du script vient en premier, `site-packages` en dernier. Un fichier local peut donc masquer un paquet installé, ou un module standard."
  - key: qcm-afficher
    format: multiple-choice
    question: Quelle commande affiche les dossiers où Python cherche les modules ?
    choices:
      - {text: "`python -c \"import sys; print(sys.path)\"`", correct: true}
      - {text: "`python -c \"import os; print(os.path)\"`", correct: false}
      - {text: "`python -c \"print(__path__)\"`", correct: false}
      - {text: "`pip list --format=paths`", correct: false}
    answer: "`sys.path` est la liste de recherche. `os.path` est le module de manipulation des chemins ; `__path__` n'existe que dans un paquet."
  - key: qcm-module-not-found
    format: multiple-choice
    question: "Que signifie « ModuleNotFoundError: No module named 'requests' » ?"
    choices:
      - {text: "Aucun dossier de `sys.path` ne contient de module `requests`", correct: true}
      - {text: "Le module `requests` contient une erreur de syntaxe", correct: false}
      - {text: "Le module est trouvé, mais il ne définit pas `requests`", correct: false}
      - {text: "Le réseau est coupé et pip ne peut pas le télécharger", correct: false}
    answer: "Le plus souvent, le paquet n'est pas installé dans l'environnement que tu utilises (un autre Python, un venv non activé). `python -m pip install requests` installe dans le bon."
  - key: qcm-dossier-voisin
    format: multiple-choice
    question: "Les scripts de ton projet importent un module d'un dossier voisin. Quelle solution est la plus propre ?"
    choices:
      - {text: "Installer le projet en mode éditable : `pip install -e .`", correct: true}
      - {text: "Ajouter le dossier à `sys.path` en tête de chaque script", correct: false}
      - {text: "Copier le module dans chaque dossier qui l'utilise", correct: false}
      - {text: "Lancer chaque script depuis le dossier du module", correct: false}
    answer: "Installé, le paquet est trouvé dans `site-packages` quel que soit le dossier de lancement ; en mode éditable, tes modifications sont prises en compte sans réinstaller."
  - key: qcm-sys-modules
    format: multiple-choice
    question: "Qu'est-ce que `sys.modules` ?"
    choices:
      - {text: "Le dictionnaire des modules déjà importés, par nom", correct: true}
      - {text: "La liste des dossiers où chercher les modules", correct: false}
      - {text: "La liste des modules de la bibliothèque standard", correct: false}
      - {text: "Le dictionnaire des paquets installés par pip", correct: false}
    answer: "Le cache des imports : `sys.modules[\"json\"]` est le module `json` s'il a été importé. La liste de recherche, c'est `sys.path`."
  - key: bug-append-trop-tard
    format: bug-fix
    question: |-
      Ce script s'arrête sur « ModuleNotFoundError: No module named 'mesoutils' » ; `mesoutils.py` est bien dans
      `/opt/mes-libs` :
      ```python
      import sys

      import mesoutils

      sys.path.append("/opt/mes-libs")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter le dossier à `sys.path` avant l'`import`", correct: true}
      - {text: "Remplacer `append` par `insert(0, ...)`, au même endroit", correct: false}
      - {text: "Écrire `import sys.path` à la place de `import sys`", correct: false}
      - {text: "Importer `mesoutils` dans un `try` qui ignore l'erreur", correct: false}
    answer: |-
      ```python
      import sys

      sys.path.append("/opt/mes-libs")

      import mesoutils
      ```
      L'import cherche dans `sys.path` au moment où il s'exécute. Mieux encore : empaqueter `mesoutils` et l'installer
      dans l'environnement, sans toucher à `sys.path`.
  - key: bug-script-sous-dossier
    format: bug-fix
    question: |-
      Depuis la racine du projet, `python outils/rapport.py` s'arrête sur « ModuleNotFoundError: No module named
      'outils' » :
      ```
      outils/
      ├── __init__.py
      ├── format.py
      └── rapport.py
      ```
      ```python
      # outils/rapport.py
      from outils.format import montant

      print(montant(3))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Lancer `python -m outils.rapport` depuis la racine", correct: true}
      - {text: "Lancer `cd outils`, puis `python rapport.py`", correct: false}
      - {text: "Écrire `from .format import montant`, et garder la commande", correct: false}
      - {text: "Renommer `outils/__init__.py` en `outils/main.py`", correct: false}
    answer: |-
      ```bash
      python -m outils.rapport
      ```
      Lancé par son chemin, le script met `outils/` en tête de `sys.path`, pas la racine : le paquet `outils` y est
      introuvable. Avec `-m`, c'est le dossier courant, la racine, qui est ajouté.
  - key: bug-reimport-ne-relit-pas
    format: bug-fix
    question: |-
      Dans une console Python, ce code affiche encore l'ancienne valeur, `1`, alors que `config.py` contient
      maintenant `SEUIL = 2` :
      ```python
      import config          # config.py contenait SEUIL = 1

      # config.py est modifié sur le disque : SEUIL = 2

      import config
      print(config.SEUIL)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`importlib.reload(config)` à la place du second import", correct: true}
      - {text: "`del config`, puis `import config` une nouvelle fois", correct: false}
      - {text: "`from config import SEUIL`, puis `print(SEUIL)`", correct: false}
      - {text: "`import config as config2`, puis `print(config2.SEUIL)`", correct: false}
    answer: |-
      ```python
      import importlib

      importlib.reload(config)
      print(config.SEUIL)
      ```
      Le module reste dans `sys.modules` : tout nouvel import, même après `del` ou sous un autre nom, renvoie l'objet
      déjà chargé. `reload` réexécute le fichier.
  - key: bug-module-standard-masque
    format: bug-fix
    question: |-
      Dans un dossier qui contient `notes.py` et un fichier `statistics.py` de ton cru, `python notes.py` s'arrête sur
      « AttributeError: module 'statistics' has no attribute 'mean' (consider renaming '/home/ada/projet/statistics.py'
      since it has the same name as the standard library module named 'statistics' and prevents importing that
      standard library module) » :
      ```python
      # notes.py
      import statistics

      print(statistics.mean([12, 15]))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renommer ton fichier, par exemple en `mes_stats.py`", correct: true}
      - {text: "Écrire `from statistics import mean`, puis `mean(...)`", correct: false}
      - {text: "Écrire `import statistics.mean` en tête de `notes.py`", correct: false}
      - {text: "Réinstaller Python : le module standard est abîmé", correct: false}
    answer: |-
      ```
      notes.py
      mes_stats.py
      ```
      Le dossier du script passe avant la bibliothèque standard : `import statistics` trouve ton fichier. Tant qu'il
      porte ce nom, toute forme d'import le choisit.
  - key: sc-autre-dossier
    format: scenario
    question: Ton script fonctionne quand tu le lances depuis la racine du projet, mais un collègue obtient une `ModuleNotFoundError` en le lançant depuis un autre dossier. Que proposes-tu ?
    choices:
      - {text: "Installer le projet (`pip install -e .`), ou lancer avec `python -m`", correct: true}
      - {text: "Ajouter `sys.path.append(\"..\")` en tête du script", correct: false}
      - {text: "Demander au collègue de copier le projet dans `site-packages`", correct: false}
      - {text: "Renommer le script pour qu'il ne contienne plus de point", correct: false}
    answer: "Le script dépend du dossier de lancement, à travers `sys.path`. Installé, le projet est trouvé partout. `sys.path.append(\"..\")` dépend du dossier courant, donc casse de la même façon."
  - key: sc-logging-masque
    format: scenario
    question: "Après avoir créé un fichier `logging.py` dans ton projet, tous les logs disparaissent et un module tiers échoue à l'import. Que s'est-il passé ?"
    choices:
      - {text: "Ton fichier masque le module standard `logging`, trouvé avant lui", correct: true}
      - {text: "Le nom `logging` est réservé : Python ignore ton fichier", correct: false}
      - {text: "Le module tiers exige une version plus récente de Python", correct: false}
      - {text: "pip a désinstallé `logging` en découvrant un doublon", correct: false}
    answer: "Tout `import logging` du programme, y compris dans les bibliothèques, trouve ton fichier en premier. On le renomme, puis on supprime son `__pycache__`."
  - key: sc-notebook
    format: scenario
    question: "Dans un notebook, tu modifies `outils.py`, mais tes appels utilisent toujours l'ancienne version. Pourquoi, et que fais-tu ?"
    choices:
      - {text: "Le module est en cache : `importlib.reload(outils)`, ou relancer le noyau", correct: true}
      - {text: "Le fichier est mal encodé : il faut l'enregistrer en UTF-8", correct: false}
      - {text: "Un second `import outils` suffit : il relit le fichier modifié", correct: false}
      - {text: "Python ne recompile ses modules qu'une fois par heure", correct: false}
    answer: "Le noyau garde `outils` dans `sys.modules`. `reload` le réexécute ; relancer le noyau repart de zéro, ce qui évite les objets créés avec l'ancienne version."
  - key: sc-production
    format: scenario
    question: "En production, un script ne trouve pas un module que tu as déposé dans `/opt/app/lib`. Quelle solution choisis-tu ?"
    choices:
      - {text: "Empaqueter ce module et l'installer dans l'environnement de l'application", correct: true}
      - {text: "Ajouter `/opt/app/lib` à `sys.path` au début de chaque fichier", correct: false}
      - {text: "Copier le module dans le dossier de la bibliothèque standard", correct: false}
      - {text: "Renommer le module pour que son nom commence par un souligné", correct: false}
    answer: "Installé comme une dépendance, le module est trouvé sans bricolage, et sa version est connue. Toucher à la bibliothèque standard du système est à proscrire."
