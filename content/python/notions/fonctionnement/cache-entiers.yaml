notion: cache-entiers
lesson: |-
  CPython évite de créer sans cesse les objets qui servent partout. Deux mécanismes expliquent des résultats de `is`
  surprenants ; ce sont des **détails d'implémentation**, sur lesquels on ne compte jamais.

  **Le cache des petits entiers.** Les entiers de **-5 à 256** sont créés une fois pour toutes, au démarrage : chaque
  calcul qui donne 7 renvoie le même objet 7. Au-delà, un calcul fait à l'exécution crée un nouvel objet.

  ```python
  a, b = int("256"), int("256")
  a is b          # True : 256 est dans le cache
  c, d = int("257"), int("257")
  c is d          # False : deux objets 257 distincts
  c == d          # True : la seule comparaison qui compte
  ```

  **Les constantes d'un même bloc de code.** Le compilateur range une seule fois chaque constante d'un bloc (un module,
  une fonction) : dans un script, `x = 1000` puis `y = 1000` donnent souvent le **même** objet, et `x is y` vaut
  `True`. Le même test, tapé ligne par ligne dans le terminal interactif, peut donner `False`. D'où des résultats qui
  changent selon l'endroit où l'on exécute le code.

  **L'internement des chaînes.** CPython garde un seul exemplaire de certaines chaînes : les noms (de variables,
  d'attributs, de fonctions) et les littéraux qui leur ressemblent (`"bonjour"`, mais pas forcément `"bon jour !"`). Une
  chaîne construite à l'exécution (`"".join(...)`, `input()`) ne l'est pas. `sys.intern(s)` renvoie l'exemplaire
  unique d'une chaîne égale, et l'enregistre au besoin :

  ```python
  import sys

  a = "".join(["bon", "jour"])
  b = "bonjour"
  a == b                  # True
  a is b                  # False
  sys.intern(a) is b      # True
  ```

  `sys.intern` sert à économiser la mémoire et à accélérer les comparaisons quand des millions de chaînes répétées
  (des jetons, des clés) sont comparées souvent. Depuis Python 3.12, les petits entiers, `None`, `True` et `False` sont
  **immortels** : leur compteur de références ne change plus.

  À comparer avec Java, dont `Integer.valueOf` met en cache les valeurs de -128 à 127 : même idée, mêmes pièges avec
  `==` sur des objets.

  **En entretien** : « CPython met en cache les entiers de -5 à 256 et interne certaines chaînes, ce qui fait que `is`
  répond parfois `True` entre deux valeurs égales. C'est un détail d'implémentation, qui varie même selon que le code
  est dans un script ou dans le terminal : on compare les valeurs avec `==`, et `is` reste réservé à `None`. »
cards:
  - key: plage-du-cache
    format: course
    question: "Quels entiers CPython garde-t-il en cache dès le démarrage ?"
    choices:
      - {text: "De -5 à 256", correct: true}
      - {text: "De 0 à 255", correct: false}
      - {text: "De -128 à 127", correct: false}
      - {text: "Tous ceux qui tiennent sur 64 bits", correct: false}
    answer: "Ces 262 entiers sont créés une fois, et tout calcul qui en donne un renvoie l'objet du cache. -128 à 127 est la plage du cache de `Integer` en Java."
  - key: int-500-distincts
    format: course
    question: "Pourquoi `int(\"500\") is int(\"500\")` vaut-il `False` dans CPython ?"
    choices:
      - {text: "500 est hors du cache : chaque appel crée un nouvel objet", correct: true}
      - {text: "`int()` renvoie une chaîne, que `is` compare caractère par caractère", correct: false}
      - {text: "`is` compare aussi les types, et les deux appels diffèrent", correct: false}
      - {text: "Les entiers créés par `int()` ne sont jamais égaux entre eux", correct: false}
    answer: "Les deux objets sont égaux (`==` vaut `True`) mais distincts. Avec 200, dans le cache, `is` vaudrait `True` : c'est un détail de CPython."
  - key: definition-internement
    format: course
    question: "Qu'est-ce que l'internement d'une chaîne ?"
    choices:
      - {text: "N'en garder qu'un exemplaire, partagé par toutes les chaînes égales", correct: true}
      - {text: "La convertir dans l'encodage interne de l'interpréteur", correct: false}
      - {text: "La copier dans le module où elle est utilisée", correct: false}
      - {text: "La traduire en bytecode pour la comparer plus vite", correct: false}
    answer: "Une chaîne internée est unique : deux chaînes internées égales sont le même objet, et se comparent par identité. CPython interne les noms, et `sys.intern` le fait à la demande."
  - key: compter-sur-le-cache
    format: course
    question: "Faut-il compter sur le cache des entiers dans son code ?"
    choices:
      - {text: "Non : c'est un détail de CPython ; on compare avec `==`", correct: true}
      - {text: "Oui : `is` est plus rapide que `==` pour les petits entiers", correct: false}
      - {text: "Oui, pour les entiers de -5 à 256 seulement", correct: false}
      - {text: "Non, sauf dans le terminal interactif, où il est garanti", correct: false}
    answer: "La plage n'est garantie par aucune spécification, et les constantes d'un script changent les résultats. `==` donne toujours la bonne réponse."
  - key: vf-specification
    format: true-false
    question: "Le cache des petits entiers fait partie de la spécification du langage Python."
    truth: false
    answer: "C'est une optimisation de CPython. Une autre implémentation peut faire autrement, et CPython pourrait changer sa plage."
  - key: vf-sys-intern
    format: true-false
    question: "`sys.intern(s)` renvoie l'exemplaire unique d'une chaîne égale à `s`."
    truth: true
    answer: "S'il n'existe pas encore, `s` devient cet exemplaire. Deux chaînes passées par `sys.intern` se comparent ensuite par identité."
  - key: vf-constantes-du-script
    format: true-false
    question: "Dans un même script, deux littéraux `1000` affectés à deux variables peuvent désigner le même objet."
    truth: true
    answer: "Le compilateur range une fois chaque constante d'un bloc de code : `x = 1000` et `y = 1000` partagent l'objet. Dans le terminal, ligne par ligne, ce n'est pas le cas."
  - key: vf-noms-internes
    format: true-false
    question: "CPython interne les noms de variables et d'attributs."
    truth: true
    answer: "Les recherches dans les dictionnaires d'attributs et de variables comparent alors des chaînes internées, ce qui les accélère."
  - key: qcm-int-7
    format: multiple-choice
    question: "Que vaut `int(\"7\") is int(\"7\")` dans CPython ?"
    choices:
      - {text: "`True`, car 7 est dans le cache des petits entiers", correct: true}
      - {text: "`False`, car `int()` crée toujours un nouvel objet", correct: false}
      - {text: "`False`, car `is` compare les chaînes d'origine", correct: false}
      - {text: "Une erreur, car `is` refuse de comparer des entiers", correct: false}
    answer: "`int()` renvoie l'objet 7 du cache. Avec 700, chaque appel créerait un nouvel objet."
  - key: qcm-quand-sys-intern
    format: multiple-choice
    question: "Quand `sys.intern` est-il utile ?"
    choices:
      - {text: "Pour des millions de chaînes répétées, comparées souvent", correct: true}
      - {text: "Pour comparer deux chaînes saisies par l'utilisateur", correct: false}
      - {text: "Pour rendre une chaîne modifiable sur place", correct: false}
      - {text: "Pour chiffrer une chaîne avant de la stocker", correct: false}
    answer: "Chaque valeur n'existe plus qu'une fois en mémoire, et les comparaisons d'identité sont immédiates. Pour une comparaison isolée, `==` suffit."
  - key: qcm-pourquoi-le-cache
    format: multiple-choice
    question: "Pourquoi CPython met-il les petits entiers en cache ?"
    choices:
      - {text: "Ils servent partout : les partager évite d'en créer sans cesse", correct: true}
      - {text: "Pour que `is` et `==` donnent toujours le même résultat", correct: false}
      - {text: "Parce que les entiers au-delà de 256 sont des flottants", correct: false}
      - {text: "Pour que les entiers deviennent mutables, et plus rapides", correct: false}
    answer: "Indices, compteurs, petites constantes : on en crée énormément. Un objet partagé par valeur économise allocations et mémoire, sans risque puisque les entiers sont immuables."
  - key: qcm-comparaison-fiable
    format: multiple-choice
    question: "Quelle comparaison donne toujours la bonne réponse entre deux entiers ?"
    choices:
      - {text: "`a == b`", correct: true}
      - {text: "`a is b`", correct: false}
      - {text: "`id(a) == id(b)`", correct: false}
      - {text: "`hash(a) is hash(b)`", correct: false}
    answer: "Les trois autres comparent des identités, qui dépendent du cache. Deux entiers égaux ont bien le même hachage, mais ce hachage est lui-même un entier, comparé ici avec `is`."
  - key: code-limite-256
    format: code-output
    question: |-
      ```python
      a, b = int("256"), int("256")
      c, d = int("257"), int("257")
      print(a is b, c is d, c == d)
      ```
    answer: "256 est dans le cache : les deux appels renvoient le même objet. 257 n'y est pas : deux objets distincts, mais égaux."
    check:
      output: "True False True"
    choices:
      - {text: "`True False True`", correct: true}
      - {text: "`True True True`", correct: false}
      - {text: "`False False True`", correct: false}
      - {text: "`True False False`", correct: false}
  - key: code-constantes-partagees
    format: code-output
    question: |-
      ```python
      x = 1000
      y = 1000
      z = int("1000")
      print(x is y, x is z)
      ```
    answer: "Dans un script, le compilateur range une seule fois la constante `1000` : `x` et `y` désignent le même objet. `int(\"1000\")` en crée un nouveau à l'exécution."
    check:
      output: "True False"
    choices:
      - {text: "`True False`", correct: true}
      - {text: "`False False`", correct: false}
      - {text: "`True True`", correct: false}
      - {text: "`False True`", correct: false}
  - key: code-sys-intern
    format: code-output
    question: |-
      ```python
      import sys

      a = "".join(["bon", "jour"])
      b = "bonjour"
      print(a == b, a is b, sys.intern(a) is b)
      ```
    answer: "La chaîne construite par `join` est un nouvel objet. Le littéral `\"bonjour\"` est interné : `sys.intern(a)` renvoie cet exemplaire."
    check:
      output: "True False True"
    choices:
      - {text: "`True False True`", correct: true}
      - {text: "`True True True`", correct: false}
      - {text: "`True False False`", correct: false}
      - {text: "`False False True`", correct: false}
  - key: code-limite-moins-5
    format: code-output
    question: |-
      ```python
      print(int("-5") is int("-5"), int("-6") is int("-6"))
      ```
    answer: "Le cache commence à -5 : -6 est créé à chaque appel."
    check:
      output: "True False"
    choices:
      - {text: "`True False`", correct: true}
      - {text: "`False False`", correct: false}
      - {text: "`True True`", correct: false}
      - {text: "`False True`", correct: false}
