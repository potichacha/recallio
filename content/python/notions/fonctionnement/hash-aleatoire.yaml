notion: hash-aleatoire
lesson: |-
  Depuis Python 3.3, le hachage des **chaînes** et des **bytes** est **salé au hasard** à chaque lancement de
  l'interpréteur : `hash("abc")` change d'une exécution à l'autre (mais reste le même pendant toute une exécution).

  ```bash
  python -c 'print(hash("abc"))'     # un grand entier...
  python -c 'print(hash("abc"))'     # ...et un autre au lancement suivant
  python -c 'print(hash(42))'        # 42, à chaque fois
  ```

  **Pourquoi.** Un attaquant qui connaît la fonction de hachage peut envoyer des milliers de clés qui tombent dans la
  même case d'un dictionnaire (par exemple les paramètres d'une requête HTTP) : chaque insertion devient lente, et le
  serveur s'écroule (attaque par saturation, *hash flooding*). Un sel aléatoire rend ces collisions imprévisibles.

  **Ce qui change d'un lancement à l'autre, et ce qui ne change pas.**

  | | Stable entre deux lancements ? |
  |---|---|
  | `hash()` d'un entier, d'un flottant, d'un tuple d'entiers | oui |
  | `hash()` d'une chaîne, de bytes, d'un tuple qui en contient | non |
  | l'ordre d'un `set` ou d'un `frozenset` de chaînes | non : il suit les hachages |
  | l'ordre d'un `dict` | oui : l'ordre d'insertion, depuis Python 3.7 |

  **Les conséquences pratiques.**

  - **Ne jamais stocker `hash(x)`** (dans une base, un fichier, un cache partagé), ni s'en servir pour répartir des
    données entre processus ou machines : la valeur ne vaut que pour l'exécution en cours. Pour une empreinte stable,
    `hashlib` (`hashlib.sha256(s.encode()).hexdigest()`) ou `zlib.crc32`.
  - **Une sortie qui dépend de l'ordre d'un `set` de chaînes** change d'une exécution à l'autre : on trie
    (`sorted(s)`) avant d'afficher, de comparer ou d'écrire.
  - **`PYTHONHASHSEED`** fixe le sel, au lancement de l'interpréteur (`PYTHONHASHSEED=0` désactive l'aléa). Utile pour
    reproduire un bug ; à ne pas faire en production, où il rouvrirait la porte aux attaques. Le modifier dans le code,
    une fois Python lancé, n'a aucun effet.

  **En entretien** : « Le hachage des chaînes est salé au hasard à chaque lancement, contre les attaques par
  collisions. Du coup `hash()` n'est stable que pendant une exécution, et l'ordre d'un `set` de chaînes change d'un
  lancement à l'autre ; un `dict` garde l'ordre d'insertion. Pour une empreinte durable, `hashlib` ; pour une sortie
  reproductible, je trie. »
cards:
  - key: pourquoi-hash-change
    format: course
    question: "Pourquoi `hash(\"abc\")` change-t-il d'une exécution à l'autre ?"
    choices:
      - {text: "Le hachage des chaînes est salé au hasard à chaque lancement", correct: true}
      - {text: "Le hachage dépend de l'adresse mémoire de la chaîne", correct: false}
      - {text: "Le hachage dépend de l'heure à laquelle on l'a calculé", correct: false}
      - {text: "Le hachage change à chaque appel, même dans une exécution", correct: false}
    answer: "Un sel aléatoire, tiré au démarrage, entre dans le calcul. Pendant toute l'exécution, `hash(\"abc\")` reste le même ; au lancement suivant, il change."
  - key: ordre-d-un-set
    format: course
    question: "Pourquoi l'ordre d'un `set` de chaînes peut-il changer d'une exécution à l'autre ?"
    choices:
      - {text: "Il suit les hachages des chaînes, qui changent à chaque lancement", correct: true}
      - {text: "Il suit l'ordre d'insertion, qui varie selon le système", correct: false}
      - {text: "Python mélange les ensembles exprès à chaque affichage", correct: false}
      - {text: "Il suit l'ordre alphabétique, qui dépend de la langue du système", correct: false}
    answer: "Un `set` range ses éléments selon leur hachage. Avec un sel différent, les chaînes tombent dans d'autres cases, et le parcours change d'ordre."
  - key: empreinte-stable
    format: course
    question: "Comment obtenir une empreinte stable d'une chaîne, à stocker dans une base ?"
    choices:
      - {text: "Avec `hashlib`, par exemple `hashlib.sha256(s.encode()).hexdigest()`", correct: true}
      - {text: "Avec `hash(s)`, converti en chaîne avec `str` avant de le stocker", correct: false}
      - {text: "Avec `id(s)`, qui ne change pas tant que la chaîne existe", correct: false}
      - {text: "Avec `hash(s)`, après avoir fixé `PYTHONHASHSEED` dans le code", correct: false}
    answer: "Les fonctions de `hashlib` ne dépendent d'aucun sel : la même chaîne donne la même empreinte partout et toujours. `hash` et `id` ne valent que pour l'exécution en cours."
  - key: pythonhashseed
    format: course
    question: "Que fait `PYTHONHASHSEED=0`, placé dans l'environnement avant de lancer Python ?"
    choices:
      - {text: "Il désactive l'aléa : les hachages des chaînes sont fixes", correct: true}
      - {text: "Il désactive le hachage : les dictionnaires deviennent des listes", correct: false}
      - {text: "Il fixe à 0 le hachage de toutes les chaînes", correct: false}
      - {text: "Il trie les ensembles de chaînes par ordre alphabétique", correct: false}
    answer: "Une valeur fixe rend les hachages reproductibles, pour déboguer un problème d'ordre ; 0 désactive le sel. En production, on garde l'aléa."
  - key: vf-ordre-dict
    format: true-false
    question: "L'ordre de parcours d'un `dict` dépend du hachage de ses clés."
    truth: false
    answer: "Depuis Python 3.7, un dictionnaire garde l'ordre d'insertion de ses clés, quel que soit leur hachage."
  - key: vf-hash-entier
    format: true-false
    question: "`hash(42)` vaut la même chose à chaque exécution."
    truth: true
    answer: "Le sel ne concerne que les chaînes et les bytes. Le hachage d'un petit entier est l'entier lui-même."
  - key: vf-hash-flooding
    format: true-false
    question: "Le hachage aléatoire protège contre les attaques par saturation d'une table de hachage."
    truth: true
    answer: "Sans sel, un attaquant pourrait calculer à l'avance des milliers de clés en collision, et ralentir un serveur à l'extrême."
  - key: vf-stocker-hash
    format: true-false
    question: "On peut stocker `hash(nom)` en base, pour retrouver un utilisateur au prochain lancement."
    truth: false
    answer: "Au prochain lancement, le sel a changé, et `hash(nom)` aussi. On stocke une empreinte de `hashlib`, ou le nom lui-même."
  - key: qcm-hash-instable
    format: multiple-choice
    question: "Laquelle de ces valeurs a un hachage qui change entre deux lancements de Python ?"
    choices:
      - {text: "La chaîne `\"abc\"`", correct: true}
      - {text: "L'entier `42`", correct: false}
      - {text: "Le tuple `(1, 2)`", correct: false}
      - {text: "Le booléen `True`", correct: false}
    answer: "Seuls les chaînes et les bytes (et ce qui les contient) sont salés. Un tuple d'entiers combine des hachages d'entiers, stables."
  - key: qcm-sortie-stable
    format: multiple-choice
    question: "Quelle écriture affiche un `set` de chaînes de la même façon à chaque exécution ?"
    choices:
      - {text: "`print(sorted(noms))`", correct: true}
      - {text: "`print(noms)`", correct: false}
      - {text: "`print(list(noms))`", correct: false}
      - {text: "`print(tuple(noms))`", correct: false}
    answer: "`list` et `tuple` gardent l'ordre de parcours du `set`, qui dépend des hachages. `sorted` impose un ordre indépendant du sel."
  - key: qcm-ordre-insertion
    format: multiple-choice
    question: "Lequel de ces conteneurs garde l'ordre d'insertion, quel que soit le hachage des chaînes qu'il contient ?"
    choices:
      - {text: "`dict`", correct: true}
      - {text: "`set`", correct: false}
      - {text: "`frozenset`", correct: false}
      - {text: "Un `set` créé par compréhension", correct: false}
    answer: "Depuis 3.7, le `dict` garde l'ordre d'insertion. `dict.fromkeys(elements)` est d'ailleurs une façon de dédoublonner en gardant l'ordre."
  - key: qcm-test-reproductible
    format: multiple-choice
    question: "Comment rendre reproductible un test qui dépend de l'ordre d'un `set` de chaînes ?"
    choices:
      - {text: "Comparer des ensembles, ou des listes triées", correct: true}
      - {text: "Fixer `os.environ[\"PYTHONHASHSEED\"]` au début du test", correct: false}
      - {text: "Appeler `random.seed(0)` au début du test", correct: false}
      - {text: "Convertir le `set` en `list` avant de comparer", correct: false}
    answer: "Le sel est tiré au lancement de l'interpréteur : le changer dans le code ne sert à rien, et `random` n'y est pour rien. Comparer `set` à `set`, ou `sorted` à une liste, ne dépend plus de l'ordre."
  - key: situation-test-intermittent-ordre
    format: scenario
    question: |-
      Un test passe en local et échoue une fois sur trois en CI : il compare `str(etiquettes)`, où `etiquettes` est un
      `set` de chaînes, à une chaîne attendue. Que fais-tu ?
    choices:
      - {text: "Tu compares l'ensemble à un ensemble attendu, ou une liste triée", correct: true}
      - {text: "Tu relances le test en CI jusqu'à ce qu'il passe", correct: false}
      - {text: "Tu remplaces le `set` par un `frozenset` pour figer l'ordre", correct: false}
      - {text: "Tu appelles `random.seed(42)` au début du test", correct: false}
    answer: |-
      L'ordre d'affichage du `set` dépend du sel tiré à chaque lancement. Un `frozenset` a le même ordre aléatoire ;
      `random.seed` ne touche pas au hachage. On teste le contenu, pas l'ordre.
  - key: situation-repartition-serveurs
    format: scenario
    question: |-
      Un collègue répartit des clients sur 4 serveurs avec `hash(client_id) % 4`, calculé par plusieurs processus. Les
      `client_id` sont des chaînes. Que lui dis-tu ?
    choices:
      - {text: "Chaque processus a son sel : il faut une empreinte stable, comme `zlib.crc32`", correct: true}
      - {text: "C'est juste, car `hash` est le même pour tous les processus d'une machine", correct: false}
      - {text: "C'est juste, à condition de convertir `client_id` en majuscules d'abord", correct: false}
      - {text: "Il suffit de remplacer `% 4` par `% 3`, pour éviter les collisions", correct: false}
    answer: |-
      Deux processus donnent des hachages différents pour la même chaîne : un client changerait de serveur selon le
      processus. `zlib.crc32(client_id.encode())` ou `hashlib` donnent la même valeur partout.
  - key: situation-diff-de-configuration
    format: scenario
    question: |-
      Ton outil génère un fichier de configuration à partir d'un `set` de noms de services ; chaque génération donne un
      diff différent dans Git, sans aucun changement réel. Que fais-tu ?
    choices:
      - {text: "Tu écris les noms triés, avec `sorted`", correct: true}
      - {text: "Tu écris les noms avec `list(services)`", correct: false}
      - {text: "Tu ajoutes le fichier au `.gitignore`", correct: false}
      - {text: "Tu génères le fichier deux fois, et gardes le second", correct: false}
    answer: |-
      L'ordre du `set` change à chaque lancement, et le fichier avec lui. Trier rend la sortie déterministe : le diff ne
      montre plus que les vrais changements.
  - key: situation-hashseed-en-production
    format: scenario
    question: |-
      Pour avoir des journaux reproductibles, un collègue propose de fixer `PYTHONHASHSEED=0` sur les serveurs de
      production d'une API publique. Que réponds-tu ?
    choices:
      - {text: "Que ça rouvrirait la porte aux attaques par collisions de hachage", correct: true}
      - {text: "Que c'est sans risque, puisque seul l'ordre des ensembles change", correct: false}
      - {text: "Que ça ralentirait tous les dictionnaires de moitié environ", correct: false}
      - {text: "Que c'est inutile, car Python l'ignore en production", correct: false}
    answer: |-
      Sans sel, un attaquant peut calculer des clés en collision et saturer les dictionnaires du serveur. Pour des
      journaux reproductibles, on trie ce qu'on écrit.
