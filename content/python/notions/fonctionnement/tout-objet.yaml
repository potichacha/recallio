notion: tout-objet
lesson: |-
  En Python, **tout est objet** : les nombres, les chaînes, `None`, mais aussi les fonctions, les classes et les
  modules. Il n'y a pas de types « primitifs » à part, comme `int` en Java.

  Chaque objet a trois caractéristiques :

  | | Ce que c'est | Comment l'obtenir |
  |---|---|---|
  | **Identité** | ce qui le distingue de tout autre objet vivant ; ne change jamais | `id(x)` ; `a is b` compare deux identités |
  | **Type** | ce qu'il est, et donc les opérations qu'il accepte | `type(x)`, `isinstance(x, T)` |
  | **Valeur** | son contenu | `==` compare deux valeurs |

  ```python
  x = [1, 2]
  print(id(x))            # un entier, unique tant que l'objet existe (son adresse, dans CPython)
  print(type(x))          # <class 'list'>
  print(type(len))        # <class 'builtin_function_or_method'>
  print(type(int))        # <class 'type'> : une classe est un objet, de type type
  ```

  **Une variable est un nom**, pas une case mémoire : elle désigne un objet. `b = a` donne un second nom au même objet,
  sans rien copier. Les noms des fonctions intégrées sont des noms comme les autres : `list = [1, 2]` cache la classe
  `list`, et `list("abc")` lève ensuite `TypeError: 'list' object is not callable`.

  **Les fonctions sont des objets de première classe** : on les range dans une variable, une liste ou un
  dictionnaire, on les passe en argument, on les renvoie, on leur ajoute même des attributs.

  ```python
  def doubler(x):
      return 2 * x

  operations = {"double": doubler, "carre": lambda x: x * x}
  print(operations["double"](5))     # 10
  print(doubler.__name__)            # doubler
  ```

  **Tester un type** : `isinstance(x, list)` accepte aussi les sous-classes, et c'est l'usage ; `type(x) is list`
  n'accepte que le type exact. Attention : `bool` est une sous-classe de `int`, donc `isinstance(True, int)` vaut
  `True`.

  **En entretien** : « En Python, tout est objet, fonctions et classes comprises, et chaque objet a une identité
  (`id`, comparée par `is`), un type (`type`, `isinstance`) et une valeur (comparée par `==`). Une variable n'est qu'un
  nom lié à un objet. Les fonctions sont des valeurs comme les autres : on les passe, on les range, on les renvoie. »
tour:
  - title: Tout est objet
    text: |-
      En Python, **tout est objet** : un nombre, une chaîne, `None`, mais aussi une fonction ou une classe. Pas de type
      primitif à part.

      - `type(x)` donne le type d'un objet ; `type(x).__name__`, son nom.
      - Une variable est un **nom** qui désigne un objet. `b = a` ne copie rien : les deux noms désignent le même objet.
      - `a is b` dit si deux noms désignent le même objet, comme `id(a) == id(b)`.

      Une fonction est une valeur : on peut lui donner un autre nom, et l'appeler par ce nom.

      Essaie : ajoute `print` et `True` à la liste `valeurs`, et regarde leurs types.
    example:
      files:
        main.py: |-
          def saluer(nom):
              return f"Bonjour {nom}"


          valeurs = [42, 3.14, "texte", None, [1, 2], saluer, int]
          for valeur in valeurs:
              print(type(valeur).__name__)

          dire = saluer
          print(dire("Ana"))
          print(dire.__name__)

          a = [1, 2]
          b = a
          print(b is a, id(a) == id(b))
      output: |-
        int
        float
        str
        NoneType
        list
        function
        type
        Bonjour Ana
        saluer
        True True
cards:
  - key: trois-caracteristiques
    format: course
    question: "Quelles sont les trois caractéristiques de tout objet Python ?"
    choices:
      - {text: "Une identité, un type et une valeur", correct: true}
      - {text: "Un nom, une adresse et une taille", correct: false}
      - {text: "Une classe, un parent et des méthodes", correct: false}
      - {text: "Une valeur, une portée et une durée de vie", correct: false}
    answer: "L'identité (`id`, comparée par `is`) ne change jamais ; le type (`type`) fixe les opérations possibles ; la valeur est le contenu, comparé par `==`."
  - key: role-de-id
    format: course
    question: "Que renvoie `id(x)` ?"
    choices:
      - {text: "Un entier propre à l'objet tant qu'il existe : son adresse, dans CPython", correct: true}
      - {text: "Un entier calculé à partir de la valeur de l'objet, comme `hash(x)`", correct: false}
      - {text: "Le nom de la variable qui désigne l'objet, sous forme de chaîne", correct: false}
      - {text: "Le numéro d'ordre de création de l'objet depuis le lancement", correct: false}
    answer: "Deux objets vivants n'ont jamais le même `id` ; un objet détruit peut voir son `id` réutilisé. `a is b` revient à `id(a) == id(b)`."
  - key: fonctions-objets
    format: course
    question: "Que peut-on faire d'une fonction, parce que c'est un objet ?"
    choices:
      - {text: "La ranger dans un dictionnaire, la passer en argument, la renvoyer", correct: true}
      - {text: "Rien de plus que l'appeler : une fonction n'est pas une valeur", correct: false}
      - {text: "La copier, mais seulement si elle n'a pas de paramètres", correct: false}
      - {text: "La passer en argument, mais seulement à une fonction intégrée", correct: false}
    answer: "Les fonctions sont des objets de première classe, de type `function` : on les nomme, on les range, on les passe (`sorted(xs, key=len)`), on leur ajoute des attributs."
  - key: isinstance-ou-type
    format: course
    question: "Que fait `isinstance(x, list)` de plus que `type(x) is list` ?"
    choices:
      - {text: "Il accepte aussi les objets des sous-classes de `list`", correct: true}
      - {text: "Il compare aussi le contenu de `x` à une liste vide", correct: false}
      - {text: "Il convertit `x` en liste quand c'est possible", correct: false}
      - {text: "Il accepte aussi les tuples et les ensembles", correct: false}
    answer: "`type(x) is list` n'accepte que le type exact. `isinstance` respecte l'héritage, et accepte un tuple de types : `isinstance(x, (list, tuple))`."
  - key: vf-classe-objet
    format: true-false
    question: "En Python, une classe est elle-même un objet."
    truth: true
    answer: "Une classe est un objet de type `type` : on peut la ranger dans une variable, la passer en argument, l'appeler pour créer une instance."
  - key: vf-meme-id
    format: true-false
    question: "Deux objets qui existent en même temps peuvent avoir le même `id`."
    truth: false
    answer: "L'`id` est unique parmi les objets vivants. Il peut être réutilisé après la destruction d'un objet."
  - key: vf-bool-sous-classe
    format: true-false
    question: "`bool` est une sous-classe de `int`."
    truth: true
    answer: "`True` vaut 1 et `False` vaut 0 : `True + True` vaut 2, et `isinstance(True, int)` est vrai. Pour refuser les booléens, on les teste à part."
  - key: vf-variable-case
    format: true-false
    question: "Une variable Python contient l'objet lui-même, comme une case mémoire."
    truth: false
    answer: "Une variable est un nom lié à un objet. Plusieurs noms peuvent désigner le même objet, et réaffecter un nom ne touche pas l'objet."
  - key: qcm-type-de-type
    format: multiple-choice
    question: "Qu'affiche `print(type(int))` ?"
    choices:
      - {text: "`<class 'type'>`", correct: true}
      - {text: "`<class 'int'>`", correct: false}
      - {text: "`<class 'object'>`", correct: false}
      - {text: "`<class 'class'>`", correct: false}
    answer: "Une classe est un objet de type `type`, sa métaclasse. Même `type(type)` vaut `type`."
  - key: qcm-tester-une-liste
    format: multiple-choice
    question: "Quelle écriture teste si `x` est une liste, ou d'une sous-classe de liste ?"
    choices:
      - {text: "`isinstance(x, list)`", correct: true}
      - {text: "`type(x) is list`", correct: false}
      - {text: "`type(x) == \"list\"`", correct: false}
      - {text: "`x is list`", correct: false}
    answer: "`type(x) is list` refuse les sous-classes ; `type(x)` n'est jamais égal à une chaîne ; `x is list` demande si `x` est la classe elle-même."
  - key: qcm-f-egal-print
    format: multiple-choice
    question: "Que fait `afficher = print` ?"
    choices:
      - {text: "Il donne un second nom à la fonction `print`", correct: true}
      - {text: "Il appelle `print` et range son résultat", correct: false}
      - {text: "Il copie le code de `print` dans une fonction neuve", correct: false}
      - {text: "Il lève une erreur : une fonction n'est pas une valeur", correct: false}
    answer: "Sans parenthèses, `print` est l'objet fonction lui-même. `afficher(\"x\")` appelle ensuite la même fonction."
  - key: qcm-type-de-len
    format: multiple-choice
    question: "Lequel de ces éléments est un objet en Python ?"
    choices:
      - {text: "Tous : `42`, `None`, la fonction `len` et la classe `str`", correct: true}
      - {text: "Seulement `42` et `None`, qui sont des valeurs", correct: false}
      - {text: "Seulement la classe `str`, dont on crée des instances", correct: false}
      - {text: "Seulement `42`, `None` et `str`, mais pas la fonction `len`", correct: false}
    answer: "Nombres, `None`, fonctions et classes ont tous une identité, un type et une valeur. `type(len)` vaut `builtin_function_or_method`."
  - key: code-types-integres
    format: code-output
    question: |-
      ```python
      print(type(len).__name__, type(int).__name__, type(None).__name__)
      ```
    answer: "`len` est une fonction intégrée (écrite en C), `int` une classe, donc de type `type`, et `None` l'unique objet de `NoneType`."
    check:
      output: "builtin_function_or_method type NoneType"
    choices:
      - {text: "`builtin_function_or_method type NoneType`", correct: true}
      - {text: "`function type NoneType`", correct: false}
      - {text: "`builtin_function_or_method int None`", correct: false}
      - {text: "`function class None`", correct: false}
  - key: code-fonctions-dans-un-dict
    format: code-output
    question: |-
      ```python
      def doubler(x):
          return 2 * x

      operations = {"d": doubler, "c": lambda x: x * x}
      print(operations["d"](5), operations["c"](5), operations["c"].__name__)
      ```
    answer: "Les fonctions sont des valeurs du dictionnaire : on les appelle après les avoir lues. Une `lambda` s'appelle `<lambda>`."
    check:
      output: "10 25 <lambda>"
    choices:
      - {text: "`10 25 <lambda>`", correct: true}
      - {text: "`10 25 c`", correct: false}
      - {text: "`10 10 <lambda>`", correct: false}
      - {text: "`10 25 lambda`", correct: false}
  - key: code-bool-et-int
    format: code-output
    question: |-
      ```python
      print(isinstance(True, int), type(True) is int, True + True)
      ```
    answer: "`bool` hérite de `int` : `isinstance` l'accepte, mais le type exact de `True` est `bool`. `True` vaut 1."
    check:
      output: "True False 2"
    choices:
      - {text: "`True False 2`", correct: true}
      - {text: "`False False 2`", correct: false}
      - {text: "`True True 2`", correct: false}
      - {text: "`True False True`", correct: false}
  - key: code-attribut-de-fonction
    format: code-output
    question: |-
      ```python
      def compter():
          compter.appels += 1

      compter.appels = 0
      compter()
      compter()
      print(compter.appels, compter.__name__)
      ```
    answer: "Une fonction est un objet : on peut lui ajouter un attribut, ici un compteur d'appels."
    check:
      output: "2 compter"
    choices:
      - {text: "`2 compter`", correct: true}
      - {text: "`0 compter`", correct: false}
      - {text: "`2 appels`", correct: false}
      - {text: "Une `AttributeError`, car une fonction n'a pas d'attributs", correct: false}
  - key: bug-booleen-accepte
    format: bug-fix
    question: |-
      Ce programme affiche `[True]` : la quantité `True` a été acceptée comme un entier.
      ```python
      def ajouter(panier, quantite):
          if not isinstance(quantite, int):
              raise TypeError("quantité entière attendue")
          panier.append(quantite)

      panier = []
      ajouter(panier, True)
      print(panier)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if isinstance(quantite, bool) or not isinstance(quantite, int):`", correct: true}
      - {text: "`if not isinstance(quantite, (int, bool)):`", correct: false}
      - {text: "`if quantite is not int:`", correct: false}
      - {text: "`if not isinstance(quantite, int) and quantite:`", correct: false}
    answer: |-
      ```python
      def ajouter(panier, quantite):
          if isinstance(quantite, bool) or not isinstance(quantite, int):
              raise TypeError("quantité entière attendue")
          panier.append(quantite)
      ```
      `bool` est une sous-classe de `int` : `isinstance(True, int)` vaut `True`. On écarte les booléens à part.
      (`type(quantite) is int` les refuserait aussi, avec les autres sous-classes d'`int`.)
  - key: bug-fonction-appelee
    format: bug-fix
    question: |-
      Ce programme affiche `clic`, puis s'arrête sur `TypeError: 'NoneType' object is not callable` :
      ```python
      def afficher():
          print("clic")

      actions = []
      actions.append(afficher())
      for action in actions:
          action()
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`actions.append(afficher)`, sans parenthèses", correct: true}
      - {text: "`actions.append(afficher()())`, avec deux appels", correct: false}
      - {text: "`actions.append(\"afficher\")`, avec son nom", correct: false}
      - {text: "`action` sans parenthèses dans la boucle", correct: false}
    answer: |-
      ```python
      actions = []
      actions.append(afficher)
      for action in actions:
          action()
      ```
      `afficher()` appelle la fonction tout de suite et range son résultat, `None`. Sans parenthèses, on range la
      fonction elle-même, qu'on appelle plus tard.
  - key: bug-type-compare-a-une-chaine
    format: bug-fix
    question: |-
      Ce programme affiche `0` au lieu de `3` :
      ```python
      def taille(x):
          if type(x) == "list":
              return len(x)
          return 0

      print(taille([1, 2, 3]))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if isinstance(x, list):`", correct: true}
      - {text: "`if type(x) == \"<class 'list'>\":`", correct: false}
      - {text: "`if type(x) is \"list\":`", correct: false}
      - {text: "`if x == list:`", correct: false}
    answer: |-
      ```python
      def taille(x):
          if isinstance(x, list):
              return len(x)
          return 0
      ```
      `type(x)` est la classe `list`, un objet, jamais égal à une chaîne. On compare à la classe elle-même, de
      préférence avec `isinstance`.
  - key: bug-list-masquee
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: 'list' object is not callable` :
      ```python
      list = [3, 1, 2]
      lettres = list("abc")
      print(lettres)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renommer la variable : `nombres = [3, 1, 2]`", correct: true}
      - {text: "Écrire `lettres = list[\"abc\"]`, avec des crochets", correct: false}
      - {text: "Écrire `lettres = [list(\"abc\")]`, dans une liste", correct: false}
      - {text: "Écrire `lettres = list.copy(\"abc\")`", correct: false}
    answer: |-
      ```python
      nombres = [3, 1, 2]
      lettres = list("abc")
      print(lettres)
      ```
      `list` est un nom comme un autre, lié à la classe. `list = [3, 1, 2]` le lie à une liste, qu'on ne peut pas
      appeler. On évite de réutiliser les noms intégrés (`list`, `dict`, `id`, `type`, `input`).
  - key: def-identite
    format: definition
    question: "Qu'est-ce que l'identité d'un objet Python ?"
    choices:
      - {text: "Ce qui le distingue de tout autre objet vivant, donné par `id()`", correct: true}
      - {text: "Le nom de la variable par laquelle on l'a créé", correct: false}
      - {text: "Sa valeur, qui le distingue des objets de contenu différent", correct: false}
      - {text: "Son type, qui le distingue des objets d'autres classes", correct: false}
    answer: "L'identité ne change jamais pendant la vie de l'objet. `is` la compare ; deux objets égaux (`==`) peuvent avoir des identités différentes."
  - key: def-premiere-classe
    format: definition
    question: "Qu'est-ce qu'une fonction « de première classe » ?"
    choices:
      - {text: "Une fonction qu'on manipule comme une valeur : nommer, passer, renvoyer", correct: true}
      - {text: "Une fonction définie au premier niveau d'un module, hors de toute classe", correct: false}
      - {text: "Une fonction intégrée, écrite en C, plus rapide que les autres", correct: false}
      - {text: "La première méthode d'une classe, appelée à la création d'un objet", correct: false}
    answer: "En Python, toutes les fonctions le sont : `sorted(mots, key=len)` passe la fonction `len` en argument, et un décorateur reçoit et renvoie une fonction."
  - key: def-nom
    format: definition
    question: "Qu'est-ce qu'une variable, en Python ?"
    choices:
      - {text: "Un nom lié à un objet, dans un espace de noms", correct: true}
      - {text: "Une case mémoire typée, qui contient une valeur", correct: false}
      - {text: "Un objet qui garde une copie de la valeur affectée", correct: false}
      - {text: "Une référence constante, qu'on ne peut plus réaffecter", correct: false}
    answer: "L'affectation lie le nom à l'objet ; plusieurs noms peuvent désigner le même objet, et un nom peut ensuite désigner un objet d'un autre type."
  - key: def-type
    format: definition
    question: "Qu'est-ce que le type d'un objet ?"
    choices:
      - {text: "Sa classe, qui fixe les opérations qu'il accepte ; donné par `type()`", correct: true}
      - {text: "La déclaration de la variable qui le désigne, faite à l'affectation", correct: false}
      - {text: "La taille en mémoire de l'objet, donnée par `sys.getsizeof()`", correct: false}
      - {text: "Une étiquette facultative, que l'interpréteur vérifie à chaque appel", correct: false}
    answer: "Le type appartient à l'objet, pas au nom : `type(3)` est `int`. Les annotations de type, elles, ne sont pas vérifiées à l'exécution."
