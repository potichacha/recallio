notion: nouveautes
lesson: |-
  Une version de Python sort chaque année, en octobre. Voici ce qu'il faut savoir citer des trois dernières.

  **Python 3.12 (2023)**

  - **La syntaxe des génériques** (PEP 695) : `def premier[T](xs: list[T]) -> T:`, `class Boite[T]:`, et les alias
    `type Point = tuple[float, float]`.
  - **Les f-strings sans limites** (PEP 701) : on peut y réutiliser les mêmes guillemets, `f"{", ".join(noms)}"`, et
    écrire des expressions sur plusieurs lignes.
  - Un GIL par sous-interpréteur (PEP 684, côté C), les objets immortels (PEP 683), `sys.monitoring` (PEP 669).
  - `itertools.batched`, `typing.override` ; des messages d'erreur encore meilleurs. `distutils` est retiré.

  **Python 3.13 (2024)**

  - **Un nouveau terminal interactif** : édition sur plusieurs lignes, couleurs, historique ; et des traces d'erreur en
    couleurs.
  - **Le build sans GIL**, expérimental (PEP 703), et un **compilateur JIT** expérimental (PEP 744), à activer à la
    compilation.
  - **Les modules morts retirés** (PEP 594) : `cgi`, `cgitb`, `crypt`, `telnetlib`, `nntplib`...
  - `copy.replace`, `warnings.deprecated` (PEP 702), `queue.Queue.shutdown`.

  **Python 3.14 (2025)**

  - **Les annotations évaluées à la demande** (PEP 649, 749) : plus besoin de guillemets pour une classe définie plus
    loin ; le module `annotationlib` les lit.
  - **Les t-strings** (PEP 750) : `t"Bonjour {nom}"` donne un objet `Template` (module `string.templatelib`), qui garde
    le texte et les valeurs séparés, pour qu'une bibliothèque les échappe avant de les assembler (SQL, HTML).
  - **Les sous-interpréteurs** en Python (PEP 734) : `concurrent.interpreters` et `InterpreterPoolExecutor`.
  - **Le build sans GIL officiellement pris en charge** (PEP 779), toujours optionnel.
  - `except ValueError, TypeError:` sans parenthèses (PEP 758) ; un `return`, `break` ou `continue` dans un `finally`
    donne un `SyntaxWarning` (PEP 765).
  - `compression.zstd` (PEP 784), `python -m asyncio ps` pour inspecter les tâches d'un processus, la coloration
    syntaxique dans le terminal, `Path.copy` et `Path.move`, `map(..., strict=True)`. Sous Linux, `multiprocessing`
    démarre ses processus avec `forkserver` par défaut.

  **Pourquoi suivre les versions** : depuis 3.11, chaque version accélère l'interpréteur ; les messages d'erreur
  s'améliorent ; et chaque version n'est maintenue que cinq ans. Le passage se prépare : les modules retirés, les
  avertissements de dépréciation, les extensions compilées à mettre à jour.

  **En entretien** : « En 3.12, la syntaxe des génériques et les f-strings sans limites ; en 3.13, le nouveau
  terminal, le build sans GIL et le JIT expérimentaux, et le retrait des vieux modules ; en 3.14, les annotations
  évaluées à la demande, les t-strings, les sous-interpréteurs et le build sans GIL pris en charge. Et depuis 3.11,
  chaque version est plus rapide. »
cards:
  - key: t-strings
    format: course
    question: "Qu'apportent les t-strings de Python 3.14, comme `t\"Bonjour {nom}\"` ?"
    choices:
      - {text: "Un objet `Template`, qui garde le texte et les valeurs séparés", correct: true}
      - {text: "Une f-string évaluée plus tard, au moment de l'affichage", correct: false}
      - {text: "Une chaîne traduite selon la langue de l'utilisateur", correct: false}
      - {text: "Une chaîne dont les accolades sont gardées telles quelles", correct: false}
    answer: "Une bibliothèque reçoit les morceaux de texte et les valeurs à part : elle peut échapper les valeurs (SQL, HTML) avant d'assembler. Une f-string, elle, renvoie aussitôt une chaîne."
  - key: annotations-differees
    format: course
    question: "Que change Python 3.14 pour les annotations de type (PEP 649) ?"
    choices:
      - {text: "Elles sont évaluées à la demande, et non plus à la définition", correct: true}
      - {text: "Elles sont vérifiées par l'interpréteur à chaque appel", correct: false}
      - {text: "Elles sont retirées du bytecode, et deviennent illisibles", correct: false}
      - {text: "Elles deviennent obligatoires sur chaque paramètre", correct: false}
    answer: "Une annotation peut désormais nommer une classe définie plus loin, sans guillemets. On les lit avec `annotationlib` ; l'interpréteur ne les vérifie toujours pas."
  - key: generiques-312
    format: course
    question: "Quelle syntaxe Python 3.12 a-t-il introduite pour les fonctions génériques ?"
    choices:
      - {text: "`def premier[T](xs: list[T]) -> T:`", correct: true}
      - {text: "`def premier<T>(xs: list<T>) -> T:`", correct: false}
      - {text: "`generic def premier(xs: list[T]) -> T:`", correct: false}
      - {text: "`def premier(xs: list[T]) -> T where T:`", correct: false}
    answer: "Les paramètres de type se déclarent entre crochets après le nom (PEP 695), sans `TypeVar` à part. `class Boite[T]:` et `type Alias = ...` suivent la même idée."
  - key: terminal-313
    format: course
    question: "Quelle nouveauté de Python 3.13 touche le terminal interactif ?"
    choices:
      - {text: "Un nouveau terminal : édition sur plusieurs lignes, couleurs, historique", correct: true}
      - {text: "Le terminal accepte enfin `await` au premier niveau, partout", correct: false}
      - {text: "Le terminal exécute chaque ligne dans un nouveau processus", correct: false}
      - {text: "Le terminal est remplacé par Jupyter, installé avec Python", correct: false}
    answer: "Hérité de PyPy, il permet de rappeler et de modifier un bloc entier. Python 3.14 y ajoute la coloration syntaxique."
  - key: vf-except-sans-parentheses
    format: true-false
    question: "Depuis Python 3.14, `except ValueError, TypeError:` est permis sans parenthèses."
    truth: true
    answer: "C'est la PEP 758, quand il n'y a pas de `as`. Avec `as erreur`, les parenthèses restent obligatoires."
  - key: vf-distutils-retire
    format: true-false
    question: "Python 3.12 a retiré le module `distutils` de la bibliothèque standard."
    truth: true
    answer: "Déprécié depuis 3.10 (PEP 632) ; `setuptools` et les outils de construction modernes le remplacent."
  - key: vf-jit-par-defaut
    format: true-false
    question: "Python 3.14 active par défaut un compilateur JIT dans tous ses binaires."
    truth: false
    answer: "Le JIT reste expérimental et désactivé par défaut ; il faut un binaire compilé avec lui, et le demander."
  - key: vf-guillemets-f-string
    format: true-false
    question: "Depuis Python 3.12, une f-string peut réutiliser ses propres guillemets dans ses accolades."
    truth: true
    answer: "La PEP 701 a donné une vraie grammaire aux f-strings : `f\"{\", \".join(noms)}\"` est valide."
  - key: qcm-zstd
    format: multiple-choice
    question: "Quel module de Python 3.14 compresse avec Zstandard ?"
    choices:
      - {text: "`compression.zstd`", correct: true}
      - {text: "`zstd`", correct: false}
      - {text: "`zlib.zstd`", correct: false}
      - {text: "`gzip.zstd`", correct: false}
    answer: "La PEP 784 crée le paquet `compression`, qui accueille `zstd` (et réexporte `gzip`, `bz2`, `lzma`, `zlib`)."
  - key: qcm-alias-type
    format: multiple-choice
    question: "Quelle version de Python a introduit `type Point = tuple[float, float]` ?"
    choices:
      - {text: "Python 3.12", correct: true}
      - {text: "Python 3.10", correct: false}
      - {text: "Python 3.13", correct: false}
      - {text: "Python 3.14", correct: false}
    answer: "L'instruction `type` vient de la PEP 695, avec la syntaxe des génériques, en 3.12."
  - key: qcm-return-dans-finally
    format: multiple-choice
    question: "Que signale Python 3.14 pour un `return` écrit dans un bloc `finally` ?"
    choices:
      - {text: "Un `SyntaxWarning`, car il avalerait l'exception en cours", correct: true}
      - {text: "Une `SyntaxError` : le programme ne démarre plus", correct: false}
      - {text: "Rien : c'est une écriture recommandée depuis 3.14", correct: false}
      - {text: "Un `DeprecationWarning` à chaque exécution du bloc", correct: false}
    answer: "La PEP 765 avertit dès la compilation : un `return` (ou `break`, `continue`) dans un `finally` fait disparaître l'exception qui remontait."
  - key: qcm-batched
    format: multiple-choice
    question: "Quelle fonction, ajoutée à `itertools` en 3.12, découpe un itérable en paquets de n éléments ?"
    choices:
      - {text: "`itertools.batched`", correct: true}
      - {text: "`itertools.chunked`", correct: false}
      - {text: "`itertools.grouper`", correct: false}
      - {text: "`itertools.islice`", correct: false}
    answer: "`batched(\"abcde\", 2)` donne `('a', 'b')`, `('c', 'd')`, `('e',)`. `islice` prend une tranche ; `grouper` n'était qu'une recette de la documentation."
  - key: situation-passer-a-314
    format: scenario
    question: |-
      Ton équipe est sur Python 3.10 et hésite à passer à 3.14. Quel argument avances-tu en premier ?
    choices:
      - {text: "L'interpréteur est nettement plus rapide depuis 3.11, sans rien changer au code", correct: true}
      - {text: "Python 3.14 supprime le GIL, et tous les threads tournent en parallèle", correct: false}
      - {text: "Python 3.14 vérifie les annotations de type à l'exécution", correct: false}
      - {text: "Python 3.14 compile chaque script en un exécutable autonome", correct: false}
    answer: |-
      Le gain de vitesse depuis 3.11 est gratuit ; s'y ajoutent les messages d'erreur, la syntaxe des génériques, les
      t-strings. Le build par défaut garde son GIL, et les annotations ne sont toujours pas vérifiées.
  - key: situation-requetes-sql
    format: scenario
    question: |-
      Ton code construit des requêtes SQL avec des f-strings, au risque d'injections. Quelle nouveauté de 3.14 aide une
      bibliothèque à le rendre sûr ?
    choices:
      - {text: "Les t-strings : la bibliothèque reçoit les valeurs à part, et peut les échapper", correct: true}
      - {text: "Les annotations évaluées à la demande, qui vérifient les types des valeurs", correct: false}
      - {text: "Les sous-interpréteurs, qui isolent chaque requête dans son interpréteur", correct: false}
      - {text: "Le `SyntaxWarning` sur les f-strings qui contiennent du SQL", correct: false}
    answer: |-
      Une f-string assemble tout de suite : la bibliothèque reçoit une chaîne où les valeurs sont déjà mêlées au SQL.
      Un `Template` lui donne le texte et les valeurs séparément. (Les requêtes paramétrées restent la règle.)
  - key: situation-import-cgi
    format: scenario
    question: |-
      Un vieux script échoue sous Python 3.13 sur `ModuleNotFoundError: No module named 'cgi'`. Que se passe-t-il ?
    choices:
      - {text: "Le module a été retiré en 3.13 (PEP 594) : il faut le remplacer", correct: true}
      - {text: "Le module a été renommé `cgi2`, qu'il suffit d'importer", correct: false}
      - {text: "Le module n'est disponible que dans le build sans GIL", correct: false}
      - {text: "L'environnement virtuel est corrompu : il faut le recréer", correct: false}
    answer: |-
      La PEP 594 a retiré une vingtaine de modules anciens et peu maintenus (`cgi`, `telnetlib`, `crypt`...). On les
      remplace (`email.message` pour analyser des en-têtes, un cadriciel web pour le CGI), ou l'on installe un portage.
  - key: situation-archives-zst
    format: scenario
    question: |-
      Ton projet, sur Python 3.14, doit lire des archives `.zst` sans ajouter de dépendance. Que choisis-tu ?
    choices:
      - {text: "`compression.zstd`, ajouté à la bibliothèque standard en 3.14", correct: true}
      - {text: "`zlib`, qui lit tous les formats de compression", correct: false}
      - {text: "`gzip`, en renommant les fichiers en `.gz`", correct: false}
      - {text: "`shutil.unpack_archive`, qui décompresse tout format", correct: false}
    answer: |-
      Zstandard est entré dans la bibliothèque standard avec la PEP 784. `zlib` et `gzip` ne connaissent que leur
      propre format.
