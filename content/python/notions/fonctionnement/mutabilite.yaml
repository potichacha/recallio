notion: mutabilite
lesson: |-
  Un objet est **mutable** si sa valeur peut changer sur place, **immuable** sinon.

  | Immuables | Mutables |
  |---|---|
  | `int`, `float`, `complex`, `bool`, `None` | `list` |
  | `str`, `bytes` | `dict` |
  | `tuple`, `frozenset` | `set`, `bytearray` |
  | | la plupart des objets de tes classes |

  **« Modifier » un immuable crée un nouvel objet.** Les méthodes d'une chaîne renvoient une nouvelle chaîne, et
  `s += "!"` lie le nom `s` à un nouvel objet ; les autres noms qui désignaient l'ancien le gardent.

  ```python
  texte = "abc"
  autre = texte
  texte += "d"           # nouvel objet : autre vaut toujours "abc"
  texte.upper()          # renvoie "ABCD", que personne ne garde : texte ne change pas

  nombres = [1, 2]
  alias = nombres
  nombres.append(3)      # le même objet change : alias voit [1, 2, 3]
  nombres += [4]         # sur une liste, += modifie aussi sur place
  nombres = nombres + [5]  # + crée une nouvelle liste : alias garde [1, 2, 3, 4]
  ```

  **Un tuple qui contient une liste** : le tuple garde toujours les mêmes éléments, mais la liste qu'il contient peut
  changer. `t = (1, [2])` puis `t[1].append(3)` réussit. Piège célèbre : `t[1] += [3]` modifie la liste **puis**
  lève `TypeError`, car il tente aussi de réaffecter `t[1]`.

  **Pourquoi c'est important.**

  - **Les clés de dictionnaire et les éléments d'un `set`** doivent être hachables : en pratique, immuables. On prend
    un tuple, pas une liste ; un `frozenset`, pas un `set`.
  - **Les fonctions** reçoivent l'objet lui-même : modifier un argument mutable se voit chez l'appelant. Une fonction
    qui ne doit pas surprendre renvoie un nouvel objet.
  - **Le partage** : un objet immuable se partage sans risque, entre fonctions ou entre threads.
  - **Les performances** : `s += morceau` dans une boucle peut recopier la chaîne à chaque tour ; on rassemble les
    morceaux dans une liste, puis `"".join(morceaux)`.

  **En entretien** : « Les nombres, chaînes, tuples et `frozenset` sont immuables : les « modifier » crée un nouvel
  objet. Les listes, dictionnaires et ensembles sont mutables : les modifications se voient par tous les noms qui les
  désignent, y compris dans une fonction qui les reçoit. Seuls les immuables font de bonnes clés de dictionnaire. »
tour:
  - title: Mutable ou immuable
    text: |-
      Certains objets se modifient **sur place** : les listes, les dictionnaires, les ensembles. D'autres sont
      **immuables** : les nombres, les chaînes, les tuples. « Modifier » un immuable crée un nouvel objet.

      - `nombres.append(3)` change la liste : tous les noms qui la désignent le voient.
      - `texte += "d"` crée une nouvelle chaîne et y lie `texte` ; `autre` garde l'ancienne.
      - Un tuple ne change pas, mais une liste rangée dedans, si.

      Essaie : remplace `nombres.append(3)` par `nombres = nombres + [3]`, et regarde `alias`.
    example:
      files:
        main.py: |-
          nombres = [1, 2]
          alias = nombres
          nombres.append(3)
          print(alias)

          texte = "abc"
          autre = texte
          texte += "d"
          print(autre, texte)

          point = (1, [2, 3])
          point[1].append(4)
          print(point)

          try:
              point[0] = 9
          except TypeError as erreur:
              print("TypeError :", erreur)
      output: |-
        [1, 2, 3]
        abc abcd
        (1, [2, 3, 4])
        TypeError : 'tuple' object does not support item assignment
    task:
      instructions: |-
        `ajouter_bonus` modifie la liste qu'elle reçoit : après l'appel, `notes` a changé, elle aussi. Réécris-la pour
        qu'elle renvoie une **nouvelle** liste, sans toucher à `notes`. Le programme doit afficher `[12, 15] [14, 17]`.
      starter:
        main.py: |-
          def ajouter_bonus(notes, bonus):
              for i in range(len(notes)):
                  notes[i] += bonus
              return notes


          notes = [12, 15]
          avec_bonus = ajouter_bonus(notes, 2)
          print(notes, avec_bonus)
      solution:
        main.py: |-
          def ajouter_bonus(notes, bonus):
              return [note + bonus for note in notes]


          notes = [12, 15]
          avec_bonus = ajouter_bonus(notes, 2)
          print(notes, avec_bonus)
      output: |-
        [12, 15] [14, 17]
cards:
  - key: types-immuables
    format: course
    question: "Lesquels de ces types sont tous immuables ?"
    choices:
      - {text: "`int`, `str`, `tuple`, `frozenset`", correct: true}
      - {text: "`list`, `dict`, `set`, `bytearray`", correct: false}
      - {text: "`str`, `list`, `tuple`, `dict`", correct: false}
      - {text: "`int`, `set`, `bytes`, `list`", correct: false}
    answer: "Les nombres, les chaînes, les `bytes`, les tuples et les `frozenset` sont immuables ; les listes, dictionnaires, ensembles et `bytearray` sont mutables."
  - key: plus-egal-sur-chaine
    format: course
    question: "Que fait `s += \"!\"` quand `s` est une chaîne ?"
    choices:
      - {text: "Il crée une nouvelle chaîne, puis y lie le nom `s`", correct: true}
      - {text: "Il ajoute `!` à la fin de la chaîne existante, sur place", correct: false}
      - {text: "Il lève une `TypeError`, car une chaîne est immuable", correct: false}
      - {text: "Il modifie la chaîne pour tous les noms qui la désignent", correct: false}
    answer: "Une chaîne ne change jamais : `+=` en fabrique une nouvelle. Un autre nom qui désignait l'ancienne chaîne la garde telle quelle."
  - key: cle-et-mutabilite
    format: course
    question: "Pourquoi les clés d'un dictionnaire sont-elles, en pratique, des objets immuables ?"
    choices:
      - {text: "Leur hachage ne doit pas changer une fois la clé rangée", correct: true}
      - {text: "Les objets immuables occupent moins de mémoire que les autres", correct: false}
      - {text: "Le dictionnaire copie ses clés, ce qui est impossible pour un mutable", correct: false}
      - {text: "Les objets mutables ne peuvent pas être comparés avec `==`", correct: false}
    answer: "Le dictionnaire range une clé selon son hachage. Si la clé changeait, son hachage aussi, et on ne la retrouverait plus : les types mutables intégrés ne sont donc pas hachables."
  - key: tuple-contenant-une-liste
    format: course
    question: "Un tuple qui contient une liste est-il totalement immuable ?"
    choices:
      - {text: "Non : le tuple garde les mêmes éléments, mais la liste peut changer", correct: true}
      - {text: "Oui : le tuple rend immuable tout ce qu'il contient", correct: false}
      - {text: "Non : on peut aussi remplacer la liste par une autre", correct: false}
      - {text: "Oui, mais seulement tant que la liste est vide", correct: false}
    answer: "Le tuple fixe ses références, pas les objets qu'elles désignent. `t[1].append(3)` réussit ; `t[1] = []` lève `TypeError`. Un tel tuple n'est pas hachable."
  - key: vf-upper-sur-place
    format: true-false
    question: "`nom.upper()` modifie la chaîne `nom` sur place."
    truth: false
    answer: "Il renvoie une nouvelle chaîne. Pour garder le résultat : `nom = nom.upper()`."
  - key: vf-liste-dans-tuple
    format: true-false
    question: "Après `t = (1, [2])`, l'instruction `t[1].append(3)` réussit."
    truth: true
    answer: "On modifie la liste, pas le tuple : `t` vaut ensuite `(1, [2, 3])`."
  - key: vf-frozenset-dans-un-set
    format: true-false
    question: "Un `frozenset` peut être un élément d'un `set`."
    truth: true
    answer: "Immuable, il est hachable. Un `set` ordinaire, mutable, ne peut pas être l'élément d'un autre `set`."
  - key: vf-plus-un-modifie
    format: true-false
    question: "Quand `x` désigne un entier, `x += 1` modifie cet objet entier."
    truth: false
    answer: "Un entier est immuable : `x += 1` crée (ou retrouve) l'entier suivant, et y lie le nom `x`. Les autres noms qui désignaient l'ancien n'en voient rien."
  - key: qcm-modifiable-sur-place
    format: multiple-choice
    question: "Lequel de ces objets peut-on modifier sur place ?"
    choices:
      - {text: "`bytearray(b\"abc\")`", correct: true}
      - {text: "`b\"abc\"`", correct: false}
      - {text: "`\"abc\"`", correct: false}
      - {text: "`(\"a\", \"b\", \"c\")`", correct: false}
    answer: "`bytearray` est la version mutable de `bytes` : `ba[0] = 65` marche. Les `bytes`, les chaînes et les tuples sont immuables."
  - key: qcm-cle-valide
    format: multiple-choice
    question: "Laquelle de ces clés de dictionnaire est valide ?"
    choices:
      - {text: "`(\"Paris\", \"Lyon\")`", correct: true}
      - {text: "`[\"Paris\", \"Lyon\"]`", correct: false}
      - {text: "`{\"Paris\", \"Lyon\"}`", correct: false}
      - {text: "`{\"Paris\": \"Lyon\"}`", correct: false}
    answer: "Un tuple de chaînes est immuable et hachable. Une liste, un ensemble ou un dictionnaire, mutables, lèvent une `TypeError` : ils ne sont pas hachables."
  - key: qcm-plus-dans-une-fonction
    format: multiple-choice
    question: "Une fonction reçoit une liste et fait `liste = liste + [1]`. L'appelant voit-il le changement ?"
    choices:
      - {text: "Non : `+` crée une nouvelle liste, liée au seul nom local", correct: true}
      - {text: "Oui : une liste est toujours modifiée là où on la reçoit", correct: false}
      - {text: "Oui, mais seulement si la fonction renvoie `None`", correct: false}
      - {text: "Non, car Python copie les listes passées en argument", correct: false}
    answer: "`+` fabrique une nouvelle liste. Avec `liste += [1]` ou `liste.append(1)`, la liste de l'appelant changerait. Python ne copie jamais les arguments."
  - key: qcm-pourquoi-chaines-immuables
    format: multiple-choice
    question: "Quel avantage les chaînes tirent-elles d'être immuables ?"
    choices:
      - {text: "Elles sont hachables, et se partagent sans risque", correct: true}
      - {text: "Elles se concatènent plus vite qu'une liste", correct: false}
      - {text: "Elles occupent toujours moins d'un octet par caractère", correct: false}
      - {text: "Elles se comparent avec `is` plutôt qu'avec `==`", correct: false}
    answer: "Une chaîne sert de clé de dictionnaire, et on la passe à une fonction sans craindre qu'elle soit modifiée. On les compare toujours avec `==`."
  - key: code-plus-egal-dans-un-tuple
    format: code-output
    question: |-
      ```python
      t = ([1],)
      try:
          t[0] += [2]
      except TypeError:
          print("erreur", end=" ")
      print(t)
      ```
    answer: "`+=` étend d'abord la liste sur place, puis tente de réaffecter `t[0]`, ce qu'un tuple refuse : l'erreur est levée, mais la liste a déjà changé."
    check:
      output: "erreur ([1, 2],)"
    choices:
      - {text: "`erreur ([1, 2],)`", correct: true}
      - {text: "`erreur ([1],)`", correct: false}
      - {text: "`([1, 2],)`", correct: false}
      - {text: "`erreur ([1], [2])`", correct: false}
  - key: code-methode-de-chaine-ignoree
    format: code-output
    question: |-
      ```python
      s = "chat"
      s.upper()
      s.replace("c", "m")
      print(s)
      ```
    answer: "Les méthodes d'une chaîne renvoient de nouvelles chaînes, que personne ne garde ici : `s` n'a pas changé."
    check:
      output: "chat"
    choices:
      - {text: "`chat`", correct: true}
      - {text: "`MHAT`", correct: false}
      - {text: "`CHAT`", correct: false}
      - {text: "`mhat`", correct: false}
  - key: code-argument-modifie-ou-reaffecte
    format: code-output
    question: |-
      ```python
      def modifier(liste, nombre):
          liste.append(nombre)
          nombre += 1
          liste = [0]

      xs, n = [1], 5
      modifier(xs, n)
      print(xs, n)
      ```
    answer: "`append` modifie la liste de l'appelant ; `nombre += 1` et `liste = [0]` ne font que lier des noms locaux à de nouveaux objets."
    check:
      output: "[1, 5] 5"
    choices:
      - {text: "`[1, 5] 5`", correct: true}
      - {text: "`[0] 6`", correct: false}
      - {text: "`[1, 5] 6`", correct: false}
      - {text: "`[1] 5`", correct: false}
  - key: code-plus-cree-une-liste
    format: code-output
    question: |-
      ```python
      a = [1]
      b = a
      a = a + [2]
      b += [3]
      print(a, b)
      ```
    answer: "`a + [2]` crée une nouvelle liste, liée à `a` seul. `b` désigne toujours la liste d'origine, que `+=` étend sur place."
    check:
      output: "[1, 2] [1, 3]"
    choices:
      - {text: "`[1, 2] [1, 3]`", correct: true}
      - {text: "`[1, 2, 3] [1, 2, 3]`", correct: false}
      - {text: "`[1, 2] [1, 2, 3]`", correct: false}
      - {text: "`[1, 2, 3] [1, 3]`", correct: false}
  - key: bug-resultat-de-strip-perdu
    format: bug-fix
    question: |-
      Ce programme affiche `[  ana  ]` au lieu de `[Ana]` :
      ```python
      nom = "  ana  "
      nom.strip()
      nom.capitalize()
      print(f"[{nom}]")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`nom = nom.strip().capitalize()`", correct: true}
      - {text: "`nom.strip().capitalize()`, en une seule ligne", correct: false}
      - {text: "`nom.strip(); nom = nom.capitalize()`", correct: false}
      - {text: "`nom = nom.capitalize().strip` sans parenthèses", correct: false}
    answer: |-
      ```python
      nom = "  ana  "
      nom = nom.strip().capitalize()
      print(f"[{nom}]")
      ```
      Une chaîne est immuable : ses méthodes renvoient une nouvelle chaîne, qu'il faut garder. Ici, on chaîne les deux
      appels et l'on réaffecte `nom`.
  - key: bug-liste-comme-cle
    format: bug-fix
    question: |-
      Ce programme s'arrête sur `TypeError: cannot use 'list' as a dict key (unhashable type: 'list')` :
      ```python
      distances = {}
      distances[["Paris", "Lyon"]] = 465
      print(distances)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Une clé tuple : `distances[(\"Paris\", \"Lyon\")] = 465`", correct: true}
      - {text: "Une clé copiée : `distances[[\"Paris\", \"Lyon\"].copy()] = 465`", correct: false}
      - {text: "Une clé ensemble : `distances[{\"Paris\", \"Lyon\"}] = 465`", correct: false}
      - {text: "Une clé triée : `distances[sorted([\"Paris\", \"Lyon\"])] = 465`", correct: false}
    answer: |-
      ```python
      distances = {}
      distances[("Paris", "Lyon")] = 465
      print(distances)
      ```
      Une liste est mutable, donc pas hachable ; une copie, un `set` ou le résultat de `sorted` (une liste) non plus.
      Un tuple de chaînes l'est.
  - key: bug-fonction-modifie-l-appelant
    format: bug-fix
    question: |-
      Ce programme affiche `[3, 4] [3, 4]` : la liste `mesures` de l'appelant a perdu sa valeur négative.
      ```python
      def sans_negatifs(valeurs):
          for v in list(valeurs):
              if v < 0:
                  valeurs.remove(v)
          return valeurs

      mesures = [3, -1, 4]
      propres = sans_negatifs(mesures)
      print(mesures, propres)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`return [v for v in valeurs if v >= 0]`, sans `remove`", correct: true}
      - {text: "`for v in valeurs:` à la place de `for v in list(valeurs):`", correct: false}
      - {text: "`valeurs = list(valeurs)` après la boucle, avant `return`", correct: false}
      - {text: "`return valeurs.copy()` à la place de `return valeurs`", correct: false}
    answer: |-
      ```python
      def sans_negatifs(valeurs):
          return [v for v in valeurs if v >= 0]
      ```
      La fonction reçoit la liste de l'appelant, et `remove` la modifie sur place. Une compréhension crée une nouvelle
      liste. Copier après coup est trop tard : l'original est déjà modifié.
  - key: bug-champ-de-namedtuple
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une `AttributeError` à la ligne `p.x = 5` :
      ```python
      from collections import namedtuple

      Point = namedtuple("Point", "x y")
      p = Point(2, 3)
      p.x = 5
      print(p)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`p = p._replace(x=5)`", correct: true}
      - {text: "`p[0] = 5`", correct: false}
      - {text: "`setattr(p, \"x\", 5)`", correct: false}
      - {text: "`p.x.update(5)`", correct: false}
    answer: |-
      ```python
      p = Point(2, 3)
      p = p._replace(x=5)
      print(p)
      ```
      Un `namedtuple` est un tuple, donc immuable : ni attribut ni indice ne se modifient, et `setattr` échoue de même.
      `_replace` crée un nouveau point.
  - key: situation-concatenation-en-boucle
    format: scenario
    question: |-
      Ton collègue construit un rapport de 100 000 lignes avec `rapport += ligne` dans une boucle. Que lui proposes-tu ?
    choices:
      - {text: "De rassembler les lignes dans une liste, puis `\"\".join(lignes)`", correct: true}
      - {text: "De remplacer `rapport += ligne` par `rapport = rapport + ligne`", correct: false}
      - {text: "D'écrire `rapport.append(ligne)` sur la chaîne `rapport`", correct: false}
      - {text: "De convertir chaque ligne en `bytes` avant de l'ajouter", correct: false}
    answer: |-
      Une chaîne est immuable : chaque `+=` peut recopier tout le rapport, d'où un coût quadratique (CPython l'évite
      parfois, sans garantie). `join` calcule la taille une fois et copie chaque ligne une seule fois.
  - key: situation-configuration-figee
    format: scenario
    question: |-
      Ton module expose une configuration lue au démarrage, que le reste du programme ne doit jamais modifier. Que
      choisis-tu ?
    choices:
      - {text: "Une dataclass `frozen=True`, ou un `MappingProxyType` sur le dictionnaire", correct: true}
      - {text: "Un dictionnaire global, avec un commentaire qui interdit de le modifier", correct: false}
      - {text: "Une liste de couples, plus difficile à modifier qu'un dictionnaire", correct: false}
      - {text: "Un dictionnaire copié avec `dict()` à chaque lecture, sans autre protection", correct: false}
    answer: |-
      Une dataclass gelée lève une erreur à toute affectation, et `types.MappingProxyType` donne une vue en lecture
      seule d'un dictionnaire. Une copie par lecture protège, mais coûte à chaque accès et n'empêche rien d'écrire.
  - key: situation-positions-visitees
    format: scenario
    question: |-
      Ton algorithme de parcours de grille doit mémoriser les positions `(x, y)` déjà visitées dans un `set`. Comment
      représentes-tu une position ?
    choices:
      - {text: "Par un tuple `(x, y)`, immuable et hachable", correct: true}
      - {text: "Par une liste `[x, y]`, plus facile à modifier", correct: false}
      - {text: "Par un dictionnaire `{\"x\": x, \"y\": y}`, plus lisible", correct: false}
      - {text: "Par un `set` `{x, y}`, qui se range dans un autre `set`", correct: false}
    answer: |-
      Seuls des objets hachables entrent dans un `set`. Une liste ou un dictionnaire lèveraient `TypeError` ; un
      `set` aussi, et `{x, y}` confondrait de plus `(1, 2)` et `(2, 1)`.
  - key: situation-liste-partagee
    format: scenario
    question: |-
      Deux parties de ton programme partagent la même liste de commandes. L'affichage, qui ne devait que lire, l'a triée
      sur place, et le traitement est perturbé. Que fais-tu ?
    choices:
      - {text: "Tu passes à l'affichage un tuple, ou il trie une copie avec `sorted`", correct: true}
      - {text: "Tu tries la liste une seconde fois, pour retrouver l'ordre d'origine", correct: false}
      - {text: "Tu déclares la liste avec `global` dans les deux parties du programme", correct: false}
      - {text: "Tu passes à l'affichage un `set`, que `sort` ne peut pas modifier", correct: false}
    answer: |-
      Un objet mutable partagé se modifie pour tout le monde. Un tuple ne se trie pas sur place, et `sorted` renvoie
      une nouvelle liste. Un `set` perdrait l'ordre et les doublons.
