notion: introspection
lesson: |-
  L'**introspection**, c'est examiner un objet pendant l'exécution : son type, ses attributs, ses méthodes, sa
  signature. Python le permet partout, puisque tout est objet.

  | Fonction | Rôle |
  |---|---|
  | `type(x)`, `isinstance(x, T)` | le type ; l'appartenance à un type ou ses sous-classes |
  | `dir(x)` | la liste triée des noms accessibles sur `x`, ceux de sa classe compris ; sans argument, ceux de la portée courante |
  | `vars(x)`, `x.__dict__` | le dictionnaire des attributs **propres** à l'objet |
  | `getattr(x, "nom", defaut)` | lit un attribut dont le nom est dans une chaîne ; `defaut` évite l'`AttributeError` |
  | `setattr(x, "nom", v)`, `delattr(x, "nom")` | écrit, supprime un attribut par son nom |
  | `hasattr(x, "nom")` | appelle `getattr`, et renvoie `False` sur une `AttributeError` |
  | `callable(x)` | peut-on appeler `x` ? (fonctions, classes, objets avec `__call__`) |
  | `x.__class__`, `f.__name__`, `f.__doc__`, `f.__module__` | des attributs spéciaux |

  ```python
  class Config:
      niveau = "info"                 # attribut de classe

      def __init__(self):
          self.debug = False          # attribut d'instance

  c = Config()
  vars(c)                     # {'debug': False} : l'instance seulement
  "niveau" in dir(c)          # True : dir voit aussi la classe
  getattr(c, "niveau")        # 'info'
  getattr(c, "couleur", None) # None, sans erreur
  setattr(c, "debug", True)
  ```

  **Le module `inspect`** va plus loin : `inspect.signature(f)` (les paramètres et leurs défauts),
  `inspect.getsource(f)`, `inspect.getmembers(x)`, `inspect.isclass`, `inspect.iscoroutinefunction`.

  **Les usages** : appeler une méthode choisie par son nom (`getattr(objet, "action_" + nom)()`), écrire un
  sérialiseur ou un outil de test générique, charger des greffons, déboguer. **Les limites** : un objet à `__slots__` n'a
  pas de `__dict__` (`vars` lève `TypeError`) ; `__getattr__` peut inventer des attributs que `dir` ne montre pas ; et
  trop d'introspection rend le code difficile à suivre : on la garde pour les outils génériques.

  **En entretien** : « Python examine les objets à l'exécution : `type` et `isinstance`, `dir` pour tous les noms
  accessibles, `vars` pour les attributs propres, `getattr`, `setattr` et `hasattr` pour accéder à un attribut par son
  nom, et `inspect` pour les signatures. Je m'en sers pour du code générique, comme appeler une méthode choisie par son
  nom. »
cards:
  - key: role-de-dir
    format: course
    question: "Que renvoie `dir(obj)` ?"
    choices:
      - {text: "La liste triée des noms accessibles sur l'objet, ceux de sa classe compris", correct: true}
      - {text: "Le dictionnaire des attributs propres à l'objet, avec leurs valeurs", correct: false}
      - {text: "Le chemin du fichier où la classe de l'objet est définie", correct: false}
      - {text: "La liste des méthodes de l'objet, sans ses attributs", correct: false}
    answer: "`dir` liste les noms : attributs de l'instance, de sa classe et de ses parents, méthodes spéciales comprises. Pour les valeurs propres à l'instance, c'est `vars`."
  - key: getattr-avec-defaut
    format: course
    question: "Que fait `getattr(obj, \"x\", 0)` quand `obj` n'a pas d'attribut `x` ?"
    choices:
      - {text: "Il renvoie `0`", correct: true}
      - {text: "Il lève une `AttributeError`", correct: false}
      - {text: "Il crée l'attribut `x`, avec la valeur `0`", correct: false}
      - {text: "Il renvoie `None`", correct: false}
    answer: "Le troisième argument est la valeur par défaut. Sans lui, `getattr` lève `AttributeError` ; il ne crée jamais d'attribut, c'est le rôle de `setattr`."
  - key: vars-ou-dir
    format: course
    question: "Quelle différence entre `vars(obj)` et `dir(obj)` ?"
    choices:
      - {text: "`vars` donne les attributs propres et leurs valeurs ; `dir`, tous les noms accessibles", correct: true}
      - {text: "`vars` liste les variables du module ; `dir`, les attributs de l'objet", correct: false}
      - {text: "`vars` liste les méthodes ; `dir`, les attributs de données", correct: false}
      - {text: "Aucune : `vars` est un ancien nom de `dir`, gardé pour compatibilité", correct: false}
    answer: "`vars(obj)` est le `__dict__` de l'instance. `dir(obj)` ajoute ce qui vient de la classe et des parents, sans les valeurs."
  - key: module-inspect
    format: course
    question: "À quoi sert le module `inspect` ?"
    choices:
      - {text: "À examiner les fonctions et classes : signature, source, membres", correct: true}
      - {text: "À mesurer le temps passé dans chaque fonction du programme", correct: false}
      - {text: "À vérifier les annotations de type à chaque appel de fonction", correct: false}
      - {text: "À suivre l'exécution pas à pas, comme un débogueur", correct: false}
    answer: "`inspect.signature(f)` donne les paramètres, `getsource` le code, `getmembers` les membres. Le temps passé, c'est `cProfile` ; le pas à pas, `pdb`."
  - key: vf-hasattr
    format: true-false
    question: "`hasattr(obj, \"x\")` appelle `getattr(obj, \"x\")`, et renvoie `False` si une `AttributeError` est levée."
    truth: true
    answer: "C'est sa définition. Une propriété qui lève une autre exception la laisse donc remonter."
  - key: vf-vars-slots
    format: true-false
    question: "`vars(obj)` fonctionne sur tout objet, même d'une classe à `__slots__`."
    truth: false
    answer: "Une classe à `__slots__` (sans `__dict__` parmi eux) n'a pas de dictionnaire d'attributs : `vars` lève `TypeError`."
  - key: vf-dir-sans-argument
    format: true-false
    question: "`dir()` appelé sans argument liste les noms de la portée courante."
    truth: true
    answer: "Dans une fonction, ses variables locales ; au niveau du module, ses noms globaux."
  - key: vf-classe-appelable
    format: true-false
    question: "`callable(x)` renvoie `True` quand `x` est une classe."
    truth: true
    answer: "Appeler une classe crée une instance. Les fonctions et les objets qui définissent `__call__` sont aussi appelables."
  - key: qcm-methode-par-nom
    format: multiple-choice
    question: "Comment appeler la méthode de `obj` dont le nom est dans la chaîne `action` ?"
    choices:
      - {text: "`getattr(obj, action)()`", correct: true}
      - {text: "`obj.action()`", correct: false}
      - {text: "`obj[action]()`", correct: false}
      - {text: "`eval(action)(obj)`", correct: false}
    answer: "`getattr` lit l'attribut dont le nom est dans la chaîne, puis on l'appelle. `obj.action()` cherche une méthode nommée littéralement `action` ; un objet ordinaire ne s'indexe pas ; `eval` est dangereux."
  - key: qcm-nom-du-type
    format: multiple-choice
    question: "Que vaut `type([1]).__name__` ?"
    choices:
      - {text: "`'list'`", correct: true}
      - {text: "`\"<class 'list'>\"`", correct: false}
      - {text: "`'List'`", correct: false}
      - {text: "`'object'`", correct: false}
    answer: "`__name__` est le nom court de la classe. `<class 'list'>` est son `repr`, ce qu'affiche `print(type([1]))`."
  - key: qcm-appelable
    format: multiple-choice
    question: "Quelle fonction dit si un objet peut être appelé ?"
    choices:
      - {text: "`callable(x)`", correct: true}
      - {text: "`hasattr(x, \"call\")`", correct: false}
      - {text: "`isinstance(x, function)`", correct: false}
      - {text: "`inspect.isclass(x)`", correct: false}
    answer: "`callable` couvre les fonctions, les classes et les objets à `__call__`. `function` n'est pas un nom intégré, et la méthode spéciale s'appelle `__call__`."
  - key: qcm-attributs-instance
    format: multiple-choice
    question: "Où sont rangés les attributs d'instance d'un objet ordinaire ?"
    choices:
      - {text: "Dans `obj.__dict__`", correct: true}
      - {text: "Dans `obj.__slots__`", correct: false}
      - {text: "Dans `type(obj).__dict__`", correct: false}
      - {text: "Dans `obj.__attrs__`", correct: false}
    answer: "Chaque instance a son dictionnaire, que `vars(obj)` renvoie. `type(obj).__dict__` contient les attributs et méthodes de la classe ; `__attrs__` n'existe pas."
  - key: trous-getattr
    format: fill-in
    question: |-
      Complète pour lire l'attribut `nom`, ou obtenir `None` s'il n'existe pas :
      ```python
      valeur = ___(objet, "nom", None)
      ```
    blanks:
      - [getattr]
    answer: "`getattr` avec une valeur par défaut ne lève pas d'`AttributeError`."
  - key: trous-hasattr
    format: fill-in
    question: |-
      Complète pour n'appeler `fermer` que si l'objet a cette méthode :
      ```python
      if ___(ressource, "fermer"):
          ressource.fermer()
      ```
    blanks:
      - [hasattr]
    answer: "`hasattr` teste la présence d'un attribut par son nom."
  - key: trous-setattr
    format: fill-in
    question: |-
      Complète pour donner à chaque attribut la valeur lue dans le dictionnaire :
      ```python
      for nom, valeur in reglages.items():
          ___(config, nom, valeur)
      ```
    blanks:
      - [setattr]
    answer: "`setattr(objet, nom, valeur)` écrit l'attribut dont le nom est dans une chaîne."
  - key: trous-vars
    format: fill-in
    question: |-
      Complète pour afficher le dictionnaire des attributs propres à `p` :
      ```python
      print(___(p))
      ```
    blanks:
      - [vars]
    answer: "`vars(p)` renvoie `p.__dict__`."
  - key: code-getattr-hasattr
    format: code-output
    question: |-
      ```python
      class Config:
          debug = False

      c = Config()
      print(getattr(c, "debug"), getattr(c, "niveau", "info"), hasattr(c, "niveau"))
      ```
    answer: "`debug` vient de la classe ; `niveau` n'existe pas : `getattr` renvoie la valeur par défaut, sans créer l'attribut, et `hasattr` répond `False`."
    check:
      output: "False info False"
    choices:
      - {text: "`False info False`", correct: true}
      - {text: "`False info True`", correct: false}
      - {text: "`False None False`", correct: false}
      - {text: "Une `AttributeError` sur `niveau`", correct: false}
  - key: code-vars-instance
    format: code-output
    question: |-
      ```python
      class Point:
          dimension = 2

          def __init__(self, x):
              self.x = x

      p = Point(3)
      print(vars(p), "dimension" in dir(p))
      ```
    answer: "`vars` ne montre que les attributs de l'instance ; `dir` voit aussi ceux de la classe, comme `dimension`."
    check:
      output: "{'x': 3} True"
    choices:
      - {text: "`{'x': 3} True`", correct: true}
      - {text: "`{'dimension': 2, 'x': 3} True`", correct: false}
      - {text: "`{'x': 3} False`", correct: false}
      - {text: "`{'dimension': 2, 'x': 3} False`", correct: false}
  - key: code-setattr-en-boucle
    format: code-output
    question: |-
      ```python
      class Objet:
          pass

      o = Objet()
      for nom, valeur in [("a", 1), ("b", 2)]:
          setattr(o, nom, valeur)
      print(o.a + o.b, sorted(vars(o)))
      ```
    answer: "`setattr` crée les attributs `a` et `b` sur l'instance ; `vars(o)` est leur dictionnaire, dont `sorted` trie les clés."
    check:
      output: "3 ['a', 'b']"
    choices:
      - {text: "`3 ['a', 'b']`", correct: true}
      - {text: "`3 [1, 2]`", correct: false}
      - {text: "`12 ['a', 'b']`", correct: false}
      - {text: "Une `AttributeError` sur `o.a`", correct: false}
  - key: code-signature
    format: code-output
    question: |-
      ```python
      import inspect

      def envoyer(destinataire, sujet="", *, urgent=False):
          pass

      print(inspect.signature(envoyer))
      ```
    answer: "La signature reprend les paramètres, leurs valeurs par défaut et le `*` qui rend `urgent` nommé seulement."
    check:
      output: "(destinataire, sujet='', *, urgent=False)"
    choices:
      - {text: "`(destinataire, sujet='', *, urgent=False)`", correct: true}
      - {text: "`(destinataire, sujet, urgent)`", correct: false}
      - {text: "`envoyer(destinataire, sujet='', urgent=False)`", correct: false}
      - {text: "`('destinataire', 'sujet', 'urgent')`", correct: false}
