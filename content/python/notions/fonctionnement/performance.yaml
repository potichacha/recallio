notion: performance
lesson: |-
  **D'abord mesurer.** Le temps d'un programme se concentre presque toujours dans quelques endroits, qu'on devine mal.
  On mesure, on corrige le plus gros, on mesure de nouveau.

  **Mesurer un extrait : `timeit`.** Il répète l'extrait des milliers de fois et garde le meilleur temps.

  ```bash
  python -m timeit "sorted(range(1000))"
  python -m timeit -s "xs = list(range(10_000)); s = set(xs)" "9_999 in s"
  ```

  ```python
  import timeit
  timeit.timeit("sorted(xs)", setup="xs = list(range(1000))", number=1000)
  ```

  **Trouver où va le temps : `cProfile`.** Il compte les appels et le temps de chaque fonction.

  ```bash
  python -m cProfile -s cumtime script.py
  ```

  | Colonne | Sens |
  |---|---|
  | `ncalls` | nombre d'appels |
  | `tottime` | temps passé dans la fonction elle-même |
  | `cumtime` | temps passé dans la fonction **et tout ce qu'elle appelle** |

  Pour mesurer une durée à la main, `time.perf_counter()` : une horloge monotone et précise (`time.time()` peut sauter
  si l'horloge du système change).

  **Puis accélérer, dans cet ordre.**

  1. **Le bon algorithme et la bonne structure** : `x in un_set` est en O(1), `x in une_liste` en O(n) ; un `dict` pour
     retrouver par clé ; `collections.deque` pour retirer au début (`list.pop(0)` est en O(n)) ; `heapq` pour le plus
     petit.
  2. **Ne pas refaire le travail** : sortir un calcul invariant de la boucle ; mémoriser avec `functools.cache`.
  3. **Laisser travailler le C** : fonctions intégrées (`sum`, `min`, `sorted`), compréhensions plutôt qu'`append` en
     boucle, `"".join(morceaux)` plutôt que `+=` sur une chaîne.
  4. **Changer d'outil** : NumPy pour le calcul numérique vectorisé, des processus pour plusieurs cœurs, PyPy, ou une
     extension compilée pour le cœur du calcul.

  Depuis Python 3.11, l'interpréteur lui-même est nettement plus rapide (l'interpréteur spécialisant) : passer à une
  version récente est souvent le gain le moins cher.

  **En entretien** : « Je mesure avant d'optimiser : `cProfile` pour trouver les fonctions qui coûtent, `timeit` pour
  comparer deux écritures. Puis je corrige d'abord l'algorithme et les structures (un `set` pour les tests
  d'appartenance, un `dict` pour les recherches), j'évite le travail répété avec `functools.cache`, et je laisse le C
  travailler : fonctions intégrées, compréhensions, `join`, NumPy. »
cards:
  - key: mesurer-avant
    format: course
    question: "Pourquoi mesurer avant d'optimiser ?"
    choices:
      - {text: "Le temps se concentre dans peu d'endroits, qu'on devine mal", correct: true}
      - {text: "Une optimisation sans mesure ralentit toujours le programme", correct: false}
      - {text: "Python refuse de compiler un code optimisé sans profil", correct: false}
      - {text: "La mesure suffit à accélérer le programme, sans rien changer", correct: false}
    answer: "Optimiser ce qui ne coûte rien complique le code pour rien. Un profil montre la fonction qui prend 80 % du temps ; c'est elle qu'on corrige."
  - key: role-de-timeit
    format: course
    question: "Que mesure `timeit` ?"
    choices:
      - {text: "La durée d'un petit extrait, répété de nombreuses fois", correct: true}
      - {text: "Le temps passé dans chaque fonction d'un programme entier", correct: false}
      - {text: "La mémoire occupée par un extrait de code", correct: false}
      - {text: "L'heure à laquelle chaque ligne d'un script s'exécute", correct: false}
    answer: "En répétant l'extrait et en gardant le meilleur temps, `timeit` compare deux écritures sans être trompé par le bruit. Le profil d'un programme entier, c'est `cProfile`."
  - key: set-ou-liste
    format: course
    question: "Pourquoi `x in s` est-il bien plus rapide sur un `set` que sur une `list` de même taille ?"
    choices:
      - {text: "Le `set` trouve par hachage, en O(1) ; la liste parcourt, en O(n)", correct: true}
      - {text: "Le `set` est trié, et la recherche y est dichotomique", correct: false}
      - {text: "La liste copie ses éléments à chaque test d'appartenance", correct: false}
      - {text: "Le `set` garde en cache le résultat du dernier test", correct: false}
    answer: "Le hachage mène directement à la bonne case. Une liste compare ses éléments un à un. Un `set` n'est pas trié."
  - key: perf-counter
    format: course
    question: "Pourquoi utiliser `time.perf_counter()` plutôt que `time.time()` pour mesurer une durée ?"
    choices:
      - {text: "Elle est monotone et précise ; `time.time()` peut sauter si l'horloge change", correct: true}
      - {text: "Elle compte seulement le temps processeur, sans les attentes d'E/S", correct: false}
      - {text: "Elle renvoie une date lisible, plus facile à afficher", correct: false}
      - {text: "Elle met le programme en pause le temps de la mesure", correct: false}
    answer: "`time.time()` suit l'horloge murale, que le système peut corriger. Le temps processeur seul, c'est `time.process_time()`."
  - key: vf-join
    format: true-false
    question: "`\"\".join(morceaux)` est en général plus rapide que des `+=` répétés sur une chaîne."
    truth: true
    answer: "Les chaînes sont immuables : `+=` peut recopier tout le texte à chaque tour. `join` calcule la taille finale et copie chaque morceau une fois."
  - key: vf-cprofile-lignes
    format: true-false
    question: "cProfile mesure le temps par fonction, pas ligne par ligne."
    truth: true
    answer: "Il compte les appels et le temps de chaque fonction. Pour le détail par ligne, il faut un autre outil, comme `line_profiler`."
  - key: vf-comprehension-lente
    format: true-false
    question: "Une compréhension de liste est en général plus lente que la boucle `for` équivalente, avec `append`."
    truth: false
    answer: "Elle est en général plus rapide : pas de recherche de la méthode `append` à chaque tour, et une boucle plus courte pour l'interpréteur."
  - key: vf-deque-popleft
    format: true-false
    question: "`deque.popleft()` est en O(1), alors que `list.pop(0)` est en O(n)."
    truth: true
    answer: "Retirer le premier élément d'une liste décale tous les autres. Une `deque` est faite pour ajouter et retirer aux deux bouts."
  - key: qcm-commande-timeit
    format: multiple-choice
    question: "Quelle commande mesure un extrait depuis le terminal ?"
    choices:
      - {text: "`python -m timeit \"sorted(range(1000))\"`", correct: true}
      - {text: "`python -m cProfile \"sorted(range(1000))\"`", correct: false}
      - {text: "`python -X timeit \"sorted(range(1000))\"`", correct: false}
      - {text: "`python -m time \"sorted(range(1000))\"`", correct: false}
    answer: "Le module `timeit` se lance avec `-m` et répète l'extrait. `cProfile` attend un script, pas une expression ; `-X timeit` et le module `time` en ligne de commande n'existent pas."
  - key: qcm-mots-interdits
    format: multiple-choice
    question: "Ton code teste `if mot in mots_interdits` des millions de fois, sur une liste de 10 000 mots. Que changes-tu ?"
    choices:
      - {text: "Tu fais de `mots_interdits` un `set`", correct: true}
      - {text: "Tu tries `mots_interdits` avant chaque test", correct: false}
      - {text: "Tu fais de `mots_interdits` un tuple", correct: false}
      - {text: "Tu remplaces `in` par une boucle `for` explicite", correct: false}
    answer: "Chaque test passe de 10 000 comparaisons à un calcul de hachage. Un tuple se parcourt comme une liste, et trier à chaque test coûte encore plus."
  - key: qcm-cumtime
    format: multiple-choice
    question: "Quelle colonne de cProfile compte le temps passé dans une fonction et dans tout ce qu'elle appelle ?"
    choices:
      - {text: "`cumtime`", correct: true}
      - {text: "`tottime`", correct: false}
      - {text: "`ncalls`", correct: false}
      - {text: "`percall`", correct: false}
    answer: "`tottime` exclut les fonctions appelées, `ncalls` compte les appels. Trier par `cumtime` (`-s cumtime`) montre les grandes branches coûteuses."
  - key: qcm-functools-cache
    format: multiple-choice
    question: "Qu'apporte `@functools.cache` à une fonction récursive comme Fibonacci ?"
    choices:
      - {text: "Chaque valeur n'est calculée qu'une fois, puis relue", correct: true}
      - {text: "La fonction s'exécute dans plusieurs threads à la fois", correct: false}
      - {text: "La récursion est transformée en boucle par le compilateur", correct: false}
      - {text: "La fonction est compilée en code machine au premier appel", correct: false}
    answer: "Le décorateur mémorise le résultat par arguments : le calcul naïf, exponentiel, devient linéaire. Les arguments doivent être hachables."
  - key: trous-cprofile
    format: fill-in
    question: |-
      Complète pour profiler le script, trié par temps cumulé :
      ```bash
      python -m ___ -s cumtime script.py
      ```
    blanks:
      - [cProfile, profile]
    answer: "`python -m cProfile -s cumtime script.py` (le module `profile`, plus lent, accepte les mêmes options)."
  - key: trous-timeit
    format: fill-in
    question: |-
      Complète pour mesurer mille tris de `xs` :
      ```python
      import timeit

      duree = timeit.___("sorted(xs)", globals=globals(), number=1000)
      ```
    blanks:
      - [timeit]
    answer: "`timeit.timeit` renvoie la durée totale, en secondes, des `number` exécutions."
  - key: trous-perf-counter
    format: fill-in
    question: |-
      Complète pour mesurer la durée du traitement :
      ```python
      debut = time.___()
      traiter()
      print(time.___() - debut)
      ```
    blanks:
      - [perf_counter]
      - [perf_counter]
    answer: "`time.perf_counter()`, monotone et précise, deux fois."
  - key: trous-cache
    format: fill-in
    question: |-
      Complète pour ne calculer chaque terme qu'une fois :
      ```python
      import functools

      @functools.___
      def fib(n):
          return n if n < 2 else fib(n - 1) + fib(n - 2)
      ```
    blanks:
      - [cache, lru_cache]
    answer: "`@functools.cache` mémorise tous les résultats ; `lru_cache` aussi, limité par défaut à 128 entrées."
  - key: situation-reecrire-en-rust
    format: scenario
    question: |-
      Ton script prend 10 minutes, et un collègue propose de tout réécrire en Rust. Que fais-tu d'abord ?
    choices:
      - {text: "Tu le profiles avec cProfile, pour voir où va le temps", correct: true}
      - {text: "Tu réécris tout de suite la fonction qui te semble la plus lente", correct: false}
      - {text: "Tu lances le script avec l'option `-O`, qui l'optimise", correct: false}
      - {text: "Tu ajoutes des threads, pour qu'il utilise tous les cœurs", correct: false}
    answer: |-
      Souvent, une seule fonction (une recherche dans une liste, une requête répétée) coûte presque tout, et se corrige
      en quelques lignes. `-O` ne retire que les `assert` ; des threads n'accélèrent pas un calcul en pur Python.
  - key: situation-client-par-id
    format: scenario
    question: |-
      Le profil montre que 80 % du temps est passé dans une fonction qui cherche un client par son identifiant, en
      parcourant une liste de 100 000 clients. Que fais-tu ?
    choices:
      - {text: "Tu construis une fois un `dict` de l'identifiant vers le client", correct: true}
      - {text: "Tu tries la liste des clients avant chaque recherche", correct: false}
      - {text: "Tu parcours la liste dans un `ThreadPoolExecutor`", correct: false}
      - {text: "Tu remplaces la boucle par une compréhension de liste", correct: false}
    answer: |-
      Chaque recherche passe de O(n) à O(1) : c'est le gain qui compte. Une compréhension va un peu plus vite qu'une
      boucle, mais reste un parcours ; trier à chaque recherche coûte encore plus.
  - key: situation-comparer-deux-ecritures
    format: scenario
    question: |-
      Tu hésites entre deux façons de dédoublonner une liste en gardant l'ordre. Comment choisis-tu la plus rapide ?
    choices:
      - {text: "Tu les compares avec `timeit`, sur des données de taille réaliste", correct: true}
      - {text: "Tu choisis la plus courte, qui est forcément la plus rapide", correct: false}
      - {text: "Tu lances chacune une fois, avec `time.time()` avant et après", correct: false}
      - {text: "Tu les compares avec `cProfile`, sur une liste de trois éléments", correct: false}
    answer: |-
      `timeit` répète la mesure et écarte le bruit. Une mesure unique varie d'une exécution à l'autre, et trois
      éléments ne disent rien du comportement sur cent mille.
  - key: situation-flottants-numpy
    format: scenario
    question: |-
      Ta boucle Python applique une formule à des millions de flottants, et reste lente malgré tes optimisations. Que
      proposes-tu ?
    choices:
      - {text: "NumPy, qui applique la formule à tout le tableau, en C", correct: true}
      - {text: "Des threads, un par million de flottants à traiter", correct: false}
      - {text: "asyncio, pour traiter les flottants par lots concurrents", correct: false}
      - {text: "`functools.cache` sur la fonction qui applique la formule", correct: false}
    answer: |-
      Une opération vectorisée exécute la boucle en C, sur des tableaux compacts : souvent des dizaines de fois plus
      vite. Des threads restent limités par le GIL ; asyncio n'accélère aucun calcul ; des flottants tous différents ne
      profitent pas d'un cache.
