notion: cpython-bytecode
lesson: |-
  **CPython** est l'implémentation de référence de Python, écrite en C : c'est le `python` qu'on installe. Il n'exécute
  pas le texte source directement : il le **compile en bytecode**, puis une **machine virtuelle à pile** exécute ce
  bytecode, instruction par instruction.

  ```
  source .py  →  analyse  →  arbre syntaxique  →  compilation  →  bytecode (objet code)  →  machine virtuelle
  ```

  **Les objets code.** Chaque fonction, classe ou module compilé donne un **objet code** : `f.__code__`, avec ses
  instructions, ses constantes (`co_consts`), ses noms de variables locales (`co_varnames`). Le module **`dis`** les
  montre :

  ```python
  import dis

  def ajouter(a, b):
      return a + b

  dis.dis(ajouter)
  ```

  ```
    3           RESUME                   0

    4           LOAD_FAST_BORROW_LOAD_FAST_BORROW 1 (a, b)
                BINARY_OP                0 (+)
                RETURN_VALUE
  ```

  (sortie de Python 3.14 : les deux variables sont empilées, additionnées, puis la valeur au sommet de la pile est
  renvoyée.)

  **Les `.pyc`.** À l'import, le bytecode d'un module est mis en cache dans `__pycache__/` (`panier.cpython-314.pyc`) :
  au prochain import, s'il est à jour, CPython évite de recompiler. `python -B` ne les écrit pas. Le script lancé
  lui-même n'est pas mis en cache.

  **Le bytecode change à chaque version** : de nouvelles instructions apparaissent (`LOAD_FAST_BORROW` en 3.14), d'autres
  disparaissent. Un `.pyc` porte un numéro magique propre à sa version ; on ne s'appuie jamais sur le bytecode comme
  sur une interface stable.

  **De plus en plus rapide.**

  - **L'interpréteur spécialisant** (PEP 659, Python 3.11) : une instruction exécutée souvent se remplace par une
    version spécialisée pour les types rencontrés. Après mille appels de `ajouter(1, 2)`, `dis.dis(ajouter,
    adaptive=True)` montre `BINARY_OP_ADD_INT` au lieu de `BINARY_OP`.
  - **Un compilateur JIT** expérimental depuis 3.13 (PEP 744), qui traduit les portions chaudes en code machine.

  **Les autres implémentations** : **PyPy** (avec un JIT, souvent bien plus rapide sur du pur Python), **GraalPy** (sur
  la JVM de GraalVM), **MicroPython** (pour les microcontrôleurs).

  **En entretien** : « CPython compile le source en bytecode, mis en cache dans des `.pyc`, puis l'exécute sur une
  machine virtuelle à pile ; `dis` montre ce bytecode. Il change à chaque version. Depuis 3.11, l'interpréteur
  spécialise les instructions selon les types rencontrés, et un JIT expérimental existe depuis 3.13. »
cards:
  - key: avant-execution
    format: course
    question: "Que fait CPython d'un fichier `.py` avant de l'exécuter ?"
    choices:
      - {text: "Il le compile en bytecode, qu'exécute sa machine virtuelle", correct: true}
      - {text: "Il le compile en code machine, comme un compilateur C", correct: false}
      - {text: "Il le traduit en Java, exécuté ensuite par une JVM", correct: false}
      - {text: "Rien : il interprète le texte source ligne par ligne", correct: false}
    answer: "La compilation en bytecode est rapide et invisible ; c'est elle qui détecte les `SyntaxError` avant toute exécution. Le JIT expérimental traduit ensuite certaines portions en code machine."
  - key: contenu-pyc
    format: course
    question: "Que contient un fichier `.pyc` ?"
    choices:
      - {text: "Le bytecode compilé d'un module, mis en cache dans `__pycache__`", correct: true}
      - {text: "Le code machine du module, prêt à s'exécuter sans Python", correct: false}
      - {text: "Le code source du module, compressé pour aller plus vite", correct: false}
      - {text: "Les dépendances du module, téléchargées par `pip`", correct: false}
    answer: "Il évite de recompiler un module qui n'a pas changé. Il ne s'exécute qu'avec la même version de CPython, et ne cache pas le code source de façon fiable."
  - key: role-de-dis
    format: course
    question: "À quoi sert le module `dis` ?"
    choices:
      - {text: "À afficher le bytecode d'une fonction, instruction par instruction", correct: true}
      - {text: "À désactiver les avertissements de l'interpréteur", correct: false}
      - {text: "À distribuer un module sous forme de `.pyc`, sans source", correct: false}
      - {text: "À mesurer le temps passé dans chaque instruction", correct: false}
    answer: "`dis.dis(f)` désassemble l'objet code de `f`. Utile pour comprendre ce qu'une écriture coûte, ou pourquoi une opération n'est pas atomique."
  - key: interpreteur-specialisant
    format: course
    question: "Qu'a apporté l'interpréteur spécialisant de Python 3.11 ?"
    choices:
      - {text: "Des instructions qui s'adaptent aux types rencontrés, pour aller plus vite", correct: true}
      - {text: "La vérification des annotations de type pendant l'exécution", correct: false}
      - {text: "La compilation de chaque fonction en code machine dès le premier appel", correct: false}
      - {text: "L'exécution du bytecode sur plusieurs cœurs à la fois", correct: false}
    answer: "Une instruction générique comme `BINARY_OP` devient `BINARY_OP_ADD_INT` quand elle ne voit que des entiers. C'est une grande part du gain de vitesse de 3.11."
  - key: vf-bytecode-stable
    format: true-false
    question: "Le bytecode de CPython reste le même d'une version de Python à l'autre."
    truth: false
    answer: "Des instructions apparaissent et disparaissent à chaque version ; un `.pyc` porte un numéro magique propre à la sienne."
  - key: vf-machine-a-pile
    format: true-false
    question: "La machine virtuelle de CPython est une machine à pile."
    truth: true
    answer: "Les instructions empilent des valeurs (`LOAD_FAST`, `LOAD_CONST`), les consomment (`BINARY_OP`) et laissent le résultat au sommet de la pile."
  - key: vf-pyc-evite-compilation
    format: true-false
    question: "Un `.pyc` à jour évite de recompiler un module importé."
    truth: true
    answer: "CPython compare la date ou l'empreinte du source à celles enregistrées dans le `.pyc`. S'ils correspondent, il charge directement le bytecode."
  - key: vf-pypy-jit
    format: true-false
    question: "PyPy exécute Python avec un compilateur à la volée (JIT)."
    truth: true
    answer: "Il traduit les boucles chaudes en code machine, ce qui le rend souvent bien plus rapide que CPython sur du pur Python. Certaines extensions C y fonctionnent moins bien."
  - key: qcm-pycache
    format: multiple-choice
    question: "Où CPython range-t-il le bytecode compilé des modules importés ?"
    choices:
      - {text: "Dans un dossier `__pycache__`, à côté des sources", correct: true}
      - {text: "Dans le dossier `.venv` de l'environnement virtuel", correct: false}
      - {text: "Dans le dossier `site-packages` de l'installation", correct: false}
      - {text: "Dans un dossier `build`, créé par `pip`", correct: false}
    answer: "Le nom indique la version : `__pycache__/panier.cpython-314.pyc`. Plusieurs versions de Python cohabitent ainsi sans conflit."
  - key: qcm-objet-code
    format: multiple-choice
    question: "Quel attribut d'une fonction donne son objet code ?"
    choices:
      - {text: "`f.__code__`", correct: true}
      - {text: "`f.__bytecode__`", correct: false}
      - {text: "`f.__dict__`", correct: false}
      - {text: "`f.__func__`", correct: false}
    answer: "`f.__code__` porte le bytecode, les constantes (`co_consts`) et les noms des variables locales (`co_varnames`). `__func__` appartient aux méthodes liées."
  - key: qcm-option-b
    format: multiple-choice
    question: "Quelle option de la ligne de commande empêche Python d'écrire des `.pyc` ?"
    choices:
      - {text: "`-B`", correct: true}
      - {text: "`-O`", correct: false}
      - {text: "`-S`", correct: false}
      - {text: "`-E`", correct: false}
    answer: "`-B` (ou `PYTHONDONTWRITEBYTECODE`). `-O` retire les `assert`, `-S` n'importe pas `site`, `-E` ignore les variables d'environnement `PYTHON*`."
  - key: qcm-dis-change
    format: multiple-choice
    question: "Pourquoi `dis` montre-t-il des instructions différentes en 3.11 et en 3.14, pour la même fonction ?"
    choices:
      - {text: "Le jeu d'instructions du bytecode change d'une version à l'autre", correct: true}
      - {text: "`dis` affiche le code machine, qui dépend du processeur", correct: false}
      - {text: "Le bytecode dépend du système d'exploitation de la machine", correct: false}
      - {text: "`dis` choisit au hasard parmi plusieurs traductions possibles", correct: false}
    answer: "Le bytecode est un détail interne de CPython, qui l'adapte à chaque version (3.14 a par exemple `LOAD_FAST_BORROW`). Il ne dépend ni du processeur ni du système."
  - key: def-bytecode
    format: definition
    question: "Qu'est-ce que le bytecode de CPython ?"
    choices:
      - {text: "Une suite d'instructions simples, compilées depuis le source, pour sa machine virtuelle", correct: true}
      - {text: "Le code machine produit par CPython pour le processeur de la machine", correct: false}
      - {text: "La représentation en octets d'une chaîne de caractères, comme `b\"abc\"`", correct: false}
      - {text: "Le texte source d'un module, compressé dans un fichier `.pyc`", correct: false}
    answer: "Des instructions comme `LOAD_FAST` ou `BINARY_OP`, indépendantes du processeur, que l'interpréteur exécute une à une."
  - key: def-objet-code
    format: definition
    question: "Qu'est-ce qu'un objet code ?"
    choices:
      - {text: "Le résultat compilé d'une fonction ou d'un module : instructions, constantes, noms", correct: true}
      - {text: "Une fonction déjà appelée, avec ses arguments et son résultat", correct: false}
      - {text: "Un objet qui contient le texte source d'une fonction, sans le compiler", correct: false}
      - {text: "Un fichier `.py` ouvert en lecture par l'interpréteur", correct: false}
    answer: "Une fonction associe un objet code (`__code__`) à son contexte : variables globales, valeurs par défaut, fermeture. Plusieurs fonctions peuvent partager le même objet code."
  - key: def-jit
    format: definition
    question: "Qu'est-ce qu'un compilateur JIT (à la volée) ?"
    choices:
      - {text: "Un compilateur qui traduit en code machine, pendant l'exécution, le code souvent exécuté", correct: true}
      - {text: "Un compilateur qui traduit tout le programme en code machine avant de le lancer", correct: false}
      - {text: "Un outil qui vérifie les types du programme juste avant son exécution", correct: false}
      - {text: "Un interpréteur qui exécute le texte source sans aucune compilation", correct: false}
    answer: "Il observe ce qui s'exécute souvent, puis le compile pour le processeur. PyPy en a un ; CPython en a un expérimental depuis 3.13."
  - key: def-cpython
    format: definition
    question: "Qu'est-ce que CPython ?"
    choices:
      - {text: "L'implémentation de référence de Python, écrite en C", correct: true}
      - {text: "Une version de Python qui compile le code vers le langage C", correct: false}
      - {text: "Une bibliothèque qui permet d'appeler du C depuis Python", correct: false}
      - {text: "Un dialecte de Python, typé statiquement comme le C", correct: false}
    answer: "C'est le `python` de python.org. Cython, au nom voisin, compile un Python annoté en extensions C ; `ctypes` appelle des bibliothèques C."
