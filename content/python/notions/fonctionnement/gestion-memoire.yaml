notion: gestion-memoire
lesson: |-
  CPython gère la mémoire en deux étages : le **comptage de références**, qui libère presque tout, et un **ramasse-
  miettes des cycles**, qui s'occupe du reste.

  **Le comptage de références.** Chaque objet compte les références qui le désignent : noms, éléments de conteneurs,
  attributs. Une affectation, un ajout dans une liste, un passage en argument l'augmentent ; `del`, la fin d'une
  fonction ou une réaffectation le diminuent. **Dès qu'il tombe à zéro, l'objet est libéré**, aussitôt.

  ```python
  class Noeud:
      def __del__(self):
          print("libéré")

  n = Noeud()
  del n            # « libéré » s'affiche ici, tout de suite
  ```

  `del x` supprime **le nom** `x`, pas l'objet : l'objet n'est libéré que si plus rien d'autre ne le désigne.

  **Les cycles.** Deux objets qui se désignent l'un l'autre (`a.autre = b`, `b.autre = a`) gardent un compteur à 1 même
  quand le programme ne peut plus les atteindre. Le module **`gc`** les trouve : il examine les conteneurs par
  **générations**, plus souvent les objets jeunes, qui meurent en général tôt. `gc.collect()` force une collecte et
  renvoie le nombre d'objets inaccessibles trouvés ; `gc.disable()` n'arrête que lui, pas le comptage de références ;
  `gc.freeze()` met de côté les objets créés au démarrage.

  **Les références faibles** (`weakref`) désignent un objet **sans le garder en vie** : `weakref.ref(obj)`,
  `WeakValueDictionary` pour un cache qui se vide tout seul, `WeakSet`. Elles évitent aussi des cycles (un enfant qui
  pointe vers son parent).

  **Bon à savoir.**

  - `__del__` n'est pas un destructeur fiable : son moment dépend des cycles et de l'implémentation (PyPy n'a pas de
    comptage de références). Pour fermer une ressource, `with`.
  - `sys.getsizeof(x)` donne la taille de l'objet seul, pas celle de ce qu'il contient.
  - `tracemalloc` trouve les lignes qui allouent : on compare deux instantanés pour localiser une fuite.
  - Depuis 3.12, `None`, `True`, `False` et les petits entiers sont **immortels** : leur compteur ne change plus.
  - Les petits objets viennent de réserves (*pymalloc*) : la mémoire libérée n'est pas toujours rendue au système.

  **En entretien** : « CPython libère un objet dès que son compteur de références tombe à zéro ; un ramasse-miettes par
  générations, le module `gc`, s'occupe des cycles que le comptage ne voit pas. Les références faibles désignent un
  objet sans le garder en vie, pour les caches. Je ne compte pas sur `__del__` : je ferme les ressources avec `with`,
  et je cherche les fuites avec `tracemalloc`. »
cards:
  - key: quand-liberer
    format: course
    question: "Quand CPython libère-t-il un objet qui ne fait partie d'aucun cycle ?"
    choices:
      - {text: "Dès que son compteur de références tombe à zéro", correct: true}
      - {text: "Au prochain passage du ramasse-miettes, toutes les quelques secondes", correct: false}
      - {text: "À la fin de la fonction qui l'a créé, quoi qu'il arrive", correct: false}
      - {text: "Seulement à la fin du programme, quand l'interpréteur s'arrête", correct: false}
    answer: "Le comptage de références libère l'objet immédiatement, de façon déterministe. Un objet renvoyé par une fonction lui survit, tant qu'on le référence."
  - key: limite-du-comptage
    format: course
    question: "Pourquoi le comptage de références ne suffit-il pas à libérer toute la mémoire ?"
    choices:
      - {text: "Des objets qui se référencent en cycle ne tombent jamais à zéro", correct: true}
      - {text: "Le compteur déborde quand un objet a trop de références", correct: false}
      - {text: "Les objets immuables n'ont pas de compteur de références", correct: false}
      - {text: "Le compteur n'est mis à jour qu'à la fin de chaque fonction", correct: false}
    answer: "Dans un cycle, chaque objet garde l'autre en vie, même quand le programme ne peut plus les atteindre. Le module `gc` repère ces groupes isolés."
  - key: role-de-weakref
    format: course
    question: "À quoi sert le module `weakref` ?"
    choices:
      - {text: "À désigner un objet sans le garder en vie", correct: true}
      - {text: "À copier un objet sans copier ce qu'il contient", correct: false}
      - {text: "À libérer un objet tout de suite, même s'il est référencé", correct: false}
      - {text: "À mesurer la mémoire occupée par un objet et son contenu", correct: false}
    answer: "Une référence faible ne compte pas : quand les références ordinaires disparaissent, l'objet est libéré et la référence faible renvoie `None`. Idéal pour un cache."
  - key: trouver-une-fuite
    format: course
    question: "Quel outil de la bibliothèque standard montre quelles lignes allouent la mémoire qui grossit ?"
    choices:
      - {text: "`tracemalloc`", correct: true}
      - {text: "`timeit`", correct: false}
      - {text: "`sys.getrefcount`", correct: false}
      - {text: "`gc.disable`", correct: false}
    answer: "`tracemalloc.take_snapshot()`, deux fois, puis `compare_to` : on voit les lignes dont les allocations ont augmenté entre les deux instantanés."
  - key: vf-liberation-immediate
    format: true-false
    question: "Dans CPython, un objet hors de tout cycle est libéré dès que sa dernière référence disparaît."
    truth: true
    answer: "C'est le comptage de références : pas d'attente d'un ramasse-miettes. PyPy, qui n'a pas de comptage, libère plus tard."
  - key: vf-gc-disable
    format: true-false
    question: "`gc.disable()` désactive aussi le comptage de références."
    truth: false
    answer: "Il n'arrête que le ramasse-miettes des cycles. Les objets hors cycle continuent d'être libérés à zéro référence."
  - key: vf-getsizeof
    format: true-false
    question: "`sys.getsizeof(liste)` compte aussi la taille des éléments de la liste."
    truth: false
    answer: "Il ne mesure que l'objet liste : son en-tête et son tableau de références. Les éléments sont des objets à part."
  - key: vf-none-immortel
    format: true-false
    question: "Depuis Python 3.12, `None` est un objet immortel, dont le compteur de références ne change plus."
    truth: true
    answer: "C'est la PEP 683 : les objets immortels (`None`, `True`, `False`, les petits entiers) ne sont jamais libérés, et l'on ne touche plus à leur compteur."
  - key: qcm-effet-de-del
    format: multiple-choice
    question: "Que fait `del x` ?"
    choices:
      - {text: "Il supprime le nom `x` ; l'objet est libéré s'il n'a plus de référence", correct: true}
      - {text: "Il libère l'objet tout de suite, même si d'autres noms le désignent", correct: false}
      - {text: "Il vide l'objet, qui reste en mémoire avec une valeur nulle", correct: false}
      - {text: "Il marque l'objet pour le prochain passage du ramasse-miettes", correct: false}
    answer: "`del` retire une référence. Si une liste ou un autre nom désigne encore l'objet, il reste en vie."
  - key: qcm-cache-faible
    format: multiple-choice
    question: "Quelle structure garde des objets en cache sans les empêcher d'être libérés ?"
    choices:
      - {text: "`weakref.WeakValueDictionary`", correct: true}
      - {text: "`collections.OrderedDict`", correct: false}
      - {text: "`functools.lru_cache`", correct: false}
      - {text: "`dict`", correct: false}
    answer: "Ses valeurs sont des références faibles : une entrée disparaît quand l'objet n'est plus utilisé ailleurs. Les autres gardent leurs objets en vie."
  - key: qcm-del-pas-fiable
    format: multiple-choice
    question: "Pourquoi `__del__` est-il un mauvais endroit pour fermer une connexion ?"
    choices:
      - {text: "Son moment d'appel n'est pas garanti : cycles, autres implémentations", correct: true}
      - {text: "Python interdit d'appeler une méthode réseau dans `__del__`", correct: false}
      - {text: "`__del__` n'est appelée que si l'on a appelé `gc.collect()`", correct: false}
      - {text: "`__del__` est appelée deux fois, ce qui ferme deux connexions", correct: false}
    answer: "Un objet pris dans un cycle attend le ramasse-miettes ; PyPy libère plus tard. Un gestionnaire de contexte (`with`) ferme au moment voulu."
  - key: qcm-generations
    format: multiple-choice
    question: "Comment le ramasse-miettes des cycles de CPython limite-t-il son travail ?"
    choices:
      - {text: "Il range les objets par générations, et examine plus souvent les jeunes", correct: true}
      - {text: "Il n'examine que les objets créés par le thread principal", correct: false}
      - {text: "Il n'examine que les objets immuables, qui ne changent pas", correct: false}
      - {text: "Il examine tous les objets à chaque allocation, sans exception", correct: false}
    answer: "La plupart des objets meurent jeunes : les examiner souvent libère vite, et les objets anciens, examinés rarement, coûtent peu. Seuls les conteneurs sont suivis."
  - key: situation-memoire-qui-grossit
    format: scenario
    question: |-
      La mémoire de ton service grossit sans fin, de quelques Mo par heure. Que fais-tu d'abord ?
    choices:
      - {text: "Tu compares deux instantanés `tracemalloc`, pour voir quelles lignes allouent", correct: true}
      - {text: "Tu appelles `gc.collect()` toutes les minutes, pour libérer la mémoire", correct: false}
      - {text: "Tu redémarres le service chaque nuit, sans chercher plus loin", correct: false}
      - {text: "Tu désactives le ramasse-miettes avec `gc.disable()`", correct: false}
    answer: |-
      Une fuite en Python, c'est presque toujours une référence qu'on garde sans le vouloir : un cache sans limite,
      une liste globale. `tracemalloc` montre où sont faites les allocations qui s'accumulent ; forcer la collecte ne
      libère pas ce qui est encore référencé.
  - key: situation-cache-qui-retient
    format: scenario
    question: |-
      Un cache global, un `dict` d'identifiant vers objet, garde en vie de gros objets que plus personne n'utilise. Que
      fais-tu ?
    choices:
      - {text: "Un `WeakValueDictionary`, ou un cache borné comme `lru_cache(maxsize=...)`", correct: true}
      - {text: "Tu appelles `gc.collect()` après chaque ajout dans le cache", correct: false}
      - {text: "Tu ajoutes une méthode `__del__` aux objets mis en cache", correct: false}
      - {text: "Tu remplaces le `dict` par une liste de couples identifiant-objet", correct: false}
    answer: |-
      Le cache est une référence ordinaire : tant qu'il existe, l'objet vit. Des références faibles le laissent partir
      quand il n'est plus utilisé ailleurs ; un cache borné, lui, limite le nombre d'entrées.
  - key: situation-del-pour-fermer
    format: scenario
    question: |-
      Un collègue ferme ses connexions à la base dans la méthode `__del__` de sa classe `Depot`. Que lui proposes-tu ?
    choices:
      - {text: "Un gestionnaire de contexte : `with Depot() as depot:`", correct: true}
      - {text: "Un appel à `gc.collect()` après chaque utilisation du dépôt", correct: false}
      - {text: "Un `del depot` explicite, qui appelle `__del__` à coup sûr", correct: false}
      - {text: "Une référence faible vers le dépôt, pour qu'il soit libéré plus tôt", correct: false}
    answer: |-
      `__del__` n'est appelée qu'à la libération, que retarde un cycle, ou une autre implémentation. `del` ne libère
      pas si une autre référence existe. `with` ferme la connexion au moment précis de la sortie du bloc.
  - key: situation-temps-dans-le-gc
    format: scenario
    question: |-
      Ton traitement par lots crée des millions de petits objets sans aucun cycle, et le profileur montre un temps
      notable passé dans le ramasse-miettes. Que peux-tu faire ?
    choices:
      - {text: "Désactiver `gc` pendant le lot, puis appeler `gc.collect()` à la fin", correct: true}
      - {text: "Appeler `gc.collect()` après chaque objet créé, pour lisser le travail", correct: false}
      - {text: "Supprimer chaque objet avec `del` juste après l'avoir créé", correct: false}
      - {text: "Désactiver le comptage de références avec `gc.disable()`", correct: false}
    answer: |-
      Le ramasse-miettes se déclenche au fil des allocations, même sans cycle à trouver. Le suspendre pendant le lot
      évite ces passages inutiles ; le comptage de références continue de libérer les objets. On collecte à la fin.
  - key: def-comptage-references
    format: definition
    question: "Qu'est-ce que le comptage de références ?"
    choices:
      - {text: "Chaque objet compte ce qui le désigne, et est libéré à zéro", correct: true}
      - {text: "Le nombre de fois qu'une fonction est appelée, pour l'optimiser", correct: false}
      - {text: "Le parcours périodique de tous les objets pour trouver les morts", correct: false}
      - {text: "La liste des modules qui importent un module donné", correct: false}
    answer: "C'est le mécanisme principal de CPython : simple, immédiat, déterministe. Sa faiblesse : les cycles, qu'un ramasse-miettes complète."
  - key: def-reference-faible
    format: definition
    question: "Qu'est-ce qu'une référence faible ?"
    choices:
      - {text: "Une référence qui ne garde pas l'objet en vie", correct: true}
      - {text: "Une référence vers une copie de l'objet, en lecture seule", correct: false}
      - {text: "Une référence qu'un autre thread peut modifier sans verrou", correct: false}
      - {text: "Une référence qui libère l'objet au bout d'un délai", correct: false}
    answer: "Elle n'augmente pas le compteur de références : quand l'objet est libéré, la référence faible renvoie `None` (ou l'entrée de cache disparaît)."
  - key: def-cycle-references
    format: definition
    question: "Qu'est-ce qu'un cycle de références ?"
    choices:
      - {text: "Des objets qui se désignent l'un l'autre, directement ou en chaîne", correct: true}
      - {text: "Une boucle `for` qui crée un nouvel objet à chaque tour", correct: false}
      - {text: "Deux modules qui s'importent l'un l'autre au chargement", correct: false}
      - {text: "Un objet qui passe d'un thread à l'autre par une file", correct: false}
    answer: "Une liste qui se contient, un parent et son enfant qui se désignent : leurs compteurs ne tombent jamais à zéro, et seul le ramasse-miettes des cycles les libère."
  - key: def-objet-immortel
    format: definition
    question: "Qu'est-ce qu'un objet immortel, dans CPython 3.12 et plus ?"
    choices:
      - {text: "Un objet jamais libéré, dont le compteur de références ne change plus", correct: true}
      - {text: "Un objet sauvegardé sur disque, qui survit à la fin du programme", correct: false}
      - {text: "Un objet que le ramasse-miettes des cycles examine en premier", correct: false}
      - {text: "Un objet immuable, qu'on ne peut pas modifier après sa création", correct: false}
    answer: "`None`, `True`, `False` et les petits entiers le sont (PEP 683) : ne plus toucher à leur compteur évite des écritures, utiles entre interpréteurs et sans GIL."
