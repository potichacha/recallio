notion: is-egal
lesson: |-
  Python a deux comparaisons, qu'on confond souvent :

  | | Compare | Redéfinissable |
  |---|---|---|
  | `a == b` | les **valeurs** : appelle `a.__eq__(b)` | oui, par `__eq__` |
  | `a is b` | les **identités** : le même objet ? (`id(a) == id(b)`) | non |

  ```python
  a = [1, 2, 3]
  b = [1, 2, 3]
  c = a
  a == b      # True : même contenu
  a is b      # False : deux listes distinctes
  a is c      # True : deux noms pour le même objet
  ```

  **Quand utiliser `is`** : pour les **singletons** et les sentinelles, dont il n'existe qu'un exemplaire.

  ```python
  if resultat is None:          # et non == None
      ...
  MANQUANT = object()           # une sentinelle : unique par construction
  def lire(cle, defaut=MANQUANT):
      if defaut is MANQUANT:
          ...
  ```

  `x is None` est plus sûr que `x == None` : une classe peut redéfinir `__eq__` et se dire égale à `None`, alors que
  personne ne peut tromper `is`. Pour un booléen, on écrit simplement `if actif:`, ni `== True` ni `is True`.

  **Quand utiliser `==`** : pour tout le reste, nombres et chaînes compris. `x is 1000` ou `nom is "oui"` dépendent de
  détails de CPython (le cache des petits entiers, l'internement des chaînes) ; Python l'annonce par un
  `SyntaxWarning: "is" with 'int' literal. Did you mean "=="?`.

  **Les objets de tes classes** : sans `__eq__`, `==` compare les identités, comme `is`. Deux `Point(1, 2)` ne sont donc
  pas égaux, et `Point(1, 2) in points` répond `False`, tant que la classe ne définit pas `__eq__` (une dataclass le
  fait toute seule).

  **Un cas limite** : `float("nan")` n'est pas égal à lui-même (`nan == nan` vaut `False`), mais `nan is nan` vaut
  `True`, et `nan in [nan]` aussi, car `in` teste l'identité avant l'égalité.

  **En entretien** : « `==` compare les valeurs, par `__eq__`, et `is` les identités : le même objet ou non. J'utilise
  `is` pour `None` et les sentinelles, et `==` partout ailleurs, nombres et chaînes compris : `is` sur eux dépend des
  caches de CPython. Une classe sans `__eq__` compare par identité. »
tour:
  - title: "is ou == : l'identité ou l'égalité"
    text: |-
      Deux questions différentes :

      - `a == b` : ont-ils **la même valeur** ? Python appelle `__eq__`.
      - `a is b` : est-ce **le même objet** ?

      Deux listes au même contenu sont égales, mais distinctes. On réserve `is` à `None` : `if resultat is None:`.

      Une classe sans `__eq__` compare par identité : deux points aux mêmes coordonnées ne sont pas égaux.

      Essaie : remplace `b = [1, 2, 3]` par `b = a`.
    example:
      files:
        main.py: |-
          a = [1, 2, 3]
          b = [1, 2, 3]
          c = a
          print(a == b, a is b)
          print(a == c, a is c)

          resultat = None
          print(resultat is None)


          class Point:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y


          print(Point(1, 2) == Point(1, 2))
      output: |-
        True False
        True True
        True
        False
    task:
      instructions: |-
        Ajoute à `Point` une méthode `__eq__(self, autre)` qui compare `x` et `y`, pour que deux points aux mêmes
        coordonnées soient égaux. Le programme doit afficher `True False`.
      starter:
        main.py: |-
          class Point:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y


          p = Point(1, 2)
          q = Point(1, 2)
          print(p == q, p is q)
      solution:
        main.py: |-
          class Point:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y

              def __eq__(self, autre):
                  return (self.x, self.y) == (autre.x, autre.y)


          p = Point(1, 2)
          q = Point(1, 2)
          print(p == q, p is q)
      output: |-
        True False
cards:
  - key: difference-is-egal
    format: course
    question: "Quelle différence entre `a == b` et `a is b` ?"
    choices:
      - {text: "`==` compare les valeurs ; `is` dit si c'est le même objet", correct: true}
      - {text: "`==` compare les types ; `is` compare les valeurs", correct: false}
      - {text: "`is` est une écriture plus rapide de `==`, au même résultat", correct: false}
      - {text: "`==` compare les identités ; `is` compare les valeurs", correct: false}
    answer: "`a == b` appelle `a.__eq__(b)` ; `a is b` compare les identités, comme `id(a) == id(b)`. Deux listes au même contenu sont égales, sans être le même objet."
  - key: pourquoi-is-none
    format: course
    question: "Pourquoi écrire `resultat is None` plutôt que `resultat == None` ?"
    choices:
      - {text: "`None` est unique, et `==` peut être redéfini par la classe de `resultat`", correct: true}
      - {text: "`resultat == None` lève une `TypeError` quand `resultat` est un nombre", correct: false}
      - {text: "`resultat == None` vaut aussi `True` quand `resultat` vaut `0`", correct: false}
      - {text: "`is` convertit `resultat` en booléen avant de le comparer", correct: false}
    answer: "Il n'existe qu'un `None` : `is` répond sans ambiguïté, et aucune classe ne peut le tromper. `0 == None` vaut `False`, et `==` ne lève pas d'erreur."
  - key: egal-sans-eq
    format: course
    question: "Que compare `==` entre deux objets d'une classe qui ne définit pas `__eq__` ?"
    choices:
      - {text: "Leurs identités, comme `is`", correct: true}
      - {text: "Tous leurs attributs, un par un", correct: false}
      - {text: "Leur représentation `repr`", correct: false}
      - {text: "Leur type, sans regarder leur contenu", correct: false}
    answer: "Le `__eq__` hérité d'`object` compare les identités. Pour comparer par contenu, on définit `__eq__`, ou l'on écrit une dataclass."
  - key: egaux-donc-identiques
    format: course
    question: "Si `a == b` vaut `True`, que vaut `a is b` ?"
    choices:
      - {text: "Ça dépend : deux objets égaux peuvent être distincts", correct: true}
      - {text: "Toujours `True` : l'égalité implique l'identité", correct: false}
      - {text: "Toujours `False` : deux noms désignent deux objets", correct: false}
      - {text: "`True` pour les listes, `False` pour les nombres", correct: false}
    answer: "`[1] == [1]` est vrai, `[1] is [1]` est faux ; mais après `b = a`, les deux sont vrais. L'identité implique (presque toujours) l'égalité, pas l'inverse."
  - key: vf-is-implique-egal
    format: true-false
    question: "Pour tout objet `x`, `x is x` et `x == x` valent tous deux `True`."
    truth: false
    answer: "`float(\"nan\")` n'est pas égal à lui-même : `nan == nan` vaut `False`, alors que `nan is nan` vaut `True`."
  - key: vf-is-not-none
    format: true-false
    question: "`x is not None` est la façon idiomatique de tester qu'une valeur n'est pas `None`."
    truth: true
    answer: "C'est ce que recommande la PEP 8, plutôt que `x != None` ou `not x is None`."
  - key: vf-is-redefinissable
    format: true-false
    question: "Une classe peut redéfinir `is`, comme elle redéfinit `==` avec `__eq__`."
    truth: false
    answer: "Aucune méthode spéciale ne correspond à `is` : il compare toujours les identités. C'est pourquoi `is None` est infaillible."
  - key: vf-syntax-warning
    format: true-false
    question: "Python avertit d'un `SyntaxWarning` quand on écrit `x is 10`."
    truth: true
    answer: "Depuis 3.8 : « \"is\" with 'int' literal. Did you mean \"==\"? ». Le résultat dépendrait du cache des petits entiers."
  - key: qcm-absence-de-valeur
    format: multiple-choice
    question: "Quelle comparaison est idiomatique pour tester qu'une fonction n'a rien trouvé, quand elle renvoie `None` ?"
    choices:
      - {text: "`if resultat is None:`", correct: true}
      - {text: "`if resultat == None:`", correct: false}
      - {text: "`if resultat is \"None\":`", correct: false}
      - {text: "`if resultat == []:`", correct: false}
    answer: "`is None` compare à l'unique `None`. `== None` marche le plus souvent, mais peut être trompé par `__eq__` ; les deux autres testent tout autre chose."
  - key: qcm-listes-vides
    format: multiple-choice
    question: "Après `a = []` et `b = []`, que valent `a == b` et `a is b` ?"
    choices:
      - {text: "`True` et `False`", correct: true}
      - {text: "`True` et `True`", correct: false}
      - {text: "`False` et `False`", correct: false}
      - {text: "`False` et `True`", correct: false}
    answer: "Chaque `[]` crée une nouvelle liste : deux objets distincts, de même contenu. Seuls les immuables peuvent être partagés par l'interpréteur."
  - key: qcm-methode-de-egal
    format: multiple-choice
    question: "Quelle méthode spéciale `==` appelle-t-il ?"
    choices:
      - {text: "`__eq__`", correct: true}
      - {text: "`__is__`", correct: false}
      - {text: "`__cmp__`", correct: false}
      - {text: "`__hash__`", correct: false}
    answer: "`a == b` appelle `a.__eq__(b)`, puis `b.__eq__(a)` si le premier renvoie `NotImplemented`. `__cmp__` n'existe plus depuis Python 3."
  - key: qcm-usage-de-is
    format: multiple-choice
    question: "Pour quelles valeurs utilise-t-on `is` ?"
    choices:
      - {text: "Les singletons, comme `None`, et les sentinelles", correct: true}
      - {text: "Les chaînes, pour les comparer plus vite", correct: false}
      - {text: "Les petits entiers, qui sont mis en cache", correct: false}
      - {text: "Les listes, pour comparer leur contenu", correct: false}
    answer: "`is` n'a de sens que pour des objets uniques par construction. Pour les chaînes et les nombres, il dépend des caches de CPython : on compare avec `==`."
  - key: code-deux-listes
    format: code-output
    question: |-
      ```python
      a = [1, 2]
      b = [1, 2]
      c = b
      c.append(3)
      print(a == b, b is c, a)
      ```
    answer: "`b` et `c` désignent la même liste, qui reçoit 3 : elle n'est plus égale à `a`, qui n'a pas changé."
    check:
      output: "False True [1, 2]"
    choices:
      - {text: "`False True [1, 2]`", correct: true}
      - {text: "`True True [1, 2]`", correct: false}
      - {text: "`False False [1, 2]`", correct: false}
      - {text: "`False True [1, 2, 3]`", correct: false}
  - key: code-nan
    format: code-output
    question: |-
      ```python
      x = float("nan")
      print(x == x, x is x, x in [x])
      ```
    answer: "NaN n'est égal à rien, pas même à lui-même. Mais c'est bien le même objet, et `in` teste l'identité avant l'égalité."
    check:
      output: "False True True"
    choices:
      - {text: "`False True True`", correct: true}
      - {text: "`False True False`", correct: false}
      - {text: "`True True True`", correct: false}
      - {text: "`False False False`", correct: false}
  - key: code-classe-sans-eq
    format: code-output
    question: |-
      ```python
      class Carte:
          def __init__(self, valeur):
              self.valeur = valeur

      c1 = Carte(7)
      c2 = Carte(7)
      print(c1 == c2, c1 == c1)
      ```
    answer: "Sans `__eq__`, `==` compare les identités : deux cartes distinctes ne sont pas égales, même avec la même valeur."
    check:
      output: "False True"
    choices:
      - {text: "`False True`", correct: true}
      - {text: "`True True`", correct: false}
      - {text: "`False False`", correct: false}
      - {text: "`True False`", correct: false}
  - key: code-eq-trompeur
    format: code-output
    question: |-
      ```python
      class Toujours:
          def __eq__(self, autre):
              return True

      t = Toujours()
      print(t == None, t is None)
      ```
    answer: "`__eq__` peut répondre n'importe quoi, même être égal à `None`. `is` ne se laisse pas tromper."
    check:
      output: "True False"
    choices:
      - {text: "`True False`", correct: true}
      - {text: "`False False`", correct: false}
      - {text: "`True True`", correct: false}
      - {text: "`False True`", correct: false}
  - key: bug-is-sur-un-entier
    format: bug-fix
    question: |-
      Ce programme affiche `False`, et Python avertit : `SyntaxWarning: "is" with 'int' literal. Did you mean "=="?`
      ```python
      def est_le_seuil(n):
          return n is 1000

      print(est_le_seuil(int("1000")))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`return n == 1000`", correct: true}
      - {text: "`return n is int(1000)`", correct: false}
      - {text: "`return id(n) == id(1000)`", correct: false}
      - {text: "`return n is not 1000`", correct: false}
    answer: |-
      ```python
      def est_le_seuil(n):
          return n == 1000
      ```
      `int("1000")` crée un nouvel objet, distinct du littéral `1000`. On compare les valeurs avec `==` ; comparer les
      `id` revient au même que `is`.
  - key: bug-is-sur-une-chaine
    format: bug-fix
    question: |-
      Ce programme affiche `refusé`, alors que la saisie vaut bien `oui` :
      ```python
      saisie = "".join(["o", "u", "i"])
      if saisie is "oui":
          print("confirmé")
      else:
          print("refusé")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if saisie == \"oui\":`", correct: true}
      - {text: "`if saisie is \"oui\".strip():`", correct: false}
      - {text: "`if saisie is str(\"oui\"):`", correct: false}
      - {text: "`if id(saisie) == id(\"oui\"):`", correct: false}
    answer: |-
      ```python
      if saisie == "oui":
          print("confirmé")
      ```
      La chaîne construite par `join` est un autre objet que le littéral `"oui"` : `is` répond `False`. Les chaînes se
      comparent par leur valeur, avec `==`.
  - key: bug-produit-pas-trouve
    format: bug-fix
    question: |-
      Ce programme affiche `False`, alors que le panier contient le produit `A1` :
      ```python
      class Produit:
          def __init__(self, code):
              self.code = code

      panier = [Produit("A1")]
      print(Produit("A1") in panier)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Définir `__eq__` dans `Produit`, qui compare les codes", correct: true}
      - {text: "Remplacer `in` par `is` dans l'expression testée", correct: false}
      - {text: "Définir `__repr__` dans `Produit`, qui affiche le code", correct: false}
      - {text: "Ranger les produits dans un tuple plutôt qu'une liste", correct: false}
    answer: |-
      ```python
      class Produit:
          def __init__(self, code):
              self.code = code

          def __eq__(self, autre):
              return isinstance(autre, Produit) and self.code == autre.code
      ```
      `in` compare avec `==`, qui compare les identités tant que la classe n'a pas de `__eq__`. (Une dataclass écrit
      `__eq__` toute seule.)
  - key: bug-is-true
    format: bug-fix
    question: |-
      La configuration, lue d'un fichier JSON, vaut `{"actif": 1}`, et ce programme affiche `désactivé` :
      ```python
      config = {"actif": 1}
      if config["actif"] is True:
          print("activé")
      else:
          print("désactivé")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if config[\"actif\"]:`", correct: true}
      - {text: "`if config[\"actif\"] is 1:`", correct: false}
      - {text: "`if config[\"actif\"] is not False:`", correct: false}
      - {text: "`if config is True:`", correct: false}
    answer: |-
      ```python
      if config["actif"]:
          print("activé")
      else:
          print("désactivé")
      ```
      `1` n'est pas l'objet `True` : `is True` répond `False`. On teste la valeur de vérité. `is not False` accepterait
      aussi `0` ; `is 1` dépend du cache des entiers.
