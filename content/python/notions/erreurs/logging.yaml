notion: logging
lesson: |-
  `print` écrit sur la sortie standard, sans niveau, sans heure, sans moyen de le faire taire. Le module **`logging`**
  donne à chaque message un **niveau** et une **origine**, et laisse la configuration décider de ce qui s'affiche et
  où, sans toucher au code.

  ```python
  import logging

  logger = logging.getLogger(__name__)      # un logger par module, nommé comme lui


  def payer(commande):
      logger.info("paiement de la commande %s", commande.id)
      try:
          prestataire.debiter(commande)
      except PaiementRefuseError:
          logger.exception("paiement refusé pour %s", commande.id)   # niveau ERROR, avec la trace
          raise


  if __name__ == "__main__":                 # au point d'entrée du programme, une seule fois
      logging.basicConfig(level=logging.INFO,
                          format="%(asctime)s %(levelname)s %(name)s %(message)s")
  ```

  | Niveau | Valeur | Pour |
  |---|---|---|
  | `DEBUG` | 10 | le détail utile au développeur |
  | `INFO` | 20 | le déroulement normal : démarrage, commande traitée |
  | `WARNING` | 30 | une situation anormale, sans erreur : disque presque plein (**niveau par défaut**) |
  | `ERROR` | 40 | une opération a échoué |
  | `CRITICAL` | 50 | le programme ne peut plus continuer |

  - **Sans configuration**, seuls `WARNING` et au-dessus s'affichent, **sur la sortie d'erreur** (stderr).
  - **`getLogger(__name__)`** : les loggers forment une hiérarchie par les points (`app.paiement` est l'enfant de
    `app`). Un message **remonte** aux handlers des parents, jusqu'à la racine.
  - **Un handler** envoie les messages vers une destination (console, fichier, `RotatingFileHandler`...), **un
    formatter** les met en forme. `basicConfig` installe les deux sur la racine.
  - **On configure une fois, au point d'entrée.** `basicConfig` ne fait rien si la racine a déjà un handler (sauf avec
    `force=True`) ; et `logging.info(...)` appelé avant toute configuration installe la configuration par défaut.
  - **Une bibliothèque ne configure rien** : elle crée ses loggers, et laisse l'application décider.
  - **Les arguments à part** : `logger.info("utilisateur %s", nom)`. Le message n'est formaté que s'il est émis, et
    les outils regroupent les messages par modèle. Oublier le `%s` provoque un « --- Logging error --- ».
  - **`logger.exception(...)`**, dans un `except`, ajoute la trace ; `logger.error(..., exc_info=True)` aussi.
  - **Jamais de secret ni de donnée personnelle** dans un journal : il est lu, copié et conservé.
  - Faire taire une bibliothèque bavarde : `logging.getLogger("urllib3").setLevel(logging.WARNING)`.

  **En entretien** : « `logging` donne aux messages un niveau (`DEBUG` à `CRITICAL`, `WARNING` par défaut) et un
  logger par module (`getLogger(__name__)`), et la configuration, faite une fois au point d'entrée, choisit le niveau,
  le format et les destinations. On passe les valeurs en arguments, pas en f-string, et `logger.exception` dans un
  `except` garde la trace. Une bibliothèque ne configure jamais la journalisation. »
cards:
  - key: vf-info-masque
    format: true-false
    question: "Sans configuration, `logging` n'affiche pas les messages de niveau `INFO`."
    truth: true
    answer: "Le logger racine est au niveau `WARNING` : `DEBUG` et `INFO` sont filtrés. `basicConfig(level=logging.INFO)` les fait apparaître."
  - key: vf-sortie-standard
    format: true-false
    question: "Par défaut, les messages de `logging` s'écrivent sur la sortie standard, comme ceux de `print`."
    truth: false
    answer: "Ils vont sur la sortie d'erreur (stderr). On peut donc rediriger les résultats d'un script sans y mêler son journal."
  - key: vf-exception-trace
    format: true-false
    question: "Appelée dans un bloc `except`, `logger.exception(...)` journalise le message au niveau `ERROR`, avec la trace de l'exception."
    truth: true
    answer: "C'est `logger.error(..., exc_info=True)`. Hors d'un `except`, il n'y a pas de trace à joindre."
  - key: vf-basicconfig-deux-fois
    format: true-false
    question: "Un second appel à `logging.basicConfig` remplace la configuration installée par le premier."
    truth: false
    answer: "`basicConfig` ne fait rien si le logger racine a déjà un handler. Il faut `force=True` pour la remplacer, ou mieux, configurer une seule fois au point d'entrée."
  - key: qcm-ordre-niveaux
    format: multiple-choice
    question: "Dans quel ordre de gravité croissante les niveaux de `logging` sont-ils rangés ?"
    choices:
      - {text: "DEBUG, INFO, WARNING, ERROR, CRITICAL", correct: true}
      - {text: "INFO, DEBUG, WARNING, ERROR, CRITICAL", correct: false}
      - {text: "DEBUG, INFO, ERROR, WARNING, CRITICAL", correct: false}
      - {text: "TRACE, DEBUG, INFO, WARNING, ERROR", correct: false}
    answer: "Leurs valeurs vont de 10 à 50. `TRACE` n'existe pas dans `logging` (il existe en Java)."
  - key: qcm-getlogger
    format: multiple-choice
    question: "Comment obtenir le logger d'un module, selon l'usage ?"
    choices:
      - {text: "`logger = logging.getLogger(__name__)`", correct: true}
      - {text: "`logger = logging.Logger('app')`", correct: false}
      - {text: "`logger = logging.basicConfig()`", correct: false}
      - {text: "`logger = logging.root`", correct: false}
    answer: "Le nom du module place le logger dans la hiérarchie (`app.paiement`), et l'origine de chaque message se lit dans le journal. On n'instancie pas `Logger` directement."
  - key: qcm-arguments-differes
    format: multiple-choice
    question: "Pourquoi écrire `logger.debug(\"panier %s\", panier)` plutôt qu'une f-string ?"
    choices:
      - {text: "Le message n'est formaté que s'il est vraiment émis", correct: true}
      - {text: "Les f-strings sont refusées par les méthodes de `logging`", correct: false}
      - {text: "`%s` affiche le `repr` du panier, plus précis qu'une f-string", correct: false}
      - {text: "Une f-string serait écrite deux fois dans le journal", correct: false}
    answer: "Si le niveau `DEBUG` est filtré, le panier n'est jamais converti en texte. Et le modèle constant permet aux outils de regrouper les messages. `%s` appelle `str`, pas `repr`."
  - key: qcm-bibliotheque
    format: multiple-choice
    question: "Que doit faire une bibliothèque, côté journalisation ?"
    choices:
      - {text: "Créer ses loggers avec `getLogger(__name__)`, sans rien configurer", correct: true}
      - {text: "Appeler `basicConfig` à l'import, pour que ses messages se voient", correct: false}
      - {text: "Écrire ses messages avec `print`, plus simple pour ses utilisateurs", correct: false}
      - {text: "Mettre le logger racine au niveau `DEBUG`, pour ne rien perdre", correct: false}
    answer: "L'application qui l'utilise décide des niveaux et des destinations. Une bibliothèque qui configure la racine impose ses choix à tout le programme."
  - key: trous-getlogger
    format: fill-in
    question: |-
      Complète pour créer le logger du module, nommé comme lui :
      ```python
      import logging

      logger = logging.getLogger(___)
      ```
    blanks:
      - - __name__
    answer: "`__name__` vaut le nom du module (`app.paiement`), ce qui range le logger dans la hiérarchie."
  - key: trous-basicconfig
    format: fill-in
    question: |-
      Complète pour afficher, au point d'entrée du programme, les messages à partir du niveau `INFO` :
      ```python
      logging.___(level=logging.INFO)
      ```
    blanks:
      - - basicConfig
    answer: "`basicConfig` installe un handler vers stderr et un format sur le logger racine, et fixe son niveau."
  - key: trous-exception
    format: fill-in
    question: |-
      Complète pour journaliser l'erreur avec la trace de l'exception :
      ```python
      try:
          payer(commande)
      except PaiementRefuseError:
          logger.___("paiement refusé pour %s", commande.id)
      ```
    blanks:
      - - exception
    answer: "`logger.exception` journalise au niveau `ERROR` et ajoute la trace de l'exception en cours."
  - key: trous-warning
    format: fill-in
    question: |-
      Complète avec le niveau d'une situation anormale qui n'est pas encore une erreur :
      ```python
      logger.___("disque presque plein : %d %%", taux)
      ```
    blanks:
      - - warning
    answer: "`warning`, entre `info` (tout va bien) et `error` (une opération a échoué). `%%` écrit un signe pour cent."
  - key: bug-info-invisible
    format: bug-fix
    question: |-
      Ce programme affiche seulement « prêt » : le message « serveur démarré » n'apparaît nulle part.
      ```python
      import logging

      logger = logging.getLogger(__name__)


      def demarrer():
          logger.info("serveur démarré")
          print("prêt")


      demarrer()
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `logging.basicConfig(level=logging.INFO)` au point d'entrée", correct: true}
      - {text: "Remplacer `__name__` par `\"root\"` dans `getLogger`", correct: false}
      - {text: "Appeler `logger.flush()` juste après le message", correct: false}
      - {text: "Écrire le message avec `logger.debug`, plus détaillé", correct: false}
    answer: |-
      ```python
      if __name__ == "__main__":
          logging.basicConfig(level=logging.INFO)
          demarrer()
      ```
      Sans configuration, seul `WARNING` et au-dessus passe. `debug` est encore plus bas qu'`info`.
  - key: bug-basicconfig-tardif
    format: bug-fix
    question: |-
      Ce programme n'écrit que « WARNING:root:démarrage » ; le message de débogage n'apparaît pas, et le format
      demandé n'est pas appliqué :
      ```python
      import logging

      logging.warning("démarrage")
      logging.basicConfig(level=logging.DEBUG, format="%(levelname)s %(message)s")
      logging.debug("connexion à la base")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `basicConfig` avant le premier message", correct: true}
      - {text: "Remplacer `logging.debug` par `print`", correct: false}
      - {text: "Appeler `basicConfig` une seconde fois après `debug`", correct: false}
      - {text: "Passer `level=\"debug\"` en minuscules", correct: false}
    answer: |-
      ```python
      logging.basicConfig(level=logging.DEBUG, format="%(levelname)s %(message)s")
      logging.warning("démarrage")
      logging.debug("connexion à la base")
      ```
      `logging.warning` sur une racine sans handler installe la configuration par défaut ; le `basicConfig` qui suit
      ne fait alors plus rien (sauf avec `force=True`).
  - key: bug-error-sans-trace
    format: bug-fix
    question: |-
      En production, le journal ne contient que « ERROR échec du calcul : division by zero », sans dire où l'erreur
      est née :
      ```python
      import logging

      logging.basicConfig(format="%(levelname)s %(message)s")
      log = logging.getLogger("paiement")

      try:
          1 / 0
      except ZeroDivisionError as e:
          log.error("échec du calcul : %s", e)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `log.exception(...)`, qui ajoute la trace", correct: true}
      - {text: "Appeler `log.critical(...)`, plus visible", correct: false}
      - {text: "Passer `e` en f-string dans le message", correct: false}
      - {text: "Ajouter `%(lineno)d` au format seulement", correct: false}
    answer: |-
      ```python
      except ZeroDivisionError:
          log.exception("échec du calcul")
      ```
      `exception` joint la trace complète. `%(lineno)d` donnerait la ligne de l'appel à `log`, pas celle de
      l'erreur.
  - key: bug-argument-sans-pourcent
    format: bug-fix
    question: |-
      Ce programme affiche « suite du programme », mais le journal contient « --- Logging error --- » et « TypeError:
      not all arguments converted during string formatting » :
      ```python
      import logging

      logging.basicConfig(level=logging.INFO, format="%(message)s")
      nom = "ana"
      logging.info("connexion de", nom)
      print("suite du programme")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`logging.info(\"connexion de %s\", nom)`", correct: true}
      - {text: "`logging.info(\"connexion de\" + nom)`", correct: false}
      - {text: "`logging.info(\"connexion de\", str(nom))`", correct: false}
      - {text: "`logging.info(\"connexion de {}\", nom)`", correct: false}
    answer: |-
      ```python
      logging.info("connexion de %s", nom)
      ```
      Les arguments remplacent les `%s` du message. Sans `%s`, le formatage échoue, au moment de l'émission ;
      `logging` affiche l'erreur et le programme continue. `{}` n'est pas reconnu par défaut.
  - key: situation-print-nocturne
    format: scenario
    question: |-
      Ton script nocturne écrit ses messages avec `print`. L'exploitation veut ne garder que les erreurs, avec leur
      heure. Que fais-tu ?
    choices:
      - {text: "Passer à `logging`, avec un niveau et un format qui contient `%(asctime)s`", correct: true}
      - {text: "Ajouter l'heure à chaque `print`, et retirer les messages devenus inutiles", correct: false}
      - {text: "Rediriger toute la sortie du script vers `/dev/null` pendant la nuit", correct: false}
      - {text: "Remplacer les `print` par des `assert`, que `-O` retire en production", correct: false}
    answer: "Le niveau filtre (`WARNING` ou `ERROR` en production), le format date chaque ligne, et tout se règle dans la configuration, sans retoucher chaque message."
  - key: situation-mot-de-passe
    format: scenario
    question: |-
      En revue, tu lis `logger.info("connexion %s / %s", utilisateur, mot_de_passe)`. Que demandes-tu ?
    choices:
      - {text: "De ne jamais journaliser le mot de passe : un journal est lu et conservé", correct: true}
      - {text: "De passer le message au niveau `DEBUG`, désactivé en production", correct: false}
      - {text: "De remplacer `%s` par une f-string, plus lisible dans le code", correct: false}
      - {text: "De chiffrer le fichier du journal, sans changer le message", correct: false}
    answer: "Un journal circule : outils de collecte, sauvegardes, collègues. Un `DEBUG` peut être réactivé un jour de panne. On journalise l'utilisateur, jamais le secret."
  - key: situation-bibliotheque-bavarde
    format: scenario
    question: |-
      Une bibliothèque que tu utilises, `urllib3`, inonde ton journal de messages `DEBUG`. Comment la faire taire sans
      toucher à ton propre niveau ?
    choices:
      - {text: "`logging.getLogger(\"urllib3\").setLevel(logging.WARNING)`", correct: true}
      - {text: "`logging.basicConfig(level=logging.WARNING)` pour tout le programme", correct: false}
      - {text: "Modifier le code de la bibliothèque pour retirer ses messages", correct: false}
      - {text: "`logging.disable()` dès le démarrage du programme", correct: false}
    answer: "Les loggers forment une hiérarchie : régler le niveau du logger `urllib3` filtre ses messages et ceux de ses enfants, sans toucher aux tiens. `disable` couperait tout."
  - key: situation-niveau-par-environnement
    format: scenario
    question: |-
      Tu veux les messages `DEBUG` sur ton poste, mais seulement `WARNING` et plus en production, sans changer le
      code. Comment fais-tu ?
    choices:
      - {text: "Lire le niveau dans une variable d'environnement, passée à `basicConfig`", correct: true}
      - {text: "Commenter les appels à `logger.debug` avant chaque mise en production", correct: false}
      - {text: "Entourer chaque `logger.debug` d'un `if` sur le nom de la machine", correct: false}
      - {text: "Garder `print` pour le débogage, et `logging` pour la production", correct: false}
    answer: "`logging.basicConfig(level=os.environ.get(\"LOG_LEVEL\", \"WARNING\"))` : le même code, une configuration par environnement. `basicConfig` accepte le nom du niveau."
  - key: pourquoi-logging
    format: course
    question: "Pourquoi préférer `logging` à `print` dans une application ?"
    choices:
      - {text: "Niveaux, horodatage et destinations se règlent sans toucher au code", correct: true}
      - {text: "`logging` est plus rapide que `print`, quel que soit le message", correct: false}
      - {text: "`print` ne sait pas écrire ailleurs que sur la sortie standard", correct: false}
      - {text: "`print` est retiré par l'option `-O`, comme les `assert`", correct: false}
    answer: "Le code dit ce qui se passe et à quel niveau ; la configuration décide de ce qu'on garde et où. `print(..., file=...)` peut écrire ailleurs, mais sans niveau ni filtre."
  - key: niveau-par-defaut
    format: course
    question: "Quel est le niveau du logger racine quand rien n'est configuré ?"
    choices:
      - {text: "`WARNING`", correct: true}
      - {text: "`DEBUG`", correct: false}
      - {text: "`INFO`", correct: false}
      - {text: "`ERROR`", correct: false}
    answer: "D'où la surprise classique : un `logger.info` qui n'affiche rien tant qu'on n'a pas abaissé le niveau."
  - key: propagation
    format: course
    question: "Que devient un message émis par le logger `app.paiement`, qui n'a pas de handler ?"
    choices:
      - {text: "Il remonte aux parents, `app` puis la racine, et à leurs handlers", correct: true}
      - {text: "Il est perdu : chaque logger doit avoir son propre handler", correct: false}
      - {text: "Il est écrit dans un fichier nommé `app.paiement.log`", correct: false}
      - {text: "Il attend en mémoire qu'un handler soit configuré", correct: false}
    answer: "C'est la propagation : un seul handler sur la racine suffit à toute l'application. `logger.propagate = False` l'arrête."
  - key: role-handler
    format: course
    question: "Quel rôle joue un handler dans `logging` ?"
    choices:
      - {text: "Il envoie les messages vers une destination : console, fichier, réseau", correct: true}
      - {text: "Il fixe le niveau minimal de tous les loggers du programme", correct: false}
      - {text: "Il rattrape les exceptions levées par le code journalisé", correct: false}
      - {text: "Il met en forme le texte de chaque message", correct: false}
    answer: "Le handler choisit la destination, le formatter la forme (`%(asctime)s %(levelname)s...`). Un logger peut avoir plusieurs handlers : la console et un fichier."
