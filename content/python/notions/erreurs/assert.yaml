notion: assert
lesson: |-
  `assert condition, message` vérifie une **hypothèse du programmeur** : si la condition est fausse, Python lève
  `AssertionError(message)`.

  ```python
  def fusionner(a, b):
      assert a == sorted(a), "a doit être trié"   # une hypothèse interne
      ...
  ```

  - **Le message n'est évalué que si la condition est fausse.**
  - **`python -O` retire les `assert`** : la variable `__debug__` vaut alors `False`, et les `assert` ne sont plus
    compilés. Un `assert` ne doit donc jamais porter une vérification nécessaire, ni un effet de bord
    (`assert liste.pop() == 3` ne retirerait plus rien).
  - **Jamais pour valider une entrée** (saisie, fichier, requête) **ni pour la sécurité** (droits, authentification) :
    lève une `ValueError`, une `TypeError` ou une exception métier, qui restent actives en production.
  - **Le piège des parenthèses** : `assert (x > 0, "message")` teste un tuple non vide, toujours vrai. Python émet un
    `SyntaxWarning: assertion is always true, perhaps remove parentheses?`.
  - **La virgule sépare la condition du message** : dans `assert isinstance(n, int), n >= 0`, le `n >= 0` est le
    message, il n'est jamais vérifié. On écrit `assert isinstance(n, int) and n >= 0`.

  | `assert` convient pour | `assert` ne convient pas pour |
  |---|---|
  | un invariant interne (« la liste est triée ici ») | valider l'argument d'une fonction publique |
  | une précondition d'une fonction privée | contrôler des droits ou une authentification |
  | les tests : pytest réécrit `assert` pour afficher les valeurs comparées | tout code qui doit tourner avec `-O` |

  **En entretien** : « `assert` vérifie une hypothèse interne et lève `AssertionError` si elle est fausse. Comme
  `python -O` retire les `assert`, on ne s'en sert jamais pour valider une entrée ou contrôler des droits : on lève
  une `ValueError` ou une exception métier. Pas d'effet de bord dans un `assert`, et pas de parenthèses autour de la
  condition et du message. »
cards:
  - key: vf-option-o
    format: true-false
    question: "Lancé avec `python -O`, un programme n'exécute plus ses instructions `assert`."
    truth: true
    answer: "Avec `-O`, `__debug__` vaut `False` et le compilateur retire les `assert`. C'est pourquoi ils ne doivent porter aucune vérification indispensable."
  - key: vf-tuple-toujours-vrai
    format: true-false
    question: "`assert (x > 0, \"x doit être positif\")` échoue quand `x` vaut -1."
    truth: false
    answer: "Les parenthèses font un tuple de deux éléments, toujours vrai : l'assertion ne peut jamais échouer. Python émet un `SyntaxWarning` pour le signaler."
  - key: vf-message-paresseux
    format: true-false
    question: "Le message d'un `assert` n'est évalué que si la condition est fausse."
    truth: true
    answer: "Un message coûteux à construire (une f-string sur une grosse structure) ne coûte rien tant que l'assertion tient."
  - key: vf-droits
    format: true-false
    question: "`assert` convient pour vérifier qu'un utilisateur a le droit de supprimer un compte."
    truth: false
    answer: "Avec `-O`, la vérification disparaîtrait, et n'importe qui pourrait supprimer un compte. Un contrôle de sécurité lève une exception explicite, toujours active."
  - key: qcm-exception-levee
    format: multiple-choice
    question: "Quelle exception lève un `assert` dont la condition est fausse ?"
    choices:
      - {text: "`AssertionError`", correct: true}
      - {text: "`ValueError`", correct: false}
      - {text: "`RuntimeError`", correct: false}
      - {text: "`AssertError`", correct: false}
    answer: "`AssertionError`, avec le message s'il y en a un. `AssertError` n'existe pas."
  - key: qcm-bon-usage
    format: multiple-choice
    question: "Lequel de ces usages d'`assert` est approprié ?"
    choices:
      - {text: "Vérifier, dans une fonction interne, qu'une liste censée être triée l'est", correct: true}
      - {text: "Refuser un formulaire dont l'adresse e-mail est restée vide", correct: false}
      - {text: "Vérifier au démarrage que le fichier de configuration existe", correct: false}
      - {text: "Contrôler qu'un utilisateur a le droit de supprimer un compte", correct: false}
    answer: "Une hypothèse interne, qui ne peut être fausse que par un bug. Les trois autres sont des cas réels à traiter en production, que `-O` ne doit pas supprimer."
  - key: qcm-debug
    format: multiple-choice
    question: "Quelle variable intégrée vaut `False` quand Python tourne avec l'option `-O` ?"
    choices:
      - {text: "`__debug__`", correct: true}
      - {text: "`__optimize__`", correct: false}
      - {text: "`__assert__`", correct: false}
      - {text: "`DEBUG`", correct: false}
    answer: "`__debug__` vaut `True` par défaut, `False` avec `-O`. `assert cond` équivaut à `if __debug__ and not cond: raise AssertionError`."
  - key: qcm-effet-de-bord
    format: multiple-choice
    question: "Pourquoi `assert file_attente.pop() == 3` est-il dangereux ?"
    choices:
      - {text: "Avec `-O`, le `pop` n'est plus exécuté, et la liste garde son élément", correct: true}
      - {text: "`pop` lève toujours une erreur quand il est appelé dans un `assert`", correct: false}
      - {text: "`assert` compare l'identité des objets, jamais leur valeur", correct: false}
      - {text: "Le `pop` s'exécute deux fois : pour le test, puis pour le message", correct: false}
    answer: "Le programme change de comportement selon l'option : `-O` retire l'`assert` entier, effet de bord compris. On fait le `pop` à part, puis on vérifie la valeur."
  - key: code-message-affiche
    format: code-output
    question: |-
      ```python
      x = -2
      try:
          assert x > 0, f"x vaut {x}"
      except AssertionError as e:
          print("échec :", e)
      ```
    answer: "`échec : x vaut -2` : la condition est fausse, le message est évalué et devient celui de l'`AssertionError`."
    check:
      output: "échec : x vaut -2"
    choices:
      - {text: "`échec : x vaut -2`", correct: true}
      - {text: "`échec : x > 0`", correct: false}
      - {text: "`échec :`", correct: false}
      - {text: "`échec : AssertionError`", correct: false}
  - key: code-tuple-passe
    format: code-output
    question: |-
      ```python
      x = -1
      assert (x > 0, "x doit être positif")
      print("passé")
      ```
    answer: "`passé` : l'assertion teste un tuple non vide, toujours vrai. Python émet un `SyntaxWarning` sur la sortie d'erreur, mais le programme continue."
    check:
      output: "passé"
    choices:
      - {text: "`passé`", correct: true}
      - {text: "Une `AssertionError`, sans rien afficher", correct: false}
      - {text: "Une `SyntaxError` : la ligne ne compile pas", correct: false}
      - {text: "`x doit être positif`", correct: false}
  - key: code-message-non-evalue
    format: code-output
    question: |-
      ```python
      def message():
          print("message calculé")
          return "erreur"


      assert 1 + 1 == 2, message()
      print("fin")
      ```
    answer: "`fin` : la condition est vraie, donc le message n'est jamais évalué, et `message()` n'est pas appelée."
    check:
      output: "fin"
    choices:
      - {text: "`fin`", correct: true}
      - {text: "`message calculé` puis `fin`, sur deux lignes", correct: false}
      - {text: "`erreur`", correct: false}
      - {text: "Une `AssertionError`, avec le message `erreur`", correct: false}
  - key: code-liste-vide
    format: code-output
    question: |-
      ```python
      def moyenne(notes):
          assert notes, "liste vide"
          return sum(notes) / len(notes)


      print(moyenne([12, 16]))
      print(moyenne([]))
      ```
    answer: "`14.0`, puis une `AssertionError: liste vide` non rattrapée : une liste vide est fausse."
    check:
      output: "14.0"
      throws: AssertionError
    choices:
      - {text: "`14.0`, puis une `AssertionError`", correct: true}
      - {text: "`14.0`, puis une `ZeroDivisionError`", correct: false}
      - {text: "`14`, puis une `AssertionError`", correct: false}
      - {text: "`14.0` et `0`, sur deux lignes", correct: false}
  - key: bug-parentheses
    format: bug-fix
    question: |-
      Ce programme affiche `-30` : le retrait passe, malgré l'assertion.
      ```python
      def retirer(solde, montant):
          assert (montant <= solde, "solde insuffisant")
          return solde - montant


      print(retirer(50, 80))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Retirer les parenthèses : `assert montant <= solde, \"...\"`", correct: true}
      - {text: "Inverser l'ordre : `assert (\"...\", montant <= solde)`", correct: false}
      - {text: "Remplacer la virgule par `and` dans les parenthèses", correct: false}
      - {text: "Écrire `assert not (montant > solde, \"...\")`", correct: false}
    answer: |-
      ```python
      if montant > solde:
          raise ValueError("solde insuffisant")
      ```
      Les parenthèses font un tuple, toujours vrai ; Python le signale par un `SyntaxWarning`. Sans elles,
      l'assertion marche. Mais un solde insuffisant est un cas réel : une `ValueError`, que `-O` ne retire pas, est
      encore meilleure.
  - key: bug-validation-o
    format: bug-fix
    question: |-
      En test, cet appel lève une `AssertionError`. En production, lancé avec `python -O`, il crée le compte d'un
      mineur :
      ```python
      def creer_compte(age):
          assert age >= 18, "réservé aux majeurs"
          return {"age": age}


      print(creer_compte(15))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Lever une `ValueError` dans un `if`, que `-O` ne retire pas", correct: true}
      - {text: "Ne plus utiliser l'option `-O` en production", correct: false}
      - {text: "Ajouter un second `assert` pour le même test", correct: false}
      - {text: "Rattraper `AssertionError` dans l'appelant", correct: false}
    answer: |-
      ```python
      if age < 18:
          raise ValueError(f"réservé aux majeurs : {age} ans")
      ```
      `-O` retire tous les `assert`. Une règle métier doit tenir quelle que soit l'option, donc dans un vrai
      contrôle.
  - key: bug-pop-dans-assert
    format: bug-fix
    question: |-
      Sans option, ce programme affiche `['b']`. Lancé avec `python -O`, il affiche `['a', 'b']` :
      ```python
      file_attente = ["a", "b"]
      assert file_attente.pop(0) == "a"
      print(file_attente)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Faire le `pop` à part, puis vérifier sa valeur", correct: true}
      - {text: "Remplacer `pop(0)` par `pop()` dans l'`assert`", correct: false}
      - {text: "Écrire `assert (file_attente.pop(0) == 'a')`", correct: false}
      - {text: "Ajouter un message à l'`assert`", correct: false}
    answer: |-
      ```python
      premier = file_attente.pop(0)
      assert premier == "a"
      ```
      Avec `-O`, tout l'`assert` disparaît, `pop` compris. Un `assert` ne doit avoir aucun effet de bord.
  - key: bug-virgule-message
    format: bug-fix
    question: |-
      Ce programme devait refuser `-4` par une `AssertionError`, mais s'arrête sur « TypeError: int() argument must be
      a string, a bytes-like object or a real number, not 'complex' » :
      ```python
      def racine_entiere(n):
          assert isinstance(n, int), n >= 0
          return int(n ** 0.5)


      print(racine_entiere(-4))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`assert isinstance(n, int) and n >= 0`", correct: true}
      - {text: "`assert (isinstance(n, int), n >= 0)`", correct: false}
      - {text: "`assert n >= 0, isinstance(n, int)`", correct: false}
      - {text: "`assert isinstance(n, int); n >= 0`", correct: false}
    answer: |-
      ```python
      assert isinstance(n, int) and n >= 0, f"entier positif attendu : {n!r}"
      ```
      Après la virgule vient le message : `n >= 0` n'était jamais vérifié. `(-4) ** 0.5` donne alors un nombre
      complexe, qu'`int` refuse. Les parenthèses feraient un tuple toujours vrai.
  - key: role-assert
    format: course
    question: "À quoi sert `assert` ?"
    choices:
      - {text: "À vérifier une hypothèse du programmeur, qui ne peut être fausse que par un bug", correct: true}
      - {text: "À valider les données saisies par l'utilisateur avant de les enregistrer", correct: false}
      - {text: "À rattraper une exception sans écrire de bloc `try`", correct: false}
      - {text: "À déclarer le type attendu d'une variable, vérifié par Python", correct: false}
    answer: "Un `assert` documente et vérifie un invariant. S'il échoue, c'est le code qui a un bug, pas l'utilisateur qui s'est trompé."
  - key: pourquoi-pas-valider
    format: course
    question: "Pourquoi ne pas valider une entrée avec `assert` ?"
    choices:
      - {text: "`python -O` retire les `assert` : la validation disparaîtrait", correct: true}
      - {text: "`assert` ne peut pas afficher de message d'erreur", correct: false}
      - {text: "Une `AssertionError` ne peut pas être rattrapée par `except`", correct: false}
      - {text: "`assert` ne marche que dans les fichiers de test", correct: false}
    answer: "Une validation doit tenir en production. Et `AssertionError` dit « bug » au lecteur, alors qu'une entrée invalide est un cas normal : `ValueError` le dit mieux."
  - key: pytest-assert
    format: course
    question: "Pourquoi pytest se contente-t-il d'`assert`, sans méthodes comme `assertEqual` ?"
    choices:
      - {text: "Il réécrit les `assert` des tests pour afficher les valeurs comparées", correct: true}
      - {text: "Il désactive l'option `-O` dans tout le programme testé", correct: false}
      - {text: "`assertEqual` n'existe dans aucun module de Python", correct: false}
      - {text: "Il remplace chaque `assert` par un `if` suivi d'un `print`", correct: false}
    answer: "Quand `assert total == 42` échoue, pytest montre la valeur de `total`. `assertEqual` existe bien, dans `unittest`."
  - key: alternative-assert
    format: course
    question: "Que lever, à la place d'un `assert`, pour refuser un argument invalide d'une fonction publique ?"
    choices:
      - {text: "Une `ValueError` ou une `TypeError`, avec un message clair", correct: true}
      - {text: "Une `AssertionError`, levée à la main avec `raise`", correct: false}
      - {text: "Rien : renvoyer `None` suffit à prévenir l'appelant", correct: false}
      - {text: "Une `SystemExit`, pour arrêter proprement le programme", correct: false}
    answer: "L'appelant a fait une erreur : il doit pouvoir la rattraper par son type. `SystemExit` arrêterait tout le programme pour un argument."
