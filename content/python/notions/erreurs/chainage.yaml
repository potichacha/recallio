notion: chainage
lesson: |-
  Une exception levée pendant le traitement d'une autre garde un lien vers elle : c'est le **chaînage**. La trace
  affiche alors les deux, reliées par une phrase qui dit si le lien est voulu ou accidentel.

  | Écriture | Attributs de la nouvelle exception | Phrase entre les deux traces |
  |---|---|---|
  | `raise B()` dans un `except` | `__context__` = l'exception d'origine | « During handling of the above exception, another exception occurred: » |
  | `raise B() from a` | `__cause__` = `a` (et `__context__`) | « The above exception was the direct cause of the following exception: » |
  | `raise B() from None` | `__cause__` = `None`, `__suppress_context__` = `True` | aucune : seule `B` s'affiche |

  **Le chaînage implicite** : toute exception levée dans un `except` (ou un `finally`) reçoit l'exception en cours dans
  `__context__`. La phrase « During handling... » signale souvent un **bug du gestionnaire** lui-même : une faute de
  frappe dans le `except`.

  **Le chaînage explicite**, `from`, sert à **traduire** une exception technique en exception du domaine, sans perdre
  la cause :

  ```python
  class DepotIndisponibleError(Exception):
      pass


  def lire_client(ident):
      try:
          return base.lire("clients", ident)
      except sqlite3.OperationalError as e:
          raise DepotIndisponibleError(f"lecture du client {ident}") from e
  ```

  - L'appelant rattrape `DepotIndisponibleError`, pas `sqlite3.OperationalError` : **`from` ne change pas le type** de
    la nouvelle exception.
  - **`from None`** efface l'origine de la trace : réservé au cas où elle n'apporte rien (un détail interne). La
    supprimer à tort fait perdre la ligne et la colonne d'une erreur JSON, par exemple.
  - La variable de `except ... as e` est **effacée à la fin du bloc** : le `raise ... from e` s'écrit dans le
    `except`.

  **En entretien** : « Une exception levée dans un `except` garde l'originale dans `__context__`, et la trace dit
  « During handling of the above exception... », signe d'un accident. `raise B from a` déclare un lien voulu : `a` va
  dans `__cause__` et la trace dit « direct cause ». On s'en sert pour traduire une exception technique en exception
  métier sans perdre la cause ; `from None` masque l'origine quand elle n'apporte rien. »
cards:
  - key: vf-context-implicite
    format: true-false
    question: "Une exception levée dans un bloc `except` garde l'exception d'origine dans son attribut `__context__`, même sans `from`."
    truth: true
    answer: "C'est le chaînage implicite : Python le fait toujours. La trace relie alors les deux par « During handling of the above exception, another exception occurred »."
  - key: vf-from-none-efface
    format: true-false
    question: "`raise ConfigError(...) from None` retire l'exception d'origine de la trace affichée."
    truth: true
    answer: "`from None` met `__suppress_context__` à `True` : la trace ne montre que la nouvelle exception. L'origine reste pourtant accessible dans `__context__`."
  - key: vf-cause-sans-from
    format: true-false
    question: "Sans `from`, l'attribut `__cause__` d'une exception levée dans un `except` contient l'exception d'origine."
    truth: false
    answer: "Sans `from`, `__cause__` vaut `None` : seule `__context__` est remplie. `__cause__` n'est posée que par `from`."
  - key: vf-from-remplace-trace
    format: true-false
    question: "`raise NouvelleErreur() from e` remplace la trace de `e` : seule la nouvelle exception est affichée."
    truth: false
    answer: "Les deux traces s'affichent, celle de `e` d'abord, reliées par « The above exception was the direct cause of the following exception ». C'est tout l'intérêt de `from`."
  - key: qcm-phrase-from
    format: multiple-choice
    question: "Quelle phrase relie les deux traces quand on écrit `raise B() from a` ?"
    choices:
      - {text: "« The above exception was the direct cause of the following exception »", correct: true}
      - {text: "« During handling of the above exception, another exception occurred »", correct: false}
      - {text: "« The following exception was raised while handling the exception above »", correct: false}
      - {text: "« Exception ignored while handling the exception above »", correct: false}
    answer: "« Direct cause » dit que le lien est voulu, posé par `from`. « During handling » signale une exception née, peut-être par accident, dans un gestionnaire."
  - key: qcm-phrase-implicite
    format: multiple-choice
    question: "Une exception naît, par accident, pendant le traitement d'une autre. Quelle phrase relie leurs traces ?"
    choices:
      - {text: "« During handling of the above exception, another exception occurred »", correct: true}
      - {text: "« The above exception was the direct cause of the following exception »", correct: false}
      - {text: "« The following exception was raised while handling the exception above »", correct: false}
      - {text: "« Exception ignored while handling the exception above »", correct: false}
    answer: "C'est le chaînage implicite, par `__context__`. Quand le lien est voulu, on écrit `from`, et la phrase devient « direct cause »."
  - key: qcm-traduire
    format: multiple-choice
    question: "Ta couche d'accès aux données rattrape `sqlite3.OperationalError` sous le nom `erreur`, et veut lever `DepotIndisponibleError` à la place. Quelle écriture choisir ?"
    choices:
      - {text: "`raise DepotIndisponibleError() from erreur`", correct: true}
      - {text: "`raise DepotIndisponibleError() from None`", correct: false}
      - {text: "`return DepotIndisponibleError(erreur)`", correct: false}
      - {text: "`raise erreur from DepotIndisponibleError()`", correct: false}
    answer: "La nouvelle exception, du domaine, avec la cause technique en `__cause__`. `from None` perdrait la cause ; `return` ne lèverait rien ; la dernière écriture inverse les rôles."
  - key: qcm-attribut-de-from
    format: multiple-choice
    question: "Quel attribut de la nouvelle exception `from a` renseigne-t-il ?"
    choices:
      - {text: "`__cause__`", correct: true}
      - {text: "`__traceback__`", correct: false}
      - {text: "`args`", correct: false}
      - {text: "`__notes__`", correct: false}
    answer: "`from a` range `a` dans `__cause__` et met `__suppress_context__` à `True`. `__context__`, lui, est rempli par tout `raise` fait dans un `except`, avec ou sans `from`."
  - key: code-cause-et-contexte
    format: code-output
    question: |-
      ```python
      try:
          try:
              int("x")
          except ValueError as e:
              raise RuntimeError("conversion") from e
      except RuntimeError as r:
          print(type(r.__cause__).__name__, type(r.__context__).__name__)
      ```
    answer: "`ValueError ValueError` : `from e` remplit `__cause__`, et le `raise` dans le `except` remplit aussi `__context__`, avec la même exception."
    check:
      output: "ValueError ValueError"
    choices:
      - {text: "`ValueError ValueError`", correct: true}
      - {text: "`ValueError NoneType`", correct: false}
      - {text: "`NoneType ValueError`", correct: false}
      - {text: "`RuntimeError ValueError`", correct: false}
  - key: code-sans-from
    format: code-output
    question: |-
      ```python
      try:
          try:
              {}["cle"]
          except KeyError:
              raise LookupError("introuvable")
      except LookupError as e:
          print(e.__cause__, type(e.__context__).__name__)
      ```
    answer: "`None KeyError` : sans `from`, `__cause__` reste vide ; le chaînage implicite range la `KeyError` dans `__context__`."
    check:
      output: "None KeyError"
    choices:
      - {text: "`None KeyError`", correct: true}
      - {text: "`'cle' KeyError`", correct: false}
      - {text: "`None NoneType`", correct: false}
      - {text: "`KeyError KeyError`", correct: false}
  - key: code-from-none
    format: code-output
    question: |-
      ```python
      try:
          try:
              1 / 0
          except ZeroDivisionError:
              raise ValueError("diviseur nul") from None
      except ValueError as e:
          print(e.__cause__, e.__suppress_context__, type(e.__context__).__name__)
      ```
    answer: "`None True ZeroDivisionError` : `from None` cache l'origine dans la trace (`__suppress_context__`), mais `__context__` la garde toujours."
    check:
      output: "None True ZeroDivisionError"
    choices:
      - {text: "`None True ZeroDivisionError`", correct: true}
      - {text: "`None True NoneType`", correct: false}
      - {text: "`None False ZeroDivisionError`", correct: false}
      - {text: "`ZeroDivisionError True NoneType`", correct: false}
  - key: code-traduite-non-rattrapee
    format: code-output
    question: |-
      ```python
      def lire_port(texte):
          try:
              return int(texte)
          except ValueError as e:
              raise RuntimeError(f"port invalide : {texte!r}") from e


      print("démarrage")
      lire_port("80a")
      print("prêt")
      ```
    answer: "`démarrage`, puis une `RuntimeError` non rattrapée : la trace montre la `ValueError`, « direct cause », puis la `RuntimeError`. `prêt` ne s'affiche jamais."
    check:
      output: "démarrage"
      throws: RuntimeError
    choices:
      - {text: "`démarrage`, puis une `RuntimeError`", correct: true}
      - {text: "`démarrage`, puis une `ValueError`", correct: false}
      - {text: "`démarrage` puis `prêt`, sur deux lignes", correct: false}
      - {text: "Une `RuntimeError`, sans rien afficher avant", correct: false}
  - key: bug-from-none-abusif
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « ValueError: configuration illisible », sans dire où se trouve l'erreur dans le
      JSON :
      ```python
      import json


      def charger(texte):
          try:
              return json.loads(texte)
          except json.JSONDecodeError:
              raise ValueError("configuration illisible") from None


      charger('{"port": 80,}')
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Nommer l'exception (`as e`) et lever avec `from e`", correct: true}
      - {text: "Retirer le `try` et laisser `json.loads` sans protection", correct: false}
      - {text: "Lever `json.JSONDecodeError` au lieu de `ValueError`", correct: false}
      - {text: "Ajouter `finally: print(texte)` pour voir le JSON", correct: false}
    answer: |-
      ```python
      except json.JSONDecodeError as e:
          raise ValueError("configuration illisible") from e
      ```
      `from None` efface la cause, qui contenait la ligne et la colonne de l'erreur. `from e` garde le message
      métier et la trace technique.
  - key: bug-erreur-dans-except
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « NameError: name 'journal' is not defined », précédée de « During handling of the
      above exception, another exception occurred » :
      ```python
      def lire(donnees, cle):
          try:
              return donnees[cle]
          except KeyError:
              journal.append(cle)
              return None


      print(lire({}, "x"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Définir `journal` : l'erreur vient du bloc `except` lui-même", correct: true}
      - {text: "Ajouter `from None` pour ne garder que la `NameError`", correct: false}
      - {text: "Rattraper aussi `NameError` dans le même `except`", correct: false}
      - {text: "Remplacer `donnees[cle]` par `donnees.get(cle)` seulement", correct: false}
    answer: |-
      ```python
      journal = []


      def lire(donnees, cle):
          ...
      ```
      La `KeyError` est prévue et rattrapée ; c'est le gestionnaire qui plante. « During handling » le signale :
      une seconde exception est née pendant le traitement de la première.
  - key: bug-from-ne-change-pas-le-type
    format: bug-fix
    question: |-
      Ce programme devait afficher « client absent : on en crée un », mais s'arrête sur « DepotError: client inconnu :
      b2 » :
      ```python
      class DepotError(Exception):
          pass


      def lire_client(ident):
          try:
              return {"a1": "Ana"}[ident]
          except KeyError as e:
              raise DepotError(f"client inconnu : {ident}") from e


      try:
          lire_client("b2")
      except KeyError:
          print("client absent : on en crée un")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Rattraper `DepotError` chez l'appelant", correct: true}
      - {text: "Lever avec `from None` au lieu de `from e`", correct: false}
      - {text: "Rattraper `KeyError` avec `from` dans l'appelant", correct: false}
      - {text: "Faire hériter `DepotError` de `BaseException`", correct: false}
    answer: |-
      ```python
      try:
          lire_client("b2")
      except DepotError:
          print("client absent : on en crée un")
      ```
      `from e` garde la `KeyError` comme cause, mais l'exception levée est une `DepotError` : c'est elle qu'il faut
      rattraper. Hériter aussi de `KeyError` serait une autre solution.
  - key: bug-e-hors-du-except
    format: bug-fix
    question: |-
      Ce programme affiche « conversion ratée », puis s'arrête sur « NameError: name 'e' is not defined » :
      ```python
      try:
          int("x")
      except ValueError as e:
          print("conversion ratée")
      raise RuntimeError("abandon") from e
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Déplacer le `raise ... from e` dans le bloc `except`", correct: true}
      - {text: "Déclarer `global e` au début du programme", correct: false}
      - {text: "Écrire `from ValueError` au lieu de `from e`", correct: false}
      - {text: "Initialiser `e = None` avant le `try`", correct: false}
    answer: |-
      ```python
      except ValueError as e:
          print("conversion ratée")
          raise RuntimeError("abandon") from e
      ```
      Python efface le nom `e` à la fin du `except`, pour ne pas garder la trace en mémoire. Initialiser `e = None`
      ne changerait rien : le nom serait quand même effacé.
  - key: pourquoi-from
    format: course
    question: "Pourquoi écrire `raise ErreurMetier(...) from e` quand tu traduis une exception technique ?"
    choices:
      - {text: "Pour garder la cause dans la trace, et dire que la traduction est voulue", correct: true}
      - {text: "Pour que l'appelant puisse encore rattraper l'exception technique", correct: false}
      - {text: "Pour supprimer de la trace l'exception technique, devenue inutile", correct: false}
      - {text: "Pour que la nouvelle exception prenne le type de l'ancienne", correct: false}
    answer: "L'appelant traite une erreur de son niveau ; celui qui débogue voit la cause technique, sous « direct cause ». Le type reste celui de la nouvelle exception."
  - key: cause-ou-contexte
    format: course
    question: "Quelle différence entre `__cause__` et `__context__` ?"
    choices:
      - {text: "`__cause__` vient de `from` ; `__context__` de tout `raise` dans un `except`", correct: true}
      - {text: "`__context__` vient de `from` ; `__cause__` de tout `raise` dans un `except`", correct: false}
      - {text: "`__cause__` garde le message ; `__context__` garde la trace de l'exception", correct: false}
      - {text: "Aucune : ce sont deux noms du même attribut, gardés pour la compatibilité", correct: false}
    answer: "`__cause__` dit un lien voulu, `__context__` un lien de fait. La trace affiche `__cause__` en priorité, sinon `__context__` (sauf si `__suppress_context__` est vrai)."
  - key: quand-from-none
    format: course
    question: "Quand `raise ... from None` est-il justifié ?"
    choices:
      - {text: "Quand l'exception d'origine n'est qu'un détail interne, inutile à l'appelant", correct: true}
      - {text: "Toujours, pour que les traces restent courtes et faciles à lire", correct: false}
      - {text: "Quand l'exception d'origine doit remonter à la place de la nouvelle", correct: false}
      - {text: "Jamais : Python refuse `None` après le mot-clé `from`", correct: false}
    answer: "Par exemple une `KeyError` interne traduite en `AttributeError` dans un `__getattr__` : la `KeyError` n'aide personne. Dès que l'origine peut servir au débogage, on garde `from e`."
  - key: sens-during-handling
    format: course
    question: "Que signale « During handling of the above exception, another exception occurred » dans une trace ?"
    choices:
      - {text: "Une exception levée dans un `except` sans `from`, souvent un bug", correct: true}
      - {text: "Deux exceptions levées au même moment par deux threads", correct: false}
      - {text: "Une exception relancée volontairement avec `raise` seul", correct: false}
      - {text: "Une exception rattrapée puis ignorée par un bloc `finally`", correct: false}
    answer: "Le chaînage implicite : la seconde exception est née pendant le traitement de la première. Si c'était voulu, on aurait écrit `from` ; sinon, c'est souvent une erreur dans le gestionnaire."
