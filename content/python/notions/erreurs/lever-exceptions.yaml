notion: lever-exceptions
lesson: |-
  Une fonction qui ne peut pas faire ce que son nom promet **lève une exception** avec `raise`, plutôt que de renvoyer
  une valeur spéciale (`-1`, `None`) que l'appelant oublierait de tester.

  ```python
  def retirer(solde, montant):
      if not isinstance(montant, int):
          raise TypeError(f"montant non entier : {montant!r}")
      if montant <= 0:
          raise ValueError(f"montant invalide : {montant}")
      return solde - montant
  ```

  - **`raise Exception(message)`** crée l'exception et la lève. `raise ValueError` (la classe seule) marche aussi :
    Python l'instancie, sans message.
  - **On ne lève que des exceptions** : `raise "erreur"` ou `raise NotImplemented` (une constante, pas une exception)
    lèvent une `TypeError: exceptions must derive from BaseException`.
  - **Le bon type** dit à l'appelant ce qui ne va pas :

  | Exception | Quand la lever |
  |---|---|
  | `ValueError` | le type convient, pas la valeur : un âge négatif, une date impossible |
  | `TypeError` | le type ne convient pas : une chaîne au lieu d'un nombre |
  | `KeyError`, `IndexError` | une clé ou un indice absent, dans une classe qui imite un conteneur |
  | `NotImplementedError` | une méthode qu'une sous-classe doit redéfinir |
  | `RuntimeError` | une situation anormale qu'aucun autre type ne décrit |

  - **Un message utile** contient la valeur fautive : `ValueError(f"note hors de 0..20 : {note}")` plutôt que
    `ValueError("erreur")`. On évite de lever `Exception` elle-même : l'appelant ne pourrait la rattraper qu'en
    rattrapant tout.
  - **Vérifie les entrées au début** de la fonction (clauses de garde), avant de modifier quoi que ce soit.
  - **`raise` seul**, dans un bloc `except`, relance l'exception en cours, avec son type et sa trace d'origine : on
    journalise, puis on laisse remonter. Hors d'un `except`, il lève `RuntimeError: No active exception to reraise`.

  ```python
  try:
      envoyer(commande)
  except ConnectionError:
      journal.append(f"échec de l'envoi de {commande}")
      raise   # l'appelant reçoit la même ConnectionError
  ```

  **En entretien** : « `raise` lève une exception quand une fonction ne peut pas tenir sa promesse : `ValueError` pour
  une mauvaise valeur, `TypeError` pour un mauvais type, avec un message qui cite la valeur fautive. On ne lève que des
  instances de `BaseException`, en pratique d'`Exception`. Dans un `except`, `raise` seul relance l'exception en cours
  intacte, après l'avoir journalisée par exemple. »
tour:
  - title: "Lever une exception : raise"
    text: |-
      Quand ta fonction ne peut pas faire son travail, elle **lève** une exception : `raise ValueError("message")`.
      L'exécution de la fonction s'arrête là, et l'exception remonte vers l'appelant, qui la rattrape ou la laisse
      passer.

      Choisis le type qui décrit le problème : `ValueError` pour une valeur hors des règles, `TypeError` pour un
      mauvais type. Mets la valeur fautive dans le message.

      Dans un `except`, `raise` seul **relance** l'exception en cours : la fonction `charger` note l'erreur, puis la
      laisse remonter, intacte, jusqu'à son appelant.

      Essaie : appelle `retirer(100, 0)` dans la boucle, ou retire le `raise` de `charger` et regarde ce que reçoit
      l'appelant.
    example:
      files:
        main.py: |-
          def retirer(solde, montant):
              if montant <= 0:
                  raise ValueError(f"montant invalide : {montant}")
              if montant > solde:
                  raise ValueError(f"solde insuffisant : {solde} < {montant}")
              return solde - montant


          print(retirer(100, 30))
          for montant in [-5, 500]:
              try:
                  retirer(100, montant)
              except ValueError as erreur:
                  print("refusé :", erreur)


          def charger(nom):
              try:
                  return {"a": 1}[nom]
              except KeyError:
                  print("journal : clé absente", nom)
                  raise


          try:
              charger("b")
          except KeyError as erreur:
              print("l'appelant reçoit", repr(erreur))
      output: |-
        70
        refusé : montant invalide : -5
        refusé : solde insuffisant : 100 < 500
        journal : clé absente b
        l'appelant reçoit KeyError('b')
    task:
      instructions: |-
        Un montant qui n'est pas un entier produit un message obscur, levé par la comparaison `<=`. Ajoute au début
        de `retirer` une vérification qui lève une `TypeError` avec le message `montant non entier : '10'` : le
        `repr` du montant, que donne `{montant!r}` dans une f-string. La sortie attendue :

        ```
        nouveau solde : 70
        refusé : montant invalide : -5
        refusé : montant non entier : '10'
        ```
      starter:
        main.py: |-
          def retirer(solde, montant):
              if montant <= 0:
                  raise ValueError(f"montant invalide : {montant}")
              return solde - montant


          for montant in [30, -5, "10"]:
              try:
                  print("nouveau solde :", retirer(100, montant))
              except (TypeError, ValueError) as erreur:
                  print("refusé :", erreur)
      solution:
        main.py: |-
          def retirer(solde, montant):
              if not isinstance(montant, int):
                  raise TypeError(f"montant non entier : {montant!r}")
              if montant <= 0:
                  raise ValueError(f"montant invalide : {montant}")
              return solde - montant


          for montant in [30, -5, "10"]:
              try:
                  print("nouveau solde :", retirer(100, montant))
              except (TypeError, ValueError) as erreur:
                  print("refusé :", erreur)
      output: |-
        nouveau solde : 70
        refusé : montant invalide : -5
        refusé : montant non entier : '10'
cards:
  - key: vf-raise-seul-relance
    format: true-false
    question: "Dans un bloc `except`, `raise` seul relance l'exception en cours, avec sa trace d'origine."
    truth: true
    answer: "C'est la façon de journaliser une erreur sans l'avaler : l'appelant reçoit la même exception, du même type, avec la trace qui montre où elle est née."
  - key: vf-raise-classe-seule
    format: true-false
    question: "`raise ValueError`, sans parenthèses, est refusé : il faut écrire `raise ValueError()`."
    truth: false
    answer: "Python accepte la classe : il l'instancie lui-même, sans argument. On ajoute les parenthèses pour donner un message."
  - key: vf-raise-chaine
    format: true-false
    question: "On peut lever une simple chaîne de caractères : `raise \"solde insuffisant\"`."
    truth: false
    answer: "Seules les instances (ou classes) dérivées de `BaseException` se lèvent. Une chaîne donne `TypeError: exceptions must derive from BaseException`."
  - key: vf-raise-hors-except
    format: true-false
    question: "`raise` seul, hors de tout bloc `except`, lève une `RuntimeError`."
    truth: true
    answer: "Il n'y a aucune exception en cours à relancer : `RuntimeError: No active exception to reraise`."
  - key: qcm-age-negatif
    format: multiple-choice
    question: "Ta fonction attend un âge entier et reçoit l'entier `-3`. Quelle exception lever ?"
    choices:
      - {text: "`ValueError`", correct: true}
      - {text: "`TypeError`", correct: false}
      - {text: "`IndexError`", correct: false}
      - {text: "`AssertionError`", correct: false}
    answer: "Le type est le bon (un entier), la valeur ne l'est pas : c'est une `ValueError`. `AssertionError` est réservée aux `assert`, qui vérifient des hypothèses internes."
  - key: qcm-chaine-au-lieu-de-nombre
    format: multiple-choice
    question: "Ta fonction `aire(rayon)` reçoit la chaîne `\"2\"` au lieu d'un nombre. Quelle exception est la plus juste ?"
    choices:
      - {text: "`TypeError`", correct: true}
      - {text: "`ValueError`", correct: false}
      - {text: "`NameError`", correct: false}
      - {text: "`AttributeError`", correct: false}
    answer: "Le problème est le type de l'argument : `TypeError`. C'est aussi ce que lève Python pour `\"2\" * 3.14`."
  - key: qcm-methode-a-redefinir
    format: multiple-choice
    question: "Quelle exception lève, en attendant, une méthode qu'une sous-classe doit redéfinir ?"
    choices:
      - {text: "`NotImplementedError`", correct: true}
      - {text: "`NotImplemented`", correct: false}
      - {text: "`NotImplementedException`", correct: false}
      - {text: "`AbstractMethodError`", correct: false}
    answer: "`NotImplementedError` est une exception. `NotImplemented` est une constante, que renvoient les opérateurs comme `__eq__` : la lever donne une `TypeError`. Les deux autres n'existent pas en Python."
  - key: qcm-message-utile
    format: multiple-choice
    question: "Quelle exception aide le plus celui qui lira la trace ?"
    choices:
      - {text: "`ValueError(f'quantité négative : {quantite}')`", correct: true}
      - {text: "`ValueError('erreur de quantité')`", correct: false}
      - {text: "`Exception(f'quantité : {quantite}')`", correct: false}
      - {text: "`ValueError()`, le type suffit", correct: false}
    answer: "Le bon type, un message qui dit le problème, et la valeur fautive. Une `Exception` générique oblige l'appelant à tout rattraper pour la traiter."
