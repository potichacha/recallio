  - key: code-journal-puis-relance
    format: code-output
    question: |-
      ```python
      def charger():
          try:
              return int("x")
          except ValueError:
              print("journal", end=" ; ")
              raise


      try:
          charger()
      except ValueError as e:
          print(type(e).__name__)
      ```
    answer: "`journal ; ValueError` : `charger` journalise, puis `raise` relance la même `ValueError`, que l'appelant rattrape."
    check:
      output: "journal ; ValueError"
    choices:
      - {text: "`journal ; ValueError`", correct: true}
      - {text: "`journal ; RuntimeError`", correct: false}
      - {text: "`journal ;`", correct: false}
      - {text: "`ValueError`", correct: false}
  - key: code-classe-sans-message
