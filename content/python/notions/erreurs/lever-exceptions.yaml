      ```python
      try:
          raise KeyError
      except KeyError as e:
          print(type(e).__name__, e.args)
      ```
    answer: "`KeyError ()` : Python instancie la classe sans argument ; ses `args` sont un tuple vide."
    check:
      output: "KeyError ()"
    choices:
      - {text: "`KeyError ()`", correct: true}
      - {text: "`KeyError None`", correct: false}
      - {text: "`type ()`", correct: false}
      - {text: "`KeyError ('',)`", correct: false}
  - key: code-gardes
    format: code-output
    question: |-
      ```python
      def verifier(age):
          if not isinstance(age, int):
              raise TypeError("pas un entier")
          if age < 0:
              raise ValueError("négatif")
          return "ok"


      for valeur in [5, -1, "3"]:
          try:
              print(verifier(valeur), end=" ")
          except (TypeError, ValueError) as e:
              print(e, end=" ")
      print()
      ```
    answer: "`ok négatif pas un entier` : chaque valeur passe les gardes dans l'ordre. Quand `verifier` lève, le premier `print` n'est jamais appelé : c'est celui du `except` qui affiche le message."
    check:
      output: "ok négatif pas un entier"
    choices:
      - {text: "`ok négatif pas un entier`", correct: true}
      - {text: "`ok négatif négatif`", correct: false}
      - {text: "`ok ok pas un entier`", correct: false}
      - {text: "`ok négatif`", correct: false}
  - key: code-raise-arrete-fonction
    format: code-output
    question: |-
      ```python
      def f():
          print("a", end="")
          raise ValueError("stop")
          print("b", end="")


      try:
          f()
          print("c", end="")
      except ValueError:
          print("d", end="")
      print()
      ```
    answer: "`ad` : `raise` arrête `f` aussitôt, puis la ligne qui suit l'appel dans le `try` ; l'exécution reprend dans le `except`."
    check:
      output: "ad"
    choices:
      - {text: "`ad`", correct: true}
      - {text: "`abd`", correct: false}
      - {text: "`acd`", correct: false}
      - {text: "`abcd`", correct: false}
  - key: bug-lever-une-chaine
    format: bug-fix
    question: |-
      Ce programme devait afficher « refusé », mais s'arrête sur « TypeError: exceptions must derive from
      BaseException » :
      ```python
      def retirer(solde, montant):
          if montant > solde:
              raise "solde insuffisant"
          return solde - montant


      try:
          retirer(10, 50)
      except ValueError:
          print("refusé")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Lever une exception : `raise ValueError(\"solde insuffisant\")`", correct: true}
      - {text: "Rattraper `TypeError` à la place de `ValueError`", correct: false}
      - {text: "Écrire `raise str(\"solde insuffisant\")`", correct: false}
      - {text: "Renvoyer la chaîne avec `return` au lieu de `raise`", correct: false}
    answer: |-
      ```python
      if montant > solde:
          raise ValueError("solde insuffisant")
      ```
      On ne lève que des exceptions. Rattraper la `TypeError` masquerait le bug ; renvoyer la chaîne obligerait
      l'appelant à la tester.
  - key: bug-return-exception
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: unsupported operand type(s) for *: 'ValueError' and 'int' » :
      ```python
      def diviser(a, b):
          if b == 0:
              return ValueError("division par zéro")
          return a / b


      resultat = diviser(1, 0)
      print(resultat * 2)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Remplacer `return` par `raise` devant `ValueError(...)`", correct: true}
      - {text: "Remplacer `ValueError` par `ZeroDivisionError` dans le `return`", correct: false}
      - {text: "Tester `isinstance(resultat, Exception)` avant de multiplier", correct: false}
      - {text: "Renvoyer `None` au lieu de l'exception quand `b` vaut zéro", correct: false}
    answer: |-
      ```python
      if b == 0:
          raise ValueError("division par zéro")
      ```
      `return` renvoie l'objet exception comme une valeur ordinaire : rien n'est levé, et l'erreur éclate plus loin,
      loin de sa cause. Renvoyer `None` aurait le même défaut.
  - key: bug-exception-avalee
    format: bug-fix
    question: |-
      Ce programme affiche « config invalide », puis s'arrête plus loin sur « TypeError: unsupported operand type(s)
      for +: 'NoneType' and 'int' » :
      ```python
      def lire_port(texte):
          try:
              return int(texte)
          except ValueError:
              print("config invalide")


      port = lire_port("80a")
      print(port + 1)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter `raise` après le `print` du `except`, pour relancer l'erreur", correct: true}
      - {text: "Ajouter `return 0` après le `print`, pour un port par défaut", correct: false}
      - {text: "Remplacer `except ValueError` par `except Exception`", correct: false}
      - {text: "Écrire `print(int(port) + 1)` à la dernière ligne", correct: false}
    answer: |-
      ```python
      except ValueError:
          print("config invalide")
          raise
      ```
      Sans `raise`, la fonction avale l'erreur et renvoie `None`, qui fait échouer le code plus loin. Un port 0
      inventé cacherait l'erreur de configuration.
  - key: bug-raise-notimplemented
    format: bug-fix
    question: |-
      Ce programme devait afficher « à redéfinir », mais s'arrête sur « TypeError: exceptions must derive from
      BaseException » :
      ```python
      class Forme:
          def aire(self):
              raise NotImplemented


      try:
          Forme().aire()
      except NotImplementedError:
          print("à redéfinir")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Lever `NotImplementedError`, et non la constante `NotImplemented`", correct: true}
      - {text: "Renvoyer `NotImplemented` avec `return`, au lieu de le lever", correct: false}
      - {text: "Rattraper `TypeError` à la place de `NotImplementedError`", correct: false}
      - {text: "Écrire `raise NotImplemented()`, avec des parenthèses", correct: false}
    answer: |-
      ```python
      def aire(self):
          raise NotImplementedError("chaque forme calcule son aire")
      ```
      `NotImplemented` n'est pas une exception : c'est la valeur que renvoient les opérateurs (`__eq__`, `__add__`)
      qui ne savent pas traiter un type.
  - key: quand-lever
    format: course
    question: "Quand une fonction doit-elle lever une exception ?"
    choices:
      - {text: "Quand elle ne peut pas faire ce que son nom promet", correct: true}
      - {text: "Seulement quand Python a déjà levé une erreur avant", correct: false}
      - {text: "Pour renvoyer un résultat sans passer par `return`", correct: false}
      - {text: "À chaque appel réussi, pour signaler qu'elle a fini", correct: false}
    answer: "`retirer` qui ne peut pas retirer, `charger` qui ne trouve pas le fichier : l'exception dit à l'appelant que le contrat n'est pas rempli, et pourquoi."
  - key: pourquoi-raise-seul
    format: course
    question: "Pourquoi relancer avec `raise` seul, plutôt qu'en levant une nouvelle exception, dans un `except` qui journalise ?"
    choices:
      - {text: "Il relance la même exception, avec son type et sa trace d'origine", correct: true}
      - {text: "Il convertit l'exception en `RuntimeError`, plus facile à rattraper", correct: false}
      - {text: "Il relance l'exception sans afficher sa trace à l'utilisateur", correct: false}
      - {text: "C'est le seul moyen de faire remonter une exception à l'appelant", correct: false}
    answer: "L'appelant reçoit l'erreur telle qu'elle est née : il peut la rattraper par son type, et la trace montre la ligne fautive. Lever une autre exception reste possible, de préférence avec `from` pour garder la cause."
  - key: valueerror-ou-typeerror
    format: course
    question: "Quelle différence entre `ValueError` et `TypeError` ?"
    choices:
      - {text: "`TypeError` : le type ne va pas ; `ValueError` : le type va, la valeur non", correct: true}
      - {text: "`ValueError` : le type ne va pas ; `TypeError` : le type va, la valeur non", correct: false}
      - {text: "`TypeError` vient de Python ; `ValueError` est réservée à ton propre code", correct: false}
      - {text: "`TypeError` arrête le programme ; `ValueError` n'est qu'un avertissement", correct: false}
    answer: "`int([1])` lève une `TypeError` (une liste n'a pas de sens ici), `int(\"abc\")` une `ValueError` (une chaîne convient, pas celle-là). Les deux s'utilisent dans ton code comme dans la bibliothèque standard."
  - key: exception-plutot-que-none
    format: course
    question: "Pourquoi lever une exception plutôt que renvoyer `-1` ou `None` en cas d'échec ?"
    choices:
      - {text: "L'appelant ne peut pas l'ignorer par mégarde : elle remonte jusqu'à qui la traite", correct: true}
      - {text: "Une exception coûte moins cher à produire qu'une valeur de retour ordinaire", correct: false}
      - {text: "`None` et `-1` sont interdits comme valeurs de retour dans une fonction", correct: false}
      - {text: "Une exception est toujours affichée à l'utilisateur, qui sait alors quoi faire", correct: false}
    answer: "Une valeur spéciale oubliée fait échouer le programme plus loin, loin de la cause, ou pire, le laisse continuer avec une donnée fausse. Une exception non traitée s'arrête net, à l'endroit de l'erreur."
