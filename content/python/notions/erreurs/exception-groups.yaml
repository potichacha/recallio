notion: exception-groups
lesson: |-
  Quand plusieurs tâches indépendantes échouent en même temps, une seule exception ne suffit pas à le dire. Depuis
  Python 3.11, un **`ExceptionGroup`** les transporte ensemble, et **`except*`** les traite par type.

  ```python
  erreurs = [ValueError("âge négatif"), TypeError("nom absent"), ValueError("e-mail invalide")]
  try:
      raise ExceptionGroup("formulaire invalide", erreurs)
  except* ValueError as groupe:
      for e in groupe.exceptions:          # les deux ValueError
          print("valeur :", e)
  except* TypeError as groupe:
      print("type :", groupe.exceptions)   # la TypeError seule
  ```

  - `ExceptionGroup(message, exceptions)` : un message et une **liste non vide** d'exceptions (des `Exception` ;
    `BaseExceptionGroup` accepte les autres). `str(groupe)` vaut `formulaire invalide (3 sub-exceptions)`.
  - **Chaque clause `except*` qui correspond s'exécute**, une fois, sur un **sous-groupe** qui ne contient que ses
    exceptions. `as` nomme ce sous-groupe, un `ExceptionGroup`, pas une exception isolée.
  - Les exceptions qu'**aucune clause ne traite sont relancées**, dans un groupe.
  - Un `except*` rattrape aussi une exception **nue** : elle lui arrive emballée dans un groupe.
  - Un **`except` ordinaire** ne regarde pas dans le groupe : `except ValueError` ne rattrape pas un groupe qui
    contient une `ValueError`. Il rattrape le groupe entier avec `except ExceptionGroup`.
  - On ne mélange pas `except` et `except*` dans un même `try`, et `return`, `break`, `continue` sont interdits dans
    un `except*`.
  - Outils : `groupe.exceptions` (le tuple), `groupe.subgroup(ValueError)`, `groupe.split(ValueError)` ; les groupes
    peuvent s'imbriquer.
  - **Qui en lève ?** `asyncio.TaskGroup` (les erreurs de ses tâches), et ton code quand il valide tout avant de
    signaler toutes les erreurs d'un coup.

  **En entretien** : « Un `ExceptionGroup` (Python 3.11) porte plusieurs exceptions indépendantes, comme celles des
  tâches d'un `asyncio.TaskGroup`. `except*` traite chaque type sur sa part du groupe : plusieurs clauses peuvent
  s'exécuter, et ce qui reste est relancé. Un `except` ordinaire ne voit que le groupe entier. »
cards:
  - key: vf-except-ordinaire
    format: true-false
    question: "Un `except ValueError` ordinaire rattrape un `ExceptionGroup` qui contient une `ValueError`."
    truth: false
    answer: "Le groupe est une exception d'un autre type : `except` ne regarde pas dedans. Il faut `except* ValueError`, ou `except ExceptionGroup` pour le groupe entier."
  - key: vf-melange-interdit
    format: true-false
    question: "Un même `try` peut combiner des clauses `except` et des clauses `except*`."
    truth: false
    answer: "Python le refuse à la compilation (`SyntaxError`) : un `try` utilise l'une ou l'autre forme."
  - key: vf-taskgroup
    format: true-false
    question: "`asyncio.TaskGroup` rassemble les exceptions de ses tâches dans un `ExceptionGroup`."
    truth: true
    answer: "Plusieurs tâches peuvent échouer : le `TaskGroup` les attend, puis lève un groupe de toutes leurs erreurs, qu'on traite avec `except*`."
  - key: vf-deux-clauses
    format: true-false
    question: "Pour un groupe d'une `ValueError` et d'une `TypeError`, les clauses `except* ValueError` et `except* TypeError` s'exécutent toutes les deux."
    truth: true
    answer: "Contrairement à `except`, chaque clause `except*` qui trouve sa part du groupe s'exécute, une fois."
  - key: qcm-version
    format: multiple-choice
    question: "Depuis quelle version Python a-t-il `ExceptionGroup` et `except*` ?"
    choices:
      - {text: "3.11", correct: true}
      - {text: "3.8", correct: false}
      - {text: "3.10", correct: false}
      - {text: "3.13", correct: false}
    answer: "La PEP 654 les a ajoutés en 3.11, en même temps qu'`asyncio.TaskGroup` qui s'en sert."
  - key: qcm-nature-as
    format: multiple-choice
    question: "Dans `except* ValueError as groupe:`, qu'est `groupe` ?"
    choices:
      - {text: "Un `ExceptionGroup` qui ne contient que les `ValueError`", correct: true}
      - {text: "La première `ValueError` trouvée dans le groupe", correct: false}
      - {text: "Une liste Python de toutes les `ValueError`", correct: false}
      - {text: "Le groupe d'origine, avec toutes ses exceptions", correct: false}
    answer: "Un sous-groupe, même s'il ne contient qu'une exception. On les parcourt avec `groupe.exceptions`."
  - key: qcm-non-traitees
    format: multiple-choice
    question: "Que deviennent les exceptions du groupe qu'aucune clause `except*` ne traite ?"
    choices:
      - {text: "Elles sont relancées ensemble, dans un groupe", correct: true}
      - {text: "Elles sont ignorées sans laisser de trace", correct: false}
      - {text: "Elles arrêtent le programme, sans trace affichée", correct: false}
      - {text: "La dernière clause `except*` les rattrape quand même", correct: false}
    answer: "Rien ne se perd : le reste du groupe remonte, et un appelant peut le traiter à son tour."
  - key: qcm-attribut-exceptions
    format: multiple-choice
    question: "Quel attribut d'un `ExceptionGroup` donne les exceptions qu'il contient ?"
    choices:
      - {text: "`exceptions`", correct: true}
      - {text: "`errors`", correct: false}
      - {text: "`children`", correct: false}
      - {text: "`causes`", correct: false}
    answer: "`groupe.exceptions` est un tuple ; `groupe.message` donne le message. Les autres attributs n'existent pas."
  - key: code-deux-sous-groupes
    format: code-output
    question: |-
      ```python
      try:
          raise ExceptionGroup("lot", [ValueError("a"), TypeError("b"), ValueError("c")])
      except* ValueError as eg:
          print(len(eg.exceptions), end=" ")
      except* TypeError as eg:
          print(len(eg.exceptions))
      ```
    answer: "`2 1` : la première clause reçoit le sous-groupe des deux `ValueError`, la seconde celui de la `TypeError`. Les deux s'exécutent."
    check:
      output: "2 1"
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "`3 3`", correct: false}
  - key: code-str-groupe
    format: code-output
    question: |-
      ```python
      eg = ExceptionGroup("validation", [ValueError("âge"), ValueError("nom")])
      print(eg)
      ```
    answer: "`validation (2 sub-exceptions)` : le texte d'un groupe est son message, suivi du nombre d'exceptions."
    check:
      output: "validation (2 sub-exceptions)"
    choices:
      - {text: "`validation (2 sub-exceptions)`", correct: true}
      - {text: "`validation`", correct: false}
      - {text: "`[ValueError('âge'), ValueError('nom')]`", correct: false}
      - {text: "`validation: âge, nom`", correct: false}
  - key: code-reste-relance
    format: code-output
    question: |-
      ```python
      try:
          try:
              raise ExceptionGroup("lot", [ValueError("a"), KeyError("b")])
          except* ValueError:
              print("ValueError traitée", end=" ; ")
      except ExceptionGroup as reste:
          print(reste)
      ```
    answer: "`ValueError traitée ; lot (1 sub-exception)` : la `KeyError`, que rien ne traite, est relancée dans un groupe qui garde le message d'origine."
    check:
      output: "ValueError traitée ; lot (1 sub-exception)"
    choices:
      - {text: "`ValueError traitée ; lot (1 sub-exception)`", correct: true}
      - {text: "`ValueError traitée ; lot (2 sub-exceptions)`", correct: false}
      - {text: "`ValueError traitée ;`", correct: false}
      - {text: "`ValueError traitée ; 'b'`", correct: false}
  - key: code-exception-nue
    format: code-output
    question: |-
      ```python
      try:
          raise ValueError("seule")
      except* ValueError as eg:
          print(type(eg).__name__, eg.exceptions)
      ```
    answer: "`ExceptionGroup (ValueError('seule'),)` : une exception nue, rattrapée par `except*`, arrive emballée dans un groupe d'une exception."
    check:
      output: "ExceptionGroup (ValueError('seule'),)"
    choices:
      - {text: "`ExceptionGroup (ValueError('seule'),)`", correct: true}
      - {text: "`ValueError (ValueError('seule'),)`", correct: false}
      - {text: "`ValueError ('seule',)`", correct: false}
      - {text: "`ExceptionGroup [ValueError('seule')]`", correct: false}
  - key: role-groupes
    format: course
    question: "À quoi sert un `ExceptionGroup` ?"
    choices:
      - {text: "À lever plusieurs exceptions indépendantes à la fois, comme celles de tâches concurrentes", correct: true}
      - {text: "À ranger les exceptions d'une bibliothèque dans une même famille de classes", correct: false}
      - {text: "À relancer une exception sous un autre type, en gardant sa cause", correct: false}
      - {text: "À ignorer d'une seule ligne tout un ensemble d'exceptions", correct: false}
    answer: "Une famille de classes se fait par héritage, une traduction par `raise ... from`. Le groupe, lui, transporte plusieurs échecs simultanés : tâches asynchrones, validation complète d'un formulaire."
  - key: except-star-difference
    format: course
    question: "En quoi `except*` diffère-t-il d'un `except` ordinaire ?"
    choices:
      - {text: "Chaque clause qui correspond s'exécute, sur sa part du groupe", correct: true}
      - {text: "Seule la première clause s'exécute, sur le groupe entier", correct: false}
      - {text: "Il rattrape les exceptions de toute la pile d'appels", correct: false}
      - {text: "Il rattrape tout, comme un `except` écrit sans type", correct: false}
    answer: "`except` choisit une seule clause pour une seule exception ; `except*` découpe le groupe, et chaque clause traite les exceptions de son type."
  - key: lever-un-groupe
    format: course
    question: "Comment lever ensemble deux erreurs de validation ?"
    choices:
      - {text: "`raise ExceptionGroup('saisie', [ValueError('âge'), ValueError('nom')])`", correct: true}
      - {text: "`raise ValueError('âge'), ValueError('nom')`", correct: false}
      - {text: "`raise [ValueError('âge'), ValueError('nom')]`", correct: false}
      - {text: "`raise ExceptionGroup(ValueError('âge'), ValueError('nom'))`", correct: false}
    answer: "Un message, puis une liste non vide d'exceptions. `raise` n'accepte ni tuple ni liste, et le premier argument du groupe doit être le message."
  - key: interdits-except-star
    format: course
    question: "Qu'est-ce que Python refuse dans le corps d'une clause `except*` ?"
    choices:
      - {text: "`return`, `break` et `continue`, qui en sortiraient", correct: true}
      - {text: "Le mot-clé `as`, pour nommer le sous-groupe", correct: false}
      - {text: "Les exceptions définies par l'utilisateur", correct: false}
      - {text: "Plus d'une clause `except*` par `try`", correct: false}
    answer: "Plusieurs clauses peuvent s'exécuter à la suite : sortir de l'une empêcherait les autres. `as` et les exceptions personnalisées sont permis, comme plusieurs clauses."
