notion: hierarchie-exceptions
lesson: |-
  Les exceptions sont des classes, rangées dans une **hiérarchie**. Un `except` rattrape la classe qu'il nomme **et
  toutes ses sous-classes** : `except LookupError` rattrape `KeyError` et `IndexError`.

  ```
  BaseException
  ├── SystemExit                 sys.exit()
  ├── KeyboardInterrupt          Ctrl+C
  ├── GeneratorExit              fermeture d'un générateur
  └── Exception                  tout le reste : les erreurs du programme
      ├── ArithmeticError        ZeroDivisionError, OverflowError
      ├── LookupError            KeyError, IndexError
      ├── OSError                FileNotFoundError, PermissionError, TimeoutError, ConnectionError
      ├── ValueError             UnicodeDecodeError, json.JSONDecodeError
      ├── TypeError, AttributeError
      ├── NameError              UnboundLocalError
      ├── ImportError            ModuleNotFoundError
      └── RuntimeError           RecursionError, NotImplementedError
  ```

  - **`BaseException`** est la racine. Ses enfants directs hors d'`Exception` ne sont pas des erreurs, mais des
    **signaux d'arrêt** : `SystemExit` (levée par `sys.exit()`), `KeyboardInterrupt` (Ctrl+C).
  - **`except Exception`** rattrape les erreurs, et laisse passer ces signaux. **`except:` sans type** et
    `except BaseException` rattrapent tout, y compris Ctrl+C et `sys.exit()` : le programme refuse de s'arrêter.
  - **L'ordre compte** : le premier `except` qui correspond l'emporte. L'enfant s'écrit avant le parent
    (`FileNotFoundError` avant `OSError`), sinon sa clause n'est jamais atteinte.
  - **Rattrape le plus précis possible** : `except LookupError` autour d'un `config["ports"][1]` cache aussi l'indice
    faux. `except Exception: pass` avale tous les bugs.
  - `except Exception` a sa place **au sommet** : la boucle principale d'un service, qui journalise l'erreur avec sa
    trace (`logger.exception`) et passe au message suivant.
  - Tes propres exceptions héritent d'`Exception`, jamais directement de `BaseException`.
  - `issubclass(KeyError, LookupError)` et `Classe.__mro__` montrent la hiérarchie.

  **En entretien** : « Toutes les exceptions héritent de `BaseException` ; les erreurs du programme héritent
  d'`Exception`, tandis que `KeyboardInterrupt` et `SystemExit` en sont exclues pour que Ctrl+C et `sys.exit()`
  arrêtent le programme. Un `except` rattrape aussi les sous-classes, donc on écrit les plus précises d'abord. On évite
  `except:` nu et `except BaseException` ; `except Exception` se réserve au sommet, avec journalisation. »
cards:
  - key: vf-keyboardinterrupt-exception
    format: true-false
    question: "`KeyboardInterrupt`, levée par Ctrl+C, hérite d'`Exception`."
    truth: false
    answer: "Elle hérite directement de `BaseException`, comme `SystemExit` : ainsi un `except Exception` ne bloque pas Ctrl+C."
  - key: vf-lookuperror
    format: true-false
    question: "`except LookupError` rattrape aussi bien une `KeyError` qu'une `IndexError`."
    truth: true
    answer: "Les deux héritent de `LookupError` : une clé ou un indice introuvable. Un `except` rattrape la classe qu'il nomme et ses sous-classes."
  - key: vf-sys-exit
    format: true-false
    question: "`sys.exit()` lève une exception, `SystemExit`, qu'un `except:` sans type rattrape."
    truth: true
    answer: "`sys.exit()` ne tue pas le processus : il lève `SystemExit`, pour que les `finally` et les `with` fassent leur travail. Un `except:` nu l'intercepte, et le programme continue."
  - key: vf-ordre-parent-enfant
    format: true-false
    question: "Avec `except Exception` écrit avant `except ValueError`, une `ValueError` atteint quand même son propre bloc."
    truth: false
    answer: "Le premier `except` qui correspond l'emporte : `ValueError` est une `Exception`, donc le premier bloc la prend, et le second n'est jamais atteint."
  - key: qcm-racine
    format: multiple-choice
    question: "Quelle classe est la racine de toutes les exceptions ?"
    choices:
      - {text: "`BaseException`", correct: true}
      - {text: "`Exception`", correct: false}
      - {text: "`Error`", correct: false}
      - {text: "`Throwable`", correct: false}
    answer: "`BaseException` ; `Exception` est sa sous-classe pour les erreurs ordinaires. `Throwable` est la racine en Java, et `Error` n'existe pas en Python."
  - key: qcm-parent-filenotfound
    format: multiple-choice
    question: "De quelle classe hérite `FileNotFoundError` ?"
    choices:
      - {text: "`OSError`", correct: true}
      - {text: "`IOException`", correct: false}
      - {text: "`LookupError`", correct: false}
      - {text: "`ValueError`", correct: false}
    answer: "Toutes les erreurs du système (fichiers, droits, réseau) héritent d'`OSError` : `FileNotFoundError`, `PermissionError`, `ConnectionError`... `IOError` en est un ancien alias."
  - key: qcm-hors-exception
    format: multiple-choice
    question: "Laquelle de ces exceptions n'hérite pas d'`Exception` ?"
    choices:
      - {text: "`SystemExit`", correct: true}
      - {text: "`StopIteration`", correct: false}
      - {text: "`RecursionError`", correct: false}
      - {text: "`AssertionError`", correct: false}
    answer: "`SystemExit`, `KeyboardInterrupt` et `GeneratorExit` héritent directement de `BaseException`. Les trois autres sont des `Exception` ordinaires."
  - key: qcm-arithmeticerror
    format: multiple-choice
    question: "Quelle clause rattrape à la fois `ZeroDivisionError` et `OverflowError` ?"
    choices:
      - {text: "`except ArithmeticError:`", correct: true}
      - {text: "`except ValueError:`", correct: false}
      - {text: "`except LookupError:`", correct: false}
      - {text: "`except MathError:`", correct: false}
    answer: "Les deux héritent d'`ArithmeticError`, la famille des erreurs de calcul. `MathError` n'existe pas."
  - key: code-parent-en-premier
    format: code-output
    question: |-
      ```python
      try:
          [1, 2, 3][5]
      except LookupError:
          print("LookupError")
      except IndexError:
          print("IndexError")
      ```
    answer: "`LookupError` : l'`IndexError` est une `LookupError`, et le premier `except` qui correspond l'emporte. La seconde clause ne sert jamais."
    check:
      output: "LookupError"
    choices:
      - {text: "`LookupError`", correct: true}
      - {text: "`IndexError`", correct: false}
      - {text: "`LookupError` puis `IndexError`, sur deux lignes", correct: false}
      - {text: "Rien", correct: false}
  - key: code-issubclass
    format: code-output
    question: |-
      ```python
      print(issubclass(KeyError, LookupError), issubclass(KeyboardInterrupt, Exception))
      ```
    answer: "`True False` : `KeyError` est une `LookupError`, mais `KeyboardInterrupt` hérite directement de `BaseException`."
    check:
      output: "True False"
    choices:
      - {text: "`True False`", correct: true}
      - {text: "`True True`", correct: false}
      - {text: "`False False`", correct: false}
      - {text: "`False True`", correct: false}
  - key: code-unboundlocalerror
    format: code-output
    question: |-
      ```python
      compteur = 0


      def incrementer():
          compteur += 1


      try:
          incrementer()
      except NameError as e:
          print(type(e).__name__)
      ```
    answer: "`UnboundLocalError` : l'affectation rend `compteur` local à la fonction, lu avant d'avoir une valeur. `UnboundLocalError` hérite de `NameError`, d'où la clause qui la rattrape."
    check:
      output: "UnboundLocalError"
    choices:
      - {text: "`UnboundLocalError`", correct: true}
      - {text: "`NameError`", correct: false}
      - {text: "`TypeError`", correct: false}
      - {text: "`1`", correct: false}
  - key: code-mro-filenotfound
    format: code-output
    question: |-
      ```python
      print([c.__name__ for c in FileNotFoundError.__mro__])
      ```
    answer: "`['FileNotFoundError', 'OSError', 'Exception', 'BaseException', 'object']` : le `__mro__` d'une classe liste ses ancêtres, de la classe elle-même jusqu'à `object`."
    check:
      output: "['FileNotFoundError', 'OSError', 'Exception', 'BaseException', 'object']"
    choices:
      - {text: "`['FileNotFoundError', 'OSError', 'Exception', 'BaseException', 'object']`", correct: true}
      - {text: "`['FileNotFoundError', 'IOError', 'OSError', 'Exception', 'object']`", correct: false}
      - {text: "`['FileNotFoundError', 'LookupError', 'Exception', 'BaseException', 'object']`", correct: false}
      - {text: "`['FileNotFoundError', 'OSError', 'BaseException', 'Exception', 'object']`", correct: false}
  - key: bug-except-nu-interruption
    format: bug-fix
    question: |-
      Ce programme simule un Ctrl+C à la ligne `STOP`. Il devait s'arrêter, mais affiche « ligne ignorée : abc »,
      « ligne ignorée : STOP », puis « total : 42 » :
      ```python
      def lire(ligne):
          if ligne == "STOP":
              raise KeyboardInterrupt  # comme un Ctrl+C
          return int(ligne)


      total = 0
      for ligne in ["12", "abc", "STOP", "30"]:
          try:
              total += lire(ligne)
          except:
              print("ligne ignorée :", ligne)
      print("total :", total)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Rattraper `ValueError`, l'erreur de conversion prévue", correct: true}
      - {text: "Rattraper `BaseException`, plus explicite que `except:`", correct: false}
      - {text: "Ajouter `finally: break` pour sortir de la boucle", correct: false}
      - {text: "Tester `ligne == \"STOP\"` dans la boucle, avant `lire`", correct: false}
    answer: |-
      ```python
      except ValueError:
          print("ligne ignorée :", ligne)
      ```
      Un `except:` nu rattrape tout, `KeyboardInterrupt` comprise. `except BaseException` fait pareil. En ne
      rattrapant que l'erreur prévue, Ctrl+C arrête de nouveau le programme.
  - key: bug-parent-avant-enfant
    format: bug-fix
    question: |-
      Ce programme devait afficher « fichier absent, on en crée un », mais affiche « erreur système » :
      ```python
      try:
          open("absent.txt", encoding="utf-8")
      except OSError:
          print("erreur système")
      except FileNotFoundError:
          print("fichier absent, on en crée un")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Placer `except FileNotFoundError` avant `except OSError`", correct: true}
      - {text: "Remplacer `OSError` par `Exception`, plus générale", correct: false}
      - {text: "Ouvrir le fichier en mode `\"w\"` pour éviter l'erreur", correct: false}
      - {text: "Ajouter un `else` qui affiche le message du fichier absent", correct: false}
    answer: |-
      ```python
      except FileNotFoundError:
          print("fichier absent, on en crée un")
      except OSError:
          print("erreur système")
      ```
      `FileNotFoundError` est une `OSError` : la première clause la prenait. L'enfant s'écrit avant le parent.
  - key: bug-baseexception-sys-exit
    format: bug-fix
    question: |-
      `arreter` devait terminer le programme, mais celui-ci affiche « arrêt demandé », « erreur ignorée », puis « le
      programme continue » :
      ```python
      import sys


      def arreter():
          print("arrêt demandé")
          sys.exit(0)


      try:
          arreter()
      except BaseException:
          print("erreur ignorée")
      print("le programme continue")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Rattraper `Exception`, qui laisse passer `SystemExit`", correct: true}
      - {text: "Remplacer `sys.exit(0)` par `sys.exit(1)`", correct: false}
      - {text: "Ajouter `finally: sys.exit(0)` après le `except`", correct: false}
      - {text: "Appeler `exit()` au lieu de `sys.exit(0)`", correct: false}
    answer: |-
      ```python
      except Exception:
          print("erreur ignorée")
      ```
      `sys.exit()` lève `SystemExit`, une `BaseException` qui n'est pas une `Exception`. `except BaseException`
      l'avale. `exit()` lève la même exception.
  - key: bug-lookuperror-trop-large
    format: bug-fix
    question: |-
      La configuration déclare le port 8080, mais ce programme affiche `80`, sans aucune erreur :
      ```python
      config = {"ports": [8080]}
      try:
          port = config["ports"][1]
      except LookupError:
          port = 80  # clé "ports" absente : port par défaut
      print(port)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Rattraper `KeyError` seule : l'`IndexError` de `[1]` apparaîtra", correct: true}
      - {text: "Rattraper `IndexError` seule : c'est elle qui est prévue", correct: false}
      - {text: "Remplacer le port par défaut 80 par 8080", correct: false}
      - {text: "Rattraper `Exception` pour couvrir tous les cas", correct: false}
    answer: |-
      ```python
      try:
          ports = config["ports"]
      except KeyError:
          ports = [80]
      port = ports[0]
      ```
      `LookupError` rattrape `KeyError` et `IndexError` : l'indice faux `[1]` passait pour une clé absente.
      Rattraper l'exception prévue, sur la seule ligne concernée, révèle le bug.
  - key: situation-boucle-service
    format: scenario
    question: |-
      Ton service traite des messages dans une boucle sans fin. Un message mal formé ne doit pas l'arrêter. Où
      rattrapes-tu les erreurs, et lesquelles ?
    choices:
      - {text: "`except Exception` autour du traitement d'un message, en journalisant la trace", correct: true}
      - {text: "`except BaseException` autour de toute la boucle, pour être sûr de tout couvrir", correct: false}
      - {text: "Un `except:` nu dans la fonction de traitement, suivi d'un simple `pass`", correct: false}
      - {text: "Nulle part : le superviseur relancera le service à chaque plantage", correct: false}
    answer: "Au sommet de chaque itération, `except Exception` isole un message défaillant ; `logger.exception` garde la trace pour corriger le bug. Ctrl+C et `sys.exit()` passent encore, ce que `BaseException` empêcherait."
  - key: situation-except-pass-paiement
    format: scenario
    question: |-
      En revue, tu lis `except Exception: pass` autour d'un appel à une API de paiement. Que demandes-tu ?
    choices:
      - {text: "De rattraper les erreurs prévues, et de journaliser ou relancer les autres", correct: true}
      - {text: "D'écrire `except BaseException: pass`, qui couvre encore plus de cas", correct: false}
      - {text: "De garder le code : un paiement raté n'empêche pas la commande", correct: false}
      - {text: "D'entourer ce `try` d'un second `try`, par sécurité", correct: false}
    answer: "Un paiement qui échoue en silence est un bug grave, et une faute de frappe y passerait inaperçue. On rattrape les erreurs connues (refus, délai dépassé) pour les traiter, et on laisse les autres se voir."
  - key: situation-config-facultative
    format: scenario
    question: |-
      Ton programme lit un fichier de configuration facultatif : s'il manque, les valeurs par défaut s'appliquent ;
      s'il est illisible (droits refusés), l'erreur doit remonter. Que rattrapes-tu ?
    choices:
      - {text: "`FileNotFoundError` seule", correct: true}
      - {text: "`OSError`, qui couvre les fichiers", correct: false}
      - {text: "`Exception`, pour démarrer quand même", correct: false}
      - {text: "`PermissionError` seule", correct: false}
    answer: "Seul le fichier absent est un cas prévu. `OSError` rattraperait aussi `PermissionError`, qui doit remonter : un fichier présent mais illisible est une anomalie."
  - key: situation-ctrl-c-ignore
    format: scenario
    question: |-
      Un utilisateur se plaint : Ctrl+C n'arrête plus ton script, qui affiche « erreur, on continue ». Que cherches-tu
      dans le code ?
    choices:
      - {text: "Un `except:` nu ou un `except BaseException`, qui rattrape Ctrl+C", correct: true}
      - {text: "Un `except Exception`, qui rattrape lui aussi Ctrl+C", correct: false}
      - {text: "Un `finally` qui relance la boucle après chaque interruption", correct: false}
      - {text: "Rien : Python ignore Ctrl+C tant qu'une boucle tourne", correct: false}
    answer: "Ctrl+C lève `KeyboardInterrupt`, une `BaseException` qui n'est pas une `Exception`. Seuls `except:` et `except BaseException` (ou `except KeyboardInterrupt`) l'interceptent."
  - key: pourquoi-pas-except-nu
    format: course
    question: "Pourquoi éviter un `except:` sans type ?"
    choices:
      - {text: "Il rattrape aussi Ctrl+C et `sys.exit()`, et cache les bugs", correct: true}
      - {text: "Python 3 le refuse : il exige un type d'exception", correct: false}
      - {text: "Il ne rattrape que les exceptions de la bibliothèque standard", correct: false}
      - {text: "Il ralentit chaque instruction placée dans le `try`", correct: false}
    answer: "`except:` équivaut à `except BaseException:` : signaux d'arrêt et erreurs de programmation y passent tous. On nomme l'exception qu'on sait traiter."
  - key: pourquoi-heriter-exception
    format: course
    question: "Pourquoi tes propres exceptions héritent-elles d'`Exception`, et non de `BaseException` ?"
    choices:
      - {text: "Les enfants directs de `BaseException` sont des signaux d'arrêt, hors d'`except Exception`", correct: true}
      - {text: "`BaseException` est abstraite : aucune classe ne peut en hériter directement", correct: false}
      - {text: "Une `Exception` se lève plus vite qu'une `BaseException`", correct: false}
      - {text: "`BaseException` n'accepte pas de message en argument", correct: false}
    answer: "Une erreur de ton code doit être rattrapée par `except Exception`, comme les autres. Hériter de `BaseException` la ferait passer à travers, comme un Ctrl+C."
  - key: ordre-except-parent-enfant
    format: course
    question: "Dans quel ordre écrire des `except` sur une classe parente et sur sa classe enfant ?"
    choices:
      - {text: "L'enfant d'abord : le premier `except` qui correspond l'emporte", correct: true}
      - {text: "Le parent d'abord : il transmet ensuite l'exception à l'enfant", correct: false}
      - {text: "L'ordre est libre : Python choisit toujours la clause la plus précise", correct: false}
      - {text: "L'ordre est libre : Python exécute toutes les clauses qui correspondent", correct: false}
    answer: "Python teste les clauses de haut en bas et s'arrête à la première qui correspond. Un parent placé avant rend la clause de l'enfant inatteignable."
  - key: points-communs-keyerror-indexerror
    format: course
    question: "Qu'ont en commun `KeyError` et `IndexError` ?"
    choices:
      - {text: "Elles héritent de `LookupError` : une clé ou un indice absent", correct: true}
      - {text: "Elles héritent de `ValueError` : une valeur hors des bornes", correct: false}
      - {text: "Elles ne sont levées que par les dictionnaires", correct: false}
      - {text: "Rien : elles héritent directement de `BaseException`", correct: false}
    answer: "`LookupError` regroupe les accès qui ne trouvent rien : clé de dictionnaire, indice de séquence. Une classe qui imite un conteneur lève l'une ou l'autre."
