notion: exceptions-bases
lesson: |-
  Une **exception** signale qu'une opération n'a pas pu se faire : `int("abc")` lève une `ValueError`, `d["x"]` une
  `KeyError` si la clé manque. Si personne ne la rattrape, elle remonte les appels de fonction, puis arrête le
  programme en affichant la **trace** (traceback). L'instruction `try` permet de la rattraper.

  ```python
  def diviser(a, b):
      try:
          resultat = a / b              # le code qui peut échouer, et lui seul
      except ZeroDivisionError:
          print("division par zéro")    # si cette exception survient
          return None
      else:
          return resultat               # seulement si le try n'a rien levé
      finally:
          print("fin")                  # dans tous les cas, même après un return
  ```

  | Clause | Quand elle s'exécute |
  |---|---|
  | `try` | toujours, jusqu'à la première exception |
  | `except Type:` | si une exception de ce type (ou d'une sous-classe) a été levée dans le `try` |
  | `else` | si le `try` s'est terminé sans exception |
  | `finally` | toujours : succès, exception rattrapée ou non, `return`, `break` |

  - **Le premier `except` qui correspond l'emporte**, les autres sont ignorés. Les clauses s'écrivent dans l'ordre
    `try`, `except`, `else`, `finally` ; `else` et `finally` sont facultatives.
  - **Plusieurs types** : `except (ValueError, TypeError):`. Depuis Python 3.14, les parenthèses sont facultatives
    quand il n'y a pas de `as` (`except ValueError, TypeError:`).
  - **`as`** nomme l'exception : `except KeyError as e:`. `str(e)` donne son message, `e.args` ses arguments. La
    variable `e` est effacée à la fin du bloc `except`.
  - Quand une exception survient, la suite du `try` **n'est pas exécutée** : une variable qu'il devait créer n'existe
    pas forcément après.
  - **Rattrape l'exception précise** que tu sais traiter, et garde le `try` court : un `except Exception` autour de dix
    lignes cache aussi les fautes de frappe (`AttributeError`, `NameError`).

  | Exception | Exemple |
  |---|---|
  | `ValueError` | `int("abc")` : le bon type, une mauvaise valeur |
  | `TypeError` | `"1" + 1` : un type qui ne convient pas |
  | `KeyError` | `{"a": 1}["b"]` |
  | `IndexError` | `[1, 2][5]` |
  | `ZeroDivisionError` | `1 / 0` |
  | `FileNotFoundError` | `open("absent.txt")` |
  | `AttributeError` | `"abc".strp()` |

  **En entretien** : « `try` entoure le code qui peut échouer, `except` rattrape un type d'exception précis (le
  premier qui correspond l'emporte), `else` s'exécute si rien n'a été levé et `finally` dans tous les cas, pour libérer
  une ressource. On rattrape seulement ce qu'on sait traiter, dans un `try` court. Une exception non rattrapée remonte
  la pile d'appels et arrête le programme avec sa trace. »
tour:
  - title: "Rattraper une exception : try et except"
    text: |-
      Python signale une erreur par une **exception** : `int("abc")` lève une `ValueError`, `1 / 0` une
      `ZeroDivisionError`. Non rattrapée, elle arrête le programme et affiche sa trace.

      `try` entoure le code qui peut échouer ; `except` nomme le type d'exception qu'on sait traiter, et `as` donne
      accès à l'exception elle-même. Deux clauses facultatives complètent l'instruction :

      - `else` s'exécute seulement si le `try` n'a rien levé ;
      - `finally` s'exécute dans tous les cas, même après un `return`.

      Regarde l'ordre des lignes affichées par `diviser` : le `finally` passe avant que l'appelant n'affiche le
      résultat.

      Essaie : ajoute `"0"` à la liste des textes, et remplace `int(texte) * 2` par `10 // int(texte)`. Le programme
      s'arrête sur une `ZeroDivisionError` : ajoute un second `except` pour elle.
    example:
      files:
        main.py: |-
          def diviser(a, b):
              try:
                  resultat = a / b
              except ZeroDivisionError:
                  print("division par zéro")
                  return None
              else:
                  print("ok")
                  return resultat
              finally:
                  print("fin de diviser")


          print(diviser(10, 4))
          print(diviser(1, 0))

          for texte in ["12", "abc", "7"]:
              try:
                  print(int(texte) * 2)
              except ValueError as erreur:
                  print("invalide :", erreur)
      output: |-
        ok
        fin de diviser
        2.5
        division par zéro
        fin de diviser
        None
        24
        invalide : invalid literal for int() with base 10: 'abc'
        14
    task:
      instructions: |-
        Ce programme vérifie chaque saisie avec `isdigit()` avant de la convertir. Remplace ce test par un `try` :
        ajoute au total chaque saisie que `int` accepte, et affiche `ignoré : <saisie>` pour chacune de celles qu'il
        refuse, avec une `ValueError`. La sortie attendue :

        ```
        ignoré : vingt
        ignoré : 4,5
        total : 40
        ```
      starter:
        main.py: |-
          def lire_entier(texte):
              return int(texte)


          saisies = ["10", "vingt", "30", "4,5"]
          total = 0
          for saisie in saisies:
              if saisie.isdigit():
                  total += lire_entier(saisie)
          print("total :", total)
      solution:
        main.py: |-
          def lire_entier(texte):
              return int(texte)


          saisies = ["10", "vingt", "30", "4,5"]
          total = 0
          for saisie in saisies:
              try:
                  total += lire_entier(saisie)
              except ValueError:
                  print("ignoré :", saisie)
          print("total :", total)
      output: |-
        ignoré : vingt
        ignoré : 4,5
        total : 40
cards:
  - key: vf-else-sans-exception
    format: true-false
    question: "Le bloc `else` d'une instruction `try` s'exécute seulement si le bloc `try` n'a levé aucune exception."
    truth: true
    answer: "`else` accueille la suite du traitement réussi : on y met le code qui ne doit pas être protégé par le `except`, pour ne pas rattraper ses erreurs par mégarde."
  - key: vf-finally-apres-return
    format: true-false
    question: "Le bloc `finally` s'exécute même quand le bloc `try` se termine par un `return`."
    truth: true
    answer: "`finally` s'exécute à toute sortie du `try` : fin normale, `return`, `break`, exception rattrapée ou non. C'est là qu'on libère une ressource."
  - key: vf-tous-les-except
    format: true-false
    question: "Quand plusieurs clauses `except` correspondent à l'exception levée, Python les exécute toutes, dans l'ordre."
    truth: false
    answer: "Seule la **première** clause qui correspond s'exécute. C'est pourquoi on écrit les exceptions précises avant les plus générales."
  - key: vf-exception-arrete
    format: true-false
    question: "Une exception que personne ne rattrape arrête le programme, après avoir affiché la trace des appels (traceback)."
    truth: true
    answer: "Elle remonte de fonction appelante en fonction appelante ; arrivée en haut sans avoir été rattrapée, elle arrête le programme et affiche sa trace sur la sortie d'erreur."
  - key: qcm-int-invalide
    format: multiple-choice
    question: "Quelle exception lève `int(\"abc\")` ?"
    choices:
      - {text: "`ValueError`", correct: true}
      - {text: "`TypeError`", correct: false}
      - {text: "`SyntaxError`", correct: false}
      - {text: "`ArithmeticError`", correct: false}
    answer: "Le type est bon (une chaîne), mais sa valeur ne représente pas un entier : `ValueError: invalid literal for int() with base 10: 'abc'`."
  - key: qcm-deux-types
    format: multiple-choice
    question: "Quelle clause rattrape à la fois `ValueError` et `TypeError` ?"
    choices:
      - {text: "`except (ValueError, TypeError):`", correct: true}
      - {text: "`except ValueError or TypeError:`", correct: false}
      - {text: "`except [ValueError, TypeError]:`", correct: false}
      - {text: "`except ValueError and TypeError:`", correct: false}
    answer: "Un tuple de types. `ValueError or TypeError` vaut `ValueError` seule, `and` vaut `TypeError` seule, et une liste lève une `TypeError` au moment de comparer. Depuis Python 3.14, `except ValueError, TypeError:` (sans `as`) est aussi accepté."
  - key: qcm-ordre-clauses
    format: multiple-choice
    question: "Dans quel ordre s'écrivent les clauses d'une instruction `try` complète ?"
    choices:
      - {text: "`try`, `except`, `else`, `finally`", correct: true}
      - {text: "`try`, `else`, `except`, `finally`", correct: false}
      - {text: "`try`, `finally`, `except`, `else`", correct: false}
      - {text: "`try`, `except`, `finally`, `else`", correct: false}
    answer: "`else` suit les `except` (il ne sert que si aucun n'a été déclenché), et `finally` vient toujours en dernier."
  - key: qcm-cle-manquante
    format: multiple-choice
    question: "Le dictionnaire `stock` n'a pas la clé `\"poire\"`. Quelle exception lève `stock[\"poire\"]` ?"
    choices:
      - {text: "`KeyError`", correct: true}
      - {text: "`IndexError`", correct: false}
      - {text: "`ValueError`", correct: false}
      - {text: "`AttributeError`", correct: false}
    answer: "`KeyError: 'poire'`. `IndexError` est réservée aux indices hors bornes d'une séquence (liste, tuple, chaîne). `stock.get(\"poire\")` renverrait `None` sans lever d'exception."
  - key: trous-except-valueerror
    format: fill-in
    question: |-
      Complète pour qu'une saisie qui n'est pas un entier donne `None`, au lieu d'arrêter le programme :
      ```python
      try:
          age = int(saisie)
      ___ ValueError:
          age = None
      ```
    blanks:
      - - except
    answer: "`except ValueError:` rattrape l'erreur de conversion levée par `int`."
  - key: trous-as
    format: fill-in
    question: |-
      Complète pour afficher le message de l'exception rattrapée :
      ```python
      try:
          valeur = config["port"]
      except KeyError ___ erreur:
          print("clé absente :", erreur)
      ```
    blanks:
      - - as
    answer: "`as` lie l'exception à un nom, le temps du bloc `except`. Le nom est effacé à la sortie du bloc."
  - key: trous-finally
    format: fill-in
    question: |-
      Complète pour que `connexion.fermer()` soit appelé dans tous les cas, que l'envoi réussisse ou échoue :
      ```python
      connexion = ouvrir()
      try:
          connexion.envoyer(message)
      ___:
          connexion.fermer()
      ```
    blanks:
      - - finally
    answer: "`finally` s'exécute toujours, même si `envoyer` lève une exception, qui reprend ensuite sa remontée. Pour un fichier ou un verrou, `with` fait la même chose plus simplement."
  - key: trous-else
    format: fill-in
    question: |-
      Complète pour n'afficher « converti » que si la conversion a réussi, sans protéger `print` par le `except` :
      ```python
      try:
          n = int(texte)
      except ValueError:
          print("invalide")
      ___:
          print("converti", n)
      ```
    blanks:
      - - else
    answer: "`else` s'exécute seulement si le `try` n'a rien levé. Placer le `print` dans le `try` marcherait aussi, mais une erreur du `print` serait alors rattrapée par erreur."
  - key: code-finally-avant-print
    format: code-output
    question: |-
      ```python
      def f(x):
          try:
              r = 10 // x
          except ZeroDivisionError:
              return "zéro"
          else:
              return f"r={r}"
          finally:
              print("fin", end=" ")


      print(f(2), f(0))
      ```
    answer: "`fin fin r=5 zéro` : les arguments de `print` sont évalués d'abord. Chaque appel de `f` passe par son `finally`, qui affiche `fin`, avant que le `print` extérieur n'affiche les deux résultats."
    check:
      output: "fin fin r=5 zéro"
    choices:
      - {text: "`fin fin r=5 zéro`", correct: true}
      - {text: "`r=5 fin zéro fin`", correct: false}
      - {text: "`fin r=5 fin zéro`", correct: false}
      - {text: "`r=5 zéro fin fin`", correct: false}
  - key: code-deux-except
    format: code-output
    question: |-
      ```python
      total = 0
      for n in ["4", "x", "0", "2"]:
          try:
              total += 8 // int(n)
          except ValueError:
              total += 100
          except ZeroDivisionError:
              total += 10
      print(total)
      ```
    answer: "`116` : `8 // 4` donne 2, `\"x\"` lève une `ValueError` (+100), `\"0\"` une `ZeroDivisionError` (+10), et `8 // 2` donne 4."
    check:
      output: "116"
    choices:
      - {text: "`116`", correct: true}
      - {text: "`106`", correct: false}
      - {text: "`16`", correct: false}
      - {text: "`112`", correct: false}
  - key: code-try-interrompu
    format: code-output
    question: |-
      ```python
      etapes = []
      try:
          etapes.append("a")
          int("trois")
          etapes.append("b")
      except ValueError:
          etapes.append("c")
      etapes.append("d")
      print(etapes)
      ```
    answer: "`['a', 'c', 'd']` : dès que `int` lève l'exception, la suite du `try` est abandonnée ; `\"b\"` n'est jamais ajouté. Après le `except`, le programme continue normalement."
    check:
      output: "['a', 'c', 'd']"
    choices:
      - {text: "`['a', 'c', 'd']`", correct: true}
      - {text: "`['a', 'b', 'c', 'd']`", correct: false}
      - {text: "`['c', 'd']`", correct: false}
      - {text: "`['a', 'b', 'd']`", correct: false}
  - key: code-message-keyerror
    format: code-output
    question: |-
      ```python
      try:
          {"a": 1}["b"]
      except KeyError as e:
          print("clé absente :", e)
      ```
    answer: "`clé absente : 'b'` : le message d'une `KeyError` est le `repr` de la clé, avec ses guillemets."
    check:
      output: "clé absente : 'b'"
    choices:
      - {text: "`clé absente : 'b'`", correct: true}
      - {text: "`clé absente : b`", correct: false}
      - {text: "`clé absente : KeyError: 'b'`", correct: false}
      - {text: "`clé absente : {'a': 1}`", correct: false}
  - key: bug-or-entre-types
    format: bug-fix
    question: |-
      Ce programme affiche `None`, puis s'arrête sur « TypeError: int() argument must be a string, a bytes-like
      object or a real number, not 'NoneType' » :
      ```python
      def convertir(valeur):
          try:
              return int(valeur)
          except ValueError or TypeError:
              return None


      print(convertir("abc"))
      print(convertir(None))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `except (ValueError, TypeError):`, un tuple de types", correct: true}
      - {text: "Écrire `except ValueError and TypeError:`, qui exige les deux", correct: false}
      - {text: "Ajouter `finally: return None` à la fin de la fonction", correct: false}
      - {text: "Remplacer `int(valeur)` par `int(str(valeur))`, toujours valide", correct: false}
    answer: |-
      ```python
      except (ValueError, TypeError):
          return None
      ```
      `ValueError or TypeError` est une expression évaluée d'abord : elle vaut `ValueError`, la seule rattrapée. Un
      tuple nomme les deux types. Un `return` dans `finally` avalerait toutes les exceptions, même les bugs.
  - key: bug-variable-absente
    format: bug-fix
    question: |-
      Ce programme affiche « conversion impossible », puis s'arrête sur « NameError: name 'valeur' is not defined » :
      ```python
      try:
          valeur = int("dix")
      except ValueError:
          print("conversion impossible")
      print(valeur * 2)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Donner une valeur à `valeur` dans le `except`, comme `valeur = 0`", correct: true}
      - {text: "Déplacer le `print(valeur * 2)` dans un bloc `finally`", correct: false}
      - {text: "Déclarer `global valeur` au début du bloc `try`", correct: false}
      - {text: "Rattraper `NameError` en plus de `ValueError`", correct: false}
    answer: |-
      ```python
      except ValueError:
          print("conversion impossible")
          valeur = 0
      ```
      L'affectation n'a jamais eu lieu : `int` a levé l'exception avant. Le `finally` s'exécuterait aussi après
      l'échec, avec la même `NameError`.
  - key: bug-mauvais-type
    format: bug-fix
    question: |-
      Ce programme devait afficher « produit inconnu », mais s'arrête sur « KeyError: 'poire' » :
      ```python
      stock = {"pomme": 3}
      try:
          print(stock["poire"])
      except IndexError:
          print("produit inconnu")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Rattraper `KeyError`, l'exception d'une clé absente", correct: true}
      - {text: "Rattraper `ValueError`, l'exception d'une valeur absente", correct: false}
      - {text: "Écrire `stock.poire` au lieu de `stock[\"poire\"]`", correct: false}
      - {text: "Ajouter un bloc `else` qui affiche « produit inconnu »", correct: false}
    answer: |-
      ```python
      except KeyError:
          print("produit inconnu")
      ```
      Un dictionnaire lève `KeyError` ; `IndexError` concerne les indices des séquences. Ici, `stock.get("poire")`
      éviterait même le `try`.
  - key: bug-except-trop-large
    format: bug-fix
    question: |-
      Ce programme affiche `None` pour une saisie pourtant valide :
      ```python
      def lire_age(texte):
          try:
              return int(texte.strp())
          except Exception:
              return None


      print(lire_age("42"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Rattraper `ValueError` seule : la faute `strp` apparaîtra, puis la corriger", correct: true}
      - {text: "Rattraper `BaseException`, pour couvrir aussi ce cas particulier", correct: false}
      - {text: "Remplacer `return None` par `return 0`, une valeur plus sûre", correct: false}
      - {text: "Ajouter un bloc `else` qui renvoie `int(texte)` après le `try`", correct: false}
    answer: |-
      ```python
      try:
          return int(texte.strip())
      except ValueError:
          return None
      ```
      `texte.strp()` lève une `AttributeError`, que `except Exception` avale : le bug passe pour une saisie
      invalide. Rattraper seulement l'exception prévue laisse les autres erreurs se montrer.
  - key: role-else
    format: course
    question: "À quoi sert le bloc `else` d'une instruction `try` ?"
    choices:
      - {text: "À exécuter du code seulement si le `try` n'a rien levé", correct: true}
      - {text: "À exécuter du code quand aucun `except` ne correspond", correct: false}
      - {text: "À exécuter du code dans tous les cas, comme `finally`", correct: false}
      - {text: "À traiter les exceptions qu'aucun `except` ne nomme", correct: false}
    answer: "`else` garde hors du `try` la suite du traitement réussi : ses erreurs à lui ne seront pas rattrapées par erreur par les `except`."
  - key: role-finally
    format: course
    question: "Quand le bloc `finally` s'exécute-t-il ?"
    choices:
      - {text: "Toujours : succès, exception ou `return` dans le `try`", correct: true}
      - {text: "Seulement quand le `try` lève une exception rattrapée", correct: false}
      - {text: "Seulement quand aucune exception n'a été levée", correct: false}
      - {text: "Seulement quand une exception remonte sans être rattrapée", correct: false}
    answer: "C'est sa raison d'être : libérer une ressource (fichier, connexion, verrou) quoi qu'il arrive. Une exception non rattrapée reprend sa remontée après le `finally`."
  - key: try-court
    format: course
    question: "Pourquoi garder le bloc `try` aussi court que possible ?"
    choices:
      - {text: "Pour ne rattraper que l'erreur prévue, pas celles des autres lignes", correct: true}
      - {text: "Parce qu'un long bloc `try` ralentit nettement chaque instruction", correct: false}
      - {text: "Parce que Python annule les lignes déjà exécutées du `try` en cas d'erreur", correct: false}
      - {text: "Parce qu'un `except` ne voit que la dernière ligne du bloc `try`", correct: false}
    answer: "Le `except` rattrape son type d'exception d'où qu'il vienne dans le `try`. Plus le bloc est long, plus il risque de prendre pour l'erreur prévue un vrai bug. Rien n'est annulé : ce qui a été fait reste fait."
  - key: exception-non-rattrapee
    format: course
    question: "Que devient une exception levée dans une fonction, quand aucun `except` de cette fonction ne la rattrape ?"
    choices:
      - {text: "Elle remonte à la fonction appelante, et ainsi de suite", correct: true}
      - {text: "Python l'ignore, et passe à la ligne qui suit l'erreur", correct: false}
      - {text: "La fonction renvoie `None` à son appelant, sans erreur", correct: false}
      - {text: "Python affiche un avertissement, et la fonction continue", correct: false}
    answer: "L'exception remonte la pile d'appels jusqu'à un `except` qui lui correspond. Si elle arrive en haut sans en trouver, le programme s'arrête et affiche la trace de tous ces appels."
