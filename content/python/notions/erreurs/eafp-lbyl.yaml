notion: eafp-lbyl
lesson: |-
  Deux styles pour une opération qui peut échouer :

  - **LBYL**, *Look Before You Leap* (regarde avant de sauter) : vérifier d'abord, puis agir.
  - **EAFP**, *Easier to Ask for Forgiveness than Permission* (plus facile de demander pardon que la permission) :
    agir, et traiter l'échec dans un `except`.

  ```python
  # LBYL
  if cle in config:
      port = config[cle]
  else:
      port = 80

  # EAFP
  try:
      port = config[cle]
  except KeyError:
      port = 80
  ```

  Le style **EAFP est le plus pythonique**, pour plusieurs raisons :

  - **Pas de course entre la vérification et l'action** (TOCTOU, *time of check to time of use*) : entre
    `os.path.exists(chemin)` et `open(chemin)`, le fichier peut disparaître. Le `try` gère l'échec réel.
  - **Une seule opération** au lieu de deux (`in` puis `[]`).
  - **Il va avec le duck typing** : on utilise l'objet, au lieu de tester son type.
  - **Il gère tous les cas** : `"-7".isdigit()` vaut `False`, alors que `int("-7")` réussit. Le test ne reproduit
    jamais exactement les règles de l'opération.

  Mais **LBYL reste préférable quand l'échec est fréquent** : depuis Python 3.11, un `try` ne coûte presque rien
  quand rien n'est levé (*zero-cost exceptions*), mais lever et rattraper une exception coûte cher. Et souvent, une
  troisième voie évite les deux :

  | Besoin | Sans `try` ni `if` |
  |---|---|
  | une clé facultative | `d.get(cle, defaut)`, `d.setdefault(cle, [])` |
  | compter | `collections.Counter`, `defaultdict(int)` |
  | un attribut facultatif | `getattr(obj, "nom", defaut)` |
  | ignorer une erreur précise | `with contextlib.suppress(FileNotFoundError):` |

  Dans les deux styles, le `try` reste court et rattrape l'exception précise.

  **En entretien** : « LBYL vérifie avant d'agir, EAFP agit et traite l'exception ; Python préfère EAFP. Il évite la
  course entre la vérification et l'action (un fichier qui disparaît entre `exists` et `open`), fait une seule
  opération et suit le duck typing. Quand l'échec est le cas fréquent, une exception coûte cher : on teste, ou on
  prend `dict.get`, `getattr` avec défaut ou `Counter`. »
cards:
  - key: vf-fichier-disparu
    format: true-false
    question: "Après `os.path.exists(chemin)` qui renvoie `True`, `open(chemin)` peut quand même lever `FileNotFoundError`."
    truth: true
    answer: "Un autre processus peut supprimer le fichier entre les deux appels : c'est une faille TOCTOU. Seul le `try` autour d'`open` gère l'échec réel."
  - key: vf-try-gratuit
    format: true-false
    question: "Depuis Python 3.11, entrer dans un bloc `try` ne coûte presque rien tant qu'aucune exception n'est levée."
    truth: true
    answer: "Ce sont les exceptions « à coût nul » : le `try` ne coûte rien à l'entrée. Lever et rattraper une exception, en revanche, reste coûteux."
  - key: vf-eafp-echec-frequent
    format: true-false
    question: "EAFP reste le meilleur choix même quand l'échec est le cas le plus fréquent."
    truth: false
    answer: "Lever et rattraper une exception coûte cher : si la plupart des clés manquent, un test, `dict.get` ou `defaultdict` est plus rapide et plus lisible."
  - key: vf-get-ni-l-un-ni-l-autre
    format: true-false
    question: "`d.get(cle, 0)` évite à la fois le test `cle in d` et le `try` / `except KeyError`."
    truth: true
    answer: "`get` renvoie la valeur par défaut quand la clé manque, en une seule recherche, sans exception : souvent la meilleure solution pour une clé facultative."
  - key: qcm-extrait-lbyl
    format: multiple-choice
    question: "Lequel de ces extraits suit le style LBYL ?"
    choices:
      - {text: "`if cle in d:` puis `valeur = d[cle]`", correct: true}
      - {text: "`try: valeur = d[cle]` puis `except KeyError:`", correct: false}
      - {text: "`with suppress(KeyError): valeur = d[cle]`", correct: false}
      - {text: "`valeur = d[cle]`, sans aucune précaution", correct: false}
    answer: "On regarde (`in`) avant de sauter (`[]`). Les deux suivants sont de l'EAFP : agir, puis traiter ou ignorer l'échec."
  - key: qcm-pas-de-course
    format: multiple-choice
    question: "Pourquoi ouvrir directement un fichier, dans un `try`, évite-t-il une situation de compétition ?"
    choices:
      - {text: "Il n'y a plus d'intervalle entre la vérification et l'ouverture", correct: true}
      - {text: "Le `try` pose un verrou sur le fichier pendant son exécution", correct: false}
      - {text: "Python rouvre le fichier jusqu'à ce que l'ouverture réussisse", correct: false}
      - {text: "Le fichier est lu en entier avant que quiconque puisse y toucher", correct: false}
    answer: "La vérification, c'est l'ouverture elle-même : elle réussit ou elle échoue, et le `except` traite l'échec. Rien ne verrouille le fichier."
  - key: qcm-attribut-facultatif
    format: multiple-choice
    question: "Comment lire l'attribut facultatif `obj.couleur`, avec `\"noir\"` par défaut, en une seule expression ?"
    choices:
      - {text: "`getattr(obj, 'couleur', 'noir')`", correct: true}
      - {text: "`obj.couleur or 'noir'`", correct: false}
      - {text: "`obj.get('couleur', 'noir')`", correct: false}
      - {text: "`hasattr(obj, 'couleur', 'noir')`", correct: false}
    answer: "`getattr` avec un troisième argument renvoie le défaut sur `AttributeError`. `obj.couleur or ...` lève l'exception si l'attribut manque ; `get` est une méthode des dictionnaires ; `hasattr` ne prend que deux arguments."
  - key: qcm-quand-lbyl
    format: multiple-choice
    question: "Quand LBYL est-il préférable à EAFP ?"
    choices:
      - {text: "Quand l'échec est fréquent : lever et rattraper coûte cher", correct: true}
      - {text: "Quand le code tourne dans plusieurs threads à la fois", correct: false}
      - {text: "Quand l'opération porte sur un fichier du disque", correct: false}
      - {text: "Quand la clé cherchée est une chaîne de caractères", correct: false}
    answer: "Un test coûte toujours un peu, une exception levée coûte beaucoup. Avec des threads ou des fichiers, au contraire, LBYL ouvre une course entre le test et l'action."
  - key: situation-exists-puis-open
    format: scenario
    question: |-
      En revue, tu lis `if os.path.exists(chemin):` suivi de `with open(chemin) as f: ...`, sans `try`. Que
      proposes-tu ?
    choices:
      - {text: "Ouvrir directement, et rattraper `FileNotFoundError`", correct: true}
      - {text: "Ajouter `os.access` pour vérifier aussi les droits", correct: false}
      - {text: "Vérifier l'existence deux fois, avant et après", correct: false}
      - {text: "Garder le code : il ne peut plus échouer", correct: false}
    answer: "Le fichier peut disparaître ou devenir illisible entre le test et l'ouverture. Ajouter des tests ne fait qu'allonger l'intervalle : seul le `try` gère l'échec réel."
  - key: situation-compter-mots
    format: scenario
    question: |-
      Tu comptes les mots d'un texte dans un dictionnaire, et la plupart des mots n'apparaissent qu'une fois. Que
      choisis-tu ?
    choices:
      - {text: "`collections.Counter`, ou `d.get(mot, 0) + 1`, sans exception", correct: true}
      - {text: "`try: d[mot] += 1`, puis `except KeyError: d[mot] = 1`", correct: false}
      - {text: "`if mot in d.keys()`, puis un `try` en plus, par sécurité", correct: false}
      - {text: "Une liste des mots déjà vus, parcourue avant chaque ajout", correct: false}
    answer: "Ici, la clé manque presque à chaque fois : l'EAFP lèverait une exception par mot. `Counter` est fait pour ça, et `get` évite tout aussi bien l'exception. Une liste rendrait chaque recherche lente."
  - key: situation-serveur-disponible
    format: scenario
    question: |-
      Un appel réseau échoue une fois sur mille. Ton collègue veut appeler `serveur_disponible()` avant chaque appel.
      Que lui réponds-tu ?
    choices:
      - {text: "Le serveur peut tomber entre les deux : il faut gérer l'échec de l'appel", correct: true}
      - {text: "Bonne idée : la vérification garantit que l'appel suivant réussira", correct: false}
      - {text: "Il faut vérifier deux fois de suite, pour être tout à fait sûr", correct: false}
      - {text: "Mieux vaut relancer l'appel en boucle, sans aucune limite", correct: false}
    answer: "Le test double le nombre de requêtes sans rien garantir : l'appel peut échouer quand même. On l'entoure d'un `try`, avec un nombre limité de nouvelles tentatives si besoin."
  - key: situation-isdigit
    format: scenario
    question: |-
      Tu dois convertir en entiers des saisies comme `"42"`, `"-7"` ou `" 8 "`. Ton collègue teste d'abord
      `texte.isdigit()`. Quel problème vois-tu ?
    choices:
      - {text: "`isdigit` refuse `\"-7\"` et `\" 8 \"`, que `int` accepte : mieux vaut essayer `int`", correct: true}
      - {text: "`isdigit` accepte les nombres à virgule, que `int` refuse ensuite", correct: false}
      - {text: "`isdigit` est plus lent qu'un `try` dans tous les cas", correct: false}
      - {text: "Aucun : `isdigit` reproduit exactement les règles de `int`", correct: false}
    answer: "Le test ne reproduit pas les règles de l'opération : signe et espaces sont acceptés par `int`, refusés par `isdigit`, et `\"²\".isdigit()` vaut `True` alors qu'`int` refuse. L'EAFP laisse `int` décider."
  - key: definition-eafp
    format: definition
    question: "Que signifie EAFP ?"
    choices:
      - {text: "Easier to Ask for Forgiveness than Permission : agir, puis traiter l'échec", correct: true}
      - {text: "Error Avoidance First Principle : vérifier toutes les conditions avant d'agir", correct: false}
      - {text: "Exceptions Are For Programmers : ne jamais les montrer à l'utilisateur", correct: false}
      - {text: "Explicit Assertions For Parameters : valider chaque argument avec `assert`", correct: false}
    answer: "Le style pythonique : on tente l'opération dans un `try`, et le `except` traite l'échec. Son contraire est LBYL."
  - key: definition-lbyl
    format: definition
    question: "Que signifie LBYL ?"
    choices:
      - {text: "Look Before You Leap : vérifier les conditions avant d'agir", correct: true}
      - {text: "Log Before You Leave : journaliser avant de quitter une fonction", correct: false}
      - {text: "Lock Before You Load : verrouiller une ressource avant de la lire", correct: false}
      - {text: "Lazy Binding Yields Laziness : retarder l'évaluation des valeurs", correct: false}
    answer: "Le style des tests préalables, courant en C : `if cle in d:`. Il ouvre une course entre le test et l'action quand l'état peut changer entre les deux."
  - key: definition-toctou
    format: definition
    question: "Qu'est-ce qu'une faille TOCTOU (time of check to time of use) ?"
    choices:
      - {text: "L'état change entre la vérification et l'usage, qui agit sur une hypothèse périmée", correct: true}
      - {text: "Une vérification si lente que l'usage expire avant qu'elle ne se termine", correct: false}
      - {text: "Un fichier ouvert deux fois de suite sans être fermé entre les deux", correct: false}
      - {text: "Une exception levée pendant le traitement d'une autre exception", correct: false}
    answer: "Le fichier vérifié puis supprimé avant `open`, le droit vérifié puis retiré... L'EAFP l'évite en faisant de l'action elle-même la vérification."
  - key: definition-zero-cost
    format: definition
    question: "Que désignent les exceptions « à coût nul » (zero-cost exceptions) de Python 3.11 ?"
    choices:
      - {text: "Un `try` ne coûte rien tant qu'aucune exception n'est levée", correct: true}
      - {text: "Lever et rattraper une exception ne coûte plus rien du tout", correct: false}
      - {text: "Les exceptions n'occupent plus aucune place en mémoire", correct: false}
      - {text: "Le compilateur supprime les `except` qui ne font rien", correct: false}
    answer: "Le coût est reporté sur le cas exceptionnel : entrer dans un `try` est gratuit, mais lever une exception reste cher. D'où EAFP quand l'échec est rare, et un test quand il est fréquent."
  - key: style-pythonique
    format: course
    question: "Quel style la communauté Python préfère-t-elle pour une opération qui échoue rarement ?"
    choices:
      - {text: "EAFP : tenter l'opération, et traiter l'exception", correct: true}
      - {text: "LBYL : tout vérifier avant de tenter quoi que ce soit", correct: false}
      - {text: "Aucun : renvoyer un code d'erreur, comme en C", correct: false}
      - {text: "Des `assert` au début de chaque fonction", correct: false}
    answer: "EAFP : une opération au lieu de deux, pas de course entre le test et l'action, et le duck typing. Les `assert` ne valident pas les entrées : `python -O` les retire."
  - key: avantage-eafp-duck-typing
    format: course
    question: "Pourquoi EAFP va-t-il de pair avec le duck typing ?"
    choices:
      - {text: "On utilise l'objet directement, au lieu de tester son type", correct: true}
      - {text: "Le duck typing interdit les tests `if` dans les fonctions", correct: false}
      - {text: "EAFP vérifie le type des objets avant de les utiliser", correct: false}
      - {text: "Le duck typing rend les exceptions impossibles", correct: false}
    answer: "Plutôt que `isinstance(f, io.IOBase)`, on appelle `f.read()` : tout objet qui sait lire convient, et un `AttributeError` dit sinon que ce n'en est pas un."
  - key: troisieme-voie
    format: course
    question: "Quelle écriture évite à la fois le test et le `try` pour lire une clé facultative d'un dictionnaire ?"
    choices:
      - {text: "`d.get(cle, defaut)`", correct: true}
      - {text: "`d[cle] or defaut`", correct: false}
      - {text: "`d.pop(cle)`", correct: false}
      - {text: "`d.keys()[cle]`", correct: false}
    answer: "`get` fait une seule recherche, sans exception. `d[cle] or defaut` lève une `KeyError` si la clé manque ; `pop` la retire du dictionnaire."
  - key: try-court-eafp
    format: course
    question: "En style EAFP, que doit contenir le bloc `try` ?"
    choices:
      - {text: "La seule opération qui peut échouer, et pas sa suite", correct: true}
      - {text: "Toute la fonction, pour ne rien laisser échapper", correct: false}
      - {text: "Le test préalable, puis l'opération elle-même", correct: false}
      - {text: "Un appel à `isinstance` avant l'opération", correct: false}
    answer: "Sinon le `except KeyError` rattrape aussi une `KeyError` née plus loin, d'un vrai bug. La suite du traitement va dans le bloc `else`."
