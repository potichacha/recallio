notion: exceptions-personnalisees
lesson: |-
  Quand l'appelant doit pouvoir traiter un cas précis (un stock insuffisant, un paiement refusé), on définit sa propre
  exception : une **classe qui hérite d'`Exception`**, ou d'une exception standard dont elle est un cas particulier.

  ```python
  class BoutiqueError(Exception):
      """Base de toutes les erreurs de la boutique."""


  class ProduitInconnuError(BoutiqueError, KeyError):
      """Le produit demandé n'existe pas au catalogue."""


  class StockInsuffisantError(BoutiqueError):
      def __init__(self, produit, demande, disponible):
          super().__init__(f"{produit} : {demande} demandés, {disponible} en stock")
          self.produit = produit
          self.demande = demande
          self.disponible = disponible


  try:
      commander("pommes", 10)
  except StockInsuffisantError as e:
      proposer(e.produit, e.disponible)   # des attributs, plutôt que d'analyser le message
  except BoutiqueError:
      ...                                  # toutes les autres erreurs de la boutique
  ```

  - **Une docstring suffit** comme corps : pas besoin de `pass` ni de méthode.
  - **Une exception de base par bibliothèque** (`BoutiqueError`), dont héritent les autres : l'appelant rattrape tout
    d'un seul `except`, ou un cas précis.
  - **Hériter aussi d'une exception standard** (`KeyError`, `ValueError`) permet au code qui rattrape déjà celle-ci de
    continuer à marcher.
  - **Nommage** (PEP 8) : le suffixe `Error`, comme `ValueError` : `PaiementRefuseError`. Évite de réutiliser le nom
    d'une exception intégrée (`class ValueError(Exception)` masquerait la vraie).
  - **Avec un `__init__`, appelle `super().__init__(message)`** : c'est ce qui donne `str(e)` et `e.args`. Sans cet
    appel, `str(e)` affiche les arguments du constructeur sous forme de tuple, `('pommes', 3)`.
  - **Les données de l'erreur dans des attributs** : l'appelant les lit sans analyser le texte.
  - `e.add_note("...")` (Python 3.11) ajoute une précision, affichée sous la trace, sans changer le type.
  - On n'en crée pas pour chaque fonction : seulement quand un appelant doit **distinguer** ce cas.

  **En entretien** : « On hérite d'`Exception`, ou d'une exception standard dont c'est un cas particulier, avec le
  suffixe `Error`. Une bibliothèque définit une exception de base et des sous-classes, pour qu'on rattrape tout ou un
  cas précis. Si l'on ajoute un `__init__`, on appelle `super().__init__(message)` et on range les données utiles dans
  des attributs. »
cards:
  - key: vf-convention-heritage
    format: true-false
    question: "Par convention, une exception personnalisée hérite d'`Exception` ou d'une de ses sous-classes."
    truth: true
    answer: "Ainsi, `except Exception` la rattrape comme toute autre erreur. Hériter directement de `BaseException` la rangerait avec Ctrl+C et `sys.exit()`."
  - key: vf-docstring-corps
    format: true-false
    question: "Une classe d'exception peut avoir une docstring pour seul corps, sans `pass` ni méthode."
    truth: true
    answer: "La docstring est une instruction : le corps n'est pas vide. Le constructeur, le message et `args` viennent d'`Exception`."
  - key: vf-classe-quelconque
    format: true-false
    question: "Une classe qui n'hérite d'aucune exception peut être levée avec `raise`, si elle définit un `__str__`."
    truth: false
    answer: "`raise` exige une sous-classe de `BaseException` : sinon, `TypeError: exceptions must derive from BaseException`."
  - key: vf-init-sans-super
    format: true-false
    question: "Si le `__init__` d'une exception n'appelle pas `super().__init__(message)`, `str(e)` renvoie quand même le message qu'il a construit."
    truth: false
    answer: "`str(e)` affiche `e.args`, que Python remplit avec les arguments du constructeur : `StockInsuffisant('pommes', 3)` affiche `('pommes', 3)`. Il faut passer le message au parent."
  - key: qcm-nom-pep8
    format: multiple-choice
    question: "Quel nom suit la convention de PEP 8 pour une exception de ta bibliothèque ?"
    choices:
      - {text: "`PaiementRefuseError`", correct: true}
      - {text: "`PaiementRefuseException`", correct: false}
      - {text: "`paiement_refuse_error`", correct: false}
      - {text: "`PAIEMENT_REFUSE`", correct: false}
    answer: "Un nom de classe en CamelCase, avec le suffixe `Error` comme les exceptions intégrées. Le suffixe `Exception` est une habitude de Java."
  - key: qcm-base-commune
    format: multiple-choice
    question: "Pourquoi définir une exception de base pour toute ta bibliothèque, dont les autres héritent ?"
    choices:
      - {text: "Pour que l'appelant rattrape toutes ses erreurs d'un seul `except`", correct: true}
      - {text: "Pour que Python affiche des traces plus courtes à l'utilisateur", correct: false}
      - {text: "Parce qu'une exception ne peut pas hériter d'`Exception` directement", correct: false}
      - {text: "Pour que les exceptions de la bibliothèque se lèvent plus vite", correct: false}
    answer: "`except BoutiqueError` rattrape tout ce que lève la bibliothèque, et rien d'autre ; les sous-classes permettent encore de traiter un cas précis."
  - key: qcm-heriter-valueerror
    format: multiple-choice
    question: "Ta fonction `lire_date` lève `DateInvalideError`. De quelle classe la faire hériter, pour que le code qui rattrape déjà `ValueError` la rattrape aussi ?"
    choices:
      - {text: "`ValueError`", correct: true}
      - {text: "`Exception`", correct: false}
      - {text: "`BaseException`", correct: false}
      - {text: "`TypeError`", correct: false}
    answer: "Une date impossible est un cas de `ValueError` : en héritant d'elle, la nouvelle exception reste compatible avec les appelants existants. `datetime.strptime` lève d'ailleurs une `ValueError`."
  - key: qcm-attributs-et-message
    format: multiple-choice
    question: "Comment donner à `StockInsuffisantError` des attributs `produit` et `manque`, tout en gardant un message lisible ?"
    choices:
      - {text: "Un `__init__` qui appelle `super().__init__(message)`, puis range les attributs", correct: true}
      - {text: "Un `__init__` qui range les attributs, sans appeler celui du parent", correct: false}
      - {text: "Des attributs de classe, partagés par toutes les instances de l'exception", correct: false}
      - {text: "Un `__str__` seul : les attributs se créent à partir des arguments", correct: false}
    answer: "Le parent construit `args` et donc le message ; les attributs portent les données pour l'appelant. Des attributs de classe seraient communs à toutes les erreurs."
  - key: trous-heriter
    format: fill-in
    question: |-
      Complète pour définir une exception ordinaire de l'application :
      ```python
      class CommandeVideError(___):
          """La commande ne contient aucun article."""
      ```
    blanks:
      - - Exception
    answer: "Une exception ordinaire hérite d'`Exception`. Le corps peut se limiter à la docstring."
  - key: trous-super-init
    format: fill-in
    question: |-
      Complète pour que `str(e)` affiche le message construit :
      ```python
      class QuotaDepasseError(Exception):
          def __init__(self, utilisateur, limite):
              ___().__init__(f"{utilisateur} a dépassé {limite} requêtes")
              self.limite = limite
      ```
    blanks:
      - - super
    answer: "`super().__init__(message)` range le message dans `args`, que `str(e)` affiche. Sans lui, on verrait `('ana', 100)`."
  - key: trous-rattraper-base
    format: fill-in
    question: |-
      Toutes les erreurs de la boutique héritent de `BoutiqueError`. Complète pour les rattraper toutes, et seulement
      elles :
      ```python
      try:
          commander(panier)
      except ___ as erreur:
          afficher(erreur)
      ```
    blanks:
      - - BoutiqueError
    answer: "Un `except` rattrape la classe nommée et ses sous-classes : la base commune couvre tout ce que lève la boutique."
  - key: trous-add-note
    format: fill-in
    question: |-
      Complète pour ajouter une précision à l'exception, affichée sous sa trace, avant de la relancer (Python 3.11 et
      plus) :
      ```python
      except ValueError as erreur:
          erreur.___("ligne 12 du fichier commandes.csv")
          raise
      ```
    blanks:
      - - add_note
    answer: "`add_note` ajoute une note à l'exception, sans changer son type ni son message ; la trace l'affiche à la fin."
  - key: code-message-et-attribut
    format: code-output
    question: |-
      ```python
      class StockInsuffisantError(Exception):
          def __init__(self, produit, manque):
              super().__init__(f"il manque {manque} {produit}")
              self.manque = manque


      try:
          raise StockInsuffisantError("pommes", 3)
      except StockInsuffisantError as e:
          print(e, "|", e.manque)
      ```
    answer: "`il manque 3 pommes | 3` : `str(e)` donne le message passé au parent, et l'attribut `manque` garde la donnée brute."
    check:
      output: "il manque 3 pommes | 3"
    choices:
      - {text: "`il manque 3 pommes | 3`", correct: true}
      - {text: "`('pommes', 3) | 3`", correct: false}
      - {text: "`StockInsuffisantError | 3`", correct: false}
      - {text: "`il manque 3 pommes | manque`", correct: false}
  - key: code-args
    format: code-output
    question: |-
      ```python
      class HttpError(Exception):
          def __init__(self, code):
              super().__init__(f"HTTP {code}")
              self.code = code


      e = HttpError(404)
      print(e.args, e.code)
      ```
    answer: "`('HTTP 404',) 404` : `args` contient ce qui a été passé au constructeur du parent, le message ; `code` est l'attribut ajouté."
    check:
      output: "('HTTP 404',) 404"
    choices:
      - {text: "`('HTTP 404',) 404`", correct: true}
      - {text: "`(404,) 404`", correct: false}
      - {text: "`HTTP 404 404`", correct: false}
      - {text: "`('HTTP 404', 404) 404`", correct: false}
  - key: code-rattraper-par-la-base
    format: code-output
    question: |-
      ```python
      class AppError(Exception):
          pass


      class ConfigError(AppError):
          pass


      try:
          raise ConfigError("port manquant")
      except AppError as e:
          print(type(e).__name__, e)
      ```
    answer: "`ConfigError port manquant` : la clause sur la base rattrape la sous-classe, mais l'objet reste une `ConfigError`."
    check:
      output: "ConfigError port manquant"
    choices:
      - {text: "`ConfigError port manquant`", correct: true}
      - {text: "`AppError port manquant`", correct: false}
      - {text: "`Exception port manquant`", correct: false}
      - {text: "`ConfigError ('port manquant',)`", correct: false}
  - key: code-sous-classe-valueerror
    format: code-output
    question: |-
      ```python
      class DateInvalideError(ValueError):
          pass


      def lire(texte):
          raise DateInvalideError(f"date invalide : {texte}")


      try:
          lire("31/02")
      except ValueError as e:
          print(isinstance(e, DateInvalideError), e)
      ```
    answer: "`True date invalide : 31/02` : `except ValueError` rattrape la sous-classe, et l'objet garde son type précis."
    check:
      output: "True date invalide : 31/02"
    choices:
      - {text: "`True date invalide : 31/02`", correct: true}
      - {text: "`False date invalide : 31/02`", correct: false}
      - {text: "`True DateInvalideError`", correct: false}
      - {text: "`False ValueError`", correct: false}
  - key: bug-sans-heritage
    format: bug-fix
    question: |-
      Ce programme devait afficher « paiement refusé », mais s'arrête sur « TypeError: exceptions must derive from
      BaseException » :
      ```python
      class PaiementRefuseError:
          pass


      try:
          raise PaiementRefuseError()
      except PaiementRefuseError:
          print("paiement refusé")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Faire hériter la classe d'`Exception`", correct: true}
      - {text: "Lever la classe sans l'instancier", correct: false}
      - {text: "Ajouter un `__str__` à la classe", correct: false}
      - {text: "Rattraper `TypeError` en plus", correct: false}
    answer: |-
      ```python
      class PaiementRefuseError(Exception):
          """Le prestataire a refusé le paiement."""
      ```
      Seules les sous-classes de `BaseException` se lèvent et se rattrapent. La trace montre une seconde
      `TypeError` : un `except` refuse aussi une classe qui n'est pas une exception.
  - key: bug-herite-baseexception
    format: bug-fix
    question: |-
      Ce programme affiche « valide : 30 », puis s'arrête sur « ValidationError: âge négatif », alors que la boucle
      rattrape `Exception` :
      ```python
      class ValidationError(BaseException):
          pass


      def valider(age):
          if age < 0:
              raise ValidationError("âge négatif")


      for age in [30, -1, 25]:
          try:
              valider(age)
              print("valide :", age)
          except Exception as e:
              print("refusé :", e)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Faire hériter `ValidationError` d'`Exception`", correct: true}
      - {text: "Rattraper `BaseException` dans la boucle", correct: false}
      - {text: "Lever `ValidationError` sans message", correct: false}
      - {text: "Déplacer le `print` dans un bloc `else`", correct: false}
    answer: |-
      ```python
      class ValidationError(Exception):
          pass
      ```
      `BaseException` est réservée aux signaux d'arrêt : `except Exception` les laisse passer. Rattraper
      `BaseException` dans la boucle avalerait aussi Ctrl+C.
  - key: bug-message-tuple
    format: bug-fix
    question: |-
      Ce programme affiche « Erreur : ('pommes', 3) » au lieu d'un message lisible :
      ```python
      class StockInsuffisantError(Exception):
          def __init__(self, produit, manque):
              self.produit = produit
              self.manque = manque


      try:
          raise StockInsuffisantError("pommes", 3)
      except StockInsuffisantError as e:
          print(f"Erreur : {e}")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `super().__init__(f'il manque {manque} {produit}')`", correct: true}
      - {text: "Afficher `e.args[0]` au lieu de `e` dans le `print`", correct: false}
      - {text: "Renvoyer le message avec `return` à la fin de `__init__`", correct: false}
      - {text: "Hériter de `ValueError`, qui formate lui-même le message", correct: false}
    answer: |-
      ```python
      def __init__(self, produit, manque):
          super().__init__(f"il manque {manque} {produit}")
          self.produit = produit
          self.manque = manque
      ```
      Sans appel au parent, `args` garde les arguments du constructeur, et `str(e)` les affiche en tuple.
      `__init__` ne peut rien renvoyer d'autre que `None`.
  - key: bug-nom-masque-builtin
    format: bug-fix
    question: |-
      Ce programme devait afficher « saisie refusée », mais s'arrête sur « ValueError: invalid literal for int() with
      base 10: 'abc' » :
      ```python
      class ValueError(Exception):
          """Valeur refusée par l'application."""


      try:
          int("abc")
      except ValueError:
          print("saisie refusée")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renommer la classe, `SaisieRefuseeError` par exemple", correct: true}
      - {text: "Faire hériter la classe de `BaseException`", correct: false}
      - {text: "Déplacer la classe dans un autre module du projet", correct: false}
      - {text: "Lever la classe avant d'appeler `int` dans le `try`", correct: false}
    answer: |-
      ```python
      class SaisieRefuseeError(ValueError):
          """Valeur refusée par l'application."""
      ```
      La classe masque la `ValueError` intégrée : le `except` nomme la nouvelle, alors que `int` lève toujours la
      vraie. Un nom distinct, qui hérite de `ValueError`, résout les deux problèmes.
  - key: quand-creer
    format: course
    question: "Quand créer ta propre classe d'exception ?"
    choices:
      - {text: "Quand un appelant doit pouvoir rattraper ce cas précis", correct: true}
      - {text: "Pour chaque fonction, afin que la trace dise d'où vient l'erreur", correct: false}
      - {text: "Jamais : les exceptions standard couvrent tous les cas", correct: false}
      - {text: "Seulement pour les erreurs qui doivent arrêter le programme", correct: false}
    answer: "Une exception personnalisée sert à être distinguée. Si personne ne la traite différemment d'une `ValueError`, une `ValueError` avec un bon message suffit."
  - key: organiser-bibliotheque
    format: course
    question: "Comment organiser les exceptions d'une bibliothèque ?"
    choices:
      - {text: "Une exception de base, dont héritent des exceptions plus précises", correct: true}
      - {text: "Une seule exception, avec un code d'erreur numérique en attribut", correct: false}
      - {text: "Une exception par module, sans aucun lien d'héritage entre elles", correct: false}
      - {text: "Des exceptions qui héritent toutes directement de `BaseException`", correct: false}
    answer: "`requests.RequestException`, puis `ConnectionError`, `Timeout`... L'appelant choisit son niveau : tout rattraper, ou un cas précis."
  - key: double-heritage
    format: course
    question: "À quoi sert `class ProduitInconnuError(BoutiqueError, KeyError)` ?"
    choices:
      - {text: "Elle se rattrape comme une erreur de la boutique, et comme une `KeyError`", correct: true}
      - {text: "Elle reprend le message de `KeyError` sans qu'on ait à en écrire", correct: false}
      - {text: "C'est obligatoire : une exception doit toujours avoir deux parents", correct: false}
      - {text: "Elle devient plus rapide à lever qu'une simple `KeyError`", correct: false}
    answer: "Le nouveau code rattrape `BoutiqueError` ; l'ancien, qui rattrapait `KeyError`, continue de marcher. L'héritage multiple sert ici la compatibilité."
  - key: donnees-en-attributs
    format: course
    question: "Pourquoi ranger les données d'une erreur dans des attributs, et pas seulement dans son message ?"
    choices:
      - {text: "L'appelant les lit sans analyser le texte du message", correct: true}
      - {text: "Un message d'exception ne peut pas contenir de nombres", correct: false}
      - {text: "Les attributs empêchent de rattraper l'exception par erreur", correct: false}
      - {text: "Le message est effacé quand l'exception quitte la fonction", correct: false}
    answer: "`e.disponible` est un entier qu'on utilise directement ; extraire le nombre d'un message est fragile, et casse dès qu'on reformule le texte."
