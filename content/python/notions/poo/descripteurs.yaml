notion: descripteurs
lesson: |-
  Un **descripteur** est un objet, rangé comme **attribut de classe**, qui définit `__get__`, `__set__` ou
  `__delete__`. Quand on lit ou écrit cet attribut sur une instance, Python appelle ces méthodes au lieu de lire ou
  d'écrire une valeur. C'est le mécanisme sous `property`, `classmethod`, `staticmethod`, et sous les méthodes
  elles-mêmes.

  ```python
  class Positif:
      def __set_name__(self, owner, nom):       # Python donne le nom de l'attribut
          self.nom_prive = "_" + nom

      def __get__(self, obj, owner):
          if obj is None:                       # lu sur la classe : Produit.prix
              return self
          return getattr(obj, self.nom_prive)

      def __set__(self, obj, valeur):
          if valeur <= 0:
              raise ValueError(f"{self.nom_prive[1:]} doit être positif : {valeur}")
          setattr(obj, self.nom_prive, valeur)  # la valeur vit dans l'instance


  class Produit:
      prix = Positif()                          # un seul descripteur, pour toutes les instances
      stock = Positif()

      def __init__(self, prix, stock):
          self.prix = prix                      # passe par Positif.__set__
          self.stock = stock
  ```

  - **`obj.attr`** devient `type(obj).__dict__["attr"].__get__(obj, type(obj))` ; sur la classe, `obj` vaut `None`.
  - **Descripteur de données** (*data descriptor*) : il définit `__set__` ou `__delete__`. Il l'**emporte** sur le
    `__dict__` de l'instance.
  - **Descripteur sans données** (*non-data descriptor*) : seulement `__get__`. Un attribut d'instance du même nom
    le **masque**. Les fonctions en sont : leur `__get__` produit la **méthode liée**, qui recevra l'instance comme
    `self`.
  - **L'ordre de recherche de `obj.attr`** : descripteur de données de la classe, puis `__dict__` de l'instance,
    puis descripteur sans données ou attribut de la classe, puis `__getattr__`.
  - **Le descripteur est partagé** par toutes les instances : il range chaque valeur **dans l'instance**, sous un nom
    privé, jamais dans ses propres attributs.
  - **Il doit être un attribut de classe** : rangé dans une instance, il n'est qu'un objet ordinaire.
  - **`__set_name__`** (Python 3.6) reçoit la classe et le nom de l'attribut : plus besoin de le répéter.
  - On écrit un descripteur quand la même logique sert à **plusieurs attributs** ; pour un seul, `property` suffit.

  **En entretien** : « Un descripteur est un attribut de classe qui définit `__get__`, `__set__` ou `__delete__`, et
  intercepte l'accès à l'attribut sur les instances. Avec `__set__`, c'est un descripteur de données, prioritaire sur
  le `__dict__` de l'instance ; avec `__get__` seul, l'instance peut le masquer, comme les fonctions, dont le `__get__`
  crée la méthode liée. `property`, `classmethod` et `staticmethod` sont des descripteurs, et `__set_name__` leur donne
  le nom de l'attribut. »
cards:
  - key: vf-property-descripteur
    format: true-false
    question: "`property` est un descripteur : un objet dont la classe définit `__get__`, `__set__` et `__delete__`."
    truth: true
    answer: "C'est même un descripteur de données : il définit `__set__`, même sans setter (il lève alors `AttributeError`). C'est pourquoi une propriété l'emporte sur l'instance."
  - key: vf-fonction-descripteur
    format: true-false
    question: "Une fonction définie dans une classe est un descripteur : son `__get__` produit la méthode liée."
    truth: true
    answer: "`obj.methode` appelle `fonction.__get__(obj, type(obj))`, qui renvoie la méthode liée à `obj` : c'est ainsi que `self` est passé."
  - key: vf-instance-toujours-gagne
    format: true-false
    question: "Un attribut d'instance du même nom l'emporte toujours sur un descripteur de la classe."
    truth: false
    answer: "Un descripteur de données (avec `__set__` ou `__delete__`) passe avant le `__dict__` de l'instance. Seul un descripteur sans données est masqué."
  - key: vf-descripteur-dans-instance
    format: true-false
    question: "Un descripteur fonctionne aussi quand on le range dans un attribut d'instance, au lieu de la classe."
    truth: false
    answer: "Python ne cherche les descripteurs que dans la classe (et ses parents). Dans une instance, c'est un objet ordinaire : `obj.attr` le renvoie tel quel."
  - key: qcm-set-name
    format: multiple-choice
    question: "Quelle méthode un descripteur définit-il pour connaître le nom de l'attribut auquel il est attaché ?"
    choices:
      - {text: "`__set_name__`", correct: true}
      - {text: "`__init_subclass__`", correct: false}
      - {text: "`__name__`", correct: false}
      - {text: "`__getattr__`", correct: false}
    answer: "Python appelle `__set_name__(owner, name)` à la création de la classe, pour chaque descripteur de son corps."
  - key: qcm-get-sur-classe
    format: multiple-choice
    question: "Que reçoit `__get__(self, obj, owner)` quand on lit l'attribut sur la classe, `Classe.attr` ?"
    choices:
      - {text: "`obj` vaut `None`, et `owner` vaut la classe", correct: true}
      - {text: "`obj` vaut la classe, et `owner` vaut `None`", correct: false}
      - {text: "`obj` et `owner` valent tous deux la classe", correct: false}
      - {text: "Rien : `__get__` n'est pas appelé sur la classe", correct: false}
    answer: "D'où le test `if obj is None: return self` : sur la classe, on renvoie souvent le descripteur lui-même, ce que fait `property`."
  - key: qcm-descripteur-de-donnees
    format: multiple-choice
    question: "Qu'est-ce qui fait d'un descripteur un descripteur de données ?"
    choices:
      - {text: "Sa classe définit `__set__` ou `__delete__`", correct: true}
      - {text: "Sa classe définit `__get__`", correct: false}
      - {text: "Il range ses valeurs dans un dictionnaire", correct: false}
      - {text: "Sa classe hérite de `property`", correct: false}
    answer: "`__set__` ou `__delete__` suffit, même sans `__get__`. Cette distinction règle la priorité face au `__dict__` de l'instance."
  - key: qcm-ou-ranger
    format: multiple-choice
    question: "Où un descripteur de validation range-t-il la valeur propre à chaque instance ?"
    choices:
      - {text: "Dans le `__dict__` de l'instance, sous un nom privé", correct: true}
      - {text: "Dans un attribut du descripteur, partagé par toutes", correct: false}
      - {text: "Dans une variable globale du module", correct: false}
      - {text: "Dans le `__dict__` de la classe propriétaire", correct: false}
    answer: "Un seul descripteur sert toutes les instances : une valeur rangée sur lui serait partagée. On la range dans l'instance, sous `_prix` par exemple."
  - key: code-validation
    format: code-output
    question: |-
      ```python
      class Positif:
          def __set_name__(self, owner, nom):
              self.nom = "_" + nom

          def __get__(self, obj, owner):
              return getattr(obj, self.nom)

          def __set__(self, obj, valeur):
              if valeur <= 0:
                  raise ValueError(f"{self.nom[1:]} doit être positif")
              setattr(obj, self.nom, valeur)


      class Produit:
          prix = Positif()

          def __init__(self, prix):
              self.prix = prix


      p = Produit(10)
      try:
          p.prix = -1
      except ValueError as e:
          print(p.prix, e)
      ```
    answer: "`10 prix doit être positif` : l'affectation passe par `__set__`, qui refuse -1 avant de rien changer ; le nom `prix` vient de `__set_name__`."
    check:
      output: "10 prix doit être positif"
    choices:
      - {text: "`10 prix doit être positif`", correct: true}
      - {text: "`-1 prix doit être positif`", correct: false}
      - {text: "`10 _prix doit être positif`", correct: false}
      - {text: "`10 None doit être positif`", correct: false}
  - key: code-sans-donnees-masque
    format: code-output
    question: |-
      ```python
      class Constante:
          def __get__(self, obj, owner):
              return 42


      class A:
          x = Constante()


      a = A()
      print(a.x, end=" ")
      a.x = 7
      print(a.x, A.x)
      ```
    answer: "`42 7 42` : sans `__set__`, l'affectation range 7 dans le `__dict__` de l'instance, qui masque ensuite le descripteur. Sur la classe, il répond toujours 42."
    check:
      output: "42 7 42"
    choices:
      - {text: "`42 7 42`", correct: true}
      - {text: "`42 42 42`", correct: false}
      - {text: "`42 7 7`", correct: false}
      - {text: "`7 7 42`", correct: false}
  - key: code-donnees-prioritaire
    format: code-output
    question: |-
      ```python
      class Toujours:
          def __get__(self, obj, owner):
              return "descripteur"

          def __set__(self, obj, valeur):
              pass


      class B:
          x = Toujours()


      b = B()
      b.__dict__["x"] = "instance"
      print(b.x)
      ```
    answer: "`descripteur` : un descripteur de données passe avant le `__dict__` de l'instance, même quand celui-ci contient le même nom."
    check:
      output: "descripteur"
    choices:
      - {text: "`descripteur`", correct: true}
      - {text: "`instance`", correct: false}
      - {text: "`None`", correct: false}
      - {text: "Une `AttributeError`", correct: false}
  - key: code-methode-liee
    format: code-output
    question: |-
      ```python
      class C:
          def f(self):
              return "ok"


      c = C()
      methode = C.__dict__["f"].__get__(c, C)
      print(methode(), methode.__self__ is c)
      ```
    answer: "`ok True` : appeler à la main le `__get__` de la fonction fait ce que fait `c.f` : une méthode liée à `c`, qui la reçoit comme `self`."
    check:
      output: "ok True"
    choices:
      - {text: "`ok True`", correct: true}
      - {text: "`ok False`", correct: false}
      - {text: "Une `TypeError` : il manque l'argument `self`", correct: false}
      - {text: "Une `AttributeError` : une fonction n'a pas de `__get__`", correct: false}
  - key: definition-descripteur
    format: definition
    question: "Qu'est-ce qu'un descripteur, en Python ?"
    choices:
      - {text: "Un attribut de classe qui définit `__get__`, `__set__` ou `__delete__`", correct: true}
      - {text: "Un commentaire qui décrit une fonction, comme une docstring", correct: false}
      - {text: "Un objet qui décrit les champs d'une dataclass", correct: false}
      - {text: "Une annotation de type portée par un attribut", correct: false}
    answer: "Il intercepte la lecture, l'écriture ou la suppression de l'attribut sur les instances. `property` en est l'exemple le plus connu."
  - key: definition-donnees
    format: definition
    question: "Qu'est-ce qu'un descripteur de données (data descriptor) ?"
    choices:
      - {text: "Un descripteur qui définit `__set__` ou `__delete__`, prioritaire sur l'instance", correct: true}
      - {text: "Un descripteur qui ne définit que `__get__`, masqué par l'instance", correct: false}
      - {text: "Un descripteur qui stocke des données binaires dans la classe", correct: false}
      - {text: "Une dataclass utilisée comme attribut d'une autre classe", correct: false}
    answer: "`property` en est un. Une affectation sur l'instance passe toujours par son `__set__`, et sa lecture par son `__get__`."
  - key: definition-sans-donnees
    format: definition
    question: "Qu'est-ce qu'un descripteur sans données (non-data descriptor) ?"
    choices:
      - {text: "Un descripteur qui ne définit que `__get__`, et qu'un attribut d'instance masque", correct: true}
      - {text: "Un descripteur qui définit `__set__` sans définir `__get__`", correct: false}
      - {text: "Un descripteur dont la valeur vaut toujours `None`", correct: false}
      - {text: "Un descripteur défini en dehors de toute classe", correct: false}
    answer: "Les fonctions, `classmethod` et `staticmethod` en sont. On peut donc remplacer une méthode sur une seule instance, en lui affectant un attribut du même nom."
  - key: definition-methode-liee
    format: definition
    question: "Qu'est-ce qu'une méthode liée (bound method) ?"
    choices:
      - {text: "Une fonction associée à une instance, qui la recevra comme `self`", correct: true}
      - {text: "Une méthode qu'aucune sous-classe ne peut redéfinir", correct: false}
      - {text: "Une méthode décorée par `@staticmethod`", correct: false}
      - {text: "Une fonction liée à un module par `import`", correct: false}
    answer: "`c.f` est une méthode liée : `c.f()` appelle `C.f(c)`. Elle est produite par le `__get__` de la fonction, et garde l'instance dans `__self__`."
  - key: point-commun
    format: course
    question: "Quel mécanisme `property`, `classmethod` et les méthodes ordinaires ont-ils en commun ?"
    choices:
      - {text: "Ce sont des descripteurs : leur `__get__` décide de ce que renvoie l'accès", correct: true}
      - {text: "Ce sont des métaclasses, qui créent les classes où on les définit", correct: false}
      - {text: "Ce sont des décorateurs qui copient la fonction dans chaque instance", correct: false}
      - {text: "Ce sont des fermetures qui capturent la classe où on les définit", correct: false}
    answer: "Une méthode renvoie une méthode liée à l'instance, `classmethod` une méthode liée à la classe, `property` le résultat de son getter. Rien n'est copié dans les instances."
  - key: ordre-recherche
    format: course
    question: "Dans quel ordre Python cherche-t-il `obj.attr` ?"
    choices:
      - {text: "Descripteur de données, `__dict__` de l'instance, puis le reste de la classe", correct: true}
      - {text: "`__dict__` de l'instance, puis la classe, sans aucune exception", correct: false}
      - {text: "La classe d'abord, puis le `__dict__` de l'instance", correct: false}
      - {text: "`__getattr__` d'abord, puis l'instance, puis la classe", correct: false}
    answer: "`__getattr__` ne vient qu'en dernier recours, quand tout le reste a échoué. Cet ordre explique qu'une `property` ne se laisse pas masquer, alors qu'une méthode peut l'être."
  - key: descripteur-ou-property
    format: course
    question: "Quand écrire un descripteur plutôt qu'une `property` ?"
    choices:
      - {text: "Quand la même logique sert à plusieurs attributs, ou plusieurs classes", correct: true}
      - {text: "Quand l'attribut doit être en lecture seule pour les appelants", correct: false}
      - {text: "Quand l'attribut n'a besoin d'aucune validation", correct: false}
      - {text: "Toujours : `property` est dépréciée depuis Python 3.10", correct: false}
    answer: "Une `property` par attribut répéterait le même code. Un descripteur `Positif()` s'écrit une fois et se pose sur `prix`, `stock`, `poids`... La lecture seule, `property` la fait très bien."
  - key: role-set-name
    format: course
    question: "Pourquoi `__set_name__` simplifie-t-il l'écriture des descripteurs ?"
    choices:
      - {text: "Python lui passe le nom de l'attribut : plus besoin de le répéter", correct: true}
      - {text: "Il remplace `__set__` dans les versions récentes de Python", correct: false}
      - {text: "Il donne un nom au descripteur, visible dans le débogueur seulement", correct: false}
      - {text: "Il permet d'attacher le descripteur à une instance plutôt qu'à la classe", correct: false}
    answer: "Avant Python 3.6, on écrivait `prix = Positif(\"prix\")`, au risque d'une incohérence. Le nom sert à construire le nom privé et les messages d'erreur."
