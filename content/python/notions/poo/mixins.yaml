notion: mixins
lesson: |-
  Un **mixin** est une petite classe qui ajoute **un** comportement précis, et qui n'est pas faite pour exister seule :
  on la combine, par héritage multiple, avec une vraie classe de base.

  ```python
  import json


  class JsonMixin:
      def en_json(self):
          return json.dumps(vars(self))       # suppose seulement un objet à attributs


  class ComparableMixin:
      def __lt__(self, autre):
          return self.cle() < autre.cle()     # suppose une méthode cle() chez l'hôte


  class Produit(JsonMixin, ComparableMixin, Modele):
      def cle(self):
          return self.prix
  ```

  **Les conventions.**

  - Le nom finit par **`Mixin`** (ou `MixIn`) : `JsonMixin`, `LoginRequiredMixin` (Django),
    `socketserver.ThreadingMixIn` (bibliothèque standard).
  - Les mixins se placent **à gauche** de la classe de base : leurs méthodes passent avant celles de la base dans le
    MRO, et leurs `super()` mènent à la base.
  - Un mixin a peu ou **pas d'état** et, en général, **pas de `__init__`** : il ne doit pas gêner l'initialisation des
    autres classes. S'il en a besoin, il appelle `super().__init__(*args, **kwargs)`.
  - Il peut utiliser des attributs ou des méthodes qu'il ne définit pas (`self.nom`, `self.cle()`), fournis par la
    classe hôte. C'est une **dépendance implicite** : à documenter.

  **Les mixins coopératifs.** Plusieurs mixins qui redéfinissent la même méthode et appellent `super()` s'enchaînent
  dans l'ordre du MRO :

  ```python
  class Article(AuteurMixin, HeureMixin, Base): ...
  # Article.journal() : AuteurMixin, puis HeureMixin, puis Base
  ```

  **Les risques.** Empiler les mixins rend le MRO difficile à suivre : deux mixins qui définissent la même méthode
  sans `super()` se masquent, et les dépendances implicites cassent loin de leur cause. Quand le comportement a besoin
  d'une configuration ou doit changer à l'exécution, un **composant** passé au constructeur (la composition) est plus
  clair.

  **En entretien** : « Un mixin est une petite classe sans état qui ajoute un comportement par héritage multiple,
  placée à gauche de la classe de base. Il repose sur le MRO et sur `super()` pour coopérer avec les autres classes.
  Utile pour des comportements transverses, comme la sérialisation ; au-delà de quelques-uns, on lui préfère la
  composition. »
cards:
  - key: definition-mixin
    format: course
    question: "Qu'est-ce qu'un mixin ?"
    choices:
      - {text: "Une petite classe qui ajoute un comportement précis, par héritage multiple", correct: true}
      - {text: "Une classe abstraite qui impose une interface à ses sous-classes", correct: false}
      - {text: "Une fonction qui mélange les attributs de deux objets", correct: false}
      - {text: "Une classe qui contient les objets d'autres classes", correct: false}
    answer: "`JsonMixin` ajoute `en_json` à toute classe qui en hérite. Il n'est pas fait pour être instancié seul, et ne définit pas d'interface à implémenter."
  - key: position-mixin
    format: course
    question: "Où place-t-on un mixin dans la liste des parents d'une classe ?"
    choices:
      - {text: "À gauche de la classe de base, pour que ses méthodes passent avant", correct: true}
      - {text: "À droite de la classe de base, pour ne rien masquer", correct: false}
      - {text: "N'importe où : le MRO ne dépend pas de l'ordre", correct: false}
      - {text: "En premier ou en dernier, selon l'ordre alphabétique", correct: false}
    answer: "`class Vue(LoginRequiredMixin, View)` : le mixin vient avant la base dans le MRO, et son `super()` mène à elle. À droite, la base le masquerait."
  - key: mixin-sans-init
    format: course
    question: "Pourquoi un mixin évite-t-il, en général, d'avoir son propre `__init__` ?"
    choices:
      - {text: "Pour ne pas gêner l'initialisation des autres classes de la hiérarchie", correct: true}
      - {text: "Parce que Python interdit un `__init__` dans une classe mixin", correct: false}
      - {text: "Parce qu'un mixin n'a jamais besoin d'accéder à `self`", correct: false}
      - {text: "Parce qu'un `__init__` rendrait le mixin abstrait", correct: false}
    answer: "Un `__init__` qui n'appelle pas `super().__init__(...)` couperait la chaîne du MRO : la classe de base ne serait plus initialisée."
  - key: mixin-stdlib
    format: course
    question: "Lequel de ces exemples est un mixin de la bibliothèque standard ?"
    choices:
      - {text: "`socketserver.ThreadingMixIn`", correct: true}
      - {text: "`collections.OrderedDict`", correct: false}
      - {text: "`threading.Thread`", correct: false}
      - {text: "`abc.ABCMeta`", correct: false}
    answer: "`class Serveur(ThreadingMixIn, TCPServer)` traite chaque requête dans un thread. Le mixin ne fait que redéfinir `process_request`."
  - key: vf-instancier-seul
    format: true-false
    question: "Un mixin est fait pour être instancié seul."
    truth: false
    answer: "Il complète une autre classe, dont il utilise souvent des attributs ou des méthodes : seul, il n'a pas de sens."
  - key: vf-attributs-hote
    format: true-false
    question: "Un mixin peut utiliser des attributs qu'il ne définit pas, fournis par la classe avec laquelle on le combine."
    truth: true
    answer: "`f'Bonjour {self.nom}'` dans un mixin suppose que l'hôte a un `nom`. C'est une dépendance implicite, à documenter."
  - key: vf-plusieurs-mixins
    format: true-false
    question: "Une classe peut combiner plusieurs mixins en plus de sa classe de base."
    truth: true
    answer: "`class Article(AuteurMixin, HeureMixin, Base)` : le MRO les ordonne, et leurs `super()` s'enchaînent de gauche à droite."
  - key: vf-seule-facon
    format: true-false
    question: "Un mixin est la seule façon de partager une méthode entre des classes sans parent commun."
    truth: false
    answer: "Une fonction, un composant auquel on délègue, ou un décorateur de classe le permettent aussi."
  - key: qcm-declarer-mixin
    format: multiple-choice
    question: "Comment ajoutes-tu `JsonMixin` à une classe `Commande` qui hérite de `Modele` ?"
    choices:
      - {text: "`class Commande(JsonMixin, Modele):`", correct: true}
      - {text: "`class Commande(Modele) with JsonMixin:`", correct: false}
      - {text: "`class Commande(Modele, mixins=[JsonMixin]):`", correct: false}
      - {text: "`class Commande(Modele + JsonMixin):`", correct: false}
    answer: "Un mixin est un parent comme un autre, placé avant la classe de base. Python n'a pas de syntaxe dédiée."
  - key: qcm-nom-mixin
    format: multiple-choice
    question: "Quel nom suit la convention pour un mixin qui ajoute la comparaison ?"
    choices:
      - {text: "`ComparableMixin`", correct: true}
      - {text: "`BaseComparable`", correct: false}
      - {text: "`ComparableABC`", correct: false}
      - {text: "`AbstractComparable`", correct: false}
    answer: "Le suffixe `Mixin` dit au lecteur que la classe ne s'utilise pas seule. `ABC` ou `Abstract` suggéreraient une interface à implémenter."
  - key: qcm-risque-mixins
    format: multiple-choice
    question: "Quel est le principal risque d'empiler beaucoup de mixins ?"
    choices:
      - {text: "Des dépendances cachées et des conflits de noms, durs à suivre dans le MRO", correct: true}
      - {text: "Une lenteur à l'exécution, chaque mixin copiant ses méthodes", correct: false}
      - {text: "Une limite de cinq classes parentes imposée par Python", correct: false}
      - {text: "La perte des attributs d'instance de la classe de base", correct: false}
    answer: "Chaque mixin peut supposer un attribut de l'hôte ou masquer la méthode d'un autre : le comportement final dépend de l'ordre du MRO."
  - key: qcm-alternative-mixin
    format: multiple-choice
    question: "Quelle alternative à un mixin évite l'héritage multiple ?"
    choices:
      - {text: "Un objet collaborateur, auquel la classe délègue le comportement", correct: true}
      - {text: "Une classe abstraite dont toutes les classes héritent", correct: false}
      - {text: "Une métaclasse qui fusionne les deux classes en une", correct: false}
      - {text: "Un `__slots__` qui déclare la méthode à partager", correct: false}
    answer: "La composition : la classe reçoit un objet qui sait faire, et lui transmet l'appel. Une classe abstraite commune, c'est encore de l'héritage."
  - key: code-mixin-en-dict
    format: code-output
    question: |-
      ```python
      class DictMixin:
          def en_dict(self):
              return dict(vars(self))


      class Point(DictMixin):
          def __init__(self, x, y):
              self.x = x
              self.y = y


      print(Point(1, 2).en_dict())
      ```
    answer: "`{'x': 1, 'y': 2}` : le mixin travaille sur les attributs de l'objet hôte, qu'il ne connaît pas à l'avance."
    check:
      output: "{'x': 1, 'y': 2}"
    choices:
      - {text: "`{'x': 1, 'y': 2}`", correct: true}
      - {text: "`{}`", correct: false}
      - {text: "`{'Point': (1, 2)}`", correct: false}
      - {text: "`{'self': {'x': 1, 'y': 2}}`", correct: false}
  - key: code-mixin-position
    format: code-output
    question: |-
      ```python
      class Base:
          def decrire(self):
              return "base"


      class MajusculesMixin:
          def decrire(self):
              return super().decrire().upper()


      class A(MajusculesMixin, Base):
          pass


      class B(Base, MajusculesMixin):
          pass


      print(A().decrire(), B().decrire())
      ```
    answer: "`BASE base` : à gauche, le mixin passe avant `Base` et la complète ; à droite, `Base.decrire` est trouvée d'abord et le mixin ne sert pas."
    check:
      output: "BASE base"
    choices:
      - {text: "`BASE base`", correct: true}
      - {text: "`BASE BASE`", correct: false}
      - {text: "`base BASE`", correct: false}
      - {text: "`base base`", correct: false}
  - key: code-deux-mixins
    format: code-output
    question: |-
      ```python
      class Base:
          def journal(self):
              return ["base"]


      class HeureMixin:
          def journal(self):
              return ["heure"] + super().journal()


      class AuteurMixin:
          def journal(self):
              return ["auteur"] + super().journal()


      class Article(AuteurMixin, HeureMixin, Base):
          pass


      print(Article().journal())
      ```
    answer: "`['auteur', 'heure', 'base']` : les mixins coopèrent par `super()`, dans l'ordre du MRO, `Article, AuteurMixin, HeureMixin, Base`."
    check:
      output: "['auteur', 'heure', 'base']"
    choices:
      - {text: "`['auteur', 'heure', 'base']`", correct: true}
      - {text: "`['auteur', 'base']`", correct: false}
      - {text: "`['heure', 'auteur', 'base']`", correct: false}
      - {text: "`['base', 'heure', 'auteur']`", correct: false}
  - key: code-attribut-hote-manquant
    format: code-output
    question: |-
      ```python
      class SalutMixin:
          def saluer(self):
              return f"Bonjour {self.nom}"


      class Client(SalutMixin):
          def __init__(self, nom):
              self.nom = nom


      class Anonyme(SalutMixin):
          pass


      try:
          print(Client("Ana").saluer(), Anonyme().saluer())
      except AttributeError:
          print("nom manquant")
      ```
    answer: "`nom manquant` : `Anonyme` ne fournit pas l'attribut `nom` dont le mixin dépend. L'erreur survient avant l'affichage, qui n'a jamais lieu."
    check:
      output: "nom manquant"
    choices:
      - {text: "`nom manquant`", correct: true}
      - {text: "`Bonjour Ana nom manquant`", correct: false}
      - {text: "`Bonjour Ana Bonjour None`", correct: false}
      - {text: "`Bonjour Ana`", correct: false}
  - key: situation-json-partage
    format: scenario
    question: |-
      Dix classes de modèles, sans parent commun utile, doivent toutes se convertir en JSON de la même façon. Que
      proposes-tu ?
    choices:
      - {text: "Un `JsonMixin` avec une méthode `en_json`, ajouté à chaque classe", correct: true}
      - {text: "Copier la méthode `en_json` dans chacune des dix classes", correct: false}
      - {text: "Un `if` dans chaque classe, selon le type de l'objet", correct: false}
      - {text: "Une métaclasse qui réécrit chaque classe à son chargement", correct: false}
    answer: "Un comportement transverse, identique partout et sans configuration : c'est le cas d'usage du mixin. Une fonction `en_json(obj)` serait aussi une bonne réponse."
  - key: situation-mixin-init
    format: scenario
    question: |-
      Ton `CacheMixin` définit `__init__(self)` pour créer `self._cache`, et la classe `Service(CacheMixin, Base)` perd
      les attributs que `Base.__init__` devait créer. Que corriges-tu ?
    choices:
      - {text: "Le mixin appelle `super().__init__(*args, **kwargs)`, ou crée son cache à la demande", correct: true}
      - {text: "Je place le mixin à droite, pour que `Base.__init__` passe seul", correct: false}
      - {text: "J'appelle `Base.__init__` depuis le mixin, qui connaît sa base", correct: false}
      - {text: "Je supprime `Base.__init__`, que le mixin remplace", correct: false}
    answer: "Le `__init__` du mixin coupe la chaîne : il doit transmettre la suite au MRO. À droite, c'est `CacheMixin.__init__` qui ne s'exécuterait plus, et `_cache` manquerait."
  - key: situation-conflit-valider
    format: scenario
    question: |-
      Deux mixins de ton projet définissent chacun une méthode `valider`, et la classe qui les combine n'en exécute
      qu'une. Que fais-tu ?
    choices:
      - {text: "Je rends les deux méthodes coopératives avec `super()`, ou je les renomme", correct: true}
      - {text: "J'inverse l'ordre des mixins jusqu'à ce que les tests passent", correct: false}
      - {text: "Je supprime un des deux mixins, sans regarder ce qu'il apporte", correct: false}
      - {text: "J'ajoute un troisième mixin qui redéfinit `valider` à vide", correct: false}
    answer: "La première `valider` du MRO masque l'autre. Avec `super().valider()` dans chacune, les deux s'exécutent ; si elles font des choses différentes, des noms distincts évitent le conflit."
  - key: situation-expediteur
    format: scenario
    question: |-
      Une classe `Rapport` doit pouvoir s'envoyer par e-mail, avec un serveur SMTP différent selon l'environnement.
      Mixin `EmailMixin`, ou objet `Expediteur` passé au constructeur ?
    choices:
      - {text: "L'objet `Expediteur` : il porte sa configuration et se remplace en test", correct: true}
      - {text: "Le mixin : l'héritage est toujours préférable en Python", correct: false}
      - {text: "Le mixin : un objet passé au constructeur coûte plus de mémoire", correct: false}
      - {text: "Aucun : il faut une sous-classe de `Rapport` par serveur SMTP", correct: false}
    answer: "Un comportement configuré et interchangeable est un composant. Un mixin convient aux comportements fixes et sans état, comme la conversion en JSON."
