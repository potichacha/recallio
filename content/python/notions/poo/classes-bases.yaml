notion: classes-bases
lesson: |-
  Une **classe** décrit un type d'objet : les données qu'il porte (ses **attributs**) et ce qu'il sait faire (ses
  **méthodes**). Chaque objet créé à partir d'elle est une **instance** de la classe.

  ```python
  class Compte:
      def __init__(self, titulaire, solde=0):
          self.titulaire = titulaire      # des attributs d'instance
          self.solde = solde

      def deposer(self, montant):
          self.solde += montant


  compte = Compte("Ana")      # on appelle la classe : pas de new
  compte.deposer(50)
  print(compte.solde)         # 50
  ```

  - **`__init__`** initialise l'objet que Python vient de créer. Il ne crée pas l'objet et ne renvoie rien (`None`) :
    renvoyer autre chose lève une `TypeError`.
  - **`self`** est l'objet sur lequel on appelle la méthode. Python le passe tout seul : `compte.deposer(50)` revient à
    `Compte.deposer(compte, 50)`. Ce n'est pas un mot-clé, mais une convention que tout le monde suit.
  - **Un attribut d'instance** naît à sa première affectation, `self.solde = ...`. Il vit dans le dictionnaire de
    l'objet, `compte.__dict__` (ou `vars(compte)`) : chaque objet a le sien.
  - Une méthode qui oublie `self` dans ses paramètres échoue à l'appel : `TypeError: ... takes 0 positional arguments
    but 1 was given`.
  - Écrire `solde = solde` au lieu de `self.solde = solde` ne crée qu'une variable locale : l'attribut n'existe pas, et
    sa lecture lève une `AttributeError`.
  - Une méthode s'appelle avec ses parenthèses : `compte.deposer` sans elles n'est que la méthode liée, un objet.

  | Écriture | Ce qu'elle fait |
  |---|---|
  | `class Compte:` | déclare la classe (nom en `CamelCase`, PEP 8) |
  | `Compte("Ana")` | crée un objet, puis appelle `__init__` |
  | `compte.solde` | lit un attribut |
  | `compte.deposer(50)` | appelle une méthode |
  | `isinstance(compte, Compte)` | teste le type de l'objet |

  Python permet d'ajouter un attribut à un objet après sa création (`compte.devise = "EUR"`), mais une classe lisible
  déclare tous ses attributs dans `__init__` : on voit d'un coup d'œil ce que porte l'objet.

  **En entretien** : « Une classe regroupe des données et des méthodes ; on l'instancie en l'appelant comme une
  fonction. `__init__` initialise l'objet, et `self` est l'objet courant, passé explicitement en premier paramètre. Les
  attributs d'instance se créent par `self.x = ...` et sont propres à chaque objet. »
tour:
  - title: Une classe et ses objets
    text: |-
      Une classe décrit un type d'objet : ses données et ce qu'il sait faire. On la déclare avec `class`, puis on crée
      un objet en **appelant** la classe, comme une fonction. Il n'y a pas de `new`.

      - `__init__` initialise chaque nouvel objet ;
      - `self` est l'objet lui-même : le premier paramètre de chaque méthode, que Python passe tout seul ;
      - `self.valeur = 0` crée un **attribut d'instance**, propre à cet objet.

      `clics.incrementer(5)` revient à `Compteur.incrementer(clics, 5)`. Les deux compteurs ne partagent rien.

      Essaie : crée un troisième compteur, `likes`, incrémente-le de 2, puis affiche son nom et sa valeur.
    example:
      files:
        main.py: |-
          class Compteur:
              def __init__(self, nom):
                  self.nom = nom
                  self.valeur = 0

              def incrementer(self, pas=1):
                  self.valeur += pas


          clics = Compteur("clics")
          visites = Compteur("visites")
          clics.incrementer()
          clics.incrementer(5)
          visites.incrementer()
          print(clics.nom, clics.valeur)
          print(visites.nom, visites.valeur)
      output: |-
        clics 6
        visites 1
    task:
      instructions: |-
        Ajoute à `Compteur` une méthode `remettre_a_zero()`, qui remet `valeur` à 0, puis appelle-la sur `clics` à
        l'endroit indiqué. Le programme doit afficher `clics 6`, puis `clics 0`.
      starter:
        main.py: |-
          class Compteur:
              def __init__(self, nom):
                  self.nom = nom
                  self.valeur = 0

              def incrementer(self, pas=1):
                  self.valeur += pas


          clics = Compteur("clics")
          clics.incrementer(6)
          print(clics.nom, clics.valeur)
          # Appelle ici remettre_a_zero sur clics.
          print(clics.nom, clics.valeur)
      solution:
        main.py: |-
          class Compteur:
              def __init__(self, nom):
                  self.nom = nom
                  self.valeur = 0

              def incrementer(self, pas=1):
                  self.valeur += pas

              def remettre_a_zero(self):
                  self.valeur = 0


          clics = Compteur("clics")
          clics.incrementer(6)
          print(clics.nom, clics.valeur)
          clics.remettre_a_zero()
          print(clics.nom, clics.valeur)
      output: |-
        clics 6
        clics 0
cards:
  - key: vf-self-mot-cle
    format: true-false
    question: "`self` est un mot-clé réservé de Python."
    truth: false
    answer: "C'est une simple convention : le premier paramètre d'une méthode reçoit l'objet, quel que soit son nom. Tout le monde l'appelle `self`, et les outils s'y attendent."
  - key: vf-pas-de-new
    format: true-false
    question: "En Python, on crée un objet en appelant la classe comme une fonction, sans mot-clé `new`."
    truth: true
    answer: "`Compte('Ana')` crée l'objet, puis appelle `__init__` pour l'initialiser."
  - key: vf-attribut-ajoute
    format: true-false
    question: "On peut ajouter un attribut à un objet après sa création, hors de `__init__`."
    truth: true
    answer: "`compte.devise = 'EUR'` fonctionne : l'objet range ses attributs dans un dictionnaire. C'est pourtant à éviter : une classe lisible déclare tous ses attributs dans `__init__`."
  - key: vf-init-renvoie
    format: true-false
    question: "`__init__` doit renvoyer l'objet qu'il vient d'initialiser."
    truth: false
    answer: "`__init__` renvoie `None` : l'objet existe déjà, il ne fait que le remplir. Renvoyer autre chose lève une `TypeError`."
  - key: qcm-instancier
    format: multiple-choice
    question: "La méthode `__init__(self, titulaire)` de `Compte` attend un titulaire. Comment crées-tu un compte pour Ana ?"
    choices:
      - {text: "`Compte('Ana')`", correct: true}
      - {text: "`new Compte('Ana')`", correct: false}
      - {text: "`Compte.__init__('Ana')`", correct: false}
      - {text: "`Compte(self, 'Ana')`", correct: false}
    answer: "On appelle la classe ; Python crée l'objet et le passe lui-même comme `self` à `__init__`. `new` n'existe pas en Python."
  - key: qcm-oubli-self
    format: multiple-choice
    question: "Une méthode est déclarée `def solde():`, sans paramètre. Que se passe-t-il à l'appel `compte.solde()` ?"
    choices:
      - {text: "Une `TypeError` : la méthode reçoit l'objet sans pouvoir l'accepter", correct: true}
      - {text: "Elle s'exécute normalement, mais sans accès à l'objet", correct: false}
      - {text: "Python ajoute tout seul `self` à la déclaration", correct: false}
      - {text: "Une `NameError` : le nom `self` n'est défini nulle part", correct: false}
    answer: "`compte.solde()` devient `Compte.solde(compte)` : la méthode reçoit un argument qu'elle ne déclare pas, d'où « takes 0 positional arguments but 1 was given »."
  - key: qcm-nommage
    format: multiple-choice
    question: "Quel nom de classe suit la convention de PEP 8 ?"
    choices:
      - {text: "`CompteBancaire`", correct: true}
      - {text: "`compte_bancaire`", correct: false}
      - {text: "`COMPTE_BANCAIRE`", correct: false}
      - {text: "`compteBancaire`", correct: false}
    answer: "Les classes s'écrivent en `CamelCase` ; les fonctions et les variables en `snake_case`, les constantes en majuscules."
  - key: qcm-attribut-oublie
    format: multiple-choice
    question: "Dans `__init__`, tu écris `nom = nom` au lieu de `self.nom = nom`. Que donne ensuite `client.nom` ?"
    choices:
      - {text: "Une `AttributeError` : `nom` n'était qu'une variable locale", correct: true}
      - {text: "Le nom passé au constructeur, comme prévu", correct: false}
      - {text: "`None`, la valeur par défaut d'un attribut", correct: false}
      - {text: "Une `NameError`, dès l'appel du constructeur", correct: false}
    answer: "Sans `self.`, l'affectation crée une variable locale à `__init__`, perdue à la fin de l'appel. L'objet n'a donc pas d'attribut `nom`."
  - key: trous-init
    format: fill-in
    question: |-
      Complète le constructeur :
      ```python
      class Produit:
          def ___(self, nom, prix):
              self.nom = nom
              self.prix = prix
      ```
    blanks:
      - - __init__
    answer: "`__init__`, avec deux soulignés de chaque côté, initialise chaque nouvel objet."
  - key: trous-self
    format: fill-in
    question: |-
      Complète pour que chaque produit garde son propre prix :
      ```python
      class Produit:
          def __init__(self, nom, prix):
              self.nom = nom
              ___.prix = prix
      ```
    blanks:
      - - self
    answer: "`self.prix = prix` crée un attribut sur l'objet ; `prix = prix` seul ne ferait qu'une variable locale."
  - key: trous-class
    format: fill-in
    question: |-
      Complète la définition :
      ```python
      ___ Panier:
          def __init__(self):
              self.articles = []
      ```
    blanks:
      - - class
    answer: "Le mot-clé `class`, suivi du nom et de deux-points."
  - key: trous-isinstance
    format: fill-in
    question: |-
      Complète pour vérifier que `p` est un `Produit` :
      ```python
      if ___(p, Produit):
          print("produit")
      ```
    blanks:
      - - isinstance
    answer: "`isinstance(objet, Classe)` teste le type, sous-classes comprises."
  - key: code-deux-objets
    format: code-output
    question: |-
      ```python
      class Compteur:
          def __init__(self):
              self.valeur = 0

          def incrementer(self):
              self.valeur += 1


      a = Compteur()
      b = Compteur()
      a.incrementer()
      a.incrementer()
      b.incrementer()
      print(a.valeur, b.valeur)
      ```
    answer: "`2 1` : chaque objet a son propre attribut `valeur`, créé par son `__init__`."
    check:
      output: "2 1"
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`2 2`", correct: false}
  - key: code-appel-par-classe
    format: code-output
    question: |-
      ```python
      class Salut:
          def __init__(self, nom):
              self.nom = nom

          def dire(self, mot):
              return f"{mot} {self.nom}"


      s = Salut("Ana")
      print(s.dire("Bonjour"), Salut.dire(s, "Salut"))
      ```
    answer: "`Bonjour Ana Salut Ana` : `s.dire('Bonjour')` est un raccourci pour `Salut.dire(s, 'Bonjour')`. Appelée sur la classe, la méthode reçoit l'objet explicitement."
    check:
      output: "Bonjour Ana Salut Ana"
    choices:
      - {text: "`Bonjour Ana Salut Ana`", correct: true}
      - {text: "`Bonjour Ana Salut s`", correct: false}
      - {text: "`Bonjour Ana Salut`", correct: false}
      - {text: "`Bonjour Ana None`", correct: false}
  - key: code-attribut-dynamique
    format: code-output
    question: |-
      ```python
      class Boite:
          pass


      b = Boite()
      b.contenu = "clés"
      b.contenu = b.contenu.upper()
      print(b.contenu, hasattr(Boite(), "contenu"))
      ```
    answer: "`CLÉS False` : l'attribut a été ajouté à `b` seulement. Une nouvelle `Boite` ne l'a pas."
    check:
      output: "CLÉS False"
    choices:
      - {text: "`CLÉS False`", correct: true}
      - {text: "`CLÉS True`", correct: false}
      - {text: "`clés False`", correct: false}
      - {text: "`None False`", correct: false}
  - key: code-chainage
    format: code-output
    question: |-
      ```python
      class Panier:
          def __init__(self):
              self.articles = []

          def ajouter(self, article):
              self.articles.append(article)
              return self


      p = Panier()
      p.ajouter("pain").ajouter("lait")
      print(len(p.articles), p.articles[-1])
      ```
    answer: "`2 lait` : `ajouter` renvoie `self`, le même panier, sur lequel on rappelle `ajouter`."
    check:
      output: "2 lait"
    choices:
      - {text: "`2 lait`", correct: true}
      - {text: "`1 pain`", correct: false}
      - {text: "`2 pain`", correct: false}
      - {text: "`1 lait`", correct: false}
  - key: bug-oubli-self-param
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: Minuteur.demarrer() takes 0 positional arguments but 1 was given » :
      ```python
      class Minuteur:
          def __init__(self, secondes):
              self.secondes = secondes

          def demarrer():
              print("Départ :", self.secondes)


      Minuteur(30).demarrer()
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Déclarer la méthode `def demarrer(self):`", correct: true}
      - {text: "Appeler `Minuteur.demarrer()`, sans objet", correct: false}
      - {text: "Écrire `print('Départ :', secondes)`", correct: false}
      - {text: "Ajouter `global self` dans la méthode", correct: false}
    answer: |-
      ```python
      def demarrer(self):
          print("Départ :", self.secondes)
      ```
      L'appel `Minuteur(30).demarrer()` passe l'objet en premier argument : la méthode doit le recevoir, dans `self`.
  - key: bug-variable-locale
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « AttributeError: 'Client' object has no attribute 'nom' » :
      ```python
      class Client:
          def __init__(self, nom):
              nom = nom


      c = Client("Ana")
      print(c.nom)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `self.nom = nom` dans `__init__`", correct: true}
      - {text: "Écrire `return nom` à la fin de `__init__`", correct: false}
      - {text: "Lire `c.__init__.nom` au lieu de `c.nom`", correct: false}
      - {text: "Déclarer `nom = None` avant la classe", correct: false}
    answer: |-
      ```python
      def __init__(self, nom):
          self.nom = nom
      ```
      `nom = nom` réaffecte le paramètre, une variable locale. Seul `self.nom = ...` crée un attribut sur l'objet.
  - key: bug-init-mal-nomme
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: Article() takes no arguments » :
      ```python
      class Article:
          def _init_(self, titre):
              self.titre = titre


      a = Article("Python")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Nommer la méthode `__init__`, deux soulignés de chaque côté", correct: true}
      - {text: "Appeler `a._init_('Python')` après la création", correct: false}
      - {text: "Ajouter `return self` à la fin de la méthode", correct: false}
      - {text: "Créer l'objet par `Article.titre = 'Python'`", correct: false}
    answer: |-
      ```python
      class Article:
          def __init__(self, titre):
              self.titre = titre
      ```
      Avec un seul souligné, `_init_` n'est qu'une méthode ordinaire : la classe garde l'`__init__` d'`object`, qui
      n'accepte aucun argument.
  - key: bug-methode-sans-parentheses
    format: bug-fix
    question: |-
      Ce programme affiche « Il fait <bound method Thermometre.fahrenheit of <__main__.Thermometre object at 0x...>> °F » :
      ```python
      class Thermometre:
          def __init__(self, celsius):
              self.celsius = celsius

          def fahrenheit(self):
              return self.celsius * 9 / 5 + 32


      t = Thermometre(100)
      print("Il fait", t.fahrenheit, "°F")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler la méthode : `t.fahrenheit()`", correct: true}
      - {text: "Écrire `self.fahrenheit` dans le `print`", correct: false}
      - {text: "Écrire `str(t.fahrenheit)` dans le `print`", correct: false}
      - {text: "Renvoyer `print(...)` dans `fahrenheit`", correct: false}
    answer: |-
      ```python
      print("Il fait", t.fahrenheit(), "°F")   # Il fait 212.0 °F
      ```
      Sans parenthèses, `t.fahrenheit` est la méthode liée à l'objet, pas son résultat.
  - key: role-init
    format: course
    question: "À quoi sert la méthode `__init__` d'une classe ?"
    choices:
      - {text: "Elle initialise l'objet qui vient d'être créé, en lui donnant ses attributs", correct: true}
      - {text: "Elle crée l'objet en mémoire, puis le renvoie à l'appelant", correct: false}
      - {text: "Elle déclare la liste des attributs permis pour cette classe", correct: false}
      - {text: "Elle s'exécute une seule fois, quand la classe est définie", correct: false}
    answer: "Python crée l'objet, puis appelle `__init__` pour le remplir. C'est `__new__` qui crée l'objet ; `__init__` renvoie `None`."
  - key: role-self
    format: course
    question: "Que désigne `self` dans une méthode ?"
    choices:
      - {text: "L'objet sur lequel la méthode est appelée, passé en premier argument", correct: true}
      - {text: "La classe elle-même, partagée par tous ses objets", correct: false}
      - {text: "Un mot-clé réservé du langage, comme `this` en Java", correct: false}
      - {text: "Le module dans lequel la classe est définie", correct: false}
    answer: "`compte.deposer(50)` appelle `Compte.deposer(compte, 50)` : `self` reçoit `compte`. Le nom est une convention, pas un mot-clé."
  - key: appel-methode
    format: course
    question: "Que fait Python quand tu écris `compte.deposer(50)` ?"
    choices:
      - {text: "Il appelle `Compte.deposer(compte, 50)`", correct: true}
      - {text: "Il appelle `Compte.deposer(50)`, sans l'objet", correct: false}
      - {text: "Il appelle une fonction globale `deposer(compte, 50)`", correct: false}
      - {text: "Il copie `compte`, puis appelle `deposer` sur la copie", correct: false}
    answer: "La méthode est cherchée dans la classe, et l'objet lui est passé en premier argument : c'est lui que la méthode modifie, sans copie."
  - key: ou-vivent-attributs
    format: course
    question: "Où sont rangés les attributs d'instance comme `self.nom` ?"
    choices:
      - {text: "Dans le dictionnaire `__dict__` de l'objet", correct: true}
      - {text: "Dans le dictionnaire `__dict__` de la classe", correct: false}
      - {text: "Dans une liste déclarée en tête de la classe", correct: false}
      - {text: "Dans les variables globales du module", correct: false}
    answer: "Chaque objet a son dictionnaire, que montre `vars(objet)`. Le `__dict__` de la classe contient ses méthodes et ses attributs de classe."
