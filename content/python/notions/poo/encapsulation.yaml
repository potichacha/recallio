notion: encapsulation
lesson: |-
  Python n'a ni `private` ni `protected` : tout attribut est accessible. L'encapsulation repose sur des **conventions
  de nommage**, que les développeurs respectent par choix (« nous sommes entre adultes consentants »).

  | Nom | Sens | Ce que fait Python |
  |---|---|---|
  | `nom` | public : fait partie de l'interface | rien |
  | `_nom` | interne : « n'y touche pas de l'extérieur » | rien, sauf `from module import *`, qui l'ignore |
  | `__nom` | évite les collisions dans les sous-classes | le renomme en `_Classe__nom` |
  | `__nom__` | réservé au langage (`__init__`, `__len__`) | rien : pas de transformation |

  **La transformation des noms** (*name mangling*). Dans le corps d'une classe, un nom qui commence par deux soulignés
  et ne finit pas par deux soulignés est réécrit avec le nom de la classe :

  ```python
  class Compte:
      def __init__(self, solde):
          self.__solde = solde        # rangé sous _Compte__solde


  c = Compte(100)
  print(vars(c))                       # {'_Compte__solde': 100}
  print(c._Compte__solde)              # 100 : rien n'est vraiment caché
  c.__solde                            # AttributeError
  ```

  - Son but n'est **pas la sécurité**, mais d'éviter qu'une sous-classe écrase par mégarde un attribut de sa classe
    parente : `Base.__id` et `Fille.__id` deviennent `_Base__id` et `_Fille__id`.
  - Le revers : une sous-classe ne voit pas `self.__solde` de son parent (elle cherche `_Fille__solde`). Pour un
    attribut interne partagé avec les sous-classes, un seul souligné suffit.
  - La transformation ne touche que le code écrit **dans la classe** : `getattr(obj, "__solde")`, ou `obj.__solde`
    écrit hors de la classe, ne sont pas réécrits.
  - Elle s'applique aussi aux méthodes : `def __valider(self)` devient `_Classe__valider`.

  **En pratique** : un seul souligné pour l'interne, un attribut public tant qu'aucune règle ne le protège, et une
  `@property` sans setter pour un attribut lisible mais pas modifiable de l'extérieur.

  **En entretien** : « Python n'a pas de privé : `_nom` signale un détail interne, par convention. `__nom` déclenche la
  transformation en `_Classe__nom`, pour éviter les collisions dans les sous-classes, pas pour protéger. Pour
  contrôler l'accès, on utilise une propriété. »
cards:
  - key: un-souligne
    format: course
    question: "Que signifie un nom qui commence par un souligné, comme `self._cache` ?"
    choices:
      - {text: "Un détail interne : la convention demande de ne pas s'en servir de l'extérieur", correct: true}
      - {text: "Un attribut privé : Python en interdit l'accès hors de la classe", correct: false}
      - {text: "Un attribut de classe, partagé par tous les objets de la classe", correct: false}
      - {text: "Un attribut en lecture seule, qu'on ne peut plus réaffecter", correct: false}
    answer: "C'est une convention, que Python ne vérifie pas. Les outils (éditeurs, linters) la signalent, et `from module import *` ignore ces noms."
  - key: deux-soulignes
    format: course
    question: "Que fait Python d'un attribut nommé `self.__solde` dans la classe `Compte` ?"
    choices:
      - {text: "Il le renomme en `_Compte__solde`", correct: true}
      - {text: "Il le rend inaccessible hors de la classe", correct: false}
      - {text: "Il le chiffre en mémoire, pour le protéger", correct: false}
      - {text: "Il le partage entre tous les objets de `Compte`", correct: false}
    answer: "C'est la transformation des noms. L'attribut reste lisible par `c._Compte__solde` : rien n'est vraiment caché."
  - key: but-transformation
    format: course
    question: "À quoi sert surtout la transformation des noms (`__x`) ?"
    choices:
      - {text: "À éviter qu'une sous-classe écrase par mégarde un attribut de son parent", correct: true}
      - {text: "À protéger une donnée sensible contre une lecture malveillante", correct: false}
      - {text: "À accélérer l'accès aux attributs les plus utilisés", correct: false}
      - {text: "À signaler un attribut que Python doit garder constant", correct: false}
    answer: "`Base.__id` devient `_Base__id`, `Fille.__id` devient `_Fille__id` : les deux coexistent. Ce n'est pas une protection : le nom transformé se lit librement."
  - key: dunder-pas-transforme
    format: course
    question: "Pourquoi `__init__` n'est-il pas renommé, alors que `__solde` l'est ?"
    choices:
      - {text: "Un nom qui finit aussi par deux soulignés n'est pas transformé", correct: true}
      - {text: "Les méthodes ne sont jamais transformées, seuls les attributs", correct: false}
      - {text: "`__init__` est défini par `object`, que rien ne transforme", correct: false}
      - {text: "La transformation ne touche que les noms en majuscules", correct: false}
    answer: "Les noms `__x__` sont réservés aux méthodes spéciales du langage, et gardés tels quels. Une méthode `__valider`, elle, est bien transformée."
  - key: vf-acces-impossible
    format: true-false
    question: "Python empêche tout accès à un attribut nommé `__x` depuis l'extérieur de sa classe."
    truth: false
    answer: "L'attribut est renommé `_Classe__x`, et se lit sous ce nom. Python n'a aucun mécanisme d'attribut privé."
  - key: vf-import-etoile
    format: true-false
    question: "`from module import *` n'importe pas les noms qui commencent par un souligné, sauf s'ils figurent dans `__all__`."
    truth: true
    answer: "C'est le seul effet réel d'un souligné simple. Un import explicite, `from module import _nom`, reste possible."
  - key: vf-methodes-transformees
    format: true-false
    question: "La transformation des noms s'applique aussi aux méthodes nommées `__nom`."
    truth: true
    answer: "`def __valider(self)` dans `Formulaire` devient `_Formulaire__valider`. Une sous-classe qui appelle `self.__valider()` cherche `_SousClasse__valider`."
  - key: vf-un-souligne-renomme
    format: true-false
    question: "Python renomme les attributs qui commencent par un seul souligné."
    truth: false
    answer: "Un seul souligné est une pure convention : `self._cache` reste `_cache`. Seul le double souligné déclenche la transformation."
  - key: qcm-lire-nom-transforme
    format: multiple-choice
    question: "Comment lis-tu, de l'extérieur, l'attribut `__code` d'un objet `c` de la classe `Coffre` ?"
    choices:
      - {text: "`c._Coffre__code`", correct: true}
      - {text: "`c.__code`", correct: false}
      - {text: "`c.Coffre__code`", correct: false}
      - {text: "`c.__Coffre_code`", correct: false}
    answer: "Le nom est réécrit en souligné, nom de la classe, puis le nom d'origine. `c.__code` hors de la classe n'est pas réécrit, et n'existe pas."
  - key: qcm-methode-interne
    format: multiple-choice
    question: "Quel nom choisis-tu pour une méthode d'aide que les utilisateurs de ta classe ne doivent pas appeler ?"
    choices:
      - {text: "`_normaliser`", correct: true}
      - {text: "`__normaliser__`", correct: false}
      - {text: "`normaliser_`", correct: false}
      - {text: "`NORMALISER`", correct: false}
    answer: "Un souligné en tête signale un détail interne. `__nom__` est réservé au langage, et un souligné final sert à éviter un mot-clé (`class_`)."
  - key: qcm-philosophie
    format: multiple-choice
    question: "Quelle phrase résume l'approche de Python pour la visibilité des attributs ?"
    choices:
      - {text: "Des conventions de nommage, que les développeurs respectent par choix", correct: true}
      - {text: "Des mots-clés `private` et `protected`, vérifiés à l'exécution", correct: false}
      - {text: "Des attributs tous privés, sauf ceux déclarés dans `__all__`", correct: false}
      - {text: "Des accès contrôlés par le module `abc`, à la compilation", correct: false}
    answer: "« Nous sommes entre adultes consentants » : rien n'est interdit, mais `_nom` dit clairement ce qui n'appartient pas à l'interface."
  - key: qcm-lisible-non-modifiable
    format: multiple-choice
    question: "Tu veux un attribut lisible de l'extérieur, mais modifiable seulement par la classe. Que fais-tu ?"
    choices:
      - {text: "Un attribut `_valeur`, exposé par une propriété sans setter", correct: true}
      - {text: "Un attribut `__valeur__`, que Python protège en écriture", correct: false}
      - {text: "Un attribut `valeur` déclaré `private` dans la classe", correct: false}
      - {text: "Un attribut de classe `valeur`, figé après sa création", correct: false}
    answer: "`obj.valeur` se lit par la propriété ; l'affecter lève une `AttributeError`. La classe, elle, écrit dans `self._valeur`."
  - key: code-vars-coffre
    format: code-output
    question: |-
      ```python
      class Coffre:
          def __init__(self):
              self.__code = 1234
              self._etiquette = "cave"


      print(sorted(vars(Coffre())))
      ```
    answer: "`['_Coffre__code', '_etiquette']` : `__code` est rangé sous son nom transformé ; `_etiquette` garde le sien."
    check:
      output: "['_Coffre__code', '_etiquette']"
    choices:
      - {text: "`['_Coffre__code', '_etiquette']`", correct: true}
      - {text: "`['__code', '_etiquette']`", correct: false}
      - {text: "`['_etiquette']`", correct: false}
      - {text: "`['_Coffre__code', '_Coffre_etiquette']`", correct: false}
  - key: code-acces-externe
    format: code-output
    question: |-
      ```python
      class Coffre:
          def __init__(self):
              self.__code = 1234


      c = Coffre()
      try:
          print(c.__code)
      except AttributeError:
          print("introuvable", c._Coffre__code)
      ```
    answer: "`introuvable 1234` : hors de la classe, `c.__code` n'est pas transformé et n'existe pas ; le nom transformé, lui, se lit."
    check:
      output: "introuvable 1234"
    choices:
      - {text: "`introuvable 1234`", correct: true}
      - {text: "`1234`", correct: false}
      - {text: "`introuvable None`", correct: false}
      - {text: "`introuvable`", correct: false}
  - key: code-pas-d-ecrasement
    format: code-output
    question: |-
      ```python
      class Base:
          def __init__(self):
              self.__id = "base"

          def id_base(self):
              return self.__id


      class Fille(Base):
          def __init__(self):
              super().__init__()
              self.__id = "fille"


      f = Fille()
      print(f.id_base(), f._Fille__id)
      ```
    answer: "`base fille` : les deux attributs coexistent, `_Base__id` et `_Fille__id`. La sous-classe n'a pas écrasé celui du parent."
    check:
      output: "base fille"
    choices:
      - {text: "`base fille`", correct: true}
      - {text: "`fille fille`", correct: false}
      - {text: "`base base`", correct: false}
      - {text: "`fille base`", correct: false}
  - key: code-un-souligne-libre
    format: code-output
    question: |-
      ```python
      class Session:
          def __init__(self):
              self._jeton = "abc"


      s = Session()
      s._jeton = "xyz"
      print(s._jeton)
      ```
    answer: "`xyz` : un seul souligné n'empêche rien. C'est une convention, que ce code ignore."
    check:
      output: "xyz"
    choices:
      - {text: "`xyz`", correct: true}
      - {text: "`abc`", correct: false}
      - {text: "`_jeton`", correct: false}
      - {text: "`abcxyz`", correct: false}
  - key: bug-sous-classe-solde
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une `AttributeError` : « 'CompteEpargne' object has no attribute '_CompteEpargne__solde' ».
      ```python
      class Compte:
          def __init__(self, solde):
              self.__solde = solde


      class CompteEpargne(Compte):
          def interets(self):
              return self.__solde * 0.03


      print(CompteEpargne(100).interets())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Nommer l'attribut `_solde`, avec un seul souligné, dans les deux classes", correct: true}
      - {text: "Appeler `super().__init__(solde)` dans `CompteEpargne`", correct: false}
      - {text: "Déclarer `__solde = 0` dans le corps de `CompteEpargne`", correct: false}
      - {text: "Écrire `self.__solde__` dans la méthode `interets`", correct: false}
    answer: |-
      ```python
      class Compte:
          def __init__(self, solde):
              self._solde = solde


      class CompteEpargne(Compte):
          def interets(self):
              return self._solde * 0.03
      ```
      L'attribut est rangé sous `_Compte__solde`, mais la sous-classe cherche `_CompteEpargne__solde`. Un attribut
      interne partagé avec les sous-classes prend un seul souligné.
  - key: bug-getattr-chaine
    format: bug-fix
    question: |-
      Ce programme affiche `absente`, alors que la mesure a bien été enregistrée :
      ```python
      class Capteur:
          def __init__(self):
              self.__mesure = 21.5


      c = Capteur()
      print(getattr(c, "__mesure", "absente"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Nommer l'attribut `_mesure` : `getattr` ne transforme pas les noms", correct: true}
      - {text: "Écrire `getattr(c, 'mesure', 'absente')`, sans les soulignés", correct: false}
      - {text: "Appeler `getattr(Capteur, '__mesure')`, sur la classe", correct: false}
      - {text: "Remplacer `getattr` par `hasattr`, qui suit la transformation", correct: false}
    answer: |-
      ```python
      class Capteur:
          def __init__(self):
              self._mesure = 21.5


      c = Capteur()
      print(getattr(c, "_mesure", "absente"))   # 21.5
      ```
      Seul le code écrit dans la classe est transformé : l'attribut s'appelle `_Capteur__mesure`, et la chaîne
      `"__mesure"` ne le désigne pas.
  - key: bug-config-debug
    format: bug-fix
    question: |-
      Le mode débogage ne s'active pas : ce programme affiche `False`.
      ```python
      class Config:
          def __init__(self):
              self.__debug = False


      c = Config()
      c.__debug = True
      print(c._Config__debug)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Nommer l'attribut `debug` : il fait partie de l'interface publique", correct: true}
      - {text: "Écrire `c.__debug__ = True` pour suivre la transformation", correct: false}
      - {text: "Écrire `Config.__debug = True`, sur la classe", correct: false}
      - {text: "Déclarer `__debug = True` dans le corps de la classe", correct: false}
    answer: |-
      ```python
      class Config:
          def __init__(self):
              self.debug = False


      c = Config()
      c.debug = True
      ```
      Hors de la classe, `c.__debug = True` n'est pas transformé : il crée un second attribut, `__debug`, à côté de
      `_Config__debug`. Un réglage qu'on modifie de l'extérieur est public.
  - key: bug-methode-sous-classe
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une `AttributeError` : « 'Inscription' object has no attribute '_Inscription__valider' ».
      ```python
      class Formulaire:
          def __valider(self):
              return True


      class Inscription(Formulaire):
          def envoyer(self):
              if self.__valider():
                  print("envoyé")


      Inscription().envoyer()
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renommer la méthode `_valider`, avec un seul souligné", correct: true}
      - {text: "Appeler `super().__valider()` dans `envoyer`", correct: false}
      - {text: "Renommer la méthode `__valider__`, comme `__init__`", correct: false}
      - {text: "Déclarer `envoyer` dans `Formulaire` aussi", correct: false}
    answer: |-
      ```python
      class Formulaire:
          def _valider(self):
              return True


      class Inscription(Formulaire):
          def envoyer(self):
              if self._valider():
                  print("envoyé")
      ```
      `__valider` devient `_Formulaire__valider`, mais l'appel écrit dans `Inscription` cherche
      `_Inscription__valider`, même avec `super()`. Les noms `__x__` sont réservés au langage.
