notion: appelables
lesson: |-
  Une classe qui définit **`__call__`** rend ses instances **appelables** : `obj(args)` exécute
  `type(obj).__call__(obj, args)`. On obtient une fonction qui garde un **état** dans ses attributs.

  ```python
  class Compteur:
      def __init__(self):
          self.appels = 0

      def __call__(self, pas=1):
          self.appels += pas
          return self.appels


  c = Compteur()
  c()
  c(5)          # 6 : l'état persiste entre les appels
  callable(c)   # True
  ```

  - **`callable(x)`** dit si `x` peut être appelé : fonctions, méthodes, classes (appeler une classe crée une
    instance), objets qui définissent `__call__`.
  - **Une classe est appelable** parce que sa métaclasse, `type`, définit `__call__` : c'est lui qui appelle
    `__new__`, puis `__init__`.
  - Comme toute méthode spéciale, `__call__` est **cherchée sur la classe** : l'affecter à une instance ne la rend pas
    appelable.
  - **Usages** : une stratégie configurable (`Remise(0.10)` passée à une fonction qui attend un appelable), une
    fonction avec cache ou compteur, un **décorateur écrit en classe** (`__init__` reçoit la fonction décorée,
    `__call__` remplace ses appels).
  - **Les alternatives** : une fermeture (*closure*) garde aussi un état, en plus court ; `functools.partial` fige des
    arguments. On choisit la classe quand l'état est riche, ou doit se lire et se modifier de l'extérieur
    (`carre.appels`).

  ```python
  class CompterAppels:
      def __init__(self, fonction):
          self.fonction = fonction
          self.appels = 0

      def __call__(self, *args, **kwargs):
          self.appels += 1
          return self.fonction(*args, **kwargs)


  @CompterAppels
  def carre(x):
      return x * x
  ```

  **En entretien** : « `__call__` rend les instances appelables comme des fonctions, avec un état gardé dans leurs
  attributs : un compteur, une stratégie configurée, un décorateur écrit en classe. `callable()` le teste, et les
  classes elles-mêmes sont appelables grâce au `__call__` de `type`. Une fermeture ou `functools.partial` suffit quand
  l'état est simple. »
cards:
  - key: vf-instance-appelable
    format: true-false
    question: "Une instance dont la classe définit `__call__` s'appelle comme une fonction : `obj(3)`."
    truth: true
    answer: "`obj(3)` exécute `type(obj).__call__(obj, 3)` : la méthode reçoit l'instance, puis les arguments."
  - key: vf-classe-callable
    format: true-false
    question: "`callable(int)` renvoie `False`, car `int` est une classe et non une fonction."
    truth: false
    answer: "Une classe est appelable : `int(\"3\")` crée un entier. `callable` répond `True` pour tout ce qu'on peut appeler, classes comprises."
  - key: vf-call-sur-instance
    format: true-false
    question: "Affecter une fonction à `obj.__call__`, sur l'instance, rend `obj` appelable."
    truth: false
    answer: "Python cherche `__call__` sur la classe de l'objet, comme toute méthode spéciale : `obj()` lève toujours une `TypeError`."
  - key: vf-decorateur-classe
    format: true-false
    question: "Une classe qui définit `__call__` peut servir de décorateur de fonction."
    truth: true
    answer: "`@CompterAppels` appelle `CompterAppels(carre)` : l'instance remplace la fonction, et son `__call__` s'exécute à chaque appel de `carre`."
  - key: qcm-callable
    format: multiple-choice
    question: "Que renvoie `callable(obj)` ?"
    choices:
      - {text: "`True` si on peut appeler `obj` avec des parenthèses", correct: true}
      - {text: "`True` si `obj` est une fonction définie par `def`", correct: false}
      - {text: "Le résultat de l'appel `obj()`, sans argument", correct: false}
      - {text: "`True` si `obj` a une méthode nommée `call`", correct: false}
    answer: "Fonctions, méthodes, lambdas, classes et objets qui définissent `__call__` : tous répondent `True`. `callable` n'appelle rien."
  - key: qcm-avantage-etat
    format: multiple-choice
    question: "Quel avantage un objet appelable a-t-il sur une simple fonction ?"
    choices:
      - {text: "Il garde un état dans ses attributs, entre deux appels", correct: true}
      - {text: "Il s'exécute plus vite qu'une fonction ordinaire", correct: false}
      - {text: "Il peut recevoir des arguments nommés", correct: false}
      - {text: "Il peut renvoyer plusieurs valeurs à la fois", correct: false}
    answer: "Un compteur d'appels, un cache, des réglages : l'état vit dans l'objet, lisible de l'extérieur. Une fonction accepte aussi des arguments nommés et renvoie un tuple."
  - key: qcm-equivalent-appel
    format: multiple-choice
    question: "À quoi équivaut `obj(1, 2)` quand la classe de `obj` définit `__call__` ?"
    choices:
      - {text: "`type(obj).__call__(obj, 1, 2)`", correct: true}
      - {text: "`obj.__init__(1, 2)`", correct: false}
      - {text: "`type(obj)(1, 2)`", correct: false}
      - {text: "`obj.__new__(1, 2)`", correct: false}
    answer: "La méthode est prise sur la classe et reçoit l'instance. `type(obj)(1, 2)` créerait une nouvelle instance."
  - key: qcm-alternative-fermeture
    format: multiple-choice
    question: "Quelle alternative à une classe avec `__call__` garde aussi un état entre les appels ?"
    choices:
      - {text: "Une fermeture, qui capture des variables de la fonction englobante", correct: true}
      - {text: "Une `lambda` sans paramètre, définie au niveau du module", correct: false}
      - {text: "Une méthode décorée par `@staticmethod`", correct: false}
      - {text: "Un module importé deux fois dans le programme", correct: false}
    answer: "`def compteur(): n = 0; def suivant(): nonlocal n; n += 1; return n; return suivant`. Plus court qu'une classe, mais l'état n'est pas lisible de l'extérieur."
  - key: code-compteur
    format: code-output
    question: |-
      ```python
      class Compteur:
          def __init__(self):
              self.n = 0

          def __call__(self, pas=1):
              self.n += pas
              return self.n


      c = Compteur()
      c()
      c(5)
      print(c(), callable(c), callable(c.n))
      ```
    answer: "`7 True False` : 1, puis 6, puis 7. L'instance est appelable, son attribut entier ne l'est pas."
    check:
      output: "7 True False"
    choices:
      - {text: "`7 True False`", correct: true}
      - {text: "`1 True False`", correct: false}
      - {text: "`7 True True`", correct: false}
      - {text: "`6 False False`", correct: false}
  - key: code-map-appelable
    format: code-output
    question: |-
      ```python
      class Multiplier:
          def __init__(self, facteur):
              self.facteur = facteur

          def __call__(self, x):
              return x * self.facteur


      print(list(map(Multiplier(3), [1, 2, 3])))
      ```
    answer: "`[3, 6, 9]` : `map` attend un appelable ; l'instance configurée avec 3 en est un."
    check:
      output: "[3, 6, 9]"
    choices:
      - {text: "`[3, 6, 9]`", correct: true}
      - {text: "`[1, 2, 3]`", correct: false}
      - {text: "`[3, 3, 3]`", correct: false}
      - {text: "`[1, 4, 9]`", correct: false}
  - key: code-non-appelable
    format: code-output
    question: |-
      ```python
      class Prix:
          def __init__(self, valeur):
              self.valeur = valeur


      p = Prix(10)
      print(callable(Prix), callable(p))
      p()
      ```
    answer: "`True False`, puis une `TypeError` : « 'Prix' object is not callable ». La classe s'appelle, l'instance non, faute de `__call__`."
    check:
      output: "True False"
      throws: TypeError
    choices:
      - {text: "`True False`, puis une `TypeError`", correct: true}
      - {text: "`False False`, puis une `TypeError`", correct: false}
      - {text: "`True False`, puis `10`", correct: false}
      - {text: "`True True`, puis rien d'autre", correct: false}
  - key: code-decorateur-classe
    format: code-output
    question: |-
      ```python
      class CompterAppels:
          def __init__(self, fonction):
              self.fonction = fonction
              self.appels = 0

          def __call__(self, *args):
              self.appels += 1
              return self.fonction(*args)


      @CompterAppels
      def carre(x):
          return x * x


      carre(2)
      carre(3)
      print(carre(4), carre.appels)
      ```
    answer: "`16 3` : `carre` est désormais une instance de `CompterAppels` ; chaque appel passe par `__call__`, qui compte puis appelle la vraie fonction."
    check:
      output: "16 3"
    choices:
      - {text: "`16 3`", correct: true}
      - {text: "`16 1`", correct: false}
      - {text: "`16 2`", correct: false}
      - {text: "`4 3`", correct: false}
  - key: role-call
    format: course
    question: "À quoi sert la méthode spéciale `__call__` ?"
    choices:
      - {text: "À rendre les instances appelables, comme des fonctions", correct: true}
      - {text: "À appeler le constructeur de la classe parente", correct: false}
      - {text: "À appeler une méthode de la classe par son nom", correct: false}
      - {text: "À exécuter du code à chaque lecture d'un attribut", correct: false}
    answer: "`obj(args)` appelle `__call__`. Le constructeur parent s'appelle par `super().__init__()`, et la lecture d'attribut passe par `__getattribute__`."
  - key: classe-appelable
    format: course
    question: "Pourquoi une classe est-elle elle-même appelable ?"
    choices:
      - {text: "Sa métaclasse, `type`, définit `__call__`, qui crée l'instance", correct: true}
      - {text: "Parce que toute classe hérite d'une méthode `__init__`", correct: false}
      - {text: "Parce que Python transforme chaque classe en fonction", correct: false}
      - {text: "Elle ne l'est pas : `Classe()` est une syntaxe spéciale", correct: false}
    answer: "Une classe est un objet, instance de `type`. `Point(1, 2)` appelle `type.__call__`, qui appelle `Point.__new__`, puis `__init__`."
  - key: classe-ou-fermeture
    format: course
    question: "Quand préférer un objet appelable à une fermeture ?"
    choices:
      - {text: "Quand l'état est riche, ou doit être lu et modifié de l'extérieur", correct: true}
      - {text: "Toujours : une fermeture ne peut garder aucun état entre deux appels", correct: false}
      - {text: "Quand la fonction n'a besoin d'aucun état entre ses appels", correct: false}
      - {text: "Quand la fonction ne doit être appelée qu'une seule fois", correct: false}
    answer: "Une fermeture garde un état, mais caché. Une classe expose ses attributs (`carre.appels`), et peut offrir d'autres méthodes (`reinitialiser()`)."
  - key: strategie-configurable
    format: course
    question: "Comment passer une remise de 10 % à une fonction `facturer(panier, regle)` qui appelle `regle(prix)` ?"
    choices:
      - {text: "Une instance `Remise(0.10)`, dont la classe définit `__call__`", correct: true}
      - {text: "La classe `Remise` elle-même, sans l'instancier", correct: false}
      - {text: "La chaîne `\"Remise(0.10)\"`, évaluée par la fonction", correct: false}
      - {text: "Le résultat de `Remise(0.10).__init__()`", correct: false}
    answer: "L'instance porte le taux, et `regle(prix)` appelle son `__call__`. Passer la classe ferait `Remise(prix)`, une nouvelle instance ; `__init__` renvoie `None`."
