notion: duck-typing
lesson: |-
  « Si ça marche comme un canard et que ça cancane comme un canard, c'est un canard. » Python ne demande pas à un
  objet **ce qu'il est**, mais **ce qu'il sait faire** : une fonction accepte tout objet qui a les méthodes dont elle
  se sert.

  ```python
  import io


  def ecrire_rapport(sortie, lignes):
      for ligne in lignes:
          sortie.write(ligne + "\n")     # seule exigence : une méthode write


  tampon = io.StringIO()
  ecrire_rapport(tampon, ["a", "b"])     # marche avec un fichier ouvert, un StringIO, un faux objet de test...
  print(tampon.getvalue())
  ```

  **Partout dans le langage.** Les fonctions natives reposent sur des **protocoles**, des méthodes attendues :

  | Ce que tu écris | Ce qu'il faut à l'objet |
  |---|---|
  | `for x in obj` | `__iter__` (ou `__getitem__`) |
  | `len(obj)` | `__len__` |
  | `x in obj` | `__contains__` (sinon un parcours) |
  | `with obj:` | `__enter__` et `__exit__` |
  | `json.dump(donnees, f)` | une méthode `write` sur `f` |

  **Le style qui va avec : EAFP** (*it's easier to ask forgiveness than permission*). On essaie l'appel et l'on
  rattrape l'exception, plutôt que de vérifier le type avant :

  ```python
  try:
      taille = len(obj)
  except TypeError:
      taille = None
  ```

  **Ses limites.** Rien ne vérifie, avant l'exécution, qu'un objet a la bonne méthode : l'erreur apparaît à l'appel,
  parfois loin de sa cause (`AttributeError: 'NoneType' object has no attribute 'read'`). Deux outils aident :

  - **`typing.Protocol`** décrit les méthodes attendues ; un vérificateur de types (mypy, pyright) contrôle qu'un objet
    les a, **sans qu'il hérite** du protocole. C'est le **typage structurel**, le duck typing vérifié.
  - **`collections.abc`** (`Iterable`, `Sized`, `Mapping`) permet un `isinstance` qui teste un comportement, et non une
    classe concrète.

  Le contraire est le **typage nominal** (Java) : un objet convient parce que sa classe hérite du type attendu, ou le
  déclare.

  **En entretien** : « Le duck typing juge un objet à ses méthodes, pas à son type : une fonction qui appelle `write`
  accepte tout objet doté de `write`. Il s'accompagne du style EAFP. Pour le vérifier statiquement sans imposer
  d'héritage, on décrit le comportement attendu avec `typing.Protocol`. »
cards:
  - key: principe-duck-typing
    format: course
    question: "Que veut dire le duck typing ?"
    choices:
      - {text: "Un objet convient s'il a les méthodes attendues, quel que soit son type", correct: true}
      - {text: "Un objet convient s'il hérite de la classe que la fonction attend", correct: false}
      - {text: "Python devine le type d'une variable d'après sa première valeur", correct: false}
      - {text: "Les types sont vérifiés à la compilation, d'après les annotations", correct: false}
    answer: "Une fonction qui appelle `obj.write(...)` accepte tout objet doté de `write`. L'héritage n'est pas exigé : c'est le comportement qui compte."
  - key: len-objet
    format: course
    question: "Que faut-il à l'objet de ta classe pour que `len(obj)` fonctionne ?"
    choices:
      - {text: "Une méthode `__len__` qui renvoie un entier", correct: true}
      - {text: "Hériter de `list`, de `tuple` ou de `str`", correct: false}
      - {text: "Une méthode `length` qui renvoie un entier", correct: false}
      - {text: "Un attribut `size`, lu par Python", correct: false}
    answer: "`len(obj)` appelle `obj.__len__()`. Toute classe qui le définit devient « mesurable », sans hériter de rien."
  - key: apport-protocol
    format: course
    question: "Qu'apporte `typing.Protocol` au duck typing ?"
    choices:
      - {text: "Il décrit les méthodes attendues, contrôlées par mypy sans exiger d'héritage", correct: true}
      - {text: "Il oblige les classes à hériter du protocole pour être acceptées", correct: false}
      - {text: "Il vérifie, à l'exécution, chaque appel de méthode", correct: false}
      - {text: "Il convertit l'objet reçu vers le type attendu par la fonction", correct: false}
    answer: "Un `Protocol` nomme le comportement attendu. Le vérificateur de types accepte toute classe qui a ces méthodes : c'est le typage structurel."
  - key: revers-duck-typing
    format: course
    question: "Quel est le revers du duck typing ?"
    choices:
      - {text: "Une méthode manquante ne se découvre qu'à l'exécution, au moment de l'appel", correct: true}
      - {text: "Il interdit de passer un objet d'une classe qui n'hérite de rien", correct: false}
      - {text: "Il ralentit chaque appel, à cause des vérifications de type", correct: false}
      - {text: "Il empêche d'écrire une fonction qui accepte plusieurs types", correct: false}
    answer: "Sans vérification préalable, l'`AttributeError` arrive à l'appel, parfois loin de l'endroit où le mauvais objet a été créé. Les annotations et un `Protocol` la font apparaître plus tôt."
  - key: vf-for-iterable
    format: true-false
    question: "Une boucle `for` accepte tout objet qui fournit un itérateur, sans exiger qu'il hérite d'une classe particulière."
    truth: true
    answer: "`for` appelle `iter(obj)`, donc `__iter__` (ou, à défaut, `__getitem__` avec des indices 0, 1, 2...). C'est un protocole, pas un type."
  - key: vf-annotations-verifiees
    format: true-false
    question: "À l'appel d'une fonction, Python vérifie que les arguments ont le type de ses annotations."
    truth: false
    answer: "Les annotations ne sont pas vérifiées à l'exécution : seuls des outils comme mypy les contrôlent, avant."
  - key: vf-json-dump
    format: true-false
    question: "`json.dump(donnees, f)` accepte tout objet `f` doté d'une méthode `write`, pas seulement un fichier ouvert."
    truth: true
    answer: "`json.dump` ne fait qu'appeler `f.write(...)` : un `io.StringIO` ou un faux objet de test conviennent."
  - key: vf-heriter-protocol
    format: true-false
    question: "Une classe doit hériter d'un `typing.Protocol` pour le satisfaire."
    truth: false
    answer: "C'est tout l'intérêt d'un protocole : une classe le satisfait dès qu'elle a les méthodes décrites, sans le déclarer."
  - key: qcm-objet-write
    format: multiple-choice
    question: "Une fonction écrit son rapport avec `sortie.write(texte)`. Quels objets peut-elle recevoir ?"
    choices:
      - {text: "Tout objet qui a une méthode `write`, comme `io.StringIO`", correct: true}
      - {text: "Seulement un fichier renvoyé par `open`", correct: false}
      - {text: "Seulement une sous-classe de `io.TextIOBase`", correct: false}
      - {text: "Seulement un objet annoté avec le type `TextIO`", correct: false}
    answer: "La fonction n'utilise que `write` : un fichier, un `StringIO`, une socket enveloppée ou un faux objet de test conviennent."
  - key: qcm-style-eafp
    format: multiple-choice
    question: "Quel style le duck typing encourage-t-il ?"
    choices:
      - {text: "Essayer l'appel, et rattraper l'exception s'il échoue", correct: true}
      - {text: "Vérifier le type exact avec `type(x) is ...` avant l'appel", correct: false}
      - {text: "Convertir chaque argument vers le type attendu", correct: false}
      - {text: "Déclarer une interface que chaque classe doit implémenter", correct: false}
    answer: "C'est l'EAFP : demander pardon plutôt que la permission. Tester le type exact refuserait des objets qui marcheraient très bien."
  - key: qcm-tester-iterable
    format: multiple-choice
    question: "Comment vérifies-tu qu'un objet est itérable, sans exiger un type concret ?"
    choices:
      - {text: "`isinstance(obj, collections.abc.Iterable)`", correct: true}
      - {text: "`type(obj) in (list, tuple)`", correct: false}
      - {text: "`isinstance(obj, list)`", correct: false}
      - {text: "`hasattr(obj, '__len__')`", correct: false}
    answer: "`Iterable` reconnaît toute classe qui définit `__iter__`, sans qu'elle en hérite. Un générateur est itérable mais n'a pas de `__len__`."
  - key: qcm-operateur-in
    format: multiple-choice
    question: "Quelle méthode `x in obj` appelle-t-il d'abord, pour répondre sans parcourir l'objet ?"
    choices:
      - {text: "`__contains__`", correct: true}
      - {text: "`__in__`", correct: false}
      - {text: "`contains`", correct: false}
      - {text: "`__has__`", correct: false}
    answer: "Sans `__contains__`, Python se rabat sur un parcours avec `__iter__`. Encore un protocole : aucune classe parente n'est exigée."
  - key: situation-faux-client
    format: scenario
    question: |-
      Ta fonction `envoyer(rapport, client)` n'appelle que `client.post(url, donnees)`. Pour la tester sans réseau, que
      fais-tu ?
    choices:
      - {text: "Je lui passe un faux client, dont la méthode `post` enregistre l'appel", correct: true}
      - {text: "Je crée une sous-classe du vrai client, obligatoire pour être accepté", correct: false}
      - {text: "Je modifie la fonction pour qu'elle teste `type(client)`", correct: false}
      - {text: "Je lance un vrai serveur local, seul moyen de tester l'appel", correct: false}
    answer: "Grâce au duck typing, tout objet doté de `post` convient. Le faux client garde les appels reçus, que le test vérifie ensuite."
  - key: situation-revue-isinstance-list
    format: scenario
    question: |-
      En revue, tu lis `if not isinstance(source, list): raise TypeError(...)` au début d'une fonction qui ne fait que
      parcourir `source`. Que proposes-tu ?
    choices:
      - {text: "Accepter tout itérable : un tuple, un générateur ou un ensemble marcheraient", correct: true}
      - {text: "Garder le test : seule une liste garantit qu'on peut la parcourir", correct: false}
      - {text: "Remplacer le test par `type(source) is list`, plus strict", correct: false}
      - {text: "Convertir chaque source en liste, puis lever l'erreur quand même", correct: false}
    answer: "La fonction n'a besoin que de parcourir : exiger une liste refuse sans raison des objets qui conviennent. Une annotation `Iterable[...]` documente l'attente."
  - key: situation-protocol-ecrire
    format: scenario
    question: |-
      Ton équipe veut que mypy vérifie qu'on passe à `exporter(cible)` un objet doté d'une méthode `ecrire(lignes)`,
      sans imposer d'héritage aux classes existantes. Que choisis-tu ?
    choices:
      - {text: "Un `typing.Protocol` qui déclare `ecrire`", correct: true}
      - {text: "Une classe abstraite dont toutes doivent hériter", correct: false}
      - {text: "Un test `hasattr(cible, 'ecrire')` dans la fonction", correct: false}
      - {text: "Une annotation `cible: object`, la plus souple", correct: false}
    answer: "Le protocole décrit le comportement ; mypy accepte toute classe qui a `ecrire`, sans toucher aux classes existantes. `hasattr` n'agit qu'à l'exécution."
  - key: situation-nonetype-read
    format: scenario
    question: |-
      En production, « AttributeError: 'NoneType' object has no attribute 'read' » remonte d'une fonction qui attend
      un fichier. Qu'en déduis-tu ?
    choices:
      - {text: "Un appelant lui a passé `None`, et rien ne l'a vérifié avant l'appel de `read`", correct: true}
      - {text: "Le fichier était vide, et `read` a échoué en arrivant au bout", correct: false}
      - {text: "La fonction aurait dû hériter de `io.IOBase` pour lire un fichier", correct: false}
      - {text: "Python a perdu le type du fichier en le passant à la fonction", correct: false}
    answer: "C'est le revers du duck typing : l'objet n'est jugé qu'à l'appel. Il faut remonter à l'appelant ; une annotation et mypy auraient signalé un `None` possible."
  - key: definition-protocole
    format: definition
    question: "Qu'est-ce qu'un protocole, en Python ?"
    choices:
      - {text: "Un ensemble de méthodes qu'un objet doit avoir pour jouer un rôle", correct: true}
      - {text: "Une classe parente dont il faut hériter pour jouer un rôle", correct: false}
      - {text: "Un format d'échange de données entre deux programmes", correct: false}
      - {text: "Un module qui vérifie les types des arguments à l'exécution", correct: false}
    answer: "Le protocole d'itération (`__iter__`), celui des gestionnaires de contexte (`__enter__`, `__exit__`)... `typing.Protocol` permet d'en écrire et de les faire vérifier."
  - key: definition-typage-structurel
    format: definition
    question: "Qu'est-ce que le typage structurel ?"
    choices:
      - {text: "Un type compatible par les méthodes qu'il possède, non par son héritage", correct: true}
      - {text: "Un type compatible parce qu'il hérite de la classe attendue", correct: false}
      - {text: "Un type déduit de la structure du fichier source", correct: false}
      - {text: "Un type qui décrit la disposition des données en mémoire", correct: false}
    answer: "C'est le duck typing vérifié par un outil : `typing.Protocol` en Python, les interfaces de Go. Le contraire est le typage nominal."
  - key: definition-typage-nominal
    format: definition
    question: "Qu'est-ce que le typage nominal ?"
    choices:
      - {text: "Un type compatible parce qu'il hérite du type attendu, ou le déclare", correct: true}
      - {text: "Un type compatible par les seules méthodes qu'il possède", correct: false}
      - {text: "Un type nommé par une annotation, jamais vérifié", correct: false}
      - {text: "Un type dont l'interpréteur choisit lui-même le nom", correct: false}
    answer: "C'est le modèle de Java : une classe doit déclarer `implements Comparable` pour être comparable. En Python, l'héritage d'une classe abstraite en est l'équivalent."
  - key: definition-objet-fichier
    format: definition
    question: "Qu'est-ce qu'un « objet fichier » (file-like object) ?"
    choices:
      - {text: "Un objet qui offre `read`, `write` ou `readline`, comme un fichier", correct: true}
      - {text: "Un objet qui hérite de la classe `file` du module `io`", correct: false}
      - {text: "Un objet enregistré sur le disque par `pickle`", correct: false}
      - {text: "Un fichier ouvert en mode binaire avec `open`", correct: false}
    answer: "`io.StringIO`, `io.BytesIO`, une réponse HTTP, `sys.stdout`... Toute fonction qui lit ou écrit un fichier les accepte : c'est du duck typing."
