notion: enum
lesson: |-
  Une **énumération** est un ensemble fermé de valeurs nommées : les statuts d'une commande, les jours de la semaine.
  Mieux que des chaînes libres (`"payee"`, `"payée"`, `"PAYE"`...), elle refuse les fautes de frappe et documente les
  valeurs possibles.

  ```python
  from enum import Enum, StrEnum, auto


  class Statut(Enum):
      EN_ATTENTE = 1
      PAYEE = 2
      EXPEDIEE = 3

      def est_terminee(self):           # une énumération peut avoir des méthodes
          return self is Statut.EXPEDIEE


  s = Statut.PAYEE
  s.name, s.value          # ('PAYEE', 2)
  Statut(2)                # Statut.PAYEE : par la valeur
  Statut["PAYEE"]          # Statut.PAYEE : par le nom
  list(Statut)             # les trois membres, dans l'ordre de définition
  ```

  - **Chaque membre est unique** : on le compare avec `is` (ou `==`). Un membre ne se réaffecte pas
    (`AttributeError: cannot reassign member 'PAYEE'`), et une énumération qui a des membres ne se sous-classe pas.
  - **Un `Enum` n'est pas égal à sa valeur** : `Statut.PAYEE == 2` vaut `False`. Pour une valeur lue en base, on
    convertit d'abord : `Statut(valeur)`, qui lève `ValueError` pour une valeur inconnue.
  - **L'affichage** : `str(Statut.PAYEE)` vaut `'Statut.PAYEE'`, son `repr` `<Statut.PAYEE: 2>`. Pour la valeur seule,
    `.value`.
  - **Les alias** : deux membres de même valeur ; le second n'est qu'un autre nom du premier, absent du parcours.
    `@enum.unique` les interdit.
  - **`auto()`** choisit la valeur : 1, 2, 3... pour un `Enum`, le nom en minuscules pour un `StrEnum`.

  | Classe | Ses membres sont aussi | Exemple |
  |---|---|---|
  | `Enum` | rien d'autre | `Statut.PAYEE == 2` vaut `False` |
  | `IntEnum` | des `int` | `Priorite.HAUTE == 3`, comparable aux entiers |
  | `StrEnum` (3.11) | des `str` | `Role.ADMIN == "admin"`, `f"{Role.ADMIN}"` donne `admin` |
  | `Flag` | des drapeaux combinables | `Droit.LIRE \| Droit.ECRIRE` |

  `StrEnum` est pratique avec du JSON ou une base de données, au prix d'une comparaison possible avec n'importe quelle
  chaîne.

  **En entretien** : « Une énumération est un ensemble fermé de constantes nommées, uniques, qu'on compare avec `is`.
  `Couleur(1)` cherche par la valeur, `Couleur["ROUGE"]` par le nom, `.name` et `.value` les donnent. Un `Enum` n'est
  pas égal à sa valeur ; `IntEnum` et `StrEnum` le sont, pour dialoguer avec des entiers ou du texte. `auto()` choisit
  les valeurs, et `@unique` interdit les alias. »
cards:
  - key: vf-enum-egal-valeur
    format: true-false
    question: "`Couleur.ROUGE == 1` vaut `True` quand `Couleur` est un `Enum` dont le membre `ROUGE` vaut 1."
    truth: false
    answer: "Un membre d'`Enum` n'est égal qu'à lui-même. Il faut comparer `Couleur.ROUGE.value == 1`, ou convertir : `Couleur(1) is Couleur.ROUGE`. `IntEnum` donnerait `True`."
  - key: vf-strenum-chaine
    format: true-false
    question: "Un membre de `StrEnum` est aussi une chaîne : `Statut.ACTIF == \"actif\"` peut valoir `True`."
    truth: true
    answer: "`StrEnum` (Python 3.11) hérite de `str` : ses membres se comparent aux chaînes et s'affichent par leur valeur."
  - key: vf-alias-parcours
    format: true-false
    question: "Deux membres d'un `Enum` de même valeur apparaissent tous les deux quand on parcourt l'énumération."
    truth: false
    answer: "Le second est un alias du premier : `Etat.ACTIF is Etat.OUVERT`, et le parcours ne montre que le premier. `@enum.unique` refuse les alias."
  - key: vf-membre-unique
    format: true-false
    question: "Chaque membre d'une énumération est un objet unique : on peut le comparer avec `is`."
    truth: true
    answer: "`Statut(2) is Statut.PAYEE` vaut `True` : la recherche renvoie toujours le même objet. `is` est la comparaison recommandée."
  - key: qcm-par-valeur
    format: multiple-choice
    question: "Comment obtenir le membre de l'énumération `Couleur` qui a la valeur `2` ?"
    choices:
      - {text: "`Couleur(2)`", correct: true}
      - {text: "`Couleur[2]`", correct: false}
      - {text: "`Couleur.value(2)`", correct: false}
      - {text: "`Couleur.get(2)`", correct: false}
    answer: "L'appel cherche par la valeur, les crochets par le nom. `Couleur(5)` lève `ValueError: 5 is not a valid Couleur`."
  - key: qcm-par-nom
    format: multiple-choice
    question: "Comment obtenir le membre de `Couleur` à partir de son nom, la chaîne `\"VERT\"` ?"
    choices:
      - {text: "`Couleur[\"VERT\"]`", correct: true}
      - {text: "`Couleur(\"VERT\")`", correct: false}
      - {text: "`Couleur.VERT.name`", correct: false}
      - {text: "`Couleur.get(\"VERT\")`", correct: false}
    answer: "Les crochets cherchent par le nom, et lèvent `KeyError` s'il n'existe pas. `Couleur.VERT.name` donne la chaîne, pas le membre."
  - key: qcm-auto-strenum
    format: multiple-choice
    question: "Que vaut `auto()` pour un membre `EN_COURS` d'une `StrEnum` ?"
    choices:
      - {text: "`\"en_cours\"`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`\"EN_COURS\"`", correct: false}
      - {text: "`\"En cours\"`", correct: false}
    answer: "Pour une `StrEnum`, `auto()` donne le nom en minuscules. Pour un `Enum`, il numérote à partir de 1."
  - key: qcm-unique
    format: multiple-choice
    question: "Quel décorateur refuse deux membres de même valeur dans une énumération ?"
    choices:
      - {text: "`@enum.unique`", correct: true}
      - {text: "`@enum.distinct`", correct: false}
      - {text: "`@enum.strict`", correct: false}
      - {text: "`@enum.single`", correct: false}
    answer: "`@unique` lève une `ValueError` à la définition de la classe si un alias existe. Les trois autres n'existent pas."
  - key: trous-classe-enum
    format: fill-in
    question: |-
      Complète pour définir une énumération :
      ```python
      from enum import Enum


      class Statut(___):
          ACTIF = 1
          INACTIF = 2
      ```
    blanks:
      - - Enum
    answer: "On hérite d'`Enum` (ou d'`IntEnum`, `StrEnum`, `Flag`). Chaque attribut de la classe devient un membre."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète pour laisser Python choisir les valeurs :
      ```python
      from enum import Enum, auto


      class Couleur(Enum):
          ROUGE = ___()
          VERT = auto()
      ```
    blanks:
      - - auto
    answer: "`auto()` numérote les membres d'un `Enum` à partir de 1. Utile quand la valeur n'a pas d'importance."
  - key: trous-value
    format: fill-in
    question: |-
      Complète pour afficher la valeur du membre, `1` :
      ```python
      print(Couleur.ROUGE.___)
      ```
    blanks:
      - - value
    answer: "`.value` donne la valeur, `.name` le nom. `print(Couleur.ROUGE)` afficherait `Couleur.ROUGE`."
  - key: trous-name
    format: fill-in
    question: |-
      Complète pour afficher le nom du membre, `ROUGE` :
      ```python
      print(Couleur.ROUGE.___)
      ```
    blanks:
      - - name
    answer: "`.name` est la chaîne du nom du membre, telle qu'écrite dans la classe."
  - key: code-nom-valeur
    format: code-output
    question: |-
      ```python
      from enum import Enum


      class Jour(Enum):
          LUNDI = 1
          MARDI = 2


      print(Jour(2).name, Jour["LUNDI"].value, len(Jour))
      ```
    answer: "`MARDI 1 2` : `Jour(2)` cherche par la valeur, `Jour[\"LUNDI\"]` par le nom, et `len` compte les membres."
    check:
      output: "MARDI 1 2"
    choices:
      - {text: "`MARDI 1 2`", correct: true}
      - {text: "`LUNDI 1 2`", correct: false}
      - {text: "`MARDI LUNDI 2`", correct: false}
      - {text: "`2 1 2`", correct: false}
  - key: code-str-repr
    format: code-output
    question: |-
      ```python
      from enum import Enum


      class Niveau(Enum):
          BAS = "bas"


      print(Niveau.BAS, repr(Niveau.BAS))
      ```
    answer: "`str` d'un membre d'`Enum` donne `Classe.NOM`, son `repr` ajoute la valeur entre chevrons."
    check:
      output: "Niveau.BAS <Niveau.BAS: 'bas'>"
    choices:
      - {text: "`Niveau.BAS <Niveau.BAS: 'bas'>`", correct: true}
      - {text: "`bas <Niveau.BAS: 'bas'>`", correct: false}
      - {text: "`Niveau.BAS Niveau.BAS`", correct: false}
      - {text: "`bas 'bas'`", correct: false}
  - key: code-alias
    format: code-output
    question: |-
      ```python
      from enum import Enum


      class Etat(Enum):
          OUVERT = 1
          ACTIF = 1
          FERME = 2


      print([e.name for e in Etat], Etat.ACTIF is Etat.OUVERT)
      ```
    answer: "`['OUVERT', 'FERME'] True` : `ACTIF` a la même valeur qu'`OUVERT`, c'est un alias, absent du parcours."
    check:
      output: "['OUVERT', 'FERME'] True"
    choices:
      - {text: "`['OUVERT', 'FERME'] True`", correct: true}
      - {text: "`['OUVERT', 'ACTIF', 'FERME'] False`", correct: false}
      - {text: "`['OUVERT', 'ACTIF', 'FERME'] True`", correct: false}
      - {text: "`['ACTIF', 'FERME'] True`", correct: false}
  - key: code-strenum
    format: code-output
    question: |-
      ```python
      from enum import StrEnum, auto


      class Statut(StrEnum):
          EN_ATTENTE = auto()
          PAYE = auto()


      print(Statut.PAYE == "paye", f"{Statut.EN_ATTENTE}", Statut("paye").name)
      ```
    answer: "`True en_attente PAYE` : `auto()` donne le nom en minuscules, un membre de `StrEnum` est une chaîne et s'affiche par sa valeur."
    check:
      output: "True en_attente PAYE"
    choices:
      - {text: "`True en_attente PAYE`", correct: true}
      - {text: "`False Statut.EN_ATTENTE PAYE`", correct: false}
      - {text: "`True EN_ATTENTE paye`", correct: false}
      - {text: "`False 1 PAYE`", correct: false}
  - key: bug-chaine-contre-membre
    format: bug-fix
    question: |-
      Ce programme affiche « accès limité », alors que l'utilisateur est administrateur :
      ```python
      from enum import Enum


      class Role(Enum):
          ADMIN = "admin"
          LECTEUR = "lecteur"


      role_lu = "admin"  # lu dans la base de données
      if role_lu == Role.ADMIN:
          print("accès complet")
      else:
          print("accès limité")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Convertir d'abord la chaîne : `Role(role_lu) is Role.ADMIN`", correct: true}
      - {text: "Comparer avec `Role.ADMIN.name`, qui vaut `\"admin\"`", correct: false}
      - {text: "Comparer avec `is` au lieu de `==`, plus strict", correct: false}
      - {text: "Écrire `str(Role.ADMIN)`, qui donne la valeur", correct: false}
    answer: |-
      ```python
      if Role(role_lu) is Role.ADMIN:
          print("accès complet")
      ```
      Un membre d'`Enum` n'est jamais égal à une chaîne. On convertit la valeur lue (une `ValueError` signale une
      valeur inconnue), ou on hérite de `StrEnum`. `.name` vaut `"ADMIN"`, et `str()` donne `Role.ADMIN`.
  - key: bug-nom-au-lieu-de-valeur
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « ValueError: 'M' is not a valid Taille » :
      ```python
      from enum import Enum


      class Taille(Enum):
          S = "s"
          M = "m"
          L = "l"


      print(Taille("M"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Chercher par le nom avec `Taille[\"M\"]`, ou par la valeur avec `Taille(\"m\")`", correct: true}
      - {text: "Ajouter `@enum.unique` au-dessus de la classe `Taille`", correct: false}
      - {text: "Hériter d'`IntEnum`, qui accepte les noms en argument", correct: false}
      - {text: "Écrire `Taille.get(\"M\")`, qui ne lève jamais d'erreur", correct: false}
    answer: |-
      ```python
      print(Taille["M"])   # Taille.M
      ```
      L'appel `Taille(...)` cherche par la valeur, ici `"m"` en minuscules. Les crochets cherchent par le nom. Une
      énumération n'a pas de méthode `get`.
  - key: bug-reaffecter-membre
    format: bug-fix
    question: |-
      Pour la hausse de la TVA, ton collègue a ajouté une ligne. Le programme s'arrête sur « AttributeError: cannot
      reassign member 'NORMAL' » :
      ```python
      from enum import Enum


      class Tva(Enum):
          NORMAL = 0.20
          REDUIT = 0.055


      Tva.NORMAL = 0.21
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Changer la valeur dans la définition de la classe : un membre est constant", correct: true}
      - {text: "Écrire `Tva.NORMAL.value = 0.21`, qui modifie la valeur seule", correct: false}
      - {text: "Créer un membre `NORMAL` dans une sous-classe de `Tva`", correct: false}
      - {text: "Appeler `setattr(Tva, \"NORMAL\", 0.21)`, qui contourne la règle", correct: false}
    answer: |-
      ```python
      class Tva(Enum):
          NORMAL = 0.21
          REDUIT = 0.055
      ```
      Les membres d'une énumération sont des constantes : on ne les réaffecte pas, et une énumération qui a des
      membres ne se sous-classe pas. Un taux qui change souvent irait mieux dans une configuration.
  - key: bug-affichage-json
    format: bug-fix
    question: |-
      L'API attend `statut=actif`, mais ce programme écrit `statut=Statut.ACTIF` :
      ```python
      from enum import Enum


      class Statut(Enum):
          ACTIF = "actif"


      print(f"statut={Statut.ACTIF}")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `{Statut.ACTIF.value}`, ou hériter de `StrEnum`", correct: true}
      - {text: "Écrire `{Statut.ACTIF.name}`, qui donne la valeur", correct: false}
      - {text: "Écrire `{Statut.ACTIF!r}`, plus précis", correct: false}
      - {text: "Hériter d'`IntEnum`, qui affiche la valeur", correct: false}
    answer: |-
      ```python
      print(f"statut={Statut.ACTIF.value}")
      ```
      Un membre d'`Enum` s'affiche `Classe.NOM`. `.value` donne `"actif"` ; une `StrEnum` s'afficherait directement
      par sa valeur. `.name` vaut `"ACTIF"`, et `!r` donne `<Statut.ACTIF: 'actif'>`.
  - key: pourquoi-enum
    format: course
    question: "Pourquoi une énumération plutôt que des constantes chaînes comme `\"actif\"` ?"
    choices:
      - {text: "Un ensemble fermé de valeurs nommées, qu'une faute de frappe ne contourne pas", correct: true}
      - {text: "Une énumération occupe moins de mémoire qu'une chaîne de caractères", correct: false}
      - {text: "Les chaînes ne peuvent pas être comparées entre elles avec `==`", correct: false}
      - {text: "Une énumération se convertit toute seule en JSON, sans aucun code", correct: false}
    answer: "`Statut.ACTF` lève une `AttributeError` tout de suite, alors que `\"actf\"` passerait inaperçu. Et un `Enum` ordinaire ne se sérialise pas en JSON sans aide."
  - key: intenum-ou-enum
    format: course
    question: "Quelle différence entre `Enum` et `IntEnum` ?"
    choices:
      - {text: "Un membre d'`IntEnum` est aussi un `int`, comparable aux entiers", correct: true}
      - {text: "`IntEnum` numérote ses membres à partir de 0, `Enum` à partir de 1", correct: false}
      - {text: "`Enum` n'accepte aucune valeur entière pour ses membres", correct: false}
      - {text: "`IntEnum` interdit les alias, contrairement à `Enum`", correct: false}
    answer: "`IntEnum` sert à dialoguer avec du code qui manipule des entiers (codes d'état, protocoles). Pour le reste, `Enum` est plus sûr : un membre n'y est jamais confondu avec un nombre."
  - key: methodes-dans-enum
    format: course
    question: "Une énumération peut-elle avoir des méthodes ?"
    choices:
      - {text: "Oui : ses membres sont des instances de la classe, comme les autres", correct: true}
      - {text: "Non : une énumération ne peut contenir que ses membres", correct: false}
      - {text: "Oui, mais seulement des méthodes décorées par `@staticmethod`", correct: false}
      - {text: "Non : toute fonction définie dans la classe devient un membre", correct: false}
    answer: "`Statut.PAYEE.est_terminee()` : la méthode reçoit le membre comme `self`. Les fonctions définies dans la classe restent des méthodes, pas des membres."
  - key: sous-classer-enum
    format: course
    question: "Peut-on hériter d'une énumération qui a déjà des membres ?"
    choices:
      - {text: "Non : une `TypeError` le refuse, pour garder l'ensemble fermé", correct: true}
      - {text: "Oui : la sous-classe ajoute ses membres à ceux du parent", correct: false}
      - {text: "Oui, mais les membres du parent sont alors perdus", correct: false}
      - {text: "Non, sauf si le parent est décoré par `@enum.unique`", correct: false}
    answer: "`TypeError: <enum 'B'> cannot extend <enum 'A'>`. Une énumération sans membre, qui n'apporte que des méthodes, peut servir de base."
