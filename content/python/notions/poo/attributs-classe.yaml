notion: attributs-classe
lesson: |-
  Un attribut peut appartenir à **la classe** ou à **chaque objet**.

  ```python
  class Joueur:
      niveau_max = 99            # attribut de classe : un seul, partagé
      total = 0

      def __init__(self, nom):
          self.nom = nom         # attribut d'instance : un par objet
          self.objets = []       # une liste propre à chaque joueur
          Joueur.total += 1      # on modifie l'attribut de classe par la classe
  ```

  **La recherche d'un attribut.** `obj.x` cherche d'abord dans l'objet (`obj.__dict__`), puis dans sa classe, puis dans
  les classes parentes. Un attribut de classe se lit donc aussi par un objet : `joueur.niveau_max` vaut 99.

  **L'affectation, elle, écrit dans l'objet.** `joueur.niveau_max = 50` crée un attribut d'instance qui **masque**
  celui de la classe, pour ce seul objet. Même chose pour `self.total += 1` : Python lit `Joueur.total`, ajoute 1, et
  range le résultat dans l'objet. Le compteur de la classe ne bouge pas. Pour le modifier, on passe par la classe :
  `Joueur.total += 1` (ou `type(self).total += 1`).

  **Le piège de la liste partagée.** Un attribut de classe **mutable** est partagé par tous les objets :

  ```python
  class Equipe:
      membres = []                 # une seule liste pour toutes les équipes

      def ajouter(self, nom):
          self.membres.append(nom) # modifie la liste de la classe


  rouge, bleue = Equipe(), Equipe()
  rouge.ajouter("Ana")
  print(bleue.membres)             # ['Ana']
  ```

  `append` ne réaffecte rien : il modifie l'objet trouvé dans la classe. La correction : créer la liste dans
  `__init__`, `self.membres = []`.

  | Usage | Où le ranger |
  |---|---|
  | une constante commune (`TVA`, `NIVEAU_MAX`) | attribut de classe |
  | un compteur de toutes les instances | attribut de classe, modifié par `Classe.x` |
  | une donnée propre à l'objet, surtout mutable (liste, dict) | attribut d'instance, dans `__init__` |

  **En entretien** : « Un attribut de classe est partagé ; un attribut d'instance appartient à l'objet. La lecture
  cherche dans l'objet puis dans la classe, mais l'affectation écrit toujours dans l'objet. Une liste déclarée dans le
  corps de la classe est partagée par toutes les instances : une donnée mutable propre à l'objet se crée dans
  `__init__`. »
cards:
  - key: difference-classe-instance
    format: course
    question: "Quelle différence entre un attribut de classe et un attribut d'instance ?"
    choices:
      - {text: "L'attribut de classe est partagé par tous les objets ; l'autre est propre à chacun", correct: true}
      - {text: "L'attribut de classe est constant ; l'autre peut changer à tout moment", correct: false}
      - {text: "L'attribut de classe est privé ; l'autre est visible de l'extérieur", correct: false}
      - {text: "L'attribut de classe se déclare dans `__init__` ; l'autre dans le corps", correct: false}
    answer: "Un attribut de classe est déclaré dans le corps de la classe et existe une fois ; un attribut d'instance est créé par `self.x = ...` dans chaque objet."
  - key: ordre-recherche
    format: course
    question: "Dans quel ordre Python cherche-t-il `obj.attribut` ?"
    choices:
      - {text: "Dans l'objet, puis dans sa classe, puis dans les classes parentes", correct: true}
      - {text: "Dans la classe, puis dans l'objet, puis dans les classes parentes", correct: false}
      - {text: "Dans le module, puis dans la classe, puis dans l'objet", correct: false}
      - {text: "Dans l'objet seulement ; sinon, une `AttributeError`", correct: false}
    answer: "C'est pourquoi un attribut d'instance masque un attribut de classe du même nom, et qu'un attribut de classe se lit par un objet."
  - key: affectation-par-instance
    format: course
    question: "Que fait `obj.taux = 0.2` quand `taux` est un attribut de classe ?"
    choices:
      - {text: "Il crée un attribut d'instance qui masque celui de la classe, pour cet objet", correct: true}
      - {text: "Il modifie l'attribut de classe, donc la valeur vue par tous les objets", correct: false}
      - {text: "Il lève une `AttributeError` : l'attribut appartient à la classe", correct: false}
      - {text: "Il modifie la classe, puis recopie la valeur dans chaque objet", correct: false}
    answer: "L'affectation par un objet écrit toujours dans l'objet. Les autres objets voient toujours la valeur de la classe."
  - key: usage-attribut-classe
    format: course
    question: "À quoi sert typiquement un attribut de classe ?"
    choices:
      - {text: "À une constante, ou à un compteur commun à tous les objets", correct: true}
      - {text: "À une liste d'éléments propre à chaque objet", correct: false}
      - {text: "À une valeur que chaque objet modifie de son côté", correct: false}
      - {text: "À un attribut privé, invisible depuis l'extérieur", correct: false}
    answer: "Une valeur commune, comme `TVA = 0.2`, ou un compteur d'instances. Une donnée propre à l'objet, surtout mutable, va dans `__init__`."
  - key: vf-liste-partagee
    format: true-false
    question: "Une liste déclarée dans le corps de la classe est partagée par tous les objets de cette classe."
    truth: true
    answer: "Il n'y a qu'une liste, rangée dans la classe : un `append` fait par un objet se voit dans tous les autres."
  - key: vf-plus-egal-instance
    format: true-false
    question: "Avec `compteur` attribut de classe, `obj.compteur += 1` incrémente le compteur de la classe."
    truth: false
    answer: "Python lit la valeur de la classe, ajoute 1, puis range le résultat dans l'objet : un attribut d'instance est créé, la classe ne change pas. Il faut écrire `Classe.compteur += 1`."
  - key: vf-lecture-par-instance
    format: true-false
    question: "Un attribut de classe se lit aussi depuis un objet : `obj.attribut`."
    truth: true
    answer: "Ne le trouvant pas dans l'objet, la recherche continue dans sa classe."
  - key: vf-dict-instance
    format: true-false
    question: "Un attribut de classe apparaît dans le `__dict__` de chaque objet de la classe."
    truth: false
    answer: "Il n'est que dans le `__dict__` de la classe. `vars(obj)` ne montre que les attributs d'instance."
  - key: qcm-compter-instances
    format: multiple-choice
    question: "Comment comptes-tu, dans `__init__`, les objets créés de la classe `Joueur` ?"
    choices:
      - {text: "`Joueur.total += 1`", correct: true}
      - {text: "`self.total += 1`", correct: false}
      - {text: "`total += 1`", correct: false}
      - {text: "`Joueur.total = 1`", correct: false}
    answer: "Il faut écrire dans la classe. `self.total += 1` crée un attribut dans l'objet ; `total += 1` vise une variable locale qui n'existe pas (`UnboundLocalError`)."
  - key: qcm-liste-par-objet
    format: multiple-choice
    question: "Où crées-tu la liste `notes` pour que chaque élève ait la sienne ?"
    choices:
      - {text: "Dans `__init__` : `self.notes = []`", correct: true}
      - {text: "Dans le corps de la classe : `notes = []`", correct: false}
      - {text: "Dans une méthode de classe, appelée une fois", correct: false}
      - {text: "Dans le module, avant la définition de la classe", correct: false}
    answer: "`__init__` s'exécute pour chaque objet : chacun reçoit sa propre liste. Dans le corps de la classe, la liste serait partagée."
  - key: qcm-masquage-valeur
    format: multiple-choice
    question: "On définit `class C: x = 1`, puis `a = C()` et `a.x = 5`. Que vaut `C.x` ?"
    choices:
      - {text: "`1`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "Une `AttributeError`", correct: false}
      - {text: "`None`", correct: false}
    answer: "`a.x = 5` crée un attribut dans l'objet `a`. L'attribut de la classe garde sa valeur, 1."
  - key: qcm-type-self
    format: multiple-choice
    question: "Dans une méthode, quelle écriture modifie l'attribut de classe `compteur` de la classe réelle de l'objet, sous-classe comprise ?"
    choices:
      - {text: "`type(self).compteur += 1`", correct: true}
      - {text: "`self.compteur += 1`", correct: false}
      - {text: "`compteur += 1`", correct: false}
      - {text: "`super.compteur += 1`", correct: false}
    answer: "`type(self)` est la classe de l'objet. `self.compteur += 1` écrirait dans l'objet, et `compteur` seul est une variable locale."
  - key: code-compteur-tickets
    format: code-output
    question: |-
      ```python
      class Ticket:
          emis = 0

          def __init__(self):
              Ticket.emis += 1
              self.numero = Ticket.emis


      a, b, c = Ticket(), Ticket(), Ticket()
      print(a.numero, c.numero, Ticket.emis)
      ```
    answer: "`1 3 3` : le compteur de la classe augmente à chaque création, et chaque ticket garde son numéro dans un attribut d'instance."
    check:
      output: "1 3 3"
    choices:
      - {text: "`1 3 3`", correct: true}
      - {text: "`3 3 3`", correct: false}
      - {text: "`1 3 0`", correct: false}
      - {text: "`1 1 3`", correct: false}
  - key: code-liste-partagee
    format: code-output
    question: |-
      ```python
      class Equipe:
          membres = []

          def ajouter(self, nom):
              self.membres.append(nom)


      rouge, bleue = Equipe(), Equipe()
      rouge.ajouter("Ana")
      bleue.ajouter("Léo")
      print(rouge.membres)
      ```
    answer: "`['Ana', 'Léo']` : les deux équipes partagent la liste de la classe, que `append` modifie."
    check:
      output: "['Ana', 'Léo']"
    choices:
      - {text: "`['Ana', 'Léo']`", correct: true}
      - {text: "`['Ana']`", correct: false}
      - {text: "`['Léo']`", correct: false}
      - {text: "`[]`", correct: false}
  - key: code-masquage
    format: code-output
    question: |-
      ```python
      class Config:
          niveau = 1


      a, b = Config(), Config()
      a.niveau = 5
      Config.niveau = 2
      print(a.niveau, b.niveau, Config.niveau)
      ```
    answer: "`5 2 2` : `a` a son propre attribut, qui masque celui de la classe ; `b` n'en a pas et lit la nouvelle valeur de la classe."
    check:
      output: "5 2 2"
    choices:
      - {text: "`5 2 2`", correct: true}
      - {text: "`2 2 2`", correct: false}
      - {text: "`5 1 2`", correct: false}
      - {text: "`5 5 2`", correct: false}
  - key: code-plus-egal-objet
    format: code-output
    question: |-
      ```python
      class Compteur:
          total = 10


      c = Compteur()
      c.total += 1
      print(c.total, Compteur.total, "total" in vars(c))
      ```
    answer: "`11 10 True` : `c.total += 1` lit 10 dans la classe, puis crée l'attribut `total` dans l'objet."
    check:
      output: "11 10 True"
    choices:
      - {text: "`11 10 True`", correct: true}
      - {text: "`11 11 False`", correct: false}
      - {text: "`11 11 True`", correct: false}
      - {text: "`11 10 False`", correct: false}
  - key: bug-panier-partage
    format: bug-fix
    question: |-
      Le panier `p2`, que personne n'a rempli, affiche `['pain']` :
      ```python
      class Panier:
          articles = []

          def ajouter(self, article):
              self.articles.append(article)


      p1, p2 = Panier(), Panier()
      p1.ajouter("pain")
      print(p2.articles)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Créer la liste dans `__init__` : `self.articles = []`", correct: true}
      - {text: "Remplacer `self.articles` par `Panier.articles` dans `ajouter`", correct: false}
      - {text: "Déclarer `articles = ()`, un tuple, dans le corps de la classe", correct: false}
      - {text: "Copier la liste à chaque ajout : `self.articles.copy().append(...)`", correct: false}
    answer: |-
      ```python
      class Panier:
          def __init__(self):
              self.articles = []
      ```
      Déclarée dans le corps de la classe, la liste est unique et partagée. Créée dans `__init__`, chaque panier a la
      sienne.
  - key: bug-compteur-instance
    format: bug-fix
    question: |-
      Ce programme affiche `0`, alors que deux connexions ont été ouvertes :
      ```python
      class Connexion:
          ouvertes = 0

          def __init__(self):
              self.ouvertes += 1


      Connexion()
      Connexion()
      print(Connexion.ouvertes)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `Connexion.ouvertes += 1` dans `__init__`", correct: true}
      - {text: "Écrire `ouvertes += 1` dans `__init__`", correct: false}
      - {text: "Initialiser `self.ouvertes = 0` dans `__init__`", correct: false}
      - {text: "Afficher `Connexion().ouvertes` au lieu de la classe", correct: false}
    answer: |-
      ```python
      def __init__(self):
          Connexion.ouvertes += 1
      ```
      `self.ouvertes += 1` crée un attribut dans chaque objet, qui vaut 1 ; l'attribut de la classe reste à 0.
  - key: bug-entetes-partages
    format: bug-fix
    question: |-
      La requête `r2`, qui n'a reçu aucun en-tête, affiche `{'Auth': 'secret'}` : un secret fuit d'une requête à
      l'autre.
      ```python
      class Requete:
          entetes = {}

          def __init__(self, url):
              self.url = url

          def ajouter_entete(self, cle, valeur):
              self.entetes[cle] = valeur


      r1 = Requete("/a")
      r1.ajouter_entete("Auth", "secret")
      r2 = Requete("/b")
      print(r2.entetes)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Créer `self.entetes = {}` dans `__init__`", correct: true}
      - {text: "Vider `Requete.entetes` au début de `__init__`", correct: false}
      - {text: "Remplacer le dictionnaire par une liste de couples", correct: false}
      - {text: "Écrire `Requete.entetes[cle] = valeur`", correct: false}
    answer: |-
      ```python
      def __init__(self, url):
          self.url = url
          self.entetes = {}
      ```
      Le dictionnaire de la classe est partagé par toutes les requêtes. Le vider dans `__init__` effacerait aussi les
      en-têtes des requêtes déjà créées.
  - key: bug-tva-par-objet
    format: bug-fix
    question: |-
      La TVA doit baisser pour tous les tarifs, mais `b` garde l'ancienne : le programme affiche `105.5 60.0`.
      ```python
      class Tarif:
          tva = 0.20

          def __init__(self, ht):
              self.ht = ht

          def ttc(self):
              return round(self.ht * (1 + self.tva), 2)


      a, b = Tarif(100), Tarif(50)
      a.tva = 0.055
      print(a.ttc(), b.ttc())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Modifier la classe : `Tarif.tva = 0.055`", correct: true}
      - {text: "Modifier aussi `b` : `b.tva = 0.055`", correct: false}
      - {text: "Écrire `global tva` dans la méthode `ttc`", correct: false}
      - {text: "Lire `Tarif.tva` dans `ttc` au lieu de `self.tva`", correct: false}
    answer: |-
      ```python
      Tarif.tva = 0.055
      print(a.ttc(), b.ttc())   # 105.5 52.75
      ```
      `a.tva = ...` crée un attribut dans `a` seul. Modifier `b` à la main oublierait les tarifs suivants : c'est la
      classe qu'il faut changer.
  - key: situation-compteur-global
    format: scenario
    question: |-
      Tu veux connaître le nombre de commandes créées depuis le lancement du programme, toutes instances de `Commande`
      confondues. Où ranges-tu ce compteur ?
    choices:
      - {text: "Dans un attribut de classe, incrémenté par `Commande.total += 1`", correct: true}
      - {text: "Dans un attribut d'instance, incrémenté par `self.total += 1`", correct: false}
      - {text: "Dans une variable locale de `__init__`, remise à zéro à chaque appel", correct: false}
      - {text: "Dans une liste de classe que chaque objet copie à sa création", correct: false}
    answer: "Un compteur commun à toutes les instances appartient à la classe. `self.total += 1` créerait un compteur à 1 dans chaque objet."
  - key: situation-revue-inventaire
    format: scenario
    question: |-
      En revue, tu lis `class Joueur:` suivi de `inventaire = []` dans le corps de la classe, et chaque joueur y ajoute
      ses objets avec `self.inventaire.append(...)`. Que dis-tu ?
    choices:
      - {text: "Que tous les joueurs partagent un inventaire : il faut le créer dans `__init__`", correct: true}
      - {text: "Que c'est correct : chaque objet reçoit une copie de la liste de la classe", correct: false}
      - {text: "Qu'il faut un tuple au lieu d'une liste, pour éviter les doublons", correct: false}
      - {text: "Qu'il faut écrire `INVENTAIRE` en majuscules, comme une constante", correct: false}
    answer: "Une liste déclarée dans le corps de la classe existe une seule fois. Chaque joueur doit recevoir la sienne : `self.inventaire = []` dans `__init__`."
  - key: situation-frais-port
    format: scenario
    question: |-
      Toutes les instances de `Livraison` utilisent les mêmes frais de port, qui changent une fois par an. Où les
      ranges-tu ?
    choices:
      - {text: "Dans un attribut de classe `FRAIS_PORT`, lu par `self.FRAIS_PORT`", correct: true}
      - {text: "Dans un attribut d'instance, recopié par chaque `__init__`", correct: false}
      - {text: "Dans une variable globale modifiée par chaque méthode", correct: false}
      - {text: "Dans un paramètre obligatoire de chaque méthode", correct: false}
    answer: "Une valeur commune et rarement modifiée est une constante de classe : un seul endroit à changer. La recopier dans chaque objet multiplie les copies à tenir à jour."
  - key: situation-test-pollue
    format: scenario
    question: |-
      Un test passe seul, mais échoue quand il suit un autre test : un objet tout juste créé contient déjà des éléments
      ajoutés par le test précédent. Quelle cause cherches-tu en premier ?
    choices:
      - {text: "Un attribut de classe mutable, partagé par tous les objets", correct: true}
      - {text: "Un attribut d'instance oublié dans `__init__`", correct: false}
      - {text: "Un `__repr__` qui modifie l'objet qu'il affiche", correct: false}
      - {text: "Un ordre des tests tiré au hasard par pytest", correct: false}
    answer: "Une liste ou un dictionnaire déclaré dans le corps de la classe survit d'un objet à l'autre, donc d'un test à l'autre. Un attribut oublié lèverait une `AttributeError`, et pytest garde l'ordre du fichier."
