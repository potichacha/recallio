notion: egalite-hachage
lesson: |-
  Par défaut, `==` entre deux objets d'une classe compare leur **identité**, comme `is` : deux `Point(1, 2)` créés
  séparément sont différents. `__eq__` définit l'égalité par la valeur ; `__hash__` permet de ranger l'objet dans un
  `set` ou d'en faire une clé de dictionnaire.

  ```python
  class Point:
      def __init__(self, x, y):
          self.x = x
          self.y = y

      def __eq__(self, autre):
          if not isinstance(autre, Point):
              return NotImplemented            # pas « False » : laisse l'autre objet répondre
          return (self.x, self.y) == (autre.x, autre.y)

      def __hash__(self):
          return hash((self.x, self.y))         # les mêmes champs que __eq__
  ```

  - **La règle** : deux objets égaux doivent avoir le **même hachage**. L'inverse n'est pas exigé : deux objets
    différents peuvent partager un hachage (une collision), le `set` les départage par `==`.
  - **Définir `__eq__` sans `__hash__` met `__hash__` à `None`** : les objets ne sont plus hachables. En Python 3.14,
    `{p}` lève `TypeError: cannot use 'Point' as a set element (unhashable type: 'Point')`.
  - **Le hachage d'un tuple** des champs comparés est la recette simple : `hash((self.x, self.y))`.
  - **Une clé doit rester immuable** : le hachage décide de la place de l'objet dans la table. Si un champ haché change
    après l'insertion, la clé devient introuvable. D'où `@dataclass(frozen=True)`, qui génère `__eq__` et `__hash__`
    sur des champs non modifiables.
  - **Une entité modifiable** (un utilisateur dont l'e-mail change) fonde son égalité et son hachage sur un
    identifiant qui ne change jamais, ou reste non hachable.
  - **`NotImplemented`** dit « je ne sais pas comparer » : Python essaie alors l'autre objet, puis se rabat sur
    l'identité (donc `False`). Lever une exception, ou lire `autre.x` sans vérifier, casse `p == 3`.
  - `!=` se déduit de `__eq__` : pas besoin d'écrire `__ne__`.

  **En entretien** : « Sans `__eq__`, `==` compare l'identité. Si on définit `__eq__`, il faut définir `__hash__` sur
  les mêmes champs, sinon les objets ne sont plus hachables ; la règle est que deux objets égaux ont le même hachage.
  Les champs hachés doivent être immuables, d'où les dataclasses `frozen=True`. `__eq__` renvoie `NotImplemented` pour
  un type qu'il ne connaît pas. »
cards:
  - key: vf-identite-par-defaut
    format: true-false
    question: "Sans `__eq__`, deux objets d'une classe ne sont égaux que s'ils sont le même objet."
    truth: true
    answer: "Le `__eq__` hérité d'`object` compare l'identité, comme `is`. Deux `Point(1, 2)` créés séparément sont donc différents."
  - key: vf-eq-sans-hash
    format: true-false
    question: "Une classe qui définit `__eq__` sans `__hash__` ne peut plus servir de clé de dictionnaire."
    truth: true
    answer: "Python met `__hash__` à `None` dans ce cas, pour ne pas garder un hachage par identité incohérent avec la nouvelle égalité. `{p: 1}` lève une `TypeError`."
  - key: vf-collision-permise
    format: true-false
    question: "Un `__hash__` peut donner le même hachage à deux objets différents sans rendre un `set` faux."
    truth: true
    answer: "C'est une collision : le `set` départage les deux objets avec `==`. Seul le sens inverse est exigé : deux objets égaux ont le même hachage. Trop de collisions ralentissent seulement les recherches."
  - key: vf-ne-deduit
    format: true-false
    question: "Quand une classe définit `__eq__`, Python déduit le résultat de `!=`, sans `__ne__` à écrire."
    truth: true
    answer: "Le `__ne__` par défaut inverse le résultat de `__eq__` (sauf s'il renvoie `NotImplemented`)."
  - key: qcm-egaux-hachages-differents
    format: multiple-choice
    question: "Un `set` contient `a`. L'objet `b` est égal à `a`, mais son `__hash__` donne un autre hachage. Que vaut `b in s` ?"
    choices:
      - {text: "`False` : seuls les éléments de même hachage sont comparés", correct: true}
      - {text: "`True` : le `set` compare chaque élément avec `==`", correct: false}
      - {text: "Une `TypeError` : les deux hachages se contredisent", correct: false}
      - {text: "`True` : Python recalcule le hachage de `a` à la recherche", correct: false}
    answer: "Le `set` cherche d'abord par hachage, et n'appelle `==` que sur un élément de même hachage. D'où la règle : deux objets égaux doivent avoir le même hachage."
  - key: qcm-ecrire-hash
    format: multiple-choice
    question: "Comment écrire le `__hash__` d'un `Point` dont l'égalité compare `x` et `y` ?"
    choices:
      - {text: "`return hash((self.x, self.y))`", correct: true}
      - {text: "`return hash([self.x, self.y])`", correct: false}
      - {text: "`return id(self)`", correct: false}
      - {text: "`return hash(self)`", correct: false}
    answer: "Le hachage du tuple des champs comparés. Une liste n'est pas hachable ; `id` contredirait l'égalité ; `hash(self)` rappellerait `__hash__` sans fin."
  - key: qcm-type-inconnu
    format: multiple-choice
    question: "Que doit renvoyer `__eq__` quand l'autre objet est d'un type qu'il ne sait pas comparer ?"
    choices:
      - {text: "`NotImplemented`", correct: true}
      - {text: "`None`", correct: false}
      - {text: "`NotImplementedError`", correct: false}
      - {text: "`TypeError`", correct: false}
    answer: "`NotImplemented` laisse Python essayer `autre.__eq__`, puis l'identité : `p == 3` vaut alors `False`, sans erreur."
  - key: qcm-dataclass-hachable
    format: multiple-choice
    question: "Quelle dataclass a un `__hash__` fondé sur ses champs ?"
    choices:
      - {text: "`@dataclass(frozen=True)`", correct: true}
      - {text: "`@dataclass`, sans option", correct: false}
      - {text: "`@dataclass(order=True)`", correct: false}
      - {text: "`@dataclass(eq=False)`", correct: false}
    answer: "Gelée, elle est immuable : son `__hash__` peut reposer sur ses champs. Sans option, elle a un `__eq__` et donc `__hash__ = None` ; avec `eq=False`, elle garde l'identité."
  - key: code-identite
    format: code-output
    question: |-
      ```python
      class Point:
          def __init__(self, x, y):
              self.x, self.y = x, y


      a, b = Point(1, 2), Point(1, 2)
      print(a == b, a == a)
      ```
    answer: "`False True` : sans `__eq__`, `==` compare l'identité. `a` et `b` sont deux objets distincts."
    check:
      output: "False True"
    choices:
      - {text: "`False True`", correct: true}
      - {text: "`True True`", correct: false}
      - {text: "`False False`", correct: false}
      - {text: "`True False`", correct: false}
  - key: code-non-hachable
    format: code-output
    question: |-
      ```python
      class Point:
          def __init__(self, x, y):
              self.x, self.y = x, y

          def __eq__(self, autre):
              return (self.x, self.y) == (autre.x, autre.y)


      print(Point(1, 2) == Point(1, 2))
      print({Point(1, 2)})
      ```
    answer: "`True`, puis une `TypeError` : l'égalité marche, mais définir `__eq__` sans `__hash__` a rendu les points non hachables."
    check:
      output: "True"
      throws: TypeError
    choices:
      - {text: "`True`, puis une `TypeError`", correct: true}
      - {text: "`True`, puis un ensemble d'un point", correct: false}
      - {text: "`False`, puis une `TypeError`", correct: false}
      - {text: "Une `TypeError`, sans rien afficher", correct: false}
  - key: code-dedoublonnage
    format: code-output
    question: |-
      ```python
      class Ville:
          def __init__(self, nom):
              self.nom = nom

          def __eq__(self, autre):
              return isinstance(autre, Ville) and self.nom == autre.nom

          def __hash__(self):
              return hash(self.nom)


      print(len({Ville("Lyon"), Ville("Lyon"), Ville("Nice")}))
      ```
    answer: "`2` : les deux `Ville(\"Lyon\")` ont le même hachage et sont égales, le `set` n'en garde qu'une."
    check:
      output: "2"
    choices:
      - {text: "`2`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
  - key: code-cle-modifiee
    format: code-output
    question: |-
      ```python
      class Cle:
          def __init__(self, v):
              self.v = v

          def __eq__(self, autre):
              return self.v == autre.v

          def __hash__(self):
              return hash(self.v)


      k = Cle(1)
      d = {k: "un"}
      k.v = 2
      print(Cle(1) in d, Cle(2) in d, k in d)
      ```
    answer: "`False False False` : la clé est rangée à la place du hachage de 1. `Cle(1)` y regarde, mais la clé vaut désormais 2 ; `Cle(2)` et `k` cherchent à la place du hachage de 2, vide."
    check:
      output: "False False False"
    choices:
      - {text: "`False False False`", correct: true}
      - {text: "`False True True`", correct: false}
      - {text: "`True False False`", correct: false}
      - {text: "`False False True`", correct: false}
  - key: bug-set-non-hachable
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: cannot use 'Produit' as a set element (unhashable type: 'Produit') » :
      ```python
      class Produit:
          def __init__(self, ref):
              self.ref = ref

          def __eq__(self, autre):
              return self.ref == autre.ref


      vus = set()
      vus.add(Produit("A1"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Définir `__hash__`, qui renvoie `hash(self.ref)`", correct: true}
      - {text: "Retirer `__eq__`, pour retrouver le hachage par défaut", correct: false}
      - {text: "Ranger les produits dans une liste plutôt qu'un `set`", correct: false}
      - {text: "Définir `__hash__`, qui renvoie `id(self)`", correct: false}
    answer: |-
      ```python
      def __hash__(self):
          return hash(self.ref)
      ```
      `__eq__` sans `__hash__` rend la classe non hachable. Le hachage repose sur le champ comparé ; `id(self)`
      donnerait deux hachages différents à deux produits égaux.
  - key: bug-hash-incoherent
    format: bug-fix
    question: |-
      Ce programme affiche `2`, alors que les deux clients ont le même e-mail, qui les rend égaux :
      ```python
      class Client:
          def __init__(self, email, nom):
              self.email, self.nom = email, nom

          def __eq__(self, autre):
              return self.email == autre.email

          def __hash__(self):
              return hash((self.email, self.nom))


      clients = {Client("ana@exemple.fr", "Ana"), Client("ana@exemple.fr", "Ana Diaz")}
      print(len(clients))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Hacher seulement l'e-mail, le champ comparé par `__eq__`", correct: true}
      - {text: "Comparer aussi le nom dans `__eq__`, sans toucher au hachage", correct: false}
      - {text: "Hacher seulement le nom, plus lisible que l'e-mail", correct: false}
      - {text: "Retirer `__hash__`, que Python calcule à partir de `__eq__`", correct: false}
    answer: |-
      ```python
      def __hash__(self):
          return hash(self.email)
      ```
      Égaux, ils doivent avoir le même hachage. Avec le nom dans le hachage, le `set` les range à deux places et ne
      les compare jamais. Comparer le nom changerait la règle métier ; sans `__hash__`, la classe ne serait plus
      hachable.
  - key: bug-eq-autre-type
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « AttributeError: 'tuple' object has no attribute 'x' » :
      ```python
      class Point:
          def __init__(self, x, y):
              self.x, self.y = x, y

          def __eq__(self, autre):
              return (self.x, self.y) == (autre.x, autre.y)

          def __hash__(self):
              return hash((self.x, self.y))


      print(Point(1, 2) == (1, 2))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renvoyer `NotImplemented` si `autre` n'est pas un `Point`", correct: true}
      - {text: "Lever une `TypeError` si `autre` n'est pas un `Point`", correct: false}
      - {text: "Rattraper `AttributeError` autour de la comparaison", correct: false}
      - {text: "Convertir `autre` en `Point(*autre)` avant de comparer", correct: false}
    answer: |-
      ```python
      def __eq__(self, autre):
          if not isinstance(autre, Point):
              return NotImplemented
          return (self.x, self.y) == (autre.x, autre.y)
      ```
      `NotImplemented` laisse Python essayer le tuple, puis conclure à `False`. Lever une `TypeError` casserait
      `point in liste_mixte` ; convertir rendrait un point égal à un tuple.
  - key: bug-cle-deplacee
    format: bug-fix
    question: |-
      Ce programme affiche « case vide », alors que le pion vient d'arriver en (1, 0) :
      ```python
      class Position:
          def __init__(self, x, y):
              self.x, self.y = x, y

          def __eq__(self, autre):
              return (self.x, self.y) == (autre.x, autre.y)

          def __hash__(self):
              return hash((self.x, self.y))


      pion = Position(0, 0)
      plateau = {pion: "pion blanc"}
      pion.x = 1
      print(plateau.get(Position(1, 0), "case vide"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Rendre `Position` immuable, et remplacer la clé à chaque déplacement", correct: true}
      - {text: "Retirer `__hash__`, pour que la clé suive le pion déplacé", correct: false}
      - {text: "Hacher `id(self)` au lieu des coordonnées", correct: false}
      - {text: "Appeler `hash(pion)` après chaque déplacement", correct: false}
    answer: |-
      ```python
      plateau[Position(1, 0)] = plateau.pop(Position(0, 0))
      ```
      La clé est rangée selon son hachage d'origine, (0, 0) : changer ses champs la rend introuvable. Une position
      immuable (`@dataclass(frozen=True)`) empêche l'erreur ; un déplacement crée une nouvelle clé.
  - key: situation-dedoublonner
    format: scenario
    question: |-
      Tu dois dédoublonner des milliers d'objets `Commande`, égaux quand leurs numéros sont égaux. Que fais-tu ?
    choices:
      - {text: "`__eq__` et `__hash__` fondés sur le numéro, puis un `set`", correct: true}
      - {text: "`__eq__` fondé sur le numéro, puis un `set`, sans `__hash__`", correct: false}
      - {text: "Une double boucle qui compare chaque paire avec `==`", correct: false}
      - {text: "`__hash__` seul, fondé sur le numéro, puis un `set`", correct: false}
    answer: "Le `set` dédoublonne en temps linéaire, s'il sait hacher et comparer. Sans `__hash__`, l'objet n'est pas hachable ; sans `__eq__`, l'égalité reste l'identité ; la double boucle est quadratique."
  - key: situation-entite-modifiable
    format: scenario
    question: |-
      Tes objets `Utilisateur` sont modifiables (nom, e-mail), et ont un identifiant fixe. Sur quoi fondes-tu leur
      égalité et leur hachage ?
    choices:
      - {text: "Sur l'identifiant seul, qui ne change jamais", correct: true}
      - {text: "Sur tous les champs, pour une égalité complète", correct: false}
      - {text: "Sur l'e-mail, unique pour chaque utilisateur", correct: false}
      - {text: "Sur `id(self)`, l'adresse de l'objet en mémoire", correct: false}
    answer: "Un hachage fondé sur un champ modifiable rendrait l'utilisateur introuvable dans un `set` après un changement d'e-mail. `id(self)` distinguerait deux chargements du même utilisateur."
  - key: situation-hash-none
    format: scenario
    question: |-
      En revue, une classe définit `__eq__` et écrit `__hash__ = None`. Ton collègue demande à quoi sert cette ligne.
      Que lui réponds-tu ?
    choices:
      - {text: "Les objets sont modifiables : on les déclare non hachables, sans ambiguïté", correct: true}
      - {text: "C'est une erreur : `__hash__ = None` lève une exception à l'import", correct: false}
      - {text: "Elle accélère le hachage, calculé une seule fois puis gardé", correct: false}
      - {text: "Elle laisse Python choisir le hachage par défaut, fondé sur `id`", correct: false}
    answer: "Python le fait déjà quand on définit `__eq__` seul, mais l'écrire documente la décision : ces objets changent, ils ne doivent pas servir de clés."
  - key: situation-is-contenu
    format: scenario
    question: |-
      Ton collègue écrit `if commande is autre_commande:` pour savoir si deux commandes ont le même contenu. Que lui
      dis-tu ?
    choices:
      - {text: "`is` teste l'identité : il faut `==`, avec un `__eq__` adapté", correct: true}
      - {text: "`is` convient, et va plus vite que `==` sur des objets", correct: false}
      - {text: "`is` compare les hachages des objets, ce qui suffit ici", correct: false}
      - {text: "Il faut comparer `id(commande) == id(autre_commande)`", correct: false}
    answer: "Deux commandes lues séparément ont le même contenu mais sont deux objets : `is` dira toujours non. `id(a) == id(b)` revient exactement à `is`."
  - key: eq-par-defaut
    format: course
    question: "Que compare `==` entre deux objets d'une classe sans `__eq__` ?"
    choices:
      - {text: "Leur identité, comme `is`", correct: true}
      - {text: "Leurs attributs, un par un", correct: false}
      - {text: "Leur `repr`, sous forme de texte", correct: false}
      - {text: "Leur hachage, calculé par `hash`", correct: false}
    answer: "Le `__eq__` hérité d'`object` compare l'identité. Pour une égalité par valeur, on écrit `__eq__`, ou on utilise une dataclass."
  - key: hash-none-implicite
    format: course
    question: "Que fait Python quand une classe définit `__eq__`, mais pas `__hash__` ?"
    choices:
      - {text: "Il met `__hash__` à `None` : les objets ne sont plus hachables", correct: true}
      - {text: "Il garde le hachage par défaut, fondé sur l'identité", correct: false}
      - {text: "Il calcule un hachage à partir de tous les attributs", correct: false}
      - {text: "Il lève une `TypeError` à la définition de la classe", correct: false}
    answer: "Garder le hachage par identité violerait la règle « égaux, donc même hachage ». Python préfère rendre les objets non hachables."
  - key: cle-immuable
    format: course
    question: "Pourquoi une clé de dictionnaire doit-elle rester immuable ?"
    choices:
      - {text: "Son hachage fixe sa place : s'il change, la clé devient introuvable", correct: true}
      - {text: "Un dictionnaire copie ses clés et ignore leurs changements", correct: false}
      - {text: "Python verrouille les objets dès qu'ils servent de clés", correct: false}
      - {text: "Les clés sont triées : un changement casserait cet ordre", correct: false}
    answer: "Rien n'empêche de modifier une clé, d'où le piège : elle reste à son ancienne place, que plus aucune recherche ne visite. Les dictionnaires gardent l'ordre d'insertion, ils ne trient rien."
  - key: role-notimplemented
    format: course
    question: "À quoi sert de renvoyer `NotImplemented` depuis `__eq__` ?"
    choices:
      - {text: "À laisser Python essayer l'autre objet, puis comparer l'identité", correct: true}
      - {text: "À lever une `NotImplementedError` chez l'appelant", correct: false}
      - {text: "À dire que les deux objets sont différents, comme `False`", correct: false}
      - {text: "À désactiver l'opérateur `==` pour toute la classe", correct: false}
    answer: "Pour `a == b`, si `a.__eq__(b)` renvoie `NotImplemented`, Python essaie `b.__eq__(a)`, puis se rabat sur `a is b`. Renvoyer `False` couperait court à la réponse de `b`."
