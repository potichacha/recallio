notion: metaclasses
lesson: |-
  En Python, une classe est un objet comme un autre ; sa classe s'appelle sa **métaclasse**. Par défaut, c'est
  **`type`** : `type(int)` vaut `<class 'type'>`. `type(nom, bases, espace)` crée d'ailleurs une classe à
  l'exécution.

  ```python
  Point = type("Point", (), {"x": 0})   # équivaut à : class Point: x = 0
  ```

  **Ce que fait l'instruction `class`** : Python exécute le corps de la classe, recueille ses noms dans un dictionnaire
  (l'**espace de noms**), puis appelle la métaclasse avec le nom, les bases et cet espace. Une **métaclasse
  personnalisée**, sous-classe de `type`, peut intervenir à ce moment :

  ```python
  class Enregistreuse(type):
      registre = {}

      def __new__(mcs, nom, bases, espace):
          classe = super().__new__(mcs, nom, bases, espace)
          mcs.registre[nom] = classe
          return classe


  class Modele(metaclass=Enregistreuse):
      pass
  ```

  - **Usages** : enregistrer les classes, vérifier ou transformer leur définition, construire des API déclaratives
    (les modèles d'un ORM). `abc.ABCMeta` et `enum.EnumType` sont des métaclasses de la bibliothèque standard.
  - **La métaclasse s'hérite** : les sous-classes de `Modele` passent aussi par `Enregistreuse`. Deux bases aux
    métaclasses sans lien provoquent `TypeError: metaclass conflict`.
  - **`__init_subclass__`** (Python 3.6) couvre la plupart de ces besoins plus simplement : une méthode de classe de
    la classe parente, appelée à chaque définition d'une sous-classe, qui peut recevoir des arguments.

  ```python
  class Plugin:
      registre = {}

      def __init_subclass__(cls, nom, **kwargs):
          super().__init_subclass__(**kwargs)
          Plugin.registre[nom] = cls


  class Csv(Plugin, nom="csv"):
      pass
  ```

  - **Un décorateur de classe** modifie une classe après sa création, sans toucher à sa hiérarchie (`@dataclass` en
    est un).
  - **L'ordre de préférence** : un décorateur de classe ou `__init_subclass__` d'abord ; une métaclasse seulement si
    l'on doit agir avant la création de la classe (sur son espace de noms) ou sur toute une hiérarchie qu'on ne
    contrôle pas.

  **En entretien** : « Une métaclasse est la classe d'une classe ; par défaut `type`, qui crée la classe à partir de
  son nom, de ses bases et de son espace de noms. On s'en sert pour enregistrer ou transformer des classes, comme
  `ABCMeta` ou les ORM. Mais `__init_subclass__` et les décorateurs de classe couvrent la plupart des besoins, plus
  simplement : une métaclasse reste un dernier recours. »
cards:
  - key: vf-type-par-defaut
    format: true-false
    question: "La métaclasse par défaut de toute classe est `type`."
    truth: true
    answer: "`type(Point)` vaut `<class 'type'>`, pour toute classe définie sans `metaclass=`. `type` est même sa propre métaclasse."
  - key: vf-init-subclass-appel
    format: true-false
    question: "`__init_subclass__` est appelé sur la classe parente chaque fois qu'une sous-classe est définie."
    truth: true
    answer: "Il reçoit la nouvelle sous-classe en `cls`, et les arguments nommés de la ligne `class` (`class Csv(Plugin, nom=\"csv\")`)."
  - key: vf-type-un-argument
    format: true-false
    question: "`type(\"A\", (), {})` lève une erreur : `type` n'accepte qu'un seul argument."
    truth: false
    answer: "Avec un argument, `type` donne le type d'un objet ; avec trois (nom, bases, espace de noms), il crée une classe. `type(\"A\", (), {})` équivaut à `class A: pass`."
  - key: vf-init-subclass-instance
    format: true-false
    question: "`__init_subclass__` est appelé à chaque création d'une instance de la sous-classe."
    truth: false
    answer: "Il est appelé une seule fois, à la définition de la sous-classe. La création d'une instance passe par `__new__` et `__init__`."
  - key: qcm-type-classe-et-instance
    format: multiple-choice
    question: "Dans un script, `Point` est une classe définie sans `metaclass=`. Qu'affiche `print(type(Point), type(Point()))` ?"
    choices:
      - {text: "`<class 'type'> <class '__main__.Point'>`", correct: true}
      - {text: "`<class 'Point'> <class '__main__.Point'>`", correct: false}
      - {text: "`<class 'object'> <class '__main__.Point'>`", correct: false}
      - {text: "`<class 'type'> <class 'type'>`", correct: false}
    answer: "La classe est une instance de sa métaclasse, `type` ; l'objet est une instance de la classe. `object` est la racine de l'héritage, pas la métaclasse."
  - key: qcm-syntaxe
    format: multiple-choice
    question: "Comment déclarer qu'une classe utilise la métaclasse `Meta` ?"
    choices:
      - {text: "`class A(metaclass=Meta):`", correct: true}
      - {text: "`class A(Meta):`", correct: false}
      - {text: "`@Meta` au-dessus de `class A:`", correct: false}
      - {text: "`__metaclass__ = Meta` dans le corps", correct: false}
    answer: "Un argument nommé dans la ligne `class`. `class A(Meta)` ferait de `A` une sous-classe de `Meta`, donc une métaclasse ; `__metaclass__` est la syntaxe de Python 2, ignorée en Python 3."
  - key: qcm-alternative
    format: multiple-choice
    question: "Quel crochet, plus simple qu'une métaclasse, permet à une classe parente d'enregistrer ses sous-classes ?"
    choices:
      - {text: "`__init_subclass__`", correct: true}
      - {text: "`__subclasses__`", correct: false}
      - {text: "`__new__`", correct: false}
      - {text: "`__set_name__`", correct: false}
    answer: "`__init_subclass__` est appelé à chaque nouvelle sous-classe. `__subclasses__()` liste les sous-classes directes encore en vie, sans rien déclencher."
  - key: qcm-exemple-bibliotheque
    format: multiple-choice
    question: "Laquelle de ces classes de la bibliothèque standard repose sur une métaclasse ?"
    choices:
      - {text: "`abc.ABC`", correct: true}
      - {text: "`collections.OrderedDict`", correct: false}
      - {text: "`functools.partial`", correct: false}
      - {text: "`dataclasses.Field`", correct: false}
    answer: "`ABC` a pour métaclasse `ABCMeta`, qui refuse d'instancier une classe aux méthodes abstraites. `Enum` repose aussi sur une métaclasse, `EnumType`."
  - key: code-type-trois-arguments
    format: code-output
    question: |-
      ```python
      Point = type("Point", (), {"x": 1, "double": lambda self: self.x * 2})
      p = Point()
      print(Point.__name__, p.double(), type(Point).__name__)
      ```
    answer: "`Point 2 type` : `type` à trois arguments crée une classe, avec ses attributs et ses méthodes ; sa métaclasse est `type`."
    check:
      output: "Point 2 type"
    choices:
      - {text: "`Point 2 type`", correct: true}
      - {text: "`Point 2 Point`", correct: false}
      - {text: "`type 2 type`", correct: false}
      - {text: "`Point 1 object`", correct: false}
  - key: code-registre-init-subclass
    format: code-output
    question: |-
      ```python
      class Plugin:
          registre = {}

          def __init_subclass__(cls, nom, **kwargs):
              super().__init_subclass__(**kwargs)
              Plugin.registre[nom] = cls


      class Csv(Plugin, nom="csv"):
          pass


      class Json(Plugin, nom="json"):
          pass


      print({k: v.__name__ for k, v in Plugin.registre.items()})
      ```
    answer: "`{'csv': 'Csv', 'json': 'Json'}` : chaque définition de sous-classe appelle `__init_subclass__`, avec l'argument `nom` de sa ligne `class`."
    check:
      output: "{'csv': 'Csv', 'json': 'Json'}"
    choices:
      - {text: "`{'csv': 'Csv', 'json': 'Json'}`", correct: true}
      - {text: "`{}`", correct: false}
      - {text: "`{'csv': 'Plugin', 'json': 'Plugin'}`", correct: false}
      - {text: "`{'Csv': 'csv', 'Json': 'json'}`", correct: false}
  - key: code-metaclasse-transforme
    format: code-output
    question: |-
      ```python
      class Majuscules(type):
          def __new__(mcs, nom, bases, espace):
              espace = {k if k.startswith("__") else k.upper(): v for k, v in espace.items()}
              return super().__new__(mcs, nom, bases, espace)


      class Config(metaclass=Majuscules):
          port = 80


      print(hasattr(Config, "port"), Config.PORT, type(Config).__name__)
      ```
    answer: "`False 80 Majuscules` : la métaclasse renomme les attributs avant de créer la classe ; `Config` est une instance de `Majuscules`."
    check:
      output: "False 80 Majuscules"
    choices:
      - {text: "`False 80 Majuscules`", correct: true}
      - {text: "`True 80 type`", correct: false}
      - {text: "`True 80 Majuscules`", correct: false}
      - {text: "`False 80 type`", correct: false}
  - key: code-ordre-creation
    format: code-output
    question: |-
      ```python
      class Meta(type):
          def __new__(mcs, nom, bases, espace):
              print("création de", nom)
              return super().__new__(mcs, nom, bases, espace)


      class A(metaclass=Meta):
          print("corps de A")


      print("avant l'instance")
      a = A()
      ```
    answer: "Le corps de la classe s'exécute d'abord, puis la métaclasse crée la classe, dès l'instruction `class`. Créer une instance n'appelle pas `Meta.__new__`."
    check:
      output: |-
        corps de A
        création de A
        avant l'instance
    choices:
      - text: |-
          ```
          corps de A
          création de A
          avant l'instance
          ```
        correct: true
      - text: |-
          ```
          création de A
          corps de A
          avant l'instance
          ```
        correct: false
      - text: |-
          ```
          avant l'instance
          création de A
          corps de A
          ```
        correct: false
      - text: |-
          ```
          corps de A
          avant l'instance
          création de A
          ```
        correct: false
  - key: definition-metaclasse
    format: definition
    question: "Qu'est-ce qu'une métaclasse ?"
    choices:
      - {text: "La classe d'une classe : elle crée et configure les classes", correct: true}
      - {text: "Une classe abstraite, dont on ne crée aucune instance", correct: false}
      - {text: "La classe parente de toutes les classes, `object`", correct: false}
      - {text: "Une classe générée automatiquement par un décorateur", correct: false}
    answer: "Les instances d'une métaclasse sont des classes. `object` est la racine de l'héritage, `type` la métaclasse par défaut : deux rôles différents."
  - key: definition-init-subclass
    format: definition
    question: "Qu'est-ce que `__init_subclass__` ?"
    choices:
      - {text: "Une méthode de classe du parent, appelée à chaque définition d'une sous-classe", correct: true}
      - {text: "Le constructeur appelé à chaque création d'une instance de sous-classe", correct: false}
      - {text: "La méthode qui initialise les attributs hérités par une sous-classe", correct: false}
      - {text: "Un décorateur qui empêche toute autre classe d'en hériter", correct: false}
    answer: "Implicitement une méthode de classe : elle reçoit la nouvelle sous-classe. Elle remplace une métaclasse pour enregistrer ou valider des sous-classes."
  - key: definition-type
    format: definition
    question: "Qu'est-ce que `type`, en Python ?"
    choices:
      - {text: "La fonction qui donne le type d'un objet, et la métaclasse par défaut", correct: true}
      - {text: "Un module qui définit les annotations de types, comme `Optional`", correct: false}
      - {text: "Un mot-clé réservé, utilisé seulement pour déclarer des classes", correct: false}
      - {text: "Une classe abstraite dont héritent tous les types intégrés", correct: false}
    answer: "`type(x)` donne la classe de `x` ; `type(nom, bases, espace)` crée une classe. Les annotations vivent dans le module `typing`."
  - key: definition-espace-de-noms
    format: definition
    question: "Qu'est-ce que l'espace de noms d'une classe, que reçoit le `__new__` d'une métaclasse ?"
    choices:
      - {text: "Le dictionnaire des noms définis dans le corps de la classe", correct: true}
      - {text: "Le module dans lequel la classe est définie", correct: false}
      - {text: "La liste des classes parentes de la classe", correct: false}
      - {text: "Le nom de la classe, sous forme de chaîne", correct: false}
    answer: "Attributs, méthodes, `__module__`, `__qualname__`... La métaclasse peut le lire et le transformer avant de créer la classe. Le nom et les bases sont ses deux autres arguments."
  - key: quand-metaclasse
    format: course
    question: "Quand une métaclasse est-elle justifiée ?"
    choices:
      - {text: "Rarement : quand `__init_subclass__` ou un décorateur de classe ne suffit pas", correct: true}
      - {text: "Pour chaque classe qui définit des attributs de classe", correct: false}
      - {text: "Pour rendre une classe plus rapide à instancier", correct: false}
      - {text: "Pour pouvoir hériter de plusieurs classes à la fois", correct: false}
    answer: "Par exemple pour agir sur l'espace de noms avant la création de la classe. Sinon, les solutions plus simples sont plus lisibles et ne provoquent pas de conflit de métaclasses."
  - key: instruction-class
    format: course
    question: "Que fait Python quand il exécute une instruction `class` ?"
    choices:
      - {text: "Il exécute le corps, puis appelle la métaclasse avec le nom, les bases et l'espace de noms", correct: true}
      - {text: "Il crée la classe vide, puis exécute son corps à la création de la première instance", correct: false}
      - {text: "Il compile la classe, sans rien exécuter avant la création de la première instance", correct: false}
      - {text: "Il copie la classe parente, puis y ajoute les noms définis dans le corps", correct: false}
    answer: "Le corps est du code ordinaire, exécuté une fois à la définition. Puis `type` (ou la métaclasse) crée l'objet classe, et le nom de la classe y est lié."
  - key: conflit-metaclasses
    format: course
    question: "Pourquoi `class C(A, B)` peut-il échouer quand `A` et `B` ont des métaclasses différentes ?"
    choices:
      - {text: "La métaclasse de `C` doit dériver de celles de tous ses parents", correct: true}
      - {text: "Python interdit tout héritage multiple avec des métaclasses", correct: false}
      - {text: "`C` hériterait des deux métaclasses, ce qui crée un cycle", correct: false}
      - {text: "Une métaclasse n'accepte qu'une seule classe de base", correct: false}
    answer: "`TypeError: metaclass conflict`. Si l'une des métaclasses dérive de l'autre, Python prend la plus dérivée ; sinon, il faut en écrire une qui hérite des deux."
  - key: decorateur-de-classe
    format: course
    question: "Quelle alternative à une métaclasse modifie une classe juste après sa création, sans toucher à sa hiérarchie ?"
    choices:
      - {text: "Un décorateur de classe, qui reçoit la classe et la renvoie", correct: true}
      - {text: "Un `__init__` défini dans la classe elle-même", correct: false}
      - {text: "Une `property` posée sur la classe", correct: false}
      - {text: "Un descripteur qui définit `__set_name__`", correct: false}
    answer: "`@dataclass` en est l'exemple : il lit la classe créée et lui ajoute des méthodes. Contrairement à une métaclasse, il ne s'hérite pas."
