notion: methodes-classe-statiques
lesson: |-
  Une classe a trois sortes de méthodes, selon ce qu'elles reçoivent en premier argument.

  | Sorte | Décorateur | Premier paramètre | Usage |
  |---|---|---|---|
  | méthode d'instance | aucun | `self`, l'objet | lire ou modifier l'objet |
  | méthode de classe | `@classmethod` | `cls`, la classe | constructeurs alternatifs, état de la classe |
  | méthode statique | `@staticmethod` | rien d'implicite | une fonction utilitaire rangée dans la classe |

  ```python
  class Date:
      def __init__(self, annee, mois, jour):
          self.annee, self.mois, self.jour = annee, mois, jour

      @classmethod
      def depuis_iso(cls, texte):              # un constructeur alternatif
          annee, mois, jour = map(int, texte.split("-"))
          return cls(annee, mois, jour)

      @staticmethod
      def est_bissextile(annee):               # n'a besoin ni de l'objet ni de la classe
          return annee % 4 == 0 and (annee % 100 != 0 or annee % 400 == 0)


  d = Date.depuis_iso("2026-11-17")
  print(Date.est_bissextile(2024))           # True
  ```

  **Le constructeur alternatif.** Python n'a qu'un `__init__` par classe, sans surcharge. Pour créer un objet à partir
  d'une autre forme de données (un texte, un dictionnaire, un fichier), on écrit une méthode de classe, souvent nommée
  `depuis_...` ou `from_...`. La bibliothèque standard en est pleine : `dict.fromkeys`, `datetime.fromisoformat`,
  `int.from_bytes`.

  **Pourquoi `cls` et pas le nom de la classe.** `return cls(...)` crée un objet de la classe sur laquelle on a appelé
  la méthode : `MaDate.depuis_iso(...)` renvoie une `MaDate` si `MaDate` hérite de `Date`. Écrire `return Date(...)`
  renverrait toujours une `Date`.

  **Les appels.** Les deux sortes s'appellent sur la classe (`Date.depuis_iso(...)`) ou sur un objet
  (`d.est_bissextile(2024)`). Une méthode statique ne reçoit rien : elle ne peut lire ni `self` ni `cls`.

  **Les oublis.** Sans `@staticmethod`, `obj.methode(x)` passe l'objet en plus : « takes 1 positional argument but 2
  were given ». Sans `@classmethod`, `Classe.methode(x)` met `x` dans `cls` et il manque un argument.

  **En entretien** : « Une méthode de classe reçoit la classe, `cls` : elle sert surtout de constructeur alternatif, et
  `cls(...)` respecte les sous-classes. Une méthode statique ne reçoit rien d'implicite : c'est une fonction rangée
  dans la classe. Une méthode d'instance reçoit l'objet, `self`. »
cards:
  - key: difference-classmethod-staticmethod
    format: course
    question: "Quelle différence entre `@classmethod` et `@staticmethod` ?"
    choices:
      - {text: "La première reçoit la classe (`cls`) ; la seconde ne reçoit rien d'implicite", correct: true}
      - {text: "La première reçoit l'objet (`self`) ; la seconde reçoit la classe", correct: false}
      - {text: "La première est héritée par les sous-classes ; la seconde ne l'est pas", correct: false}
      - {text: "La première est publique ; la seconde n'est visible que dans la classe", correct: false}
    answer: "Les deux s'appellent sur la classe ou sur un objet, et toutes deux s'héritent. Seule la méthode de classe reçoit quelque chose : la classe."
  - key: constructeur-alternatif
    format: course
    question: "Qu'est-ce qu'un constructeur alternatif ?"
    choices:
      - {text: "Une méthode de classe qui crée un objet à partir d'une autre forme de données", correct: true}
      - {text: "Un second `__init__`, que Python choisit d'après le type des arguments", correct: false}
      - {text: "Une méthode statique qui modifie l'objet après sa création", correct: false}
      - {text: "Une sous-classe qui redéfinit `__init__` avec d'autres paramètres", correct: false}
    answer: "Python n'a pas de surcharge : un second `__init__` remplacerait le premier. `Date.depuis_iso('2026-11-17')` ou `dict.fromkeys(...)` sont des constructeurs alternatifs."
  - key: pourquoi-cls
    format: course
    question: "Pourquoi un constructeur alternatif écrit-il `return cls(...)` plutôt que `return Date(...)` ?"
    choices:
      - {text: "Pour qu'une sous-classe qui en hérite crée un objet de son propre type", correct: true}
      - {text: "Parce que le nom `Date` n'existe pas encore dans le corps de la classe", correct: false}
      - {text: "Parce que `cls(...)` crée l'objet sans appeler `__init__`", correct: false}
      - {text: "Parce que `cls(...)` est plus rapide à l'exécution", correct: false}
    answer: "`cls` est la classe sur laquelle on appelle la méthode : `MaDate.depuis_iso(...)` renvoie une `MaDate`. Au moment de l'appel, le nom `Date` existe bien, mais il figerait le type."
  - key: quand-staticmethod
    format: course
    question: "Quand une `@staticmethod` est-elle un bon choix ?"
    choices:
      - {text: "Pour une fonction liée à la classe, qui n'utilise ni l'objet ni la classe", correct: true}
      - {text: "Pour une méthode qui modifie un attribut de classe partagé", correct: false}
      - {text: "Pour une méthode qui doit lire les attributs de l'objet", correct: false}
      - {text: "Pour une méthode que les sous-classes ne doivent pas redéfinir", correct: false}
    answer: "Une validation ou un calcul lié au domaine de la classe, comme `Date.est_bissextile(annee)`. Pour modifier la classe, il faut `cls` ; pour l'objet, `self`."
  - key: vf-cls-sous-classe
    format: true-false
    question: "Appelée sur une sous-classe, une méthode de classe reçoit la sous-classe dans `cls`."
    truth: true
    answer: "C'est ce qui rend les constructeurs alternatifs héritables : `cls(...)` crée un objet de la sous-classe."
  - key: vf-static-par-objet
    format: true-false
    question: "Une méthode statique peut s'appeler depuis un objet : `obj.methode(x)`."
    truth: true
    answer: "Elle s'appelle sur la classe ou sur un objet ; dans les deux cas, elle ne reçoit que les arguments écrits."
  - key: vf-static-recoit-objet
    format: true-false
    question: "Une `@staticmethod` reçoit l'objet en premier argument quand on l'appelle sur un objet."
    truth: false
    answer: "C'est justement ce que retire `@staticmethod` : aucun argument implicite, ni objet ni classe."
  - key: vf-fromkeys
    format: true-false
    question: "`dict.fromkeys(['a', 'b'], 0)` est un constructeur alternatif de la bibliothèque standard."
    truth: true
    answer: "C'est une méthode de classe qui crée un dictionnaire à partir de clés : `{'a': 0, 'b': 0}`. `datetime.fromisoformat` et `int.from_bytes` en sont d'autres."
  - key: qcm-decorateur-constructeur
    format: multiple-choice
    question: "Quel décorateur choisis-tu pour `Date.depuis_texte('2026-11-17')`, qui renvoie une nouvelle `Date` ?"
    choices:
      - {text: "`@classmethod`", correct: true}
      - {text: "`@staticmethod`", correct: false}
      - {text: "`@property`", correct: false}
      - {text: "`@abstractmethod`", correct: false}
    answer: "Un constructeur alternatif reçoit la classe et renvoie `cls(...)`, ce qui respecte les sous-classes."
  - key: qcm-premier-parametre
    format: multiple-choice
    question: "Quel est, par convention, le nom du premier paramètre d'une méthode de classe ?"
    choices:
      - {text: "`cls`", correct: true}
      - {text: "`self`", correct: false}
      - {text: "`this`", correct: false}
      - {text: "`klass`", correct: false}
    answer: "`cls` pour la classe, `self` pour l'objet. `class` étant un mot-clé, on ne peut pas l'employer comme nom."
  - key: qcm-appel-statique
    format: multiple-choice
    question: "Comment appelles-tu la méthode statique `valider(code)` de la classe `Carte` ?"
    choices:
      - {text: "`Carte.valider('1234')`", correct: true}
      - {text: "`Carte.valider(Carte, '1234')`", correct: false}
      - {text: "`Carte().valider(self, '1234')`", correct: false}
      - {text: "`valider('1234')`, comme une fonction du module", correct: false}
    answer: "Elle vit dans l'espace de noms de la classe, et ne reçoit que ses arguments. Hors de la classe, le nom `valider` seul n'existe pas."
  - key: qcm-stdlib
    format: multiple-choice
    question: "Lequel de ces appels utilise un constructeur alternatif ?"
    choices:
      - {text: "`datetime.fromisoformat('2026-11-17')`", correct: true}
      - {text: "`datetime(2026, 11, 17).isoformat()`", correct: false}
      - {text: "`'2026-11-17'.split('-')`", correct: false}
      - {text: "`len('2026-11-17')`", correct: false}
    answer: "`fromisoformat` est une méthode de classe qui crée un `datetime` à partir d'un texte. `isoformat` fait l'inverse, sur un objet existant."
  - key: trous-classmethod
    format: fill-in
    question: |-
      Complète le constructeur alternatif :
      ```python
      class Temperature:
          def __init__(self, celsius):
              self.celsius = celsius

          @___
          def depuis_fahrenheit(cls, f):
              return cls((f - 32) * 5 / 9)
      ```
    blanks:
      - - classmethod
    answer: "`@classmethod` fait recevoir la classe dans `cls`."
  - key: trous-cls-appel
    format: fill-in
    question: |-
      Complète pour créer l'objet du bon type, sous-classes comprises :
      ```python
      class Couleur:
          def __init__(self, r, g, b):
              self.r, self.g, self.b = r, g, b

          @classmethod
          def depuis_hex(cls, code):
              return ___(int(code[1:3], 16), int(code[3:5], 16), int(code[5:7], 16))
      ```
    blanks:
      - - cls
    answer: "`cls(...)` appelle la classe reçue : une sous-classe de `Couleur` obtient un objet de son type."
  - key: trous-staticmethod
    format: fill-in
    question: |-
      Complète cette fonction utilitaire, qui n'a besoin ni de l'objet ni de la classe :
      ```python
      class Iban:
          @___
          def nettoyer(texte):
              return texte.replace(" ", "").upper()
      ```
    blanks:
      - - staticmethod
    answer: "`@staticmethod` : la méthode ne reçoit que `texte`, qu'on l'appelle sur la classe ou sur un objet."
  - key: trous-cls-parametre
    format: fill-in
    question: |-
      Complète le premier paramètre :
      ```python
      class Utilisateur:
          def __init__(self, nom, email):
              self.nom, self.email = nom, email

          @classmethod
          def depuis_dict(___, donnees):
              return cls(donnees["nom"], donnees["email"])
      ```
    blanks:
      - - cls
    answer: "Le premier paramètre d'une méthode de classe s'appelle `cls`, par convention ; le corps l'utilise déjà."
  - key: code-sous-classe-cls
    format: code-output
    question: |-
      ```python
      class Animal:
          @classmethod
          def creer(cls):
              return cls()


      class Chat(Animal):
          pass


      print(type(Chat.creer()).__name__)
      ```
    answer: "`Chat` : appelée sur `Chat`, la méthode de classe reçoit `Chat` dans `cls`."
    check:
      output: "Chat"
    choices:
      - {text: "`Chat`", correct: true}
      - {text: "`Animal`", correct: false}
      - {text: "`type`", correct: false}
      - {text: "`cls`", correct: false}
  - key: code-statique-deux-appels
    format: code-output
    question: |-
      ```python
      class Maths:
          @staticmethod
          def carre(x):
              return x * x


      m = Maths()
      print(Maths.carre(3), m.carre(4))
      ```
    answer: "`9 16` : une méthode statique s'appelle sur la classe ou sur un objet, et ne reçoit que ses arguments."
    check:
      output: "9 16"
    choices:
      - {text: "`9 16`", correct: true}
      - {text: "`9 9`", correct: false}
      - {text: "`3 4`", correct: false}
      - {text: "`9 None`", correct: false}
  - key: code-constructeur-minutes
    format: code-output
    question: |-
      ```python
      class Duree:
          def __init__(self, secondes):
              self.secondes = secondes

          @classmethod
          def depuis_minutes(cls, minutes):
              return cls(minutes * 60)


      d = Duree.depuis_minutes(2.5)
      print(d.secondes)
      ```
    answer: "`150.0` : le constructeur alternatif convertit, puis appelle `cls(...)`. Un flottant fois un entier donne un flottant."
    check:
      output: "150.0"
    choices:
      - {text: "`150.0`", correct: true}
      - {text: "`150`", correct: false}
      - {text: "`2.5`", correct: false}
      - {text: "`120`", correct: false}
  - key: code-cls-compteur
    format: code-output
    question: |-
      ```python
      class Forme:
          nombre = 0

          @classmethod
          def compter(cls):
              cls.nombre += 1
              return cls.nombre


      class Carre(Forme):
          pass


      Forme.compter()
      Carre.compter()
      Carre.compter()
      print(Forme.nombre, Carre.nombre)
      ```
    answer: "`1 3` : appelée sur `Carre`, la méthode écrit `Carre.nombre`, qui part de la valeur héritée (1) puis masque celle de `Forme`."
    check:
      output: "1 3"
    choices:
      - {text: "`1 3`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`1 2`", correct: false}
      - {text: "`3 0`", correct: false}
  - key: bug-statique-oubliee
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: Convertisseur.km_en_miles() takes 1 positional argument but 2 were given » :
      ```python
      class Convertisseur:
          def km_en_miles(km):
              return km * 0.621371


      c = Convertisseur()
      print(c.km_en_miles(10))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter `@staticmethod` au-dessus de la méthode", correct: true}
      - {text: "Appeler `c.km_en_miles()` sans argument", correct: false}
      - {text: "Ajouter `@classmethod` au-dessus de la méthode", correct: false}
      - {text: "Renommer le paramètre `km` en `self`", correct: false}
    answer: |-
      ```python
      class Convertisseur:
          @staticmethod
          def km_en_miles(km):
              return km * 0.621371
      ```
      Appelée sur un objet, une méthode ordinaire reçoit l'objet en plus de `10`. `@staticmethod` retire cet argument
      implicite. `@classmethod` mettrait la classe dans `km`.
  - key: bug-classmethod-oubliee
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: Point.depuis_tuple() missing 1 required positional argument: 'couple' » :
      ```python
      class Point:
          def __init__(self, x, y):
              self.x, self.y = x, y

          def depuis_tuple(cls, couple):
              return cls(*couple)


      p = Point.depuis_tuple((1, 2))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter `@classmethod` au-dessus de `depuis_tuple`", correct: true}
      - {text: "Ajouter `@staticmethod` au-dessus de `depuis_tuple`", correct: false}
      - {text: "Appeler `Point.depuis_tuple(Point(0, 0), (1, 2))`", correct: false}
      - {text: "Renommer `cls` en `self`, la convention habituelle", correct: false}
    answer: |-
      ```python
      @classmethod
      def depuis_tuple(cls, couple):
          return cls(*couple)
      ```
      Sans décorateur, `(1, 2)` va dans `cls` et `couple` manque. Avec `@staticmethod`, `cls` recevrait encore le
      tuple.
  - key: bug-classe-en-dur
    format: bug-fix
    question: |-
      Ce programme affiche `Vehicule`, alors qu'on a demandé une `Moto` :
      ```python
      class Vehicule:
          def __init__(self, roues):
              self.roues = roues

          @classmethod
          def depuis_texte(cls, texte):
              return Vehicule(int(texte))


      class Moto(Vehicule):
          pass


      m = Moto.depuis_texte("2")
      print(type(m).__name__)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `return cls(int(texte))`", correct: true}
      - {text: "Remplacer `@classmethod` par `@staticmethod`", correct: false}
      - {text: "Redéfinir `__init__` dans la classe `Moto`", correct: false}
      - {text: "Appeler `Vehicule.depuis_texte('2')` à la place", correct: false}
    answer: |-
      ```python
      @classmethod
      def depuis_texte(cls, texte):
          return cls(int(texte))
      ```
      `cls` reçoit `Moto`. Le nom `Vehicule`, écrit en dur, ignore la classe sur laquelle on appelle la méthode.
  - key: bug-self-dans-statique
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « NameError: name 'self' is not defined » :
      ```python
      class Validateur:
          longueur_min = 8

          @staticmethod
          def valide(mot_de_passe):
              return len(mot_de_passe) >= self.longueur_min


      print(Validateur.valide("secret123"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Passer en `@classmethod`, avec `cls`, et lire `cls.longueur_min`", correct: true}
      - {text: "Ajouter `self` en paramètre et garder `@staticmethod`", correct: false}
      - {text: "Déclarer `global self` au début de la méthode", correct: false}
      - {text: "Lire `longueur_min` seul, sans préfixe", correct: false}
    answer: |-
      ```python
      @classmethod
      def valide(cls, mot_de_passe):
          return len(mot_de_passe) >= cls.longueur_min
      ```
      Une méthode statique ne reçoit ni l'objet ni la classe. Pour lire un attribut de classe, la méthode a besoin de
      `cls`. `longueur_min` seul serait cherché hors de la classe : une autre `NameError`.
