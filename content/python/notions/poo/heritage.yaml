notion: heritage
lesson: |-
  Une classe peut **hériter** d'une autre : elle reprend ses attributs et ses méthodes, en ajoute, et en
  **redéfinit**. La relation est « est un » : un `Chien` est un `Animal`.

  ```python
  class Animal:
      def __init__(self, nom):
          self.nom = nom

      def cri(self):
          return "..."

      def presenter(self):
          return f"{self.nom} dit {self.cri()}"


  class Chien(Animal):                      # Chien hérite d'Animal
      def __init__(self, nom, race):
          super().__init__(nom)              # le parent initialise ses attributs
          self.race = race

      def cri(self):                         # redéfinition
          return "ouaf"


  print(Chien("Rex", "berger").presenter())  # Rex dit ouaf
  ```

  - **La recherche** : `chien.presenter()` n'est pas dans `Chien`, Python le trouve dans `Animal`. Dans `presenter`,
    `self.cri()` appelle la version de l'objet réel, celle de `Chien` : c'est le **polymorphisme**.
  - **Redéfinir** une méthode remplace la version du parent pour les objets de la sous-classe.
  - **`super()`** donne accès à la version du parent : `super().__init__(nom)` pour l'initialiser,
    `super().total()` pour compléter une méthode plutôt que la réécrire.
  - **Python n'appelle pas tout seul le `__init__` du parent** quand la sous-classe définit le sien. L'oublier laisse
    l'objet sans les attributs du parent : `AttributeError`. Une sous-classe sans `__init__` hérite de celui du parent.
  - Dans une méthode redéfinie, appeler `self.methode()` au lieu de `super().methode()` rappelle la même méthode, sans
    fin : `RecursionError`.
  - Toute classe hérite, au bout de la chaîne, d'**`object`**.

  | Outil | Réponse |
  |---|---|
  | `isinstance(chien, Animal)` | `True` : un objet de la sous-classe est aussi un `Animal` |
  | `type(chien) is Animal` | `False` : le type exact est `Chien` |
  | `issubclass(Chien, Animal)` | `True` |
  | `issubclass(bool, int)` | `True` : `bool` hérite d'`int` |

  Préfère `isinstance` à `type(x) is ...`, qui refuse les sous-classes.

  **En entretien** : « Une sous-classe hérite des méthodes de son parent et peut les redéfinir ; `super()` appelle la
  version du parent, notamment `super().__init__(...)`, que Python n'appelle pas tout seul. Grâce au polymorphisme,
  `self.methode()` exécute la version de l'objet réel. On teste le type avec `isinstance`, qui accepte les
  sous-classes. »
cards:
  - key: redefinir
    format: course
    question: "Que se passe-t-il quand une sous-classe définit une méthode du même nom que sa classe parente ?"
    choices:
      - {text: "Sa version remplace celle du parent pour ses objets", correct: true}
      - {text: "Les deux versions s'exécutent, celle du parent d'abord", correct: false}
      - {text: "Python lève une erreur : le nom est déjà pris", correct: false}
      - {text: "La version du parent reste prioritaire", correct: false}
    answer: "C'est la redéfinition. Pour exécuter aussi la version du parent, la méthode l'appelle elle-même avec `super()`."
  - key: pourquoi-super-init
    format: course
    question: "Pourquoi appeler `super().__init__(...)` dans le `__init__` d'une sous-classe ?"
    choices:
      - {text: "Pour que le parent initialise ses propres attributs sur l'objet", correct: true}
      - {text: "Pour créer un objet parent, distinct de l'objet de la sous-classe", correct: false}
      - {text: "Parce que sans cet appel la classe ne se charge pas", correct: false}
      - {text: "Pour copier les attributs de classe du parent dans l'objet", correct: false}
    answer: "Il n'y a qu'un objet : `super().__init__` le remplit avec les attributs du parent. Python ne fait pas cet appel tout seul quand la sous-classe a son propre `__init__`."
  - key: isinstance-ou-type
    format: course
    question: "Quelle différence entre `isinstance(obj, Animal)` et `type(obj) is Animal` ?"
    choices:
      - {text: "`isinstance` accepte aussi les sous-classes ; `type(...) is` exige le type exact", correct: true}
      - {text: "`isinstance` compare les attributs ; `type(...) is` compare l'identité", correct: false}
      - {text: "Aucune : les deux acceptent les sous-classes d'`Animal`", correct: false}
      - {text: "`isinstance` est plus lent, et à éviter dans le code moderne", correct: false}
    answer: "Un `Chien` est un `Animal` pour `isinstance`, pas pour `type(...) is Animal`. On préfère `isinstance`, qui respecte l'héritage."
  - key: object-racine
    format: course
    question: "De quelle classe hérite `class Point:`, écrite sans parent ?"
    choices:
      - {text: "D'`object`, la racine de toutes les classes", correct: true}
      - {text: "D'aucune : elle n'a pas de classe parente", correct: false}
      - {text: "De `type`, la classe de toutes les classes", correct: false}
      - {text: "De `dict`, qui range ses attributs", correct: false}
    answer: "`Point.__bases__` vaut `(object,)`. C'est d'`object` que viennent `__init__`, `__repr__` ou `__eq__` par défaut. `type` est la classe des classes, pas leur parent."
  - key: vf-init-herite
    format: true-false
    question: "Une sous-classe sans `__init__` utilise celui de sa classe parente."
    truth: true
    answer: "La recherche de `__init__` remonte au parent, comme pour toute méthode : `Chat('Tom')` appelle `Animal.__init__`."
  - key: vf-super-automatique
    format: true-false
    question: "Quand une sous-classe définit son propre `__init__`, Python appelle aussi celui du parent, automatiquement."
    truth: false
    answer: "Le `__init__` de la sous-classe remplace celui du parent. Il doit l'appeler lui-même, avec `super().__init__(...)`."
  - key: vf-bool-int
    format: true-false
    question: "`issubclass(bool, int)` vaut `True`."
    truth: true
    answer: "`bool` hérite d'`int` : `True + True` vaut 2, et `isinstance(True, int)` vaut `True`."
  - key: vf-attributs-sans-super
    format: true-false
    question: "Une sous-classe reçoit les attributs d'instance de son parent même si son `__init__` n'appelle pas celui du parent."
    truth: false
    answer: "Les attributs d'instance sont créés par le code de `__init__`. Si celui du parent ne s'exécute pas, ils n'existent pas."
  - key: qcm-syntaxe-heritage
    format: multiple-choice
    question: "Comment déclares-tu que `Chien` hérite d'`Animal` ?"
    choices:
      - {text: "`class Chien(Animal):`", correct: true}
      - {text: "`class Chien extends Animal:`", correct: false}
      - {text: "`class Chien inherits Animal:`", correct: false}
      - {text: "`class Chien < Animal:`", correct: false}
    answer: "Le parent s'écrit entre parenthèses après le nom de la classe. `extends` est la syntaxe de Java."
  - key: qcm-completer-methode
    format: multiple-choice
    question: "Comment une méthode redéfinie réutilise-t-elle la version du parent, pour la compléter ?"
    choices:
      - {text: "En appelant `super().methode(...)`", correct: true}
      - {text: "En appelant `self.methode(...)`", correct: false}
      - {text: "En appelant `parent.methode(...)`", correct: false}
      - {text: "En appelant `object.methode(...)`", correct: false}
    answer: "`super()` part de la classe suivante dans l'ordre de résolution. `self.methode(...)` rappellerait la méthode redéfinie elle-même."
  - key: qcm-carre-est-rectangle
    format: multiple-choice
    question: "On a `class Carre(Rectangle)`. Que vaut `isinstance(Carre(2), Rectangle)` ?"
    choices:
      - {text: "`True` : un carré est un rectangle", correct: true}
      - {text: "`False` : l'objet est un `Carre`, pas un `Rectangle`", correct: false}
      - {text: "Une `TypeError` : il faudrait passer la classe", correct: false}
      - {text: "`None` : `isinstance` ignore l'héritage", correct: false}
    answer: "`isinstance` accepte le type exact et toutes ses classes parentes."
  - key: qcm-methode-heritee
    format: multiple-choice
    question: "La classe `Admin(Utilisateur)` ne redéfinit pas `se_connecter`. Que fait `admin.se_connecter()` ?"
    choices:
      - {text: "Il exécute la méthode `se_connecter` d'`Utilisateur`", correct: true}
      - {text: "Une `AttributeError` : `Admin` ne définit pas la méthode", correct: false}
      - {text: "Rien : une méthode héritée doit être redéclarée", correct: false}
      - {text: "Une `TypeError` : `self` est un `Admin`, pas un `Utilisateur`", correct: false}
    answer: "Python cherche la méthode dans `Admin`, puis dans `Utilisateur`, et l'appelle avec l'objet `admin` comme `self`."
  - key: trous-parent
    format: fill-in
    question: |-
      Complète pour que `Chat` hérite d'`Animal` :
      ```python
      class Animal:
          def __init__(self, nom):
              self.nom = nom


      class Chat(___):
          def miauler(self):
              return f"{self.nom} : miaou"
      ```
    blanks:
      - - Animal
    answer: "Le parent s'écrit entre parenthèses : `class Chat(Animal):`."
  - key: trous-super-init
    format: fill-in
    question: |-
      Complète pour que le parent initialise le nom :
      ```python
      class Chat(Animal):
          def __init__(self, nom, couleur):
              ___().__init__(nom)
              self.couleur = couleur
      ```
    blanks:
      - - super
    answer: "`super().__init__(nom)` exécute le `__init__` d'`Animal` sur le même objet."
  - key: trous-super-methode
    format: fill-in
    question: |-
      Complète pour appliquer 10 % de remise au prix calculé par le parent :
      ```python
      class ArticleSolde(Article):
          def prix(self):
              return super().___() * 0.9
      ```
    blanks:
      - - prix
    answer: "`super().prix()` appelle la version d'`Article` ; `self.prix()` rappellerait celle-ci, sans fin."
  - key: trous-issubclass
    format: fill-in
    question: |-
      Complète pour tester si la classe `Chat` est une sous-classe d'`Animal` :
      ```python
      print(___(Chat, Animal))
      ```
    blanks:
      - - issubclass
    answer: "`issubclass` compare deux classes ; `isinstance` compare un objet à une classe."
  - key: code-polymorphisme
    format: code-output
    question: |-
      ```python
      class Animal:
          def cri(self):
              return "..."

          def presenter(self):
              return f"Je dis {self.cri()}"


      class Chien(Animal):
          def cri(self):
              return "ouaf"


      print(Chien().presenter(), Animal().presenter())
      ```
    answer: "`Je dis ouaf Je dis ...` : `presenter` est héritée, mais `self.cri()` appelle la version de l'objet réel."
    check:
      output: "Je dis ouaf Je dis ..."
    choices:
      - {text: "`Je dis ouaf Je dis ...`", correct: true}
      - {text: "`Je dis ... Je dis ...`", correct: false}
      - {text: "`Je dis ouaf Je dis ouaf`", correct: false}
      - {text: "`ouaf ...`", correct: false}
  - key: code-super-complete
    format: code-output
    question: |-
      ```python
      class Article:
          def __init__(self, prix):
              self.prix = prix

          def total(self):
              return self.prix


      class ArticleLivre(Article):
          def total(self):
              return super().total() + 5


      print(ArticleLivre(20).total())
      ```
    answer: "`25` : la sous-classe hérite de `__init__`, et complète `total` avec la version du parent."
    check:
      output: "25"
    choices:
      - {text: "`25`", correct: true}
      - {text: "`20`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "`30`", correct: false}
  - key: code-isinstance-type
    format: code-output
    question: |-
      ```python
      class Vehicule:
          pass


      class Voiture(Vehicule):
          pass


      v = Voiture()
      print(isinstance(v, Vehicule), type(v) is Vehicule, issubclass(Vehicule, Voiture))
      ```
    answer: "`True False False` : une voiture est un véhicule, mais son type exact est `Voiture`, et l'héritage ne va que dans un sens."
    check:
      output: "True False False"
    choices:
      - {text: "`True False False`", correct: true}
      - {text: "`True True False`", correct: false}
      - {text: "`True False True`", correct: false}
      - {text: "`False False False`", correct: false}
  - key: code-init-non-appele
    format: code-output
    question: |-
      ```python
      class Base:
          def __init__(self):
              self.pret = True


      class Service(Base):
          def __init__(self, nom):
              self.nom = nom


      s = Service("api")
      print(s.nom, hasattr(s, "pret"))
      ```
    answer: "`api False` : `Service.__init__` remplace celui de `Base`, qui ne s'exécute pas : l'attribut `pret` n'existe pas."
    check:
      output: "api False"
    choices:
      - {text: "`api False`", correct: true}
      - {text: "`api True`", correct: false}
      - {text: "`None True`", correct: false}
      - {text: "`api None`", correct: false}
  - key: bug-oubli-super-init
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « AttributeError: 'Stagiaire' object has no attribute 'nom' » :
      ```python
      class Employe:
          def __init__(self, nom):
              self.nom = nom


      class Stagiaire(Employe):
          def __init__(self, nom, ecole):
              self.ecole = ecole


      s = Stagiaire("Ana", "INSA")
      print(s.nom)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `super().__init__(nom)` dans `Stagiaire.__init__`", correct: true}
      - {text: "Supprimer le paramètre `nom` de `Stagiaire.__init__`", correct: false}
      - {text: "Déclarer `nom = None` comme attribut de classe d'`Employe`", correct: false}
      - {text: "Créer l'objet avec `Employe('Ana')` puis le convertir", correct: false}
    answer: |-
      ```python
      class Stagiaire(Employe):
          def __init__(self, nom, ecole):
              super().__init__(nom)
              self.ecole = ecole
      ```
      Le `__init__` de `Stagiaire` remplace celui d'`Employe`, qui ne s'exécute plus. Un attribut de classe `nom`
      masquerait l'erreur, mais tous les stagiaires s'appelleraient `None`.
  - key: bug-super-sans-parentheses
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une `TypeError` : « descriptor '__init__' requires a 'super' object but received a 'str' ».
      ```python
      class Forme:
          def __init__(self, couleur):
              self.couleur = couleur


      class Cercle(Forme):
          def __init__(self, couleur, rayon):
              super.__init__(couleur)
              self.rayon = rayon


      Cercle("rouge", 2)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `super().__init__(couleur)`, avec les parenthèses", correct: true}
      - {text: "Écrire `super.__init__(self, couleur)`", correct: false}
      - {text: "Écrire `Forme.__init__(couleur)`, sans `self`", correct: false}
      - {text: "Supprimer l'appel : Python appelle le parent tout seul", correct: false}
    answer: |-
      ```python
      def __init__(self, couleur, rayon):
          super().__init__(couleur)
          self.rayon = rayon
      ```
      `super` sans parenthèses est la classe `super` elle-même : son `__init__` attend un objet `super`. C'est
      `super()` qui renvoie l'objet lié au parent.
  - key: bug-recursion-self
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une `RecursionError` : « maximum recursion depth exceeded ».
      ```python
      class Journal:
          def ecrire(self, message):
              print(message)


      class JournalHorodate(Journal):
          def ecrire(self, message):
              self.ecrire("[12:00] " + message)


      JournalHorodate().ecrire("démarrage")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `super().ecrire(...)` au lieu de `self.ecrire(...)`", correct: true}
      - {text: "Renommer la méthode de la sous-classe `ecrire2`", correct: false}
      - {text: "Appeler `JournalHorodate.ecrire(self, ...)`", correct: false}
      - {text: "Augmenter la limite avec `sys.setrecursionlimit`", correct: false}
    answer: |-
      ```python
      class JournalHorodate(Journal):
          def ecrire(self, message):
              super().ecrire("[12:00] " + message)
      ```
      `self.ecrire` désigne la version de l'objet réel, celle de `JournalHorodate` : la méthode s'appelle elle-même.
      `super()` vise la version du parent. Renommer la méthode casserait le polymorphisme : les appelants de
      `ecrire` n'auraient plus l'horodatage.
  - key: bug-type-is
    format: bug-fix
    question: |-
      Une facture est un document, mais ce programme affiche `refusé` :
      ```python
      class Document:
          pass


      class Facture(Document):
          pass


      def archiver(doc):
          if type(doc) is Document:
              return "archivé"
          return "refusé"


      print(archiver(Facture()))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Tester `isinstance(doc, Document)`", correct: true}
      - {text: "Tester `type(doc) == Document`", correct: false}
      - {text: "Tester `doc is Document`", correct: false}
      - {text: "Tester `issubclass(doc, Document)`", correct: false}
    answer: |-
      ```python
      def archiver(doc):
          if isinstance(doc, Document):
              return "archivé"
          return "refusé"
      ```
      `type(doc)` est `Facture`, jamais `Document`, avec `is` comme avec `==`. `isinstance` accepte les
      sous-classes ; `issubclass` attend une classe, pas un objet, et lèverait une `TypeError`.
