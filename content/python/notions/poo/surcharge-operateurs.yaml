notion: surcharge-operateurs
lesson: |-
  Les opérateurs appellent des méthodes spéciales : `a + b` appelle `a.__add__(b)`, `a < b` appelle `a.__lt__(b)`. Une
  classe les redéfinit quand l'opération a un sens évident pour elle : additionner deux montants, comparer deux
  versions.

  | Opérateur | Méthode | Reflet | En place |
  |---|---|---|---|
  | `a + b` | `__add__` | `__radd__` | `__iadd__` (`+=`) |
  | `a - b`, `a * b`, `a / b`, `a // b`, `a % b`, `a ** b`, `a @ b` | `__sub__`, `__mul__`, `__truediv__`, `__floordiv__`, `__mod__`, `__pow__`, `__matmul__` | `__rsub__`, `__rmul__`... | `__isub__`, `__imul__`... |
  | `-a`, `abs(a)` | `__neg__`, `__abs__` | | |
  | `<`, `<=`, `>`, `>=` | `__lt__`, `__le__`, `__gt__`, `__ge__` | `>` est le reflet de `<`, `>=` celui de `<=` | |

  ```python
  class Euros:
      def __init__(self, centimes):
          self.centimes = centimes

      def __add__(self, autre):
          if not isinstance(autre, Euros):
              return NotImplemented              # Python essaiera autre.__radd__
          return Euros(self.centimes + autre.centimes)   # un nouvel objet

      def __mul__(self, facteur):
          return Euros(round(self.centimes * facteur))

      __rmul__ = __mul__                         # 3 * prix marche aussi
  ```

  - **Un opérateur renvoie un nouvel objet** : `a + b` ne modifie ni `a` ni `b`.
  - **`NotImplemented`, pas une exception**, pour un type qu'on ne gère pas : Python essaie alors la méthode reflétée
    de l'autre opérande (`3 + v` : `int.__add__` renvoie `NotImplemented`, puis `v.__radd__(3)`). Si personne ne sait,
    `TypeError: unsupported operand type(s)`.
  - **`+=` sans `__iadd__`** calcule `a + b` et lie `a` au résultat : un nouvel objet, les autres noms gardent
    l'ancien.
  - **`sum(objets)`** part de `0` : il faut un `__radd__` qui accepte 0, ou `sum(objets, Euros(0))`.
  - **Les comparaisons** : `sorted` et `min` n'utilisent que `<`. **`functools.total_ordering`** complète les autres à
    partir de `__eq__` et d'une seule méthode parmi `__lt__`, `__le__`, `__gt__`, `__ge__` (sans `__eq__`, `==`
    resterait l'identité).
  - **Pas de surprise** : un opérateur doit faire ce que tout lecteur attend. Sinon, une méthode nommée vaut mieux.

  **En entretien** : « Les opérateurs appellent des méthodes spéciales : `__add__`, `__lt__`... Pour un type non géré,
  on renvoie `NotImplemented`, et Python essaie le reflet de l'autre opérande, `__radd__`. `+=` se rabat sur `__add__`
  et crée un nouvel objet, et `functools.total_ordering` déduit toutes les comparaisons de `__eq__` et `__lt__`. On
  renvoie toujours un nouvel objet, et on ne surcharge que les opérations au sens évident. »
cards:
  - key: vf-radd-ensuite
    format: true-false
    question: "Pour évaluer `3 + v`, Python essaie `v.__radd__(3)` quand `int.__add__` renvoie `NotImplemented`."
    truth: true
    answer: "L'entier ne sait pas additionner un objet inconnu : il renvoie `NotImplemented`, et Python donne sa chance au reflet de l'opérande de droite."
  - key: vf-total-ordering-une-methode
    format: true-false
    question: "Avec `@functools.total_ordering`, il suffit de définir `__eq__` et une seule méthode parmi `__lt__`, `__le__`, `__gt__` et `__ge__`."
    truth: true
    answer: "Le décorateur déduit les trois autres comparaisons. Il est un peu plus lent que des méthodes écrites à la main, mais bien plus court."
  - key: vf-iadd-obligatoire
    format: true-false
    question: "`v += w` lève une `TypeError` si la classe définit `__add__`, mais pas `__iadd__`."
    truth: false
    answer: "Sans `__iadd__`, Python calcule `v + w` avec `__add__` et lie `v` au nouvel objet. `__iadd__` ne sert qu'à modifier l'objet en place, comme le fait une liste."
  - key: vf-sorted-lt
    format: true-false
    question: "Pour trier une liste de tes objets, `sorted` n'a besoin que de leur méthode `__lt__`."
    truth: true
    answer: "`sorted`, `min`, `max` et `list.sort` ne comparent qu'avec `<`. Une clé (`key=`) évite même d'en écrire."
  - key: qcm-premier-appel
    format: multiple-choice
    question: "Quelle méthode `a * b` appelle-t-il d'abord ?"
    choices:
      - {text: "`a.__mul__(b)`", correct: true}
      - {text: "`b.__mul__(a)`", correct: false}
      - {text: "`a.__rmul__(b)`", correct: false}
      - {text: "`a.__imul__(b)`", correct: false}
    answer: "L'opérande de gauche d'abord ; `b.__rmul__(a)` seulement s'il renvoie `NotImplemented` (ou si `b` est d'une sous-classe de `a` qui redéfinit le reflet). `__imul__` sert à `*=`."
  - key: qcm-gt-reflet
    format: multiple-choice
    question: "Une classe ne définit que `__lt__`. Que fait Python pour évaluer `a > b`, entre deux de ses objets ?"
    choices:
      - {text: "Il appelle `b.__lt__(a)`, le reflet de `>`", correct: true}
      - {text: "Il lève une `TypeError` : `__gt__` manque", correct: false}
      - {text: "Il calcule `not a.__lt__(b)`, la négation", correct: false}
      - {text: "Il compare les identités des deux objets", correct: false}
    answer: "`a > b` équivaut à `b < a` : sans `__gt__`, Python essaie le reflet. Il ne calcule jamais une négation, fausse en cas d'égalité."
  - key: qcm-sum-echoue
    format: multiple-choice
    question: "Pourquoi `sum([v1, v2])` échoue-t-il sur des objets `Vecteur` qui définissent seulement `__add__` ?"
    choices:
      - {text: "`sum` part de `0`, et `0 + v1` cherche `Vecteur.__radd__`", correct: true}
      - {text: "`sum` n'accepte que des nombres intégrés, jamais des objets", correct: false}
      - {text: "`sum` appelle `__iadd__`, qui n'est pas défini ici", correct: false}
      - {text: "`sum` trie d'abord les éléments, avec `__lt__`", correct: false}
    answer: "`sum` commence par `0 + v1` : l'entier renvoie `NotImplemented`, et sans `__radd__`, c'est une `TypeError`. `sum(vecteurs, Vecteur(0, 0))` évite le problème."
  - key: qcm-pourquoi-notimplemented
    format: multiple-choice
    question: "Pourquoi `__add__` renvoie-t-il `NotImplemented` plutôt que de lever une `TypeError` pour un type inconnu ?"
    choices:
      - {text: "Pour laisser l'autre opérande tenter sa méthode reflétée, `__radd__`", correct: true}
      - {text: "Parce qu'une méthode spéciale ne peut pas lever d'exception", correct: false}
      - {text: "Pour que l'addition renvoie `None`, plus facile à tester", correct: false}
      - {text: "Pour que Python convertisse les deux opérandes en chaînes", correct: false}
    answer: "L'autre type sait peut-être faire l'opération. Si personne ne sait, Python lève lui-même la `TypeError`, avec un message qui nomme les deux types."
  - key: trous-add
    format: fill-in
    question: |-
      Complète pour que `v + w` additionne deux vecteurs :
      ```python
      class Vecteur:
          def __init__(self, x, y):
              self.x, self.y = x, y

          def ___(self, autre):
              return Vecteur(self.x + autre.x, self.y + autre.y)
      ```
    blanks:
      - - __add__
    answer: "`__add__` reçoit l'opérande de droite, et renvoie un nouveau vecteur."
  - key: trous-lt
    format: fill-in
    question: |-
      Complète pour que `sorted(produits)` range les produits par prix croissant :
      ```python
      def ___(self, autre):
          return self.prix < autre.prix
      ```
    blanks:
      - - __lt__
    answer: "`sorted` ne compare qu'avec `<`, donc `__lt__`."
  - key: trous-total-ordering
    format: fill-in
    question: |-
      Complète pour obtenir `<=`, `>` et `>=` à partir de `__eq__` et `__lt__` :
      ```python
      import functools


      @functools.___
      class Version:
          ...
      ```
    blanks:
      - - total_ordering
    answer: "`total_ordering` déduit les comparaisons manquantes de `__eq__` et d'une méthode d'ordre."
  - key: trous-rmul
    format: fill-in
    question: |-
      Complète pour que `3 * v` marche aussi bien que `v * 3` :
      ```python
      def __mul__(self, k):
          return Vecteur(self.x * k, self.y * k)

      ___ = __mul__
      ```
    blanks:
      - - __rmul__
    answer: "`int.__mul__` renvoie `NotImplemented` pour un vecteur : Python appelle alors `v.__rmul__(3)`. La multiplication par un nombre est commutative, la même fonction convient."
  - key: code-plus-egal-nouvel-objet
    format: code-output
    question: |-
      ```python
      class V:
          def __init__(self, x, y):
              self.x, self.y = x, y

          def __add__(self, autre):
              return V(self.x + autre.x, self.y + autre.y)

          def __repr__(self):
              return f"V({self.x}, {self.y})"


      a = V(1, 2)
      b = a
      a += V(10, 10)
      print(a, b)
      ```
    answer: "`V(11, 12) V(1, 2)` : sans `__iadd__`, `a += ...` crée un nouvel objet et y lie `a` ; `b` désigne toujours l'ancien."
    check:
      output: "V(11, 12) V(1, 2)"
    choices:
      - {text: "`V(11, 12) V(1, 2)`", correct: true}
      - {text: "`V(11, 12) V(11, 12)`", correct: false}
      - {text: "`V(1, 2) V(1, 2)`", correct: false}
      - {text: "`V(10, 10) V(1, 2)`", correct: false}
  - key: code-sum-radd
    format: code-output
    question: |-
      ```python
      class Euros:
          def __init__(self, v):
              self.v = v

          def __add__(self, autre):
              if isinstance(autre, int):
                  return Euros(self.v + autre)
              return Euros(self.v + autre.v)

          __radd__ = __add__


      print(sum([Euros(3), Euros(4)]).v)
      ```
    answer: "`7` : `sum` calcule `0 + Euros(3)`, que `__radd__` traite ; puis `Euros(3) + Euros(4)`."
    check:
      output: "7"
    choices:
      - {text: "`7`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "`0`", correct: false}
  - key: code-total-ordering
    format: code-output
    question: |-
      ```python
      from functools import total_ordering


      @total_ordering
      class Version:
          def __init__(self, n):
              self.n = n

          def __eq__(self, autre):
              return self.n == autre.n

          def __lt__(self, autre):
              return self.n < autre.n


      print(Version(2) >= Version(1), Version(1) > Version(1), max(Version(3), Version(5)).n)
      ```
    answer: "`True False 5` : `>=` et `>` sont déduits de `__lt__` et `__eq__`, et `max` compare avec `<`."
    check:
      output: "True False 5"
    choices:
      - {text: "`True False 5`", correct: true}
      - {text: "`True True 5`", correct: false}
      - {text: "`False False 3`", correct: false}
      - {text: "`True False 3`", correct: false}
  - key: code-type-non-gere
    format: code-output
    question: |-
      ```python
      class Monnaie:
          def __init__(self, v):
              self.v = v

          def __add__(self, autre):
              if not isinstance(autre, Monnaie):
                  return NotImplemented
              return Monnaie(self.v + autre.v)


      print((Monnaie(2) + Monnaie(3)).v)
      print(Monnaie(2) + 3)
      ```
    answer: "`5`, puis une `TypeError` : `__add__` renvoie `NotImplemented` pour l'entier, `int` n'a pas de `__radd__` pour une `Monnaie`, et Python lève « unsupported operand type(s) for + »."
    check:
      output: "5"
      throws: TypeError
    choices:
      - {text: "`5`, puis une `TypeError`", correct: true}
      - {text: "`5` et `NotImplemented`, sur deux lignes", correct: false}
      - {text: "`5` et `5`, sur deux lignes", correct: false}
      - {text: "`5`, puis une `NotImplementedError`", correct: false}
  - key: bug-add-modifie-self
    format: bug-fix
    question: |-
      Ce programme affiche `3 3` au lieu de `2 2` :
      ```python
      class Vecteur:
          def __init__(self, x, y):
              self.x, self.y = x, y

          def __add__(self, autre):
              self.x += autre.x
              self.y += autre.y
              return self


      origine = Vecteur(0, 0)
      a = origine + Vecteur(1, 1)
      b = origine + Vecteur(2, 2)
      print(b.x, b.y)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renvoyer un nouvel objet : `return Vecteur(self.x + autre.x, self.y + autre.y)`", correct: true}
      - {text: "Renommer la méthode `__iadd__`, faite pour modifier l'objet en place", correct: false}
      - {text: "Copier `origine` avec `copy.copy` avant chaque addition", correct: false}
      - {text: "Renvoyer `autre` au lieu de `self` à la fin de la méthode", correct: false}
    answer: |-
      ```python
      def __add__(self, autre):
          return Vecteur(self.x + autre.x, self.y + autre.y)
      ```
      `a + b` ne doit modifier aucun opérande. Ici, la première addition a déplacé `origine`, et `a` comme `b` sont
      le même objet qu'elle.
  - key: bug-tri-sans-lt
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: '<' not supported between instances of 'Tache' and 'Tache' » :
      ```python
      class Tache:
          def __init__(self, priorite, titre):
              self.priorite, self.titre = priorite, titre

          def __eq__(self, autre):
              return self.priorite == autre.priorite


      taches = [Tache(2, "écrire"), Tache(1, "lire")]
      print([t.titre for t in sorted(taches)])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Définir `__lt__`, ou trier avec `key=lambda t: t.priorite`", correct: true}
      - {text: "Définir `__hash__`, qu'utilise `sorted` pour ranger", correct: false}
      - {text: "Appeler `sorted(taches, reverse=True)`", correct: false}
      - {text: "Décorer la classe par `@total_ordering` seulement", correct: false}
    answer: |-
      ```python
      def __lt__(self, autre):
          return self.priorite < autre.priorite
      ```
      `sorted` compare avec `<`. `total_ordering` exige une méthode d'ordre en plus de `__eq__` ; `__hash__` ne sert
      pas au tri.
  - key: bug-sum-sans-depart
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: unsupported operand type(s) for +: 'int' and 'Duree' » :
      ```python
      class Duree:
          def __init__(self, minutes):
              self.minutes = minutes

          def __add__(self, autre):
              return Duree(self.minutes + autre.minutes)


      total = sum([Duree(30), Duree(45)])
      print(total.minutes)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Donner un départ à `sum` : `sum(durees, Duree(0))`", correct: true}
      - {text: "Définir `__iadd__`, que `sum` utilise à chaque étape", correct: false}
      - {text: "Remplacer `sum` par `max`, qui accepte tous les objets", correct: false}
      - {text: "Écrire `__add__ = __radd__` à la fin de la classe", correct: false}
    answer: |-
      ```python
      total = sum([Duree(30), Duree(45)], Duree(0))
      ```
      `sum` commence par `0 + Duree(30)` : l'entier ne sait pas faire, et `Duree` n'a pas de `__radd__`. Un départ
      du bon type règle le problème. `__add__ = __radd__` lèverait une `NameError` : `__radd__` n'existe pas.
  - key: bug-total-ordering-sans-eq
    format: bug-fix
    question: |-
      Ce programme affiche `False`, alors qu'une note de 12 est bien inférieure ou égale à une note de 12 :
      ```python
      from functools import total_ordering


      @total_ordering
      class Note:
          def __init__(self, valeur):
              self.valeur = valeur

          def __lt__(self, autre):
              return self.valeur < autre.valeur


      print(Note(12) <= Note(12))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Définir `__eq__` sur la valeur : `total_ordering` en dépend", correct: true}
      - {text: "Définir `__le__` à la place de `__lt__`", correct: false}
      - {text: "Retirer `@total_ordering`, qui fausse les comparaisons", correct: false}
      - {text: "Définir `__hash__` sur la valeur", correct: false}
    answer: |-
      ```python
      def __eq__(self, autre):
          return self.valeur == autre.valeur
      ```
      Le `__le__` déduit vaut « `<` ou `==` ». Sans `__eq__`, `==` compare l'identité : deux notes de 12 sont
      différentes.
  - key: quand-surcharger
    format: course
    question: "Quand surcharger un opérateur a-t-il du sens ?"
    choices:
      - {text: "Quand l'opération a le sens attendu pour ce type : additionner deux montants", correct: true}
      - {text: "Pour raccourcir l'appel de n'importe quelle méthode souvent utilisée", correct: false}
      - {text: "Pour que les objets de la classe soient plus rapides à créer", correct: false}
      - {text: "Jamais : Python interdit de redéfinir le sens de `+`", correct: false}
    answer: "`montant1 + montant2`, `date - duree`, `version1 < version2` : le lecteur devine le sens. `panier + produit` pour « ajouter au panier » surprend : une méthode `ajouter` est plus claire."
  - key: role-radd
    format: course
    question: "À quoi sert `__radd__` ?"
    choices:
      - {text: "À traiter `autre + obj` quand l'opérande de gauche ne sait pas additionner", correct: true}
      - {text: "À traiter `obj + autre` quand `__add__` lève une exception", correct: false}
      - {text: "À faire une addition en place, comme le fait `+=`", correct: false}
      - {text: "À additionner les éléments dans l'ordre inverse", correct: false}
    answer: "C'est le reflet : `3 + obj` appelle `obj.__radd__(3)` quand `int.__add__` renvoie `NotImplemented`. `sum` en a besoin pour son départ, `0`."
  - key: plus-egal-sans-iadd
    format: course
    question: "Que fait `a += b` si la classe de `a` définit `__add__`, mais pas `__iadd__` ?"
    choices:
      - {text: "Il calcule `a + b` et lie `a` au nouvel objet", correct: true}
      - {text: "Il lève une `TypeError` : `__iadd__` est requis", correct: false}
      - {text: "Il modifie `a` en place, en passant par `__add__`", correct: false}
      - {text: "Il appelle `b.__radd__(a)` en priorité", correct: false}
    answer: "Pour un type immuable, c'est le bon comportement. Une liste définit `__iadd__` et se modifie en place : les autres noms qui la désignent voient le changement."
  - key: nouvel-objet
    format: course
    question: "Pourquoi `__add__` renvoie-t-il un nouvel objet, plutôt que de modifier `self` ?"
    choices:
      - {text: "Parce que `a + b` ne doit modifier ni `a` ni `b`", correct: true}
      - {text: "Parce qu'une méthode spéciale ne peut pas modifier `self`", correct: false}
      - {text: "Pour que l'objet soit plus rapide à copier ensuite", correct: false}
      - {text: "Parce que `__add__` est une méthode de classe", correct: false}
    answer: "Comme `2 + 3` ne change ni 2 ni 3. Un `__add__` qui modifie `self` crée des bugs d'aliasing : tous les noms qui désignaient `a` changent avec lui."
