notion: repr-str
lesson: |-
  Sans aide, un objet s'affiche par son type et son adresse en mémoire : `<__main__.Point object at 0x7f...>`. Deux
  méthodes spéciales disent comment le représenter en texte.

  | Méthode | Pour qui | Appelée par |
  |---|---|---|
  | `__repr__` | le développeur : sans ambiguïté, idéalement le code qui recrée l'objet | `repr(obj)`, l'interpréteur interactif, les conteneurs, `f"{obj!r}"`, le débogueur |
  | `__str__` | l'utilisateur : un texte lisible | `str(obj)`, `print(obj)`, `f"{obj}"` |

  ```python
  class Point:
      def __init__(self, x, y):
          self.x = x
          self.y = y

      def __repr__(self):
          return f"Point(x={self.x!r}, y={self.y!r})"

      def __str__(self):
          return f"({self.x}, {self.y})"


  p = Point(2, 3)
  print(p)          # (2, 3)
  print(repr(p))    # Point(x=2, y=3)
  print([p])        # [Point(x=2, y=3)] : une liste montre le repr de ses éléments
  ```

  - **Le repli** : sans `__str__`, `str()` et `print` utilisent `__repr__`. L'inverse n'est pas vrai. Si tu n'en écris
    qu'une, écris donc `__repr__`.
  - **Les conteneurs** (listes, dictionnaires, tuples) affichent toujours le `repr` de leurs éléments, même quand
    ceux-ci ont un `__str__`.
  - **Le `repr` d'une chaîne garde ses guillemets** : `repr("42")` vaut `"'42'"`, ce qui distingue `Tag('1')` de
    `Tag(1)`. D'où le `!r` dans un `__repr__` : `f"Tag({self.valeur!r})"`.
  - **Les deux méthodes renvoient une chaîne**, sans rien afficher. Renvoyer un entier ou `None` lève une `TypeError`
    (`__str__ returned non-string (type int)`).
  - Une dataclass écrit son `__repr__` toute seule.

  **En entretien** : « `__repr__` est pour le développeur : sans ambiguïté, idéalement le code qui recrée l'objet ;
  `__str__` est pour l'utilisateur. `print` utilise `__str__`, qui se rabat sur `__repr__`, et les conteneurs affichent
  le `repr` de leurs éléments. Les deux renvoient une chaîne. »
tour:
  - title: "Afficher un objet : __repr__ et __str__"
    text: |-
      Sans aide, `print` affiche un objet sous la forme `<__main__.Point object at 0x...>` : son type et son adresse.
      Deux méthodes spéciales changent cela :

      - `__repr__` : la représentation pour le développeur, sans ambiguïté, souvent le code qui recrée l'objet ;
      - `__str__` : le texte pour l'utilisateur, celui de `print` et des f-strings.

      Une liste affiche ses éléments avec `__repr__`, et `{p!r}` le demande dans une f-string. Les deux méthodes
      **renvoient** une chaîne, sans rien afficher.

      Essaie : supprime la méthode `__str__`, puis exécute. `print(p)` se rabat sur `__repr__`.
    example:
      files:
        main.py: |-
          class Point:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y

              def __repr__(self):
                  return f"Point(x={self.x}, y={self.y})"

              def __str__(self):
                  return f"({self.x}, {self.y})"


          p = Point(2, 3)
          print(p)
          print(repr(p))
          print([p, Point(0, 0)])
          print(f"{p} et {p!r}")
      output: |-
        (2, 3)
        Point(x=2, y=3)
        [Point(x=2, y=3), Point(x=0, y=0)]
        (2, 3) et Point(x=2, y=3)
    task:
      instructions: |-
        Complète `__repr__` pour que la liste s'affiche comme le code qui recrée les livres :
        `[Livre('Dune', 1965), Livre('Fondation', 1951)]`. Le `!r` d'une f-string garde les guillemets d'une chaîne.
      starter:
        main.py: |-
          class Livre:
              def __init__(self, titre, annee):
                  self.titre = titre
                  self.annee = annee

              def __str__(self):
                  return f"{self.titre} ({self.annee})"

              def __repr__(self):
                  return "Livre(?)"


          livres = [Livre("Dune", 1965), Livre("Fondation", 1951)]
          print(livres[0])
          print(livres)
      solution:
        main.py: |-
          class Livre:
              def __init__(self, titre, annee):
                  self.titre = titre
                  self.annee = annee

              def __str__(self):
                  return f"{self.titre} ({self.annee})"

              def __repr__(self):
                  return f"Livre({self.titre!r}, {self.annee!r})"


          livres = [Livre("Dune", 1965), Livre("Fondation", 1951)]
          print(livres[0])
          print(livres)
      output: |-
        Dune (1965)
        [Livre('Dune', 1965), Livre('Fondation', 1951)]
cards:
  - key: vf-repr-defaut
    format: true-false
    question: "Sans `__repr__`, un objet s'affiche avec le nom de sa classe et son adresse en mémoire."
    truth: true
    answer: "C'est le `__repr__` hérité d'`object` : `<__main__.Point object at 0x7f...>`. Utile pour distinguer deux objets, inutile pour savoir ce qu'ils contiennent."
  - key: vf-str-retour-entier
    format: true-false
    question: "`__str__` peut renvoyer un entier, que Python convertit ensuite en texte."
    truth: false
    answer: "`__str__` et `__repr__` doivent renvoyer une `str`. Sinon : `TypeError: __str__ returned non-string (type int)`."
  - key: vf-fstring-r
    format: true-false
    question: "Dans une f-string, `{obj!r}` utilise `__repr__` au lieu de `__str__`."
    truth: true
    answer: "`!r` appelle `repr()`, `!s` appelle `str()` (le défaut). `f'{obj!r}'` est pratique dans les messages de journal."
  - key: vf-repr-chaine
    format: true-false
    question: "`repr('abc')` et `str('abc')` renvoient la même chaîne."
    truth: false
    answer: "`str('abc')` vaut `abc`, mais `repr('abc')` vaut `'abc'`, avec les guillemets : le repr dit sans ambiguïté qu'il s'agit d'une chaîne."
  - key: qcm-print-appelle
    format: multiple-choice
    question: "Quelle méthode de l'objet `print(obj)` utilise-t-il en premier ?"
    choices:
      - {text: "`__str__`", correct: true}
      - {text: "`__repr__`", correct: false}
      - {text: "`__format__`", correct: false}
      - {text: "`__print__`", correct: false}
    answer: "`print` appelle `str(obj)`, donc `__str__`. Si la classe n'en définit pas, celui d'`object` se rabat sur `__repr__`."
  - key: qcm-console
    format: multiple-choice
    question: "Dans l'interpréteur interactif, tu tapes `p` seul, puis Entrée. Quelle méthode produit ce qui s'affiche ?"
    choices:
      - {text: "`__repr__`", correct: true}
      - {text: "`__str__`", correct: false}
      - {text: "`__init__`", correct: false}
      - {text: "`__format__`", correct: false}
    answer: "L'interpréteur affiche le `repr` de la valeur d'une expression : c'est pour cela qu'une chaîne y apparaît avec ses guillemets."
  - key: qcm-fstring-repr
    format: multiple-choice
    question: "Quelle écriture insère le `repr` d'un objet dans une f-string ?"
    choices:
      - {text: "`f'{obj!r}'`", correct: true}
      - {text: "`f'{obj:r}'`", correct: false}
      - {text: "`f'{obj!s}'`", correct: false}
      - {text: "`f'{repr:obj}'`", correct: false}
    answer: "`!r` est une conversion, avant le format. `:r` serait une spécification de format, refusée par la plupart des types ; `!s` demande le `str`."
  - key: qcm-retour
    format: multiple-choice
    question: "Que doit renvoyer `__repr__` ?"
    choices:
      - {text: "Une chaîne de caractères, de type `str`", correct: true}
      - {text: "Un objet quelconque, converti ensuite en texte", correct: false}
      - {text: "`None`, après avoir affiché le texte avec `print`", correct: false}
      - {text: "Un tuple qui contient les attributs de l'objet", correct: false}
    answer: "Le `repr` est une chaîne, que l'appelant affiche ou range. Une méthode qui affiche et renvoie `None` lève une `TypeError` à l'usage."
  - key: trous-repr
    format: fill-in
    question: |-
      Complète pour que `print([Livre("Dune")])` affiche `[Livre('Dune')]` :
      ```python
      class Livre:
          def __init__(self, titre):
              self.titre = titre

          def ___(self):
              return f"Livre({self.titre!r})"
      ```
    blanks:
      - - __repr__
    answer: "Une liste affiche le `repr` de ses éléments : il faut `__repr__`. Un `__str__` ne servirait pas ici."
  - key: trous-str
    format: fill-in
    question: |-
      Complète pour que `print(t)` affiche `21.5 °C` :
      ```python
      class Temperature:
          def __init__(self, degres):
              self.degres = degres

          def ___(self):
              return f"{self.degres} °C"
      ```
    blanks:
      - - __str__
        - __repr__
    answer: "`__str__` est la méthode de `print`. `__repr__` marcherait aussi, par repli, mais il vise plutôt le développeur."
  - key: trous-fonction-repr
    format: fill-in
    question: |-
      Complète pour obtenir la représentation destinée au développeur :
      ```python
      texte = ___(obj)
      ```
    blanks:
      - - repr
    answer: "La fonction `repr()` appelle `obj.__repr__()`."
  - key: trous-fonction-str
    format: fill-in
    question: |-
      Complète pour obtenir le texte qu'afficherait `print(obj)` :
      ```python
      texte = ___(obj)
      ```
    blanks:
      - - str
    answer: "`str(obj)` appelle `__str__`, ou `__repr__` à défaut : c'est ce que fait `print`."
  - key: code-str-et-repr
    format: code-output
    question: |-
      ```python
      class Note:
          def __init__(self, valeur):
              self.valeur = valeur

          def __repr__(self):
              return f"Note({self.valeur})"

          def __str__(self):
              return f"{self.valeur}/20"


      n = Note(15)
      print(n, [n])
      ```
    answer: "`15/20 [Note(15)]` : `print` utilise `__str__` pour l'objet, mais la liste affiche le `repr` de ses éléments."
    check:
      output: "15/20 [Note(15)]"
    choices:
      - {text: "`15/20 [Note(15)]`", correct: true}
      - {text: "`15/20 [15/20]`", correct: false}
      - {text: "`Note(15) [Note(15)]`", correct: false}
      - {text: "`Note(15) [15/20]`", correct: false}
  - key: code-repli-repr
    format: code-output
    question: |-
      ```python
      class Etiquette:
          def __init__(self, texte):
              self.texte = texte

          def __repr__(self):
              return f"Etiquette({self.texte!r})"


      print(Etiquette("bio"))
      ```
    answer: "`Etiquette('bio')` : sans `__str__`, `print` se rabat sur `__repr__`, et `!r` garde les guillemets de la chaîne."
    check:
      output: "Etiquette('bio')"
    choices:
      - {text: "`Etiquette('bio')`", correct: true}
      - {text: "`Etiquette(bio)`", correct: false}
      - {text: "`bio`", correct: false}
      - {text: "`<Etiquette object>`", correct: false}
  - key: code-repr-chaine-nombre
    format: code-output
    question: |-
      ```python
      print(repr("42"), str("42"), repr(42))
      ```
    answer: "`'42' 42 42` : seul le `repr` d'une chaîne ajoute des guillemets. Celui d'un entier est son écriture."
    check:
      output: "'42' 42 42"
    choices:
      - {text: "`'42' 42 42`", correct: true}
      - {text: "`42 42 42`", correct: false}
      - {text: "`'42' '42' 42`", correct: false}
      - {text: "`'42' 42 '42'`", correct: false}
  - key: code-fstring-deux-formes
    format: code-output
    question: |-
      ```python
      class Ville:
          def __init__(self, nom):
              self.nom = nom

          def __repr__(self):
              return f"Ville({self.nom!r})"

          def __str__(self):
              return self.nom


      v = Ville("Lyon")
      print(f"{v} / {v!r}")
      ```
    answer: "`Lyon / Ville('Lyon')` : `{v}` utilise `__str__`, `{v!r}` utilise `__repr__`."
    check:
      output: "Lyon / Ville('Lyon')"
    choices:
      - {text: "`Lyon / Ville('Lyon')`", correct: true}
      - {text: "`Lyon / Lyon`", correct: false}
      - {text: "`Ville('Lyon') / Ville('Lyon')`", correct: false}
      - {text: "`Lyon / Ville(Lyon)`", correct: false}
  - key: bug-str-non-chaine
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: __str__ returned non-string (type int) » :
      ```python
      class Score:
          def __init__(self, points):
              self.points = points

          def __str__(self):
              return self.points


      print(Score(12))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renvoyer une chaîne : `return str(self.points)`", correct: true}
      - {text: "Afficher le score : `print(self.points)` dans `__str__`", correct: false}
      - {text: "Renommer la méthode `__int__`", correct: false}
      - {text: "Appeler `print(int(Score(12)))`", correct: false}
    answer: |-
      ```python
      def __str__(self):
          return str(self.points)   # ou f"{self.points} points"
      ```
      `__str__` doit renvoyer une `str`. Python ne convertit pas le résultat : il lève une `TypeError`.
  - key: bug-print-dans-repr
    format: bug-fix
    question: |-
      Ce programme affiche `Point(1, 2)`, puis s'arrête sur « TypeError: __repr__ returned non-string (type NoneType) » :
      ```python
      class Point:
          def __init__(self, x, y):
              self.x = x
              self.y = y

          def __repr__(self):
              print(f"Point({self.x}, {self.y})")


      points = [Point(1, 2)]
      print(points)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renvoyer la chaîne avec `return`, au lieu de l'afficher", correct: true}
      - {text: "Remplacer `__repr__` par `__str__`, sans rien changer d'autre", correct: false}
      - {text: "Afficher `points[0]` plutôt que la liste entière", correct: false}
      - {text: "Ajouter `return None` à la fin de `__repr__`", correct: false}
    answer: |-
      ```python
      def __repr__(self):
          return f"Point({self.x}, {self.y})"
      ```
      `__repr__` doit renvoyer le texte. En l'affichant, il renvoie `None`, que la liste ne sait pas afficher.
  - key: bug-liste-adresses
    format: bug-fix
    question: |-
      Ce programme affiche `[<__main__.Produit object at 0x...>, <__main__.Produit object at 0x...>]`, alors que la
      classe sait s'afficher :
      ```python
      class Produit:
          def __init__(self, nom):
              self.nom = nom

          def __str__(self):
              return f"Produit {self.nom}"


      print([Produit("pain"), Produit("lait")])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Définir `__repr__`, qu'une liste utilise pour ses éléments", correct: true}
      - {text: "Appeler `str()` sur la liste avant de l'afficher", correct: false}
      - {text: "Renommer `__str__` en `__list__` pour les conteneurs", correct: false}
      - {text: "Afficher la liste avec `print(*liste, sep=', ')`", correct: false}
    answer: |-
      ```python
      def __repr__(self):
          return f"Produit({self.nom!r})"
      ```
      Une liste affiche le `repr` de ses éléments, jamais leur `str`. `str(liste)` ne change rien : il appelle le même
      `repr` des éléments.
  - key: bug-repr-ambigu
    format: bug-fix
    question: |-
      Dans les journaux, une étiquette numérique et une étiquette texte s'affichent pareil :
      ```python
      class Tag:
          def __init__(self, valeur):
              self.valeur = valeur

          def __repr__(self):
              return f"Tag({self.valeur})"


      print([Tag(1), Tag("1")])
      ```
      Le programme affiche `[Tag(1), Tag(1)]`. Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `f'Tag({self.valeur!r})'` pour garder les guillemets", correct: true}
      - {text: "Écrire `f'Tag({self.valeur!s})'` pour forcer le texte", correct: false}
      - {text: "Convertir la valeur avec `int()` dans `__init__`", correct: false}
      - {text: "Définir `__str__`, que la liste utilisera à la place", correct: false}
    answer: |-
      ```python
      def __repr__(self):
          return f"Tag({self.valeur!r})"   # [Tag(1), Tag('1')]
      ```
      `!r` affiche le `repr` de la valeur : une chaîne garde ses guillemets, et le `repr` redevient sans ambiguïté.
  - key: difference-repr-str
    format: course
    question: "Quelle différence entre `__repr__` et `__str__` ?"
    choices:
      - {text: "`__repr__` vise le développeur, sans ambiguïté ; `__str__` vise l'utilisateur", correct: true}
      - {text: "`__repr__` sert à `print` ; `__str__` sert aux listes et au débogueur", correct: false}
      - {text: "`__repr__` renvoie des octets ; `__str__` renvoie une chaîne lisible", correct: false}
      - {text: "`__repr__` est appelé une fois ; `__str__` à chaque affichage", correct: false}
    answer: "Un bon `repr` ressemble au code qui recrée l'objet, `Point(x=2, y=3)` ; un bon `str` est un texte pour l'utilisateur, `(2, 3)`."
  - key: repli-sur-repr
    format: course
    question: "Que fait `print(obj)` quand la classe définit `__repr__`, mais pas `__str__` ?"
    choices:
      - {text: "Il utilise `__repr__` : `__str__` s'y rabat par défaut", correct: true}
      - {text: "Il affiche l'adresse de l'objet, comme sans `__repr__`", correct: false}
      - {text: "Il lève une `TypeError` : `__str__` est obligatoire", correct: false}
      - {text: "Il affiche le nom de la classe seul, sans attributs", correct: false}
    answer: "Le `__str__` hérité d'`object` appelle `__repr__`. C'est pourquoi, si l'on n'en écrit qu'une, on écrit `__repr__`."
  - key: elements-liste
    format: course
    question: "Quand tu affiches une liste d'objets, quelle méthode Python appelle-t-il sur chaque élément ?"
    choices:
      - {text: "`__repr__`, même si les éléments définissent `__str__`", correct: true}
      - {text: "`__str__`, comme pour un objet affiché seul", correct: false}
      - {text: "`__format__`, avec une spécification vide", correct: false}
      - {text: "`__iter__`, pour parcourir chaque élément", correct: false}
    answer: "Les conteneurs montrent le `repr` de leurs éléments : `print(['a'])` affiche `['a']`, avec les guillemets."
  - key: bon-repr
    format: course
    question: "À quoi ressemble un bon `__repr__` pour un point de coordonnées 2 et 3 ?"
    choices:
      - {text: "`Point(x=2, y=3)` : il dit le type et recrée l'objet", correct: true}
      - {text: "`(2, 3)` : la forme la plus lisible pour un humain", correct: false}
      - {text: "`<Point object at 0x7f3a>` : l'adresse identifie l'objet", correct: false}
      - {text: "`Point` : le nom de la classe suffit à déboguer", correct: false}
    answer: "Un `repr` sans ambiguïté, qu'on pourrait recopier pour recréer l'objet. `(2, 3)` convient au `__str__`."
