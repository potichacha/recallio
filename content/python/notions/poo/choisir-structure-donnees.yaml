notion: choisir-structure-donnees
lesson: |-
  Pour regrouper quelques données nommées, la bibliothèque standard offre quatre outils. Ils se ressemblent, mais ne
  servent pas aux mêmes choses.

  ```python
  from collections import namedtuple
  from dataclasses import dataclass
  from typing import NamedTuple, TypedDict

  point = {"x": 1, "y": 2}                     # dict


  class PointDict(TypedDict):                  # un dict, aux clés vérifiées par mypy
      x: int
      y: int


  class PointNT(NamedTuple):                   # un tuple aux champs nommés
      x: int
      y: int


  @dataclass(frozen=True, slots=True)          # une vraie classe
  class Point:
      x: int
      y: int
  ```

  | | `dict` | `TypedDict` | `namedtuple` / `NamedTuple` | dataclass |
  |---|---|---|---|---|
  | À l'exécution | un dictionnaire | un dictionnaire | un tuple | une instance de classe |
  | Accès | `p["x"]` | `p["x"]` | `p.x`, `p[0]`, déballage | `p.x` |
  | Modifiable | oui | oui | non | oui, ou `frozen=True` |
  | Vérifié par mypy | non (`dict[str, Any]`) | les clés et leurs types | les champs | les champs |
  | Méthodes, validation | non | non | des méthodes, pas de validation | oui, `__post_init__` |
  | Vers JSON | direct | direct | `_asdict()` | `dataclasses.asdict` |

  - **`dict`** : quand les clés ne sont pas connues d'avance (des réglages libres, des comptes par mot).
  - **`TypedDict`** : un JSON qui reste un dictionnaire (une réponse d'API), mais dont mypy connaît les clés. Rien
    n'est vérifié à l'exécution.
  - **`namedtuple`** : un petit enregistrement immuable et léger, qui se déballe comme un tuple
    (`mini, maxi = stats(...)`). Piège : il reste un tuple, égal à `(1, 2)` et indexable par position.
  - **dataclass** : le choix par défaut pour un objet du domaine, avec des valeurs par défaut, des méthodes et une
    validation ; `frozen=True` pour une valeur, `slots=True` pour la mémoire.
  - **Une classe écrite à la main** quand le comportement et les invariants dominent les données.
  - Aucun ne valide une donnée venue de l'extérieur : on le fait dans `__post_init__`, ou avec une bibliothèque comme
    pydantic, hors de la bibliothèque standard.

  **En entretien** : « Un `dict` pour des clés libres ; un `TypedDict` pour un JSON qui reste un dictionnaire mais
  dont mypy vérifie les clés ; un `namedtuple` pour un petit enregistrement immuable qui se déballe comme un tuple ; une
  dataclass, par défaut, pour un objet du domaine avec méthodes et validation. Aucun ne valide les données à
  l'exécution. »
cards:
  - key: vf-typeddict-execution
    format: true-false
    question: "À l'exécution, un `TypedDict` est un simple `dict` : rien ne vérifie ses clés."
    truth: true
    answer: "`TypedDict` n'existe que pour les vérificateurs de types comme mypy. `PointDict(x=1)` crée un dictionnaire ordinaire, même sans la clé `y`."
  - key: vf-namedtuple-egal-tuple
    format: true-false
    question: "Le `namedtuple` `Point(1, 2)` est égal au tuple ordinaire `(1, 2)`."
    truth: true
    answer: "Un `namedtuple` est un tuple : l'égalité compare les éléments, pas les noms. `Point(1, 2) == Taille(1, 2)` vaut aussi `True`."
  - key: vf-namedtuple-modifiable
    format: true-false
    question: "On peut modifier le champ d'un `namedtuple` après sa création : `p.x = 3`."
    truth: false
    answer: "Un tuple est immuable : `AttributeError`. `p._replace(x=3)` renvoie un nouveau `namedtuple`."
  - key: vf-dataclass-json
    format: true-false
    question: "`json.dumps` accepte directement une instance de dataclass."
    truth: false
    answer: "`TypeError: Object of type Point is not JSON serializable`. On passe par `dataclasses.asdict(p)`, qui donne un dictionnaire."
  - key: qcm-json-api
    format: multiple-choice
    question: "Tu reçois le JSON d'une API, et veux que mypy vérifie ses clés, sans changer l'objet manipulé. Que choisis-tu ?"
    choices:
      - {text: "Un `TypedDict`", correct: true}
      - {text: "Une dataclass", correct: false}
      - {text: "Un `namedtuple`", correct: false}
      - {text: "Un `dict[str, Any]`", correct: false}
    answer: "Le `TypedDict` décrit les clés d'un dictionnaire sans le transformer. `dict[str, Any]` n'apprend rien à mypy ; les deux autres demandent une conversion."
  - key: qcm-immuable-leger
    format: multiple-choice
    question: "Lequel est immuable, se déballe comme un tuple et prend peu de mémoire ?"
    choices:
      - {text: "Un `namedtuple`", correct: true}
      - {text: "Une dataclass sans option", correct: false}
      - {text: "Un `dict`", correct: false}
      - {text: "Un `TypedDict`", correct: false}
    answer: "Un `namedtuple` n'a pas de `__dict__` par instance : il pèse autant qu'un tuple. Une dataclass sans option est modifiable et ne se déballe pas."
  - key: qcm-defauts-methodes-validation
    format: multiple-choice
    question: "Quelle structure de la bibliothèque standard offre champs modifiables, valeurs par défaut, méthodes et validation dans `__post_init__` ?"
    choices:
      - {text: "Une dataclass", correct: true}
      - {text: "Un `namedtuple`", correct: false}
      - {text: "Un `TypedDict`", correct: false}
      - {text: "Un `dict`", correct: false}
    answer: "`__post_init__` n'existe que dans les dataclasses. Un `namedtuple` accepte des défauts et des méthodes, mais reste immuable."
  - key: qcm-vers-dictionnaire
    format: multiple-choice
    question: "Comment transformer une instance de dataclass en dictionnaire, pour l'envoyer en JSON ?"
    choices:
      - {text: "`dataclasses.asdict(obj)`", correct: true}
      - {text: "`dict(obj)`", correct: false}
      - {text: "`obj.__dict__()`", correct: false}
      - {text: "`json.loads(obj)`", correct: false}
    answer: "`asdict` convertit récursivement, y compris les dataclasses imbriquées. `dict(obj)` exige un itérable de paires ; `__dict__` est un attribut, pas une méthode."
  - key: situation-retour-deballe
    format: scenario
    question: |-
      Ta fonction `stats` renvoie un minimum, un maximum et une moyenne, et on l'appelle partout avec
      `mini, maxi, moy = stats(valeurs)`. Tu veux des noms lisibles sans casser ces appels. Que choisis-tu ?
    choices:
      - {text: "Un `NamedTuple`, qui se déballe toujours comme un tuple", correct: true}
      - {text: "Une dataclass, qui se déballe aussi comme un tuple", correct: false}
      - {text: "Un dictionnaire, que le déballage parcourt par ses valeurs", correct: false}
      - {text: "Une classe avec `__slots__`, plus légère qu'un tuple", correct: false}
    answer: "Le `NamedTuple` ajoute `r.mini`, `r.maxi`, sans rien retirer au tuple. Une dataclass n'est pas itérable, et déballer un dictionnaire donne ses clés."
  - key: situation-commande
    format: scenario
    question: |-
      Tu modélises une `Commande` : des lignes qu'on ajoute, un statut qui change, des règles de validation. Que
      choisis-tu ?
    choices:
      - {text: "Une dataclass, avec ses méthodes et un `__post_init__`", correct: true}
      - {text: "Un `namedtuple`, immuable donc plus sûr à partager", correct: false}
      - {text: "Un `TypedDict`, que mypy vérifie partout", correct: false}
      - {text: "Un dictionnaire, pour garder toute la souplesse", correct: false}
    answer: "L'objet change et porte des règles : une classe, ici une dataclass, avec ses méthodes. Un `namedtuple` ne change pas ; un dictionnaire n'a ni méthodes ni validation."
  - key: situation-reglages-libres
    format: scenario
    question: |-
      Tu lis un fichier de réglages dont les clés varient selon les modules installés. Que choisis-tu ?
    choices:
      - {text: "Un `dict`, puisque les clés ne sont pas connues d'avance", correct: true}
      - {text: "Une dataclass gelée, avec un champ par clé possible", correct: false}
      - {text: "Un `namedtuple` créé à chaque lecture du fichier", correct: false}
      - {text: "Un `TypedDict` qui liste toutes les clés imaginables", correct: false}
    answer: "Les structures à champs fixes supposent de connaître les clés. Des clés ouvertes appellent un dictionnaire, quitte à valider les clés connues."
  - key: situation-millions-de-points
    format: scenario
    question: |-
      Tu stockes des millions de points `(x, y)` immuables, et la mémoire compte. Que choisis-tu ?
    choices:
      - {text: "Un `namedtuple`, ou une dataclass `frozen=True, slots=True`", correct: true}
      - {text: "Une dataclass sans option, avec son `__dict__` par instance", correct: false}
      - {text: "Un dictionnaire `{\"x\": ..., \"y\": ...}` pour chaque point", correct: false}
      - {text: "Une classe ordinaire, sans `__slots__`, pour la souplesse", correct: false}
    answer: "Sans `__dict__` par instance, chaque point coûte bien moins de mémoire. Un dictionnaire par point est la solution la plus lourde."
  - key: choix-par-defaut
    format: course
    question: "Quel est le choix par défaut pour un objet du domaine, avec des champs nommés et du comportement ?"
    choices:
      - {text: "Une dataclass", correct: true}
      - {text: "Un `namedtuple`", correct: false}
      - {text: "Un `TypedDict`", correct: false}
      - {text: "Un `dict`", correct: false}
    answer: "Elle a des champs typés, des défauts, des méthodes et une validation, et devient immuable avec `frozen=True`. Les autres conviennent à des cas plus étroits."
  - key: piege-namedtuple
    format: course
    question: "Quel piège présente un `namedtuple` utilisé comme objet du domaine ?"
    choices:
      - {text: "Il reste un tuple : égal à tout tuple de mêmes valeurs, et indexable", correct: true}
      - {text: "Il ne peut pas avoir plus de trois champs nommés", correct: false}
      - {text: "Il est modifiable, donc dangereux à partager entre fonctions", correct: false}
      - {text: "Il ne peut pas recevoir d'annotations de type", correct: false}
    answer: "`Prix(10, \"EUR\") == (10, \"EUR\")` vaut `True`, et `p[0]` marche : deux types différents se confondent. Une dataclass gelée évite ces confusions."
  - key: typeddict-ou-dataclass
    format: course
    question: "Quelle différence entre un `TypedDict` et une dataclass ?"
    choices:
      - {text: "Le `TypedDict` reste un `dict` typé pour mypy ; la dataclass crée une vraie classe", correct: true}
      - {text: "Le `TypedDict` vérifie les types à l'exécution ; la dataclass ne vérifie rien", correct: false}
      - {text: "La dataclass est réservée aux données immuables ; le `TypedDict` aux autres", correct: false}
      - {text: "Aucune : ce sont deux syntaxes pour exactement le même objet", correct: false}
    answer: "Le `TypedDict` décrit un dictionnaire existant, sans coût ni méthode. La dataclass crée des instances, avec `__init__`, `__repr__`, `__eq__` et tes méthodes. Aucun ne vérifie les types à l'exécution."
  - key: valider-entree-externe
    format: course
    question: "Ni les dataclasses ni les `TypedDict` ne valident les données reçues. Que faire pour un JSON venu de l'extérieur ?"
    choices:
      - {text: "Valider explicitement, dans `__post_init__` ou avec une bibliothèque comme pydantic", correct: true}
      - {text: "Rien : les annotations de type suffisent à refuser les mauvaises données", correct: false}
      - {text: "Convertir le JSON en `namedtuple`, qui vérifie les types de ses champs", correct: false}
      - {text: "Lancer Python avec l'option `-O`, qui contrôle les annotations", correct: false}
    answer: "Les annotations ne sont pas vérifiées à l'exécution. Une donnée externe se valide : à la main dans `__post_init__`, ou par une bibliothèque de validation."
