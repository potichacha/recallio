notion: mro
lesson: |-
  Python permet l'**héritage multiple** : `class C(A, B)`. Pour savoir où chercher une méthode, chaque classe a un
  **ordre de résolution des méthodes** (*Method Resolution Order*, MRO) : la liste de la classe et de ses ancêtres,
  dans l'ordre où Python les parcourt.

  ```python
  class A:
      def qui(self):
          return "A"


  class B(A):
      def qui(self):
          return "B"


  class C(A):
      def qui(self):
          return "C"


  class D(B, C):          # le losange : B et C héritent tous deux d'A
      pass


  print([k.__name__ for k in D.__mro__])   # ['D', 'B', 'C', 'A', 'object']
  print(D().qui())                         # B
  ```

  **Les règles de la linéarisation C3**, l'algorithme de Python :

  - une classe passe **avant ses parents** ;
  - les parents gardent **l'ordre de la déclaration** : dans `D(B, C)`, `B` avant `C` ;
  - chaque classe n'apparaît **qu'une fois** : dans le losange, `A` vient après `B` et `C`, puis `object` à la fin.

  Si ces règles se contredisent, la classe n'est pas créée : `class C(A, B)` avec `B` sous-classe d'`A` lève
  `TypeError: Cannot create a consistent method resolution order (MRO)`. Un parent doit être écrit après ses
  sous-classes.

  **`super()` suit le MRO de l'objet**, pas le parent écrit dans la classe : dans `B.qui`, `super().qui()` appelle
  `C.qui` si l'objet est un `D`. C'est ce qui permet l'**héritage coopératif** :

  ```python
  class Base:
      def __init__(self, **kwargs):
          super().__init__(**kwargs)

  class Nomme(Base):
      def __init__(self, nom, **kwargs):
          super().__init__(**kwargs)          # transmet ce qu'elle ne consomme pas
          self.nom = nom
  ```

  Pour que tous les `__init__` s'exécutent, chaque classe appelle `super().__init__(**kwargs)` et garde la même
  signature d'une méthode à l'autre. Un appel direct `A.__init__(self)` saute les autres classes du MRO.

  Pour voir le MRO : `D.__mro__` (un tuple) ou `D.mro()` (une liste). `D.__bases__` ne donne que les parents directs.

  **En entretien** : « Le MRO est l'ordre où Python cherche une méthode, calculé par la linéarisation C3 : chaque classe
  avant ses parents, les parents dans l'ordre déclaré, chacun une seule fois. `super()` suit le MRO de l'objet, pas le
  parent direct : avec l'héritage multiple, chaque classe doit appeler `super()` en transmettant ses arguments. »
cards:
  - key: definition-mro
    format: course
    question: "Qu'est-ce que le MRO d'une classe ?"
    choices:
      - {text: "L'ordre dans lequel Python cherche une méthode parmi la classe et ses ancêtres", correct: true}
      - {text: "La liste des méthodes redéfinies par la classe, triée par nom", correct: false}
      - {text: "L'ordre dans lequel les `__init__` des parents sont appelés tout seuls", correct: false}
      - {text: "La profondeur d'héritage maximale que Python autorise", correct: false}
    answer: "*Method Resolution Order* : `Classe.__mro__` le donne. La première classe de la liste qui définit la méthode l'emporte."
  - key: super-suit-mro
    format: course
    question: "Avec l'héritage multiple, à quelle classe `super()` délègue-t-il ?"
    choices:
      - {text: "À la suivante dans le MRO de l'objet, pas forcément au parent direct", correct: true}
      - {text: "Toujours au premier parent écrit dans la déclaration de la classe", correct: false}
      - {text: "À tous les parents, l'un après l'autre, dans l'ordre déclaré", correct: false}
      - {text: "À `object`, la racine commune de toutes les classes", correct: false}
    answer: "Dans un losange `D(B, C)`, `super()` dans `B` mène à `C` quand l'objet est un `D` : `B` ne sait pas qui viendra après lui."
  - key: losange
    format: course
    question: "Dans un losange `D(B, C)`, avec `B(A)` et `C(A)`, où et combien de fois `A` apparaît-elle dans le MRO de `D` ?"
    choices:
      - {text: "Une fois, après `B` et `C`", correct: true}
      - {text: "Deux fois : après `B`, puis après `C`", correct: false}
      - {text: "Une fois, juste après `B`", correct: false}
      - {text: "Aucune : `B` et `C` la masquent", correct: false}
    answer: "`D, B, C, A, object` : une classe passe avant ses parents, et chacune n'apparaît qu'une fois. `A` attend donc que `B` et `C` soient passées."
  - key: algorithme-c3
    format: course
    question: "Quel algorithme Python utilise-t-il pour calculer le MRO ?"
    choices:
      - {text: "La linéarisation C3", correct: true}
      - {text: "Un parcours en profondeur, de gauche à droite", correct: false}
      - {text: "Un parcours en largeur, niveau par niveau", correct: false}
      - {text: "L'ordre alphabétique des classes parentes", correct: false}
    answer: "C3 garde l'ordre local de chaque déclaration et place chaque classe avant ses parents. Un simple parcours en profondeur mettrait `A` avant `C` dans le losange."
  - key: vf-attribut-mro
    format: true-false
    question: "`D.__mro__` donne le MRO de la classe `D` sous forme de tuple."
    truth: true
    answer: "`D.mro()` le donne sous forme de liste. Les deux commencent par `D` et finissent par `object`."
  - key: vf-gauche-d-abord
    format: true-false
    question: "Dans `class C(A, B)`, une méthode définie à la fois dans `A` et dans `B` est prise dans `A`."
    truth: true
    answer: "Les parents sont parcourus dans l'ordre de la déclaration : `C, A, B, object`."
  - key: vf-mro-impossible
    format: true-false
    question: "Python accepte toute combinaison de classes parentes, quitte à choisir un ordre arbitraire."
    truth: false
    answer: "Si les contraintes se contredisent, comme `class C(A, B)` avec `B` sous-classe d'`A`, la création de la classe lève une `TypeError`."
  - key: vf-object-dernier
    format: true-false
    question: "`object` est le dernier élément du MRO de toute classe."
    truth: true
    answer: "Toutes les classes en héritent, et une classe passe toujours avant ses parents : `object` ferme la liste."
  - key: qcm-ordre-simple
    format: multiple-choice
    question: "On définit `class A: ...`, `class B: ...` et `class C(A, B): ...`. Quel est le MRO de `C` ?"
    choices:
      - {text: "`C, A, B, object`", correct: true}
      - {text: "`C, B, A, object`", correct: false}
      - {text: "`C, A, object, B, object`", correct: false}
      - {text: "`A, B, C, object`", correct: false}
    answer: "La classe d'abord, puis ses parents dans l'ordre déclaré, et `object` une seule fois, à la fin."
  - key: qcm-afficher-mro
    format: multiple-choice
    question: "Comment affiches-tu l'ordre de résolution des méthodes de la classe `D` ?"
    choices:
      - {text: "`print(D.__mro__)`", correct: true}
      - {text: "`print(D.__bases__)`", correct: false}
      - {text: "`print(D.__dict__)`", correct: false}
      - {text: "`print(dir(D))`", correct: false}
    answer: "`__bases__` ne donne que les parents directs ; `__dict__` les attributs définis dans `D` ; `dir` tous les noms accessibles, triés."
  - key: qcm-heritage-cooperatif
    format: multiple-choice
    question: "Avec l'héritage multiple, comment chaque classe garantit-elle que chaque `__init__` du MRO s'exécute une fois et une seule ?"
    choices:
      - {text: "Appeler `super().__init__(**kwargs)`, en transmettant ce qu'elle ne consomme pas", correct: true}
      - {text: "Appeler explicitement `A.__init__(self)`, puis `B.__init__(self)`", correct: false}
      - {text: "Rien : Python appelle tous les `__init__` du MRO l'un après l'autre", correct: false}
      - {text: "Déclarer ses classes parentes dans l'ordre alphabétique", correct: false}
    answer: "Chaque `super()` passe à la classe suivante du MRO. Les appels directs exécutent deux fois une base commune, ou en sautent une."
  - key: qcm-bases
    format: multiple-choice
    question: "Que contient `D.__bases__` ?"
    choices:
      - {text: "Les parents directs de `D`, dans l'ordre de la déclaration", correct: true}
      - {text: "Tout le MRO de `D`, jusqu'à `object`", correct: false}
      - {text: "Les sous-classes de `D` déjà définies", correct: false}
      - {text: "Les méthodes que `D` hérite de ses parents", correct: false}
    answer: "Pour `class D(B, C)`, `D.__bases__` vaut `(B, C)`. Le MRO complet est dans `D.__mro__`, et les sous-classes dans `D.__subclasses__()`."
  - key: code-ordre-des-parents
    format: code-output
    question: |-
      ```python
      class A:
          def qui(self):
              return "A"


      class B:
          def qui(self):
              return "B"


      class C(A, B):
          pass


      class D(B, A):
          pass


      print(C().qui(), D().qui())
      ```
    answer: "`A B` : le premier parent déclaré qui définit la méthode l'emporte."
    check:
      output: "A B"
    choices:
      - {text: "`A B`", correct: true}
      - {text: "`A A`", correct: false}
      - {text: "`B A`", correct: false}
      - {text: "`B B`", correct: false}
  - key: code-mro-losange
    format: code-output
    question: |-
      ```python
      class A:
          pass


      class B(A):
          pass


      class C(A):
          pass


      class D(B, C):
          pass


      print([k.__name__ for k in D.__mro__])
      ```
    answer: "`['D', 'B', 'C', 'A', 'object']` : `A` attend que ses deux sous-classes soient passées."
    check:
      output: "['D', 'B', 'C', 'A', 'object']"
    choices:
      - {text: "`['D', 'B', 'C', 'A', 'object']`", correct: true}
      - {text: "`['D', 'B', 'A', 'C', 'object']`", correct: false}
      - {text: "`['D', 'B', 'A', 'C', 'A', 'object']`", correct: false}
      - {text: "`['D', 'C', 'B', 'A', 'object']`", correct: false}
  - key: code-super-cooperatif
    format: code-output
    question: |-
      ```python
      class A:
          def saluer(self):
              return ["A"]


      class B(A):
          def saluer(self):
              return ["B"] + super().saluer()


      class C(A):
          def saluer(self):
              return ["C"] + super().saluer()


      class D(B, C):
          def saluer(self):
              return ["D"] + super().saluer()


      print(D().saluer())
      ```
    answer: "`['D', 'B', 'C', 'A']` : dans `B`, `super()` mène à `C`, la classe suivante du MRO de `D`, et non à `A`."
    check:
      output: "['D', 'B', 'C', 'A']"
    choices:
      - {text: "`['D', 'B', 'C', 'A']`", correct: true}
      - {text: "`['D', 'B', 'A']`", correct: false}
      - {text: "`['D', 'B', 'A', 'C', 'A']`", correct: false}
      - {text: "`['D', 'C', 'B', 'A']`", correct: false}
  - key: code-mro-incoherent
    format: code-output
    question: |-
      ```python
      class A:
          pass


      class B(A):
          pass


      try:
          class C(A, B):
              pass
          print("créée")
      except TypeError:
          print("MRO impossible")
      ```
    answer: "`MRO impossible` : `C(A, B)` demande `A` avant `B`, mais `B` doit passer avant son parent `A`. Les deux règles se contredisent."
    check:
      output: "MRO impossible"
    choices:
      - {text: "`MRO impossible`", correct: true}
      - {text: "`créée`", correct: false}
      - {text: "`créée MRO impossible`", correct: false}
      - {text: "`A B`", correct: false}
  - key: bug-init-non-cooperatif
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « AttributeError: 'Document' object has no attribute 'signature' » :
      ```python
      class Base:
          def __init__(self):
              self.journal = []


      class Horodate(Base):
          def __init__(self):
              Base.__init__(self)
              self.cree_le = "2026-11-17"


      class Signe(Base):
          def __init__(self):
              Base.__init__(self)
              self.signature = "ana"


      class Document(Horodate, Signe):
          def __init__(self):
              Horodate.__init__(self)


      d = Document()
      print(d.signature)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `super().__init__()` dans chaque classe, `Document` comprise", correct: true}
      - {text: "Inverser les parents : `class Document(Signe, Horodate)`", correct: false}
      - {text: "Supprimer `Base.__init__(self)` dans `Horodate` et `Signe`", correct: false}
      - {text: "Déclarer `signature = None` dans le corps de `Document`", correct: false}
    answer: |-
      ```python
      class Horodate(Base):
          def __init__(self):
              super().__init__()
              self.cree_le = "2026-11-17"


      class Signe(Base):
          def __init__(self):
              super().__init__()
              self.signature = "ana"


      class Document(Horodate, Signe):
          pass   # hérite de Horodate.__init__, qui suit le MRO
      ```
      Les appels directs sautent `Signe`. Avec `super()`, le MRO `Document, Horodate, Signe, Base` est suivi : chaque
      `__init__` s'exécute une fois. Inverser les parents ne change rien : `Document` appelle toujours
      `Horodate.__init__` directement.
  - key: bug-ordre-incoherent
    format: bug-fix
    question: |-
      Ce programme s'arrête, à la définition de la classe, sur « TypeError: Cannot create a consistent method resolution
      order (MRO) for bases Vehicule, Voiture ».
      ```python
      class Vehicule:
          pass


      class Voiture(Vehicule):
          pass


      class VoitureElectrique(Vehicule, Voiture):
          pass
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Hériter de `Voiture` seule, qui hérite déjà de `Vehicule`", correct: true}
      - {text: "Faire hériter `Voiture` de `object` et de `Vehicule`", correct: false}
      - {text: "Ajouter `object` à la fin des parents de `VoitureElectrique`", correct: false}
      - {text: "Déclarer `VoitureElectrique` avant `Voiture` dans le fichier", correct: false}
    answer: |-
      ```python
      class VoitureElectrique(Voiture):
          pass
      ```
      `Vehicule` écrit avant `Voiture` exige qu'elle passe en premier, mais une classe doit passer avant ses parents.
      `Vehicule` est déjà un ancêtre de `Voiture` : la répéter n'apporte rien.
  - key: bug-kwargs-perdus
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: Nomme.__init__() missing 1 required positional argument: 'nom' » :
      ```python
      class Base:
          def __init__(self, **kwargs):
              super().__init__(**kwargs)


      class Nomme(Base):
          def __init__(self, nom, **kwargs):
              super().__init__(**kwargs)
              self.nom = nom


      class Colore(Base):
          def __init__(self, couleur, **kwargs):
              super().__init__()
              self.couleur = couleur


      class Pion(Colore, Nomme):
          pass


      p = Pion(nom="roi", couleur="noir")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `super().__init__(**kwargs)` dans `Colore`", correct: true}
      - {text: "Appeler `Nomme.__init__(self, nom)` dans `Colore`", correct: false}
      - {text: "Créer le pion avec des arguments positionnels", correct: false}
      - {text: "Ajouter un paramètre `nom=None` à `Colore.__init__`", correct: false}
    answer: |-
      ```python
      class Colore(Base):
          def __init__(self, couleur, **kwargs):
              super().__init__(**kwargs)
              self.couleur = couleur
      ```
      Dans le MRO `Pion, Colore, Nomme, Base`, le `super()` de `Colore` mène à `Nomme`. Sans `**kwargs`, `nom` est
      perdu en route ; le recevoir dans `Colore` sans le transmettre ne changerait rien. Appeler `Nomme` directement
      lierait `Colore` à une classe qu'il n'a pas à connaître.
  - key: bug-signatures-differentes
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: Chiffre.enregistrer() missing 1 required positional argument: 'cle' » :
      ```python
      class Stockage:
          def enregistrer(self, donnees):
              print("enregistré :", donnees)


      class Compresse(Stockage):
          def enregistrer(self, donnees):
              super().enregistrer(donnees.lower())


      class Chiffre(Stockage):
          def enregistrer(self, donnees, cle):
              super().enregistrer(donnees[::-1])


      class Coffre(Compresse, Chiffre):
          pass


      Coffre().enregistrer("SECRET")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Garder la même signature partout : la clé passe par l'objet, pas par `enregistrer`", correct: true}
      - {text: "Appeler `Stockage.enregistrer` dans `Compresse`, pour sauter `Chiffre`", correct: false}
      - {text: "Inverser les parents : `class Coffre(Chiffre, Compresse)`", correct: false}
      - {text: "Ajouter un paramètre `cle=None` à `Compresse.enregistrer`, sans le transmettre", correct: false}
    answer: |-
      ```python
      class Chiffre(Stockage):
          def __init__(self, cle="k"):
              self.cle = cle

          def enregistrer(self, donnees):
              super().enregistrer(donnees[::-1])
      ```
      Le `super()` de `Compresse` mène à `Chiffre`, la suivante du MRO de `Coffre`, avec un seul argument. Dans une
      hiérarchie coopérative, une méthode garde la même signature à chaque niveau. Sauter `Chiffre` ferait taire
      l'erreur, mais les données ne seraient plus chiffrées.
