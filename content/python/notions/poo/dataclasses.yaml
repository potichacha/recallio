notion: dataclasses
lesson: |-
  Une classe qui porte surtout des données demande toujours le même code : un `__init__` qui recopie ses arguments, un
  `__repr__`, un `__eq__`. Le décorateur **`@dataclass`** les écrit à partir des **champs annotés**.

  ```python
  from dataclasses import dataclass, field


  @dataclass
  class Article:
      nom: str
      prix: float
      quantite: int = 1                                   # une valeur par défaut
      etiquettes: list[str] = field(default_factory=list)  # une nouvelle liste par instance

      def total(self):
          return self.prix * self.quantite


  a = Article("stylo", 1.5, 2)
  print(a)                        # Article(nom='stylo', prix=1.5, quantite=2, etiquettes=[])
  a == Article("stylo", 1.5, 2)   # True : comparaison champ par champ
  ```

  - **Un champ, c'est une annotation** dans le corps de la classe. Un attribut sans annotation (`actif = True`) n'est
    pas un champ : il n'entre pas dans `__init__`. Une annotation `ClassVar[...]` non plus.
  - **Les annotations ne sont pas vérifiées** à l'exécution : `Article(42, "x")` est accepté.
  - **Un champ sans défaut ne suit pas un champ avec défaut** : `TypeError: non-default argument 'quantite' follows
    default argument 'prix'`.
  - **Pas de liste, de dictionnaire ni d'ensemble comme défaut** : `ValueError: mutable default <class 'list'> for
    field etiquettes is not allowed: use default_factory`. `field(default_factory=list)` crée une liste par instance.
  - **`__post_init__`** s'exécute après le `__init__` généré : validation, champ calculé (`field(init=False)`).

  | Option | Effet |
  |---|---|
  | `frozen=True` | affecter un champ lève `dataclasses.FrozenInstanceError` ; l'objet est hachable |
  | `order=True` | `<`, `<=`, `>`, `>=` comparent les tuples des champs, dans l'ordre |
  | `slots=True` | des `__slots__` générés : moins de mémoire, pas d'attribut imprévu |
  | `kw_only=True` | des arguments nommés seulement, dans `__init__` |
  | `eq=False` | pas de `__eq__` : l'égalité reste l'identité |

  - Avec `eq=True` (le défaut) sans `frozen=True`, **`__hash__` vaut `None`** : l'objet modifiable n'est pas hachable.
  - Outils : `dataclasses.replace(obj, champ=valeur)` (une copie modifiée, utile pour un objet gelé), `asdict`,
    `astuple`, `fields`.

  **En entretien** : « `@dataclass` génère `__init__`, `__repr__` et `__eq__` à partir des champs annotés, sans
  vérifier les types. Un défaut modifiable passe par `field(default_factory=list)`, et `__post_init__` valide.
  `frozen=True` rend l'objet immuable et hachable, `order=True` ajoute les comparaisons, `slots=True` économise la
  mémoire. »
cards:
  - key: vf-methodes-generees
    format: true-false
    question: "`@dataclass` écrit pour toi `__init__`, `__repr__` et `__eq__`, à partir des champs annotés."
    truth: true
    answer: "Ce sont les trois méthodes générées par défaut. `order=True` ajoute les comparaisons, `frozen=True` un `__hash__` et l'interdiction d'affecter."
  - key: vf-types-non-verifies
    format: true-false
    question: "Une dataclass vérifie, à l'exécution, le type des valeurs passées à son constructeur."
    truth: false
    answer: "Les annotations servent à repérer les champs et aux outils comme mypy. `Article(42, \"x\")` est accepté ; une validation s'écrit dans `__post_init__`."
  - key: vf-frozen-hachable
    format: true-false
    question: "Une dataclass `frozen=True`, avec l'égalité par défaut, est hachable."
    truth: true
    answer: "Ses champs ne changent plus : un `__hash__` fondé sur eux est sûr. Elle peut servir de clé de dictionnaire ou d'élément de `set`."
  - key: vf-liste-par-defaut
    format: true-false
    question: "`etiquettes: list = []` dans une dataclass donne à chaque instance sa propre liste vide."
    truth: false
    answer: "La dataclass refuse ce défaut : `ValueError: mutable default <class 'list'> for field etiquettes is not allowed: use default_factory`. Une seule liste serait partagée par toutes les instances."
  - key: qcm-default-factory
    format: multiple-choice
    question: "Comment donner une liste vide par défaut à un champ de dataclass ?"
    choices:
      - {text: "`field(default_factory=list)`", correct: true}
      - {text: "`field(default=[])`", correct: false}
      - {text: "`= list`", correct: false}
      - {text: "`= []`", correct: false}
    answer: "`default_factory` est appelée à chaque création : une nouvelle liste par instance. `= list` donnerait la classe `list` elle-même comme valeur."
  - key: qcm-frozen-exception
    format: multiple-choice
    question: "Quelle exception lève l'affectation d'un champ d'une dataclass `frozen=True` ?"
    choices:
      - {text: "`dataclasses.FrozenInstanceError`", correct: true}
      - {text: "`TypeError`", correct: false}
      - {text: "`ValueError`", correct: false}
      - {text: "`PermissionError`", correct: false}
    answer: "`FrozenInstanceError: cannot assign to field 'nom'`. Elle hérite d'`AttributeError`."
  - key: qcm-post-init
    format: multiple-choice
    question: "Quelle méthode d'une dataclass s'exécute juste après le `__init__` généré, pour valider ou calculer un champ ?"
    choices:
      - {text: "`__post_init__`", correct: true}
      - {text: "`__init_subclass__`", correct: false}
      - {text: "`__after_init__`", correct: false}
      - {text: "`__validate__`", correct: false}
    answer: "Le `__init__` généré l'appelle en dernier. `__init_subclass__` s'exécute à la définition d'une sous-classe ; les deux autres n'existent pas."
  - key: qcm-replace
    format: multiple-choice
    question: "Comment obtenir une copie d'une dataclass gelée `p`, avec le champ `x` changé ?"
    choices:
      - {text: "`dataclasses.replace(p, x=3)`", correct: true}
      - {text: "`p.replace(x=3)`", correct: false}
      - {text: "`p.copy(x=3)`", correct: false}
      - {text: "`type(p)(x=3)`", correct: false}
    answer: "`replace` crée un nouvel objet avec les autres champs recopiés (`copy.replace` fait de même depuis Python 3.13). Une dataclass n'a pas de méthode `replace` ni `copy`, et `type(p)(x=3)` oublierait les autres champs."
  - key: trous-decorateur
    format: fill-in
    question: |-
      Complète pour générer `__init__`, `__repr__` et `__eq__` :
      ```python
      from dataclasses import dataclass


      @___
      class Produit:
          nom: str
          prix: float
      ```
    blanks:
      - - dataclass
    answer: "Le décorateur lit les annotations de la classe et génère les méthodes."
  - key: trous-default-factory
    format: fill-in
    question: |-
      Complète pour que chaque tâche ait sa propre liste d'étiquettes :
      ```python
      @dataclass
      class Tache:
          titre: str
          etiquettes: list[str] = field(___=list)
      ```
    blanks:
      - - default_factory
    answer: "`default_factory=list` appelle `list()` à chaque création d'une tâche."
  - key: trous-frozen
    format: fill-in
    question: |-
      Complète pour des instances immuables et hachables :
      ```python
      @dataclass(___=True)
      class Couleur:
          nom: str
          code: str
      ```
    blanks:
      - - frozen
    answer: "`frozen=True` interdit d'affecter les champs après la création, et génère un `__hash__` fondé sur eux."
  - key: trous-post-init
    format: fill-in
    question: |-
      Complète pour refuser un intervalle dont la fin précède le début :
      ```python
      @dataclass
      class Intervalle:
          debut: int
          fin: int

          def ___(self):
              if self.fin < self.debut:
                  raise ValueError("fin avant le début")
      ```
    blanks:
      - - __post_init__
    answer: "Le `__init__` généré appelle `__post_init__` après avoir rangé les champs : c'est la place de la validation."
  - key: code-repr-et-egalite
    format: code-output
    question: |-
      ```python
      from dataclasses import dataclass


      @dataclass
      class Point:
          x: int
          y: int = 0


      print(Point(1), Point(1) == Point(1, 0))
      ```
    answer: "`Point(x=1, y=0) True` : le `__repr__` généré nomme chaque champ, et `__eq__` compare les champs."
    check:
      output: "Point(x=1, y=0) True"
    choices:
      - {text: "`Point(x=1, y=0) True`", correct: true}
      - {text: "`Point(1, 0) True`", correct: false}
      - {text: "`Point(x=1, y=0) False`", correct: false}
      - {text: "`Point(x=1) True`", correct: false}
  - key: code-listes-separees
    format: code-output
    question: |-
      ```python
      from dataclasses import dataclass, field


      @dataclass
      class Panier:
          articles: list = field(default_factory=list)


      a, b = Panier(), Panier()
      a.articles.append("pain")
      print(a.articles, b.articles)
      ```
    answer: "`['pain'] []` : `default_factory` crée une liste neuve pour chaque panier."
    check:
      output: "['pain'] []"
    choices:
      - {text: "`['pain'] []`", correct: true}
      - {text: "`['pain'] ['pain']`", correct: false}
      - {text: "`[] []`", correct: false}
      - {text: "`['pain'] None`", correct: false}
  - key: code-frozen-affectation
    format: code-output
    question: |-
      ```python
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Couleur:
          nom: str


      c = Couleur("bleu")
      print(c, hash(c) == hash(Couleur("bleu")))
      c.nom = "rouge"
      ```
    answer: "La première ligne s'affiche : deux couleurs égales ont le même hachage. Puis l'affectation lève `dataclasses.FrozenInstanceError: cannot assign to field 'nom'`."
    check:
      output: "Couleur(nom='bleu') True"
      throws: dataclasses.FrozenInstanceError
    choices:
      - {text: "`Couleur(nom='bleu') True`, puis une `dataclasses.FrozenInstanceError`", correct: true}
      - {text: "`Couleur(nom='bleu') False`, puis une `dataclasses.FrozenInstanceError`", correct: false}
      - {text: "Une `TypeError` : une dataclass gelée n'est pas hachable", correct: false}
      - {text: "`Couleur(nom='bleu') True`, et rien d'autre", correct: false}
  - key: code-order
    format: code-output
    question: |-
      ```python
      from dataclasses import dataclass


      @dataclass(order=True)
      class Version:
          majeure: int
          mineure: int


      versions = [Version(1, 10), Version(1, 2), Version(0, 99)]
      print(sorted(versions)[0], Version(1, 10) > Version(1, 2))
      ```
    answer: "`order=True` compare les tuples des champs, dans l'ordre : `(0, 99)` est le plus petit, et `(1, 10) > (1, 2)` compare des entiers, pas des chaînes."
    check:
      output: "Version(majeure=0, mineure=99) True"
    choices:
      - {text: "`Version(majeure=0, mineure=99) True`", correct: true}
      - {text: "`Version(majeure=1, mineure=2) True`", correct: false}
      - {text: "`Version(majeure=0, mineure=99) False`", correct: false}
      - {text: "`Version(majeure=1, mineure=10) False`", correct: false}
  - key: bug-liste-defaut
    format: bug-fix
    question: |-
      Ce programme s'arrête, dès la définition de la classe, sur « ValueError: mutable default <class 'list'> for
      field membres is not allowed: use default_factory » :
      ```python
      from dataclasses import dataclass


      @dataclass
      class Equipe:
          nom: str
          membres: list = []
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`membres: list = field(default_factory=list)`", correct: true}
      - {text: "`membres: list = None`, sans rien d'autre", correct: false}
      - {text: "`membres: tuple = []`", correct: false}
      - {text: "`membres = []`, sans annotation", correct: false}
    answer: |-
      ```python
      from dataclasses import dataclass, field


      @dataclass
      class Equipe:
          nom: str
          membres: list = field(default_factory=list)
      ```
      Une liste par défaut serait partagée par toutes les équipes : la dataclass la refuse. Sans annotation,
      `membres` ne serait plus un champ, mais un attribut de classe partagé.
  - key: bug-ordre-defauts
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: non-default argument 'quantite' follows default argument 'prix' » :
      ```python
      from dataclasses import dataclass


      @dataclass
      class Article:
          nom: str
          prix: float = 0.0
          quantite: int
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Placer `quantite` avant `prix`, ou lui donner un défaut", correct: true}
      - {text: "Annoter `quantite` avec `Optional[int]`", correct: false}
      - {text: "Ajouter `order=True` au décorateur", correct: false}
      - {text: "Retirer l'annotation de `quantite`", correct: false}
    answer: |-
      ```python
      @dataclass
      class Article:
          nom: str
          quantite: int
          prix: float = 0.0
      ```
      Le `__init__` généré suit l'ordre des champs : un paramètre sans défaut ne peut pas suivre un paramètre avec
      défaut. `kw_only=True` lèverait aussi la contrainte.
  - key: bug-champ-sans-annotation
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: Utilisateur.__init__() takes 2 positional arguments but 3 were given » :
      ```python
      from dataclasses import dataclass


      @dataclass
      class Utilisateur:
          nom: str
          actif = True


      u = Utilisateur("ana", False)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Annoter le champ : `actif: bool = True`", correct: true}
      - {text: "Écrire `actif = field(default=True)`", correct: false}
      - {text: "Appeler `Utilisateur(\"ana\", actif=False)`", correct: false}
      - {text: "Ajouter `kw_only=True` au décorateur", correct: false}
    answer: |-
      ```python
      @dataclass
      class Utilisateur:
          nom: str
          actif: bool = True
      ```
      Sans annotation, `actif` est un simple attribut de classe, pas un champ : le `__init__` généré ne prend que
      `nom`. `field()` aussi exige une annotation.
  - key: bug-non-hachable
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: cannot use 'Coordonnee' as a set element (unhashable type:
      'Coordonnee') » :
      ```python
      from dataclasses import dataclass


      @dataclass
      class Coordonnee:
          lat: float
          lon: float


      visitees = {Coordonnee(48.85, 2.35)}
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Geler la dataclass : `@dataclass(frozen=True)`", correct: true}
      - {text: "Ajouter `order=True` au décorateur", correct: false}
      - {text: "Ajouter `eq=False` au décorateur", correct: false}
      - {text: "Ranger les coordonnées dans un dictionnaire", correct: false}
    answer: |-
      ```python
      @dataclass(frozen=True)
      class Coordonnee:
          lat: float
          lon: float
      ```
      Avec l'égalité générée et sans `frozen`, `__hash__` vaut `None`. Gelée, la coordonnée devient hachable par ses
      champs. `eq=False` la rendrait hachable, mais par identité : deux mêmes coordonnées seraient deux éléments.
  - key: apport-dataclass
    format: course
    question: "Qu'apporte `@dataclass` à une classe qui sert surtout à porter des données ?"
    choices:
      - {text: "Il génère `__init__`, `__repr__` et `__eq__`, sans code répétitif", correct: true}
      - {text: "Il vérifie le type de chaque champ à chaque création d'objet", correct: false}
      - {text: "Il rend la classe plus rapide que toute autre classe Python", correct: false}
      - {text: "Il enregistre chaque instance dans une base de données", correct: false}
    answer: "Moins de code, donc moins d'oublis : un champ ajouté apparaît partout à la fois, dans le constructeur, l'affichage et la comparaison."
  - key: pourquoi-geler
    format: course
    question: "Pourquoi geler une dataclass avec `frozen=True` ?"
    choices:
      - {text: "Pour une valeur immuable, sûre à partager et utilisable comme clé", correct: true}
      - {text: "Pour qu'elle prenne moins de mémoire qu'une classe ordinaire", correct: false}
      - {text: "Pour interdire qu'une autre classe en hérite", correct: false}
      - {text: "Pour que mypy vérifie ses champs à l'exécution", correct: false}
    answer: "Une coordonnée, une couleur, une somme d'argent : des valeurs qu'on remplace plutôt que de les modifier. La mémoire, c'est `slots=True`."
  - key: pourquoi-refuser-liste
    format: course
    question: "Pourquoi `@dataclass` refuse-t-il `articles: list = []` ?"
    choices:
      - {text: "La même liste serait partagée par toutes les instances", correct: true}
      - {text: "Une liste ne peut pas être annotée par le type `list`", correct: false}
      - {text: "Les valeurs par défaut sont interdites dans une dataclass", correct: false}
      - {text: "Une liste vide serait convertie en `None` à la création", correct: false}
    answer: "C'est le piège des défauts modifiables, déjà connu des fonctions. La dataclass le détecte, et propose `field(default_factory=list)`."
  - key: ce-qui-fait-un-champ
    format: course
    question: "Qu'est-ce qui fait d'une ligne du corps de la classe un champ de dataclass ?"
    choices:
      - {text: "Son annotation de type : `nom: str`", correct: true}
      - {text: "Sa valeur par défaut : `nom = ''`", correct: false}
      - {text: "Sa présence dans un `__init__` écrit à la main", correct: false}
      - {text: "Son nom, qui ne commence pas par `_`", correct: false}
    answer: "Seules les annotations comptent (sauf `ClassVar`). Un nom avec une valeur mais sans annotation reste un attribut de classe."
