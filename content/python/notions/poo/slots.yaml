notion: slots
lesson: |-
  Par défaut, chaque instance range ses attributs dans un dictionnaire, son `__dict__` : souple (on ajoute un attribut
  quand on veut), mais coûteux en mémoire. **`__slots__`** déclare la liste fixe des attributs : ils sont rangés à des
  places réservées, sans dictionnaire.

  ```python
  class Point:
      __slots__ = ("x", "y")

      def __init__(self, x, y):
          self.x = x
          self.y = y


  p = Point(1, 2)
  p.x = 10       # permis
  p.z = 3        # AttributeError: 'Point' object has no attribute 'z' and no __dict__ for setting new attributes
  ```

  - **Les gains** : moins de mémoire par instance (sensible sur des millions de petits objets), un accès un peu plus
    rapide, et **une faute de frappe qui lève une erreur** (`p.valuer = ...`) au lieu de créer un attribut en silence.
  - **Un slot non affecté n'existe pas** : le lire lève `AttributeError`.
  - **Pas d'attribut de classe du même nom** pour un défaut : `ValueError: 'x' in __slots__ conflicts with class
    variable`. Le défaut se donne dans `__init__`.
  - **L'héritage** : une sous-classe **sans** `__slots__` retrouve un `__dict__`, et l'économie disparaît. Chaque
    classe de la hiérarchie déclare ses **nouveaux** attributs seulement, ou `__slots__ = ()`.
  - **Les références faibles** (`weakref`) demandent `"__weakref__"` dans les slots, sinon `TypeError: cannot create
    weak reference to 'Noeud' object`. On peut aussi garder un `__dict__` en listant `"__dict__"`.
  - **L'héritage multiple** de deux classes aux slots non vides est refusé (conflit de disposition en mémoire).
  - **`@dataclass(slots=True)`** génère les `__slots__` à partir des champs.

  **En entretien** : « `__slots__` remplace le `__dict__` de chaque instance par des places fixes : moins de mémoire,
  un accès plus rapide, et plus d'attribut ajouté par erreur. Les pièges : pas d'attribut de classe du même nom, une
  sous-classe sans `__slots__` retrouve un `__dict__`, et il faut `__weakref__` pour les références faibles. Ça vaut la
  peine pour beaucoup de petits objets ; `@dataclass(slots=True)` le fait pour toi. »
cards:
  - key: vf-pas-de-dict
    format: true-false
    question: "Une instance d'une classe à `__slots__` n'a pas de `__dict__`, sauf si une classe de sa hiérarchie en garde un."
    truth: true
    answer: "Les attributs sont rangés à des places fixes. Un parent sans `__slots__`, ou `\"__dict__\"` dans la liste, rend le dictionnaire."
  - key: vf-sous-classe-sans-slots
    format: true-false
    question: "Une sous-classe qui ne déclare pas de `__slots__` reste sans `__dict__`, comme son parent."
    truth: false
    answer: "Sans `__slots__`, la sous-classe crée un `__dict__` pour ses instances : on peut de nouveau y ajouter n'importe quel attribut. Il faut au moins `__slots__ = ()`."
  - key: vf-dataclass-slots
    format: true-false
    question: "`@dataclass(slots=True)` génère les `__slots__` à partir des champs de la dataclass."
    truth: true
    answer: "Disponible depuis Python 3.10. Le décorateur crée une nouvelle classe, avec `__slots__` égal au tuple des noms de champs."
  - key: vf-defaut-attribut-classe
    format: true-false
    question: "On peut donner une valeur par défaut à un slot par un attribut de classe du même nom."
    truth: false
    answer: "`ValueError: 'x' in __slots__ conflicts with class variable`. Le slot est lui-même un attribut de classe (un descripteur) : le défaut se donne dans `__init__`."
  - key: qcm-gains
    format: multiple-choice
    question: "Que gagne-t-on avec `__slots__` ?"
    choices:
      - {text: "De la mémoire par instance, et l'interdiction des attributs imprévus", correct: true}
      - {text: "Des méthodes plus rapides à appeler, et l'héritage multiple libre", correct: false}
      - {text: "Des attributs privés, invisibles hors de la classe", correct: false}
      - {text: "Des attributs typés, vérifiés à chaque affectation", correct: false}
    answer: "Moins de mémoire, un accès aux attributs un peu plus rapide, et une `AttributeError` pour un nom inconnu. Rien sur les méthodes, la visibilité ni les types."
  - key: qcm-exception-attribut-inconnu
    format: multiple-choice
    question: "Quelle exception lève `p.z = 1` quand `Point` déclare `__slots__ = (\"x\", \"y\")` ?"
    choices:
      - {text: "`AttributeError`", correct: true}
      - {text: "`TypeError`", correct: false}
      - {text: "`KeyError`", correct: false}
      - {text: "`NameError`", correct: false}
    answer: "« 'Point' object has no attribute 'z' and no __dict__ for setting new attributes » : sans dictionnaire, il n'y a nulle part où ranger `z`."
  - key: qcm-weakref
    format: multiple-choice
    question: "Que faut-il ajouter aux `__slots__` pour pouvoir créer des références faibles vers les instances ?"
    choices:
      - {text: "`\"__weakref__\"`", correct: true}
      - {text: "`\"__dict__\"`", correct: false}
      - {text: "`\"__ref__\"`", correct: false}
      - {text: "`\"weak\"`", correct: false}
    answer: "Une classe ordinaire a une place `__weakref__` ; avec `__slots__`, il faut la demander. Sinon `weakref.ref(obj)` lève une `TypeError`."
  - key: qcm-quand
    format: multiple-choice
    question: "Quand `__slots__` vaut-il la peine ?"
    choices:
      - {text: "Pour des millions de petits objets aux attributs fixes", correct: true}
      - {text: "Pour toutes les classes, par principe", correct: false}
      - {text: "Pour une classe à laquelle on ajoute des attributs à la volée", correct: false}
      - {text: "Pour une classe qu'on n'instancie qu'une seule fois", correct: false}
    answer: "Le gain se mesure sur de grandes quantités d'instances. Pour une classe ordinaire, la souplesse du `__dict__` coûte peu, et les pièges de l'héritage pèsent plus."
  - key: code-attribut-inconnu
    format: code-output
    question: |-
      ```python
      class Point:
          __slots__ = ("x", "y")

          def __init__(self, x, y):
              self.x, self.y = x, y


      p = Point(1, 2)
      p.x = 10
      print(p.x, hasattr(p, "__dict__"))
      p.z = 3
      ```
    answer: "`10 False`, puis une `AttributeError` : on modifie un slot déclaré, mais `z` n'en est pas un, et il n'y a pas de `__dict__` pour le ranger."
    check:
      output: "10 False"
      throws: AttributeError
    choices:
      - {text: "`10 False`, puis une `AttributeError`", correct: true}
      - {text: "`10 True`, puis une `AttributeError`", correct: false}
      - {text: "`1 False`, puis une `AttributeError`", correct: false}
      - {text: "`10 False`, et rien d'autre", correct: false}
  - key: code-sous-classe-dict
    format: code-output
    question: |-
      ```python
      class Base:
          __slots__ = ("a",)


      class Enfant(Base):
          pass


      e = Enfant()
      e.a = 1
      e.b = 2
      print(e.b, e.__dict__)
      ```
    answer: "`2 {'b': 2}` : `Enfant` ne déclare pas de `__slots__`, ses instances ont un `__dict__`. `a` reste dans le slot du parent, `b` va dans le dictionnaire."
    check:
      output: "2 {'b': 2}"
    choices:
      - {text: "`2 {'b': 2}`", correct: true}
      - {text: "`2 {'a': 1, 'b': 2}`", correct: false}
      - {text: "`2 {}`", correct: false}
      - {text: "Une `AttributeError`, sans rien afficher", correct: false}
  - key: code-slot-vide
    format: code-output
    question: |-
      ```python
      class Compte:
          __slots__ = ("solde",)


      c = Compte()
      print(hasattr(c, "solde"))
      print(c.solde)
      ```
    answer: "`False`, puis une `AttributeError` : le slot existe dans la classe, mais n'a pas de valeur tant qu'on ne l'a pas affecté."
    check:
      output: "False"
      throws: AttributeError
    choices:
      - {text: "`False`, puis une `AttributeError`", correct: true}
      - {text: "`True`, puis `None`", correct: false}
      - {text: "`False`, puis `None`", correct: false}
      - {text: "`True`, puis `0`", correct: false}
  - key: code-dataclass-slots
    format: code-output
    question: |-
      ```python
      from dataclasses import dataclass


      @dataclass(slots=True)
      class Pixel:
          x: int
          y: int


      print(Pixel.__slots__, hasattr(Pixel(0, 0), "__dict__"))
      ```
    answer: "`('x', 'y') False` : la dataclass génère un tuple de slots à partir des champs, et ses instances n'ont plus de `__dict__`."
    check:
      output: "('x', 'y') False"
    choices:
      - {text: "`('x', 'y') False`", correct: true}
      - {text: "`['x', 'y'] False`", correct: false}
      - {text: "`('x', 'y') True`", correct: false}
      - {text: "`True False`", correct: false}
  - key: bug-defaut-de-classe
    format: bug-fix
    question: |-
      Ce programme s'arrête, dès la définition de la classe, sur « ValueError: 'x' in __slots__ conflicts with class
      variable » :
      ```python
      class Point:
          __slots__ = ("x", "y")
          x = 0
          y = 0
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Donner les défauts dans `__init__` : `def __init__(self, x=0, y=0)`", correct: true}
      - {text: "Déclarer les défauts avant la ligne `__slots__`", correct: false}
      - {text: "Écrire `__slots__ = {\"x\": 0, \"y\": 0}`, un dictionnaire de défauts", correct: false}
      - {text: "Renommer les attributs de classe `_x` et `_y`", correct: false}
    answer: |-
      ```python
      class Point:
          __slots__ = ("x", "y")

          def __init__(self, x=0, y=0):
              self.x = x
              self.y = y
      ```
      Chaque slot devient un descripteur de la classe, sous le même nom : un attribut de classe `x` entrerait en
      conflit. Un dictionnaire dans `__slots__` est permis, mais ses valeurs servent de docstrings, pas de défauts.
  - key: bug-sous-classe-sans-slots
    format: bug-fix
    question: |-
      Ce programme affiche `21` : la faute de frappe `valuer` est passée sans erreur, malgré les `__slots__` du
      parent.
      ```python
      class Mesure:
          __slots__ = ("valeur",)

          def __init__(self, valeur):
              self.valeur = valeur


      class Temperature(Mesure):
          def __init__(self, valeur):
              super().__init__(valeur)


      t = Temperature(21)
      t.valuer = 22  # faute de frappe
      print(t.valeur)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Déclarer `__slots__ = ()` dans `Temperature`", correct: true}
      - {text: "Recopier `__slots__ = (\"valeur\",)` dans `Temperature`", correct: false}
      - {text: "Appeler `super().__slots__` dans le `__init__`", correct: false}
      - {text: "Retirer les `__slots__` du parent `Mesure`", correct: false}
    answer: |-
      ```python
      class Temperature(Mesure):
          __slots__ = ()
      ```
      Sans `__slots__`, la sous-classe retrouve un `__dict__`, qui accepte tout. Elle ne déclare que ses nouveaux
      attributs : redéclarer `valeur` dupliquerait le slot du parent et gaspillerait de la mémoire.
  - key: bug-reference-faible
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: cannot create weak reference to 'Noeud' object » :
      ```python
      import weakref


      class Noeud:
          __slots__ = ("valeur",)

          def __init__(self, valeur):
              self.valeur = valeur


      cache = weakref.WeakValueDictionary()
      cache["a"] = Noeud(1)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter `\"__weakref__\"` aux slots", correct: true}
      - {text: "Ajouter `\"weakref\"` aux slots", correct: false}
      - {text: "Remplacer le cache par un `dict` ordinaire", correct: false}
      - {text: "Appeler `weakref.ref` dans `__init__`", correct: false}
    answer: |-
      ```python
      class Noeud:
          __slots__ = ("valeur", "__weakref__")
      ```
      Une classe à `__slots__` n'a plus de place pour les références faibles, sauf à la demander. Un `dict`
      ordinaire garderait les nœuds en vie, ce que le cache voulait justement éviter.
  - key: bug-attribut-non-declare
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « AttributeError: 'Utilisateur' object has no attribute 'email' and no __dict__ for
      setting new attributes » :
      ```python
      class Utilisateur:
          __slots__ = ("nom",)

          def __init__(self, nom, email):
              self.nom = nom
              self.email = email


      Utilisateur("ana", "ana@exemple.fr")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Déclarer l'attribut : `__slots__ = (\"nom\", \"email\")`", correct: true}
      - {text: "Affecter `email` avant `nom` dans `__init__`", correct: false}
      - {text: "Écrire `self.__dict__[\"email\"] = email`", correct: false}
      - {text: "Déclarer `email = None` dans le corps de la classe", correct: false}
    answer: |-
      ```python
      class Utilisateur:
          __slots__ = ("nom", "email")
      ```
      Avec `__slots__`, seuls les attributs déclarés existent. Il n'y a pas de `__dict__` à remplir, et un attribut
      de classe `email` ne serait qu'en lecture seule pour les instances.
  - key: principe-memoire
    format: course
    question: "Comment `__slots__` économise-t-il de la mémoire ?"
    choices:
      - {text: "Les attributs sont rangés à des places fixes, sans dictionnaire par instance", correct: true}
      - {text: "Les valeurs des attributs sont compressées à chaque affectation", correct: false}
      - {text: "Toutes les instances partagent les mêmes valeurs d'attributs", correct: false}
      - {text: "Python libère les attributs inutilisés en tâche de fond", correct: false}
    answer: "Un `__dict__` par instance coûte une table de hachage entière. Les slots sont des cases réservées dans l'objet, décrites une seule fois dans la classe."
  - key: slots-et-heritage
    format: course
    question: "Comment déclarer `__slots__` dans la sous-classe d'une classe qui en a déjà ?"
    choices:
      - {text: "Lister les seuls nouveaux attributs, ou `()` s'il n'y en a pas", correct: true}
      - {text: "Recopier tous les attributs du parent, puis ajouter les nouveaux", correct: false}
      - {text: "Ne rien déclarer : la sous-classe hérite des slots du parent", correct: false}
      - {text: "Lister `\"__dict__\"` pour garder les attributs du parent", correct: false}
    answer: "Les slots du parent restent valables. Les répéter crée des places en double, et ne rien déclarer rend un `__dict__`."
  - key: inconvenients
    format: course
    question: "Quel inconvénient a `__slots__` ?"
    choices:
      - {text: "Plus d'attribut ajouté à la volée, et des pièges avec l'héritage", correct: true}
      - {text: "Les méthodes de la classe deviennent plus lentes à appeler", correct: false}
      - {text: "Les instances ne peuvent plus être comparées avec `==`", correct: false}
      - {text: "La classe ne peut plus définir de méthodes ni de propriétés", correct: false}
    answer: "Certaines bibliothèques posent des attributs sur tes objets, ou supposent un `__dict__` ; l'héritage multiple et les références faibles demandent de l'attention."
  - key: slots-avec-dict
    format: course
    question: "Que donne `__slots__ = (\"x\", \"__dict__\")` ?"
    choices:
      - {text: "Un slot `x`, et un `__dict__` pour tous les autres attributs", correct: true}
      - {text: "Une erreur : `__dict__` est un nom réservé par Python", correct: false}
      - {text: "Un attribut ordinaire nommé `__dict__`, sans effet particulier", correct: false}
      - {text: "Seulement le slot `x` : la chaîne `__dict__` est ignorée", correct: false}
    answer: "Les attributs fréquents gardent leur place fixe, et l'objet accepte encore des attributs imprévus. Un compromis rare, mais permis."
