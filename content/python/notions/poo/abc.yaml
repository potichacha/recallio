notion: abc
lesson: |-
  Une **classe abstraite** définit une interface : des méthodes que ses sous-classes **doivent** implémenter. Le
  module `abc` (*abstract base classes*) la rend vérifiable.

  ```python
  from abc import ABC, abstractmethod


  class Forme(ABC):
      @abstractmethod
      def aire(self):
          """Chaque forme calcule son aire."""

      def decrire(self):                    # une méthode concrète, partagée
          return f"aire : {self.aire()}"


  class Carre(Forme):
      def __init__(self, cote):
          self.cote = cote

      def aire(self):
          return self.cote ** 2


  Forme()            # TypeError: Can't instantiate abstract class Forme without an implementation for abstract method 'aire'
  Carre(3).decrire() # 'aire : 9'
  ```

  **Les règles.**

  - La classe hérite d'**`ABC`** (ou a `ABCMeta` pour métaclasse). Sans cela, `@abstractmethod` n'a aucun effet.
  - Tant qu'il reste une méthode abstraite non implémentée, la classe **refuse de créer un objet** : `TypeError`, dès
    l'appel de la classe. Une sous-classe qui n'en implémente qu'une partie reste abstraite.
  - Une méthode abstraite peut avoir un corps, que les sous-classes appellent avec `super()`.
  - Une **propriété abstraite** s'écrit `@property` au-dessus de `@abstractmethod` (le décorateur abstrait au plus près
    de la fonction).
  - `Forme.register(Autre)` déclare une **sous-classe virtuelle** : `isinstance` l'accepte, sans rien vérifier.

  **Par rapport à `NotImplementedError`.** Un corps qui lève `NotImplementedError` ne se découvre qu'à l'appel de la
  méthode, peut-être en production. `@abstractmethod` refuse l'objet dès sa création.

  **`collections.abc`.** La bibliothèque fournit des classes abstraites pour les collections : `Iterable`, `Sized`,
  `Sequence`, `Mapping`, `MutableMapping`... En hériter oblige à écrire quelques méthodes, et donne le reste : une
  `Sequence` qui définit `__getitem__` et `__len__` reçoit `index`, `count`, `in`, l'itération et `reversed`. Elles
  servent aussi à tester un comportement : `isinstance(x, Mapping)`.

  **ABC ou `Protocol` ?** Une classe abstraite impose l'héritage et peut partager du code ; un `typing.Protocol` décrit
  une interface que mypy vérifie sans héritage, pratique pour des classes qu'on ne contrôle pas.

  **En entretien** : « Une classe abstraite hérite d'`ABC` et marque ses méthodes obligatoires avec
  `@abstractmethod` : on ne peut pas l'instancier, ni une sous-classe qui en oublie une. L'erreur arrive à la création
  de l'objet, pas à l'appel. `collections.abc` en fournit pour les collections, avec des méthodes offertes. »
cards:
  - key: role-classe-abstraite
    format: course
    question: "À quoi sert une classe abstraite ?"
    choices:
      - {text: "À définir une interface commune que les sous-classes doivent implémenter", correct: true}
      - {text: "À créer des objets plus légers, sans attributs d'instance", correct: false}
      - {text: "À empêcher toute sous-classe de redéfinir ses méthodes", correct: false}
      - {text: "À regrouper des fonctions utilitaires, sans jamais créer d'objet", correct: false}
    answer: "Elle déclare les méthodes obligatoires et peut partager du code. Python refuse d'instancier une classe qui n'implémente pas toutes ses méthodes abstraites."
  - key: quand-refus-instanciation
    format: course
    question: "Quand Python refuse-t-il de créer un objet d'une classe qui hérite d'`ABC` ?"
    choices:
      - {text: "Tant qu'il lui reste une méthode `@abstractmethod` non implémentée", correct: true}
      - {text: "Dans tous les cas : une sous-classe d'`ABC` ne crée jamais d'objet", correct: false}
      - {text: "Quand elle définit un `__init__` qui attend des paramètres", correct: false}
      - {text: "Quand une de ses méthodes ne renvoie aucune valeur", correct: false}
    answer: "Une sous-classe qui implémente toutes les méthodes abstraites s'instancie normalement, même si elle hérite d'`ABC`."
  - key: apport-sequence
    format: course
    question: "Qu'apporte l'héritage de `collections.abc.Sequence` ?"
    choices:
      - {text: "Avec `__getitem__` et `__len__`, la classe reçoit `index`, `count`, `in` et l'itération", correct: true}
      - {text: "La classe devient une `list`, avec toutes ses méthodes de modification", correct: false}
      - {text: "La classe est vérifiée par mypy, sans aucun effet à l'exécution", correct: false}
      - {text: "La classe trie automatiquement ses éléments à chaque insertion", correct: false}
    answer: "Les classes de `collections.abc` imposent quelques méthodes abstraites et offrent les autres, écrites à partir d'elles."
  - key: abc-ou-protocol
    format: course
    question: "Quand préfères-tu une classe abstraite à un `typing.Protocol` ?"
    choices:
      - {text: "Quand tu veux imposer l'héritage et partager du code entre les sous-classes", correct: true}
      - {text: "Quand les classes concernées viennent d'une bibliothèque que tu ne contrôles pas", correct: false}
      - {text: "Quand tu ne veux aucune vérification au moment de l'exécution", correct: false}
      - {text: "Quand seule compte la vérification statique faite par mypy", correct: false}
    answer: "Une ABC vérifie à l'exécution et partage des méthodes concrètes, mais exige l'héritage. Un `Protocol` convient aux classes qu'on ne peut pas modifier."
  - key: vf-corps-abstrait
    format: true-false
    question: "Une méthode marquée `@abstractmethod` peut avoir un corps, que les sous-classes appellent avec `super()`."
    truth: true
    answer: "Le décorateur oblige à la redéfinir, sans interdire un comportement par défaut. La sous-classe peut le compléter avec `super().methode()`."
  - key: vf-sans-heriter-abc
    format: true-false
    question: "`@abstractmethod` empêche d'instancier la classe même si elle n'hérite pas d'`ABC` et n'a pas `ABCMeta` pour métaclasse."
    truth: false
    answer: "C'est `ABCMeta` qui vérifie les méthodes abstraites à la création de l'objet. Sans elle, le décorateur ne fait rien : la classe s'instancie."
  - key: vf-implementation-partielle
    format: true-false
    question: "Une sous-classe qui n'implémente qu'une partie des méthodes abstraites reste abstraite."
    truth: true
    answer: "Elle ne peut pas créer d'objet tant qu'il manque une méthode. Cela permet des classes intermédiaires, complétées plus bas."
  - key: vf-register-verifie
    format: true-false
    question: "`Forme.register(Carre)` oblige `Carre` à implémenter les méthodes abstraites de `Forme`."
    truth: false
    answer: "`register` déclare une sous-classe virtuelle : `isinstance(Carre(), Forme)` vaut `True`, mais rien n'est vérifié, et `Carre` n'hérite d'aucune méthode."
  - key: qcm-import-abc
    format: multiple-choice
    question: "Quel import écris-tu pour déclarer une classe abstraite ?"
    choices:
      - {text: "`from abc import ABC, abstractmethod`", correct: true}
      - {text: "`from typing import Abstract, abstract`", correct: false}
      - {text: "`from collections import ABC, abstract`", correct: false}
      - {text: "`from abc import Interface, virtual`", correct: false}
    answer: "Le module `abc` fournit `ABC`, la classe à hériter, et `abstractmethod`, le décorateur."
  - key: qcm-exception-instanciation
    format: multiple-choice
    question: "Quelle exception lève `Forme()` quand la classe abstraite `Forme` a une méthode abstraite ?"
    choices:
      - {text: "`TypeError`", correct: true}
      - {text: "`NotImplementedError`", correct: false}
      - {text: "`AttributeError`", correct: false}
      - {text: "`RuntimeError`", correct: false}
    answer: "« Can't instantiate abstract class Forme without an implementation for abstract method 'aire' ». `NotImplementedError` est l'exception qu'on lève soi-même dans un corps non écrit."
  - key: qcm-propriete-abstraite
    format: multiple-choice
    question: "Comment déclares-tu une propriété abstraite `aire` ?"
    choices:
      - {text: "`@property` au-dessus de `@abstractmethod`", correct: true}
      - {text: "`@abstractmethod` au-dessus de `@property`", correct: false}
      - {text: "`@property(abstract=True)` seul", correct: false}
      - {text: "`@abstractmethod` seul, lu comme une propriété", correct: false}
    answer: "`@abstractmethod` doit être le plus près de la fonction. Placé au-dessus de `@property`, il tente de marquer l'objet propriété, ce qui lève une `AttributeError`."
  - key: qcm-not-implemented
    format: multiple-choice
    question: "Quelle différence entre `@abstractmethod` et un corps qui lève `NotImplementedError` ?"
    choices:
      - {text: "`@abstractmethod` refuse l'objet à sa création ; l'exception attend l'appel", correct: true}
      - {text: "Aucune : les deux refusent l'objet dès sa création", correct: false}
      - {text: "`NotImplementedError` refuse l'objet ; `@abstractmethod` agit à l'appel", correct: false}
      - {text: "`@abstractmethod` n'est vu que par mypy, sans effet à l'exécution", correct: false}
    answer: "Avec `@abstractmethod`, l'oubli se voit dès `Carte()`. Avec `NotImplementedError`, il ne se voit qu'à l'appel de la méthode, peut-être en production."
  - key: trous-heriter-abc
    format: fill-in
    question: |-
      Complète pour que `Forme` soit abstraite :
      ```python
      from abc import ABC, abstractmethod


      class Forme(___):
          @abstractmethod
          def aire(self):
              ...
      ```
    blanks:
      - - ABC
    answer: "Hériter d'`ABC` donne à la classe la métaclasse `ABCMeta`, qui vérifie les méthodes abstraites."
  - key: trous-abstractmethod
    format: fill-in
    question: |-
      Complète pour obliger chaque moyen de paiement à définir `payer` :
      ```python
      from abc import ABC, abstractmethod


      class Paiement(ABC):
          @___
          def payer(self, montant):
              ...
      ```
    blanks:
      - - abstractmethod
    answer: "`@abstractmethod` marque la méthode comme obligatoire dans les sous-classes."
  - key: trous-mapping
    format: fill-in
    question: |-
      Complète pour vérifier qu'un objet se comporte comme un dictionnaire en lecture :
      ```python
      from collections.abc import Mapping

      if isinstance(config, ___):
          print(config["mode"])
      ```
    blanks:
      - - Mapping
    answer: "`Mapping` reconnaît `dict` et toute classe qui implémente l'interface d'un dictionnaire en lecture."
  - key: trous-module-abc
    format: fill-in
    question: |-
      Complète l'import :
      ```python
      from ___ import ABC, abstractmethod
      ```
    blanks:
      - - abc
    answer: "Le module `abc`, pour *abstract base classes*."
  - key: code-instancier-abstraite
    format: code-output
    question: |-
      ```python
      from abc import ABC, abstractmethod


      class Forme(ABC):
          @abstractmethod
          def aire(self): ...


      class Carre(Forme):
          def __init__(self, cote):
              self.cote = cote

          def aire(self):
              return self.cote ** 2


      try:
          Forme()
      except TypeError:
          print("abstraite", Carre(3).aire())
      ```
    answer: "`abstraite 9` : `Forme` a une méthode abstraite et refuse de créer un objet ; `Carre` l'implémente et s'instancie."
    check:
      output: "abstraite 9"
    choices:
      - {text: "`abstraite 9`", correct: true}
      - {text: "`9`", correct: false}
      - {text: "`abstraite None`", correct: false}
      - {text: "`abstraite 6`", correct: false}
  - key: code-super-abstraite
    format: code-output
    question: |-
      ```python
      from abc import ABC, abstractmethod


      class Rapport(ABC):
          @abstractmethod
          def titre(self):
              return "Rapport"


      class RapportMensuel(Rapport):
          def titre(self):
              return super().titre() + " mensuel"


      print(RapportMensuel().titre())
      ```
    answer: "`Rapport mensuel` : la méthode abstraite a un corps, que la sous-classe réutilise avec `super()`."
    check:
      output: "Rapport mensuel"
    choices:
      - {text: "`Rapport mensuel`", correct: true}
      - {text: "`mensuel`", correct: false}
      - {text: "`None mensuel`", correct: false}
      - {text: "`Rapport`", correct: false}
  - key: code-sequence-offerte
    format: code-output
    question: |-
      ```python
      from collections.abc import Sequence


      class Gamme(Sequence):
          def __init__(self, notes):
              self._notes = notes

          def __getitem__(self, i):
              return self._notes[i]

          def __len__(self):
              return len(self._notes)


      g = Gamme(["do", "ré", "mi", "ré"])
      print(g.count("ré"), g.index("mi"), "fa" in g)
      ```
    answer: "`2 2 False` : `count`, `index` et `in` sont offerts par `Sequence`, à partir de `__getitem__` et `__len__`."
    check:
      output: "2 2 False"
    choices:
      - {text: "`2 2 False`", correct: true}
      - {text: "`1 2 False`", correct: false}
      - {text: "`2 3 False`", correct: false}
      - {text: "`2 2 None`", correct: false}
  - key: code-sous-classe-virtuelle
    format: code-output
    question: |-
      ```python
      from abc import ABC


      class Exportable(ABC):
          pass


      class Csv:
          pass


      Exportable.register(Csv)
      print(isinstance(Csv(), Exportable), issubclass(Csv, Exportable), Csv.__mro__[1].__name__)
      ```
    answer: "`True True object` : `register` fait accepter `Csv` par `isinstance` et `issubclass`, mais `Csv` n'hérite pas d'`Exportable` : son MRO reste `Csv, object`."
    check:
      output: "True True object"
    choices:
      - {text: "`True True object`", correct: true}
      - {text: "`True True Exportable`", correct: false}
      - {text: "`False False object`", correct: false}
      - {text: "`True False object`", correct: false}
  - key: bug-nom-mal-implemente
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une `TypeError` : « Can't instantiate abstract class Sms without an implementation for
      abstract method 'envoyer' ».
      ```python
      from abc import ABC, abstractmethod


      class Notification(ABC):
          @abstractmethod
          def envoyer(self, message): ...


      class Sms(Notification):
          def envoie(self, message):
              print("SMS :", message)


      Sms().envoie("Bonjour")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Nommer la méthode `envoyer`, comme la méthode abstraite", correct: true}
      - {text: "Retirer `@abstractmethod` de `Notification.envoyer`", correct: false}
      - {text: "Retirer l'héritage d'`ABC` de `Notification`", correct: false}
      - {text: "Appeler `Notification.envoie` au lieu de `Sms().envoie`", correct: false}
    answer: |-
      ```python
      class Sms(Notification):
          def envoyer(self, message):
              print("SMS :", message)
      ```
      `envoie` est une méthode de plus : `envoyer` reste abstraite. Retirer le décorateur ou l'héritage ferait taire
      l'erreur sans corriger l'oubli.
  - key: bug-sans-abc
    format: bug-fix
    question: |-
      Ce programme affiche `None` : rien n'empêche de créer un `Exporteur`, qui n'exporte rien.
      ```python
      from abc import abstractmethod


      class Exporteur:
          @abstractmethod
          def exporter(self, donnees): ...


      e = Exporteur()
      print(e.exporter([1, 2]))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Faire hériter `Exporteur` d'`ABC`", correct: true}
      - {text: "Ajouter `return NotImplemented` dans `exporter`", correct: false}
      - {text: "Écrire `@abstractmethod()` avec des parenthèses", correct: false}
      - {text: "Ajouter `@staticmethod` sous `@abstractmethod`", correct: false}
    answer: |-
      ```python
      from abc import ABC, abstractmethod


      class Exporteur(ABC):
          @abstractmethod
          def exporter(self, donnees): ...
      ```
      `@abstractmethod` ne fait que marquer la méthode : c'est la métaclasse d'`ABC` qui refuse l'objet. Désormais
      `Exporteur()` lève une `TypeError`.
  - key: bug-ordre-decorateurs-abstraits
    format: bug-fix
    question: |-
      Ce programme s'arrête, dès la définition de la classe, sur « AttributeError: attribute '__isabstractmethod__' of
      'property' objects is not writable ».
      ```python
      from abc import ABC, abstractmethod


      class Forme(ABC):
          @abstractmethod
          @property
          def aire(self): ...
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Mettre `@property` au-dessus de `@abstractmethod`", correct: true}
      - {text: "Remplacer `@property` par `@staticmethod`", correct: false}
      - {text: "Retirer l'héritage d'`ABC`, qui gêne `property`", correct: false}
      - {text: "Écrire `@abstractmethod(property)` sur une ligne", correct: false}
    answer: |-
      ```python
      class Forme(ABC):
          @property
          @abstractmethod
          def aire(self): ...
      ```
      Les décorateurs s'appliquent de bas en haut : `@abstractmethod` doit marquer la fonction, avant que `@property`
      l'enveloppe. Une propriété ne se laisse pas marquer après coup.
  - key: bug-erreur-tardive
    format: bug-fix
    question: |-
      Ce programme affiche `commande validée`, puis s'arrête sur une `NotImplementedError` au moment de payer :
      ```python
      class Paiement:
          def payer(self, montant):
              raise NotImplementedError


      class Carte(Paiement):
          def payer_en_ligne(self, montant):
              return f"{montant} € payés"


      p = Carte()
      print("commande validée")
      p.payer(30)
      ```
      Quelle correction fait apparaître l'oubli dès la création de `Carte()` ?
    choices:
      - {text: "Faire hériter `Paiement` d'`ABC` et marquer `payer` `@abstractmethod`", correct: true}
      - {text: "Lever `NotImplementedError` dans `Paiement.__init__`", correct: false}
      - {text: "Remplacer `raise NotImplementedError` par `pass`", correct: false}
      - {text: "Rattraper `NotImplementedError` autour de `p.payer(30)`", correct: false}
    answer: |-
      ```python
      from abc import ABC, abstractmethod


      class Paiement(ABC):
          @abstractmethod
          def payer(self, montant): ...
      ```
      `Carte()` lève alors une `TypeError` : `payer` n'est pas implémentée. Il reste à renommer `payer_en_ligne` en
      `payer`. Une exception dans `Paiement.__init__` refuserait aussi les sous-classes correctes.
