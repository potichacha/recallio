notion: new-init
lesson: |-
  `Point(1, 2)` se fait en deux temps. La métaclasse `type` appelle d'abord **`__new__`**, qui **crée** l'objet, puis
  **`__init__`**, qui l'**initialise**.

  ```python
  class Point:
      def __new__(cls, *args, **kwargs):     # reçoit la classe, renvoie l'instance
          print("__new__")
          return super().__new__(cls)        # object.__new__ n'accepte que la classe

      def __init__(self, x, y):              # reçoit l'instance créée, renvoie None
          print("__init__")
          self.x, self.y = x, y
  ```

  | | `__new__(cls, ...)` | `__init__(self, ...)` |
  |---|---|---|
  | Rôle | créer (ou choisir) l'objet | remplir ses attributs |
  | Premier argument | la classe | l'instance |
  | Renvoie | l'instance | `None`, obligatoirement (sinon `TypeError`) |
  | À redéfinir | rarement | presque toujours |

  - **`__init__` n'est appelé que si `__new__` renvoie une instance de la classe.** Une fabrique qui renvoie un autre
    type saute `__init__`.
  - **Sous-classer un type immuable** (`str`, `int`, `tuple`) exige `__new__` : la valeur est fixée à la création,
    trop tôt pour `__init__`.

    ```python
    class Majuscules(str):
        def __new__(cls, texte):
            return super().__new__(cls, texte.upper())
    ```

  - **Contrôler l'instance renvoyée** : un cache ou un singleton. Piège : `__init__` s'exécute **à chaque appel**, sur
    l'instance déjà existante, et la réinitialise.
  - `super().__new__(cls, *args)` vers `object` lève `TypeError: object.__new__() takes exactly one argument (the type
    to instantiate)` : les arguments vont à `__init__`.
  - `__new__` est implicitement une méthode statique : pas besoin de décorateur.

  **En entretien** : « `__new__` crée l'instance (il reçoit la classe), `__init__` l'initialise (il reçoit l'instance
  et renvoie `None`) ; c'est `type.__call__` qui les enchaîne. On redéfinit `__new__` pour sous-classer un type
  immuable ou contrôler l'instance renvoyée, comme un cache. Si `__new__` renvoie un objet d'un autre type,
  `__init__` n'est pas appelé. »
cards:
  - key: vf-ordre
    format: true-false
    question: "`__new__` crée l'objet, puis `__init__` l'initialise."
    truth: true
    answer: "`type.__call__` appelle `cls.__new__(cls, ...)`, puis, si le résultat est une instance de `cls`, `__init__` sur ce résultat."
  - key: vf-init-remplace
    format: true-false
    question: "`__init__` peut renvoyer un autre objet, qui remplace celui qu'on est en train de construire."
    truth: false
    answer: "`__init__` doit renvoyer `None`, sinon `TypeError: __init__() should return None`. Choisir l'objet renvoyé, c'est le rôle de `__new__`."
  - key: vf-autre-type-sans-init
    format: true-false
    question: "Si `__new__` renvoie un objet qui n'est pas une instance de la classe, `__init__` n'est pas appelé."
    truth: true
    answer: "Python n'initialise que ses propres instances : un `__new__` qui renvoie un `int` saute `__init__`."
  - key: vf-new-recoit-instance
    format: true-false
    question: "`__new__` reçoit l'instance en premier argument, comme une méthode ordinaire."
    truth: false
    answer: "L'instance n'existe pas encore : `__new__` reçoit la classe, `cls`, et c'est lui qui crée l'instance."
  - key: qcm-sous-classe-str
    format: multiple-choice
    question: "Pourquoi faut-il `__new__` pour sous-classer `str` en transformant la valeur ?"
    choices:
      - {text: "Une `str` est immuable : sa valeur est fixée à la création, avant `__init__`", correct: true}
      - {text: "`__init__` est interdit dans les sous-classes des types intégrés", correct: false}
      - {text: "`__new__` est plus rapide que `__init__` pour créer des chaînes", correct: false}
      - {text: "`str` refuse d'être sous-classée par une classe sans `__new__`", correct: false}
    answer: "Quand `__init__` s'exécute, la chaîne a déjà sa valeur et ne peut plus changer. `__new__` passe la valeur transformée à `str.__new__`."
  - key: qcm-premier-argument
    format: multiple-choice
    question: "Que reçoit `__new__` en premier argument ?"
    choices:
      - {text: "La classe, `cls`", correct: true}
      - {text: "L'instance, `self`", correct: false}
      - {text: "La métaclasse, `type`", correct: false}
      - {text: "Rien : aucun argument implicite", correct: false}
    answer: "`__new__(cls, *args, **kwargs)` : la classe à instancier, puis les arguments de l'appel. C'est une méthode statique implicite."
  - key: qcm-piege-singleton
    format: multiple-choice
    question: "Un singleton renvoie toujours la même instance depuis `__new__`. Quel piège reste-t-il ?"
    choices:
      - {text: "`__init__` s'exécute à chaque appel, et réinitialise l'instance", correct: true}
      - {text: "`__new__` n'est appelé qu'une seule fois dans tout le programme", correct: false}
      - {text: "L'instance est copiée à chaque appel de la classe", correct: false}
      - {text: "Le singleton ne peut plus avoir d'attributs d'instance", correct: false}
    answer: "`Config(\"dev\")` puis `Config(\"prod\")` : même objet, mais le second `__init__` écrase le nom. En Python, un module, ou une fonction avec `functools.cache`, fait souvent un meilleur singleton."
  - key: qcm-init-renvoie
    format: multiple-choice
    question: "Que se passe-t-il si `__init__` renvoie `42` ?"
    choices:
      - {text: "Une `TypeError` : `__init__` doit renvoyer `None`", correct: true}
      - {text: "La construction renvoie `42` au lieu de l'objet", correct: false}
      - {text: "La valeur est ignorée, sans aucune erreur", correct: false}
      - {text: "L'objet reçoit un attribut `value` égal à 42", correct: false}
    answer: "`TypeError: __init__() should return None, not 'int'`. L'objet, c'est `__new__` qui le renvoie."
  - key: code-ordre-appels
    format: code-output
    question: |-
      ```python
      class Objet:
          def __new__(cls, *args):
              print("__new__", args)
              return super().__new__(cls)

          def __init__(self, nom):
              print("__init__", nom)
              self.nom = nom


      o = Objet("a")
      print(o.nom)
      ```
    answer: "`__new__` reçoit la classe et les arguments, crée l'objet ; `__init__` reçoit les mêmes arguments et le remplit."
    check:
      output: |-
        __new__ ('a',)
        __init__ a
        a
    choices:
      - text: |-
          ```
          __new__ ('a',)
          __init__ a
          a
          ```
        correct: true
      - text: |-
          ```
          __init__ a
          __new__ ('a',)
          a
          ```
        correct: false
      - text: |-
          ```
          __new__ ()
          __init__ a
          a
          ```
        correct: false
      - text: |-
          ```
          __new__ a
          __init__ a
          a
          ```
        correct: false
  - key: code-sous-classe-str
    format: code-output
    question: |-
      ```python
      class Majuscules(str):
          def __new__(cls, texte):
              return super().__new__(cls, texte.upper())


      m = Majuscules("bonjour")
      print(m, isinstance(m, str), len(m))
      ```
    answer: "`BONJOUR True 7` : la valeur transformée est passée à `str.__new__`, et l'objet reste une vraie chaîne."
    check:
      output: "BONJOUR True 7"
    choices:
      - {text: "`BONJOUR True 7`", correct: true}
      - {text: "`bonjour True 7`", correct: false}
      - {text: "`BONJOUR False 7`", correct: false}
      - {text: "`Majuscules('BONJOUR') True 7`", correct: false}
  - key: code-fabrique-autre-type
    format: code-output
    question: |-
      ```python
      class Fabrique:
          def __new__(cls, valeur):
              return int(valeur)

          def __init__(self, valeur):
              print("init")


      x = Fabrique("12")
      print(x + 1, type(x).__name__)
      ```
    answer: "`13 int` : `__new__` renvoie un entier, pas une `Fabrique` ; `__init__` n'est donc pas appelé, et `init` ne s'affiche pas."
    check:
      output: "13 int"
    choices:
      - {text: "`13 int`", correct: true}
      - {text: "`13 Fabrique`", correct: false}
      - {text: "`121 str`", correct: false}
      - {text: "`init` puis `13 int`, sur deux lignes", correct: false}
  - key: code-singleton-reinitialise
    format: code-output
    question: |-
      ```python
      class Config:
          _instance = None

          def __new__(cls, nom):
              if cls._instance is None:
                  cls._instance = super().__new__(cls)
              return cls._instance

          def __init__(self, nom):
              self.nom = nom


      a = Config("dev")
      b = Config("prod")
      print(a is b, a.nom)
      ```
    answer: "`True prod` : `__new__` renvoie la même instance, mais `__init__` s'exécute à chaque appel et écrase le nom."
    check:
      output: "True prod"
    choices:
      - {text: "`True prod`", correct: true}
      - {text: "`True dev`", correct: false}
      - {text: "`False dev`", correct: false}
      - {text: "`False prod`", correct: false}
  - key: role-new
    format: course
    question: "À quoi sert `__new__` ?"
    choices:
      - {text: "À créer et renvoyer l'instance, avant son initialisation", correct: true}
      - {text: "À initialiser les attributs d'une instance déjà créée", correct: false}
      - {text: "À détruire l'instance quand plus rien ne la référence", correct: false}
      - {text: "À copier une instance existante dans une nouvelle", correct: false}
    answer: "`__new__` fabrique l'objet, `__init__` le remplit. La destruction relève de `__del__`, la copie du module `copy`."
  - key: quand-redefinir-new
    format: course
    question: "Dans quel cas faut-il vraiment redéfinir `__new__` ?"
    choices:
      - {text: "Pour sous-classer un type immuable, ou choisir l'instance renvoyée", correct: true}
      - {text: "Pour donner des valeurs par défaut aux attributs de l'instance", correct: false}
      - {text: "Pour valider les arguments passés au constructeur", correct: false}
      - {text: "Pour appeler le constructeur de la classe parente", correct: false}
    answer: "Valeurs par défaut, validation et appel au parent se font dans `__init__`. `__new__` ne sert que lorsque la création elle-même doit changer."
  - key: object-new-arguments
    format: course
    question: "Pourquoi `super().__new__(cls, *args)` échoue-t-il quand le parent est `object` ?"
    choices:
      - {text: "`object.__new__` n'accepte que la classe : les arguments vont à `__init__`", correct: true}
      - {text: "`super()` ne marche pas dans une méthode statique comme `__new__`", correct: false}
      - {text: "`cls` doit être passé en dernier, après les autres arguments", correct: false}
      - {text: "`object` n'a pas de méthode `__new__` dont on pourrait hériter", correct: false}
    answer: "`TypeError: object.__new__() takes exactly one argument (the type to instantiate)`. On écrit `super().__new__(cls)`, et `__init__` reçoit les arguments."
  - key: qui-enchaine
    format: course
    question: "Qui appelle `__new__`, puis `__init__`, quand tu écris `Point(1, 2)` ?"
    choices:
      - {text: "`type.__call__`, la méthode d'appel de la métaclasse", correct: true}
      - {text: "`object.__init__`, qui appelle ensuite `__new__`", correct: false}
      - {text: "L'interpréteur, sans passer par aucune méthode", correct: false}
      - {text: "`Point.__call__`, que la classe doit définir", correct: false}
    answer: "Appeler une classe, c'est appeler un objet dont le type est `type` : `type.__call__` enchaîne la création et l'initialisation. `Point.__call__` rendrait appelables les instances."
