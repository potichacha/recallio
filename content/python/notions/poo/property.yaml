notion: property
lesson: |-
  `@property` transforme une méthode en **attribut calculé** : on la lit sans parenthèses, et l'on peut contrôler son
  affectation.

  ```python
  class Cercle:
      def __init__(self, rayon):
          self.rayon = rayon            # passe par le setter, donc par la validation

      @property
      def rayon(self):                  # le getter : lu par cercle.rayon
          return self._rayon

      @rayon.setter
      def rayon(self, valeur):          # le setter : appelé par cercle.rayon = ...
          if valeur < 0:
              raise ValueError("rayon négatif")
          self._rayon = valeur

      @property
      def aire(self):                   # calculée à chaque lecture, sans setter
          return 3.14159 * self._rayon ** 2


  c = Cercle(2)
  c.rayon = 3                           # validé
  print(c.aire)                         # pas de parenthèses
  c.aire = 10                           # AttributeError : pas de setter
  ```

  **Les règles.**

  - Le getter porte `@property` ; le setter porte `@nom.setter` et **le même nom** que la propriété. Un `@nom.deleter`
    définit `del obj.nom`.
  - La valeur est rangée dans un attribut **d'un autre nom**, par convention `_nom`. Écrire `self.rayon = valeur` dans
    le setter rappellerait le setter, sans fin : `RecursionError`.
  - Sans setter, la propriété est en **lecture seule** : l'affecter lève `AttributeError: property 'aire' of 'Cercle'
    object has no setter`.
  - Dans `__init__`, écrire `self.rayon = rayon` (et non `self._rayon`) fait passer la valeur initiale par la
    validation.
  - Une propriété est recalculée **à chaque lecture**. Pour un calcul coûteux fait une seule fois, il y a
    `functools.cached_property`.

  **Pourquoi c'est idiomatique.** En Python, on commence par un attribut public, sans getter ni setter. Le jour où il
  faut valider ou calculer, on le remplace par une propriété : le code appelant, qui écrit `c.rayon`, ne change pas.

  **En entretien** : « `@property` expose une méthode comme un attribut, avec un setter optionnel pour valider. On
  commence par des attributs publics et on passe à une propriété quand il le faut, sans casser l'API. La valeur vit
  dans un attribut `_nom`, sinon le setter s'appelle lui-même. »
cards:
  - key: role-property
    format: course
    question: "À quoi sert `@property` ?"
    choices:
      - {text: "À exposer une méthode comme un attribut, lu sans parenthèses", correct: true}
      - {text: "À rendre un attribut privé, invisible hors de la classe", correct: false}
      - {text: "À créer un attribut partagé par tous les objets de la classe", correct: false}
      - {text: "À mettre en cache le résultat d'une méthode coûteuse", correct: false}
    answer: "`cercle.aire` appelle la méthode `aire` sans parenthèses. La propriété peut aussi valider une affectation, avec un setter. Le cache, c'est `functools.cached_property`."
  - key: lecture-seule
    format: course
    question: "Que se passe-t-il si tu affectes une propriété qui n'a pas de setter ?"
    choices:
      - {text: "Une `AttributeError` : la propriété est en lecture seule", correct: true}
      - {text: "L'affectation crée un attribut d'instance qui la masque", correct: false}
      - {text: "La valeur est ignorée, sans aucune erreur", correct: false}
      - {text: "Une `TypeError` : une propriété n'est pas une variable", correct: false}
    answer: "« property 'aire' of 'Cercle' object has no setter ». Une propriété est définie sur la classe et prend le pas sur l'objet : l'affectation ne peut pas la masquer."
  - key: attribut-sous-jacent
    format: course
    question: "Pourquoi le setter de `prix` écrit-il dans `self._prix` et non dans `self.prix` ?"
    choices:
      - {text: "`self.prix = ...` rappellerait le setter, sans fin : `RecursionError`", correct: true}
      - {text: "Parce que `self.prix` est en lecture seule dans le setter", correct: false}
      - {text: "Parce que le souligné rend l'attribut vraiment privé", correct: false}
      - {text: "Parce que Python interdit deux attributs du même nom", correct: false}
    answer: "`self.prix` désigne la propriété elle-même. La valeur doit vivre ailleurs, dans un attribut au nom différent, `_prix` par convention."
  - key: evolution-api
    format: course
    question: "Pourquoi commence-t-on souvent par un attribut public, plutôt que par des getters et des setters ?"
    choices:
      - {text: "On peut le remplacer plus tard par une propriété sans changer le code appelant", correct: true}
      - {text: "Parce que Python ne permet pas d'écrire des méthodes `get_` et `set_`", correct: false}
      - {text: "Parce qu'une propriété est plus lente qu'une méthode `get_prix()`", correct: false}
      - {text: "Parce qu'un attribut public ne peut plus être validé ensuite", correct: false}
    answer: "`produit.prix` reste `produit.prix`, que ce soit un attribut ou une propriété. Les `get_prix()` et `set_prix()` de Java n'apportent rien en Python."
  - key: vf-sans-parentheses
    format: true-false
    question: "Une propriété se lit sans parenthèses : `cercle.aire`, et non `cercle.aire()`."
    truth: true
    answer: "C'est tout son intérêt : un calcul qui se lit comme un attribut. `cercle.aire()` appellerait la valeur renvoyée, un nombre, d'où une `TypeError`."
  - key: vf-setter-meme-nom
    format: true-false
    question: "Le setter d'une propriété `age` se déclare avec `@age.setter`, sur une méthode nommée elle aussi `age`."
    truth: true
    answer: "`@age.setter` ajoute un setter à la propriété `age` et renvoie la propriété complète, qui doit garder le nom `age`."
  - key: vf-recalcul
    format: true-false
    question: "`@property` garde la valeur calculée à la première lecture, et ne la recalcule plus ensuite."
    truth: false
    answer: "Une propriété est recalculée à chaque lecture : elle reste à jour si les attributs changent. `functools.cached_property` calcule une fois et garde le résultat."
  - key: vf-arguments
    format: true-false
    question: "Une propriété peut recevoir des arguments à la lecture, comme `rectangle.aire(2)`."
    truth: false
    answer: "Un getter ne reçoit que `self`. Un calcul qui a besoin d'arguments reste une méthode ordinaire."
  - key: qcm-valider-age
    format: multiple-choice
    question: "Comment refuses-tu un âge négatif, tout en gardant l'écriture `personne.age = 30` ?"
    choices:
      - {text: "Une propriété `age` dont le setter lève une `ValueError`", correct: true}
      - {text: "Une méthode `set_age` que l'appelant doit penser à appeler", correct: false}
      - {text: "Un attribut de classe `age_min = 0`, vérifié par Python", correct: false}
      - {text: "Une annotation `age: int`, vérifiée à chaque affectation", correct: false}
    answer: "Le setter s'exécute à chaque `personne.age = ...`. Une annotation n'est pas vérifiée à l'exécution, et une méthode `set_age` se contourne."
  - key: qcm-aire-a-jour
    format: multiple-choice
    question: "Un `Rectangle` a `largeur` et `hauteur`, modifiables. Comment exposes-tu `aire`, toujours à jour ?"
    choices:
      - {text: "Une propriété qui renvoie `self.largeur * self.hauteur`", correct: true}
      - {text: "Un attribut `self.aire` calculé une fois dans `__init__`", correct: false}
      - {text: "Un attribut de classe recalculé à chaque création", correct: false}
      - {text: "Une variable globale mise à jour par chaque setter", correct: false}
    answer: "La propriété recalcule l'aire à chaque lecture. Calculée dans `__init__`, elle serait fausse dès qu'on change la largeur."
  - key: qcm-cached-property
    format: multiple-choice
    question: "Quel outil calcule un attribut coûteux à la première lecture, puis garde le résultat dans l'objet ?"
    choices:
      - {text: "`functools.cached_property`", correct: true}
      - {text: "`@property`", correct: false}
      - {text: "`@staticmethod`", correct: false}
      - {text: "`functools.partial`", correct: false}
    answer: "`cached_property` range le résultat dans l'objet : les lectures suivantes ne recalculent rien. `@property` recalcule à chaque fois."
  - key: qcm-ordre-decorateurs
    format: multiple-choice
    question: "Comment déclares-tu une propriété modifiable ?"
    choices:
      - {text: "`@property` sur le getter, puis `@nom.setter` sur le setter", correct: true}
      - {text: "`@nom.setter` sur le setter, puis `@property` sur le getter", correct: false}
      - {text: "`@property` sur les deux méthodes, qui portent le même nom", correct: false}
      - {text: "`@setter` sur le setter, sans rien sur le getter", correct: false}
    answer: "`@property` crée la propriété ; `@nom.setter` n'existe qu'ensuite, puisqu'il est un attribut de cette propriété."
