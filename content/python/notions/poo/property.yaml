  - key: code-setter-plancher
    format: code-output
    question: |-
      ```python
      class Produit:
          def __init__(self, prix):
              self.prix = prix

          @property
          def prix(self):
              return self._prix

          @prix.setter
          def prix(self, valeur):
              self._prix = max(valeur, 0)


      p = Produit(-5)
      p.prix += 12
      print(p.prix)
