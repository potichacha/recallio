  - key: bug-recursion-setter
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une `RecursionError` : « maximum recursion depth exceeded ».
      ```python
      class Personne:
          def __init__(self, age):
              self.age = age

          @property
          def age(self):
              return self.age

          @age.setter
          def age(self, valeur):
              self.age = valeur


      Personne(30)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ranger la valeur dans `self._age`, et la lire de là", correct: true}
      - {text: "Écrire `self._age = age` dans `__init__` seulement", correct: false}
      - {text: "Supprimer `@property` et garder le setter seul", correct: false}
      - {text: "Augmenter la limite avec `sys.setrecursionlimit`", correct: false}
    answer: |-
      ```python
      @property
      def age(self):
          return self._age

      @age.setter
      def age(self, valeur):
          self._age = valeur
      ```
      Dans le setter, `self.age = valeur` rappelle le setter ; dans le getter, `self.age` rappelle le getter. Ne
      changer que `__init__` laisserait ces deux boucles.
  - key: bug-setter-mal-nomme
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « AttributeError: property 'celsius' of 'Temperature' object has no setter » :
      ```python
      class Temperature:
          def __init__(self):
              self._celsius = 0

          @property
          def celsius(self):
              return self._celsius

          @celsius.setter
          def valeur_celsius(self, valeur):
              self._celsius = valeur


      t = Temperature()
      t.celsius = 20
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Nommer le setter `celsius`, comme la propriété", correct: true}
      - {text: "Écrire `t.valeur_celsius(20)` au lieu de l'affectation", correct: false}
      - {text: "Remplacer `@celsius.setter` par `@property`", correct: false}
      - {text: "Écrire `t._celsius = 20` depuis l'extérieur", correct: false}
    answer: |-
      ```python
      @celsius.setter
      def celsius(self, valeur):
          self._celsius = valeur
      ```
      `@celsius.setter` renvoie une nouvelle propriété, avec setter, rangée sous le nom de la méthode : ici
      `valeur_celsius`. La propriété `celsius` reste sans setter.
  - key: bug-propriete-avec-parentheses
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: 'int' object is not callable » :
      ```python
      class Commande:
          def __init__(self, lignes):
              self.lignes = lignes

          @property
          def total(self):
              return sum(self.lignes)


      c = Commande([10, 5])
      print(c.total())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Lire la propriété sans parenthèses : `c.total`", correct: true}
      - {text: "Renvoyer `str(sum(self.lignes))` dans `total`", correct: false}
      - {text: "Appeler `Commande.total(c)` à la place", correct: false}
      - {text: "Ajouter un setter à la propriété `total`", correct: false}
    answer: |-
      ```python
      print(c.total)   # 15
      ```
      `c.total` exécute déjà la méthode et vaut 15 : les parenthèses tentent d'appeler cet entier.
  - key: bug-validation-contournee
    format: bug-fix
    question: |-
      Un abonnement doit durer au moins un mois, mais `Abonnement(0)` est accepté et le programme affiche `0` :
      ```python
      class Abonnement:
          def __init__(self, mois):
              self._mois = mois

          @property
          def mois(self):
              return self._mois

          @mois.setter
          def mois(self, valeur):
              if valeur < 1:
                  raise ValueError("au moins un mois")
              self._mois = valeur


      a = Abonnement(0)
      print(a.mois)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `self.mois = mois` dans `__init__`, pour passer par le setter", correct: true}
      - {text: "Ajouter la vérification dans le getter, à chaque lecture", correct: false}
      - {text: "Remplacer `_mois` par `__mois` dans tout le code", correct: false}
      - {text: "Déclarer `mois = 1` comme attribut de classe", correct: false}
    answer: |-
      ```python
      def __init__(self, mois):
          self.mois = mois   # ValueError pour 0
      ```
      En écrivant directement `self._mois`, le constructeur contourne la validation du setter.
