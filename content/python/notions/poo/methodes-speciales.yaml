notion: methodes-speciales
lesson: |-
  Les fonctions intégrées et la syntaxe de Python appellent des **méthodes spéciales** (*dunder methods*, pour
  *double underscore*). En les définissant, une classe se comporte comme un type intégré : `len`, les crochets, `in`,
  `for` marchent sur ses objets. C'est le **modèle de données** de Python.

  | Syntaxe | Méthode appelée |
  |---|---|
  | `len(x)` | `x.__len__()`, qui renvoie un entier positif ou nul |
  | `x[i]`, `x[1:3]` | `x.__getitem__(i)`, `x.__getitem__(slice(1, 3, None))` |
  | `x[i] = v` | `x.__setitem__(i, v)` |
  | `del x[i]` | `x.__delitem__(i)` |
  | `v in x` | `x.__contains__(v)`, sinon un parcours de `x` |
  | `for v in x`, `iter(x)` | `x.__iter__()`, qui renvoie un itérateur |
  | `bool(x)`, `if x:` | `x.__bool__()`, sinon `len(x) != 0`, sinon vrai |

  ```python
  class Playlist:
      def __init__(self, titres):
          self.titres = list(titres)

      def __len__(self):
          return len(self.titres)

      def __getitem__(self, indice):
          return self.titres[indice]          # un entier ou une tranche

      def __contains__(self, titre):
          return titre.casefold() in (t.casefold() for t in self.titres)

      def __iter__(self):
          return iter(self.titres)


  p = Playlist(["Intro", "Solo"])
  len(p), p[0], "solo" in p, list(p)          # 2, 'Intro', True, ['Intro', 'Solo']
  ```

  - **Les replis** : sans `__contains__`, `in` parcourt l'objet avec `__iter__` ; sans `__iter__`, `for` appelle
    `__getitem__(0)`, `__getitem__(1)`... jusqu'à une **`IndexError`** (une `KeyError` ne l'arrête pas). Sans
    `__bool__`, un objet dont `__len__` vaut 0 est **faux**.
  - **Python cherche ces méthodes sur la classe**, pas sur l'instance : `obj.__len__ = ...` ne change rien pour
    `len(obj)`.
  - **On ne les appelle pas soi-même** : on écrit `len(x)`, qui vérifie aussi le résultat (un `__len__` qui renvoie un
    `float` lève une `TypeError`).
  - **`__iter__` renvoie un itérateur** (`iter(self.titres)`, ou un générateur avec `yield`), pas une liste.
  - **`collections.abc.Sequence`** fournit `__contains__`, `__iter__`, `__reversed__`, `index` et `count` à une classe
    qui définit `__getitem__` et `__len__`.

  **En entretien** : « Les méthodes spéciales branchent une classe sur la syntaxe : `len` appelle `__len__`, les
  crochets `__getitem__` (avec un objet `slice` pour une tranche), `in` `__contains__` et `for` `__iter__`. Python les
  cherche sur la classe et a des replis : `in` et `for` se rabattent sur l'itération, puis sur `__getitem__`, et un
  objet de longueur nulle est faux. On écrit `len(x)`, jamais `x.__len__()`. »
cards:
  - key: vf-len-appelle
    format: true-false
    question: "`len(obj)` appelle la méthode `obj.__len__()`."
    truth: true
    answer: "Et vérifie son résultat : un entier positif ou nul. C'est ce qui permet à `len` de marcher sur toute classe qui définit `__len__`."
  - key: vf-in-sans-contains
    format: true-false
    question: "Sans `__contains__`, l'opérateur `in` lève une `TypeError`, même si la classe définit `__iter__`."
    truth: false
    answer: "`in` se rabat sur un parcours : il compare chaque élément produit par `__iter__` (ou `__getitem__`) avec `==`. `__contains__` sert à faire mieux, plus vite ou autrement."
  - key: vf-longueur-nulle-fausse
    format: true-false
    question: "Un objet dont `__len__` renvoie 0 est faux dans un `if`, si sa classe ne définit pas `__bool__`."
    truth: true
    answer: "Comme une liste vide. Sans `__bool__` ni `__len__`, un objet est toujours vrai."
  - key: vf-dunder-sur-instance
    format: true-false
    question: "Affecter une fonction à `obj.__len__`, sur l'instance, suffit pour que `len(obj)` l'utilise."
    truth: false
    answer: "Python cherche les méthodes spéciales sur la classe de l'objet, pas dans son `__dict__` : `len(obj)` lève toujours `TypeError: object of type ... has no len()`."
  - key: qcm-crochets
    format: multiple-choice
    question: "Quelle méthode Python appelle-t-il pour évaluer `obj[2]` ?"
    choices:
      - {text: "`__getitem__`", correct: true}
      - {text: "`__index__`", correct: false}
      - {text: "`__get__`", correct: false}
      - {text: "`__getattr__`", correct: false}
    answer: "`__getitem__(2)`. `__index__` convertit un objet en entier utilisable comme indice ; `__get__` sert aux descripteurs ; `__getattr__` aux attributs absents."
  - key: qcm-tranche
    format: multiple-choice
    question: "Que reçoit `__getitem__` quand on écrit `obj[1:3]` ?"
    choices:
      - {text: "Un objet `slice(1, 3, None)`", correct: true}
      - {text: "Deux arguments, `1` et `3`", correct: false}
      - {text: "Le tuple `(1, 3)`", correct: false}
      - {text: "La liste des indices, `[1, 2]`", correct: false}
    answer: "Une tranche arrive sous forme d'objet `slice`, avec `start`, `stop` et `step`. Le tuple `(1, 3)`, c'est ce que reçoit `obj[1, 3]`."
  - key: qcm-for-sans-iter
    format: multiple-choice
    question: "Une classe définit `__getitem__`, mais pas `__iter__`. Que fait `for x in obj` ?"
    choices:
      - {text: "Il appelle `__getitem__` avec 0, 1, 2... jusqu'à une `IndexError`", correct: true}
      - {text: "Il lève une `TypeError` : l'objet n'est pas itérable", correct: false}
      - {text: "Il appelle `__len__`, puis `__getitem__` pour chaque indice", correct: false}
      - {text: "Il appelle `__getitem__` avec chacune des clés de l'objet", correct: false}
    answer: "C'est l'ancien protocole des séquences : les indices croissants, jusqu'à une `IndexError`. `__len__` n'y joue aucun rôle."
  - key: qcm-sequence-abc
    format: multiple-choice
    question: "Quelles méthodes écrire pour hériter de `collections.abc.Sequence` et recevoir le reste ?"
    choices:
      - {text: "`__getitem__` et `__len__`", correct: true}
      - {text: "`__iter__` et `__contains__`", correct: false}
      - {text: "`__getitem__`, `__setitem__` et `__delitem__`", correct: false}
      - {text: "`__iter__` et `__next__`", correct: false}
    answer: "`Sequence` en déduit `__contains__`, `__iter__`, `__reversed__`, `index` et `count`. `__setitem__` et `__delitem__` sont ceux de `MutableSequence`."
  - key: trous-len
    format: fill-in
    question: |-
      Complète pour que `len(panier)` donne le nombre d'articles :
      ```python
      class Panier:
          def __init__(self):
              self.articles = []

          def ___(self):
              return len(self.articles)
      ```
    blanks:
      - - __len__
    answer: "`__len__` renvoie un entier positif ou nul ; il rend aussi le panier vide faux dans un `if`."
  - key: trous-contains
    format: fill-in
    question: |-
      Complète pour que `"pain" in panier` interroge la liste des articles :
      ```python
      def ___(self, article):
          return article in self.articles
      ```
    blanks:
      - - __contains__
    answer: "`in` appelle `__contains__`, qui renvoie un booléen. Sans lui, Python parcourrait l'objet."
  - key: trous-iter
    format: fill-in
    question: |-
      Complète pour que `for article in panier` parcoure les articles :
      ```python
      def ___(self):
          return iter(self.articles)
      ```
    blanks:
      - - __iter__
    answer: "`__iter__` renvoie un itérateur : `iter(liste)`, ou un générateur écrit avec `yield`."
  - key: trous-setitem
    format: fill-in
    question: |-
      Complète pour que `grille[3] = "X"` place un pion dans la case 3 :
      ```python
      def ___(self, indice, valeur):
          self.cases[indice] = valeur
      ```
    blanks:
      - - __setitem__
    answer: "`obj[i] = v` appelle `__setitem__(i, v)` ; la lecture passe par `__getitem__`, la suppression par `__delitem__`."
  - key: code-repli-getitem
    format: code-output
    question: |-
      ```python
      class Carres:
          def __getitem__(self, i):
              if i >= 4:
                  raise IndexError
              return i * i


      print(list(Carres()), 9 in Carres())
      ```
    answer: "`[0, 1, 4, 9] True` : sans `__iter__`, Python appelle `__getitem__` avec 0, 1, 2, 3, et s'arrête à l'`IndexError`. `in` se rabat sur le même parcours."
    check:
      output: "[0, 1, 4, 9] True"
    choices:
      - {text: "`[0, 1, 4, 9] True`", correct: true}
      - {text: "`[0, 1, 4, 9, 16] True`", correct: false}
      - {text: "`[1, 4, 9] False`", correct: false}
      - {text: "`[] False`", correct: false}
  - key: code-bool-par-len
    format: code-output
    question: |-
      ```python
      class Pile:
          def __init__(self, *elements):
              self.elements = list(elements)

          def __len__(self):
              return len(self.elements)


      print(bool(Pile()), bool(Pile(0)), "vide" if not Pile() else "pleine")
      ```
    answer: "`False True vide` : sans `__bool__`, Python regarde `__len__`. `Pile(0)` contient un élément (qui vaut 0, mais peu importe) : elle est vraie."
    check:
      output: "False True vide"
    choices:
      - {text: "`False True vide`", correct: true}
      - {text: "`False False vide`", correct: false}
      - {text: "`True True pleine`", correct: false}
      - {text: "`True False pleine`", correct: false}
  - key: code-dunder-instance
    format: code-output
    question: |-
      ```python
      class Boite:
          pass


      b = Boite()
      b.__len__ = lambda: 3
      print(b.__len__())
      print(len(b))
      ```
    answer: "`3`, puis une `TypeError` : l'appel direct trouve l'attribut de l'instance, mais `len` cherche `__len__` sur la classe, qui n'en a pas."
    check:
      output: "3"
      throws: TypeError
    choices:
      - {text: "`3`, puis une `TypeError`", correct: true}
      - {text: "`3` et `3`, sur deux lignes", correct: false}
      - {text: "Une `AttributeError`, sans rien afficher", correct: false}
      - {text: "`3` et `0`, sur deux lignes", correct: false}
  - key: code-cles-recues
    format: code-output
    question: |-
      ```python
      class Montre:
          def __getitem__(self, cle):
              return cle


      m = Montre()
      print(m[2], m[1:3], m["a", 1])
      ```
    answer: "`2 slice(1, 3, None) ('a', 1)` : `__getitem__` reçoit l'entier, un objet `slice` pour une tranche, et un tuple quand on sépare par des virgules."
    check:
      output: "2 slice(1, 3, None) ('a', 1)"
    choices:
      - {text: "`2 slice(1, 3, None) ('a', 1)`", correct: true}
      - {text: "`2 (1, 3) ('a', 1)`", correct: false}
      - {text: "`2 [1, 2] ['a', 1]`", correct: false}
      - {text: "`2 slice(1, 3) a`", correct: false}
  - key: bug-iter-renvoie-liste
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: iter() returned non-iterator of type 'list' » :
      ```python
      class Equipe:
          def __init__(self, membres):
              self.membres = membres

          def __iter__(self):
              return self.membres


      for nom in Equipe(["Ana", "Léo"]):
          print(nom)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renvoyer un itérateur : `return iter(self.membres)`", correct: true}
      - {text: "Renvoyer une copie : `return list(self.membres)`", correct: false}
      - {text: "Renommer la méthode `__next__`, appelée par `for`", correct: false}
      - {text: "Parcourir `Equipe(...).membres` dans la boucle", correct: false}
    answer: |-
      ```python
      def __iter__(self):
          return iter(self.membres)
      ```
      Une liste est itérable, mais n'est pas un itérateur : elle n'a pas de `__next__`. `iter()` en fabrique un. Une
      copie serait toujours une liste.
  - key: bug-keyerror-dans-getitem
    format: bug-fix
    question: |-
      Ce programme affiche `lun`, `mar` et `mer`, puis s'arrête sur « KeyError: 3 » :
      ```python
      class Semaine:
          jours = {0: "lun", 1: "mar", 2: "mer"}

          def __getitem__(self, i):
              return self.jours[i]


      for jour in Semaine():
          print(jour)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Lever `IndexError` pour un indice absent : elle seule arrête le `for`", correct: true}
      - {text: "Ajouter `__len__`, qui donne au `for` le nombre de tours", correct: false}
      - {text: "Renvoyer `None` pour un indice absent, qui arrête la boucle", correct: false}
      - {text: "Rattraper la `KeyError` autour de la boucle `for`", correct: false}
    answer: |-
      ```python
      def __getitem__(self, i):
          try:
              return self.jours[i]
          except KeyError:
              raise IndexError(i) from None
      ```
      Le parcours par `__getitem__` s'arrête sur une `IndexError`, rien d'autre ; `__len__` n'y joue aucun rôle. Un
      `__iter__` serait encore plus clair.
  - key: bug-len-float
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « TypeError: 'float' object cannot be interpreted as an integer » :
      ```python
      class Playlist:
          def __init__(self, durees):
              self.durees = durees

          def __len__(self):
              return sum(self.durees) / 60  # durée totale en minutes


      print(len(Playlist([180, 240])))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Faire renvoyer le nombre de titres à `__len__`, et la durée à une autre méthode", correct: true}
      - {text: "Arrondir la durée avec `round(..., 1)`, qui garde une décimale", correct: false}
      - {text: "Appeler `playlist.__len__()` au lieu de `len(playlist)`", correct: false}
      - {text: "Renvoyer la durée sous forme de chaîne, `f\"{minutes} min\"`", correct: false}
    answer: |-
      ```python
      def __len__(self):
          return len(self.durees)

      def duree_minutes(self):
          return sum(self.durees) / 60
      ```
      `len` attend un entier positif ou nul : le nombre d'éléments. Une durée n'est pas une longueur. Appeler
      `__len__` directement contournerait la vérification, pas le contresens.
  - key: bug-objet-vide-faux
    format: bug-fix
    question: |-
      Ce programme affiche « commande introuvable », alors que `trouver` a bien renvoyé une commande :
      ```python
      class Commande:
          def __init__(self, numero):
              self.numero = numero
              self.lignes = []

          def __len__(self):
              return len(self.lignes)


      def trouver(numero):
          return Commande(numero)


      commande = trouver(42)
      if commande:
          print("commande trouvée")
      else:
          print("commande introuvable")
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Tester `if commande is not None:`", correct: true}
      - {text: "Tester `if len(commande) >= 0:`", correct: false}
      - {text: "Retirer `self.lignes = []` du constructeur", correct: false}
      - {text: "Tester `if commande == True:`", correct: false}
    answer: |-
      ```python
      if commande is not None:
          print("commande trouvée")
      ```
      Sans `__bool__`, une commande sans ligne est fausse, car sa longueur vaut 0. Pour savoir si une valeur
      existe, on teste `is not None`.
  - key: pourquoi-len
    format: course
    question: "Pourquoi définir `__len__` plutôt qu'une méthode `taille()` ?"
    choices:
      - {text: "L'objet marche alors avec `len()`, et avec tout code qui s'en sert", correct: true}
      - {text: "`__len__` s'exécute plus vite qu'une méthode ordinaire", correct: false}
      - {text: "Une méthode `taille()` ne peut pas renvoyer d'entier", correct: false}
      - {text: "Python exige `__len__` dans toute classe qui contient une liste", correct: false}
    answer: "Le modèle de données rend l'objet familier : `len`, `if objet:`, `sorted`... Le code qui sait traiter une liste sait le traiter aussi."
  - key: appel-direct
    format: course
    question: "Faut-il écrire `obj.__len__()` dans ton code ?"
    choices:
      - {text: "Non : on écrit `len(obj)`, qui appelle la méthode et vérifie son résultat", correct: true}
      - {text: "Oui : c'est plus rapide que `len(obj)`, qui passe par un intermédiaire", correct: false}
      - {text: "Oui : `len(obj)` ne marche que sur les types intégrés", correct: false}
      - {text: "Non : `__len__` est privée, et lève une erreur hors de la classe", correct: false}
    answer: "Les méthodes spéciales sont faites pour être appelées par Python. `len` vérifie que le résultat est un entier positif ou nul, ce que l'appel direct ne fait pas."
  - key: recherche-sur-la-classe
    format: course
    question: "Où Python cherche-t-il `__len__` quand tu appelles `len(obj)` ?"
    choices:
      - {text: "Sur la classe de l'objet, pas sur l'instance", correct: true}
      - {text: "Sur l'instance d'abord, puis sur la classe", correct: false}
      - {text: "Dans le module où la classe est définie", correct: false}
      - {text: "Dans les variables globales du programme", correct: false}
    answer: "C'est une règle des méthodes spéciales : elles sont cherchées sur `type(obj)`. Un attribut d'instance nommé `__len__` n'a aucun effet sur `len`."
  - key: repli-de-in
    format: course
    question: "Que fait `x in obj` quand la classe de `obj` n'a pas de `__contains__` ?"
    choices:
      - {text: "Il parcourt l'objet avec `__iter__` ou `__getitem__`, en comparant avec `==`", correct: true}
      - {text: "Il lève une `TypeError` : l'opérateur `in` exige `__contains__`", correct: false}
      - {text: "Il compare `x` à l'objet entier avec `==`", correct: false}
      - {text: "Il cherche `x` parmi les noms d'attributs de l'objet", correct: false}
    answer: "Le parcours marche, mais en temps linéaire. `__contains__` permet une recherche plus rapide (un ensemble) ou une autre règle (sans tenir compte de la casse)."
