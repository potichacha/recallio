notion: composition
lesson: |-
  Deux façons de réutiliser une classe :

  - **l'héritage** : « est un ». Un `Chien` **est un** `Animal` ; il reprend toute son interface.
  - **la composition** : « a un ». Une `Voiture` **a un** `Moteur` ; elle le range dans un attribut et lui **délègue**
    une partie du travail.

  ```python
  class Moteur:
      def demarrer(self):
          return "vroum"


  class Voiture:
      def __init__(self, moteur):
          self.moteur = moteur              # la voiture a un moteur

      def demarrer(self):
          return self.moteur.demarrer()     # elle lui délègue le démarrage


  print(Voiture(Moteur()).demarrer())
  ```

  **« Préférer la composition à l'héritage. »** Le conseil vient du livre du *Gang of Four*, et vaut en Python :

  | | Héritage | Composition |
  |---|---|---|
  | Relation | « est un » | « a un » |
  | Couplage | fort : la sous-classe dépend des détails du parent | faible : seule l'interface du composant compte |
  | Interface reçue | **toute** celle du parent, voulue ou non | seulement ce que la classe expose |
  | Changer de comportement | une sous-classe de plus | un autre composant, même à l'exécution |
  | Tester | il faut la vraie classe parente | on passe un faux composant |

  **Les signes d'un héritage mal choisi.**

  - La sous-classe **redéfinit des méthodes du parent pour les interdire** (lever une erreur dans `clear`).
  - Elle hérite d'un type natif (`list`, `dict`) pour n'en garder que quelques méthodes : une `Pile(list)` expose aussi
    `insert` et `sort`, qui cassent la règle « dernier entré, premier sorti ».
  - Les combinaisons se multiplient : `RapportPdfMensuel`, `RapportCsvMensuel`, `RapportPdfAnnuel`... Deux composants,
    un format et une période, suffiraient.
  - Elle viole le **principe de substitution de Liskov** : un objet de la sous-classe doit pouvoir remplacer un objet
    du parent sans rien casser. Un `Carre` qui hérite d'un `Rectangle` modifiable ne le peut pas : changer sa seule
    largeur briserait le carré.

  L'héritage reste le bon outil pour une vraie relation « est un », avec une interface commune (une hiérarchie
  d'exceptions, une classe abstraite et ses implémentations).

  **En entretien** : « L'héritage modélise "est un", la composition "a un". On préfère souvent la composition : elle
  couple moins, n'expose que l'interface voulue, et permet de changer ou de simuler un composant. L'héritage convient
  quand la sous-classe peut vraiment remplacer son parent, au sens de Liskov. »
cards:
  - key: est-un-a-un
    format: course
    question: "Quel critère simple oriente le choix entre l'héritage et la composition ?"
    choices:
      - {text: "« Est un » mène à l'héritage ; « a un » mène à la composition", correct: true}
      - {text: "« A un » mène à l'héritage ; « est un » mène à la composition", correct: false}
      - {text: "L'héritage pour les petites classes ; la composition pour les grandes", correct: false}
      - {text: "L'héritage en Python ; la composition dans les langages compilés", correct: false}
    answer: "Un `Chien` est un `Animal` : héritage. Une `Voiture` a un `Moteur` : composition. Le critère se vérifie avec le principe de Liskov."
  - key: pourquoi-composition
    format: course
    question: "Pourquoi conseille-t-on souvent de préférer la composition à l'héritage ?"
    choices:
      - {text: "Elle couple moins les classes : on change un composant sans toucher au reste", correct: true}
      - {text: "Elle évite d'écrire des méthodes, que Python génère tout seul", correct: false}
      - {text: "Elle s'exécute plus vite que l'appel d'une méthode héritée", correct: false}
      - {text: "Elle est la seule forme de réutilisation permise par PEP 8", correct: false}
    answer: "La classe ne dépend que de l'interface de son composant, qu'on peut remplacer, même par un faux dans un test. L'héritage lie la sous-classe aux détails de son parent."
  - key: deleguer
    format: course
    question: "Que veut dire « déléguer », dans une composition ?"
    choices:
      - {text: "Transmettre l'appel à l'objet qu'on contient, qui fait le travail", correct: true}
      - {text: "Hériter de la méthode du parent, sans la redéfinir", correct: false}
      - {text: "Copier le code de l'autre classe dans la sienne", correct: false}
      - {text: "Confier l'appel à un thread séparé, pour aller plus vite", correct: false}
    answer: "`Voiture.demarrer` appelle `self.moteur.demarrer()` : la voiture n'expose que ce qu'elle veut, et le moteur fait le travail."
  - key: pile-herite-list
    format: course
    question: "Pourquoi une classe `Pile` qui hérite de `list` est-elle une mauvaise idée ?"
    choices:
      - {text: "Elle hérite d'`insert` et de `sort`, qui cassent l'ordre d'une pile", correct: true}
      - {text: "Parce qu'on ne peut pas hériter d'un type natif comme `list`", correct: false}
      - {text: "Parce qu'une `list` est trop lente pour servir de pile", correct: false}
      - {text: "Parce que `list` est immuable, alors qu'une pile change", correct: false}
    answer: "L'héritage donne toute l'interface du parent. Une `Pile` qui contient une liste n'expose que `empiler`, `depiler` et `sommet`."
  - key: vf-remplacer-composant
    format: true-false
    question: "Avec la composition, on peut remplacer un composant à l'exécution, par exemple par un faux dans un test."
    truth: true
    answer: "Le composant est un simple attribut, souvent reçu par le constructeur : il suffit d'en passer un autre qui a la même interface."
  - key: vf-seul-moyen
    format: true-false
    question: "L'héritage est le seul moyen de réutiliser le code d'une autre classe."
    truth: false
    answer: "La composition réutilise une classe en la contenant et en lui déléguant le travail. Les fonctions et les modules sont d'autres moyens."
  - key: vf-liskov
    format: true-false
    question: "Selon le principe de Liskov, un objet d'une sous-classe doit pouvoir remplacer un objet du parent sans casser le programme."
    truth: true
    answer: "C'est le test d'un héritage bien choisi. Une sous-classe qui refuse une méthode du parent, ou en change le sens, le viole."
  - key: vf-isinstance-composant
    format: true-false
    question: "Une `Voiture` qui contient un `Moteur` passe le test `isinstance(voiture, Moteur)`."
    truth: false
    answer: "La voiture a un moteur, elle n'en est pas un : `isinstance` ne regarde que l'héritage. C'est `voiture.moteur` qui est un `Moteur`."
  - key: qcm-relation-heritage
    format: multiple-choice
    question: "Laquelle de ces relations appelle l'héritage plutôt que la composition ?"
    choices:
      - {text: "Un `Chat` et un `Animal`", correct: true}
      - {text: "Une `Voiture` et son `Moteur`", correct: false}
      - {text: "Une `Commande` et ses `Lignes`", correct: false}
      - {text: "Un `Journal` et le `Fichier` où il écrit", correct: false}
    answer: "Un chat est un animal. Les autres relations sont des « a un » : la voiture a un moteur, la commande a des lignes, le journal a un fichier."
  - key: qcm-carre-rectangle
    format: multiple-choice
    question: "Pourquoi un `Carre` qui hérite d'un `Rectangle` modifiable pose-t-il problème ?"
    choices:
      - {text: "Changer sa seule largeur casse le carré : il ne remplace pas un rectangle", correct: true}
      - {text: "Un carré a moins d'attributs qu'un rectangle, ce que l'héritage interdit", correct: false}
      - {text: "Python refuse qu'une sous-classe ait un `__init__` différent", correct: false}
      - {text: "Un carré se calcule plus vite, et l'héritage le ralentirait", correct: false}
    answer: "Un code qui fixe la largeur d'un rectangle sans toucher à sa hauteur ne marche plus avec un carré : c'est une violation du principe de Liskov."
  - key: qcm-deleguer-ecriture
    format: multiple-choice
    question: "La classe `Journal` range un fichier dans `self._fichier`. Comment sa méthode `ecrire` délègue-t-elle l'écriture ?"
    choices:
      - {text: "`self._fichier.write(ligne)`", correct: true}
      - {text: "`super().write(ligne)`", correct: false}
      - {text: "`Journal.write(self, ligne)`", correct: false}
      - {text: "`self.write(ligne)`", correct: false}
    answer: "Le journal transmet l'appel au fichier qu'il contient. `super().write` supposerait que `Journal` hérite d'un fichier."
  - key: qcm-signe-mauvais-heritage
    format: multiple-choice
    question: "Quel signe montre qu'un héritage est mal choisi ?"
    choices:
      - {text: "La sous-classe redéfinit des méthodes du parent pour qu'elles lèvent une erreur", correct: true}
      - {text: "La sous-classe ajoute une méthode que le parent n'a pas", correct: false}
      - {text: "La sous-classe appelle `super().__init__()` dans son constructeur", correct: false}
      - {text: "La sous-classe redéfinit `__repr__` pour mieux s'afficher", correct: false}
    answer: "Refuser une partie de l'interface du parent montre que la sous-classe ne peut pas le remplacer : la composition, qui n'expose que le nécessaire, convient mieux."
  - key: situation-notificateur
    format: scenario
    question: |-
      Une classe `Commande` doit prévenir le client par e-mail, par SMS ou pas du tout, selon la configuration. Comment
      l'écris-tu ?
    choices:
      - {text: "Elle reçoit un objet notificateur, et lui délègue l'envoi", correct: true}
      - {text: "Elle hérite d'`Email` et de `Sms`, puis choisit la bonne méthode", correct: false}
      - {text: "Trois sous-classes : `CommandeEmail`, `CommandeSms` et `CommandeMuette`", correct: false}
      - {text: "Elle teste un drapeau texte dans chacune de ses méthodes", correct: false}
    answer: "Le notificateur est un composant interchangeable : un nouvel envoi (une notification push) ne demande qu'une nouvelle classe, et le test passe un faux notificateur."
  - key: situation-explosion-classes
    format: scenario
    question: |-
      Ton projet compte `RapportPdfMensuel`, `RapportCsvMensuel`, `RapportPdfAnnuel` et `RapportCsvAnnuel`, et chaque
      nouveau format ajoute autant de classes qu'il y a de périodes. Que proposes-tu ?
    choices:
      - {text: "Un `Rapport` composé d'une période et d'un format, deux objets séparés", correct: true}
      - {text: "Une classe de base de plus, pour factoriser les quatre classes", correct: false}
      - {text: "Un héritage multiple de `Pdf` et de `Mensuel` pour chaque cas", correct: false}
      - {text: "Une seule classe, avec un `if` pour chaque combinaison", correct: false}
    answer: "Deux axes qui varient indépendamment se composent : n formats et m périodes font n + m classes, au lieu de n × m."
  - key: situation-horloge
    format: scenario
    question: |-
      Ta classe `Facture` lit l'heure courante pour dater chaque facture, et tes tests échouent selon le jour où ils
      tournent. Que fais-tu ?
    choices:
      - {text: "Je lui passe une horloge en paramètre, remplacée par une fausse dans les tests", correct: true}
      - {text: "Je crée une sous-classe `FactureTest` qui redéfinit tout `__init__`", correct: false}
      - {text: "Je supprime les tests qui dépendent de la date du jour", correct: false}
      - {text: "Je fais hériter `Facture` de `datetime`, pour régler l'heure", correct: false}
    answer: "L'horloge devient un composant : en production la vraie, dans les tests une horloge fixe. Le comportement testé est le vrai, pas celui d'une sous-classe."
  - key: situation-config-dict
    format: scenario
    question: |-
      En revue, tu lis `class Config(dict)`, dont seules `get` et `charger` servent, mais qui permet aussi
      `config.clear()` n'importe où. Que proposes-tu ?
    choices:
      - {text: "Une classe qui contient un `dict` et n'expose que les méthodes utiles", correct: true}
      - {text: "Garder l'héritage : tout dictionnaire doit pouvoir être vidé", correct: false}
      - {text: "Hériter de `list` à la place, plus simple que `dict`", correct: false}
      - {text: "Hériter de `dict` et de `object`, pour masquer `clear`", correct: false}
    answer: "La composition n'expose que l'interface voulue : `Config` garde son dictionnaire dans un attribut et n'offre que `get` et `charger`."
