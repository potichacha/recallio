notion: python-face-autres
lesson: |-
  Comparer Python à Java, Go et JavaScript est une question fréquente, surtout pour un développeur qui change de
  langage. L'essentiel :

  | | Python | Java | Go | JavaScript |
  |---|---|---|---|---|
  | Typage | dynamique, **fort** ; annotations facultatives (mypy) | statique, nominal | statique, interfaces structurelles | dynamique, **faible** (`"1" + 1` vaut `"11"`) |
  | Exécution | bytecode interprété par CPython | bytecode compilé à la volée (JIT) par la JVM | binaire natif | moteur avec JIT (V8) |
  | Erreurs | exceptions | exceptions (dont vérifiées) | valeurs `error` renvoyées | exceptions |
  | Concurrence | threads limités par le GIL, `asyncio`, processus | threads, threads virtuels | goroutines et channels | boucle d'événements, `async` |
  | Absence de valeur | `None` | `null` | `nil`, valeur zéro | `null` et `undefined` |
  | Entiers | précision arbitraire | `int`, `long` bornés | `int64`... bornés | `Number` (flottant), `BigInt` |
  | Encapsulation | convention `_nom` | `private`, `protected` | majuscule exportée | `#champ` privé |
  | Dépendances | pip / uv, `pyproject.toml` | Maven, Gradle | modules Go | npm |

  **Le typage** : « dynamique » veut dire que le type est porté par l'objet et vérifié à l'exécution ; « fort », que
  Python ne convertit pas en silence : `"1" + 1` lève une `TypeError`, là où JavaScript renvoie `"11"`. Les
  **`Protocol`** de `typing` ressemblent aux interfaces de Go : un type s'y conforme sans le déclarer (typage
  structurel), vérifié par mypy.

  **Les erreurs** : Go renvoie une valeur `error` que l'appelant teste (`if err != nil`) ; Python lève une exception
  qui remonte jusqu'au premier `except` adapté, et on ne la rattrape que là où l'on sait quoi faire.

  **La concurrence** : un service Go répartit ses goroutines sur tous les cœurs ; en CPython, le GIL ne laisse qu'un
  thread exécuter du bytecode à la fois. Pour attendre beaucoup d'entrées-sorties, **`asyncio`** joue le rôle des
  goroutines ; pour calculer sur plusieurs cœurs, des **processus** (ou la version sans GIL, en option depuis 3.13).

  **Les forces de Python** : la vitesse d'écriture, la lisibilité, un écosystème sans équivalent pour les données,
  l'apprentissage automatique et les scripts. **Ses limites** : la vitesse brute (souvent 10 à 100 fois plus lent que
  Java ou Go sur une boucle de calcul, sauf à déléguer à NumPy ou à une extension en C), le calcul multicœur, et le
  déploiement d'un binaire autonome, où Go excelle.

  **Les réflexes à changer** quand on vient d'ailleurs : itérer sur les éléments plutôt que sur les indices, des
  compréhensions plutôt que des streams, des exceptions plutôt que des codes d'erreur, des modules et des fonctions
  plutôt qu'une classe pour tout, `is None` plutôt que `== null`.

  **En entretien** : « Python est dynamique mais fortement typé, interprété par CPython, avec des exceptions et un
  GIL qui limite le calcul multithread. Face à Java et Go, il gagne en vitesse d'écriture et en écosystème de
  données, et perd en performances brutes et en parallélisme ; `asyncio` et les processus compensent selon le cas. »
cards:
  - key: chaine-plus-entier
    format: course
    question: "Que donne `\"1\" + 1` en Python, comparé à JavaScript ?"
    choices:
      - {text: "Une `TypeError` en Python, `\"11\"` en JavaScript : Python est fortement typé", correct: true}
      - {text: "`\"11\"` dans les deux langages : les deux convertissent le nombre en chaîne", correct: false}
      - {text: "`2` en Python, `\"11\"` en JavaScript : Python convertit la chaîne en nombre", correct: false}
      - {text: "Une erreur dans les deux langages : aucun n'additionne une chaîne et un nombre", correct: false}
    answer: "Python ne convertit pas en silence : « can only concatenate str (not \"int\") to str ». On écrit `\"1\" + str(1)` ou `int(\"1\") + 1`. Dynamique ne veut pas dire faible."
  - key: execution
    format: course
    question: "Comment le code Python est-il exécuté, comparé à Java et à Go ?"
    choices:
      - {text: "Python : bytecode interprété par CPython ; Java : bytecode compilé à la volée ; Go : natif", correct: true}
      - {text: "Python : code natif, comme Go ; Java est le seul des trois à passer par du bytecode", correct: false}
      - {text: "Les trois compilent en code natif avant l'exécution, avec des compilateurs différents", correct: false}
      - {text: "Python et Go sont interprétés ligne à ligne ; seul Java est compilé, pour la JVM", correct: false}
    answer: "CPython compile le source en bytecode (`.pyc`), puis l'interprète ; un compilateur à la volée expérimental existe depuis 3.13. La JVM compile le bytecode chaud en natif ; Go produit directement un binaire."
  - key: equivalent-interfaces
    format: course
    question: "Quel équivalent Python aux interfaces de Java ?"
    choices:
      - {text: "Le typage canard, formalisé au besoin par `typing.Protocol` ou une classe abstraite", correct: true}
      - {text: "Le mot-clé `interface`, ajouté au langage en Python 3.8 avec les annotations", correct: false}
      - {text: "Aucun : Python ne permet pas de décrire ce qu'un objet doit savoir faire", correct: false}
      - {text: "Les modules : chaque module joue le rôle d'une interface pour ses fonctions", correct: false}
    answer: "Un objet qui a les bonnes méthodes convient, sans rien déclarer. Un `Protocol` l'écrit pour mypy (typage structurel, comme en Go) ; une `ABC` l'impose par héritage, comme en Java."
  - key: erreurs-python-go
    format: course
    question: "Comment Python et Go signalent-ils une erreur ?"
    choices:
      - {text: "Python lève une exception ; Go renvoie une valeur `error` que l'appelant teste", correct: true}
      - {text: "Les deux lèvent des exceptions, rattrapées par `try` et `catch`", correct: false}
      - {text: "Python renvoie un code d'erreur ; Go déclenche une `panic` à chaque erreur", correct: false}
      - {text: "Les deux renvoient `None` (ou `nil`) et journalisent l'erreur", correct: false}
    answer: "En Go, l'erreur est une valeur ordinaire (`if err != nil`) ; `panic` est réservé à l'imprévu. En Python, l'exception remonte seule jusqu'au premier `except` qui la traite."
  - key: vf-private
    format: true-false
    question: "Comme Java, Python a des mots-clés `private` et `protected`."
    truth: false
    answer: "Python s'appuie sur une convention : `_nom` signale un usage interne, et `__nom` déclenche une transformation du nom, sans interdire l'accès."
  - key: vf-entiers-exacts
    format: true-false
    question: "Les entiers Python sont exacts à toute taille, contrairement aux `Number` de JavaScript."
    truth: true
    answer: "Un `Number` est un flottant double, exact jusqu'à 2**53 seulement ; JavaScript a ajouté `BigInt` pour le reste. Un `int` Python grandit à la demande."
  - key: vf-protocol-structurel
    format: true-false
    question: "Les interfaces de Go et les `Protocol` de Python sont structurelles : un type s'y conforme sans le déclarer."
    truth: true
    answer: "Il suffit d'avoir les bonnes méthodes. L'inverse est le typage nominal de Java, où une classe doit écrire `implements`."
  - key: vf-type-fixe
    format: true-false
    question: "En Python comme en Go, une variable reçoit un type fixé à sa déclaration."
    truth: false
    answer: "En Python, le type est porté par l'objet, pas par le nom : `x = 1` puis `x = \"un\"` est permis. Les annotations documentent un type sans l'imposer à l'exécution."
  - key: qcm-dependances
    format: multiple-choice
    question: "Quel outillage joue en Python le rôle de Maven, ou des modules Go, pour les dépendances ?"
    choices:
      - {text: "pip (ou uv, Poetry) et un environnement virtuel, décrits dans `pyproject.toml`", correct: true}
      - {text: "npm, partagé avec JavaScript, et son fichier `package.json`", correct: false}
      - {text: "Le compilateur, qui télécharge seul les imports manquants", correct: false}
      - {text: "L'instruction `import`, qui installe un paquet absent à la volée", correct: false}
    answer: "Les dépendances se déclarent dans `pyproject.toml` et s'installent dans un environnement virtuel propre au projet ; uv fait les deux en un outil, très rapide."
  - key: qcm-null
    format: multiple-choice
    question: "Quel est l'équivalent Python du `null` de Java ?"
    choices:
      - {text: "`None`", correct: true}
      - {text: "`null`", correct: false}
      - {text: "`nil`", correct: false}
      - {text: "`undefined`", correct: false}
    answer: "`None` est l'unique objet de type `NoneType`, qu'on teste avec `is None`. `nil` est celui de Go, `undefined` celui de JavaScript."
  - key: qcm-streams
    format: multiple-choice
    question: "Quel mécanisme Python ressemble le plus aux streams de Java (`filter`, `map`, `collect`) ?"
    choices:
      - {text: "Les compréhensions et les expressions génératrices", correct: true}
      - {text: "Les décorateurs et les métaclasses", correct: false}
      - {text: "Les gestionnaires de contexte (`with`)", correct: false}
      - {text: "Les annotations de type et `typing`", correct: false}
    answer: "`[f(x) for x in xs if p(x)]` filtre et transforme d'un coup ; l'expression génératrice est paresseuse, comme un stream. `map` et `filter` existent, mais sont moins idiomatiques."
  - key: qcm-dix-mille-connexions
    format: multiple-choice
    question: "Pour gérer dix mille connexions réseau simultanées, quel outil Python rapproches-tu des goroutines de Go ?"
    choices:
      - {text: "`asyncio` et ses coroutines, sur une boucle d'événements", correct: true}
      - {text: "`threading`, avec un thread système par connexion", correct: false}
      - {text: "`multiprocessing`, avec un processus par connexion", correct: false}
      - {text: "Des générateurs simples, sans boucle d'événements", correct: false}
    answer: "Une coroutine `asyncio` coûte peu, comme une goroutine, et attend sans bloquer le thread. Dix mille threads ou processus coûteraient trop de mémoire. Les goroutines, elles, s'exécutent aussi en parallèle sur plusieurs cœurs."
  - key: situation-equipe-java
    format: scenario
    question: "Ton équipe Java te demande pourquoi écrire en Python un nouveau service d'analyse de données. Que réponds-tu ?"
    choices:
      - {text: "Son écosystème de données et sa vitesse d'écriture, au prix de performances brutes moindres", correct: true}
      - {text: "Python est plus rapide que Java à l'exécution, grâce à son interpréteur", correct: false}
      - {text: "Python est le seul langage qui sache lire des fichiers CSV et interroger une base", correct: false}
      - {text: "Python n'a pas de typage, ce qui supprime une source d'erreurs à la compilation", correct: false}
    answer: "pandas, NumPy, scikit-learn et Jupyter n'ont pas d'équivalent aussi complet en Java. Les calculs lourds y sont faits en C, ce qui compense la lenteur des boucles Python."
  - key: situation-un-seul-coeur
    format: scenario
    question: "Un service Python sature un seul cœur sur du calcul pur, alors que son équivalent Go les utilise tous. Pourquoi ?"
    choices:
      - {text: "Le GIL : un seul thread exécute du bytecode à la fois, quand Go répartit ses goroutines", correct: true}
      - {text: "Python ne crée qu'un seul thread par programme, et ignore les appels à `threading`", correct: false}
      - {text: "Le service Python manque de mémoire, et le système lui retire les autres cœurs", correct: false}
      - {text: "Go triche en compilant le calcul pour la carte graphique, ce que Python ne fait pas", correct: false}
    answer: "Le planificateur de Go place les goroutines sur tous les cœurs. En CPython, il faut des processus (`ProcessPoolExecutor`), une bibliothèque en C qui relâche le GIL, ou la version sans GIL."
  - key: situation-dev-go-erreurs
    format: scenario
    question: "Un développeur Go te demande comment Python gère les erreurs, sans `if err != nil` après chaque appel. Que lui expliques-tu ?"
    choices:
      - {text: "Une exception remonte jusqu'au premier `except` adapté : on la traite là où l'on sait réagir", correct: true}
      - {text: "Chaque fonction renvoie un couple `(valeur, erreur)`, que l'appelant doit tester lui-même", correct: false}
      - {text: "Python ignore les erreurs par défaut et continue l'exécution, sauf avec l'option `-W error`", correct: false}
      - {text: "Il faut entourer chaque appel d'un `try` / `except`, l'équivalent exact du `if err != nil`", correct: false}
    answer: "Le chemin normal reste lisible, et l'erreur traverse les couches qui n'ont rien à en faire. Un `try` autour de chaque appel reproduirait le style Go sans son avantage."
  - key: situation-pas-python
    format: scenario
    question: "En entretien : « Pour quel projet ne choisirais-tu pas Python ? » Que réponds-tu ?"
    choices:
      - {text: "Du calcul multicœur à faible latence, ou un petit binaire autonome : Go, Rust ou Java", correct: true}
      - {text: "Une API web : Python ne sait pas répondre à des requêtes HTTP sans framework Java", correct: false}
      - {text: "Un script d'automatisation : Python est trop lourd à installer pour cela", correct: false}
      - {text: "Un projet d'apprentissage automatique : les bibliothèques sont trop récentes", correct: false}
    answer: "Une bonne réponse connaît les limites de son outil : la vitesse brute, le parallélisme du calcul, la distribution d'un exécutable. Pour le web, les scripts et les données, Python est un excellent choix."
