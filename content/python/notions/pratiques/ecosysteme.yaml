notion: ecosysteme
lesson: |-
  La force de Python tient autant à son écosystème qu'au langage : des centaines de milliers de paquets sur **PyPI**,
  installés par pip ou uv. En entretien, il faut savoir situer les grands noms.

  **Le web**

  | Framework | En bref |
  |---|---|
  | **Django** | « batteries incluses » : ORM, migrations, administration générée, authentification, formulaires, gabarits |
  | **Flask** | un micro-framework : le routage et peu d'autre chose, le reste en extensions |
  | **FastAPI** | des API modernes : validation et documentation OpenAPI tirées des annotations de type (via **Pydantic**), asynchrone natif |

  Les serveurs : **WSGI** (Gunicorn) pour les applications synchrones, **ASGI** (Uvicorn) pour l'asynchrone et les
  WebSockets. Autour : **SQLAlchemy** (l'ORM le plus répandu hors de Django), **Celery** (des tâches en arrière-plan),
  **httpx** et **requests** (les clients HTTP).

  **Les données et l'IA**

  - **NumPy** : des tableaux de nombres de type homogène, et des opérations **vectorisées** exécutées en C, cent fois
    plus rapides qu'une boucle Python.
  - **pandas** (et **Polars**, plus récent et plus rapide) : des **DataFrame**, des tableaux étiquetés à la manière
    d'un tableur ou d'une table SQL ; lire un CSV, filtrer, grouper, joindre.
  - **Matplotlib**, **seaborn** : les graphiques. **Jupyter** : des carnets interactifs, mêlant code, résultats et texte.
  - **scikit-learn** : l'apprentissage automatique classique. **PyTorch** : l'apprentissage profond.

  **Les scripts et l'automatisation** : la bibliothèque standard suffit souvent, avec **`argparse`** (les arguments de
  la ligne de commande), **`pathlib`** (les fichiers), **`subprocess`** (lancer des commandes), `json`, `csv`,
  `logging`. **Click** et **Typer** rendent les interfaces en ligne de commande plus agréables.

  **L'outillage** : **pip** et les environnements virtuels (`venv`), ou **uv**, écrit en Rust, qui gère les deux bien
  plus vite ; **Poetry** ; le tout décrit dans `pyproject.toml`. **pytest** pour les tests, **Ruff** pour le style,
  **mypy** pour les types.

  **En entretien** : « Pour le web, Django quand il faut tout (ORM, administration), FastAPI pour une API typée et
  asynchrone, Flask pour rester léger. Pour les données, NumPy et pandas, qui délèguent le calcul au C. Pour les
  scripts, la bibliothèque standard : `argparse`, `pathlib`, `subprocess`. »
cards:
  - key: apport-fastapi
    format: course
    question: "Qu'apporte FastAPI, comparé à Flask ?"
    choices:
      - {text: "La validation et la documentation OpenAPI tirées des annotations, et l'asynchrone natif", correct: true}
      - {text: "Un ORM, une interface d'administration et l'authentification, livrés avec le framework", correct: false}
      - {text: "Un moteur de gabarits HTML plus rapide, compilé en C à l'installation du framework", correct: false}
      - {text: "La compilation de l'application en un binaire natif, plus rapide à déployer", correct: false}
    answer: "Une fonction annotée (`def lire(id: int) -> Produit`) suffit : FastAPI valide l'entrée avec Pydantic, sérialise la sortie et publie la documentation. L'ORM et l'administration intégrés, c'est Django."
  - key: vitesse-numpy
    format: course
    question: "Pourquoi une opération NumPy sur un million de nombres est-elle bien plus rapide qu'une boucle Python ?"
    choices:
      - {text: "Elle est vectorisée : une boucle en C sur un tableau de type homogène", correct: true}
      - {text: "NumPy lance automatiquement un thread par élément du tableau", correct: false}
      - {text: "NumPy arrondit les nombres pour calculer moins de décimales", correct: false}
      - {text: "Python compile les boucles NumPy en bytecode plus court", correct: false}
    answer: "Une boucle Python manipule des objets un par un, avec leurs vérifications de type. NumPy range des nombres bruts côte à côte et les traite dans une boucle en C."
  - key: wsgi-asgi
    format: course
    question: "Quelle différence entre WSGI et ASGI ?"
    choices:
      - {text: "WSGI sert les applications synchrones ; ASGI ajoute l'asynchrone et les WebSockets", correct: true}
      - {text: "WSGI est réservé à Django, et ASGI à Flask et à FastAPI", correct: false}
      - {text: "WSGI est un serveur web complet, ASGI un simple format de journal", correct: false}
      - {text: "Aucune : ASGI est seulement le nouveau nom de WSGI depuis Python 3", correct: false}
    answer: "Ce sont deux interfaces entre le serveur et l'application. Gunicorn sert du WSGI, Uvicorn de l'ASGI ; FastAPI est ASGI, Django parle les deux."
  - key: batteries-django
    format: course
    question: "Que signifie « batteries incluses » à propos de Django ?"
    choices:
      - {text: "Il fournit ORM, administration, authentification et formulaires, sans paquet tiers", correct: true}
      - {text: "Il s'installe avec Python lui-même, dans la bibliothèque standard", correct: false}
      - {text: "Il fonctionne sans base de données, en gardant tout en mémoire", correct: false}
      - {text: "Il consomme peu d'énergie, ce qui le destine aux appareils mobiles", correct: false}
    answer: "Django donne tout le nécessaire pour une application web complète, avec des choix déjà faits. Il reste un paquet tiers, à installer avec pip."
  - key: vf-pandas-numpy
    format: true-false
    question: "pandas s'appuie sur NumPy pour stocker et calculer ses colonnes."
    truth: true
    answer: "Une colonne de DataFrame repose sur un tableau NumPy (ou, en option, Arrow) : les opérations sur les colonnes sont vectorisées."
  - key: vf-fastapi-pydantic
    format: true-false
    question: FastAPI s'appuie sur Pydantic pour valider les données des requêtes.
    truth: true
    answer: "Les modèles Pydantic décrivent les données par des annotations ; une requête invalide reçoit automatiquement une réponse 422 qui détaille les erreurs."
  - key: vf-django-micro
    format: true-false
    question: Django est un micro-framework, qui ne fournit ni ORM ni authentification.
    truth: false
    answer: "C'est l'inverse : Django est le framework complet. Le micro-framework, c'est Flask."
  - key: vf-arguments-framework
    format: true-false
    question: Un script a besoin d'un paquet tiers pour lire les arguments de sa ligne de commande.
    truth: false
    answer: "Le module standard `argparse` gère les options, les arguments, les valeurs par défaut et l'aide (`--help`). Click et Typer apportent du confort, pas une nécessité."
  - key: qcm-dataframe
    format: multiple-choice
    question: "Quelle bibliothèque manipule des tableaux de données étiquetés, les DataFrame ?"
    choices:
      - {text: "pandas", correct: true}
      - {text: "Flask", correct: false}
      - {text: "pytest", correct: false}
      - {text: "Click", correct: false}
    answer: "pandas lit un CSV en un DataFrame, puis le filtre, le groupe et le joint, comme une table SQL. Polars en est une alternative récente."
  - key: qcm-argparse
    format: multiple-choice
    question: "Quel module de la bibliothèque standard lit les arguments de la ligne de commande ?"
    choices:
      - {text: "`argparse`", correct: true}
      - {text: "`click`", correct: false}
      - {text: "`typer`", correct: false}
      - {text: "`cmdargs`", correct: false}
    answer: "`argparse` est livré avec Python. Click et Typer sont des paquets tiers, plus concis ; `cmdargs` n'existe pas."
  - key: qcm-taches-fond
    format: multiple-choice
    question: "Quel outil exécute les tâches en arrière-plan (envoi de courriels, rapports) d'une application Django ?"
    choices:
      - {text: "Celery", correct: true}
      - {text: "pandas", correct: false}
      - {text: "Jupyter", correct: false}
      - {text: "Pydantic", correct: false}
    answer: "Celery confie les tâches à des processus séparés par un courtier de messages (Redis, RabbitMQ) : la requête web répond tout de suite."
  - key: qcm-uv
    format: multiple-choice
    question: "Quel outil récent, écrit en Rust, remplace pip et venv en beaucoup plus rapide ?"
    choices:
      - {text: "uv", correct: true}
      - {text: "conda", correct: false}
      - {text: "pipx", correct: false}
      - {text: "Poetry", correct: false}
    answer: "uv installe les paquets, crée les environnements et gère les versions de Python. Poetry et pipx sont écrits en Python ; conda vient de l'écosystème scientifique."
  - key: situation-api-modele
    format: scenario
    question: "Ton équipe doit exposer un modèle d'apprentissage automatique par une API REST, avec sa documentation. Que choisis-tu ?"
    choices:
      - {text: "FastAPI : validation par Pydantic, documentation OpenAPI générée, et asynchrone", correct: true}
      - {text: "Django, pour son interface d'administration, indispensable à toute API REST", correct: false}
      - {text: "Un serveur HTTP écrit à la main avec le module `socket`, plus léger", correct: false}
      - {text: "Jupyter, en partageant le carnet du modèle avec les équipes clientes", correct: false}
    answer: "Une API de prédiction n'a besoin ni d'ORM ni d'administration : FastAPI valide les entrées, documente l'API et sert de nombreuses requêtes concurrentes."
  - key: situation-csv-lent
    format: scenario
    question: "Un analyste traite un CSV de deux millions de lignes avec des boucles `for` imbriquées, et c'est très lent. Que lui conseilles-tu ?"
    choices:
      - {text: "pandas ou Polars, avec des opérations vectorisées sur les colonnes", correct: true}
      - {text: "Plus de threads, un par ligne, pour paralléliser les boucles", correct: false}
      - {text: "Convertir le CSV en JSON, plus rapide à lire pour Python", correct: false}
      - {text: "Réécrire les boucles avec `while`, plus rapides que `for`", correct: false}
    answer: "Un filtre ou un regroupement sur une colonne s'exécute en code compilé, sur tout le tableau d'un coup. Les threads n'aident pas un calcul en Python pur, à cause du GIL."
  - key: situation-script-renommage
    format: scenario
    question: "On te demande un petit outil, lancé par l'équipe, qui renomme des fichiers selon une règle. Que prends-tu ?"
    choices:
      - {text: "La bibliothèque standard : `argparse` pour les options, `pathlib` pour les fichiers", correct: true}
      - {text: "Django, pour proposer aussi une interface d'administration des fichiers", correct: false}
      - {text: "pandas, pour charger la liste des fichiers dans un DataFrame avant tout", correct: false}
      - {text: "FastAPI, pour que l'équipe déclenche le renommage par une requête HTTP", correct: false}
    answer: "Un script sans dépendance s'installe partout : `argparse` donne les options et l'aide, `pathlib` liste et renomme (`Path.rename`). Un framework n'apporterait que du poids."
  - key: situation-startup
    format: scenario
    question: "Une jeune entreprise veut vite un site avec comptes, administration et base de données. Que lui proposes-tu ?"
    choices:
      - {text: "Django : ORM, authentification et administration générée sont fournis", correct: true}
      - {text: "Flask seul, en écrivant à la main l'ORM et l'authentification", correct: false}
      - {text: "FastAPI, qui génère aussi l'interface d'administration du site", correct: false}
      - {text: "Des scripts `argparse` lancés par les administrateurs du site", correct: false}
    answer: "Django couvre tout ce besoin dès l'installation, avec des choix éprouvés. Flask demanderait d'assembler et de maintenir de nombreuses extensions."
  - key: definition-pypi
    format: definition
    question: "Qu'est-ce que PyPI ?"
    choices:
      - {text: "Le dépôt public des paquets Python, d'où pip et uv les téléchargent", correct: true}
      - {text: "L'interpréteur officiel de Python, écrit en C et maintenu par la PSF", correct: false}
      - {text: "Une version de Python compilée à la volée, plus rapide que CPython", correct: false}
      - {text: "Le guide de style des paquets Python, publié sous forme de PEP", correct: false}
    answer: "Le *Python Package Index* héberge les paquets publiés par la communauté. L'interpréteur à compilation à la volée, c'est PyPy, un nom proche à ne pas confondre."
  - key: definition-dataframe
    format: definition
    question: "Qu'est-ce qu'un DataFrame, dans pandas ?"
    choices:
      - {text: "Un tableau à deux dimensions, aux colonnes nommées et typées", correct: true}
      - {text: "Un cadre de fenêtre graphique pour afficher des données", correct: false}
      - {text: "Un format de fichier binaire pour échanger des tableaux", correct: false}
      - {text: "Une liste de dictionnaires qui partagent les mêmes clés", correct: false}
    answer: "Comme une feuille de tableur ou une table SQL : des lignes indexées, des colonnes nommées d'un type chacune, et des opérations sur des colonnes entières."
  - key: definition-orm
    format: definition
    question: "Qu'est-ce qu'un ORM, comme celui de Django ou SQLAlchemy ?"
    choices:
      - {text: "Une couche qui relie les classes du programme aux tables de la base", correct: true}
      - {text: "Un serveur de base de données écrit entièrement en Python", correct: false}
      - {text: "Un format d'export des tables d'une base vers des fichiers CSV", correct: false}
      - {text: "Un outil qui mesure les performances des requêtes SQL", correct: false}
    answer: "*Object-Relational Mapping* : un objet `Produit` correspond à une ligne de la table `produit`, et `Produit.objects.filter(...)` produit la requête SQL."
  - key: definition-vectorisation
    format: definition
    question: "Que veut dire une opération « vectorisée », en NumPy ou en pandas ?"
    choices:
      - {text: "Elle s'applique à tout un tableau d'un coup, dans du code compilé", correct: true}
      - {text: "Elle transforme les nombres en vecteurs géométriques avant le calcul", correct: false}
      - {text: "Elle s'exécute sur la carte graphique, en parallèle, par défaut", correct: false}
      - {text: "Elle convertit le tableau en liste Python pour le parcourir", correct: false}
    answer: "`prix * 1.2` multiplie toute une colonne sans boucle Python : la boucle a lieu en C. C'est la clé des performances de ces bibliothèques."
