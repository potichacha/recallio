notion: questions-entretien
lesson: |-
  Certaines questions reviennent dans presque tous les entretiens Python. Une bonne réponse tient en deux ou trois
  phrases, avec un exemple, et montre qu'on connaît la limite de ce qu'on affirme.

  | Question | L'essentiel de la réponse |
  |---|---|
  | Mutable ou immuable ? | listes, dictionnaires, ensembles, objets ordinaires sont mutables ; entiers, flottants, chaînes, tuples, `frozenset` sont immuables. Seuls les objets hachables (en pratique, immuables) servent de clés |
  | Passage des arguments ? | « par référence d'objet » : la fonction reçoit l'objet lui-même ; le modifier se voit chez l'appelant, réaffecter le paramètre non |
  | Liste ou tuple ? | liste mutable et homogène ; tuple immuable, souvent un enregistrement, hachable si son contenu l'est |
  | `==` ou `is` ? | valeur ou identité ; `is` pour `None` |
  | Le GIL ? | dans CPython, un seul thread exécute du bytecode à la fois : les threads aident pour les entrées-sorties, pas pour le calcul (processus, ou la version sans GIL, expérimentale depuis 3.13) |
  | Générateur ? | une fonction avec `yield`, qui produit ses valeurs à la demande, en mémoire constante |
  | Décorateur ? | une fonction qui reçoit une fonction et en renvoie une autre ; `@deco` équivaut à `f = deco(f)` ; `functools.wraps` garde le nom et la docstring |
  | `*args`, `**kwargs` ? | les arguments positionnels en trop dans un tuple, les nommés en trop dans un dictionnaire |
  | `@staticmethod`, `@classmethod` ? | la seconde reçoit la classe (`cls`), utile pour des constructeurs alternatifs ; la première ne reçoit rien |
  | Gestion de la mémoire ? | un compteur de références, complété par un ramasse-miettes qui détecte les cycles |
  | `if __name__ == "__main__":` ? | n'exécute le bloc que si le fichier est lancé comme script, pas quand il est importé |
  | Copie superficielle ou profonde ? | `copy()` copie le conteneur, pas son contenu ; `deepcopy` copie tout, récursivement |

  **Un exemple qui fait mouche** : pour le passage des arguments,

  ```python
  def ajouter(liste):
      liste.append(4)      # modifie l'objet de l'appelant
      liste = [0]          # ne fait que relier le nom local

  nombres = [1, 2, 3]
  ajouter(nombres)
  print(nombres)           # [1, 2, 3, 4]
  ```

  **Les questions ouvertes** (« Comment traiterais-tu un fichier de 50 Go ? », « Pourquoi ce code multithread ne va-t-il
  pas plus vite ? ») attendent un raisonnement : nommer le mécanisme (itération paresseuse, GIL), puis l'outil
  (générateur, `multiprocessing`, `asyncio`), puis la limite.

  **En entretien** : « Je réponds en une phrase, puis un exemple, puis la nuance : par exemple, les threads ne
  parallélisent pas le calcul à cause du GIL de CPython, mais ils servent pour les entrées-sorties, et on passe par des
  processus pour le calcul. »
cards:
  - key: passage-arguments
    format: course
    question: "« Python passe-t-il les arguments par valeur ou par référence ? » Quelle réponse est la plus juste ?"
    choices:
      - {text: "Par référence d'objet : l'objet est partagé, mais réaffecter le paramètre reste local", correct: true}
      - {text: "Par valeur : la fonction reçoit toujours une copie complète de l'objet transmis", correct: false}
      - {text: "Par référence : réaffecter le paramètre change aussi la variable de l'appelant", correct: false}
      - {text: "Par valeur pour les listes, et par référence pour les entiers et les chaînes", correct: false}
    answer: "La fonction reçoit l'objet lui-même : `liste.append(4)` se voit chez l'appelant. Mais `liste = [0]` ne fait que relier le nom local à un autre objet. Avec un objet immuable, aucune modification n'est possible, d'où l'impression d'un passage par valeur."
  - key: gestion-memoire
    format: course
    question: "« Comment CPython gère-t-il la mémoire ? » Quelle réponse attend l'examinateur ?"
    choices:
      - {text: "Un compteur de références, complété par un ramasse-miettes qui détecte les cycles", correct: true}
      - {text: "Un ramasse-miettes seul, qui parcourt périodiquement tout le tas, comme la JVM", correct: false}
      - {text: "Une libération manuelle des objets avec `del`, comme `free` en langage C", correct: false}
      - {text: "Une allocation sur la pile, libérée automatiquement à la sortie de chaque fonction", correct: false}
    answer: "Un objet est libéré dès que son compteur de références tombe à zéro ; le module `gc` repère les cycles (deux objets qui se référencent), que le compteur seul ne libère jamais. `del` supprime un nom, pas l'objet."
  - key: liste-ou-tuple
    format: course
    question: "« Quelle différence entre une liste et un tuple ? » Quelle réponse est la plus complète ?"
    choices:
      - {text: "Liste mutable ; tuple immuable, hachable si son contenu l'est, donc utilisable en clé", correct: true}
      - {text: "Le tuple se parcourt plus vite, la liste se trie plus vite, et rien d'autre ne change", correct: false}
      - {text: "La liste n'accepte qu'un seul type d'éléments, le tuple accepte des types mélangés", correct: false}
      - {text: "Le tuple est une liste figée par le compilateur, convertie en liste à l'exécution", correct: false}
    answer: "La différence de fond est la mutabilité : on ajoute à une liste, pas à un tuple. Un tuple sert d'enregistrement (`(x, y)`) ou de clé de dictionnaire, à condition que ses éléments soient hachables."
  - key: name-main
    format: course
    question: "« À quoi sert `if __name__ == \"__main__\":` ? » Que réponds-tu ?"
    choices:
      - {text: "À n'exécuter le bloc que si le fichier est lancé comme script, pas importé", correct: true}
      - {text: "À déclarer la fonction principale du programme, comme `main` en Java ou en C", correct: false}
      - {text: "À empêcher tout autre fichier du projet d'importer ce module", correct: false}
      - {text: "À n'exécuter le bloc qu'une fois, même si le module est importé deux fois", correct: false}
    answer: "Python met `__name__` à `\"__main__\"` pour le fichier lancé, et au nom du module quand il est importé. Le bloc protège le code de lancement : l'importer, pour un test par exemple, ne déclenche rien."
  - key: vf-gil-entrees-sorties
    format: true-false
    question: "Le GIL de CPython empêche deux threads d'exécuter du bytecode en même temps, mais pas d'attendre des entrées-sorties en parallèle."
    truth: true
    answer: "Un thread qui attend le réseau ou le disque relâche le GIL : les threads accélèrent donc les programmes qui attendent, pas ceux qui calculent. Depuis 3.13, une version de CPython sans GIL existe, en option."
  - key: vf-generateur-calcule-tout
    format: true-false
    question: Un générateur calcule toutes ses valeurs dès sa création, puis les rend une à une.
    truth: false
    answer: "Il ne calcule rien à sa création : chaque `next()` reprend la fonction jusqu'au `yield` suivant. C'est ce qui permet de parcourir un fichier énorme en mémoire constante."
  - key: vf-decorateur
    format: true-false
    question: "Un décorateur est une fonction qui reçoit une fonction et renvoie une fonction, souvent une enveloppe de l'originale."
    truth: true
    answer: "`@chrono` au-dessus de `def f` équivaut à `f = chrono(f)`. L'enveloppe accepte `*args, **kwargs`, appelle l'originale et renvoie son résultat."
  - key: vf-chaine-modifiable
    format: true-false
    question: "Une chaîne Python se modifie sur place : `s[0] = \"X\"` remplace son premier caractère."
    truth: false
    answer: "Les chaînes sont immuables : l'affectation lève une `TypeError`. On construit une nouvelle chaîne : `\"X\" + s[1:]`."
  - key: qcm-static-class
    format: multiple-choice
    question: "Quelle différence entre `@staticmethod` et `@classmethod` cite-t-on en entretien ?"
    choices:
      - {text: "`@classmethod` reçoit la classe (`cls`), `@staticmethod` ne reçoit rien d'implicite", correct: true}
      - {text: "`@staticmethod` reçoit l'instance (`self`), `@classmethod` reçoit la classe", correct: false}
      - {text: "`@classmethod` s'appelle sans instance, `@staticmethod` exige une instance", correct: false}
      - {text: "Aucune : ce sont deux noms pour le même décorateur, gardés pour l'histoire", correct: false}
    answer: "`@classmethod` sert aux constructeurs alternatifs (`Date.depuis_texte(...)`), qui marchent aussi pour les sous-classes grâce à `cls`. `@staticmethod` range une fonction utilitaire dans la classe."
  - key: qcm-expression-generatrice
    format: multiple-choice
    question: "Quand préférer une expression génératrice à une compréhension de liste ?"
    choices:
      - {text: "Quand on parcourt les valeurs une fois, sans tout garder en mémoire", correct: true}
      - {text: "Quand on doit parcourir le résultat plusieurs fois de suite", correct: false}
      - {text: "Quand on veut connaître la longueur du résultat avec `len`", correct: false}
      - {text: "Quand on veut accéder aux valeurs par indice, comme `r[3]`", correct: false}
    answer: "`sum(x * x for x in xs)` ne construit pas de liste. Un générateur ne se parcourt qu'une fois, et n'a ni `len` ni indice : ces besoins demandent une liste."
  - key: qcm-cles-dictionnaire
    format: multiple-choice
    question: "Quels objets peuvent servir de clés de dictionnaire ?"
    choices:
      - {text: "Les objets hachables : nombres, chaînes, tuples d'immuables, `frozenset`", correct: true}
      - {text: "Tous les objets sans exception, listes et dictionnaires compris", correct: false}
      - {text: "Seulement les chaînes et les entiers, comme en JSON", correct: false}
      - {text: "Seulement les objets mutables, pour pouvoir changer la clé", correct: false}
    answer: "Une clé doit avoir un hachage stable : une liste, modifiable, lèverait « unhashable type: 'list' ». Un tuple qui contient une liste n'est pas hachable non plus."
  - key: qcm-args-kwargs
    format: multiple-choice
    question: "« Que sont `*args` et `**kwargs` ? » Quelle réponse est juste ?"
    choices:
      - {text: "Les positionnels en trop dans un tuple, les nommés en trop dans un dictionnaire", correct: true}
      - {text: "Des pointeurs vers les arguments, comme `*` et `**` en langage C", correct: false}
      - {text: "Les arguments obligatoires, puis les arguments facultatifs de la fonction", correct: false}
      - {text: "Deux listes : les arguments reçus, puis leurs noms dans le même ordre", correct: false}
    answer: "Les noms `args` et `kwargs` sont une convention ; ce sont `*` et `**` qui comptent. Au moment d'un appel, les mêmes opérateurs déballent : `f(*liste, **options)`."
  - key: situation-threads-calcul
    format: scenario
    question: "L'examinateur demande pourquoi son programme multithread de calcul ne va pas plus vite. Que réponds-tu ?"
    choices:
      - {text: "Le GIL exécute un thread à la fois : pour du calcul, des processus, ou un CPython sans GIL", correct: true}
      - {text: "Il manque des verrous : les threads se gênent, il faut en ajouter autour du calcul", correct: false}
      - {text: "Il faut plus de threads que de cœurs, pour compenser le coût de leur création", correct: false}
      - {text: "Python ne sait pas créer de vrais threads système, seulement des threads simulés", correct: false}
    answer: "Les threads de CPython sont de vrais threads système, mais le GIL sérialise le bytecode. `multiprocessing` ou `concurrent.futures.ProcessPoolExecutor` donnent un interpréteur par cœur ; la version sans GIL (3.13, en option) change la donne."
  - key: situation-decorateur-chrono
    format: scenario
    question: "On te demande d'écrire un décorateur qui mesure le temps d'exécution. Qu'est-ce qui montre que tu maîtrises le sujet ?"
    choices:
      - {text: "Une enveloppe en `*args, **kwargs`, avec `functools.wraps`, qui renvoie le résultat", correct: true}
      - {text: "Une classe avec `__init__` et `__call__`, la seule manière d'écrire un décorateur", correct: false}
      - {text: "Un `print` de l'heure au début de la fonction, ajouté à la main dans chaque fonction", correct: false}
      - {text: "Une enveloppe sans paramètres, qui appelle la fonction d'origine sans arguments", correct: false}
    answer: "L'enveloppe doit accepter n'importe quels arguments, renvoyer le résultat de la fonction, et garder son nom et sa docstring grâce à `@functools.wraps(f)`. `time.perf_counter()` mesure la durée."
  - key: situation-fichier-50-go
    format: scenario
    question: "On te demande de compter les lignes d'erreur d'un journal de 50 Go. Que proposes-tu ?"
    choices:
      - {text: "Itérer sur le fichier ouvert, ligne par ligne, en mémoire constante", correct: true}
      - {text: "Charger le fichier avec `readlines()`, puis filtrer la liste obtenue", correct: false}
      - {text: "Lire le fichier avec `read()`, puis le découper avec `split(\"\\n\")`", correct: false}
      - {text: "Copier le fichier dans une liste Python, triée pour aller plus vite", correct: false}
    answer: "Un fichier ouvert est un itérateur de lignes : `sum(1 for ligne in f if \"ERROR\" in ligne)` ne garde qu'une ligne à la fois. `read()` et `readlines()` chargeraient les 50 Go en mémoire."
  - key: situation-mutables
    format: scenario
    question: "À la question « Qu'est-ce qui est mutable en Python ? », que réponds-tu ?"
    choices:
      - {text: "Listes, dictionnaires, ensembles, objets ordinaires ; entiers, chaînes et tuples sont immuables", correct: true}
      - {text: "Tout est mutable en Python, puisque toute variable peut recevoir une nouvelle valeur", correct: false}
      - {text: "Seules les listes sont mutables ; tous les autres types de Python sont immuables", correct: false}
      - {text: "Les entiers et les chaînes sont mutables, les listes et les dictionnaires immuables", correct: false}
    answer: "Réaffecter une variable n'est pas modifier un objet : `x = x + 1` crée un nouvel entier. Un objet mutable change sur place (`append`, `d[k] = v`), et tous les noms qui le désignent voient le changement."
