notion: debogage
lesson: |-
  **Lire une pile d'appels (traceback)**

  ```
  Traceback (most recent call last):
    File "main.py", line 14, in <module>
      print(inscrire("Linus", "trente"))
            ~~~~~~~~^^^^^^^^^^^^^^^^^^^
    File "main.py", line 9, in inscrire
      age = lire_age(age_texte)
    File "main.py", line 5, in lire_age
      return int(texte)
  ValueError: invalid literal for int() with base 10: 'trente'
  ```

  - « **most recent call last** » : l'appel le plus récent est **en bas**. On lit donc **de bas en haut**.
  - **La dernière ligne** donne le **type** de l'exception et son **message** : on commence par elle.
  - **Le cadre le plus bas** est la ligne qui a levé l'exception ; en remontant, on trouve qui l'a appelée, jusqu'au
    `<module>` d'origine. Dans une pile qui traverse une bibliothèque, on cherche le **dernier cadre de son propre
    code** : c'est souvent là qu'une mauvaise valeur est entrée.
  - Depuis Python 3.11, des `~~~^^^` désignent l'expression en faute, quand elle n'occupe pas toute la ligne.
  - « **During handling of the above exception, another exception occurred** » : une seconde exception est née dans
    le `except` qui traitait la première. « **The above exception was the direct cause** » : un `raise ... from ...`
    volontaire.

  **Le débogueur pdb**

  `breakpoint()` (Python 3.7) arrête le programme à cette ligne et ouvre **pdb**, sans rien importer :

  | Commande | Effet |
  |---|---|
  | `n` (next) | exécute la ligne, sans entrer dans les fonctions appelées |
  | `s` (step) | entre dans la fonction appelée |
  | `c` (continue) | reprend jusqu'au prochain point d'arrêt |
  | `r` (return) | continue jusqu'à la fin de la fonction courante |
  | `p expr`, `pp expr` | affiche une valeur (joliment, pour `pp`) |
  | `l`, `ll` | montre le code autour de la ligne courante, ou toute la fonction |
  | `w`, `u`, `d` | montre la pile, monte ou descend d'un cadre |
  | `b 42` | pose un point d'arrêt à la ligne 42 |
  | `q` | quitte |

  - `python -m pdb script.py` lance un script sous pdb, et s'y arrête en cas d'exception (le **post-mortem**).
  - `import pdb; pdb.pm()`, dans l'interpréteur interactif, ouvre pdb là où la dernière exception a été levée.
  - `pytest --pdb` ouvre pdb au premier test en échec ; `pytest --showlocals` (`-l`) affiche les variables locales de
    chaque cadre.
  - La variable d'environnement **`PYTHONBREAKPOINT=0`** désactive tous les `breakpoint()` ; Ruff (règle `T100`)
    signale ceux qu'on a oubliés.

  **Les autres outils** : un `print` bien placé reste efficace pour une question simple, `logging` pour ce qui doit
  rester en production, et le débogueur graphique de l'éditeur (VS Code, PyCharm) offre les mêmes commandes que pdb.

  **En entretien** : « Je lis la pile de bas en haut : la dernière ligne dit l'erreur, le cadre le plus bas de mon code
  dit où. Pour comprendre un mauvais résultat, je pose un `breakpoint()` et j'avance avec `n`, `s` et `p`. En CI, des
  journaux et `pytest -l` remplacent le débogueur. »
tour:
  - title: "Lire une pile d'appels"
    text: |-
      Quand une exception n'est pas rattrapée, Python affiche la **pile d'appels** : chaque appel en cours, du plus
      ancien (en haut) au plus récent (en bas), puis le type de l'exception et son message.

      Ce programme rattrape l'erreur pour afficher lui-même la pile, avec `traceback.extract_tb` : la dernière ligne
      est celle qui a levé l'exception, dans `lire_age`.

      Essaie : retire le `try` et le `except` (garde les deux `print` de la saisie, désindentés), puis exécute. Python
      affiche lui-même la pile, dans le même ordre, et termine par `ValueError`.
    example:
      files:
        main.py: |-
          import traceback


          def lire_age(texte):
              return int(texte)


          def inscrire(nom, age_texte):
              age = lire_age(age_texte)
              return f"{nom}, {age} ans"


          try:
              print(inscrire("Ada", "36"))
              print(inscrire("Linus", "trente"))
          except ValueError as erreur:
              print("Erreur :", erreur)
              print("Pile, de l'appel le plus ancien au plus récent :")
              for cadre in traceback.extract_tb(erreur.__traceback__):
                  print(f"  ligne {cadre.lineno}, dans {cadre.name} : {cadre.line}")
      output: |-
        Ada, 36 ans
        Erreur : invalid literal for int() with base 10: 'trente'
        Pile, de l'appel le plus ancien au plus récent :
          ligne 15, dans <module> : print(inscrire("Linus", "trente"))
          ligne 9, dans inscrire : age = lire_age(age_texte)
          ligne 5, dans lire_age : return int(texte)
cards:
  - key: ou-est-l-erreur
    format: course
    question: Dans une pile d'appels Python, où se trouve la ligne qui a levé l'exception ?
    choices:
      - {text: "Tout en bas, juste au-dessus du type et du message de l'exception", correct: true}
      - {text: "Tout en haut : la pile commence par l'appel le plus récent", correct: false}
      - {text: "Au milieu, sur la ligne marquée « most recent call last »", correct: false}
      - {text: "Nulle part : la pile ne montre que les appels de fonctions", correct: false}
    answer: "« most recent call last » : le cadre le plus récent, celui qui a levé l'exception, est le dernier. On lit la pile de bas en haut."
  - key: role-breakpoint
    format: course
    question: "Que fait l'appel `breakpoint()` dans un programme ?"
    choices:
      - {text: "Il arrête le programme à cette ligne et ouvre le débogueur pdb", correct: true}
      - {text: "Il affiche la pile d'appels courante, puis le programme continue", correct: false}
      - {text: "Il lève une exception qui arrête définitivement le programme", correct: false}
      - {text: "Il journalise chaque ligne exécutée à partir de cet endroit", correct: false}
    answer: "`breakpoint()` (Python 3.7) appelle le débogueur configuré, pdb par défaut : on inspecte les variables et on avance pas à pas."
  - key: exceptions-enchainees
    format: course
    question: "Que signifie, dans une pile, « During handling of the above exception, another exception occurred » ?"
    choices:
      - {text: "Une seconde exception est née dans le `except` qui traitait la première", correct: true}
      - {text: "La même exception a été levée deux fois de suite, au même endroit", correct: false}
      - {text: "Le programme a rattrapé l'exception, puis l'a relancée avec `raise ... from`", correct: false}
      - {text: "Deux threads ont levé une exception exactement au même moment", correct: false}
    answer: "C'est le chaînage implicite : le bloc `except` lui-même a échoué. Un `raise ... from erreur` volontaire affiche à la place « The above exception was the direct cause of the following exception »."
  - key: desactiver-breakpoints
    format: course
    question: "Comment désactiver tous les `breakpoint()` oubliés d'un programme, sans toucher au code ?"
    choices:
      - {text: "Avec la variable d'environnement `PYTHONBREAKPOINT=0`", correct: true}
      - {text: "Avec l'option `python -O`, qui retire les points d'arrêt", correct: false}
      - {text: "Avec la variable d'environnement `PYTHONDEBUG=0`", correct: false}
      - {text: "Avec l'option `python --no-breakpoints`", correct: false}
    answer: "`breakpoint()` consulte `PYTHONBREAKPOINT` : `0` le rend inactif. `-O` retire les `assert`, pas les points d'arrêt."
  - key: vf-next
    format: true-false
    question: "Dans pdb, la commande `n` exécute la ligne courante sans entrer dans les fonctions qu'elle appelle."
    truth: true
    answer: "`n` (next) passe à la ligne suivante de la même fonction ; `s` (step) entre dans la fonction appelée."
  - key: vf-derniere-ligne
    format: true-false
    question: La dernière ligne d'une pile d'appels donne le type de l'exception et son message.
    truth: true
    answer: "Par exemple « ValueError: invalid literal for int() with base 10: 'trente' » : c'est la première chose à lire."
  - key: vf-import-pdb
    format: true-false
    question: "Pour utiliser `breakpoint()`, il faut d'abord importer le module `pdb`."
    truth: false
    answer: "`breakpoint()` est une fonction native depuis Python 3.7 : elle importe et lance le débogueur elle-même."
  - key: vf-recent-en-haut
    format: true-false
    question: "« most recent call last » signifie que l'appel le plus récent figure en haut de la pile."
    truth: false
    answer: "Il figure en dernier, en bas. En haut se trouve l'appel d'origine, souvent `<module>`."
  - key: qcm-afficher-variable
    format: multiple-choice
    question: "Quelle commande pdb affiche la valeur de la variable `total` ?"
    choices:
      - {text: "`p total`", correct: true}
      - {text: "`show total`", correct: false}
      - {text: "`echo total`", correct: false}
      - {text: "`get total`", correct: false}
    answer: "`p` évalue et affiche une expression (`p total * 2` marche aussi) ; `pp` l'affiche joliment, pour un gros dictionnaire."
  - key: qcm-entrer-fonction
    format: multiple-choice
    question: "Quelle commande pdb entre dans la fonction appelée sur la ligne courante ?"
    choices:
      - {text: "`s`", correct: true}
      - {text: "`n`", correct: false}
      - {text: "`c`", correct: false}
      - {text: "`u`", correct: false}
    answer: "`s` (step) entre dans l'appel ; `n` l'exécute d'un bloc, `c` reprend jusqu'au prochain point d'arrêt, `u` remonte d'un cadre dans la pile."
  - key: qcm-pytest-pdb
    format: multiple-choice
    question: Comment ouvrir pdb au moment où un test pytest échoue ?
    choices:
      - {text: "`pytest --pdb`", correct: true}
      - {text: "`pytest --breakpoint`", correct: false}
      - {text: "`pytest -x pdb`", correct: false}
      - {text: "`pytest --debugger`", correct: false}
    answer: "`--pdb` ouvre le débogueur post-mortem sur l'échec, avec les variables du test ; ajouter `-x` évite d'en ouvrir un par test en échec."
  - key: qcm-post-mortem
    format: multiple-choice
    question: "Que fait `pdb.pm()` dans l'interpréteur, juste après une exception ?"
    choices:
      - {text: "Il ouvre pdb là où la dernière exception a été levée", correct: true}
      - {text: "Il relance la dernière commande, sous le contrôle de pdb", correct: false}
      - {text: "Il affiche la mémoire utilisée par le programme (pm)", correct: false}
      - {text: "Il pose un point d'arrêt sur la ligne qui a échoué", correct: false}
    answer: "pm pour *post-mortem* : on inspecte les variables au moment de l'erreur, et on remonte la pile avec `u`."
  - key: trous-breakpoint
    format: fill-in
    question: |-
      Complète pour arrêter le programme ici et ouvrir le débogueur :
      ```python
      def calculer(prix, quantite):
          ___()
          return prix * quantite
      ```
    blanks: [[breakpoint]]
    answer: "`breakpoint()` ouvre pdb à cette ligne : `p prix` affiche alors l'argument reçu."
  - key: trous-pythonbreakpoint
    format: fill-in
    question: |-
      Complète pour lancer l'application en ignorant tous ses `breakpoint()` :
      ```bash
      PYTHONBREAKPOINT=___ python app.py
      ```
    blanks: [["0"]]
    answer: "`PYTHONBREAKPOINT=0` rend `breakpoint()` inactif ; on peut aussi y nommer un autre débogueur."
  - key: trous-lancer-sous-pdb
    format: fill-in
    question: |-
      Complète pour lancer un script sous le débogueur :
      ```bash
      python -m ___ app.py
      ```
    blanks: [[pdb]]
    answer: "`python -m pdb` s'arrête à la première ligne, et ouvre le post-mortem si une exception remonte."
  - key: trous-continuer
    format: fill-in
    question: |-
      Dans pdb, complète la commande qui reprend l'exécution jusqu'au prochain point d'arrêt :
      ```
      (Pdb) ___
      ```
    blanks: [[c, cont, continue]]
    answer: "`c` (ou `cont`, `continue`) reprend l'exécution normale."
  - key: situation-pile-bibliotheque
    format: scenario
    question: Un script plante avec une pile de quinze cadres, dont douze dans une bibliothèque. Par où commences-tu ?
    choices:
      - {text: "La dernière ligne, puis le dernier cadre de mon code, d'où vient la valeur", correct: true}
      - {text: "La première ligne de la pile : l'appel d'origine explique toute l'erreur", correct: false}
      - {text: "Le code de la bibliothèque, au cadre le plus bas : le bug est forcément là", correct: false}
      - {text: "Je relance le script en espérant obtenir une pile plus courte cette fois", correct: false}
    answer: "L'erreur se lit en bas ; mais la cause est souvent la valeur que mon code a passée à la bibliothèque. Le dernier cadre de mon code montre cet appel."
  - key: situation-mauvais-total
    format: scenario
    question: Une fonction renvoie un mauvais total, sans lever d'exception. Comment trouves-tu l'étape fautive ?
    choices:
      - {text: "Un `breakpoint()`, puis j'avance pas à pas en inspectant les variables", correct: true}
      - {text: "Je relis la pile d'appels, qui montre l'étape où le calcul dérape", correct: false}
      - {text: "J'entoure la fonction d'un `try` / `except` pour voir l'erreur cachée", correct: false}
      - {text: "Je réécris la fonction de zéro, plus vite que de chercher l'erreur", correct: false}
    answer: "Sans exception, il n'y a pas de pile. pdb montre les valeurs ligne après ligne (`n`, `p total`) : on voit où elles cessent d'être justes."
  - key: situation-breakpoint-oublie
    format: scenario
    question: Un `breakpoint()` oublié est parti en production, et le service s'est figé. Comment éviter que ça recommence ?
    choices:
      - {text: "La règle `T100` de Ruff en CI, et `PYTHONBREAKPOINT=0` en production", correct: true}
      - {text: "Interdire `breakpoint()` à l'équipe, et ne plus déboguer qu'avec `print`", correct: false}
      - {text: "Lancer le service avec `python -O`, qui retire les points d'arrêt", correct: false}
      - {text: "Relire chaque fichier à la main, avant chaque mise en production", correct: false}
    answer: "Le linter bloque le commit ou la PR qui contient un point d'arrêt ; la variable d'environnement neutralise ceux qui passeraient quand même. `-O` ne retire que les `assert`."
  - key: situation-echec-en-ci
    format: scenario
    question: Un test échoue seulement en CI, où tu ne peux pas ouvrir pdb. Que fais-tu ?
    choices:
      - {text: "Je relance pytest avec `--showlocals`, et j'ajoute des journaux ciblés", correct: true}
      - {text: "Je relance la CI jusqu'à ce que le test finisse par passer", correct: false}
      - {text: "Je marque le test `skip`, le temps de débloquer la CI", correct: false}
      - {text: "J'ajoute un `breakpoint()` dans le test et j'attends la CI", correct: false}
    answer: "`-l` affiche les variables locales de chaque cadre de la pile, et des messages `logging` montrent l'état qui diffère de la machine locale. Un `breakpoint()` bloquerait la CI."
