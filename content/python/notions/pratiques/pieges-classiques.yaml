notion: pieges-classiques
lesson: |-
  Une poignée de pièges reviennent dans presque tous les entretiens Python. Chacun vient d'une règle simple du
  langage : il suffit de la connaître.

  **1. La valeur par défaut mutable** : elle est évaluée **une fois**, quand le `def` s'exécute, puis partagée par tous
  les appels.

  ```python
  def ajouter(article, panier=[]):      # une seule liste pour tous les appels
      ...
  def ajouter(article, panier=None):    # la correction
      if panier is None:
          panier = []
  ```

  **2. La liaison tardive des closures** : une fonction lit une variable capturée **au moment de l'appel**, pas de sa
  création. Des lambdas créées dans une boucle voient toutes la dernière valeur.

  ```python
  fs = [lambda x: x * n for n in (2, 3)]        # les deux multiplient par 3
  fs = [lambda x, n=n: x * n for n in (2, 3)]   # n figé par une valeur par défaut
  ```

  **3. Les alias et les copies** : `b = a` ne copie rien, les deux noms désignent la même liste. `[[]] * 3` répète
  **trois fois la même** liste. `a = b = []` aussi. `copy()` est superficielle, `copy.deepcopy()` copie tout.

  **4. `is` au lieu de `==`** : `is` compare l'**identité**, `==` la **valeur**. Deux chaînes ou deux grands entiers
  égaux peuvent être deux objets distincts ; que `x is 256` « marche » vient d'un cache de CPython, pas du langage.
  `is` se réserve à `None` (et aux sentinelles). Python avertit : « SyntaxWarning: "is" with 'str' literal ».

  **5. L'`UnboundLocalError`** : une affectation dans une fonction (`total += n`) rend le nom **local à toute la
  fonction** ; le lire avant l'affectation échoue, même si une variable globale du même nom existe. On passe la valeur
  en paramètre et on renvoie le résultat (ou, à défaut, `global` / `nonlocal`).

  **6. L'attribut de classe mutable** : `class Panier: articles = []` crée une liste **partagée** par toutes les
  instances. Ce qui appartient à chaque objet se crée dans `__init__`.

  **7. `+=` sur une liste dans un tuple** : `t[0] += [x]` **modifie la liste**, puis lève une `TypeError` en voulant
  réaffecter `t[0]`. L'erreur arrive après le changement.

  **Et encore** : `bool("False")` vaut `True` (une chaîne non vide est vraie) ; `xs = xs.sort()` met `None` dans `xs` ;
  `round(2.5)` vaut `2` (arrondi au pair) ; modifier une liste pendant qu'on la parcourt saute des éléments ; un
  `except:` nu rattrape tout, jusqu'à `KeyboardInterrupt`.

  **En entretien** : « Les trois grands classiques : la valeur par défaut mutable, évaluée une seule fois ; la liaison
  tardive des closures dans une boucle ; et `is` confondu avec `==`. Viennent ensuite l'`UnboundLocalError`, les alias
  de listes et l'attribut de classe mutable. Chacun découle d'une règle : les noms sont des références, et les valeurs
  sont lues au moment de l'exécution. »
cards:
  - key: liaison-tardive
    format: course
    question: "Qu'appelle-t-on la liaison tardive (late binding) des closures en Python ?"
    choices:
      - {text: "La fonction lit la variable capturée au moment de l'appel, pas de sa création", correct: true}
      - {text: "La fonction n'est compilée qu'au premier appel, et jamais avant celui-ci", correct: false}
      - {text: "Les arguments sont liés aux paramètres de gauche à droite, puis les nommés", correct: false}
      - {text: "Les méthodes d'une classe sont cherchées dans la MRO à chaque appel", correct: false}
    answer: "Une closure garde une référence à la variable, pas sa valeur. Créée dans une boucle, elle voit la valeur finale de la variable, une fois la boucle terminée."
  - key: is-entier
    format: course
    question: "Pourquoi `if x is 1000:` est-il une mauvaise façon de tester la valeur d'un entier ?"
    choices:
      - {text: "`is` compare l'identité : deux entiers égaux peuvent être deux objets distincts", correct: true}
      - {text: "`is` convertit d'abord l'entier en chaîne, puis compare les deux chaînes", correct: false}
      - {text: "`is` ne fonctionne qu'avec des booléens, et lève une erreur pour un entier", correct: false}
      - {text: "`is` compare les valeurs arrondies à la centaine, d'où des égalités fausses", correct: false}
    answer: "CPython garde en cache les petits entiers (-5 à 256), ce qui fait parfois « marcher » `is`. Pour une valeur, on utilise `==` ; `is` sert à `None` et aux sentinelles."
  - key: unboundlocalerror
    format: course
    question: "D'où vient l'`UnboundLocalError` levée par `total += n` dans une fonction, quand `total` est une variable du module ?"
    choices:
      - {text: "L'affectation rend `total` locale à toute la fonction, et elle est lue avant d'exister", correct: true}
      - {text: "Les variables du module sont en lecture seule, et toute écriture y est interdite", correct: false}
      - {text: "`+=` n'est pas défini sur les entiers, seulement sur les listes et les chaînes", correct: false}
      - {text: "La fonction s'exécute avant que le module ait défini `total`, au chargement", correct: false}
    answer: "Le compilateur voit une affectation à `total` dans la fonction : le nom y est local partout. `total += n` le lit avant toute valeur locale. On passe `total` en paramètre et on renvoie le résultat, ou on déclare `global total`."
  - key: except-nu
    format: course
    question: "Pourquoi un `except:` nu, sans type d'exception, est-il un piège ?"
    choices:
      - {text: "Il rattrape tout, jusqu'à `KeyboardInterrupt`, et masque les vrais bugs", correct: true}
      - {text: "Il ne rattrape que les exceptions écrites par le programmeur lui-même", correct: false}
      - {text: "Il provoque une erreur de syntaxe depuis Python 3.0", correct: false}
      - {text: "Il relance l'exception automatiquement à la fin du bloc", correct: false}
    answer: "`except:` équivaut à `except BaseException:` : Ctrl+C (`KeyboardInterrupt`) et `sys.exit()` (`SystemExit`) sont avalés, comme une faute de frappe (`NameError`). On rattrape l'exception précise attendue."
  - key: vf-liste-repetee
    format: true-false
    question: "`[[]] * 3` crée trois listes vides indépendantes."
    truth: false
    answer: "Elle contient trois fois la même liste : un `append` sur l'une apparaît dans les trois. `[[] for _ in range(3)]` crée trois listes."
  - key: vf-defaut-evalue-une-fois
    format: true-false
    question: "La valeur par défaut d'un paramètre est évaluée une seule fois, quand l'instruction `def` s'exécute."
    truth: true
    answer: "Elle est rangée dans `fonction.__defaults__` et réutilisée à chaque appel : une liste ou un dictionnaire y est donc partagé."
  - key: vf-eq-none
    format: true-false
    question: "Une classe peut faire que `x == None` vaille `True`, alors que `x is None` vaut `False`."
    truth: true
    answer: "`==` appelle `__eq__`, que toute classe peut redéfinir ; `is` compare l'identité, et rien ne le trompe. D'où la règle : `is None`."
  - key: vf-bool-chaine
    format: true-false
    question: "`bool(\"False\")` vaut `False`."
    truth: false
    answer: "Toute chaîne non vide est vraie, quel que soit son texte. Une option lue dans un fichier ou une variable d'environnement se compare : `valeur == \"true\"`."
  - key: qcm-figer-valeur
    format: multiple-choice
    question: "Comment figer la valeur courante de `n` dans des lambdas créées en boucle ?"
    choices:
      - {text: "`lambda x, n=n: x * n`", correct: true}
      - {text: "`lambda x: x * (n)`", correct: false}
      - {text: "`lambda x: x * n.copy()`", correct: false}
      - {text: "`lambda x: x * global n`", correct: false}
    answer: "La valeur par défaut est évaluée à la création de la lambda : chacune garde son `n`. `functools.partial` est l'autre solution courante."
  - key: qcm-comparer-chaines
    format: multiple-choice
    question: Quel test compare de façon fiable deux chaînes lues dans un fichier ?
    choices:
      - {text: "`a == b`", correct: true}
      - {text: "`a is b`", correct: false}
      - {text: "`id(a) == id(b)`", correct: false}
      - {text: "`hash(a) is hash(b)`", correct: false}
    answer: "Deux chaînes égales lues séparément sont deux objets : `is` et `id` les disent différentes. `==` compare les caractères."
  - key: qcm-round
    format: multiple-choice
    question: "Que renvoie `round(2.5)` en Python 3 ?"
    choices:
      - {text: "`2`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`2.0`", correct: false}
      - {text: "`3.0`", correct: false}
    answer: "Python arrondit les demis au pair le plus proche (l'arrondi du banquier) : `round(0.5)` vaut 0, `round(1.5)` vaut 2, `round(2.5)` vaut 2. Sans second argument, le résultat est un `int`."
  - key: qcm-sort-none
    format: multiple-choice
    question: "Après `notes = notes.sort()`, que vaut `notes` ?"
    choices:
      - {text: "`None`", correct: true}
      - {text: "La liste triée", correct: false}
      - {text: "La liste d'origine, non triée", correct: false}
      - {text: "Un itérateur sur la liste triée", correct: false}
    answer: "`sort()` trie sur place et renvoie `None`, comme la plupart des méthodes qui modifient un objet. `sorted(notes)` renvoie une nouvelle liste triée."
  - key: code-multiplicateurs
    format: code-output
    question: |-
      ```python
      multiplicateurs = [lambda x: x * n for n in (2, 3, 4)]
      print([m(10) for m in multiplicateurs])
      ```
    check:
      output: "[40, 40, 40]"
    choices:
      - {text: "`[40, 40, 40]`", correct: true}
      - {text: "`[20, 30, 40]`", correct: false}
      - {text: "`[20, 20, 20]`", correct: false}
      - {text: "`[10, 10, 10]`", correct: false}
    answer: "Les trois lambdas lisent `n` à l'appel, quand la compréhension est terminée et que `n` vaut 4. `lambda x, n=n: x * n` donnerait `[20, 30, 40]`."
  - key: code-tuple-plus-egal
    format: code-output
    question: |-
      ```python
      equipe = (["Ada"], ["Linus"])
      try:
          equipe[0] += ["Grace"]
      except TypeError:
          print("TypeError")
      print(equipe)
      ```
    check:
      output: |-
        TypeError
        (['Ada', 'Grace'], ['Linus'])
    choices:
      - text: |-
          ```
          TypeError
          (['Ada', 'Grace'], ['Linus'])
          ```
        correct: true
      - text: |-
          ```
          TypeError
          (['Ada'], ['Linus'])
          ```
        correct: false
      - text: |-
          ```
          (['Ada', 'Grace'], ['Linus'])
          ```
        correct: false
      - text: |-
          ```
          TypeError
          (['Ada', ['Grace']], ['Linus'])
          ```
        correct: false
    answer: "`+=` étend d'abord la liste sur place, puis tente de réaffecter `equipe[0]`, ce qu'un tuple refuse. L'exception arrive après la modification : la liste contient bien Grace."
  - key: code-alias-double
    format: code-output
    question: |-
      ```python
      inscrits = attente = []
      inscrits.append("Ada")
      attente += ["Linus"]
      print(inscrits, attente)
      ```
    check:
      output: "['Ada', 'Linus'] ['Ada', 'Linus']"
    choices:
      - {text: "`['Ada', 'Linus'] ['Ada', 'Linus']`", correct: true}
      - {text: "`['Ada'] ['Linus']`", correct: false}
      - {text: "`['Ada'] ['Ada', 'Linus']`", correct: false}
      - {text: "`['Ada', 'Linus'] ['Linus']`", correct: false}
    answer: "`a = b = []` lie les deux noms à une seule liste. `+=` sur une liste la modifie sur place : les deux noms voient les deux ajouts."
  - key: code-unboundlocal
    format: code-output
    question: |-
      ```python
      total = 10


      def ajouter(n):
          print("ajout de", n)
          total += n
          return total


      print(ajouter(5))
      ```
    check:
      output: "ajout de 5"
      throws: UnboundLocalError
    choices:
      - {text: "`ajout de 5`, puis une `UnboundLocalError`", correct: true}
      - {text: "`ajout de 5`, puis `15`", correct: false}
      - {text: "`ajout de 5`, puis `5`", correct: false}
      - {text: "Une `NameError`, sans rien afficher avant", correct: false}
    answer: "L'affectation `total += n` rend `total` locale à toute la fonction. Le `print` s'exécute, puis la lecture de `total`, locale et encore vide, lève « cannot access local variable 'total' where it is not associated with a value »."
  - key: bug-gestionnaires-boucle
    format: bug-fix
    question: |-
      Ce programme affiche « clic sur annuler » alors qu'on a cliqué sur « ok ». Quelle correction est la bonne ?
      ```python
      boutons = {}
      for nom in ["ok", "annuler"]:
          boutons[nom] = lambda: print("clic sur", nom)

      boutons["ok"]()
      ```
    choices:
      - {text: "`lambda nom=nom: print(\"clic sur\", nom)`", correct: true}
      - {text: "`lambda: print(\"clic sur\", str(nom))`", correct: false}
      - {text: "`lambda: print(\"clic sur\", boutons[nom])`", correct: false}
      - {text: "`lambda: print(\"clic sur\", nom[:])`", correct: false}
    answer: |-
      ```python
      for nom in ["ok", "annuler"]:
          boutons[nom] = lambda nom=nom: print("clic sur", nom)
      ```
      Les deux lambdas lisent `nom` à l'appel, quand il vaut « annuler ». Une valeur par défaut fige la valeur à la création ; `str(nom)` ou `nom[:]` sont toujours évalués trop tard.
  - key: bug-attribut-classe-liste
    format: bug-fix
    question: |-
      Ce programme affiche « ['pomme'] » pour le second panier, resté vide. Quelle correction est la bonne ?
      ```python
      class Panier:
          articles = []

          def ajouter(self, article):
              self.articles.append(article)


      p1, p2 = Panier(), Panier()
      p1.ajouter("pomme")
      print(p2.articles)
      ```
    choices:
      - {text: "Créer la liste dans `__init__` : `self.articles = []`", correct: true}
      - {text: "Écrire `Panier.articles.append(article)` dans `ajouter`", correct: false}
      - {text: "Remplacer `articles = []` par `articles = list()`", correct: false}
      - {text: "Renommer l'attribut `_articles`, pour le rendre privé", correct: false}
    answer: |-
      ```python
      class Panier:
          def __init__(self):
              self.articles = []

          def ajouter(self, article):
              self.articles.append(article)
      ```
      Une liste du corps de la classe existe une seule fois, partagée par toutes les instances. `list()` y serait tout aussi partagé, et le souligné ne change rien au partage.
  - key: bug-is-chaine
    format: bug-fix
    question: |-
      Ce programme affiche « refusé », et Python avertit « SyntaxWarning: "is" with 'str' literal. Did you mean "=="? ». Quelle correction est la bonne ?
      ```python
      reponse = "".join(["o", "k"])
      if reponse is "ok":
          print("accepté")
      else:
          print("refusé")
      ```
    choices:
      - {text: "`if reponse == \"ok\":`", correct: true}
      - {text: "`if reponse is str(\"ok\"):`", correct: false}
      - {text: "`if id(reponse) == id(\"ok\"):`", correct: false}
      - {text: "`if reponse is not \"ko\":`", correct: false}
    answer: |-
      ```python
      if reponse == "ok":
          print("accepté")
      ```
      La chaîne construite par `join` est un autre objet que le littéral `"ok"`, de même valeur. `is` et `id` comparent l'identité ; `==` compare les caractères.
  - key: bug-option-chaine
    format: bug-fix
    question: |-
      Ce programme affiche « mode debug activé », alors que l'option vaut « False ». Quelle correction est la bonne ?
      ```python
      config = {"debug": "False"}
      if config["debug"]:
          print("mode debug activé")
      ```
    choices:
      - {text: "`if config[\"debug\"].lower() == \"true\":`", correct: true}
      - {text: "`if bool(config[\"debug\"]):`", correct: false}
      - {text: "`if config[\"debug\"] is not False:`", correct: false}
      - {text: "`if config.get(\"debug\", False):`", correct: false}
    answer: |-
      ```python
      if config["debug"].lower() == "true":
          print("mode debug activé")
      ```
      La valeur est la chaîne « False », non vide, donc vraie. `bool()` donne le même résultat, et la chaîne n'est pas l'objet `False`. On compare le texte, ou on convertit à la lecture de la configuration.
  - key: situation-gestionnaires
    format: scenario
    question: "Des fonctions de rappel créées dans une boucle réagissent toutes avec la dernière valeur de la boucle. Que soupçonnes-tu ?"
    choices:
      - {text: "La liaison tardive : il faut figer la valeur, par `x=x` ou `functools.partial`", correct: true}
      - {text: "Un bug du ramasse-miettes, qui libère les premières fonctions trop tôt", correct: false}
      - {text: "Une boucle trop rapide : il faut ajouter une courte pause entre les tours", correct: false}
      - {text: "La boucle réutilise le même objet fonction : il faut le copier avec `copy`", correct: false}
    answer: "Chaque fonction lit la variable de boucle à l'appel, donc sa dernière valeur. `lambda x=x: ...` ou `partial(f, x)` capturent la valeur du tour."
  - key: situation-trois-pieges
    format: scenario
    question: "En entretien, on te demande trois pièges classiques de Python. Lesquels cites-tu ?"
    choices:
      - {text: "Le défaut mutable, la liaison tardive des closures, `is` pris pour `==`", correct: true}
      - {text: "L'indentation obligatoire, les deux-points, les parenthèses de `print`", correct: false}
      - {text: "Les entiers qui débordent, les chaînes mutables, l'absence de `switch`", correct: false}
      - {text: "Le GIL, l'absence de pointeurs, la lenteur des boucles `for`", correct: false}
    answer: "Ce sont trois comportements surprenants mais logiques, qui produisent des bugs silencieux. Les entiers Python ne débordent pas, les chaînes sont immuables, et `match` existe depuis 3.10."
  - key: situation-cache-de-classe
    format: scenario
    question: "Un service garde ses données dans un attribut de classe, `cache = {}`, et les données d'un client apparaissent chez un autre. Que fais-tu ?"
    choices:
      - {text: "Je crée le dictionnaire dans `__init__`, pour que chaque instance ait le sien", correct: true}
      - {text: "Je vide le cache au début de chaque méthode, pour repartir de zéro à chaque fois", correct: false}
      - {text: "Je remplace le dictionnaire par une liste, qui ne se partage pas entre instances", correct: false}
      - {text: "Je rends l'attribut privé, `__cache`, pour que les instances ne le voient plus", correct: false}
    answer: "Un attribut mutable de classe est commun à toutes les instances. S'il doit être propre à chaque client, il naît dans `__init__`. Le double souligné ne change que le nom, pas le partage."
  - key: situation-except-pass
    format: scenario
    question: "Ton programme rattrape tout avec `except:` puis `pass`, et Ctrl+C ne l'arrête plus. Que corriges-tu ?"
    choices:
      - {text: "Je rattrape l'exception précise attendue, et je la journalise", correct: true}
      - {text: "Je remplace `pass` par `continue`, pour passer à la suite", correct: false}
      - {text: "J'ajoute un second `except:` pour rattraper Ctrl+C à part", correct: false}
      - {text: "Je lance le programme avec `python -O`, qui ignore les `except`", correct: false}
    answer: "Un `except:` nu avale `KeyboardInterrupt` et cache les bugs. `except ValueError as e:` puis `logging.warning(...)` ne traite que le cas prévu, et laisse le reste remonter."
