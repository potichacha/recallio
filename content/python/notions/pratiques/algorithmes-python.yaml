notion: algorithmes-python
lesson: |-
  En entretien d'algorithmique, Python est un bon choix : sa bibliothèque standard fournit, en une ligne, les
  structures que d'autres langages font écrire à la main. Encore faut-il connaître leur coût.

  | Besoin | Outil | Coût |
  |---|---|---|
  | pile | `list` : `append`, `pop()` | O(1) |
  | file (parcours en largeur) | `collections.deque` : `append`, `popleft()` | O(1) ; `list.pop(0)` est O(n) |
  | appartenance, dédoublonnage | `set` : `x in s` | O(1) en moyenne ; `x in liste` est O(n) |
  | association, mémo | `dict` | O(1) en moyenne |
  | compter | `collections.Counter`, `most_common(k)` | O(n) |
  | regrouper | `collections.defaultdict(list)` | O(1) par ajout |
  | k plus petits / plus grands, file de priorité | `heapq` : `heappush`, `heappop`, `nsmallest`, `nlargest` | O(log n) par opération |
  | recherche dans une liste triée | `bisect.bisect_left`, `insort` | O(log n) pour chercher |
  | combinaisons | `itertools.combinations`, `permutations`, `product`, `accumulate`, `pairwise` | à la demande |
  | mémoïsation | `@functools.cache` | une fois par argument |

  **`heapq`** gère un **tas min** dans une simple liste : `tas[0]` est toujours le plus petit. Pour un tas max, on range
  les valeurs négatives (`-x`) ; Python 3.14 ajoute aussi `heappush_max` et `heappop_max`. Un tuple `(priorité,
  élément)` sert de file de priorité.

  **Trier** : `sorted(xs, key=...)` est **stable** et en O(n log n). Une clé en tuple trie sur plusieurs critères :
  `key=lambda m: (-compte[m], m)` range par fréquence décroissante, puis par ordre alphabétique.

  **Les techniques qui reviennent**

  - **Le dictionnaire de complément** (deux nombres dont la somme vaut `cible`) : pour chaque `x`, chercher
    `cible - x` dans un `dict` des valeurs vues, en O(n) au lieu de O(n²).
  - **Deux pointeurs** sur une liste triée, la **fenêtre glissante** sur une sous-suite contiguë, les **sommes
    préfixes** avec `itertools.accumulate`.
  - **Le parcours en largeur** avec une `deque` et un `set` des sommets vus ; **le parcours en profondeur** avec une
    pile explicite.
  - **La programmation dynamique** : une fonction récursive décorée par `@functools.cache`, ou un tableau rempli
    itérativement.

  **Les limites de Python** : la récursion s'arrête vers **1 000** appels imbriqués (`RecursionError`) ; on passe en
  itératif plutôt que de lever la limite (`sys.setrecursionlimit`), qui peut faire planter l'interpréteur. Les entiers
  n'ont pas de limite de taille. Une boucle Python est lente : `sum`, `sorted`, `Counter`, écrits en C, battent une
  boucle écrite à la main.

  **La démarche** : reformuler, poser des exemples et les cas limites (vide, un élément, doublons), annoncer une
  solution simple et sa complexité, l'améliorer, puis la tester à voix haute.

  **En entretien** : « Je choisis la structure selon l'opération : `set` et `dict` pour chercher en O(1), `deque` pour
  une file, `heapq` pour les k plus grands, `bisect` sur une liste triée, `Counter` pour compter. J'annonce la
  complexité, et je passe en itératif si la récursion risque d'être profonde. »
cards:
  - key: deque-file
    format: course
    question: Pourquoi utiliser `collections.deque` pour la file d'un parcours en largeur ?
    choices:
      - {text: "`popleft()` est en O(1), alors que `list.pop(0)` décale tous les éléments", correct: true}
      - {text: "Une `deque` trie ses éléments à chaque ajout, ce que la liste ne fait pas", correct: false}
      - {text: "Une `list` ne peut pas contenir plus de 65 536 éléments, une `deque` si", correct: false}
      - {text: "`deque` est la seule structure de Python qui accepte des doublons", correct: false}
    answer: "Retirer le premier élément d'une liste décale tous les autres : O(n) par retrait, O(n²) pour tout le parcours. Une `deque` ajoute et retire aux deux bouts en O(1)."
  - key: tas-max
    format: course
    question: "Comment obtenir un tas max avec les fonctions classiques de `heapq`, qui gèrent un tas min ?"
    choices:
      - {text: "En rangeant les valeurs négatives (`-x`), puis en reprenant le signe à la sortie", correct: true}
      - {text: "En appelant `heapq.heapify(tas, reverse=True)` sur la liste à transformer", correct: false}
      - {text: "En lisant `tas[-1]`, le dernier élément, qui est toujours le plus grand", correct: false}
      - {text: "En triant la liste avec `sort(reverse=True)` après chaque `heappush`", correct: false}
    answer: "Le plus petit des opposés est l'opposé du plus grand. Python 3.14 offre aussi `heappush_max` et `heappop_max`. `tas[-1]` n'est pas forcément le maximum : un tas n'est pas trié."
  - key: functools-cache
    format: course
    question: "À quoi sert `@functools.cache` sur une fonction récursive comme Fibonacci ?"
    choices:
      - {text: "À mémoriser les résultats déjà calculés, pour ne calculer chaque valeur qu'une fois", correct: true}
      - {text: "À lever la limite de récursion de Python pour cette seule fonction", correct: false}
      - {text: "À exécuter les appels récursifs en parallèle, sur plusieurs cœurs", correct: false}
      - {text: "À convertir la récursion en boucle, à la compilation de la fonction", correct: false}
    answer: "Fibonacci naïf recalcule les mêmes valeurs un nombre exponentiel de fois ; avec le cache, chaque `n` est calculé une fois : O(n). La profondeur de récursion, elle, reste la même."
  - key: bisect-left
    format: course
    question: "Que fait `bisect.bisect_left(xs, x)`, quand `xs` est une liste triée ?"
    choices:
      - {text: "Il trouve en O(log n) l'indice où insérer `x` en gardant l'ordre", correct: true}
      - {text: "Il trie la liste, puis renvoie la position de `x`, en O(n log n)", correct: false}
      - {text: "Il coupe la liste en deux moitiés et renvoie celle de gauche", correct: false}
      - {text: "Il supprime `x` de la liste, puis renvoie son ancien indice", correct: false}
    answer: "C'est une recherche dichotomique : l'indice du premier élément `>= x`. `bisect_right` donne l'indice après les éléments égaux à `x`, et `insort` insère."
  - key: vf-in-liste-set
    format: true-false
    question: "Tester `x in une_liste` coûte O(n), et `x in un_set` O(1) en moyenne."
    truth: true
    answer: "La liste est parcourue élément par élément ; le `set` va directement à l'alvéole du hachage. Dans une boucle, convertir d'abord en `set` change O(n²) en O(n)."
  - key: vf-sorted-stable
    format: true-false
    question: "`sorted` est stable : deux éléments de même clé gardent leur ordre d'origine."
    truth: true
    answer: "C'est ce qui permet de trier en plusieurs passes, du critère secondaire au critère principal, ou de compter sur l'ordre d'arrivée à égalité."
  - key: vf-recursion-profonde
    format: true-false
    question: La récursion profonde est sans risque en Python, car la pile d'appels grandit à la demande.
    truth: false
    answer: "La limite par défaut est de 1 000 appels imbriqués ; au-delà, `RecursionError`. Un parcours d'un graphe de 10 000 sommets en chaîne s'écrit en itératif."
  - key: vf-entiers-debordent
    format: true-false
    question: "Les entiers Python débordent au-delà de `2**63 - 1`, comme les `long` de Java."
    truth: false
    answer: "Les `int` de Python ont une précision arbitraire : `2**100` est exact. Pas de débordement à surveiller, au prix d'opérations plus lentes sur les très grands nombres."
  - key: qcm-compter-occurrences
    format: multiple-choice
    question: Quelle structure donne d'un coup le nombre d'occurrences de chaque élément d'une liste ?
    choices:
      - {text: "`collections.Counter`", correct: true}
      - {text: "`collections.deque`", correct: false}
      - {text: "`heapq`", correct: false}
      - {text: "`bisect`", correct: false}
    answer: "`Counter(xs)` compte en O(n) ; `most_common(k)` donne les k plus fréquents."
  - key: qcm-trois-plus-grands
    format: multiple-choice
    question: "Comment obtenir les 3 plus grands éléments d'une longue liste, sans la trier entièrement ?"
    choices:
      - {text: "`heapq.nlargest(3, xs)`", correct: true}
      - {text: "`xs.sort()[-3:]`", correct: false}
      - {text: "`max(xs, 3)`", correct: false}
      - {text: "`sorted(xs)[:3]`", correct: false}
    answer: "`nlargest` garde un tas de taille 3 : O(n log 3). `sort()` renvoie `None`, et `sorted(xs)[:3]` donne les trois plus petits."
  - key: qcm-paires
    format: multiple-choice
    question: Quelle fonction donne toutes les paires d'éléments distincts d'une liste, sans compter deux fois la même paire ?
    choices:
      - {text: "`itertools.combinations(xs, 2)`", correct: true}
      - {text: "`itertools.permutations(xs, 2)`", correct: false}
      - {text: "`itertools.product(xs, xs)`", correct: false}
      - {text: "`zip(xs, xs)`", correct: false}
    answer: "`combinations` ignore l'ordre : (a, b) sans (b, a). `permutations` donne les deux ordres, `product` y ajoute (a, a), et `zip(xs, xs)` ne donne que (a, a)."
  - key: qcm-tri-multicritere
    format: multiple-choice
    question: "Quel tri range des mots par longueur décroissante, puis, à longueur égale, par ordre alphabétique ?"
    choices:
      - {text: "`sorted(mots, key=lambda m: (-len(m), m))`", correct: true}
      - {text: "`sorted(mots, key=len, reverse=True)`", correct: false}
      - {text: "`sorted(mots, key=lambda m: (len(m), m), reverse=True)`", correct: false}
      - {text: "`sorted(sorted(mots), key=len)`", correct: false}
    answer: "La clé en tuple compare la longueur négée, puis le mot. `reverse=True` inverserait aussi l'ordre alphabétique ; `key=len` seul garde l'ordre d'origine à égalité ; le dernier trie par longueur croissante."
  - key: code-most-common
    format: code-output
    question: |-
      ```python
      from collections import Counter

      print(Counter("abracadabra").most_common(2))
      ```
    check:
      output: "[('a', 5), ('b', 2)]"
    choices:
      - {text: "`[('a', 5), ('b', 2)]`", correct: true}
      - {text: "`[('a', 5), ('r', 2)]`", correct: false}
      - {text: "`{'a': 5, 'b': 2}`", correct: false}
      - {text: "`['a', 'b']`", correct: false}
    answer: "`most_common` renvoie une liste de couples (élément, nombre). « b » et « r » apparaissent deux fois chacun ; à égalité, l'ordre de première apparition l'emporte, et « b » vient avant « r »."
  - key: code-deux-sommes
    format: code-output
    question: |-
      ```python
      def deux_sommes(nombres, cible):
          vus = {}
          for i, x in enumerate(nombres):
              if cible - x in vus:
                  return vus[cible - x], i
              vus[x] = i
          return None


      print(deux_sommes([3, 2, 4, 3], 6))
      ```
    check:
      output: "(1, 2)"
    choices:
      - {text: "`(1, 2)`", correct: true}
      - {text: "`(0, 3)`", correct: false}
      - {text: "`(0, 0)`", correct: false}
      - {text: "`None`", correct: false}
    answer: "Le dictionnaire garde les valeurs déjà vues. À l'indice 2, `x` vaut 4 et son complément, 2, a été vu à l'indice 1 : la fonction s'arrête là, avant d'atteindre le second 3. Le premier 3 ne s'apparie pas avec lui-même, car il est cherché avant d'être rangé."
  - key: code-bisect
    format: code-output
    question: |-
      ```python
      import bisect

      notes = [8, 10, 10, 14]
      print(bisect.bisect_left(notes, 10), bisect.bisect_right(notes, 10))
      ```
    check:
      output: "1 3"
    choices:
      - {text: "`1 3`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`2 3`", correct: false}
      - {text: "`0 2`", correct: false}
    answer: "`bisect_left` donne l'indice du premier 10, 1 ; `bisect_right` l'indice juste après le dernier 10, 3. Leur différence compte les 10 : deux."
  - key: code-parcours-largeur
    format: code-output
    question: |-
      ```python
      from collections import deque

      graphe = {"A": ["B", "C"], "B": ["D"], "C": ["D", "E"], "D": ["F"], "E": ["F"], "F": []}
      distance = {"A": 0}
      file = deque(["A"])
      while file:
          sommet = file.popleft()
          for voisin in graphe[sommet]:
              if voisin not in distance:
                  distance[voisin] = distance[sommet] + 1
                  file.append(voisin)
      print(distance["F"], len(distance))
      ```
    check:
      output: "3 6"
    choices:
      - {text: "`3 6`", correct: true}
      - {text: "`4 6`", correct: false}
      - {text: "`3 5`", correct: false}
      - {text: "`2 6`", correct: false}
    answer: "Le parcours en largeur visite les sommets par distance croissante : B et C à 1, D et E à 2, F à 3. Le dictionnaire `distance` sert aussi d'ensemble des sommets vus : chacun n'y entre qu'une fois, six en tout."
  - key: situation-deux-sommes
    format: scenario
    question: "On te demande les indices de deux nombres dont la somme vaut `cible`. Ta double boucle est en O(n²). Comment l'améliorer ?"
    choices:
      - {text: "Un dictionnaire valeur → indice : pour chaque `x`, je cherche `cible - x` en O(1)", correct: true}
      - {text: "Je trie la liste puis je garde la double boucle : le tri rend la recherche plus rapide", correct: false}
      - {text: "Je remplace la double boucle par deux compréhensions imbriquées, plus rapides", correct: false}
      - {text: "Je parallélise la boucle externe avec des threads, un par élément de la liste", correct: false}
    answer: "Un seul passage : avant de ranger `x`, on regarde si son complément a déjà été vu. O(n) en temps, O(n) en mémoire. Trier et deux pointeurs ferait O(n log n), mais perd les indices d'origine."
  - key: situation-demarche
    format: scenario
    question: "En entretien d'algorithmique, que fais-tu avant d'écrire la première ligne de code ?"
    choices:
      - {text: "Je reformule, je pose des exemples et des cas limites, puis j'annonce une approche et sa complexité", correct: true}
      - {text: "Je code tout de suite la solution la plus optimisée, pour gagner du temps sur l'énoncé", correct: false}
      - {text: "Je demande à l'examinateur la solution attendue, pour ne pas partir dans la mauvaise voie", correct: false}
      - {text: "J'écris la liste complète des tests unitaires, avant même d'avoir compris le problème", correct: false}
    answer: "L'examinateur évalue le raisonnement autant que le code : clarifier évite de résoudre le mauvais problème, et une solution simple annoncée d'abord montre qu'on sait l'améliorer."
  - key: situation-recursionerror
    format: scenario
    question: "Ta solution récursive lève `RecursionError` sur une entrée de 10 000 éléments. Que fais-tu ?"
    choices:
      - {text: "Je la réécris en itératif, avec une pile ou une boucle explicite", correct: true}
      - {text: "Je monte la limite à un million avec `sys.setrecursionlimit`", correct: false}
      - {text: "J'ajoute `@functools.cache`, qui supprime la récursion", correct: false}
      - {text: "Je rattrape la `RecursionError` et je renvoie un résultat partiel", correct: false}
    answer: "Lever la limite repousse le problème et peut faire planter l'interpréteur (la pile du système déborde). Le cache évite les recalculs, pas la profondeur ; une pile explicite n'a pas de limite."
  - key: situation-k-listes
    format: scenario
    question: On te demande de fusionner k listes triées en une seule liste triée. Quel outil Python choisis-tu ?
    choices:
      - {text: "`heapq.merge`, ou un tas des têtes de liste : O(n log k)", correct: true}
      - {text: "Je concatène tout, puis `sorted` : c'est toujours le plus rapide", correct: false}
      - {text: "`zip` sur les k listes, puis j'aplatis les tuples obtenus", correct: false}
      - {text: "`bisect.insort` de chaque élément dans une liste de résultats", correct: false}
    answer: "Le tas garde la plus petite tête de chaque liste : chaque élément coûte O(log k). `zip` s'arrête à la plus courte et ne trie rien, et `insort` coûte O(n) par insertion."
