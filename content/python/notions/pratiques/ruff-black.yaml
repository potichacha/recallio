notion: ruff-black
lesson: |-
  Deux familles d'outils gardent un code Python propre, sans débat en revue :

  - un **formateur** réécrit la **mise en page** (espaces, retours à la ligne, guillemets) : **Black**, ou
    **`ruff format`** qui produit le même style ;
  - un **analyseur** (*linter*) signale le **code suspect** sans le réécrire : imports inutilisés, variables jamais lues,
    comparaisons douteuses, bugs classiques. **Ruff** a remplacé flake8 et ses plugins.

  **Black, « le formateur intransigeant »**

  Black ne se configure presque pas, et c'est voulu : un seul style possible, donc plus de discussion. Lignes de
  **88 caractères**, guillemets doubles, une **virgule finale magique** (une virgule après le dernier élément garde une
  liste éclatée sur plusieurs lignes).

  ```bash
  black .              # reformate
  black --check .      # vérifie seulement (pour la CI) : code de sortie 1 si un fichier changerait
  ```

  **Ruff : analyseur et formateur, écrit en Rust**

  Ruff est **des dizaines de fois plus rapide** que les outils qu'il remplace : flake8, isort (le tri des imports),
  pyupgrade (la syntaxe moderne), une bonne part de pylint, et Black avec `ruff format`.

  ```bash
  ruff check .              # analyse
  ruff check --fix .        # corrige ce qui peut l'être sans risque
  ruff format .             # formate, dans le style de Black
  ruff format --check .     # vérifie le formatage, pour la CI
  ```

  ```
  # pyproject.toml
  [tool.ruff]
  line-length = 88
  target-version = "py314"

  [tool.ruff.lint]
  select = ["E", "F", "I", "B", "UP"]   # pycodestyle, pyflakes, isort, bugbear, pyupgrade
  ```

  | Règle | Ce qu'elle signale |
  |---|---|
  | `F401` | un import inutilisé |
  | `F841` | une variable affectée mais jamais lue |
  | `E711` | `== None` au lieu de `is None` |
  | `E501` | une ligne trop longue |
  | `B006` | une valeur par défaut mutable (`def f(x=[])`) |
  | `I001` | des imports mal triés |
  | `T100` | un `breakpoint()` ou un import de `pdb` oublié |

  Sans `select`, Ruff n'active qu'un petit jeu sûr (`E4`, `E7`, `E9`, `F`). Pour faire taire une règle sur une ligne :
  `# noqa: F401` ; mieux vaut corriger, ou désactiver la règle pour tout le projet si elle ne convient pas.

  **Dans le projet** : la configuration dans `pyproject.toml`, un hook **pre-commit** qui lance Ruff avant chaque
  commit, et la CI qui lance `ruff check` et `ruff format --check`. La vérification des **types** est un autre outil :
  mypy ou Pyright.

  **En entretien** : « Un formateur, Black ou `ruff format`, impose la mise en page ; un analyseur, Ruff, signale le code
  suspect comme un import inutilisé ou un défaut mutable. Ruff remplace flake8 et isort en beaucoup plus rapide. On les
  configure dans `pyproject.toml` et on les lance en pre-commit et en CI. »
cards:
  - key: formateur-ou-analyseur
    format: course
    question: "Quelle différence entre un formateur, comme Black, et un analyseur, comme `ruff check` ?"
    choices:
      - {text: "Le formateur réécrit la mise en page ; l'analyseur signale du code suspect", correct: true}
      - {text: "Le formateur vérifie les types ; l'analyseur réécrit la mise en page du code", correct: false}
      - {text: "Aucune : ce sont deux noms pour le même outil, selon la communauté", correct: false}
      - {text: "Le formateur s'exécute en CI ; l'analyseur, seulement dans l'éditeur", correct: false}
    answer: "Black ne change que la forme (espaces, retours à la ligne), jamais le sens. L'analyseur repère des problèmes de fond : import inutilisé, variable jamais lue, défaut mutable."
  - key: ruff-fix
    format: course
    question: "Que fait la commande `ruff check --fix` ?"
    choices:
      - {text: "Elle corrige seule les problèmes dont la correction est sûre, et signale les autres", correct: true}
      - {text: "Elle reformate tout le code dans le style de Black, sans rien analyser", correct: false}
      - {text: "Elle désactive les règles en échec, dans `pyproject.toml`, une par une", correct: false}
      - {text: "Elle ajoute un commentaire `# noqa` sur chaque ligne qui pose problème", correct: false}
    answer: "Un import inutilisé ou des imports mal triés se corrigent sans risque ; les autres problèmes restent affichés. Le formatage, c'est `ruff format`."
  - key: regle-f401
    format: course
    question: "Que signale la règle `F401` de Ruff ?"
    choices:
      - {text: "Un import inutilisé", correct: true}
      - {text: "Une ligne trop longue", correct: false}
      - {text: "Une valeur par défaut mutable", correct: false}
      - {text: "Une comparaison `== None`", correct: false}
    answer: "Les règles `F` viennent de pyflakes : `F401` pour un import inutilisé, `F841` pour une variable jamais lue. La ligne trop longue est `E501`, le défaut mutable `B006`."
  - key: check-en-ci
    format: course
    question: "Pourquoi lancer `ruff format --check` (ou `black --check`) dans la CI ?"
    choices:
      - {text: "Pour faire échouer la CI si un fichier n'est pas formaté, sans rien modifier", correct: true}
      - {text: "Pour reformater le code directement dans la branche, avant le merge", correct: false}
      - {text: "Pour vérifier que les annotations de type du code sont cohérentes", correct: false}
      - {text: "Pour mesurer le temps que prendrait le formatage de tout le projet", correct: false}
    answer: "`--check` ne réécrit rien et sort avec le code 1 si un fichier changerait : le développeur formate en local, la CI garantit que personne n'a oublié."
  - key: vf-black-peu-configurable
    format: true-false
    question: "Black laisse très peu d'options de configuration : c'est voulu, pour clore les débats de style."
    truth: true
    answer: "« Any color you like » : la longueur de ligne et quelques réglages, guère plus. Un style unique évite les discussions et les diffs de reformatage."
  - key: vf-ruff-rust
    format: true-false
    question: Ruff est écrit en Rust, ce qui le rend bien plus rapide que flake8.
    truth: true
    answer: "Il analyse un grand projet en une fraction de seconde, ce qui permet de le lancer à chaque enregistrement et à chaque commit."
  - key: vf-ruff-types
    format: true-false
    question: "`ruff check` vérifie les types annotés, comme le fait mypy."
    truth: false
    answer: "Ruff analyse le style et les erreurs probables, pas la cohérence des types : c'est le travail de mypy ou de Pyright."
  - key: vf-black-79
    format: true-false
    question: Par défaut, Black limite les lignes à 79 caractères, comme PEP 8.
    truth: false
    answer: "Black utilise 88 caractères par défaut, un compromis qui réduit les retours à la ligne ; Ruff a repris la même valeur."
  - key: qcm-configuration
    format: multiple-choice
    question: Où configure-t-on habituellement Ruff dans un projet moderne ?
    choices:
      - {text: "Dans `pyproject.toml`, sous `[tool.ruff]`", correct: true}
      - {text: "Dans `requirements.txt`, après la dépendance", correct: false}
      - {text: "Dans `__init__.py`, avec une variable `RUFF`", correct: false}
      - {text: "Dans `setup.py`, en argument de `setup()`", correct: false}
    answer: "`pyproject.toml` centralise la configuration des outils : `[tool.ruff]`, `[tool.ruff.lint]`, `[tool.pytest.ini_options]`, `[tool.mypy]`. Ruff accepte aussi un `ruff.toml`."
  - key: qcm-noqa
    format: multiple-choice
    question: "Comment faire taire la règle `E501` sur une seule ligne ?"
    choices:
      - {text: "`# noqa: E501` en fin de ligne", correct: true}
      - {text: "`# ruff: ignore E501` en fin de ligne", correct: false}
      - {text: "`# type: ignore[E501]` en fin de ligne", correct: false}
      - {text: "`# pragma: no ruff` en fin de ligne", correct: false}
    answer: "`# noqa` suivi du code de la règle, hérité de flake8. Sans code, il ferait taire toutes les règles sur la ligne, ce qui cache trop."
  - key: qcm-outils-remplaces
    format: multiple-choice
    question: Quels outils Ruff peut-il remplacer ?
    choices:
      - {text: "flake8, isort et pyupgrade", correct: true}
      - {text: "mypy, pytest et coverage", correct: false}
      - {text: "pip, venv et Poetry", correct: false}
      - {text: "pdb, cProfile et timeit", correct: false}
    answer: "Ruff réimplémente les règles de flake8 et de ses plugins, le tri des imports d'isort et les modernisations de pyupgrade, et formate comme Black."
  - key: qcm-tri-imports
    format: multiple-choice
    question: Quelle famille de règles active le tri des imports dans Ruff ?
    choices:
      - {text: "`\"I\"`", correct: true}
      - {text: "`\"F\"`", correct: false}
      - {text: "`\"E\"`", correct: false}
      - {text: "`\"B\"`", correct: false}
    answer: "Les règles `I` reprennent isort ; `F` vient de pyflakes, `E` de pycodestyle et `B` de flake8-bugbear."
  - key: situation-debats-de-style
    format: scenario
    question: Les revues de code de ton équipe tournent aux débats sur les espaces et les guillemets. Que proposes-tu ?
    choices:
      - {text: "Un formateur automatique, lancé en pre-commit et vérifié en CI", correct: true}
      - {text: "Une charte de style écrite, que chacun relit avant chaque revue", correct: false}
      - {text: "Un relecteur désigné, seul chargé de trancher les questions de style", correct: false}
      - {text: "Laisser chacun libre de son style, tant que les tests passent", correct: false}
    answer: "Black ou `ruff format` règlent la question une fois pour toutes : la revue se concentre sur le fond. Le hook pre-commit formate avant le commit, la CI vérifie."
  - key: situation-vieux-projet
    format: scenario
    question: Tu ajoutes Ruff à un vieux projet, et il signale trois mille problèmes. Comment t'y prends-tu ?
    choices:
      - {text: "Quelques règles d'abord, `--fix` pour le sûr, puis j'élargis par étapes", correct: true}
      - {text: "J'active toutes les règles et je corrige les trois mille d'un seul coup", correct: false}
      - {text: "J'ajoute un `# noqa` sur chaque ligne signalée, pour repartir propre", correct: false}
      - {text: "Je renonce à Ruff : il ne convient qu'aux projets neufs", correct: false}
    answer: "On commence par le jeu par défaut, on applique les corrections automatiques dans un commit à part, puis on ajoute des familles de règles une à une. Des `noqa` partout cacheraient les vrais problèmes."
  - key: situation-noqa-b006
    format: scenario
    question: "Ruff signale `B006` sur `def ajouter(x, cible=[])`. Ton collègue veut ajouter `# noqa`. Que lui dis-tu ?"
    choices:
      - {text: "Que la règle signale un vrai bug : il faut `None` comme défaut", correct: true}
      - {text: "Que `# noqa` convient : la règle ne touche qu'à la mise en page", correct: false}
      - {text: "Qu'il vaut mieux désactiver la famille `B` pour tout le projet", correct: false}
      - {text: "Qu'il suffit de remplacer `[]` par `list()` pour la satisfaire", correct: false}
    answer: "La liste par défaut est créée une fois et partagée entre les appels. `cible=None`, puis `if cible is None: cible = []`. `list()` dans la signature serait tout aussi partagé."
  - key: situation-entretien-style
    format: scenario
    question: "En entretien : « Comment garantis-tu un style homogène dans une équipe Python ? » Que réponds-tu ?"
    choices:
      - {text: "Un formateur et un linter configurés dans `pyproject.toml`, en pre-commit et en CI", correct: true}
      - {text: "Une charte de style détaillée, relue par toute l'équipe à chaque revue de code", correct: false}
      - {text: "Un IDE identique pour tous, avec les mêmes réglages d'indentation", correct: false}
      - {text: "Des revues de code plus longues, centrées sur la mise en page du code", correct: false}
    answer: "L'automatisation rend le style non négociable et gratuit : Ruff (ou Black) formate, Ruff analyse, le hook pre-commit et la CI l'imposent. La configuration versionnée vaut pour tous."
