notion: idiomes
lesson: |-
  Un code **pythonique** utilise les tournures que le langage offre, au lieu de transposer celles de Java ou de C. En
  entretien, c'est ce qui distingue le plus vite quelqu'un qui pratique Python.

  | Au lieu de | On écrit |
  |---|---|
  | `for i in range(len(xs)): print(xs[i])` | `for x in xs: print(x)` |
  | un compteur `i` à côté de la boucle | `for i, x in enumerate(xs, start=1):` |
  | `for i in range(len(a)): f(a[i], b[i])` | `for x, y in zip(a, b):` (avec `strict=True` si les longueurs doivent être égales) |
  | `tmp = a; a = b; b = tmp` | `a, b = b, a` |
  | `if len(xs) == 0:` | `if not xs:` |
  | `if x == None:` | `if x is None:` |
  | une boucle qui remplit une liste | `[f(x) for x in xs if cond(x)]` |
  | un drapeau et un `break` | `any(...)`, `all(...)` |
  | `s = ""` puis `s += morceau` en boucle | `"".join(morceaux)` |
  | `if cle in d: v = d[cle] else: v = defaut` | `d.get(cle, defaut)` |
  | compter avec un dictionnaire à la main | `collections.Counter(mots)` |
  | tester l'existence d'une clé avant d'ajouter | `collections.defaultdict(list)` |
  | `f = open(...)` ... `f.close()` | `with open(...) as f:` |
  | `os.path.join(dossier, "a.txt")` | `pathlib.Path(dossier) / "a.txt"` |

  **EAFP plutôt que LBYL**. Python préfère « il est plus facile de demander pardon que la permission » : on tente
  l'opération et on rattrape l'exception, plutôt que de tout vérifier avant (« look before you leap »). Vérifier
  qu'un fichier existe avant de l'ouvrir laisse une fenêtre où il peut disparaître ; l'ouvrir et rattraper
  `FileNotFoundError` n'en laisse aucune.

  ```python
  try:
      age = int(saisie)
  except ValueError:
      age = None
  ```

  **D'autres idiomes** : le déballage (`premier, *reste = xs`), les comparaisons chaînées (`0 <= x < 10`), les
  expressions génératrices dans `sum`, `min`, `max` (`sum(p.prix for p in panier)`), `dict(zip(cles, valeurs))`,
  `sorted(..., key=...)`, `_` pour une valeur ignorée, les f-strings, et `if __name__ == "__main__":` pour un module
  aussi lancé en script.

  Le **Zen of Python** (`import this`) résume l'esprit : « Readability counts », « Explicit is better than implicit »,
  « Flat is better than nested ». Un idiome n'est pas une astuce : il sert la lisibilité. Une compréhension de trois
  lignes imbriquées ne l'est plus.

  **En entretien** : « Un code pythonique parcourt les éléments directement, avec `enumerate` et `zip`, utilise les
  compréhensions, `with`, `Counter` et `defaultdict`, et suit le style EAFP : tenter, puis rattraper l'exception. Le
  but est la lisibilité, pas la concision à tout prix. »
cards:
  - key: eafp
    format: course
    question: "Que désigne EAFP, le style que Python encourage ?"
    choices:
      - {text: "Tenter l'opération et rattraper l'exception, plutôt que tout vérifier avant", correct: true}
      - {text: "Vérifier chaque condition avant d'agir, pour ne jamais lever d'exception", correct: false}
      - {text: "Écrire toutes les fonctions en style fonctionnel, sans état ni effet de bord", correct: false}
      - {text: "Annoter chaque paramètre avec son type, pour détecter les erreurs plus tôt", correct: false}
    answer: "*Easier to Ask Forgiveness than Permission* : `try: d[cle]` puis `except KeyError`. Le style inverse, LBYL (*Look Before You Leap*), vérifie d'abord, au risque d'une situation qui change entre la vérification et l'action."
  - key: enumerate-plutot-que-range
    format: course
    question: "Pourquoi écrire `for i, x in enumerate(xs)` plutôt que `for i in range(len(xs))` ?"
    choices:
      - {text: "On obtient l'indice et l'élément sans indexer, et la boucle se lit mieux", correct: true}
      - {text: "`range(len(xs))` copie toute la liste en mémoire avant la première itération", correct: false}
      - {text: "`range(len(xs))` lève une erreur si la liste contient des valeurs `None`", correct: false}
      - {text: "`enumerate` parcourt la liste en parallèle, sur plusieurs cœurs à la fois", correct: false}
    answer: "`enumerate` donne les couples (indice, élément) et marche sur tout itérable, même sans `len` (un fichier, un générateur). `start=1` le fait compter à partir de 1."
  - key: zip-strict
    format: course
    question: "Que fait `zip(noms, ages, strict=True)` quand les deux listes n'ont pas la même longueur ?"
    choices:
      - {text: "Il lève une `ValueError`, au lieu de tronquer en silence", correct: true}
      - {text: "Il complète la liste la plus courte avec des `None`", correct: false}
      - {text: "Il s'arrête à la liste la plus courte, sans aucune erreur", correct: false}
      - {text: "Il lève une `IndexError` dès l'appel, avant de parcourir", correct: false}
    answer: "Sans `strict` (Python 3.10), `zip` s'arrête à la plus courte et les éléments en trop disparaissent. `itertools.zip_longest` complète au lieu de tronquer."
  - key: with-open
    format: course
    question: "Pourquoi ouvrir un fichier avec `with open(...) as f:` plutôt qu'avec `f = open(...)` ?"
    choices:
      - {text: "Le fichier est fermé à la sortie du bloc, même si une exception survient", correct: true}
      - {text: "`with` lit tout le fichier en mémoire d'un coup, ce qui va plus vite", correct: false}
      - {text: "`open` sans `with` ouvre le fichier en lecture seule, quel que soit le mode", correct: false}
      - {text: "`with` verrouille le fichier contre tous les autres processus du système", correct: false}
    answer: "Le gestionnaire de contexte appelle `f.close()` à la sortie du bloc, quoi qu'il arrive. Sans lui, une exception avant le `close` laisse le fichier ouvert."
  - key: vf-echange
    format: true-false
    question: "`a, b = b, a` échange les valeurs de deux variables, sans variable temporaire."
    truth: true
    answer: "Le membre de droite construit le tuple `(b, a)` d'abord, puis le déballage l'affecte à `a` et `b`."
  - key: vf-liste-vide
    format: true-false
    question: "`if len(xs) == 0:` est la façon la plus pythonique de tester qu'une liste est vide."
    truth: false
    answer: "Une liste vide est fausse : on écrit `if not xs:`, recommandé par PEP 8, et valable pour toute séquence ou collection."
  - key: vf-any-court-circuit
    format: true-false
    question: "`any(n < 0 for n in nombres)` s'arrête au premier nombre négatif rencontré."
    truth: true
    answer: "Avec une expression génératrice, `any` consomme les valeurs une à une et s'arrête au premier `True` ; `all` s'arrête au premier `False`."
  - key: vf-get-keyerror
    format: true-false
    question: "`d.get(cle)` lève une `KeyError` quand la clé est absente."
    truth: false
    answer: "`get` renvoie `None`, ou la valeur par défaut donnée en second argument. C'est `d[cle]` qui lève une `KeyError`."
  - key: qcm-compter
    format: multiple-choice
    question: "Quelle écriture compte les occurrences de chaque mot de `mots` ?"
    choices:
      - {text: "`collections.Counter(mots)`", correct: true}
      - {text: "`dict.fromkeys(mots, 1)`", correct: false}
      - {text: "`{mot: 1 for mot in mots}`", correct: false}
      - {text: "`set(mots).count()`", correct: false}
    answer: "`Counter` compte en un passage et offre `most_common(n)`. `fromkeys` et la compréhension donnent 1 à chaque mot, quel que soit son nombre d'apparitions."
  - key: qcm-dict-zip
    format: multiple-choice
    question: "Comment construire le dictionnaire `{nom: age}` à partir des listes `noms` et `ages` ?"
    choices:
      - {text: "`dict(zip(noms, ages))`", correct: true}
      - {text: "`dict(noms, ages)`", correct: false}
      - {text: "`{noms: ages}`", correct: false}
      - {text: "`zip(noms, ages).to_dict()`", correct: false}
    answer: "`zip` forme les couples, et `dict` accepte un itérable de couples. `{noms: ages}` lèverait une `TypeError` : une liste n'est pas hachable."
  - key: qcm-regrouper
    format: multiple-choice
    question: "Comment regrouper des mots par première lettre, sans tester l'existence de chaque clé ?"
    choices:
      - {text: "`groupes = defaultdict(list)`, puis `groupes[m[0]].append(m)`", correct: true}
      - {text: "`groupes = {}`, puis `groupes[m[0]].append(m)`", correct: false}
      - {text: "`groupes = dict(list)`, puis `groupes[m[0]].append(m)`", correct: false}
      - {text: "`groupes = Counter()`, puis `groupes[m[0]].append(m)`", correct: false}
    answer: "`defaultdict(list)` crée une liste vide à la première lecture d'une clé absente. Un dictionnaire ordinaire lèverait une `KeyError`, et un `Counter` donne `0`, qui n'a pas d'`append`."
  - key: qcm-somme-des-carres
    format: multiple-choice
    question: Quelle écriture de la somme des carrés des nombres pairs est la plus idiomatique ?
    choices:
      - {text: "`sum(n * n for n in nombres if n % 2 == 0)`", correct: true}
      - {text: "`sum(map(lambda n: n * n, filter(lambda n: n % 2 == 0, nombres)))`", correct: false}
      - {text: "`functools.reduce(lambda a, n: a + n * n, nombres, 0)`", correct: false}
      - {text: "`sum([nombres[i] ** 2 for i in range(len(nombres)) if i % 2 == 0])`", correct: false}
    answer: "Une expression génératrice dans `sum` se lit comme la phrase. `map` et `filter` avec des lambdas sont justes mais plus lourds ; `reduce` oublie le filtre, et la dernière teste la parité des indices."
  - key: bug-compter-keyerror
    format: bug-fix
    question: |-
      Ce code s'arrête sur « KeyError: 'chat' ». Quelle correction est la bonne ?
      ```python
      mots = ["chat", "chien", "chat"]
      compte = {}
      for mot in mots:
          compte[mot] += 1
      print(compte)
      ```
    choices:
      - {text: "`compte = Counter(mots)`, sans la boucle", correct: true}
      - {text: "`compte[mot] = compte[mot] + 1`", correct: false}
      - {text: "`compte = dict()` au lieu de `{}`", correct: false}
      - {text: "`compte.setdefault(mot)` avant le `+=`", correct: false}
    answer: |-
      ```python
      from collections import Counter

      compte = Counter(mots)
      print(compte)   # Counter({'chat': 2, 'chien': 1})
      ```
      `compte[mot] += 1` lit d'abord une clé absente. `Counter` part de 0 pour chaque clé ; `compte.get(mot, 0) + 1` marcherait aussi. `setdefault(mot)` mettrait `None`, et `None + 1` lève une `TypeError`.
  - key: bug-zip-tronque
    format: bug-fix
    question: |-
      Ce programme affiche « Ada 36 » et « Linus 54 » : Grace a disparu, et rien ne signale l'âge manquant. Quelle correction rend l'erreur visible ?
      ```python
      noms = ["Ada", "Linus", "Grace"]
      ages = [36, 54]
      for nom, age in zip(noms, ages):
          print(nom, age)
      ```
    choices:
      - {text: "`zip(noms, ages, strict=True)`, qui lève une `ValueError`", correct: true}
      - {text: "`zip(ages, noms)`, en inversant l'ordre des deux listes", correct: false}
      - {text: "`enumerate(zip(noms, ages))`, pour numéroter les couples", correct: false}
      - {text: "`zip(list(noms), list(ages))`, pour copier les listes avant", correct: false}
    answer: |-
      ```python
      for nom, age in zip(noms, ages, strict=True):
          print(nom, age)
      ```
      `zip` s'arrête en silence à la liste la plus courte. Avec `strict=True`, l'écart lève « ValueError: zip() argument 2 is shorter than argument 1 » au lieu de perdre une donnée.
  - key: bug-join-entiers
    format: bug-fix
    question: |-
      Ce code lève « TypeError: sequence item 0: expected str instance, int found ». Quelle correction est la bonne ?
      ```python
      nombres = [3, 1, 4]
      print(", ".join(nombres))
      ```
    choices:
      - {text: "`\", \".join(str(n) for n in nombres)`", correct: true}
      - {text: "`\", \".join(nombres, str)`", correct: false}
      - {text: "`str(\", \").join(nombres)`", correct: false}
      - {text: "`\", \".join(list(nombres))`", correct: false}
    answer: |-
      ```python
      print(", ".join(str(n) for n in nombres))   # 3, 1, 4
      ```
      `join` n'assemble que des chaînes : on convertit chaque nombre, avec une expression génératrice ou `map(str, nombres)`.
  - key: bug-enumerate-start
    format: bug-fix
    question: |-
      Le classement commence à « 0. Ada » au lieu de « 1. Ada ». Quelle correction est la bonne ?
      ```python
      gagnants = ["Ada", "Linus", "Grace"]
      for rang, nom in enumerate(gagnants):
          print(f"{rang}. {nom}")
      ```
    choices:
      - {text: "`enumerate(gagnants, start=1)`", correct: true}
      - {text: "`enumerate(gagnants[1:])`", correct: false}
      - {text: "`enumerate(range(1, len(gagnants)))`", correct: false}
      - {text: "`enumerate(gagnants, step=1)`", correct: false}
    answer: |-
      ```python
      for rang, nom in enumerate(gagnants, start=1):
          print(f"{rang}. {nom}")
      ```
      `enumerate` compte à partir de 0 par défaut ; `start=1` change le premier numéro. `gagnants[1:]` ferait perdre Ada.
  - key: situation-boucle-indices
    format: scenario
    question: "En revue, tu lis `for i in range(len(clients)): envoyer(clients[i])`. Que proposes-tu ?"
    choices:
      - {text: "`for client in clients: envoyer(client)` : parcourir les éléments eux-mêmes", correct: true}
      - {text: "`for i in range(0, len(clients), 1):` pour rendre le pas explicite", correct: false}
      - {text: "`while i < len(clients):` avec un compteur, plus proche du C", correct: false}
      - {text: "Rien : passer par les indices est la façon normale en Python", correct: false}
    answer: "La boucle `for` de Python parcourt directement les éléments. On ne passe par `enumerate` que si l'indice sert vraiment."
  - key: situation-fichier-existe
    format: scenario
    question: "Ton collègue teste `os.path.exists(chemin)` avant d'ouvrir le fichier. Quelle alternative proposes-tu ?"
    choices:
      - {text: "L'ouvrir directement et rattraper `FileNotFoundError` : le fichier peut disparaître entre-temps", correct: true}
      - {text: "Tester aussi `os.path.isfile(chemin)`, pour couvrir le cas d'un dossier du même nom", correct: false}
      - {text: "Tester deux fois `os.path.exists`, avant et après l'ouverture du fichier", correct: false}
      - {text: "Créer le fichier vide s'il manque, pour que l'ouverture réussisse toujours", correct: false}
    answer: "C'est le style EAFP : entre la vérification et l'ouverture, un autre processus peut supprimer le fichier. `try: open(...)` / `except FileNotFoundError:` traite le cas sans fenêtre de course."
  - key: situation-drapeau-break
    format: scenario
    question: "Une fonction cherche si une valeur dépasse un seuil, avec un drapeau, une boucle et un `break`. Que proposes-tu ?"
    choices:
      - {text: "`return any(x > seuil for x in valeurs)`", correct: true}
      - {text: "`return len([x for x in valeurs if x > seuil]) > 0`", correct: false}
      - {text: "`return max(valeurs) > seuil if valeurs else seuil`", correct: false}
      - {text: "`return filter(lambda x: x > seuil, valeurs)`", correct: false}
    answer: "`any` dit l'intention et s'arrête au premier élément qui convient. La liste complète calcule tout pour rien, le `else seuil` renvoie un nombre, et un objet `filter` est toujours vrai."
  - key: situation-definir-pythonique
    format: scenario
    question: "En entretien, on te demande ce qu'est un code « pythonique ». Que réponds-tu ?"
    choices:
      - {text: "Un code qui suit les idiomes du langage, au service de la lisibilité", correct: true}
      - {text: "Un code le plus court possible, quitte à tout tenir sur une seule ligne", correct: false}
      - {text: "Un code qui n'utilise que la bibliothèque standard, sans aucun paquet", correct: false}
      - {text: "Un code qui annote tous ses types et passe mypy en mode strict", correct: false}
    answer: "Parcourir les éléments directement, les compréhensions, `with`, `enumerate`, `zip`, EAFP : des tournures que tout développeur Python reconnaît. La concision n'est pas le but ; « Readability counts »."
