notion: typeddict-literal
lesson: |-
  Quatre outils de `typing` pour des cas que `list[int]` ou `int | None` ne savent pas décrire.

  **`TypedDict`** : un dictionnaire aux clés connues, chacune avec son type. Idéal pour du JSON décodé ou une
  configuration, qui restent de vrais `dict`.

  ```python
  from typing import NotRequired, TypedDict

  class Film(TypedDict):
      titre: str
      annee: int
      note: NotRequired[float]          # clé facultative

  film: Film = {"titre": "Alien", "annee": 1979}
  film["annee"] + 1                     # le vérificateur sait que c'est un int
  ```

  - À l'exécution, `Film(titre="X", annee=1)` est un simple `dict` : rien n'est vérifié.
  - `class Options(TypedDict, total=False)` rend toutes les clés facultatives ; `Required[...]` en oblige une.
  - `ReadOnly[...]` (Python 3.13) interdit au vérificateur de modifier une clé.

  **`Literal`** : des valeurs précises, pas seulement un type.

  ```python
  from typing import Literal

  def ouvrir(chemin: str, mode: Literal["r", "w"]) -> None: ...

  ouvrir("a.txt", "r")      # accepté
  ouvrir("a.txt", "x")      # refusé par le vérificateur
  ```

  Un `Literal` n'est pas une énumération : à l'exécution, `mode` reste une chaîne. Pour des valeurs qu'on manipule
  dans le code, `enum.Enum` reste préférable.

  **`Final`** : une constante, que le vérificateur interdit de réaffecter. `TAUX_TVA: Final = 0.2`. Python, lui,
  laisse faire. Le décorateur `@final` interdit de redéfinir une méthode ou d'hériter d'une classe.

  **`Callable`** : une fonction passée en paramètre, avec la liste de ses paramètres puis son retour.

  ```python
  from collections.abc import Callable

  def appliquer(f: Callable[[int, int], int], a: int, b: int) -> int:
      return f(a, b)

  rappel: Callable[..., None]           # n'importe quels paramètres, retour None
  ```

  **En entretien** : « `TypedDict` type un dictionnaire aux clés connues, qui reste un `dict` à l'exécution ;
  `Literal` restreint à quelques valeurs ; `Final` marque une constante pour le vérificateur ; `Callable[[int], str]`
  décrit une fonction en paramètre. Aucun n'est vérifié à l'exécution. »
cards:
  - key: typeddict-a-l-execution
    format: course
    question: "À l'exécution, qu'est-ce qu'une valeur `Film(titre=\"X\", annee=1)`, si `Film` est un `TypedDict` ?"
    choices:
      - {text: "Un simple `dict`", correct: true}
      - {text: "Une instance de la classe `Film`", correct: false}
      - {text: "Un `namedtuple` en lecture seule", correct: false}
      - {text: "Un objet créé par `@dataclass`", correct: false}
    answer: "`type(Film(titre=\"X\", annee=1))` est `dict`. Le `TypedDict` n'existe que pour le vérificateur : aucune classe, aucun contrôle."
  - key: sens-literal
    format: course
    question: "Que décrit l'annotation `mode: Literal[\"r\", \"w\"]` ?"
    choices:
      - {text: "Une chaîne qui ne peut valoir que `\"r\"` ou `\"w\"`", correct: true}
      - {text: "Une chaîne quelconque, écrite sous forme littérale", correct: false}
      - {text: "Un tuple qui contient les deux chaînes `\"r\"` et `\"w\"`", correct: false}
      - {text: "Une énumération créée à l'exécution avec deux membres", correct: false}
    answer: "Le vérificateur refuse `ouvrir(\"a.txt\", \"x\")`. À l'exécution, rien ne change : `mode` est une chaîne ordinaire."
  - key: sens-final
    format: course
    question: "Que fait l'annotation `MAX: Final = 100` ?"
    choices:
      - {text: "Le vérificateur refuse toute réaffectation de `MAX`", correct: true}
      - {text: "Python lève une erreur si on réaffecte `MAX`", correct: false}
      - {text: "`MAX` devient un attribut de classe partagé", correct: false}
      - {text: "La valeur de `MAX` est copiée dans chaque module", correct: false}
    answer: "Comme toute annotation, `Final` n'est pas vérifié à l'exécution : `MAX = 5` y passe. mypy, lui, le signale. Le type est déduit de la valeur (`int`)."
  - key: annoter-callable
    format: course
    question: Comment annoter un paramètre qui reçoit une fonction prenant un `int` et renvoyant un `str` ?
    choices:
      - {text: "`Callable[[int], str]`", correct: true}
      - {text: "`Callable[int, str]`", correct: false}
      - {text: "`Function[int -> str]`", correct: false}
      - {text: "`Callable[str, [int]]`", correct: false}
    answer: "D'abord la liste des types des paramètres, entre crochets, puis le type du retour. `Callable[..., str]` accepte n'importe quels paramètres."
  - key: vf-typeddict-non-verifie
    format: true-false
    question: "Python lève une erreur quand on range une chaîne dans une clé qu'un `TypedDict` annote `int`."
    truth: false
    answer: "Un `TypedDict` est un `dict` ordinaire à l'exécution : `{\"titre\": \"Y\", \"annee\": \"pas un int\"}` passe sans erreur. Seul le vérificateur signale le problème."
  - key: vf-notrequired
    format: true-false
    question: "`NotRequired[float]` marque une clé d'un `TypedDict` qui peut manquer."
    truth: true
    answer: "Par défaut, toutes les clés sont requises. `NotRequired` (Python 3.11) en rend une facultative ; `total=False` les rend toutes facultatives."
  - key: vf-final-execution
    format: true-false
    question: "Réaffecter une variable annotée `Final` lève une erreur à l'exécution."
    truth: false
    answer: "Python laisse faire : `MAX = 5` fonctionne. Seul le vérificateur statique refuse la réaffectation."
  - key: vf-literal-enum
    format: true-false
    question: "`Literal[\"rouge\", \"vert\"]` crée une énumération utilisable à l'exécution, comme `Enum`."
    truth: false
    answer: "`Literal` ne crée rien : les valeurs restent des chaînes. Pour des membres nommés, itérables et comparables, on écrit une `Enum`."
  - key: qcm-typeddict-ou-dataclass
    format: multiple-choice
    question: "Pourquoi choisir un `TypedDict` plutôt qu'une `dataclass` ?"
    choices:
      - {text: "Pour typer un dictionnaire qui existe déjà, comme du JSON décodé", correct: true}
      - {text: "Pour obtenir des objets plus rapides qu'un `dict` ordinaire", correct: false}
      - {text: "Pour valider automatiquement les données à l'exécution", correct: false}
      - {text: "Pour ajouter des méthodes aux données du dictionnaire", correct: false}
    answer: "`json.loads` renvoie des `dict` : un `TypedDict` les décrit sans les convertir. Une `dataclass` crée de vrais objets, avec des méthodes, qu'il faudrait construire à partir du dictionnaire."
  - key: qcm-total-false
    format: multiple-choice
    question: "Que fait `class Options(TypedDict, total=False)` ?"
    choices:
      - {text: "Toutes ses clés deviennent facultatives", correct: true}
      - {text: "Il accepte des clés non déclarées", correct: false}
      - {text: "Toutes ses valeurs peuvent valoir `None`", correct: false}
      - {text: "Le dictionnaire devient immuable", correct: false}
    answer: "`total=False` ne touche qu'à la présence des clés. Une clé précise se rend obligatoire avec `Required[...]`."
  - key: qcm-niveaux-log
    format: multiple-choice
    question: "Quelle annotation limite `niveau` aux chaînes `\"debug\"`, `\"info\"` et `\"erreur\"` ?"
    choices:
      - {text: "`Literal[\"debug\", \"info\", \"erreur\"]`", correct: true}
      - {text: "`str[\"debug\", \"info\", \"erreur\"]`", correct: false}
      - {text: "`Union[\"debug\", \"info\", \"erreur\"]`", correct: false}
      - {text: "`Enum[\"debug\", \"info\", \"erreur\"]`", correct: false}
    answer: "`Literal` énumère des valeurs permises. `Union` attend des types ; des chaînes y seraient lues comme des noms de types."
  - key: qcm-import-callable
    format: multiple-choice
    question: "D'où importer `Callable` en Python moderne ?"
    choices:
      - {text: "`collections.abc`", correct: true}
      - {text: "`functools`", correct: false}
      - {text: "`types`", correct: false}
      - {text: "`builtins`", correct: false}
    answer: "`collections.abc.Callable` est la forme recommandée depuis 3.9 ; `typing.Callable` en est un alias déprécié. `callable()`, en minuscules, est une fonction intégrée."
  - key: trous-typeddict
    format: fill-in
    question: |-
      Complète pour décrire un dictionnaire aux clés connues :
      ```python
      class Utilisateur(___):
          nom: str
          age: int
      ```
    blanks: [[TypedDict]]
    answer: "On hérite de `TypedDict` ; chaque annotation déclare une clé."
  - key: trous-literal
    format: fill-in
    question: |-
      Complète pour n'accepter que `"r"` ou `"w"` :
      ```python
      def ouvrir(chemin: str, mode: ___["r", "w"]) -> None:
          ...
      ```
    blanks: [[Literal]]
    answer: "`Literal` liste les valeurs permises."
  - key: trous-final
    format: fill-in
    question: |-
      Complète pour que le vérificateur interdise de réaffecter la constante :
      ```python
      TAUX_TVA: ___ = 0.2
      ```
    blanks: [[Final]]
    answer: "`Final` : le type est déduit de la valeur."
  - key: trous-callable
    format: fill-in
    question: |-
      Complète : `test` reçoit un entier et renvoie un booléen.
      ```python
      def filtrer(test: Callable[[int], ___], nombres: list[int]) -> list[int]:
          return [n for n in nombres if test(n)]
      ```
    blanks: [[bool]]
    answer: "`Callable[[int], bool]` : un paramètre `int`, un retour `bool`."
