notion: protocol
lesson: |-
  Le duck typing dit : « si ça a une méthode `fermer`, je peux le fermer ». `typing.Protocol` permet de l'écrire dans
  une annotation, et de le faire **vérifier statiquement** : c'est le **sous-typage structurel**.

  ```python
  from typing import Protocol

  class Fermable(Protocol):
      def fermer(self) -> None: ...

  class Fichier:                      # n'hérite de rien
      def fermer(self) -> None:
          print("fichier fermé")

  class Connexion:
      def fermer(self) -> None:
          print("connexion fermée")

  def tout_fermer(ressources: list[Fermable]) -> None:
      for ressource in ressources:
          ressource.fermer()

  tout_fermer([Fichier(), Connexion()])   # accepté par le vérificateur
  tout_fermer([42])                       # refusé : int n'a pas de méthode fermer
  ```

  Une classe satisfait un protocole **par sa forme** : elle a les méthodes (et les attributs) décrits, avec des
  signatures compatibles. Elle n'en hérite pas, et n'a même pas besoin de le connaître.

  | | `Protocol` | Classe abstraite (`ABC`) |
  |---|---|---|
  | Relation | structurelle : la forme suffit | nominale : il faut hériter (ou `register`) |
  | Code partagé | rarement | oui, des méthodes concrètes |
  | Pour | des classes qu'on ne contrôle pas, des doublures de test | une hiérarchie qu'on conçoit |

  **Un attribut** se déclare aussi : `nom: str` dans le corps du protocole. Un protocole peut être générique :
  `class Source[T](Protocol): def lire(self) -> T: ...`.

  **À l'exécution**, `isinstance(obj, Fermable)` lève une `TypeError`, sauf si le protocole porte
  `@runtime_checkable`. Même alors, `isinstance` ne vérifie que la **présence** des méthodes, ni leurs signatures ni
  leurs types. Les types abstraits de `collections.abc` (`Iterable`, `Sized`...) fonctionnent de la même façon :
  une classe qui définit `__iter__` est un `Iterable` sans en hériter.

  **En entretien** : « Un `Protocol` décrit une forme, des méthodes et des attributs : toute classe qui l'a le
  satisfait, sans héritage. C'est le duck typing vérifié par mypy, idéal pour des classes tierces ou des doublures de
  test. Une `ABC` impose l'héritage et peut partager du code ; `@runtime_checkable` n'ajoute à l'exécution qu'un
  test de présence des méthodes. »
cards:
  - key: ce-qui-satisfait
    format: course
    question: "Qu'est-ce qui fait qu'une classe satisfait un `Protocol` ?"
    choices:
      - {text: "Elle a les méthodes et attributs qu'il décrit, sans en hériter", correct: true}
      - {text: "Elle hérite du protocole et appelle `super().__init__()`", correct: false}
      - {text: "Elle est enregistrée avec la méthode `Protocole.register`", correct: false}
      - {text: "Elle porte le décorateur `@implements(Protocole)`", correct: false}
    answer: "Le sous-typage est structurel : la forme suffit. Hériter du protocole est permis mais inutile ; `register` appartient aux classes abstraites."
  - key: protocol-ou-abc
    format: course
    question: "Quelle différence fondamentale entre un `Protocol` et une classe abstraite (`ABC`) ?"
    choices:
      - {text: "Une `ABC` exige l'héritage ; un `Protocol` se contente de la forme", correct: true}
      - {text: "Un `Protocol` est vérifié à l'exécution, une `ABC` seulement par mypy", correct: false}
      - {text: "Une `ABC` ne peut contenir aucune méthode concrète", correct: false}
      - {text: "Aucune : `Protocol` est le nouveau nom de `ABC` depuis 3.8", correct: false}
    answer: "Une `ABC` est nominale : il faut en hériter, et elle peut fournir du code commun. Un `Protocol` est structurel. C'est plutôt l'`ABC` qui agit à l'exécution, en refusant d'instancier une classe incomplète."
  - key: isinstance-runtime-checkable
    format: course
    question: "Que vérifie `isinstance(obj, Volant)` quand `Volant` est un protocole `@runtime_checkable` ?"
    choices:
      - {text: "Seulement que `obj` a les méthodes du protocole", correct: true}
      - {text: "Que la classe de `obj` hérite bien de `Volant`", correct: false}
      - {text: "Que les signatures des méthodes correspondent", correct: false}
      - {text: "Que `obj` a été annoté avec le type `Volant`", correct: false}
    answer: "Le test regarde si les noms existent (`hasattr`), pas les paramètres ni les types. Une méthode `voler(self, x: int)` passerait aussi."
  - key: sans-runtime-checkable
    format: course
    question: "Que donne `isinstance(obj, Volant)` si `Volant` est un `Protocol` sans `@runtime_checkable` ?"
    choices:
      - {text: "Une `TypeError` : le protocole n'est pas vérifiable à l'exécution", correct: true}
      - {text: "`True` si `obj` a une méthode `voler`, `False` sinon", correct: false}
      - {text: "`False` dans tous les cas, puisque rien n'en hérite", correct: false}
      - {text: "Un avertissement, puis un test de présence des méthodes", correct: false}
    answer: "« TypeError: Instance and class checks can only be used with @runtime_checkable protocols ». Le décorateur rend le test explicite, car il ne vérifie pas grand-chose."
  - key: vf-heritage-requis
    format: true-false
    question: Pour qu'un vérificateur accepte un `Oiseau` là où le protocole `Volant` est attendu, `Oiseau` doit hériter de `Volant`.
    truth: false
    answer: "Il suffit qu'`Oiseau` ait les méthodes de `Volant`, avec des signatures compatibles. C'est tout l'intérêt d'un protocole."
  - key: vf-duck-typing-statique
    format: true-false
    question: "`typing.Protocol` permet de vérifier le duck typing de façon statique."
    truth: true
    answer: "Le duck typing (« si ça cancane... ») devient une annotation que mypy ou pyright contrôlent, sans imposer d'héritage."
  - key: vf-types-des-parametres
    format: true-false
    question: "Un `isinstance` sur un protocole `@runtime_checkable` vérifie les types des paramètres de ses méthodes."
    truth: false
    answer: "Il vérifie seulement que les méthodes existent. Les signatures ne sont contrôlées que par le vérificateur statique."
  - key: vf-iterable-structurel
    format: true-false
    question: "Une classe qui définit `__iter__` est reconnue par `isinstance(obj, collections.abc.Iterable)` sans en hériter."
    truth: true
    answer: "`Iterable` regarde la présence de `__iter__` (par `__subclasshook__`) : les types de `collections.abc` sont structurels eux aussi."
  - key: qcm-declarer
    format: multiple-choice
    question: "Comment déclares-tu le protocole « a une méthode `fermer()` » ?"
    choices:
      - {text: "`class Fermable(Protocol):` avec `def fermer(self) -> None: ...`", correct: true}
      - {text: "`class Fermable(ABC):` avec `@abstractmethod` sur `fermer`", correct: false}
      - {text: "`Fermable = Protocol(\"fermer\")`, avec le nom de la méthode", correct: false}
      - {text: "`@protocol` au-dessus d'une classe `Fermable` ordinaire", correct: false}
    answer: "On hérite de `typing.Protocol` et on écrit les signatures, avec `...` pour corps. La version `ABC` est une classe abstraite, nominale."
  - key: qcm-quand-protocol
    format: multiple-choice
    question: "Quand préférer un `Protocol` à une classe abstraite ?"
    choices:
      - {text: "Quand les classes viennent de bibliothèques que tu ne peux pas modifier", correct: true}
      - {text: "Quand tu veux interdire d'instancier la classe de base", correct: false}
      - {text: "Quand tu veux partager du code entre toutes les sous-classes", correct: false}
      - {text: "Quand les méthodes doivent être vérifiées à chaque appel", correct: false}
    answer: "On ne peut pas faire hériter une classe tierce de son `ABC` ; elle satisfait un protocole sans le savoir. Interdire l'instanciation ou partager du code, c'est le rôle d'une `ABC`."
  - key: qcm-attribut
    format: multiple-choice
    question: Un protocole peut-il exiger un attribut, et pas seulement une méthode ?
    choices:
      - {text: "Oui : on écrit `nom: str` dans le corps du protocole", correct: true}
      - {text: "Non : un protocole ne décrit que des méthodes", correct: false}
      - {text: "Oui, mais seulement à travers une `@property`", correct: false}
      - {text: "Oui, mais seulement à l'exécution, par `hasattr`", correct: false}
    answer: "Un attribut annoté dans le protocole doit exister, avec un type compatible, dans les classes qui le satisfont. Une `@property` marche aussi, pour un attribut en lecture seule."
  - key: qcm-decorateur
    format: multiple-choice
    question: "Quel décorateur rend un protocole utilisable avec `isinstance` ?"
    choices:
      - {text: "`@runtime_checkable`", correct: true}
      - {text: "`@dataclass`", correct: false}
      - {text: "`@abstractmethod`", correct: false}
      - {text: "`@final`", correct: false}
    answer: "`typing.runtime_checkable` : sans lui, `isinstance` lève une `TypeError`. Il ne teste que la présence des méthodes."
  - key: trous-heriter-protocol
    format: fill-in
    question: |-
      Complète la déclaration du protocole :
      ```python
      from typing import Protocol

      class Lisible(___):
          def lire(self) -> str: ...
      ```
    blanks: [[Protocol, typing.Protocol]]
    answer: "Un protocole hérite de `Protocol` ; les classes qui le satisfont, non."
  - key: trous-import-runtime
    format: fill-in
    question: |-
      Complète l'import :
      ```python
      from typing import Protocol, ___

      @runtime_checkable
      class Fermable(Protocol):
          def fermer(self) -> None: ...
      ```
    blanks: [[runtime_checkable]]
    answer: "`runtime_checkable` vient de `typing`, comme `Protocol`."
  - key: trous-corps-methode
    format: fill-in
    question: |-
      Complète le corps de la méthode, qui ne fait que décrire la signature :
      ```python
      class Volant(Protocol):
          def voler(self) -> str: ___
      ```
    blanks: [["...", pass]]
    answer: "Par convention, `...` (Ellipsis) ; `pass` fonctionne aussi. Le corps n'est jamais exécuté."
  - key: trous-isinstance
    format: fill-in
    question: |-
      Complète le test à l'exécution, sur un protocole `@runtime_checkable` :
      ```python
      if ___(ressource, Fermable):
          ressource.fermer()
      ```
    blanks: [[isinstance]]
    answer: "`isinstance` ne vérifie que la présence de la méthode `fermer`."
  - key: sc-classes-tierces
    format: scenario
    question: Ta fonction doit accepter des objets de trois bibliothèques différentes, qui ont tous une méthode `send(data)`, sans classe de base commune. Comment l'annoter ?
    choices:
      - {text: "Un `Protocol` avec `send`, que les trois satisfont sans le savoir", correct: true}
      - {text: "Une classe abstraite, dont les trois classes devront hériter", correct: false}
      - {text: "`Any`, puisqu'elles n'ont aucun type en commun", correct: false}
      - {text: "Une union des trois classes, à compléter à chaque ajout", correct: false}
    answer: "On ne peut pas modifier les classes tierces : le protocole décrit ce dont la fonction a besoin, et rien de plus. Une union marche, mais doit grossir à chaque nouvelle classe ; `Any` ne vérifie plus rien."
  - key: sc-doublure-de-test
    format: scenario
    question: Pour tester un service qui dépend d'un client HTTP, tu veux lui passer un faux client. Comment le typer proprement ?
    choices:
      - {text: "Annoter la dépendance par un `Protocol` que le vrai et le faux satisfont", correct: true}
      - {text: "Faire hériter le faux client du vrai, pour garder le même type", correct: false}
      - {text: "Annoter la dépendance avec `object`, pour accepter n'importe quoi", correct: false}
      - {text: "Retirer les annotations du service pendant l'écriture des tests", correct: false}
    answer: "Le service ne dépend que de ce qu'il utilise (`get`, `post`...). Le faux client n'a pas à hériter du vrai, ce qui lui ferait embarquer son comportement réseau."
  - key: sc-isinstance-validation
    format: scenario
    question: "Un collègue valide des entrées avec `isinstance(x, Sauvegardable)`, un protocole `@runtime_checkable`. Que lui signales-tu ?"
    choices:
      - {text: "Le test ne voit que la présence des méthodes, ni signatures ni types", correct: true}
      - {text: "Le test est complet : il vérifie aussi les types des paramètres", correct: false}
      - {text: "`isinstance` ne fonctionne jamais avec un protocole, même décoré", correct: false}
      - {text: "Le test lève une erreur si la classe de `x` hérite du protocole", correct: false}
    answer: "Un objet qui a une méthode `sauvegarder` sans rapport passerait le test. Pour valider vraiment, il faut d'autres vérifications, ou s'en remettre au vérificateur statique."
  - key: sc-plugins
    format: scenario
    question: "Tu écris un système de plugins : chaque plugin doit hériter d'une base qui fournit du code commun (journalisation, configuration). ABC ou Protocol ?"
    choices:
      - {text: "Une classe abstraite : l'héritage apporte le code commun et le contrat", correct: true}
      - {text: "Un `Protocol`, car l'héritage est toujours à éviter en Python", correct: false}
      - {text: "Un `Protocol`, car une classe abstraite ne peut pas avoir de code", correct: false}
      - {text: "Ni l'un ni l'autre : un dictionnaire de fonctions suffit", correct: false}
    answer: "Ici, on conçoit la hiérarchie et on veut partager du code : une `ABC` le fait, et refuse d'instancier un plugin incomplet. Le protocole convient quand on ne contrôle pas les classes."
