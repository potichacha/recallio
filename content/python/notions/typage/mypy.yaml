notion: mypy
lesson: |-
  Les annotations ne servent à rien si personne ne les lit. Un **vérificateur de types statique** analyse le code
  **sans l'exécuter**, comme un compilateur, et signale les incohérences avant la production.

  | Outil | Origine | Remarques |
  |---|---|---|
  | **mypy** | le projet historique, écrit en Python | la référence, très configurable |
  | **pyright** | Microsoft | rapide ; il fait tourner l'extension Pylance de VS Code |
  | ty, Pyrefly | Astral, Meta | plus récents, écrits en Rust |

  ```bash
  pip install mypy
  mypy src
  ```

  ```
  src/prix.py:4: error: Argument 1 to "prix_ttc" has incompatible type "str"; expected "float"  [arg-type]
  Found 1 error in 1 file (checked 3 source files)
  ```

  Chaque erreur porte un **code** entre crochets (`arg-type`, `union-attr`, `return`...).

  **Ce qu'il faut savoir**

  - Par défaut, mypy **ne vérifie pas le corps d'une fonction sans annotation** : il la considère comme du code non
    typé. `--check-untyped-defs` change cela ; `--strict` active un ensemble de contrôles exigeants, dont le refus des
    fonctions non annotées.
  - `reveal_type(x)` fait afficher par mypy le type qu'il a déduit pour `x`.
  - `# type: ignore[arg-type]` fait taire **une** erreur précise sur une ligne. Un `# type: ignore` sans code les tait
    toutes : à éviter, il cache les vrais bugs.
  - Une bibliothèque tierce sans annotations se type par des **stubs** (`types-requests`, sur PyPI) ; une
    bibliothèque annotée le signale par un fichier `py.typed`.
  - La configuration va dans `pyproject.toml` :

  ```
  [tool.mypy]
  python_version = "3.14"
  strict = true
  ```

  **Adopter mypy sur un projet existant** : on commence sans `--strict`, dans la CI, puis on durcit module par module
  (`[[tool.mypy.overrides]]`). Les types ne remplacent pas les tests : ils trouvent les erreurs de types, pas les
  erreurs de logique.

  **En entretien** : « mypy ou pyright vérifient les annotations sans exécuter le code ; je les lance dans la CI,
  comme les tests. Sur un projet existant, on les adopte progressivement, et chaque `type: ignore` porte son code
  d'erreur. Ils ne remplacent pas les tests, ils les complètent. »
cards:
  - key: execute-t-il
    format: course
    question: mypy exécute-t-il le code qu'il vérifie ?
    choices:
      - {text: "Non : il l'analyse sans l'exécuter, comme un compilateur", correct: true}
      - {text: "Oui : il lance chaque fonction avec des valeurs d'essai", correct: false}
      - {text: "Oui, mais seulement les tests unitaires du projet", correct: false}
      - {text: "Non : il se contente de lire les docstrings des fonctions", correct: false}
    answer: "C'est une analyse statique : mypy déduit les types de chaque expression à partir des annotations, sans rien lancer. Il trouve donc aussi les erreurs d'un code jamais exécuté par les tests."
  - key: fonction-non-annotee
    format: course
    question: Par défaut, que fait mypy du corps d'une fonction qui n'a aucune annotation ?
    choices:
      - {text: "Il ne le vérifie pas, sauf avec `--check-untyped-defs`", correct: true}
      - {text: "Il le vérifie en supposant que chaque valeur est un `int`", correct: false}
      - {text: "Il refuse le fichier entier : tout doit être annoté", correct: false}
      - {text: "Il le vérifie en devinant les types d'après les appels", correct: false}
    answer: "Une fonction sans annotation est considérée comme non typée, et son corps est ignoré. C'est ce qui permet d'adopter mypy progressivement ; `--strict` refuse ces fonctions."
  - key: reveal-type
    format: course
    question: "À quoi sert `reveal_type(x)` dans un fichier vérifié par mypy ?"
    choices:
      - {text: "mypy affiche le type qu'il a déduit pour `x`", correct: true}
      - {text: "Il convertit `x` vers le type de son annotation", correct: false}
      - {text: "Il signale une erreur si `x` n'est pas annoté", correct: false}
      - {text: "Il ajoute l'annotation manquante dans le fichier", correct: false}
    answer: "C'est un outil de mise au point : `note: Revealed type is \"builtins.int\"`. Depuis 3.11, `typing.reveal_type` existe aussi à l'exécution, où il affiche le type réel."
  - key: option-strict
    format: course
    question: "Que fait l'option `--strict` de mypy ?"
    choices:
      - {text: "Elle active des contrôles exigeants, dont le refus des fonctions non annotées", correct: true}
      - {text: "Elle vérifie les types à l'exécution, en plus de l'analyse statique", correct: false}
      - {text: "Elle arrête l'analyse dès la première erreur trouvée dans un fichier", correct: false}
      - {text: "Elle traite aussi les écarts au style PEP 8 comme des erreurs", correct: false}
    answer: "`--strict` regroupe plusieurs options (`--disallow-untyped-defs`, `--warn-return-any`...). On la vise sur un projet neuf ; sur un projet existant, on l'atteint module par module."
  - key: vf-pylance
    format: true-false
    question: Pyright est le vérificateur de types sur lequel repose l'extension Pylance de VS Code.
    truth: true
    answer: "Pylance embarque pyright, de Microsoft : les erreurs soulignées dans l'éditeur sont les siennes. pyright existe aussi en ligne de commande, pour la CI."
  - key: vf-type-ignore
    format: true-false
    question: "Un commentaire `# type: ignore` en fin de ligne fait taire mypy sur cette ligne."
    truth: true
    answer: "Il les fait toutes taire. On préfère cibler un code précis, `# type: ignore[arg-type]`, pour ne pas cacher une autre erreur."
  - key: vf-plus-rapide
    format: true-false
    question: Un code vérifié par mypy s'exécute plus vite, car l'interpréteur connaît alors les types.
    truth: false
    answer: "mypy ne change rien à l'exécution : CPython ignore les annotations. Le gain est dans les bugs trouvés plus tôt."
  - key: vf-stubs-tiers
    format: true-false
    question: "Pour un paquet tiers sans annotations, comme `requests`, un paquet de stubs comme `types-requests` donne ses types à mypy."
    truth: true
    answer: "Le dépôt typeshed publie ces stubs sur PyPI. Une bibliothèque déjà annotée n'en a pas besoin : elle le signale par un fichier `py.typed`."
  - key: qcm-commande
    format: multiple-choice
    question: Quelle commande vérifie les types de tout le dossier `src` ?
    choices:
      - {text: "`mypy src`", correct: true}
      - {text: "`python -m typing src`", correct: false}
      - {text: "`python -X mypy src`", correct: false}
      - {text: "`pip check src`", correct: false}
    answer: "mypy s'installe avec pip (`pip install mypy`) et prend des fichiers ou des dossiers. `pip check` vérifie la cohérence des dépendances installées, pas les types."
  - key: qcm-configuration
    format: multiple-choice
    question: Où configures-tu mypy dans un projet moderne ?
    choices:
      - {text: "Dans la table `[tool.mypy]` de `pyproject.toml`", correct: true}
      - {text: "Dans `requirements.txt`, après la version de mypy", correct: false}
      - {text: "Dans `__init__.py`, avec une variable `MYPY`", correct: false}
      - {text: "Dans un `setup.py`, obligatoire pour mypy", correct: false}
    answer: "Les outils lisent leur table `[tool.<nom>]` de `pyproject.toml`. mypy accepte aussi `mypy.ini` ou `setup.cfg`, mais rien ne les impose."
  - key: qcm-ignore-cible
    format: multiple-choice
    question: Quelle façon de faire taire une erreur de mypy est la plus sûre ?
    choices:
      - {text: "`# type: ignore[arg-type]`, qui ne tait qu'un code d'erreur", correct: true}
      - {text: "`# type: ignore`, qui tait toutes les erreurs de la ligne", correct: false}
      - {text: "`# mypy: ignore-errors` en tête du fichier entier", correct: false}
      - {text: "`# noqa` en fin de ligne, reconnu par tous les outils", correct: false}
    answer: "Un ignore ciblé laisse passer les autres erreurs de la ligne. mypy peut même signaler les ignores devenus inutiles (`warn_unused_ignores`). `# noqa` vise les linters comme Ruff, pas mypy."
  - key: qcm-quand-lancer
    format: multiple-choice
    question: À quel moment faire tourner mypy dans un projet d'équipe ?
    choices:
      - {text: "Dans la CI, à chaque pull request, comme les tests", correct: true}
      - {text: "En production, au démarrage de l'application", correct: false}
      - {text: "Une seule fois, à la création du projet", correct: false}
      - {text: "Seulement avant de changer de version de Python", correct: false}
    answer: "Une erreur de types doit bloquer la fusion, comme un test rouge. L'éditeur la montre déjà pendant l'écriture ; en production, mypy ne sert à rien."
  - key: bug-union-attr
    format: bug-fix
    question: |-
      mypy signale `[union-attr]` sur la ligne du `return`, et l'exécution s'arrête sur « AttributeError: 'NoneType'
      object has no attribute 'upper' » :
      ```python
      def initiale(noms: dict[str, str], cle: str) -> str:
          return noms.get(cle).upper()[0]

      print(initiale({"a": "ada"}, "b"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`return noms.get(cle, \"?\").upper()[0]`", correct: true}
      - {text: "`return noms.get(cle).upper()[0]  # type: ignore`", correct: false}
      - {text: "`return str(noms.get(cle)).upper()[0]`", correct: false}
      - {text: "Annoter le retour `-> str | None`", correct: false}
    answer: |-
      ```python
      def initiale(noms: dict[str, str], cle: str) -> str:
          return noms.get(cle, "?").upper()[0]
      ```
      `get` renvoie `str | None` : mypy avait vu le cas `None`. Faire taire mypy laisse le plantage ; `str(None)`
      donnerait `"N"`, une initiale fausse.
  - key: bug-ignore-cache-bug
    format: bug-fix
    question: |-
      Pour faire passer la CI, un collègue a ajouté `# type: ignore`. En production, le script s'arrête sur
      « TypeError: can't multiply sequence by non-int of type 'float' » :
      ```python
      def prix_ttc(prix: float) -> float:
          return prix * 1.2

      print(prix_ttc("10"))  # type: ignore
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(prix_ttc(float(\"10\")))`", correct: true}
      - {text: "`print(prix_ttc(\"10\"))  # type: ignore[arg-type]`", correct: false}
      - {text: "`def prix_ttc(prix: str) -> float:`", correct: false}
      - {text: "`return prix * int(1.2)`", correct: false}
    answer: |-
      ```python
      print(prix_ttc(float("10")))
      ```
      mypy avait raison : on passait une chaîne. Le `type: ignore` a caché le bug au lieu de le corriger.
      `int(1.2)` vaut 1, et `"10" * 1` donnerait la chaîne `"10"`.
  - key: bug-append-mauvais-type
    format: bug-fix
    question: |-
      mypy signale `[arg-type]` sur l'appel à `append`, et le script s'arrête sur « TypeError: unsupported operand
      type(s) for +: 'int' and 'str' » :
      ```python
      def ajouter(notes: list[int], note: str) -> list[int]:
          notes.append(note)
          return notes

      print(sum(ajouter([12, 15], "18")))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`notes.append(int(note))`", correct: true}
      - {text: "`notes.append(note)  # type: ignore`", correct: false}
      - {text: "`def ajouter(notes: list[int | str], note: str):`", correct: false}
      - {text: "`notes.append(str(note))`", correct: false}
    answer: |-
      ```python
      def ajouter(notes: list[int], note: str) -> list[int]:
          notes.append(int(note))
          return notes
      ```
      La liste promet des `int` : on convertit la note avant de l'ajouter. Élargir le type à `int | str` déplacerait
      l'erreur sur `sum`.
  - key: bug-return-manquant
    format: bug-fix
    question: |-
      mypy signale « Missing return statement », et le script s'arrête sur « AttributeError: 'NoneType' object has no
      attribute 'upper' » :
      ```python
      def signe(n: int) -> str:
          if n > 0:
              return "positif"
          elif n < 0:
              return "négatif"

      print(signe(0).upper())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ajouter `return \"nul\"` à la fin de la fonction", correct: true}
      - {text: "Annoter le retour `-> str | None` au lieu de `-> str`", correct: false}
      - {text: "Remplacer `elif n < 0:` par un simple `else:`", correct: false}
      - {text: "Ajouter `# type: ignore[return]` sur la ligne du `def`", correct: false}
    answer: |-
      ```python
      def signe(n: int) -> str:
          if n > 0:
              return "positif"
          elif n < 0:
              return "négatif"
          return "nul"
      ```
      Pour 0, aucune branche ne renvoie de valeur : la fonction renvoie `None`. Un `else:` classerait 0 parmi les
      négatifs.
  - key: sc-projet-existant
    format: scenario
    question: Ton équipe veut adopter mypy sur un projet de 200 000 lignes sans annotations. Que proposes-tu ?
    choices:
      - {text: "L'introduire progressivement : dans la CI, puis plus strict module par module", correct: true}
      - {text: "Activer `--strict` partout dès le premier jour, et tout corriger avant de fusionner", correct: false}
      - {text: "Annoter tous les fichiers du projet en une seule grosse pull request", correct: false}
      - {text: "Renoncer : mypy ne sert que sur un projet neuf, écrit avec des annotations", correct: false}
    answer: "Sans annotations, mypy ignore les corps de fonction : on peut l'ajouter tout de suite à la CI. On annote ensuite le code neuf et les modules critiques, en durcissant la configuration module par module (`[[tool.mypy.overrides]]`)."
  - key: sc-ignore-partout
    format: scenario
    question: "Un collègue ajoute `# type: ignore` sur chaque ligne que mypy signale, pour rendre la CI verte. Que lui réponds-tu ?"
    choices:
      - {text: "Chaque erreur est peut-être un bug : corrige le type, ou cible l'ignore avec un code", correct: true}
      - {text: "C'est la bonne pratique : mypy se trompe la plupart du temps", correct: false}
      - {text: "Il vaudrait mieux retirer mypy de la CI, ce serait plus honnête", correct: false}
      - {text: "Il faut plutôt supprimer les annotations des lignes signalées", correct: false}
    answer: "Un ignore général cache aussi les erreurs futures de la ligne. On corrige ce qui est un vrai bug ; pour un faux positif, on ignore un code précis, avec un commentaire qui dit pourquoi."
  - key: sc-mypy-ou-tests
    format: scenario
    question: Un collègue affirme que mypy rend les tests unitaires inutiles. Que lui réponds-tu ?
    choices:
      - {text: "mypy trouve des erreurs de types, pas de logique : les deux se complètent", correct: true}
      - {text: "Il a raison : un code bien typé ne peut plus contenir de bug", correct: false}
      - {text: "Il a raison, à condition d'activer l'option `--strict`", correct: false}
      - {text: "C'est l'inverse : avec des tests, mypy ne sert plus à rien", correct: false}
    answer: "`return a - b` au lieu de `a + b` est parfaitement typé. mypy couvre tous les chemins du code, même non testés ; les tests vérifient le comportement. On garde les deux."
  - key: sc-bibliotheque-sans-types
    format: scenario
    question: mypy refuse d'analyser les imports d'une bibliothèque tierce qui n'a ni annotations ni stubs. Que fais-tu ?
    choices:
      - {text: "Installer ses stubs s'ils existent, sinon l'ignorer de façon ciblée dans la config", correct: true}
      - {text: "Ajouter `# type: ignore` en tête de chacun de tes fichiers qui l'importent", correct: false}
      - {text: "Désinstaller mypy, qui ne fonctionne pas avec cette bibliothèque", correct: false}
      - {text: "Réécrire toi-même la bibliothèque pour y ajouter des annotations", correct: false}
    answer: "Les stubs de typeshed (`types-<paquet>`) couvrent beaucoup de bibliothèques. Sinon, une section `[[tool.mypy.overrides]]` avec `ignore_missing_imports = true` pour ce seul module : ses valeurs seront traitées comme `Any`."
