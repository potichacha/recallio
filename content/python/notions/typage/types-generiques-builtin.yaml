notion: types-generiques-builtin
lesson: |-
  Depuis Python 3.9, les collections natives s'annotent **avec le type de leur contenu**, entre crochets, sans rien
  importer :

  ```python
  noms: list[str] = ["Ada", "Alan"]
  stock: dict[str, int] = {"stylo": 12}
  tags: set[str] = {"python", "typage"}
  point: tuple[float, float] = (2.0, 3.5)       # exactement deux éléments
  mesures: tuple[float, ...] = (1.0, 2.5, 4.0)  # autant qu'on veut, tous des float
  paires: list[tuple[str, int]] = [("a", 1)]    # les types s'imbriquent
  ```

  | Annotation | Décrit |
  |---|---|
  | `list[int]` | une liste d'entiers |
  | `dict[str, list[float]]` | des clés `str`, des valeurs `list[float]` |
  | `tuple[int, str]` | un tuple de **deux** éléments : un `int`, puis un `str` |
  | `tuple[int, ...]` | un tuple d'entiers de longueur quelconque |
  | `type[Animal]` | la classe `Animal` ou une sous-classe (pas une instance) |

  **Avant 3.9**, il fallait `from typing import List, Dict` et écrire `List[int]`. Ces alias existent encore, mais
  sont dépréciés : on écrit `list[int]`.

  **Accepter large, renvoyer précis.** Pour un paramètre qu'on ne fait que parcourir, on préfère les types abstraits
  de `collections.abc` : `Iterable[int]` accepte une liste, un tuple, un set ou un générateur ; `Sequence[int]`
  promet l'accès par indice et `len` ; `Mapping[str, int]` un dictionnaire en lecture. Pour un retour, on donne le
  type concret (`list[int]`), plus utile à l'appelant.

  ```python
  from collections.abc import Iterable

  def total(prix: Iterable[float]) -> float:
      return sum(prix)
  ```

  **À l'exécution**, `list[int]` est un objet (`types.GenericAlias`) que Python ne vérifie pas :
  `notes: list[int] = [12, "quinze"]` passe sans erreur, et `isinstance(x, list[int])` lève une `TypeError` : on
  écrit `isinstance(x, list)`.

  **En entretien** : « Depuis 3.9, on écrit `list[int]` ou `dict[str, int]` directement, sans `typing.List`.
  `tuple[int, str]` a une longueur fixe, `tuple[int, ...]` une longueur libre. Pour les paramètres, je préfère
  `Iterable` ou `Sequence` de `collections.abc`, et rien de tout cela n'est vérifié à l'exécution. »
cards:
  - key: tuple-longueur-libre
    format: course
    question: Comment annoter un tuple d'entiers de longueur quelconque ?
    choices:
      - {text: "`tuple[int, ...]`", correct: true}
      - {text: "`tuple[int]`", correct: false}
      - {text: "`tuple[*int]`", correct: false}
      - {text: "`list[int, ...]`", correct: false}
    answer: "Les points de suspension disent « autant d'éléments qu'on veut, tous de ce type ». `tuple[int]` désigne un tuple d'**un seul** entier."
  - key: version-list-int
    format: course
    question: Depuis quelle version peut-on écrire `list[int]` sans importer `typing.List` ?
    choices:
      - {text: "Python 3.9", correct: true}
      - {text: "Python 3.5", correct: false}
      - {text: "Python 3.12", correct: false}
      - {text: "Python 3.14", correct: false}
    answer: "La PEP 585 (Python 3.9) a rendu les collections natives génériques. Les annotations elles-mêmes datent de 3.0, et le module `typing` de 3.5."
  - key: parametre-iterable
    format: course
    question: Pourquoi annoter un paramètre `Iterable[int]` plutôt que `list[int]`, si la fonction ne fait que le parcourir ?
    choices:
      - {text: "Pour accepter aussi un tuple, un set ou un générateur", correct: true}
      - {text: "Pour que la fonction s'exécute plus vite sur une liste", correct: false}
      - {text: "Pour interdire qu'on lui passe une liste modifiable", correct: false}
      - {text: "Pour que Python convertisse l'argument en liste", correct: false}
    answer: "Le vérificateur accepte alors tout ce qui se parcourt. On demande le minimum dont la fonction a besoin ; le retour, lui, reste concret (`list[int]`)."
  - key: dict-de-listes
    format: course
    question: Comment annoter un dictionnaire qui associe un nom d'élève à sa liste de notes décimales ?
    choices:
      - {text: "`dict[str, list[float]]`", correct: true}
      - {text: "`dict[str: list[float]]`", correct: false}
      - {text: "`dict(str, list[float])`", correct: false}
      - {text: "`dict[list[float], str]`", correct: false}
    answer: "Le type des clés, puis celui des valeurs, séparés par une virgule et entre crochets."
  - key: vf-isinstance-generique
    format: true-false
    question: "`isinstance([1, 2], list[int])` renvoie `True`."
    truth: false
    answer: "Il lève « TypeError: isinstance() argument 2 cannot be a parameterized generic » : Python ne vérifie pas le contenu d'une collection. On écrit `isinstance(x, list)`."
  - key: vf-typing-list-deprecie
    format: true-false
    question: "`typing.List[int]` reste accepté, mais `list[int]` est la forme recommandée depuis Python 3.9."
    truth: true
    answer: "Les alias `List`, `Dict`, `Set` et `Tuple` de `typing` sont dépréciés depuis 3.9, sans date de retrait. Les outils comme Ruff proposent de les remplacer."
  - key: vf-tuple-deux-elements
    format: true-false
    question: "`tuple[int, str]` décrit un tuple de deux éléments : un entier, puis une chaîne."
    truth: true
    answer: "Chaque position a son type. Pour une longueur libre, on écrit `tuple[int, ...]`."
  - key: vf-contenu-verifie
    format: true-false
    question: "Avec `notes: list[int] = [12, \"quinze\"]`, Python lève une erreur à l'exécution."
    truth: false
    answer: "Rien n'est vérifié à l'exécution : la liste est créée telle quelle. Un vérificateur statique, lui, signalerait la chaîne."
  - key: qcm-ensemble-chaines
    format: multiple-choice
    question: Quelle annotation décrit un ensemble de chaînes ?
    choices:
      - {text: "`set[str]`", correct: true}
      - {text: "`{str}`", correct: false}
      - {text: "`set(str)`", correct: false}
      - {text: "`list[str, unique]`", correct: false}
    answer: "Comme les autres collections : `set[str]`, et `frozenset[str]` pour un ensemble immuable."
  - key: qcm-sequence-lecture
    format: multiple-choice
    question: Une fonction lit une liste par indice sans la modifier, et doit aussi accepter un tuple. Quelle annotation choisir ?
    choices:
      - {text: "`Sequence[int]`, de `collections.abc`", correct: true}
      - {text: "`list[int]`, la plus courante", correct: false}
      - {text: "`tuple[int]`, qui couvre aussi les listes", correct: false}
      - {text: "`MutableSequence[int]`, de `collections.abc`", correct: false}
    answer: "`Sequence` promet l'indice et `len`, en lecture : listes, tuples et chaînes y entrent. `MutableSequence` exigerait de pouvoir modifier, ce qu'un tuple ne sait pas faire."
  - key: qcm-type-de-classe
    format: multiple-choice
    question: Comment annoter un paramètre qui reçoit une classe (`Chien`, `Chat`), et non une instance ?
    choices:
      - {text: "`type[Animal]`", correct: true}
      - {text: "`Animal`", correct: false}
      - {text: "`class[Animal]`", correct: false}
      - {text: "`object[Animal]`", correct: false}
    answer: "`type[Animal]` accepte `Animal` et ses sous-classes, par exemple pour une fabrique `creer(cls: type[Animal]) -> Animal`. `Animal` seul désigne une instance."
  - key: qcm-liste-de-paires
    format: multiple-choice
    question: "Quelle annotation décrit `[(\"a\", 1), (\"b\", 2)]` ?"
    choices:
      - {text: "`list[tuple[str, int]]`", correct: true}
      - {text: "`list[str, int]`", correct: false}
      - {text: "`tuple[list[str, int]]`", correct: false}
      - {text: "`list[tuple[str], tuple[int]]`", correct: false}
    answer: "Une liste dont chaque élément est un tuple `(str, int)`. `list` n'a qu'un paramètre de type."
  - key: trous-dict-occurrences
    format: fill-in
    question: |-
      Complète l'annotation d'un dictionnaire qui associe un mot à son nombre d'occurrences :
      ```python
      compte: dict[___, ___] = {}
      ```
    blanks: [[str], [int]]
    answer: "Le type des clés, puis celui des valeurs : `dict[str, int]`."
  - key: trous-tuple-libre
    format: fill-in
    question: |-
      Complète pour un tuple de flottants de longueur quelconque :
      ```python
      mesures: tuple[float, ___] = (1.0, 2.5, 4.0)
      ```
    blanks: [["..."]]
    answer: "`...` (Ellipsis) : autant d'éléments qu'on veut, tous du même type."
  - key: trous-retour-liste
    format: fill-in
    question: |-
      Complète le type du retour, une liste de chaînes :
      ```python
      def mots(texte: str) -> ___[str]:
          return texte.split()
      ```
    blanks: [[list]]
    answer: "`list[str]` : la collection native, paramétrée par le type de ses éléments."
  - key: trous-collections-abc
    format: fill-in
    question: |-
      Complète l'import du type abstrait `Iterable` :
      ```python
      from collections.___ import Iterable
      ```
    blanks: [[abc]]
    answer: "`collections.abc` regroupe les types abstraits : `Iterable`, `Sequence`, `Mapping`, `Callable`..."
