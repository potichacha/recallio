notion: annotations-differees
lesson: |-
  Jusqu'à Python 3.13, les annotations étaient **évaluées à la définition** de la fonction ou de la classe. Un nom
  pas encore défini levait une `NameError`, d'où les guillemets (`autre: "Noeud"`) ou
  `from __future__ import annotations`. Python 3.14 change la règle (PEP 649 et 749) : les annotations sont
  **évaluées à la demande**.

  ```python
  class Noeud:
      suivant: Noeud | None = None          # plus besoin de guillemets

      def fusionner(self, autre: Noeud) -> Noeud: ...

  def f(x: Inconnu) -> int:                 # aucune erreur à la définition
      return 1
  ```

  **Comment ça marche**

  - Le compilateur range les annotations dans une petite fonction, l'attribut `__annotate__`.
  - Le premier accès à `__annotations__` l'appelle, puis garde le résultat en cache. Une annotation qui a un effet de
    bord ne l'exécute donc qu'à ce moment, et une seule fois.
  - Un nom introuvable ne lève la `NameError` qu'à cet accès : `f.__annotations__` échoue, `f(5)` fonctionne.
  - Un module se charge plus vite : les annotations que personne ne lit ne coûtent rien.

  **Le module `annotationlib`** (nouveau en 3.14) lit les annotations sous trois formats :

  ```python
  from annotationlib import Format, get_annotations

  get_annotations(f, format=Format.VALUE)       # les valeurs : NameError ici
  get_annotations(f, format=Format.FORWARDREF)  # {'x': ForwardRef('Inconnu', ...), 'return': <class 'int'>}
  get_annotations(f, format=Format.STRING)      # {'x': 'Inconnu', 'return': 'int'}
  ```

  **Et `from __future__ import annotations` ?** (PEP 563) Il reste accepté en 3.14, et transforme toujours toutes les
  annotations en chaînes. Il n'est plus nécessaire pour les références en avant ; les bibliothèques qui lisent les
  annotations (dataclasses, pydantic) passent par `annotationlib` ou `typing.get_type_hints`.

  **Ce qui peut changer en migrant** : un code qui comptait sur un effet de bord d'une annotation à la définition, ou
  sur une `NameError` levée à ce moment.

  **En entretien** : « Depuis 3.14, les annotations ne sont plus évaluées à la définition : elles le sont au premier
  accès à `__annotations__`, puis mises en cache. Plus besoin de guillemets pour une référence en avant, et un import
  plus rapide. `annotationlib.get_annotations` les lit au format valeur, référence en avant ou chaîne. »
cards:
  - key: quand-evaluees
    format: course
    question: En Python 3.14, quand les annotations d'une fonction sont-elles évaluées ?
    choices:
      - {text: "Au premier accès à `__annotations__`, puis gardées en cache", correct: true}
      - {text: "À la définition de la fonction, comme dans les versions d'avant", correct: false}
      - {text: "À chaque appel de la fonction, avant d'exécuter son corps", correct: false}
      - {text: "Jamais : elles ne sont plus gardées que sous forme de chaînes", correct: false}
    answer: "C'est l'évaluation différée des PEP 649 et 749. L'appel de la fonction ne les évalue pas ; la lecture de `__annotations__` le fait, une fois."
  - key: attribut-annotate
    format: course
    question: "Que contient l'attribut `__annotate__` d'une fonction, en Python 3.14 ?"
    choices:
      - {text: "Une fonction qui calcule le dictionnaire des annotations", correct: true}
      - {text: "Le texte source des annotations, tel qu'il est écrit", correct: false}
      - {text: "Le dictionnaire des annotations, déjà calculé", correct: false}
      - {text: "Un booléen qui dit si la fonction est annotée", correct: false}
    answer: "Le compilateur génère cette fonction ; `__annotations__` l'appelle au premier accès. `annotationlib` peut l'appeler avec d'autres formats, pour obtenir des chaînes ou des références en avant."
  - key: reference-en-avant
    format: course
    question: "Que change Python 3.14 pour une méthode qui annote un paramètre avec sa propre classe, `def fusionner(self, autre: Noeud)` ?"
    choices:
      - {text: "Plus besoin de guillemets : le nom n'est cherché qu'à l'accès", correct: true}
      - {text: "Il faut maintenant écrire `Self` à la place du nom de la classe", correct: false}
      - {text: "Les guillemets autour de `Noeud` deviennent obligatoires", correct: false}
      - {text: "Il faut déclarer la classe avant, avec une ligne `class Noeud: ...`", correct: false}
    answer: "Pendant la définition de la classe, `Noeud` n'existe pas encore. Avant 3.14, il fallait `autre: \"Noeud\"` ; désormais, l'annotation n'est évaluée qu'une fois la classe créée."
  - key: format-string
    format: course
    question: "Que renvoie `annotationlib.get_annotations(f, format=Format.STRING)` ?"
    choices:
      - {text: "Les annotations sous forme de chaînes, sans les évaluer", correct: true}
      - {text: "Les annotations évaluées, puis converties par `str()`", correct: false}
      - {text: "La signature complète de `f`, en une seule chaîne", correct: false}
      - {text: "Une erreur si une annotation n'est pas déjà une chaîne", correct: false}
    answer: "Le format `STRING` rend le texte de chaque annotation, comme `{'x': 'Inconnu', 'return': 'int'}`, même si un nom est introuvable."
  - key: vf-nameerror-definition
    format: true-false
    question: "En Python 3.14, définir `def f(x: Inconnu): ...` lève une `NameError` si `Inconnu` n'existe pas."
    truth: false
    answer: "La définition passe, et `f` s'appelle normalement. La `NameError` n'arrive qu'en lisant `f.__annotations__`."
  - key: vf-pep
    format: true-false
    question: Les annotations différées de Python 3.14 viennent des PEP 649 et 749.
    truth: true
    answer: "La PEP 649 a proposé l'évaluation à la demande ; la PEP 749 en a précisé la mise en œuvre, dont le module `annotationlib`."
  - key: vf-future-garde
    format: true-false
    question: "`from __future__ import annotations` reste accepté en Python 3.14, et transforme toujours les annotations en chaînes."
    truth: true
    answer: "Avec lui, `f.__annotations__` vaut par exemple `{'n': 'int', 'return': 'list[int]'}`. Il n'est simplement plus utile pour les références en avant."
  - key: vf-forwardref
    format: true-false
    question: "`get_annotations(f, format=Format.FORWARDREF)` remplace un nom introuvable par un objet `ForwardRef`, au lieu de lever une erreur."
    truth: true
    answer: "Les noms connus sont évalués, les autres deviennent des `ForwardRef('Inconnu', ...)`. Utile pour une bibliothèque qui doit lire des annotations incomplètes."
  - key: qcm-module
    format: multiple-choice
    question: Quel module, nouveau en Python 3.14, lit les annotations sous plusieurs formats ?
    choices:
      - {text: "`annotationlib`", correct: true}
      - {text: "`typing.annotations`", correct: false}
      - {text: "`inspect.lazy`", correct: false}
      - {text: "`__future__`", correct: false}
    answer: "`annotationlib.get_annotations(obj, format=...)`, avec les formats `VALUE`, `FORWARDREF` et `STRING`."
  - key: qcm-avantage
    format: multiple-choice
    question: Quel avantage concret apportent les annotations différées ?
    choices:
      - {text: "Un import plus rapide : une annotation n'est calculée que si on la lit", correct: true}
      - {text: "Les annotations sont enfin vérifiées à l'exécution, à chaque appel", correct: false}
      - {text: "Les fonctions annotées s'exécutent plus vite qu'avant", correct: false}
      - {text: "mypy n'a plus besoin de lire le code source pour vérifier les types", correct: false}
    answer: "Les annotations que personne ne lit ne coûtent plus rien au chargement, et les références en avant fonctionnent sans guillemets. Rien n'est vérifié de plus."
  - key: qcm-format-value
    format: multiple-choice
    question: "Quel format de `get_annotations` lève une `NameError` sur un nom introuvable ?"
    choices:
      - {text: "`Format.VALUE`", correct: true}
      - {text: "`Format.STRING`", correct: false}
      - {text: "`Format.FORWARDREF`", correct: false}
      - {text: "`Format.SOURCE`", correct: false}
    answer: "`VALUE` évalue tout, comme `__annotations__`. `FORWARDREF` remplace l'inconnu par une référence, `STRING` rend le texte. `SOURCE` n'existe pas."
  - key: qcm-migration
    format: multiple-choice
    question: Quel code a pu changer de comportement en passant à Python 3.14 ?
    choices:
      - {text: "Un code qui comptait sur un effet de bord d'une annotation à la définition", correct: true}
      - {text: "Un code qui annote ses paramètres avec des types du module `typing`", correct: false}
      - {text: "Un code qui appelle des fonctions annotées depuis un autre module", correct: false}
      - {text: "Un code qui utilise `isinstance` avec des types simples", correct: false}
    answer: "Une annotation comme `x: enregistrer()` appelait `enregistrer` à la définition ; désormais, seulement à la lecture des annotations. Les autres codes ne voient pas de différence."
  - key: code-nom-inconnu-appel
    format: code-output
    question: |-
      Avec Python 3.14 :
      ```python
      def f(x: Inconnu) -> int:
          return x * 2

      print(f(5))
      ```
    answer: "`10` : l'annotation n'est pas évaluée, ni à la définition ni à l'appel. Avant 3.14, la définition aurait levé une `NameError`."
    check:
      output: "10"
    choices:
      - {text: "`10`", correct: true}
      - {text: "Une `NameError` : `Inconnu` n'est pas défini", correct: false}
      - {text: "`5`", correct: false}
      - {text: "Ça ne compile pas : une `SyntaxError`", correct: false}
  - key: code-acces-annotations
    format: code-output
    question: |-
      Avec Python 3.14 :
      ```python
      def f(x: Inconnu) -> int:
          return 1

      print("défini")
      print(f.__annotations__)
      ```
    answer: "`défini`, puis une `NameError` : la définition passe, mais lire `__annotations__` évalue l'annotation, et `Inconnu` n'existe pas."
    check:
      output: défini
      throws: NameError
    choices:
      - {text: "`défini`, puis une `NameError`", correct: true}
      - {text: "Une `NameError`, avant même `défini`", correct: false}
      - {text: "`défini`, puis `{'x': 'Inconnu', 'return': 'int'}`", correct: false}
      - {text: "`défini`, puis `{}`", correct: false}
  - key: code-format-string
    format: code-output
    question: |-
      ```python
      from annotationlib import Format, get_annotations

      def f(x: Inconnu) -> int:
          return 1

      print(get_annotations(f, format=Format.STRING))
      ```
    answer: "`{'x': 'Inconnu', 'return': 'int'}` : le format `STRING` rend le texte des annotations sans les évaluer."
    check:
      output: "{'x': 'Inconnu', 'return': 'int'}"
    choices:
      - {text: "`{'x': 'Inconnu', 'return': 'int'}`", correct: true}
      - {text: "`{'x': 'Inconnu', 'return': <class 'int'>}`", correct: false}
      - {text: "`{'return': 'int'}`", correct: false}
      - {text: "Une `NameError` : `Inconnu` n'est pas défini", correct: false}
  - key: code-evaluee-une-fois
    format: code-output
    question: |-
      ```python
      appels = 0

      def compter():
          global appels
          appels += 1
          return int

      def f(x: compter()) -> None: ...

      print(appels, end=" ")
      f.__annotations__
      f.__annotations__
      print(appels)
      ```
    answer: "`0 1` : l'annotation n'est pas évaluée à la définition, puis elle l'est au premier accès, et le résultat est gardé en cache."
    check:
      output: "0 1"
    choices:
      - {text: "`0 1`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`0 2`", correct: false}
      - {text: "`1 3`", correct: false}
