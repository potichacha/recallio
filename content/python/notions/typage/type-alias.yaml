notion: type-alias
lesson: |-
  Un **alias de type** donne un nom à un type long, pour le réutiliser et le lire plus facilement.

  ```python
  # Python 3.12 et après : l'instruction type
  type Coordonnees = tuple[float, float]
  type Matrice = list[list[float]]
  type Paire[T] = tuple[T, T]                       # un alias générique
  type Json = dict[str, Json] | list[Json] | str | int | float | bool | None   # récursif

  def distance(a: Coordonnees, b: Coordonnees) -> float: ...
  ```

  | Écriture | Version | Remarque |
  |---|---|---|
  | `Vecteur = list[float]` | toutes | une simple affectation, que le vérificateur devine être un alias |
  | `Vecteur: TypeAlias = list[float]` | 3.10 | l'intention est explicite (`from typing import TypeAlias`) |
  | `type Vecteur = list[float]` | 3.12 | la forme moderne |

  **L'instruction `type`** crée un objet `TypeAliasType`, dont la valeur n'est **évaluée qu'à la demande** (attribut
  `__value__`) : un alias peut donc se nommer lui-même, comme `Json` ci-dessus, ou nommer une classe définie plus
  bas. Cet objet n'est pas une classe : `isinstance(x, Vecteur)` lève une `TypeError`.

  **Un alias est interchangeable** avec le type qu'il nomme : partout où un `Vecteur` est attendu, une `list[float]`
  convient, et inversement.

  **`NewType` crée au contraire un type distinct**, pour le vérificateur seulement :

  ```python
  from typing import NewType

  ClientId = NewType("ClientId", int)
  CommandeId = NewType("CommandeId", int)

  def annuler(commande: CommandeId) -> None: ...

  annuler(ClientId(42))     # refusé par mypy : un ClientId n'est pas un CommandeId
  ```

  À l'exécution, `ClientId(42)` renvoie simplement l'entier `42` : aucun coût, aucun contrôle.

  **En entretien** : « Un alias nomme un type long : `type Matrice = list[list[float]]` depuis 3.12, évalué à la
  demande, donc récursif si besoin. Il reste interchangeable avec le type d'origine ; pour distinguer deux `int` qui
  ne doivent pas se mélanger, comme deux identifiants, j'utilise `NewType`. »
cards:
  - key: but-alias
    format: course
    question: "À quoi sert un alias de type comme `Coordonnees = tuple[float, float]` ?"
    choices:
      - {text: "À nommer un type long, pour le réutiliser et le lire facilement", correct: true}
      - {text: "À créer un type distinct de `tuple[float, float]` pour mypy", correct: false}
      - {text: "À convertir automatiquement les valeurs vers ce tuple", correct: false}
      - {text: "À refuser à l'exécution les tuples qui ne sont pas des coordonnées", correct: false}
    answer: "L'alias ne fait que nommer : `Coordonnees` et `tuple[float, float]` restent interchangeables. Pour un type vraiment distinct, c'est `NewType`."
  - key: version-instruction-type
    format: course
    question: "Depuis quelle version l'instruction `type Vecteur = list[float]` existe-t-elle ?"
    choices:
      - {text: "Python 3.12", correct: true}
      - {text: "Python 3.9", correct: false}
      - {text: "Python 3.10", correct: false}
      - {text: "Python 3.14", correct: false}
    answer: "La PEP 695 (Python 3.12) a ajouté l'instruction `type` et la syntaxe des génériques `def f[T]`. `TypeAlias` date de 3.10."
  - key: alias-ou-newtype
    format: course
    question: "Quelle différence entre `UserId = int` et `UserId = NewType(\"UserId\", int)` ?"
    choices:
      - {text: "Avec `NewType`, mypy refuse un `int` quelconque là où un `UserId` est attendu", correct: true}
      - {text: "Avec `NewType`, Python vérifie le type de la valeur à l'exécution", correct: false}
      - {text: "Aucune : les deux écritures créent des alias interchangeables", correct: false}
      - {text: "Avec l'alias simple, les valeurs de type `UserId` deviennent immuables", correct: false}
    answer: "L'alias est un autre nom pour `int` ; `NewType` crée un sous-type distinct pour le vérificateur. Il faut écrire `UserId(5)` pour en obtenir un, et cet appel renvoie simplement `5` à l'exécution."
  - key: alias-recursif
    format: course
    question: "Pourquoi l'instruction `type` permet-elle un alias récursif comme `type Arbre = list[Arbre] | int` ?"
    choices:
      - {text: "Sa valeur n'est évaluée qu'à la demande, quand le nom existe déjà", correct: true}
      - {text: "Python détecte la récursion et la remplace par `Any`", correct: false}
      - {text: "La valeur est gardée sous forme de chaîne, jamais évaluée", correct: false}
      - {text: "Elle crée d'abord une classe vide nommée `Arbre`", correct: false}
    answer: "L'objet `TypeAliasType` calcule sa valeur (`__value__`) au premier accès. Avec `Arbre = list[Arbre] | int`, la ligne lèverait une `NameError` : `Arbre` n'existe pas encore."
  - key: vf-interchangeable
    format: true-false
    question: "Un alias simple, `Vecteur = list[float]`, est interchangeable avec `list[float]` pour un vérificateur de types."
    truth: true
    answer: "Les deux désignent le même type. C'est tout l'intérêt, et la limite : un alias ne protège pas contre un mélange."
  - key: vf-isinstance-alias
    format: true-false
    question: "Un alias créé par `type Nombre = int | float` s'utilise directement dans `isinstance(x, Nombre)`."
    truth: false
    answer: "`Nombre` est un `TypeAliasType`, pas une classe : `isinstance` lève une `TypeError`. On écrit `isinstance(x, Nombre.__value__)` ou `isinstance(x, int | float)`."
  - key: vf-value
    format: true-false
    question: "Après `type Vecteur = list[float]`, `Vecteur.__value__` vaut `list[float]`."
    truth: true
    answer: "`__value__` est calculé au premier accès, puis gardé. C'est ce qui permet les alias récursifs."
  - key: vf-newtype-execution
    format: true-false
    question: "Avec `UserId = NewType(\"UserId\", int)`, `UserId(5)` renvoie simplement l'entier `5` à l'exécution."
    truth: true
    answer: "`NewType` ne crée aucune classe : l'appel renvoie son argument. La distinction n'existe que pour le vérificateur."
  - key: qcm-alias-generique
    format: multiple-choice
    question: Quelle ligne déclare un alias générique, une paire de deux valeurs du même type ?
    choices:
      - {text: "`type Paire[T] = tuple[T, T]`", correct: true}
      - {text: "`type Paire = tuple[T, T]`", correct: false}
      - {text: "`Paire[T] = tuple[T, T]`", correct: false}
      - {text: "`type Paire(T) = tuple[T, T]`", correct: false}
    answer: "Le paramètre de type se déclare entre crochets après le nom : `Paire[int]` vaut alors `tuple[int, int]`. Sans `[T]`, le nom `T` serait inconnu."
  - key: qcm-typealias-explicite
    format: multiple-choice
    question: Avant Python 3.12, comment dire explicitement qu'une affectation définit un alias de type ?
    choices:
      - {text: "`Vecteur: TypeAlias = list[float]`", correct: true}
      - {text: "`alias Vecteur = list[float]`", correct: false}
      - {text: "`Vecteur = TypeAlias(list[float])`", correct: false}
      - {text: "`Vecteur: type = list[float]`", correct: false}
    answer: "`TypeAlias`, importé de `typing` (Python 3.10), lève l'ambiguïté entre un alias et une variable qui contiendrait un type. L'instruction `type` l'a remplacé."
  - key: qcm-quand-newtype
    format: multiple-choice
    question: Dans quel cas `NewType` vaut-il mieux qu'un simple alias ?
    choices:
      - {text: "Pour distinguer deux `int`, un id client d'un id commande", correct: true}
      - {text: "Pour raccourcir une annotation longue et souvent répétée", correct: false}
      - {text: "Pour valider la valeur reçue au moment de l'exécution", correct: false}
      - {text: "Pour donner une valeur par défaut à tous les paramètres", correct: false}
    answer: "Deux identifiants entiers se mélangent facilement : `NewType` fait signaler l'erreur par le vérificateur. Pour raccourcir, un alias suffit ; pour valider, il faut du code."
  - key: qcm-type-objet-alias
    format: multiple-choice
    question: "Quel est le type de `Vecteur` après `type Vecteur = list[float]` ?"
    choices:
      - {text: "`TypeAliasType`", correct: true}
      - {text: "`list`", correct: false}
      - {text: "`type`", correct: false}
      - {text: "`GenericAlias`", correct: false}
    answer: "L'instruction `type` crée un objet `typing.TypeAliasType`, qui garde son nom et calcule sa valeur à la demande. `list[float]` seul est un `GenericAlias`."
  - key: trous-instruction-type
    format: fill-in
    question: |-
      Complète avec la syntaxe de Python 3.12 :
      ```python
      ___ Matrice = list[list[float]]
      ```
    blanks: [[type]]
    answer: "L'instruction `type` déclare un alias, évalué à la demande."
  - key: trous-typealias
    format: fill-in
    question: |-
      Complète avec l'écriture de Python 3.10 :
      ```python
      from typing import TypeAlias

      Matrice: ___ = list[list[float]]
      ```
    blanks: [[TypeAlias]]
    answer: "L'annotation `TypeAlias` dit que l'affectation définit un alias."
  - key: trous-newtype
    format: fill-in
    question: |-
      Complète pour créer un type distinct d'`int`, pour le vérificateur :
      ```python
      from typing import NewType

      ClientId = ___("ClientId", int)
      ```
    blanks: [[NewType]]
    answer: "`NewType(nom, type de base)` ; le nom en chaîne sert aux messages."
  - key: trous-alias-generique
    format: fill-in
    question: |-
      Complète l'alias générique :
      ```python
      type Paire[___] = tuple[T, T]
      ```
    blanks: [[T]]
    answer: "Le paramètre de type est déclaré entre crochets, puis utilisé dans la valeur."
