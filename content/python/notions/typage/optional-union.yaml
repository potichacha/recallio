notion: optional-union
lesson: |-
  Une **union** dit qu'une valeur peut avoir l'un de plusieurs types. Depuis Python 3.10, on l'écrit avec `|` :

  ```python
  def etiquette(code: int | str) -> str:
      return f"REF-{code}"

  def trouver(nom: str, annuaire: dict[str, str]) -> str | None:
      return annuaire.get(nom)          # None si le nom est absent
  ```

  | Écriture moderne (3.10) | Écriture ancienne (`typing`) |
  |---|---|
  | `int \| str` | `Union[int, str]` |
  | `int \| None` | `Optional[int]` |

  **`Optional` ne veut pas dire « facultatif »** : `Optional[int]` signifie seulement « un `int` ou `None` ». Pour
  qu'un paramètre puisse être omis, il lui faut une valeur par défaut :

  ```python
  def lister(limite: int | None = None) -> list[str]:
      ...
  ```

  **Traiter chaque cas.** Une fonction qui reçoit `int | str` doit fonctionner avec les deux ; un résultat
  `str | None` doit être testé avant usage. Après le test, le vérificateur **rétrécit** le type (*narrowing*) :

  ```python
  numero = trouver("Bob", annuaire)
  if numero is None:
      return "inconnu"
  return numero.replace(" ", "")       # ici, numero est un str
  ```

  On teste l'absence avec `is None`, pas avec `not valeur` : `0`, `""` et `[]` sont faux eux aussi.

  **À l'exécution**, `int | str` est un objet union, que `isinstance` accepte depuis 3.10 :
  `isinstance(x, int | str)`. L'ordre des membres ne compte pas : `int | str` et `str | int` sont égaux.

  **En entretien** : « `X | None`, autrefois `Optional[X]`, dit qu'une valeur peut manquer ; ce n'est pas une valeur
  par défaut, il faut écrire `= None`. On teste avec `is None`, et le vérificateur rétrécit le type après le test.
  Depuis 3.10, `|` remplace `Union`, aussi dans `isinstance`. »
cards:
  - key: sens-optional
    format: course
    question: "Que signifie l'annotation `Optional[int]` ?"
    choices:
      - {text: "La valeur est un entier, ou `None`", correct: true}
      - {text: "Le paramètre a une valeur par défaut", correct: false}
      - {text: "La valeur est un entier, ou n'existe pas", correct: false}
      - {text: "Le vérificateur peut ignorer ce type", correct: false}
    answer: "`Optional[int]` est exactement `int | None`. Le nom trompe : il ne rend pas le paramètre facultatif, il faut pour cela `= None`."
  - key: version-barre
    format: course
    question: "Depuis quelle version écrit-on `int | str` dans une annotation, sans `Union` ?"
    choices:
      - {text: "Python 3.10", correct: true}
      - {text: "Python 3.6", correct: false}
      - {text: "Python 3.8", correct: false}
      - {text: "Python 3.12", correct: false}
    answer: "La PEP 604 (Python 3.10) a ajouté l'opérateur `|` entre types. Avant, il fallait `Union[int, str]` et `Optional[int]`."
  - key: retrecissement
    format: course
    question: "`valeur` est annotée `int | None`. Après `if valeur is None: return`, quel type le vérificateur lui donne-t-il dans la suite ?"
    choices:
      - {text: "`int` : le test a écarté `None`", correct: true}
      - {text: "`int | None` : un test ne change rien", correct: false}
      - {text: "`None` : la dernière valeur testée", correct: false}
      - {text: "`object` : le type le plus large", correct: false}
    answer: "C'est le rétrécissement (*narrowing*) : après le `return`, `valeur` ne peut plus être `None`. `isinstance` rétrécit de la même façon."
  - key: retour-de-get
    format: course
    question: "Quel type de retour un vérificateur donne-t-il à `d.get(cle)`, pour `d: dict[str, int]` ?"
    choices:
      - {text: "`int | None`", correct: true}
      - {text: "`int`", correct: false}
      - {text: "`int | KeyError`", correct: false}
      - {text: "`str | None`", correct: false}
    answer: "`get` renvoie `None` quand la clé manque : il faut traiter ce cas. Avec une valeur par défaut, `d.get(cle, 0)` est un `int`."
  - key: vf-optional-defaut
    format: true-false
    question: "`Optional[str]` donne au paramètre la valeur par défaut `None`."
    truth: false
    answer: "`Optional[str]` décrit seulement le type, `str | None`. Sans `= None`, l'argument reste obligatoire."
  - key: vf-isinstance-union
    format: true-false
    question: "Depuis Python 3.10, `isinstance(x, int | str)` est accepté."
    truth: true
    answer: "L'union fonctionne aussi à l'exécution, comme le tuple `isinstance(x, (int, str))`."
  - key: vf-meme-type
    format: true-false
    question: "`int | None` et `Optional[int]` désignent le même type."
    truth: true
    answer: "Deux écritures du même type ; la première est la forme moderne. À l'exécution, `Optional[int] == (int | None)` vaut `True`."
  - key: vf-ordre-union
    format: true-false
    question: "`str | int` et `int | str` sont deux types différents."
    truth: false
    answer: "Une union n'a pas d'ordre : les deux sont égales, pour un vérificateur comme à l'exécution (`(int | str) == (str | int)` vaut `True`)."
  - key: qcm-parametre-facultatif
    format: multiple-choice
    question: Quelle signature déclare un paramètre `limite` qu'on peut omettre, entier ou `None` ?
    choices:
      - {text: "`def f(limite: int | None = None):`", correct: true}
      - {text: "`def f(limite: Optional[int]):`", correct: false}
      - {text: "`def f(limite: int = None | int):`", correct: false}
      - {text: "`def f(limite?: int):`", correct: false}
    answer: "Le type `int | None`, puis la valeur par défaut `= None`. Sans elle, `Optional[int]` laisse l'argument obligatoire ; `?` vient de TypeScript."
  - key: qcm-traiter-union
    format: multiple-choice
    question: "Une fonction reçoit `code: int | str`. Que doit faire son corps ?"
    choices:
      - {text: "Traiter les deux cas, par exemple avec `isinstance`", correct: true}
      - {text: "Rien : Python convertit selon l'annotation", correct: false}
      - {text: "Supposer un `int`, le premier type de l'union", correct: false}
      - {text: "Lever une erreur si ce n'est pas un `str`", correct: false}
    answer: "Le code doit marcher pour chaque membre de l'union : `\"REF-\" + code` échouerait avec un `int`. Une f-string ou un `isinstance` règle la question."
  - key: qcm-tester-absence
    format: multiple-choice
    question: "Comment tester qu'une valeur `int | None` est absente, sans la confondre avec `0` ?"
    choices:
      - {text: "`if valeur is None:`", correct: true}
      - {text: "`if not valeur:`", correct: false}
      - {text: "`if valeur == False:`", correct: false}
      - {text: "`if valeur in (None, 0):`", correct: false}
    answer: "`not valeur` est vrai aussi pour `0`, et `0 == False` vaut `True`. Seul `is None` isole l'absence."
  - key: qcm-ancienne-union
    format: multiple-choice
    question: "Comment écrivait-on `int | str` avant Python 3.10 ?"
    choices:
      - {text: "`Union[int, str]`", correct: true}
      - {text: "`Either[int, str]`", correct: false}
      - {text: "`Optional[int, str]`", correct: false}
      - {text: "`(int, str)`", correct: false}
    answer: "`Union`, du module `typing`. Le tuple `(int, str)` est ce qu'attend `isinstance`, pas une annotation."
  - key: trous-barre-none
    format: fill-in
    question: |-
      Complète : la fonction renvoie un entier, ou `None`.
      ```python
      def chercher(nom: str) -> int ___ None:
          ...
      ```
    blanks: [["|"]]
    answer: "`int | None` : l'union écrite avec `|`, depuis Python 3.10."
  - key: trous-defaut-none
    format: fill-in
    question: |-
      Complète pour qu'on puisse appeler `lister()` sans argument :
      ```python
      def lister(limite: int | None = ___) -> list[str]:
          ...
      ```
    blanks: [[None]]
    answer: "`= None` rend l'argument facultatif ; l'annotation seule ne le fait pas."
  - key: trous-is-none
    format: fill-in
    question: |-
      Complète pour traiter l'absence de prix, sans confondre avec un prix de 0 :
      ```python
      if prix ___ None:
          return "prix inconnu"
      ```
    blanks: [[is]]
    answer: "`is None` teste l'identité avec `None`, l'unique objet de son type."
  - key: trous-import-optional
    format: fill-in
    question: |-
      Complète l'import de l'ancienne écriture :
      ```python
      from typing import ___

      def f(x: Optional[int]) -> None: ...
      ```
    blanks: [[Optional]]
    answer: "`Optional` vient du module `typing` ; on écrit aujourd'hui `int | None`."
  - key: bug-none-non-teste
    format: bug-fix
    question: |-
      Ce script s'arrête sur « AttributeError: 'NoneType' object has no attribute 'replace' » :
      ```python
      def trouver(nom: str, annuaire: dict[str, str]) -> str | None:
          return annuaire.get(nom)

      numero = trouver("Bob", {"Ada": "06 01"})
      print(numero.replace(" ", ""))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Tester `if numero is not None:` avant le `replace`", correct: true}
      - {text: "Annoter le retour `-> str` au lieu de `-> str | None`", correct: false}
      - {text: "Remplacer `annuaire.get(nom)` par `annuaire.get(nom) or None`", correct: false}
      - {text: "Écrire `str(numero).replace(\" \", \"\")`", correct: false}
    answer: |-
      ```python
      numero = trouver("Bob", {"Ada": "06 01"})
      if numero is not None:
          print(numero.replace(" ", ""))
      ```
      L'annotation `str | None` annonçait l'absence possible : il faut la traiter. Changer l'annotation cacherait le
      problème, et `str(None)` donnerait le texte `"None"`.
  - key: bug-zero-pris-pour-absent
    format: bug-fix
    question: |-
      Ce script affiche `inconnu` pour un stock connu, mais vide :
      ```python
      def stock(quantite: int | None) -> str:
          if not quantite:
              return "inconnu"
          return f"{quantite} en stock"

      print(stock(0))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`if quantite is None:`", correct: true}
      - {text: "`if quantite == None or 0:`", correct: false}
      - {text: "`if not int(quantite):`", correct: false}
      - {text: "`if quantite is False:`", correct: false}
    answer: |-
      ```python
      def stock(quantite: int | None) -> str:
          if quantite is None:
              return "inconnu"
          return f"{quantite} en stock"
      ```
      `not 0` vaut `True` : le test confond zéro et l'absence. `is None` ne vise que `None`.
  - key: bug-optional-sans-defaut
    format: bug-fix
    question: |-
      Ce script s'arrête sur « TypeError: saluer() missing 1 required positional argument: 'nom' » :
      ```python
      from typing import Optional

      def saluer(nom: Optional[str]) -> str:
          return f"Bonjour {nom or 'toi'}"

      print(saluer())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`def saluer(nom: str | None = None) -> str:`", correct: true}
      - {text: "`def saluer(nom: Optional[str | None]) -> str:`", correct: false}
      - {text: "`def saluer(nom: Optional[str] | None) -> str:`", correct: false}
      - {text: "`def saluer(Optional[nom: str]) -> str:`", correct: false}
    answer: |-
      ```python
      def saluer(nom: str | None = None) -> str:
          return f"Bonjour {nom or 'toi'}"
      ```
      `Optional` ne décrit que le type : c'est `= None` qui rend l'argument facultatif.
  - key: bug-union-concatenation
    format: bug-fix
    question: |-
      Ce script s'arrête sur « TypeError: can only concatenate str (not "int") to str » :
      ```python
      def etiquette(code: int | str) -> str:
          return "REF-" + code

      print(etiquette(42))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`return \"REF-\" + str(code)`", correct: true}
      - {text: "`def etiquette(code: str | int) -> str:`", correct: false}
      - {text: "`return \"REF-\" + code if code else \"\"`", correct: false}
      - {text: "`def etiquette(code: int | str) -> int:`", correct: false}
    answer: |-
      ```python
      def etiquette(code: int | str) -> str:
          return "REF-" + str(code)        # ou f"REF-{code}"
      ```
      L'union promet un `int` ou un `str` : le corps doit marcher pour les deux. Inverser l'ordre de l'union ne change
      rien.
