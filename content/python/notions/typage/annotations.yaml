notion: annotations
lesson: |-
  Une **annotation de type** attache un type à un paramètre, à un retour ou à une variable. L'interpréteur la lit et
  la range, mais **ne la vérifie pas** à l'exécution : c'est une indication pour les outils et pour les lecteurs.

  ```python
  def prix_ttc(prix: float, taux: float = 0.2) -> float:
      return prix * (1 + taux)

  age: int = 36        # une variable annotée
  total: int           # une annotation seule : aucune variable n'est créée
  ```

  | Où | Syntaxe | Exemple |
  |---|---|---|
  | paramètre | `nom: type` | `def saluer(nom: str)` |
  | avec une valeur par défaut | `nom: type = valeur` | `def f(n: int = 10)` |
  | retour | `-> type` | `def est_pair(n: int) -> bool` |
  | fonction sans retour | `-> None` | `def journaliser(msg: str) -> None` |
  | variable | `nom: type = valeur` | `noms: list[str] = []` |

  **Rien n'est contrôlé à l'exécution** : `prix_ttc("10")` part quand même, et échoue plus loin. Pire, l'appel peut
  réussir avec un résultat absurde : `"ab" * 2` vaut `"abab"`. Pour un vrai contrôle, on teste avec `isinstance`, ou
  on confie la validation à une bibliothèque comme pydantic.

  **Où vont-elles ?** Dans l'attribut `__annotations__` de la fonction, de la classe ou du module :
  `prix_ttc.__annotations__` est un dictionnaire qui associe `'prix'`, `'taux'` et `'return'` à `float`. Depuis
  Python 3.14, il n'est calculé qu'au premier accès (voir la notion sur les annotations différées).

  **Qui s'en sert ?**

  - les **vérificateurs statiques** (mypy, pyright), qui lisent le code sans l'exécuter et signalent les
    incohérences ;
  - les **éditeurs**, pour la complétion et la navigation ;
  - des **bibliothèques, à l'exécution** : `dataclasses` crée `__init__` à partir des champs annotés, pydantic et
    FastAPI valident et convertissent les données d'après elles.

  **Le typage graduel** : on annote peu à peu, et le code non annoté reste valide. `typing.Any` désigne une valeur
  que le vérificateur ne contrôle pas ; `object` accepte aussi tout, mais n'autorise que les opérations communes à
  tous les objets. On n'annote pas `self` : les outils le devinent.

  Les **fichiers stub** (`.pyi`) ne contiennent que les signatures annotées d'un module : ils donnent des types à une
  bibliothèque écrite sans annotations (le dépôt typeshed en rassemble beaucoup).

  **En entretien** : « Les annotations documentent les types attendus, mais l'interpréteur ne les vérifie pas : elles
  sont rangées dans `__annotations__` et lues par mypy, les éditeurs ou des bibliothèques comme dataclasses et
  pydantic. On annote progressivement : c'est le typage graduel. Pour un contrôle à l'exécution, il faut `isinstance`
  ou une bibliothèque de validation. »
cards:
  - key: ou-sont-rangees
    format: course
    question: Où Python range-t-il les annotations d'une fonction ?
    choices:
      - {text: "Dans son attribut `__annotations__`, un dictionnaire", correct: true}
      - {text: "Dans sa docstring, à la suite de la signature", correct: false}
      - {text: "Dans un fichier `.pyi` créé à côté du module", correct: false}
      - {text: "Nulle part : l'interpréteur les efface au chargement", correct: false}
    answer: "`f.__annotations__` associe chaque paramètre annoté à son type, et la clé `'return'` au type du retour. Un fichier `.pyi` existe parfois, mais on l'écrit soi-même."
  - key: qui-les-utilise
    format: course
    question: Qui se sert des annotations de type, puisque l'interpréteur ne les vérifie pas ?
    choices:
      - {text: "Les vérificateurs statiques, les éditeurs, et des bibliothèques comme dataclasses", correct: true}
      - {text: "Le compilateur en bytecode, pour accélérer les appels de fonction", correct: false}
      - {text: "Le ramasse-miettes, pour réserver la bonne taille en mémoire", correct: false}
      - {text: "L'interpréteur lui-même, mais seulement lancé avec `python -O`", correct: false}
    answer: "mypy et pyright les lisent sans exécuter le code ; les éditeurs s'en servent pour la complétion ; `dataclasses`, pydantic ou FastAPI les lisent à l'exécution. Elles ne changent ni la vitesse ni la mémoire."
  - key: annotation-sans-valeur
    format: course
    question: "Que crée la ligne `total: int`, écrite seule dans une fonction ?"
    choices:
      - {text: "Une simple annotation : la variable `total` n'existe pas encore", correct: true}
      - {text: "Une variable `total`, initialisée à `0`", correct: false}
      - {text: "Une variable `total`, initialisée à `None`", correct: false}
      - {text: "Une erreur de syntaxe : une annotation exige une valeur", correct: false}
    answer: "Sans `=`, rien n'est affecté : lire `total` avant de lui donner une valeur lève une `NameError` (ou une `UnboundLocalError` dans une fonction). L'annotation sert seulement aux outils."
  - key: retour-rien
    format: course
    question: Comment annote-t-on une fonction qui ne renvoie rien ?
    choices:
      - {text: "`-> None`", correct: true}
      - {text: "`-> void`", correct: false}
      - {text: "`-> NoReturn`", correct: false}
      - {text: "`-> Null`", correct: false}
    answer: "Une fonction sans `return` renvoie `None` : on écrit `-> None`. `NoReturn` (ou `Never`) annonce une fonction qui ne rend jamais la main, parce qu'elle lève toujours une exception ou boucle sans fin. `void` vient du C et de Java."
  - key: vf-mauvais-type-execute
    format: true-false
    question: "`def double(n: int) -> int: return n * 2`, appelée avec `double(\"ab\")`, renvoie `\"abab\"` sans erreur."
    truth: true
    answer: "L'annotation `int` n'est pas contrôlée : `\"ab\" * 2` est une répétition de chaîne valide. Seul un vérificateur statique signalerait l'appel."
  - key: vf-dictionnaire-annotations
    format: true-false
    question: "`f.__annotations__` associe chaque paramètre annoté de `f` à son annotation, et la clé `'return'` au type du retour."
    truth: true
    answer: "Un paramètre non annoté n'y figure pas. Les outils et les bibliothèques lisent ce dictionnaire, ou passent par `typing.get_type_hints` et `annotationlib.get_annotations`."
  - key: vf-tout-annoter
    format: true-false
    question: Dès qu'un paramètre d'une fonction est annoté, tous ses autres paramètres doivent l'être aussi.
    truth: false
    answer: "On peut annoter un seul paramètre, ou seulement le retour : c'est le typage graduel. Un paramètre non annoté est traité comme `Any` par les vérificateurs."
  - key: vf-annoter-self
    format: true-false
    question: Les vérificateurs de types exigent qu'on annote `self` dans chaque méthode.
    truth: false
    answer: "Ils déduisent le type de `self` de la classe. On ne l'annote que dans des cas rares ; pour renvoyer l'instance, on écrit `-> Self` (module `typing`)."
  - key: qcm-parametre-defaut
    format: multiple-choice
    question: Quelle signature annote un paramètre `n` entier, de valeur par défaut 10 ?
    choices:
      - {text: "`def f(n: int = 10):`", correct: true}
      - {text: "`def f(int n = 10):`", correct: false}
      - {text: "`def f(n = 10: int):`", correct: false}
      - {text: "`def f(n -> int = 10):`", correct: false}
    answer: "Le nom, deux-points, le type, puis `= valeur`. `int n` est la syntaxe de Java ou du C ; `->` ne sert qu'au retour."
  - key: qcm-controle-execution
    format: multiple-choice
    question: Comment vérifier à l'exécution qu'un argument reçu est bien un entier ?
    choices:
      - {text: "Avec `isinstance(n, int)` dans le corps de la fonction", correct: true}
      - {text: "En annotant simplement le paramètre : `n: int`", correct: false}
      - {text: "En lançant le script avec `python -X typecheck`", correct: false}
      - {text: "En ajoutant l'instruction `assert n: int` au début", correct: false}
    answer: "Seul du code exécuté contrôle une valeur : `if not isinstance(n, int): raise TypeError(...)`. L'annotation n'est qu'une indication, et l'option `-X typecheck` n'existe pas."
  - key: qcm-bibliotheque-execution
    format: multiple-choice
    question: Lequel de ces outils lit les annotations pendant l'exécution du programme ?
    choices:
      - {text: "`dataclasses`, qui crée `__init__` à partir des champs annotés", correct: true}
      - {text: "mypy, qui contrôle les types de chaque appel au moment où il a lieu", correct: false}
      - {text: "pip, qui choisit les versions des dépendances d'après les types", correct: false}
      - {text: "Black, qui aligne les signatures selon leurs annotations", correct: false}
    answer: "`@dataclass` lit les annotations de la classe pour savoir quels champs créer. mypy les lit aussi, mais sans exécuter le code ; pip et Black ne s'en servent pas."
  - key: qcm-any-ou-object
    format: multiple-choice
    question: Quelle annotation demande au vérificateur d'accepter n'importe quelle valeur, et de ne contrôler aucun usage ?
    choices:
      - {text: "`Any`, du module `typing`", correct: true}
      - {text: "`object`, la classe de base de tout", correct: false}
      - {text: "`*`, comme dans un import", correct: false}
      - {text: "`None`, qui ne fixe aucun type", correct: false}
    answer: "`Any` désactive le contrôle : tout lui est permis. `object` accepte aussi toute valeur, mais n'autorise que les opérations communes à tous les objets : `x.upper()` y serait refusé."
  - key: trous-parametre-str
    format: fill-in
    question: |-
      Complète pour annoter le paramètre `nom` comme une chaîne :
      ```python
      def saluer(nom: ___) -> str:
          return f"Bonjour {nom}"
      ```
    blanks: [[str]]
    answer: "`str` : le type des chaînes."
  - key: trous-fleche-retour
    format: fill-in
    question: |-
      Complète l'annotation du retour :
      ```python
      def est_pair(n: int) ___ bool:
          return n % 2 == 0
      ```
    blanks: [["->"]]
    answer: "La flèche `->` précède le type du retour, avant les deux-points."
  - key: trous-attribut-annotations
    format: fill-in
    question: |-
      Complète pour afficher le dictionnaire des annotations de la fonction `aire` :
      ```python
      print(aire.___)
      ```
    blanks: [[__annotations__]]
    answer: "`__annotations__` associe chaque nom annoté à son type, et `'return'` au retour."
  - key: trous-retour-none
    format: fill-in
    question: |-
      Complète : cette fonction ne renvoie rien.
      ```python
      def journaliser(message: str) -> ___:
          print(message)
      ```
    blanks: [[None]]
    answer: "`-> None` : une fonction sans `return` renvoie `None`."
  - key: code-annotation-ignoree
    format: code-output
    question: |-
      ```python
      def double(n: int) -> int:
          return n * 2

      print(double("ha"))
      ```
    answer: "`haha` : l'annotation n'est pas vérifiée, et `\"ha\" * 2` répète la chaîne."
    check:
      output: haha
    choices:
      - {text: "`haha`", correct: true}
      - {text: "Une `TypeError` : `\"ha\"` n'est pas un `int`", correct: false}
      - {text: "`ha2`", correct: false}
      - {text: "`0`", correct: false}
  - key: code-cles-annotations
    format: code-output
    question: |-
      ```python
      def aire(l: float, h: float = 1.0) -> float:
          return l * h

      print(list(aire.__annotations__))
      ```
    answer: "`['l', 'h', 'return']` : les paramètres annotés, dans l'ordre, puis la clé `'return'` du type de retour."
    check:
      output: "['l', 'h', 'return']"
    choices:
      - {text: "`['l', 'h', 'return']`", correct: true}
      - {text: "`['l', 'h']`", correct: false}
      - {text: "`['float', 'float', 'float']`", correct: false}
      - {text: "`[]`", correct: false}
  - key: code-annotation-seule
    format: code-output
    question: |-
      ```python
      compteur: int

      try:
          print(compteur)
      except NameError:
          print("pas de variable")
      ```
    answer: "`pas de variable` : une annotation sans `=` ne crée pas la variable."
    check:
      output: pas de variable
    choices:
      - {text: "`pas de variable`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`None`", correct: false}
      - {text: "`<class 'int'>`", correct: false}
  - key: code-tuple-accepte
    format: code-output
    question: |-
      ```python
      def moyenne(notes: list[int]) -> float:
          return sum(notes) / len(notes)

      print(moyenne((10, 14)))
      ```
    answer: "`12.0` : un tuple passe à l'exécution, puisque rien n'est vérifié ; `/` donne toujours un flottant. mypy, lui, refuserait l'appel."
    check:
      output: "12.0"
    choices:
      - {text: "`12.0`", correct: true}
      - {text: "`12`", correct: false}
      - {text: "Une `TypeError` : un tuple n'est pas une `list`", correct: false}
      - {text: "`(10, 14)`", correct: false}
  - key: bug-chaine-multipliee
    format: bug-fix
    question: |-
      Ce script affiche `2.52.52.5` au lieu de `7.5` :
      ```python
      def total(prix: float, quantite: int) -> float:
          return prix * quantite

      print(total("2.5", 3))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(total(float(\"2.5\"), 3))`", correct: true}
      - {text: "`print(total(\"2.5\", 3.0))`", correct: false}
      - {text: "`return float(prix * quantite)`", correct: false}
      - {text: "`def total(prix: \"float\", quantite: int):`", correct: false}
    answer: |-
      ```python
      def total(prix: float, quantite: int) -> float:
          return prix * quantite

      print(total(float("2.5"), 3))
      ```
      L'annotation `float` ne convertit rien : `"2.5" * 3` répète la chaîne. On convertit la valeur avant l'appel.
      `"2.5" * 3.0` lèverait une `TypeError`, et `float("2.52.52.5")` une `ValueError`.
  - key: bug-comparaison-chaine
    format: bug-fix
    question: |-
      Ce script s'arrête sur « TypeError: '<' not supported between instances of 'str' and 'int' » :
      ```python
      def inscrire(age: int) -> str:
          if age < 18:
              return "refusé"
          return "accepté"

      print(inscrire("20"))
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`print(inscrire(int(\"20\")))`", correct: true}
      - {text: "`def inscrire(age: int = 18) -> str:`", correct: false}
      - {text: "`def inscrire(age: \"int\") -> str:`", correct: false}
      - {text: "`if str(age) < \"18\":`", correct: false}
    answer: |-
      ```python
      print(inscrire(int("20")))
      ```
      L'annotation n'a pas converti `"20"` : la comparaison d'une chaîne et d'un entier échoue. Comparer des chaînes
      (`"9" < "18"` vaut `False`) suivrait l'ordre alphabétique, pas celui des nombres.
  - key: bug-deux-points-au-lieu-de-egal
    format: bug-fix
    question: |-
      Ce script s'arrête sur « NameError: name 'nom' is not defined » :
      ```python
      nom: "Ada"
      print(nom)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "`nom: str = \"Ada\"`", correct: true}
      - {text: "`nom: str(\"Ada\")`", correct: false}
      - {text: "`nom: \"Ada\" = str`", correct: false}
      - {text: "`print(\"nom\")`", correct: false}
    answer: |-
      ```python
      nom: str = "Ada"
      print(nom)
      ```
      `nom: "Ada"` n'est qu'une annotation, dont le « type » serait la chaîne `"Ada"` : aucune valeur n'est affectée.
      C'est `=` qui affecte. `nom: "Ada" = str` affecterait la classe `str` elle-même.
  - key: bug-return-oublie
    format: bug-fix
    question: |-
      Ce script s'arrête sur « TypeError: unsupported operand type(s) for +: 'NoneType' and 'int' » :
      ```python
      def carre(n: int) -> int:
          n * n

      print(carre(4) + 1)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Écrire `return n * n` dans le corps", correct: true}
      - {text: "Annoter le retour `-> int | None`", correct: false}
      - {text: "Écrire `print(int(carre(4)) + 1)`", correct: false}
      - {text: "Annoter le retour `-> \"int\"`", correct: false}
    answer: |-
      ```python
      def carre(n: int) -> int:
          return n * n
      ```
      Annoncer `-> int` ne renvoie rien : sans `return`, la fonction renvoie `None`. mypy l'aurait signalé (« Missing
      return statement »).
  - key: def-annotation
    format: definition
    question: Qu'est-ce qu'une annotation de type, en Python ?
    choices:
      - {text: "Une indication de type attachée à un nom, que l'interpréteur ne vérifie pas", correct: true}
      - {text: "Une déclaration qui fixe le type d'une variable pour toute sa durée de vie", correct: false}
      - {text: "Un commentaire spécial que l'interpréteur supprime au chargement du module", correct: false}
      - {text: "Une conversion automatique de l'argument reçu vers le type indiqué", correct: false}
    answer: "Elle documente le type attendu d'un paramètre, d'un retour ou d'une variable. Elle est gardée dans `__annotations__`, mais rien ne la vérifie ni ne convertit les valeurs à l'exécution."
  - key: def-verificateur-statique
    format: definition
    question: Qu'est-ce qu'un vérificateur de types statique, comme mypy ou pyright ?
    choices:
      - {text: "Un outil qui lit le code sans l'exécuter et signale les incohérences de types", correct: true}
      - {text: "Un module qui contrôle le type de chaque argument au moment de l'appel", correct: false}
      - {text: "Un interpréteur plus strict, qui refuse de lancer un code mal annoté", correct: false}
      - {text: "Un formateur qui ajoute les annotations manquantes dans le code source", correct: false}
    answer: "Il analyse le code comme le ferait un compilateur : un appel `double(\"ab\")` à une fonction annotée `n: int` est signalé avant même l'exécution. On le lance à la main ou dans la CI."
  - key: def-typage-graduel
    format: definition
    question: Que désigne le « typage graduel » ?
    choices:
      - {text: "La possibilité d'annoter un code peu à peu, le code non annoté restant valide", correct: true}
      - {text: "Le fait qu'une variable change de type au fil de l'exécution du programme", correct: false}
      - {text: "Des annotations rendues obligatoires version après version de Python", correct: false}
      - {text: "Des types vérifiés de plus en plus strictement à mesure que le code s'exécute", correct: false}
    answer: "Annotations et code non annoté cohabitent ; ce qui n'est pas annoté est traité comme `Any`. On peut ainsi typer un projet existant module par module."
  - key: def-stub
    format: definition
    question: Qu'est-ce qu'un fichier stub `.pyi` ?
    choices:
      - {text: "Un fichier qui ne contient que les signatures annotées d'un module", correct: true}
      - {text: "Le module compilé en bytecode par l'interpréteur, à côté du `.py`", correct: false}
      - {text: "Le fichier de configuration lu par mypy au démarrage", correct: false}
      - {text: "Un module de tests généré à partir des annotations", correct: false}
    answer: "Un stub décrit les types d'un module sans son code (`def get(url: str) -> Response: ...`). Il sert à typer une bibliothèque écrite sans annotations ; le bytecode, lui, va dans les fichiers `.pyc`."
