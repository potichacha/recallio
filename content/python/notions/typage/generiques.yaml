notion: generiques
lesson: |-
  Une fonction **générique** garde le lien entre les types de ses entrées et de sa sortie. `def premier(xs: list) ->
  object` perd l'information ; avec un **paramètre de type** `T`, le vérificateur sait que `premier([1, 2])` est un
  `int` et `premier(["a"])` un `str`.

  ```python
  # Python 3.12 et après (PEP 695)
  def premier[T](elements: list[T]) -> T:
      return elements[0]

  class Pile[T]:
      def __init__(self) -> None:
          self._elements: list[T] = []

      def empiler(self, element: T) -> None:
          self._elements.append(element)

      def depiler(self) -> T:
          return self._elements.pop()

  pile: Pile[int] = Pile()
  pile.empiler(3)
  pile.empiler("trois")    # refusé par le vérificateur
  ```

  **L'ancienne syntaxe**, encore très répandue :

  ```python
  from typing import Generic, TypeVar

  T = TypeVar("T")

  def premier(elements: list[T]) -> T: ...

  class Pile(Generic[T]): ...
  ```

  | Déclaration | Sens |
  |---|---|
  | `[T]` | n'importe quel type, le même partout où `T` apparaît |
  | `[T: Animal]` | une **borne** : `Animal` ou une de ses sous-classes |
  | `[T: (str, bytes)]` | des **contraintes** : soit `str`, soit `bytes`, sans mélange |
  | `[T = int]` | une valeur par défaut (Python 3.13) |
  | `[**P]`, `[*Ts]` | des paramètres de fonction (`ParamSpec`), un nombre variable de types (`TypeVarTuple`) |

  **Portée** : avec la syntaxe de 3.12, `T` n'existe que dans la fonction ou la classe qui le déclare (on le retrouve
  dans `premier.__type_params__`) ; avec `TypeVar`, c'est une variable du module. La variance (covariance,
  contravariance) est déduite automatiquement par la nouvelle syntaxe.

  **Rien n'est vérifié à l'exécution** : `pile.empiler("trois")` fonctionne. Les génériques ne servent qu'aux
  vérificateurs.

  **En entretien** : « Un paramètre de type relie les types des entrées et de la sortie, là où `Any` perdrait
  l'information. Depuis 3.12, on écrit `def premier[T](xs: list[T]) -> T` et `class Pile[T]`, sans `TypeVar` ni
  `Generic` ; une borne `[T: Animal]` limite `T` à une famille de classes. »
cards:
  - key: pourquoi-pas-any
    format: course
    question: "Pourquoi annoter `def premier(xs: list[T]) -> T` plutôt que `def premier(xs: list[Any]) -> Any` ?"
    choices:
      - {text: "Le vérificateur relie le type du retour à celui des éléments reçus", correct: true}
      - {text: "Le code s'exécute plus vite avec un paramètre de type `T`", correct: false}
      - {text: "`Any` est interdit comme type de retour d'une fonction", correct: false}
      - {text: "`T` convertit le retour vers le type des éléments de la liste", correct: false}
    answer: "Avec `T`, `premier([1, 2])` est un `int` pour le vérificateur, qui signalera `premier([1, 2]).upper()`. Avec `Any`, tout passe, y compris les erreurs."
  - key: version-syntaxe-crochets
    format: course
    question: "Depuis quelle version écrit-on `def premier[T](xs: list[T]) -> T:` ?"
    choices:
      - {text: "Python 3.12", correct: true}
      - {text: "Python 3.9", correct: false}
      - {text: "Python 3.10", correct: false}
      - {text: "Python 3.14", correct: false}
    answer: "La PEP 695 (3.12) a ajouté les paramètres de type entre crochets, pour les fonctions, les classes et l'instruction `type`. Avant, il fallait `TypeVar`."
  - key: borne
    format: course
    question: "Que veut dire `[T: Animal]` dans `def soigner[T: Animal](patient: T) -> T:` ?"
    choices:
      - {text: "`T` peut être `Animal` ou n'importe laquelle de ses sous-classes", correct: true}
      - {text: "`T` vaut toujours exactement `Animal`, sans sous-classe", correct: false}
      - {text: "`T` est un simple alias de `Animal`, déclaré localement", correct: false}
      - {text: "La fonction convertit son argument en `Animal` à l'appel", correct: false}
    answer: "C'est une borne supérieure : `soigner(Chien())` renvoie un `Chien` pour le vérificateur, et `soigner(42)` est refusé. Dans le corps, on peut appeler les méthodes d'`Animal`."
  - key: contraintes
    format: course
    question: "Que veut dire `[T: (str, bytes)]` ?"
    choices:
      - {text: "`T` est soit `str`, soit `bytes`, sans mélange des deux", correct: true}
      - {text: "`T` est un tuple qui contient un `str` puis un `bytes`", correct: false}
      - {text: "`T` est n'importe quelle sous-classe de `str`", correct: false}
      - {text: "`T` vaut `str` par défaut, et `bytes` sinon", correct: false}
    answer: "Un tuple après les deux-points donne des contraintes : `def concat[T: (str, bytes)](a: T, b: T) -> T` accepte deux `str` ou deux `bytes`, mais refuse un `str` avec un `bytes`."
  - key: vf-classe-sans-generic
    format: true-false
    question: "Depuis Python 3.12, `class Pile[T]:` déclare une classe générique sans hériter de `Generic`."
    truth: true
    answer: "La nouvelle syntaxe s'en charge : la classe reçoit `__type_params__`. Avant 3.12, on écrivait `class Pile(Generic[T])`."
  - key: vf-retour-verifie
    format: true-false
    question: "Avec `def premier[T](xs: list[T]) -> T`, Python vérifie à l'exécution que le retour a le type des éléments."
    truth: false
    answer: "Comme toutes les annotations, les paramètres de type ne servent qu'aux vérificateurs : rien n'est contrôlé à l'exécution."
  - key: vf-type-params
    format: true-false
    question: "`premier.__type_params__` contient les paramètres de type déclarés par `def premier[T]`."
    truth: true
    answer: "Ici, un tuple d'un seul `TypeVar` : `(T,)`. Les classes génériques ont le même attribut."
  - key: vf-portee-module
    format: true-false
    question: "Avec la syntaxe de 3.12, le `T` de `def premier[T]` devient une variable globale du module."
    truth: false
    answer: "Il n'existe que dans la fonction : `print(T)` au niveau du module lève une `NameError`. Avec l'ancienne syntaxe, `T = TypeVar(\"T\")` était bien une variable du module."
  - key: qcm-ancienne-syntaxe
    format: multiple-choice
    question: Avant Python 3.12, comment déclarait-on le paramètre de type `T` ?
    choices:
      - {text: "`T = TypeVar(\"T\")`", correct: true}
      - {text: "`T = Generic(\"T\")`", correct: false}
      - {text: "`T = type(\"T\")`", correct: false}
      - {text: "`T: TypeParam`", correct: false}
    answer: "`TypeVar`, du module `typing`, crée la variable de type ; `Generic[T]` sert de classe de base aux classes génériques."
  - key: qcm-classe-generique
    format: multiple-choice
    question: Comment déclare-t-on une pile générique en Python 3.12 ?
    choices:
      - {text: "`class Pile[T]:`", correct: true}
      - {text: "`class Pile<T>:`", correct: false}
      - {text: "`class Pile(T):`", correct: false}
      - {text: "`generic class Pile[T]:`", correct: false}
    answer: "Des crochets après le nom, comme pour les fonctions. `<T>` est la syntaxe de Java et de TypeScript ; `Pile(T)` ferait hériter de `T`."
  - key: qcm-meme-type
    format: multiple-choice
    question: Quelle signature relie les types de deux arguments et du retour, pour renvoyer l'un des deux ?
    choices:
      - {text: "`def choisir[T](a: T, b: T) -> T:`", correct: true}
      - {text: "`def choisir(a: Any, b: Any) -> Any:`", correct: false}
      - {text: "`def choisir[T, U](a: T, b: U) -> T:`", correct: false}
      - {text: "`def choisir(a: object, b: object) -> object:`", correct: false}
    answer: "Un seul `T` pour les deux arguments et le retour. Avec `Any` ou `object`, le lien disparaît ; avec `T` et `U`, renvoyer `b` serait refusé."
  - key: qcm-instancier
    format: multiple-choice
    question: "Avec `class Pile[T]`, comment annotes-tu une pile d'entiers ?"
    choices:
      - {text: "`pile: Pile[int] = Pile()`", correct: true}
      - {text: "`pile: Pile(int) = Pile()`", correct: false}
      - {text: "`pile: Pile<int> = Pile()`", correct: false}
      - {text: "`pile: Pile = Pile[int]`", correct: false}
    answer: "On paramètre la classe entre crochets dans l'annotation. Le vérificateur déduit alors que `pile.depiler()` est un `int`."
  - key: trous-fonction-generique
    format: fill-in
    question: |-
      Complète avec la syntaxe de Python 3.12 :
      ```python
      def dernier___(elements: list[T]) -> T:
          return elements[-1]
      ```
    blanks: [["[T]"]]
    answer: "Le paramètre de type se déclare entre crochets, entre le nom et les parenthèses."
  - key: trous-typevar
    format: fill-in
    question: |-
      Complète avec l'ancienne syntaxe :
      ```python
      from typing import TypeVar

      T = ___("T")
      ```
    blanks: [[TypeVar]]
    answer: "`TypeVar(\"T\")` crée la variable de type ; le nom passé doit être celui de la variable."
  - key: trous-classe-boite
    format: fill-in
    question: |-
      Complète la classe générique :
      ```python
      class Boite[___]:
          def __init__(self, contenu: T) -> None:
              self.contenu = contenu
      ```
    blanks: [[T]]
    answer: "`class Boite[T]` : `T` est visible dans toute la classe."
  - key: trous-borne
    format: fill-in
    question: |-
      Complète pour limiter `T` à `Animal` et à ses sous-classes :
      ```python
      def soigner[T___ Animal](patient: T) -> T:
          ...
      ```
    blanks: [[":"]]
    answer: "Les deux-points introduisent la borne : `[T: Animal]`."
