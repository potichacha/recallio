      - {id: fixtures, title: "Les fixtures : préparer et nettoyer, leur portée, yield", level: intermediate, priority: 1, requires: [pytest-bases], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
