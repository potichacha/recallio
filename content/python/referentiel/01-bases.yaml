# Référentiel Python (ADR 0025, 0026, 0062) : l'inventaire de toutes les notions.
# Le sujet vise Python 3.14. Les « qu'affiche ce code ? », les exercices (pytest) et les pages du Tour s'exécutent dans
# le bac à sable Python (ADR 0062).
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats.
domain: bases
title: Bases du langage
position: 10
chapters:
  - id: premiers-pas
    title: Premiers pas
    notions:
      - {id: python-presentation, title: "Ce qu'est Python : interprété, typage dynamique, CPython, la philosophie du langage", level: beginner, priority: 1, formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: hello-world, title: "Le premier programme : print, un script, l'interpréteur interactif", level: beginner, priority: 1, requires: [python-presentation], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: indentation-blocs, title: "L'indentation fait les blocs : deux-points, quatre espaces, IndentationError", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: commentaires-docstrings, title: "Les commentaires et les docstrings", level: beginner, priority: 2, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in], complete: true}
      - {id: pep8-style, title: "Le style PEP 8 : snake_case, longueur des lignes, espaces", level: beginner, priority: 2, requires: [hello-world], formats: [course, true-false, multiple-choice, bug-fix], complete: true}
  - id: variables-types
    title: Variables et types
    notions:
      - {id: variables-noms, title: "Une variable est un nom lié à un objet : affectation, réaffectation, affectation multiple", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: typage-dynamique, title: "Un typage dynamique et fort : type(), isinstance(), pas de conversion implicite", level: beginner, priority: 1, requires: [variables-noms], formats: [course, true-false, multiple-choice, code-output, bug-fix, definition], complete: true}
      - {id: nombres, title: "Les nombres : int de précision illimitée, float, les opérateurs / // % **", level: beginner, priority: 1, requires: [variables-noms], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: flottants-precision, title: "La précision des flottants : 0.1 + 0.2, round, math.isclose, Decimal", level: intermediate, priority: 2, requires: [nombres], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario], complete: true}
      - {id: booleens, title: "Les booléens, la valeur de vérité des objets, and, or et not", level: beginner, priority: 1, requires: [variables-noms], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: none, title: "None : l'absence de valeur, et le test is None", level: beginner, priority: 1, requires: [variables-noms], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: chaines-bases, title: "Les chaînes : guillemets, immuabilité, indices, len, concaténation", level: beginner, priority: 1, requires: [variables-noms], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: f-strings, title: "Les f-strings : interpolation, format des nombres, !r et =", level: beginner, priority: 1, requires: [chaines-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: methodes-chaines, title: "Les méthodes des chaînes : split, join, strip, replace, find, startswith", level: beginner, priority: 1, requires: [chaines-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: chaines-octets, title: "str et bytes : encoder et décoder en UTF-8", level: intermediate, priority: 2, requires: [chaines-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: conversions, title: "Convertir : int(), float(), str(), bool(), et ValueError", level: beginner, priority: 1, requires: [nombres, chaines-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: formatage-ancien, title: "Le formatage avec % et str.format, qu'on lit encore", level: intermediate, priority: 3, requires: [f-strings], formats: [course, true-false, multiple-choice, code-output], complete: true}
      - {id: entree-sortie-console, title: "print en détail (sep, end) et input()", level: beginner, priority: 2, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, code-output], complete: true}
  - id: controle-flux
    title: Contrôle de flux
    notions:
      - {id: if-elif-else, title: "if, elif, else et l'expression conditionnelle (a if condition else b)", level: beginner, priority: 1, requires: [booleens], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: comparaisons-chainees, title: "Les comparaisons enchaînées (0 < x < 10) et l'opérateur in", level: beginner, priority: 2, requires: [if-elif-else], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: boucle-while, title: "La boucle while, break et continue", level: beginner, priority: 1, requires: [if-elif-else], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: boucle-for-range, title: "La boucle for sur un itérable, et range", level: beginner, priority: 1, requires: [if-elif-else], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: else-boucles, title: "La clause else d'une boucle for ou while", level: intermediate, priority: 3, requires: [boucle-for-range, boucle-while], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: match-case, title: "match et case : le filtrage par motifs", level: intermediate, priority: 2, requires: [if-elif-else], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: walrus, title: "L'opérateur morse := (l'expression d'affectation)", level: intermediate, priority: 3, requires: [boucle-while], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: pass-ellipsis, title: "pass et ... : l'instruction qui ne fait rien", level: beginner, priority: 3, requires: [if-elif-else], formats: [course, true-false, multiple-choice, fill-in], complete: true}
  - id: fonctions
    title: Fonctions
    notions:
      - {id: fonctions-bases, title: "Définir une fonction : def, return, et None quand rien n'est renvoyé", level: beginner, priority: 1, requires: [variables-noms], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: parametres, title: "Les paramètres : positionnels, nommés, valeurs par défaut", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: args-kwargs, title: "*args et **kwargs : recevoir et transmettre des arguments", level: intermediate, priority: 1, requires: [parametres], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: parametres-speciaux, title: "Les paramètres positionnels seuls (/) et nommés seuls (*)", level: intermediate, priority: 3, requires: [parametres], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: defaut-mutable, title: "Le piège de la valeur par défaut mutable (def f(x=[]))", level: intermediate, priority: 1, requires: [parametres], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario], complete: true}
      - {id: portee-legb, title: "La portée des noms : la règle LEGB, global, nonlocal, UnboundLocalError", level: intermediate, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: lambda, title: "Les fonctions lambda", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: passage-arguments, title: "Le passage des arguments : une référence d'objet, mutable ou non", level: intermediate, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario], complete: true}
      - {id: retours-multiples, title: "Renvoyer plusieurs valeurs : un tuple, qu'on déballe", level: beginner, priority: 2, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output], complete: true}
      - {id: recursion, title: "La récursion, et la limite de profondeur (RecursionError)", level: intermediate, priority: 3, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
