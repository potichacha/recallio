# Référentiel Python : la programmation orientée objet.
domain: poo
title: La programmation orientée objet
position: 40
chapters:
  - id: classes
    title: Classes et objets
    notions:
      - {id: classes-bases, title: "Définir une classe : __init__, self, les attributs d'instance", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: repr-str, title: "__repr__ et __str__ : représenter un objet", level: beginner, priority: 1, requires: [classes-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: attributs-classe, title: "Attribut de classe ou d'instance, et le piège d'une liste partagée", level: intermediate, priority: 1, requires: [classes-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario], complete: true}
      - {id: methodes-classe-statiques, title: "@classmethod et @staticmethod, et les constructeurs alternatifs", level: intermediate, priority: 1, requires: [classes-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: property, title: "@property : des attributs calculés et contrôlés", level: intermediate, priority: 1, requires: [classes-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: encapsulation, title: "L'encapsulation par convention : _protege, __prive et la transformation des noms", level: intermediate, priority: 2, requires: [classes-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
  - id: heritage-polymorphisme
    title: Héritage et polymorphisme
    notions:
      - {id: heritage, title: "L'héritage, la redéfinition et super()", level: intermediate, priority: 1, requires: [classes-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: duck-typing, title: "Le duck typing : un comportement plutôt qu'un type", level: intermediate, priority: 1, requires: [classes-bases], formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: abc, title: "Les classes abstraites : abc.ABC et @abstractmethod", level: intermediate, priority: 2, requires: [heritage], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: composition, title: "Composition ou héritage", level: intermediate, priority: 2, requires: [heritage], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: mro, title: "L'héritage multiple et l'ordre de résolution des méthodes (MRO)", level: expert, priority: 2, requires: [heritage], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: mixins, title: "Les mixins : ajouter un comportement par héritage multiple", level: expert, priority: 3, requires: [mro], formats: [course, true-false, multiple-choice, code-output, scenario], complete: true}
  - id: dunder
    title: Méthodes spéciales
    notions:
      - {id: methodes-speciales, title: "Les méthodes spéciales : __len__, __getitem__, __contains__, __iter__", level: intermediate, priority: 1, requires: [classes-bases, iterables-iterateurs], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: egalite-hachage, title: "__eq__ et __hash__ : l'égalité, et les objets dans un set ou comme clé", level: intermediate, priority: 1, requires: [repr-str, hachabilite], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario], complete: true}
      - {id: surcharge-operateurs, title: "Surcharger les opérateurs : __add__, __lt__, functools.total_ordering", level: intermediate, priority: 2, requires: [methodes-speciales], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: appelables, title: "__call__ : des objets qu'on appelle comme des fonctions", level: expert, priority: 3, requires: [methodes-speciales], formats: [course, true-false, multiple-choice, code-output], complete: true}
      - {id: new-init, title: "__new__ et __init__ : créer, puis initialiser", level: expert, priority: 4, requires: [classes-bases], formats: [course, true-false, multiple-choice, code-output], complete: true}
  - id: classes-modernes
    title: Classes modernes
    notions:
      - {id: dataclasses, title: "Les dataclasses : champs, valeurs par défaut, frozen, field(default_factory)", level: intermediate, priority: 1, requires: [classes-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: enum, title: "Les énumérations : Enum, auto, StrEnum", level: intermediate, priority: 2, requires: [classes-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: choisir-structure-donnees, title: "dataclass, namedtuple, TypedDict ou dict : choisir", level: intermediate, priority: 3, requires: [dataclasses, namedtuple], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: slots, title: "__slots__ : moins de mémoire, pas d'attribut imprévu", level: expert, priority: 3, requires: [classes-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: descripteurs, title: "Les descripteurs : __get__ et __set__, ce qu'il y a sous property", level: expert, priority: 4, requires: [property], formats: [course, true-false, multiple-choice, code-output, definition], complete: true}
      - {id: metaclasses, title: "Les métaclasses, et __init_subclass__ qui les remplace souvent", level: expert, priority: 4, requires: [heritage], formats: [course, true-false, multiple-choice, code-output, definition], complete: true}
