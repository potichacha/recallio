    notions:
      - {id: listes, title: "Les listes : indexer, modifier, append, extend, insert, pop, remove", level: beginner, priority: 1, requires: [boucle-for-range], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
