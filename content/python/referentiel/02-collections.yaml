      - {id: tuples, title: "Les tuples : immuables, le tuple d'un élément (1,), quand les préférer", level: beginner, priority: 1, requires: [listes], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: deballage, title: "Le déballage : a, b = b, a ; *reste ; enumerate et zip", level: beginner, priority: 1, requires: [tuples], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
