statement: |-
  Écris `relancer(factures, envoyer)`, dans `relances.py`, qui relance les clients dont une facture est en retard.

  - Chaque facture est un dictionnaire : `{"client": "ada", "montant": 120, "echeance": date(2026, 3, 1), "payee": False}`.
  - Une facture est en retard si elle n'est pas payée et que son échéance est **strictement** passée : une échéance
    égale à la date du jour n'est pas encore en retard.
  - Pour chacune, dans l'ordre de la liste, appelle `envoyer(client, message)`, avec le message
    `"Rappel : facture de 120 € échue le 2026-03-01"` (la date au format `AAAA-MM-JJ`, celui de `date.isoformat()`).
  - `envoyer` peut lever une `ConnectionError` : la relance de ce client est perdue, mais les suivantes partent quand
    même.
  - La fonction renvoie le nombre de relances envoyées avec succès.

  Lis la date du jour en appelant `aujourd_hui()`, déjà écrite dans le module, jamais `datetime.date.today()`
  directement : les tests la remplacent avec `patch("relances.aujourd_hui")` pour fixer la date. Ils remplacent aussi
  `envoyer` par un `Mock`, dont ils vérifient les appels.
explanation: |-
  La fonction ne connaît ni l'heure réelle ni le serveur de courriel : ce sont ses deux frontières, et le test les
  remplace.

  - `envoyer` est **injecté** en paramètre : le test passe un `Mock`, puis vérifie ses appels avec
    `assert_called_once_with`, `call_args_list` ou `assert_not_called`. Un `side_effect` qui contient une
    `ConnectionError` simule une panne pour un seul appel.
  - La date passe par `aujourd_hui()`, une fonction du module. Le test la remplace par
    `patch("relances.aujourd_hui", return_value=...)` : on patche le nom là où le code le cherche. Appeler
    `datetime.date.today()` directement échapperait au test, et `datetime.date.today` ne peut pas être patché (c'est
    un attribut d'un type immuable).

  On lit la date une fois, avant la boucle. La comparaison `facture["echeance"] < jour` rend « strictement passée » ;
  un `try` / `except ConnectionError` autour de l'envoi seul garde la boucle en vie, et le compteur n'augmente que si
  l'envoi a réussi.
