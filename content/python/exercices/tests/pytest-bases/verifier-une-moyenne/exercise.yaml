statement: |-
  Pour une fois, c'est toi qui écris les vérifications. Complète `verifier_moyenne(moyenne)`, dans
  `verifications.py` : elle reçoit une fonction `moyenne(notes)` et la vérifie avec des `assert`, comme le ferait un
  test pytest. Voici la spécification de `moyenne` :

  - elle renvoie la moyenne arithmétique des notes : `moyenne([10, 20])` vaut `15`, `moyenne([1, 2])` vaut `1.5` ;
  - une liste vide lève une `ValueError`.

  `verifier_moyenne` ne doit rien lever face à une implémentation correcte, et échouer (un `assert` faux, ou un
  `pytest.raises` qui ne voit pas venir l'exception) face à chacune des implémentations fautives des tests :
  division entière, première note oubliée, médiane au lieu de la moyenne, zéro ou `ZeroDivisionError` pour une liste
  vide.

  La fonction reçoit l'implémentation en paramètre, ce qu'un vrai test pytest ne ferait pas : c'est ce qui permet de
  juger tes vérifications. Choisis des exemples qui distinguent ces erreurs : `[10, 10]` ne dit rien d'une division
  entière.
explanation: |-
  Un bon test choisit ses exemples pour **distinguer** le bon comportement des erreurs probables :

  - `[1, 2]` donne `1.5` : une division entière (`//`) donnerait `1`, un arrondi `2` ;
  - `[1, 2, 6]` donne `3`, quand la médiane donne `2` ; sur deux notes, médiane et moyenne se confondent ;
  - `[10, 20]` donne `15`, quand oublier la première note donne `10` ;
  - `pytest.raises(ValueError)` attrape le cas vide : renvoyer `0` fait échouer le bloc (« DID NOT RAISE »), et une
    `ZeroDivisionError` le traverse, car ce n'est pas l'exception attendue.

  Chaque `assert` vérifie un seul fait. Un exemple trop symétrique, comme `[10, 10]`, passe avec presque toutes les
  implémentations fausses : un test vert ne prouve que ce que ses exemples savent distinguer.
