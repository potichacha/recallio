statement: |-
  Écris `fizzbuzz(n)`, qui renvoie la liste des chaînes de 1 à `n` inclus, où :

  - un multiple de 3 devient `"Fizz"` ;
  - un multiple de 5 devient `"Buzz"` ;
  - un multiple de 3 et de 5 devient `"FizzBuzz"` ;
  - tout autre nombre devient sa représentation en chaîne : `"1"`, `"2"`...

  `fizzbuzz(5)` renvoie `["1", "2", "Fizz", "4", "Buzz"]`, et `fizzbuzz(0)` une liste vide.
explanation: |-
  Une boucle `for` sur `range(1, n + 1)` : la fin de `range` est exclue, d'où le `+ 1`. Pour `n = 0`, ce `range` est
  vide, et la liste aussi.

  L'ordre des tests compte : on vérifie le multiple de 15 (de 3 **et** de 5) en premier. Sinon, le test du multiple de
  3 l'attraperait d'abord, et « FizzBuzz » ne serait jamais produit, puisque seule la première branche vraie d'une
  chaîne `if` / `elif` s'exécute. `str(i)` convertit les autres nombres.

  Une variante évite le test de 15 : construire `"Fizz" * (i % 3 == 0) + "Buzz" * (i % 5 == 0)`, puis garder `str(i)`
  si cette chaîne est vide (un booléen vaut 0 ou 1 dans une multiplication).
