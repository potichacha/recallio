statement: |-
  Écris trois petits outils de texte, dans le module `texte.py`, avec les méthodes des chaînes :

  - `en_slug(titre)` transforme un titre en identifiant d'adresse web : en minuscules, les mots séparés par un seul
    tiret, sans blanc au début ni à la fin. `en_slug("  Apprendre   Python ")` renvoie `"apprendre-python"`.
  - `extension(nom_fichier)` renvoie l'extension du fichier, en minuscules et sans le point : `"photo.JPEG"` donne
    `"jpeg"`, et `"archive.tar.gz"` donne `"gz"`, l'extension après le **dernier** point. Un nom sans point donne
    la chaîne vide.
  - `nettoyer_telephone(numero)` ne garde que les chiffres d'un numéro écrit avec des espaces, des tirets ou des
    points : `"06 12-34.56 78"` donne `"0612345678"`.

  Les fonctions renvoient leur résultat, sans rien afficher.
explanation: |-
  `split()` sans argument découpe sur toute suite de blancs et ignore ceux des bouts : `"-".join(titre.lower().split())`
  donne le slug en une ligne, sans `strip` ni tirets en double.

  Pour l'extension, `rfind(".")` donne la position du dernier point, ou `-1` s'il n'y en a pas ; le découpage
  `nom_fichier[position + 1:]` prend ce qui suit. `rpartition(".")` ferait le même travail.

  Pour le téléphone, chaque `replace` renvoie une nouvelle chaîne, sur laquelle on enchaîne le suivant. Les chaînes
  étant immuables, rien ne sert d'appeler `numero.replace(...)` sans récupérer son résultat.
