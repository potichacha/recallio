statement: |-
  Écris tes premiers affichages, dans le module `bonjour.py` :

  - `saluer()` affiche une seule ligne : `Bonjour, monde !` ;
  - `presenter(nom, langage)` affiche deux lignes : `Je m'appelle <nom>.`, puis `J'apprends <langage>.`. Par
    exemple, `presenter("Ada", "Python")` affiche :

    ```
    Je m'appelle Ada.
    J'apprends Python.
    ```

  Les deux fonctions affichent avec `print` ; elles ne renvoient rien. Les tests comparent ce qui s'affiche,
  caractère par caractère : attention aux espaces et aux points.
explanation: |-
  `print` affiche ses arguments séparés par une espace, puis passe à la ligne : `print("Je m'appelle", nom + ".")`
  colle le point au nom avec `+`, avant que `print` n'ajoute l'espace entre ses deux arguments. Une f-string fait la
  même chose plus lisiblement : `print(f"Je m'appelle {nom}.")`.

  Les guillemets doubles permettent d'écrire l'apostrophe de « m'appelle » sans l'échapper. Deux appels à `print`
  donnent deux lignes ; un seul appel avec `"\n"` au milieu marcherait aussi.
