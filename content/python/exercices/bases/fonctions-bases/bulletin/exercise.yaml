statement: |-
  Écris deux fonctions dans `bulletin.py` :

  - `moyenne(notes)` renvoie la moyenne d'une liste de notes, ou `None` si la liste est vide ;
  - `mention(valeur)` renvoie la mention d'une moyenne sur 20 : `"très bien"` à partir de 16, `"bien"` à partir de 14,
    `"assez bien"` à partir de 12, `"passable"` à partir de 10, et `"insuffisant"` en dessous. Pour une moyenne
    `None`, elle renvoie `None`.

  Les deux s'enchaînent : `mention(moyenne([12, 15, 18]))` renvoie `"bien"`.
explanation: |-
  `moyenne` traite d'abord le cas vide, par un retour anticipé : c'est ce qui évite la division par zéro, et `None` dit
  clairement « pas de moyenne ». `if not notes:` suffit, puisqu'une liste vide est fausse.

  `mention` teste d'abord `valeur is None` : comparer `None >= 16` lèverait une `TypeError`. Elle teste ensuite les
  seuils du plus haut au plus bas. Chaque branche renvoie aussitôt, donc chaque test n'a besoin que de sa borne basse :
  arrivé à `valeur >= 14`, on sait déjà que la moyenne est inférieure à 16. Le dernier `return` traite tout le reste.

  Une fonction qui n'atteint aucun `return` renverrait `None` en silence : ici, chaque chemin renvoie une valeur
  explicite.
