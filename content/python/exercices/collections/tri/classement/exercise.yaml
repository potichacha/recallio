statement: |-
  Une classe est une liste de tuples `(nom, note)`. Écris, dans `classement.py` :

  - `classer(eleves)`, qui renvoie la liste des **noms**, de la meilleure note à la moins bonne ; à note égale, les
    noms sont dans l'ordre alphabétique. La liste reçue ne doit pas être modifiée ;
  - `podium(eleves)`, qui renvoie les trois premiers noms du classement (moins, s'il y a moins de trois élèves).

  ```python
  classer([("zoé", 15), ("bob", 12), ("ana", 15)])   # ['ana', 'zoé', 'bob']
  ```
explanation: |-
  `sorted` renvoie une nouvelle liste et laisse celle de l'appelant intacte, là où `list.sort` la modifierait. La clé
  `(-note, nom)` trie d'abord par note décroissante (l'opposé de la note, croissant), puis par nom croissant : une
  seule passe suffit. Avec `reverse=True`, les noms seraient aussi inversés. On pourrait aussi profiter de la
  stabilité du tri : trier par nom, puis par note avec `reverse=True`. `podium` réutilise `classer` et prend une
  tranche : `[:3]` ne lève jamais d'erreur, même sur une liste plus courte.
