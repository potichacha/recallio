statement: |-
  Écris deux fonctions dans `frequences.py`, avec `collections.Counter` :

  - `mots_frequents(texte, n)` renvoie les `n` mots les plus fréquents du texte, **en minuscules**, du plus au moins
    fréquent. Les mots sont séparés par des espaces ; à égalité, le mot apparu le premier passe devant ;
  - `sont_anagrammes(a, b)` dit si `a` et `b` contiennent les mêmes lettres, chacune autant de fois, sans tenir
    compte des espaces ni des majuscules.

  ```python
  mots_frequents("le chat et le chien et le rat", 2)   # ['le', 'et']
  sont_anagrammes("Marie", "aimer")                    # True
  ```
explanation: |-
  `Counter(texte.lower().split())` compte les mots une fois en minuscules ; `split()` sans argument découpe sur les
  espaces et donne `[]` pour un texte vide. `most_common(n)` renvoie les paires `(mot, compte)` les plus fréquentes,
  et range les égalités dans l'ordre de première apparition : il reste à garder les mots. Deux mots sont des
  anagrammes quand leurs lettres ont les mêmes comptes : on compare deux `Counter`, ce qui coûte O(n), là où
  `sorted(a) == sorted(b)` coûterait O(n log n).
