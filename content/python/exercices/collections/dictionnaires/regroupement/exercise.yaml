statement: |-
  Écris deux fonctions qui regroupent des données dans un dictionnaire, dans `regroupement.py` :

  - `par_initiale(mots)` renvoie un dictionnaire qui associe à chaque initiale, **en minuscule**, la liste des mots
    qui commencent par elle, dans leur ordre d'arrivée. Les mots vides sont ignorés ;
  - `inverser(notes)` reçoit un dictionnaire `{nom: note}` et renvoie `{note: [noms]}`, chaque liste dans l'ordre
    du dictionnaire reçu.

  ```python
  par_initiale(["ane", "Bol", "abri"])                 # {'a': ['ane', 'abri'], 'b': ['Bol']}
  inverser({"ana": 15, "bob": 12, "eve": 15})          # {15: ['ana', 'eve'], 12: ['bob']}
  ```

  Les clés du résultat suivent l'ordre de leur première apparition.
explanation: |-
  Les deux fonctions suivent le même schéma : parcourir, puis ajouter à la liste de la bonne clé.
  `groupes.setdefault(cle, [])` renvoie la liste de la clé, après l'avoir créée vide si elle manquait : on peut y
  `append` directement. Comme un dictionnaire garde l'ordre d'insertion, les clés apparaissent dans l'ordre où on
  les rencontre. Pour `inverser`, `.items()` donne les paires `(nom, note)`. Une compréhension `{note: nom ...}`
  perdrait les élèves de même note : chaque paire écraserait la précédente. `collections.defaultdict(list)` est
  l'autre façon idiomatique d'écrire ces regroupements.
