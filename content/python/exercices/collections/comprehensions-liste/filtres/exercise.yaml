statement: |-
  Écris trois fonctions dans `filtres.py`, chacune en **une compréhension de liste** :

  - `carres_des_pairs(nombres)` renvoie les carrés des nombres pairs, dans l'ordre ;
  - `initiales(noms)` renvoie l'initiale en majuscule de chaque nom, en ignorant les noms vides ou faits d'espaces
    (`" léo"` donne `"L"`) ;
  - `bornees(notes)` renvoie une **nouvelle** liste où chaque note est ramenée entre 0 et 20 : -3 devient 0, 25
    devient 20, les autres ne changent pas.

  ```python
  carres_des_pairs([1, 2, 3, 4])    # [4, 16]
  bornees([-3, 12, 25])             # [0, 12, 20]
  ```
explanation: |-
  Les deux places du `if` se retrouvent ici. Dans `carres_des_pairs`, le `if` final **filtre** : seuls les pairs
  passent, puis l'expression de tête calcule leur carré. Dans `initiales`, le filtre `if nom.strip()` écarte les noms
  vides ou blancs (une chaîne vide est fausse) avant que la tête ne lise `nom.strip()[0]`, qui sinon lèverait une
  `IndexError`. Dans `bornees`, il n'y a rien à filtrer : chaque note donne une valeur, calculée par
  `min(max(note, 0), 20)` (on aurait pu écrire `0 if note < 0 else 20 if note > 20 else note`, moins lisible). Une
  compréhension crée toujours une nouvelle liste : celle de l'appelant ne change pas.
