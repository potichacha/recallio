statement: |-
  Une playlist est une liste de titres. Écris trois fonctions qui la modifient **sur place**, dans `playlist.py` :

  - `ajouter(playlist, titres)` ajoute à la fin chacun des titres de la liste `titres` (et non la liste elle-même) ;
  - `deplacer(playlist, titre, position)` retire le titre et le réinsère à l'indice `position` ; si le titre est
    absent, la fonction lève une `ValueError` et laisse la playlist intacte ;
  - `retirer_tout(playlist, titre)` retire **toutes** les occurrences du titre, et renvoie leur nombre (0 s'il est
    absent).

  ```python
  playlist = ["a", "b", "c", "d"]
  deplacer(playlist, "d", 1)     # playlist vaut ['a', 'd', 'b', 'c']
  ```

  Comme les méthodes de liste, `ajouter` et `deplacer` renvoient `None`.
explanation: |-
  `extend` ajoute un à un les éléments d'un itérable, là où `append` ajouterait la liste entière comme un seul
  élément. `deplacer` enchaîne `remove`, qui lève déjà la `ValueError` attendue quand le titre manque (avant toute
  modification), et `insert`, qui place le titre avant l'indice donné. `remove` ne retire que la première
  occurrence : `retirer_tout` compte d'abord les occurrences avec `count`, puis appelle `remove` autant de fois. Une
  compréhension, `playlist[:] = [t for t in playlist if t != titre]`, ferait le même travail en un seul parcours.
