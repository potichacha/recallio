statement: |-
  Écris, dans `transaction.py`, deux gestionnaires de contexte.

  **`Transaction(donnees)`**, une classe, protège un dictionnaire :

  - le bloc `with Transaction(stock) as brouillon:` travaille sur une **copie** du dictionnaire : tant que le bloc
    n'est pas fini, `stock` ne change pas ;
  - si le bloc se termine normalement, les changements du brouillon (ajouts, modifications, suppressions de clés)
    sont reportés dans **le même** dictionnaire `stock`, pas dans un nouveau ;
  - si le bloc lève une exception, `stock` reste tel qu'il était, et l'exception **remonte** à l'appelant.

  **`ignorer(*types)`**, écrit avec `@contextmanager`, ignore les exceptions des types donnés, levées dans son bloc :

  - `with ignorer(KeyError): ...` : une `KeyError` arrête le bloc, puis le programme continue après le `with` ;
  - il accepte plusieurs types : `ignorer(KeyError, IndexError)` ;
  - les exceptions d'autres types remontent.
explanation: |-
  `__enter__` prépare la copie et la renvoie : c'est elle que reçoit la variable de `as`. `__exit__` reçoit le type de
  l'exception, ou `None` si le bloc a réussi. Seul ce dernier cas reporte les changements, avec `clear` puis `update`,
  pour garder le même objet : ceux qui y font référence voient les changements. `__exit__` renvoie `False` : une
  exception éventuelle continue sa remontée.

  Pour `ignorer`, l'exception levée dans le bloc réapparaît à la ligne du `yield`. Un `try` / `except types` autour du
  `yield` la rattrape, ce qui la supprime ; les autres types traversent le générateur et remontent. C'est ce que fait
  `contextlib.suppress`.
