statement: |-
  Un formulaire renvoie ses saisies sous forme de chaînes, pas toujours valides. Écris, dans `saisies.py`, trois
  fonctions qui les convertissent sans jamais s'arrêter sur une saisie invalide :

  - `lire_entier(texte, defaut=None)` renvoie l'entier que représente `texte` (`" 7 "` donne 7), ou `defaut` si
    `int` le refuse, que `texte` soit une chaîne invalide (`"abc"`, `"3.5"`) ou `None` ;
  - `somme_valide(textes)` additionne les textes qui représentent un entier, et renvoie le couple
    `(total, rejets)`, où `rejets` liste, dans l'ordre, les textes refusés ;
  - `moyenne(textes)` renvoie la moyenne des entiers valides, ou `None` s'il n'y en a aucun.

  Utilise `try` et `except` : ne teste pas les chaînes avant de les convertir (`isdigit` refuserait `"-7"`, que `int`
  accepte).
explanation: |-
  `int` sait mieux que n'importe quel test ce qu'est un entier : signe, espaces autour. On le laisse décider, et on
  rattrape **l'exception précise** qu'il lève : `ValueError` pour une chaîne invalide, `TypeError` pour `None`. Un
  `except Exception` cacherait aussi une faute de frappe dans la fonction.

  Dans `somme_valide`, le bloc `else` reçoit l'addition : il ne s'exécute que si la conversion a réussi, et le `try`
  ne protège que la ligne qui peut échouer.

  `moyenne` réutilise `somme_valide`. Quand aucune saisie n'est valide, la division par zéro est le cas à traiter :
  on rattrape `ZeroDivisionError` pour renvoyer `None`.
