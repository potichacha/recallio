statement: |-
  Complète la classe `Playlist`, dans `playlist.py`, pour qu'elle se comporte comme une séquence de titres :

  - `len(p)` donne le nombre de titres, et une playlist vide est fausse dans un `if` ;
  - `p[0]`, `p[-1]` donnent un titre, et un indice hors des bornes lève une `IndexError` ;
  - `p[1:3]` renvoie une **nouvelle `Playlist`**, du même nom, avec les titres de la tranche ;
  - `"solo" in p` cherche un titre **sans tenir compte de la casse** : `"SOLO"` et `"Solo"` le trouvent aussi ;
  - `for titre in p` parcourt les titres dans l'ordre.

  Le constructeur `Playlist(nom, titres=None)` copie la liste reçue : la modifier ensuite ne change pas la playlist,
  et chaque playlist a sa propre liste. N'hérite pas de `list` : écris les méthodes spéciales.
explanation: |-
  Chaque comportement est une méthode spéciale : `__len__` pour `len` (et pour `bool`, qui s'y rabat sans
  `__bool__`), `__getitem__` pour les crochets, `__contains__` pour `in`, `__iter__` pour `for`.

  `__getitem__` reçoit un entier ou un objet `slice` : on teste `isinstance(indice, slice)` pour renvoyer une nouvelle
  playlist, et on délègue le reste à la liste, qui gère déjà les indices négatifs et lève l'`IndexError`.

  Sans `__contains__`, `in` parcourrait les titres avec `==`, sensible à la casse : c'est lui qui permet la
  comparaison par `casefold()`. `__iter__` renvoie `iter(self.titres)`, un itérateur, et non la liste elle-même.

  Dans le constructeur, `list(titres)` copie la liste reçue, et `titres=None` évite le piège d'une liste par défaut
  partagée entre toutes les playlists.
