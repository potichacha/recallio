statement: |-
  Réécris, dans `commande.py`, les deux classes d'une commande en ligne avec des dataclasses.

  **`Ligne(produit, prix_unitaire, quantite=1)`**, une ligne de commande :

  - immuable : affecter un champ lève `dataclasses.FrozenInstanceError`, et une ligne est hachable ;
  - égale à une autre ligne aux mêmes champs, et affichée comme
    `Ligne(produit='pain', prix_unitaire=1.5, quantite=2)` ;
  - une quantité inférieure à 1, ou un prix négatif, lève une `ValueError` dès la création ;
  - sa propriété `total` vaut le prix unitaire multiplié par la quantité.

  **`Commande(client, lignes)`**, où `lignes` est facultatif :

  - une commande neuve a sa propre liste de lignes, vide ;
  - `ajouter(ligne)` ajoute une ligne, et `total()` additionne les totaux des lignes ;
  - deux commandes aux mêmes champs sont égales, et `repr(Commande("ana"))` vaut `Commande(client='ana', lignes=[])`.
explanation: |-
  `@dataclass(frozen=True)` génère `__init__`, `__repr__` et `__eq__`, interdit les affectations et ajoute un
  `__hash__` fondé sur les champs. La validation va dans `__post_init__`, appelé par le `__init__` généré ; le total,
  calculé, est une propriété plutôt qu'un champ.

  Pour `Commande`, `field(default_factory=list)` crée une liste par commande. Le code de départ, avec son `lignes=[]`
  dans `__init__`, partageait une seule liste entre toutes les commandes : le piège du défaut modifiable, que la
  dataclass refuse d'ailleurs si l'on écrit `lignes: list = []`.
