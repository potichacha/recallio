statement: |-
  Écris la classe `Compte`, dans `compte.py`, qui tient le solde d'un compte bancaire :

  - `Compte("Ana")` crée un compte au solde nul ; `Compte("Ana", 100)` part d'un solde de 100. Le titulaire est
    dans l'attribut `titulaire`, le solde dans l'attribut `solde` ;
  - `deposer(montant)` ajoute le montant au solde ;
  - `retirer(montant)` le retire ; un retrait plus grand que le solde lève une `ValueError`, sans rien changer ;
  - un montant nul ou négatif, déposé ou retiré, lève aussi une `ValueError` ;
  - l'attribut `operations` liste les opérations réussies de ce compte, dans l'ordre : `("dépôt", 50)`,
    `("retrait", 20)`. Chaque compte a la sienne.
explanation: |-
  Tous les attributs naissent dans `__init__`, sur `self` : `titulaire`, `solde` et la liste `operations`. Créer cette
  liste dans `__init__`, et non dans le corps de la classe, donne à chaque compte son propre historique : une liste de
  classe serait partagée par tous les comptes.

  Chaque méthode vérifie d'abord ses entrées et lève une `ValueError` avant de toucher à l'objet : un retrait refusé
  ne laisse ni solde modifié ni opération enregistrée. La vérification du montant positif, commune aux deux méthodes,
  peut vivre dans une méthode interne, `_verifier_montant`, dont le souligné dit qu'elle n'est pas faite pour
  l'extérieur.
