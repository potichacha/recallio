statement: |-
  Dans `employes.py`, la classe `Employe` est écrite : un nom, un salaire annuel, une paie mensuelle et une
  présentation. Écris sa sous-classe `Manager` :

  - `Manager("Ana", 60000, 500)` initialise le nom et le salaire **par le constructeur du parent**, garde la prime
    mensuelle dans `prime_mensuelle`, et commence avec une équipe vide, la liste `equipe` ;
  - `ajouter(employe)` ajoute un employé à son équipe ;
  - `paie_mensuelle()` renvoie la paie d'un employé, plus la prime : `5500.0` pour Ana ;
  - `poste()` renvoie `"manager (2)"` quand l'équipe compte deux personnes.

  Ne redéfinis pas `presentation()` : héritée d'`Employe`, elle doit déjà donner `"Ana, manager (2)"`.
explanation: |-
  `class Manager(Employe)` hérite de tout `Employe`. Son `__init__` remplace celui du parent, qui ne s'exécute plus
  tout seul : `super().__init__(nom, salaire_annuel)` le rappelle, pour que `nom` et `salaire_annuel` existent. Viennent
  ensuite les attributs propres au manager, dont une liste `equipe` créée pour chaque objet.

  `paie_mensuelle` complète la version du parent plutôt que de la recopier : `super().paie_mensuelle() +
  self.prime_mensuelle`. Si le calcul de la paie change un jour dans `Employe`, le manager en profite.

  `presentation` n'est pas redéfinie : elle appelle `self.poste()`, et `self` est un `Manager`. Python exécute donc la
  version redéfinie de `poste`. C'est le polymorphisme : la méthode du parent s'adapte à l'objet réel.
