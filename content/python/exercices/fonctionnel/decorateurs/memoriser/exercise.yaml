statement: |-
  Écris le décorateur `memoriser`, dans `memo.py`. Il garde en mémoire le résultat de chaque appel, pour ne pas le
  recalculer :

  - la fonction décorée renvoie le même résultat que la fonction d'origine ;
  - pour des arguments déjà vus, elle renvoie le résultat gardé, sans rappeler la fonction d'origine ; même si ce
    résultat est `None` ;
  - les arguments sont positionnels et hachables : le tuple `args` fait une bonne clé de dictionnaire ;
  - une exception n'est pas mise en mémoire : l'appel suivant réessaie ;
  - chaque fonction décorée a sa propre mémoire, et garde son nom et sa docstring.

  C'est ce que fait `functools.cache` : écris-le toi-même, sans t'en servir.
explanation: |-
  Le décorateur crée un dictionnaire, `resultats`, puis renvoie l'enveloppe. L'enveloppe est une fermeture : elle
  garde ce dictionnaire d'un appel à l'autre, et chaque fonction décorée a le sien, puisque chaque appel de
  `memoriser` en crée un nouveau.

  Le test d'appartenance `if args not in resultats` est la clé : `resultats.get(args)` confondrait un résultat `None`
  avec une absence, et recalculerait. Si la fonction lève une exception, l'affectation n'a pas lieu : rien n'est
  gardé, et l'appel suivant réessaie.

  Les appels récursifs passent aussi par la mémoire, car `fib` désigne l'enveloppe : Fibonacci devient linéaire.
  `functools.wraps` copie le nom et la docstring de la fonction d'origine sur l'enveloppe.
