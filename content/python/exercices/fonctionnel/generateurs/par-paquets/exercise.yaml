statement: |-
  Écris la fonction génératrice `par_paquets(elements, taille)`, dans `paquets.py`. Elle produit les éléments d'un
  itérable par **listes** de `taille` éléments :

  - `list(par_paquets([1, 2, 3, 4, 5], 2))` vaut `[[1, 2], [3, 4], [5]]` : le dernier paquet peut être plus court ;
  - une entrée vide ne produit aucun paquet ;
  - elle doit fonctionner sur un itérateur infini, comme `itertools.count()`, et ne lire que les éléments dont elle a
    besoin : pas de `list(elements)` au départ ;
  - une `taille` inférieure à 1 lève une `ValueError`.
explanation: |-
  Une fonction qui contient `yield` renvoie un générateur : chaque paquet n'est construit que lorsqu'on le demande, ce
  qui permet de découper un itérateur infini. On remplit une liste élément par élément ; dès qu'elle atteint la
  taille voulue, on la produit avec `yield`, puis on repart d'une liste neuve (surtout pas `paquet.clear()`, qui
  viderait aussi la liste déjà donnée à l'appelant). Après la boucle, un paquet incomplet reste à produire, s'il
  n'est pas vide.

  Le contrôle de `taille` est dans le corps : comme tout le corps d'un générateur, il ne s'exécute qu'au premier
  `next()`, d'où le `list(...)` dans le test. Depuis Python 3.12, `itertools.batched(elements, taille)` fait le même
  travail, mais produit des tuples.
