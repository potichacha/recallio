statement: |-
  Écris, dans `journal.py`, deux fonctions pour exploiter les lignes d'un journal d'application, de la forme :

  ```
  2026-11-17 08:15:02 ERROR [paiement] Délai dépassé pour la commande 42
  ```

  - `analyser(ligne)` renvoie le dictionnaire de ses champs :

    ```python
    {"date": "2026-11-17", "heure": "08:15:02", "niveau": "ERROR",
     "module": "paiement", "message": "Délai dépassé pour la commande 42"}
    ```

    ou `None` si la ligne n'a pas exactement cette forme. Le niveau est l'un de `DEBUG`, `INFO`, `WARNING` ou
    `ERROR` ; le module, entre crochets, est fait de lettres minuscules, de chiffres et de soulignés ; le message est
    tout ce qui suit, et n'est jamais vide.
  - `masquer_emails(texte)` remplace chaque adresse e-mail par `<email>`, pour ne pas garder de données personnelles
    dans les journaux.
explanation: |-
  Un seul motif, compilé une fois en tête du module, décrit toute la ligne avec des **groupes nommés** :
  `(?P<date>\d{4}-\d{2}-\d{2})`, `(?P<niveau>DEBUG|INFO|WARNING|ERROR)`, `\[(?P<module>[a-z0-9_]+)\]` (les
  crochets s'échappent), et `(?P<message>.+)` pour la fin. `groupdict()` donne alors directement le dictionnaire
  attendu.

  `fullmatch`, et non `search`, rejette une ligne qui contiendrait une entrée valide au milieu d'autre chose, et
  `.+` refuse un message vide. Écrire le motif en plusieurs chaînes brutes, accolées entre parenthèses, le garde
  lisible ; `re.VERBOSE` est une autre façon de faire.

  Pour les adresses, `[\w.+-]+@[\w-]+(?:\.[\w-]+)+` : une partie locale, une arobase, puis un domaine fait d'au
  moins deux morceaux séparés par des points. Le groupe est non capturant, `(?:...)`, car `sub` n'en a pas besoin.
