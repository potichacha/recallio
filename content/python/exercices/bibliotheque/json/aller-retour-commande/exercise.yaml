statement: |-
  Écris, dans `commandes.py`, deux fonctions qui font l'aller-retour entre une commande et son texte JSON.

  Une commande est un dictionnaire :

  ```python
  {"id": 7, "date": date(2026, 11, 17), "client": "Zoé", "tags": {"urgent", "cadeau"}}
  ```

  `date` vient du module `datetime`, et `tags` est un ensemble de chaînes : deux types que le module `json` ne sait
  pas écrire.

  - `serialiser(commande)` renvoie le texte JSON de la commande : la date au format ISO (`"2026-11-17"`), les tags en
    liste triée, les clés triées, et les accents écrits tels quels (`"Zoé"`, pas `"Zo\u00e9"`). La commande reçue ne
    doit pas être modifiée.
  - `deserialiser(texte)` fait l'inverse : elle renvoie un dictionnaire avec une vraie `date` et un `set` de tags.
    Un texte qui n'est pas du JSON valide, ou une commande sans clé `"id"`, lève une `ValueError`.
explanation: |-
  `serialiser` travaille sur une copie (`dict(commande)`) : remplacer la date et les tags dans le dictionnaire reçu
  modifierait la commande de l'appelant. La date devient `isoformat()`, l'ensemble une liste triée (un `set` n'a pas
  d'ordre, et la sortie doit être stable), puis `json.dumps` avec `sort_keys=True` et `ensure_ascii=False`.

  `deserialiser` laisse `json.loads` signaler un texte invalide : sa `JSONDecodeError` est une sous-classe de
  `ValueError`, il n'y a rien à rattraper. Il reste à vérifier la présence de `"id"`, puis à reconstruire les types
  perdus en route : `date.fromisoformat` pour la date, `set` pour les tags.

  On aurait pu passer `default=str` à `dumps` pour la date, mais le `set` aurait donné un texte comme
  `"{'urgent', 'cadeau'}"`, dans un ordre qui change d'une exécution à l'autre : convertir explicitement chaque champ
  garde le contrôle du format.
