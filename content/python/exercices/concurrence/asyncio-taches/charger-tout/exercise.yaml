statement: |-
  Écris la coroutine `charger_tous(noms, charger, delai, max_simultanes=None)`, dans `chargement.py`. `charger` est une
  fonction coroutine : `await charger(nom)` renvoie la ressource `nom`.

  - les chargements se font **en même temps**, pas l'un après l'autre ;
  - elle renvoie un dictionnaire `{nom: ressource}`, **dans l'ordre des noms** ;
  - un chargement qui dure plus de `delai` secondes est **annulé**, et vaut `None` : les autres continuent ;
  - avec `max_simultanes`, au plus ce nombre de chargements sont en cours en même temps (le délai ne compte que pendant
    le chargement, pas pendant l'attente d'une place) ; sans lui, aucune limite ;
  - une liste de noms vide donne `{}`.

  Le code de départ charge les noms un par un, sans délai ni limite.
explanation: |-
  Chaque nom a sa coroutine, `charger_un(nom)`, qui prend une place du sémaphore, puis attend le chargement sous
  `asyncio.timeout(delai)` : au-delà, le chargement est annulé (la coroutine `charger` reçoit une `CancelledError`), et
  `TimeoutError` est rattrapée pour renvoyer `None`. Le sémaphore pris **avant** le délai fait que l'attente d'une place
  ne compte pas.

  `asyncio.gather` fait avancer toutes ces coroutines en même temps, et rend leurs résultats dans l'ordre des noms : il
  suffit de les associer avec `zip`. Sans limite, un `contextlib.nullcontext()` tient la place du sémaphore : il
  s'utilise aussi avec `async with`.

  ```python
  async def charger_un(nom):
      async with limite:
          try:
              async with asyncio.timeout(delai):
                  return await charger(nom)
          except TimeoutError:
              return None

  ressources = await asyncio.gather(*(charger_un(nom) for nom in noms))
  return dict(zip(noms, ressources))
  ```

  Un `TaskGroup` conviendrait aussi ; `gather` suffit ici, puisque chaque coroutine rattrape elle-même son délai.
