statement: |-
  Écris la fonction `traiter(elements, fonction, max_workers=4)`, dans `lots.py`, qui applique `fonction` à chaque
  élément **en parallèle**, dans un pool de threads :

  - elle renvoie un couple `(resultats, erreurs)` de deux dictionnaires ;
  - `resultats` associe à chaque élément traité avec succès la valeur renvoyée par `fonction(element)` ;
  - `erreurs` associe à chaque élément en échec **l'exception** levée : une erreur sur un élément n'empêche pas de
    traiter les autres ;
  - les appels se font en même temps, avec au plus `max_workers` threads ;
  - une liste vide donne `({}, {})`, et `max_workers` nul ou négatif lève une `ValueError`.

  Les éléments sont hachables et distincts. Le code de départ traite les éléments un par un, et s'arrête à la première
  erreur.
explanation: |-
  Un `ThreadPoolExecutor(max_workers=...)` lance les appels en même temps sans dépasser la limite ; il refuse lui-même
  un `max_workers` nul ou négatif avec une `ValueError`. On soumet **tous** les éléments d'abord, en gardant pour chaque
  futur son élément (un dictionnaire `{futur: element}`), puis on récupère les résultats : appeler `result()` juste
  après chaque `submit` rendrait tout séquentiel.

  `futur.result()` relève l'exception de la tâche : on la rattrape pour la ranger dans `erreurs`, et l'on passe à la
  suivante. `as_completed` rend les futures dans l'ordre où elles finissent ; l'ordre importe peu ici, puisque les
  résultats vont dans des dictionnaires indexés par élément.

  ```python
  with ThreadPoolExecutor(max_workers=max_workers) as ex:
      futurs = {ex.submit(fonction, element): element for element in elements}
      for futur in as_completed(futurs):
          try:
              resultats[futurs[futur]] = futur.result()
          except Exception as erreur:
              erreurs[futurs[futur]] = erreur
  ```
