statement: |-
  Un classique d'entretien : écris `plus_frequents(mots, k)`, dans `frequences.py`, qui renvoie la liste des `k` mots
  les plus fréquents de `mots`.

  - Du plus fréquent au moins fréquent ; à fréquence égale, dans l'ordre alphabétique.
  - La casse ne compte pas : `"Python"` et `"python"` sont le même mot, renvoyé en minuscules.
  - Si `k` dépasse le nombre de mots distincts, tous les mots distincts sont renvoyés ; si `k` est nul ou négatif, la
    liste est vide.
  - La liste reçue n'est pas modifiée.

  Par exemple, `plus_frequents(["chat", "chien", "chat", "souris", "chien", "chat"], 2)` renvoie
  `["chat", "chien"]`. Vise une solution en O(n log n) au plus : la bibliothèque standard a ce qu'il faut.
explanation: |-
  `collections.Counter` compte les mots en un passage, après les avoir mis en minuscules avec une expression
  génératrice (la liste d'origine n'est pas touchée).

  Le tri porte sur les mots distincts, avec une clé en tuple : `(-compte[mot], mot)`. Le signe moins range les
  fréquences de la plus grande à la plus petite, et le mot lui-même départage les égalités dans l'ordre alphabétique.
  `reverse=True` ne conviendrait pas : il inverserait aussi l'ordre alphabétique. `Counter.most_common(k)` non plus :
  à égalité, il garde l'ordre de première apparition.

  Le découpage `[:k]` prend les `k` premiers, et renvoie tout si `k` est plus grand. Le cas `k <= 0` se traite à part :
  `[:-3]` renverrait tous les mots sauf les trois derniers. Pour un très grand nombre de mots distincts et un petit
  `k`, `heapq.nsmallest(k, compte, key=...)` évite le tri complet.
