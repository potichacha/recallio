<style>
body{margin:0}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#5a5378;text-align:center}
.st i{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#e3def7;font-style:normal;font-size:14px;font-weight:900;color:#5a5378}
.ch{text-align:left;box-sizing:border-box;min-height:60px;background:#fff;border:2px solid #857dad;border-radius:18px;padding:14px 16px;font-size:16px;font-weight:800;color:#1b1533;box-shadow:0 4px 0 0 #c4b8fb}
</style>
</helmet>
<div class="s" style="padding: 16px 20px 20px; gap: 16px">
  <header style="display: flex; align-items: center; gap: 8px">
    <a class="ic" href="Onboarding.dc.html" aria-label="Quitter le test" style="margin-left: -10px"><svg class="i" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" style="color: #3d3660"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div style="flex-grow: 1">
      <p class="eb" style="color: #4326d9">Test de niveau</p>
      <p style="margin: 0; font-size: 18px; font-weight: 900">Java</p>
    </div>
    <span style="font-size: 13px; font-weight: 800; color: #5a5378">environ 3 min</span>
  </header>

  <ol class="rise" aria-label="Les domaines du test" style="list-style: none; margin: 0; padding: 14px 10px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: #fff; border-radius: 22px; box-shadow: 0 5px 0 0 #e3def7">
    <li class="st"><i style="background: #13784f"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></i><span style="color: #0e5c3c">Bases</span></li>
    <li class="st"><i style="background: #13784f"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></i><span style="color: #0e5c3c">Types</span></li>
    <li class="st" aria-current="step"><i style="background: #5b3df5; color: #fff; outline: 3px solid #c4b8fb">3</i><span style="color: #1b1533; font-weight: 900">Objets</span></li>
    <li class="st"><i>4</i><span>Collections</span></li>
    <li class="st"><i>5</i><span>Erreurs</span></li>
  </ol>

  <div class="rise d1">
    <p class="eb" style="color: #5a5378">Objets · question 1 sur 2</p>
    <h1 class="h1" style="margin-top: 8px; font-size: 24px; line-height: 1.25">Que garantit un champ déclaré <span class="mono" style="font-size: 22px">final</span> ?</h1>
  </div>

  <div class="rise d2" role="radiogroup" aria-label="Ta réponse" style="display: flex; flex-direction: column; gap: 12px">
    <button role="radio" aria-checked="false" class="ch">Il est affecté une seule fois</button>
    <button role="radio" aria-checked="false" class="ch">L'objet qu'il désigne ne change plus</button>
    <button role="radio" aria-checked="false" class="ch">Il est partagé entre les instances</button>
    <button role="radio" aria-checked="false" class="ch">Il est visible dans le seul paquet</button>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <button class="btn ghost">Je ne sais pas encore</button>
    <p class="p" style="font-size: 13px; text-align: center">Deux questions par domaine. On s'arrête dès que ça coince, et tu sautes ce que tu sais déjà.</p>
  </div>
</div>
