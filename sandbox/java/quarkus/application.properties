# La configuration d'un exercice Quarkus (ADR 0061). Le bac à sable n'a ni réseau ni Docker : pas de Dev Services, une
# base H2 en mémoire recréée à chaque démarrage, et des journaux réduits aux avertissements.
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:exercice;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.log.level=WARN
quarkus.banner.enabled=false
