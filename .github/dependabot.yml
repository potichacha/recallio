version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      quarkus:
        patterns: ['io.quarkus*']
      quality-tools:
        patterns: ['com.google.errorprone*', 'com.uber.nullaway*', 'com.diffplug.spotless*', 'com.palantir*']

  - package-ecosystem: maven
    directory: /runner
    schedule:
      interval: weekly
    groups:
      quarkus:
        patterns: ['io.quarkus*']
      quality-tools:
        patterns: ['com.google.errorprone*', 'com.uber.nullaway*', 'com.diffplug.spotless*', 'com.palantir*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Mises à jour mineures et correctifs regroupés en une seule PR par semaine.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Les types de Node doivent suivre la version de Node utilisée (LTS, voir .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Montée majeure de TypeScript à la main, quand openapi-typescript et typescript-eslint la supportent.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Montée majeure de TypeScript à la main, quand openapi-typescript et typescript-eslint la supportent.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ['/backend', '/frontend', '/runner', '/sandbox/java', '/sandbox/go']
    schedule:
      interval: weekly
    ignore:
      # On reste sur une version LTS de Node : les montées majeures se font à la main, avec .nvmrc.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      # La version de Go est aussi celle du job content de la CI et du go.mod de sandbox/go/run.sh (ADR 0033) : une
      # nouvelle version mineure se monte à la main, partout à la fois.
      - dependency-name: golang
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
