version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      quarkus:
        patterns: ['io.quarkus*']
      quality-tools:
        patterns: ['com.google.errorprone*', 'com.uber.nullaway*', 'com.diffplug.spotless*', 'com.palantir*']
    ignore:
      # La 4 suit Quarkus 4 : la branche 2.3 est celle de Quarkus 3 (ADR 0070). À monter avec Quarkus.
      - dependency-name: 'io.quarkiverse.loggingsentry:quarkus-logging-sentry'
        versions: ['>= 3']

  - package-ecosystem: maven
    directory: /runner
    schedule:
      interval: weekly
    groups:
      quarkus:
        patterns: ['io.quarkus*']
      quality-tools:
        patterns: ['com.google.errorprone*', 'com.uber.nullaway*', 'com.diffplug.spotless*', 'com.palantir*']
    ignore:
      # La 4 suit Quarkus 4 : la branche 2.3 est celle de Quarkus 3 (ADR 0070). À monter avec Quarkus.
      - dependency-name: 'io.quarkiverse.loggingsentry:quarkus-logging-sentry'
        versions: ['>= 3']

  # Les bibliothèques de Spring Boot que le bac à sable Java embarque (ADR 0060).
  - package-ecosystem: maven
    directory: /sandbox/java/libraries
    schedule:
      interval: weekly
    groups:
      spring-boot:
        patterns: ['org.springframework.boot*']

  # Le projet modèle des exercices Quarkus (ADR 0061) : sa version de Quarkus suit celle du backend.
  - package-ecosystem: maven
    directory: /sandbox/java/quarkus
    schedule:
      interval: weekly
    groups:
      quarkus:
        patterns: ['io.quarkus*']

  # pytest et ses dépendances, que le bac à sable Python embarque (ADR 0062) : requirements.txt, écrit par pip-compile
  # avec les empreintes, depuis requirements.in.
  - package-ecosystem: pip
    directory: /sandbox/python
    schedule:
      interval: weekly
    groups:
      pytest:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Mises à jour mineures et correctifs regroupés en une seule PR par semaine.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Les types de Node doivent suivre la version de Node utilisée (LTS, voir .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Montée majeure de TypeScript à la main, quand openapi-typescript et typescript-eslint la supportent.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Montée majeure de TypeScript à la main, quand openapi-typescript et typescript-eslint la supportent.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ['/backend', '/frontend', '/runner', '/sandbox/java', '/sandbox/go', '/sandbox/python']
    schedule:
      interval: weekly
    ignore:
      # On reste sur une version LTS de Node : les montées majeures se font à la main, avec .nvmrc.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      # La version de Go est aussi celle du job content de la CI et du go.mod de sandbox/go/run.sh (ADR 0033) : une
      # nouvelle version mineure se monte à la main, partout à la fois.
      - dependency-name: golang
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # De même, la version de Python est aussi celle du job content de la CI (ADR 0062) : une nouvelle version
      # mineure se monte à la main, aux deux endroits à la fois, avec le contenu qu'elle pourrait changer.
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
