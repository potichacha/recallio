version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      quarkus:
        patterns: ['io.quarkus*']
      quality-tools:
        patterns: ['com.google.errorprone*', 'com.uber.nullaway*', 'com.diffplug.spotless*', 'com.palantir*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Mises à jour mineures et correctifs regroupés en une seule PR par semaine.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Les types de Node doivent suivre la version de Node utilisée (LTS, voir .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ['/backend', '/frontend']
    schedule:
      interval: weekly
    ignore:
      # On reste sur une version LTS de Node : les montées majeures se font à la main, avec .nvmrc.
      - dependency-name: node
        update-types: ['version-update:semver-major']
