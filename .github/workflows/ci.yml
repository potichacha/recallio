name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Une PR poussée de nouveau annule son run en cours. Sur main, jamais : un run annulé pendant le job publish laisserait
# un commit dont une partie seulement des images est publiée (ADR 0069) ; le run suivant attend son tour.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Quels jobs les fichiers modifiés concernent-ils ? Une PR de documentation n'en lance aucun, une PR de contenu ne
  # lance pas le front. Un job écarté est « skipped », ce qui ne bloque pas le merge. Sur main, tout tourne : c'est le
  # filet, et ce qui remplit les caches.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      content: ${{ steps.filter.outputs.content }}
      runner: ${{ steps.filter.outputs.runner }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      e2e: ${{ steps.filter.outputs.e2e }}
      production: ${{ steps.filter.outputs.production }}
      subjects: ${{ steps.filter.outputs.subjects }}
    steps:
      # Sur une PR, HEAD est le commit de fusion : son premier parent est la branche cible, d'où la profondeur de 2.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Find the jobs concerned by the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          else
            files=""
          fi
          touched() { grep -qE "$1" <<< "$files"; }
          # decide <job> <motif des chemins qui le concernent> ; un changement de la CI relance tout.
          decide() {
            if [ "$EVENT_NAME" != "pull_request" ] || touched '^\.github/' || touched "$2"; then
              run=true
            else
              run=false
            fi
            echo "$1=$run" >> "$GITHUB_OUTPUT"
            echo "- \`$1\` : $run" >> "$GITHUB_STEP_SUMMARY"
          }
          # Les tests du backend parsent content/ ; ceux du runner jouent ses exercices dans les images de sandbox/.
          decide backend '^(backend|content)/'
          # CodeLanguagesTest compare les langages des blocs de code du contenu à ceux que le front colore.
          decide content '^(backend/|content/|frontend/src/components/highlightLanguages\.ts$)'
          decide runner '^(runner|sandbox|content)/'
          # Le client de l'API est généré depuis la spec du backend.
          decide frontend '^(frontend/|backend/src/main/openapi/)'
          decide docker '^(backend|frontend|runner)/'
          # La pile de l'e2e : le compose local et son royaume, pas la configuration de production.
          decide e2e '^((backend|frontend|runner|sandbox|content|e2e)/|infra/(compose[^/]*\.yaml$|keycloak/))'
          decide production '^infra/production/'
          # Les sujets que CodeOutputTest, ExercisesTest et TourTest rejouent (étape 8.10.2) : tous (vide) sur main ou
          # quand le code qui les vérifie change ; sinon ceux dont le dossier content/<sujet>/ est modifié, ou « none ».
          # Une PR de contenu Java ne recompile plus les cartes C++.
          if [ "$EVENT_NAME" != "pull_request" ] || touched '^(\.github|backend|runner|sandbox)/'; then
            subjects=""
          else
            subjects=$( (grep -oE '^content/[^/]+/' <<< "$files" || true) | cut -d/ -f2 | (grep -vx source || true) \
              | sort -u | paste -sd, -)
            subjects=${subjects:-none}
          fi
          echo "subjects=$subjects" >> "$GITHUB_OUTPUT"
          echo "- sujets rejoués : ${subjects:-tous}" >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Les « qu'affiche ce code ? » de Go s'exécutent avec la chaîne d'outils de la machine : la même version que
      # l'image sandbox/go (ADR 0033).
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      # Tests (Dev Services : PostgreSQL et Keycloak via Docker), ArchUnit, Error Prone/NullAway, Spotless. Les
      # « qu'affiche ce code ? » (CodeOutputTest, plus de huit minutes) sont l'affaire du job content : les rejouer ici
      # doublait la durée de ce job.
      - name: Build and test
        run: ./mvnw -B verify -Dtest='!CodeOutputTest' -Dsurefire.failIfNoSpecifiedTests=false

      # Code-first (ADR 0003) : la spec committée doit correspondre au code.
      - name: Check that the OpenAPI spec is up to date
        run: |
          git diff --exit-code -- src/main/openapi/openapi.yaml \
            || { echo "::error::openapi.yaml n'est pas à jour : lancer ./mvnw package et committer le fichier."; exit 1; }

  # Contrôle du contenu (CLAUDE.md, section 5.2 ; content/README.md) : parse tous les documents et dossiers de content/
  # et échoue sur une anomalie, puis exécute chaque « qu'affiche ce code ? ». Isolé ici pour qu'une PR de contenu sache
  # tout de suite ce qui ne va pas ; CodeOutputTest ne tourne que dans ce job.
  content:
    name: content
    needs: changes
    if: needs.changes.outputs.content == 'true'
    # Ubuntu 24.04 fournit le paquet g++-14, celui des « qu'affiche ce code ? » C++ (ADR 0053).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Les « qu'affiche ce code ? » de Go s'exécutent avec la chaîne d'outils de la machine : la même version que
      # l'image sandbox/go (ADR 0033).
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      # Ceux de C++ se compilent avec GCC 14, la version de l'image sandbox/cpp (ADR 0053).
      - name: Install GCC 14
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-14

      # Ceux de Python s'exécutent avec Python 3.14, la version de l'image sandbox/python (ADR 0062).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Tout est parsé et contrôlé ; seules les cartes des sujets modifiés s'exécutent (voir le job changes).
      - name: Parse every reference document, every subject folder and every referential, run the code-output cards of the changed subjects and check every choice, check the writing rules and the code languages, publish the coverage
        env:
          SUBJECTS: ${{ needs.changes.outputs.subjects }}
        run: ./mvnw -B test -Dtest='ReferenceDocumentTest,ReferentialTest,SubjectFolderTest,YamlSubjectFolderParserTest,ContentCoverageTest,ContentCoverageReportTest,ContentQualityTest,ContentQualityBaselineTest,CodeLanguagesTest,SnippetRunnerTest,GoSnippetRunnerTest,CppSnippetRunnerTest,PythonSnippetRunnerTest,CodeOutputTest,CodeOutputChoicesTest' -Dsurefire.failIfNoSpecifiedTests=false -Drecallio.subjects="$SUBJECTS"

  # Le runner (ADR 0030, 0033, 0053, 0062) : il exécute le code des joueurs dans des conteneurs jetables. Ses tests
  # construisent les images du bac à sable (sandbox/java, sandbox/go, sandbox/cpp, sandbox/python), vérifient leur
  # isolation, et jouent
  # chaque exercice de code du contenu : la solution doit passer ses tests, le code de départ compiler et en échouer au
  # moins un (ADR 0029).
  runner:
    name: runner
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Une PR qui ne touche que du contenu ne joue que les exercices et les pages du Tour des sujets modifiés (voir le
      # job changes) ; sinon, tout le runner est testé.
      - name: Build the sandbox, test the runner and play the code exercises
        env:
          SUBJECTS: ${{ needs.changes.outputs.subjects }}
        run: |
          if [ -z "$SUBJECTS" ]; then
            ./mvnw -B verify
          else
            ./mvnw -B verify -Dtest='ExercisesTest,TourTest' -Dsurefire.failIfNoSpecifiedTests=false \
              -Drecallio.subjects="$SUBJECTS"
          fi

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Le JavaScript chargé à l'ouverture de la PWA, compressé, ne dépasse pas son budget (ADR 0050).
      - run: npm run size

  # En parallèle des tests, sans les attendre : le chemin le plus long était runner puis docker, près de 17 minutes.
  # Les images se construisent donc même quand un test échoue ; le merge, lui, attend toujours tous les jobs.
  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # L'étape d'exécution (runtime) de chaque image n'est jamais prise du cache : elle applique les correctifs de
      # sécurité publiés depuis l'image de base (microdnf upgrade, apk upgrade), qu'une couche en cache ne prendrait plus
      # (ADR 0070). La compilation (Maven, npm), elle, reste en cache.
      # Depuis la racine du dépôt : le contenu voyage dans l'image du backend (ADR 0069).
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: recallio-backend:ci
          no-cache-filters: runtime
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: recallio-frontend:ci
          no-cache-filters: runtime
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner
          load: true
          tags: recallio-runner:ci
          no-cache-filters: runtime
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      # Bloque sur les vulnérabilités critiques pour lesquelles un correctif existe.
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: recallio-backend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: recallio-frontend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan runner image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: recallio-runner:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # En parallèle des autres jobs, sans les attendre : il construit lui-même sa pile, et son résultat arrive ainsi en
  # moins de cinq minutes au lieu de quinze.
  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pile complète « comme en production », base neuve (voir e2e/README.md).
      - name: Start the stack
        run: docker compose -p recallio-e2e -f infra/compose.yaml -f infra/compose.e2e.yaml up --build --wait

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check types and formatting
        working-directory: e2e
        run: |
          npm run typecheck
          npm run format:check

      - name: Run end-to-end journeys
        working-directory: e2e
        run: npm test

      - name: Show backend logs on failure
        if: failure()
        run: docker compose -p recallio-e2e -f infra/compose.yaml -f infra/compose.e2e.yaml logs backend runner --tail 200

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # La configuration des serveurs de l'application (ADR 0071) et du runner (ADR 0072), sans rien démarrer : chaque
  # compose de production avec les variables de son .env.example (ses secrets vides remplis d'une valeur factice,
  # puisque Compose refuse un secret vide), le Caddyfile formaté et validé par l'image de Caddy que le compose épingle,
  # le royaume Keycloak de production, et les modèles WireGuard, qui ne doivent contenir aucune clé.
  production:
    name: production
    needs: changes
    if: needs.changes.outputs.production == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/production/app
    steps:
      - uses: actions/checkout@v7

      - name: Check the production compose file with the variables of .env.example
        run: |
          sed 's/=$/=ci-placeholder/' .env.example > "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" config --quiet

      - name: Check and validate the Caddyfile with the Caddy image of the compose file
        run: |
          image=$(docker compose --env-file "$RUNNER_TEMP/ci.env" config --images | grep '^caddy:')
          docker run --rm -e DOMAIN=recallio.example -e ACME_EMAIL=admin@recallio.example \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" \
            sh -c 'caddy fmt --diff /etc/caddy/Caddyfile && caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile'

      - name: Check that the production realm is valid JSON
        run: jq empty keycloak/recallio-realm.json

      - name: Check the runner compose file with the variables of its .env.example
        working-directory: infra/production/runner
        run: |
          sed 's/=$/=ci-placeholder/' .env.example > "$RUNNER_TEMP/runner-ci.env"
          docker compose --env-file "$RUNNER_TEMP/runner-ci.env" config --quiet

      # Une clé WireGuard fait 44 caractères base64 (32 octets) : aucune ne doit se trouver dans un modèle, et chaque
      # ligne de clé n'y porte qu'un marqueur <...>, remplacé sur le serveur (docs/deploiement.md, section 11).
      - name: Check that the WireGuard templates contain no key
        working-directory: infra/production
        run: |
          templates=(app/wireguard/wg0.conf.example runner/wireguard/wg0.conf.example)
          # Un modèle absent ferait passer les grep ci-dessous sans rien vérifier.
          ls "${templates[@]}" > /dev/null
          if grep -nE '[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=' "${templates[@]}" \
            || grep -nE '^ *(PrivateKey|PublicKey|PresharedKey) *= *[^< ]' "${templates[@]}"; then
            echo "::error::Un modèle WireGuard contient une clé : seuls des marqueurs <...> y sont permis."
            exit 1
          fi

  # Publie les images sur GHCR (ADR 0069), seulement sur un push sur main, et après tous les jobs de vérification : sur
  # main, ils tournent tous (voir le job changes), et une image publiée a donc passé toute la CI. Deux tags : sha-<12
  # premiers caractères du commit>, immuable, celui que le serveur épingle (revenir en arrière, c'est épingler le
  # précédent) ; et main, le dernier publié.
  publish:
    name: publish (${{ matrix.image }})
    needs: [backend, content, runner, frontend, docker, e2e, production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Le backend et le front se construisent depuis la racine : le backend emporte content/, le front la spec de
          # l'API. Leur étape d'exécution n'est jamais prise du cache, comme dans le job docker : elle applique les
          # correctifs de sécurité publiés depuis l'image de base (ADR 0070).
          - image: backend
            context: .
            file: backend/Dockerfile
            no-cache-filters: runtime
          - image: frontend
            context: .
            file: frontend/Dockerfile
            no-cache-filters: runtime
          - image: runner
            context: runner
            file: runner/Dockerfile
            no-cache-filters: runtime
          # Les images du bac à sable, que le runner lance sur son serveur (ADR 0030, 0033, 0053, 0062) : sans étape
          # runtime, tout leur cache sert.
          - image: sandbox-java
            context: sandbox/java
            file: sandbox/java/Dockerfile
          - image: sandbox-go
            context: sandbox/go
            file: sandbox/go/Dockerfile
          - image: sandbox-cpp
            context: sandbox/cpp
            file: sandbox/cpp/Dockerfile
          - image: sandbox-python
            context: sandbox/python
            file: sandbox/python/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # Un nom d'image GHCR s'écrit en minuscules, contrairement au nom du propriétaire du dépôt.
      - name: Name the image
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/recallio-$IMAGE" >> "$GITHUB_OUTPUT"
          echo "short-sha=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Les serveurs de la bêta sont en x86-64. Le cache reprend celui du job docker pour ses trois images.
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short-sha }}
            ${{ steps.image.outputs.name }}:main
          # source relie le paquet au dépôt ; revision donne le commit exact de l'image.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          no-cache-filters: ${{ matrix.no-cache-filters }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
