name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Les « qu'affiche ce code ? » de Go s'exécutent avec la chaîne d'outils de la machine : la même version que
      # l'image sandbox/go (ADR 0033).
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false

      # Tests (Dev Services : PostgreSQL et Keycloak via Docker), ArchUnit, Error Prone/NullAway, Spotless.
      - name: Build and test
        run: ./mvnw -B verify

      # Code-first (ADR 0003) : la spec committée doit correspondre au code.
      - name: Check that the OpenAPI spec is up to date
        run: |
          git diff --exit-code -- src/main/openapi/openapi.yaml \
            || { echo "::error::openapi.yaml n'est pas à jour : lancer ./mvnw package et committer le fichier."; exit 1; }

  # Contrôle du contenu (CLAUDE.md, section 5.2 ; content/README.md) : parse tous les documents de content/source et
  # échoue sur une anomalie. Aussi couvert par le job backend, mais isolé ici pour qu'une PR de contenu sache tout de
  # suite ce qui ne va pas, sans attendre les tests d'intégration.
  content:
    name: content
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Les « qu'affiche ce code ? » de Go s'exécutent avec la chaîne d'outils de la machine : la même version que
      # l'image sandbox/go (ADR 0033).
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false

      - name: Parse every reference document, every subject folder and every referential, run every code-output card, publish the coverage
        run: ./mvnw -B test -Dtest='ReferenceDocumentTest,ReferentialTest,SubjectFolderTest,YamlSubjectFolderParserTest,ContentCoverageTest,ContentCoverageReportTest,SnippetRunnerTest,GoSnippetRunnerTest,CodeOutputTest' -Dsurefire.failIfNoSpecifiedTests=false

  # Le runner (ADR 0030, 0033) : il exécute le code des joueurs dans des conteneurs jetables. Ses tests construisent les
  # images du bac à sable (sandbox/java, sandbox/go), vérifient leur isolation, et jouent chaque exercice de code du
  # contenu : la solution doit passer ses tests, le code de départ compiler et en échouer au moins un (ADR 0029).
  runner:
    name: runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the sandbox, test the runner and play every code exercise
        run: ./mvnw -B verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker
    needs: [backend, frontend, runner]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: recallio-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: recallio-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner
          load: true
          tags: recallio-runner:ci
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      # Bloque sur les vulnérabilités critiques pour lesquelles un correctif existe.
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: recallio-backend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: recallio-frontend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan runner image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: recallio-runner:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  e2e:
    name: e2e
    needs: [backend, frontend, runner]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pile complète « comme en production », base neuve (voir e2e/README.md).
      - name: Start the stack
        run: docker compose -p recallio-e2e -f infra/compose.yaml -f infra/compose.e2e.yaml up --build --wait

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check types and formatting
        working-directory: e2e
        run: |
          npm run typecheck
          npm run format:check

      - name: Run end-to-end journeys
        working-directory: e2e
        run: npm test

      - name: Show backend logs on failure
        if: failure()
        run: docker compose -p recallio-e2e -f infra/compose.yaml -f infra/compose.e2e.yaml logs backend runner --tail 200

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
