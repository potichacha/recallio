quarkus.application.name=recallio-runner
quarkus.http.port=8090

# --- Logs et erreurs (ADR 0070) -------------------------------------------
# Logs JSON hors dev et test, avec le nom du service ; en dev et en test, la console reste lisible.
%dev,test.quarkus.log.console.json.enabled=false
quarkus.log.console.json.additional-field.service.value=runner
# Les erreurs dans Sentry : allumé si SENTRY_DSN est donné, éteint sinon (SentryActivation), et jamais en dev ni en
# test. Les événements et les fils d'Ariane à partir d'ERROR seulement : la sortie d'erreur d'un programme de
# l'utilisateur, journalisée en WARN (DockerSandbox), reste dans les logs du serveur et ne part jamais chez Sentry. Les
# adresses du runner ne portent ni jeton ni donnée personnelle : rien à masquer. Sans traces de performance.
%prod.quarkus.log.sentry.dsn=${SENTRY_DSN:}
quarkus.log.sentry.environment=${SENTRY_ENVIRONMENT:production}
quarkus.log.sentry.release=${SENTRY_RELEASE:}
quarkus.log.sentry.level=ERROR
quarkus.log.sentry.minimum-event-level=ERROR
quarkus.log.sentry.minimum-breadcrumb-level=ERROR
quarkus.log.sentry.in-app-packages=com.recallio

# --- Bac à sable (ADR 0030) -------------------------------------------
# Le jeton que présente le backend. En production, uniquement par variable d'environnement : sans lui, le runner refuse
# de démarrer. La valeur de dev et de test ne protège rien et ne sert qu'en local.
%prod.recallio.runner.token=${RECALLIO_RUNNER_TOKEN}
%dev,test.recallio.runner.token=dev-token-du-runner-a-ne-jamais-deployer
# Les autres réglages ont une valeur par défaut (SandboxConfig) : image, délai, exécutions simultanées, runtime.
# La santé (/q/health) échappe au filtre du jeton : l'orchestrateur la consulte.
