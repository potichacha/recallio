quarkus.application.name=recallio-runner
quarkus.http.port=8090

# --- Bac à sable (ADR 0030) -------------------------------------------
# Le jeton que présente le backend. En production, uniquement par variable d'environnement : sans lui, le runner refuse
# de démarrer. La valeur de dev et de test ne protège rien et ne sert qu'en local.
%prod.recallio.runner.token=${RECALLIO_RUNNER_TOKEN}
%dev,test.recallio.runner.token=dev-token-du-runner-a-ne-jamais-deployer
# Les autres réglages ont une valeur par défaut (SandboxConfig) : image, délai, exécutions simultanées, runtime.
# La santé (/q/health) échappe au filtre du jeton : l'orchestrateur la consulte.
