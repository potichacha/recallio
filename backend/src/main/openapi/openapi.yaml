      - name: subject
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourTaskRequest"
        required: true
      responses:
        "200":
          description: "Le verdict, avec l'exécution"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourTaskCheck"
        "404":
          description: "Page sans « À toi » : notion inconnue, page absente, ou sans\
