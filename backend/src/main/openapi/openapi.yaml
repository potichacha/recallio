      summary: "Cartes à réviser maintenant : les cartes dues, puis des nouvelles\
        \ dans la limite du jour. Sans filtre, elles viennent des sujets suivis ;\
        \ avec un groupe, de ses réglages."
      operationId: getReviewQueue
      tags:
      - Révision
      parameters:
      - description: "Identifiant d'un groupe dont l'utilisateur est membre, pour\
          \ réviser ses cartes"
        name: group
        in: query
        schema:
          $ref: "#/components/schemas/UUID"
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          maximum: 50
          minimum: 1
          default: 20
      - description: "Slug du sujet, pour ne réviser que ce sujet (suivi ou non)"
        name: subject
        in: query
        schema:
          type: string
      - description: "Slug du thème, pour ne réviser que ce thème"
        name: theme
        in: query
        schema:
          type: string
      - description: "Formats de carte, pour ne réviser qu'eux (répétable : le mode\
          \ « questions corrigées » de la PWA en demande quatre, ADR 0048) ; aucun\
          \ : tous les formats"
        name: type
        in: query
        schema:
          type: array
          items:
            $ref: "#/components/schemas/CardType"
      responses:
        "200":
          description: La file de révision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueue"
        "400":
          description: Paramètre invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "Sujet ou thème inconnu, ou groupe dont l'utilisateur n'est\
            \ pas membre"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - SecurityScheme: []
