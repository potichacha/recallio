---
openapi: 3.1.0
components:
  schemas:
    Achievement:
      type: string
      enum:
      - FIRST_REVIEW
      - HUNDRED_REVIEWS
      - THOUSAND_REVIEWS
      - STREAK_7
      - STREAK_30
      - FIRST_EXERCISE
      - POLYGLOT
      - FIRST_TOUR_NOTION
      - TOUR_EXPLORER
      - FIRST_QUEST
      - WEEKLY_QUEST
    AchievementStatus:
      type: object
      properties:
        achievement:
          $ref: "#/components/schemas/Achievement"
        unlockedAt:
          description: Absent tant que le succès n'est pas débloqué
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
      required:
      - achievement
    AdminContentReport:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        subject:
          type: string
        cardId:
          description: La carte signalée ; absente pour une page du Tour
          type: string
          $ref: "#/components/schemas/UUID"
        themeSlug:
          type: string
          description: "Le thème de la carte, pour l'ouvrir ; absent pour une page,\
            \ ou une carte retirée"
        notion:
          type: string
          description: La notion de la page signalée ; absente pour une carte
        page:
          type: integer
          format: int32
          description: "Le rang de la page, à partir de 1 ; absent pour une carte"
        notionTitle:
          type: string
          description: "Le titre de la notion de la carte ou de la page, s'il est\
            \ connu"
        excerpt:
          type: string
          description: "Le début de la question de la carte ; absent pour une page,\
            \ ou une carte retirée"
        reason:
          $ref: "#/components/schemas/ReportReason"
        comment:
          type: string
          description: Ce que l'utilisateur a remarqué ; vide s'il n'a rien précisé
        createdAt:
          $ref: "#/components/schemas/Instant"
        resolution:
          description: Absente tant que le signalement est ouvert
          type: string
          $ref: "#/components/schemas/ReportResolution"
        resolvedAt:
          $ref: "#/components/schemas/Instant"
      required:
      - id
      - subject
      - cardId
      - themeSlug
      - notion
      - page
      - notionTitle
      - excerpt
      - reason
      - comment
      - createdAt
      - resolution
      - resolvedAt
    AdminContentReportPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminContentReport"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    AnswerLiveQuestionRequest:
      type: object
      properties:
        question:
          type: integer
          format: int32
          description: "Position de la question, à partir de 0"
          minimum: 0
        selectedChoices:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: "Positions des choix cochés, à partir de 0"
          maxItems: 8
      required:
      - selectedChoices
    BlankCorrection:
      type: object
      properties:
        expected:
          type: string
          description: La réponse attendue
        correct:
          type: boolean
          description: Vrai si la réponse donnée est acceptée
      required:
      - expected
      - correct
    Card:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        type:
          $ref: "#/components/schemas/CardType"
        prompt:
          type: string
          description: "Recto, en Markdown"
        answer:
          type: string
          description: "Verso, en Markdown ; pour une carte à choix, l'explication"
        choices:
          type: array
          items:
            $ref: "#/components/schemas/CardChoice"
          description: "Les choix de la carte, bonnes réponses marquées ; vide pour\
            \ une carte qui s'auto-évalue, un code à trous ou un exercice (ADR 0051)"
        blanks:
          type: array
          items:
            type: array
            items:
              type: string
          description: "Les réponses acceptées par chaque trou d'un code à trous,\
            \ dans l'ordre des trous ; vide pour les autres formats"
        exercise:
          description: Les fichiers d'un exercice de code ; absent pour les autres
            formats
          type: object
          anyOf:
          - $ref: "#/components/schemas/Exercise"
          - type: "null"
        version:
          type: integer
          format: int32
      required:
      - id
      - type
      - prompt
      - answer
      - choices
      - blanks
      - exercise
      - version
    CardChoice:
      type: object
      properties:
        text:
          type: string
          description: En Markdown
        correct:
          type: boolean
      required:
      - text
      - correct
    CardCounts:
      type: object
      properties:
        total:
          type: integer
          format: int32
        seen:
          type: integer
          format: int32
          description: Cartes révisées au moins une fois
        mastered:
          type: integer
          format: int32
          description: Cartes mémorisées pour trois semaines ou plus
        dueNow:
          type: integer
          format: int32
          description: Cartes à revoir maintenant
        dueToday:
          type: integer
          format: int32
          description: "Cartes à revoir d'ici minuit, dont celles dues maintenant"
      required:
      - total
      - seen
      - mastered
      - dueNow
      - dueToday
    CardPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    CardType:
      type: string
      enum:
      - FLASHCARD
      - CODE_OUTPUT
      - OPEN_SCENARIO
      - DEFINITION
      - MULTIPLE_CHOICE
      - TRUE_FALSE
      - BUG_FIX
      - FILL_IN
      - CODING_EXERCISE
    Challenge:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/ChallengeSummary"
        groupId:
          $ref: "#/components/schemas/UUID"
        groupName:
          type: string
        visibility:
          $ref: "#/components/schemas/LeaderboardVisibility"
        standings:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeStanding"
          description: "Les parties terminées, la meilleure d'abord ; seulement la\
            \ sienne si le classement est désactivé"
      required:
      - summary
      - groupId
      - groupName
      - visibility
      - standings
    ChallengeAnswerRequest:
      type: object
      properties:
        position:
          type: integer
          format: int32
          minimum: 0
        selectedChoices:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: "Positions des choix cochés, à partir de 0"
          maxItems: 8
      required:
      - selectedChoices
    ChallengeAnswerResult:
      type: object
      properties:
        correct:
          type: boolean
        timedOut:
          type: boolean
          description: "La réponse est arrivée après le délai : elle compte comme\
            \ fausse"
        correctChoices:
          type: array
          items:
            type: integer
            format: int32
        explanation:
          type: string
          description: En Markdown
        finished:
          type: boolean
          description: Vrai si c'était la dernière carte
      required:
      - correct
      - timedOut
      - correctChoices
      - explanation
      - finished
    ChallengeCard:
      type: object
      properties:
        position:
          type: integer
          format: int32
          description: "Position dans la série, à partir de 0"
        subjectTitle:
          type: string
        themeTitle:
          type: string
        prompt:
          type: string
          description: En Markdown
        choices:
          type: array
          items:
            type: string
          description: "En Markdown, sans dire lesquels sont justes"
        multipleAnswers:
          type: boolean
        remainingMs:
          type: integer
          format: int64
          description: "Temps restant pour répondre, mesuré par le serveur"
      required:
      - position
      - subjectTitle
      - themeTitle
      - prompt
      - choices
      - multipleAnswers
      - remainingMs
    ChallengeStanding:
      type: object
      properties:
        rank:
          type: integer
          format: int32
        displayName:
          type:
          - string
          - "null"
          description: "Absent dans un classement anonymisé, sauf pour l'utilisateur"
        me:
          type: boolean
        score:
          type: integer
          format: int32
        timeMs:
          type: integer
          format: int64
          description: "Temps passé à répondre, en millisecondes : il départage les\
            \ ex æquo"
      required:
      - rank
      - me
      - score
      - timeMs
    ChallengeStatus:
      type: string
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - FINISHED
    ChallengeStep:
      type: object
      properties:
        card:
          description: La carte à jouer ; absente une fois la partie terminée
          type:
          - object
          - "null"
          anyOf:
          - $ref: "#/components/schemas/ChallengeCard"
          - type: "null"
        cardCount:
          type: integer
          format: int32
        score:
          type: integer
          format: int32
          description: Bonnes réponses jusqu'ici
        finished:
          type: boolean
      required:
      - cardCount
      - score
      - finished
    ChallengeSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
        cardCount:
          type: integer
          format: int32
        secondsPerCard:
          type: integer
          format: int32
        endsAt:
          $ref: "#/components/schemas/Instant"
        open:
          type: boolean
          description: Vrai tant qu'on peut y jouer
        myStatus:
          $ref: "#/components/schemas/ChallengeStatus"
        myScore:
          type:
          - integer
          - "null"
          format: int32
          description: "Le score de l'utilisateur, une fois sa partie terminée"
      required:
      - id
      - title
      - cardCount
      - secondsPerCard
      - endsAt
      - open
      - myStatus
    ChooseTrackRequest:
      type: object
      required:
      - track
      properties:
        track:
          $ref: "#/components/schemas/LearningTrack"
    ContentReport:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        reason:
          $ref: "#/components/schemas/ReportReason"
        createdAt:
          $ref: "#/components/schemas/Instant"
      required:
      - id
      - reason
      - createdAt
    Correction:
      type: object
      properties:
        correctChoices:
          type: array
          items:
            type: integer
            format: int32
          description: "Positions des bonnes réponses d'un QCM ou d'un vrai ou faux,\
            \ à partir de 0, dans l'ordre"
        blanks:
          type: array
          items:
            $ref: "#/components/schemas/BlankCorrection"
          description: "La correction de chaque trou d'un code à trous, dans l'ordre\
            \ ; vide sinon"
        explanation:
          type: string
          description: "L'explication, en Markdown"
        exerciseRun:
          description: Le résultat des tests d'un exercice de code ; absent sinon
          type: object
          anyOf:
          - $ref: "#/components/schemas/ExerciseRun"
          - type: "null"
        solution:
          type: array
          items:
            $ref: "#/components/schemas/ExerciseFile"
          description: "La solution modèle d'un exercice de code, une fois rendu ;\
            \ vide sinon"
      required:
      - correctChoices
      - blanks
      - explanation
      - exerciseRun
      - solution
    CreateChallengeRequest:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          pattern: \S
          maxLength: 80
        cardCount:
          type: integer
          format: int32
          maximum: 20
          minimum: 3
        secondsPerCard:
          type: integer
          format: int32
          maximum: 120
          minimum: 10
    CreateGroupRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          pattern: \S
          maxLength: 60
    DayActivity:
      type: object
      properties:
        day:
          $ref: "#/components/schemas/LocalDate"
        cardsReviewed:
          type: integer
          format: int32
        goalReached:
          type: boolean
        frozen:
          type: boolean
          description: Jour manqué couvert par un gel de streak (ADR 0036)
      required:
      - day
      - cardsReviewed
      - goalReached
      - frozen
    DayRetention:
      type: object
      properties:
        day:
          type: integer
          format: int32
          description: Le nombre de jours après le premier jour actif
        eligible:
          type: integer
          format: int32
          description: Les joueurs dont le premier jour actif remonte à au moins ce
            nombre de jours
        retained:
          type: integer
          format: int32
          description: Ceux d'entre eux qui ont révisé ce jour-là
        percent:
          type: integer
          format: int32
          description: "La part des joueurs revenus, en pourcentage"
      required:
      - day
      - eligible
      - retained
      - percent
    DeclaredSkills:
      type: object
      properties:
        notions:
          type: integer
          format: int32
          description: Les notions du sujet ; aucune sans référentiel
        acquired:
          type: integer
          format: int32
        mastered:
          type: integer
          format: int32
        expert:
          type: integer
          format: int32
        readinessPercent:
          type: integer
          format: int32
          description: "L'indice de préparation, de 0 à 100 (ADR 0041)"
      required:
      - notions
      - acquired
      - mastered
      - expert
      - readinessPercent
    Duel:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        subject:
          type: string
        mode:
          $ref: "#/components/schemas/Mode"
        status:
          $ref: "#/components/schemas/Status"
        questionCount:
          type: integer
          format: int32
        expiresAt:
          description: "Ouvert, le duel attend un adversaire jusque-là ; complet,\
            \ chacun doit avoir fini avant"
          type: string
          $ref: "#/components/schemas/Instant"
        me:
          $ref: "#/components/schemas/DuelSide"
        opponent:
          description: Absent tant que personne n'a rejoint le duel
          type: object
          $ref: "#/components/schemas/DuelOpponent"
        result:
          description: Absent tant que le duel n'est pas réglé
          type: object
          $ref: "#/components/schemas/DuelResult"
      required:
      - id
      - subject
      - mode
      - status
      - questionCount
      - expiresAt
      - me
      - opponent
      - result
    DuelAnswerRequest:
      required:
      - position
      type: object
      properties:
        position:
          type: integer
          format: int32
          description: "Le rang de la question servie, à partir de 0"
          maximum: 4
          minimum: 0
        selectedChoices:
          type:
          - array
          - "null"
          items:
            type: integer
            format: int32
          description: "Les positions cochées d'un QCM ou d'un vrai ou faux, à partir\
            \ de 0"
          maxItems: 8
        filledBlanks:
          type:
          - array
          - "null"
          items:
            type: string
          description: "Les réponses d'un code à trous, une par trou"
          maxItems: 20
    DuelAnswerResult:
      type: object
      properties:
        correct:
          type: boolean
          description: "Vrai si la réponse compte juste : juste, et à temps"
        late:
          type: boolean
          description: Vrai si elle est arrivée après le temps imparti
        correctChoices:
          type: array
          items:
            type: integer
            format: int32
        blanks:
          type: array
          items:
            $ref: "#/components/schemas/DuelBlankResult"
        explanation:
          type: string
          description: "L'explication, en Markdown"
        finished:
          type: boolean
          description: Vrai si c'était la dernière question du joueur
      required:
      - correct
      - late
      - correctChoices
      - blanks
      - explanation
      - finished
    DuelBlankResult:
      type: object
      properties:
        expected:
          type: string
        correct:
          type: boolean
      required:
      - expected
      - correct
    DuelOpponent:
      type: object
      description: "L'adversaire : ses bonnes réponses ne se voient qu'au résultat"
      properties:
        displayName:
          type: string
        answered:
          type: integer
          format: int32
        finished:
          type: boolean
      required:
      - displayName
      - answered
      - finished
    DuelQuestion:
      type: object
      properties:
        cardId:
          $ref: "#/components/schemas/UUID"
        type:
          $ref: "#/components/schemas/CardType"
        prompt:
          type: string
          description: En Markdown ; les trous d'un code à compléter sont des ___
        choices:
          type: array
          items:
            type: string
          description: "Les choix, sans dire lesquels sont justes"
        multipleAnswers:
          type: boolean
        blankCount:
          type: integer
          format: int32
      required:
      - cardId
      - type
      - prompt
      - choices
      - multipleAnswers
      - blankCount
    DuelResult:
      type: object
      properties:
        outcome:
          $ref: "#/components/schemas/Outcome"
        myCorrect:
          type: integer
          format: int32
        opponentCorrect:
          type: integer
          format: int32
        myTimeMs:
          type: integer
          format: int64
        opponentTimeMs:
          type: integer
          format: int64
        placing:
          type: boolean
          description: "Vrai pendant le placement : les rangs restent cachés"
        rankBefore:
          $ref: "#/components/schemas/Rank"
        rankAfter:
          $ref: "#/components/schemas/Rank"
        promoted:
          type: boolean
          description: Vrai si le joueur est monté d'un rang
      required:
      - outcome
      - myCorrect
      - opponentCorrect
      - myTimeMs
      - opponentTimeMs
      - placing
      - rankBefore
      - rankAfter
      - promoted
    DuelSide:
      type: object
      properties:
        answered:
          type: integer
          format: int32
          description: "Les questions répondues, ou dont le temps est passé"
        correct:
          type: integer
          format: int32
          description: "Les bonnes réponses, à temps"
        finished:
          type: boolean
      required:
      - answered
      - correct
      - finished
    DuelSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        subject:
          type: string
        mode:
          $ref: "#/components/schemas/Mode"
        status:
          $ref: "#/components/schemas/Status"
        expiresAt:
          $ref: "#/components/schemas/Instant"
        opponentName:
          type: string
        outcome:
          description: Absent tant que le duel n'est pas réglé
          type: string
          $ref: "#/components/schemas/Outcome"
        myTurnDone:
          type: boolean
      required:
      - id
      - subject
      - mode
      - status
      - expiresAt
      - opponentName
      - outcome
      - myTurnDone
    DuelTurn:
      type: object
      properties:
        finished:
          type: boolean
          description: Vrai quand le joueur a joué toutes ses questions
        position:
          type: integer
          format: int32
          description: "Le rang de la question, à partir de 0 ; absent une fois fini"
        total:
          type: integer
          format: int32
        question:
          $ref: "#/components/schemas/DuelQuestion"
        remainingMs:
          type: integer
          format: int64
          description: "Le temps qui reste pour répondre, mesuré par le serveur"
      required:
      - finished
      - position
      - total
      - question
      - remainingMs
    ExamAnswer:
      type: object
      required:
      - cardId
      properties:
        cardId:
          $ref: "#/components/schemas/UUID"
        selectedChoices:
          type:
          - array
          - "null"
          items:
            type: integer
            format: int32
          description: "Les positions cochées d'un QCM ou d'un vrai ou faux, à partir\
            \ de 0"
        filledBlanks:
          type:
          - array
          - "null"
          items:
            type: string
          description: "Les réponses d'un code à trous, une par trou"
    ExamQuestion:
      type: object
      properties:
        cardId:
          $ref: "#/components/schemas/UUID"
        type:
          $ref: "#/components/schemas/CardType"
        prompt:
          type: string
          description: En Markdown ; les trous d'un code à compléter sont des ___
        choices:
          type: array
          items:
            type: string
          description: "Les choix d'un QCM ou d'un vrai ou faux, sans dire lesquels\
            \ sont justes"
        multipleAnswers:
          type: boolean
          description: Vrai si plusieurs choix sont justes
        blankCount:
          type: integer
          format: int32
          description: Le nombre de trous d'un code à compléter
      required:
      - cardId
      - type
      - prompt
      - choices
      - multipleAnswers
      - blankCount
    ExamQuestionResult:
      type: object
      properties:
        cardId:
          $ref: "#/components/schemas/UUID"
        correct:
          type: boolean
        correctChoices:
          type: array
          items:
            type: integer
            format: int32
          description: "Les bonnes réponses d'un QCM ou d'un vrai ou faux, à partir\
            \ de 0"
        blanks:
          type: array
          items:
            $ref: "#/components/schemas/BlankCorrection"
          description: La correction de chaque trou d'un code à compléter
        explanation:
          type: string
          description: "L'explication, en Markdown"
      required:
      - cardId
      - correct
      - correctChoices
      - blanks
      - explanation
    Exercise:
      type: object
      properties:
        starter:
          type: array
          items:
            $ref: "#/components/schemas/SourceFile"
          description: "Le code de départ, à modifier"
        solution:
          type: array
          items:
            $ref: "#/components/schemas/SourceFile"
          description: "La solution modèle : les mêmes fichiers que le code de dé\
            part"
        tests:
          type: array
          items:
            $ref: "#/components/schemas/SourceFile"
          description: Les tests qui jugent le code
      required:
      - starter
      - solution
      - tests
    ExerciseFile:
      type: object
      required:
      - path
      - content
      properties:
        path:
          type: string
          description: "Chemin relatif, avec des /"
          pattern: "([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\\.(java|go)"
        content:
          type: string
          pattern: \S
          maxLength: 20000
    ExerciseRun:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/Status1"
        tests:
          type: array
          items:
            $ref: "#/components/schemas/TestResult"
          description: Chaque test et son résultat ; vide si le code n'a pas compilé
            ou n'a pas fini à temps
        output:
          type: string
          description: "Les erreurs de compilation, ou ce qui a arrêté les tests ;\
            \ vide sinon"
      required:
      - status
      - tests
      - output
    ExerciseRunRequest:
      type: object
      required:
      - cardId
      - files
      properties:
        cardId:
          $ref: "#/components/schemas/UUID"
        files:
          type: array
          items:
            $ref: "#/components/schemas/ExerciseFile"
          description: "Les fichiers à essayer : exactement ceux du code de départ"
          minItems: 1
          maxItems: 10
    ExerciseToSolve:
      type: object
      properties:
        starter:
          type: array
          items:
            $ref: "#/components/schemas/ExerciseFile"
          description: "Le code de départ, à modifier"
        tests:
          type: array
          items:
            $ref: "#/components/schemas/ExerciseFile"
          description: Les tests qui jugent le code
      required:
      - starter
      - tests
    FollowSubjectsRequest:
      type: object
      required:
      - subjects
      properties:
        subjects:
          type: array
          items:
            type: string
