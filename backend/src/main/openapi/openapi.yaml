    post:
      summary: "Enregistre la note donnée à une carte, corrige un QCM ou un code à\
        \ trous, ou juge un exercice de code par ses tests (idempotent grâce à requestId)"
      operationId: recordReview
      tags:
      - Révision
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordReviewRequest"
        required: true
      responses:
        "201":
          description: Révision enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "200":
          description: "Requête déjà reçue : le résultat enregistré la première fois"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Carte inconnue ou retirée
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: requestId déjà utilisé pour une autre révision
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: "Une réponse qui ne correspond pas au format : une note pour\
            \ un QCM ou un code à trous, des choix ou des trous pour une carte en\
            \ auto-évaluation, un nombre de trous inexact"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Un exercice de code de cet utilisateur est déjà en cours d'exécution
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: "L'exécution des exercices de code est indisponible : rien\
