          description: "Ce que le programme a écrit, et comment il s'est terminé"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramRun"
        "400":
          description: "Requête invalide : aucun fichier, trop de fichiers, un chemin\
            \ invalide ou un fichier vide"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: "Les fichiers ne forment pas un programme : deux langages,\
            \ un fichier de tests, ou pas de Main.java en Java"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Une exécution de cet utilisateur est déjà en cours
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: L'exécution du code est indisponible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
