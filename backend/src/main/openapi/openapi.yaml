      - SecurityScheme: []
  /api/v1/me/tour/{subject}/{notion}/tasks:
    post:
      summary: "Exécute le programme d'un « À toi » et compare sa sortie à celle attendue,\
        \ qui reste sur le serveur"
      operationId: checkTourTask
      tags:
      - Tour
