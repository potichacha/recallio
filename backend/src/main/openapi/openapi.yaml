  /api/v1/me/tour/{subject}/{notion}/checks:
    post:
      summary: "Corrige une réponse à chaque question d'une notion du Tour ; toutes\
        \ justes, la notion est validée"
      operationId: checkTourNotion
      tags:
      - Tour
      parameters:
      - name: notion
        in: path
