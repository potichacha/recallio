quarkus.application.name=recallio-backend

# --- Santé -------------------------------------------------------------
# Exposée sous l'API versionnée ; le chemin absolu évite le préfixe /q.
quarkus.smallrye-health.root-path=/api/v1/health

# --- Base de données ---------------------------------------------------
# En dev et en test, Dev Services démarre PostgreSQL (Docker) automatiquement.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Le schéma est géré uniquement par Flyway, jamais généré par Hibernate.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.statement-batch-size=100
quarkus.flyway.migrate-at-start=true

# --- Authentification (OIDC) ------------------------------------------
# Le backend valide des JWT (bearer). En dev et en test, Dev Services démarre Keycloak.
quarkus.oidc.application-type=service
# Le jeton doit être destiné à l'API (mapper d'audience du royaume) : un jeton émis pour une autre
# application du même fournisseur est refusé.
quarkus.oidc.token.audience=recallio-api
# Dev Services importe le même royaume que le compose (client PWA, rôle admin, alice et bob).
quarkus.keycloak.devservices.realm-path=../infra/keycloak/recallio-realm.json
quarkus.keycloak.devservices.realm-name=recallio
# Port fixe en dev : la PWA doit connaître l'adresse de Keycloak (VITE_OIDC_AUTHORITY).
%dev.quarkus.keycloak.devservices.port=8180
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:recallio-backend}

# --- Autorisations HTTP -----------------------------------------------
# Tout est authentifié par défaut ; la santé, le catalogue et (hors prod) /q/* sont publics.
quarkus.http.auth.permission.public.paths=/api/v1/health,/api/v1/health/*,/api/v1/themes,/api/v1/themes/*
quarkus.http.auth.permission.public.policy=permit
%dev,test.quarkus.http.auth.permission.tooling.paths=/q/*
%dev,test.quarkus.http.auth.permission.tooling.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# --- OpenAPI (code-first, voir ADR 0003) ------------------------------
# La spec est écrite au build dans src/main/openapi/ et committée : elle sert à générer
# le client TypeScript du frontend. La CI vérifie qu'elle est à jour.
quarkus.smallrye-openapi.store-schema-directory=src/main/openapi
quarkus.smallrye-openapi.info-title=Recallio API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de révision des entretiens techniques par répétition espacée.
quarkus.smallrye-openapi.security-scheme=jwt
# Pas de "servers" déduits du port local : la spec doit être identique partout.
quarkus.smallrye-openapi.auto-add-server=false
quarkus.smallrye-health.openapi.included=true

# --- Contenu ----------------------------------------------------------
# En dev, tous les documents de référence (un par sujet) sont importés à chaque démarrage (l'import est idempotent).
# En production, l'import passe par POST /api/v1/admin/content-imports (rôle admin), un document à la fois.
%dev.recallio.content.import-on-startup=true
%dev.recallio.content.source-directory=../content/source

# --- Révision (FSRS, voir ADR 0011) -----------------------------------
# Nouvelles cartes par jour, dans le fuseau de l'utilisateur ; probabilité de se souvenir visée.
recallio.review.new-cards-per-day=20
recallio.review.desired-retention=0.9
# Un quota bas en test permet de vérifier la limite avec le petit document d'exemple.
%test.recallio.review.new-cards-per-day=3

# --- Gamification (voir ADR 0012) --------------------------------------
# Points par carte révisée (quelle que soit la note), objectif quotidien du streak et son bonus.
recallio.gamification.points-per-review=10
recallio.gamification.daily-goal=10
recallio.gamification.daily-goal-bonus=50
# Objectif bas en test : il est atteint avec le petit document d'exemple.
%test.recallio.gamification.daily-goal=2
