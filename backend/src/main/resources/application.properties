quarkus.application.name=recallio-backend

# --- Logs et erreurs (ADR 0070) -------------------------------------------
# Logs JSON hors dev et test (le compose local, en profil prod, les a aussi) : une ligne par événement, que le serveur
# filtre par service. En dev et en test, la console reste lisible. Jamais de donnée personnelle ni de jeton dans un log
# (CLAUDE.md, section 4.3).
%dev,test.quarkus.log.console.json.enabled=false
quarkus.log.console.json.additional-field.service.value=backend
# Dans tous les profils, chaque ligne de la console passe par SensitivePathsLogFilter : le jeton d'une invitation,
# l'adresse d'un profil public et toute chaîne de requête y sont masqués, comme chez Sentry. Le gestionnaire d'erreurs de
# Quarkus écrit sinon l'adresse complète d'une requête en échec.
quarkus.log.console.filter=sensitive-paths
# Les erreurs dans Sentry : allumé si SENTRY_DSN est donné, éteint sinon (SentryActivation), et jamais en dev ni en
# test. Les événements à partir d'ERROR, les fils d'Ariane à partir de WARN ; sans traces de performance. Les adresses
# qu'un événement recopie sont masquées avant l'envoi (SentryEventScrubber).
%prod.quarkus.log.sentry.dsn=${SENTRY_DSN:}
quarkus.log.sentry.environment=${SENTRY_ENVIRONMENT:production}
quarkus.log.sentry.release=${SENTRY_RELEASE:}
quarkus.log.sentry.level=WARN
quarkus.log.sentry.minimum-event-level=ERROR
quarkus.log.sentry.minimum-breadcrumb-level=WARN
quarkus.log.sentry.in-app-packages=com.recallio

# --- Santé -------------------------------------------------------------
# Exposée sous l'API versionnée ; le chemin absolu évite le préfixe /q.
quarkus.smallrye-health.root-path=/api/v1/health

# --- Base de données ---------------------------------------------------
# En dev et en test, Dev Services démarre PostgreSQL (Docker) automatiquement.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
# Les messages d'erreur de PostgreSQL recopient des valeurs (« Key (handle)=(alice) already exists ») : en production,
# le pilote ne les reprend ni dans ses exceptions ni dans ses logs (ADR 0070).
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.logServerErrorDetail=false

# Le schéma est géré uniquement par Flyway, jamais généré par Hibernate.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.statement-batch-size=100
# Les colonnes JSON (choix d'un QCM) ont leur propre format, indépendant de celui de l'API REST : une évolution du
# JSON exposé ne doit pas changer ce qui est stocké.
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true

# --- Authentification (OIDC) ------------------------------------------
# Le backend valide des JWT (bearer). En dev et en test, Dev Services démarre Keycloak.
quarkus.oidc.application-type=service
# Le jeton doit être destiné à l'API (mapper d'audience du royaume) : un jeton émis pour une autre
# application du même fournisseur est refusé.
quarkus.oidc.token.audience=recallio-api
# Dev Services importe le même royaume que le compose (client PWA, rôle admin, alice et bob).
quarkus.keycloak.devservices.realm-path=../infra/keycloak/recallio-realm.json
quarkus.keycloak.devservices.realm-name=recallio
# Port fixe en dev : la PWA doit connaître l'adresse de Keycloak (VITE_OIDC_AUTHORITY).
%dev.quarkus.keycloak.devservices.port=8180
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:recallio-backend}

# --- Autorisations HTTP -----------------------------------------------
# Tout est authentifié par défaut ; la santé, le catalogue, les profils publics (ADR 0043), la visite de la page
# publique (ADR 0064), le plan du site (ADR 0065) et (hors prod) /q/* sont publics.
quarkus.http.auth.permission.public.paths=/api/v1/health,/api/v1/health/*,/api/v1/subjects,/api/v1/subjects/*,/api/v1/themes/*,/api/v1/public-profiles/*,/api/v1/funnel/visits,/api/v1/sitemap.xml
quarkus.http.auth.permission.public.policy=permit
%dev,test.quarkus.http.auth.permission.tooling.paths=/q/*
%dev,test.quarkus.http.auth.permission.tooling.policy=permit
# Un navigateur ne peut pas ajouter d'en-tête Authorization à un WebSocket : la PWA transmet le jeton dans le
# sous-protocole (« quarkus-http-upgrade#Authorization#Bearer ... »), que Quarkus replace en en-tête avant la
# vérification (ADR 0021).
quarkus.websockets-next.server.propagate-subprotocol-headers=true
quarkus.websockets-next.server.supported-subprotocols=bearer-token-carrier
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# --- OpenAPI (code-first, voir ADR 0003) ------------------------------
# La spec est écrite au build dans src/main/openapi/ et committée : elle sert à générer
# le client TypeScript du frontend. La CI vérifie qu'elle est à jour.
quarkus.smallrye-openapi.store-schema-directory=src/main/openapi
quarkus.smallrye-openapi.info-title=Recallio API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de révision des entretiens techniques par répétition espacée.
quarkus.smallrye-openapi.security-scheme=jwt
# Pas de "servers" déduits du port local : la spec doit être identique partout.
quarkus.smallrye-openapi.auto-add-server=false
quarkus.smallrye-health.openapi.included=true

# --- Contenu ----------------------------------------------------------
# En dev, tous les documents de référence et tous les dossiers de sujet (ADR 0026) sont importés à chaque démarrage
# (l'import est idempotent). En production aussi : le contenu voyage dans l'image du backend, dont le Dockerfile active
# l'import et donne ses deux dossiers (ADR 0069). POST /api/v1/admin/content-imports (rôle admin) importe en plus un
# document à la demande.
%dev.recallio.content.import-on-startup=true
%dev.recallio.content.source-directory=../content/source
%dev.recallio.content.subjects-directory=../content

# --- Référencement (ADR 0065) -------------------------------------------
# L'origine publique du site (https://recallio.fr, par exemple) : les adresses du plan du site sont absolues. Une barre
# finale est retirée. Obligatoire en production : sans PUBLIC_ORIGIN, le démarrage échoue. En dev, celle de Vite ; en
# test, une origine reconnaissable, avec une barre finale que le plan doit retirer.
%prod.recallio.public-origin=${PUBLIC_ORIGIN}
%dev.recallio.public-origin=http://localhost:5173
%test.recallio.public-origin=https://recallio.test/

# --- Révision (FSRS, voir ADR 0011) -----------------------------------
# Nouvelles cartes par jour et par sujet (ADR 0048), dans le fuseau de l'utilisateur ; probabilité de se souvenir visée.
recallio.review.new-cards-per-subject-per-day=20
recallio.review.desired-retention=0.9
# Un quota bas en test permet de vérifier la limite avec le petit document d'exemple.
%test.recallio.review.new-cards-per-subject-per-day=3
# Révision intensive (ADR 0078, 0079) : les réponses qu'un compte sans Plus fait corriger par jour, dans son fuseau.
recallio.review.drill-free-answers-per-day=20
# Une limite basse en test : elle s'atteint en quelques réponses.
%test.recallio.review.drill-free-answers-per-day=4

# --- Gamification (voir ADR 0012 et 0035) ------------------------------
# L'unité de l'XP : celle d'une question de cours, quelle que soit la note (les autres formats en sont des multiples),
# puis l'objectif quotidien du streak et son bonus.
recallio.gamification.xp-per-review=10
recallio.gamification.daily-goal=10
recallio.gamification.daily-goal-bonus=50
# Objectif bas en test : il est atteint avec le petit document d'exemple.
%test.recallio.gamification.daily-goal=2

# Mode live (ADR 0022) : dix QCM par partie, 20 secondes pour répondre, 5 pour lire la correction.
recallio.live.questions-per-game=10
recallio.live.min-questions=3
recallio.live.question-seconds=20
recallio.live.reveal-seconds=5
# En test, une partie courte et rapide : trois questions, sur le document « quiz » qui en compte quatre.
%test.recallio.live.questions-per-game=3
%test.recallio.live.question-seconds=2
%test.recallio.live.reveal-seconds=1

# --- Rappels (ADR 0047) ----------------------------------------------
# Les clés VAPID sont des secrets : variables d'environnement en production. Absentes, une paire éphémère est tirée.
%prod.recallio.push.vapid-public-key=${RECALLIO_PUSH_VAPID_PUBLIC_KEY:}
%prod.recallio.push.vapid-private-key=${RECALLIO_PUSH_VAPID_PRIVATE_KEY:}
%prod.recallio.push.subject=${RECALLIO_PUSH_SUBJECT:mailto:admin@localhost}
# En test, aucun minuteur : les tests appellent l'envoi eux-mêmes.
%test.recallio.push.reminders-enabled=false

# --- Exercices de code : le runner (ADR 0030) ---------------------------
# Le service qui exécute le code des joueurs dans des conteneurs jetables. En dev, lancé à part
# (`cd runner && ./mvnw quarkus:dev`) ; sans lui, rendre un exercice répond 503. Le délai de lecture couvre le délai du
# bac à sable (30 s, ADR 0061) et une marge.
quarkus.rest-client.runner.url=${RECALLIO_RUNNER_URL:http://localhost:8090}
quarkus.rest-client.runner.connect-timeout=2000
quarkus.rest-client.runner.read-timeout=40000
# Le jeton partagé avec le runner : par variable d'environnement en production, une valeur locale en dev et en test.
%prod.recallio.runner.token=${RECALLIO_RUNNER_TOKEN}
%dev,test.recallio.runner.token=dev-token-du-runner-a-ne-jamais-deployer
